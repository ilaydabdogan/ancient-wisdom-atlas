canonical_text:
  quote: ''
  summary: Two Alcheringa narratives are presented. In the first, the opossum men
    Iltjerkna and Illinja interact over Illinja's eating of allia seed; a mark on
    the opossum, a man arising from stored seed, killing and dismemberment, a journey
    marked by trees, and the formation of an oknanikilla are described. In the second,
    the emu woman Arinpipa lays eggs from which three men emerge; after her descent
    into the ground, an old emu man steals some of their Churinga, and the men repeatedly
    dive through the ground to distant places before forming an emu oknanikilla.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Iltjerkna, an old opossum man from Injinminja, meets Illinja, another opossum
    man who has gathered, ground, and roasted allia seed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Illinja tastes the roasted allia with his thumb, rubs the thumb down his chest,
    and this action is given as the origin of a brownish mark on the opossum.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Iltjerkna warns Illinja not to eat much allia and sings with him in an attempt
    to reduce Illinja's eating.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the night Iltjerkna performs Intichiuma and sees another man who has
    arisen from the allia set aside.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Iltjerkna strikes the man who arose from the allia with a Churinga, killing
    him, and the body is cut into pieces and thrown in different directions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Illinja considers directions of travel, starts walking, halts three times,
    and a tree arises at each halt.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Illinja climbs the hill Ania-ania, erects a Churinga so that a plum-tree arises,
    strikes the rock to make a hole, and he and Iltjerkna enter it, forming an oknanikilla.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that in the Alcheringa, opossum men of this time ate allia
    seed rather than opossum.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Arinpipa, an old emu woman, lays eggs from which Ullabaya, Quaral-ilpinna,
    and Allunganmerra emerge as men.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Arinpipa dies and goes into the ground carrying her Churinga.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When Ingarbigwa approaches the camp, the three men hide in a hollow tree because
    they fear he may take their Churinga.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Ingarbigwa later steals eight of the men's Churinga and leaves four behind.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the theft, the three men dive into the ground and emerge at several
    named places before remaining at Munkitera and forming an oknanikilla.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that Munkitera is in Warramunga country and that two Warramunga
    men have charge of the place.
  category: relationship
  evidence_refs:
  - ev:8
