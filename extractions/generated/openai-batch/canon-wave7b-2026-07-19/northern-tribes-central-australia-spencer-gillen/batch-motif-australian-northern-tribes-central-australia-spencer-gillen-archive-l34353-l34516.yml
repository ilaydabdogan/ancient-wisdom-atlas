    groups. Entries include subclass and kinship terms, names for sacred ceremonies
    and ceremonial objects, totemic animal names, mourning and mortuary terms, initiation-status
    terms, bull-roarer sound explanations, celestial phenomena, and a term for the
    mythic ancestral past.
