canonical_text:
  quote: ''
  summary: The passage recounts an old Kumara man associated with the Idnimita totem
    who eats idnimita, performs ceremonies that produce grubs, later becomes ill and
    dies, and is represented by stones through which people pass during present-day
    Intichiuma. It then describes present-day restrictions on eating totemic animals
    or plants, special restrictions for the water totem, permission rules for strangers,
    and regional comparisons among Kaitish, Arunta, Unmatjera, Warramunga, Tjingilli,
    Umbaia, Gnanji, Mara, Anula, and Binbinga practices and traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old Kumara man tells Unthurkapunda that he has been eating idnimita/idniniitar,
    and another old man says that if he always eats it, it might all die.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kumara man performs sacred ceremonies of the Idnimita totem in more than
    one place, gathers idnimita, returns to camp, performs another ceremony, and sends
    a man to secure grubs that arose after the ceremonies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Kumara man later paints himself with down, performs Intichiuma, and goes
    out to collect grubs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After collecting more grubs, the Kumara man develops boils, becomes unable
    to walk, grows thin, his throat closes, and he bursts open and dies before daylight.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: During present-day Intichiuma, people pass between stones that represent the
    legs of the old Kumara man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The authors state that, as far as they could ascertain, the old man's death
    was not caused by the fact that he ate idnimita.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the present day, except for ceremonial eating during Intichiuma, the totemic
    animal or plant is strictly taboo to members of the totemic group.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Among the Kaitish, a stranger entering the country of a particular totem must
    ask the local headman before eating the animal or plant.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Men of the water totem are ordinarily not allowed to draw water for themselves
    when in camp or on the march with other men, but must receive it from members
    of the other moiety and another totem.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: At Anira, a stranger must ask the Kumara man for permission to drink, after
    which the Kumara man tells Mulyanuka men to give the stranger water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The natives say that if permission to drink at Anira were not asked, the headman
    of the totem would 'bone' the stranger.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: In tribes north of the Kaitish, the totemic animal or plant is strictly taboo
    to members of the totemic group, and ceremonial eating at Intichiuma is not found.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage states that Warramunga, Tjingilli, Umbaia, and Gnanji totemic
    groups, like Kaitish and Unmartjera groups, are supposed to be responsible for
    perpetuating the material object whose name they bear.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Among the coastal Mara, Anula, and Binbinga, the taboo is equally strict,
    ceremonial eating of the totem is absent, and only occasional traces of Intichiuma
    ceremonies are reported.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The passage says that Arunta, Kaitish, and Unmatjera traditions often refer
    to Alcheringa ancestors feeding on their totemic animals, while such references
    are scarce among Warramunga and northern tribes, with the Itjilpi ant women given
    as an occasional Warramunga example.
  category: relationship
  evidence_refs:
  - ev:10
