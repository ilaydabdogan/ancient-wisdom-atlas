canonical_text:
  quote: ''
  summary: A pair of brothers emerge from shells without parents, travel north, grow
    into youths, and receive stone knives sent from the sky by Atnatu. They circumcise
    and subincise themselves, and their blood forms creek beds and a waterhole. As
    initiated men they travel, initiate and transform other beings, wash their knives
    at a rock-hole, avoid a snake that sheds its skin, and finally lie down on their
    sacred Churinga so that the water-place will not become taboo; they die and two
    stones mark the spot.
  language: English
  quote_policy: summarized
