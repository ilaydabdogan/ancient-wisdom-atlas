  text: After discussing directions, the brothers set off toward the north.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: As they travelled, the brothers gradually increased in size, and by the hill
    called Karrarinia their pubic hairs were beginning to appear.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Along the way they met incomplete human beings called inter-intera, who were
    trying to pull their foreskins back.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A great being called Atnatu dwelt in the sky, had a black face, and had no
    anus.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Atnatu looked down and saw the two boys searching for rats and trying to pull
    their foreskins back to become young men.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Atnatu sent down large leilirra, stone knives, which the elder and younger
    brother each used to cut himself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The brothers sat opposite each other and performed subincision; the elder
    brother's blood flowed across the Barrow Creek flats and carved out a creek bed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The younger brother's blood flowed northwest, made a little creek, spread
    out at Kopertanda, made a waterhole, and flowed on.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: After becoming fully initiated men, the two brothers travelled and performed
    initiation rites on groups of men and women.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The brothers initiated little bird people called Lintjalinga, who were singing
    and trying to circumcise themselves with a fire-stick.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The brothers made a wailpa or cutting ground in the camp of people with extremely
    small mouths, transformed them into complete men and women, and initiated them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: At a rock-hole full of water on the side of Aniania hill, the brothers washed
    blood-stains from their knives with water taken into their mouths.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: A big snake came out of its hole and cast its skin; the brothers walked away,
    saying it might bite them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The brothers carried leilirra in their waist-girdles and sacred Churinga under
    their armpits, on their shoulders, and in their hands close to their stomachs.
  category: object
  evidence_refs:
  - ev:7
- id: obs:17
  text: The elder brother said that if they knelt or stood, their Churinga would be
    seen, the place would become taboo, and people would not be able to drink there.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:18
  text: The brothers lay down upon their Churinga, died, and two great stones arose
