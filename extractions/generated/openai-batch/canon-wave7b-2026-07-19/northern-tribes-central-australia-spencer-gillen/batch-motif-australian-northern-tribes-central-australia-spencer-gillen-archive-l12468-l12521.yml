canonical_text:
  quote: ''
  summary: The passage describes a secluded Erlipinna or grass-seed totem ceremony
    near Barrow Creek. A single old Thungalla man, identified as head of the totem,
    performs with red-and-white down body designs representing grass seed before and
    after grinding and cooking. He kneels in a cleared space, sways while holding
    green mulga twigs, and the ceremony ends when one or two audience members press
    his head down.
