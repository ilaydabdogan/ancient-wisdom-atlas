canonical_text:
  quote: ''
  summary: The passage describes water and rain-making Intichiuma procedures, including
    singing water, spitting water, a rain bird and water-hole snake associated with
    rainbow and rain, and a ritual using a living snake and an imitation rainbow.
    It then reviews Intichiuma ceremonies among several central Australian tribes,
    emphasizing restricted participation, ancestral places, bloodletting at a stone
    to increase totemic animals, and formal permission to eat the increased totemic
    food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Mungaia is equivalent to Alcheringa and that mungai
    can refer to a totem or a place specially associated with a totemic ancestor.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a pool, the performer checks that no women or strangers are in sight before
    beginning the water procedure.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The performer bends over the water, sings it, drinks some, spits it out in
    different directions, throws water over himself, scatters water around, and returns
    quietly to camp; rain is then expected.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Upintjara is described as a particular rain-making place with a water-hole
    in a creek bed.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Mungaia times, Mumbakuaku, the dollar bird or rain bird, first made rain
    at Upintjara.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The rain bird had a mate named Gnurulia, a snake who lived in the water-hole.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the snake wanted rain, it spat upward into the sky; a rainbow appeared,
    followed by clouds and rain.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The bird and the snake are both said to belong to the Awukaria class.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: A man of the Mumbakuaku totem can make rain at Upintjara by singing the bird's
    Mungaia spots, one on each side of the water-hole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The rain-making man places a live snake into the water-hole, holds it under
    for a time, removes it, kills it, and lays it beside the creek.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The man makes an arched bundle of grass stalks tied with fur-string as an
    imitation rainbow and sets it over the snake.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: After singing over the snake and the imitation rainbow, rain is said to fall
    sooner or later.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: Women may not go near the Upintjara water-hole, and men outside the Awukaria
    moiety have restricted access to drinking there until old age, while Awukaria
    men may drink freely.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: The passage states that any man can stop rain by warming a green stick in
    fire and striking it against the wind.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The authors describe Intichiuma in these tribes as a series of stages from
    fully developed ceremonies in central tribes to nearly vestigial forms near the
    Gulf of Carpentaria.
  category: other
  evidence_refs:
  - ev:6
- id: obs:16
  text: Among Arunta and Ilpirra groups, only men of the totem may be present at or
    prepare the Intichiuma ceremony, which is performed at places associated with
    the Alcheringa history of the totemic group.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:17
  text: In one kangaroo-totem example, blood from young men of the totem is allowed
    to flow over a stone associated with kangaroo ancestors.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: The stated purpose of the blood-on-stone act is to send kangaroo spirits out
    from the stone so they can enter kangaroos and replenish the animals.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:19
  text: After the animal or plant becomes abundant, men of all classes and totems
    bring supplies to the men's camp; the totem headman eats a little and hands the
    remainder to men of other totems, saying they may eat freely.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:20
  text: The passage says the headman must eat a little on this occasion, or he is
    believed to lose the power to perform Intichiuma successfully.
  category: other
  evidence_refs:
  - ev:7
- id: obs:21
  text: In the Urabunna account, the totemic headman is responsible for ceremonies
    that increase his totem, may not eat it, and gives non-totem men permission to
    eat it after the ceremony.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:22
  text: In the Unmatjera and Kaitish account, a totem headman, sometimes with elder
    men, performs a special ceremony; the water-totem headman visits an ertnatulunga
    and decorates his body and a shield, while the grass-seed headman carries a Churinga
    and sings the grass to make it grow and seed.
  category: sequence
  evidence_refs:
  - ev:9
