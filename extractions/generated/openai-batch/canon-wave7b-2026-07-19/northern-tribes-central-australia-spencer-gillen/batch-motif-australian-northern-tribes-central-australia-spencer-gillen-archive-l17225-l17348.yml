candidate_motifs:
- id: motif:1
  label: Rain-making through song, water handling, and spitting
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage describes singing water, drinking and spitting water, throwing
    and scattering water, followed by expected rain.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The taxonomy reference is broad; the passage describes a specific ritual
    procedure rather than an abstract seasonal-cycle myth.
- id: motif:2
  label: Water-dwelling serpent linked to rainbow and rain
  taxonomy_refs:
  - serpent
  - seasonal_cycle
  basis: Gnurulia the snake lives in the water-hole and produces rainbow, clouds,
    and rain by spitting into the sky; a snake is also central to the later rain-making
    rite.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage identifies the being as a snake and connects it to rain; broader
    serpent-motif implications should not be assumed without additional passages.
- id: motif:3
  label: Imitative rainbow object used in rain ritual
  taxonomy_refs:
  - seasonal_cycle
  basis: The rain-maker creates an arched grass bundle as an imitation rainbow, places
    it over the killed snake, and sings over both before rain falls.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage presents the imitation explicitly, but does not provide an
    emic explanation beyond its use in the rain ceremony.
- id: motif:4
  label: Totemic increase through blood at an ancestral stone
  taxonomy_refs:
  - sacrifice
  basis: Blood from young men of the kangaroo totem flows over a stone associated
    with kangaroo ancestors to send animal spirits out and replenish kangaroos.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage describes bloodletting but does not use the term sacrifice;
    the taxonomy reference should be reviewed.
- id: motif:5
  label: Formal first consumption and permission to eat after increase
  taxonomy_refs:
  - sacred_exchange
  basis: After abundance follows the Intichiuma ceremony, the headman eats a little
    and hands the remainder to men of other totems, permitting them to eat; the Urabunna
    variant also involves permission by the headman.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage frames this as a ritual rule around totemic food; 'sacred
    exchange' is a comparative label requiring review.
- id: motif:6
  label: Singing growth into being with sacred object and designs
  taxonomy_refs:
  - seasonal_cycle
  basis: The grass-seed totem head carries a Churinga and sings the grass to make
    it grow and produce seed; the water-totem head decorates body and shield before
    a related ceremony.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: Only a brief procedural summary is provided for these ceremonies.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares Intichiuma ceremonies across several tribes
    as functionally related forms ranging from fully developed central ceremonies
    to nearly vestigial Gulf-area forms.
  claim_level: same_function
  target: Intichiuma ceremonies among Arunta, Ilpirra, Urabunna, Unmatjera, Kaitish,
    and Gulf of Carpentaria-area tribes
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The excerpt gives detailed examples only for some groups and summarizes
    the larger sequence in the authors' typological language.
- id: claim:2
  claim: The passage compares Upintjara water-hole restrictions with the Warramunga
    Tjinqurokora black-snake water-hole and notes an opposite pattern of drinking
    rights by totem or moiety.
  claim_level: same_function
  target: Warramunga Tjinqurokora water-hole associated with the black-snake totem
  evidence_refs:
  - ev:5
  - ev:10
  counter_evidence_refs:
  - ev:10
  confidence: medium
  limitations: The comparison is limited to access and drinking rules; the excerpt
    does not provide a full Tjinqurokora ceremony.
- id: claim:3
  claim: The Arunta/Ilpirra and Urabunna accounts share the function of a totemic
    headman authorizing others to eat after an increase ceremony, but differ on whether
    the headman himself may or must eat the totem.
  claim_level: same_function
  target: Totemic headman authorization in Arunta/Ilpirra and Urabunna Intichiuma
    accounts
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs:
  - ev:8
  confidence: medium
  limitations: The comparison is internal to the ethnographic passage and should not
    be extended to historical relationship or origin.
