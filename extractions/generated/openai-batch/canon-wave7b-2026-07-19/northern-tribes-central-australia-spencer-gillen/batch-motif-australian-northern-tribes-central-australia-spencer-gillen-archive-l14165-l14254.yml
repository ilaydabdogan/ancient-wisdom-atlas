canonical_text:
  quote: ''
  summary: The passage describes several Wollunqua totem ceremonies, including a performance
    in which a curved bundle represents the Wollunqua snake, a ritual construction
    of the Mini-imburu mound by Kingilli men, the exclusion of Uluuru men during construction,
    chants about the Wollunqua, and the later approach of Uluuru elders who circle
    the mound, touch the ground around it with a gum bough, receive an explanation,
    and are told that the Wollunqua and the mound belong to them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A curved bundle is identified as representing the Wollunqua snake in a ceremony
    connected with the Wollunqua totem.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the ceremony, one performer represented a large sand-hill called Mindala
    and another personated the snake itself.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The three ceremonies mentioned were performed on three consecutive days, followed
    by a three-day interval during which Kingilli moiety ceremonies were performed
    under Uluuru charge.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the fourth day, Kingilli men, guided by an old Tjupila man of the Worgaia
    tribe, built a sandy earth mound called Mini-imburu.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Uluuru men were not allowed near the place where the Kingilli men worked,
    and the mound was enclosed and hidden by two brakes of boughs.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The builders dug a north-south trench, filled it with sand mixed with water,
    patted it down, and formed a keel-shaped mound about two feet high.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The mound surface had two long wavy bands meeting at both ends, a round swelling
    at the northern end for the head, and a short median prolongation at the southern
    end for the tail.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The double band indicated the body of the Wollunqua and was covered with red
    down, while the rest of the mound surface was covered with white down.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The mound itself was described as emblematic of the sand-hill by which the
    snake stood up and looked around.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: While working, the Kingilli men sang chants referring to the Wollunqua, its
    wanderings, and its going down into the ground.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The sung refrains are said to have no recent meaning and to belong to the
    Wingara.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the mound was completed, word was sent to the elder men of the Uluuru
    moiety that all was ready.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The text says the mound really belonged to the Uluuru men, although custom
    prevented them from approaching the sacred ground during construction.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Escorted by an old Tjupila man, the Uluuru approached in single file while
    Kingilli men stood around.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Uluuru, led by the old Tjapeltjeri man who was head of the Wollunqua totem,
    walked repeatedly around the mound.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: One Uluuru man took a gum bough and stroked the ground all around the base
    of the mound.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The Tjupila man of the Worgaia tribe explained the mound’s meaning to the
