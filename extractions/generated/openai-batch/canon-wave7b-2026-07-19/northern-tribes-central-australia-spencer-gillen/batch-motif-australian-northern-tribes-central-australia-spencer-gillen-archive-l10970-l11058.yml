canonical_text:
  quote: ''
  summary: The passage describes Urabunna beliefs about spirit individuals derived
    from ancestral totemic ancestors, their repeated reincarnation, and their return
    after death to an Alcheringa place. It contrasts Urabunna and northern tribal
    rules for spirit-child entry, gives an example of an emu-totem Kirarawa man whose
    spirit can enter only a Matthurie woman in the next incarnation, and states that
    sex, moiety, and totem change through successive reincarnations. It also notes
    related beliefs among the Warramunga and Wonkgongaru, mentions imperfect former
    human beings in the Wonkgongaru, and describes Urabunna totem groups performing
    Intichiuma ceremonies and observing a prohibition on eating their own totem animal
    or plant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Urabunna are described as having two moieties, Kirarawa and Matthurie,
    no subclasses, and descent counted in the female line.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Urabunna people believe in spirit individuals derived
    from ancestral totemic ancestors and repeatedly undergoing reincarnation.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Every living individual is described as the reincarnation of a mai-aurli,
    a spirit said to have emanated from the body of an Alcheringa ancestor.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: In tribes north of the Arunta, descent of class and totem is described as
    paternal, and a spirit child is said to enter only a woman who is wife of a man
    of the same moiety and totem as the spirit.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Urabunna account, a child must belong to the same moiety and totem
    as its mother, while in each successive reincarnation the child changes sex, moiety,
    and totem.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The example describes a Kirarawa man of the emu totem dying; his dead-man
    spirit, called kumpira, returns to the Alcheringa place where it had been left
    by an ancestor.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The spirit of the former Kirarawa emu man is said not to enter a Kirarawa
    woman; if it did, it would be born prematurely and die or would cause the mother's
    death.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:8
- id: obs:8
  text: In the example, the reincarnating spirit can enter only a Matthurie woman
    of another totem, so the individual changes moiety and totem.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that the reincarnating individual also changes sex, a belief
    also reported for the Warramunga tribe.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: Every individual is said to return after death in spirit form to the spot
    where it was left in the Alcheringa by the ancestor of the totem.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: 'A pigeon spirit is used as an example: it returns into the rocks at the place
    where pigeon ancestors performed ceremonies in the Alcheringa and left spirits
    behind.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Over time, a single individual is said to be able to pass through all the
    totems, alternating from side to side of the tribe, while always returning at
    death to its original home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: A sequence is given in which a Kirarawa man has Matthurie children, is reincarnated
    as a Matthurie woman whose children are Matthurie, and then is reincarnated again
    as a Kirarawa man.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: The Wonkgongaru, described as a closely allied tribe with the same two moieties,
    are said to have beliefs identical with those of the Urabunna.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: The Wonkgongaru, unlike the Urabunna, are said to believe in former imperfectly
    formed human beings similar to the Arunta inapertwa or incomplete men.
  category: other
  evidence_refs:
  - ev:6
- id: obs:16
  text: Urabunna totem-group members are said to be responsible for producing the
    animal or plant after which the group is named, and they perform Intichiuma ceremonies
    for this end.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: No member of a totemic group eats the totem animal or plant, but a member
    may kill it and hand it to men outside the totemic group to eat.
  category: action
  evidence_refs:
  - ev:7
