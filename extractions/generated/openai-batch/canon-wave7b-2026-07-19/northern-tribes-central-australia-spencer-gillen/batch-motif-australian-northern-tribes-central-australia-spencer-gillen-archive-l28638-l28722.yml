canonical_text:
  quote: ''
  summary: The passage summarizes several Central Australian accounts of the moon.
    It begins with a tabooed tree associated with opossums, then gives Arunta, Kaitish,
    and Warramunga moon traditions. In these accounts the moon is connected with an
    opossum man, an old man at Urnta, the Purula man Pulla who steals women and teaches
    marriage-class rules, and a Warramunga moon man who revives a burned woman with
    his blood after hawks discover fire. The passage also notes that no moon myths
    were found among the Tjingilli, Binbinga, and Umbaia by the authors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Everything on the referenced tree is tabooed; no animal may be killed on or
    near it, and eating an opossum from the tree is said to burn a person's inward
    parts and cause death.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Arunta account, the moon is associated with the opossum totem and was
    originally an opossum man carried in a shield by another old opossum man.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A grass-seed man stole the Arunta moon figure; when the old opossum man could
    not overtake him, he told the moon to go up into the sky, where the moon remained.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In one Kaitish account, the moon, called Arilpa, sat down as a very old man
    at Urnta; a stone arose to mark the place, and he is said to be visible in the
    moon carrying a tomahawk.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In another Kaitish account, the moon first appeared as a Purula man named
    Pulla, who stole women from different named groups, had children by them, and
    abandoned them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Pulla later lived at Ariltha-unina with many wives and instructed tribal men
    about the proper wife for each class of men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Pulla settled at Kulla Kulla with one Uningamara wife; after she died, a stone
    arose to mark the spot.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When Okinja-allungara tried to steal a woman from the moon man's camp, Pulla
    caught and killed him with a tomahawk, then went up into the sky and is said to
    be visible in the moon with uplifted tomahawk.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Warramunga account, the moon first walked on earth as a man and camped
    near a water-hole at the foot of a hill in the Murchison Range.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Warramunga moon man called to a woman, and they sat down together talking
    near his camp.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Two hawks nearby had just discovered how to make fire for the first time,
    but they set the country on fire.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The fire surrounded the moon man and the woman and severely burned the woman;
    the moon man cut a vein, sprinkled his blood over her, restored her to life, and
    both went up into the sky.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The authors state that they did not find moon myths among the Tjingilli, Binbinga,
    and Umbaia.
  category: other
  evidence_refs:
  - ev:9
