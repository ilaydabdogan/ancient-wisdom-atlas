candidate_motifs:
- id: motif:1
  label: Moon as earthly being ascending to the sky
  taxonomy_refs:
  - ascent
  basis: Arunta, Kaitish, and Warramunga accounts all describe moon figures first
    on earth and then going up into the sky or being visible in the moon.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:8
  confidence: high
  cautions: The details vary substantially among the tribal accounts, and some nearby
    groups are reported as lacking discovered moon myths in this source.
- id: motif:2
  label: Totemic animal-person moon origin
  taxonomy_refs: []
  basis: The Arunta account associates the moon with the opossum totem and says he
    was originally an opossum man.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not describe a transformation sequence from opossum into
    moon beyond the summary that the moon was originally an opossum man and ascended.
