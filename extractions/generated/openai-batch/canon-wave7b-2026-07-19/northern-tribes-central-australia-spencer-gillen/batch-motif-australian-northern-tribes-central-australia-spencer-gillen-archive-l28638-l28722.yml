comparison_claims:
- id: claim:1
  claim: Within the passage, Arunta, Kaitish, and Warramunga traditions share a broad
    pattern in which the moon is first a terrestrial being and is later located in
    the sky or visible in the moon, while differing in details such as opossum association,
    wife-taking, weapon imagery, and blood restoration.
  claim_level: same_motif
  target: Terrestrial moon-being ascent pattern across Arunta, Kaitish, and Warramunga
    accounts in the passage
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:8
  counter_evidence_refs:
  - ev:9
  confidence: medium
  limitations: The passage also states that the authors found no moon myths among
    the Tjingilli, Binbinga, and Umbaia; the accounts are brief ethnographic summaries
    and do not establish historical contact or common inheritance.
- id: claim:2
  claim: 'The Kaitish Pulla tradition contains repeated wife-stealing or woman-seizing
    actions with different outcomes: Pulla repeatedly takes women, while Okinja-allungara''s
    attempted seizure of a woman ends in his death.'
  claim_level: same_function
  target: Repeated woman-taking episodes within the Kaitish Pulla account
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an internal narrative pattern within one summarized tradition,
    not evidence of a broader comparative motif by itself.
- id: claim:3
  claim: The Warramunga episode links first fire-making by hawks with danger, injury,
    and subsequent restoration by the moon man's blood, forming a local pattern that
    joins fire origin, destructive spread, healing, and ascent.
  claim_level: same_function
  target: Fire discovery, burning, blood restoration, and ascent sequence in the Warramunga
    moon account
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage only briefly notes the hawks' discovery of fire and does
    not supply a full fire-origin cycle or a cross-tradition comparison.
