canonical_text:
  quote: ''
  summary: The passage introduces Intichiuma as totem-associated ceremonies intended
    to increase the supply of the totemic object, then describes Urabunna rain-making
    traditions and rites at Tjantjiwanperta near Mount Kingston. In an Alcheringa
    account, the rain ancestor Mutapatta uses gypsum to make clouds, rain beings move
    between earth and sky, an Arunta rain man steals four ceremonial down stripes,
    landscape features mark ancestral events, and later rain men enter the earth leaving
    spirit children. The passage ends with a description of the present-day headman’s
    rain-making regalia and performance.
  language: English
  quote_policy: summarized
