- id: obs:3
  text: In the Urabunna tribe the ceremonies are called pitjinta, and body decorations
    of performers are called pani-inta.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tjantjiwanperta, a water-hole near Mount Kingston, is described as a local
    centre of the rain totem where ceremonies are performed for making rain.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Alcheringa, Mutapatta, an old Kirarawa man of the rain totem, arose
    at Tjantjiwanperta with a little boy identified as his grandson.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mutapatta had gypsum, ground some of it finely, and threw it in all directions
    to make clouds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The clouds came down to earth as rain black-fellows, later went up into the
    sky as clouds, and rain fell filling the clay pans.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The same beings again came down to earth as men, travelled away, and periodically
    went into the sky as a long low bank of clouds.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: An old rain man from the Arunta country came down from the north and addressed
    the Urabunna rain man about seeing his lightning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Arunta man stole four of five down stripes worn by the Urabunna rain man,
    and the passage states that the Urabunna performer can therefore now wear only
    one.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Mount Kingston is said to have arisen to mark the tracks of the returning
    cloud men.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: The old Urabunna man took the cloud men on his back, with the grandson climbing
    to the top, and a cluster of boulders marks the spot.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: As they travelled, the beings repeatedly went into the sky in cloud form and
    made rain.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Another Urabunna rain man, Mintali, saw clouds appearing and disappearing
    and made rain men who went into the sky as clouds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The two clouds met and mixed; the men then went into Wonkgongaru country,
    entered the earth, and left many spirit children behind.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: At the present day the headman in charge of Tjantjiwanperta makes rain while
