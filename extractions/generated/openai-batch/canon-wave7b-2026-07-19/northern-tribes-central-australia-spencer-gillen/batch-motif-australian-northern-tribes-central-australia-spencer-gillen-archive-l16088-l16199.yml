- id: obs:1
  text: The term Intichiuma is used by the Arunta for totem-associated ceremonies
    whose object is to increase the supply of the material object named by the totemic
    group.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The authors use the name Intichiuma for equivalent ceremonies in other tribes
    while noting that the local terms vary.
  category: speech
  evidence_refs:
