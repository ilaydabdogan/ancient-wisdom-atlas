canonical_text:
  quote: ''
  summary: 'The passage discusses named superior or ancestral beings among the Kaitish
    and Warramunga, denying that they function as moral high gods. Tumana and Murtu-murtu
    are described as Alcheringa ancestors who invented the Churinga, while Atnatu
    is said to have made the Alcheringa but not to be a moral preceptor. The passage
    then lists injunctions placed on novices at initiation: obedience to elders, food
    restrictions and obligations, sexual and marital restrictions, and secrecy about
    totemic matters. The authors interpret these precepts as serving older men and
    state that they are not understood as sanctioned by a superior being.'
  language: English
  quote_policy: summarized
