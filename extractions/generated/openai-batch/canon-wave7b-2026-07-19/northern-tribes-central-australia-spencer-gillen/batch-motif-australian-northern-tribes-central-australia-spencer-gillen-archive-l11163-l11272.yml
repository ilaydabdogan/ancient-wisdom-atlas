canonical_text:
  quote: ''
  summary: The passage reports Unmatjera and Kaitish traditions about incomplete beings
    transformed into men and women by an old crow, Parenthie lizard men, and Ullakuppera
    little hawk boys; describes initiation operations, ancestral deaths marked by
    landscape features, classifications of totemic ancestors by form of origin, and
    contrasts these patterns with Arunta traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Unmatjera and Kaitish are said to have traditions about incomplete human
    beings called inmintera by the Unmatjera and compared in the passage to Arunta
    inapertwa.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old crow at Ungurla saw many inmintera and made them into men and women
    by separating their limbs with his bill.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old crow returned to his camp to get a stone knife with which to initiate
    the transformed beings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two Parenthie lizard men from the south arrived and performed circumcision
    and subincision on the men and atna-ariltha-kuma on the women.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the Parenthie men acted first, the old crow stayed at Ungurla, died
    there, and a big black stone arose to mark the spot.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: One Kaitish tradition says there were no human beings in the Alcheringa, only
    indefinitely shaped creatures called inter-intera or atnathera-thera.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Two Ullakuppera little hawk boys, named Thungalla and Umbitjana, are said
    to have been the boys to whom Atnatu sent sacred stone knives.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Ullakuppera boys transformed incomplete creatures into men and women by
    carving body parts, then circumcised and subincised the men and performed atna-ariltha-kuma
    on the women.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Ullakuppera boys travelled to the Bonny River, turned to Atnungara, lay
    down on top of their Churinga, died, and a big hill and waterhole arose to mark
    the spot.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Kaitish people say that lying on top of the Churinga, rather than placing
    them at the side, prevents the boys from undergoing reincarnation.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: A creek north of the Harts Range is described as a boundary between totemic
    ancestors first formed as incomplete beings on the southern side and those first
    formed as men on the northern side.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: Ancestors who originated in human form are described as closely related to
    the animals whose names they bear, regarded at first as semi-human, but also explicitly
    as men rather than incomplete beings transformed by other creatures.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage states that Kaitish traditions largely lack the Arunta pattern
    of companies of same-totem individuals walking across the country; Kaitish accounts
    more often involve two persons, an elder and younger brother, or a single individual.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: For Kaitish and Unmatjera, the peopling of various spots is attributed to
    one or two old totemic ancestors who either carried Churinga or had spirits emanate
    from their bodies.
  category: relationship
  evidence_refs:
  - ev:7
