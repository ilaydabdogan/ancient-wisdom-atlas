canonical_text:
  quote: ''
  summary: The passage explains a kinship chart and then describes, from the standpoint
    of a hypothetical Pungarinji man, how specific subclass names correspond to father,
    father’s sisters, wife’s mother, lawful wives, wife’s brothers, wife’s sisters,
    and other marriage-related categories. It also compares Binbinga, Warramunga,
    and Arunta rules concerning women called purnka.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chart uses right- and left-side brackets in columns 1 and 4 to mark the
    relationships called itinia and mimai-inna, with the placement reversed between
    the two columns.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The explanatory example assumes an individual who is a Pungarinji man and
    frames the relationships as if he were speaking.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: For the Pungarinji man, his father is a Tjuanaku man and is called kuni.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tjulantjuka are kukunia to the father and mimai-inna to the Pungarinji man;
    if they are women, he may not speak to them because they are described as mothers
    of his lawful wives.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Daughters of Thungallum men and Nurlum women are Yakomarina and karina to
    the Pungarinji man; they are women whom he may lawfully marry and may have been
    allotted to him as wives.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sons of Nurlum women, described as brothers of the speaker’s karina, are
    Yakomari men and are kaii-kaii to Pungarinji men, reciprocally.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Men whom the father calls elder or younger brothers are Tjuanaku men and are
    also kuni to the Pungarinji man, with terms distinguishing elder and younger father-brothers.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The father’s sisters are Niriuma and are itinia to the Pungarinji man.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Women whom the wife calls elder or younger sisters are Yakomarina and are
    also karina to the Pungarinji man.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Women whom the wife calls kukunia are Niamerum and purnka to the Pungarinji
    man; they are described as daughters of the father’s sisters.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Niamerum women marry Paliarinji men who are kukunia to the Pungarinji man;
    their children are Tjulantjuka and Nurlum, and the latter are mimai-inna to him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that the relationship mimai-inna arises from the marriage
    of female purnka and male kukunia.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: A footnote states that the Binbinga tribe has no special name corresponding
    to Arunta tualcha-mura for the actual mother of a woman allotted to a man.
  category: other
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that, for an Arunta man, Niamerum women called purnka would
    be strictly taboo as wives, while in the Binbinga and Warramunga it is lawful
    to have one or more such purnka women as wives in addition to karina women.
  category: relationship
  evidence_refs:
  - ev:9
