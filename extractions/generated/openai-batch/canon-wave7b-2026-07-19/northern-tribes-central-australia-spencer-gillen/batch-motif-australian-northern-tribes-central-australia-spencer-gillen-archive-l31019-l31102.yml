canonical_text:
  quote: ''
  summary: The passage describes construction, decoration, and wearing of fur-string
    head, forehead, and neck bands among central, northern, and coastal Australian
    groups. It notes pipe-clay and ochre decoration, human-hair ties, feather and
    tail-tip tassels, and a Mara man's forehead-band with pendants imitating flowers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A common central-tribes band is made from many strands of opossum fur-string
    tied at both ends, with strings for tying behind the head.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Moistened pipe-clay can make the strings form a flat band on which red and
    yellow ochre designs are painted.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In northern and coastal tribes, the band is described as more definite in
    form and made from thin strands of fur-string closely woven together.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A simpler coastal form has woven strands knotted at one side, tied with human-hair
    string, and decorated with pipe-clay and narrow red-ochre bands.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A more complicated forehead-band has the strands separated into two series
    and bound at the ends to form two loops, each with an attached tying string.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each loop of the complicated forehead-band has a pendant made from a string
    and beeswax, ending in an imitation flower with brown-feather petals and a down
    centre.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The authors state that this deliberate imitation of a natural object was well
    executed and was the only such example they had met with at that point, though
    they expected such decorated articles to be uncommon rather than unique.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The commonest Arunta neck-band is a single thick strand of fur-string coated
    with grease and red ochre, making a smooth surface.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Another neck-band form has four or five strands joined at both ends; the strands
    may form a flat band or be coiled upon one another.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Strings from the ends of the neck-band tie it around the neck, and the string
    ends are often ornamented with tassels of feathers, bird down, dingo tail-tips,
    or rabbit-bandicoot tail-tips attached to a central stick.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Neck-bands of this form are worn by both men and women, but ornamented examples
    are said to be more frequent on men.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage reports that in the coastal Binbinga, Anula, and Mara tribes,
    men often wear similar bands, and a note mentions similar objects from Alligator
    River and a specimen from the Macarthur River.
  category: relationship
  evidence_refs:
  - ev:7
