canonical_text:
  quote: ''
  summary: The passage describes male pubic tassels and waist-girdles, including materials,
    red ochre decoration, Mara terminology, shell and leafy variants, and a vegetable-fibre
    girdle endowed with evil magic and traded south. It also describes women’s aprons,
    including size variation, eligibility after a named ceremony, construction, materials,
    and red ochre covering.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pubic tassel is described as a mass of strings hanging from a central matted
    knob, partly enclosed with bees-wax and attached to the waist-girdle by one or
    more strings or by human hair-string in an exceptional form.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some tassel strings are ornamented with grease and red ochre; without this
    treatment they appear looser and more furry.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Mara tribe has separate names for pubic tassels according to whether they
    have no red ochre, a small amount, or a large amount.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men sometimes wear shell pubic ornaments during corrobborees, and coastal
    men commonly wear a bunch of leafy twigs suspended from the waist-girdle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Every man wears a waist-girdle; materials include human hair-string, opossum
    fur-string, and vegetable fibre, with distributions varying among southern, Warramunga,
    northern, and coastal tribes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A vegetable-fibre girdle is described as “sung,” meaning endowed with evil
    magic, and is traded south to the Kaitish and Arunta tribes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The magic-endowed girdle is used by men as a kind of knout, and a blow from
    it is supposed to have very evil effects upon a woman; among coastal tribes it
    is also used as a neck-band.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Women’s aprons vary in size and are said to be larger and more constantly
    worn in northern tribes than in southern tribes.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: A girl is not allowed to wear an apron until she has passed through the ceremony
    called atna-ariltha-kuma.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A woman’s apron is usually made of opossum fur-string, with a waist strand
    and pendent strands; rare examples are made of human hair-string, and all except
    the latter are covered with red ochre.
  category: object
  evidence_refs:
  - ev:5
