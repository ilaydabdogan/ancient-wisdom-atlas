canonical_text:
  quote: ''
  summary: The preface discusses prior ethnographic work on Australian Aboriginal
    organization and initiation, argues that other sacred ceremonies and beliefs may
    have been missed, notes beliefs in reincarnation of ancestral spirits and spirit-child
    conception, describes secrecy around ceremonies restricted to initiated members,
    and summarizes the preparation of a ceremony with down, pigments, blood, designs,
    and chanting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The authors state that earlier work had yielded knowledge about organization
    and initiation ceremonies, while other sacred ceremonies had not been seriously
    investigated.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that the idea of reincarnation of ancestral spirit individuals
    and customs such as Intichiuma are unlikely to be confined to the investigated
    area.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Roth's Queensland work is described as showing a widespread belief that spirit
    children enter women and that sexual intercourse is not necessarily connected
    with procreation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Central Australian ceremonies are carried on in secrecy
    and that only initiated members may attend and take part.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says an ordinary observer or traveller may learn about organization
    while knowing nothing about sacred or secret matters.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says that even a trusted investigator admitted to initiation ceremonies
    might miss totemic ceremonies unless present at the right time or making special
    inquiries.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A group of performers assemble on a ceremonial ground.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The performers bring down from birds or plants, grind it on flat stones, and
    mix it with pipe-clay or red ochre.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The performers draw blood from their veins, smear it on their bodies, and
    use it as a gum for outlining white and red designs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: While preparing and decorating themselves, the performers chant songs whose
    meaning they do not know.
  category: speech
  evidence_refs:
  - ev:6
