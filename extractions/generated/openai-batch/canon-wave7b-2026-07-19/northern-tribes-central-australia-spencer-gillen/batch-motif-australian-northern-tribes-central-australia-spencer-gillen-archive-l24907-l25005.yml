canonical_text:
  quote: ''
  summary: The passage presents Unmatjera and Kaitish traditions explaining tree burial,
    three-day return to life after burial in the Alcheringa, a curlew-associated figure
    who prevents one dead man from returning by pushing his body into the sea, and
    a related origin account for a custom involving the transfer of a dead man's hair
    to an affinal relative who must fight. It also records ethnographic comparisons
    with Arunta and northern tribal burial ceremonies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Unmatjera have no knowledge of the original meaning
    of tree burial but possess a tradition explaining it.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Bukhara man arises in the Alcheringa at a Harts Range place also bearing
    his private name; he is initially stiff, lies in sunlight, then stretches and
    walks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bukhara man sees another man and then several more men who have sprung
    from him in some manner.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: When one of the men is dead, the Bukhara man first considers ground burial
    but chooses tree burial because he is too sorry to put him in the ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Bukhara man tells old men that throwing dead people away is not good and
    instructs them to put dead men in trees if they are very sorry.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: The passage says that, in Unmatjera and Kaitish Alcheringa tradition, men
    buried in trees or in the ground used to come to life again after three days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: A Kaitish myth describes an old Panunga man of the Wiliaru or curlew totem
    who is displeased with the three-day return to life and wants men to die altogether.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:8
  text: Illuta men are about to bury a dead companion when the old curlew appears
    and, after briefly leaving, returns to find the body lightly covered with earth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The old curlew pushes the body into the sea with his foot so the dead man
    cannot come to life again, then refuses the Illuta men's pleas to bring him back.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The old curlew lives and dies at Illara and leaves many spirit children there,
    forming a large oknanikilla from which later curlew people arise.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Kulkumba, the Appungerta son of the dead Panunga Illuta man, cuts off his
    father's whiskers; a stone arises to mark the spot.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Kulkumba carries the whiskers to the main camp, names several classes as possible
    recipients, and finally gives them to an Umbitjana man who had sat quietly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Before giving the hair, Kulkumba ties it up, presses it against the recipient's
    stomach, and tells him to go fight with and kill another Umbitjana.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage states that from that time onward the hair of a dead man has been
    the property of his gammotta, who is bound to fight another gammona.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The authors report no satisfactory explanation for the hair custom, say it
    is not met with among the Arunta, and connect it with respect owed by a son-in-law
    to his father-in-law.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: The passage states that Warramunga, Wulmala, Walpari, Tjingilli, and Worgaia
    groups use both tree and earth burial and have earth-burial ceremonies regarded
    as equivalent to the Arunta urpmilchima ceremony.
  category: other
  evidence_refs:
  - ev:8
