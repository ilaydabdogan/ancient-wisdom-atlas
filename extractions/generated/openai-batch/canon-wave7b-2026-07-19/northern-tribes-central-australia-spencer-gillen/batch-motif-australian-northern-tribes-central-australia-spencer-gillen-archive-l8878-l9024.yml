canonical_text:
  quote: ''
  summary: The passage describes kinship terms, marriage-related subclass assignments,
    reciprocal grandparent-grandchild terms, mourning and avenging duties linked to
    the tjungaraii relationship, and a comparison between Mara/Anula four-subclass
    systems and the Binbinga eight-subclass system.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator distinguishes the children of a normal Yakomarina wife, named
    Tjuanaku and Niriuma, from the children of a Niamerum wife, named Tjulantjuka
    and Nurlum.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The children of a Niamerum wife are said to pass into the subclass they would
    have entered if their mother had married a Tjamerum man in the normal way.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator’s wife’s brothers, called kaii-kaii, are Yakomari men described
    as sons of Nurlum women.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator’s elder and younger sisters are Pungarina and are karina to his
    kaii-kaii.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The children of the narrator’s sisters are Thungallum; he calls them tjalalai
    and tjalalina, and they call him tjungaraii.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A tjungaraii man does not have marriage disposal over women who call him by
    that name, but the man to whom he is tjungaraii is responsible for avenging his
    death.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the narrator’s wife’s tjungaraii dies, the narrator says it is his duty
    to cut himself in token of mourning.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The narrator’s own children and his brothers’ children are Tjuanaku and Niriuma;
    he calls them katja-katja and they call him kuni.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The children of the narrator’s father’s sisters are Tjamerum and Niamerum;
    Niamerum women may lawfully be wives though this is not described as normal, and
    their children are Tjulantjuka and Nurlum.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Relations classed together in English as nephews and nieces are divided into
    katja-katja, meaning brothers’ children, and tjalalai, meaning sisters’ children.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The term kanku is reciprocal for grandfather or grandchild on the father’s
    side, while thaminjilla expresses a corresponding grandfather or grandchild relationship
    on the mother’s side.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: If the speaker is a Pungarina woman, she calls her own and her sisters’ children
    tjalalai, her brothers’ children katja-katja, and her Yakomari husband kaii-kaii.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Mara and Anula are described as Gulf of Carpentaria western-side tribes
    divided into four subclasses; the Mara retain moiety names, while the Anula do
    not.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: The four Mara and Anula subclass names are said to comprise groups regarded
    as equivalent to the eight Binbinga subclasses, with each four-name division equivalent
    to two divisions in the Binbinga and southern tribes.
  category: relationship
  evidence_refs:
  - ev:10
