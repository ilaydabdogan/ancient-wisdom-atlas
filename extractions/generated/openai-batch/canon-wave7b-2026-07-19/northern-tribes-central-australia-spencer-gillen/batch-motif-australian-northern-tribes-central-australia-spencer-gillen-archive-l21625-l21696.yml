canonical_text:
  quote: ''
  summary: A Tjunguri man of the Nappa-undattha green snake totem arises from underground
    and a well, travels through named places, produces spirit children from his muscles
    during ceremonies, changes between snake totems, sheds skin, steals a small Wollunqua
    Churinga, flees a star-man while suffering thirst, leaves children and landscape
    markers, and finally escapes into a well with the Churinga while the star remains
    nearby and a rock marks where it entered the earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Tjunguri man of the Nappa-undattha green snake totem arises at Nai-irini,
    first lives under the ground, comes out of a native well, and travels south while
    throwing out his muscles.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Tjapeltjeri child arises from the thrown-out muscles and is made to come
    out of the well where he is living; the Tjunguri man and the child perform ceremonies
    at Kiarloko.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the Tjunguri man performs sacred ceremonies, spirit children come out
    of his muscles; when he changes totems, he produces children of the new totem.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Tjunguri man changes from Nappa-undattha to Nathakura, then to Kurdatjeri,
    and later transforms himself into Kutnakitchi, a water snake.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: He takes skin off young snakes and leaves them behind at various places, and
    at Kulakun he sheds his skin.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: After failing to find Churinga at Kalkaquraitja, he finds many Wollunqua Churinga
    at Corella and steals one small one.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A big star-man is seated near a water-hole and does not see the snake; the
    snake flees and becomes very dry and thirsty.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A tree called Irrigidji arises at the place where the Tjunguri man stands
    to look for whether the star-man is following him.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: During the journey the Tjunguri man is repeatedly dry or thirsty, finds dry
    wells, asks for water, and leaves a spirit child called Thamundongana, meaning
    “the dry one.”
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: At Wallianminiakuri, he asks the children and women at a well for water, but
    the women pick up clubs and want to fight him, so he leaves without a drink.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: As he continues travelling, he makes sacred ceremonies, leaves children behind,
    and makes many creeks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: At Malukathera he sees lightning behind him, knows the star-man is following,
    and runs onward while the star gains on him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A little snake called Urabulka warns him that the star is following and opens
    the bushes so that he can dive into a well.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:14
  text: The Tjunguri man opens the ground with his tail, remains in the well thereafter,
    and keeps the Churinga with him; the star does not catch him and a big rock arises
    where the star goes into the earth.
  category: sequence
  evidence_refs:
  - ev:8
