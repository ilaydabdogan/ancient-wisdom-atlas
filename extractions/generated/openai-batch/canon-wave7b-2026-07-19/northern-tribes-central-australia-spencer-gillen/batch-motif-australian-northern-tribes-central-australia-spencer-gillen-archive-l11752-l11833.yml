canonical_text:
  quote: ''
  summary: 'The passage describes totem-related restrictions among named northern
    Central Australian groups: prohibitions on killing or eating one''s own and paternal
    totems; conditional rules for a mother''s totem involving receipt from the relevant
    moiety; named examples involving fire, water, emu, honey bag, and black-snake
    totems; restrictions on access to and drinking from totemic water-holes; spirit-form
    associations with a water-hole; and the removal of restrictions for very old men.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man may neither kill nor eat his own totem, his father's totem, or his father's
    father's totem, whether these are identical or different.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Rules for a mother''s totem vary: Walpari may eat it under specified conditions,
    Worgaia are described as strictly tabooing it in the western section, and Warramunga
    do not kill it themselves and only partake if it is given by the other moiety.'
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: A Tjunguri man of the curlew totem may eat honey bag, his mother's totem,
    if it is given to him by a Kingilli man.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Walpari man whose mother belonged to the fire totem obtains a fire-stick
    from a man belonging to the half of the tribe associated with the fire totem.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Tjupila man of the wild-cat totem whose mother was emu does not kill the
    emu and only eats it if it is given to him by a member of the Uluuru moiety.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Tjambin whose mother's totem was water receives water from a man of the
    Uluuru half by preference, though if alone and thirsty he may obtain it for himself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Two men are said to have entered their mother at the water-hole Thali-ippi,
    where the Tjudia totem ancestor left them in spirit form; they may not drink from
    that pool.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Near Thali-ippi there are spots inhabited by opossum and witchetty grub spirits,
    giving the two men a special association with those totemic groups.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The black-snake totem belongs to Thapanunga and Thapungarti men and has its
    centre at the water-hole Tjinqurokora on Tennant Creek.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Men and women of the black-snake totem, and those whose fathers or father's
    fathers belonged to it, are forbidden to eat the animal.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the black-snake example, some people may eat or drink only if the substance
    is given by Kingilli or Uluuru men, while Kingilli men may eat and drink freely
    in the specified cases.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: No woman may go near Tjinqurokora to draw water; all initiated men may go
    there, but men of the black-snake totem may not drink at the spot.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage states that restrictions apply not only to the totemic animal
    but also to the water-hole where the animal arose.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Totemic restrictions are said to be removed for very old men, who may eat
    everything when they are very old and their hair is turning white.
  category: attribute
  evidence_refs:
  - ev:7
