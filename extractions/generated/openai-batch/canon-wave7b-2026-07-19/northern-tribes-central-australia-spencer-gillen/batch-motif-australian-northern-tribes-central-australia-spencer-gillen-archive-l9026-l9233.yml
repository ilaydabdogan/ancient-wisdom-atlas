canonical_text:
  quote: ''
  summary: The passage compares paternal descent and marriage-class arrangements among
    several northern and central Australian tribes. It describes indirect paternal
    descent in Binbinga and southern Arunta systems, contrasts this with direct paternal
    descent in Mara and Anula systems, and explains the use of moieties, subclasses,
    paired groups, and diagram lines to represent marriage and descent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the described paternal-line tribes, a child passes into the half of the
    moiety to which the father does not belong, a rule said to prevent marriage between
    the children of brothers and sisters.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The Binbinga comparison table arranges men, women, and children in columns:
    men in one column marry women on the same horizontal level in another column,
    and children are shown in separate columns.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The Binbinga moieties are described as made up of paired subclasses: Tjuanaku
    with Tjulantjuka, Paliarinji with Pungarinji, Tjurulum with Thungallum, and Tjamerum
    with Yakomari.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that equivalent paired groups can be followed into the southern
    Arunta system, where the pairs fuse into Panunga, Bulthara, Purula, and Kumara
    groups.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the southern Arunta examples, Panunga men marrying Purula women have Bulthara
    children, while Purula men marrying Panunga women have Kumara children; this is
    described as indirect paternal descent.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Mara and Anula systems are contrasted with the indirect systems because
    the child passes into the father's moiety and into the same half of it.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Mara examples, children of Murungun are Murungun, children of Purdal
    are Purdal, children of Mumbali are Mumbali, and children of Kuial are Kuial;
    the Anula are said to follow the same pattern.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A diagrammatic example states that in the majority paternal-descent pattern
    A marries C and the children fall into B, while in Mara and Anula A marries C
    and the children are A.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In Mara and Anula, each of the four subclasses is said to consist of two groups;
    for Murungun men, one group marries women of one half of the other moiety, while
    the other group marries women of the other half.
  category: relationship
  evidence_refs:
  - ev:7
