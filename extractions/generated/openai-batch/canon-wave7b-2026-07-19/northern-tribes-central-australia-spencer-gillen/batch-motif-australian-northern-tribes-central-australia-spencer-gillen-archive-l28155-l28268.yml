canonical_text:
  quote: ''
  summary: The passage describes food restrictions for initiated boys, pregnant women
    and their husbands, and menstruous women among several northern Central Australian
    groups. It also describes release from initiation food taboos through offerings
    to elders, beliefs about child spirits affecting hunting and pregnancy, a restriction
    on gathering Irriakura bulbs, and procedures or traditions connected with nose-boring.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Boys during and after initiation are subject to food restrictions that vary
    by tribe and include animals such as opossum, snake, lizard, echidna, emu, and
    others.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: Some initiated boys are released from a food restriction only after making
    food offerings, and in one case also giving weapons, to an older man connected
    with the food or ceremony.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
- id: obs:3
  text: For a Binbinga newly initiated boy, a snake offering is placed around an older
    man's neck and then used to touch the young man's mouth before he is free to eat
    it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that restrictions on newly initiated youths are similar
    across the tribes and gives as their object keeping the best food for older men
    and teaching strict obedience to youths.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Pregnant women, and in several tribes also their husbands, are forbidden to
    eat specified foods; the passage links infringement to harm or delayed development
    of the child, or danger to the mother.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: In the Arunta and Unmatjera belief described here, the spirit of the child
    may accompany the father in the bush, warn large game, and make a spear or boomerang
    take a crooked course.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Kaitish pregnant woman is said to be required to drink water sparingly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Arunta restriction described here, a menstruous woman may not gather
    Irriakura bulbs, and an infringement is said to cause failure of the bulb supply.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After nose-boring in the Arunta, Ilpirra, and Unmatjera tribes, a boy strips
    bark from a tree and throws it toward his mother's Alcheringa camp.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After a girl's nose is first bored by her husband, she fills a small pitchi
    with sand and jumps with her feet close together while moving the pitchi as if
    winnowing seed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In a Warramunga tradition, an old crow first performed nose-boring in the
    Alcheringa using his beak.
  category: action
  evidence_refs:
  - ev:8
