canonical_text:
  quote: ''
  summary: 'The passage describes parts of Warramunga and Tjingilli totemic ceremonies:
    Kingilli men stroke the Miniurka while Uluuru men sing and move about; newly initiated
    boys are shown the Miniurka and told it signifies giving fire and warmth to the
    Kingilli; Tjingilli ceremonies are compared with Warramunga ceremonies, including
    moiety organization, totem sequences, body decorations, and a performance sequence
    involving grass, clanging clubs, boomerangs, hiding, and emergence.'
  language: English
  quote_policy: summarized
