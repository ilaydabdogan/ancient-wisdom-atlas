- id: obs:1
  text: Kingilli men repeat a performance in which feathers are thrown to them and
    they stroke the Miniurka, while Uluuru men move about, sing, and shout.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the performance, a ceremony of driving two newly initiated boys away
