canonical_text:
  quote: ''
  summary: A visiting party enters an open flat, is joined by local men, performs
    a preliminary dance in lines, and then sits apart from the local group. The male
    visitors wear flaked sticks associated with fighting and avenging expeditions.
    The visiting headman collects these sticks and gives them to the local Alatunja,
    who burns them to show peaceful intent. Later, local Umbitjana men taunt a visiting
    Umbitjana man over insufficient mourning for a deceased father-in-law and throw
    boomerangs at him.
  language: English
  quote_policy: summarized
