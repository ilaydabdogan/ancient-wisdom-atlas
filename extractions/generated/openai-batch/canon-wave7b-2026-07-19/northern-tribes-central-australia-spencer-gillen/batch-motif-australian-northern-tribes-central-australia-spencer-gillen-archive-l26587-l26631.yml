- id: obs:3
  text: After the preliminary dance, visiting and local people separated; the visitors
    sat on level ground and the local people grouped on nearby rocks.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Every male visitor wore two or more flaked sticks, described as characteristic
