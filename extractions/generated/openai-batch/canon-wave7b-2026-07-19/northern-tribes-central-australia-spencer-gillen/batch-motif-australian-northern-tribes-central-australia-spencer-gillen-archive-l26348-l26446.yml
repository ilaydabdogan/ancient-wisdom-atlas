canonical_text:
  quote: ''
  summary: After preliminary ceremonies, an atninga avenging party arms itself and
    leaves. When it returns, black charcoal paint and Eremophila twigs signal success.
    The men approach in formation; a pipe-clay-covered mourning woman dances and harangues
    them. The actual killers stand silently while their shields are struck to test
    whether the dead man's bird-form spirit has affected them with evil magic; onlookers
    later report what happened, and an old man also strikes the killers' shields with
    a boomerang.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each member of the party took a shield, spear, and boomerang before setting
    out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A figure caption describes the men who were to take part in the killing lying
    prostrate and imitating the sorrow and mourning of the intended victim's relatives.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After more than a week without news, watchers were stationed on a hill to
    look for the returning atninga party.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: On return, each man was described as painted black with charcoal and wearing
    Eremophila twigs over the forehead and through the nasal septum; the passage states
    that this indicated success.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The returning party followed a creek bed through a gap in the hills and approached
    in square formation with spears upright and shields in hand.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: An old woman in mourning, covered with white pipe-clay and holding a fighting
    club, danced in front of the men and harangued them while they stood silent.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The immirinja men are identified as those who had actually taken part in the
    killing; they stood in the front line with spears on the ground and shields held
    convex side outward.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The old woman and a younger woman struck each immirinja man's shield with
    a fighting club in a ceremony called ulquita atuina.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The spirit of the dead man is said to follow the party as a little bird called
    chichurkna and to seek a chance to injure the men by evil magic.
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: A hollow shield sound was taken to mean that the owner was under evil influence
    and would not live long, while a firm strong sound meant that the evil magic had
    not affected him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Men who had not actually taken part in the killing stood in the back rows,
    listened to the shield sounds, and later reported what had taken place.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: After the shield-striking by the women, immirinja men moved in small groups,
    circled in front of the group, and presented their shields to an old man who struck
    them with a boomerang.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: 'A footnote gives Urabunna terms for comparable participant categories: those
    who walk at the side and those who walk in the lead.'
  category: relationship
  evidence_refs:
  - ev:11
