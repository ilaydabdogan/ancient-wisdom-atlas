canonical_text:
  quote: ''
  summary: The passage discusses central Australian tribal territories, dialect differences,
    and the ethnographers’ summary of shared religious and social features. It states
    that tribal boundaries are fixed from time immemorial, tied to the presence of
    alcheringa ancestors and spirit individuals. It also lists shared beliefs in ancestors
    who made the country, reincarnating spirits, totemic ceremonies, initiation customs,
    intichiuma-like rites, and distinctions among four named nations.
  language: English
