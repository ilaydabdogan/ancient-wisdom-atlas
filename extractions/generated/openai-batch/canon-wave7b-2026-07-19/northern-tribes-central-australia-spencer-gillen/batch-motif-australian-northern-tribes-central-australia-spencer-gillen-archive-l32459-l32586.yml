canonical_text:
  quote: for the time being are regarded as Churinga or sacred
  summary: The passage describes decorated ceremonial shields, a rain-ceremony pitchi,
    and Churinga designs. It explains some design referents in witchetty grub ceremonies,
    recounts an Alcheringa episode in which Irria gives gypsum for rain-making, and
    emphasizes that Churinga designs are often esoteric, variable in meaning, and
    not reliably interpretable from form alone.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: In sacred ceremonies, objects such as shields and pitchis are used, decorated,
    and for the time being regarded as Churinga or sacred.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Four decorated shields were used in ceremonies connected with the witchetty
    grub totem; they were rubbed with fresh red ochre and marked with wavy or zigzag
    lines, concentric circles, and sometimes dots of down.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the described shields, some concentric circles represent a bush on which
    the grub feeds, while wavy or zigzag lines indicate tracks of the insect; other
    circles represent the Udniringa bush on which the mature insect lays eggs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A small pitchi was used during a southern Arunta rain ceremony and was decorated
    with red ochre, a red median band, and a narrower outer band of white down.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Alcheringa account attached to the pitchi, Irria took lumps of gypsum
    from inside himself and presented them to another man so that the latter could
    cause rain to fall.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage classifies Churinga designs as incised patterns, painted patterns,
    and decorations of down; down is usually added during sacred ceremonies in which
    Churinga are used.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wooden Churinga are commonly coated with red ochre, renewed when the ertnatulunga
    is visited or when the objects are brought into camp for ceremonies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: One stone Churinga associated with the Kulpu or honey bag totem among the
    Kaitish is flattened and pear-shaped, has resin at the small end, is coated with
    yellow ochre, and has a broad black central line.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Another wooden Churinga belonged to a Gnanji man; it has red-ochred ends and
    a charcoal-blackened middle, but the meaning of its design was not ascertained.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that etiquette restricts revealing design meanings associated
    with another person, and that a person may feign ignorance of a matter he knows.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: Incised Churinga designs are made in various forms, often with an opossum
    incisor tooth implanted in the lower jaw.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that the visible nature of a Churinga design usually gives
    little or no clue to its meaning.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: 'The same or similar forms may have different referents: concentric circles
    or a spiral can represent a man, frog, tree, or water-hole; a sinuous band can
    represent a snake, a crane-associated design, a grub ancestor’s track, or be merely
    decorative on other objects.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The listed fundamental incised forms include chippings in lines, straight
    or curved bands, wavy bands, U-shaped bands, spiral bands, concentric circles,
    squares derived from circles, combinations of circles or squares with straight
    lines, and imitative animal or bird tracks.
  category: attribute
  evidence_refs:
  - ev:8
