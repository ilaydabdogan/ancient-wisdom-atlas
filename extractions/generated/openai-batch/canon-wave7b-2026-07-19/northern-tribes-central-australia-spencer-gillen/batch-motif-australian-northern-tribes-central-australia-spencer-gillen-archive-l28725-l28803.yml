canonical_text:
  quote: Falling stars appear to be associated with the idea of evil magic in many
    tribes.
  summary: 'The passage reports several northern and central Australian beliefs about
    celestial bodies. A Mara fragment says fishers once caught the moon in a net,
    but it escaped into water. Arunta, Kaitish, and Mara accounts connect falling
    stars with evil magic, death, vengeance, unfriendly sky spirits, and protection
    by a friendly woodland spirit. The passage also records identifications of stars
    and constellations: the evening star as a Kumara woman with a sacred pole, the
    Pleiades as women who went into the sky, Orion as an emu, stars as campfires near
    the Milky Way river, and Kaitish stars as women associated with Atnatu.'
  language: English
  quote_policy: quoted
