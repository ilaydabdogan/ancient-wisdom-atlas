canonical_text:
  quote: ''
  summary: 'The passage describes practical methods for making fire among several
    northern and central Australian groups, including sawing with spear-thrower and
    shield, use of a cleft stick, and drilling or twirling. It also records two Warramunga
    traditions: two hawks first make fire at Wakuttha, causing a widespread fire and
    burn injuries/death; and two Winithonguru native-cat totem brothers first make
    fire by rubbing sticks, after which the younger brother burns his hands carrying
    the fire-stick.'
  language: English
  quote_policy: summarized
