canonical_text:
  quote: ''
  summary: The passage describes Warramunga ceremonies connected with totems and with
    mythic or semi-human beings. It recounts Thaballa boys staying with an old Thaballa
    in a rock, with spirit children left at halting places and the old Thaballa said
    not to die. It then describes performances by a Thungalla man, a Pau-wa semi-human
    dog-like being with pointing-sticks, and an Ingwuna or Kurdaitcha figure marked
    as a killer and acting before an amused male audience.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Thaballa boys agreed to stay with the old Thaballa, who took them into
    the rock for the night; they later repeatedly came out, laughed, played with bark,
    and returned at night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Thaballa men left many spirit children at this and other places where
    they halted and played.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old Thaballa is said never to have died and to be heard laughing near
    the place where he lives.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Five ceremonies connected with this totem were performed by a solitary old
    Thungalla man decorated in the usual way and carrying tjintilli on his thighs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Thungalla performance, the performer emerged from behind a bush, moved
    slowly toward the ceremonial ground, looked about aimlessly, and made a whining
    giggle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: An audience member threw bits of bark at the Thungalla performer, who paused
    to look at them while giggling; the scene amused the onlookers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Thungalla performer walked around an Uluuru man, had his head-dress knocked
    off, and sank to the ground.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that during large-scale totemic ceremonies among the Warramunga,
    as among the Arunta, some ceremonies are not totemic but concern mythic creatures.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Pau-wa was described as a mythic, semi-human creature, somewhat dog-like
    in shape, with pointing-sticks used to kill other animals.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Pau-wa pointing-sticks were represented by curved sticks projecting from
    the performer's head-dress, and the performer's upper body bore curved bands of
    red and white down.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Pau-wa performance was held to one side of the ground for true totemic
    ceremonies, while otherwise resembling totemic ceremonies in decorations and restriction
    to initiated male witnesses.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: In the Pau-wa performance, the performer circled an open space and approached
    a small pit containing a hidden crouching man, who seized his legs, dragged him
    down, and tore off his head-dress and pointing-sticks.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Ingwuna is described as a man equivalent to the Kurdaitcha among the Arunta
    and associated with Uluuru ceremonies.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: The Ingwuna performer was daubed with red ochre, marked with white-down circles
    enclosing red-down patches on forehead and shoulders, had white stars on his cheeks,
    wore a paper-bark helmet, and carried a boomerang in each hand.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:15
  text: The white circles with red centres on the Ingwuna performer indicated heads
    of natives whom he had killed.
  category: object
  evidence_refs:
  - ev:12
- id: obs:16
  text: The Ingwuna is identified with the same Kurdaitcha whom two Alcheringa Winithonguru
    men met and avoided during their wanderings, and he is said to have spent much
    time whistling.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:17
  text: After a Wollunqua ceremony, men went to a spot about a hundred yards from
    the ceremonial ground, where the Kurdaitcha emerged from behind a bush and darted
    from side to side before the group.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:18
  text: The men laughed and jeered continuously at the Kurdaitcha's antics and appeared
    to enjoy the performance.
  category: action
  evidence_refs:
  - ev:14
