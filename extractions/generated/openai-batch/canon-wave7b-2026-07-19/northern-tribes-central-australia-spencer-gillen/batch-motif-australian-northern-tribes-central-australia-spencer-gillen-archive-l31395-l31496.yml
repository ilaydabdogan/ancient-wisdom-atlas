  summary: The passage discusses regional styles and techniques of Australian Aboriginal
    decorative art, emphasizing non-imitative central and northern designs, the distribution
    of spiral and concentric-circle ornamentation, methods of ornamentation, categories
    of designs, and incised or painted designs on implements and weapons.
