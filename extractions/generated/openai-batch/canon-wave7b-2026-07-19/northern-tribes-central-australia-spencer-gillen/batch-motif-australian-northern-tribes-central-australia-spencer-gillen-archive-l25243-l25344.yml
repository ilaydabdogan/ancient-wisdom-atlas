canonical_text:
  quote: ''
  summary: 'The passage describes Warramunga/Kaitish mortuary customs: distribution
    of a dead Tjunguri man''s possessions to Thakomara relatives, mourning self-cutting
    and wailing in figure captions, silence and name restrictions for certain female
    relatives, a food-and-finger-biting ceremony to release some women from silence,
    and a visit to the kakita death-site mound to inspect tracks that might identify
    a murderer by totemic affiliation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The dead man's effects were placed on the knees of the elder Thakomara while
    the women wept and then returned to the women's camp.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dead man is identified as a Tjunguri, and the Thakomara men stood to him
    as mother's brothers or daughters' husbands and were entitled to his weapons and
    implements.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bundles included boomerangs, clubs, pitchis, tomahawks, hair-girdles,
    and other items; the younger Thakomara chose the clubs and boomerangs while the
    elder kept the rest.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The widows were allowed to take nothing except their own yam-sticks; the rest
    passed to men classified as tribal brothers of the dead man's mother.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: One figure caption describes women challenging one another to fight and cut
    their heads during mourning ceremonies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A strict ban of silence was placed on women related to the deceased as wife,
    mother, sister, daughter, or mother-in-law, whether actually or tribally related.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: For widows, mothers, and mothers-in-law the silence lasted through the whole
    mourning period, and some women voluntarily continued silence and used gesture
    language.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A woman's silence could be lifted by men standing to her as tribal sons after
    she gave food, usually a grass-seed damper, and bit the finger of each releasing
    man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After a man died, women could never again mention his name, while the restriction
    on men was not absolute.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Within a day or two of the death, a party visited the kakita, a small mound
    of earth raised on the exact spot where the man died.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Participants in the kakita visit were decorated with pipe-clay and green twigs,
    and the wife's father walked at the head while the others held their hands behind
    bowed heads.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The kakita and surrounding smooth ground were examined for tracks that might
    identify the murderer; a snake track would indicate a culprit from the snake totem,
    but on this occasion only camp-dog tracks were visible.
  category: action
  evidence_refs:
  - ev:8
