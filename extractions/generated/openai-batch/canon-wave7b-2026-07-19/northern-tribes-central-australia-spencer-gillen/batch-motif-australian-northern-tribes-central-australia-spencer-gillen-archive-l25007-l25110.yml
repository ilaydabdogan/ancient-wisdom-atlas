canonical_text:
  quote: ''
  summary: 'The passage reports Warramunga mortuary customs observed by the authors:
    a middle-aged Tjunguri medicine man falls ill after breaching food restrictions,
    doctors diagnose intrusive objects in his body and try to remove them, mourners
    respond to his near-death and death with wailing and self-injury, and the body
    is carried by torchlight to a bough platform in a low gum-tree.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The observed mortuary series is described as extending from death to the final
    placing of bones in the earth, and as taking two years or longer for one person.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A middle-aged Tjunguri medicine man was forbidden to eat certain foods such
    as emu and euro flesh and was expected to bring them to older medicine men, but
    he had eaten euro himself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man’s illness was attributed by those in camp to his deliberate breach
    of custom.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Medicine men diagnosed the illness as caused by a dead man’s bone attracted
    by the camp-fire and by a gum-tree wart inside the patient’s body.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The doctors attempted to remove the diagnosed objects under darkness by sucking
    and rubbing the patient’s body, but the man died.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the first loud wail from the man’s camp, men ran toward the camp, howling;
    some sat on the creek bank with heads bent and wept and moaned.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The man’s camp had been pulled to pieces when the observers arrived there.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Women mourners lay on the body or stood and knelt nearby, digging yam-sticks
    into their heads so that blood streamed down their faces while they wailed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Men threw themselves on the body, producing a mass of bodies around the dying
    man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A Thapungarti man brandishing a stone knife gashed both thighs deeply and
    was later tended by female relatives who put their mouths to his wounds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Another Thapungarti man appeared to imitate thigh-cutting but used the flat
    side of his knife and caused only slight scratches.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: When the man actually died, louder wailing and self-injury resumed; men and
    women cut themselves, and women struck one another’s heads with fighting clubs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Within about an hour after death, a torchlight procession carried the body
    to a timber belt and left it on a bough platform in a low gum-tree.
  category: action
  evidence_refs:
  - ev:9
