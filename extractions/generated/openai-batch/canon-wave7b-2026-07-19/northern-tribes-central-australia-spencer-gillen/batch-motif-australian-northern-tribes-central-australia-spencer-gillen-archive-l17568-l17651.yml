canonical_text:
  quote: ''
  summary: The passage describes restrictions and ceremonial protocols concerning
    eating a totemic animal or plant among Kaitish and Unmatjera groups, including
    token eating during Intichiuma, redistribution to members of another moiety or
    half of the tribe, sanctions for improper eating, and traditions about Idnimita
    ancestors exchanging ritual objects and eating idnimita grubs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed actor carries alpita, performs Intichiuma to make idnimita grubs
    grow, sings the grubs, gathers them, cooks them, and eats them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The authors state that, apart from two vague accounts, they found no myth
    explaining present restrictions on eating the totem, despite a contrast between
    Alcheringa ancestors who ate it freely and present practice in which it is taboo
    except at Intichiuma.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among the Kaitish, under normal conditions a man does not eat his totem except
    ceremonially.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says that if a Kaitish man ate his totem freely, men of the other
    moiety would bone him because such conduct would prevent successful Intichiuma
    performance.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Intichiuma, a Kaitish man eats only a little of the totem, and this is
    described as especially essential for the headman of the group.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: If an emu man enters the country of a grass-seed group, he takes gathered
    seed to the grass-seed headman and asks permission before eating it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When an animal is killed in a Kaitish camp and a man of that totem is present,
    men of the other moiety bring him the cooked animal; he eats a little and gives
    it back to them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Among the Unmatjera, at Intichiuma a little of the totem is eaten, and the
    remainder brought to the headman is handed by him to men of the other half of
    the tribe.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Unmatjera believe that a man who eats his own totemic animal or plant
    outside Intichiuma would swell up and die.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: A person belonging to the water totem must, when with other men, be supplied
    with water by someone who is not a member of that totem.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Unthurkapunda, a Thungalla man and Idnimita ancestor, arose on the Burt Plain
    and travelled toward Intiara, where Idnimita, a Kumara man, lived by a big waterhole.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Idnimita gave Unthurkapunda his own Churinga and alalkira and received Churinga
    and alpita in return.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Idnimita used the alalkira to dig idnimita grubs, and the tradition says he
    thought he would have to gather idnimita himself because he had no brother or
    son to get it for him.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The tradition says that at that time there was nothing in the country except
    idnimita and a little bird called Thippathippa.
  category: setting
  evidence_refs:
  - ev:11
