canonical_text:
  quote: ''
  summary: The passage describes Warramunga burial and mourning procedures at a tree
    grave. Relatives approach the grave quietly to look for the supposed murderer’s
    spirit, examine the body and surroundings, use corpse fluid and a teiri beetle
    as clues or magical means against the murderer, perform a last-resort rite involving
    fire, a fire-stick, bones, binding, falling, fasting, water-spitting, and listening
    for a distant cry, and require mothers of the dead man to receive putrid material
    from the grave as a token of sorrow.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Specified relatives visit the tree grave, walk in single file, approach quietly,
    circle the tree while crying out, place fresh boughs on the body, and return to
    camp.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The visitors hope to see the spirit of the murderer hovering over the remains
    of the dead man.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the described Tjunguri case, a group left before dawn, used concealment
    while approaching, found no visible spirit or tracks, examined the body at sunrise,
    replaced boughs, and inspected the kakiti on the return.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the body becomes putrid, the wife’s brother and father examine fluid
    that has trickled from the platform; its direction and distance are taken as indicators
    of the murderer’s origin and distance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A small beetle called teiri may be found at the end of the fluid stream; it
    is said to resemble a man and is killed because it is believed to represent the
    culprit.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: When no trace is found, an elder brother, wife’s brother, and wife’s father
    perform another rite at the tree involving a fire, dislocation of bones, a fire-stick
    inserted into the skull cavity and ribs, fur-string bindings, a fall from the
    platform, and shouted words.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the tree rite, the participants sit in camp for two days without food
    or drink; afterward each takes water into the mouth and spits it in various directions
    secretly.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A distant voice crying “Watai” is treated as a sign that the magic has taken
    effect and that the man is dead.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: If a person in camp is suspected, the elder brother asks the medicine men
    not to treat the culprit if he falls ill.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Actual and tribal mothers of the dead man are obliged to sit under the platform
    and let putrid material drip onto their bodies, where it is rubbed as a token
    of sorrow.
  category: action
  evidence_refs:
  - ev:8
