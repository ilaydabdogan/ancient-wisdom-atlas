canonical_text:
  quote: ''
  summary: 'The passage describes initiation-related beliefs among Arunta, Urabunna,
    Unmatjera, and Kaitish groups: Twanyirika is associated with the bull-roarer,
    Churinga, seclusion, and possession or removal of the initiate; Witurna is associated
    with a sacred stick and bodily replacement of the boy; an Unmatjera sky arakurta
    may carry off a boy who fails to make the bull-roarer sound; and Kaitish Atnatu
    is described as a distinct self-made sky being with stars as wives or daughters.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ceremonies concerning unnamed beings in the immediately preceding context
    are described as merry, while people avoid the places where those beings lurk.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Twanyirika is identified as an important Arunta spirit individual whose voice
    women and children are said to hear when the bull-roarer sounds.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the Arunta have no tradition for the origin of the
    Churinga beyond saying that Alcheringa ancestors possessed them.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women and children are told that Twanyirika lives in wild, inaccessible regions
    and comes out when a boy is initiated.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: During circumcision, the bull-roarer sounds in the darkness around the ceremonial
    ground, and women are said to believe that Twanyirika enters the boy and takes
    him into the bush until he recovers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: While secluded from women and children during recovery, the boy constantly
    sounds the bull-roarer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the operation, the elder brother presents a bundle of Churinga to the
    youth and identifies them with Twanyirika.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The elder brother tells the youth that the Churinga will help heal him, that
    he must guard them, keep them from his mothers and sisters, obey his elder brother,
    and avoid forbidden food.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The authors explicitly state that Twanyirika is not being described as a supreme
    being who inculcates moral ideas, and that Arunta people have no such being so
    far as the authors could find out.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Urabunna tribe, a sacred stick given to the boy is called chimbaliri,
    but women and children are not allowed to hear that word.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Urabunna women and children are taught that the sound of the chimbaliri is
    the voice of a spirit called Witurna.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Witurna is said to take the boy away, remove all his insides, provide a new
    set, and return him as an initiated youth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Urabunna boy is told not to allow a woman or child to see the stick, under
    threat that he and his mother and sisters will die, and he is warned not to interfere
    with other men’s wives.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: In the Unmatjera tribe, the bull-roarer noise is called luringa, and the boy
    is told to make it while recovering in the bush after circumcision.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Unmatjera boy is told that if he does not make the luringa sound, an arakurta
    who lives in the sky will come down and carry him away.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: The sky arakurta is said in tradition to have been initiated by the Ullakuppera
    men when they first introduced the use of a stone knife in the Alcheringa, and
    then to have gone up into the sky at Urniara.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: Unmatjera women are taught that Twanyirika usually lives in a rock and comes
    out of it to take possession of the initiated youth.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:18
  text: Unmatjera old men tell boys that Twanyirika has put his penis into the youth’s
    eyes, nose, mouth, and between the toes and fingers.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:19
  text: Unmatjera boys are taught that a sudden big black cloud is caused by Twanyirika
    making smoke.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:20
  text: Among the Kaitish, Atnatu is described as a spirit individual whose beliefs
    differ from those concerning Twanyirika and are peculiar to the Kaitish.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:21
  text: Atnatu is reported as a very great man with a very black face and no anus.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:22
  text: Atnatu is said to have arisen in the sky before the Alcheringa, made himself,
    named himself, and to have another sky and another sun beyond his dwelling place.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:23
  text: The kurallia, or stars, are described as Atnatu’s wives, and he also calls
    his daughters kurallia and his sons Atnatu.
  category: relationship
  evidence_refs:
  - ev:9
