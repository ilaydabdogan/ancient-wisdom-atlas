comparison_claims:
- id: claim:1
  claim: Within the passage, Arunta, Urabunna, and Unmatjera accounts share a same-function
    pattern in which restricted ritual sounds or objects are associated with spirits
    and male initiation.
  claim_level: same_function
  target: Arunta Twanyirika, Urabunna Witurna/chimbaliri, and Unmatjera luringa-arakurta
    initiation accounts
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: 'The passage presents different local details: Urabunna Witurna replaces
    the boy’s insides, Unmatjera includes a sky arakurta, and Twanyirika’s specific
    attributes vary.'
- id: claim:2
  claim: The passage reports an authorial statement that the Arunta Twanyirika belief
    was considered fundamentally the same as beliefs found in Australian tribes generally,
    while rejecting the interpretation of Twanyirika as a supreme moral being.
  claim_level: same_function
  target: broader Australian tribal initiation-spirit pattern as asserted by the authors
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: low
  limitations: This is a broad authorial comparison cited in the passage rather than
    demonstrated by detailed evidence within this excerpt.
- id: claim:3
  claim: The passage explicitly states that the Unmatjera belief is very similar to
    that of the Arunta, supporting a nearby-corpus same-function comparison for bull-roarer
    and initiation beliefs.
  claim_level: same_function
  target: Unmatjera belief compared with Arunta Twanyirika belief
  evidence_refs:
  - ev:7
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The Unmatjera account includes the additional sky arakurta threat,
    so similarity should not be treated as complete identity.
