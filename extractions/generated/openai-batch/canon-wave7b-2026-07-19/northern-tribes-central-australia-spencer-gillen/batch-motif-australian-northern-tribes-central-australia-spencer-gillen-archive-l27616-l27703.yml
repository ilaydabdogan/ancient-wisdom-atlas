canonical_text:
  quote: ''
  summary: The passage describes rare blood-giving between mura affines when a woman
    is seriously ill, a reciprocal food exchange if she recovers, rules of menstrual
    avoidance and seclusion including containment of menstrual blood, a Mara legend
    explaining the origin of menstruation through bandicoot beings, and customs of
    giving cut hair to marriage-related kin as a form of payment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After an interval, a man who has benefited may give a return present such
    as fur-string to his benefactor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men and women who are mura to one another are generally prohibited from intercourse
    or ordinary contact.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: On rare occasions, a seriously ill woman may receive blood from a son-in-law
    in the mura relationship.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The blood-giving man opens a vein before leaving his camp, controls the flow
    with a finger, approaches the woman, turns his head away while she covers her
    eyes, and lets blood drain into her mouth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Recovery is described as uncommon in cases where a man receives blood from
    a woman or a woman receives blood from a man, because the patient is usually dangerously
    ill.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: If the woman recovers, she gathers vegetable food, the man obtains meat, and
    they exchange these foods through a carefully mediated encounter.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the mediated food encounter, the woman sits with bowed head and food
    beside her; the man approaches from behind, lightly strikes her head with a leafy
    twig, gives meat, and takes the vegetable food back to camp.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A woman during the monthly period is avoided, and a girl at her first menstrual
    period is especially separated from the main camp under the care of her mother
    or elder sister.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In some cases a special ground-hole receives the menstrual blood, and in all
    cases the blood is covered with earth so that nothing can come into contact with
    it.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: After recovery from the menstrual period, an operation named atna-ariltha-kuma
    is usually performed at an early date.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: A Mara legend says that menstrual bleeding began after bandicoot men making
    ceremonies had too frequent intercourse with a bandicoot woman, causing a great
    discharge.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the Mara legend, the woman says she will no longer go about as a woman
    but as a bandicoot, covers herself with grass, and hides in a hole so that the
    men cannot find her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Women’s and men’s cut hair is given to specified marriage-related kin in several
    named tribes, and in one case a son-in-law uses a woman’s hair as a hair-girdle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage states that disposal of hair is associated with payment to the
    man who has disposal of a woman in marriage or to a member of the wife’s mother’s
    group.
  category: relationship
  evidence_refs:
  - ev:7
