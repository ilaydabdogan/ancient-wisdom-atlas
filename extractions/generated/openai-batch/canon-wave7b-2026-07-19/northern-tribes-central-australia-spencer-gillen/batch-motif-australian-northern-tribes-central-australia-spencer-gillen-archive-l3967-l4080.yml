canonical_text:
  quote: ''
  summary: The passage explains Urabunna and related Central Australian kinship and
    marital rules. It states that translated kin terms denote groups rather than individuals;
    lawful marital relations are restricted to women in the nupa relationship; piraungaru
    relations give preferential but not exclusive access; the wife’s mother is subject
    to mutual speech avoidance; and Urabunna/Dieri group marital relations are compared
    with modified systems among Arunta, Warramunga, and other northern tribes with
    four or eight intermarrying groups and paternal descent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that native kin terms such as nia, nuthi, and luka refer
    to groups of individuals, not to single individuals equivalent to English father,
    brother, or mother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man may lawfully have marital relations only with women who stand to him
    as nupa, described here as children of his mother’s elder brothers, whether blood
    or tribal.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the genealogical example, Kirarawa man number 8 may marry Matthurie woman
    number 7, his nupa, but may not have marital relations with Matthurie woman number
    9, his apillia.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The mother of a man’s wife is described as nauilli and in a mutual mura relation
    with him, and they must not speak to one another.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The elder brothers or nuthi of a woman decide allotment of marital access;
    one man may receive a preferential right, while other men of the same relational
    group may receive secondary rights.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that no man has exclusive right to one woman in this system;
    women to whom a man has legal access are called his piraungaru.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: A woman may be piraungaru to a number of men, and men and women who are piraungaru
    to one another are generally found living together in groups.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Urabunna arrangement is described as groups of men and groups of women,
    from different moieties or designations, who may lawfully have marital relations.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:9
  text: The passage says Dieri and Urabunna retain two exogamous intermarrying groups,
    while Arunta, Warramunga, and other tribes in the central area have four or eight
    intermarrying groups; descent in the northern series is counted in the paternal
    line.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:6
