canonical_text:
  quote: ''
  summary: The passage opens a chapter on welcoming dances and describes strict etiquette
    for visits between friendly groups. It outlines how an individual visitor signals
    peaceful approach with smoke, waits silently outside camp, and is received by
    an older local man. It then begins an observed example in which about thirty southern
    Arunta men visit the Alice Springs group, wait at a distance, wear flaked sticks
    and eagle-hawk feathers, carry weapons, advance ceremonially in formation, and
    are met by local women dancing and yelling while local men wave spears and shields.
    The chapter synopsis also mentions later incidents involving flaked sticks, mourning,
    accusations, social separation, and a Walpari visit to the Warramunga involving
    an ancestral track, mungai spots, dance, food, and corrobboree.
  language: English
  quote_policy: summarized
