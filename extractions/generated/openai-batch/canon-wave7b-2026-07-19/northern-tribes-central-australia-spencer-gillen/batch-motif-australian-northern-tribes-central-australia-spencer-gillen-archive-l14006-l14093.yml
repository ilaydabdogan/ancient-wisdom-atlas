canonical_text:
  quote: ''
  summary: The passage contrasts ordinary Warramunga totem ceremonies, which are said
    to increase the totemic animal, plant, or object, with Wollunqua ceremonies, which
    have similar form but are not intended to increase Wollunqua. Wollunqua is described
    as an enormous water-dwelling being associated with Thapauerlu, feared as dangerous,
    and addressed by a substitute name. The passage describes the ceremonies as probably
    propitiatory, recounts Wollunqua's ancestral wandering and underground return
    to Thapauerlu, and notes the moiety-based organization of the ceremonies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Other Warramunga totem groups are described as performing long ceremonies
    equivalent in object to Arunta and Kaitish Intichiuma ceremonies, intended to
    ensure increase of the totemic object, animal, or plant.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wollunqua men perform a similar series of ceremonies alongside increase ceremonies,
    but the passage says these are not associated with increasing Wollunqua.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wollunqua is described as a huge beast so large that, if standing on its tail,
    its head would reach far into the heavens.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wollunqua is said to live in the waterhole Thapauerlu, in a lonely valley
    among the Murchison Range.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage reports fear that Wollunqua may emerge from hiding and cause damage,
    and says it has destroyed a number of natives and was once driven off when attacked.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Speakers avoid using the name Wollunqua among themselves and use the substitute
    name urkulu nappaurinnia, saying that too frequent use of the real name would
    make them lose control over it and it would eat them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The footnote explains urkulu as the generic name for snakes and nappaurinnia
    as meaning living in water, connected with Wollunqua's home at Thapauerlu.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that the ceremonies are most probably propitiatory, while
    also saying that the natives have no very definite explanation beyond saying the
    rites please Wollunqua when performed and displease him when not performed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wollunqua is described as arising at a certain spot in the Wingara time, wandering
    over the country, starting from a pot-hole in a rocky gorge in the Murchison Range,
    and travelling west.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tradition says Wollunqua tried at different places to go down into the earth
    to return to Thapauerlu, succeeded at Ununtumurra, and travelled underground back
    to Thapauerlu.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The ceremonies enacted the wandering of Wollunqua and were performed in conjunction
    with ceremonies of other totems, including emu, black snake, echidna, and deaf-adder
    totems.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Wollunqua totem belongs to the Uluuru moiety; two old Tjapeltjeris have
    charge of the ceremonies; men of the totem perform them; and men of the Kingilli
    moiety make the preparations.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The original home of Wollunqua is identified as the deep rock-hole called
    Kadjinara.
  category: setting
  evidence_refs:
  - ev:9
