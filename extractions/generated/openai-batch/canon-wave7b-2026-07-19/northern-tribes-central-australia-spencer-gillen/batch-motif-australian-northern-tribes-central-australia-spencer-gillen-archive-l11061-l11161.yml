canonical_text:
  quote: ''
  summary: The passage recounts Arunta traditions of two ungambikula forming men and
    women from incomplete animal-plant beings, then becoming little lizards. It describes
    Alcheringa totemic ancestors carrying Churinga, leaving spirit-associated objects
    at places, and conception as an ancestral spirit entering a woman so that the
    child is a reincarnated ancestor of a particular totemic site. It also notes class
    changes across reincarnations, fixed totemic identity, close associations or ritual
    transformations between totems, and comparative totem-moiety and marriage patterns
    among Arunta, Kaitish, Warramunga, and other groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The origin of the first-formed human beings is attributed to two ungambikula
    who lived in the western sky.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ungambikula came down to earth and used knives to release limbs, open
    mouths, make nostrils, and separate eyelids of incomplete inapertwa creatures,
    making men and women from them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After circumcising the men, the two ungambikula changed themselves into little
    lizards called amunga-quinia-quinia.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Totemic ancestors marched in groups across the country, each carrying a personal
    Churinga and often other Churinga as well.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Each Churinga was associated with the spirit part of an individual, and at
    various places ancestors went into the ground while the Churinga and associated
    spirits remained above ground.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A woman's conception is described as one of the spirits going inside her;
    the child is regarded as the reincarnation of a spirit ancestor associated with
    the place where pregnancy was first noticed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The child belongs to the totemic group associated with the place of the entering
    spirit.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Spirits usually enter women whose children are born into the spirit's own
    class, but sometimes enter the wrong mother; class may change in successive reincarnations,
    while the totem is described as unchangeable in the Arunta tribe.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Totemic groups can become closely associated when ancestral groups camped
    near one another or performed sacred ceremonies at nearby places.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Imanda, ancestors of frog, little bat, big white bat, and wild-cat totemic
    groups foregathered in the Alcheringa, so their descendants are mutually interested
    in one another's performances.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: A lizard totem man at Alice Springs said he was really a lizard but was closely
    associated with Auadaua because Auadaua men had performed ceremonies trying to
    change him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The lizard man did not treat Auadaua as forbidden food in the same way as
    Auadaua totem men, but abstained from eating the plant while fresh and green to
    mark his association.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: An Unjiamba, or Hakea flower, woman was changed into a bandicoot woman by
    means of sacred ceremonies belonging to the bandicoot.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the Kaitish examples, children's totems do not follow either the paternal
    or the maternal line.
  category: relationship
  evidence_refs:
  - ev:10
