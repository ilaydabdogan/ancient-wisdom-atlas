canonical_text:
  quote: ''
  summary: Unkurta travels among several totemic men, explains his motherless origin
    and self-multiplication, instructs them to look at themselves so that young ones
    like themselves will arise, and teaches tree burial for the dead. The passage
    also describes animal-totem bodily signs, Churinga-associated emergence, the sending
    out of Unkurta children to form local totem centres, and Unkurta’s death on his
    Churinga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Unkurta tells an Iwuta/Aril kara figure that sleeping, waking, and continuing
    to look at himself will lead to more Iwutas appearing beside him, bodily increase,
    and becoming an oknirabata.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Unkurta instructs the Iwuta/Aril kara figure not to be buried in the ground
    when dead, but in a tree, and to have his sons teach others to bury their dead
    in trees.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Iwuta does as Unkurta said; he increases, becomes an oknirabata, and many
    Iwutas arise from him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Intukina, Unkurta meets Qualpa, a man of the Qualpa totem, and says that
    he himself had no mother, saw many Unkurtas beside him, and grew into an oknirabata
    by looking at himself.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Qualpa says that when another man dies he throws him away on the ground; Unkurta
    says this is not good and instructs tree burial and transmission of the practice
    to sons and other men.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Awampana, Waratah is identified as a small wallaby man; he recognizes wallaby-like
    black hairs and a short arm on himself, and Unkurta confirms the wallaby likeness.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Waratah observes that Unkurta has prickly spines like the jew-lizard; Unkurta
    instructs Waratah to look at himself, produce young ones like himself, become
    an oknirabata, and use tree burial.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Okalpara, Unkurta finds Atnunga/Iltjikinja sitting in sandy country among
    porcupine grass, identifies him by blackness and hair along the foot, and hears
    him say he has no mother and jumped up among the grass.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Atnunga sleeps with his Churinga under his head and wakes to find many little
    Atnungas around him who have sprung from him during the night.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Unkurta sends his children out in various directions to give rise to local
    Unkurta totem centres and to teach people tree burial and caution against wild
    dogs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The young Unkurtas look at their prickles and say that no wild dogs will touch
    them.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Unkurta dies as a very old man while lying on his Churinga, leaves many others
    in a hole in the rocks nearby, and Unkurta men and women arise from them thereafter.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: A footnote states that in the Unmatjera tribe a very old man who can no longer
    perform ceremonies or look after the sacred storehouse is said to have lost his
    corroboree or to have no ertnatulunga and is buried in the ground straight away.
  category: other
  evidence_refs:
  - ev:10
