canonical_text:
  quote: ''
  summary: 'The passage first recounts two Oruntja brothers threatened by an atninga
    avenging party from Irnga: they fight, evade spears by diving into the ground,
    are ambushed and speared, and their detached growling hearts are finally burned.
    The second section describes Nanja beliefs: sacred trees, rocks, water-holes,
    or spots associated with ancestral spirit-parts, Churinga, reincarnation, tabooed
    local plants and animals, and related beliefs among Arunta, Kaitish, Unmatjera,
    Urabunna, and more northern tribes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The younger brother warns the older brother that an atninga, described as
    an avenging party, might come to kill them, and men approach from Irnga.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The younger brother says that they will not run away and will fight.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: At first the atninga men cannot spear the Oruntja because the Oruntja dive
    into the ground from side to side when spears are thrown.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two atninga men hide behind a bush and spear the Oruntja men when the Oruntja
    come near with their backs turned.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The hearts of the two Oruntjas come out and lie on the ground without the
    avengers knowing.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the avengers walk away, they hear the hearts growling and return because
    they think the Oruntja may not have been properly killed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The avengers repeatedly spear the bodies and break the heads, but the growling
    resumes whenever they move away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Two men remain hidden, see the growling hearts on the ground, take them, make
    a fire, and burn them until nothing remains; after this the Oruntjas cease troubling
    the men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Arunta account, every individual has a Nanja tree or rock where an
    old ancestor left a spirit-part when going down into the ground.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The spirit associated with the Churinga is said to haunt the Nanja spot until
    it chooses to enter a woman and undergo reincarnation.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Nanja rock or tree and its immediate surroundings are sacred; the associated
    individual may not kill or eat any plant or animal found there.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The text says that in essential features, with detail variations, the same
    idea is found among the Kaitish and Unmatjera tribes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Thungalla describes an ancestor associated with a tree beside a water-hole;
    the ancestor leaves Churinga out of sight of the water-hole, sits eating grass
    seed, dies, and the spirit passes between the Churinga place and the tree.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: A person periodically visits a Nanja tree or rock and clears a smooth space
    around it, removing bark and rubbish.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Among the Urabunna, every individual has a Nanja spot or Watthilli; one spot
    may be associated with more than one totem, and the associated people avoid injuring
    or eating things there.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: The more northern tribes are said to share the belief in spirit children left
    at certain spots who later undergo reincarnation, although they often lack a definite
    name for a tree or rock inhabited by a spirit.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: Trees along the Tennant Creek water-course are said to be inhabited by numerous
    spirit children, and women avoid striking them with hatchets lest a disturbed
    spirit enter the woman's body.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:18
  text: 'A rare northern example similar to Arunta belief is given: the Wollunqua
    headman''s spirit ancestor inhabited a special water-hole near Thapauerlu, where
    the Wollunqua itself lives.'
  category: relationship
  evidence_refs:
  - ev:9
