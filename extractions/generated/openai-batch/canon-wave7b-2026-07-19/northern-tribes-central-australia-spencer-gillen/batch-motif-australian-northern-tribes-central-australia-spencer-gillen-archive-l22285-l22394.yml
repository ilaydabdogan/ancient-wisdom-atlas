comparison_claims:
- id: claim:1
  claim: The passage states that Kaitish and Unmatjera beliefs share the essential
    Nanja idea found among the Arunta, while varying in details.
  claim_level: same_function
  target: Arunta Nanja belief compared with Kaitish and Unmatjera analogous beliefs
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The excerpt gives a detailed Kaitish example but does not provide a
    separate detailed Unmatjera example here.
- id: claim:2
  claim: The passage states that Urabunna Watthilli belief is fundamentally the same
    as Arunta Nanja belief, with examples involving shared totemic spots and specific
    taboos.
  claim_level: same_function
  target: Arunta Nanja belief compared with Urabunna Watthilli belief
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is internal to the ethnographic passage and does not
    establish historical origin.
- id: claim:3
  claim: The passage says more northern tribes agree with Arunta and Kaitish in the
    belief that spirit children are left at certain spots and later reincarnate, but
    differ because they usually lack a definite name for an inhabited tree or rock
    and often lack a constant one-spirit-to-one-tree association.
  claim_level: same_function
  target: Arunta and Kaitish Nanja belief compared with Warramunga, Tjingilli, Umbaia,
    and other northern tribal beliefs
  evidence_refs:
  - ev:9
  counter_evidence_refs:
  - ev:9
  confidence: high
  limitations: The same evidence also records differences in terminology and specificity
    of association, so the claim is limited to shared function rather than full identity.
