- id: motif:2
  label: Ground-entry evasion in combat
  taxonomy_refs: []
  basis: The Oruntja avoid thrown spears by diving into the ground from side to side.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The action is not described as an underworld journey or formal descent;
    it is a combat evasion episode.
- id: motif:3
  label: Detached vital organs remain active after bodily killing
  taxonomy_refs: []
  basis: After the Oruntja bodies are speared, their hearts come out, lie on the ground,
    and growl whenever the avengers leave.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not explicitly call the hearts souls or external life
    tokens.
- id: motif:4
  label: Final destruction by burning the remaining life-source
  taxonomy_refs: []
  basis: The avengers end the troubling of the Oruntja only after finding the detached
    hearts and burning them until nothing remains.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage frames the burning as stopping the Oruntjas, not as a sacrificial
    or purifying rite.
