canonical_text:
  quote: ''
  summary: The passage describes mortuary and mourning customs in which the dead man's
    weapons, hair, bands, Churinga, and whiskers are transferred or made into ritual
    objects. The gammona receives and uses the dead man's hair in connection with
    vengeance obligations, ritual fights, and exchanges of blood-rubbed hair-girdles
    or bands. Medicine men may identify a person blamed for the death, leading to
    an avenging party. The passage also compares tree burial and ground burial practices
    among Arunta, Unmatjera, Kaitish, and Dieri groups, including beliefs about the
    spirit of the deceased, reincarnation, and denial of tree burial to a law violator.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a man dies, his gammona takes possession of his spears and weapons.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An itia cuts off the dead man's hair, and the hair, fur-string, arm-bands,
    and forehead-bands are placed in a pitchi held by an unkulla man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The pitchi and its contents are passed from the itia to an elder sister of
    the dead man, then to the widow, and then to the gammona.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The gammona gives fur-bands to his unkulla men but keeps the dead man's hair
    and the small Churinga that the dead man carried.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dead man's hair is made by an itia into a waist-band, or among the Kaitish
    into a wailia-wailia with hair-string strands and feathered tips.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that wearing the hair-girdle or wailia-wailia is supposed
    to make the man's inward parts hot and savage, after which he must avenge the
    death of his ikuntera.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: A gammona who secures the dead man's hair is obliged to challenge another
    gammona to fight, and the challenge cannot be refused.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After two gammona men fight and cut one another on the thighs and shoulders,
    the challenger hands the dead man's hair to his opponent, and the quarrel passes
    from group to group.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: When two men each have a dead ikuntera's hair-girdle, they fight, rub the
    girdles in their own blood, and exchange them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Young gammonas may fight after older men and exchange blood-rubbed fur-bands
    that had been worn by the dead man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: With the help of medicine men, the gammona may learn who was considered the
    cause of his ikuntera's death and may organize an avenging party to kill that
    person.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The dead man's whiskers are usually cut off and made into a cigar-shaped akuntillia,
    decorated with charcoal, pipe-clay, and ochre, and worn as a charm under the arm-band.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: Tree burial before final ground burial is described as not practised among
    the Arunta but as a distinguishing custom of the Unmatjera and Kaitish.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage says that Unmatjera and Kaitish people may give less special respect
    to the remains of an infirm old man, associating bodily infirmity with an infirm
    spirit part.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage says people fear hurting the feelings of a strong man's spirit
    if he is not properly mourned.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: The passage says respect is paid to bodies of dead children and young women
    in the hope that the spirit will return and undergo reincarnation.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:17
  text: A young man who violated tribal law by taking a forbidden wife is buried directly
    in the ground rather than in a tree.
  category: action
  evidence_refs:
  - ev:9
