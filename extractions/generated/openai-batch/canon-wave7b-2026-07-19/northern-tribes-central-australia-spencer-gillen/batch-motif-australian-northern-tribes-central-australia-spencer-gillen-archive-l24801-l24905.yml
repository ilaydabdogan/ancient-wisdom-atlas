candidate_motifs:
- id: motif:1
  label: Mortuary transfer of the dead man's objects through kin
  taxonomy_refs: []
  basis: The passage gives a fixed sequence for transferring the dead man's hair,
    bands, and related objects through kin figures to the gammona, while the gammona
    also takes weapons.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This is a passage-specific mortuary custom; no broader taxonomy family
    is asserted.
- id: motif:2
  label: Corpse-hair object inciting vengeance
  taxonomy_refs: []
  basis: The dead man's hair is made into a girdle or wailia-wailia whose wearing
    is said to make the wearer hot and savage and to create a duty of vengeance.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage reports the belief and duty but does not explain a wider mythic
    origin for the object.
- id: motif:3
  label: Ritual combat and exchange of mourning relics
  taxonomy_refs: []
  basis: Gammonas fight, cut one another, pass on the dead man's hair, or exchange
    blood-rubbed hair-girdles and bands.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage describes a customary chain of fights and exchanges, not a
    narrative myth episode.
- id: motif:4
  label: Divination-like identification of death cause followed by vengeance
  taxonomy_refs: []
  basis: Medicine men assist the gammona in learning who caused the death, and the
    gammona then organizes an avenging party to kill the accused person.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not detail the method used by the medicine men.
- id: motif:5
  label: Body-part charm made from the deceased
  taxonomy_refs: []
  basis: The dead man's whiskers are made into an akuntillia charm, decorated and
    worn under an arm-band.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage identifies the object as a charm but gives limited information
    about its intended effect.
- id: motif:6
  label: Tree burial before final ground burial
  taxonomy_refs: []
  basis: Tree burial prior to placing bones in the ground is described as a distinguishing
    practice among Unmatjera and Kaitish in contrast to Arunta.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage describes mortuary placement, not a cosmic tree or axis motif.
- id: motif:7
  label: Mourning treatment shaped by spirit strength and reincarnation hope
  taxonomy_refs:
  - death_rebirth
  basis: The passage links respect for remains to beliefs about whether the spirit
    can cause harm and says children and young women are respected in hope that the
    spirit will return and undergo reincarnation.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The taxonomy reference applies only to the explicit reincarnation element;
    the passage does not present a full death-and-rebirth narrative cycle.
- id: motif:8
  label: Denial of elevated burial to a law violator
  taxonomy_refs: []
  basis: A young man who violated tribal law by taking a forbidden wife is buried
    directly in the ground rather than in trees.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage states the burial consequence but does not frame it as divine
    punishment.
comparison_claims:
- id: claim:1
  claim: Within the passage, tree burial before final ground burial is reported as
    a practice of the Unmatjera and Kaitish and explicitly contrasted with the Arunta,
    among whom it is not practised.
  claim_level: same_function
  target: Arunta versus Unmatjera and Kaitish mortuary practice
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal ethnographic contrast only; it does not establish
    historical contact or origin.
- id: claim:2
  claim: 'The passage contrasts treatment of old age and infirmity across nearby groups:
    Dieri old age carries respect, Arunta burial ceremonies for old men are described
    as identical regardless of infirmity, while Unmatjera and Kaitish are described
    as giving less special respect to remains of a decidedly infirm old man.'
  claim_level: same_function
  target: Dieri, Arunta, Unmatjera, and Kaitish treatment of elderly dead
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is limited to the ethnographer's summary in this passage
    and should not be generalized beyond it without review.
- id: claim:3
  claim: The passage's statement that spirits of dead children and young women are
    hoped to return and undergo reincarnation supports only a limited functional comparison
    with a death-rebirth motif family.
  claim_level: same_function
  target: death_rebirth motif family
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage mentions reincarnation as a belief connected to mortuary
    respect, not as a full mythic sequence of death and rebirth.
