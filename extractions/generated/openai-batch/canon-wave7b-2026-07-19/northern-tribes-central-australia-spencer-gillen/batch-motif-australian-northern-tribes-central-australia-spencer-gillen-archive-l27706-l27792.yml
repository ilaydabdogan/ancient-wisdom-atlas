canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing hair-related customs: a promised girl''s
    hair girdle for a youth''s initiation; rules about who cuts hair and toward what
    direction a man faces; betrothal practices using locks of whiskers worn under
    an arm-band and later carried by the promised girl; and uses of a dead man''s
    hair or whiskers in mourning, sacred restriction, and vengeance obligations.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Kaitish tribe, a girl promised as a wife makes from her own hair the
    girdle placed around the youth's waist when he passes through initiation as a
    wurtja.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that betrothal may occur before one or both future spouses
    are born.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'When hair is cut, the man must face a prescribed direction: among the Arunta
    toward his mother''s Alcheringa camping-place, and among Kaitish, Warramunga,
    and others toward the camp of his gamniona.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Unmatjera, a man's hair must be cut by his wife's brother; in the Warramunga,
    it is cut by a mother’s brother, who afterwards keeps it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In an observed Warramunga event, one man cut a lock of whiskers from another
    and gave it to a third man, who placed it beneath his arm-band; a reciprocal cutting
    and gift followed between other named section men.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage explains the whisker-lock gift as indicating that the man whose
    hair was cut will provide the recipient with a wife, with specified sister or
    sister's-daughter relations involved.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The whiskers worn under the arm-band are called an emblem of betrothal, makuiitalthi,
    and the cutting off of the whiskers is called tanunga.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The lock of hair is later given to the betrothed girl and carried by her as
    a sign of betrothal and as a magic charm against advances by other men.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A dead man's hair or whiskers are cut and made into named hair objects by
    several tribes; among Binbinga and coastal tribes, both are wrapped in paper bark
    and sent on an avenging expedition.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that such hair is sacred, not to be seen by women or children,
    and lawfully belongs to certain men such as sons-in-law or mother's brother's
    sons, who have the duty of avenging the dead man.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Hair is destroyed only when cut off as an emblem of mourning, and in that
    case it is immediately burnt.
  category: action
  evidence_refs:
  - ev:8
