canonical_text:
  quote: ''
  summary: The passage introduces an incomplete appendix list of material objects
    that give names to totemic groups among the tribes studied. It warns that such
    lists cannot safely be treated as complete, states that many material objects
    can function as totem names, links the distribution of totemic groups to the local
    distribution of animals and plants, rejects exclusive subsistence on single totemic
    species, and notes that totemic objects are often edible or useful but normally
    eaten by people outside the group named for them.
  language: English
  quote_policy: summarized
