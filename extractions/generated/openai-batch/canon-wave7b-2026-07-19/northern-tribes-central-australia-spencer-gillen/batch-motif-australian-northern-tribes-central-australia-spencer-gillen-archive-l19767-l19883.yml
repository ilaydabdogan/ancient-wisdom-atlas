canonical_text:
  quote: ''
  summary: 'The passage describes stages of the Warramunga Nathagura or fire ceremony:
    a red-ochred pole is erected and announced by a warning signal to women; men and
    women decorate themselves separately; women dance at the pole, men process around
    it, and later Uluuru and Kingilli men sing, decorate selected men, dance with
    torches near a bough shelter, and rush toward the women, who flee into their own
    shelter.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A special twenty-foot pole called wintai was red-ochred, topped with green
    gum-twigs, carried from the creek bed, and fixed upright on level ground between
    the men's camp and the women's ordinary camp.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before the pole was erected, the women were driven away; after it was in place,
    a leading Tjupila man behind it made a far-reaching chalapurtan sound as a signal
    that women must not approach until summoned.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men and women decorated themselves out of sight in the creek bed; Tjapeltjeri
    and Tjunguri men used black cross lines edged with white, other men used vertical
    yellow lines, and the women used yellow lines.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Tjupila man in charge painted a small shield with a median line, U-shaped
    black lines, and white dots; then women were summoned, danced around the pole,
    and some tried to climb it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Men came from the creek in single file, led by the Tjupila; Tjapeltjeri and
    Tjunguri men were partly hidden by bough carriers, Kingilli men beat shields on
    the ground, and the men passed around the pole before returning to camp.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Very early the next morning a bough wurley was built, and Uluuru men with
    a few Kingilli men remained inside for hours singing with beating boomerangs in
    stifling heat.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The singing inside the wurley referred to the progress of the fire ceremony
    across the country from the far north-east.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Kingilli men decorated five Uluuru men inside the wurley, while other Kingilli
    men danced outside and jeered at the Uluuru men within.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Long twig torches were placed against the wurley, lifted by Kingilli men,
    and used while twelve men danced and pranced in front of the opening, first facing
    the Uluuru men and then turning their backs on them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Near sunset, men painted themselves, cut slabs of bark from gum-trees, detoured
    behind the hidden women, rushed yelling, and the women fled into their bough wurley
    for shelter.
  category: sequence
  evidence_refs:
  - ev:9
