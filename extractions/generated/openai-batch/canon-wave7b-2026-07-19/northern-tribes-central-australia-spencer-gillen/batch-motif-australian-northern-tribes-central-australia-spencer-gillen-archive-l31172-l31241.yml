canonical_text:
  quote: ''
  summary: The passage describes several neck-bands, necklets, and a chest-band made
    from vegetable-fibre string, fur-string, wax, resin, ochre, pipe-clay, and animal
    incisor teeth. It notes variant uses and names among Anula, Mara, Warramunga,
    Arunta, and coastal groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wax is added to divide an original single loop into a larger loop worn around
    the neck and a smaller loop hanging down the back; the wax is soft enough to be
    broken and replaced.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same object is described as used as a waist-band in the Warramunga tribe
    and as a magic knout in the Arunta.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two closely similar neck-bands consist of two series of vegetable-fibre string
    strands, partly gathered and tied with fur-string, then enclosed together into
    a single structure passing around the front of the neck.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The loose strands of such a neck-band may sometimes be enclosed in wax.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A necklet with pendants of kangaroo or wallaby incisor teeth is found among
    coastal tribes and is called quiuru by the Mara.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each pendant of the quiuru necklet is made from a string with resin at both
    ends, with a kangaroo incisor fixed into each resin lump; the string is tied to
    the main band so the teeth hang on the chest when worn.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The quiuru string is more or less red-ochred, and the teeth are usually coated
    with pipe-clay so that they stand out clearly on dark skin.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Mara object called thalumanii is described as a chest-band with considerable
    variation in form, made from many vegetable-fibre strands wound into a circle
    and partly bound with fine string.
  category: object
  evidence_refs:
  - ev:4
