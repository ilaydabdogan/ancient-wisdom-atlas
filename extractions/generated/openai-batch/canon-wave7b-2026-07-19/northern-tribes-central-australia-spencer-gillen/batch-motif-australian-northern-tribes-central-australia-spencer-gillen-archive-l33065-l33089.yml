canonical_text:
  quote: ''
  summary: The passage explains ground-drawing elements associated with Tjinqurokora
    and a Black Snake or Thalaualla totemic ceremony. Concentric circles represent
    the Tjinqurokora water-hole and a nearby rock pool; curved bands represent the
    snake’s body as it moved about performing ceremonies. Another design is said to
    represent six Munga-munga women sent away from Tjinqurokora by the snake; they
    travel east carrying yams that are also their Churinga, and the drawing marks
    their bodies and drawn-up legs as they sit tired from walking.
  language: English
