canonical_text:
  quote: ''
  summary: The passage describes ground bone implements, fish-catching without hooks
    among central groups, fish-hook forms made from bone, wood, resin, bark fibre,
    and string among river groups to the north, and the absence or presence of boats
    in different Australian regions according to water conditions. It also notes a
    visual resemblance between some pitchis and boats.
  language: English
  quote_policy: summarized
