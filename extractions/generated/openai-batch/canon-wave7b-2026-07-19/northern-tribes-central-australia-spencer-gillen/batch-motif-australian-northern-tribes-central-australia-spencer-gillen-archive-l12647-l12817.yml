canonical_text:
  quote: In the Warramunga all of the ceremonies connected with a given totem are
    performed in a regular sequence.
  summary: The passage contrasts Warramunga and Arunta totemic ceremony practice.
    It describes Warramunga ceremonies as ordered reenactments of ancestral movements
    through named places, held collectively by the totem group, supervised by a headman,
    and performed only when requested by members of the other tribal half. It also
    lists moiety-divided ceremonies, notes the name thuthu, restricts witnessing to
    fully initiated men, and includes entries involving serpent totems, fire, a bone
    transfer, a mound ceremony, and subincision.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Among the Warramunga, ceremonies connected with a given totem are described
    as being performed in a regular sequence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ancestral pattern is described as an ancestor arising at one spot, moving
    through successive spots, and halting to perform ceremonies; descendants are expected
    to begin at the beginning and proceed through the series.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The witnessed black snake and Wollunqua series is said to have begun at the
    beginning of the recorded history of the ancestral snake and continued to the
    end of his wanderings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage contrasts Warramunga order with Arunta practice, where one or
    all ceremonies may be performed in any order.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the Arunta case, each separate ceremony is described as the property of
    a special individual; in the Warramunga case, ceremonies are described as the
    property of the whole totem group.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Warramunga headman is described as being in charge as representative of
    the totemic group, but unable to enact ceremonies on his own initiative.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Warramunga headman performs ceremonies only when requested by members
    of the half of the tribe to which he himself does not belong.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Warramunga series of totemic ceremonies are described as associated with,
    and at certain times performed as, Intichiuma ceremonies.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The list of performances includes totemic ceremonies and also ceremonies connected
    with initiation, bone-breaking, burial, and other acts, because certain ceremonies
    had reference to totems.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Totemic ceremonies proper are divided into two groups associated with the
    Uluuru and Kingilli moieties.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Each listed ceremony is associated with a special spot where the Alcheringa
    ancestor of the totemic group halted and performed.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Warramunga ceremonies are called thuthu and may only be witnessed by fully
