canonical_text:
  quote: ''
  summary: The passage describes an atninga avenging-party ceremony performed by men
    away from the main camp. Participants rehearse collective movements with shields,
    boomerangs, and spears; selected avengers have their thighs rubbed; a hair girdle
    from the dead man is applied to each avenger's mouth and penis; participants spurt
    blood over each other's thighs; spears are bundled and danced around; and the
    men who will kill perform a final dance, fall prostrate, and silently imitate
    mourning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ceremonies take place on a ceremonial ground among hills, away from the
    main camp and out of sight of women and children.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: All men in camp gather and perform ceremonies called atninga unterrima.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The men form a solid square and rush along the ground while holding shields,
    then repeat movements with boomerangs and finally with spears held aloft.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The brother of the dead man leads the men during the spear movement.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The men actually going on the expedition have their thighs rubbed by the seated
    group to make them lithe and active.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The expedition leader applies a waist-girdle made from the dead man's hair
    to each participant, placing one end at the mouth and the other at the penis,
    and embraces him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that contact with the dead man's hair is thought to make
    the avengers' inward parts burn with eagerness to avenge the murder.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The men open veins in their penes and allow blood to spurt over one another's
    thighs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The blood ceremony is said to strengthen participants, bind them together,
    and make treachery impossible.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The spears for the expedition are bundled together, held upright by two old
    men, and rattled while the others dance around with boomerangs behind their heads.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The men who will take part in the killing dance with hands clasped behind
    their heads, fall prostrate, and remain silent for several minutes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The final prostration and silence are described as an imitation of the mourning
    of the relatives of the intended victim.
  category: action
  evidence_refs:
  - ev:7
