canonical_text:
  quote: Throwing the novice up into the air.
  summary: 'The passage describes several initiation-related practices: ceremonies
    representing the end of cannibalism; the Unmatjera alkira-kiuma ceremony in which
    a boy is thrown into the air and disciplined by his future wife’s father; rules
    separating the boy from women’s and children’s spaces; circumcision rites involving
    male relatives, women’s dancing, secrecy, a fire-stick, seclusion, instruction
    in totemic ceremonies, and a Churinga given after the operation.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A ceremony is described in which one tribe represents a cannibal eagle-hawk
    as being killed, while another represents cannibal wild cats as being tamed; neither
    animal is eaten.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that ceremonies associated with the cessation of cannibalism
    occur during the final initiation ceremonies of both tribes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Unmatjera alkira-kiuma ceremony, a boy about twelve years old is taken
    into the bush, thrown into the air, and caught by men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy is not painted or decorated for the throwing-up ceremony.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy’s future wife’s father carries a stick and may strike him during the
    throwing-up if the boy has not provided him enough food from hunting.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The future wife’s father says words to the effect that he will teach the boy
    to give him meat.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the throwing-up ceremony, the boy is told not to go to the women’s camp,
    but to stay at the men’s camp, hunt with the men, and stop playing with boys and
    girls.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: For the circumcision ceremony, the boy is seized at night by men standing
    in specified kin relationships to him and is taken to a ceremonial ground where
    men and women are assembled.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Women dance at the ceremonial ground before the boy’s hair is tied up and
    a human hair-girdle is put around his waist.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The boy is instructed to stay covered and not look at anything unless told
    to watch.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The boy is warned that if he reveals the secrets to be told to him, the spirit
    Twanyirika will carry him away.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The boy’s mother gives him a fire-stick, which he is told not to lose or let
    go out; the threatened consequence is that he and his mother will be killed.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: After several days in the bush with an elder brother, the boy returns to the
    ceremonial ground, where men have been performing sacred ceremonies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Some sacred ceremonies are shown to the boy, and he learns secrets of the
    totems and the history of his totemic ancestors.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Elder men have rights to perform ceremonies belonging to their own totem or
    to totems inherited from a father or elder brother.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: The passage notes that sacred poles called nurtunja or waninga are customary
    in some Arunta ceremonies but are rare or absent among the Unmatjera and Kaitish
    tribes.
  category: object
  evidence_refs:
  - ev:8
- id: obs:17
  text: The circumcision operation is conducted by the boy’s father-in-law.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: After the operation, the boy’s elder brother gives him a Churinga belonging
    to his father and tells him it will help him recover.
  category: object
  evidence_refs:
  - ev:9
- id: obs:19
  text: The boy is warned not to lose the Churinga and not to show it to boys; the
    passage states violent consequences for losing it or showing it improperly.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:20
  text: The boy is told to hide in the bush and to jump over any woman’s track he
    sees.
  category: action
  evidence_refs:
  - ev:10
