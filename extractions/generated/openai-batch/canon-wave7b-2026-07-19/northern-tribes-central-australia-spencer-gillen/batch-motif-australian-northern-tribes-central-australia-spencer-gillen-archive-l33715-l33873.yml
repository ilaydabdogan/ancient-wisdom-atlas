canonical_text:
  quote: ''
  summary: Glossary entries define native terms for ancestral spirit individuals,
    mythic ancestral times, ritual objects and body ornaments, initiation-related
    statuses and ceremonies, evil magic, totemic animals and plants, spirit parts
    of individuals, sacred designs, moieties, medicine men, sky or woodland spirits,
    and ancestral episodes involving emergence from or descent into the ground, deposited
    Churinga, and crystals producing spirit children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mai-durli are described as spirit individuals left behind by ancestors of
    totemic groups and are also sometimes called murra-murra in the Urabunna tribe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mai-imva names the time in which mythic ancestors of the Worgaia tribe are
    supposed to have lived.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Several animals or plants are said to give their names to totemic groups,
    including a small snake, a large yam, a roller or rain bird, a large Varanid lizard,
    and a carpet snake.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:10
  - ev:15
  - ev:20
  - ev:21
- id: obs:4
  text: Special stones represent old male kangaroos, and the old male kangaroos are
    supposed at times to emanate from the stones.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Meltjinta is applied both to the coming up of ancestors out of the ground
    and to a ground drawing made in a ceremony associated with the place where that
    emergence occurred.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A ceremony named Mini-timburu is connected with building a mound that represents
    the sand-hill where the Wollunqua snake went down into the ground.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A large bundle named Mminirka is associated with the tappin ceremony and represents
    the Uluuru moiety giving light and warmth to men of the Kingilli moiety.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Minungara is the name given to two spirits inhabiting the sky in the Mara
    tribe.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: Mongura is defined as a sacred totemic design in the Warramunga tribe.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Mungai or mumgaii is applied in the Warramunga to the totemic animal, the
    totemic group, and spots especially associated with totemic ancestors; in Tjingilli
    and Binbinga it is applied to the far past times of mythic ancestors.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:11
  text: Certain women of the yam totem walked into Queensland carrying Churinga and
    deposited them at places where they left spirit individuals behind.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:12
  text: Muntulqua are small crystals said to have issued from bodies of ancestors
    of totemic groups and to have given rise to spirit children.
  category: relationship
  evidence_refs:
  - ev:22
- id: obs:13
  text: Terms in the glossary identify spirit parts of individuals in the Gnanji and
    Warramunga tribes.
  category: attribute
  evidence_refs:
  - ev:11
  - ev:17
  - ev:19
- id: obs:14
  text: Medicine men are named for the Mara, Anula, and Binbinga tribes, and one medicine-man
    term is also the name of an unfriendly spirit individual.
  category: relationship
  evidence_refs:
  - ev:18
- id: obs:15
  text: The glossary includes initiation or bodily-status terms related to circumcision,
    subincision, and female status after atna-ariltha-kuma.
  category: other
  evidence_refs:
  - ev:12
- id: obs:16
  text: Evil magic is named for the Worgaia, Gnanji, and northern tribes.
  category: other
  evidence_refs:
  - ev:13
