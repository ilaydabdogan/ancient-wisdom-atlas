canonical_text:
  quote: ''
  summary: A group attacks Irritja, who pleads that he does not eat black-fellows
    and tells them to kill Wantu-wantu and his children. Wantu-wantu and his children
    are killed, while Irritja is spared. The bell-bird urges the group to make body
    marks like his own, and they make the marks while singing the bell-bird song.
    The passage explains that Wilyaru cuts represent the bell-bird’s back and neck
    marks, and that present-day people avoid eating the hawk Wantu-wantu and the Irritja
    because of their Alcheringa actions.
