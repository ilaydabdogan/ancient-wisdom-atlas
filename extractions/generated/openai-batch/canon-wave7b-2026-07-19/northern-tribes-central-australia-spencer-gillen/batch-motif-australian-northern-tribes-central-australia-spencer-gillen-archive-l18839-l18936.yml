canonical_text:
  quote: ''
  summary: The passage describes Warramunga subincision initiation performed during
    a long series of sacred Wollunqua snake-totem ceremonies. Three youths are seized,
    instructed, guarded, witnessed by dancing women, placed on men lying on the ground,
    subincised by designated men, and then incorporated through post-operation acts
    including a father tying a hair-girdle, head-stroking with a tassel, and collection
    of blood in a pitchi; the blood is taken to the parents, who drink it. The rite
    is repeated for two other boys.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Warramunga, subincision is customarily performed after recovery
    from the earlier operation and during a large gathering of men engaged in sacred
    ceremonies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts Warramunga practice with Arunta practice, saying Warramunga
    perform a long series of ceremonies reviewing the Alcheringa history of one totemic
    ancestor rather than odd ceremonies at different times.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: At this time, men had spent more than a month performing ceremonies relating
    to Wollunqua, described as an important snake totem.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Old men decided that three young men should be subincised toward the close
    of the Wollunqua ceremonies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A specially and elaborately decorated mound was built to represent the old
    Wollunqua, and the three youths were suddenly seized and told that the time had
    come for final admission to the ranks of men.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The youths were one Thakomara and two Thungallas, each under the charge of
    men described as their naminni, or mother’s brother.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The guardians explained the meaning of the mound and warned the youths not
    to quarrel with or throw boomerangs at the men to whom it belonged.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: All night the men sang and danced around the mound, and during the night the
    mound was destroyed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At sunrise the boys were crouching behind bushes under guard, while older
    men sat nearby and women arranged themselves in two groups before the men.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Uluuru and Kingilli women danced in turn, jumping toward the men and making
    a distinctive flexing hand movement with palms upward.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: For the Thakomara youth, three Tjapeltjeri men lay on the ground, the youth
    was placed on them, a Thapungarti man sat on his stomach, a pubic tassel belonging
    to his father was pressed into his mouth, other men held his limbs, and a Thapungarti
    man performed the subincision.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the Thakomara youth’s operation, his father tied a hair-girdle around
    his waist, and the youth stroked the heads of specified men with the tassel used
    during the ceremony.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Thakomara youth sat on a pitchi so that blood from the wound flowed into
    it; the blood was then taken to the camp of his father and mother and drunk by
    them.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The same kind of performance was repeated for the two Thungalla boys, with
    men of specified groups lying down, supporting, sitting on, operating, and later
    taking the collected blood to the parents, who drank it.
  category: sequence
  evidence_refs:
  - ev:10
