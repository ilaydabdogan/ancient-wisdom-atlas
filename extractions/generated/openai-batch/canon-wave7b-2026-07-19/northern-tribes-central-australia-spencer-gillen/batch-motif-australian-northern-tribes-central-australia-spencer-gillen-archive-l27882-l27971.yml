canonical_text:
  quote: ''
  summary: 'The passage describes childbirth customs among several Central Australian
    groups: postbirth actions by the father, food brought to the mother, warming and
    passing a spear-thrower over the child, painted rings, singing by a maternal grandmother
    in difficult labor, treatment of the navel string, Warramunga silence taboos and
    exchanges, Binbinga cutting and burial of the cord and afterbirth, and stated
    practices of infanticide including a Luritja strength-transfer rationale.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the birth, the father goes into the scrub for three days, leaves behind
    his waist-girdle and arm-bands so nothing is tied tightly around his body, and
    collects animal food to bring back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder sister supplies the mother with vegetable food such as grass seed
    and yams while the father is away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On returning, the father warms a spear-thrower over the fire, passes it backwards
    and forwards over the child’s body, and paints black circles around the eyes and
    navel.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: If childbirth is difficult, the elder sister brings the maternal grandmother,
    who makes a nearby camp and sings there until the child is born.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The navel string is allowed to fall off, then wrapped in fur-string and tied
    around the child’s neck; together with the painted rings, it is said to keep the
    child quiet.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the Warramunga account, the mother goes to a special childbirth camp attended
    by specified female relatives, while specified male relatives are under a ban
    of silence until after the birth.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: About a week after birth, the mother carries the child to the father’s camp,
    shows it to him, and says that the child belongs to him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The father gives weapons to named relatives, and the mother releases them
    from the silence ban by hitting their heads with a twig.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Warramunga account, the navel string is tied around the child’s neck,
    later given to the wife’s brother or child’s naminni, worn in his armlet, exchanged
    in a sequence of gifts, and eventually placed in a hollow tree known only to him.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: In the Binbinga account, an elder sister cuts the umbilical cord with a stone
    knife, ties the end with fur-string, and buries the cord and afterbirth in a hole
    without ceremony.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that infanticide is practised in all the tribes, with no
    difference by sex, usually because another child is still being suckled by the
    mother.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Among the Luritja, the passage states that a healthy child may be killed to
    feed a weaker elder child, with the stated idea that the former child’s strength
    will pass to and benefit the latter.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: A footnote states that in the Arunta tribe, when delivery is difficult, the
    father removes his girdle, which a second man carries to the mother and winds
    around her waist to assist delivery.
  category: action
  evidence_refs:
  - ev:8
