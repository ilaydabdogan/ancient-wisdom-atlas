canonical_text:
  quote: ''
  summary: 'The passage describes ceremonial and customary circumstances in several
    Central Australian tribes in which women are offered, lent, or interchanged among
    men: after ceremonial mound or object making, during Warramunga mortuary bone
    retrieval and messenger missions, in some messenger visits, in encounters involving
    potential vengeance, and when strangers visit distant groups. It contrasts these
    exceptional practices with ordinary marriage restrictions and with Urabunna group
    marriage.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ceremonial mound was made by Tjupila, Thakomara, Thungalla, and Tjambin
    men; the related ceremony belonged to Tjapeltjeri men and was associated with
    Thapungarti men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men associated with the mound ceremony offered the use of their women to the
    men who had made the mound, though most of the invited groups declined in the
    described instance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On another occasion, an elaborate ceremonial object was made by members of
    one half of the tribe; the other moiety was absent, and interchange and lending
    of women occurred among the named makers, with indiscriminate lending on other
    nights.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Warramunga tribe, women are customarily lent to men sent to bring in
    the bones of a dead person before the final burial ceremony; the lender is the
    deceased person's father or a tribal father.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A dead man's bone may be sent with sacred messengers to summon other groups
    to ceremonies, and in that context women are lent to the messengers and a general
    interchange occurs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In some tribes, messengers take women with them, deliver a message, and leave
    the women in the bush, where local men may visit them if they accept the invitation
    or request of the messengers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A party of men who has gone out intending to kill someone may be offered women
    by men of the strange group; acceptance means the quarrel is over, while refusal
    signals intent to exact vengeance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that irregular intercourse is allowed only in connection
    with ceremonies or messenger-sending; outside ordinary lawful-wife groups, intercourse
    is otherwise described as a grave offence punishable by death.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: When strangers visit a distant group, they are usually offered women from
    a group equivalent to that from which the visitor's lawful wife would come in
    his own tribe, and the passage emphasizes a distinction between intermarriageable
    and non-intermarriageable groups.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:10
- id: obs:10
  text: The passage contrasts Urabunna group marriage, in which groups of men and
    women have marital relations under normal conditions, with other tribes where
    individual wives prevail but are modified by wider relations at certain times.
  category: relationship
  evidence_refs:
  - ev:9
