  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A restricted food item or food-associated object was provided by a Thapungarti
    woman, decorated with red ochre and yellow lines, and delivered by an old Thakomara
    man while avoiding Thapanunga or Tjunguri men, who were not allowed to see the
    food.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ceremony called kuntamara is described as a repetition of subincision
    intended to make the cut more complete.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the Warramunga practice described, newly initiated youths and older men
    gather, and every man cuts himself or is cut by someone else.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Participants use sharp flakes of stone or glass and cut until blood flows
    freely; newly initiated youths follow the adult men’s example.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The stated objects of the kuntamara custom are to assist the boys’ recovery,
    strengthen the bond among the men, and help the youths grow into approved adult
    men.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: The kuntamara is described as less solemn than parra or subincision, with
    proceedings conducted without strict order and with men of different classes mixed
    together and assisting one another.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the cutting, the Thakomara youth touches his actual father’s head with
    blood from himself, then strokes the head of a very old Thakomara grandfather
    with a green twig.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: For several weeks, sacred totemic ceremonies are enacted daily, and the youths
    watch under guardians who stand with an arm around each boy and explain what everything
    means.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the close of ceremonies connected with the Thalaualla black-snake totem,
    two Thungalla boys are placed among decorated men seated on a ground drawing representing
    the snake; the performers’ headdresses are removed and used to strike the boys’
    stomachs repeatedly.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Ten days after the operation, a Thakomara youth receives a boomerang, armlets,
    and forehead-band from a Tjunguri man identified as his tribal sister’s son.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Four men representing groups in the opposite moiety pass the boomerang through
    their waist-girdles, and each then passes it through the novice’s girdle; the
    passage states that this signifies entry into the ranks of men and participation
    in hunting and fighting.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A later ceremony near the close of the series is said to show that the boys
    had passed out of the hands of the lubras and may also warn them about disobeying
    instructions and going near the lubras’ camp.
  category: sequence
  evidence_refs:
  - ev:9
