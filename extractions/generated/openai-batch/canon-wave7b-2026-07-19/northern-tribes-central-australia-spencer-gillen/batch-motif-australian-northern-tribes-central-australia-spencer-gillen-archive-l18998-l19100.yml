canonical_text:
  quote: ''
  summary: 'The passage describes parts of a Warramunga initiation sequence: a novice
    with fur-string tied around the arm; restricted decorated food associated with
    blood after the operation; the kuntamara recutting rite; mutual cutting and bloodletting
    among initiated youths and adult men; contact with father and grandfather using
    blood and a leafy twig; daily sacred totemic instruction; a black-snake totem
    ceremony; presentation and ritual use of a boomerang, armlets, and forehead-band;
    and a later ceremony marking separation from the women’s camp and obedience to
    instructions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A figure caption identifies the tying of fur-string around a novice’s arm,
