canonical_text:
  quote: The whole ceremony was a curious mixture of license and restraint.
  summary: 'The passage describes parts of the Warramunga Nathagura fire ceremony:
    ritual joking, insults, dancing, women and children singing by fires, dawn painting
    and procession, temporary separation of men and women while younger men remain
    under old men''s charge, continuing nightly banter, and the making of twelve large
    dry-foliage torches called wanmanmiri by Kingilli men.'
