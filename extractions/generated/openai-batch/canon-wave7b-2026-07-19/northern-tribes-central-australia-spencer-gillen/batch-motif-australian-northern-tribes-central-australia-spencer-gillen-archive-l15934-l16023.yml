canonical_text:
  quote: ''
  summary: The passage reports traditions and comparative ethnographic notes about
    Churinga and allied sacred objects among the Warramunga, Binbinga, Anula, Mara,
    Urabunna, Arunta, Ilpirra, Iliaura, Unmatjera, and Kaitish. It narrates the Warramunga
    origin of the murtu-murtu Churinga from Murtu-murtu, an ancestral man attacked
    by two wild dogs, whose scattered flesh becomes trees from which the objects are
    made. It also summarizes initiation uses and separate origin accounts involving
    Dingo men and a whirlwind.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Warramunga tradition concerns the origin of Churinga or murtu-murtu and
    is said to recall, in certain respects, a Kaitish tradition about the men Tumana.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Murtu-murtu lived in the Wingara, had a round body, unusual feet, and a tuft
    of hair, and originally came out of the earth at Kalkara.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Murtu-murtu spent his time performing sacred ceremonies and making a noise
    like that of a murtu-murtu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two large wild dogs from Alkanara travelled southward, heard Murtu-murtu's
    noise, and followed it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: As the wild dogs travelled, they formed deposits of red ochre where they voided
    excreta; they also performed sacred ceremonies and left spirit children at places
    along the way.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The two wild dogs approached Murtu-murtu from different directions, attacked
    him, bit pieces of flesh from him, and threw the pieces around.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The flying pieces of flesh made a bull-roarer-like noise, and where each piece
    fell, a Naiantha tree sprang up.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After tearing Murtu-murtu's body to pieces, the dogs saw trees arising and
    tried unsuccessfully to destroy his spirit by biting the trees.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that the Churinga called murtu-murtu are now made from
    the wood of the Naiantha trees.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Binbinga, Anula, and Mara tribes, Churinga are described as rarely
    seen and mainly evident during initiation, when one is given to a boy to carry,
    help heal the wound, and be twirled to warn off women and children.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says that in the Binbinga, Mara, and Anula tribes Churinga lack
    the significance described for the Arunta and Gnanji, and that these tribes have
    no sacred or Churinga names.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the Binbinga tribe, the origin of Churinga is attributed to two Dingo men
    of the Alcheringa, who also introduced the use of a stone knife at circumcision
    and carried sacred sticks called watmnurra.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the Anula tribe, the whirlwind is said to have first made the Churinga
    called murra-murra; the object carried by the initiated youth is eventually buried
    in a hole representing a mungai spot of the whirlwind.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage compares Churinga across several tribes, stating that they are
    few and not specially totem-associated among the Urabunna, but numerous and closely
    associated with Alcheringa ancestors among the Arunta, Ilpirra, Iliaura, and Unmatjera.
  category: relationship
  evidence_refs:
  - ev:10
