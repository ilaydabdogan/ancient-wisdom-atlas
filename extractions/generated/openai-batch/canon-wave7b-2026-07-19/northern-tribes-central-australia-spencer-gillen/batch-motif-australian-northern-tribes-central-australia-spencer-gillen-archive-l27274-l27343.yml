canonical_text:
  quote: ''
  summary: The passage recounts an Alcheringa origin account in which two Mantera
    snake-totem brothers knock out each other's teeth, spit out blood, bury the teeth,
    and a water-hole arises at the spot. A later same-totem man, Ilungunjia, hears
    of the practice from old snakes and teaches others to imitate it. The passage
    then describes Warramunga tooth-knocking practice, including who may perform it,
    its season and water-hole setting, preparatory water actions by girls, the use
    of stick and stone to knock out the tooth, and application of hot gum leaves afterward.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Alcheringa, two brothers of the Mantera snake totem arose at Arinpera-lakilika,
    a place glossed as meaning “mouth, teeth broken.”
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder brother proposed pulling out their teeth, while the younger refused
    pulling and said he would knock his tooth out.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The brothers made a small hole in the ground; each in turn lay with his head
    in the hole while the other used a stick and a stone to knock out a tooth.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: After the operations, the brothers commented on their appearance, spat blood
    onto the ground, buried their teeth, and a large water-hole arose to mark the
    spot.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ilungunjia, another man of the same totem, heard about tooth-knocking from
    old snakes and taught other people to do it because the snakes had done it in
    the Alcheringa.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Among the Warramunga, men comparatively seldom have teeth knocked out, while
    women are frequently encountered with one or two teeth out.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Any elder woman may operate on young women and girls, and any elder man may
    operate on younger men and boys; the operation may occur from early youth to middle
    age.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The operation usually takes place near the close of the wet season, when water-holes
    are full, and is always performed on the bank of a water-hole.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the witnessed case, women and children gathered by a water-hole, avoided
    the area where men were preparing a sacred ceremony, and two or three fires were
    lit on arrival.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Each girl entered the water up to near her breasts, scooped and drank water,
    held it briefly in her mouth, spat it out in all directions, splashed herself,
    and wet the crown of her head.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Each girl then lay on the sandy bank with her head in a small hole; one woman
    pressed back the gums while another knocked out the tooth with a short stick and
    stone, after which hot gum leaves were applied to the mouth.
  category: sequence
  evidence_refs:
  - ev:9
