canonical_text:
  quote: ''
  summary: The passage describes the making and interpretation of ground-drawings
    for Wollunqua totemic ceremonies and the beginning of a related Thalaualla black
    snake totemic description. Men prepare smoothed, ochred ground, draw bands and
    circles, add pipe-clay dots while singing, cover the drawing, and later explain
    it to younger men. The interpreted designs represent named places, snake movements,
    wells, trees, spirit individuals or children, fire first made by two hawks, springs,
    a tree, a man striking the snake, and a black snake wandering near a creek.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ceremonial ground surface is smoothed, sprinkled with water, rubbed by
    hand, allowed to harden, and painted with yellow or red ochre.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A leading man outlines bands or circles with red ochre or grease and charcoal,
    and younger men add pipe-clay dots while singing about the Wollunqua in the Alcheringa.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The completed design is covered with gum boughs until after the ceremony;
    the boughs are removed and the design's meaning is explained to younger men.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: At Tikomeri, the old snake lifts himself at a native well and tries to go
    down into the earth, but stops because the ground is too hard.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Tikomeri design uses circles for the well, curved bands for the snake's
    neck turning, other bands for shed skins of small snakes, and separate circle
    series for trees containing spirit individuals.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the Parapakini black design, circles represent Tjinkaringia, where the
    snake stopped to look around, and curved bands represent the snake doing this.
  category: relationship
  evidence_refs:
