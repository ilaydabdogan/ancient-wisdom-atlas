  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Three series of concentric circles in the red design represent two springs
    of water and a tree connected with where the hawks cooked and ate white ants and
    threw away the remains.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: At Ununtumura, the Wollunqua ceases wandering, dives into the earth, and returns
    to his home at Thapauerlu.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Ununtumura design uses a long curved band for the snake, circles for Ununtumura,
    and separate concentric circles for paper-bark trees and bushes in which spirit
    children were left.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: A man who lived with the snake follows him, stands beside him at Ununtumura,
