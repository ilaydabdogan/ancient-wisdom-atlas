    moving about.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the Parapakini red design, the Wollunqua meets two hawks, Warapula and
    Kirkalanji, who are reported to have made fire for the first time in the Warramunga
    tribe by rubbing two sticks together.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the red design, circles and radiating curved bands represent the fire made
    by the hawks at Mintili, with the bands indicating fire spreading in different
