canonical_text:
  quote: ''
  summary: 'The passage describes named features in a gorge associated with Alcheringa
    beings and totemic ancestors: wild oranges left by a bandicoot woman, a pinnacle
    and cave linked to an old bat man who left boomerangs, a Kulpu ancestor moving
    along ranges, water-holes and a blocked gorge entrance, spirit children in creekside
    trees, and a cave made by two old Thapungarti men. It ends with a description
    of Thapauerlu pool, red quartzite rocks, and rainy-season water flow.'
  language: English
  quote_policy: summarized
