canonical_text:
  quote: ''
  summary: The passage describes post-death camp removal, a mound marking the death-place,
    fear of spirits near the site, and a sequence of Warramunga mourning duties involving
    male thigh-gashing, hair cutting, pipe-clay, embracing and wailing, widows' seclusion,
    women's scalp-cutting with yam-sticks, sham fights, and searing of wounds with
    a fire-stick.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A small mound of earth called kakiti was piled on the spot where the man had
    died, and the ground around it was smoothed.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Camps were moved a considerable distance from the death scene because people
    wished to avoid the dead man's spirit and the spirit of the person believed to
    have caused the death by evil magic.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The spirit of the death-causing man was expected to visit the place in the
    form of an animal.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The next day, mourning ceremonies were performed because omitting them would
    show disrespect and displease the dead man's spirit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Men of specified classes and relationships gashed their thighs in a mourning
    operation called kulungara, producing lasting scars.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Some men cut off and burned their hair, smeared their scalps with pipe-clay,
