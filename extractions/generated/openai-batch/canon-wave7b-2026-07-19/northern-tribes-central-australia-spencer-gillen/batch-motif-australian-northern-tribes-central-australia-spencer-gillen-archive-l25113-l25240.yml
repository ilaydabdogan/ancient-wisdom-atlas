  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The widows had everything taken from them except their yam-sticks.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: An old man struck the women's yam-sticks with a club before they sat down
    together and embraced.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Women wailed and cut their scalps with yam-sticks during the mourning proceedings.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
- id: obs:12
  text: Women from the camp came out in small bands carrying yam-sticks, performed
    sham fights, then sat in groups weeping and wailing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Actual and tribal female relatives of the dead man again cut their scalps
    open with yam-sticks.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The actual widows later seared the scalp wound with a red-hot fire-stick.
  category: action
  evidence_refs:
