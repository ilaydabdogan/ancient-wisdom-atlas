  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Groups of men and women embraced one another while weeping, howling, and moaning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dead man's two widows left the old camp, cut off all their hair, smeared
