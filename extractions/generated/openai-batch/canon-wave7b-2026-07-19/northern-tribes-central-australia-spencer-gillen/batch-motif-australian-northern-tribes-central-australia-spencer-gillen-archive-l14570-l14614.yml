canonical_text:
  quote: ''
  summary: The passage describes Wollunqua totem ceremonies and their ground designs.
    Bands, circles, wells, trees, and tracks are explained as representations of the
    Wollunqua snake’s travel, pauses, wells, and places where he left spirit children.
    The final and most important ceremony concerns Ununtumurra, where Wollunqua’s
    wanderings ceased; another ceremony concerns the rock-hole Miradji. The Ununtumurra
    design includes a long black charcoal band, concentric circles, curved bands,
    and imitated human footprints.
