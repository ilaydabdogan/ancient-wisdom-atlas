canonical_text:
  quote: ''
  summary: An illustrations list names water-holes, Churinga objects, totems, and
    ceremonies among several Central Australian tribes. It includes the Wollunqua
    snake at a Warramunga water-hole, representational stones used on younger men,
    returning of Churinga, Churinga associated with body parts, yams, and snake totems,
    and ceremonies or preparations connected with Snake and Black-Snake totemic groups.
  language: English
  quote_policy: summarized
