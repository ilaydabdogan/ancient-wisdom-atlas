  text: Thapauerlu is identified as a water-hole in the Murchison Range where the
    Wollunqua snake is supposed by the Warramunga tribe to live.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two younger men are described as being rubbed by an older man with stones
