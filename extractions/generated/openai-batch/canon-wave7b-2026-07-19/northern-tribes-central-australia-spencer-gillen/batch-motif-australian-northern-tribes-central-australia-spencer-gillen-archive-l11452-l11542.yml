canonical_text:
  quote: ''
  summary: The passage describes Kaitish and Unmatjera rules governing the eating
    or use of totemic animals, plants, and water, especially the need for permission
    from the relevant totemic group and the responsibility of totem members to provide
    supplies for others. It contrasts these customs with Arunta Intichiuma practice
    and discusses difficult-to-explain Intichiuma totems such as celestial bodies,
    darkness, flies, and mosquitos.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Unmatjera and Kaitish people are said to recognize
    a definite relationship between a man and his totem regarding both his own eating
    of it and other people's eating of it.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
- id: obs:2
  text: In the Arunta comparison, after the totemic headman performs Intichiuma and
    secures increase of the totemic animal or plant, he does not eat it, or eats it
    sparingly, and does not kill it if it is an animal, while nonmembers may do so
    without further reference to him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Kaitish and Unmatjera example, an emu man who gathers grass seed in
    a grass-seed totem locality brings it to the grass-seed headman and asks permission
    before eating it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that if the emu man ate the grass seed without first asking
    permission, he would become very ill and probably die.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: When an animal is killed by someone who does not belong to that totem, it
    is cooked and brought to a man of that totem, who eats a little before the other
    men may eat it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: An emu totem man alone in the scrub will not touch an emu, but if he is with
    men of other totems he may kill the emu and must hand it over to them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A water totem man alone may drink water he obtains for himself, but when with
    men of other totems he must not obtain water for himself and instead receives
    it from someone in the opposite moiety, often his umbirna.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage generalizes that totem members are regarded as responsible for
    ensuring a supply of the totemic animal or plant, while nonmembers recognize that
    they need permission from the relevant totemic men before eating it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage lists certain totems whose Intichiuma ceremonies are difficult
    to explain, including sun, evening star, stone, darkness, flies, and mosquitos.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Flies and mosquitos are described as objectionable in themselves but closely
    associated with the heavy rainfall desired at certain times of year.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: For evening star Intichiuma, the answer reported is that the fathers performed
    it and therefore it must continue; the authors add that some such totemic groups
    may be of relatively late origin and may have taken over Intichiuma from animal
    and plant totems.
  category: speech
  evidence_refs:
  - ev:8
