canonical_text:
  quote: ''
  summary: 'A burial and mourning sequence is described: an arm-bone in paper-bark
    covering and a meat offering are ceremonially brought to seated mourners; women
    kneel and wail while men bow silently. The bone is entrusted to an older woman
    and hidden in her shelter until a later final ceremony. After seventeen days,
    following sacred snake-totem ceremonies, a ground drawing of an old snake, a water-hole,
    and sacred trees associated with spirit children is made; decorated men participate,
    women are excluded from the sacred performance, and a trench and pit are prepared
    for the final burial rites.'
  language: English
  quote_policy: summarized
