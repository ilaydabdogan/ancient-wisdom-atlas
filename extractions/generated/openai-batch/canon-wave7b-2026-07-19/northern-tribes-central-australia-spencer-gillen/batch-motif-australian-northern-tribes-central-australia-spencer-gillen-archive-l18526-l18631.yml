- id: ev:6
  type: summary
  locator: lines 18584-18595
  quote_or_summary: Wagarithimina, of the Thakomara class and wind totem, is caught
    by elder brothers and told he must cease being a boy in the women’s camp and become
    a young man; they and Thungalla men take him to camp in the bush.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/northern-tribes-central-australia-spencer-gillen.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 18595-18602
  quote_or_summary: His father performs sacred wind-totem ceremonies that Wagarithimina
    cannot see; at night a Thungalla man wakes him by striking his chest with a hair-girdle
    and tells him to remain silent unless spoken to.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/northern-tribes-central-australia-spencer-gillen.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 18602-18608
  quote_or_summary: The Thungalla man greases and paints the boy with red ochre, ties
    a hair-girdle around him, places women’s head-rings on him, paints him with totem
    designs, and says the designs will make him grow big and strong.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/northern-tribes-central-australia-spencer-gillen.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 18608-18616
  quote_or_summary: A Tjapeltjeri man winds fur-string bands around Wagarithimina’s
    neck; his elder brother and several class-related men take him to the women’s
    station while dancing and singing, and Thakomara and Thungalla women run around
    him shouting.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/northern-tribes-central-australia-spencer-gillen.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 18617-18625
  quote_or_summary: Thungalla women decorate Wagarithimina with rings, opossum fur-string
    necklets, and crosswise strands; a tjurtalia woman, his future wife’s mother,
    gives him a fire-stick and instructs him about dirty water, avoiding snakes, preserving
    the fire-stick, and avoiding long grass or scrub.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/northern-tribes-central-australia-spencer-gillen.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 18625-18631
  quote_or_summary: Thungalla men take Wagarithimina to Irrungirri; later he camps
    with Tjunguri men who feed him bandicoots and sugar-bag, then other Tjunguri men,
    and then Thapungarti men while hunting wallabies and searching for sugar-bags.
  source_text_path: texts/public-domain/australian-aboriginal/project-gutenberg/northern-tribes-central-australia-spencer-gillen.md
  rights_note: Public domain source; summarized.
