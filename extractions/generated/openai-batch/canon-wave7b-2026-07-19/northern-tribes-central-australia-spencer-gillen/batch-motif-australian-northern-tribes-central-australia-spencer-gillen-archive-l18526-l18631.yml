candidate_motifs:
- id: motif:1
  label: initiation regulated by bull-roarer sound
  taxonomy_refs:
  - initiation
  basis: Atnatu’s connection to initiation is expressed through the proper sounding
    of the bull-roarer or Churinga, and boys are told to keep it sounding so that
    he hears it.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage describes this within Kaitish belief and does not generalize
    it to all rites in the passage.
- id: motif:2
  label: supernatural punishment for ritual failure
  taxonomy_refs:
  - divine_judgment
  basis: When the men fail to maintain the ritual sound, Atnatu becomes angry, kills
    them with spears, and is currently believed able to spear people if he does not
    hear the bull-roarer.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: medium
  cautions: Atnatu is not explicitly classified as a deity in the passage; the taxonomy
    reference is used cautiously for a supernatural sanctioning pattern.
- id: motif:3
  label: ascent to sky followed by revival
  taxonomy_refs:
  - ascent
  - resurrection
  basis: Atnatu drags killed men into the sky and brings most of them back to life
    there, where they remain unseen from earth.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage does not state that the revived men return to earth.
- id: motif:4
  label: seclusion and social transformation of an adolescent male
  taxonomy_refs:
  - initiation
  basis: Wagarithimina is told to cease being a boy in the women’s camp, is taken
    into the bush, placed under male control, instructed in silence, adorned, and
    moved through ceremonial stages.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage describes a social and ritual transition; it does not explicitly
    use symbolic death-and-rebirth language.
- id: motif:5
  label: initiation taboos attached to fire, water, and snakes
  taxonomy_refs:
  - initiation
  basis: The future wife’s mother gives Wagarithimina a fire-stick and instructs him
    to drink only dirty water, avoid snakes and hidden snake places, and keep the
    fire-stick alight.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage reports the instructions without explaining their symbolic
    meaning.
- id: motif:6
  label: restricted ritual knowledge and gendered explanation of sound
  taxonomy_refs:
  - initiation
  basis: Women are kept apart in the Kaitish account and are taught that Tumana makes
    the ritual noise, while the male ritual explanation involves Atnatu and the bull-roarer
    or Churinga.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: medium
  cautions: The passage gives only a brief account of what women are taught and does
    not elaborate the full restricted knowledge system.
