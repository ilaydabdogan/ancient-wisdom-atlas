canonical_text:
  quote: ''
  summary: The passage describes Atnatu’s association with Kaitish initiation and
    the bull-roarer, including a tradition in which he kills men who fail to keep
    the sacred sound going, takes them to the sky, revives most of them, and remains
    pleased or angered by the sound. It then describes Warramunga initiation procedures
    for Wagarithimina, including removal from the women’s camp, seclusion, silence,
    body painting, decorations, female presentation, a fire-stick and taboos concerning
    water and snakes, and movement among affinal male groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Atnatu is said to be closely associated with Kaitish initiation, to have given
    boys two stone knives, and to listen for the bull-roarer to be properly sounded.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In an Alcheringa account at Irribilia, men were initiating boys while women
    sat at Urtitjeritjera some distance away; the men became tired and stopped sounding
    the bull-roarer.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Atnatu became angry when the sound ceased, gathered a rattling bundle of spears,
    and after the men again stopped the sound and cut the boys without the sacred
    Churinga swinging, he hurled spears down on the men, killed them, and dragged
    them into the sky.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tradition says Atnatu ate one young etwakurka, found the flesh unsuitable,
    did not eat the others, brought them back to life in the sky, and they remained
    there unseen from earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The women, hearing no bull-roarer and no singing, ran to the place and found
    tracks and blood but no other trace of the men.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports a current belief that when Atnatu hears the bull-roarer
    on earth he is pleased, makes his own sound, and initiates a young man in the
    sky; if he does not hear it, he becomes angry and may spear people on earth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A boy is told to keep swinging the Churinga in the bush so that Atnatu can
    hear it and remain in a good humour.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Women are taught that the ritual noise is made by a spirit called Tumana,
    whom they regard similarly to the way Arunta women and children regard Twanyirika.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that initiation rites among the Warramunga, Walpari, Wulmala,
    Tjingilli, and Umbaia are very similar, with the Warramunga rite described as
    typical; it also notes that a ceremony equivalent to throwing the boy up in the
    air is absent in these tribes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Wagarithimina, a young man of the Thakomara class and wind totem, was taken
    by his elder brothers, told to cease living as a boy in the women’s camp, and
    told to become a young man who hunts and joins tribal ceremonies.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Wagarithimina’s elder brothers and Thungalla men took him to camp in the bush;
    during the day his father performed sacred wind-totem ceremonies that the youth
    was not allowed to see.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: At night a Thungalla man struck Wagarithimina on the chest with a hair-girdle,
    woke him, and ordered him to remain silent unless spoken to by the men in charge.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The same man greased and painted Wagarithimina with red ochre, tied a hair-girdle
    around his waist, placed women’s head-rings on him, and painted totem designs
    on his front and back, saying the designs would make him big and strong.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: A Tjapeltjeri man wound fur-string bands around Wagarithimina’s neck, after
    which male relatives and class-related men took him to the women’s station while
    dancing and singing; Thakomara and Thungalla women ran around him shouting.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Thungalla women removed the fur-string from his neck, placed their own rings
    on his head, and decorated him with opossum fur-string necklets and crosswise
    strands.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: A woman who was tjurtalia to Wagarithimina, identified as the mother of his
    future wife, gave him a fire-stick and instructed him not to drink clean water,
    to drink only dirty water, to avoid snakes and places where snakes might be hidden,
    and not to let the fire-stick go out.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: Afterward Thungalla men took him to Irrungirri; later he stayed with Tjunguri
    men who fed him bandicoots and sugar-bag, then with other Tjunguri men, and then
    with Thapungarti men while hunting wallabies and searching for sugar-bags.
  category: sequence
  evidence_refs:
  - ev:11
