canonical_text:
  quote: ''
  summary: The passage discusses Churinga/allongalla and related sacred objects among
    Arunta, Unmatjera, and Kaitish groups. It describes Churinga stored in sacred
    places, a conditional recovery of a stolen Churinga by an iruntarinia, a tradition
    in which Unkurra suffocates Engwura performers with smoke from burning resin,
    Kaitish storage and guardianship of allongalla, and an ancestral account in which
    rain-totem originators' whiskers remain as rocks on Arumbia hill.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People are described as repeatedly passing between two old camping grounds
    and temporarily leaving their Churinga in an Ertnatulunga where two old men had
    placed them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A footnote states that if a Kurdaitcha or other evil-disposed individual steals
    a Churinga, the iruntarinia of the man to whom it belongs follows the thief and
    recovers the Churinga.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Unmatjera are said to share the same idea about Churinga and, like the
    Arunta, to perform the Engwura ceremony.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A tradition refers to an old man named Unkurra, of the Porcupine-grass resin
    totem, who saw men performing the Engwura ceremony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Engwura performers had erected a nurtunja and were dancing around it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Unkurra lighted a fire, burned his resin on it, produced smoke, and the performers
    were suffocated.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the Kaitish tribe, Churinga are called allongalla and are kept in a sacred
    storehouse called an amomna under the charge of the headman of the local totemic
    group, called Ilpilpa-antiana.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The neighbourhood of Kaitish sacred storehouses is described as sacred ground
    where nothing may be destroyed and as the haunt of spirit individuals associated
    with the Churinga.
  category: setting
  evidence_refs:
  - ev:3
