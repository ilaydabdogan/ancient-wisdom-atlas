canonical_text:
  quote: ''
  summary: The passage describes incised ornamentation on boomerangs and related implements.
    It distinguishes a non-red-ochred ornamented boomerang type traded from interior
    Queensland toward Lake Eyre and southern Arunta country from red-ochred central
    Australian examples. It then describes several Arunta boomerangs with paired grooves,
    bands, zigzags, curved and straight incised lines, a gouge-like pattern that can
    resemble floral, leaf, caterpillar, or map-mountain forms, and a large fighting
    boomerang divided into decorated sections.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some boomerang incisions are arranged to form patterns, while other ornamentation
    described earlier is said not to form a pattern.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A distinct ornamented boomerang type is described as traded from interior
    Queensland southward toward the Lake Eyre district and northward through Urabunna
    into southern Arunta country.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The traded type is described as not red-ochred, unlike boomerangs indigenous
    to the central area, which are described as red-ochred.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Arunta specimens obtained by C. E. Cowle are described as lacking the
    usual flutings and having an abundant coating of red ochre.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The simplest described Arunta form has many pairs of short straight grooves
    roughly and irregularly arranged along transverse lines.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Other examples arrange grooves into alternate smooth and incised bands, grouped
    or scattered grooves, smooth bands with curved incised lines, or mixed straight
    and curved line groups.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: For some examples, the passage says there is a slight attempt to arrange line
    series into groups but no definite pattern is formed.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The reverse side of the Fig. 275 boomerang is described as having gouge-like
    zigzag incisions whose paired series produce a distinct floral-looking design.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that one part of the design looks like an attempt to imitate
    a fern frond or perhaps a cycad leaf.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that a modified form of the design calls to mind a caterpillar
    or conventional mountains shown on maps.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The weapon with this design is described as pure native workmanship with no
    trace of white influence or white tools.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: A note reports that similar decoration occurs on many implements near Lake
    Frome, while the Central Australian specimen differs by having a thick coat of
    red ochre.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The large fighting boomerang in Fig. 277 is described as divided into sections
    with rows, groove groups, central lines, angled pairs of short lines, smooth bands,
    curved lines, and zigzag groups.
  category: object
  evidence_refs:
  - ev:7
