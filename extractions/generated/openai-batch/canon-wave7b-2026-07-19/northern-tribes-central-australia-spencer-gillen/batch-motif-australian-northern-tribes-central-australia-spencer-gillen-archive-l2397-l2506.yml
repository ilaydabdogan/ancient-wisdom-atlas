canonical_text:
  quote: ''
  summary: The passage describes change and continuity among central Australian tribes,
    then focuses on ritual governance. Elder local-group and totem-group heads, not
    chiefs, direct major ceremonies through informal councils. Examples are given
    from the Arunta engwura and from a long Warramunga ceremonial cycle that included
    totemic rites, burials, initiations, and a fire ceremony. A Worgaia medicine man
    recognized as purntuku, or great teacher, directs Wollunqua ceremonies by drawing
    a design and instructing others. A note identifies Wollunqua as a huge mythic
    snake and totemic ancestor. The passage also describes younger men’s deference
    to elder leaders and an incident in which a younger medicine man loses his powers
    after trying to strike an elder.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Arunta are described as relatively slow to be affected by change and as
    probably retaining customs and beliefs once more widely held; the eight-class-name
    system is described as entering the Arunta from the north and spreading southward.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the central tribes described, no person is properly called chief or
    head of the tribe; elder heads of local groups lead major ceremonial gatherings
    and control proceedings, while younger men have no decision-making role.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the Arunta engwura, an old alatunja led the camp because the ceremony was
    held in the country of his local totem group; he and three elders formed a cabinet,
    withdrew to a secluded creek-bed spot, discussed ceremonies, and gave orders.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Warramunga ceremonial cycle witnessed by the authors extended over three
    months and included totemic ceremonies, final burial rites for two individuals,
    initiation of three young men, and a fire ceremony.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Five elder men with specific class and totem affiliations formed an informal
    Warramunga council that controlled proceedings and decided who should perform
    ceremonies.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: One member of the Warramunga ceremonial leadership was a Worgaia man, a distinguished
    medicine man, recognized as purntuku, a term equated with Arunta oknirabata or
    great teacher.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Worgaia purntuku took the lead in Wollunqua ceremonies by coming to the
    ceremonial ground each morning, drawing a design in outline, giving instructions,
    and retiring.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wollunqua is identified in a note as a huge mythic snake and the ancestor
    of a totemic group.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Leading totem-group headmen are sometimes addressed as purntuku by younger
    men, who treat them with great deference.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A younger medicine man who attempted to strike an older man is said to have
    immediately lost his medical powers.
  category: sequence
  evidence_refs:
  - ev:6
