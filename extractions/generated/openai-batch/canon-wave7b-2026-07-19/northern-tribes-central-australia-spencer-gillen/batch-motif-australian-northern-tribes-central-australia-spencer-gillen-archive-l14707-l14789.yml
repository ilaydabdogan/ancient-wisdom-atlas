canonical_text:
  quote: Every prominent feature of any kind was associated with some tradition of
    their past.
  summary: An ethnographic party travels with older native guides toward Thapauerlu,
    the great centre of the Wollunqua totem. Along the route, guides identify ranges,
    hills, rock columns, water-holes, trees, cliffs, and gorges as places associated
    with totemic ancestors, spirit children, fire-making, restoration to life, ascent
    to the sky, and descent into the ground.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The party travels with older natives, including two headmen, to Thapauerlu,
    described as the great centre of the Wollunqua totem.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Prominent natural features along the route are identified by the older men
    as associated with traditions of the past.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: A range is said to mark the path traversed by the great ancestor of the Pittongu,
    or bat, totem.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A solitary rock column is said to represent an opossum man who rested, looked
    around, and left spirit children behind.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: White quartzite hills are said to indicate white ant eggs thrown by the Munga-munga
    women in the Wingara.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A flat-topped hill and a water-hole are associated with the Wongana, or crow,
    ancestor; the water-hole is also said to contain crow spirit children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Two hawks are said to have first made fire by rubbing sticks together, and
    two gum trees mark the place where they stood.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A fire made by the hawks crept upon the moon-man and a bandicoot woman, burnt
    the woman, and the moon-man restored her to life; the two then went up into the
    sky.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A red cliff called Tjiti is associated with an old woman digging for yams;
    heaps of stones indicate the yams, and a stone column marks where she went into
    the earth.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Two water-holes above Wiarminni are connected with a fish totem and are said
    to be where two fish men arose, fought, left spirit children, and went into the
    ground.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The surrounding water-holes, gorges, and crags are described as peopled with
    spirit individuals left by named totemic ancestors, whose lines of travel form
    a network over the countryside.
  category: setting
  evidence_refs:
  - ev:8
