canonical_text:
  quote: "“the great father of all of the snakes”"
  summary: The passage describes Wollunqua totem ceremonies, including earth designs
    representing the mythical snake’s travel, spirit-child localities, Mumumanungara’s
    pursuit and striking of the snake, the snake’s dive into the earth and return
    to Thapauerlu, the ceremonial mound, a burial association, and the authors’ account
    of Wollunqua as a dominant serpent totem and progenitor.
  language: English
  quote_policy: quoted
literal_observations:
