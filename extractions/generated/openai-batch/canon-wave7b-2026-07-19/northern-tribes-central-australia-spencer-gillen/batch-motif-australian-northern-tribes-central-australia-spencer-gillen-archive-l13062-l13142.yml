  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage recounts that in the Alcheringa a Tjintilli lizard man lived in
    Kaitish country, stayed near a hill between the Bonny and Dixon Creeks, travelled
    north to Kulpara, performed ceremonies there, and made the first tjintilli.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The first tjintilli is said to have been made from Barkala bushes that had
