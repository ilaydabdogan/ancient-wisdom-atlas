- id: obs:3
  text: The passage states that the ceremonies keep tribal traditions alive and pass
    them from generation to generation.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that among the Warramunga the ceremonies are associated
    with maintaining the food supply, because each totemic group is responsible for
    the material object whose name it bears.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The authors say they will describe Kingilli ceremonies belonging to the Utu,
    Kati, Thaballa, and Itjilpi totems, and also Wonna and Miniurka ceremonies performed
    in conjunction with ordinary totemic ceremonies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In every case described, Kingilli men were requested to perform their ceremonies
    by Uluuru men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that normally the head of a totem group is asked to perform
    by men who are wankilli to him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the Itjilpi example, the headman, a Thakomara, is asked by Thapungarti
    men to perform; after consenting, he asks them to decorate him and later gives
    them honey bag as litjingara.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Muntikera example, a Tjunguri headman is asked by Tjupila men, who
    provide decoration materials and paint him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says a common distinguishing feature of Kingilli ceremonies is
    that every performer carries a tjintilli on either thigh.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Each tjintilli consists of a central stick about a yard long with attached
    leafy green gum-twigs; its free end passes through the waist girdle, and the performer
    holds and presses it down on the thigh while dancing and running with a high-knee
    action.
  category: object
  evidence_refs:
