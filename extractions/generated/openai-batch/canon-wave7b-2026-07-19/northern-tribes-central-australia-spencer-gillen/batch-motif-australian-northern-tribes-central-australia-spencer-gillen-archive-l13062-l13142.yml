canonical_text:
  quote: '"every totemic group is held responsible for the maintenance of the material
    object the name of which it bears."'
  summary: The passage enumerates unfinished Warramunga totemic ceremonies, explains
    their importance for transmitting tribal traditions and maintaining food supply,
    describes reciprocal arrangements for Kingilli ceremonies requested and decorated
    by Uluuru or wankilli men, details the tjintilli objects worn by Kingilli performers,
    and recounts a vague Alcheringa tradition in which a Tjintilli lizard man made
    the first tjintilli at Kulpara.
  language: English
  quote_policy: quoted
