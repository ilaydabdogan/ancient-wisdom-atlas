literal_observations:
- id: obs:1
  text: Children of the speaker’s elder and younger Murungun men of the same generation
    level call the speaker by the same term as the speaker’s own children; the speaker
    classifies them as Murungun and calls them sons and daughters by the terms given
    in the passage.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker distinguishes sisters’ sons and daughters from children classified
    as sons and daughters, using separate terms for sisters’ sons and sisters’ daughters.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The term for sisters’ sons is also applied by Murungun beta men to Kuial
    alpha men in two generation levels: fathers of women lawful as wives and sons
    of the speaker’s sisters.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The children of the speaker’s sons are Murungun like the speaker, and a reciprocal
    term is used between them and the speaker.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The children of the speaker’s daughters and brothers’ daughters are Purdal
    beta, and a reciprocal term is used between them and the speaker; the passage
