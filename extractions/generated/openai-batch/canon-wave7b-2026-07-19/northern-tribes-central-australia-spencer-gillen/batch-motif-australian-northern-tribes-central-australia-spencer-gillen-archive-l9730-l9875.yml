  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The passage contrasts male-side and female-side grandparent or grandchild
    terminology: one reciprocal term is used on the male side and another on the female
    side.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The speaker’s great-grandchildren through male grandsons are classified as
    Murungun alpha and are given a separate term; the children of a daughter’s daughter
    are Mumbali alpha and are given another term.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speaker’s mother’s mother is Mumbali and is called by one term, while
    the father’s mother is Kuial beta and is called by another term.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: For a Murungun beta woman speaker, husband and wife use the same reciprocal
    term for one another; she uses a separate term for her husband’s sisters and different
    child terms from those used by her husband.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: For a Murungun beta woman speaker, terms for husband’s father, husband’s mother,
    son’s wife, son’s children, daughter’s husband, daughter’s children, and mother’s
    mother’s brother are listed with their corresponding subclasses or reciprocal
    terms.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that Mara kin terminology generally agrees with Warramunga
    usage but has important differences, including a greater number of terms in Mara.
  category: relationship
  evidence_refs:
  - ev:7
