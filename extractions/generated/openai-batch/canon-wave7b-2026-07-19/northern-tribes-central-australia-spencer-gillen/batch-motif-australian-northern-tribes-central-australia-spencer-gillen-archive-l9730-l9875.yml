  summary: The passage gives a first-person account of Mara kinship terminology by
    subclass, generation level, sex of speaker, descent side, and affinal relationship.
    It then compares Mara kin terms with Warramunga usage, emphasizing that Mara terms
    are more numerous and more tightly restricted to subclasses.
