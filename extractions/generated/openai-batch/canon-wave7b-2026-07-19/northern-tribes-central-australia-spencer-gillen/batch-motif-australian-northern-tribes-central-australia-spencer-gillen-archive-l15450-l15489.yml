canonical_text:
  quote: ''
  summary: 'The passage describes the condition and treatment of several Churinga,
    including broken wooden examples tipped with resin and an example associated with
    a Bukhara woman of the Untjalka grub totem whose design has been worn away by
    grease and red ochre. It then states that Unmatjera beliefs about Churinga are
    practically identical with those of the Arunta: the objects are called Churinga,
    stored in secret places called ertnatulunga under a totem headman called Inquatitja,
    and each has an associated spirit. A cited tradition says Unthurkapunda of the
    grass-seed totem and an old Kumara man exchanged Churinga and carried them to
    their respective camps.'
  language: English
  quote_policy: summarized
