canonical_text:
  quote: ''
  summary: 'The passage describes several blood-related practices among named northern
    central Australian groups: blood after circumcision or subincision is handled
    by kin in different ways; Warramunga older men perform a blood-drawing ceremony
    before a newly initiated youth to aid healing; blood may be given to sick people
    to drink or rubbed on them to impart strength; and some blood-giving relationships
    create temporary taboos that are later ended through gestures and food offerings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A younger man is tabooed to an older man until the older man releases the
    ban of silence by singing over the younger man's mouth; the ceremony is usually
    accompanied by a gift, generally food, from younger to elder.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Blood drawn from circumcision or subincision wounds is treated in special
    ways that vary by tribe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Arunta example, operation blood is taken back to camp and given to
    the wife of an elder brother of the boy, who rubs some on herself and on female
    kin; the boy's mother is not allowed to see the blood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Warramunga example, the operation blood is taken to the mother, who
    drinks some of it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Binbinga and Gulf-side example, the blood is wrapped in paper bark,
    carried to the mother, and buried on the bank of a water-hole, where it is said
    to make lilies grow abundantly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Warramunga ceremony called kuntamara involves older men drawing blood
    from their subincised urethras in the presence of a newly initiated youth a few
    days after his subincision.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The stated object of the kuntamara ceremony is to promote healing of the youth's
    wound and strengthen him generally.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that both men and women may be given blood to drink when
    ill, with the stated idea of imparting some strength of the blood-giver to the
    patient.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In a serious Warramunga illness case, old women identified as the sick man's
    tribal mothers and father's sisters remained with him; blood was drained into
    a pitchi, rubbed on his body, and given to him to drink.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Kaitish custom, a gammona, described as a daughter's husband, may open
    a vein in his arm and let blood flow into the sick man's mouth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A Kaitish daughter-in-law, actual or tribal, may draw blood from the labia,
    carry it in a pitchi to the sick father-in-law, and the patient drinks some, eats
    a grub rubbed in it, and has the remainder smeared on his body before grease and
    red ochre are added.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the father-in-law recovers, a food exchange between him and the daughter-in-law
    is performed; until it occurs, they are strictly tabooed to one another.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After a gammona gives blood to an ikuntera, the gammona is tabooed for a time;
    after recovery, the elder man secures meat, the gammona searches for honey-bag,
    the elder pats the gammona's bowed head, and they exchange and eat their food
    offerings.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: An unkulla, described as a father's sister's son, may draw blood from his
    penis into a spear-thrower and give it to a sick man to drink; after the patient's
    recovery, the unkulla presents honey to indicate the ban of silence is broken.
  category: sequence
  evidence_refs:
  - ev:9
