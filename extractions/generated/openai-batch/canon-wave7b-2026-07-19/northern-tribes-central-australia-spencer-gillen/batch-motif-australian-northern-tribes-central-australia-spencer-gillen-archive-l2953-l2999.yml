  - ev:3
- id: obs:5
  text: Before initiation, up to about age fourteen, a boy is described as free to
    wander in the bush, search for food, play with companions, and watch ordinary
    corrobborees.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: From initiation onward, a male life is described as sharply divided into an
    ordinary part and a sacred or secret part.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The ordinary part of adult male life is associated with obtaining food, performing
    corrobborees, and occasional fights.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: As the man grows older, sacred or secret matters take an increasing share
