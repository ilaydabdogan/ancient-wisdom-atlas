  summary: The passage describes marital punishment and divorce, betrothal, women’s
    scars, boys’ freedom before initiation, the division of male life after initiation
    into ordinary and sacred or secret parts, sacred ceremonies connected with ancestral
    beings, and a belief that the spirit returns after death to an old alcheringa
    home before reincarnation.
  language: English
