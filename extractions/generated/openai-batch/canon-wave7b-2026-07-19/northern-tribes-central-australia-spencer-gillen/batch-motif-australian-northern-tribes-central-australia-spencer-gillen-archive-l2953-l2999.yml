- id: obs:1
  text: A described punishment procedure involves cutting by the former husband, possible
    rough treatment of the woman, and the aggrieved husband giving up his right to
    the woman after the punishment is inflicted openly.
  category: sequence
  evidence_refs:
  - ev:1
