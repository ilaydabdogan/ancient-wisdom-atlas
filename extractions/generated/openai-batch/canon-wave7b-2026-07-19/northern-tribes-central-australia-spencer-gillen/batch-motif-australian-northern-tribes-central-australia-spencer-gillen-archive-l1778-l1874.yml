canonical_text:
  quote: ''
  summary: The passage gives a geographic and ethnographic description of northern
    Central Australia from the M‘Douall/McDouall Range and Tennant Creek northward
    to Powell Creek, Newcastle Waters, the Ashburton Range, and the plateau edge toward
    the Gulf of Carpentaria. It notes water sources, vegetation, seasonal ground conditions,
    tribal territories of the Warramunga and Tjingilli, and a quarry used for stone
    tools.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The M‘Douall Range is crossed through a gap, with Tennant Creek telegraph
    station immediately north on a desolate ant-hill plain near a dry creek fringed
    by gum-trees and scrub.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The McDouall Range and the Murchison are described as strongholds of the Warramunga
    tribe, with northern Warramunga groups roaming farther north around Phillips Creek,
    Attack Creek, and Renner’s Springs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Between Tennant Creek and Powell Creek the country includes loamy plains,
    mulga scrub, stunted gums, porcupine and spear grass, and creeks that run from
    low sandstone ranges and disappear on the eastern plains.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Renner’s Springs, fresh warm water bubbles up from black-coloured soil
    and is soon lost on the surrounding plain; nearby is a quarry for stone used in
    flaked knives and picks.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Renner’s Springs is stated to be approximately the northern boundary of the
    Warramunga and the southern boundary of the Tjingilli tribe.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The Downs are described as gently undulating country with seasonal contrast:
    dry-season cracks and rainy-season bogs in which water spreads widely and travel
    becomes difficult and dangerous.'
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Vegetation north to Powell Creek is described as mainly mulga, stunted gums,
    mallee gums, shrubs, river-course eucalypts, pines, fig-trees, and Capparis; Bauhinia
    trees first appear at Powell Creek.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Newcastle Waters consists of a chain of water-holes which join during floods
    and send surplus water southward to form Lake Woods; when observed, the pools
    were separated and milky-coloured because of suspended clay.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The country around Newcastle Waters is identified as the home of the Tjingilli
    tribe.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: From Newcastle Waters eastward the land rises gradually toward a watershed
    and plateau edge, with valleys cut by rivers flowing toward the Gulf of Carpentaria.
  category: setting
  evidence_refs:
  - ev:7
