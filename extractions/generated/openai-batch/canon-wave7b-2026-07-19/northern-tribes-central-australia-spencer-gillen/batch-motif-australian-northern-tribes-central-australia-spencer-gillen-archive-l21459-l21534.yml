canonical_text:
  quote: ''
  summary: Pittongu, described as a flying fox and Thapanunga man, travels through
    named country, desires two young women who are not proper wives for him, feigns
    injury, changes into a dog to approach them, guides them northward while hunting
    wallabies, returns to human form, and forcibly throws the women ahead by tangling
    their hair with his spear-thrower. During later travel he knocks out teeth, leaves
    spirit children, leaves the women near Pine Creek, goes into the sky, is brought
    down by boomerangs, and drops stone tools in named regions, explaining local crafts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pittongu is introduced in the Wingara as a flying fox and a Thapanunga man
    who arose north of the Warramunga country and travelled south near Altunga in
    the eastern Macdonnell Ranges.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: He encountered people with women among them, including two young women named
    Naralu and Nungalla, and wanted those two as wives although the passage says neither
    was his proper wife.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: He killed a bandicoot, put blood on his foot, and pretended to be lame so
    that he would seem unable to travel farther.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the men went hunting and the women remained in camp, he went out of sight,
    changed himself into a dog, and returned to the women’s camp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The older women saw the dog, called to it, and left it alone when it would
    not approach them and snarled.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the two younger women returned at dusk, the dog wagged its tail, played
    around them, and stayed with them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The dog refused to continue when the women tried several directions, but walked
    with them when they turned northward, the direction from which Pittongu had come.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The dog led the hunting, rounded up wallabies, drove them into holes, and
    filled the holes’ mouths with stones.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After going ahead out of sight, the dog changed back into a man and returned
    to retrieve spears and boomerangs hidden in the scrub.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The women caught many wallabies, were surprised not to see the dog, and were
    frightened when the man approached; he told them he had made the wallabies enter
    the holes.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: When the women refused to walk along his country, he used his spear-thrower
    to tangle their hair together and threw them ahead to Athalta.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: At Athalta and near Thapauerlu he knocked out teeth to make himself better-looking,
    and the passage says he was the first man to knock teeth out.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: He carried evil magic, spears, tomahawks, stone knives, and other implements
    while travelling.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: As he travelled, he left spirit children behind him and repeatedly threw the
    two women ahead, finally leaving them at Pine Creek before going up into the sky.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: A group of men threw boomerangs with their right hands without hitting him;
    when they threw with their left hands he fell down.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: As he fell, the men told him to fall with his head looking toward the Warramunga,
    and the passage says his legs stretched beyond Pine Creek.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: When passing over named countries he dropped stone axes, stone knives, and
    barbed spears, and the passage uses this to explain why people in those places
    are especially skilled at making those objects.
  category: sequence
  evidence_refs:
  - ev:8
