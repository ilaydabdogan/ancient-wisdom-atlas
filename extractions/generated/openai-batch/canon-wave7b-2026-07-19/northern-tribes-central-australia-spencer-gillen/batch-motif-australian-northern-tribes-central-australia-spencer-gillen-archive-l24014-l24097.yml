canonical_text:
  quote: ''
  summary: The passage describes Central Australian beliefs concerning ancestral beings,
    superior beings, moral sanction, initiation instruction, reincarnation, the Warramunga
    Wollunqua ceremony, and bull-roarer explanations. It emphasizes the absence of
    a supreme moral judge, notes Wollunqua as a propitiated mythic snake exception,
    and compares bull-roarer spirit explanations with Baiame and Daramulun traditions
    in eastern and southeastern Australia.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Central Australian people do not appeal to or propitiate
    Alcheringa ancestors, except in the case of Wollunqua among the Warramunga.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wollunqua is described as a mythic creature and is explicitly regarded as
    a snake, not a human being.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the described tribes have no supreme being who rewards
    or punishes people according to moral conduct.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that future happiness or punishment based on conduct is
    foreign to these beliefs, and that every deceased person returns to the place
    where he or she lived in the Alcheringa and may later reincarnate.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: During initiation, a youth is told rules of conduct and understands that punishment
    for breaking them comes from older men rather than a supreme being.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After initiation, the youth learns that the spirit creature he had regarded
    as powerful is considered a myth invented by men to frighten women and children.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Atnatu is mentioned as a possible exception among the Kaitish, but the passage
    says Atnatu is not connected with moral precepts and is only pleased or displeased
    according to whether the bull-roarer sounds during initiation.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says there is apparently no equivalent of Baiame or Daramulun
    among the twenty central and north-central tribes when those beings are understood
    as supreme beings, all-fathers, or moral inculcators.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:10
- id: obs:9
  text: A hypothetical Warramunga explanation says Wollunqua is great, made creeks,
    trees, hills, and people, and becomes sulky if the dance is not performed but
    glad if it is performed.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: A hypothetical explanation of the bull-roarer says Murtu-Murtu was a big figure
    in Wingara time who first made the bull-roarer, and that it is shown when a boy
    is cut.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The footnote says women and children are taught that the sound of the bull-roarer
    during initiation is the voice of a great spirit that has come to take the youth
    away.
  category: speech
  evidence_refs:
  - ev:10
