candidate_motifs:
- id: motif:1
  label: Totemic ceremonies centred on ancestral history
  taxonomy_refs: []
  basis: The passage describes Intichiuma or related ceremonies as referring to totemic
    ancestors or Alcheringa history.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: This is a passage-level ethnographic pattern rather than a single narrative
    episode.
- id: motif:2
  label: Rain-making through ritual treatment and release of an animal
  taxonomy_refs: []
  basis: The Tjingilli rite uses a bandicoot that is sung over until weak and released,
    after which rain is expected.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage explicitly states that the authors could not obtain an explanation
    for the bandicoot-rain relationship.
- id: motif:3
  label: Rain-making through powdered crystals from a distant rain figure
  taxonomy_refs: []
  basis: The Gnanji use hi-oka crystals sent by a great rain man, pulverise them,
    scatter the powder, and request rain and fish.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives the ritual action but little narrative background for
    the great rain man.
- id: motif:4
  label: Ritual increase by scattering or projecting material in all directions
  taxonomy_refs: []
  basis: Honey-bag stone powder, kangaroo-rite embers, and broken mangrove sticks
    are scattered, blown, or thrown as part of increase rites.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:10
  confidence: high
  cautions: The materials and target species differ across rites, so this is a functional
    pattern rather than a single identical ceremony.
- id: motif:5
  label: Ancestral object or animal becomes a place-based source of species
  taxonomy_refs: []
  basis: A honey-bag stone is tied to an ancestor’s descent place, dugongs emanate
    from rocks representing an ancestral episode, and crocodiles come from a stone
    in a water-hole where the crocodile descended.
  evidence_refs:
  - ev:5
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage treats each case within its local totemic setting; broader
    equivalence should be reviewed.
- id: motif:6
  label: Ancestral animal forms landscape and ceremonial resources
  taxonomy_refs: []
  basis: The crocodile makes Batten Creek and waterholes, leaves spirit children,
    and its excreta produce pipe-clay deposits used in ceremonies.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: No wider comparative classification is asserted beyond the local account.
- id: motif:7
  label: Speech directed to animals to relocate or increase them
  taxonomy_refs: []
  basis: During the kangaroo rite, performers verbally address the kangaroos and tell
    them to go to the country where they are lacking.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The motif is limited here to the kangaroo rite.
- id: motif:8
  label: Singing and throwing at rocks to bring out animals
  taxonomy_refs: []
  basis: Dugong men bring out dugongs by singing and throwing sticks at rocks, while
    crocodile men sing the rock and throw broken mangrove sticks at it to increase
    crocodiles.
  evidence_refs:
  - ev:8
  - ev:10
  confidence: high
  cautions: The passage says the crocodile case has very much the same idea as the
    dugong case, but the mythic backgrounds differ.
comparison_claims:
- id: claim:1
  claim: The passage explicitly states that Tjingilli and Umbaia Intichiuma ceremonies
    are identical in nature with those of the Warramunga, in that they consist of
    a long series of ceremonies referring to totemic ancestors.
  claim_level: same_motif
  target: Warramunga Intichiuma ceremonies
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives the comparison at a general level and does not list
    the full ceremony sequences for all groups here.
- id: claim:2
  claim: The passage compares coastal Gulf totemic ceremonies with interior ceremonies,
    saying they share concern with Alcheringa history and old totemic ancestors but
    differ because the coastal ceremonies are not performed for increasing food supply
    in the same obligatory way.
  claim_level: same_function
  target: Interior Kaitish, Warramunga, and Tjingilli totemic ceremonies
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The claim follows the passage’s own ethnographic comparison; local
    variation is only briefly summarized.
- id: claim:3
  claim: The dugong and crocodile rites share a function in which specialized men
    sing and throw sticks or stick pieces at rocks associated with the species in
    order to bring out or increase the animals.
  claim_level: same_function
  target: Anula dugong rite and crocodile rite
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The passage itself says the crocodile case has a very similar idea
    to the dugong case, but the origin narratives and settings are different.
