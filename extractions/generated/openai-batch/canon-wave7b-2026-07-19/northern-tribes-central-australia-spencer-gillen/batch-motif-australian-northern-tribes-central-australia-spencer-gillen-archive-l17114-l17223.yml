canonical_text:
  quote: ''
  summary: The passage describes Intichiuma and related rain- and food-increase ceremonies
    among several northern Central Australian and Gulf-area groups. It includes Tjingilli
    and Gnanji rain-making, Mara honey and kangaroo increase rites, Anula dugong traditions
    and rites, and a crocodile ancestor tradition connected with waterholes, pipe-clay,
    and a rock from which crocodiles emerge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Tjingilli and Umbaia Intichiuma ceremonies are described as identical
    in nature with Warramunga ceremonies and as consisting of a long series of ceremonies
    referring to totemic ancestors.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Tjingilli rain-making ceremony can only be performed by Liaritji men; it
    involves catching a fat bandicoot without injuring it, wrapping it in paper-bark,
    carrying it in a pitchi, singing over it until it becomes thin and weak, and then
    letting it go.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says that rain is supposed to follow the release of the weakened
    bandicoot, and that the authors could not obtain an explanation of the relationship
    between the bandicoot and rain.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: For rain, the Gnanji use hi-oka crystals said to be sent by a great rain man
    far to the north; they pulverise the crystals, throw the powder in all directions,
    and request rain to come with fish.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Coastal Gulf tribes are said to retain totemic ceremonies concerned with Alcheringa
    history and old totemic ancestors, but not to perform them for increasing food
    supply in the same way as some interior groups.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Mara honey-bag increase rite is connected with a large heavy stone on Barramunda
    Creek that represents a large honey bag carried by the old ancestor and left where
    he went down into the ground.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Murungun and Mumbali men can increase bees and honey by striking powder from
    the honey-bag stone and blowing it in all directions; the scattered powder is
    said to give rise to bees.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A Mara plain-kangaroo increase rite involves obtaining permission from Purdal
    and Quial men in a place with many kangaroos, collecting pillinjirri grass and
    kangaroo dung, layering them on cleared ground, setting them on fire, scattering
    embers with lit green bushes, and addressing the kangaroos to go to the performers’
    country.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In an Anula dugong tradition, a dugong moved up the Limmen River from Kulambirri
    while people armed with spears pursued it in a canoe, wanting to kill and eat
    it; the dugong tried to return toward a mob of dugongs near the sea.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the present time in the dugong account, a large tree represents the natives,
    a big stone represents the dugong, and smaller white stones visible at low tide
    represent the mob of dugongs.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Dugongs are said to emanate from the rocks without human help, but dugong
    men can bring them out by singing and throwing sticks at the rocks.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A crocodile called imurrumburra arose at Yalko, wandered about making Batten
    Creek and its waterholes, left spirit children at different places, and produced
    pipe-clay deposits from its excreta.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The crocodile went down into the ground at Wankilli, where a water-hole has
    a stone in its middle from which crocodiles now come.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: Crocodile men alone can perform the increase rite; they sing the rock, break
    mangrove sticks into small pieces, and throw the pieces at the rock.
  category: action
  evidence_refs:
  - ev:10
