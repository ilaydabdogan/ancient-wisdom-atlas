canonical_text:
  quote: ''
  summary: The passage describes Worgaia, Warramunga, Tjingilli, Umbaia, and Gnanji
    churinga and allied objects, emphasizing their totemic associations, their lack
    of spirit-individual association in these groups, their ritual or restricted value,
    and several examples including sugar-bag, yam, mosquito, wild-cat, and snake-totem
    objects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Worgaia sugar-bag Churinga is described as not associated with spirits and
    as representing the actual sugar bag itself.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: For one sugar-bag Churinga, zigzag edges represent wax, concentric circles
    represent sugar bags, and a small spherical stone represents honey.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the Worgaia have no sacred storehouse equivalent to the Arunta
    ertnatulunga, although each totem has a headman.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tjupila is described as head of the yam totem and as performing an Intichiuma
    ceremony in which he carries a yam mitji-mitjari and leaves it on the ground in
    a special place to ensure yam growth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Warramunga, Tjingilli, Umbaia, and Gnanji groups are said to have fewer traces
    of Churinga than the Arunta; their objects are associated with totems but not
    with spirit individuals.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The ancestors of the totemic groups are said to have created the spirit individuals,
    or purtulu, and left them at mungai spots.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Every individual is said to have a mungai spot where he lived in the Wingara,
    described as equivalent to the Arunta Alcheringa.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Warramunga distinguish irrititji, objects carried by or especially associated
    with a totemic ancestor, from murtu-murtu, the wooden bull-roarer-shaped object
    identified as the true Churinga.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Stone knives used by Winithonguru, the wild-cat man, to circumcise young men
    are given as an example of ancestor-associated objects.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The markings on one wooden Churinga are explained as a mosquito-totem man,
    his tracks, creek banks, a man who wanted to kill him, crossing tracks, the killing
    place, and the mosquito-totem man’s legs after death.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The owner of the figured wooden Churinga belonged to the Wollunqua totem,
    but the object is said to have nothing to do with that totem and to have been
    received from a Kaitish man.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: In Tjingilli, Umbaia, and Gnanji cases, Churinga of this kind are described
    as especially valuable because of their association with a totem.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: An Umbaia purtuli is associated with a snake-totem centre at a water-hole
    made in the Alcheringa by a snake called Katakitji; it is sacred, not associated
    with a spirit, and not to be seen by uninitiated persons.
  category: relationship
  evidence_refs:
  - ev:9
