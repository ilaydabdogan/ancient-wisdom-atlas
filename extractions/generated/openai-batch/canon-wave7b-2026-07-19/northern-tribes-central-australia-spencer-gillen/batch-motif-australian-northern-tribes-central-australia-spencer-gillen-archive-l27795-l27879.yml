canonical_text:
  quote: ''
  summary: The passage describes customs relating to hair, including the reported
    absence of harmful hair-magic, the value of human hair as barter, hair-plucking
    practices that mark elder status, and childbirth customs involving ancestor-spirit
    reincarnation, navel-singing, grease-rubbing, kin announcements, temporary separations,
    and post-birth gestures with the child.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The authors report no observed instance among the investigated tribes of injuring
    a person through magic performed with part of that person's body, such as hair.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Human hair is described as a valuable barter article, and possession of another
    person's hair is described as a normal circumstance.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hair treatment varies by tribe; southern groups are described as having well-developed
    beards and whiskers, while more northern and coastal groups are described as having
    scantier facial hair.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Southern groups generally leave head and facial hair untouched except when
    hair must be cut and presented to someone; hair on the forehead is pulled out
    for at least about two inches back.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Warramunga and Worgaia men pull out upper-lip hair when they are beginning
    to grow old.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: An old Warramunga man may lie down while a young man carefully pulls out facial
    hairs one by one.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A clean upper lip marks a man as an elder to whom respect and food offerings
    are due on certain occasions.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Each individual is described as the reincarnation of an ancestor, and the
    spirit is associated with a special totemic group.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'The number and source of totemic ancestors differ by tribe: some groups have
    many ancestors, Urabunna may have one or two, and Warramunga have one great ancestor
    whose body emanated spirit individuals.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The spirit is said to deliberately enter the mother's body; in the Unmatjera
    account it enters through the navel.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:11
  text: In the Unmatjera practice, when pregnancy is evident the husband sings the
    navel, rubs grease over the woman's sides, and chants words said to come from
    the Alcheringa.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the Kaitish practice, the pregnant woman tells her elder sister, the elder
    sister informs the woman's parents, and the woman's father tells the husband.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the Kaitish practice, the woman's father and mother camp apart for two
    days without speaking, and the husband leaves his camp for three days.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: After the Kaitish child is born, the woman's father touches the mother's head
    with a small bush, and the woman's mother handles the child in the pitchi, rubs
    it across her stomach, throws it up and down, and embraces the mother from behind.
  category: sequence
  evidence_refs:
  - ev:6
