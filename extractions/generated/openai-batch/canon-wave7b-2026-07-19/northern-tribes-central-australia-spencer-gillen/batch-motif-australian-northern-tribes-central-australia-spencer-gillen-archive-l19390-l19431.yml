canonical_text:
  quote: ''
  summary: A boy returning from an inland journey during an initiation sequence is
    signalled to his home camp by fires, preceded by a Tjurulum messenger, received
    by an assembled and painted community on the ceremonial ground, carried around
    for his parents to see, given to his father and mother, and involved in exchanges
    of gifts and food with visitors and a ritual intermediary.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the return journey, large fires were lit near the home camp so that the
    boy’s father would know the returning party was close; the fires were made by
    the boy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Tjurulum man went ahead alone, told the father that his son was at the camp,
    asked whether the men were present, and later returned carrying food sent by the
    father to the boy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At night, the lubras danced in the main camp in front of men who sang.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Men and women painted their bodies red, white, and black and assembled on
    the ceremonial ground called thamunki.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The father sat in the middle of the front row of men, and the women stood
    grouped behind.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The strangers approached with shouted calls, including “Ka! ka! ya-a!” and,
    from some inland hill-country people, “Srr! srr!”
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The boy was first held by the hand and then lifted onto the shoulders of a
    Pungarinji man, who ran around the local group so the father and mother could
    see him clearly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Visitors identified as Pungarinji, Tjuanaku, and Tjurulum men placed spears,
    hair girdles, and other articles on a paper-bark dish at the father’s feet as
    a gift.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The boy had been decorated with fur-string by his nieimi and was brought to
    his father; after a short time he was sent to his mother, who embraced him and
    wept over him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The mother had placed food at the father’s feet; this food was handed to the
    meimi man, who took it with the boy to the strangers.
  category: action
  evidence_refs:
  - ev:9
