canonical_text:
  quote: ''
  summary: The passage describes hair forms and hair-dressing practices across several
    northern Central Australian groups, including plaited hair with string extensions,
    mop-like hair, close-fitting hair caps, and curly hair in coastal groups. It then
    describes cicatrices and scars on different parts of the body, including ornamental
    scar patterns, self-inflicted mourning cuts, fight wounds, and a captioned nasal
    septum modification.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Long hair is described as made into plaits, lengthened with string, and tied
    behind the head; when the plaits are undone, the hair forms a mop-like mass.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Gnanji and more eastern tribes, facial hair is described as very scanty,
    and older men are said often to have pulled much of it out.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Binbinga and Karawa tribes, plaited hair is wound round to make the
    appearance of a close-fitting cap rather than a fuzzy mass.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Coastal tribes are described as having very curly hair, sometimes close in
    appearance to the woolly type but not actually woolly; boys are said to have hair
    less curly than older males.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The passage gives a tribe-by-tribe series of hair variation: Arunta hair
    is wavy, Kaitish and Tjingilli hair may be very curly, Warramunga hair is normally
    wavy, Gnanji hair can be artificially made into a frizzled mop, Binbinga hair
    can be wavy or curly and plaited into a skull-cap form, and Anula and Mara hair
    is decidedly curly.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The authors state that a Papuan mixture might be suggested for the curly hair
    of Anula and Mara groups, but add that customs and beliefs remain distinctly Australian
    and closely allied to the other tribes described.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Cicatrices vary by group; in the Arunta they are cut on the chest, upper arms,
    and shoulders, and similar markings are reported for Kaitish, Unmatjera, and Warramunga
    people.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Men are also said to bear scars on the thigh or shoulder from self-inflicted
    wounds or from cuts made by another man during a fight; one Warramunga man had
    twenty-three leg scars from mourning cuts, and a Walpari man’s back scars were
    said to come from stone-knife fight wounds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tjingilli, Gnanji, and Umbaia people are described as often considerably cicatrised,
    including upper-arm epaulette-like scars and breast or arm patterns; the passage
    reports that informants said these scars were ornaments and not tribal, class,
    or distinctive marks.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Gnanji markings are described as closely similar to those of Tjingilli, Gnanji,
    and Umbaia groups, while Binbinga, Mara, and Anula scars are usually but not always
    confined to the chest; thigh scars are reported in Tjingilli, Gnanji, and Umbaia
    groups but are less prominent than in the Warramunga tribe.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: A figure caption identifies a Warramunga man as showing a hole in the nasal
    septum broken through.
  category: attribute
  evidence_refs:
  - ev:8
