canonical_text:
  quote: ''
  summary: The passage describes a fall or winter ceremonial at Akuliaq in which Ekko
    spirit figures enter the singing-house, indicate taboo violations by moaning,
    and compel confession. It then describes the male and female Ekko costumes and
    the belief that performers are possessed by the Ekko spirit. A short note says
    two Kailartetaq were seen dancing apart from the Eskimo. The passage also gives
    a charm tale in which Ataina uses a bear penis-bone whip to drive away multiplying
    foxes, which are later found transformed into stones.
  language: English
  quote_policy: summarized
