candidate_motifs:
- id: motif:1
  label: dangerous human-shaped snow effigies
  taxonomy_refs: []
  basis: Snow-men are feared, cut down, and associated with illness and potential
    village trouble unless handled by an angakok.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage does not say the snow-men move or speak; danger is reported
    as belief about their effects.
- id: motif:2
  label: concealed observer of esoteric ritual preparations
  taxonomy_refs:
  - forbidden_knowledge
  basis: A man hides to see what angakut do in preparing feats and is discovered by
    a tupilak that threatens him and the people inside.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: low
  cautions: The passage does not explicitly state that viewing the preparations is
    forbidden; the taxonomy link is tentative.
- id: motif:3
  label: tupilak repelled by oil and lamp-black
  taxonomy_refs: []
  basis: Oil and lamp-black applied at the entrance cause the attacking tupilak to
    disappear underground, and the same substances revive the people in the singing-house.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No available taxonomy family directly matches this apotropaic substance
    pattern.
- id: motif:4
  label: amuletic animal-bone whip drives away spirits
  taxonomy_refs: []
  basis: Whips made with wolf or bear penis-bone are described as effective against
    tupilak or evil spirits and as child protection.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage describes practical ritual use rather than a narrated mythic
    episode.
- id: motif:5
  label: ritual battle with sickness-causing spirit
  taxonomy_refs: []
  basis: A tupilak causing sickness must be driven away; the angakok battles it, shows
    bloody hands as proof, and the community follows post-battle restrictions.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No specific available motif-family reference captures shamanic healing
    combat exactly.
- id: motif:6
  label: angakok initiation through animated clothing
  taxonomy_refs:
  - initiation
  basis: A man seeking angakok power hangs his coat by a precipice; it comes alive
    and climbs, and wearing it would have made him a powerful cliff-walking angakok.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The ascent-like cliff-walking element is present, but the main supported
    motif is initiation/acquisition of power.
- id: motif:7
  label: animal-to-human transformation in angakok initiation
  taxonomy_refs:
  - shapeshifter
  - initiation
  basis: A struck caribou transforms into a woman, while other caribou become men
    and instruct the hunter; the encounter becomes the basis of the angakok’s ritual
    clothing.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage presents this as an angakok’s initiation story but gives limited
    explanation of the mechanism of the transformation.
- id: motif:8
  label: birth from transformed animal woman
  taxonomy_refs:
  - sacred_birth
  basis: The caribou that becomes a woman gives birth to a boy and dies; the boy is
    later represented on the angakok’s coat.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: medium
  cautions: The child’s later role is not narrated beyond the coat representation,
    so the sacred-birth classification remains provisional.
- id: motif:9
  label: protective garment imagery wards spirits
  taxonomy_refs: []
  basis: The angakok’s coat includes white-skin hands intended to ward off evil spirits
    and animal figures explained as children of the earth.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: This is an object-symbol pattern rather than a full narrative motif.
- id: motif:10
  label: protecting spirit regulates telling of important story
  taxonomy_refs: []
  basis: Women cover their heads for fear of the angakok’s protecting spirit, and
