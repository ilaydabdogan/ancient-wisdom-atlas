comparison_claims:
- id: claim:1
  claim: The passage explicitly states that remarks on the tupilak are quite similar
    to remarks recorded by Captain Mutch in Cumberland Sound and suggests a belief
    in an invisible tupilak distinct from the artificial monster.
  claim_level: same_motif
  target: Captain Mutch’s Cumberland Sound remarks on tupilak and an invisible tupilak
    belief
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The compared Captain Mutch passage is not included here, so the claim
    rests only on Boas’s internal cross-reference and summary.
- id: claim:2
  claim: The passage says beliefs about acquiring angakok power are shared by tribes
    on the west coast of Hudson Bay, and that a shaman’s story known from Cumberland
    Sound is also known there in a slightly different form.
  claim_level: same_motif
  target: Angakok power-acquisition traditions in Cumberland Sound and west coast
    Hudson Bay references cited by Boas
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: low
  limitations: The earlier referenced accounts on pages 133-134 are not part of the
    supplied passage, so the specific shared elements cannot be checked within this
    extraction.
