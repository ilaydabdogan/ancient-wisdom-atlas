canonical_text:
  quote: ''
  summary: 'The passage reports beliefs and stories concerning dangerous snow-men,
    tupilak attacks and defenses, ritual battles against sickness-causing tupilak,
    amuletic whips, and two accounts of acquiring angakok power: one involving an
    animated coat near a hawk’s nest, and another involving a caribou that transforms
    into a woman who gives birth and dies, after which an angakok adopts her clothing
    pattern.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some Netchillik Eskimo made a couple of snow-men when leaving a village; a
    native cut them to pieces because he was afraid of them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After cutting the snow-men, the man became unwell, and it was believed that
    the snow-men would have caused trouble if left standing; an angakok was said to
    be immune to ill effects from cutting them down.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: During an angakok performance, a man hid under the ceiling of a passage-way
    because he wanted to see what the angakut were doing in preparation for their
    feats.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A tupilak entered the hut, discovered the hidden man, and threatened to kill
    the people inside and then the hidden man.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The hidden man fled to his snow-house, closed the door, filled his mouth with
    oil and lamp-black, and sputtered it over the snow-block closing the entrance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the tupilak came to kill him, the oil and lamp-black caused it to disappear
    underground.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The man then blew oil and lamp-black through the singing-house, where the
    people were in a stupor, and the people began to revive.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A strip of skin from the belly of a male wolf, made as a whip with a penis-bone
    handle, is described as an amulet for driving away the tupilak.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: A whip made from the penis-bone of a bear is said to drive away evil spirits
    and to be used especially for protecting children.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: When sickness is attributed to a tupilak, an angakok is said to go out, battle
    it, and drive it away; he shows blood-covered hands as proof.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: During the tupilak-driving performance, older men and women may be present,
    but children must stay in the house because otherwise they are believed likely
    to lose one or both eyes.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: After a tupilak has been driven away, the next day is given to festivals and
    games, and the people must not move from the village the following day or the
    tupilak would return.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: A man who wanted to become an angakok hung his coat down a precipice near
    a hawk’s nest.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: On the fifth day the coat had come to life and was climbing up the precipice;
    the man became frightened and killed it by throwing stones.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The account states that if the man had put on the animated jacket, he would
    have become a powerful angakok able to walk up and down cliff faces.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: An Iglulik angakok, while caribou-hunting, struck a fat buck with an arrow;
    the animal’s antlers and skin fell off, its head grew smaller, and it took the
    form of a finely clothed woman.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The transformed caribou woman gave birth to a boy and then died; the other
    caribou turned into men.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: The caribou-men told the hunter to cover the woman and child with moss, return
    to his people, report what happened, and have his clothing made like the woman’s.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:19
  text: The angakok’s coat is said to match the caribou woman’s coat except for a
    representation of her child, which he added.
  category: object
  evidence_refs:
  - ev:11
- id: obs:20
  text: White-skin hands on the coat are said to ward off evil spirits, and animal
    figures on the shoulders are explained as children of the earth.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:21
  text: Women near the angakok covered their heads for fear of his protecting spirit
    while he told the story to Captain Comer.
  category: action
  evidence_refs:
  - ev:12
- id: obs:22
  text: The angakok objected to Captain Comer resting his paper on a woman’s shoulders
    because his protecting spirit would not like the paper recording an important
    story to touch a woman.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:23
  text: Captain Comer remarks that other Eskimo were somewhat skeptical of the story
    but did not dare express their doubts.
  category: other
  evidence_refs:
  - ev:12
