canonical_text:
  quote: ''
  summary: The passage reports Captain Comer's general ethnographic observations on
    Sauniktumiut, Kinipetu, Aivilik, and other west-coast Hudson Bay Inuit groups,
    including subsistence, trade, sledges, tents, marriage customs, namesake ceremony,
    moss fuel, seasonal building, hunting practices, gesture signaling, hair styles,
    travel water bags, and a case of consensual killing after a witchcraft accusation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Captain Comer is named as the source of observations on tribes on the west
    coast of Hudson Bay and Southampton Island.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sauniktumiut are described as the southernmost Eskimo tribe on the west
    coast of Hudson Bay and as differing from northern tribes, with the stated explanation
    of intermixture with Indians.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Sauniktumiut are said to depend mainly on caribou for food and clothing,
    to use sea mammals little, and to hunt musk-oxen and foxes for furs traded to
    Hudson Bay Company coasting vessels.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sauniktumiut sledging is described as involving few dogs, a woman often walking
    ahead of the sledge, wooden sledges, moss-shod runners, poles for pushing, and
    children lashed in furs on loaded sledges.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In summer the Sauniktumiut live in conical caribou-skin tents described as
    built on the plan of the Indian tent, and they allow dogs into huts unlike tribes
    farther north.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Kinipetu live in the Chesterfield Inlet region, use sea mammals little,
    subsist chiefly on caribou and musk-oxen, and trade skins for goods including
    guns, ammunition, knives, needles, thimbles, calico, bread-pans, and porcelain
    beads.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Kinipetu clip the hair on the crown of the head short while leaving the
    rest long.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Among the Kinipetu, polygamy and polyandry are both reported; when several
    men want the same woman, older people gather in a large hut, the woman stands
    in the center, the men take hold of her, and the strongest is allowed to marry
    her.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: An anecdote reports that two men struggled for a woman until tired, after
    which a third man rushed into the circle and carried her off.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Kinipetu are said not to burn oil but to burn a dug moss fuel that produces
    strong smoke and stains the nails of women who tend the fire.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: When a visitor has the same name as a native, an evening ceremony occurs in
    which the native gives a present to the namesake and gives up his name for the
    duration of the visit.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Aivilik-related notes state that, before vessels visited Hudson Bay, driftwood
    was obtained from the shores of Boothia and that four named directions were known.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: In fall, before snowdrifts are deep enough for house-building, walls are built
    from large ice cakes and roofed with the summer tent; in summer, west-coast Hudson
    Bay tribes use dogs to carry loads.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:14
  text: When pond ice is forming and salmon can be seen through it, people seek a
    female salmon guarding spawn, cut a nearby hole, and spear males approaching the
    spawn.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: During musk-ox hunting, a hunter who sees a herd signals to companions by
    a specified body posture and alternating foot movement meaning that musk-ox are
    in sight.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: The author identifies the musk-ox signal as the only eastern Eskimo gesture-language
    example known to him besides raised eyebrows for yes and turning up the nose for
    no.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:17
  text: Men are described as wearing hair long and loose, cut in front even with the
    eyebrows.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:18
  text: When travelling, people carry seal-flipper bags filled with snow under their
    clothing; body heat melts the snow, and the water is used for drinking and for
    icing sledge-runners.
  category: object
  evidence_refs:
  - ev:13
- id: obs:19
  text: People accused of witchcraft or otherwise considered obnoxious may be killed
    by common consent.
  category: action
  evidence_refs:
  - ev:14
- id: obs:20
  text: A reported case says a man accused of bewitching a mentally ill boy and causing
    village sickness was appointed to be killed; while the accused bent over an ice
    hole to drink, the appointed man stabbed him through the body.
  category: sequence
  evidence_refs:
  - ev:14
