  summary: The passage is a concluding comparative discussion. It argues for closer
    relations and broader cultural unity among Eskimo groups from Alaska to North
    Greenland, including utensils, customs, beliefs, and some mythology. It also discusses
    possible external influences on craft forms, disputes Solberg's chronology for
    Greenland implements, and argues for stability and conservatism in Eskimo implement
    forms.
