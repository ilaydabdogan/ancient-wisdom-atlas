canonical_text:
  quote: ''
  summary: 'The passage records several accounts and customs concerning angakut: initiation
    vulnerability and taboos, hidden incantations, shamanic protection, food transformation,
    healing, divination about taboo violations, guardian-spirit aid, ritual offerings,
    snow-man rites, communal protection against tupilak, and head-lifting divination
    through spirit possession.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man trying to become an angakok is said to lose his progress after
    Captain Comer slaps his back; other angakut conduct a repair rite involving a
    strap, new cloth, raised hands, and the word “Enough.”
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young angakok must avoid whipping dogs for a year and must not drink from
    a cup used by someone else.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kinipetu angakut perform incantations hidden behind a curtain screening the
    rear of the hut.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: An old woman angakok carries lighted oil-soaked moss outside a hut and causes
    wolves to fight and eat carcasses, saving herself and companions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A woman angakok cuts up moss and gives pieces to starving women; when eaten,
    the pieces become caribou meat.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In sickness cases, an angakok may prescribe an exchange of children.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Padlirmiut angakut are said to cut open sick persons, remove diseased parts,
    and replace them with sound parts.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: When game is scarce, an angakok addresses a boulder as though speaking to
    Nuliayoq; the boulder replies with a violated taboo while the earth trembles.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Two angakut from different places meet halfway and erect a large cairn on
    the hill where they met.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: An angakok wears a strap with strips of skin marking diseases cured or warded
    off; the strap is eventually placed under a stone as an offering to the guardian
    spirit.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: An angakok calls a walrus guardian spirit to retrieve Captain Comer’s lost
    rifle from the water by means of a line through a water-hole; the line becomes
    taut, then snaps, and the angakok attributes the failure to interference.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage refers to an illustrated preparation for a shaman’s flight described
    elsewhere in the volume.
  category: other
  evidence_refs:
  - ev:12
- id: obs:13
  text: After some meetings of angakut, snow-men are made; men rush out, cut them
    to pieces, and hurry back, apparently fearing the snow-men’s spirits.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: During village sickness, people confess wrongs and name the skin used for
    their first clothing; the angakok leads everyone holding a line around the village
    to prevent tupilak from entering.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: In head-lifting, a woman is said to be possessed by a man’s grandfather spirit;
    answers are determined by whether her head is heavy or easy to lift, and confession
    of a taboo transgression removes its evil effects.
  category: sequence
  evidence_refs:
  - ev:15
