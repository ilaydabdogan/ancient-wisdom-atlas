candidate_motifs:
- id: motif:1
  label: shamanic initiation vulnerability and ritual repair
  taxonomy_refs:
  - initiation
  basis: The novice’s progress toward becoming an angakok is said to be lost through
    touch, and a procession and spoken-gesture rite are required to undo the harm;
    additional novice taboos are listed.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage describes a specific custom and does not give a full initiation
    narrative.
- id: motif:2
  label: hidden shamanic incantation
  taxonomy_refs: []
  basis: Kinipetu angakut are said to make incantations while concealed behind a curtain
    in the hut.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: Only the setting of the incantation is described, not its words or ritual
    purpose.
- id: motif:3
  label: fire-bearing shaman protects household from animal threat
  taxonomy_refs: []
  basis: An old woman angakok uses lighted oil-soaked moss to turn a wolf pack against
    itself and save the people in the hut.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The text presents this as a feat of an angakok, but does not explain the
    mechanism beyond the reported result.
- id: motif:4
  label: miraculous food transformation in starvation
  taxonomy_refs: []
  basis: A woman angakok gives moss to starving women, and it becomes caribou meat
    when eaten.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No available taxonomy reference exactly matches food transformation; no
    broader comparison is asserted.
- id: motif:5
  label: healing through exchange or replacement
  taxonomy_refs: []
  basis: The passage reports child exchange prescribed for sickness and bodily replacement
    of diseased parts by Padlirmiut angakut.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The child-exchange practice and bodily replacement report are adjacent
    sickness-related customs but may be distinct rites.
- id: motif:6
  label: taboo violation revealed by speaking stone during game scarcity
  taxonomy_refs:
  - divine_judgment
  basis: When game is scarce, a boulder addressed as Nuliayoq states which taboo has
    been violated while the earth trembles.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: 'The taxonomy reference is cautious: the passage presents taboo-caused
    scarcity and supernatural reply, but does not use the term divine judgment.'
- id: motif:7
  label: cure tally offered to guardian spirit
  taxonomy_refs:
  - sacrifice
  basis: An angakok’s strap records diseases cured or warded off and is ultimately
    placed under a stone as an offering to the guardian spirit.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The object is explicitly an offering, but not a blood sacrifice; the taxonomy
    reference should be reviewed.
- id: motif:8
  label: guardian animal spirit retrieves lost object through water
  taxonomy_refs: []
  basis: A walrus guardian spirit is called to bring a lost rifle to a water-hole,
    with a line used as if fishing.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The performance fails in the reported account, and the angakok attributes
    the failure to interference.
- id: motif:9
  label: shamanic flight preparation
  taxonomy_refs:
  - ascent
  basis: The passage refers to a preparation for a shaman’s flight illustrated in
    the plate and described elsewhere in the volume.
  evidence_refs:
  - ev:12
  confidence: low
  cautions: The actual flight or ascent is not described in this passage; the reference
    depends on a cross-reference within the source.
- id: motif:10
  label: dangerous effigy or snow-man spirits
  taxonomy_refs: []
  basis: Snow-men made after angakut meetings are cut to pieces, after which men hurry
    back as if afraid of their spirits.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The passage says the fear is apparent, so the interpretation of the snow-men’s
    spirits is tentative.
- id: motif:11
