canonical_text:
  quote: ''
  summary: 'The excerpt collects short Cumberland Sound traditions: a woman survives
    enforced winter exposure; a boat is saved after a lamp is offered to Sedna; two
    boys survive a village massacre; a strong man is killed by his brother; Piu''kia
    survives stabbing and later, as an angakok, knows of her brother''s hidden murder;
    lamps in a house speak; and additional notes describe Kanatchea''s temper, impossible
    food errands, and his treatment of his dead mother and dogs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A husband orders his wife to return skins he had caught, meaning she must
    remove clothing made from them, and she walks barefoot and without a jacket in
    winter without freezing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ooryah offers a lamp to Sedna while a boat is endangered by pack-ice; the
    ice sets off, the boat proceeds, and the people later identify a distant light
    as Sedna's light.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two attackers kill a village's inhabitants except for two boys, who escape
    to a neighboring camp and warn the people there; the attackers are then killed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A very strong man disrupts salmon fishing by throwing stones at fish and driving
    them away; he is killed by his younger brother.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Piu'kia is stabbed through a snow-house wall with a lance passing through
    her stomach, but she recovers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Killaw secretly kills Ekieraping with a bowlder during a caribou-hunting trip,
    and the party returns without saying how Ekieraping died.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Piu'kia, identified as an angakok, knows how her brother was killed; Ekieraping's
    dogs attack Killaw, and Killaw recovers only after confessing the killing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Two women outside a house hear two voices inside, although they believe no
    one is there; they discover that the lamps in the house are conversing.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Kanatchea beats his dogs before entering the house so that he will not beat
    his wives; his mother sends him for berries and salmon in winter to keep him away,
    but he obtains them quickly.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: After his mother's death, Kanatchea carries her body with him, brings it into
    the tent at night, hides it after others ask him to leave it, and says his mother
    will be with him inside the dogs.
  category: sequence
  evidence_refs:
  - ev:9
