canonical_text:
  quote: ''
  summary: The passage describes mourning periods, burial handling, post-burial offerings
    and food for the soul, restrictions on widows and widowers, several Netchillik
    customs, a parent’s suicide to save a sick child, the making of tupilak from snow
    or hair on tracks, animal transformation after taboo transgression against Nuliayoq,
    and seasonal speech restrictions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a man dies, nearby people must not work for three days; after a woman
    dies, they must not work for four days; sledges may not leave during mourning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The body is wrapped in skins and taken to the grave over ice and snow; the
    person wrapping it puts caribou hair in his nostrils and later throws away the
    clothes worn during burial.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A surviving spouse is expected to take the body to the grave, or a strong
    close relative does so if needed; dragging the body over stones is avoided when
    possible because it is believed to hurt the soul.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Friends place stones over the body at the burial place in a way that the stones
    do not rest directly on it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Burial assistants remain in the house for three days; on the fourth morning
    an old woman touches tent articles with frozen dog dung.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Burial assistants go to the grave, leave offerings, circle it from left to
    right, and call on the soul to watch over them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A widow or widower at first asks the dead spouse’s soul to eat whenever the
    survivor eats, then sets aside a small piece of meat for the soul for a year.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: During the mourning year a widow must not mention animal names, look outdoors
    or at game before it is ready to be cut up, eat raw meat, turn meat while cooking,
    or eat meat of game on the day it is killed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the end of the year the mourner circles the grave from left to right and
    asks the soul to watch over him in the future.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Widowers may hunt, but must not mention animal names or whip dogs, because
    the whip might strike the wife’s soul and hurt it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that the Netchillik do not visit the grave and talk to
    the departed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: When a child is very sick, one parent may hang himself or herself because
    this is believed to save the child.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A person with a grudge may make a bear of snow, insert bear teeth in its mouth,
    and the figure becomes a tupilak that causes sickness, accidents, or death to
    the target.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Hair placed on an enemy’s tracks can come to life and attack as a tupilak.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: If a hunter offends Nuliayoq by breaking a taboo, musk-oxen he pursues may
    be changed by her into caribou.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: Statements attributed to Captain Mutch say Netchillik women may not lift stones
    or touch heather, and that during deer-hunting season some animal names and other
    words are changed.
  category: speech
  evidence_refs:
  - ev:12
