canonical_text:
  quote: ''
  summary: Captain Comer’s account describes a meeting with Southampton Island Inuit,
    their limited contact with other groups, communication with mainland Inuit, gestures
    and speech used in greeting, dwellings made with whale materials, seasonal moon
    names, tattooing, water procurement, hunting resources, fear of polar bears, and
    a reported revenge obligation connected to a death attributed to an evil spell.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Southampton Island people and mainland Eskimo had difficulty understanding
    one another at first; the observer reports that women comprehended the mainland
    interpreters more quickly than men did.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Southampton Island people are described as having had no communication
    with other tribes, while knowing other people existed; a reported earlier party
    crossed the frozen Strait to the west coast of Hudson Bay, and they had seen whaling
    ships near the island.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Whale bones were found widely on the island, including forty whale heads used
    in house construction in one place; the observer inferred a formerly larger population,
    though only fifty-eight people were reported in 1898.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: At first contact, the islanders signalled the visitor to come by bending their
    bodies at a right angle, which the account says meant that he should not be afraid.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Men, women, children, and dogs approached the visitor; men shouted “Whar whee”
    and made short jumps, and the islanders took the visitors by the hands while leading
    them to their tents.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At that season the islanders lived in seal-skin tents supported by whale-ribs;
    nearby winter houses looked like earth mounds and were unoccupied, and one dwelling
    contained bones of several people.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The visitor was told that one islander might have killed him a month or two
    earlier in revenge for a brother’s death attributed to an evil spell, but that
    the revenge duty lapsed after one year.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The moons are named according to principal seasonal events, including birds
    laying eggs, seals or caribou having young, and the sun being lowest.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Women tattoo their faces, arms, and lower limbs; the tattooing is described
    as done around age twelve with a needle and sinew-thread soaked in oil and soot.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Water is described as unavailable for about nine months except by melting
    snow in a stone kettle over seal-oil or whale-oil fire, or by warming snow in
    a skin bag hung down the back next to the body.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Polar bears are described as plentiful and feared; the account reports a recent
    case in which a bear broke into a snow house and killed a man and one of his wives
    while another wife escaped.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Whalebone is described as used for cups, pails, kayak frames, and toboggans;
    seals and walrus become principal food when the ice is strong enough to walk on.
  category: object
  evidence_refs:
  - ev:11
