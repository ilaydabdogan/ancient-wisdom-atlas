canonical_text:
  quote: ''
  summary: The passage describes Southampton Island subsistence, storage, dress, tools,
    travel, social practices, belief in witchcraft, an angakok’s trance explanation
    of a lost whale involving an offended sea goddess and guardian spirit, and a menstrual
    doorway restriction.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Salmon-trout are described as abundant in lakes; they go to salt water during
    spring freshets and return to lakes in late August.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Natives build two dams across streams to form a pool, close an opening after
    fish accumulate, spear the fish, string them with a bone needle, and store unused
    fish under stones for winter.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fowl caught in fine whalebone snares are skinned and hung in dome-like limestone
    slab structures from inward-projecting caribou antlers; meat is also kept on high
    stone supports for winter use.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men wear a grease-matted top-knot over the forehead and carry wound-pegs in
    it; women wear loose hair with small braids over the temples and ornaments attached
    to folded braids.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dress is said to resemble that of the Hudson Strait Eskimo; leggings are
    made of bear-skin with the hair outside, giving them an enormous appearance.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Flint is worked into tools with leather hand protection and part of a walrus
    rib; an older man makes a flint arrowhead and then makes and spins a top from
    dried skin and a sharpened stick.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: One seated older man is given items first; he examines them, remarks on them,
    and hands them back.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Hunting implements are described as clumsy and rude; bows are made from wreck
    wood or caribou antler pieces and are backed with sinew; small one-person sleds
    are made from walrus tusks and antler crosspieces.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Meat is generally buried where taken in stone caches and gathered in winter
    when needed; paths connect villages, dogs carry heavy side-packs when sledges
    cannot be used, and one travelling man carries only a bow and quiver while his
    party carries loads.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage states that these natives believe in witchcraft, and describes
    a woman reputed to be a great angakok speaking in trance after a whale was lost.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: In trance, the angakok says the narrator offended the goddess in the sea by
    cutting caribou meat and breaking bones on sea-ice.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The angakok also says her guardian spirit would hold the whale by a turn of
    the line around his wrist; two days later the whale is found, and the line is
    seen to have a turn around an underwater rock.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: A woman during her monthly periods must not pass through the doorway, but
    must lift the bottom of the tent and crawl underneath to enter or leave.
  category: action
  evidence_refs:
  - ev:10
