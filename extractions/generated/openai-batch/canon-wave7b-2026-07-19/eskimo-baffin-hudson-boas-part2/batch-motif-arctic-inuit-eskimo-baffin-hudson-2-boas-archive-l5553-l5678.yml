candidate_motifs:
- id: motif:1
  label: Taboo violation causes withdrawal or relocation of game
  taxonomy_refs:
  - divine_judgment
  basis: A hunter’s offence is believed to cause Nuliayoq to move a musk-ox herd away,
    and other disobedience can displease her or bring punishment.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:14
  confidence: high
  cautions: The passage presents beliefs and taboos, not a full narrative cycle except
    for the brief hunting anecdote.
- id: motif:2
  label: Offering to game-controlling spirit secures animals
  taxonomy_refs:
  - sacred_exchange
  basis: Men leave moss, caribou-skin, and sinew-thread on the ice as an offering
    to Nuliayoq so that she will send seals.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage describes a customary offering and expected result, not a
    developed mythic episode.
- id: motif:3
  label: Seasonal boundaries govern ritual work and spirit danger
  taxonomy_refs:
  - seasonal_cycle
  basis: Rules change with winter cold, ice formation, caribou-antler condition, and
    first sealing; ice formation also limits danger from evil spirits.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The evidence is ethnographic rule description rather than narrative symbolism.
- id: motif:4
  label: Separation of land-animal and sea-animal domains
  taxonomy_refs:
  - duality
  basis: Caribou smell must be removed before sealing because it offends sea-mammals,
    and hand-washing removes caribou smell before preparing the first seal.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The land/sea opposition is directly suggested by the rules, but the taxonomy
    mapping to duality is interpretive.
- id: motif:5
  label: Special animal encounter followed by year-long restriction and shamanic outcome
  taxonomy_refs:
  - initiation
  basis: The killer of an albino caribou must observe year-long restrictions; disregard
    brings boils and death, while observance leads to becoming a great angakok.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage does not call this an initiation, but the rule links observance
    after a special animal killing to shamanic status.
- id: motif:6
  label: Substitute miniature broken to protect the real object
  taxonomy_refs: []
  basis: A small model of a steatite lamp or kettle is made and broken to prevent
