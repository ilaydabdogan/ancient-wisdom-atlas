  locator: lines 5597-5606
  quote_or_summary: West coast Hudson Bay tribes allow manual work early in winter
    but stop during the coldest period until after seal births; in fall, sewing after
    dark is forbidden because the needle may invite evil spirits, until ice-floe extends
    outward.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 5608-5612
  quote_or_summary: Children’s clothing should not be worked on after dark until land-ice
    extends from shore; after ice forms, evil spirits cannot come to the house so
    easily.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 5616-5626
  quote_or_summary: Caribou scarcity is attributed to working whaler-brought wood
    during caribou season; albino caribou come from eggs in earth; the killer must
    avoid iron work, keep hood up, and wear a belt for a year or suffer boils and
    death, while observance can make him a great angakok.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: line 5628
  quote_or_summary: Cannibalism should not be spoken of in women’s hearing.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 5630-5634
  quote_or_summary: Before working steatite into lamps or kettles, men make a small
    model and break it to prevent the finished stone object from breaking.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 5636-5640
  quote_or_summary: Iglulik sealers do not use moss wicks in stone lamps but scrape
    walrus-tusk dust for the wick, because moss would offend walrus.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 5642-5648
  quote_or_summary: When someone dreams of an accident befalling another person, friends
    of the endangered person give the dreamer a small present intended for the dreamer’s
    guardian spirit to induce protection.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 5652-5656
  quote_or_summary: A woman cutting her hair or making or repairing stockings in a
    man’s presence brings him ill luck; the belief is shared by Aivilik, Iglulik,
    and Ponds Bay, less firmly by Kinipetu.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: lines 5658-5664
  quote_or_summary: Menstruating and postpartum women must not look around outside;
    seeing a wild animal would offend its soul, Nuliayoq would make the women blind,
    and the animal would be transformed into a smaller species.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: line 5666
  quote_or_summary: Women must not eat animal tongues, and an adolescent girl must
    not eat eggs.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
