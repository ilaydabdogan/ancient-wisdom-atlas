- id: motif:7
  label: Dream omen mediated by guardian-spirit gift
  taxonomy_refs:
  - sacred_exchange
  basis: Friends of a person endangered by a dream give the dreamer a present intended
    for the guardian spirit, to induce protection.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage gives only the practice and interpretation, not a narrative
    example.
- id: motif:8
  label: Reproductive-state sight taboo affecting animal souls
  taxonomy_refs:
  - divine_judgment
  basis: Menstruating and postpartum women must not look around outside; if they see
    a wild animal, its soul is offended, Nuliayoq blinds the women, and the animal
    is transformed into a smaller species.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: The transformation is reported as a consequence of taboo violation, not
    as a shapeshifting figure.
comparison_claims:
- id: claim:1
  claim: The Netchillik use a different smudge material, small birds’ nests, in a
    practice presented alongside the seaweed smudge used to remove caribou smell before
    sealing.
  claim_level: same_function
  target: Netchillik smudge practice compared with the seaweed smudge practice in
    this passage
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states the material difference but does not fully describe
    Netchillik explanations beyond the shared smudge context.
- id: claim:2
  claim: The belief that a woman cutting hair or working stockings in a man’s presence
    brings him ill luck is explicitly said to be shared by Aivilik, Iglulik, and Ponds
    Bay groups, with weaker belief among the Kinipetu.
  claim_level: same_motif
  target: Aivilik, Iglulik, Ponds Bay, and Kinipetu women’s conduct taboo traditions
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: high
  limitations: The passage reports distribution of the belief but gives no separate
    narratives from each group.
- id: claim:3
  claim: West coast Hudson Bay tribes are described as sharing a seasonal work pattern
    in which manual work is allowed early in winter and stopped during the coldest
    period until after seals have young.
  claim_level: same_function
  target: West coast Hudson Bay seasonal manual-work restrictions
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to the practice as summarized in this passage.
- id: claim:4
  claim: 'The Iglulik walrus-tusk wick rule has the same broad function as the caribou-smell
    removal rules: avoiding offense to sea animals during sealing-related activity.'
  claim_level: same_function
  target: Iglulik walrus-tusk wick practice compared with caribou-smell removal before
    sealing
  evidence_refs:
  - ev:3
  - ev:4
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage directly states offense avoidance in both cases, but it
    does not explicitly frame them as one system.
