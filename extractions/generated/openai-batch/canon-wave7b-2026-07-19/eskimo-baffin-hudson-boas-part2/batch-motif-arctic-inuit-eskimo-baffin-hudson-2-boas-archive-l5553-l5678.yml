literal_observations:
- id: obs:1
  text: A herd of musk-oxen seen in the evening could not be found the next day; people
    attributed this to an offence by a hunter and to Nuliayoq moving the herd elsewhere.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the first morning after moving into a new snow-house, people must rise
    early to please Nuliayoq.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before the first sealing after new winter caribou-skin clothing is made, clothing
    and hunting implements are hung over a seaweed smudge to remove the smell of caribou,
    which would offend sea-mammals.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Netchillik are said to use small birds’ nests to make the smudge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When men first go sealing, they leave moss, caribou-skin, and sinew-thread
    on the ice as an offering to Nuliayoq, believed to induce her to send many seals.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Before cutting up the first seal for cooking, women wash their hands with
    dry skin wetted by their sons to remove the smell of caribou.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Women must not work on new caribou-skins while caribou antlers are in velvet,
    though they may repair old skins; disobedience would displease Nuliayoq.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: While people live on the ice, no work on new skins, horns, or antlers must
    be done, though worn skins may be repaired.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In fall, sewing after dark is forbidden because drawing the needle toward
    the body is believed to invite evil spirits; sewing after dark is allowed when
    ice-floe extends to reefs and islands.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Children’s clothing should not be worked on after dark until land-ice extends
    from shore, because after ice forms evil spirits cannot come to the house so easily.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Caribou are believed to be less plentiful than formerly because Eskimo work
    on whaler-brought wood during the caribou-hunting season.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Albino caribou are believed to originate from eggs lying in the earth.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: A person who kills an albino caribou must avoid working on iron, keep his
    hood over his head, and wear a belt for one year.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: If the albino-caribou killer disregards the custom, his body will be covered
    with boils and he will die; if he does nothing to displease the caribou, he will
    become a great angakok.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Cannibalism should not be spoken of where women can hear it.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: When men work steatite into lamps or kettles, they first make a small model
    and break it; this is said to prevent the finished object from breaking.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: When people of Iglulik go sealing, they use dust scraped from a walrus tusk
    as a lamp wick instead of moss, because moss would offend the walrus.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: When a person dreams of an accident befalling someone, friends of the endangered
    person give the dreamer a small present intended for the dreamer’s guardian spirit,
    to induce protection.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:19
  text: A woman cutting her hair or making or repairing stockings in the presence
    of a man is believed to bring ill luck to him.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:20
  text: Menstruating women and women after childbirth are not allowed to look around
    outside the house, because seeing a wild animal would offend its soul, and Nuliayoq
    would cause the women to become blind.
  category: action
  evidence_refs:
  - ev:14
- id: obs:21
  text: If a menstruating or postpartum woman saw a wild animal, the animal is also
    believed to be transformed into a smaller species.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:22
  text: Women must not eat animal tongues, and an adolescent girl must not eat eggs.
  category: action
  evidence_refs:
  - ev:15
- id: obs:23
  text: The passage introduces a tale of punishment for concealing a miscarriage,
    but the tale itself is not included in the supplied passage.
  category: other
  evidence_refs:
