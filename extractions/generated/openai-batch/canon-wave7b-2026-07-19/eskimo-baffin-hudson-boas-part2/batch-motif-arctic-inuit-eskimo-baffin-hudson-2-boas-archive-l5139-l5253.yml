canonical_text:
  quote: ''
  summary: The passage records Ponds Bay beliefs and taboos concerning Sedna, her
    names, her red-dog husband, places associated with her, hunting and post-kill
    restrictions, personal taboos, albino animals from white eggs, grave goods for
    the dead, an anti-cannibalism tale involving possible transformation into an Igiqan
    and fear of sea-mammal souls, and notes on angakut healing, renaming, guardian
    spirits, future taboos, and Tijiqan caribou spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ponds Bay people know several names for Sedna, including Aivilayoq, Anavigak,
    Kunna, Katuma, Uiniyumissuitoq, and Unaviga, and are not allowed to smile when
    referring to or singing about her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sedna is said to have been married to a red dog, and the dog is said to be
    the father of the white people, the dwarfs, and the Eskimo.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sedna is believed to have lived at Sinaraun, where burning heather and working
    caribou-skin in winter are forbidden; violation would make her dog-husband howl
    and bring her punishment.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: At Itidliq, caribou-skin work is allowed until a whale, narwhal, white whale,
    or ground-seal has been killed; after such a kill, caribou-skin work must stop
    for three nights.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Heather used for covering winter tents must not be handled for three days
    after a narwhal has been caught.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Married women must not work for three days after a caribou has been killed,
    while girls may sew and mend clothing except stockings; the restriction is connected
    with fear of the woman who created the caribou.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Women in caribou-hunting parties must carefully observe taboos concerning
    head covering, heather, pointing at certain places, looking about, and related
    actions, especially if they have not hunted caribou before.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Whale, white whale, narwhal, and ground-seal must not be offended, and they
    are described as affected by every taboo transgression.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: When travelling from one place to another, tents are erected with the doorway
    facing the place left behind and intended for return.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A woman refused a knife offered by a sailor because the knife was her taboo.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A person who changes prescribed taboos after moving to a new country is said
    to die before a year has elapsed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Albino caribou, seals, and other animals are believed to originate from white
    eggs called sila, found partly protruding from the ground.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The property of a dead person is placed on the grave for use after death;
    a widow said her dead husband was still using his gun and that it could be taken
    later for her son.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Cannibalism in starvation is described as abhorred; in a tale, a starving
    man is inferred to have killed and eaten his wife and children, and later may
    have been seen or may have transformed into an Igiqan because he feared punishment
    by souls of large sea-mammals for eating human flesh.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: When treating a sick person, an angakok stands by the guardian spirit, questions
    it about a new name, says the child’s navel-string should be cut, licks his fingers,
    touches the patient’s navel, and the patient is made new if the spirit confirms
    the name.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: After the naming, the angakok asks the guardian spirit what future taboo the
    patient is to have, and the spirit orders forbidden food, actions, or clothing.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:17
  text: The spirits are generally invisible to the angakok and are described as terrible
    to behold.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:18
  text: The Tijiqan are said to be spirits of the caribou and guardians of the angakok.
  category: relationship
  evidence_refs:
  - ev:13
