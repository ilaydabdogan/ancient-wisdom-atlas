candidate_motifs:
- id: motif:1
  label: reverent naming and place-specific taboo around a powerful female being
  taxonomy_refs: []
  basis: Sedna is addressed reverently, smiling while naming or singing about her
    is prohibited, and specific actions are forbidden at her former tent-place under
    threat of punishment.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives rules and consequences but does not narrate a full mythic
    episode for these taboos.
- id: motif:2
  label: animal spouse as progenitor of peoples
  taxonomy_refs:
  - sacred_marriage
  basis: Sedna is said to have married a red dog who became father of white people,
    dwarfs, and Eskimo.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The taxonomy reference is approximate; the passage states a marriage and
    genealogy but does not describe a sacred-marriage rite.
- id: motif:3
  label: hunting taboos and retaliation or offense by animal powers
  taxonomy_refs: []
  basis: Work and handling restrictions are tied to kills of caribou, narwhal, whale,
    white whale, and ground-seal, and the sea mammals are described as affected by
    taboo transgression.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage lists rules rather than a single narrative plot.
- id: motif:4
  label: fixed personal taboo whose alteration brings death
  taxonomy_refs: []
  basis: A person who changes prescribed taboos after moving to a new country is said
    to die before a year has elapsed.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage gives a belief statement without an illustrative tale.
- id: motif:5
  label: unusual animals originating from eggs in the earth
  taxonomy_refs: []
  basis: Albino caribou, seals, and other animals are believed to come from large
    white eggs called sila found in the ground.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: Although eggs are a creation image, the passage concerns albino animals
    specifically, not cosmic creation.
- id: motif:6
  label: grave goods for continued use by the dead
  taxonomy_refs: []
  basis: Property is placed on the grave for postmortem use, and a dead husband is
    described as still using the gun by his grave.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: No afterlife geography or journey is described in this passage.
- id: motif:7
  label: cannibal transgressor transformed into an other-being
  taxonomy_refs:
  - shapeshifter
  basis: The lost man who had eaten human flesh is said by others either to have been
    one of the Igiqan or to have transformed into an Igiqan from fear of punishment
    by sea-mammal souls.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The transformation is reported as an explanation by the hunter’s companions
    rather than directly narrated as witnessed fact.
- id: motif:8
  label: ritual renewal through spirit-given name and navel-string gesture
  taxonomy_refs:
  - death_rebirth
  - initiation
  basis: During healing, the patient is made new, receives a new name from the guardian
    spirit, and is ritually associated with cutting the navel-string before receiving
    future taboos.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage frames the act as treatment of illness, so death-rebirth and
    initiation references are interpretive rather than explicit labels.
- id: motif:9
  label: guardian spirit prescribes future prohibitions
  taxonomy_refs: []
  basis: The guardian spirit orders what the patient will be forbidden to eat, do,
    or wear after the healing and naming procedure.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage does not identify a broader narrative cycle for this spirit
    beyond the ritual procedure.
comparison_claims:
- id: claim:1
  claim: The passage explicitly connects Ponds Bay knowledge of the name Aivilayoq
    with the Iglulik designation of Sedna, supporting a cautious linguistic and figure-identification
    comparison within nearby Inuit traditions.
  claim_level: linguistic_similarity
  target: Iglulik designation of Sedna as Aivilayoq
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: Only the name correspondence is supplied here; no detailed Iglulik
    narrative is included in the passage.
- id: claim:2
  claim: The cannibalism tale can be compared to a shapeshifter motif pattern because
    the lost man is said to have transformed into an Igiqan after eating human flesh.
  claim_level: same_motif
  target: shapeshifter motif family
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The transformation is presented as an explanation offered by others,
    not as a directly confirmed event.
- id: claim:3
  claim: The healing scene has the same ritual function as an initiation or renewal
