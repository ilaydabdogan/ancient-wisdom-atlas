canonical_text:
  quote: ''
  summary: The passage contains the end of a giant tale, a dwarf attack tale, and
    two Adlet-related accounts. A giant travels with large supplies, feeds starving
    people, hunts many caribou, and returns home with his wife. Ettourmalau is attacked
    by a dwarf and saved when his dogs tear the dwarf apart. Akkolakdju and Mammacheak
    encounter the Adlet; after being cut to pieces, Akkolakdju restores both himself
    and his wife to life, and the Adlet chief Pupeka protects them, gives a dog under
    a food prohibition, and later burns his own people; the dog is lost after eating
    seal intestines. A final account says Kooroksoo transforms into an Adla after
    theft of his walrus cache, is killed twice in that form, and later drowns with
    his sons after Puneyadlow conjures against them.
  language: English
  quote_policy: summarized
