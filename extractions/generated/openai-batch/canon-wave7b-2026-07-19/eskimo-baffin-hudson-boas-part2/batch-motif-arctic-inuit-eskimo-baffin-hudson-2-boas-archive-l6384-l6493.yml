candidate_motifs:
- id: motif:1
  label: Giant provider and extraordinary hunter
  taxonomy_refs: []
  basis: The giant carries exceptional supplies, feeds starving people, and kills
    or gathers access to many caribou.
  evidence_refs:
  - ev:1
  - ev:2
