  cautions: No supplied taxonomy family exactly names this giant-provider pattern.
- id: motif:2
  label: Dwarf attack defeated by dogs
  taxonomy_refs: []
  basis: A dwarf attacks Ettourmalau by clinging to and smothering him, and dogs save
    him by tearing the dwarf apart.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives a brief episode without a broader explanation of the
    dwarf's nature or motive.
- id: motif:3
  label: Dismemberment followed by restoration to life
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The couple are cut to pieces by the Adlet, and Akkolakdju gathers their body
    pieces and restores both to life.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage attributes the restoration to Akkolakdju as a great angakok;
    it does not state a general doctrine of resurrection.
- id: motif:4
  label: Dangerous nonhuman hosts restrained by a protective chief
  taxonomy_refs: []
  basis: The Adlet threaten the couple, but Pupeka invites and protects them, repeatedly
    sending the hostile Adlet home.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The term 'nonhuman' is inferred only from the Adlet label and doglike
    howling in the passage; the chief is still presented with a tent, wife, and social
    authority.
- id: motif:5
  label: Conditional gift animal lost after food prohibition is broken
  taxonomy_refs: []
  basis: Pupeka gives a dog with the condition that it not be fed seal intestines;
    when it eats seal intestines, it is lost.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage reports the prohibition and consequence but does not explain
    the reason for the rule.
- id: motif:6
  label: Burning destruction of a hostile people
  taxonomy_refs: []
  basis: Akkolakdju and Mammacheak see Pupeka burning all his people after their departure.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage gives no motive or ritual context for Pupeka's burning of
    his people.
- id: motif:7
  label: Shamanic transformation into an Adla
  taxonomy_refs:
  - shapeshifter
  basis: Kooroksoo, identified as an angakok, transforms himself into an Adla after
