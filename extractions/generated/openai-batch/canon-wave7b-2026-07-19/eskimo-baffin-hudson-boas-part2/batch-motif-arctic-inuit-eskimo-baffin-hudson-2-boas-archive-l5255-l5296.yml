canonical_text:
  quote: ''
  summary: 'The passage first describes a head-lifting curing procedure in which a
    patient is questioned for spirit presence through a wand and thong. It then presents
    a shamanistic performance after a seal-hunter drowned: an angakok in trance encounters
    the drowned man’s apparition near a snow-house entrance, the dead man seeks to
    return to provide for his family, and the great torngaq appears, after which the
    bound hands are released and both apparitions disappear. A brief physical description
    of the great torngaq follows.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sick woman calls a man whose head-lifting cure she trusts; he places a thong
    attached to a wand under the nape of her neck while she lies flat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The curer questions the patient about whether the woman’s mother’s spirit
