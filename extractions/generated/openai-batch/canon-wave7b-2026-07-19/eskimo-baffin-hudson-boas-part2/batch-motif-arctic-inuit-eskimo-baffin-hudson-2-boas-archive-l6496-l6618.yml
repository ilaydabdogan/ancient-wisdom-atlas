canonical_text:
  quote: ''
  summary: 'The passage contains several Inuit oral-tradition episodes: Adlet approach
    an Iglumiut camp and are warded off; Kakootahjew leaves after a quarrel and marries
    among the Adlet; Issigoon and Kanginak travel among Tornit and strangers; a Fox
    deceives Wolves and gains their caribou meat after it becomes stone; and an orphan
    boy enters the bears'' country, learns seal hunting, and returns home in a bear-skin
    jacket.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Iglumiut were camped at Nedlung, and Artichealow was described as their
    head man.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: At night an Adla lifted the stones holding Artichealow's tent cover, but someone
    awoke and the Adlet were driven away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The people feared the Adlet and kept night watchmen who used slings to throw
    stones and make noise; the Adlet are said to be taller than Eskimo and white people.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Kakootahjew asked her husband for skin to mend her boot-soles, was scolded,
    and went crying to the beach.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two Adlet asked Kakootahjew why she was crying, offered to take her to their
    home, and helped her along; the younger man carried her swiftly after they had
    gone some distance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: An old Adla asked Kakootahjew to become his son's wife; she agreed, lived
    with the Adlet, and had several children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Years later, Kakootahjew's former husband met her son by the Adla while caribou-hunting,
    learned that she had married the stranger, wished to see her, and was refused
    by the Adla.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Issigoon and Kanginak traveled by kayak along the coast and up a fiord, camped
    with Tornit, and later met strangers whose language they could not understand.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Sirquah could converse with the strangers and reported that the Tornit used
    seal-skin clothing and no caribou-skins; two people accompanied the travelers
    north, and one man married a Tornit woman.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Fox and Wolf lived at Sikosuilaq; Wolf children visited Fox children and
    were given caribou-fat, but at one time the Fox had no food.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The old Fox presented what she was chewing as fat, then described the fallen
    object as like a hammer and like a white stone, and asked a young Wolf to take
    and eat it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The father Wolf accused the Fox of fooling his child; the Wolves found that
    all their caribou-meat had become stone, left, and the Fox obtained all their
    caribou-meat.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In Cumberland Sound, children told an orphan that his father was not among
    the returning sealers, and the orphan boy went looking for him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The orphan reached a place where a bear had been carved; the bear's meat and
    skin were gone except for the sweet-breads, which the boy cooked and ate, and
    bear tracks led to the end of the land-floe.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: At the floe-edge in midwinter, the boy saw a kayak, accepted the hunter's
    invitation, traveled to the hunter's village, stayed three years, grew larger,
    and learned to hunt seals.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: A man told the boy to return to his mother, to take off his jacket so people
    would not think he was a bear, and to empty the vessels every morning to be successful.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: When the boy returned, sealers thought he was a bear and moved to attack him;
    he removed his bear-skin jacket behind a hummock, was recognized, and told his
    mother he was her son.
  category: sequence
  evidence_refs:
  - ev:10
