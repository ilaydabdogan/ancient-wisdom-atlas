candidate_motifs:
- id: motif:1
  label: Night attack by feared tall outsiders and communal warding
  taxonomy_refs: []
  basis: An Adla approaches a tent at night; the Iglumiut keep watchmen who throw
    stones and make noise to keep the Adlet away.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No available taxonomy reference directly names Adlet or communal warding.
- id: motif:2
  label: Woman leaves after domestic conflict and marries among Adlet
  taxonomy_refs: []
  basis: Kakootahjew leaves after being scolded, is taken by Adlet to their home,
    agrees to marry an Adla, and has children there.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage states that Kakootahjew agrees to go and agrees to the marriage,
    so it should not be coded as abduction without review.
- id: motif:3
  label: Cross-group encounter mediated by language and marriage
  taxonomy_refs: []
  basis: Travelers meet Tornit and strangers with an unintelligible language; Sirquah
    mediates conversation, and one man marries a Tornit woman.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage gives cultural and linguistic difference but does not explicitly
    frame the encounter as sacred or supernatural.
- id: motif:4
  label: Animal deceiver gains food from another animal group
  taxonomy_refs:
  - trickster_boundary
  basis: The Fox deceives the Wolf child over supposed food; the Wolves' meat becomes
    stone, they leave, and the Fox obtains their caribou-meat.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The taxonomy reference is broad; the passage itself uses animal figures
    and deception but does not use the term trickster.
- id: motif:5
  label: Food transformed into stone
  taxonomy_refs: []
  basis: The Fox identifies a fallen object as like a white stone, and all the Wolves'
    caribou-meat becomes stone.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The mechanism of transformation is not explained in the passage.
- id: motif:6
  label: Orphan visits bear country, learns hunting, and returns
  taxonomy_refs:
  - departure
  - initiation
  - return
  basis: The orphan leaves in search of his father, crosses by kayak to the bears'
    country, remains three years, learns to hunt seals, receives instructions, and
    returns to his mother.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage supports departure, learning, and return, but does not explicitly
    describe a formal initiation ritual.
- id: motif:7
  label: Bear-skin clothing causes misrecognition as bear
  taxonomy_refs: []
  basis: The boy is told to remove his jacket so people will not think he is a bear,
    and the sealers do mistake him for a bear before recognizing him.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage indicates mistaken identity through clothing, not actual shapeshifting.
- id: motif:8
  label: Instruction for success after otherworld stay
  taxonomy_refs: []
  basis: Before returning, the boy is instructed to empty the vessels every morning
    and is told this will make him successful.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage does not explain why the vessel practice brings success.
