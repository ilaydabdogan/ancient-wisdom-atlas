canonical_text:
  quote: ''
  summary: Ethnographic notes from Ponds Bay report travel and intergroup contacts,
    a remembered conflict involving the taking of an angakok's wife, claims about
    dangerous western tribes and Netchillik customs, explanations involving belief
    or nonbelief in Sedna, descriptions of bodily appearance and social marking, winter
    and summer games, and reports of enormous bare footprints.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ponds Bay people are described as traveling along the east coast of Baffin
    Land and maintaining communication with Iglulik people.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Akawaping, a Ponds Bay woman, and her husband Amawali are reported to have
    traveled over several Arctic islands and back to Fox Channel.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Iglulik Eskimo remember former closer intercourse with Cumberland Sound
    people; the interruption is attributed to a man taking away the wife of an angakok
    and retreating for fear of revenge.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ponds Bay accounts describe tribes west of the Netchillik as dangerous and
    as having cruel customs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Ugdjulirmiut of Back River, called Kournoomiut by Ponds Bay people, are
    said to kill strangers unless one of their own members has previously received
    hospitality from the visitors.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the reported exception, visitors may be kept in a hut until others tire
    of watching for a chance to kill them, after which the host may help them escape.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage reports that if a person cuts himself while carving a seal or
    ground-seal, he would be killed, cut up, mixed with the seal's body, and taken
    home with the game.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage reports that if a married woman smiles while passing a married
    man, the man would demand an exchange of wives from her husband.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: During starvation, western people are said to strangle or kill each other,
    believing that after cannibalism this is the only way to reach the happy land
    of souls.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ponds Bay Eskimo explain the reported badness of these people by saying that
    they do not believe in Sedna; they make a similar claim about the Netchillik.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Netchillik are also said to strangle and kill each other after cannibalism
    and to strangle old, sick, or ailing people.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Women of the western tribes are said to hunt in kayaks and do excellent bead-work.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Atywetus or inlanders are described in semi-fabulous reports as having
    no bone on the top of the head, so that the brain throbs when they play football.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: Netchillik women are said to be taller and lighter in complexion than Ponds
    Bay women.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:15
  text: Ponds Bay men wear long hair, explained either as protection from wind at
    the neck or as freeing them from sins.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:16
  text: Women are tattooed when they marry; Ponds Bay explanations say tattooing distinguishes
    women from men because both have long hair, and old women insist on it to make
    young women look old.
  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: The game tidluktoq is played in a large snowhouse in winter and on the ice
    in summer; a person with eyes shut tries to touch a man, then strikes him on the
    side of the head, after which the touched man takes a turn.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:18
  text: Another game has two men strike each other on the shoulders while their wives
    sit on the bed and sing until one man gives in.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:19
  text: The passage records various reports of enormous bare footprints found on King
    William Land and in the pass between Kignait and Padli.
  category: object
  evidence_refs:
  - ev:15
