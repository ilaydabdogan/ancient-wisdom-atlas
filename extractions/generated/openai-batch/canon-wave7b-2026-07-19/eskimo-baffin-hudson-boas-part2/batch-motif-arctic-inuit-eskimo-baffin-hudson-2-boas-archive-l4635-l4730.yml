candidate_motifs:
- id: motif:1
  label: Wife-taking causes enduring intergroup avoidance
  taxonomy_refs:
  - stolen_beloved
  basis: A man is said to have taken an angakok's wife, fled for fear of revenge,
    and the event is used to explain why meetings with Cumberland Sound people have
    since been avoided.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage presents this as an ethnographic memory or explanation of
    social estrangement rather than a developed mythic narrative.
- id: motif:2
  label: Reciprocal hospitality saves a stranger from death
  taxonomy_refs: []
  basis: Visitors among the Ugdjulirmiut/Kournoomiut may escape killing only if one
    group member had previously received hospitality from them and helps them escape.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage reports this as a claimed custom; it does not explicitly frame
    it as a sacred exchange.
