canonical_text:
  quote: ''
  summary: The passage describes and compares combs, hair-ornaments, beads, quiver-handles,
    and sledge-line buttons from Netchillik, Southampton Island, Iglulik, the probable
    east coast of Hudson Bay, Aivilik, Ponds Bay, and Vansittard Island, emphasizing
    repeated artifact types and regional variations in form, decoration, and use.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Three small Netchillik comb specimens differ somewhat from other specimens
    of the region, though they also have a large top.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Southampton Island combs are described as distinct in type, with open-work,
    window-shaped tops divided by a medial bar and a cross-bar near the teeth.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The top ornaments of the Southampton Island combs are broken; described variants
    include a broken projection, two symmetrical inclined portions, and a single ring.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Two small combs probably from the east coast of Hudson Bay resemble Southampton
    Island combs in having a window-like opening, but they lack the cross-bar and
    differ in top decoration.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hair-ornaments are presented as examples of the permanence of types, and one
    specimen is said to be so similar to a previously figured specimen that it might
    be considered its mate.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A typical hair-ornament is a flat ivory tablet, wider at the bottom than at
    the top, with three lower perforations from which three ivory beads are suspended
    and upper-corner perforations for suspension.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hair-ornament decoration consists of dotted lines, including marginal lines,
    a central line, and sometimes lines following the upper or lower edge.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Some beads attached to hair-ornaments may have been used in jacket fringes;
    Captain Comer’s notes identify one bead as from a fringe on the lower edge of
    an angakok’s coat.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Quiver-handles are presented as examples of permanence of type in detail;
    a Ponds Bay specimen is said to be very similar to a Central Eskimo specimen and
    is carved as a rude animal form.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: One quiver-handle has numerous cuts on the upper edge, apparently intended
    to provide a firmer hand grip.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: An Aivilik wooden quiver-handle has one side used as the hearth of a fire-drill,
    with a rectangular groove cut out and one end used for twirling the fire-drill.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Two Vansittard Island quiver-handles have regular depressions or grooves on
    the lower side that fit the fingers; one ivory specimen has larger end perforations
    and may have been used to carry another object.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: Toggle-shaped buttons for closing sledge-lines, described for the Central
    Eskimo, are said not to occur in northern Baffin Land; the passage instead refers
    to a peculiar animal-head button type and an Iglulik specimen.
  category: relationship
  evidence_refs:
  - ev:7
