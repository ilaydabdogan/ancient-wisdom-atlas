candidate_motifs:
- id: motif:1
  label: Fatal misrecognition of dangerous animals as small prey
  taxonomy_refs: []
  basis: The old hunter, who cannot see well, thinks musk-oxen are lemmings and approaches
    them before being killed.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives the event plainly; no broader interpretation of the
    misrecognition is supplied.
- id: motif:2
  label: Abandoned rival survives and reverses the abandonment
  taxonomy_refs:
  - return
  basis: Ebearkjoug is left on an island without his kayak, survives the winter, then
    takes Tulucuttookjuark's kayak and returns to the mainland while Tulucuttookjuark
    is left behind to starve.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The taxonomy reference is broad; the passage frames the episode as a quarrel
    and reversal rather than as a formal heroic return.
- id: motif:3
  label: Fighting white and black bears
  taxonomy_refs:
  - duality
  basis: The tale states that a white bear and a black bear came to the island and
    fought.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The fighting bear pair is mentioned briefly, and its narrative function
    is not explained in the passage.
- id: motif:4
  label: Repeated wife-taking followed by revenge raid
  taxonomy_refs:
  - stolen_beloved
  basis: Pupicluarkjoug takes away three wives from Memuckluarkjoug; Memuckluarkjoug
    then takes revenge, killing Pupicluarkjoug and taking the women.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage does not describe the women's own choices or kinship status
    beyond saying they were wives taken away.
- id: motif:5
  label: Lethal fulfillment of a complaint about cold food
  taxonomy_refs: []
  basis: A husband complains his food is not hot enough; after the wife follows advice
    to add plenty of oil, he drinks soup that is too hot and dies.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The text does not explicitly state whether the death is intended as punishment,
    accident, or revenge.
- id: motif:6
  label: Animal helper diagnoses blocked hunting luck
  taxonomy_refs:
  - wisdom
  basis: A speaking bear questions the unsuccessful sealer, makes him vomit foul meat,
    names it as the cause of bad luck, and advises him what to do if his wife refuses
    food or water again.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The bear gives knowledge and advice, but the passage excerpt ends before
    showing the outcome of the advice.
- id: motif:7
  label: Small charm enlarged by animal breath and stretching
  taxonomy_refs: []
  basis: The man gives the bear a mouse-skin charm; the bear holds it in both paws,
    blows on it, and stretches it until it can cover the bear's body.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not explain the enlarged skin's purpose beyond the action
    itself.
