canonical_text:
  quote: ''
  summary: 'The passage contains several brief tales: an old hunter mistakes musk-oxen
    for lemmings and is killed; his wife later dies while her daughter drives caribou
    into a pond, and the daughter reaches other people. Under a heading for quarrel
    stories, one man abandons a rival on an island, but the rival survives and later
    reverses the abandonment. Another man whose wives are repeatedly taken raids and
    kills the wife-taker. A wife, advised by an old woman, serves oil-rich soup that
    kills a complaining husband. A Netchillik tale begins with an unsuccessful sealer,
    denied food and water by his wife, who meets a speaking bear that enlarges a mouse-skin
    charm and diagnoses the cause of his bad luck.'
  language: English
  quote_policy: summarized
