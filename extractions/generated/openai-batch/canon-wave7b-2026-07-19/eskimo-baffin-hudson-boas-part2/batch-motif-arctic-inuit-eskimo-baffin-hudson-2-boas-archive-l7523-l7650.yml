candidate_motifs:
- id: motif:1
  label: animal guardian defeats hostile spirit
  taxonomy_refs: []
  basis: Karversealik’s fox guardian spirit is called into the house, fights the female
    tornaq, and kills it.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage presents a specific guardian-spirit action; broader motif
    family assignment is not specified in the supplied taxonomy.
- id: motif:2
  label: magic animal-skin talismans for warning and refuge
  taxonomy_refs: []
  basis: The loon-skin warns of enemies by flapping and crying, and the weasel-skin
    can open a boulder for refuge when tested.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage treats the items literally within the tale; no external motif
    index is supplied.
- id: motif:3
  label: loss of protective power when talisman is disabled
  taxonomy_refs: []
  basis: After the loon is shot with a dead man’s arrow and becomes a dry skin, the
    angakok loses his power and his people are killed.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The mechanism is specific to this tale and should not be generalized without
    comparison evidence.
- id: motif:4
  label: restoration from death and survival after dismemberment
  taxonomy_refs:
  - resurrection
  basis: Ittuckseeuke restores a dead mother to life, and later is alive and well
    after being cut to pieces.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not explain whether Ittuckseeuke’s own return is healing,
    resurrection, or invulnerability; the taxonomy link is limited to the observed
    return to life.
- id: motif:5
  label: co-wife jealousy expressed through lethal magic
  taxonomy_refs: []
  basis: The old wife resents her separation from the husband and young wife and uses
    angakok power to cause pups to kill them.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The co-wife conflict is explicit, but broader comparative classification
    is not provided by the passage.
- id: motif:6
  label: refusal of food punished by magical sleep-death
  taxonomy_refs: []
  basis: After the granddaughter is refused meat, the old woman causes the people
    in the other house to sleep until they die.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No divine agency is stated, so classification as divine judgment is not
    supported.
- id: motif:7
  label: haunting sounds of souls and dogs at a death-site
  taxonomy_refs: []
  basis: Travellers can hear the souls of the dead people driving dogs and the dogs
    howling in the region.
  evidence_refs:
