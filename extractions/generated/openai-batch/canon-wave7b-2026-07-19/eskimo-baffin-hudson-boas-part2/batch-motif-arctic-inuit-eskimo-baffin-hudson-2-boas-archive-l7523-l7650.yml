canonical_text:
  quote: ''
  summary: A sequence of short Inuit traditions recounts attacks and protections involving
    tornaq and angakok powers, magical animal-skin objects, witchcraft, death and
    restoration, co-wife jealousy, denial of food punished by death-sleep, weapon
    magic connected with the place-name Ouwertockpechark, and a hunter killed after
    disparaging a bear.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman named Avingaq is left in a hut while others are musk-ox hunting; a
    tornaq enters, and she flees while pursued around musk-ox skins.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Karversealik, an angakok with a fox guardian spirit, calls the fox; the fox
    fights the female tornaq and kills it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the fox kills the tornaq, people enter the house and find a strong smell
    and blood covering the inside.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: In a war episode, an unnamed angakok has a weasel-skin sewed to his under-garment
    and a loon-skin attached to his tent-pole.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The loon-skin can flap its wings and cry to warn its owner of approaching
    enemies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The angakok tests the weasel-skin by putting a stone into it and throwing
    it at a large boulder, which opens enough for people to enter and hide.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: When enemies later approach, the loon warns the angakok, but the weasel-skin
    no longer opens the boulder.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: An enemy shoots the loon in the mouth with a dead man’s arrow; it becomes
    a dry skin, the angakok loses his power, and he and his people are killed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: Ittuckseeuke is described as unmarried and a great angakok who can throw iron
    into the rear of the house and have it become a needle.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: Ittuckseeuke bewitches a jealous wife, causing her death, and later restores
    the woman to life out of pity for the dead woman’s son.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: A man cuts Ittuckseeuke to pieces; when he returns from getting whale meat
    and blubber, she is alive and well and asks him for some.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:12
  text: An old wife, separated into her own snow-hut from her husband and his young
    wife, uses angakok power to send young pups under their blanket; the pups’ whining
    worries them to death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: An old woman and her granddaughter have no food; after the granddaughter is
    refused meat by another house, the old woman causes those people to sleep until
    they die.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Travellers in the region south of Tununirn are said to hear the souls of the
    dead people driving their dogs and to hear the dogs howling.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:15
  text: Ouwertockpechark prepares arrow foreshafts from caribou-antlers by placing
    them under stones and pulling them for five mornings, making the arrows impossible
    to pull out after entering flesh.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: In a duel, Ouwertockpechark is struck in the toes, later learns his wife had
    once worn his boots, and recovers; his foe is struck in the leg, the arrow works
    deeper, and the foe dies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: The places where Ouwertockpechark and his foe stood are said to remain visible
    as small hollows in the ground.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:18
  text: A hunter says a bear is not as large as his dog; when he comes nearer, the
    bear attacks and kills him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:19
  text: The passage states a belief that depreciating an animal’s strength increases
    its size and strength.
  category: other
  evidence_refs:
  - ev:7
