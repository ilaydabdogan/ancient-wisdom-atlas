canonical_text:
  quote: ''
  summary: 'The passage describes Southampton Island material-culture specimens: whale-bone
    snow-shovels showing cutting, wedging, and drilling techniques; a whale-bone skin-scraper;
    and composite whale-bone knives with inserted flint or metal blades, including
    a large grave find and a smaller knife-point specimen. The author also notes external
    resemblances to North American Indian scrapers and Central American obsidian knives.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two snow-shovels are made from pieces of whale shoulder-blade and are used
    by the author to illustrate drilling, wedging, and chopping techniques.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first illustrated shovel has visible axe-cut marks, no evidence of drilling,
    and sides that suggest the bone was wedged apart after an axe cut was begun.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The second illustrated shovel has one edge formed by the natural shoulder-blade
    edge, a cutting-edge made by thinning the back, and about fifty drill-holes along
    a 285 mm edge.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: A whale-bone skin-scraper is described as a new type in the series, with a
    flat blade and numerous notches in the cutting-edge.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author states that this whale-bone scraper resembles North American Indian
    scrapers, while earlier scrapers described in the work were stone.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Prior reports describe bone cutting-implements with cutting-edges made from
    small blades of meteoric iron or flint.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A large Southampton Island specimen found by Captain Comer in a grave consists
    of a whale-bone piece 68 cm long and 3.5 cm wide, with grooves into which flint
    blades were inserted.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The large knife has a flint point tied by sinew, lateral blades apparently
    fastened by cement, and was said by Eskimo opinion to have been used for cutting
    whale blubber.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: A second similar specimen has three grooves for cutting-blades, a whale-bone
    piece 21 cm long, and a tip prepared for attachment of a large flint point by
    sinew string.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The smaller specimen shows drill-holes along the lower edge of the section,
    and the author infers that the bone was probably split with a wedge after crosswise
    drill-holes were placed.
  category: sequence
  evidence_refs:
  - ev:5
