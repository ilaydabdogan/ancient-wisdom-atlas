canonical_text:
  quote: ''
  summary: The passage first concludes a story in which Kamowalu returns after being
    thought devoured by wolves, reporting that her soul left her body and that she
    gathered her body together again. It then lists customs concerning seals, caribou,
    meat, animal souls, and food taboos. The passage next describes the angakok’s
    helper spirits, a performance associated with a desired visit to Sedna involving
    ground-ice, a walrus-spirit, harpooning, fright, water, and revival, and finally
    the winter full-moon performance called Elematato, in which a bound angakok’s
    soul is said to travel to the land of souls above while helper souls undo the
    knots.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kamowalu returns to the people after they had thought wolves had devoured
    her.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kamowalu says she lost consciousness, found that her soul had left her body,
    passed through the wolves, gathered her body together, and made it whole.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator states that Kamowalu had come to life again, and the story relater
    remembered seeing her as a young woman who lived to be very old.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The first seal caught at a breathing-hole in fall is divided among hunters
    except for its skin, while the first seal caught by a boy at a breathing-hole
    is divided among hunters including the skin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When a seal is cut up in a tent, its head is not to be placed directly on
    the ground; a tray, skin, feathers, or another object is placed under it, though
    the head may rest on the floor of a snow-house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Before a seal is cut up, a little water is poured on its body, and the passage
    says a few drops are considered a great quantity for the seal’s soul in winter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Cooking caribou-meat and seal-meat together in the same kettle is said to
    create friendship between the souls of the caribou and the seal.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The skin near the eyes of a killed caribou is left on the skull.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A person who has eaten human flesh is forbidden to eat bear flesh, ground-seal
    flesh, or raw seal-meat; bear and ground-seal are said to be considered alike.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: An angakok may have helper spirits in the form of walrus, bear, man, wolf,
    raven, owl, other animals, or inanimate things such as a kayak.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The angakok’s helper spirits may wander, but they return as soon as he needs
    them and are with him as soon as his wish is formed.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: When an angakok desires to visit Sedna, others assist him and interpret what
    he says after his return.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: In the described performance, the angakok sets up a ground-seal spear and
    line at the ground-ice with the harpoon point upward.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: A walrus-spirit enters the angakok; he loses knowledge of himself, his spirit
    assistants harpoon him as a hunter harpoons a walrus, and he believes he dives.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The walrus enters snow-houses and frightens people, who see harpoon-heads
    protruding from its body and blow on them.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: The people pour a little water over their feet, which the passage explicitly
    calls symbolic of drinking water, and this helps them recover from fright.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: The spirit assistants kill the walrus, drag it onto the ice, pull out the
    harpoon through its body, cut up the body, gather the meat, and the walrus revives
    and becomes a man again.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:18
  text: After the walrus revives, the angakok returns to the house and his spirit
    assistants remain outside ready to serve him during the following year.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:19
  text: In the Elematato performance, the angakok is seated on skin, bound with hide
    thongs, drawn so he cannot move, and covered with his jacket.
  category: action
  evidence_refs:
  - ev:13
- id: obs:20
  text: During Elematato, the angakok calls assistant spirits described as souls of
    living persons whom he can command; these souls undo the knots.
  category: action
  evidence_refs:
  - ev:13
- id: obs:21
  text: The Elematato explanation says the angakok’s soul had gone to the land of
    the souls above while he was tied, and when it returns the thongs are found unfastened.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:22
  text: Elematato is said to be held only during winter months at full moon.
  category: setting
  evidence_refs:
  - ev:13
