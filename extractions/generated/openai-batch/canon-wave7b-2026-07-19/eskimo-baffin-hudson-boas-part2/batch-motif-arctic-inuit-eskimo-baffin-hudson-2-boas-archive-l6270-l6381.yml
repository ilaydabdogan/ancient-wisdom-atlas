canonical_text:
  quote: ''
  summary: 'The passage contains several Cumberland Sound traditions: Qaudjaqdjuq,
    mistreated by his household and community, receives strength from the Man in the
    Moon, kills bears, then kills many people and injures two women kept as wives.
    A sequence of monster-bear episodes describes bears pursuing kayaks, attacking
    people hidden in rock fissures, and being killed or repelled. In one Sauniktung
    episode, sickness, deaths, and the monster bear Nanukluk are connected through
    an angakok''s consultation with Sedna to violations of rules after a ground-seal
    catch. The passage ends with a fragment introducing a very large man, Alainang,
    and his equally large wife.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Qaudjaqdjuq lived with his grandfather and grandmother but was not allowed
    into the hut, stayed in the passage-way where dogs were fed, and ate pieces of
    walrus hide taken from the dogs.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: People used Qaudjaqdjuq's hair for wiping their hands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After receiving strength from the Man in the Moon, Qaudjaqdjuq encountered
    bears said to have been sent by the Moon Man.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Qaudjaqdjuq killed the bears one after another by taking them by the legs
    and striking them against the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the people became afraid and fled, Qaudjaqdjuq pursued and killed them
    all except two women, and he also killed his grandfather and grandmother.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The two women spared by Qaudjaqdjuq became his wives; he later struck them,
    tearing out one woman's eye and dislocating the other's shoulder.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A monster bear with a long tail pursued kayaks, was attacked with lances,
    killed, later cut to pieces for fear it might revive, and its opened stomach contained
    the heads of several men.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ettorew, while hunting loons from a snow shelter near his kayak, saw a monster
    bear swimming and looking at the kayak; he ran ashore and later returned home
    by kayak.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Quairnang, people hid in a fissure of rocks from a monster bear; its hot
    breath forced them deeper, and its whiskers pierced and killed people like lances.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: People at Quairnang tied knives to sticks and attacked the monster bear, which
    withdrew while losing blood said to remain visible at the place.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Sauniktung, after a ground-seal had been caught before caribou-skin work
    was finished, women continued working on the skins; afterward many people became
    sick and died.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The monster bear Nanukluk came to Sauniktung; people hid in rock fissures,
    some were crushed, one man speared the bear, and the bear tried to force the rocks
    apart with its whiskers before leaving.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: During incantation, an angakok saw the ground-seal's spirit with a piece of
    caribou-skin tied to it, which angered the spirit.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Sedna told the angakok that the disasters were caused by disobedience of rules
    concerning work on caribou-skin and gave prohibitions to be observed after a ground-seal
    catch.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The fragment introducing the Giant tale names Alainang, his wife Eyeeyvolwalow,
    and describes them as very large, with Alainang possessing a very large bow and
    strong arrows.
  category: attribute
  evidence_refs:
  - ev:10
