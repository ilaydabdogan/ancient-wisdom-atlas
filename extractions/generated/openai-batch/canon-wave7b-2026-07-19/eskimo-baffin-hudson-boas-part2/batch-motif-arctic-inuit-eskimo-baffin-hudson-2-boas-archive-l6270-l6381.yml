candidate_motifs:
- id: motif:1
  label: mistreated person empowered by a celestial figure and transformed into an
    avenger
  taxonomy_refs:
  - miraculous_child
  basis: Qaudjaqdjuq is first excluded and humiliated, then receives strength from
    the Man in the Moon, grows or displays sudden strength, kills bears, and kills
    most of the people.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage does not explicitly call Qaudjaqdjuq a child, so the link
    to the supplied 'miraculous_child' family is tentative and based on the sudden
    growth/empowerment language.
- id: motif:2
  label: supernaturally sent animals as proof or occasion of power
  taxonomy_refs: []
  basis: Bears sent by the Moon Man appear after three days and become the occasion
    for Qaudjaqdjuq to show his strength publicly.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage does not state a formal test; this is a candidate pattern
    inferred from the sequence.
- id: motif:3
  label: man-eating monster animal revealed by contents of stomach
  taxonomy_refs: []
  basis: The killed monster bear is cut open and the heads of several men fall from
    its stomach.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No broader taxonomy reference supplied fits this animal-monster detail
    directly.
- id: motif:4
  label: fear of monster's revival leads to dismemberment
  taxonomy_refs:
  - resurrection
  basis: The men return and cut the monster bear to pieces because they fear it may
    revive.
  evidence_refs:
  - ev:4
  confidence: low
  cautions: The animal does not actually revive in the passage; the resurrection taxonomy
    reference is only a cautious association with anticipated revival.
- id: motif:5
  label: water or ice monster threatening hunters and settlements
  taxonomy_refs: []
  basis: Monster bears pursue kayaks, swim in water, come ashore from ice or water,
    and threaten people hiding in rock fissures.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:8
  confidence: medium
  cautions: The episodes may be separate local traditions rather than a single unified
    motif.
- id: motif:6
  label: taboo violation after animal catch causes sickness, death, and monster attack
  taxonomy_refs:
  - divine_judgment
  basis: After women continue caribou-skin work following a ground-seal catch, many
    people become sick and die, Nanukluk comes, and Sedna later identifies disobedience
