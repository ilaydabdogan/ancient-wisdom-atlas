canonical_text:
  quote: ''
  summary: 'The passage contains several short traditions: a woman leaves the body
    of her child and is ferried to Resolution Island after meeting people identified
    as bears; angakut attack a luminous supernatural being whose intestines remain
    visible on rocks; Kunginak dies in a blue flame that leaves an indelible blue
    color; angakut compete in feats including splitting a bleeding rock, enduring
    cold, animating a partridge-skin, and restoring an eaten foot; and a fragment
    introduces Teneme, a widow who takes food while claiming she wishes to starve.'
  language: English
  quote_policy: summarized
