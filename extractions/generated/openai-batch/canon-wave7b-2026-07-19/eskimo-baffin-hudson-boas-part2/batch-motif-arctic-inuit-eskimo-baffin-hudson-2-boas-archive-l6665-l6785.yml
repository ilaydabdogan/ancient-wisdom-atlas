candidate_motifs:
- id: motif:1
  label: human-bear or bear-people encounter
  taxonomy_refs:
  - shapeshifter
  basis: The passage explicitly says that the people encountered in the opening fragment
    were bears, while also describing them as people who take breakfast and go sealing.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: No transformation episode is described in this fragment; the shapeshifter
    taxonomy is only a cautious fit to the human-animal identification.
- id: motif:2
  label: supernatural being's body as lasting landscape trace
  taxonomy_refs: []
  basis: The being's intestines fall out after the attack and are said to be visible
    on the rocks up to the present day.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives a local explanatory trace but does not expand the origin
    explanation beyond the visible intestines.
- id: motif:3
  label: uncanny blue fire and indelible stain
  taxonomy_refs: []
  basis: Kunginak is found dead in a blue flame inside a hut with no outside sign
    of fire, and Pitchelak's hands remain blue despite washing.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not explain the cause of the burning or frame it as judgment.
- id: motif:4
  label: acquisition of angakok art through practice
  taxonomy_refs:
  - initiation
  basis: Keyak and Nikeraping practice for three days and are then said to have completely
    acquired the art of the angakok.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The account is brief and does not describe a full initiation rite; the
    taxonomy match is based on acquisition of shamanic art.
- id: motif:5
  label: shamanic contest of powers
  taxonomy_refs: []
  basis: The passage includes direct contests between angakut or aspiring angakut,
    with superiority shown by rock-splitting, underground reappearance, and resistance
    to freezing.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  cautions: No broader comparative taxonomy reference is assigned because the available
    motif list does not contain a specific shamanic-contest category.
- id: motif:6
  label: descent beneath ground and return
  taxonomy_refs:
  - hero_descent
  basis: Anauaping disappears into a chasm that closes over him and later reappears
    from under the ground at a distance.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage presents this as a shamanic feat rather than a full hero descent
    narrative.
- id: motif:7
  label: animation or resurrection of an animal skin
  taxonomy_refs:
  - resurrection
  basis: Nikeraping blows on a drying partridge-skin, after which the partridge comes
    to life and flies about.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The revived object is a skin rather than a narrated corpse; the resurrection
    taxonomy is used for the literal return to life.
- id: motif:8
  label: miraculous bodily restoration after flesh is eaten
  taxonomy_refs: []
  basis: After dogs eat off Kango's foot, Nowyadlang makes the dogs vomit the flesh,
    replaces it, and heals him.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage describes healing and restoration, not death and return to
    life.
