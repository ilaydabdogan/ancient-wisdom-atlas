canonical_text:
  quote: ''
  summary: 'The passage gives Cumberland Sound texts: the tale of Iavaanat, an Adla
    adopted by people near a river whose Adlet kin later kill women and are retaliated
    against, ending with Iavaanat''s arms cut off; a fragment introducing a mother-bird
    speaking to her young; and the beginning of the Amautialuk tale, in which a fabulous
    bird has a human wife in a stone dwelling, brings human flesh for food, and reacts
    violently when she hides.'
  language: English
  quote_policy: summarized
