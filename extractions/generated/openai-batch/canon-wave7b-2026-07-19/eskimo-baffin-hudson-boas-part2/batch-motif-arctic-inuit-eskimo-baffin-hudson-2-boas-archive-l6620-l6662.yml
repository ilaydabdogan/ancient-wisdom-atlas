canonical_text:
  quote: ''
  summary: A boat crew reaches a settlement, where an old head man asks for a young
    girl from the boat as his wife. After the boat leaves, he keeps her tethered by
    a thong. She later escapes with her child, travels over winter ice, avoids women
    who plan to stab her and are revealed as wolves, and then hides in an empty snow-house,
    smothering the child to keep it quiet as people enter.
