  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: If women had not finished work on caribou-skins, men sometimes did not return
    at night, thereby signaling that a walrus had been caught and the caribou-skin
    work must stop.
  category: action
  evidence_refs:
  - ev:2
- id: obs:10
  text: With continued north winds, the ice moved offshore and the walrus retreated
    with it; people then changed clothing and went caribou-hunting.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: The clothing change is attributed to a taboo against bringing walrus and caribou
