- id: obs:6
  text: At Quaiirnang, early autumn deer and caribou hunting and winter-clothing work
    preceded walrus hunting; after walrus hunting began, work on caribou-skin had
    to cease.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Walrus hunters usually worked in pairs, with one man throwing the harpoon
    and another holding and paying out the coiled line.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: When a walrus was caught, hunters assembled to pull it out, and sometimes
