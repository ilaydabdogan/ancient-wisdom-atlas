canonical_text:
  quote: ''
  summary: The passage gives a Southampton Island origin account in which a hunter
    and his dog drift to the island, the dog bears pups and then a girl, the hunter
    later marries the girl, and the people descend from that couple. It then records
    Hudson Strait seasonal walrus and caribou hunting practices, a taboo requiring
    separation of walrus and caribou, whale-bone houses and hut ruins, abundance near
    King's Cape, and a starvation incident in shallow water.
  language: English
  quote_policy: summarized
