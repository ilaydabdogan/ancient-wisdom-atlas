canonical_text:
  quote: ''
  summary: The passage describes several bone and ivory objects from Southampton Island
    and nearby Arctic localities. It interprets some whale-bone pieces as tent-pole
    crosspieces, describes unknown curved bone implements with splices, facets, perforations,
    and wear from tying-strings, discusses uncertain bone points possibly related
    to harpoon-line attachment or to the preceding objects, identifies some similar
    tools as sewing creasers or smoothers, and explains old harpoon foreshafts used
    before metal introduction, including grooves, perforations, and possible retaining
    devices for detachable harpoon-points.
  language: English
  quote_policy: summarized
