canonical_text:
  quote: ''
  summary: The passage gives notes on Sedna, Ululiernang, and Omerneeto traditions,
    then describes an origin account for birth, childbirth and child-rearing customs,
    taboos for mothers, rites intended to make boys successful hunters, treatment
    of a boy's first seal, beliefs about charms guarding a child's soul, and a tale
    in which Angeminwa enforces Omerneeto's rule against mothers eating alone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sedna's father is described as sitting beside the door in Sedna's hut with
    his head covered and his hand raised to seize entering souls and draw them under
    his blanket into his bed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ululiernang is said to use a deer's foreleg as a cane and to carry a woman's
    knife, a tray, a needle, and thread.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Iqalukdjuaq, an angakok in Aggo, claims to have visited the moon several times
    and describes Ululiernang's appearance.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Akkolookjo and his wife Omerneeto are said to have established laws that the
    Eskimo now have to obey.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the origin-of-birth account, an infant soul crawls from the ground up Omerneeto's
    loose boot-string and into her womb; before this, children had been found in the
    snow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The child grows in Omerneeto's womb, is born, cries, later learns to speak,
    and tells its parents about its experience inside the womb.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The child describes the womb as a small house and says that during the parents'
    cohabitation a dog came in and vomited food for the child to grow.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Women in childbirth may induce vomiting to aid expulsion of the afterbirth;
    the afterbirth is placed deep in a crack between rocks so that dogs cannot reach
    it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A newborn's navel-string is tied with plaited seagull wing-sinews, cushioned
    with grass-seed down, and cut over the mother's thumbnail with a sharp-edged stone;
    the newborn is generally cleaned with bird skins.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A new mother has food and handling restrictions, including eating only in
    the morning and evening, not eating alone, cooking her own food, avoiding cold
    water, and lifting a cup with both hands.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Before eating, the mother holds a small piece of food to the infant's mouth,
    dries it in a small bag, and has it sewn as a charm to the child's hood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A pregnant woman or a woman with a young child must avoid animals shot through
    the intestines and certain harpooned seals that die without surfacing to breathe.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A mother performs actions with her infant boy, including a fork-throwing action
    and imitated paddling, harpooning, and shooting movements, to make him a successful
    hunter.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Seal sweet-breads are placed on the soles of an infant boy's feet so that
    he may walk safely on thin ice, and the boy must sprinkle water toward the new
    moon the first time he sees her to become a successful sealer.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: When a boy harpoons his first seal, men help him; after the seal is caught,
    the boy removes his jacket and shirt and the men drag the seal over his back while
    he lies on the snow.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: 'Parts of the first seal are disposed of in prescribed ways: the head skin
    goes to an old woman for a bag, and head bones and first flipper joints are kept
    for a year and then placed in a relative''s grave.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: The passage states that Omerneeto instituted the customs concerning mothers
    and young children.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: Charms are considered watchmen guarding the child's soul; if a child dies,
    the mother must avoid work that would harm the soul for twelve months.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:19
  text: If the mother scrapes skins after the child's death, the child's soul may
    become a tupilak; the soul can be freed only when an angakok stabs it and cuts
    off the attachment.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:20
  text: In the tale of Aning, unseen hands snatch meat from her; an angakok says Angeminwa,
    a being made of bone and skin sent by Omerneeto, took the food because Aning ate
    and drank alone against the rule for mothers of young children.
  category: sequence
  evidence_refs:
  - ev:10
