canonical_text:
  quote: ''
  summary: 'The passage contains several Hudson Bay Inuit tales: a maltreated wife
    flees to a polar-bear house and escapes after the bears encounter a man; a woman
    gives water to a she-bear and cubs, but her husband tracks and kills the cubs
    and is killed in return; a neglected boy is carried by a Bear over the water to
    the Bears’ country, lives and hunts there, returns under a secrecy command, and
    is later aided by bears; and a woman lost in a snowstorm enters a hut of the dead,
    is warned not to eat bloody venison, loses a string of musk-ox teeth, rejoins
    her party, and later finds the teeth in her pouch.'
  language: English
  quote_policy: summarized
