candidate_motifs:
- id: motif:1
  label: Abused wife flees into an animal household
  taxonomy_refs:
  - departure
  basis: The wife runs away after maltreatment, carrying her infant, and hides in
    a house occupied by polar bears.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage presents flight and concealment literally; broader departure
    symbolism is a cautious taxonomy fit.
- id: motif:2
  label: Experienced animal elder warns against human weapons
  taxonomy_refs:
  - wisdom
  basis: The old bear warns the young bear of human power and supports the warning
    by showing spear-wound scars.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The motif is local to the bear episode and does not elaborate a formal
    wisdom quest.
- id: motif:3
  label: Animal revenge for killed offspring
  taxonomy_refs: []
  basis: After the husband kills the she-bear’s cubs, the she-bear kills him and returns
    to kill the woman.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: No supplied taxonomy reference directly names this revenge pattern.
- id: motif:4
  label: Hospitality to animal visitors with secrecy request
  taxonomy_refs:
  - sacred_exchange
  basis: The woman gives water to the she-bear and cubs and promises not to tell her
    husband about their visit.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The sacred-exchange taxonomy reference is approximate; the passage describes
    water-giving and secrecy rather than an explicit ritual exchange.
- id: motif:5
  label: Human journey to the Bears’ country with animal guide
  taxonomy_refs:
  - mystical_quest
  - departure
  - return
  basis: The Bear carries the boy across water to the Bears’ country, where he lives
    and hunts, then returns him home.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage does not call the journey mystical; the label reflects the
    otherworld-like animal country and return pattern.
- id: motif:6
  label: Eyes closed during passage between worlds
  taxonomy_refs:
