candidate_motifs:
- id: motif:1
  label: Insatiable hunger leading to cannibalism and death
  taxonomy_refs: []
  basis: Teneme eats dog food, begs constantly, frightens Unaraw as a potential eater,
    and later kills and eats her children before dying.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage gives no explicit explanation for Teneme's hunger or condition.
- id: motif:2
  label: Community containment of a dangerous person
  taxonomy_refs: []
  basis: After Unaraw's report, the men decide to desert Teneme and shut her house
    with her and her children inside.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage describes the action but does not frame it as ritual punishment
    or formal judgment.
- id: motif:3
  label: Predatory being slain by coordinated deception
  taxonomy_refs: []
  basis: The armed party uses ground-squirrel sounds and posture to draw the agdlaq,
    while the survivor kills it by jumping over and stabbing it.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The nature of the agdlaq is not further explained in the excerpt.
- id: motif:4
  label: Doubted witness vindicated by monster hunt
  taxonomy_refs: []
  basis: The survivor's report of the agdlaq killing is doubted, but the later hunt
    reveals the agdlaq and the killed man's remains.
  evidence_refs:
  - ev:3
  - ev:4
