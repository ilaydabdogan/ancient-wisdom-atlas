canonical_text:
  quote: ''
  summary: The passage contains the close of a tale about Teneme's hunger, confinement,
    cannibalism, and death; a tale in which hunters kill an agdlaq that had killed
    a man; a travellers' tale about a large wolf trap and a wolf-skin jacket; several
    hunters' tales involving a walrus, a whaling accident, a gigantic whale used as
    a dwelling, and Tecktelektak's survival after drifting on ice; and the opening
    of a quarrel tale.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Teneme takes food from a kettle before it is cooked, eats it, and asks Unaraw
    for more because she is hungry.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Teneme visits other people to beg for food and continues asking for more regardless
    of how much she receives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Teneme stares intently at Unaraw; Unaraw moves back because she fears Teneme
    will eat her, and Teneme withdraws when another visitor arrives.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The men decide to desert Teneme, close the door of her house, and shut her
    inside with her two children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After several months, a sledge returns and finds that Teneme has killed and
    eaten her children and that she is also dead.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: An agdlaq comes from behind two caribou-hunters and kills one of them; the
    surviving companion reports this, but the villagers initially doubt him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: An armed party finds the agdlaq, makes ground-squirrel noises, and lies on
    their sides as it turns toward them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The surviving hunter approaches the agdlaq, repeatedly jumps over it when
    attacked, stabs it with his lance, and kills it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the agdlaq is cut up, the people find bones of animals and of the killed
    man; the man's chest had been used to store caribou fat.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kilookoota and Puneyloo see a large snow-house-like trap, built like a fox-trap,
    with four wolves caught in it.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Koomungapuk says the trap belongs to him and that he catches wolves for their
    warm skins; Kilookoota exchanges a caribou-skin jacket for a wolf-skin jacket.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Inark and Unako kill a walrus on the ice; their dog eats some meat, swallows
    a bone, is injured internally, and is cured by an angakok.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Uluriakdju's leg becomes entangled in a whaling-line and is twisted off; the
    whale later stands on the water and allows itself to be killed, while Uluriakdju
    dies from blood loss.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: People in Iglulik cut a whale described as as long as a large island and as
    high as a mountain, and live in it for a long time.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Tecktelektak goes adrift when ice breaks while he is hunting dovekies; his
    people later see him far off and give him up for lost when he does not return.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: Tecktelektak reaches Resolution Island, dreams of catching a seal, then catches
    seals, makes skin floats into a raft, and returns to the mainland.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: The excerpt begins a quarrel tale in which Sherpaloo and Ouleyen walk behind
    a sledge driven by Eperjennoucheelee, and Sherpaloo becomes angry and scolds his
    wife.
  category: sequence
  evidence_refs:
  - ev:11
