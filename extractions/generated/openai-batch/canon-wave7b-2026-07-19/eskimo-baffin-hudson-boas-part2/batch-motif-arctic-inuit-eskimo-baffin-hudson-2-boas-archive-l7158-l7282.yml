candidate_motifs:
- id: motif:1
  label: child killed by deceptive host or caretaker
  taxonomy_refs: []
  basis: The hut woman welcomes the mother, asks to care for the child, and then cooks
    the child in a kettle while waiting for her people to return.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage does not explicitly label the act as cannibalism, though it
    says she waited for her people to come home and eat the cooked child.
- id: motif:2
  label: dwarf sighting as gale omen
  taxonomy_refs: []
  basis: Kupaq states that seeing a dwarf means a gale may be expected, and a gale
    destroys the unsecured village tents the next day.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The motif is local to the passage; no external taxonomy reference is supplied.
- id: motif:3
  label: dwarfs linked to controlling or intensifying wind
  taxonomy_refs: []
  basis: When people pursue the fleeing dwarfs, the wind increases whenever they approach
    and forces them to return.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage describes the repeated association but does not explicitly
    state that the dwarfs cause the wind.
- id: motif:4
  label: size-changing dwarf antagonist
  taxonomy_refs:
  - shapeshifter
  basis: A dwarf grows until he is as large as the Eskimo before wrestling, and the
    passage states that dwarfs can assume any size they please.
  evidence_refs:
  - ev:7
  - ev:13
  confidence: high
  cautions: The available taxonomy term 'shapeshifter' is applied to change of size
    rather than change of species or form.
- id: motif:5
  label: animal helper in combat
  taxonomy_refs: []
  basis: The hunter's dog bites the dwarf in the heel, enabling the hunter to throw
    and kill him.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The helper is an ordinary dog in the passage, with no explicit supernatural
    status.
- id: motif:6
  label: inaccessible otherworldly dwelling
  taxonomy_refs: []
  basis: The hunter cannot enter the dwarf house because the entrance closes whenever
    he stoops to enter.
  evidence_refs:
  - ev:9
