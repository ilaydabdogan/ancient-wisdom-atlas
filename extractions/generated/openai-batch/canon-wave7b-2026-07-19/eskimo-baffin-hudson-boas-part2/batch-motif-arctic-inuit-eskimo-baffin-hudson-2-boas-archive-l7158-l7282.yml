canonical_text:
  quote: ''
  summary: 'A travelling couple encounter a woman who cooks their child while they
    build a snow-house. Several stories about dwarfs follow: Kupaq finds a dwarf''s
    bow near a caribou and warns of a gale after seeing a dwarf; another hunter wrestles
    a dwarf who grows to human size, kills him with help from his dog, and later finds
    the fleeing dwarfs associated with rising wind; other statements describe tiny
    dwarf dogs and dwarfs'' ability to assume any size. A Tornit account then describes
    ancient Tornit stone houses, a Tornit attack on an Eskimo village, revenge by
    the Eskimo, the killing of Tornit adults and captive children, two surviving Tornit
    children, and a surviving Tornit boy''s extraordinary spear-throwing before his
    escape.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A travelling man and wife came to a hut, and the wife entered it to warm herself
    and the child carried on her back while the man built a snow-house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman in the hut asked the child's name, recognized it as the name of
    a former brother, and asked to care for the child while the mother helped outside.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mother later found that the woman had put the child in a kettle and cooked
    it, and the parents fled with their sledges.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kupaq found the head of his caribou cut off, saw a dwarf's bow, and saw a
    dwarf standing on a hill.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kupaq said that when a dwarf is seen a gale may be expected, secured his own
    tent-cover, and his tent alone survived the following day's gale.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A hunter followed tracks of a dwarf dragging a young seal to the dwarf's house.
  category: action
  evidence_refs:
  - ev:6
