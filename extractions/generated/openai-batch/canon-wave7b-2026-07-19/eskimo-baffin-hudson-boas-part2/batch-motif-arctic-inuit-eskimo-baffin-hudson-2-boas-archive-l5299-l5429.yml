  quote_or_summary: 'Three women are introduced: one marries a dog and is ancestress
    of all people; a second marries a bird; her father takes her away, throws her
    overboard when pursued, cuts off her fingers, and the joints become sea-mammals.'
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; concise summary used.
- id: ev:3
  type: summary
  locator: lines 5320-5327
  quote_or_summary: The transformed woman lives beneath the waters, rules sea-mammals,
    lives with her father and the dog, has one eye, suffers blind-eye pain from human
    sins, and may withhold sea-mammals unless the angakok removes the cause.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; concise summary used.
- id: ev:4
  type: summary
  locator: lines 5328-5338
  quote_or_summary: There is no particular report on the third woman; Nuliayoq is
    elsewhere identified with the mother of dogs and White Men near Iglulik; Anautalik
    is noted as formerly recorded as father of Nuliayoq but in the following story
    is described as a woman.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; concise summary used.
- id: ev:5
  type: summary
  locator: lines 5339-5353
  quote_or_summary: While adults are in a singing-house, children play separately;
    an abused orphan warns that Anautalik and a large ground-seal are coming, hides
    on a drying rack, and survives when the seal enters with a club and kills the
    children.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; concise summary used.
- id: ev:6
  type: summary
  locator: lines 5354-5368
  quote_or_summary: The next night people place an oil-lamp and a water-filled kettle
    in the doorway; they harpoon the returning ground-seal and scald Anautalik with
    boiling water. Her spirit becomes friendly, but she helps only when lamps are
    put out and remains afraid of hot water.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; concise summary used.
- id: ev:7
  type: summary
  locator: lines 5369-5380
  quote_or_summary: 'The thunder-storm sisters live with Nuliayoq: Kadlu makes lightning
    by rubbing dry seal-skin, Ignirtoq makes lightning by striking stones and rain
    by urinating; Nuliayoq sends them to punish taboo transgressions, and women offer
    Kadlu white-tanned sealskin.'
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; concise summary used.
- id: ev:8
  type: summary
  locator: lines 5381-5388
  quote_or_summary: When offended, Nuliayoq sometimes pounds the ground underneath,
    causing earthquakes; dangerous places such as tide-rifts and stormy capes are
    believed to be her favored haunts where taboos must be carefully observed.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; concise summary used.
- id: ev:9
  type: summary
  locator: lines 5389-5404
  quote_or_summary: A child was to be named after a recently dead old man; when the
    mother refused because the child was a girl, she became ill. The angakok, after
    visiting the land of souls, said the dead man was offended; the mother gave the
    name and recovered.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; concise summary used.
- id: ev:10
  type: summary
  locator: lines 5405-5414
  quote_or_summary: The mild fall and winter of 1902 are attributed to the soul of
    an old man who died late in summer after saying he would procure milder winters;
    a similar earlier occurrence is also reported.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; concise summary used.
- id: ev:11
  type: summary
  locator: lines 5415-5429
  quote_or_summary: A man returned to life and went from the grave to his house; dogs
    barked at him in the entrance-way, and because he was not properly welcomed he
    turned back to the grave.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; concise summary used.
