candidate_motifs:
- id: motif:1
  label: animal-spouse ancestry within a Sedna/Nuliayoq variant
  taxonomy_refs:
  - sacred_marriage
  basis: The passage explicitly frames the account as a Sedna legend variant and includes
    women marrying a dog and a bird, with one woman named ancestress of all people.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: low
  cautions: The marriages are animal marriages, but the passage does not call them
    sacred; the taxonomy link is therefore tentative.
- id: motif:2
  label: dismembered body parts transformed into sea animals
  taxonomy_refs:
  - shapeshifter
  basis: The father cuts off the woman’s fingers, and the joints are transformed into
    sea-mammals.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The transformation applies to severed body parts, not to a whole person
    changing shape.
- id: motif:3
  label: underwater mistress withholds animals after taboo or sin
  taxonomy_refs:
  - divine_judgment
  basis: Nuliayoq rules sea-mammals beneath the waters, suffers from human sins, and
    withholds sea-mammals unless the angakok removes the cause; she also sends punishers
    after taboo transgression.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: high
  cautions: The passage uses terms such as sins and taboos but does not systematize
    a doctrine of judgment.
- id: motif:4
  label: supernatural attacker defeated by prepared trap
  taxonomy_refs: []
  basis: Anautalik and the ground-seal first kill children; on their return, people
