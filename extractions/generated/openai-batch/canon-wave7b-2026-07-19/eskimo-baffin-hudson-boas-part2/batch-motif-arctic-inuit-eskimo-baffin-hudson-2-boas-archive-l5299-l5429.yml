canonical_text:
  quote: ''
  summary: Boas reports Captain Comer’s notes on West Coast of Hudson Bay religious
    ideas, including a Nuliayoq/Sedna variant involving animal marriages, finger-joints
    becoming sea-mammals, Nuliayoq’s underwater rule and taboo enforcement, an Anautalik
    story, thunder-making sisters, earthquake and dangerous-place taboos, and several
    accounts of deceased persons affecting the living or returning from the grave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage introduces Comer’s account as a Sedna legend variant and says
    it differs from other recorded tales and may be affected by the tale of three
    girls who married animals.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the reported legend, one woman married a dog and is described as ancestress
    of all people, while a second woman married a bird.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The father took the bird-married woman away; when the bird pursued, the father
    threw her overboard.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the woman clung to the gunwale, her father cut off her fingers, and the
    joints became sea-mammals.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The woman identified in the account as Nuliayoq lives beneath the waters,
    rules sea-mammals, has one eye, and lives with her father and a dog.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sins committed by people give pain to Nuliayoq’s blind eye; an angakok must
    remove the cause, or she withholds sea-mammals from the upper world.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the Anautalik story, an abused orphan girl warns other children that Anautalik
    and a ground-seal are coming, hides on a drying rack, and survives when the seal
    kills the other children with a club.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The people later use an oil-lamp, a kettle of hot water, harpoons, and boiling
    water to kill the ground-seal and Anautalik; Anautalik’s spirit then becomes friendly
    but requires lamps to be put out during angakok performances.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kadlu makes lightning by rubbing dry seal-skin, and Ignirtoq makes lightning
    by striking stones and makes rain by urinating.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: When Nuliayoq is offended by taboo transgression, she sends the thunder-making
    sisters to punish people; thunder can also indicate Kadlu’s need of skins, so
    women offer white-tanned sealskin pieces.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Nuliayoq may cause earthquakes by pounding the ground underneath, and dangerous
    places such as tide-rifts and stormy capes are treated as her favored haunts where
    taboos require special care.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: A child was expected to receive the name of a recently dead old man; when
    the mother refused because the child was a girl, she became sick until an angakok
    said the deceased man was offended and the name was given.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: A mild fall and winter were attributed to the soul of an old man who had promised
    before dying to procure milder winters for the people.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: A man returned to life and came from his grave to his house, but dogs barked
    at him in the entrance-way, causing him to turn back to the grave.
  category: sequence
  evidence_refs:
  - ev:11
