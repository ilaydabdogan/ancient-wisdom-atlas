canonical_text:
  quote: ''
  summary: The passage recounts punishments by Nuliayoq for women who violate taboos,
    including a miscarriage taboo and Aknakviaq’s unspecified taboo breach announced
    by a singing dead dog. It then lists charms and amulets for hunting, protection,
    healing, strength, long life, and revival, including oil drippings, animal parts,
    flint, bugs and bees, and a charm-covered shirt. It also records incantations
    for shortening travel distance, a sneeze response addressed to the soul, and tupilak
    accounts involving a walrus, a polar bear, a guardian-spirit red spot, and an
    angakok who identifies a hostile maker.
  language: English
  quote_policy: summarized
