canonical_text:
  quote: ''
  summary: The passage compares snow-beaters, snow-knives, mattocks, scrapers, beaters,
    and combs from Southampton Island, Hudson Bay, Netchillik, Ponds Bay, Iglulik,
    Lyons Inlet, Aivilik, Gore Bay, and related regions. It describes materials, handle
    forms, knobs, perforations, blade attachment methods, notches, grooves, and regional
    differences in artifact types.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Small snow-beaters from Southampton Island and neighboring regions are made
    from a single piece of whale bone, are thicker than snow-knives, and have rounded
    edges.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wooden snow-beaters from the west coast of Hudson Bay include examples where
    a unilateral knob appears to result from narrowing the handle for a firmer hand
    grasp.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Small single-piece snow-knives from Southampton Island, Gore Bay, and Ponds
    Bay are described as similar to one another, curved, sharp-edged, and mostly furnished
    with a unilateral knob and a perforation for a suspension thong.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Larger snow-knives in the region are made of two pieces, usually with a bone
    or ivory handle and an ivory blade.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Southampton Island compound snow-knives have handles with two notches, while
    examples from Ponds Bay, Iglulik, Lyons Inlet, and Aivilik are described as having
    one unilateral knob.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Blade and handle attachment methods include square-cut joints tied with sinew
    in drilled grooves, spliced bevelled joints, halved handles with riveted blades,
    notched blade-and-handle fittings, and slanting joints in some specimens.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A small group of scrapers and beaters has handles with multiple grooves fitting
    the fingers.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The author summarizes that Hudson Bay double-bladed knives have a symmetrical
    knob, Netchillik double-bladed knives have a single knob, small snow-knives have
    a perforated unilateral knob, bone snow-beaters are straight with a unilateral
    knob, and compound snow-knives divide into Southampton Island and mainland/Baffin
    Land handle types.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Mattock handles are described as generally uniform and similar in form to
