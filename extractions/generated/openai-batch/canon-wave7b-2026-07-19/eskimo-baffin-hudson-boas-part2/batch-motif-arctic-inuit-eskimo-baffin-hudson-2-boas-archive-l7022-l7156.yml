canonical_text:
  quote: ''
  summary: A sequence of West Coast of Hudson Bay tales explains the origin and physical
    traits of caribou, the personified Wind and its control by an angakok, the petrification
    of Inukepowuke and her dog, Amautalik's abduction method, a women's revenge and
    migration, giant gull bones, a cannibal fish slain from inside, and a giant who
    floods land in revenge for his child's death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the caribou tale, people originally lived on small game, while one man
    obtained a caribou each day from beneath a large flat stone.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A follower lifted the stone after the first man left, and caribou continued
    coming out until they scattered over the earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first caribou-obtaining man struck caribou on the forehead and kicked
    them from behind, producing a forehead depression and shortened tail.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Wind is described as a being in human form who releases wind by opening
    his coat when warm.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: An angakok can make the wind subside by fastening the Wind Spirit's coat and
    crossing his arms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When threatened with a knife, the Wind Spirit says he could level everything
    on earth and demonstrates power by pushing over a mountain with his foot.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Inukepowuke left her people, became exhausted and starving, and was transformed
    with her dog into stones that remain visible.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: People passing Inukepowuke's stone leave a needle or piece of skin, believing
    she will help them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Amautalik is believed to live underground and to carry away people by covering
    them with the back part of her coat and forcing them into the hood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the women's emigration tale, one hunting party killed another, then stayed
    with the murdered men's wives; the women later learned what happened and planned
    revenge.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The women escaped to another part of the country and exchanged many of their
    boy children among themselves as future husbands.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Two men arrived after being carried off on ice while sealing; one was smothered
    when many women struggled to get him, and the other was guarded by two women.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A giant sea-gull is said to have carried whale bones inland and vomited them
    up; when it alighted on a hill, its feet covered the hill.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: A cannibal fish in a lake at the head of Chesterfield Inlet devoured killed
    caribou and dragged a man under water.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The dragged man's brother entered the fish's throat with a knife, cut it up
    from inside, and killed it; while he was in the fish's stomach, the skin peeled
    from his face.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: After Erqilit and Tornit killed Inuipassaksaq's infant child, the giant scooped
    up sea water with whales, seals, and walruses and poured it over land, destroying
    his enemies.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: Animal bones and a large ground depression are presented as present-day traces
    connected with the giant's actions and footprint.
  category: setting
  evidence_refs:
  - ev:12
