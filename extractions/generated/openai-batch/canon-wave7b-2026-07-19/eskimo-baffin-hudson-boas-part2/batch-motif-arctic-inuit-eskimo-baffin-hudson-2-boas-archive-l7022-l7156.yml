candidate_motifs:
- id: motif:1
  label: hidden source of game animals opened and animals released
  taxonomy_refs: []
  basis: Caribou emerge from beneath a flat stone; unauthorized lifting releases many
    caribou until they scatter over the earth.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No explicit prohibition is stated; the motif is framed as an origin tale
    rather than a moralized taboo.
- id: motif:2
  label: etiological shaping of animal anatomy
  taxonomy_refs:
  - culture_hero
  basis: A man alters caribou foreheads and tails, explaining present-day features.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The figure is not named a culture hero in the passage; the taxonomy link
    is based only on his etiological action.
- id: motif:3
  label: personified wind controlled by ritual specialist
  taxonomy_refs: []
  basis: The Wind is a person-form being whose coat releases wind; an angakok stops
    wind by fastening the coat and crossing the arms.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: No broader comparative wind taxonomy is supplied in the available list.
- id: motif:4
  label: petrified traveler receiving offerings
  taxonomy_refs:
  - sacred_exchange
  basis: Inukepowuke and her dog become stones, and passers-by leave small items in
    expectation of help.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage reports belief in help from the stone woman but does not describe
    a formal ritual system.
- id: motif:5
  label: underground being abducts person in garment hood
  taxonomy_refs:
  - stolen_beloved
  basis: Amautalik, believed to live underground, is believed to take the missing
    wife and carries victims away in her coat hood.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The abducted person is a wife, but the tale does not include recovery,
    pursuit, or a lover-spouse quest.
- id: motif:6
  label: female revenge migration and women-centered settlement
  taxonomy_refs: []
  basis: Women avenge murdered husbands, escape, establish a new settlement, and arrange
    future husbands from their sons.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: No close taxonomy family is available among the supplied references.
- id: motif:7
  label: giant bird explains visible bones in landscape
  taxonomy_refs: []
  basis: A huge gull is said to have carried whale bones inland and vomited them up,
    accounting for visible bones.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage includes an editorial comparison note but not enough detail
    to identify the compared tale.
- id: motif:8
  label: monster fish slain from inside after swallowing or attempted swallowing
  taxonomy_refs:
  - hero_descent
  basis: The rescuer jumps down the cannibal fish's throat and cuts it up from inside,
    killing it.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The descent is into a fish body, not explicitly into an underworld; the
    hero-descent taxonomy is therefore approximate.
- id: motif:9
  label: avenging giant destroys enemies by inundation
  taxonomy_refs:
  - flood_and_renewal
  basis: The giant pours sea water over land in revenge for his child's killing, destroying
    his enemies and leaving animal bones as traces.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage describes destructive flooding but does not mention renewal
    after the flood.
