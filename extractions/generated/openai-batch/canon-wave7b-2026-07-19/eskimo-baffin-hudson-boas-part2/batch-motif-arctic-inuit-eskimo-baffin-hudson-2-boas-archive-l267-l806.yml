  summary: Introductory ethnographic material describes collections and notes supplied
    by Comer, Mutch, and Peck; argues that artifacts from Hudson Bay, Fox Channel,
    Southampton Island, Smith Sound, and Alaska show closer historical and formal
    relations than previously recognized; notes corroborating cat's-cradle forms and
    names; discusses conservatism of tribal implement forms, orthographic conventions,
    illustrations, and begins a tribal enumeration table.
