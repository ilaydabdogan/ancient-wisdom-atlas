  summary: A man asks his wife for water and is refused. He calls a bear, which breaks
    the side of the house, fills the drinking-cup, and gives it to him. The frightened
    wife thereafter runs to meet him with water whenever he comes home. The man is
    later always successful in hunting. The narrator explains the bear as the returned
    soul of the man’s father or grandfather assisting him.
