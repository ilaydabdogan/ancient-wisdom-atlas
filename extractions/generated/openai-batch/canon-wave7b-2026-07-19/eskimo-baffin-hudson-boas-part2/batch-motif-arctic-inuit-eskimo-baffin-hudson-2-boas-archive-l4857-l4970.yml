canonical_text:
  quote: ''
  summary: 'The passage describes death and mourning practices: removal of a dying
    person from the tent, treatment of the body, cutting of bindings to free the soul,
    mourning restrictions, grave offerings, first-hunt taboos, and beliefs about souls,
    sins, and the angakok. It then gives two short tales: one about two young hunters,
    a death near a village, and a bereaved mother’s boy figure; another about Kamowalu,
    presumed eaten by wolves, whose spirit is encountered and who becomes alive again
    after ritual touching.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dying person is taken outside the tent so death will not occur inside; after
    death the body is taken back, while the soul is believed to remain at the place
    where death occurred.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If death occurs inside the hut, the hut and property must be destroyed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The body is wrapped, fastened with thongs, dragged around the hut from left
    to right, taken to the burial place, and then the fastenings are cut.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The knife used to cut the thongs must be left with the body, and the cutting
    is said to give the soul freedom to go and come.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: It is considered desirable for flesh to come off the bones quickly because
    this is thought to free the soul to go to the land of the dead.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: During the first days after death, people observe restrictions involving sledges,
    dogs, washing, hair, and nails; a person going out at night carries a knife to
    keep the soul away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: People in a distant village fast for one day after learning of a death and
    place a hard object under their pillows for one night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the third night, relatives bring food to the body, address the soul,
    recall the dead person’s kindness, and ask the soul to send abundant game.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the fourth night, relatives discard clothes made from animals caught
    by the deceased or touched by him, because these are said to be affected by the
    dark color of death.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the fourth night, relatives may go sealing; the first seal killed must
    be taken home whole, cut without witnesses, its entrails thrown into the sea,
    and relatives must not eat that first sea mammal.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A person afraid of harm from a dead person’s soul keeps a knife under his
    pillow.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Souls of the dead are said to return to houses because the sins of survivors
    weigh them down; they come to have the sins cut away so they can go to the land
    of souls.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The angakok can hear souls of both the living and the dead, although ordinary
    people cannot hear dead souls speak.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the Tununirn tale, one young hunter dies near a village; his mother later
    makes a figure of a boy, keeps it in her hood, loses it when another woman throws
    it out, and then attempts to strangle herself.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: In the Kamowalu tale, people believe wolves have eaten her; after three nights,
    a person sees her spirit, wets his fingers, touches her head and navel, and she
    sits up alive again.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
