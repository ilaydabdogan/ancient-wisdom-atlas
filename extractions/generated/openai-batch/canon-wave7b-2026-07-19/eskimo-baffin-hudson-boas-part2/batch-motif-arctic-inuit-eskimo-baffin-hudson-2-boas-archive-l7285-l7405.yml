canonical_text:
  quote: ''
  summary: 'The passage gives several short traditions: a Tornit catches and decapitates
    a bear; the Ignuckuark are eyelidless people who do not understand sleep and later
    offer fire to travelers; Shadow People are visible only indirectly or at death
    and fight while invisible; two skin-shedding musk-oxen are killed by hunters;
    and a stranded sealer survives among wolf-people through a knife gift, concealment,
    a stone attack, a way-finding stick, and escape from pursuing wolves.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One of the Tornit catches a bear with his hands while men are out hunting,
    and cuts off the bear's head because it swings and hinders him while he carries
    it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ignuckuark are described as a fabulous tribe without eyelids, and they
    shake a tired visitor because they think sleep is death.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ignuckuark are said to have short hair over their whole bodies, keep no
    dogs, live near the shore, and sometimes host visiting angakut hospitably.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man and wife in a snow-house cannot light their lamp, and people in the
    passage-way offer them a light; the travelers are afraid to accept it, and the
    offerers are identified as Ignuckuark.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Shadow People live in the same country as the Eskimo and exchange wives
    with them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Shadow Person appears only as a shadow when looked at directly, becomes
    bodily visible when looked at from the corner of the eye, and becomes visible
    after death.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: After an Eskimo kills one of the Shadow People, the Shadow People make war;
    their bows and arrows can be seen, but the people remain invisible.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Two musk-oxen have removed their skins, rub the skins to soften them, and
    sing praises of their country.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When dogs are heard, the musk-oxen put on their skins and go up a hill, where
    hunters later kill them; the men hear their song, which is still sung.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Two men drift on broken ice while sealing, reach shore, and enter two separate
    snow-houses; one enters a large house whose human-looking inmates are wolves and
    is devoured.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The other stranded man enters Ouearnacsuneark's house, gives her a knife,
    asks her help, and is hidden under bedding while his boots dry over the lamp.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Several wolf-country residents say they smell a man, and Ouearnacsuneark deflects
    suspicion by saying the smell is old meat or comes from another house and by claiming
    the boots are her husband's.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Ouearnacsuneark's husband also smells a man and becomes angry, but calms down
    when given the knife and promises to help the hidden visitor.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The visitor is given a large stone and kills a young wolf as he enters; the
    young wolf's children haul out the body, cut it in two, and taste the flesh.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: The host gives the visitor a short stick that indicates the direction of travel
    when placed in the ground; the visitor sees fog rising behind him, understands
    the wolves are pursuing, and reaches home safely.
  category: sequence
  evidence_refs:
  - ev:12
