  summary: The passage records beliefs and customs concerning witchcraft, cannibal
    children, a tale of retaliation by the spirit of cracking ice, a starvation-and-bear
    episode, and practices around pregnancy, birth, naming, teeth, childhood strengthening,
    hunting taboos, hair and skin rites, marital fidelity during travel, and disposal
    of the dead person’s used belongings.
  language: English
