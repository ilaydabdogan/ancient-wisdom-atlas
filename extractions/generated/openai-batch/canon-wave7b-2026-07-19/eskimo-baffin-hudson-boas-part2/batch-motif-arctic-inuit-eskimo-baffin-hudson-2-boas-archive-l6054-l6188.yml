literal_observations:
- id: obs:1
  text: A successful hunter is said to have been bewitched by a jealous couple, become
    mentally disturbed, played continually with seal-flipper bones, and died emaciated.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the bewitched hunter’s claims of success during play corresponded
    with hunters being successful.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A brief note says an ill-fed child turned upon its parents and devoured them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An Eskimo tried to kill the spirit that caused ice to crack by throwing a
    harpoon into a newly formed fissure.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ice-cracking spirit is said to have transformed the harpoon into salmon,
    induced the man to eat it, and caused the harpoon to emerge from his side before
    he died.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage explicitly states that people should not try to harm supernatural
    beings.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Top-Knot, while nearly starving with companions, later embraced a polar bear
    without weapons until his companions could kill it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A pregnant woman is instructed to rise before others and be first out of the
    house when a sledge arrives or something happens, so that the child will be quick.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Clothing worn during confinement is given after two or three months to an
    old woman, who takes it apart and remakes it with the top becoming the lower part.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: If a pregnant woman’s existing child is sick, the child’s soul is said to
    be jealous of the child to be born.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The navel-string is cut with a sharp white flint, and the mother wears the
    same clothing for three months after birth before discarding it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: To protect a child against witchcraft, the mother draws diagonal semen lines
    across the child’s chest after specified first cohabitations.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: When a child is first given food, the mother calls the name she wishes the
    child to bear, saying for it to come.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: A child that loses a tooth wraps it in meat and gives it to a dog, asking
    the dog to take the tooth and give another one.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: In Ponds Bay, a one-year-old boy is reported to eat a cooked dog’s head and
    chew skin from under a dog’s feet to strengthen his head and feet.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: A woman with a son should keep water in her kettle for visitors and wear a
    seal-skin strip with quartz pieces on her head, actions linked to the son’s hunting
    success.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:17
  text: Raven skins are used for garments for infant boys because they are believed
    to give power to discover game easily.
  category: object
  evidence_refs:
  - ev:8
- id: obs:18
  text: A boy sealing for the first time in winter should not shake snow from his
    trousers before putting them on, because of a later whale-hunting consequence.
  category: action
  evidence_refs:
  - ev:9
- id: obs:19
  text: A boy should not stay long in a tent when visiting, because this would make
    a future hunted whale stay long in the water.
  category: action
  evidence_refs:
  - ev:9
- id: obs:20
  text: A boy must not eat the first game he kills; older people should feast on it
    to make him a successful hunter.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:21
  text: A girl’s hair growth may be promoted by washing her hair with blood, attaching
    a bee to her hood, or placing caribou-antler velvet in or on the hood.
  category: action
  evidence_refs:
  - ev:10
- id: obs:22
  text: A woman who wants her child to have white skin sews a white stone to the child’s
    clothing.
  category: action
  evidence_refs:
  - ev:10
- id: obs:23
  text: Boys named after deceased women must not have their hair cut until they have
    caught the first ground-seal.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:24
  text: If a man goes on a long journey by kayak or boat, his wife must be faithful;
