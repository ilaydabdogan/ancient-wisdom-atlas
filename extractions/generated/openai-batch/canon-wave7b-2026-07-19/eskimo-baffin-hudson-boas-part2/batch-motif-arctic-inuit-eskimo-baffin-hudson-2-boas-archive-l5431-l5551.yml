canonical_text:
  quote: ''
  summary: The passage records a man said to have returned from death after spirits
    sent him back, then describes whaling customs and taboos, respectful treatment
    of game animals and their souls, punishments for offending Nuliayoq or animal
    spirits, and rites concerning seals, polar bears, salmon, walrus, caribou, and
    musk-oxen.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A nearly helpless man who desired death was taken by his two sons into hills
    near Whale Point, left there, cut himself with a knife, returned after two days,
    and said he had been dead but was sent back by spirits because he had come too
    soon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a whale was seen, people pointed at it with the third finger of the right
    hand, and hunters pursued it in kayaks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before the whale was captured, old people could watch, young women had to
    lie down in tents with loosened belts, children tied their legs together in pairs
    and walked inland out of sight of the sea, and no one could carry water; these
    actions were believed to make the whale quiet and keep it from striking boats.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the whale was towed to shore, people could eat, but cooking was forbidden
    until the back had been cut in two.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the first striker’s kayak approached shore, boys poured fresh water over
    its bow, which was believed to make them successful whalers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: During whale-cutting, people did not avoid being covered with grease and blood,
    in order to show Nuliayoq that they were pleased with the gift of the whale; old
    clothing was worn for this reason.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Whale meat was brought to a half-circle of stones for a feast with games;
    whale skin and meat were said to be piled in the center, each angakok danced around
    the pile, and women sang songs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After a successful whaling season, all clothing was discarded near the shore
    so that deer would not be offended during the deer-hunting season.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A fisherman who criticized the few small salmon he caught was said to have
    offended Nuliayoq; after eating the fish, he swelled until he burst and died.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A captured seal’s harpoon had to be taken into the hut and placed near the
    lamp to please the seal’s soul, which was believed to hover around the harpoon;
    if left outside, the soul would become cold and might report this to Nuliayoq.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A story says that when a harpoon was left outside, a seal’s soul begged a
    woman to take it in; when she refused, the seal’s soul entered her and was later
    born as her child.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After a polar bear was killed, parts of it were hung in the hut with small
    tools and objects attached as presents to the bear’s soul; this was believed to
    make the soul tell other bears it had been well treated so they would be willing
    to be caught.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: At the end of three days after a polar-bear kill, the killer threw the attached
    objects into the house for boys to seize and return to the owners; this was said
    to symbolize the bear spirit presenting objects to the people, and women were
    forbidden to comb their hair during the three days.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: If salmon boiling-water was spilled, the person had to pretend to vomit it
    so that the salmon’s mother would think her child had made the person sick and
    the salmon’s soul would not blame the Eskimo for wasting soup.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The passage states that wasting food offends spirits and brings bad hunting
    luck.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: Walrus skin was not to be used as dog food; albino caribou were not to be
    killed because killing one would bring the slayer’s death; caribou blood on clothing
    was not to be removed.
  category: other
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:17
  text: A woman without caribou sinew used seal sinew instead; the seal’s soul was
    said to feel ashamed because seal sinews are shorter than caribou sinews, and
    the seal caused the woman to become sick and die.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:18
  text: If a man pursuing musk-oxen became too tired to keep up, this was attributed
    to displeasure from spirits of musk-oxen he had formerly killed and not treated
    properly.
  category: relationship
  evidence_refs:
  - ev:12
