- id: ev:2
  type: summary
  locator: lines 5437-5453
  quote_or_summary: Whale sighting triggers pointing with the third finger, kayak
    pursuit, restrictions on old people, young women, children, and water carrying,
    all believed to quiet the whale and protect boats.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain; supplied passage.
- id: ev:3
  type: summary
  locator: lines 5454-5466
  quote_or_summary: After the whale is towed ashore, eating is allowed but cooking
    waits; boys pour fresh water over the first striker’s kayak; grease and blood
    show Nuliayoq satisfaction with the whale gift.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain; supplied passage.
- id: ev:4
  type: summary
  locator: lines 5467-5479
  quote_or_summary: Whale food is brought to a half-circle of stones; whale skin and
    meat are piled in the center; each angakok dances while women sing; the structure
    is linked with Parry’s description.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain; supplied passage.
- id: ev:5
  type: summary
  locator: lines 5480-5482
  quote_or_summary: After a successful whaling season, clothing is discarded near
    shore so deer will not be offended in deer-hunting season.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain; supplied passage.
- id: ev:6
  type: summary
  locator: lines 5483-5491
  quote_or_summary: West-coast Hudson Bay groups treat game respectfully; a fisherman
    criticizes small salmon, offends Nuliayoq, swells, bursts, and dies.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain; supplied passage.
- id: ev:7
  type: summary
  locator: lines 5492-5503
  quote_or_summary: A seal’s harpoon must be kept near the lamp because the seal’s
    soul hovers around it and could become cold; a seal soul once begged a woman to
    take the harpoon in, entered her when she refused, and was later born as her child.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain; supplied passage.
- id: ev:8
  type: summary
  locator: lines 5504-5521
  quote_or_summary: After a polar bear is killed, small parts are hung with tools
    as gifts to its soul, so it will tell other bears it was well treated; after three
    days the objects are thrown into the house for boys, symbolizing the bear spirit
    giving them to people; women do not comb hair during the period.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain; supplied passage.
- id: ev:9
  type: summary
  locator: lines 5522-5528
  quote_or_summary: If salmon boiling-water is spilled, the person pretends to vomit
    so the salmon’s mother and soul blame the salmon child rather than people; wasting
    food offends spirits and brings bad hunting luck.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain; supplied passage.
- id: ev:10
  type: summary
  locator: lines 5529-5531
  quote_or_summary: Walrus skin must not be used for dog food, and albino caribou
    must not be killed because the slayer would die.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain; supplied passage.
- id: ev:11
  type: summary
  locator: lines 5532-5538
  quote_or_summary: Caribou blood on clothing must not be removed; a woman who used
    seal sinew instead of caribou sinew shamed the seal’s soul, and the seal caused
    her sickness and death.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain; supplied passage.
- id: ev:12
  type: summary
  locator: lines 5539-5551
  quote_or_summary: A man who tires while pursuing musk-oxen is believed to suffer
    from displeasure of spirits of musk-oxen he formerly killed and did not treat
    properly.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain; supplied passage.
