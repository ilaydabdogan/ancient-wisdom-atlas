candidate_motifs:
- id: motif:1
  label: sent back from death because arrival was premature
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The man reports that he had been dead and was sent back by spirits because
    he had come too soon.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage gives no detailed afterlife geography or resurrection ritual;
    it reports a brief local anecdote.
- id: motif:2
  label: ritual quieting of hunted whale through social restrictions
  taxonomy_refs: []
  basis: Pointing, gendered and age-based restrictions, tying children’s legs, and
    water taboos were believed to make the whale quiet and prevent it from striking
    boats.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No taxonomy reference among the supplied motif families exactly names
    this hunting-rite pattern.
- id: motif:3
  label: hunted game as gift requiring respectful reciprocal treatment
  taxonomy_refs:
  - sacred_exchange
  basis: The whale is treated as Nuliayoq’s gift, the bear’s soul receives presents
    and symbolically returns objects, and seal and other game souls must be kept from
    offense.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:8
  confidence: high
  cautions: The taxonomy reference is broad; the passage concerns hunting customs
    rather than a single narrative exchange myth.
- id: motif:4
  label: offended game beings punish disrespect or waste
  taxonomy_refs:
  - divine_judgment
  basis: The fisherman who faults salmon dies after offending Nuliayoq; food waste
    offends spirits; the seal offended by sinew use causes death; mistreated musk-ox
    spirits tire the hunter.
  evidence_refs:
  - ev:6
  - ev:9
  - ev:11
  - ev:12
  confidence: medium
  cautions: The punishers include Nuliayoq and animal spirits; the passage frames
    the consequences as taboo enforcement, not formal judgment doctrine.
- id: motif:5
  label: animal soul enters woman and is born as child
  taxonomy_refs:
  - sacred_birth
  basis: The seal’s soul enters the woman who refused its request and is later born
    as her child.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The supplied taxonomy reference is approximate; the birth is of a seal
    soul through a woman, not explicitly a divine or heroic birth.
- id: motif:6
  label: animal soul reports treatment to future game
  taxonomy_refs:
  - sacred_exchange
  basis: The bear’s soul is expected to tell other bears it was well treated so they
    will be willing to be caught; the seal’s soul may report cold treatment to Nuliayoq.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: This is a recurring ritual logic within the passage rather than a developed
    mythic episode.
- id: motif:7
  label: ritual pretense redirects blame for wasted food
  taxonomy_refs: []
  basis: A person who spills salmon boiling-water must pretend to vomit so the salmon’s
    mother will think her child caused sickness and the salmon’s soul will not blame
    the people for wasting soup.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: Although the action involves deception, the passage does not identify
    a trickster figure.
- id: motif:8
  label: albino animal taboo with death consequence
  taxonomy_refs: []
  basis: Albino caribou must not be killed because death would come to the person
    who killed one.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage states the taboo briefly and gives no narrative example.
comparison_claims:
- id: claim:1
  claim: The half-circle of stones in the whaling feast is explicitly identified in
    the passage as the same structure previously described by Parry.
  claim_level: visual_similarity
  target: Parry’s described half-circle structure
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not reproduce Parry’s description, so the comparison
    rests only on the author’s statement.
- id: claim:2
  claim: The passage presents polar-bear proscriptions as similar to the preceding
    seal-related proscriptions, especially in treating the animal soul as responsive
    to human care.
  claim_level: same_function
  target: seal and polar-bear animal-soul treatment patterns
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: 'The specific rites differ: the seal rite centers on the harpoon and
    warmth, while the bear rite centers on gifts, reporting to other bears, and symbolic
    redistribution.'
