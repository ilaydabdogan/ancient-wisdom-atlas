  locator: lines 5431-5436
  quote_or_summary: A nearly helpless man is left by his sons in hills near Whale
    Point, cuts himself, returns after two days, and says he had been dead but was
    sent back by spirits for coming too soon.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
