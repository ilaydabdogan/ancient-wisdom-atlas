canonical_text:
  quote: ''
  summary: 'The passage catalogs Arctic material-culture specimens: salmon harpoon
    points and spears, an arrow point with screw-like knobs, an ivory fish-hunting
    point used with a float and throwing-board, needles for sealing wounds and stringing
    fish or drag-lines, a wooden sheath for harpoon points, an ivory walrus-hunting
    hook, the nuglutang game implement, and Southampton Island houses built of stone
    and whale bones with a nearly circular ground plan.'
  language: English
  quote_policy: summarized
