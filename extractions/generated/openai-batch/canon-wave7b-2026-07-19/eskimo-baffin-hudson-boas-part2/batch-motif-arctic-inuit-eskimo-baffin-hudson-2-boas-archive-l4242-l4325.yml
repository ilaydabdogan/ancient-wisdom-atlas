candidate_motifs:
- id: motif:1
  label: customary greeting formula and nose-rubbing etiquette
  taxonomy_refs: []
  basis: The passage gives set greetings and a customary nose-rubbing gesture, especially
    within parent-child and child-child relationships.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This is an ethnographic etiquette pattern, not a mythic narrative motif.
- id: motif:2
  label: kinship-title avoidance of elders’ personal names
  taxonomy_refs: []
  basis: Children must not call older people by their names and must use terms of
    relationship.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage records a social rule without explaining ritual or mythological
    meaning.
- id: motif:3
  label: single original singer followed by diffusion of song
  taxonomy_refs: []
  basis: The passage says that long ago only one woman could sing, then others learned,
    and now nearly all sing and many have their own songs.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The account is brief; it does not identify a culture hero, ritual origin,
    or supernatural source of song.
- id: motif:4
  label: abused woman’s flight to abandoned hut and suicide
  taxonomy_refs: []
  basis: The narrative sequence links repeated spousal violence, fear of further beating,
    movement to an abandoned hut, and hanging.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is a tragic anecdote; no supernatural or formal tale structure is
    provided.
- id: motif:5
  label: seal-hunting through stealth and animal imitation
  taxonomy_refs: []
  basis: Hunters crawl toward seals, kill a seal, arrange it naturally, and continue
    while imitating the appearance of a seal.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The imitation is a practical hunting technique in the passage; it should
    not be classified as shapeshifting without further evidence.
- id: motif:6
  label: resource-scarcity substitution in tools and weapons
  taxonomy_refs: []
  basis: The passage describes soapstone bullets when lead is unavailable, frozen
    walrus-hide harpoon-shafts when wood is unavailable, and needles made from bone
    or saw-blades.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: This is a technological adaptation pattern, not a mythic motif.
- id: motif:7
  label: starvation cannibalism in famine account
  taxonomy_refs: []
  basis: The passage states that many died of starvation near Wager River and that
    Toolooar killed twelve people and ate their bodies.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: The passage gives a historical famine report; it does not frame the cannibalism
    as ritual or myth.
- id: motif:8
  label: women as expert archers and kayakers among neighboring people
  taxonomy_refs: []
  basis: Aivilik say that Kidlingmiut women are expert archers and kayakers.
  evidence_refs:
  - ev:15
  confidence: medium
  cautions: This is reported by another group and is not elaborated with a story sequence.
- id: motif:9
  label: transporting a deceased elder’s body home by sled
  taxonomy_refs: []
  basis: During a friendly visit, an old man dies and the returning party takes his
    body back on a sled.
  evidence_refs:
  - ev:16
  confidence: medium
  cautions: The passage records the transport but gives no mortuary ritual explanation.
- id: motif:10
  label: neighboring land marked by abundant animals and copper
  taxonomy_refs: []
  basis: Kidlingmiut country is reported to have many musk-oxen, and Sinimiut country
