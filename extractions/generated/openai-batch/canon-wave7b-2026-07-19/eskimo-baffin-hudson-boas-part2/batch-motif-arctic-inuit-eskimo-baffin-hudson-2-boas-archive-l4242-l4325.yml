    names when addressing them.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: 4255-4257
  quote_or_summary: Long ago only one woman could sing; others gradually learned,
    and now nearly all sing and many have their own songs.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: 4258-4264
  quote_or_summary: A woman repeatedly beaten by her husband broke something, feared
    another beating, went to an abandoned hut, and hanged herself.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 4265-4269
  quote_or_summary: Before guns, hunters crawled close to basking seals, jumped up,
    and killed seals as they tried to enter holes or flee over ice.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 4270-4279
  quote_or_summary: A hunter harpoons a seal near a crack, holds the line, kills it
    at the edge with the harpoon-handle point, arranges it naturally, and continues
    while imitating a seal.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 4280-4281
  quote_or_summary: When lead is scarce or absent, men sometimes make bullets out
    of soapstone.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 4282-4286
  quote_or_summary: When wood is unavailable, a frozen strip of walrus-hide may be
    used as a harpoon-shaft and carried by a small strap so hand warmth does not thaw
    it.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: 4287-4292
  quote_or_summary: Needles were anciently made of bone, often from a fox foreleg,
    and later from narrow saw-blade pieces; many remember the saw-blade needles.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: 4293-4295
  quote_or_summary: Seven seal-skins are required to cover a kayak; seals are cut
    up the side, some left and some right.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: 4296-4297
  quote_or_summary: The gristle of the musk-ox ear is choice raw food eaten by both
    Aivilik and Kinipetu.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: 4298-4304
  quote_or_summary: In winter 1890–91 near Wager River, thirty-seven natives died
    of starvation and thirty-six barely survived; Toolooar killed twelve people and
    ate their bodies.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: 4305-4306
  quote_or_summary: Kidlingmiut live on Victoria Land; Aivilik say their women are
    expert archers and kayakers.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: 4307-4313
  quote_or_summary: In winter 1893–94 a Kidlingmiut party visited Qeqertaq, an old
    man died, they returned with his body on a sled, and they reported many musk-oxen
    in their country.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: 4314-4325
  quote_or_summary: The Sinimiut, evidently not the same as the Sinimiut of Committee
    Bay, are said to live west of the Netchillik, with plentiful copper in their country.
  source_text_path: texts/public-domain/arctic-inuit/project-gutenberg/eskimo-baffin-hudson-boas-part2.md
  rights_note: Public domain source; summarized.
