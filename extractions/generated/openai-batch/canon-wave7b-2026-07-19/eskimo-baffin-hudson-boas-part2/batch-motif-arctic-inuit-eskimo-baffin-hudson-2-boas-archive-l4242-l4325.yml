  summary: The passage records West Hudson Bay Inuit greetings, nose-rubbing, valuation
    of women’s skills, rules for addressing elders, the spread of singing, a narrative
    of an abused woman’s suicide, hunting and tool-making practices, kayak covering,
    food preferences, starvation and cannibalism in 1890–91, and reports about neighboring
    groups, including Kidlingmiut, Sinimiut, and resource locations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The regular salutation is given as the same as in Cumberland Sound, with “Assoyutidle!”
    and the evening greeting “Taimo!”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rubbing noses is described as customary, especially between parents and children
    and among children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Women are valued for skill in clothing-making, strength, and ability to bear
    and rear children.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Children must not address older people by personal names and must use relationship
    terms instead.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A tradition says that formerly only one woman could sing, but others gradually
    learned and now many people have their own songs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A woman repeatedly beaten by her husband went to an abandoned hut and hanged
    herself after breaking something while he was away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Before guns, hunters crawled close to basking seals, jumped up, and killed
    them as they tried to return to their holes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A hunter could harpoon a seal near a crack, hold the line, pull it to the
    edge, kill it with the harpoon-handle point in the eye, arrange it naturally,
    and continue advancing while imitating a seal.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: When lead was scarce or absent, men sometimes made bullets from soapstone.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: When wood was unavailable, a frozen strip of walrus-hide could be used as
    a harpoon-shaft and carried by a strap to avoid thawing it by hand warmth.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: Needles were formerly made of bone, often from a fox foreleg, and later from
    narrow pieces cut from saw-blades.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: Seven seal-skins are required to cover a kayak, and seals used for this are
    cut up the side, some on the left and some on the right.
  category: object
  evidence_refs:
  - ev:12
- id: obs:13
  text: The gristle of the musk-ox ear is considered choice raw food by both Aivilik
    and Kinipetu.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: During the winter of 1890–91 near Wager River, thirty-seven natives died of
    starvation and thirty-six others barely survived; Toolooar killed twelve people
    and ate their bodies.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: Aivilik report that Kidlingmiut women on Victoria Land are expert archers
    and kayakers.
  category: attribute
  evidence_refs:
  - ev:15
- id: obs:16
  text: In winter 1893–94, a Kidlingmiut party visited Qeqertaq, one old man died,
    and the party returned with his body on a sled.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: The Kidlingmiut reported many musk-oxen in their country.
  category: speech
  evidence_refs:
  - ev:16
- id: obs:18
  text: A group called the Sinimiut is said to live west of the Netchillik, with plentiful
    copper in their country.
  category: setting
  evidence_refs:
  - ev:17
