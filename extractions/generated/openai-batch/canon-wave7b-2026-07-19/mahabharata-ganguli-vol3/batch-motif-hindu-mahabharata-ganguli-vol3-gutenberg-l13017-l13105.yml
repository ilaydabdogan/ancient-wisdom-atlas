canonical_text:
  quote: ''
  summary: Sanjaya narrates that Shalya is made commander of the Kaurava forces after
    Karna's fall. Yudhishthira asks Krishna for counsel, and Krishna urges him to
    kill Shalya despite kinship ties, comparing the act to divine victories over asuras
    and using images of oceans, a cow's hoof-print, and universal destruction. Both
    armies rest, arm, make battle arrangements, and advance; Kaurava leaders make
    a mutual-support agreement sanctioned by grave sins. Dhritarashtra asks how Shalya
    and Duryodhana fell.
  language: English
  quote_policy: summarized
