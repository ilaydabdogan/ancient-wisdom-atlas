canonical_text:
  quote: ''
  summary: A teaching describes how Jiva and Yogins attain emancipation through sattwic
    acts, Yoga-knowledge, graded states, and passage through regions. The passage
    explains cycles of heaven, human birth, cosmic destruction, rebirth in later Kalpas,
    and ultimate entry into Brahma or union with the supreme Soul. Vritra accepts
    the teaching, recognizes Vishnu as Supreme Soul and cosmic support, casts off
    his life-breaths in Yoga, and attains the highest station. Yudhishthira then asks
    Bhishma whether Krishna/Janardana is the Lord described by Sanatkumara to Vritra.
  language: English
  quote_policy: summarized
