    one century of Kalpas and then in four named regions: Mahar, Jana, Tapas, and
    Satya.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A Yogin who falls from Yoga practices dwells in heaven for a century of Kalpas
    and later returns to the world of men, where he attains eminence.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The same Yogin later moves toward higher forms of existence and courses through
