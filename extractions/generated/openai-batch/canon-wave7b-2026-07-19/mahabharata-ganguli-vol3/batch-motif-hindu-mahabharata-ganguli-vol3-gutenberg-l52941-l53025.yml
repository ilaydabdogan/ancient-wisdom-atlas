  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After attaining White, Jiva travels through several adorable regions while
    pursuing the stainless, effulgent form of existence called Emancipation.
  category: action
  evidence_refs:
  - ev:1
