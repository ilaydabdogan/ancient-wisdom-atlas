canonical_text:
  quote: ''
  summary: 'Sanjaya narrates a battlefield sequence: Srutakarman and Citrasena duel
    until Srutakarman decapitates Citrasena and routs his troops; Prativindhya and
    Citra duel with arrows, dart, mace, and lance until Prativindhya kills Citra and
    routs attackers; Drona’s son then rushes against Bhimasena, with the encounter
    compared to the old battle of Vritra and Vasava.'
