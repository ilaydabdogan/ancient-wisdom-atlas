canonical_text:
  quote: ''
  summary: Duryodhana, positioned in the lake and claiming to be alone and disadvantaged,
    demands one-at-a-time combat with the Pandavas. Yudhishthira grants him choice
    of weapon and declares the stakes as kingship if Duryodhana wins, or heaven if
    he is slain. Duryodhana chooses the mace, rises from the waters armed and enraged,
    and is described through animal, solar, mountain, and divine-warrior similes before
    threatening the Pandavas and Pancalas with death.
  language: English
  quote_policy: summarized
