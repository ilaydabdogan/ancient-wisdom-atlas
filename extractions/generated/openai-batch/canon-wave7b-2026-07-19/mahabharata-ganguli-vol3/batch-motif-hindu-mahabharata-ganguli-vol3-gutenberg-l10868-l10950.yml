canonical_text:
  quote: ''
  summary: In battle, Arjuna dispels clouds caused by Karna and invokes a thunder-like
    celestial weapon associated with the chief of the celestials. His arrows pierce
    Karna and Karna's chariot equipment, but Karna invokes the Bhargava weapon and
    baffles Arjuna's weapon, then devastates Pancala and Somaka warriors. Kaurava
    warriors exult. Bhima angrily exhorts Arjuna to remember earlier wrongs and past
    feats and to slay Karna. Vasudeva likewise urges Arjuna, invoking analogies with
    Sakra's thunderbolt victory and Arjuna's prior encounter with Mahadeva, and says
    that Yudhishthira should receive the earth after the foes are removed. Arjuna
    resolves to kill Karna.
  language: English
  quote_policy: summarized
