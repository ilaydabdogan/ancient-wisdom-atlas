canonical_text:
  quote: Then from that body of the fallen Karna a light passing through the welkin
    penetrated the sun.
  summary: Arjuna invokes Truth and his prior ascetic and social merits before releasing
    a terrible, mantra-empowered shaft against Karna. The Anjalika weapon decapitates
    Karna, whose fallen head and body are described through solar, mountain, fire,
    and sacrificial images. A light from Karna's body enters the sun. The Pandavas
    and their allies celebrate with conchs and shouts, while the Kauravas and the
    king of the Madras withdraw in fear.
  language: English
  quote_policy: quoted
