canonical_text:
  quote: ''
  summary: Bhishma instructs Yudhishthira on the kinds of people to avoid or accept
    when forming friendships and alliances. He lists many traits of unsuitable associates,
    especially ingratitude and injury to friends, then lists traits of suitable allies,
    including truthfulness, gratitude, self-control, loyalty, and willingness to serve
    friends. He adds that a king allied with such superior people prospers. Yudhishthira
    asks for further detail about injurers of friends and ungrateful persons.
  language: English
  quote_policy: summarized
