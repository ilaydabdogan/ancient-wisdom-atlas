canonical_text:
  quote: The science of kingly duties is the refuge of the whole world of life.
  summary: 'Yudhishthira formally approaches Bhishma and asks him to teach the duties
    of kings, presenting them as central to moral order and worldly welfare. Bhishma
    invokes Dharma, Krishna, and the Brahmanas, then begins a discourse on royal duties:
    honoring gods and Brahmanas, exertion beyond destiny, devotion to truth, justice,
    secrecy in counsel, knowledge of foes, and moderation between excessive mildness
    and fierceness.'
  language: English
  quote_policy: quoted
