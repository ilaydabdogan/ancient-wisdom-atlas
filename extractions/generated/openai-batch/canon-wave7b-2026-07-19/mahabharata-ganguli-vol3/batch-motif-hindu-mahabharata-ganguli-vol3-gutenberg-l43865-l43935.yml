canonical_text:
  quote: ''
  summary: Bhishma recounts a meeting in which a Brahmana hospitably receives assembled
    deities and King Ikshvaku. The king and Brahmana debate giving, receiving, the
    duties of Brahmana and Kshatriya, and the transfer of the fruits of the Brahmana's
    long recitation. The Brahmana declares the fruits given, with Dharma, Time, Yama,
    and Mrityu as witnesses, but the king resists accepting fruits whose nature is
    unknown.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Brahmana offers water for washing feet and the usual Arghya articles to
    those assembled, and later offers a seat, foot-washing water, and Arghya to King
    Ikshvaku.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: King Ikshvaku arrives while journeying to holy waters and shrines, bows his
    head, worships the assembled deities, and asks after their welfare.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king identifies himself as a king and proposes to give wealth to the Brahmana.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Brahmana says he has abstained from accepting gifts and instead asks what
    he can give the king through the aid of his penances.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king says that, as a Kshatriya, he does not know how to say 'Give' except
    in the form 'Give us battle.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The king requests the fruits of the Brahmana's recitation, and the exchange
    is described by the king as wordy warfare between Brahmana speech and Kshatriya
    arms.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king asks for the fruits earned by a thousand years of recitation, and
    the Brahmana offers the highest fruit, half the fruit, or all the fruits of his
    recitations.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Brahmana says he does not know the fruits he has won but has given them,
    naming Dharma, Time, Yama, and Mrityu as witnesses to the act of gift.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The king says he does not want unknown fruits and tells the Brahmana that,
