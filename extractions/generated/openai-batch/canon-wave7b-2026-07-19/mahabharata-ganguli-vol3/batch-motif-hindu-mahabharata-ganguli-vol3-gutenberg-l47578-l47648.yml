canonical_text:
  quote: ''
  summary: Yudhishthira asks how one attains immutable Brahma beyond primordial nature.
    Bhishma answers by describing renunciant discipline and cites an old discourse
    in which Devala asks Jaigishavya about equanimity toward praise and blame. Jaigishavya
    teaches that wisdom consists in self-control, non-injury, non-retaliation, indifference
    to praise and blame, moral conduct, and conquest of the senses; such a person
    attains the highest rung of Brahma.
  language: English
  quote_policy: summarized
