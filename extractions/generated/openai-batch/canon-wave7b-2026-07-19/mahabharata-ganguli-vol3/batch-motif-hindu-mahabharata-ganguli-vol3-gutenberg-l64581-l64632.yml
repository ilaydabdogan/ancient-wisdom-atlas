canonical_text:
  quote: ''
  summary: A Brahmana asks a Naga, who goes by turn to drag Vivaswat's one-wheeled
    car, to report wonders seen in those regions. The Naga describes Surya as the
    refuge of wonders, source of creatures, locus of Munis, deities, Wind, rain, and
    the Supreme Soul. He then recounts seeing a radiant Being approach Surya at noon,
    enter Surya's disc, mingle with Surya's energy, and become indistinguishable from
    him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Brahmana asks the Naga to describe wonderful things noticed in the regions
    through which the Naga travels while going to drag the one-wheeled car of Vivaswat.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Naga says that divine Surya is the refuge or home of innumerable wonders
    and that all creatures inhabiting the three worlds have flowed from Surya.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Naga says that innumerable successful Munis and all the deities reside
    in Surya's rays, compared to birds perching on tree branches.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Naga says that the mighty Wind emanates from Surya, takes refuge in Surya's
    ray, and is divided by Surya into portions to create rain for creatures.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Naga says that the Supreme Soul is within the solar disc, that the Soul
    of the universe resides in certain rays of Surya, and that the foremost Purusha
    resides in Surya.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Naga says that Surya has a dark ray that becomes rain-bearing clouds,
    pours rain in season, drinks up rain for eight months, and pours it down again
    in the rainy season.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Naga reports seeing, at noon in the clear sky, a Being approaching Surya
    with effulgence equal to Surya's own and seeming to rend the firmament to make
    a path.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The approaching Being's rays are compared to the blazing effulgence of clarified-butter
    libations poured into sacrificial fire, and his splendour makes him impossible
    to look at or describe.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Surya extends two hands to receive the Being respectfully, and the Being extends
    his right hand to honor Surya in return.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Being pierces the firmament, enters Surya's disc, mingles with Surya's
    energy, and becomes transformed into Surya's self.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the two energies meet, the observers cannot distinguish Surya from the
    Being and ask Surya who has mixed with him and become his second self.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
