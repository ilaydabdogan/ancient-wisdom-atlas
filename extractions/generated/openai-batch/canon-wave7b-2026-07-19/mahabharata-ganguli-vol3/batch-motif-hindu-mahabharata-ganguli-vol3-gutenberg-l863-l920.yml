canonical_text:
  quote: ''
  summary: 'A speaker questions Sanjaya about Karna''s death, the reactions of warriors,
    Karna''s guards and deserters, a serpent-headed shaft, and grief over fallen Bhishma
    and Drona. Sanjaya begins recounting the aftermath of Drona''s fall: the Kaurava
    army flees, Partha holds the field, Duryodhana rallies troops, withdraws at twilight,
    and convenes a council.'
