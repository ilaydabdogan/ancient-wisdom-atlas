canonical_text:
  quote: ''
  summary: Vasishtha explains that, because of Ignorance, Jiva undergoes countless
    births and dissolutions. He compares Jiva with Chandramas, describing both as
    having sixteen portions, fifteen subject to change and a sixteenth that remains
    constant. The sixteenth portion is identified with pure Chit and Soma, while the
    changing portions are associated with Prakriti, embodiment, and creaturely birth.
    Emancipation is defined as the destruction of Jiva's liability to union with Prakriti.
  language: English
