canonical_text:
  quote: ''
  summary: A didactic passage contrasts the felicity gained by righteous acts with
    post-mortem punishments for disobedience, deception, and other wrongdoing. It
    describes hellish animals, the river Vaitarani, sword-leaved trees, and a bed
    of battle-axes. The speaker urges the addressee, called son, to pursue Emancipation,
    Yoga abstraction, righteousness, and durable spiritual wealth before Yama, Death,
    decrepitude, and disease overtake him. It states that relatives and material wealth
    do not accompany the dead to Yama's regions; only deeds do. The soul and embodied
    divine witnesses such as Fire, Sun, and Wind perceive human conduct.
  language: English
  quote_policy: summarized
