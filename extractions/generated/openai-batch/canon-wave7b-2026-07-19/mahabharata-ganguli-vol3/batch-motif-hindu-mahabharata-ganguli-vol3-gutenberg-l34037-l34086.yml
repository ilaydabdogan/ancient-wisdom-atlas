canonical_text:
  quote: Let us swear to conquer, and never to desert one another.
  summary: 'The passage gives counsel on organizing and encouraging soldiers: promote
    capable officers, gather principal warriors to swear not to desert, warn against
    the shame of flight, frame victory and death in battle as religiously meritorious,
    arrange troops tactically, and use shouts and instruments to strengthen morale
    against a larger enemy.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Chiefs of ten soldiers are to be made chiefs of a hundred, and a capable chief
    of a hundred is to be made chief of a thousand; selected persons are to receive
    food, drink, and seats equal to the addressee's own.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Principal warriors are to be gathered and addressed with an oath to conquer
    and never desert one another.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Those who are afraid or who would endanger their chiefs by neglecting heroic
    action are told to stay back, while only those who will not break from battle
    are called forward.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Flight from battle is associated with loss of wealth, death, infamy, reproach,
    captivity, harsh speech, and the loss of fame.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Victory is described as the root of religious merit and happiness, and fighting
    without regard for life is connected with attaining heaven if one conquers or
    dies.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After taking the oath, heroes prepared to give up life are instructed to rush
    courageously against the enemy ranks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: For an assault, swordsmen and shield-bearers are placed in the van, the car-division
    in the rear, and other combatants between them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Veteran, strong, and courageous combatants are to stand in front to protect
    those behind them; fearful and weaker combatants are to be comforted, encouraged,
    and kept on the field to show the army's numbers.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: When troops are few, they should be drawn close together, sometimes extended
    wide, and when fighting a larger army they should form the array called Suchimukha.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Against a larger force, the leader may shake hands with his men and falsely
    cry that the enemy has broken; strong troops are to call that fresh friends have
    arrived, while the advance troops shout and sound martial instruments.
  category: action
  evidence_refs:
  - ev:8
