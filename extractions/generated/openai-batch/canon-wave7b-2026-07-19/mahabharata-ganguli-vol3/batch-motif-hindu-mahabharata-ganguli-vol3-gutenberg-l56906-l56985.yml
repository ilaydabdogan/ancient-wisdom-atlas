  quote: '"like the waves of the ocean disappearing in the ocean that gives them birth"'
  summary: The passage explains Yoga and Sankhya as means of beholding the Supreme
    Soul. It enumerates Sankhya principles from Prakriti through Mahat, Consciousness,
    subtle essences, gross elements, senses, and mind; describes creation and destruction
    as emanation and reverse reabsorption; distinguishes Kshetra from Kshetrajna/Purusha;
    and states that knowledge of the Soul leads to tranquillity, liberation, and non-return
    after bodily dissolution.
