canonical_text:
  quote: ''
  summary: Krishna warns that Ashvatthama knows the brahmashira weapon and that Bhima
    should be protected. Krishna, Arjuna, and Yudhishthira pursue Bhima on Krishna's
    weapon-equipped chariot with a Garuda standard. At the river bank, Bhima confronts
    Ashvatthama near Vyasa and the Rishis. Ashvatthama empowers a blade of grass with
    mantras and releases it as a fiery celestial weapon for the destruction of the
    Pandavas. Krishna instructs Arjuna to use a counter-weapon, and Arjuna releases
    it for protection and the welfare of the worlds.
  language: English
