canonical_text:
  quote: ''
  summary: Bhishma tells Yudhishthira the signs by which the future success of an
    army may be known. He lists ritual acts, cheerful troops and animals, favorable
    weather, auspicious animal and bird omens, pure sacrificial fires, strong martial
    sounds, splendid formations, discipline, kindness, and patience. He then advises
    that peace, conciliation, disunion, and gifts should be attempted before battle,
    because victory in battle is uncertain and war agitates the whole country. He
    discusses army panic, the possible success of small resolute groups, the use of
    secret agents, and the ruler's use of forgiveness and severity.
  language: English
  quote_policy: summarized
