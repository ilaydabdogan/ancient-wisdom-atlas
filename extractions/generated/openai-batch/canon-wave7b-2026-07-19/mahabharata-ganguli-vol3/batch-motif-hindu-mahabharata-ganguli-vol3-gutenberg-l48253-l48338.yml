canonical_text:
  quote: knowledge is the raft by which he can reach the shore
  summary: Vyasa teaches that knowledge and yogic discipline enable emancipation.
    He compares knowledge to a raft for crossing time or life, describes the body
    with the living soul as a spiritual car moving toward Brahma, explains Dharana
    and mastery of elements, and lists subtle visions and powers arising from yogic
    attainment.
  language: English
  quote_policy: quoted
