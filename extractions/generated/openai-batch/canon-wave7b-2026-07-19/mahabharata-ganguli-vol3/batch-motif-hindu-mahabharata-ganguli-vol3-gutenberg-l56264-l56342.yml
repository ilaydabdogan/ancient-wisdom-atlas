canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma whether emancipated ascetics retain consciousness
    or recollection after attaining the highest state. Bhishma answers with a Sankhya-oriented
    explanation of senses, subtle soul, sleep, the Jiva-soul, Brahma/Narayana, and
    emancipation, saying that the liberated Jiva enters the Supreme Soul and does
    not return, while mind and senses return at the appointed season. He praises Sankhya
    knowledge as the highest knowledge and as related to Brahma and the Formless one.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yudhishthira asks whether persons of firm vows, after attaining an excellent
    state of puissance and felicity, retain recollection of lives including birth
    and death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yudhishthira frames a difficulty about scriptures on Emancipation, saying
    some declare consciousness disappears in the emancipated state and others declare
    the reverse.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bhishma says the question is proper but difficult, and states that he will
    expound the truth.
  category: speech
  evidence_refs:
