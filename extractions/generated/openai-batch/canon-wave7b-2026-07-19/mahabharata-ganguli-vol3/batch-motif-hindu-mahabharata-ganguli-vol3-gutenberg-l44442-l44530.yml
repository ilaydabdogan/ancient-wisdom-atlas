canonical_text:
  quote: He is, therefore, the (silent) Witness.
  summary: Manu teaches that the subtle Soul is not apprehended by the ordinary senses
    but is known through Understanding, Sruti, wisdom, and Knowledge. The passage
    uses analogies involving mirrors, fire, mountains, the moon, the sun, nets, snakes,
    and Rahu to describe the Soul as an invisible witness, an indweller of bodies,
    and an entity whose identity persists through bodily change, separation from the
    body, and manifestation in a new body.
  language: English
  quote_policy: quoted
