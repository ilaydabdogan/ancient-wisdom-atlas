canonical_text:
  quote: ''
  summary: 'Yudhishthira asks Bhishma to describe the acts and nature of malevolent
    persons. Bhishma answers with a catalogue of traits: wicked conduct, slander,
    deceit, arrogance, suspicion, miserliness, hatred of recluses, cruelty, covetousness,
    fault-finding, and ungratefulness. He gives a food-sharing contrast: the wicked
    person consumes choice food alone while others look on, whereas one who first
    dedicates a portion to Brahmanas and shares the remainder with friends and kin
    attains happiness here and felicity in the next world. Bhishma concludes that
    wise people should avoid the malevolent person.'
  language: English
  quote_policy: summarized
