canonical_text:
  quote: the great sacrifice of battle had often been spread out by him.
  summary: Yudhishthira asks Bhishma what regions are gained by heroes who die in
    battle. Bhishma cites an old discourse in which King Amvarisha, after reaching
    heaven, sees his former general Sudeva ascending to still higher celestial regions.
    Amvarisha asks Indra why Sudeva surpasses him despite lacking major sacrifices
    and gifts. Indra explains that Sudeva repeatedly performed the sacrifice of battle,
    and Amvarisha asks how the components of that sacrifice correspond to ritual elements.
  language: English
  quote_policy: quoted
