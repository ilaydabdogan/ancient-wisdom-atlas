canonical_text:
  quote: ''
  summary: Yajnavalkya describes the prince of Gandharvas departing toward heaven
    after honoring him, then transmitting the science he learned to beings in multiple
    realms. Yajnavalkya teaches that emancipation comes from Knowledge, that knowledge
    should be revered regardless of the social order of its source, that all orders
    spring from Brahma, and that all people are entitled to seek the science of emancipation.
    He closes by telling the king to abandon grief.
  language: English
  quote_policy: summarized
