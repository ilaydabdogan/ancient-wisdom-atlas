canonical_text:
  quote: Without doubt, Destiny is supreme.
  summary: Dhritarashtra questions Sanjaya about Karna, Duryodhana, and the Pandavas
    after battle resumes. He laments Duryodhana's reliance on Karna, the defeats of
    his sons, the outcome of the dice match, and the supremacy of Destiny. Sanjaya
    replies that past wrongful acts, ignored counsel, and sins against the sons of
    Pandu have brought about the slaughter of kings.
