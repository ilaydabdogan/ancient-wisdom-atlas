canonical_text:
  quote: "“the highest truth of all treatises on policy is mistrust.”"
  summary: In an animal dialogue, the cat Lomasa urges the mouse Palita to renew friendship
    and trust. Palita refuses, giving a policy discourse on mistrust, especially between
    weak and strong parties after a common danger has passed. Palita warns the cat
    about an enraged hunter; the cat flees from a tree branch, and Palita enters another
    hole.
