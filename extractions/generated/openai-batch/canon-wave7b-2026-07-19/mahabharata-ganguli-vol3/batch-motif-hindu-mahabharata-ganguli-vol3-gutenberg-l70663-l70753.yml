canonical_text:
  quote: ''
  summary: Commentarial footnotes explain ritual mantras and offerings for the dead,
    including assistance in attaining a body, food and drink, crossing the Vaitarani
    river between worlds, and receiving a funeral cake sunk in water. The passage
    also explains the three debts owed to Rishis, gods, and Pitris; sacrificial libation
    as amrita; the universal Soul enclosed by bodily faculties and restrained through
    Yoga; death and rebirth until absorption into Brahma; and nishkama dharma or Yoga
    as a means of dispelling ignorance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mantras are said to be necessary in cremating a Brahmana's dead body and in
    Sraddhas, assisting the dead spirit to attain a brilliant form and receive a body,
    food, and drink.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kine and animals are given by representatives of the dead to enable the dead
    ancestor to cross the Vaitarani, described as the river flowing between two worlds,
    and to become happy in heaven.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The funeral cake is sunk in water according to ordinance so that it may be
    easily attainable by the one to whom it is offered.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'A human being is said to inherit three debts: to the Rishis, the gods, and
    the Pitris, discharged respectively by study, sacrifices, and begetting children.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The amrita coveted by the beings called Devan is identified as the sacrificial
    libation, and Devan is explained to include Rishis and Pitris.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'The universal Soul dwelling in the physical frame is described as having
    a fourfold nature: virat, sutra, antaryamin, and suddha.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Soul's four mouths or sources of enjoyment are the body, senses, mind,
    and understanding; its doors are the arms, organ of speech, stomach, and generative
    organ, which confine or conceal it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The gods are said to feel the force of these bodily doors or demands and to
    be unable to transcend them.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: One who would transcend these constraints and shine in a stainless nature
    should control or restrain them; Yoga is recommended for attaining the position
    of the universal Soul.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: All creatures are said to end in death and rebirth until absorption into Brahma
    occurs through Yoga.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Duties and penances, joined with sadachara or nishkama dharma, are described
    as means for destroying worldliness and dispelling the darkness of ignorance,
    while fools regard Yoga as fruitless.
  category: attribute
  evidence_refs:
  - ev:10
