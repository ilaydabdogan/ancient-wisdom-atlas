canonical_text:
  quote: ''
  summary: In a didactic dialogue, Yudhishthira asks Bhishma about Brahmana conduct
    in distress, permissible trade, exchange, royal disorder, and protection of Brahmanas
    and the Vedas. Bhishma permits emergency adoption of Vaisya livelihood under conditions,
    forbids sale of specified goods with sacred and punitive consequences, approves
    consensual exchange over force, and says Brahmanas with Vedic strength support
    the king during political disorder.
  language: English
  quote_policy: summarized
