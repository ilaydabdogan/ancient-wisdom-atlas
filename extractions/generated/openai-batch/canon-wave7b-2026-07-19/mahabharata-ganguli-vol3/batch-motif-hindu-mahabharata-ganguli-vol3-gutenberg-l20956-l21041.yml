  summary: A speaker praises an unnamed god with fierce, ascetic, and cosmic attributes,
    seeks protection in distress, and offers the five elements of his body as a sacrifice.
    A golden altar and blazing fire appear before the son of Drona, followed by hundreds
    and thousands of multiform companion beings with animal-like faces, weapons, ornaments,
    music, dancing, roaring, and fierce appetites.
