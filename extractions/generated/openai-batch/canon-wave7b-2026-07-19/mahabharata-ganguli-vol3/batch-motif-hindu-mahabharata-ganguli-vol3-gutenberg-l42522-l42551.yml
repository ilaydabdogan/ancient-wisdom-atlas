  quote: ''
  summary: In a dialogue, Bharadwaja asks why the five elements are specially called
    great creatures. Bhrigu explains that the five elements pervade all bodies, mobile
    and immobile things, and the senses. Bharadwaja then questions how trees, which
    seem not to show heat, motion, sense-perception, liquid, wind, earth, or space,
    can be composed of the five elements.
