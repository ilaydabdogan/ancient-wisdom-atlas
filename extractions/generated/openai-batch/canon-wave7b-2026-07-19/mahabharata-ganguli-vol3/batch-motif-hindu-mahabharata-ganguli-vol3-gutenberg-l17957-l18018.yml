  quote: ''
  summary: The passage catalogs numerous diverse, battle-loving beings who gather
    around Kartikeya at his installation. They have varied ornaments, bodies, colors,
    animal-like features, languages, and weapons. They dance joyfully around Kartikeya,
    come from celestial, aerial, and earthly regions, and, by command of the gods,
    become his companions in vast numbers.
