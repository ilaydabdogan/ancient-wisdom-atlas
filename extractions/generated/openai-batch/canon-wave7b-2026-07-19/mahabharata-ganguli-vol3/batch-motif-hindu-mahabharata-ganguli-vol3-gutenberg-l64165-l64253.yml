  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The householder reflects on three kinds of duties: those ordained in the
    Vedas, those prescribed in the Dharmasastras, and those followed by revered men
    of former times.'
  category: speech
  evidence_refs:
