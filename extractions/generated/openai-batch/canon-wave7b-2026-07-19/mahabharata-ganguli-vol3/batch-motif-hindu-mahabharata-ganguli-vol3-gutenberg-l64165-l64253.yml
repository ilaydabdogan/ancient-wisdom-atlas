  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The guest says that he also is confounded about the topic and cannot arrive
    at definite conclusions.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The guest lists many practices or modes of life said to lead to heaven, including
