canonical_text:
  quote: Heaven has many doors.
  summary: Bhishma narrates that a disciplined Atri-lineage Brahmana householder in
    Mahapadma, south of the Ganga, is troubled by competing sources of religious duty.
    When a guest Brahmana arrives, the householder asks what path he should follow
    after transferring household duties to his son, expressing a desire to cross the
    ocean of the world by a raft of religion. The guest replies that he too is uncertain
    and lists many possible ways by which people attain heaven.
  language: English
  quote_policy: quoted
