canonical_text:
  quote: "“Morality is subtle, O Bharata, and unknowable, especially by those that
    are ignorant.”"
  summary: After harshly addressing his elder brother, Arjuna feels remorse and draws
    his sword to kill himself. Krishna stops him, teaches that self-destruction would
    lead to worse consequences, and tells him to declare his own merit as a form of
    symbolically slaying himself. Arjuna then praises his own martial prowess and
    vows not to remove his armor until he has killed Karna.
