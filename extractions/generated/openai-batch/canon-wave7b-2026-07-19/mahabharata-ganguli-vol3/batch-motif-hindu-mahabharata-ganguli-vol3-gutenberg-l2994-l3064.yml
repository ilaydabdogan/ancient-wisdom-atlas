canonical_text:
  quote: ''
  summary: Karna’s weapons devastate the Pandava force, after which Arjuna counters
    with a dense shower of arrows that routs the Kauravas. Sunset, darkness, and dust
    end the fighting; the Kauravas withdraw, and the Pandavas return to camp celebrating
    victory. At night supernatural beings and carnivorous beasts come to the battlefield.
    Dhritarashtra praises Arjuna’s single-handed feats and asks what happened next.
    Sanjaya reports the wounded Kauravas taking counsel, Karna promising to oppose
    Arjuna the next day, Yudhishthira forming an invincible battle array, and Duryodhana
    and the army turning their hopes toward Karna.
  language: English
  quote_policy: summarized
