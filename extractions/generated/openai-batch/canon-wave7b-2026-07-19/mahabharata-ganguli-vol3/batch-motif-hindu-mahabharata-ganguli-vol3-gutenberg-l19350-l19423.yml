canonical_text:
  quote: ''
  summary: Duryodhana and Bhimasena continue a mace duel. Their weapons clash with
    fiery, thunder-like force, each warrior strikes and fells or stuns the other,
    and both recover from severe blows. Spectators and allied groups react with wonder,
    fear, disappointment, and cries. After Duryodhana prostrates Bhima and roars,
    heavenly beings and Apsaras make an uproar and celestials rain fragrant flowers.
    Bhima then rises with effort. Sanjaya then reports Arjuna asking Vasudeva which
    of the two combatants is superior and what merits each possesses.
  language: English
  quote_policy: summarized
