canonical_text:
  quote: There was at first one Eternal, Divine, and Self-born Brahman.
  summary: Yudhishthira asks about the first Prajapatis and the Rishis dwelling in
    the compass directions. Bhishma answers with genealogies of Brahman, Prajapatis,
    deities, and Rishis, describes divine classes, assigns sages to directions, and
    states that reciting their names cleanses sin and grants safe return.
  language: English
  quote_policy: quoted
