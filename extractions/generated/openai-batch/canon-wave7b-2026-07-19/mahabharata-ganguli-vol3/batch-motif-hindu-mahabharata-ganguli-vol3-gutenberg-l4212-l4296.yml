canonical_text:
  quote: ''
  summary: Sanjaya recounts that Karna, setting out for battle, offers escalating
    rewards to anyone who will show him Arjuna, and also names Keshava with Arjuna
    as a target. Karna blows his conch and the Kaurava troops rejoice. Shalya then
    laughs in scorn, rebukes Karna for foolish boasting and improper giving, compares
    his effort to fatal or impossible undertakings, and advises him to fight Arjuna
    only while protected by his array and warriors.
  language: English
  quote_policy: summarized
