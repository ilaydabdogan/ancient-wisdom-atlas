canonical_text:
  quote: ''
  summary: 'Vyasa instructs on the householder stage of life: establishing a household
    and fire, four graded modes of domestic conduct, ritual limits on food preparation
    and killing, duties of hospitality and food distribution, definitions of sacrificial
    leftovers, restraint toward wife and senses, avoidance of quarrels with kin and
    social dependants, and the connection of honored relations with cosmic regions
    of felicity.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vyasa speaks instructions about the householder in the second period of life,
    who is to dwell in his house, take spouses according to ordinance, and establish
    his own fire.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Four kinds of domestic conduct are listed: keeping grain for three years,
    keeping grain for one year, providing for the day without thinking of tomorrow,
    and collecting grain in the manner of the pigeon; each succeeding kind is said
    to be superior in merit.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The duties permitted to householders decrease across the four modes: six
    duties for the first, three for the second, two for the third, and one, learning
    the scriptures, for the fourth.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The householder is told not to cook food only for himself and not to slaughter
    animals except in sacrifices; killing an animal or cutting a tree is to follow
    a ritual laid down in the Yajuses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The householder is instructed not to sleep during the day or at the beginning
    or end of the night, not to eat twice between morning and evening, and not to
    summon his wife to bed except in her season.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: No Brahmana in the house should remain unfed or unworshipped, and qualified
    guests are to be worshipped.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Offerings to deities and Pitris are described as intended for the service
    of guests, and a share of cooked food is to be given to every creature, including
    persons described as religiously irregular or blameworthy, as well as Brahmacharins
    and Sannyasins.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage defines amrita as remains of food offered in sacrifice mixed with
    clarified butter, and vighasa as food remaining after relatives and servants have
    been fed.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The householder is instructed to be content with his own wedded wife, restrain
    himself, avoid malice, subdue his senses, and avoid quarrels with a long list
    of teachers, ritual specialists, kin, guests, dependants, afflicted persons, servants,
    wife, son, and daughter.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Avoiding disputes with the listed persons is said to cleanse the householder
    of sins and enable him to conquer regions of felicity in the hereafter.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Different relations are associated with powers over specific regions or domains,
    including regions of Brahman, Prajapati, Indra, the deities, Apsaras, Viswedevas,
    the quarters, earth, and sky.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The eldest brother is likened to the father, the wife and son to one’s own
    body, menial servants to one’s shadow, and the daughter to an object of great
    affection.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: A righteous household is told not to act from considerations of wealth, and
    later courses or modes of life are said to be more meritorious than preceding
    ones; the excerpt ends while stating that domesticity is superior to something
    not preserved in the provided passage.
  category: sequence
  evidence_refs:
