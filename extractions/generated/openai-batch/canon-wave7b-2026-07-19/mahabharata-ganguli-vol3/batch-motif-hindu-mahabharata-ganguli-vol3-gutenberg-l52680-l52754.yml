canonical_text:
  quote: ''
  summary: Yudhishthira laments the sorrow of embodied birth and asks when he and
    his brothers may abandon sovereignty for renunciation. Bhishma replies that all
    things, including rebirth, have an end, and teaches that Jiva, obscured by ignorance
    and the fruits of action, passes from body to body until Knowledge reveals Immutable
    Brahma. Bhishma then introduces the example of the defeated Daitya Vritra, who
    tells Usanas that, having understood the coming and going of creatures, he no
    longer indulges in grief or joy; beings go to heaven or hell, exhaust portions
    of merit and demerit, and return repeatedly according to acts and Time.
  language: English
  quote_policy: summarized
