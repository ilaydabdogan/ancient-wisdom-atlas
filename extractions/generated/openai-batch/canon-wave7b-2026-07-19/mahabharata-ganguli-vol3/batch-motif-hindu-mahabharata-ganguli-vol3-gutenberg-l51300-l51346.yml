canonical_text:
  quote: ''
  summary: Satyavat instructs that a king should try to reform rogues without slaughter,
    but if that fails may exterminate them through sacrifice. He describes royal austerities,
    the use of fear to deter wrongdoing, self-restraint before restraining others,
    and punishment even of close associates when necessary. He cites earlier instruction
    from a learned Brahmana and an ancestral grandsire about harmless rule in earlier
    ages and progressively diminished righteousness in later ages, concluding with
    Manu's compassionate teaching of a way for humans to adhere to knowledge for emancipation.
  language: English
