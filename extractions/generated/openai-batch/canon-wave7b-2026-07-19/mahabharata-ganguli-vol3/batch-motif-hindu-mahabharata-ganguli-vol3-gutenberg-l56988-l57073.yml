canonical_text:
  quote: ''
  summary: Vasishtha explains Vidya and Avidya in Sankhya terms, contrasting Prakriti
    with Purusha, describing hierarchies of knowledge, the destructible and indestructible
    status of Jiva and Prakriti, the yogic merging of principles into Brahma, and
    Jiva's awakening from attachment to Prakriti through images of a fish in a net
    and migration from water to water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vasishtha addresses a royal listener and states that he will explain Vidya
    and Avidya after discoursing on Sankhya philosophy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Prakriti, described as having the attributes of creation and destruction,
    is called Avidya; Purusha, freed from those attributes and transcending the twenty-four
    principles, is called Vidya.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage presents a sequence of comparative identifications in which Vidya
    is assigned successively to knowledge senses, mind, subtle essences, Consciousness,
    Mahat, Prakriti, the Supreme Vidhi, and Purusha.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Jiva and Prakriti are both described as without beginning and end, and both
    are said to be called indestructible and destructible in different respects.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Unmanifest or Prakriti is described as repeatedly modified for creation,
    and Purusha and the Unmanifest are described as mutually dependent.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Yogin withdraws and merges the principles into the Unmanifest Soul or Brahma;
    the twenty-fifth, identified as Jiva or Purusha, also disappears into it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kshetrajna becomes pure and stainless by casting off Prakriti and realizing
    that he is different from her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When Jiva ceases union with Prakriti, he becomes identifiable with Brahma;
    when united with Prakriti, he seems different from Brahma.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Jiva laments that through ignorance he fell into a Prakriti-composed frame
    like a fish entangled in a net and migrated from body to body like a fish moving
    from water to water.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Jiva declares the Supreme Soul to be his friend, says he can attain identity
    with Him, and resolves not to continue companionship with Prakriti.
  category: speech
  evidence_refs:
  - ev:7
