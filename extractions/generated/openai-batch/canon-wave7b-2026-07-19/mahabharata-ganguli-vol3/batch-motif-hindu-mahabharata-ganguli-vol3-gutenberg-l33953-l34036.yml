canonical_text:
  quote: ''
  summary: 'Bhishma instructs Yudhishthira on righteous and practical means for kingship
    and warfare: the guarded use of deceit, preparation of arms and troops, proper
    timing and routes for campaigns, fort and camp placement, terrain suited to different
    forces, auspicious orientation and timing, and restraints against killing vulnerable
    or unprepared persons.'
  language: English
  quote_policy: summarized
