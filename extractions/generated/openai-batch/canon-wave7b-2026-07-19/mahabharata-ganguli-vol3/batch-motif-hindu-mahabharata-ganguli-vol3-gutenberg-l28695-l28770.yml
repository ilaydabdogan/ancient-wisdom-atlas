canonical_text:
  quote: ''
  summary: Vasudeva tells the son of Kunti a genealogy and birth account connected
    with Rama, Jamadagni's son. Kusika performs severe penance for a divine son; Purandara
    becomes his son Gadhi. Gadhi's daughter Satyavati marries Richika. Richika prepares
    sanctified milk-and-rice food in two portions to produce different kinds of sons
    for Satyavati and her mother, but the mother substitutes the portions. Satyavati
    conceives a fierce child associated with Kshatriya-destruction. After Satyavati
    pleads for a peaceful son, Richika says destiny and ritual truth cannot be false,
    but grants that the fierce quality will belong to the grandson instead.
  language: English
  quote_policy: summarized
