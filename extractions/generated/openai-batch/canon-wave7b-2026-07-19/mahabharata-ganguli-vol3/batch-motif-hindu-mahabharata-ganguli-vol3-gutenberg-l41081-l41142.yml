canonical_text:
  quote: ''
  summary: Bhishma introduces an old story set in the northern country of the Mlecchas.
    Gautama, a Brahmana lacking Vedic learning, enters a prosperous robber village
    seeking charity and receives gifts, a dwelling, and a young widow from a wealthy
    robber. Living among hunters and robbers, he learns archery, slaughters many cranes,
    loses compassion, and becomes robber-like. A Vedic Brahmana friend arrives, sees
    Gautama blood-smeared and armed, rebukes him for abandoning Brahmana conduct,
    and urges him to leave. Gautama admits he settled there for wealth and says they
    will depart the next day. The guest stays overnight but refuses to eat in the
    house.
  language: English
  quote_policy: summarized
