canonical_text:
  quote: ''
  summary: Bhishma tells Yudhishthira that kingly and Kshatriya duties contain or
    support other duties and protect the world from disorder. He introduces an ancient
    account in which King Mandhatri performs a sacrifice and worships Vishnu to behold
    Narayana. The Supreme Lord appears in the form of Indra, offers boons, and Mandhatri
    responds that he seeks sight of the first god and knowledge of the highest duties.
  language: English
