canonical_text:
  quote: ''
  summary: The passage reports sceptical arguments that material causes produce mind
    and consciousness, then rejects them by arguing that the dead body remains after
    death while something distinct departs, and by noting that even deniers of the
    soul pray to unseen deities. It then describes and critiques a rebirth doctrine
    attributed in the passage to Buddhists, in which ignorance, acts, desire, and
    knowledge explain rebirth and Nirvana.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage gives examples of products differing from their causes, including
    milk and butter from a cow, liquor from decomposed substances in water, and the
    body with mental faculties from vital seed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says fire is produced by rubbing two pieces of wood together and
    by the stone Suryakanta coming into contact with sun rays.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says a metallic substance heated in fire dries up water when it
    contacts it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sceptics are represented as reasoning that the material body produces
    mind and its attributes, and that the senses are controlled by the mind as a loadstone
    moves iron.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage rejects the sceptics and argues that the dead body remains for
    a time after death, while something different from the body has departed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says men who deny the separate existence of the soul still supplicate
    deities who cannot be seen or touched and are believed to have subtle forms.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage argues that if body and soul died together, acts from life would
    perish, leaving inequalities in the universe unexplained.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A doctrine is described in which rebirth is caused by ignorance, desire for
    acts, cupidity, heedlessness, and other faults; acts are compared to seed, and
    desire to water that makes the seed grow.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The same doctrine says that when one mortal body is destroyed, another immediately
    starts up from it, and that knowledge burns ignorance, leading to destruction
    of existence or Nirvana.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage rejects that rebirth doctrine by questioning personal identity,
    the continuity of a chain of existences, the transfer of results of acts, and
    the production of a later consciousness from an ended earlier consciousness.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage objects that if the loss of previous consciousness caused a second
    consciousness, then a body killed by a heavy bludgeon would produce a second body.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says the doctrine of extinction of life would make extinction
    recur like seasons, the year, the yuga, heat, cold, and agreeable or disagreeable
    objects.
  category: speech
  evidence_refs:
  - ev:8
