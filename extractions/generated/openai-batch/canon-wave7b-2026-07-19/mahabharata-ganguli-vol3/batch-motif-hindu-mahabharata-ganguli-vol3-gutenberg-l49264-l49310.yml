canonical_text:
  quote: ''
  summary: The passage describes an inward sacrifice in which senses and mind are
    offered into the fire of the heart; a knower beholds the Jiva-soul, the Supreme
    Soul, and cosmic contents within the body; a golden egg-born winged being and
    a revolving wheel of Time are envisioned; the Supreme Soul is identified with
    dreamless unconsciousness pervading the universe; and a detached renunciant attains
    emancipation through fearlessness, non-censure, non-possession, and equanimity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man sacrifices in his own self and liberates his senses and mind into a
    fire located within the limited space of his heart.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pouring a libation into the fire within the self gratifies the universe, all
    creatures, and the gods.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Jiva-soul is described as effulgent, enveloped in three cases, characterized
    by three attributes, and apprehended as Iswara partaking of the nature of the
    Supreme Soul.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person who beholds the Vedas, space, perceived objects, scriptural rituals,
    sound-comprehensible entities, and the superior nature of the Supreme Soul in
    the soul within the body is worshipped by deities.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A foremost being seen in the soul within the body is described as unattached
    to earth, immeasurable in the firmament, made of gold, born of and residing within
    an egg, feathered, two-winged like a bird, and radiant with many rays of light.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Deities worship the person whose understanding contains the wheel of Time.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The wheel of Time constantly revolves, does not decay, swallows the period
    of existence of every creature, has six seasons for naves, twelve months for radii,
    and has a gaping mouth toward which the universe proceeds to be devoured.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Supreme Soul is described as the capacious unconsciousness of dreamless
    slumber, as the body of the universe, and as pervading all created things.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Jiva occupies a portion of that capacious unconsciousness and gratifies the
    deities; the deities then gratify the open mouth of that unconsciousness.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Jiva is described as effulgent, eternal, without beginning, and capable of
    acquiring infinite regions of eternal happiness by following particular paths.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: A person whom no creature fears, who fears no creature, who does nothing censurable,
    and who censures no one is called truly regenerate and succeeds in beholding the
    Supreme Soul.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: A person in the fourth mode of life wanders on earth unconnected with everything,
    free from wrath and error, equal toward a clod of earth and a lump of gold, without
    stored possessions, without friends or foes, and indifferent to praise, blame,
    the agreeable, and the disagreeable.
  category: action
  evidence_refs:
  - ev:8
