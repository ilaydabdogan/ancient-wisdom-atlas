canonical_text:
  quote: ''
  summary: Janaka asks Parasara whether a person is stained more by actions or by
    birth/class, and then asks which righteous acts do not injure creatures. Parasara
    answers that both birth and acts can be sources of demerit, but acts stain more.
    He then describes non-injurious righteous conduct, renunciation of worldly attachment,
    Yogic ascent to Emancipation, and ascent to heaven through righteousness, truth,
    and abstention from unrighteousness.
