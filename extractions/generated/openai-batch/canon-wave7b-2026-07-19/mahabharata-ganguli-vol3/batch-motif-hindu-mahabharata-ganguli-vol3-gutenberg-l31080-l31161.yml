  quote: ''
  summary: The passage gives didactic counsel on how a king facing hostile force should
    damage or deny resources, fortify cities, regulate fire, use spies, store supplies,
    reward helpers, protect the seven limbs of the kingdom, and pursue political and
    ethical aims. It cites Vrihaspati on the heavenly merit of a king who protects
    his people, then records Yudhishthira asking the grandsire about the relation
    between chastisement, king, and subjects.
  language: English
  quote_policy: summarized
