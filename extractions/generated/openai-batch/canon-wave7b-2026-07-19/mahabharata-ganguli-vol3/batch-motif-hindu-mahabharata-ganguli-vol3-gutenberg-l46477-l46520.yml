canonical_text:
  quote: ''
  summary: Prahlada explains to Sakra that acts and their fruits arise through Nature
    and her transformations. He describes the wise, self-restrained person as free
    from attachment, grief, desire, and anxiety. Sakra asks how such wisdom and tranquillity
    may be attained; Prahlada answers with simplicity, heedfulness, purification of
    the soul, mastery of passions, service to aged seniors, and knowledge that wisdom
    and tranquillity arise from Nature. Sakra marvels, praises the teaching, worships
    Prahlada, and departs.
  language: English
  quote_policy: summarized
