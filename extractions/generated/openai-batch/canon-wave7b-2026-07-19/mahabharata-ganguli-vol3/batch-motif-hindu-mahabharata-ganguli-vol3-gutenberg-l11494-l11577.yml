canonical_text:
  quote: the entire universe shook with its mobile and immobile creatures.
  summary: In the battle between Karna and Arjuna, Vasudeva urges Arjuna to strike.
    The warriors exchange celestial and elemental weapons. Karna wounds Arjuna with
    a blazing shaft, then tries unsuccessfully to free his sunken chariot wheel. Arjuna
    recovers, cuts down Karna's standard, and prepares the terrible Anjalika weapon,
    whose raising shakes the universe.
  language: English
  quote_policy: quoted
