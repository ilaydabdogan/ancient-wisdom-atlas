canonical_text:
  quote: ''
  summary: Bhishma recounts how Yajnavalkya instructed the king of Mithila. The king
    honored the ascetic, gave wealth to Brahmanas, installed his son as ruler, and
    adopted ascetic practices. The passage presents teachings on Sankhya, Yoga, Prakriti,
    Purusha, Brahma, the unity of giver/receiver/gift in the Soul, and the superiority
    of liberating knowledge over ritual sacrifices. Knowledge is described as the
    means of crossing the world's ocean and attaining Brahma beyond birth, death,
    and sorrow.
  language: English
  quote_policy: summarized
