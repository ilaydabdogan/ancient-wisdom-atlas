canonical_text:
  quote: ''
  summary: Mahadeva is asked to stop the Rishi Mankanaka from dancing. Mankanaka explains
    that vegetable juice flows from his wound and makes him joyful. Mahadeva produces
    white ash from his own wound, causing Mankanaka to become ashamed, recognize him
    as Rudra/Mahadeva, praise him, and ask that his ascetic merit not be destroyed.
    Mahadeva grants him increased asceticism, promises to dwell with him, and declares
    benefits for worship at Sapta-Saraswat. The passage then follows Baladeva on pilgrimage
    to tirthas, including Usanas/Kapalamochana, where a sage was freed by bathing
    from a Rakshasa head stuck to his thigh and where Sukra received moral and political
    science by inward light.
  language: English
  quote_policy: summarized
