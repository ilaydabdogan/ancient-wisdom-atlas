canonical_text:
  quote: ''
  summary: Duryodhana urges Karna to stop the rout of their army. Karna vows to destroy
    the Pandavas and Pancalas, takes up the bow Vijaya, and deploys the Bhargava weapon,
    sending forth masses of arrows that slaughter and terrify the opposing forces.
    The carnage is described with fire, forest-conflagration, universal-dissolution,
    and Yama-realm similes. The afflicted Srinjayas call on Arjuna and Krishna; Arjuna
    acknowledges the weapon's power and Karna's ferocity. Krishna directs Arjuna to
    first see and comfort the wounded Yudhishthira, expecting Karna to grow fatigued
    meanwhile.
  language: English
  quote_policy: summarized
