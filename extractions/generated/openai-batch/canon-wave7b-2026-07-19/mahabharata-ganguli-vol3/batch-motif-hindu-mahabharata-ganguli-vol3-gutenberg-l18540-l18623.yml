canonical_text:
  quote: ''
  summary: Vaishampayana recounts that the virtuous ascetic Asita-Devala lived at
    a tirtha and hosted the yogic mendicant Jaigishavya for many years. Jaigishavya
    remained silent, and Devala became disturbed. Devala traveled through the sky
    to the ocean and found Jaigishavya already there, then returned to his hermitage
    and again found Jaigishavya already seated there. Seeking to know Jaigishavya's
    nature, Devala rose into the sky, saw Siddhas worshipping Jaigishavya, and then
    saw Jaigishavya move through heaven, the regions of the Pitris, Yama, Soma, and
    many sacrificial merit-realms.
  language: English
  quote_policy: summarized
