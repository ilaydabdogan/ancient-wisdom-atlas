canonical_text:
  quote: ''
  summary: Syumarasmi addresses a Brahmana about scripture, equity, acts, renunciation,
    knowledge of the Soul, Yoga, and Emancipation. He says the path to Emancipation
    is difficult, especially for one living among relatives, and asks to be taught
    as a disciple seated at the Brahmana's feet.
  language: English
  quote_policy: summarized
