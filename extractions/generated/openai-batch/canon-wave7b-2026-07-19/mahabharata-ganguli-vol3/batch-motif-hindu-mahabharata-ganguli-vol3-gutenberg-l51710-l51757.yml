- id: obs:1
  text: Syumarasmi says his previous statements about acts and renunciation conform
    to the scriptures, while acknowledging that obedience requires correct apprehension
    of scriptural meaning.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Syumarasmi states that conduct consistent with equity is consistent with scripture,
    and that conduct inconsistent with equity or against the Vedas is unscriptural.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Syumarasmi describes some people as accepting only what directly appeals to
    their senses, seeing only this world, failing to see scriptural faults, and giving
    way to grief.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Syumarasmi contrasts the Brahmana's knowledge of the Soul with the ignorance
    of other living creatures concerned with the same sensory objects.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Syumarasmi says all four orders of men and all four modes of life seek the
    same single end, described as the highest happiness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Syumarasmi says the Brahmana's discourse on the Infinite, Brahma, has filled
    his soul with tranquillity.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Syumarasmi describes himself and his group as unable to understand the Soul,
