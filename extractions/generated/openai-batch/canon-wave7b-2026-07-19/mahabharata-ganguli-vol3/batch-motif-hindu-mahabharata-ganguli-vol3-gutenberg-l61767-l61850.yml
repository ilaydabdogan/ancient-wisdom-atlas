canonical_text:
  quote: ''
  summary: Deities, Rishis, and Brahman perform a Vedic sacrifice in honor of Vishnu.
    Vishnu, invisible and bodiless, accepts the offerings and ordains a reciprocal
    sacrificial order in which gods receive shares from future human sacrifices and
    uphold the worlds. He distinguishes Pravritti and Nivritti, names groups of seven
    Rishis as teachers of Veda and renunciation, identifies himself with Kshetrajna,
    describes Brahman and Rudra's roles, and sets rules for the Krita and Treta ages.
  language: English
  quote_policy: summarized
