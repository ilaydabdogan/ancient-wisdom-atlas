canonical_text:
  quote: ''
  summary: Vaisampayana recounts a difficult sacred religion associated with Narayana
    and the Sattwata cult. The passage gives a frame of transmission through Narada,
    the Island-born Krishna, and Vaisampayana, then describes repeated cosmic cycles
    in which the religion is received from Narayana by Brahma, Rishis, deities, the
    Great Ocean, Manu, and Manu's descendants. It also describes Brahma springing
    from Narayana, being called son, receiving strength and the Sattwata religion,
    creating worlds and the Krita age, and the religion periodically disappearing
    or merging back into Narayana.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vaisampayana says that, when the Pandava and Kuru armies were arrayed for
    battle and Arjuna became cheerless, the holy one explained a question about ends
    attained by persons of different characters.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes the religion as difficult to comprehend and says that
    persons of uncleansed souls cannot apprehend it.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the religion was created in the Krita age in consonance with
    the Samans and is borne by Narayana himself.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Partha raised the topic to Narada among Rishis and in the presence of Krishna
    and Bhishma; the Island-born Krishna heard Narada and later imparted the teaching
    to Vaisampayana.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Across several Kalpas, Brahma is said to be born from or through Narayana's
    mind and mouth, eyes, speech, ears, and, at the end of the supplied passage, nose.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:8
- id: obs:6
  text: One transmission sequence runs from Narayana to froth-eating Rishis, then
    to Vaikanasa Rishis, then to Shoma, after which the religion disappears from the
    universe.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Another sequence runs from Shoma to Brahma, from Brahma to Rudra, and from
    Rudra to the Valikhilya Rishis, after which the religion again disappears through
    the illusion of Narayana.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A further sequence runs from Narayana to Suparna, from Suparna to the God
    of wind, from the God of wind to Rishis who subsist on remnants of sacrificial
    offerings, and from those Rishis to the Great Ocean; the religion then disappears
    and becomes merged into Narayana.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: When Narayana resolves upon creation, a being springs from his ears, is named
    Brahma, and is instructed to create creatures from his mouth and feet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Narayana calls Brahma son, promises him energy and strength, and gives him
    the Sattwata religion for the task of creating the Krita age.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Brahma bows to Hari and receives the cult with its mysteries, details, and
    Aranyakas; Narayana then disappears to a place beyond Tamas where the Unmanifest
    resides.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Brahma creates worlds with mobile and immobile creatures, the Krita age begins,
    the religion of Sattwa pervades the universe, and Brahma worships Narayana.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Brahma transmits the cult to Swarochish-Manu; Manu transmits it to Sankhapada;
    Sankhapada transmits it to Suvarnabha; when the Treta age comes, the cult disappears
    again.
  category: sequence
  evidence_refs:
  - ev:8
