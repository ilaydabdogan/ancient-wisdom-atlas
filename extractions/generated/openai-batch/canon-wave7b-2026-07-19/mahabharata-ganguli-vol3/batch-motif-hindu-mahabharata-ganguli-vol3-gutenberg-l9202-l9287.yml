canonical_text:
  quote: Even as the terrible Vaitarani is difficult of being crossed by persons of
    unrefined souls, that bloody river... was difficult to cross.
  summary: A battlefield is described as a terrible bloody river made from corpses,
    weapons, ornaments, dust, and warriors, running toward Yama and compared to the
    Vaitarani. Bhimasena attacks and defeats Shakuni after an exchange of arrows and
    a hurled dart. Duryodhana carries the wounded Shakuni away, the Dhartarashtra
    troops flee, and then rally around Karna like shipwrecked mariners reaching an
    island before returning to battle.
  language: English
  quote_policy: quoted
