canonical_text:
  quote: ''
  summary: In battle, Ashvatthama, Drona's son, spares Pandya for a time out of desire
    for further combat while Karna routs the Pandava elephant force. A riderless war
    elephant approaches; Pandya mounts it and hurls a lance that shatters Ashvatthama's
    jeweled diadem. Enraged, Ashvatthama uses fourteen shafts to dismember the elephant,
    kill Pandya, and slay six following car-warriors. The death is described with
    serpent, moon, sacrificial, cremation-fire, and divine-victory imagery. Dhritarashtra
    then asks Sanjaya what Arjuna did, emphasizing Arjuna's might and divine invincibility
    from Sankara.
  language: English
  quote_policy: summarized
