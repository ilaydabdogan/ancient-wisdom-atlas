canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma about the origin, destruction, order, ethics,
    life, death, and afterlife of the universe. Bhishma answers by citing an old dialogue
    in which Bharadwaja questions Bhrigu on the Kailasa summit. Bhrigu describes a
    Primeval Being, Manasa, from whom beings are born and die, and gives an emanational
    sequence of creation involving Mahat, Consciousness, Space, Water, Fire, Wind,
    Earth, a divine Lotus, and Brahman. Brahman is described as having the created
    cosmos for his body, with mountains, oceans, rivers, elements, heavenly bodies,
    and directions mapped to bodily parts.
  language: English
  quote_policy: summarized
