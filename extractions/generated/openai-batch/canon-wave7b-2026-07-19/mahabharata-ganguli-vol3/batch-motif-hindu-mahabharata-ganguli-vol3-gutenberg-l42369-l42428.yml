  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Bhrigu says Brahman has all created things for his body and is their Creator;
    the five elements are identified with Brahman.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: 'Bhrigu maps features of the cosmos onto a divine body: mountains as bones,
    earth as fat and flesh, oceans as blood, space as stomach, wind as breath, fire
    as energy, rivers as arteries and veins, Sun and Moon as eyes, firmament as head,
    earth as feet, and the directions as arms.'
  category: relationship
