canonical_text:
  quote: ''
  summary: 'Yudhishthira asks Bhishma how happiness and misery come to rich and poor
    persons observing different practices. Bhishma answers by citing an old teaching
    attributed to Sampaka and relayed by a renouncing Brahmana: happiness and sorrow
    arise from birth and should be understood without attachment; renouncing home
    and possessions brings real happiness; poverty and non-attachment are praised
    above sovereignty; affluence brings anxiety, delusion, harshness, transgression,
    and punishment; therefore renunciation is declared the foremost path to happiness
    and the highest good.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yudhishthira asks Bhishma about the source and manner of happiness and misery
    among rich and poor persons who observe different practices and rites.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma introduces an old narrative of Sampaka, who had obtained tranquillity
    and emancipation, and says a miserable Brahmana under a vow of renunciation told
    him verses about it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The verses state that sorrow and happiness overtake a person from birth, and
    that attributing them to Destiny would prevent elation in happiness and misery
    in sorrow.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The teaching says that one who renounces home and desirable possessions will
    taste real happiness, and that complete poverty is happiness, blessing, freedom
    from danger, and a foeless path for those free from desire.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker says that a poor person of pure conduct and without attachment
    is unequalled, and that poverty weighed heavier than sovereignty in a balance.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The sovereign possessed of affluence is described as anxious and within the
    jaws of death, while the poor person divested of wealth and hopes cannot be overcome
    by fire, foe, death, or robbers.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The gods are said to applaud the tranquil poor man who wanders at will and
    lies on bare ground with his arm for a pillow.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The man of affluence is described as affected by wrath and cupidity, stained
    by a wicked heart, frowning, and speaking harsh and cruel words.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Companionship with Prosperity is said to stupefy a weak-minded person and
    make him boast of beauty, wealth, birth, success, and being more than ordinary
    human.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: A person deeply attached to worldly possessions is said to waste ancestral
    wealth and, when reduced to want, to regard taking others' wealth as blameless.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: When such a person transgresses barriers to appropriate others' possessions,
    rulers obstruct and afflict him like sportsmen shooting a deer; he also suffers
    afflictions originating in fire and weapons.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The teaching concludes that intelligence should apply proper medicine for
    painful afflictions, and that without Renunciation one cannot attain happiness,
    the highest good, or easy sleep.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Bhishma says the teaching was told to him in past times at Hastinapur by a
    Brahmana about what Sampaka had sung, and he concludes that Renunciation is foremost.
  category: setting
  evidence_refs:
  - ev:13
