canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma why Usanas/Kavi/Sukra favored the Asuras and
    opposed the deities. Bhishma begins a narrative in which Usanas uses Yoga to enter
    Kuvera’s body and rob him of wealth. Kuvera complains to Mahadeva/Siva, who takes
    up a lance in anger. Usanas learns Siva’s intention through Yoga and places himself
    on the lance point. Siva bends the lance into a bow later called Pinaka, then
    swallows Usanas, who wanders within Siva’s stomach.
  language: English
  quote_policy: summarized
