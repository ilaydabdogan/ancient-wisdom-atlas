canonical_text:
  quote: ''
  summary: Janaka addresses a holy interlocutor. He explains the relation of male
    and female by analogy with the Indestructible and destructible, or Purusha and
    Prakriti; describes mutual dependence in generation; attributes different bodily
    elements to sire and mother; cites Vedic and scriptural authority; and asks how
    Emancipation can exist if Prakriti and Purusha are always united. He requests
    direct evidence of Emancipation and describes it as auspicious, bodiless, eternal,
    beyond the senses, and unsurpassed.
  language: English
