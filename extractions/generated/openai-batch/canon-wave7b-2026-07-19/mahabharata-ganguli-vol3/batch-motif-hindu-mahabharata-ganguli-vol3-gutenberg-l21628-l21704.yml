canonical_text:
  quote: Our victory has assumed the shape of defeat.
  summary: A surviving driver reports that Draupadi's sons, Drupada's children, and
    the camp have been destroyed at night while asleep or heedless. Yudhishthira collapses
    in grief, then laments that victory has turned into defeat, reflects on heedlessness
    as a cause of ruin, recalls earlier battle ordeals through images of Karna, Drona,
    and Bhishma, says the slain have ascended to heaven, and anticipates Princess
    Krishna's overwhelming grief.
  language: English
  quote_policy: quoted
