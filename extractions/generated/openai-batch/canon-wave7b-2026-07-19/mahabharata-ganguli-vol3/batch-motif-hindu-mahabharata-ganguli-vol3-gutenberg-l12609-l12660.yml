canonical_text:
  quote: There is no act more sinful for a Kshatriya than flight from battle.
  summary: During a rout, Pandava warriors pursue the fleeing Kuru forces. Savyasaci
    covers a remaining force with arrows amid dust and darkness. Duryodhana challenges
    the Pandavas, resists their combined attack, then rallies his mangled troops with
    a speech that condemns flight and praises death in battle as the Kshatriya path
    to heaven. The Kshatriya car-warriors return to battle, which is compared to a
    struggle between gods and Asuras.
  language: English
  quote_policy: quoted
