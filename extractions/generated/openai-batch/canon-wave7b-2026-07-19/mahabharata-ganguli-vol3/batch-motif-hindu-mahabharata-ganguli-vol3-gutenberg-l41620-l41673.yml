canonical_text:
  quote: Freedom from every hope and desire is felicity.
  summary: The passage teaches that casting off desires, wrath, possessiveness, fear,
    and injury to creatures leads to tranquillity and the state of Brahma. It then
    recounts Pingala, a fallen woman denied her lover, who awakens from ignorance,
    renounces worldly lovers and desire, and sleeps in felicity; King Senajit is consoled
    by the Brahmana’s words.
  language: English
  quote_policy: quoted
