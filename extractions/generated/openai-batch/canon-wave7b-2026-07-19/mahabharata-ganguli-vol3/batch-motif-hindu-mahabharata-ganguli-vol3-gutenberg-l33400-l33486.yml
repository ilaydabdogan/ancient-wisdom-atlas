  quote: ''
  summary: Vamadeva continues a discourse on kingship. He warns that an unrighteous
    king sets a destructive model, describes Kshatriya duties, recommends truthful
    and restrained conduct, advises appointing loyal and self-controlled ministers,
    counsels vigilance toward other rulers and internal risks, and states that the
    people accept a liberal, mild, pure, non-abandoning person as king.
  language: English
  quote_policy: summarized
