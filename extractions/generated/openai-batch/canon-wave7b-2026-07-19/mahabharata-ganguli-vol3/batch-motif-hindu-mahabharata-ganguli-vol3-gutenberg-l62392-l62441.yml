canonical_text:
  quote: ''
  summary: Indra, displaced and hidden, advises Sachi to demand that Nahusha arrive
    on a new vehicle drawn by Rishis. Nahusha harnesses Rishis, insults Agastya, and
    is cursed to fall to Earth and become a snake. The deities and Rishis petition
    Vishnu for Indra’s restoration; Vishnu prescribes a Horse-sacrifice. Sachi retrieves
    Indra from lake Manasa, Vrihaspati arranges the sacrifice with a substituted black
    antelope, and Indra is restored after the sin of Brahmanicide is divided among
    woman, fire, trees, and kine.
  language: English
  quote_policy: summarized
