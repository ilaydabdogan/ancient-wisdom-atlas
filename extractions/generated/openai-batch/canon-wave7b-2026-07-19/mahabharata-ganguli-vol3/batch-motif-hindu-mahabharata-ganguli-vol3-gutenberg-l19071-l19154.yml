  quote: Those men that cast off their bodies while engaged in battle on this field,
    are sure to reside...in heaven with Shakra himself.
  summary: Sanjaya narrates Rama’s arrival before the final mace encounter. Rama declares
    Kurukshetra and Samantapanchaka sacred places where warriors dying in battle obtain
    heaven. Yudhishthira and Duryodhana proceed there with the Pandavas. Duryodhana
    and Bhima arm themselves with maces, challenge one another, and are described
    through a series of martial, animal, cosmic, and mythic similes before assembled
    kings and celestial witnesses.
