canonical_text:
  quote: ''
  summary: Bhishma explains to Yudhishthira that Chastisement, also called Vyavahara,
    sustains righteousness, prevents wrongdoing, appears as a fierce multiform deity
    and as weapons, is linked with Vishnu and Narayana, has Morality as wife, manifests
    in many paired conditions and ethical states, prevents creatures from destroying
    one another, supports kingship, and participates in a cosmic-social chain of righteousness,
    Vedas, sacrifice, deities, Indra's rain, food, and life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhishma addresses Yudhishthira and says he will explain who Chastisement is
    and why Chastisement is also called Vyavahara.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chastisement is described as that upon which all things depend and that by
    which righteousness is maintained.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Manu is said to have first declared that one who protects loved and odious
    creatures equally by wielding the rod of Chastisement is an embodiment of righteousness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chastisement is said to stop the misappropriation of other people's possessions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Chastisement is described as a great god with a fierce form, fire-like appearance,
    dark complexion, four teeth, four arms, eight legs, many eyes, pointed ears, upright
    hair, matted locks, two tongues, copper-hued face, and a lion's skin garment.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Chastisement assumes the forms of many weapons and moves in the world piercing,
    cutting, afflicting, lopping, dividing, striking, slaying, and rushing against
    victims.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Chastisement bears many names, including Sword, Sabre, Righteousness, Fury,
    Punisher, Checker, Judge, God, the Soul of Rudra, Manu, and Benefactor.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Chastisement is identified with Vishnu, Narayana, and Mahapurusha.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Morality is named as the wife of Chastisement and is also called Brahmana's
    Daughter, Lakshmi, Vriti, Saraswati, and Mother of the universe.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Many paired states and ethical conditions, including blessing and curse, pleasure
    and pain, righteousness and unrighteousness, truth and falsehood, and fear and
    fearlessness, are called forms of Chastisement.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Without Chastisement, creatures would grind one another; through fear of Chastisement,
    living creatures do not slay one another.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Subjects protected by Chastisement enhance the might of their ruler, and Chastisement
    is called the foremost refuge of all.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: A sequence is described in which righteousness exists among Brahmanas, Brahmanas
    attach to the Vedas, sacrifices flow from the Vedas, sacrifices gratify deities,
    deities commend earth's denizens to Indra, Indra gives rain as food, and creatures
    live by food.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Chastisement assumes the form of a Kshatriya among men and remains awake to
    protect them.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: God gives affluence and the rod of chastisement to the strong king, and the
