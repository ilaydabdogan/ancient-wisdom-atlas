canonical_text:
  quote: ''
  summary: Bhishma narrates that, after seeing a pigeon fall into fire, a fowler is
    overcome with compassion and remorse. He interprets the pigeon’s self-offering
    as a lesson in duty, guest-worship, and righteousness. The fowler resolves to
    renounce ordinary life, perform severe vows, discard his hunting implements, and
    free a captive she-pigeon.
