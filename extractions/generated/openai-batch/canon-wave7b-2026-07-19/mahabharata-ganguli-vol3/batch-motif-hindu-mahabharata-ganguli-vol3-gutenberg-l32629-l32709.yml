canonical_text:
  quote: ''
  summary: Bhishma answers Yudhishthira with prescriptions for appointing ministers,
    consulting a council, administering justice, protecting subjects, punishing offenders,
    respecting envoys, choosing officials, commanding forces, and practicing strategic
    mistrust. The passage links righteous governance with the stability of the kingdom
    and unrighteous rule with sin, fear, hell, and exclusion from heaven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhishma addresses Yudhishthira and says he will describe what kinds of ministers
    should be appointed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The recommended ministers include specified numbers from Brahmana, Kshatriya,
    Vaisya, Sudra, and Suta groups, each with stated qualifications.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ministers are to be dignified, impartial, versed in sacred texts, free
    from envy, covetousness, and dreadful vices, and competent in disputes.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The king is told to consult the ministers, lead among them, publish the results
    of deliberation, and watch over the people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king is warned not to confiscate deposits or disputed property; doing
    so would spoil justice and bring sin, fear, and loss to the kingdom.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that a kingdom has its root in righteousness and that unjust
    officials sink in hell along with the king.
  category: other
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The king is described as protector of helpless persons oppressed by the powerful,
    and disputes are to be decided by witnesses or careful consideration when witnesses
    are lacking.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Punishments are to be assigned according to offenses, including fines, confiscations,
    loss of liberty, corporal punishment, and death for certain crimes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A king who punishes duly earns merit, while one who punishes capriciously
    earns infamy and sinks into hell.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: No one should be punished for another's fault, and a person should be convicted
    or acquitted after reflection on the criminal code.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The king should never slay an envoy; the slayer is said to sink into hell
    with his ministers and to stain his ancestors with grave sin.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Envoys, guards, ministers, and commanders are assigned lists of desired qualities,
    including eloquence, memory, scriptural knowledge, courage, secrecy, military
    knowledge, and endurance.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: The king is told to lull foes into security while trusting no one, not even
