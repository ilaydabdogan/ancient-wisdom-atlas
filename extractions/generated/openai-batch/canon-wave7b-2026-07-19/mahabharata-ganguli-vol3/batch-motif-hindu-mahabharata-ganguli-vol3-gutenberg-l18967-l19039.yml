canonical_text:
  quote: ''
  summary: Vaishampayana narrates Baladeva's pilgrimage from Kurukshetra to a sacred
    hermitage, where Rishis recount Vishnu's penances and sacrifices and the heavenly
    attainment of a Brahmani maiden. Baladeva performs rites, ascends near Himavat,
    visits tirthas, gives gifts, and bathes in sacred water. Narada arrives with ascetic
    and musical emblems, is honored, and reports the destruction of the Kuru warriors,
    Duryodhana's concealment in the Dvaipayana lake, and his emergence for a mace
    duel with Bhima.
  language: English
  quote_policy: summarized
