canonical_text:
  quote: "“thither is Krishna where righteousness is, and thither is victory where
    Krishna is”"
  summary: After the defeat of Duryodhana, the Pandavas and their allies enter his
    diminished camp. Krishna instructs Arjuna to remove his bow and quivers and dismount
    before him; when Krishna leaves Arjuna’s chariot, the ape on its banner disappears
    and the chariot burns to ashes. Krishna explains that it had already been consumed
    by celestial weapons and had remained intact only because he sat upon it. Krishna
    and Yudhishthira speak of Krishna’s protection, victory, and righteousness. The
    victors take wealth from the camp and then, on Krishna’s advice, spend the night
    outside the camp by the sacred stream Oghavati.
  language: English
  quote_policy: quoted
