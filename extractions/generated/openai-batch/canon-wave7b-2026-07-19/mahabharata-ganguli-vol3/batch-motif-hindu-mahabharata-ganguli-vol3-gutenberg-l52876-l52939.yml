canonical_text:
  quote: ''
  summary: The passage explains six colours of creatures as outcomes of varying proportions
    of Rajas, Tamas, and Sattwa. It presents White as the highest colour leading to
    success or emancipation, then describes Jiva moving through many births and ranked
    stages of existence, including hell, human birth, deity status, return, and possible
    descent according to qualities, actions, Time, and Kali.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Creatures are said to have six colours: Dark, Tawny, Blue, Red, Yellow, and
    White.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The six colours proceed from different proportions of the three attributes
    Rajas, Tamas, and Sattwa.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: White is described as the foremost colour, sinless, free from attachment and
    aversion, without grief, and leading to success or emancipation.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Jiva is said to undergo thousands of womb-derived births before attaining
    success.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The success associated with Jiva is identified with apprehension of the Soul
    and is said to have been declared by divine Indra after study of spiritual treatises.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A creature's end depends on its colour, and colour depends on the character
    of Time.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The stages of existence through which Jiva passes are numbered as fourteen
    hundred thousands; through them Jiva ascends, stays, or falls.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Jiva of dark hue is said to have a low end, become addicted to acts leading
    to hell, and rot in hell for many thousands of Kalpas.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After long suffering and exhaustion of sins, Jiva attains the Tawny colour,
    dwells helplessly, and then cherishes renunciation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: When endowed with Sattwa, Jiva dispels what is connected with Tamas through
    intelligence and attains the Red colour; without gaining Sattwa, Jiva attains
    Blue and travels in rebirths among humans.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After human existence and affliction by bonds born of acts, Jiva attains the
    Yellow colour or deity status, exists there for a hundred creations, leaves it,
    and returns to it.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Even after attaining Yellow and sporting as a Deva for thousands of Kalpas,
    Jiva is not necessarily emancipated and may continue through heaven or godship,
    hell, humanity, and further return or descent.
  category: sequence
  evidence_refs:
  - ev:9
