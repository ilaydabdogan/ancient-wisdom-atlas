canonical_text:
  quote: ''
  summary: Sanjaya narrates a battle passage in which Shalya, ruler of the Madras,
    attacks Yudhishthira and the Pandava forces with arrows, is surrounded by Pandava
    allies, duels Yudhishthira, disables Yudhishthira’s chariot, and is then counterattacked
    by Bhima and Sahadeva. After losing his own driver, horses, bow, and armour, Shalya
    descends from his car with sword and shield and rushes toward Yudhishthira as
    the passage breaks off.
  language: English
  quote_policy: summarized
