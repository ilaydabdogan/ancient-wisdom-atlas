canonical_text:
  quote: ''
  summary: Karna addresses Shalya and recounts several reports condemning the Vahikas,
    Arattas, Madrakas, and related peoples. He cites a Brahmana traveler, a violated
    woman’s curse, the king’s share in subjects’ merits and demerits, a censure by
    the Grandsire/Brahman, a Rakshasa’s formulaic speech, and a directional sacred
    geography guarded by deities and spirit-beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Karna tells Shalya to listen and introduces a past Brahmana guest who spoke
    after observing Karna’s household practices.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Brahmana says he lived alone on a peak of Himavat and later traveled through
    many countries with diverse religious practices.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Brahmana reports that among the Vahikas a person may successively become
    a Brahmana, Kshatriya, Vaishya, Shudra, barber, Brahmana again, and then slave.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Karna reports that a chaste woman was abducted and violated by robbers from
    Aratta, after which she cursed them and their families’ women.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage links the woman’s curse to the statement that the Arattas’ sisters’
    sons, rather than their own sons, become heirs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Karna contrasts several named peoples who are said to know religion with the
    Vahikas and Madrakas, who are described as living without righteousness.
  category: speech
  evidence_refs:
  - ev:4
  - ev:7
- id: obs:7
  text: Karna tells Shalya that, as king and protector of that people, he shares a
    sixth part of their merits and demerits, or perhaps only their demerits if he
    does not protect them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Karna says the Grandsire or Brahman censured the practices of the country
    of the five rivers even in the Krita age.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Karna recounts that Kalmashapada, a Rakshasa, spoke while plunging or sinking
    in water and was rescued by a king who asked him a question.
  category: sequence
  evidence_refs:
  - ev:6
