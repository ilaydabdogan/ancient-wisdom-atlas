  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The saying states that the effulgent ray, identified parenthetically as the
    Supreme Soul, exists in one’s Soul, exists equally in all creatures, and can be
    seen by one devoted to Yoga.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Janaka says a person attains Brahma when others are not afraid of him, he
    is not afraid of others, and he ceases to cherish desire, hate, and sinful attitudes
    toward creatures in thought, word, and deed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Janaka says restraining mind and soul, casting off malice, desire, and stupefaction,
