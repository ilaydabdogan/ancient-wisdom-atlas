canonical_text:
  quote: The preceptor is the helmsman, and knowledge is the boat...
  summary: Janaka teaches that Emancipation requires purified understanding, scriptural
    knowledge, a preceptor, equanimity, restraint of mind and senses, and yogic insight.
    He uses images of a boat crossing the world-ocean, water that does not drench
    aquatic animals, a bird soaring upward, a tortoise withdrawing its limbs, and
    a lamp revealing a dark house. He then tells the ascetic addressee that the needed
    knowledge already dwells in him.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Janaka says Emancipation is impossible without a cleansed understanding and
    Vijnana, and says that such understanding is unattainable without connection with
    a preceptor.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Janaka compares the preceptor to a helmsman and knowledge to a boat by which
    one crosses the ocean of the world; after crossing, both may be abandoned.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Janaka says the wise of old practiced duties connected with the four modes
    of life to prevent destruction of the worlds and of acts, and that abandoning
    good and bad acts in due order leads over many births to Emancipation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Janaka says a person purified through penances in many births may attain Emancipation
    even in Brahmacharyya, and asks what need remains for the other modes of life
    when Emancipation and knowledge of visible things have been attained.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Janaka instructs that one should cast off faults born of Rajas and Tamas,
    adhere to Sattwa, and know Self by Self.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Janaka says one should behold oneself in all creatures and all creatures in
    oneself, and live like aquatic animals in water without being drenched by it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Janaka says one who transcends all pairs of attributes casts off attachments
    and attains infinite felicity in the next world, going there like a bird soaring
    into the sky.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Janaka introduces an old saying attributed to king Yayati and remembered by
