canonical_text:
  quote: ''
  summary: 'Vyasa affirms Arjuna''s counsel to Yudhishthira and instructs him to practice
    the duties of domestic and royal life rather than retiring to the woods. He emphasizes
    that householders sustain gods, ancestors, guests, servants, animals, and other
    creatures, and that Kshatriyas must protect subjects and wield chastisement. He
    cites an old history of the brothers Sankha and Likhita: Likhita eats fruits from
    Sankha''s retreat without permission, Sankha declares it theft and sends him to
    King Sudyumna, and Likhita confesses before the king, who states that a ruler
    may punish or pardon and grants pardon.'
  language: English
  quote_policy: summarized
