canonical_text:
  quote: the earth shall swallow the wheel of thy car
  summary: Narada recounts how Karna, born to Kunti in maidenhood and later regarded
    as a Suta's son, became envious of the Pandavas, sought the Brahma weapon for
    use against Arjuna, and after refusal by Drona went to Rama on the Mahendra mountains
    under a false claim of Brahmana birth. Karna acquired weapons there, but later
    accidentally killed the Homa cow of a Brahmana performing Agnihotra. The Brahmana
    cursed him that, in battle, his chariot wheel would be swallowed by the earth
    and his foe would cut off his head; Karna's attempted restitution could not reverse
    the curse.
  language: English
  quote_policy: quoted
