canonical_text:
  quote: ''
  summary: Karna addresses Shalya and reports Brahmanas' speeches heard in Dhritarashtra's
    or the Kuru court. The speeches blame the Vahikas, Madrakas, Jarttikas, and Aratta-Vahikas
    through descriptions of distance from named sacred places, condemned food and
    drink practices, sexual and social disorder, a Rakshasa woman's song, absence
    of sacrifice, and exclusion from gifts accepted by gods, pitris, and Brahmanas.
    The excerpt ends in the middle of another reported statement about heaven, milk,
    and named places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Karna asks Shalya, ruler of the Madras, to listen to an account that Karna
    says he heard recited in Dhritarashtra's abode, where Brahmanas narrated old histories
    and accounts of regions and ancient kings.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A venerable Brahmana is reported as blaming the Vahikas and Madrakas and saying
    that the Vahikas should be avoided as impure people outside the pale of virtue
    and living away from Himavat, the Ganga, Sarasvati, Yamuna, Kurukshetra, the Sindhu,
    and its five tributary rivers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The reported Brahmana says that entrances to the abodes of Vahika kings are
    marked by a slaughter-ground for kine and a place for storing intoxicating spirits.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The reported Brahmana names Sakala, the river Apaga, and the Jarttika clan
    of the Vahikas, and describes the people as drinking Gauda liquor and eating foods
    including beef with garlic, meat-flour cakes, and purchased boiled rice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The same report describes Vahika women as intoxicated, undressed, laughing,
    dancing, and singing obscene songs outside houses, and as acting without restraint.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A quoted Vahika speaker living in Kurujangala longs for a Vahika maiden and
    for returning across the Sutlej and Iravati to his own country, women, music,
    foods, forests, and countrymen.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The quoted Vahika speaker also anticipates joining countrymen on highways
    to attack passengers, seize their robes and attire, and beat them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Karna tells Shalya that one sixth of the merits and demerits of the Vahikas
    belongs to Shalya.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Rakshasa woman in Sakala is reported as singing every fourteenth day of
    the dark fortnight with a drum, after beef and Gauda liquor, and singing about
    eating sheep, pork, beef, fowl, ass, and camel meat.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Another Brahmana in the Kuru court identifies Aratta regions as places of
    Pilu forests and six rivers, including the Satadru, Vipasa, Iravati, Candrabhaga,
    Vitasa, and Sindhu, and describes them as removed from Himavat and without virtue
    and religion.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The same reported Brahmana says gods, pitris, and Brahmanas never accept gifts
    from fallen people, from those begotten by Shudras on girls of other castes, or
    from Vahikas who never perform sacrifices and are very irreligious.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Another Brahmana is reported as saying that Vahikas eat from wooden and earthen
    vessels licked by dogs, drink sheep, camel, and ass milk, eat curds and other
    preparations from such milk, and should be avoided.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage ends with Karna beginning another reported statement about heaven
    after drinking milk in Yugandhara, residing in Acyutasthala, and bathing in an
    unnamed place; the sentence is unfinished in the supplied excerpt.
  category: sequence
  evidence_refs:
  - ev:7
