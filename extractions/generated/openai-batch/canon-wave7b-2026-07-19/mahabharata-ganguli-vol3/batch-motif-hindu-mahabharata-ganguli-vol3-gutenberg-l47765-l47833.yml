canonical_text:
  quote: ''
  summary: Vyasa describes Brahma/Brahman as existing before creation, explains nested
    measures of time from winks through human, ancestral, divine, and Brahmanic days
    and nights, gives the durations and declining qualities of the four yugas, and
    states that the universe begins with Brahman's day while dissolution coincides
    with the Creator's sleep before waking and renewed manifestation.
  language: English
  quote_policy: summarized
