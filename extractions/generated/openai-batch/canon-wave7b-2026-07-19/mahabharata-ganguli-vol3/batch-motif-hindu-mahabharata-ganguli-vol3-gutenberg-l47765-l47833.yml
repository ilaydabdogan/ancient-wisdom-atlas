- id: obs:2
  text: Brahma is described as beginningless, endless, unborn, effulgent, undecaying,
    immutable, indestructible, inconceivable, transcending knowledge, and existing
    before Creation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rishis are said to have measured time and named particular portions of it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The passage lists a sequence of time units: winks of the eye, Kashtha, Kala,
    Muhurta, day and night, month, and year.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sun makes day and night for the human world; night is for sleep and day
    is for action.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A human month is said to equal a day and night of the Pitris, with the light
    and dark fortnights forming their day and night.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A human year is said to equal a day and night of the gods, divided by the
    sun's half-year movements.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The four yugas are named as Krita, Treta, Dwapara, and Kali, each with a main
    duration and morning and evening portions measured in years of the deities.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The yuga durations and their conjoining portions decrease by a quarter in
    successive yugas.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the Krita age, duties and Truth exist in entirety, and people do not obtain
    knowledge or objects through unrighteous or forbidden means.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: In later yugas, duty, Vedic words, lifespan, blessings, and fruits of rites
    gradually decrease, while sinfulness grows through theft, untruth, and deception.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: 'The passage assigns a foremost practice to each yuga: penance in Krita, knowledge
    in Treta, sacrifice in Dwapara, and gift in Kali.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Twelve thousand years of the deities are said to constitute a yuga, and a
    thousand such yugas compose one day of Brahman, with an equal duration for Brahman's
    night.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: At the commencement of Brahman's day the universe begins to start into life.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: During universal dissolution the Creator sleeps in yoga-meditation and later
    awakes when the period of slumber ends.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: After Brahman's night expires, Brahman wakes, modifies indestructible chit
    by overlaying it with Avidya, and causes Consciousness to arise, from which Mind
    and the Manifest proceed.
  category: sequence
  evidence_refs:
  - ev:7
