canonical_text:
  quote: ''
  summary: 'Vidura tells Dhritarashtra a parable about a Brahmana trapped in a terrifying
    forest, hanging in a pit amid beasts, a woman, snakes, an elephant, rats, bees,
    and falling honey. Dhritarashtra asks about the man''s attachment to life. Vidura
    explains the parable as a moksha-oriented simile: the wilderness is the world,
    the forest is the bounded span of life, beasts are diseases, the woman is decrepitude,
    the pit is the body, the snake is time, creepers are desire for life, the elephant
    is the year, rats are days and nights, bees are desires, and honey is pleasure
    from desire.'
  language: English
  quote_policy: summarized
