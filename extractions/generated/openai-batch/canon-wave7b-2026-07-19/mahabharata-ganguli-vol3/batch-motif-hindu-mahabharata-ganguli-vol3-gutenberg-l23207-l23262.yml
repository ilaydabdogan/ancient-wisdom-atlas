canonical_text:
  quote: '"Thither is victory where righteousness is!"'
  summary: Dhritarashtra sends the Pandavas with Keshava to Gandhari. Grieving for
    her slain sons, Gandhari is about to curse Yudhishthira or the Pandavas, but the
    son of Satyavati arrives after cleansing himself in the Ganga and counsels her
    to restrain her wrath, remember her own words about righteousness and victory,
    and show forgiveness. Gandhari says she does not wish the Pandavas to perish,
    assigns the destruction of the Kurus chiefly to Duryodhana and his allies, but
    remains angry that Bhima struck Duryodhana below the navel in mace combat.
  language: English
  quote_policy: quoted
