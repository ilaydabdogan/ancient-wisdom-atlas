canonical_text:
  quote: That man who, having obtained this car, viz., his body endued with mind,
    goes on, curbing with the reins of knowledge...
  summary: Parasara instructs a king on disciplined intelligence, devotion, renunciation,
    righteous action, the consequences of sin, and the need to act with reflection.
    He uses analogies of a body as a car, sense objects as steeds, cloth stained by
    color, and water held in baked or unbaked vessels. He also states duties of kingship,
    sacrifice, forest retirement, self-restraint, reverence, truth, and good conduct.
  language: English
  quote_policy: quoted
