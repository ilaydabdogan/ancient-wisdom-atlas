canonical_text:
  quote: In Truth is immortality.
  summary: A son teaches that death, decrepitude, disease, and passing nights make
    life transient; he urges immediate virtue, non-injury, Truth, sense-restraint,
    renunciation of attachment, inward sacrifice, the search for the hidden Self,
    and return to Brahma. Bhishma then tells the monarch to emulate the truth-devoted
    conduct of the father in the story.
  language: English
  quote_policy: quoted
