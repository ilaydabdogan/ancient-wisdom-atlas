canonical_text:
  quote: ''
  summary: 'Vasudeva/Krishna instructs Arjuna through two moral exempla: the hunter
    Valaka kills a blind beast and is taken to heaven because the beast threatened
    all creatures, while the ascetic Kausika truthfully reveals fugitives to robbers
    and falls into hell because his words enable their murder. Krishna explains that
    Dharma is subtle, not covered by scripture in every case, and is tied to preserving
    creatures. Arjuna then states his vow concerning anyone who tells him to give
    up Gandiva, notes that the king has uttered such words, and asks Krishna how his
    vow may be fulfilled while both he and Yudhishthira live.'
  language: English
  quote_policy: summarized
