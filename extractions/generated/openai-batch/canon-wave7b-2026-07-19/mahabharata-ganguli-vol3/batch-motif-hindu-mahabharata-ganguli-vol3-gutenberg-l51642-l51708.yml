  summary: Syumarasmi asks Kapila about knowledge, Yoga, Agama, direct realization,
    and pure felicity. Kapila answers that scriptural duties, self-restraint, knowledge,
    and Yoga lead toward the highest end, contrasting them with disputation, pride,
    Tamas, and failure to practice tranquillity.
