canonical_text:
  quote: The account has been squared.
  summary: Yudhishthira asks Bhishma how a king can rule or conquer without trusting
    others. Bhishma answers with the story of Pujani, a knowledgeable bird living
    in King Brahmadatta's palace. Pujani feeds both her own offspring and the infant
    prince with strengthening fruits brought from the ocean shore. The prince kills
    Pujani's young bird during play. Pujani laments the untrustworthiness of Kshatriyas,
    blinds the prince with her talons as vengeance, and Brahmadatta accepts the act
    as a balancing injury and asks her to remain.
  language: English
  quote_policy: quoted
