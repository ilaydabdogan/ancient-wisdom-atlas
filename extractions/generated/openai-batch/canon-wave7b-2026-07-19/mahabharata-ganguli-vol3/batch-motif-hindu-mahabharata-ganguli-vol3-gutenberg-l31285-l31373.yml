canonical_text:
  quote: Protection of the subject is the highest duty of the king
  summary: 'Yudhishthira asks Bhishma how a king should protect his subjects without
    grief or unrighteousness. Bhishma answers with royal duties: honor Brahmanas,
    employ them in sacrifices, avoid lust and wrath, appoint wise and non-covetous
    agents, collect only just revenue, protect subjects and all creatures, support
    Brahmanas, and gain heavenly merit through righteous protection.'
  language: English
  quote_policy: quoted
