canonical_text:
  quote: ''
  summary: A hymn addresses a deity with repeated salutations, describing the deity
    as united with opposites, cosmic forms, sacrifice and sacrificial agents, rivers
    and food, many heads, feet, eyes, and tridents, child and old, marked by Ganges-bearing
    matted locks, teacher of Sankhya-Yoga, bearer of a snake sacred thread, three-eyed
    lord of Amvika, giver and destroyer of desires and all things, ascetic, mover
    of Moon, Yugas, and clouds, wind and fire, creator and destroyer of living beings,
    Brahma, and source of Mind.
  language: English
  quote_policy: summarized
