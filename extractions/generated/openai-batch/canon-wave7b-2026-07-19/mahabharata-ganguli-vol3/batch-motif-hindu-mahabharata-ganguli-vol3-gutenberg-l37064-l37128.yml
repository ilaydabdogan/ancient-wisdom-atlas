  summary: Yudhishthira asks how a Brahmana with family should subsist in a calamitous
    time when righteous rule disappears and resources fall to robbers. Bhishma answers
    with counsel on knowledge, emergency morality, the king’s crisis powers and limits,
    avoidance of slander, protection of honored religious persons, debate over precedent,
    divine punishment, and the difficult discernment of duty through signs and the
    path of the good.
