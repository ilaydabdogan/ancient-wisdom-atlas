  summary: Vaishampayana describes the ritual investiture of Kartikeya/Skanda as generalissimo
    of the celestial forces. Brihaspati performs fire libations, Himavat provides
    a gem-adorned seat, numerous divine and cosmic beings assemble with auspicious
    articles, sacred water of the Sarasvati is poured on Skanda's head from golden
    jars, and multiple gods grant him companions and troops.
