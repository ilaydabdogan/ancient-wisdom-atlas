canonical_text:
  quote: ''
  summary: Sanjaya narrates that the king sends his brothers to protect Karna from
    Bhima. The princes surround Bhima and attack with arrows, but Bhima kills many
    of them, including several named sons, causing the others to flee. Karna returns
    and duels with Bhima; they exchange arrow-showers, Bhima hurls a mace that Karna
    destroys, Bhima wounds Karna deeply, and Karna retaliates by killing Bhima's driver,
    cutting his standard and bow, and depriving him of his car. Bhima then dismounts
    with a mace.
  language: English
  quote_policy: summarized
