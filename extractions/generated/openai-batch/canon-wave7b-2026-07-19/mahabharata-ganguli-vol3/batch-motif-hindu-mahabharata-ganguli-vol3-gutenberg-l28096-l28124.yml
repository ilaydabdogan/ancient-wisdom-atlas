canonical_text:
  quote: ''
  summary: Vaisampayana reports that after the battle Yudhishthira and Dhritarashtra
    arrange Sraddha rites and donations for slain kinsmen, sons, allies, and kings
    without surviving kin. Yudhishthira also establishes food and water distributions
    and tanks in the names of the dead, honors elders and officials, protects bereaved
    women, supports the destitute, blind, and helpless, and then rules happily after
    conquest.
  language: English
  quote_policy: summarized
