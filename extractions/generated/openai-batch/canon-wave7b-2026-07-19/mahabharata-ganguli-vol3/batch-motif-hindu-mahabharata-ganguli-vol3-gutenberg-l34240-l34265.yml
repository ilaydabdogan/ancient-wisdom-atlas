  quote: practise both severity and mildness
  summary: 'The passage gives Yudhishthira counsel on kingship: a ruler should temper
    punishment with compassion, address defeated survivors with regret for the slain,
    privately honor his own brave troops, comfort wounded fighters affectionately,
    and win trust by conciliation, virtue, truthfulness, and protection from fear.'
