canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma about the deity to adore, the means to heaven
    and emancipation, ritual ordinances, and the supreme deity and Pitri. Bhishma
    calls the matter a deep mystery and introduces an old account involving Narada
    and Narayana. He narrates Narayana's fourfold birth as Nara, Narayana, Hari, and
    Krishna, the austerities of Nara and Narayana at Vadari in the Himalayas, Narada's
    journey to see them, and Narada's question about whom Narayana worships.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yudhishthira asks Bhishma which deity should be adored by persons in different
    modes of life, how heaven and emancipation may be attained, how homa should be
    performed for gods and Pitris, and who is the deity of deities and Pitri of Pitris.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma says Yudhishthira's question touches a deep mystery and cannot be
    answered by argumentation alone; he says Narayana's grace or high knowledge is
    needed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bhishma cites an old history of a discourse between Narada and the Rishi Narayana,
    which he says he heard from his sire.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'In the Krita age, during the epoch of the Self-born Manu, the eternal Narayana
    is said to have taken birth as the son of Dharma in four forms: Nara, Narayana,
    Hari, and the Self-create Krishna.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nara and Narayana went to the Himalayan retreat called Vadari and undertook
    severe austerities.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The cars of Nara and Narayana are described as golden, eight-wheeled, composed
    of the five primal elements, and beautiful.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nara and Narayana became emaciated from austerities, and the deities were
    unable to look at them except for the deity whom they had propitiated.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Narada, devoted to Nara and Narayana and desiring to behold them, descended
    to Gandhamadana from a summit of Meru, wandered over the world, and reached the
    retreat of Vadari.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Narada entered the retreat during the time when Nara and Narayana were performing
    their daily rites.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Narada thinks that the retreat belongs to the Being in whom all worlds, including
    deities, Asuras, Gandharvas, Kinnaras, and great snakes, are established.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Narada wonders what deity and what Pitris Nara and Narayana worship, although
    he calls them the sires of all creatures and the deities of all beings.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Narada appears before the two gods after they have completed adoration to
    their deities and the Rishis, and he is honored with prescribed rites.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Narada observes the original deities worshipping other deities and Pitris,
    takes his seat, looks at Narayana, bows to Mahadeva, and speaks.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Narada praises Narayana as unborn, eternal, the Creator, the mother of the
