canonical_text:
  quote: ''
  summary: Bhishma narrates that King Sumitra, exhausted from chasing a wounded deer
    during a hunting expedition, arrives at an ascetic asylum. The ascetics honor
    him and ask who he is and why he has come. Sumitra identifies himself, explains
    his failed pursuit and disappointed hope, and asks the ascetics whether human
    hope or the vast firmament is greater, requesting instruction if the topic is
    fit for discourse.
  language: English
  quote_policy: summarized
