canonical_text:
  quote: Creation and destruction succeed each other even as sunrise and sunset in
    this world.
  summary: A divine first-person speaker addresses Narada, describing many deities,
    sacred texts, rites, powers, waters, and cosmic beings as dwelling within his
    body. He recounts creating and granting boons to Brahman, identifies himself with
    scriptural and yogic forms, describes the cyclic withdrawal and recreation of
    the universe, gives an emanational sequence from Sesha/Sankarshana through Pradyumna
    and Aniruddha to Brahman and all creatures, and foretells future forms that rescue
    Earth, slay Asura adversaries, restore sovereignty to Indra, and appear as Rama
    to destroy proud Kshatriyas.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker says Rudra was born from his wrath and forehead, and that groups
    such as the eleven Rudras, twelve Adityas, eight Vasus, Aswini Kumars, Prajapatis,
    seven Rishis, Vedas, sacrifices, nectar, herbs, penances, vows, goddesses, Earth,
    Dhruva, oceans, lakes, rivers, Pitris, and the three attributes dwell in him or
    in his body.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says acts done for the Pitris are superior in merit to acts done
    for deities, and that he is the Pitri of both deities and Pitris.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says he becomes the Equine-head, roves through the Western and
    Northern ocean, and drinks sacrificial libations and solid sacrificial food offered
    with mantras and devotion.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker says he created Brahman, received Brahman's sacrificial adoration,
    granted Brahman boons, and promised Brahman sonship, sovereignty over worlds,
    naming authority, boundary-setting authority, boon-giving power, and future adoration
    by many beings.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker says he adopted Nivritti, describes the highest Nivritti as the
    annihilation of all duties and acts, and reports that learned preceptors and scriptures
    speak of him as Kapila, Hiranyagarbha, and one who delights in Yoga.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker says that at the end of a thousand Yugas he will withdraw the
    universe and all mobile and immobile creatures into himself, exist alone with
    knowledge as companion, and later create the universe again with that knowledge.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The speaker gives a creation sequence: his fourth form creates Sesha, called
    Sankarshana; Sankarshana creates Pradyumna; from Pradyumna the speaker takes birth
    as Aniruddha; from Aniruddha springs Brahman; Brahman is born from Aniruddha''s
    navel; from Brahman spring all mobile and immobile creatures.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that creation and destruction repeatedly succeed one another
    at the beginning of every Kalpa, like sunrise and sunset.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The speaker says he will assume the form of a boar, bring back the submerged
    Earth with her seas to her position for the good of creatures, and slay Hiranyaksha,
    son of Diti.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The speaker says he will assume the form of a Man-lion and slay Hiranyakasipu,
    son of Diti, who will be a destroyer of sacrifices.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The speaker says Vali, born to Virochana, will be unslayable, overthrow Sakra,
    and take sovereignty of the three worlds; the speaker will be born in Aditi's
    womb by Kasyapa as the twelfth Aditya, restore the sovereignty to Indra, replace
    deities in their stations, and cause Vali to dwell in the nether regions.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The speaker says that in the Treta age he will be born as Rama in the race
    of Bhrigu and exterminate Kshatriyas who become proud of strength and possessions.
  category: sequence
  evidence_refs:
  - ev:8
