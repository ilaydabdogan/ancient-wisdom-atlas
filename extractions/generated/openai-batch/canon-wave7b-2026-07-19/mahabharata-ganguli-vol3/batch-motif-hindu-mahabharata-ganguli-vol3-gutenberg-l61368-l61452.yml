- id: motif:3
  label: Withdrawal of the universe into the deity and cyclic re-creation
  taxonomy_refs:
  - annihilation_union
  - death_rebirth
  basis: The speaker says he will withdraw all creatures into himself, exist alone,
    and later recreate the universe; creation and destruction recur like sunrise and
    sunset.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage frames this as cosmological cycle rather than individual death
    and rebirth.
- id: motif:4
  label: Emanational chain of sacred births and creation
  taxonomy_refs:
  - divine_parent_child
  - sacred_birth
  basis: Sesha/Sankarshana, Pradyumna, Aniruddha, Brahman, and all creatures arise
    in sequence, with Brahman born from Aniruddha's navel.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The text uses a theological creation sequence; kinship language is explicit
    for Brahman as son in an earlier section but not for every link.
- id: motif:5
  label: Submerged Earth restored from waters by boar form
  taxonomy_refs:
  - flood_and_renewal
  basis: The speaker says he will assume boar form, bring Earth back when she is submerged
    in water, and restore her for the good of creatures.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage gives the rescue in prophetic summary, not as an extended
