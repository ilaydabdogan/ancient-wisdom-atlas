  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: The speaker drinks sacrificial libations and food, Brahman worships him through
    sacrifice, and the speaker grants Brahman boons.
  evidence_refs:
  - ev:2
  confidence: high
