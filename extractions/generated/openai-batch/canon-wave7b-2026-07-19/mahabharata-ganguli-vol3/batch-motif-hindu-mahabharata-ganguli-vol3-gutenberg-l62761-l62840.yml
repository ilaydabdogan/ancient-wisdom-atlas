canonical_text:
  quote: ''
  summary: In a framed dialogue, Saunaka praises Sauti's discourse on Narayana as
    purifying and asks why Narada, after seeing Narayana, quickly went to Vadari to
    see Nara and Narayana. Sauti replies by recounting Janamejaya, during an interval
    in his snake-sacrifice, asking Vyasa the same question. Janamejaya praises the
    discourse as extracted from the Bharata and other traditions, calls Narayana the
    Supreme Lord into whom beings enter at the end of the Kalpa, praises his ancestors
    for having Vasudeva or Vishnu as ally, and asks about Narada's return from White
    Island to Vadari and his conversations with the two Rishis.
  language: English
  quote_policy: summarized
