canonical_text:
  quote: ''
  summary: Sanjaya reports that Vasudeva, standing on the chariot, rebukes Karna for
    invoking virtue only when distressed. Vasudeva lists prior acts involving Draupadi’s
    humiliation, dice, poison and snakes, the lac house fire, denial of the Pandavas’
    kingdom, and Abhimanyu’s killing. He then declares Karna will not escape alive
    and predicts that the Pandavas, like Nala after dice defeat, will recover their
    kingdom by prowess while the Dhartarashtras are destroyed.
  language: English
  quote_policy: summarized
