canonical_text:
  quote: ''
  summary: A preceptor instructs a disciple on Adhyatma, identifying Vasudeva/Krishna/Vishnu/Narayana
    as the supreme cause, creator, destroyer, and wheel of Time. The passage describes
    cyclical cosmic dissolution and recreation, disappearance and recovery of Vedas
    and scriptures, the first acquisition of various sciences by named sages, and
    an emanation sequence from the Unmanifest through elements and faculties.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The preceptor calls Adhyatma an undisclosed and highest branch of learning,
    and identifies Vasudeva as the supreme cause, origin of the Vedas or Om, and as
    truth, knowledge, sacrifice, renunciation, self-restraint, and righteousness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The preceptor says the account of Krishna should be heard from speakers of
    the listener's own social order.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Vasudeva is described as the wheel of Time without beginning or end, and the
    universe is said to revolve like a wheel depending on him.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kesava is described as indestructible, unmanifest, immortal, immutable, and
    as creator of Pitris, gods, Rishis, Yakshas, Rakshasas, Nagas, Asuras, humans,
    Vedas, and human duties and customs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the end of each celestial yuga, universal destruction occurs and the Vedas
    and scriptures disappear; at the beginning of a new yuga, Prakriti is created
    and beings arise in a seasonal sequence.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Through the grace of the Self-born and by penances, great Rishis re-acquire
    the lost Vedas and scriptures.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Named figures are credited with first acquiring particular bodies of knowledge,
    including the Vedas, Angas, morality, music, arms, celestial Rishi history, medicine,
    and other sciences.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says neither gods nor Rishis at first apprehended Brahma; Narayana
    alone knew it, and later Rishis, deities, Asuras, and royal sages derived that
    knowledge from Narayana.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Primordial matter is said to produce many existences through primal energy,
    like one lighted lamp lighting thousands of other lamps without being exhausted.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'An emanation sequence is given: from the Unmanifest comes Understanding,
    then Consciousness, Space, Wind, Heat, Water, and Earth; these eight are called
    primordial Prakriti.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The five organs of knowledge, five organs of action, five sensory objects,
