canonical_text:
  quote: ''
  summary: Vaishampayana narrates that Dhritarashtra, grieving over the death of his
    sons, falls senseless despite Vidura’s words. His companions and attendants revive
    and comfort him with water, fanning, and touch. On recovering, he laments human
    suffering, describes grief as burning and wisdom-destroying, declares death preferable,
    and resolves to end his life. Vyasa then prepares to address his grieving son.
  language: English
