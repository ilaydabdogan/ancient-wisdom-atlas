canonical_text:
  quote: '"It is Time that took away their life-breaths according to the great law
    of change."'
  summary: Vyasa counsels a grieving king that the slain Kshatriyas died through Time
    and the consequences of action, not through the personal agency of the king or
    his allies. He cites the ancient war of gods and Asuras as precedent for violent
    action against destroyers of virtue, distinguishes remorseful action from wilful
    sin, recommends the Horse-sacrifice as expiation, invokes Indra's sacrifices as
    an example, and instructs the king to restore political order by installing heirs
    and ruling his subjects justly.
  language: English
  quote_policy: quoted
