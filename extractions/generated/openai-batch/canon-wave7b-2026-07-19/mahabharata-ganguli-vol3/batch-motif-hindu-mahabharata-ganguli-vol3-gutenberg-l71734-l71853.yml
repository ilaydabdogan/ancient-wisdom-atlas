canonical_text:
  quote: ''
  summary: 'The footnotes explain mythological and philosophical terms: the great
    god is likened to a fish in waters or a net; deluge clouds appear at universal
    destruction; Maheswara is identified with Narayana or Krishna; Krishna protects
    cattle from floods and poison; Siva accepts rejected things and swallows the ocean-churning
    poison to save the universe; Rahu causes eclipses by devouring the Sun and Moon;
    deities are described as born in Mahadeva; Kalpas repeat similar events; and rebirth
    is explained through continuing attributes in a subtle body.'
  language: English
  quote_policy: summarized
