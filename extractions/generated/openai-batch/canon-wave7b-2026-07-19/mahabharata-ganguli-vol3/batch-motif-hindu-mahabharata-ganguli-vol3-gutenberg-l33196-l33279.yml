canonical_text:
  quote: It is the king who constitutes the age.
  summary: 'Utathya instructs Mandhatri on royal conduct: a righteous king sustains
    prosperity, social order, sacrifices, and the ages, while a heedless or unrighteous
    king brings grief, disorder, divine chastisement, and destruction. The passage
    emphasizes protecting the weak, punishing wrongdoers, honoring ministers, and
    acting as a shelter for subjects.'
  language: English
  quote_policy: quoted
