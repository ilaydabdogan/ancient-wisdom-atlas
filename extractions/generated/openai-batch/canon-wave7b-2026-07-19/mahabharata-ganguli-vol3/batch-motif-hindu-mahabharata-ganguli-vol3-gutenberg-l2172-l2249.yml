canonical_text:
  quote: ''
  summary: Sanjaya narrates a battle in which elephant-warriors urged by the addressed
    king's son attack Dhrishtadyumna. Pandava and Pancala allies rescue him, several
    named warriors kill elephants and riders, Nakula is attacked and rescued, the
    enemy elephant force collapses under arrow volleys, and the Pandava warriors rush
    toward Karna.
  language: English
  quote_policy: summarized
