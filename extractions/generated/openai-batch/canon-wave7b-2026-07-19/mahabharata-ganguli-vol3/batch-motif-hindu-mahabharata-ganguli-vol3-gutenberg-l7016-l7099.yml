  quote: ''
  summary: Sanjaya reports Krishna urgently showing Arjuna that Yudhishthira is being
    pursued and endangered by Duryodhana, Karna, and the Dhartarashtra/Kaurava forces.
    Krishna describes allied attempts to rescue Yudhishthira, the routing of Pandava-allied
    troops by Karna, and Karna’s command to the Kauravas to advance against the Srinjayas.
  language: English
  quote_policy: summarized
