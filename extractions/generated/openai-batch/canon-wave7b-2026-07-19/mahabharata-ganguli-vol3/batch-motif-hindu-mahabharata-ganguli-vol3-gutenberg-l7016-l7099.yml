candidate_motifs:
- id: motif:1
  label: endangered king pursued on the battlefield
  taxonomy_refs: []
  basis: Yudhishthira, identified as king, is pursued by Duryodhana and Dhartarashtra
    forces while allied warriors attempt to rescue him.
  evidence_refs:
  - ev:2
  - ev:8
  confidence: high
  cautions: This is a battlefield episode rather than a full royal-legitimacy narrative
    in the supplied passage.
- id: motif:2
  label: rescue rush toward a threatened ally
  taxonomy_refs: []
  basis: Pancalas and Pandavas proceed rapidly toward Yudhishthira, explicitly likened
    to rescuers of someone sinking in a bottomless sea.
  evidence_refs:
  - ev:2
  - ev:8
  confidence: high
  cautions: The passage describes the attempted rescue, not its outcome.
- id: motif:3
  label: battle death framed as sacrifice
  taxonomy_refs:
  - sacrifice
  basis: Krishna compares Yudhishthira’s apparent fate to being poured as a libation
    on sacrificial fire.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The sacrificial element is metaphorical in this passage; no ritual sacrifice
    is performed.
- id: motif:4
  label: mythic divine-war analogy for battle rout
  taxonomy_refs: []
  basis: Enemy forces are compared to Daityas desiring Amrita and immobilized by Sakra
    and Agni, and Karna’s routing of the Pancalas is compared to Sakra routing the
    Daityas.
  evidence_refs:
  - ev:3
  - ev:12
  confidence: high
  cautions: The passage uses explicit similes; it does not narrate the mythic event
    itself.
- id: motif:5
  label: overwhelming warrior as army-router
  taxonomy_refs: []
  basis: Karna repeatedly routs Pandava-allied forces, destroys divisions with arrows,
    attacks Bhima, and commands the Kauravas to advance.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: This is a martial heroic pattern within an epic battle scene; no broader
    myth-family taxonomy is directly required.
- id: motif:6
  label: martial flood image
  taxonomy_refs:
  - chaos
  basis: The numerous Kuru warriors are compared to rain-season water rushing toward
    the ocean as they move toward Yudhishthira.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The chaos taxonomy is only weakly supported by the image of overwhelming
    mass; the passage does not present cosmic chaos.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares the checked Dhartarashtra forces to Daityas
    who desired Amrita and were made motionless by Sakra and Agni.
  claim_level: same_function
  target: Daityas seeking Amrita and being checked by Sakra and Agni within the epic’s
    mythic frame
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is a rhetorical simile in the passage, not an assertion
    that the battlefield event is the same mythic episode.
- id: claim:2
  claim: The passage explicitly compares Karna’s routing of the Pancalas and his victorious
    appearance to Sakra defeating Daityas or standing among celestials after victory.
  claim_level: same_function
  target: Sakra as divine victor over Daityas and foes
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to the stated analogy of victorious martial function
    and visual comparison; it does not establish identity or historical derivation.
