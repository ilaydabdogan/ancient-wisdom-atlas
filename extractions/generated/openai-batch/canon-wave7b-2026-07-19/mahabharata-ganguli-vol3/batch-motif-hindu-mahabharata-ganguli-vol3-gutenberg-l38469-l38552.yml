canonical_text:
  quote: ''
  summary: Bhishma tells Yudhishthira that prosperity, rainfall, fears, and the setting
    in of the four ages depend on the king's conduct, and introduces an old story
    about Viswamitra and a Chandala. A twelve-year drought at the end of Treta and
    beginning of Dwapara brings cosmic, environmental, ritual, and social disorder.
    Starving and homeless, Viswamitra enters a Chandala hunters' hamlet, fails to
    obtain food, sees dog flesh in a hut, reasons that theft is allowable in distress
    to save life, and enters the hut at night before the Chandala owner speaks harshly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhishma states that subjects' welfare, rainfall, fears, and the setting in
    of Krita, Treta, Dwapara, and Kali depend on the king's conduct, and he introduces
    an old story about Viswamitra and a Chandala.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A frightful drought lasting twelve years occurs at the end of Treta and beginning
    of Dwapara, in consequence of what the gods ordained.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The thousand-eyed deity of heaven pours no rain; Vrihaspati moves retrograde,
    and Soma leaves his orbit and recedes southward.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: No dew-drop or clouds are seen; rivers shrink, lakes, wells, and springs disappear,
    and charity water-distribution places become desolate.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Brahmanas cease sacrifices, Vedic recitation, Vashats, and propitiatory rites;
    agriculture, cattle-keeping, markets, shops, sacrificial preparations, festivals,
    and amusements cease.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bones become visible everywhere; cities and towns empty, villages and hamlets
    burn, people flee in fear, places of worship become desolate, aged persons are
    forced from houses, animals fight for food and perish, and protection ends.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hunger causes men to lose their senses and eat one another, while Rishis abandon
    vows, fires, deities, and forest retreats and wander in search of food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Viswamitra leaves his wife and son in a place of shelter and wanders homeless,
    hungry, fireless, and unconcerned with clean or unclean food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Viswamitra enters a forest hamlet inhabited by Chandalas described as cruel
    hunters addicted to slaughtering living creatures.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The hamlet contains broken earthen jars and pots, dog-skins, heaps of bones
    and skulls of boars and asses, cloths stripped from the dead, used flower garlands,
    snake sloughs, cocks, hens, asses, owl and bird devices on temples, iron bells,
    and packs of dogs.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Viswamitra repeatedly begs for food but obtains no meat, rice, fruit, root,
    or other food; weakened, he falls down and considers how to avoid immediate death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Viswamitra sees a large piece of recently slain dog flesh in a Chandala hut,
    concludes he should steal it, and reasons that even a Brahmana may steal in a
    season of distress to save life.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the hamlet has fallen asleep at night, Viswamitra rises quietly and
    enters the hut; the Chandala owner, apparently lying asleep, speaks harshly in
    a broken and dissonant voice.
  category: sequence
  evidence_refs:
  - ev:8
