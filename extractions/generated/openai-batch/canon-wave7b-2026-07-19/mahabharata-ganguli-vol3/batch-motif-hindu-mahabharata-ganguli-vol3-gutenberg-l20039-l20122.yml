canonical_text:
  quote: ''
  summary: After Duryodhana is struck down unfairly by Bhimasena, Yudhishthira fears
    Gandhari's ascetic wrath and asks Krishna to go pacify her. Krishna has his car
    prepared, travels to the Kuru city, enters Dhritarashtra's palace, honors Vyasa,
    Dhritarashtra, and Gandhari, mourns with Dhritarashtra, and begins counseling
    him about the Pandavas' earlier efforts for peace, Dhritarashtra's refusal, Time,
    and Destiny.
  language: English
  quote_policy: summarized
