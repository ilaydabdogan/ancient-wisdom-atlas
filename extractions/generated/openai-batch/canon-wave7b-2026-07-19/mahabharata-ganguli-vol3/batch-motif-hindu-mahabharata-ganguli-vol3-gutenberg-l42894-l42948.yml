  summary: Bharadwaja asks Bhrigu what actions make a person a Brahmana, Kshatriya,
    Vaisya, or Sudra. Bhrigu answers by listing ritual, occupational, behavioral,
    and moral traits, then teaches restraint of passions, non-injury, renunciation,
    knowledge of the Manifest and Unmanifest, and absorption into Brahma through detachment.
  language: English
