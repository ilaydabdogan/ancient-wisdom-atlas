canonical_text:
  quote: Sulabha, endued with Yoga-power, entered the understanding of the king by
    her own understanding.
  summary: Yudhishthira asks Bhishma about attaining Emancipation without leaving
    domestic life. Bhishma introduces an old narrative about King Janaka of Mithila
    and the female mendicant Sulabha. Sulabha hears that Janaka is devoted to Emancipation,
    changes her appearance by Yoga power, travels swiftly to Mithila, is received
    with hospitality, and then tests Janaka by entering his understanding and binding
    him with Yoga bonds. Janaka counters by seizing her resolution, and the two converse
    while sharing one gross form and appearing in subtle forms without their social
    emblems.
  language: English
  quote_policy: quoted
