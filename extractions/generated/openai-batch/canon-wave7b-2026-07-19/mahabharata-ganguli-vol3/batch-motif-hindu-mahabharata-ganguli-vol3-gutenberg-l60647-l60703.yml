    thousand yojanas from Meru.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The denizens of the White Island are described as having no senses, not eating,
    having winkless eyes, emitting excellent perfumes, being white in complexion,
    and being cleansed of every sin.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The denizens are said to blast the eyes of sinners who look at them, to have
    bodies and bones hard as thunder, and to regard honor and dishonor equally.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The denizens are described with extraordinary bodily marks, including umbrella-like
    heads, cloud-like voices, four Mushkas, line-marked soles, many teeth, and many
    tongues.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The many tongues of the denizens are said to seem to lick the Sun, and the
    passage describes that Sun as a deity from whom the universe, Vedas, deities,
    and tranquil Munis have sprung.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Yudhishthira asks Bhishma how the White Island beings were born, what superior
    end they attain, and whether their marks are the same as those of emancipated
