canonical_text:
  quote: ''
  summary: Bhishma recounts Narada's request to Narayana for permission to go to the
    White Island and behold Narayana's original nature. After mutual honors, Narada
    ascends by yogic power to Meru, sees the White Island in the ocean of milk, and
    hears or reports detailed traits of its extraordinary denizens. Yudhishthira then
    asks Bhishma about their birth, destiny, and relation to the signs of emancipated
    persons.
  language: English
  quote_policy: summarized
