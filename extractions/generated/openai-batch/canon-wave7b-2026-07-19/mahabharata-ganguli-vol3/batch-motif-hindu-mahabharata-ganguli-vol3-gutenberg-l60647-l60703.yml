  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Narada says Narayana has taken birth in four forms in the house of Dharma
    and states his intention to go to the White Island to behold Narayana's original
    nature.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Narada lists practices and qualities he claims for himself, including honoring
    seniors, preserving secrets, studying the Vedas, practicing penance, truthfulness,
    scriptural protection, equal conduct toward friends and foes, and devotion to
    the Supreme Soul.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Narayana gives Narada permission to go and worships him according to scriptural
