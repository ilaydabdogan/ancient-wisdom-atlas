canonical_text:
  quote: ''
  summary: Yudhishthira laments that many relatives, friends, preceptors, kings, and
    warriors have been slain for his desire of kingdom. He grieves over the bereaved
    women who may die of affliction and go to Yama's abode, fears guilt and hell for
    the slaughter, and asks what mode of life he should adopt. Vaisampayana then says
    that the Island-born Rishi reflects and addresses the son of Pandu.
  language: English
