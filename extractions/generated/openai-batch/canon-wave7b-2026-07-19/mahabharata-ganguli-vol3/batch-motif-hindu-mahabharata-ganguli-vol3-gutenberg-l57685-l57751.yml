canonical_text:
  quote: ''
  summary: Yajnavalkya explains to an unnamed son the distinction between Purusha
    and Prakriti in Sankhya terms. Purusha is described as conscious, witnessing,
    and beyond attributes in its real nature, while unmanifest Prakriti is endowed
    with attributes and unintelligent by nature. The passage uses analogies such as
    crystal and reflection, reed and cover, worm and Udumvara, fish and water, fire
    and pan, and lotus leaf on water to explain coexistence without identity. Correct
    discernment of Purusha and Prakriti leads to Emancipation; incorrect vision leads
    to repeated hell. Yajnavalkya then announces a discourse on the science of the
    Yogins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yajnavalkya says that what is without attributes cannot be explained by attributing
    qualities to it, but he will explain what has attributes and what is devoid of
    them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: High-souled Munis say Purusha is called possessed of attributes when it seizes
    attributes like a crystal reflecting a red flower, and is seen in its real nature
    when freed from attributes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Unmanifest Prakriti is described as naturally endowed with attributes, unintelligent
    and inanimate by nature, and as becoming animate and intelligent through union
    with eternal and indestructible Purusha.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: When Purusha repeatedly associates with attributes through ignorance, he fails
    to understand his real nature and fails to attain Emancipation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Purusha is described in relation to lordship, agency in creation, agency in
    Yoga, creation of seeds, causing principles to start into life, and witnessing
    everything.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Some Sankhyas say Prakriti is one while Purushas are many, and the passage
    states that Purusha is different from Prakriti.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'The passage gives several analogies for distinct things coexisting: reed
    and outer cover, worm and Udumvara, fish and water, fire and earthen saucepan,
    and lotus leaf and water.'
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Those who see Prakriti and Purusha incorrectly are said to sink repeatedly
    into terrible hell, while Sankhyas attain Emancipation by ascertaining their nature
    correctly.
  category: sequence
  evidence_refs:
  - ev:8
