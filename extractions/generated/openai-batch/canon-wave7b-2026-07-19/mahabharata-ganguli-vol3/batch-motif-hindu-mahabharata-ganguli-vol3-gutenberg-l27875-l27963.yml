canonical_text:
  quote: "“a Rakshasa of the name of Charvaka, who had disguised himself as a Brahmana”"
  summary: Yudhishthira and the Pandavas enter the city amid public praise and blessings.
    Yudhishthira enters the palace, worships household gods, honors Brahmanas with
    gifts, and receives benedictions. Charvaka, a Rakshasa friend of Duryodhana disguised
    as a Brahmana mendicant, falsely accuses Yudhishthira in the name of the Brahmanas.
    The Brahmanas deny the charge, perceive Charvaka’s disguise through spiritual
    sight, and kill him with the sound “Hun,” after which they bless Yudhishthira.
  language: English
  quote_policy: quoted
