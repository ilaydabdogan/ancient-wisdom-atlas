canonical_text:
  quote: ''
  summary: Yudhishthira asks whether a king can obtain lasting happiness by adopting
    prescribed conduct. Bhishma answers with a numbered catalogue of royal virtues
    and cautions, stating that such conduct brings prosperity, earthly blessings,
    and heavenly rewards. Vaisampayana then narrates that Yudhishthira worships his
    grandsire and begins to rule according to the teaching.
  language: English
  quote_policy: summarized
