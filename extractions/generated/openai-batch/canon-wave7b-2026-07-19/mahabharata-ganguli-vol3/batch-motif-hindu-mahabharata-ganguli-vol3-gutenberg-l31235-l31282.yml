- id: obs:2
  text: Bhishma says there are thirty-six virtues for a king, connected with thirty-six
    others, and that attending to them brings great merit.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bhishma advises the king to perform duties without wrath or malice, retain
    kindness and faith, acquire wealth without persecution or cruelty, pursue pleasure
    without attachment, speak agreeably, and be brave without bragging.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bhishma warns against alliance with the wicked, hostility toward friends,
    use of undevoted spies, persecution, disclosure of purposes to the wicked, and
    punishment without careful enquiry.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bhishma gives further rules concerning gifts, confidence, absence of malice,
    protection of wives, purity, moderation in female companionship, wholesome food,
    respect for deserving persons, service to preceptors and seniors, worship of the
    gods, humility, timing, and comforting men.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Bhishma says the king should not abandon a person he has favored, should not
    strike in ignorance, should not grieve after slaying a foe, and should use temper
    or mildness only in fitting circumstances.
  category: speech
  evidence_refs:
  - ev:6
