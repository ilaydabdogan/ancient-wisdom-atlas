canonical_text:
  quote: ''
  summary: The passage gives a metaphysical account in which the Soul or Purusha,
    though transcending attributes, becomes associated with Prakriti, action, senses,
    birth, death, and the three gunas. Through Ignorance, Jiva mistakes sorrow, action,
    body, senses, time, birth, death, fear, and destructibility as belonging to itself,
    and so wanders through repeated births among human beings, gods, and hell while
    experiencing karmic fruits.
