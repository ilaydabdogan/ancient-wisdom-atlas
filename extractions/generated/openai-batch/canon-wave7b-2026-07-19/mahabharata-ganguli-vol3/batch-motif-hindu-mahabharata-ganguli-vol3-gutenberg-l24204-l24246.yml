canonical_text:
  quote: ''
  summary: Yudhishthira commands that funeral rites be performed for the thousands
    slain in battle, including friendless dead. Vidura, Sanjaya, priests, and attendants
    gather ritual materials, build and light pyres, cremate named kings and warriors,
    perform pitri-medha rites with chants and lamentations, and then Yudhishthira
    proceeds toward the Ganga with Dhritarashtra placed at his head.
  language: English
