canonical_text:
  quote: ''
  summary: Duryodhana recounts an ancient gods-versus-Asuras battle involving Taraka's
    sons. After severe austerities, the three sons receive from the Grandsire a conditional
    boon tied to three moving cities that can be destroyed only when united and pierced
    by one shaft. Maya builds gold, silver, and iron cities in heaven, the welkin,
    and earth. The Daityas prosper there, gain a life-restoring lake, oppress the
    worlds, and withstand Indra's thunderbolt, prompting the gods to petition the
    Grandsire.
  language: English
  quote_policy: summarized
