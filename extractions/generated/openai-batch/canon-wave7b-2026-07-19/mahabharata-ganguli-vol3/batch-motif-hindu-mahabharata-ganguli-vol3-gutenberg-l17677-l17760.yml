canonical_text:
  quote: ''
  summary: Vaishampayana tells Janamejaya that he will narrate Kumara's investiture
    and prowess. Maheshvara's seed passes through Agni, Ganga, and Himavat, becoming
    the child Skanda/Kartikeya; the six Krittikas nurse him after he assumes six mouths,
    divine beings honor and endow him, and he later divides into four forms to approach
    Rudra, Uma, Agni, and Ganga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vaishampayana addresses Janamejaya and announces that he will narrate the
    story of Kumara's investiture and prowess.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The vital seed of Maheshvara falls into blazing fire; Agni cannot burn or
    bear it and, at Brahman's command, casts it into Ganga.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ganga cannot hold the seed and casts it onto Himavat, where Agni's son begins
    to grow with world-overwhelming energy.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The six Krittikas see the child lying on a clump of heath, each claims him
    as her own, and Skanda assumes six mouths to suckle from all of them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the child is cast by Ganga onto Himavat, the mountain is transformed
    into gold, and mountains are said to become producers of gold from that time.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The child is called Kartikeya and formerly Gangeya; he grows with ascetic
