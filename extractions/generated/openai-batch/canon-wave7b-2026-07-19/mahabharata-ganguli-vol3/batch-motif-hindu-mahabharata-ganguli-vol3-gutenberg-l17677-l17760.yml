candidate_motifs:
- id: motif:1
  label: Sacred birth through transferred divine seed
  taxonomy_refs:
  - sacred_birth
  basis: The passage traces Maheshvara's seed through Agni, Ganga, and Himavat until
    the divine child grows there and later receives birth rites.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:6
  confidence: high
  cautions: The passage presents the process as divine generation but does not narrate
    an ordinary human birth.
- id: motif:2
  label: Miraculous child of overwhelming power
  taxonomy_refs:
  - miraculous_child
  basis: The child grows with world-overwhelming energy, assumes six mouths, receives
    honors and endowments, and is described as radiant and powerful.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: The record describes only this passage and not the full later career of
    Kumara.
- id: motif:3
  label: Multiple divine mothers claim and nurse one child
  taxonomy_refs:
  - divine_parent_child
  - mother_goddess
  basis: The six Krittikas desire a son, each claims the child, and the child suckles
    from all six by assuming six mouths; Ganga and Earth also act as attending or
    bearing maternal figures.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: medium
  cautions: The mother-goddess taxonomy reference is broad; the passage specifically
    names Krittikas, Ganga, and Earth rather than a single universal mother figure.
- id: motif:4
  label: Yogic self-multiplication to satisfy multiple divine claimants
  taxonomy_refs:
  - shapeshifter
  basis: When four divine figures each expect the child's first approach, he uses
    Yoga powers to assume four forms simultaneously and go to all of them.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage describes multiplication into forms rather than disguise or
    animal transformation.
- id: motif:5
  label: Divine endowment with sacred knowledge and martial powers
  taxonomy_refs:
  - wisdom
  basis: The Vedas in fourfold form, the Science of arms, weapons, and arrows come
    to the child.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The available taxonomy has no specific martial-investiture category; the
    wisdom reference applies mainly to the Vedas and sacred knowledge.
- id: motif:6
  label: Landscape transformed by contact with divine child
  taxonomy_refs: []
  basis: Himavat is transformed into gold after Ganga casts the child there, and the
    passage explains the origin of mountains producing gold.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: No supplied taxonomy reference directly matches this etiological landscape-transformation
    motif.
