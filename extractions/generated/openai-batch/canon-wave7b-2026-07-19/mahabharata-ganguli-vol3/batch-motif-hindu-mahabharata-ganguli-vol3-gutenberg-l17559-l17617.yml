- id: obs:7
  text: After the water was purified, the Rakshasas became afflicted with hunger and
    sought the protection of the Munis with joined hands.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Rakshasas said that they were hungry, had swerved from eternal virtue,
    were sinful not by free will, and had become Brahma-Rakshasas through lack of
    grace, their own evil acts, and sexual sins of their women.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The ascetics declared that sneezed-over food, wormy or insect-filled food,
