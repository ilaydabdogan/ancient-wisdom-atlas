    portion of the Rakshasas, and that learned people should avoid such food.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the tirtha was purified and the ascetics solicited the river for the
    Rakshasas' relief, Sarasvati assumed a new shape called Aruna.
