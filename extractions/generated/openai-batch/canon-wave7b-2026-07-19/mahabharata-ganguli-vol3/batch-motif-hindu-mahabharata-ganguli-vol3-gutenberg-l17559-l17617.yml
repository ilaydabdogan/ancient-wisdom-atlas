canonical_text:
  quote: ''
  summary: Vaishampayana narrates that Sarasvati, cursed by Vishvamitra, flowed with
    blood and became a dwelling place for Rakshasas who drank it. Ascetic Rishis encountered
    the afflicted tirtha, questioned Sarasvati, worshipped Mahadeva with austerities,
    and purified the river. The hungry Rakshasas sought help; the ascetics assigned
    impure foods as their portion. Sarasvati then assumed a new river form called
    Aruna, in which the Rakshasas bathed, cast off their bodies, and went to heaven.
    Indra also bathed there and was cleansed of a grievous sin, prompting Janamejaya
    to ask about his Brahmanicide.
  language: English
  quote_policy: summarized
