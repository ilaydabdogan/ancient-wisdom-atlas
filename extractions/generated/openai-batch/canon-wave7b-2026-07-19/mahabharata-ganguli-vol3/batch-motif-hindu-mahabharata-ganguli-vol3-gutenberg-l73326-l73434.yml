canonical_text:
  quote: ''
  summary: Translator's notes explain doctrines of ordered renunciation, emancipation,
    inner vision of the Supreme Soul, restraint of mind and senses, aerial movement
    of a realized person, the cosmic force of ascetic penance, Ganga's three courses
    through earth, nether regions, and heaven, forgiveness as protection of ascetic
    power, exceptional cases concerning harmful truth and beneficial falsehood, attainment
    of Brahma, avoidance of sacrificial killing by men of knowledge, and sorrow increasing
    through indulgence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Acts are to be abandoned for Emancipation, but in an ordered sequence rather
    than all at once.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If Emancipation and omniscience are attained in the first mode of life, the
    remaining three modes are unnecessary.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Supreme Soul is to be beheld by one's own Soul.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The mind and senses are to be restrained, and the practitioner withdraws from
    worldly objects by turning the soul's gaze upon the soul.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A realized person no longer walks like ordinary men on the earth but proceeds
    through the sky.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Austere penances are said to scorch the three worlds, and this force compels
    superior deities to grant boons requested by Asuras and Danavas.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Upaplava is identified with Rahu or the ascending node; dust raised by whirlwinds
    can cover the moon for hours.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'The sacred river Ganga is said to have three courses: one on earth, one through
    the nether regions, and one through heaven.'
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ascetic power may equal that of Brahman, but wrathful cursing diminishes that
    power; forgiveness is described as the highest virtue for a Brahmana.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Truth may become harmful in exceptional cases; the note gives examples involving
    a rishi exposing concealed travellers to robbers and a goldsmith's son using falsehood
    to save a prince.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: To conquer the unconquerable is glossed as attaining Brahma, and Paravara
    is given as an equivalent for the Supreme Soul.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Men of knowledge do not perform sacrifices in which many creatures, including
    minute creatures in fires and preparations, are killed.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Sorrow is said to increase by indulgence.
  category: other
  evidence_refs:
  - ev:10
