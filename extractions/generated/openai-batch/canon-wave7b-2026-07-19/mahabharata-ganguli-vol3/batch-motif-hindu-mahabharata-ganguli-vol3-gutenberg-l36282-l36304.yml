canonical_text:
  quote: ''
  summary: The passage presents a hierarchy of beings and classes described as awake,
    from Vishnu with an equine head through Brahman, Mahadeva, gods, rishis, Brahmanas,
    and Kshatriyas. It states that Kshatriyas protect creatures, that Chastisement
    is awake among creatures and upholds everything, and that Time and Mahadeva are
    always awake. It concludes that a virtuous king should rule under Chastisement,
    and that one who hears and follows Vasuhoma's teaching will obtain desired fruits.
  language: English
  quote_policy: summarized
