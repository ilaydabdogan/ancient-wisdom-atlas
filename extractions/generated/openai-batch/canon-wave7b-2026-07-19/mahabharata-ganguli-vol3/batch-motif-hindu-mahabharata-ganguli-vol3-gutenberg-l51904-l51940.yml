canonical_text:
  quote: ''
  summary: Kapila teaches that acts cleanse the body, but knowledge is the highest
    end. He describes virtues and renunciation as the path to Brahma, says the Vedas
    contain all things including past, present, and future, states that the perceived
    universe both exists and does not exist, and identifies emancipation with the
    non-dual Brahma reached through self-control, forgiveness, and abstention from
    work without desire.
