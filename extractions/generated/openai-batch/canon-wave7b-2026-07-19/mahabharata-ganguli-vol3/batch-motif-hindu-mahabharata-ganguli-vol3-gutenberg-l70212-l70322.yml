canonical_text:
  quote: ''
  summary: A sequence of translator and commentator notes explains doctrines of Brahma,
    Yoga, sacrifice, non-injury, cow and bull symbolism, ritual sin and cleansing,
    ideal non-injurious abundance, Om/Pranava, and the idea that one who identifies
    all with Brahma may cosmically gratify others.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man is described as beyond the highest, non-eternal regions of felicity;
    deities fail to find his track, and he attains infinite and eternal Brahma.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The notes state that Vedic duties include duties for Brahma and for heaven,
    and that conflicting ordinances about cow slaughter create confusion about duty.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The notes gloss a term as striking or beating and state that the verses protest
    the institution of slavery.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The cow is called mother because its milk nourishes infants; the bull is compared
    to Prajapati because it creates offspring and helps humans produce food.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Nahusha killed a cow and a bull while honoring Rishis; the Rishis were dissatisfied
    and cleansed him of the sin. Indra is cited as an analogous case of cleansing
    from Brahmanicide.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sacrifices injuring animal and vegetable life are described as sacrifices
    for Kshatriyas, while Brahmanas should perform Yoga as their sacrifice.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: In former times, properly understood sacrifices performed without desire for
    fruit are said to have led to crops without tillage and to vegetation produced
    by the good wishes of Rishis.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A person who regards all things as Brahma, and the self as not the actor,
    is said to become sinless; the Gita view is summarized as humans acting as instruments
    of the Supreme deity.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Self-sacrifice is glossed as Yoga, and Brahmam vedam is identified with Pranava
    or Om.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: When such a man eats and is gratified, the whole universe is said to become
    gratified; Krishna swallowing a particle of pottage is cited as gratifying the
    hunger of Durvasa's pupils.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The truly good are said to perform mental sacrifices, to carry out duties
    for the good of others, and to follow a path of abstaining from injury.
  category: action
  evidence_refs:
  - ev:11
