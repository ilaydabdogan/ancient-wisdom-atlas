canonical_text:
  quote: "“Desire is the parent of Virtue and Profit.”"
  summary: Bhimasena argues that Desire is foremost among Virtue, Profit or Wealth,
    and Desire, because ascetics, ritualists, workers, gift-givers, and others act
    from desire; he urges enjoyment and balanced attention to all three. Yudhishthira
    replies that one beyond merit, sin, Profit, Virtue, and Desire, treating gold
    and a brick-bat equally, may attain Emancipation; he cites Brahman on the bondage
    of attachment and states that the Supreme Ordainer directs all creatures. The
    auditors rejoice, bow, and praise Yudhishthira, who then addresses the son of
    the foremost of rivers about duties.
  language: English
  quote_policy: quoted
