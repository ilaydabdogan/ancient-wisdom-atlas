canonical_text:
  quote: ''
  summary: A speaker addresses a king and lists injunctions for sins, punishments,
    and expiations. The passage covers animal killing, sexual misconduct, abandonment
    of parents or preceptor, adultery punishments, delayed expiation, association
    with sinners, improper marriage order between brothers, public confession with
    objects and begging, charity including the gift of a cow, re-investiture of the
    sacred thread after consuming impure substances, and warm water or milk rites
    after inhaling alcohol from another's mouth.
  language: English
  quote_policy: summarized
