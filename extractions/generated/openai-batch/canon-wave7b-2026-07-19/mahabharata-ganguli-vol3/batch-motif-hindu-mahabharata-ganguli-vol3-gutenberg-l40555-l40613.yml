  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage assigns different durations and forms of penance for sexual misconduct,
    including Brahmacharya, limited food, and living only on water for three days
    in one case.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Befouling a blazing fire is grouped with an expiation involving living only
    on water for three days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A person who casts off sire, mother, or preceptor without adequate cause is
    described as fallen.
  category: relationship
  evidence_refs:
