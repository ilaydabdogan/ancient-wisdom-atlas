canonical_text:
  quote: ''
  summary: A battle sequence describes Vrishasena being struck, dismounted, rescued
    by Duhshasana, and returned to combat. Satyaki disables Duhshasana, while Pandava-side
    warriors attack Karna. Karna responds with extraordinary archery, fills the battlefield
    with arrows, breaks through the opposing force, attacks Yudhishthira, and is protected
    by the Kuru army as the two sides clash again.
  language: English
  quote_policy: summarized
