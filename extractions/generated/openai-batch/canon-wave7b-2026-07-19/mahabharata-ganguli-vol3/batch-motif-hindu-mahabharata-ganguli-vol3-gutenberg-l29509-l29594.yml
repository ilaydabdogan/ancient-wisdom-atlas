canonical_text:
  quote: "“Like a snake swallowing up mice, the earth swallows up these two...”"
  summary: Bhishma instructs Yudhishthira on royal duty. He cites older maxims and
    examples to argue that a king should be energetic, make peace or war appropriately,
    punish even close associates when they endanger the realm, protect subjects and
    social duties, govern himself, use counsel and intelligence carefully, administer
    justice, gather wealth, choose dependable servants, and avoid covetous or oppressive
    rule.
  language: English
  quote_policy: quoted
