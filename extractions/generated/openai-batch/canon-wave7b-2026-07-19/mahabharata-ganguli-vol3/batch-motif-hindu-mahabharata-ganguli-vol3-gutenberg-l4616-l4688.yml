canonical_text:
  quote: ''
  summary: Shalya narrates a parable in which a boastful crow becomes exhausted over
    the ocean, begs a swan for protection, is carried back to an island, and gives
    up pride. Shalya then applies the parable to Karna, recalling Karna's prior failures
    against Arjuna and urging him not to boast against Vasudeva and Dhananjaya.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shalya narrates that an afflicted crow touches the water with his wings and
    beak while exhausted over a watery expanse and addresses a swan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The crow says that crows wander crying "caw, caw," places his life-breaths
    in the swan's hands, and asks the swan to carry him to the ocean shore.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The swan reminds the crow that he had boasted of coursing through the sky
    in a hundred and one kinds of flight and asks why he is now tired and fallen on
    the ocean.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The crow admits that, proud from feeding on others' leftovers, he considered
    himself equal to Garuda and disregarded other crows and birds.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The crow asks to be rescued to an island or his own country and promises never
    again to disregard anybody if he returns safely.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The swan silently lifts the drenched, frightened crow with his feet, places
    him on his back, carries him back to the island from which both had flown, sets
    him on dry land, and comforts him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The crow is described as vanquished by the swan, casting off pride, and adopting
    a peaceful and quiet life.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Shalya explicitly compares the crow to Karna, saying Karna is fed by the sons
    of Dhritarashtra on their leftovers and disregards his equals and superiors.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Shalya asks why Karna did not slay Partha at Virata's city despite being protected
    by Drona, Drona's son, Kripa, Bhishma, and other Kauravas, and says Arjuna defeated
    them like a lion defeating jackals.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Shalya says Karna fled when his brother was slain by Savyasaci and also fled
    when Gandharvas attacked at the Dvaitya lake, while Partha defeated the Gandharvas
    and liberated Duryodhana with his wife.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Shalya states that Rama spoke of the prowess of Partha and Keshava, that Drona
    and Bhishma said the two Krishnas were unslayable, and that Dhananjaya is superior
    to Karna.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Shalya advises Karna to seek the protection of the one of Vrishni's race and
    of Dhananjaya, just as the crow sought the protection of the swan.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Shalya warns that Karna will not boast when he sees Vasudeva and Dhananjaya
    together on the same car and says arrows from Partha will quell Karna's pride.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: Shalya compares Karna to a firefly and Keshava and Arjuna to the Sun and moon,
