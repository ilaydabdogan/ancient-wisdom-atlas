  summary: Yudhishthira asks whether Reciters have only the high end previously described
    or another end. Bhishma replies by listing faults in recitation discipline that
    lead Reciters to hell, unstable ends, desired objects, or rebirth, and explains
    that absence of true knowledge and wisdom causes diverse hells despite the superiority
    of the discipline.
