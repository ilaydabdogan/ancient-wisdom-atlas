canonical_text:
  quote: ''
  summary: Bhishma praises Krishna/Vishnu/Narayana with a hymn identifying him with
    multiple divine forms, cosmic totality, creator, destroyer, refuge, and liberator
    from rebirth. Bhishma then bows with his mind fixed on Krishna. Krishna/Madhava,
    knowing Bhishma's devotion, enters his body and grants heavenly knowledge of past,
    present, and future. Brahmanas praise Bhishma and Krishna, after which Krishna
    and the assembled warriors depart in chariots.
  language: English
  quote_policy: summarized
