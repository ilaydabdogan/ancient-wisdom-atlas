canonical_text:
  quote: The king should win victories without battles.
  summary: 'Vamadeva gives counsel on kingship: a ruler should prefer victory without
    battle, avoid expansion before power is consolidated, maintain loyal and prosperous
    subjects and competent forces, use intelligence against foes, protect himself,
    avoid deceit toward his own people, master his temper, and act for the benefit
    of himself and others. Bhishma adds that Vasumana followed this counsel and tells
    the addressee that following it will lead to conquering both worlds.'
  language: English
  quote_policy: quoted
