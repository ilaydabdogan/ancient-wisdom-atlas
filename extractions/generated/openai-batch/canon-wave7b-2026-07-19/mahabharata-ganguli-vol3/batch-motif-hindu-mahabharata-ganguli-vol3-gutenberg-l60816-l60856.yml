canonical_text:
  quote: ''
  summary: Bhishma tells Yudhishthira that after a great Kalpa, Vrihaspati is born
    and becomes the celestial priest. King Uparichara, also called Vasu, becomes Vrihaspati's
    disciple and performs a great Horse-sacrifice with many officiants. The king ordains
    that no animals be slain and uses products of the wilderness as requisites. Hari
    or Narayana, unseen by others, accepts his sacrificial share, provoking Vrihaspati's
    anger. Yudhishthira asks why Hari alone took his share invisibly while the other
    deities appeared visibly.
  language: English
  quote_policy: summarized
