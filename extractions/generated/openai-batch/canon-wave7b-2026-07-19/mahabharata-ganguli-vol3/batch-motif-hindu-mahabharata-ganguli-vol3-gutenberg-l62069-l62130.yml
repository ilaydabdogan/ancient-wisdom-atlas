  quote: ''
  summary: The divine speaker addresses Partha/Arjuna, explains his identity with
    Narayana/Vishnu and other names, describes cosmic functions and etymologies, recounts
    Trita’s rescue from a well through invocation, explains Kesava through rays of
    Sun, fire, and Moon, narrates the prenatal curse and later healing of Dirghatamas/Gotama,
    and closes with Agni and Soma as complementary cosmic upholders.
  language: English
