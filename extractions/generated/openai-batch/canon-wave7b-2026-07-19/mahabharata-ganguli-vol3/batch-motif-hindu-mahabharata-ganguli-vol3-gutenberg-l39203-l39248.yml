canonical_text:
  quote: ''
  summary: Yudhishthira asks how a sin committed from lack of judgment may be cleansed.
    Bhishma answers by beginning an old narrative about King Janamejaya, who killed
    a Brahmana, was abandoned by Brahmanas, priests, and subjects, retired to the
    woods, practiced austerities, and wandered seeking expiation. Janamejaya meets
    the sage Indrota, who rebukes him, refuses his touch, describes him as blood-smelling
    and corpse-like, says his ancestors have fallen into hell because of his acts,
    and predicts hell-torture, lower rebirth, and chastisement by Yama's infernal
    agents.
  language: English
  quote_policy: summarized
