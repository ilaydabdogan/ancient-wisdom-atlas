canonical_text:
  quote: ''
  summary: Sanjaya reports that Keshava turns Arjuna toward the northern part of the
    Pandava army, where Dandadhara, the chief of the Magadhas, is devastating troops
    from atop a powerful elephant. Arjuna fights Dandadhara, cuts off his weapons,
    arms, and head, and brings down his elephant. Dandadhara's brother Danda then
    advances on a white, gold-adorned tusker, wounds Janardana and Arjuna, and is
    likewise dismembered and slain by Arjuna, who also fells Danda's elephant and
    other elephants. The hostile force breaks, and Arjuna's allies praise him for
    protecting them from a foe they feared like Death.
  language: English
  quote_policy: summarized
