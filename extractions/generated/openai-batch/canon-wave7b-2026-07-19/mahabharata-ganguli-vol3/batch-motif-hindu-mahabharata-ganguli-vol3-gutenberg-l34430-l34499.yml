canonical_text:
  quote: ''
  summary: Yudhishthira asks how a righteous king deprived of treasury, army, wealth,
    and support should seek happiness. Bhishma answers with the story of the distressed
    prince Kshemadarsin, who seeks counsel from the sage Kalakavrikshiya. The prince
    laments the loss of his kingdom and asks what happiness remains. The sage teaches
    that all possessions, persons, and conditions are unstable, that grief cannot
    restore what has vanished, and that wisdom consists in regarding acquisitions
    as not one’s own. The prince replies that Time has swept away his kingdom like
    a stream and left him dependent on charity.
  language: English
  quote_policy: summarized
