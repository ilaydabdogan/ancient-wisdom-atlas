canonical_text:
  quote: ''
  summary: Sanjaya narrates Karna and Shalya discussing Bhima's approach and Karna's
    desire to meet Arjuna. Shalya drives Karna toward Bhima. Karna and Bhima exchange
    arrow attacks; Karna cuts Bhima's bow, but Bhima takes another bow and shoots
    a powerful shaft that pierces Karna and renders him senseless. Shalya carries
    Karna away, and Bhima routs the Dhartarashtra host. Dhritarashtra reacts to Karna's
    defeat and asks what Duryodhana did next.
  language: English
  quote_policy: summarized
