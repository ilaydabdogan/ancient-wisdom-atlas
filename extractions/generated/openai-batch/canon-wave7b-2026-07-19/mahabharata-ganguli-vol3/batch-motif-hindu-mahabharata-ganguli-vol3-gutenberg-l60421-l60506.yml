  text: Suka's attainment is accompanied by meteors, fiery-looking directions, earthquake,
    damaged trees and mountains, thunder-like reports, a dimmed sun, fire failing
    to blaze, agitated waters, fragrant rain, and perfumed breeze.
  category: sequence
  evidence_refs:
  - ev:2
