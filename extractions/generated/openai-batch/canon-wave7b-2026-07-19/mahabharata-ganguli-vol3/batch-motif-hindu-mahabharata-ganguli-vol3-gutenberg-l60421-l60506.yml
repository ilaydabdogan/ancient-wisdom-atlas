canonical_text:
  quote: ''
  summary: Bhishma recounts Suka's yogic casting off of faults and attributes, his
    passage into Brahma, cosmic disturbances, his aerial journey northward through
    the joined summits of Himavat and Meru, celestial praise, his relation to Mandakini
    and the Apsaras, Vyasa's pursuit and lament, Suka's echoing response after entering
    the elements, Vyasa's recognition of his own remaining attachment, and Siva's
    consolation concerning Suka's supreme attainment.
  language: English
  quote_policy: summarized
