  text: Suka, proceeding through the sky toward the north, sees two beautiful joined
    summits, one of Himavat and one of Meru, described as gold/yellow and silver/white.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Suka fearlessly dashes against the joined summits, which split apart, allowing
    him to pass through the barrier.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Celestial and mountain-dwelling beings praise Suka, adore him, and heaven
