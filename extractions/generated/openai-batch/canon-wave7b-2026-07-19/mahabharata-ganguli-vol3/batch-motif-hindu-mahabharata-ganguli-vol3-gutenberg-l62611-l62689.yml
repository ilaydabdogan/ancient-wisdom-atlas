canonical_text:
  quote: '"I raised the submerged Earth from the bottom of the ocean."'
  summary: 'The speaker, addressed by Arjuna as Janarddana, recounts divine names
    and forms: the boar who raises the submerged Earth, identity with creator and
    Vedic forms, patronage of Vedic phonetic knowledge, birth as Dharmaja and as Nara
    and Narayana, austerities on Gandhamadana, and a violent episode involving Daksha’s
    sacrifice, Rudra, a fiery dart, a mantra-transformed blade of grass, and name-origins
    for Munjakesa, Sitikantha, and Khandaparasu.'
  language: English
  quote_policy: quoted
