canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma about the merit of protecting a suppliant. Bhishma
    answers by citing Sivi and other kings and introduces a story in which a pigeon
    receives a suppliant foe and gives him its own flesh. The nested tale, said to
    have been told by Bhrigu's son to Muchukunda, begins with a cruel fowler who kills
    birds for a living. During a violent storm and flood in the forest, the fowler
    captures a cold-stricken she-pigeon, then seeks shelter for the night beneath
    a great tree, declaring himself a suppliant to the deities associated with that
    tree.
  language: English
  quote_policy: summarized
