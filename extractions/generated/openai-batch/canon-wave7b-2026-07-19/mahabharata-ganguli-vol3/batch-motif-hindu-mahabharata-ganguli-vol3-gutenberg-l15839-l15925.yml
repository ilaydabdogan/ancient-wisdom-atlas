canonical_text:
  quote: ''
  summary: After the Kaurava army's destruction, royal women, camp personnel, and
    common people flee toward Hastinapura in grief and fear. Yuyutsu, believing himself
    the sole saved survivor among the Kurus, obtains permission from Yudhishthira
    and Vasudeva to escort the royal household and fleeing people. In Hastinapura,
    Vidura questions him, hears of Duryodhana's flight, praises Yuyutsu's compassionate
    conduct, and calls him the sole support of the blind king. Vidura then enters
    the wailing, disordered palace, while Yuyutsu spends the night grieving over the
    destruction of the Bharatas.
  language: English
  quote_policy: summarized
