  summary: Parasara gives a didactic discourse on gift-giving, righteous acquisition
    of wealth, hospitality, repayment of birth-debts to gods, ancestors, guests, servants,
    society, and self, and the importance of sacred fires, sacrifice, Vedic study,
    worship, penance, and humble service to parents, teachers, and other venerable
    figures.
