canonical_text:
  quote: ''
  summary: 'Bhishma describes yogic austerities, sensory and emotional restraint,
    the severe difficulty of the Yoga path, the danger of disturbed contemplation,
    and the highest fruit of Yoga: casting off birth and death, identification with
    Brahma, cosmic entry into divine and natural forms, Narayana as the Yogin’s soul,
    and creative power.'
  language: English
  quote_policy: summarized
