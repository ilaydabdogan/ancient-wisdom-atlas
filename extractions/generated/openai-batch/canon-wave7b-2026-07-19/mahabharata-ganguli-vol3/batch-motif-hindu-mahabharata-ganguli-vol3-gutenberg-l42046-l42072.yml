canonical_text:
  quote: tell me by what conduct a person may succeed in this world, freed from grief
  summary: Yudhishthira asks Bhishma what conduct leads to success in the world, freedom
    from grief, and an excellent end. Bhishma answers by introducing an old discourse
    between Prahlada and the sage Ajagara. Prahlada questions a wandering Brahmana,
    praising his desirelessness, restraint, contentment, indifference to gain and
    loss, and witness-like detachment, and asks what wisdom, learning, and behavior
    make this possible.
  language: English
