canonical_text:
  quote: ''
  summary: After Bhishma falls silent, Yudhishthira asks his brothers and Vidura to
    determine the relative importance of Virtue, Wealth, and Desire, especially for
    subduing lust, wrath, and covetousness. Vidura argues for Virtue as foremost;
    Arjuna argues for Wealth as the practical basis for both Virtue and Desire; Nakula
    and Sahadeva argue that Wealth should be sought without abandoning Virtue, and
    that Desire should be pursued last.
  language: English
  quote_policy: summarized
