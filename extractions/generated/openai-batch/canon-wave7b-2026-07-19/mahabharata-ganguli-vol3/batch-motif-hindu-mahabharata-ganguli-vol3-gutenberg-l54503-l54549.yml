canonical_text:
  quote: ''
  summary: 'A speaker instructs his son about where a righteous person should live
    or depart from: leave places ruled by covetousness, sinful livelihood, corrupt
    authority, or neglect of Brahmanas, and dwell where religious duties, sacrificial
    utterances, generosity, chastisement of the wicked, and virtuous kingship prevail.
    The passage concludes that the benefit of the Soul is beyond description and praises
    conduct devoted to the good of all creatures.'
  language: English
  quote_policy: summarized
