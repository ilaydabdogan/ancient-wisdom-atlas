canonical_text:
  quote: ''
  summary: Yudhishthira, grieving Karna and the slain kinsmen after the war, tells
    Arjuna that their pursuit of sovereignty has led to self-slaughter, sin, and grief.
    He condemns Kshatriya wrath and praises renunciation, non-injury, and truthfulness.
    He reflects on the slain warriors' passage to Yama, the shattered hopes of their
    parents, the failure of both sides to enjoy victory, and the blame he assigns
    to Duryodhana and Dhritarashtra's failure to restrain him.
  language: English
  quote_policy: summarized
