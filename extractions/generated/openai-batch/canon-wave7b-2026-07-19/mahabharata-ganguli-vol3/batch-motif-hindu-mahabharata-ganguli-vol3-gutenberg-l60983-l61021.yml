canonical_text:
  quote: ''
  summary: Yudhishthira asks why the devoted king Vasu fell from heaven and sank beneath
    the Earth. Bhishma introduces an old discourse in which gods and Rishis dispute
    whether sacrificial Aja means a goat or seeds/grain. The Rishis object to animal
    slaughter, especially in the Krita age. King Vasu arrives through the sky and
    is asked by both parties to judge the proper sacrificial offering.
