canonical_text:
  quote: ''
  summary: Sanjaya narrates a battle in which Arjuna is surrounded and heavily shot
    by Drona's son and allied warriors, then devastates the opposing troops. The narration
    compares Arjuna's destructive force to fire, including Agni at the end of the
    Yuga. Drona's son confronts Arjuna, loses his horses, driver, and car, hurls heavy
    weapons that Arjuna cuts apart, and then turns against Suratha of the Pancalas
    as the passage breaks off.
  language: English
  quote_policy: summarized
