canonical_text:
  quote: ''
  summary: Sanjaya reports to Dhritarashtra on the armies after the fall of Bhishma,
    Drona, and Karna. Duryodhana relies on Shalya, king of Madras, as protector and
    commander. Shalya advances with an arranged Kuru formation; the Pandavas divide
    their forces against named opponents. Dhritarashtra asks about the remaining strengths
    of the armies, Sanjaya gives numerical counts, and the two sides begin a fierce
    battle at dawn.
  language: English
  quote_policy: summarized
