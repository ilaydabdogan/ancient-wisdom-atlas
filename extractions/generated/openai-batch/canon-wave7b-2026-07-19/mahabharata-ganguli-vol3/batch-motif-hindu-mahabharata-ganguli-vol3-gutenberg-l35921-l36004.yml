canonical_text:
  quote: ''
  summary: 'A didactic passage instructs a king in royal conduct: protect and supervise
    the kingdom, collect wealth gradually and mildly, avoid disregarding small resources
    or weak enemies, rely on intelligence and ministers, reject covetous officials
    and flatterers, seek instruction from virtuous Brahmanas and a preceptor, and
    prefer policy and effort over chance or destiny.'
  language: English
  quote_policy: summarized
