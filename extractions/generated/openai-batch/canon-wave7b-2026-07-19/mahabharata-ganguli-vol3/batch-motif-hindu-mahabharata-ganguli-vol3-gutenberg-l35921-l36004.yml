  text: The passage says stored wealth should not be wasted, and small wealth or powerless
    foes should not be disregarded.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: A little fire fed with clarified butter may become a conflagration, a single
