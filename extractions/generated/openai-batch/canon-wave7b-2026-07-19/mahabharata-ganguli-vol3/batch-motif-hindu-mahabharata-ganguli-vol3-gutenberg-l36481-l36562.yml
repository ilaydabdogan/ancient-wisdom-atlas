canonical_text:
  quote: "“Righteousness and Truth and Good deeds and Might and myself ... all have
    our root verily in Behaviour.”"
  summary: Prahlada describes his humble obedience to Brahmana teachers and Sukra's
    teachings. A Brahmana disciple asks for Prahlada's Behaviour as a boon; after
    Prahlada grants it, personified Behaviour and then Righteousness, Truth, Good
    deeds, Might, and Prosperity leave Prahlada. Prosperity reveals that the Brahmana
    was Sakra, who thereby took Prahlada's sovereignty over the three worlds.
  language: English
  quote_policy: quoted
