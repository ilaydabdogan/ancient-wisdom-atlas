  quote: ''
  summary: 'Bhishma tells Yudhishthira that, after hearing about the duties of domestic
    life, he should listen to the duties of the next mode of life: gradually abandoning
    domesticity and entering the excellent third mode associated with austerities,
    forest recluses, sacred spots, and deliberate observance.'
