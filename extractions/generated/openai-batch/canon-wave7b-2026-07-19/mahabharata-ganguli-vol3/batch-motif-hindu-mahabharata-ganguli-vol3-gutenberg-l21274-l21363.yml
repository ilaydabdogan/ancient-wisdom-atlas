canonical_text:
  quote: ''
  summary: 'Ashvatthama attacks the Pandava camp at night, killing sleeping, confused,
    and unarmed warriors. Panic spreads through the camp: combatants fail to recognize
    kin and comrades, animals break loose and trample people, and supernatural beings
    rejoice. Kritavarma and Kripa kill fugitives at the gate and set the camp on fire
    in three places, after which Ashvatthama continues the slaughter by sword in the
    firelit camp.'
  language: English
  quote_policy: summarized
