  summary: The passage describes a battlefield covered with dead men, elephants, horses,
    weapons, severed limbs, ornaments, banners, and blood. Krishna shows the field
    to Arjuna, praises Arjuna's battle feats, then hears uproar from Duryodhana's
    army. Krishna sees Pandya destroying enemies with arrows, compared to Yama and
    Sakra. Dhritarashtra asks Sanjaya to narrate Pandya's prowess in detail.
