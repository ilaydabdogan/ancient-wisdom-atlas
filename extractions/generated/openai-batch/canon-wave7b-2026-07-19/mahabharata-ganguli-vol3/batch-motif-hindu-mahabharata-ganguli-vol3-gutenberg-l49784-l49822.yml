canonical_text:
  quote: ''
  summary: Vyasa describes instruction for a disciple seeking Emancipation. He enumerates
    the five elements, their bodily manifestations and sensory attributes, then adds
    supplementary entities, mind, understanding, and the infinite Soul, explaining
    the Soul as Jiva when invested with body through consequences of acts. He concludes
    that one who sees living creatures as unstained despite these entities does not
    return to acts affected by error.
  language: English
  quote_policy: summarized
