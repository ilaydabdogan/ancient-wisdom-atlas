canonical_text:
  quote: ''
  summary: The son of Drona vows to continue battle and slay the opposing warriors.
    Hunters carrying meat overhear that Duryodhana is concealed within the waters
    of a lake. Hoping for wealth, they report this to Bhimasena, who rewards them
    and tells Yudhishthira. Yudhishthira, the Pandavas, and their allies proceed with
    joy to Lake Dvaipayana, where Duryodhana lies within magically solidified waters,
    armed with his mace.
  language: English
