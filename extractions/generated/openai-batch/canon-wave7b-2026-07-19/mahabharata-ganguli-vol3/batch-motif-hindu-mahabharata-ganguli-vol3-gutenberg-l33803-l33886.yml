canonical_text:
  quote: '"Elephants constitute the Ritwijas of that sacrifice, and steeds are its
    Audharyus."'
  summary: 'Indra describes battle through sacrificial language: animals, warriors,
    weapons, blood, cries, and formations correspond to sacrificial priests, vessels,
    ladles, offerings, altar, chants, and ablutions. He says warriors who fight bravely,
    die in battle, or defeat enemy leaders gain heavenly felicity, while a warrior
    slain while fleeing sinks into hell. He also says Apsaras receive the slain hero,
    and ends by beginning a rule that the aged and children should not be slain.'
  language: English
  quote_policy: quoted
