canonical_text:
  quote: ''
  summary: Bhishma recounts that Mahadeva, after swallowing Usanas, performs long
    yoga-austerities in the waters. Usanas grows in power inside Mahadeva, seeks escape,
    and is directed to exit through Mahadeva's urethra. After emerging radiant, he
    is nearly slain by the angry god, but Uma intervenes, declares him her son, and
    Mahadeva permits him to depart.
  language: English
