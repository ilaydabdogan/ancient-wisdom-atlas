canonical_text:
  quote: Upon the slaughter of the Madra king, O monarch, thy warriors all fled away
    in fear.
  summary: Sanjaya narrates the rout of the Kuru army after Shalya is slain by Yudhishthira.
    The Pandavas and Pancalas pursue the fleeing troops and proclaim Yudhishthira's
    victory, Krishna's protection, and the coming grief of Dhritarashtra and Duryodhana.
    Duryodhana orders his driver to take him to the rear so that his presence in battle
    may rally the army. A remnant of infantry stands ready for battle, and Bhima with
    Dhrishtadyumna resists them.
  language: English
  quote_policy: quoted
