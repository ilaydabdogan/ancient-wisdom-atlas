- id: obs:3
  text: The youth studies the Vedas, behaves submissively toward the preceptor, pays
    the preceptor's fee, and returns home with knowledge of sacrifices.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'After receiving the preceptor''s permission, the Brahmana is instructed to
    adopt one of four modes of life: domesticity, Brahmacharya, forest life with the
    preceptor, or the duties of a yati.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Domesticity is called the root of the other modes of life, and a Brahmana
    is said to pay three debts by begetting children, knowing the Vedas, and performing
    sacrifices.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Brahmana is instructed to teach, study, officiate at sacrifices, offer sacrifices,
    and use specified wealth for sacrifices or gifts rather than private enjoyment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gifts are prescribed for deities, Rishis, Pitris, the preceptor, the aged,
    the diseased, the hungry, the persecuted, and those seeking knowledge.
  category: action
  evidence_refs:
  - ev:5
