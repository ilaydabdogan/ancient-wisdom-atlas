canonical_text:
  quote: ''
  summary: Vyasa turns from creation to the duties of a Brahmana, describing life-cycle
    rites, Vedic study under a preceptor, the four modes of life, householder obligations,
    sacrifice, gifts, and a catalogue of exemplary donors whose gifts or self-offerings
    lead to heaven, fame, or felicity.
  language: English
  quote_policy: summarized
