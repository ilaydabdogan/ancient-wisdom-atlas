  text: Vyasa says he has finished narrating creation and will now explain the duties
    of a Brahmana.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rituals from Jatakarma through Samavartana are said to depend on a preceptor
    competent in the Vedas.
  category: relationship
  evidence_refs:
