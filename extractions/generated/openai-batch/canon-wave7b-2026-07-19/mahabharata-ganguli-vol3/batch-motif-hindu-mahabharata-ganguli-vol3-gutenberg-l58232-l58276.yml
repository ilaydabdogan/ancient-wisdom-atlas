canonical_text:
  quote: Among creatures, therefore, which are all so transitory, only the Soul exists
    eternally.
  summary: Yudhishthira asks how decrepitude and death may be avoided. Bhishma answers
    by citing an old dialogue in which King Janaka asks the sage Panchasikha the same
    question. Panchasikha teaches that ordinary means do not halt time, that beings
    are carried along a raftless current of time where decrepitude and death devour
    all, that companions meet only temporarily, that the Soul alone is eternal, and
    that one should still make gifts and perform sacrifices without abandoning scripture.
  language: English
  quote_policy: quoted
