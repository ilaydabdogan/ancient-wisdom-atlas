canonical_text:
  quote: The uniting together of Intellect and Mind, and all the Senses, and the all-pervading
    Soul is said to be Knowledge of the foremost kind.
  summary: Vyasa tells his son that, after explaining the Sankhya answer, he will
    explain the Yoga doctrine. The passage defines highest knowledge as the union
    of intellect, mind, senses, and the all-pervading Soul; lists qualities, restraints,
    virtues, times, and places for practice; describes perception of Brahma through
    concentrated meditation; warns that yogic powers should be disregarded; and recommends
    solitary practice in mountains, near trees, caves, temples, and empty dwellings.
  language: English
  quote_policy: quoted
