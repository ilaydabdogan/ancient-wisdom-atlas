canonical_text:
  quote: ''
  summary: 'A hymn salutes an addressed deity through many forms and functions: swan,
    divine word, boar raising the submerged earth, yogic sleeper on a serpent couch,
    builder of a bridge across the sea of life, inner self sought by sages and yogins,
    world-consuming fire, child sleeping on cosmic waters, lotus-navel source of the
    universe, cosmic body, observer of deeds, time, nourishment, digestive heat, half-man
    half-lion slayer of an Asura, and Ananta upholding the world.'
  language: English
  quote_policy: summarized
