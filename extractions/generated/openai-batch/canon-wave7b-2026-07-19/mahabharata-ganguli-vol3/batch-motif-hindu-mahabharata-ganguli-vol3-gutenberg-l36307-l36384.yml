canonical_text:
  quote: Entire abstraction from all objects is Emancipation.
  summary: 'Yudhishthira asks Bhishma about Virtue, Wealth, and Pleasure: their roots,
    results, and relation to the course of life. Bhishma explains their interrelation,
    subordinates them to emancipation and self-knowledge, and cites an old discourse
    in which King Angaristha asks Rishi Kamandaka how a king''s sins may be destroyed
    and how wrongful conduct may be checked. Kamandaka warns that exclusive pursuit
    of pleasure destroys intelligence and royal order, then prescribes study, righteousness,
    Brahmana association, ablutions, mantras, banishment of the wicked, virtuous companionship,
    conciliatory speech, and obedience to seniors and preceptors.'
  language: English
  quote_policy: quoted
