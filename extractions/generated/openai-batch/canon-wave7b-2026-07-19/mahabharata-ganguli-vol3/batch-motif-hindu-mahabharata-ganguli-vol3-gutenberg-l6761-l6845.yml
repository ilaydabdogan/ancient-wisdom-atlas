canonical_text:
  quote: ''
  summary: 'Sanjaya narrates a battle scene in which Arjuna asks Krishna to drive
    toward Yudhishthira after seeing the Pandava army fleeing and Karna killing their
    warriors. Krishna drives the chariot and, while looking over the battlefield,
    describes the carnage: slain warriors, weapons, broken vehicles, dead animals,
    royal ornaments, wounded men, relatives seeking water for the dying, and combatants
    returning to battle despite grief.'
  language: English
  quote_policy: summarized
