canonical_text:
  quote: ''
  summary: Sanjaya recounts Duryodhana and allied kings ritually installing Karna
    as commander with sanctified water, ritual vessels, and a ceremonial seat. Karna
    is bathed, praised, gives wealth to Brahmanas, and receives blessings to defeat
    the Pandavas and their allies. He then orders the army arrayed at sunrise, appears
    in an ornate chariot blowing his conch, and arranges the Kaurava army in a makara
    formation with named leaders positioned in its body parts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Duryodhana and the assembled kings stand and install Karna in command of the
    army according to prescribed rites.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The investiture uses golden and earthen jars filled with mantra-sanctified
    water, animal tusks and horns, jeweled vessels, fragrant herbs and plants, and
    a silk-covered udumvara-wood seat.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Karna is bathed on the ceremonial seat and praised by Brahmanas, Kshatriyas,
    Vaishyas, and respectable Shudras.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After installation, Karna gives niskas, cows, and other wealth to Brahmanas,
    who utter blessings for him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The blessings urge Karna to vanquish or slay the Parthas, Govinda or Keshava,
    and the Pancalas, and include comparisons to the Sun and to Indra facing the Danavas.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator says Karna appears resplendent like a second Sun; Duryodhana
    regards his purpose as accomplished; Karna orders the troops arrayed at sunrise.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Before dawn, Duryodhana's sons order the troops to array themselves with joyful
    music, and the camp becomes noisy with soldiers, elephants, cars, and steeds being
    readied.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Karna appears on the field in an ornate chariot with banners, a white standard,
    crane-colored steeds, an elephant-rope device, many weapons, and a conch.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Karna blows his conch to draw out the Kaurava army and arranges the troops
    in the makara array, assigning leaders to the beak, eyes, head, neck, middle,
    feet, hind-feet, and tail.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
