canonical_text:
  quote: ''
  summary: Vaisampayana recounts Narada's devotion after hearing Nara and Narayana,
    describes Narada's thousand-year stay and return to Himavat, praises Narayana/Hari/Vishnu
    as supreme refuge and universal soul, warns against hatred of Narayana, traces
    the discourse's transmission through Narada and Vyasa, and urges the king to proceed
    with the Horse-sacrifice. Sauti then says he has recited the Narayana discourse
    to Saunaka and the Rishis, and concludes with a catalogue of Narayana's cosmic
    and protective attributes.
  language: English
  quote_policy: summarized
