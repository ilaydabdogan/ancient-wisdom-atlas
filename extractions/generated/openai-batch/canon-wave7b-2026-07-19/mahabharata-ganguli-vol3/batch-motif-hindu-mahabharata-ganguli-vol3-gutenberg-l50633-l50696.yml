canonical_text:
  quote: the assurance of harmlessness to all creatures is the highest (in point of
    merit).
  summary: An ethical speaker addresses Jajali about the subtlety of duty, the supreme
    merit of harmlessness, the cruelty involved in animal and human exploitation,
    the divine presence in living creatures, the sacred status of cattle, the story
    of Nahusha's sin after killing a cow and bull, and the speaker's equal regard
    toward injury and praise.
  language: English
  quote_policy: quoted
