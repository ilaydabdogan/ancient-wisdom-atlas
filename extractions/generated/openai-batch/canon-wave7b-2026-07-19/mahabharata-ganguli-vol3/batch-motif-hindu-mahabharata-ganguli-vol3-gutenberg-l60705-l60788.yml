canonical_text:
  quote: ''
  summary: Bhishma introduces a narrative about king Uparichara, his devotion to Narayana,
    his righteous conduct and ritual practice, and the divine favor he receives. The
    passage then describes the seven Rishis on Meru composing an authoritative treatise
    on duties after long penance to Narayana; Saraswati enters them at Narayana's
    command, and Narayana approves the completed work as authoritative for the worlds.
  language: English
  quote_policy: summarized
