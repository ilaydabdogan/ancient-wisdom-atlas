    his devotion; Uparichara regards all possessions as obtained from Narayana and
    offers them to that deity.
  source_text_path: texts/public-domain/hindu/project-gutenberg/mahabharata-ganguli-vol3.md
  rights_note: Public domain source; summary supplied.
- id: ev:6
  type: summary
  locator: 60741-60749
  quote_or_summary: Uparichara discharges sacrificial acts under the Sattwata ritual;
    Brahmanas versed in Pancharatra eat first the food offered to Narayana, and the
    king's righteous rule is without falsehood, evil thought, or bodily sin.
  source_text_path: texts/public-domain/hindu/project-gutenberg/mahabharata-ganguli-vol3.md
  rights_note: Public domain source; summary supplied.
- id: ev:7
  type: summary
  locator: 60749-60759
  quote_or_summary: Seven Rishis—Marichi, Atri, Angiras, Pulastya, Pulaha, Kratu,
    and Vasishta—called Chitra-sikhandins, unite on Mount Meru and promulgate a treatise
    on duties and observances consistent with the four Vedas.
  source_text_path: texts/public-domain/hindu/project-gutenberg/mahabharata-ganguli-vol3.md
  rights_note: Public domain source; summary supplied.
- id: ev:8
  type: summary
  locator: 60759-60768
  quote_or_summary: The Chitra-sikhandins are identified with seven Pravritti elements,
    the Self-born Manu with original Prakriti, and the eight are said to uphold the
    universe and know past, present, and future.
  source_text_path: texts/public-domain/hindu/project-gutenberg/mahabharata-ganguli-vol3.md
  rights_note: Public domain source; summary supplied.
- id: ev:9
  type: summary
  locator: 60768-60778
  quote_or_summary: The Rishis create worlds and the science of morality and duty;
    their treatise covers Religion, Wealth, Pleasure, Emancipation, and restrictions
    for Earth and Heaven.
  source_text_path: texts/public-domain/hindu/project-gutenberg/mahabharata-ganguli-vol3.md
  rights_note: Public domain source; summary supplied.
- id: ev:10
  type: summary
  locator: 60778-60788
  quote_or_summary: After worshipping Narayana with penances for a thousand celestial
    years, the Rishis receive Saraswati into their persons at Narayana's command for
    the good of the worlds.
  source_text_path: texts/public-domain/hindu/project-gutenberg/mahabharata-ganguli-vol3.md
  rights_note: Public domain source; summary supplied.
- id: ev:11
  type: summary
  locator: 60788-60788
  quote_or_summary: Through Saraswati's entrance the Rishis compose the treatise in
    vocables, import, and reason; it is sanctified with Om and first read to Narayana,
    who is pleased.
  source_text_path: texts/public-domain/hindu/project-gutenberg/mahabharata-ganguli-vol3.md
  rights_note: Public domain source; summary supplied.
- id: ev:12
  type: summary
  locator: 60788-60788
  quote_or_summary: Narayana speaks in an incorporeal voice, praises the one-hundred-thousand-verse
    treatise, and says duties and observances of all worlds will flow from it.
  source_text_path: texts/public-domain/hindu/project-gutenberg/mahabharata-ganguli-vol3.md
  rights_note: Public domain source; summary supplied.
- id: ev:13
  type: summary
  locator: 60788-60788
  quote_or_summary: Narayana declares that he created Brahman from Grace, Rudra from
    Wrath, the Rishis, Surya, Chandramas, Wind, Earth, Water, Fire, stars, planets,
    constellations, creatures, and utterers of Brahma.
  source_text_path: texts/public-domain/hindu/project-gutenberg/mahabharata-ganguli-vol3.md
  rights_note: Public domain source; summary supplied.
- id: ev:14
  type: summary
  locator: 60788-60788
  quote_or_summary: Narayana commands that the treatise be treated as a highest authority
    and says Manu, Usanas, and Vrihaspati will use it to declare or promulgate duties
    and teachings.
  source_text_path: texts/public-domain/hindu/project-gutenberg/mahabharata-ganguli-vol3.md
  rights_note: Public domain source; summary supplied.
