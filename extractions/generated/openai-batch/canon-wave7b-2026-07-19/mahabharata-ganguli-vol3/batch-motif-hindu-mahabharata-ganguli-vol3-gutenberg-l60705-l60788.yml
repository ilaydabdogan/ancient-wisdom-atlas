candidate_motifs:
- id: motif:1
  label: divine boon confers kingship
  taxonomy_refs:
  - royal_legitimacy
  basis: Uparichara's sovereignty over the world is attributed to a boon from Narayana,
    and his rule is tied to devotion and righteous conduct.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage states the boon and sovereignty but does not narrate the circumstances
    of obtaining the boon.
- id: motif:2
  label: ritual hierarchy of offerings and remnants
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: Uparichara worships Narayana, then other sacred recipients and dependents,
    and eats only what remains after offerings are distributed.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage describes sacrificial observances and offerings, but the exact
    sacrificial rite is not fully detailed in this excerpt.
- id: motif:3
  label: devotion rewarded by divine intimacy
  taxonomy_refs:
  - divine_beloved
  basis: Indra shares his own seat and bed with Uparichara after beholding the king's
    devotion to Narayana.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The favor is from Indra in response to devotion to Narayana; the passage
    does not present a romantic or marital beloved pattern.
- id: motif:4
  label: sages compose sacred law on a cosmic mountain
  taxonomy_refs:
  - cosmic_mountain
  - world_center
  - wisdom
  basis: The seven Rishis unite on Meru, called the foremost of mountains, and promulgate
    a treatise on duties and observances consistent with the Vedas.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: Meru's broader world-center symbolism is not elaborated in the excerpt,
    though it is the setting for authoritative cosmological teaching.
- id: motif:5
  label: divinely inspired speech produces authoritative scripture
  taxonomy_refs:
  - wisdom
  basis: Narayana commands Saraswati to enter the Rishis, after which they compose
    a foremost treatise; Narayana then declares it authoritative for all worlds.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  - ev:14
  confidence: high
  cautions: The text emphasizes divine authorization and speech-inspiration rather
    than a human quest for wisdom.
- id: motif:6
  label: cosmic beings establish moral order
  taxonomy_refs:
  - wisdom
  basis: The Rishis and Manu are described as upholding the universe, creating worlds,
    and creating the science of morality and duty that governs those worlds.
  evidence_refs:
