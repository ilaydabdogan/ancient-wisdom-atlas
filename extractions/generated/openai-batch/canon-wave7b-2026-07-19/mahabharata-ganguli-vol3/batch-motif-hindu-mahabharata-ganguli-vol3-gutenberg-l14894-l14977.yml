canonical_text:
  quote: ''
  summary: Sanjaya narrates a renewed and destructive battle between the Kuru and
    Pandava forces. Yudhishthira is surrounded and rescued; great slaughter follows.
    Portents appear, including a trembling earth, falling meteors, a hurricane, and
    weeping elephants. Shakuni announces a rear attack, strikes the Pandava army from
    behind with horsemen, and Yudhishthira sends Sahadeva and allied forces to kill
    him.
  language: English
  quote_policy: summarized
