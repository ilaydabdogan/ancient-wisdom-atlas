canonical_text:
  quote: ''
  summary: Bhishma recounts how Vrihaspati’s anger is pacified, after which Ekata,
    Dwita, and Trita narrate their northern ascetic quest to behold Narayana. An incorporeal
    voice directs them to White Island beyond the Ocean of Milk, where white, sense-transcending
    devotees worship one God. The rishis are blinded and deprived of senses by divine
    energy, hear worship and hymns to Hari/Narayana, and perceive ritual signs but
    cannot directly see the deity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vasu and the Sadasyas try to pacify Vrihaspati and say that anger is improper
    in the Krita age; they also say the deity can be seen only by one to whom he becomes
    gracious.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ekata, Dwita, and Trita identify themselves as sons of Brahman, begotten by
    his will, and say they traveled north for their highest good.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The three rishis undergo long penances, including standing on one foot, north
    of the mountains of Meru on the shores of the Ocean of Milk, in order to behold
    Narayana.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: An incorporeal voice praises their penance and directs them to White Island
    on the northern shore of the Ocean of Milk, saying that Narayana has revealed
    himself there.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The inhabitants of White Island are described as moon-white, devoted to Narayana,
    worshippers of one God, without ordinary food, with winkless eyes and fragrant
    bodies.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: When the rishis arrive at White Island, they initially see nothing because
    their vision is blinded by the energy of the great deity.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The rishis infer that more penance is needed and undertake another hundred
    years of austerity.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After completing their vows, the rishis see auspicious white men with joined
    hands, some facing north and some east, engaged in silent mental worship.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Each inhabitant emits great effulgence, the island is perceived as a home
    of energy, and the inhabitants are said to be equal in energy.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: A light like the concentrated effulgence of a thousand suns appears; the inhabitants
    run toward it with joined hands, uttering “Namas,” and a loud sound like sacrificial
    worship is heard.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The rishis are deprived of vision, strength, and senses by divine energy,
    and they hear a hymn saluting the lotus-eyed creator, Hrishikesa, foremost being,
    and first-born.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: A fragrant pure breeze bearing perfumes of celestial flowers, herbs, and plants
    blows while the devotees worship with mind, word, and deed according to Pancharatra
    ordinances.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:13
  text: The narrator states that Hari appeared where the sound arose, but the rishis,
    stupefied by his illusion, could not see him.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: After the breeze ceases and the sacrifice is over, the rishis are anxious;
    the inhabitants do not honor them with a glance or nod.
  category: sequence
  evidence_refs:
  - ev:12
