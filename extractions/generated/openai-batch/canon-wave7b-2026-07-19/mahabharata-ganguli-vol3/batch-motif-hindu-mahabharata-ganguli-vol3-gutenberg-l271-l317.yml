canonical_text:
  quote: ''
  summary: After hearing grievous intelligence, Dhritarashtra believes Suyodhana to
    be already dead, collapses, and is joined by lamenting royal women. Sanjaya and
    Vidura comfort the grieving household, with Vidura sprinkling water on the king.
    Dhritarashtra asks Sanjaya whether Duryodhana has gone to Yama's abode and requests
    a truthful account of the living and dead. Sanjaya reports that Vaikartana and
    Duhshasana have been slain, and that Bhimasena drank Duhshasana's blood in battle.
  language: English
  quote_policy: summarized
