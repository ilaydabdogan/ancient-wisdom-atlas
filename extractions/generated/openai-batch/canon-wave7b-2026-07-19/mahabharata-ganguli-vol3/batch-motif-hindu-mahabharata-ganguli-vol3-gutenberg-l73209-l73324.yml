  summary: 'The passage consists of translator’s footnotes explaining words, interpretations,
    and doctrinal points: righteousness, duties, afterlife felicity, the Soul as witness,
    yogic detachment from the body, self-knowledge, Moksha, repeated rebirths, symbolic
    images of passions as wolves and golden trees as an omen of death, personified
    Time casting beings according to acts, and the formal acquisition of the Vedas
    by Suka despite their coming to him spontaneously.'
