canonical_text:
  quote: ''
  summary: A speaker addresses Dhananjaya/Partha, recounting the falls of Bhishma,
    Drona, and Jayadratha, describing the Kaurava host as nearly destroyed, naming
    five remaining great car-warriors, and urging Partha to slay Karna in particular.
    The exhortation invokes divine battle analogies involving Vritra and Vasava, Sakra
    and the Asuras, and Vishnu/Hari slaying Daityas and Danavas and bestowing sovereignty
    on Sakra. The speaker also recalls Karna’s role in prior injuries and in the killing
    of Abhimanyu.
  language: English
  quote_policy: summarized
