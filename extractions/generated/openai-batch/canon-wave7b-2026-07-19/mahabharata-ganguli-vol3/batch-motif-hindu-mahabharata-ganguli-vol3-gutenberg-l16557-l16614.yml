canonical_text:
  quote: ''
  summary: Sanjaya narrates Rama/Valadeva's arrival at the field before a mace encounter
    between his two disciples, Duryodhana and Bhimasena/Vrikodara. Rama is welcomed
    and worshipped by the Pandavas, Keshava, the combatants, and other kings; he says
    he has returned after forty-two days and wishes to witness the encounter. After
    mutual salutations, Rama sits among the kings, and the dreadful duel begins. In
    the frame dialogue, Janamejaya recalls Rama's earlier departure from Dwaraka and
    his declaration of neutrality, then asks to hear about his return.
  language: English
  quote_policy: summarized
