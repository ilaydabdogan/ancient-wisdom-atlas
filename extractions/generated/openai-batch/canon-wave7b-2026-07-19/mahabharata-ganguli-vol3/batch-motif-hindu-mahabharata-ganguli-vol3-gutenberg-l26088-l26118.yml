canonical_text:
  quote: Upon this, two hands, resembling two lotuses, appeared at the extremities
    of his stumps.
  summary: Vyasa recounts that a king cuts off Likhita's hands as punishment. Sankha
    sends Likhita to the river Vahuda to perform water oblations; after ablution and
    the water-rite, Likhita's hands reappear. Sankha attributes the event to penances
    and Providence, and Vyasa uses the episode to teach that chastisement and ruling
    are duties of Kshatriyas.
  language: English
  quote_policy: quoted
