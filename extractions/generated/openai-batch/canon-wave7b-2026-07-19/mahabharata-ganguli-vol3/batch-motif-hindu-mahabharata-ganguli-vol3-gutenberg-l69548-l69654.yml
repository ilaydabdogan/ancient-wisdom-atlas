canonical_text:
  quote: ''
  summary: 'Footnotes explaining philosophical terms and images: the wheel of Time
    and sacred lunations; Brahma as Sushupti or dreamless unconsciousness from which
    the universe flows; Jiva, deities, prana, and senses in relation to that unconsciousness;
    memory, passions, mind, understanding, gunas, Atman, Yoga, and the transcendence
    of duality.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who understands the wheel of Time is described as worthy of universal
    regard; the wheel's excellent joints are identified with parva days, sacred lunations
    on which rites are performed.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Brahma is explained as Sushupti, dreamless unconsciousness, and the universe
    is said to flow from Brahma.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Jiva is described as finding a place within unconsciousness in gross and subtle
    form and gratifying the deities, prana, and senses; these then gratify the open
    mouth of original unconsciousness that waits to receive or swallow them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Loss of smriti is explained as confusion of right and wrong, and self-surrender
    is glossed as surrender to one's passions.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kalanjara is glossed either as the name of a mountain, implying immovability,
    or as one who destroys the effect of Time and subdues Time.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Purification is explained as transcending consciousness of duality; living
    in one's true nature is explained as merging everything into the Soul.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The note distinguishes the Jiva-soul from the Supreme Soul in its explanation
    of the word atman.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Adhyatma is defined as a topic concerning the Soul and is said here to signify
    twenty-seven topics of philosophical discourse, including organs, mind, vital
    breaths, elementary substances, desire, acts, and avidya.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: Mind, Understanding, and Nature are described as arising from their own previous
    states, with Nature especially said to result from desires in a past state of
    existence.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The senses and mind are explained as forms of the understanding, and the objects
    apprehended by them are also identified with the understanding.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Rajas, Tamas, and Sattwa arise from counterparts in a previous state of existence,
    and Chitta, sense objects, and senses are affected by these three gunas.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Understanding can transcend Sattwa, Rajas, and Tamas by Yoga.
  category: action
  evidence_refs:
  - ev:10
