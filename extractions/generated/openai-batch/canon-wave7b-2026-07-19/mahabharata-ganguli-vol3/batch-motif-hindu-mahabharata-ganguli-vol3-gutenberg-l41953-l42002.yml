canonical_text:
  quote: Indeed, in consequence of the loss of his two bulls Manki attained to immortality.
  summary: Manki reflects that wealth and desire produce fear, sorrow, and dissatisfaction.
    He personifies Desire as an enemy, vows to renounce it, embraces forgiveness,
    contentment, self-restraint, truth, and compassion, and says that abandoning thirst
    brings greater happiness than ordinary or heavenly pleasures. By cutting off desire
    after losing his two bulls, he attains Brahma and immortality.
  language: English
  quote_policy: quoted
