canonical_text:
  quote: the king, that ruler of men, is a god
  summary: In a frame dialogue, Yudhishthira asks why Brahmanas say the king is a
    god. Bhishma cites the old discourse of Vrihaspati to Vasumanas, king of Kosala.
    Vasumanas approaches the sage with humility, asks about the ordinances of a kingdom
    for human welfare, and asks how creatures grow and are destroyed and whom to adore
    for eternal happiness. Vrihaspati answers by discoursing on the respect due to
    kings.
  language: English
