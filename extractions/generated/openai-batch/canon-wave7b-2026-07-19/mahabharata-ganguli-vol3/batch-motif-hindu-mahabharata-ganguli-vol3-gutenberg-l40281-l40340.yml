- id: obs:1
  text: Yudhishthira asks Bhishma to explain the sources of wrath, lust, sorrow, loss
    of judgment, inclination to evil, jealousy, malice, pride, envy, slander, incapacity
    to bear others' good, unkindness, and fear.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma calls the thirteen vices powerful foes of all creatures that approach,
    tempt, goad, and afflict heedless or insensate persons.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bhishma compares the vices' assault on a person to wolves jumping upon prey.
  category: other
  evidence_refs:
