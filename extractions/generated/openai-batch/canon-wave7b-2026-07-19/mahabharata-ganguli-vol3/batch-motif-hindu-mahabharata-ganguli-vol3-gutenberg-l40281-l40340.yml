- id: obs:4
  text: Bhishma says all kinds of grief and sin proceed from these vices.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Anger is said to spring from covetousness, be strengthened by the faults of
    others, remain dormant through forgiveness, and disappear through forgiveness.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Lust is said to spring from resolution, be strengthened by indulgence, and
    die when a wise person resolutely turns away from it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Envy is said to proceed from wrath and covetousness, also from seeing others'
    faults, and to disappear through compassion, self-knowledge, disregard for worldly
    objects, and true knowledge.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Loss of judgment is said to originate in ignorance and sinful habit, and to
    hide when the afflicted person delights in the company and counsel of wise men.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The desire for diverse kinds of action is said to spring from seeing conflicting
    scriptures and to be allayed by true knowledge.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Grief is said to proceed from affection awakened by separation and to subside
    when one learns that the dead do not return.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Incapacity to bear other people's good is said to proceed from wrath and covetousness
    and to be extinguished by compassion for every creature and disregard for earthly
    objects.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: Malice is said to proceed from abandonment of truth and indulgence in wickedness,
    and to disappear through waiting upon the wise and good.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:13
  text: Pride is said to spring from birth, learning, and prosperity, and to disappear
    when those three are truly known.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:14
  text: Jealousy is said to spring from lust and delight in low and vulgar people,
    and to be destroyed by wisdom.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:15
  text: Slander is said to arise from conduct errors and disagreeable speeches expressive
    of aversion, and to disappear upon a survey of the whole world.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:16
  text: Hate is said to show itself when the injurer is powerful and the injured person
    cannot avenge the injury, and to subside through kindliness.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:17
  text: Compassion is said to proceed from seeing helpless and miserable persons and
    to disappear when one understands the strength of virtue.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:18
  text: Covetousness is said to spring from ignorance and to be destroyed by seeing
