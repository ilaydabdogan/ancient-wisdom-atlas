canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma to explain the sources of many vices. Bhishma
    describes thirteen vices as powerful foes of creatures, gives their origins and
    remedies, says tranquillity of soul subdues them, and contrasts the sons of Dhritarashtra,
    who were stained by them, with Yudhishthira, who conquered them through regard
    for seniors.
  language: English
  quote_policy: summarized
