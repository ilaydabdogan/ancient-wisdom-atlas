canonical_text:
  quote: ''
  summary: 'Translator''s and commentator''s notes explain doctrinal terms and practices:
    disputational schools, unity with the universe, scriptural interpretation, yoga
    disciplines, renunciation, Veda as sound-Brahma, Garbhadhana and Vedic formation
    of the body, righteous giving, scriptural alternatives, identity with Brahma,
    four modes of life, and the fourth state of consciousness reached by Samadhi.'
  language: English
