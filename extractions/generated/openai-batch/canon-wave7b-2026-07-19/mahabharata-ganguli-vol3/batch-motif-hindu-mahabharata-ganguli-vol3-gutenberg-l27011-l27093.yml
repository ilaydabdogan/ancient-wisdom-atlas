canonical_text:
  quote: ''
  summary: Krishna recounts how the Rishis Narada and Parvata left heaven for earth,
    made a compact to disclose all wishes, and stayed with King Srinjaya. Narada secretly
    became attached to Srinjaya's daughter Sukumari. Parvata discovered the concealed
    desire and cursed Narada to marry her while appearing as an ape; Narada retaliated
    by cursing Parvata not to reach heaven. Narada married Sukumari, who remained
    devoted despite his altered appearance. Later Narada and Parvata met in a forest,
    released each other from their curses, and Narada's form was restored; Sukumari
    was reassured of his identity, Parvata went to heaven, and Narada went home.
  language: English
  quote_policy: summarized
