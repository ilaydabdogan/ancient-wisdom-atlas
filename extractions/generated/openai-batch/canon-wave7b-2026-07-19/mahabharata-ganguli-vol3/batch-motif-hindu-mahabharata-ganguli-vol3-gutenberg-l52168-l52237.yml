canonical_text:
  quote: ''
  summary: Yudhishthira asks how a person becomes sinful, gains virtue, attains renunciation,
    and wins emancipation. Bhishma answers by tracing desire from sense-objects into
    attachment, greed, hypocrisy, and sinful action, then contrasts this with righteousness
    grounded in others' good, wise companionship, restraint, knowledge, renunciation,
    and final emancipation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yudhishthira asks by what means a person becomes sinful, achieves virtue,
    attains renunciation, and wins emancipation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma says Yudhishthira already knows duties and asks for confirmation,
    then says he will explain emancipation, renunciation, sin, and virtue at their
    roots.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bhishma states that perception of the five objects—form, taste, scent, sound,
    and touch—first gives rise to desire, and then to desire or aversion toward what
    is liked or disliked.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bhishma describes a sequence in which striving for pleasing sense-objects
    leads to attachment, aversion, greed, errors of judgment, and loss of orientation
    toward virtue.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sinful person is described as using hypocrisy to pursue virtue and wealth,
    then committing sin in thought, speech, and action despite admonitions from well-wishers
    and the wise.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Good people perceive the sinful person's wickedness, while people of a similar
    disposition form friendship with him; Bhishma says he does not gain happiness
    here or hereafter.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The righteous person seeks the good of others, practices duties that benefit
    others, learns from good people, and makes progress in virtue through habit and
    companionship.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The righteous person desires wealth only by righteous means and is said to
    gain good friends, wealth, children, and happiness here and hereafter.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Bhishma states that mastery over sound, touch, taste, form, and scent is the
    fruit of virtue.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: After obtaining the fruit of virtue, the person is led by the eye of knowledge
    toward renunciation and ceases to take pleasure in sense gratification.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Seeing all worlds as liable to destruction, the person strives to cast off
    virtue's heavenly rewards, abandons sinful acts, takes up renunciation, and attains
    emancipation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Bhishma closes by telling Yudhishthira to adhere to virtue in all situations
    and says that success from righteousness is eternal.
  category: speech
  evidence_refs:
  - ev:7
