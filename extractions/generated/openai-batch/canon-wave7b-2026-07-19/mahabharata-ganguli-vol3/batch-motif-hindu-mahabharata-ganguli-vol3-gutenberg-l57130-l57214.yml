canonical_text:
  quote: ''
  summary: Vasishtha instructs a ruler on the relation among Jiva, Prakriti, and the
    Supreme Soul. Jiva, under illusion and attributes, mistakes forms as real and
    fails to know the Supreme Soul. Through understanding Prakriti as distinct and
    recognizing the twenty-sixth principle, Jiva casts off attributes, loses multifariousness,
    resumes oneness, and becomes identified in nature with the Supreme Soul. The teaching
    ends with analogies such as gnat and Udumvara, and fish and water, to illustrate
    difference and oneness.
  language: English
  quote_policy: summarized
