canonical_text:
  quote: The worship of mother, father, and preceptor is most important according
    to me.
  summary: Bhishma instructs Yudhishthira that mother, father, and preceptor must
    be worshipped, obeyed, served, and never insulted or injured. He identifies them
    with the three worlds, Vedas, and sacred fires, associates service to each with
    spiritual rewards, and treats disrespect or failure to support them as a grave
    sin.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Bhishma addresses Yudhishthira and states that worship of mother, father,
    and preceptor is most important.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage instructs that commands from mother, father, and preceptor should
    be done, while acts forbidden by them should not be done.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mother, father, and preceptor are identified as the three worlds, three modes
    of life, three Vedas, and three sacred fires.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The father is identified with the Garhapatya fire, the mother with the Dakshina
    fire, and the preceptor with the fire upon which libations are poured.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Serving the father, mother, and preceptor is said to lead respectively to
    crossing this world, attaining felicitous regions in the next, and obtaining the
    region of Brahma.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage instructs one not to eat before these three seniors, not to eat
    anything better than what they eat, and not to impute fault to them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Honouring these three is said to bring honour in all worlds, while disregarding
    them is said to prevent merit and fame.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Bhishma says that what he has given away in honour of the three has multiplied
    many times and that, by that merit, the three worlds are before his eyes.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage states a hierarchy of reverence in which an Acharya exceeds ten
    Veda-learned Brahmanas, an Upadhyaya exceeds ten Acharyas, the father exceeds
    ten Upadhyayas, and the mother exceeds ten fathers or perhaps the whole world.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Bhishma nevertheless says the preceptor deserves greater reverence than father
    or mother because parents create the body, while the preceptor gives a heavenly,
    undecaying, immortal life.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage says father and mother should never be slain even if they offend,
    and that reverently cherishing even sinful fathers receives divine and Rishi favour.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: A person who gives true instruction, communicates the Vedas, and gives immortal
    knowledge is to be regarded as both father and mother.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: The disciple is instructed never to injure the instructor and to show reverence
    in thought and deed.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Failure to reverence preceptors, injury to preceptors or parents, and failure
    by an adult son to support his parents are each compared to the sin of killing
    a foetus.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:15
  text: Pleasing father, mother, and preceptor is said to please Prajapati, the earth,
    and Brahma respectively.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:16
  text: 'The passage lists four persons said never to cleanse themselves: one who
    injures a friend, one who is ungrateful, one who slays a woman, and one who slays
    a preceptor.'
  category: speech
  evidence_refs:
  - ev:16
