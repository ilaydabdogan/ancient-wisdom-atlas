canonical_text:
  quote: ''
  summary: A vulture and a jackal give opposing advice to grieving kinsmen at a cremation-ground
    wilderness where a dead child lies. Both animals are later said to be hungry and
    self-interested. The kinsmen wait in grief. Sankara, urged by Uma, arrives compassionately;
    the kinsmen ask him to restore the child, and Sankara uses water to grant the
    child a hundred years of life and appeases the hunger of the vulture and jackal.
    The kinsmen return home joyful with the restored child, and the narrator draws
    a lesson about hope, resolution, and Sankara's grace.
  language: English
  quote_policy: summarized
