  quote: ''
  summary: A concluding statement links future felicity to merit. Section CXXI opens
    with Yudhishthira addressing his grandsire after a discourse on kingly duties.
    He states that Chastisement appears to be lord of everything, present everywhere,
    foremost among beings, and the support of the entire mobile and immobile universe.
    He asks what Chastisement is, including its form, nature, origin, splendour, vigilance,
    dependence, and course.
