canonical_text:
  quote: ''
  summary: Sanjaya reports Keshava addressing Arjuna as Arjuna advances to battle
    resolved to slay Karna. Keshava recounts the seventeenth day of war, the destruction
    of forces on both sides, Arjuna's protective and decisive role for the Pandavas
    and their allies, Bhima's slaying of elephants and warriors, and Bhishma's earlier
    devastating slaughter of the Pandava army before the Pandavas rushed against him.
