  quote: '"Abandoning all worldly pleasures, I shall betake myself to that path which
    is trod by the righteous."'
  summary: Yudhishthira tells Arjuna that he will abandon worldly pleasures and follow
    a righteous path of forest life, austerity, mendicancy, non-injury, inward contemplation,
    equanimity, and release from attachment. He also describes karmic consequence
    and the wheel of life as reasons to leave the worldly course.
