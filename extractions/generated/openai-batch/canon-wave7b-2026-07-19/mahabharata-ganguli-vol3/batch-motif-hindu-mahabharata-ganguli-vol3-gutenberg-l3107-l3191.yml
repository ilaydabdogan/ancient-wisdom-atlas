canonical_text:
  quote: '"Without slaying Partha in battle I will not come back"'
  summary: At dawn Karna approaches Duryodhana and vows to confront Arjuna. He describes
    his bow Vijaya and its divine lineage, compares his and Arjuna's equipment, acknowledges
    Krishna and Arjuna's celestial car as advantages, asks that Shalya become his
    charioteer, requests supplies of arrows and cars, and receives Duryodhana's approval.
  language: English
  quote_policy: quoted
