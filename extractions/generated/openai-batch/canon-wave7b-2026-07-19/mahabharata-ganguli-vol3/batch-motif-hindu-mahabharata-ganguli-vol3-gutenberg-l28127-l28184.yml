canonical_text:
  quote: ''
  summary: After Yudhishthira regains and is installed in his kingdom, he joins his
    hands and addresses Krishna in court. He credits Krishna's grace and power for
    the restoration, praises Krishna as the one refuge, creator, cosmic source, sacrifice,
    and many divine and natural forms, and salutes his weapons. Krishna is pleased
    and responds to Yudhishthira with agreeable speeches.
  language: English
  quote_policy: summarized
