canonical_text:
  quote: ''
  summary: Arjuna, responding to Yudhishthira, recounts an old history about King
    Janaka of Videha abandoning his kingdom for mendicancy. Janaka's queen privately
    rebukes him, arguing that his renunciation neglects royal, familial, ritual, and
    social obligations; she contrasts true inward detachment with outward mendicant
    signs and emphasizes the householder's role in sustaining mendicants and the pious
    through food and gifts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After Yudhishthira becomes silent, Arjuna, afflicted by the king's speech,
    addresses his eldest brother and introduces an old history.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old history concerns the ruler of the Videhas and his queen, and is framed
    around words spoken by the ruler's grief-stricken spouse after he resolved to
    abandon his kingdom and live as a mendicant.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: King Janaka casts off wealth, children, wives, possessions, the established
    path for acquiring religious merit, and fire; he shaves his head and assumes a
    mendicant form.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Janaka's spouse beholds him as deprived of wealth, committed to a mendicant
    vow, committed to non-injury, free from vanity, and prepared to live on fallen
    barley grains picked from fields.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The queen privately approaches Janaka and asks why he has adopted mendicancy
    after abandoning a wealthy, grain-filled kingdom.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The queen argues that a handful of barley cannot satisfy guests, gods, Rishis,
    Pitris, or the Brahmanas whom Janaka formerly supported.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The queen says Janaka has made his mother sonless and his wife a widow, and
    that dependent Kshatriyas have placed their hopes on him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The queen describes Janaka's former role through images of a sacred lake and
    a mighty sheltering tree, and contrasts this with his present waiting upon others.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'The queen names mendicant objects and conditions: an earthen pot, a triple-headed
    stick, abandonment of clothes, and acceptance of only a handful of barley.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The queen reasons that if kingdom and barley are equal to Janaka, there is
    no reason to abandon the kingdom; if barley is an attachment, his resolution to
    abandon everything fails.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The queen urges Janaka to rule the Earth if he is inclined to grace, and says
    poor and friendless people may adopt renunciation, but a king abandoning palaces
    and wealth to imitate them acts improperly.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The queen contrasts those who accept gifts with those who give gifts, and
    compares an ineffective gift to clarified butter poured on a forest-conflagration.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The queen says food given by a charitable person supports the pious, that
    the giver of food is the giver of life, and that mendicants depend upon householders.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The queen distinguishes a true mendicant, who sincerely renounces worldly
    possessions and pleasures, from people who merely shave their heads and wear brown
    robes while remaining bound by ties.
  category: attribute
  evidence_refs:
  - ev:8
