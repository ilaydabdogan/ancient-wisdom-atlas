canonical_text:
  quote: Wisdom is the refuge of creatures.
  summary: Bhishma praises wisdom and introduces an old discourse between Indra and
    Kasyapa. A prosperous Vaisya negligently knocks down Kasyapa, who despairingly
    resolves to cast off his life. Indra appears in the form of a jackal and counsels
    Kasyapa not to abandon life, emphasizing the rarity of human and Brahmana birth,
    the value of having hands, the suffering of lower orders of existence, and the
    futility of ever-expanding desire.
  language: English
  quote_policy: quoted
