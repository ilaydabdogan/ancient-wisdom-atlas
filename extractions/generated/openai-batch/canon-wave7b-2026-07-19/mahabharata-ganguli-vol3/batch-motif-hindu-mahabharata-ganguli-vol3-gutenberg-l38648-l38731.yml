canonical_text:
  quote: ''
  summary: A Chandala and Viswamitra debate whether a starving Brahmana may take and
    eat a dog's haunch, treated as unclean food. Viswamitra argues that preserving
    his body and sacred life justifies the act and permits later purification through
    virtue. The Chandala repeatedly warns that the act is sinful, contrary to proper
    conduct and moral distinctions, and may bring afterlife punishment and repentance.
  language: English
  quote_policy: summarized
