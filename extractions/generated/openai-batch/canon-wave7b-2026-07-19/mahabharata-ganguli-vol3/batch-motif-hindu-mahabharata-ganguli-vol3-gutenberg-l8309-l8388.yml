canonical_text:
  quote: ''
  summary: Sanjaya narrates a scene in which Arjuna, ashamed after harshly addressing
    Yudhishthira, lays down his weapons, apologizes, and promises to go against Karna
    and rescue Bhima. Yudhishthira, grieved and self-accusing, says Arjuna may cut
    off his head and declares his wish to retire to the woods and let Bhima rule.
    Krishna explains that Arjuna's insulting words were meant to preserve his vow
    concerning Gandiva without killing Yudhishthira, asks forgiveness for himself
    and Arjuna, and promises Karna's death. Yudhishthira accepts Krishna's explanation
    and says Krishna's intelligence has rescued them from calamity like a raft across
    an ocean of sorrow. Krishna then counsels Arjuna to comfort Yudhishthira before
    fighting Karna, and Arjuna touches Yudhishthira's feet and asks forgiveness.
  language: English
  quote_policy: summarized
