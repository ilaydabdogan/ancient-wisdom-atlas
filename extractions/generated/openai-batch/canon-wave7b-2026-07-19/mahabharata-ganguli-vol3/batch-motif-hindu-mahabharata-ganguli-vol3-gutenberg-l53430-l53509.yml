canonical_text:
  quote: ''
  summary: Bhishma recounts how Parvati grieved over a disgrace, Mahadeva went to
    Daksha's sacrifice with terrible followers, and the sacrifice was destroyed. The
    embodied Sacrifice fled as a deer, Mahadeva's wrath produced a sweat drop that
    became a world-ending-like fire, and from that fire emerged a dreadful being who
    consumed Sacrifice. Brahman obtained a share of offerings for Mahadeva, named
    the being Fever, and asked that its concentrated energy be divided. Mahadeva distributed
    Fever into many forms among animals, landscape features, ailments, and human life-events.
    The passage also connects Fever with Vritra's defeat by Sakra and states that
    attentive reading of the origin of Fever brings freedom from disease and happiness.
  language: English
  quote_policy: summarized
