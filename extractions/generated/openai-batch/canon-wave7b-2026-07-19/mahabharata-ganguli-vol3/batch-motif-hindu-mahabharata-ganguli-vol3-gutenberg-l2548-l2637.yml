canonical_text:
  quote: ''
  summary: In a battlefield sequence, Subala's son routs Pandava divisions. Kripa
    checks and overwhelms Dhrishtadyumna, whose charioteer withdraws him toward Arjuna
    or Bhimasena while Kripa pursues. Kritavarma duels Shikhandi, wounds him severely,
    and Shikhandi's driver removes him from the fight; afterward the Pandava army
    flees.
  language: English
  quote_policy: summarized
