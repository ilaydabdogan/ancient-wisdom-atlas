canonical_text:
  quote: ''
  summary: 'The passage teaches that sinful acts lead to hell, while one who remains
    faithful to ordained duties has the scriptures as an eye. Sensory pleasures are
    described as brief and followed by pain; the wise cultivate tranquillity and self-restraint
    to attain Emancipation. Householders may enjoy possessions obtained without effort
    but should exert themselves in scriptural duties, sacrifices, and rites. The passage
    concludes with an analogy: as rivers find refuge in the ocean, people of other
    orders find refuge in the householder.'
  language: English
  quote_policy: summarized
