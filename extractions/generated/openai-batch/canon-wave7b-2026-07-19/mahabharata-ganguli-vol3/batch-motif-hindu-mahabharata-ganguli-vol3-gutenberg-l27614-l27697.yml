canonical_text:
  quote: ''
  summary: Vyasa introduces an old discourse in which ascetics ask Manu about duties,
    food, gifts, study, penance, and proper conduct. Manu answers by naming cleansing
    practices and places, listing characteristics of virtue, distinguishing virtue
    and sin by circumstance and consequence, describing expiations for certain actions,
    explaining the relation of action and inaction to rebirth and emancipation, and
    giving food restrictions for Brahmanas.
  language: English
  quote_policy: summarized
