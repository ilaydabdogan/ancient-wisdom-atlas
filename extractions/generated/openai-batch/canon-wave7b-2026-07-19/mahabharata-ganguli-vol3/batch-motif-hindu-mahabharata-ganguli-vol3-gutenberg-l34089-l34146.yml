canonical_text:
  quote: ''
  summary: 'Yudhishthira asks what qualities, conduct, form, equipment, and arms make
    combatants fit for battle. Bhishma answers with practical military guidance: warriors
    should use familiar weapons and vehicles; different regional groups excel at different
    modes of combat; bodily features, voices, gait, temper, and animal-like traits
    indicate various kinds of battle aptitude; fierce troops from outlying districts
    should be placed in the vanguard because they do not retreat.'
  language: English
  quote_policy: summarized
