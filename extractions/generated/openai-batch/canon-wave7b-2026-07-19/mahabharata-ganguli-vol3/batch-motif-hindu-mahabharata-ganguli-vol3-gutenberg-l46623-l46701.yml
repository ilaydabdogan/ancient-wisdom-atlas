canonical_text:
  quote: ''
  summary: Vali addresses Sakra after his fall and present asinine form. He teaches
    that bodies, success, honor, and suffering are transitory; that death is the end
    of embodied creatures; that desire and passion lead to sorrow and rebirth; that
    Time gives, takes, ordains, and destroys all; and that he does not grieve for
    his change in condition.
  language: English
  quote_policy: summarized
