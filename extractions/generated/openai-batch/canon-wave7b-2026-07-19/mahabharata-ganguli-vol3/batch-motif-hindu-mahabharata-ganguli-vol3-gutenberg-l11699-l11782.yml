canonical_text:
  quote: ''
  summary: Sanjaya narrates the Kaurava army's terror and disordered flight after
    Karna's fall. Duryodhana attempts to stand as a rear guard and vows to repay Karna.
    Bhima descends from his chariot to fight foot soldiers on foot and kills a large
    infantry division, while Arjuna, Dhrishtadyumna, the sons of Madri, Satyaki, and
    other Pandava-aligned warriors press the attack and pursue the fleeing troops.
  language: English
  quote_policy: summarized
