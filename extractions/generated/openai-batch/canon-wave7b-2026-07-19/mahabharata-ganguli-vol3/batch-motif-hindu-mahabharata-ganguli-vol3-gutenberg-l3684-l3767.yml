canonical_text:
  quote: ''
  summary: The gods appoint the Grandsire/Brahman as charioteer for Mahadeva/Rudra.
    Mahadeva mounts a divine car with a composite arrow involving Vishnu, Soma, and
    Agni, and proceeds toward the triple city protected by Daityas and Danavas. Cosmic
    fear, portents, and a bull’s roar accompany the approach. When the car sinks under
    divine weight, Narayana assumes bull form and raises it. Rudra’s actions are presented
    as explaining cloven bovine hoofs and horses lacking teats. When the three cities
    unite, Maheshwara shoots the celestial shaft, burning the Asuras and throwing
    them down into the Western ocean.
  language: English
  quote_policy: summarized
