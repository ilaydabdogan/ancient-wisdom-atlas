canonical_text:
  quote: ''
  summary: Sanjaya narrates a battlefield dialogue in which Duryodhana urges Shalya,
    ruler of Madras, to serve as Karna's charioteer. Shalya accepts, asks pardon for
    any beneficial but disagreeable words he may speak to Karna, and claims expert
    skill in driving and avoiding danger. The speakers compare Shalya's role for Karna
    with Krishna's role for Partha and Matali's role for Indra, while Duryodhana urges
    Karna to defeat the Parthas.
  language: English
  quote_policy: summarized
