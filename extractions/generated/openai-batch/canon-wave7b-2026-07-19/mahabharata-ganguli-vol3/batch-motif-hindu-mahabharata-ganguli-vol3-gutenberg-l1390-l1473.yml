canonical_text:
  quote: ''
  summary: Sanjaya reports to the king an intense chariot duel between Ashvatthama,
    Drona's son, and Bhima. They wound each other with arrows, counter each other's
    weapons, and fight amid imagery of mountains, rain-clouds, celestial bodies, universal
    dissolution, and fire generated by colliding shafts. Celestial beings observe,
    marvel, and praise both warriors before the passage ends during continued mutual
    attack.
  language: English
  quote_policy: summarized
