canonical_text:
  quote: ''
  summary: Bhishma recounts that after a Chandala falls silent, Viswamitra takes a
    haunch of dog's meat into the woods to preserve his life. Before eating it with
    his wife, he kindles a ritual fire, cooks it as sacrificial Charu, divides portions
    for the gods and Pitris, and invokes the gods headed by Indra. Indra sends abundant
    rain, reviving creatures and plants. Viswamitra completes the rites, eats the
    meat, later burns away sins through penance, and attains ascetic success. The
    passage concludes with instruction that preserving life in distress may require
    using one's intelligence to discriminate righteousness from its opposite.
  language: English
  quote_policy: summarized
