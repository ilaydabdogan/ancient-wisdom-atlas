canonical_text:
  quote: '"Go quickly to battle, and slay Karna, even as Purandara slew Vritra for
    his own aggrandisement."'
  summary: Sanjaya narrates a reconciliation between Yudhishthira and Arjuna. Yudhishthira
    describes Karna's success against him and urges Arjuna to kill Karna. Arjuna swears
    to slay Karna or die, Krishna supports and directs Yudhishthira to comfort and
    bless Arjuna, and Yudhishthira forgives, commands, and blesses Arjuna before battle,
    comparing the desired slaying of Karna to Purandara's slaying of Vritra.
  language: English
  quote_policy: quoted
