canonical_text:
  quote: ''
  summary: Sanjaya reports Karna setting out for battle amid Kaurava rejoicing and
    many ominous portents. Karna recalls the deaths of Bhishma and Drona, speaks to
    Shalya about destiny, death, and his resolve, orders an advance against the Pandava-aligned
    forces, describes his chariot and weapons, and vows to fight Arjuna even if divine
    powers protect him.
  language: English
  quote_policy: summarized
