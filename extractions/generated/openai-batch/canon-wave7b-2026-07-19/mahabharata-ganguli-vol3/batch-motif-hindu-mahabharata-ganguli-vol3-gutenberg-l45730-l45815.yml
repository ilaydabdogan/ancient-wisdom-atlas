canonical_text:
  quote: ''
  summary: Bhishma gives a doctrinal exposition on knowing Brahma, distinguishing
    the manifest and unmanifest, Pravritti and Nivritti, Prakriti and Purusha, and
    practicing yoga. The passage describes yoga, renunciation, withdrawal of senses,
    subtle post-body states, merging in Prakriti, emancipation beyond three bodies,
    and knowledge of Brahma as release from necessity connected with birth and death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhishma says that one who does not know four specified topics, along with
    the Manifest and Unmanifest, cannot be said to know Brahma.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Manifest is identified as liable to death, while the Unmanifest, glossed
    as the chit-soul, is said to transcend death.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage contrasts Pravritti, associated with rebirth or return and the
    support of the universe, with Nivritti, associated with the unmanifest, eternal
    Brahma and the highest end.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: An ascetic who discriminates between good and evil, studies the nature of
    the Soul, and follows Nivritti is said to attain the high end.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Prakriti and Purusha are both described as beginningless, endless, eternal,
    indestructible, and greater than the greatest, while also having points of dissimilarity.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Prakriti is described as possessing the three attributes of Goodness, Passion,
    and Darkness and as engaged in creation.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Purusha is described as apprehending all transformations of Prakriti while
    itself not being apprehended and as transcending attributes in its original nature.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A turbaned person with three folds of cloth is used as an analogy for the
    embodied Soul being invested with three attributes without being identical to
    them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: A practitioner seeking high prosperity is instructed to purify the mind, undertake
    bodily and sensory austerities, and practice yoga without desire for fruits.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Yoga power is said to pervade the universe secretly and to illumine it; the
    sun and moon are said to shine in the firmament of the heart because of yoga power.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The result of yoga is identified as Knowledge.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Brahmacharya and abstention from injury are described as yoga of the body,
    while restraint of mind and speech is described as yoga of the mind.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A yogin who eats abstemiously from alms-food is said to have sins born of
    Passion fade and the senses gradually withdraw from their objects.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The embodied Soul, after being divested of Rajas, is said to assume a subtle
    form with the senses of perception and move about in space.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: When the mind becomes unaffected by acts, the embodied Soul is said to lose
    the subtle form and become merged in Prakriti, though the passage distinguishes
    this from final emancipation beyond Prakriti.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: After the destruction of the gross body, one who escapes the gross, subtle,
    and karana bodies through absence of heedlessness is said to attain Emancipation.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The birth and death of creatures are said to depend on original Ignorance,
    while the arising of knowledge of Brahma ends the pursuit of necessity for the
    person.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:18
  text: Some yogins withdraw their hearts from external objects and from the world
    of senses; some, with minds cleansed by yoga, know and dwell in the highest; some
    worship Brahma in images.
  category: action
  evidence_refs:
  - ev:11
