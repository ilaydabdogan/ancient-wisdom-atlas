canonical_text:
  quote: '"This owl teaches me a lesson in battle."'
  summary: Ashvatthama, unable to sleep from wrath, sees an owl kill sleeping crows
    on a banyan at night. He interprets the owl's act as a model for attacking his
    enemies by guile, cites ancient verses about smiting vulnerable foes, resolves
    to kill the sleeping Pandavas and Pancalas, and wakes Kripa and the Bhoja chief
    to tell them of his plan and of Duryodhana's death.
  language: English
  quote_policy: quoted
