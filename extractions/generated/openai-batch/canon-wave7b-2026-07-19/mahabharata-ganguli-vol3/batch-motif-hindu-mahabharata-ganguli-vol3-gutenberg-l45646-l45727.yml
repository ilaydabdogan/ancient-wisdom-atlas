canonical_text:
  quote: ''
  summary: The passage first states that one who apprehends the limits of union with
    and separation from the three states becomes free of attachment, attains Emancipation,
    transcends age and death, and obtains Brahma. Bhishma then teaches about dreams,
    wakefulness, mind, soul, the three attributes, dreamless slumber, and the attainment
    of Brahma through knowledge, penance, purity of mind, transcending darkness, and
    withdrawal of senses and mind.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prior teaching says that apprehending the limits of union with and separation
    from the three states leads to detachment, Emancipation, freedom from age, decrepitude,
    and death, and obtaining Brahma.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma says that a yogin who wants to practise sinless Brahmacharya and sees
    faults in dreams should seek to abandon sleep.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In dreams, the embodied soul, affected by Passion and Darkness, appears to
    possess another body and to move and act under desire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The yogin remains awake through application to knowledge, continued reflection,
    and recapitulation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Even when the senses are suspended, the embodied being thinks itself possessed
    of a body and senses of knowledge and action.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hari is named as the master of yoga who truly comprehends the dream state,
    and the great Rishis say his explanation is correct.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Dreams are explained as arising when the senses are worn out, while the mind
    remains active.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Dream impressions are said to belong to the mind, to be based on impressions
    from countless past lives, and not to be lost once they have impressed the mind.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The three attributes, influenced by past acts, affect the mind and shape the
    images that appear, leading to happiness or misery.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Some dream images are attributed to wind, bile, and phlegm, ignorance, and
    propensities associated with Passion and Darkness, and are said to be difficult
    to discard.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Objects perceived while awake through the senses may be apprehended by the
    mind in dreams when the senses are obscured.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: In dreamless slumber, the manifest human body, described as the door of dreams,
    disappears in the mind; the mind enters the soul and becomes a wakeful witness.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: A yogin who has crossed Darkness or ignorance becomes possessed of transcending
    effulgence, and the embodied Soul becomes Supreme Brahma.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Deities are associated with penances, Vedic rites, and Goodness; Asuras are
    associated with Darkness, Passion, and Darkness; Brahma transcends all attributes.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Brahma is described as pure Knowledge, Deathlessness, pure effulgence, and
    undeteriorating, and is said to be comprehensible by withdrawing the senses and
    mind into the soul.
  category: attribute
  evidence_refs:
  - ev:8
