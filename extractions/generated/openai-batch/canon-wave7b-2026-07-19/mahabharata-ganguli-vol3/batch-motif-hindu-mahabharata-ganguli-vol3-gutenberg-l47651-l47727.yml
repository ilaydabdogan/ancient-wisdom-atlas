  quote: ''
  summary: Yudhishthira asks who is dear to all and endowed with every merit. Bhishma
    answers by recounting a former exchange in which Ugrasena asked Kesava about Narada’s
    merits. Vasudeva then praises Narada as learned, self-controlled, truthful, humble,
    renouncing, free from wrath and envy, devoted, wise, attentive to others’ good,
    and therefore worshipped everywhere.
