canonical_text:
  quote: ''
  summary: Sanjaya narrates a battlefield episode in which Karna routs Kaikaya warriors,
    pursues and wounds the already-injured Yudhishthira, and fights off Nakula and
    Sahadeva. Shalya repeatedly advises Karna to stop attacking Yudhishthira, preserve
    himself for Arjuna, and rescue Duryodhana from Bhima. Karna leaves Yudhishthira
    and the twins to rush toward Duryodhana. Yudhishthira retreats wounded to the
    Pandava camp, has arrows removed, and sends Nakula and Sahadeva to Bhima’s division.
  language: English
  quote_policy: summarized
