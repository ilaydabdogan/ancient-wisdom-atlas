canonical_text:
  quote: Karna became the stake, O monarch, of thy army in that battle, while Partha
    became the stake of the Pandavas.
  summary: Sanjaya describes Karna grieving for Vrishasena and advancing to battle
    Arjuna. The two chariot-warriors are presented as closely matched in splendor,
    weapons, steeds, chariots, drivers, and martial fury. Their standards, Karna's
    elephant-rope emblem and Partha's ape emblem, approach each other while armies,
    kings, and celestial beings watch and cheer. The duel is framed as a decisive
    game of battle in which Karna and Partha are the stakes of their respective sides,
    and cosmic comparisons surround the encounter.
  language: English
  quote_policy: quoted
