  quote: One's house is not one's home; one's wife only is one's home.
  summary: Bhishma narrates that a pigeon living in a tree with his family laments
    when his wife, who went out seeking food, has not returned by night after a storm.
    In his lament he praises his wife’s devotion and states that a wife makes a home,
    serves as companion, refuge, ally, and support in religious and worldly life.
