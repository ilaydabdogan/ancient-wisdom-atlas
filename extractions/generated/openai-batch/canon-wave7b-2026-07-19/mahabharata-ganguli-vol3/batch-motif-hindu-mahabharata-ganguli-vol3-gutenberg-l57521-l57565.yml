canonical_text:
  quote: ''
  summary: 'Yajnavalkya describes cosmic destruction: at the close of Brahman''s day,
    Maharudra is impelled to destroy the world, assumes a blazing solar form, consumes
    living beings, covers the bare Earth with water, creates a fire that dries the
    water, and then the elements and principles are successively swallowed until the
    Universe is absorbed by Sambhu and only the Undecaying and Immutable remains.'
  language: English
  quote_policy: summarized
