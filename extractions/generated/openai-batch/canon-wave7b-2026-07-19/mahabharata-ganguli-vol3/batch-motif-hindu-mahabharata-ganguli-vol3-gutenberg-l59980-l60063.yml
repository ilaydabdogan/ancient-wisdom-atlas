canonical_text:
  quote: ''
  summary: A didactic discourse describes the difficult path from this world to the
    next, where only one's good and bad acts follow. It presents the world as a dangerous
    river crossed by the body as a boat equipped with ethical qualities. The passage
    instructs the hearer to cast off dualities, desire, body, and understanding through
    higher knowledge; explains the constituents of the embodied Jiva; describes the
    Supreme Soul as formless witness; warns that violent sacrifice leads to further
    rebirth; and blesses the addressee as one who has cut bonds and seeks freedom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes a road from this world to the next as lacking resting
    places and support, unknown, and enveloped in darkness.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: It says no one follows the departing person except that person's good and
    bad acts.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Learning, acts, purity, and great knowledge are named as means for attaining
    the foremost object and freedom from rebirth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Desire for living among human habitations is described as a binding cord;
    people of good acts tear it, while wicked people do not.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The river of life or world is described with banks, current, island, mire,
    and waters made from bodily or sensory terms, and the part leading toward heaven
    is said to be difficult.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The body is called the boat for crossing that river; forgiveness is its oar,
    truth its ballast, righteousness its dragging string, and charity the wind moving
    its sails.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The hearer is instructed to cast off virtue and vice, truth and falsehood,
    purpose, desire, body, and finally the understanding itself through knowledge
    of the highest topic.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The body is described as made of bones, sinews, flesh, blood, and skin, filled
    with waste, vulnerable to decrepitude, sorrow, disease, and pain, and serving
    as a temporary habitation for the indwelling creature.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage enumerates elements, senses, attributes, manifest and unmanifest
    objects, consciousness, and understanding as constituents associated with the
    Jiva or Puman.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: Restraining the senses is said to bring great gratification, like rain to
    a thirsty traveler, and to reveal the soul embracing all objects and all objects
    in the soul.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Supreme Soul is said to be without beginning and end, born as all creatures,
    resident as witness in the Jiva-soul, inactive, and formless.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: A person afflicted through misdeeds is described as slaying many creatures
    to ward off grief; the resulting sacrifices lead to rebirths and innumerable acts.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: A person bound by acts is said to suffer many tortures and travel through
    repeated rebirths like a wheel turning ceaselessly.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The addressee is told that he has cut through all bonds, abstains from acts,
    and is urged to become free from all existent objects.
  category: speech
  evidence_refs:
  - ev:10
