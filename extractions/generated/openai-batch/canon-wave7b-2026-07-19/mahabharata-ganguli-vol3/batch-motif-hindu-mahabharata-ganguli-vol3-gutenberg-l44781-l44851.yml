canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma to describe Vishnu/Narayana/Govinda/Kesava as
    the uncreated creator and origin of creatures. Bhishma cites earlier authorities
    and presents Vishnu as the supreme pervader, creator of the elements, resting
    on the waters, and creator of Consciousness with Mind. A lotus grows from the
    Supreme Being's navel and Brahman emerges from it. Madhu arises from Darkness
    and is slain by the Supreme Being, who is thereby called Madhusudana. Brahman
    and other progenitors generate divine and creaturely lineages; Aditi bears the
    Adityas, among whom Vishnu takes birth as a dwarf, while Diti and Danu bear Asuras
    and Danavas.
  language: English
  quote_policy: summarized
