  summary: Vaishampayana narrates Dhritarashtra's reaction to the news that Karna
    has been slain. Dhritarashtra laments Karna's martial greatness, recalls Karna's
    support of Duryodhana, and describes his own grief through images of drowning
    and destruction. Sanjaya answers by praising Dhritarashtra's qualities and urging
    him to maintain fortitude.
