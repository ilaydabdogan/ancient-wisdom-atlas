canonical_text:
  quote: That which the Yogins behold is precisely that which the Sankhyas strive
    after to attain.
  summary: 'Vasishtha instructs a monarch that scriptural memory without comprehension
    is fruitless, then explains emancipation through Sankhya and Yoga teaching: Prakriti
    produces attributes, the Jiva-soul must overcome those attributes, and the Supreme
    Soul is beyond attributes, multiplicity, and enumerated principles.'
  language: English
  quote_policy: quoted
