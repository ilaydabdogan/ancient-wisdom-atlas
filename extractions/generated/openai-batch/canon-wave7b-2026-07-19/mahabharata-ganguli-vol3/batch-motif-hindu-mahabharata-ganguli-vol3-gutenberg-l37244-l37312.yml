canonical_text:
  quote: ''
  summary: Bhishma recounts the story of Kayavya, a robber of mixed Kshatriya and
    Nishada parentage who observes restraints, honors parents and Brahmanas, protects
    ascetics, is chosen by other robbers as leader, gives them rules limiting violence
    and protecting sacred persons and households, and thereby attains prosperity and
    success in the next world. Remembering the tale is said to remove fear in the
    forest and among creatures or wicked men.
  language: English
  quote_policy: summarized
