canonical_text:
  quote: ''
  summary: Sanjaya narrates a battle in which Shalya, ruler of Madras, is attacked
    from several sides by Yudhishthira, Satyaki, Bhima, Nakula, and Sahadeva. Shalya
    repeatedly wounds them, cuts bows, neutralizes several hurled weapons, and covers
    Pandava troops with arrows. Witnessing Siddhas and ascetics marvel at the combat.
    Yudhishthira fears Shalya may destroy his army despite Madhava's earlier words.
  language: English
  quote_policy: summarized
