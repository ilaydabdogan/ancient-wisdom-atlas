canonical_text:
  quote: ''
  summary: Sanjaya reports that, after Nakula is disarmed and wounded by Karna's son,
    allied Pandava warriors advance to aid him. Kaurava warriors oppose them. Kulinda
    elephant forces enter the battle, several Kulinda princes are killed, and the
    combat becomes a destructive struggle among chariots, elephants, horsemen, and
    foot-soldiers. The passage uses repeated images of snakes, mountains, storm-clouds,
    thunder, Garuda, a tree uprooted by wind, and a libation poured into fire to describe
    battle scenes and the expected fate of Vrishasena.
  language: English
  quote_policy: summarized
