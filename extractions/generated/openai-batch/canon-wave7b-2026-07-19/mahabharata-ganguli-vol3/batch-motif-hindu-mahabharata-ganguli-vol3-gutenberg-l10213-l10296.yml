candidate_motifs:
- id: motif:1
  label: Allies advance after a hero is disarmed
  taxonomy_refs: []
  basis: The report of Nakula's loss of car and weapons prompts eleven allied warriors
    to proceed into battle.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage presents a battlefield response rather than a full rescue
    narrative.
- id: motif:2
  label: Battlefield as storm and chaos
  taxonomy_refs:
  - chaos
  basis: The renewed battle is described as fierce and destructive, and the battlefield
    is compared to storm-clouds with lightning, thunder, and fierce winds.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The taxonomy reference is thematic; the passage does not describe cosmogonic
    chaos.
- id: motif:3
  label: Elephants as mountains shattered by thunder
  taxonomy_refs: []
  basis: War elephants and their falls are repeatedly compared to mountains, cliffs,
    hills, red streams on a mountain, and thunder-riven forms.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  confidence: high
  cautions: This is an image pattern within battle description, not an independent
    mountain myth.
- id: motif:4
  label: Warrior imagined as sacrificial offering to fire
  taxonomy_refs:
  - sacrifice
  basis: Observers who know Arjuna's prowess regard Vrishasena as a libation already
    poured on the fire after he wounds several heroes.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The sacrificial language is metaphorical and does not describe an actual
    ritual act.
- id: motif:5
  label: Garuda and serpent imagery applied to battle destruction
  taxonomy_refs:
  - serpent
  basis: Troops struck by Satanika are compared to snakes beaten by the tempest caused
    by Garuda's wings.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage uses the Garuda-serpent image as a simile; it does not narrate
    a separate serpent episode.
