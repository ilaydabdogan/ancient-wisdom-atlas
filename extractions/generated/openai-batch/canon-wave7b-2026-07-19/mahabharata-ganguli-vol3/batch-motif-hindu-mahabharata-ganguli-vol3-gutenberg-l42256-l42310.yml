canonical_text:
  quote: ''
  summary: A being speaking as a jackal advises the ascetic Brahmana Kasyapa not to
    cast off his life, but to practice virtue, Vedic study, sacred fire maintenance,
    truth, self-restraint, and charity. The speaker describes auspicious and inauspicious
    birth conditions, recounts a former life of skepticism and irreverence toward
    the Vedas as the cause of his jackal status, and expresses hope of regaining humanity.
    Kasyapa then recognizes the being as Indra, worships him, and returns home.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker argues that even people in severe suffering or low condition continue
    to live, laugh, sport, and remain attached to life.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker tells the Brahmana that it is not proper to cast off his life
    and instructs him to rise and practice virtue.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker instructs the Brahmana to pursue Vedic studies, maintain the sacred
    fire, and observe truth, self-restraint, and charity.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker contrasts auspicious birth conditions leading toward sacrifice,
    charity, progeny, and happiness with inauspicious conditions leading toward lack
    of sacrifice and progeny and a fall into the Asura order.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker says that in a former life he possessed useless learning, lacked
    faith, slandered the Vedas, relied on argumentation based on visible or tangible
    proof, and spoke irreverently of the Srutis and Brahmanas.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The speaker states that his present jackal status is the consequence of those
    former sins and says that, if he regained human status, he would live in contentment
    and perform sacrifices and gifts.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Kasyapa rises, expresses surprise at the speaker’s knowledge, sees with knowledge-extended
    vision that the being is Indra, worships him, receives permission, and returns
    to his abode.
  category: sequence
  evidence_refs:
  - ev:6
