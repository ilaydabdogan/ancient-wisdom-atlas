canonical_text:
  quote: ''
  summary: Bhishma introduces an old narrative about Tuladhara and Jajali on righteousness.
    Jajali, a Brahmana forest-recluse, undertakes severe austerities near and within
    the sea, roams the worlds, and thinks no one is his equal. Pisachas rebuke his
    statement and point him toward Tuladhara, a famed buyer and seller described as
    wise. Jajali resolves to see Tuladhara, is raised from the sea by superhuman beings,
    travels to Varanasi, and meets him. Yudhishthira asks Bhishma to describe Jajali's
    earlier difficult feats and success.
  language: English
  quote_policy: summarized
