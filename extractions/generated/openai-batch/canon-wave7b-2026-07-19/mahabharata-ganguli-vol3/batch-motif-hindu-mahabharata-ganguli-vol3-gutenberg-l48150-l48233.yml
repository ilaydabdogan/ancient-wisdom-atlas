canonical_text:
  quote: Persons possessed of wisdom and patience always succeed in crossing this
    awful river by employing the rafts of knowledge and wisdom.
  summary: Vyasa gives instructions on Vedic knowledge and the duties of a Brahmana,
    emphasizing self-restraint, noninjury, ritual worship, study, gifts, and discipline.
    He then presents life and Time as a perilous river that carries beings toward
    Yama, which only the wise can cross by using knowledge and wisdom as rafts.
  language: English
  quote_policy: quoted
