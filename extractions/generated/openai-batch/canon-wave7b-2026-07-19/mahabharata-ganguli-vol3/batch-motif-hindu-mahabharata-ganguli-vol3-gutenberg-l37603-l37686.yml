canonical_text:
  quote: ''
  summary: Bhishma continues an animal fable in which the mouse Palita shelters beneath
    the trapped cat Lomasa. Their temporary compact deters the mongoose Harita and
    the owl Chandraka. Palita cuts the noose slowly, explaining that the cat should
    be freed only when the hunter arrives, so that both parties flee rather than resume
    their former enmity. At dawn the hunter Parigha appears with weapons and dogs;
    Palita cuts the final string, Lomasa climbs a banian tree, and Palita flees.
  language: English
  quote_policy: summarized
