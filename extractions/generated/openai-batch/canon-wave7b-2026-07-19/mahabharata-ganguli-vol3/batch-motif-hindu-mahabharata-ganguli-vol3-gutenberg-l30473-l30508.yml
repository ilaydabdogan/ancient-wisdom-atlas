  text: Vishnu, acting according to Kshatriya duties, forcibly suppressed and destroyed
    his foes and brought relief to gods and Rishis.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Indra says that without Vishnu’s defeat of the Asuras and subjugation of the
    earth with its Asuras, Brahmanas, Brahman the Creator, Kshatriya duties, and the
