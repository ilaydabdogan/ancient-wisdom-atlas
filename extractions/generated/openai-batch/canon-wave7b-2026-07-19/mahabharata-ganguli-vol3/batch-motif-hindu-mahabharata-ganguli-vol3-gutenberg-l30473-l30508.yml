- id: obs:1
  text: Indra states that those who are not kings cannot easily attain the highest
    rewards of duty, and that kingly duties first flowed from the original god while
    other duties flowed later from his body.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Indra states that kingly duties are distinguished above other duties, include
    all other duties, and are considered foremost among duties.
  category: attribute
  evidence_refs:
