canonical_text:
  quote: ''
  summary: Indra argues that kingly or Kshatriya duties originate from the original
    god, include all other duties, and are foremost. He presents Vishnu’s defeat of
    Asuras as a precedent showing that Kshatriya duty protects gods, Rishis, Brahmanas,
    and the system of duties. He then describes kings as protectors who restrain wrongdoing,
    aid the distressed, protect all creatures, and lead toward emancipation.
  language: English
  quote_policy: summarized
