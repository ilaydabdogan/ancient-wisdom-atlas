canonical_text:
  quote: '"Go and destroy the Sacrifice of Daksha."'
  summary: Mahadeva creates a terrible armed being from his mouth and commands him
    to destroy Daksha's sacrifice. Uma assumes the dreadful form Mahakali and accompanies
    him. The being, named Virabhadra, creates fierce spirit bands from his pores.
    They rush to the sacrifice, cause cosmic disturbances, destroy ritual objects
    and food, frighten celestial beings, burn the sacrifice, tear off the head of
    Sacrifice, and are then questioned by Brahman, the gods, and Daksha.
  language: English
  quote_policy: quoted
