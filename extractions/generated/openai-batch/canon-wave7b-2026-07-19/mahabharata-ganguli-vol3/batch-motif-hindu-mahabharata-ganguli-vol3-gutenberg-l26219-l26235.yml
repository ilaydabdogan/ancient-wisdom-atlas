canonical_text:
  quote: ''
  summary: Vaisampayana narrates that Yudhishthira, after hearing the Island-born
    Rishi and seeing Dhananjaya angry, salutes Vyasa and answers him. Yudhishthira
    says that earthly sovereignty and its enjoyments give him no joy, because grief
    over lost kinsmen and the lamentations of bereaved women prevent peace. Vaisampayana
    then introduces Vyasa's reply, emphasizing Vyasa's virtue, yogic knowledge, wisdom,
    and acquaintance with the Vedas.
