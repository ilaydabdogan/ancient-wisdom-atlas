canonical_text:
  quote: ''
  summary: After Dhritarashtra is washed, Krishna admonishes him for wrath toward
    Bhima, saying that his suffering arose from his own fault, his rejection of earlier
    counsel, and his subjection to Duryodhana. Krishna recalls Duryodhana's offense
    against the princess of Pancala and says Bhima slew him in just revenge. Dhritarashtra
    accepts Krishna's words, attributes his fall from righteousness to parental affection,
    says he is free from wrath, and embraces and blesses the Pandava princes.
  language: English
  quote_policy: summarized
