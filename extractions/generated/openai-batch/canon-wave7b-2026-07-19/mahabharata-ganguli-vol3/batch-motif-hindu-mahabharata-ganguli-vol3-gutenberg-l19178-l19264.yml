canonical_text:
  quote: '"diverse portents of an awful kind became noticeable"'
  summary: Sanjaya reports Duryodhana challenging Bhima to battle, after which violent
    cosmic, atmospheric, earthly, animal, and martial portents appear. Bhima vows
    to kill Duryodhana with his mace and recalls past wrongs against the Pandavas
    and Draupadi. Duryodhana rejects Bhima's speech as bragging and welcomes the mace
    encounter. The assembled kings applaud; Bhima rushes forward with his mace while
    elephants, horses, and the Pandavas' weapons react ominously.
  language: English
  quote_policy: quoted
