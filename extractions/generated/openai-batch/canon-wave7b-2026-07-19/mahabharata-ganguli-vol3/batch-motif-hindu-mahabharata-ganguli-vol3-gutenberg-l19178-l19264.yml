    mountain summits, animals running, jackals with blazing mouths, blazing quarters,
    wells swelling, and sounds without visible speakers.'
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bhima tells Yudhishthira that Duryodhana cannot defeat him and vows to kill
