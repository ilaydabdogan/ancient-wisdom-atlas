canonical_text:
  quote: ''
  summary: The narrator describes a chaotic battle among mounted and armed warriors.
    Weapons fill the air, dust and darkness obscure the field, horses and men fall
    bloodied, Shakuni withdraws with a cavalry remnant and then attacks Dhrishtadyumna's
    division again. The fighting becomes indiscriminate, with kin and allies struck
    down, scavenging animals crying out, and the Earth covered with corpses and streams
    of blood.
  language: English
  quote_policy: summarized
