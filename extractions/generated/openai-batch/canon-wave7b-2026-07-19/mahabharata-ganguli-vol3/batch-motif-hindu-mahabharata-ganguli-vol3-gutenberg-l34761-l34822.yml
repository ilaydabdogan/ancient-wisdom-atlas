canonical_text:
  quote: combination has been said to be the great refuge of the aristocracy.
  summary: Bhishma advises a monarch about relations between a king and the aristocracy,
    warning that avarice, wrath, oppression, gifts, and disunion can destroy noble
    orders and kingdoms. He recommends unity among nobles, prudent use of spies and
    policy, respect for wise and courageous leaders, consultation with aristocratic
    leaders, and quick suppression of internal quarrels.
  language: English
  quote_policy: quoted
