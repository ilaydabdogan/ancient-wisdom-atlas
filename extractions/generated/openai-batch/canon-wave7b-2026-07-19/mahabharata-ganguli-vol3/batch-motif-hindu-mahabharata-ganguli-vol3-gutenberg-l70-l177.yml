canonical_text:
  quote: ''
  summary: The passage opens Book 8 with an invocation. Vaishampayana narrates that
    after Drona's death, Kaurava leaders grieve, pass a sleepless night remembering
    wrongs done to the Pandavas and Draupadi, and then perform morning rites. Karna
    is made commander with auspicious ritual actions and prayers for victory. A fierce
    two-day battle follows, ending with Karna slain by Arjuna. Sanjaya travels to
    Dhritarashtra and reports the disaster, while Janamejaya asks how the old king
    could endure such grief. Sanjaya reminds Dhritarashtra of rejected good counsel
    and the slaughter of his allies.
  language: English
  quote_policy: summarized
