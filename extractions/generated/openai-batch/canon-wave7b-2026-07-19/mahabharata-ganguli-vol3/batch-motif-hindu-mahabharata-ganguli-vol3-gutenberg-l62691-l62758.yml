canonical_text:
  quote: ''
  summary: A divine narrator recounts the battle between Rudra and Narayana, the cosmic
    disturbances it caused, Brahma’s intervention, Rudra’s reconciliation with Narayana,
    their mutual bodily marks and declared non-difference, and a later explanation
    that Rudra had gone before the addressee in battle and slain his foes first.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rudra and Narayana are described as engaged in battle, and the universe becomes
    filled with anxiety.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage lists dire omens: sacrificial fire refuses clarified butter,
    the Vedas cease to shine inwardly in Rishis’ minds, deities are possessed by Rajas
    and Tamas, Earth trembles, the firmament seems divided, luminaries lose splendour,
    Brahma falls from his seat, the Ocean dries, and Himavat mountains are riven.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Brahma arrives with deities and high-souled Rishis at the place where the
    battle is raging.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Brahma joins his hands and asks Rudra to put down his weapons for the benefit
    of the universe and peace of the worlds.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Brahma says that Nara and Narayana are displayed forms of Supreme Brahman,
    born in the race of Dharma, and that Brahma sprang from Grace while Rudra sprang
    from Wrath.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Rudra casts off the fire of his wrath and seeks to gratify Narayana; Narayana
    becomes gratified and reconciled with Rudra.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Narayana tells Rudra that whoever knows or follows Rudra knows or follows
    Narayana, and that there is no difference between them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Narayana says Rudra’s lance-mark on his chest will become a beautiful whirl,
    and Narayana’s hand-mark on Rudra’s throat will become a beautiful mark associated
    with the name Sreekantha.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Nara and Narayana make friends with Rudra, dismiss the deities, and resume
    penances with tranquil souls.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The narrator tells the addressee that Rudra was the being seen stalking before
    him in battle and that the foes slain by the addressee were first slain by Rudra.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The addressee is instructed to bow to Rudra, called god of gods, lord of Uma,
