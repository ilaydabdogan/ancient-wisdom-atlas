canonical_text:
  quote: ''
  summary: Narada recounts that Rama, pleased with Karna, teaches him the Brahma weapon
    and its withdrawal mantras. While Rama sleeps with his head on Karna's lap, a
    painful blood-sucking worm bores into Karna's thigh, but Karna remains still to
    avoid waking his preceptor. Rama wakes when Karna's blood touches him, sees the
    worm, and the worm dies; a Rakshasa appears and explains that he was the Asura
    Dansa, cursed by Bhrigu to live as a worm until released through Rama. Rama then
    infers from Karna's endurance that he is not a Brahmana. Karna confesses that
    he is a Suta and had presented himself otherwise to obtain weapons. Rama curses
    him so that the Brahma weapon will fail to remain in his remembrance at a critical
    combat against an equal warrior, expels him, and Karna later tells Duryodhana
    that he has mastered all weapons.
  language: English
  quote_policy: summarized
