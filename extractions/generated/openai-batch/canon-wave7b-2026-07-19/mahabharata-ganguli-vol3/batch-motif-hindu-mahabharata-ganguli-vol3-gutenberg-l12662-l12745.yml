canonical_text:
  quote: ''
  summary: Sanjaya reports a devastated battlefield and distressed Kaurava forces.
    Kripa approaches Duryodhana and counsels him about Kshatriya duty, the merit of
    death in battle, and the sin of fleeing. He lists fallen champions and kin, says
    they have gone to blessed regions, and emphasizes the terrifying, seemingly undefeatable
    power of Arjuna aided by Krishna, Gandiva, white steeds, and other martial signs.
    He describes the Kaurava army as broken, leaderless, and vulnerable, recalls Arjuna's
    killing of Jayadratha, and warns of the remaining force of Bhima and Satyaki.
  language: English
  quote_policy: summarized
