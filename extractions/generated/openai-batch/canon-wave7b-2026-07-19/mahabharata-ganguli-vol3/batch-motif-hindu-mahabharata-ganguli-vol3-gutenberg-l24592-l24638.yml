canonical_text:
  quote: ''
  summary: Narada recounts how Duryodhana, accompanied by Karna, attends a royal self-choice
    at Rajapura. When the maiden passes him by, Duryodhana forcibly takes her onto
    his car. The assembled kings pursue, but Karna, acting as armed rear-guard, defeats
    and disarms them, enabling Duryodhana to depart with the maiden.
  language: English
  quote_policy: summarized
