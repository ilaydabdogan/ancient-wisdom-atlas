  summary: In a battlefield episode, Sahadeva pursues the fleeing Shakuni, reminds
    him of his role in the dice-game humiliation, disables his weapons and battle
    emblems, cuts off his arms, and then beheads him with a gold-winged iron arrow.
    Shakuni's death causes Kuru forces to flee, while the Pandavas rejoice with Keshava,
    blow conchs, and praise Sahadeva.
