canonical_text:
  quote: ''
  summary: Sanjaya narrates Arjuna urging Govinda to drive toward Bhima. Kaurava forces
    attack Arjuna, who cuts down weapons, warriors, animals, and vehicles while advancing
    toward Karna. Arjuna's arrival heartens Bhima, who then attacks the Kaurava army.
    Duryodhana orders his troops to slay Bhima; Bhima is surrounded, breaks through,
    kills large numbers, and causes a river of blood to flow on the battlefield.
  language: English
