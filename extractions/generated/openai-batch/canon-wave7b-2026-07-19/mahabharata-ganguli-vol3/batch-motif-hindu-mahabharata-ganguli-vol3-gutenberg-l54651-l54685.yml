  text: A person who looks on the world as the result of the combination of five primal
    essences and behaves with that notion foremost is said to be emancipated.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person who treats pleasure and pain, gain and loss, victory and defeat,
