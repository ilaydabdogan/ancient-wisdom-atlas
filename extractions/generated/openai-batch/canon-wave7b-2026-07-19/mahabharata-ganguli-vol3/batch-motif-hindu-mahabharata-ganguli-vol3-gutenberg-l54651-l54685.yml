canonical_text:
  quote: ''
  summary: 'An unnamed speaker enumerates attitudes and reflections by which a person
    is said to become emancipated: equality toward materials and opposites, viewing
    the world as a combination of five primal essences, contemplating bodily impurity
    and aging, recognizing the departure of celestial beings and kings, and seeing
    worldly concerns as unsubstantial. Sagara hears the teaching, acquires virtues
    productive of Emancipation, and continues to rule his subjects.'
  language: English
  quote_policy: summarized
