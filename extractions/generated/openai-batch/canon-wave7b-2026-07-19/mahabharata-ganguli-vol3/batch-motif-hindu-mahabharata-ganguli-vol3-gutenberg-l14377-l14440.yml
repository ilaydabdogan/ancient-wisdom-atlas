canonical_text:
  quote: ''
  summary: In the battle after Shalya's death, Yudhishthira disables Kritavarma, Ashvatthama
    carries Kritavarma away, and the Pandavas celebrate Yudhishthira as the celestials
    once applauded Indra after Vritra's death. The Madra warriors then attack despite
    Duryodhana's attempt to stop them. Arjuna and other Pandava-allied warriors surround
    and rescue Yudhishthira. The Madrakas challenge the Pandavas and are slain, while
    Shakuni urges Duryodhana not to stand aside.
  language: English
  quote_policy: summarized
