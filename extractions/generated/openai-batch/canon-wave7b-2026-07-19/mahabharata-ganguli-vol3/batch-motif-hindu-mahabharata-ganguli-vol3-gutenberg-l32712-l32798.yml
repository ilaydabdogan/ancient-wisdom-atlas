canonical_text:
  quote: ''
  summary: Yudhishthira asks what kind of city a king should inhabit. Bhishma answers
    with instructions on citadels, the ideal fortified royal city, stores and resources,
    justice, spies, ritual duties, protection of subjects, and relations with ascetics
    as trusted sources of counsel and refuge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yudhishthira asks what kind of city a king should dwell in and whether it
    should be preexisting or newly constructed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Bhishma says a king should consider six kinds of citadels: water-citadels,
    earth-citadels, hill-citadels, human-citadels, mud-citadels, and forest-citadels.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The recommended city is defended by a citadel with rice, weapons, walls, a
    trench, animals and vehicles of war, skilled inhabitants, provisions, shops, peace,
    music, Vedic chanting, festivals, and worship of deities.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king is instructed to increase treasury, forces, friends, courts of justice,
    provisions, arsenals, stores of grain, and many materials useful for defense and
    maintenance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The king is instructed to increase tanks and wells containing water and to
    protect juicy trees.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The king should honor learned, ritual, technical, medical, and capable persons,
    honor the righteous, chastise the unrighteous, and assign social orders to their
    duties.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king should use spies to learn the outward behavior and state of mind
    of inhabitants, and the acts and intentions of foes, friends, and neutrals.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The king should adore the gods in sacrifices, make gifts without causing pain,
    protect his subjects, and maintain the helpless, masterless, old, and widowed
    women.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The king should honor ascetics, inform them about himself and the kingdom,
    behave humbly before them, confide in an ascetic during distress, place wealth
    in an ascetic's charge, and take wisdom from him.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The king should cultivate ascetic friends from his own kingdom, an enemy kingdom,
    the forest, and tributary kingdoms; such ascetics may grant protection in calamity
    if solicited.
  category: relationship
  evidence_refs:
  - ev:8
