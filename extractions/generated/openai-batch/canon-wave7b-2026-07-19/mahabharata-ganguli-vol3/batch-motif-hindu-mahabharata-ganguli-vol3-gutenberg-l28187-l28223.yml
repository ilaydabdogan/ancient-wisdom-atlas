canonical_text:
  quote: ''
  summary: After dismissing the subjects, Yudhishthira comforts his battle-worn brothers
    and instructs them to rest after victory. He assigns rich palaces formerly belonging
    to Kuru opponents to Bhima, Arjuna, Nakula, and Sahadeva. Other named figures
    return to their former abodes, while Saurin and Satyaki enter Arjuna's palace.
    The princes feast, sleep, and present themselves to Yudhishthira in the morning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king dismisses his subjects, who return to their homes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yudhishthira tells his brothers that their bodies have been mangled by weapons
    and that fatigue, grief, and anger have affected them after the great battle.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yudhishthira says his brothers suffered forest exile through his fault and
    instructs them to enjoy the victory, rest, recover their faculties, and meet him
    in the morning.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Bhima, also called Vrikodara, enters the palace of Duryodhana, assigned to
    him by Yudhishthira with Dhritarashtra's approval.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Arjuna receives the palace of Dussasana, described as wealthy, attended, and
    having a golden gateway.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nakula receives the palace of Durmarshana, described as superior, gold-adorned,
    gem-adorned, and like the mansion of Kuvera.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sahadeva receives Durmukha's palace, described as beautiful, gold-adorned,
    and full of beds and beautiful women; he becomes delighted.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Yuyutsu, Vidura, Sanjaya, Sudharman, and Dhaumya proceed to the abodes they
    had owned before.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Saurin, accompanied by Satyaki, enters Arjuna's palace and is compared to
    a tiger entering a cave in the hills.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The princes feast on prepared food and drink, pass the night happily, awake
