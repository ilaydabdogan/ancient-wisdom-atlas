  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The sage says residence in the kingdom is unsafe because good and evil are
    treated alike, the righteous may meet death, and the unrighteous may face no danger.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The sage compares the kingdom or king to the Sita river where boats sink,
