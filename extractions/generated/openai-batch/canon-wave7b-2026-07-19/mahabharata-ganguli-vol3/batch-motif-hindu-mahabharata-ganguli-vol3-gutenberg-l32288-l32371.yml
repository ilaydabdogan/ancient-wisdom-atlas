canonical_text:
  quote: ''
  summary: A sage addresses a king, warning that service to kings is dangerous and
    requires care. He says his crow was killed while doing the king's business, accuses
    the king's servants and ministers of corruption and conspiracy, and describes
    the kingdom through images of snakes, fire, dangerous rivers, inaccessible forests,
    and parasitic growth on a tree. He urges the king to discern friends from foes
    and correct the ministers, while explaining that he came to examine the king's
    conduct and now fears remaining there.
  language: English
  quote_policy: summarized
