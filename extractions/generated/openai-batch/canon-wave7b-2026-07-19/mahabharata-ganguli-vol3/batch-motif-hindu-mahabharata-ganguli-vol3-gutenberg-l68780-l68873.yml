literal_observations:
- id: obs:1
  text: Taking anything from the father-in-law or other marriage-relatives of a daughter
    is described as a deadly sin, and selling daughters in marriage is said to make
    persons fallen.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The householder is said to have a duty to worship deities and Pitris and to
    be hospitable; the Brahmana is described as relying on accepted gifts to discharge
    this duty without demerit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A metaphor is explained in which creatures are borne away in the stream of
    Time and may catch trees of benevolence in order to save themselves.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The place for yogic practice is described as level, pure, solitary, quiet,
    and free from kankars, fire, sand, and other disturbances.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The described yogic regimen includes abstention from food, amusements, worldly
    work, sleep, and dreams, as well as renunciation, certainty in Vedic and preceptor
    teaching, restraint of the senses, pure food, and reflection on birth, death,
    decrepitude, disease, sorrow, and faults.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A course of life for attaining Emancipation or Brahma is explained through
    a figurative car, with virtues or attributes represented as its limbs.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Named parts of the figurative car include the driver's seat, protective fence,
    pole, wheel, yoke, yoke-middle, wheel circumference, central seated portion, and
    goad.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Dharana is explained as the faculty by which the mind is kept employed upon
    a particular image or notion, and yogins are said especially to train it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Seven kinds of dharana are said to appertain to Earth, Wind, Space, Water,
    Fire, Consciousness, and Understanding.
  category: sequence
  evidence_refs:
  - ev:7
