canonical_text:
  quote: ''
  summary: Bhishma narrates how a Brahmana withdraws to the woods for severe austerities,
    gains spiritual vision and ascetic power, encounters Kundadhara, beholds kings
    in hell and humans bound by vices, receives forgiveness and grace, and is taught
    the superiority of virtue over wealth and desire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Brahmana enters the woods and undertakes severe penances after developing
    distaste for the world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: His food progresses from fruits and roots left after serving deities and guests,
    to tree leaves, to water only, and then to air alone for many years.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: His strength does not diminish during the austerities, and after a long time
    he acquires spiritual vision.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Brahmana thinks that his speech will not be untrue if he grants wealth
    or sovereignty, and that he can create high objects by will.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kundadhara appears to the Brahmana because of friendship and the Brahmana's
    ascetic success, and the Brahmana offers him worship.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kundadhara tells the Brahmana to use his spiritual eye to behold the end attained
    by kings and to survey all worlds.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Brahmana sees thousands of kings sunk in hell.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kundadhara says that men desire carnal enjoyments and that the door of heaven
    is closed to men.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Brahmana sees many living men embracing lust, wrath, cupidity, fear, pride,
    sleep, procrastination, and inactivity.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kundadhara says human beings are enchained by these vices, that the gods are
    afraid of men, and that no one becomes virtuous unless permitted by the gods.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Brahmana bows to the Cloud, prostrates himself, acknowledges Kundadhara's
    favor, and admits that desire and cupidity had affected his goodwill.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Kundadhara forgives the Brahmana, embraces him, and disappears.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Brahmana roams all the worlds after attaining ascetic success through
    Kundadhara's grace.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage states that virtue and penances enable one to sail through the
