canonical_text:
  quote: ''
  summary: Yudhishthira observes Krishna in profound yogic stillness and asks why
    he has withdrawn his senses and mind. Krishna says he was concentrating on Bhishma,
    who lies on a bed of arrows and is thinking of him. Krishna praises Bhishma's
    martial power, birth from Ganga, teachers, knowledge of weapons, Vedas, morality,
    and time, and urges Yudhishthira to ask him about duties and knowledge before
    he dies. Yudhishthira asks that they go to Bhishma with Krishna at their head,
    noting that Bhishma will depart when Surya turns north. Krishna orders his ornate
    chariot to be yoked, and Daruka prepares it.
  language: English
  quote_policy: summarized
