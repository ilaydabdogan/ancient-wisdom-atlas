  quote: ''
  summary: Translator’s notes explain an analogy of unattached household life, cosmological
    time periods including yugas and Brahman’s waking and sleeping periods, and a
    creation account in which Mind, Mahat, elemental entities, gross and subtle bodies,
    the residue of acts, and Soul are related to manifestation and rebirth. Several
    verses are noted as also occurring in Manusmriti Chapter 1.
  language: English
  quote_policy: summarized
