literal_observations:
- id: obs:1
  text: The note equates Pasya and apasya with knower and known, or Soul and Prakriti,
    and equates Kshemaya and Tattwo with knowledge and known.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who sees no difference among these is described as regarding all
    things as one and the same, appearing as a Jiva to others but being identifiable
    with the Supreme Soul.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that if speech is Brahma, all men may be regarded as utterers
    of Brahma; if Brahma means the Vedas, all men may be competent to study the Vedas.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A doctrine is stated that acts must be destroyed before Emancipation can occur.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Certain obstacles are described as not external in nature and therefore not
    removable by ordinary personal exertion.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Questioning the king is explained as occurring internally or by Yoga power;
    another note says the lady was determined to make the king dumb and that the king
    was proud of his invincibleness.
  category: action
  evidence_refs:
  - ev:5
