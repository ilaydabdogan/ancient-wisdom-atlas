  evidence_refs:
  - ev:6
- id: obs:8
  text: The note says Karma has value on the path of Emancipation because it purifies
    the Soul.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The sceptre and the triple-stick are described as outward emblems or modes
    of life that neither qualify nor disqualify a person for Emancipation.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: The king and the Sannyasin are both described as free to acquire knowledge
