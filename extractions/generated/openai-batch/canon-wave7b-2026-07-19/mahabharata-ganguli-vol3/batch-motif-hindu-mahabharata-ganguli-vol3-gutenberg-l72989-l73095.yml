  quote: ''
  summary: Footnotes explain doctrinal and philological points about non-difference
    of knower and known, speech as Brahma or Veda, destruction of acts before emancipation,
    yogic questioning of a king by a lady, the relation of Vaiseshika to other systems,
    karma as purification, the non-efficacy of royal and renunciant emblems, and methods
    for resolving ambiguous scriptural interpretation.
  language: English
