canonical_text:
  quote: ''
  summary: A didactic passage explains forms of sacrifice for the Sudra and other
    orders, names Paka-yajnas and Purna-patra Dakshina, presents Paijavana as an old
    example of a Sudra donor, elevates devotion as the foremost and purifying element
    of sacrifice, assigns ritual authority to Brahmanas, describes mental sacrifice
    and offerings desired by gods, mentions sacrificial fire and homa varieties, and
    concludes that all orders should perform sacrifices according to capacity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Sudra is said to be ordained for sacrifice but not competent to use Vedic
    mantras such as swaha and swadha, and is directed toward minor sacrifices called
    Paka-yajnas.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Purna-patra is named as the Dakshina of such sacrifices, and Paijavana is
    said to have given one hundred thousand Purnapatras as Dakshina in days of old.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sacrifice is said to be laid down for the Sudra as well as the three other
    classes, and the passage later concludes that all orders should perform sacrifices.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:7
- id: obs:4
  text: Devotion is described as foremost among sacrifices, as a high deity that cleanses
    sacrificers, as a mighty agent, and as sacred aid for sacrifice.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:6
  - ev:7
- id: obs:5
  text: Brahmanas are described as foremost of gods to Sudra attendants, gods of the
    gods, to be worshipped as a god when conversant with Vedic texts, and performers
    of sacrifices for the other orders.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:6
  text: The Sudra, lacking Richs, Yajuses, and Samans, is said to have Prajapati for
    his god.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mental sacrifice and sacrifice consisting in devotion are laid down for all
    orders, and gods and superior persons are said to desire shares in offerings even
    in such sacrifices of the Sudra.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The fire called Vitana, procured from Vaisyas and inspired with mantras, is
    described as still inferior.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The four orders are described as holy, mutually related through intermediate
    classes, sprung from Brahmanas, and ordered so that the Brahmana was created first.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: A verse associated with the Vaikhanasa Munis describes a subdued person with
    a heart filled with devotion pouring libations on the sacrificial fire before
    or after sunrise according to ordinance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Homas are described as having an initial variety called skanna and a last,
    foremost-in-merit variety called askanna.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Sacrifices are described as multifarious in rites and fruits, and a Brahmana
    with devotion, scriptural learning, and knowledge of them is said to be competent
    to perform them.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: A person desiring to perform a sacrifice is regarded as righteous even if
    described as a thief or sinner, and the Rishis are said to applaud such a person.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The conclusion states that all orders should perform sacrifices by every available
    means and that nothing in the three worlds is equal to sacrifice.
  category: speech
  evidence_refs:
  - ev:7
