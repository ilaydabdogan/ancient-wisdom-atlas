canonical_text:
  quote: ''
  summary: In a fierce battle, Karna slays many warriors and wounds Arjuna and Krishna,
    including with five arrows that are revealed to be mighty snakes aligned with
    Takshaka's son Aswasena. Arjuna counters with massive arrow showers that darken
    the sky, cuts the five snakes apart, wounds Karna, kills many Kuru warriors guarding
    Karna, and causes the surviving Kauravas to flee, while Karna continues toward
    Arjuna.
  language: English
  quote_policy: summarized
