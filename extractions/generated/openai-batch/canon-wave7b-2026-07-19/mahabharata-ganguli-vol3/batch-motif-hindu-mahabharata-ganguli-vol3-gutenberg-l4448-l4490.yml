canonical_text:
  quote: ''
  summary: Karna, called the son of Radha, addresses Shalya, king of the Madras, with
    insults against the Madrakas and Sindhu-Sauviras. He declares that a Kshatriya
    slain in battle attains the highest duty and that he desires heaven through Death.
    He affirms loyalty to Dhritarashtra's son, rejects Shalya's discouragement, recalls
    Rama's teaching about heroes who die in battle, vows to rescue the Kauravas and
    slay foes, and says he will imitate Pururavas. He spares Shalya for stated reasons
    but threatens him if he speaks similarly again, then declares that either the
    two Krishnas will slay Karna or Karna will slay them, and orders Shalya to proceed.
  language: English
  quote_policy: summarized
