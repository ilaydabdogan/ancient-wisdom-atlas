canonical_text:
  quote: Protecting thy subjects righteously, govern the goddess Earth with her mountains
    and forests and islands.
  summary: Draupadi urges the king not to renounce or fall into despondency after
    victory. She reminds him of his promises during exile, defines royal duties as
    chastisement of the wicked, protection of subjects, battle, sacrifice, and gifts,
    recalls his conquest and broad dominion, rebukes his apparent madness, and exhorts
    him to rule the Earth righteously.
  language: English
