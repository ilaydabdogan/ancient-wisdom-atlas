canonical_text:
  quote: ''
  summary: Sanjaya reports Shalya’s reply to Duryodhana. Shalya boasts that he exceeds
    the two Krishnas in martial strength, can fight gods, Asuras, and men, and will
    lead Duryodhana’s troops. Duryodhana ritually invests Shalya with command by pouring
    sanctified water on him according to scriptural rites. The Kaurava and Madraka
    warriors acclaim Shalya. Shalya then vows either to slay the Pandavas and their
    allies or, if slain by them, to proceed to heaven, while displaying his prowess
    and routing the Pandava forces.
  language: English
