canonical_text:
  quote: ''
  summary: Bhishma tells Krishna that pain from arrow-wounds and failing faculties
    prevent him from speaking, and asks Krishna to instruct Yudhishthira. Krishna
    praises Bhishma and grants a boon freeing him from pain, hunger, thirst, and mental
    clouding, while giving him clear understanding, memory, and celestial vision.
    Rishis worship Krishna with Vedic hymns; auspicious celestial signs occur; at
    evening the sages and warriors salute Bhishma and depart toward the Kuru city.
  language: English
  quote_policy: summarized
