canonical_text:
  quote: ''
  summary: The son of Drona tells his maternal uncle that rage, grief, and other causes
    have deprived him of sleep. He says his heart burns over his father's slaughter,
    names Dhrishtadyumna and his allies as targets, and declares that he will kill
    his enemies while they sleep before taking rest. Kripa answers with moral instruction,
    warning that uncontrolled passion prevents understanding of duty. He says sleeping,
    unarmed, surrendered, and disabled persons are not to be slain, and warns that
    attacking the sleeping Pancalas would lead to deep hell and stain the warrior's
    reputation.
  language: English
  quote_policy: summarized
