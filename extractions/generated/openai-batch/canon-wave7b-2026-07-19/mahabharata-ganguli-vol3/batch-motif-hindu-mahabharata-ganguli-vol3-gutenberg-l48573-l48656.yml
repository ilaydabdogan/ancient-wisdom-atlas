canonical_text:
  quote: ''
  summary: Vyasa teaches that success comes through knowledge, penance, sensory restraint,
    and renunciation. He describes embodied beings as composed of elemental and divine
    correspondences, with senses governed by mind and knowledge. The Soul is said
    to be unseen by ordinary senses but visible through the mind's lamp, present in
    all beings, and realized by the wise. The passage further describes the Supreme
    Soul or That as beyond spatial location, containing all worlds, all-pervading,
    subtler and grosser than all things, and entering the nine-doored body. Time is
    described as cooking all entities while its own ground remains unknown.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vyasa states that success is attained through knowledge, penances, subjugation
    of the senses, and renunciation of everything.
  category: speech
  evidence_refs:
