- id: obs:4
  text: The passage locates Vishnu in the feet, Indra in the arms, Agni in the stomach,
    the points of the horizon in the ears, and speech identified with Saraswati in
    the tongue.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The five sense organs and their five objects are distinguished, and the mind
    is compared to a charioteer directing well-broken steeds.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Knowledge is said to sit in the heart and to employ the mind, while the mind
    employs, guides, or restrains the senses.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The wise person who subdues the senses beholds the Soul through knowledge
    and the mind; the Soul is not beheld by the eye or by the senses.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Soul is described as without sound, touch, form, taste, scent, body, or
    senses, yet as beheld within the body and dwelling in all mortal bodies.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says that one who beholds one's own Soul in all things and all
    things in one's own Soul attains Brahma, and that realizing the identity of all
    things with oneself leads to immortality.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The track of men of knowledge is compared to the track of birds in the sky
    or fish in water, and the gods are said to be stupefied by such a trackless man.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Time is said to cook all entities within itself, while no one knows that in
    which Time is itself cooked.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: That is described as not occurring above, in the middle, below, transversely,
    or in any direction, and as not a tangible entity found in any place.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: All worlds are said to be within That, and even motion as swift as an arrow
    or the mind cannot reach the end of the cause of all this.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:14
  text: The Supreme Soul is described with hands, feet, eyes, head, face, and ears
    everywhere, overwhelming all things.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:15
  text: The Supreme Soul is said to display destructible existence in mobile and immobile
    entities and indestructible existence in Chaitanya.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:16
  text: Although inactive and without attributes, the Supreme Soul is said to enter
