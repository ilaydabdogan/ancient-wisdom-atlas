canonical_text:
  quote: ''
  summary: Dhritarashtra, afflicted by grief, says that after Vyasa's words about
    divine ordination he will not cast off his life. Vyasa disappears. Janamejaya
    asks what happened next. Sanjaya returns to Dhritarashtra after Duryodhana's death
    and the slaughter of the troops, deprived of spiritual sight, and reports the
    deaths of kings and sons, urging obsequial rites. Dhritarashtra collapses, and
    Vidura counsels him not to grieve, teaching impermanence, the power of Time, and
    the blessed afterlife of warriors fallen in battle.
  language: English
  quote_policy: summarized
