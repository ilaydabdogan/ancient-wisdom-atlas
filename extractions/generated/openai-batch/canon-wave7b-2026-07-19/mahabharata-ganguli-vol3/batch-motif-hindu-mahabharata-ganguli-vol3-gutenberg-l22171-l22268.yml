canonical_text:
  quote: ''
  summary: After Ashvatthama is defeated and deprived of his gem, Draupadi asks that
    the gem be placed on Yudhishthira's head and gives up her vow. Yudhishthira asks
    Krishna how Ashvatthama slaughtered so many warriors. Krishna attributes Ashvatthama's
    success to Mahadeva's aid and recounts an old creation episode in which Rudra
    enters the waters for austerities, Brahma appoints another creator, creatures
    are assigned food, and Rudra later emerges angry, withdraws his generative power
    into the earth, and goes to the Menjavat mountains for further austerities. The
    next section begins with the gods preparing a Vedic sacrifice.
  language: English
  quote_policy: summarized
