canonical_text:
  quote: ''
  summary: Narada delivers a didactic discourse on the unavoidable alternation of
    happiness and sorrow, the wasting of life by time, the uncertain fruition of acts
    and desires, conception and fetal helplessness, bodily dissolution followed by
    another embodiment, and the inability of wealth, physicians, and medicines to
    prevent disease and decline.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Narada states that the appearances and disappearances of happiness and sorrow
    cannot be prevented by wisdom, policy, or exertion.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Narada advises a person not to fall from true nature and to protect the Self
    from decrepitude, death, and disease.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mental and physical diseases are described as afflicting the body and dragging
    a helpless, suffering person toward destruction.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Days, nights, and fortnights are described as continuously wasting mortal
    life, with days and nights compared to river currents that do not turn back.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Sun is described as rising and setting every day while continually cooking
    the joys and sorrows of men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Narada says that desired outcomes do not reliably follow intelligence, restraint,
    effort, idleness, or harmful conduct; some succeed without merit or striving,
    while others fail despite effort.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage describes vital seed from sexual congress as sometimes producing
    an embryo and sometimes failing to do so.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Unsuccessful sexual congress is compared to a mango tree that produces many
    flowers but no fruit.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: People who desire children and worship deities may fail to conceive, while
    a person fearing conception as one fears a venomous snake may receive a long-lived
    son.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Some people obtain children after sacrifices and austerities, but those children
    are described as wretches of their race; others obtained through blessed observances
    receive wealth, grain, and other enjoyments from their fathers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The embryo is said to take birth in the womb after sexual congress, and the
    mother is described as being afflicted by it like a calamity.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The embryo resides where eaten food goes and is digested, but the embryo itself
    is not digested there.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:13
  text: Life in the womb is described as a sojourn amid urine and faeces, regulated
    by Nature, with the born creature not free regarding residence there or escape
    from it.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: Some embryos fall from the womb undeveloped, some are born alive, and some
    die in the womb after being quickened with life.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: After the vital breaths cease and the gross body is destroyed, other physical
    forms or another body are described as being ready for the embodied creature to
    enter.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: The transfer from one body to another is compared to one boat going to another
    to transfer passengers.
  category: object
  evidence_refs:
  - ev:6
- id: obs:17
  text: A son or daughter born from the vital fluid later participates in the same
    kind of sexual act when the time comes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: At the end of a person's allotted life, the five primal elements of the body
    cease to be, while the person is said to undergo no change.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:19
  text: Diseased people are compared to little animals assailed by hunters and are
    said to lose the power of rising and moving about.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:20
  text: Physicians, even when skilled, learned, well-equipped with medicines, and
    paid with wealth, may fail to relieve pain and are themselves afflicted by disease.
  category: relationship
  evidence_refs:
  - ev:8
