canonical_text:
  quote: ''
  summary: Utathya instructs Mandhatri that kingship exists for righteousness and
    protection of the world. The passage presents Dharma as dependent on the king,
    warns that unrestrained sin dissolves property, ritual, social, and cosmic order,
    advises honoring Brahmanas, gives Vali as an example of prosperity deserting a
    proud and malicious ruler for Indra, personifies Unrighteousness and Pride, and
    lists calamities and portents arising from heedless rule.
  language: English
  quote_policy: summarized
