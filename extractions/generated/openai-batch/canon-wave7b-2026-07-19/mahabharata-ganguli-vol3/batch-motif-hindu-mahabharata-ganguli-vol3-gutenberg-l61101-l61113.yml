  summary: Bhishma recounts that an illustrious Rishi arrives at White Island, sees
    radiant white men, exchanges worship with them, remains there desiring to behold
    Narayana, practices silent mantra-recitation and difficult vows, stands in Yoga
    with raised arms, and sings a hymn to the Lord of the universe, described as both
    possessing and transcending attributes.
