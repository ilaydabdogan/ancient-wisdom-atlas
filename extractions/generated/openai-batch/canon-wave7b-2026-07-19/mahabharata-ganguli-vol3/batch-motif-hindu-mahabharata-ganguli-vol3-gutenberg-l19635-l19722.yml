canonical_text:
  quote: No limb below the navel should be struck.
  summary: After Duryodhana is struck on the thighs, Rama/Baladeva condemns Bhima
    for violating mace-fight rules and rushes at him with his plough. Krishna restrains
    Rama and argues from kinship, Bhima's vow, Maitreya's curse, and the approaching
    Kali age. Rama rejects the defense, declares Bhima crooked and Duryodhana blessed,
    and describes Duryodhana's battle death as a completed sacrifice. Krishna then
    rebukes Yudhishthira for permitting Bhima to touch the fallen Duryodhana's head
    with his foot; Yudhishthira disapproves but explains his inaction by the prior
    injuries suffered from Dhritarashtra's sons.
  language: English
  quote_policy: quoted
