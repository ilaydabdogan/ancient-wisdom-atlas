canonical_text:
  quote: ''
  summary: Bhishma narrates that a Brahmana travels through forests, lakes, and sacred
    waters to find a Naga. After consulting an ascetic, he reaches the Naga's house
    and announces himself as a guest. The Naga's wife receives him with hospitality.
    The Brahmana explains that he wishes to see her husband. She says the Naga is
    away dragging Surya's car and will return in fifteen days. The Brahmana decides
    to wait on the banks of the Gomati on frugal fare until the Naga returns.
  language: English
