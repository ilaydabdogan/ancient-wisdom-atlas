canonical_text:
  quote: ''
  summary: Sanjaya narrates Ashvatthama's assault on Yudhishthira and allied Pandava
    warriors. Ashvatthama fills the sky with arrows, exchanges volleys with Satyaki,
    Yudhishthira, and the sons of Draupadi, kills Satyaki's driver, devastates Pandava
    troops, and is rebuked by Yudhishthira for acting as a bow-bearing Brahmana. Ashvatthama
    remains silent, covers Yudhishthira with arrows, and Yudhishthira withdraws from
    that spot.
  language: English
  quote_policy: summarized
