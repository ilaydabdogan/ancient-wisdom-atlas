canonical_text:
  quote: ''
  summary: 'Yudhishthira asks Bhishma why Krishna assumed an animal form and what
    deed he accomplished. Bhishma recounts a tale attributed to Kasyapa: Danavas and
    Asuras oppressed the gods and burdened the distressed earth, leading the Adityas
    to petition Brahman. Brahman reveals that Vishnu has assumed a boar form to go
    below the earth and slay the Danavas. Vishnu as the Boar enters the nether regions,
    withstands the demons'' attempts to seize and drag him, roars with a sound that
    stupefies the worlds, and kills the Danavas with his hoofs. The gods ask about
    the sound, and Brahman identifies the boar as the Supreme God, Krishna, Padmanabha,
    creator, upholder, and all-destroying Time.'
  language: English
  quote_policy: summarized
