canonical_text:
  quote: The truth is that the king makes the age.
  summary: Bhishma instructs Yudhishthira that proper royal administration of the
    science of chastisement maintains social duties, prosperity, health, seasonal
    order, and righteous ages, while abandonment of it brings Kali-like disorder,
    suffering, crop failure, and afterlife punishment for the king.
  language: English
  quote_policy: quoted
