canonical_text:
  quote: ''
  summary: Yudhishthira asks for a detailed account of royal duties, the duties of
    the four orders, conduct in distress, and the reconciliation of virtue with kingship.
    Vyasa directs him to consult Bhishma, whose lineage, teachers, knowledge, and
    power over his own death are described. Yudhishthira hesitates because of his
    guilt over the war and Bhishma's death. Vasudeva urges him to cease grieving and
    act for the benefit of the Brahmanas, his brothers, the kings, the people, Draupadi,
    and the world.
  language: English
  quote_policy: summarized
