canonical_text:
  quote: ''
  summary: In a fierce battlefield scene, the Pancalas protect a leading Sini warrior.
    Duhshasana advances against Bhima, and the two warriors fight an intense duel.
    Bhima damages Duhshasana's equipment and kills his driver; Duhshasana then wounds
    Bhima with a gem-decked shaft. Bhima falls as if lifeless but recovers and roars
    like a lion.
  language: English
  quote_policy: summarized
