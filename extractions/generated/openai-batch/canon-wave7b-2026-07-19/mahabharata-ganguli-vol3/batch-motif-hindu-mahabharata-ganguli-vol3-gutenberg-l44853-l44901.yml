  quote: ''
  summary: The passage describes Krishna/Kesava creating time divisions, clouds, mobile
    and immobile beings, the earth, and the four social orders; appointing various
    cosmic rulers; explaining changes in human reproduction across ages; naming peoples
    characterized as sinful; and reporting Narada’s declaration that Krishna is the
    Supreme God and not merely human.
