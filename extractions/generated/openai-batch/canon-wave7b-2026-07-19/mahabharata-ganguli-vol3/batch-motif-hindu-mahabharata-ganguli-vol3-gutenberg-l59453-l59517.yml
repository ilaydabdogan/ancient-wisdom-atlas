canonical_text:
  quote: ''
  summary: Janaka ritually receives Suka with offerings and reverence. Suka explains
    that his father sent him to Janaka to resolve doubts about Pravritti, Nivritti,
    Brahmana duties, and Emancipation. Janaka describes an ordered life of sacred-thread
    investiture, Vedic study, service to the preceptor, household life with domestic
    fire, forest retirement, and final Sannyasa. Suka then asks whether a person already
    purified by scriptural understanding and free from opposites must still pass through
    the life stages in order.
  language: English
  quote_policy: summarized
