- id: obs:3
  text: Bhrigu describes space as unmeasurable even by the gods and as full of blazing,
    self-luminous worlds arranged one above another.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Bhrigu gives a sequence of regions beyond land: oceans of water, darkness,
    water again, and fire; downward, beyond the nether regions, he lists water, the
