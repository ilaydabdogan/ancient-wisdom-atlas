canonical_text:
  quote: ''
  summary: Bhrigu describes an infinite sky and immeasurable layered cosmos containing
    self-luminous worlds, alternating waters and skies, fire, darkness, and a region
    of great snakes. He says divine beings cannot determine the limits of space or
    the elements, and identifies the Infinite, Manasa, as beyond such limits. Bharadwaja
    asks why Brahman is called first if he sprang from the Lotus. Bhrigu replies that
    the Earth is called the Lotus, that it was made as the seat of the form of Manasa
    that became Brahman, that Sumeru formed the Lotus pericarp, and that the Lord
    of the Universe created the worlds from within it.
  language: English
  quote_policy: summarized
