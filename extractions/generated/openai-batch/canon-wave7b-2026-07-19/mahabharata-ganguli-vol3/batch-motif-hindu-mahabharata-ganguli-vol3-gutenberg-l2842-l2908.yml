canonical_text:
  quote: "“Then those two heroes and brothers and foremost of car-warriors encountered
    each other.”"
  summary: Sanjaya narrates a battlefield encounter in which Duryodhana and Yudhishthira
    drive their chariots toward one another, exchange arrows and weapons, and wound
    each other. Yudhishthira eventually fells Duryodhana with a dart, but Bhima reminds
    him that Duryodhana should not be slain by him, so Yudhishthira withholds the
    finishing blow. Kritavarma approaches Duryodhana, and Bhima rushes toward Kritavarma
    as the afternoon battle continues.
  language: English
  quote_policy: quoted
