  quote: Do ye multiply. Let the Vedas spread (through your exertions).
  summary: Vyasa's disciples ask for a boon that no sixth disciple beyond their group
    and the preceptor's son attain fame or possess Vedic radiance. Vyasa responds
    with rules for spreading Vedic instruction to qualified recipients, testing disciples,
    avoiding improper tasks, maintaining proper order in teaching, and warning against
    unrighteous seeking or communication of knowledge.
