canonical_text:
  quote: Taking half of their energies from all of them, he became superior in might.
  summary: Duryodhana reports that the celestials assent to the god of gods. After
    taking half of their energies, Sankara becomes superior in might and is called
    Mahadeva. Mahadeva then promises to arm himself with bow and shaft, fight from
    his car, slay the gods' foes, and cast the Asuras down to Earth.
