canonical_text:
  quote: '"Earth, Wind, Space, Water, and Light forming the fifth, are the great essences."'
  summary: 'Bhishma explains Adhyatma through a cosmological and psychological account:
    the five great essences produce and receive back creatures, the Supreme Deity
    combines them with qualities and mental principles, the senses and understanding
    function within embodied life, and wisdom comes from knowing these relations.'
  language: English
  quote_policy: quoted
