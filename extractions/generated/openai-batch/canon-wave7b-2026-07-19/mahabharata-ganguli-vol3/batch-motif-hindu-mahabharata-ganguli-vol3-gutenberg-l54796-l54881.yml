canonical_text:
  quote: Righteousness earned by acts is supreme benefit both in this world and the
    next.
  summary: Yudhishthira asks Bhishma what acts are beneficial here and hereafter.
    Bhishma recounts an older exchange in which Janaka asks Parasara the same question.
    Parasara teaches that righteousness expressed through acts is the highest benefit,
    that social duties and livelihoods are ordained, that beings experience the fruits
    of their own actions across lives, and that virtues such as self-restraint, forgiveness,
    truthfulness, and non-injury produce happiness.
  language: English
  quote_policy: quoted
