canonical_text:
  quote: '"Chastisement having disappeared, a great confusion set in among all creatures."'
  summary: Vasuhoma explains the origin and transmission of Chastisement. Brahman
    conceives Kshupa in his head to serve as priest for a sacrifice; when Chastisement
    disappears during the sacrifice, social and moral confusion arises. Brahman appeals
    to Vishnu, who manifests Chastisement, and Saraswati creates the Science of Chastisement.
    Divine and cosmic rulers are appointed, and the rod of chastisement is transmitted
    through gods, sages, regents, Kshupa, Manu, and Manu's sons, with instructions
    that punishment be discriminating and righteous.
  language: English
  quote_policy: quoted
