canonical_text:
  quote: ''
  summary: 'Bhrigu describes the conduct of forest recluses and Parivrajakas: forest
    ascetics seek virtue through seclusion, austerity, ablutions, libations, and endurance;
    wandering renunciants abandon household ties and possessions, practice equality,
    non-injury, alms-taking, taciturnity, and an internalized fire ritual. The passage
    states that these disciplines lead to felicity, Emancipation, and attainment of
    Brahma. Bharadwaja then asks about an unseen region beyond the inhabited one.'
  language: English
  quote_policy: summarized
