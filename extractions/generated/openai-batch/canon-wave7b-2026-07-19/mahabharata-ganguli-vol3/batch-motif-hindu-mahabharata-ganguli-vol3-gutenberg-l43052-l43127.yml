canonical_text:
  quote: That mode of life is regarded as the root of all the others.
  summary: 'Bhrigu explains life modes indicated by Brahman: residence with a preceptor,
    domestic life, and forest-life. He details student discipline, household duties,
    support of other modes, hospitality to wandering guests, ritual obligations to
    deities, ancestors, sages, and Creator, ethical speech, permissible domestic enjoyments,
    and the possibility of attaining heaven through virtuous conduct.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Bhrigu states that the divine Brahman indicated four modes of life for the
    benefit of the world and the protection of righteousness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first mode is residence in the preceptor's abode, involving purity of
    conduct, Vedic rites, restraints, vows, humility, and worship of twilights, the
    Sun, sacred fire, and deities.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The resident student is instructed to practice celibacy, perform ablutions
    three times daily, attend the sacred fire, serve the preceptor, go for alms, and
    give the whole alms to the preceptor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A verse says that a Brahmana who obtains the Veda through reverent attendance
    upon his preceptor attains heaven and the fruition of desires.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The domestic mode is second and is ordained for those who return home after
    residence with a preceptor, with spouses in their company; in it Virtue, Wealth,
    and Pleasure may be obtained.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The householder may acquire wealth by irreproachable acts, Vedic recitation,
    means used by regenerate Rishis, produce of mountains and mines, or offerings
    associated with sacrifices and vows.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The domestic mode is described as the root of the others because students,
    mendicants, and vow-observers derive support and ritual offerings from it.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The third mode is Forest-life; its practitioners do not store wealth or articles,
    study the Vedas, and roam the earth to tirthas and diverse realms.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hospitality toward such visitors includes rising, advancing, sincere sweet
    speech, gifts, seats, beds, and excellent food; an unfulfilled guest is said to
    take the householder's merits and leave misdeeds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the domestic mode, deities are gratified by sacrifices, Pitris by obsequial
    rites, Rishis by Vedic knowledge and instruction, and the Creator by begetting
    children.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage directs affectionate and agreeable speech toward all creatures
    and censures injury, mortification, harsh words, insult, arrogance, deceit, wrath,
    and falsehood.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Domestic life permits garlands, ornaments, robes, perfumes, music, pleasing
    sights, foods and drinks, sports, amusements, and desire-gratification; virtuous
    observance is said to lead to happiness and a virtuous end, and even a grain-picking
    householder without sensual attachment may obtain heaven.
  category: sequence
  evidence_refs:
  - ev:9
