canonical_text:
  quote: ''
  summary: After Narada falls silent, Yudhishthira is overcome with grief. Kunti tells
    him that she and the god Surya had tried to inform Karna of his brothership with
    Yudhishthira and persuade him to unite with the Pandavas, but failed. Yudhishthira
    blames Kunti’s concealment for the affliction and curses all women to be unable
    to keep secrets, then sinks further into grief and despair.
