canonical_text:
  quote: ''
  summary: Gandhari, empowered by vows and Vyasa's boon, sees the distant Kurukshetra
    slaughter with a spiritual eye. Dhritarashtra, the sons of Pandu, Vasudeva, and
    the Kuru women proceed to the battlefield, where bereaved women find slain kin
    among corpses, blood, weapons, scavenging animals, ghosts, Pishacas, and Rakshasas.
    Gandhari addresses Keshava and describes the widows, mothers, fallen heroes, ornaments,
    weapons, and corpse-devouring creatures, while speaking from intense grief.
  language: English
  quote_policy: summarized
