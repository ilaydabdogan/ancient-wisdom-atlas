- id: obs:3
  text: The Kuru ladies, grieving and crying, offer water oblations to dead sires,
    grandsons, brothers, kinsmen, sons, seniors, husbands, and friends.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The crowded shore is described as broad as the ocean and marked by sorrow
    and cheerlessness.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kunti tells her sons that the warrior they had regarded as Radha's son, Karna,
    was their eldest brother.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kunti says Karna was born of her by the god of day, with a pair of earrings
    and clad in armor, and that he resembled Surya in splendor.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Pandavas grieve more intensely after hearing Kunti's disclosure.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Yudhishthira asks how Kunti could conceal Karna and compares the concealment
    to hiding fire within the folds of a cloth.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Yudhishthira states that the concealment caused ruin and that the destructive
    Kuru carnage would not have occurred if Karna's identity had been known.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Yudhishthira offers water oblations to his deceased elder brother Karna.
  category: action
  evidence_refs:
  - ev:9
