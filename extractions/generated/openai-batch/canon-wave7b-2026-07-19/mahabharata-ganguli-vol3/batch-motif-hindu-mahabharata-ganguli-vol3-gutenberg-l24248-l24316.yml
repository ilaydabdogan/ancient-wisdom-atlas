canonical_text:
  quote: ''
  summary: At the sacred Ganga, grieving Kuru women perform water oblations for dead
    relatives, husbands, and friends. Kunti reveals to the Pandavas that Karna, slain
    by Arjuna, was her eldest son born by the god of day and born with earrings and
    armor. Yudhishthira laments the concealment and the kin-slaying, then performs
    water rites for Karna with Karna's family and rises from the Ganga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The party arrives at the auspicious Ganga, described as full of sacred water,
    with lakes, high banks, broad shores, and a vast bed.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kuru ladies cast off ornaments, upper garments, belts, and girdles before
    performing rites.
  category: action
  evidence_refs:
