canonical_text:
  quote: '"one''s union however, with wives and other friends is like that of travellers
    in an inn"'
  summary: The passage teaches that medicine, chemistry, ascetic merit, study, charity,
    and sacrifice cannot prevent decrepitude and death. Time does not return, human
    companionship is temporary, and heaven and hell are not directly seen; scripture
    is presented as the guide for virtuous conduct. A prescribed life sequence of
    Brahmacharya, procreation, and sacrifice repays debts to ancestors, gods, and
    humans. A virtuous king who acts according to scripture gains wide renown. The
    ruler of Videhas is freed from grief after hearing these words, and the addressed
    son of Kunti is told to abandon grief and enjoy the earth won through Kshatriya
    duty.
  language: English
  quote_policy: quoted
