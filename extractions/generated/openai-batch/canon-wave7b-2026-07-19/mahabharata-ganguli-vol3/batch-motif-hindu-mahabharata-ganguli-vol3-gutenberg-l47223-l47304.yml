canonical_text:
  quote: ''
  summary: Sakra/Indra addresses the bound son of Virochana, praises his unmoved understanding
    before Indra’s thunderbolt and Varuna’s nooses, and expounds on Time as an inescapable
    force that burns, cooks, measures, and sweeps away all beings and possessions.
    Indra says he is moved by compassion for the enlightened captive and that Varuna’s
    bonds will loosen only when social and ritual disorder arise among humans. Indra
    then departs on his elephant, rejoices after vanquishing the Asuras, is praised
    by Rishis and Brahmanas, and returns happily to heaven while sacrificial fire
    again receives clarified butter.
  language: English
  quote_policy: summarized
