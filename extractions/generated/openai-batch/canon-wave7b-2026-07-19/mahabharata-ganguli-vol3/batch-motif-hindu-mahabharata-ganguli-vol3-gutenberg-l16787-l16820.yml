canonical_text:
  quote: ''
  summary: The passage explains that Candramas bathes at Prabhasa on the new moon
    and regains form, beauty, and effulgence, giving the tirtha its name. Baladeva
    travels to Chamasodbheda and Udapana, gives gifts, worships Brahmanas, and bathes.
    Udapana is described as a place where the Sarasvati is outwardly lost but known
    by accomplished ascetics to flow invisibly underground. The passage then introduces
    Trita, an ascetic formerly resident there, who was thrown into a pit by his two
    brothers, drank Soma in the pit, and cursed them. Janamejaya asks for the origin
    of Udapana and for the details of Trita’s fall, sacrifice, and drinking of Soma.
  language: English
  quote_policy: summarized
