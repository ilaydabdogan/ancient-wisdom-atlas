canonical_text:
  quote: ''
  summary: 'Vrihaspati instructs King Vasumanas on royal power: a king may be described
    as taking divine forms when he destroys, punishes, rewards, gives wealth, or removes
    it. The passage warns against offending the king or appropriating royal property,
    praises loyal service and proper ministers, and states that a self-controlled
    king who rules rightly and performs sacrifices attains heaven.'
  language: English
  quote_policy: summarized
