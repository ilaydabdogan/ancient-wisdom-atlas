  quote: ''
  summary: Sanjaya reports extensive battlefield deaths on Dhritarashtra's side, culminating
    in Arjuna's single-combat killing of Karna. The feat is compared to several mythic
    slayings by gods or heroes. Sanjaya then frames the destruction as the fruit of
    evils associated with Dhritarashtra's sons, and Dhritarashtra asks for the names
    of Pandava-side warriors slain by his side.
