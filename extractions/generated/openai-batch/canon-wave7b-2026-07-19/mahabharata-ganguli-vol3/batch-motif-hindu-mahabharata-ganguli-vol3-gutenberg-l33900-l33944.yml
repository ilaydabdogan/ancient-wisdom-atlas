canonical_text:
  quote: ''
  summary: Bhishma cites an old battle story in which Janaka of Mithila shows his
    warriors heavenly regions for fearless fighters and hellish regions for those
    who flee. He exhorts them to risk life in battle, after which they defeat their
    foes. Bhishma then gives Yudhishthira advice on battle array, restrained pursuit,
    and the supreme value of heroism.
  language: English
  quote_policy: summarized
