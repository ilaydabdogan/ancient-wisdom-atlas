canonical_text:
  quote: '"everything should be applied to sacrifices."'
  summary: Vaisampayana reports that the ascetic Devasthana advises Yudhishthira not
    to abandon the earth he has won, but to pass through the prescribed modes of life
    and use wealth for sacrifice. Devasthana argues that wealth was created for sacrifice,
    warns against misdirected charity, and cites Indra, Mahadeva, Marutta, and Harischandra
    as examples of beings who gained supremacy, merit, or happiness through sacrifices
    and gifts.
  language: English
  quote_policy: quoted
