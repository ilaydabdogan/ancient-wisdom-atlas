  quote: ''
  summary: Bhishma reports a dialogue in which Janamejaya confesses sinful conduct
    to Saunaka, fears Yama and hell, asks for instruction and protection, receives
    Saunaka's teaching on wisdom, repentance, Brahmanas, and righteousness, and finally
    swears not to injure Brahmanas again.
