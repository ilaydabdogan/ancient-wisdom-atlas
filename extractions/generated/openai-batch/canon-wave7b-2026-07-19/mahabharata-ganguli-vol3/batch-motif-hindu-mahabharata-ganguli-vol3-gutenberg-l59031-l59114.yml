canonical_text:
  quote: only acts will accompany you along that road.
  summary: A didactic speaker instructs a son that only one's own acts accompany one
    after death; righteous deeds lead to felicity, heaven, or Emancipation, while
    wicked deeds lead to hell. The son is urged to gather righteousness, recognize
    the solitary journey to Yama, break worldly bonds, seek the soul hidden in a cave,
    and practice renunciation and penance before death arrives.
  language: English
  quote_policy: quoted
