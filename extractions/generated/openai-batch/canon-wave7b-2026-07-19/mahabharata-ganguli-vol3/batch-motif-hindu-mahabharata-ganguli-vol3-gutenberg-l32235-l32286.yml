canonical_text:
  quote: ''
  summary: 'Bhishma instructs Yudhishthira that a king should privately hear and protect
    a person who reports embezzlement from the royal treasury, since guilty ministers
    may combine to destroy such informants. He supports the instruction with an old
    story: the sage Kalakavrikshiya travels through King Kshemadarsin''s realm with
    a caged crow, claiming corvine knowledge of past, present, and future, and uses
    this claim to expose corrupt officers. The accused officers kill the crow at night.
    The sage then seeks the king''s protection and permission to speak for the king''s
    good, and the king grants it.'
  language: English
  quote_policy: summarized
