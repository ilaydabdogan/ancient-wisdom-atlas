canonical_text:
  quote: ''
  summary: Janamejaya asks what conversation occurred after the slaughter while Bhishma
    lay on a hero's bed. Vaisampayana narrates that sages, Siddhas, surviving kings,
    the Pandavas, Dhritarashtra, and Krishna came to Bhishma's bed of arrows and lamented.
    Narada urges them to ask Bhishma about morality and religion before he dies. Yudhishthira
    asks Krishna to speak first. Krishna asks Bhishma about his pain, mind, and knowledge.
    Bhishma replies that, through Krishna's grace and boon, pain has left him, his
    understanding is clear, he perceives past, present, and future, he remembers many
    kinds of duties, and he is ready to discourse for the world's benefit.
  language: English
  quote_policy: summarized
