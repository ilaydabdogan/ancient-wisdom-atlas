canonical_text:
  quote: The creature that dies only goes into another form. The body alone dissolves
    away.
  summary: Bhrigu teaches that the living creature is not destroyed when the body
    dissolves, comparing its invisibility after death to fire that is no longer seen
    after fuel is consumed. Bharadwaja challenges the fire analogy and asks how the
    living agent can be known in bodies made of the five elements, especially when
    perception depends on mind and ceases in sleep. Bhrigu explains life through heat,
    breath, space, and the dissolution of elements.
  language: English
  quote_policy: quoted
