canonical_text:
  quote: ''
  summary: Karna disarms Nakula, places his bow around Nakula's neck, rebukes him,
    and spares him after recalling Kunti's words. Nakula returns ashamed to Yudhishthira.
    Karna then attacks the Pancala and Pandava forces at noon, causing widespread
    destruction among warriors, elephants, horses, and chariots; the passage repeatedly
    compares his violence to fire, including the Yuga fire and the scorching midday
    sun.
  language: English
