canonical_text:
  quote: Covered all over with blood, he seemed then to be Death himself commissioned
    by time.
  summary: Ashvatthama, son of Drona, stealthily enters the Pandava-allied camp, finds
    Dhrishtadyumna and other exhausted warriors asleep, and kills them by kicks, a
    divine weapon, and sword blows. Witnesses and awakened warriors repeatedly perceive
    him as superhuman or Rakshasa-like, while the narration likens his blood-covered
    form to Death.
  language: English
  quote_policy: quoted
