canonical_text:
  quote: I have nothing (in this world), yet I live in great happiness.
  summary: Yudhishthira laments the killing of kin and asks Bhishma how to dispel
    the thirst for wealth. Bhishma replies with an old narrative in which the ruler
    of the Videhas teaches Mandavya that possessions and desire cause sorrow, that
    wealth should be used for virtue, and that casting off desire, attachments, and
    paired opposites brings tranquillity and felicity; Mandavya rejoices and takes
    the path of Emancipation.
  language: English
  quote_policy: quoted
