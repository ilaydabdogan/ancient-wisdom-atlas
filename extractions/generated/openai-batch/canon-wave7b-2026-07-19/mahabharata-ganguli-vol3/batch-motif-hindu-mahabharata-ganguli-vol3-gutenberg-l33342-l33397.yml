canonical_text:
  quote: Do thou act righteously. There is nothing superior to righteousness.
  summary: Yudhishthira asks Bhishma how a righteous king should behave. Bhishma answers
    by citing an old story in which King Vasumanas asks the Rishi Vamadeva for instruction,
    and Vamadeva teaches that righteous rule, good counsel, self-control, generosity,
    and attention to virtue bring prosperity, while force, caprice, bad counsel, and
    harshness lead to destruction and hell.
  language: English
  quote_policy: quoted
