  summary: 'Vidura instructs the king on means by which the wise free themselves from
    worldly ties: life is described through images of a long road, forest, beasts,
    slough, chariot, wheel, medicine, and divine steeds; self-restraint, wisdom, harmlessness,
    and compassion lead beyond repeated rebirth toward Brahman or the realm of Vishnu.'
