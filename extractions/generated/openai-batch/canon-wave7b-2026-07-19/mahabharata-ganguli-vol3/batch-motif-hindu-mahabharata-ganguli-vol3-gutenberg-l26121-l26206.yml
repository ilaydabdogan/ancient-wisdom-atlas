canonical_text:
  quote: ''
  summary: 'Vaisampayana reports Krishna-Dwaipayana instructing Yudhishthira on kingly
    duty after hardship in the woods: rule, enjoy lawful aims, discharge debts, perform
    sacrifices, protect subjects, restrain foes, and follow scripture. The sage then
    gives the example of the ancient king Hayagriva, whose dutiful battle-death is
    described as a sacrifice and followed by heavenly reward.'
  language: English
  quote_policy: summarized
