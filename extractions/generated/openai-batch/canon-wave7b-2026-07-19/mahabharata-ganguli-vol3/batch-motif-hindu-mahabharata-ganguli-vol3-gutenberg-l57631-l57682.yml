  quote: ''
  summary: Yajnavalkya teaches Janaka about the three attributes of Prakriti, the
    relation of Purusha and Prakriti, the destinies associated with mixtures of attributes
    and conduct, and the state beyond birth and death. Janaka then asks for fuller
    instruction on emancipation, Purusha, Prakriti, Sankhya, Yoga, destinations after
    death, and symptoms of death.
