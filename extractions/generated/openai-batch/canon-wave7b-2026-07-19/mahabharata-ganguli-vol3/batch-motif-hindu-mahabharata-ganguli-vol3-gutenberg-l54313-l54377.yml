canonical_text:
  quote: '"Living creatures always stand in fear of sorrow and death."'
  summary: Yudhishthira asks Bhishma how sorrow and death may be prevented. Bhishma
    cites an old dialogue in which Narada questions Samanga about his freedom from
    sorrow, and Samanga explains that knowledge of time, acts and their fruits, impermanence,
    disciplined conduct, Yoga, detachment, and penance make him untroubled by grief
    and fearless before death.
  language: English
  quote_policy: quoted
