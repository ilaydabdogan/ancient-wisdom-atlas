canonical_text:
  quote: ''
  summary: Vyasa gives a doctrinal exposition on the subtle soul, disembodied beings,
    yogic perception, dream-experience, gestation, the obscuring effects of Rajas
    and Tamas, and the yoga-centered knowledge that culminates in beholding high Brahma.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vyasa is the named speaker of the teaching.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Persons conversant with scripture are said to behold the subtle Soul with
    the aid of scripturally prescribed acts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Beings freed from gross bodies are described as wandering in the universe
    and as being beyond ordinary human sight, like sun-rays that are not seen by the
    naked eye but inferred by reason.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage compares the Yogin’s perception of the self within gross bodies
    to the sun’s disc reflected as a counter-image in water.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Yogins who have subjugated their senses and possess knowledge of the soul
    are said to perceive souls in subtle forms and invisible beings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Those applying themselves to Yoga are said to control the linga form after
    casting off mental creations, Rajas born of acts, and even the puissance produced
    by Yoga.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Jiva dwelling in such Yogins is described as accompanied by seven subtle
    entities and as roving in regions of bliss; the text qualifies that the linga
    form is ultimately terminable.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A person still under the influence of mind and understanding is described
    as distinguishing bodies and experiencing pleasure, pain, wealth, merit, happiness,
    and misery in dreams as in waking life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Jiva is described as lying in the uterus for ten months amid internal
    heat without being digested like food in the stomach.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: People overwhelmed by Rajas and Tamas are said not to behold the Jiva-soul
    within the gross body and heart.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Those who resort to the science of Yoga seek knowledge of the Soul that transcends
    the gross body, linga body, and karana body; the karana body is said not to be
    destroyed even at universal destruction.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Yoga-foremost duties involving cessation of the operations of mind and understanding
    are said to have been laid down by Sandilya in the Chandogya Upanishad.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: After comprehending the seven subtle entities, the Supreme cause with six
    attributes, and the universe as a modification of Avidya with three qualities,
    one is said to behold high Brahma through scriptural guidance.
  category: sequence
  evidence_refs:
  - ev:8
