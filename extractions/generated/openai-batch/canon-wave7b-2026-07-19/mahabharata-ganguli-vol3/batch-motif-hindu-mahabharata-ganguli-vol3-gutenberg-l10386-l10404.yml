  quote: ''
  summary: Arjuna tells Krishna that his victory is certain because Krishna, master
    of the worlds, is pleased with him. He urges Krishna to drive the steeds and declares
    that he will either slay Karna or be slain by Karna. He describes the approaching
    battle as world-stupefying and memorable. Arjuna then advances in his chariot
    toward Karna, repeats his request for haste, and Krishna wishes him victory and
    drives the swift steeds until Arjuna's car reaches Karna's front.
