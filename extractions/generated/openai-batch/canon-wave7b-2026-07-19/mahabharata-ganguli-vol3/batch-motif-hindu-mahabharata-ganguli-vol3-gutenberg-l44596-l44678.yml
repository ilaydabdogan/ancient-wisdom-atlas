canonical_text:
  quote: The remedy for sorrow is abstention from brooding over it.
  summary: Manu teaches that sorrow obstructs yoga and should be met by wisdom and
    practical remedies. He describes detachment from transient goods, withdrawal of
    mind and understanding from sense-objects, contemplation of attributeless Brahma,
    the created condition of living beings, and the contrast between rebirth through
    attachment and Knowledge or Brahma through emancipation.
  language: English
  quote_policy: quoted
