canonical_text:
  quote: ''
  summary: Bhishma recounts how the ascetic Jajali practices severe austerities, remains
    motionless while birds nest, lay eggs, hatch, and mature on his head, then becomes
    proud after the birds leave. An invisible voice declares that Jajali is not equal
    in righteousness to Tuladhara of Baranasi, prompting Jajali to seek him out. Tuladhara,
    a shopkeeper, receives Jajali respectfully.
  language: English
  quote_policy: summarized
