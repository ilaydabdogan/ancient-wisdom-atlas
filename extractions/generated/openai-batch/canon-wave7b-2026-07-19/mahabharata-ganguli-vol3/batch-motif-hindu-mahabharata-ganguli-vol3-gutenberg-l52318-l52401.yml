canonical_text:
  quote: ''
  summary: Asita instructs Narada on the five primal essences, Time/Kala, past acts,
    and ignorance as causes of creation, birth, destruction, and dissolution. The
    passage maps the body and senses to elemental causes, describes sense perception
    as mediated by the Soul, ranks inner faculties from Chitta through Manas and Buddhi
    to Kshetrajna, explains organs of action, and distinguishes waking, dream, and
    dreamless sleep, ending with an enumeration of embodied constituents and the eternal
    body-owner.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Asita speaks to Narada and says that the Supreme Soul creates all creatures
    from five great essences when moved by desire for existence in manifold forms.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Time, impelled by the Understanding, creates other objects
    from the five primal essences.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The five primal essences are named as Water, Space, Earth, Wind, and Heat;
    with Kala as sixth, they are said to possess mighty energy.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage identifies the five essences, Kala or Jiva, potencies of past
    acts, and ignorance as eight eternal causes of the birth and destruction of creatures.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: When creatures are destroyed they enter these causes; when they take birth
    they arise from them again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The body is said to be made of earth; the ear to originate in space; the eye
    to have light for its cause; life or motion to be of wind; and blood to be of
    water.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The senses are listed as two eyes, nose, two ears, skin, and tongue, with
    the functions of seeing, hearing, smelling, touching, and tasting.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Form, scent, taste, touch, and sound are listed as five properties, and the
    passage says the inert senses do not truly apprehend them; the Soul apprehends
    them through the senses.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage ranks Chitta above the senses, Manas above Chitta, Buddhi above
    Manas, and Kshetrajna above Buddhi.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The five senses, Chitta, Mind, and Understanding are regarded as organs of
    knowledge.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The hands, feet, anal duct, membrum virile, mouth, and muscular power are
    described as organs of action.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: When the organs become fatigued and cease their functions, the owner of the
    organs is said to sleep.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: If the organs are suspended but the mind continues to concern itself with
    objects, the condition is called dream.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage says the mind has states connected with Goodness, Passion, and
    Darkness during both waking and dreaming.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:15
  text: The passage describes dreamless slumber as the state in which waking notions
    and dream notions become directly apprehensible, and calls it eternal and desirable.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:16
  text: An enumeration reaches seventeen with the organs, muscular power, mind, understanding,
    Chitta, and three attributes; the eighteenth is the body-owner, who is said to
    be eternal.
  category: relationship
  evidence_refs:
  - ev:7
