canonical_text:
  quote: ''
  summary: Brahma praises the Supreme Purusha as the origin, refuge, and inner soul
    of beings, recounting repeated births from him and saying the Vedas, his eyes,
    have been taken away. The Supreme Lord awakens from Yoga-sleep, assumes an effulgent
    equine-headed cosmic form, descends to the nether regions, chants Vedic sounds
    to draw away the Asuras, recovers the Vedas, and returns them to Brahma. Madhu
    and Kaitabha return, find the Vedas gone, rise to the waters where the Lord sleeps
    on a snake hood, awaken him, and prepare for battle.
  language: English
  quote_policy: summarized
