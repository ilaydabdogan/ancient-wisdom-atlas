canonical_text:
  quote: ''
  summary: Bhishma introduces an old tale about a forest ascetic whose goodness draws
    wild animals to him. A devoted dog lives at the ascetic's feet. When a leopard
    threatens the dog, the sage transforms the dog into a leopard; when a tiger later
    threatens it, the sage transforms it into a tiger. The transformed animal then
    abandons its former diet and lives by hunting other forest animals.
  language: English
  quote_policy: summarized
