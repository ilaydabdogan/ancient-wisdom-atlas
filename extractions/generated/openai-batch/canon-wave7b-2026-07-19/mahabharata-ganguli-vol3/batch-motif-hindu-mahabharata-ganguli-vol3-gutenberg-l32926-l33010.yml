canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma how a wealthy king who desires more should behave.
    Bhishma instructs that a king seeking merit should protect subjects and obtain
    revenue gradually, mildly, and seasonably, using animal and pastoral analogies.
    He also advises restraining sources of disorder, preventing sin and robbery, punishing
    over-exacting officers, supporting productive labor, honoring wealthy and capable
    subjects, and ruling with truth, sincerity, non-wrath, non-injury, friends, treasury,
    forces, and chastisement.
  language: English
  quote_policy: summarized
