canonical_text:
  quote: As the tortoise stretches its limbs and withdraws them again, even so the
    Supreme Soul creates all objects and again withdraws into Himself.
  summary: Bhishma answers an inquiry about Adhyatma by explaining creation and destruction,
    the five primal elements, the senses, mind, understanding, soul, intelligence,
    and the three qualities of Goodness, Passion, and Darkness.
  language: English
  quote_policy: quoted
