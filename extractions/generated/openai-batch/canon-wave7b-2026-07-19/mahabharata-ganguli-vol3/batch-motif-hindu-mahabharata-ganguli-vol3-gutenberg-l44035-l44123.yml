canonical_text:
  quote: ''
  summary: Virupa and Vikrita dispute before a king about whether a gift of religious
    reward creates a debt. Virupa recounts a chain of cow-gifts and transferred merit;
    Vikrita refuses repayment on the grounds that a gift once given cannot be taken
    back. A Brahmana presses the king to accept pledged fruits of Gayatri recitation,
    and the king accepts while offering a reciprocal gift for equality. Virupa then
    reveals that the disputants are Desire and Wrath and says that Time, Dharma, Mrityu,
    and they have examined the king through the dispute.
  language: English
  quote_policy: summarized
