canonical_text:
  quote: ''
  summary: A vulture and a jackal address grieving men at a crematorium where a dead
    child lies. The vulture argues that the corpse is lifeless, that beings experience
    results of their own acts, and that Time and Death affect all; he urges the mourners
    to leave. The jackal counters that affection should not be abandoned and urges
    the mourners to remain until evening twilight. The vulture again denies that the
    dead revive, says the child's life has entered a new body, and the men prepare
    to leave, while the jackal returns and looks upon the dead child.
  language: English
  quote_policy: summarized
