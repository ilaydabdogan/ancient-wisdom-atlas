canonical_text:
  quote: ''
  summary: The Swan addresses immortal hearers and gives a didactic discourse on penance,
    truth, self-restraint, control of speech and anger, forgiveness under insult or
    assault, the loss of merit through anger, and the attainment of heaven or immortality
    through truth and disciplined conduct. The passage closes with similes involving
    a calf, a ship crossing the ocean, and cloth taking dye from its surroundings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Swan addresses hearers described as having drunk Amrita and recommends
    penances, self-restraint, truth, subjugation of the mind, and control over agreeable
    and disagreeable things.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speech warns against cruel and painful words and describes harmful speech
    as shafts falling from the lips and striking the vitals of the person addressed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speech instructs the wise or righteous person to answer insult, assault,
    calumny, or provocation with peace, forgiveness, and non-retaliation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that anger makes sacrifice, gifts, penance, offerings,
    and libations fruitless, and that Yama robs the merits of acts performed in anger.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Truth, self-restraint, and emancipation are arranged in a hierarchical relationship,
    and self-restraint is also called the door of immortality.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'A Brahmana and Muni is defined as one who subdues impulses of speech, wrath,
    thirst, the stomach, and the organ of pleasure; another formulation names four
    restrained doors: the organ of pleasure, stomach, arms, and speech.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says that one who practices virtues, studies the Vedas, does not
    covet others' property, and pursues the good attains heaven; it compares devotion
    to virtues to a calf sucking four teats.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Truth is compared to a ship as the means for reaching heaven, and a person
    is said to take on the qualities of those with whom they dwell or whom they revere,
    like cloth taking dye.
  category: relationship
  evidence_refs:
  - ev:8
