  text: Sanjaya reports that Duryodhana has been slain or brought down by Bhimasena
    in battle, and that the Pandavas with Krishna are delighted.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Pancalas and Srinjayas celebrate by waving garments, roaring, stretching
