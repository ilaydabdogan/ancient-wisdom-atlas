canonical_text:
  quote: ''
  summary: Sanjaya reports that after Bhimasena brings down Duryodhana, the Pandavas
    and their allies rejoice and praise Bhima, comparing the feat to Indra's defeat
    of Vritra. Krishna rebukes the victors for speaking cruelly over a fallen foe
    and urges them to depart. Duryodhana, in pain, half-rises, glares at Krishna,
    and accuses him of securing victory through unfair stratagems.
  language: English
  quote_policy: summarized
