canonical_text:
  quote: ''
  summary: Arjuna recounts an old discourse in which well-born Brahmana youths leave
    home for forest ascetic life. Sakra/Indra, moved by compassion, takes the form
    of a golden bird and instructs them that true sacrificial remnants belong to householders
    who serve gods, guests, Rishis, kinsmen, and ancestors. He praises domestic duties,
    Vedic rites, gifts, and sacrificial action as paths to success and heaven. The
    ascetics abandon renunciation and take up domestic life, and Arjuna uses the account
    to advise a monarch to rule the world.
  language: English
  quote_policy: summarized
