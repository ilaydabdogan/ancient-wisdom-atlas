canonical_text:
  quote: ''
  summary: After the war, the sons of Pandu, Vidura, Dhritarashtra, and the Bharata
    ladies remain on the banks of the sacred stream after offering water oblations
    for their dead friends and kinsmen. Yudhishthira performs the water rites and
    observes a month of mourning outside the Kuru city. Many sages and Brahmanas arrive,
    are worshipped, sit around the grieving king, and console him. Narada addresses
    Yudhishthira, saying that through his arms and the grace of Madhava the Earth
    has been righteously won, and asks why, after surviving battle and defeating his
    foes, he remains afflicted by grief.
  language: English
  quote_policy: summarized
