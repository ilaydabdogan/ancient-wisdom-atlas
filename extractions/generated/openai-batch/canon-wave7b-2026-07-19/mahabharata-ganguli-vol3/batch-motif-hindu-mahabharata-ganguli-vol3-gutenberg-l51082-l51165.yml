canonical_text:
  quote: ''
  summary: Chirakarin reflects on a paternal command to slay his mother, arguing that
    the mother is inviolable and that guilt in the episode belongs to the male offender
    rather than to his mother. His long reflection delays the command. Gautama returns
    repentant, recounts that Indra/Purandara came in disguise, received hospitality,
    and misbehaved toward Ahalya. Gautama blames his own error and hopes Chirakarin's
    habitual delay will rescue the family from grave sin.
  language: English
  quote_policy: summarized
