canonical_text:
  quote: ''
  summary: Yajnavalkya teaches a king a set of correspondences among bodily faculties,
    their functions or objects, and presiding divine or cosmic principles. He then
    describes the Supreme, Prakriti, Purusha, the multiplication of the three Gunas,
    and the qualities associated with Sattwa, Rajas, and Tamas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yajnavalkya speaks to a king and reports what Brahmanas conversant with topics
    of enquiry say about Adhyatma, Adhibhuta, and Adhidaivata.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage maps bodily organs and faculties to their functions or objects
    and to presiding divine or cosmic correlates, including feet and walking with
    Vishnu, speech and words with Agni, sight and form with Surya, tongue and taste
    with Water, and other listed correspondences.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yajnavalkya says he has explained the puissance of the Supreme in manifesting
    in different forms in the beginning, middle, and end.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Prakriti is described as producing thousands of combinations of her transformations
    called Gunahs by modifying herself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The multiplication of Prakriti is compared to lighting thousands of lamps
    from a single lamp.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The qualities of Sattwa are enumerated and include patience, joy, satisfaction,
    purity, faith, liberality, compassion, forgiveness, equanimity, truth, modesty,
    calmness, fearlessness, and concern for others.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The qualities of Rajas are enumerated and include pride, assertion of lordship,
    war, refusal to give, absence of compassion, quarrels, arrogance, anxiety, hostility,
    sorrow, crookedness, lust, wrath, malice, and calumny.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The qualities of Tamas are enumerated and include stupefied judgment, obscured
    faculties, darkness, blind darkness, greed for food, ceaseless appetite, pleasure
    in scents, robes, sports, beds, seats, sleep by day, calumny, heedless acts, entertainment
    pursued from ignorance, and aversion to religion.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Within the description of Tamas, darkness is said to imply death and blind
    darkness is said to mean wrath.
  category: relationship
  evidence_refs:
  - ev:5
