canonical_text:
  quote: ''
  summary: A swan and a crow challenge one another in flight. The crow displays many
    flight styles while the swan continues in one slow motion. After the swan flies
    rapidly westward over the ocean, the crow becomes afraid and exhausted because
    there are no trees or islands on which to rest. The swan waits for the crow and
    addresses him while the crow is about to sink, intending to rescue him in accordance
    with good conduct.
