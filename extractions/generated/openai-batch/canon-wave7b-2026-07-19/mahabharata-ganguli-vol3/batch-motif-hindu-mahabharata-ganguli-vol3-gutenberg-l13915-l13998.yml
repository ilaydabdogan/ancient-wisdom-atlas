canonical_text:
  quote: ''
  summary: Sanjaya narrates a battlefield sequence in which Duryodhana and Dhrishtadyumna
    exchange arrows, Shikhandi fights Kritavarma and Kripa, and Shalya, ruler of the
    Madras, resists repeated attacks by Pandava-side heroes including Nakula, Sahadeva,
    Yudhishthira, Bhima, and Satyaki. The fighting is described through storm, darkness,
    animal, snake, and blazing imagery, and Shalya is singled out as fighting unsupported
    against many warriors.
  language: English
  quote_policy: summarized
