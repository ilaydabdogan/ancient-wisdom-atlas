canonical_text:
  quote: ''
  summary: A Brahmana sage explains hostility against him as arising from his exposure
    of faults and warns the king about wicked foes. The king invites the Brahmana
    to reside in the palace, honorably oversee chastisement, and guide the kingdom.
    The sage, identified as Kalakavrikshiya, counsels cautious action against guilty
    ministers, recalls his truthfulness and past service to the king's father, and
    urges vigilance. The king appoints a Kshatriya minister and the sage as Purohita;
    under the sage's counsel and sacrificial worship, the king subjugates the earth
    and gains fame.
