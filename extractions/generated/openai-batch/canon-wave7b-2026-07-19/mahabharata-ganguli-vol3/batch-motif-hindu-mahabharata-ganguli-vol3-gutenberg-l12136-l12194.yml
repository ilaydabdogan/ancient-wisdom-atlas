canonical_text:
  quote: ''
  summary: Sanjaya reports that Yudhishthira praises Krishna and Arjuna after Karna's
    death, recalls the identification of the two heroes with Nara and Narayana, views
    Karna slain on the battlefield, declares victory and kingship through Krishna's
    grace, and is celebrated by allied Pandava warriors before they return to camp.
  language: English
  quote_policy: summarized
