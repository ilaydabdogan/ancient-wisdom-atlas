canonical_text:
  quote: By dying upon the sacred field of Samantapanchaka, celebrated over the three
    worlds, I shall certainly obtain many eternal regions!
  summary: Sanjaya reports Duryodhana's speech after Bhimasena has broken his thighs.
    Duryodhana laments the power of Time, accuses Bhima and the Pandavas of violating
    rules of fair combat, recalls his own royal and ritual accomplishments, anticipates
    heaven and eternal regions after death on the sacred field, warns surviving allies,
    names grieving relatives, and mentions possible vengeance by Charvaka.
  language: English
  quote_policy: quoted
