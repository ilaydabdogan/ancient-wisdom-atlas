canonical_text:
  quote: ''
  summary: In anticipation of the duel between Karna and Arjuna, gods, demons, natural
    forces, animals, sacred texts, serpents, sages, and other beings divide into opposing
    cosmic factions. Celestial beings gather in the sky to witness the encounter.
    Indra favors Arjuna while Surya favors Karna. The gods fear that the universe
    may be destroyed and petition Brahman; Brahman and Isana declare Arjuna’s victory
    certain, citing his truthfulness, divine assistance, previous service to gods,
    and Vishnu as his charioteer.
  language: English
  quote_policy: summarized
