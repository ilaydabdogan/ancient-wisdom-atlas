canonical_text:
  quote: By casting off, through the aid of Yoga, these five faults, viz., attachment,
    heedlessness, affection, lust, and wrath, one attains to Emancipation.
  summary: Bhishma teaches Yudhishthira that Yoga enables the practitioner to cast
    off faults, break bonds, withstand sense objects, overcome death, manifest yogic
    powers, and attain Emancipation. The teaching uses images of nets, fire, water-crossing,
    aiming, balancing a vessel, chariot-driving, the sun, and inner union of the Jiva-soul
    with the subtle Soul. Yudhishthira then asks about diet and disciplines for acquiring
    Yoga-puissance.
  language: English
  quote_policy: quoted
