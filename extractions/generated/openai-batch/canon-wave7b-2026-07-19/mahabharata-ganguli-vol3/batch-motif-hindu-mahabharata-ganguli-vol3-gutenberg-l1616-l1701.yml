canonical_text:
  quote: that battle between Arjuna and Ashvatthama resembling the planets Shukra
    and Brihaspati
  summary: Sanjaya narrates a fierce battle in which Arjuna and Ashvatthama exchange
    volleys of arrows. Ashvatthama wounds Arjuna and Vasudeva, but Keshava urges Arjuna
    not to spare him. Arjuna wounds Ashvatthama severely, disables his team, and Ashvatthama
    is carried away and withdraws into Karna's army while Arjuna and Keshava proceed
    toward the samsaptakas.
  language: English
  quote_policy: quoted
