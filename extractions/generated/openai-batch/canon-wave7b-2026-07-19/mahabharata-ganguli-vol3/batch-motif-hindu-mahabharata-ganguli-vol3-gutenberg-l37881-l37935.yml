canonical_text:
  quote: ''
  summary: 'Bhishma draws instruction from the old story of the mouse Palita and the
    cat: a weak but wise figure can escape powerful foes through intelligence, temporary
    peace with an enemy, and mutual reliance in common danger. He teaches Yudhishthira
    that rulers must know when to make peace or war, appear fearless while cautious,
    avoid heedlessness, distinguish friend from foe, and not trust an enemy again
    after the danger has passed. He also advises the king to seek and honor Brahmanas
    as teachers of duty and sources of benefit.'
  language: English
  quote_policy: summarized
