canonical_text:
  quote: ''
  summary: Bhishma instructs Bharata on gifts to Brahmanas, royal support for sacrifices,
    emergency permissions for a hungry Brahmana, distress-time alternatives in religious
    duty, the authority and ritual means of Brahmanas, rules for pouring libations,
    the necessity of Dakshina, and conduct by which Brahmanas are treated as Sudras
    in act.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhishma speaks to an addressee called Bharata and gives normative instruction
    about gifts, Brahmanas, kingship, and sacrifice.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wealth and knowledge are to be given to pious impoverished Brahmanas who have
    been robbed, are engaged in sacrifices, know the Vedas, and seek righteous merit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Brahmanas who are not poor are to receive only Dakshina, while fallen Brahmanas
    are to receive uncooked food outside the sacrificial altar.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Brahmanas are described as the Vedas and all sacrifices with large presents,
    and the king is told to give them diverse valuable wealth.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Brahmana with enough stores to feed his family for three or more years is
    said to deserve to drink Soma.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: If a sacrifice cannot be completed for lack of a fourth part of the expenses,
    the king is instructed to take wealth from wealthy persons who are averse to sacrifices,
    including a cattle-rich Vaisya and a Sudra house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The king is told to publicly take wealth from persons who do not practice
    charity, and such action is said to earn great merit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A Brahmana forced by want to go without six meals may take only what is needed
    for a single meal from a husking tub, field, garden, or other place, and should
    inform the king.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A duty-knowing king should not punish such a hungry Brahmana; he should make
    provision for him and protect him as a father protects his son.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: In seasons of distress, the Viswedevas, Sadhyas, Brahmanas, and great Rishis
    are said to use alternative scriptural provisions; a person who uses alternatives
    while able to follow the primary rule is called wicked and does not win felicity
    in heaven.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The energy of a Brahmana is said to be superior to that of the king, and the
    Brahmana is called creator, ruler, ordainer, and god; abusive or harsh speech
    should not be addressed to a Brahmana.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Kshatriya is told to overcome difficulties by arms, the Vaisya and Sudra
    by wealth, and the Brahmana by mantras and homa.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: A maiden, youthful woman, person unacquainted with mantras, ignorant person,
    or impure person is said to be incompetent to pour libations on the sacrificial
    fire and, if doing so, falls into hell with the person for whom the rite is done.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Only a Brahmana conversant with the Vedas and skilled in sacrifices should
    pour sacrificial libations.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: A sacrifice kindled without giving the dedicated food as Dakshina is not treated
    as a proper kindling of sacrificial fire, and sacrifices without Dakshina are
    said to destroy children, animals, heaven, senses, fame, achievements, and lifespan.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Certain conduct, including failure to perform sacrifices and marriage to a
    Sudra girl followed by long residence in a specified village setting, causes Brahmanas
    to be regarded as Sudras in act.
  category: attribute
  evidence_refs:
  - ev:9
