canonical_text:
  quote: ''
  summary: Bhishma instructs Yudhishthira that a righteous king, by ruling without
    lust or hate, protecting creatures, honoring deserving persons, performing gifts,
    worship, offerings, compassion, and chastisement, can obtain the merits associated
    with the four modes of life. The passage states that a king shares in the merits
    of righteous subjects he protects, incurs their sins if he fails to protect them,
    and can cross the ocean of the world by means of kingly duties compared to a swift
    boat.
  language: English
  quote_policy: summarized
