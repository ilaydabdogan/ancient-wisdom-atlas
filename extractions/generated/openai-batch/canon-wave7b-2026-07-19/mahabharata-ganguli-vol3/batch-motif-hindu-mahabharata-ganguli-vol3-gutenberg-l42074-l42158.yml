canonical_text:
  quote: The rigid vow I have adopted is called Ajagara.
  summary: Bhishma narrates an intelligent Brahmana's reply to Prahlada. The Brahmana
    teaches that all created things are subject to decay, death, disunion, and destruction;
    he therefore practices equanimity toward food, shelter, clothing, gain, loss,
    and worldly desire. He names his discipline the Ajagara vow, models it on large
    snakes that remain still and accept what comes of itself, and describes it as
    pure, destiny-aware, destructive of ignorance, and connected with immortality.
  language: English
  quote_policy: quoted
