canonical_text:
  quote: ''
  summary: Bhishma narrates an animal tale set around a large banyan tree in a forest.
    A wise mouse named Palita lives at the tree’s foot, while a bird-eating cat named
    Lomasa lives in its branches. A Chandala trapper sets nets, and the cat is caught.
    The mouse emerges, eats the lure, and then faces danger from a mongoose, an owl,
    and the possibility of the cat’s escape. Palita reasons through the dangers using
    policy and proposes a temporary friendship with the trapped cat, offering rescue
    if the cat will not kill him. The supplied passage ends while the mouse is still
    speaking.
  language: English
  quote_policy: summarized
