canonical_text:
  quote: ''
  summary: Yajnavalkya tells a king the destinations reached when the Jiva-soul leaves
    the body through particular body parts, lists signs indicating that death is near,
    and describes meditative soul-union and abstinence as means of approaching dissolution
    or conquering death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yajnavalkya addresses a king and says he will describe the places to which
    those who die go.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage maps the Jiva-soul’s exit through specific body parts to specified
    destinations, including regions or companionship of Vishnu, the Vasus, Sadhyas,
    Mitra, Earth, Prajapati, the Maruts, Chandramas, Indra, Rudra, Nara, Viswadevas,
    horizon deities, the Windgod, Agni, Aswins, Pitris, and Brahman.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Failure to see the fixed star Arandhati or Dhruva, or seeing the full Moon
    or a burning lamp’s flame as broken toward the south, is said to indicate one
    year of life remaining.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: No longer seeing one’s reflected image in the eyes of others is said to indicate
    one year of life remaining.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Loss of lustre or wisdom, changed inner and outer nature, disregard of deities,
    quarrels with Brahmanas, or a dark-complexioned person becoming pale are said
    to indicate six months of life remaining.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Seeing the lunar or solar disc as full of holes like a spider’s web, or perceiving
    fragrant worship scents as corpse-like, is said to indicate one week of life remaining.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Depression of nose or ears, discoloration of teeth or eye, loss of consciousness,
    loss of animal heat, sudden tears from the left eye, or vapours issuing from the
    head are presented as signs of death that same day.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: A person who knows these symptoms and has a cleansed soul is instructed to
    unite his soul with the Supreme Soul in Samadhi day and night until dissolution.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A person who desires to live is told to abandon enjoyments, scents, and tastes,
    live in abstinence, and fix the soul on the Supreme Soul to conquer death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says that one with knowledge of the Soul, following the course
    recommended by the Sankhyas, conquers death through union with the Supreme Soul
    and attains an indestructible, unborn, auspicious, immutable, eternal, stable
    state.
  category: sequence
  evidence_refs:
  - ev:8
