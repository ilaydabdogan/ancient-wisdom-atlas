  quote: "“there is no better path to heaven than that offered by battle”"
  summary: In battle, Dhartarashtra combatants surround Bhima, who stands firm, descends
    from his chariot, and slays a large body of foot-soldiers with his mace. Duryodhana
    then rallies fleeing Kuru forces by arguing that battle is preferable to flight
    and that warriors slain according to Kshatriya practice obtain heavenly blessedness.
    The Kuru kings and Pandava heroes renew the clash.
