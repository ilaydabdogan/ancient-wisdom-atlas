canonical_text:
  quote: ''
  summary: Bharadwaja questions whether life can be reduced to wind, breath, or bodily
    heat. He describes the body as a union of five elements that dissolves at death,
    questions how life could persist or perceive after that dissolution, challenges
    the claim that a gifted cow rescues the donor in the other world, and denies that
    the dead person returns, contrasting personal death with the succession of seeds.
  language: English
  quote_policy: summarized
