  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: He states that the taker and giver of the cow are both subject to death and
    meet extinction in this world.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: He asks how a person destroyed by birds, a fall from a mountain summit, or
    fire could regain life.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: He says a cut tree root does not grow again, while seeds sprout; he concludes
