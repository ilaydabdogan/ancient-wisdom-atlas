  text: Bharadwaja presents the view that wind keeps beings alive, causes movement,
    breath, and speech, and says that if this is so then life is worth little.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bharadwaja presents internal animal heat as fire-like and as assisting digestion
    by dissolving food.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: At animal death, Bharadwaja says life itself is not seen leaving; only breath
    leaves and internal heat is extinguished.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: He uses analogies of air, water, and flame entering homogeneous elements and
    losing separate existence.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: He describes the animal body as made of five primal elements and states that
    if one element disappears or is afflicted, the union dissolves.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: He asks where life goes and what it knows, hears, or says when the body separates
