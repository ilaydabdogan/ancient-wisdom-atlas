canonical_text:
  quote: there once more commenced a battle between Karna and the Pandavas that swelled
    the population of Yama's kingdom.
  summary: Sanjaya narrates that Krishna warns Arjuna of danger to Yudhishthira and
    of Karna's slaughter of the Srinjayas. Krishna drives Arjuna back into battle.
    The Kurus and Pandavas clash fiercely. Karna kills many warriors, including Pancala
    car-warriors, and is opposed by Pandava-aligned leaders. The passage describes
    mass combat, severed bodies, fallen vehicles and animals, and battlefield imagery
    of an ocean, cut trees, fallen mountains, crushed lotuses, and fouled cloth.
  language: English
