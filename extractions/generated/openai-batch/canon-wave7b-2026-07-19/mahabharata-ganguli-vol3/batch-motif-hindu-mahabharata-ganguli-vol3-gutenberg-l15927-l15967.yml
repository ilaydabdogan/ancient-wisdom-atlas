canonical_text:
  quote: ''
  summary: After the Kaurava defeat, Dhritarashtra asks what the surviving warriors
    and Duryodhana did. Sanjaya reports that Kripa, Kritavarma, and Drona's son went
    to a lake to find Duryodhana, while the Pandavas searched unsuccessfully for him.
    Duryodhana had fled into the lake after solidifying its waters by illusion. The
    three survivors urged him to rise and fight, but he answered that he and they
    were exhausted and that he would fight on the following day.
  language: English
  quote_policy: summarized
