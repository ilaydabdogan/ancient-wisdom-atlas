literal_observations:
- id: obs:1
  text: A note frames an apparent conflict between two declarations and asks how the
    scriptural character of both can be maintained if scripture must be certain and
    fault-free.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A disciple is instructed not to clamor for lessons but to approach the preceptor
    only when summoned, and to use submissive or humble glances rather than bold staring.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Learning is described as not sold; the final fee is described as a pupil's
    token of gratitude rather than payment for the preceptor's services.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The note says there are scriptural stories of disciples coming to grief through
    persistent insistence on the acceptance of the final fee, and it cites Galava
    in the Udyoga Parva.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The conduct called kapoti or unchha consists of collecting grain seeds that
    have fallen from ears and been abandoned by reapers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A householder who cooks is said to have to give a share of cooked food to
    a Brahmacharin, Yati, or guest; eating all the food without doing so is described
    as a high sin.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Certain reverenced persons are said to be able to send the householder to
    indicated places or make him comfortable in those places.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The cow is described as a sacred animal; feeding and tending a cow is said
    to have merit, and forest recluses kept cattle for merit and for ghee used in
    homa or sacrifice.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: 'Five sacrifices are listed: Agnihotra, Darsapurnamasi, Chaturmasya, Pasu
    sacrifice, and Soma sacrifice.'
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: The note explains ordinary sacrifices with tangible offerings and Vedic mantras
    as leading to purity of mind, after which the sacrificer may practice sacrifice
    in Self, identified with Yoga, and worship the three fires in the self for emancipation.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: An orthodox Brahmana, Kshatriya, or Vaisya is said to offer five small mouthfuls
    to the five vital breaths before eating.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Sannyasa mode of life is said not to be entered without a previous shave.
  category: action
  evidence_refs:
  - ev:12
