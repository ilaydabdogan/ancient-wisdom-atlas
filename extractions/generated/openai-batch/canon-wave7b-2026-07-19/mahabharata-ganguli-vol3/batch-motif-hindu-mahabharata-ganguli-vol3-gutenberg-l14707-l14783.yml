canonical_text:
  quote: ''
  summary: 'Sanjaya narrates a battlefield sequence after Salwa has been slain: Kritavarma
    resists and rallies fleeing Kuru warriors, Satyaki kills Kshemakirti, Satyaki
    and Kritavarma fight a fierce chariot duel, Satyaki disables Kritavarma’s car,
    Kripa carries Kritavarma away, the Kuru army flees again under a dusty cloud,
    and Duryodhana alone resists the victorious enemy while being compared to a blazing
    sacrificial fire and to the Destroyer.'
  language: English
  quote_policy: summarized
