canonical_text:
  quote: ''
  summary: 'A didactic passage describes the reign and divine status of Prithu, Vena''s
    son: his rule removes fear and calamity, makes waters and mountains yield, draws
    crops from the earth, and establishes righteousness. Vishnu confirms and enters
    him, and the passage generalizes that kingship is divinely founded. It also narrates
    the birth of Sree from a golden lotus from Vishnu''s brow, her union with Dharma
    and the birth of Artha, and concludes with the scope of the Grandsire''s treatise
    and the learned claim that a god and a king do not differ.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vena's son thinks of millions who start into life, and his reign is described
    as free from decrepitude, famine, calamity, disease, and fear from reptiles or
    thieves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the king goes to the sea, the waters solidify; mountains give him way;
    and his standard is not obstructed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king draws seventeen kinds of crops from the earth, compared to a milcher
    drawing from a cow, for Yakshas, Rakshasas, Nagas, and other creatures.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king causes creatures to regard righteousness as foremost, gratifies the
    people, heals wounds of Brahmanas, and is associated with the names Rajan, Kshatriya,
    and Prithvi.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Vishnu confirms the monarch's power, declares that no one shall transcend
    him, enters his body, and the universe offers divine worship to Prithu as one
    numbered among human gods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The addressee is instructed that a kingdom should be protected by the science
    of chastisement and by information from spies.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage asks what could cause the multitude to obey one person except
    the divinity of the monarch.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: A golden lotus is born from Vishnu's brow; Sree is born from that lotus, becomes
    spouse of Dharma, and Dharma begets Artha upon her.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A person whose merit is exhausted comes down from heaven to earth, takes birth
    as a king versed in chastisement, and is described as a portion of Vishnu on earth,
    established by the gods.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: People who beheld Prithu's face became obedient to him, and the might of his
    sceptre made morality and just behaviour visible on earth.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Grandsire's work is said to contain histories, origins of Rishis, holy
    waters, planets, stars, duties, rites, learning, Vedas, Nyaya, penances, knowledge,
    truth, falsehood, and moral conduct.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: The learned are said to have begun saying that there is no difference between
    a god and a king.
  category: speech
  evidence_refs:
  - ev:12
