canonical_text:
  quote: '"all go to the place of the dead"'
  summary: Vidura describes embodied life from conception and fetal development through
    painful birth, worldly suffering, bondage to senses and possessions, death at
    the hands of the Destroyer’s messengers, the erasure of social distinctions in
    death, and the attainment of the highest end through virtue and Truth. Dhritarashtra
    asks about the intelligence needed to traverse the wilderness of duties.
  language: English
  quote_policy: quoted
