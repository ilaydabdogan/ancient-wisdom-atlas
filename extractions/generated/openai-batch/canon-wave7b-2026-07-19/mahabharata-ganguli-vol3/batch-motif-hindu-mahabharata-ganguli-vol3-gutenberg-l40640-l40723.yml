- id: obs:1
  text: Bhishma answers the son of Madri and frames the account as truth about the
    matter asked.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ancient universe is described as a vast motionless expanse of water, without
    sky or earth, enveloped in darkness and silence.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Grandsire takes birth and creates wind, fire, sun, sky, heavens, nether
    regions, earth, directions, celestial bodies, and divisions of time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Grandsire assumes visible form, wills sons into existence, and a genealogy
    through Prachetas, Daksha, daughters, and sages produces all mobile and immobile
    creatures.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Grandsire promulgates eternal religion laid down in the Vedas, and gods
    and sages accept and obey it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Foremost Danavas and Daityas disregard the Grandsire’s commands, act with
    wrath and covetousness, challenge gods and sages, and afflict creatures.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Brahman, accompanied by regenerate sages, goes to a jeweled and forested summit
    of Himavat for the business of the world.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: After a thousand years, Brahman arranges a grand sacrifice with skilled Rishis,
    sacrificial fuel, blazing fires, gold vessels, gods, and Sadasyas.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A creature springs from the sacrificial fire, scattering flames, with moonlike
    splendour, dark blue-lotus complexion, keen teeth, lean stomach, tall stature,
    and great energy.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the creature’s appearance, the earth trembles, the ocean becomes agitated,
    meteors cross the sky, tree branches fall, directions become unquiet, winds blow
    inauspiciously, and creatures quake.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Brahman declares that the being was thought of by him, is named Asi, and was
    created for world protection and destruction of the gods’ enemies.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The being abandons its first form, becomes a sharp splendid sword, and is
