canonical_text:
  quote: ''
  summary: Bhishma describes a primordial universe of water and darkness, the Grandsire’s
    creation of cosmic elements, beings, and Vedic religion, the Danavas’ rejection
    of righteousness, Brahman’s sacrifice on Himavat, and the fiery emergence of Asi,
    who becomes a sword given to Rudra against irreligion and sin.
  language: English
  quote_policy: summarized
