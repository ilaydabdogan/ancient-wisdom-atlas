canonical_text:
  quote: A person becomes a true renouncer by casting off every internal and external
    attachment.
  summary: The passage teaches that domestic life, when joined to sacrifice, charity,
    self-restraint, and detachment, is superior to abandoning home. It describes mendicant
    discipline, ritual duties to Brahmanas, Pitris, gods, and guests, the creation
    of sacrificial materials, and royal obligations to protect subjects and perform
    sacrifices. It warns that false renunciation, neglect of sacrifice, and neglect
    of royal charity and protection lead to sin, deathly bondage, destruction, or
    degraded rebirth.
  language: English
  quote_policy: quoted
