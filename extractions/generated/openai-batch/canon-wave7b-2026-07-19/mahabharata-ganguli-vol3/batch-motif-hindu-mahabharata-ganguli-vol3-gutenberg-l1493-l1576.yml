  quote: These two heroes the foremost of all creatures are Nara and Narayana.
  summary: Sanjaya describes Arjuna devastating the Samsaptaka force, receiving celestial
    praise with Krishna, and then being challenged by Ashvatthama, who frames battle
    as hospitality and attacks Krishna and Arjuna with a massive supernatural shower
    of arrows.
  language: English
