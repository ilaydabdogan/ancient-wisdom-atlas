  summary: In a battle passage, Vrishasena cuts off Nakula's shield and sword and
    wounds him. Nakula, afflicted, goes to Bhimasena's car. Vrishasena and other Kuru
    warriors attack the Pandava brothers with arrows. Bhima and Arjuna respond with
    arrows; Bhima and Nakula urge Arjuna against Karna's son, and Arjuna, in an ape-bannered
    vehicle guided by Keshava, advances toward Vrishasena.
