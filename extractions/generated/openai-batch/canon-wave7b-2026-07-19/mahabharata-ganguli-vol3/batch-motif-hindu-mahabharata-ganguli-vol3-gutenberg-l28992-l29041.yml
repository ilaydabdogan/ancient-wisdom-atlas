canonical_text:
  quote: Thou art the origin and thou art the dissolution of all the worlds.
  summary: Vaisampayana reports that Bhishma, addressing Krishna with reverence, praises
    him as creator, destroyer, universal soul, and source of the universe. Bhishma
    describes beholding Krishna's eternal cosmic form. Vasudeva says he has revealed
    this celestial form because of Bhishma's devotion and righteousness, foretells
    Bhishma's remaining lifespan and post-mortem destination, and urges him to teach
    Yudhishthira about duty, morality, and Yoga.
  language: English
  quote_policy: quoted
