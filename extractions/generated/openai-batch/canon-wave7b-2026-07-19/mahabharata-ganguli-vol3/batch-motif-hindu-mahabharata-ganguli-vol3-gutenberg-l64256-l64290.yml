canonical_text:
  quote: ''
  summary: A guest tells a Brahmana about Naimisha forest on the Gomati, a Naga-named
    city, an ancient sacrifice by assembled deities, King Mandhatri's victory over
    Indra, and the righteous Naga Padmanabha/Padma who can answer questions about
    the highest religion. Padmanabha is described as intelligent, scripturally learned,
    hospitable, devoted to Vedic study, water-related duties, sacrifice, gifts, non-injury,
    forgiveness, truthful speech, self-control, and benefit to all creatures.
  language: English
  quote_policy: summarized
