canonical_text:
  quote: '"I shall discourse on duties that are eternal."'
  summary: Bhishma invokes Dharma, Krishna, and the assembled Brahmanas, then instructs
    Yudhishthira on duties common to the four orders and on the specific duties, livelihoods,
    ritual obligations, and social responsibilities of Brahmanas, Kshatriyas, Vaisyas,
    and Sudras.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Bhishma bows to Dharma, Krishna, and the assembled Brahmanas before announcing
    a discourse on eternal duties.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Nine duties are said to belong equally to all four orders: suppression of
    wrath, truthfulness, justice, forgiveness, begetting children on wedded wives,
    purity of conduct, avoidance of quarrel, simplicity, and maintenance of dependants.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Brahmana-specific duties named include self-restraint, Veda study, patience
    in austerities, charity, sacrifice, and proper enjoyment of lawfully obtained
    wealth by distribution.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Study of the Vedas is described as sufficient to accomplish the pious acts
    laid down for a Brahmana and to make him known as a Brahmana or friend of all
    creatures.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Kshatriya is instructed to give but not beg, perform sacrifices for himself
    but not officiate for others, study but not teach the Vedas, protect the people,
    and fight robbers and wicked people.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kshatriya rulers who perform great sacrifices, know the Vedas, and win battles
    are said to gain blessed regions, while a Kshatriya returning unwounded from battle
    is not praised by persons versed in old scriptures.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A king who protects his subjects and establishes them in their respective
    duties is said to accomplish religious acts and to be called a Kshatriya and foremost
    of men.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A Vaisya is instructed to make gifts, study the Vedas, perform sacrifices,
    acquire wealth fairly, and protect and rear domestic animals.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Creator is said to have assigned the care of domestic animals to the Vaisya
    and the care of all creatures to the Brahmana and Kshatriya.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage gives specific Vaisya remunerations for cattle-keeping, trade,
    trade in horns and hoofs, and cultivation with seeds supplied by others.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Sudra is said to have been intended by the Creator as servant of the other
    three orders, and service to those orders is named as the Sudra's duty.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: A Sudra is told not to amass wealth, though with the king's permission he
    may earn wealth for religious acts.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The three other orders are said to maintain Sudras by giving worn-out or torn
