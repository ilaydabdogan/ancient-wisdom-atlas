canonical_text:
  quote: ''
  summary: Vaishampayana recounts how Indra made a covenant with the Asura Namuchi,
    killed him with water-foam, was pursued by Namuchi's severed head, and received
    ritual instruction from Brahma to bathe and sacrifice at the sacred Aruna-Sarasvati
    confluence. Indra is freed from sin, Namuchi gains blessed regions, Baladeva gains
    merit at the tirtha, and the narrative moves to Soma's tirtha, Skanda's slaying
    of Taraka and command of the celestial forces, the Aswattha tree where Kumara
    resides, and Janamejaya's request to hear of Kumara's investiture.
  language: English
  quote_policy: summarized
