canonical_text:
  quote: That heat is always burning there like a fire placed in any (visible) vessel.
  summary: In a dialogue, Bharadwaja asks how bodily heat and wind reside in and move
    the body. Bhrigu explains the functions of heat, Prana, Samana, Apana, Udana,
    Vyana, bodily ducts, digestion, circulation of juices, and the yogic use of the
    main duct as a path for attaining Brahma.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Bharadwaja asks how bodily fire or heat enters and resides in the body, and
    how wind causes bodily movement and exertion.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhrigu states that heat resides in the head or brain and protects the body
    from perishing.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bhrigu states that Prana resides in the head with heat and causes exertion;
    he also identifies Prana with the living creature, universal soul, eternal Being,
    mind, intellect, consciousness, and objects of the senses.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bhrigu describes Samana as causing the senses to act, Apana as carrying out
    urine and faeces, Udana as operating in three functions, and Vyana as operating
    in the joints.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Heat in the region of the navel, between Apana and Prana, is described as
    digesting food with the aid of those two breaths.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A main duct is described as extending from the mouth to the anal canal, with
    numerous subsidiary ducts branching from it through living bodies.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Prana, bearing a current of heat, descends from the head to the anal canal
    and then returns upward to its seat in the head.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ducts branching from the heart convey liquid juices yielded by food upward,
    downward, and transversely under the impulse of ten breaths.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The main duct is described as the path by which yogins attain Brahma by holding
    the soul within the brain.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Bhrigu says heat is planted in the breaths of embodied creatures and burns
    like a fire placed in a visible vessel.
  category: attribute
  evidence_refs:
  - ev:7
