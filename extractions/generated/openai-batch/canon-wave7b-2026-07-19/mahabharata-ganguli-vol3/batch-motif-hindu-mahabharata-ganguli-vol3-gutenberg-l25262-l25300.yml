canonical_text:
  quote: '"The word mama (mine), consisting of two letters, is Death''s self; while
    the opposite word na-mama (not mine), consisting of three letters, is eternal
    Brahma."'
  summary: A preceding exhortation says the monarch may reach regions higher than
    heaven through prowess and gifts to Veda-knowers and should not grieve. In Section
    XIII, Sahadeva counsels the king that external renunciation is insufficient without
    inner nonattachment; contrasts possessiveness with Brahma; argues for the immortality
    of the soul; urges the king to follow the righteous path and rule without attachment;
    teaches that seeing all creatures as oneself removes fear; and asks forgiveness
    for his sorrowful speech.
  language: English
  quote_policy: quoted
