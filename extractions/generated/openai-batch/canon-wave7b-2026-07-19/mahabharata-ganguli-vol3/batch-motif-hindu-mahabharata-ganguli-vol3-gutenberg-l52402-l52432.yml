canonical_text:
  quote: ''
  summary: The passage describes the body as a compound of primal essences and attributes
    upheld by Mahat through Prana. At death, a creature is resolved into constituent
    elements and, according to merits, demerits, Avidya, desire, acts, and Time, migrates
    from body to body. The wise do not grieve over these changes, while the foolish
    mistake temporary relations for real ones. Jiva is described as alone, unborn,
    undying, and able, through the exhaustion of acts and through Knowledge, to attain
    Brahma.
  language: English
  quote_policy: summarized
