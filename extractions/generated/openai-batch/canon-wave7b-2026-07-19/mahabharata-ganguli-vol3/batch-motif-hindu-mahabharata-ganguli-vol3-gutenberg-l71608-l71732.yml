canonical_text:
  quote: ''
  summary: Editorial footnotes explain variant accounts of the Vritra-Indra encounter,
    the status of Vritra and the sin of Brahmanicide, identities and epithets of Uma
    and Mahadeva, ritual and sound imagery associated with Mahadeva, the descent of
    the Ganges through Vishnu, Brahman, and Siva, Krishna's sports in Vrinda, and
    related exegetical details.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The notes state that the account of the encounter between Vritra and Indra
    differs substantially from the Vana Parva version.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the described variant, Rishis are represented as taking part in or supporting
    the slaughter of the Asura.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Vana Parva account summarized by the note, Indra fears Vritra, hurls
    his thunderbolt without deliberate aim, and accepts Vritra's death only after
    assurance by the deities.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Vritra is described as a lineal descendant of Kasyapa and as a superior person
    of the regenerate order.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The notes state that the killer of a Brahmana is liable to be overtaken by
    the sin of Brahmanicide.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Uma or Parvati is identified as the daughter of Himavat and spouse of Siva.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The self-created Brahman is said to have created Prajapatis, including Daksha,
    to procreate living creatures and fill the universe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Mahadeva is called Virupaksha and Tryaksha because of his three eyes, with
    the third eye making his features dreadful to behold.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: A worshipper of Mahadeva is described as producing a rhythmic mouth-and-cheek
    sound, and Mahadeva is said to be fond of this music.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Godhead is likened to an unstruck or nascent sound, and Huns are described
    as mystic sounds standing as emblems for various things.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: In sacrifice, butter is poured with mantras into the mouth of a selected Brahmana
    representing the gods and also into sacred fire; the great god is said to be of
    the form of both the Brahmana and the fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The notes allude to Krishna's sports in the groves of Vrinda with rustic children
    as his companions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Ganges is described as issuing from Vishnu's feet, being held by Brahman
    in his jar, coursing through the heavens, and falling on Siva's head.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Siva alone is described as mighty enough to bear the fall of the Ganges, and
    his matted locks bear the mark of the fall.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: A note explains that one epithet means the god can course without obstruction
    through Water, Fire, Wind, and Space.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: A note says the god repeatedly creates and destroys, or sets in motion, the
    referenced entities.
  category: action
  evidence_refs:
  - ev:8
