canonical_text:
  quote: ''
  summary: Sanjaya narrates that Arjuna routes a large opposing force, exchanges arrow-fire
    with many named warriors, and kills several of them. Satyasena wounds Krishna
    with a lance, after which Arjuna orders the chariot driven to Satyasena and beheads
    him. Surrounded by samsaptakas, Arjuna invokes the Aindra weapon, which releases
    thousands of shafts and leaves the battlefield impassable with broken vehicles,
    weapons, bodies, elephants, and horses. The surviving host flees, and Arjuna is
    compared to a smokeless blazing fire.
  language: English
  quote_policy: summarized
