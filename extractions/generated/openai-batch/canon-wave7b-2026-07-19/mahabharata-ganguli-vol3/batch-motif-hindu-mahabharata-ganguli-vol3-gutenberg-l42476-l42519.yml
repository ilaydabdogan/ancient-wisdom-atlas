canonical_text:
  quote: ''
  summary: 'Bharadwaja asks Bhrigu how Brahman, residing within Meru, created diverse
    objects. Bhrigu explains that Manasa in the form of Brahman created by will, first
    creating water for the protection and life of creatures. In response to further
    questions about the origins of water, fire, wind, and earth, Bhrigu recounts an
    ancient assembly of ascetic Rishis who, after long contemplation and fasting,
    heard a celestial voice describe a cosmogony: infinite motionless Space existed
    first, water arose in darkness, wind arose from the pressure of water, fire arose
    from friction between wind and water, and earth resulted from solidification.'
  language: English
  quote_policy: summarized
