canonical_text:
  quote: ''
  summary: Sanjaya narrates that Arjuna has his war-car prepared for combat with Karna.
    Krishna orders Daruka to equip the vehicle. Arjuna receives Yudhishthira's leave,
    Brahmanical rites, and blessings, then advances toward Karna. Auspicious and ominous
    birds appear around and ahead of him, foretelling Karna's death and the enemy
    host's destruction. Arjuna feels perspiration and anxiety about fulfilling his
    vow, and Krishna addresses him.
  language: English
  quote_policy: summarized
