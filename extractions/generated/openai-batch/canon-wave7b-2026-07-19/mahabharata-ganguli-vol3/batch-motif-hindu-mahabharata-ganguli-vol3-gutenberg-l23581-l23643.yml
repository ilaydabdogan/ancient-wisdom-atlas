canonical_text:
  quote: ''
  summary: Gandhari addresses Krishna/Madhava on the battlefield after the slaughter
    of her sons. She laments that Bhima has slain her hundred sons, describes the
    widowed daughters-in-law wandering among corpses, scavengers, broken chariots,
    dead animals, severed heads, and scattered royal armor, and reflects that past
    deeds cannot be fruitless. She recalls Duhshasana's insult to Draupadi at the
    dice assembly, her own warning to Duryodhana to abandon Shakuni and make peace
    with the Pandavas, Duryodhana's poisonous speech, and Bhima's killing of Duhshasana
    and drinking of his blood.
  language: English
  quote_policy: summarized
