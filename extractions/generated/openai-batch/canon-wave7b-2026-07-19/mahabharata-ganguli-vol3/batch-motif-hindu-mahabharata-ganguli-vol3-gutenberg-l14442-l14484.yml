  summary: Shakuni urges Duryodhana and the Kauravas to unite in rescuing the Madra
    warriors. The Pandavas counter the Madra assault, slaughter the Madrakas, and
    the battlefield fills with corpses, broken chariots, uncontrolled horses, headless
    forms, and meteoric imagery. After the Madra force and its king are destroyed,
    Duryodhana's army flees in fear.
