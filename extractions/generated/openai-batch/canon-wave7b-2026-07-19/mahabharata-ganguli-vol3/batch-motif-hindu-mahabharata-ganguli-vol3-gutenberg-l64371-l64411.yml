canonical_text:
  quote: ''
  summary: Bhishma describes a Brahmana fasting in a forest while awaiting the Naga
    chief. The Naga chief’s relatives find him on the bank of the Gomati, worship
    him, urge him to accept food or water so that they may fulfill hospitality, and
    explain that his fasting afflicts the Naga community. The Brahmana answers that
    his vow is undertaken for the Naga chief, that he will eat only if the chief does
    not return after eight more nights, and dismisses the assembled Nagas, who return
    home.
  language: English
  quote_policy: summarized
