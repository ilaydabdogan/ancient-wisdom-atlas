canonical_text:
  quote: '"fire itself may become cold. Still Karna will not be able to slay thee"'
  summary: Sanjaya reports Krishna assuring Arjuna that Karna cannot kill him except
    amid impossible cosmic disruption and imminent universal destruction. Krishna
    offers to slay Karna and Shalya himself. Arjuna replies that Karna and Shalya
    together are no match for him, predicts Karna's destruction, the widowhood of
    Karna's wives, and evil dreams as omens, recalls Karna's earlier abusive conduct
    during an assembly humiliation, and anticipates consolation for allied kin after
    victory.
  language: English
  quote_policy: quoted
