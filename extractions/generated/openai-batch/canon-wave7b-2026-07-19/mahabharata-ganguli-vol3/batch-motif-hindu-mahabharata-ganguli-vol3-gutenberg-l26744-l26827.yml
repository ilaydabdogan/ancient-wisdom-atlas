  quote: ''
  summary: A speaker consoles Srinjaya for his dead son by naming greater and purer
    kings who also died. The passage recounts Sivi’s death, Bharata’s riverbank horse-sacrifices
    and gifts, Rama’s ideal and abundant reign followed by death, Bhagiratha’s sacrifices,
    gifts, and relationship with Ganga, and Dilipa’s vast generosity, golden sacrificial
    imagery, and celestial music.
  language: English
  quote_policy: summarized
