canonical_text:
  quote: ''
  summary: Sanjaya reports that Ashvatthama, aided by Kripa and Kritavarma, accomplished
    a slaughter while the Pandava protectors were absent and the men slept. The three
    then went to the mortally wounded Duryodhana, found him on the battlefield surrounded
    by scavenging animals, and lamented his fall, his golden mace lying beside him,
    and the force of Time and destiny.
  language: English
  quote_policy: summarized
