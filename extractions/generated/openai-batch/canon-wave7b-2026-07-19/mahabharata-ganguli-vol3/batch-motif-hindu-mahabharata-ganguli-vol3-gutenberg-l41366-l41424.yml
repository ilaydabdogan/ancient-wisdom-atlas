canonical_text:
  quote: ''
  summary: Bhishma narrates that Gautama, a Brahmana guest, kills his bird host Rajadharman
    under a banian tree, roasts the bird on the host’s fire, and flees. Virupaksha,
    the Rakshasa king and friend of Rajadharman, suspects Gautama, sends his son to
    investigate, and mourns when the mutilated bird is found. Gautama is captured,
    killed, and offered as food, but both Rakshasas and cannibal robbers refuse to
    eat an ungrateful person; the passage concludes that ingratitude has no expiation.
  language: English
  quote_policy: summarized
