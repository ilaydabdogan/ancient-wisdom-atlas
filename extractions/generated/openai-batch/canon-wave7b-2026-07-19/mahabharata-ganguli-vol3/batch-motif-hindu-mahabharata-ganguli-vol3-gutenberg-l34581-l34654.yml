canonical_text:
  quote: The treasury is the root of felicity in heaven and victory on earth.
  summary: 'A sage offers a king a policy for recovering his kingdom: humble service
    to enemies and to Janaka, alliance-building, covert division of foes, depletion
    of an enemy’s treasury through luxury, sacrifice, and gifts, inducement toward
    renunciation, and finally destructive fraud using poison.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The sage says he can discourse on a policy by which the king may recover wealth,
    kingdom, kingly power, and prosperity if the king can act on the counsel.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king asks the sage to speak and says he is willing to hear and act according
    to the counsel.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sage instructs the king to renounce pride, desire, anger, joy, and fear,
    to wait on his foes humbly with joined hands, and to serve Janaka of Mithila.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sage says Janaka will give the king wealth and trust, and that the king
    will become Janaka’s right arm and gain courageous allies.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sage advises mustering a large force, consulting good ministers, causing
    disunion among foes, or making peace with the foes of the king’s foe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sage advises causing the foe to become attached to costly pleasures so
    that the foe may be ruined of himself, while the king keeps his intention concealed
    and behaves with apparent friendship.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The sage advises draining the enemy’s treasury by directing attention to pleasures,
    sacrifices, and gifts to Brahmanas, who will then benefit the king in return.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The sage states that the treasury should be drained, calls it the root of
    felicity in heaven and victory on earth, and advises praising Destiny rather than
    Exertion before the foe.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The sage advises causing the enemy to perform the Viswajit sacrifice, thereby
    divesting him of all possessions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The sage advises indicating an eminent ascetic of Yoga so that the enemy will
    desire renunciation and retirement into the woods for salvation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The sage advises using drugs made by boiling potent herbs and plants, and
    artificial salts, to destroy the elephants, steeds, and men of the enemy’s dominions;
    he calls these schemes fraudulent and connected with poison.
  category: action
  evidence_refs:
  - ev:7
