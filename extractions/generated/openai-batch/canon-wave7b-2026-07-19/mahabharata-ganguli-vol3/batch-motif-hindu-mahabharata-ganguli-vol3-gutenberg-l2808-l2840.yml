canonical_text:
  quote: ''
  summary: The passage describes a massive battle in which warriors are mangled, the
    field is filled with severed bodies, gore, broken vehicles, fallen animals, and
    streams of blood. The noise of battle is compared to the roaring current of the
    Ganga. Warriors lose the ability to distinguish friends from enemies and kill
    both. Named heroes slaughter named opposing forces. Dhritarashtra then addresses
    Sanjaya, laments the losses, concludes that the Kauravas are no more, and asks
    how Duryodhana and Dharma's son fought in the afternoon battle.
  language: English
  quote_policy: summarized
