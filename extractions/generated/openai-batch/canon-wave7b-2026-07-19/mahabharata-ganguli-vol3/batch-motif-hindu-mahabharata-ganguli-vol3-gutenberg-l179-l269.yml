canonical_text:
  quote: He that is wise never feeleth any pain at what Destiny bringeth!
  summary: Dhritarashtra grieves over the deaths of Bhishma and Drona and asks Sanjaya
    what happened to the Kuru side. Sanjaya answers first with counsel about Destiny,
    then describes the Kaurava army's paralysis after Drona's fall, Duryodhana's exhortation,
    Karna's appointment as commander, Karna's battlefield slaughter, and Karna's later
    death at Arjuna's hands.
  language: English
  quote_policy: quoted
