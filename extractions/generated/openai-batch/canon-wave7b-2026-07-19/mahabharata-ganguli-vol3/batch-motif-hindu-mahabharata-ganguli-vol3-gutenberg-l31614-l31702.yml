canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma what royal conduct benefits subjects and earns
    felicity after death. Bhishma describes royal liberality, sacrifice, discipline,
    protection of subjects, punishment of robbers, protection of Brahmanas, and the
    king's share in subjects' merit and sin. Yudhishthira considers renouncing sovereignty
    for ascetic life in the woods, but Bhishma counsels him that his birth and duties
    require rule, protection, gifts, sacrifices, and practical governance.
  language: English
  quote_policy: summarized
