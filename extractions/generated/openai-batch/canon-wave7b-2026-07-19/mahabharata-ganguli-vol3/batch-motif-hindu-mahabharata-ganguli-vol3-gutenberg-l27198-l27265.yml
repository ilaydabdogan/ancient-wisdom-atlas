canonical_text:
  quote: ''
  summary: Vyasa addresses the grieving king Yudhishthira, arguing that a king must
    protect subjects and uphold duty through chastisement when necessary. Yudhishthira
    says the killings done for the kingdom torment him. Vyasa then discusses agency,
    destiny, chance, prior action, moral consequence, scriptural authority, and expiation,
    urging Yudhishthira not to destroy himself but to perform expiatory acts while
    alive.
  language: English
  quote_policy: summarized
