canonical_text:
  quote: I think this universal destruction has been brought about by the irresistible
    course of Time.
  summary: Draupadi laments the absence of grandsons including Abhimanyu and says
    a kingdom is useless to her after losing her children. Kunti comforts her and
    goes with her sons toward Gandhari. Gandhari, herself grief-stricken, consoles
    Draupadi by saying the slaughter was inevitable, caused by Time rather than voluntary
    human agency, and had been foretold by Vidura after Krishna's failed peace appeal.
  language: English
  quote_policy: quoted
