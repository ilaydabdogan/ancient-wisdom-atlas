canonical_text:
  quote: "“Satyaki checked the Kaikaya princes Vinda and Anuvinda.”"
  summary: 'Sanjaya describes Karna attacking the Pandava army and many warriors meeting
    opposing warriors. The central action follows Satyaki’s battle with the Kaikaya
    brothers Vinda and Anuvinda: after an arrow exchange, Satyaki cuts off Anuvinda’s
    head, then fights Vinda first from chariots and then on foot with swords and shields,
    kills him, mounts another car, and attacks the Kaikaya force until it flees.'
  language: English
  quote_policy: quoted
