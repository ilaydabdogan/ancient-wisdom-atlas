canonical_text:
  quote: ''
  summary: Sauti reports that, after Vaisampayana had explained Narayana's glory to
    Janamejaya, Vaisampayana turned to Yudhishthira's question to Bhishma about the
    foremost duties of the several modes of life. Bhishma answers that such duties
    can lead to heaven and Truth when performed well, and he frames the topic as an
    ancient conversation between Narada and Indra. Narada, described as a perfected
    celestial rishi who wanders through all worlds, once came to Indra's abode, was
    honored, and was asked by Indra to recount any wonderful incident he had seen,
    heard, or felt.
  language: English
  quote_policy: summarized
