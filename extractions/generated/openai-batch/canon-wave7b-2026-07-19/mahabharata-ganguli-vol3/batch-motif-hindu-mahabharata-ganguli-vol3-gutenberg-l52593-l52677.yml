canonical_text:
  quote: ''
  summary: 'An opening fragment reports Bhishma saying that a sire followed his son''s
    instruction and urging the king to follow the religion of Truth. In Section CCLXXVIII,
    Yudhishthira asks what conduct, acts, knowledge, and devotion lead to Brahma''s
    unchangeable place beyond Prakriti. Bhishma answers with a detailed discipline
    of renunciation: leaving home, restraining the senses, non-injury, equanimity,
    mendicant alms, minimal food, solitary dwelling, yoga, contemplation of Self,
    control of impulses, neutrality toward praise and blame, and harmlessness toward
    all creatures. Bhishma cites the sage Harita as declaring this to be the path
    to Emancipation and bright eternal regions.'
  language: English
  quote_policy: summarized
