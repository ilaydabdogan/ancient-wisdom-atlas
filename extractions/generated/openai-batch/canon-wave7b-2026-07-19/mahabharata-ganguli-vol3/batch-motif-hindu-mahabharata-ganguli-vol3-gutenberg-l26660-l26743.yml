canonical_text:
  quote: ''
  summary: Vasudeva counsels a grieving king not to mourn the warriors slain in battle,
    saying that they died honorably and went to heaven. He cites Narada’s discourse
    to Srinjaya after the death of Srinjaya’s son, in which Narada teaches that all
    beings die and recounts ancient kings—Marutta, Suhotra, Vrihadratha, and Sivi—whose
    extraordinary power, sacrifices, wealth, divine associations, and gifts did not
    prevent death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vasudeva tells the addressed king not to indulge in body-emaciating grief
    because the slain will not return.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fallen Kshatriyas are described as battle heroes who died while facing
    their foes, not while fleeing or wounded in the back.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The slain warriors are said to have cast off their life-breaths, become sanctified
    by weapons, and proceeded to heaven.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vasudeva introduces an old discourse spoken by Narada to Srinjaya when Srinjaya
    was grieving over his son’s death.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Narada states that he, Srinjaya, and all creatures are subject to happiness,
    misery, and death.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Narada says that listening attentively to histories of ancient kings can abate
    sorrow, propitiate malignant stars, and increase one’s life-period.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Marutta, son of Avikshit, performed the Viswasrij sacrifice, received gods
    including Indra, Varuna, and Vrihaspati, challenged Sakra, and vanquished him
    in battle.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Vrihaspati refused to officiate at Marutta’s sacrifice for Indra’s benefit,
    and Samvarta accepted the king’s request.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: During Marutta’s rule, the earth yielded crops without tilling; divine groups
    attended or served at his sacrifice; the Maruts drank Soma; and his sacrificial
    presents surpassed those of gods, Gandharvas, and men.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Marutta is said to have surpassed Srinjaya in religious merit, knowledge,
    renunciation, and affluence, yet he too fell prey to death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: During Suhotra’s rule, Maghavat or Indra showered gold for a year, and rivers
    bore golden tortoises, crabs, alligators, sharks, and porpoises.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Suhotra collected the gold that covered the earth, performed a sacrifice at
    Kurujangala, and gave the wealth to Brahmanas.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Vrihadratha, king of the Angas, gave away large numbers of horses, maidens,
    elephants, bulls, and kine in sacrifices.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: At Vrihadratha’s sacrifice near the hill Vishnupada, Indra became intoxicated
    with Soma and the Brahmanas with the presents they received.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: Sivi, son of Usinara, is said to have swayed the whole earth, ridden a single
