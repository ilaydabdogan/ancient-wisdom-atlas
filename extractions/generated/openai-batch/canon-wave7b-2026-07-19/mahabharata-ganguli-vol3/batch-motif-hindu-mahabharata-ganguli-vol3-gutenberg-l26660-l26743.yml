  claim: 'The episodes of Marutta, Suhotra, Vrihadratha, and Sivi share the same narrative
    function: each presents an exceptionally great royal figure whose death demonstrates
    that Srinjaya should not grieve for his son.'
  claim_level: same_function
  target: Repeated death-exemplum pattern within Narada’s consolation discourse
  evidence_refs:
  - ev:7
  - ev:9
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal comparison among examples in the supplied passage,
    not a claim of historical contact or external parallel.
- id: claim:2
  claim: The royal episodes repeatedly use sacrifice and lavish donation as a shared
    motif family.
  claim_level: same_motif
  target: Sacrifice and sacred-exchange pattern within the ancient-king exempla
  evidence_refs:
  - ev:6
  - ev:9
  - ev:10
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The details vary by king, and the Sivi episode is incomplete at the
    end of the supplied passage.
