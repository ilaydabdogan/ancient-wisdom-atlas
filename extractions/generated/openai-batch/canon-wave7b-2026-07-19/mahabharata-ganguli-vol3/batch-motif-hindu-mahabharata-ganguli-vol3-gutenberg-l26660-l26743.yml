candidate_motifs:
- id: motif:1
  label: Honorably slain warriors ascend to heaven
  taxonomy_refs:
  - afterlife_journey_map
  basis: The passage says warriors who died facing enemies and were sanctified by
    weapons proceeded to heaven.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage states heavenly destination but does not describe a detailed
    afterlife route or map.
- id: motif:2
  label: Consolation through examples of universally mortal great kings
  taxonomy_refs:
  - wisdom
  basis: Narada’s discourse uses accounts of greater ancient kings who died to instruct
    Srinjaya not to grieve for his son.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:7
  - ev:9
  - ev:11
  - ev:12
  confidence: high
  cautions: This is a rhetorical and didactic pattern within the passage, not a claim
    about external parallels.
- id: motif:3
  label: Royal sacrifice with extraordinary gifts
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Marutta, Suhotra, Vrihadratha, and Sivi are each associated with sacrifices
    and exceptional giving of wealth, animals, or presents.
  evidence_refs:
  - ev:6
  - ev:9
  - ev:10
  - ev:12
  confidence: high
  cautions: The passage emphasizes gifts and ritual performance but gives uneven detail
    for each king.
- id: motif:4
  label: Divine participation in royal ritual
  taxonomy_refs:
  - sacred_exchange
  basis: Gods attend Marutta’s sacrifice, divine groups serve or drink Soma, Indra
    showers gold and drinks Soma, and ritual action involves divine-human exchange.
