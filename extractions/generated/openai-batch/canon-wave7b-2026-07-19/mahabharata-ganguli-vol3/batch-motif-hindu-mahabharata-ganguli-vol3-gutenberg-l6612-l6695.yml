canonical_text:
  quote: ''
  summary: Arjuna fills the sky and battlefield with gold-winged arrows, slays many
    foes, attacks the samsaptaka wing protected by Kambojas, and kills the younger
    brother of Sudakshina. The battlefield becomes red with blood and carnage. Ashvatthama
    then attacks, shrouding Krishna and Arjuna with arrows, routing the Pandava army,
    and alarming cosmic and celestial witnesses. Krishna angrily exhorts Arjuna not
    to spare Ashvatthama as the son of his preceptor. Arjuna responds by cutting off
    Ashvatthama’s bow, standards, umbrella, banners, car, dart, and mace within the
    supplied passage range.
  language: English
  quote_policy: summarized
