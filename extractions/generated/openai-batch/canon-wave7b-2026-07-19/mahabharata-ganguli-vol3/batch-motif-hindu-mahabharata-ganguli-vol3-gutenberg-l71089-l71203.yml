canonical_text:
  quote: To perform the Sacrifice of Self is to merge the Soul in the Supreme Soul.
  summary: A series of translator’s notes explains philosophical points about creation,
    perception, mind, soul, emancipation, desirelessness, compassion, sacrifice, and
    metaphoric terms such as senses as cattle and cave as body. The notes identify
    causes of creation, discuss wakefulness, dream, and Sushupti or Emancipation,
    describe Brahmabhava as attaining Brahma, and define the Sacrifice of Self as
    merging the Soul in the Supreme Soul.
  language: English
  quote_policy: quoted
