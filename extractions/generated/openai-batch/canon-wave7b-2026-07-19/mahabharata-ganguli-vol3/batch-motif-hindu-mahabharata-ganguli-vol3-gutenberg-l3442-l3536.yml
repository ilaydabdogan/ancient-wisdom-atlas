canonical_text:
  quote: Union is great strength.
  summary: The gods, led by Brahman and accompanied by Rishis, seek Sthanu/Sankara
    for protection against the Asuras or Danavas whose three forts can be destroyed
    only by one shaft. They praise the deity with many epithets. Brahman petitions
    him to slay the Danavas for the welfare of the universe. Sthanu discusses whether
    the gods can act with half his might, but the gods say they cannot bear it and
    ask him to act with half of their united energy.
  language: English
  quote_policy: quoted
