  quote: ''
  summary: Narada reports that he has seen the immutable Being whose form is the universe,
    describes the devotion of the inhabitants of White Island, praises Hari/Madhava
    as cause, actor, and effect, describes a realm untouched by sun, moon, or wind
    where the deity practices severe austerities at an altar, and says that sacrificial
    offerings and devoted rites reach that deity.
