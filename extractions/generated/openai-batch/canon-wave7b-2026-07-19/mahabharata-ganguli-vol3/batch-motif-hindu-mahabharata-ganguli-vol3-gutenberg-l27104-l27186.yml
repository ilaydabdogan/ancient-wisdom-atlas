canonical_text:
  quote: ''
  summary: Narada recounts how he and Parvata accepted King Srinjaya's hospitality,
    offered him a boon, and granted him a brilliant son named Suvarnashthivin, though
    not a long-lived one because the request threatened Indra's superiority. Narada
    promises to restore the child if he dies. Indra, fearing humiliation, commands
    his embodied weapon Thunder to take tiger form and kill the boy. The tiger kills
    the child by the Bhagirathi, the king grieves and invokes Narada, and Narada restores
    the child to life with Indra's permission. The passage closes by affirming that
    what is ordained must occur and by noting the prince's later succession.
  language: English
  quote_policy: summarized
