canonical_text:
  quote: ''
  summary: Sanjaya narrates a mace duel between Shalya, ruler of the Madras, and Bhima.
    The warriors are described through divine, fiery, animal, mountain, and thunder
    imagery. They circle, strike each other, remain unmoved, and finally fall together.
    Kripa removes Shalya from the field while Bhima rises and challenges again. A
    wider battle follows, including Duryodhana striking Chekitana and several named
    engagements among Kaurava and Pandava warriors.
  language: English
  quote_policy: summarized
