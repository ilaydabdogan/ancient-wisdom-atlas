canonical_text:
  quote: ''
  summary: Karna claims Arjuna is surrounded and will perish, while Shalya answers
    that defeating Arjuna is as impossible as mastering cosmic elements and declares
    him unconquerable even by gods and Asuras. Shalya points to the assembled Pandava
    allies. Sanjaya then narrates Arjuna’s attack on the samsaptakas, the wider clash
    of armies, and Karna’s protected assault on the Pandava side, with several martial
    similes comparing the battle to rivers, divine conflicts, death, and Rudra’s destructive
    rage.
  language: English
  quote_policy: summarized
