canonical_text:
  quote: ''
  summary: Duryodhana argues that Karna's weapons, body marks, and martial feats show
    that he is no ordinary Suta-born man but likely divinely or Kshatriya-born. He
    urges Shalya to serve as Karna's charioteer by citing the precedent of Brahman
    driving Rudra. Shalya recalls the same divine charioteer-warrior precedent, compares
    Krishna's role as Partha's driver to it, warns of Krishna's wrath if Partha is
    killed, and finally accepts Karna's drivership on the condition that he may speak
    freely.
  language: English
  quote_policy: summarized
