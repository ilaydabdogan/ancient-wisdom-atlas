canonical_text:
  quote: Hostilities have come to an end! King Suyodhana hath been struck down!
  summary: After Yudhishthira speaks, Vasudeva reluctantly approves Bhima's actions.
    Bhima, having struck down Dhritarashtra's son, salutes Yudhishthira and declares
    the Earth free of foes and returned to him. Yudhishthira says hostilities are
    ended, the Earth has been conquered through Krishna's counsel, and Bhima has paid
    his debt to his mother and wrath. Dhritarashtra then asks Sanjaya what the Pandavas
    and Srinjayas did after Duryodhana was struck down.
  language: English
  quote_policy: quoted
