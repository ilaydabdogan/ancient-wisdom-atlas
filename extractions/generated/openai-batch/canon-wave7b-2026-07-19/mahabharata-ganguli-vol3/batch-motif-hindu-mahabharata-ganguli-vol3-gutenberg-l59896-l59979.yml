canonical_text:
  quote: ''
  summary: Narada recounts Sanatkumara's instruction to purified Rishis who came seeking
    truth. The teaching praises knowledge, renunciation, righteousness, compassion,
    forgiveness, truth, self-knowledge, non-injury, friendliness, sense-control, Yoga-meditation,
    contentment, and detachment. It warns that desire, wrath, cupidity, worldly attachment,
    family attachment, bodily identification, and possessions lead to stupefaction,
    sorrow, and destruction. It also states that acts determine future status and
    follow one to the other world, using images of nets, a cocoon, a cauldron of Time,
    elephants in mire, and fishes dragged onto land.
  language: English
  quote_policy: summarized
