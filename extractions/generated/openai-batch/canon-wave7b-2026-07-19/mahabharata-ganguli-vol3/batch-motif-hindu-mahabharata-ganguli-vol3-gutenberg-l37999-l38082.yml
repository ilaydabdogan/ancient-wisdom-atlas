canonical_text:
  quote: Animosity is not quickly cooled.
  summary: Pujani and Brahmadatta debate whether persons divided by injury and retaliation
    can safely remain together. Pujani argues that trust after injury is dangerous,
    that animosity endures, and that departure is necessary. Brahmadatta argues that
    retaliation can settle the account and that co-residence or union can cool hostility.
    Pujani concludes by listing causes of hostility and comparing animosity to hidden
    or inextinguishable fire.
  language: English
  quote_policy: quoted
