canonical_text:
  quote: ''
  summary: Sanjaya narrates a destructive battle in which Shakuni, Sahadeva, Uluka,
    Bhima, and others exchange arrow volleys. The battlefield becomes darkened and
    corpse-strewn. Sahadeva is wounded but recovers; Bhima checks and routs Shakuni's
    followers with arrows and a roar. Duryodhana exhorts fleeing warriors to fight
    and die honorably. Sahadeva beheads Uluka, after which Shakuni grieves for his
    son and attacks Sahadeva with successive weapons that Sahadeva counters.
  language: English
  quote_policy: summarized
