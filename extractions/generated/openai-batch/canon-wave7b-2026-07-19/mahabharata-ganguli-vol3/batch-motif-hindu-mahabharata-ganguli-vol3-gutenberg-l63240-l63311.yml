canonical_text:
  quote: ''
  summary: Vaisampayana describes Narayana as Supreme Lord and Creator, explains cosmic
    dissolution through successive merging of elements and principles into the Supreme
    Soul, and then narrates a creation scene in which Brahma arises, Narayana/Hari
    lies on primeval waters, Brahma is born in a lotus from Aniruddha's navel, Madhu
    and Kaitabha arise from two water drops, steal the Vedas from Brahma, and dive
    into the ocean. Brahma laments the loss and prepares to hymn Narayana.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: All existent objects are described as combinations of the five primal elements
    due to the intelligence of the Supreme Lord, and Narayana is described as Supreme
    Lord, Creator, inner Soul, and giver of boons.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The destruction of things is described as a sequence of mergings: Earth into
    Water, Water into Heat, Heat into Wind, Wind into Space, Space into Mind, Mind
    into the Manifest, the Manifest into the Unmanifest, the Unmanifest into Purusha,
    and Purusha into the Supreme Soul; after this, darkness covers the universe.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: From primal darkness arises Brahma, who develops into the idea of the universe
    and assumes the form of Purusha called Aniruddha; the passage also applies names
    such as Pradhana, Manifest, Viswaksena, and Hari in this context.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hari lies on the waters in Yoga-sleep and thinks of creating the diversified
    universe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A four-faced Brahma, called Hiranyagarbha and Grandsire of the worlds, takes
    birth within a lotus that springs from the navel of Aniruddha, sits on that lotus,
    sees waters on all sides, and begins creation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Two drops of water are present in the primeval lotus; one is beautiful, bright,
    and honey-like, and the other is hard.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: At Narayana's command, Madhu arises from the honey-like drop and is associated
    with Tamas; Kaitabha arises from the hard drop and is associated with Rajas. Both
    are mighty, armed with maces, and roam within the primeval lotus.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Madhu and Kaitabha see Brahma creating the four Vedas, seize the Vedas in
    Brahma's sight, and dive with them into the ocean of waters to its bottom.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Brahma grieves over the loss of the Vedas and says they are his eyes, strength,
    refuge, and high Brahman; he says that without them the worlds he created are
    enveloped in darkness.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: While speaking in grief, Brahma resolves to hymn Hari, joins his hands in
    reverence, seizes the feet of his progenitor, and sings a hymn in honor of Narayana.
  category: action
  evidence_refs:
  - ev:9
