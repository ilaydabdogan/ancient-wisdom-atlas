canonical_text:
  quote: ''
  summary: Bhishma instructs the addressed king on how to choose legislators, ministers,
    courtiers, officers, and counsellors. He lists desirable qualities such as modesty,
    self-restraint, truthfulness, courage, learning, loyalty, good birth, tested conduct,
    and awareness of place and time. He warns against covetous, cruel, shameless,
    unlearned, unstable, or disloyal servants and uses a fire-consuming-a-tree simile
    for the danger of a wicked minister.
  language: English
