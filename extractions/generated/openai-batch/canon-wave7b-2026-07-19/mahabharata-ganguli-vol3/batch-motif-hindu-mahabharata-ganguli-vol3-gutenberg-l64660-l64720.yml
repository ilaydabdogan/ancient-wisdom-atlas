canonical_text:
  quote: ''
  summary: A Brahmana thanks a Naga for teaching him the way to follow. The Naga asks
    the Brahmana to disclose his purpose and invites him to remain as a friend. The
    Brahmana says his doubt about the best means of righteousness has been dispelled
    through learning the Unccha vow, then departs to receive formal initiation from
    Chyavana. Bhishma recounts the subsequent transmission of this sacred history
    through Chyavana, Janaka, Narada, Indra, the Brahmanas, the Vasus, and himself,
    presenting it as an answer about the highest duty.
  language: English
  quote_policy: summarized
