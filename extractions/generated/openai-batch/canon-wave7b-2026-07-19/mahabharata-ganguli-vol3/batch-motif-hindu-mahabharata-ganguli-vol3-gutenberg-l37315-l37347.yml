canonical_text:
  quote: ''
  summary: 'Bhishma, discussing how a king should fill his treasury, cites verses
    attributed to Brahman. The passage distinguishes wealth that should not be taken,
    especially wealth connected with sacrifice and deities, from wealth of those who
    neglect rites and sacrifices. It presents Kshatriya sovereignty over earthly wealth
    as tied to maintaining an army, performing sacrifice, redistributing wealth from
    the wicked to the good, and avoiding hoarding. Several analogies explain this
    moral teaching: useless plants burned for cooking, ants appearing without evident
    cause, insects driven from cattle at milking, and dust becoming finer when pounded
    like moral questions refined through discussion.'
  language: English
  quote_policy: summarized
