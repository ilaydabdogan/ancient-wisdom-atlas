candidate_motifs:
- id: motif:1
  label: etiological curse causing permanent physical mark or condition
  taxonomy_refs: []
  basis: Multiple episodes explain enduring features—Sreevatsa, Agni's devouring nature,
    lunar marks and phases, limited tree flowering, salty ocean water, and gemless
    mountains—as results of curses or ascetic acts.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  - ev:8
  - ev:10
  - ev:12
  - ev:14
  confidence: high
  cautions: This is a passage-level pattern rather than a named taxonomy family in
    the supplied list.
- id: motif:2
  label: ascetic power reshapes the natural world
  taxonomy_refs:
  - wisdom
  basis: Rishis or ascetic figures who pray, undertake vows, or practice austerities
    alter divine bodies, plants, ocean water, and mountains through curses or bodily
    heat.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  - ev:14
  confidence: medium
  cautions: The available taxonomy ref 'wisdom' is broad; the passage emphasizes ascetic
    potency and speech more than instruction or knowledge.
- id: motif:3
  label: birth in egg form after a curse
  taxonomy_refs:
  - cosmic_egg
  - sacred_birth
  basis: Vudha's curse links Aditi's womb-pain to Vivaswat's second birth in the form
    of an egg, after which he is called Martanda.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage gives an egg birth of a deity but does not describe a world-creating
    cosmic egg.
- id: motif:4
  label: refused alms leading to divine or maternal curse
  taxonomy_refs:
  - sacred_exchange
  basis: Vudha asks Aditi for alms after an austere vow; Aditi refuses, and the refusal
    triggers a curse affecting Vivaswat's birth.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage does not elaborate a full exchange ritual beyond the alms
    request and refusal.
- id: motif:5
  label: unequal love among spouses produces celestial disorder
  taxonomy_refs:
  - sacred_marriage
  basis: Shoma's preference for Rohini over the other Nakshatras provokes complaint,
    Daksha's curse, and the moon's waning, waxing, spots, and hare-mark.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:8
  confidence: medium
  cautions: The marriage motif is present, but the emphasis is etiological and punitive
    rather than on a sacred marriage rite.
- id: motif:6
  label: ritual bathing removes sin and names a sacred place
  taxonomy_refs:
  - sacred_exchange
  - water
