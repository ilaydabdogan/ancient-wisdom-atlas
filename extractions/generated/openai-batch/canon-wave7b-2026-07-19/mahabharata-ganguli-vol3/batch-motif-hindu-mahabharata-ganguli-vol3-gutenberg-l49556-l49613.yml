canonical_text:
  quote: '"The Soul, without being connected with them, stands aloof, presiding over
    them."'
  summary: Vyasa teaches that objects are created by the understanding while the Soul
    presides aloof. He discusses the qualities, knowledge, Yoga, the cutting of the
    heart-knot, the contrast between ignorance and learning, and the relation of knowledge
    and action to emancipation.
  language: English
