canonical_text:
  quote: ''
  summary: Vasishtha asks Sarasvati to carry him away so Vishvamitra will not curse
    her. Sarasvati, personified as a river goddess, erodes her bank and bears Vasishtha
    away, then brings him near Vishvamitra and removes him again when Vishvamitra
    seeks to kill him. Vishvamitra curses Sarasvati so that her current becomes blood
    acceptable to Rakshasas; she flows with blood mixed with water for a year, causing
    celestial sorrow. The tirtha is named Vasishthapravaha, and the river later regains
    its proper condition.
  language: English
