canonical_text:
  quote: ''
  summary: Bhishma instructs a king that servants and ministers should be appointed
    to offices suited to their capacities. He uses the example of a dog wrongly elevated
    above its fitness, and animal analogies involving the Sarabha, lion, tiger, leopard,
    and dogs. He further advises the king to choose learned, honest, brave, high-born,
    wise, self-controlled ministers; to speak kindly to devoted servants; to guard
    and increase the treasury, grain stores, military readiness, friends, relatives,
    and city welfare.
  language: English
  quote_policy: summarized
