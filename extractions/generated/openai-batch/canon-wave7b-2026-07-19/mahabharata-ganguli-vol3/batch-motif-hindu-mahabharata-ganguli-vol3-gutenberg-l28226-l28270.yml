canonical_text:
  quote: ''
  summary: After Yudhishthira regains his kingdom, Janamejaya asks what Yudhishthira
    and Krishna did next. Vaisampayana narrates that Yudhishthira restores social
    duties, gives wealth and honours to Brahmanas, dependents, priests, elders, and
    citizens, places the kingdom at the disposal of Dhritarashtra, Gandhari, and Vidura,
    and then approaches Krishna. Krishna is described in splendid divine adornment.
    Yudhishthira attributes victory and restored rule to Krishna's grace, but Krishna
    remains silent because he is absorbed in meditation.
  language: English
  quote_policy: summarized
