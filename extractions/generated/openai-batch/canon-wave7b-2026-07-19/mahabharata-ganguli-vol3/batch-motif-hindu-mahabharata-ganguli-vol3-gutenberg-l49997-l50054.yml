canonical_text:
  quote: ''
  summary: Yudhishthira, seeing slain kings on the battlefield, asks Bhishma about
    animation, death, and who or what dies. Bhishma recounts the case of the defeated
    king Anukampaka, whose son Hari was slain; Narada then tells Anukampaka an origin
    narrative in which Brahman creates living beings that do not die, the worlds become
    overcrowded, Brahman’s wrath produces a fire that burns the universe, and Sthanu
    approaches Brahman out of compassion.
  language: English
  quote_policy: summarized
