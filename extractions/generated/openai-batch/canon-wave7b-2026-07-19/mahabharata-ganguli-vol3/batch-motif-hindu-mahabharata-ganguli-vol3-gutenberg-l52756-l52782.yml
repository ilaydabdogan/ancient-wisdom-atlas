canonical_text:
  quote: ''
  summary: Vritra recounts severe penances undertaken for victory, the power and prosperity
    he gained and lost, his battleward desire toward Indra, and his vision of Hari/Narayana.
    He then asks Usanas about Brahma prosperity, the origins and actions of creatures,
    the fruit of eternal life as Brahma, and whether Act or Knowledge attains it.
    A framing narrator asks a king and his brothers to listen to Usanas's reply.
  language: English
  quote_policy: summarized
