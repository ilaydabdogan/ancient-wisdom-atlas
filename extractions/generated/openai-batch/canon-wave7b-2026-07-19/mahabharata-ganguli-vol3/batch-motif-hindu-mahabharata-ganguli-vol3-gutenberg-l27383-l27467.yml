canonical_text:
  quote: After doing what acts does a man become liable to perform expiation?
  summary: Yudhishthira asks Vyasa which acts make a person liable to expiation and
    which acts free a person from sin. Vyasa lists omissions, forbidden deeds, deceitful
    conduct, and many specific social, ritual, and moral faults. He then gives exceptions
    in which otherwise forbidden acts do not stain the doer, including self-defense
    against an armed Brahmana attacker, acts done in ignorance or medical emergency,
    acts commanded by a preceptor, certain falsehoods, and ritual or social cases
    governed by Vedic authority.
  language: English
  quote_policy: quoted
