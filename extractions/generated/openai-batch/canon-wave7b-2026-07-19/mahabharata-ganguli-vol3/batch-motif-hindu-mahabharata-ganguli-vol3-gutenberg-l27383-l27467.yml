  - ev:2
- id: obs:3
  text: Vyasa lists numerous specific faults, including falling from a vow, wrongful
    marriage order, Brahmana slaughter, speaking ill of others, improper transmission
    or sale of Vedic knowledge, taking many lives, selling flesh, abandoning sacred
    fire, slaying a preceptor or woman, setting fire to a dwelling, living by deceit,
    opposing a preceptor, and violating a compact.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vyasa identifies further interdicted acts, including rejecting one's own creed,
    practicing another's creed, assisting unworthy rites, eating forbidden food, deserting
    one who seeks protection, neglecting servants and dependants, selling certain
    substances, killing birds and animals, refusing procreation when competent, omitting
    daily gifts and dakshina, and humiliating a Brahmana.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Vyasa says that a son who quarrels with his father, a person who violates
    the bed of his preceptor, and one who neglects to produce offspring in a wedded
    wife are sinful.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Vyasa says that if a Veda-knowing Brahmana takes up arms and rushes forward
    in battle to kill, killing him does not make the slayer guilty of Brahmana slaughter.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Vyasa states that drinking alcoholic stimulants in ignorance or on a virtuous
    physician's advice in mortal danger is to be followed by regenerating ceremonies,
    and that interdicted food can be cleansed by expiatory rites.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Vyasa says that connection with a preceptor's wife at the preceptor's command
    does not stain the pupil, and cites Uddalaka causing his son Swetaketu to be begotten
    by a disciple.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'Vyasa permits certain otherwise wrongful acts under specified conditions:
    theft for a preceptor in distress without self-appropriation, falsehood for saving
    life, for a preceptor, for gratifying a woman, or for marriage, and younger-brother
    marriage when the elder brother is fallen or renounced.'
  category: sequence
  evidence_refs:
  - ev:6
