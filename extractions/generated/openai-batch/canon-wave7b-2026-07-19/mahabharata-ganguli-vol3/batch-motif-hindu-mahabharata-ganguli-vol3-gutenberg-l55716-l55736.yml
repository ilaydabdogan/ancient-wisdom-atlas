  summary: Yudhishthira asks Bhishma for his view on truth, self-restraint, forgiveness,
    and wisdom. Bhishma introduces an old narrative in which Brahman, in the form
    of a golden Swan, wanders through the three worlds and is questioned by the Sadhya
    deities about Emancipation, the highest object, and the foremost act by which
    one may be freed from bonds.
