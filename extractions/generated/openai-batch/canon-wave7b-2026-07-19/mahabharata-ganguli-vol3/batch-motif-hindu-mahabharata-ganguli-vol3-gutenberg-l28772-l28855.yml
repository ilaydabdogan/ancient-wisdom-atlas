candidate_motifs:
- id: motif:1
  label: Ascetic quest for divine weapon
  taxonomy_refs:
  - mystical_quest
  - sacred_exchange
  basis: Rama gratifies Mahadeva on Gandhamadana and receives weapons, especially
    the fierce axe.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage states the exchange and weapon bestowal, but does not elaborate
    a full quest sequence beyond Rama's gratification of Mahadeva.
- id: motif:2
  label: Destructive divine fire aided by royal power
  taxonomy_refs:
  - world_destroying_fire
  basis: The god of fire solicits Arjuna, springs from his shafts, and burns settlements,
    forests, mountains, and Apava's retreat.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The destruction is extensive but not explicitly cosmic or world-ending
    in this passage.
- id: motif:3
  label: Ascetic curse fulfilled through bodily mutilation
  taxonomy_refs:
  - divine_judgment
  basis: Apava curses Arjuna that Rama will lop off his thousand arms, and Rama later
    lops off Arjuna's arms.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: medium
  cautions: The passage presents the curse as coming from a Rishi rather than a deity;
    the divine-judgment taxonomy is approximate.
- id: motif:4
  label: Seizure of a sacred calf triggering feud
  taxonomy_refs:
  - sacred_theft
  basis: Arjuna's sons seize the calf of Jamadagni's homa cow, leading to dispute
    and Rama's violent recovery of the calf.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage calls the cow a homa cow, supporting sacred context; it does
    not describe the cow's powers in this excerpt.
- id: motif:5
  label: Avenging son exterminates the killer's lineage and warrior class
  taxonomy_refs: []
  basis: After Jamadagni's killing, Rama vows to free the earth of Kshatriyas, kills
    the sons and grandsons of Kritavirya, slaughters Haihayas, and repeatedly destroys
    Kshatriyas.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
