canonical_text:
  quote: ''
  summary: Vasudeva recounts the lineage of Jamadagni and Rama, Rama's acquisition
    of weapons from Mahadeva, the power and deeds of the thousand-armed Haihaya king
    Arjuna, the burning of Apava's retreat and resulting curse, the seizure of Jamadagni's
    calf, Rama's revenge against Arjuna and the Kshatriyas, and the later transfer
    of the earth to Kasyapa with Rama directed to the southern ocean.
  language: English
  quote_policy: summarized
