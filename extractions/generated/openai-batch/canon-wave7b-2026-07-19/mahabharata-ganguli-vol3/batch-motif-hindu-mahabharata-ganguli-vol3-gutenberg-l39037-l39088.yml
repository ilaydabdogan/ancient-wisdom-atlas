canonical_text:
  quote: ''
  summary: Bhishma narrates that a pigeon, moved by his wife's moral counsel, receives
    a bird-killing fowler as a guest seeking shelter. The pigeon offers welcome, warmth,
    and then, lacking food, resolves to honor the guest by entering the fire himself.
    The fowler, witnessing this act, laments his own cruelty and sin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhishma reports that the pigeon heard moral and reasonable words spoken by
    his wife, became delighted, and wept tears of joy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pigeon honors a fowler whose occupation is the slaughter of birds according
    to prescribed rites.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The pigeon welcomes the fowler, calls the place the fowler's home, asks what
    service is desired, and says hospitality should be shown even to a foe who comes
    to one's house.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pigeon states that a tree does not withdraw its shade even from a person
    approaching to cut it down, and he links hospitality with the duties of domestic
    life and the five sacrifices.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the fowler says he is stiff with cold, the pigeon gathers dry leaves,
    fetches fire, lights the leaves, and tells the fowler to warm his limbs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After warming himself, the fowler says hunger afflicts him and asks for food.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The pigeon says he has no stored food because forest dwellers live on what
    they obtain each day and do not hoard for the next day.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The pigeon becomes pale from shame, reflects silently, resolves to gratify
    the guest, and says he has heard from Rishis, gods, and Pitris that honoring a
    guest has great merit.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The pigeon thrice circumambulates the fire with a smiling face and enters
    its flames.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The fowler sees the bird enter the fire, reflects on what he has done, calls
