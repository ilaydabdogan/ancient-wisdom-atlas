canonical_text:
  quote: ''
  summary: Sanjaya narrates Arjuna advancing toward Karna while Krishna drives his
    white steeds. Ninety oath-bound Kaurava car-warriors pursue Arjuna and are slain.
    Larger Kaurava forces, including an elephant-mounted Mleccha force, surround and
    attack him, but Arjuna destroys their weapons, elephants, horsemen, cars, and
    riders. Bhima sees his brother surrounded, rushes to him, and devastates the remaining
    Kaurava troops and elephant division with his mace. The passage uses battle similes
    involving Siddhas, the Sun, Indra, mountains, volcanic fire, death-night, Yama,
    a Makara, the ocean, and Kadamva flowers.
  language: English
  quote_policy: summarized
