canonical_text:
  quote: ''
  summary: Sanjaya narrates that Ashvatthama, Kripa, and Kritavarma, the surviving
    Kaurava warriors, find Duryodhana fallen, bloodied, and near death on the battlefield.
    Ashvatthama laments the reversal of Duryodhana's royal fortune. Duryodhana accepts
    death as ordained, claims he upheld Kshatriya duty, and says destiny cannot be
    frustrated. Ashvatthama angrily swears revenge on the Pancalas, and Duryodhana
    asks Kripa to bring water so that Ashvatthama may be installed as generalissimo.
  language: English
  quote_policy: summarized
