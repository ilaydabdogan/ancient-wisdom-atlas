canonical_text:
  quote: ''
  summary: Bhima devastates elephants, chariots, foot soldiers, car-warriors, and
    horsemen before turning toward Karna. Karna pursues Yudhishthira after felling
    his driver, but Bhima and then Satyaki engage Karna. Dense arrow-fire obscures
    the sun and directions. The Kauravas rally, the two armies collide and mingle
    amid oceanic noise, warriors exchange insults, and the battle becomes a mutual
    mangling with shafts.
  language: English
  quote_policy: summarized
