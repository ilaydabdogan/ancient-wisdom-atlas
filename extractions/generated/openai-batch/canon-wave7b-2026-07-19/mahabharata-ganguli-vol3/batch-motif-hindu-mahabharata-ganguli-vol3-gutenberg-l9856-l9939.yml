canonical_text:
  quote: ''
  summary: Sanjaya narrates a fierce battle in which Karna devastates Pancala and
    allied warriors, loses his son Prasena to Satyaki, rages against Satyaki, and
    wounds or disables several opponents. Krishna urges Arjuna to rescue the Pancalas
    and slay Karna; Arjuna advances with Bhima guarding his rear. Karna withstands
    five Pancala car-warriors, the sons of Draupadi rescue their maternal uncles,
    and Satyaki later resists four assailants including Karna.
  language: English
  quote_policy: summarized
