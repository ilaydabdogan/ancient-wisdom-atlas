canonical_text:
  quote: ''
  summary: The passage gives counsel on how a king should deal with foes through open
    attack, secret chastisement, deception, agents, public and private measures, and
    ritual actions. Indra then asks Vrihaspati how to recognize a wicked person. Vrihaspati
    lists social, verbal, bodily, and relational indications of wickedness and enmity.
    Bhishma concludes that Indra followed Vrihaspati's instructions and subdued his
    enemies.
  language: English
  quote_policy: summarized
