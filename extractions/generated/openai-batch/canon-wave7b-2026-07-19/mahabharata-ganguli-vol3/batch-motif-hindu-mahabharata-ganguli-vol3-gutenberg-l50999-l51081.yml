canonical_text:
  quote: Twice blessed be the man that reflects long before he acts.
  summary: Bhishma introduces an old story about Chirakarin, son of Gautama, whose
    habit of long reflection is praised. Gautama angrily orders Chirakarin to slay
    his mother and departs to the woods. Chirakarin delays and reflects on the conflict
    between obeying his father and protecting his mother, then considers the reverence
    due to father and mother.
