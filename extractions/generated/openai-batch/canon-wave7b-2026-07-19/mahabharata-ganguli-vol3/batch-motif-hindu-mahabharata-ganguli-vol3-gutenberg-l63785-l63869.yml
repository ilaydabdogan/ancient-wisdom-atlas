canonical_text:
  quote: ''
  summary: Vyasa recounts a creation narrative in which Narayana creates Brahma from
    his navel and commands him to create beings. Brahma lacks wisdom, so Narayana
    summons the Goddess of Intelligence and commands her to enter Brahma, enabling
    creation. Narayana then reflects that Earth will be burdened by powerful beings
    and resolves to descend in various forms to uphold righteousness, chastise the
    wicked, and support Earth as a mighty snake. He names future forms including Boar,
    Man-lion, Dwarf, and humans. Narayana also utters the syllable Bho, from which
    the Rishi Saraswat, also called Apantaratamas, arises; Narayana commands him to
    distribute the Vedas, and later grants him a recurring role in each Manwantara
    and foretells future births connected with the Kauravas.
  language: English
  quote_policy: summarized
