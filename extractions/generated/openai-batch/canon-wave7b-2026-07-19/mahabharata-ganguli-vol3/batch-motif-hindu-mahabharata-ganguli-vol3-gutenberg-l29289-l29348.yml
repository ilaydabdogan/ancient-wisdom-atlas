canonical_text:
  quote: I shall discourse on the subject of duty.
  summary: Bhishma, speaking to Krishna and Yudhishthira, offers to answer questions
    on morality and duty. Krishna explains Yudhishthira's shame and fear after the
    slaughter of kin and elders. Bhishma defines Kshatriya duty in battle, including
    fighting even against relatives or preceptors when they act unjustly, and says
    righteous battle brings heaven and fame. Yudhishthira humbly approaches Bhishma,
    seizes his feet, and is reassured.
  language: English
  quote_policy: quoted
