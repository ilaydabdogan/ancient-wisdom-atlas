canonical_text:
  quote: born under extraordinary circumstances on an Island
  summary: Janamejaya asks whether several systems of knowledge teach the same duties.
    Vaisampayana praises Vyasa as island-born to Satyavati and Parasara, yet also
    as a form, portion, and son of Narayana. Janamejaya asks about this divine birth,
    and Vaisampayana recalls Vyasa on the Himavat mountains, attended by disciples,
    before narrating teachings and the birth from Narayana.
  language: English
  quote_policy: quoted
