canonical_text:
  quote: ''
  summary: Sanjaya reports Shalya addressing Karna and introducing a simile of a crow
    as corrective counsel. In the tale, a wealthy and virtuous Vaishya's children
    feed a crow from their dishes. The crow becomes proud, believes the children's
    praise that he is superior to all birds, and challenges far-ranging swans to a
    contest of flight. The crow boasts of a hundred and one kinds of motion, while
    one swan replies that it will fly in the single kind of flight known to birds;
    assembled crows laugh.
  language: English
  quote_policy: summarized
