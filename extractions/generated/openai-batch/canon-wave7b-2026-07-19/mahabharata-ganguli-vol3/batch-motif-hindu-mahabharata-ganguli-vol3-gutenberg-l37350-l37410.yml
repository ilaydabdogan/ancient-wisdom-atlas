canonical_text:
  quote: ''
  summary: Bhishma tells a didactic story of three Sakula fishes in a lake. When fishermen
    drain the lake, the fish with foresight departs early, the fish with presence
    of mind later escapes by pretending to be caught, and the procrastinating fish
    is caught and dies. Bhishma then draws a moral about forethought, presence of
    mind, proper timing, place, and practical policy.
  language: English
  quote_policy: summarized
