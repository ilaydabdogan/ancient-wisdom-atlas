canonical_text:
  quote: ''
  summary: 'Gandhari describes the battlefield after slaughter: carnivorous creatures
    and wolves drag ornaments from dead heroes, Kuru and Bharata women lament over
    bodies, the earth is strewn with severed limbs and blood, women attempt and fail
    to match heads and trunks, and Gandhari laments seeing her slain kin before her
    eyes fall upon Duryodhana.'
  language: English
  quote_policy: summarized
