canonical_text:
  quote: ''
  summary: 'A holy speaker addresses the son of Pandu and recounts an ancient cosmological
    teaching: at the end of four thousand celestial Yugas the universe dissolves,
    manifest things disappear into the unmanifest, creatures and elements perish,
    and darkness and water remain. In that condition undifferentiated Brahman alone
    exists; Hari arises from Tamas, and Brahman/Brahma creates Agni and Shoma from
    his eyes, followed by human orders. The passage then explains the ritual and cosmic
    status of Brahmanas, their association with Shoma and Agni, the sacrificial role
    of Agni, the strengthening of deities through sacrifices, the support of Earth
    and heaven through Brahmanical learning and observance, and the misery of realms
    where Brahmanas lack support. The supplied passage ends abruptly.'
  language: English
  quote_policy: summarized
