candidate_motifs:
- id: motif:1
  label: cosmic dissolution into undifferentiated darkness and water
  taxonomy_refs:
  - chaos
  - annihilation_union
  basis: The passage describes the destruction of creatures and elements, the disappearance
    of the manifest into the unmanifest, and the remaining state as darkness, water,
    and undifferentiated Brahman.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage describes dissolution and a pre-creation condition, but the
    supplied excerpt does not narrate a full flood rescue or renewal cycle.
- id: motif:2
  label: divine emanational creation from primordial darkness
  taxonomy_refs:
  - sacred_birth
  - divine_parent_child
  basis: Hari springs from Tamas, Brahman arises from Hari, and Agni and Shoma spring
    from Brahman's eyes before human orders are created.
  evidence_refs:
