canonical_text:
  quote: '"This son of thine that is born will have the prowess of Vasava himself!"'
  summary: Sanjaya reports that Yudhishthira, angry that Karna remains alive, rebukes
    Arjuna for leaving battle, failing his promise to kill Karna, and abandoning Bhima.
    Yudhishthira recalls a heavenly voice at Arjuna's birth that foretold his unmatched
    prowess and victories, then contrasts that prophecy with Arjuna's present failure.
    He names Arjuna's divine or heroic equipment, including Gandiva, Krishna as charioteer,
    an ape-bannered car, and a fire-god-given car, and says Arjuna should give the
    bow to someone more capable.
  language: English
  quote_policy: quoted
