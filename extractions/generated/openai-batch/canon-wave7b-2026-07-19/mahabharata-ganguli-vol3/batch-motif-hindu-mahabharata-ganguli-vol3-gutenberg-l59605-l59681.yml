canonical_text:
  quote: ''
  summary: Bhishma recounts that Suka, after hearing Janaka, attains tranquil self-knowledge
    and goes north to Himavat. The passage describes Himavat as a divine mountain
    visited by celestial beings, recalls Vishnu's austerities there, narrates Skanda's
    dart challenge and Vishnu's restrained response, describes Mahadeva's fire-girdled
    ascetic site, and ends with Suka returning to Vyasa's mountain asylum where Vedic
    disciples gather around their preceptor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Suka hears Janaka's words, becomes tranquil with his object accomplished,
    asks no further questions, and travels north to Himavat with wind-like speed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Himavat is described as inhabited or adorned by Apsaras, Kinnaras, birds,
    Garuda, the four Regents, deities, and Rishis.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Vishnu is said to have performed severe austerities on that mountain for the
    purpose of obtaining a son.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kumara, also called Skanda, throws down a dart that pierces the Earth and
    challenges anyone superior to him to draw it up or shake it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The three worlds become anxious after Skanda's challenge and living beings
    ask who will raise the dart.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Vishnu takes the blazing dart in his left hand and shakes it, causing the
    Earth with mountains, forests, and seas to shake, but he does not raise it in
    order to leave Skanda's honor intact.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Prahlada seizes the dart but cannot shake it and falls into a swoon on the
    hilltop.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mahadeva's northern mountain asylum is surrounded by blazing fire, has a fiery
    girdle ten Yojanas wide, and is described as unapproachable by persons of uncleansed
    souls and by Yakshas, Rakshasas, and Danavas.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mahadeva stands on one foot for a thousand celestial years in penance while
    the Fire-god dwells there removing impediments from his side.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the foot of the mountains, Vyasa teaches the Vedas to Sumantra, Vaisampayana,
    Jaimini, and Paila.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Suka comes to Vyasa's asylum in Yogic detachment, seeming not to touch the
    mountain's trees or rocks, then touches his father's feet and greets the disciples.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Vyasa continues teaching his disciples and son; the disciples sit around him
    with controlled senses, tranquil souls, mastery of the Vedas, observance of penances,
    and joined hands.
  category: sequence
  evidence_refs:
  - ev:8
