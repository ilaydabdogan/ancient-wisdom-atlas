canonical_text:
  quote: ''
  summary: Bhishma recounts that king Vasuman of Janaka's race met a Bhrigu Rishi
    while hunting in an uninhabited forest and asked what brings the highest benefit
    here and hereafter. The Rishi teaches restraint, righteousness, proper gift-giving,
    purification from sin, cultivation of good thoughts, adherence to one's order,
    companionship with the righteous, and firmness. He cites Mahabhisha's fall from
    heaven and Yayati's regained felicity as examples. Vasuman then turns his mind
    away from desire and toward righteousness.
  language: English
  quote_policy: summarized
