canonical_text:
  quote: ''
  summary: After the danger has passed, the mouse Palita remains in his hole while
    the cat Lomasa, from the tree, urges continued friendship and promises gratitude,
    honor, and safety. Palita replies with an extended discourse on examining friends
    and foes, the instability of friendship and enmity, the power of self-interest,
    and the danger of excessive trust, concluding that their temporary affection arose
    from a cause that no longer exists and that the cat may still seek to make him
    prey.
