canonical_text:
  quote: ''
  summary: Janaka questions a holy woman about her identity and purpose, states that
    he learned teachings on Emancipation from Panchasikha, and argues that knowledge,
    renunciation, self-knowledge, and inward detachment can coexist with kingship.
    He uses seed imagery for rebirth and desirelessness, describes equanimity toward
    opposites, and questions whether outward ascetic signs alone determine liberation.
  language: English
