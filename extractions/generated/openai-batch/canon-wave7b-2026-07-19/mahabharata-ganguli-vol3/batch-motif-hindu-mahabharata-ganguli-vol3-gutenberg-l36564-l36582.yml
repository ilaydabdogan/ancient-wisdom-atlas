canonical_text:
  quote: ''
  summary: Dhritarashtra reports that Prahlada taught Indra about the means for acquiring
    praiseworthy behaviour. He defines such behaviour as non-injury in act, thought,
    and word toward all creatures, together with compassion and gift. He warns against
    shameful or non-beneficial acts, says wicked prosperity is short-lived, urges
    his son to practice good behaviour for prosperity, and Bhishma then applies the
    instruction to the son of Kunti.
