canonical_text:
  quote: Upon chastisement depend all creatures.
  summary: A didactic speech argues that chastisement sustains social order, ritual,
    property, duty, and wealth. The addressed king is urged to abandon grief, rule,
    protect subjects, perform sacrifices, give alms, and fight armed foes without
    cheerlessness or sin. The passage concludes with a doctrine that the inner soul
    cannot be slain and that creatures pass into successive bodies as a person enters
    a new house.
  language: English
  quote_policy: quoted
