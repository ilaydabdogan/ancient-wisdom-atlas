  quote: ''
  summary: Vaisampayana narrates that Nakula, after hearing Arjuna, addresses the
    king with reason. Nakula argues that gods and Pitris are engaged in action, that
    those rejecting Vedic declarations are atheists, and that one learned in the Vedas
    who follows them attains the highest heaven by the way of the deities.
