canonical_text:
  quote: ''
  summary: 'Karna rebukes Shalya for hostile words, defines the qualities of friend
    and foe, and vows to fight Partha/Arjuna and Vasudeva. He boasts of celestial
    weapons, including the brahmastra, but recalls a Brahmana''s curse incurred when
    he accidentally killed the calf of the Brahmana''s homa cow: in battle his chariot
    wheel will sink into the Earth and fear will enter his heart. Karna recounts failed
    attempts to compensate the Brahmana with cattle, bulls, elephants, slaves, a mansion,
    and other wealth. The Brahmana refuses to revoke the utterance, saying it must
    come true and that accepting the words is Karna''s atonement. Sanjaya then narrates
    Karna again answering Shalya, declaring he cannot be frightened by words and sparing
    Shalya because of friendship, alliance, and a prior compact to pardon disagreeable
    speech.'
  language: English
  quote_policy: summarized
