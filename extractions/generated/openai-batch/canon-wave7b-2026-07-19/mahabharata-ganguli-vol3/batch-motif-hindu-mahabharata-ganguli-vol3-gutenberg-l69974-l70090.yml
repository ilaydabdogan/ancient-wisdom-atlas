  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The note says that living in the woods with deer and after the manner of deer
    confers great merit, and it cross-references the story of Yayati’s daughter Madhavi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The note explains that Death would attain the status of all-pervading Brahma;
