canonical_text:
  quote: ''
  summary: Sthanu intercedes for created beings as a fire born from Brahman's energy
    consumes them. Brahman explains that Earth, burdened by creatures and sinking
    into water, asked for their destruction, and his wrath arose when he could not
    find another means. Sthanu asks that the fire be neutralized and that beings return
    through repeated deaths. Brahman suppresses the fire, arranges birth and death,
    and a female Death emerges from his body; she is commanded to slay creatures but
    responds with sorrow and tears.
  language: English
  quote_policy: summarized
