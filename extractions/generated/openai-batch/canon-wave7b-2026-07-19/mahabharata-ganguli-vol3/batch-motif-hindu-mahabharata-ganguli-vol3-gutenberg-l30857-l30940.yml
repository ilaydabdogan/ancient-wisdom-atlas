canonical_text:
  quote: ''
  summary: Vrihaspati teaches that duties and social order are rooted in the king's
    protection. He describes the absence of royal protection as producing violence,
    theft, collapse of property, family obligations, ritual, learning, agriculture,
    trade, caste boundaries, and social safety. He then describes protected subjects
    as sleeping and moving fearlessly, performing sacrifices and study, and living
    happily under the king. The king is finally described as a high divinity in human
    form who assumes five forms, including Agni and Aditya, when punishing offenders
    and observing the realm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vrihaspati says that the duties of all men have their root in the king, and
    that fear of the king prevents people from devouring one another.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king is said to bring peace on earth by checking disregard for wholesome
    restraints and lust.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Vrihaspati compares kingless men to creatures in darkness without the sun
    and moon, to fish and birds attacking one another, and to cattle without a herdsman.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Without the king's protection, the strong would seize the possessions of the
    weak, kill resisters, and undermine the claim that anything is one's own.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Without royal protection, wicked men would seize goods, weapons would fall
    upon the righteous, and people would disregard or injure aged parents, preceptors,
    guests, and seniors.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Without the king, robbers would overrun the country; restrictions concerning
    marriage and intercourse would cease; agriculture, trade, morality, Vedic continuity,
    sacrifice, marriage, society, cattle-rearing, and milk-churning would fail.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the absence of royal protection, Brahmanas would not study the Vedas or
    perform austerities, a person guilty of Brahmanicide would enjoy immunity, people
    would flee in fear, injustice and caste intermixture would arise, and famine would
    ravage the kingdom.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Under royal protection, people sleep fearlessly without bolting doors; ornamented
    women wander without male relatives; people become righteous and serve one another
    without injury.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Royal protection enables the three orders to perform sacrifices and pursue
    learning; agriculture, trade, and the Vedas are described as protected by the
    king.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The king is said to bear a heavy load with mighty force so that subjects live
    happily, and the people's existence and destruction are tied to his existence
    and destruction.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: One who benefits the king and bears part of kingly duties conquers this world
    and the other world; one who thinks of injuring the king meets grief and hell.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: 'The king is described as a high divinity in human form who assumes five forms:
    Agni, Aditya, Mrityu, Vaisravana, and Yama.'
  category: attribute
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: When the king burns sinful offenders with fierce energy, he is said to assume
    Agni's form; when he observes people's acts through spies and acts for the general
    good, he is said to assume Aditya's form.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
