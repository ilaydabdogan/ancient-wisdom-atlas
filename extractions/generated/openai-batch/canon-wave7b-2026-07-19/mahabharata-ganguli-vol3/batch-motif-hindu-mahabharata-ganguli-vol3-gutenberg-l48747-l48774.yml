  summary: The passage describes yogic equanimity toward gain, loss, praise, blame,
    wealth, and social distinction. A yogin who practices purity and equality may
    vividly perceive Brahma as sound, behold eternal Brahma within the self, attain
    emancipation, and gain equality with Brahman until universal dissolution.
