canonical_text:
  quote: From the seed that fell, was born a son unto him, called Suka.
  summary: Bhishma narrates the birth of Suka. While Vyasa rubs sticks to make fire,
    he sees the Apsara Ghritachi, who takes the form of a she-parrot. Vyasa’s seed
    falls, and Suka is born in connection with the fire-sticks, shining with effulgence.
    Ganga bathes him, celestial beings celebrate, Mahadeva invests him with the sacred
    thread, Sakra gives him a kamandalu and robes, and the Vedas dwell in him from
    birth. Suka later studies under Vrihaspati and practices severe ascetic discipline
    oriented toward Emancipation.
  language: English
  quote_policy: quoted
