canonical_text:
  quote: succeed in overcoming all difficulties
  summary: Yudhishthira asks how creatures can overcome continual afflictions. Bhishma
    answers by listing ethical, social, ritual, royal, martial, ascetic, devotional,
    and recitational practices that enable people to overcome difficulties, culminating
    in the identification of Krishna as Narayana, Hari, and Govinda, a supreme refuge
    and cosmic lord.
  language: English
  quote_policy: quoted
