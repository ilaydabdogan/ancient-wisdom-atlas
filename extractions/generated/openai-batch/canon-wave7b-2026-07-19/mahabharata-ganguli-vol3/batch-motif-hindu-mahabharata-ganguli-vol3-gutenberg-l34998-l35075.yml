- id: obs:3
  text: Bhishma lists not practicing deceit, restraining behavior, controlling worldly
    desires, not retaliating against evil language or injury, giving, sheltering guests,
    avoiding malice, and studying the Vedas as ways to overcome difficulties.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bhishma lists proper conduct toward parents, abstaining from day-sleep, avoiding
    sin in thought, word, and deed, never injuring creatures, and righteous royal
    conduct as ways to overcome difficulties.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bhishma lists marital restraint, honesty, attention to Agni-hotras, courage
