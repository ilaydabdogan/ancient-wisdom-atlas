candidate_motifs:
- id: motif:1
  label: Preservation of wisdom through abridgment in an age of decline
  taxonomy_refs:
  - wisdom
  basis: The passage explains that divine and sage figures shortened the science because
    human life spans and general conditions had declined.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not present a quest for wisdom; it presents transmission
    and condensation of an existing science.
- id: motif:2
  label: Divine origin of a royal line
  taxonomy_refs:
  - divine_parent_child
  - sacred_birth
  - royal_legitimacy
  basis: Narayana creates Virajas from his energy after the gods request a superior
    mortal, and Prithu is later declared eighth from Vishnu.
  evidence_refs:
  - ev:2
  - ev:8
  confidence: high
  cautions: The genealogy includes renouncing ancestors before the eventual royal
    figure Prithu.
- id: motif:3
  label: Ritual destruction of an unrighteous ruler
  taxonomy_refs:
  - divine_judgment
  basis: Vena's unrighteous conduct leads the Rishis to slay him with Kusa blades
    empowered by mantras.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The action is performed by Rishis rather than directly by a named deity,
    so the taxonomy fit to divine judgment is interpretive.
- id: motif:4
  label: Emergence of peoples or ruler from a slain king's body
  taxonomy_refs:
  - sacred_birth
  - death_rebirth
  basis: A figure linked to Nishadas emerges from Vena's thigh, and Prithu emerges
    from Vena's arm after the Rishis pierce the body.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage says the figures 'came out' or 'sprang' from the body; it
    does not frame the event as ordinary birth.
- id: motif:5
  label: Legitimation of kingship through oath, divine instruction, and priestly sanction
  taxonomy_refs:
  - royal_legitimacy
  basis: Prithu is instructed by gods and Rishis, pledges to uphold Vedic order and
    honor Brahmanas, and receives priestly and courtly offices.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage emphasizes duties of chastisement and social order rather
    than military conquest.
- id: motif:6
  label: Culture king reshapes the earth
  taxonomy_refs:
  - culture_hero
  basis: Prithu levels the previously uneven terrestrial surface and removes rocks
    with the horn of his bow.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The act is geographic and royal; the passage does not describe agriculture
    or other cultural inventions in this excerpt.
- id: motif:7
  label: Cosmic tribute at royal coronation
  taxonomy_refs:
  - royal_legitimacy
  - sacred_exchange
  basis: At Prithu's crowning, embodied Earth, Ocean, Himavat, Sakra, Meru, and Kuvera
    give gems, gold, and wealth.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The exchange is tribute or bestowal; the passage does not state a reciprocal
    bargain in this excerpt.
- id: motif:8
  label: Origin of marginal or forest-mountain peoples from a bodily emergence
  taxonomy_refs: []
  basis: Nishadas and Mlecchas dwelling in hills, forests, and Vindhya are said to
    spring from the person emerging from Vena's thigh.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No external ethnographic or historical claim is inferred from the passage.
