canonical_text:
  quote: ''
  summary: The passage recounts the progressive abridgment of a science by divine
    and sage figures, the divine creation of Virajas by Vishnu/Narayana, the genealogy
    leading to the unrighteous Vena, the ritual slaying of Vena by Rishis, the emergence
    of peoples from Vena's thigh and Prithu from his arm, Prithu's instruction in
    kingship and chastisement, his royal attendants, his leveling of the earth, and
    his coronation with tribute from Earth and cosmic donors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A science or treatise is repeatedly abridged by Indra, Vrihaspati, Kavi, and
    great Rishis because of shorter human life spans and general decline.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gods ask Vishnu to indicate a mortal deserving superiority, and Narayana
    creates Virajas by will from his own energy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Virajas does not desire sovereignty; Krittimat renounces pleasure; Kardama
    practices austerities; Ananga becomes a protector; Ativala obtains empire and
    becomes ruled by his passions; Sunita, daughter of Mrityu, bears Vena.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Vena is described as unrighteous, wrathful, and malicious, and the Rishis
    slay him using Kusa blades inspired with mantras.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Rishis pierce Vena's right thigh, and a short-limbed, dark, red-eyed person
    emerges; Nishadas and other peoples dwelling in hills, forests, and the Vindhya
    mountains are said to spring from him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Rishis pierce Vena's right arm, and a person resembling a second Indra
    emerges, armed and acquainted with weapons, the Vedas, and the science of chastisement.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Vena's son asks the assembled Rishis and gods what righteous task he should
    perform with his keen understanding.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The gods and Rishis command Vena's son to act according to righteousness,
    treat creatures equally, cast away passions, punish those deviating from duty,
    maintain Vedic religion, exempt Brahmanas from chastisement, and protect caste
    order.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Vena's son pledges worship of Brahmanas, after which Sukra becomes his priest,
    the Valakhilyas his counsellors, the Saraswatas his companions, Garga his astrologer,
    and Suta and Magadha his bards.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: Prithu is declared to be eighth from Vishnu, and he grants land to Suta and
    Magadha.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Prithu levels the previously uneven earth by removing rocks and rocky masses
    with the horn of his bow, causing hills and mountains to become enlarged.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Vishnu, deities, Rishis, Regents, and Brahmanas assemble to crown Prithu;
    embodied Earth, Ocean, Himavat, Sakra, Meru, and Kuvera bring gems, gold, or wealth.
  category: action
  evidence_refs:
  - ev:10
