canonical_text:
  quote: ''
  summary: Sanjaya narrates a battlefield sequence in which Karna, Bhimasena, Partha,
    Duryodhana, Nakula, Sahadeva, and Dhrishtadyumna engage in intense archery combat.
    Duryodhana first wounds Nakula and Sahadeva and obscures them with arrows, then
    Dhrishtadyumna intervenes, wounds and disarms Duryodhana, and Durdhara rescues
    Duryodhana by carrying him away on his chariot.
  language: English
