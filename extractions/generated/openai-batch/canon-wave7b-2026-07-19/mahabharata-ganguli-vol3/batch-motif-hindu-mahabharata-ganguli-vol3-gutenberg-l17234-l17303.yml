canonical_text:
  quote: ''
  summary: Vaishampayana recounts how a severed Rakshasa head became attached to the
    Brahmana Mahodara and was released only when Mahodara bathed at the Usanasa tirtha
    on the Sarasvati, after which the place was named Kapalamochana. The narration
    then follows Baladeva visiting sacred sites connected with Rushangu, Arshtishena,
    Vishvamitra, Sindhudwipa, and Devapi. Rushangu is described as an aged ascetic
    who chose to cast off his body at a Sarasvati tirtha and taught that dying on
    its northern bank while reciting sacred mantras frees one from death. Janamejaya
    then asks how several figures acquired Brahmana status.
  language: English
  quote_policy: summarized
