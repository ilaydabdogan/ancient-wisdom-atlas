canonical_text:
  quote: Protection of the subject, O Yudhishthira, is the very cheese of kingly duties.
  summary: Bhishma instructs Yudhishthira that protecting subjects is the chief duty
    of kings, lists practical means of governance and vigilance, cites earlier divine
    and sage authorities, and praises exertion. The assembled heroes praise Bhishma;
    Yudhishthira postpones further questioning because the sun is setting. The group
    salutes the Brahmanas, circumambulates Bhishma, bathes in the Drishadwati, offers
    water to ancestors, performs evening rites, and enters the city.
  language: English
  quote_policy: quoted
