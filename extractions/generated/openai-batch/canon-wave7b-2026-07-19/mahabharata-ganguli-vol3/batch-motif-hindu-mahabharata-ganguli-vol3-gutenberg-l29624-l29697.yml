- id: obs:2
  text: Bhishma lists means of protection, including the use of spies and servants,
    fair payment, considerate tax collection, selection of honest officials, punishment
    and fines regulated by occasion, supervision, treasury management, and vigilance
    toward enemies and officers.
  category: speech
  evidence_refs:
