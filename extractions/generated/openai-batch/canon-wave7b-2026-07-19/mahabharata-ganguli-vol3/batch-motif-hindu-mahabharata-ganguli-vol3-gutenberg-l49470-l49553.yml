canonical_text:
  quote: The mind must make a lamp of the senses for dispelling the darkness that
    shuts out the knowledge of the Supreme Soul.
  summary: Vyasa gives a metaphysical exposition of mind, understanding, senses, Soul,
    and the three attributes. The passage describes the disciplining of senses, the
    revelation of the Soul through inner knowledge, nonattachment, and the distinction-yet-union
    of subtle principles using images such as a lamp, darkness, reins, water, a fish,
    a gnat in a fig, and a blade of grass in a clump.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Vyasa states that mind creates ideas, understanding settles distinctions,
    and the heart discriminates agreeable from disagreeable; these are described as
    forces impelling action.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage ranks objects of the senses above the senses, mind above objects,
    understanding above mind, and Soul above understanding.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Understanding is described as appearing under different guises as hearing,
    touch, vision, taste, and scent; its modifications are called the senses.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The invisible Soul is placed over the senses as their presiding chief or overseer.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Understanding is said to reside in the body in the three states of Sattwa,
    Rajas, and Tamas, with conditions of cheerfulness, grief, or neither.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The senses are to be subdued, and the mind is instructed to make a lamp of
    the senses to dispel darkness that obstructs knowledge of the Supreme Soul.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When a person holds the reins with the mind, the Soul is said to discover
