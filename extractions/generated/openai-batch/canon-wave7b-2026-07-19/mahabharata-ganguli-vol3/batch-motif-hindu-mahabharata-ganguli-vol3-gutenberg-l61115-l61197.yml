canonical_text:
  quote: '"Salutations to thee, O God of gods"'
  summary: Narada addresses a long hymn of salutation to the God of gods, describing
    the addressee through many divine, cosmic, ritual, scriptural, temporal, and elemental
    identifications. The deity is called Witness, Kshetrajna, Purusha, Narayana, origin
    and refuge of the universe, embodiment of sacrifice, dweller in beings, and source
    or form of cosmological images such as ocean-water, fire, and the lotus as the
    image of the cosmic egg.
  language: English
  quote_policy: quoted
