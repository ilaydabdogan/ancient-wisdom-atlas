  quote: ''
  summary: Yudhishthira asks Bhishma to distinguish Brahmanas who follow the duties
    of their order from those who engage in other duties. Bhishma classifies Brahmanas
    by learning, conduct, ritual practice, and occupations, and prescribes how a king
    should tax, discipline, support, or banish certain Brahmanas according to their
    conduct.
