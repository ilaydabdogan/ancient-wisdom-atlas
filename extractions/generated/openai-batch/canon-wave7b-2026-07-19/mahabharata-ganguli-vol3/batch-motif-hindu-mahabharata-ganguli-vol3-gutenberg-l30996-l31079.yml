  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king is told to employ tested, wise, hunger-and-thirst-enduring spies
    who appear like idiots or like the blind and deaf, and to keep spies from knowing
    one another.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king is told to set spies upon counsellors, friends, sons, provinces,
