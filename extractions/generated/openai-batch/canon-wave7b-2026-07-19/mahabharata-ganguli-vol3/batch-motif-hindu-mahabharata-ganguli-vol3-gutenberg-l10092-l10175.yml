canonical_text:
  quote: ''
  summary: Sanjaya recounts a battle sequence after Duhshasana's death. Ten sons of
    Dhritarashtra attack Bhima and are slain by Arjuna. Shalya urges Karna not to
    grieve and to face Arjuna, framing victory as fame and defeat as heaven. Vrishasena,
    Karna's son, attacks the Pandavas; Nakula engages him, loses his horses, fights
    on foot with sword and shield, kills many warriors, and is repeatedly pierced
    by Vrishasena while protected by Bhima.
  language: English
  quote_policy: summarized
