canonical_text:
  quote: ''
  summary: Dhritarashtra laments the deaths of leading Kuru warriors and asks Sanjaya
    who remains alive. Sanjaya lists surviving warriors and allies still ready for
    battle, including Drona's son, Kritavarma, Shalya, the Gandhara king, Gautama,
    Purumitra, Duryodhana, and other princes and sons of Karna. Dhritarashtra infers
    the likely outcome from the report and collapses in grief. The frame narrative
    then has Janamejaya ask what the king said after being comforted.
  language: English
  quote_policy: summarized
