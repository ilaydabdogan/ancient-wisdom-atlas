  summary: Vaishampayana enumerates many divine Mothers who become companions and
    followers of Kumara/Kartikeya. They are described as numerous, cosmically pervasive,
    varied in form, ornamented, powerful, boon-granting, able to assume forms at will,
    related to the natures of major deities, fearsome in battle, and dwelling in trees,
    crossroads, caves, crematoriums, mountains, and springs.
