canonical_text:
  quote: ''
  summary: 'Yudhishthira asks Bhishma what kind of intelligence enables a monarch
    stripped of prosperity to continue living. Bhishma cites an old dialogue: after
    subduing the Asuras, Vasava asks the Grandsire where Vali is. The Creator says
    Vali may have been born among animals and instructs Sakra not to injure him but
    to seek moral instruction. Indra finds Vali in the form of an ass in an empty
    apartment, taunts him about his fall from former power and wealth, and Vali replies
    that his lost possessions are hidden in a cave until his time comes again, while
    the wise neither grieve in misery nor rejoice in happiness.'
  language: English
  quote_policy: summarized
