canonical_text:
  quote: ''
  summary: Vaishampayana narrates Sanjaya consoling and admonishing the grieving Dhritarashtra.
    Sanjaya says Dhritarashtra ignored wise counsel, indulged Duryodhana, and now
    suffers the consequences. He argues that grief is harmful and uses images of honey,
    falling, burning coal, battle-fire, insects in flame, and tears like sparks. The
    passage then transitions to Vidura's further counsel, introduced as nectar-like
    speech.
  language: English
