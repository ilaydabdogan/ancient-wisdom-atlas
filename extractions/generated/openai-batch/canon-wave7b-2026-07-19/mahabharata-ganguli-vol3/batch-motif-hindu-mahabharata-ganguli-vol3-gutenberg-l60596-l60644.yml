    is said to have followed from Him and to dwell in all manifest forms.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker says the all-pervading Soul is worshipped in rites performed for
    deities and Pitris, that no higher deity or Pitri exists, and that the course
