canonical_text:
  quote: ''
  summary: A holy speaker tells Narada that he will disclose an ancient mystery because
    of Narada's devotion. He describes Kshetrajna or Purusha as the indwelling Soul
    beyond the senses, elements, and three attributes. From Him follows unmanifest
    Prakriti, and He is the higher object of rites to deities and Pitris. Twenty-one
    Prajapatis are said to have been first born and to have obeyed the Supreme God's
    law. Heavenly beings bow to the Supreme deity, while emancipated persons cast
    off bodily constituents and acts, attain Kshetrajna, and devoted persons enter
    and merge in His Self.
  language: English
  quote_policy: summarized
