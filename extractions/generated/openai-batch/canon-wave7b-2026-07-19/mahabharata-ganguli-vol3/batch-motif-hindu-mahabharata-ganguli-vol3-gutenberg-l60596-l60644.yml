- id: obs:2
  text: Kshetrajna is described as the indwelling Soul of all existent creatures,
    minute, inconceivable, unmanifest, immobile, durable, beyond sensory connection,
    dissociated from the five elements, and regarded as Purusha beyond Sattwa, Rajas,
    and Tamas.
  category: attribute
  evidence_refs:
