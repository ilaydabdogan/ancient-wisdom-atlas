canonical_text:
  quote: ''
  summary: Narada promises to give back Suvarnashthivin, a son associated with Srinjaya,
    saying the child had been given by Parvata, had been bereft of life, had the splendour
    of gold, and would have a thousand years. Yudhishthira then asks how the child
    became Suvarnashthivin, why Parvata gave him to Srinjaya, why he died in infancy
    despite the stated thousand-year human lifespan of that age, and whether the name
    was only nominal.
