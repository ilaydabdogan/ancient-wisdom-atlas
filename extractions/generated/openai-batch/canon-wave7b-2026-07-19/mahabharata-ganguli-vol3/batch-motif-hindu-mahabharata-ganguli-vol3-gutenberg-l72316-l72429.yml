canonical_text:
  quote: ''
  summary: Translator and commentator notes explain grammar and doctrine concerning
    destiny and exertion, sacrifices and penances, rebirth across social or supernatural
    statuses, Yoga and Emancipation, death in sacred places, accidental ignominious
    death, Ignorance as a foe, sin exhausted through its fruits, and analogies for
    acquiring Sattwa through association.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The commentary distinguishes destiny or praravdha from Exertion or purushakara,
    stating that Exertion is efficacious for acquiring righteousness and conforming
    to scriptural duties.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sacrifices and other acts done from vanity are described as destructible in
    their consequences, while desireless penances are said to lead to Emancipation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Sudra who practices duties common to the four orders is said by learned
    Brahmanas to be reborn as a Brahmana, while Parasara is said to hold that such
    a Sudra is reborn as a Kshatriya.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: One who abandons attachments and devotes himself to Yoga is said to attain
    the felicity of Emancipation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A person who dies suddenly in a tirtha or sacred place is said not to become
    immediately emancipated but to obtain another body in the next life similar to
    the one lost.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A person dying in a sacred place is also described as being reborn as a Rudra
    or a Pisacha and quickly attaining Emancipation because of contiguity to Siva.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The compound of primal essences and other things is said to assume different
    shapes through desires from previous lives.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Apamrityu is explained as death by accidents involving ignominy, with examples
    including snake-bite, a fall, drowning, or the horns of an animal.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: Ignorance is referred to as a foe.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Sin is said to be destroyed only by endurance of its fruits.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Jiva is compared to a fabulous gem and is said to attract the status of Brahma
    through Yoga.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Sesame seeds repeatedly mixed with fragrant oil are used as an analogy for
    people acquiring Sattwa by associating with persons of cleansed souls.
  category: relationship
  evidence_refs:
  - ev:12
