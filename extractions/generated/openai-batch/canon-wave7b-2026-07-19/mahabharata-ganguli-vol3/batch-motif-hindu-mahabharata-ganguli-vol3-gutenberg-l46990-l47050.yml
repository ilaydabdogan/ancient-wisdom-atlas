canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma what is good for a person in dire distress after
    loss. Bhishma answers that fortitude is the highest good and introduces an old
    discourse between Vali and Vasava. After a battle between gods and Asuras, Vali
    becomes king but is deceived by Vishnu, and Indra's sovereignty is restored. Indra,
    riding Airavata with celestial retinues, finds Vali in a mountain cave by the
    sea. Vali remains unmoved despite the loss of sovereignty, wealth, wives, and
    freedom. Indra asks why he does not grieve, and Vali answers fearlessly.
  language: English
  quote_policy: summarized
