canonical_text:
  quote: ''
  summary: Jaigishavya passes through a series of celestial regions and reaches the
    eternal region of Brahman, while Asita Devala cannot follow him there. Devala
    returns to his asylum, receives instruction from Jaigishavya in Moksha and Yoga,
    hears laments from beings and plants about the consequences of his religious choice,
    and ultimately adopts Moksha. The passage then identifies the place as the tirtha
    of Asita and Jaigishavya, describes Balarama bathing and giving gifts there, and
    transitions to the tirthas of Soma and Sarasvata.
  language: English
  quote_policy: summarized
