canonical_text:
  quote: ''
  summary: A sequence of editorial footnotes explains terms and readings in Mahabharata
    passages concerning White Island meditation, absence of images, Uparichara's ascent
    and identification with Brahma, Vasudhara ghee offerings, Vedic mantras, Narayana
    worship, yogic sacrifice as merger of the individual soul into the Supreme Soul,
    attributes of Narayana, and a Vaishnava emanational cosmogony from Vasudeva through
    Sankarshana, Pradyumna, and Aniruddha. One note reports a proposed comparison
    between this fourfold creation and the Christian Trinity while stressing uncertainty
    about derivation.
  language: English
  quote_policy: summarized
