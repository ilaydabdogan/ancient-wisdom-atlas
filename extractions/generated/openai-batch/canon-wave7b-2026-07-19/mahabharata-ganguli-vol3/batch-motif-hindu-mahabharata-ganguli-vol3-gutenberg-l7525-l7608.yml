canonical_text:
  quote: ''
  summary: Sanjaya reports to the king that Ashvatthama, Drona's son, advances against
    Arjuna, who is aided by Krishna. The warriors exchange arrows and celestial weapons;
    Ashvatthama wounds Krishna and Arjuna, while Arjuna repeatedly disables Ashvatthama's
    weapons, chariot, horses, and driver. The battle produces terrible carnage described
    as rivers of blood leading to the other world and to Yama's domains. After Arjuna
    cuts the traces of Ashvatthama's horses, the Pandavas press their victory and
    the Dhartarashtra host breaks and flees despite Karna's attempt to halt it.
  language: English
  quote_policy: summarized
