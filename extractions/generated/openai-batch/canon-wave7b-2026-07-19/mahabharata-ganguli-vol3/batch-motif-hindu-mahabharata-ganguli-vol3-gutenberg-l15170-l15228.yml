canonical_text:
  quote: ''
  summary: Arjuna recalls earlier warnings about Duryodhana, including Vidura's words,
    Jamadagni's son's rejected counsel, and a prophecy by ascetic sages that Duryodhana's
    birth would lead to the extermination of the Kshatriyas. Arjuna vows to slay Duryodhana
    and his army for Yudhishthira's good. Sanjaya narrates Krishna driving Arjuna
    into the hostile force, which is described as a forest of weapons and troops.
    Arjuna then covers the battlefield with arrows from Gandiva, burns and weakens
    the Kauravas in fire imagery, and destroys a division of warriors, being compared
    to Indra striking the Daityas.
  language: English
  quote_policy: summarized
