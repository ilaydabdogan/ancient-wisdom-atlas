canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma about the fruits, postmortem destination, and
    rules of silent mantra-recitation. Bhishma replies by framing silent recitation
    in relation to Sankhya/Vedanta, yoga, abstention, sacrifice, and meditation. He
    describes the Reciter’s discipline, including kusa grass, the Gayatri, concentrated
    contemplation, abandonment of attachment and desire, and final entry into the
    Brahmic body or upward passage to Brahma without rebirth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yudhishthira asks Bhishma to explain the fruits, postmortem region, rules,
    and doctrinal classification of silent mantra-recitation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma introduces an old history involving Yama, Time, and a certain Brahmana.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Bhishma says sages describe two methods for attaining Emancipation: Sankhya,
    also called Vedanta in this passage, and yoga.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The requirements named for silent recitation include subduing the senses,
    fixing the mind, truth, maintaining the sacred fire, solitude, meditation, penance,
    self-restraint, forgiveness, benevolence, limited food, withdrawal from attachments,
    little speech, and tranquillity.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: These practices are described as a sacrifice in acts leading toward heaven
    or next-life felicity.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Reciter observing Brahmacharya is directed to follow abstention and extinguish
    dependence on both the External and the Internal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Reciter sits on kusa grass, holds kusa, binds his locks with kusa, surrounds
    himself with kusa, and uses kusa as robes.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Reciter takes leave of earthly concerns, fixes the mind on the mind itself,
    recites the Gayatri, meditates on Brahma, and then leaves even that for concentrated
    contemplation.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Through penance the Reciter attains purity of soul, self-restraint, and cessation
    of aversion and desire.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Reciter is described as free from attachment and delusion, beyond pairs
    of opposites, not grieving, and not drawn toward worldly objects.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Reciter does not regard himself as actor, enjoyer, or sufferer; his work
    is meditation, which he later abandons.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: After mastering desire, the Reciter casts off life-breaths and either enters
    the Brahmic body or goes upward to the region of Brahma without rebirth, attaining
    the pure immortal Soul.
  category: sequence
  evidence_refs:
  - ev:10
