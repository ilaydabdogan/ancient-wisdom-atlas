canonical_text:
  quote: ''
  summary: Sanjaya narrates a massive battle in which armies, warriors, vehicles,
    horses, and elephants destroy one another. The Parthas advance under Vrikodara/Bhima
    with allied forces. Bhima rides a richly equipped elephant and is challenged by
    Kshemadhurti, also mounted on an elephant. The two heroes fight with lances, bows,
    arrows, and darts; Kshemadhurti wounds Bhima, while Bhima wounds the opponent's
    elephant, causing it to flee and be pursued.
  language: English
  quote_policy: summarized
