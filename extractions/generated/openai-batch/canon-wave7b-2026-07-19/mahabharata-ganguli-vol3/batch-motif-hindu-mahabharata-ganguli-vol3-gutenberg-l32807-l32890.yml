  quote: '"A king who is possessed of sound intelligence should milk his kingdom after
    the analogy of (men acting in the matter of) calves."'
  summary: 'Bhishma instructs Yudhishthira on royal administration: a hierarchy of
    village and regional officers, surveillance and reporting, protection from criminals,
    taxation based on productive capacity, moderation in revenue extraction, compassion
    toward poor subjects, and a proposed public warning about danger from enemies
    and robbers.'
