- id: obs:1
  text: A note defines Padma as ornaments of corpses, mentions grave-stealers, and
    says idiots and mad persons were regarded as possessed by evil spirits.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A commentator explains that a prince speaks of exterminating rogues by slaying
    them as animals in a sacrifice because those killed in sacrifices are said to
    ascend to heaven purged of sins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The notes state that proper conduct by the king improves conduct and morality,
    and that punishment should take account of decreasing human life-span and strength
    in successive ages.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A note glosses satya as Emancipation, true knowledge as superior to heaven,
    and Manu's way as the religion of harmlessness.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The notes state that the Vedas authorize both acts and knowledge, and that
    Vedic injunctions are declared and compiled by inspired Rishis while every word
    of the Vedas is treated as God's own.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'The four modes of life are assigned different destinations: the Sannyasin
    attains Moksha, the forest recluse the region of Brahman, the house-holder heaven,
    and the Brahmacharin the region of the Rishis.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A note justifies slaughter by the necessity of food, stating that living creatures
    must eat in order to live and that the support of life requires slaughter of life.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ritual sacrifice is described as having requisites, including classes of domestic
