canonical_text:
  quote: '"In Him rests this wondrous universe in its entirety."'
  summary: Bhishma describes the Highest Deity or Supreme Soul at the Root, Kesava's
    creative and pervading relation to the worlds, and the deity lying in waters as
    the potential seed during universal destruction. Yudhishthira asks about Vritra's
    foreseen end, rebirth, hues, and the Pandavas' own destiny. Bhishma reassures
    him that the Pandavas will enjoy divine regions, return to human birth, and finally
    be numbered among the Siddhas.
  language: English
  quote_policy: quoted
