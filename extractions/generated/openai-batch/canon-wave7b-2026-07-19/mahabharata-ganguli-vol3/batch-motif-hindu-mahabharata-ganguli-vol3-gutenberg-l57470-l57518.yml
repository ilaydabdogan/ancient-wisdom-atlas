canonical_text:
  quote: ''
  summary: Yajnavalkya explains a cosmology of vast cosmic days and nights. The Unmanifest
    awakens after night and creates plants, then Brahman from a golden egg. Brahman
    remains in the egg for a year, emerges, creates Earth and Heaven, and separates
    them with sky. Further creation proceeds through Mahan, Consciousness, sons, Pitris,
    great elements, senses, and subtle qualities. The passage ends by teaching that
    the mind, not the senses alone, perceives and governs sensory activity.
  language: English
  quote_policy: summarized
