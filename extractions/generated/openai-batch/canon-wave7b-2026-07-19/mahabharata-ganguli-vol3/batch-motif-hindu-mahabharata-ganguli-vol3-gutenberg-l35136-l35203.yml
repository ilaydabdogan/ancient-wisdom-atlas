canonical_text:
  quote: ''
  summary: A jackal advises the king of beasts on the need for wise and loyal ministers,
    explains the dangers of royal service and the freedom of forest life, and sets
    conditions for accepting office. The king agrees and honors him. The old servants,
    resentful and unable to continue appropriating others' property under the jackal's
    rule, try to tempt him and then conspire to destroy him by hiding stolen meat
    intended for the king in the jackal's house.
  language: English
  quote_policy: summarized
