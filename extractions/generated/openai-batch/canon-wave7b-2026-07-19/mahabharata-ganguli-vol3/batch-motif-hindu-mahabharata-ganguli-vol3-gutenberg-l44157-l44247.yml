canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma what end was attained by a Brahmana and a monarch.
    Bhishma recounts that the Brahmana and king agree to equalize the rewards of recitation,
    are witnessed by assembled gods and cosmic beings, perform yogic withdrawal of
    the vital breaths, and enter Brahman/Creator. Brahman then states that reciters,
    readers of sacred texts, and yogins attain his region.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yudhishthira asks Bhishma what reply and what final end were obtained by the
    Brahmana and the monarch after Virupa's speech.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Brahmana worships Dharma, Yama, Time, Mrityu, Heaven, and the assembled
    Brahmanas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Brahmana tells the monarch to attain eminence with the reward of his recitations
    and says Savitri had given him a boon of continuous devotion to recitations.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king proposes sharing the reward half and half; the Brahmana agrees that
    they should be equal in their next-life rewards and go to receive their end.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A large divine and cosmic assembly arrives, with music in the firmament, flowers
    raining down, and Apsaras dancing.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Heaven appears in embodied form and tells both the Brahmana and the king that
    they have attained success.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Brahmana and the king withdraw their senses, fix the five vital breaths
    in the body, direct the gaze, and concentrate the mind.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A fiery flame of great splendour pierces the Brahmana's crown, ascends to
    heaven, and enters Brahman's self.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Brahman welcomes the splendour, says reciters attain the same end as yogins,
    and tells it to dwell in him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Brahmana enters the mouth of the Creator; the monarch Ikshvaku enters
    the divine Grandsire in the same manner.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The assembled deities state that both persons have been given equal honour
    and an equal end, and that they can transcend all regions.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Brahman says readers of the Veda and other auspicious Smritis, and those devoted
    to yoga, attain his region after death.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Brahman disappears; the deities return to their abodes; Bhishma states that
    these are the rewards and end of reciters.
  category: sequence
  evidence_refs:
  - ev:9
