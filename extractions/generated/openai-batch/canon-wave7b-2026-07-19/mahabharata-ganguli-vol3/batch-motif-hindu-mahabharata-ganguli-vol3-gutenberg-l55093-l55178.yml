canonical_text:
  quote: ''
  summary: Parasara instructs a king on lawful livelihood, righteous acquisition of
    wealth, and duties by social order. He recounts an earlier age when people were
    restrained and righteousness prevailed, followed by corruption when Asuras in
    the forms of Lust and Wrath entered human bodies, producing pride, arrogance,
    wrath, heedlessness, oppression, irreverence, and sensual indulgence. The gods
    sought Siva, gave him their combined energy, and Siva destroyed the Asuras Desire,
    Wrath, and Cupidity, and Mahadeva slew their chief with a lance. Human beings
    then regained proper natures and returned to scripture. Seven ancient Rishis installed
    Vasava as ruler of heaven and took up chastisement, while Kshatriya kings ruled
    human groups. Parasara concludes by advising abstention from injury and malice,
    pursuit of knowledge of the Soul, righteous wealth, restraint, and care for subjects
    and dependents.
  language: English
  quote_policy: summarized
