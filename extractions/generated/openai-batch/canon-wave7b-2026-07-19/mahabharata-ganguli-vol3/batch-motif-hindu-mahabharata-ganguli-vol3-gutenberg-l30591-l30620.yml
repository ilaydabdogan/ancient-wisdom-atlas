canonical_text:
  quote: '"The very gods do not disregard a virtuous king who is truly an eternal
    god."'
  summary: Indra states that when kingly duties and the science of chastisement disappear,
    creatures suffer under tyrannical kings and people deviate from religious paths.
    He says that restraint by high-souled persons through chastisement establishes
    eternal religion, that offerings by one who disregards the king become fruitless,
    and that the creator intended the Kshatriya to rule men in matters of duty. Bhishma
    then says Narayana, in the form of Indra and accompanied by the Maruts, returned
    to his eternal abode, and he exhorts his listener to follow the ancient circle
    of duties.
  language: English
  quote_policy: quoted
