canonical_text:
  quote: ''
  summary: Bhima lifts his renowned jewel-studded eight-sided mace, associated with
    earlier feats at Kailasa and Gandhamadana, and rushes against Shalya. He crushes
    Shalya's four horses. Shalya throws a lance that enters Bhima's body; Bhima pulls
    it out and uses it to pierce Shalya's driver, who dies. Shalya descends from his
    car, is amazed, takes up his mace, and faces Bhima while the Parthas honor Bhima's
    deed.
