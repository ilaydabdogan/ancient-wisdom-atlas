canonical_text:
  quote: ''
  summary: 'Suka asks Vyasa to clarify creation, righteous conduct, and the apparent
    tension between Vedic injunctions to act and to refrain from action, with the
    aim of purification and beholding the indestructible Soul after casting off the
    body. Vyasa answers by describing an ancient course of conduct established by
    Brahma and practiced by ancient Rishis: Brahmacharya, forest austerities, subsistence
    on fruits and roots, sacred travel, universal benevolence, mendicancy, and solitary
    restraint. Suka then renews the question of how conflicting Vedic declarations
    can both be authoritative and how emancipation can be attained without violating
    obligatory acts. Bhishma frames the exchange and reports that Vyasa applauded
    Suka''s words before replying.'
  language: English
  quote_policy: summarized
