canonical_text:
  quote: ''
  summary: A royal instructor advises the king on how to treat Brahmanas, punish wrongdoing,
    maintain authority without excessive mildness or fierceness, care for subjects
    as a mother cares for a child, and avoid overfamiliarity with servants. The counsel
    cites verses attributed to Manu, Usanas, and Vrihaspati and uses analogies involving
    fire and water, iron and stone, an elephant and its driver, the vernal sun, a
    citadel of subjects, and maternal care.
  language: English
  quote_policy: summarized
