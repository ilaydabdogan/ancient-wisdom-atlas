- id: obs:1
  text: Acts are called seeds; seeds produce a tree, and acts lead to the attainment
    of bodies.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note distinguishes views in which Yogins affirm both the Jivatman and
    the Supreme Soul, Sankhyas regard them as one, and another group regards everything
    as Soul.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The acting Soul is described as ensconced in the Linga-sarira and as becoming
    a human being, a deity, or an animal.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pragvansa is identified as a certain part of the altar.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Yudhishthira's question concerns which mode of life is foremost, after renunciation
    has been described as best but difficult to practice.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Family customs are said to retain binding force even when inconsistent with
    scriptures; examples include Salya's taking money when giving Madri to Pandu and
    animal sacrifice in some Vaishnava families.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Vedas are described as heard, or Srutis, rather than written ordinances
