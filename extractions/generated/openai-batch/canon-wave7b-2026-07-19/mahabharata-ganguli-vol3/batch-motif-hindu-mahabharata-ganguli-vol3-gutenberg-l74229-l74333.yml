    the Jiva-soul with the Supreme Soul.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Rows of Yama's standards and flags are explained as diverse diseases that
    afflict creatures.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: An atithi or guest is a person who enters a householder's abode without invitation;
    all deities are said to reside in his person.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The guest gives the householder an opportunity to perform rites of hospitality,
    and the guest may become hungry before the food is served.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Frugality of fare and observance of vows are said to imply restraint of the
    senses.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: Nagas or snakes are said to have no ears and to use their eyes for both seeing
