canonical_text:
  quote: ''
  summary: 'Translator''s notes explain several doctrinal and ritual points: acts
    are compared to seeds that produce embodied existence; the Jiva-soul, Supreme
    Soul, Linga-sarira, and union with the Supreme Soul are glossed; religious modes
    of life, family custom, sacrifice, and the Vedas as heard tradition are discussed;
    Yama''s standards are explained as diseases; the guest is described as sacred;
    Nagas/snakes and the Chataka bird are described with distinctive traits.'
  language: English
  quote_policy: summarized
