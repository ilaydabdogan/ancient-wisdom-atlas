canonical_text:
  quote: ''
  summary: Arjuna invokes and deploys the brahmastra in battle against Karna, but
    Karna baffles the weapon. Urged by Bhima, Arjuna uses another powerful weapon,
    filling the directions with arrows and other missiles, killing many Kaurava warriors.
    Karna answers with torrents of arrows, wounds Arjuna, Krishna, Bhima, and others,
    and the two champions continue a destructive duel. Yudhishthira, recently healed
    with mantras and drugs, arrives to witness the encounter, while celestial and
    terrestrial spectators watch motionless. When Arjuna's bowstring breaks, Karna
    uses the opening to pierce Arjuna, Krishna, Bhima, and the forces following Arjuna.
  language: English
  quote_policy: summarized
