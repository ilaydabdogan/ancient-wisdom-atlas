canonical_text:
  quote: ''
  summary: Gandhari speaks to Krishna while viewing the battlefield. She points to
    the slain Abhimanyu and describes Uttara lamenting over his body, touching him,
    removing his armor, and addressing him as if alive. Uttara accuses named warriors
    of surrounding and killing the young hero and imagines his presence in blessed
    afterlife regions with the pitris, heaven, and Apsaras. Matsya royal women drag
    Uttara away and mourn the slain Virata, whose blood-covered body lies among vultures,
    jackals, and ravens. Other slain youths are named as lying on the battlefield.
  language: English
  quote_policy: summarized
