canonical_text:
  quote: ''
  summary: An unnamed former lord of the Danavas addresses Sakra/Indra and argues
    that affluence, loss, power, and downfall arise through ordination and Time rather
    than personal agency. He recalls his former cosmic sovereignty, identifies Time/Eternity
    with Brahma, describes Brahma through temporal units and inaccessible metaphysical
    attributes, and warns Sakra that many Indras have passed away and that unstable
    prosperity will also desert him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says contrasting human fortunes, including beauty with misery
    and ugliness with happiness, occur because they are ordained and not because of
    the persons' own acts.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker addresses Sakra as presently splendid, prosperous, beautiful,
    at the head of the deities, and armed with the thunderbolt.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says Time has assailed him, preventing him from exercising former
    prowess, and that the present time calls for peace and tranquillity.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Time is said to establish all things, work upon all things, and bring them
    to final consummation.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker says he was formerly the worshipped lord of the Danavas and the
    single master who bore water, showered rain, gave light and heat, protected, destroyed,
    gave, took, bound, and unbound.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker denies that he, Sakra, or anyone else is the true doer, and says
    Time protects or destroys all things.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Persons conversant with the Vedas are said to identify Time or Eternity with
    Brahma and to describe fortnights, months, days, nights, seasons, and the year
    as bodily features or clothing of that being.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Brahma is described as deep and inaccessible like a vast ocean of waters,
    without beginning or end, both indestructible and destructible, and able to enter
    existent objects and assume attributes.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Brahma in the form of Time is called the refuge of all creatures, cannot be
    transcended or avoided, and cannot be perceived by the five senses.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Different people call Brahma Fire, Prajapati, the seasons, the month, the
    fortnight, days, hours, morning, noon, evening, and the moment, while the speaker
    says he is single.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The speaker says many thousands of Indras have passed away and that Sakra
    too will pass away when Time extinguishes him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Regal prosperity is described as unstable, formerly possessed by the speaker,
