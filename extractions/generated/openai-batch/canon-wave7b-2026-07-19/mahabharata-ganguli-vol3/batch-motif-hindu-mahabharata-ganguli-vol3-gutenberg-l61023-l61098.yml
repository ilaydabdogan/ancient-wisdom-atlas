canonical_text:
  quote: ''
  summary: Bhishma narrates how king Vasu/Uparichara, after siding with the deities
    on animal sacrifice, is cursed by angry Rishis/Brahmanas to fall from heaven and
    sink below the earth. The deities mitigate the curse by granting him sacrificial
    clarified butter as sustenance in the pit. Vasu continues worshipping Hari/Narayana,
    who sends Garuda to lift him from the hole and restore him to celestial status.
    Bhishma then introduces a coming account of Narada’s journey to White Island.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vasu learns the deities’ opinion and says that sacrifices should be performed
    with animals, thereby taking the deities’ side.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Rishis become angry and curse Vasu to fall from heaven, lose the power
    of travelling through the sky, and sink below the surface of the earth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: King Uparichara immediately falls down and goes into a hole in the earth;
    by Narayana’s command, his memory does not leave him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The deities decide to aid Vasu because he was cursed for their sake, while
    also saying that the Brahmanas’ penances should be honoured.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The deities grant that Vasu, while dwelling in the hole, will be sustained
    by sacrificial streaks of clarified butter called Vasudhara and will not suffer
    hunger, thirst, weakness, or loss of energy.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Vasu dwells in the pit, silently recites sacred mantras, and worships Hari/Narayana
    through the five sacrifices performed five times daily.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Narayana/Vishnu becomes pleased with Vasu’s devotion and instructs Garuda
    to bring Uparichara up from the hole into the welkin.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Garuda enters the hole, takes up the king, soars into the sky, and releases
    him there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Uparichara regains his celestial form and re-enters the region of Brahman;
    Bhishma summarizes this as a fall through Brahmana curse and ascent through Vishnu’s
    command and Vasu’s devout worship.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Bhishma closes this account and announces that he will next narrate how the
    celestial Rishi Narada proceeded to White Island.
  category: speech
  evidence_refs:
  - ev:6
