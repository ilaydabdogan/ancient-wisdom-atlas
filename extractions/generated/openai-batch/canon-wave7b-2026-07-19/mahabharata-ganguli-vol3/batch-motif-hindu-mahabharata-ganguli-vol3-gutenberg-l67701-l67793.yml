canonical_text:
  quote: ''
  summary: The passage is a set of explanatory footnotes on cyclic creation, the Supreme
    Being or Creator, Brahma, Soul, body, mind, ignorance, desire, action, and repeated
    states of existence. It describes renewed creation at the beginning of a celestial
    yuga, regulating rules that prevent chaos, eventual withdrawal of everything into
    the Creator, and the Soul's relation to body, mind, Brahma, ignorance, and recurring
    embodiments driven by desire and action.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the beginning of every celestial yuga, the Supreme Being awakens from sleep,
    desires to create creatures anew, and beings start again into life.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rules regulating relations and acts arise with renewed beings; without those
    rules, the new creation would become chaos and end.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says man and woman do not eat each other but combine to perpetuate
    the species.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the end of the yuga, the Creator withdraws everything into himself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The river-water and sun-rays analogies are used to explain a necessary ordinary
    connection between Soul and body; yoga is said to dissociate the Soul from the
    body and incorporate it with Brahma.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mind is said to have no existence except as it exists in the Soul, with
    the image of a second moon seen in water used as an illustration.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the Soul takes a new form or body, propensities dependent on past acts
    and Avidya or Maya take possession of it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage mentions iron following a loadstone and discusses propensities
    from previous lives, Avidya or Maya, and higher aspirations that come from Brahma
    as Supreme Cause.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Before creation, the passage says there was nothing except jiva or the Soul
    with Knowledge as its indicating attribute; earth and other existent objects were
    not present.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Soul's apprehensions that it is a man, animal, body, or actor are attributed
    to Ignorance or Delusion, with dream images of being a king or child used as illustrations.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Desires lead the Soul to manifest in a form of existence, actions in that
    state lead to new desires, and those desires bring new forms or states of existence
    in a beginningless and endless circle.
  category: sequence
  evidence_refs:
  - ev:9
