canonical_text:
  quote: It is the goddess Prakriti who causes birth and death.
  summary: Vasishtha explains that through ignorance the Soul repeatedly identifies
    with bodies, attributes, pleasures, pains, diseases, social and ascetic practices,
    and realms such as heaven and hell. He compares this self-binding to a worm enclosing
    itself in its own cocoon. The passage also states that Prakriti causes birth and
    death, while at universal destruction the Supreme Soul withdraws all existents
    and attributes into itself and later sends them forth again at creation, compared
    to the Sun withdrawing and spreading its rays.
  language: English
  quote_policy: quoted
