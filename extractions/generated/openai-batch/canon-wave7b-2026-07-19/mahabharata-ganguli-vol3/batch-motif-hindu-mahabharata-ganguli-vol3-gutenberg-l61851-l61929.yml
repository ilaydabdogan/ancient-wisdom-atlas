canonical_text:
  quote: ''
  summary: The passage describes the decline of Righteousness through successive Yugas,
    the question of the deities and celestial Rishis about where to go in the diminished
    Kali age, and the instruction to seek places where Vedas, sacrifices, penances,
    truth, self-restraint, and compassion continue. After the assembly departs, Brahman
    beholds and worships a supreme deity manifested with an equine head, bowl, and
    triple stick. The deity entrusts Brahman with ordering created beings and promises
    to appear in incarnate forms when needed. The passage then praises the deity as
    Hari, upholder of sacrifices, ordainer of Nivritti and Pravritti, creator and
    dissolver of the universe, and one known by the eye of knowledge.
  language: English
  quote_policy: summarized
