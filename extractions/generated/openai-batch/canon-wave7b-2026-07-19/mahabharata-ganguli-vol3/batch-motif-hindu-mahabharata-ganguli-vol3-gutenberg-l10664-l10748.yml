canonical_text:
  quote: ''
  summary: Sanjaya describes a battlefield watched by gods and other beings in the
    sky. The Kaurava and Pandava armies resume slaughter, and the duel between Karna
    and Arjuna is framed through comparisons to divine-asura combat, the sun and moon,
    opposing winds, and destructive suns at the end of the age. Arjuna defeats groups
    of attackers and receives celestial praise and floral showers. Drona's son then
    urges Duryodhana to make peace with the Pandavas.
  language: English
  quote_policy: summarized
