canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma to explain the distinction between the Deteriorating
    and Undeteriorating states, including the condition from which there is no return.
    He praises Bhishma as a source of knowledge and asks before Bhishma's imminent
    death. Bhishma replies that he will recount an old discourse between Vasishtha
    and a king of Janaka's race, in which the king asked about Supreme and Eternal
    Brahma, the destructible, and the principle into which the universe enters when
    destroyed.
  language: English
  quote_policy: summarized
