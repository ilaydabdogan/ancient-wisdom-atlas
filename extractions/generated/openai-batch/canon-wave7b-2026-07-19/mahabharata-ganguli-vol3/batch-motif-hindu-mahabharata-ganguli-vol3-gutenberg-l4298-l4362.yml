canonical_text:
  quote: "“Thou art always a jackal, and Dhananjaya always a lion.”"
  summary: Karna declares that he seeks battle with Arjuna and cannot be deterred.
    Sanjaya reports that Shalya, ruler of the Madras, replies in order to provoke
    Karna, warning him through a series of similes that Arjuna is overwhelmingly superior.
    Shalya compares Karna’s challenge to weak animals or foolish persons confronting
    lions, elephants, tigers, a cobra, a mighty bird, an ocean, and other dangers.
    He also refers to Arjuna’s arrows, celestial bow, Gandiva, and chariot. After
    the rebuke, Sanjaya says Karna becomes enraged and prepares to answer.
  language: English
  quote_policy: quoted
