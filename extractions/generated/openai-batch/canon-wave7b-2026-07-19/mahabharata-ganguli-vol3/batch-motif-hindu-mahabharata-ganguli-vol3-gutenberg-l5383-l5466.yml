canonical_text:
  quote: ''
  summary: Sanjaya narrates Karna rushing against the Pancalas and Pandava-side forces.
    The armies' sounds are described as shaking the earth and heavens. Karna slays
    many warriors, is surrounded by opposing heroes, and is defended by his sons.
    Bhima kills Bhanusena and attacks Sushena, while Karna protects Sushena. Sushena
    fights Nakula and wounds Sahadeva, and Satyaki attacks Vrishasena as the passage
    breaks off.
