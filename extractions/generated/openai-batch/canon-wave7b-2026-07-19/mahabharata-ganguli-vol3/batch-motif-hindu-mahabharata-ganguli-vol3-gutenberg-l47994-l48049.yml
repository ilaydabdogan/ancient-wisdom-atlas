canonical_text:
  quote: Thus all existent creatures are withdrawn into Brahma.
  summary: 'Vyasa describes universal dissolution: the Supreme Lord withdraws the
    gross universe into subtle form; fire, water, wind, space, mind, Chandramas/Sankalpa,
    Time, Energy, Vidya, Iswara, and Brahma participate in a staged reabsorption.
    The passage concludes that Unmanifest Brahma repeatedly undergoes creation and
    destruction as Brahma''s Day and Night.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Vyasa announces that he will explain how, when the divine day ends and night
    comes, the Supreme Lord withdraws all things into himself and merges the gross
    universe into his Soul.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the time of universal dissolution, a dozen Suns and Agni with seven flames
    burn, and the whole universe blazes in a vast conflagration.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mobile and immobile things on earth disappear and merge into earth's substance;
    the earth is left without trees and herbs and is compared to a tortoise shell.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Water takes up the earth's attribute of scent, prevails, surges in mighty
    billows, roars, and fills space.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Heat takes the attribute of water; water rests in Heat; fire blazes all around,
    conceals the central Sun, and fills space with conflagration.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Wind takes the form of Heat or Light; Heat becomes extinguished; Wind becomes
    agitated and moves upward, downward, and transversely through all ten points.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Space takes the sound of Wind; Wind becomes extinguished; Space remains without
    form, taste, touch, scent, or shape, like unmanifest sound.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Sound, the attribute of Space, is swallowed by Mind; Mind withdraws the manifested
    into unmanifest or subtle Mind, which is called the destruction of the vast external
    universe.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Chandramas, also called Sankalpa, swallows Mind after Mind withdraws its attribute;
    Sankalpa is then brought under Iswara's sway and performs the destruction of Chitta
    or the faculties of judgment.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: After Chitta is destroyed, the condition is called high Knowledge; Time swallows
    this Knowledge, Time is swallowed by Might or Energy, Energy is swallowed by Time,
    and Time is brought under Vidya's sway.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Possessed of Vidya, Iswara swallows non-existence into his Soul; the passage
    identifies this as Unmanifest and Supreme Brahma, into whom all existent creatures
    are withdrawn.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Unmanifest Brahma repeatedly undergoes Elaboration and Withdrawal, described
    parenthetically as Creation and Destruction, and Brahma's Day and Night each consist
    of a thousand yugas.
  category: sequence
  evidence_refs:
  - ev:12
