canonical_text:
  quote: ''
  summary: 'After the goddess speaks, Narada and Indra welcome her. The wind becomes
    gentle and fragrant, the celestials assemble, and Indra arrives with Sree/Lakshmi
    on a splendid chariot. Narada proclaims the goddess’s advent auspicious. Heaven
    and earth show signs of prosperity: clear skies, nectar, unstruck drums, seasonal
    rain and crops, righteousness, gems, Vedic recitation, cheerfulness among beings,
    timely flowers and fruits, sweet milk, and gentle speech. Recitation of this narrative
    before Brahmanas is said to win prosperity.'
  language: English
  quote_policy: summarized
