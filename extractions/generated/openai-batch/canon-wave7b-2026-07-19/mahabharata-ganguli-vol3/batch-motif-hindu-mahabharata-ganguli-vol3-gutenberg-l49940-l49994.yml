canonical_text:
  quote: ''
  summary: Bhishma recounts teachings attributed to the Island-born Rishi concerning
    the enumeration of entities. He lists properties of earth, water, fire, wind,
    space, mind, and understanding, answers Yudhishthira’s question about those properties,
    and concludes that these entities are created by the imperishable source, are
    not eternal like the Soul, and that knowledge of Supreme Brahma should lead to
    tranquillity of heart.
