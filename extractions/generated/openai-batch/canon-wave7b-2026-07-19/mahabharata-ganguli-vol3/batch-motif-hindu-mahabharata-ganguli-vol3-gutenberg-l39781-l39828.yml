canonical_text:
  quote: ''
  summary: Narada addresses the Salmali tree, suggesting that the Wind-god must protect
    it because the Wind can break trees, mountains, and mansions. The Salmali denies
    any friendship or protection from the Wind and claims superior strength. Narada
    rebukes the tree, asserts the unequalled might and life-giving role of the Wind-god,
    condemns Salmali's refusal of worship, and says he will report the tree's words
    to the Wind. Narada contrasts Salmali with other strong trees that respect and
    bow to the Wind.
  language: English
