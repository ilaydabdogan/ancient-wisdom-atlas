canonical_text:
  quote: ''
  summary: Bhishma recounts how Virupaksha performs funeral rites for Rajadharman,
    the prince of cranes. Surabhi appears above the pyre and her milk-froth falls
    on it, reviving Rajadharman. Indra explains that a curse by the Grandsire caused
    Rajadharman not to die soon, and at Rajadharman's request Indra restores Gautama
    to life with nectar. Gautama returns home and is later cursed by the gods to hell,
    while Bhishma concludes with a moral teaching against ingratitude and injuring
    friends.
  language: English
  quote_policy: summarized
