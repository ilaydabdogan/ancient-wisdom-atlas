canonical_text:
  quote: ''
  summary: Sanjaya describes a dreadful general battle in which Kshatriya warriors,
    chariots, horsemen, infantry, and elephants mingle and slaughter one another.
    The field becomes blood-soaked, filled with severed limbs, corpses, animals in
    agony, dust-darkened confusion, rivers of blood leading toward Yama's abode, carrion
    creatures, and heroes who continue to observe warrior duty without fear.
  language: English
