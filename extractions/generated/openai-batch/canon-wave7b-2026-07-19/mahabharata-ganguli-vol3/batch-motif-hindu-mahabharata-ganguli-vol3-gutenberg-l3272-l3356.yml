canonical_text:
  quote: ''
  summary: Shalya objects to being asked by the son of Gandhari to serve as Karna's
    driver, arguing that the request dishonors his royal and Kshatriya status. He
    boasts of his weapons and destructive power, invokes the hierarchy and duties
    of social orders, and tries to leave. The son of Gandhari restrains and conciliates
    him, praising his truthfulness and horse-knowledge, and compares him favorably
    to Vasudeva/Krishna. Shalya agrees to drive Karna in battle against Partha on
    the condition that he may speak as he wishes in Karna's presence; Karna and the
    son of Gandhari accept.
  language: English
  quote_policy: summarized
