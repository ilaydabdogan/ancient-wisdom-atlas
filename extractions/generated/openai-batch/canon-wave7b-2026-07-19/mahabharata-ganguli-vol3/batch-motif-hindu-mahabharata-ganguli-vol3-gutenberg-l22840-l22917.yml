canonical_text:
  quote: ''
  summary: Vyasa consoles Dhritarashtra after the destruction of the Kurus. He argues
    that mortal life is unstable, that the war was ordained by Destiny and the gods,
    and that Duryodhana functioned as the destined instrument for relieving Earth
    of her burden. Vyasa recounts seeing Earth petition the gods in Indra's court
    and Vishnu declaring that assembled kings would slay one another at Kuru. He says
    Vidura and Yudhishthira tried for peace but could not defeat the divine decree,
    and he urges Dhritarashtra to live and extinguish grief with wisdom.
  language: English
  quote_policy: summarized
