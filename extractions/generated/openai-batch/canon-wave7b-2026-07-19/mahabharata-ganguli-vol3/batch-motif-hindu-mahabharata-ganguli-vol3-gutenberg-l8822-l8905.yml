candidate_motifs:
- id: motif:1
  label: Warrior restored by foreknowing protector
  taxonomy_refs:
  - wisdom
  basis: After hearing Keshava, Arjuna loses anxiety and declares that victory is
    sure because Krishna protects him and knows past and future.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage frames Krishna as protector and knower, but it does not narrate
    a full quest for wisdom.
- id: motif:2
  label: Vowed revenge that falsifies the enemy’s vow
  taxonomy_refs: []
  basis: Arjuna recalls Karna’s vow not to wash his feet until he kills Phalguna and
    declares that he will falsify it by killing Karna; he also recalls Karna’s insults
    and boasts as words to be refuted by arrows.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: This is a passage-level revenge and counter-vow pattern rather than a
    named taxonomy motif in the supplied list.
- id: motif:3
  label: Royal legitimacy restored through enemy defeat
  taxonomy_refs:
  - royal_legitimacy
  basis: Arjuna calls Duryodhana undeserving of sovereignty, says Dhritarashtra will
    lose sovereignty for installing him, and states that he will bestow the earth
    divested of Dhartarashtras on his brother.
  evidence_refs:
  - ev:3
  - ev:9
  confidence: high
  cautions: The passage is a warrior’s prediction; it does not itself narrate the
    completed transfer of rule.
- id: motif:4
  label: Heroic combat framed by Indra’s victories
  taxonomy_refs: []
  basis: Arjuna compares Karna’s coming death to Vritra being slain by Indra and to
    Samvara being slain by Maghavat.
  evidence_refs:
  - ev:4
  - ev:9
  confidence: high
  cautions: The comparison is explicit, but it is a simile within Arjuna’s speech
    rather than a separate narrated myth.
- id: motif:5
  label: Weapon sends enemy on last journey to death’s realm
  taxonomy_refs:
  - afterlife_journey_map
  basis: Arjuna says his arrows will take Karna to Yama and send him on his last journey.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: medium
  cautions: The passage names Yama as destination but does not describe a detailed
    afterlife journey.
- id: motif:6
  label: Battlefield body returned to earth and birds
  taxonomy_refs: []
  basis: Arjuna says the earth will drink Karna’s blood and carnivorous birds will
    sport over his severed limbs.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: medium
  cautions: This is a vivid battlefield aftermath image; broader ritual or cosmological
    meaning is not stated.
- id: motif:7
  label: Debt and long grief discharged through combat
  taxonomy_refs: []
  basis: Arjuna says killing Karna will free him from debts to bowmen, wrath, the
    Kurus, shafts, and Gandiva, and from grief kept for thirteen years.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage gives Arjuna’s stated emotional and martial rationale, not
    a completed purification rite.
