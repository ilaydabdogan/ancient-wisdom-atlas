canonical_text:
  quote: ''
  summary: Sanjaya reports that Arjuna, encouraged by Krishna, becomes cheerful, takes
    up Gandiva, and vows to kill Karna. Arjuna describes Karna’s weapons, recalls
    Karna’s earlier boasts and insults, predicts Karna’s death and the collapse of
    Dhritarashtra’s side, compares the coming victory to Indra’s slaying of Vritra
    and Samvara, and says Yudhishthira’s sorrow and Arjuna’s own long grief will be
    ended.
  language: English
  quote_policy: summarized
