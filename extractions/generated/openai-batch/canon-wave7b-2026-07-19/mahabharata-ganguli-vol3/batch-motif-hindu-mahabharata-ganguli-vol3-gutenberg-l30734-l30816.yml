canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma to state the principal duties of a kingdom. Bhishma
    teaches that the first duty is the election and coronation of a king, because
    anarchy leads to robbery, loss of righteousness, mutual predation, enslavement,
    abduction, and failed ritual order. He says the crowned king is associated with
    Indra and should be honored accordingly. He advises people in anarchic realms
    to receive a powerful equitable ruler. He recounts an origin account in which
    people suffering from anarchy make social compacts, ask the Grandsire for a king,
    and the Grandsire asks Manu. Manu hesitates because of the sins involved in governing
    deceitful people. The inhabitants promise taxes, service, brides, and a share
    of merit in exchange for protection. Manu then proceeds with force, inspires fear,
    checks wickedness, and sets people to their duties.
  language: English
  quote_policy: summarized
