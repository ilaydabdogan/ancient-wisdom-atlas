canonical_text:
  quote: The warriors in the Pandava camp beheld that Death-Night in her embodied
    form
  summary: Ashvatthama, called Drona's son, enters the Pandava camp in rage over his
    father's death and kills the sons of Draupadi, Shikhandi, and other warriors.
    The Pandava warriors then see an embodied figure of Death-Night leading away men,
    animals, spirits, and disarmed warriors, recalling recurring dreams of that same
    figure and Ashvatthama striking the sleepers.
  language: English
  quote_policy: quoted
