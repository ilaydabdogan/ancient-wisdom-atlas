  text: Ashvatthama moves through the camp in a terrifying form, sees the sons of
    Draupadi and remaining Somakas, and is attacked with arrows by the sons of Draupadi
    and by the Prabhadrakas led by Shikhandi.
  category: action
  evidence_refs:
  - ev:1
