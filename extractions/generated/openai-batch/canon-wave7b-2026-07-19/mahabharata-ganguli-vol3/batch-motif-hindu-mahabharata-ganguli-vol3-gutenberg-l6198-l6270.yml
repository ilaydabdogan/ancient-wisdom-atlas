canonical_text:
  quote: ''
  summary: In this battle passage, Dhananjaya kills many warriors and elephants and
    is surrounded by the samsaptakas, who seek either death or victory. Kuru leaders
    attempt to rescue a panicked army. Kripa duels Shikhandi, disables his chariot,
    horses, driver, and shield, while other warriors intercept one another across
    the field. Suketu intervenes against Kripa, wounds him and his driver, but Kripa
    takes up a new bow and beheads Suketu, after which Suketu's troops flee.
  language: English
  quote_policy: summarized
