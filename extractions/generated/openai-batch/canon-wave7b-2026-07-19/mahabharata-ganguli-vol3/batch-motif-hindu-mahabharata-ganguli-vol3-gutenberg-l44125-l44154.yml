canonical_text:
  quote: Transcending the Creator (Brahman), he attains to absorption into the One
    Supreme Soul.
  summary: 'Bhishma explains the possible ends of a Gayatri Reciter: attached reciters
    dwell in divine or cosmic regions and take on their attributes; detached reciters
    who seek the Supreme Immutable enter that state, lose separate consciousness,
    and attain absorption into the One Supreme Soul; other alternatives include separate
    wish-fulfilling existence dependent on the Supreme Cause or supreme felicity after
    rejecting desire even in felicity-regions called hells.'
  language: English
  quote_policy: quoted
