canonical_text:
  quote: ''
  summary: The passage presents moral afterlife destinations; identifies ignorance
    as the single foe overcome by wisdom; prescribes study, penance, domestic sacrifice,
    family continuity, forest restraint, compassionate conduct, pilgrimage, gifts,
    purification, cremation rites, and scriptural duties; and frames the teaching
    as Bhishma recounting an older instruction by a sage to the ruler of the Videhas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The lives of the righteous pierce through the Sun and ascend into the regions
    of Brahma, while morally mixed lives remain in middle regions and sinful lives
    sink to the lowest depths.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ignorance is identified as the single foe of humans and is said to lead people
    into frightful and cruel acts.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ignorance is said to be destroyed only when crushed by the shafts of wisdom
    through steady endeavors and attendance on the aged according to Sruti duties.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person seeking merit is instructed to study the Vedas and practice penance
    as a Brahmacharin, then enter domestic life and perform sacrifices, establish
    a family line, and later enter the forest restraining the senses for Emancipation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Human birth is described as foremost because a human being can rescue oneself
    by meritorious acts.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: A human being who indulges malice, disregards righteousness, and yields to
    desire is said to be betrayed by those desires.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A person who views all creatures affectionately, consoles them, gives them
    food, speaks agreeably, rejoices in their happiness, and grieves in their grief
    is said not to suffer misery in the next world.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage instructs one to go to Saraswati, the Naimisha woods, Pushkara
    waters, and other sacred places, and there practice gifts, renunciation, amiable
    conduct, baths, and penances.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: People who die in their houses should receive cremation rites; their bodies
    should be carried by vehicles to the crematorium and burnt according to scriptural
    rites of purification.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Religious rites, beneficial ceremonies, sacrifices, officiation, gifts, meritorious
    acts, and duties for deceased ancestors are described as being done for one’s
    own benefit.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Bhishma states that a high-souled sage gave this teaching to the ruler of
    the Videhas in ancient days for his benefit.
  category: speech
  evidence_refs:
  - ev:9
