canonical_text:
  quote: ''
  summary: Sanjaya narrates that followers of Subala's son attack the Pandavas and
    seek to kill Sahadeva, but Arjuna and Bhimasena oppose them. Duryodhana rallies
    his remaining forces and orders them to attack the Pandavas, their allies, and
    the prince of Pancala. The Pandavas and allied warriors destroy the Kaurava remnant;
    dust obscures the directions, and Duryodhana is left wounded and nearly alone,
    resolving to retreat. Dhritarashtra asks Sanjaya what remained and what Duryodhana
    did as sole survivor.
  language: English
  quote_policy: summarized
