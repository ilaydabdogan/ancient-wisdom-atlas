canonical_text:
  quote: ''
  summary: Vaisampayana reports Yudhishthira’s reasoned speech to Arjuna. Yudhishthira
    argues that wealth is not supreme, praises Vedic study, penance, contentment,
    desire-withdrawal, and non-harm, describes southern and northern solar paths to
    heavenly or bright regions, invokes Yayati’s old discourse, and warns that wealth
    should be used for sacrifice and proper gifts rather than enjoyment.
  language: English
  quote_policy: summarized
