canonical_text:
  quote: From these circumstances I see that trees have life. They are not inanimate.
  summary: Bhrigu argues that trees possess life and sensory capacities, then explains
    embodied beings through five elements, five life-breaths, and the sensory qualities
    of scent, taste, form, touch, and sound.
  language: English
  quote_policy: quoted
