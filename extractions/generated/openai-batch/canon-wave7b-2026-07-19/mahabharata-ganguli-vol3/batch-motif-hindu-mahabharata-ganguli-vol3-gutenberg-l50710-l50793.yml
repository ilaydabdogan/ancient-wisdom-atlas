canonical_text:
  quote: From the Sun springs rain. From rain springs food. From food are born living
    creatures.
  summary: Tuladhara explains sacrifice to Jajali, distinguishing righteous, non-covetous,
    non-injurious sacrifice from greedy or misunderstood ritual practice. He describes
    offerings acquired by righteous means, sacrificial fire, the Sun-rain-food-life
    sequence, the moral effects of intention, the superiority of truth, self-restraint,
    Yoga, knowledge, and self-offering, and the attainment of the sorrowless region
    of Brahman by those who seek emancipation without injury to creatures.
  language: English
  quote_policy: quoted
