canonical_text:
  quote: ''
  summary: Bhishma reports Vyasa's discourse to his son Suka. Vyasa teaches ethical
    self-restraint, the transience of embodied life, reliance on wise preceptors,
    the ascent of righteousness, the crossing of the world by Yoga and Righteousness,
    vigilance before Death, Brahmanical penance, the passage of time, and the suffering
    of the unrighteous in Yama's regions.
  language: English
  quote_policy: summarized
