canonical_text:
  quote: ''
  summary: After the Pandavas send Krishna to Dhritarashtra to seek peace and the
    mission fails, Krishna urges the Pandavas toward battle. Balarama disagrees about
    supporting the Kurus, then sets out on a pilgrimage to the Sarasvati with priests,
    attendants, goods, sacred fire, and many gifts. Along the sacred route he gives
    wealth, food, vehicles, clothing, cattle, and sacrificial presents, eventually
    reaching Kurukshetra. Janamejaya asks about the Sarasvati tirthas; Vaishampayana
    begins with Prabhasa, where Soma was freed from a curse, regained energy, and
    restored his splendor.
  language: English
  quote_policy: summarized
