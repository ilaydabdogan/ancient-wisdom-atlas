  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The living agent is said not to be destroyed when the body dissolves; death
    is defined as dissolution of the body.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The living agent is said to go from one body to another, and the Soul is said
    to migrate from form to form unseen and unnoticed.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:14
  text: Persons with true knowledge, subtle intelligence, frugal fare, purity, and
