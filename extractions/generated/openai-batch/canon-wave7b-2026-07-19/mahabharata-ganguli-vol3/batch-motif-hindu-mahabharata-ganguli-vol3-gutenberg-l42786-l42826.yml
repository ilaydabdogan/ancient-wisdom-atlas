canonical_text:
  quote: ''
  summary: Bhrigu teaches that mind and body are composed of five elements, while
    an internal Soul sustains the body, witnesses the mind, perceives sensory qualities,
    and survives bodily dissolution. The passage describes the universe as composed
    of water, identifies the Soul with Brahman, Kshetrajna, and Paramatman under different
    conditions, states that the living agent migrates from body to body, and says
    that disciplined wisdom and yoga allow one to behold the Soul.
  language: English
  quote_policy: summarized
