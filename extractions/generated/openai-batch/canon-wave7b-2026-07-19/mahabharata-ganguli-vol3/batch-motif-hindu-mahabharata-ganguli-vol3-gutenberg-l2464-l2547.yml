canonical_text:
  quote: ''
  summary: 'Sanjaya narrates a sequence of battlefield encounters: Uluka defeats Yuyutsu
    by destroying his chariot support; Srutakarman and Satanika disable one another''s
    cars and withdraw; Shakuni and Sutasoma exchange arrows, after which Sutasoma
    fights on foot with bow and then scimitar until his weapon is cut, and he uses
    the broken fragment to sever Shakuni''s bow before withdrawing to another car.'
  language: English
  quote_policy: summarized
