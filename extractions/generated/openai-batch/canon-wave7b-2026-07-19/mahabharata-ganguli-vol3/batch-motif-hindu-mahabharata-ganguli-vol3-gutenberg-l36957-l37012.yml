canonical_text:
  quote: ''
  summary: The passage gives counsel on royal conduct in distress. It says a king
    should preserve treasury, army, punitive machinery, allies, institutions, and
    chiefs; explains the treasury, army, merit, and subjects through chains of dependence;
    permits otherwise improper exactions in times of crisis; illustrates the point
    through sacrificial and tree-cutting analogies; and concludes with claims about
    wealth, kingdom, and the need to fill the treasury by righteousness rather than
    unrighteous practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A king in extreme distress is told not to give up his treasury, machinery
    for chastising the wicked, army, friends, allies, necessary institutions, or chiefs
    in the kingdom.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men conversant with duty say that one should preserve seeds even by deducting
    them from one’s own food, and the passage connects this truth with the treatise
    of Samvara.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The passage presents a chain of dependence: the king’s roots are treasury
    and army; the army is rooted in the treasury; the army is the root of the king’s
    religious merits; and religious merits are the root of the subjects.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that a treasury cannot be filled without oppressing others
    and says that, in seasons of distress, a king incurs no fault by oppressing subjects
    to fill the treasury.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Improper acts are described as being done for sacrifices, and the passage
    argues that improper practices may be followed for wealth in times of distress
    to avoid evil results.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Policy, chastisement, treasury, and army are said to exist for vanquishing
    foes and protecting or enlarging the kingdom.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A large tree is described as being cut down to make a sacrificial stake; other
    trees in its way are also cut down, and falling trees kill others standing nearby.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage says that wealth can secure this world and the other world, as
    well as truth and religious merit, and that a person without wealth is more dead
    than alive.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says it is sinful for a king to oppress subjects with heavy impositions
    in ordinary times, while a season of distress is treated differently.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage closes by saying that the treasury should be filled by the aid
    of righteousness and not by unrighteous practices that pass for righteous in times
    of distress.
  category: speech
  evidence_refs:
  - ev:5
