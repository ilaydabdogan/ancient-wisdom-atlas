canonical_text:
  quote: ''
  summary: 'Visoka points out signs of Arjuna and Krishna advancing through the hostile
    army: the Gandiva bow, the ape banner, conches, jewels, discus, steeds, and the
    destruction of enemy elephants, cars, cavalry, and infantry. He tells Bhima that
    Arjuna is coming toward him and that his wishes are fulfilled. Bhima, pleased
    by the news of Arjuna''s arrival, promises Visoka villages, female slaves, and
    cars.'
  language: English
  quote_policy: summarized
