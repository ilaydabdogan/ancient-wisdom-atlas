literal_observations:
- id: obs:1
  text: The passage advises the king not to consult persons described as crooked-hearted,
    allied with foes, unconcerned with subjects, unlearned, impure, proud, boastful,
    unfriendly, wrathful, covetous, strangers, or persons previously wronged by royal
    acts such as banishment or confiscation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the king should consult persons described as wise, intelligent,
    learned, born within the kingdom, pure, righteous, knowledgeable about friends
    and foes, truthful, modest, mild, hereditary servants, courageous, and trusted
    by people of the capital and provinces.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that men with the approved qualities should be made ministers
    and that their number should not be less than three.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ministers are instructed to observe the laches of their master, themselves,
    the subjects, and the master's foes, while also concealing their own counsels
    and laches.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: A simile compares ministers protecting their counsels to a tortoise protecting
    its limbs by withdrawing them into its shell.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage describes counsels as the king's armour and says a kingdom has
    its roots in spies and secret agents and its strength in counsels of policy.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The king is told to consult three ministers, report their opinions and his
    own to a Brahmana preceptor versed in virtue, profit, and pleasure, ask his opinion,
    and then carry out the decision without attachment.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says certain persons should not be present at the place of consultation
    and that nothing should move around the council place before, behind, above, below,
    or crosswise.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says the king should hold consultation either on a boat or in
    an open grassless space from which the surrounding land can be clearly seen, at
    the proper time and avoiding faults of speech and gesture.
  category: setting
  evidence_refs:
  - ev:6
