  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that Knowledge with Intelligence and Consciousness is the
    seed of embodied Souls, and that the seed of such knowledge is called the Jiva
    or Chit-Soul.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Soul is said to undergo birth and repeated rebirth because of acts and
