canonical_text:
  quote: ''
  summary: Bhishma teaches that the qualities of Passion and Darkness generate delusion,
    wrath, desire, attachment, acts, sorrow, and repeated birth and death. He describes
    embodiment in the womb through vital seed and blood, the arising of senses and
    breaths from past acts and attachments, and the possibility of emancipation through
    purity, renunciation, scriptural discernment, and weakening of the senses. The
    passage includes gendered ascetic assertions about women, men, offspring, and
    creation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhishma says that Passion gives rise to delusion and that Darkness gives rise
    to wrath, cupidity, fear, and pride; when these are destroyed, a person becomes
    pure and attains knowledge of the Supreme Soul.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma presents a sequence in which maya darkens knowledge, wrath leads to
    desire, desire leads to cupidity, delusion, vanity, pride, and selfishness, and
    selfishness leads to acts, bonds of affection, sorrow, and liability to birth
    and death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage describes birth as involving residence in the womb due to the
    union of vital seed and blood, with the womb described as fouled by bodily substances.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Chit-Soul is said to become bound by wrath and related evils while seeking
    escape from them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bhishma says women are instruments that set the stream of creation going,
