canonical_text:
  quote: ''
  summary: Translator and commentator notes explain distinctions among spiritual ranks,
    oral preservation of the Vedas, knowledge of the Soul as the means to understand
    and avoid birth and death, the relationship of Soul and Brahma, Yoga, acts and
    knowledge, Yuga-era differences in Vedic devotion, penance as a source of creative
    power, and signs of decline such as diminished milk, fertility, sweetness of water,
    and virtue of herbs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The notes distinguish intermediate observers of caste duties from foremost
    persons who have transcended caste distinctions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The notes state that before the Vedas were reduced to writing, their contents
    dwelt in the memories of men versed in them.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The notes identify understanding birth and death, and avoiding birth and therefore
    death, as the highest fruits of knowledge of the Soul.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: Those without knowledge of the Soul are described as travelling in a round
    of repeated rebirths.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The term para is explained as meaning the high or foremost, frequently Brahma
    or the Soul, with Soul regarded as part of Brahma.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Yoga is described as enabling a righteous person to regard everything in the
    universe as the person's own Soul.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: One who realizes the ideal of Soul through Yoga is described as a true Brahmana,
    a regenerate person, and a god on Earth.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Daiva is explained as necessity or a blind force whose origin is untraceable.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Treta and other Yugas, people are described as attached to only one
    Veda, while men of the Krita age regarded all Vedas equally and as identical.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Jiva or Chit is said to become puissant and create the universe by means of
    penance.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: By penance one is said to attain Brahma and universal puissance.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: In the province of acts, Brahma is represented as Indra and other gods; in
    Vedanta, knowledge is presented as the means to attain Brahma.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: An idiom is explained as meaning becoming invisible.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:14
  text: A decline is described in which cows do not yield copious sweet milk, soil
    ceases to be fertile, water ceases to be sweet, and medicinal and edible herbs
    lose healing virtue and flavor.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: The Vedas are said to cause the observances of Yoga, rites, and vows to grow,
    and those observances aid students of the Vedas in achieving their purposes.
  category: action
  evidence_refs:
  - ev:12
