canonical_text:
  quote: ''
  summary: Yudhishthira laments the deaths of kin, allies, elders, and teachers caused
    or enabled by the war. He confesses deception toward Drona, grief over Bhishma,
    Karna, Abhimanyu, Draupadi's sons, and others, and declares a Praya vow of fasting
    unto death. Vyasa restrains him and teaches that destiny governs birth and dissolution,
    that compounded things end, and that Yudhishthira must not avoid work.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yudhishthira says grief does not leave him after the deaths in battle of Abhimanyu,
    Draupadi's sons, Dhrishtadyumna, Virata, Drupada, Vasusena, Dhrishtaketu, and
    other kings.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yudhishthira calls himself covetous of kingdom, an exterminator of his race,
    and a slayer of kinsmen and reverend seniors.
  category: speech
  evidence_refs:
  - ev:1
  - ev:5
- id: obs:3
  text: Yudhishthira recalls Bhishma being assailed by Sikhandin and by Partha's shafts,
    pierced with arrows, weakened, reeling, and falling on his chariot with his face
    eastward.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yudhishthira says Bhishma knew Sikhandin was his destroyer but still refrained
    from slaying him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Yudhishthira says Drona asked him whether his son lived, and Yudhishthira
    falsely said Aswatthaman had been killed while silently adding that the slain
    Aswatthaman was an elephant.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Yudhishthira says he caused Karna to be slain and caused young Abhimanyu to
    enter an array protected by Drona.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Yudhishthira declares that he will remain seated, forgo food and drink, dry
    up his life-breaths, and cast off his body in the observance of the Praya vow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Vaisampayana says Vyasa restrained the sorrow-stupefied Yudhishthira and first
    told him, "This can not be!"
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Vyasa says born creatures first display union and later dissolution, and compares
    them to bubbles in water that rise and disappear.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Vyasa says idleness ends in misery, skilled labor ends in happiness, success
    springs from work, and Yudhishthira is not fit to avoid work.
  category: speech
  evidence_refs:
  - ev:8
