canonical_text:
  quote: ''
  summary: Sanjaya reports that after Bhima destroys an elephant division and slaughters
    the Kuru army, surviving sons of the king unite while Duryodhana is unseen and
    surround Bhima. Bhima kills the named brothers with arrows, duels and beheads
    Srutarvan, then destroys large numbers of cars, elephants, foot soldiers, and
    steeds. The passage closes with Bhima regarding his purpose accomplished, terrifying
    elephants by slapping his armpits, and the remaining army becoming cheerless.
  language: English
  quote_policy: summarized
