canonical_text:
  quote: "“Extinguish, O Phalguna, this fire in my heart that is born of vindictiveness...”"
  summary: A first-person speaker recalls Karna’s earlier insults, vows, and acts
    in the Kuru assembly, then repeatedly asks the addressed warrior Savyasaci/Phalguna
    whether Karna has been slain in battle. The speaker says news of Karna’s death
    would extinguish a vindictive fire in his heart and compares his waiting to Vishnu
    awaiting Indra’s news of Vritra’s slaughter.
