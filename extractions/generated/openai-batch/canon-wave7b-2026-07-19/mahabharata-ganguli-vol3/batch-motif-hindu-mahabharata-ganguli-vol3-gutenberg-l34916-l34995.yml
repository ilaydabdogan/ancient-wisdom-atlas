  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Bhishma says everything has not been laid down in the Srutis.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: When robbers ask questions to facilitate plunder, one should not answer; if
    silence is unsafe, false speech is preferred to true speech.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Bhishma says a false oath may be taken without sin to escape sinful men, and
    that wealth should not be given to sinful men.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Untruth is permitted when life is at risk, on the occasion of marriage, to
    save the wealth and prosperity of others, or for religious purposes.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: A promise to pay creates an obligation, and improper failure to fulfill a
