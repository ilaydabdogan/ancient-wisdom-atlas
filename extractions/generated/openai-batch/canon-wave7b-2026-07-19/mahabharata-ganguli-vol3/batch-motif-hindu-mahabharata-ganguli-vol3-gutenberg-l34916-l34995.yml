- id: obs:2
  text: Bhishma states that telling truth is consistent with righteousness and that
    nothing is higher than truth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bhishma says that in cases where falsehood takes the aspect of truth or truth
    takes the aspect of falsehood, one must distinguish the righteous course rather
    than simply speak literal truth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person who says truth dissociated from righteousness is said to incur sin,
    while one able to distinguish truth from falsehood is described as conversant
    with duties.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The hunter Valaka is said to have earned great merit by slaying a blind beast
    that threatened to destroy all creatures.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: An owl on the banks of the Ganges is said to have obtained great merit by
