canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma how one who adheres to virtue should understand
    truth, falsehood, and occasions for telling either. Bhishma answers that truth
    is highest, but truth and falsehood must be judged by righteousness, non-injury,
    and the upholding of creatures. He gives exceptional cases involving violence,
    silence, false speech, oaths, robbery, debt, marriage, and life-threatening danger.
    He condemns deceitful wealth-obsessed persons, says they fall from humanity and
    divine grace, and describes their rebirth as crows and vultures.
  language: English
  quote_policy: summarized
literal_observations:
