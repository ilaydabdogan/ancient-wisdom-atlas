canonical_text:
  quote: ''
  summary: 'Utathya instructs Mandhatri on royal duty: worship, sacrifices, gifts,
    protection of the distressed, support of dependents, restraint of subjects, chastisement
    of the wicked, favoring the worthy, self-control, forgiveness, intelligence, and
    vigilance toward enemies. The king is compared with Yama and Indra and is told
    to follow the conduct of divine and royal exemplars. Bhishma then says Mandhatri
    obeyed, became lord of the earth, and that the addressed king should rule righteously
    to gain heaven.'
  language: English
  quote_policy: summarized
