canonical_text:
  quote: ''
  summary: Vaisampayana reports Arjuna's forceful speech to a king who wishes to abandon
    conquered sovereignty. Arjuna argues against mendicancy and forest retirement,
    claims royal duty depends on wealth, cites divine and royal precedents for conflict
    and acquisition, urges sacrifice and horse-sacrifice for purification of subjects,
    and invokes Mahadeva's total sacrificial offering as an eternal auspicious path.
  language: English
  quote_policy: summarized
