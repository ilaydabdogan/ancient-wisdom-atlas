canonical_text:
  quote: ''
  summary: Bhishma recounts Rishabha's report of arriving at the asylum of Nara and
    Narayana near Vadri and the heavenly lake associated with the Ganga's source.
    After ritual bathing and offerings, Rishabha meets the extremely emaciated ascetic
    Tanu. While Tanu is discoursing on righteousness and profit, King Viradyumna arrives
    in the forest seeking his missing only son Bhuridyumna. The king asks about hope,
    and the Muni explains that the son had insulted a holy Rishi by refusing a request
    for a golden jar and vegetable barks. The king worships the ascetic, receives
    forest hospitality, and the assembled Rishis ask why he has come.
  language: English
  quote_policy: summarized
