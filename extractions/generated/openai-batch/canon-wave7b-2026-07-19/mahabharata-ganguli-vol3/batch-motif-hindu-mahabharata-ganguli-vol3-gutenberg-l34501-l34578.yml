canonical_text:
  quote: ''
  summary: A sage counsels the prince or king of Kosala not to grieve over past, future,
    lost prosperity, union, or separation. He criticizes attachment to wealth, praises
    wisdom, restraint, and renunciation, and advises the dispossessed ruler to withdraw
    to the forest, live simply on roots and fruit, restrain speech and soul, and cultivate
    compassion. He compares a wise person’s return to composure with a turbid lake
    becoming tranquil again.
  language: English
  quote_policy: summarized
