  quote: ''
  summary: Keshava counsels Dhritarashtra and Gandhari not to blame or destroy the
    Pandavas, reminds Gandhari of her earlier maxim that victory follows righteousness,
    warns that her ascetic power could burn the Earth, then intuits a night plot by
    Drona's son against the Pandavas and departs to protect them. The passage closes
    with Dhritarashtra asking Sanjaya about the wounded Duryodhana.
