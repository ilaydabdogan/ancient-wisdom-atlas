literal_observations:
- id: obs:1
  text: The note explains abhaya as a pledge to total harmlessness, universal compassion,
    or benevolence toward all creatures, and connects abstention from injury with
    the fourth mode of life.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yama is glossed as including benevolence, truthfulness, faith, Brahmacharya,
    and freedom from attachment; niyama is glossed as purity, contentment, Vedic study,
    meditation on the Supreme, and related duties.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The adopted Sannyasin is described as persistently enquiring after the Soul
    or Self and discarding caste-marks and other indications.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A skull is explained as a drinking vessel, and rags are explained as old reddish
    or brown cloth that has lost its colour.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A forbearance image compares hostile words entering a person who gives no
    answer to elephants hurled into a well and unable to come out.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: A yogic practitioner is described as regarding himself as everything and everything
    as himself, and as withdrawing senses and mind so that a populous place appears
    solitary.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A mendicant or renouncer is instructed not to eat to the full measure of gratification
    and not to completely appease hunger.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The fruits of Yoga are said to absorb the fruits of every other act, including
    the rank and status of Indra, and Emancipation is described as felicity conferred
    by Yoga.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Abstention from injury is said to include every other duty, while acts, including
    religious acts and sacrifices, are described as being fraught with injury.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: The Supreme Soul is described through images of vastness beyond the firmament,
    gold, an egg associated with the universe and heart, many feathers, two wings,
    and many rays of light.
  category: attribute
  evidence_refs:
  - ev:10
