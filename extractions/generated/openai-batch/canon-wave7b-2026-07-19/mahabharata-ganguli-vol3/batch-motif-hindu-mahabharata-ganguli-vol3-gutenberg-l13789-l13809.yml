  summary: In a battle scene, Shalya, ruler of the Madras, releases a vast storm of
    gold-decked arrows that fills the sky, darkens the field, agitates the Pandava
    host, and draws wonder from gods and Gandharvas. He shrouds Yudhishthira and the
    Pandava warriors with arrows and roars like a lion, but the Pandavas led by Yudhishthira,
    with Bhimasena at their head, do not flee.
