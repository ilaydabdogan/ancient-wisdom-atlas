canonical_text:
  quote: ''
  summary: Sanjaya narrates that Shalva, ruler of the Mlecchas, attacks the Pandava
    forces from a gigantic trained elephant. The elephant routs the Pandava host,
    and Dhrishtadyumna advances against it. After the elephant destroys Dhrishtadyumna's
    car, several Pandava-side warriors check it. Dhrishtadyumna then strikes the elephant
    with a mace, causing it to fall, while the grandson of Sini cuts off Shalva's
    head.
  language: English
  quote_policy: summarized
