canonical_text:
  quote: ''
  summary: Yudhishthira sends Nakula to bring Draupadi, then visits the battlefield
    and collapses on seeing his slain sons, kin, and friends. Draupadi arrives in
    grief, demands that Drona's son be killed for the slaughter of her sons, vows
    to sit in praya if vengeance is not taken, and asks that his head-born gem be
    brought to her and placed on Yudhishthira's head. Bhima, moved by her lament,
    mounts his chariot with Nakula as charioteer and pursues Ashvatthama's track.
  language: English
  quote_policy: summarized
