canonical_text:
  quote: ''
  summary: Bhishma presents Sankhya doctrine as a faultless philosophical teaching
    associated with Kapila and the Yatis. The passage describes discriminating knowledge
    of sensory objects, qualities, cosmic principles, body, soul, breaths, suffering,
    hell, transmigration, and celestial disorder. Sankhya practitioners who discern
    these matters are said to attain Emancipation. A chain of refuges links senses,
    elements, qualities, Soul, Narayana, and Emancipation.
  language: English
  quote_policy: summarized
