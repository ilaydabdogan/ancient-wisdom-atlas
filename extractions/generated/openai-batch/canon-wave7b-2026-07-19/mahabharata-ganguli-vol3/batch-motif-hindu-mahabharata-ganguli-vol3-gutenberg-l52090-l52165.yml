- id: obs:7
  text: The deer asks Satya to slay and cut him in pieces for libations on the sacrificial
    fire, saying this will make Satya blameless and allow ascent to heaven.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Savitri, the presiding goddess of the solar disc, arrives in embodied form
