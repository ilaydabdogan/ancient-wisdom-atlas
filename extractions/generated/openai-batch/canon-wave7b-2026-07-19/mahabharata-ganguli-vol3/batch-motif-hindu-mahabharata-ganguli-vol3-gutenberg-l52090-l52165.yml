  evidence_refs:
  - ev:7
- id: obs:10
  text: The deer begs again with joined hands; Satya embraces him in friendship, dismisses
    him, and the deer returns after going eight steps.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The deer again asks to be slain, says he will attain a righteous end if slain
    by Satya, and grants Satya spiritual vision of celestial Apsaras and Gandharva
    vehicles.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Satya beholds the vision for a long time and, thinking heavenly residence
