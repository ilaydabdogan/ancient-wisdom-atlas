canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma about a sacrifice performed for virtue alone.
    Bhishma recounts Narada's story of Satya, an ascetic Brahmana sacrificer, his
    reluctant wife Pushkaradharini, and a speaking deer later identified as Dharma.
    The deer urges Satya to kill it for sacrificial libations and shows him a celestial
    vision, but Dharma ultimately teaches that slaughter is not part of true sacrifice;
    abstention from injury is presented as the complete religion of Truth.
  language: English
  quote_policy: summarized
