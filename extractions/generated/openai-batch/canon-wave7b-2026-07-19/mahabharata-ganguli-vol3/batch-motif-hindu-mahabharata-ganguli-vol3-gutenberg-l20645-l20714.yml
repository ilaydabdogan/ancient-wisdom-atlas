canonical_text:
  quote: I shall make a great and terrible assault upon their camp.
  summary: Drona's son declares that he will attack the victorious Pancalas at night
    while they sleep unarmoured in their camp, kill Dhrishtadyumna and the sleeping
    sons of the Pancalas and Pandavas, and thereby repay a debt to his sire. Kripa
    acknowledges his resolve for vengeance but counsels him to rest and attack in
    the morning with Kripa and Kritavarma as allies, either defeating the foes or
    dying and going to heaven.
  language: English
  quote_policy: quoted
