canonical_text:
  quote: Contentment is the highest heaven, contentment is the highest bliss.
  summary: Devasthana cites an old discourse of Vrihaspati to Indra. Vrihaspati teaches
    contentment, withdrawal of desire, non-injury, truthfulness, compassion, self-restraint,
    and righteous royal duty. He describes the ideal Kshatriya as one who rules justly,
    restrains the wicked, protects the righteous, guides subjects toward virtue, eventually
    passes the crown to his son, retires to the woods, and thereby obtains good fruits
    in this world and the next. He adds that emancipation is difficult, but righteous
    rulers and divine groups who practice this religion attain heaven.
  language: English
  quote_policy: quoted
