canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma to explain the duties belonging to the four modes
    of life and later asks how grief should be overcome after the loss of wealth or
    kin. Bhishma teaches that religious duties are not futile, that reflection leads
    to detachment from worldly things, and that intelligent persons should strive
    for emancipation of the soul. He then cites an old story in which a Brahmana counsels
    the grieving King Senajit after the death of his son, saying that all will go
    to the place from which they came; Senajit asks what knowledge or discipline enables
    the Brahmana not to yield to sorrow.
  language: English
  quote_policy: summarized
