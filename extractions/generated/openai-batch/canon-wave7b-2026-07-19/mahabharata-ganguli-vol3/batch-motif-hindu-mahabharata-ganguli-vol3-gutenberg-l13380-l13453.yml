canonical_text:
  quote: ''
  summary: Nakula slays Karna's son, causing fear in the Kaurava army. Shalya, ruler
    of the Madras, rallies and protects the troops. Pandava warriors place Yudhishthira
    at their head, and the opposing armies engage in a terrible battle marked by slaughter,
    fear, animal and natural similes, and a comparison to the ancient battle of gods
    and Asuras. At sunrise the Kuru army weakens, and Shalya charges to rescue it,
    while the Pandavas pierce him and he retaliates with arrows.
  language: English
  quote_policy: summarized
