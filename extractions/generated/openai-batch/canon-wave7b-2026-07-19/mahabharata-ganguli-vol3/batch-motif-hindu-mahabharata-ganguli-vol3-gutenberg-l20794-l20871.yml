canonical_text:
  quote: ''
  summary: Ashvatthama declares that his enemies have already violated righteousness
    in battle and vows to kill the Pancalas at night while they sleep. He sets out
    with Kripa and Kritavarma toward the sleeping Pancala camp. At the gate he sees
    a gigantic radiant guardian with blood-stained animal skins, snake ornaments,
    many weapons, a fiery mouth, thousands of eyes, and flames from which multitudes
    of armed Hrishikeshas emerge.
  language: English
  quote_policy: summarized
