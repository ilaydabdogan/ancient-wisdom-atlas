candidate_motifs:
- id: motif:1
  label: Righteous conquest over deceitful victory
  taxonomy_refs:
  - royal_legitimacy
  - wisdom
  basis: The passage repeatedly frames legitimate royal conquest as dependent on righteousness,
    excellence, and avoidance of deceit, unfair means, pride, and unrighteousness.
  evidence_refs:
  - ev:1
  - ev:8
  - ev:14
  confidence: high
  cautions: The taxonomy references are broad; the passage is primarily didactic political
    and ethical instruction rather than a narrative conquest episode.
- id: motif:2
  label: Mercy to the surrendered or incapacitated enemy
  taxonomy_refs: []
  basis: The text instructs that a warrior who surrenders, joins hands, loses armor,
    or lays aside his weapon may be seized but never killed.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No supplied taxonomy ref directly names this war-ethics motif.
- id: motif:3
  label: Year-long probation for captives and spoils taken by force
  taxonomy_refs: []
  basis: Both a vanquished king and a maiden taken by force are subject to a one-year
    period before final disposition; the maiden’s refusal requires return.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The motif is procedural and legalistic; it may not function as a mythic
    narrative motif outside this passage.
- id: motif:4
  label: Sacred mediator stops battle
  taxonomy_refs:
  - wisdom
  basis: A Brahmana seeking peace who enters between armies requires both sides to
    stop fighting, and harming him breaks an eternal rule.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The taxonomy link to wisdom is indirect; the passage emphasizes ritual-social
    authority and law more than a wisdom quest.
- id: motif:5
  label: Conciliation of conquered subjects through gifts and speech
  taxonomy_refs:
  - royal_legitimacy
  - sacred_exchange
  basis: Bhishma prescribes soothing speeches and gifts to recently conquered groups
    and warns that impolicy produces disloyalty and alliance with enemies.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The exchange is political in the literal passage; 'sacred_exchange' is
    a broad and only partial fit.
- id: motif:6
  label: Sacred limits on conquest spoils
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: The passage distinguishes permissible and impermissible handling of captured
    cattle, bulls, and sacrificial materials; Divodasa loses conquest merit after
    taking sacrificial fires and offerings, while Nabhaga gives kingdoms as sacrificial
    presents to Brahmanas.
  evidence_refs:
  - ev:5
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage presents these as royal-ethical precedents; symbolic interpretation
    of the sacrificial materials should be reviewed.
- id: motif:7
  label: Divine kingship through righteous conduct
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage says Indra gained sovereignty of the world through such behavior
    and that earthly kings obtain Indra’s status by it.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The claim is supported within the passage but not elaborated with a narrative
    of Indra’s actions.
