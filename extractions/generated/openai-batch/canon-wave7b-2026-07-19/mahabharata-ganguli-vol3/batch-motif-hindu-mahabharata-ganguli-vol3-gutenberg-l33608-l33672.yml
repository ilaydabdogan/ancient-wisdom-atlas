canonical_text:
  quote: ''
  summary: 'Bhishma instructs Yudhishthira on righteous conquest and royal conduct:
    a king should not seek victory by unrighteous or deceitful means, should spare
    surrendered or disarmed foes, should regulate captivity and spoils, should honor
    Brahmanas and mediators, should conciliate conquered subjects, and should follow
    precedents of righteous kings rather than exploit sacred or civilian resources
    improperly.'
  language: English
  quote_policy: summarized
