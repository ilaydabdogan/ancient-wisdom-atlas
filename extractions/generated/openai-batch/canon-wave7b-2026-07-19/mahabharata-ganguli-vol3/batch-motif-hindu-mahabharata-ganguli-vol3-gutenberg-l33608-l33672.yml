  claim: 'The passage explicitly aligns earthly royal success with Indra’s sovereignty:
    the same righteous behavior is said to have given Indra world sovereignty and
    to give earthly kings the status of Indra.'
  claim_level: same_function
  target: Indra as divine model of sovereignty for earthly kings
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only a brief comparative statement and does not narrate
    Indra’s conduct or provide a separate mythic episode for detailed comparison.
