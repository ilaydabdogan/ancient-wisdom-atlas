canonical_text:
  quote: ''
  summary: Bhishma narrates how Gautama is received by the Rakshasa king Virupaksha,
    identifies his residence and wife, and is included in a sacred Kartika feast for
    Brahmanas. Virupaksha ritually honors a thousand Brahmanas, feeds them, gives
    them wealth and golden vessels, and protects them from Rakshasas for the day.
    Gautama departs with heavy gold, rests under a banian tree, is welcomed and fed
    by the crane Rajadharman, and then thinks of killing the crane for provisions
    because of his long journey and lack of food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gautama is led into a spacious apartment, introduced to the king of the Rakshasas,
    worshipped, seated, and questioned about birth, practices, Vedic study, and Brahmacharya
    observance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gautama answers only with his name and race, and the king observes that he
    lacks Brahmanic splendour and Vedic studies.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Rakshasa asks Gautama about his residence and wife; Gautama says he is
    from the Middle country, lives in a hunters' village, and has married a Sudra
    widow.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The king reflects that Gautama is a Brahmana by birth, a friend of Rajadharman,
    and a guest on a sacred Kartika day, and decides to entertain him and give him
    wealth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A thousand learned Brahmanas arrive at the palace purified by baths, adorned,
    and dressed in linen robes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Virupaksha receives the Brahmanas according to rite, has skins and Kusa-grass
    mats spread for them, and worships them with sesame seeds, green grass, and water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Some Brahmanas are selected to represent the Viswedevas, the Pitris, and the
    deities of fire; they are anointed with sandal-paste, offered flowers, and served
    food in polished gold plates.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Virupaksha is described as regularly giving food and wealth to Brahmanas at
    full-moon observances, especially in Kartika, including metals, jewels, gems,
    pearls, diamonds, lapis lazuli, and animal skins.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Virupaksha tells the Brahmanas to take as many jewels and gems as they can
    carry and to take the gold plates and vessels used for dinner.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Virupaksha restrains the Rakshasas present and tells the Brahmanas that they
    need not fear the Rakshasas for that one day.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Brahmanas leave quickly in all directions with wealth, and Gautama also
    leaves after taking a heavy quantity of gold.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: Gautama carries the heavy gold with difficulty to the same banian tree and
    sits there fatigued, toil-worn, and hungry.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Rajadharman, described as a best or prince of cranes, comes to Gautama, welcomes
    him, fans him with his wings, worships him, and arranges food for him.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: After eating, Gautama thinks that his gold load is heavy, his road is long,
    and he has no food for the journey.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: Gautama then conceives the thought of killing and bagging the large crane
    beside him as a source of flesh before departing.
  category: action
  evidence_refs:
  - ev:11
