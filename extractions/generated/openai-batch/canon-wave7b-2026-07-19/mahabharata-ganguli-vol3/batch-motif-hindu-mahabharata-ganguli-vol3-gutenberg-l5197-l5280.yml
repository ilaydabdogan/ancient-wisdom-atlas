canonical_text:
  quote: ''
  summary: Sanjaya narrates that Arjuna, with Krishna as his driver, advances to battle
    on a primeval divine car. Shalya points out the advancing car to Karna, describes
    fearful omens and martial signs, identifies Arjuna and Krishna by their banners,
    weapons, and white steeds, and predicts mass slaughter. The passage then describes
    Arjuna and the Pandava forces killing warriors, horses, elephants, and car-warriors,
    while Arjuna is partly hidden amid battle and dust.
  language: English
  quote_policy: summarized
