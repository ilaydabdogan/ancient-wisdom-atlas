canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma what good one should pursue while Time advances
    fearfully. Bhishma introduces an old discourse between a father devoted to Vedic
    observance and his son Medhavin, who is conversant with emancipation. The son
    asks what an intelligent person should do when human life runs away quickly. The
    father recommends the ordered sequence of Vedic study, offspring, sacred fire
    and sacrifices, forest retirement, and final renunciation. The son challenges
    this calm sequence by describing the world as besieged and struck by irresistible
    bolts, and the father asks him to explain.
  language: English
  quote_policy: summarized
