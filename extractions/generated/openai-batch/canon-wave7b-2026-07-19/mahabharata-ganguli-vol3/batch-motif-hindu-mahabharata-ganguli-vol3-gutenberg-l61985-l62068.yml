canonical_text:
  quote: "“Rudra is Narayana. Both are one; and one is displayed in two different
    forms.”"
  summary: The speaker tells Arjuna that many divine names appear in Vedic and related
    scriptures and explains names tied to acts. Narayana/Aniruddha is described as
    the cosmic source; Brahma arises through grace and Rudra through wrath. Brahma
    and Rudra create and destroy as instruments of Aniruddha. Rudra’s ascetic and
    destructive attributes are listed, and Rudra and Narayana are declared one in
    two forms. The speaker describes worship of Rudra, worship of Vishnu/Narayana,
    and four classes of worshippers, praising those devoted to realizing the self.
  language: English
  quote_policy: quoted
