canonical_text:
  quote: ''
  summary: A blessing is pronounced for those who bathe in a well. The Sarasvati appears
    in the well and raises Trita, who worships heavenly beings and receives the gods'
    approval. Trita then curses his two Rishi brothers for deserting him out of covetousness,
    causing their transformation into wolves and assigning animal forms to their offspring.
    Valadeva visits the waters of Udapana, gives wealth, worships Brahmanas, and proceeds
    to Vinasana on the Sarasvati.
  language: English
