canonical_text:
  quote: ''
  summary: At night in a Chandala hamlet, the starving sage Viswamitra is detected
    while trying to take a haunch of dog meat. The Chandala reveres him but warns
    that the act would be theft, ritually unclean, and destructive of righteousness.
    Viswamitra argues that extreme hunger and the need to preserve life justify eating
    otherwise forbidden food, invoking Fire/Agni and the precedent of Agastya eating
    Vatapi. The dialogue continues as a dispute over emergency action, purity, and
    duty.
  language: English
  quote_policy: summarized
