canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma how Vritra, though an Asura devoted to Vishnu
    and endowed with knowledge, was defeated by Indra. Bhishma narrates Indra's confrontation
    with the mountain-like Vritra, a terrifying battle witnessed by divine and semi-divine
    beings, Vritra's use of rocks and illusion, Vasishtha's restoration and exhortation
    of Indra, and further divine aid through Siva's fever-like energy and Vishnu entering
    Indra's thunderbolt.
  language: English
  quote_policy: summarized
