canonical_text:
  quote: ''
  summary: Saunaka asks Sauti to explain how Narayana can be connected with sacrifice
    while also ordaining the religion of abstention. Sauti frames the question through
    an earlier exchange between Janamejaya and Vaisampayana. Janamejaya contrasts
    prosperity-producing ritual action with emancipation as cessation of existence
    and entry into the divine, then asks why gods receive sacrificial shares and to
    whom they themselves make offerings.
  language: English
  quote_policy: summarized
