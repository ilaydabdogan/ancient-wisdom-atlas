canonical_text:
  quote: '"How then hast thou been able to possess my heart?"'
  summary: Yudhishthira asks Bhishma whose wealth belongs under royal authority and
    what conduct a king should follow. Bhishma answers with a rule about royal responsibility,
    especially toward Brahmanas, and cites an old narrative in which a Kaikeya king,
    seized by a Rakshasa in the woods, lists the righteous order of his kingdom and
    his own conduct while repeatedly asking how the Rakshasa could possess him.
  language: English
  quote_policy: quoted
