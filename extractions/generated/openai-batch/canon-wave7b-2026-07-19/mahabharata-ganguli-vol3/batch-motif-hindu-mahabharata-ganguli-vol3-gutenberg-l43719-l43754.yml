canonical_text:
  quote: Time is not the ruler there. That supreme region is the ruler of Time as
    also of Heaven.
  summary: Yudhishthira asks Bhishma what hell a Reciter obtains. Bhishma answers
    by contrasting celestial regions, vehicles, mansions, gardens, and divine realms
    with the region of the Supreme Soul, saying that all other regions are called
    hell in comparison. He describes the supreme region as beyond fear, pain, duality,
    attributes, ordinary knowledge distinctions, and the rule of Time. A Reciter identified
    with the Soul goes there and no longer feels sorrow.
  language: English
  quote_policy: quoted
