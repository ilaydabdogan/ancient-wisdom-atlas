canonical_text:
  quote: Rivers of rapid currents flowed in opposite directions.
  summary: Bhimasena anticipates Duryodhana's upward maneuver and hurls his mace at
    Duryodhana's thighs, breaking them and causing him to fall. The fall is accompanied
    by violent winds, dust, earth tremors, meteors, bloody showers, terrifying sounds
    and beings, disturbed animals and warriors, waters producing blood, reversed rivers,
    perceived gender inversion, anxiety among the Pandavas and Pancalas, and the departure
    of celestial observers who discuss and applaud the battle.
