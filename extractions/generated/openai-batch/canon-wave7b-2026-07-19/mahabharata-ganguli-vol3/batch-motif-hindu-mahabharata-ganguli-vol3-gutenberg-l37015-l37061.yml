canonical_text:
  quote: ''
  summary: Yudhishthira asks what a weakened, fearful, impoverished, and invaded king
    should do. Bhishma advises making peace with a righteous invader, conceding territory
    if necessary to a strong unrighteous invader, abandoning capital and possessions
    if peace is impossible, and preserving the king's own life. In a further crisis,
    Bhishma advises peace with a righteous enemy or valour against an unrighteous
    one, adding that death in battle leads to heaven and companionship with Indra,
    while victory brings enjoyment of the earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yudhishthira asks about a king who is weak, procrastinating, fearful, unable
    to keep counsel, deprived of wealth, opposed by foes, and weakened by disunion
    among ministers and loss of army.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma says that if the invading enemy is pure-hearted and understands morality
    and profit, the threatened king should quickly make peace and restore conquered
    parts of the kingdom.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bhishma says that if the invading enemy is strong, sinful, and seeks victory
    by unrighteous means, the king should still make peace by abandoning part of his
    territories.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bhishma says that if the invader will not make peace, the king should abandon
    his capital and possessions to escape danger and preserve his life.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bhishma says the king should protect the ladies of his household, but if they
    fall into enemy hands he should not risk his own arrest in attempting to deliver
    them, and should not surrender himself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Yudhishthira asks what a king should do when his own people are dissatisfied,
    invaders oppress him, his treasury is exhausted, and his counsels are divulged.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bhishma answers that under those circumstances the king should seek peace
    with a righteous enemy, but should put forth valour against an unrighteous enemy.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Bhishma says the king should try to make the foe withdraw, or should fight
    bravely, lay down his life, and ascend to heaven.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bhishma says a small loyal, cheerful, and devoted force can conquer the whole
    earth; if the king is slain in battle he ascends to heaven, if he slays his enemies
    he enjoys the earth, and by laying down life in battle he obtains the companionship
    of Indra.
  category: sequence
  evidence_refs:
  - ev:6
