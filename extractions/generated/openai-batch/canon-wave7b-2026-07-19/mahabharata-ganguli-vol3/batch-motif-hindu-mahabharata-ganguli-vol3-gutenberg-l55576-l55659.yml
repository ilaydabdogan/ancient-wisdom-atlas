canonical_text:
  quote: ''
  summary: Parasara teaches that detachment, knowledge, non-harm, righteousness, association
    with purified persons, and Yoga lead toward happiness, heaven, and emancipation.
    He contrasts the wise, unattached person with the sense-attached person, explains
    karmic consequence, and uses images such as water on a lotus leaf, a dyke across
    a river, a gem drawing sun rays, a fish drawn by bait, a weak boat in the world-ocean,
    a wheel of birth and death, and the soul casting off the mind like a lotus stalk
    leaving mire.
  language: English
  quote_policy: summarized
