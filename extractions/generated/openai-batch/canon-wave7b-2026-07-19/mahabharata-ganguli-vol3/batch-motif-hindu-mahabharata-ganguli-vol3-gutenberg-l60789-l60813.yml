canonical_text:
  quote: ''
  summary: Narayana tells the Rishis that their treatise will be acquired by King
    Vasu/Uparichara through Vrihaspati, will guide the king's religious conduct, and
    will bring greatness, prosperity, and progeny, but will disappear after the king's
    death. Narayana then leaves invisibly. The Rishis promulgate the treatise and
    later charge Vrihaspati, born in Angiras's line in the Krita age, with promulgating
    it further before withdrawing to penance.
  language: English
