canonical_text:
  quote: ''
  summary: After a twelve-year drought, Rishis who had lost Vedic knowledge find Sarasvata
    reading the Vedas, become his disciples despite his youth, and receive the Vedas
    from him. The narrative then turns to a tirtha associated with Kuni-Garga's daughter,
    an unmarried ascetic woman who trades half her penances for a one-night marriage
    to Sringavat, becomes youthful and celestial on the marriage night, declares a
    merit-giving tirtha observance, and departs for heaven; Sringavat later follows
    her after death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A twelve-year drought had passed, and wandering hungry Rishis had lost knowledge
    of the Vedas.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Someone found Sarasvata reading the Vedas with concentrated attention in a
    solitary forest and reported this to the Rishis.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Rishis asked Sarasvata to teach them, and Sarasvata required them to become
    his disciples properly.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sarasvata stated that greatness among Rishis depends on the capacity to read
    and understand the Vedas rather than age, wealth, decrepitude, or kinship number.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sixty thousand munis became disciples of Sarasvata, received their Vedas from
    him, and each brought a handful of grass for his seat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The son of Rohini and elder brother of Keshava gave away wealth at that tirtha
    and then went to another place associated with an old unmarried lady.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Janamejaya asked why the maiden had undertaken ascetic penances, what her
    reason was, and what vow she observed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kuni-Garga, a famous ascetic Rishi, created a fair-browed daughter by an act
    of will, rejoiced on seeing her, then abandoned his body and went to heaven.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kuni-Garga's daughter performed severe penances, fasted, worshipped the pitris
    and gods, and did not wish for marriage because she saw no husband worthy of her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After long austerities and old age, she could no longer move unaided and set
    her heart on departing for the other world.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Narada told her that despite great austerities she had no blessed regions
    to obtain because she had not cleansed herself by the rite of marriage.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The old lady announced that she would give half her penances to a man who
    would accept her hand in marriage.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Sringavat, Galava's son, accepted her hand on the condition that she live
    with him for only one night, and she agreed.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Sringavat married her according to ordinance after libations were poured on
    the fire.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: On the marriage night, she became a young woman with celestial attire, ornaments,
    garlands, unguents, and perfumes.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:16
  text: At morning she said the compact had been fulfilled, received permission to
    leave, declared a tirtha observance involving one night and water oblations, and
    departed for heaven.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: Sringavat became sorrowful while remembering her beauty, accepted half her
    penances with difficulty because of the compact, cast off his body, and followed
    her.
  category: sequence
  evidence_refs:
  - ev:11
