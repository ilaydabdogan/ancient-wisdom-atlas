canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma to explain the origin of Fever, which had stupefied
    Vritra before Vasava slew him. Bhishma begins with a description of Mahadeva dwelling
    on the Savitri summit of Meru with Uma, surrounded by gods, sages, attendants,
    Ganga, Nandi, and fierce beings. Daksha begins a horse-sacrifice, and the gods
    depart for it. Uma asks why Mahadeva does not go; he explains that an old arrangement
    gives him no share in sacrificial offerings, and Uma grieves at this exclusion.
  language: English
  quote_policy: summarized
