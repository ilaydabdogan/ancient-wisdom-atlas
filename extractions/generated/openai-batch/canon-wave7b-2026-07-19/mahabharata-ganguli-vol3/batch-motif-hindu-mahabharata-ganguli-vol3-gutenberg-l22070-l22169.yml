canonical_text:
  quote: ''
  summary: Drona's son describes the protective power of his gem but says he cannot
    withdraw the fatal weapon he has released. Under Vyasa's direction, he sends it
    into the wombs of the Pandava women. Krishna declares that the weapon will strike
    the foetus in Virata's daughter's womb, that the foetus will die and live again
    as Parikshit, and that Parikshit will become king of the Kurus. Krishna curses
    Drona's son to wander diseased and alone for 3,000 years. Drona's son surrenders
    his gem and goes to the forest. The Pandavas bring the gem to the grieving Draupadi,
    and Bhima gives it to her while saying the slayer of her sons has been vanquished.
  language: English
  quote_policy: summarized
