canonical_text:
  quote: ''
  summary: 'Janaka asks Vasishtha to explain the unity and multiplicity of Akshara
    and Kshara, the Soul, knowledge and ignorance, Jiva-soul, and the Sankhya and
    Yoga systems. Vasishtha answers by describing Yoga: contemplation, concentration
    of mind, pranayama, withdrawal of the senses, purity, control of passions, abstemiousness,
    motionless posture, union of the Jiva-soul with a transcendent principle, union
    with Brahma, and the Yogin''s vision of the Supreme Soul as light or fire beyond
    darkness.'
  language: English
  quote_policy: summarized
