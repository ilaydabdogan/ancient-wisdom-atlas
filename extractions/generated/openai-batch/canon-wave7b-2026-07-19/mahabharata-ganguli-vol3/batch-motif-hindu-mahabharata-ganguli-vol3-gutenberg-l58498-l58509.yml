  summary: A speaker advises that one seeking success should approach certain parties
    with sincerity and candour rather than deceit, then asks the addressee to state
    birth order, learning, conduct, disposition, nature, and purpose. Bhishma narrates
    that Sulabha, though rebuked by the king, remains unashamed and prepares an eloquent
    reply.
