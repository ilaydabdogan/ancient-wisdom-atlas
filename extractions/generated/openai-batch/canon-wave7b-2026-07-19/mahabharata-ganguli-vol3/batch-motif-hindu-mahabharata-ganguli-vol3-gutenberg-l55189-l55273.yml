canonical_text:
  quote: ''
  summary: Parasara tells a king that domestic attachment to possessions and family
    can produce cupidity, wrongful action, grief, and destruction. Loss and suffering
    may awaken the soul, leading to scriptural study and recognition of penance. Penance
    is described as available to all, as a route to heaven, as the means by which
    divine and human beings have attained success, and as the source of worldly prosperity
    when rightly practiced. The passage contrasts stainless penance with penance pursued
    for fruits and warns that cupidity destroys wisdom and discrimination.
  language: English
  quote_policy: summarized
