canonical_text:
  quote: ''
  summary: A speaker instructs a king on rules of sin, impurity, fallenness, and expiation.
    The passage lists exceptions to sinful falsehood, cases where useful or valuable
    things remain acceptable despite low or impure sources, grave sins for which death
    is the stated expiation, social rules for avoiding fallen persons, afterlife penalties
    for harming Brahmanas, and prescribed penances involving fire, death, ascetic
    wandering, sacrifices, and gifts of cattle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker addresses a king and describes how certain sins may be cleansed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Five kinds of falsehood are described as not sinful: those spoken in jest,
    to a woman, on a marriage occasion, for the benefit of a preceptor, or to save
    one''s own life.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Useful knowledge, gold, a wife, amrita, women, jewels, valuables, and water
    are described as acceptable or not impure even when connected with low, vile,
    poisonous, or unclean sources.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A Vaisya may take up weapons for safety in stated circumstances involving
    Brahmanas, kine, or caste transfusion.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Drinking alcoholic liquor, killing a Brahmana, violating the preceptor's bed,
    stealing gold, and stealing a Brahmana's property are presented as grave sins
    whose stated expiation is death when committed consciously.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Association with a fallen person can make one fallen in some activities, while
    riding in the same vehicle, sitting on the same seat, or eating in the same line
    is said not to do so.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Virtuous persons are instructed not to speak with sinners until the sinners
    perform expiation, and sin is said to be destroyed by later virtuous action and
    penances.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Slandering, striking, or killing a Brahmana is connected with long periods
    of infamy or hell; a weapon wound is measured by the grains of dust soaked by
    the blood.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Foeticide, liquor drinking, and violation of the preceptor's bed are each
    assigned severe expiations involving battle death, blazing fire, hot alcohol,
    a heated iron female figure, self-mutilation, or death for the sake of a Brahmana.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The slayer of a Brahmana is told to observe Brahmacharya for twelve years,
    practice penance, wander holding the skull of the slain, and proclaim the sin
    publicly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sacrifices and gifts of cattle are prescribed for some offenses, including
    drinking liquor and killing a Vaisya, Sudra, dog, bear, or camel.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
