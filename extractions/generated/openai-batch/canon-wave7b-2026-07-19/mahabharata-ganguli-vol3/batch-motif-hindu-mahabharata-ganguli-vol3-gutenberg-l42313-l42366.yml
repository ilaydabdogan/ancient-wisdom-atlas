canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma whether gifts, sacrifices, penances, and duties
    to preceptors produce wisdom and high felicity. Bhishma replies that desire, wrath,
    and sin lead to painful regions and unhappy rebirths, while virtue, faith, self-control,
    reverence, and charity lead to fortunate birth, heaven, and a happy path. He describes
    the consequences of past acts as inevitably following the actor like a shadow
    and ripening at the proper time, even across birth, life stages, and death. He
    also says repentance, penance, forest austerity, and knowledge cleanse sin and
    lead to wisdom and felicity.
  language: English
  quote_policy: summarized
