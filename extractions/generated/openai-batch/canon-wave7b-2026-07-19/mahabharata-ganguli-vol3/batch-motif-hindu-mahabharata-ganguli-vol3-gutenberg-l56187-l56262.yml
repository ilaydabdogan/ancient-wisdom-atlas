canonical_text:
  quote: Wisdom constitutes the raft for crossing it.
  summary: 'Bhishma describes Sankhya teaching: bodily faults are conquered through
    discipline and knowledge; wise renouncers cross the metaphorical Ocean of life
    and, after transcending the gross body, are conveyed through cosmic stages by
    Surya, wind, space, Rajas, Sattwa, and Narayana to the Supreme Soul, attaining
    immortality without return.'
  language: English
  quote_policy: quoted
