canonical_text:
  quote: ''
  summary: Bhishma narrates how Vritra, overtaken by fever born of Mahadeva's energy,
    displays fiery and ominous bodily signs. Indra strikes the yawning Vritra with
    the thunderbolt and kills him. The embodied sin of Brahmanicide emerges from Vritra's
    body, pursues and clings to Indra, who hides in a lotus-stalk and later seeks
    Brahman's help. Brahman persuades Brahmanicide to leave Indra by appointing her
    an abode, then summons Agni and orders him to take a fourth portion of the sin,
    with the condition that this portion will pass to a person who neglects offerings
    to blazing fire.
  language: English
  quote_policy: summarized
