canonical_text:
  quote: ''
  summary: Kapila praises renunciant Yatis who, through self-restraint, tranquillity,
    and knowledge, attain Brahma and become free from grief, sin, want, and opposites.
    Syumarasmi replies by defending the domestic mode of life as the root of other
    life-stages, procreation, sacrifice, penance, sustenance, Vedic rites, after-death
    rituals, debts to ancestors, sages, and gods, and the sacrificial path to high
    regions and Brahma.
  language: English
  quote_policy: summarized
literal_observations:
