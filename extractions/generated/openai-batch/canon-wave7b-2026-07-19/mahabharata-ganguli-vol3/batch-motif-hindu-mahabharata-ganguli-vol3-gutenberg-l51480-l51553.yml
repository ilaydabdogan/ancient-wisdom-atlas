  evidence_refs:
  - ev:1
- id: obs:2
  text: Kapila describes the Yatis as unobstructed, free from pairs of opposites,
    want, sin, and grief, devoted to Brahma, and possessing eternal acquisitions.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kapila asks what need there is for the duties of domestic life if the high
    end of the Yatis is attainable.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Syumarasmi says the domestic mode is important because the other modes of
    life depend on it, as living creatures depend on their mothers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Syumarasmi states that the householder performs sacrifices and penances and
    that procreation of offspring is possible only in domestic life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Syumarasmi says grasses, straw, plants, herbs, corn-bearing growths, and other
    growths on hills and mountains have the domestic mode for their root, and living
    creatures depend on them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Syumarasmi says Vedic mantras are necessary for regenerate classes in acts
    concerning this world and the other world.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Syumarasmi lists after-death rites involving cremation, attainment of a second
    body, food and drink after that attainment, giving kine and other animals to help
    cross the river to Yama, and sinking funeral cakes in water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Syumarasmi says three classes of Pitris approve the necessity of mantras for
    the dead, and that humans owe debts to the Pitris, Rishis, and gods.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Syumarasmi says a Brahmana who performs Vedic sacrifices is not seduced by
    sin and attains high regions of felicity along with the animals slain in sacrifice.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Syumarasmi says one attains Brahma by practising rites laid down in the Vedas,
    not by disregarding the Vedas, guile, or deception.
  category: speech
  evidence_refs:
  - ev:7
