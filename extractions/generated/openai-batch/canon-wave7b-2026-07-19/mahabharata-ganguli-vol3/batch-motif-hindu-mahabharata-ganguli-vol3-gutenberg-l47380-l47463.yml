canonical_text:
  quote: '"I attach myself steadfastly to those that are devoted to the duties of
    their own order..."'
  summary: 'Sree states that she attaches herself to people devoted to duty, patience,
    heavenly conduct, liberality, scripture, sacrifice, rites, and proper worship.
    She recalls that the Danavas formerly practiced ritual purity, truth, charity,
    restraint, compassion, reverence, and disciplined household order, so she dwelt
    with them for many yugas. Later their character changed: virtue and morality deserted
    them, lust and wrath prevailed, social hierarchy was inverted, offerings and hospitality
    were neglected, and food and ritual substances were left impure or exposed.'
  language: English
  quote_policy: quoted
