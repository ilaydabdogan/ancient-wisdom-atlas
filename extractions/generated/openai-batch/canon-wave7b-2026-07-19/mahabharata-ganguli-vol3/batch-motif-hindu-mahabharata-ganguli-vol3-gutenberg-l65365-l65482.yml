  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The notes explain that a mysterious influence connected with beholding the
    king's amiable face causes people to render homage to him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Eloquent Brahmanas learned in scripture are called heroes of speech, while
    great Kshatriya kings are called heroes of exertion.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Ritwija is described as engaged on special occasions, while a Purohita provides
    permanent and constant services.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Paka-yajna is described as a minor sacrifice, and a Purnapatra is described
    as a large dish or basket full of rice; for a Sudra, sacrificial gift-giving is
    limited to a Purnapatra, and in one ordinance Purnapatras are substituted for
    animals.
  category: object
  evidence_refs:
  - ev:6
