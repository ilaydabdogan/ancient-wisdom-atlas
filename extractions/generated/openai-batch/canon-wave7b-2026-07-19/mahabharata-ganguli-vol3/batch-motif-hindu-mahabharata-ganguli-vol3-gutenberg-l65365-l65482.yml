  text: Humans pour clarified butter into sacrificial fires, thereby feeding the gods;
    the gods, fed by those offerings, pour rain on earth, from which humans obtain
    sustenance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The notes state that without royal protection the world comes to grief, and
