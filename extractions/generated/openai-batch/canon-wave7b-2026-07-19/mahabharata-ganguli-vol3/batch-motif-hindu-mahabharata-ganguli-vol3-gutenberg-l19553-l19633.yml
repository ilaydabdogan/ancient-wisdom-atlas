  quote: '"Do not crush his head with thy foot! Do not act sinfully!"'
  summary: Sanjaya narrates Duryodhana fallen in battle. Bhimasena exults, recalls
    past insults against Draupadi and the Pandavas, and places his left foot on Duryodhana's
    head. Some Somaka warriors disapprove. Yudhishthira rebukes Bhima for insulting
    a fallen king and kinsman, then laments to Duryodhana that the calamity has arisen
    from former acts, fault, and Destiny. Dhritarashtra asks what Baladeva, expert
    in mace combat, said after seeing Duryodhana struck down unfairly.
