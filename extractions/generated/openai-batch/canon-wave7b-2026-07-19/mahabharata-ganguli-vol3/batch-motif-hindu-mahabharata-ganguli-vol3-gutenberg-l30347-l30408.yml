canonical_text:
  quote: All duties have kingly duties for their foremost.
  summary: A speaker instructs the son of Pandu about duties in the four modes of
    life, especially rules for Sudras, Vaisyas, and Kshatriyas entering mendicant
    or ascetic life. The passage emphasizes that Kshatriya or kingly duties protect
    and encompass the duties of other orders and warns that without the science of
    chastisement, the Vedas, scriptures, and life-mode duties would be lost.
  language: English
