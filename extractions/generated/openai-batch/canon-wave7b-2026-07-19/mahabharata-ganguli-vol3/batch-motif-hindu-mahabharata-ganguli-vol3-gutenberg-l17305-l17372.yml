canonical_text:
  quote: ''
  summary: 'Vaishampayana recounts deeds associated with a Sarasvati tirtha: Arshtishena
    gains Vedic mastery through severe penance and grants boons to the place; several
    figures attain Brahmanhood there through austerities; Gadhi installs Vishvamitra
    as king and goes to heaven; Vishvamitra''s army damages Vasishtha''s asylum, where
    Vasishtha''s cow creates Savaras who rout the army; Vishvamitra then performs
    extreme austerities and receives Brahma''s boon to become a Brahmana. Rama gives
    gifts to Brahmanas and proceeds toward Vaka''s asylum.'
  language: English
  quote_policy: summarized
