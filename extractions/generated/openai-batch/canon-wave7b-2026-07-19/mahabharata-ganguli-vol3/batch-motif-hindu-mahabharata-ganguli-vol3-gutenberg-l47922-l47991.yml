canonical_text:
  quote: ''
  summary: The passage states that created things, forms, actions, and names originate
    in the Vedas, and that Brahman creates from Vedic words and prior prototypes.
    It describes scriptural and ascetic means toward emancipation, the overcoming
    of duality, the relation of sound-Brahma to supreme Brahma, order-specific sacrifices,
    the changing condition of sacrifice and Vedic authority across the yugas, seasonal
    analogies for the arising and recurrence of observances and attributes, and Time
    as beginningless, endless, creative, consuming, and sustaining.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Created things, varieties of form, and the course of actions are said to originate
    in the Vedas; the Supreme Master creates from the words of the Vedas.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the dawn after his night, the uncreate Brahman creates all things from
    prototypes that existed before.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Vedas are said to indicate the Soul's Emancipation and means including
    Vedic study, domestic life, penances, common duties, sacrifices, meritorious acts,
    meditation, and Siddhi attainable in life.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Brahma declared in the Vedas and clarified in the Upanishads can be realized
    by gradually following the named practices.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Consciousness of duality and pairs of opposites is said to arise from acts,
    to cease in dreamless sleep or emancipation, and to be driven off by knowledge.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Two Brahmas are named: one represented by sound, identified with the Vedas,
    and a supreme Brahma beyond the Vedas; conversance with the former leads to the
    latter.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Different sacrifices are assigned to Kshatriyas, Vaisyas, Sudras, and Brahmanas.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'The need for and condition of sacrifices changes across the yugas: unnecessary
    in Krita, necessary in Treta, and declining in Dwapara and Kali.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In Treta, mighty men are said to sway mobile and immobile objects and compel
    the practice of righteousness; in that age Vedas, sacrifices, orders, and modes
    of life exist in a compact state.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In Kali, the Vedas become scarce and, afflicted by iniquity, suffer extermination
    along with their rites and sacrifices.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Krita-age righteousness is said to remain visible in Brahmanas of cleansed
    souls devoted to penances and study of scriptures.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Men observant of their orders and the Vedas are led by scriptural authority
    to sacrifices, vows, and pilgrimages to sacred waters and spots.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The emergence of new religious duties in each yuga is compared to rain showers
    causing new immobile life to arise.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The reappearance of attributes at each new Creation is compared to the reappearance
    of phenomena with the seasons.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Time is described as beginningless and endless, as ordaining variety, creating
    and swallowing all creatures, serving as their refuge, assuming their shapes,
