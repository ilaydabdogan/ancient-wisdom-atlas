canonical_text:
  quote: ''
  summary: 'A series of translator/commentator footnotes explains images and doctrinal
    points in the Mahabharata: sky-forms called Gandharva-nagara, the difficulty of
    determining righteousness, examples of revered figures with ambiguous conduct,
    a yogic body remaining in water while a subtle body travels, Jajali’s vow of wandering,
    a merchant’s shop and scales, the equality of creatures, divine manifestation
    in diverse forms, defective senses as closed doors, Brahma as a fearless state
    beyond return, the preservation of righteousness despite mixed conduct, and the
    roaring Vadava fire.'
  language: English
  quote_policy: summarized
