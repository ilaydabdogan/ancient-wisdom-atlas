canonical_text:
  quote: ''
  summary: 'Yudhishthira asks how one may win the hearts of both friends and foes
    when kinsmen cannot be won over. Bhishma answers by recounting an old discourse
    in which Vasudeva tells Narada of distress caused by factional kinsmen and asks
    for counsel. Narada identifies the crisis as internal, warns against attempting
    to reclaim wealth or kingdom because it could cause slaughter and destruction,
    and advises Vasudeva to use a non-steel weapon: food-giving, forgiveness, sincerity,
    mildness, honor, soft words, intelligence, restraint, and liberality. Narada urges
    Krishna to bear the burden of governing and to prevent the destruction of the
    Bhojas and Vrishnis.'
  language: English
  quote_policy: summarized
