canonical_text:
  quote: ''
  summary: 'Suka asks how to reconcile Vedic declarations that command acts and also
    renunciation of acts, and asks the destinations reached by knowledge and by acts.
    Bhishma reports the son of Parasara''s answer: he expounds two paths, destructible
    and indestructible, associated with acts and knowledge. Acts are described as
    leading to destruction, embodied rebirth, and mixed pleasure and pain, while knowledge
    is described as leading to emancipation, freedom from birth and death, and attainment
    of Brahma. The passage uses images of an ocean, water sources, the moon, and a
    drop of water on a lotus leaf to explain the contrast and the relation of Soul
    to body.'
  language: English
  quote_policy: summarized
