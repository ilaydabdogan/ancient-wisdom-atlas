canonical_text:
  quote: ''
  summary: Sanjaya narrates a fierce duel between Arjuna and Karna. Their arrows fill
    the sky and darken the battlefield, while warriors and celestial beings watch.
    Karna counters Arjuna's weapon with a powerful weapon obtained from Rama. The
    serpent Aswasena, hostile to Arjuna because of his mother's death at Khandava,
    rises from the lower region, enters Karna's quiver in arrow form, and becomes
    part of a blazing snake-mouthed shaft aimed at Arjuna's head. Shalya warns Karna
    that the arrow will not accomplish its purpose, but Karna refuses to aim another
    arrow and releases it.
  language: English
  quote_policy: summarized
