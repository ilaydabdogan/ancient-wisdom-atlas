canonical_text:
  quote: ''
  summary: Sanjaya describes Arjuna rescuing Bhima from the Kuru host, filling the
    sky with arrows and leaving the field covered with bodies, elephants, chariots,
    and broken weapons. After consulting Bhima and reporting that Yudhishthira is
    well, Arjuna proceeds again; guided by the slayer of Madhu, he is attacked by
    ten younger Kaurava sons and kills them with arrows.
  language: English
  quote_policy: summarized
