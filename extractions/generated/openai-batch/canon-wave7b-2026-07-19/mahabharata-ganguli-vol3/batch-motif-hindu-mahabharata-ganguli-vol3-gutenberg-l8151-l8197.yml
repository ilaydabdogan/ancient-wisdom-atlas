canonical_text:
  quote: ''
  summary: Vasudeva explains that Yudhishthira spoke harshly from fatigue, grief,
    and battle wounds, intending to provoke Arjuna against Karna. He counsels Arjuna
    to satisfy his vow without killing Yudhishthira by addressing the respected king
    disrespectfully as “thou,” since disrespect toward a superior is described as
    a form of death while still alive. Arjuna is then to honor Yudhishthira’s feet,
    restore his honor, avoid both falsehood and fratricide, and proceed to fight Karna.
    Sanjaya reports that Arjuna accepted the counsel and harshly addressed Yudhishthira.
  language: English
  quote_policy: summarized
