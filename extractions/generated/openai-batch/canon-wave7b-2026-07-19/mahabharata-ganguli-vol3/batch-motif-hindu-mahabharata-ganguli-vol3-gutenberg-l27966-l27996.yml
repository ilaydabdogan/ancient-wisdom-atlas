canonical_text:
  quote: They are gods on earth having poison in their speech, and are exceedingly
    easy to gratify.
  summary: Janardana addresses Yudhishthira, praises Brahmanas as powerful and worshipful,
    recounts how the Rakshasa Charvaka gained a broad boon of immunity from Brahman
    with a limitation concerning offenses against Brahmanas, and explains that Charvaka
    was destroyed by the Brahmanas' curse after insulting them. Janardana then urges
    Yudhishthira not to grieve for fallen Kshatriya kinsmen and to resume royal duties,
    protect subjects, and worship Brahmanas.
  language: English
  quote_policy: quoted
