canonical_text:
  quote: ''
  summary: Bhishma cites Janaka and Vodhya as examples in a teaching on tranquillity
    and freedom from attachment. Janaka declares that even the burning of Mithila
    would not cause him loss. Yayati asks the sage Vodhya about the understanding
    by which he wanders tranquilly. Vodhya names six preceptors—Pingala, an osprey,
    a snake, a forest bee, a shaft-maker, and a maiden—and Bhishma explains the lessons
    drawn from their conduct.
  language: English
  quote_policy: summarized
