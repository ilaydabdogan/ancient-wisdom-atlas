canonical_text:
  quote: The highest among them all is self-restraint.
  summary: Bhishma instructs Yudhishthira that self-restraint is the highest duty
    and virtue, defines it through a set of ethical qualities, contrasts the self-restrained
    and uncontrolled person, and describes self-restraint as a path to emancipation,
    Brahma, heaven, and a hidden eternal region. The passage ends with Yudhishthira
    gratified and asking Bhishma to continue.
  language: English
  quote_policy: quoted
