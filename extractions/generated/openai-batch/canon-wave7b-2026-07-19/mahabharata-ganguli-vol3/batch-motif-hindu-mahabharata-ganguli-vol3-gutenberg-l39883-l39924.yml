canonical_text:
  quote: a weak and foolish person, by provoking the enmity of a powerful one, is
    at last obliged to repent like the Salmali in fable.
  summary: Bhishma concludes a fable in which the Salmali tree cuts off its own branches,
    leaves, and flowers before the Wind arrives. The Wind says he would have done
    the same to the tree and that the tree has fallen under his power. Bhishma then
    draws a royal lesson about not provoking the powerful or intelligent, and applies
    the lesson to Arjuna’s defeat of Duryodhana’s troops.
