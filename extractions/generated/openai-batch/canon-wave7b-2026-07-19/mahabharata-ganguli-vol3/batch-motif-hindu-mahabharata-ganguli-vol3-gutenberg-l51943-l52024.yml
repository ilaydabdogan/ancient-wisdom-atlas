canonical_text:
  quote: ''
  summary: 'Yudhishthira asks Bhishma which of Religion, Profit, and Pleasure is superior.
    Bhishma answers with an ancient narrative: a poor Brahmana seeks wealth for sacrifices,
    worships deities unsuccessfully, then worships the Cloud Kundadhara. Kundadhara
    causes him to behold a divine assembly where Manibhadra and the gods distribute
    or remove wealth and kingdoms according to conduct. Offered wealth for the Brahmana,
    Kundadhara instead requests that the Brahmana become devoted to virtue. The boon
    is granted, and the Brahmana disregards costly fabrics, disrelishes the world,
    and resolves to go to the woods for righteousness.'
  language: English
  quote_policy: summarized
