canonical_text:
  quote: ''
  summary: Bhishma narrates that Gautama, a poor Brahmana seeking wealth, is welcomed
    by Rajadharman, a crane who identifies himself as Kasyapa's son. Rajadharman performs
    hospitality, feeds and rests him, declares friendship, and directs him to the
    Rakshasa king Virupaksha. Gautama travels through a shaded route to the fortified
    city Meruvraja and is summoned into Virupaksha's palace.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gautama hears Rajadharman's words, is filled with wonder and curiosity, and
    gazes at him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rajadharman identifies himself as the son of Kasyapa by one of Daksha's daughters
    and welcomes Gautama as his guest.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The crane offers hospitality according to scriptural rites, including a bed
    of Sala flowers, fishes from the Bhagirathi, and a blazing fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Gautama eats and is gratified, the bird fans him with his wings and
    gives him a soft bed of leaves perfumed with flowers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Rajadharman asks Gautama about his pedigree and then the cause of his arrival.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Gautama says he is a Brahmana named Gautama, is very poor, and wants to go
    to the sea to acquire wealth.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: Rajadharman cites four means of acquiring wealth and says he has become Gautama's
    friend and will help him succeed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the morning Rajadharman directs Gautama along a route to Virupaksha, a
    mighty Rakshasa king and his friend, who will give wealth at his request.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Gautama sets out cheerfully, eating sweet fruits and traveling through shade
    from sandal, aloe, and birch trees.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Gautama reaches Meruvraja, a fortified city with stone porches, high walls,
    a trench, rocks, and engines on the ramparts.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Virupaksha receives Gautama as a dear guest sent by his friend the crane and
    orders attendants to bring him from the gate.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: Messengers summon Gautama, and he runs with them into the Rakshasa king's
    palace, filled with wonder at the city's affluence.
  category: sequence
  evidence_refs:
