canonical_text:
  quote: ''
  summary: The gods construct a cosmic car for Sankara from elements of the three
    worlds. Deities, Earth, mountains, rivers, directions, stars, snakes, time divisions,
    ritual sounds, Vedic texts, and other cosmic and sacred entities become parts,
    protectors, or fittings of the car. Sankara equips it with weapons, a bull, a
    Year-bow, a Death-night bow-string, and an arrow formed from Vishnu, Agni, and
    Soma, then charges it with fierce wrath and calls Nila Rohita.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The gods say they will gather forms from the three worlds and construct a
    large, energetic car for the lord of the gods; the car is described as the handiwork
    of Viswakarman.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Vishnu, Soma, and Hutasana/Agni are made into an arrow: Agni is the staff,
    Soma the head, and Vishnu the point.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The goddess Earth, including her cities, towns, mountains, forests, islands,
    and creatures, is made the car.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mandara, Ganga, the directions, constellations, the Krita age, Vasuki, Himavat,
    Vindhya, Udaya, Asta, and the Ocean are each assigned as structural parts or ornaments
    of the car.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The seven Rishis protect the wheels; rivers and waters become binding chords;
    time divisions, seasons, planets, stars, Religion, Profit, Pleasure, herbs, and
    creepers become additional parts of the car.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Sun and Moon are made wheels; Day and Night are made wings; strong snakes
    form another shaft; the sky, clouds, twilights, personified qualities, and the
    firmament become yoke, strings, and coverings.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: World-regents are made the steeds; snakes bind the steeds' manes; directions
    become reins; Vashat, Gayatri, auspicious days, pitris, Action, truth, ascetic
    penances, profit, Mind, and Speech become fittings, ground, and tracks.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The car has banners, lightning, Indra's bow, a Year-bow, Savitri as bow-string,
    a gemmed coat of mail, Meru as flagstaff, and clouds as banners, and it shines
    like blazing fire.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The gods are filled with wonder when they see the energies of the entire universe
    united in one place, and they report that the car is ready.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Sankara places celestial weapons on the car, sets his bull upon a sky-flagstaff,
    and the car is guarded or accompanied by rods, Fever, Atharvan, Angirasa, Vedas,
    Puranas, histories, sacred speeches, sciences, hymns, Vashat, and Om.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: Sankara/Rudra uses the Year with six seasons as his bow, his shadow or Kala
    Ratri as its string, and Vishnu, Agni, and Soma as the arrow; the bow-string's
    touch is unbearable to the Asuras.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: Sankara casts fierce wrath, described as an unbearable fire of anger, onto
    the arrow and calls Nila Rohita, who is described as robed in skins, like ten
    thousand suns, shrouded by fiery energy, and blazing with splendour.
  category: action
  evidence_refs:
  - ev:11
