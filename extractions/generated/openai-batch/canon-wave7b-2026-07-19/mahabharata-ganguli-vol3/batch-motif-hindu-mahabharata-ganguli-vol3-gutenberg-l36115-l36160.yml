canonical_text:
  quote: ''
  summary: The passage describes the constitution of a kingdom through a body-and-limbs
    image, then presents Chastisement as a powerful limb and author of kingship, divinely
    sent or created for the Kshatriya and for the protection of the world. It distinguishes
    forms of Vyavahara, or legal procedure, rooted in disputes, the Veda, and family
    custom consistent with scripture. It equates Chastisement, Vyavahara, Veda, morality,
    duty, Righteousness, and ultimately Brahman, and concludes that no close relative
    or priest is exempt from punishment under a king who rules according to duty.
  language: English
  quote_policy: summarized
