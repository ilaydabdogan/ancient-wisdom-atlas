canonical_text:
  quote: '"This (the establishment of peace) is the high duty of kings; victory and
    defeat are both uncertain."'
  summary: A dispossessed Kshatriya rejects deceitful means of survival. A sage praises
    his righteousness and mediates an enduring union between him and King Janaka of
    Videha. The sage urges Janaka to trust and employ the prince rather than fight
    him, arguing that victory and defeat are uncertain and peace should be made with
    an enemy through provision and honour. Janaka accepts, honours the prince, brings
    him to Mithila, receives him with hospitality, and gives him his daughter, gems,
    and jewels.
  language: English
  quote_policy: quoted
