canonical_text:
  quote: ''
  summary: Sanatkumara arrives to dispel doubts and, at Usanas's request, teaches
    a Danava chief about Vishnu's greatness. He describes Vishnu as creator, withdrawer,
    source, refuge, and cosmic totality; explains attainment through sense-restraint
    and repeated purification; gives analogies of metal purified by fire and sesame
    perfumed by flowers; maps parts of the cosmos onto the divine body; states the
    unity of beings under one divine being; and illustrates the vast duration of a
    Kalpa by the slow drying of immense lakes with a hair-tip measure of water taken
    once per day.
  language: English
  quote_policy: summarized
