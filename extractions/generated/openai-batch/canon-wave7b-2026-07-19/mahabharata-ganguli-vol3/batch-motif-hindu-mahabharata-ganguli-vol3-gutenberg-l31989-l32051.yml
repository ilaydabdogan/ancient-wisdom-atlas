canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma about the proper conduct and qualifications of
    sacrificial priests and about Dakshina. Bhishma describes the virtues of eligible
    priests, insists that sacrifice requires truthfulness and Dakshina, discusses
    Purnapatra and Soma, and then defines penance as ethical conduct and an inward
    sacrifice using Yoga, the heart, and knowledge as ritual implements.
  language: English
  quote_policy: summarized
