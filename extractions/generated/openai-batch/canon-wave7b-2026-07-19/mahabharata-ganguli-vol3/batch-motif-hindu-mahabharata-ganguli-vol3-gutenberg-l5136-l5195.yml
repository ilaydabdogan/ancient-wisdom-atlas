canonical_text:
  quote: ''
  summary: 'Sanjaya describes the Kaurava battle array: named warriors and peoples
    occupy wings, Karna stands at the center/front, Duhshasana and Duryodhana occupy
    rear positions with elephant and cavalry support, and the formation advances with
    martial and divine similes. Yudhishthira sees Karna at the head of the hostile
    force, asks Arjuna to act so the enemy will not prevail, and Arjuna promises to
    destroy the enemy by slaying its foremost warriors. Yudhishthira then assigns
    named Pandava warriors to specific opponents.'
  language: English
  quote_policy: summarized
