canonical_text:
  quote: '"The withdrawal of the mind and the senses from all unworthy objects and
    their due concentration ... is the highest penance."'
  summary: Suka asks Vyasa to identify the highest duty. Vyasa teaches that restraining
    the senses and mind through understanding and Yoga leads to knowledge of the Supreme
    Soul, freedom from sin and attachment, crossing the river of life, and exemption
    from rebirth. He describes this knowledge as a mystery to be taught by a preceptor
    to a qualified son or disciple.
  language: English
  quote_policy: quoted
