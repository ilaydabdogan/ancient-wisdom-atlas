canonical_text:
  quote: ''
  summary: The passage catalogs the contents of a comprehensive treatise on statecraft,
    ethics, warfare, punishment, ritual, acquisition, and the aims of life. The divine
    Lord/Self-born/Brahman declares that he composed the science for the good of the
    world and that, because it governs through chastisement, rewards, and punishments,
    it will be called Dandaniti. Siva then studies and masters it and abridges it
    because human lifespans are diminishing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The work treats methods for afflicting an enemy kingdom, including robbers,
    wild tribes, fire-raisers, poisoners, forgers, disunion among enemy officers,
    crop destruction, elephant impairment, alarms, and winning over favorable subjects.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The work treats administrative and royal topics such as the seven requisites
    of sovereignty, justice, extermination of the wicked, military skills, gifts,
    storage, feeding, avoidance of heedlessness, and use of wealth for piety, desire,
    and relief from danger.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The passage lists ten fierce vices: four born of lust—hunting, gambling,
    drinking, and sexual indulgence—and six born of wrath, including rude speech,
    fierceness, severe chastisement, bodily pain, suicide, and frustrating one''s
    own aims.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The work describes machines, devastation of enemy territories, attacks, removal
    of landmarks, cutting down large trees, siege of forts, agriculture, storage of
    necessities, troop attire, and military sound instruments such as Panavas, Anakas,
    conchs, and drums.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The work includes six kinds of articles—gems, animals, lands, robes, female
    slaves, and gold—and discusses their acquisition for oneself and destruction to
    injure the foe.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The work covers pacification of new territories, honoring the good, friendship
    with the learned, gifts, religious rites, auspicious articles, adornment, food,
    truthful and sweet speech, public and household conduct, surveillance, punishment,
    protection of subjects, diplomacy, bodily protection, and local customs.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: Virtue, Profit, Pleasure, and Emancipation or Salvation are described in the
    work.
  category: other
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The work includes means of acquisition, agriculture and revenue, methods of
    producing and applying illusions, methods for fouling stagnant water, and means
