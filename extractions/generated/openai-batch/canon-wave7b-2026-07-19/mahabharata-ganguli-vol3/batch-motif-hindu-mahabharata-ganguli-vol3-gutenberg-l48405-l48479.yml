  quote: ''
  summary: Vyasa rejects doctrines that treat nature or things' own nature as the
    ultimate cause, praises wisdom as the means to beneficial results and the highest
    refuge, classifies beings in ascending orders, and identifies the renunciant knower
    of Brahma and the Soul as truly regenerate, godlike, and beyond birth and death.
  language: English
  quote_policy: summarized
