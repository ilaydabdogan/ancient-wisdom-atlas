canonical_text:
  quote: ''
  summary: Bhishma explains yoga meditation as a disciplined path followed by Rishis
    seeking Emancipation. The practitioner lives in solitude, restrains speech and
    senses, withdraws the five senses into the mind and intellect, repeatedly steadies
    the unstable mind, gradually gains control, experiences unmatched felicity, and
    attains Nirvana.
  language: English
  quote_policy: summarized
