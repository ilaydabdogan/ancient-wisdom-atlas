- id: obs:2
  text: Great Rishis obtain knowledge of yoga meditation, set their hearts on Emancipation,
    and are described as freed from rebirth and living in their original Soul-state.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The practitioner is instructed to live in places free from wives, children,
    disputes, and unsuitable companionship, and favorable to tranquillity of heart.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The practitioner restrains speech, sits like a piece of wood, crushes the
