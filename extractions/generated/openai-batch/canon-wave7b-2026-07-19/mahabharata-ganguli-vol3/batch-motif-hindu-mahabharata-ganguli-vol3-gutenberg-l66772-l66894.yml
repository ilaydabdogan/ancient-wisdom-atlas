canonical_text:
  quote: ''
  summary: 'Translator/editor footnotes explain readings and allusions in philosophical
    passages: Desire and qualities founded on Rajas and Tamas, universal love, renunciation
    of property, animal examples of bee and ajagara snake, the stories of Pingala
    and a maiden breaking noisy anklets, causeless Brahma or religious indifferentism,
    equanimity about birth and death, sacred giving and sacrifice, karmic rebirth,
    the unmarked path of the virtuous, and elemental cosmology involving fire, air,
    earth, water, space, Brahma, Rishis, and plant treatment.'
  language: English
  quote_policy: summarized
