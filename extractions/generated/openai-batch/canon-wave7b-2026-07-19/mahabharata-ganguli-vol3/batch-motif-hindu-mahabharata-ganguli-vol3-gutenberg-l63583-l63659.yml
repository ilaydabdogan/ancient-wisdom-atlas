canonical_text:
  quote: ''
  summary: The passage recounts the repeated revelation, transmission, disappearance,
    and return of a religion or cult associated with Narayana/Hari across cosmic periods.
    It describes Brahma’s births from an egg and from a lotus from Narayana’s navel,
    lists several chains of teachers and recipients, identifies Hari with cosmic and
    inner principles, praises desireless devotion, and frames the teaching as transmitted
    by Narada to Vyasa and then to Yudhishthira before Janamejaya asks a follow-up
    question.
  language: English
