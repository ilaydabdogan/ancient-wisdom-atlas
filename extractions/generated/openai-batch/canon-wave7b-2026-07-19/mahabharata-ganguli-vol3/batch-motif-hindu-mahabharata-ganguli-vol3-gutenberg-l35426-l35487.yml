canonical_text:
  quote: '"That man who endures the reproaches and slanders... never suffers any pain
    occasioned by speech."'
  summary: Yudhishthira asks Bhishma how a learned and modest person should behave
    when verbally attacked in an assembly by an ignorant and conceited person. Bhishma
    answers that the wise should endure abuse without wrath, avoid slanderers and
    back-biters, and not enter degrading verbal contests. He describes moral consequences
    for the abuser and uses several animal and impurity similes to characterize abusive
    speech.
  language: English
  quote_policy: quoted
