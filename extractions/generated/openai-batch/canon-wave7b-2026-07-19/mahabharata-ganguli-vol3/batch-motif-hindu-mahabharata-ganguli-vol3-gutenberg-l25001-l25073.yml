canonical_text:
  quote: ''
  summary: Bhimasena rebukes Yudhishthira for contemplating idleness or renunciation
    after the destruction of the Dhartarashtras. He argues that Kshatriyas should
    act according to their duty, that those obstructing sovereignty have been slain,
    and that Yudhishthira should govern the earth righteously. He supports the argument
    with analogies of effort abandoned before its reward and concludes that success
    requires action appropriate to one’s nature.
  language: English
  quote_policy: summarized
