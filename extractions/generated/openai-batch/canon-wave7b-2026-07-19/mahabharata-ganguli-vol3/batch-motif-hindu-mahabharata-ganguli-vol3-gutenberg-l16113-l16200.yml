canonical_text:
  quote: ''
  summary: Sanjaya reports that Yudhishthira challenges Duryodhana, who is within
    the waters of a lake, accusing him of hiding from battle and failing Kshatriya
    duty. Duryodhana replies that he entered the waters from fatigue after losing
    his chariot, weapons, drivers, and followers, not from fear, and says he will
    fight after resting. Yudhishthira renews the challenge, framing the outcome as
    kingdom or heroic death. Duryodhana laments the death of his kin and allies, describes
    the earth as desolate, and says he would rather retire to the woods in deer-skins
    than rule.
  language: English
  quote_policy: summarized
