canonical_text:
  quote: ''
  summary: Sanjaya reports Yudhishthira rebuking Duryodhana while Duryodhana remains
    within waters. Yudhishthira refuses to accept the earth as a gift, insists that
    rule should be settled by battle, recalls Duryodhana's earlier refusal to yield
    even minimal land, cites past wrongs against the Pandavas and Draupadi, and commands
    Duryodhana to rise and fight. Dhritarashtra asks Sanjaya how his proud son endured
    the taunts. Sanjaya says Duryodhana became miserable, sighed, waved his arms,
    set his heart on battle, and answered from the waters.
  language: English
  quote_policy: summarized
