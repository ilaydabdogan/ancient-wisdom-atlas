  summary: Krishna tells Partha to slay a hostile snake. Partha asks who the advancing
    snake is, comparing its movement toward him to going into Garuda's mouth. Krishna
    explains that when Partha was at Khandava gratifying Agni, he killed the snake's
    mother while the snake was inside her body; the snake now remembers that hostility
    and comes for Partha's destruction, like a blazing meteor falling from the sky.
