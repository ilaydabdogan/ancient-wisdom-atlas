canonical_text:
  quote: ''
  summary: 'In a dialogue between the mouse Palita and the trapped cat Lomasa, Palita
    proposes a compact: he will cut the cat free if the cat does not kill him and
    protects him from other predators. The cat accepts, asks for protection, and promises
    obedience, friendship, and future gratitude. Palita explains that he will take
    shelter beneath the cat’s body from the mongoose and owl while later cutting the
    noose.'
