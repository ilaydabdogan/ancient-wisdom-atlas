canonical_text:
  quote: ''
  summary: Vaishampayana recounts that the delighter of the Yadus came to Vaka's Veda-filled
    asylum. A prior episode explains how the ascetic Dalvya Vaka, angered by Dhritarashtra's
    insulting offer of dead cattle, cut flesh from those animals and offered it in
    a sacrificial fire on the Sarasvati to destroy Dhritarashtra's kingdom. The kingdom
    wasted away until Dhritarashtra, advised by counsellors, went to the Sarasvati,
    prostrated himself, and begged forgiveness. Vaka relented, made further libations,
    freed the kingdom, and Dhritarashtra returned to a prosperous capital.
  language: English
  quote_policy: summarized
