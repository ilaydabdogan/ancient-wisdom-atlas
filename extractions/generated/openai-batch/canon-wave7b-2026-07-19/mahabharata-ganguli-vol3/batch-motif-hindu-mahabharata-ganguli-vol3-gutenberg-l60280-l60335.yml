canonical_text:
  quote: ''
  summary: After hearing Narada, Suka reflects on misery, attachment, and the desire
    for an eternal state free from return to birth. He resolves to use Yoga, cast
    off his body, transform into wind, and enter the solar effulgence rather than
    remain subject to lunar-like cycles of waxing, waning, fall, and return. He declares
    his intention before creatures and divine or semi-divine beings, informs Narada,
    visits his father Island-born Krishna, declines his father's wish that he stay,
    and departs toward Kailasa.
  language: English
  quote_policy: summarized
