canonical_text:
  quote: '"We will now ascend the path that is trod by the celestials and by heroes
    unreturning from battle"'
  summary: Duryodhana rejects peace, cites Draupadi’s grief and Abhimanyu’s death,
    argues that righteous battle and warrior death bring fame and heaven, recalls
    slain allies as already having reached Indra’s abode, and rouses the Kaurava warriors,
    who encamp by the red waters of the Sarasvati near Himavat.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Draupadi, called Krishna and daughter of Drupada, is described as sorrowful,
    performing severe penances for the speaker’s destruction and her husbands’ aims,
    and sleeping on the bare ground until hostilities end.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Subhadra, described as the uterine sister of Vasudeva, is said to serve Draupadi
    as a waiting woman.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker says everything has flamed up, that the fire cannot be quenched,
    and that peace has become impossible because of Abhimanyu’s slaughter.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The speaker recalls having enjoyed sovereignty over the earth bounded by the
    ocean and says he cannot live under the favor of the Pandavas or walk behind Yudhishthira
    like a slave.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker says this is not the time for peace and that righteous fighting
    is good policy.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The speaker lists sacrifices, Dakshinas to Brahmanas, Vedic recitations, care
    for servants, relief of distressed people, conquest, governance, pursuit of religion,
    profit, and pleasure, and payment of debts to the Pitris and Kshatriya duty.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The speaker says fame is obtained by battle, that a Kshatriya’s death at home
    or on a bed is blameworthy, and that death in the woods or in battle after sacrifices
    brings glory.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The speaker says he will proceed by righteous battle to Shakra’s regions and
    describes heaven as the habitation of non-retreating heroes sanctified in the
    sacrifice of weapons.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The speaker says Apsaras gaze on such heroes in battle and that the Pitris
    behold them worshipped among the gods and rejoicing in heaven with Apsaras.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The speaker says he and others will ascend a path trod by celestials and heroes
    who do not return from battle, a path taken by the grandsire, the preceptor, Jayadratha,
    Karna, and Duhshasana.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Slain kings are described as mangled with arrows, bloodied, lying on the Earth,
    and having become denizens of Indra’s abode after dying in the discharge of duty.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The speaker says the slain kings have paved the way to the blessed region
    and that crowds of heroes will hurry along that road.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The speaker says he desires to repay the debt owed to heroes who died for
    him rather than fix his heart on kingdom, and says he would be censured if he
    saved his own life after causing kin and allies to be slain.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: After Duryodhana’s speech, the Kshatriyas applaud, cheer him, resolve to fight,
