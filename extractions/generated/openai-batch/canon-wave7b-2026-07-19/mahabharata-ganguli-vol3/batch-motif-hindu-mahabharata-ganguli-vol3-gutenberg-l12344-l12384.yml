canonical_text:
  quote: I am lordless and destitute of all my sons.
  summary: After hearing cruel words, Dhritarashtra, Vidura, Gandhari, the Kuru ladies,
    and other royal persons collapse in grief. Dhritarashtra repeatedly regains and
    loses consciousness, calls Vidura his refuge, is revived with cold water and fans,
    asks that the women and friends retire, and then enters deeper lamentation while
    Vidura comforts him.
  language: English
  quote_policy: quoted
