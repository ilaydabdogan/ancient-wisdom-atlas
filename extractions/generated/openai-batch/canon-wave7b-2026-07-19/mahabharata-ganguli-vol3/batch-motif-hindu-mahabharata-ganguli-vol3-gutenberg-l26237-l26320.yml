canonical_text:
  quote: ''
  summary: Vyasa instructs Yudhishthira that acquisition, natural processes, birth,
    death, prosperity, and adversity occur through Time. He cites an old teaching
    of king Senajit on grief, non-attachment, and the alternation of happiness and
    sorrow, then describes battle, chastisement, gifts, sacrifice, just rule, and
    death in battle as sanctifying duties that lead a king to the region of the gods
    or heaven.
  language: English
  quote_policy: summarized
