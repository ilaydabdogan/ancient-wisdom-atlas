canonical_text:
  quote: '"Amongst these two, viz., one who obtains the fruition of all his wishes,
    and one who casts off every wish, the latter, who renounces all, is superior"'
  summary: Bhishma teaches Yudhishthira that equanimity, truthfulness, freedom from
    attachment, and freedom from desire for action lead to tranquillity and emancipation.
    He cites the narrative of Manki, who loses his last property when two yoked bulls
    are carried away by a camel, and then reflects that wealth, desire, and effort
    do not bring happiness. Manki resolves to renounce attachment, uproot desire by
    avoiding will, take refuge in goodness, devote himself to Yoga and Brahma, and
    roam without attachment.
  language: English
  quote_policy: quoted
