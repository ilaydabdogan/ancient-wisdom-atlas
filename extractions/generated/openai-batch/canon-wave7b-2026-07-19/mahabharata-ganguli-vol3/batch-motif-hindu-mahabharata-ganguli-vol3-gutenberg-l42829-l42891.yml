canonical_text:
  quote: ''
  summary: 'Bhrigu describes Brahman''s first creation of Prajapatis, sacred norms,
    Vedas, gods, anti-gods, serpentine beings, humans, and the four human orders with
    colors. Bharadwaja questions classification by color or attributes. Bhrigu replies
    that there is no original distinction: all were first Brahmanas created equal,
    and differentiation into orders occurred through acts, qualities, occupations,
    cupidity, ignorance, and loss of knowledge. He also mentions creation by the penance
    of great Rishis and an eternal mental creation based on Brahma and yoga.'
  language: English
  quote_policy: summarized
