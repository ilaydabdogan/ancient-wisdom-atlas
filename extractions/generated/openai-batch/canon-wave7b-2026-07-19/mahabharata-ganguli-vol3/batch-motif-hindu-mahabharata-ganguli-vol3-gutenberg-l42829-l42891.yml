- id: obs:4
  text: Bhrigu lists deities, Danavas, Gandharvas, Daityas, Asuras, snakes, Yakshas,
    Rakshasas, Serpents, Pisachas, humans, and other creatures as created afterward.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The four human orders are each assigned a complexion: Brahmanas white, Kshatriyas
