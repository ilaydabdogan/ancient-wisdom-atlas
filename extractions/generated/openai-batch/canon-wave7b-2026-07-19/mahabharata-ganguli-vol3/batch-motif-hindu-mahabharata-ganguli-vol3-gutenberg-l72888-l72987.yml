  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage compares churning ass’s milk for butter to the folly of failing
    to understand Prakriti and Purusha from the Vedas.
  category: other
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Soul is said to be conscious of itself and Prakriti in wakefulness and
    dream, but to behold the Supreme Soul in Yoga-samadhi.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Supreme Soul is said always to behold the Jiva-soul; the Jiva-soul may
    behold the Supreme Soul in Yoga-samadhi, though it ordinarily fails to do so.
  category: relationship
  evidence_refs:
  - ev:11
