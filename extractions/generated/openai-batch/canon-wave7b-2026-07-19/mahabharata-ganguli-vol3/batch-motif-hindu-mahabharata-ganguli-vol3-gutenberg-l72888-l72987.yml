- id: obs:4
  text: Yajnavalkya is said to have obtained the Vedas from Surya and begun to teach
    them, provoking jealousy and dispute with Vaisampayana over Dakshina in Janaka’s
    sacrifice.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Vishnu Purana variant says Yajnavalkya was asked by Vyasa to return Vedas
    obtained from him, vomited them forth, and two Rishis in the form of Tittiri birds
    devoured them and later promulgated the Taittiriya Upanishads.
  category: sequence
  evidence_refs:
  - ev:5
