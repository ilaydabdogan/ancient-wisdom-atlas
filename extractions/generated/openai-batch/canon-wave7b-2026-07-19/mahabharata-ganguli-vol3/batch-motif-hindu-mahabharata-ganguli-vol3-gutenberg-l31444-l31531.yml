canonical_text:
  quote: ''
  summary: Bhishma advises that a king appoint a learned priest and maintain friendship
    between Brahmana and Kshatriya. In a cited old discourse, Aila questions Kasyapa
    about the relative standing and interdependence of Brahmana and Kshatriya. Kasyapa
    says their contention or abandonment causes ruin, social disorder, failure of
    sacrifices, lack of Vedic study, calamities, and the appearance of Rudra as destructive
    vengeance. He describes Rudra as existing in men’s hearts and compares collective
    chastisement to fire spreading from one house and to wet wood burning when mixed
    with dry wood. Aila then observes that earth, sun, wind, and water treat honest
    and wicked alike.
  language: English
  quote_policy: summarized
