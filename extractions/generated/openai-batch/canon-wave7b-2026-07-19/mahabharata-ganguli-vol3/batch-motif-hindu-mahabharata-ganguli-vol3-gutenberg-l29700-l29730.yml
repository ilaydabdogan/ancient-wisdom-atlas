canonical_text:
  quote: '"the whole world bows down to one man as to a god"'
  summary: After morning rites, the Pandavas and Yadavas go to the field of Kuru where
    Bhishma lies. They greet Bhishma and the Rishis, sit around him, and Yudhishthira
    worships Bhishma with joined hands. Yudhishthira asks why the word Rajan, or King,
    exists and why one human being, bodily and existentially like all others, rules
    over many brave and intelligent people and is treated with godlike reverence.
  language: English
  quote_policy: quoted
