  quote: ''
  summary: Sulabha addresses a king, setting out requirements for clear and authoritative
    speech, including freedom from verbal and judgment faults, clarity, proper order,
    and intelligibility to the hearer. She then answers questions about identity by
    describing creatures and sense faculties as commingled, explaining that senses
    do not know themselves and require external objects, and distinguishing mind and
    Understanding from the senses.
