canonical_text:
  quote: ''
  summary: Sanjaya reports Karna answering Shalya. Karna says he knows the prowess
    of Krishna and Arjuna, recalls how he lived with Rama in the disguise of a Brahmana
    to obtain celestial weapons, endured a divine worm piercing his thigh while his
    preceptor slept, was exposed as a Suta, and was cursed that the weapon gained
    by deception would fail him at the hour of death. He then vows to resist and slay
    Arjuna, using images of ocean, continent, fire, clouds, serpent, mountain, and
    wind.
  language: English
  quote_policy: summarized
