canonical_text:
  quote: ''
  summary: Vyasa teaches his son about the Jiva-soul, Prakriti, the senses, the hierarchy
    culminating in Brahma, the hidden Supreme Soul, yogic interiorization, the danger
    of sensory bondage, purification of heart, and the restricted transmission of
    a wisdom discourse described as the essence of the Vedas and connected with the
    Upanishads.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vyasa says the Jiva-soul is connected with modifications of Prakriti; these
    do not know the Soul, but the Soul knows them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Soul is compared to a good driver using strong steeds, acting with the
    senses and the mind.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The passage presents an ordered hierarchy: sense objects, mind, understanding,
    Soul or Mahat, Unmanifest or Prakriti, and Brahma, above whom nothing is superior.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Supreme Soul is said to be concealed in every creature and visible only
    to Yogins with subtle vision and understanding.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Yogin is instructed to merge the senses and their objects into the inner
    Soul, reflect on object thought, thinking, and thinker, abstain from enjoyment,
    and become tranquil through knowledge of Brahma's self.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A person enslaved to the senses and passions is described as meeting death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: After destroying desires and merging gross understanding into subtle understanding,
    one is said to become a second Kalanjara mountain.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Purification of heart is associated with transcending righteousness and its
    reverse, attaining highest happiness, and experiencing a state likened to dreamless
    sleep.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Yogin who has attained that state is compared to a steady lamp flame in
    still air and is said to behold the Soul in the Soul.
  category: other
  evidence_refs:
  - ev:3
- id: obs:10
  text: Vyasa calls the discourse instruction for his son, the essence of all the
    Vedas, and something not understood by inference or scriptural study alone but
    by faith.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The knowledge is described as nectar raised by churning religious works, truthful
    discourses, and the Richs, and is compared to butter from curds and fire from
    wood.
  category: other
  evidence_refs:
  - ev:4
- id: obs:12
  text: 'The discourse is restricted: it should not be given to the untranquil, unrestrained,
    unqualified, malicious, insincere, reckless, disputatious, vile, or low, but may
    be given to qualified Brahmanas, a son, or a dutiful disciple.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: The gift of this knowledge is said to be superior to gifting the whole earth
    with its treasures; Vyasa then mentions a greater mystery connected with the Soul,
    treated in the Upanishads, and says the Sun and Moon are seated before his son.
  category: speech
  evidence_refs:
  - ev:6
