canonical_text:
  quote: ''
  summary: 'Yudhishthira asks Bhishma which is superior between domestic duty and
    Yoga, both said to lead to high ends. Bhishma introduces an old narrative about
    Kapila and a cow: when king Nahusha prepared to kill a cow for hospitality to
    the deity Tvashtri under Vedic injunction, Kapila objected. The Rishi Syumarasmi,
    entering the cow''s form by Yoga power, challenged Kapila about the authority
    of the Vedas and duties of harmlessness. Kapila replies that he does not censure
    the Vedas, that all four modes of life lead to the same end, and that the tension
    between acting and abstaining from acts is difficult to resolve, asking for a
    duty superior to harmlessness if one is known by direct evidence.'
  language: English
  quote_policy: summarized
