canonical_text:
  quote: ''
  summary: A doctrinal speech distinguishes the Destructible universe of Manifest
    and Unmanifest from the Indestructible. It identifies Prakriti as the twenty-fourth
    principle and Vishnu/Akshara as the twenty-fifth, formless and without attributes.
    Through union with Prakriti, the Indestructible appears as embodied, modified,
    and subject to birth and death; through knowledge it is displayed in its true
    nature. The passage also links Sattwa, Rajas, and Tamas with colors and with different
    destinies or statuses.
  language: English
  quote_policy: summarized
