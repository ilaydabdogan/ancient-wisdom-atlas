  summary: Sanjaya narrates a war-council scene after the deaths of Bhishma and Drona.
    Ashvatthama urges that Karna be installed as commander. Duryodhana appeals to
    Karna as his refuge, recalls the fallen commanders and their ties to the Pandavas,
    compares Karna's desired role to divine and solar exemplars, and Karna accepts
    the generalship while declaring the Pandavas already vanquished.
