canonical_text:
  quote: ''
  summary: Sanjaya narrates the exchange before the mace combat between Bhima and
    Duryodhana. Vasudeva praises and exhorts Bhima, Bhima vows vengeance and restoration
    of Yudhishthira's glory, Duryodhana accepts the challenge and insists on a fair
    fight, and the assembled warriors and animals respond as the Pandavas' weapons
    blaze of their own accord.
  language: English
  quote_policy: summarized
