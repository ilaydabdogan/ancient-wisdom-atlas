canonical_text:
  quote: '"From this day Ganga''s son will speak of things that are great mysteries."'
  summary: Krishna wakes before dawn, meditates, receives hymnic praise, performs
    ablutions, mantras, fire-libations, and gifts to Brahmanas, then sends Satyaki
    to see whether Yudhishthira is ready to visit Bhishma. Yudhishthira orders a limited
    party without soldiers because Bhishma is to speak of great mysteries. Krishna,
    Satyaki, Yudhishthira, and the Pandavas travel by chariot across the sacred field
    of Kuru to Bhishma, who lies on a bed of arrows surrounded by Rishis; they alight,
    salute the sages, and Yudhishthira approaches Bhishma fearfully.
  language: English
  quote_policy: quoted
