canonical_text:
  quote: ''
  summary: A counselor urges Duryodhana to make peace with the Pandavas and to restrain
    Karna. Duryodhana refuses, citing Bhima's killing of Duhshasana, distrust between
    the sides, and confidence that Karna will kill a tired Arjuna. He orders his troops
    to attack. Sanjaya then narrates the encounter between Karna and Arjuna, describing
    their chariot duel through martial, animal, natural, and divine-combat similes.
    Both sides exhort their champions, and Karna and Arjuna exchange piercing shafts
    in fierce combat.
  language: English
  quote_policy: summarized
