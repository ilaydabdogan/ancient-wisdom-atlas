canonical_text:
  quote: ''
  summary: Vyasa expounds a cosmogony in which self-existent Brahma is the seed and
    source of the mobile and immobile universe. Creation proceeds at the dawn of the
    creator’s day through Avidya, Mahat, Mind, and a sequence of elements with sensory
    attributes. The elements commingle to form bodies, the creator divides himself
    by Maya and enters subtle form, and the worlds and classes of beings are created.
    The passage also discusses recurring attributes across creations, competing explanations
    of causation, penance as a path to the creator, and beginningless Vedic sounds.
  language: English
  quote_policy: summarized
