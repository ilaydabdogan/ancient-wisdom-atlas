canonical_text:
  quote: I fell among the forces of Madhava even as a sinner falleth into hell.
  summary: During a battlefield rout, Ashvatthama, Kripa, and Kritavarma search for
    Duryodhana while the Pandavas advance under Dhrishtadyumna. The first-person speaker
    fights, retreats, and is seized by Satyaki. Bhimasena and Arjuna destroy an elephant-force;
    the fallen elephants block the Pandavas' way until Bhimasena drags them aside
    and opens a path.
