canonical_text:
  quote: ''
  summary: Rudra/Sthanu is denied a share in the gods' sacrificial offerings. He fashions
    a bow from sacrificial materials, arrives in anger, disturbs the cosmos, pierces
    the embodied Sacrifice, injures several gods, and terrifies the celestials. The
    gods seek his protection and gratify him. Mahadeva casts his wrath into water
    as consuming fire, restores the injured gods and the sacrifices, receives clarified
    butter libations as his share, and the passage then attributes Ashvatthama's slaughter
    to Mahadeva's grace.
  language: English
  quote_policy: summarized
