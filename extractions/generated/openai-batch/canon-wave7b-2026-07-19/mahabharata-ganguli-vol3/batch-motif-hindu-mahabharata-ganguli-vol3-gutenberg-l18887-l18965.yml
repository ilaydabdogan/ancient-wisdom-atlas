  summary: 'Baladeva hears from Rishis about Kurukshetra/Samantapanchaka: it is described
    as Brahman''s northern altar, a place once cultivated by the royal sage Kuru.
    Shakra grants that those who die there under specified conditions, including battle
    death, will reach heaven, and the site''s sanctity is said to be sanctioned by
    major deities and Rishis.'
  language: English
