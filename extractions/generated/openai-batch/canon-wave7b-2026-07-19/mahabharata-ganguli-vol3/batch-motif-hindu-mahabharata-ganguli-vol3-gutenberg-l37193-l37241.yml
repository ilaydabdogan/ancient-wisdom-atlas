  quote: ''
  summary: Bhishma gives a didactic discourse on Kshatriya duty, arguing that religious
    merit and wealth should be pursued without excessive debate about unseen results.
    He emphasizes power, wealth, army, and advisers; presents righteousness as dependent
    on power; describes social consequences of weakness and sin; and lists practices
    for expiating sin and regaining respect, including Vedic study, service to Brahmanas,
    mantras, water-rites, penances, and sharing wealth.
  language: English
  quote_policy: summarized
