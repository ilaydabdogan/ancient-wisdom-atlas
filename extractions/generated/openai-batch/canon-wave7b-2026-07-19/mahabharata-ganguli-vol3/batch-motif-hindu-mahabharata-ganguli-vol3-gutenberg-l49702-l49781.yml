canonical_text:
  quote: There is only one kind of bondage in this world, viz., the bondage of desire,
    and no other.
  summary: 'Vyasa gives a didactic teaching on the conduct of a true Brahmana or Yogin:
    restraint from sensory enjoyment, honor, and desire; compassion and non-injury
    toward all creatures; the insufficiency of ritual without inner discipline; the
    inner sequence from Vedic truth to tranquillity; and liberation through knowledge
    of the Soul, meditation, and transcendence of Prakriti.'
  language: English
  quote_policy: quoted
