- id: motif:2
  label: Sevenfold sacred river manifestation
  taxonomy_refs: []
  basis: Sarasvati is explicitly said to have seven forms, and those forms later mingle
    at a named tirtha.
  evidence_refs:
  - ev:1
  - ev:9
  confidence: high
  cautions: No available taxonomy reference specifically names sevenfold river manifestation.
- id: motif:3
  label: Sacred confluence creates pilgrimage place
  taxonomy_refs: []
  basis: The passage explains the name Sapta Sarasvati by saying the seven forms came
    together and mingled at that spot.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The tirtha is named and etiologically explained, but the passage does
    not elaborate on its rites.
- id: motif:4
  label: Miraculous vessel birth from divided seed
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: Mankanaka's seed is placed in an earthen pot, divides into seven portions,
    and produces seven Rishis linked to the Maruts.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The born figures are Rishis rather than ordinary children; the taxonomy
    match is functional rather than exact.
- id: motif:5
  label: Ascetic body transformed beyond ordinary blood
  taxonomy_refs: []
  basis: After ascetic success, Mankanaka's pierced hand emits vegetable juice rather
    than red blood.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage reports the marvel but does not explain its theological meaning
    in the provided lines.
- id: motif:6
  label: Ascetic ecstasy affects the whole world
  taxonomy_refs: []
  basis: Mankanaka dances in joy, and all mobile and immobile creatures begin to dance,
    stupefied by his energy.
  evidence_refs:
  - ev:13
