canonical_text:
  quote: '"O king, the seven Sarasvatis cover this universe!"'
  summary: 'Vaishampayana recounts seven manifestations of the river Sarasvati, each
    appearing when summoned at sacrifices or sacred gatherings. The seven forms mingle
    at a tirtha called Sapta Sarasvati. The passage then tells of Mankanaka: his seed
    falls into Sarasvati, is placed in an earthen pot, divides into seven parts, and
    produces Rishis associated with the Maruts. Later, after his hand is pierced by
    a kusa blade, vegetable juice rather than blood flows out; he dances, and all
    creatures begin to dance under his ascetic power.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that the seven Sarasvatis cover the universe and that Sarasvati
    appeared wherever summoned by persons of great energy.
