  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Seven forms of Sarasvati are listed: Suprava, Kanchanakshi, Visala, Manorama,
    Oghavati, Surenu, and Vimalodaka.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Pushkara, during the Grandsire's sacrifice, Rishis said the sacrifice lacked
    high attributes because Sarasvati was not visible; when Brahman thought of her,
    Sarasvati appeared as Suprava.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Naimisha, Munis engaged in Vedic discussion thought of Sarasvati during
    a sacrifice, and she appeared as Kanchanakshi to assist them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Gaya's sacrifice, Sarasvati was summoned and appeared; Rishis named this
    form Visala.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Auddalaka's sacrifice in northern Kosala, Sarasvati came for the Rishis
    and became known as Manorama.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: At Kuru's sacrifice in Kurukshetra, Vasishtha summoned Sarasvati, who appeared
    with celestial water as Oghavati.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: At Daksha's sacrifice at the source of Ganga, Sarasvati appeared as the fast-flowing
    Surenu.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: At a sacrifice of Brahman in a sacred forest of the Himavat mountains, Sarasvati
    was summoned and appeared.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: All seven forms came together and mingled at the tirtha where Baladeva came;
    for this reason the place is called Sapta Sarasvati.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Mankanaka, a lifelong brahmacari, saw an uncovered woman bathing in the river,
    and his vital seed fell into Sarasvati.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Mankanaka placed the seed in an earthen pot; the fluid divided into seven
    parts.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: 'From the seven portions were born seven Rishis, from whom the forty-nine
    Maruts sprang; the passage gives six names for the Rishis: Vayuvega, Vayuhan,
    Vayumandala, Vayujata, Vayuretas, and Vayuchakra.'
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: After Mankanaka became successful in asceticism, a kusa blade pierced his
    hand, and vegetable juice came from the wound instead of red blood.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: Seeing the vegetable juice, Mankanaka joyfully danced; all mobile and immobile
