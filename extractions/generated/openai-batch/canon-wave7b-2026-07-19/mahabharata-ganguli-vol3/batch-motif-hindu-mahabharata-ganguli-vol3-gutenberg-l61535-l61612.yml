canonical_text:
  quote: ''
  summary: Bhishma recounts Narayana's supremacy, the ancient transmission chain of
    a sacred narrative, its restricted communication to worshippers, its comparison
    to nectar raised by churning, and the benefits of devotional reading or hearing.
    Vaisampayana and Suta then describe Yudhishthira's devotion, Vyasa's journey to
    the Ocean of Milk, and the instruction to worship Narayana through sacrifice at
    Naimisha.
  language: English
  quote_policy: summarized
