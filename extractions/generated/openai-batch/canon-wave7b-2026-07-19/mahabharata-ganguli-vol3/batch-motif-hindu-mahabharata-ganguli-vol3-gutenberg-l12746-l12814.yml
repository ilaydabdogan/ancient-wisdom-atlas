canonical_text:
  quote: ''
  summary: Kripa urges Duryodhana to seek peace with the Pandavas, citing prudence,
    inferiority of forces, possible intercession by Dhritarashtra and Krishna, and
    the chance of preserving sovereignty. Kripa weeps after warning that Duryodhana
    will remember the counsel at death. Duryodhana acknowledges Kripa's loyal friendship
    but rejects the advice as unpalatable, arguing that past wrongs against Yudhishthira,
    Krishna, Draupadi, Abhimanyu, and the Pandavas have made trust and peace impossible.
  language: English
  quote_policy: summarized
