canonical_text:
  quote: "“that which is freed from duty and its reverse ... which transcends birth
    and death”"
  summary: Yudhishthira asks Bhishma to explain an eternal, fearless, pure state beyond
    duty, sin, birth, and death. Bhishma introduces an old discourse between Janaka
    and Yajnavalkya. Janaka asks about senses, Prakriti, Brahma, birth, death, and
    age. Yajnavalkya answers by promising high knowledge valued by Yogins and Sankhyas,
    then enumerates Prakriti, modifications, senses, elements, breaths, and a sequence
    of creations totaling twenty-four principles.
