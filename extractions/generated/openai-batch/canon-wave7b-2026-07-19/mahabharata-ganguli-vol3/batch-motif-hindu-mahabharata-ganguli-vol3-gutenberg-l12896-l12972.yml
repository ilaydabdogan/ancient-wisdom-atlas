canonical_text:
  quote: ''
  summary: Sanjaya narrates that Duryodhana's remaining allies camp at the foot of
    Himavat after Karna's death. The warriors ask that a commander be appointed. Duryodhana
    consults Ashvatthama, who recommends Shalya, comparing him to Skanda/Kartikeya
    as leader of the gods. The kings acclaim Shalya; Duryodhana requests him to lead
    and protect the army, and Shalya pledges his life, kingdom, and wealth to Duryodhana's
    service.
  language: English
  quote_policy: summarized
