canonical_text:
  quote: ''
  summary: Arjuna speaks to a king about the rod of chastisement, describing punitive
    authority as protection for subjects, righteousness, property, social order, and
    religious duty. He says fear of punishment, including royal and Yama's punishment,
    restrains wrongdoing. He argues that injury and predation are unavoidable in worldly
    life, cites gods and animals as examples of slaughter or devouring, and warns
    that without chastisement the world would fall into darkness, confusion, and destruction.
  language: English
  quote_policy: summarized
