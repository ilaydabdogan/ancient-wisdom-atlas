canonical_text:
  quote: ''
  summary: A speaker addresses the king of Mithila, enumerating principles that constitute
    body, describing Prakriti as the source of embodied creatures, outlining embryonic
    and life-stage development, and challenging the king’s claim to emancipation because
    of remaining duality and attachments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists principles including Sattwa, consciousness of self, desire,
    Avidya, Prakriti, Vyakti, couples of opposites, Time, the five great elements,
    existence and non-existence, Vidhi, Sukra, and Vala, bringing the total to thirty.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The body is described as that in which the thirty principles occur.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Time is named the twentieth principle, and births and deaths of creatures
    are attributed to its action.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage contrasts views about the cause of the thirty principles, including
    unmanifest Prakriti, the Manifest or atoms, and a view that those conversant with
    Adhyatma behold Prakriti as the cause of all creatures.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Unmanifest Prakriti is said to become manifest in the form of the principles,
    and embodied persons are said to be results of Prakriti with respect to their
    bodies.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Embryonic development is described as proceeding from the mixture of vital
    seed and blood through Kalala, Vudvuda, Pesi, a stage where limbs manifest, then
    nails and hair, and finally birth after the ninth month.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After birth, a creature is said to pass from infancy to youth and then old
    age, with the previous form changing at each stage.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The constituent elements of the body are said to change every moment, with
    the birth and death of particles too minute to be noticed, like changes in a burning
    lamp flame.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Creatures are compared to fire generated from flint and iron or from two sticks
    rubbed together, being generated from the combination of the thirty principles.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The speaker asks the king why, if he sees his own body and soul, he does not
    see his body and soul in the bodies and souls of others.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The speaker challenges the king’s question about who the speaker is and whose
    the speaker is, connecting such questions to duality expressed as mine and not
    mine.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The speaker questions whether a king who acts differently toward enemies,
    allies, and neutrals, or in victory, truce, and war, shows signs of emancipation.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The speaker says that failure to cast an equal eye on the agreeable, the weak,
    and the strong is inconsistent with emancipation.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The king’s effort toward emancipation is compared to a patient using medicine
    while indulging in forbidden food and practices.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Spouses and other sources of attachment, together with lying down, enjoyment,
    eating, and dressing, are mentioned as remaining bonds for the addressee.
  category: object
  evidence_refs:
  - ev:7
