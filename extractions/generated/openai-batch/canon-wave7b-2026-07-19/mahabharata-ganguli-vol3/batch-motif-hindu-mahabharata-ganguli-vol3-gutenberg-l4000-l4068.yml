  quote: ''
  summary: Duryodhana appoints Shalya to drive Karna's chariot. Karna worships and
    mounts the consecrated chariot, is praised with divine and solar imagery, receives
    Duryodhana's charge to defeat the Pandavas, boasts that he will slay them, and
    is warned by Shalya of the Pandavas' might before ordering him to proceed.
  language: English
