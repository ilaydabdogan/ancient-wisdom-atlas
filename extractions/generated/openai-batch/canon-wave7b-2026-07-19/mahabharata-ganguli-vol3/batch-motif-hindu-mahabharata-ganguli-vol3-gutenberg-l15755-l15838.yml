canonical_text:
  quote: ''
  summary: Sanjaya narrates the near-total destruction of Duryodhana's army. Duryodhana
    flees alone with his mace toward a lake, grieving and recalling Vidura's foresight.
    Sanjaya is captured by Pandava-side warriors but spared when Vyasa intervenes.
    Sanjaya later meets the wounded Duryodhana, who sends a message to Dhritarashtra
    and enters the lake, using illusion to make a space within the waters. Kripa,
    Ashvatthama, and Kritavarma arrive, learn where Duryodhana is, lament, and flee
    with Sanjaya when the Pandavas approach.
  language: English
  quote_policy: summarized
