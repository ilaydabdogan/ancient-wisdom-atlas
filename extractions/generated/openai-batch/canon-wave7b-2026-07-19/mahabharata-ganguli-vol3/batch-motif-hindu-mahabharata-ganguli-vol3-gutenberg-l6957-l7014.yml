canonical_text:
  quote: rescue the son of Prishata, who is now within the jaws of Drona's son as
    if within the jaws of Death himself.
  summary: Ashvatthama strips Dhrishtadyumna of chariot, weapons, steeds, and driver,
    but cannot kill him. Krishna warns Arjuna and drives toward the danger. Arjuna
    pierces Ashvatthama with arrows, forcing him to release Dhrishtadyumna, whom Sahadeva
    carries away. Arjuna then wounds Ashvatthama so severely that he swoons and is
    carried from the field by his driver. Karna desires combat with Arjuna, while
    the Pancalas celebrate, and Arjuna asks Krishna to drive toward the samsaptakas.
  language: English
  quote_policy: quoted
