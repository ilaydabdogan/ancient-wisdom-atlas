canonical_text:
  quote: no consideration was shown by anybody for anyone
  summary: After the noise of battle subsides somewhat and the scent of blood has
    nearly stupefied the fighters, Shakuni approaches the Pandava host with a small
    remnant of horse. The Pandavas surround him and strike him from all sides. Kaurava
    forces rush toward the Pandavas. Weaponless foot-soldiers fight with feet and
    fists; warriors fall from cars and elephants; combatants kill fathers, friends,
    and sons amid a terrible rain of weapons.
  language: English
  quote_policy: quoted
