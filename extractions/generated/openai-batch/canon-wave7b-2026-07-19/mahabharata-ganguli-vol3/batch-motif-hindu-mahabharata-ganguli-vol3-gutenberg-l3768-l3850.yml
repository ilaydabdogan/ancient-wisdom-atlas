canonical_text:
  quote: "“Do not reduce the three worlds to ashes.”"
  summary: A divine fire born from wrath is quenched, and the worlds are restored.
    Duryodhana urges Shalya to act as Karna’s charioteer by invoking Brahman’s service
    as Rudra’s driver. He then narrates how Rama, son of Jamadagni, won Mahadeva’s
    favor through austerities, was sent against the Daityas/Danavas who afflicted
    heaven, returned wounded after slaying them, was healed by Sthanu’s touch, and
    received celestial weapons.
  language: English
  quote_policy: quoted
