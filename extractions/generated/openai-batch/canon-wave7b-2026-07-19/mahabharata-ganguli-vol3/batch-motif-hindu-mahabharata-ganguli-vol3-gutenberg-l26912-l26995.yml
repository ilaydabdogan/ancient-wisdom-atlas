canonical_text:
  quote: ''
  summary: Narada consoles the grieving king Srinjaya by recounting several greater
    royal sages—Gaya, Rantideva, Sagara, and Prithu—who performed great sacrifices,
    gave extraordinary gifts, wrought or received marvels, and nevertheless died.
    Srinjaya says the discourse has dispelled his grief and asks Narada to revive
    his dead son by grace.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gaya made a golden ground for a horse-sacrifice and gave it away as the sacrificial
    fee, along with innumerable kine measured by comparison to the sand grains of
    the Ganga.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rantideva obtained boons from Sakra after severe penance and reverent adoration,
    asking for abundant food, numerous guests, undiminished faith, and freedom from
    having to ask others for anything.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Domestic and wild animals came of their own accord to Rantideva for sacrifice,
    and secretions from the skins of slaughtered animals produced the river called
    Charmanwati.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Rantideva gave large monetary gifts to Brahmanas, possessed gold vessels and
    dining implements, and fed guests in such numbers that twenty thousand and one
    hundred kine were slaughtered on guest nights.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sagara had sixty thousand sons following him, ruled the whole earth, performed
    a thousand horse-sacrifices, and gave golden mansions and other valuable objects
    to Brahmanas.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sagara angrily caused the earth to be excavated; as a result, the earth came
    to bear the ocean, which was called Sagara after him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Great Rishis installed Prithu, son of Vena, as sovereign of the earth, and
    the passage explains the names Prithu, Kshatriya, and Raja through his advancing,
    protecting, and inspiring attachment among creatures.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: During Prithu's rule, crops arose without tilling, tree leaves bore honey,
    cows yielded a jugful of milk, people were healthy and fearless, and wishes were
    fulfilled.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: When Prithu crossed waters, sea waters solidified and rivers remained calm;
    in a horse-sacrifice he gave Brahmanas twenty-one mountains of gold.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: After each royal example, Narada states that the king was greater and purer
