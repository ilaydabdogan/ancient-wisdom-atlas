canonical_text:
  quote: ''
  summary: Janamejaya states that Hari is gracious to whole-soul devotees and accepts
    prescribed worship. He contrasts persons who attain through transmitted Knowledge
    and successive stages with devotees of Narayana who immediately attain the highest
    end, the immutable Hari. He judges devotion superior to Vedic study and ascetic
    discipline, then asks who first promulgated this devotional religion, what its
    practices are, and when they began.
