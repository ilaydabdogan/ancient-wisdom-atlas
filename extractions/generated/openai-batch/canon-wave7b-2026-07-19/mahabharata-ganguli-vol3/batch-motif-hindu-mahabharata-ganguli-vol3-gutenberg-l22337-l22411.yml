canonical_text:
  quote: ''
  summary: At the opening of the Stri-parva, Janamejaya asks what Dhritarashtra, Yudhishthira,
    and the surviving Kuru warriors did after Duryodhana and the other warriors had
    fallen. Vaishampayana recounts that Dhritarashtra, having lost his sons, is overwhelmed
    by grief. Sanjaya urges him not to grieve and to perform funeral rites for the
    dead. Dhritarashtra laments his losses, regrets not accepting earlier counsel
    for peace, attributes his suffering to former sins and Destiny, and declares his
    intent to take the long way leading to the regions of Brahman.
  language: English
  quote_policy: summarized
