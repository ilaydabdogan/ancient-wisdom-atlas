canonical_text:
  quote: ''
  summary: Bhishma narrates that Vyasa and his son Suka recite the Vedas until a violent
    wind arises. Vyasa halts the recitation and answers Suka’s question about the
    wind by describing Suka’s spiritual purity, the two paths after death, and seven
    cosmic or vital winds whose powers include clouds, rain, luminaries, life, death,
    emancipation, and the breath of Vishnu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vyasa hears Narada’s words, rejoices, and recites the Vedas aloud with his
    son Suka according to proper rules.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A violent wind arises during the Vedic recitation; Vyasa tells Suka to suspend
    the recitation, and Suka asks about the wind’s origin and conduct.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Vyasa tells Suka that he has obtained spiritual vision, has a cleansed mind,
    and abides in the attribute of Goodness.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Vyasa identifies two paths in the world hereafter: Deva-yana, associated
    with heaven, and Pitri-yana, associated with Tamas and hell.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Vyasa says winds blow on the earth and in the sky in seven courses.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage links named vital winds in a sequence including Samana, Udana,
    Vyana, Apana, and Prana, and explains Prana as life because living creatures live
    by it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Several winds are described as moving clouds, causing luminaries to appear,
    drawing water from the oceans to clouds, pouring rain, supporting clouds, carrying
    celestial cars, and rending mountains.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: One wind uproots and breaks trees, and another sustains celestial waters and
    the Ganga while affecting the visible appearance of the Sun and Moon.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Paravaha is said to take life at the proper time, to be followed by Death
    and Yama, and to aid Yogins in attaining immortality or emancipation.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The winds are called sons of Diti; the violent wind that shakes the mountain
    is identified as the breath of Vishnu’s nostrils and can agitate the whole universe.
  category: relationship
  evidence_refs:
  - ev:10
