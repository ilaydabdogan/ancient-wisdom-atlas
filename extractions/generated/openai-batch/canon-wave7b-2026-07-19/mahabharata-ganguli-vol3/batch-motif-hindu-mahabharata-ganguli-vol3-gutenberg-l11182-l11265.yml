canonical_text:
  quote: ''
  summary: Karna shoots a serpent-associated arrow at Arjuna. Krishna presses Arjuna's
    chariot into the earth, causing the arrow to remove and destroy Arjuna's divine
    diadem rather than his head. The snake reveals that Arjuna killed its mother and
    asks Karna to shoot it again, but Karna refuses to rely on another's strength
    or reuse the same shaft; the enraged snake then assumes arrow form and goes toward
    Arjuna on its own.
  language: English
  quote_policy: summarized
