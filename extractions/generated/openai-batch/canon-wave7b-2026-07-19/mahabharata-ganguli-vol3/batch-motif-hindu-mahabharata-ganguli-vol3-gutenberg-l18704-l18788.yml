canonical_text:
  quote: ''
  summary: Vaishampayana recounts an ancient episode about the ascetic Dadhica. Shakra
    fears Dadhica's austerities and sends the apsara Alambusa to tempt him; Dadhica's
    seed falls into the Sarasvati, and the river holds it in her womb and later gives
    birth to Sarasvata. Dadhica accepts the child, blesses Sarasvati, names the child
    after her, and foretells his Vedic teaching during a twelve-year drought. Later,
    in a war against the Danavas, the gods seek Dadhica's bones; he gives up his life,
    and Shakra makes weapons from the bones and slays Daityas. During the later drought,
    Sarasvati sustains Sarasvata with fish so that he remains by the river and continues
    offerings.
  language: English
  quote_policy: summarized
