canonical_text:
  quote: ''
  summary: Yajnavalkya teaches the king about Yoga, presents Sankhya and Yoga as sharing
    practices and the goal of Emancipation, describes breath and sense-regulation,
    distinguishes Yoga with and without attributes, gives a sequence of sense-withdrawal
    and contemplation of the Supreme Soul, and lists signs and results of Samadhi,
    including vision of Brahma and attainment of Emancipation.
  language: English
  quote_policy: summarized
