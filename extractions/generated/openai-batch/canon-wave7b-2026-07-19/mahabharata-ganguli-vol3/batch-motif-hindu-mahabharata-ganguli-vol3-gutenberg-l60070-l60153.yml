canonical_text:
  quote: Mental griefs should be killed by wisdom; while physical grief should be
    dispelled by medicines.
  summary: Narada counsels a listener on dispelling grief through blessed scriptures,
    old narratives, disciplined understanding, wisdom, contentment, detachment, and
    Yoga. The teaching emphasizes that past losses do not return, worldly goods and
    relationships are transitory, all combinations end in dissolution, life ends in
    death, and Death seizes the desire-bound person. Restraint of senses, humility,
    and dependence on the self are presented as conditions of happiness.
  language: English
  quote_policy: quoted
