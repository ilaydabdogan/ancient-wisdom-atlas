canonical_text:
  quote: ''
  summary: Yajnavalkya explains to the Gandharva Viswavasu a doctrine distinguishing
    unintelligent Prakriti, the intelligent Jiva-soul, and the Supreme Soul. He uses
    the image of fish living in water while remaining separate from it to explain
    the Jiva's contact with Prakriti. He says the Jiva sinks under self-consciousness
    and illusion but rises when freed, beholds the Supreme, becomes identified with
    it, gains omniscience, and is freed from rebirth. Viswavasu praises the teaching
    as true, excellent, and productive of emancipation.
  language: English
  quote_policy: summarized
