canonical_text:
  quote: ''
  summary: Brahman commands Death to destroy living creatures. Death resists the command,
    remains silent, departs, and performs extreme austerities at several sacred places.
    After repeated refusals, Brahman assures her she will incur no demerit, that diseases
    will afflict beings, and that Death will operate among all sexes. Her tears become
    diseases, and Desire and Wrath are dispatched at beings' final hours. The passage
    ends with instruction that the wise should not grieve, since beings go to another
    world and return, and the life-wind passes into new bodies.
  language: English
  quote_policy: summarized
