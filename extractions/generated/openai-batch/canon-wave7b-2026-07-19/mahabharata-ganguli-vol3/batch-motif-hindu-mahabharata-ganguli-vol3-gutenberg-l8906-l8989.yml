canonical_text:
  quote: ''
  summary: Dhananjaya vows to kill Karna and Karna's son, declares his own unmatched
    martial power, and proceeds to battle to rescue Bhima. Dhritarashtra asks Sanjaya
    how the fighting unfolded. Sanjaya describes the armies clashing in storm imagery,
    widespread killing, several paired encounters, Uttamauja's killing of Sushena,
    Karna's grief and retaliation, Shikhandi's refusal to strike the carless Kripa,
    Drona's son's rescue of Kripa, and Bhima scorching enemy troops with arrows.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dhananjaya says he will slay Karna and Karna's son, win victory, bring joy
