canonical_text:
  quote: ''
  summary: A sequence of translator's notes explains yogic physiology, the withdrawal
    and self-vision of the soul, the relation of gross and subtle bodies to death
    and absorption into Brahma, creation by the Primeval Deity and sages, the Pauranic
    eclipse explanation involving Rahu, rules of pupil-preceptor conduct, and procreation
    as gratification of Creator or ancestors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The term Srotas is explained as a duct or channel and compared to a principal
    artery or aorta.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Works on yoga are said to teach that the main duct can be brought under the
    control of the will.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The soul may be withdrawn by volition from the physical system into the brain,
    which yogins call a lotus of a thousand leaves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the soul is withdrawn into the brain, the living creature is described
    as becoming free from food and sleep and living age after age in divine contemplation
    and beatitude.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In an advanced stage of yoga, one is said to behold one's Soul, or to realize
    a double existence in which the Soul surveys itself internally; the note cautions
    that this may be figurative language.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The commentator explains color terms as attributes and relates social orders
    to Sattwa, Rajas, and Tamas.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Eternal creation is attributed to the yoga or mental action of the Primeval
    Deity, while visible and tangible objects are attributed to ancient sages; life,
    primal matter, and space are attributed to divine fiat.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Karma-sannyasa is explained as renunciation of acts, especially sacrifices
    and other scriptural rites.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The gross world is perceived by ordinary senses, while a subtle world can
    be perceived by senses sharpened through yoga.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: At death the gross body dissolves, while the subtle body or Linga-sarira remains
    and must also be destroyed before absorption into Brahma.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Heavenly felicity is described as not everlasting because it is limited by
    the amount of merit achieved.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Pauranic explanation of solar and lunar eclipses is that Rahu seeks to
    devour the Sun and Moon.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: A pupil is said not to solicit instruction but to attend when called by the
    preceptor.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: Procreation is said to gratify the Creator, or in a common formulation the
    Pitris or deceased ancestors.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: A rite, a vow about food, and visiting sacred waters are given as examples
    in explaining ritual terms.
  category: action
  evidence_refs:
  - ev:12
