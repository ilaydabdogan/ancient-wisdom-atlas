canonical_text:
  quote: ''
  summary: Vyasa teaches about obligatory acts for Brahmanas, debates over the causes
    of action, the yogic view of Brahma as universal cause, the superior penance and
    righteousness of the Krita Yuga, caste-specific sacrifices and duties, decline
    of Vedas and social duties across later Yugas, and Time as the producer, grower,
    devourer, destroyer, and ruler of creatures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vyasa states that prescribed acts for Brahmanas are obligatory and that acts
    ordained to induce knowledge should be treated as obligatory rather than optional.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists differing views about the causes of acts, including Exertion,
    Necessity, Nature, Time, and combinations of these.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some performers of acts are described as holding multiple positions about
    whether objects exist, do not exist, or cannot be so described.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Yogins are said to behold Brahma as the universal cause.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Men of the Treta, Dwapara, and Kali Yugas are described as inspired with doubts,
    while men of the Krita Yuga are devoted to penances, tranquil in soul, and righteous.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the Krita Yuga, all men regard the Richs, Samans, and Yajuses as identical
    despite apparent diversity.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Penance is said to bring the fruition of all desires and to enable attainment
    of a state associated with creating the universe and mastery over all things.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Brahma is described as declared in the Vedas and Vedanta, yet inconceivable
    even to those familiar with those declarations and not beholdable by acts.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Different sacrifices are assigned to Brahmans, Kshatriyas, Vaisyas, and Sudras;
    observance of duty and study make one a Dwija, and friendship toward all creatures
    is tied to becoming a Brahmana.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: At the beginning of Treta the Vedas, sacrifices, caste divisions, and modes
    of life existed fully, but decline is described in Dwapara and perplexity or near-disappearance
    in Kali.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: In the later declining age, duties disappear, people are afflicted by iniquity,
    the nourishing attributes of kine, earth, water, and herbs disappear, and mobile
    and immobile objects change for the worse.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Vedas are compared to heavenly showers that cause earthly products to
