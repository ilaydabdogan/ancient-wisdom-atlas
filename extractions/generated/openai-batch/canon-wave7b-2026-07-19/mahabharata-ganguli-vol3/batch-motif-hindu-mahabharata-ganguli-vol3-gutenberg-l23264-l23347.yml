canonical_text:
  quote: ''
  summary: Gandhari confronts Bhima over the unfair slaying of Duryodhana and the
    blood of Duhshasana. Bhima justifies his acts by fear, prior wrongs, and a vow
    linked to Draupadi’s humiliation. Gandhari laments the destruction of her sons
    and questions why none was spared. Yudhishthira approaches her in fear and asks
    to be cursed; her veiled glance injures his toenail, frightening the Pandavas.
    Gandhari then comforts them, and Kunti reunites with her wounded sons while Draupadi
    laments the loss of her children.
  language: English
  quote_policy: summarized
