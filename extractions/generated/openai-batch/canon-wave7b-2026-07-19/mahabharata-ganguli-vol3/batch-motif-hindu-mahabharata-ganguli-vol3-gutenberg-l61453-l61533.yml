canonical_text:
  quote: ''
  summary: Narayana discloses to Narada a sequence of past and future appearances,
    including Rama, Krishna, and other forms, describes slaying or defeating many
    adversaries for the good of the worlds, restoring the Vedas, absorbing Dwaraka
    and the Sattwatas into himself, and returning prior manifestations into his Prakriti.
    Bhishma then reports Narayana's disappearance and Narada's transmission of the
    Pancharatra teaching, after which Yudhishthira questions Brahman's lack of direct
    knowledge of Narayana's revealed form.
  language: English
  quote_policy: summarized
