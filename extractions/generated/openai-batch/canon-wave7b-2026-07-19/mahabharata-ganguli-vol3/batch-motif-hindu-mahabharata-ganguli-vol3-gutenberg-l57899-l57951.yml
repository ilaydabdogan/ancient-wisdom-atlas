canonical_text:
  quote: ''
  summary: Yajnavalkya answers a king’s question about Supreme Brahma and recounts
    how, through penance and devotion, he received the Yajushes from Surya. Surya
    caused Saraswati, described as the essence of speech, to enter Yajnavalkya’s body,
    producing a burning ordeal followed by cooling in water. Surya foretold inward
    illumination of the Vedas and Satapatha texts and the path to Emancipation. Yajnavalkya
    later invoked Saraswati, made offerings to Saraswati and Surya, received the Satapatha
    Brahmanas in mental vision, taught disciples, and disputed Dakshina with his maternal
    uncle at a royal sacrifice.
  language: English
  quote_policy: summarized
