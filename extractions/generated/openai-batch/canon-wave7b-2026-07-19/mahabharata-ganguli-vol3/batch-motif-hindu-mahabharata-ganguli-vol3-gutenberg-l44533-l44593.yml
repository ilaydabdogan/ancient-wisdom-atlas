canonical_text:
  quote: ''
  summary: Manu teaches that the subtle spirit detaches from the inactive body in
    deep slumber or death; that an unperturbed mind and senses allow the Soul to be
    seen by Understanding; that ignorance, delusion, desire, and acts bind one to
    worldly objects; and that restraint, knowledge, and inward withdrawal lead toward
    Brahma or the Supreme.
  language: English
  quote_policy: summarized
