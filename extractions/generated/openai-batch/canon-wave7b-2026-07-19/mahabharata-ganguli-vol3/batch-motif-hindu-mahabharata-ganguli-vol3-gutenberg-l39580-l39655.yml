canonical_text:
  quote: ''
  summary: A jackal urges grieving kinsmen not to abandon a dead child, citing stories
    of dead children restored to life and suggesting a sage or deity may help them.
    The mourners return and lament over the child. A vulture then tells them that
    death is universal and final unless a great deity grants a boon, and urges righteous
    conduct rather than grief. The mourners depart, leaving the body at the crematorium,
    but the jackal again persuades them to stay by appealing to grief, hope, and affection.
    Bhishma explains that the jackal speaks agreeable falsehoods for its own purpose
    as a crematorium-dwelling scavenger.
  language: English
  quote_policy: summarized
