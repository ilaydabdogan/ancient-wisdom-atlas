canonical_text:
  quote: ''
  summary: Gandhari addresses Krishna while surveying slain warriors on the battlefield.
    She describes Karna, the lord of Avanti, Bahlika, and Jayadratha lying dead, their
    bodies bloodied or exposed to scavenging creatures. Wives and female kin lament
    the fallen men; Karna’s wife recalls a curse and the sinking of his chariot wheel,
    and Duhshala searches for Jayadratha’s head.
  language: English
  quote_policy: summarized
