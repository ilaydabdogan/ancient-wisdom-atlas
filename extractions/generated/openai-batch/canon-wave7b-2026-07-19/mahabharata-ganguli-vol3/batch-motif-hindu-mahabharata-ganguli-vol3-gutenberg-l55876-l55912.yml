canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma to explain the difference between Sankhya and
    Yoga. Bhishma says adherents of each praise their own system and present reasons
    for its superiority. Yoga is associated with belief in God and evidence addressed
    to direct sense perception; Sankhya is associated with scriptural evidence and
    true knowledge leading to dissociation from worldly objects and emancipation.
    Bhishma approves both systems, saying both can lead to the highest end when properly
    practiced and both recommend purity, compassion, and vows, though their scriptural
    paths differ. Yudhishthira then asks why their scriptures differ if their practices
    and results are the same.
  language: English
