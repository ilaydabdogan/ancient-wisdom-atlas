canonical_text:
  quote: ''
  summary: Indra instructs King Mandhatri that Kshatriya duties are foremost because
    they protect subjects, sustain other orders, enforce justice, and preserve the
    world. Mandhatri asks what duties should be imposed on various named peoples and
    robber tribes living under Arya kings. Indra replies that even robber tribes should
    serve elders, recluses, and kings, follow Vedic rites, perform ancestor sacrifices,
    dig wells, give water and other gifts, support family and kin, avoid injury, speak
    truth, restrain anger, and perform prescribed offerings. Mandhatri then observes
    that wicked men may live disguised among all four orders and modes of life.
  language: English
  quote_policy: summarized
