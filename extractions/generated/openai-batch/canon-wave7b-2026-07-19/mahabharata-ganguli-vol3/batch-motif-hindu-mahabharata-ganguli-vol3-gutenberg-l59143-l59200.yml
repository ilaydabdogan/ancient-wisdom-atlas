canonical_text:
  quote: The acts that one does, follow one even when one runs fast.
  summary: Yudhishthira asks Bhishma about the efficacy of gifts, sacrifices, penances,
    and dutiful service. Bhishma answers with a teaching on evil understanding, righteous
    conduct, rebirth, unavoidable consequences of deeds, fearful and happy paths after
    death, purification by penance, and the hidden course of the righteous.
  language: English
  quote_policy: quoted
