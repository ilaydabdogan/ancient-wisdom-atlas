canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma to recount a dispute involving Time, Mrityu,
    Yama, Ikshvaku, and a Brahmana. Bhishma begins an old history about a Brahmana
    reciter at Himavat who performs long austerities and is visited by Savitri/Gayatri,
    then by Dharma, Time, Yama, and Mrityu. The Brahmana receives boons related to
    recitation and Samadhi, is promised exalted regions, but refuses to abandon his
    body or go to heaven, preferring recitation.
  language: English
  quote_policy: summarized
