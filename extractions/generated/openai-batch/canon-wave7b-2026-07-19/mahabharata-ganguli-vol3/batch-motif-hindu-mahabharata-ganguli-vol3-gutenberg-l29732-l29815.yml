canonical_text:
  quote: At first there was no sovereignty, no king, no chastisement, and no chastiser.
  summary: 'Bhishma describes the first origin of sovereignty in the Krita age: humans
    initially protected one another righteously, then error, covetousness, lust, anger,
    sexual disorder, indiscriminate speech, and moral confusion arose. The Vedas and
    righteousness disappeared, frightening the gods, who appealed to the divine Grandsire.
    Brahma promised to act for the good of all and composed an enormous treatise covering
    virtue, profit, pleasure, emancipation, chastisement, political counsel, treaties,
    war, armies, poisons, roads, encampments, weapons, and military discipline.'
  language: English
  quote_policy: quoted
