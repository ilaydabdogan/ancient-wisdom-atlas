canonical_text:
  quote: '"Without doubt, one may, by behaviour alone, conquer the three worlds."'
  summary: Yudhishthira asks Bhishma how virtuous behaviour is acquired and recognized.
    Bhishma answers by recounting how Duryodhana, grieving at Yudhishthira's prosperity,
    asked Dhritarashtra a similar question. Dhritarashtra teaches that virtuous behaviour
    brings prosperity and sovereignty, then cites an old narrative in which Indra
    seeks the source of felicity from Vrihaspati, Bhargava, and finally Prahlada,
    approaching Prahlada in the form of a Brahmana and acting as a disciple.
  language: English
  quote_policy: quoted
