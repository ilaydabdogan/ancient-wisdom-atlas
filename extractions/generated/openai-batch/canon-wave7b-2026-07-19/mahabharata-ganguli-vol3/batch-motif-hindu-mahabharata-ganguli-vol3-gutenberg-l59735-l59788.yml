canonical_text:
  quote: The stain of the Vedas is the suspension of their recitation.
  summary: Bhishma recounts that Vyasa's disciples, with their teacher's permission,
    leave the mountain for Earth to subdivide and teach the Vedas and to officiate
    sacrifices. After their departure, Vyasa remains silent in his asylum with his
    son. Narada arrives, observes that the mountain has lost beauty without Vedic
    sound, and urges Vyasa and his son to recite the Vedas so as to dispel fears from
    Rakshasas.
  language: English
  quote_policy: quoted
