canonical_text:
  quote: It is by liberating oneself from acts that one succeeds in entering into
    Brahma.
  summary: Manu teaches that liberation from attachment to acts and their fruits leads
    toward Brahma. He distinguishes ritual action and its fruits from knowledge, uses
    images of sight, hazards, and fish in water to explain ignorance and karmic return,
    and describes the highest reality as beyond sensory grasp and ordinary categories.
  language: English
  quote_policy: quoted
