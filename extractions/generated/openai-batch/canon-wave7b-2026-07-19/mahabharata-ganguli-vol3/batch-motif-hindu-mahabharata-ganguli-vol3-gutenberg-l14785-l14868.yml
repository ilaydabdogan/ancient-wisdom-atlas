canonical_text:
  quote: ''
  summary: Sanjaya describes Duryodhana's fierce battlefield performance, his arrow-storm
    against the Pandavas, counterattacks by named Pandava warriors, the rallying of
    the Dhartarashtras, and several paired combats among warriors. The passage repeatedly
    uses similes involving Rudra, rain-clouds, an ocean roar, Shakra and the Asura
    Vala, infuriated elephants, and an embodied being contending with the five senses.
  language: English
  quote_policy: summarized
