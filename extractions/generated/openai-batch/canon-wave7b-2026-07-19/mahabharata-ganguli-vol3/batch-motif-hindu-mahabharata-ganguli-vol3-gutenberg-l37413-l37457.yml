canonical_text:
  quote: A foe becomes a friend and a friend also becomes a foe.
  summary: Yudhishthira asks Bhishma how a king should act when surrounded by many
    enemies and uncertain friends. Bhishma answers that circumstances can reverse
    friends and foes, and that a king must attend to time and place, making intelligent
    friends, making peace with foes when necessary to preserve life, or making war
    as circumstances require. He introduces an old story about a cat and a mouse at
    the foot of a banian tree.
  language: English
  quote_policy: quoted
