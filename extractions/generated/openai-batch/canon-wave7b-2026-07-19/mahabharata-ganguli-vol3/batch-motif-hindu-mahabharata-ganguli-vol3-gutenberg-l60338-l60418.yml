canonical_text:
  quote: Ascending then from the breast of the Kailasa mountain, he soared into the
    sky.
  summary: Bhishma narrates how Suka, son of Vyasa, practices Yoga on a mountain summit,
    beholds his own soul free from attachments, receives Narada's permission, ascends
    from Kailasa into the sky, identifies with the elements of space and wind, is
    honored by beings of earth and heaven, and asks cosmic and natural entities to
    answer his father if Vyasa calls after him.
  language: English
  quote_policy: quoted
