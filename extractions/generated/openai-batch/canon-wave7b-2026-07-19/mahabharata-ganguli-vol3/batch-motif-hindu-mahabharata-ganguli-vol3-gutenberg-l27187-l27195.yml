  quote: Rise up, O king, and bear the burthen of this thy ancestral kingdom
  summary: An unnamed past figure is described as having performed many gift-filled
    sacrifices, gratified the gods and the Pitris, produced many sons whose descendants
    multiplied the race, and then died after many years. The addressed king is urged
