canonical_text:
  quote: ''
  summary: After being addressed and urged by Krishna, Vyasa, Devasthana, Jishnu,
    and others, Yudhishthira casts off grief, regains peace of mind, worships gods
    and Brahmanas, and enters the city in a sanctified white car. His brothers and
    allies attend him with reins, umbrella, fans, vehicles, and retinue. The city
    is decorated with flowers, banners, incense, perfumes, water-filled jars, and
    maidens, and the king enters through an adorned gate amid public praise.
  language: English
  quote_policy: summarized
