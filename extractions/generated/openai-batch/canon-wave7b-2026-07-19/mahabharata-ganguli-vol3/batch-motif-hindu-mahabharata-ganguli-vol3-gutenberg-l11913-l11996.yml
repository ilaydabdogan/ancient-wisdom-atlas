  quote: ''
  summary: After Karna's death, Duryodhana and the Kauravas lament and withdraw. Karna's
    corpse is described as radiant, golden, solar, fiery, and tree-like. The passage
    praises Karna's generosity, states that he attained heaven, and reports cosmic
    and natural portents at his fall before noting Arjuna's decapitation of him and
    the cries heard across heaven, sky, and earth.
  language: English
