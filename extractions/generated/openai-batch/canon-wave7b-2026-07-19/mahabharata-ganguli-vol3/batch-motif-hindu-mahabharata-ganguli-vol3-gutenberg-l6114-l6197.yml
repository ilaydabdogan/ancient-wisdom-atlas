canonical_text:
  quote: ''
  summary: Sanjaya reports that Arjuna, with Krishna as his driver, fights the Samsaptakas
    and related forces. Susharma wounds Arjuna, Krishna, and Arjuna's standard; the
    ape on the standard roars and frightens the army. Arjuna and Krishna blow conches,
    and Arjuna invokes the Naga weapon to bind enemies with serpent-like bonds. Susharma
    counters with the Sauparna weapon, bringing birds that devour or disperse the
    snakes. After being wounded and briefly believed slain, Arjuna recovers, invokes
    the Aindra weapon, and slaughters many enemies.
  language: English
  quote_policy: summarized
