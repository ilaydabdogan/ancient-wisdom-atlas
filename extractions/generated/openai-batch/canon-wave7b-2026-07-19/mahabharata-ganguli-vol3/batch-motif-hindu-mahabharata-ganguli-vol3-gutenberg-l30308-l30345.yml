canonical_text:
  quote: ''
  summary: Bhishma instructs a royal addressee on the proper and improper conduct
    of Brahmanas, the consequences of fallen conduct, the ritual ineffectiveness of
    offerings made to impure recipients, the virtues of a true Brahmana, and the dependence
    of religious order on Vishnu's grace.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhishma speaks the teaching to a royal addressee.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Drawing the bow-string, destroying foes, agriculture, trade, tending cattle,
    and serving others for wealth are described as improper for a Brahmana.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: An intelligent Brahmana in domestic life should perform the six Vedic acts,
    and retirement to the woods is praised after domestic duties are discharged.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Brahmana is told to avoid royal service, wealth from agriculture, sustenance
    from trade, crooked behavior, companionship outside wedded wives, and usury.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Brahmana who falls from duties, becomes wicked, marries a Sudra woman, becomes
    vile in conduct, becomes a dancer or village servant, or performs other improper
    acts is said to become a Sudra or equal to a Sudra.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Such Brahmanas are to be assigned a place among Sudras on feeding occasions
    and discarded in worship of the Gods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Food dedicated to the gods and Pitris and given to Brahmanas who have transgressed
    restraints, become impure, pursued wicked or cruel acts, or fallen from duties
    is said to confer no merit on the giver.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Self-restraint, purity, and simplicity are stated as Brahmana duties, and
    the true Brahmana is described by qualities such as good behavior, compassion,
    patience, simplicity, mildness, non-cruelty, and forgiveness.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The four modes of life are said to have been laid down by Brahman for the
    Brahmana.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Men seeking virtue are said to seek assistance from Sudras, Vaisyas, and Kshatriyas;
    if those three orders do not adopt peaceful duties, Vishnu does not extend grace
    to them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: If Vishnu is not pleased, the passage says that heavenly happiness, merit
    from the duties of the four orders, the declarations of the Vedas, sacrifices,
    religious acts, and duties of the modes of life become lost.
  category: sequence
  evidence_refs:
  - ev:7
