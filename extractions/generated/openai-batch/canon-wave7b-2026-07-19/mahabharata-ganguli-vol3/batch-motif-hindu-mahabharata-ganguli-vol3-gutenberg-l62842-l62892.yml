- id: obs:3
  text: Narada travels from White Island to Meru, reflects on the length and safe
    completion of his journey, then proceeds toward Gandhamadana and alights at the
    Vadari retreat after traversing the skies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Vadari, Narada sees Nara and Narayana, described as ancient deities and
    foremost Rishis practicing penances, observing high vows, and worshipping their
    own selves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nara and Narayana are described as bearing Sreevatsa marks, matted locks,
    intense effulgence, swan's-foot marks on their palms, discus marks on their soles,
    broad chests, long arms, four arms, sixty teeth, deep voices, and handsome features.
  category: attribute
  evidence_refs:
