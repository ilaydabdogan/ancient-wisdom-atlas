canonical_text:
  quote: ''
  summary: Vaisampayana introduces a Narayana-centered narrative and invokes Vyasa.
    Narada, after seeing Hari/Paramatma at White Island, travels by Meru and Gandhamadana
    to the Vadari retreat. There he meets the paired Rishis Nara and Narayana, who
    are described with extraordinary bodily marks and radiance. They exchange reverent
    greetings, perform rites, host Narada with ritual water and Arghya, and ask whether
    he has seen the eternal Paramatma, their source.
  language: English
  quote_policy: summarized
