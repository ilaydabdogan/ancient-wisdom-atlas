canonical_text:
  quote: ''
  summary: 'The passage consists of translator''s notes explaining philosophical terms
    and images: the qualities of Sattwa, Rajas, and Tamas; the meaning of Durga as
    an inaccessible wilderness; a water-jar used as a buoy; Sankhya knowledge and
    withdrawal from external objects; questions about consciousness in emancipation;
    dream perception by the Soul; Samadhi, Jivan-mukti, and Videha-kaivalya; and Brahma
    as non-dual knowledge.'
  language: English
  quote_policy: summarized
