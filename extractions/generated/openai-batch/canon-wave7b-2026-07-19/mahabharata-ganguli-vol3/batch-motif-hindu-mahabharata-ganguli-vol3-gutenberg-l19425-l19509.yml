canonical_text:
  quote: ''
  summary: Vasudeva tells Dhananjaya that Bhima is stronger than Duryodhana but less
    skilled, and that Bhima must use deception to win and fulfill his vow to break
    Duryodhana's thighs. He cites divine precedents for deception and warns that a
    defeated warrior who returns to fight is dangerous. Dhananjaya signals Bhima by
    striking his own left thigh. Bhima and Duryodhana duel with maces, circle one
    another, clash, rest, bleed, and resume. Bhima then uses a ruse, hurls his mace,
    misses when Duryodhana moves away, and is struck by Duryodhana but sustains himself.
  language: English
  quote_policy: summarized
