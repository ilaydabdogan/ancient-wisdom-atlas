canonical_text:
  quote: ''
  summary: Vasudeva rebukes Duryodhana as slain because of his wrongful acts against
    the Pandavas and their allies. Duryodhana answers that he has fulfilled royal
    and warrior duties, has obtained death in battle, and is going to heaven with
    his kin. Celestial beings honor him with flowers, music, song, praise, fragrant
    breezes, and a clear sky. The Pandavas become ashamed and grieve over cries that
    several great warriors were slain unrighteously. Krishna then tells them that
    fair fighting could not have killed those warriors, says he used illusion and
    deceit for their success, cites the gods' slaying of Asuras by contrivance, and
    directs the victors to depart; they celebrate with roars and conch-blasts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vasudeva tells Duryodhana that he has been slain with brothers, sons, kinsmen,
    friends, and followers because of the sinful path he followed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vasudeva lists alleged wrongs by Duryodhana, including refusal to give the
    Pandavas their paternal share, poisoning Bhimasena, attempting to burn the Pandavas
    and their mother in the lac palace, persecuting Yajnasena's daughter during the
    gambling episode, unfairly defeating Yudhishthira at dice, the persecution by
    Jayadratha, and the killing of Abhimanyu when surrounded by many warriors.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Duryodhana replies that he studied, gave gifts, ruled the Earth, overcame
    enemies, enjoyed great prosperity, obtained death in battle as a Kshatriya, and
    is going to heaven with his well-wishers and younger brothers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Duryodhana's words, fragrant flowers fall from the sky, Gandharvas play
    instruments, Apsaras sing his glory, Siddhas praise him, fragrant breezes blow,
    the quarters become clear, and the firmament appears blue.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Pandavas headed by Vasudeva become ashamed at the worship offered to Duryodhana
    and grieve when invisible beings cry that Bhishma, Drona, Karna, and Bhurishrava
    were slain unrighteously.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Krishna tells the Pandavas that the great warriors and Duryodhana could not
    have been slain in fair battle, and that he repeatedly used powers of illusion
    and diverse means so that they could be killed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Krishna states that when enemies are numerous, destruction should be brought
    about by contrivances and means, and says the gods followed that way in slaying
    the Asuras.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Krishna says evening has come and instructs the kings to return to their tents;
    the Pandavas and Pancalas respond with delight, roar like lions, and blow their
    conchs, while Jadava blows Panchajanya.
  category: sequence
  evidence_refs:
  - ev:6
