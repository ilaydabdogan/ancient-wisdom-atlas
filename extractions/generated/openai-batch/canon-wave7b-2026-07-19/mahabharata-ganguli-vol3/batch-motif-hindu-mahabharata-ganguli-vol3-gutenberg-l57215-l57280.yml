canonical_text:
  quote: ''
  summary: A teacher explains emancipation as knowledge of the self as distinct from
    Prakriti and as knowledge of Brahma or the Supreme Soul. The passage says the
    indwelling 'twenty-fifth' takes on the qualities of what it unites with. The teacher
    then instructs King Karala about who may receive this high knowledge, who must
    not receive it, and recounts having received it from Hiranyagarbha or Brahman
    before transmitting it to the king.
  language: English
  quote_policy: summarized
