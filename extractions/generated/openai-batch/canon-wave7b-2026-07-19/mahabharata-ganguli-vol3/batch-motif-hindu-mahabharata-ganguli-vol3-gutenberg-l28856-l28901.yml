canonical_text:
  quote: ''
  summary: In a time of disorder, Earth sinks because the weak are oppressed and virtuous
    Kshatriya protection is absent. Kasyapa holds Earth on his lap, and Earth asks
    him to appoint a king. Earth identifies hidden Kshatriya survivors raised or protected
    in various places, including among women, animals, sages, mountains, the Ganga,
    Ocean, artisans, and goldsmiths. Kasyapa seeks them out and installs them as kings,
    from whom existing Kshatriya races descend. The account is framed as Vasudeva
    speaking to Yudhishthira.
  language: English
  quote_policy: summarized
