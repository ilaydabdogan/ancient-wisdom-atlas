canonical_text:
  quote: O Naga, relying on the Jiva-soul, I desire to attain to the Supreme Soul
    which is the end of the Jiva-soul.
  summary: Bhishma narrates that a righteous Naga, Padmanabha, goes to meet the Brahmana
    Dharmaranya, who is waiting on the banks of the Gomati. Dharmaranya has come to
    see Padmanabha, has been reciting the Vedas and practicing Yoga while waiting,
    and wishes to ask about attaining the Supreme Soul.
