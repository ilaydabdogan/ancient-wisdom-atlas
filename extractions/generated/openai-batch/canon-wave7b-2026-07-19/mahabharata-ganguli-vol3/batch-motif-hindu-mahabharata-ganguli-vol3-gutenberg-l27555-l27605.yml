canonical_text:
  quote: ''
  summary: A holy Rishi instructs Yudhishthira on expiations for sins, including fasting,
    public confession, wet-clothes wandering, sleeping on ashes, recitation of the
    Gayatri, austerity, silence, and repeated ablutions. He teaches that acts yield
    good or bad consequences in this world and the other world, that some sins have
    expiations while heinous sins do not, and that expiatory ordinances apply to the
    faithful. He reassures Yudhishthira that killing foes in royal duty does not require
    him to cast away his life, though he may perform expiation if he still feels sinful.
    Vaisampayana then reports Yudhishthira's reflective reply.
  language: English
  quote_policy: summarized
