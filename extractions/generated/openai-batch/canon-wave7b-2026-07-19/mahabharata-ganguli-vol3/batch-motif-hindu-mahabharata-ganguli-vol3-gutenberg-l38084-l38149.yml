canonical_text:
  quote: It is Time that does every act.
  summary: Brahmadatta argues that Time causes all acts, birth, death, welfare, and
    suffering, and asks Pujani to stay without fear after forgiving her. Pujani rejects
    this as insufficient, citing revenge, divine battles, medical treatment, religious
    merit, grief, her child’s killing by Brahmadatta’s son, and her own retaliatory
    injury. She describes the fear birds have of humans, the universality of suffering,
    the permanence of mutual injury, and the danger of trusting a foe. Brahmadatta
    replies that no goal can be fulfilled without trust and that fear makes one live
    like the dead.
  language: English
  quote_policy: quoted
