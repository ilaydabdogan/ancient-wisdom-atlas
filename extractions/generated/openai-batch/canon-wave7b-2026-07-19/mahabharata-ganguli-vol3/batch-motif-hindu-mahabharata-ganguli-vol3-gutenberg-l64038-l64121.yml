- id: obs:1
  text: Brahma addresses his son and says he will explain how Purusha is indicated.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Purusha is described as eternal, immutable, undeteriorating, immeasurable,
    and pervading all things.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Purusha cannot be seen by Brahma, the son, or others through ordinary means;
    persons without self-restraint and tranquility cannot see him, while knowledge
    is named as the means of seeing him.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Purusha is bodiless, dwells in every body, and is not touched by acts performed
    by those bodies.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Purusha is described as Brahma's inner soul, the son's inner soul, and an
    all-seeing Witness within embodied creatures who marks their acts.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The universe is described as Purusha's head, arms, feet, eyes, and nose.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The body is called Kshetra, and Purusha is called Kshetrajna because he knows
    all bodies and good and bad deeds.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: Brahma says he has contemplated Purusha's cause through Sankhya and Yoga but
    cannot comprehend that cause.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Purusha is called one eternal Being and Mahapurusha, with analogies of one
    fire, one sun, one wind, and one ocean appearing or functioning in diverse forms.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: The infinite universe is said to flow from Purusha and to enter again into
    him at the time of its destruction.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: A person divests oneself of attributes by casting off bodily and sensory consciousness,
    good and bad acts, and truth and falsehood.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: A person who realizes Purusha's subtle existence in the fourfold form of Aniruddha,
    Pradyumna, Sankarshana, and Vasudeva attains tranquility and enters into or identifies
    with Purusha.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Purusha is called the Supreme Soul, Narayana, the universal soul, and the
    one Purusha; he is said to be unaffected by the fruits of acts like a lotus leaf
    untouched by water.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: The acting Soul is distinguished from the Supreme Soul and is said to attain
