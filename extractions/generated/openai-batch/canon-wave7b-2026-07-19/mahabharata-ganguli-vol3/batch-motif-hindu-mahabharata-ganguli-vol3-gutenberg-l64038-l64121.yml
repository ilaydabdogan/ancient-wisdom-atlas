canonical_text:
  quote: ''
  summary: 'Brahma instructs his son about the Supreme Purusha: an eternal, immeasurable,
    all-pervading inner witness who is bodiless yet present in bodies, the cosmic
    source and return-point of the universe, and identifiable with Narayana and a
    fourfold divine form. The passage explains knowledge, self-restraint, renunciation
    of acts, and tranquility as means toward realizing and identifying with that Supreme
    Soul.'
  language: English
  quote_policy: summarized
