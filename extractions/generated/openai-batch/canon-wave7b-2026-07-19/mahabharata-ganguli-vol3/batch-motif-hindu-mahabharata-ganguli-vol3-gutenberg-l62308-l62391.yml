canonical_text:
  quote: ''
  summary: Viswarupa consumes sacrificial offerings and divine energy, weakening the
    gods. Brahma directs the gods to obtain the bones of the ascetic Dadhichi, who
    willingly casts off his body; Dhatri fashions the Thunderbolt from the bones,
    and Indra uses it to slay Viswarupa and Vritra. Because of doubled Brahmanicide,
    Indra abandons heaven and hides in a lotus stalk in Manas lake, causing cosmic
    disorder. The gods and Rishis enthrone Nahusha, who then claims Sachi, Indra’s
    spouse. Sachi delays him with a vow, consults Vrihaspati, invokes the goddess
    Upasruti, and is shown Indra’s hiding place.
  language: English
  quote_policy: summarized
