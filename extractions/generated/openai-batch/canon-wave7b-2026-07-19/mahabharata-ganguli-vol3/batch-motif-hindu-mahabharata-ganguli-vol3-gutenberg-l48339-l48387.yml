  quote: ''
  summary: The speaker explains the Sankhya account of Manifest and Unmanifest, describes
    the manifest soul as born from the Unmanifest or Supreme Soul, and presents disciplined
    detachment, equanimity, truthfulness, restraint, and freedom from desire as the
    means by which a Yogin approaches Brahman and wins Emancipation. The passage then
    states that Yoga likewise leads to Emancipation and that Sankhya and Yoga are
    ultimately not different in this respect.
