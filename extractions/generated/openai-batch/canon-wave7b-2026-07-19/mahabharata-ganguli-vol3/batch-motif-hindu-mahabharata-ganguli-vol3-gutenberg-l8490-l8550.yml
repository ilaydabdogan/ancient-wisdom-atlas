  quote: ''
  summary: Vasudeva praises Arjuna’s unmatched skill with the Gandiva, recalls formidable
    warriors he has faced, states that Brahma created the bow, and then urges Arjuna
    not to underestimate Karna. Karna is described as immensely powerful, possibly
    Arjuna’s equal or superior, hostile to the Pandavas, and the key support of Duryodhana;
    Vasudeva exhorts Arjuna to slay him and send him to Yama.
  language: English
  quote_policy: summarized
