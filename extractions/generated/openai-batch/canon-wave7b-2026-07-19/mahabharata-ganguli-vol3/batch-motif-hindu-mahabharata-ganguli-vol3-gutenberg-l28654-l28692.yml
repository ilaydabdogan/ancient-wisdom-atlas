canonical_text:
  quote: ''
  summary: Vaisampayana reports that Krishna, Yudhishthira, Kripa, the four Pandavas,
    and others travel to Kurukshetra and view the corpse-strewn battlefield. Krishna
    points out the five lakes of Rama, where Rama offered Kshatriya blood to his ancestors
    after repeatedly destroying the Kshatriyas. Yudhishthira asks how the Kshatriya
    order could have revived after such extermination, and Krishna begins to narrate
    the background.
  language: English
  quote_policy: summarized
