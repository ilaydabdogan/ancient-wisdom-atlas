canonical_text:
  quote: ''
  summary: The passage teaches that the Soul or Purusha dwells within the body, called
    a nine-doored edifice, and is the true knower and doer behind the senses. It uses
    analogies of a lamp, hidden fire in wood, water in rivers, and rays of the sun
    to explain the Soul’s relation to body and knowledge. It states that the Soul
    can be perceived through yoga, leaves the body in dreams, and at death passes
    from one body to another, bound and led by its former acts.
  language: English
  quote_policy: summarized
