canonical_text:
  quote: ''
  summary: After Karna is slain and the Kaurava troops flee, Krishna praises Arjuna
    and compares Karna's death to Vritra's slaughter. Krishna and Arjuna leave the
    battlefield to report Karna's death to the wounded Yudhishthira, while allied
    warriors are ordered to hold their positions. Yudhishthira receives them on a
    golden bed, infers Karna's death from their joy and wounds, and hears Krishna's
    report. Krishna declares the Pandavas safe, Karna slain, victory gained, and urges
    Yudhishthira to rule the earth.
  language: English
  quote_policy: summarized
