canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma whether a person should be regarded as the doer
    of good and bad acts. Bhishma answers by citing an old discourse between Prahlada
    and Indra. Prahlada is described as unattached, self-controlled, and tranquil
    despite being bound, fallen from his former position, and deprived of prosperity.
    Indra asks why he does not grieve. Prahlada replies that ignorance of the origin
    and destruction of beings causes stupefaction, that entities arise and cease by
    their own nature rather than by personal exertion, and that regarding oneself
    as the doer of acts reflects ignorance of truth. He attributes outcomes, qualities,
    emancipation, and knowledge of self to Nature.
  language: English
  quote_policy: summarized
