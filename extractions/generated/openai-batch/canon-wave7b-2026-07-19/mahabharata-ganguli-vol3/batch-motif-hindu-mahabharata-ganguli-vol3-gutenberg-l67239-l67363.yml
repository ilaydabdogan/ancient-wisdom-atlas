canonical_text:
  quote: ''
  summary: The footnotes explain two religious paths, Pravritti as action and Nrivritti
    as abstention; define samadhi as withdrawal of the senses into the mind with attention
    fixed on Brahma; contrast terminable heavenly or godlike states with emancipation
    and absorption into Brahma; discuss knowledge, Vedic auxiliary disciplines, and
    moksha; and summarize an episode involving Vikrita, Virupa, cow-gift merit, a
    king, and a Brahmana. They also note Vrihaspati’s concern about worshiping without
    knowledge.
  language: English
  quote_policy: summarized
