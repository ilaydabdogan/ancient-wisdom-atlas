canonical_text:
  quote: ''
  summary: A didactic passage explains that creatures experience the fruits of past
    acts across lives; Death and Time bring all beings to their end; Yoga-contemplation
    raises the Jiva from the world's ocean and unites the mind with primal Prakriti;
    purity, understanding, renunciation, gifts, faith, and earnest action are praised;
    and Bhishma reports that Janaka heard the sage's truthful teaching and gained
    happiness.
