canonical_text:
  quote: ''
  summary: At the beginning of the Sauptika-parva, Sanjaya narrates that three wounded
    warriors, later identified as Kritavarma, Kripa, and Drona's son, flee near the
    Kuru encampment after Duryodhana's fall. Dhritarashtra laments the death of his
    son and sons and asks what the surviving warriors did. Sanjaya describes their
    entry into a dense forest, their shelter beneath a vast banyan tree, the coming
    of night, and the warriors' grief and exhausted sleep on the bare earth.
  language: English
  quote_policy: summarized
