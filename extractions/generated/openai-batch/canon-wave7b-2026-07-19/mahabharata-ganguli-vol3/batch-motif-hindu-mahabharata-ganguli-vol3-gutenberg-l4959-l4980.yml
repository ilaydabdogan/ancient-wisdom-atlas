canonical_text:
  quote: ''
  summary: The passage gives a hostile characterization of the Aratta-Vahika region
    and several peoples. It describes five rivers issuing from mountains, two Pishacas
    named Vahi and Hika in the Vipasa, the Vahikas as their offspring, and a Rakshasa
    woman warning a Brahmana traveler who had come to bathe in sacred water. It further
    describes local Brahmanas and neighboring peoples as lacking Veda, knowledge,
    sacrifice, and divine acceptance of gifts.
