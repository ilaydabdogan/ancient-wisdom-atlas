canonical_text:
  quote: ''
  summary: Arjuna attacks the remaining Kuru force with Gandiva, raising dust and
    darkness that causes flight. Duryodhana challenges the Pandavas, fights them while
    unsupported, and tries to rally his mangled troops with a speech about Kshatriya
    duty, the sin of flight, Yama, and heavenly reward for battle-death. The warriors
    flee despite the speech, and the ruler of the Madras prepares to address Duryodhana.
  language: English
  quote_policy: summarized
