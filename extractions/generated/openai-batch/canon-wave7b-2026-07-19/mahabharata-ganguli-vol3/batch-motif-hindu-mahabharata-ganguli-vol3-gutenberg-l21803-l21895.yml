canonical_text:
  quote: ''
  summary: Krishna warns Yudhishthira that Bhima has gone alone against Ashvatthama,
    who possesses the world-consuming brahmashira weapon. Krishna recounts how Drona
    gave Ashvatthama the weapon knowledge with a prohibition against using it, especially
    against humans. He then recalls Ashvatthama’s earlier visit to Dvaraka, where
    Ashvatthama asked to exchange the brahmashira for Krishna’s discus, failed to
    move the discus, and admitted that he had wished to fight Krishna and become invincible.
  language: English
  quote_policy: summarized
