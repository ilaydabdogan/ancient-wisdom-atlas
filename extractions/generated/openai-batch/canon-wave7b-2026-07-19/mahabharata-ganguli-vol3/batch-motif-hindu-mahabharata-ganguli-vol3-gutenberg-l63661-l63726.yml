canonical_text:
  quote: ''
  summary: Vaisampayana explains the three dispositions of embodied creatures, links
    Sattwa and devotion to Narayana with wisdom and emancipation, describes awakening
    as dependent on divine compassion, answers Janamejaya’s question about attaining
    Purushottama, equates several doctrinal systems as parts of one whole, uses an
    ocean-wave image for knowledge returning to Narayana, recounts a teaching lineage,
    and identifies Krishna as protector, beguiler, destroyer, and cause of the universe.
  language: English
  quote_policy: summarized
