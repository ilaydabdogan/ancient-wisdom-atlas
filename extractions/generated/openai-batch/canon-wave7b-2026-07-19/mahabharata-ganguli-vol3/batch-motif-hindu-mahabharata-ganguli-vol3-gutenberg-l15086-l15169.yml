canonical_text:
  quote: ''
  summary: 'Sanjaya narrates a late battle episode: Shakuni rallies remaining horsemen
    and locates Duryodhana; Kuru warriors renew their charge; Arjuna urges Krishna
    to drive into the opposing troops and reflects that the eighteenth day of battle
    has nearly destroyed Duryodhana''s army. Arjuna laments that Duryodhana ignored
    repeated counsel for peace and says Vidura had warned that Duryodhana would not
    yield the kingdom without battle.'
  language: English
  quote_policy: summarized
