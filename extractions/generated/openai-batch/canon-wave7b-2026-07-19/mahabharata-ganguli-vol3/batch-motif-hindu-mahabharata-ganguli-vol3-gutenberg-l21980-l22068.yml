canonical_text:
  quote: '"those two weapons scorching the three worlds"'
  summary: Two celestial weapons blaze with world-threatening fire and omens. Narada
    and Vyasa intervene between them, rebuke the warriors, and counsel withdrawal.
    Arjuna withdraws his weapon because of purity and vows, while Ashvatthama cannot
    withdraw his and admits destructive intent. Vyasa warns of drought if such weapons
    are countered and directs Ashvatthama toward surrendering his head-gem in exchange
    for life.
  language: English
