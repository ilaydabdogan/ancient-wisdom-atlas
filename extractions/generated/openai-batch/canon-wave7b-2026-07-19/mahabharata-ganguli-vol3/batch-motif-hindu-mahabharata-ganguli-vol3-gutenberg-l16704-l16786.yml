canonical_text:
  quote: ''
  summary: 'Vaishampayana narrates that Daksha married his twenty-seven constellation
    daughters to Soma. Soma favored Rohini and neglected the others. After repeated
    complaints and ignored warnings, Daksha cursed Soma with phthisis, causing Soma,
    herbs, creatures, and even the celestials to waste away. Daksha then set a mitigation:
    Soma must treat his wives equally, bathe at the Sarasvati tirtha, undergo monthly
    waning and waxing, and adore Mahadeva where the Sarasvati meets the western ocean.
    Soma bathed at Prabhasa on the new moon, regained his rays, and the creatures
    rejoiced.'
  language: English
  quote_policy: summarized
