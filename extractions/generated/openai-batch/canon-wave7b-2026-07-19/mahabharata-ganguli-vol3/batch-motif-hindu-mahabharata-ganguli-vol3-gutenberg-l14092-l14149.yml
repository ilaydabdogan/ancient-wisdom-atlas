canonical_text:
  quote: ''
  summary: In a battlefield sequence, Duryodhana's driver is slain and his car runs
    wild while allies seek to rescue him. Arjuna attacks the Kaurava troops. Yudhishthira,
    described as normally mild, becomes fierce and attacks Shalya, the ruler of Madras.
    The two warriors duel with arrows; their bloodied bodies are compared to flowering
    trees, and observers cannot tell who will win the Earth. Yudhishthira disables
    Shalya's car, kills his horses and drivers, cuts down his standard, and breaks
    Duryodhana's army, after which Ashvatthama rescues Shalya and Shalya mounts another
    car.
  language: English
  quote_policy: summarized
