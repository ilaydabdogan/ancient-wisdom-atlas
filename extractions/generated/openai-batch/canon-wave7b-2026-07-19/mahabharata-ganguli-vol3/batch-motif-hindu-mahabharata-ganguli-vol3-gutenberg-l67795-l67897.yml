canonical_text:
  quote: ''
  summary: 'The passage consists of footnotes explaining doctrines of ignorance, embodiment,
    action, rebirth, detachment, the soul’s separateness, Maya, Prakriti and Purusha,
    the gunas, and emancipation. It also includes several similes and analogies: wind
    carrying dust, time producing seasons, women as symbols of Prakriti, Atharvan
    rites, and offspring compared to parasitical vermin.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ignorance is identified as the cause, while the body and senses of a particular
    existence are identified as the effect; actions then become causes for new states
    of existence.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The soul is described as unattached to the body and senses despite an apparent
    union with them, using the comparison of wind carrying dust while remaining separate
    and pure.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Vedas are said to contain declarations urging both action and abstention
    from action, with action described as a stepping stone to abstention.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Acts are presented as preparatory and purifying when not performed from desire
    for fruit by one seeking emancipation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The jiva is described as originally having knowledge alone as its attribute;
    when clothed with Ignorance, the universe is said to spring up around it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Brahma is said in the Srutis to have Knowledge and Ignorance with Maya, and
    Maya is said to attach jivas to worldly things.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Prakriti is said to bind the Soul or Kshetrajna and oblige it to take birth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A gendered analogy maps women to Prakriti and men to Souls, and says men should
    avoid women as the Soul should avoid contact with Prakriti.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Kritya is glossed as mantra-power or Atharvan ritual efficacy, and women are
    compared in the note to destructive Atharvan rites and to beings enveloped in
    Rajas.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Children are said to arise from vital seed and previous acts, while parasitical
