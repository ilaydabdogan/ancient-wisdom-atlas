canonical_text:
  quote: The world is like a plantain tree, without enduring strength.
  summary: Dhritarashtra asks Vidura how the wise free themselves from mental grief
    caused by misfortune and bereavement. Vidura replies with teachings on tranquillity,
    impermanence, equality in death, bodies as temporary dwellings or garments, karmic
    consequences, varied life spans, rebirth, and the wise attaining the highest end.
    Dhritarashtra then asks how the wilderness of the world may be known.
  language: English
  quote_policy: quoted
