canonical_text:
  quote: ''
  summary: A Brahmana host gratefully receives a learned guest's consoling instruction,
    invites him to stay overnight at sunset, and spends the night discussing Sannyasa.
    In the morning the guest is honored and dismissed, and the Brahmana leaves his
    relatives to set out for the abode of the foremost of Nagas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The host says the guest's words have relieved and gratified him, comparing
    the feeling to a load being lifted, rest after travel, a seat after standing,
    cool water, food, a long-desired son, and reunion with an anxious-loved relation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The host says he has listened attentively, reflects on the meaning of the
    guest's words, has been truly instructed, and will do what the guest commanded.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The host asks the guest to remain overnight and rest until dawn, noting that
    Surya's rays are dimmed and the god of day is descending.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Brahmana host hospitably waits upon the learned guest, and both pass the
    night happily together.
  category: action
  evidence_refs:
