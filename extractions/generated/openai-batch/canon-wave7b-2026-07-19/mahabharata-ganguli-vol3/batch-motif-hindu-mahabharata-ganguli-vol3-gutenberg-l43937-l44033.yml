canonical_text:
  quote: ''
  summary: A Brahmana insists that a king accept the fruits of his recitations because
    both have spoken words that must remain true. The Brahmana praises Truth as superior
    to sacrifice, penance, Veda, and religious observances, and describes Truth as
    the basis of cosmic order. The king objects that Kshatriyas give rather than accept
    gifts. Dharma and Heaven appear in embodied form to end the dispute, but the king
    rejects Heaven and offers his own merit. The Brahmana refuses to accept the king's
    merit because he observes abstention. The king proposes an equal exchange of merits.
    Two ungainly individuals, later named Virupa and Vikrita, appear disputing a debt
    involving the merit of a cow-gift.
  language: English
  quote_policy: summarized
