canonical_text:
  quote: ''
  summary: Sanjaya narrates a fierce mace duel between Duryodhana and Bhimasena. The
    cousins fight while covered in blood, pause from fatigue, resume with elaborate
    circular maneuvers, and are watched by gods, Gandharvas, men, and other spectators.
    Their weapons are compared to divine instruments of destruction and are said to
    produce thunderous sounds, wind, smoke, sparks, and flames. The duel is explicitly
    likened to mythic battles involving Indra, Prahlada, Vritra, and Vasava.
  language: English
  quote_policy: summarized
