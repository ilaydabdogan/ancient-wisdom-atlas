canonical_text:
  quote: ''
  summary: Gandhari accuses Krishna of allowing the Kurus and Pandavas to destroy
    one another and curses him to bring about the destruction of his own kinsmen and
    to die in the wilderness after thirty-six years. Krishna replies that only he
    can exterminate the Vrishnis and that her curse aids his purpose. He rebukes Gandhari
    for grief and for supporting Duryodhana. Dhritarashtra asks Yudhishthira for the
    number of dead and survivors, the postmortem destinies of the slain, the source
    of Yudhishthira's knowledge, and the proper rites for bodies without caretakers
    or sacred fires.
  language: English
  quote_policy: summarized
