canonical_text:
  quote: ''
  summary: Yudhishthira admonishes Bhima for coveting sovereignty and teaches that
    desire, appetite, and attachment should be conquered through renunciation, austerity,
    and knowledge. He contrasts earthly rule with detachment, cites two spiritual
    paths, recalls Janaka’s verse of non-possession, and describes Brahma-attainment
    as seeing diverse creatures as emanations of one essence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yudhishthira says Bhima is affected by discontent, attachment to earthly goods,
    absence of tranquillity, might, folly, vanity, and anxiety, and that Bhima covets
    sovereignty.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yudhishthira tells Bhima to be free from desire, prevail over joy and grief,
    attain tranquillity, and seek happiness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yudhishthira says desires cannot be filled in a day, many months, or even
    the whole of one’s life.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yudhishthira compares appetite to fire, saying fire blazes when fed with fuel
    and is extinguished when not fed, and tells Bhima to extinguish the fire in his
    stomach with little food.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Yudhishthira says Bhima should conquer his stomach first and that conquering
    the earth would follow only after that.
  category: sequence
  evidence_refs:
  - ev:2
