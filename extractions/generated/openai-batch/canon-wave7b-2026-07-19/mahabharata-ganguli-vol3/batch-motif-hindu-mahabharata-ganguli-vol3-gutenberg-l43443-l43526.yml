canonical_text:
  quote: ''
  summary: A philosophical passage classifies the properties of Goodness, Passion,
    and Darkness; distinguishes Intelligence from Soul through analogies of joined
    but distinct things; describes the Soul as witness and the senses as instruments;
    and presents restraint, renunciation, knowledge of Truth, nonattachment, and fruitless
    action as means to happiness, wisdom, purification, and Emancipation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists gladness, satisfaction, delight, happiness, and tranquillity
    as properties of Goodness; discontent, grief, cupidity, and vindictiveness as
    signs of Passion; and disgrace, delusion, error, sleep, and stupefaction as properties
    of Darkness.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person whose mind is far-reaching, cautious about desired objects, and well
    restrained is described as happy in this world and hereafter.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Intelligence and Soul are distinguished: Intelligence is said to put forth
    qualities, while Soul does not.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The relation of Intelligence and Soul is illustrated by examples of things
    united yet distinct, including a gnat with a fig and a fish with water.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The qualities are said not to know the Soul, while the Soul knows and witnesses
    the qualities.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Soul, acting through senses, mind, and understanding, is compared to a
    covered lamp that reveals surrounding objects through an aperture.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: When the rays from the senses are restrained by the mind, the Soul becomes
    manifest like a lamp burning within a covering vessel.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A person who renounces ordinary acts, practices penances, studies the Soul,
    delights in that study, and regards himself as the Soul of all creatures is said
    to acquire a high end.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A wise person is compared to an aquatic fowl moving over water without being
    drenched, and is instructed to act without grief, joy, malice, envy, or partiality.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: A person living with wisdom is compared to a spider creating threads, and
    the qualities are compared to the spider's threads.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Knowledge is compared to a full stream in which persons with filthy hearts
    purify themselves.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Knowledge of Truth is compared to reaching the other shore of a broad river;
    the passage says this knowledge brings happiness as soon as it bears fruit.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: One who knows the origin and end of creatures, casts away the triple aggregate,
    practices yoga, and restrains the senses is said to behold Truth and obtain felicity.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Acting without expectation of fruits is said to annihilate sinful acts from
    a former period, and the wise person's acts are said not to produce disagreeable
    consequences.
  category: sequence
  evidence_refs:
  - ev:7
