canonical_text:
  quote: It is conduct, however, that determines the race.
  summary: 'Yudhishthira asks how to know whether apparent tranquility reflects true
    character. Bhishma answers by recounting an old discourse between a tiger and
    a jackal: the cruel king Paurika dies and is reborn as a jackal, but the jackal
    adopts harmless, truthful, ascetic conduct in a crematorium. Other jackals urge
    him to eat carrion and live like them; he rejects their counsel, arguing that
    conduct, not birth or mode of life, determines moral worth. A tiger overhears,
    honors him as learned and pure, and offers to make him a minister.'
  language: English
  quote_policy: quoted
