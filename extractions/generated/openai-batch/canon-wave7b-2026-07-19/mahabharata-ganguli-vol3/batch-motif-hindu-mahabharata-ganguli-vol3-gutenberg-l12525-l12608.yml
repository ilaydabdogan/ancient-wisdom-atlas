canonical_text:
  quote: ''
  summary: Sanjaya narrates the Kuru army's collapse after Karna is slain by Arjuna.
    The routed troops are described through sea, animal, caravan, and weapon-loss
    images. Duryodhana orders his driver forward and vows to block Partha and avenge
    Karna. Bhima and Dhrishtadyumna destroy a division of foot-soldiers; Bhima descends
    from his car to fight on the ground with his mace. Arjuna advances with Krishna
    as charioteer, while other Pandava allies attack Shakuni.
  language: English
  quote_policy: summarized
