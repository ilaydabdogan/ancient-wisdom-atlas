canonical_text:
  quote: As a bird deserts a tree that is about to fall down upon a piece of water...
    the person freed from attachments casts off both joy and sorrow...
  summary: The passage teaches that an unattached person casts off sorrows, like a
    bird leaving a falling tree. It cites Janaka declaring that nothing of his is
    burning while Mithila burns, and says Janadeva, after hearing Panchasikha’s discourse
    and reflecting on it, cast off sorrow and attained felicity. A reader who reflects
    on the discourse is said to become free from sorrow and attain emancipation.
