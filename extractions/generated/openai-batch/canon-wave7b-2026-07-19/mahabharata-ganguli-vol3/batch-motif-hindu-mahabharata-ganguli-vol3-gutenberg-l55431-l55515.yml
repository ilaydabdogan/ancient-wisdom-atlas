  quote: ''
  summary: Parasara instructs a king on devotion to seniors, the status of the father,
    the superiority of knowledge, rules for righteous Kshatriya combat, fixed lifespan,
    proper and improper deaths, dissolution of the body into elements, rebirth shaped
    by acts and circumstances, the interim movement of Jiva, hierarchies of beings
    and wisdom, and auspicious versus inglorious modes of death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Parasara says that only those firmly devoted and submissive to seniors can
    obtain the merit attached to devotion.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the sire is the highest deity for children and is
    said to be superior to the mother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage identifies Knowledge as the highest acquisition and says that
    those who subdue the objects of the senses obtain what is highest, glossed as
    Emancipation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: A Kshatriya prince who is wounded and burned amid fiery shafts in battle is
    said to go to heavenly regions unattainable by deities.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage lists categories of persons whom a Kshatriya should not strike
    in battle, including the fatigued, frightened, disarmed, unwilling, unequipped,
    ill, youthful, old, or those crying for quarter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Kshatriya is instructed to fight an opponent of the same order who is
    equipped, ready, and in an equal position.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Death at the hands of an equal or superior is called laudable, while death
    at the hands of one sinful, low-born, or wicked is called inglorious and leading
    to hell.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that a person whose lifespan has ended cannot be rescued
    and one whose lifespan has not ended cannot be slain.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says one should not seek to extend one's own life by taking the
    lives of others.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Householders living by duties in sacred places are described as laudably laying
    down their lives on the banks of sacred streams.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: When life is exhausted, the body is said to dissolve into the five elements,
    either suddenly through accidents or through natural causes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: A person whose body is dissolved in a sacred place by an inglorious accident
    is said to receive another similar body and to continue as a traveler rather than
    reach emancipation.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage says that a new body arising from accidental death in sacred places
    becomes attached to Rudras and Pisachas.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: Learned men conversant with Adhyatma describe the body as a conglomeration
    of arteries, sinews, bones, impure matter, primal essences, senses, and sense
    objects covered by skin.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: The human form is said to arise through the force of desires from a previous
    life.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: When abandoned by its owner, the body becomes inanimate and motionless, its
    ingredients return to their natures, and it mingles with dust.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: The body reappears under circumstances determined by acts, and its next birth
    experiences the fruits of past acts.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: Jiva does not immediately take a new body after bodily dissolution; it roves
    through the sky like a spacious cloud and later takes birth after obtaining a
    new receptacle.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:19
  text: 'The passage sets out a hierarchy: soul above mind, mind above senses, mobile
    creatures above other created objects, two-legged beings above other mobile beings,
    and progressively higher ranks among regenerate, wise, soul-knowing, and humble
    persons.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:20
  text: Death is said to follow birth for all men, and creatures influenced by Sattwa,
    Rajas, and Tamas pursue finite acts.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:21
  text: A person is called righteous if death occurs when the Sun is in northern declension
    and at a sacred, auspicious time and constellation.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:22
  text: A person is also called righteous if, after cleansing sins, completing acts
    as well as possible, and refraining from causing pain, he meets death when it
    comes.
  category: action
  evidence_refs:
  - ev:9
- id: obs:23
  text: Deaths by poison, hanging, burning, robbers, or animal teeth are described
    as inglorious, and righteous persons are said not to incur such deaths.
  category: sequence
  evidence_refs:
  - ev:9
