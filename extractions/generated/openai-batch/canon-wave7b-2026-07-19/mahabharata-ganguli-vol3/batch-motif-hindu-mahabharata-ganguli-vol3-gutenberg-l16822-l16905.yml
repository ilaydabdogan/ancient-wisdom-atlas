canonical_text:
  quote: ''
  summary: Vaishampayana recounts an earlier-yuga story of three ascetic brothers,
    Ekata, Dwita, and Trita, sons of Gautama. Trita becomes preeminent in priestly
    learning. His brothers, tempted by livestock acquired through sacrificial service,
    abandon him after he falls into a deep well on the bank of the Sarasvati while
    fleeing a wolf. Trapped, Trita imagines the materials of a Soma sacrifice from
    objects in the dry well, performs the rite mentally, and his sound reaches heaven.
    Brihaspati warns the gods that Trita is sacrificing and might create other gods
    if angered. The gods come, receive their shares, grant boons, and Trita asks to
    be released from the well.
  language: English
  quote_policy: summarized
