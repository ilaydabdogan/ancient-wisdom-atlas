canonical_text:
  quote: ''
  summary: 'Vaisampayana says Vyasa relieved the grief of Yudhishthira, the eldest
    son of Pandu, who sorrowed over the slaughter of his kinsmen and had resolved
    to end his life. Vyasa introduces an old story called Asma''s discourse: Janaka,
    ruler of the Videhas, sorrowfully asks the wise Brahmana Asma how a person seeking
    good should behave amid the gain and destruction of kinsmen and wealth.'
