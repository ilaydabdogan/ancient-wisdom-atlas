canonical_text:
  quote: ''
  summary: Vrishasena, son of Karna, attacks Arjuna and Krishna. Arjuna, angered and
    invoking the earlier killing of his own son, vows to kill Vrishasena before Karna
    and the Kauravas, then cuts off Vrishasena's bow, arms, and head. Karna sees his
    son fall and advances in wrath. Krishna points out Karna's chariot, driver, banner,
    and bow, urges Arjuna to keep calm, and reminds him of divine favor from Siva
    and other gods, telling him to slay Karna as Indra slew Namuci.
  language: English
  quote_policy: summarized
