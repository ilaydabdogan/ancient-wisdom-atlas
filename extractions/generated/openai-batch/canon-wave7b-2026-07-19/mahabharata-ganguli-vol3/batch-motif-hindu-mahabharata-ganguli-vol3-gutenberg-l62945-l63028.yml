canonical_text:
  quote: ''
  summary: Nara and Narayana praise Narada for beholding Narayana in the form of Aniruddha,
    describe Narayana as the source of elemental qualities and as the ultimate refuge,
    outline the path by which liberated beings pass through Aditya and successive
    divine forms into Vasudeva, and explain their own penances at Vadari. Narada responds
    with reverence, mantra-recitation, worship, and a long residence in their Himalayan
    retreat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nara and Narayana tell Narada that he is highly favoured because he has beheld
    Narayana in the form of Aniruddha.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: They state that no one else, not even Brahma, has been able to behold that
    unmanifest and ordinarily unseen being.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: They describe a realm where the Supreme Soul performs penances, which only
    the two of them can reach, and whose splendour is compared to thousands of suns.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: They state that forgiveness, taste, heat or light, touch, sound, and mind
    arise from the illustrious Being and attach respectively to Earth, waters, the
    sun, wind, space, and Chandramas.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: They state that the place where divine Narayana resides with Knowledge alone
    as companion is called Sat, the productive cause of all things, in the Vedas.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: They describe a path for stainless beings freed from virtue and sin in which
    Aditya is the door and the bodies of entrants are consumed by his fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The same path continues with beings reduced to invisible atoms entering Aniruddha,
    then becoming mind alone and entering Pradyumna, Sankarsana or Jiva, and finally
    Paramatma, Kshetrajna, or Vasudeva.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: They state that only persons with concentrated minds, restraint, controlled
    senses, and devotion to One succeed in entering Vasudeva.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nara and Narayana say that they were born in the house of Dharma, reside in
    a spacious retreat, and practice severe penances and vows for the benefit of manifestations
    of the Supreme Deity.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After hearing them, Narada joins his hands in reverence, becomes devoted to
    Narayana, mentally recites Narayana-approved mantras, worships Narayana and the
    two rishis, and remains at Vadari on Himavat for a thousand celestial years.
  category: sequence
  evidence_refs:
  - ev:8
