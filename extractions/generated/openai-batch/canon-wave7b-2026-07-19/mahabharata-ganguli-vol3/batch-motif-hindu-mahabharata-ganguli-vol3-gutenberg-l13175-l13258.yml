canonical_text:
  quote: ''
  summary: Sanjaya reports to a monarch that the Kurus and Srinjayas enter a fierce
    battle compared to the war of gods and Asuras. The passage describes elephants,
    chariots, cavalry, infantry, weapons, noise, confusion, mutilated bodies, fallen
    animals, and a battlefield river of blood flowing toward the dead. Warriors cross
    this awful river with vehicles and animals as rafts and boats. Arjuna and Bhimasena
    stupefy the hostile army, then blow conchs and roar.
  language: English
  quote_policy: summarized
