canonical_text:
  quote: Thou art the Creator of all creatures and thou art their destroyer.
  summary: A speaker addresses a divine figure in a hymn of praise, describing the
    addressee as infinite, unmanifest, ocean-dwelling, identified with Vasudeva, Hanuman,
    and the Horse-sacrifice, recipient of sacrificial offerings, grantor of boons,
    ascetic and Brahmacharin, born in Prisni’s womb yet unborn, all-pervading, unknowable,
    creator and destroyer, omnipresent, vast as the universe, kind to worshippers,
    and the form of Emancipation. The speaker declares himself a devoted disciple
    who desires to behold the addressee.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The divine addressee is described as having infinite motions and bodies, and
    as without beginning, middle, or end; the middle and end are said to be unmanifest.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressee is said to reside in the ocean and to have a home in Fame, Penances,
    Self-restraint, Prosperity, Knowledge, grand Achievements, and everything belonging
    to the universe.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The addressee is identified as Vasudeva, as Hanuman who bore Rama on his shoulders,
    as the great Horse-sacrifice, and as one who receives a share of offerings in
    great sacrifices.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The addressee is called the grantor of wishes, boons, happiness, and wealth,
    and is described as devoted to Hari.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The addressee is equated with restraint of the senses, vows, observances,
    mortifications, and severe mortifications, and is described as an observer of
    vows and pious rites and as a Brahmacharin.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The addressee is said to have taken birth in the womb of Prisni, to be the
    source from which Vedic rites and acts have flowered, and to be unborn.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The addressee is described as pervading all things, having eyes on all things,
    not apprehended by the senses, not subject to deterioration, inconceivably vast,
    beyond logic or argument, and unknowable.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The addressee is called the foremost of causes, the creator and destroyer
    of all creatures, the possessor of vast powers of illusion, Chittrasikhandin,
    giver of boons, receiver of sacrificial offerings, and one who has obtained the
    merit of all sacrifices.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The addressee is described as omnipresent, of the form of a Brahmana, fond
    of Brahmanas, having the universe for a vast form, the greatest friend, kind to
    worshippers, and the great deity of the Brahmanas.
  category: attribute
  evidence_refs:
  - ev:9
