canonical_text:
  quote: ''
  summary: In Bhishma's narration, Tuladhara asks Jajali to summon birds that had
    been reared on Jajali's head and calls them his children. The birds answer with
    a discourse on non-injury, Faith, sacrifice, purity, and the acceptability of
    offerings. Faith is personified as Surya's daughter and is described as saving
    flawed acts and cleansing sins. Brahman corrects the deities' judgment about offerings
    and food, saying that Faith sanctifies what is given. The birds advise Jajali
    to take refuge in Faith. Afterward, Tuladhara and Jajali ascend to heaven and
    Jajali attains tranquillity.
  language: English
  quote_policy: summarized
