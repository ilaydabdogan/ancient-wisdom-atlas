canonical_text:
  quote: '"The king is Indra. The king is Yama. The king is Dharma."'
  summary: Bhishma cites an old discourse in which Pururavas asks Matariswan, the
    god of Winds, about the origin and precedence of the Brahmana and the other orders.
    Matariswan explains the four orders as arising from parts of Brahman, assigns
    their social duties, describes Brahmana precedence over earth and kingly rule,
    and teaches that a king prospers by heeding a Brahmana priest, protecting subjects,
    enabling sacrifice, dispelling fear, and sustaining the realm.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Bhishma says that a person who protects the good and punishes the wicked should
    be appointed by the king as priest, and he introduces an old discourse between
    Pururavas and Matariswan.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pururavas asks where the Brahmana and the three other orders came from, and
    why the Brahmana became foremost.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Matariswan answers that the Brahmana arose from Brahman's mouth, the Kshatriya
    from his arms, the Vaisya from his thighs, and the Sudra from Brahman's feet.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Matariswan assigns the Brahmana the keeping of the Vedas and scriptures, the
    Kshatriya ruling and protection, the Vaisya cultivation and trade, and the Sudra
    service to the three orders.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Pururavas asks the god of Winds whether the earth righteously belongs to the
    Brahmana or to the Kshatriya.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The god of Winds says that everything in the universe belongs to the Brahmana
    by birth and precedence, and that the earth accepted the Kshatriya as lord after
    the Brahmana refused.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The god of Winds tells the ruler to give conquered land to a learned and virtuous
    Brahmana, and says such a Brahmana guides the king with counsel and points out
    his duties.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: A wise king who listens to Brahmana instruction gains honor and fame; the
    priest shares in the king's merit; protected subjects become virtuous and fearless;
    the king obtains a fourth part of their righteous acts.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Gods, men, Pitris, Gandharvas, Uragas, and Rakshasas are said to depend on
    sacrifices, and sacrifice is said to depend on the king.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Seasonal comforts and sensory pleasures are contrasted with fear; a person
    who dispels fear gains merit, the gift of life is called supremely valuable, and
    the king is identified with Indra, Yama, Dharma, different forms, and universal
    support.
  category: attribute
  evidence_refs:
  - ev:10
