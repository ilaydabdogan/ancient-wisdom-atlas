    fire with mantras.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A male participant described as of Dasaratha's race rises, takes a sanctified
    conch, and pours its water onto Yudhishthira's head.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Dhritarashtra and the subjects also pour sanctified conch-water at Krishna's
