canonical_text:
  quote: ''
  summary: 'Vaisampayana narrates Yudhishthira''s enthronement after battle: he is
    seated among kin, allies, elders, and subjects; auspicious and sacrificial materials
    are assembled; Dhaumya conducts a fire rite; sanctified conch-water is poured
    over Yudhishthira; gifts and blessings are exchanged; Brahmanas praise his recovered
    position and he is installed over a large kingdom.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yudhishthira, described as the royal son of Kunti, sits facing east on a gold
    seat while named allies, brothers, elders, and court figures sit on separate seats
    or thrones around him.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The seated king touches white flowers, Swastikas, vessels, earth, gold, silver,
    and gems placed before him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Subjects headed by the priest come to see Yudhishthira and bring auspicious
    articles and materials needed for the coronation rite.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The coronation materials include water-filled jars of several materials, flowers,
    fried paddy, Kusa grass, cow's milk, sacrificial fuel, honey, clarified butter,
    Udumvara ladles, and gold-adorned conches.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dhaumya, at Krishna's request, constructs an altar according to rule, inclining
    toward the east and north.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Yudhishthira and Krishna, the daughter of Drupada, are seated on a Sarvatobhadra
