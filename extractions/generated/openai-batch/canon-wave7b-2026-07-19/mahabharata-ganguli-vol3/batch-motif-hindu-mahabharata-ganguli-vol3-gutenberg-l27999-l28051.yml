  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Panavas, Anakas, and drums are beaten after the bathing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Yudhishthira accepts gifts from the subjects, honors them in return, and gives
