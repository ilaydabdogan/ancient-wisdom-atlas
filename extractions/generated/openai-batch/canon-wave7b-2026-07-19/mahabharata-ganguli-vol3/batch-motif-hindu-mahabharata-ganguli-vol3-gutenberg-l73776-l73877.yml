canonical_text:
  quote: ''
  summary: A sequence of translator's footnotes explains Narayana, Brahman, cyclic
    creation, divine manifestation, solar effulgence, episodes involving Krishna,
    Vana, Aniruddha, Usha, Saubha, Kala-yavana, and a sleeping king, as well as emancipation,
    Pravritti and Nivritti, sensory attributes of elements, and transmission of a
    narrative by Narada and Surya.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The commentator explains Brahman as the son of Narayana at the beginning of
    a Kalpa, when no other mobile or immobile existent object is present.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note states that Brahman creates through Ahankara and that without Ahankara
    there can be no creation of named mobile and immobile subjects.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Narayana is said by some to manifest himself repeatedly for the business of
    the deities; the Gita is cited as saying the purpose is to rescue the good and
    destroy the wicked, while another view says the purpose is to gladden devotees
    and serve worshippers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Narayana is associated with the center of the solar disc, but the note says
    this refers not to the visible sun but to an inconceivably dazzling fountain of
    effulgence.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The deity is said to perform acts at the beginning of every Kalpa when he
    recreates the Earth, and all Kalpas are described as similar in their incidents.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Vana, a worshipper of Mahadeva, imprisons Krishna's grandson Aniruddha after
    Usha falls in love with Aniruddha.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Krishna fights Vana to rescue Aniruddha, defeats Mahadeva and Kartikeya, and
    cuts off most of Vana's arms.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Saubha is described as a flying city of the Danavas, and Krishna casts it
    into the ocean after killing its Danava inhabitants.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Krishna takes refuge from Kala-yavana in a mountain-cave where an ancient
    king sleeps; the Danava awakens the king and is consumed to ashes by the king's
    glance because of a boon.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The note says Hindu sages sought identification with Brahma or the Supreme
    Soul to prevent rebirth, regarding heaven and other states as mutable.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Narada is said to have recited a narrative to Siddhas assembled in Brahman's
    abode, and Surya is said to have recited the narrative to those before and behind
    him in his journey through the firmament.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The notes distinguish Pravritti and Nivritti, state that they are opposed,
    and raise the question of why both were created by Narayana.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: The notes describe self-realization as bringing about cessation of existences,
    and contrast Emancipation with rewards such as heavenly felicity from which there
    is return.
  category: relationship
  evidence_refs:
  - ev:10
  - ev:12
- id: obs:14
  text: 'Attributes are assigned to elements: vision to Light, taste to Water, sound
    to Space, touch to Wind, and smell to Earth.'
  category: relationship
  evidence_refs:
  - ev:11
