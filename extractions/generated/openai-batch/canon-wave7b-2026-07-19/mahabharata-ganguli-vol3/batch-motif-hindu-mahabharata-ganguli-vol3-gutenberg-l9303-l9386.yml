canonical_text:
  quote: ''
  summary: Sanjaya narrates an afternoon battle in which Karna orders Shalya to drive
    toward the Pancalas, enters the enemy host, is surrounded by named Pandava-side
    warriors, and then repels them. The passage emphasizes Karna fighting alone, routing
    troops, being praised by divine and allied witnesses, and turning the battlefield
    into a dark, blood-filled, indistinguishable scene through arrows and a celestial
    weapon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sanjaya reports that in the afternoon Karna smites the Somakas in Bhimasena's
    sight, while Bhimasena destroys Dhartarashtra troops.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Karna twice tells Shalya to bear him to the Pancalas, and Shalya drives white
    steeds toward the Cedis, Pancalas, and Karushas, taking Karna where he wishes
    to go.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Karna's car is described as cased in tiger skins, cloud-like in appearance,
    and loud like thunder or a mountain splitting; its sight terrifies the Pandus
    and Pancalas.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Karna shoots hundreds of arrows and smites hundreds and thousands of Pandava
    warriors.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Shikhandi, Bhima, Dhrishtadyumna, Nakula, Sahadeva, the five sons of Draupadi,
    and Satyaki surround Karna and strike him with arrows.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Karna laughs in scorn, shoots back, pierces each opponent, cuts Satyaki's
    bow and standard, pierces Satyaki and Bhima, cuts Sahadeva's standard, afflicts
    Sahadeva's driver, and deprives the sons of Draupadi of their cars.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sanjaya states that Karna fights alone and unsupported against the contending
    bowmen and checks Pandava warriors; gods, Siddhas, and Charanas are gratified,
    and Dhartarashtra bowmen applaud.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Karna is compared to a blazing conflagration burning dry grass and to a smokeless
    blazing fire; the Pandava troops flee and wails arise among the Pancalas.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Pandava army is compared to a swelling mass of water breaking against
    a mountain when it contacts Karna.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Karna cuts off arms, heads, ears with earrings, weapons, standards, animals,
    cars, banners, axles, yokes, and wheels; the earth becomes impassable and miry
    with flesh and blood.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The field's even and uneven spots become indistinguishable because of slain
    bodies, dead elephants, broken cars, and other wreckage.
  category: setting
  evidence_refs:
  - ev:7
