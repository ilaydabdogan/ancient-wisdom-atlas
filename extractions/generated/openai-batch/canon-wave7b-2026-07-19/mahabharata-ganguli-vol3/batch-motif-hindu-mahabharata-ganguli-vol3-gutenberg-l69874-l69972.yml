  quote: ''
  summary: 'The passage consists of translator/editor footnotes explaining philosophical
    terms and metaphors: Yogins'' control of subtle forms, the linga and karana bodies,
    dream experience, meditation, iron chains as longings or bodies, the cutting of
    the root of the tree of Ignorance, the body as a city governed by understanding
