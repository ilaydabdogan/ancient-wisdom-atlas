canonical_text:
  quote: ''
  summary: Vaisampayana narrates Arjuna's address to his grieving elder brother Yudhishthira.
    Arjuna argues that Yudhishthira, having obtained sovereignty through Kshatriya
    duty and conquered his foes, should not grieve. He contrasts Kshatriya duties
    of battle and weapon-death with Brahmana duties of penance and renunciation, urges
    royal action, sacrifice, and charity, cites Indra as a precedent, and concludes
    that the slain attained the highest end and that destiny cannot be resisted.
  language: English
  quote_policy: summarized
