canonical_text:
  quote: ''
  summary: Tuladhara instructs Jajali that eternal morality is universal friendliness
    and harmlessness toward all creatures. He describes his own non-cheating livelihood,
    impartiality, lack of desire and aversion, and evenness toward gold, stone, and
    earth. He contrasts the fearless state of the harmless person with the fearful
    state of one who terrifies others, recommends the conduct of wise elders, uses
    driftwood in a river as an image for accidental union and separation, and teaches
    that harmlessness yields prosperity, heaven, sacrificial merit, fearlessness,
    and attainment of Brahma.
  language: English
  quote_policy: summarized
