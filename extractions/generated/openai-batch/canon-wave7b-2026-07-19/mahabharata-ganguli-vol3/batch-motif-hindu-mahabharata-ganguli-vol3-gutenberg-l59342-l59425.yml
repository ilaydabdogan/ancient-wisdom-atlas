canonical_text:
  quote: ''
  summary: Bhishma narrates that Suka asks his father and preceptor Vyasa about Emancipation.
    Vyasa instructs him in the relevant disciplines and sends him to King Janaka of
    Mithila, ordering him to travel by the ordinary human path, avoid attachments,
    and obey Janaka. Suka journeys on foot through varied sacred and inhabited landscapes,
    ignores wealth and pleasures, enters Mithila, waits calmly when stopped by porters,
    and is admitted through palace chambers into an inner garden attended by richly
    adorned damsels.
  language: English
  quote_policy: summarized
