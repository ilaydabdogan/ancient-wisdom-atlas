canonical_text:
  quote: Time, which is destructive of every created thing, is passing on.
  summary: Yudhishthira asks Bhishma what good should be sought while destructive
    Time passes. Bhishma introduces an old discourse between a Veda-studying Brahmana
    father and his intelligent son Medhavin. The son asks what duties a wise person
    should perform as life passes quickly. The father prescribes study, progeny, sacrificial
    fire and rites, and eventual forest contemplation. The son challenges the calmness
    of this answer by saying the world is surrounded and assailed by fatal forces,
    prompting the father to ask what he means.
  language: English
  quote_policy: quoted
