  quote: Arjuna, alone and unsupported, fought with his foes at the same time.
  summary: A shaft pierces Suratha and the Earth, and Suratha falls. The son of Drona
    mounts the vehicle of the slain foe and, supported by the Samsaptakas, fights
    Arjuna. At noon Arjuna fights many enemies alone, and the encounter is compared
    to Indra’s ancient battle against the host of the Asuras.
