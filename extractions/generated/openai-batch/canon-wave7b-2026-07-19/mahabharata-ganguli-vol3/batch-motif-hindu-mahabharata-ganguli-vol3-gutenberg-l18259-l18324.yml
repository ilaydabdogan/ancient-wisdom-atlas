canonical_text:
  quote: ''
  summary: Vaishampayana recounts an ancient episode in which the celestials install
    Varuna as lord of waters. Baladeva continues a pilgrimage through several tirthas,
    including Agnitirtha, Brahmayoni, Kauvera, and Vadarapachana. The passage explains
    Agni’s concealment in Sami wood after Bhrigu’s curse and his discovery by the
    gods; it also recounts Brahman’s creation-site bathing, Kuvera’s austerities and
    acquisition of treasure-lordship, and the abundance of fruits and flowers at Vadarapachana.
  language: English
  quote_policy: summarized
