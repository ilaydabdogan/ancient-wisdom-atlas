  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A tree is used as an illustration of something absent before birth and after
    destruction, and present only in the interim.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Darkness, Tamas, or Rahu is discussed in connection with the moon’s apparent
    covering, uncovering, waxing, or waning.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The note states that Rahu is not an imaginary monster as described in the
    Puranas, but the descending node of the moon.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: In dream, the manifest body lies inactive while the subtle form walks forth;
    in deep slumber, the subtle form is abandoned and understanding remains.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Emancipation is explained as absorption into the Supreme Soul, independent
