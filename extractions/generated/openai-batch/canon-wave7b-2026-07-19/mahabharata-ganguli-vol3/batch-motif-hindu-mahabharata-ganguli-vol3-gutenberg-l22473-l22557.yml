canonical_text:
  quote: Union is certain to end in separation; life is sure to end in death.
  summary: Vidura counsels a grieving king to rise and cease sorrow. He teaches universal
    mortality, the impartial power of Death and Time, the heavenly reward of warriors
    slain in battle, battle figured as sacrificial action, grief countered by wisdom,
    and the fruit of actions across lives.
  language: English
  quote_policy: quoted
