- id: obs:1
  text: Vidura addresses a king who is stretched on the earth and tells him to rise
    and support himself.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vidura states that all living creatures reach a final end, all accumulated
    things end in destruction, what is high falls, union ends in separation, and life
    ends in death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Death or the destroyer is said to drag hero and coward, gods and all creatures,
    without preference for dear or hateful beings.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: All creatures are compared to members of a caravan bound for the same destination,
    with little difference in who is encountered first by death.
  category: relationship
  evidence_refs:
  - ev:2
