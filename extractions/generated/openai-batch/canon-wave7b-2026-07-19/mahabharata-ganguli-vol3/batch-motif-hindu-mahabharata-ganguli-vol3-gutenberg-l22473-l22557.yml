  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Youth, beauty, life, possessions, health, and companionship of friends are
    described as unstable.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Vidura says grief grows when indulged, should be countered by non-indulgence,
