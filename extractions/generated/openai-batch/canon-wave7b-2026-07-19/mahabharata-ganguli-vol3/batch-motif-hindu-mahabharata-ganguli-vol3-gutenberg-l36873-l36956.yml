canonical_text:
  quote: ''
  summary: Bhishma answers Yudhishthira on subtle duties in times of distress. He
    discusses how a king or Kshatriya may preserve life, treasury, army, and realm
    under emergency conditions, while noting moral danger, exceptions for Brahmanas
    and ascetics, and the reciprocal duty of king and kingdom to protect one another.
  language: English
  quote_policy: summarized
