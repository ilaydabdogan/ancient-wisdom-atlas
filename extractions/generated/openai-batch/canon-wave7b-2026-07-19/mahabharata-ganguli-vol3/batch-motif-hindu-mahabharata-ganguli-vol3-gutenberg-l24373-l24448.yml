canonical_text:
  quote: ''
  summary: Yudhishthira speaks to Narada after victory, lamenting the carnage of kin
    and the deaths of Abhimanyu, Draupadi's sons, and Karna. He recounts that Kunti
    revealed Karna to be her secretly born son of Surya, set afloat in a basket on
    the Ganga, later known as Radha's Suta child. He describes Karna's refusal to
    abandon Duryodhana, his promise to spare four Pandavas, and Arjuna's killing of
    Karna without knowing he was his brother. Yudhishthira asks Narada why the earth
    swallowed Karna's chariot wheels and why Karna was cursed.
  language: English
  quote_policy: summarized
