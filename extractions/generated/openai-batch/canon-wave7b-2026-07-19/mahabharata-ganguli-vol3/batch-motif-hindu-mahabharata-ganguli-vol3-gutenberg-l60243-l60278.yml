canonical_text:
  quote: ''
  summary: The speaker reflects that ailments, decrepitude, nature, and grief overpower
    animals, poor men, kings, and all embodied creatures. Human effort and wishes
    do not reliably produce desired results, and fortunes are shown as unequal. Misery
    and happiness coexist. The addressee is instructed not to be stupefied by error
    and to cast off righteousness and sin, truth and falsehood, and even the aid used
    to cast them off. The speaker says such instruction enabled deities, described
    as former human beings, to leave Earth and become denizens of heaven.
  language: English
  quote_policy: summarized
