  summary: Janamejaya recounts earlier teachings about the Supreme Soul, Nara and
    Narayana, the Boar form, and other sacred matters, then asks about Vishnu/Hari's
    unprecedented horse-headed form seen by Brahman at the northern ocean. Sauti frames
    the answer as an ancient history consistent with the Vedas and as previously recited
    by Vaisampayana at Janamejaya's Snake-sacrifice.
