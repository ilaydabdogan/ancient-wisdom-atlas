  quote: ''
  summary: Translator's footnotes explain Vedic creation as speech or words uttered
    by the Creator/Brahman before creation, compare this with Genesis, gloss Vedic
    technical terms for rites and duties, describe ritual motives in later yugas,
    discuss a difficult yoga passage in which mind swallows Space or manifest vastness,
    and explain birth rites, education fees, and debts to ancestors, Rishis, and deities.
  language: English
