canonical_text:
  quote: '"goes round the Earth, staying in the disc of Surya"'
  summary: Surya explains that a wondrous being is not fire, an Asura, or a Naga,
    but a Brahmana who attained heaven through the Unccha vow, austerity, sacred recitation,
    lack of desire, and devotion to the good of all creatures. The Brahmana now remains
    in the solar disc and goes around the Earth.
