canonical_text:
  quote: ''
  summary: Sanjaya narrates that Arjuna, after defeating Drona's son, cannot find
    Yudhishthira and asks Bhima where he is. Bhima reports that Yudhishthira left
    the battlefield wounded by Karna. Arjuna and Bhima debate who should remain against
    the samsaptakas and who should go to check on the king. Bhima takes the front,
    while Krishna drives Arjuna swiftly to Yudhishthira. Krishna and Arjuna find the
    king alive, honor his feet, and rejoice; Yudhishthira, mistakenly thinking Karna
    has been slain, congratulates them with delight.
  language: English
  quote_policy: summarized
