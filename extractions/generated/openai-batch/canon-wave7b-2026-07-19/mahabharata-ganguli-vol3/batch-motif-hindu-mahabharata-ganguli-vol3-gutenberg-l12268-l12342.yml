canonical_text:
  quote: the world, stupefied by Time, now consists of only women
  summary: After Karna's fall, Duryodhana grieves, appoints Shalya commander, and
    resumes battle. Shalya is killed, Duryodhana hides in a lake and is killed by
    Bhimasena, and three surviving Kuru warriors slaughter Pancala troops at night.
    Sanjaya returns to the Kuru capital and reports to Dhritarashtra the deaths of
    rulers, armies, sons, elephants, horses, and car-warriors, naming only a few survivors
    and attributing the destruction to Time.
  language: English
  quote_policy: quoted
