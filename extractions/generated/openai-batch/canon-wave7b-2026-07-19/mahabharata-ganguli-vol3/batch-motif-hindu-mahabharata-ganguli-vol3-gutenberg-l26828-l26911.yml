canonical_text:
  quote: ''
  summary: A speaker consoles a bereaved addressee by listing renowned kings who surpassed
    him in virtue, prosperity, sacrifice, conquest, generosity, or devotion, yet all
    died. The examples include Mandhatri’s miraculous birth and divine nursing, Yayati’s
    world conquest and royal succession, Amvarisha’s sacrificial merit, Sasavindu’s
    vast wealth and gifts, and Gaya’s devotion, boons from Agni, and repeated sacrifices.
  language: English
  quote_policy: summarized
