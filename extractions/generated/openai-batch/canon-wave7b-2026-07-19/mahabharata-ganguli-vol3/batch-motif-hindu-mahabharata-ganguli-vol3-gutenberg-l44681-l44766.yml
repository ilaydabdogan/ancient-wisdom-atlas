canonical_text:
  quote: ''
  summary: Manu teaches about the soul, embodiment, the consequences of action, the
    hierarchy of elements and faculties, Vishnu as beyond Time, Brahma as unchangeable
    and without attributes, and the discipline by which one may attain emancipation
    or absorption into Brahma.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Manu says Brahma is seen by the individual when the fivefold attributes are
    united with the five senses and the mind, using the image of a thread passing
    through a gem.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the soul may live in bodies such as a cow, horse, human,
    elephant, other animal, worm, or insect in consequence of its own acts.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Good deeds performed in a particular body produce rewards enjoyed in that
    same particular body.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Understanding is said to follow the path marked out by acts from previous
    lives.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The passage gives a sequence: knowledge gives rise to desire, desire to resolution,
    resolution to action, and action to fruits or consequences.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Knowledge of Brahma is described as an excellent result associated with the
    destruction of knowledge, fruits, understanding, and acts.
  category: other
  evidence_refs:
  - ev:2
- id: obs:7
  text: Yogins behold a great self-existent Essence, while those without wisdom and
    attached to worldly possessions do not behold what exists in the Soul itself.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A hierarchy is stated in which Water is above Earth, Light above Water, Wind
    above Light, Space above Wind, Mind above Space, Understanding above Mind, Time
    above Understanding, and Vishnu above Time.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Vishnu is described as having the universe as his, as without beginning, middle,
    or end, as unchangeable, and as called the Supreme Brahma.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: The wise, knowing Vishnu, are said to become free from everything that owns
    the power of Time and attain Emancipation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The Richs, Yajuses, and Samans are described as having the body for their
    refuge, flowing from the end of the tongue, requiring effort, and being subject
    to destruction.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: Brahma is described as without beginning, middle, or end, not acquired through
    bodily effort, infinite, unchangeable, and beyond sorrow and pairs of opposites.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:13
  text: Mortals are said to fail to behold the path to Brahma because of unfavorable
    destiny, inability to find means, impediments from acts, attachment to possessions,
    vision of heavenly joys, or coveting something other than Brahma.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:14
  text: The passage says Brahma cannot be described in words and can be known by subtle
    intelligence and inference.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:15
  text: The understanding can be purified by knowledge, the mind by the understanding,
    and the senses controlled by the mind; after this one may attain the Unchangeable.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: A person freed from attachments through contemplation and endowed with a discerning
    mind succeeds in attaining Brahma, which is without desire and above attributes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:17
  text: The passage compares agitated persons keeping away from the Supreme to wind
    keeping away from fire embedded in wood.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:18
  text: A person engaged in destroying earthly objects according to the described
