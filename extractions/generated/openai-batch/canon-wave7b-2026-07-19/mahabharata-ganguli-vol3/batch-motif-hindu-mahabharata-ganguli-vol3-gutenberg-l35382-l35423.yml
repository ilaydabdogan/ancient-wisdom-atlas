canonical_text:
  quote: ''
  summary: 'Yudhishthira asks Bhishma how a king lacking ordinary aids should deal
    with a powerful foe. Bhishma answers by recounting an old discourse between Ocean
    and the Rivers: Ocean asks why rivers uproot large trees but do not wash away
    canes. Ganga explains that trees resist the current and are uprooted, while canes
    bend before the current and rise again afterward. Bhishma applies the lesson to
    political conduct: a wise person measures relative strength and, before a stronger
    enemy, behaves like the cane.'
  language: English
  quote_policy: summarized
