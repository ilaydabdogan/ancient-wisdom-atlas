canonical_text:
  quote: ''
  summary: Sanjaya narrates a stage in the duel between Arjuna and Karna. Arjuna cuts
    down a snake in the sky, Krishna raises the car, and Karna and Arjuna exchange
    severe arrow attacks. Arjuna strips Karna of adornments and armor and wounds him
    deeply, but hesitates to kill him while he is distressed. Krishna urges Arjuna
    to kill Karna at once. Arjuna renews the assault, Karna recovers and retaliates,
    and Arjuna prepares a terrible celestial arrow as Kala invisibly warns Karna that
    Earth is devouring his wheel.
  language: English
  quote_policy: summarized
