canonical_text:
  quote: ''
  summary: Dhritarashtra encounters Kripa, Ashvatthama, and Kritavarma, the three
    surviving car-warriors of Duryodhana's army. They report Duryodhana's death, console
    Gandhari by describing warrior-death as leading to celestial worlds, confess the
    slaughter of sleeping enemies in the Pandava camp, ask permission to depart, and
    separate in fear of pursuit.
  language: English
  quote_policy: summarized
