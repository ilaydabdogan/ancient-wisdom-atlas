canonical_text:
  quote: ''
  summary: Tuladhara teaches Jajali that non-injury, renunciation, faith, and desireless
    sacrifice lead toward Brahma, while sacrifices done for fruit lead to return.
    He distinguishes external sacrifices from mental or innocent offerings, praises
    the cow as upholding sacrifice through milk products and bodily signs, names Faith
    as a symbolic wife for sacrifice, and states that the Soul itself is a sacred
    ford. Jajali asks about these difficult doctrines, and Bhishma tells Yudhishthira
    that Tuladhara applauded duties consistent with reason and observed by the good
    and wise.
  language: English
  quote_policy: summarized
