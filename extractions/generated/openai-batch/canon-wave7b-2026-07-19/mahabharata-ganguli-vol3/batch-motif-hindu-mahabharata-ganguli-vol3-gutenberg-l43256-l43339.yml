canonical_text:
  quote: ''
  summary: 'Bhishma gives a didactic list of good and wicked conduct: bodily purity,
    water oblations, Sun worship, daily prayers, rules for eating, circumambulation
    of sacred places and beings, hospitality, Homa offerings, marital restraint, reverence
    to Brahmanas and seniors, etiquette, purity taboos, and the consequences of concealed
    sin seen by the gods.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhishma distinguishes wicked men by bad conduct, bad acts, wicked understanding,
    and rashness, and distinguishes good men by purity of conduct and practices.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage prescribes avoiding calls of nature on high roads, in cow-pens,
    and in paddy fields, followed by ablutions in river-water and water oblations
    to deities.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage prescribes worship of Surya, avoidance of sleep after sunrise,
    morning and evening prayers facing east and west, washing five limbs, silent eating
    facing east, not disparaging food, and washing after eating.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Narada is cited as saying these practices indicate good conduct, and the passage
    prescribes daily circumambulation of sacred places, a bull, a sacred image, a
    cow-pen, a four-road crossing, a pious Brahmana, and a sacred tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage praises equal food treatment for guests, attendants, kinsmen,
    and servants, prescribes eating in morning and evening, forbids causing a guest
    to fast, and directs offerings to seniors.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: At ordained Homa times, libations are to be poured on the sacred fire; the
    wise man is instructed to avoid other men's wives and approach his own wife in
    her season.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The remnants of a Brahmana's dish are compared to ambrosia and to milk from
    a mother's breast, and the good are said to attain Brahma by eating them.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage gives restrictions concerning sacrificial altar materials, grass
    for sacrificial fuel, sanctified meat, abstention from meat, and flesh from animals
    not slain in sacrifices.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage directs saluting and honoring seniors, the Preceptor, and Brahmanas,
    and says such worship produces long life, fame, prosperity, and abundance.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:10
  text: The Preceptor is called the heart of all sacred spots and shrines, and Fire
    is called the heart of all pure and cleansing things.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:11
  text: The passage prescribes polite enquiries, respectful forms of address to seniors,
    and formulaic questions when serving food or drink.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:12
  text: The passage includes purity and modesty rules involving the Sun, excreta,
    another man's naked spouse, privacy with one's wife, and avoiding lying or eating
    with a woman.
  category: action
  evidence_refs:
  - ev:13
- id: obs:13
  text: Sinful men who conceal conscious sins from good men are said to meet destruction;
    human beings may not see such sins, but the gods see them.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:14
  text: Sins are said to overtake the foolish man as Rahu comes to Chandra; stored
    objects are said to be scarcely enjoyed because death waits for no one.
  category: sequence
  evidence_refs:
  - ev:15
