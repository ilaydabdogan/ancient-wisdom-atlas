literal_observations:
- id: obs:1
  text: Acts done knowingly are said to produce fruits according to their nature;
    good acts yield good fruits, bad acts yield bad fruits, while acts done in ignorance
    produce non-commensurate and smaller misery.
  category: relationship
  evidence_refs:
  - ev:1
