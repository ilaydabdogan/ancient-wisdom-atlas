  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A note compares the merit of accepting a gift from a superior person with
    the merit of giving by a poor person, and says a wealthy man gains greater merit
    by giving than by accepting a gift.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Usanas is said to attain the status of the planet Venus in the firmament.
  category: action
  evidence_refs:
  - ev:4
