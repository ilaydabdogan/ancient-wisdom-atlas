canonical_text:
  quote: ''
  summary: Sanjaya reports that Krishna rebukes Yudhishthira for rashly offering Duryodhana
    kingship if he can slay one of the Pandavas in single combat. Krishna warns that
    Duryodhana has trained with the mace for thirteen years against an iron statue
    to kill Bhima, and that Duryodhana’s skill makes a fair duel dangerous. Bhima
    then reassures Krishna, vows to kill Suyodhana, emphasizes the greater weight
    of his own mace, and accepts a mace duel before spectators.
  language: English
  quote_policy: summarized
