canonical_text:
  quote: Self-restraint enhances one's energy. Self-restraint is said to be sacred.
  summary: Yudhishthira asks what conduct brings happiness, woe, freedom from fear,
    and success. Bhishma answers by praising self-restraint as the foundation of rites,
    penance, truth, happiness, fearlessness, benevolence, equanimity, and spiritual
    success, contrasting it with the path of lust, wrath, cupidity, envy, and boastfulness.
  language: English
  quote_policy: quoted
