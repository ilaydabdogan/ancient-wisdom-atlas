  quote: the earth also began to devour the left wheel of his car
  summary: During Karna's battle with Arjuna, Karna loses access to weapon knowledge,
    his chariot wheel sinks into the earth, and he laments that righteousness is failing
    him. Karna and Arjuna exchange mantra-empowered weapons and arrows while Krishna
    urges Arjuna to use higher weapons. When the wheel is swallowed by the earth,
    Karna descends to lift it and asks Arjuna to pause according to the rules of righteous
    battle.
