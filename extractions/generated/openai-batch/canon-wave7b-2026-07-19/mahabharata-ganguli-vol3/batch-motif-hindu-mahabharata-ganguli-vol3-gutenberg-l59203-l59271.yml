canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma to explain Suka's birth, mother, early turn toward
    knowledge of Brahma, greatness, and union with the Supreme Soul. Bhishma introduces
    penance, sense-restraint, and Yoga as the root of such success, then narrates
    Vyasa's austerities on Meru near Mahadeva and Parvati. Vyasa prays for a son endowed
    with the powers of the elements, performs a hundred years of austerity, and Mahadeva
    grants that the son will be pure and Brahma-conscious.
  language: English
  quote_policy: summarized
