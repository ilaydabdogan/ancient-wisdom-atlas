canonical_text:
  quote: ''
  summary: In a fierce battle, Arjuna repels attacks, is compared to a scorching sun,
    disables Drona's son and other opposing warriors, and breaks the hostile host.
    Keshava drives Arjuna's car through the battle. Allied warriors check pursuing
    foes, while Kurus and Srinjayas fight and die amid arrow-shadows that darken the
    directions and shroud the sun.
  language: English
