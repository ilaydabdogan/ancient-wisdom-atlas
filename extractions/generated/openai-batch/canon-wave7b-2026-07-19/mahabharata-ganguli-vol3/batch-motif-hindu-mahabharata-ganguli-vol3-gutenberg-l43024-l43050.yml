canonical_text:
  quote: ''
  summary: Bharadwaja asks Bhrigu about the consequences of gifts, righteousness,
    conduct, penances, Vedic study, and fire libations. Bhrigu replies that sacred
    fire libations burn sin, Vedic study brings tranquillity, gifts bring enjoyment,
    penances bring heaven, and gifts have consequences according to their recipients
    and measure. Bharadwaja then asks about duties and the four modes of life laid
    down by Brahman.
