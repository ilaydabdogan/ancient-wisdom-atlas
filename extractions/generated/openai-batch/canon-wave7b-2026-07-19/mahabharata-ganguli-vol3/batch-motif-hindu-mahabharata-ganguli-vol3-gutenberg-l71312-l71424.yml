  quote: ''
  summary: Footnotes explain names and attributes of Hari, Narayana, Vishnu, and related
    epithets; describe the sight of Hari as comparable to severe penance; distinguish
    external sacrifices from internal yogic discipline; explain purification of the
    heart, knowledge, and emancipation; state the unity of the Divine Being behind
    apparent variety; summarize creation through primary principles and six color-linked
    classes of beings; and describe Jiva’s merit, demerit, ascent, fall, and hell-like
    immobile existence.
