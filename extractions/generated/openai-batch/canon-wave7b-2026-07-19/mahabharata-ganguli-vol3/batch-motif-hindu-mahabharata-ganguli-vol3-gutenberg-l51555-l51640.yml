canonical_text:
  quote: one knows that which dwells within this frame to be of a four-fold nature,
    having besides four doors and four mouths.
  summary: 'Kapila contrasts sacrificial acts with renunciation, Brahma-knowledge,
    and Yoga. He teaches that the body has four doors that must be controlled: action
    through limbs, speech, eating, and sexual conduct. He defines a true Brahmana
    by restraint, tranquillity, contemplation, knowledge of reality, fearlessness
    toward all creatures, and identification with all creatures. Syumarasmi asks about
    Vedic statements that both authorize and reject acts, and Kapila replies by emphasizing
    the directly experienced fruits of Yoga over the uncertain fruits of other pursuits.'
  language: English
  quote_policy: quoted
