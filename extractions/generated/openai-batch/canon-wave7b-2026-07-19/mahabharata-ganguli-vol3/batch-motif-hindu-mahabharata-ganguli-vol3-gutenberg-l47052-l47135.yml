canonical_text:
  quote: ''
  summary: Vali, defeated and addressed by Sakra/Indra, rebukes the victor for boasting.
    He argues that victory, sovereignty, prosperity, and calamity arise in the course
    of Time rather than from individual merit. He says Time leads and destroys all
    beings, that apparent actors depend on a Supreme Being, and that Indra too will
    be destroyed as many earlier Indras and sovereigns were. He catalogs former rulers
    and beings who enjoyed the Earth, performed sacrifices, and nevertheless departed
    under Time's power.
  language: English
  quote_policy: summarized
