canonical_text:
  quote: '"Know that I have come here for destroying this Sacrifice of yours."'
  summary: Virabhadra announces that he and Bhadrakali were born from divine wrath
    and sent to destroy Daksha's sacrifice. Daksha bows to Maheswara and hymns him.
    Mahadeva appears from the sacrificial fire pit, and Daksha asks that the damaged
    sacrificial articles still be made useful; Hara grants the boon, after which Daksha
    adores him.
  language: English
