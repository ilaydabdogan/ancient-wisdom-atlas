canonical_text:
  quote: For six months he travels in a northward course and then for the other six
    in a southward course.
  summary: Sakra says Brahman has forbidden him to kill Vali, so he will not use his
    thunderbolt. He describes Brahman’s ordering of the Sun’s northward and southward
    courses, which produce winter and summer. Bhishma then says Vali went south, Purandara
    went north, and Indra ascended the skies after hearing Vali’s pride-free speech.
