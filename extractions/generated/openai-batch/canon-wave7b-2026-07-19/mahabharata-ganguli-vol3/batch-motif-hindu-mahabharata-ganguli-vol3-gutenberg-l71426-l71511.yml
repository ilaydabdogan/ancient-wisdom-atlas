canonical_text:
  quote: ''
  summary: The footnotes explain a doctrine of Jiva moving through color-marked states
    of existence, retaining senses and powers that generate action, and progressing
    through White or effulgent conditions toward regions and states associated with
    Knowledge, Yoga, Turiya, and Brahma-sakshatkara. They also describe a Jivanmukta
    who remains affected by past acts and by attachment to Yoga-puissance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dark and Tawny hues correspond to immobile and intermediate states of existence,
    described as states of endurance in which misery is endured before recollection
    of former righteousness arises.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Tawny comes Blue; the note explains this as Jiva attaining humanity
    after an intermediate existence when Sattwa does not predominate.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When Jiva becomes a Deva, he still has ten senses, five Pranas, and four internal
    possessions, totaling nineteen, and these impel him to many acts.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The note states that even as a Deva, Jiva is not freed from acts, and that
    acts are treated as equivalent to hell or niraya.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Jiva acts through seven possessions and, relying on seven hundred kinds of
    acts, successively becomes Red, Yellow, and White.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the White state, Jiva courses through highly effulgent and adorable regions
    said to be superior to the region of Brahman and to leave behind the Eight Puris.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The highly effulgent regions are said to be obtainable by Knowledge alone
    or as the fruit of Yoga.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Eight Puris are identified in the note with the Sixty incidents of White
    existence, calculated through wakefulness, body, attributes, senses, breaths,
    internal faculties, Avidya, Kama, Karma, Soul, and the parallel state of dream.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: Effulgent or White beings are said not to regard wakefulness and dream as
    different; their highest state transcends wakefulness, dream, and dreamless sleep
    and is identified with Turiya.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: A Jivanmukta or emancipated living Yogin is described as still unable to transcend
    the effects of past acts.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: A Yogin unable to cast off the felicities of Yoga-puissance remains in one
    body for a century of Kalpas, then passes through Mahar, Jana, Tapas, and Satya
    regions.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The described Yogin belongs to the White color, is freed from attachments,
    has achieved Yoga-success, but has not achieved Brahma-sakshatkara or beholding
    Brahma.
  category: attribute
  evidence_refs:
  - ev:7
