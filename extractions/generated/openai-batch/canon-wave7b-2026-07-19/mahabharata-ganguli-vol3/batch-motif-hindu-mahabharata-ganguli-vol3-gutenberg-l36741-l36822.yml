canonical_text:
  quote: ''
  summary: King Viradyumna searches a forest for his lost only son, Bhuridyumna. The
    ascetic Tanu, recalling former dishonor by the king, teaches that hope is exceedingly
    slender and lists fragile hopes, including a father's hope to see a lost only
    son again. The king and his household submit to the sage and ask for grace. Tanu
    brings the prince to that place through learning and penance, rebukes the king,
    reveals himself as the god of righteousness, and departs into the forest. Rishabha
    and then Bhishma use the episode to counsel abandonment of distressing hope and
    regret.
  language: English
  quote_policy: summarized
