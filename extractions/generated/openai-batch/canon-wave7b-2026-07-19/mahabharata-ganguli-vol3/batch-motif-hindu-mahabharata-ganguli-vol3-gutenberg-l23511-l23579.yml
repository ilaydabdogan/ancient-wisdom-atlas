canonical_text:
  quote: Thither is victory where righteousness is.
  summary: Gandhari sees her slain son Duryodhana on the battlefield, faints, laments
    over his blood-covered body, recalls her pre-battle words about righteousness
    and warrior afterlife, contrasts his former royal honors with his corpse surrounded
    by scavengers, and describes Duryodhana's wife mourning both her husband and son.
  language: English
  quote_policy: quoted
