canonical_text:
  quote: '"This region that we inhabit is the field of action."'
  summary: Bhrigu describes a sacred and desirable northern region beyond Himavat,
    called the other world, whose inhabitants are righteous and free from ordinary
    afflictions. He contrasts it with the present inhabited region, where mixed virtue
    and vice, suffering, cupidity, and disputed views prevail. He teaches that this
    world is the field of action in which good and evil deeds bring corresponding
    results, and that righteous or yoga-oriented people may be born in the northern
    region while others enter intermediate species or return here. Bhishma then reports
    that Bhrigu taught Bharadwaja, who worshipped him with wonder.
  language: English
  quote_policy: quoted
