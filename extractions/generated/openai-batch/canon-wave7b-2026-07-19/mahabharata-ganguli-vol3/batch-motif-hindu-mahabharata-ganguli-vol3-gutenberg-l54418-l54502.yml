canonical_text:
  quote: ''
  summary: Narada instructs Galava about the four Asramas, their differing observances,
    and their true intent as knowledge of Self. He enumerates forms of excellence,
    including truthfulness, restraint, humility, righteous association, proper speech,
    non-attachment to flavors, and reverent conduct between disciples and preceptors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Narada addresses Galava and says the Asramas are four, have differing duties
    and observances, should be learned from qualified preceptors, and have knowledge
    of Self as their true intent.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Narada lists several things as excellence, including good offices to friends,
    suppression of enemies, acquisition of Religion, Profit, and Pleasure, abstention
    from sin, righteous disposition, good behavior toward the good and pious, mildness,
    sincerity, sweet words, apportionment among deities, Pitris, and guests, and adherence
    to servants.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Narada says truthfulness of speech is excellent, knowledge of truth is difficult,
    and truth is what is exceedingly beneficial to creatures.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Narada recommends renouncing pride and heedlessness, practicing contentment,
    studying the Vedas and their branches, pursuing knowledge, moderating sense-objects,
    and relinquishing night wandering, day sleep, idleness, roguery, arrogance, and
    both excessive indulgence and total abstention in sense-objects.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Narada says one should not elevate oneself by depreciating others, and that
    a person of wisdom and merit gains fame by avoiding slander and self-praise.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Narada uses flowers, the Sun, a pit, good and evil words, and the Suryakanta
    gem in comparisons about silent merit, vanity, and speech.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: Narada says wisdom is the most valuable acquisition and advises that one should
    speak only when properly asked, remaining silent otherwise even when intelligent
    and knowledgeable.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Narada advises dwelling among honest, righteous, liberal persons who observe
    the duties of their own order, and avoiding places where the duties of the orders
    are confused.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Narada says living amid the righteous leads to righteousness, while living
    amid the sinful stains one with sin; he compares the effects of virtue and vice
    to sensations conveyed by water, fire, and moon rays.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Narada says eaters of Vighasa eat without noticing flavors, while those who
    carefully discriminate flavors are still tied by the bonds of action.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Narada says a righteous man should leave a place where a Brahmana teaches
    disciples who do not inquire with reverence, and he praises scriptural conduct
    between disciples and preceptors.
  category: relationship
  evidence_refs:
  - ev:6
