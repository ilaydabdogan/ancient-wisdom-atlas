canonical_text:
  quote: Protected by thee, they will protect thee in return.
  summary: A Rakshasa releases the king of the Kaikeyas because the king observes
    duty, and states that rulers who protect kine, Brahmanas, and subjects need not
    fear Rakshasas and may gain heaven. Bhishma then advises that Brahmanas should
    be protected, that their blessings protect righteous kings, and that a ruler who
    properly governs and disciplines those failing their duties obtains prosperity
    and residence in heaven with Indra.
  language: English
  quote_policy: quoted
