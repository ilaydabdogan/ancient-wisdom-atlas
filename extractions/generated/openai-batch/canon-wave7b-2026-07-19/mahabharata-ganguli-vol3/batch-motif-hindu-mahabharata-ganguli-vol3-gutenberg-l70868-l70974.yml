canonical_text:
  quote: ''
  summary: Editorial footnotes explain doctrines of knowledge, renunciation, Samadhi,
    emancipation in Brahma, the apparent non-existence of the universe to a knower,
    the Brahmana's disappointment with Kundadhara and turn toward forest renunciation,
    ascetic speech whose uttered wish is fulfilled, the unchha mode of gleaning subsistence,
    the possible identification of Yajna with Vishnu, plant names used in offerings,
    and vegetable substitution for sacrificial animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A note states that Knowledge obtains Emancipation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note explains complete Renunciation as occurring in Samadhi, says Brahma
    is in that abstraction of Yoga, and describes Emancipation as existence in Brahma
    without dual consciousness of knower and known.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A note contrasts ignorant people, who regard the universe as existent and
    durable, with the man of knowledge, who regards it as truly non-existent although
    it appears existent.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Brahmana had expected Kundadhara to grant wealth in return for adorations;
    when Kundadhara did not heed him, the Brahmana considered giving up desire for
    wealth and retiring into the woods.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Persons who have attained ascetic success can utter a wish and have it immediately
    fulfilled; a verbal gift causes the thing named to appear bodily.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: A person following the unchha mode of life subsists on grains picked from
    fields after reapers have abandoned them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The commentator supposes that Yajna in the passage implies Vishnu, as expounded
    in the Srutis.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: A sacrificer did not slaughter living animals because he could not procure
    them, substituted vegetable products for the animals, and still had sacrifices
    characterized as cruel in intention because they were intended to take him to
    heaven.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The notes gloss several plants or plant names, including Syamaka, Suryaparni
    or Mashaparni, and Suvarchala.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: A note says there may be escape through expiation for some offenses, but no
    such escape for an ingrate because ingratitude is inexpiable.
  category: other
  evidence_refs:
  - ev:10
