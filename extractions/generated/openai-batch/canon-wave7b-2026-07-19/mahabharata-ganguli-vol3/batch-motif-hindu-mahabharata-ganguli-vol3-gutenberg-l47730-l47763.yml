canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma to explain the origin, end, creation, destruction,
    time divisions, life periods, meditation, acts, and conduct of beings and the
    world. Bhishma answers by introducing an old narrative in which Suka, son of the
    divine Vyasa, asks his father about the Creator of all beings and the duties of
    a Brahmana; Vyasa then begins to discourse to him.
