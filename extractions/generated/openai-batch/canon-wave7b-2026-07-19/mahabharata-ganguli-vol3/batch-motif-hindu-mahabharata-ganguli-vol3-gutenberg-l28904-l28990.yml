canonical_text:
  quote: ''
  summary: Yudhishthira marvels at Rama's destruction of Kshatriyas and the concealment
    and upbringing of Kshatriya scions by animals and natural powers. Krishna, Yudhishthira,
    the Pandavas, and others approach Bhishma, who lies on a bed of arrows on the
    sacred bank of the Oghavati, surrounded by ascetics. Krishna praises Bhishma's
    voluntary mastery over death, his virtue, ascetic power, knowledge of past, present,
    and future, and his command of duties, scriptures, histories, and philosophies,
    and asks him to dispel Yudhishthira's grief and doubts.
  language: English
  quote_policy: summarized
