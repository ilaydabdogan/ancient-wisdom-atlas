canonical_text:
  quote: ''
  summary: Ascetic narrators, exhausted by penance, are addressed by an incorporeal
    being from the sky. The voice says that certain white men divested of outer senses
    can behold Narayana and that Narayana can be seen only through complete devotion
    over long ages. The Munis are ordered to return and told that they will later
    aid the deities during a future calamity. The passage then describes Narayana
    as creator, unmanifest, and worshipped through sacrifice. Vrihaspati and King
    Uparichara complete sacrifices. Uparichara later ascends to heaven, falls by a
    Brahmana curse into the earth, remains devoted to Narayana, and ascends again
    by Narayana's grace to a region higher than Brahman's.
  language: English
  quote_policy: summarized
