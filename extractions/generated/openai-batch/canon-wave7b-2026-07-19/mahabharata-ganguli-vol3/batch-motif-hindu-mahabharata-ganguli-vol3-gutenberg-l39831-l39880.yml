canonical_text:
  quote: ''
  summary: Bhishma narrates that Narada reports to the Wind-god the insulting words
    spoken by the Salmali tree on Himavat. The Wind-god angrily confronts the Salmali,
    recalls that the Grandsire once rested beneath it during creation, and says this
    favor—not the tree's strength—has spared it. The Salmali derides and challenges
    the Wind-god, claiming superior strength and intelligence, but at night privately
    admits the Wind-god's greater power and resolves to rely on intelligence against
    fear.
  language: English
  quote_policy: summarized
