  summary: Yudhishthira asks how a Kshatriya should subjugate and fight another Kshatriya.
    Bhishma replies with rules for legitimate conquest, matched combat, restraint
    toward disabled or defeated opponents, care for wounded enemies, and the moral
    consequences of unrighteous victory.
