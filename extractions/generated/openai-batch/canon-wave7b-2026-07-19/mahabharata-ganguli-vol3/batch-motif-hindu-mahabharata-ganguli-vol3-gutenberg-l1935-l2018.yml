canonical_text:
  quote: ''
  summary: Sanjaya describes Pandya/Malayadhwaja as a king and warrior who considers
    himself unsurpassed, devastates Karna's army, and is challenged by Drona's son
    Ashvatthama. The two warriors exchange arrows, chariot attacks, and counterattacks.
    Pandya cuts down Ashvatthama's arrows, horses, and bowstring, but Ashvatthama
    later releases vast arrow showers, which Pandya counters with the Vayavya weapon.
    Ashvatthama then cuts down Pandya's standard, horses, driver, bow, and car.
  language: English
  quote_policy: summarized
