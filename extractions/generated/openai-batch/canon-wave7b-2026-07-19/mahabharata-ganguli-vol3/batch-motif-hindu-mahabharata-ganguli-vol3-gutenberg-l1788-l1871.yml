  quote: ''
  summary: Sanjaya narrates Arjuna's renewed assault on the samsaptakas and other
    hostile warriors. Arjuna kills many men, horses, and elephants, destroys chariots
    and weapons, and is repeatedly compared to Indra destroying demonic foes. Krishna
    urges Arjuna to stop delaying and hasten toward Karna's slaughter, then surveys
    the battlefield strewn with dead warriors and golden weapons. The supplied passage
    ends mid-sentence.
