canonical_text:
  quote: ''
  summary: Vaishampayana recounts that ascetics at Naimisha completed a twelve-year
    sacrifice and then journeyed to the tirthas along the Sarasvati. Crowded by many
    ritualists, the river created multiple abodes or water-receptacles and turned
    her course to accommodate them. Rama/Valadeva later visited Sapta-Saraswat, bathed,
    gave gifts to Brahmanas, and reached the tirtha associated with the ascetic Mankanaka,
    prompting Janamejaya’s questions.
  language: English
  quote_policy: summarized
