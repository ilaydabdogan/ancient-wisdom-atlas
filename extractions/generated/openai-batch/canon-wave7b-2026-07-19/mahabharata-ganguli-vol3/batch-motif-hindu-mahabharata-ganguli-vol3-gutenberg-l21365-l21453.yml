canonical_text:
  quote: ''
  summary: In deep night Ashvatthama slaughters the sleeping and heedless Pandava
    forces. Victims cry out and describe the attack as Rakshasa-like, contrasting
    it with the warrior restraint attributed to Dhananjaya. The field becomes blood-soaked;
    Rakshasas, Pishacas, and other carnivorous beings feast on flesh and blood. At
    dawn Ashvatthama leaves, blood-covered, his sword stuck to his hand, and is compared
    to the fire at the end of the yuga. He reports the deed to his companions, who
    have also killed at the gates; Dhritarashtra then asks why Ashvatthama did this
    only after Duryodhana’s death.
  language: English
  quote_policy: summarized
