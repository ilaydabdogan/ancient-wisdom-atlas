canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma about signs of future greatness and fall. Bhishma
    answers by introducing an old discourse between Sree and Sakra. Narada and Indra
    meet at the Ganga at dawn, perform rites, praise the rising Sun, and see a radiant
    figure approaching. The figure is Sree, also called Padma and Lakshmi, attended
    by Apsaras and associated with lotuses and prosperity. Indra worships and questions
    her. Sree identifies her names and qualities, says she dwells with victorious
    and virtuous people, and says she has left the Asuras because their nature has
    turned adverse and wishes to reside with Indra.
  language: English
  quote_policy: summarized
