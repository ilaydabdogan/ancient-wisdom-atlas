canonical_text:
  quote: ''
  summary: Bhishma narrates that Gautama leaves his abode, joins sea-going merchants,
    survives an elephant attack on their caravan, wanders alone into a heavenly forest,
    rests under a large banyan tree, and encounters the celestial crane Nadijangha/Rajadharman,
    who welcomes him as an honored guest.
  language: English
  quote_policy: summarized
