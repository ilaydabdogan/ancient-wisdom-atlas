canonical_text:
  quote: '"The hero rushes against crowds of foes, adopting the road to heaven."'
  summary: Yudhishthira asks how kings can obtain felicity despite the violence of
    Kshatriya practice. Bhishma answers that kings are purified by chastising the
    wicked, protecting the good, gifts, sacrifices, and battle undertaken in proper
    circumstances. He contrasts heroic battlefield death, which brings merit and Indra's
    heaven, with cowardly desertion or inglorious death at home.
  language: English
  quote_policy: quoted
