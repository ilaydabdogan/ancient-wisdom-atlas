canonical_text:
  quote: The joys and sorrows of human beings are revolving on a wheel.
  summary: A Brahmana counsels an addressee not to grieve, teaching that attachments
    to kin, possessions, joy, and sorrow are unstable; embodied beings experience
    consequences of acts, cycles of happiness and misery, destiny, rebirth, and suffering
    from desire, while wisdom and detachment from possessiveness protect the heart
    from sorrow.
  language: English
  quote_policy: quoted
