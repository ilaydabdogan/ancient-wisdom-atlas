canonical_text:
  quote: When the householder beholds wrinkles on his body and white hair on his head,
    and children of his children, he should then retire into the forest.
  summary: Vyasa describes the transition from household life to forest life and then
    to renunciation, including ascetic observances, sacrifice, exemplary sages, ascent
    to heaven, and internalized sacrifice directed toward Emancipation and the Infinite.
  language: English
  quote_policy: quoted
