canonical_text:
  quote: ''
  summary: Bhishma narrates a divine address to Narada in which the great God, identified
    with Vasudeva and Purusha, describes emancipated devotees, the three attributes,
    universal dissolution into Purusha, the formation and animation of bodies through
    the five elements and Jiva, the emanation of Sankarshana, Pradyumna, and Aniruddha,
    and the illusory character of the divine form seen by Narada.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhishma says that, after showing himself to Narada, the great God addresses
    Narada directly.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deity describes certain worshippers as lunar-complexioned, without senses,
    not subsisting on food, emancipated, and concentrated on him.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same worshippers are said to be freed from Rajas and Tamas and competent
    to enter the deity and merge into his Self.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The supreme being is described as beyond the senses, untouched by Sattwa,
    Rajas, and Tamas, pervading all things, the witness and soul of the universe,
    unborn, eternal, indivisible, and called Purusha and Vasudeva.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sattwa, Rajas, and Tamas are described as three original attributes that dwell
    and act in creaturely bodies; the Jiva-soul called Kshetrajna enjoys and endorses
    their action while transcending them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: At universal dissolution, Earth disappears into Water, Water into Light, Light
    into Wind, Wind into Space, Space into Mind, Mind into Unmanifest Prakriti, and
    Unmanifest Prakriti into inactive Purusha.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Earth, Wind, Space, Water, and Light are named as five primal elements that
    mingle to form the body.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Vasudeva is said to enter the body formed of the five elements; this entrance
    is called his birth and causes the body to move and act.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The entrant into the body is called Jiva and also Sesha and Sankarshana.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Pradyumna arises from Sankarshana and is called the Mind of all creatures;
    Aniruddha arises from Pradyumna and is described as Creator, Cause and Effect,
    Isana, Consciousness, and Iswara.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The speaker says that the entire mobile and immobile universe, the destructible
    and indestructible, and the existent and non-existent spring or flow from him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The speaker tells Narada that the visible form is an illusion, that he can
    dissolve it if he wishes, and that he has disclosed his quadruple form.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: The speaker calls himself the Doer, Cause, Effect, the sum-total and refuge
    of all living creatures, and the Jiva-soul of all creatures; he says he is not
    destroyed when bodies are destroyed.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: Hiranyagarbha is described as the beginning of the world, four-faced, otherwise
    called Brahman, and an eternal deity.
  category: attribute
  evidence_refs:
  - ev:12
