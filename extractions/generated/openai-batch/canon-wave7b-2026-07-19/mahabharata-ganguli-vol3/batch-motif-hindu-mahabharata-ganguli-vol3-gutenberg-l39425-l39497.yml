canonical_text:
  quote: ''
  summary: 'Yudhishthira asks Bhishma whether any mortal has been restored to life
    after death. Bhishma answers by beginning an old story set in the forest of Naimisha:
    a Brahmana''s young son dies, the kinsmen carry the body to the crematorium and
    lament, a vulture urges them to depart and accept mortality, and a black jackal
    counters by urging continued affection and suggesting the child may yet return
    to life. The men turn back toward the corpse.'
  language: English
  quote_policy: summarized
