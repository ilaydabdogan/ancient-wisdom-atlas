  quote: caused a river of blood to flow there that was tawny with flesh and marrow
    and bones.
  summary: Sanjaya describes Arjuna's slaughter in battle as producing a river of
    blood, then recounts Arjuna asking Krishna to drive him toward Karna for single
    combat. Shalya, serving as Karna's driver, urges Karna to meet Arjuna, and Karna
    vows either to slay his opponents or die on the battlefield.
