canonical_text:
  quote: ''
  summary: Bhishma recounts Panchasikha calming a king who is described as enveloped
    in darkness and delusion. Panchasikha teaches that emancipation is neither simple
    extinction nor ordinary existence; the body is a union of body, senses, mind,
    and elements that later disunite. He explains senses, mind, perception, the distinction
    between Soul and not-Soul, and renunciation as the highest path for ending sorrow
    and attaining emancipation. The passage closes with a classification of consciousness
    according to Goodness, Passion, and Darkness.
  language: English
  quote_policy: summarized
