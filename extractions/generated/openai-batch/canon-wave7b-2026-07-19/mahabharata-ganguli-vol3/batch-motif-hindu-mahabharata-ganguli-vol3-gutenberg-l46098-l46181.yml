    as not-Soul are said not to suffer sorrow.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A branch of knowledge called Samyagradha is introduced as treating Renunciation
    and is presented for the king's Emancipation.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Renunciation of acts is prescribed for seekers of Emancipation; sacrifices,
