canonical_text:
  quote: ''
  summary: Ashvatthama attacks a terror-inspiring extraordinary being with celestial
    weapons, but the being absorbs or nullifies them. After his weapons fail, Ashvatthama
    sees the firmament filled with images of Janardana, laments his disregard of counsel
    and scripture, interprets the being as divine chastisement for his sinful intent,
    and seeks Mahadeva/Shiva’s protection. Sanjaya reports that Ashvatthama descends
    from his car, bows, invokes Shiva by many names and attributes, and offers himself
    as a victim.
  language: English
