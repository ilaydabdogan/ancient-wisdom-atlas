canonical_text:
  quote: Indeed, O king, Karna will never slay one like thee.
  summary: Karna and Yudhishthira fight. Karna disables Yudhishthira, pursues him,
    remembers Kunti's words, hears Shalya's warning, mocks Yudhishthira, and releases
    him. Yudhishthira retreats with allied groups following, while Karna and the Kurus
    pursue and attack the Pandava force. Yudhishthira then orders a counterattack.
    A broad battle follows with many warriors and animals slain, and Apsaras or heavenly
    choristers on celestial cars greet slain heroes and carry them away.
  language: English
  quote_policy: quoted
