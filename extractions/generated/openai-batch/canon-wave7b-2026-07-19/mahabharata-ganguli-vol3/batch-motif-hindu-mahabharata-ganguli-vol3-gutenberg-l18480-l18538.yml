canonical_text:
  quote: ''
  summary: Vaishampayana narrates Baladeva’s pilgrimage through several tirthas. At
    Indra-tirtha, Rama’s tirtha, Yamuna, and Aditya-tirtha, the passage recalls earlier
    divine or heroic sacrifices, gift-giving, battles, ablutions, and attainments
    of sovereignty or Yoga powers. Baladeva bathes, worships Brahmanas or Rishis,
    gives presents, and proceeds from one sacred site to the next.
  language: English
  quote_policy: summarized
