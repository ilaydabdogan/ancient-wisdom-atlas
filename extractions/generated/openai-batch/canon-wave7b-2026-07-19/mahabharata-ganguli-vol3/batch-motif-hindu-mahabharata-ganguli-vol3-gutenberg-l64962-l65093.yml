literal_observations:
- id: obs:1
  text: Perfect renunciation is described as standing alone in the world, belonging
    to nobody and having nobody belong to oneself; Janaka's abandonment of wife and
    kingdom is said to be inconsistent with this complete withdrawal.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Libations are said to be efficacious when poured upon fires properly kindled
    with mantras.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Janaka is said to be able to resume his kingdom, practise charity, and rule
    without attachment while still being regarded as a mendicant.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Nyaya definition is cited in which soul or mind is distinguished by desire,
    aversion, will, pleasure, pain, and cognitive faculties.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The soul is described as entering other bodies after the dissolution of prior
    bodies because of Avidya; when freed from Avidya, action ceases and the soul's
    true nature is revealed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The notes contrast performing sacrifices with wealth and not performing sacrifices
    when wealth is lacking; misuse of wealth is treated as an offense against oneself.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Srutis are said to teach that one who frightens others is frightened,
    while one who does not frighten others is not frightened.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Yudhishthira is exhorted to take sovereignty, with the claim that righteous
    and unattached rule will bring future bliss.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A severe penance is explained as intended to secure human birth rather than
    animal birth in a next life.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The notes state that humans desire freedom from decay and immortality, but
    decay and death are their portion on Earth, and every creature is subject to birth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A philosophical dispute is noted over whether body exists independent of life
    or creature independent of body; the gross body may dissolve while a subtle body
    is maintained as cause for the unborn Soul.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: One sacrifice is defined as requiring the performer to part with all wealth;
    seven named sacrifices require Soma consecration.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: A royal umbrella is explained as a sign that only kings could have held over
    their heads.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: Manu is cited as also mentioning a sixth of produce as the king's share.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: Kanwa is said to have raised Sakuntala in his retreat after Menaka deserted
    her immediately after birth; Bharata is said to have been born in Kanwa's retreat.
  category: sequence
  evidence_refs:
  - ev:13
