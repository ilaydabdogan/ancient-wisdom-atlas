canonical_text:
  quote: ''
  summary: 'Bhishma answers Yudhishthira’s question about kingly conduct by narrating
    a cautionary animal history: a camel gains a boon for an extraordinarily long
    neck, becomes idle, shelters in a mountain cave during a storm, is eaten by a
    jackal couple, and dies. Bhishma applies the tale to kingship, urging vigilance,
    self-restraint, intelligence, proper means, and wise counsel.'
  language: English
  quote_policy: summarized
