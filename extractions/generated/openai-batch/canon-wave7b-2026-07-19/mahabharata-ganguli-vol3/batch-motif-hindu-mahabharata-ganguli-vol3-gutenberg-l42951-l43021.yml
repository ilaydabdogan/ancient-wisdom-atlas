canonical_text:
  quote: ''
  summary: Bhrigu teaches that Truth is Brahma and Penance, that it creates and upholds
    beings and leads to heaven, while untruth is Darkness and leads downward. He pairs
    truth, righteousness, light, and happiness against untruth, unrighteousness, darkness,
    and misery. Bharadwaja challenges the claim that happiness is highest by citing
    ascetic exemplars, including Brahman’s celibacy and the lord of Uma’s destruction
    of Kama. Bhrigu replies that darkness produces unrighteousness and many sufferings,
    while heaven lacks hunger, thirst, decrepitude, and sin. He concludes with a procreative
    schema in which Earth is progenitrix, the male is like Prajapati, seed is creative
    energy, and each being obtains happiness or misery according to its own acts.
  language: English
  quote_policy: summarized
