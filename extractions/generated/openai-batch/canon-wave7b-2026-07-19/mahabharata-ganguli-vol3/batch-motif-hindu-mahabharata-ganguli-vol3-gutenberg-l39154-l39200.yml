canonical_text:
  quote: ''
  summary: Bhishma recounts that a fowler sees the pigeon couple on a celestial car,
    resolves to imitate their austerities, renounces food and affection, passes by
    a tempting lake, enters a thorny forest, and deliberately runs into a great forest
    fire. The fire consumes him, cleanses his sins, and he attains heaven along with
    the pigeon and spouse. Bhishma concludes with teachings on spousal devotion, the
    merit of hearing the story, and the high duty of protecting a suppliant.
  language: English
  quote_policy: summarized
