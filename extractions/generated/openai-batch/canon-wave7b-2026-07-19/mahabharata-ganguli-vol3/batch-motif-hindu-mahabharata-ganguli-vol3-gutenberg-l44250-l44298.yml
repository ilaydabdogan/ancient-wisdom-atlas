canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma about the fruits of Vedic knowledge, observances,
    vows, and knowledge of the creature-soul. Bhishma introduces an old dialogue in
    which Vrihaspati, disciple of Manu, asks Manu about cosmic origins, ritual ordinances,
    fruits of knowledge and sacrifice, things unrevealed by the Vedas, the five elements,
    and the departure of an embodied being from one body to another. Manu answers
    by distinguishing happiness and misery, desire-driven acts, knowledge that avoids
    both happiness and misery, sacrifice connected with desire, liberation from desire,
    attainment of Brahma, and hell as the result of desire-driven action for happiness.
    Vrihaspati restates that human aspirations seek the agreeable and avoid the disagreeable
    through acts.
  language: English
  quote_policy: summarized
