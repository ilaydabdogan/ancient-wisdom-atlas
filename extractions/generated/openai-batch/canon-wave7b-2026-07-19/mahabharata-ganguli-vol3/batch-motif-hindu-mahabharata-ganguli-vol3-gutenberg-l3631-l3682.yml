canonical_text:
  quote: ''
  summary: 'Mahadeva/Hara is described in resplendent battle-readiness with a terrible
    retinue and the universe gathered around him. He arms himself, ascends a celestial
    car while praised by gods and other beings, asks who will drive it, and instructs
    the gods to choose someone superior to himself. The gods petition the Grandsire
    to serve as driver, describing the cosmic composition of the car: the four Vedas
    as steeds, the Earth with mountains as the car, and the stars as its adornments.'
  language: English
  quote_policy: summarized
