canonical_text:
  quote: ''
  summary: Karna answers Shalya by asserting his own knowledge of Arjuna and Krishna,
    describes a single worshipped serpent-like shaft reserved for one of them, boasts
    that he can kill the pair, names their martial emblems, and then turns to an extended
    denunciation of Shalya and the Madrakas, including proverbial sayings and an Atharvan-style
    scorpion-poison exorcism formula.
  language: English
  quote_policy: summarized
