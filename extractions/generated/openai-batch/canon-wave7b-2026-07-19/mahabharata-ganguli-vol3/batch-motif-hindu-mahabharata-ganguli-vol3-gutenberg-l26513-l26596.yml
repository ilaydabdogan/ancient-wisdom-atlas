  quote: ''
  summary: Asma gives a didactic discourse on joy, grief, pride, royal punishment,
    the causes of mental sorrow, the inevitability of decrepitude and death, the power
    of Time and Destiny, the transience of kinship, and the religious duties of one
    seeking knowledge, including rites for ancestors and gods.
  language: English
  quote_policy: summarized
