canonical_text:
  quote: There was a lordly (Salmali) tree on one of the heights of Himavat.
  summary: Yudhishthira asks Bhishma how a weak and foolish person should act after
    provoking a powerful nearby foe. Bhishma answers by citing an old story involving
    the Salmali tree and Pavana. The passage describes a vast Salmali tree on Himavat,
    used as shelter by animals, birds, travelers, merchants, and ascetics. Narada
    praises the tree and asks whether Pavana, the powerful wind god, protects it out
    of friendship, since Pavana can uproot strong trees, move mountain summits, and
    dry up waters.
  language: English
