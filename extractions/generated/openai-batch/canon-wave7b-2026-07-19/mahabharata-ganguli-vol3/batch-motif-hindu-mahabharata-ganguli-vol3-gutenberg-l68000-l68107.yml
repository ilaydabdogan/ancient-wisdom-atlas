  summary: A sequence of translator and commentator notes explains disciplined intelligence,
    non-coveting, the enduring karmic effect of speech, the relation of Soul, Mind,
    Ignorance or Delusion, dreams, past impressions, the three attributes, yogic withdrawal,
    dreamless sleep, omniscience, and the indirect comprehension of Brahma through
    reason, analogy, and Pratyahara.
