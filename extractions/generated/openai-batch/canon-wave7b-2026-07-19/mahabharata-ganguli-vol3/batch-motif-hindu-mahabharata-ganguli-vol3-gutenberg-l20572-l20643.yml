canonical_text:
  quote: ''
  summary: Kripa teaches that success depends on both Destiny and Exertion. Sanjaya
    reports that Ashvatthama, overcome by grief, rejects or qualifies that counsel
    through a speech on differing human understandings, time, distress, prosperity,
    and resolution. Ashvatthama then invokes the Creator's assignment of duties to
    social orders and declares that, though born a Brahmana, he is joined to Kshatriya
    practice and must avenge his father's death.
  language: English
  quote_policy: summarized
