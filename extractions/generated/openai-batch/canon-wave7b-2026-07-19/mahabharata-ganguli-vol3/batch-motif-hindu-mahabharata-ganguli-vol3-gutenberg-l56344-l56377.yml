canonical_text:
  quote: ''
  summary: A speaker teaches a king that Sankhya philosophy contains and sources many
    forms of high knowledge, describes the post-mortem destinies of Sankhya followers,
    and identifies Sankhya with Narayana and the universe. Narayana is said to bring
    creation to life, swallow everything at destruction, withdraw everything into
    his body, and sleep as the inner Soul of the universe.
  language: English
  quote_policy: summarized
