  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: A high-souled person fully conversant with the vast, ancient, ocean-like,
    immeasurable Sankhya system is said to become equal to Narayana.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Sankhya is described as the embodiment of Narayana and of the universe as
