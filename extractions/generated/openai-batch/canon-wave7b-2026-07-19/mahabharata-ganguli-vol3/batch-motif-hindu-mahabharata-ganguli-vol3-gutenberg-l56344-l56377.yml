    in the world is said to flow from the high knowledge among the Sankhyas.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tranquillity of soul, puissance, subtle scriptural knowledge, subtle penances,
    and felicity are said to be ordained in the Sankhya system.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sankhyas who fail to acquire complete knowledge attain the status of deities,
