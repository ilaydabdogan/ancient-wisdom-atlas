canonical_text:
  quote: ''
  summary: Yudhishthira questions how righteousness or duty can be known when scripture,
    exemplary conduct, circumstance, age, motive, and practical result all vary. He
    argues that duty cannot be determined by scripture alone, uses images of razor-edge
    subtlety, mountain grossness, vanishing vapour, and drying waterworks, and concludes
    that what the learned of ancient times settled as righteousness remains authoritative.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yudhishthira says he has an inward light by which he can discriminate between
    right and wrong by inferences.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: He says embodied creatures take birth, exist, and leave their bodies by their
    own nature, and that duty and its reverse cannot be ascertained by study of scriptures
    alone.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: He contrasts the duties of a well-off person with the duties of a distressed
    person and asks how duty in distress can be known from scripture alone.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: He says that defining righteousness by the acts of the good is circular, because
    the good are themselves known by their acts.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: He observes that ordinary persons may appear to achieve righteousness while
    committing unrighteousness, and extraordinary persons may achieve righteousness
    through acts that appear unrighteous.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: He states that Vedic ordinances gradually disappear in successive ages and
    that duties differ in the Krita, Treta, Dwapara, and Kali ages.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: He says Srutis and Smritis may contradict each other, and that powerful wicked
    persons may stop portions of certain righteous courses of action.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: He describes the course of duty as finer than a razor’s edge and grosser than
    a mountain, and says righteousness can appear like distant vapour edifices and
    disappear when examined.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: He compares Smriti practices that fall into discontinuance to small ponds
    and shallow aqueducts that dry up, saying they disappear in the Kali age.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: He says some non-good persons become hypocrites under desire, others’ wishes,
    or similar motives, and that fools call righteousness an empty sound among the
    good.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: He says the same course of conduct may make one person meritorious, obstruct
    another in acquiring merit, and leave another unchanged.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: He concludes that only what the learned of ancient times called righteousness
    remains righteousness, and that through that settled conduct distinctions and
    limitations became eternal.
  category: speech
  evidence_refs:
  - ev:6
