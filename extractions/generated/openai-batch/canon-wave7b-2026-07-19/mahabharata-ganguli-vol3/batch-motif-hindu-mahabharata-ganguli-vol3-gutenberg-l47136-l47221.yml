canonical_text:
  quote: ''
  summary: A defeated chief of the Daityas addresses Indra, arguing that Time has
    swept away mighty sovereigns, caused his own fall, and will eventually end Indra's
    rule. He counsels detachment from pride, grief, and joy, recalls former battles
    against the gods, and describes Time as an irresistible creator, destroyer, actor,
    and dark binder. Indra restrains his anger after hearing him.
  language: English
  quote_policy: summarized
