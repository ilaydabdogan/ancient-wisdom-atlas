canonical_text:
  quote: ''
  summary: A doctrinal passage ranks Vedic knowledge above ignorance, describes virtues
    produced by righteous rites, and presents Brahmacharya as the foremost means to
    Brahma and Emancipation. It gives rules for restraining passion, including avoidance
    practices and water-based expiations for desire or dream desire. It then explains
    bodily ducts, the Manovaha duct to the heart, the generation and emission of vital
    seed through desire and imagination, and the possibility of avoiding rebirth through
    restraint, mental discipline, and directing the vital breaths at death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Regenerate persons conversant with the Vedas are ranked foremost and described
    as all-seeing, omniscient, and conversant with Brahma.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person without knowledge is compared to a blind man without a guide encountering
    obstacles on a road.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Righteous persons observant of both kinds of religion are said to display
    purity of speech, body, and mind, forgiveness, truth, steadiness, and intelligence.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Brahmacharya is described as the means of attaining Brahma and Emancipation
    and as a state free from connection with the senses.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Different degrees of practicing Brahmacharya are assigned different outcomes:
    attaining Brahma, reaching the condition of the gods, or being born as learned
    Brahmanas.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Brahmacharya practitioner is instructed to subdue Passion and avoid speaking
    with women or looking at an undressed woman.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: If desire arises during the vow, the practitioner is instructed to observe
    Krichchhra and spend three days in water; if desire occurs in a dream, he is instructed
    to dive in water and recite three Riks by Aghamarshana three times.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The wise practitioner is instructed to burn in his mind the sins due to Passion.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The body is described as nourished by juices passing through ducts, including
    ten principal ducts and thousands of smaller branches, compared to rivers filling
    the ocean.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Manovaha duct is said to lead to the heart and draw from the body the
    vital seed born of desire.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Passion born in imagination, even during dreams, is said to assail the mind
    and cause the Manovaha duct to emit the vital seed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Atri is named as a divine Rishi knowledgeable about the generation of the
    vital seed, and Indra is named as its presiding deity.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Persons who restrain passion and understand the course of vital seed are said
    to have their sins burnt off and not be subjected to rebirth.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: A person who sustains the body, equalizes the three attributes, and brings
    the vital breaths to Manovaha at the last moments is said to escape rebirth.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The minds of successful meditators are described as freed from desire, eternal,
    and luminous.
  category: attribute
  evidence_refs:
  - ev:9
