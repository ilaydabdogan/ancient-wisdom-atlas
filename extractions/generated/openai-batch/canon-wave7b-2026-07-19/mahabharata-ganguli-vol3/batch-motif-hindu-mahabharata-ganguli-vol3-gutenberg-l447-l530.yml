canonical_text:
  quote: ''
  summary: Sanjaya reports to a king that many Pandava-allied warriors and rulers
    have been slain by Bhishma, Drona, and other opposing warriors. The report repeatedly
    states that fallen warriors have gone or been sent to Yama's abode, heaven, or
    regions attained by death in battle. Abhimanyu's death is singled out as a last
    stand after great slaughter, encirclement by six car-warriors, loss of his car,
    and continued fighting according to Kshatriya duty.
  language: English
