canonical_text:
  quote: ''
  summary: Vaisampayana frames a difficult question as a mystery requiring penance
    and Purana knowledge, then recounts Vyasa's answer to his disciples on Meru. Vyasa
    says his austerities and sense restraint at the Ocean of milk gratified Narayana,
    producing omniscience and knowledge of the beginning of the Kalpa. He describes
    a cosmogonic sequence from the Supreme Soul through the Unmanifest and Manifest
    to Brahman, the elements, beings, Prakritis, Vedas, sacrifices, Rudras, and cosmic
    administrators. These beings ask Brahman for their jurisdictions; Brahman leads
    them to seek the protection and counsel of the unmanifest witness of the world
    at the northern shore of the Ocean of milk, where they practice severe vows for
    a thousand celestial years and hear Vedic words.
  language: English
  quote_policy: summarized
