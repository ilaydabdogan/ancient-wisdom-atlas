canonical_text:
  quote: ''
  summary: Sanjaya narrates a renewed battle in which Shalya leads the Kuru troops
    against the Pandavas. Shalya drives the Pandava army back, and Yudhishthira vows
    either to kill Shalya, his maternal uncle, or be killed by him. Yudhishthira arranges
    protectors for his chariot and advances. The allied troops rally with conchs,
    drums, roars, bells, and trumpets. Shalya and Yudhishthira exchange showers of
    arrows, while Bhima and Duryodhana fight; Duryodhana cuts down Bhima's standard
    and bow, and Bhima wounds Duryodhana with a dart.
  language: English
  quote_policy: summarized
