canonical_text:
  quote: ''
  summary: Sanjaya describes Arjuna routing an army with arrows; scattered warriors
    flee, tend the wounded, regroup, and return to battle. Dhrishtadyumna fights Duryodhana,
    kills Duryodhana's horses and driver, and Duryodhana retreats on horseback. A
    force of 3,000 elephants surrounds the five Pandavas; Arjuna, Bhima, Yudhishthira,
    the two sons of Madri, and Dhrishtadyumna attack the elephant force. Ashvatthama,
    Kripa, and Kritavarma search for Duryodhana, while wounded Kshatriyas urge continued
    fighting. The supplied passage ends mid-speech.
  language: English
  quote_policy: summarized
