canonical_text:
  quote: ''
  summary: After the warriors have been slaughtered, Yudhishthira and his companions
    go to meet Dhritarashtra near the Ganga. Grieving Bharata women lament and accuse
    Yudhishthira of killing kin, teachers, and sons. Dhritarashtra embraces Yudhishthira,
    then seeks Bhima in wrath. Krishna, foreseeing Dhritarashtra's intent, removes
    the real Bhima and presents an iron statue, which Dhritarashtra crushes in his
    embrace. After vomiting blood and falling, Dhritarashtra returns from wrath to
    grief. Krishna reveals that Bhima is alive and urges Dhritarashtra to abandon
    grief and revenge because killing Bhima would not revive his sons.
  language: English
  quote_policy: summarized
