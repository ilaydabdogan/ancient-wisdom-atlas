canonical_text:
  quote: ''
  summary: In a didactic animal narrative, a hungry tiger-king finds his meat missing.
    Rival ministers accuse the learned jackal minister and cause the meat to be found
    in the jackal's dwelling. The tiger's mother warns against envy-driven accusation,
    deceptive appearances, and rash punishment, urging scrutiny and forgiveness. A
    righteous agent reveals the accusation as false; the jackal is acquitted and honored,
    but, feeling insulted and distrustful, asks to undertake the Praya vow and explains
    that disgraced servants can become dangerous to their masters.
  language: English
  quote_policy: summarized
