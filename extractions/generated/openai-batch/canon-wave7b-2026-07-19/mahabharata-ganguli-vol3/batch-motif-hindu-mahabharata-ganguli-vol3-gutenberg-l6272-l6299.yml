canonical_text:
  quote: ''
  summary: 'Kritavarma challenges Dhrishtadyumna in battle. The two exchange heavy
    arrow attacks: Dhrishtadyumna wounds Kritavarma, Kritavarma covers Dhrishtadyumna
    and his car with shafts, and Dhrishtadyumna answers with an arrow shower that
    Kritavarma checks. Dhrishtadyumna then kills Kritavarma''s driver with a broad-headed
    arrow, resists the Kauravas, and the wider battle resumes.'
  language: English
  quote_policy: summarized
