canonical_text:
  quote: ''
  summary: Sanjaya narrates that Arjuna, angered by Yudhishthira's words, draws his
    sword. Krishna questions him, and Arjuna explains a secret vow to kill anyone
    who tells him to give his Gandiva to another. Krishna rebukes Arjuna and teaches
    that morality is subtle, that non-injury is superior to killing, and that truth
    and falsehood may change ethical value in particular circumstances. Krishna invokes
    Valaka and Kausika as moral examples, and Arjuna asks to hear their story.
  language: English
  quote_policy: summarized
