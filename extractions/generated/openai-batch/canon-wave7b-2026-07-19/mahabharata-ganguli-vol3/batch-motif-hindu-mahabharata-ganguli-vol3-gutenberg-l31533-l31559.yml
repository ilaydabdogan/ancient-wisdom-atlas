canonical_text:
  quote: ''
  summary: 'Kasyapa tells a prince that the other world differs for righteous and
    sinful persons: meritorious persons enjoy bright, honey-filled regions without
    death, decrepitude, or sorrow, while sinful persons go to a dark hell of ceaseless
    pain, sorrow, infamy, and remorse. He then teaches that union between Brahmanas
    and Kshatriyas prevents grief among the people, that a king should first appoint
    a learned Brahmana priest and then be crowned, and that Brahmanas should be honored
    by kings because of their precedence and reciprocal support of Kshatriyas.'
  language: English
  quote_policy: summarized
