canonical_text:
  quote: ''
  summary: Bhishma closes a teaching on Brahma by saying that Jiva returns through
    ignorance of the Supreme Soul, but liberating knowledge of Brahma, Kshara, and
    Akshara frees one from fear, grief, rebirth, and the Ocean of Ignorance, ending
    in identity with the Supreme Soul. The knowledge is presented as transmitted through
    a lineage from Hiranyagarbha to Vasishtha, Narada, and Bhishma.
  language: English
  quote_policy: summarized
