canonical_text:
  quote: ''
  summary: A hymn addresses Rudra/Mahadeva as cosmic, watery, creator, master, and
    indwelling soul, invokes deities and Rudras in many locations, explains Daksha's
    failure to invite Rudra to sacrifices, and ends with Mahadeva becoming pleased,
    ceasing further injury, and granting Daksha companionship and sacrificial merit.
  language: English
  quote_policy: summarized
