canonical_text:
  quote: ''
  summary: Manu teaches a sequence of emanation from the eternal One through space,
    wind, light, water, and the universe; the dissolution of bodies into elements;
    the non-return of those who attain Brahma; the withdrawal of senses; Knowledge
    as superior to the senses; and the passage of the Soul from one body to another
    after death.
  language: English
  quote_policy: summarized
