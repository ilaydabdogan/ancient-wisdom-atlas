  quote: '"The tears she had shed become diseases"'
  summary: The speaker explains that gods may be born as mortals when merit ends,
    and mortals may attain divine status through sufficient merit. The king is told
    not to grieve because his son has reached heaven. Death is said to have been created
    by the Self-born, to cut off living beings at their appointed time; Death's tears
    became diseases that take beings when their last hour arrives.
