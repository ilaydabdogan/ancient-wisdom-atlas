canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma for further discourse on morality. Bhishma introduces
    an old narrative in which the ascetic Gotama, dwelling on the Paripatra hills
    after prolonged austerities, is visited by Yama. Gotama asks how one is freed
    from the debt owed to mother and father and how one wins regions of bliss. Yama
    answers that truth, purity, penance, worship of parents, and Horse-sacrifices
    with abundant gifts to Brahmanas bring such felicity.
  language: English
  quote_policy: summarized
