canonical_text:
  quote: ''
  summary: Arjuna speaks to a king about the duties of household life, warning that
    external marks of mendicancy without conquest of anger and faults may be a means
    of sustenance rather than virtue. He urges support for truly pious ascetics, praises
    maintenance of the sacred fire, sacrifice, gifts, charity, non-injury, protection
    of creatures, reverence for elders, worship of Brahmanas, truthfulness, and the
    gratification of gods, guests, and creatures as ways to attain regions of bliss.
  language: English
  quote_policy: summarized
