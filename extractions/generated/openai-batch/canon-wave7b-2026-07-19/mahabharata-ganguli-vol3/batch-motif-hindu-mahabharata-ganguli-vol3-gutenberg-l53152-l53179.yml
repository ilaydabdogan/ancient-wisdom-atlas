canonical_text:
  quote: ''
  summary: Maheswara identifies Vritra as a powerful Asura with universal scope, illusion-powers,
    and boons won through severe penance. He gives Sakra his energy and commands him
    to slay Vritra with the thunderbolt. Sakra promises to do so. Bhishma narrates
    that a fever born from Mahadeva's energy overtakes Vritra; the gods and Rishis
    rejoice, the Asuras lose memory and powers of illusion, and Indra assumes an awe-inspiring
    form while seated on his car.
  language: English
  quote_policy: summarized
