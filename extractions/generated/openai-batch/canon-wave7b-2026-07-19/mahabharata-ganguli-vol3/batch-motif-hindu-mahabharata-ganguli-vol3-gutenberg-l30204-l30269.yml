canonical_text:
  quote: ''
  summary: 'Bhishma instructs Yudhishthira on four modes of life: Vanaprastha, Bhaikshya,
    Garhasthya, and Brahmacharya. He describes rites, conduct, restraints, household
    obligations, ascetic discipline, hospitality, sacrifice, study, and the spiritual
    results attached to each mode, including absorption with the eternal Soul or blessed
    heavenly rewards.'
  language: English
  quote_policy: summarized
