canonical_text:
  quote: ''
  summary: Sulabha addresses the king of Mithila about Emancipation, questioning his
    attachment to royal signs, defending her yogic entrance into his person as non-physical
    and non-mixing, explaining non-attachment through analogies, identifying her ascetic
    lineage and purpose, and comparing her brief stay in his person to a mendicant's
    one-night stay in an empty house.
