canonical_text:
  quote: ''
  summary: Bhishma teaches Yudhishthira that Kshatriya power is quelled when directed
    against Brahmanas, just as fire is neutralized by water and iron by stone. He
    says taking up arms to protect Brahmanas, morality, and oneself can be righteous
    and lead to heavenly reward. Yudhishthira asks whether a powerful non-Kshatriya
    may protect the people when robbers prevail and Kshatriyas fail. Bhishma answers
    that anyone who becomes a means of rescue for the helpless deserves respect, and
    that the person who protects the good and restrains the wicked deserves to become
    king.
  language: English
  quote_policy: summarized
