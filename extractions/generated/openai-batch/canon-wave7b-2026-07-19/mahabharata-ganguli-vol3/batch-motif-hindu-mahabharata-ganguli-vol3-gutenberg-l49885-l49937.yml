canonical_text:
  quote: There is a wonderful tree, called Desire, in the heart of a man.
  summary: 'Vyasa gives an allegorical teaching: desire is described as a tree growing
    in the human heart from error and nourished by ignorance, heedlessness, grief,
    fear, envy, and past evil acts. Greedy people worship it for its fruit, while
    a disciplined yogic person cuts its root with samadhi. The body is then described
    as a city governed by understanding, mind, senses, and inner qualities, with Rajas
    and Tamas corrupting the faculties and afflicting the soul.'
  language: English
  quote_policy: quoted
