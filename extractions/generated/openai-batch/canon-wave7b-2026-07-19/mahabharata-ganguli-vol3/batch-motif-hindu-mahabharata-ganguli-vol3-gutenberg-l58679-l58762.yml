canonical_text:
  quote: ''
  summary: A speaker addresses Janaka, arguing that kingship offers little real independence
    or possession. The king’s enjoyments are limited, he is constrained by duties,
    petitioners, counsellors, treasury, fear, disease, grief, and sleeplessness. The
    passage compares sovereignty to insubstantial flames fed by straw and bubbles
    on water, describes all householders as king-like within their houses, lists the
    interdependent limbs of a kingdom, and says righteous rule earns sacrificial merit
    while still being burdened by many faults.
  language: English
  quote_policy: summarized
