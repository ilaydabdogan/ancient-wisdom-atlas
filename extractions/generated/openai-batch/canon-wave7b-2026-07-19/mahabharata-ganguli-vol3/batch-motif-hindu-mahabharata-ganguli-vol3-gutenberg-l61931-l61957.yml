canonical_text:
  quote: ''
  summary: Vaisampayana reports that the arranger of the Vedas delivered a discourse
    to his son Suka and disciples, after which the preceptor and disciples adored
    the great Deity with hymns from the four Vedas. The passage then states benefits
    for those who utter a bow to the holy Lord and listen to, read, or recite the
    discourse, including intelligence, health, release from illness or bonds, fulfillment
    of desires, long life, social and vocational benefits, fertility, safe travel,
    and happiness for devotees hearing the narrative.
  language: English
  quote_policy: summarized
