canonical_text:
  quote: ''
  summary: The passage presents moral instruction in which the Swan answers questions
    from the Sadhyas. It contrasts disciplined, truthful, righteous conduct with attachment,
    sensory indulgence, malice, covetousness, and ignorance. The Swan identifies wisdom
    as the quality that makes a Brahmana happy, silent amid crowds, strong despite
    weakness, and free from quarrel, and it explains Brahmanical divinity, purity,
    impurity, and humanity in terms of Vedic study, vows, obloquy, and death. Bhishma
    closes by identifying the passage as a narrative of the discourse between the
    Sadhyas and the Swan.
  language: English
  quote_policy: summarized
