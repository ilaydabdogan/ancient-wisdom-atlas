canonical_text:
  quote: ''
  summary: 'Vrihaspati instructs Purandara on royal policy toward enemies: avoid open
    quarrel, conceal emotion, speak sweetly, use counsel and agents, divide or weaken
    foes, wait for opportunity, preserve secrecy, distinguish seen from unseen foes,
    submit tactically before stronger powers, balance mildness and severity, and defeat
    multiple enemies one by one.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vrihaspati says that one should not try to subdue foes by quarrel, should
    conceal ire, fear, and joy, and should speak sweet words to foes while not truly
    trusting them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage compares a king's handling of foes to a fowler who imitates bird
    cries in order to capture or kill birds.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says that after overcoming foes one should not rest easily, because
    a wicked foe can rise again like a fire that has been carelessly extinguished.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vrihaspati advises consultation with ministers and intelligent persons, use
    of trusted agents, production of disunion, gifts, and poison to weaken enemy forces.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage advises waiting for the proper opportunity, avoiding injuries
    or words that rankle, breaking the enemy's strength, and watching for the enemy's
    lapses.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that when one minister can accomplish a secret object,
    the king should consult that one minister only, because many ministers may disclose
    what should remain secret.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage distinguishes unseen foes, against whom divine chastisement is
    to be invoked, from seen foes, against whom the fourfold army is to be moved.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says that a weaker ruler may humble himself before a stronger
    king through prostration, tribute, and sweet words, while avoiding acts that arouse
    suspicion.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says that a victorious king should not trust vanquished foes,
    because the vanquished remain wakeful.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage advises that a king should be neither only fierce nor only mild,
    but both fierce and mild.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage compares heedlessness and error ruining a kingdom to a rapid current
