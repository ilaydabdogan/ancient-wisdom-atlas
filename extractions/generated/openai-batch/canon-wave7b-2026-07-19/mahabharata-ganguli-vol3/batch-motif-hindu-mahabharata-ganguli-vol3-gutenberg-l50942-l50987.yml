canonical_text:
  quote: Harmlessness to all creatures is the highest of all duties.
  summary: Bhishma cites an old narrative about King Vichakhy, who sees suffering
    cattle in a cow-slaying sacrifice, blesses the kine, and denounces animal slaughter
    in sacrifice. The passage praises harmlessness, cites Manu, criticizes sacrificial
    use of meat and intoxicants, and names Vishnu/Supreme Deity as properly worshiped
    with Payasa, leaves, flowers, and pure offerings. Yudhishthira asks how a wholly
    non-harming person can maintain the body; Bhishma replies that one should acquire
    merit and act so the body does not suffer and death does not come.
  language: English
  quote_policy: quoted
