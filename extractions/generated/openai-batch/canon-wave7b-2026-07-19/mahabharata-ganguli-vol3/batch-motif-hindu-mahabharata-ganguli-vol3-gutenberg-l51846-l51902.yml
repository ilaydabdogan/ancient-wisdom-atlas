canonical_text:
  quote: Those myriads of Brahmanas have become stars and constellations set in their
    fixed tracks.
  summary: The passage describes pure Brahmanas as celestial luminaries who have attained
    Infinity through contentment or renunciation. It explains that true Brahmana status
    is determined by conduct, discipline, Yoga, purity, and knowledge of Brahma. Renunciation
    is presented as an eternal practice leading to Emancipation and rescue from worldly
    misery. Syumarasmi asks Kapila to compare householders, gift-givers, sacrificers,
    Vedic students, and renouncers in relation to heaven and Emancipation; Kapila
    states that domesticity is auspicious but lacks the felicity attached to Renunciation.
  language: English
  quote_policy: quoted
