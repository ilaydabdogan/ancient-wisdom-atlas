canonical_text:
  quote: ''
  summary: A divine assembly praises Nara and Narayana, grants Karna heavenly bliss
    while assigning victory to the two Krishnas, and prepares to witness the duel
    between Karna and Arjuna. The warriors’ chariots, standards, conches, steeds,
    glances, and banner emblems are described; Arjuna’s ape emblem attacks Karna’s
    elephant-rope emblem, and Shalya vows revenge if Karna is slain.
  language: English
  quote_policy: summarized
