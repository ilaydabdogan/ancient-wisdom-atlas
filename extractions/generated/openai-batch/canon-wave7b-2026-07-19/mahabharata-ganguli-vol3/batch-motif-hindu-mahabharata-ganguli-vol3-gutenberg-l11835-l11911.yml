canonical_text:
  quote: '"Turn back, O Duryodhana! Let the troops retire!"'
  summary: Shalya describes a devastated battlefield covered with slain elephants,
    horses, warriors, broken chariots, weapons, ornaments, and royal emblems. He compares
    the earth to the Vaitarani near Yama's realm and says fallen warriors have gone
    to regions of bliss. He urges Duryodhana to withdraw as the sun is low and reminds
    him that he caused the destruction.
  language: English
  quote_policy: quoted
