canonical_text:
  quote: ''
  summary: A sequence of translator's notes explains doctrines of Soul, ignorance,
    embodiment, karma, rebirth, sense-control, ascetic practice, yoga, sense-independent
    knowledge, and emancipation. The notes describe the Soul remembering past acts
    in the womb, passions and senses being conquered through scriptural knowledge
    and abstention, yogic control of vital breaths, the arising of luminous knowledge,
    the merging or destruction of mind into Soul, and Bharata's rebirth as a deer
    due to attachment.
  language: English
  quote_policy: summarized
