  text: The note identifies Chit or Soul as all-Knowledge and says that, when overspread
    by ignorance or darkness, it assumes a form or body.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same note calls knowledge overspread by darkness the seed of the body
    and distinguishes it from pure Knowledge or Soul before life.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: While in the mother's womb, the Soul is said to remember acts of past lives,
    and those acts influence the growth of its senses and its future character.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the senses are originated in Rajas or Passion and may be
    destroyed through the destruction or conquest of Rajas, aided by scriptural knowledge.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
