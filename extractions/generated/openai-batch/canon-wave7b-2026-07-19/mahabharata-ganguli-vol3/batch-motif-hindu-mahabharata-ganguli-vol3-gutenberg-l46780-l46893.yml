canonical_text:
  quote: ''
  summary: Bhishma recounts that the radiant goddess of Prosperity, Sree/Lakshmi,
    emerges from Vali's body. Sakra questions Vali and Sree about her identity and
    why she has left Vali. Sree says Time moves her, that she dwells in virtues such
    as truth, gifts, vows, penances, prowess, and virtue, and that Vali has fallen
    away from these. She asks Sakra to divide her into four parts. Sakra assigns her
    quarters to earth, waters, fire, and good truthful people devoted to Brahmanas.
    Vali then foretells a future battle between gods and Asuras when the sun shines
    only upon Brahman's region in the middle of Sumeru.
  language: English
  quote_policy: summarized
