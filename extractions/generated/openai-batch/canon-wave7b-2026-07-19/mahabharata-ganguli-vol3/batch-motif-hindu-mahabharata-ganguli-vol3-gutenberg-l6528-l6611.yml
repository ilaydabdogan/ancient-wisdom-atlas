canonical_text:
  quote: ''
  summary: In a fierce battlefield passage, Karna is surrounded by Pandava-aligned
    warriors but attacks them single-handedly. Bhimasena devastates the Kuru forces.
    Arjuna, after breaking the samsaptakas, asks Krishna to drive toward Karna; Krishna
    urges him to slay the Kauravas and drives the white steeds and ape-bannered chariot
    into the enemy host. Duryodhana sends the samsaptakas against Arjuna, who is covered
    with arrows yet continues fighting fiercely.
  language: English
  quote_policy: summarized
