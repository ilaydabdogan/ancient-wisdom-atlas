canonical_text:
  quote: There was a ruler in Mithila of the name of Janadeva of Janaka's race.
  summary: Bhishma recounts an old narrative about Janadeva or Janaka of Mithila,
    a ruler seeking knowledge of conduct leading to Brahma. A hundred preceptors instruct
    him, but he becomes especially attached to the ascetic Panchasikha, son of Kapila
    and disciple of Asuri. Panchasikha teaches him Sankhya doctrines concerning emancipation,
    sorrow, delusion, the body, the Soul, and sceptical arguments about death and
    evidence.
  language: English
  quote_policy: quoted
