canonical_text:
  quote: ''
  summary: Karna and Shalya exchange accusations about peoples and customs. Shalya
    replies that virtue and vice are found everywhere and that no whole country should
    be judged sinful. Duryodhana stops their verbal conflict. Karna then advances
    against the Pandava array, arranges his troops, slaughters Pandava forces, and
    wounds Yudhishthira. Dhritarashtra asks Sanjaya how the armies were arranged and
    where Arjuna was during Karna's attack.
  language: English
  quote_policy: summarized
