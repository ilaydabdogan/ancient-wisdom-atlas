canonical_text:
  quote: ''
  summary: 'Bhishma instructs Yudhishthira on royal duty: fruit-bearing trees should
    not be cut; Brahmanas should be supported; Vedic study should be protected; the
    king should protect subjects, use spies, examine his own faults and reputation,
    heed public praise and blame, avoid oppressive taxation, and support beings through
    gifts. Yudhishthira asks how one equal among others becomes superior, and Bhishma
    answers with analogies of predation among creatures and a warning that a heedless
    king may be attacked.'
  language: English
  quote_policy: summarized
