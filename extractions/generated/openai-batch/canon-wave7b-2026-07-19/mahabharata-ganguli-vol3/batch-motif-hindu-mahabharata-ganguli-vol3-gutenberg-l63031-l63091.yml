canonical_text:
  quote: ''
  summary: Narada performs rites for deities and Pitris in the retreat of Nara and
    Narayana. Nara asks whom he worships and what fruits he seeks. Narada explains
    that deity rites worship the eternal Vishnu and that Pitri rites are ultimately
    for Narayana, who is father, mother, and grandfather of all creatures. He recounts
    a reversal in which sons transmitted lost Sruti knowledge back to their sires
    and both groups worshipped each other with Kusa grass and three Pindas. Nara and
    Narayana then explain that when Earth had disappeared amid the seas, Govinda/Vishnu
    assumed a gigantic boar form, raised her with his tusk, and later placed three
    mud balls from his tusk on grass as Pindas, dedicating them to himself with sesame
    seeds while facing east in order to establish rules of conduct.
  language: English
  quote_policy: summarized
