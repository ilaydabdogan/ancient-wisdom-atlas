canonical_text:
  quote: ''
  summary: Janamejaya asks whether Purushas are many or one, who is foremost, and
    what is the source of all things. Vaisampayana introduces an old discourse between
    Brahma and Mahadeva on Vaijayanta, a radiant mountain in the Ocean of milk, where
    Brahma meditates on the one universal Purusha. Mahadeva worships Brahma and asks
    about this Infinite Purusha. Brahma answers that the one Purusha transcends all,
    is the basis and source of the many Purushas, and can be entered by those divested
    of attributes.
  language: English
  quote_policy: summarized
