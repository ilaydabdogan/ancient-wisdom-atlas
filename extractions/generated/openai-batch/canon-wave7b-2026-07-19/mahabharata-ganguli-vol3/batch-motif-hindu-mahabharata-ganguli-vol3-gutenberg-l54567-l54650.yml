canonical_text:
  quote: The felicity of Emancipation is true felicity in the world.
  summary: Bhishma narrates Arishtanemi's instruction to Sagara on Emancipation. Arishtanemi
    says attachment to family, wealth, food, and sense-objects prevents Emancipation,
    while one who fulfills household duties and then abandons attachment, accepts
    little, reflects on death and dependence on past acts, and conquers bodily and
    mental impulses is freed.
  language: English
  quote_policy: quoted
