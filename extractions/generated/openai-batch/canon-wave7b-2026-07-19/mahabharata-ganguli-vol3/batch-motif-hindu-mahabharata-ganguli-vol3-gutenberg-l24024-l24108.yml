canonical_text:
  quote: ''
  summary: Gandhari addresses Krishna while surveying the battlefield after the war.
    She names fallen rulers and warriors, describes their grieving wives and kin,
    notes bodies pierced by weapons or torn by birds, recalls funeral rites and pyre
    imagery, reflects on the reversals brought by Time and destiny, and then collapses
    in grief and anger, blaming Keshava.
  language: English
  quote_policy: summarized
