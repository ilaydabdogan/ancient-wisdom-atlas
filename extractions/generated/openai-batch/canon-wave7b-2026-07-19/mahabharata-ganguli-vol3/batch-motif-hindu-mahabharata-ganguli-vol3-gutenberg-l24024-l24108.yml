- id: obs:1
  text: Gandhari speaks to Krishna/Madhava while pointing out fallen rulers and grieving
    women on the battlefield.
  category: speech
  evidence_refs:
  - ev:1
  - ev:3
  - ev:11
- id: obs:2
  text: The ruler of the Kambojas lies in the dust, and his wife weeps over his blood-stained
    arms that were formerly smeared with sandal-paste.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women of Magadha cry around Jayatsena and are described as grief-stricken,
    with ornaments displaced, lying on the bare ground though worthy of costly beds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Women around Brihadbala remove shafts from his body, wail loudly, and repeatedly
    lose consciousness.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The sons of Dhrishtadyumna and the five Kekaya brothers lie slain by Drona.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:6
  text: 'Drona’s battle imagery is described through fire: his car is called a chamber
