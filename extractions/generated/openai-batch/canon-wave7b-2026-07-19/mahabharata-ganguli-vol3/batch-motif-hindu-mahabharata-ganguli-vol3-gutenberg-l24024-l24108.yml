  text: Drupada is described as overthrown by Drona; his wives and daughters-in-law
    burn his body on a funeral pyre and proceed with the pyre kept to their right.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Dhrishtaketu lies dead like an uprooted tree, and his wives sit around his
    body, place it on their laps, and cry; the body is torn by carnivorous birds.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Dhrishtaketu’s son is described as not deserting his father even in death,
