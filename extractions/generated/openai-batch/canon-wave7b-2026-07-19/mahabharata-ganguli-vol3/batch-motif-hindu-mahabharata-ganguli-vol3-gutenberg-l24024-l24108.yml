candidate_motifs:
- id: motif:1
  label: battlefield lament over fallen rulers
  taxonomy_refs: []
  basis: The passage consists largely of Gandhari pointing out dead kings and warriors
    while women cry, wail, and tend bodies on the battlefield.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:8
  confidence: high
  cautions: This is a passage-level lament pattern rather than a mapped external taxonomy
    motif.
- id: motif:2
  label: reversal of heroic power by Time and destiny
  taxonomy_refs: []
  basis: Gandhari explicitly says that Time has brought reverses and that warriors
    capable of slaying celestials have themselves been slain.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage attributes reversal to Time and destiny, not to a detailed
    doctrine of divine judgment.
- id: motif:3
  label: funerary burning and ash after battle
  taxonomy_refs: []
  basis: Drupada’s body is burned on a funeral pyre, women perform a rightward procession
    around the pyre, and Gandhari says her sons have been consumed into ashes.
  evidence_refs:
  - ev:7
  - ev:12
  confidence: high
  cautions: The passage gives only brief ritual detail and does not explain the rite.
- id: motif:4
  label: son following father in death
  taxonomy_refs: []
  basis: Dhrishtaketu’s son is said not to desert his father even in death, and Gandhari
    applies the same pattern to Lakshmana and Duryodhana.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The comparison is internal to the passage and does not establish a broader
    historical motif distribution.
- id: motif:5
  label: martial destruction figured as fire
  taxonomy_refs: []
  basis: Drona’s car and weapons are described as a fire into which young warriors
    fall like insects; armour and equipment shine like fires, and the passage later
    speaks of sons consumed into ashes.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:12
  confidence: medium
  cautions: The fire imagery is battlefield and funerary imagery, not clearly the
    available taxonomy motif of world-destroying fire.
- id: motif:6
  label: royal splendor persisting on corpses
  taxonomy_refs: []
  basis: Fallen rulers and warriors retain ornaments, golden armour, standards, bows,
