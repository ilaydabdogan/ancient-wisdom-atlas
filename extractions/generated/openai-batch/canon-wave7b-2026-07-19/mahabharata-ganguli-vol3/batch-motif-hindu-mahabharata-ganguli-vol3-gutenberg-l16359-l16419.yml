canonical_text:
  quote: ''
  summary: Duryodhana rises from water, bloodied and armed with a mace, and challenges
    the Pandavas to single combat. He argues that many should not fight one unequipped
    warrior. Yudhishthira rebukes him by recalling Abhimanyu's killing by many warriors,
    then permits Duryodhana to arm himself and choose one Pandava opponent, promising
    kingship if he wins and heaven if he is slain. Duryodhana dons golden armor and
    again challenges any of the five brothers to a mace duel.
  language: English
  quote_policy: summarized
