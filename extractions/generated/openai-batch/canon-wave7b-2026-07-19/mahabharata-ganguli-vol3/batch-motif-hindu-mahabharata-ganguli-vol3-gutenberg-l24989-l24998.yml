canonical_text:
  quote: ''
  summary: An unnamed first-person speaker reflects that one who understands causes
    and effects would not desire heavenly prosperity. The speaker notes that lesser
    kings may kill a king through political contrivance, says this reflection has
    brought a nectar of wisdom, and seeks a permanent, eternal, unchangeable place
    while following a fearless path and ending the physical frame subject to birth,
    death, age, disease, and pain.
