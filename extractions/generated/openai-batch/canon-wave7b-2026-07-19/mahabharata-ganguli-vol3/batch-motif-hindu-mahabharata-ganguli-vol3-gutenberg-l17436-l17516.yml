candidate_motifs:
- id: motif:1
  label: Sacrifice used to defeat hostile beings
  taxonomy_refs:
  - sacrifice
  basis: Brihaspati’s libations on the sacrificial fire are explicitly performed for
    the destruction of the Asuras and are followed by their destruction by the gods.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage states sequence and purpose, but does not explain the full
    ritual mechanism beyond libations and divine battle.
- id: motif:2
  label: Ritual generosity and sacred exchange at a tirtha
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: Rama gives valuable goods to Brahmanas; at Yayati’s sacrifice, Brahmanas
    receive abundance and return praise and blessings.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage treats the gifts as ritually significant but does not state
    a formal exchange doctrine.
- id: motif:3
  label: Sacred river as provider of abundance
  taxonomy_refs:
  - sacred_exchange
  basis: Sarasvati produces milk and clarified butter and grants to Brahmanas what
    each wished for at Yayati’s sacrifice.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The motif is limited here to Sarasvati’s actions within sacrifice and
    tirtha context.
- id: motif:4
  label: Heavenly ascent after sacrifice
  taxonomy_refs:
  - ascent
  basis: Yayati performs sacrifice and then goes cheerfully to heaven, obtaining many
    blessed regions.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives the result but not a detailed afterlife journey.
- id: motif:5
  label: Sacred place founded through divine austerity
  taxonomy_refs:
  - sacrifice
  basis: Sthanu/Mahadeva practices severe penance, performs sacrifice, worships Sarasvati,
    and establishes the tirtha.
  evidence_refs:
