canonical_text:
  quote: ''
  summary: 'The passage recounts sacred events at tirthas of the Sarasvati: Brihaspati’s
    sacrificial libations precede the destruction of Asuras; Rama/Baladeva gives gifts
    and visits Yayata, where Sarasvati supplies milk, clarified butter, and abundant
    goods for Yayati’s sacrifice; Yayati reaches heaven. The narration then turns
    to Vasishthapavaha and explains the rivalry of Vishvamitra and Vasishtha, the
    sacred background of Sthanu-tirtha, Skanda’s installation, and Vishvamitra’s command
    that the frightened Sarasvati bring Vasishtha to him.'
  language: English
  quote_policy: summarized
