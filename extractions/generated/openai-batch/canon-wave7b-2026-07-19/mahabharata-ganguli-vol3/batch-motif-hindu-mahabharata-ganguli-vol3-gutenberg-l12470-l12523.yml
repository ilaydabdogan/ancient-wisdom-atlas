canonical_text:
  quote: ''
  summary: Dhritarashtra laments the loss of his children and kinsmen, says forest
    exile is now best for him, fears Bhima's reminders of Duryodhana's slaughter,
    repeatedly swoons in grief, and asks Sanjaya to recount the battle. He recalls
    the deaths of Bhishma, Drona, and Karna, says Vidura's earlier warning about destruction
    through Duryodhana's fault has proven true, and asks for details about the final
    commanders, the deaths of Duryodhana and others, and the survival of the Pandavas,
    Krishna, Satyaki, Kripa, Kritavarma, and Drona's son.
  language: English
  quote_policy: summarized
