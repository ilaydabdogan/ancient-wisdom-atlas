canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma about the nature, source, and purpose of righteousness.
    Bhishma answers with sources and criteria of righteousness, illustrates moral
    inconsistency through examples of thieves, powerful persons, the wealthy, adulterers,
    and murderers, and concludes with teachings on truth, non-injury, charity, sacrifice,
    gift, pacific means, and righteousness as world-sustaining order ordained by the
    Creator.
  language: English
  quote_policy: summarized
