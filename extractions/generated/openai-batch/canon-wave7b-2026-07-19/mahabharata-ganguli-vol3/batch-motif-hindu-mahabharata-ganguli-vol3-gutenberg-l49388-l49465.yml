  summary: Suka asks Vyasa to explain Adhyatma. Vyasa answers by describing the five
    great entities as the components of creatures and the universe, mapping them to
    senses and attributes, and explaining the roles of mind, understanding, soul,
    and the three qualities Sattwa, Rajas, and Tamas.
