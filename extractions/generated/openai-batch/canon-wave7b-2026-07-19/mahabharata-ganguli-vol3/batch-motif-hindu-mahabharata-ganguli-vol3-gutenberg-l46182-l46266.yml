canonical_text:
  quote: ''
  summary: A philosophical passage classifies mental states by the qualities of Passion
    and Darkness, analyzes the senses, mind, and understanding as distinct from the
    Soul, and explains Emancipation through images of rivers losing names in the ocean,
    a lotus leaf remaining unsoaked by water, a silk-worm abandoning its self-made
    cell, and a snake casting off its slough.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: States of consciousness joined with discontent or cheerlessness are attributed
    to Passion, while states involving error or heedlessness are attributed to Darkness.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage links hearing with space and sound, and similarly links skin,
    eyes, tongue, and nose with touch, form, taste, and smell.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Five organs of action, five organs of knowledge, the mind, and the understanding
    are counted together, while the Soul is described as separate from them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Dream experience is described as consciousness of subtle senses and an imaginary
    body arising from past sensual impressions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Dreamless slumber and Emancipation are compared in that subjective and objective
    existences originating in acts are discarded.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The sum of the senses and related faculties is called body or kshetra, while
    the existent thing resting upon the mind is called Soul or kshetrajna.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Small rivers entering larger rivers and the larger rivers entering the ocean
    lose their forms and names; this is used to describe Emancipation.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Jiva, characterized by attributes, is said to be received into the Universal
    Soul, after which its attributes disappear and it cannot be mentioned by differentiation.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: One who seeks to know the Soul is said not to be soiled by evil fruits of
    acts, like a lotus leaf dipped in water but not soaked by it.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Freedom from bonds caused by affection for children and spouses, love of rites,
    joy, sorrow, and attachments is followed by entrance into the Universal Soul without
    differentiation.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: When merits, sins, and their fruits of joy and sorrow disappear, unattached
    people first take refuge in personal Brahma and then behold impersonal Brahma
    in their understandings.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Jiva under Avidya is compared to a silk-worm living in a self-woven cell;
    later it abandons the act-generated house and its sorrows are destroyed.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: The passage closes this segment with images of a Ruru casting off old horns
    and a snake casting off its slough.
  category: object
  evidence_refs:
  - ev:13
