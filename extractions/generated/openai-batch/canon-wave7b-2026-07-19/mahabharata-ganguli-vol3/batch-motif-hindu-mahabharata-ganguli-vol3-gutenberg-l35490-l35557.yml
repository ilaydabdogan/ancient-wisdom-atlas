canonical_text:
  quote: The king, O Bharata, cannot alone rule his kingdom.
  summary: Yudhishthira asks Bhishma about the duties of kingship, especially what
    benefits a kingdom and what kinds of servants and ministers should aid a ruler.
    Bhishma replies that a king cannot rule alone and that sovereignty succeeds through
    wise, loyal, incorruptible servants, cheerful righteous subjects, sound financial
    oversight, proper justice, kindness, and attention to the aggregate of six.
  language: English
