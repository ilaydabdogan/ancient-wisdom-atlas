canonical_text:
  quote: ''
  summary: Bhishma tells Yudhishthira of an old conversation in which Sakra asks Vrihaspati
    what single act can make a person esteemed by all creatures and famous. Vrihaspati
    answers that agreeable or sweet speech brings happiness, love, and regard, while
    silent frowning produces hatred. He gives examples involving greeting others with
    smiles, giving gifts, taking possessions, and royal chastisement. Sakra follows
    the instruction, and Bhishma urges Yudhishthira to practice the same virtue.
  language: English
  quote_policy: summarized
