canonical_text:
  quote: ''
  summary: Editorial footnotes explain terms and doctrines connected with renunciation
    and Emancipation. They describe a seeker, Muni, or Sannyasin as wandering without
    fixed home, begging and eating only enough for hunger, rejecting gifts, concealing
    practices, and withdrawing into the Self. Other notes explain avoidance of merit
    and demerit through abstention from acts, Yudhishthira’s exhortation to strive
    after Emancipation, the relation of Jiva to Chit through the simile of wind and
    space, and attainment of Brahma through Knowledge rather than acts, illustrated
    by a forgotten gold necklace already on the neck.
  language: English
  quote_policy: summarized
