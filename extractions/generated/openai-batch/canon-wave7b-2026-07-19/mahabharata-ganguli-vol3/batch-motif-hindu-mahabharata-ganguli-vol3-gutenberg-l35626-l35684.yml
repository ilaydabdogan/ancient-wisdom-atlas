canonical_text:
  quote: ''
  summary: Bhishma recounts how a dog, already transformed into a tiger, repeatedly
    seeks a sage's protection from stronger animals and is changed into an elephant,
    lion, and Sarabha. After becoming bloodthirsty and wishing to kill the sage who
    helped him, the animal is perceived by the sage through spiritual knowledge, reproached
    for ingratitude, cursed, and returned to its original form as a dog.
  language: English
  quote_policy: summarized
