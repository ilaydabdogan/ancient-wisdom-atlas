canonical_text:
  quote: ''
  summary: Bhishma introduces an old story about Vasuhoma, a pious king among the
    Angas who practices penances with his spouse and resides at Munjaprishtha on Himavat,
    a place associated with Pitris, celestial Rishis, Rama, Rudra, and ascetic Rishis.
    Mandhatri visits Vasuhoma's mountain retreat, is received with hospitality, and
    asks Vasuhoma, as a disciple prepared to offer a tutorial fee, about the origin,
    prior condition, end, and Kshatriya-dependence of Chastisement.
  language: English
  quote_policy: summarized
