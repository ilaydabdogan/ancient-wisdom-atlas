canonical_text:
  quote: ''
  summary: Gautama returns to his hermitage and finds his son Chirakarin still holding
    back from carrying out Gautama's command to kill his wife, Chirakarin's mother.
    Chirakarin casts away the weapon and bows before his father. Gautama rejoices,
    embraces and blesses his son, and praises him for delaying before action. He then
    teaches that one should reflect long before acts involving punishment, wrath,
    friendship, abandonment, religious instruction, and other consequential matters.
    After long worship in his retreat, Gautama ascends to heaven with his son.
  language: English
  quote_policy: summarized
