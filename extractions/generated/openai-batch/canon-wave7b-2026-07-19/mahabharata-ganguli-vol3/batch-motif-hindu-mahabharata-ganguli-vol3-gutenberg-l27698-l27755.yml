canonical_text:
  quote: ''
  summary: The passage gives rules for Brahmanas concerning food purity, ritual dedication
    before eating, proper and improper giving, qualifications of gift recipients,
    and the fruitlessness or danger of gifts made to unlearned or improper recipients.
    It closes by identifying the teaching as a discourse attributed to Manu and addressed
    to Yudhishthira.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Certain foods and foods associated with specified persons or circumstances
    are prohibited for a Brahmana, including stale food, food mixed with alcohol,
    leftovers, tasted food, and food brought with the left hand.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Food not dedicated to the gods, including rice boiled in sugared milk, food
    mixed with tila seed, meat, and cakes, is prohibited for Brahmanas living as householders.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A householder is instructed to gratify gods, Rishis, guests, Pitris, and household
    deities before eating.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A householder who lives according to these rules is said to become like a
    renunciant and to earn great religious merit while living domestically with wives.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Gifts should not be made for fame, from fear, or merely to a benefactor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A list of people are identified as improper recipients of gifts, including
    entertainers, intoxicated or insane persons, thieves, slanderers, idiots, people
    with certain bodily defects, wicked persons, those of low and wicked family, and
    those not sanctified by vows.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A gift should be made to a Srotriya, and not to a Brahmana lacking knowledge
    of the Vedas.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Improper giving and improper acceptance are said to produce evil consequences
    for both giver and acceptor.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage uses similes of sinking while trying to cross the ocean with a
    rock or catechu, and of fire covered with wet fuel, to describe the failure of
    improper gift exchange and an unqualified recipient.
  category: other
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage compares Vedic knowledge in a person of bad conduct to water in
    a human skull and milk in a dog-skin bag, both made unclean by their vessels.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: Compassionate giving to poor, afflicted, ill, or low and unlearned Brahmanas
    is allowed, but the giver should not expect spiritual benefit or religious merit
    from such gifts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A Brahmana without study of the Vedas or mantras is compared to nominal or
    fruitless things such as a wooden elephant, leather antelope, featherless bird,
    grain without kernel, dry well, and libations poured on ashes.
  category: other
  evidence_refs:
  - ev:6
- id: obs:13
  text: An unlearned Brahmana is called an enemy, a destroyer of food presented to
    gods and Pitris, and like a robber; he is said not to gain regions of bliss hereafter.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: The teaching is reported as something said by Manu and is addressed to Yudhishthira
    as a discourse to be heard.
  category: speech
  evidence_refs:
  - ev:7
