  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The renouncer is described as having no sacrificial fires or fixed habitation,
    entering a village only to beg food, and storing nothing for the next day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mendicant's indications include a human skull, shelter under trees, rags
    for clothing, unbroken solitude, indifference to all creatures, and eating little
