canonical_text:
  quote: One should, alone and without anybody to assist him or bear him company,
    practise Yoga for attaining to success
  summary: Vyasa instructs that after earlier modes of life one should enter renunciation,
    practice solitary Yoga, live as a mendicant, practice silence, non-attachment,
    and non-injury, and thereby attain emancipation or transcend death.
  language: English
  quote_policy: quoted
