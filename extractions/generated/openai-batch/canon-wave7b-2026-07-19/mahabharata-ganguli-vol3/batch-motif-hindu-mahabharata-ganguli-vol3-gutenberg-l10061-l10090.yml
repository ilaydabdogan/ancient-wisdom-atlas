canonical_text:
  quote: ''
  summary: Bhima, also called Vrikodara and Bhimasena, taunts Duhshasana while declaring
    that he drinks his life-blood. He recalls a series of wrongs suffered by his side,
    attributes them to named enemies, announces that his vow concerning Duhshasana
    has been fulfilled, and vows to kill Duryodhana in the 'sacrifice of battle.'
    He then shouts like Indra after slaying Vritra.
  language: English
  quote_policy: summarized
