canonical_text:
  quote: Death does not wait, mindful of one's having done or not done one's acts.
  summary: A son addresses his father on the urgency of confronting death. He describes
    Death and Decrepitude as unavoidable powers that seize beings before their aims
    are completed. He urges immediate practice of virtue, truth, non-injury, restraint,
    renunciation, and the inward search for the Self. He rejects animal sacrifice
    in favor of peaceful, internal, and self-directed sacrifice.
  language: English
  quote_policy: quoted
