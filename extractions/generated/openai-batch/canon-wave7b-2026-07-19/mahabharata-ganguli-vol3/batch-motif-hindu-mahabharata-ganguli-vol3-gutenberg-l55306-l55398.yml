canonical_text:
  quote: ''
  summary: Janaka asks Parasara why human orders differ in colour, race, practice,
    and status if all spring from a Brahmana source. Parasara answers that divergence
    arose through falling away from penance, explains the four orders as created from
    the mouth, arms, thighs, and feet of the Lord of creatures, attributes additional
    classes to intermixture, and says penance can cleanse or elevate status. Janaka
    then asks about the special and common duties of the orders, and Parasara enumerates
    order-specific occupations and shared ethical duties, including statements about
    virtuous Sudras attaining merit and happiness.
  language: English
  quote_policy: summarized
