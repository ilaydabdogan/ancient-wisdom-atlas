canonical_text:
  quote: The four modes of life constitute a ladder or flight of steps. That flight
    is attached to Brahma.
  summary: Vyasa teaches that the four modes of life, if properly observed, lead to
    a high end and to understanding Brahma. He describes the student life of the Brahmacharin
    under a preceptor, including service, restraint, study, reverence, completion
    of duties, payment of the final fee, and transition into domestic life with spouses
    and the domestic fire.
