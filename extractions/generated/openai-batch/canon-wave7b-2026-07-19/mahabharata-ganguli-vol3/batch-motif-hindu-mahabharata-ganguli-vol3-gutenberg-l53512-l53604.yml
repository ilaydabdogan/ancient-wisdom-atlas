canonical_text:
  quote: '"This is neither a Sacrifice nor a meritorious rite of religion, since Rudra
    is not adored in it."'
  summary: Janamejaya asks how Daksha's horse-sacrifice was destroyed and restored.
    Vaisampayana recounts Daksha arranging a sacrifice on Himavat near the source
    of the Ganges, with many divine and semi-divine beings attending. Dadhichi objects
    that Rudra has not been adored and predicts calamity. Daksha declares an offering
    for Vishnu. Uma, grieving over her husband's lack of sacrificial share, speaks
    with Mahadeva, who asserts that sacrificial praise and offerings are directed
    to him and announces that he will create a being to destroy the displeasing sacrifice.
  language: English
  quote_policy: quoted
