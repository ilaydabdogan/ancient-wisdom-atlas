canonical_text:
  quote: "“There is One Ordainer, and no second.”"
  summary: Bhishma cites an old narrative in which Purandara questions the fallen
    and captive Asura Namuchi about grief. Namuchi replies with a didactic teaching
    on not yielding to sorrow, the action of an Ordainer, birth and repeated wombs,
    the absence of personal agency in pleasure and pain, and the equanimity of the
    wise person.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Bhishma presents the passage as an old narrative of a discourse between the
    one described as having performed a hundred sacrifices and the Asura Namuchi,
    addressed to Yudhishthira.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Namuchi is described as conversant with the birth and death of all creatures,
    deprived of prosperity, and inwardly untroubled while sitting still.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Purandara addresses Namuchi as fallen from his place, bound with cords, under
    the power of enemies, and deprived of prosperity, and asks whether he grieves
    or remains cheerful.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Namuchi says that indulging unavoidable sorrow wastes the body and gladdens
    enemies, and that one person cannot take away another’s sorrow by bearing part
    of it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Namuchi advises suppressing sorrow born from an improper disposition of mind
    and reflecting on what produces the highest good and dwells in the heart.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Namuchi states that there is one Ordainer whose control extends over the being
