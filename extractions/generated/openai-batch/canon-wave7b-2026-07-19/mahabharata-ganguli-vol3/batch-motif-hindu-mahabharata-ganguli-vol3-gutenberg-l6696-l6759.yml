canonical_text:
  quote: ''
  summary: In battle, Ashvatthama is struck and carried away insensible; fighting
    spreads with heavy slaughter. Duryodhana exhorts Karna and allied kings by saying
    that battle opens heaven for slain Kshatriyas or grants earth to victors. Ashvatthama
    vows not to remove his armour until he kills Dhrishtadyumna in revenge for his
    father. The armies collide in a destruction likened to universal dissolution,
    while gods and Apsaras observe and Apsaras cover warriors with celestial garlands,
    perfumes, and gems. Perfumed winds move over the field, warriors fall, and the
    earth is strewn with flowers, gold-winged arrows, and fallen fighters.
  language: English
  quote_policy: summarized
