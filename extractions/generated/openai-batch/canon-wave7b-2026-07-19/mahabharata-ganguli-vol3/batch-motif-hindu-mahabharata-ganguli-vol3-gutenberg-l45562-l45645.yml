canonical_text:
  quote: The universe is bound in speech.
  summary: Bhishma gives instruction on detachment, moral conduct, truthful speech,
    self-restraint, yoga discipline, and the pursuit of knowledge. The passage presents
    attachment to sensory objects as bondage and describes a disciplined path by which
    the senses and mind are controlled, knowledge burns sorrow, and the soul attains
    Brahma or Emancipation.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Bhishma states that creatures attached to sense-objects become helpless, while
    nonattached high-souled persons attain the highest end.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The world is described as overwhelmed by birth, death, decrepitude, sorrow,
    disease, and anxieties.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The instructed person should be pure in speech, thought, and body, free from
    pride, tranquil, knowledgeable, mendicant, and unattached to worldly objects.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says doers taste the consequences of good and sinful acts, and
    it recommends non-injury, truthfulness, honesty, forgiveness, heedfulness, and
    peace toward all creatures.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage counsels against doing evil to others, coveting what is beyond
    one's power, or turning the mind toward non-existent objects; it instead directs
    the mind toward knowledge.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Speech should be truthful, nonmalicious, nonharsh, noncruel, not dishonest,
    and not garrulous; a renunciant should proclaim his own evil acts with humility
    and cleansed understanding.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Action driven by Passion is said to bring misery in this world and eventual
    descent into hell; restraint in body, speech, and mind is prescribed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ignorant persons bearing worldly burdens are compared to robbers laden with
    stolen sheep, who must discard their spoil if they wish for safety.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A desireless, solitary, abstemious person devoted to penances, yoga discipline,
    and sense-control is said to burn sorrows by knowledge and attain Brahma or Emancipation.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The disciplined understanding controls the mind; the mind overpowers sense-objects;
