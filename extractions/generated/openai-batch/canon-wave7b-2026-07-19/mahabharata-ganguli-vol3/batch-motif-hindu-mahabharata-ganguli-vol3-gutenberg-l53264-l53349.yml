  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The sin of Brahmanicide leaves Indra and proceeds to the abodes ordained for
    her by the Grandsire.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: With the Grandsire's permission, Indra resolves to perform a Horse-sacrifice
    and is afterwards cleansed of Brahmanicide through that sacrifice.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After being cleansed, Indra regains prosperity, slays thousands of foes, and
    obtains joy.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: High-crested cocks are said to be born from Vritra's blood, and these fowls
