canonical_text:
  quote: ''
  summary: Bhishma recounts how Brahman removes the sin of Brahmanicide from Indra
    after the slaying of Vritra by assigning fourth portions of it to Agni, plants,
    Apsaras, and Waters, each with rules by which the sin will pass to offending humans.
    Indra is later cleansed through a Horse-sacrifice; Vritra's blood gives rise to
    high-crested cocks; and recitation of the Vritra narrative on Parva days is said
    to prevent sin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After being addressed by the Grandsire, the eater of oblations and sacrificial
    offerings accepts the command, and a fourth of the sin enters his person.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Grandsire summons trees, herbs, and grasses and asks them to take a fourth
    of the sin; they express agitation, describe their afflictions from weather and
    cutting, and ask how they will be rescued from the sin.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Brahman states that the sin borne by the plants will possess a man who cuts
    or tears them on Parva days.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The trees, herbs, and grasses adore the Creator and depart after receiving
    Brahman's reply.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Grandsire summons the Apsaras and asks them to take a fourth portion of
    Brahmanicide, described as having come out of Indra's person.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Apsaras agree to take a portion of the sin and ask how they may be freed;
