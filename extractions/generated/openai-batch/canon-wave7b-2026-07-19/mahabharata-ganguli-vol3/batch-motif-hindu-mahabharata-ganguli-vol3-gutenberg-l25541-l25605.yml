  quote: ''
  summary: Vaisampayana reports that Bhimasena, after Arjuna's speech, addresses his
    eldest brother. Bhimasena urges the king to overcome grief, explains interdependence
    between physical and mental disease, recalls earlier humiliations and hardships,
    compares the present task to a battle fought only with the mind, urges him to
    govern the kingdom, and calls for a horse-sacrifice with gifts.
  language: English
