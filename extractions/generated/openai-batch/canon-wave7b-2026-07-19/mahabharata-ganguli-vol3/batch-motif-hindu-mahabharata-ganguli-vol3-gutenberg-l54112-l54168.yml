canonical_text:
  quote: ''
  summary: Mahadeva consoles Daksha after the injury to Daksha's sacrifice, recalls
    having destroyed that sacrifice in former Kalpas, grants boons, and describes
    the mysterious Pasupata religion that leads to Emancipation. Mahadeva then disappears
    with Uma and his attendants. The passage then states benefits of reciting or hearing
    Daksha's hymn, including protection, long life, fulfilled wishes, freedom from
    fear, elevated status, and postmortem ascent to heaven after offerings to Mahadeva,
    Guha, Uma, and Nandi.
  language: English
  quote_policy: summarized
