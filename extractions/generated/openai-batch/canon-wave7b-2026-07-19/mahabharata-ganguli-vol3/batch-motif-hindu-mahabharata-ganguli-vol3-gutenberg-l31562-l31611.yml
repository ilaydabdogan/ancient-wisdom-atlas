canonical_text:
  quote: ''
  summary: Bhishma explains that a kingdom depends on both king and priest. He illustrates
    this with the narrative of King Muchukunda, Vaisravana, Vasishtha, and a Rakshasa
    force, ending with the doctrine that Brahmana and Kshatriya powers must cooperate
    in rule.
  language: English
  quote_policy: summarized
