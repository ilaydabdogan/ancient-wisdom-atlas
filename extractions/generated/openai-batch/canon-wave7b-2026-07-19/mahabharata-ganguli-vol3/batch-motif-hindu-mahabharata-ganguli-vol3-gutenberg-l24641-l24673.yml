  quote: ''
  summary: Narada recounts Karna's single combat with Jarasandha, their transition
    from weapon-fighting to wrestling with bare arms, Jarasandha's conciliation and
    gift of Malini, Karna's later surrender of his natural armor and ear-rings to
    Indra under celestial illusion, and the many causes said to have led to Karna's
    death by Arjuna.
