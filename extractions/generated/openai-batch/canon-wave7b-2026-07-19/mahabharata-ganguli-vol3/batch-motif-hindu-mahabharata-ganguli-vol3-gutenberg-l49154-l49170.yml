canonical_text:
  quote: ''
  summary: 'The passage describes the conduct and qualities of a self-knowing person
    observing Sannyasa: detachment from acts for this or another world, freedom from
    wrath and error, observance of Yama and Niyama, abandonment of Vedic study and
    the sacred thread, control of the senses, and attainment of the sought end. It
    then introduces the fourth mode of life as superior to the other three and as
    a high refuge.'
  language: English
  quote_policy: summarized
