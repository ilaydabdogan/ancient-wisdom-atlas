canonical_text:
  quote: ''
  summary: A royal speaker argues that outward ascetic emblems do not produce Emancipation;
    Knowledge alone does so. He says he is free while living amid kingdom and spouses
    because he has cut off attachment through renunciation and scripture. He rebukes
    a mendicant Brahmana woman for entering his body or heart by Yogic power to test
    his emancipation, arguing that her conduct violates social, marital, ascetic,
    and courtly boundaries. He warns against deceptive appearance before a king, a
    Brahmana, or a virtuous wife, and identifies sovereignty, Vedic learning, and
    feminine beauty and blessedness as powers.
  language: English
  quote_policy: summarized
