  quote: ''
  summary: Vaishampayana narrates Baladeva’s pilgrimage along the Sarasvati through
    named tirthas. The passage explains place names, describes celestial and ascetic
    inhabitants, a giant sacred tree, a serpent abode ruled by Vasuki, repeated bathing
    and donations, and the Sarasvati’s eastward turn toward the Rishis of Naimisha,
    which causes Baladeva wonder and prompts Janamejaya’s question.
  language: English
  quote_policy: summarized
