canonical_text:
  quote: ''
  summary: 'A didactic passage gives maxims for rulers: rise from distress, use spies
    and disguises, distrust without examination, suppress thieves and foes, attach
    supporters with gifts and speech, eradicate remaining threats, destroy hostile
    kingdoms, imitate animal qualities, divide opponents, protect ministers, balance
    mildness and sternness, and beware injured wise adversaries.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person in distress is advised to raise himself by all available means, whether
    mild or stern, and then practice righteousness when able.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king is advised to honor the foes of his foes and to employ spies, including
    atheists and ascetics sent into enemy territories.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sinful thieves are said to enter gardens, places of amusement, public water
    houses, inns, drinking spots, houses of ill fame, holy places, and public assemblies,
    and should be recognized, arrested, and put down.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The king is advised not to trust without prior examination and to inspire
    confidence in an enemy before striking when the enemy makes a false step.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ascetic signs such as reddish garb, matted locks, and skins are described
    as means to inspire a foe's confidence before attacking like a wolf.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: A king seeking prosperity is told not to hesitate to slay a son, brother,
    father, friend, or restrain a preceptor if any obstruct his aims or follow unrighteous
    paths.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage states that foes and friends are not separate kinds of beings;
    people become friends or foes according to circumstances.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The king is told not to spare a foe because of lamentation and to destroy
    one who has injured him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The king is advised to attach many men to himself through benefits, sweet
    words, honors, and gifts, while behaving toward subjects without malice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The king is advised to punish and check the wicked and disaffected.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The passage says the king should speak agreeably when taking wealth and should
    grieve and shed tears after striking off someone's head.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:12
  text: Unpaid debt, unquenched fire, unslain foes, neglected maladies, and badly
    extracted thorns are described as things that grow or worsen if not fully ended.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: A hostile kingdom is to be destroyed by slaughtering its population, tearing
    up roads, burning houses, and pulling houses down.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: 'A king is advised to be like several animals: far-sighted like a vulture,
    motionless like a crane, vigilant like a dog, valiant like a lion, fearful like
    a crow, and able to enter enemy territory like a snake.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:15
  text: 'Different people are to be approached differently: a hero with joined palms,
    a coward with fear, a covetous man with wealth, and an equal with war.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: The king is told to create disunion among leaders of sects, protect ministers
    from disunion and destruction, and use mildness or sternness according to occasion.
  category: action
  evidence_refs:
  - ev:5
- id: obs:17
  text: After offending a person of knowledge and wisdom, one should not feel safe
    merely because of distance, since an intelligent man's arms are described as far-reaching.
  category: relationship
  evidence_refs:
  - ev:6
