canonical_text:
  quote: ''
  summary: Sanjaya narrates Duryodhana approaching Shalya, ruler of the Madras, and
    asking him to serve as Karna's charioteer against Arjuna. Duryodhana frames Shalya's
    role by analogy to Krishna protecting and driving for Arjuna, invokes other divine
    and solar comparisons, recalls the deaths of major warriors, and describes his
    army as reduced. The passage ends with Shalya becoming visibly angry at Duryodhana's
    words.
  language: English
  quote_policy: summarized
