canonical_text:
  quote: '"Come and behold me and the Suta''s son contending with each other in battle
    for victory."'
  summary: Sanjaya reports Arjuna's reply to Yudhishthira. Arjuna recounts fighting
    Ashvatthama, who attacked him and Krishna with many arrows, and then describes
    Karna's devastation of allied warriors. Arjuna asks Yudhishthira for a blessing
    of victory, appoints protectors for his chariot, vows to slay Karna and his forces,
    and compares the anticipated encounter to Sakra facing Vritra.
  language: English
  quote_policy: quoted
