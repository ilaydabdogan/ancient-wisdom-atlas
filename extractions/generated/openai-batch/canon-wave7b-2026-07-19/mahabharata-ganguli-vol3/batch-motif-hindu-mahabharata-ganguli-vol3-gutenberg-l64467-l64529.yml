canonical_text:
  quote: ''
  summary: A Naga questions whether a Brahmana seeking him is truly human, since Nagas
    are powerful, worthy of worship, boon-granting, and not normally visible to human
    beings. The Naga’s spouse judges the Brahmana to be a sincere reverent guest who
    awaits the Naga like a rain-thirsty Chataka bird, and she urges the Naga not to
    neglect him. She teaches moral duties concerning hospitality, restraint, speech,
    gifts, truthfulness, righteous wealth, and avoidance of hell. The Naga accepts
    her instruction, says his wrath has been consumed by her counsel, cites Ravana
    and Kartavirya-related examples of wrath leading to destruction, praises his wife,
    and resolves to go to the Brahmana and fulfill his wishes.
  language: English
  quote_policy: summarized
