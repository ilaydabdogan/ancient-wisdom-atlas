canonical_text:
  quote: ''
  summary: The passage describes Rudra/Mahadeva taking up a sword, assuming a terrible
    fire-emitting form, defeating the Danavas/Asuras, restoring Righteousness, and
    returning to a beneficent shape. The sword is then transmitted through divine,
    sage, and royal custodians. The Regents instruct Manu to use it as a religious
    instrument of protection and measured chastisement, and a lineage carries it onward
    to the addressee and his brothers. The sword's birth constellation, deity, gotra,
    preceptor, hidden names, and victory function are also stated.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rudra/Mahadeva takes up the sword and assumes a different form with four arms,
    great height, upward eyes, extended limbs, flames from his mouth, varied complexions,
    a star-studded black deer-skin, and a sun-like third eye.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sword is described as having a splendour like the all-destructive Yuga
    fire; Rudra also wields a large shield likened to dark clouds with lightning and
    whirls the sword in the sky.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Danavas come toward Rudra quickly, throwing rocks, blazing brands, and
    sharp iron weapons, but the Danava host becomes stupefied and trembles on seeing
    him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Although Rudra fights alone, his speed makes the Asuras think that a thousand
    similar Rudras are battling them.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Rudra cuts, pierces, severs, and scatters the Asuras with the sword; some
    fall, some flee, some enter the earth, some hide under mountains, some go upward,
    and some enter the sea.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The battlefield earth becomes miry with flesh and blood and is described through
    images of fallen bodies, mountain summits, and crimson robes.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: After slaying the Danavas, Rudra re-establishes Righteousness on earth, casts
    off his awful form, assumes his beneficent shape, and is acclaimed by Rishis and
    celestials.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Rudra gives the blood-dyed sword, called a protector of religion, to Vishnu;
    it then passes to Marichi, the great Rishis, Vasava, the Regents of the world,
    and Manu son of Surya.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Regents tell Manu that he is lord of all men and must protect all creatures
    with the sword, which is said to contain religion within its womb.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Regents instruct Manu to punish transgressors according to ordinance and
    not caprice, using graded punishments such as rebukes, fines, forfeitures, and
    severe penalties only when appropriate; these punishments are described as forms
    of the sword.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Manu installs Kshupa in sovereignty and gives him the sword; after Kshupa,
    the sword passes through a long named line of rulers and custodians down to the
    addressee and his brothers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The sword is said to have been born under Krittika, to have Agni as its deity,
    Rohini as its gotra, Rudra as its high preceptor, and eight little-known names
    whose mention can win victory.
  category: attribute
  evidence_refs:
  - ev:8
