canonical_text:
  quote: ''
  summary: After hearing Vidura, Dhritarashtra orders his car prepared and summons
    Gandhari, Kunti, and the Bharata women. Grief-stricken royal women assemble, wail,
    and are placed on cars as the king leaves the city toward the battlefield. The
    whole city mourns; formerly secluded women appear publicly disheveled and scantily
    clad. Their collective lament is compared to universal destruction at the end
    of the Yuga and to the fire that consumes all things.
  language: English
  quote_policy: summarized
