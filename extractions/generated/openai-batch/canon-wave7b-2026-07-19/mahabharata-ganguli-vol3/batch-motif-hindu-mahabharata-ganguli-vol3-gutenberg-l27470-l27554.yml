canonical_text:
  quote: ''
  summary: Vyasa addresses Bharata and gives a prescriptive catalogue of expiations
    for grave sins. These include penances, mendicancy, fasting, self-mortification,
    fire ordeals, gifts to Brahmanas, protection of kine and Brahmanas, Horse-sacrifice,
    death in battle for a Brahmana or preceptor, renunciation, restoration of stolen
    property, vows, menstrual and ritual cleansing, and purification of vessels.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vyasa states that penances, religious rites, and gifts can wash off sins if
    the offender does not commit them again.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: For the sin of slaying a Brahmana, the passage prescribes a twelve-year discipline
    including mendicancy, carrying a human skull and khattanga, celibacy, sleeping
    on bare ground, public confession, and absence of malice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Other expiations for slaying a Brahmana include voluntary death by weapon,
    repeated falling head-down onto blazing fire, a long journey while reciting the
    Vedas, gifts of property or a furnished house, protection of kine and Brahmanas,
    and fasting regimens of different lengths.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says that taking the final bath at the completion of a Horse-sacrifice
    cleanses those guilty of slaying a Brahmana, and also lists dying in battle for
    a Brahmana and giving cows or horses as cleansing acts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: For drinking alcohol, the passage lists expiations including drinking hot
    liquor, falling from a mountain, entering blazing fire, going on an everlasting
    journey after renouncing the world, performing a sacrifice laid down by Vrihaspati,
    giving land, and abstaining thereafter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: For violating the preceptor's bed, the passage prescribes lying on heated
    iron, cutting off the emblem of sex, leaving for the woods with eyes turned upward,
    and casting off the body as cleansing acts.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Offenses against a preceptor, a fallen Brahmacharya vow, adultery, and theft
    are assigned expiations such as pleasing the preceptor, wearing cow hide for six
    months, observing rigid vows, and returning the value of stolen property.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: A younger brother marrying before the elder brother, and the elder brother
    in that situation, are said to be cleansed by a twelve-night vow; the younger
    brother is also told to wed again for deceased ancestors.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Women are said to be cleansed by regulated life, the vow of chaturmasya, cleansing
    food, and menstrual course; the passage compares menstrual cleansing to scouring
    a metallic plate with ashes.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Stained brass-and-copper plates and vessels are said to be cleansed by ten
    purifying substances, and the passage closes by distinguishing the measure of
    virtue prescribed for a Brahmana and for a person of the kingly order.
  category: object
  evidence_refs:
  - ev:10
