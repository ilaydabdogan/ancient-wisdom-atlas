canonical_text:
  quote: ''
  summary: Vaishampayana narrates that Rama comes to the tirtha Vadarapachana. There
    Sruvavati, daughter of Bharadwaja, performs severe vows as a Brahmacharini to
    obtain Indra as husband. Indra visits in the form of Vasishtha, praises penance,
    and orders her to boil five jujubes as a test. When the fruit does not soften
    and the fuel is gone, Sruvavati puts her own limbs into the fire without pain.
    Indra reveals himself, grants that she will live with him in heaven after casting
    off her body, and declares the hermitage a famous sin-cleansing tirtha. The passage
    then begins a related account of Arundhati, the seven Rishis, a twelve-year drought,
    and Mahadeva disguised as a Brahmana asking Arundhati to cook jujubes.
  language: English
  quote_policy: summarized
