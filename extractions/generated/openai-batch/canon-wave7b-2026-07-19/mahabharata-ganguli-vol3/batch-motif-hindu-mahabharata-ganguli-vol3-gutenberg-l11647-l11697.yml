canonical_text:
  quote: Karna was slain by Arjuna like an elephant by a lion.
  summary: 'Sanjaya reports the aftermath of Karna''s death: Shalya leaves the battlefield,
    Duryodhana grieves over his shattered army, warriors gather around the fallen
    Karna, the Kauravas flee, Bhima and allied warriors celebrate, and Shalya counsels
    Duryodhana that Destiny has favored the Pandavas. Dhritarashtra then asks about
    the appearance of the routed hosts.'
  language: English
  quote_policy: quoted
