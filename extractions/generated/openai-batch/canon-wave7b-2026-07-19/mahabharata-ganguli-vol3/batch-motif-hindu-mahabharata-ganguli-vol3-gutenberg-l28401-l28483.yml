canonical_text:
  quote: All the worlds and all created things live in thee, and enter thee (when
    the dissolution comes).
  summary: Bhishma addresses Krishna in a hymn of praise, identifying him with the
    supreme, all-pervading deity, the refuge and creator of beings, the one in whom
    worlds reside and into whom they enter at dissolution. The hymn also describes
    divine birth from Devaki and Vasudeva, many names and forms, solar and Soma forms,
    salvific knowledge, and identification with Vedic sacrifice, Homa, libations,
    metres, and the golden-winged swan.
  language: English
  quote_policy: quoted
