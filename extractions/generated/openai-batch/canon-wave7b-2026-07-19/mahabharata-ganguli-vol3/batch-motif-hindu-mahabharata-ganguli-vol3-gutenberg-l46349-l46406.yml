canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma about sacrificial remnants, fasting, penance,
    Brahmacharya, hospitality, and afterlife rewards. Bhishma distinguishes unlawful
    eating from Vedic ritual consumption, redefines highest penance as renunciation
    and humility rather than mere fasting, and describes disciplined food-sharing
    with gods, Pitris, servants, and guests as leading to heaven, felicity, and a
    high end after death.
  language: English
  quote_policy: summarized
