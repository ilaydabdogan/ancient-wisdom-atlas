  quote: ''
  summary: After a fowler leaves, a grieving she-pigeon laments the loss of her husband,
    recalls their companionship, declares life useless without him, and casts herself
    onto a blazing fire. She then sees her deceased husband ornamented in the firmament
    on a celestial car among meritorious beings; the bird ascends to heaven, receives
    honours for his deeds, and continues in joy with his wife.
