  quote: ''
  summary: 'Bhishma gives a monarch practical counsel on royal policy: kinds of friends,
    the need to combine trust with mistrust, signs of reliable allies, qualifications
    for counsellors and ministers, and the mixed danger and value of kinsmen.'
  language: English
  quote_policy: summarized
literal_observations:
