  text: Bhishma addresses a monarch and speaks about the friends of kings.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Kings are said to have four kinds of friends: one with the same object, one
    devoted, one related by birth, and one won over by gifts and kindness; a righteous
    person who serves only the righteous side is counted separately as a fifth kind.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king is advised not to disclose purposes to a righteous person when those
    purposes would not enlist that person's sympathy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says the king should watch his friends carefully and should regard
    all four kinds with suspicion in matters he must do personally.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that a wicked person may appear honest, an honest person
    may change, a foe may become a friend, and a friend may become a foe.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Bhishma recommends both trusting and mistrusting others, warning against complete
    reliance and also against total lack of trust.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: A best friend of the king is described as rejoicing in the king's aggrandisement,
    suffering at the king's decay, and sharing fear in calamity and joy in prosperity.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A person whose fall would be brought about by the king's fall should be trusted
    and advanced along with the king's own advancement.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: A person who seeks to rescue the king from harm even in religious rites is
    said to be one who would rescue him in every other business.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The counsellor may be a priest, preceptor, or honoured friend, and should
    possess intelligence, memory, business skill, aversion to cruelty, freedom from
    wrath, and steadiness whether regarded or disregarded.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Such a counsellor may be informed of the king's secret counsels and the true
    state of religious and profitable affairs.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: The king is told to appoint one person to one task, not two or three, because
    several persons assigned to one task may disagree.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Foremost ministers are described as restrained, free from jealousy, righteous
    despite lust, fear, covetousness, or wrath, skilled in business, and possessed
    of wise speech.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: Ministers of good birth and behaviour, liberality, bravery, learning, and
    resources are said to bring prosperity when honoured and supplied with wealth.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:15
  text: The passage warns that a king should fear his kinsmen like death because a
    kinsman may not endure another kinsman's prosperity.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: The passage also says a person without kinsmen is easily overridden by foes
    and that kinsmen constitute a refuge for one afflicted by others.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:17
  text: Bhishma concludes that kinsmen have both merits and faults, and advises honouring
    them in word and act while inwardly mistrusting them and behaving outwardly as
    if trusting them.
  category: speech
  evidence_refs:
  - ev:7
