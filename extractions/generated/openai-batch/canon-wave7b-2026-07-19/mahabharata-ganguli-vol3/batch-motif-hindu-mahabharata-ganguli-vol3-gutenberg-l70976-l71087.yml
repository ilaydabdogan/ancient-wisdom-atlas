  text: A commentator's gloss presents a sacrifice being celebrated by an ignorant
    person and states that further defects in that sacrifice are feared.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Parnada, described as a descendant of Sukra, is said to have become a deer
    and to have lived in the woods as the Brahmana's neighbour.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same deer is also identified with the deity Dharma; the note reconciles
    the statements by proposing that Dharma first became the Rishi Parnada and then,
    as Parnada, was metamorphosed into a deer.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The note reports an interpretation in which Dharma, as a deer, arranges liberation
    from the metamorphosis; the translator suggests the relevant pronoun may refer
    instead to the misled Brahmana.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: Samadhanam is explained as absorption of meditation or a state in which one
    has no affection for the world.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The note distinguishes desire-bound duty from duty practiced without desire
    of fruit, stating that only the latter can lead to Emancipation.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
