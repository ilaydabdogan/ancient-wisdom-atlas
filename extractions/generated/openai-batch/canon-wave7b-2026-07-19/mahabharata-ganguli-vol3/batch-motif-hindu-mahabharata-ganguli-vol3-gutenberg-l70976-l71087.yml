  summary: Footnotes discuss commentarial readings involving a flawed sacrifice, Dharma
    or Parnada becoming a deer near a Brahmana, meditative absorption, desireless
    duty, yogic powers and warnings, the merging of faculties into the Supreme Soul,
    and creation from primal essences while distinguishing the real soul from the
    unreal world.
