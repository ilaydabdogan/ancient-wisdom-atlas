canonical_text:
  quote: ''
  summary: The passage distinguishes Egyptian conceptions of the Khu, Ba, Ka, and
    heart as postmortem elements. It describes the Ba as a bird-like soul, the Khu
    as divine intelligence released at death, the Ba’s judgment and nourishment, the
    Ka’s tomb offerings, and an embalming ritual in which organs are removed, addressed
    before the Sun and gods, and cast into the river.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ba is described as an imperishable part of a person that passes after
    death into the other world and is pictured as a bird, usually with a human head
    and sometimes human hands.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts the Khu as essentially divine with the Ba as essentially
    human.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Hermetic explanation cited, the Khu is identified with intelligence,
    the Ba with soul, and the body is described as a prison-like earthly dwelling.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: At death, the Khu is released, soars to heaven, and becomes a spirit, while
    the Ba is carried to a hall of judgment for punishment or happiness according
    to its deserts.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Ba is usually represented by a plover, but sometimes by a hawk associated
    with Horus and solar gods.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ba is said to fly between earth and heaven, visit its mummy, dwell with
    gods above, and rest in a garden among sycamores, where it eats fruit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Ba requires meat and drink for sustenance and depends on relatives and
    descendants to provide them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Ka is described as originally nourished by actual offerings placed in
    the tomb, entering through the false door and consuming the food there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Prayer and magical incantation identify food or its doubles with the gods,
    who communicate it to the soul.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The heart is described as another immortal element, with an immaterial double
    passing after death into the other world.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the embalming practice described by Porphyry, the stomach is placed in
    a coffer, held to the sun, addressed in a speech on behalf of the dead, and then
    thrown into the river.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
