canonical_text:
  quote: ''
  summary: The passage describes En-lil as lord of the ghost-world and ruler of the
    dead, then surveys Babylonian categories of spirits and ghosts, especially lil,
    utukku, and ekimmu. It explains beliefs about summoned shades, underworld dust,
    harmful demons, unburied corpses, funerary rites, offerings for the dead, necromantic
    disturbance, and burial denial as a hostile act.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: En-lil is described as the god worshipped at Nippur, bearing the title “lord
    of the ghost-world”; his temple is described as one of the oldest sanctuaries
    of Sumerian Babylonia and as a source of magical arts connected with spirits of
    the underworld.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that En-lil’s lordship of the underworld came to imply
    lordship over the earth and that he became ruler of both the dead and the living.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: En-lil is said to appear in the Deluge story as destroyer of men; Namtar is
    named as his plague-demon minister, and En-lil is compared with Kingu in wearing
    tablets of destiny that determine when men die.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Sumerian lil is described as having included ghosts of men and other immaterial
    ghosts; after death it had its home in the underworld and came out at night to
    satisfy hunger with street garbage.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The shade of Ea-bani in the Epic of Gilgames is said to rise from the earth
    like a cloud of dust; the passage links this image to the ghost’s home in the
    ground and food of dust in the dark underworld.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The utukku is described as a general term for demons, including demons of
    the field, mountain, sea, and grave; the utukku of the grave is identified as
    a restless ghost of a dead man that has become a harmful spirit of darkness.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The ordinary utukku is said to have no human ancestry, to sit on the sufferer’s
    neck, and to inflict pain and death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The ekimmu is described as hovering around the tomb and attacking the loins
    of those who encounter it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The ekimmu is explained as the spirit of an unburied corpse whose funeral
    rites were not performed and whose remains lacked the talismans needed to cross
    the river of death or join the lower world.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The ekimmu is said to wander in desert places, sometimes sheltering in living
    bodies, causing sore diseases, and eating street refuse at night because tomb
    food and drink are denied to it.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The cited conclusion of the Epic of Gilgames states that the ekimmu of a body
    abandoned in the field does not rest in the earth and must eat pot garbage and
    food refuse thrown into the street.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: 'The passage gives examples of hostile treatment of corpses: a Babylonian
    king prays that an enemy’s body be denied a grave, Assur-bani-pal removes Elamite
    kings from tombs, Sennacherib desecrates ancestral burial-places, and the Stela
    of the Vultures shows enemy bodies exposed to vultures while slain Babylonians
    are buried under a tumulus.'
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage distinguishes the ekimmu as the ghost of an unburied corpse from
    the utukku as usually a non-human demon, though sometimes a buried corpse’s ghost
    that escaped from the dead; burial rites, pure water, and food should confine
    and sustain it below, while necromancy may bring it back to the upper world.
  category: relationship
  evidence_refs:
  - ev:9
