- id: obs:1
  text: Mnevis is described as a lesser Apis and as the divine bull of Heliopolis
    in rivalry with the deity of Memphis.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Mendes, a ram rather than a bull was worshipped, and priests regarded it
    as an incarnation of Ra; a later wordplay on ba as both “ram” and “soul” led to
    identification with the soul of Osiris.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Fayyum, the crocodile became the god Sebek or Sukhos, while the later
    name Pete-sukhos is explained as treating the crocodile as a gift from Sukhos
    rather than the god himself.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Crocodiles were also worshipped at Onuphis and Ombos, and at Nubti a crocodile
    could be identified with Set rather than Sebek.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that the sacred animal existed before the god whose incarnation
    it later became.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Thoth is described as the god of Hermopolis, patron of writing and books,
    and the deity to whom the invention of hieroglyphs was ascribed.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Egyptian name Dehuti or Zehuti is interpreted as meaning “he who belongs
    to the ibis,” and Thoth’s human body is treated as evidence that he was not originally
    the ibis.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: According to Manetho as cited in the passage, Apis, Mnevis, and Mendes were
    adjudged gods during the reign of the second king of the Second Dynasty.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage interprets Manetho’s statement as state recognition that official
    gods of Memphis, Heliopolis, and Mendes were incarnated in local sacred animals.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: 'A temple contrast is described: Memphis and Heliopolis temples were dedicated
    to Ptah and Tum rather than Apis and Mnevis, and the gods of human form continued
    alongside sacred animal forms.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: A later legend explained the animal forms of the gods by saying that, after
    Osiris was murdered by Typhon or Set, the gods hid themselves in the bodies of
    beasts to avoid sharing his fate.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage says belief in the soul’s migration from one body to another and
    hieroglyphic symbolism helped join neolithic fetishism with historical Egyptian
    anthropomorphism.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The earliest monuments are said to show Horus as a hawk and the Pharaoh as
