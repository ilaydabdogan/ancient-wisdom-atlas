canonical_text:
  quote: ''
  summary: The passage discusses Egyptian sacred animal cults, including bulls, a
    ram, crocodiles, and the ibis, and argues that local sacred animals often preceded
    their later association with anthropomorphic state gods. It presents Thoth’s relation
    to the ibis, Manetho’s report of official recognition of Apis, Mnevis, and Mendes,
    a legend explaining animal forms after the murder of Osiris, and a broader claim
    that belief in soul migration and hieroglyphic symbolism helped join older animal
    fetishism to historical Egyptian anthropomorphism.
  language: English
  quote_policy: summarized
