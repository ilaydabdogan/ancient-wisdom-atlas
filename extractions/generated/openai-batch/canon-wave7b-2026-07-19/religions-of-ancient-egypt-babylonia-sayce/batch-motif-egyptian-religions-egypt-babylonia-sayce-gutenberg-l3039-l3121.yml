  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The divine incarnation was separated from other animals of the same species,
    while some part of its divinity was reflected on the species as a whole.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Apis is called an incarnation of Ptaḥ and is described as “the new life of
    Ptaḥ” on votive tablets.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Heliopolis, Ur-mer or Mnevis is described as a black bull and incarnation
    of the sun-god; at Erment, Bakis is described as the bull in which Mentu was incarnated.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that the bull was sacred in the Memphis region, Heliopolis,
