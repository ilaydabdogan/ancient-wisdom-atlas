canonical_text:
  quote: ''
  summary: The passage discusses Egyptian sacred animals, especially hawks and bulls,
    as divine embodiments or fetishes. It describes Apis, Mnevis, and Bakis as sacred
    bulls associated with specific deities; explains the species-wide sanctity of
    bulls; surveys animal mummification and animal cemeteries; and traces the dead
    Apis through Osirian identification into Osiris-Apis and later Serapis under Ptolemaic
    Greek influence.
  language: English
  quote_policy: summarized
