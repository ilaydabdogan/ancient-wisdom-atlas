  summary: The passage discusses Babylonian mythology as closely connected with religion
    and worship, warns against drawing theological conclusions from literary myths
    without caution, summarizes the composite literary development of Babylonian epics
    such as the Epic of Gilgames, contrasts Babylonian divine figures with Egyptian
    euhemerized gods, and introduces the Adapa story as an explanation of human mortality
    through the first man's refusal of immortality and journey to the sky.
