canonical_text:
  quote: ''
  summary: The passage argues that astral forms of worship among South Arabian, West
    Semitic, and Canaanite peoples were shaped by Babylonian influence. It discusses
    Athtar/Istar, moon-god worship, solar goddesses, Baal, Ashtoreth, Canaanite solar
    theology, cult centers such as Ur, Harran, Sippara, and a hymn to the moon-god
    of Ur that presents him as supreme creator, father, life-sustainer, and lawgiver.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents the conception of the divine as a star as a belief attested
    among Western Semites and lists Athtar, the moon-god, the moon-god's messenger
    or prophet, and the sun goddess among supreme deities.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Athtar is identified with Babylonian Istar and is described as becoming male
    in transmission to Semitic groups.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the people of Hadhramaut borrowed the name Sin from Babylonia
    and the people of Qataban borrowed the name Nebo or Anbay.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Samas, the sun, became a goddess and that a solar
    goddess conception passed from Sippara to Semites west of the Euphrates.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: South Arabian Baalim are described as Babylonian in origin, and Arabian and
    West Semitic Sabaism is described as resulting from contact with Babylonian civilization.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The primitive Semitic Baal is described as a lord of a plot of earth or tribal
    territory who became a moon-god or evening star, while his wife was embodied in
    the sun.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the religion of Canaan, the supreme Baal is identified as the sun-god and
    female Ashtoreth is identified with the moon.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says Canaanite theology reflects a phase of Babylonian theology
    in which the sun-god was supreme and gods were identified with the sun.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Sabaism is described as an early form of Babylonian belief communicated west
    of the Euphrates in different ways, with one route emphasizing the moon-god through
    Ur and another emphasizing later solar worship in Canaan.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage reports that the moon-god in Southern Arabia bore titles including
    Ammi or Ammu and that Hommel suggested Yahveh may once have been a title of the
    moon-god among Western Semites of Babylonia.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: A hymn to the moon-god of Ur is summarized as nearly monotheistic in tone,
    describing the moon-god as supreme in heaven and earth, creator of the universe,
    father, forgiving, life-sustaining, omnipotent, without rival, giver of growth,
    and establisher of law and justice.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: In the hymn summary, angels of heaven and spirits of earth do homage to the
    moon-god, and no goddess appears at his side.
  category: action
  evidence_refs:
  - ev:8
