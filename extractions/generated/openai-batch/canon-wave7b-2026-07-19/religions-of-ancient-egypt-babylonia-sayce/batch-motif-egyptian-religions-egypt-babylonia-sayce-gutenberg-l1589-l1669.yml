canonical_text:
  quote: ''
  summary: The passage explains how the Egyptian Ka could enter a closed tomb through
    a painted false door, receive offerings, and rejoin the mummy or statue. It connects
    the false door with the Pharaoh's Ka-name, royal worship, Horus-linked kingship,
    temple art that depicts the king and his Ka separately, worship of divine Kas,
    and a Book of the Dead resurrection formula in which the dead person greets the
    Ka and uses protective words involving an amulet of Ra, balance, Truth, restored
    body parts, and freedom from sacrifice.
  language: English
  quote_policy: summarized
