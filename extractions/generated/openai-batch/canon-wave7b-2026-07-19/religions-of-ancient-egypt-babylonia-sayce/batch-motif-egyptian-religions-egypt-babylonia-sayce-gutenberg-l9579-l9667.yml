canonical_text:
  quote: ''
  summary: 'The passage describes Babylonian and Assyrian developments toward divine
    hierarchy and state-centered theology: Nebo and Nusku are amalgamated, Bel-Merodach
    is elevated above other gods, Assur is presented as the deified city and state
    of Assyria, cities and rivers are treated as deities, and Assyrian kings are described
    as former high priests whose representation of Assur depended on representing
    the city of Assur.'
  language: English
  quote_policy: summarized
