canonical_text:
  quote: ''
  summary: The passage contrasts Nippur and Eridu as old Babylonian sanctuaries. Nippur
    is associated with El-lil, the ghost-world, hostile spirits, and magical formulas.
    Eridu is associated with Ea, a culture-giving and human-creating deity whose home
    is in the deep waters, and with Asari as Ea’s son and minister. The passage also
    describes divine genealogies linking Babylon with Eridu and Ur with Nippur, places
    the Babylonian Eden and the centre of the earth at Eridu, and compares Nippur
    and Eridu with Abydos and Babylonia’s dual political geography with Egypt’s Upper
    and Lower Egypt.
  language: English
  quote_policy: summarized
