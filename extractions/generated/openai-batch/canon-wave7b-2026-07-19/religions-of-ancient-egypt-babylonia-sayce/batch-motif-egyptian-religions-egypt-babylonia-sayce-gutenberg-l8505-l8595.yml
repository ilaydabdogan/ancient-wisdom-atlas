canonical_text:
  quote: The Babylonian triad is thus in no way a trinity.
  summary: The passage explains Babylonian divine triads as groups of three coequal
    deities, presents Nebuchadrezzar's prayers to Merodach, and describes Merodach
    as Babylon's city-god, source of royal legitimacy, solar deity, and later Bel-Merodach.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The doctrine of the triad is said to extend beyond prominent gods to subordinate
    deities, with Samas, Malik, and Bunênê given as an example.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Within the Samas-Malik-Bunênê triad, Malik and Bunênê are described as local
    sun-gods distinguished from Samas of Sippara, and Bunênê is transformed into a
    female divinity and consort of Malik.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that a Semitic conception of a divine family is combined
    with older Sumerian ideas, producing a triad of three gods of equal power and
    rank rather than a mother-and-son grouping.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Babylonian triad is explicitly distinguished from a trinity; its divine
    persons are described as coequal, independent, and limited by one another's spheres.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The three deities of a Babylonian triad are described as dividing the universe,
    or the relevant portion of it, among carefully defined powers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage contrasts Babylonian triads with Semitic Baalim, whose local supremacy
    did not admit shared or limited powers in the same way.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nebuchadrezzar prays to Merodach, calls him his lord, and says that Merodach
    created him and entrusted him with sovereignty over multitudes of men.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Merodach is said to hear Nebuchadrezzar's prayer and accept his petition.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Nebuchadrezzar lifts his hand in prayer to Merodach and presents himself as
    a king who adorns the shrine and fortresses of the god.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Merodach is described as Babylon's divine guardian and lord; Ê-Saggil is dedicated
    to him, and the kings of Babylon derive their right to rule from him and his priesthood.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Merodach's supremacy is described as growing with the political fortunes of
    Babylon, leading him to become Bel, 'the lord,' beyond Babylon itself.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Merodach is described as having a solar character and as formerly a local
    sun-god like Utu of Larsa or Samas of Sippara.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage reports a later punning etymology of Merodach's name as 'heifer
