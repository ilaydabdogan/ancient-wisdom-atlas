canonical_text:
  quote: the idea of mediation must also be traced to Babylonia
  summary: The passage argues that mediation, repentance, consciousness of sin, confession,
    and absolution are traceable to Babylonia. It describes priests, magicians, deified
    kings, lesser gods, and divine messengers as mediating or vicegerent figures;
    contrasts Semitic anthropomorphic gods with Sumerian spirits and demons; refers
    to the triumph of gods of light and order over monsters of chaos; and cites penitential
    psalms and prayers to Merodach.
  language: English
  quote_policy: quoted
