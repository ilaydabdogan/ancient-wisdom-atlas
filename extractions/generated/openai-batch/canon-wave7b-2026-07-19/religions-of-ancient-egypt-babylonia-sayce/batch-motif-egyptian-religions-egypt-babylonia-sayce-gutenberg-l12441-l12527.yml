canonical_text:
  quote: ''
  summary: The passage argues for parallels between Babylonian and Hebrew ritual law,
    including ritual vocabulary, sacrificial rules, threshold blood rites, temple
    personnel, and agricultural festivals. It describes Babylonian New Year and seasonal
    festivals, associations with Bau, Merodach, Bil-’si, and Tammuz, and compares
    the Babylonian agricultural feast cycle with Canaanite and Hebrew observances
    such as the Feast of Weeks and first-fruits offerings.
  language: English
  quote_policy: summarized
