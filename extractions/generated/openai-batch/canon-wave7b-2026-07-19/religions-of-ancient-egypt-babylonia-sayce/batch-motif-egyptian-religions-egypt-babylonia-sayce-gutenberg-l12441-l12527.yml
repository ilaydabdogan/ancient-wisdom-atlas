- id: obs:2
  text: The passage presents Hebrew ritual-law terms such as torâh, kipper, and qorbân
    as corresponding to Babylonian or Assyrian terms.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage describes ritual distinctions between offerings of rich and poor,
    a requirement that the sacrificial animal be without blemish, and assigned portions
    of the victim for the priest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A ritual instruction is described in which a lamb is sacrificed at the gate
    of a house and its blood is applied to lintels, doorposts, and guardian images
    at the entrance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author states that a similar blood rite was still practiced in Egypt and
    recounts conforming to it when a dahabiah was launched.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage reports Zimmern’s view that the Tabernacle or Tent of meeting
    was connected with determining the proper time for an undertaking, a function
    also attributed to the Babylonian seer.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says Babylonian temple ritual included seers, prophets, and singers,
