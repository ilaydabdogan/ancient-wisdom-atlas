  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Babylonian divine festivals and month names are described as shaped by agricultural
    necessities, especially spring sowing and autumn harvest.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The same festival could mark either the beginning or the end of the agricultural
    year and involved rejoicing, rest from labor, thanks to the gods, and first-fruits
    offerings.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The New Year festival is said to have been sacred to Bau at Lagas and to Merodach
    at Babylon, with calendars varying before a uniform calendar was imposed under
    Khammurabi.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: A third agricultural festival, the summer solstice feast in June, marked drying
    soil and disappearance of spring crops and vegetation; it was linked with Bil-’si
    in some early Babylonian states and later with Tammuz in Assyria.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Tammuz is described as having died untimely, with his death celebrated when
    nature seemed to die, and as also being associated in October with rising again
    from the dead.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The three great feasts of the Babylonian agriculturist are said to appear
    again in Canaan, with the Hebrew Feast of Weeks corresponding to the Babylonian
    spring festival.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Levitical Law is described as ordering a sheaf of first-fruits to be presented
    on the 16th of Nisan, and the unleavened bread of the festival is said to symbolize
    the ingathering of corn dedicated to God as consecrated cakes.
  category: action
  evidence_refs:
  - ev:7
