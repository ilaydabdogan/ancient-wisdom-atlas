  summary: 'The passage summarizes Sayce''s account of the Babylonian Gilgames epic:
    its twelve-book calendrical arrangement, Gilgames'' possible solar interpretation
    and later heroic profile, the creation and humanization of Ea-bani, the cedar-forest
    expedition against Khumbaba, and Istar''s rejected offer of marriage to Gilgames.'
