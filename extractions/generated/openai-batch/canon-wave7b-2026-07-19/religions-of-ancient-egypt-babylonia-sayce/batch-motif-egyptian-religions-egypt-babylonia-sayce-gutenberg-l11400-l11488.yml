literal_observations:
- id: obs:1
  text: The epic is described as divided into twelve books, with an arrangement that
    has an astronomical basis and some episodes corresponding to month names or festivals.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sixth book is said to concern the love and revenge of Istar, while the
    eleventh book contains the Deluge episode associated with a month named for a
    curse of rain.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gilgames is described as treated by the poet, at least secondarily, as a solar
    hero or representative of the sun-god; he becomes sick after the summer solstice
    and is healed in the final book after bathing in the ocean waters encircling the
    world.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Gilgames is described as originally a man, a creation of Aruru, a strong Babylonian
    hero who saves his country from foes and destroys monstrous beasts.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Erech, the inhabitants complain about Gilgames, and the gods hear the people's
    cry and instruct Aruru to create a rival to him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Aruru kneads clay with her hands and makes Ea-bani in a half-human, half-beast
    form, hairy and living among gazelles and cattle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Huntsman cannot capture Ea-bani, but a courtesan of Istar entices him;
