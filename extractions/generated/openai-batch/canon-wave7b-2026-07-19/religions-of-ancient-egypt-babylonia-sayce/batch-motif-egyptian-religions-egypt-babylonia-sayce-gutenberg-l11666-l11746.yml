canonical_text:
  quote: ''
  summary: The passage recounts a Babylonian flood story in which Xisuthros builds
    an ark on Ea's advice, preserves living beings, survives a seven-day storm, tests
    the waters with birds, releases the animals, and sacrifices on Mount Nizir. It
    then describes divine disagreement and Bel's promise not to send another flood,
    followed by Gilgames's healing, quest for a thorny plant of immortality, loss
    of the plant to a serpent, and inquiry into Ea-bani's fate in the underworld.
    The passage closes with an explicit comparison between the Babylonian afterlife,
    Egyptian hopes for the fields of Alu, and Homeric Greek Hades.
  language: English
  quote_policy: summarized
