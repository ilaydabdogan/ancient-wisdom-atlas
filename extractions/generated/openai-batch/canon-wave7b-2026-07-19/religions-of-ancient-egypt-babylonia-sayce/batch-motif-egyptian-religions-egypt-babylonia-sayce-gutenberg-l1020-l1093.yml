canonical_text:
  quote: ''
  summary: Sayce describes Egyptian hieroglyphic writing as a system in which abstract
    ideas are represented by visible symbols. He distinguishes the broader Egyptian
    population from the priestly colleges, which systematized theology, organized
    cults, and developed schools of thought at Hermopolis and Heliopolis. Hermopolis
    is associated with creation by voice or the sound of the voice, while Heliopolis
    is associated with the Ennead, the grouping of deities into nine and their later
    identification as forms or manifestations of one another. The passage also discusses
    later divine epithets such as the god without form, the self-grown or self-existent
    deity, the father of the beginning, lord of eternity, and the nameless one, emphasizing
    the continued dominance of concrete symbolism.
  language: English
  quote_policy: summarized
