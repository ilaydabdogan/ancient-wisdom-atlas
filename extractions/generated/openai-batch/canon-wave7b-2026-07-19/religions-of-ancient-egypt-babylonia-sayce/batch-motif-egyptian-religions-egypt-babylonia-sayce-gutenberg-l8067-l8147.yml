  quote: he had formed them like a potter out of the clay
  summary: The passage describes Ea of Eridu as lord of sea and land, creator and
    civilizer of mankind, and a divine potter who forms humans from clay. It then
    discusses Dam-kina, Bau, Aruru, En-lil, and Zi-Kum/Zi-Kura as figures in changing
    Babylonian theological relationships involving mother-goddesses, fertility, the
    underworld as both death-realm and life-source, sky and deep waters, and the absorption
    of older Sumerian spirits into Ea's divine family.
  language: English
