  quote: ''
  summary: The passage argues that Egyptian religious theories influenced later Christian
    theology through Alexandria. It discusses similarities between Egyptian and Christian
    doctrines of soul, spirit, resurrection, heaven, and especially the Trinity. It
    then describes Egyptian triads and trinities, including local Theban and Memphite
    formations, a solar model of three forms of one god, the father-wife-son divine
    family pattern, the role of names and the ka, and the Osirian triad of Osiris,
    Isis, and Horus.
  language: English
  quote_policy: summarized
