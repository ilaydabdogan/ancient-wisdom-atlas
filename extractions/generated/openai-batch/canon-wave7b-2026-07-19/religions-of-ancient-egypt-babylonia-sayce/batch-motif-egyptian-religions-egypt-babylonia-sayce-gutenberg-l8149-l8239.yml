  summary: 'The passage describes Sayce’s account of Babylonian theological shifts:
    Ea is displaced by Merodach, who receives Ea’s wisdom and becomes the conqueror
    of chaos and creator; Anu/Ana is presented as a sky deity of Erech whose sign
    is an eight-rayed star; sky and earth spirits are distinguished; and Anat and
    Belit/Beltis are described as feminine counterparts derived from male gods, while
    Istar remains an independent goddess.'
