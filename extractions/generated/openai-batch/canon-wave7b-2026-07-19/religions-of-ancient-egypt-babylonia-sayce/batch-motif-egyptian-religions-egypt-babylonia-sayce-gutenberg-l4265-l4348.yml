  quote: ''
  summary: The passage describes Nephthys as individualized to complete the trinity
    of Set, Anubis as an older jackal god of the underworld who became subordinate
    to Osiris, and Osiris as a dead god whose tomb-centered cult made Abydos a major
    sacred burial place. It also discusses competing local claims to Osiris's tomb
    or body parts and connects Osiris with Anher, the sun-god of This and Sebennytos,
    through cemetery and cult geography.
  language: English
