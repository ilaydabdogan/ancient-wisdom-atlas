canonical_text:
  quote: ''
  summary: The passage traces the Babylonian moon-god Sin/Nannar from Ur through Arabia
    to Egypt; compares associated dwarf and ape figures with Egyptian Bes, Thoth's
    apes, and the Danga dwarf; describes the moon-god as lord and shepherd of the
    heavenly hosts; discusses later uses of the title by other gods, kings, and Yahveh;
    describes En-me-sarra as a chthonic and celestial lord of hosts; and contrasts
    Babylonian magic and ritualism with Egyptian postmortem moral judgment under Osiris.
  language: English
  quote_policy: summarized
