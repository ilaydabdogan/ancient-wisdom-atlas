    especially Babylonian polytheism and Egyptian animal-worship. It argues that interpreters
    must suppress modern assumptions and use historical sympathy. It then distinguishes
    religion from morality and gives examples of non-moral, immoral, or morally divided
    cosmic powers in Greek, Gnostic, and Zoroastrian contexts. The passage closes
    by describing primitive admiration and fear of strength rather than goodness.
