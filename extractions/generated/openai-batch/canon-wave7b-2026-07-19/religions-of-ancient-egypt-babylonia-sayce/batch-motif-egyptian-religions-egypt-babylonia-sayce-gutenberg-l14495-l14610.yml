canonical_text:
  quote: ''
  summary: 'A footnote passage records iconographic and scholarly notes on Egyptian
    religious symbols: bird and beetle forms used for the Khu and Ba or soul; four
    vases dedicated to animal-headed figures and identified with planets; natron,
    scarabs, and Horus as hawk; sacred barks associated with Shesh-Hor and the sun-god''s
    day and night voyages; the blacksmiths and forge of Horus; bronze and golden hawk
    forms; Horus''s regional cults, two eyes, and possible comparisons with Sumerian
    or Babylonian names and Saturn-associated deities.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bird was chosen because its name sounded like Khu; the plover, called ba,
    denoted the Ba or soul; an ostrich represented the soul on objects from the tomb
    of Menes at Negada.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: From the fifteenth to the eleventh century B.C., a beetle with a ram's head
    could be substituted for the bird, using the phonetic values ba for ram and kheper,
    'to become,' for beetle.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Four vases were dedicated to Amset or Smet, Dua-mut-ef, Hapi, and Qebh-sonu-f,
    described respectively with man, jackal, ape, and hawk heads, and identified with
    planets in the Pyramid texts.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage notes scholarly uncertainty about whether any scarabs go back
    to the Old Empire.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: Natron from Nekheb and from the north is described in differing grain counts,
    and the Horus of Nekhen is represented by a mummified hawk called akhem.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The festival of Shesh-Hor appears on the Palermo Stela with the determinative
    of a sacred bark and is also mentioned on First Dynasty ivory tablets.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: In Pyramid-text references, the Mat or Madit bark of the sun-god is identified
    with the bark of Shesh-Hor, and the sun-god voyages in barks by day or night.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: One bark has the hawk's place taken by a picture of the ben or tomb of Osiris,
    identified with that of Akhem the mummified hawk.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The mesnitiu, or blacksmiths of Horus, are cited; the Mesnit or Forge is the
    name of the passage opening into the shrine of the temple of Edfu.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: A large bronze hawk with a solid gold head and obsidian eyes was found with
    two bronze figures of Pepi in the foundation of the temple of Nekhen.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: Hor-nubi, 'the golden Horus,' is described as the god of the Antaeopolite
    nome.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Horus is listed as god of numerous nomes in Upper Egypt and the Delta.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: An emblem is said to have an unknown first invention, probably pre-Menic,
    and is compared with composite animals on early monuments of Nekhen and Abydos.
  category: object
  evidence_refs:
  - ev:11
- id: obs:14
  text: Hor-merti, 'Horus of the two eyes,' was worshipped at Shedennu, and Pyramid
    texts mention Horus with blue eyes.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:15
  text: One note states that the name of the god is written Kha-ar in one case and
    that Khur-galzu, glossed 'Horus, thou art great,' is given as the name of a Sumerian
    goddess.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:16
  text: Nin-ip is identified with the planet Saturn, like 'Horus the bull.'
  category: relationship
  evidence_refs:
  - ev:14
