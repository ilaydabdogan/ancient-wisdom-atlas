  summary: The passage describes Egyptian ideas about the fate of the wicked after
    judgment, including Osirian judgment, possible annihilation, and punishments in
    the Book of the Other World. It then surveys Egyptian sacred books attributed
    to Thoth, temple libraries, and the Book of the Dead as an Osirian ritual text
    guiding the deceased through the other world to judgment and Alu. It also notes
    the composite and gradual development of the Book of the Dead.
  language: English
