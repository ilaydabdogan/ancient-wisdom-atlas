candidate_motifs:
- id: motif:1
  label: firstborn or child as sacrificial offering
  taxonomy_refs:
  - sacrifice
  basis: The cited bilingual text is interpreted by the author as requiring an offspring
    to be given for a man’s life and body parts, and he explicitly reads this as child
    sacrifice.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The author states that his interpretation of the text has been disputed;
    the passage’s archaeological evidence supports human sacrifice more generally,
    not necessarily firstborn sacrifice specifically.
- id: motif:2
  label: human sacrifice of captives with later animal substitution
  taxonomy_refs:
  - sacrifice
  basis: Captives awaiting death and seal-cylinder scenes are presented as human sacrifice
    evidence; the passage then says human victims were later replaced by ox or sheep.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The archaeological interpretation is reported through the author and Ménant;
    later enemy impalement or burning is distinguished as royal vengeance rather than
    offering to Assur.
