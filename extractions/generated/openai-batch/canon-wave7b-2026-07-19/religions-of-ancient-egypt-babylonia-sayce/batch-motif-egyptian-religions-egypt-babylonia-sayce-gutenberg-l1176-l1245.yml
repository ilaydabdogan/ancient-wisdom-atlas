canonical_text:
  quote: ''
  summary: The passage describes how early Egyptian principalities survived as nomes
    with local sanctuaries, princes, priests, and gods; how local deities and feudal
    rulers were later absorbed into royal structures; how Egypt was remembered as
    two lands, Upper and Lower Egypt; and how Nekheb the vulture goddess of the south
    and Uazit the serpent goddess of the north expressed a north-south religious pairing
    within a shared Egyptian cultic legacy.
  language: English
  quote_policy: summarized
