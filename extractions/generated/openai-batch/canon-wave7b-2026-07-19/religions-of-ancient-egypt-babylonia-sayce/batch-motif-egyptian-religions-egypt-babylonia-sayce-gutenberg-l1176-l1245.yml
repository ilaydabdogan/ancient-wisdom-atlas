  text: Early Egyptian principalities are described as surviving in changed form as
    nomes, each with its own capital, central sanctuary, prince, special god or goddess,
    priests, ceremonies, and festivals.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hereditary princes of the nomes are described as feudal lords who owed qualified
    obedience to the Pharaoh and furnished tribute and soldiers when called upon.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the rise of the Eighteenth Dynasty, the old feudal nobility was replaced
    by court officials and bureaucracy dependent on the king.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gods of the nomes retained some independent character until a process
