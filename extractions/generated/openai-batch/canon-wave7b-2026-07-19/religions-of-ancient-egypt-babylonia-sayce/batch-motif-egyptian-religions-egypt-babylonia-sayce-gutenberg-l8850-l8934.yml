  quote: ''
  summary: The passage argues that Babylonian historical memory and older city cults
    prevented full monotheism despite tendencies to identify other gods with Merodach.
    It also presents Istar as an independent Sumerian goddess whose identity was transformed
    in several Semitic contexts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Babylonian records and historical memory are described as extending before
    Babylon became the capital, preserving earlier centers such as Nippur, Akkad,
    and Ur.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The god of Nippur is said to have once made and unmade kings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chronological schemes making a native of Babylon the first ruler of mankind
    or making Babylon the origin of astronomy are called fictions by the author.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Older cities retained pride in their traditions and temples, and their sanctuaries
    still received popular reverence.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sun-god of Sippara, the moon-god of Ur or Harran, and En-lil of Nippur
    are described as rivals of Merodach until late Babylonian times.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Nabonidos is described as caring for temples of the moon-god at Harran, the
    sun-god at Sippara, and Merodach at Babylon; he also says Merodach ordered him
    to restore the sanctuary of Sin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage states that historical continuity prevented Babylonia from developing
    monotheism, because the remembered past was tied to polytheism, separate city
    gods, sanctuaries, and minor divinities.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The author says later Babylonian inscriptions sometimes approached monotheistic
    language, including prayers to Merodach, praise of the moon-god as supreme and
    creator, and reference to an abstract god who confers lordship.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Anu is described as having a written name synonymous with god and as being
    identified with various cosmic deities in a theological list.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: A tablet is described as resolving chief Babylonian divinities into forms
    of Merodach, including En-lil, Nebo, and Nergal as functional forms of Merodach.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Istar is described as a goddess who retained independence, claimed equal rank
    with the gods, and remained essentially Sumerian despite Semitic influence.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage states that Istar became male in Arabia and Moab, was sometimes
    treated as male in Babylonia, was officially described as androgynous, and was
    assimilated to Semitic goddess categories in Canaan and Assyria.
  category: sequence
  evidence_refs:
  - ev:6
