canonical_text:
  quote: ''
  summary: 'The passage describes Sayce''s account of Babylonian theology: goddesses
    are portrayed as largely dependent on interchangeable names, with Istar as an
    exception; Merodach rises with Babylon''s political power and absorbs the names,
    powers, wisdom, authority, and prerogatives of older gods; the tablets of destiny
    and the fifty names express his inherited supremacy; Merodach becomes the divine
    counterpart of the Babylonian king; and Nabonidos attempts to centralize divine
    images in Merodach''s temple at Babylon, provoking opposition before Cyrus''s
    invasion.'
  language: English
  quote_policy: summarized
