comparison_claims:
- id: claim:1
  claim: The passage explicitly claims that Sumerian divine names and cultic-literary
    elements preceded and were assimilated into Semitic Babylonian religion.
  claim_level: historical_contact
  target: Sumerian and Semitic Babylonian religious traditions
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: This is the author's historical-philological claim within the passage;
    it is not independently verified here.
- id: claim:2
  claim: The passage contrasts Babylonian anthropomorphic worshipped gods with Egyptian
    animal gods and man-beast divine combinations.
  claim_level: visual_similarity
  target: Egyptian theology and divine iconography
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is a contrast in visual form, not an assertion of shared
    motif or historical connection.
- id: claim:3
  claim: The passage compares the banished chaos beings to medieval devils as exiled
    divine beings of an alien faith.
  claim_level: same_function
  target: medieval belief about devils as displaced alien divine beings
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an authorial analogy, not evidence for historical contact or
    common inheritance.
- id: claim:4
  claim: The passage uses 'Babylonian Olympos' to compare the mountain of the world
    with a divine mountain-court pattern associated with Olympus.
  claim_level: same_function
  target: Greek Olympus as divine mountain court
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage provides a comparative label only; it does not argue direct
