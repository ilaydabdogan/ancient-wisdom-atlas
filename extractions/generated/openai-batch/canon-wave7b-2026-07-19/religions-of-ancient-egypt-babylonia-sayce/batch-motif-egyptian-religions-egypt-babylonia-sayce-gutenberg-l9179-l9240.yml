canonical_text:
  quote: ''
  summary: The passage argues that Babylonian gods had Sumerian names and antecedents
    before Semitic assimilation, then describes Semitic Babylonian religion as strongly
    anthropomorphic. It contrasts worshipped human-shaped deities with primeval chaotic
    monsters associated with Tiamat, describes reciprocal likeness between gods and
    humans, mortality through failure to obtain immortality food and water, divine
    death and society, a world-mountain court of the supreme god, and Zu's theft of
    the tablets of destiny.
  language: English
  quote_policy: summarized
