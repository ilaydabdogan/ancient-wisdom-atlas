canonical_text:
  quote: ''
  summary: The passage surveys Babylonian sacred literature as incantations, hymns,
    penitential psalms, and ritual texts; stresses the fragmentary state of evidence;
    describes early Sumerian incantations as animistic and protective; and explains
    how older spirit-beliefs and incantations were later preserved and harmonized
    within Semitic Babylonian state religion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The sacred books of Babylonia are divided into three classes: magical texts
    or incantations, hymns to the gods, and penitential psalms.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated object of the magical texts or incantations is to preserve the
    faithful from disease and mischief, ward off death, and defeat the evil arts of
    the witch and the sorcerer.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The penitential psalms are said to resemble the psalms of the Old Testament
    and to be used by both individuals and communities in times of public calamity
    or dismay.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: François Lenormant is credited with first drawing attention to this sacred
    literature, characterizing its divisions, and identifying the Hindu Veda as its
    nearest analogue.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The author says knowledge of the literature is imperfect because surviving
    copies are fragmentary and come from the library of Nineveh; analysis and explanation
    are therefore provisional.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The ritual texts are described as difficult, obscure, little examined, and
    related to the hymns as the Atharva-Veda is related to the Ṛig-Veda.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The ritual rubrics are said to prescribe rites and actions with divine and
    authoritative origin, and to provide the framework in which hymns and spells formed
    a single act of divine worship.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The incantations are described as the older portion of Chaldaean sacred literature,
    going back to an age of animism before Sumerian spirits and demons had made way
    for Semitic Babylonian gods and priestly hierarchy.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The _zi_, or spirit, of heaven and earth is invoked to repel the attack of
    an evil ghost or to shower blessings on the worshipper.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The incantation world is described as one in which the _lil_, _utuk_, _galla_,
    and _ekimmu_ reign, leaving little room for the deities of the Semitic faith.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: In this incantation setting, Ea appears as a master of magic spells, and his
    son Asari shows goodness to mankind by instructing them how to remove sorceries
    and witcheries.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage states that the incantations do not all belong to the same age,
    and that Sumerian animism continued beside the higher Semitic faith after the
    Semitic occupation of Babylonia.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The state religion is described as tacitly recognizing older animism, preserving
    and modernizing old incantations, introducing state gods into them, subordinating
    spirits and ghosts to official deities, and replacing the medicine-man with the
    priest of the Semitic deity as reciter.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The author says the 'Book of Incantations' can almost be traced to its final
    form, but was not a book in the proper sense, and may never have combined all
    relevant collections.
  category: object
  evidence_refs:
  - ev:7
