canonical_text:
  quote: ''
  summary: The passage contrasts Eridu and Nippur cosmologies in Sayce's account of
    Babylonian religion. It describes a creator associated with Ea as a potter who
    forms mankind from clay and presents the world as arising from water. It distinguishes
    Ea's orderly deep from Tiamât's lawless chaos, associates Tiamât with monsters
    and underworld beings, and interprets later narratives, including the Tiamât-Merodach
    struggle and a Kutha legend of demonic war against a Babylonian king, as attempts
    to harmonize Eridu and Nippur traditions.
  language: English
  quote_policy: summarized
