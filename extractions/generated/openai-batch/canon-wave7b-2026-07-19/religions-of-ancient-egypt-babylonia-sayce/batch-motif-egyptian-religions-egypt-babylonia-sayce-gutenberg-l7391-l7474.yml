canonical_text:
  quote: "“O life of heaven, mayest thou conjure it; O life of earth, mayest thou
    conjure it!”"
  summary: The passage describes the Babylonian Zi as an older life-spirit or vital
    conception preserved in exorcistic formulae, names, and oaths, later reinterpreted
    under Semitic ideas as abstract life from a divine center. It then distinguishes
    the Sumerian lil or ghost from the Zi, describing the lil as a demon of the dead
    world, darkness, storm, night, and desolate places, and traces the development
    from a sexless Lil with a vampiric maid to Semitic Lilu and Lilît and Hebrew Lilith.
  language: English
  quote_policy: quoted
