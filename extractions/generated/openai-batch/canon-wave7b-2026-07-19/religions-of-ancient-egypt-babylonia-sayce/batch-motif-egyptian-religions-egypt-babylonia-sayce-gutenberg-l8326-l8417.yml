canonical_text:
  quote: The moon was the measurer of time; the first calendar was a lunar one
  summary: The passage describes Sin/Nannar as the Babylonian moon-god of Ur and Harran,
    links him as son or firstborn to En-lil of Nippur and En-lil's dark underworld,
    quotes a hymn that acclaims him as supreme in heaven and earth, and explains his
    Ur cult as that of a supreme Baal or guardian city god. It also presents the moon
    as a measure of time, source of calendrical knowledge, and symbol of law, order,
    and night-illumination, while noting that official theology did not rank him among
    the three chief gods of Babylonia.
  language: English
  quote_policy: quoted
