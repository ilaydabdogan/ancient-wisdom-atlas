canonical_text:
  quote: ''
  summary: The passage explains the Babylonian ziggurat as a temple tower intended
    to rise toward heaven and argues that it expressed older mountain-centered religious
    ideas. It connects Nippur’s Ê-kur, En-lil, Arallu, and temple names with a divine
    mountain or mountain-world, then contrasts this with Eridu’s sea-centered cosmology
    of Ea beneath the waves. The author concludes that Babylonian religion contains
    contradictory elements comparable to those in Egyptian religion.
  language: English
  quote_policy: summarized
