canonical_text:
  quote: The Book of the Dead was the guide of the dead man on his journey to the
    other world.
  summary: 'The passage describes Osirian afterlife beliefs: equality of the dead
    before Osiris, ushebti figures as substitute laborers, tomb provisions and representations
    understood through the ka, bodily resurrection, moral judgment, the Book of the
    Dead as guide through the other world, and the dead person''s negative confession
    before Osiris and associated deities.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Those assimilated to Osiris are described as equal to one another in the afterlife,
    without earthly distinctions of rank and station.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ushebti is described as a small clay or wooden figure representing a peasant;
    its double assists the dead with tasks, freeing the dead from toil in the fields
    of Alu.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tombs are described as containing food, drink, books, clothes, tools, weapons,
    imitations, and wall paintings for the dead person's needs in the other world.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the ka of an object could be furnished by the object
    itself, by an imitation, or by a correct depiction of the object.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The soles of the mummy's feet are described as removed for purity before the
    Hall of Judgment; gods are prayed to grant milk for bathing the feet, and the
    soles are placed within the mummy for the day of resurrection and for use of their
    ka.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The doctrine of bodily resurrection is linked with judgment of deeds committed
    by the body.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Admission to the kingdom of Osiris requires that the dead person be morally
    as well as ceremonially pure and have done good to people.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Book of the Dead is described as a guide for the dead person's journey,
    with chapters on rolls, coffins, or tomb walls prescribing prayers and incantations
    and describing enemies beyond the grave.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The dead person is described as passing through a limbo between earth and
    the kingdom of Osiris before reaching the Judgment Hall, also called the hall
    of the Twofold Truth.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: In the Judgment Hall, Mât receives the dead person, Osiris sits on a judgment
    throne, forty-two assessors of divine justice surround him, and Thoth with other
    Osirian deities stands nearby.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The dead person is called on to justify admission to the fields of Alu and
    prove a life of mercy, justice, and abstention from evil-doing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The negative confession includes denials of deceit, harm, oppression of the
