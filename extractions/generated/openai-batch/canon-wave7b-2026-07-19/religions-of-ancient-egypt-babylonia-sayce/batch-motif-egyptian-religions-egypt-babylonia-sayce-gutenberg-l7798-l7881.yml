canonical_text:
  quote: The Babylonian was judged in this life and not in the next
  summary: The passage contrasts Egyptian and Babylonian views of the afterlife, arguing
    that Egyptian religion emphasized preparation for survival beyond death and an
    elaborate otherworld, while Babylonian religion focused on this life, imagined
    Hades as dark and gloomy, and placed divine judgment primarily in earthly life.
    It further argues that Hebrew ideas of Sheol and earthly reward or punishment
    were derived from Babylonian civilization rather than from an inherent Semitic
    disposition.
  language: English
  quote_policy: quoted
