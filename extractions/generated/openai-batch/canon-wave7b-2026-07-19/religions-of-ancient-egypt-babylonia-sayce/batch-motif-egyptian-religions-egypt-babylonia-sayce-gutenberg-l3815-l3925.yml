canonical_text:
  quote: ''
  summary: The passage describes the decline of Ptaḥ’s Memphite supremacy, the limited
    but personally devout worship of the Nile as life-giving source of Egypt’s fertility,
    a hymn to the Nile, the later rise of Amon with Thebes, the status of Egyptian
    goddesses as autonomous divine powers, and the iconography and cross-cultural
    identifications of Nit of Sais.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the decline of the Memphite dynasties and the fall of the Old Empire,
    Ptaḥ’s commanding role in the Egyptian pantheon ended.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ptaḥ was identified with provincial nome gods and with Ḥâpi, the Nile; the
    similar sound of Ḥâpi and the bull Apis was presented as a possible aid to this
    identification.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that Egypt’s land, crops, and population depended on the
    Nile’s bounty; Nile failure brought starvation, and a full Nile brought contentment
    and plenty.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Nile cult is described as less institutionally prominent than expected,
    with few important temples and less-endowed priests than those of other gods.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage explains the Nile cult’s limited prominence by saying that earlier
    desert-dwelling inhabitants viewed the river as a source of swamps, jungles, wild
    beasts, and venomous serpents; by the time embanking made the waters beneficial,
    nome gods and sacred animals were firmly established.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Individual piety toward the Nile is represented by hymns engraved at Silsilis
    by Meneptah and Ramses III.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hymn addresses the Nile as manifesting over Egypt, giving life, issuing
    mysteriously from darkness, watering orchards, and giving drink to cattle and
    earth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The hymn credits the Nile with creating wheat and barley, sustaining temples,
    and causing anguish if its work ceases.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The hymn says the Nile answers prayers by inundation, receives first-fruits
    of corn, and is adored by all the gods.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The hymn describes a festal song for the Nile, the advance of the Nile’s bark,
    the uplifting of women in labour, the abundance of flocks, and nourishment for
    rich and poor.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The hymn warns that if the Nile refuses nourishment, the dwelling becomes
    silent and the country falls exhausted.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Thebes replaced Memphis in supremacy, and Amon, the god of Thebes, became
    paramount in the State religion under the Theban dynasties.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage states that women occupied an important position in Egyptian households,
    that purity of blood was traced through women, and that women could sit on the
    throne of the Pharaohs.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The divine family is said to correspond to the earthly family, and Egyptian
    goddesses are described as not always pale reflections of gods.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Nome-goddesses are described as standing on the same footing as nome-gods,
    with Nit of Sais and Hathor of Dendera compared in power to Ptaḥ of Memphis and
    Khnum of the Cataract.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: Egyptian goddesses are said to become heads of Enneads or members of Trinities,
    to be called both “father of fathers” and “mother of mothers,” and to take Tum’s
    place as creators of heaven and earth.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:17
  text: Nit rose to eminence with the Twenty-sixth Dynasty, and her city Sais, goddess,
    and sanctuary are described as old though formerly not historically prominent.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: Nit is represented as a woman with a shuttle emblem and with bow and arrow
    in her hands; her bow and arrow are compared to those of Istar of Assyria and
    Artemis of Greece.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:19
  text: The twin arrow is described as a symbol of Nit’s border nome, which was exposed
    to attacks from Libyan tribes.
  category: object
  evidence_refs:
  - ev:9
- id: obs:20
  text: The Greeks identified Nit with Athêna on account of a slight similarity in
