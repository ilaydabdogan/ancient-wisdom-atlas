  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: The same slate plaques that portray Horus as a hawk and Anubis as a jackal
    also represent the king as a bull.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: The king-as-bull image is described as a pictorial rendering of the phrase
