canonical_text:
  quote: ''
  summary: The passage argues from early Egyptian slate plaques, prehistoric pottery,
    and standards that early Egyptian gods were represented by animals, birds, and
    inanimate fetishes before later human-form depiction. It describes standards bearing
    hawks, jackals, ibis, a scorpion, a lion, a hippopotamus, a fish, a flowering
    branch, a sail, and other emblems, and connects these emblems with nomes, divine
    protection, conquest, and later symbolic writing. It also describes the Pharaoh
    represented as a bull trampling enemies and interprets the shift from fetish object
    to symbolic embodiment of a deity such as Horus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Early monuments from neolithic graves and first-dynasty remains are said to
    show animal worship as part of a larger system involving animal, bird, and lifeless-object
    forms.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: On a slate plaque from Kom el-Aḥmar, the Pharaoh enters a hall with bodies
    of decapitated foes while four standards are borne before him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The four standards on the Kom el-Aḥmar plaque bear two hawks of Horus, the
    jackal of Anubis, and an object possibly intended as a lock of hair.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the reverse of the Kom el-Aḥmar plaque, a hawk with a human hand brings
    prisoners of the north by grasping a rope attached to a conquered enemy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: On an early Abydos plaque, five standards are depicted with foot-elements
    shaped like hands holding ropes and with jackals of Anubis, the ibis of Thoth,
    the hawk of Horus, and the emblem of Min above them.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Another older Abydos plaque shows cities within battlemented walls, with animal
    gods above them; named protecting or conquering figures include two hawks of Horus,
    the scorpion of Selk, the lion of Sekhet, and the hawk of Horus.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Prehistoric grave pottery shows rude boats with prows ornamented by standards
    similar in shape to later standards borne before the Pharaoh.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
