canonical_text:
  quote: ''
  summary: The passage argues that Babylonian religion must be analyzed as a mixture
    of Sumerian and Semitic elements. It discusses native Babylonian etymologies of
    divine and religious names, especially Marduk/Merodach, and treats known Babylonian
    theology as an artificial system formed by assimilation and later scholarly interpretation.
    It also notes the scarcity of early materials and compares the hoped-for discovery
    of early Babylonian religious texts to the Egyptian Pyramid texts.
  language: English
  quote_policy: summarized
