canonical_text:
  quote: ''
  summary: 'Footnotes discuss Egyptian and comparative religious iconography and identifications:
    Hathor as cow-headed or cow-formed; Horus and Hathor equated with Baal and Ashtoreth
    for Mafket; Sirius identified with Isis and linked to the Nile’s rise; sacred
    barks of Bau/Istar and Isis-Hathor; ram, ibis, and Dad-column cult objects; and
    Osirian traditions of burial, western rulership, mourning, offerings, and passage
    to the plains of Alu.'
  language: English
  quote_policy: summarized
