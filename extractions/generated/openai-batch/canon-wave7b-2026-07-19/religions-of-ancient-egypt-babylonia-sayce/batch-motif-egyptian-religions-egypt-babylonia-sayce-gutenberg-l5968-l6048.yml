canonical_text:
  quote: ''
  summary: The passage recounts Hor-Beḥudet’s combat with Set, Set’s capture and later
    transformation into a serpent, the installation of the winged solar disc as an
    apotropaic emblem over sanctuaries, and an At-Nebes legend in which Shu fortifies
    the city, Seb attempts to take the serpent-goddess Ankhet, is burned by cobra
    fire, is healed by the lock of Ra, and the lock later becomes the crocodile deity
    Sebek.
  language: English
  quote_policy: summarized
