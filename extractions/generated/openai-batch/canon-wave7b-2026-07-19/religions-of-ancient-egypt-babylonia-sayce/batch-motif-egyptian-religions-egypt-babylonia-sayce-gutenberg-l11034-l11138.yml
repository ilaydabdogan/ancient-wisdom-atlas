  quote: O my god, my sins are many, my transgressions are great!
  summary: The passage first discusses the language, authority, and cultic use of
    Babylonian and Assyrian penitential psalms. It then quotes a penitential psalm
    addressed to any god, in which a speaker asks known and unknown gods and goddesses
    to be appeased, confesses unknowingly committed sins, describes deprivation, abandonment,
    and divine anger, prays with tears, and asks that transgressions be forgiven,
    carried away, or stripped off.
