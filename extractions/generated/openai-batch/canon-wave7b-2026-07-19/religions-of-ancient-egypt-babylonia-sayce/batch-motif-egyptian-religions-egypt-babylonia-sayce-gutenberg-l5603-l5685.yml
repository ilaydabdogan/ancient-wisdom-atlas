canonical_text:
  quote: The serpent that destroys also heals
  summary: The passage describes snake veneration around the Theban necropolis, especially
    the cobra-like goddess Mert-seger or Western Crest, a penitential healing inscription
    by Nefer-ab, comparisons with healing serpent traditions, later incorporation
    and replacement of the cult, and modern stories of household guardian snakes fed
    milk and able both to poison and to reveal a remedy.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Funerary workers living near the desert necropolis are described as especially
    exposed to snake-bite because they excavated sand and entered dark tomb chambers
    where snakes moved unseen.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The population of the Theban cemeteries left prayers and dedications to Mert-seger,
    who is represented as a cobra or other deadly serpent and titled the Western Crest.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Nefer-ab's inscription, he says he sinned against the goddess of the Crest,
    was punished with breathlessness, cried to her, and received relief when she came
    as a soft breeze and gave him breath.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author states that Nefer-ab believed the local snake goddess inflicted
    and then cured his illness, and explicitly compares the serpent's healing role
    to the worship of Asklepios and to a Roman plague-deliverance story involving
    a serpent.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A chapel was erected to Mert-seger in orthodox form, and some stelae identify
    her with Mut or Isis, though the passage says her worshippers continued to regard
    her simply as a serpent.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says a local Mohammedan saint near the ancient chapel is still
    believed to work healing miracles and has taken the place of the serpent goddess.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The serpent is described as underground, an old inhabitant and guardian of
    the soil, while harmless village-house snakes in modern Egypt are called household
    protectors and are given bowls of milk.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: In a Helwan story, a guardian snake poisons the household water jar after
    missing its mate, then after the mate returns, enters milk, gathers dust on its
    body, and fouls the water so the household knows to discard it.
  category: sequence
  evidence_refs:
  - ev:8
