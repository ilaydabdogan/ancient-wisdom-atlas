canonical_text:
  quote: ''
  summary: The passage discusses En-lil of Nippur as an early Sumerian lord of the
    ghost-world, describes feared ghosts and the sorcerer’s control of them through
    spells, distinguishes shamanism from priestly theism, and reports the Babylonian
    tradition in which Oannes or Ea rises from the Persian Gulf to teach arts, temple-founding,
    and civilization from abroad.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: En-lil or El-lil of Nippur is described as having very early worship and as
    bearing the Sumerian title “lord of the ghost-world,” while also being called
    a ghost and chief among ghosts.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the feared superhuman powers were regarded as ghosts,
    like dead men’s ghosts, and as denizens of the grave and underground world.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ghosts are said to emerge at night, terrify passers-by, and be harmful
    beings from whom sickness and insanity are derived.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that ghosts can be controlled by people who know magic
    words or mystic rites that the ghosts must obey.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sorcerer or medicine-man can interpose between a ghost and its victim
    and use spells to force a spirit to leave a sufferer’s body or enter an enemy’s
    body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: An organized body of sorcerers is said to imply an organized body of spirits,
    a system of control, classified spirits, and assigned functions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage distinguishes sorcerer and priest, saying their religious conceptions
    differ and that the sorcerer cannot be a priest, although a priest may also be
    a sorcerer.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The author argues that shamanism does not naturally develop into theism and
    says foreign influences and contact with other beliefs are needed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Berossos is cited as saying that the elements of culture and later organized
    religion were brought to Babylonia from abroad.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Oannes or Ea is said to have risen morning by morning from the waters of the
    Persian Gulf and instructed the races of the shore in the arts of life.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ea is said to have taught men to found the temple in which later gods would
    be adored, and his home is identified as the deep rather than Babylonia.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage interprets Babylonian civilization as originating on the seacoast,
