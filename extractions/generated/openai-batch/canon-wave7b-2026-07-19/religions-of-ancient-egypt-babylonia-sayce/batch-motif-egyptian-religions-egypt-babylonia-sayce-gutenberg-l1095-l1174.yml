    worship of one supreme deity, attributes the impulse of the reform to Asia, and
    states that the reform failed after his death. It then discusses Egyptian symbolism,
    animated divine images, Hathor’s soul vivifying her statue, animal-form representations
    of deities such as Thoth and Hathor, the doctrine of Pharaoh as incarnation of
    the sun-god, and the early division of Egypt into principalities with differing
    local cults.
