canonical_text:
  quote: ''
  summary: The passage describes the Theban triad of Amon, Mut, and Khonsu; Amon’s
    rise and absorption of other gods; and then summarizes the Osiris legend, including
    Osiris as civilizing pharaoh, his betrayal by Set, Isis’s search for his body,
    the Gebal and Nile-mouth variants, the first mummy, Horus’s hidden upbringing
    and vengeance, and alternate endings in Horus’s victory or Thoth’s arbitration.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mut is made the wife of Amon, and Khonsu, a local moon-god, becomes Amon’s
    son in the Theban trinity.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Khonsu’s acquired sonship changes his divine character: he becomes a sun-god
    with a solar disc and hawk’s head, while retaining an association with architectural
    plans.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mentu is said to have eventually superseded Khonsu and to have long before
    become Mentu-Ra.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Amon rises from an obscure provincial deity to the supreme god of Egypt, unites
    with the sun-god, and absorbs other Egyptian gods into himself.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says Egyptian theologians remained influenced by symbol and matter
    in their conception of divinity.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Osiris legend is described as assembled from myths and folk-tales of different
    ages and localities, with variant accounts placed side by side and harmonized.
  category: sequence
  evidence_refs:
