canonical_text:
  quote: ''
  summary: A sequence of footnotes discusses Babylonian divine names, cosmic places,
    spirits, gendered deity identifications, Tammuz, Nin-gis-zida, Ea iconography,
    and animal associations of deities. Notable mythic details include the sun-god
    rising from Du-azagga, called the place or mountain of destinies; Tammuz as a
    spirit, son of Ea or the Spirit of the Deep, spending half his annual life in
    the underworld or serving at the gates of heaven; the river Khubur as an ocean-stream
    on the road to the dead; and paired upright-post or pillar comparisons involving
    Tammuz, Nin-gis-zida, Jachin, and Boaz.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cited hymn says the sun-god rises from Du-azagga, described as the place
    of destinies, with an Assyrian rendering as mountain of destinies; Du-azagga is
    placed on the horizon of Ea’s domain, the deep.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Zi is described as life in the abstract and as the first divine name or quality
    bestowed on Merodach; Merodach is said to become a spirit of heaven before identification
    with gods of the official pantheon, and Ea’s divine essence is also called Zi
    or spirit.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: One note says cosmic deities are made the mothers and fathers of Anu in one
    text, while elsewhere they are identified with him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Examples are given in which Tispak is identified with Istar, Iskhara is treated
    as another name of Istar and as a male deity with a wife, and Nana is attested
    as both king Nana and lady Nana.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Anunna-ki is explained as lord of the earth or as spirits of the earth or
    lower world, distinguished from spirits of the air.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Tammuz is described as primarily a Zi or spirit worshipped at Eridu, known
    as the Son of the Spirit of the Deep, that is, Ea, and as the primitive sun-god
    of Eridu.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Tammuz is said to spend half of his annual life in the underworld, or in another
    view to be a fellow-warder with Nin-gis-zida at the gates of heaven.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Tammuz is said to pasture cattle in fields beyond the river Khubur, described
    as the ocean-stream encircling the earth on the road to the land of the dead.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Tammuz is also said to dwell in the cosmic temple of Ea at Eridu, between
    the Tigris and Euphrates.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: The author states that it is possible, though not proved, that Tammuz combines
    a sun-god and the vegetation of spring brought into existence by the young sun.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The author identifies Tammuz and Nin-gis-zida as Babylonian prototypes of
    the two pillars Jachin and Boaz, and explains Nin-gis-zida as lord of the upright
    post.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: A boundary-stone figure of an antelope ending in a fish is said to represent
    Ea, and a weapon terminating in a ram’s head is described as Ea’s symbol.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: Bau is referred to as the cow, and Nergal or Allamu is said to have been originally
    the gazelle.
  category: attribute
  evidence_refs:
  - ev:10
