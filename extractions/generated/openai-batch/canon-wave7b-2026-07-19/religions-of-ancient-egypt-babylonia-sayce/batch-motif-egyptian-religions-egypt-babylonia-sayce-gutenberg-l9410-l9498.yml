canonical_text:
  quote: ''
  summary: The passage is a secondary scholarly discussion of Babylonian religion
    as a mixture of Sumerian and Semitic elements. It contrasts an animal-associated
    earth-spirit with Semitic anthropomorphic gods, describes the persistence and
    partial assimilation of Sumerian names, practices, beliefs, and spirits, and explains
    how older spirits could be reclassified as angel-hosts, demons of Tiamât, messengers,
    elemental powers, male and female principles, or members of a divine hierarchy
    and family. It concludes with the divine messenger or sukkal, often a son-minister
    of a higher god.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An earth-spirit with a veiled face is described as incarnating himself in
    a swine and is contrasted with a solar hero and warrior god of the Semitic age.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Semitic gods are human in form and not beast-shaped.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Sumerian element in Babylonia is described as not extirpated, and witchcraft
    and necromancy are said to have flourished and to have been recognized, sanctioned,
    and controlled by the State religion.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Witchcraft and necromancy are said to have been practiced in Israel but forbidden
    by law and suppressed by the head of the State.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Babylonian local deities are described as mostly Sumerian in origin and as
    often retaining old Sumerian names despite Semitic coloring and dress.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Early beliefs, legends, folk-lore, and ritual from a non-Semitic past are
    described as entering the official creed only through partial assimilation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ancient spirits not transmuted into Semitic deities could be grouped as spirits
    of heaven and earth, turned into demons in the train of Tiamât, set apart as divine
    servants and messengers, or made elemental powers in the history of creation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Divine or superhuman beings of the Sumerian creed are described as being identified
    with gods and transformed into male and female principles connected with world
    government or creation.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Babylonian theosophy is said to require a divine hierarchy and the possibility
    of identifying one god with another.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Baal is described as a counterpart of the human father, implying a divine
    family and divine court with wife, children, slaves, and ministers.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: A divine messenger or angel is described as carrying orders from a higher
    god from heaven to earth and interpreting the god's will to men.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The sukkal or angel-minister is described as usually being a son of the god
    whose messages he conveys; Asari or Merodach is son and minister of Ea, and Nin-ip
    is son and minister of En-lil.
  category: relationship
  evidence_refs:
  - ev:7
