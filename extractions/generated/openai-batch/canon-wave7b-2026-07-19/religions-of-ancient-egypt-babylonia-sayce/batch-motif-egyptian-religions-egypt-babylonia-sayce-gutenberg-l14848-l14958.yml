canonical_text:
  quote: ''
  summary: 'Footnotes discuss Egyptian and Babylonian religious iconography and comparative
    details: Thoth as ape and ibis; a Babylonian god behind a scorpion-man; Khnum
    moulding Amon-hotep III and his Ka; vessel, grotto, and river-source imagery connected
    with Khnum, Ea, the Nile, and other rivers; Memphis and Eridu as comparable place-names;
    Ptah and Im-hotep in relation to rites and the dead; Nile-gods as personified
    waterways; Bast/Pakht and cat imagery; and a Dendera text describing a goddess
    uniting with her father Ra.'
  language: English
  quote_policy: summarized
