literal_observations:
- id: obs:1
  text: The passage states that Babylonians did not clearly distinguish supernatural
    beings from ghosts of the dead in nature and powers; a ghost might become an ekimmu
    or lil, and all were underworld denizens under En-lil.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spirit of Samuel is described as being called up from the dead, with the
    witch reporting Elohim rising from the earth in the form of an old man wearing
    a mantle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage compares the ghost of Ea-bani, when summoned, becoming an utukku,
    with the ghost of Samuel becoming one of the Elohim.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ghosts are described as dependent on food and drink; in the descent of Istar
    into Hades, ghosts flit like winged bats and consume dust and clay.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bread, dates, and water offered at tombs are presented as substitutes for
    the underworld food of dust and clay; without nourishment the ghost might suffer
    hunger or a second death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Babylonian ghost is compared to the Egyptian Ka as a semi-material counterpart
    of the body, needing food and drink and resembling the body if recalled to the
    upper world.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage lists offerings and grave goods associated with the dead, including
    poultry, fish, dates, grain, wine, water, toys, mirrors, jewellery, a staff, and
    a seal.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that older Sumerian animistic terms and ideas were modified
    by Semitic conceptions, with Bilu or Baal replacing En-lil as lord of mankind
    and the visible universe.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ea of Eridu is described as retaining his name and many ancient attributes
    and remaining the god of wisdom and culture, father of Aṡari.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Aṡari is said to have been identified with Merodach, the sun-god of Babylon,
    who became the supreme Baal of Babylonia.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Nergal of Cutha is described as becoming lord of Hades with Eris-kigal or
    Allat; a legend says he forced his way into the underworld and compelled the goddess
    to become his bride.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage says the conquest of Hades by gods of light implied conquest of
    death, and that Merodach especially is associated with healing and bringing people
    back from the world of the dead.
  category: sequence
  evidence_refs:
  - ev:9
