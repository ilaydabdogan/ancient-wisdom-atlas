  quote: ''
  summary: The passage presents a historical-theological account of Ea, Dam-kina,
    Aṡari, En-lil, and Merodach in Babylonian religion. It describes Ea as lord of
    the deep with a wife and son, Aṡari as a beneficent bringer of knowledge and healing,
    the transformation of Sumerian spirits or ghosts into Semitic gods, the spread
    of Eridu’s cultic ideas, the replacement of En-lil’s older rank by Merodach of
    Babylon, and the fading of Dam-kina and other female spirits under Semitic influence.
  language: English
