canonical_text:
  quote: ''
  summary: The passage contrasts Egyptian solar theology, Osirian religion, later
    Gnosticism, and Egyptian popular religion. It says solar theology absorbed Egyptian
    gods into Ra and encouraged esoteric knowledge; describes Gnosticism as deriving
    doctrines and figures from that solar theology; then introduces popular religion
    as distinct from official priestly religion, emphasizing fetish worship, sacred
    trees, animal offerings, and different meanings attached by peasants to state
    gods and cult practice.
  language: English
  quote_policy: summarized
