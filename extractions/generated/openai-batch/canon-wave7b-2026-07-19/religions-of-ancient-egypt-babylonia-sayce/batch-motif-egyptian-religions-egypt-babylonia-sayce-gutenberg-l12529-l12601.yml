canonical_text:
  quote: ''
  summary: The passage describes Babylonian festivals and holy days, including Gudea's
    temple consecration, the feast of Sakæa with temporary slave freedom and role
    reversal, Babylonian Sabbath terminology and seven-day quiet days, restrictions
    placed on the king and seers, new-moon observances, crisis rituals ordered by
    Esar-haddon, and penitential fasting imagery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Supplementary Babylonian festivals could occur at fixed times, commemorate
    local or national divinities, honor a deified new king, or be instituted for a
    sanctuary, restoration, or statue dedication.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Gudea's consecration of the temple of Inguriṡa at Lagas, penalties were
    remitted, presents were given, service was not exacted for seven days, slaves
    and masters were made equal, and evil was removed from the temple.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The feast of Sakæa at Babylon was said to last five days in July, with masters
    obeying their domestics and one domestic led around the house in a royal garment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage characterizes the Babylonian holy day as a holiday when the whole
    people rested from work and even slaves temporarily recovered freedom.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Babylonian Sabbath term Sabattu is presented as an old term associated
    by native lexicographers with rest, and another term, sulum, is described as a
    quiet day on which certain work was unlawful or unlucky.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The 7th, 14th, 19th, 21st, and 28th days of Second Elul are listed as days
    of quiet and rest; the 7th day is dedicated to Merodach and Zarpanit and carries
    prohibitions for the king and seer.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Babylonian Sabbath is described as recurring every seven days, with the
    19th day counted as forty-nine days from the beginning of the previous month;
    the passage also notes a difference from the Hebrew institution involving the
    new moon.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: In danger from northern enemies, Esar-haddon ordered prayers and ceremonies
    to the sun-god for one hundred days and nights and sought favorable visions for
    seers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Penitential psalms are quoted as using fasting and weeping imagery, replacing
    food, palm-wine, and water with tears and misery.
  category: speech
  evidence_refs:
  - ev:9
