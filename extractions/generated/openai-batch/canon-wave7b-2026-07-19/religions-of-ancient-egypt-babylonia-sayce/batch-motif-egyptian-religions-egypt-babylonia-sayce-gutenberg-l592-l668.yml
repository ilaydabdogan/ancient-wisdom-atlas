  quote: ''
  summary: The passage warns against treating theological metaphors as literal survivals
    of earlier practices. It uses examples from Pyramid texts about Sahu or Orion
    eating gods, Christian Eucharistic language, the phrase “O Lamb of God,” parables
    in Christianity and Buddhism, the name Dyaus, Babylonian anthropomorphic gods,
    and critiques of using modern folklore or so-called savagery to reconstruct ancient
    civilized religion.
  language: English
  quote_policy: summarized
