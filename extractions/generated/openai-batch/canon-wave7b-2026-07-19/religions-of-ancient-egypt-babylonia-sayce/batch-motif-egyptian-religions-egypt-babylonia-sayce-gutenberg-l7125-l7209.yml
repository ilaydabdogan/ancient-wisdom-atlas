canonical_text:
  quote: a composite culture produced a composite theology.
  summary: The passage describes Babylonian religion as an organized system shaped
    by theological schools and old sanctuaries at Nippur and Eridu. It recounts the
    continuing authority of older cult centers, the contested elevation of Merodach
    at Babylon, and the formation of Babylonian civilization through Sumerian and
    Semitic mixture, with later foreign groups largely absorbed into Babylonian culture.
  language: English
  quote_policy: quoted
