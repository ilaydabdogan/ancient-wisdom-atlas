  quote: ''
  summary: The passage discusses the proposed origin of Thoth’s apes as dwarf-like
    or ape-like sacred dancers, their later role as hymn-singing followers of Thoth,
    possible correspondence between four baboons and four Hermopolitan elemental gods,
    and several Upper Egyptian and First Cataract deities, including Nekheb, Sati/Suti,
    Set/Sut, and Ânuqet. It also notes comparative religious dance examples and linguistic
    or visual links with Asiatic and Babylonian materials.
