canonical_text:
  quote: ''
  summary: The passage discusses Anunit of Sippara as a Sumerian earth-spirit transformed
    into a Semitic goddess, her decline and identification with Istar, the tendency
    described by the author for Semitic religion to reduce or absorb goddesses into
    male deities, Istar's male and warlike attributes, and Assur as a wifeless Assyrian
    supreme god whose royal and military prerogatives were later challenged by Babylonian
    traditions involving Istar and Bel-Merodach.
  language: English
  quote_policy: summarized
