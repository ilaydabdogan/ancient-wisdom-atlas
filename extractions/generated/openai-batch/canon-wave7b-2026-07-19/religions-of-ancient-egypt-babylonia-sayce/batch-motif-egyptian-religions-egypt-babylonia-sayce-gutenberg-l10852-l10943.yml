canonical_text:
  quote: ''
  summary: The passage describes Babylonian ritual use of hymns, including a New Year
    hymn to the ark of Bel-Merodach, a Nisan rite involving Euphrates water and recitation
    before Bel, and prayers for Babylon. It then explains that many hymns functioned
    as incantations whose exact words and pronunciation carried sacred authority.
    The passage also summarizes hymns to the sun-god as judge, illuminator, purifier,
    and protector, including a prayer to purify and release the king from evil and
    a ban.
  language: English
  quote_policy: summarized
