  quote: ''
  summary: The passage describes Babylonian temple architecture and furnishings, including
    the Du-azagga or Holy Hill, mercy-seat, altars, courts, ziggurat, basin called
    the sea, ablution, priestly mediation, and the inner shrine. It then compares
    Babylonian temple forms and objects with the temple of Solomon, especially altars,
    mercy-seat, bronze sea with twelve oxen, and paired entrance pillars, linking
    the paired pillars to myths of Adapa and heavenly gate guardians Tammuz and Nin-gis-zida.
