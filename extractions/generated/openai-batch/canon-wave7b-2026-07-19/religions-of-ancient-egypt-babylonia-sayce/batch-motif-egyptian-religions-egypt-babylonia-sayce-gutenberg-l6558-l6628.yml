  summary: The passage presents an authorial account of Egyptian theology in which
    an absolute immaterial god is made comprehensible through incarnation, divine
    names, and emanated forms. It then identifies Mât as the personified moral law
    governing gods and humans, describes postmortem judgment by truth in Osiris' judgment
    hall, and characterizes the Osirian creed as an ethical religion centered on Un-nefer/Osiris,
    a good being who dies on behalf of followers and rules a blessed otherworld.
