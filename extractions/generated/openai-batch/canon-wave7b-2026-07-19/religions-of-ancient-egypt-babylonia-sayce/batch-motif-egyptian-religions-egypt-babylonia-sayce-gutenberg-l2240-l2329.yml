  limitations: This is an internal Egyptian pattern described by the passage, not
    a cross-cultural comparison.
- id: claim:5
  claim: Ra is presented as sharing and absorbing the functions of local Egyptian
    sun-gods, allowing them to be identified with him.
  claim_level: same_function
  target: various local Egyptian sun-gods identified with Ra
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
