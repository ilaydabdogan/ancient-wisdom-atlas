candidate_motifs:
- id: motif:1
  label: deity-name borrowing through intercultural contact
  taxonomy_refs: []
  basis: The passage explicitly frames Khar or Horus and Anupu or Anubis as likely
    Egyptian divine names borrowed in Babylonian contexts during a period of Egypt-Babylonia
    intercourse.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is the author's historical interpretation, not a mythic narrative
    within the passage.
- id: motif:2
  label: warrior iron sun-god parallel
  taxonomy_refs: []
  basis: Horus and Nin-ip are compared as warrior-gods, both associated with iron;
    Nin-ip is additionally linked to the southern sun and eagle emblem.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage supports functional comparison but does not claim identity
    or direct borrowing for Nin-ip.
- id: motif:3
  label: royal north-south duality through animal emblems
  taxonomy_refs:
  - duality
  - royal_legitimacy
  - serpent
  basis: 'Royal titulary uses paired territorial emblems: Uazit''s serpent for the
    north and Nekheb''s vulture for the south.'
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The evidence is symbolic and titulary rather than a plot episode.
- id: motif:4
  label: divine hawk and royal conquest legitimation
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage links Horus, the divine hawk, and the Horus title to Upper Egyptian
    kings who became masters of the northern kingdom.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage is historical-synthetic and reports Edfu legends alongside
    historical interpretation.
- id: motif:5
  label: local goddess absorbed into mother-goddess identity
  taxonomy_refs:
  - mother_goddess
  basis: Nekheb is said to appear at Thebes as Mut, 'the mother,' and later worshippers
    of Mut are described as unaware of Nekheb behind Mut's mask.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage emphasizes name, cult, and identity rather than maternal mythic
    action.
- id: motif:6
  label: sun-god syncretism into a common deity
  taxonomy_refs: []
  basis: Ra is described as becoming an independent all-forms sun-god with whom local
    sun-gods could be identified and lose their individuality.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is a theological-development pattern rather than a narrative motif.
- id: motif:7
  label: creation by generation or emanation from an original deity
  taxonomy_refs:
  - sacred_birth
  - divine_parent_child
  basis: The passage states that Heliopolis developed creation by generation or emanation
    and that the Ennead's four divine pairs descended by successive acts of generation
    from Tum.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage summarizes doctrine; it does not narrate individual birth
    episodes.
comparison_claims:
- id: claim:1
  claim: The passage supports a cautious historical-contact claim that Babylonian
    Khar/Khur and Anupu/Anubis reflect Egyptian divine names entering Babylonian contexts.
  claim_level: historical_contact
  target: Babylonian attestations of Khar/Khur and Anupu/Anubis in relation to Egyptian
    Horus and Anubis
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage uses probable language and provides no independent inscriptional
    details beyond the cited summary.
- id: claim:2
  claim: Horus and Nin-ip are presented as functionally comparable through warrior
    status and iron associations.
  claim_level: same_function
  target: Babylonian sun-god Nin-ip
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to shared functions and attributes; the passage
    does not argue that Nin-ip derives from Horus.
- id: claim:3
  claim: The passage makes a visual-comparative claim between the anthropomorphic
    Heliopolitan sun-god and Babylonian gods, contrasted with hawk-form Horus imagery.
  claim_level: visual_similarity
  target: Babylonian anthropomorphic divine representation compared with the Heliopolitan
    sun-god
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The visual comparison is broad and concerns representation form only.
- id: claim:4
  claim: The Heliopolitan Ennead is presented as a model for similar groups of nine
    at other Egyptian sanctuaries.
  claim_level: same_motif
  target: Egyptian sanctuary Enneads modeled on Heliopolis
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
