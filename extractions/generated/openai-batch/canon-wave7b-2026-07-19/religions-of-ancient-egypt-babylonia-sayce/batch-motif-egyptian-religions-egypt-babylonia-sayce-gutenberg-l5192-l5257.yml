canonical_text:
  quote: '"the passage of the sun-god along the heavenly river Ur-nes during the twelve
    hours of the night"'
  summary: The passage describes Egyptian religious books derived from or related
    to the Book of the Dead, including the Book of Respirations and the Book Am Duat.
    It presents the Book of Respirations as a Thoth-ascribed text made by Isis for
    Osiris to restore life and breath, and it describes the Book Am Duat as an illustrated
    underworld or otherworld ritual centered on the sun-god's night journey by bark
    through gated regions guarded by serpents and monsters.
  language: English
  quote_policy: quoted
