canonical_text:
  quote: ''
  summary: 'The passage summarizes Sayce''s account of Babylonian cosmology as expressed
    in the Epic of Creation, emphasizing primal water, chaos and darkness/light conflict,
    divine generation, creation by formation or speech, and later philosophical abstraction.
    It then contrasts the function of sacred books in Egypt and Babylonia: Egyptian
    Books of the Dead guide the soul in the other world, while Babylonian sacred books
    guide life in the present world.'
  language: English
  quote_policy: summarized
