canonical_text:
  quote: ''
  summary: 'The passage characterizes Egyptian religion as preserving inherited beliefs
    without harmonizing them into a philosophical system. It links this tendency to
    modern Egyptian habits of leaving old structures unrepaired while placing new
    ones beside them, and to environmental conditions in the Nile valley: open-air
    life, clear light, visual perception, irrigation labor, and regular agricultural
    toil. It concludes that ancient Egyptians favored visible symbols over abstract
    thought, describing the soul as a human-headed bird ascending to heaven and the
    future world as a duplicate of visible Egypt.'
  language: English
  quote_policy: summarized
