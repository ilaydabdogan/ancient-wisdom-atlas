canonical_text:
  quote: ''
  summary: The passage compares Babylonian and Hebrew/Israelite ritual, especially
    fasts, feasts, and calendar customs, then introduces a lecture on Babylonian astro-theology.
    It reviews older theories of Sabaism, rejects the claim that star worship explains
    all primitive religion, but argues that worship of heavenly bodies was important
    in ancient Babylonia. It describes priestly astronomy, the temple observatory,
    the identification of gods with heavenly bodies, the eight-rayed star as an ideograph
    for a god, the possible localization of spirits in stars, several deity-star associations,
    and a final note that zodiac signs were once monster allies of the dragon of chaos.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says fast and feast alternated in Babylonia as in Israel, and
    that Babylonian ritual resembled Hebrew ritual while differing from it through
    polytheism versus monotheism.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says some Levitical customs and the Pentateuchal calendar are
    explained by or look back to Babylonia, and it identifies Khammurabi or Ammurapi
    with the Genesis figure Amraphel, contemporary with Abram.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage reports that earlier writers treated Sabaism as the earliest form
    of idolatry and used the Book of Job, Babylonian seal-cylinders, zodiacal readings
    of Jacob's sons, and astronomical allegories of Christianity in support.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says Sabaism later fell into disrepute because anthropology showed
    primitive religion was not confined to star worship and that the cult of heavenly
    bodies was not the source of all polytheism.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage asserts that worship of heavenly bodies played an important part
    in ancient Babylonian religion and in countries influenced by Babylonian culture.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage describes Babylonian astro-theology as an artificial creation
    combining religion with astronomy in schools under priestly control, with observatories
    near schools inside temple precincts and calendar observations receiving religious
    character.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says the identification of official Babylonian gods with heavenly
    bodies occurred after the official religion had taken shape and a map of the heavens
