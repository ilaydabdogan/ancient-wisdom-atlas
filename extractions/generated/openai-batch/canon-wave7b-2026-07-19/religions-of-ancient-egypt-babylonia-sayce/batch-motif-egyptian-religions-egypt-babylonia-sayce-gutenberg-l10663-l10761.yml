canonical_text:
  quote: ''
  summary: The passage describes how later Babylonian theologians and Semitic translators
    reinterpreted older Sumerian incantation spirits as official pantheon deities.
    It presents Eridu theology around Ea as a culture-god, creator, and wisdom figure,
    notes animal forms of Ea and Asari, describes healing waters and associated figures
    such as Nin-akha-kudda and Bau, and contrasts Nippur underworld terrors with Eridu
    storm and water demons. It then gives hymnic descriptions of seven evil demons,
    their hostility to Ea, their destructive storm nature, their later unification
    as the divine seven, and the fire-god’s mission to drive them away and reveal
    their origin.
  language: English
  quote_policy: summarized
