canonical_text:
  quote: ''
  summary: Sayce presents a Ptolemaic-age form of the Edfu legend in which Ra-Harmakhis
    travels by bark, Hor-Beḥudet takes the form of a great winged solar disc, defeats
    conspiring enemies, and establishes names for places, waters, and cult objects.
    The enemies later enter the water and change into crocodiles and hippopotamuses;
    Hor-Beḥudet and his blacksmith followers attack them with iron lances and chains.
    Hor-Beḥudet is then associated with a winged solar disc above the bark and with
    Nekheb and Uazit in serpent form, while the narrative continues through a sequence
    of battles that brings Egypt under Horus's sway.
  language: English
  quote_policy: summarized
