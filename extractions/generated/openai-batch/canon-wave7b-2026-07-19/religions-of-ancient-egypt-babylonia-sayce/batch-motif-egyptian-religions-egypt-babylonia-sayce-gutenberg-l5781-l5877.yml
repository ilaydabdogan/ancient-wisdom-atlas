canonical_text:
  quote: "“So the name of the great god was taken from him...”"
  summary: Isis fashions a serpent from Ra’s saliva and dust, places it in Ra’s path,
    and the serpent bites him. Ra suffers from the poison and calls the gods. Isis
    offers healing if Ra tells her his true name. After Ra’s initial self-description
    fails to stop the poison, he permits Isis to search within him and receive the
    hidden name. Isis extracts the name, invokes Horus, commands the poison to leave,
    and the appended note presents the legend as a charm against snake poison. The
    author comments that belief in the power of knowing a name is widespread in folklore.
  language: English
  quote_policy: quoted
