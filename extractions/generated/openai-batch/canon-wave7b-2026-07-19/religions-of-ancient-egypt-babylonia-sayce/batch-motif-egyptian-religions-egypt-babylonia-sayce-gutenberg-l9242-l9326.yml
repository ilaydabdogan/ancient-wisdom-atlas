canonical_text:
  quote: ''
  summary: The passage argues that Semitic domination in Babylonia coincided with
    royal apotheosis, contrasts this with older Sumerian religion, and describes animal
    or hybrid forms associated with Babylonian deities and guardians. It also discusses
    sacred bulls, cherubim, the tree of life or knowledge, Ea’s house at the earth’s
    center, and fertility waters flowing as the Tigris and Euphrates.
  language: English
  quote_policy: summarized
