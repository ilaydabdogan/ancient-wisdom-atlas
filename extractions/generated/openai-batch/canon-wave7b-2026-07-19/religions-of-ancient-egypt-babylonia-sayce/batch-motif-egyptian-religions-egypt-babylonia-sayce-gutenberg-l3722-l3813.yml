- id: obs:8
  text: The author notes possible connections between Khnum’s cult and Asia through
    Sati’s title “the Asiatic,” the Babylonian form of her name, Ânuqet’s Asian origin,
    and a road from the Red Sea to Assuan and El-Kab.
  category: relationship
  evidence_refs:
