- id: motif:3
  label: water and inundation produce the clay of creation
  taxonomy_refs: []
  basis: The passage explicitly links water, inundated soil, moist clay, and potter
    craft, while both Khnum and Ea are water-associated potter gods.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: This is an explanatory association in the author’s prose rather than a
    narrated mythic episode.
- id: motif:4
  label: creator associated with a cosmic egg
  taxonomy_refs:
  - cosmic_egg
  basis: Porphyry is cited as saying Ptaḥ sprang from an egg from the mouth of Kneph.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The egg-origin is attributed to Porphyry, and the author immediately offers
    a different probable explanation of Ptaḥ’s name.
- id: motif:5
  label: opening the mouth to restore breath, soul, and life-capacity
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: The mouth-opening rite is described as conferring on a mummy or statue the
    capability of receiving breath of life and harboring the double or soul.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage describes a funerary ritual and etymological interpretation,
    not a complete resurrection story.
- id: motif:6
  label: apotropaic dwarf figures guarding vessels and tombs
  taxonomy_refs: []
  basis: The Patæki figures are said to have been carved on Phœnician vessel prows
