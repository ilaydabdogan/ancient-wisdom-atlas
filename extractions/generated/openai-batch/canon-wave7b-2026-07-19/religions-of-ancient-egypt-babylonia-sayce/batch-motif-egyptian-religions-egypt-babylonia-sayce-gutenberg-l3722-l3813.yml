    mythic narrative.
- id: motif:2
  label: divine potter creates gods, humans, and the world from clay
  taxonomy_refs: []
  basis: Khnum, Ea, and Ptaḥ are all described as potter-creators or molders, and
    Ptaḥ is pictured modeling man from a lump of clay.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  confidence: high
  cautions: No available taxonomy reference exactly matches creation by clay potter;
