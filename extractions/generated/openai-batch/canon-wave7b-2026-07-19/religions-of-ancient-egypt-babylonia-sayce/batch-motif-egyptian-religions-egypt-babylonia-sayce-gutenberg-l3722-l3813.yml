canonical_text:
  quote: ''
  summary: 'The passage surveys Egyptian and comparative deities and symbols: Sati/Heket
    as a frog and resurrection emblem, Khnum as a ram-headed potter-creator and water
    god, parallels with Babylonian Ea, possible Asiatic connections for Sati and Ânuqet,
    Ptaḥ as Memphite potter-creator, mummy, and underworld god, the mouth-opening
    rite and egg-origin report, dwarf creator/helper or apotropaic figures compared
    with Babylonian Nugidda, and later Memphite syncretism involving Ptaḥ, Sokaris,
    Osiris, Tanen, Ra, Nofer-Tum, Im-hotep, and Sekhet.'
  language: English
  quote_policy: summarized
