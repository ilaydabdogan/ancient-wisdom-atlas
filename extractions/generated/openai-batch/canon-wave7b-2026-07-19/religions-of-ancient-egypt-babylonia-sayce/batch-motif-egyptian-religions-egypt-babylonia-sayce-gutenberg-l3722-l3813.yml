- id: obs:9
  text: Ptaḥ, the creator worshipped at Memphis, is described as a potter; Porphyry
    is cited as saying that he sprang from an egg from the mouth of Kneph.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The name Ptaḥ is associated by the author with the ceremony of opening the
    mouth of a mummy or statue to confer the capacity to receive breath of life and
    harbor the double or soul.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Ptaḥ is represented as a mummy and described as an underworld god with both
    tombs and temples, later fused with Sokaris and perhaps Osiris.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:12
  text: At Philæ, Ptaḥ is pictured as about to model man from a lump of clay, and
