canonical_text:
  quote: ''
  summary: Sayce describes Thoth of Hermopolis as a lunar and culture-god associated
    with time, writing, books, magic formulae, and creation by spoken word. The passage
    compares Thoth with Babylonian Ea and Asari/Merodach, discusses Nu and the Hermopolitan
    Ennead/Ogdoad of abstract paired deities, and describes traditions of the eight
    gods, four cynocephalous ape-followers, and the five gods worshipped at Eshmunên.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nu is said to have survived especially in the theological school of Hermopolis,
    whose god was Thoth, the Egyptian Deḥuti.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Thoth is described as originally seeming to be the moon, male in sex as in
    Babylonia.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A legend says Thoth gained the five intercalatory days of the Egyptian year
    by playing dice with the moon, and he was sometimes identified with Aah and Khonsu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The first month belonged to Thoth; he is called the measurer of time and inventor
    of arithmetic, geometry, music, astronomy, architecture, and letters.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: Thoth knew magic formulae able to bind gods, served as minister of Pharaoh
    Thamos, introduced writing and literature into Egypt, and remained patron of books
    and education.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: The passage says Deḥuti means the god attached to the ibis and raises questions
    about whether Thoth's true name was Nu or whether Thoth was a compound of moon-god
    and sun-god.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Ea is described as the Babylonian culture-god corresponding to Thoth, as 'the
    deep,' and as having an early name 'the god Nun.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: Asari, son of Ea, is said to instruct mankind in Ea's wisdom and laws; Thoth
    is said to act as minister of Osiris, adjudge Osiris's cause against Seb, and
    write the first books from which people derived laws.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: In the Hermopolitan cosmogony, Thoth creates the world, the universe, and
    the directing gods through the word of his mouth, later formulated as the sound
    of his voice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Hermopolitan doctrine of creation by word is said to have spread to other
    parts of Egypt and under the Theban dynasties tended to displace or absorb the
    older Heliopolitan doctrine of creation by generation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: 'The passage states that Babylonia also knew a doctrine of creative divine
    word: Asari/Merodach''s word creates and destroys, like Yahweh''s word in the
    Old Testament.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:12
  text: Nu is identified as the second member of the Hermopolitan Ennead, which Maspero
    is said to have shown was modelled on the Ennead of Heliopolis.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:13
  text: The Hermopolitan divinities are described as abstractions, including Nu with
    feminine Nut and derived pairs Ḥeḥui/Ḥeḥet, Kek/Keket, and Nini/Ninit, glossed
    as eternity, darkness, and inertia.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:14
  text: The four pairs of abstract deities constituted 'the eight' gods, after whom
    Hermopolis received one of its names, and they were addressed as 'the god eight'
    like 'the god seven' in Babylonia.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: Maspero is reported to see the eight gods as a philosophical development of
    four cynocephalous apes who accompanied Thoth and saluted the first streak of
    dawn, but the author says this development is difficult to follow.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: From an early epoch, 'the five gods'—Thoth and his four ape-followers, whose
    likeness he sometimes adopted—were worshipped at Eshmunên; its temple and high
    priest bore names connected with the Five.
  category: setting
  evidence_refs:
  - ev:6
