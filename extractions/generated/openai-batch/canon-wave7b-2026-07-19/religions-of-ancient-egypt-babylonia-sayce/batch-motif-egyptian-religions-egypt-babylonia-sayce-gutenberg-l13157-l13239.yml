    substrate, argues for similarities and historical connections between Babylonian
    and Hebrew ritual, temple forms, priesthood, prophecy, cosmology, Deluge tradition,
    and penitential psalms, and contrasts Babylonian polytheism with Israelite monotheism.
    It also notes motifs of primordial watery chaos, Tiamât as dragon of chaos, a
    temple sea, and a shadowy afterlife realm.
