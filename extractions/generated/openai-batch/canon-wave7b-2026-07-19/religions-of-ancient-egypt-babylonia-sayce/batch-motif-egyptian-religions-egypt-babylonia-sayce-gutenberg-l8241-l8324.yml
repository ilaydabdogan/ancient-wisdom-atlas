  quote: ''
  summary: The passage describes Lugal-zaggi-ṡi’s political elevation of Erech, the
    association of Anu and Bel as a northern Babylonian divine dyad, the addition
    of Ea after the union of northern and southern Babylonia to form the triad of
    Anu, Bel, and Ea, and the later theological interpretation of that triad in relation
    to cosmic domains, divine succession, and the Egyptian Ennead.
