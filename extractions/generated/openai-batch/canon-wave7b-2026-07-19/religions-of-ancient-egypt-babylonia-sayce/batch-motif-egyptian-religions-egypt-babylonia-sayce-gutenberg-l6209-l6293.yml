canonical_text:
  quote: ''
  summary: The passage quotes a hymn in which Osiris/Horus is welcomed by the gods,
    recognized as a divine child and heir, crowned, and given rule and judgment over
    the world. Sayce then comments on Osiris being identified with Horus, the growth
    of an Egyptian trinity, and the transmission of resurrection and judgment doctrines
    to Alexandrian philosophical schools. The passage also argues for continuity between
    Egyptian and primitive Babylonian religion, discusses earlier Egyptian astro-theology,
    and summarizes Pyramid Text imagery of Saḥu/Orion as a celestial hunter whose
    star-companions hunt, butcher, cook, and consume gods.
  language: English
  quote_policy: summarized
