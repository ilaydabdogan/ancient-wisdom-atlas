canonical_text:
  quote: ''
  summary: The passage presents a negative confession of sins, a plea by the deceased
    before assessors and Osiris, the weighing of the deceased's heart against truth
    under Thoth and Anubis, a favorable verdict granting justified afterlife status,
    and Sayce's commentary that the Osirian doctrine privileges mercy, righteousness,
    and good deeds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker repeatedly denies committing murder, treachery, ritual theft,
    sexual impurity, false weighing, deprivation of milk or water, improper extinguishing
    of flame, and offenses against temples, gods, the dead, animals, and neighbors.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The negative confession ends with a threefold declaration of purity.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the negative confession, the deceased turns to forty-two assessors and
    pleads innocence of the specific sins assigned to them for judgment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The deceased addresses Osiris and the gods in the Hall of the Twofold Truth,
    asking to be delivered from Typhon in the hour of supreme judgment.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The final plea asserts that the deceased has not sinned, lied, done evil,
    committed crime, or borne false witness, and says he lives on truth and feeds
    on truth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'The plea lists beneficent acts: giving bread to the hungry, water to the
    thirsty, clothing to the naked, a boat to the shipwrecked, sacrifices to the gods,
    and sepulchral meals to the dead.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The heart of the deceased is weighed in a balance against the image of truth;
    Thoth places the heart and records the result, while Anubis superintends the weighing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the verdict is favorable, Thoth reports to Osiris that the heart has
    been found true and without earthly impurity.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The favorable verdict restores the heart, eyes, and material cover of the
    heart to the deceased and assigns soul, heart, body, offerings, and necropolis
    status to appropriate afterlife places or guardians.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The commentary states that the Osirian judgment doctrine requires mercy and
    righteousness rather than orthodoxy of belief, and places duty toward fellow humans
    before duty toward the gods.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: The commentary states that later tomb records often mention good deeds, including
    feeding the hungry, clothing the naked, just dealing, and Baba's distribution
    of corn during a famine.
  category: other
  evidence_refs:
  - ev:7
