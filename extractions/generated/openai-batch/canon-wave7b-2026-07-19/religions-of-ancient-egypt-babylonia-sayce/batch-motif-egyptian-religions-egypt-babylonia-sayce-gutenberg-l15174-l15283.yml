canonical_text:
  quote: ''
  summary: 'The passage gives footnote material on Egyptian religious objects and
    traditions: inscribed and uninscribed scarabs, scarabs as amulets, green porcelain
    beetle amulets in prehistoric graves, a comparison involving Nu-Urru and Ur-Ninnu
    in the Babylonian Epic of Gilgames, the ben-nut tree at On, the bennu as the soul
    of Osiris, an image containing a cow, solar disc, crowned cobra, tree branch,
    and vases, popular serpent worship, a shrine or chapel of the living serpent,
    a monstrous serpent associated with destructive fire from its eyes, and notes
    on Horus, Osiris, Edfu, Mesen, Beḥudet, and the winged solar disc.'
