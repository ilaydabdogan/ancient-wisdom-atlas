canonical_text:
  quote: ''
  summary: The passage is a set of scholarly notes on Egyptian and Babylonian religion.
    It discusses Osiris's name and astral association, Nabu as interpreter of Merodach,
    astral identifications of Isis and Horus, the negative confession in Book of the
    Dead chapter 125, a deceased person's ethical self-vindication on a stela, the
    long preservation and recurrence of Egyptian sacred texts including serpent invocations,
    the possible ritual compilation of the Book of the Dead, sacred writings of Horus,
    and Ra's purification in the fields of Alu.
  language: English
  quote_policy: summarized
