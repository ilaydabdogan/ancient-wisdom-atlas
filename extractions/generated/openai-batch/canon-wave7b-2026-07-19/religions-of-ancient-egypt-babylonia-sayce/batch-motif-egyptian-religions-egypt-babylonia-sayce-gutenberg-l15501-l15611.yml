canonical_text:
  quote: ''
  summary: 'A series of scholarly footnotes discusses Babylonian and related West
    Semitic religious terms and motifs: Zi and Lil/Lilla as spirit categories associated
    with Eridu and Nippur, En-lil as lord of ghosts and of the earth/underworld, tablets
    of destiny as divinatory objects, Bau/Baau as a heifer or holy cow figure connected
    with Phoenician cosmogony, an oracular tree at Eridu in the central place of the
    earth, and comparisons between Babylonian and Hebrew antediluvian lists.'
  language: English
  quote_policy: summarized
