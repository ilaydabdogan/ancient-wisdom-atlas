candidate_motifs:
- id: motif:1
  label: Astralized divine plurality
  taxonomy_refs: []
  basis: The passage repeatedly links divine groupings with planets, sun, moon, evening
    star, moon-god figures, and star worship.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:7
  confidence: medium
  cautions: The Igigi planetary interpretation is explicitly speculative, and the
    passage is a scholarly note rather than a mythic narrative.
- id: motif:2
  label: Underworld spirit rulership
  taxonomy_refs: []
  basis: The Nippur lord of the ghost-world is described as a spirit ruling spirits
    in an underground world.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: No journey, judgment, or afterlife narrative is described in this passage.
- id: motif:3
  label: Divine triad grounded in sacred geography
  taxonomy_refs: []
  basis: The Babylonian triad of Ana, En-lil, and Ea is explained through chief sanctuaries
    and centres of religious influence rather than purely astronomical origin.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is an author's historical-theological explanation, not a narrative
    episode.
- id: motif:4
  label: Divine daughter-or-wife attachment
  taxonomy_refs:
  - divine_parent_child
  - sacred_marriage
  basis: The sun-goddess is described as daughter or wife, and Gubára/Sala are treated
    through consort relationships to Meri and Hadad.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  confidence: medium
  cautions: The “wife” language indicates divine consort status, but the passage does
    not describe a marriage ritual; the sacred_marriage taxonomy ref is therefore
    provisional.
- id: motif:5
  label: Syncretic absorption and replacement of deities
  taxonomy_refs: []
  basis: Hadad absorbs Meri, Gubára is identified with Sala and Ashêrah/Asirtum, and
    Merodach supplants Ea in relation to the Babylon temple tradition.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: The passage frames these as historical religious developments rather than
    mythic transformations.
- id: motif:6
  label: Mountain lord paired with lady of plain
  taxonomy_refs:
  - duality
  basis: Hadad is called lord of the mountain while Asratum/Ashêrah is called lady
    of the plain.
  evidence_refs:
  - ev:6
  confidence: low
  cautions: The paired landscape titles are explicit, but a broader duality motif
    is not developed in the passage.
comparison_claims:
- id: claim:1
  claim: The passage reports Jensen's proposed connection between NUN-GAL/Rîbu and
    Hebrew Rahab.
  claim_level: linguistic_similarity
  target: Hebrew Rahab
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: low
  limitations: The connection is only reported as Jensen's proposal; the passage provides
    no detailed argument.
- id: claim:2
  claim: The Babylonian triad is presented as a product of fusion between Sumerian
    and Semitic elements in official Babylonian religion.
  claim_level: historical_contact
  target: Sumerian and Semitic religious elements in Babylonian religion
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim reflects the author's scholarly reconstruction from the cited
    passage.
- id: claim:3
  claim: The South Arabian triad of Athtar, the moon-god, and the angel-messenger
    is attributed to Babylonian cultural influence, supported by Babylonian divine
    names in South Arabian inscriptions.
  claim_level: historical_contact
  target: South Arabian inscriptions and Babylonian culture
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage summarizes an argument and cites inscriptional names, but
    the inscriptions themselves are not reproduced here.
- id: claim:4
  claim: Hadad's absorption of Meri and the identification of Gubára with Sala and
    Ashêrah/Asirtum are presented as cross-cultural divine identifications.
  claim_level: historical_contact
  target: Sumerian Meri/Mermer, Amorite Hadad, and Canaanite Ashêrah/Babylonian Asirtum
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states the identifications within secondary scholarship;
    it does not provide the full primary evidence.
- id: claim:5
  claim: The Western Semitic Baal is compared functionally with moon-god worship,
    especially in relation to Ur and Harran outside Babylonia proper.
  claim_level: same_function
  target: Western Semitic Baal cult and moon-god cult at Ur and Harran
  evidence_refs:
  - ev:4
  counter_evidence_refs:
  - ev:3
  confidence: low
  limitations: The same passage also describes Baal in historical Semitic religion
    as a sky-god, so the comparison depends on the author's distinction between historical
    and Western Semitic origins.
