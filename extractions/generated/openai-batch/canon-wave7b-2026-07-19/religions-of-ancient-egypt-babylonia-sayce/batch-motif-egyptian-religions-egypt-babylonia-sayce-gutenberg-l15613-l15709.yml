canonical_text:
  quote: ''
  summary: Scholarly footnotes discuss Babylonian and Semitic divine names, astral
    groupings, underworld and territorial lordship, the formation of divine triads,
    moon and star worship, divine consort and kinship identifications, the absorption
    or replacement of deities, and temple-name transfer between Ea and Merodach.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Igigi are represented by an ideograph of plurality; the author speculates
    that they may have been spirits of five planets duplicated as evening and morning
    appearances, or, if another reading were correct, the seven planets including
    sun and moon.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes a divine lord of a place or territory from the lord
    of the ghost-world at Nippur, described as a spirit ruling spirits in an underground
    world.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The origin of the Babylonian triad is described as arising from fusion of
    Sumerian and Semitic elements and from the geographical importance of the sanctuaries
    represented by Ana, En-lil, and Ea.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says Ana's first place in the triad suggests an origin in the
    theological school of Erech, where Semitic and Sumerian elements met.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hommel is cited for the view that primitive Semitic religion consisted of
    moon and star worship, with Athtar and an angel god at the head of the pantheon
    and a sun-goddess attached as daughter or wife.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The name and worship of Â are said to have been carried west; Â is described
    as a title meaning “the father,” with Sirrigam named as the Sumerian deity name.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Hadad is said to have absorbed the Sumerian air-god Meri or Mermer; Gubára,
    originally Meri's wife, became Hadad's wife, and was then identified with Sala
    and with Ashêrah or Asirtum.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The South Arabian triad of Athtar, the moon-god, and the angel-messenger is
    attributed to Babylonian cultural influence; the sun-goddess addition is described
    as Semitic.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Merodach is described as solar; a Sumerian poem ascribes creation to Ea, and
    the temple name Ê-Saggil is said to have transferred from Ea at Eridu to Babylon
    when Ea was supplanted by Merodach.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Ati, meaning “prince,” is noted as a title of Osiris.
  category: attribute
  evidence_refs:
  - ev:9
