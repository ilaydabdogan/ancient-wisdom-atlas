canonical_text:
  quote: ''
  summary: The passage discusses Sekhet/Bast as a lion- or cat-headed goddess, the
    sacred status of cats, and Bubastis. It then describes the syncretic movement
    among Egyptian goddesses, especially Hathor’s absorption of other female divinities,
    her royal, underworld, birth, and solar associations, and her cow and solar-disc
    iconography at Dendera. The passage closes with claims about Hathor’s foreign
    origin, rebus-written name, and proposed links with South Arabian Atthar and Babylonian
    Istar/Ashtoreth.
