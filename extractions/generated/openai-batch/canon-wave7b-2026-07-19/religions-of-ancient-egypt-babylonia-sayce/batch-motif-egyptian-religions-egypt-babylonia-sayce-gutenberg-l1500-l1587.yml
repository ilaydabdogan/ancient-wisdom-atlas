canonical_text:
  quote: The Ka needed to be sustained by food and drink.
  summary: 'The passage explains Egyptian funerary beliefs about the Ka: offerings,
    model offerings, statues, multiple images, and ushebti figures could sustain,
    house, or assist the spiritual counterpart of the deceased. It also describes
    Ra’s multiple souls and Kas, and the use of ushebtis as proxy laborers in the
    afterlife fields.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Ka is described as needing food and drink, and offerings are made to the
    dead and to gods, each of whom has a Ka.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ka of food and drink is said to feed the Ka of a person or god; durable
    models of food and drink came to be treated as effective substitutes for actual
    offerings.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Terra-cotta cakes inscribed with the deceased’s name and titles are described
    as replacing funerary bread from the Eighteenth Dynasty onward.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Statues and images were placed in tombs; the passage describes some as lifelike
    stone likenesses with inlaid ivory and obsidian eyes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The statue is said to have its own Ka; if the likeness is exact, the Ka of
    the statue and the Ka of the represented person are treated as the same.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ka of the deceased could revisit the tomb, clothe itself in the statue,
    and be nourished by offerings; the statue could remain if the mummy perished.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: More than one statue of the dead person could be placed in the same tomb to
    increase the chance that one would survive until the Ka was reunited with body
    and soul.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ra is described as invoked at Heliopolis in the form of seven birdlike souls
    or spirits, and fourteen Kas are ascribed to him, each corresponding to a quality
    or attribute.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The funerary statue is described as characteristic of Memphis and absent from
    Abydos in tombs of the first two Thinite dynasties, appearing with Memphite influence
    under the Third Dynasty.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Under the Theban dynasties, ushebti or respondent images become prominent,
    usually as small blue or green porcelain figures with mattocks and baskets.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Book of the Dead chapter quoted in the passage calls the ushebtis to answer
    when called and to work in the other world, including sowing fields, filling canals,
    and carrying sand.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Before full enjoyment of the fields of paradise, the deceased is said to need
    to perform work by cultivating an allotted portion, tilling it, and watering it
    from the heavenly Nile.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Relatives bury ushebti figures representing fellahs with the dead; the figures’
    Kas are believed to assist the deceased through the sacred words of the ritual.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Some ushebti images were broken to end their earthly existence and set their
    Kas free.
  category: action
  evidence_refs:
  - ev:8
