canonical_text:
  quote: ''
  summary: The passage describes a Babylonian conception of the imperishable human
    soul as capable of life beyond the grave with the gods. It discusses deified ancestors
    and rulers, including Assur-bani-pal's offerings to forefathers, royal and elite
    deification, Gudea, Gimil-Sin, and a comparison with later Pharaohs' shrines to
    their Kas. It contrasts Egypt's abundant tomb evidence for afterlife beliefs with
    the scant Babylonian and Assyrian evidence, and cautions against treating literary
    Hades imagery as direct evidence of popular belief.
  language: English
  quote_policy: summarized
