canonical_text:
  quote: ''
  summary: The passage describes Ra's nightly passage as the mortal “flesh of Ra”
    along an infernal river modeled on the Nile. His followers seek to accompany his
    solar bark through twelve regions of the dead by ritual knowledge and spells;
    some remain in regions of the underworld, while some emerge at dawn and are absorbed
    into Ra. His enemies are punished amid monsters and fire-breathing serpents. The
    passage also notes the elaborate mapping of the Am Duat and the incorporation
    of older Sokaris and Osiris afterlife conceptions, including the tomb-bound ka
    and Sokaris's sandy realm flanked by half-buried sphinxes.
  language: English
  quote_policy: summarized
