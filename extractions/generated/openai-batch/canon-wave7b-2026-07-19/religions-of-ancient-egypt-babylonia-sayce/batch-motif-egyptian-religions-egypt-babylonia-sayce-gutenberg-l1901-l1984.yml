canonical_text:
  quote: ''
  summary: The passage describes Egyptian funerary beliefs concerning the heart, the
    use of vases and scarab amulets, the heart’s role in judgment before Osiris, and
    the mummy’s hoped-for reunion with heart and soul in resurrection. It also discusses
    the relation of these ideas to Osirian religion and to embalming materials such
    as natron from El-Kab.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The heart and intestines were sometimes replaced in the mummy under the protection
    of wax images of four genii of the dead, and more often placed in four vases buried
    with the dead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hieroglyphic symbol of the heart is described as one of the vases, and
    one name for the heart, ḥati, is explained as connected with the vase.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: From the Twelfth Dynasty onward, an amulet could take the place of the material
    heart in the mummy, protecting the corpse from dangers connected with loss of
    the heart until resurrection.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The heart amulet was in beetle or scarab form, was called an emblem of becoming
    or transformation, and often bore the 30th chapter of the Book of the Dead on
    its underside.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The cited spell addresses both ab and ḥati forms of the heart, asks for no
    obstruction before the judges and scales, and identifies the heart as the speaker’s
    Ka in the body and with Khnum who strengthens the limbs.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The immaterial heart, called the Ka of the heart, is said to travel through
    the other world until it reaches the Abode of Hearts and the judgment-hall of
    Osiris.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the judgment-hall the heart meets the dead person and either accuses him
    of evil words and thoughts or testifies to good words and thoughts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The heart is described as pure and divine, and as an unwilling witness to
    sins it had been forced to know.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The heart is weighed in a balance against the image of Truth; only if the
    scales favor the dead person may the heart rejoin the body and live with it in
    the islands of the Blest.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The scales, judgment-hall, and paradise are presented as religious conceptions
    associated with Osiris and with the later accommodation of older or local ideas
    of the future life to Osirian beliefs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'The mummy, or Sâḥu, is distinguished from the Khat or natural body: the Khat
    is a dead shell, while the mummy contains seeds of growth and resurrection.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The soul can visit the mummy and temporarily inspire it with life; the expected
    future state is reunion of mummy, heart, and soul, followed by rising from the
    dead.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage links possible early embalming practice with pre-Menic rulers
    of Nekhen near El-Kab, where natron in the soil preserved buried bodies.
  category: setting
  evidence_refs:
  - ev:7
