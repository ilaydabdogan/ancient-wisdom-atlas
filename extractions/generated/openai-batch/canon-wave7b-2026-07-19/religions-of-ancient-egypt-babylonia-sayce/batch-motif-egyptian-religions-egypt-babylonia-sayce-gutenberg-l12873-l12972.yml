canonical_text:
  quote: ''
  summary: The passage presents a Babylonian ritual catechism of moral questions,
    explains its use by priests to diagnose divine wrath in this life, cites a law-code
    attributed to Ea that subjects kings to divine punishment for injustice, and contrasts
    Babylonian this-worldly rewards and punishments with Egyptian afterlife hopes.
    It describes the Babylonian underworld as dark, hopeless, gated, and without return,
    and compares it with Hebrew Sheol and Egyptian Osirian and solar afterlife ideas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ritual catechism asks whether a person has estranged family members, friends,
    or companions from one another; refused release to captives or the bound; committed
    offenses against gods or goddesses; dishonored elders or family members; spoken
    falsely or wickedly; used false scales; mishandled accounts, inheritance, landmarks,
    neighbors' property, neighbors' wives, neighbors' blood, or neighbors' garments.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that the questions are put to a penitent so that a priest
    may discover why the wrath of the gods has fallen on him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author states that the catechism concerns this life rather than the next,
    and that conformity to its moral code guarantees only protection against present
    suffering and misfortune, not eternal happiness.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old code attributed to Ea says that if the king does not heed justice or
    the law of the land, his people or land will suffer and Ea will change his destiny
    and visit him with misfortune.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The code says that if the king heeds the law-book and the writing of Ea, his
    land will be strengthened and the great gods will establish him in counsel and
    knowledge of justice.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The code says that if the king gives a wrong decision against a man of Sippara,
    the sun-god will appoint another judge, a just prince, and a just judge in his
    land.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The code says that if the king accepts bribes and treats sons of Nippur harshly,
    Bel will bring a foreign enemy against him, destroy his army, and make the prince
    and general hunted like outcasts.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The code says that if the king favors bribing Babylonians, Merodach will set
    his foes over him and give his goods and treasure to his enemy; the bribers are
    to be cast into prison.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author describes Babylonian theology as practical and as limiting rewards
    and punishments to this life, in contrast with the Egyptian who is said to have
    lived for the next world.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Babylonian world beyond the grave is described as a prison-house of darkness
    and unsubstantiality, a land of forgotten things and forgotten inhabitants, where
    ghosts feed on dust and refuse.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the underworld, hideous monsters of chaos still move, and the kings of
    the nations sit on shadowy thrones welcoming the slaughtered king of Babylon.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The dead man is said never again to see the light of the sun; no Osirian paradise,
    happy meadows, or brief solar-bark light is granted to the dead Babylonian.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: The gates of the world beyond the grave bear words of abandoned hope; there
    is no return, and the sevenfold gates of Hades open only to admit those who enter.
  category: sequence
  evidence_refs:
  - ev:8
