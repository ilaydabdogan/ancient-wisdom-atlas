canonical_text:
  quote: Beside Him, “there is no other” God.
  summary: The passage contrasts older Egyptian use of the title “the one god” within
    polytheism with Amon-hotep IV’s Aten reform, describes the conflict with Amon’s
    priesthood, the king’s renaming as Khu-n-Aten and foundation of a new city, and
    summarizes hymns presenting Aten as solar creator, lord of time, and beloved divine
    parent of the king.
  language: English
  quote_policy: quoted
