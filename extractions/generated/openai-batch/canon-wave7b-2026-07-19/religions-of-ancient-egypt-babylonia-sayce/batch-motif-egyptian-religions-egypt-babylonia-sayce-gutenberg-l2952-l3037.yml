  summary: The passage explains Egyptian animal-headed and animal-incarnate divine
    forms as a compromise between animal worship and anthropomorphic religion, contrasts
    this with Babylonian divine iconography, describes transmigration as an explanation
    for divine animal forms, and notes that Egyptian temple worshippers could see
    sacred animals regarded as incarnated deities.
