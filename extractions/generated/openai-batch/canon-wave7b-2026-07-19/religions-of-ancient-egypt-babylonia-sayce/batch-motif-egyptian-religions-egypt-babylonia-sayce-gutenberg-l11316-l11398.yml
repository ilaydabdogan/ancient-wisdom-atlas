candidate_motifs:
- id: motif:1
  label: Underworld conquest leading to divine marriage and co-rule
  taxonomy_refs:
  - sacred_marriage
  - royal_legitimacy
  basis: Nergal conquers Ereskigal's realm, she begs mercy, and he becomes her husband
    and co-ruler over the dead while receiving the tablet of wisdom.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The marriage follows coercive violence; the passage frames the result
    as a transfer of rule, not as a ritual sacred-marriage narrative.
- id: motif:2
  label: Wisdom or destiny tablets granting sovereignty
  taxonomy_refs:
  - wisdom
  - royal_legitimacy
  - divine_judgment
  basis: The tablets of destiny grant foreknowledge and supreme rule; their possession
    makes Kingu ruler, then Merodach the Bel who directs the universe and declares
    annual destinies.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The taxonomy has no specific tablet motif; mapping is to wisdom, rule,
    and destiny-declaration functions.
- id: motif:3
  label: Theft and recovery of divine tablets
  taxonomy_refs:
  - sacred_theft
  - wisdom
  - royal_legitimacy
  basis: Zu steals the divine tablets of destiny, seeks to establish his own command,
    flies to Mount Sâbu, and the tablets are restored to Bel by stratagem.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not describe the stratagem in detail.
- id: motif:4
  label: World-spanning pestilence as divine scourge
  taxonomy_refs:
  - chaos
  - divine_judgment
  basis: Urra's pestilence devastates multiple lands and peoples for unnumbered years
    and is said to have been planned because of former wickedness.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage also stresses that just and unjust suffer alike, so the judgment
    aspect is limited and ambiguous.
- id: motif:5
  label: Eclipse as attack on the moon by evil spirits
  taxonomy_refs:
  - chaos
  basis: Seven evil spirits assault the moon, producing an eclipse and threatening
    extinction until divine aid saves the moon-god.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage summarizes the myth briefly and embeds it in an incantation-text
    context.
- id: motif:6
  label: Hero in an age of visible divine intervention
  taxonomy_refs:
  - culture_hero
  basis: Gilgames is described as a hero rather than a god, living in a period when
    gods visibly took part in human affairs.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: No specific episode of Gilgames's adventures is narrated in this passage.
comparison_claims:
- id: claim:1
  claim: The Ereskigal poem is explicitly placed in an Egyptian scribal context because
    fragments were found at Tel el-Amarna and the poem was used as a textbook for
    Babylonian language and script students.
  claim_level: historical_contact
  target: Egyptian Tel el-Amarna scribal setting and Babylonian literary-language
    tradition
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: This supports textual or educational contact only; it does not by itself
    show adoption of the myth into Egyptian religion.
- id: claim:2
  claim: The passage compares the tablets of destiny to the Urim and Thummim in that
    they were hung upon the breast.
  claim_level: visual_similarity
  target: Urim and Thummim
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The stated comparison is limited to placement or display on the breast;
    broader functional equivalence is not established in the passage.
- id: claim:3
  claim: The plague-god Urra is compared by the author to the angel of pestilence
    seen by David with hand stretched over Jerusalem.
  claim_level: same_function
  target: David's angel of pestilence over Jerusalem
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives an authorial resemblance claim, not evidence for
    historical dependence or shared origin.
- id: claim:4
  claim: The assault on the moon-god is said to remind the author of legends of Lapps
    or Samoyeds.
  claim_level: same_motif
  target: Lapp or Samoyed legends involving a comparable lunar-assault pattern
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: low
  limitations: The outside legends are not described in the passage, so the nature
    and strength of the similarity cannot be verified here.
- id: claim:5
  claim: The passage compares Gilgames with Greek heroic tales and the story of Gilgames
    with the story of the Trojan War as epic traditions that attracted mythological
    elements.
  claim_level: same_function
  target: Greek heroic tales and the Trojan War epic tradition
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is typological and literary; the passage does not claim
    direct historical contact or common inheritance.
