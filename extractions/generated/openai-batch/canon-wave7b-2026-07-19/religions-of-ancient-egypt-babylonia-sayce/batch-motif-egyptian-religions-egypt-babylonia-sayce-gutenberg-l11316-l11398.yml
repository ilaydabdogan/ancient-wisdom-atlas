canonical_text:
  quote: ''
  summary: 'The passage summarizes several Babylonian myths and their transmission
    or interpretation: Ereskigal and Nergal in the underworld; tablets of wisdom and
    destiny that confer rule; Zu''s theft of the tablets; Urra''s pestilence over
    many lands; seven evil spirits attacking the moon; and the Epic of Gilgames as
    a heroic cycle compared by the author with Greek epic traditions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fragments of a poem about Ereskigal were found at Tel el-Amarna in Egypt,
    where the poem was used as a textbook for students of Babylonian language and
    script.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ereskigal refused to attend a feast prepared by the gods in heaven.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nergal invaded Ereskigal's dominions, broke through their gates, seized Ereskigal
    by the hair, and dragged her from her throne.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ereskigal begged for mercy; Nergal agreed to become her husband and to rule
    with her over the realm of the dead, and the tablet of wisdom was transferred
    to him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The tablets of destiny were distinct from the tablet of wisdom; they gave
    foreknowledge of future events and implied supreme rule over gods and men.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Tiamât delivered the tablets of destiny to Kingu, and Merodach's victory over
    the powers of darkness transferred the tablets to Merodach.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: At the New Year's festival in Babylon, Bel-Merodach sat enthroned and declared
    the destinies of the coming year.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Zu, the storm-bird, stole the divine tablets of destiny while Bel was pouring
    pure water and mounting his throne, then flew with them to Mount Sâbu; the tablets
    were later restored to Bel by stratagem.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Urra, the Pestilence, ravaged land after land without sparing either just
    or unjust persons; Babylon, Erech, Syria, Assyria, Elamites, Bedâwin, Kurds, and
    Akkadians are named among the affected peoples or places.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Isum, the angel-messenger of Urra, was sent on a longer mission as pestilence
    spread over the civilized world.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Seven evil spirits assaulted the moon, producing an eclipse and threatening
    extinction; En-lil sent the fire-god to Ea for advice and help, and the moon-god
    was saved.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Gilgames is described as a hero, not a god for the poet of the Epic, and as
    living in a time when gods visibly took part in human affairs.
  category: attribute
  evidence_refs:
  - ev:6
