canonical_text:
  quote: ''
  summary: The passage describes Khu-n-Aten's doctrine of Aten as an exclusive, eternal,
    universal creator revealed through the solar disc, creator by word or command,
    father of all things, and immanent in created life. It frames the reform in relation
    to older Egyptian sun-worship, contrasts it with earlier Egyptian ideas and Semitic
    Baal, and compares it cautiously with Mosaism while emphasizing differences from
    Yahveh of the Commandments.
  language: English
  quote_policy: summarized
