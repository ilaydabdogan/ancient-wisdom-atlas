canonical_text:
  quote: ''
  summary: The passage quotes and discusses ancient and modern reactions to Egyptian
    animal worship. It describes a temple scene in which a hidden shrine reveals an
    animal rather than an anthropomorphic image, cites Roman satire and an incident
    involving the killing of a cat, surveys philosophical explanations by Plutarch
    and Porphyry, distinguishes Egyptian temporary soul embodiment from Greek metempsychosis,
    and summarizes modern theories including totemism and religious accommodation.
  language: English
  quote_policy: summarized
