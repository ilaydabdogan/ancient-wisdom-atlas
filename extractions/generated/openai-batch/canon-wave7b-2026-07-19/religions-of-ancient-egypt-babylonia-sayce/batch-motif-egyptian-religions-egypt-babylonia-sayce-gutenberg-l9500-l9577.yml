  taxonomy_refs:
  - wisdom
  - culture_hero
  basis: The passage attributes cuneiform writing, the first book, instruction in
    culture, libraries, schools, scribes, and learned inspiration to Nebo.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:10
  confidence: medium
