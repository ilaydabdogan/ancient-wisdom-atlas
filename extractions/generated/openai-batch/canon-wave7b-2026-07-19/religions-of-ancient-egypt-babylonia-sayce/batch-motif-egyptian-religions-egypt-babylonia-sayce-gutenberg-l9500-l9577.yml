canonical_text:
  quote: ''
  summary: The passage traces Nebo from an originally independent god of Borsippa
    into the minister and interpreter of Merodach, patron of writing and learning,
    associate of Tasmit, and later figure identified with the fire and solar god Nusku.
    It also compares Nebo's scribal function with Thoth and describes the retention
    of a separate shrine for Nusku within Nebo's temple.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Merodach became the god of Babylon and, as Babylon rose to political power,
    was described as needing a messenger.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The god of Borsippa was annexed by Merodach after Borsippa declined and became
    a suburb of Babylon, and he became Merodach's follower and servant.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Khammurabi transferred the ancient temple of the god of Borsippa to the god
    of Babylon and included the Borsippa god among inferior deities with chapels in
    Merodach's sanctuary.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The god of Borsippa had once been independent and supreme in his own city
    and was addressed as maker of the universe, irrigator of fields, and originator
    of cuneiform writing.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Semites called the Borsippa god Nabium, meaning Prophet, and under the
    name Nabium or Nebo he became minister of Merodach.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Nebo is described as interpreter of the will of Bel and patron of literature,
    and his name is said to have been carried westward, including Mount Nebo and cities
    in Reuben and Judah.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nebo is explicitly likened to Thoth in Egypt as patron of literature and god
    of scribes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nebo watched over the library and school, encouraged study of the script attributed
    to him, was credited with writing the first book, and instructed mankind in elements
    of culture.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Nebo's marshal's staff became the rod of the scribe, and Tasmit, meaning Hearing,
    was created as his consort.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: In Assyria, Nebo became a special favourite of the literary class, and Assur-bani-pal
    said Nebo and Tasmit broadened his ears and enlightened his eyes.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: As minister of Merodach, Nebo passed into the solar circle but retained his
    personality rather than being absorbed by Merodach.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Nusku is described as once being the fire that blazed into flame and purified
