candidate_motifs:
- id: motif:1
  label: Absorbed city deity becomes servant of dominant city god
  taxonomy_refs: []
  basis: The passage presents Borsippa's political decline and Babylon's rise as producing
    a religious hierarchy in which the Borsippa god becomes Merodach's follower, servant,
    and minister.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:10
  confidence: high
  cautions: This is presented as a historical-religious development rather than a
    mythic narrative episode.
- id: motif:2
  label: Divine messenger and interpreter of a higher god
  taxonomy_refs: []
  basis: Nebo is repeatedly described as minister, Prophet, and interpreter of Bel,
    and Nusku's similar role as messenger of Bel enables identification with Nebo.
  evidence_refs:
  - ev:4
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: No specific taxonomy motif ID is supplied for divine messenger/minister.
- id: motif:3
