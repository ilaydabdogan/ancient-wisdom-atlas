- id: claim:2
  claim: The passage presents Nebo and Nusku as functionally equivalent in the role
    of messenger or interpreter of Bel, which supports their identification within
    Babylonian theology.
  claim_level: same_function
  target: Nusku as messenger of Bel / En-lil
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs:
  - ev:9
  confidence: high
  limitations: The same passage also states that Nusku's original independent deity
    status was not forgotten, requiring a separate shrine.
- id: claim:3
  claim: The passage contrasts Babylonian handling of Nebo with an Egyptian pattern
    in which a less influential god would have been absorbed by the more influential
    god.
  claim_level: same_function
  target: Egyptian divine absorption pattern contrasted with Babylonian minister-envoy
    pattern
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim rests on the author's broad comparison and does not provide
    a specific Egyptian text or deity example in this passage.
