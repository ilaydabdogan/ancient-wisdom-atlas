comparison_claims:
- id: claim:1
  claim: The passage explicitly compares Nebo with Thoth in the shared function of
    patron of literature and god of scribes.
  claim_level: same_function
  target: Thoth in Egypt
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
