- id: motif:4
  label: Fire-spirit transformed into solar deity and identified with another god
  taxonomy_refs: []
  basis: Nusku is first fire purifying sacrifice, then a local noon sun-god, and is
    later identified with Nebo because both serve as Bel's messenger.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The motif is a syncretic theological pattern; the available motif taxonomy
    has no direct solarization or syncretism entry.
- id: motif:5
  label: Separate cult place preserves an absorbed deity's dues
  taxonomy_refs: []
  basis: Although Nusku is identified with Nebo, the priesthood erects a separate
    shrine to Nusku within Nebo's temple precincts to prevent divine retaliation for
    lost dues.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is a cultic-priestly precaution, not a narrated myth episode.
- id: motif:6
  label: Personified faculty as divine consort
  taxonomy_refs:
  - wisdom
  basis: Tasmit, meaning Hearing, is created as Nebo's wife, and Nebo with Tasmit
