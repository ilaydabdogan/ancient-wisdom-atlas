canonical_text:
  quote: ''
  summary: The passage distinguishes Babylonian seers from prophets, recounts a seer's
    dream-vision of Istar promising aid to Assur-bani-pal before war, compares Babylonian
    and Hebrew prophetic institutions, describes prophetesses and temple women, and
    lists libations, first-fruits, animal sacrifices, and a gazelle scapegoat offered
    or ritually released in Babylonian religion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The seer and prophet are described as distinct offices, with the seer receiving
    knowledge through visions and trances rather than acting as the ordinary speaker
    of divine will.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Assur-bani-pal invokes Istar for aid and protection before the Elamite war,
    and a seer reports a prophetic dream or night vision.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the dream-vision, Istar comes down armed with quivers, a bow, and a sharp
    war-sword.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Istar addresses the king in maternal terms and promises that his desire will
    be given and that he will not falter.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The seer is said to be an ancient Babylonian office and is listed alongside
    royal palace figures in the time of Sargon of Akkad.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Priestly service requires absence of bodily blemish, and lepers, the blind,
    and the maimed are excluded from service of the gods.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Babylonian prophet is described as a trained and consecrated member of
    the priestly body rather than a peasant utterer of divine will.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The prophet is linked with the magician, necromancer, soothsayer, and inquirer
    of the dead.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Prophetesses as well as prophets are said to exist in both Babylonia and Israel.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: A woman is described as uniquely privileged to enter the secret shrine of
    Bel-Merodach at Babylon.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The lower world of Hades is described as having female and male soothsayers
    and as the home of the black art.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:12
  text: The temple assigns the prophet the duty of pouring out libations.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Libations are described as originally pure water, later supplemented with
    wine.
  category: object
  evidence_refs:
  - ev:12
- id: obs:14
  text: First-fruits, milk, butter, oil, dates, vegetables, spices, incense, corn,
    garlic, herbs, and honey are listed among offerings to the gods.
  category: object
  evidence_refs:
  - ev:13
- id: obs:15
  text: Oxen, calves, sheep, lambs, goats, kids, fish, and certain birds are listed
    as animals slain on the altar and presented to the gods.
  category: action
  evidence_refs:
  - ev:14
- id: obs:16
  text: Only cultivated plants and domesticated beasts are said to appear as ordinary
    offerings; dog and wild boar are absent from the sacrificial lists.
  category: attribute
  evidence_refs:
  - ev:15
- id: obs:17
  text: A gazelle is named as a scapegoat driven into the desert, carrying away sins
    and sickness.
  category: action
  evidence_refs:
  - ev:16
- id: obs:18
  text: The gods are described as requiring what humans live on and as demanding first-fruits
