  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Nin-ip is said to have been one of the Anunna-ki before assuming the form
    of a Semitic Baal and clothing himself with attributes of the sun-god.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage says Nin-ip appeared to his worshippers in the shape of a swine
