canonical_text:
  quote: ''
  summary: The passage compares Egyptian animal-headed gods with Babylonian semi-divine
    hybrid spirits and monsters, then describes Babylonian spirit classes, Tiamat’s
    chaotic host, the Anunna-ki and Igigi, and the development of Nin-ip from an underworld
    spirit associated with the veil and swine into a solar war-god. It also notes
    analogies to medieval angels/devils and Celtic underworld swine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Babylonian secondary creatures resembled Egyptian gods in
    outward form, but in Babylonia the partly bestial and partly human beings were
    semi-divine spirits and monsters rather than the gods themselves.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: These Babylonian beings became servants and followers of the gods or the rabble-host
    of Tiamat, who is described as the impersonation of chaos and sin.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage lists three hundred spirits of heaven and six hundred spirits
    of earth; the heavenly spirits formed hosts led by the supreme deity into battle,
    and Nebo mustered and drilled the hosts of heaven and earth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Anunna-ki inhabit the subterranean world of Hades, sit on a throne of
    gold, and guard the waters of life; the Igigi dwell with the gods in the heaven
    of light and blissfulness.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says the distinction between spirits of earth and air belongs
    to later Babylonian religion under Semitic influence, while the Sumerian usage
    treated them all as Anunnas or spirits.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Nin-ip is described as minister and attendant of En-lil, offspring of Ê-kur,
    and a ghost in Nippur before transformation into a Semitic god.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Nin-ip is associated with dawn and identified with the rising sun; the passage
    says his solar character raised him to the rank of a Baal and a god.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Nin-ip carried destruction over the earth at the time of the Deluge, while
