  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The author states that Hellenised Egyptian philosophy affected Christian Alexandria,
    Christian Europe, and Christian theological psychology, with possible traces even
    in the New Testament.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Egyptian soul was often pictured as a hawk, which the passage calls the
