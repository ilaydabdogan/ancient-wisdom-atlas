canonical_text:
  quote: ''
  summary: The passage describes a Hellenised Egyptian account of resurrection, soul,
    divine intelligence, judgment, punishment, annihilation, and the rewarded soul's
    cosmic education and vision of God. It then turns to the hawk as a symbol of the
    Egyptian sun-god, especially Horus the elder, and to early monuments where hawks
    on standards accompany the Pharaoh and signify divine-royal conquest.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the risen man is made an "Osiris," identified in substance
    with Osiris rather than with his old material self.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Hellenised system, the Khu becomes divine intelligence, and body, spirit,
    and soul are shared by humans and beasts while divine intelligence belongs to
    humans alone.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The divine intelligence seeks to raise and purify the human soul, while the
    flesh continually wars against it and tries to drag the soul downward.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the soul yields to the body, the intelligence returns to its original state
    and the soul is arraigned before the judgment-seat of heaven, where the heart
    or conscience accuses it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The condemned soul is scourged, exposed to tempests between earth and sky,
    may enter human or animal bodies as an evil demon, and finally dies a second death
    and is annihilated forever.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The good soul is described as one that listened to the divine intelligence
    during life and struggled against the lusts and passions of the flesh.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: After death the good soul is guided by the intelligence, traverses space,
    learns secrets of the universe, sees God face to face, and loses itself in divine
