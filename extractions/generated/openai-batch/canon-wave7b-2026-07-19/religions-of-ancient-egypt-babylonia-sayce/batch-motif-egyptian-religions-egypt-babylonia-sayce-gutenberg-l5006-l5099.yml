canonical_text:
  quote: ''
  summary: 'The passage summarizes several sections of the Egyptian Book of the Dead:
    the soul’s required knowledge of gods and the world to come; restoration of the
    dead person’s voice, memory, name, and heart; protection against serpents, punishments,
    and a second death; transformations of the Ba through ritual words; reunion of
    soul and body without confinement in the tomb; and the mingling of Osirian and
    solar afterlife ideas, culminating in moral judgment before Osiris.'
  language: English
  quote_policy: summarized
