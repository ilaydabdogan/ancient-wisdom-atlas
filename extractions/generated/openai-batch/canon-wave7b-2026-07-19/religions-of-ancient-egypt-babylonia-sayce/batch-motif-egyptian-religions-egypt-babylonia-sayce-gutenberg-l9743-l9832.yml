canonical_text:
  quote: ''
  summary: 'The passage describes Assur as a solitary, jealous, wifeless Assyrian
    god contrasted with Babylonian gods who have wives and divine families. It then
    introduces Babylonian cosmological thought, including anthropomorphic creation,
    an earlier chaotic creation, and the differing religious geographies of Nippur
    and Eridu: Nippur with a mountain-like temple, netherworld powers, and the dead;
    Eridu with the encircling ocean, Ea, Aṡari, civilization, healing, and life.'
  language: English
  quote_policy: summarized
