- id: obs:2
  text: At Shêkh Herîdî, two domed tombs in a crater-like hollow of a mountain cliff
    are dedicated to a snake and his female mate; the serpent is treated as the Shêkh,
    and the place is holy ground with annual pilgrimages and a festival after Ramadan.
  category: setting
  evidence_refs:
