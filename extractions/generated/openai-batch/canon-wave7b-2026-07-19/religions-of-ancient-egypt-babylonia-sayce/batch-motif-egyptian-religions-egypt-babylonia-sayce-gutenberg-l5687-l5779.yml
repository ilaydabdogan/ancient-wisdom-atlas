canonical_text:
  quote: "“Shêkh Herîdî, in fact, is a serpent, and the place he inhabits is holy
    ground.”"
  summary: The passage describes continuing serpent worship in the Nile valley, centered
    on Shêkh Herîdî, a serpent associated with holy ground, pilgrimage, healing, fire-breathing
    punishment, bodily reconstitution, hidden gold, and claims of immortality. It
    presents this cult as a survival of ancient local serpent veneration and contrasts
    enduring popular religion with official Egyptian theology. The passage then discusses
    priestly rationalization of folk-tales into local legends and introduces a Heliopolitan
    account of a self-created creator god.
  language: English
  quote_policy: quoted
