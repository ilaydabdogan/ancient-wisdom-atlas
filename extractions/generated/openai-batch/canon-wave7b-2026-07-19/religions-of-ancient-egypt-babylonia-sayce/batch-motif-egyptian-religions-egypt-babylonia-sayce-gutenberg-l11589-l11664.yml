  quote: ''
  summary: 'The passage discusses the Babylonian Deluge tradition in the Epic of Gilgamesh,
    its variants, its relation to Berossos and Genesis, and its narrative elements:
    En-lil sends the Flood, Ea saves and warns Xisuthros, Xisuthros survives through
