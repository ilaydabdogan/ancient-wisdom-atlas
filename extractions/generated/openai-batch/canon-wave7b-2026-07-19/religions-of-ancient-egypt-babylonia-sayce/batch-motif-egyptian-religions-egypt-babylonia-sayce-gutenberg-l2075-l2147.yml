  quote: ''
  summary: The passage discusses Horus-hawk royal iconography, the title and legends
    of the “followers of Horus,” traditions of their conquest of Egypt, the relation
    of Horus and Set to Upper and Lower Egypt, the “Golden Horus” title, Horus’s relation
    to the Pharaoh’s Ka, and the mummified Horus of Nekhen.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A plaque is described as showing Horus the hawk-god with the symbol of “follower”
    above a boat engraved over decapitated slain bodies.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A rock drawing near El-Kab is described as showing cartouches of Sharu and
    Khufu carried in boats, hawks on the prows, and two other hawks above each name
    standing on the hieroglyph of “gold” with Upper and Lower Egyptian crowns.
  category: object
  evidence_refs:
  - ev:1
  - ev:5
- id: obs:3
  text: Later texts identify the “followers of Horus” as predecessors of Menes and
    the First Dynasty of united Egypt, associated with southern Pharaohs and princes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: An inscription at Dendera is reported to say that a temple plan on parchment
    had been drawn in the time of the “followers of Horus.”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Edfu legends say the followers of Horus were smiths armed with iron weapons
    who drove their leader’s enemies before them and came to possess all Egypt.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The conquest tradition names repeated battles at several Egyptian sites and
    a final pursuit by ship down the Red Sea, ending near Berenicê and followed by
    a triumphant return across the desert to Edfu.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author states that the Edfu legend, in its present form, is not older
    than the Ptolemaic period and probably preserves echoes of the gradual conquest
    of Egypt by the first followers of the Pharaohs.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The author says the conquest legend has been combined with a different cycle
    of myths about the eternal struggle between Horus, son of Isis, and his twin brother
    Set.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A Third Dynasty king is described as having above his name the crowned emblems
    of Horus and Set and a title referring to the union of two Horus gods.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage interprets the two Horuses as the two kingdoms of Upper and Lower
    Egypt and states that Horus and Set should be seen as symbols of South and North.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The “Golden Horus” is identified as an early title of the Pharaoh, while later
    ages explained it by reference to the golden rays of the morning sun.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the Fourth Dynasty, the title is said to be attached to both the Pharaoh’s
    Ka or death name and his living birth name, while the Horus-hawk without the gold
    symbol is said to surmount only the Ka name.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage states that Horus was incarnated in the Pharaoh’s double rather
    than directly in the Pharaoh, and that Horus watched over the royal Ka.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: At Nekhen, the Horus-hawk is described as represented in mummy form, possibly
    connected with preservation of the dead body and with the idea that Horus was
    entombed there like Osiris at Abydos.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Horus-hawk is described as the token under which kings of Upper Egypt
    fought and ruled, and Horus is said to have led them to victory.
  category: relationship
  evidence_refs:
  - ev:7
