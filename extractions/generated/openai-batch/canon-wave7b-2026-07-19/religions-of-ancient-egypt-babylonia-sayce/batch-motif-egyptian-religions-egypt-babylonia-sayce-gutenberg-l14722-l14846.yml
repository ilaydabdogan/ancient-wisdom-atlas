literal_observations:
- id: obs:1
  text: Late examples are cited of worship of animals such as the cat, ram, swallow,
    and goose as animals themselves rather than as incarnations of an official god;
    their rarity is attributed to private and domestic cults not recognized by the
    State religion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that beasts were ascribed language, knowledge of the future,
    and acute senses enabling perception of objects and beings invisible to humans.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Late inscriptions call Bakh or Bakis the living soul of Ra, in a context where
    Mentu and Ra had been identified.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Roman-period stelae from Erment depict the sacred bull without a solar emblem,
    while a hawk-headed crocodile crowned with the sun’s orb stands beside it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A related hawk-headed crocodile is described with the sun’s orb on its head
    and a uraeus serpent at the end of its tail, and is called Ptiris in Greek graffiti
    at Philae.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage reports monument text reading of Horus in the bennu as a black
    bull and as a horned bull; the cemetery of Tanis is called the city of the phoenix,
    and at Edfu the bennu is said to come forth from the holy heart of Osiris.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A quoted Egyptian song or saying states that the dwellings of the dead fall
    down, that no one returns from the place of the dead to report what has happened,
    and that no one carries goods away after death.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The same quoted passage counsels the living to follow the heart’s desire,
    use myrrh and fine linen, adorn themselves, keep holiday, and enjoy life before
    mourning comes.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The double-headed axe is said to be repeatedly carved on the walls of the
    palace of Minos at Knossos and to have been regarded as a divine symbol protecting
    the building from injury.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Coins of Tarsus are said to show the sun-god Sandan carrying an axe.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Thoth is said to write the king’s name on the sacred sycamore to ensure everlasting
    life, and the name of Ea is said to be written on the core of the sacred cedar-tree.
  category: action
  evidence_refs:
  - ev:6
