canonical_text:
  quote: Materialism and symbolism constituted the background of Egyptian religion.
  summary: 'The passage presents Sayce''s account of Egyptian religious thought as
    strongly material and symbolic: abstract ideas take concrete visible form; names,
    written signs, and things are closely identified; divinity manifests through many
    forms by transformation rather than transmigration; symbolic language may be metaphorical;
    and Maspero is quoted describing an exalted doctrine of a unique self-generating
    deity who is father, mother, and son.'
  language: English
  quote_policy: quoted
