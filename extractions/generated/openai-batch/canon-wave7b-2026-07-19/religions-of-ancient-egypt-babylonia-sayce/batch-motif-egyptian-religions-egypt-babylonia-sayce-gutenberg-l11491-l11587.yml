canonical_text:
  quote: ''
  summary: The passage recounts accusations against Istar for harming former beloveds,
    her request to Anu for vengeance after Gilgames rejects her, the creation and
    killing of the divine bull, the resulting curse on Gilgames and Ea-bani, and Gilgames'
    grief-driven journey to seek immortality from Xisuthros beyond the river of death.
    The journey passes the sun-gate mountains, scorpion guardians, darkness, a gemstone
    tree, the world-encircling ocean, Siduri's gate, and the waters of death before
    Gilgames reaches Xisuthros, the Deluge survivor.
  language: English
  quote_policy: summarized
