canonical_text:
  quote: ''
  summary: The passage describes Babylonian incantation collections as locally assembled,
    repeatedly modified, and mixed with spells, hymns, and penitential psalms. It
    distinguishes later State and Semitic priestly revisions from older animistic
    incantations in which official gods are absent and Sumerian spirits or ghosts
    are invoked. A cited incantation enumerates paired lord and lady spirits of cosmic
    and sacred domains. The author explains the translated term “divine” as originally
    meaning superhuman or non-human and connects it with ghosts, spectres, an eight-rayed
    star ideograph, and night lights in the sky.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each great sanctuary is described as having its own collection, with collections
    added to, amalgamated, or partly incorporated into one another over time.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Spells considered effective for warding off disease or preventing evil were
    added to relevant collections regardless of source, and the list of gods invoked
    was enlarged in hope of relieving the sufferer.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Older collections were modified according to the State religion, while new
    Semitic collections were produced under Babylonian priestly supervision.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Hymns and penitential psalms were included in the collections, and incantatory
    formulae were sometimes intermixed with hymns or psalms.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage states that at a later stage the old Sumerian language was no
    longer considered necessary for the efficacy of charms, and incantation collections
    were made in later Babylonian Semitic language.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: The author says source criticism cannot yet fully separate the collections
    because few survive complete and the available evidence depends largely on Nineveh
    library copies rather than older Babylonian library texts.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: Some collections are said to show greater antiquity and thinly disguised animism,
    with many pointing to Eridu as source and some probably to Nippur.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:8
  text: In older incantations the gods of the official cult are described as absent
    except where their names were inserted later, and their place is taken by spirits
    or ghosts of early Sumerian belief.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The invoked powers include spirits of the sky, earth, Ansar and Kisar, Zikum,
    Nina, the moon, the sun, and the evening star.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The sorcerer is said to know only spirits that animate the universe and bring
    good and evil upon mankind.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:11
  text: A cited incantation enumerates paired lord and lady spirits associated with
    earths, stars, progenies, the holy mound, the dayspring of life, and spirit-hosts.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: The author explains that the translated term “divine” originally means superhuman
