canonical_text:
  quote: ''
  summary: The passage consists of notes, including a translated Luxor temple inscription
    in which Amon incarnates in the royal person of Thothmes IV, approaches Mut-em-ua,
    fathers the child Amon-hotep, and declares the child’s future rule. Other notes
    discuss Sumerian and Semitic terms for ghosts or spirits, including lil, lilu,
    lilitu, and Hebrew Lilith; spirit manifestations as wind or dust-cloud; Berossian
    antediluvian kings connected with Oannes-gods from the Persian Gulf; and the phrase
    'son of his god' as possible divine adoption.
  language: English
