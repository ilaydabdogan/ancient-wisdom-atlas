canonical_text:
  quote: ''
  summary: 'The passage discusses an Eridu-centered Babylonian cosmological poem,
    Ea and Aruru as creators or modelers of beings, and the Adapa legend: Adapa is
    created by Ea, endowed with wisdom but not immortality, summoned before Anu after
    breaking the south wind’s wings, instructed by Ea not to eat or drink in heaven,
    and thereby refuses the food and water of life. The passage then explicitly compares
    this explanation of human mortality with the Genesis story of Adam and the tree
    of life.'
  language: English
  quote_policy: summarized
