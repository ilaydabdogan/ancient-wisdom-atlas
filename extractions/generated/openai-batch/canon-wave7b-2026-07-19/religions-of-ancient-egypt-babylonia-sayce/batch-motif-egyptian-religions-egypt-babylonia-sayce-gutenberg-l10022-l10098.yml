comparison_claims:
- id: claim:1
  claim: The passage explicitly treats the Adapa legend and the Genesis Adam story
    as comparable etiological stories explaining human mortality.
  claim_level: same_function
  target: Genesis Adam narrative and tree of life episode
  evidence_refs:
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is based on the author’s summary; no claim of historical
    contact or common inheritance is made in the passage.
- id: claim:2
  claim: The Adapa and Adam narratives share a pattern involving a primordial man,
    divine creation, knowledge, and the loss or denial of immortality connected with
    life-giving food or the tree of life.
  claim_level: same_motif
  target: Primordial human denied immortal life / Genesis tree of life pattern
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  - ev:8
  counter_evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  limitations: 'The passage emphasizes major differences: Adapa already has knowledge
    and loses immortality by obeying Ea, whereas Adam loses immortality after disobedience
    and desire for divine knowledge.'
- id: claim:3
  claim: 'The passage contrasts the theological mechanism of the two stories: Babylonian
    polytheism permits conflicting divine intentions, whereas the Genesis comparison
    has one deity as both creator and heaven-god.'
  claim_level: same_function
  target: Babylonian polytheistic divine counsel and Israelite monotheistic Genesis
    framing
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: This is a comparison of narrative-theological structure rather than
    evidence for historical relationship.
