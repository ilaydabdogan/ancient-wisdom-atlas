candidate_motifs:
- id: motif:1
  label: Divine modeling of beings from clay
  taxonomy_refs: []
  basis: Aruru molds Ea-bani from clay and is compared with Ea as a modeler in clay
    or divine potter associated with making man.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage does not give the full creation episode for mankind from clay,
    but it explicitly links clay modeling to Aruru and to Ea as divine potter.
- id: motif:2
  label: Wise first man denied immortality
  taxonomy_refs:
  - wisdom
  basis: Adapa is the first man, created by Ea, endowed with wisdom and knowledge,
    but denied immortality.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The motif is framed through Sayce’s summary rather than through a quoted
    primary Babylonian text.
- id: motif:3
  label: Mortal summoned to heaven after offending a divine power
  taxonomy_refs:
  - ascent
  - divine_judgment
  basis: After Adapa breaks the south wind’s wings, Anu demands punishment, and Ea
    sends Adapa on the road to heaven to appear in Anu’s realm.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: This is not an afterlife journey in the passage; it is a living mortal’s
    ascent to a divine court.
- id: motif:4
  label: Gate guardians become intercessors
  taxonomy_refs: []
  basis: Tammuz and Nin-gis-zida guard the gate of heaven, question Adapa, and become
    his intercessors with Anu.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage gives only a brief account of their question and intercession.
- id: motif:5
  label: Refusal of the food and water of life
  taxonomy_refs: []
  basis: Anu orders the food and water of life to be offered to Adapa, but Adapa obeys
    Ea’s warning and refuses the food of immortality.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The taxonomy provided has no exact motif family for life-food; symbol
    references to water and tree are more precise than a broad motif assignment.
- id: motif:6
  label: Origin of human mortality through lost access to life-giving food or tree
  taxonomy_refs: []
  basis: The passage states that Adapa’s refusal leaves mankind mortal and compares
    this with Adam’s exclusion from the tree of life in Genesis.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage itself stresses important differences between the Babylonian
    and Genesis forms.
- id: motif:7
  label: Divided divine counsel over human immortality
  taxonomy_refs: []
  basis: The passage contrasts Ea’s unwillingness for Adapa to become immortal with
    Anu’s offer of life-food and explains this as possible within Babylonian polytheism.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  confidence: medium
  cautions: The exact motives of the gods are summarized by the author and may require
    primary-text review.
- id: motif:8
  label: Bestowal of sovereignty and dominion on the primordial human
  taxonomy_refs:
  - royal_legitimacy
  basis: After refusing immortality, sovereignty and dominion are bestowed on Adapa,
    who becomes father of mankind.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage applies sovereignty and dominion to Adapa broadly; it does
