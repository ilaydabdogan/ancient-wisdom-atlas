  summary: The passage describes the Egyptian field of Alu as a paradisal afterlife
    realm ruled by Osiris, compares its location with Greek Elysion and early Babylonian
    paradise, explains the Osirian idea of the dead becoming an Osiris, relates this
    to the ka and embalming, and states that bodily resurrection and continued work
    formed part of Osirian afterlife belief.
