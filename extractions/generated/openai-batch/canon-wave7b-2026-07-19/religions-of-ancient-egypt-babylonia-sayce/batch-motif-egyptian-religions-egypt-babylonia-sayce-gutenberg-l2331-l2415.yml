canonical_text:
  quote: ''
  summary: 'The passage presents a scholarly account of the Heliopolitan Ennead: Tum
    as human-form sun-god and creator by generation, his relation to the primeval
    waters of Nu, the emanation of Shu and Tefnut, the subsequent divine pairs, and
    the adoption of this genealogy as an explanation of world origins. It then compares
    the Egyptian scheme with Babylonian and other Semitic patterns, especially wifeless
    supreme gods, creation by generation, paired divine emanations, and primeval watery
    chaos.'
  language: English
  quote_policy: summarized
