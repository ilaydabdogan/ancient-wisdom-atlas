canonical_text:
  quote: "“taken the hand of Bel”"
  summary: The passage describes the transfer of Babylonian sacred and royal authority
    from Nippur and En-lil to Babylon, Ê-Saggil, and Merodach. It summarizes a hymn-like
    account in which Merodach receives the names and powers of older gods, then distinguishes
    Babylonian divine identification by name and delegation from Egyptian pantheistic
    transmutation. It also explains the Babylonian idea that names express essence
    and that transfer of a divine name can transfer attributes and personality.
  language: English
  quote_policy: quoted
