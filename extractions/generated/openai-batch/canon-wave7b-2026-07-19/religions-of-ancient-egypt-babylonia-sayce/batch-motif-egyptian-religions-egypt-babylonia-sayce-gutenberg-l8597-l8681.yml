canonical_text:
  quote: ''
  summary: The passage compares the Sumerian Asari with the Egyptian Osiris, noting
    alleged similarities of name, ideographic form, beneficent character, and culture-bringing
    functions. It contrasts Osiris as a dead god of the other world with Asari as
    a helper of the living, then discusses Egyptian and Babylonian views of judgment,
    Asari's possible derivation from a title of Ea, animal forms and composite beings,
    Asari's identification with Merodach, and Merodach's rise with Babylon under and
    after Khammurabi.
  language: English
  quote_policy: summarized
