canonical_text:
  quote: ''
  summary: A scholarly discussion of Babylonian magical and hymnic texts describes
    lingering belief in seven evil tempest spirits, their origins in ravine clefts
    or stormy mountains, and ritual means of averting them through sacrificial flame
    and incantation. The passage then discusses the formation of magical canons, priestly
    chanters, exact and whispered recitation, local sanctuary hymn collections, hymns
    to deities such as the sun-god, moon-god, and Merodach, and a comparison between
    Chaldean hymns and the Rig-Veda.
  language: English
  quote_policy: summarized
