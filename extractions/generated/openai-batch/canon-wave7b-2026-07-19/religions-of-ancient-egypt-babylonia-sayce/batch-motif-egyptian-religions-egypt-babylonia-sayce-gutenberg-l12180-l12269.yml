canonical_text:
  quote: ''
  summary: The passage compares Babylonian temple ships with the Hebrew ark, describes
    the ship's ritual use and development into a portable shrine, reports a Balawât
    chapel discovery, and outlines Babylonian priestly offices, divine kingship, prophetic
    functions, purification rites, and oracular spaces.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that there was a parallelism between the temples of Babylonia
    and Jerusalem, with the Hebrew ark corresponding to a Babylonian ship.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Babylonian ship was dedicated to the god or goddess whose image it contained;
    it could be inlaid with gems and gold, bore a special name, and Bau's ship is
    described as that of “the holy cow.”
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: In early usage the ship had a captain and crew; later it was reduced in size
    and carried on men's shoulders, and in Assyria a throne or platform could take
    its place in processions.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: On festival days the god was rowed in the ship on the sacred river and was
    said to return to the pure waters of the primeval deep; later the ship became
    the deity's travelling home or concealed shrine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: At Balawât, Rassam found a chapel to the god of dreams with a stone coffer
    containing two alabaster cuneiform tablets recording Assur-nazir-pal's conquests;
    nearby stood a stone altar approached by five steps.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The native workmen who opened the coffer believed they had found the tables
    of the Mosaic Law, and the passage notes that those tables are said in the Old
    Testament to have been kept in the ark.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The temples were served by many priests, headed in early Babylonian history
    by the patesi or high priest, who performed royal functions and acted as the god's
    vicegerent.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'At Babylon, divine rights were conferred by adoption: the vicegerent of Bel
    took the god''s hand, became the god''s son, and gained the right to exercise
    sovereignty over humans.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: An early king of Erech calls himself the son of the goddess Nin-ṡun, and the
    passage describes the Babylonian monarchy as essentially theocratic.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: With Semitic supremacy, the king himself became a god; the patesi ceased to
    be the king and became the king's viceroy and lieutenant.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The term sangu came to denote a chief priest, with subordinate priests and
    temple workers including sacrificers, libation-pourers, oil-anointers, bakers
    of sacred cakes, chanters, wailers, weapon-carriers, prophets, augurs, soothsayers,
    necromancers, and inquirers of the dead.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The asipi or prophets are described as a distinct class who sometimes predicted
    the future, more often announced the will of Heaven, poured libations while prophesying,
    and had special responsibility for shrine purification.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Babylonian asip is distinguished from an astrologer and is described as
    counselling or foretelling human destinies, interpreting Ea's wisdom, and revealing
    Ea's counsels.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Holy of Holies in the great temple of Babylon, where Bel uttered oracles,
    and the ship in which the god's image was ferried are both associated with the
    “house of prophecy.”
  category: setting
  evidence_refs:
  - ev:7
