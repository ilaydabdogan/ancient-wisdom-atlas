canonical_text:
  quote: "“all the earth was sea, while in the midst of the sea was a water-course.”"
  summary: The passage contrasts an uncertain Nippur world-mountain cosmology with
    an Eridu sea-origin cosmology preserved in a Sumerian spell. In the spell, Merodach/Bel-Merodach
    forms land with reeds and dust, founds sacred places and cities, and creates humans,
    animals, rivers, and plants, with Aruru assisting in human creation. Sayce argues
    that the poem reflects marshland reclamation at the Persian Gulf and was later
    revised by Babylonian priests, who replaced Ea with Merodach.
  language: English
  quote_policy: quoted
