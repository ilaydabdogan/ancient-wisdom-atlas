  quote: The _Ba_ or “Soul,” with the figure of a bird and the head of a man
  summary: The passage contrasts mummification with secondary burial, links secondary
    burial to a shadowy breath-like surviving soul, identifies the Egyptian Ba as
    a bird-bodied, human-headed soul-form, and says later Egyptian religion left the
    Ba and mummy conceptions unreconciled. It also describes Egyptian religion as
    a conservative, non-systematic accumulation of old and new beliefs, illustrated
    by writing and by the regularity of Egyptian natural conditions.
