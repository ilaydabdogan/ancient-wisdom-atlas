canonical_text:
  quote: ''
  summary: 'The passage summarizes parts of the Egyptian Book of the Dead: the deceased
    ascends to heaven, encounters a water barrier, may cross by Thoth or by the ferryman
    Nu-Urru, enters or receives the solar bark, faces Osiris in the Hall of the Two
    Truths, and after judgment may enjoy Alu, visit the tomb-house, share offerings,
    and access the otherworld. It also describes chapters on offerings to the ka,
    mummy preservation, amulets, protective formulae, correct recitation, and the
    composite growth of the Book of the Dead.'
  language: English
  quote_policy: summarized
