canonical_text:
  quote: ''
  summary: The passage compares Babylonian Asari/Merodach with Egyptian Horus as champions
    of light and order, discusses Horus, Set, Anher, and Osiris within Egyptian religious
    development, links Set with Sutu/Bedawi traditions and regional conflicts, rejects
    some abstract origin interpretations, and explains Osirian resurrection doctrine
    through mummification, seed symbolism, and an idealized afterlife realm.
  language: English
  quote_policy: summarized
