    dragon episode.
- id: motif:2
  label: Twin divine antagonists and paired regions
  taxonomy_refs:
  - sacred_twins
  - sibling_pair
  - duality
  basis: Set is described as Horus's twin-brother and as representing the north against
    the south; paired Horus and Set animal emblems appear in royal context.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage presents this through historical monuments and secondary interpretation
    rather than a full myth narrative.
- id: motif:3
  label: Reciprocal divine parent-child relation
  taxonomy_refs:
  - divine_parent_child
  basis: Horus is said to become Osiris's son while at the same time being his father.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage frames this as a theological solution in the Osirian cult,
    not as an extended narrative episode.
- id: motif:4
  label: Resurrection through the mummified god
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: The passage says resurrection doctrine was attached to Osiris because it
    accompanied mummification and because Osiris was a mummified god; Osiris receives
    the dead where life and action are restored.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: high
  cautions: This is the author's explanatory model; it should not be treated as an
    ancient doctrinal statement without further primary evidence.
- id: motif:5
  label: Seed growth as analogy for resurrection
  taxonomy_refs:
  - resurrection
  - death_rebirth
  - seasonal_cycle
  basis: Later Egyptians are said to find an analogy to resurrection in seed sown
    to grow again, exemplified by corn sprouting from earth placed on an Osiris figure.
  evidence_refs:
