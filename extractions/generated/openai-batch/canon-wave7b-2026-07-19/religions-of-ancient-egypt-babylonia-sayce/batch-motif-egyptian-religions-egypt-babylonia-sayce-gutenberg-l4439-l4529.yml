- id: motif:1
  label: Champion of order defeats chaos monster
  taxonomy_refs:
  - chaos
  basis: Asari or Merodach conquers the dragon of chaos and demons of darkness; Horus
    is said to take that part in Egypt.
  evidence_refs:
