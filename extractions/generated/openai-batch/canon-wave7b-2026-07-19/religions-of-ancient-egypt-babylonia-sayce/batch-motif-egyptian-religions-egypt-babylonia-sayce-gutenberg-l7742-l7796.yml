canonical_text:
  quote: ''
  summary: The passage argues that Babylonian magical texts are overrepresented because
    of the Nineveh library and Assur-bani-pal's interests, distinguishes magic from
    official religion, describes magical survivals of earlier animism, compares an
    older Babylonian animistic view of the spirit with the Egyptian Ka, and describes
    a transition from ghost nourishment to offerings for the dead and gods associated
    with the grave and the sun-god.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Magical texts are said to form an undue proportion of examined Babylonian
    materials because study had depended on the Nineveh library, much of it collected
    by Assur-bani-pal, who favored charms, exorcisms, augury, and astrology.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the world of magical texts stood apart from orthodox
    faith and that magic was only partly recognized by that faith.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Professors of magic are described as being viewed with suspicion by the official
    priesthood.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Istar in the magical context is described as patronizing a witch and overseeing
    a poisonous philtre at night, while the state-religion Istar is described as a
    goddess of love and war, helper of Esar-haddon, and mother of mankind.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The State religion is said to have recognized magic insofar as it could be
    regulated and placed under priestly supervision, while magic still remained outside
    the official faith.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The magical texts are presented as preserving survivals from a primeval age
    of animism and as offering magic rather than religion, the wizard or witch rather
    than the priest.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author states that available materials do not allow the psychology of
    the Babylonians to be described with the accuracy and fullness possible for the
    Egyptians.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says that behind a later polytheistic view of the human spirit
    there lay an animistic view resembling the primitive Egyptian doctrine of the
    Ka.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The doctrine of the double is said to have been superseded by the doctrine
    of the soul, an immortal element reunited with the gods after death; the Zi, Lil,
    and Ekimmu are said to have yielded to a later conception of spirit.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Water and food that once nourished the ghost in the world below are described
    as becoming offerings to the dead man and to gods protecting him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: An Assyrian king is quoted as placing grave furniture beside his father in
    the grave and presenting gifts to spirits of earth and gods of the grave; the
    passage adds that the gifts are also presented to the sun-god.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The sun-god is described as associated with the deceased king and as the god
