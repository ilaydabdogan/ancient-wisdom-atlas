  summary: The passage describes organized female and eunuch cult personnel of Istar
    at Erech, compares the rites with Canaanite/Phœnician Ashtoreth worship while
    leaving their origin uncertain, distinguishes an official Istar from a witchcraft-associated
    “black Istar,” and explains how Istar absorbed local goddesses into geographically
    differentiated Istarât.
  language: English
