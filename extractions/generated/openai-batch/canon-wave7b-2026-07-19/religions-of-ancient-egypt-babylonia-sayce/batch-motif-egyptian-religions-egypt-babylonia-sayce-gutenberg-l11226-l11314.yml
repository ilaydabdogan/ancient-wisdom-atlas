  quote: ''
  summary: The passage summarizes Babylonian legends of Etana and the eagle, the eagle
    and serpent, and Istar’s descent to Hades in pursuit of Tammuz. It describes failed
    ascent to the heavens, divine or retaliatory punishment, the dark underworld as
    a land of no return, Istar’s passage through seven gates, her imprisonment, the
    resulting disorder in the upper world, and her release through a messenger of
    Ea and the water of life.
