canonical_text:
  quote: ''
  summary: 'Sayce summarizes later sections of the Babylonian creation Epic in which
    Merodach is glorified: Tiamat challenges the gods, Merodach is armed, defeats
    the dragon, creates or orders the world, divides Tiamat''s body, receives transferred
    creative functions, submits to or interprets cosmic destiny through tablets, and
    arranges the heavenly bodies, constellations, zodiac, months, gates, staircase,
    and moon. The passage includes explicit comparisons to Egyptian Hermopolis, Genesis,
    and the Urim and Thummim.'
  language: English
  quote_policy: summarized
