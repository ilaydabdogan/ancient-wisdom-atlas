  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Bel of Babylon is said to sit each New Year's day in a mystic chamber of the
    fates, determining mankind's destiny for the coming year.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: After the victory over Tiamat, particular posts in the sky are assigned to
    Anu, Bel, and Ea, and Merodach is credited with dividing heaven between the Babylonian
    triad.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Merodach prepares stations for the great gods, establishes corresponding stars
    as constellations, marks the year and zodiac, assigns three stars to each month,
