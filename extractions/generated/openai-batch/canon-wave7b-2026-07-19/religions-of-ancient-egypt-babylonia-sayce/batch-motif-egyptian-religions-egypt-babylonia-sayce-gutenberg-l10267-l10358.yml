- id: obs:4
  text: After Tiamat's destruction, Merodach cuts her in half like a flat fish and
    forms the canopy of heaven from one half; the fountains of the great deep are
    kept barred above it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that creative functions associated with En-lil were usurped
    by Merodach, and that Bel of Nippur bestowed on Merodach the name 'lord of the
