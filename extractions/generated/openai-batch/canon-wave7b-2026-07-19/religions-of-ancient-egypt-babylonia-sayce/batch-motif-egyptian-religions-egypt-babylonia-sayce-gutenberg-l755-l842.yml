- id: obs:3
  text: The newcomers are described as possessing copper weapons and gradually becoming
    masters of the Nile valley after battles remembered in tradition as involving
    the “smiths” who followed Horus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author treats the historical Egyptians as composed, at most, of Asiatic
    invaders from the south and two older aboriginal races, one probably Libyan, while
    rejecting evidence for an overland Mesopotamian invasion.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The passage says at least three types of religious belief and practice underlay
