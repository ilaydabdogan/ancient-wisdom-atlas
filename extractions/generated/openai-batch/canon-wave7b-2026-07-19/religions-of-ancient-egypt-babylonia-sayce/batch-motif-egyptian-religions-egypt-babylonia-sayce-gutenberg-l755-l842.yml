canonical_text:
  quote: ''
  summary: The passage presents Sayce’s account of Pharaonic Egyptians as Asiatic
    newcomers, probably with a Babylonian origin, who entered a Nile valley already
    inhabited by neolithic populations and eventually mastered it. It argues that
    Egyptian religion rested on multiple racial and cultural strata, with differing
    beliefs and rites. The passage then contrasts mummification, linked to resurrection
    belief and said to have spread slowly among Pharaonic Egyptians, with prehistoric
    secondary burial involving exposure of corpses, careful preservation of dismembered
    bones, and final burial. It notes similar exposure practices among Parsis and
    in New Guinea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Pharaonic Egyptians seem to have come from Asia
    and that their first home was probably in Babylonia.
