canonical_text:
  quote: Where the nation and its army were, accordingly, their god was as well.
  summary: The passage describes Assur as a national Assyrian deity whose presence
    accompanies the army and king rather than remaining tied to a locality. Assur
    is represented by a standard showing an archer rising from a winged sun, a symbol
    said to derive from Egyptian solar iconography and to express partial assimilation
    to Amon-Ra while retaining Assur’s anthropomorphic warrior character. The passage
    also presents Assur as supreme over other gods and as the divine authority behind
    Assyrian conquest and imperial worship.
  language: English
  quote_policy: quoted
