canonical_text:
  quote: all that existed at first was a chaos of waters
  summary: The passage describes a Babylonian cosmology in which name and existence
    are identical, the first condition is an unnamed watery chaos, creation proceeds
    through gendered generation of primordial pairs, chaotic beings precede bounded
    firmaments, and the later triad of Anu, Bel, and Ea represents sky, earth, and
    water.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that, for the Babylonian, name and existence were the same,
    so what had no name was not yet in being.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts the Babylonian view with the Hebrew view, describing
    the Hebrew as monotheist and as believing that the one supreme God made everything
    from the beginning.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Babylonian account is described as beginning with no gods; the gods themselves
    are said to have been created, and the first condition is a chaos of waters.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The word rendered as “chaos” is given as mummu, which Damascius explains as
    the world of thought or ideas.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mummu is described as having no outward form or content and as a dark, formless
    deep that can be imagined but not pictured or described.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The chaos is specifically described as a chaos of waters, and the author connects
    this with Eridu, the Persian Gulf, and a cosmology that saw water as the origin
    of all things.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says that the earlier creator god Ea has been displaced in this
    version, and that Tiamât is explained in the first tablet as the chaos of waters,
    even if later tablets present her as a dragon of popular imagination.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'Creation is described under the form of generation: the Deep and the chaos
    of waters become male and female principles from whom other pairs are generated.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Lakhmu and his consort are described as part of Tiamât’s monstrous brood and
    as representing early attempts to give form and substance to the universe.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The still chaotic and immature form of the universe is said to be suitably
    symbolized by beings that are half human and half bestial.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Lakhmu and Lakhamu are followed by An-sar and Ki-sar, identified as the upper
