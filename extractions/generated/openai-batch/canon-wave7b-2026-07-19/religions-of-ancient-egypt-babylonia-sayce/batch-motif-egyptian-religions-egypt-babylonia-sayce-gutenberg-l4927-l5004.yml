canonical_text:
  quote: ''
  summary: The passage describes the Book of the Dead and the Pyramid Texts as combining
    Osirian and solar afterlife doctrines. It contrasts Osirian judgment and paradise
    with a solar-bark journey through the night, notes incompatible conceptions of
    the Ka and the mobile soul, summarizes a tradition about the discovery of chapter
    64 under Thoth, and describes the first fifteen chapters as instructions for the
    soul leaving the mummy and passing safely beyond the grave.
  language: English
  quote_policy: summarized
