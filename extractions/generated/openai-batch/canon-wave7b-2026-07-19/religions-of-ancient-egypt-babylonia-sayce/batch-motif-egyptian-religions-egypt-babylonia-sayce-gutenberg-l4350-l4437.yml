  quote: ''
  summary: A secondary comparative passage discusses proposed identifications of Osiris,
    his relations with Horus, Set, and Anher, and an argued comparison with the Babylonian
    Asari or Merodach as a sun-god, benefactor, healer, and resurrection deity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage reports several proposed identifications of Osiris: mankind,
    the Nile, cultivated ground, and, in later solar theology, the sun sinking below
    the horizon to traverse the underworld.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Horus the morning sun-god is described as becoming the son of Osiris or of
    the night-form of the sun in this later theological arrangement.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Osiris is described as a mummified man and as the brother and enemy of Set.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Set is said to have become, for later Egyptians, an impersonation of evil
    and to have been identified with Apophis, the serpent opposed by the sun-god.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Set is described as symbolising the north and Horus the south; before Menes,
    Set is identified with Northern Egypt and Horus with Southern Egypt.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says Horus and his metal-bearing followers drove and finally overcame
    the armies of Set.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Set is interpreted in the passage as representing the older population of
    the Nile valley and as associated with desert nomads.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Osiris is interpreted as typifying the Pharaonic Egyptian and as being, like
    Horus, among the first Pharaohs; the passage says confusion between Osiris and
    Horus generated a younger Horus beside the older Horus.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In relation to Anher, Osiris is described as the sun-god after setting in
    the west and passing to the region of the dead in the underworld.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Osiris and Anher are described as the same deity under different forms, one
    presiding over the city and the other over its burying-ground.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage reports Mr. Ball's claim that the Sumerian Asari has the same
    name and the same ideographic writing as Osiris; Asari is also called Merodach
    and titled the god who does good to man.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Asari is described as the sun-god of Eridu, son of Ea, interpreter of Ea's
    will and wisdom, and communicator of culture and healing to humans.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Asari is described as helping worshippers by conveying magic formulas to ward
    off sickness or evil and to raise the dead to life.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Osiris and Asari or Merodach are described as dying and being buried; Merodach's
    temple at Babylon is also described as his tomb, and the divine death is followed
    by rising again in the morning.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The passage says that through spells received from his father, those who trusted
    in the god and shared in his death and entombment were also raised to life; it
