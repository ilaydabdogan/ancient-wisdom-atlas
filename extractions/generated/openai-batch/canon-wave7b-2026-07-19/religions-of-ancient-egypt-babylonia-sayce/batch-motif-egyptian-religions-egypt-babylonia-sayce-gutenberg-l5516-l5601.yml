candidate_motifs:
- id: motif:1
  label: direct worship of sacred animals despite official theology
  taxonomy_refs: []
  basis: The passage repeatedly contrasts official explanations of animal incarnation
    with evidence that bulls, a ram, cats, a swallow, a cow, a cobra, and an ox received
    worship, offerings, prayers, or adoration as animals themselves.
  evidence_refs:
  - ev:1
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: No supplied taxonomy family directly corresponds to animal worship as
    such.
- id: motif:2
  label: sacred tree receiving offerings and embodying or housing deity
  taxonomy_refs:
  - sacred_tree_axis
  basis: The passage describes prayer and offerings to a sycamore, identifies a sycamore
    as Hathor's body, links sacred trees with Hor-pes, Osiris, the bennu, and Ra's
    soul, and notes continuing bread and water offerings at sacred trees.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage supports sacred-tree worship and divine indwelling, but it
    does not explicitly describe an axis mundi or world-center function.
