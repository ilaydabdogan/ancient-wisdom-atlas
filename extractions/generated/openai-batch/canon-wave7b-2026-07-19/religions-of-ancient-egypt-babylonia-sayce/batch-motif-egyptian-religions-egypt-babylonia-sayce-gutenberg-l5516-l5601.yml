canonical_text:
  quote: ''
  summary: The passage argues that popular Egyptian worship of animals and sacred
    trees persisted beneath or alongside official priestly explanations. It gives
    examples of offerings and prayers to bulls, a ram, a sycamore, cats, a swallow,
    a cow, a cobra, and an ox. It also describes sacred trees associated with Hathor,
    Hor-pes, Osiris, the bennu, Ra, Mohammedan saints, and the Holy Family. The passage
    emphasizes the widespread fear and veneration of snakes, recounts a tale in which
    Ra is bitten by a venomous snake, and states that the cobra became an early royal
    symbol of deadly power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the State religion recognized the belief in the divinity
    of animals, including the worship of the bull Apis of Memphis, Mnevis of Heliopolis,
    and the ram of Mendes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The official explanation presented these animals as incarnations of Ptaḥ and
    Ra, but the passage says the people paid divine honours to the animals themselves.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A tomb scene at Thebes shows a peasant making morning prayer to a sycamore
    at the end of a corn-field, with offerings of fruit, bread, and water placed beside
    it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the official religion attached old tree worship to a god
    and treated the tree as a form in which a deity manifested.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sycamore of the south is described as the body of Hathor, with her head
    depicted appearing from its branches.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Opposite Siût, Hor-pes is said to take the place assigned elsewhere to Hathor
    in relation to the sacred tree.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that sacred trees beside the Nile still receive offerings
    of bread and water, now nominally associated with a Mohammedan saint.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A white dome of a shêkh's tomb often stands beside such a tree.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: A copied sepulchral picture at Hû is described as showing a small chapel representing
    the tomb of Osiris beside a tree on whose branches the bennu or phoenix is perched.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The tree of Matarîya is said to be venerated by Christians because the Holy
    Family was believed to have rested under it during their flight into Egypt.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says the Matarîya tree represents a sycamore in which the soul
    of Ra of Heliopolis was believed to dwell.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: A stela in Turin shows large figures of a swallow and a cat with an offering
    table before them and two kneeling scribes.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: The inscriptions on the Turin stela refer to offerings of flowers and prayers
    made to the good swallow and the good cat.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Another stela shows two pet cats sitting on a shrine, facing one another,
