  category: setting
  evidence_refs:
  - ev:10
- id: obs:17
  text: The passage states that snakes were especially numerous, feared, and venerated
    among animals worshipped by the people.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:18
  text: The passage links the prominence of the serpent in Egyptian mythology and
