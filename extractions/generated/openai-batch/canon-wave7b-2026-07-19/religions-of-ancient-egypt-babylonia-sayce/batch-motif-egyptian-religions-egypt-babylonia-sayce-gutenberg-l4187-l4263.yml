canonical_text:
  quote: He was a human god; he was the first mummy; and he became the god of the
    dead.
  summary: The passage presents the Osiris story as a composite of older mythic, theological,
    historical, and funerary materials. It discusses identifications involving Horus,
    solar additions to Osiris, the incorporation of Anubis and Nephthys, death customs
    reflected in Osiris imagery, Osiris as first mummy and god of the dead, the Field
    of Alu, the localization of Osiris at Busiris, the ram of Mendes as his soul,
    and a comparison between Egyptian lord/lady divine titles and Babylonian usage.
  language: English
  quote_policy: quoted
