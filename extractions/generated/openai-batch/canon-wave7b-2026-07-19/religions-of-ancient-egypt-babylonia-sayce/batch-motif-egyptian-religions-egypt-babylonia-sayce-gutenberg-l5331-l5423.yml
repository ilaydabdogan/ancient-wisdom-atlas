canonical_text:
  quote: ''
  summary: The passage summarizes Sayce's account of the Book of Am Duat and the Book
    of the Gates. Osiris's realm is incorporated into the sun-god's nocturnal underworld
    journey, where the solar bark passes through regions or hours, encounters serpent
    enemies, and provides only temporary light to the dead. The Book of the Gates
    keeps the solar-bark structure but changes details, including gates, fire-breathing
    serpents, Osiris's judgment hall, punishments of enemies, and the sun-god's final
    emergence through Nut over the body of Osiris. The passage also describes a theology
    of salvation through magical knowledge, absorption into the sun-god for a few,
    darkness for other souls, and later skeptical views of the underworld.
  language: English
  quote_policy: summarized
