canonical_text:
  quote: ''
  summary: 'The passage argues that some elements of Greek myth and thought, including
    parts of the Herakles legend and later Alexander romance, show Babylonian influence,
    especially through motifs associated with the Epic of Gilgames and the failed
    search for immortality. It then describes the Babylonian temple as the civic,
    economic, religious, and political center of the city: the ruler is linked to
    priesthood and divine vicegerency, the priesthood can authorize kings, and the
    temple develops from a raised platform reclaimed from swamp water into a brick-built,
    repeatedly restored mound or tel.'
  language: English
  quote_policy: summarized
