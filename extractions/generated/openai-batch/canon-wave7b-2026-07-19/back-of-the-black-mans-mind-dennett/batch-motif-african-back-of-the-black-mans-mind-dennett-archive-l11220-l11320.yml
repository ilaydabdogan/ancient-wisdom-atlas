canonical_text:
  quote: ''
  summary: The passage describes a dance by a Chief's wives and ladies with drums,
    beaded calabashes, chorus singing, and praise of a husband. It then describes
    the hill town of Otwaw, a rest-house plateau with trees and a net-like juju called
    OSUMEGBI, and a named Egugu dance witnessed there. The Egugu dance is reported
    by Bini attendants to be the same as their Ovia dance and by the old Chief to
    last three days and recur for three more days after about three months. Masked,
    palm-leaf-draped performers crack whips, move through the town and plateau, are
    followed by crowds who howl or crow like cocks, and finally go to a sacred grove
    to continue all night.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A square space with recesses is described; the Chief's wives are crowded in
    one recess, and dancing occurs on a mud platform in front of it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some wives play drums, others beat beaded calabashes and sing choruses, while
    different ladies rise to dance and sing; one song is described as full of the
    singer's husband's praise.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Otwaw is reached after uphill travel and is described as lying in a hollow
    at the top of a very high hill, with houses on little plateaux at different levels.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Near the rest-house plateau are an old fig tree, an IKHIMI tree, and a pole
    between two small trees bearing a net-like juju called OSUMEGBI.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator and the Conservator witness the Egugu dance; Bini boys identify
    it as the same as their Ovia dance, and the old Chief says it will continue for
    three days and recommence for three days about three months later.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Just before dark a man appears wearing an orange palm-leaf hat, a network
    mask and mantle, palm-leaf strips covering the body, black network on arms and
    legs, ankle fringes over bells, and a long plaited palm-leaf whip.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The first masked figure rushes onto the plateau and cracks his whip; people
    crowding the surrounding streets howl, follow him down the town, and horns are
    blown.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Four similarly dressed men and five smaller black-masked men come up the street
    with the crowd, run away, return singing a jerky march, move to the upper town,
    return again, crack whips, and retire; the crowd crows like cocks and some blow
    horns.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A differently clad Egugu appears with a crown-like lath mask bearing cotton
    tufts and white streamers, a black network mask, a mantle covered with porcupine
    quills, and a white fringe-like dress.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The differently clad figure makes three entrances onto the plateau; then all
    the dancers and the crowd run to their sacred grove, crowing, blowing horns, and
    continuing to crack whips all night.
  category: sequence
  evidence_refs:
  - ev:8
