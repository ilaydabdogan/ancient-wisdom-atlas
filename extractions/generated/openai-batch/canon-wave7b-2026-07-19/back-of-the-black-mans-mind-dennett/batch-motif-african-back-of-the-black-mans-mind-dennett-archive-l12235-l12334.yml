- id: obs:2
  text: A hunter who killed a leopard had to take it to the Oba, who gave the hunter
    a boy and a girl; the Oba sought to obtain a live leopard for sacrifice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After sacrificing a leopard, the Oba marked his forehead with its blood; leopard
    skin and claws were made into royal or chiefly objects.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women were not allowed to look at the leopard's face, and the dance connected
    with the leopard ceremonies was called Igwe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When a chief's father died, elephant tusks were placed on an altar in Aruenimi,
    and the elephant's head and the gun used to shoot it were placed in the sacred
    ground Efifi; the dance was called Ikwefai.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: When an elephant was killed, specified portions went to the Oba, the Oba's
