canonical_text:
  quote: ''
  summary: In the preface, Dennett argues that West African government and religion
    are tied to the kingly office, that the king is also priest, and that political
    regeneration depends on purifying that office and its ancient system of government.
    He frames the book as an attempt to understand African thought, credits Mary H.
    Kingsley with publicizing West African problems, and thanks scholarly societies,
    photographers, and N. W. Thomas for publication permissions, images, and editing.
  language: English
