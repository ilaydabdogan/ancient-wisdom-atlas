canonical_text:
  quote: ''
  summary: 'The passage introduces Bavili philosophy through the king’s titles and
    their connection to six divisions of sacred symbols: groves, lands and rivers,
    trees, animals, omens, and seasons. It describes the king as linked to these divisions
    through specific titles, conjectures that sacred groves may once have served as
    places where the king taught symbolic lessons, and notes an ordered grouping of
    twenty-four symbols per division, with a possible total of 144. It then introduces
    eight compound Xivili words that the author says imply a 1+6+1 structure.'
  language: English
  quote_policy: summarized
