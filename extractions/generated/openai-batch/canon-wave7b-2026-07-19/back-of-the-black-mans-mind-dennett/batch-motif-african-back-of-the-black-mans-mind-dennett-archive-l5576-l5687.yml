canonical_text:
  quote: ''
  summary: 'The passage presents a table of Bavili seasonal groups, months, and products,
    then explains a generative sequence in which named seasons are gendered as female
    or male, produce effects, and become causes. Mawalala is described as the final
    effect and later as a cause and season of rest. A second section classifies the
    seasonal groups under six categories: Water, Earth, Fire, Procreation and Motion,
    Fruitfulness, and Life, while warning that European category names only imperfectly
    represent the native ideas.'
  language: English
  quote_policy: summarized
