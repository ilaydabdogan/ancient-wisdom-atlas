canonical_text:
  quote: ''
  summary: 'The passage describes several Bini sacred or ritual installations: a hollow
    clay pillar called Iko at Okpwebo with three Achatena shells inserted in it; an
    altar to Oyisa at Adenyoba near the Ovia river, placed under a shed beside an
    ornamented whitewashed pillar or Iko, with Ikhure sticks and a pot of water; and
    a squat pillar in the bush near Ova called Adambi and described as female or as
    a woman “Juju.”'
