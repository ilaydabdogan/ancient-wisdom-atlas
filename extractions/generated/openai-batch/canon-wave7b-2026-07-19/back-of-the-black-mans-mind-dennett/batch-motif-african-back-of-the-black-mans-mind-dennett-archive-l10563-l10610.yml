canonical_text:
  quote: ''
  summary: 'The passage describes several Bini category figures and implements: the
    axe Ogwana linked to Ogun and a story of an old woman banished to the moon for
    cutting wood on the first day; the machete Ikhu; the Oba''s flat knife Eben used
    in supplication; the sacrificial knife Ada; and the two-pronged Eleli. It then
    explains the Oba as God''s representative, descended through Ife, and says the
    Ematon conveys a threefold account of human nature and knowledge. The passage
    closes with a pillar called IKO at Ebiyawmalo, glossed as a meeting.'
  language: English
  quote_policy: summarized
