canonical_text:
  quote: ''
  summary: The passage describes a boy in palm-leaf attire carrying a palm-rib staff
    called Eran, nocturnal dancers moving toward a grove sacred to OviA, and the narrator's
    morning inspection of the grove with posted dresses, sacred plants, an Olukun
    tree, the Eran, a calabash, a pot, ashes, and fowl feathers. It then describes
    a market near the OviA/OSSE river and a spontaneous circle dance in which boys
    beat sticks, spin, and are joined by Ranger Mockpai.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy wore a skirt made of strips of palm leaves and carried a staff called
    Eran, made from the rib of a palm leaf, notched at intervals and topped with strips
    of petiole.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dancers sang, moved by gliding rather than ordinary dancing, made a cooing
    noise like the Okku bird, and went toward the grove sacred to OviA.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Until long after midnight, the dancers rushed past the narrator's shelter
    while cooing and singing in falsetto; cries were also heard from the direction
    of the grove.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The next morning, the narrator saw twelve dresses arranged on posts in a line
    before the grove entrance, with the boy's smaller dress in the same line but apart.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ikhimi trees were planted at the grove entrance, Kola trees lined both sides
