  summary: The passage introduces a study of sacred lands, rivers, and provincial
    names in Luango/Kongo geography. It describes Sonio/Soio and Ngoio as paired province
    names associated with fatherhood and motherhood, explains a gendered orientation
    of riverbanks, reports Neamlau’s statement about the dangerous office of Nganga
    Ngoio, and recounts a tradition in which Kongo sends sons to govern provinces
    with Ngoio as a high priest.
