canonical_text:
  quote: ''
  summary: The passage describes BUALI as the central province surrounded by six provinces,
    with Maluango's XlBlLA or sacred grove in its middle. It glosses BUALI as the
    deep of breathing life. It names the sea Mbu, the deep or enclosed space, and
    locates Mbungu Ntwali, the deeps of maternity, at river-mouth whirlpools where
    fresh and sea waters meet. It identifies the KuiLU as Luango's principal river,
    glossed as to and from the sky, names its tributaries, and identifies Lake Nyanga
    as the source of the Nyari/KuiLU upper reaches.
  language: English
