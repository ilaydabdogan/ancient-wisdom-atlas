canonical_text:
  quote: ''
  summary: The passage presents a table of Bavili philosophical or cosmological categories
    and associated ideas. The categories are Water, Earth, Fire, Motion, Fruitfulness,
    and Life. Water is associated with morality, wisdom, virtue, breath, speech, inspiration,
    hearing, mouth, and fatherhood. Earth is associated with solids, justice, reason,
    intelligence, essence, seed, herbs and grass, hands, stomach, heart, and motherhood.
    Fire is associated with love, desire, marriage, union, spirit, light, kernel,
    tying up, heat and cold, womb, and smell. Motion is associated with touch, the
    penis, conception, germination, thunder, and lightning. Fruitfulness is associated
    with weight, energy, plenty, pregnancy, harvest, sight, memory, and leg. Life
    is associated with birth, parturition, pain, taste, and lips.
  language: English
