canonical_text:
  quote: ''
  summary: 'The prefatory passage states Dennett''s two aims: to argue that African
    fetishism or Jujuism coexists with a higher conception of God, and to show the
    importance of the kingly office to African communities. It compares this coexistence
    to ancestor worship and fetishism among Israelites and to superstitious customs
    in Christian countries, and it says missionary success depends on understanding
    the African conception of God.'
