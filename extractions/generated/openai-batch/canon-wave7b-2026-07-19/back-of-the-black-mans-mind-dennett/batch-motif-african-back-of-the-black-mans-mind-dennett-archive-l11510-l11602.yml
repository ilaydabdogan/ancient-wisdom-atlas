canonical_text:
  quote: ''
  summary: The passage describes Bini market days, chalk marks renewed at a sacred
    grove, four named days associated with royal officials, and a thirteen-lunar-month
    year divided into seasons and periods. It explains Ikhure, Ehaw, Igwe, and Iheuku
    through rains, yam planting and harvest, hospitality, care of children, dry-season
    rest, and numerals, while comparing some calendrical features with Bavili and
    Kongo terms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the fifth day, Ekinya is again the market place, and the other three markets
    continue in the stated order to complete eight days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The juju doctor, named Obo, renews chalk marks in front of the Aro or sacred
    grove on the first day, Edeken, and again on the fifth day, also Edeken.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Four days are named Edeken, Ed'AHO, Ed'awrie, and Ed'okwaw, and each is spoken
    of as belonging to a named royal functionary.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Bini year is described as divided into four parts and thirteen lunar months,
    and as having six or seven seasons depending on whether the first month is counted.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The joining month is called Ikhure among the Bini; it is linked with drizzling
    rains before the rainy season, yam planting, and the season of love or spring.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ehaw includes Ihedu and Ihema, with tornado months and months of heavy rains,
    and is defined as the custom of giving food to a stranger when he arrives in a
    town.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Igwe includes Igwe and Agwe, with little dry season, heavy rain, tornado,
    and a month of rest and quiet; the related word is linked with weight, care and
    dress of children, and harvest.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Iheuku contains Ahishuku and Iheuku, together forming four dry-season months.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that the Bini number their months rather than naming them,
    and that the meanings of month names are to be sought in the meanings of numerals.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The first month of the dry season is described as following the yam harvest,
    when people 'rest and chop'; the word for one is given as 6wu, and Owu is said
    to mean death or the beginning and end of all things.
  category: relationship
  evidence_refs:
  - ev:9
