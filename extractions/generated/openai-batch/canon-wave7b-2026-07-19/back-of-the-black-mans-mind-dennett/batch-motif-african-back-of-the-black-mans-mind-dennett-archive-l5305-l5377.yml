canonical_text:
  quote: ''
  summary: 'The passage lists Bavili names, places, and symbolic associations: Mamu-Nzambi
    towns linked to palavers after a prince''s death; Mbungu-Ntwali at river mouths
    and water-vessel sayings and rites; royal and ordinary funeral uses of mugs or
    water bottles; the crab and leopard as sea and earth symbols in palavers; Mania-Matali
    as a rocky river district associated with cold stones, moonlight, and a princely
    womb; and plate captions for burial preparation images.'
  language: English
  quote_policy: summarized
