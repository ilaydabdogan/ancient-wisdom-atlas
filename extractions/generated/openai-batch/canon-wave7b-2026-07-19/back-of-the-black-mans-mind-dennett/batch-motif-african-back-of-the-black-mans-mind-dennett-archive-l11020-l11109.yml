canonical_text:
  quote: ''
  summary: The narrator’s party waits at a river crossing, deals with a food-taking
    dispute among attendants, sends two men across on a raft, and later learns the
    raft overturned before the men were rescued by canoes. The party crosses through
    a difficult network of river channels. At Ugo, an old Jakri says Og'ugu has invited
    people because he is “making father.” Og'ugu welcomes the visitors, agrees to
    proceed with the festival, provides wood, fire, water, and food, and after dark
    crowds with lamps and torches gather before his residence, where several altars
    stand in the entrance wall and Og'ugu stands before one altar.
  language: English
  quote_policy: summarized
