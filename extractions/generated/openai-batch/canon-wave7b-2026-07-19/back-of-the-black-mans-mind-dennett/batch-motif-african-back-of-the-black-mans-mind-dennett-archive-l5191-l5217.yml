canonical_text:
  quote: "“Moral — Better be a thief than a wizard.”"
  summary: A wizard repeatedly places a dead victim on a shelf, but a sleeping thief
    unknowingly pushes the body down. The wizard becomes frightened, flees, and later
    mistakes the thief at his door for the corpse. The thief summons the townfolk,
    who drag the wizard out, give him Nkasa, and burn him. The narrator then states
    that the place discovered was a Kakongo sacred grove, not the home of a wizard
    or thief, and that companions had concealed this.
