canonical_text:
  quote: ''
  summary: The passage lists names, class labels, and several offices. Abiogbe is
    described as an office held by Okaiboga and Okaiwagga, with their follower OkadogTra;
    it handles land questions, and Okaiboga conducts sons of the Oba to countries
    where they are to act as viceroys. Before H.B.M. Government took over the protectorate,
    the chief received yearly presents from inducted viceroys, and the pair were in
    charge of policemen called Okow. Ihogbwi is described as the office of sacrificers,
    held by I ham A and SlGHURE with assistant Legama. Iwase is described as the office
    of learned doctors.
  language: English
  quote_policy: summarized
