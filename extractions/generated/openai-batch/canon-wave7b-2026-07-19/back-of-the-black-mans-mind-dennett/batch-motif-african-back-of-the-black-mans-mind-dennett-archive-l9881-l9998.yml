canonical_text:
  quote: ''
  summary: 'The passage describes the administrative and spatial organization of Benin
    City around the Oba''s Compound: villages under Ogies and headmen, palace roads,
    walls and ditches, named quarters, palace household divisions, a moon-observing
    quarter, and a sacrifice spot near the Gilly Gilly road. Footnotes add reported
    details about bodies on a road and eunuch practices.'
  language: English
  quote_policy: summarized
