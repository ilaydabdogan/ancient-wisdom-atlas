canonical_text:
  quote: It is used as a divining board or a tally of the seasons indiscriminately.
  summary: The passage introduces a photograph of a Bini house wall with a white figure
    built into dark red clay. The author describes the figure as a religious “formula”
    used as a divining board or seasonal tally, with a bird above it representing
    IFE, a wagtail associated by Luango people with the origin of the drum. The passage
    links IFE/Ifa with Yoruba spiritual and oracular traditions and gives an etymological
    comparison involving Bavili creator terminology.
  language: English
  quote_policy: quoted
