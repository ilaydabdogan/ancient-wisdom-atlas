canonical_text:
  quote: ''
  summary: The passage describes roads, quarters, walls, groves, trees, wells, pits,
    and ruins in Benin City, with special attention to the Oba's compound, Queen Mother
    sites, blacksmiths, ritual locations, sacrifices to Rain and Sun powers, new Yam
    rites, and palace bronzes described as historical symbols.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the Ikpoba road, blacksmiths had shops near Idumigun ni Inya Yugi, and
    the grove Ar'ORE was near the river Ikpoba.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the Udo or Siluku road, Idumiobiecisa is identified as a place where a
    witchcraft test used to be administered, and Azama is identified as a place where
    the Oba-elect went before being crowned.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the Shelu road, Iyakpa is described as a gate dividing the Queen Mother
    from her people, and Eeya is described as the Queen Mother's new quarters.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Aro'sa, called God's Grove, is described as the place where the Oba sent his
    son with a goat to sacrifice immediately after the Oba had been crowned.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The late Oba's palace was nearly in the centre of the Oba's Compound, with
    predecessors' palaces and ruins to the north-west, and near those palaces were
    deep wells where bodies of sacrificed human beings were thrown.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The back semicircular wall around the Oderie, or wives' quarter, was considered
    sacred, and outsiders were not allowed to touch it under penalty of death.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage names a sequence of walls and quarters in the compound, including
    Oboloba, Ozamoko, Ugohe, Idumiwebo, Urukpota, and Ugwozola.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Deep pits called Iridiawai and other holes in the palace ruins are described
    as places connected with burial of visitors whom the late Oba did not wish to
    see again.
  category: setting
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Palace bronzes are described as arranged along the walls and as historical
    symbols recalling chief events in the past history of the Bini people.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: People were sacrificed to the Rain power under a tree inside the first or
    second wall, and the ceremony was called AlYAWOMANAMI.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: People were sacrificed to the Sun power under the Ubogwe tree outside the
    compound, while ceremonies connected with the new Yam Juju were commenced under
    the Okha and Ulohe trees.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the Oderie, under the Ikhimi tree, cows were sacrificed.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: At Ogyuwo there was a place and a tree to which people used to be tied.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Blacksmiths are described as still working in iron and brass in different
    parts of the city.
  category: action
  evidence_refs:
  - ev:11
