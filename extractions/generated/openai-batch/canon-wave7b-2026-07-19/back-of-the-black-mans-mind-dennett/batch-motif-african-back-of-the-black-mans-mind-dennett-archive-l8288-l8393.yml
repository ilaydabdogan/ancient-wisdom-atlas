canonical_text:
  quote: ''
  summary: The passage classifies several kinds of Bavili Xina restrictions attached
    to offices, shrines, illness treatment, household fetishes, and animal parts found
    in the sacred grove. It then describes animal-associated objects and roles, including
    the Mpakasa wild ox, sawfish snout, Nkaka crocodile scale, Beci fish scales, and
    fowl used in offerings and healing contexts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Certain offices or situations are said to carry particular Xina, with examples
    including Fumu Zinkondi or Zinkata and the pig Ngulubu, Badungu and the Nziku,
    and Punzi and food cooked by an unmarried woman.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each Xibila is said to have its Xina; Bunzi is described as hating unmarried
    women, and Xikanga Nxiluka are described as hating noise.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: During sickness treatment, certain foods may be Xina, and a patient may be
    ordered not to eat certain flesh together with a companion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ownership of certain household fetishes or bracelets carries food restrictions;
    the Ngofo bracelet wearer may not eat Mpuli fish with another person and may not
    kill and eat an animal on the same day.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Parts of some animals are described as being found in the sacred grove, a
    class called Xina Xi Bifumba.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The leopard skin enters the Xibila only as part of an individual's dress;
    the eel and cricket are not found there; the Mpakasa is called the greatest symbol
    entering the Xibila of the Bavili.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: In Bavili stories, the wild ox usually acts as servant or ambassador of the
    Leopard or another princely animal and is often sacrificed while performing a
    duty.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: When Nzambi sent the wild ox for the wagtail's drum, the wild ox was killed
    by the followers of the wagtail.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The ox tail called Mawso is the sign of office of all the Kongozovo among
    the Bavili and is linked in the passage with obedience to authority.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: The wild ox is described as alert and sensitive to sound; its horns and head
    are found in the Xibila.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Badungu carry the snout of the sawfish Bafu as their sign of office, and
    the snout is found in the Xibila.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Nkaka is a crocodile-like reptile eaten by Bakuni woodmen; it lives in
    underground riverbank holes, and its scale is found in the Xibila.
  category: object
  evidence_refs:
  - ev:11
- id: obs:13
  text: A Bakuni hunter uses fire and stones at entrances to the Nkaka's hole to drive
    and suffocate the reptile, but may be trapped if the reptile blocks the main entrance
    with its body.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The Beci, identified as a silver fish, damages fishing nets, is connected
    with a saying about losing right in a palaver, and has scales found in the Xibila.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:15
  text: White fowls are used as offerings by those going to the Xibila to ask a favour.
  category: action
  evidence_refs:
  - ev:13
- id: obs:16
  text: A fowl may be tied before a sick man during a Nganga's cure; it is a sign
    of good faith, is expected to die if the Nganga does not act fairly, and may be
    killed so its blood can be used in medicines.
  category: sequence
  evidence_refs:
  - ev:14
