canonical_text:
  quote: ''
  summary: The passage describes legal and ritual obligations among Maluango as king,
    provincial princes, Kongo Zovo, the people, and outside land users. It lists tribute
    and emergency aid owed to the king, distinguishes private roads from public God-created
    roads, identifies Buali as the sacred central province where the main roads cross,
    and states that the king holds the country in trust from God through the powers
    for the people. It also gives procedures for a white man to receive land-use rights
    through compensation and princely bestowal. The final section describes inheritance
    after death, the wife’s role as key keeper and guardian of wealth, the order of
    heirs, the inheritor’s obligation to assume debts, and a burial-time sword procedure
    for creditors to declare claims.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Maluango is described as prince of Buali and, as king, sends messages to princes
    demanding aid in emergencies.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prince must send the king specified goods, including animal skins, chalk,
    saga ngo, and native money mats.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Private roads from villages through Kongo Zovo lands may be restricted to
    strangers, while public roads are called God-created roads.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The public roads cross at Buali, described as the sacred and central province
    of the Bavili or Luango, and are named by east, west, south, and north directions.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sacred groves, lakes, lagoons, rivers, bush, ownerless lands, and certain
    natural products are described as public or common resources.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The king is said to hold the whole country in trust from God, through the
    powers, for the use of the people.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A white man wishing to occupy land applies to the Kongo Zovo, who marks off
    land for his use; the white man compensates the Kongo Zovo and the family for
    loss of use.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The prince sends officers to witness the Kongo Zovo’s act of self-sacrifice
    and supplies the white man with an interpreter titled Mafuka.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: During the prince’s official visit, the white man supplies six personages
    with chairs or stools and places checked cloth called the cloth of law on the
    prince’s chair.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The prince bestows the land on the white man and his successors, after which
    the white man pays the prince in goods and a small percentage on produce he buys.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: At a death, relations come to weep, and the wife of the deceased gives the
    key of the house containing wealth to the person she knows to be the rightful
    inheritor.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The stated inheritance order begins with the deceased’s brother by the same
    mother, then the sister’s son, then the mother’s relations, and failing these,
    the child.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The wife most loved and esteemed by the deceased is guardian of his wealth
    and keeper of the key, but she inherits nothing.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The natural inheritor cannot refuse the succession and must take over the
    debts.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Before burial, the inheritor plants a sword in the ground before assembled
    guests, and a creditor may place a hand on it and declare that the deceased owed
    money or goods.
  category: action
  evidence_refs:
  - ev:8
