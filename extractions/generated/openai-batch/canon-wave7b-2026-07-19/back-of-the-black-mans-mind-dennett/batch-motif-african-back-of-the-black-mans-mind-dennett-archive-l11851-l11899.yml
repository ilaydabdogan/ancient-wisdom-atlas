canonical_text:
  quote: ''
  summary: 'The passage describes Bini ritual or shrine features: an Ake lean-to shelter
    with water and food at the foot of trees, a doorway bamboo pole with a basket-like
    top identified by different names, and interior figures including Oke as doorkeeper,
    a mounted officer, Iyase as prime minister, and central figures representing Oyisa
    and Esu. Esu is described with slave dress, a knife, and an Ukpopo staff.'
