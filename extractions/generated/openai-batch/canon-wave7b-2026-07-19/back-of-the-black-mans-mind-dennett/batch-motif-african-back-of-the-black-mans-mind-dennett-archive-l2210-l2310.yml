canonical_text:
  quote: ''
  summary: The passage describes Bavili marriage procedures involving adornment, dancing,
    gift exchange, a white handkerchief, food offerings, parental mediation, and final
    handover of the bride. It then states duties of spouses, rules for adultery compensation,
    divorce and pledge return, child custody, and categories of relationship.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bride is adorned with brass leg and arm rings, coral necklaces, and other
    ornaments, then taken to the expectant bridegroom; dancing and singing after washing
    may continue through the night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The husband gives presents to the bride's father's relations, gives his wife
    a white handkerchief the next morning, receives food from women with the couple,
    makes a return present, and the bride returns to her father's house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The husband sends his father and mother with a present to his father-in-law
    to ask that his wife be sent to him; the father-in-law sets a return day, gives
    presents to the husband's parents, and later brings his daughter back with a present.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the presence of the husband's parents, the father-in-law exhorts the husband,
    advises his daughter, and finally hands her over to her husband.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The married couple are said to have two fathers and two mothers, owe obedience
    to them, and must treat them equally as members of one family.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: If the wife commits adultery, the first offence may be forgiven; on a second
    offence she may be returned to her father, who must return the pledge money.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A guilty male adulterer must pay an indemnity or fine set by the husband,
    even if he must pawn himself as a hostage.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: If the husband is caught in adultery, the first offence may be forgiven; on
    a later offence the wife reports it to his parents, the man must pay, and she
    may leave for a time.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The woman's stated duties include planting, cooking, carrying wood, and drawing
    water; the man's duties include family religious and fetish rites, care of sick
    relations and burial, providing goods, building the house, and cutting bush for
    planting.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Long absence and non-support may lead to divorce; after waiting, the wife
    may consult the husband's parents, and with their consent return to her father
    and remarry.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: If the first husband reappears, the pledge is returned to him; if the parties
    cannot agree, the father returns the pledge and both are free to marry again.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Very young children go with the mother; daughters remain with the mother,
    while sons old enough to be without the mother's care go to the father; the father
    must help sustain the children.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage lists relationship categories including own children, elder brother's
    children, brother's children, uncle's children, grandparents' children, father's
    sister's children, nephew's children, children in pawn, bought slaves, and children
    of slaves.
  category: relationship
  evidence_refs:
  - ev:9
