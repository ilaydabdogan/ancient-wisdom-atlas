canonical_text:
  quote: ''
  summary: The passage describes Bavili judicial procedures in which unresolved disputes
    are referred to ritual specialists who use divination or ordeals to determine
    guilt. It then describes judgment, payment, reconciliation oaths, court fees,
    corporal punishment, temporary restraint, and pawn or slave status for a debtor
    until repayment by family.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a case cannot be finished by oral proceeding, a Nganga is called to divine
    who is guilty.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Mbundu Ncitu procedure, the Nganga takes the herb first and falls in
    the direction of the guilty party.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the prince is informed, one representative from each party eats the
    Mbundu Ncitu; the guilty party falls down, while the innocent party lets three
    drops of urine fall on a leaf placed between the legs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nganga Bisengo has a small box with a tight-fitting lid that will not separate
    from the box when the guilty party is present.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nganga Mbele has a heated knife that burns only the guilty party.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: After judgment, the called parties are brought to the assembly, and each side
    takes its representative.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The King tells the culprit the payment amount and the day on which payment
    must be made in his presence.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: When payment is made, the judge asks both parties if they are satisfied.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: If the judge is Maluango, the parties place their hands on the ground under
    his chair and swear to let bygones be bygones.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: If the judge is a Kongo Zovo, the parties put their hands on his head and
    swear.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Each day the palaver lasts, each party pays the judge one large calabash of
    palm wine.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: When judgment is given, each party pays Kama Zimbongo per day.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Corporal punishment is described as a matter for the father to inflict in
    his village.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Refractory prisoners are put in the yoke temporarily, and the passage states
