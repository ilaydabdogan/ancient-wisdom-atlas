canonical_text:
  quote: ''
  summary: The passage reports two leopard attacks. In each, a leopard enters a sleeping
    space, passes over one person, and attacks a selected victim. Diviners are called
    to identify the human owner or handler of the leopard. In the second case, Maxienzi
    is accused, a palaver is held, Maluango says the decision belongs to God, and
    Maxienzi takes nkasa; his vomiting is treated as proof of innocence, though Xikaia
    and his people dispute the result.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two boys were sleeping in an outhouse used as a kitchen; a leopard entered,
    passed over one boy, killed the son of XIKAWMO, and wounded the other boy during
    its flight.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: XIKAWMO brought the matter to Maluango and asked who had the leopard; diviners
    were set to work and identified a man of Ntanda Bilala as the owner of that leopard.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: XIKAWMO asked who had eaten the flesh of the Bilala man, reasoning that the
    Bilala man could not have sent the leopard to kill his son unless someone from
    the boy's family had first injured him.
  category: speech
  evidence_refs:
  - ev:3
  - ev:8
- id: obs:4
  text: Xikaia's wife was sleeping with another woman when a leopard broke open the
    door, passed over the other woman, carried away Xikaia's wife, ate her, and left
    only her head.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Zinganga divined that Maxienzi was the owner of the leopard that killed
    Xikaia's wife; Xikaia destroyed Maxienzi's house and plantations and complained
    to Maluango, who arrested Maxienzi and advised him to take nkasa.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the palaver, it was proved that Maxienzi had asked the acknowledged owner
    of the leopard to lend it to him; Maxienzi declared himself innocent, and Maluango
    said the decision was in the hands of God and that Maxienzi should take nkasa.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Maxienzi went to Mambuku's town, received nkasa, vomited, and this was treated
    as proving that he was innocent.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Xikaia and his people said that Maxienzi used his knowledge as a Muntu a Ndongo
    to avoid the proper result; the supplied passage breaks off after the word 'proper.'
  category: speech
  evidence_refs:
  - ev:9
