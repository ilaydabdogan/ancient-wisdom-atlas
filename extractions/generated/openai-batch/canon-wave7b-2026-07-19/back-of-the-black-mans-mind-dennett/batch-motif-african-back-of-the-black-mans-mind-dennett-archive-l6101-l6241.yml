  summary: The passage describes Bavili sacred groves as part of an ordered sacred
    geography. The author reports that 19 of 24 groves can be related to seasonal
    categories, suggests the same formula may apply to sacred lands, rivers, trees,
    omens, and animals, estimates that many more groves may exist, lists additional
    grove names with literal meanings, and reflects that place names encode spiritual
    teaching.
