candidate_motifs:
- id: motif:1
  label: deceptive acquisition of wealth through hidden goods and silence
  taxonomy_refs:
  - trickster_boundary
  basis: Xidiela conceals the Zi-Ndoxi's clothing and ornaments, says he acted to
    humbug his master, obtains gifts and silence-bribes, and becomes rich.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage does not explicitly label Xidiela a trickster; the motif label
    is inferred from his deceptive actions.
- id: motif:2
  label: nkasa ordeal resolving ndoxi accusation or challenge
  taxonomy_refs:
  - divine_judgment
  basis: Xidiela and his master take nkasa after an accusation-like challenge, with
    one dying and one escaping; Mavungu also takes nkasa after being accused in Buite's
    death and dies.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: The text describes an ordeal outcome but does not explicitly call it divine
    judgment; the available taxonomy reference is approximate.
- id: motif:3
  label: bewitchment through joined hostile intention
  taxonomy_refs: []
  basis: The Buite episode says Mavungu, his brother, and other Zi-Ndoxi determined
    to kill Buite, and the Bavili say Buite might have recovered if the brother had
    refused to join the death-wish.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: This is presented as Bavili explanation within the passage, not as a universal
    motif family.
- id: motif:4
  label: mother of all animals
  taxonomy_refs:
  - mother_goddess
  basis: Zambici is said to be spoken of in some stories as the mother of all animals,
    with the author contrasting this with the Creator role.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The taxonomy term 'mother_goddess' is broader than the passage wording;
    the passage says mother of animals and discusses Creator language.
- id: motif:5
  label: refused hospitality or water to old travelling woman
  taxonomy_refs:
  - sacred_exchange
  basis: One referenced story has an old woman asking hospitality and chastising a
    town for refusal; the Kakongo episode begins with an old woman carrying a child
    asking women for water and being refused because of scarcity.
  evidence_refs:
  - ev:7
  - ev:10
  confidence: low
  cautions: The Kakongo story is truncated in the supplied passage, and the Sonansenzi
    story is only summarized by the author; the exchange motif is therefore tentative.
- id: motif:6
  label: sacred animal as local Xina
  taxonomy_refs: []
  basis: The cricket is identified as Xina to Sonio, and the eel as the Xina or sacred
    animal of Kakongo.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: No matching supplied taxonomy motif family directly names sacred animal
    or totemic affiliation.
- id: motif:7
  label: truth revealed despite concealment
  taxonomy_refs:
  - wisdom
  basis: The proverb about cooking the grasshopper or cricket while its eyes remain
    is glossed as meaning that truth will out.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This is a proverb within the passage rather than a full narrative motif.
