canonical_text:
  quote: ''
  summary: The passage concludes a story in which Xidiela hides the clothes and ornaments
    of Zi-Ndoxi, extracts gifts for their return, becomes rich, and later survives
    an nkasa bark ordeal while his master dies. The author then gives a recent Bavili
    case involving Buite, Mavungu, witchcraft accusation, divination, and nkasa. The
    passage also discusses Zambici as mother of animals, an old afflicted woman in
    a hospitality story, cricket and eel as Xina or sacred animals of specific places,
    a proverb about the cricket's eyes and truth, and the beginning of a Kakongo story
    in which an old woman with a child asks field women for water.
  language: English
  quote_policy: summarized
literal_observations:
