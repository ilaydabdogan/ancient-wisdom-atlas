  text: The Zi-Ndoxi search for their clothes, thrash Xidiela's master when the clothes
    are not found, and then depart in different directions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Xidiela publicly remarks on people wearing clean clothes, and his master privately
    tells him that he has been thrashed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Xidiela says he went simply to humbug his master.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Each ndoxi brings cloth, sheep, or presents to recover clothes from Xidiela
    and to bribe him to say nothing; Xidiela becomes rich, returns to his town, builds
    a nice shimbec, and looks down on poorer relations.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Xidiela's master calls him a ndoxi and dares him to take nkasa; Xidiela proposes
