canonical_text:
  quote: ''
  summary: The narrator travels from the Ogba river area to Egwahami, where dancers
    from Ugbeni are said to be bringing health and good luck. He proceeds to Ugbeni
    to witness the Ovia dance. In a town square, Ukhure sticks are placed near him,
    audiences of women, men, and children gather, and masters of ceremonies clear
    space for ten masked dancers. The dancers form a circle in two costume groups
    with crowns, masks, red cloth, feathers, palm-leaf garments, bells, and seed anklets.
    The dance includes stick-beating, women singing, men cooing like birds, stamping,
    circling, and a central spinning motion.
  language: English
  quote_policy: summarized
