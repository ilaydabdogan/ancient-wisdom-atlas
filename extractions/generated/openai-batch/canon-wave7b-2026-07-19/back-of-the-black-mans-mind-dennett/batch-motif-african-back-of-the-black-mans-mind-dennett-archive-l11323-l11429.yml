  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The first five dancers wear a large crown-like head-dress with triangular
    wooden framework, red cloth, a small mirror, hornbill and parrot feathers, bands
    of metallic braid, glass pieces like eyes, a network mask, red streamers, palm-leaf
    garments, cotton clothing, bells below the knees, and seed anklets.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The second five dancers are dressed like the first group except for the upper
