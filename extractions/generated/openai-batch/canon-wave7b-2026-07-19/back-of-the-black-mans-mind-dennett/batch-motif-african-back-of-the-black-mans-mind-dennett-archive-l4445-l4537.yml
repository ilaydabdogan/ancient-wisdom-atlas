canonical_text:
  quote: ''
  summary: The passage introduces Ndongoism/fetishism and distinguishes it from a
    higher Nkici-ism connected with Nzambi and Bakici Baci. It classifies Zinkici
    into home-protecting figures, charms, and talismans, and nail-driven figures.
    It recounts a missionary anecdote in which Thomas Comber cuts a feared wooden
    image without being harmed, then comments that a named Zinkici Zimbowu figure
    had cost a human life and that, in Luango, an injured fetish's Kulu or spirit
    returns to afflict its owner until given a new figure.
  language: English
  quote_policy: summarized
