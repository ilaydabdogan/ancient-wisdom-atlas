canonical_text:
  quote: ''
  summary: 'The passage records sayings and explanations about offices connected with
    Maluango and Mamboma: Maxienji carries news of Maluango''s death and asks Mamboma
    to bury him; Mankaka is described as an executioner; Mamboma buries the dead Maluango,
    governs during an interregnum, calls princes for election of a new high priest,
    and remains subject to the dead or living ruler. The passage also describes the
    diviner with a magic mirror, Maxilaci at the gate of Maluango''s sacred ground,
    Mamboma''s court of twelve, and a court division that uses arbitration and may
    call another ritual specialist.'
  language: English with transliterated Bavili/Kongo terms
  quote_policy: summarized
