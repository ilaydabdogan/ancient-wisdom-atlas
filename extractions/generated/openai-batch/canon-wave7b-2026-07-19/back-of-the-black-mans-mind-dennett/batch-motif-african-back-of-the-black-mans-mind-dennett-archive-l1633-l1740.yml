candidate_motifs:
- id: motif:1
  label: Royal death, burial, and interregnum governance
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage links the king's death, burial by Mamboma, the posthumous title
    Ntawtela, and Mamboma's temporary rule during interregnum.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage is institutional and ethnographic rather than narrative myth;
    the taxonomy ref is broad.
- id: motif:2
  label: Restricted royal succession through election
  taxonomy_refs:
  - royal_legitimacy
  basis: After the king's death, Mamboma calls princes together and the choice of
    the new high priest is restricted to sons of princesses living in Kondi.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The text describes a political-religious procedure, not a full mythic
    succession narrative.
- id: motif:3
  label: Divinatory intervention in succession dispute
  taxonomy_refs:
  - royal_legitimacy
  basis: If unanimity fails, the diviner Nganga Mpuku and his magic mirror are called
    for divine interference in choosing the new high priest.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The mechanism of divination is not described beyond the magic mirror and
    stated need for divine interference.
- id: motif:4
  label: Office bound to both dead and living ruler
  taxonomy_refs:
  - duality
  basis: Mamboma is described as subject spiritually to the dead Ntawtela or bodily
    to the living Maluango, making him servant of the dead or of the living.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The duality taxonomy is interpretive; the passage states the twofold subjection
    directly but does not elaborate a mythic dualism.
