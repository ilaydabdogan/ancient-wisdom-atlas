canonical_text:
  quote: ''
  summary: The passage lists Bini royal servants and offices, describes the sons and
    daughters of the Oba and their descendants, explains that royal sons governed
    districts as hereditary viceroys, compares this arrangement to Kongo, and names
    six great chiefs who could represent the Oba in major estates. It also describes
    Ezomo as war chief and equity-like judicial officer, Olugbosheri as hereditary
    general, Eru as a great judge with policemen, and Oliha as an archbishop-like
    figure.
  language: English
  quote_policy: summarized
