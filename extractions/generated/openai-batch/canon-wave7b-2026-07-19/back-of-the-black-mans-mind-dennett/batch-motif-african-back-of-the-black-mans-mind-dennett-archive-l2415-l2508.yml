canonical_text:
  quote: ''
  summary: The passage explains Bavili terms and rules concerning family, property,
    land, water, and usufruct. It links property rights through the mother to Mbunzi,
    describes land and goods as held in trust rather than owned absolutely, distinguishes
    land from water through linguistic and material categories, and lists obligations
    owed by usufruct holders or recipients of gifts and loans to superiors or benefactors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage explains kanda as related to making straight or tightening, links
    nkanda with skin, and gives a saying that humans and cattle are both skin while
    humans are superior by speech.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The right of property is said to be derived through the mother, called the
    planter, to the Great Uncle Mbunzi, identified with the west wind, rain giving,
    and primeval powers on earth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Bavili has no direct word for proprietor or property,
    and gives Fumu Bima, chief or prince of all things, as the nearest expression
    for proprietor.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A land chief is described as the head of a family holding land in trust for
    his people, while a possessor of goods is described as a temporary owner of things
    belonging to his Fumu.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Movable and immovable goods are distinguished: land remains, while the other
    category is used up; Ci is connected with primeval matter and earth, while Ma
    or Maci is connected with water.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Where labor is involved, the possessor has the right to dispose of the fruits
    or the portion returned or allowed by his Fumu; a woman’s plantation is hers after
    feeding her husband and paying tithes to the Fumu.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: All sources of wealth are said to carry responsibilities, and goods are described
    as held in trust rather than as actual possessions.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Usufruct is granted by the prince to the Kongo Zovo, or by the Kongo Zovo
    to an individual, and no use or habitation gives a right to ownership.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The king may depose the prince, the prince may remove usufruct from a rebellious
    Kongo Zovo, and the Kongo Zovo may revoke an individual’s usufruct of land or
    goods.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Kongo Zovo’s use of land and water for his family carries obligations
    to the prince, including military support, delivery of killed leopards and animal
    portions, sea produce, crop portions, and yearly feasts or presents from a rich
    resident.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A recipient of cloths or loaned goods is expected to be at the donor’s call,
    though the donor has no stated right to claim service.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Those permitted to cut palm nuts or reap unplanted fruits receive a share
    of profits from their sale.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Usufruct generally continues for the recipient and successors so long as they
    exist and behave themselves, but may end by the will of the prince, the Kongo
    Zovo, or the individual.
  category: sequence
  evidence_refs:
  - ev:10
