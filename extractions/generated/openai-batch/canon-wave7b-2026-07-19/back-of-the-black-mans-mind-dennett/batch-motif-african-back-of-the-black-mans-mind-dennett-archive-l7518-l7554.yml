  summary: The passage describes named snakes that develop into named rainbows, including
    a beneficent rainbow that drives away an evil rainbow. It gives a moral gloss
    about wrongful choosing leading to destruction, reports a saying and rainbow-sign
    gesture used by Bavili princes during floods attributed to Xama Ngonzola, notes
    linguistic variants of the saying, identifies the valley from which Xama Ngonzolo
    rises as the valley of fear, and gives a lexical gloss connecting red and blood.
