canonical_text:
  quote: ''
  summary: The passage describes Bavili judicial offices, advocates, attendants, regalia,
    court procedure, use of ordeal as an alternative or last appeal, limits on compulsion
    before a palaver, and a ritualized court opening invoking Nzambi, using a drink
    from both parties, swearing by a fetish, and beating the fetish before accepting
    the King's judgment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each party generally has an advocate called Nanga to plead the cause.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The attendants or helpers of judges are people entitled to hold offices as
    Chiefs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Maluango is described as having seven titles, twelve followers, and six kinds
    of Zi-Nganga; Mamboma has titles, followers, and Nganga connected with trials
    by ordeal.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Manifumus of the provinces share listed followers with Maluango and Mamboma,
    including Mamboma, Mbuku, Mafuku, Maxienji, and Mangova.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Several offices are identified by signs of office, including knives, hats,
    capes, a sword, a long cloth, an ivory horn, an iron bell, and an ox tail.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The condition of the plaintiff or defendant does not determine the composition
    of the palaver, and there is no exceptional jurisdiction.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Only the judge is allowed to settle a palaver, while the number of helpers
    or assessors depends on the importance of the palaver.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A palaver begins with each party stating his case; when advocates are present,
    they are instructed beforehand and may be reminded during proceedings.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Anyone may sit and listen to the palaver, and the judgment spreads quickly
    by report.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ordeals are used instead of legal proceedings when a party fears unfair advantage
    due to poverty, or when legal proceedings have not cleared the matter up and a
    last appeal is needed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A man is not forced to answer questions until the palaver is held; a family
    head may use a yoke or whipping to elicit truth, but torture in legal matters
    is described as unknown.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: In opening the palaver, the prince claps his hands, speaks a formula invoking
    Nzambi, greets all present in God's name, asks for a drink, and receives the same
    quantity from each party.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Nanga is called to state the case, swears by the fetish present to speak
    truth, states the case, and hands the parties to the King Judge, Nkunzi.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:14
  text: The King orders the plaintiff to speak; the plaintiff beats the fetish and
    asks that it not allow the defendant to interrupt, and after both parties finish
    they beat the fetish and agree to abide by the King's judgment.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
