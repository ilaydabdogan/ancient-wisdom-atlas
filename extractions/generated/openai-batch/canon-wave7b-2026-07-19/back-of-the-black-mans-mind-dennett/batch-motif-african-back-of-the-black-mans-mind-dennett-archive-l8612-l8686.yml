canonical_text:
  quote: XiNA means law, a thing forbidden, an abomination, and a totem.
  summary: The passage lists fish and other sacred animals, describes Nziku the chimpanzee
    as a XiNA of mankind, explains XiNA as a word connected with refusal, prohibition,
    law, and totem, describes a same-dish restriction affecting Mavumbu people, and
    discusses King Maluango’s relation to XiNA and law.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Five kinds of fish form the class Mbizi Xibala; their spikes enter into bilongo,
    and the passage names Xiendo, Mpudi, Nkoko, Ngola, and Xibuela, with Mpudi and
    Ngola identified as catfish and the others as rays.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Two sayings are attached to Nziku: one warns to be careful in choosing friends,
    and another warns that an apparently friendly man may lead one into a large dispute
    or palaver.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nziku, identified as the chimpanzee, is called the XiNA of mankind generally,
    with resemblance to humans in outward form and habits given as part of the description.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The chimpanzee is described as carrying its young on its back, walking in
    the woods on its hind legs with a stick, and fighting with a stick.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The chimpanzee is described as treating its pregnant wife with respect and
    running away from her when she is annoyed rather than beating her; the passage
    also says it is not caught in the act of copulation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Bavili are said to warn that humans must not think the chimpanzee can
    become a real friend; the chimpanzee’s skin is said to be found in the Xibila.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: A person wishing to refuse a request may mention his XiNA; the passage gives
    Ngwali as an example and says Kazila, meaning no road, is often used for XiNA.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mavumbu are described as a class of people living in districts of Kakongo
    and near southern Luango who are not allowed to eat from the same dish as Bavili
    or people of Kakongo.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: If a Mavumbu person asks for food, he must disclose that he is Mavumbu, but
    the passage says this is a great disgrace and is therefore seldom done.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The author says he cannot determine where the Mavumbu come from or why they
    are so cursed, and suggests that Mavumbu may be connected with Mavu, glossed as
    dirt.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: The author concludes that XiNA means law, something forbidden, an abomination,
    and a totem.
  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: King Maluango is said to have no XiNA, but the author suggests this means
    that as Nkici Ci he is in the place of God and above the law; the passage also
    says that as Fumu his XiNA is pig and that he must have family BiNA.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Under the heading Sacred Animals, the passage lists Mpakasa, Mbambingombi,
    Bafu, Nkaka, and Mpili.
  category: object
  evidence_refs:
  - ev:8
