  quote: causes the wrath of God and a drought and consequent famine
  summary: 'The passage describes criminal penalties under Bavili law: payment is
    normally adjusted to the crime, but certain sexual offenses and proven witchcraft
    may lead to burning, while Maluango may still spare lives. It also describes royal
    mitigation, slavery as a substitute penalty, accomplice and instigator liability,
    and escalating treatment of habitual criminals.'
