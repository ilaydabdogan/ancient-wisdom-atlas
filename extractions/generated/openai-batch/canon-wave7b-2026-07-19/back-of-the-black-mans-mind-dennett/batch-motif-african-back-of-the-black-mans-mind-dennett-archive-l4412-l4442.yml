  summary: The passage describes burial after the ndongo is no longer in the corpse,
    the non-collection of grave earth for later use in small zinkici connected with
    communion with the departed, a prohibition against casting reflected mirror light
    on a person, the placement of looking-glass fragments in trees and fetishes, and
    villagers' fear that photography may take away life or Monzo.
  language: English
