canonical_text:
  quote: ''
  summary: The passage describes Bavili terms and images for the sun, moon, stars,
    elephant-hunting, river falls, wife-husband oppositions, and a broader formula
    of paired contrary words. The sun and moon are described through kinship roles
    and as judges; the morning and evening stars are described as child, offspring,
    and husband in relation to celestial parents; several paired terms are connected
    with elemental or social ideas.
  language: English
  quote_policy: summarized
