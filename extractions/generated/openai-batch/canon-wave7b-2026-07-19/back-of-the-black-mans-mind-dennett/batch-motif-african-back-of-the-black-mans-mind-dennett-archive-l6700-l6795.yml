canonical_text:
  quote: ''
  summary: The passage frames a section on sacred trees, notes that Bavili informants
    do not regard Mbundu Citu as sacred, and recounts an expedition from Luango to
    find and photograph an Nkasa tree. During the journey, the narrator learns of
    an illness attributed to an evil spirit, a leopard attack, and Mambuku's consultation
    with the priest Nganga Nvumba or Maluango. After false starts with local guides,
    the party finally reaches a clearing, photographs the upper branches of an Nkasa
    tree, and enters the wood to examine its trunk.
  language: English
  quote_policy: summarized
