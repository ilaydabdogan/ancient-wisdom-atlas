canonical_text:
  quote: ''
  summary: 'The passage describes part of a Kongo coronation setting: Nenimi''s cap
    remains with an effigy until ceremonies are complete; Npaka, son of the late king,
    receives condolences near the late Neamlau''s bed and hammock; princes and visitors
    gather under trees; red-clothed and white-clothed processions arrive, kneel, receive
    blessings, sing, and dance; a Mankaka and a Nganga perform ritual actions including
    beating the earth and sprinkling medicine water; Nefuku arranges a dance circle;
    dancers perform, including women sprinkled with rum for courage; Nenimi remains
    seated under a Cachew tree receiving guests.'
  language: English
  quote_policy: summarized
