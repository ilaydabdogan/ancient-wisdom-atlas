canonical_text:
  quote: ''
  summary: The passage introduces Bavili distinctions among shadow, breath, ghost,
    soul, and spirit; describes Xi dundu as a vital shadow associated with life and
    breath; explains theft and ritual recovery of a person's shadow by an ndoxi; and
    describes Ximbindi/Bimbindi revenants, their postmortem movements, their dangerous
    appearances, and their capture or use by an ndoxi with medicines and animal agents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that one word may sometimes stand for several distinct ideas,
    and says that Bavili distinctions include life-shadow, breath, intelligence, ghost,
    soul, and spirit.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Trampling on or crossing another person's Xi dundu, especially that of a married
    woman, is described as formerly being treated as a crime in this part of the country.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Xi dundu is said to sleep in the owner's body at night.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If an ndoxi robs a sleeper of his Xi dundu, this is said to take away the
    person's life.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Xi dundu is said to enter and leave the body by the mouth and is likened
    to the Muvu, or breath.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: When a man dies, he is said to have no shadow and no breath; the passage says
    Xi dundu and Muvu die with mortal man.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Swoon, fit, or trance is explained as a case in which an ndoxi has taken the
    person's Xi dundu and may choose whether to return it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A suspected ndoxi is not approached directly; two or three zinganga must confirm
    the suspicion, visit the sick person, address the ndoxi, and threaten to call
    out his name.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: If the Xi dundu is not returned, a fetish is knocked while the ndoxi's name
    is called, with the stated consequence that the ndoxi will die if he does not
    return it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After death, a person's Ximbindi may rest in the house where the person died
    for twenty days and then go to the woods.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Ximbindi of an ndoxi may haunt the place where the ndoxi died forever.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Seeing the Ximbindi of a relation or being beaten by a Ximbindi is said to
    foretell or cause imminent death.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: An ndoxi with mpanga and the power called Nyungala is said to catch and keep
    Bimbindi and send them to beat and kill living persons.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The same ndoxi is said to send the leopard to kill people and the crocodile
    to drown them and carry their Bimbindi under the waters to an island in the Kongo
    River.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The collected Bimbindi are said to be sold to the white man, serve as slaves,
    and make cloth beneath the blue sea far away.
  category: sequence
  evidence_refs:
  - ev:7
