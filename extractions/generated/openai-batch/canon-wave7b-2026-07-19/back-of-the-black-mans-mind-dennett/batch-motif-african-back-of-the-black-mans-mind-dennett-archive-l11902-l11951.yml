canonical_text:
  quote: ''
  summary: The passage describes a shrine-like arrangement with Ake on a throne, kingly
    figures, attendants, boys, hand-bearers, Ogun the blacksmith, and the sacred tree
    Ikhimi. It then records petitions to Ake for childbirth and recovery or vengeance
    after theft, a dance sacred to Ake at the beginning of the rainy season, named
    rivers and their meanings, the four rivers enclosing the central province of Benin,
    and Olukun as a southern boundary river with a water-pot sign and altar objects.
  language: English
  quote_policy: summarized
