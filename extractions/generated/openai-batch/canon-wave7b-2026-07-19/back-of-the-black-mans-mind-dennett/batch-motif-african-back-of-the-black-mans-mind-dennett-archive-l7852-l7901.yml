canonical_text:
  quote: ''
  summary: The passage closes one account with Xikaia and his family leaving for Mayombe,
    then recounts a leopard attack on an old man gathering bamboo palm fronds with
    his grandchildren. The children escape and villagers later find only the old man's
    head. The narrator says four such cases in the district were reported within six
    months. A new section begins, titled 'Ngo as the Old Woman in a Hammock,' introducing
    the story of Xidiela, described as a man who humbugs people, who is driven from
    home and offers to work as a cook for a rich man.
  language: English
  quote_policy: summarized
