canonical_text:
  quote: ''
  summary: The passage summarizes Dennett's tabular account of Bini and Bavili religious
    philosophy. It says older Bini religion is difficult to trace, names Ife as the
    Yoruba spiritual capital, states that the completed religion is ruled by 201 Ebami,
    describes lost bronze-plate records from the Oba's palace, and outlines a twofold
    created/procreated or spirit/body classification subdivided into numbered powers
    and formulae totaling 201 parts.
  language: English
  quote_policy: summarized
