canonical_text:
  quote: ''
  summary: The passage catalogs named sacred animals and animal materials associated
    with the XIBILA, including feathers, shells, skins, bones, heads, horns, tail
    hairs, and claws. It also records proverbs, explanatory sayings, anecdotes, and
    customs attached to several animals, including a partridge story, a goat substitution
    for a condemned person, viper respect at Mpili, elephant food-giving associations,
    and a crab-linked opposition of spirit and matter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chicken is described as going hungry if its mother does not scratch for
    food, and its feathers are said to be found in the XIBILA.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cockle shells, together with oyster shells, are cast by people of Mamboma
    at people of Buali who carried Ntawtela's coffin as far as the Numbu tree; a mound
    of the shells is found in the XIBILA.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A saying about three ant hills is used to explain balancing a pot for cooking.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women and children are said to drown when they keep digging for cockles after
    the tide begins to rise.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The partridge is identified as Ngwali, Ngumbi, or Xilawlolo, and also as a
    Mafuka.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the partridge story, Mr. Partridge loves Mrs. Fowl, spends a fearful night
    in the coop, hears an order to kill a fowl in the morning, and escapes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The partridge is described as a bird killed by sons for their mothers when
    the mothers' husbands have neglected them for strange women; its head and feet
    are found in the XIBILA.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Oysters are linked to a saying that a palaver is difficult and hard to open
    like an oyster; a mound of oyster shells is found in the XIBILA.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The boa constrictor's skin is found in the XIBILA.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The whale's vertebra is in the XIBILA and is said to point out that people
    come there from all parts.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: When a village member commits a death-worthy crime, a town meeting is called,
    and one dissenting voice can prevent execution by requiring the family to supply
    a goat in the person's place.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The substitute goat is killed, and every member of the community must eat
    a little of it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Goats and fowl are called XIMENGA, glossed in the passage as 'of blood.'
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: The goat's skin is used in the XIBILA as a seat instead of the usual grass
    mat, and the animal is described as noisy and lascivious.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Sungu antelope is said to feed on hilltops and to be ready to see its
    enemy; its head and horns are in the XIBILA.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:16
  text: The elephant is described as chief of all the world and a great giver of food
    because people continually carry away its flesh after it is killed.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:17
  text: The elephant is said to stand for animal love and knowledge, to have been
    led from Kakongo by a single piassava string, to provide a baby pet name, and
    to have tail hairs worn around people's necks in the XIBILA.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:18
  text: The spitting viper is said to dislike noise or disturbance; the people of
    Mpili respect it and do not burn grass around the town for fear of disturbing
    it.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:19
  text: The word Mpili is interpreted in the passage as 'primeval silence,' and the
    viper's skin is found in the XIBILA.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:20
  text: The crab is linked to breath-holding during fright, a sigh or groan of relief,
    and words glossed as fear, respect, safety, or rest.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:21
  text: A saying states that the claws of the crab nip even after it is dead.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:22
  text: The crab, sea, and sun are said to be opposed to Ngo, earth, and moon, glossed
    as spirit opposed to matter.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:23
  text: The claws of the crab are found in the basket of Bilongo in the XIBILA.
  category: object
  evidence_refs:
  - ev:12
- id: obs:24
  text: The shark is named as Nquimbi Ke Ku Vuka and described as 'the shark that
    devours,' but the passage breaks off immediately afterward.
  category: attribute
  evidence_refs:
  - ev:13
