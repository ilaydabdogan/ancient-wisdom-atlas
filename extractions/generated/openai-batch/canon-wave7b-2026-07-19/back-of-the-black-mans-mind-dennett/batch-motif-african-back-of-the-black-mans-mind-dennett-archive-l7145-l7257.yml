canonical_text:
  quote: ''
  summary: The passage, headed as concerning sacred trees, lists named trees and then
    describes qualifications and duties of a ruler-elect. The ruler-elect must be
    beloved, physically and morally complete, led to the Nkumbi tree to meet the people,
    encouraged by Mamboma to face any claimant, confident in pure birth and a quality
    from above, surrounded by courtiers, strengthened by life trials, obliged to bury
    his uncle whose body is being dried by fire and smoke, and required after succeeding
    Ntawtela to fulfill promises, become head of state, remember priestly powers,
    live in fear of God, and embody a pure kingly life through royal maternal birth
    and one royal wife.
  language: English
  quote_policy: summarized
