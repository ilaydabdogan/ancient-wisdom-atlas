canonical_text:
  quote: ''
  summary: 'The passage describes penalties and authority around alleged law-breaking,
    including a costly medicine-fine to appease the Bakici Baci, Maluango''s exclusive
    power of life and death over free men, flight by accused persons, local retaliation
    against plantations, and intervention by mission and colonial officials. It then
    lists several Fjort symbols used on badges, sticks, or cloths: sun, moon, axe,
    hoe, ngonje, and Bikula royal drums, with verbal explanations of their meanings.'
  language: English
  quote_policy: summarized
