canonical_text:
  quote: ''
  summary: The passage lists Bini offices and office-holders. An unnamed office associated
    with medicine men is held by the pair IGWESIBO and Ogiemese, followed by a list
    of their followers. The office of IWEGWE is headed by ISIRI and Bazilu; they and
    their followers look after the household or common wealth, with Oka/headmen under
    them. The passage then describes going with the Oba to his farm at harvest time
    by the HUMIDUMU road and helping in an enacted “play.” It also lists some great
    IWEGWE and says that the office of Ibihe was entrusted to Ine (Yamo) and Obazwaiyi.
  language: English
  quote_policy: summarized
