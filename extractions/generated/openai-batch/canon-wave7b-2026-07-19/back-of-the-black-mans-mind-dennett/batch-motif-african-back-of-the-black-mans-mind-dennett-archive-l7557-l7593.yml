canonical_text:
  quote: ''
  summary: 'The passage explains a system in which senses are connected with six categories:
    hearing with exclaiming, air, heavens, and water; reason with foundation or solidity;
    smell with marriage, desire, and heat; touch with motion; sight with covetousness
    and plenty; and taste with eating and life. It states that the order comes from
    the colours of the rainbow and then lists omens, rainbow colours, rainbow snakes,
    and Mpilu.'
