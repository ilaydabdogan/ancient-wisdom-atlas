canonical_text:
  quote: ''
  summary: The passage closes a comparison between Bavili and Bini religious and material
    forms, then opens a chapter on the Bini. It introduces Benin City through references
    to the death of Consul Philips and companions and the punitive expedition under
    Admiral Rawson. The writer says his notes from local people suggest that what
    Ling Roth calls jujuism corresponds to Kongo Nkici-ism and higher religion rather
    than Ndongoism. He describes the Bini people positively and recounts that the
    Oba killed Unwagwe's grandfather for refusing to join the expedition against Philips,
    while Ezomo/Ojumo was compelled to join at the last moment.
  language: English
  quote_policy: summarized
