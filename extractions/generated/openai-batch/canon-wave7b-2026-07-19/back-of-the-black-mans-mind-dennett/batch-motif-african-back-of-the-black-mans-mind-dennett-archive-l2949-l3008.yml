canonical_text:
  quote: ''
  summary: 'The passage describes Bavili judicial procedure: disputes may be judged
    by a third party, father, chief, prince, Mamboma, or finally King Maluango; some
    matters may be referred to ordeal. It details courtroom seating, the role of the
    Nzonzi reasoner, the use of cardinal directions in the king''s posture and parties''
    placement, the palaver place under a shed or tree, five types of palaver, and
    the identification of judges with governing chiefs, princes, and king.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Simple disputes are first judged by a third party in the presence of witnesses;
    appeals or wider disputes move through father, Kongo Zovo chief, prince, Mamboma,
    and King Maluango.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Maluango's court is described as the final court of appeal in a natural sense,
    though Maluango may refer a case beyond his powers to tests by ordeal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In an ordinary palaver, each party presents its side to the third party or
    Reasoner called Nzonzi; in appeal, the Nzonzi explains the whole case before Maluango.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Maluango''s seated orientation changes according to the parties'' locations:
    he sits with his back to the East for North/South parties and faces South for
    East/West parties.'
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Nzonzi stands opposite Maluango in a hollow square, while defendant and
    plaintiff with their parties sit to Maluango's right or left according to the
    direction of their towns.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The place for palavers may be under a shed or a tree and is called Nganda
    Tela Li Misamu.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'Five kinds of palaver are listed: concerning rains and powers; between princes
    concerning land; to clarify intrigue between friends; civil; and criminal.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Judges are the chiefs, princes, and king of the country, with no special prerogatives
    or duties apart from their governing offices.
  category: relationship
  evidence_refs:
  - ev:5
