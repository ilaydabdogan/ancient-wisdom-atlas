canonical_text:
  quote: ''
  summary: The passage explains a formula linking sacred animals and families to five
    divisions of law understood as prohibitions. It lists prohibitions against God
    and rulers, parents, neighbours, covetousness, and illegal marriages, then gives
    animal- and object-associated admonitions about punishment, royal authority, parental
    authority, murder, adultery, false witness, theft, gluttony, and marital conduct.
    An interleaved note describes remains kept as charms and asks whether Ngo is a
    sacred animal of Kongo or Bantu peoples.
  language: English
  quote_policy: summarized
