canonical_text:
  quote: ''
  summary: The passage describes men seeking noble rank who attack others and risk
    being killed themselves. Certain words spoken by an attacked person, and the noise
    of a fleeing woman's chain and brass anklets, are described as life-saving. After
    presenting the Oba with parts of seven or fourteen persons, the men receive coral
    ornaments as a sign that they have become Okiason; Idun Ohogbi is named as their
    chief and they live in Obayagbon's quarter.
