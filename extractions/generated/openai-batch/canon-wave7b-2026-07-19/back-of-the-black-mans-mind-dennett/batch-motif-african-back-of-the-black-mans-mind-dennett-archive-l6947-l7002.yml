canonical_text:
  quote: ''
  summary: 'The passage describes several sacred or ritually important trees connected
    with Maluango: Sexi, where the dead Maluango''s body is placed before burial;
    Numbu, where Mamboma people take over the body from Maluango''s people; and Mba,
    the palm tree whose leaves form a sash worn by Maluango while judging. It also
    describes the Badungo/Badungu as the king''s policemen or detectives, with masks,
    leaf or feather dress, and a sawfish snout as a sign of office, and notes their
    later suppression.'
  language: English
  quote_policy: summarized
