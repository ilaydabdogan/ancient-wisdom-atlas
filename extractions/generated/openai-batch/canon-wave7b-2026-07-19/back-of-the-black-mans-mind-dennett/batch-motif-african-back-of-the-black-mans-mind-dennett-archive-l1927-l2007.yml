canonical_text:
  quote: ''
  summary: The passage opens a chapter on law, argues for the importance of understanding
    African customary law, and distinguishes offenses involving divine or spirit powers
    from ordinary civil and criminal disputes. It compares African moral-law violations
    to Melanesian tabu, describes Nzambi’s provocation by sexual immorality as producing
    drought and communal penalty, notes royal punishment of 'god palavers' by Badungu,
    and explains that 'man palavers' are debt-like cases decided by courts but enforced
    privately by winning parties and their families.
  language: English
  quote_policy: summarized
