  summary: 'The passage describes Ndongoism rites and ritual objects: baskets whose
    guardians undergo voice-installation ceremonies and hut seclusion, marriage rites
    involving Ngofo and Lembe bracelets, named wives and guardianship of Zinkici,
    protective personal charms made from animal parts, a village or frontier threshold
    charm, Mbumba bracelets, and the court medicine man who encourages the Nganga
    Nvumba elect on the way to coronation at Buali.'
