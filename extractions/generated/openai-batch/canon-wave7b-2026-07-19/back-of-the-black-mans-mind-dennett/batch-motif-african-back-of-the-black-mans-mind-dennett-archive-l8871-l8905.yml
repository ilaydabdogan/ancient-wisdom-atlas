canonical_text:
  quote: ''
  summary: The passage introduces a chapter on Nzambi, Nkici, and Bakici Baci. It
    states that Bavili thought includes a highly spiritual or abstract conception
    of God named Nzambi, whose name is explained as the personal essence of the fours.
    The fours are groups of four powers called Bakici Baci, treated as personalities
    or personal attributes rather than mere wooden figures. Each group is described
    as consisting of cause, male and female parts, and effect. A footnote says people
    speak little of Nzambi from respect and fear, and use the word as an exclamation
    in trouble.
