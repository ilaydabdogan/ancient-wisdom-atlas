canonical_text:
  quote: ''
  summary: 'The passage introduces the court of Maluango, identifies him as king or
    chief of the Bavili and as subordinate to Kongo, describes seven titles and six
    governmental sections, and gives details for two divisions: Maluango as Fumu,
    a conscientious arbitrator with assessors and a priest who prepares the future
    dwelling place; and Maluango as Ntinu, a reasoning judge aided by named officials
    including a recording messenger.'
  language: English
  quote_policy: summarized
