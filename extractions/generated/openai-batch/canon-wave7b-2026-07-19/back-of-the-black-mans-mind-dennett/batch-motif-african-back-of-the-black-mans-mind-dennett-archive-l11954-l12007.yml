canonical_text:
  quote: ''
  summary: The passage describes a temple to Olukun at Ewesi, including protective
    chalk distributed to worshippers, entrance guards and door carvings, an altar
    to Esu, grouped figures of Olukun's son, wives, attendants, an Iyase, Olukun dressed
    as a king, an old priest, and petitioners who kneel before Olukun and mark themselves
    with chalk.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening list names sticks, cowries, mats, fishbones, a parrot tail feather,
    representations of a snake and a leopard, and skulls of cows, dogs, and goats.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Ewesi there is a temple to Olukun where chalk is given to people as protection
    against evil.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: People put the chalk around their eyes and also mark their bodies with it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the door of the temple, described as a square courtyard with cloisters,
    two figures are seated on guard.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The door is carved with two snakes named or labelled Ikpi and Obianimi, a
    bird, a crocodile, a small boy, and a house.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: An altar just inside the porch is dedicated to Esu, whom the passage glosses
    as the devil in a Yoruba comparison.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: On Olukun's left are figures of Olukun's son with a nude wife on either side,
    a seated boy holding a Kola box and a bottle of water, shells, chalk, a knife,
    a bell, and a bamboo pole called 'Sa or Oyisa with a split cup-shaped end.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A figure of Olukun's Iyase wears Odigba, a frontlet called Udehai, a collar,
    armlets, and bracelets.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the end of the building is a great figure of Olukun the teacher dressed
    as a king, with two Nabori arm-upholders and four naked boys or Amada.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: An old priest sits at the feet of the Olukun figure near an altar, partly
    hidden by long strings of cowries hanging from the roof.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: A man and two women enter, go up to Olukun, kneel, and bow their heads until
    they touch the step supporting Olukun's feet.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The priest crushes chalk, gives some to each petitioner, and the petitioners
    mark themselves before leaving.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: On either side of the central figures are two sons of Obianimi described as
    very old wooden figures.
  category: setting
  evidence_refs:
  - ev:10
