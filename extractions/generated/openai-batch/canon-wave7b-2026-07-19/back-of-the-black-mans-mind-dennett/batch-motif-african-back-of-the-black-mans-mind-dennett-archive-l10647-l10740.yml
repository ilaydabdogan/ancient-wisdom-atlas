canonical_text:
  quote: ''
  summary: The passage records Bini and nearby Kukuruku ritual objects, including
    pillars, triune figures, fig-trees, Esu/Eshu altars, and a theological account
    of Oyisa and Esu/Eshu as trinities. It also recounts a brief human-creation episode
    in which Esu finishes unfinished humans and is banished east, then begins a section
    on marriage and betrothal customs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Owo, a pillar in the Oba's palace yard was called Orobale, glossed as the
    husbands' ward.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Isule, a triune pillar under a small shed had back-to-back figures, two
    male and one female, and was called Babatchigiddi, glossed as an earthenware image
    of the father.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: At IAlu, three grass-capped figures stood on a stone plateau; two were solid
    clay and one was made from two upright sticks with a grass cap.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The IAlu grass-capped figures were called ESHI, interpreted in the passage
    as equivalent to the Bini word Esu or Eshu, glossed as Devil.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Three fig-trees growing from loose-stone platforms near the ESHI figures were
