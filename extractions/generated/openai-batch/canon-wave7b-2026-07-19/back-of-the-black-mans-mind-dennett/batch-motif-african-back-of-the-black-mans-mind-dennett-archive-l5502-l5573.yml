canonical_text:
  quote: ''
  summary: 'The passage presents Dennett''s account of Bavili cosmological and temporal
    ideas: all things are ultimately manifestations of Nzambi; abstract principles
    Xi, Ci, Fu, and Vu describe passive/maternal, active/paternal, productive, and
    temporal-spatial causal functions; sea, rain, earth, springs, rivers, and vegetation
    are used as an example of production; the year and seasons are then mapped onto
    the same productive sequence. The author states that these ideas are derived from
    philological considerations rather than directly from native testimony.'
  language: English
  quote_policy: summarized
