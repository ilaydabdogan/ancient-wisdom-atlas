canonical_text:
  quote: '"it is to-day that we are going to kill the prince of the country"'
  summary: Xidiela, after being warned that his master is a MUNTU A Ndongo, tells
    the master he is a witch and is taken to a witches' meeting. He refuses to undress,
    is identified by an old nganga as not being a witch, dances with a matchet, and
    runs away with it. The witches then punish the master and do not kill the prince.
    A footnote relates an animal-office contest in which Xinkanda the lemur is elected
    Mamboma over Ngondo the long-tailed monkey.
  language: English with embedded Bavili/Kongo terms
  quote_policy: quoted
