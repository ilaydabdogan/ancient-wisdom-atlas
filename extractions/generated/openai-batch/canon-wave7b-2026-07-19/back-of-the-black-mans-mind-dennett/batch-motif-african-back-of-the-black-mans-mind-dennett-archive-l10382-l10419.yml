canonical_text:
  quote: ''
  summary: 'The passage lists several named juju or shrine forms: Osun with attached
    Doctors or Obos; ESHU Shu as a tied bundle of leaves on a tree branch; Ekeji as
    a fenced and cloth-wrapped tree with objects at its root; Omey as the entrance
    to Arovia, a grove sacred to OviA, marked with chalk; Omehu as a tree with ant-hills
    at its roots said to aid childbirth; and a double Ikhimi tree at Igusala with
    water, cups, shells, goats'' heads, seats, and EkwhA pudding smoked over fire
    nearby.'
