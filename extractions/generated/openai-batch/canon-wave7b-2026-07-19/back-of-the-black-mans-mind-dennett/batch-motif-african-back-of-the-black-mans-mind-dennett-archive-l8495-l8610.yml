canonical_text:
  quote: ''
  summary: The passage lists Bavili sacred animals, their sayings and word associations,
    and ritual animal parts placed in the Xibila or bilongo. It includes a turtle
    tale in which the turtle cheats partners and is killed by a leopard, a monitor-lizard
    tale in which a lizard deceives and eats a cricket, an antelope horn sign for
    the parting of ways, and notes on pig blood, waterbuck, hippopotamus, shark, and
    otter skin in ritual or symbolic contexts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that VUKA can mean both devouring and copulating, QUI MBUKA
    is connected with fear from guilty conscience, and KUBU names both a shark fin
    found in the bilongo basket in the Xibila and a curtain or partition screening
    a bedstead.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The turtle Nkufu is described as carrying the roof of his dwelling on his
    back and as having a bad character marked by treachery and deceit.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the turtle story, the turtle and a man make a trading compact and set two
    traps; an antelope is caught by the turtle's trap.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The turtle has the ox carry the antelope, promises a share, sends the ox away
    to clean plates, and hides the meat in his strong dwelling.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The turtle repeats the same trick against the leopard, but the leopard feigns
    being caught and bites off the turtle's head when the turtle looks out of his
    shell.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The man recognizes that the turtle deserved his fate, and the passage says
    the turtle shell is found in the Xibila.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hippopotamus is glossed as one that eats very much; the head of the hippopotamus
    is found in the Xibila, and VUBA is defined as taking too much for oneself.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'A blacksmith''s earthenware bellows nozzle is used as an analogy for protecting
    oneself against burning fires, in a passage naming four amphibious animals: Nile
    crocodile, Indian crocodile, monitor lizard, and hippopotamus.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The saddle-back antelope Nkabi is linked with a saying about an antelope leaving
    the woods to die and a man leaving his town stockade also dying.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The horns of the saddle-back antelope are said to form the symbol of the parting
    of the ways, with an accompanying statement that people come from one stock and
    travel together until the road divides.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The monitor lizard Mbambi sees the cricket Nkawla resting in the leaf of the
    Licisa string plant and falsely calls it a tree to make the cricket move.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The cricket accuses the monitor lizard of using a false picture and intending
    to kill and eat it; the monitor lizard then devours the cricket.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Nsexi is described as a beautiful but deceitful and undutiful antelope, associated
    with the phrase 'dust of corruption,' and its head and horns are found in the
    Xibila.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: Nvuli, the waterbuck, listens to the false cry of the hunter and often becomes
    easy prey; its head and horns are found in the Xibila.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The pig is said to steal manioc in the market; some household fetishes are
    washed in pig blood, dried pig blood enters many bilongo, and the pig's head enters
    the Xibila.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: The otter saying is interpreted as implying that a wife should satisfy her
    husband's desire; otter skin is used as dress, and princes wear it when visiting
    the Xibila.
  category: relationship
  evidence_refs:
  - ev:11
