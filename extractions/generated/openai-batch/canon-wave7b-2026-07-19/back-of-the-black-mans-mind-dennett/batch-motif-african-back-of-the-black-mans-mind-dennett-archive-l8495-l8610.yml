candidate_motifs:
- id: motif:1
  label: Sacred animal parts deposited in ritual context
  taxonomy_refs: []
  basis: 'Multiple animal parts or substances are identified as found in the Xibila
    or in bilongo: shark fin, turtle shell, hippopotamus head, monitor-lizard skin,
    antelope heads and horns, pig blood and head, and otter skin.'
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage documents ritual placement and use but does not fully explain
    the ritual system or the meanings of each deposited part.
- id: motif:2
  label: Deceitful animal is punished by retaliatory deception
  taxonomy_refs:
  - trickster_boundary
  basis: The turtle deceives partners over shared food, but the leopard deceives the
    turtle in return by feigning capture and kills it; the man says the turtle deserved
    its fate.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage does not use the word trickster; the taxonomy link is based
    on the described deceit, boundary crossing, and reversal.
- id: motif:3
  label: Predator uses false naming to expose prey
  taxonomy_refs:
  - trickster_boundary
  basis: The monitor lizard falsely calls the Licisa leaf a tree to induce the cricket
    to move, and the cricket names the statement a false picture before being devoured.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The episode is brief and gives no wider narrative consequences beyond
    the cricket's death.
- id: motif:4
  label: Parting of ways from a common origin
  taxonomy_refs:
  - departure
  basis: The saddle-back antelope's horns are said to symbolize the parting of the
    ways, and the sign says all come from one stock and travel one road until the
    way parts.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The taxonomy link to departure is approximate; the passage presents a
    symbolic sign rather than a full journey narrative.
- id: motif:5
  label: False cry leads prey to destruction
  taxonomy_refs: []
  basis: The waterbuck listens to the hunter's false cry and often falls easy prey
    to its destroyer.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage gives this as a characteristic behavior rather than a developed
    tale.
- id: motif:6
  label: Animal blood used to empower or cleanse household fetishes
  taxonomy_refs:
  - sacrifice
  basis: After certain palavers, household fetishes such as Mpumbu are washed in pig
    blood, and dried pig blood enters many bilongo.
  evidence_refs:
  - ev:10
  confidence: low
  cautions: The passage does not explicitly describe a sacrificial act; the taxonomy
    link is limited to ritual blood use.
