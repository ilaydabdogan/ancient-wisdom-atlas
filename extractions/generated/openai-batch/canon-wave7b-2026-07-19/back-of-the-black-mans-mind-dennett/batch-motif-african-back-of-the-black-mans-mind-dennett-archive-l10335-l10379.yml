  summary: The passage describes Bini witchcraft terminology and a poison ordeal using
    INYI bark and water, briefly notes drum language and drums used when the Oba “makes
    father,” and lists road jujus, representational objects, and the naming of a road
    marked with Mwiheyo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage gives Bini, Jakri, and Bavili terms connected with a wizard or
    witchcraft figure: AzE, Olotcho, and Ndotchi.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person accused of witchcraft is given the bark of INYI pounded with water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Vomiting after taking the INYI bark mixture is treated as innocence; not vomiting
    is said generally to result in death, and guilt is then considered proved.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says drum language does not appear to exist much north of Old
    Calabar and that the Bini will not tell the writer about it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the Oba makes father, called Ezimi in the passage, a big thick drum beaten
    in the father’s house is called Ekun Alwera.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The musicians carry two long drums called IDAN, one small drum called Uke,
    one medium drum called IGEGAN, and one large drum called Imigan.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Road jujus are called MwiHEYO.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Cowries, a big stone, pebbles, and a spoilt gun are said to represent Ebami
    Ake, Okwhaihe, Ovia, and Ogun, respectively.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: When people hear or notice that a road has a MwiHEYO put on it, they speak
    of the road as Ulawma.
  category: speech
  evidence_refs:
  - ev:7
