canonical_text:
  quote: ''
  summary: The passage describes the burial handling of a deceased Maluango near two
    baobab trees, a route through a landscape marked by named sacred groves and a
    distant numbu tree, news that Maniluemba has accepted an invitation to fill the
    vacant throne, and an encounter with Maniluemba carrying protective fetishes and
    near a hut sacred to the marriage fetish ngofo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two mighty baobab trees stand near the Catholic Sisters' Mission, and the
    deceased Maluango's body is buried near them after being brought to Xienji.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the people of Buali bring the coffin to Xienji, the people of Lubu throw
    shells at them and chase them away before taking charge of the body with Mamboma
    for burial.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The route is described through a coastal and inland landscape containing multiple
    named sacred groves, including groves associated with Nymina, Lungululubu, Mpuku
    Nyambi, Xilu Xinkukuba, Xivuma, Nxiluka and Xikanga, and Xinjili.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Xilu Xinkukuba is described as a minor grove spoken of as the offspring of
    Mpuku Nyambi, and a grove at Xissanga is described as sacred to the double personages
    Nxiluka and Xikanga.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A huge numbu tree at Bitoko is said to be visible from a passing ship more
    than twenty miles from the sea and later is described as towering above palms
    and other trees.
  category: object
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:6
  text: At Luvwiti, the narrator learns that Mamboma and the other princes have returned
    from Maniluemba and that Maniluemba has accepted their invitation to fill the
    vacant throne of Maluango Prati.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Maniluemba is reported to have gone from Bitoko to Ndembuano during French
    carrier requisitions, and the speakers describe him as a man of peace who did
    not want trouble with the white man.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Ndembuano, Maniluemba is found wandering with the little fetishes Nthi
    and Nkubi in his hand and wearing the Bicimbo, described as a sash of iron boat-chain,
    over his right shoulder and under his left arm.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that, protected by these fetishes, anyone who wished Maniluemba
    harm would be killed by them, and that the fetishes would divine the person's
    thoughts.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Maniluemba goes within a rush fence called Lumbu, which guards the privacy
    of his wives, and nearby is a little hut called nzo ngofo, described as a house
    sacred to the marriage fetish ngofo.
  category: object
  evidence_refs:
  - ev:7
