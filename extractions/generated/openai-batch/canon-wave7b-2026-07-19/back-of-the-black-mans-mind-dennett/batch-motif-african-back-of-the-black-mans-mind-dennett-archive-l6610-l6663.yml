canonical_text:
  quote: In us are two great lights, the light uncreated and the created light.
  summary: The passage presents sacred rivers and named concepts as lessons about
    moral danger, spiritual and natural law, ancestral connection with God, natural
    connection with the Sun, lower nature figured through snakes, rainbow symbolism,
    generation, death-union with Nzambi, and the authority of the Fumu to rule living
    things in Luango while warning against wrongdoing.
  language: English
  quote_policy: quoted
