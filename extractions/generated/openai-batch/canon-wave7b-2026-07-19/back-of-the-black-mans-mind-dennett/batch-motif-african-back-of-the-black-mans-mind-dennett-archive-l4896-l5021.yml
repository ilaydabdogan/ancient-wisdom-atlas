canonical_text:
  quote: ''
  summary: The passage describes the making and use of Zinkici or Nkici Mbowu nail-driving
    fetishes. A party enters the wood with a Nganga to cut a Muamba tree; a name-calling
    prohibition is tied to death and the entry of the named person's Kulu into the
    tree and later fetish. A chosen spirited boy or hunter is named, the tree is cut,
    blood is said to come from it, fowl blood is mingled with it, and the named person
    is said to die soon after. The resulting fetish is used in oaths, demands for
    punishment, and palavers by driving nails into it. The passage also notes their
    multiplication, importation, colonial suppression, and several named examples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A party enters the wood with the Nganga to cut the Muamba tree with the intention
    of making a fetish.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During this tree-cutting expedition, it is forbidden to call another person
    by name; the passage states that if this is done, the named man will die and his
    Kulu will enter the tree and preside over the fetish.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A palaver may decide whose Kulu is to enter the Muamba tree; the chosen person
    is described as a boy of great spirit or especially a great and daring hunter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Nganga cuts down the tree, blood is said to gush forth, a fowl is killed,
    and the fowl's blood is mingled with the blood said to come from the tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The named person is said to die within ten days, and the passage describes
    his life as sacrificed for what the Zinganga consider the welfare of the people.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: People pass before the Zinkici Mbowu and call on them to kill the speaker
    if the speaker has done a specified act.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Other people go to the fetishes and demand that they kill someone who has
    done or is about to do them a serious injury.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: When a person swears or makes a demand before the fetish, a nail is driven
    into the fetish, and the Kulu of the sacrificed man is said to see to the rest.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The fetishes attended big palavers and were knocked by the parties involved
    so that a false speaker or false witness should die.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says European Governments remove these fetishes, but also says
    that removal does not prevent replacement and may lead people to guard a fetish
    secretly.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The wooden figures in this class are described as numerous; their multiplication
    is attributed to districts wanting their own nkici and to importation of figures
    reputed for slaying powers or deterrence.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage lists named examples including Mambili, Mamboni Pwati, and Mambika,
