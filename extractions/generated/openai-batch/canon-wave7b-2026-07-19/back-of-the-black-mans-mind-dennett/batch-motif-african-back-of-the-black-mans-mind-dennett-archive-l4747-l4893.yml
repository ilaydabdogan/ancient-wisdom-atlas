  summary: The passage catalogues Bavili objects and image classes associated with
    fertility or virility tests, marriage and protective bracelets, seasonally oriented
    figures, nail fetishes, and classifications of persons and ritual specialists
    under Ndongoism. It also distinguishes Bavili religion from a narrower concept
    of fetishism and includes plate captions for a sick woman before a nail fetish
    and a baobab tree.
  language: English
