  summary: The passage catalogues named trees, shrubs, string plants, and plant-derived
    substances, describing their uses in medicines, burial and grave practices, town-gate
    posts, travel food, fire-scorched regrowth, royal and sacred-ground markers, prohibitions
    on entry and burning, and a brief report that the spider made a ladder to heaven
    to fetch fire.
