  text: A man may close his house and place manioc, banana, or palm leaves around
    the latch to signify that no woman may enter; the custom is named Lu Kandu Ba
    Kandikila.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Palm-fruit husks and shells are used in smoking dead bodies, and Biumu fruit
    is made into an ointment for drying wounds.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nkala is planted over graves, and its wood is used for posts of the entrance
    gate to towns called Mabili.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Misakasaka is wound around Nkala posts, while Mikwici and Macisa are cane-like
