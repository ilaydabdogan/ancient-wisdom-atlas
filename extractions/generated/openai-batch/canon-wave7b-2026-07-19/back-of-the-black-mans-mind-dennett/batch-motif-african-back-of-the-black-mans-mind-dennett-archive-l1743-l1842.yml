canonical_text:
  quote: ''
  summary: 'The passage lists several divisions of the courts of Maluango and Mamboma
    and describes procedures used when guilt or succession cannot be otherwise determined.
    Named officials call in ritual specialists who use objects and bodily signs: a
    lid that cannot be removed, grass wisps and a mat that cling to a boy, a scented
    medicine bundle, a nearly red-hot knife, hands that turn back-to-back, and a magic
    mirror. The passage then discusses uncertainty about royal succession, contemporary
    consultation of diviners, Mpuku Nyambi''s dress and instruments, and provincial
    courts modeled on the described courts.'
  language: English
  quote_policy: summarized
