canonical_text:
  quote: ''
  summary: The passage introduces Nkici-ism as linked to sacred groves and the kingly
    office. It describes Xibila as sacred grove or sacred land associated with Maluango’s
    official residence, where the king mediates between mankind and Zambi, receives
    greetings and legal complaints, and hosts public palavers. In drought or other
    communal trouble, the Bavili appeal to the king; the court may decide the issue
    is beyond human settlement, and Nganga Mpuku Nyambi may be called to divine the
    cause with a magic mirror. Possible explanations include immorality, God’s pleasure,
    or the need to send offerings to Bunzi for rain.
  language: English
  quote_policy: summarized
