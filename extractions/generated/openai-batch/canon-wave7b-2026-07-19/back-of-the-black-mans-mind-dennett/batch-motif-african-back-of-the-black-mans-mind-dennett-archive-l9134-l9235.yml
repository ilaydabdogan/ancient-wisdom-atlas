canonical_text:
  quote: ''
  summary: The passage discusses British administration in Benin, the need to understand
    native political and religious institutions, and the sacred status of the kingdom's
    boundaries. It then describes the Queen mother Ioba, her residence and court,
    her right to sacrifice human beings, and a reported origin account in which a
    son of Awyaw comes from the Yoruba-associated direction of Uhe/Ife, settles briefly
    in Benin, leaves, announces that a daughter of Ogiegaw is pregnant by him, and
    thereby fathers Eweka, the first Oba of the Bini, from whom Oba Overami is said
    to trace descent.
  language: English
  quote_policy: summarized
