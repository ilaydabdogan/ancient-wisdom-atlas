canonical_text:
  quote: ''
  summary: The passage presents Bavili categories of forbidden acts and criminal law,
    including prohibitions concerning God, ritual images, sacred days, maternity,
    killing, adultery, theft, false witness, coveting, totemic marriage restrictions,
    divine punishment through withheld rains, offerings to powers, responsibility
    for offenders, compensatory punishment, slavery, and the substitution of a goat
    when a condemned person cannot be killed because of dissent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bavili are described as classifying sins under a general class called
    Xina, also spoken of as Ka Zila, meaning no road.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first section is called Xina Xivanga Nzambi, described as what is contrary
    to God the creator, and its sign is Mawso, the tail of the ox and sign of office
    of the Kongo Zovo.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The second section is associated with fear of being photographed and with
    the magic glass of the Nganga Nyambi, who alone may look into it to discover the
    successor of the defunct Maluango.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The third section is illustrated by mothers correcting children when they
    speak foolishly of God.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The fourth class, called Sona, includes fourth-day restrictions on a prince,
    Kongo Zovo, or father; a Nganga Bilongo; and women working in fields.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The fifth class includes prohibitions concerning maternity, sexual conduct
    before passing through the paint house, sleeping arrangements, and dishonor to
    parents; it is summed up in the word 'Ngo, the leopard.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: Killing, adultery, theft, and false witness are listed as additional forbidden
    acts and grouped as Xina Nkaka.
  category: other
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage states that what is under the market tree is sacred and that the
    tree is the last resting place of the body of the defunct Maluango on the way
    to burial.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: Aza Bina, or totems, are said to determine whom people may marry; a man may
    not marry a woman whose totem is the same as that of his mother's family.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Contravention of these laws is said to be punished by God through withholding
    rains in due season, requiring offerings to powers representing God's attributes
    on earth.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The father, the Kongo Zovo, or the village may be responsible if a delinquent
    is not arrested and may have to pay a share of the fine or sell the prisoner into
    slavery if he cannot pay.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Children and fools or idiots are not described as personally responsible,
    but compensation may be claimed from their parents by the injured party.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: Killing in self-defense and open taking from plantations when very hungry
    are treated as justifiable facts, though payment for damage is expected.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Punishment is explained as payment for damage done to God, king, prince, father,
    or neighbour, with money, goods, or slavery as possible forms of satisfaction.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:15
  text: A condemned man may not be slain if one village voice dissents; under those
    circumstances a goat is killed in his stead, portions are given to the community,
    and the culprit is sold.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: When a murderer or culprit is to be killed, the Kongo Zovo or prince hands
    the person to Mamboma, who hands him to Maluango.
  category: sequence
  evidence_refs:
  - ev:16
