- id: motif:4
  label: Maternity and initiation boundary before sexual union
  taxonomy_refs:
  - initiation
  basis: A girl must not have connection with a man before passing through the paint
    house, within a class of maternity-related prohibitions.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage names the paint house but gives no details of the rite, so
