canonical_text:
  quote: ''
  summary: The passage lists Bavili grove groups and associated powers or terms. It
    notes a saying that religion comes from the East and describes Mabili as the offspring
    of motion. It presents Kungu as a fruitfulness-associated grove in Buali where
    certain dead are placed under a Lomba tree, then gives related terms for mystery,
    sprout or rising river, and attraction. It then describes the Nyambi group as
    associated with life, with named powers connected to ruling, umbilical protection,
    maternal and paternal love, birth, safe delivery, rain-related famine inquiry,
    and divination.
  language: English
  quote_policy: summarized
