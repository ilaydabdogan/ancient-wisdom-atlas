canonical_text:
  quote: ''
  summary: The passage describes Bavili XIBILA sacred groves, distinguishing sea-associated
    and rain/nature-associated classes, noting paired rainwater and seawater groves,
    water features connected with a snake or Xama, a central shimbec hut used by the
    Nganga, and shells, animal remains, feathers, horns, and snake skins found in
    or near the grove. It then recounts the author's discovery of a circular clearing
    with an old central tree encircled by whale jaws and a new hut, followed by a
    local story about a wizard and a thief who unknowingly choose the same place and
    together raise a hut while attributing each other's materials to fetishes or Nkici.
  language: English
  quote_policy: summarized
