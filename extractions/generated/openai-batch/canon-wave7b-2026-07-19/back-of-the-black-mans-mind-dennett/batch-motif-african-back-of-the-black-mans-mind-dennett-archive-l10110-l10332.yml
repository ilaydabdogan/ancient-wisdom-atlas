canonical_text:
  quote: ''
  summary: 'The passage first notes Benin wood, ivory, and bronze art and the reaction
    of chiefs to photographs of ancient works. It then defines a house as a family
    abode under a head and describes an ideal Bini house: successive fences, named
    walls and gardens, separate quarters for husband, wives, and young men, central
    rooms for father, mother, head/reigning son, and spare use, domestic altars, a
    central sunken basin under an open roof, named structural elements, and a medicine
    altar outside the rear wall.'
  language: English
  quote_policy: summarized
