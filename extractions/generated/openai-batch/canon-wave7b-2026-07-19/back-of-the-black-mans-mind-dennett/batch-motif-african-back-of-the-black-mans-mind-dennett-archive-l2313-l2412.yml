canonical_text:
  quote: ''
  summary: The passage describes Bavili legal rules concerning children, succession,
    pawning, ransom, adoption, guardianship, and property. It states that birth sanctifies
    a child, succession generally favors the wisest heir, the mother guards children’s
    property, the father retains ransom authority, and guardianship is ordered through
    kin and appointed guardians.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Birth is said to sanctify the child; as the child of its mother, the child
    may inherit the uncle’s property.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The general rule of succession gives property to the wisest heir rather than
    to the eldest son.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mother is described as having no property of her own but as guardian of
    her children’s property, which passes to her family if the children die.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Both father and mother watch over their children’s interests and can punish
    them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mother alone has the right to pawn her child, but she must first consult
    the father; the father cannot pledge the child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: If the mother is dead, a brother may pawn his sister or an uncle may pawn
    his niece, but the living father must first be given a chance to help with goods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A father may call witnesses, lend cloth to the uncle, and drop a palm-nut
    kernel into his box; the passage interprets this act as meaning that he has bought
    his daughter.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Until the debt is paid to the father, the uncle cannot pawn the child again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A person is described as never fully free from being pawned in this way, while
    the father always retains the right to ransom the child.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The ransom amount increases if the pawned child has offspring, and even after
    payment the child may choose to remain where it is.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A child bereft of all family ties may be adopted by one of the father’s friends,
    who cannot sell or pawn the child or claim its earnings.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: 'The Bavili are said to recognize six forms of guardianship: grandfather,
    father’s family, mother’s father, mother’s family, father’s friend, and a family-appointed
    guardian.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The guardian acts as a father to the child but cannot touch the child’s property,
    which belongs to the mother’s family.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The family judges when the child shall leave the guardian, generally at adulthood;
