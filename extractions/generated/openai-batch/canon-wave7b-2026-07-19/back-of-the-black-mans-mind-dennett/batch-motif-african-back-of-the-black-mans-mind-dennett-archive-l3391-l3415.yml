  summary: The passage describes an observed Bavili bead-counting procedure, explains
    number words KUMI, KUMA, and KAMA, and lists hand-based measures and commodity-value
    equivalences involving tobacco, beads, palm measure, grass cloth, and cubit length.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Bavili counting formerly often involved putting two
    beads on the ground for each counted unit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the count of four, two beads were placed apart; at the count of eight,
    the passage describes two heaps of ten each plus four beads, or twenty-four in
    all.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After amassing the beads again, one bead was placed on one side at twenty-five,
    described as one generation; at the count of forty, the passage gives the total
    as one hundred.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that the word for ten is KUMI, derived from KUMA, glossed
    as 'to cause' and 'to reason.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that ten is the square root of KAMA, and glosses KAMA as
    meaning the royal wife and one hundred.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The smallest measure named is XiTlNi, defined as the distance from the tip
    of the middle finger to the bottom or root of its joint in the palm.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: XiTlNi is said to measure two nails or '4^ inches' as printed, and to be used
    for measuring long strings of tobacco cut into BiTINI.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage gives the value of a XiTlNi of tobacco as thirty-six BiLABU or
    beads.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Two BiTini make one Mbokana, glossed as palm; two Mbokana make one LuBONGO
    ZiFULA, a native grass-cloth piece measuring eighteen inches or a cubit, valued
    at one hundred forty-four beads.
  category: relationship
  evidence_refs:
  - ev:3
