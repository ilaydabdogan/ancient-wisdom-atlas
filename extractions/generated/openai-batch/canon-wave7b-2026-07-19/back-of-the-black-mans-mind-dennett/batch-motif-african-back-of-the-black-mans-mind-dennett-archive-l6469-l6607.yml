canonical_text:
  quote: ''
  summary: The passage presents a six-category symbolic scheme associated with rivers,
    grove contents, and lands, then gives a lesson attributed as a close reproduction
    of Maluango's teaching. The lesson describes the way of being to and from sky/heaven,
    God as source and heavenly ruler, the earthly ruler as counterpart, human generation
    through powers given by the Sun, moral waters, waters of life mingling with primeval
    matter, and a contrast between lower animal life and higher seed- and fruit-bearing
    life.
  language: English
  quote_policy: summarized
