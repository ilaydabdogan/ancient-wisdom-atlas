  evidence_refs:
  - ev:3
- id: obs:6
  text: The word Mbumba is said to mean moisture, secret, and the act of drawing earth
    around plant roots; the smell of the earth is said to impart a secret to women.
  category: attribute
  evidence_refs:
  - ev:4
