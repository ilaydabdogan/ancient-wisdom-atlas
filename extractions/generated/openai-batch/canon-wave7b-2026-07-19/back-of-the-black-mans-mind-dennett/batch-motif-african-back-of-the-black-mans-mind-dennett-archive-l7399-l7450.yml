canonical_text:
  quote: This snake causes man to reflect and reason.
  summary: The passage describes an omen-like snake encountered by men wearing the
    iron bracelet of Ngofo, who must ask themselves questions about taboo actions.
    It then describes Mbumba as a great snake of wells and moisture, feared by women
    and associated with secrecy, smell, marriage, and bracelets. The passage also
    explains terms for green or royal washing water, including water from manioc leaves
    and distinctions between ordinary and royal washing language, with a footnote
    about mandioca and its sacred association with the South wind, Bunzi.
  language: English
  quote_policy: quoted
literal_observations:
