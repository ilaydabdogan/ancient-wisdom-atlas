canonical_text:
  quote: ''
  summary: The passage describes Bavili procedures for marking palaver arguments on
    smoothed ground, methods of tallying and finger-counting, Bavili and Kakongo finger/toe
    rhyme variants, an explanation of the little finger's claimed primacy, and the
    use of blue glass beads for counting with a note connecting Labu to fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chapter section is introduced as concerning measures, signs, symbols,
    palavers, counting, fingers, lineal measures, seasons, rain prayer, symbols, and
    drum language.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Bavili palavers, parties on each side smooth the earth in front of them
    and use it to keep count of points for and against in the argument.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: The first speaker opens the palaver by making a dot with the tip of his index
    finger and marks his robbery accusation with a stroke after the dot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:4
  text: The defendant's points are marked below a dividing line, while the first speaker's
    replies are marked above the line.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:5
  text: A new phase of the palaver is marked by another dot, and the day’s closing
    of the palaver is marked by drawing a double line across the dividing line with
    the index and next finger.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: The passage identifies Bavili ground-marking for counting as “Bisona bintawto,”
    glossed as writing on the ground.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:7
  text: For one counting method, four upright strokes are made on the ground and the
    fifth is made by crossing the four strokes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: When counting by tens, two strokes are marked with the index and second fingers
    five times, followed by a separate stroke to show ten.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Finger-counting begins by placing the index finger of the right hand upon
    the little finger of the left hand.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The author says both the Bavili of Luango and the Bakotchi of Kakongo have
    variants of an old nursery rhyme for fingers or toes.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the Bavili finger rhyme translation, the little finger is described as
    a very old or primeval man and says it is the chief, while the thumb says it is
    apart and has left the others because of strife.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: In the Kakongo version, the first two lines are said to be the same as the
    Bavili version, while later lines mention mother and father and say the one apart
    is a slave.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: A Kabinda woman explains that the little finger claimed to be chief or first
