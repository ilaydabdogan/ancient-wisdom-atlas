canonical_text:
  quote: ''
  summary: The passage gives an ethnographic and lexical classification of Bavili
    powers or named forces. Kanga is associated with conjunction or assimilation.
    BUNZI Bu Bamba is described as the South wind, located in Muanda, receiving offerings
    from Maluango after consultation with Nganga Mpuku Nyambi, and associated with
    rain, life, and good things. Mbamba is described as a palm kernel and also a coronella
    snake; Mbazu is fire and is linked to fusion or offspring of marriage. The Mbawmbo
    group is associated with motion, with a grove east of Maluango's kingdom. Thunder,
    lightning, Luabi, Solokoto, and Mabili are described in relation to omens, motion,
    procreation, tornadoes, and wind.
  language: English
  quote_policy: summarized
