canonical_text:
  quote: Bunzi received their gifts, but Nzambi heard not their prayer, and the rain
    came not.
  summary: During drought in the Bavili country, gifts and prayers fail to bring rain.
    A mission priest announces prayers to Almighty God while warning that sin may
    prevent rain. Traditional priests then divine that God's wrath is due to hidden
    immorality and violations of local law. Chiefs investigate and identify three
    pregnant girls who had not passed through the paint-house custom; the narrator
    begins a digression defending and explaining that custom.
  language: English
  quote_policy: quoted
