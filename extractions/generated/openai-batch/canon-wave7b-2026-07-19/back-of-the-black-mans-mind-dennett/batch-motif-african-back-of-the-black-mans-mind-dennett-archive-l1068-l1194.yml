canonical_text:
  quote: ''
  summary: The passage introduces a Kongo coronation context. It recounts a failed
    or incomplete coronation of Maluango/Maniluemba after the French Government refused
    funds, followed by drought and famine that people attributed to his presence.
    It then describes the Bacilongo chief Neamlau, the death and burial of the late
    Neamlau in Sonio according to family ties and ancient usage, and the election
    of his nephew Nenimi, whose coronation required a dance and festival in honor
    of the deceased ruler, with guests and princes summoned despite a rainless year.
  language: English
  quote_policy: summarized
