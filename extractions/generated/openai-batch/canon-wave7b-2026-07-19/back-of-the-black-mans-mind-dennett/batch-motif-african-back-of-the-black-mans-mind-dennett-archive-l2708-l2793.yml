canonical_text:
  quote: ''
  summary: The passage records Vili legal and economic customs concerning units of
    value, valuation and hiring of enslaved persons, liability for a slave's death
    during hired service, terms for slaves and domestic servants, debt repayment,
    cattle leasing, trade commissions, and arrest of a person as security for unpaid
    debt until public settlement by palaver.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One hundred Mbongo Fula, or 4,000 Vili, are called Kama Mbongo and are given
    as the price of a small enslaved child of about five years old.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cloth is used as a measure of value, with the passage giving equivalences
    among fathoms, yards, folds, longs or cortados, pieces of cloth, francs, and Vili.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The described custom allows men to be hired out like things; a labor-seeker
    may hire slaves or others from a large slave owner.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a hired slave dies during service, the hirer must pass before the fetishes
    and declare that he had no hand in the death.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the hirer did not cause the slave's death, the stated compensation is 20
    longs; if he wilfully caused the death, the compensation is 5 to 10 slaves according
    to his wealth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Slaves are called children of the cloth or Muana Ntu, and the owner is described
    as responsible for the slave's actions while also having the right to kill a disobedient
    slave.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Domestic servants of a rich man are called Bavinji; a father may ask a friend
    to take his son as a servant and teach him, producing the role called Xileci.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Borrowed goods must be repaid in double amount, regardless of the length of
    the debt, unless a date for return is fixed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Cattle may be leased under a stated sequence of distribution of increase between
    owner and caretaker.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A man may commission another to trade for him under exact instructions, with
    half the profits paid to the agent and losses exacted from the agent or his family.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A commission to act for another must be stated before witnesses for a particular
    occasion; no general procuration is given.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: If a fixed debt repayment is refused or delayed, the creditor may arrest a
    person connected to the debtor's family or nearby princedom until public settlement
    by palaver.
  category: action
  evidence_refs:
  - ev:8
