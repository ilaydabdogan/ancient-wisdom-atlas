literal_observations:
- id: obs:1
  text: A sequence of named signs and objects is explained as referring to a first-person
    speaker's treatment by relations, a family dispute, witnesses, placement apart,
    town treatment, and outcast status.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The nozzle of the bellows, called nxelo, is said to explain that the speaker
    and his opponents were sons of one father, with the speaker opposed by three half-brothers,
    sons of another wife.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The three ant-hills, called makuku matatu, are said to indicate that witnesses
    were called, saluted three times, and told about the palaver.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The smaller drums, called bikula, are linked in the explanation to the speaker
    being forced to announce publicly that he was an outcast from his family.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: After taking bark and proving innocence, the speaker beat a big drum, sent
    a bell to announce the day of return to town, and sent a knife of office to accusers
    to demand damages.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Batexi or Bateki are said to claim the same Mother as the Bavili and to
    use filed front teeth and facial marks.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The listed regional groups are differentiated by numbers and forms of filed
    teeth, facial marks, stomach marks, tattoos, or keloids.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage reports that news of the wreck of the mail steamer Ethiopia off
    Luango was heard in Landana by drum message within one or two hours.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Nkonko drum is described as a rounded and hollowed log of wood about six
    feet long with a long slit or incision along the top.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: A skilled operator with drum-sticks is said to be able to say anything in
    his dialect on the Nkonko drum, provided there is a good listener.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage assigns vowel sounds to particular striking locations on the drum,
    with other letters formed by combinations and emphatic or precise strikes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Example drum messages include a call to arms, a call for men in the bush to
