  quote: ''
  summary: The passage explains a series of named signs and objects as referring to
    a family dispute, accusation, proof of innocence, return to town, and demand for
    damages. It then lists regional tribal body marks among peoples between Luango
    and Brazzaville, and describes the Nkonko drum, its construction, its ability
    to transmit speech, and examples of drum messages for news, gathering, arms, and
    enemy warning.
  language: English
