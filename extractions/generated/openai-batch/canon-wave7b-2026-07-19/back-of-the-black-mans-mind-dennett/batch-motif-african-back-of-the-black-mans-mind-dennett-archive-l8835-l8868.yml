  quote: ''
  summary: The passage gives moral instructions under the heading Xina Mvila, using
    the Sungu and the elephant as models, warning against sin, unlawful marriage choice,
    and domination by fear, and urging respect for God and authorities. It then lists
    several Xina categories and connects them with water, earth, marriage and desire,
    motion and procreation, plenty, life and birth, and related moral failures or
    lawful marriage.
