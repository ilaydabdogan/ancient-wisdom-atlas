canonical_text:
  quote: ''
  summary: The passage describes Bini sacred sites and ritual objects, including the
    sacred stone Okuta, a tree marking where the top of Ezomo's heaven-reaching ladder
    was said to have fallen, silent markets near sacred places, oath-taking objects
    called Ekhwai, nail-driven fetishes in Olukun's temple, and the Ematon iron staff
    with figures of chameleons, leaves, a horse, birds, a knife, and a hoe explained
    through named symbolic associations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sacred stone called Okuta is located in the forest between Adenyoba and
    ITE.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A tree on the Sapoba road has a mound of earth and cowries in front of it
    and is said to mark where the top of Ezomo's ladder fell.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ezomo is described as a great war chief who heard thunder and interpreted
    it as an enemy of the Oba wishing to fight him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ezomo built a ladder intended to reach the heavens.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When Ezomo and his people were on the ladder near the home of thunder, the
    ladder gave way and its top fell near the tree.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Near sacred spots, pots of water, cups, yams, or bananas may be left with
    cowrie prices, forming silent markets that the narrator says he has not known
    to be abused.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: People swear by licking and touching stones, iron, cowries, twisted rope,
