  summary: The passage catalogs sacred rivers of Benin City and their groves, then
    recounts associated accounts of Oyisa/Okwo, Ovia, Ato, Awre/Ikpoba, Erubi, Ise,
    and Awreomo/Ake, including river spirits, signs, medicines, royal conflict, and
    ritual representations.
