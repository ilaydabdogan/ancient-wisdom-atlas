canonical_text:
  quote: ''
  summary: The passage defines several Kongo terms and gestures connected with homage,
    cycles, fruitfulness, rains, and the end of the seasonal cycle. It then describes
    drought anxiety in Fjortland/Kongo, popular blame directed at rulers for neglecting
    duties to primeval powers, a remembered famine blamed on an uncrowned king-elect,
    and a ritual response in which sacred groves were cleaned and goods sent in Maluango's
    name to Bunzi to request rain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kunda is described as an act of homage involving throwing oneself on the ground,
    rubbing the earth with the sides of the palms, and then touching the sides of
    the face with the hands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Muanda Sunji is glossed as the deep, valley, or soul of the cycle; Sunji Ndungo
    is the skin stretched over the hollow of a drum; Sunjika is to clear up and straighten
    a complicated palaver.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nsunji Yaduka means that the cycle is ended and is said to refer to the end
    of a season or a year.
  category: sequence
  evidence_refs:
