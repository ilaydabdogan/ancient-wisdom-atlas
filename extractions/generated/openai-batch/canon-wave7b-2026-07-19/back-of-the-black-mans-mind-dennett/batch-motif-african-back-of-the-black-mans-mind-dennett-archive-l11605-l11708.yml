canonical_text:
  quote: ''
  summary: The passage presents an ethnographic and etymological account of Bini months
    in relation to farming work, numbers, and symbolic meanings. It describes cutting,
    burning, clearing, planting, supporting yam vines with poles, weeding, harvest,
    rest, and associated terms of scraping, spreading, entanglement, conception, germination,
    pregnancy, travail, and birth. It also compares selected Bini month meanings with
    Yoruba Ifa/OviA, Xivili fresh and salt water symbolism, Kongo seven, and Bavili
    month meanings, while stating that no genetic connection has been shown.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the first month of the Ahishuku season described here, the Bini cut down
    woods and forests to make farms; this action is called IFIE.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage glosses Ifa as that which is scraped off and as the name of the
    Yoruba palm nut god; it also glosses Fa as to clean or scrape off.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage identifies OviA as a Bini or Bina palm tree river spirit that
    takes the place of Yoruba Ifa, and treats OviA as a lengthened form of Ifa.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says Efa or Eva would mean a scraping, connects scraping with
    creation in Xivili and Bini, and states that Bini Eva is the numeral two and is
    connected with OviA and ideas of creation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: In the third month, the people burn what they can of the felled trees; this
    act is called Egbaw and is associated with a cleaned or scraped state.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage contrasts Eva, two, and Eha, three, and states that Eha appears
    as Era in thirteen, with Era meaning father.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The author concludes that Eva and Eha give maternal and paternal principles,
    compared with Xivili second- and third-month symbols of the deep of fresh water
    and the deep of salt water.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: During the fourth month the Bini clear ground for planting yams; four is given
    as Ena, meaning that which contains the power of spreading. Five, Isan, is glossed
    as the act of springing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: During the sixth month, the people drive poles into the ground near their
    yams so that yam vines may creep up them; six is glossed as the act of being entangled
    and is called the month of marriage following love or spring.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: During the seventh month, they continue putting poles in the ground; seven
    is glossed as entangled and spreading and is said to resemble the meaning of Kongo
    sambuade, or seven.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: For months eight, nine, and ten, the people continue weeding plantations;
    the month-number meanings are given as much spreading or conception, having fruit
    or germination, and being heavy or pregnancy.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: In months eleven through thirteen, different yams become ready or are finally
    harvested; eleven is linked with first being or substance, twelve with maternal
    weight or travail, and thirteen with paternal weight or travail.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The fourteenth month is described as a month of rest and is interpreted as
    giving the idea of birth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage states that Bini month-name meanings correspond to some extent
    to Bavili month meanings, but also states that no genetic connection has been
    shown.
  category: relationship
  evidence_refs:
  - ev:7
