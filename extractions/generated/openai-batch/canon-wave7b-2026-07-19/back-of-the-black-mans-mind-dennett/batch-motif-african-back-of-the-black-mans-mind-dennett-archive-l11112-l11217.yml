canonical_text:
  quote: ''
  summary: 'The passage describes Og''ugu''s anniversary observance for his father''s
    death: goats are killed and their blood sprinkled on altars, named dances are
    performed, all-night torch-and-lamp singing processions move around his residence,
    and a morning procession with drummers, cowries, chalk, an umbrella bearer, and
    courtiers goes to a juju place to salute the great father associated with Overami,
    the late Oba of Benin. Og''ugu then scatters cowries to children. The passage
    also describes the Ugulu/Sakwadi, Okele, and Ohogo dances, including a circular
    ensemble dance led by a conductor, and begins a separate note on a dance hosted
    by Chief Obaseki in Benin City.'
  language: English
  quote_policy: summarized
