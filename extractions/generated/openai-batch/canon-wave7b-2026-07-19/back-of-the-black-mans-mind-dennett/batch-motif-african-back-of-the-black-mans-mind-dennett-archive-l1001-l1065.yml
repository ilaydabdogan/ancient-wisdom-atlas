canonical_text:
  quote: ''
  summary: The passage describes late-stage accession ceremonies for Maniluemba/Maluango.
    Nganga Mpunzi, identified as a priest who crowns or creates kings, appears with
    an iron chain and followers wearing palm-leaf wreaths while negotiating payment
    for clearing sacred ground. The king-elect awaits visits from representatives
    of families owning sacred ground; each must receive a gift before the priest's
    group clears grass and prepares a dwelling site. Until the ceremonies are completed
    the king-elect cannot live in the dwelling. The chosen ground is associated with
    the late Maluango Prati and contains several trees. Maluango offers hospitality
    to the narrator and explains that later he will receive submission from petty
    princes, declare Maluango Prati buried, crown himself as Maluango, and reinvest
    chiefs with caps of office. A footnote explains the palm-leaf sash as suggesting
    a marriage of the king-elect to his royal duties and gives ritual details concerning
    Nganga Mpunzi's sacred plant, fetish, and taboo.
  language: English
  quote_policy: summarized
