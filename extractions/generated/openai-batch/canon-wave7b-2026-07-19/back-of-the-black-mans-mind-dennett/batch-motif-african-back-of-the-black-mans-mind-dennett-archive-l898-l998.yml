canonical_text:
  quote: ''
  summary: The passage describes Maniluemba’s appearance and ritual adornment after
    election, an exchange between him and the narrator, explanatory notes on the Lembe
    marriage bracelet and animal skins, and several sacred trees, valleys, royal reception
    and burial locations, fertility taboos, and an evil rainbow-snake associated with
    Luango royal sacred ground.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Maniluemba is described as short and humpbacked, with styled moustaches, red
    and white chalk markings on his forehead and face, white chalk on his ears, a
    charm necklace, European-style outer clothing, a waist cloth, and an animal skin
    in front.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A heavy Lembe bracelet is on Maniluemba’s wrist, and it rattles when he shakes
    the narrator’s hand.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The narrator places offerings before Maniluemba, congratulates him on his
    election, talks with him, and takes his photograph.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Maniluemba gives the narrator his pipe to smoke, shakes his hand, presents
    him with three fowls from his people’s hunt, and tells him to go in peace.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Lembe bracelet is explained as showing that its wearer has been married
    according to a particular marriage rite.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wife married under the Lembe rite is described as guardian of her husband’s
    zinkici; if she commits adultery, the charms connected with the marriage are said
    to be found wet when the basket is opened.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Lembe wife is said to be kept strictly within her hut and fence and may
    not eat a named fish noted for trying to escape from nets.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A cited explanation says Lembe rites refer to the marriage of a woman who
    swears to die with her husband, or to cease living at the same time as he does.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Two skins worn in front in this manner are identified as a wildcat skin and
    an otter skin; wearers are considered well-to-do, and they are warned to remove
    the skins upward rather than downward or they will have no children.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: After passing Ximoko, the narrator reaches a grassy plain place marked by
    the sacred tree Nkumbi.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the sacred tree Nkumbi, the Maluango elect is received by princes on his
    first official entrance to Xibila, the sacred ground set apart as the residence
    of the Kings of Luango.
  category: action
  evidence_refs:
  - ev:5
  - ev:11
- id: obs:12
  text: The place and the tree Nkumbi are said by local informants to take their name
    from a royal maiden having reached womanhood there.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: A man and woman may not cross the Xibindu valley together; the man must cross
    first, and the woman may follow only after he is well across.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: If a man and woman cross such places together, they are said to be punished
    by having no children.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: A Nsexi tree, formerly a market tree, stands on the road to Lubu, the Maluango’s
    burial place; beneath it the corpse of a deceased Maluango is placed while awaiting
    those who will carry it to burial.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:16
  text: The small valley at the Nsexi tree is called the valley of the last look at
    Buali, Maluango’s town.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:17
  text: A deep valley near Luango is called Bulu Nzimbu Xikoko, glossed as the valley
    of the fly and the mosquito hand in hand.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:18
  text: Xama Ngonzola, called the evil rainbow-snake, is said to rise from the depths
    of that valley, and the numbu tree is named as the valley’s sacred tree.
  category: other
  evidence_refs:
  - ev:9
- id: obs:19
  text: The narrator states that traces of these trees and places may soon be lost
    and that he was fortunate to visit them while intact.
  category: other
  evidence_refs:
  - ev:10
- id: obs:20
  text: On another occasion, the narrator tries to photograph a muamba-tree, leaves
    Mambuku’s town, and goes to Buali expecting to find Maniluemba installed in state.
  category: action
  evidence_refs:
  - ev:12
