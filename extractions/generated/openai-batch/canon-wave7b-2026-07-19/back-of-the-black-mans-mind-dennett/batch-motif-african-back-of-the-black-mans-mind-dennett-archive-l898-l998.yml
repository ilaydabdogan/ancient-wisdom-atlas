candidate_motifs:
- id: motif:1
  label: Royal election and legitimating entrance to sacred ground
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage links Maniluemba to election and installation, and describes
    the Maluango elect being received by princes at the sacred tree on first official
    entrance to Xibila, the royal sacred ground.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage describes a ritual geography and reception but does not give
    the full election ceremony in this excerpt.
- id: motif:2
  label: Sacred trees as markers of royal, funerary, and valley places
  taxonomy_refs:
  - sacred_tree_axis
  basis: Nkumbi marks the royal sacred ground entrance, the Nsexi tree marks a place
    where the dead Maluango’s corpse waits before burial, and the numbu is named as
    a valley’s sacred tree.
  evidence_refs:
  - ev:5
  - ev:8
  - ev:9
  confidence: medium
  cautions: The text calls these trees sacred or ritually placed but does not explicitly
    describe a cosmic axis; taxonomy mapping should be reviewed.
- id: motif:3
  label: Fertility consequences of violating ritual handling or crossing rules
  taxonomy_refs: []
  basis: Improper downward removal of certain skins and joint crossing of Xibindu
    by a man and woman are each said to result in having no children.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: high
  cautions: These are reported prohibitions and consequences rather than a narrative
    episode.
- id: motif:4
  label: Marriage rite binding wife, husband, and charms
  taxonomy_refs:
  - sacred_marriage
  basis: The Lembe bracelet marks a marriage rite; the Lembe wife guards the husband’s
    zinkici, is subject to restrictions, and is said to swear to die or cease living
    with her husband.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The source is an explanatory footnote, including a quoted letter, rather
    than a myth narrative; the sacred-marriage taxonomy fit is provisional.
- id: motif:5
  label: Royal corpse’s liminal pause before burial
  taxonomy_refs: []
  basis: The corpse of the deceased Maluango is placed beneath a Nsexi tree while
    awaiting the people who will carry it to Lubu, in a valley named for the last
    look at Buali.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage gives a funerary station but no extended afterlife account.
- id: motif:6
  label: Evil rainbow-snake rising from valley depths
