canonical_text:
  quote: ''
  summary: The passage describes a 24-part divining-board formula involving Ifa, Opele,
    sacred palm kernels, and a line representing the diviner; it then presents the
    author's claim that the formula is preserved among Bavili, Bini, and Yoruba institutions.
    A Babalawo's story recounts Eware's rejected succession, exile, return with 201
    Ebami followers, teaching of Bini religion, the burning of a temple to reduce
    the Ebami, the escape of some Ebami into rivers as spirits, and Oyisa's visit
    to decide that all humans must die.
  language: English
  quote_policy: summarized
