  quote: ''
  summary: The passage explains that Mpungu is used with Zambi when missionaries translate
    the expression as almighty, and that NZAMBI Mpungu is associated with the sky
    and rain. It then identifies Senza as the west wind and says the Bavili connect
    the western sea, Mbu, with fatherhood, spirit, and motion, relating this to westward-originating
    rolling waves and to Se as father.
