    very good.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Mpav^LO Pawlo is identified as the common owl; hearing its hooting is interpreted
    as reassurance that all is well.
  category: speech
  evidence_refs:
  - ev:8
