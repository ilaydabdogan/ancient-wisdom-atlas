  evidence_refs:
  - ev:2
- id: obs:3
  text: Kna Kna is described as a slender black bird with a long tail that continually
    cries out its name.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the Bavili hear Kna Kna, they infer that something is wrong with Mabili,
    identified here with the Nkicinkondi or village entrance gate, or that sickness
    is near someone dear to them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Kna Kna bird is said to have come from the East with Mabili.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: MviA is described as a brown bird that cries Via; this cry reminds the native
    of witch-burning palaver and is called a bad sign.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: NUMVU is identified as a large dark-brown fish eagle living near rivers; an
    all-one-color bird is a bad sign, while one with white-tipped wings is a good
    sign.
  category: attribute
  evidence_refs:
  - ev:5
