  text: KULU is identified as the horned owl; if it comes near at night and is heard
    hooting, it is treated as a sign of death for the hearer or someone near the hearer.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: NXECI is described as a fairly large black bird with white-tipped wings; its
    song is said to portend witch palaver.
