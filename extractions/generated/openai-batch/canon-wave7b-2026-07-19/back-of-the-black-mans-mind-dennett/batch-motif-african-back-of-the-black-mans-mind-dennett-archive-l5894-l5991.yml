canonical_text:
  quote: ''
  summary: The passage describes Bavili named powers, groves, winds, and element associations.
    It presents Ngonzola as a southwest wind and evil rainbow connected with floods;
    Xibwinji and XiKamaci as earth-associated powers; rituals in XiKamaci's grove
    for cursing and withdrawing a curse; Samona as XiKamaci's opposite in a dispersion/concentration
    pair; a narrative in which XiKamaci punishes the king's children and is flooded
    into the sea; sea offerings and a claim on twins associated with XiKamaci; a double
    grove that brings forth an animal, wooden figure, and stone; and the fire-associated
    Bukulu group.
  language: English
  quote_policy: summarized
