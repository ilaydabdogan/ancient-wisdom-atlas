canonical_text:
  quote: ''
  summary: The passage describes Bavili recourse to their Nkicici in trouble, including
    petitioning and a hand-clapping departure gesture. It then discusses dictionary
    glosses and the author's explanations for terms rendered as Devil or Hell, including
    nkadimpemba, Nkadi/Nzaci, Bilunji/Bulunji, Bumba, and Ndongo, with repeated attention
    to fire, lightning, grave, and witch-burning imagery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bavili are said still to look to their Nkicici in times of trouble.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After placing a petition before the Nkicici, the Bavili are described as leaving
    his presence, clapping their hands three times, and urging him to hold the seven
    well in hand.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A note explains the seven as the Nkicici himself and six others.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage reports dictionary glosses in which nkadia-mpemba is given for
    the Devil and Bulunji or Bilunji is given for Hell among the Bavili.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author says nkadimpemba is unsatisfactory as a term, though it may have
    been used to translate the Christian Devil and may have been coined for that purpose
    by Fjort speakers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author imagines earlier missionaries presenting the Devil to the Fjort
    as a prong-tailed, fire-loving monster and imagines the Fjort discussing where
    that figure fit in their mythology.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says the Fjort connected fire and evil with the burning of witches
    and with lightning.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A witch is described as being entirely burned, with ashes cast to the wind
    and the nkulu undesired.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The white man's Devil is reasoned not to be a perishing witch, but a personage
    attached to the white man's lightning and not Nzambi Mpungu, the owner of the
    fire of heaven.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Nkadi is described as an attendant on the nkici Nzaci and as a term used in
    the sense of companion.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Nkadi is described as a black personage, while NKadi ampembe is explained
    as the white companion of the guardian of the lightning.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Bilunji is explained as the plural of Xilunji, meaning intelligence or spirit,
    and Bulunji is explained as the deep of the spirit and as the native word for
    grave.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The expression Yenda Ku Bumba is glossed as go to Bumba, and Bumba is described
