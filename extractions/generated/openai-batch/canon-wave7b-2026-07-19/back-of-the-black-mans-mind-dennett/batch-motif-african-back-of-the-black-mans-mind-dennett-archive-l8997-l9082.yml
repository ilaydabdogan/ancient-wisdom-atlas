canonical_text:
  quote: ''
  summary: The passage summarizes an ethnographic argument that Bavili sacred groves,
    rivers, provinces, trees, senses, colours, rainbow snakes, animals, law categories,
    and the king relate to ordered categories. It then turns to Benin/Bini religious
    materials, noting altars, temples, sacred groves, nail-driven fetishes, and a
    dual division of ideas said to correspond to Bavili NDONGOISM and NKICI-ISM.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Groves are described as grouped in sets of four, with a fixed order within
    each set and between groups.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that grove families are regarded as genetically related
    internally and between groups in the same way as the seasons.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author says insufficient information prevents detailed reconstruction
    of the order of the groves, despite having nearly one hundred names.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: The order of rivers is said to follow the order given by native informants
    and shown on a map; the order of provinces is said to rest on testimony, with
    categories preserved in both cases.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The association of trees with categories is said to be less direct, though
    the author sees connections among Maloango's virtues, trees, and categories.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that natives connect categories with senses, and that senses
    are connected with colours and rainbow snakes.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The order of the families in the senses-colours-rainbow-snakes case is said
    to be given by the order of spectral colours.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Animals are said to connect with categories through prohibitions or categories
