  summary: The narrator describes Nenimi's arrival and attire, the tree-marked dance
    and meeting square, an enclosure containing the late Neamlau's riches and relics,
    Gabba serving as guide, and the opening of a curtained shimbec where an effigy
    of Neamlau, his named native cap, family attendants, music, and relic objects
    are displayed.
