canonical_text:
  quote: ''
  summary: The passage describes Bavili measures of length, mats, shrouds, beads,
    trade units, celestial timekeeping, named two-hour periods, a four-day ritual
    week, and a thirteen-month year divided into seasonal sections. It includes details
    on funerary mat contributions, the shrouding of the King before burial, days for
    burials and fetish consultation, restrictions at the Nkumbi tree, women’s market
    activity, and dry/rainy seasonal divisions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage defines a hierarchy of length and mat measures: Zimbongo, Makaba,
    Ntama, Mbondo, and Nlele Bifunizi.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Nlele Bifunizi is described as a bundle expected from a man for the funeral
    expenses of his wife's near relations; mats are also sewn into shrouds, with one
    complete shroud composed of 24 pieces or Zimbongo Zifula.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The King is wrapped first in one shroud, later in three shrouds after the
    body has dried, and finally in six shrouds just before burial.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Beads are arranged into named units including Lombi, Milombi, Xiko, Biko,
    Nsuku or Kama, Misuku, and Xiveve; the Nlele Bifunizi is valued at 7,200 beads.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The passage reports changes in imported cotton lengths and notes that Bavili
    refused German strings of 100 beads in exchange for ivory.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sun and moon are identified as the Bavili's great time markers, and the
    heavens are described as their clock.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Night and day are divided into twelve two-hour periods called Xelo or Bilo,
    each with a named interval.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Night is called Builu, the deep of the heavens, and day is called Lumbu, of
    the custom of the deep.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: 'The week has four days: Nduka, Ntona, Cilo, and Sona, each associated with
    specific customary or ritual activities.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Ntona is associated with women not planting, burials, and the dance Masuku;
    Cilo is associated with consultation of the family fetishes MPUMBU, Ngofo, and
    Ximpuka about death palavers and with taking manioc out of water.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: On Sona, no one may pass the Nkumbi tree except women going for water; it
    is called man's day of rest and women's market day, and only women sell in the
    market.
  category: action
  evidence_refs:
  - ev:8
