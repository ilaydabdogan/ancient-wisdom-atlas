canonical_text:
  quote: ''
  summary: 'The passage describes Bavili rules and customs concerning royal and ordinary
    marriage: a princess may choose a husband and exercise power over him; Maluango
    changes marital obligations after crowning; polygynous households have ranked
    wives and limited avenues for dispute resolution; courtship, engagement, marriage
    pledges, restrictions on intermarriage, eligibility, and a puberty/marriage purification
    rite in a paint house and at water are outlined.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A royal woman described as a princess has the right to choose a husband; the
    selected man must put away other wives and become subordinate to her power.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the princess dies, the chosen husband inherits all her property.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Maluango may have many wives while simply Nganga Nvumbu, but after being crowned
    Maluango he is supplied with one wife, a princess of Ngoio, and must put away
    the others.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:11
- id: obs:4
  text: The people are described as generally polygynists, with named distinctions
    between the first wife, other wives, a concubine, and an unchaste woman.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Polyandry is said not to have a legal character in this setting.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Women who object strongly to sharing a husband are labeled bad women or women
    of spirit, while a first wife who asks for other women to help her work is called
    a good woman or creature.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Quarrels among co-wives are described as common, but the husband and outside
    judge are said not to intervene, leaving the injured woman without appeal in those
    matters.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: If a man promises marriage and has touched the girl, she can make him pay
    heavily for breach of promise; if not, she can only shame him verbally.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When a desired woman is past puberty and able to judge for herself, the man
    first addresses her; if she is a child, he first goes to her father and mother.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After parental acceptance, the young man approaches his own parents, and his
    mother, who keeps his savings, gives him goods for his future in-laws.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Marriage goods are described as giving the man a hold on the bride's parents
    and as covering their responsibility, while return of the exact amount permits
    the father to remove his daughter if the husband ill-treats her.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Two named marriage bundles, Bukali and Mpakete, are listed with monetary amounts
    and goods such as rum and clothing.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Certain families, including Xibanga and Maluango, may not intermarry; intertribal
    marriages were formerly prohibited but later occur with prejudice toward their
    offspring.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: A woman unable to plant is not allowed by her parents to marry, and a known
    fool or sickness is a bar to acceptance.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: The marriage goods are explicitly described as a pledge rather than barter
    or purchase money.
  category: object
  evidence_refs:
  - ev:9
- id: obs:16
  text: After the bundle is given and the girl reaches the proper time or puberty,
    the bridegroom sends money for her placement in the paint house, where she undergoes
    purification rites.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: The father's women folk take the girl to the water and beat the red paint
    off her with pliant switches or twigs.
  category: action
  evidence_refs:
  - ev:10
