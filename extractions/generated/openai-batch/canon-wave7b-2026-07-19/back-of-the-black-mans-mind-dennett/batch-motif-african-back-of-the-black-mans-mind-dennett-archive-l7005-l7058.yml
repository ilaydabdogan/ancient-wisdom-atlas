  quote: ''
  summary: 'The passage lists tree-related images, restrictions, and uses: a Kongo
    pipe image of a palm tree with the serpent Nlimba and a well; Lembe and Ngofo
    bracelets and palm-fruit permissions or prohibitions; palm-frond construction
    for a ritual wives'' enclosure; gendered restrictions on certain palm nuts; the
    Nsanda wild fig as a sacred or market tree; the Nkondo baobab as food, medicine,
    mortuary container, and regrowing tree; and the Nfuma tree as an origin sign.'
  language: English
  quote_policy: summarized
