canonical_text:
  quote: ''
  summary: The passage reports two cases of girls said to have died, been buried,
    later been found or sold elsewhere, and returned as living Ximbindi. It distinguishes
    Ximbindi from ndunzi, defines Bakulu/Nkulu as guiding voices or souls of the dead,
    describes their dwelling in relatives' heads or hovering near kin houses, and
    records a funeral practice in which grave earth is saved for later ritual placement
    of a dead woman's Nkulu in a living relation. It closes with a classification
    of kinds of Kulu, including ancestral souls connected with offspring, infant illness,
    consultation, and witchcraft.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girl previously mentioned as living in Malela was said to have died, been
    buried, been sold in Boma as a slave, and later returned to her family.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The parents of the Malela girl were said to suppose that she was under the
    influence of Nyungala.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A girl from Lumbembika in the upper Lukula river region was said to have died
    and been buried, and her mother later encountered her after a long journey into
    the bush.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Lumbembika girl said she had been sold to the chief of the town where
    her mother found her, and she was later brought back to her own town.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After returning, the Lumbembika girl lived as a Ximbindi, was forbidden to
    approach her burial place, and was noted for lacking her own will and having eyes
    like a person who had been drinking.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Xilunzi or ndunzi is described as intelligence that dies with a person, while
    a Ximbindi is described as having no ndunzi and as being a tool in the hands of
    the ndoxi.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nkulu is glossed as the voice or soul of the dead, and Bakulu are described
    as guiding voices of the dead rather than witches, shadows, ghosts, breath, or
    intelligence.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Bakulu are said to prefer dwelling in the heads of near relations; if they
    lack such a habitation, they hover around the verandahs of relatives' houses.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Bakulu are said to be unseen, to mourn with troubled relations, to want to
    help them, and, if all Bavili were destroyed, to hover forever in the grass around
    their towns.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: At a woman's funeral, her brother picked up sacred earth from her grave while
    his wife held out the end of his red cloth waistband; the earth was placed in
    the cloth, folded over, and tied into a knot.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The collected grave earth was expected later to be placed by a nganga into
    a little horn called Likawla or a little tin box called Nkobi, so that the dead
    sister's Nkulu could be placed in the head of a living relation and heard again
    as a guiding voice.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage classifies six kinds of Kulu among the Bavili, divided into three
    belonging to the Muntu Nzambi class and three to the Munto a Ndongo class, corresponding
    to higher moral and lower physical natures.
  category: other
  evidence_refs:
  - ev:6
- id: obs:13
  text: Nkulu bakakata is described as an ancestral soul that causes women to bear
    offspring and is connected with sacred groves; Nkulu npunu causes babies to fall
    sick; Nkulu yianzi is the soul of one recently dead, placed in a living relation's
    head for consultation.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Muntu Nzambi is said not to reckon the nkulu ndoxi, the nkulu of a person
    dealing in witchcraft, as nkulu.
  category: relationship
  evidence_refs:
  - ev:6
