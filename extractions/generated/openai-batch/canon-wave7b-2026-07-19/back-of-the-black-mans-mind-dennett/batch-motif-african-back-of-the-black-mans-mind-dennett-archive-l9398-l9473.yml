  summary: The passage describes Bini offices around the Oba, including chiefs outside
    and inside the Oba's compound, rules of succession and appointment, powers of
    representation and regency, rights of human and animal sacrifice, graded sacrificial
    obligations, and the Iwebo office's ritual and arbitration functions.
  language: English
