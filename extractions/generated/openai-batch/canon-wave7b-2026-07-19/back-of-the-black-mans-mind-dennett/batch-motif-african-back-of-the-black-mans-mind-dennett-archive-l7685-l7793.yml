canonical_text:
  quote: ''
  summary: The passage describes Bavili names and beliefs concerning the leopard as
    a sacred animal, its genealogy, its association with witchcraft, a village warning
    about a leopard and illness, the alleged power of people with Ndongo over leopards
    and crocodiles, the use of medicine to see and own such an animal agent, and a
    distinction between harmful leopards and leopards belonging to owners of sacred
    ground.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bavili call the leopard Xikumbua, glossed as “the calumniator,” while
    the Bateke call it Kene, glossed as “the one opposed to nobility.”
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The leopard is described as being looked upon as the mother of all animals.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The leopard is said to descend from Zambi through Xikamaci and Xikamaci’s
    offspring Xikanga and Nxiluka, who are said to be parents of an animal and a wooden
    figure.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the leopard is connected with witchcraft and reports
    a warning that someone with Ndongo in his stomach had willed a leopard to come,
    or that someone might use the leopard to destroy a neighbor’s life.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Mambuku’s midnight speech, villagers are told to beware when the leopard
    comes and not to receive him, because they will divine who he may be.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Bavili are said to believe that certain Bantu A Ndongo have power over
    leopards and crocodiles, and that others may ask such a person for the loan of
    the wer-beast.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Muntu A Ndongo is explicitly said not to change himself into the leopard
    or crocodile and not to need to die so that a soul may enter the animal; the animal
    may act elsewhere while he speaks in another place.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A man with Ndongo in his stomach seeks an Nganga who has the medicine Xikumbu
    Ximanpandu, buys it, receives some, has some rubbed into his eyes, and then can
    see the leopard or crocodile.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the medicine procedure, the Muntu A Ndongo goes away conscious that
    he owns a leopard or crocodile to do his will.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says that not all leopards lend themselves to these practices;
    those that do not are said to belong to the Bakici Baci, the people who are owners
    of sacred ground.
  category: relationship
  evidence_refs:
  - ev:7
