- id: obs:3
  text: Nkulu mbuila and Nkulu xilunga are said to have medicines attached to them,
    given to women whose courses have been greatly delayed.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Powdered bark of the Nkasa tree is given to suspected witches and wizards
    as a test of innocence or guilt; vomiting the noxious medicine indicates innocence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the accused retains the poison, it either poisons the accused or acts as
