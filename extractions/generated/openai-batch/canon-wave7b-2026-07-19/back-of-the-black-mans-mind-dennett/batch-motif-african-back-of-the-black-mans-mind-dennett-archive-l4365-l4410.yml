literal_observations:
- id: obs:1
  text: The passage says only a witch seeks to have the nkulu of a dead witch placed
    in his head, while the Bavili prefer to say that the nkulu of a witch ceases at
    death.
  category: speech
  evidence_refs:
  - ev:1
