canonical_text:
  quote: ''
  summary: The passage describes Bavili understandings of fetish figures and their
    Kulu, rejects making images of Nzambi, and gives ritual procedures for consecrating
    Mpumbu/Bankondi figures and using Mpumbu and Ximbuka in healing or hostile petitions.
    It includes a spirit-possession naming rite for a spokesman, use of herbal medicines,
    palm fronds, a planted tree, pig blood, a basket of household remedies, a rattling
    gourd, and earth-touching petition gestures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sold fetish is described as having had its Kulu withdrawn; a fetish taken
    by force is described as having its Kulu return to the Nganga or owner.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: For revenge after damage to a figure, the figure is renewed and a nail is
    driven into it with the express purpose of injuring an enemy; the Kulu then sets
    about its duty.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When asked whether the Bavili make images of Nzambi, a native speaker rejects
    the idea with the reply, “Who would be such a fool?”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Zinkondi or Bankondi are described as fetishes brought by the winds, and
    the only images of this class are said to be Mpumbu: wooden figures of a man and
    a woman about eighteen inches high.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: After carving, Mpumbu figures must be enrolled among the Zinkici, set apart
    from common figures, and dedicated to sacred use as Nkici.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Nganga builds a small shed, encloses it with palm-tree fronds, and gathers
    tree leaves and herbs in the bush to make medicines.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Nganga selects a man from the family for whom the Bankondi is made to
    act as the spokesman of the figure, and pours an herbal decoction or infusion
    into his nostrils and eyes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The treated man lies on an empty box in the palm-frond shed until the spirit
    enters his head; he shakes violently, tries to run away, is forced back into the
    hut until the attack passes, and is given the name Nguli Bwanga.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The wooden figures are charged with medicines and given as Mpumbu into the
    custody of their spokesman; after receiving them, the custodian buries medicines
    in the ground and plants a Mfiota-tree.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In sickness rites connected with Mpumbu, the plant Msakasaka is important;
    a pig is killed and its blood is poured over the wooden Mpumbu figures.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Mpumbu are said to have been brought by the East Wind, Mabili.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Ximbuka is a Zinkici not in human form; it has the form of a round native
    basket made of Mfubu leaves and is used as the deposit of household remedies.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: A guardian shakes a small seed-filled gourd at Ximbuka while requesting it
    to cure a family member or slay an enemy; Ximbuka has two guardians and voices,
    a woman called Nguli Bwanga and a man called Ngulu Bwite, who are not a married
    couple.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: A note says the Mpumbu guardian does not drive nails into Mpumbu, but throws
    palm-kernels and dust at them, asks them to kill a hidden enemy, and makes the
    Mpumbu head touch the earth as a sign that the petition is heard.
  category: action
  evidence_refs:
  - ev:11
