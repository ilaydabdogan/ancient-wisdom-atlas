canonical_text:
  quote: ''
  summary: 'The passage describes classes of XiNA/BiNA among Luango-related groups:
    sacred animals, forbidden foods, territorial and family identifiers, grove animals,
    omens, and kinship markers. It includes origin accounts involving punishment,
    refusal of water, Maluango''s migration from Kongo, sacred route mounds, and animal
    identifiers that affect marriage rules.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed female figure rewards a young man who was tapping a palm tree and
    punishes women by turning their field into Lake Bawci; the lake's fish is XiNA
    to the women of Ntumpu.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mpakasa Awci, identified as the wild ox or buffalo, is named as the XiNA of
    Luango.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Maluango is said to have come from Kongo bringing this XiNI, described as
    Nkici; after men refused him water, he made the flesh of Mpakasa XiNA to their
    family, Bakulu.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The text describes four great XiNA as sacred animals of the tribe and sub-tribes
    and as forbidden foods for certain families.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A province under its Fumu has two XiNA; the province of Xibanga is given with
    the fowl and duiker as examples, called BiNA Fumuci.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:6
  text: A district under its Kongo Zovo has its XiNA, called XiNA Xici, which is also
    described as the sacred animal of the district's sacred grove.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:7
  text: The route of Maluango and Makongo is marked by places where they rested becoming
    sacred ground.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:8
  text: Mounds of earth and leaves, called Lombi, mark frontiers between provinces;
    passers add earth and leaves to them so they are not accused of bringing evil
    into the next prince's country.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A person under a Kongo Zovo with claims to birth should have four BiNA, including
    the XiNA of the father's family and the XiNA of the mother's family.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Named examples list parental and ancestral XiNA animals such as pig, partridge,
    chimpanzee, antelope, otter, goat, and buffalo.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The text explains that shared or related XiNA affiliations can make families
    unable to intermarry.
  category: relationship
  evidence_refs:
  - ev:11
