canonical_text:
  quote: ''
  summary: The passage describes Bavili/Kongo Zovo rules and rites concerning debts,
    mourning, wills, inheritance, witnesses, widow testing, contracts, treaty-making,
    market creation, contract cancellation, sales, blessing of sales by breath, and
    grass-cloth money.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A creditor who later claims money must bring witnesses and substantiate the
    debt; the wife is said generally to know her husband's debts.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife mourns her husband for about 18 to 24 months after death, and burial
    often takes place about that time.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Family members generally help pay the expenses of ceremonies connected with
    the death of the Kongo Zovo, then stay with the inheritor or disperse to their
    mothers' families; they inherit nothing except by will.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man may give away property during life or make a verbal will in the presence
    of his wife and witnesses, including calling slaves or children in connection
    with transfers of slaves or goods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A gift made to take effect after death is revocable until the giver dies,
    while a simple gift between living persons is irrevocable.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: No special forms are required for making a will; the passage says the will
    is held in the wife, and the wife and witnesses act as executors.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The family may require the widow to pass before fetishes and swear that she
    is keeping nothing back, and may force her to take casca as an honesty test.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Contracts are enumerated among kings, princes, the Kongo Zovo, and individuals.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Treaties or contracts between kings are brought about by a third party or
    mutual friend who acts as intermediary and witness.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In a contract between a superior and an inferior, the inferior gives a present
    to the superior and claps his hands in the presence of witnesses.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: When a market is created, a gun is buried and an agreement is made, before
    witnesses, that no arms may be brought there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Contracts between individuals are not legal unless made in the presence of
    witnesses, and such compacts are called Nkaka or Nkankano.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: To cancel a contract, the parties buy equal quantities of palm wine, place
    it in one bottle or vessel, drink before witnesses, and agree to cancellation;
    if one party refuses, chiefs or princes hear the matter.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Goods are freely bought and sold except men, whose sale is described as a
    family affair.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: A sale becomes definite after it is done before witnesses and the seller blesses
    it by lifting and throwing out his hands toward the buyer and breathing or blowing
    over the sold item; the act is called Ku vana mula, to give the breath.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Mbongo Masandi, a measured piece of grass cloth, is described as former money,
    with units counted in bundles called Vili and larger named groupings.
  category: object
  evidence_refs:
  - ev:8
