canonical_text:
  quote: ''
  summary: 'The passage describes parts of a Bacilongo coronation: a man named Marfini
    kneels with his children before Nenimi, prays to Nzambi, and receives a forehead
    sign and blessing; a long procession brings food, a girl recently out of a paint
    house, and assorted carried goods; Nenimi and Maria sit beneath a tree and distribute
    food to chiefs and princes; interruptions and complaints arise over water and
    food; the author concludes that this coronation may indicate Lower Kongo practice
    while noting that the Bavili ceremony was not witnessed.'
  language: English
  quote_policy: summarized
