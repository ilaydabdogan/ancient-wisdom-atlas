  quote: ''
  summary: After conquering the hosts of Mara, the great master of meditation meditates
    to know the supreme end. In the first watch he remembers thousands of former births
    and deaths, feels compassion for living beings caught in transmigration, sees
    the world as rolling helplessly like a wheel, realizes existence as unsubstantial
    like plantain fruit, and in the second watch receives pre-eminent divine sight.
