canonical_text:
  quote: "“The prince has returned”;—but having heard that his horse had an empty
    back, they closed the windows again and wailed aloud."
  summary: The passage depicts the palace and city after the prince’s absence is confirmed
    by the return of his riderless horse. Women first hope the prince has returned,
    then wail when they learn the horse is empty-backed. The king prays in distress
    for his son’s recovery. The attendant and horse enter the palace grief-stricken;
    the horse’s sound creates a renewed false hope, but the women and Queen Gautami
    collapse into mourning when they see only the attendant and horse.
  language: English
  quote_policy: quoted
