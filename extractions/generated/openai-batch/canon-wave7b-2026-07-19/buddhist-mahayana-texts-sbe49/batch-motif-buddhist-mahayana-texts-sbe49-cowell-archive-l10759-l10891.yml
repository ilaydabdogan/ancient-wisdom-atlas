canonical_text:
  quote: ''
  summary: 'A vow-making speaker addresses the Bhagavat and states a sequence of conditional
    vows about a future Buddha country after his attainment of Bodhi: inhabitants
    and Bodhisattvas will be near highest knowledge, able to worship innumerable Buddhas,
    receive thought-produced offerings, possess knowledge and extraordinary qualities,
    perceive an immense Bodhi-tree, inhabit a radiant and ornamented land, experience
    jewel-flowers and music-clouds, and gain deliverance through hearing the speaker''s
    name.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker repeatedly frames each promised quality with the condition that,
    if it is not fulfilled after he obtains Bodhi, he should not obtain the highest
    perfect knowledge.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
- id: obs:2
  text: Beings born in the speaker's Buddha country are said to be bound to one birth
    only before reaching the highest perfect knowledge, with an exception for certain
    noble-minded Bodhisattvas devoted to aiding beings and serving Buddhas.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bodhisattvas born in the Buddha country are described as able, after one morning
    meal, to go to other Buddha countries and worship many Buddhas through the grace
    of the Buddha.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Desired forms of merit or offerings, including jewels, perfumes, flowers,
    garments, banners, lamps, music, and dance, are to appear as soon as thought of.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Beings born in the Buddha country are to recite the story of the Law accompanied
    by omniscience.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bodhisattvas may remain in this world while honoring Buddhas in immeasurable
    Buddha countries with thought-produced offerings that the Buddhas accept from
    compassion.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Bodhisattvas born in the Buddha country are to possess bodily strength compared
    to the diamond or thunderbolt of Narayana.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: No being, even one possessing the divine eye, is to learn the limit of the
    beauty and magnificence of the Buddha country's ornamentation.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: A Bodhisattva with even a very small stock of merit is to perceive a noble
    and beautiful Bodhi-tree at least a hundred yojanas in height.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Teaching or learning is said not to need to be made by any being because all
    are to possess perfect knowledge.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Buddha country is to be so brilliant that immeasurable Buddha countries
    can be seen in it on all sides, compared to a face seen in a polished round mirror.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Buddha country is to contain jeweled vases filled with sweet perfumes,
    always smoking with incense, and rising into the sky beyond gods, men, and all
    things.
  category: object
  evidence_refs:
  - ev:11
- id: obs:13
  text: Showers of sweet jewel-flowers are always to pour down, and sweet-sounding
