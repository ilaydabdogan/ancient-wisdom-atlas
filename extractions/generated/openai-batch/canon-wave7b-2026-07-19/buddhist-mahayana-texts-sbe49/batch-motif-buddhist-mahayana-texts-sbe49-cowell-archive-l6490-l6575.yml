  summary: Mara continues attacking a saint or seer, but an invisible glorious being
    in the heavens rebukes him. The speaker says the sage is immovable, will not rise
    from his seat until attaining highest wisdom, and labors compassionately for beings
    as physician, guide, lamp, and rescuer across the flood of existence. The speech
    also describes a tree of knowledge, deliverance from illusion, the sage's appointed
    seat like those of previous saints, and the place as the navel of the earth.
