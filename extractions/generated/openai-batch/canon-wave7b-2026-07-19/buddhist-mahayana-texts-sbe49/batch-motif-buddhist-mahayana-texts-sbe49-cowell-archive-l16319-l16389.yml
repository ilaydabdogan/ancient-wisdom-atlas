canonical_text:
  quote: ''
  summary: In a dialogue between the Bhagavat and Subhuti, the passage denies that
    the Tathagata adopted or acquired highest perfect knowledge from Dipankara, connects
    Dipankara's prophecy of the future Sakyamuni with non-adoption, explains the name
    Tathagata through suchness and no-origin, and develops a series of paradoxical
    negations concerning knowledge, things, body, Bodhisattva, beings, and selfhood.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Subhuti states that, as he understands the Bhagavat's teaching, nothing was
    adopted by the Tathagata from the enlightened Tathagata Dipankara regarding highest
    perfect knowledge.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bhagavat agrees and says that if anything had been adopted, Dipankara
    would not have prophesied that the boy would become the fully enlightened Tathagata
    called Sakyamuni.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Bhagavat explains the name Tathagata as expressing true suchness, no origin,
    destruction of all qualities, and no origin whatever; he adds that no-origin is
    the highest goal.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Bhagavat says that claiming highest perfect knowledge has been known by
    the Tathagata would be untruth and slander, because there is no such thing known
    by the Tathagata with regard to highest perfect knowledge.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Bhagavat says that what is known and taught by the Tathagata has neither
    truth nor falsehood, and that all things are called Buddha-things because they
    were preached as no-things.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Subhuti says that the man described as having a body and a large body was
    spoken of as without a body, and therefore is called a man with a body and large
    body.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Bhagavat says that a Bodhisattva who says, “I shall deliver all beings,”
    should not be called a Bodhisattva; Subhuti answers that nothing is called a Bodhisattva.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Bhagavat says that beings were spoken of as no-beings, and therefore are
    called beings; he also says all beings are without self, life, manhood, and personality.
  category: speech
  evidence_refs:
  - ev:8
