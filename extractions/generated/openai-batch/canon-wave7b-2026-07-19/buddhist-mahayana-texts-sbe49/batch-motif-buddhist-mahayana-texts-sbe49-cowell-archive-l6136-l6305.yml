canonical_text:
  quote: ''
  summary: As the holy one sits firmly resolved to obtain highest knowledge, the world
    rejoices and Mara, identified with Kamadeva and as enemy of liberation, becomes
    afraid. Mara explains to his children that the sage intends to conquer his realm,
    approaches the Asvattha tree with his flower-bow and infatuating arrows, urges
    the sage to abandon liberation, and fires an arrow of desire. The sage remains
    unmoved. Mara then summons a many-formed demon host with animal faces, weapons,
    strange bodies, violent movements, and flames.
  language: English
  quote_policy: summarized
