canonical_text:
  quote: ''
  summary: The passage describes Sukhavati as a Buddha country where desired perfumes,
    garments, ornaments, palaces, music, and ceremonial objects appear; inhabitants
    are exalted beyond ordinary distinctions between gods and men; perfumed winds
    repeatedly scatter soft flowers from gem trees; ordinary markers such as fire,
    sun, moon, darkness, and day/night are absent from ordinary mention; clouds rain
    heavenly perfumed water, flowers, jewels, and banners; and beings born there remain
    constant in absolute truth until Nirvana.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When inhabitants wish for heavenly perfumes, the whole Buddha country is scented,
    and desired scents reach the person who wishes to perceive them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When inhabitants desire musical instruments, banners, flags, umbrellas, cloaks,
    powders, ointments, garlands, and scents, the Buddha country shines with those
    things, and people feel themselves covered with desired cloaks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Desired ornaments appear so that the Buddha country shines with jeweled ornaments
    fastened to ornament-trees, and the inhabitants perceive themselves adorned with
    them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A desired jeweled palace of specified size and decoration appears before the
    inhabitants, who dwell, play, sport, and walk there while honored and surrounded
    by Apsarases.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Sukhavati there is said to be no difference between gods and men, except
    in ordinary and imperfect speech.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage compares Sakra before the Paranirmitavasavartin gods to a low
    and impotent man before a mighty king, and says humans in Sukhavati should be
    considered like the Paranirmitavasavartin gods.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: At forenoon, winds blow through the four quarters and shake perfumed, many-colored
    gem-tree stalks, causing many fragrant flowers to fall on the jeweled earth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The fallen flowers cover the Buddha country seven fathoms deep, are soft to
    touch, sink under a footstep and rise again, then vanish after forenoon; the process
    repeats at noon, twilight, and the watches of the night.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Beings touched by the perfumed winds are described as full of happiness like
    a Bhikshu who has obtained Nirvana.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The names of fire, sun, moon, planets, constellations, stars, blinding darkness,
    and day and night are not ordinarily mentioned in that Buddha country, except
    day and night in the conversation of the Tathagata.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: At the proper time, clouds full of heavenly perfumed water pour down heavenly
    flowers, seven jewels, sandalwood powder, umbrellas, flags, and banners; heavenly
    instruments are played and Apsarases dance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: All beings born, being born, or to be born in Sukhavati are said to remain
    constant in absolute truth until they reach Nirvana.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage says the causes of happiness in Sukhavati could not be fully praised
    even within a kalpa.
  category: speech
  evidence_refs:
  - ev:8
