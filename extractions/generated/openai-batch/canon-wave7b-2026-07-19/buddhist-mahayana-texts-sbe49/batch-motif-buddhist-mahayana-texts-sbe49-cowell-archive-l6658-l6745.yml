  quote: ''
  summary: A seer with divine pure sight beholds the whole world and observes beings
    passing through transmigration and rebirth according to evil or good actions.
    He describes torments in hell, miserable births among beasts, exploitation and
    suffering of animals, and mutual hostility among creatures of air, water, and
    land.
