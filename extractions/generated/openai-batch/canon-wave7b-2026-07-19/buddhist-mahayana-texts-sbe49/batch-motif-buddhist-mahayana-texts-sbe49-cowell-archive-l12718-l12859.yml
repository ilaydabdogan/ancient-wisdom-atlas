    not turning back after conceiving the thought of going across.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says that great effort should be made to hear, learn, remember,
    study, grasp, and widely make known the treatise.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
