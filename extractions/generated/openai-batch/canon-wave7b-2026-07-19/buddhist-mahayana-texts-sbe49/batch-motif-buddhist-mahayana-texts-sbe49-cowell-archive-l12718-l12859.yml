canonical_text:
  quote: ''
  summary: The passage exhorts Agita to proclaim, preserve, copy, study, and teach
    the Law treatise connected with Amitabha. It praises hearing Amitabha's name and
    the treatise, warns against doubt and turning back, presents verses on the rarity
    and immeasurability of Buddha knowledge, and describes vast numbers of beings
    attaining spiritual rewards and directing merit toward birth in Sukhavati and
    future Buddhahood.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says that beings who hear the name of the Tathagata Amitabha and
    obtain even one joyful thought of Amitabha and the Law treatise gain easy benefits.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Agita is invited and commanded to proclaim the Law treatise before the world
    and the gods.
  category: speech
  evidence_refs:
