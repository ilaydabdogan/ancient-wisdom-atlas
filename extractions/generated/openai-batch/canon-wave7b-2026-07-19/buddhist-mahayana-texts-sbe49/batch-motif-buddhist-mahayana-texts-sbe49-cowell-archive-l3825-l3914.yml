canonical_text:
  quote: ''
  summary: In the royal palace, women mourn with tears and gestures of grief. Yashodhara,
    weeping and angry, addresses Aamdaka, asking where the absent beloved has gone
    after leaving her asleep at night. She says Aamdaka and the horse Kamthaka returned
    alone although three had gone out together, blames Aamdaka as an unwise friend,
    describes the palace women as bereft, and accuses Kamthaka of carrying away her
    treasure, prosperity, and heart while everyone slept.
  language: English
  quote_policy: summarized
