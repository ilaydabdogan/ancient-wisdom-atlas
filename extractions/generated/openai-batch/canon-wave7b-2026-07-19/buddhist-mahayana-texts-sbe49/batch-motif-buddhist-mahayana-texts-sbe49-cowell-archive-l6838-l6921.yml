canonical_text:
  quote: ''
  summary: The Bodhisattva meditatively analyzes the arising of suffering through
    a sequence beginning with ignorance and latent impressions, proceeding through
    consciousness, organism, senses, sensation, desire, attachment, continued existence,
    birth, old age, disease, and death. He then analyzes the reverse sequence of cessation,
    concluding that stopping ignorance stops the pains of beings.
  language: English
