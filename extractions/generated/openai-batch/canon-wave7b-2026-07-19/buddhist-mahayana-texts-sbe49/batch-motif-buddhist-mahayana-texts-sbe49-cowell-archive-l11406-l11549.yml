canonical_text:
  quote: ''
  summary: The passage describes the Sukhavati Buddha country as filled with trees
    and lotus flowers made of jewels. The gem lotuses emit rays from which many golden-bodied
    Buddhas proceed to teach the Law throughout immeasurable worlds. The country is
    described as level and without mountains, including Sumeru; Ananda asks where
    Sumeru-associated gods reside, and Bhagavat answers by pointing to the inconceivability
    of karmic results and the powers of meritorious beings.
  language: English
  quote_policy: summarized
