canonical_text:
  quote: ''
  summary: Subhiti says that, according to the Bhagavat's teaching, the Tathagata
    is not to be known by possession of signs. The Bhagavat confirms this, explaining
    that otherwise a wheel-turning king would also be a Tathagata. He then teaches
    verses saying that those who seek him by form or sound engage in false efforts
    and will not see him.
