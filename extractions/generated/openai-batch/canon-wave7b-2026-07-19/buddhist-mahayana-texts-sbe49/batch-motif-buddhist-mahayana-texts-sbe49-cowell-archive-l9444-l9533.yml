canonical_text:
  quote: ''
  summary: The passage presents a Mahayana Buddhist metaphysical account in which
    things are treated as names or mental concepts rather than independent realities.
    It says distinctions such as pure and impure, ego and non-ego, and knowable and
    unknowable are made by the mind and by fallacious reasoning. Conditioned phenomena
    are said to appear and cease with conditions and are likened to foam on water,
    lightning, and vanishing clouds. Fallacious thinking is compared to an ignorant
    monkey trying to catch the moon’s reflection in water.
  language: English
  quote_policy: summarized
