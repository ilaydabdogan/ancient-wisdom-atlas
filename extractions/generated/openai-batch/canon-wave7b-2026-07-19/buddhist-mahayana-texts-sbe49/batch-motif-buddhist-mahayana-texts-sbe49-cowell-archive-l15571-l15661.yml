canonical_text:
  quote: ''
  summary: In a dialogue between Bhagavat and Subhuti, Bhagavat teaches that a Bodhisattva's
    gift should be given without belief in anything, even the idea of cause. Subhuti
    and Bhagavat discuss whether a Tathagata can be known by signs; Bhagavat states
    that possession of signs is falsehood and that the Tathagata is to be known through
    no-signs. Subhuti asks whether beings in the future last 500 years, during the
    decay of the good Law, will understand the sutra words truly; Bhagavat affirms
    that some future noble Bodhisattvas and wise beings will frame a true idea. Translator
    notes relate the last 500 years to a five-period Mahayana scheme after Buddha's
    Nirvana.
  language: English
  quote_policy: summarized
literal_observations:
