  text: Bhagavat says that the measure of merit of a Bodhisattva who gives a gift
    without believing in anything is not easy to learn, and that one on the Bodhisattva
    path should give without believing even in the idea of cause.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Subhuti says that a Tathagata is not to be seen or known by the possession
    of signs, because what the Tathagata preached as possession of signs is possession
    of no-signs.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bhagavat says that wherever there is possession of signs there is falsehood,
    and wherever there is no possession of signs there is no falsehood.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Subhuti asks whether future beings in the last time, the last moment, and
    the last 500 years during the decay of the good Law will frame a true idea when
    these sutra words are preached.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bhagavat answers that there will be beings in that future period who will
