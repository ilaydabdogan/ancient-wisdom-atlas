canonical_text:
  quote: ''
  summary: The passage lists the central holy teacher receiving or ordaining many
    figures and groups as mendicants, disciples, or members of the order. Named Brahmans,
    ascetics, women, householders, and large groups come to him, are admitted, or
    receive religious equipment. Kasyapa leaves kin to seek wisdom through asceticism
    at the Bodhi tree and becomes foremost among Arhats. Naradatta comes from Mount
    Himavat with disciples. Other acts include giving alms-vessels, enriching the
    poor, restoring maimed persons, proclaiming the Law, dwelling in Getaka forest,
    and proceeding onward.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed monarch is described as a devoted follower of the Buddha and is
    made a Bodhisattva and a Sakrdagamin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Upatishya, the seventh son of the Brahman Dharmapalin and the Brahman woman
    Salya, had studied the entire Veda and became a Buddhist mendicant.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Maudgalya and other Brahman-associated figures are received by the great saint
    as leading Bhikshus or pre-eminent disciples.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dirghanakha, named as the keen-witted maternal uncle of Saliputra, is ordained
    as a mendicant.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The glorious one travels in Magadha, is honoured by inhabitants with alms
    and devotion, delivers them from evil, dwells in a convent given by the seer Geta,
    and ordains Ananda with companions.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kasyapa, a wealthy Brahman and master of Vedic sciences from Ragageha, leaves
    his kindred, seeks wisdom in asceticism, comes to the Bodhi tree, practises six
    years of difficult penance, worships the chief of saints who attained perfect
    knowledge, and becomes foremost of the Arhats.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Naradatta, dwelling on Mount Himavat, remembers his maternal uncle's wholesome
    words and comes to the Sugata with disciples, who are admitted into the order
    of the Gina.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sakti and Kamala come to the Sugata, fall at his feet, stand before him, are
    received, and are made happy with a staff and begging-bowl.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Seven hundred disciples of the ascetic Rudraka become mendicants according
    to the doctrine of the Gina, surround him, pay homage, and carry staves.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Raivata finishes his discipline, becomes a mendicant devoted to the guru,
    counts gold and clay as the same, is versed in sacred spells and meditation, and
    can counteract three kinds of poisons and other fatal harms.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The glorious one receives householders of Sravasti, including Parva and others,
    gives them alms-vessels, makes poor people rich as Kuvera, makes maimed persons
    whole, makes paupers and orphans affluent, proclaims the Law, dwells two years
    in Getaka forest, teaches Geta again, establishes the Bhikshu Parna, and proceeds
    on his way.
  category: sequence
  evidence_refs:
  - ev:7
