canonical_text:
  quote: ''
  summary: In a discourse to Ananda, the Bhagavat says that a Tathagata could live
    for vast kalpas on one alms-gift through meditative perfections, and that the
    appearance of fully enlightened Buddhas is rare like Audumbara flowers. He narrates
    an immense past succession of Tathagatas ending with Lokesvararaga. During Lokesvararaga's
    preaching, the bhikshu Dharmakara, endowed with memory, understanding, prudence,
    wisdom, vigour, and noble character, worships and praises him, then declares an
    aspiration to become a Buddha, master of the Law, and savior of all beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says that, if the Tathagata wished, he could live for one kalpa
    or for vast numbers of kalpas on one alms-gift without bodily decline or alteration
    of complexion.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated reason for this capacity is that the Tathagata has fully obtained
    Paramitas arising from Samadhi.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The appearance of fully enlightened Buddhas is described as very difficult
    to obtain in the world and is compared with the rare appearance of Audumbara flowers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker tells Ananda to listen and says he will speak; Ananda answers
    affirmatively to the Bhagavat.
  category: sequence
  evidence_refs:
