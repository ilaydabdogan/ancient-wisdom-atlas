canonical_text:
  quote: "“sitting there on his seat of grass at the root of the tree ... attained
    at last perfect knowledge.”"
  summary: The passage describes the Buddha realizing the nature, origin, cessation,
    and path to cessation of pain, attaining perfect knowledge at the root of a tree,
    receiving exalted titles, addressing bodhisattvas from an aerial throne, explaining
    merit and wisdom as the basis of his attainment, and being worshipped by divine
    beings as the world is illuminated and the earth shakes.
  language: English
  quote_policy: quoted
