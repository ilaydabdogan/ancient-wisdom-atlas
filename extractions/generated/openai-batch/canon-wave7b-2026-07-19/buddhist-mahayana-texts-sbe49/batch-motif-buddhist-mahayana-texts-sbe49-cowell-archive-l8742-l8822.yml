canonical_text:
  quote: ''
  summary: The passage describes the holy one as having created what is conspicuous
    in the universe and become universal. He goes to Satya heaven, proclaims the twelvefold
    Law from the sky, restores sight to Gautami, Anugopa, and other women, establishes
    others in Nirvana and the Law, and accepts Suddhodana's feast invitation. After
    a mighty miracle, cosmic signs occur and deities accompany a sky dance while resting
    on the serpent Sesha. The holy one delivers afflicted and destitute people, instructs
    people of the fourth caste, confirms Bhikshus, returns to his own city, journeys
    to Lumbini, remembers his birth at the holy fig-tree, emits rays of light from
    his mouth, teaches the goddess of the wood, honors his mother by a tank, and receives
    family members and citizens into the community.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A list of cosmic hosts, beings, and world-rulers is followed by the statement
    that the holy one created everything conspicuous in the universe and became the
    universal one.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the king had been instructed, the lord of saints went to Satya heaven
    and proclaimed the twelvefold Law from the sky while seated on his own throne.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Gautami, Anugopa, and many other women were restored to sight; assembled people
    were filled with joy; others were established in Nirvana and in the Law.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Suddhodana invited the holy one to a feast for the whole assembly, and the
    invitation was accepted by silence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After a mighty miracle, the earth shook, flowers fell, the quarters of space
    became illuminated, and a wind blew.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Heavenly beings and named gods stood with their feet resting on the serpent
    Sesha and led gods and gandharvas in a dance in the sky.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The holy one made many ascetics and religious practitioners, delivered blind,
    humpbacked, lame, insane, maimed, and destitute people from ills, instructed people
    of the fourth caste, confirmed Bhikshus, and went to his own city in the twelfth
    year.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: He journeyed to Lumbini with Bhikshus and citizens, with Brahman and Rudra
    at their head and with musical triumph.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Lumbini he saw the holy fig-tree, stood by it remembering his birth with
    a smile, and rays of light streamed from his mouth to illuminate the earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: He gave a discourse to the goddess of the wood and gave her serenity of faith.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Near the Lumbini fig-tree and in Nigrodha wood he spoke with named women,
    honored his mother by the tank Vasatya, and received family members headed by
    Sundarananda and one hundred and seven citizens into the community.
  category: action
  evidence_refs:
  - ev:6
