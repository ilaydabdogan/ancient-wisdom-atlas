  text: One who gladly offers a pulpit or seat to the teacher who proclaims the great
    or good Law is said to attain eight seats.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The listed seats or thrones include the seat of a householder, the throne
    of a universal monarch, thrones connected with guardian-spirits of the world,
    Sakra, Vasavartinak gods, Brahman, and the throne of a teacher of the good Law.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: One who utters applause to the pious proclaimer of the Law is said to become
    a truthful and pure speaker with welcome, delightful, sweet, and gentle speech.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The applauder's voice is compared to a Kalavinka bird, to Brahman's pure voice,
    and to a lion's sound.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: One who writes the method of the Law in a book, places it in the house, worships
    and honours it, praises it, and hands the doctrine onward is said to obtain eight
    treasures.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The eight treasures named are memory, insight, prudence, good spells, intelligence,
    highest wisdom, the Law, and knowledge.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: One who holds the method of the Law in mind and sets it going around him is
