canonical_text:
  quote: ''
  summary: 'The passage enumerates rewards for reverent acts toward the Law and its
    proclaimer: offering a seat to the teacher leads to eight seats or thrones; applauding
    the proclaimer leads to excellences of speech; writing, housing, worshipping,
    praising, and transmitting the book leads to eight treasures; holding and circulating
    the Law leads to supplies of virtue, knowledge, calmness, insight, merit, and
    compassion.'
  language: English
  quote_policy: summarized
