- id: obs:1
  text: Bhagavat asks whether a son or daughter of a good family who fills a sphere
    of a million millions of worlds with seven treasures and gives it to holy and
    enlightened Tathagatas would produce a large stock of merit.
  category: speech
  evidence_refs:
  - ev:1
