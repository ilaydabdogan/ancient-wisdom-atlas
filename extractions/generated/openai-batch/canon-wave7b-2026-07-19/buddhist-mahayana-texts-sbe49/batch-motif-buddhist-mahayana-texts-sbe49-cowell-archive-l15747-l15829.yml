  text: Subhuti answers yes, while adding that what the Tathagata preached as a stock
    of merit was preached as no-stock of merit.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bhagavat states that teaching and explaining one four-line Gatha from the
