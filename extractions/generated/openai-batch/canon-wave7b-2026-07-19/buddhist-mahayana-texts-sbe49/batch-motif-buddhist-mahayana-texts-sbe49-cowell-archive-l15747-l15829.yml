canonical_text:
  quote: one Gatha of four lines only should fully teach others and explain it
  summary: Bhagavat and Subhuti discuss whether a vast gift of seven treasures to
    enlightened Tathagatas produces merit, then state that teaching even one four-line
    verse from the treatise of the Law produces a larger, immeasurable merit because
    perfect knowledge and Buddhas are produced from it. The passage also uses negating
    formulas for merit and Buddha qualities. It then begins a discussion of Srota-Apanna
    and Sakrdagamin, emphasizing that the Srota-Apanna does not think that spiritual
    fruit has been obtained and does not hold to self or personhood.
  language: English
  quote_policy: quoted
