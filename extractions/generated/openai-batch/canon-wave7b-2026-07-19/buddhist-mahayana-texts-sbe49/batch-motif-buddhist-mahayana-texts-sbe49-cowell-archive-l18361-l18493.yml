canonical_text:
  quote: ''
  summary: Buddha teaches Ananda and Vaideht about beings qualified for high-grade
    birth in the Pure Land. He describes the threefold thought, three classes of practitioners,
    and deathbed appearances of Buddha Amitayus with Bodhisattvas, created Buddhas,
    monastics, gods, jewel palaces, seats, light rays, and welcomes. The passage then
    describes rebirth in Sukhavati or the Country of Highest Happiness, visionary
    perception of Buddhas and jewel environments, service to Buddhas in the ten directions,
    attainment of knowledge or resignation, and prophecies of future destiny.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Buddha speaks to Ananda and Vaideht at the beginning of the passage.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Beings in the highest form of the highest grade wish to be born in that country
    and cherish a threefold thought.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The threefold thought is listed as True Thought, Deep Believing Thought, and
    the Desire to be born in the Pure Land by maturing one's stock of merit.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'Three classes of beings are described as able to be born in that country:
    compassionate non-injuring practitioners of virtue, students and reciters of Mahayana
    sutras, and practitioners of sixfold remembrance.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says that accomplishing one of these meritorious deeds for one
    day or seven days makes beings destined to be born in that country.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: When such a practitioner is about to be born in that country, Amitayus appears
    with two Bodhisattvas, created Buddhas, Bhikshus and Sravakas, gods, retinue,
    and palaces of seven jewels.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Aval. and Mahas. offer a diamond seat, and Amitayus sends rays of light over
    the dying person's body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Amitayus and many Bodhisattvas offer their hands and welcome the dying person;
    the Bodhisattvas praise the person's meritorious deeds and exhort his mind.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The newcomer sees his own body seated on the diamond throne and follows behind
    Buddha, being born into that country in a moment.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: After birth there, the newcomer sees Buddha's perfected form, Bodhisattvas,
    rays, jewel-forests, and hears the excellent Law.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: The highest-grade newcomer serves Buddhas in the ten quarters, receives prophecies
    of future destiny, returns to Sukhavati, and obtains many Dharani formulas.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:12
  text: The middle form of the highest grade includes those who understand the truth,
    do not speak evil of the Mahayana doctrine, believe in cause and effect, and seek
    birth in the Country of Highest Happiness.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:13
  text: At the death of such a person, Amitayus with the two Bodhisattvas and an innumerable
    retinue brings a purple-gold seat and speaks words of praise and welcome.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:14
  text: The middle-form practitioner sees himself seated on a purple-gold seat, folds
    his hands, praises all Buddhas, and is born in the lake of seven jewels as quick
    as thought.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: The purple-gold seat is compared to a jewel-flower, opens after a night, and
    the newcomer becomes purple-gold in body with a seven-jewel lotus-flower under
    his feet.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: Buddha and the Bodhisattvas send rays over the newcomer's body; his eyes open
    and become clear, and he hears voices preaching deep truths.
  category: action
  evidence_refs:
  - ev:5
- id: obs:17
  text: The newcomer descends from the golden seat, worships Buddha with folded hands,
    and praises the World-Honoured One.
  category: action
  evidence_refs:
  - ev:6
- id: obs:18
  text: After seven days the newcomer attains the highest perfect knowledge and a
    state from which he will not fall away, then flies to the ten regions, serves
    Buddhas, practises Samadhi, gains resignation after a lesser kalpa, and receives
    a prophecy of future destiny.
  category: sequence
  evidence_refs:
  - ev:6
