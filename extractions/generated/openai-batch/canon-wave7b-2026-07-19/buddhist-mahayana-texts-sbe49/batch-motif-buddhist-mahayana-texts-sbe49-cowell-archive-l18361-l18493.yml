candidate_motifs:
- id: motif:1
  label: Merit- and faith-qualified rebirth in a blessed Pure Land
  taxonomy_refs:
  - afterlife_journey_map
  - death_rebirth
  basis: The passage states that beings with specified thoughts, virtues, scriptural
    practices, remembrance, and doctrinal understanding are destined to be born in
    the Pure Land or Country of Highest Happiness.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage describes Buddhist rebirth in a Pure Land; the taxonomy terms
    are approximate comparative labels rather than the passage's own categories.
- id: motif:2
  label: Deathbed arrival of a divine or Buddha-led welcoming escort
  taxonomy_refs:
  - afterlife_journey_map
  basis: Amitayus appears at the death or rebirth threshold with Bodhisattvas, created
    Buddhas, retinues, gods, jewel palaces, seats, light, praise, and welcoming gestures.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The escort is specifically Buddhist and Pure Land-oriented; no external
    judgment scene is present.
- id: motif:3
  label: Jewel seat or flower as vehicle and marker of rebirth
  taxonomy_refs:
  - death_rebirth
  basis: The practitioner is seated on a diamond or purple-gold seat; the latter is
    likened to a jewel-flower that opens after a night, with a lotus-flower under
    the feet after rebirth.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage presents these as visionary details of Pure Land birth; symbolic
    function is inferred from their placement in the rebirth sequence.
- id: motif:4
  label: Radiant transformation and opened perception
  taxonomy_refs:
  - wisdom
  basis: Amitayus, Buddha, and Bodhisattvas send rays over the practitioner's body;
    the newcomer sees perfected forms, has opened and clear eyes, hears truths, and
    progresses toward knowledge.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  confidence: medium
  cautions: The text does not explicitly identify the rays as a symbol of wisdom,
    so the wisdom taxonomy link remains interpretive.
- id: motif:5
  label: Post-rebirth service to Buddhas in the ten directions and prophecy of destiny
  taxonomy_refs:
  - mystical_quest
  - wisdom
  basis: After Pure Land birth, the practitioner serves Buddhas in the ten quarters
    or ten regions, practises Samadhi, and receives prophecies of future destiny.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: medium
  cautions: The passage describes post-rebirth religious activity rather than a quest
    narrative with conflict or return in a heroic sense.
- id: motif:6
  label: Rapid attainment of non-retrogressive perfect knowledge
  taxonomy_refs:
  - wisdom
  basis: The middle-form newcomer attains highest perfect knowledge after seven days
    and enters a state from which he will not fall away.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is a doctrinal attainment motif within Buddhist vocabulary; cross-cultural
    comparison should preserve that specificity.
