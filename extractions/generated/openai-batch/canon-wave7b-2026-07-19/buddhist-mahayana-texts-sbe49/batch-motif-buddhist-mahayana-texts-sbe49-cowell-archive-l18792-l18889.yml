canonical_text:
  quote: ''
  summary: The passage closes the Sutra of Meditation on Buddha Amitayus. Vaidehi
    and her attendants see the World of Highest Happiness, Buddha, and two Bodhisattvas;
    Vaidehi becomes enlightened, and others aspire to Bodhi and birth in that Buddha
    country. Buddha predicts their rebirth there, names the sutra, teaches the efficacy
    of remembering Amitayus and the Bodhisattvas, and returns through the open sky
    to Mount Gridhrakuta, where Ananda recounts the events to a larger assembly.
  language: English
  quote_policy: summarized
