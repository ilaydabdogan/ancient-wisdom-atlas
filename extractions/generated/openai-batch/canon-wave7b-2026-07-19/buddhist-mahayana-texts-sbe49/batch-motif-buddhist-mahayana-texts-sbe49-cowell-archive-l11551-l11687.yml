canonical_text:
  quote: ''
  summary: Ananda explains that he questions the Tathagata to remove future beings'
    doubts. Bhagavat then describes Sukhavati as a realm of fragrant, jewel-adorned
    rivers, jewel trees, responsive waters, bird-filled islands, and wish-fulfilling
    pleasures. The rivers produce selectable sounds that recite Buddhist doctrinal
    terms and lead hearers toward delight, merit, and knowledge. The realm lacks sounds
    of pain or misfortune. Beings born there possess divine-like qualities and enjoyments,
    including food perceived without gross eating.
  language: English
  quote_policy: summarized
