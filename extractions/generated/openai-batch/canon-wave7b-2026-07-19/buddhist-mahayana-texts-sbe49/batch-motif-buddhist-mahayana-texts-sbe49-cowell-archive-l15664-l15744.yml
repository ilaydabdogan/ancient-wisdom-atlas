canonical_text:
  quote: By those who know the teaching of the Law, as like unto a raft, all qualities
    indeed must be abandoned
  summary: The passage describes noble-minded Bodhisattvas who have served many Buddhas
    and accumulated merit. It teaches that they do not hold ideas of self, being,
    person, quality, or no-quality. A hidden saying compares the teaching of the Law
    to a raft that must ultimately be abandoned. Bhagavat then asks Subhati whether
    anything was known as highest perfect knowledge or taught by the Tathagata; Subhati
    replies that nothing is known or taught in that way, because what is known or
    taught is incomprehensible and inexpressible, neither thing nor no-thing.
  language: English
  quote_policy: quoted
