canonical_text:
  quote: ''
  summary: At sunrise, the noblest of men sees the hermitage of the son of Bhvzgu.
    Its deer and birds rest quietly, and the sight makes him restful. To show reverence
    for the penances observed there, he dismounts from his horse, strokes it, declares
    that all is saved, and praises Khamdaka for devotedly and capably following the
    swift steed.
