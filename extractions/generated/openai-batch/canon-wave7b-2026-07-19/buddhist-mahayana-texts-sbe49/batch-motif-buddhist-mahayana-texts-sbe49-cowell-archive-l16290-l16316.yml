canonical_text:
  quote: ''
  summary: Subhiti asks the Bhagavat how a person who has entered the path of the
    Bodhisattvas should behave, advance, and restrain his thoughts. The Bhagavat replies
    that such a person should frame the thought that all beings must be delivered
    into the perfect world of Nirvaza, while also recognizing that no being has been
    delivered. He explains that a Bodhisattva cannot hold ideas of beings, living
    beings, or persons, and states that there is no dharma corresponding to one who
    has entered the Bodhisattva path. The passage then begins a question about whether
    the Tathagata adopted anything from Tathagata Dipankara regarding highest perfect
    knowledge.
  language: English
  quote_policy: summarized
