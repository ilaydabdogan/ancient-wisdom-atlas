canonical_text:
  quote: ''
  summary: A speaker calls on the Tathagata, teacher of the world, to proclaim the
    good Law beginning with the four noble truths and the eightfold Path. The speaker
    declares an intention to instruct the world, show Nirvana, teach self-control,
    and uphold the noble eightfold Path as the means to liberation. The passage contrasts
    this teaching with rival explanations involving merit, preserved soul, spontaneity,
    prior production, or a Divine Lord/Isvara, and says false theorists are eventually
    born in hells.
  language: English
  quote_policy: summarized
