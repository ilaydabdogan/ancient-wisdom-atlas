canonical_text:
  quote: ''
  summary: 'A didactic passage argues that worldly pleasures are unstable and unsatisfying.
    It gives mythic and royal examples: Mandhatvz remains unsatisfied despite cosmic
    conquest and a share of Sakra’s throne; Nahusha falls after enjoying the gods’
    kingdom and acting proudly; Purdravas falls into destruction after gaining Urvasi
    and desiring the Rishis’ gold; worldly objects pass among Bali, Indra, and Nahusha;
    ascetics and warriors are also overcome by pleasure. The passage then compares
    pleasure to poison, intoxication, borrowed goods, and a torch of hay, and urges
    self-controlled people to abandon it.'
  language: English
  quote_policy: summarized
