canonical_text:
  quote: ''
  summary: A teacher describes successive contemplative attainments, higher states,
    and a doctrine of liberation involving the soul's release from the body. The prince
    rejects this as not final because the continued soul remains bound to birth, qualities,
    and egoism. He leaves Arada, then visits Udraka, whose subtler doctrine also fails
    to satisfy the Bodhisattva, who departs seeking something beyond.
  language: English
  quote_policy: summarized
