canonical_text:
  quote: ''
  summary: The prince tells his father that his course toward liberation should not
    be hindered, comparing restraint to holding back someone escaping a burning house.
    The king forbids the departure, sets guards and pleasures around him, and the
    prince sorrowfully enters the palace. Women attend him with music in a luxurious
    setting, but he remains unmoved. Heavenly Akanishtha beings, knowing his intent,
    cast deep sleep on the women, whose bodies, ornaments, garments, and instruments
    fall into disorder. Seeing them thus distorted, the prince feels scorn.
  language: English
  quote_policy: summarized
