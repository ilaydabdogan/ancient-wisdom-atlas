candidate_motifs:
- id: motif:1
  label: Sacred-name hearing leading to irreversible progress toward perfect knowledge
  taxonomy_refs:
  - wisdom
  basis: The passage states that beings who hear Amitabha's name and raise joyful
    longing even once will not turn away from highest perfect knowledge, and the verses
    praise the gain of those who heard the name.
  evidence_refs:
  - ev:2
  - ev:9
  confidence: high
  cautions: The passage frames this as a Buddhist devotional and soteriological claim;
    it is not a general name-magic motif without doctrinal context.
- id: motif:2
  label: Deathbed vision followed by rebirth in a blessed Buddha country
  taxonomy_refs:
  - afterlife_journey_map
  - death_rebirth
  basis: Amitabha appears when death approaches, the devotee sees him, dies, and is
    born in Sukhavati; a similar sequence is given for those seeing a thought-created
    likeness.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage describes rebirth in Sukhavati but gives little narrative
    detail about travel, judgment, or intermediate geography.
- id: motif:3
  label: Meditative or dream vision of Amitabha linked to rebirth and non-retrogression
  taxonomy_refs:
  - mystical_quest
  - wisdom
  - death_rebirth
  basis: Beings who meditate with ten thoughts or even one thought see Amitabha in
    a dream, are born in Sukhavati, and never turn away from highest perfect knowledge.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The word 'quest' is only approximate; the passage emphasizes meditation,
    desire, dream vision, and rebirth rather than a journey narrative.
- id: motif:4
  label: Cosmic praise and pilgrimage from the ten directions
  taxonomy_refs: []
  basis: Tathagatas of the ten quarters praise Amitabha, and Bodhisattvas from the
    ten quarters come to see, bow before, worship, consult, and view his Buddha country.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: This is a strong passage-level pattern but no specific supplied taxonomy
    family exactly names it.
- id: motif:5
  label: Offerings transformed into a vast canopy over the Buddha
  taxonomy_refs: []
  basis: The flowers thrown in worship arise as an umbrella extending over a hundred
    yojanas, while the Buddha country shines and the Buddha's body is covered with
    flowers.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The verses containing this imagery are marked by the source as having
    doubtful passages and tentative rendering.
- id: motif:6
  label: Exemplary pure land wished for by visiting Bodhisattvas
  taxonomy_refs: []
  basis: Bodhisattvas praise the Buddha country and proclaim the wish that their own
    country also be such as this.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage states a wish and admiration; it does not narrate whether
    the wish is granted.
