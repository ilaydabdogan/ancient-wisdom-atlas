canonical_text:
  quote: ''
  summary: The passage says that Amitabha's name is praised by innumerable Buddhas
    and that beings who hear it and turn their thought joyfully toward perfect knowledge
    will not fall back. It describes several levels of devotion or meditation by which
    beings see Amitabha at death, in a thought-created likeness, or in a dream, and
    are born in Sukhavati. It then describes Tathagatas and Bodhisattvas from the
    ten quarters praising, visiting, worshipping, and offering flowers and scents
    to Amitabha/Amitayu, with the Buddha country praised as beautiful, dream-like,
    and filled with endless light, life, splendour, and assembly.
  language: English
  quote_policy: summarized
