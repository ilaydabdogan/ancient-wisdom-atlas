  quote: ''
  summary: The passage describes the Sakya king arranging Yasodhara as bride for the
    prince, secluding the prince in pleasure-filled palace apartments to avoid disturbing
    sights, women entertaining him, a fall from a pavilion without reaching the ground,
    and the king practicing restraint, beneficent learning, truth-speaking, purification,
    Vedic offerings to Agni, soma drinking, and gifts to Brahmans for his son's prosperity
    and long life.
  language: English
  quote_policy: summarized
