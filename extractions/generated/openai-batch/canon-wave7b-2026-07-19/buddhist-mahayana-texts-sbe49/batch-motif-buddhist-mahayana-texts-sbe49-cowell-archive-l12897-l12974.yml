canonical_text:
  quote: ''
  summary: A note by Bunyiu Nanjio discusses Chinese translations of the Larger Sukhavativyuha
    that contain forty-eight Pranidhanas rather than forty-six in the Sanskrit text.
    It identifies the 18th and 21st vows as missing from the Sanskrit, presents translations
    of the 18th, 20th, and 21st vows, and notes an attempt to restore Sanskrit wording
    from the Chinese translations. The vows concern birth in the speaker’s country
    through belief, name-recollection, hearing the name, and merit cultivation, as
    well as the endowment of gods and men in that country with the thirty-two marks
    of the great man.
  language: English with Sanskrit/OCR textual fragments
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note states that Chinese translations of the Larger Sukhavativyuha have
    forty-eight Pranidhanas, while the Sanskrit text has forty-six, and that the 18th
    and 21st vows are missing from the Sanskrit text.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The 18th vow says that beings in the ten quarters who believe with serene
    thoughts, wish to be born in the speaker’s country, and think of or repeat the
    speaker’s name ten times should be born there, except for beings who committed
    the five deadly sins or spoke evil of the good Law.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The 20th vow says that beings in the ten quarters who hear the speaker’s name,
    direct their thoughts toward the speaker’s country, cultivate roots or stock of
    merit with serene thoughts, and wish to be born there should accomplish that desire.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The 21st vow says that gods and men in the speaker’s country should all be
    perfectly endowed with the thirty-two marks of the great man.
  category: speech
  evidence_refs:
  - ev:4
