canonical_text:
  quote: ''
  summary: A hymn praises the Tathagata/Gina with images of purity, knowledge, patience,
    auspicious abundance, cosmic light, victory over Mara, and righteousness. Worshipping
    beings honor him, circumambulate, and return home. Further celestial and terrestrial
    beings come to the pavilion of the Bodhi tree, worship and praise him according
    to their rank and knowledge, and return to their own homes.
  language: English
  quote_policy: summarized
