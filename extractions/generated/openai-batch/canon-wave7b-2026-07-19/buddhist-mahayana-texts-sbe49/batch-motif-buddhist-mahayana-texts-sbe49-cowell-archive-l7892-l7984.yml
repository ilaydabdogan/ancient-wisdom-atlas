canonical_text:
  quote: ''
  summary: The passage teaches that virtuous restraint and noble knowledge lead to
    heavenly worlds, while attachment to existence brings suffering, death, and rebirth.
    It explains the body as empty and conditioned by the chain of causation, presents
    cessation as ending that chain, and outlines a renunciant path of wisdom, self-denial,
    perfections, conquest of Mara’s hosts, and entrance into Nirvana. It then begins
    a stepwise account of dependent causation, beginning with ignorance as the root
    of a poison-tree of mundane existence and proceeding through impressions, consciousness,
    sense organs, contact, sensation, and thirst.
  language: English
  quote_policy: summarized
