  quote: ''
  summary: The passage praises the Śākya king and queen Maya, then narrates the Bodhisattva’s
    descent from Tushita into Maya’s womb, his assumed white-elephant form, his birth
    at Lumbini from the queen’s side without pain, celestial honors at birth, radiance,
    seven steps, and declaration that this is his last birth for supreme knowledge
    and the welfare of the world.
