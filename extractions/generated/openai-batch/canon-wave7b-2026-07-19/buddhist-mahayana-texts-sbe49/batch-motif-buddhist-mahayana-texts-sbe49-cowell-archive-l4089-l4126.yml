  quote: ''
  summary: Yasodhara and the women mourn after the king's son has gone to the forest.
    The king finishes prayers and auspicious sacrificial rites, leaves the temple,
    hears public wailing, learns of the arrival of Kamdaka and Kamthaka and of his
    son's fixed resolve, collapses in grief, and addresses the horse Kamthaka as responsible
    for leaving his beloved son in the wood.
