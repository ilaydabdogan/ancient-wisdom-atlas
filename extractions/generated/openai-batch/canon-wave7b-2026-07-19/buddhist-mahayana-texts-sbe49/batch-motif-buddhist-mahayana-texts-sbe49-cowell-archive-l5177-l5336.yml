  summary: A quoted didactic passage argues that sensual pleasures are unsatisfying,
    dangerous, impermanent, and mixed with pain. It supports this through similes
    of serpents, bones, discarded flesh, high fruit, hot coal, dreams, weapons, animal
    lures, and remedies for bodily discomfort. It also critiques royal power as laborious
    and limited in real use.
