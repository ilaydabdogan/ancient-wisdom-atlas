canonical_text:
  quote: a golden lotus-flower like the disk of the sun
  summary: A guilty dying man is instructed by a teacher and then by a good friend
    to invoke Buddha Amitayus. Ten repetitions of the Buddha-name formula expiate
    vast sins; as he dies he sees a golden lotus, is born in the World of Highest
    Happiness, and after twelve greater kalpas receives compassionate teaching from
    two Bodhisattvas. He rejoices and turns his thought toward Bodhi; the passage
    identifies this as the lowest form of the lowest grade and as part of the Sixteenth
    Meditation.
  language: English
  quote_policy: quoted
