canonical_text:
  quote: ''
  summary: Arada praises the prince as fit to receive a highest religion and urges
    him to cross the sea of misery. The prince responds with similes of light, guide,
    and boat and asks for the secret of deliverance from old age, death, and disease.
    Arada then gives a doctrinal exposition on mortal existence, evolvents and evolutes,
    the kshetragna or soul, Kapila's illuminated tradition, the manifested and unmanifested,
    causes of worldly existence, forms of ignorance, false ritual means, attachment,
    gravitation into new births, and torpor or delusion.
  language: English
  quote_policy: summarized
