canonical_text:
  quote: "“I wish to-day to go hence to attain immortality.”"
  summary: After reflecting on sleeping palace women, the unnamed lord resolves to
    escape at night. The gods open the palace doors, he summons the horse attendant
    Khamdaka, asks for the horse Kamthaka, and mounts the white horse to depart silently
    toward the forest in pursuit of immortality, Dharma, and the good of the world.
  language: English
  quote_policy: quoted
