canonical_text:
  quote: ''
  summary: 'The passage lists rebirth outcomes tied to former deeds: envious or selfish
    beings suffer in a lightless realm with hunger and thirst; some are born among
    humans from a hell-like womb; meritorious ascetics go to heaven; others gain earthly
    empire; others become Nagas guarding treasures underground. The unnamed contemplative
    figure then reflects on universal misery, decay, death, renewed birth, and a chain
    of necessary conditions leading through birth, attachment, desire, sensation,
    contact, sense organs, and organism.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some beings born again with minds filled with envy reap miserable fruits in
    a lightless world of the Pitrs and suffer hunger and thirst with needle-small
    mouths and mountain-large bellies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that if a person understood the consequence of selfishness,
    he would give others pieces of his own body like Sibi; other beings rush hopefully
    toward food but are held back by former deeds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some beings find a hell in an impure lake called the womb, are born among
    humans, and suffer anguish there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ascetics who have performed meritorious actions go to heaven, while others
    attain extended earthly empire and wander on earth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Others become Nagas in subterranean regions, guard treasures, and wander in
