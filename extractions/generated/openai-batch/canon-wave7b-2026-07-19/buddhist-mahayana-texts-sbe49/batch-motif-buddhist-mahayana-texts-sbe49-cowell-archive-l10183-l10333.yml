canonical_text:
  quote: ''
  summary: The passage opens with adoration to the Three Treasures, Buddhas, Bodhisattvas,
    and Amitabha, and with an aspiration to go to Sukhavati, the Land of Bliss. It
    then locates the Bhagavat at Rajagriha on Mount Gridhrakuta among a large assembly
    of Bhikshus and Bodhisattvas. Ananda performs obeisance, observes the Bhagavat’s
    unusually serene and golden-yellow radiance, infers that he may be dwelling in
    omniscience or contemplating Buddhas of past, future, and present, and is praised
    by the Bhagavat for a question beneficial to many beings.
  language: English
