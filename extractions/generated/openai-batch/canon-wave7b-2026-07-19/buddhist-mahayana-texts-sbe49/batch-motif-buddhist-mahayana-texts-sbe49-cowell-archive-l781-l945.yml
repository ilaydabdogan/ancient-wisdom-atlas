canonical_text:
  quote: "“thy son has been born for the sake of supreme knowledge”"
  summary: The ascetic Asita tells the king that a heavenly voice and signs have revealed
    the prince’s destiny. He views the infant prince, notes auspicious bodily marks,
    weeps because he himself will not live to hear the prince’s future Law, and prophesies
    that the prince will renounce kingship, attain supreme knowledge, and deliver
    beings from misery, illusion, desire, and the cycle of birth.
  language: English
  quote_policy: quoted
