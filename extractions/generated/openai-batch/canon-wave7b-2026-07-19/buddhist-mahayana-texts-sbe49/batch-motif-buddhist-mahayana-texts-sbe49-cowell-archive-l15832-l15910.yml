canonical_text:
  quote: ''
  summary: In a dialogue, Bhagavat asks Subhuti whether advanced spiritual figures
    think they have obtained their fruits or states. Subhuti denies this for Sakrdagamin,
    Anagamin, and Arhat, explaining that no individual being has obtained such a state.
    He says an Arhat who claimed attainment would believe in self, being, living being,
    and person. Subhuti also states that although the Tathagata identified him as
    an Arhat and foremost among those dwelling in virtue, he does not think of himself
    as such. The dialogue then denies that the Tathagata adopted anything from Tathagata
    Dipankara, and says a Bodhisattva claiming to create numbers of worlds would speak
    untruth, because numbers of worlds are preached as no-numbers and therefore called
    numbers of worlds.
  language: English
  quote_policy: summarized
