  summary: The passage contrasts a vast gift of seven treasures to enlightened Tathagatas
    with a Bodhisattva's acquisition of endurance in selfless and uncreated things,
    saying the latter produces a larger immeasurable stock of merit. Bhagavat then
    teaches Subhiti that a Bodhisattva's stock of merit should be appropriated and
    not appropriated.
