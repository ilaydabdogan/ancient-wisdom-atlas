canonical_text:
  quote: ''
  summary: A speaker rejects a king's proposal involving kingdom, pleasures, worldly
    aims, and sacrifice. He says he went to the forest not from anger or defeat but
    from a resolve to abandon pleasures, live on alms, seek calm, and escape old age
    and death. He compares returning to pleasures to seizing a released serpent or
    blazing torch. He argues that death may come at any age, depicts death as a hunter
    armed with old age and disease, and rejects sacrificial fruits obtained by harming
    others.
  language: English
  quote_policy: summarized
