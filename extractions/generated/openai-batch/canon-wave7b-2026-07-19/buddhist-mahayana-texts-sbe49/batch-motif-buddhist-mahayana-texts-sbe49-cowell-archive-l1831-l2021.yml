canonical_text:
  quote: ''
  summary: Women go out from a city-garden to meet the prince, gaze at him with love,
    and are exhorted by Udayin to use their arts to captivate him. Udayin cites precedents
    of women subduing ascetics and urges action for the royal family's prosperity.
    The women then surround the prince in a grove and attempt to attract him through
    gestures, embraces, song, floral imagery, intoxication, and divine or royal similes.
  language: English
  quote_policy: summarized
