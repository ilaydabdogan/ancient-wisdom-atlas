canonical_text:
  quote: "“my desire is that there may be no fresh birth”"
  summary: A prince leaves an ascetic hermitage despite the hermits’ hospitality.
    The hermits praise the holy geography and heavenward merit of their penances,
    while the prince says he seeks cessation and no fresh birth. A Brahman ascetic
    praises the prince’s resolve for liberation, directs him toward Muni Ardda, and
    predicts that the prince will surpass that teaching and attain a teacher’s seat.
  language: English
  quote_policy: quoted
