canonical_text:
  quote: ''
  summary: A Buddha figure called Buddha, Gina, Great Gina, and Sugata travels among
    woods and cities, receives robbers as mendicants, receives messages from Suddhodana
    through envoys, instructs disciples and Udayin, and is associated with deliverance,
    divine assistance, and supernatural manifestations. Udayin goes to Kapila, teaches
    the king and court, and descends from heaven. The monarch worships the Gina, and
    the Sugata manifests in the sky as a form comprehending the universe through a
    sequence of fiery, animal, celestial, and divine forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A central figure travels near Ragageha with a begging-vessel given by merchants
    after an episode involving merchant-caravans, treasures, and troops of robbers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the wood called Vezu, filled with Sal trees, the central figure eats food
    prepared by enriched robbers and receives five hundred of them as mendicants,
    giving them begging-vessels and requisites.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Suddhodana sends envoys named Afandaka or Khandaka and Udayin with a message
    that family members and noble ladies hope to see the Buddha.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The two envoys salute the Buddha in the Venu vihara and deliver the message
    with tear-filled eyes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
