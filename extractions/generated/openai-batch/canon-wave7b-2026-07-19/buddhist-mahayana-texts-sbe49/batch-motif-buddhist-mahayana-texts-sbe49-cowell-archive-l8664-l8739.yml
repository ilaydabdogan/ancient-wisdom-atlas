    Great Gina with disciples, mendicants, and saints.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Great Gina travels from place to place, confers deliverance, confirms
    disciples, mendicants, and Arhats, and reaches the wood Nigrodha while illuminating
    the district, shaking the earth, and ending misery.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Gina instructs shaven mendicant-followers, gods bring his precepts to
    their minds, and he instructs Udayin in proclaiming wisdom to others.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Udayin goes to Kapila on the Gina’s command, instructs the king in an assembly,
    descends from heaven, and teaches the king and court the four sublime truths.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The king becomes enlightened in mind, worships Udayin, and offers homage with
    his courtiers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The monarch worships the Gina’s feet with eight hundred presents, and the
