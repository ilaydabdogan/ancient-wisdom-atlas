  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The prince cuts his decorated tiara and hair and tosses them, with scattered
    muslin, into the air.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Heavenly beings seize the tossed hair and tiara respectfully and honor them
    in heaven.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: After removing his ornaments and royal magnificence from his head, the prince
    desires a sylvan dress.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: A celestial being in the form of a hunter, pure in heart and knowing the prince’s
    thoughts, approaches in dark-red garments.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The prince says the red garments are auspicious and the sign of a saint, but
