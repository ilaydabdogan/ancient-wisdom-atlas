canonical_text:
  quote: ''
  summary: The prince reflects on separation from his mother and on the inevitable
    parting of beings, instructs a friend to return to Kapilavastu with news of his
    resolve to conquer old age and death or perish. Kamthaka the horse grieves; the
    prince consoles him. The prince draws a jewelled sword, cuts off his tiara and
    hair, and casts them upward, where heavenly beings receive and worship them. He
    then desires forest clothing. A celestial being in hunter form approaches in red
    garments, and the prince asks to exchange clothing while objecting to the hunter’s
    bow.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker recalls his mother as the one who bore him in the womb with thirst
    and pains, and asks where each now stands in relation to the other.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker compares meetings and separations of beings to birds going to
    roost and departing, clouds coming together and parting, and a union that is like
    a dream.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker tells a good friend not to grieve, to go, and, if love lingers,
    to return later.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The speaker instructs that people in Kapilavastu should give up love for
    him and hear his resolve: he will either return after destroying old age and death
    or perish in failure.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kamthaka, described as the noblest of steeds, licks the prince’s feet and
    sheds hot tears after hearing the words.
