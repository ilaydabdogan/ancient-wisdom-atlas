canonical_text:
  quote: ''
  summary: The passage describes Amitayus in Sukhavati with innumerable disciples
    and purified Bodhisattvas. It urges beings to make fervent prayer for that Buddha
    country. A son or daughter who hears and keeps Amitayus's name in mind for one
    to seven nights is said to see Amitayus at death, depart tranquilly, and be born
    after death in Sukhavati. The passage then lists innumerable Buddhas in the East,
    South, West, North, Nadir, and Zenith who reveal their own Buddha countries and
    endorse the repetition of the Law called the “Favour of all Buddhas.”
  language: English
  quote_policy: summarized
