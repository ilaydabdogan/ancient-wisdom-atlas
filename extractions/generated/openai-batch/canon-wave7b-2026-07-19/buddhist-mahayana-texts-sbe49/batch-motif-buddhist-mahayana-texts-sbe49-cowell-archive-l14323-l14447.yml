canonical_text:
  quote: ''
  summary: The passage opens the Smaller Sukhavati-vyuha with the Buddha dwelling
    at Sravasti in the Geta-grove among monks, disciples, Bodhisattvas, and deities.
    He addresses Sariputra and describes a western Buddha-country called Sukhavati,
    where the Tathagata Amitayus dwells and teaches the Law. The world is called happy
    because living beings there have neither bodily nor mental pain and have innumerable
    sources of happiness. The next section begins to describe Sukhavati as adorned
    with seven terraces and seven rows, but the excerpt breaks off.
  language: English
