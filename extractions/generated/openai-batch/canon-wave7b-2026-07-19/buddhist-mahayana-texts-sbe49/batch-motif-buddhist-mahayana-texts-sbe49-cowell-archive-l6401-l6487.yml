canonical_text:
  quote: ''
  summary: 'A series of assaults on the Sakya saint at the Bodhi tree fail or are
    transformed: embers become lotus petals, serpents are immobilized, stones become
    flowers, weapons do not strike, a skull-bearing woman fails to unsettle him, and
    frightening animal cries disturb surrounding beings while the saint remains unmoved.'
  language: English
  quote_policy: summarized
