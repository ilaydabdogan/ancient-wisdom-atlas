canonical_text:
  quote: ''
  summary: In a magnificent city, crowds of women and citizens gather to look at the
    radiant prince in the road. Some women praise his wife, and others think that
    he will leave royal pomp and devote himself to religion. The prince briefly feels
    pleasure at the respectful white-clad crowd. Gods dwelling in pure abodes then
    create an old man to walk by in order to stir the prince's heart. The prince notices
    the old man's decrepitude, white hair, staff, and hidden eyes, and asks his charioteer
    who he is.
  language: English
