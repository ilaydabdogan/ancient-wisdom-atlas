  summary: The speaker discusses difficulties in translating the Sukhavati-vyuha,
    including corrupt or imperfect text and excessive diction. He defends the Sacred
    Books of the East translations as faithful though not necessarily mistake-free,
    contrasts pioneer translators with later critics, uses a forest-wayfinding image
    for first translation work, and denies any intent to make the texts seem better
    or more beautiful than they are.
  language: English
