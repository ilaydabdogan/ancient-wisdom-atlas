canonical_text:
  quote: ''
  summary: A doctrinal discourse explains desire, anger, despondency, ignorance, rebirth,
    and embodied wandering. It then describes discernment of four categories and sacred
    study as leading toward an immortal sphere. The prince asks the seer Arada about
    the means and endpoint, and Arada describes renunciant departure, mendicant conduct,
    alms, solitude, sense-restraint, tranquility, and progressive stages of contemplation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Desire is identified as the “great delusion,” and even higher beings are said
    to be deluded by it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Anger is defined as “darkness,” and despondency is defined as “blind darkness.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A child entangled in fivefold ignorance is said to pass through different
    births in a miserable world.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The embodied being wanders while thinking “I am” the seer, hearer, thinker,
    effect, and cause.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The “stream of torpor” is said to be set in motion through causes, and absence
    of cause is linked to absence of effect.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: 'A wise person with right views is instructed to know four things: illuminated,
    unilluminated, manifested, and unmanifested.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The soul that distinguishes the four properly and abandons certain relative
    ideas is said to attain the immortal sphere.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Brahmans are described as discoursing on supreme Brahman, practicing rigorous
    sacred study, and allowing other Brahmans to live with them to follow it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: After hearing the discourse, the prince asks the seer about the means, the
    final state, and the limits of the life of sacred study.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: Arada responds by declaring the course of life according to his doctrine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The devotee begins by leaving his house, assuming the signs of the mendicant,
    and following a lifelong rule of conduct.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The devotee accepts any alms, lives alone, remains indifferent to feelings,
    meditates on holy books, restrains the senses, and seeks tranquility of mind.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: The contemplative path includes a first stage separated from desires and evil
    intentions, ecstatic contemplation, possible deception by delight, and a further
    stage of contemplation with its own pleasure and ecstasy.
  category: sequence
  evidence_refs:
  - ev:5
