canonical_text:
  quote: ''
  summary: 'The passage recounts final acts in Kapila: the central Buddha figure declares
    the Law, builds a round stupa, coronates Saunu, orders ascetic vows and rites,
    teaches sacred textual categories and vehicles, displays miracles, honors family,
    makes disciples and women Arhats or Bhikshunis, enthrones Saunu, establishes the
    people in doctrine, abolishes poverty and darkness, and departs toward the north
    with Brahman, Vishnu, and Siva as mendicants. The narrator closes by dedicating
    the virtue of the description as merit for beings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The central figure declares the glory of the Law of Buddha, builds a round
    Stipa, gives Saunu a royal coronation, sends him into the wood with saints and
    Kaityas, and directs him to worship sacred relics.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rahula, Gautami, and other women led by Gopika are described as shaven ascetics
    with staves and are commanded to practice fasting and named ceremonies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sacred textual categories and the Yana for common disciples, the Yana for
    Pratyeka Buddhas, and the Mahayana are taught, made current, and proclaimed around.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The conqueror of the world goes out of the city of Kapila accompanied by thirteen
    and a half bodies of mendicants.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Kapila, miracles are displayed, the father is honored, Rahula and his companions
    are made Arhats, and Bhikshunis headed by Gautami and Gopika, along with women
    of all four castes, are also elevated.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Saunu is established on an imperial throne, the people are established in
    the Gina doctrine, and poverty and darkness are abolished.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After remembering his mother and worshipping Svayambhi, the central figure
    sets forth toward the northern region with Brahman, Vishnu, and Siva as mendicants
    in his train.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The narrator says he has described the birth Avadana of the lion of the Sakyas
    and dedicates any virtue gained as a store of merit and delight among the six
    orders of beings.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
