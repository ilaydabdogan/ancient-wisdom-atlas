canonical_text:
  quote: ''
  summary: The passage describes rewards for holding, spreading, declaring, hearing,
    and worshipfully honoring the method of the Law. These rewards include merit,
    purification, prosperity, supernatural powers, royal and celestial status, eventual
    Buddhahood, contemplative attainments, protection of a realm from named fears,
    and the prospect that worshippers of Pratyeka-Buddhas or Bodhisattvas become like
    those honored beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who holds the method of the Law in mind and sets it abroad is said
    to obtain eight supplies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who declares the method of the Law to others is said to be purified
    by great merit, prosperous, and possessed of supernatural powers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The same recipient is said to become a universal monarch, king of kings, ruler
    among several divine or heavenly domains, Mahabrahman, and in the end a Buddha.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A faithful and devoted hearer of the method of the Law is said to gain a pure
    intellect, a calmed mind, charity, compassion, joy, and universal indifference.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The hearer is said to rejoice in the four contemplations, reach an ecstatic
    state, abolish the senses, attain five transcendent faculties, destroy latent
    impressions, possess supernatural powers, and attain the Suramgama samadhi.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Where the method of the Law prevails universally, the passage says there will
    be no fear of disturbances, thieves, evil beasts, plagues, famines, wildernesses,
    quarrel, war, gods, Nagas, Yakshas, or misfortune.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Worship of Buddhas with faith is said to produce pre-eminent merit.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Those who joyfully worship a Pratyeka-Buddha are said to become Pratyeka-Buddhas,
