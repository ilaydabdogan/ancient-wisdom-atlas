canonical_text:
  quote: ''
  summary: The passage opens the Diamond-Cutter with an invocation to the Perfection
    of Wisdom. The Buddha dwells at Sravasti in the grove of Geta, in Anathapindada's
    garden, with 1250 Bhikshus and many Bodhisattvas. He goes into Sravasti for alms,
    eats, returns, puts away his bowl and cloak, washes his feet, sits cross-legged,
    and turns his reflection inward. Bhikshus honor him and sit to one side. Subhuti
    then rises, performs respectful gestures, and addresses the Buddha, praising the
    favor shown to Bodhisattvas by the Tathagata.
  language: English
