canonical_text:
  quote: ''
  summary: Two royal servants, the counsellor and the family priest, hurry to a forest
    hermitage because of the king's grief. They set aside royal pomp, enter Bhargava's
    abode, salute him, and state that they serve the Ikshvaku monarch and seek news
    of his son, who came there to escape old age and death. Bhargava replies that
    the prince came there, understood that the local dharma led only to return, and
    departed toward Arada seeking liberation.
  language: English
  quote_policy: summarized
