canonical_text:
  quote: ''
  summary: In BOOK XI, 1-12, the son of Suddhodana answers the monarch of the Magadhas.
    He acknowledges the king's friendly generosity, praises steadfast friendship,
    and explains that fear of old age and death has led him to a religious path toward
    liberation, leaving kin and pleasures behind. He warns that worldly pleasures
    are deceptive, insatiable, and more fearsome than physical dangers, and illustrates
    insatiability with kings who desire further conquest even after possessing the
    earth girdled by sea.
  language: English
  quote_policy: summarized
