- id: obs:1
  text: The ruler is described as acting without desire or dislike in matters to be
    done and as not valuing sacrifice highly.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a suppliant brought a petition, the ruler responded with a gift described
    through the image of water sprinkled on the gift, and he overcame the arrogant
    without fighting.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A cryptic verse says the ruler took away one, protected seven, abandoned seven,
    kept five, obtained and learned a set of three, and understood and abandoned two.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: Guilty persons sentenced to death were not killed or regarded with anger;
    the ruler bound them with gentle words and reform, and released them without injury.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The ruler performed religious vows, gave up long-held hostile feelings, gained
    glory associated with virtue, and relinquished defiling passions.
  category: action
  evidence_refs:
  - ev:1
