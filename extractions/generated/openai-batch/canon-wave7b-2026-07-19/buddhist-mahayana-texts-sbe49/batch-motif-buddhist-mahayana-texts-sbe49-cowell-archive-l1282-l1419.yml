canonical_text:
  quote: ''
  summary: The passage praises a king’s restraint, generosity, mercy, religious observances,
    non-injurious sacrifice, and guardianship of his people. It then recounts the
    birth of a son named Réhula to Yasodhar4 and the son of Suddhodana, the king’s
    joy at his grandson, and the king’s efforts to protect his son through rites and
    to keep him from forest-renunciation by allowing pleasures. The passage concludes
    with a general statement that Bodhisattvas depart to the forest after a son is
    born, while this figure continues worldly pleasure until attaining supreme wisdom.
  language: English
  quote_policy: summarized
