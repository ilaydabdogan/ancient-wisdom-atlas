  evidence_refs:
  - ev:3
- id: obs:9
  text: The king rejoiced at the birth of his grandson as he had rejoiced at the birth
    of his son and performed the enjoined rites at the proper time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The king practiced austerities while retaining white garments and offered
    in sacrifice only things that did not injure living creatures.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The king offered worship, repeated Vedic texts to Svayambhii for his son’s
    safety, laid aside weapons, studied the Sastra, practiced calm, refused objects
    of sense, and viewed his kingdoms like a father.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The king practiced observances while asking how his son might be stopped from
