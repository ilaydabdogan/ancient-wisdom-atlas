canonical_text:
  quote: "“as a man who has entered the darkness would not see anything”"
  summary: The passage contrasts a Bodhisattva immersed in objects with one not immersed
    in objects through images of darkness and sunrise. It says that those who learn,
    remember, recite, understand, write, and explain the treatise of the Law are known
    and seen by the Tathagata and produce immeasurable merit. It compares this merit
    favorably against repeated life-sacrifice measured by the sands of the Ganga.
    The treatise is described as incomprehensible and incomparable, intended for beings
    on the best path, inaccessible to beings of little faith or self-belief, and capable
    of making the place where it is propounded worthy of worship like a Kaitya.
  language: English
  quote_policy: quoted
