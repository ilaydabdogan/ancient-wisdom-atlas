canonical_text:
  quote: ''
  summary: The Buddha dwells at Ragagvzha on GridhrakizZa with monks and Bodhisattvas.
    Prince Agatasatru, following wicked counsel, imprisons his father King Bimbisara
    in a seven-walled room. Queen Vaidehi secretly brings the king food and drink.
    Bimbisara worships toward the Buddha and receives precepts and teaching from Mahamaudgalyayana
    and another disciple sent by the Buddha. Agatasatru learns of this, threatens
    to kill his mother, is restrained by two ministers, repents, lays down his sword,
    and confines Vaidehi in a hidden palace.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Buddha is described as dwelling in Ragagvzha on the mountain GridhrakizZa
    with a large assembly of Bhikshus and thirty-two thousand Bodhisattvas, with Mazgusri
    at the head.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Agatasatru, the heir-apparent, listens to Devadatta and other friends, forcibly
    arrests his father Bimbisara, and shuts him alone in a room with seven walls.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Agatasatru proclaims that no courtier should approach the imprisoned king.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vaidehi purifies herself, places honey, ghee, and corn-flour on her body,
    and hides grape juice in her garlands in order to bring food to Bimbisara unnoticed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Vaidehi enters the prison and offers the hidden food and drink to Bimbisara,
    who eats, drinks, and rinses his mouth with water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bimbisara stretches out folded hands toward Mount Gvzdhrakdea, worships the
    World-Honoured One, and prays that Mahamaudgalyayana come to communicate the eight
    precepts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mahamaudgalyayana appears before Bimbisara with speed compared to a falcon
    or eagle and communicates the eight precepts to him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Day after day Mahamaudgalyayana comes, and the Buddha also sends his disciple
    Pairza to preach the Law to Bimbisara for a period of three weeks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Bimbisara's countenance shows happiness and contentment when he hears the
    Law and receives honey and flour.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The warder reports to Agatasatru that Vaidehi has brought food and that Mahamaudgalyayana
    and Parva approach through the sky to preach the Law, and says their coming cannot
    be prevented.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Agatasatru becomes angry with his mother, calls her a rebel, accuses the Sramazas
    of deceptive spells, and brandishes a sharp sword intending to kill her.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The minister Xandraprabha and Giva intervene, salute Agatasatru, and remonstrate
    with him against killing his mother.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The ministers state that many wicked kings had killed their fathers while
    coveting thrones, but that they had never heard of a man killing his mother.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The ministers withdraw backward with hands on their swords; Agatasatru is
    frightened, hears Giva's warning not to injure his mother, repents, lays down
    his sword, and does not harm her.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Agatasatru orders officers of the inner chambers to put Vaidehi in a hidden
    palace and not allow her to come out again.
  category: action
  evidence_refs:
  - ev:10
