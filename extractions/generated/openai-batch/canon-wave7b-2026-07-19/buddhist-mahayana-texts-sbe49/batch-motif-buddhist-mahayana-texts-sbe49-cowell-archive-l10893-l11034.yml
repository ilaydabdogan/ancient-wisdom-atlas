canonical_text:
  quote: then may I not obtain the highest perfect knowledge
  summary: The passage gives a sequence of conditional vows addressed to the Bhagavat,
    in which the speaker links his attainment of Bodhi to benefits for women, Bodhisattvas,
    and beings in many Buddha countries. Benefits include effects from hearing his
    name, birth in his Buddha country, spontaneous cloaks and ornaments, samadhi visions
    of innumerable Buddhas, desired teachings, non-retrogression toward Bodhi, and
    continuing allegiance to Buddha, the Law, and the Church. A following prose transition
    names the speaker as the Bhikshu Dharmakara and introduces verses about his excellent
    Pranidhana, an endowed country, the spread of his name through the ten quarters,
    rejection of sensual enjoyment, and a lord of vast light who illuminates Buddha
    countries and quiets passions, sins, errors, and hell-fire.
  language: English
  quote_policy: quoted
