canonical_text:
  quote: ''
  summary: The passage recounts a sequence of approaches to the Buddha or Gina by
    Brahmans, ascetics, a Naga, Sabhya, Yasoda, Svastika, a boatman, Kasyapa groups,
    female ascetics, and kings or citizens. The Buddha initiates or receives many
    as mendicants or Bhikshus, blesses rulers and citizens with wealth, crosses the
    Ganges with a boatman who offers milk, displays supernatural power at Uruvilva,
    causes ascetics to enter Nirvana, establishes first female ascetics, and enlightens
    King Bimbisara in right action.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Brahman Agaya, his son Nalaka, Dhrti, Samgayin, and Samgayin's disciples came
    for refuge, and the chief of saints initiated them as mendicants by touching them
    with a hand marked with a wheel.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Naga Elapatra came to the abode of the best of saints, stood calmly and
    resplendently, and worshipped him with rosaries.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sabhya, son of Trikavyamgika and Vidyakara, went to the Deer Park seeking
    the highest wisdom and admission to the noble life, and became known as the mendicant
    Sabhya.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yasoda, described as born after worship at the best of trees on a stream bank,
    came with friends to the Deer Park; the holy one touched his head and made him
    guru of the chief Bhikshus.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The great Buddha proceeded with mendicants, manifested a triumphal march for
    the salvation of the world, and entered Kasi.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Svastika, a poor Brahman from Varanasi, obtained riches from heaven through
    the glorious one's favor, entered the Gina faith, became a mendicant, and became
    an Arhat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Buddha blessed King Divodasa of Kasi and the citizens with gold, corn,
    and other riches, took up abode in forests, caves, and mountains, and came to
    the river Gahnavi.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A boatman conveyed the Gina across the Ganges, worshipped him, offered milk,
    became a mendicant through his favor, and received a dwelling in the Buddha's
    hermitage in the grove.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After crossing the Ganges, the Buddha went to Kasyapa's hermitage at Gaya
    called Uruvilva, showed supernatural power, and received the Kasyapas, Uruvilva,
    others, and more than a thousand disciples as Bhikshus.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Those received at Uruvilva were endowed with spiritual knowledge and the power
    to abandon worldly action.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Upasena, accompanied by three hundred disciples, became an ascetic at the
    command of his maternal uncle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Buddha made seven hundred ascetics dwelling in Dharma wood enter Nirvana.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The daughters of Nandika, Sugata, and others became the first female ascetics.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: In Rajagriha, the lord of the Law enlightened King Bimbisara in right action
    and activity.
  category: action
  evidence_refs:
  - ev:8
