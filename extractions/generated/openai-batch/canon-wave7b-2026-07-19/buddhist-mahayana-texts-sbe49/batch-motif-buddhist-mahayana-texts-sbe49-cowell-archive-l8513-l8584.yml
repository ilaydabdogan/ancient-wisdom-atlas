candidate_motifs:
- id: motif:1
  label: Initiation into mendicant or ascetic life
  taxonomy_refs:
  - initiation
  basis: Multiple figures or groups are initiated, admitted, received as Bhikshus,
    made ascetics, or become mendicants through the Buddha's touch, favor, command,
    or teaching context.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage presents a compressed list of conversions and ordinations;
    details of ritual procedure are brief except for initiation by touch in the first
    episode.
- id: motif:2
  label: Quest for and transmission of wisdom
  taxonomy_refs:
  - wisdom
  basis: Sabhya seeks the highest wisdom, Yasoda remembers former discourses and is
    made guru, the Kasyapa groups are endowed with spiritual knowledge, and Bimbisara
    is enlightened in right action.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:7
  - ev:8
  confidence: high
  cautions: The text states wisdom and spiritual knowledge directly but gives little
    doctrinal content in this passage.
- id: motif:3
  label: Reverent offering or blessing linked to spiritual transformation
  taxonomy_refs:
  - sacred_exchange
  basis: Svastika receives riches and becomes a mendicant and Arhat; King Divodasa
    and citizens receive material blessings; the boatman ferries the Gina, worships
    him, offers milk, and becomes a mendicant.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage does not explicitly frame all events as reciprocal exchange;
    some are blessings or favor rather than negotiated exchanges.
- id: motif:4
  label: Sacred travel through places of conversion
  taxonomy_refs: []
  basis: The Buddha proceeds to Kasi, dwells in forests, caves, and mountains, crosses
    the Ganges, and arrives at Uruvilva, with conversions or blessings occurring along
    the route.
  evidence_refs:
