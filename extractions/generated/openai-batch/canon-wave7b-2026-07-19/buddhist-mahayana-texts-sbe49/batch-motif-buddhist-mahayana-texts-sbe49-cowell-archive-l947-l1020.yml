canonical_text:
  quote: ''
  summary: After the sage Asita reveals the prince's fate to the troubled king, he
    departs by a wind-borne flight. Asita also instructs his younger sister's son
    to heed and ponder the sage's words. The king celebrates the birth of his son
    with birth-ceremonies, sacrifices to the gods, gifts of milk-giving cows to brahmans,
    and a ceremonial entry into the city with the queen and child. The passage closes
    with royal and civic rejoicing expressed through comparisons to Indra, Bhava/Siva,
    Karttikeya, Kuvera, and Nalakavara.
  language: English
  quote_policy: summarized
