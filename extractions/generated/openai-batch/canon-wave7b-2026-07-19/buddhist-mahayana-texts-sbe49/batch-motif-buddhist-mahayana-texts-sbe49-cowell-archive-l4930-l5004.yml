canonical_text:
  quote: ''
  summary: A monarch urges a prince not to leave his royal strength unused, to enjoy
    worldly pleasures in youth, to postpone religious practice until old age, or else
    to pursue ancestral sacrifices as a royal religious path to heaven. The monarch
    cites Indra and royal sages as precedents. The prince hears the exhortation but
    remains unmoved, compared to Mount Kailasa.
