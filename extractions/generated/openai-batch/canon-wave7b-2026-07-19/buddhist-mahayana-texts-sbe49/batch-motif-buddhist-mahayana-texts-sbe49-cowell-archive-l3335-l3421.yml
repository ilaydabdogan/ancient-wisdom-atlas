canonical_text:
  quote: ''
  summary: A radiant royal seeker enters a hermitage. Cows respond by giving milk,
    sages wonder whether he is a divine being, and the hermitage dwellers honor him.
    Seeking liberation, he observes ascetic penances and asks an ascetic to explain
    the practices and vows. A Brahman ascetic describes austere diets, oblations,
    water practices, and promised fruits such as heaven or human rebirth. The prince
    inwardly finds these painful practices insufficient because their fruit remains
    within changeable worlds.
  language: English
  quote_policy: summarized
