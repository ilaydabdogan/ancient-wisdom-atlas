canonical_text:
  quote: ''
  summary: The passage first describes the virtues, knowledge, generosity, purity,
    and inconceivable excellence of beings and Bodhisattvas in Amitabha's Buddha country.
    The Bhagavat instructs Ananda to face west, take flowers, and bow toward the quarter
    where Amitabha dwells and teaches the Law. Ananda asks to see Amitabha and his
    Bodhisattvas. Amitabha then emits a ray of light from his palm, illuminating many
    Buddha countries and allowing beings in this Buddha country to see Amitabha, his
    Bodhisattvas, and Sravakas. The passage compares Amitabha's visible splendor to
    Sumeru, king of mountains, and compares the visual dominance of the light to an
    earth entirely covered by ocean. Beings in Sukhavati also see the Saha world and
    Sakyamuni teaching the Law.
  language: English
  quote_policy: summarized
