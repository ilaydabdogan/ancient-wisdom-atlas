canonical_text:
  quote: ''
  summary: The attendant and horse return slowly from the forest without the prince.
    The horse grieves and refuses grass and water. Kapila city and its garden appear
    empty and gloomy in the prince’s absence. The citizens weep, accuse the attendant
    of stealing away the king’s son, hear his explanation that the prince abandoned
    him and the dress of a householder in the forest, and resolve to go after the
    prince because they do not wish to live without him.
  language: English
  quote_policy: summarized
