canonical_text:
  quote: "“This jewel of all good doctrines”"
  summary: The passage praises hearing, proclaiming, teaching, preserving, and worshipfully
    receiving the Law. It says that such acts bring pre-eminent or transcendent merit,
    splendour, and elevated status, especially when the good Law is abolished. It
    describes the doctrine as a jewel uttered by Buddhas for all beings and ends by
    instructing hearers to welcome the Law, keep it in mind, and worship the three
    jewels with faith.
  language: English
  quote_policy: quoted
