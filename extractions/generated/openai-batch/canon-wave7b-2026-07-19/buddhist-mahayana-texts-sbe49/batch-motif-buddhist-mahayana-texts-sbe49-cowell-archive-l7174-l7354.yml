canonical_text:
  quote: "“Motionless as one almost dead, he continued in meditation, remembering
    the former Buddhas”"
  summary: The Buddha/Tathagata remains absorbed in meditation while Thirst, Delight,
    and the three daughters or enchantresses of Namuci/Mara try to tempt or deceive
    him through threat, supplication, youthful beauty, and old age. Their beauty is
    lost through his power, they repent, and he restores them. Mara then appears disguised
    as a head of a family and offers kingship, family, sons, and heavenly lordship;
    the Buddha identifies and dismisses him. The Buddha sets out toward Varanasi to
    turn the wheel of the Law, while the Naga king Mucilinda warns of a seven-day
    storm and invites him to shelter.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Thirst addresses the meditating figure, accuses him of abandoning family and
    social duties, identifies herself as a power called Thirst, and threatens to seize
    and destroy his life if not worshipped.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The meditating figure remains motionless, continues in meditation, and remembers
    former Buddhas.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Delight names herself, says she fosters practicable delights, asks to be made
    a tutelary power, and the meditating figure remains tranquil despite flattery,
    threats, curses, or blessings.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The three retire together, consult, return in the appearance of youthful beauty,
    fold their hands reverently, and ask the Tathagata to receive them as religious
    mendicants at his refuge.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The three identify themselves as daughters of Namuci, say they have come from
    a golden city after abandoning household life, and say they wish to repress the
    teaching of their five hundred brothers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Tathagata keeps his eyes closed and remains absorbed in meditation, guided
    by conduct leading to Nirvana and remembering former Buddhas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The enchantresses adopt an older aspect and ask to be established in the Bauddha
    doctrine and in the doctrine of Nirvana that ends future births.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The meditating figure hears their words without anger, and the enchantresses
    become victims of old age through the manifestation of his divine power.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Seeing him in meditation, immovable like Mount Meru, the enchantresses turn
    away and cannot retain their beauty.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The daughters appeal to their father, called the lord of the world of Desire,
    to restore their forms; he says he cannot alter the effect of Buddha’s will and
    tells them to go to Buddha’s refuge.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The daughters bow at the Buddha’s feet in various guises, ask pardon for their
    transgression, are silently restored by the teacher’s will, worship and praise
    him, and return home joyfully.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Mara, lord of the world of Desire, takes the form of a head of a family and
    addresses the meditating figure from the sky.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Mara claims to have worshipped and blessed the Buddha previously and urges
    him to become a king Tathagata, return to royal station, honor family, delight
    Yasodhara, beget sons, and hold supreme lordship.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The All-wise one identifies the speaker as Mara, says a host like him could
    not harm him, declares Namuci vanquished, and states that he will turn the wheel
    of the Law in Varanasi.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Mara responds with a deep sigh, says he is crushed, and leaves despondent
    and companionless through the sky to his home.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The conqueror of Mara rises from the throne and sets out alone toward holy
    Varanasi.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: Clouds cover the heavens; the Naga king Mucilinda predicts seven days of storm,
