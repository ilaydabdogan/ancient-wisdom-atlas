canonical_text:
  quote: ''
  summary: 'The passage gives sequential instructions for meditating on Buddha Amitayus:
    first visualizing a jeweled lotus throne with towers, banners, rays, and transformations;
    then perceiving Amitayus, attendant bodhisattvas, and the jeweled Buddha country.
    It states that correct visualization purifies sins, assures birth in the World
    of Highest Happiness, and brings samadhi connected with remembrance of Buddha.
    It also describes the Excellent Law being heard through water, light, jewel-trees,
    and birds, with conformity to the Sutras as the test of valid perception.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Meditators are instructed first to form the perception of a lotus-flower on
    a ground of seven jewels, with jeweled leaves, veins, rays, pearls, and great
    measurements.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The envisioned setting includes a gem-built tower, four posts with jeweled
    banners, a jeweled veil, many rays, golden colors, and transformations into forms
    such as a diamond tower, a pearl net, and clouds of mixed flowers.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Buddha tells Ananda that the excellent flowers were originally created by
    the power of Bhikshu Dharmakara’s prayer.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The practitioner is told to fix the mind separately on details such as leaf,
    jewel, ray, tower, and banner, making them clear like the image of one’s own face
    in a mirror.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Achieving the perception of the flowery throne is said to expiate sins connected
    with births and deaths during fifty thousand kalpas and to assure birth in the
    World of Highest Happiness.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The next perception concerns Buddha himself; the passage states that every
    Buddha Tathagata has a spiritual body that may enter the minds of beings, and
    that the meditator’s mind becomes and is Buddha.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The practitioner is instructed to perceive an image of Buddha, Gambunada-gold
    in color, seated on the flower throne, whether the eyes are open or shut.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After seeing the seated figure, the practitioner’s mental vision becomes clear
    and the adornments of the Buddha country, including the jeweled ground, can be
    seen clearly.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The practitioner is instructed to perceive another great lotus-flower on Buddha’s
    left and another on Buddha’s right, with Bodhisattva Avalokitesvara on the left
    throne and Bodhisattva Mahasthama on the right throne.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The images of Buddha and the Bodhisattvas send forth brilliant rays that light
    all the jewel-trees with golden color.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Under every tree are three lotus-flowers, and on every lotus-flower is an
    image either of Buddha or of a Bodhisattva.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The devotee is instructed to hear the Excellent Law preached through a stream
    of water, a brilliant ray of light, jewel-trees, ducks, geese, and swans, both
    during and after meditation.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: What is heard must be remembered and must agree with the Sutras; disagreement
    is called an illusory perception, while agreement is called a rough perception
    of the World of Highest Happiness.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Practicing the eighth meditation is said to free one from sins connected with
    births and deaths for innumerable millions of kalpas and to grant samadhi due
    to remembrance of Buddha during the present life.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: After this perception, the next meditation is directed toward the bodily marks
    and light of Buddha Amitayus.
  category: sequence
  evidence_refs:
  - ev:10
