canonical_text:
  quote: ''
  summary: At the beginning of Book III, the prince hears of pleasant forests and
    city groves and resolves to go out. The king arranges a pleasure outing, removes
    visibly afflicted people from the road, and grants permission with evident affection.
    The prince descends from the palace, mounts a golden chariot with four horses,
    and proceeds along a decorated highway while citizens and women watch, praise,
    bow, and gather on rooftops.
