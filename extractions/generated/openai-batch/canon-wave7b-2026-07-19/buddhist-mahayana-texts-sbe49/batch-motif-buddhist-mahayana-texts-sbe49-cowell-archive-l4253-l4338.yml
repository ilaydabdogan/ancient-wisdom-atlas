canonical_text:
  quote: ''
  summary: 'The passage describes attendants locating the ornamentless but radiant
    prince seated beneath a tree. The family priest and counsellor approach, exchange
    honors with him, and the priest reports the king''s grief and arguments: the prince''s
    religious resolve is acknowledged, but he is urged to delay forest life, rule
    for a while, practice compassion, and recognize that liberation can also be attained
    in city and household life.'
  language: English
  quote_policy: summarized
