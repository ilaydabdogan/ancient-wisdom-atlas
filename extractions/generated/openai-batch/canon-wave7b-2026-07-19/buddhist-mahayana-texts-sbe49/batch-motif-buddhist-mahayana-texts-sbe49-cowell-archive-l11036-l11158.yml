canonical_text:
  quote: ''
  summary: Verses praise a Lord/Bhagavat whose light dispels darkness and surpasses
    celestial lights, then a prayer asks that the thousand-world sphere tremble and
    flowers descend if the vow succeeds. The signs occur, with earth tremor, flowers,
    sky-sounds, sandalwood powder, and a voice declaring future Buddhahood. The prose
    identifies Bhikshu Dharmakara as a noble-minded Bodhisattva perfected in prayers,
    reciting vows before Lokesvararaga and the world assembly, practicing Bodhisattva
    duties, ethical restraint, paramitas, beneficial speech, and establishing beings
    in enlightenment while honoring Buddhas.
  language: English
  quote_policy: summarized
