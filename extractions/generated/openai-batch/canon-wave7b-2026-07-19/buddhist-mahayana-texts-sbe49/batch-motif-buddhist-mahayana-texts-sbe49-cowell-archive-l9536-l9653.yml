canonical_text:
  quote: All things in the universe, therefore, are mind itself.
  summary: 'The passage expounds a Mind-only doctrine: subject-object phenomena arise
    through fallacious thinking; phenomena are classified as knowable and unknowable
    and as eight mental operations; the true essence of mind is pure, unchanging,
    and all-pervading; essence and phenomena are inseparable, illustrated by fire
    and by water and waves; ignorance leads beings to wander through birth and death,
    while true comprehension recognizes the causality of all things.'
  language: English
  quote_policy: quoted
