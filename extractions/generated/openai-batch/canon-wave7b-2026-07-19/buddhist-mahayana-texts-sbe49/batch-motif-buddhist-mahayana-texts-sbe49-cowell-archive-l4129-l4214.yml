  quote: ''
  summary: The king laments separation from his son and asks that he be taken to him
    or that the son be brought back. He invokes earlier royal and legendary examples
    of grief, death, and forest departure. A counsellor and family priest advise restraint,
    cite Asita's prior prediction, and offer to go after the son. The king orders
    them to go to the forest; they depart, while the king performs the remaining rites
    with his wives and queen.
