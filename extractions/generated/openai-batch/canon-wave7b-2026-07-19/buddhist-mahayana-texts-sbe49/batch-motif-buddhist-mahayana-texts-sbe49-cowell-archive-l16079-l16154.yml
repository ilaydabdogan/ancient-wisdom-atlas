canonical_text:
  quote: "“the idea of a self is no-idea”"
  summary: The passage describes future beings in the last 500 years of the decay
    of the good Law who learn, remember, recite, understand, and explain the treatise.
    It states that ideas of self, being, living being, person, and even idea/no-idea
    do not arise for them, because Buddhas are freed from all ideas. Bhagavat addresses
    Subhiti and says those not frightened when the Satra is recited are wondrous.
    He identifies the Paramaparamita as no-Paramita and says it was preached by immeasurable
    Buddhas. He recalls the king of Kalinga cutting his flesh from every limb while
    he had no idea of self and no malevolence, and remembers 500 past births as the
    rishi Kshantivadin. He instructs a Bodhisattva to raise the mind to highest perfect
    knowledge without dependence on sensory objects or dharmas, and to give gifts
    for all beings without belief in anything.
  language: English
  quote_policy: quoted
