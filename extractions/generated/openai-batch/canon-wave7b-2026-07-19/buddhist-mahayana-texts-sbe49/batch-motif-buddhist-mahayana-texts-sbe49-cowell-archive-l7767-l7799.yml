canonical_text:
  quote: ''
  summary: 'The omniscient lion of the Sakyas causes the assembled congregation, led
    by the company of Maitriya, to turn the wheel of the Law. He addresses the company
    and mendicants, saying his proclamation follows that of past arch-saints. He identifies
    two extremes in ascetic self-control: devotion to sensual joys and excessive self-inflicted
    mortification. He says these extremes are unworthy, useless, unrelated to true
    asceticism or deliverance, and not conducive to knowledge, wisdom, or Nirvana.'
  language: English
  quote_policy: summarized
