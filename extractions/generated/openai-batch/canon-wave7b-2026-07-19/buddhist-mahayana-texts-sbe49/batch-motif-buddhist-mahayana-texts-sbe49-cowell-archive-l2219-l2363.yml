canonical_text:
  quote: ''
  summary: A speaker urges the prince toward sensual enjoyment by citing sacred-tradition
    examples of sages and kings who pursued desire. The prince replies that worldly
    objects are transitory and that old age, disease, and death make sensual attachment
    unfit for the wise. He rejects guile, falsehood, and passion, describes the world
    as if burning and all beings as on the road to death, and gives a discourse against
    desire. At evening the women return with their efforts fruitless, the prince enters
    his dwelling pondering transitoriness, and the king and ministers are distressed
    that they cannot restrain his purpose by pleasures.
  language: English
  quote_policy: summarized
