    Madri, and Kardélaganaka with a Brahman's daughter.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker tells the prince that, as a young man with strength and beauty,
    he is despising enjoyments that rightly belong to him and to which the world is
    devoted.
  category: speech
  evidence_refs:
