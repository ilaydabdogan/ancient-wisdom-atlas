canonical_text:
  quote: ''
  summary: The passage introduces Aśvaghoṣa’s Buddha-carita as an early Sanskrit poem
    on the legendary history of Buddha, discusses its authorship, translations, missing
    and supplemented books, hymns to Buddha and three holy beings, and describes several
    proposed literary parallels with later Sanskrit works, including scenes of public
    viewing, temptation, and nocturnal palace observation before Buddha’s departure
    from home.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Buddha-carita is described as an early Sanskrit poem written in India
    on the legendary history of Buddha.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The poem is ascribed to Aśvaghoṣa, who is presented as probably a contemporary
    and spiritual adviser of Kanishka; Hiouen Thsang is said to list him with Deva,
    Nāgārjuna, and Kumāralabdha as four suns illuminating the world.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: I-tsing is reported to say that Aśvaghoṣa composed the Buddha-carita-kāvya
    and hymns in honour of Buddha, Amitābha, Avalokiteśvara, and Mahāsthāma, which
    were chanted at monastery evening service.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Tibetan and Chinese versions are described as consisting of twenty-eight
    chapters and carrying Buddha’s life to his entrance into Nirvāṇa and the subsequent
    division of sacred relics.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Only thirteen books of the Sanskrit poem are said to claim Aśvaghoṣa’s authorship;
    the last four are described as a modern Nepalese author’s attempt to supply the
    lost original.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Amṛtānanda is said to have made four cantos after searching for the missing
    ones and not finding them; the passage dates this supplement to 950 of the Nepalese
    era, corresponding to 1830 A.D.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The editor compares a Raghuvaṃśa scene of city ladies crowding to see Prince
    Aja after Princess Bhogya has chosen him with an episode in the third book of
    the Buddha-carita.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The editor compares Kāma’s assault on Śiva in the Kumārasambhava with Māra’s
    temptation of Buddha in the thirteenth book of the Buddha-carita.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The editor compares a Rāmāyaṇa scene in which Hanumat enters Rāvaṇa’s palace
    by night and sees Rāvaṇa’s wives asleep with a Buddha-carita scene in which Buddha,
    on the night of leaving home forever, sees an unconscious sight in his own palace.
  category: relationship
  evidence_refs:
  - ev:7
