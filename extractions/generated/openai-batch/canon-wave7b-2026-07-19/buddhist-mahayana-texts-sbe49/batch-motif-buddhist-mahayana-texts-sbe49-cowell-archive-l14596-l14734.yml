canonical_text:
  quote: ''
  summary: 'The passage describes excellences of a Buddha country: heavenly music,
    golden earth, repeated Mandarava flower-rain, residents who travel to other worlds
    to worship many Buddhas and return, birds and wind-stirred palm-trees and bells
    whose sounds proclaim the Law and prompt remembrance or reflection on Buddha,
    the Law, and the Church. It states that lower realms are unknown there, that the
    birds were made by Amitayus to utter the Law, and explains the names Amitayus
    and Amitabha by immeasurable life and unimpeded splendour.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Buddha country, heavenly musical instruments are always played, the
    earth is lovely and golden, and heavenly Mandarava blossoms rain down three times
    by day and three times by night.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Beings born there go to other worlds before their morning meal, worship a
    hundred thousand kotis of Buddhas, shower flowers on each Tathagata, and return
    to their own world in time for the afternoon rest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Swans, curlews, and peacocks in that Buddha country come together three times
    every night and three times every day and perform a concert, each uttering its
    own note.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The birds' sound proclaims the five virtues, the five powers, and the seven
    steps toward the highest knowledge; when the men hear it, remembrance of Buddha,
    the Law, and the Church arises in their minds.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage denies that the birds are beings reborn into animal nature, says
    the names of hells, animal descent, and Yama's realm are unknown there, and says
    the birds were made by the Tathagata Amitayus to utter the sound of the Law.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Rows of palm-trees and strings of bells moved by the wind produce a sweet
    and enrapturing sound, and when the men hear it, reflection on Buddha, the Law,
    and the Church arises in them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Tathagata is called Amitayus because his life and the lives of the men
    there are immeasurable, and ten kalpas have passed since he awoke to perfect knowledge.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Tathagata is called Amitabha because his splendour is unimpeded over all
    Buddha countries.
  category: attribute
  evidence_refs:
  - ev:8
