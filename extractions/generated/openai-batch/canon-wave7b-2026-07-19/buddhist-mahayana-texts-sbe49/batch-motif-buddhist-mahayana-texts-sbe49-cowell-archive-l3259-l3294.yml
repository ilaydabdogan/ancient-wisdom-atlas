  quote: '"regardless of his kingdom," he was "going to the ascetic-wood"'
  summary: A prince exchanges his fine white garment for a sylvan garment from a hunter,
    who then reveals a heavenly form and goes to heaven. The prince honors the new
    garment, dismisses the weeping Aamda, and proceeds toward a hermitage and ascetic
