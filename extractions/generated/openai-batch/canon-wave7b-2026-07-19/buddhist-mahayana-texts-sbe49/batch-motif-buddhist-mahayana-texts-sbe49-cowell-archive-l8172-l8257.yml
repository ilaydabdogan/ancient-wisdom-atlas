canonical_text:
  quote: ''
  summary: The passage continues a hymn-like enumeration of the Buddha/Tathagata's
    qualities and titles, presenting him as sovereign, teacher, knower, destroyer
    of Mara's pride and evil ways, reliever of pain, and guide on the road of wisdom
    toward Nirvaza. It identifies this as a concise declaration connected with the
    turning of the wheel of the Law, says the Buddha's virtues and knowledge are endless,
    instructs hearers to welcome, proclaim, and hand on the Mahayana arrangement of
    the Law, and promises eight preeminent perfections to those who hear, see, welcome,
    and honor it.
  language: English
  quote_policy: summarized
