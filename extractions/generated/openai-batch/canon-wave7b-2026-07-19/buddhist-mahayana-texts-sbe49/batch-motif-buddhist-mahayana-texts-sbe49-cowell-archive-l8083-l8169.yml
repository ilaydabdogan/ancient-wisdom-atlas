canonical_text:
  quote: ''
  summary: 'The passage describes conditioned phenomena as delusion-like and non-eternal,
    expounds the wheel of the Law as beyond ordinary categories and senses, and presents
    the Buddha as the one who turns that wheel. It lists titles and functions of the
    Buddha: self-existent knower, lord and teacher of Law, guide of beings who have
    lost their way, leader through mundane existence, victor, releaser, light of the
    world, dispeller of ignorance, healer, and possessor of distinctive marks.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Things subject to successive causation are compared to delusion, mirage, dream,
    the moon seen in water, and an echo, and are described as not eternal.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wheel of the Law is described as extirpating false doctrines, pure like
    ether, without doubt, bright, without end or middle, and apart from assertions
    of existence or non-existence and soul or soullessness.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wheel of the Law is described as apart from the powers of eye, hearing,
    smell, tongue, touch, and mind, and the speaker says that it has been turned by
    him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Buddha is said to make the ignorant wise and to have ascertained knowledge
    of the laws of reality by himself.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Buddha is called self-existent because he is apart from teaching by another,
    and lord of Law because all laws are under his control.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Buddha is said to know right and wrong in laws, to teach innumerable beings
    according to their fitness, and to point out good paths to beings who have lost
    their way.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: The Buddha is said to have passed through the forest of mundane existence
    and is called the Leader of the Caravan, Jina, master-giver of the Law, teacher,
    master of the Law, and lord of the world.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Buddha is described as one who has offered the sacrifice, fulfilled his
    hope, achieved success, come out from conflict, released himself, and become the
    releaser of all.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Buddha is described as the light of the world, dispeller of the darkness
    of ignorance, illuminer of the great torch, great physician, great seer, healer
    of evils, and extractor of the barb of evil from the wounded.
  category: attribute
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: The Buddha is described as possessed of all distinctive marks and signs, with
    body and limbs every way perfect.
  category: attribute
  evidence_refs:
  - ev:9
