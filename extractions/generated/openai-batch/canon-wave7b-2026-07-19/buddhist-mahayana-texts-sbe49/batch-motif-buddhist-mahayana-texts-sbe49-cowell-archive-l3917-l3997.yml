  text: The queen says her grief would have been less if the horse had neighed, struck
    the ground with its hoofs, or made noise with its jaws to wake the people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Khamdaka answers the queen with his face bent down, low tearful voice, and
    hands clasped, telling her not to blame Kamthaka or him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Khamdaka says the prince, called a god among men, went away like a god, and
    that divine powers compelled Khamdaka to bring the swift steed and follow him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
