canonical_text:
  quote: ''
  summary: 'A queen laments that the horse did not alert the people when the prince
    departed. Khamdaka answers tearfully that neither he nor Kamthaka acted by choice:
    divine powers and fate enabled the prince''s night departure, with a silent horse,
    a self-opening gate, sleeping guards, a heavenly hermit''s garment, a removed
    tiara, and gods as retinue. The women react with wonder and renewed grief at the
    prince becoming an ascetic; Gautamt, as printed, laments the prince''s hair and
    royal qualities.'
  language: English
  quote_policy: summarized
