canonical_text:
  quote: ''
  summary: 'Concluding sections of the Smaller Sukhavati-vyuha: the Buddha explains
    that hearing and retaining the names of blessed Buddhas brings their favour and
    non-return once transcendent true knowledge is possessed. Faithful sons and daughters
    are urged to make mental prayer for Amitayus''s Buddha country, where they will
    be born. Sakyamuni describes the difficulty of teaching the Law in the corrupt
    Sahā world, and the assembly applauds. Editorial notes compare the directional
    Buddha lists with the Lalita-vistara and discuss Mahayana/Vaipulya classification.'
  language: English
  quote_policy: summarized
