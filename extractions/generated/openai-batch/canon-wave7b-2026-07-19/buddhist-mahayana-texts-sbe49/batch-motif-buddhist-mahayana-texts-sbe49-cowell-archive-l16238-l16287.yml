canonical_text:
  quote: ''
  summary: The passage states that beings who learn, remember, recite, understand,
    internalize, and explain these Sutras will have former evil deeds destroyed after
    seeing the Law and will obtain the knowledge of Buddha. The speaker recalls immense
    past merit connected with many Buddhas after Dipankara, but says the merit of
    future people who preserve and explain these Sutras in the last 500 years during
    the decay of the good Law surpasses that former merit beyond calculation. The
    passage concludes that the treatise and its rewards are incomprehensible and incomparable.
  language: English
  quote_policy: summarized
