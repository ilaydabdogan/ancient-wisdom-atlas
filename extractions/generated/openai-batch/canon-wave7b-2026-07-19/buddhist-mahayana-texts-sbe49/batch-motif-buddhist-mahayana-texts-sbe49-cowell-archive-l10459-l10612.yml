canonical_text:
  quote: ''
  summary: Dharmakara declares vows of worship, light, prayer, and aspiration toward
    highest perfect knowledge. He asks the Tathagata Lokesvararaga to teach the Law
    and the qualities of Buddha countries. Lokesvararaga teaches the qualities of
    many Buddha countries, after which Dharmakara concentrates those qualities into
    one Buddha country and composes an excellent prayer. He then begins vows that
    his Buddha country will lack hell, animal existence, departed spirits, and Asuras;
    that beings born there will not fall into those states; and that beings there
    will be golden in colour.
  language: English
  quote_policy: summarized
