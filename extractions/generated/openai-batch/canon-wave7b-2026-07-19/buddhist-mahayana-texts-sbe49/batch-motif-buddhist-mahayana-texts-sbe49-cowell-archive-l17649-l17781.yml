canonical_text:
  quote: ''
  summary: 'Buddha gives instructions for sequential meditations: first, fixing perception
    on the western setting sun; second, perceiving water, ice, lapis lazuli ground,
    jeweled supports, rays, a radiant tower, banners, instruments, breezes, and doctrinal
    sounds; third, stabilizing the perception of the Land of Highest Happiness. He
    tells Ananda to preserve and transmit the teaching, states that meditation on
    the land expiates sins and leads to birth in the pure land, and then begins instructions
    for meditating on seven rows of jewel-trees with jeweled leaves, rays, nets, palaces,
    and heavenly children.'
  language: English
  quote_policy: summarized
