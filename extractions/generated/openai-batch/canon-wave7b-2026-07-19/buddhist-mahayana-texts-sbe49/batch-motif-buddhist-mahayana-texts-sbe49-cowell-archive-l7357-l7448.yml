canonical_text:
  quote: ''
  summary: After a Naga king protects the Buddha from storm and darkness with his
    hood, the Buddha moves through several sites of meditation. A fig-tree deity explains
    that he planted and fostered the tree in a former human birth and asks the Buddha
    to stay there seven days. The Buddha meditates beneath trees, receives offerings
    from merchants and deities, grants blessings, relics, and prophecies, joins four
    bowls into one, plants a Haritaki seed that grows into a tree, and the resulting
    tree is reverentially tended by gods, humans, and demons. A divine woman named
    Bhadrika, formerly a cow, comes from heaven after hearing of the seed.
  language: English
  quote_policy: summarized
