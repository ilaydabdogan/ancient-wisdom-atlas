- id: obs:2
  text: After seven days, the Naga pays homage, departs, and the Buddha proceeds to
    a riverbank near a forest described as connected with goat-herds.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At night, a deity named after the Indian fig-tree approaches the Buddha, illuminates
    the place, folds his hands, and addresses him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fig-tree deity says he planted the fig-tree when formerly born as a man
    named Buddha and fostered it like the Bodhi tree in hope of deliverance from evil.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The fig-tree deity says that by the merit of that action he was born in heaven
    and asks the Buddha to dwell there seven days.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Buddha accepts the request, stays under the fig-tree for seven days, remains
    absorbed in contemplation, and is compared to a full moon spreading light.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Buddha later sits at the foot of a palm in a forest of Datura trees and
    continues weeks of meditation, pondering, fasting, and desiring the salvation
    of the world.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Two wealthy merchants, Trapusha and Bhallika, from Uttara Utkala journey with
