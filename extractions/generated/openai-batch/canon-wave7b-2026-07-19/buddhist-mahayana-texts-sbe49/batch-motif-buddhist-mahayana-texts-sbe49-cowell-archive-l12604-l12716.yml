canonical_text:
  quote: ''
  summary: The passage describes Bodhisattvas or beings associated with Sukhavati
    who, because of doubt, dwell in lotus calyxes and are temporarily deprived of
    seeing Buddhas, hearing and practicing the Law, and gathering merit. The Bhagavat
    warns Agita about the harm caused by doubt and urges Bodhisattvas to direct their
    merit toward birth in Sukhavati, where Amitabha dwells. Agita asks whether Bodhisattvas
    from this and other Buddha countries will be born there, and the Bhagavat enumerates
    vast numbers of Bodhisattvas proceeding from many named Tathagatas' places to
    Sukhavati to see, worship, question, and consult Amitabha.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some beings are described as connected with Sukhavati through hearing the
    Buddha's name and through serenity of thought, but they dwell in the calyx of
    lotus flowers rather than appearing cross-legged in lotus flowers as miraculously
    born.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says they have ideas of palaces and gardens and that there is
    no discharge, phlegm, mucus, or anything disagreeable to the mind.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: For five hundred years they are deprived of seeing Buddhas, hearing the Law,
    seeing Bodhisattvas, discussing or ascertaining the Law, gathering new merit,
    and practicing the Law.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: They do not rejoice or perceive satisfaction; they wish to remove one another,
    step out behind, and the direction of their exit is said to be unknown.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Bhagavat says that the fault of doubt destroys the opportunity for many
    worshippings of Buddhas and the amassing of vast stocks of merit.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Agita is told that Bodhisattvas should raise their thoughts toward Bodhi and
    turn their stock of merit toward being born in Sukhavati, where Amitabha dwells.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Agita asks whether Bodhisattvas who have gone away from this Buddha country
    or from the sides of other Buddhas will be born in Sukhavati.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Bhagavat answers that seventy-two niyutas of kotis of Bodhisattvas have
    gone away from this Buddha country and will be born in Sukhavati, never returning
    because of accumulated merit.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Bhagavat enumerates large numbers of Bodhisattvas who will be born in
    Sukhavati from the places of many named Tathagatas.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Some Bodhisattvas proceed to Sukhavati in order to see Amitabha, bow before
    him, worship him, ask him questions, and consult him; the Bhagavat says the list
    of source Tathagatas could not be exhausted even over vast kalpas.
  category: action
  evidence_refs:
  - ev:7
