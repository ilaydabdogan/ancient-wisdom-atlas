canonical_text:
  quote: ''
  summary: 'The Bhagavat describes beings in a Buddha country to Ananda: Sravakas
    and Bodhisattvas possess light, with Avalokitesvara and Mahdsthamaprapta especially
    illuminating the world. Bodhisattvas born there have marks, wisdom, protected
    progress toward Bodhi, memory of former births, the ability to visit and worship
    many Buddhas, thought-produced offerings, flower umbrellas in the sky, return
    to Sukhavati, and recitation of the Law.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In that Buddha country, Sravakas possess light of a fathom, while Bodhisattvas
    possess much greater light; two Bodhisattvas are singled out as making the world
    shine with eternal splendour.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ananda asks the names of the two noble-minded Bodhisattvas, and the Bhagavat
    names Avalokitesvara and Mahdsthamaprapta, saying they were born there after leaving
    this Buddha country.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bodhisattvas born in that Buddha country are described as having the thirty-two
    marks of a great man, perfect members, skill in meditation and wisdom, strong
    and restrained faculties, patience, and boundless good qualities.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bodhisattvas born there are said not to be deprived of the sight of Buddha,
    not to fall to evil states until Bodhi, and not to forget former births, with
    an exception described for those devoted to a former place during corrupt kalpas.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: During one morning meal, these Bodhisattvas go to another world and worship
    many Buddhas as they like through the favour of Buddha.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: When they consider worship materials such as flowers, incense, lamps, garlands,
    umbrellas, flags, banners, music, and musical instruments, those materials arise
    on their hands.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Heavenly flowers of different colours and scents are produced on their hands
    as soon as they think of them, and they repeatedly shower such flowers upon the
    Buddhas.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Thrown handfuls of flowers appear in the sky as umbrellas of flowers, ranging
    from ten yojanas to as much as a hundred thousand yojanas in circumference, and
    earlier flower umbrellas do not fall when later ones are thrown.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After worshipping many Buddhas and ripening good works, the Bodhisattvas return
    to the world Sukhavati in one morning, associated with Amitayus's former prayers,
    former hearing of the Law, former good works, and a well-ordered mind.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Beings born in that Buddha country recite the story of the Law, which is accompanied
    by omniscience.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: A note reports parallel translations in which the two Bodhisattvas practiced
    Bodhisattva discipline in this country or came from the world Saha after life
    was exhausted, and were born in that Buddha country.
  category: other
  evidence_refs:
  - ev:9
