canonical_text:
  quote: "“there is no idea of others, no idea of self, no idea of inequality, no
    strife”"
  summary: The passage describes beings born in the Buddha country Sukhavati as free
    from property, self-other distinctions, desire, conflict, attachment, impurity,
    and doubt. They attain superior forms of vision and perfect wisdom, know and explain
    causes and the Law, and are praised through a long sequence of comparisons to
    mountains, ocean, elements, celestial bodies, animals, trees, flowers, and mythic
    or royal figures.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Buddha country is described as lacking any idea of property.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those going and walking in the Buddha country are said to feel neither pleasure
    nor pain, and their stepping forward is described in relation to the absence of
    desire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Beings born in Sukhavati are described as having no idea of others, self,
    or inequality, and as lacking strife, dispute, and opposition.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The beings are described as full of equanimity, benevolent, tender, affectionate,
    useful, serene, firm, unbiased, undisturbed, and disciplined thoughts directed
    toward transcendent wisdom.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Their wisdom and knowledge are compared to the ocean and to Mount Meru, and
    they are said to delight in the music of the Bodhyangas and Buddha.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: They discard the eye of flesh, assume the heavenly eye, approach the eye of
    wisdom, reach the eye of the Law, produce and exhibit the eye of Buddha, and attain
    perfect wisdom.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: They are described as subdued and calm in thought, perceptive of causes, skilled
    in explaining causes, and endowed with power to explain the Law or things as they
    really are.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: They are described as detached, free from cares and pain, free from impurity,
    intent on profound laws, possessing the path of one vehicle, free from doubt,
    and knowing the thoughts of others.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Their knowledge, thought, wisdom-light, purity, patience, cleansing of sin,
    and burning of pride are compared respectively with Sumeru, ocean, sun and moon,
    molten gold, earth, water, and fire.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Their non-clinging, pervasiveness, untaintedness, proclamation of the Law,
    showering of the Law, power, restraint, training, fearlessness, and protection
    of beings are compared with wind, ether, lotuses, cloud, rain, bulls, elephants,
    horses, lion, and the Nyagrodha fig-tree.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Their stability, unlimited love, precedence in the Law, non-dwelling in what
    is accumulated, scattering of calumniators, rarity, and calm senses are compared
    with Sumeru, sky, great Brahman, birds, Garuda, Udumbara flowers, and elephants.
  category: relationship
  evidence_refs:
  - ev:5
