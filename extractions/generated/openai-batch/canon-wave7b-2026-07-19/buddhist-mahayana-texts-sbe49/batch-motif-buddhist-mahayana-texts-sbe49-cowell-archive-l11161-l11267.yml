canonical_text:
  quote: ''
  summary: The passage describes Dharmakara during Bodhisattva practice as emitting
    fragrances and producing ornaments, offerings, food, and enjoyments from his body.
    Ananda asks the Bhagavat whether Dharmakara has passed into Nirvana, is not yet
    enlightened, or now lives and teaches. The Bhagavat replies that the enlightened
    Tathagata Amitabha dwells and teaches in the western Buddha country Sukhavati,
    surrounded by Bodhisattvas and worshipped by Sravakas. Amitabha's immeasurable
    light illuminates vast numbers of Buddha countries in all directions and brings
    bodily and mental happiness to many classes of beings.
  language: English
  quote_policy: summarized
