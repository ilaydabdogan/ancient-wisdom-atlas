canonical_text:
  quote: I have entered the ascetic-wood to destroy old age and death
  summary: A heroic renouncer dismisses his companion with the horse, ornaments, and
    a jewel for the king, explaining that he has gone to the ascetic wood to overcome
    old age and death. The companion answers with grief, invoking the king, the second
    mother, the queen, the young son of Yasodhara, and his own dependence. The hero
    replies that separation, change, and death are inevitable.
  language: English
  quote_policy: quoted
