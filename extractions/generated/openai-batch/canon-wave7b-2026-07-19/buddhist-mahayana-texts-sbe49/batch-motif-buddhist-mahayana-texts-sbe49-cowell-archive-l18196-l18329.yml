canonical_text:
  quote: ''
  summary: Buddha instructs Ananda and Vaidehi on meditations involving Avalokitesvara,
    Mahasthama, Sukhavati, and Buddha Amitayus. The passage describes luminous bodily
    signs, crowns, jewels, lotus flowers, quaking Buddha countries, assemblies of
    Buddhas and Bodhisattvas, imagined birth in the western World of Highest Happiness,
    and meditation on an image of Amitayus seated on a lotus in lake water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Buddha tells Ananda that meditation on Bodhisattva Avalokitesvara prevents
    calamity, removes karmic obstacles, expiates sins, and brings immeasurable happiness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The meditator is instructed to contemplate Avalokitesvara’s turban, heavenly
    crown, and other signs in order, clearly and distinctly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bodhisattva Mahasthama is described as equal in bodily signs, height, and
    size to Avalokitesvara, with a halo and rays extending across vast distances and
    the ten quarters.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Seeing a ray from a single hair root of Mahasthama is said to disclose the
    rays of innumerable Buddhas of the ten quarters.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mahasthama is called Unlimited Light and Bodhisattva of Great Strength because
    his light of wisdom shines over beings, removes them from the three paths of existence,
    and gives highest power.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Mahasthama’s crown contains five hundred jewel-flowers; each jewel-flower
    contains five hundred jewel-towers showing pure Buddha countries, and his turban
    bears a jewel-pitcher filled with brilliant rays.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: When Mahasthama walks, regions of the ten quarters tremble, and jewel-flowers
    appear wherever the earth quakes, resembling Sukhavati.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: When Mahasthama sits, countries of seven jewels tremble; incarnate Amitayus
    figures and incarnate Bodhisattvas assemble in Sukhavati on lotus thrones and
    preach the Law for suffering beings.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Practicing this meditation frees practitioners from sins for innumerable kalpas
    and gives access to excellent Buddha countries without living in an embryo state.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Twelfth Meditation instructs the practitioner to imagine being born in
    the western World of Highest Happiness, seated cross-legged on a lotus-flower
    that closes and then unfolds.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: After the lotus unfolds, colored rays shine over the practitioner, the eyes
    open to Buddhas and Bodhisattvas filling the sky, and the practitioner hears waters,
    trees, birds, and Buddhas preaching the Law.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Buddha tells Ananda and Vaidehi that those wishing to be born in the western
    land should meditate on an image of Buddha sixteen cubits high, seated on a lotus-flower
    in lake water.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The real body and measurement of Amitayus are said to be unlimited and incomprehensible
    to ordinary thought, but remembrance of him is made effective by the Tathagata’s
    ancient prayer.
  category: attribute
  evidence_refs:
  - ev:13
