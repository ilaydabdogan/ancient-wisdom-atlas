    of rags hanging from a bough and asks the Buddha to accept it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Teacher blesses Bhadrika by saying that through further development of
    merit she will become a Bodhisattva, and he accepts the rags.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gods in the sky respond to the tattered rags with wonder and throw down garments
    of heavenly silk.
  category: action
  evidence_refs:
  - ev:2
