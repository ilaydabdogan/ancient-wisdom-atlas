  text: The Buddha refuses the heavenly silk garments, saying they are not fit for
    a religious mendicant and regarding them as suitable for imperial pomp and household
    luxury.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Buddha asks for a stone slab and water to wash away dirt; Sakra digs out
    a great river full of water, and four Maharajas bring four stones.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: One stone is used for sitting, one for washing, one for drying, and one is
    flung into the sky, where it reaches a blazing city and astonishes the worlds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Trapusha and Bhallika build a Kaitya called Silagarbha; local ascetics worship
