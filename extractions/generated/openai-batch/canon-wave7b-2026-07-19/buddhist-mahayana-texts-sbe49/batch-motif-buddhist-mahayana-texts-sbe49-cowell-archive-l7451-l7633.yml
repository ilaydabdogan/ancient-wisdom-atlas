canonical_text:
  quote: ''
  summary: A heavenly daughter named Bhadrika offers the Buddha a rag garment, which
    he accepts after blessing her future Bodhisattva status. Celestial silk garments
    are rejected as unsuitable for a mendicant. Sakra creates a river and the four
    Maharajas bring stones for washing the rags; one stone is thrown into the sky,
    and the others become the focus of a shrine and sacred river cult. The Buddha
    then contemplates whether to teach the profound Law, emits light, receives requests
    from gods to turn the wheel of the Law, resolves to teach first at Varanasi in
    the Deer Park, and journeys toward Kasi, blessing various beings. At the Ganges
    he refuses the ferryman’s fee requirement by passing through the sky, after which
    Bimbisara abolishes ferry fees for ascetics. He enters Varanasi illuminating the
    city.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
