candidate_motifs:
- id: motif:1
  label: Meritorious sacred exchange
  taxonomy_refs:
  - sacred_exchange
  basis: The rag garment offering is accepted and linked to Bhadrika’s future Bodhisattva
    status; worship at the holy river and Kaitya is said to lead to Bodhisattva status
    and Nirvana; journey hosts and worshippers receive blessings.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage frames these exchanges through Buddhist merit and blessing;
    the taxonomy label is broad.
- id: motif:2
  label: Profound wisdom proclaimed for world-deliverance
  taxonomy_refs:
  - wisdom
  basis: The Buddha reflects on profound wisdom, decides to proclaim the Law to deliver
    the world, and is asked to turn the wheel of the Law.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage presents this as Buddhist teaching activity rather than a
    generic wisdom-test narrative.
- id: motif:3
  label: Supernatural sky passage
  taxonomy_refs:
  - ascent
  basis: A stone is flung upward and reaches a blazing city, and the Buddha later
    goes through the sky across the Ganges when unable to pay the ferry fee.
  evidence_refs:
  - ev:3
  - ev:10
  confidence: medium
  cautions: The sky movement is literal in the passage, but it is not described as
    a full ascent to a heavenly realm.
- id: motif:4
  label: Departure to the first teaching place
  taxonomy_refs:
  - departure
  basis: After resolving to teach, the Buddha identifies Varanasi in the Deer Park
    as the site for turning the wheel of the Law and sets out joyfully to Kasi.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: This is a post-enlightenment teaching journey, not a departure from home
    or exile.
- id: motif:5
  label: Sacred water and purifying river
  taxonomy_refs: []
  basis: Water is created for washing dirt from the rags, becomes a widely known Holy
    River, and bathing and worship there are said to produce Bodhisattva status and
    Nirvana.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: No exact motif-family taxonomy item for sacred or purifying water is supplied,
    so no taxonomy reference is assigned.
