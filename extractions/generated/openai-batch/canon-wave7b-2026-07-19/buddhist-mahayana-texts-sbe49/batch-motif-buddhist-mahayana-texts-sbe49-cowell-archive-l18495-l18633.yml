canonical_text:
  quote: ''
  summary: The passage describes several graded classes of beings seeking birth in
    the western World or Country of Highest Happiness. At death they are met by Amitayus,
    attendants, created Buddhas, a heavenly voice, or a learned teacher; they are
    placed on lotus-flowers, born in a jewel-lake or Pure Land, hear the Law, and
    attain progressive spiritual fruits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One class, the lowest form of the highest grade, believes in cause and effect,
    does not slander the Mahayana doctrine, cherishes the thought of highest Bodhi,
    and seeks birth in the Country of Highest Happiness.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the death of that class of devotee, Amitayus appears with Aval., Mahas.,
    and dependents, offers a golden lotus-flower, and miraculously creates five hundred
    Buddhas to meet and praise the devotee.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The devotee sees himself seated on the golden lotus-flower; the flower closes,
    he follows the World-Honoured One, is born in the lake of seven jewels, and the
    flower later unfolds.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the lotus unfolds, the devotee sees Buddha’s body, hears voices preaching
    the Law, travels through the ten quarters to worship Buddhas, learns the deepest
    significance of the Law, and eventually reaches a Bodhisattva stage.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The highest form of the middle grade consists of persons who observe prohibitive
    and moral precepts, avoid the five deadly sins and harm to beings, and seek birth
    in the western World of Highest Happiness.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: For the highest form of the middle grade, Amitayus appears with Bhikshus and
    dependents, emits golden rays, preaches doctrines such as suffering, impermanence,
    and non-self, and praises homelessness.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: That believer rejoices, is seated on a lotus-flower, kneels with folded hands
    in homage, reaches the Country of Highest Happiness, hears praise of the Four
    Noble Truths, and attains Arhatship with further faculties and emancipations.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The middle form of the middle grade includes persons who observe specified
    precepts for one day and one night, or observe novice or perfect moral precepts,
    and seek birth in the Country of Highest Happiness.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: For the middle form of the middle grade, Amitayus appears with retinue and
    golden rays, offers a lotus-flower of seven jewels, and a voice in the sky praises
    the newcomer’s obedience to the Buddhas’ teachings.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The newcomer is seated on the lotus-flower, the flower folds around him, he
    is born in the jewel-lake, the flower unfolds after seven days, and after hearing
    the Law he attains Srota-apanna and later becomes an Arhat.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The lowest form of the middle grade includes sons or daughters of a noble
    family who are filial to parents, support them, and exercise benevolence and compassion.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: At death, such persons meet a good and learned teacher who describes the happiness
    of Amitayus’s Buddha country and explains the forty-eight prayers of Bhikshu Dharmakara;
    after hearing this, they die and are born quickly in the western World of Highest
    Happiness.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage names the perception of the three classes in the superior grade
    as the Fourteenth Meditation.
  category: other
  evidence_refs:
  - ev:10
