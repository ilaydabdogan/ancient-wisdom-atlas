canonical_text:
  quote: ''
  summary: In this Diamond-Cutter passage, Bhagavat/Tathagata questions Subhuti about
    preaching, dust, world-spheres, and the thirty-two signs. Subhuti answers with
    formulas in which named things are said to be no-thing of that name. Bhagavat
    then compares repeated life-sacrifice over Ganga-sand kalpas with teaching a single
    four-line gatha from the Law, saying the latter yields greater merit. Subhuti
    is moved to tears, praises the teaching, and speaks of knowledge, Bodhisattvas
    who hear the Sutra, and the phrase that a true idea is not a true idea.
  language: English
  quote_policy: summarized
