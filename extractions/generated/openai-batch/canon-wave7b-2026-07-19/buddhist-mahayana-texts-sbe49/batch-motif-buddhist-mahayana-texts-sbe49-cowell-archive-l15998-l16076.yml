  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Subhuti says a holy and fully enlightened Tathagata is not to be known by
    the thirty-two signs of a hero, because those signs were preached as no-signs.
  category: attribute
  evidence_refs:
