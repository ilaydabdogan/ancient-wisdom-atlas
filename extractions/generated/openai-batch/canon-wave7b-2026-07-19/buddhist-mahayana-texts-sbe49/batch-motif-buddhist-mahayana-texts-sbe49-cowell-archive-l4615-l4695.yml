canonical_text:
  quote: ''
  summary: A minister argues that returning from hermitage or forest to home or royal
    duty is not sinful, citing Rama, Drumeksha, and Samkriti Amtideva. The king's
    son replies that truth cannot be settled by another's words, that good should
    be chosen under uncertainty, and that only faultless trustworthy speech is authoritative.
    He rejects the cited examples as authorities because they broke vows, declares
    he will not return home without knowledge of the truth, says he would enter blazing
    fire rather than his house with his purpose unfulfilled, and departs while the
    minister and Brahman weep and follow for a while.
  language: English
  quote_policy: summarized
