canonical_text:
  quote: ''
  summary: 'The prince departs from his father’s city by night or dawn. Supernatural
    beings assist: Yakshas support the horse’s hoofs, gates open by themselves, courtly
    divine troops rejoice, gods wish success, and bright heavenly beings light the
    path. The prince renounces family, people, and magnificence, vows not to return
    until he has seen the further shore of birth and death, and rides away on his
    horse.'
