canonical_text:
  quote: ''
  summary: The passage presents a dialogue between Bhagavat and Subhuti on Bodhisattvas,
    worlds, non-self, the Tathagata's five eyes, innumerable Ganga-sand worlds, the
    knowing of beings' thoughts, merit from giving seven treasures, the Tathagata
    not being knowable by bodily form or signs, the non-perceptibility of teaching
    the Law, and future beings during the decay of the good Law.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhagavat says that a Bodhisattva who claims to create numbers of worlds would
    speak untruth, because numbers of worlds were taught as no-numbers and therefore
    are called numbers of worlds.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhagavat says that a Bodhisattva who believes all things are without self
    is called noble-minded by the Tathagata.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Subhuti affirms, in response to Bhagavat's questions, that the Tathagata has
    the bodily eye, heavenly eye, eye of knowledge, eye of the Law, and eye of Buddha.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bhagavat uses a calculation involving grains of sand in the Ganga, many Ganga
    rivers, and worlds as numerous as those sands, and Subhuti agrees that such worlds
    would be many.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bhagavat says he knows the manifold trains of thought of all beings in those
    many worlds, while also saying that what is called a train of thoughts is taught
    as no-train of thoughts.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bhagavat says that past thought, future thought, and present thought are not
    perceived.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Bhagavat asks whether a son or daughter of a good family who fills a million-million-world
    sphere with seven treasures and gives it to fully enlightened Buddhas would produce
    a large stock of merit; Subhuti answers yes, and Bhagavat affirms the merit as
    immeasurable and innumerable.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Bhagavat says that what was preached as a stock of merit was preached as no-stock
    of merit and therefore is called a stock of merit.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Subhuti says that a Tathagata is not to be seen or known by the shape of his
    visible body, because that shape is taught as no-shape and therefore called the
    shape of the visible body.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Subhuti says that a Tathagata is not to be seen or known by possession of
    signs, because such possession is taught as no-possession of signs and therefore
    called possession of signs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Bhagavat and Subhuti deny that the Tathagata thinks the Law has been taught
    by him; Bhagavat says nothing can be perceived by the name of the teaching of
    the Law.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Subhuti asks whether future beings in the last time, during the decay of the
    good Law, will believe these Laws when heard; Bhagavat says these are neither
    beings nor no-beings, because beings were preached as no-beings and therefore
    are called beings.
  category: speech
  evidence_refs:
  - ev:7
