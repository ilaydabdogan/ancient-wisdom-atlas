canonical_text:
  quote: Form is emptiness, and emptiness indeed is form.
  summary: The passage opens the Larger Prajnaparamita-Hridaya-Sutra. The Bhagavat
    dwells at Ragagrzha on the hill Gvzdhrakia with Bhikshus and Bodhisattvas. While
    the Bhagavat is absorbed in meditation, Aryavalokitesvara studies deep Prajnaparamita
    and reflects that the five Skandhas are by nature empty. Sariputra asks, through
    Buddha's power, how an aspirant should be taught. Aryavalokitesvara replies with
    the teaching that form and emptiness are not different, extends emptiness to the
    Skandhas and all things, negates a range of categories, and describes liberation
    from fear and final Nirvana when the envelopment of consciousness is annihilated.
    The passage then states that Buddhas of past, present, and future awaken after
    approaching Prajnaparamita and begins to name a great wisdom verse.
  language: English
  quote_policy: quoted
