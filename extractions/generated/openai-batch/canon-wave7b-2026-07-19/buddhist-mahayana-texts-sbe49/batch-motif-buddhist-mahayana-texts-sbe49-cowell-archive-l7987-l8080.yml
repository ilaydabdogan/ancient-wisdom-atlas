canonical_text:
  quote: "“you must cut down with all your efforts the root of pain, ignorance.”"
  summary: 'The passage presents a teaching on causation: attachment leads to continued
    existence, birth, old age, death, and sorrow, while stopping ignorance brings
    the series to cessation. The hearers comprehend this course and cessation, many
    beings experience purified spiritual vision, heavenly beings acclaim the event,
    and Maitreya asks about the form of the wheel of the Law that has been turned.'
  language: English
  quote_policy: quoted
