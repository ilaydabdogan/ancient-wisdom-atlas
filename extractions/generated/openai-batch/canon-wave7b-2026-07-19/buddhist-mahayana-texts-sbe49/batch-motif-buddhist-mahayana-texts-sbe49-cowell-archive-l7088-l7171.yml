canonical_text:
  quote: "“The former perfect Buddhas also did not leave the Bodhi tree.”"
  summary: After enlightenment, the Buddha passes four weeks in joy, bathing, enthronement,
    meditation, and activity. A god asks the name of the meditation; the Buddha explains
    it as a joyful array like royal inauguration, says he follows former Buddhas,
    and declares that obstructing forces have been conquered by wisdom. Mara asks
    him to enter Nirvana, but the Buddha vows first to establish innumerable worlds
    in perfect wisdom. Mara leaves, and Mara’s daughters approach; Lust attempts to
    tempt him with household and imperial pleasures.
  language: English
  quote_policy: quoted
