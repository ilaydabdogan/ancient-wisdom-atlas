canonical_text:
  quote: ''
  summary: After hearing the great saint's words and seeing his firmness, Mara departs
    defeated with his arrows. Mara's host flees after throwing away stones, straw,
    and trees. With the flower-armed god and hostile forces vanquished, the passionless
    sage remains victorious over the power of darkness; the sky clears, the moon shines,
    and showers of flowers fall from the heavens. A note states that the original
    work of Asvaghosha ends here according to a manuscript gloss, with later books
    added by Amritananda.
