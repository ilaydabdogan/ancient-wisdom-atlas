canonical_text:
  quote: ''
  summary: 'The passage describes signs and honors surrounding the birth of the Tathagata:
    an auspicious utterance, heavenly streams of water, divine and nonhuman attendants,
    cosmic and natural portents, a spontaneously appearing well, ritual actions, flowering
    trees, music, and the beginning of a court speech about royal law.'
  language: English
  quote_policy: summarized
