  text: The newborn figure of lion gait gazes at the four quarters and utters a voice
    described as full of auspicious meaning.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two streams of water from heaven, bright like moon rays and possessing heat
    and cold, fall on the peerless one's head to refresh his body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: His body lies on a royal bed with a canopy, a gold-shining frame, and lapis-lazuli
    feet, while yaksha-lords stand around guarding him with golden lotuses.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gods bow in homage to the son of Mayé, hold a white umbrella in the sky, and
    utter blessings on his supreme wisdom.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Great dragons gaze with devotion, fan him, and scatter Mandara flowers over
    him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Gods of pure natures and pure abodes are filled with joy through the influence
