canonical_text:
  quote: "“Even the mere perceiving of the image of that Buddha brings to one immeasurable
    blessings.”"
  summary: The passage teaches that perceiving or meditating on the image and bodily
    signs of Buddha Amitayus brings immeasurable blessings. Amitayus is described
    as having supernatural power to transform his body throughout the ten quarters,
    appearing either vast enough to fill the sky or smaller, sixteen or eighteen cubits
    high. His manifested body is pure gold, with a halo containing transformed Buddhas
    and jewel lotus-flowers. Two Bodhisattvas are identifiable by the marks on their
    heads and assist Amitayus in universal salvation. This practice is named the Thirteenth
    Meditation.
