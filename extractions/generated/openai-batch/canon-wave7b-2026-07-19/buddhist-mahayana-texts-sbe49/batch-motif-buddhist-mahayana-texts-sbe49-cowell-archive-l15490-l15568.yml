canonical_text:
  quote: "“all these must be delivered by me in the perfect world of Nirvaza. And
    yet, after I have thus delivered immeasurable beings, not one single being has
    been delivered.”"
  summary: 'Subhuti asks how a son or daughter of good family who has entered the
    Bodhisattva path should behave, advance, and restrain thoughts. Bhagavat answers
    with instruction: the Bodhisattva should intend to deliver all beings to Nirvana
    while holding no idea of a being, living being, or person; and should give gifts
    without depending on objects, form, sensory qualities, or causes, so that the
    measure of merit is difficult to learn, like the measure of space in all directions.'
  language: English
  quote_policy: quoted
