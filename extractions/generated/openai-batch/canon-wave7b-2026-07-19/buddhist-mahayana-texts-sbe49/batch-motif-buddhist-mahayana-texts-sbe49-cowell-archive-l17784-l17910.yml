canonical_text:
  quote: ''
  summary: 'The passage gives visualization instructions for the Pure Land of Highest
    Happiness: jewel trees, flowers, fruits, canopies, lakes, lotus flowers, flowing
    jewel water, teaching sounds, birds, jewelled galleries, devas, and self-sounding
    instruments. It states that successful perception expiates grave sins and leads
    to birth in that land after death. The Buddha then announces a teaching on deliverance;
    Buddha Amitayus appears in the sky with Mahasthama and Avalokitesvara, and Vaidehi
    worships and asks how future beings should meditate on them.'
  language: English
  quote_policy: summarized
