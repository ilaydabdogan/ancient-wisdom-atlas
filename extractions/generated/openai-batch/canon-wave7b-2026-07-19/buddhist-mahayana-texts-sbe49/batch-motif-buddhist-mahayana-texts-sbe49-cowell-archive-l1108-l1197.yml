canonical_text:
  quote: ''
  summary: The passage describes an idealized royal realm free from famine, fear,
    sickness, vice, and disorder. At the birth of the king’s son, gladness spreads,
    evil ceases, and the prince is named Sarvarthasiddha because all objects are accomplished.
    Queen Maya, unable to sustain the joy of her son’s glory, goes to heaven, and
    her sister raises the prince. The prince grows with solar, fiery, and lunar similes,
    receives luxurious gifts, shows unusual gravity and wisdom as a child, and quickly
    learns the sciences appropriate to his lineage. The passage also mentions the
    seer Asita’s prior statement about the prince’s destiny.
  language: English
  quote_policy: summarized
