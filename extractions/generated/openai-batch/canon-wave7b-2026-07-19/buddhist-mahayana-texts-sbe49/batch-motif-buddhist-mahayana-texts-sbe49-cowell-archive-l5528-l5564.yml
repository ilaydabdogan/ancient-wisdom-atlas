canonical_text:
  quote: ''
  summary: A prince of the Ikshvaku race approaches the hermitage of the tranquil
    sage Ardda. He is welcomed, seated with the sage, and praised for leaving home,
    severing affection, abandoning royal luxury, and coming to the forest or hermitage
    while still young. The sage contrasts this with the more expected retirement of
    aged kings to the forest after transferring glory to their children.
