canonical_text:
  quote: ''
  summary: Mara's demonic host surrounds the root of the Bodhi tree and seeks to harm
    the great sage. During the night battle, cosmic disturbances occur; deities, Nagas,
    god-sages, and virtuous beings react. Mara orders his demons to terrify the sage,
    but the sage remains untroubled, and the attackers' weapons and fiery missiles
    are immobilized or shattered by his power.
  language: English
  quote_policy: summarized
