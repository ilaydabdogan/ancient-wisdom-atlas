canonical_text:
  quote: ''
  summary: The passage discusses Sanskrit Buddhist manuscripts transmitted from India
    through China to Japan, the study of Buddhist literature in Japan in Chinese and
    Sanskrit, and the inclusion of translations of the Larger and Smaller Sukhavati-vyuha.
    It contrasts their preaching locations and interlocutors, and says the Smaller
    Sukhavati-vyuha emphasizes birth in the Land of Bliss through remembrance and
    repetition of Amitabha’s name before death rather than through good works.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sanskrit manuscripts are described as having travelled from India to China
    and from China to Japan, with some still existing there.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author says the search for Sanskrit manuscripts should continue in China,
    Japan, and Corea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Buddhist literature is said to have found a home in Japan and to have been
    studied there for many generations in both Chinese translations and original Sanskrit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author hopes a new school of Sanskrit students in Japan will enable followers
    of Buddha there to learn doctrine from the ancient Tripitaka in its original source.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Larger and Smaller Sukhavati-vyuha are included in the volume and are
    said to differ on several smaller points.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Larger Sukhavati-vyuha is represented as preached on Gridhrakuta hill
    near Ragagriha, while the Smaller Sukhavati-vyuha is represented as preached in
    the Geta-grove near Sravasti.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Larger Sukhavati-vyuha has the Bhagavat, Ananda, and Agita as chief interlocutors;
    the Smaller Sukhavati-vyuha has the Bhagavat and Sariputra.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Smaller Sukhavati-vyuha says people can be saved or born in the Land of
    Bliss if they remember and repeat the name of Buddha Amitabha for a number of
    nights before death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Smaller Sukhavati-vyuha denies that people are born in Amitabha’s Paradise
    as a reward or necessary result of good works performed in the present life.
  category: speech
  evidence_refs:
  - ev:8
