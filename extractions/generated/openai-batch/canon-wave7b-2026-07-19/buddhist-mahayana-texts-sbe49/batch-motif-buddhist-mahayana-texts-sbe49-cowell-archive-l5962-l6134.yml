canonical_text:
  quote: ''
  summary: The seer leaves one hermitage and settles near the Nairanjana, where five
    mendicants honor him. He undertakes severe fasting for six years, becomes emaciated
    yet radiant, and then reflects that such self-mortification is not the way to
    liberation or perfect knowledge. After resolving to restore his strength, he bathes,
    accepts milk from Nandabala, is abandoned by the five mendicants, goes to the
    root of an Asvattha tree, receives a prophecy of Buddhahood from the serpent Kala,
    and sits firmly under the holy tree with a vow not to rise until he has attained
    his aim.
  language: English
  quote_policy: summarized
