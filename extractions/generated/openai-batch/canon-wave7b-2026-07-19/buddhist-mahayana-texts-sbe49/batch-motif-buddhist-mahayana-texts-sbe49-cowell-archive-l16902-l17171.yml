canonical_text:
  quote: |-
    O wisdom, gone, gone, gone to the other
    shore, landed at the other shore, Svaha!
  summary: The Smaller Pragna-paramita-hridaya-sutra presents Avalokitesvara contemplating
    the five Skandhas as empty, teaching Sariputra the identity of form and emptiness
    and the negation of categories, describing liberation through the Perfection of
    Wisdom, stating that Buddhas of all times awaken through it, and concluding with
    a wisdom verse about going to the other shore.
  language: English
  quote_policy: quoted
