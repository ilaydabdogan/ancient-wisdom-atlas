canonical_text:
  quote: ''
  summary: The passage instructs Ananda in visualizing Buddha Amitayus and then Bodhisattva
    Avalokitesvara. Amitayus is described with immense size, golden brightness, bodily
    marks, rays, and a halo filled with miraculously created Buddhas and Bodhisattvas.
    Meditation on Amitayus leads to seeing Buddhas of the ten quarters, understanding
    Buddha-mind as compassion, rebirth in the presence of Buddhas, and a prophecy
    of future Buddhahood. Avalokitesvara is then visualized with vast size, purple-gold
    body, halo, crown, rays, transformed Buddhas and Bodhisattvas, jewel hands, wheel-marked
    feet, and jewel flowers.
  language: English
  quote_policy: summarized
