canonical_text:
  quote: ''
  summary: The prince hears that sickness is common to all and turns back from an
    excursion in distress. The king responds by increasing worldly pleasures for him
    and arranging another guarded outing. On that outing deities create the sight
    of a dead man, visible only to the prince and charioteer. The charioteer explains
    death as the fixed end of all living creatures. The prince is overwhelmed and
    orders the chariot turned back, but the charioteer proceeds to the forest Padmakhanda,
    where the prince is brought among attractive surroundings and women.
  language: English
  quote_policy: summarized
