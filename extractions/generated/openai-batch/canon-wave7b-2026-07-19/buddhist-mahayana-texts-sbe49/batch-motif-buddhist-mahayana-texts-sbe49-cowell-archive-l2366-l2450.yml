  quote: ''
  summary: In Book V.1-10, the son of the Sakya king resists sensory temptations,
    goes out with companions toward the forest, sees a ploughed field where grass
    and small creatures have been destroyed, feels sorrow and compassion for laborers
    and cattle, then withdraws to a rose-apple tree and meditates on the origin and
    destruction of the world, attaining firmness of mind and release from sorrows.
  language: English
