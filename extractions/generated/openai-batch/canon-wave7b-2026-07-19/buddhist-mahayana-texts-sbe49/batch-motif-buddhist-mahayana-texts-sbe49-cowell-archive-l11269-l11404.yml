canonical_text:
  quote: ''
  summary: The passage says that even prolonged speech would not exhaust the virtues
    of Amitabha’s light or the Tathagata’s knowledge-light. It describes Amitabha’s
    hearers as immeasurable through counting and ocean-drop analogies, states that
    Amitabha/Amitayus has an immeasurable lifespan, and depicts Sukhavati as prosperous,
    free from lower realms and untimely births, fragrant, flowered, full of gems,
    gem trees, and sweet-voiced birds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says that the Tathagata could speak for a whole kalpa about Amitabha’s
    work, beginning with his light, without reaching the end of the virtues of that
    light.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes both the excellence of Amitabha’s light and the Tathagata’s
    knowledge-light as immeasurable, innumerable, inconceivable, and endless.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The assembly of hearers of Amitabha is said to be immeasurable and difficult
    to count by named large numerical measures.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Maudgalyayana, having miraculous power, is used as an example of someone who
    could count kinds of stars in the universal world in one day and night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
