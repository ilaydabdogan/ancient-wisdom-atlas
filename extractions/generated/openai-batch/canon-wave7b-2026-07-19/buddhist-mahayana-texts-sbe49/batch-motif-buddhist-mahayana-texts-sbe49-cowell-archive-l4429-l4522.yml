canonical_text:
  quote: "“neither a son nor kindred is the cause of sorrow,—this sorrow is only caused
    by ignorance.”"
  summary: A king’s son explains that separation is inevitable, sorrow arises from
    ignorance, and his departure to the forest is not ill-timed. He refuses the king’s
    offer of the kingdom and describes royal life and palace pleasures as dangerous
    illusions. A counsellor replies that the resolve may be good in itself but is
    untimely because it leaves the aged father in grief and neglects visible duties
    and ends.
