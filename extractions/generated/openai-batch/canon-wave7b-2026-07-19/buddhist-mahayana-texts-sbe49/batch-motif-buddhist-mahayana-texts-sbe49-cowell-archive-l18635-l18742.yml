candidate_motifs:
- id: motif:1
  label: Deathbed instruction and invocation leading to rebirth
  taxonomy_refs:
  - death_rebirth
  - afterlife_journey_map
  basis: Dying sinful persons hear scripture or teachings, invoke or hear about Amitayus,
    are freed from long karmic consequences, depart life, and are born in a lotus
    or jewel-lake setting.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:8
  - ev:9
  confidence: high
  cautions: The specific destination is described here as 'that country' and a jewel-lake;
    broader Pure Land context is implied by the surrounding text but not expanded
    in the supplied extract.
- id: motif:2
  label: Lotus-birth followed by delayed instruction
  taxonomy_refs:
  - death_rebirth
  - initiation
  basis: Persons are born in lotus-flowers, the flowers unfold only after a set period,
    and Bodhisattvas then preach and guide the reborn person toward Bodhi or a Bodhisattva
    stage.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:9
  - ev:10
  confidence: medium
  cautions: The 'initiation' taxonomy is interpretive; the literal passage states
    delayed opening and subsequent instruction.
- id: motif:3
  label: Threatening hell-fire transformed into salvific reception
  taxonomy_refs:
  - death_rebirth
  basis: Hell fires approach a sinner at death, but after hearing preaching they transform
    into cool wind and heavenly flowers carrying created Buddhas or Bodhisattvas who
    receive him.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage describes a transformation of punishment imagery, not a full
    descent into or escape from hell.
- id: motif:4
  label: Liberating power of sacred names and hearing
  taxonomy_refs:
  - wisdom
  basis: Hearing the names of scriptures, uttering the Buddha's name, and hearing
    the names of the Three Jewels are each linked to removal of sins or eligibility
    for birth in that country.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:6
  confidence: high
  cautions: The available taxonomy has no specific sacred-name motif; 'wisdom' is
    used because liberation is tied to hearing and doctrinal reception.
- id: motif:5
  label: Bodhisattva instruction after rebirth
  taxonomy_refs:
  - wisdom
  basis: Avalokitesvara and Mahasthama teach the Law or Mahayana Sutras after the
    lotus opens, and the hearers understand, believe, rejoice, or direct their thought
    toward highest Bodhi.
  evidence_refs:
  - ev:1
  - ev:6
  - ev:10
  confidence: high
  cautions: This is a doctrinal-instruction pattern rather than a narrative episode
    with named individual biography.
- id: motif:6
  label: Compassionate guide at the threshold of death
  taxonomy_refs:
  - afterlife_journey_map
  basis: A good and learned teacher appears at the time of death, gives salvific instruction,
    and heavenly created figures then arrive to meet, receive, or guide the person.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:8
  - ev:9
  confidence: medium
  cautions: The human teacher's identity is not specified, and the passage presents
    repeated category examples rather than a single individualized myth.
