canonical_text:
  quote: ''
  summary: The passage describes several classes of beings eligible for rebirth through
    deathbed instruction, hearing Mahayana scriptures, invoking Buddha Amitayus, and
    receiving created Buddhas or Bodhisattvas. It includes scenes of sins being expiated,
    hell fires transforming into cool wind and flowers, lotus-birth in a jeweled lake,
    later instruction by Avalokitesvara and Mahasthama, and aspiration toward highest
    Bodhi. The end introduces the lowest form of the lowest grade, but the supplied
    passage breaks off after naming severe sins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After seven days, a being meets Avalokitesvara and Mahasthama, learns the
    Law, rejoices, and after a lesser kalpa attains the fruition of an Arhat; this
    is called the Fifteenth Meditation for the middle class of beings.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who has committed many evil deeds but has not spoken evil of the
    Mahavaipulya Sutras may, while dying, meet a good and learned teacher who recites
    and praises the headings and titles of the twelve divisions of the Mahayana scriptures.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hearing the names of the Sutras frees that dying person from sins that would
    otherwise involve births and deaths during a thousand kalpas.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A wise man teaches the dying person to stretch forth folded hands and say
    an adoration to Buddha Amitayus.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Uttering the name of the Buddha frees the person from sins that would otherwise
    involve births and deaths for fifty millions of kalpas.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Buddha sends a created Buddha and created Bodhisattvas, Avalokitesvara
    and Mahasthama, to approach the person with words of praise and to say that his
    sins have been destroyed and expiated.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The devotee sees rays from the created Buddha flood his chamber with light,
    rejoices, and departs this life.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The devotee is seated on a lotus-flower, follows the created Buddha, and is
    born in the jewel-lake.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After seven weeks the lotus-flower unfolds; Avalokitesvara and Mahasthama
    stand before the person, emit rays, preach the deepest meaning of the twelve divisions
    of scripture, and the person believes and cherishes the thought of highest Bodhi.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After ten lesser kalpas the person gains entrance to the knowledge of the
    hundred divisions of nature and can enter the first joyful stage of Bodhisattva.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Those who have heard the names of Buddha, the Law, and the Church, described
    as the Three Jewels, can also be born in that country.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: A middle form of the lowest grade includes a person who transgresses precepts,
    steals property belonging to the whole community or to a particular Bhikshu, is
    unashamed, and glorifies himself with wicked deeds.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Such a sinful person deserves to fall into hell, and at death the fires of
    hell approach him from all sides.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: A good and learned teacher preaches the power and virtue of Amitayus, the
    supernatural powers and brilliant rays of that Buddha, and praises moral virtue,
    meditation, wisdom, emancipation, and knowledge following emancipation.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: After hearing this preaching, the person is freed from sins that would have
    involved births and deaths during eighty millions of kalpas.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: The fires of hell transform into a pure and cool wind blowing heavenly flowers;
    on each flower stands a created Buddha or Bodhisattva to meet and receive the
    person.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: In a moment the person is born in a lotus-flower growing in the lake of seven
    jewels.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: After six kalpas the lotus-flower opens, and Avalokitesvara and Mahasthama
    soothe and encourage the person with Brahma-voices and preach Mahayana Sutras
    of deepest significance.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:19
  text: After hearing this Law, the person immediately directs his thought toward
    highest Bodhi.
  category: action
  evidence_refs:
  - ev:10
- id: obs:20
  text: The supplied passage introduces the lowest form of the lowest grade as one
    who commits evil deeds, including the ten wicked actions, the five deadly sins,
    and the like, but the passage breaks off before the outcome is given.
  category: sequence
  evidence_refs:
  - ev:11
