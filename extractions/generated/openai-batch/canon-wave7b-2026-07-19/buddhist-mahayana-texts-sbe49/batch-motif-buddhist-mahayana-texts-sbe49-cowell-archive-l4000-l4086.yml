  quote: ''
  summary: Women lament the ascetic departure of a man formerly accustomed to royal
    luxury. Yasodharā falls to the ground and laments that he has abandoned his lawful
    wife and infant son Rahula to pursue religious life, forest austerity, and possible
    heavenly rewards without her.
  language: English
  quote_policy: summarized
