canonical_text:
  quote: ''
  summary: The introduction summarizes the Larger Sukhavati-vyuha as teaching prayer
    and faith in Amitabha while retaining merit, then outlines Sakyamuni's narration
    to Ananda of Dharmakara's vow, instruction, meditation, eventual Buddhahood as
    Amitabha, the marvels of Sukhavati, a light-vision of Amitabha and his retinue,
    the lotus condition of believers and doubters, and the exhortation to transmit
    the text.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The introduction contrasts the doctrine of karman and works with a path emphasizing
    prayer and faith, while stating that the Larger Sukhavati-vyuha also treats a
    stock of merit as essential for salvation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sakyamuni is presented as the teacher in the Sukhavati-vyuha, and the account
    begins with a dialogue between him and Ananda after Ananda observes Sakyamuni's
    spiritual exaltation.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sakyamuni relates a line of eighty-one Tathagatas or Buddhas, beginning with
    Dipankara and ending with Lokesvararaga.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: During the period of Lokesvararaga, the mendicant Dharmakara forms the intention
    of becoming a Buddha, praises Lokesvararaga, and asks him to teach what a Buddha
    and Buddha country ought to be.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After receiving instruction, Dharmakara comprehends the best qualities of
    Buddha countries and prays that they be concentrated in his own future country.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Dharmakara's long prayer is described as the nucleus of the Sukhavati-vyuha
    and as a prophecy of what Sukhavati, the Land of Bliss, ought to be.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Dharmakara becomes a Bodhisattva and then a Buddha, and Sakyamuni identifies
    him as Amitabha reigning in Sukhavati.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ananda is once reproved for not implicitly believing Sakyamuni's account of
    the marvels of Sukhavati.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Amitabha explains to Avalokitesvara that Sukhavati is the fulfillment of his
    prayers from when he lived on earth.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: When Ananda wishes to see Amitabha, Amitabha sends a ray of light from the
    palm of his hand, and the whole world is filled with its light.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Through the light, Ananda and every living being can see Amitabha and his
    Bodhisattva retinue in the Land of Bliss, while beings in Sukhavati can see Sakyamuni
    and the Saha world.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Some blessed spirits in Sukhavati sit cross-legged in lotus flowers, while
