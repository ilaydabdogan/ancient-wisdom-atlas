canonical_text:
  quote: ''
  summary: Buddha meditates, goes to the Deer Park, is first rejected and then honored
    by five disciples, declares his awakening and initiates them, visits the sacred
    seats of former Buddhas, stands on the throne of the Law, and receives the jeweled
    wheel of the Law from Dharmakakra before a gathered divine assembly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king of righteousness spends the night absorbed in meditation in the Sankhamedhtya
    garden and is compared to the moon in gladdening those astonished at his appearance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The next day he collects alms on a begging round and proceeds to the Deer
    Park.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The five disciples identify him as Gautama, criticize his conduct, and agree
    not to greet, welcome, seat, or invite him in.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Buddha understands their agreement and approaches with a smiling countenance,
    spreading light, carrying his staff and begging-pot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The five disciples forget their agreement, rise, take his begging-bowl and
    staff, offer arghya and water for washing and rinsing, bow, and greet him respectfully.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Buddha says that wisdom has been attained, tells the five not to address him
    as 'worthy Sir,' identifies himself as a Gina, and says he has come to give the
    first wheel of the Law and initiation leading to Nirvana.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The five ask to undertake the vow of a religious life, and Buddha touches
    their heads and receives them into the mendicant order.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the mendicants' request Buddha bathes in a tank, reflects on the field
    of the Law, goes with them, and points out sacred seats.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Buddha explains that these are four seats of the Buddhas of the Bhadra Age;
    three Buddhas have passed there, and he is the fourth possessor of the ten powers.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Buddha bows to the throne of the Law, which is described as decorated with
    cloth and silk, jewel-inlaid, like a golden mountain, and guarded by kings of
    kings; he then stands on the throne at an auspicious time.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The five disciples stand in front with joyful minds, and the son of Suddhodana
    performs a meditation called the Arouser of all worlds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Brahman and other gods, Maitriya with deities of the Tushita heaven, sons
    of the Ginas, and Suras gather from their worlds and from the ten directions for
    the turning of the wheel of the Law.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Dharmakakra arrives carrying the wheel of the Law, places the gold-and-jewel
    mass before Buddha, worships him, and asks him to turn the wheel of the Law as
    former Sugatas have done.
  category: action
  evidence_refs:
  - ev:9
