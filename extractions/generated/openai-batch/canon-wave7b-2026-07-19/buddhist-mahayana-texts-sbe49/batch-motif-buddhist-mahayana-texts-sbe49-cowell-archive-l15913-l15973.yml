canonical_text:
  quote: ''
  summary: In a dialogue, Bhagavat instructs Subhuti on a mind not fixed on sensory
    objects, presents a Sumeru-sized body example in relation to selfhood and no-selfhood,
    compares immense treasure-giving to the greater merit of teaching a four-line
    Gatha from the treatise, and says the place where such teaching occurs becomes
    like a holy shrine for gods, men, and spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mind is described as to be framed without believing in form, sound, smell,
    taste, or tangible things.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A hypothetical man is described as having a body as large as Sumeru, the king
    of mountains.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Subhuti answers that such a man's selfhood would be large, and explains that
    the Tathagata preached selfhood as no-selfhood, so it is called selfhood.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bhagavat asks about Ganga rivers as numerous as the grains of sand in the
    Ganga, and Subhuti says the rivers and their sands would be many.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A hypothetical woman or man fills innumerable worlds with the seven treasures
    and gives them to holy and fully enlightened Tathagatas.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Subhuti says the treasure-giver would produce an immeasurable and innumerable
    stock of merit.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bhagavat says that one who takes one four-line Gatha from the treatise and
    teaches and explains it to others produces a still larger immeasurable and innumerable
    stock of merit.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The place where one four-line Gatha is preached or explained is said to be
    like a Kaitya, a holy shrine, for the world of gods, men, and spirits.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Those who learn, repeat, understand, and fully explain the whole treatise
    are said to be endowed with the highest wonder.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the place of such teaching, the teacher dwells, or one after another holds
    the place of the wise preceptor.
  category: relationship
  evidence_refs:
  - ev:8
