canonical_text:
  quote: ''
  summary: Buddha explains pure actions as causes leading to the Buddha country, instructs
    Ananda to remember and proclaim the teaching, and teaches Vaidehi and future beings
    how to meditate on the World of Highest Happiness in the western quarter. The
    passage says that only through Buddha’s power can one see the pure land clearly,
    compares such sight to seeing one’s face in a transparent mirror, and records
    Vaidehi asking how future beings after Buddha’s Nirvana can see the World of Highest
    Happiness of Buddha Amitayus.
  language: English
  quote_policy: summarized
