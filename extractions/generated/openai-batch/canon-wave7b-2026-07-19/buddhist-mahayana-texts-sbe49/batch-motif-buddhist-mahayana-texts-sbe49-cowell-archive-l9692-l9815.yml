canonical_text:
  quote: ''
  summary: Introductory passage explaining the use of a Chinese translation for the
    Amitayur-dhyana-sutra, the chronological importance of Mahayana sutras, the popularity
    of Amitabha and Sukhavati in China and Japan, a proposed Brahmanic/Puranic antecedent
    for Sukhavati in Varuna's western city Sukha, and the later Japanese reception
    of the Sukhavati-vyuha.
  language: English
  quote_policy: summarized
