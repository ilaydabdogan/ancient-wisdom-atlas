canonical_text:
  quote: ''
  summary: 'The Bhagavat asks Agita to observe the adorned Buddha country Sukhavati:
    its gardens, rivers, lotus lakes, flowers, precious columns, birds, aerial palaces,
    and lotus dwellings. Agita confirms the vision and asks why some beings dwell
    within lotus calyces while others are born miraculously, seated cross-legged in
    lotus flowers. The Bhagavat explains that doubt leads to calyx-dwelling and five
    hundred years of deprivation, while faith and trust in Buddha knowledge lead to
    miraculous lotus birth and rapid attainment of a body. He illustrates the condition
    of doubting Bodhisattvas with an analogy of a prince confined in a luxurious jeweled
    dungeon.'
  language: English
  quote_policy: summarized
