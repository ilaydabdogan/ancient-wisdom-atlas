canonical_text:
  quote: ''
  summary: The passage states that good things are preached by the Tathagata as no-things
    and therefore called good things. It then compares a cosmic-scale gift of seven
    treasures to Tathagatas with teaching even one four-line verse from the Prajnaparamita,
    saying the teaching yields far greater merit. It also denies that the Tathagata
    thinks beings have been delivered by him, because positing such a delivered being
    would imply belief in self, being, living being, and person.
  language: English
  quote_policy: summarized
