canonical_text:
  quote: ''
  summary: Vaidehi, confined and grieving, worships the Buddha from afar and asks
    for Mahamaudgalyayana and Ananda. The Buddha perceives her thought, sends the
    disciples through the sky, and appears in the palace. Vaidehi sees the Buddha
    with attendants and gods, asks about the causes of her suffering, and requests
    instruction concerning sorrowless places for rebirth. The Buddha reveals many
    pure Buddha countries through a golden ray and a Sumeru-like pillar. Vaidehi chooses
    the realm of Amitayus, Sukhavati, and asks how to meditate upon it. The Buddha’s
    rays reach the confined King Bimbisara, who sees him from afar and attains the
    fruition of an Anagamin. The Buddha then begins teaching Vaidehi pure actions
    and threefold goodness for birth in Sukhavati.
  language: English
  quote_policy: summarized
