canonical_text:
  quote: ''
  summary: At the opening of Book XVII, heavenly beings led by Brahman and Bodhisattvas
    hear a glorification of the Law uttered by the lion of the Sakyas and wish to
    hear it again. They go to the city and worship him. On an auspicious lunar date
    he remembers Buddha worlds, desires to save all creatures, and sets out on a journey
    seeking disciples, with his father at their head. In Kasi and the Deer Park, Brahmans,
    inhabitants, and thirty mendicants are associated with the chief of saints. Kasika
    of Kasi worships the Gina, attaches her sons to his service, and goes to the heaven
    of the gods. Thirty officiating priests of Kasi are made disciples and initiated
    in perfect wisdom, and Pirza obtains true wisdom and becomes a noble mendicant.
    The next verse begins with a priest of Marakata but is fragmentary in the supplied
    passage.
  language: English
  quote_policy: summarized
