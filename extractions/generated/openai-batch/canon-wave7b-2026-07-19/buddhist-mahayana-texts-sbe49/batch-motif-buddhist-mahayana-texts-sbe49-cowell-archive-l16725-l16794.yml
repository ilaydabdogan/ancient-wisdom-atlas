canonical_text:
  quote: Stars, darkness, a lamp, a phantom, dew, a bubble.
  summary: In the closing section of the Diamond-cutter, Bhagavat and Subhuti discuss
    belief as no-belief and the rejection of fixed ideas of thing and no-thing. A
    hypothetical immense gift of seven treasures to Tathagatas is contrasted with
    learning, repeating, understanding, and explaining one four-line gatha from the
    Prajnaparamita, which yields greater merit. The world is to be looked upon through
    a series of images including stars, darkness, lamp, phantom, dew, bubble, dream,
    lightning, and cloud. The assembled audience praises Bhagavat's preaching.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Bhagavat says that a belief in matter is unmentionable and inexpressible,
    neither a thing nor no-thing, and that it is called a belief in matter after being
    preached as no-belief.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Subhuti answers that it would not be true to say that the Tathagata preached
    belief in self, being, life, and personality; what was preached as belief in self
    was preached as no-belief.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bhagavat instructs those on the Bodhisattva path to perceive, look upon, and
    believe all things without believing in the idea of a thing or in the idea of
    a no-thing.
  category: speech
  evidence_refs:
  - ev:3
