canonical_text:
  quote: ''
  summary: Brahmans console the king with examples of sons or later figures accomplishing
    what predecessors did not. The king is relieved, rewards them, and voices the
    hope that the child will rule the earth and later retire to the woods. The seer
    Asita, learning by signs and penance of the birth of one destined to destroy birth,
    comes to the Sakya palace seeking the excellent Law. The king’s priest introduces
    him, he enters the joyful inner palace, and the king honors him with water for
    the feet and an arghya offering before inviting him to speak.
