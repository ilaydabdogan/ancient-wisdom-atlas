  quote: ''
  summary: The passage presents a dialogue in which the Tathagata is explained as
    one who neither goes anywhere nor comes from anywhere. A further exchange uses
    the image of countless worlds reduced to fine dust or atoms; Subhuti answers that
    what is called a mass of atoms is taught as no-mass of atoms, and what is called
    a sphere of worlds is taught as no-sphere of worlds. The passage ends while introducing
    a statement about belief in matter.
