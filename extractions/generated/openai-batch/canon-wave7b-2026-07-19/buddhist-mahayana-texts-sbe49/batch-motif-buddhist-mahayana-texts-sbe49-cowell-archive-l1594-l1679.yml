canonical_text:
  quote: ''
  summary: A prince questions his charioteer about an aged man. The charioteer explains
    old age as a universal destructive condition that will also come to the prince.
    Distressed, the prince turns back from the pleasure-garden and later remains absorbed
    in thoughts of old age. On another outing, deities create a diseased man, whose
    symptoms the prince asks about; the charioteer identifies the affliction as sickness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The charioteer reveals a carefully guarded secret to the king's son, with
    the narration stating that gods had bewildered the charioteer's mind.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old age is described as breaking a person down and as destroying beauty, vigour,
    delights, memories, and the senses.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old man is said once to have drunk milk in childhood, then to have learned
    to move on the ground, become a vigorous youth, and step by step reached old age.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The prince asks whether old age will also come to him, and the charioteer
    answers that it will come by the force of time to him and to all the world.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After hearing about old age, the prince is deeply agitated, draws a long sigh,
    shakes his head, fixes his eyes on the decrepit old man, and looks around at the
    exultant multitude.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The prince says that old age strikes down memory, comeliness, and valour in
    all alike, while the world remains undisturbed by this visible fate.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The prince orders the charioteer to turn back from the pleasure-garden, and
    the charioteer turns the chariot back toward the royal palace.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Even in the palace the prince finds no happiness, repeatedly reflecting on
    old age, and then goes out again with the king's permission.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: On the later outing, the same deities create another man whose body is afflicted
    by disease, and the prince sees him and questions the charioteer.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The diseased man is described as having a swollen belly, a shaking frame,
    loose-hanging arms and shoulders, a pale and thin body, and as plaintively uttering
    the word “mother”; the charioteer identifies the condition as sickness caused
    by inflammation of the three humours, making the man no longer master of himself.
  category: attribute
  evidence_refs:
  - ev:5
