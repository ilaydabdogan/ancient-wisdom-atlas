canonical_text:
  quote: "“to control the thought is alone befitting,—without the thought the body
    is like a log.”"
  summary: A speaker argues against bodily penances, ritual purity practices, and
    heavenly reward-seeking when they are driven by desire or hope. He states that
    thought should be controlled, that water does not remove sin, and that true pilgrimage
    consists in the virtues of a virtuous person. After the discourse, at sunset,
    he enters a penance grove with trees, smoke, sacred fires, hermits, ablutions,
    shrines, and prayers.
