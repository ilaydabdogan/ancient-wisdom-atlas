canonical_text:
  quote: I wish to become a wandering mendicant for the sake of liberation
  summary: The prince reflects on universal sickness, old age, and death; encounters
    a beggar-dressed ascetic who is revealed as a heavenly inhabitant; turns his mind
    toward deliverance and Nirvana; asks his father the king for permission to renounce;
    and answers the king's objections by naming death, disease, old age, and misfortune
    as unavoidable contingencies.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The prince contemplates the condition of mankind as subject to sickness, old
    age, and death, and concludes that disgust toward others similarly afflicted would
    be improper.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After reflecting on sickness, old age, and death, the prince's joy in vigor,
    youth, and life vanishes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prince is described as calm, passionless, free from desire, hatred, scorn,
    hesitation, indolence, and sleep.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man in a beggar's dress approaches unobserved by the other men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When questioned by the prince, the beggar-dressed man says he became an ascetic
    because he is terrified at birth and death and seeks liberation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The ascetic describes wandering without family, dwelling at the root of a
    tree, in an uninhabited house, on a mountain, or in a forest, and seeking only
    the highest good.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: While the prince watches, the ascetic suddenly flies up to the sky; the narrator
    identifies him as a heavenly inhabitant who came to rouse the prince's recollection.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the heavenly inhabitant departs, the prince is rejoiced and astonished,
    comprehends dharma, and sets his mind on deliverance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The prince returns to the city on his noble steed while still seeking an end
    to old age and death and thinking of dwelling in the woods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A princess greets the prince with folded hands and calls blessed the woman
    whose husband is such as he; hearing the word 'blessed,' he fixes his mind on
    Nirvana.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The prince approaches the king, prostrates with folded hands, and asks permission
    to become a wandering mendicant for the sake of liberation.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The king responds with grief, urges the prince to abandon the thought of immediate
    renunciation, and advises him to take up householder duties and royal responsibilities.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The prince says he will not go to the forest if the king can guarantee that
    his life will not be subject to death, his health to disease, his youth to old
    age, and his welfare to misfortune.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The king replies by calling the prince's idea of departure extravagant and
    ridiculous.
  category: speech
  evidence_refs:
  - ev:9
