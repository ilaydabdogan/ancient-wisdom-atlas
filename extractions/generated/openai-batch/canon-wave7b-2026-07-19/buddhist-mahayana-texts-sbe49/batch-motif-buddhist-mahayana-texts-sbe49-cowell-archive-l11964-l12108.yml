canonical_text:
  quote: ''
  summary: Amitayu emits rays from a smile; Avalokitesvara asks the reason; Amitayu
    speaks of his fulfilled former prayer that beings hearing his name come to his
    country and do not return. Bodhisattvas are directed to Sukhavati and to worship
    Buddhas. The passage then describes Amitayus's vast jeweled Bodhi-tree, its sensory
    reach and benefits, and the destiny of Bodhisattvas born in Sukhavati toward highest
    perfect knowledge.
  language: English
  quote_policy: summarized
