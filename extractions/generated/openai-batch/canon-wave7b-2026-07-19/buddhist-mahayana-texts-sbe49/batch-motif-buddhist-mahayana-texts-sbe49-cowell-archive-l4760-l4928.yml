canonical_text:
  quote: "“he will either attain supreme wisdom or the empire of the earth”"
  summary: The passage describes the Bodhisattva entering Rajagriha as an ascetic,
    attracting reverent attention because of his appearance and bearing. King Srenya
    learns that he is the Sakya prince foretold to attain either supreme wisdom or
    earthly empire, sends a man to follow him, and later meets him on Mount Pandava.
    The king praises his youth, lineage, and beauty, questions his choice of mendicancy
    over kingship, and offers him half a kingdom, military alliance, and the three
    worldly aims of merit, wealth, and pleasure.
  language: English
  quote_policy: quoted
