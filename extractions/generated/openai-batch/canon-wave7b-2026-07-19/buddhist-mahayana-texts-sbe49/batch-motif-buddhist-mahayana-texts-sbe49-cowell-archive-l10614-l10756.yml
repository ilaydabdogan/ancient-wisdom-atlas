canonical_text:
  quote: ''
  summary: 'A sequence of conditional vows addressed to the Bhagavat describes the
    qualities of the speaker''s future Buddha country: its inhabitants lack ordinary
    distinctions, possess supernormal faculties, remember former births, hear and
    see across many worlds, lack possessiveness and sin, and remain established in
    truth. The vows also describe immeasurable pupils, light, and lifespan; universal
    praise of the speaker''s name by Buddhas; deathbed appearance before devotees
    with Bhikshus; and rebirth in the Buddha country for beings who hear the name,
    direct their thought there, and mature merit, with specified exclusions. The supplied
    passage ends at the beginning of vow 20.'
  language: English
  quote_policy: summarized
