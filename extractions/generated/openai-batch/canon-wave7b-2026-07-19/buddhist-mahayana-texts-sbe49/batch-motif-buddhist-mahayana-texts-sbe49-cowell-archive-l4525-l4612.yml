canonical_text:
  quote: ''
  summary: A didactic speech surveys disputed views about rebirth, future activity,
    liberation, spontaneous arising, Isvara, soul, natural properties, and ritual
    debts. The speaker then advises a addressed youth to follow the prescribed rule
    if he loves liberation, says this would end the king’s grief, and adds that ancient
    people also returned from forests to their houses. The excerpt ends with an incomplete
    reference to King Ambarisha.
  language: English
  quote_policy: summarized
