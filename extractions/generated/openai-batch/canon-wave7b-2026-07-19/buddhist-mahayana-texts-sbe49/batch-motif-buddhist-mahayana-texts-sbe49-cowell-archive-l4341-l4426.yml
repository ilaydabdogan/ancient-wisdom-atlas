  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wife is described as mourning while her lord is still alive, like a swan
    separated from her mate or a female elephant deserted in the forest by her companion.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Rahula is called the addressee’s only son and a child suffering woe; the speaker
    asks that he be delivered from his kindred’s grief like the full moon from the
