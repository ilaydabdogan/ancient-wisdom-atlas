canonical_text:
  quote: ''
  summary: A family priest urges the Bodhisattva to heed his father by citing householder
    kings who attained spiritual merit, the king’s wish to see him consecrated with
    sacred water and royal umbrella, the grief of father, mother, wife, and son, and
    named filial exemplars. The Bodhisattva reflects and replies that, despite knowing
    his father’s tenderness, fear of sickness, old age, and death forces him to leave
    his kindred.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says that great kings who were householders were skilled in attaining
    merit leading to final bliss, and urges the addressee to obtain both royal magnificence
    and control over the mind.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king says he wishes to embrace the addressee after kingly consecration,
    while the addressee is still wet with sacred water, and to see him with the royal
    umbrella before entering the forest.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king’s speech is described as stopped by tears, and the addressee is urged
    to respond affectionately to the king’s affection.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king of the Sakyas is described as drowning in a deep sea of sorrow full
    of waves of trouble, and the addressee is asked to deliver him like an ox drowning
    in the sea.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bhishma, Rama, and Rama son of Bhrigu are cited as figures who did what pleased
    their fathers, and the addressee is urged to do his father’s desire.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The queen who brought up the addressee is described as still alive and ceaselessly
