canonical_text:
  quote: ''
  summary: The narrator describes travel along cataracts and the River Ukpon, an incident
    in which companions flee after learning that a resting tree trunk stands above
    a crocodile home whose eggs carriers have taken, migration from Ibum to Etara
    because young women seek more possible wooers, and the elaborate grave forms in
    Etara houses, including broken plates and dishes set into mud grave structures
    and wall decoration for a rich man.
  language: English
  quote_policy: summarized
