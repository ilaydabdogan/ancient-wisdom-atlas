  quote: ''
  summary: The passage reports severe suffering during the Ekoi struggle for independence.
    It cites Dr. Mansfeld’s report that mothers killed suckling infants during the
    uprising because their cries betrayed forest hiding places to soldier patrols.
    The narrator describes this as almost inconceivable for devoted Ekoi parents,
    and suggests hardship, pity, and belief in the infants’ spirits returning to earth
    after peace as possible motives. A further cited description depicts the postwar
    country as devastated, with burned huts, overgrown walls, impassable roads, empty
    farms, and fleeing inhabitants.
