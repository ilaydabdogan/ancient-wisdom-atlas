canonical_text:
  quote: ''
  summary: The passage describes beliefs about ghosts, protections against them, the
    soul as distinct from the body, temporary soul absence in trance, dream-visions,
    premature burial after soul absence, spirits of objects, offerings to the dead,
    restless ghosts, divinatory contact with wraiths, and ancestor offerings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ghosts are said to be kept from entering a room or compound at night by burning
    spices or tobacco, keeping lamps alight, wearing amulets, or washing with a magician-made
    preparation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person meeting a ghost without protection is said likely to fall sick and
    to consult a Diviner to learn why the visit occurred.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The soul is described as the real person and as indestructible, while the
    body is inferior, temporary, and decays.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A living person's shadow is described as the shape of the soul compressed
    into a small space.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sometimes the soul leaves the body and returns; living beings, especially
    women, may enter trance while their souls fly away and see other worlds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Nimm woman was believed to have been buried after apparent death; her spirit
    later complained that her soul had only gone away temporarily and that she died
    after its return because she could not breathe in the earth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A man is said to have two minds, one good and one bad, connected only with
    the body and dying with it, but only one soul.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage divides Ekoi dreamers into those whose dreams come true and those
    whose dreams go by contrary; for the latter, a wedding dream signifies a funeral
    and a newborn-baby dream signifies a death in the house.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Everything that exists, including trees, rocks, weapons, and household goods,
    is said to have its own soul, and their astral forms are visible in dreams.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Wraiths of dead friends are said to appear in night visions to warn of dangers
    or ask for offerings.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Food laid out for ghosts may be eaten unwittingly without harm, but knowingly
    eating it is said to bring misfortune.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Food is thrown upon graves; spirits are said to feed by sucking out its essence
    and leaving the shell of the offering.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Spirits who have lived a full earthly life, or have no reason to stay, are
    said to go to another world and return only exceptionally.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Spirits of those who died violently or are held back by a special cause are
    said to wander in this world, trouble people, remain near graves, and enter towns
    between midnight and 3 a.m.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: A wraith called up by a Diviner is described as hurried, unwilling to answer
    many questions, and not identifying himself as dead.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: A person with 'four eyes' may meet such a wraith without outward signs distinguishing
    it from an ordinary man.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:17
  text: Akunane says he sacrifices yams and plantains to his father's spirit so that
    he may not fall sick.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: The opening fragment says Genii of great Baobab trees of Bornu kill those
    against whom they have a grudge by a blow across the face.
  category: action
  evidence_refs:
  - ev:12
