candidate_motifs:
- id: motif:1
  label: Ascent to the sky after fear of parental rejection
  taxonomy_refs:
  - ascent
  basis: Both Eyo and 'Mi decide not to remain on earth and to go up to the sky to
    Osaw or Obassi Osaw after fearing hatred, deception, or killing by their father.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage states their intention to ascend but does not narrate the
    completed ascent within the supplied excerpt.
- id: motif:2
  label: Status reversal between sons
  taxonomy_refs:
  - divine_parent_child
  basis: After 'Mi settles the father's case, Nsi rejects Eyo as the unloved son and
    reassigns 'Mi as the good son who shines at night.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The taxonomy reference is broad; the passage clearly supports parent-child
    status reversal, but a specifically divine interpretation depends on the wider
    Obassi/Nsi context.
- id: motif:3
  label: Compensatory gifts settle a long case
  taxonomy_refs:
  - sacred_exchange
  basis: "'Mi brings cloth, tobacco, and palm wine to Obassi's town; the goods are
    accepted as payment and the case is declared finished."
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: The exchange is explicitly judicial or compensatory; the passage does
    not itself call the exchange sacred.
- id: motif:4
  label: Contrasting heat, night light, and darkness among sons
  taxonomy_refs:
  - duality
  basis: Eyo is associated with excessive heat and burning plants; 'Mi is associated
    with soft light at night; Ejirum is named Darkness and remains on earth.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:9
  confidence: medium
  cautions: The passage does not explicitly identify Eyo and 'Mi as particular celestial
    bodies in the supplied excerpt.
- id: motif:5
  label: Mischievous sons create fatal liability for their father
  taxonomy_refs: []
  basis: The first and second sons, already described as thieves, secretly add shot
    to their father's gun, causing him to kill a cow and face a demand for death.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: No specific comparative taxonomy reference is assigned because the passage
    gives theft and tampering but not an explicit trickster label.
- id: motif:6
  label: Etiological explanation of red and stormy sunset
  taxonomy_refs: []
  basis: The second tale is introduced by the title, 'Why the Sunset is sometimes
    Red and Stormy,' and begins with a narrative involving Obassi Osaw, Obassi Nsi,
    and Obassi Nsi's sons.
  evidence_refs:
