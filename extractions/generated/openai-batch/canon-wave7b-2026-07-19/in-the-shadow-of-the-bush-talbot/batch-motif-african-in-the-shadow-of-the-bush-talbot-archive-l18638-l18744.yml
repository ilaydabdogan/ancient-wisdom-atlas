canonical_text:
  quote: ''
  summary: 'The passage concludes one tale in which ''Mi receives a house, people,
    and goods from Isse, settles his father''s long case before Obassi Osaw, retrieves
    his mother, and is reclassified by Nsi as the good night-shining son while Eyo
    is rejected as too hot. Both Eyo and ''Mi decide to leave earth and go up to the
    sky to Osaw, leaving Nsi with Ejirum, Darkness. The passage then begins a tale
    titled as an explanation of red and stormy sunset: Obassi Osaw and Obassi Nsi
    live apart; Obassi Nsi''s first two sons are thieves, tamper with his gun, and
    cause him to kill a cow, leading the cow''s owner to demand his death while the
    third son pleads that he is still small.'
  language: English
  quote_policy: summarized
