canonical_text:
  quote: ''
  summary: 'The passage first explains stars as connected with Iku''s bright eyes
    taken by Ebopp to Obassi''s town, and explains the moon''s brightness by children
    gathering fragments into a box. It then begins a tale titled as the origin of
    the two biggest stars: Obassi Osaw favors two sons and persecutes the third, Ndifemm.
    Ndifemm succeeds in trapping animals, survives a pit trap through advice from
    a brother, Porcupine, Dassie, and his mother, is revealed alive in Egbo robes
    after being mourned as dead, and later retrieves a cow from Thunder town using
    a horn given by his mother. The passage breaks off as Ndifemm recognizes his father''s
    continuing intent to kill him and asks his mother whether she will die with him.'
  language: English
  quote_policy: summarized
