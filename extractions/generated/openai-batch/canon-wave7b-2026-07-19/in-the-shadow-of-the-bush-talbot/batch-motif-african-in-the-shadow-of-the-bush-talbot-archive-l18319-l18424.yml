canonical_text:
  quote: ''
  summary: 'The passage ends one tale in which Ndifemm and his mother die inside Obassi''s
    eyes and become two large stars. It then begins the tale ''How the Sun came into
    the Sky'': Afion is placed in the fatting-house, ritually brought out after four
    months, and later visited by Eyo, the Sun, who lives on earth near the great water.
    Eyo asks to be her sweetheart, is refused, kills her, covers her body, and begins
    lifting himself into the sky while a small boy witnesses the events and reports
    them to her parents.'
  language: English
  quote_policy: summarized
