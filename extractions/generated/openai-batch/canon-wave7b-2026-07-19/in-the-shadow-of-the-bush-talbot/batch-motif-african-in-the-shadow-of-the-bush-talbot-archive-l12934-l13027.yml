canonical_text:
  quote: ''
  summary: 'The excerpt first mentions feared Ojo river-folk who live in river-bed
    houses, take human form, and may seize people for Animm. It then gives the beginning
    of the story “Ada the Forest Demon”: the hunter Awsang Atikawt boasts that he
    will kill elephants destroying farms. Two elephant Efumi provoke him, ruin his
    farm, and are pursued. When overtaken by a stream they change to human form and
    promise compensation, but afterward use Juju and heavy rain to erase his road.
    Lost in unfamiliar bush, Atikawt reaches the splendid house of a Forest Woman,
    surrounded by human skulls and bones. A little lame girl warns him that her mistress
    kills and eats visitors, gives him edible clay, and instructs him not to eat the
    mistress’s food.'
  language: English
  quote_policy: summarized
