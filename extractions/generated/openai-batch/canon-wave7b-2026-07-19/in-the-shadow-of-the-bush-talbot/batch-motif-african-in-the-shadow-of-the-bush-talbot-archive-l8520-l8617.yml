canonical_text:
  quote: ''
  summary: The passage gives several Mbabong folly anecdotes. In the first, a poor
    young man promises a cow for his mother's funeral, treats a cave buffalo as the
    sent cow, snares it with a rope tied to his waist, and is dragged to death. The
    narrator adds a prudent alternative and says 'Mbabong' becomes a contemptuous
    term. In the second, a Mbabong man watches a friend die after making an unnecessary
    final leap while climbing a palm with an nded loop; he repeats the act and also
    dies, producing a proverb. A third anecdote begins with a Mbabong hunter continuing
    to shoot a dead antelope, but the excerpt breaks off mid-scene.
  language: English
  quote_policy: summarized
