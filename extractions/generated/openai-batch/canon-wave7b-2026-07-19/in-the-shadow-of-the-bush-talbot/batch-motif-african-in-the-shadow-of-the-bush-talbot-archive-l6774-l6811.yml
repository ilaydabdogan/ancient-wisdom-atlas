  quote: ''
  summary: 'The passage reports Ekoi birth beliefs: little children are said to have
    reincarnated into families, to require gentle and harmonious treatment, and to
    leave the earth if the household is quarrelsome. It also describes a family celebrating
    newly born twin sons with singing, tomtoms, and okan-kan so that the newborns
    will feel welcomed and not go back whence they came.'
