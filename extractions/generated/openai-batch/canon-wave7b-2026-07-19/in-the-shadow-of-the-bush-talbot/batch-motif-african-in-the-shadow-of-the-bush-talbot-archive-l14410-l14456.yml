  summary: The passage describes a rule that Nkundak tail feathers may be worn only
    by a man who has killed an enemy, then narrates an incident in which a Juju image
    is used to identify witchcraft. A childless foreign wife is accused after several
    men die; her husband forces her before the image, she appeals to the narrators,
    another woman comforts her, and the accused woman and her sister later follow
    the narrators and live under white oversight.
