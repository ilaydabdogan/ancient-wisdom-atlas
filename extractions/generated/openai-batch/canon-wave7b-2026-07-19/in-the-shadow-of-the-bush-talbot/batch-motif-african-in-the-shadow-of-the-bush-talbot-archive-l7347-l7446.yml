canonical_text:
  quote: Fruits, flowers, vegetables, and even fungi, might, on the prayer of the
    childless, open
  summary: 'The passage describes Ekoi birth customs: postnatal protections, infant
    feeding and medicine, naming by birth circumstance, divinatory renaming when a
    child sickens, ancestor reincarnation beliefs, apotropaic names, shrine pilgrimage
    for childbirth, and legends in which plants or fungi open to provide children.
    The narrator explicitly compares the flower and fruit birth belief with Adonis
    vegetation-birth traditions.'
  language: English
  quote_policy: quoted
