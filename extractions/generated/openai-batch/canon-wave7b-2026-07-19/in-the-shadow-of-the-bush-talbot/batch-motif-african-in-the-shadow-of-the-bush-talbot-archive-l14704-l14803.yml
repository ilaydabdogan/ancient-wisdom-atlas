canonical_text:
  quote: ''
  summary: The passage describes Ekoi village amusements, age-classes, club membership,
    initiatory ordeals, bush-path ritual settings, circumcision prerequisites, secrecy
    around bull-roarers and stilt walking, water-use rules for purification, and the
    beginning of an origin account for stilt walking involving Awo Ntui Ane of old
    Oban.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman who has left her husband or whose husband has died may not wash in
    the white water; she washes in black water for purification.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The white spring or white water is to be kept clean for drinking and cooking.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ekoi village life is described as containing frequent weddings, births, exits
    from the fatting-house, Juju plays, club feasts, and age-class feasts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An Ekoi age-class, called Ekan in the singular and Nkan in the plural, consists
    of people of one sex born within the same three years.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The age-class is described as a self-governing community that can watch over
    and penalize the conduct of its members.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At about fifteen years of age, age-class members usually ask an influential
    man to become their president; if he accepts, he gives them a name and power to
    play the club drums and Okankan, and they provide farm work and other services
    in return.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A boy of rich parentage may have club admission fees paid while young and
    be counted an honorary member before later initiation into the mysteries.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Postulants are theoretically beaten before a club’s mysteries are unveiled;
    more important clubs have more painful initiatory rites, though some allow fines
    in place of the ordeal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Most clubs hold initiatory ceremonies and secret rites at a place in the bush
    near the entrance to the town, reached by a winding path cut through thick bush.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Split palm leaves form arches over the initiation path; these arches are usually
    seven in number.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Before each arch, members armed with whips or rods stand ready to flog postulants,
    who run through the path at high speed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Before the club initiation ceremony, a youth must have undergone circumcision,
    usually performed a few weeks after birth by an old woman of the town.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: If a boy is sickly, circumcision may be deferred until childhood or later,
    after which he is confined in the fatting-house for three or four months.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Some clubs use bull-roarers called Enyara Akum, glossed as the dark things
    of the clubs.
  category: object
  evidence_refs:
  - ev:9
- id: obs:15
  text: The bull-roarers were formerly played only in secret, and women were not allowed
    to see them or know the cause of their sound.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: Walking on stilts was another guarded mystery that women were not allowed
    to see.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: The passage begins an origin account for stilt walking in old Oban town, naming
    an old man, Awo Ntui Ane, who works in a yam farm, notices the earth is very hot
    in the dry season, and cuts a piece of stick.
  category: sequence
  evidence_refs:
  - ev:11
