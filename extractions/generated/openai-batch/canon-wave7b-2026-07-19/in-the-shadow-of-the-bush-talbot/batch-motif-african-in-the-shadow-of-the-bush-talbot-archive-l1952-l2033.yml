canonical_text:
  quote: ''
  summary: The passage describes rules concerning powerful Jujus, especially restrictions
    on women touching principal Jujus; attributes and cult signs of Obassi Nsi and
    Obassi Osaw; household sacred emblems in the central atrium; daily washing and
    prayer before the newly risen sun; water invocations to the two deities; ceremonial
    precedence of their names; and communal protective prayers at the new moon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A priest tells buyers of a strong Juju to care for it and not allow wives
    to touch it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women are said never to touch Bigui or Mfam, because the Juju would catch
    them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Obassi Nsi is described as originally feminine and as founder and protector
    of a town set apart for women in a referenced story.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The central atrium of almost every compound contains a small group usually
    consisting of a growing tree, carved post, and sacrificial stone sacred to one
    or other deity.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Many of the central-atrium groups are dedicated to Obassi Nsi and are identified
    by coco yams; those of Obassi Osaw are identified by epiphytic ferns on the tree
    trunk.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Before beginning the day's work, adherents of the old custom take a calabash
    of water into the central court to wash.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After washing, practitioners lift their eyes to the newly risen sun and pray
    for freedom from danger that day.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The sun is said to be deputed by Obassi to receive prayers offered on earth
    and carry them before him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Water is taken in the right hand and held high while Obassi Osaw is invoked;
    then water in the left hand is poured on the ground to ask protection from Obassi
    Nsi.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In Juju and ancestor-worship ceremonies, the names of the two deities must
    first be invoked.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: When the new moon is seen, every man, woman, and child comes out and prays
    not to see bad things or have trouble come to them.
  category: speech
  evidence_refs:
  - ev:9
