canonical_text:
  quote: ''
  summary: A chief orders people to catch Nshum with nets, but he escapes. Later,
    lazy people gather in the bush and harm or drive away others. A hunter shoots
    a creature in a great tree, identifies it as Nshum, and brings the body before
    a charm and a Diviner. The Diviner declares that Nshum is no longer human but
    a wild animal, so he may be killed and eaten. The passage explains this as the
    reason Nshum became lawful to eat and why the name is applied to lazy people.
  language: English
