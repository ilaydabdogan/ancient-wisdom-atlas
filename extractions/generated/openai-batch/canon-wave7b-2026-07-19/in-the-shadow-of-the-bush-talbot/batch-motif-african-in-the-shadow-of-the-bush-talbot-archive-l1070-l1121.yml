  summary: 'A travel narrator describes a false alarm in which his wife thinks a reptile
    is trapped in her boot, but a soap tablet falls out. He then describes actual
    snake dangers in the same rest-house: a snake descends onto Bimba''s mosquito
    net, a roof search finds seven cobras, and severed snake sections fall through
    the palm-stem roof and writhe across the floors.'
