canonical_text:
  quote: ''
  summary: A beautiful woman comes to Atikawt’s town with food and rich clothing,
    claiming she has fallen in love with him. Atikawt’s witch wife recognizes her
    by magic as Ada Etim Agbo Etum, the Forest Ruler and monster from whom Atikawt
    had escaped, but Atikawt dismisses the warnings. The wife secretly instructs two
    fierce witch dogs to guard him. At night Ada, disguised as the woman, twice strikes
    her belly to bring out a red-hot pointed iron to kill the sleeping Atikawt; both
    times the dogs attack and wake him. After the second interruption, the cock crows,
    and Ada announces she must go home, asking Atikawt to chain the dogs and lead
    her away.
  language: English
  quote_policy: summarized
