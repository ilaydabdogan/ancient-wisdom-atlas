canonical_text:
  quote: ''
  summary: 'The passage describes a Juju ceremony involving family fetishes, an upright
    iron spear, an impaled tortoise, a black cock intended for sacrifice, and Atop
    applying egg to the spear and dolls for a rite meant to restore his health. The
    Juju is identified as Ntuanto, glossed as Soul or Outbreathing. The narrator then
    introduces a legend explaining why cocks and tortoises are sacrificed to Jujus:
    during famine, Tortoise finds a ghost farm, secretly takes plantains, refuses
    to bring Cock, follows the ghosts toward their town, hides near the entrance,
    and is nearly detected when ghosts smell fresh meat.'
  language: English
  quote_policy: summarized
