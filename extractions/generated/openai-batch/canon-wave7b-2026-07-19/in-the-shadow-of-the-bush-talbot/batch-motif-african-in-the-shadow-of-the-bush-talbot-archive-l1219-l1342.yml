canonical_text:
  quote: ''
  summary: The passage describes Ekoi threshold charms and ghost offerings at town
    entrances, then gives a folktale explaining ghost sacrifices before towns. Two
    tortoise children follow drumming to a ghost town, defeat many ghosts in wrestling,
    are killed by a twenty-headed ghost wrestler, are revived by a ghost girl with
    magic leaves, escape search by ants and river water after invoking Obassi Osaw,
    and delay the pursuing ghosts with seven plantains that the ghosts cannot count.
  language: English
  quote_policy: summarized
