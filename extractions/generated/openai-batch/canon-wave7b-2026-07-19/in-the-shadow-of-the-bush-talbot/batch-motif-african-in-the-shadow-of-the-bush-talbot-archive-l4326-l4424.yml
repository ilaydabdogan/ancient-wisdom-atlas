canonical_text:
  quote: ''
  summary: Leopard asks Obassi to send Lamb on a message so Leopard can catch him.
    Lamb refuses the messenger role, and Leopard instead hides in a box brought by
    Obassi's men; a canoe-man warns Lamb, who locks the box and drowns Leopard. Later
    Lamb takes Obassi's rich clothes, hangs them on a cotton tree, describes the tree
    as a great Juju, and lures Obassi to it; while cutting the tree, Lamb causes it
    to fall and kill Obassi. Lamb then sends his mother upward on a rope from the
    sky, later confesses publicly that he killed Obassi because Obassi would have
    given him to Leopard, and climbs the rope into the sky. The narrator explains
    this as the reason a young sheep is not sacrificed. The passage ends with a fragment
    stating that Obassi Osaw and Obassi Nsi made all things between them.
  language: English
  quote_policy: summarized
