canonical_text:
  quote: ''
  summary: The passage tells how, at the beginning of the world, Obassi Osaw made
    everything but withheld fire from people on earth. Etim 'Ne sends the boy to ask
    for fire, angers Obassi, and later fails to gain pardon. The boy then vows to
    bring fire, by theft if necessary, enters Obassi's household as a useful servant,
    is sent to the wives' house where fire is kept, and eventually takes a brand,
    lights the lamp, and conceals the brand in plantain leaves and his cloth. The
    supplied excerpt ends during the concealment/action.
