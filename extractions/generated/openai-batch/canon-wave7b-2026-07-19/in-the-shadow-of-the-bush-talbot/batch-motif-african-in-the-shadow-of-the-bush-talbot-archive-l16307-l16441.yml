canonical_text:
  quote: ''
  summary: The passage describes Ekoi load carrying and mail-running, bodily and facial
    marks, body painting, coiffure patterns, colored facial designs sometimes filled
    with Nsibidi writing, and general comments on memory, senses, eloquence, gesture,
    and humour.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ordinary mail-runners are described as sometimes carrying 50 lb. loads and
    making the 80-mile journey to Calabar and back in three days, usually waiting
    for return mail unless they need to return at once.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men are described as carrying heavy loads on their shoulders, secured by a
    strap around the forehead; women and girls carry loads on their heads, including
    firewood loads said often to exceed 60 lb.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Artificial disfiguring of face or body is said to be extremely rare among
    the Ekoi, though the two front incisors were formerly filed to form an inverted
    V; the dental custom is described as dying out.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: In earlier times, three small circles of concentric rings were cut along the
    side of the face from the temple downward, and a mixture of ground charcoal and
    palm oil was rubbed into them and periodically renewed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that the Ekoi race mark changed to one larger circle when
    the Ekoi met the Efiks, while noting a competing claim that the Efiks adopted
    this altered mark from the Ekoi; the custom is also described as dying out.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the interior, children and young girls are said still to have their bodies
    painted with designs made from black vegetable dyes, especially dye extracted
    from the rhizome of the flower called Ibiri Nsi; small tattooing and ghost marks
    are also mentioned.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Children and young girls are described as wearing varied coiffure designs
    made by shaving the head, allowing uniform short regrowth, tracing an elaborate
    pattern in chalk, and leaving that pattern standing against a clean-shaved background.
  category: action
  evidence_refs:
  - ev:7
  - ev:10
- id: obs:8
  text: Young women and children ornament their faces, especially foreheads, with
    colored designs; outlines are often filled with Nsibidi writing, and sometimes
    a girl’s whole life-history is proclaimed in this way.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The facial and forehead patterns are said always to be traced by a female
    relative, usually the decorated person’s aunt.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Ekoi are characterized by the narrator as intelligent, attentive to subjects
    of interest, having strong memories and keen senses, and being eloquent speakers
    who accompany words with expressive tone and gesture.
  category: attribute
  evidence_refs:
  - ev:9
