canonical_text:
  quote: ''
  summary: The passage moves from a ritual offering connected with divination to an
    etiological account of why the Osing tree or its spirit no longer speaks directly
    to humans. Osing and Ojje once accompany Obassi Osaw. Obassi disguises himself
    as a man and questions farm workers; Osing teaches one man how to answer more
    modestly. Obassi then restricts Osing’s direct speech, allowing communication
    only through seed-shell divining charms. Ojje keeps secrets and remains in Obassi’s
    fellowship. A second explanation begins with a poor man during a feast for the
    dead.
  language: English
  quote_policy: summarized
