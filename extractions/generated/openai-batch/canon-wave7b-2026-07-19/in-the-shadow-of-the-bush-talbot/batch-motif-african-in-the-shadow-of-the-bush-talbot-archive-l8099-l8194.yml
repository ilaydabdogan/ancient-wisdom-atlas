canonical_text:
  quote: ''
  summary: The passage concludes a tale in which Pig finds Crab during a water crisis,
    gives Crab meat and a gun, and Crab restores the streams after requiring a hunting-share
    rule. The narrator explains this as the reason for an Ekoi custom of distributing
    hunted meat. The passage then describes Ekoi hunting methods, tracking, dog rites,
    and a tale explaining why hunting dogs seek porcupines after Dog steals Francolin's
    eggs and is exposed by Porcupine.
  language: English
