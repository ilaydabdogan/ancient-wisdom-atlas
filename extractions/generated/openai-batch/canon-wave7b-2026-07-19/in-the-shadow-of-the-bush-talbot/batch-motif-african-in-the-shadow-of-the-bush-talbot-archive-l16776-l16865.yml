canonical_text:
  quote: ''
  summary: The passage reports several court-related accounts concerning wives, slaves
    or “members,” mortuary sacrifice, and ritual power. A runaway wife accuses chief
    Nataba of witchcraft involving a strip cut from her gown and placed before a Juju.
    A former slave-member reports that his former master planned to kill members covertly
    so they would serve him among the ghosts, echoing an older practice of sacrificing
    slaves at a chief’s grave. A later account describes the Juju priest Erim performing
    at a dance with bells, boughs, and staff, followed by testimony from Ekpiri Otu
    that he possessed poisonous and protective magic.
  language: English
  quote_policy: summarized
