  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The ghosts use another pipe to call Nki back, and Nki answers by shaking the
    crab's claw instead of speaking.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Etuk refuses to hold the claw for Nki, but He-goat takes it.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The crab's claw answers from He-goat's hand, holds tight, and the ghosts follow
