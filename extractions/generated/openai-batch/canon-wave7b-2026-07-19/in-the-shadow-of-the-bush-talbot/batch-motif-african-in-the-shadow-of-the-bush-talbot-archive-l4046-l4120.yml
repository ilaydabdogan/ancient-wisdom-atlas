canonical_text:
  quote: It is because ghosts can hear when you play upon such claws, that crab is
    used in many Jujus.
  summary: Nki is hidden among ghosts by his sister, but the ghosts detect the presence
    of a living person. A crab-claw trumpet kills him when blown and later brings
    him back to life. Nki steals the magic claw, substitutes another crab claw, uses
    the instrument to put the ghosts to sleep and escape, then diverts pursuit onto
    He-goat. The ghosts punish He-goat, explaining why goats smell bad, and the narrator
    connects crab claws with Juju practice.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The sister hides Nki in her house while she prepares an evening meal, and
    a friend comes to help make fu-fu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The friend says there is a smell of fresh flesh, and the narrator states that
