  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The ghosts bring a small trumpet-like object made from a crab's claw, say
    that any live person there should die, blow the instrument, and Nki dies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the evening meal, the ghosts play the crab's claw again; Nki comes to
    life, and the ghosts hang the trumpet on the wall and leave.
