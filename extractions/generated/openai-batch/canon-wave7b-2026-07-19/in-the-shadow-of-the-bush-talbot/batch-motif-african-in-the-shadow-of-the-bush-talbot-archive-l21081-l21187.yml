canonical_text:
  quote: ''
  summary: The passage catalogs named Ekoi and neighboring club associations, describing
    their names, dances, regalia, membership restrictions, fines, death payments,
    succession, instruments, and occasional coercive or punitive actions involving
    members and non-members.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The club named “Okpe etuma” is explained by saying that the Okum must never
    stand still and is accompanied by two girl attendants carrying looking glasses,
    one before and one behind.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In “Orui,” a rule-breaking member is told to go and come back when sent to
    fetch the fine ordained as punishment; the name is also said to have a secondary
    meaning of back-biting during his absence.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In “Ikadum,” the Okum wears a skull; the club gave war dances, especially
    after members returned with enemies’ heads; meetings were held in the nearby bush,
    and guns were fired at celebrations.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In “Ayunga,” the family of a deceased member must pay a goat, yams, and palm-wine
    to the club; the eldest son is elected in his father’s place; the society formerly
    served as executioners for people condemned by the yepotma.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: For “Esere Ise,” no one was willing to explain the meaning; the text says
    the words appear to point to enforcing trial by ordeal, while the functions given
    were those of a dancing club.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: "“Ukwa” is described as the lodge of a Calabar club whose members dance with
    long swords to the accompaniment of two large drums."
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: "“Adia” is described as a dining club whose name teaches that a guest being
    entertained should remember that his own turn to host will come soon."
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: "“Erong-Isonn” is described as an Efik dancing club in which rattles are worn
    above the knee when plays are given."
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: "“Ukai ke isonn obio, Oban” is described as an Efik dancing club started by
    an age class whose members had been heavily fined after trouble with the Chiefs
    of Oban."
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: In “Nchibbi achi ebai,” the Okum wears a large two-faced head, one side male
    and the other female, decorated with Greater Plantain-eater feathers; dancers
    hold matchets and guns and fire the guns at intervals.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage states that no woman can belong to the listed older clubs, and
    only free-born people past middle age may belong to any except the last mentioned.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: For the clubs prominent at the time of writing, any free-born man or member
    can join, while women may also belong to the first.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: In “Ikkpai,” every member carries a whip at dances, and the Okum wears two
    white feathers above a carved head.
  category: object
  evidence_refs:
  - ev:13
- id: obs:14
  text: "“Utap-Anam” is explained as threatening fines for injury to the club; it
    began with two age classes, excludes women from dances and from seeing its instruments,
    uses long hollow wooden pieces rubbed together to make a loud harsh sound, and
    has juju worship connected with its rites."
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:15
  text: In “Ekang,” when the Okum comes out, young palm leaf and other prickly leaves
    are tied around him; if he meets a non-member, he catches him so the leaves scratch
    and hurt him.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: "“Ekkpo Njawhaw,” glossed as “Ghosts break,” is described as an Ibibio-club
    lodge in which members may bring the Okum to a non-member friend’s house; if immediate
    entertainment is not provided, plates and calabashes are broken, and the damage
    is compared to objects broken for ghosts at a grave."
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: "“Obbonn,” glossed as “Chief” in Efik and Ekoi, is a club that dances at night,
    and no woman may be present."
  category: setting
  evidence_refs:
  - ev:17
