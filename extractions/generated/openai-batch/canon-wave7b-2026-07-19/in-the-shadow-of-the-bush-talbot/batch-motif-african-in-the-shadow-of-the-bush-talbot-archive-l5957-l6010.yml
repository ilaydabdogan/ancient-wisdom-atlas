canonical_text:
  quote: ''
  summary: A woman kills a threatening beast and the beast’s two sons while her husband
    hides or flees. The husband later tries to take the best meat and leave her only
    the heads. The wife appeals to Obassi, who hears the case, confirms the husband’s
    admission, and rules that a man may not claim property for which his wife risked
    her life. Obassi also allows her to keep or take the children and the passage
    explains this as the basis for a custom concerning women leaving husbands.
  language: English
  quote_policy: summarized
