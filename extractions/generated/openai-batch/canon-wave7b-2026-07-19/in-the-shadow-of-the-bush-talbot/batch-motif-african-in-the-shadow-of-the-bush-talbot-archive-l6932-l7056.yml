canonical_text:
  quote: ''
  summary: The passage describes the Juju Isse Obassi Nsi, used to protect pregnant
    women and women whose barrenness is attributed to witchcraft. Its exterior and
    interior components, offerings, night lamp, and required iron are described. A
    court case then recounts a suspected woman's Esere-bean ordeal, repeated infant
    deaths in her son's family, accusations by Aya, and the placing of the Juju to
    protect a pregnant daughter-in-law from the accused woman's alleged witchcraft.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Isse Obassi Nsi is identified as the principal Juju used to protect women
    about to become mothers and women whose barrenness is attributed to witchcraft.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The Juju is described as having two parts: a double string of knotted palm-leaf
    strips over the woman''s room door and a little shrine inside the room.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The interior shrine contains a small lamp that is unlighted by day and burns
    all night, and corn, meat, and oil are offered to the guardian spirit.
  category: object
  evidence_refs:
