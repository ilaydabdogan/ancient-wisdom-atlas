canonical_text:
  quote: ''
  summary: The passage introduces legal protection of women's property and presents
    etiological stories about relations between men and women. In one, Obassi Osaw
    and Obassi Nsi establish separate towns for men and women; after conflict, men
    agree to live in the women's town, explaining male service to wives. In another,
    a world first populated only by women receives man as compensation after Obassi
    Nsi accidentally kills a woman, explaining men as women's servants. A third story
    begins with a hunter pursuing an antelope into an underground ghost town, where
    he is captured, tends ghost children, and is rewarded with the ability to understand
    beasts, under a fatal secrecy warning.
  language: English
  quote_policy: summarized
