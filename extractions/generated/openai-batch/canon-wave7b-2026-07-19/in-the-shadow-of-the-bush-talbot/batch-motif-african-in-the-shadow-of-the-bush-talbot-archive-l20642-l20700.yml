canonical_text:
  quote: ''
  summary: A cruel stepmother proposes a charm to discover who stole a goat. A diviner
    brings a long rope to the river, where the stepmother secretly uses a charm to
    cross safely while the young girl falls from the rope into the water and is caught
    by a crocodile. The girl is later revealed to be alive beneath the water in the
    house of a were-crocodile, serving as a slave. When sent to drive away a palm-wine
    climber from a riverside palm tree by throwing an axe, she avoids hitting him;
    he sees her and reports this to her father, who brings the matter before the chief.
  language: English
  quote_policy: summarized
