canonical_text:
  quote: ''
  summary: 'The passage first describes increasing commerce, the absence and attempted
    revival of markets, and folklore memories of markets and a lawless earlier condition.
    It then gives the tale “Why Ntabe warred no more”: Ntabe, a man who makes war,
    is confronted by his wife Asim Eji through a public meal in which she hides a
    man’s skull under fu-fu, causing him to recognize her act as advice to give up
    killing men and take another occupation. The supplied passage ends as Ntabe enters
    an inner room and takes down an unspecified large item.'
  language: English
  quote_policy: summarized
