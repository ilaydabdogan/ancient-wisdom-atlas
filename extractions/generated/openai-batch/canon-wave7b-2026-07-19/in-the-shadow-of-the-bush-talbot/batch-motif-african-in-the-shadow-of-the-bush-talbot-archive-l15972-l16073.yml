canonical_text:
  quote: ''
  summary: The passage continues a tale in which a woman brings a dead child back
    to the mother’s room. The child’s mother and father grieve, and a blue bird repeatedly
    sings that Menge Marri took the child to the river, drowned her, used her to dam
    the river, and returned the body. A town meeting hears the accusation; Menge Marri
    says she killed the child because she had none of her own. The meeting orders
    that she die in the same way, and the narrator states this as the origin of a
    like-for-like homicide penalty. The passage then gives legal and ethnographic
    notes on inheritance, property between spouses, seizure of a woman as debt payment,
    a child’s successful property claim against her father, and temperance observations.
  language: English
  quote_policy: summarized
