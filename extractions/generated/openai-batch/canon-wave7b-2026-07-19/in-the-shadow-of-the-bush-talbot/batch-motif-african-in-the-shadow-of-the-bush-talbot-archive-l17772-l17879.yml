canonical_text:
  quote: Now the python stone shines so that everyone can see to go wherever he chooses.
  summary: A crocodile offers a shining stone for the price of a whole farm. Etuk
    refuses, but Njomm gives his plantain farm for the stone so that darkness may
    be turned to light. Njomm sets the stone above his lintel and becomes hungry because
    he has sold his food source. Etuk and the townsfolk refuse him food. Njomm meets
    Effion Obassi by a river-side palm tree, receives three palm kernels from him,
    and later gives him the shining stone after declaring that the earth folk do not
    love him.
  language: English
