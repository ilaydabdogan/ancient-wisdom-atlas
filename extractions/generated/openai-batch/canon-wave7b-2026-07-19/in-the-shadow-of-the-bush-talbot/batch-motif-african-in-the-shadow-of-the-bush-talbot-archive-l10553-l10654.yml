canonical_text:
  quote: Why Crab's Claw is Sacrificed.
  summary: 'A framed animal tale explains why crab is included in Juju sacrifices:
    Crab is wronged after a successful hunt, retaliates by causing a water shortage,
    is killed by Pig, and afterward Njokk orders crab to be used in offerings. The
    passage then describes crab''s claw ritual uses and an Oban witchcraft episode
    involving Akpambe, Ekuri Ibokk, a reported ghost, a grave investigation, and the
    burning of the exhumed body.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage introduces a story as an explanation for why crab's claw is used
    in sacrifices, and states that another version had already been given elsewhere.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lord Njokk, identified as Elephant, summons his people to come together on
    a certain day to hunt for him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Crab brings an old-looking gun, is mocked by the other beasts, and kills five
    antelopes while the others miss their targets.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The other beasts become angry, take Crab's kill, take his gun, and wreck the
    gun.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Crab tells Elephant's wives that Elephant wants food prepared with much pepper
    and native salt, and wants all water in the compound thrown away until fresh water
    can be fetched after his return.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Crab goes to his home by the river-side and drinks up all the water, so the
    stream runs dry.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The returning huntsmen eat the prepared food, become thirsty, find no water
    in the compound, and then find the river dry.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ise, the little grey duiker, is sent for water, sees Crab run to his hole,
    and reports this to Lord Elephant.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Etuk, the bay duiker, is sent next, but lies down and sleeps on the road.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Pig roots up Crab's hole, crushes Crab, and after Crab dies the water begins
    to flow again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Chief orders that anyone sacrificing to the Juju should put a piece of
    crab in the sacrifice.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says crab's claw is added to sacrifices, may be filled with Juju
    medicine and worn around the neck, and may be blown beside the Okum image because
    the Juju can hear the sound.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Akpambe is described as widely regarded as the strongest Juju for smelling
    out witchcraft, while Oban people still believe in the superior power of Ekuri
    Ibokk.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: After an Oban woman dies and is buried, people begin to fall sick and die,
    and this is attributed to witchcraft.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Juju image declares that every night it sees the dead woman's ghost rise
    from the grave, walk through town, and spread pestilence.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: The District Clerk and Station Carpenter investigate the grave, find a small
    hole, place peppered paper inside it, and the paper is gone the next day.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: The townspeople interpret the missing peppered paper as evidence that the
    ghost came out through the hole.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:18
  text: The town makes a large bonfire, digs up the body, and burns it.
  category: action
  evidence_refs:
  - ev:11
