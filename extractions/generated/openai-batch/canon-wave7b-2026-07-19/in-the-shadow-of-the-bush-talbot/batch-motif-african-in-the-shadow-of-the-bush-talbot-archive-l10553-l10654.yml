  evidence_refs:
  - ev:6
  confidence: high
  cautions: No supplied taxonomy family precisely matches this pattern.
- id: motif:4
  label: Body part of a killed culprit becomes ritual object
  taxonomy_refs:
  - sacrifice
  basis: Crab is killed, and afterward a piece of crab or crab's claw becomes part
