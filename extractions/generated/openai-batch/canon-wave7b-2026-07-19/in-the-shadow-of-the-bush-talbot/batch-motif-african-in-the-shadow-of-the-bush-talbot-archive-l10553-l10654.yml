candidate_motifs:
- id: motif:1
  label: Etiology of crab's claw in sacrifice
  taxonomy_refs:
  - sacrifice
  basis: The story is introduced as explaining crab's claw sacrifice, and it ends
    with the Chief ordering crab to be added to Juju sacrifices.
  evidence_refs:
  - ev:1
  - ev:7
  confidence: high
  cautions: The passage gives an etiological explanation within an ethnographic narrative;
    broader distribution is not established here.
- id: motif:2
  label: Wronged small animal retaliates by withholding water
  taxonomy_refs:
  - trickster_boundary
  basis: Crab is mocked and deprived of his kill, then deceives Elephant's wives and
    drinks the river dry, causing communal thirst.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage does not explicitly call Crab a trickster; this is a functional
    motif label based on actions.
- id: motif:3
  label: Death of the water-withholder restores water
  taxonomy_refs: []
  basis: After Pig crushes Crab, the water begins to flow again and is brought back
