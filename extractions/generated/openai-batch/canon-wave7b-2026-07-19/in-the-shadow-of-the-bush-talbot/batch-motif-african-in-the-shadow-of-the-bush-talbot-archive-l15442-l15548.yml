  quote: ''
  summary: The passage gives translated sayings and drum songs, explains a rule allowing
    chiefs to marry fatherless women with dowry supplied by town women, describes
    drum songs played by children and for visitors, notes types and uses of drums,
    and reports that after a great man's death the Egbo drum once signaled the search
    for and killing of a sacrificial victim to be placed in the chief's grave.
  language: English with Ekoi lexical lines/transliterations
