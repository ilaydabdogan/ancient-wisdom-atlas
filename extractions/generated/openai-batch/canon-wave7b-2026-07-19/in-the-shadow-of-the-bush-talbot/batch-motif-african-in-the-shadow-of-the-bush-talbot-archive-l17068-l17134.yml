canonical_text:
  quote: ''
  summary: Ngonne takes Ara, the daughter of her mistress Ome, to her sweetheart's
    house and mistreats the child. Ara is sent to scare birds from a farm, wanders
    to the river where her mother was lost, and calls for her. Ome emerges from the
    water with Crocodile's permission, comforts Ara, and later is captured in nets
    by townsfolk and brought home secretly. When Ara challenges Ngonne's withholding
    of food, Ome appears with a knife and kills Ngonne. The passage closes with an
    etiological comment about people watching slaves after Ngonne tried to destroy
    her mistress.
  language: English
  quote_policy: summarized
