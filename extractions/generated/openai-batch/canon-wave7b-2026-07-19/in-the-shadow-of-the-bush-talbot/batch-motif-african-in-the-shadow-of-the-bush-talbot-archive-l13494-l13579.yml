  summary: The passage describes an elephant hunt and camp, tracking signs of elephants
    near a river-loop campsite, travel through ebony-rich settlements, ritual objects
    at Oburekkpe reported by carriers as connected with human sacrifice and blood
    libations, and notes on Ekuri Eying's settlement history, shrine, juju masks,
    and mourning emblems.
