canonical_text:
  quote: ''
  summary: 'The passage introduces Ekoi religion as centered on ancestor cults and
    nature forces, names a Sky God and Earth God, describes numerous nature genii
    and supernatural beings in the bush, and focuses on sacred town trees with weaver-bird
    nests whose protection is linked to prosperity and fertility. The author interprets
    the bird-and-tree pairing as a wedding of sky and earth and describes painted
    symbols in an Egbo house at Mbeban: a double-headed axe, knobbed sceptre, and
    feather.'
  language: English
  quote_policy: summarized
