  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that drum language can be learned and used to interpret
    secret warning messages.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Two drums are generally beaten together, with the first leading and the second
    responding; one performer may beat both when necessary.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A drum message for the approach of a white visitor summons townsfolk from
    outlying farms and uses the term hawks for the visitor.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: A message containing the words monkey flesh and climb tree quickly is glossed
