canonical_text:
  quote: The town belongs to thee, great drum.
  summary: The passage describes Ekoi musical performance and the special status of
    drums, especially the revered great town drum. It records customs of saluting
    the drum, disputes over unauthorized drum use, and examples of drum language used
    for summonses, warnings, and coded messages involving hawk, monkey flesh, tree,
    and stream imagery.
  language: English with Ekoi terms and English glosses
  quote_policy: quoted
