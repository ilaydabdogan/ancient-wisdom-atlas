- id: obs:5
  text: By old custom, a stranger entering a town asks for the head chief; if the
    chief is absent, the stranger goes to the Egbo house and salutes the big drum
    by bending until the fingertips touch the ground.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Clubs compete to obtain drums with beautiful tone, and unauthorized playing
