canonical_text:
  quote: ''
  summary: 'The passage first concludes a prior tale: a boy’s wind-blown water game
    with an old nest prompts Obassi to teach his son and daughter to make a wooden
    canoe, take weapons, and travel downstream to the creek town of their black brother.
    It then begins “The Treasure House in the Bush”: after Obassi Osaw dies, Oro takes
    all property while Agbo remains poor in the sky. Hungry, Agbo descends by a road
    to earth, finds a hidden treasure house in the bush used by white people, repeatedly
    carries treasure back to the sky, and becomes rich. His wealth is discovered through
    measuring money with a basket; Oro learns the source, is shown the place, and
    later returns alone, where he is distracted by trying on rich robes. The passage
    ends mid-action.'
  language: English
  quote_policy: summarized
