canonical_text:
  quote: ''
  summary: 'The passage describes Ekoi carved, painted, and ritual objects along the
    Cross River: raised figures explained as Obassi Osaw, Obassi Nsi, Nimm/Snake,
    and related forms; an Abijang chief’s room with embedded skulls, a fermenting
    palm-wine pool, and an old wooden figure; a Nchofan children’s performance with
    decorated clothing, rattles, play-swords, and Nsibidi writing; a club drum with
    male, female, and Tortoise carvings explained through a story about Tortoise’s
    wisdom or as divine figures with Tortoise; drum songs; a chief’s dish used for
    visiting chiefs; a box preserving chiefs’ caps; and a pool for ghost libations
    with ritual objects.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raised decorative patterns are picked out in white paint, and raised figures
    are sometimes added; the figures are variously explained as Obassi Osaw, his wife,
    Nimm, Obassi Nsi, and related groupings.
  category: object
  evidence_refs:
  - ev:1
