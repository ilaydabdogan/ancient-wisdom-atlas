  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The drum carvings are explained either as personages from the story “How Obassi
    Osaw proved the Wisdom of Tortoise” or as Obassi Osaw, Obassi Nsi, and Tortoise
    representing attributes of the latter.
  category: speech
  evidence_refs:
  - ev:7
