    truthfully.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Makok invokes Oka to catch her if she killed the child or if she possesses
    an animal or other witchcraft inside her body.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Gunpowder is placed on the big knife of Oka, fire is applied beneath Makok's
