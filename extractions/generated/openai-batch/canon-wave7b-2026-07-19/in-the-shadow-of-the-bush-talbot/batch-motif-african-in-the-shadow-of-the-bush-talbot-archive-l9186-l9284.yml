  text: Abassi Nenkui testifies that he heard Nenkui accuse Njenamba of witchcraft.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Njenamba says her father swore a Juju oath that if any man wanted to marry
    her, the Juju should kill both her and her lover unless the lover paid a specified
    dowry of ebony logs.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Makok testifies that Okun Omin accused her of bewitching his child after the
    child died while he had been away in Calabar.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Makok says Okun Omin demanded that she swear before a powerful Juju such as
