canonical_text:
  quote: ''
  summary: A sequence of sworn testimonies describes accusations of witchcraft, poison
    ordeals with Esere, oaths before Juju powers, and an Oka Juju ritual involving
    pepper-corns, a knife, gunpowder, fire, and palm wine. The passage concludes with
    Nenkui's imprisonment and the decay of his compound, while a Juju tree remains
    flourishing among the ruins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker is warned not to go near a woman because she may bewitch him, then
    takes Esere at daybreak in the bush and says it does no harm because his heart
    is clean.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Njenamba testifies that her father accused her of witchcraft after she touched
    his eye while playing.
  category: speech
  evidence_refs:
