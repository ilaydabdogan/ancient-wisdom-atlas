canonical_text:
  quote: ''
  summary: 'The passage describes Ekoi government and legal procedure: towns are governed
    by councils of elders; anyone may summon a meeting and present a complaint; elders
    speak by right; a powerful chief may have influence but should not prevail against
    a clear case. Appeals may proceed from the elders to the Native Court and then
    to the District Commissioner. The Native Court is composed of representatives
    from different towns and is usually presided over by the Commissioner. The author
    also states that Ekoi self-government is extensive under the newer system and
    notes poisoning as a serious prevalent crime, often directed against suspected
    magicians.'
  language: English
  quote_policy: summarized
