canonical_text:
  quote: ''
  summary: The passage describes the secret Mariba or Etem-I-Ngbe ceremony of higher
    Egbo grades, the guarding of sacred images in a forest precinct, an incident in
    which two sisters are executed for unwitting trespass, restrictions on women’s
    membership, the grade-specific Okum Ngbe image, its two-faced male-female head
    interpreted as divine omniscience and bisexuality, and attendants bearing a whip
    and green boughs used in Ekoi life-cycle rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Members of the four higher grades who have paid full fees may join the Mariba
    or Etem-I-Ngbe ceremony, which is performed secretly in the depths of the forest
    and unveils successive mysteries.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mariba ceremony may also be performed at the funeral customs of very great
    chiefs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During Mariba, sacred images are carried to a bush location where a small
    hut of green boughs has been built, and sentries keep intruders away from the
    spot.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two young sisters unwittingly entered the sacred precincts, were caught by
    sentries, brought before Egbo, condemned to death, and hanged almost immediately.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sisters’ brother, a member of the highest grade, was allowed to witness
    their death and carry their bodies home.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rich and influential women may be honorary members of all grades, but are
    not full members and are not allowed to know the mysteries.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Each grade has particular dances, tunes, and an Okum Ngbe or Egbo image that
    is not supposed to appear unless directly inspired to do so.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Egbo image is a figure robed from crown to heel in the grade’s proper
    colour, with eyeholes and a wooden skin-covered head-framework often shaped with
    two faces, one male and one female.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The narrator states that the two-faced head represents divine omniscience
    looking to future and past and the bisexual character in older conceptions of
    Obassi Osaw and Obassi Nsi.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Okum runs up and down accompanied by two attendants wearing close-fitting
    knitted garments, usually red, yellow, and white.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: One attendant carries a rod or whip described as the symbol of the society’s
    power, including a claimed right under native law to flog certain offending non-members
    to death.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The other attendant carries symbolic green boughs; green leaves are used at
    important occurrences from birth onward and are drawn over a dying man’s face
    so his spirit may pass peacefully to the next world.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: Different towns compete over which can produce the most gorgeous robes for
    the images.
  category: relationship
  evidence_refs:
  - ev:10
