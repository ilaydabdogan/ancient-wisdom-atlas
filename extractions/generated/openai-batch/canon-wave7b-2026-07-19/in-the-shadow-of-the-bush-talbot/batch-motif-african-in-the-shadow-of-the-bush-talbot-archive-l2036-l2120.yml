canonical_text:
  quote: ''
  summary: The passage describes a sacred lake near Nsan, said to be haunted by dead
    Ekoi ghosts and inhabited by a Nature Juju on which local prosperity depends.
    People avoid the site, especially the fern belt and water edge. The water must
    not be disturbed, because lake guardians may bring famine or pestilence. Crocodiles
    at the lake are regarded as sacred manifestations of guardian spirits, ghosts
    are said to drift over the water at night, and a python crossing the lake is said
    to share guardianship. The passage then states that snake and crocodile cults
    are closely connected in Ekoi mythology, including Egbo house imagery and Cult
    of Nimm practices toward snakes.
  language: English
  quote_policy: summarized
