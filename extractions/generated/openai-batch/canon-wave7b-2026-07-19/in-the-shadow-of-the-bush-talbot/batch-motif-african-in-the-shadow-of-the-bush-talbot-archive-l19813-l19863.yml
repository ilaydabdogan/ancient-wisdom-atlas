canonical_text:
  quote: ''
  summary: The passage contains the tale “Why Frog and Snake never play together,”
    in which Frog-child and Snake-child play together until their mothers warn them
    against one another; Frog is told Snake people have poison, while Snake is told
    that snakes customarily eat frogs. The children recognize that both have been
    instructed, and Frog and Snake never play together again. The passage then begins
    “How the First Hippopotami came,” where Elephant has a beautiful daughter sought
    by many beasts; a great river fish, Njokk Mbonn, asks to marry her, Leopard becomes
    angry and gathers his family to fight, and Antelope warns Fish.
  language: English
