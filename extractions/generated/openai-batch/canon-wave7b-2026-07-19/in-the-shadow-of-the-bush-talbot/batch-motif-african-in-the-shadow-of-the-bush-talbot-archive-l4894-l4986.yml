canonical_text:
  quote: ''
  summary: The passage describes Ekoi beliefs about totem animals, inherited animal
    affiliations, and people who can take animal form. It gives examples of farm-devouring
    animal forms, were-crocodiles accused of river attacks, a Netim chief and his
    son accused and confessed under pressure of Juju oaths, the recovery of one dead
    and one enslaved woman, punishment attributed to the Broom Juju or poison, a method
    of killing a were-crocodile's Efumi by fish poison, and further reports of were-leopard
    and were-elephant transformation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Totem animals are said to have once been eponyms of the families that possess
    them, and a person cannot belong to a totem absent from both parents.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Taking animal form is described as useful for devouring enemies' farms at
    night; buffalo, elephant, and wild boar bush souls are associated with areas of
    large farms.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Oban the favored were-beasts are described as leopards and crocodiles,
    and were-crocodiles are said to frighten people in rivers, make them drop goods,
    and overturn canoes to seize goods and people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Netim chief and his son were accused of killing two women in crocodile form
    while the women crossed the Calabar River.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The accused refused to swear innocence on the dominant Juju, and were later
    asked to swear on the Broom Juju.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The Broom Juju is venerated because it enters every small corner when cleaning
    a compound, so no part of the house is considered safe from it.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The son confessed that he and his father were guilty, claimed they had killed
    and eaten seven other people, and said his father took the lead.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The son said one woman had been revived by magic, drawn from the water, taken
    in human form to Uyanga, and sold as a slave; the other body was placed in a tree
    fork beneath the water surface for later eating.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Townspeople stated that they found the body where indicated and found the
    other woman at Uyanga.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The recovered woman identified the chief and his son and said they had dragged
    her down as crocodiles to an underwater house, where she lost consciousness before
    being restored and forced into slavery.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After confrontation with the recovered woman, the chief confessed; both chief
    and son died within ten days, which townsfolk attributed to the Broom Juju, while
    the narrator suggests poison by neighbors as more probable.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: If women strew fish poison in the water above a were-crocodile's dwelling
    place, the crocodile's Efumi is said to die within seven days.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A certain chief was suspected of killing cows and goats in were-leopard form,
    and a local tribunal was interrupted by the arrival of the white man.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Chief Agbashan is believed to have the power to transform himself into an
    elephant.
  category: attribute
  evidence_refs:
  - ev:10
