canonical_text:
  quote: ''
  summary: The passage describes rites connected with a stream called the river of
    Good Fortune, roadside leaf mounds over dead chameleons, and slain poisonous snakes
    laid across roads. It then gives a travel account of Niaji below Osaw Ifogi, a
    high hill with caves and flowering trees, where the narrator's party is struck
    down during a violent storm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After leaving Ntebbashott, the route descends a steep rocky slope into a dell
    with a clear stream flowing through it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Carriers set down their loads, run to drink from the stream, pluck leaves
    from its banks, form an irregular procession, and go to a heap of leaves nearby.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the leaf heap, participants rub gathered leaves across their foreheads,
    say a request for luck, and drop the leaves on the heap.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The stream is called the river of Good Fortune, and conformity with the rite
    is said to bring good luck throughout the current year, especially for traders
    going toward the German Cameroons.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage mentions another heap of leaves on the bank of the Calabar River,
    connected with a similar ceremony for preventing evil fortune.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Lesser roadside mounds of leaves may cover a dead chameleon; according to
    the old men's rule, a chameleon killed on the road must be left by the wayside
    rather than thrown into the bush.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Each passer-by takes leaves, spits on them, drops them on the dead chameleon,
    and speaks to it as being given a mat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A killed chameleon's spirit is supposed to go before Obassi Nsi and pray for
    revenge against those responsible for its death; the rite is described as placating
    the dead creature's manes and averting punishment.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: When a poisonous snake is killed, its body is left lying across the road so
    that passers-by may step over it; this is thought to avert danger from snake-bite
    until the next new moon.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Niaji lies at the base of Osaw Ifogi, glossed as a high hill with holes or
    caves; the hill is described as a conical peak over 3,000 feet high and covered
    with flowering trees.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The summit of Osaw Ifogi had been cleared except for one tree, and camp was
    made on the slope below because the top was too narrow for safe tent placement.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Storm clouds gathered, the sky became overcast, wind rose, branches crashed,
    and the storm burst while the party took refuge in a tent.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A blaze of light and a deafening crash accompanied a force that threw people
    to the ground; the narrator later found companions senseless and others terrified
    or flung downhill.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The narrator's wife later said that the blow made her think, "This is death,"
    and that she later heard a distant voice asking whether they were killed.
  category: speech
  evidence_refs:
  - ev:9
