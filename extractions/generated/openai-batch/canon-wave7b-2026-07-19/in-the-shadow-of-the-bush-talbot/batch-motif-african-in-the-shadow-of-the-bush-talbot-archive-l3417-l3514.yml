canonical_text:
  quote: ''
  summary: 'The passage describes several Ekoi Jujus and related rites: an installed
    Juju at Oban is associated with the absence of leopards and livestock losses;
    rites and taboos regulate palm kernels, quarrels, and outdoor fire; Mfam, Ofiri,
    Mfuor, and Akpambe protect against witchcraft and theft; Mfam enforces theft and
    entrail taboos; a ritual can revoke the entrail taboo; Akpambe spreads through
    the district after Obassi Abong learns rites from his mother; Eburuk Pabi is treated
    as a prior female Juju needed for seeing Akpambe; votaries and images use blue
    cloth, medicine amulets, robes, and ear-like shells symbolizing all-hearing power.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the installation of a new Juju at Oban, leopards were no longer seen
    within a mile of the houses, and sheep, goats, and cows were no longer reported
    lost.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the Juju loses efficacy if certain rites are not observed,
    including picking palm kernels from the bunch before bringing them into town.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the palm-kernel rule is broken, a leopard is said to come before dawn and
    take a cow or sheep; the same punishment is said to follow violent quarrels or
    lighting a fire outside compound walls.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator states that strong-smelling pitch used to renew the Juju's power
    may help explain its effect by deterring beasts of prey.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mfam, Ofiri, Mfuor, and Akpambe are named as the four Jujus with the widest
    distribution, and all are said to protect against witchcraft and theft.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mfam is described as the oldest of the four and as so powerful in some places
    that people requested its removal; it is said to kill for theft and requires hunters
    to bring entrails before its priest.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: To revoke the public taboo on entrails, an animal is killed and brought into
    town; each man scrapes his tongue with a matchet, refuses the Ntubi, and then
    the entrails are divided and eaten.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The cult of Akpambe spread rapidly in 1909, with lodges established in many
    towns; it was started by Obassi Abong after his mother taught him the necessary
    rites.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Many older cults were overthrown at Akpambe's arrival, but the shrine of Eburuk
    Pabi remained; some people said Akpambe could not enter a place unless Eburuk
    Pabi was present first.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Eburuk Pabi is said to confer the power of seeing Akpambe; the Okum bows before
    Eburuk Pabi's shrine at each play.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: Eburuk Pabi is described as a female Juju, and its sign is an earthen pot,
    which the passage identifies as a female symbol.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Votaries of Akpambe, Ekuri Ibokk, and Mfuor wear blue cloth amulets containing
    medicine to ward off witchcraft.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The images of Akpambe, Ekuri Ibokk, and Mfuor wear dark blue cloth robes with
    palm-fibre fringe and bivalve shells that are interpreted as human ears and signs
    of an all-hearing spirit power.
  category: object
  evidence_refs:
  - ev:8
