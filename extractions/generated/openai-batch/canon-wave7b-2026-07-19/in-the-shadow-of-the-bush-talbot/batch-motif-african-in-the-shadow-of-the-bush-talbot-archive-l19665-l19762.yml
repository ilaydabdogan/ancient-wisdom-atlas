canonical_text:
  quote: ''
  summary: A boy and his sister lure their enemy Nki, a lion, by bell and horn. After
    dismissing successive messengers, the boy shoots Nki, obtains proof of the death
    with Hawk's help, recovers his father's head from the lion's body, and performs
    funeral customs; the lions then leave the bush. The next tale begins with the
    title explaining why Bush Fowl calls up Dawn, then describes a chain of startled
    reactions beginning with a black fly, a falling knife, a pregnant wife, a serpent,
    a rat, a plantain-eater, and a monkey.
  language: English
  quote_policy: summarized
