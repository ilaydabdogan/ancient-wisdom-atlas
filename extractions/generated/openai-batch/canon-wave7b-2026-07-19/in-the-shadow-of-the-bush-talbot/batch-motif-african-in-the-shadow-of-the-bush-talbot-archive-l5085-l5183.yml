canonical_text:
  quote: ''
  summary: 'The narrator describes a hunter''s cave shown by Awaw Anjanna, then a
    later visit when Awaw''s dwelling is deserted. An attendant notices fresh bush-cow
    tracks at Awaw''s farm. At Ekkonnanakku the people say Awaw died but avoid discussion.
    The attendant privately explains that Ododop chiefs are linked with buffaloes:
    a chief''s soul enters a buffalo after death, and his bush soul can go out in
    the form of its animal affinity. The account connects Awaw''s sudden cry that
    he was being killed at Oban with the shooting of a buffalo there; the buffalo
    dies two days later, and Awaw dies shortly before its body is found. Before dying,
    Awaw warns people of the buffalo totem to keep away from Oban. His brother now
    rules, while the former dwelling is deserted and the farms still seem tended.'
  language: English
  quote_policy: summarized
