  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ngbe Eing tracked the woman home and waited to devour the child; the husband
    returned while Eing had gone to the spring and killed Eing with a pot-hook belonging
    to his other wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The other wife demanded that the woman herself fetch the pot-hook from the
    ghost town, with the stated expectation that the woman would die on the way and
    her newborn would perish without her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people judged the other wife's conduct to be hate; after the woman accused
