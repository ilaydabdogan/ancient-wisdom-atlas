canonical_text:
  quote: When a man dies he can see the road to the ghost town, but while alive he
    can find it no more.
  summary: The passage concludes one ghost-town tale in which a wronged wife accuses
    her co-wife, the community orders the co-wife to retrieve Nchitt from the ghost
    town, and the co-wife fails tests of compassion, is killed there, and is eaten
    by ghosts. The Chieftainess then hides the road from living people. The passage
    then introduces a related tomato-origin story involving Effa, Akat, Effa's dead
    mother, and a ghost named Echi.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: In the woman's testimony, Ngbe Eing aided her during childbirth but demanded
