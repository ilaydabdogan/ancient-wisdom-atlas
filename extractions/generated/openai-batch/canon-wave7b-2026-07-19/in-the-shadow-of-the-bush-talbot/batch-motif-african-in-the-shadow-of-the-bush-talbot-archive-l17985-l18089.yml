canonical_text:
  quote: ''
  summary: Ebopp and Mbaw finish preparing new farms and send their wives to plant
    coco-yams. During a meal, Umaw brings private news that Akpan Anwan's sister Akandem
    is dead. Ebopp and Mbaw try to gather food and drink for the funeral customs despite
    scarcity and lack of money. After others refuse help, Iku, the Water Chevrotain,
    gives Ebopp two shining eyes used for seeing in the dark, so they can buy what
    is needed. Ebopp, Mbaw, and Akpan Anwan carry provisions toward Obassi Osaw's
    dwelling, where Akpan Anwan runs to her sister's grave and lies on it.
  language: English
  quote_policy: summarized
