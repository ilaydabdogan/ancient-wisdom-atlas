canonical_text:
  quote: "“after death the ghost could remove them one by one, and sell them to the
    spirits in exchange for food”"
  summary: A girl arrives with an interpreter and shows round scars on her arm, explaining
    that her people make such marks so that, after death, the ghost may remove and
    sell them to spirits for food. The narrator adds that this is a widespread Ekoi
    belief, though not all arm scars are to be explained that way. The girl seeks
    protection from a father attempting to force her into marriage. The passage then
    describes an excursion to the Kwa falls, the river setting, animals at the water,
    and the return route by canoe and bridge.
