canonical_text:
  quote: ''
  summary: The passage reports preparations for an Eja confirmation feast, an informant's
    account of a fatal ritual ingredient, an allegation that a purposely slain woman
    was sacrificed for Ekoi farm prosperity, the observation of Eja fetish objects
    at Mbinda, and an explanation of Eja and Ekum Oke as paired male and female ritual
    personalities invoked in song.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man reports that hunters have gone out to provide game for a feast honoring
    the confirmation of Eja.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The informant says that the people formerly lacked the ingredients needed
    for confirming the Juju, but now have all that is necessary.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: When asked whether the victim is killed or only mutilated, the informant answers
    that removing such a large part would cause death.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The narrator identifies the difficult ingredient as the same organ associated
    with a symbolic tree in an Osiris ritual described by Dr. Frazer, and says that
    among the Ekoi a woman is usually chosen as the victim.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says a woman was killed in the bush so that her mutilated body
    might bring prosperity to Ekoi farms.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that the necessary body part must come from a purposely
    slain victim, not from a corpse that died accidentally or naturally.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: The passage says the secret was closely guarded, inquiries did not obtain
    actual proof of the murder, and evidence was found concerning former frequency
    of such sacrifices.
  category: other
  evidence_refs:
  - ev:7
- id: obs:8
  text: At Mbinda, in an Egbo house, the narrator's party sees three objects hanging
    from the roof, each formed with bowls set on widely opened human jaws.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: 'The passage identifies the objects as Eja symbols and says the fetish has
    two parts: a bowl called Ekum Oke as the feminine sign, and a curved male symbol
    representing Eja.'
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: 'Informants say Eja consists of two personalities: Eja is male and stronger,
    while Ekum Oke is female and less strong, yet Eja can do nothing without her.'
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: At great Eja festivals a song invokes Ekum Oke first, then Man Eja, with the
    refrain that the singer is staying with each.
  category: speech
  evidence_refs:
  - ev:10
