canonical_text:
  quote: ''
  summary: 'The passage explains a funeral custom of burying chief people in dwellings,
    then gives an Ekoi account of early death and return: the dead were carried in
    a dream to Obassi Osaw, who could revive and return them. Obassi sends Frog with
    a message that death is final and Duck with a message that the dead may live again.
    Frog delivers his message; Duck is distracted by palm oil and forgets hers, so
    humans follow Frog''s message and cannot see the dead again.'
  language: English
  quote_policy: summarized
