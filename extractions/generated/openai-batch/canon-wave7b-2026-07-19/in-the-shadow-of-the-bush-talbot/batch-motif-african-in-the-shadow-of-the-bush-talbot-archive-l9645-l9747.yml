canonical_text:
  quote: ''
  summary: A poor man excluded from a celebration later sees seven ghosts using calabashes
    of black Juju to become invisible. He takes one, uses it to see ghosts at a feast
    for the dead, and stops them eating and drinking with the living. After he returns
    the stolen Juju, a ghost gives him a new one that produces cloth and wealth but
    must not be touched by anyone else. His wife secretly touches it; it returns to
    the ghosts and wounds her. The husband says the broken rule has killed him, makes
    a coffin lined with the magic cloth, lies down in it, and dies. His brother asks
    that the wife die too.
  language: English
  quote_policy: summarized
