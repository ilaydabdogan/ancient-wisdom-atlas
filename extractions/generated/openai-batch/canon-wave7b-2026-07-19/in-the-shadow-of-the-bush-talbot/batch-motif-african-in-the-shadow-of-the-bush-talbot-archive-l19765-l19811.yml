canonical_text:
  quote: ''
  summary: A chain of small incidents leads to the destruction of Bush-fowl's eggs.
    In grief and vexation she does not call the dawn, leaving the world dark for two
    days. Obassi summons the beasts and things to inquire into the cause. The chain
    of blame is traced back to Black Fly, who answers only with buzzing. Obassi orders
    Black Fly to remain speechless and to buzz forever, and orders Bush-fowl never
    again to refuse to call the dawn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An elephant rushes away and carries off a flowering creeper called Mfinn,
    which catches around his neck.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mfinn pulls over an ant heap, and the ant heap falls on Bush-fowl's nest and
    destroys her eggs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bush-fowl broods over the crushed eggs, forgets or refuses to call the dawn,
    and the whole world remains dark for two days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The beasts wonder about the continued night, and Obassi summons them to ask
    about it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bush-fowl explains the broken eggs by reciting a chain of causes running from
    the ant hill back through Mfinn, Elephant, Ntun fruit, Monkey, Nkundak, Rat, Serpent,
    a sick woman, a knife, her husband, and Black Fly.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Each thing and beast is asked for its reason and repeats the long answer until
    Black Fly, identified as the first cause, answers only by buzzing.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Obassi commands Black Fly to remain speechless forever, to buzz, and to be
    present wherever a foul thing lies.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Obassi gives judgment that Bush-fowl must immediately call the delayed dawn
    and never again refuse to do so, even if her eggs are destroyed.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The narrator states that without Obassi's strict orders, Bush-fowl might again
    refuse to call and cause a long night lasting a week or more.
  category: other
  evidence_refs:
  - ev:8
