canonical_text:
  quote: ''
  summary: A young mother on a dangerous errand encounters an afflicted old woman
    and offers gentle help. The woman becomes well and reveals herself as the Chieftainess
    of all ghosts, then instructs the mother how to enter Ghost town, sing, name Ngbe
    Eing, and obtain the object that killed her. The ghost people give the mother
    the Ejimm iron. The Chieftainess later gives her seven Ochitt fruits with instructions
    to distribute them widely. The mother returns home, gives back the iron, distributes
    the fruits, and leaves her own small portion on a water-pot mound while drawing
    water. A barren co-wife eats the reserved piece and admits it.
  language: English
  quote_policy: summarized
