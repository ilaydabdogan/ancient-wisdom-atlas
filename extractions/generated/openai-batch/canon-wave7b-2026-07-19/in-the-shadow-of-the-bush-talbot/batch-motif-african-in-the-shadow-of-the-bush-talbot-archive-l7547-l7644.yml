canonical_text:
  quote: ''
  summary: The passage ends a Mbum fruit-child story, gives the tale of an Ebbuya
    fungus daughter, and begins a herb-daughters tale. In the first two stories, a
    child or woman of vegetal or fungus origin is taunted about that origin, returns
    to the nonhuman source, and a possible custom of obtaining children in that way
    is said to cease. The final fragment describes four girls emerging from edible
    herbs while a childless old woman is away.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman says she will soon bear a child and fears that someone will say she
    came out of the fruit Mbum; her husband comforts her and she stays.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the woman's few-week-old child cries while the mother is away, the husband's
    sister addresses the child as the son of a fruit.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wind carries the sister's words to the mother, who runs home and reminds
    the household of their promise not to say she came from a fruit.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mother takes the child to a great Mbum tree; the tree opens, she enters
    with the child, and the tree closes over them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator states that women formerly could ask Mbum to open and give a
    child, but that this way of obtaining children is no longer possible after the
    taunt.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: An old couple have never had a child; the old man goes into the bush to search
    for one.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The old man finds a large Ebbuya ball, an item described as used by Ekoi people
    to thicken soup, and believes that a lucky finder may carry such a thing home
    and have it become a child.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: At home, a voice from the bag calls the old man father and asks to be taken
    out because it is hard to breathe.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The old man reaches into the bag and draws out a beautiful young girl instead
    of the Ebbuya ball.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The foster-daughter is sent to the fatting-house with a little slave to attend
    her.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The little slave refuses to recognize the foster-daughter as mistress and
    says she is not the proper daughter of the old couple but an Ebbuya ball.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the taunt, the foster-daughter goes back to the bush and becomes a fungus
    again.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A lame boy has overheard the matter and tells the old couple; the old man
    later finds many Ebbuya balls, but none becomes a child again.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The narrator states that, without the slave's taunt, the Ebbuya maiden might
    have remained and people might thereafter have obtained children from the right
    Ebbuya ball.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: A very old woman who has never had a child has planted edible herbs and roots
    around her hut.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:16
  text: Each day while the old woman goes into the bush, four beautiful girls come
    out from the herbs, enter the house, cook food on the hearth, eat, and return
