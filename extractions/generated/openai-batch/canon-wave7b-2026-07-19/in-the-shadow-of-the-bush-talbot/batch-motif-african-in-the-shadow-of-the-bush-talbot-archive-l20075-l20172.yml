canonical_text:
  quote: ''
  summary: Agbo finds his brother Oro cut into pieces, collects the fragments, and
    asks a tailor to sew the body together. The owner of the treasure traces the removed
    body to Agbo through the tailor. A servant pretends friendship, marks Agbo's house
    with white paint, but Agbo's son marks all houses alike and prevents identification.
    The servant then brings casks said to contain palm oil, with war men hidden inside.
    Agbo's son suspects the deception, kills the guest at night, and pours boiling
    water into the casks. Agbo discovers the killing and brings his son before a Judge;
    the passage breaks off during the inquiry.
  language: English
  quote_policy: summarized
