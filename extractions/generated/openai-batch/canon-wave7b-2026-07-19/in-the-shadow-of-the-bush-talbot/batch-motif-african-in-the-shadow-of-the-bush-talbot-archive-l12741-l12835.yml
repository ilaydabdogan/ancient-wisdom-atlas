canonical_text:
  quote: ''
  summary: The passage describes a seven-day new yam festival at an Ekoi town where
    crocodile-associated Efumi worship Nimm/Animm, suspend water traffic, sacrifice
    anyone entering the water, connect offerings with fertile farms, and mark the
    annual movement of crocodile souls into new bodies. It then recounts a boy’s report
    that he was sold to Chief Ikum for human sacrifice, saw an iron cage used for
    sacrifices, was warned and helped by women, escaped through the bush, and reached
    Forest-guard Okore.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At one Ekoi town, all inhabitants are said to be Efumi of crocodiles.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: For seven days during the new yam festival, notice is given that all traffic
    should stop, and a man entering the water would not gain the further bank.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Efumi hold a great festival to the Juju Animm/Nimm, and anyone entering
    the water or dragged from the bank must be sacrificed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nimm is described as hearing no prayer, longing for offerings, and making
    the farms of her worshippers fruitful in return.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: At this festival time, each crocodile soul leaves the body it inhabited during
    the previous year and chooses another body for the next twelve moons.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A boy of about fifteen reported that Tambe and Wanchi hired him at Calabar,
    kept him out of towns along the way, and sent him through the bush.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy reported that Tambe and Wanchi took him to Chief Ikum’s house and
    arranged to sell him for £20.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the sellers left, an iron cage of rods, four feet by four feet by two
    feet, described as used only for human sacrifice to Jujus, was brought out.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Chief Ikum tried to make the boy drink rum, ate and drank himself, and tied
    his hunting knife around his waist.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Women warned or protested that the boy was going to be killed; Ekungbe told
    Ikum not to kill the boy, and Ikum struck her.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The head wife expressed pity for the boy, mentioned his helpfulness, and suggested
    that he might reach the white man if he escaped.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The boy slipped away into the bush, hid from people searching with lanterns,
    avoided the road, and on the third day reached Forest-guard Okore and asked for
    help.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The route toward Ojo Nkonmba is described as crossing the Calabar River and
    passing streams, dry-season waterfalls, rain-season torrents, mountains, a ford,
    orchids, and a clear stream.
  category: setting
  evidence_refs:
  - ev:8
