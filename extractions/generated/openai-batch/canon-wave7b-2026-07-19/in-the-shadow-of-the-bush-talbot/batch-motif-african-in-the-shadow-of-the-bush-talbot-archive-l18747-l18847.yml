canonical_text:
  quote: ''
  summary: The passage ends one tale and begins another. In the first, Obassi gives
    his youngest son a key and deathbed instructions. After the father dies, the older
    sons beat and dispossess the youngest. An old woman shelters him; he hunts, receives
    divinatory help, finds hidden goods, and sends them to Obassi Osaw. Obassi Osaw
    then has the boy brought to the sky, where gifts do not make him happy; the boy
    wants to return to earth. Obassi Osaw's anger reddens the sky and is given as
    the cause of tornado sunsets and storms. The next tale begins with Etim 'Ne and
    his wife Ejaw descending from the sky to an unpeopled, waterless earth; all water
    is held in Obassi Osaw's kingdom, and Etim 'Ne goes back to ask for some.
  language: English
  quote_policy: summarized
