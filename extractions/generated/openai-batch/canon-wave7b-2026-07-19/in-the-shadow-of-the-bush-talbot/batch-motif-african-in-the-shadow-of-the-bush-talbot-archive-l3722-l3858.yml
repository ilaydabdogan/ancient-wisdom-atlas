canonical_text:
  quote: ''
  summary: Tortoise repeatedly steals food from a ghost farm while warning Cock that
    noise will bring danger. Cock secretly tracks him with ashes, follows him to the
    ghost farm and later to the ghost town, repeatedly crows, and is finally caught
    by the ghost townsfolk. Cock blames Tortoise, claims to have come down from the
    sky, and tells the ghosts to place white cloth around his neck, tie him to a high
    palm tree, pray to Obassi Osaw, and state that he must die because he entered
    their town without permission.
  language: English
  quote_policy: summarized
