canonical_text:
  quote: ''
  summary: The passage ends one tale in which Obassi plans to expose the two sons
    of Tortoise, who have been presented as his young wives. The sons borrow Lizard's
    feminine parts, avoid exposure, repeatedly refuse to return the borrowed parts,
    and then silence Lizard with a fu-fu ball containing fish bones; the narrator
    explains this as the origin of lizards' head motion and Lizard's loss of voice
    and Ndipp. The passage then begins a second tale in which Nkui/Tortoise and Obassi
    Osaw make a funeral rule requiring the survivor to kill an elephant; Obassi Osaw
    hides in a sealed house and has his son report him dead, after which Tortoise
    sets out and sees an Elephant by the water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Obassi tells his wife not to speak further about the matter, because the two
    Tortoises might overhear and flee to their father.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Obassi fixes a day for a public show and invites his fathers-in-law, intending
    by this invitation to have Tortoise punished and perhaps killed for deceit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The two sons of Tortoise suspect what is happening, summon Lizard, borrow
    her feminine nakedness, and are found to be girls when Obassi inspects them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Guests gather to see the promised wonders; Obassi scolds his head wife, announces
    there will be no show, and the people leave discontented.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Lizard repeatedly comes to ask the boys to return the parts she lent them,
    but they ask her to sit, eat fu-fu, and come again later.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Lizard sings that Ared Tortoise and Affion Tortoise should return her secret
    parts, saying she dies for them and lives for them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: People in the compound hear Lizard's singing and run to see who is making
    the song.
  category: action
  evidence_refs:
