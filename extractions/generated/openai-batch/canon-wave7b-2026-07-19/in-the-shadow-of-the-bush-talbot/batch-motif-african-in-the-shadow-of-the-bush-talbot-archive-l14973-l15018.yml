  summary: After the narrator returns from a long journey, Oban chief men visit to
    congratulate the party and view collected objects. They inspect pottery, musical
    instruments, furniture, ornaments, royal portraits, and a black-and-white reproduction
    of Long's "India." A high-grade Egbo member responds with strong delight to the
    image and comments on the beauty and robes shown in it. The passage ends with
    a note on Ekoi colour terminology, including a word for yellow derived from a
    yellow dye powder.
