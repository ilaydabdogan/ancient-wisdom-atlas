canonical_text:
  quote: ''
  summary: The passage continues a tale in which Calabash raises a child into a beautiful
    maiden. The son of Obassi Nsi finds and marries her, but she fears leaving Calabash
    until Calabash and Pot accompany her as mother-substitutes. A former female slave
    recognizes the girl and Calabash, reveals that slaves killed the free-born with
    leopard gall, and Obassi orders punishment and establishes a gall-handling custom.
    The passage then describes Nsan's sacred cotton tree near the Sacred Lake, votive
    offerings, worship of wood and water genii, and the magical/revenge use of great
    trees among Efik or Ekoi.
  language: English
  quote_policy: summarized
