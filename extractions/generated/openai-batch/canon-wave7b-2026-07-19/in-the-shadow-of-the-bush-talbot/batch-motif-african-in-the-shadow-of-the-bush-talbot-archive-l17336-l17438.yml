canonical_text:
  quote: ''
  summary: 'A young sheep escapes Leopard by making Leopard''s daughter sleep in the
    sheep''s bed, so that Leopard kills her own child in the dark. The sheep then
    evades Leopard at a cross-roads, later helps a Nimm woman, takes medicine from
    a Nimm shrine, and is chased until she breaks Mouse''s old door, releasing all
    stories and histories across the earth. The passage then begins a separate tale,
    “How the First Rain came,” in which Obassi Nsi and Obassi Osaw arrange an exchange
    of children: Nsi''s son goes up to heaven with gifts, and Ara, a sky maiden, descends
    to earth with attendants, then refuses Nsi''s command to work in his farm.'
  language: English
  quote_policy: summarized
