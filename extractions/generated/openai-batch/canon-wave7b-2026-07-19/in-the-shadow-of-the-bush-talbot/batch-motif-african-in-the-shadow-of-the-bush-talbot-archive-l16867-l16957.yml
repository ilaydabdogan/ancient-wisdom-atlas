  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the town meeting, after the narrator gave her case, Erim hit her on the
    head with his wife's staff; Ekuri San challenged the act by referring to Court
    and the 'white man's' rules.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After Magbo warned the narrator that Erim was waiting for her at home, the
    narrator considered running to hide in the bush; Ekuri San and Akimni stopped
    her and said bystanders must part fighters.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ncha Echi fought with the narrator and later beat Omin; Ode then knocked Omin
    down, jumped on her, and pressed her throat against the ground.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Erim joined Ode in beating Omin with the juju called Ekpiri Nkara, which had
    previously been described to the narrator as deadly if it touched someone.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: When Erim's hand accidentally touched Ode while he was using the juju, Ode
    cried out as if fearing he meant to kill her; after people separated the fighters,
    Erim again said to Omin, 'Let us die to-day.'
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
