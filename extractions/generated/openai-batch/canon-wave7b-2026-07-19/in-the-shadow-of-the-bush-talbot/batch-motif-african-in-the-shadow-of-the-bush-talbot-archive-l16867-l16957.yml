canonical_text:
  quote: ''
  summary: A woman gives testimony about being divorced and mistreated because she
    is treated as a slave, a farm dispute after a fallen tree, threats by Erim to
    kill her and other slaves to prevent appeal to Court, public beatings and humiliation,
    references to the 'white man's' rules, an attempted flight to the bush, and an
    assault on her daughter involving a juju object said to kill by touch.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One of Erim's wives reproached him for marrying the narrator because she was
    described as a slave, and Erim divorced the narrator in the wife's name.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A fallen tree in the narrator's farm was connected with complaints about damaged
    crops and a later cutting off of part of the narrator's farm for a small boy.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Erim said before the narrator's three children that he would meet her on the
    road and kill her so she would not take them to Oban.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Erim said he would like to die with his slaves and referred to the former
    custom of killing slaves to bury with chiefs.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator states that by local custom a slave cannot touch a master when
    the master beats the slave; Erim then beats her, and Omin comes out of the fatting-house
    during the assault.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Erim tore off the narrator's clothes and drove her naked into the town place;
