canonical_text:
  quote: ''
  summary: The passage concludes one tale in which Python/Nkimm lends his removable
    hands and feet to a boy so that the boy can climb an Aju tree. On a later visit,
    after the boy's mother has instructed him, the boy keeps the attached limbs, climbs
    to the top, and sings. His parents approach; the father carries a spear, and Python
    flees along the ground. The narrator states that this explains why humans are
    not born without hands and feet and why snakes lack them. The passage then begins
    another tale titled "Why Snake has neither Hands nor Feet," in which Obassi Nsi
    assigns Cow, Goat, and Snake to farm work, forbids them to eat the fruits, and
    sends Snake, then still limb-bearing, to bring plantains for visiting strangers.
  language: English, with an embedded song and gloss
  quote_policy: summarized
