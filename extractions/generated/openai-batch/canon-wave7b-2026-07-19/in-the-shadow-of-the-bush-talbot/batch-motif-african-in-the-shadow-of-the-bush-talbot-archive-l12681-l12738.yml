canonical_text:
  quote: ''
  summary: 'The passage first gives an etiological account of native tomatoes: Atem
    obtains them from her sister Affion at a ghost town, throws them into the earth
    behind her house at Porcupine''s command, and they grow. It then describes the
    Calabar River beyond Netim as a boundary and dangerous crossing-place with a Nimm
    altar stone, Juju tree, leaf heap, protective leaf-rubbing and prayers, a crocodile-addressing
    invocation, and a seasonal exception at the time of new yams when prayer is not
    made because it is believed to be unheard. The river is also described as the
    special home of the Efumi of crocodiles and elephants.'
  language: English
  quote_policy: summarized
