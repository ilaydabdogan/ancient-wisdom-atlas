canonical_text:
  quote: ''
  summary: The passage describes fatting-house departure rites for a girl, including
    bodily operation, feast, dances, red cam-wood dye, ornaments, face paint, hair
    dressing, and feathers. It compares this with a remembered Bavili Paint House
    custom. It then describes wedding gifts and offerings, age-class feasts, and two
    post-marriage fidelity oaths before Njomm Ekatt and Njomm Aiyung, including ritual
    use of river-bed mud, eggs, leaves, water, forehead marking, mutual blood-sucking,
    and supernatural sanctions for infidelity. It also outlines household arrangements
    after marriage, including the wife joining the husband's compound, hierarchy among
    wives, fireplaces, and expectations about labor.
  language: English
  quote_policy: summarized
