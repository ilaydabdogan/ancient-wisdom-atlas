canonical_text:
  quote: ''
  summary: 'The passage first describes boughs drawn over a dying person''s face so
    that his spirit may pass painlessly to the realm of Obassi Nsi. It then records
    a witnessed ritual revoking a Juju/Mfam oath concerning Nkoiyu: the head priest
    uses horns containing medicine, palm wine, leaves for assent, meat, and cloth
    while invoking supernatural powers and asking that the curse be removed and protection
    granted.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Boughs are brought to a dying person, and a priest draws them over the person's
    face so that the spirit may pass painlessly to the realm of Obassi Nsi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator states that he was present on August 19, 1907, at a revocation
    of the Juju.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Obu of Ikpai had sworn Mfam against anyone who should try to take Nkoiyu from
    him, because he wished to keep her in his family.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Members of the Juju gathered before the shrine naked to the waist.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Itagbun, the head priest, opened the Juju shed and took out six horns containing
    medicine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Itagbun drank palm wine and sprinkled some of it over the horns.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Itagbun held two horns, invoked Obassi Nsi, Obassi Osaw, and the ghosts, and
    prayed for the Juju to remove the curse connected with Obu's oath.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: While Itagbun spoke to the Juju, the people knelt or stood with lowered eyes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Itagbun used leaves to test whether the Juju agreed, and the answer was favorable.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Obu asked that the Juju oath be cancelled, that Nkoiyu go to Idan Awaw, and
    that the Juju not fall upon Idan.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Itagbun asked the Juju to prevent harm from touching Nkoiyu and to stop anyone
    who tried to harm Nkoiyu or Idan.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Itagbun poured palm wine into a small calabash, drank some, threw the rest
    on the ground before the Juju, placed leaves beneath it, poured palm wine on the
    six horns, and prayed that the offering be accepted.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Itagbun placed two leaves on the back of his left hand, struck them with his
    right hand, and asked whether the palm wine was accepted and the matter finished.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The leaves agreed, and the people shouted approval.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The chiefs drank palm wine, and meat brought by Obu was cut up; some pieces
    were placed on each horn and the rest distributed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Itagbun told the Juju that the beef and cloth were from Obu and asked that
    Nkoiyu be set free from the curse sworn in the Juju's name.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: A third consultation with the leaves gave another favorable answer.
  category: sequence
  evidence_refs:
  - ev:11
