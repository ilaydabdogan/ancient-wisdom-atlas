canonical_text:
  quote: ''
  summary: Atikawt resists a stranger later identified as Ada Etim Agbo Etum, the
    Forest Woman. She tricks him into climbing a fruit tree, magically makes it grow
    to an immense height, summons armed men from her belly, and orders the tree cut
    down. A parrot warns Atikawt's household; his witch wife breaks the dogs' chains,
    and the dogs arrive as the second supporting tree falls. Oro Njaw attacks Ada,
    the other dogs attack her men, and Ada is torn apart. The passage closes by saying
    the hunter freed the bush from a cruel monster. The next chapter begins with an
    ethnographic note on the Uyanga, their reputation for medicine and magic, and
    a reported but locally unconfirmed story that monkeys taught them magic lore and
    Nsibidi writing.
  language: English
  quote_policy: summarized
