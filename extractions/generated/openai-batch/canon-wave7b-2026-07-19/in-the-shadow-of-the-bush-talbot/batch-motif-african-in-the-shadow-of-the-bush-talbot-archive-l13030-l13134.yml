canonical_text:
  quote: ''
  summary: A little lame maid instructs the hunter Atikawt how to escape a Giantess/Forest
    Woman by using magic plants to open a gate, control a river, and block pursuit.
    The Giantess arrives with music issuing from her body, pretends to take Atikawt
    as husband, but plans to eat him and tries to kill him with enchanted food and
    a heated iron. Atikawt evades these dangers, substitutes pillows for himself,
    crosses the river, and the Giantess cannot follow because she forgot the herbs
    needed to divide the water.
  language: English
  quote_policy: summarized
