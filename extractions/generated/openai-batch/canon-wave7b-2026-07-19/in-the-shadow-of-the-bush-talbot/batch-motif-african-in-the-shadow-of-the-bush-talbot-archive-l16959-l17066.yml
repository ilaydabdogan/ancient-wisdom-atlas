canonical_text:
  quote: ''
  summary: The passage gives several reported cases in which dependents or enslaved
    “members” seek protection from masters through town authorities or the District
    Commissioner, including accounts of beating, ritual oaths by juju, threatened
    offering to juju, and a boy hidden at a bush farm. The narrator then frames these
    cases as examples of conflict between “members” and Heads of Houses and introduces
    a legend in which a female slave, Ngonne, leads her mistress Ome to deep river
    water, pushes her into a crocodile hole, and returns with Ome’s daughter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Townspeople hid a woman and her daughter from their master; the master beat
    the Egbo drum around the town and threatened fines if they were not returned,
    while the townspeople refused because of the white man’s rule.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator says her daughter’s throat swelled, her body was full of sores,
    her breasts pained her because she was pregnant, and the beating and crushing
    of her body killed her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man and woman stepped out of the bush hand in hand, touched the ground with
    their fingertips as supplication, and asked the District Commissioner for protection
    against people who had wronged them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Itita testified that his master Kako flogged and wounded Akot, made him swear
    by Osai, and later forced Itita and Akot to swear by the juju Mbian that they
    would no longer stay together.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Akot testified that the accused wounded her with a matchet, called her no
    better than a wild animal, said she would have been offered up to the Juju without
    the District Commissioner’s presence, and gashed her throat with a knife.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The court found cruelty proved, sent the master to prison, set the woman free,
    and the narrator reports an unproved suspicion that the master later poisoned
    her after release.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A nine-year-old boy said he had been bought from his parents, kept hidden
    at a bush farm because the white man might notice him, beaten often, and came
    to complain because he believed the white man would protect him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The narrator states that these are among the blackest cases brought by “members”
    against Heads of Houses, and then says legends show such “modern helots” sometimes
    turned on their masters.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The legend is introduced under the title “How Slaves used to lie in wait to
    kill the Free-born” and is attributed to Eta Ndom of Niaji.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the legend, Ome travels with her daughter Ara and female slave Ngonne;
    Ngonne rejects a shallow stream for bathing and instead chooses a river with deep
    and shallow places.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: While bathing, Ngonne offers to rub Ome’s back, pushes her into a deep hole
    where a crocodile lives, and the crocodile catches Ome; Ngonne then takes the
    child back to town.
  category: action
  evidence_refs:
  - ev:8
