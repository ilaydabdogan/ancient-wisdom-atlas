  summary: A quoted speaker says that a Juju Image summoned her at night to a compound
    where Jujus were kept; there she affirmed that she possessed a snake connected
    with her homeland and sometimes seen in dreams. The narrator then comments on
    ordinary wound healing, Native Court evidence, and a later episode involving a
    great bush-cow skull at the base of a central Juju tree in Ekkonnanakku.
