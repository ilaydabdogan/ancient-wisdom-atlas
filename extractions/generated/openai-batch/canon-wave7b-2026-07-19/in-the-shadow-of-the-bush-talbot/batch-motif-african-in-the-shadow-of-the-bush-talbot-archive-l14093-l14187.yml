canonical_text:
  quote: Every warrior drank from a vessel of " sacred " water and poured some over
    his body.
  summary: 'The passage describes Ekoi warfare practices: pre-battle sacrifice and
    consecration, ambush and captive-taking, victory dances and feather honors, preservation
    of enemy heads for ritual use, offerings to ancestors and Obassi Osaw for protection
    against ghosts, sacrifice of a captured slave to a war Juju, and peace negotiations
    signaled by a palm leaf.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Before the coming of colonial rule, fighting is described as a principal occupation
    of Ekoi men, and weapons changed from spear, club, cross-bow, and palm-strip shields
    to flint-lock guns.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before attacking an enemy, sacrifices were made to the chief war Juju; in
    Oban this Juju was named Oke Ewara.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Each warrior drank sacred water from a vessel, poured some over his body,
    and had strips of palm leaf tied around his neck.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Small parties went to enemy farms and watering-places to lie in wait, and
    captives were treated differently according to status, age, and gender.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At times warriors surrounded an enemy town at night, seizing or killing people
    who left houses, while towns were apparently not rushed and compounds not broken
    into.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Victors carried the heads of slain enemies back to their town and laid them
    before the Egbo house or the war Juju.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A drum was beaten and a warriors-only dance celebrated the victors' return;
    chiefs and elders distributed Nkundak feathers, with long tail feathers for those
    who had killed an enemy.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Enemy heads were smoked, covered thickly with mud, dried again, kept for years,
    placed on small altars, and used for Juju purposes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that the spirit of the slain foe, represented by the head,
    became a guardian of the slayers' hearths and homes.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: After a war dance, the oldest man and woman offered palm oil, plantains, and
    dried Nsun meat to their ancestors and prayed that enemy ghosts would not enter
    the town to do harm.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A sacrifice was made to Obassi Osaw, palm wine was poured on the ground, and
    gunpowder was scattered in the air so that ghosts and living enemies might be
    blinded with dust.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A slave caught alive was taken to the altar, killed by cutting the throat,
    and the blood was poured over the Juju; the body was discarded and the head kept
    and mummified.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: If either side wanted peace, an envoy from a neutral town or one connected
    by birth to both sides was sent carrying a palm leaf, after which talks and terms
    followed.
  category: sequence
  evidence_refs:
  - ev:9
