  summary: A narrator describes a ritual performed after his son repented of an oath
    sworn by Ofiri not to eat coco-yams from his wife's farm. A diviner prescribes
    offerings. The narrator prepares Juju images and medicine horns on an altar, invokes
    Obassi Nsi and Obassi Osaw, addresses the dead associated with the Juju, pours
    water for Ofiri, uses falling leaves to determine that Ofiri is awake, and presents
    food and a cock while asking that his son be forgiven and released from the oath.
