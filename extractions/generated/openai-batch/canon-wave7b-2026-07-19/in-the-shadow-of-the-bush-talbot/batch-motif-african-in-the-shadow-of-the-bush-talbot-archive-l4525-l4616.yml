canonical_text:
  quote: ''
  summary: The passage reports Ekoi beliefs and cult practices concerning wind, thunder,
    lightning, Nsann, and Eja. Mfepp members are said to use wind destructively and
    to prove power by toppling trees. Thunder and Lightning are personified in several
    ways, while Nsann initiates claim to make storms and direct lightning, including
    striking selected palms. Lightning is associated with rocks, peaks, and fire within
    stones, and clear-sky lightning is treated as a death omen linked to poisoning.
    Eja is described as a major new-yam festival and protective Juju requiring sacrifices
    for continued efficacy; its ritual is compared by the narrator to Adonis-Attis-Osiris
    worship.
  language: English
  quote_policy: summarized
