canonical_text:
  quote: ''
  summary: 'The passage ends a tale in which hunters Ikot and Okun exploit Oiyokk
    chimpanzees'' attempts to imitate human actions, leading the apes to kill one
    another with cutlasses and establishing a rule that ape meat killed in the bush
    must be brought to a father or household head. It then begins a tale explaining
    another hunting rule: Crab repeatedly obtains game, Elephant confiscates his tools
    and prey, and Crab retaliates by using Juju to dry up water and by falsely instructing
    Elephant''s women to throw away all water and over-pepper the food.'
  language: English
  quote_policy: summarized
