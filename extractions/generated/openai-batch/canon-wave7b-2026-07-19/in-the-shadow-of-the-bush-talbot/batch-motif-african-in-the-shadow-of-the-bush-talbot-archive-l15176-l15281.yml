canonical_text:
  quote: ''
  summary: The passage describes reactions to Ekoi dances, then outlines several named
    dance practices. Ejame is presented as an old solemn dance performed only during
    funerary rites for very great chiefs, with seven principal dancers kept apart
    because their expanded aura is believed to be dangerous if it overlaps another's.
    Okpata is described as a dance involving two wooden fetishes set on a stone, one
    dancer, a harp player, restricted access for those knowing the mysteries, and
    an associated palm-leaf farm charm said to punish theft with sickness unless the
    dance is performed. The passage also mentions the Cat dance, imitative bird-flight
    dances, everyday-life song refrains, left-to-right movement, and children's action
    dances compared by the narrator to familiar games.
  language: English
  quote_policy: summarized
