- id: obs:11
  text: The songs sung during Ejame are said to be so old that their meanings have
    been forgotten.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: In Okpata, two little wooden fetishes are brought from the back of the Egbo
    house and placed upright upon a stone.
  category: action
  evidence_refs:
