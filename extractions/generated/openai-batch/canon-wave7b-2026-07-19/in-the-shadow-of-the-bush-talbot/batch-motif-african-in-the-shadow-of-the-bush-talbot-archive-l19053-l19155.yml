  text: The passage identifies the mysterious worker as a person named Oporopootop.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Planting and harvesting also occur mysteriously; the owners receive only a
    little for themselves and their wives, while the rest disappears.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tortoise's wife watches from a hut on the farm, hears a sound like wind among
