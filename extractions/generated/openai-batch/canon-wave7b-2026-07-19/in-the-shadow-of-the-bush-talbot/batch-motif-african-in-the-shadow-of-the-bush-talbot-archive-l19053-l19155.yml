canonical_text:
  quote: ''
  summary: A boy secretly preserves and steals fire from Obassi's sky home, brings
    it to Etim on earth, and is punished through loss of the ability to walk. The
    next tale begins with Tortoise and Ram whose farm work and harvest are mysteriously
    completed and removed by Oporopootop; Tortoise's wife watches the farm, feeds
    the visitor, scratches his skin ailment, and is swallowed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy takes a brand to dry wood outside the town, makes it catch alight,
    and covers it with plantain stems and leaves to hide the smoke.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At night, while the people are sleeping, the boy retrieves a glowing brand
    and firewood from the hidden fire and sets out homeward.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After reaching earth, the boy brings the fire to Etim and says he will show
    what to do with it; the first fire is then made on earth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Obassi Osaw looks down from his house in the sky, sees smoke rising, and sends
    his eldest son Akpan Obassi to question the boy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The boy confesses that he stole the fire and says he hid it because he feared.
  category: speech
  evidence_refs:
