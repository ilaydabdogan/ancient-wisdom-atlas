canonical_text:
  quote: ''
  summary: 'The passage first gives editorial comments on Ekoi folk-lore, including
    that sheep and tortoise are especially cunning animals and are comparable in function
    to Brer Rabbit and Reincke Fuchs. It then introduces a tale on how stories and
    history came among people: Mouse goes everywhere, observes hidden and secret things,
    and weaves story-children from what she sees. A second tale begins with Sheep
    and Leopard during famine. Leopard proposes killing and eating their children;
    Sheep hides her children and substitutes dried meat, while Leopard first kills
    her own child. Leopard later learns the deception and saves a daughter. When Leopard
    asks for one of Sheep''s daughters to join her daughter in the fatting-house,
    Sheep disguises her daughter with white chalk and dyes a goat black. Leopard mistakes
    the goat for Sheep''s daughter, kills it, and feeds it to her own daughter.'
  language: English
  quote_policy: summarized
