canonical_text:
  quote: ''
  summary: After receiving women slaves, cows, and guides, Agbo returns to a woman
    who had helped him on the way to the ghost people. She instructs him to use a
    matchet to cut thunderbolts and bees, carry half a thunderbolt in his bag, and
    send it ahead to kill his father. Agbo returns to his town, separates supporters
    and his mother from the rest, sends an elephant tusk to his father through Oru,
    then releases the half thunderbolt, which kills his father and all except those
    who welcomed him. The passage ends with a note that Obung, near Nsan, was said
    to have walked forward.
  language: English
  quote_policy: summarized
