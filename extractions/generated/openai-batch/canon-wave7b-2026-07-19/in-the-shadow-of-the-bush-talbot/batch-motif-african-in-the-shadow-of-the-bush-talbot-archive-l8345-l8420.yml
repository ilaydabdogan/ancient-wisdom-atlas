canonical_text:
  quote: ''
  summary: 'The passage describes travel in the South Cameroons: former slave-trade
    towns in a mountain landscape, traces of cat worship and a cat dance at Nkami
    and Ekoneman, the Awa River boundary and a new suspension bridge protected by
    a Juju, a small treasure chamber at Nfunum, and the route through ruined settlements
    toward Lake Ijagham, called the sacred lake of the Ekoi. It also states that knowledge
    of the lake had been kept from nearby German officials for years.'
  language: English
  quote_policy: summarized
