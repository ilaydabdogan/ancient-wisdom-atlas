canonical_text:
  quote: ''
  summary: The chapter passage describes Ekoi aesthetic appreciation, plant souls
    and pain when plucked, flowers and leaves used as social signs, beautiful domestic
    pottery, wall and body designs, women as wall decorators whose sense is attributed
    to Obassi, recognition of drawn flower images, and brief comparisons to other
    art traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator says the Ekoi show knowledge of flowers and delight in their
    form, colour, and leaf texture.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Flowers are seldom used for personal adornment and are not used to decorate
    homes; the stated reason is that great trees and the smallest plants possess souls
    and feel pain when plucked.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A young girl is occasionally seen wearing a single vivid flower in her hair
    for adornment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Leaves or blossoms are more usually worn by men and women as signs expressing
    definite messages.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The scarlet Akpanebesin worn behind a wrestler's ear is described as a challenge.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Ishut flower or Ekuri fern worn in hair or cap announces a death in the
    house of the man being addressed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Where suitable clay exists, water-pots are moulded with great care into beautiful
    shapes for domestic use, not for market or house decoration.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Some pottery forms and decorative patterns are compared by the narrator to
    Art Nouveau; Banana of the Logone weapon decorations are also compared to designs
    by Liberty.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Elaborate wall paintings occur in Egbo houses, while forehead designs and
    clipped head designs are said to show sureness of drawing.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The head chief of Ibum says women make the walls fine and need no teacher
    except the good sense given by Obassi.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: When shown a rapid drawing or colour sketch of a desired flower, Ekoi search
    parties recognize it, scatter to search, and often return with the specimen.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A returned flower specimen is exchanged for tobacco leaves.
  category: action
  evidence_refs:
  - ev:7
