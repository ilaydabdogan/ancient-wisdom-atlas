canonical_text:
  quote: There is a world beneath the earth whose king is Obassi Nsi.
  summary: 'The passage moves from Cretan labrys symbolism, in which an axe in a tree
    or pillar represents the union of sky-father and earth-mother and fertility, to
    an Ekoi axe representation with a cleft base, feather, and two circles interpreted
    by the author as possible tree/pillar, bird, and egg signs. It then discusses
    Ekoi deities Obassi Osaw and Obassi Nsi through a conversation with Ndum of Nsan:
    Nsi is kind, rules beneath the earth, and tells people to pray to the cruel Osaw
    so that Osaw may spare their lives.'
  language: English
  quote_policy: quoted
