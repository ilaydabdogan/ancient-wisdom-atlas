    customs: sacrifices before hunts, ritual treatment of a leopard skull, a coordinated
    hunting drive, a taboo on eating spotted antelope until rites with leaves are
    performed, and the opening of a story explaining a rule about hunters bringing
    apes to elders before eating them.'
