canonical_text:
  quote: ''
  summary: The passage describes court testimony about a husband accused of invoking
    the Juju Eburuk Pabi against his wife, its revocation by sacrifice after her illness,
    and customary divorce rites involving chalk, extinguishing fire with water, cutting
    hair, and covering the body with white paint.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wife who has not freed herself by the usual rites may be threatened by the
    Juju Eburuk Pabi if invoked by her husband; the passage says it may bring death
    unless revoked in time.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ekoli charged her husband Itui Ita before the Native Court with trying to
    bring about her death by invoking Eburuk Pabi.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Ekoli's account, a child died while Itui Ita was away, and she said the
    deaths of her children were caused by Obassi rather than by herself.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Itui Ita held a matchet in his right hand and the Juju in his left while calling
    on Eburuk Pabi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The invocation asked Eburuk Pabi to catch Ekoli if she would not come to Itui
    Ita, and not to catch her if she came.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ekoli said fever took her soon after the invocation, and she sent word to
    Effion Archibong.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Effion Archibong said he told the accused to gather meat for a sacrifice so
    that the Juju might be revoked; after the charm was revoked, the woman grew well.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The most common rite for freeing a wife is described as rubbing white chalk
    on both her hands.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A woman wishing to free herself without her husband's consent usually rakes
    out the fire, pours water on the embers until they die out, cuts her hair, and
    covers herself with white paint.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the unilateral freeing rite, the woman could never return to her husband,
    even if both parties wished it.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Awaw Otu testified that Machott pulled the kitchen fire onto the floor, poured
    water on it until it died out, cut her hair, and covered herself with white; he
    stated that she could not return as his wife.
  category: sequence
  evidence_refs:
  - ev:8
