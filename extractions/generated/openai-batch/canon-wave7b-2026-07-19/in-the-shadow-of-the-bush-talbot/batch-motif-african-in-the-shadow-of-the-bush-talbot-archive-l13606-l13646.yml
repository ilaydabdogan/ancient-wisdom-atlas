canonical_text:
  quote: ''
  summary: 'The passage describes Ekoi customary rules for land tenure and founding
    a new town: land is not sold but remains with heirs of first settlers; a group
    moving to a new site purchases settlement and use rights from another people;
    Oban''s founding is given as an example with goods paid for settlement, hunting,
    water, forestry, and final settlement; a meeting chooses the Egbo house site,
    apportions bush land to families, and erects a small hut called Ekpa Ntan, the
    house without walls.'
  language: English
  quote_policy: summarized
