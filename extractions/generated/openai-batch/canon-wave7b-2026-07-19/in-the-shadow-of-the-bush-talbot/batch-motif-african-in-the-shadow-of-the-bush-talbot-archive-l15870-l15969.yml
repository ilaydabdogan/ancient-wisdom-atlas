canonical_text:
  quote: ''
  summary: 'The passage describes Ekoi legal and punitive customs concerning poison
    precautions, murder, accidental killing, theft, fines, and the rule that a murderer
    should die in the same manner as the victim. It then begins an explanatory tale:
    a man has two wives, Nka Menge Njum and Menge Marri; the first bears a rapidly
    growing daughter, while the second remains barren. Menge Marri rejects the child,
    later lures her to a river under the pretext of fishing, throws her into the water
    to form a dam, and is rebuked by a blue bird sitting on a high tree. She throws
    stones at the bird, which escapes, catches fish, and draws the drowned child from
    the water.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dried herbs are kept near at hand as antidotes, used either as a lotion or
    as a drink; a guest may take an antidote before eating with a suspected hostile
    host.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the described murder custom, neighbouring head chiefs are summoned, judgment
    is given after seven days, and a guilty murderer is put to death without compensation
    or regard to wealth or position.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a death is proved accidental, the slayer may ransom himself by payments
    for his own life and for full brothers and sisters, lest blood guilt fall on them
    also.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Theft punishments include older mutilation penalties and later fines; for
    repeated offences a cow is shot, repayment is required, a bell is hung around
    the culprit's waist, the culprit is painted black and white, and is driven around
    the town.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that punishment was made to fit the crime and that, in
    older practice, a murderer was put to death in the same way as the victim.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The tale begins with a man who has two wives named Nka Menge Njum, glossed
    as 'Know nothing,' and Menge Marri, glossed as 'Know all'; the first wife bears
    a daughter and the second wife remains barren.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The daughter grows very quickly and can walk alone after five months; when
    she visits Menge Marri, Menge Marri drives her away and says she wants no children
    in her room.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: When the father goes hunting and the mother needs food and firewood, the daughter
    tells her mother to go and says that because Menge Marri dislikes her, the child
    is better left alone.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: After one safe day alone, the child is approached by Menge Marri, who invites
    her to go to the bush and catch fish in the river.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: At a river with many fish, Menge Marri throws the child into the water to
    form a dam.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: A blue bird sitting on a high tree beside the river protests that Menge Marri
