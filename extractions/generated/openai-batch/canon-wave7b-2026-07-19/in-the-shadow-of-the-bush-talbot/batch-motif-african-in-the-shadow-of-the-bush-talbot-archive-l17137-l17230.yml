canonical_text:
  quote: ''
  summary: 'The passage introduces Ekoi folklore, describing performance style, collection
    notes, and recurring characters and patterns: a sore-covered woman who tests travellers
    to the nether world, the Lame Boy as a beneficent helper connected with the origin
    of fire, a taboo against eating ghost food in the nether world, vegetable gifts
    brought back from ghosts to the living, former-limbed snakes, monster tales, and
    recurrence of the number seven. The collector also offers cautious comparisons
    with Arabian Nights tales, Prometheus, Persephone, Herodotus, and a Benin lame-man
    ritual.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chapter frames Ekoi stories as often tender, gracious, humorous, and containing
    traces of older beliefs.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some Ekoi stories are said to refer to a time when snakes had hands and feet;
    one story, Oporopootop, is described by the collector as involving dinosaur-like
    or monster ravages of farms.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ekoi storytellers are described as using dramatic recitative, chanting, and
    crooning, especially young boys.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The collector states that many tales were taken from sources not previously
    brought into contact with white influence, while some show resemblance to Arabian
    Nights stories and possible echoes of Herodotus.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Woman covered with Sores is described as a persistent character who meets
    all travellers to the nether world and helps or dooms them according to whether
    they pass tests of goodness of heart.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage notes that this sore-covered netherworld tester is male in one
    cited case only.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Lame Boy is described as a persistent Ekoi mythological character who
    plays the part of a Good Fairy and is associated with the story of how fire first
    came on Earth; a feminine version is noted in the tale Ada, the Forest Demon.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The collector suggests the Lame Boy may be important in West African ritual
    generally and cites a Benin custom in which a lame man was dragged around the
    city and to a named road-place, described by another author as probably purification.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Visitors to the nether world may not eat food offered by ghosts, because doing
    so prevents return to the sunlight; necessary food is usually provided by the
    Lame Boy or the Woman with Sores.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In one cited case tomatoes given by a dead sister’s ghost were brought back
    uneaten for planting in the upper world; in another, egg plants were given by
    the Chieftainess of the Ghosts to a returning visitor on condition that they be
    distributed among the living.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states that the number seven constantly recurs in these stories.
  category: other
  evidence_refs:
  - ev:9
