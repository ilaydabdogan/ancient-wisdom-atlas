canonical_text:
  quote: ''
  summary: The passage describes offerings to the Genius of the tree for vengeance,
    possible possession or imprisonment of cursed children, protective medicine administered
    by a Juju man, and a self-offering bargain that ends in imprisonment within a
    tree. It also recounts a court case involving an Esere bean ordeal over a charge
    of tree-imprisonment magic, an incident in which Oji says his namesake tree is
    calling him, Ekoi corroboration that tree calls occur in their country, and the
    opening of a story titled “Why Sacrifices are made to Cotton-trees.”
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A rich petitioner of the Erik race is said to offer a white bull, rice flour,
    and palm oil; poorer Ekoi may offer a white cock or lesser offering.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The enemy’s name is called aloud, and the Genius of the tree is said to hear
    and thereafter wait to take vengeance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A child born to a cursed person is said to be taken possession of by the tree,
    to see black shapes from birth, to be haunted by bush demons, and eventually to
    be seized and imprisoned unless delivered.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Protective medicine may be administered by pouring it on brass used for anklets
    or by cutting the face and rubbing in the medicine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A poor man may offer himself to obtain vengeance, wealth, or power, enjoy
    the results for a time, and later be called to exist imprisoned within the tree
    as long as it endures.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A court case is reported in which a man killed his brother by forcing him
    to undergo the Esere bean ordeal to clear himself of a charge involving an attempt
    to imprison their sister within a tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Oban, the warder Oji became delirious, attempted to run into the bush,
    struggled with officials, and said he had to leave because his tree was calling.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Oji explains that Oji trees grow both in water and on dry land, and that people
    who bear the tree’s name must run to the trees when they hear them calling at
    certain times of year.
  category: speech
  evidence_refs:
  - ev:6
