canonical_text:
  quote: ''
  summary: 'The passage explains Ekoi terms and beliefs about ghosts and spirits:
    the soul or spirit leaves the body with the final breath, becomes body-shaped,
    and can be seen by beings with “four eyes.” It describes good and bad ghosts,
    a good spirit restraining a harmful one, and a fatal encounter in which a bad
    spirit strikes a person in the face. The author also reports a similar Buduma
    account about Djinns of Lake Chad killing by a face-strike at night.'
  language: English
  quote_policy: summarized
