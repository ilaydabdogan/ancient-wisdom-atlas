canonical_text:
  quote: ''
  summary: A judgment scene explains why the Osing tree can speak only through seed
    shells used in divination. The passage then introduces Porcupine as a diviner
    consulted by animals and people. In the tale 'Porcupine Witch,' women fail to
    poison fish because a crocodile eats the leaves; Porcupine identifies the crocodile
    as the Head Chief in animal guise. The Chief regulates future fishing, and Porcupine
    later withholds and restores her divining charm after disputes over her share
    of the catch and offerings.
  language: English
  quote_policy: summarized
