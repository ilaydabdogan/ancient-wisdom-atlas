canonical_text:
  quote: ''
  summary: The passage reports a strong snake cult, an incident in which chiefs demanded
    punishment and appeasement after a python was killed, and beliefs about dangerous
    magical properties in python body parts, especially gall. It then gives a legend
    in which leopard gall is explained as lethal when mixed with food or drink; slaves
    use this knowledge to kill the free-born. A faithful girl-slave tries to protect
    her mistress and then the mistress's infant child. When the child is left alone,
    a calabash speaks and commands a basket and matchet to fetch plantains.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An official reported visiting a tribe where the snake cult seemed very strong.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A carrier killed a small python, cut it into lengths, and prepared pieces
    of it for cooking.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Chiefs and a crowd demanded that the carrier be punished, and also demanded
    the matchet, the dish, and a fine to appease the dead python so it would not return
    to trouble them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After a large python was killed near the prison, the warder intended to bury
    its dangerous parts secretly so they could not be used in witchcraft, but a chief
    clerk took them and they disappeared.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage identifies gall as the most dreaded of the python's dangerous
    parts and states that snake and leopard gall are feared for magical properties.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the legend, hunters killed a leopard, gave its meat to slaves, and carefully
    removed and kept the gall; free-born Ekoi are said not to eat leopard flesh.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A slave asked why leopard gall was removed, and his master explained that
    the gall was strong medicine that would cause death if mixed with food or drink.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: After learning the use of gall, the slaves plotted to kill the free-born and
    make themselves free.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A girl-slave warned her mistress not to eat or drink in the house, but the
    mistress ignored the warning, drank what other servants offered, and died.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The dead mistress left a tiny girl-babe, and the faithful girl-slave refused
    to abandon the child.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: When the girl-slave's sweetheart demanded the child in order to kill it, she
    returned to the house, placed the child inside, shut the door, and rejoined her
    companions.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: While the child cried alone, a large calabash on the wall spoke, slid down,
    and ordered a basket and matchet to go to the mother's farm and bring plantains.
  category: action
  evidence_refs:
  - ev:10
