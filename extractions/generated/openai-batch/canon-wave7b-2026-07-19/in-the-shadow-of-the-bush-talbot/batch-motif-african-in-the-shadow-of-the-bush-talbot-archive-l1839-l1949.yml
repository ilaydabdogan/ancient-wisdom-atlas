canonical_text:
  quote: ''
  summary: Two orphaned boys manage their fathers' property and perform death rites.
    The poor boy loses his animals, asks his rich friend for eggs to make sacrifice,
    and at sunrise appeals to Male God and Female God to open the gate. The eggs hatch
    into chicks that carry him to the sky kingdom of Obassi Osaw. There he washes
    a sore-covered woman, receives instructions for identifying Obassi by the red-fly
    Mfut, supplicates before Obassi, sees ghost people including his parents, and
    receives a small wish-giving box with prohibitions. Back on earth the box produces
    cloth, but the rich boy's wife touches it, and both sons die.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boys state that they are in charge of their fathers' property, have no
    brother or sister to share it with, and can care for themselves until grown.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boys perform the death customs step by step, first for the poor man's
    father and then for the rich boy's father, killing cows and goats for each set
    of rites.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The poor boy's chicks are carried off by a hawk and his one goat is eaten
    by a leopard; he tells the rich boy that he wishes to hang himself and die.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The poor boy asks the rich boy for eggs so that he may make sacrifice, and
    the rich boy gives him what he asks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At sunrise the poor boy holds the eggs toward the sun and calls on Male God
    and Female God to open the gate for him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The eggs slip from his hand, small chicks fly out, surround him, and fly with
    him up to the sky kingdom of Obassi Osaw.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In Obassi's land, the first person the poor boy sees is a woman covered with
    sores; after he washes her sores, she tells him how to identify Obassi by watching
    the red-fly Mfut.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Mfut alights on the shoulder of one chief, the boy supplicates before him,
    and Obassi says he knows the boy has come about the loss of his property.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Obassi shows the boy ghost people passing on their way to market, including
    Nsuma's mother, the two fathers, and Mkpaw's mother.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Obassi gives the boy a small box that will provide whatever he asks, but warns
    that it must never be left open and that no woman must touch it.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: After the boy returns to earth, the box produces a fine cloth for his friend,
    and the two boys dance.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The rich boy's newly married wife runs in, takes hold of the box before they
    can stop her, and both sons die.
  category: sequence
  evidence_refs:
  - ev:10
