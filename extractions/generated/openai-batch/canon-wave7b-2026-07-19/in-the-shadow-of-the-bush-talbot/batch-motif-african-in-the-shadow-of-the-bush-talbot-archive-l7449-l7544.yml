canonical_text:
  quote: ''
  summary: The passage contains the complete tale “The Flower Child” and the opening
    of “The Fruit Child.” In the first, a childless woman finds and plants something
    from the bush; a flowering plant produces a boy at its root. The boy asks that
    his origin be kept secret, but other women discover and name him as a flower-child.
    After the disclosure, he returns to the bush and is found dead beneath the flowering
    plant. The tale explains why children can no longer be obtained from plants and
    why bitter leaf is bitter. In the second tale, Okun and Eret gather a ripe Mbum
    fruit while hunting; food appears at their hut, and Okun later sees the fruit
    open and a beautiful girl come out to cook. The excerpt ends after she has stayed
    many moons and begins to say she must go back.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman is sad because she has never had a child; she goes into the bush,
    finds something, returns, plants it, and tends it daily.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tended plant sprouts, bears great flowers, and a beautiful boy is found
    sitting at its root.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman carries the boy home, hides him in her room, and speaks with him;
    the child tells her not to let anyone know where he came from.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Another woman opens the Childless-one’s room and sees who is inside; later
    women quarrel over the child, and a third woman identifies him as the son of the
    flowers of the tree.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The Childless-one says that if the boy is born of a flower, he is still the
    same as her own child to her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The boy cries and says that because people now know he is a flower-child,
    he must go back where he came from.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The next morning the boy runs from the room into the bush; the Childless-one
    searches and later finds him dead at the foot of a great plant with the same flowers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The narrator states that before this event a childless woman could get a child
    from a fruit or flower, but afterward no one can get a child from a plant anymore.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: The narrator explains that white people call the plant bitter leaf because
    its leaves became bitter from the woman’s tears as she buried the dead child at
    its root.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the second tale, Okun and Eret are two young male friends who go into the
    bush to hunt and gather a ripe Mbum fruit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The two hunters place the fruit on the bank of a stream near their hut; after
    they go hunting, prepared food is waiting for them on two successive returns.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: Okun hides in a hollow tree and sees the fruit open; a beautiful girl steps
    out, sets things in order, and cooks the evening meal.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: When Okun comes out, the girl tries to run away; he asks her not to leave,
    calls Eret, and the two persuade her to stay with them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: After many moons, the girl tells Okun that she must go back, but the provided
    passage ends before the destination is completed.
  category: speech
  evidence_refs:
  - ev:9
