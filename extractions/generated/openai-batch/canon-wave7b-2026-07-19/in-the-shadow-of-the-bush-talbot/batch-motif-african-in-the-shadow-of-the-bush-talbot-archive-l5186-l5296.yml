canonical_text:
  quote: ''
  summary: The passage describes Ekoi beliefs about totemic animal affinities, restrictions
    on killing or eating animals linked to a person, required medicine or sacrifice
    after transgression, and a reported nighttime ceremony involving medicines, darkness,
    rain, lightning, incantation, and participants assuming animal forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chief is described as roaming in buffalo form to oversee land reclaimed
    from the bush.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Marriage is described as permitted between different totem peoples, and children
    of such marriages appear able to choose a totem.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person does not shoot an animal of his own affinity, though he may kill
    animals of other affinities.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If a kill is thought to be an animal possessed by a townsman, ceremonies are
    performed over the body and medicine is taken to the person whose totem it was.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage reports disagreement over whether the person's death coincides
    with the animal's death or whether the person weakens while the animal body remains
    entire.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A person who unknowingly eats an animal of his linked family falls sick, consults
    his Juju, and recovers after the required sacrifice; knowingly eating it is said
    to cause death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ododop farms are described as remaining untouched by boar, bush cow, and other
    wild beasts, despite visible animal tracks.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: A witness reports being awakened at night by an unearthly noise and finding
    his light extinguished.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The witness sees shadowy people of both sexes and all ages sitting and speaking
    quietly, with his landlord among them.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: Two wooden bowls containing Ekpo Juju and bottles of herbal decoctions stand
    before the landlord; a palm-branch brush lies on one bowl.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: When the landlord sprinkles the bowl contents toward the witness, the witness
    falls, loses locomotion, and the compound becomes dark.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Rain falls heavily and lightning reveals the features of the company.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:13
  text: The company members are described as capable of assuming ferocious animal
    forms and as formerly feasting on human flesh.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: After the landlord throws more decoction on the witness, the witness becomes
    insensible.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: People plead that the witness had been kind to them; the head of the house
    forces a pellet down the witness's throat and begins an incantation.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: All present assume the shape of ducks and drink rainwater from pools, except
    the paramount chief, who assumes the form of a large elephant.
  category: action
  evidence_refs:
  - ev:16
