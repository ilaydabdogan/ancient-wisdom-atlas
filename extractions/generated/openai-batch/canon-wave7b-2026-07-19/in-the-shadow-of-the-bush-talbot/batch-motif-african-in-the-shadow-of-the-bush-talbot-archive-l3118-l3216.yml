canonical_text:
  quote: ''
  summary: 'The passage describes an Egbo New Year performance, especially the Ekuri
    Ibokk hunting Juju image with crocodile mask, river-bed mud, Juju leaves, an axe
    in its jaws, and attendants. It then explains Egbo symbols of authority and sanctions,
    debt recovery through the Egbo Lodge, and begins a story of how the first Egbo
    image came: Nki follows a fallen palm kernel through a crab hole to a ghost town,
    where a chief compensates him with a drum that produces food.'
  language: English
  quote_policy: summarized
