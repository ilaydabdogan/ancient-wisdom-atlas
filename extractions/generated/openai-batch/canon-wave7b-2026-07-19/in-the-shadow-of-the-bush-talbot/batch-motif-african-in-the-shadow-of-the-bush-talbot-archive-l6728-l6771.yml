    Ekwaw's room; Obassi confirms the report, confronts Ekwaw, and announces that
    Nsibidi will be played after seven days. Ekwaw, a little slave, and seven young
    men are chained and ordered killed by Nsibidi. Before Ekwaw dies, she and Obassi
    return the hats they had exchanged while in love. Afterward a law forbids men
    from changing hats with wives, and the passage links Ekwaw's deception to women
    no longer wearing hats.
