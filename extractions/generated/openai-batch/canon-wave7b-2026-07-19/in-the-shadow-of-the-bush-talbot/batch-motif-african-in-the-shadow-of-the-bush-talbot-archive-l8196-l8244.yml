canonical_text:
  quote: ''
  summary: The passage describes hunting dogs and their ritual confirmation by Juju,
    sacrifices before elephant hunting, signs by which a were-elephant may be recognized,
    and rites by which an unlucky hunter seeks release from witchcraft through offerings,
    libation, prayer to Obassi and the ghosts, divination, and a Juju ceremony involving
    the hunter's gun.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dog leads its master to a hole, and the master obtains a porcupine there.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young dog may be bought and confirmed by Juju for hunting; before the rites
    it is not very useful, and afterward it can hunt alone when grown.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some dogs hunt with their masters, while many go alone; after killing something
    they return, wag their tails, and may have blood on their mouths.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Before hunting elephant, a hunter usually sacrifices to a special fetish found
    in most villages.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says that hunters are not killed unless the sacrifice has been
    neglected, and that the rites protect a man from shooting a were-elephant by mistake.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A were-elephant is said to give a sign, usually by lifting the right fore-foot
    and bending down the head at the same time.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: An unsuccessful hunter usually attributes failure to witchcraft.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: To break spells, the hunter takes dried meat and plantains to a place on the
    road outside the village, spreads out the sacrifice, pours spirit on the ground,
    and prays to Obassi and the ghosts for release.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: If the ill-luck continues, the hunter consults a Diviner, who questions a
    charm and says the witchcraft is very strong and requires a powerful Juju.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A prayer asks that the hunter's gun and the hunter himself be protected so
    that ill-spells have no power over them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After members of the Juju feast at the hunter's expense, the Diviner returns
    the gun with a blessing or instruction to go into the bush with good fortune.
  category: sequence
  evidence_refs:
  - ev:7
