canonical_text:
  quote: ''
  summary: 'The passage frames Nsan or Nsann, Thunder town, as a recurring Ekoi folklore
    destination, often in the underworld, to which an unjust father sends an unloved
    son on a destructive mission. It then tells of Obassi Osaw, who favors his son
    Oru and rejects his son Agbo. Agbo succeeds in trapping birds and hunting antelopes,
    shares with Oru, but is rejected by his father and helped by his mother. Obassi
    sets Agbo impossible tasks: felling a cotton tree, splitting a high rock, retrieving
    a stone from a lake, and finally going to Thunder town for an elephant tusk. Agbo’s
    mother, sometimes with a witch friend, secretly makes the tasks possible and gives
    him food and encouragement for the road. The passage ends with Agbo encountering
    Ita Ebat Ane, Chief of the ghost people, bathing in a spring.'
  language: English
  quote_policy: summarized
