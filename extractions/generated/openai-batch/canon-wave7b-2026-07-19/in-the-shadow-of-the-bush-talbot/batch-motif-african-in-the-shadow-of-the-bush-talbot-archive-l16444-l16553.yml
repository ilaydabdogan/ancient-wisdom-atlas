canonical_text:
  quote: ''
  summary: 'The passage gives several ethnographic anecdotes: a prisoner avoids a
    charge by saying he spoke only to plantains, an old woman of Nsan visits the D.C.
    with a handmade mat and speaks of being the last of her age group, the narrator
    describes Ekoi reverence for age and indulgence toward children, young children
    petition or give offerings to the white man, and children imitate Juju processions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prisoner is brought before Court for allegedly breaking prison rules by
    speaking to his wife without permission, and he pleads not guilty despite witnesses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prisoner says he saw his wife at the prison gate with a basket of plantains
    and addressed the plantains rather than any person.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: An old woman at Nsan visits with a small mat made by her own hands and says
    she came so that she might see the face of the D.C., whom she calls Father.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old woman is described as standing in vivid sunshine, leaning on a stick,
    shrunken and feeble, with bright eyes and a clear, kind voice.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old woman says she is the oldest woman of Nsan and that she alone remains
    from those who danced with her in moonlight or sunshine.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The narrator states that the Ekoi show reverence for age and love of children,
    and that the oldest man of a town is normally its head chief unless excluded by
    poverty and club status.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A child of about three enters the Rest-house to see the white man and complain
