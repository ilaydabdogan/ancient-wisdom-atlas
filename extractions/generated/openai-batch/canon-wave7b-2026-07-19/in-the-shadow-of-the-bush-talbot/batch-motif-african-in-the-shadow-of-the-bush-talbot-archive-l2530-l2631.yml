canonical_text:
  quote: ''
  summary: A displaced couple living in the bush pray to Obassi at the River of Good
    Fortune for a child. A son is born holding a Juju knife and a calabash of Juju,
    speaks immediately, refuses the usual newborn drink offering, and rapidly walks.
    He says he was sent by Obassi and later uses his knife to find a path into the
    bush, makes medicine from plantain and leaves, encounters a speaking cotton tree
    that demands sacrifice, and enters a ghost town while invisible through his calabash.
    He joins ghost wrestling, is pushed onto a Juju matchet, dies, and remains dead
    while a surviving ghost revives the other ghosts with medicine.
  language: English
  quote_policy: summarized
