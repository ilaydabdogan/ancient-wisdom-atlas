canonical_text:
  quote: ''
  summary: A man verifies that a girl appears from the river when he strikes a palm
    tree. A diviner prescribes offerings to a crocodile and hunting nets; after the
    offering is thrown into the river, the girl rises and is caught and brought to
    land. She accuses her father's new wife of stealing a goat and using magic to
    make a river-crossing rope break for her. The Head Chief asks the town to judge,
    and the town condemns the witch-wife to death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man asks to be taken to the place where he saw the girl and watched while
    he climbed a palm tree; the chief sends him to the river with three men, and Uponnsoraw
    also goes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man climbs the palm tree and strikes it with his matchet; the girl rises
    to the surface covered with ornaments and then sinks again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The witnesses return to the chief and report that the man spoke truth because
    they also saw the girl.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The town fetches the Diviner, who practises a charm and instructs them to
    bring a black cock, an egg, white cloth, red cam wood dye, yellow ogokk powder,
    and hunting nets.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Diviner says the items except the red powder are to be sacrificed to the
    crocodile, while the nets are to be held ready.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: When the offering is thrown into the river, the girl rises; the people cast
    nets, catch her like a fish, draw her to land, wash her with red powder and sand,
    and carry her to the chief's house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The cruel witch-wife comes to salute the girl, but the girl refuses to see
    her and says Crocodile told her the witch-wife stole the goat.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The girl asks her father to call all the people, and she is carried before
    the Egbo house to speak.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Before the gathered townsfolk, the girl says her father's new wife stole the
    goat to destroy her and made magic so that a rope would carry the wife across
    the river but break when the girl crossed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Head Chief tells the town to give judgment, and the town cries that the
    witch shall die for her crime.
  category: speech
  evidence_refs:
  - ev:6
