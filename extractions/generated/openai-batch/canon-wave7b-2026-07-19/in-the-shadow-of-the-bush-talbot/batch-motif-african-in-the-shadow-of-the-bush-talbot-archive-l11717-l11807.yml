canonical_text:
  quote: ''
  summary: 'The passage describes the funeral ceremonies for Itorok, head chief of
    Oban: washing and wrapping the corpse, burial in the bush with libations, medicines,
    grave goods, spear rites, drums, an attributed Egbo lament, grave markers, household
    mourning and protective palm leaves, eighth-day animal sacrifices and performances,
    an extended wake, and a reported older custom of killing attendants so the chief
    would have servants in the spirit world.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Itorok, head chief of Oban, died in December 1907, and the account is presented
    as typical of funerals for important members of his race.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The corpse was washed with heated water, dressed in the dead man's best robes,
    wrapped in a reed mat, wound with new cloth, and covered with three additional
    mats tied fast.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The body was carried about 100 yards into the bush, laid on the ground, and
    a six-foot by six-foot grave was dug in the presence of the chiefs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Agbashan approached with rum and Juju medicine, had red and yellow powder
    on his face, poured rum as a libation, spat medicine near the corpse's head, and
    placed dishes, a cup, and a spoon in the grave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A net was divided into three pieces, placed under the body, and used by six
    of the dead man's members to lower the corpse into the grave.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Chief Itaban struck a Juju spear twenty-five counted times against the corpse's
    heart, and those present called out “Owe” at each touch.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Three young men beat drums softly while another sound, whose source the narrator
    could not locate, was said to be the voice of the invisible Egbo lamenting the
    dead chief.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the nets were drawn up, another cloth and three calabashes filled with
    earth were placed on the body, and the grave was filled in.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A perforated brass pan was set at the head of the mound, and a sapling from
    a Juju tree was planted close by.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The burial was held in the bush rather than in the house because the deceased
    had died of dysentery and cough, which were considered very infectious.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Women were not allowed to attend a chief's funeral; they remained in the dead
    man's house, weeping by an empty coffin that was later lowered into a hole in
    an inner room.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the empty coffin rite, the house was cleared and young palm leaves were
    tied to the lintels as a sign forbidding entry and as protection against bad ghosts
    and spirits.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: On the eighth day the door was opened, a goat and cow were sacrificed, the
    goat and plantains were placed under Juju Obassi Nsi, and the cow was killed by
    suffocation.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Clubs to which the dead man had belonged performed plays with yellow powder
    on performers' faces, and funeral dance spear-holding rules distinguished free
    men from those not free.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: A wake continued for months; the passage says that under ancient custom the
    six members who lowered the coffin would have been killed and buried in the master's
    grave so the chief would not reach the spirit world without servants.
  category: sequence
  evidence_refs:
  - ev:11
