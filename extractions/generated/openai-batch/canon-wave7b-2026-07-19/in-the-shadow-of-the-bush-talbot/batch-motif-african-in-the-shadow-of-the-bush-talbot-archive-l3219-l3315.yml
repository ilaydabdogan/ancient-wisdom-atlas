canonical_text:
  quote: ''
  summary: Nki hires workers and feeds them. Ngbe/Leopard refuses to help but takes
    food, then later steals and breaks Nki's magic drum. Nki reaches a ghost town
    through a crab hole and receives the long drum Egyuk. When beaten, the drum releases
    Egbo images that flog people. Ngbe steals and breaks this drum too, leaving the
    images unable to return to it. The passage explains the present running and beating
    of Egbo images and the name Egbo, then adds a note on Egbo Club and other societies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nki hired the men of the town to cut his farm; all went except Ngbe, and Nki
    cooked twelve large calabashes of food each day for the workers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nki later hired women to plant the farm and fed them; Ngbe's wife took her
    portion home, where Ngbe seized and ate it, prompting her to reproach him for
    eating food after refusing to work.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nki put the magic drum in an inner room, locked the door, and instructed the
    Lame Boy not to give the key to anyone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Nki left, Ngbe demanded the key from the Lame Boy and threatened to
    kill him if he refused, so the boy gave him the key.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ngbe opened the room, took the drum into the bush, beat it, and several calabashes
    full of sweet things appeared.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ngbe ate what he could, left the rest, broke up the drum, threw away the pieces,
    and went home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When Nki returned, the Lame Boy told him what Ngbe had done, and Nki was sad
    over the loss.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nki went into the bush, cut palm kernels, threw a kernel into a crab hole,
    pushed it down with a stick, and followed it through the hole to the ghost town.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the ghost town, Nki told a chief that one of the chief's sons had taken
    his palm kernel and asked for it back.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The chief gave Nki Egyuk, described as the long kind of drum now found in
    Egbo houses.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: When Nki beat the long drum in the bush, an Egbo image sprang out and flogged
    him with a whip, then returned into the drum after he kept beating it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: On the next day, Nki went out as if farming, and Ngbe again obtained the key
    from the Lame Boy, who gave it because Nki had told him to do so.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Ngbe took the long drum into the bush and beat it furiously; seven Egbo images
    sprang out, each armed with a whip, and flogged him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Ngbe broke the long drum and threw the pieces into the bush; the images could
    no longer return to the drum and ran into town beating those in their way.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The narrative states that the images run about and beat those who cross their
    path because Ngbe broke the first long drum from the ghost town, and that they
    are called Egbo because Nki named the first image that came from the magic drum.
  category: other
  evidence_refs:
  - ev:8
- id: obs:16
  text: The passage adds that, besides the Egbo Club, there are many secret and non-secret
    societies with varied purposes, and that many grew from age classes that later
    allowed outsiders to join.
  category: other
  evidence_refs:
  - ev:9
