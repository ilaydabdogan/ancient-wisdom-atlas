canonical_text:
  quote: ''
  summary: 'Snake persuades Cow and Goat to eat produce from Obassi''s farm despite
    the prohibition. Afion Obassi secretly observes the eating and reports it. Obassi
    judges the animals: Cow is assigned plantain rinds, Goat yam peelings, and Snake
    loses hands and feet. A following tale begins with a title about Lizard''s moving
    head. In the old days, when beasts could speak, Obassi Nsi marries daughters of
    animals and gives rich gifts. Tortoise, having no daughters, disguises two sons
    as girls, presents them as wives, receives double wealth, and tries to prevent
    their bodies being seen; the head wife discovers the deception and reports it.'
  language: English
  quote_policy: summarized
