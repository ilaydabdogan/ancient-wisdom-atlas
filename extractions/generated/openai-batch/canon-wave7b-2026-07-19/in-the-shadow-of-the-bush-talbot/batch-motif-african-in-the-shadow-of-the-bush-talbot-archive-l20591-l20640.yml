canonical_text:
  quote: ''
  summary: The passage ends one animal tale with the Ant King acclaimed as lord of
    the bush while monkeys choose to live in branches. It then begins a tale in which
    Ukpong Ma dies, her husband Uponnsoraw takes a new wife, the new wife becomes
    jealous of his daughter, sends the girl to fetch water from a distant river, kills
    and hides a goat while the girl is away, and the father later asks about the missing
    goat.
  language: English
  quote_policy: summarized
