canonical_text:
  quote: ''
  summary: Etim requests water from Lord Obassi's town to take back to earth. Obassi
    gives him a bound calabash containing a water charm with seven gifts. Etim opens
    it alone, finds seven clear stones, and makes a stream that becomes a lake. His
    wife bears seven sons and later seven daughters. Etim arranges marriages between
    the sons and daughters, distributes waters to the sons, rewards or removes waters
    according to their treatment of him, then instructs later descendants to create
    rivers and streams with smooth stones. One son disobeys by casting many stones
    together in one place.
  language: English
  quote_policy: summarized
