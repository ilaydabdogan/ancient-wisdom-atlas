canonical_text:
  quote: '"If they kill you, your blood will call and let me know."'
  summary: A girl returns from beneath a stone and water after a sacrifice, carrying
    a fish. She repeatedly feeds the fish and commands it to grow. When sent to market,
    she warns the fish not to answer calls. Her small sister and others lure and kill
    the fish; its blood signals the girl. She collects the blood, mixes it with Juju
    leaves, and uses the mixture on a palm tree to kill her father and mother. Neighbours
    refuse her fire and drive her into the bush, after which she seeks Porcupine's
    charm.
  language: English
  quote_policy: quoted
