canonical_text:
  quote: ''
  summary: 'The passage gives an origin explanation for sacrificing a cock to many
    Jujus, then describes Tortoise telling ghosts that he too must be sacrificed by
    impalement for having come uninvited to the ghost town. A second tale begins:
    Tortoise wants presents, finds the dead body of Obassi Osaw''s slave, claims to
    have a beautiful daughter coming out of the Fatting-house, accepts marriage presents
    from Obassi, arranges secrecy for the wedding journey, and places the dead body
    on a prepared bed in Obassi''s room.'
  language: English
  quote_policy: summarized
