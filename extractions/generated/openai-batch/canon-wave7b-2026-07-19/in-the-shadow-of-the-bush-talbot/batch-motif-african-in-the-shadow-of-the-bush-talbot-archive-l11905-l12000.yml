canonical_text:
  quote: ''
  summary: 'The passage describes Ekkpa women''s funeral performances, offerings of
    goat meat and drink to ancestors and ghosts during Adet Awaw''s funeral, and an
    etiological tale explaining why a goat is sacrificed at every funeral: a returning
    ghost woman''s talking magic cloth is transferred by a frightened boy to a he-goat,
    after which ghosts decree that goats may be sacrificed whenever anyone dies.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The women's society Ekkpa gives performances at the death of a member and
    also at farming and new-yam seasons.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports that some people consider Ekkpa powerful enough to occupy
    for women a role comparable to men's Egbo, and that its Juju can kill a man or
    ward off sickness, especially small-pox.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Adet Awaw's death, Ekkpa members ran around the town nearly naked, with
    some brandishing guns and swords.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men kept out of sight during the Ekkpa performance; after dark no man was
    to show his face, and a male glance at the mysteries was said to cause permanent
    loss of strength and vital powers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Men may join the cult by payment, but only as outside members who do not take
    part in the ceremonies.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: During the funeral plays, sacrificial animals were divided, and the Head of
    the House offered pieces of goat flesh and boiled plantains while calling on principal
    ancestors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Head of the House threw meat into the court as the ancestors' portion
    for the dead sister.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Men and women sat in separate groups to receive meat; Adet Awaw's sister distributed
    a small quantity of spirit to all.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Head of the House poured remaining spirit on the ground so that ghosts
    might drink, and a wake for the dead woman lasted several weeks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that a goat is always sacrificed at funerals and introduces
    a story to explain this custom.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the explanatory story, a woman's ghost returns to earth with a magic cloth,
    leaves it by a road, and a boy takes it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The magic cloth speaks and identifies itself as tied around the boy's loins.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The boy removes the cloth and throws it over a he-goat; the goat ties it around
    his middle, hears it answer the Ghost Woman, and buries himself in the earth while
    leaving one hoof above ground.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Ghost Woman notices the trembling hoof, cuts it, sees blood, and pulls
    out the goat with the cloth still tied around him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Other ghosts come at the Ghost Woman's call, spit and throw foul things on
    the goat, explain the smell of he-goats, and declare that goats may be sacrificed
    whenever anyone dies.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Final funeral rites are performed when relatives have collected enough money
    and food, and social criticism follows long delay.
  category: sequence
  evidence_refs:
  - ev:10
