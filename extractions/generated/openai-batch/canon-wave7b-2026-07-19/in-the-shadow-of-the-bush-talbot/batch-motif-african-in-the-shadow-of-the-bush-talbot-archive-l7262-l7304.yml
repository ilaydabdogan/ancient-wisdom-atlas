canonical_text:
  quote: he was very angry and shut the gates of mercy to mankind
  summary: After staying with Obassi, the boy asks to visit his other parents and
    promises to return. Obassi agrees and gives him a present. On the road, the woman
    from the mountain town follows him; the boy takes her home and never returns.
    Obassi sends war-men to punish him. Because Obassi had shown the boy the Jujus
    of good and evil, the boy uses magic to make the war-men fight each other, and
    most die. Obassi then closes mercy to mankind because of the couple’s fault. A
    note compares the passage to Genesis iii. 5.
