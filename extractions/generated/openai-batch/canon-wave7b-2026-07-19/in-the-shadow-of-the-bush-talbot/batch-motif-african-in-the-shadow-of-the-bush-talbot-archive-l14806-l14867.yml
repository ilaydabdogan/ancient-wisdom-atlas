canonical_text:
  quote: ''
  summary: The passage describes Ekoi stilt play, including a 1910 New Year's performance
    with veiled principal performers, a one-stilt figure identified with the Lame
    Boy or Good Fairy of Ekoi tales, minor characters wearing Piper leaves sacred
    to ghosts, and the statement that the play honored ghosts and included Obassi
    Osaw and Obassi Nsi. It also describes wrestling customs with drums and earth-touching
    gestures, ball games, cat's-cradle, tops, Mancala, and a chess-board-like game.
  language: English
  quote_policy: summarized
