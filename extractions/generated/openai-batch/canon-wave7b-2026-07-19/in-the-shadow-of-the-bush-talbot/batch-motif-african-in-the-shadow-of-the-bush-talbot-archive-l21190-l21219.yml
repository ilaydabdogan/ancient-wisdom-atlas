  summary: The passage lists several Ekoi clubs or societies, including Itiatt Obbonn,
    Angbo, Nsikpe, Mfuor, Ekkpa, and Kpifonn. It describes membership restrictions
    by age, gender, or status; lodges and night dances; associations with Juju worship
    or named worship figures; a cane head-structure worn by the Okum; and distinctive
    tunes and drum-beating patterns by which clubs can be identified at a distance.
