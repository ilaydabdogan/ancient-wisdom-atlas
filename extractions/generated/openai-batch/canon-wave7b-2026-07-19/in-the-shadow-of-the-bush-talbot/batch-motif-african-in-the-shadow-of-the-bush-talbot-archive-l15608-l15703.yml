canonical_text:
  quote: ''
  summary: The passage describes Nsibidi as a secret, partly pictographic writing
    system with disputed origin traditions, including Efik use, Ibo or Uyanga origin
    claims, an unverified story of learning from monkeys, and an Ekoi claim to origination.
    It also describes an old Nsibidi chiefs' club charged with executions, a calabash
    record of a trial, the symbolic markings of executioners, and the beginning of
    a story in which a town law imposes death for leaving palm leaves in the Egbo
    house.
  language: English
  quote_policy: summarized
