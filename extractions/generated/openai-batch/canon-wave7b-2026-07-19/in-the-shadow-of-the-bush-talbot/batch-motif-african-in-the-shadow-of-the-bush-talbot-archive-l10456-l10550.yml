  quote: ''
  summary: The passage reports witchcraft treatments in which animals or familiars
    are expelled from the mouth, describes beliefs about witches, wizards, animal
    transformation, protective plants, Esere medicine, and owl omens, then gives an
    origin tale explaining why the owl became a witches' familiar and briefly notes
    crab claws in witchcraft practice.
  language: English
  quote_policy: summarized
literal_observations:
