  text: A woman vomits medicine, and a small bat followed by a frog comes out of her
    mouth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The priest tells the husband to take his wife home, give her an Esere bean
    to drink, and regard the payment as due if she survives after the witchcraft has
    been driven out.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mbe gets the Esere bean and grinds it on a stone; the wife drinks, vomits,
    and becomes well again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the husband goes hunting, the wife runs away to Akot Ekpim and complains
    that the townsfolk have seen her shame.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A great Juju man is said to have driven a black butterfly familiar from between
    a witch's lips after laying his hand across her mouth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Witches and wizards are described as able to transform themselves at will
    into any animal, most often into bat or owl forms.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Witches are described as having a special bird-like cry, and the shell of
