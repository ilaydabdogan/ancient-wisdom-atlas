canonical_text:
  quote: ''
  summary: 'The passage describes Oban Okum clubs as broadly typical of Ekoi towns,
    distinguishes clubs revived only for special occasions from those in constant
    use, and gives details for two ancient clubs: one associated with avenging murdered
    members and a dance with rattles and a dangerous unauthorized dress; another involving
    a spoken formula, medicine-water poured over members, a cane headpiece, and a
    ram fine for crossing dancers.'
  language: English
  quote_policy: summarized
