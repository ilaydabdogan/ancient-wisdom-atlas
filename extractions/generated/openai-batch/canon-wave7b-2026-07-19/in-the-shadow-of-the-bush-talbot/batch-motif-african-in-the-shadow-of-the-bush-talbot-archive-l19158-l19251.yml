canonical_text:
  quote: ''
  summary: The passage ends a tale in which Oporopootop swallows Tortoise, then fights
    Ram, who kills him and frees the bush from his threat. It then gives an origin
    account in which Obassi creates a man and woman, brings water to earth as a stream,
    plants a palm kernel, and teaches the couple the uses of water and palm products.
    The final section begins an etiological tale about Python, whose pregnant wife
    craves Aju fruits; Python, in a time when pythons had hands and feet, takes fruit
    from a man's farm and is confronted by the owner's limbless son.
  language: English
