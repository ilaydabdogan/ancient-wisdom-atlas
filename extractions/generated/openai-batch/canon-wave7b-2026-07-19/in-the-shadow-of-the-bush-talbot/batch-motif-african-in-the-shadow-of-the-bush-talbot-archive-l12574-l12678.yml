canonical_text:
  quote: ''
  summary: A ghost man named Echi travels through towns borrowing limbs and weapons,
    becomes handsome, and marries Atem during a funeral performance. On the return
    journey he gives back the borrowed parts until only a skull remains, and he brings
    Atem to the ghost town. A ghost woman who recognizes Atem as her sister protects
    her from ghosts who want to kill and eat her, warns her not to eat ghost food,
    gives her tomatoes, and sends her home with a secrecy injunction. Atem consults
    Nyopp, Porcupine, who prescribes a charm involving tomatoes, a sacrifice, and
    seven leaves. Pursuing ghosts cannot count the seventh leaf, eat the sacrifice,
    and depart; the tale explains why ghost sacrifices keep ghosts from entering homes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Echi, while travelling, asks successive towns for body parts: a hand, a neck,
    a second hand, a belly, loins, and two feet; he also asks for a matchet and a
    gun.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: With his borrowed limbs, the stranger appears beautiful enough that an unnamed
    woman falls in love with him and asks him to stay; he gives her the name Nopp
    Amba.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Echi goes to the town where people are “playing” for a dead woman, tells them
    his real name, and excels in singing and dancing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A woman named Atem notices Echi’s dancing and voice, falls in love with him,
    and agrees to take him as her husband while he stays in the town.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the funeral playing ends, Atem asks to go with Echi; although he refuses,
    the town decides that because he married her, she may choose, and the couple starts
    back together.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: On the return route, Echi gives back the gun, the matchet, and the borrowed
    parts of his body at the places from which he received them, and his body becomes
    smaller.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Atem regrets marrying Echi after seeing his body diminish; when she refuses
    to continue, he says there is no turning back.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: After the last town is passed, only a skull remains to Echi; Atem and Echi
    then enter the ghost town.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A woman ghost recognizes Atem as her sister and asks that Atem come to her
    house.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The ghost people want to kill and eat Atem, but the sister hides her and warns
    her not to eat ghost food because eating it would make her die.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The sister gives Atem tomatoes for hunger, sends her onto the homeward road,
    and tells her not to tell anyone what she has seen in the ghost town.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: When Atem returns home feeling ill, Nyopp, Porcupine, performs a charm and
    instructs her to put remaining tomatoes into soft earth, make a sacrifice at the
    town entrance, and lay seven leaves on the ground.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Pursuing ghosts find the leaves and count only to six; they cannot add seven,
    eat the sacrifice, and depart.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage explains that before this event hungry ghosts entered towns and
