canonical_text:
  quote: ''
  summary: Eyo is entrusted with cloth for Osaw but abandons the errand among beautiful
    women for years. Nsi then sends his son 'Mi to Nsann, Thunder town, to obtain
    a cow as a gift for Obassi Osaw. Warned by his mother not to reveal where he sleeps,
    'Mi avoids a fatal thunderbolt, receives the cow, and returns. Nsi plots against
    him and later banishes 'Mi and his mother. In the bush, 'Mi hears the voice of
    his dead friend Isse, chooses death over life under his father's hostility, falls
    asleep, and awakens in a cleared sunny place with a feast and Isse appearing as
    in life.
  language: English
  quote_policy: summarized
