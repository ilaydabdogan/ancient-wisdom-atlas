  summary: The passage recounts a dispute in which a woman accused of witchcraft is
    connected to the oracle-like Juju Akpambe, household signs are discussed as proof,
    and she eats the Esere bean publicly to clear herself. It then introduces a birth
    belief that a childless woman may have a child waiting in her womb for years,
    followed by the opening of a tale in which God creates a couple, the woman remains
    childless for seven years, and a boy appears after a birth episode in the bush
    while she holds a tree.
