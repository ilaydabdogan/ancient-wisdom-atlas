literal_observations:
- id: obs:1
  text: An expectant mother is said to take precautions from the moment she knows
    she is about to become a mother, in order to ward off ill.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: She must avoid going near the tree called Njo Uru when passing along a road
    or through the bush; the bark is used in fishing, and the stated consequence of
    approaching it is the child's death.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman and her husband may not eat elephant flesh, and the woman must also
    abstain from porcupine, water chevrotain, and leaves of gourd or pumpkin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says certain indications make it probable that gourd or pumpkin
    plants were once regarded as totems.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: The woman must sacrifice to her household Juju, with Osam, identified as Spear,
    named as the most ordinary one; the rite uses a calabash or lightly baked earthenware
    pot filled with food and pierced by a spear.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Just before the expected birth, the head women of the town assemble and give
    the mother soothing draughts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: From the head women's entry until after the babe is washed, no man may approach
    the house; the father and his male relatives may be present at anointing with
    palm oil.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After birth, the mother is secluded for one or two months, and may go to the
    fatting-house for four to six months if the grandmother can bear the expense;
    during that time the husband does not visit her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: On returning to ordinary life, the young mother sacrifices to her Juju, while
    the husband makes an offering to his.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the babe is first carried outside the birth-room, the mother or her mother
    carries it to the threshold between her two palms, and a female relative begins
    a water-throwing action in the supplied text.
  category: action
  evidence_refs:
  - ev:6
