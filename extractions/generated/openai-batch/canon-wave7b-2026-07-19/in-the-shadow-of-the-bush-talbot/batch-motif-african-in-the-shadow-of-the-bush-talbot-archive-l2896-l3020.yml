  quote: ''
  summary: The passage describes grades of the Egbo society, their entrance conditions,
    markings, officials, insignia, secrecy rules, ceremonies involving dance, palm
    wine and meat, and the final Nkanda grade with special body markings, restricted
    display of the Okum image, and named offices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists multiple Egbo grades, including Ekpiri Ngbe, Ebu Nko, Mbawkaw,
    Ndibu, Oku Akama, Eturi, and Nkanda.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:5
- id: obs:2
  text: Aspirants to Ebu Nko are marked with white chalk on both arms, and aspirants
    to Mbawkaw are marked on the forehead with cam-wood dye.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first three listed grades are collectively called Abonn Ogbe, described
    as children of the Egbos.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ndibu is described as the second division, a high-honour grade, and often
    called the Mother of the Grades.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The text says that expelling a member who had reached Ndibu was followed by
    death to prevent revelation of secrets.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: During a Ndibu joining rite, chiefs and officials remain in the Egbo house
    while young men dance and play around the town.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The aspirant's best friend brings a calabash containing a leg of meat and
    two bottles of palm wine.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The postulant sits before the Chief, receives powder on his head, hears the
    names of the Egbo recited, then invokes the names himself while the chiefs answer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Ndibu play lasts about eight days, with palm wine and meat supplied to
    all.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Oku Akama postulant is marked with yellow dye on the abdomen and back
    of the shoulders.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: During an Eturi play in earlier times, all town fires had to be extinguished
    and no noise was permitted.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Nkanda is described as the highest and final grade and as more expensive than
    any other grade.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:13
  text: A man joining Nkanda is rubbed on head and chest with yellow powder, marked
    with rings on front and back, and given white and yellow arm stripes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Until the final rite is finished, the Nkanda initiate goes bare except for
    a long loin cloth from waist to feet.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:15
  text: The chief of Nkanda is described as president of the Egbo Lodge and the most
