candidate_motifs:
- id: motif:1
  label: graded initiation into a secret society
  taxonomy_refs:
  - initiation
  basis: The passage describes aspirants and postulants passing through grades, receiving
    bodily markings, making payments, hearing names, invoking names, dancing, and
    completing final-grade rites.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:6
  confidence: high
  cautions: The source is ethnographic description rather than a mythic narrative,
    so the motif is institutional and ritual rather than narrative.
- id: motif:2
  label: restricted secret knowledge guarded by death or concealment
  taxonomy_refs:
  - forbidden_knowledge
  basis: The text links higher-grade secrecy to death after expulsion and requires
    the Okum image to be kept from non-members, especially women, at prohibited times.
  evidence_refs:
  - ev:2
  - ev:8
  confidence: high
  cautions: The passage does not frame the secrecy as a mythic taboo; it describes
    social and ritual regulation.
- id: motif:3
  label: ritual offering and communal feast at initiation
  taxonomy_refs:
  - sacred_exchange
  basis: The aspirant's friend brings meat and palm wine, and the Ndibu play supplies
    palm wine and meat to all for several days.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage does not explicitly say the food and drink are offerings to
    a deity; they are part of social-ritual hospitality.
- id: motif:4
  label: sacrificial penalty after breached ritual concealment
  taxonomy_refs:
  - sacrifice
  basis: If the Okum image escapes the Ekabe bearer's control, a cow is killed and
    a feast is provided for members at the official's expense.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The text states that a cow is killed but does not specify sacrifice to
    a deity or spirit; the penalty may be chiefly social or ritual.
- id: motif:5
  label: ritual office as hereditary and restricted authority
  taxonomy_refs:
  - royal_legitimacy
  basis: The chief of Nkanda is described as president of the Egbo Lodge, the most
    powerful man of the town, sometimes hereditary, and restricted to free-born chiefs.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The office is not described as kingship; the taxonomy reference is approximate
    because the passage concerns ritual and civic authority.
