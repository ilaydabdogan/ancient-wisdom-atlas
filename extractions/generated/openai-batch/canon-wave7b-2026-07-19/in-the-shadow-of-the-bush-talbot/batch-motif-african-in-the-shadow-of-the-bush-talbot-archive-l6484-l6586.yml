canonical_text:
  quote: ''
  summary: The passage first gives a case in which Machott, after a quarrel with Awo
    Otu, offers her member Ndo Tammi to him in her stead. It then tells the story
    of Mbaw, who repeatedly withholds trapped meat from his wife Ma Ndikange by declaring
    it taboo for her. Ndikange makes medicine from magic leaves, dries a river, catches
    fish, eats some, and protects the remaining fish in a pot with Juju. Mbaw steals
    the fish, gets his head trapped in the pot, hides unsuccessfully, is exposed by
    Ndikange's son, and is accused by Ndikange of theft and of receiving Obassi's
    judgment. The excerpt ends as Mbaw calls his age class and begins confessing.
  language: English
  quote_policy: summarized
