canonical_text:
  quote: ''
  summary: 'The passage closes a Tortoise story in which Tortoise learns the names
    of eight men hidden in Obassi''s windowless room, answers Obassi''s test, and
    is punished by a decree that tortoises be impaled as offerings at Jujus or crossroads.
    A second tale begins: after Ejaw is shot for befouling cleared land, Nki repeatedly
    uses palm wine to make meat-guardians sleep, steals the smoked meat, and causes
    successive animals to be killed as replacement food, until Mbaw prepares a heated
    rubber trap as Nki appears again.'
  language: English
  quote_policy: summarized
