canonical_text:
  quote: Every event, either in the life of the family or that of the community, is
    celebrated in this way.
  summary: The passage describes Ekoi bodily appearance, the fatting-house, head-carrying
    and dancing as influences on physique, and the central place of dance in family,
    communal, and religious occasions. It says dances mark births, a girl's reappearance
    from the fatting-house, marriages, hunts, visitors, deaths, funeral rites, and
    religious observances. It also describes full-moon dance gatherings with chanting
    and drumming, includes a note on African and European dress, and ends by introducing
    another viewpoint.
  language: English
  quote_policy: quoted
