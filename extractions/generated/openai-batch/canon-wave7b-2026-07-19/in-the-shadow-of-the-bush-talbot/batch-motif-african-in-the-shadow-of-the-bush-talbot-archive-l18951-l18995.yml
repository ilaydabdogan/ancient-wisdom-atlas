canonical_text:
  quote: ''
  summary: Water spreads from every side and threatens to cover the earth. Etim 'Ne
    takes the magic calabash given by Obassi to a hill with tall palm trees, prays
    to Obassi, and the water recedes into river and stream beds, while a lake remains
    over the bad son's farm. Etim later names the rivers and streams, asks his children
    to remember him as the one who gave water to the earth, and dies; the passage
    adds that at the beginning there were no people or water, and that Etim 'Ne first
    came down with Ejaw and begged water from Obassi Osaw.
  language: English
  quote_policy: summarized
