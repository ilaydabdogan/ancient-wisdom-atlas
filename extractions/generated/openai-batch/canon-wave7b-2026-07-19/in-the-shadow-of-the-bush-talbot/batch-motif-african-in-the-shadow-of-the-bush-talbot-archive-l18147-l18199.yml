canonical_text:
  quote: '"That is why sometimes we have a small moon and plenty of stars"'
  summary: Ebopp exchanges a cap containing shining things with Effion, instructing
    him not to open it until Ebopp has returned home. After a messenger gives permission,
    Effion opens the cap before townspeople; shining things fall out and a breeze
    scatters them through the town. Children gather the lights at night into a box,
    but when the box is too full a breeze scatters them again. The passage explains
    this as the reason for changing appearances of the moon and stars over about a
    month.
  language: English
  quote_policy: quoted
