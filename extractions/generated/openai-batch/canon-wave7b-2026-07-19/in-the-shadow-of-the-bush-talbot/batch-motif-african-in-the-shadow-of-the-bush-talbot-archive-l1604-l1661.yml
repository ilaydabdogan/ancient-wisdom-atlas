  summary: The passage quotes A. B. Cook on the Cretan axe cult outside Crete. It
    describes an Assyrian cylinder with a priestly figure presenting a fish to a deity
    symbolized by an axe and knobbed sceptre, then a Cretan Hagia Triada sarcophagus
    with double-axes, leafy supports interpreted as cypress-tree substitutes, and
    birds perched on the axes. The quoted author summarizes these examples as part
    of a widespread ancient cult involving a sky-father and an earth-mother, with
    the sky-father descending in lightning and leaving his weapon as a token.
