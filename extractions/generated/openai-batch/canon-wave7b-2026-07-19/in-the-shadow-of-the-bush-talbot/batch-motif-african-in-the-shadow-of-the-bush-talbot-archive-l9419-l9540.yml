canonical_text:
  quote: ''
  summary: The passage describes objects used in Ekoi divination, their stated ritual
    associations, a sample vocabulary of shell combinations, and an observed consultation
    in which a sick woman is told that a maternal female ancestor ghost caused her
    illness and wanted libations and food sacrifices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several objects are spread before the magician, including a bush fowl egg,
    porcupine quill and tail, white chalk, a boar's tooth, shells, and small horns
    of Ise.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The Diviner holds a bush fowl egg toward the sun and prays that light be shed
    on the matter to be known.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A porcupine quill and tail are held up because Porcupine is described as the
    great diviner in legends.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: White chalk is laid out for good luck, and a boar's tooth is used to ward
    off evil influences from the questioner and to touch the shells.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The small horns are said to be those of Ise, the blue duikerbok, which is
    regarded as an ally of magicians and as able to see by night and day and recognize
    ghosts, witches, and uncanny beings.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The four strings of shells can fall in many combinations, and an expert Mboni
    uses an extensive interpretive system.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the sample vocabulary, one upward shell means a young man, two mean water,
    three mean food, and four mean sickness.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: In an observed consultation at Ndingane in 1907, a sick woman came to inquire
    into the cause of her illness, and the Mboni called to Ebu to wake up.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The initial answers say the woman is sick because something bad, described
    as a noise, has caught her.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: After the query is repeated, the answers reject witchcraft and Juju and identify
    ghosts as the cause, specifically from the mother's family and female.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The names of female ancestors on the mother's side are called until the charm
    signifies which ancestor caused the sickness.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The identified ghost is said to want libations and food sacrifices.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The inquirer makes a round basket of palm leaves and puts palm wine and a
    small quantity of rum into it; the passage ends as she goes before the town.
  category: action
  evidence_refs:
  - ev:7
