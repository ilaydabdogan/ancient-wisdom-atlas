canonical_text:
  quote: ''
  summary: The passage describes a pepper-in-the-eyes ordeal used to decide guilt
    or innocence; the abandonment of Abbiati after a salt-and-curse incident; and
    carved stones associated with Egbo houses, including the stone of Nimm and Leopard
    Stones, which are revered, attributed to Obassi, and in one case installed as
    a town guardian receiving sacrifices. The narrator also offers comparisons and
    speculation about the stones' construction and origin.
  language: English
