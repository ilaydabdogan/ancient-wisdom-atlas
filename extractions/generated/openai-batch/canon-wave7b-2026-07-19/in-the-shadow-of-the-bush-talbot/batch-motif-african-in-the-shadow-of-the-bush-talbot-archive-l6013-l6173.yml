canonical_text:
  quote: ''
  summary: 'The passage describes Ekoi marriage customs: bride-service by a prospective
    husband, gifts and dowry demands, legal marriage through acceptance of a wedding
    gift and public proclamation, the non-religious character of the ceremony, sanctions
    affecting fidelity, and pre-wedding fatting-house seclusion with wall circles
    tallying months spent there.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man wishing to marry an Ekoi maiden must serve her people for a considerable
    time, usually two to three years, often by helping clear bush for farms.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the service period, the prospective groom is expected to give presents
    to the future wife's relations, including listed food, oil, rum, and tobacco items.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that maidenhood is not considered of first importance,
    while marital fidelity is affected by fear of Jujus, damages, and divorce claims.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The wedding ceremony is described as having no religious character and no
    ritual symbolizing prior marriage to a deity.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Legal marriage consists in the bride accepting at least one wedding gift from
    the groom on the understanding that it is received as a wedding gift.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Acceptance of the wedding gift must be followed by public proclamation before
    chiefs and people after a bell has been rung around the town.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The public formula is given as variants meaning "Our own," usually followed
    by the names of the couple.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The proclamation is described as a precaution against later claims that gifts
    were only sweetheart presents and not marriage gifts.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: A named dowry demand by Aret Offiong of Oban lists cloth, ornaments, utensils,
    grooming tools, and a statement refusing marriage if the items are not given.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Before marriage, free-born Ekoi girls of well-to-do parents spend time in
    the fatting-house, where they may not wash their faces and are not supposed to
    go out or work.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: Poor provision of the fatting-house may cause a girl to be looked down upon
    before marriage and by her husband's family afterward.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: A mother may try to dissuade her daughter from a disapproved suitor by threatening
    not to provide a good fatting-house.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Girls confined in the fatting-house may paint circles on the room walls to
    represent the number of moons spent in seclusion; one copied wall drawing represented
    twenty months.
  category: object
  evidence_refs:
  - ev:10
