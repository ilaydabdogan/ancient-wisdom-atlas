canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a wife removes a magically held pot
    from her husband's head, leaves him, and is later courted by the same husband
    in disguise; the narrator presents this as an explanation for women's divorce
    and remarriage. It then records rules and court testimony about widow mourning
    and remarriage. The passage closes by introducing a taboo against Ekoi women wearing
    hats and begins a legend about Obassi Osaw, his favored wife Ekwaw, her maid,
    and seven young men secretly brought with palm wine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man says a Juju left in the house keeps his head in a pot, and his companions
    decide that the woman must remove the pot.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman says that if the pot is taken off the man's head she will no longer
    be his wife.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman throws medicine on the pot; the pot falls away, the man's neck and
    head swell, and the woman runs off saying she will marry another man.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The husband disguises himself and approaches the woman as a prospective husband;
    she rejects him once for resembling her former husband and later accepts a disguised
    suitor temporarily.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator states that this tale explains why women divorce themselves and
    marry other men, and says Ndikange stayed with the later husband, had six children,
    and became rich through his care.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Divorced wives may marry again, but a widow must not accept proposals until
    mourning for her late husband is over.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: A court case records Asot Ankpe confessing that during mourning for her husband
    she accepted a man as a friend; the stated custom involves handing such a woman
    over to her children and affects the children's property rights.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Court testimony says a man must not speak to a mourning widow about sweethearting;
    after mourning ends, he may bring one bottle of palm wine but still must not immediately
    begin sweethearting talk.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The text says Ekoi women regard wearing a hat as taboo and introduces a legend
    as the reason.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: Obassi Osaw has five wives and loves Ekwaw above the others; she does no work
    while the other wives wait upon her.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Obassi brings a little slave girl to attend on Ekwaw and do what she wishes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Ekwaw sends the maid to market, and the maid reports seeing seven unusually
    handsome young men and asks whether she should bring them to Ekwaw.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The maid's first attempt to summon the seven men fails because she does not
    identify her mistress; Ekwaw then tells her to take a great jar of palm wine and
    beg them to come.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:14
  text: The seven young men drink the palm wine, follow the maid secretly to the compound,
    are feasted by Ekwaw, and are kept in her room while she sends word that she has
    no time to cook for her husband.
  category: sequence
  evidence_refs:
  - ev:10
