canonical_text:
  quote: ''
  summary: Ghosts prepare to roast their visitor and leave fowls to guard the body.
    The Lame Boy distracts the fowls with corn, takes leftover Juju medicine from
    the Egbo house, applies it to the dead boy's eyes, and revives him. The revived
    boy escapes, receives instructions from Cotton Tree to make food offerings, and
    the pursuing ghosts eat the offerings and return home. The boy then sacrifices
    chicken and palm oil to Cotton Tree, which explains ghost sacrifices and promises
    future help in sickness, misfortune, or vengeance.
  language: English
  quote_policy: summarized
