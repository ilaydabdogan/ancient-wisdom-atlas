canonical_text:
  quote: ''
  summary: 'The passage describes Ekoi accounts of witchcraft: witches or wizards
    are said to attack sleeping victims, send the bat called Ekpangpang as a nocturnal
    death sign, and use familiars. Suspected wizards or corpses may be examined to
    find and kill a familiar. Corpse apertures are ritually blocked to keep the soul
    or familiar from leaving. A Native Court testimony recounts Antikka’s illness,
    her journey with her husband to the witch-doctor Aiyu, a medicinal preparation,
    and her confession before a hole.'
  language: English
  quote_policy: summarized
