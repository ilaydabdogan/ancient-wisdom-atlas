canonical_text:
  quote: ''
  summary: 'The passage explains several Eja/Juju practices: an obscure song is interpreted
    as requiring a full sibling as sacrifice when a poor man has no adequate offering;
    Obung people use roots and charcoal as protective medicine; the Eja festival includes
    first-fruits yam offerings, food restrictions, and invocations to Achibong and
    Lord Asu; former or substituted human sacrifice is described through a crouching
    old slave, dressed ant hills called “bush-men,” and Drill Apes; the passage then
    introduces the Ekoi belief that anthropoids are degenerate people and gives a
    tale in which Nshum, a Drill Ape person, refuses communal work and leaves the
    town for the bush.'
  language: English
  quote_policy: summarized
