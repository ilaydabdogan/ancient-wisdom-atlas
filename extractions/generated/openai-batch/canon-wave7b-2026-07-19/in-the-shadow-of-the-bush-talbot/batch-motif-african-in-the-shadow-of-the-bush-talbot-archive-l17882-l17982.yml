canonical_text:
  quote: "“That is the reason why the moon is sometimes dark”"
  summary: Effion returns to heaven with a shining stone, climbs there by a palm tree,
    and has the sky chiefs make a box so the light shines from one side. He claims
    the stone as his own and withholds its light when people stop bringing him food,
    which is given as the reason for the moon’s darkness at the end of the month.
    The passage then begins a separate story, “How All the Stars Came,” in which Ebopp
    and Mbaw clear bush for new farms, build huts and an Ekpa Ntan, return to their
    old town for food, and plant young plantains.
  language: English
  quote_policy: quoted
