canonical_text:
  quote: ''
  summary: 'The passage describes rules and examples for Juju sacrifice and health-recovery
    rites: petitions are carried by Eyo the sun to Obassi; Ogai Etab offers food,
    cloth, meat, palm wine, water, chalk, oil, and other items through a priest; dead
    cult members and the Founder’s ghost are invoked; paired Juju leaves indicate
    acceptance or refusal; participants share the offering. A second health Juju,
    Ntuanto, is introduced at Nsan with music, family assembly, and leaf-robed fetishes.
    The opening sentence also notes a crocodile-head feature linked to the nature
    goddess Nimm.'
  language: English
  quote_policy: summarized
