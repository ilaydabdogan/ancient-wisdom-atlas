    after Anon''s death; Eyo rises into the sky and lives in a house, explaining the
    sun''s daily appearance and evening disappearance. It then begins a tale of Obassi
    Nsi''s sons Eyo/Sun, Ejirum/Darkness, and ''Mi/Moon: ''Mi captures a leopard with
    Isse''s medicine, and at Nsi''s wedding an accident blinds a son of Obassi Osaw,
    leading Osaw to demand that Nsi be brought up to him.'
