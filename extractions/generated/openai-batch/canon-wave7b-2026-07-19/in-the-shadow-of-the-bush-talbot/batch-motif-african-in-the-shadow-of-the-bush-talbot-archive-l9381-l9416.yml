canonical_text:
  quote: ''
  summary: The passage describes Ekoi divination, its diviner, the paired Osing-shell
    charm used for answers, the gendered right-left arrangement of the shell strings,
    and the initiation of a new diviner by consecrating the shells with Juju-tree
    materials, placing them in the roof to communicate with Obassi Osaw, burying them
    at crossroads to communicate with ghosts and Obassi Nsi, and recovering them.
    It also states that Osing shells come from a sacred tree and require elephant
    handling before divinatory use.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The divination practice is called Ebu among the Ekoi, has the older title
    Efa, and is more generally known to Europeans by the Erik name Idiong.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Questions are referred to the Diviner, called Mboni, who answers after consulting
    a charm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The charm consists of two pairs of strings, each made of four Osing shells.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The strings on the right side of the Diviner are supposed to be male, and
    those on the left side female.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Each pair must confirm the other by falling in exactly the reverse manner;
    if the pairs do not agree, the process is begun again and may be repeated several
    times for important questions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A man seeking to become a Mboni first learns how the Ebu charm communicates
    and then asks an old Diviner to confirm the power.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The old Diviner gathers leaves and bark from various Juju trees, chews them,
    and spits small quantities into the shells.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The aspirant places the shells high in the roof-thatch so that they may listen
    to Obassi Osaw and talk with him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The shells are later taken outside the town to a crossroads, buried there
    to talk with ghosts and Obassi Nsi, and dug up after a few days.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the shells are dug up, the man begins practice as a full-fledged Mboni.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Osing shells are the dried coverings of seeds of the sacred Osing tree.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Osing shells cannot be used for divination until an elephant has taken the
    ripe fruit into its mouth and ejected the seeds.
  category: sequence
  evidence_refs:
  - ev:6
