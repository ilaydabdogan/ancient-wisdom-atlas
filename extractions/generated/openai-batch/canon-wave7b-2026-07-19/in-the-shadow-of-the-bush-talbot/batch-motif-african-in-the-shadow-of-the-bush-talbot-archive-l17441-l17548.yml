canonical_text:
  quote: ''
  summary: A girl under Nsi's authority is forced to work, fetch water, cook, make
    fire, gather firewood, and seek fish poison. She is denied adequate food, injured
    by a thorn, confined with goats, and later sent to fetch water again. At the river,
    a broken pot cuts off one of her ears. She decides to return to her father, Obassi
    Osaw, finds the road by which he sent her to earth, and climbs a rope hanging
    from a high tree toward her father's land.
  language: English
  quote_policy: summarized
