canonical_text:
  quote: ''
  summary: The passage concludes a tale in which Tortoise/Nkui lures Elephant with
    promised funeral dancing, binds him at Obassi's town, and is later discovered
    while hiding beneath a grinding stone; Elephant crushes him, explaining the broken,
    humpy tortoise shell. The passage then begins a tale titled 'Why there are no
    more Lions in the Bush,' in which Etim is killed by a lion, his son grows up aware
    of the killing, obtains guns by trade, and prepares a tree platform with his sister.
  language: English
  quote_policy: summarized
