- id: motif:1
  label: Deceptive capture of a stronger animal followed by retaliatory punishment
  taxonomy_refs:
  - trickster_boundary
  basis: Tortoise/Nkui uses a promised dance and a rope to bind Elephant; Elephant
    later recognizes the deceit, tracks Nkui, and crushes him.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:8
  confidence: high
  cautions: The taxonomy label is applied because the passage explicitly describes
    deceit and animal boundary-crossing behavior; the passage itself does not use
    the word 'trickster.'
- id: motif:2
  label: Etiology of the tortoise's broken, humpy shell
  taxonomy_refs: []
  basis: The narrator explains that Tortoise once had a smooth skin and that his broken,
    humpy shell results from Elephant smashing it as punishment.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No supplied taxonomy family directly names animal-body etiology.
- id: motif:3
  label: Intended funerary killing of an animal victim
  taxonomy_refs:
  - sacrifice
  basis: Children say Elephant is the one Nkui said he would kill for the burial of
    his friend, and that Elephant will be killed very soon.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage states intended killing for a burial but does not describe
    a completed sacrifice or ritual procedure.
