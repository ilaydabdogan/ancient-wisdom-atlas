canonical_text:
  quote: They promised to live with her so long as the herbs from which they had sprung
    were never given them to eat
  summary: An old woman discovers four beautiful girls who have sprung from named
    herbs and adopts them under a food taboo. The loveliest, Etinyung, marries Prince
    Ekpenyong Obassi under conditions that include never feeding her the herb bearing
    her name. A jealous co-wife secretly mixes the forbidden herb into Etinyung's
    food, causing Etinyung to return to her foster-mother, summon her sisters, and
    all four to become herbs again. The narrator gives an etiological explanation
    for why old women can no longer obtain such children. The passage then shifts
    to Ikpai, describing the sacred Mfam tree and a healing practice involving its
    leaves.
  language: English with brief Ekoi song lines and English glosses
  quote_policy: quoted
