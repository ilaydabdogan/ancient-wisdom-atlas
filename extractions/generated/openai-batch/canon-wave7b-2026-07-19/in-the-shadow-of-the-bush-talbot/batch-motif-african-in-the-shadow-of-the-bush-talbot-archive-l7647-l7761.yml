candidate_motifs:
- id: motif:1
  label: plant-born children obtained by an old woman
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: The girls have sprung from named herbs, become the old woman’s children,
    and the narrator says old women could once have obtained children in this way.
  evidence_refs:
  - ev:2
  - ev:9
  confidence: high
  cautions: The figures appear as beautiful girls rather than infants; the passage
    presents an extraordinary birth or origin but does not use the word sacred for
    their birth.
- id: motif:2
  label: food taboo governing continued human life with a supernatural family member
    or spouse
  taxonomy_refs:
  - departure
  - return
  basis: The daughters agree to live with the old woman only if they are not fed their
    source-herbs, and Etinyung’s marriage repeats the prohibition; when the taboo
    is broken, Etinyung must leave and returns to her foster-mother.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage concerns a forbidden food or plant, not forbidden knowledge;
    broader taxonomy links to departure and return are literal but general.
- id: motif:3
  label: jealous co-wife causes the loss of the favored bride
  taxonomy_refs: []
  basis: Ekpenyong favors Etinyung, another wife becomes vexed, and that wife deliberately
    feeds Etinyung the forbidden herb, leading to Etinyung’s departure and Ekpenyong’s
    grief.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:9
  confidence: high
  cautions: The passage does not compare this pattern with other co-wife or rival-wife
    narratives.
- id: motif:4
  label: human-to-plant reversion
  taxonomy_refs:
  - shapeshifter
  basis: The girls are said to have sprung from herbs and, after the taboo breach,
    once more become the herbs they had been before.
  evidence_refs:
  - ev:2
  - ev:8
  confidence: medium
  cautions: The transformation is a reversion to plant form, not explicitly voluntary
    shape-shifting.
- id: motif:5
  label: etiological loss of access to miraculous children
  taxonomy_refs: []
  basis: The narrator states that if Etinyung had not been fed the forbidden herb,
    old women too old to have children could have obtained children in the same way
    as the old woman.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is an etiological explanation within the passage, not a cross-text
    comparison.
- id: motif:6
  label: liminal bridal procession without touching the ground
  taxonomy_refs: []
  basis: Skins and rich cloths are spread from the old woman’s hut to the bridal house,
    and the couple’s feet never touch the ground during the procession.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage does not explicitly explain the ritual meaning of the elevated
    or covered bridal path.
- id: motif:7
  label: sacred tree leaves restore health by touch
  taxonomy_refs: []
  basis: The Mfam tree is described as sacred, and its leaves are said to restore
    health merely by touch when brought by the priest of Mfam.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: Although the symbol is a sacred tree, the passage does not present it
    as a cosmic axis or world tree.
