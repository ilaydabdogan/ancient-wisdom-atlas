canonical_text:
  quote: ''
  summary: The passage describes the expedition's observations of compounds, stones,
    a ruined town, a clay-decorated treasure chamber, and ritual objects. At Ewaw-Offong
    it records a Juju tree set among offering stones before the Egbo house, a night
    flame caused by cactus resin, and an explanation that towns possessing Juju Ngbe
    Abum Obbaw forbid outdoor fires beyond compound walls because such fires endanger
    the Juju's protection against leopards unless a rite restores it.
  language: English
