canonical_text:
  quote: ''
  summary: The passage describes ordeals in Mfamosing under Chief Nenkui, especially
    the Esere bean ordeal and boiling palm-oil tests. It explains beliefs about guilt
    and innocence, guarded knowledge about preparing or dosing Esere, and sworn testimony
    about Ada being subjected to palm-oil divination and burning. It ends with the
    start of another case involving Baii Barine, his ill daughter, a charge of bewitching,
    and a diviner/Juju.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chief Nenkui of Mfamosing is described as forcing every person in the town
    at some time to undergo ordeal to clear suspicion of black magic.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many people died or suffered from the tests; Nenkui is said to have killed
    two of his wives this way and forced his own children to take Esere.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Esere is described as a common Ekoi ordeal using a wild bean ground up, mixed
    with water, and drunk by the accused person.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The stated belief is that a wizard or witch dies after drinking Esere, while
    an innocent person suffers no ill effect.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says boiling the bean before the ordeal can cause intense pain
    followed by vomiting, and that this information is guarded as a secret.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some informants say the danger of Esere varies with quantity, and that the
    exact amount is known only to initiates.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Boiling palm-oil ordeal is described as less dreaded than Esere because it
    was practically never fatal and was considered less intensely painful.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Itagbo Arap believed his wife Ada had been unfaithful and, after Nenkui advised
    consulting the charm, told her to practise with palm oil.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the first palm-oil test, boiled oil was dipped with a great snail shell
    and poured on coco-yam leaves; shriveling was taken as proof that the woman had
    lied, and the leaves perished.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In a second test, a new pot of palm oil was boiled, the affair was spoken
    to the oil while pointing at Ada, medicine was put in the pot, and flames rose.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The rising flames were interpreted as the palm oil pronouncing Ada guilty
    a second time.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Nenkui shouted that the oil should be poured on Ada's hands.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Ada stated that she was afraid, held out her hands because of terror of Nenkui,
    had both palms fiercely burned, and finally confessed.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Baii Barine stated that his daughter Enok Eijuni was ill, that Nenkui accused
    him of bewitching her, and that he went to a diviner to practise the charm before
    the Juju.
  category: sequence
  evidence_refs:
  - ev:9
