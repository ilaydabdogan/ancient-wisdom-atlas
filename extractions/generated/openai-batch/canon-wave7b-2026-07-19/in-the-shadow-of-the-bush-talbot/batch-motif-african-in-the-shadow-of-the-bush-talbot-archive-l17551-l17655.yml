canonical_text:
  quote: Up till that time there had been no rain on the earth.
  summary: A person collecting firewood hears Ara weeping and reports her location.
    Obassi Osaw sends slaves to bring her home, orders her bathed and fed, and gives
    her possessions and a house. He then orders the Angbu club to mutilate and expel
    the son of Obassi Nsi in retaliation for Ara's suffering. Osaw uses the severed
    ears to make a great Juju; a strong wind drives the boy earthward, and the tears
    of the boy and Ara fall as the first rain. The passage then begins another tale,
    in which Njomm Mbui, a Juju sheep, befriends Etuk, an antelope, and both plant
    farms.
  language: English
  quote_policy: quoted
