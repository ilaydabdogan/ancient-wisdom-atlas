canonical_text:
  quote: ''
  summary: 'The passage describes Ekoi beliefs surrounding Ojje or witchcraft: the
    bush as a feared supernatural setting; witches, familiars, and shape-shifting;
    origins of bad and good Jujus in Obassi Osaw and Obassi Nsi; a court case involving
    a white bird, divination, and Awaka’s Esere bean ordeal; powers of mutual recognition
    among those possessed by Ojje; nocturnal aerial witch dances visible only to persons
    with special sight; and a claimed witness of such revels.'
  language: English
  quote_policy: summarized
