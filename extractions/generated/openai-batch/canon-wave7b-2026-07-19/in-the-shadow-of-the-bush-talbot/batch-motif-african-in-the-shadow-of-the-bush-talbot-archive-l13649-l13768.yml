canonical_text:
  quote: ''
  summary: 'The passage describes rites and arrangements connected with founding a
    settlement and building homesteads: stones and sacrifices precede the raising
    of Etai Ngbe; young men clear bush, build shelters, and plant; homestead rites
    include leaves, saplings, invocation, libation, and sacrifices; completed houses
    may be encircled with a liane against evil spirits, followed by offerings to chief
    women and lighting of a new hearth fire. It also describes compound layout, household
    organization, domestic priesthood, and comparisons to Roman houses and household
    cults.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nimm stones are laid where Etai Ngbe will later be raised, and sacrifices
    are made to Obassi Osaw, Obassi Nsi, and the ancestors.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Young men clear bush, erect temporary shelters, begin planting, and dwellings
    are gradually built, beginning with the head chief's compound.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before each homestead is built, the head chief and principal men hang Antann
    leaves and plant Ibonn and Irun saplings where a small shrine will later be set.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the homestead ceremony, Obassi and the chief ancestors are invoked, palm
    wine is poured as a libation, and other sacrifices are offered.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After a house is finished, the liane Mfinn may be laid unbroken around it
    so that no evil spirit can enter.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Chief women are summoned after the house is finished; palm oil and dried Nsun
    flesh are offered to them, and the oldest woman lights the new fire on the hearth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Each compound is described as having a central atrium with living and sleeping
    rooms branching from it, and its four sides form four self-contained houses.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:8
- id: obs:8
  text: The head of each house is described as priest of its particular domestic powers,
    and each Juju also has a head priest for the whole town.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Each compound is described as a small fortress with a narrow back door that
    can be barricaded.
  category: attribute
  evidence_refs:
  - ev:9
