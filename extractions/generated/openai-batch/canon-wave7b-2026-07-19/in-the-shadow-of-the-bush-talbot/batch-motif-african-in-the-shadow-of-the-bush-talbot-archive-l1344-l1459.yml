  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage explains that sacrifices are set out near towns or at the beginning
    of roads for ghosts so that the ghosts do not enter within.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Oban there are two circles of unhewn stones, each arranged around a Juju
