canonical_text:
  quote: ''
  summary: The passage first explains how Obassi Osaw instructs tortoises to stop
    pursuing ghosts by laying food and drink sacrifices at a town entrance, giving
    an origin for offerings placed at roads near towns. It then describes Oban ritual
    stone circles around Juju trees, lunar rites for women and girls to secure fertility,
    goat sacrifice and blood-smearing for a woman seeking a child, restricted male
    access, men's rites before another Juju, and epidemic-prevention medicine kept
    in a small Juju house. The passage ends with geographic description of Oban, nearby
    hills, rivers, forest, and Cameroon peaks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Obassi Osaw sees danger to the tortoises and advises them to reach their town
    and prepare for the pursuing ghosts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Obassi Osaw tells the tortoises to kill goats and cows and place palm oil
    and palm wine before the entrance so the ghosts will eat and return satisfied.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The tortoises place the offering, and the ghosts eat it and are content, except
