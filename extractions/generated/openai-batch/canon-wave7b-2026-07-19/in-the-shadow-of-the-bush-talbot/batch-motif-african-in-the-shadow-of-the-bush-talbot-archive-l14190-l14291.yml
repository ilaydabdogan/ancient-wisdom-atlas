canonical_text:
  quote: ''
  summary: An etiological tale heading says it explains why Nkundaks feathers may
    be worn only by a warrior who has slain a foe. In the story segment, Princess
    Ekandem Obassi rejects ordinary suitors, sends her maid to find a beautiful husband,
    welcomes Ita 'Ne Echi, and chooses to follow him despite his warning that he is
    a bad man from a fearful land of heads only. On the journey his borrowed body
    parts return to their owners until only a skull remains; he refuses to let Ekandem
    go back and says she must go to the country of skulls.
  language: English
  quote_policy: summarized
