canonical_text:
  quote: ''
  summary: 'The passage describes Ekoi beliefs about metamorphosis: animal-representing
    club head-dresses are linked to beliefs that some people can possess and assume
    animal forms. A person is said to have two souls, including a bush soul that can
    be sent out by drinking a hereditary magic potion kept in an ancient earthen pot.
    The bush soul leaves the human form, travels invisibly to the forest, swells,
    and takes on an animal or were-body. Common forms include elephant, leopard, buffalo,
    wild boar, and crocodile, with different potions needed for different shapes.'
  language: English
  quote_policy: summarized
