canonical_text:
  quote: '"I took my company ... and crossed two sticks before her door"; "defendant
    tying up her food with a piece of native rope."'
  summary: A first-person speaker says his sister gave Usin to him as a 'friend.'
    He says Obassi Ndo tried to take her away, so the speaker brought his age-class
    company and crossed sticks before her door to bar Obassi's visits. Later, after
    finding Usin with Obassi, the speaker was accused of wanting to kill him and denied
    any knowledge of poison while invoking God. The speaker then reports seeing Obassi
    tie up the girl's food with native rope, described as a Juju intended to stop
    the food nourishing her if she maintained friendship with anyone but Obassi.
