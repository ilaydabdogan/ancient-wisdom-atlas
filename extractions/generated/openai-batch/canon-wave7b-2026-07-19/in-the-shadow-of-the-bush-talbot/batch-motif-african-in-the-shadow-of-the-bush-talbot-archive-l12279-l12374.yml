    go downstream to fetch a large flat stone on which the child can be killed.
  source_text_path: texts/public-domain/ekoi/project-gutenberg/in-the-shadow-of-the-bush-talbot.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 12322-12331
  quote_or_summary: Ngbe Eing believes Ise's statement and goes downstream; once she
    is out of sight, Ise tells the mother to hurry home.
  source_text_path: texts/public-domain/ekoi/project-gutenberg/in-the-shadow-of-the-bush-talbot.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 12332-12337
  quote_or_summary: Ngbe Eing returns with the stone, discovers that the mother and
    Ise have escaped, becomes angry, and pursues.
  source_text_path: texts/public-domain/ekoi/project-gutenberg/in-the-shadow-of-the-bush-talbot.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 12338-12343
  quote_or_summary: Ngbe Eing reaches a nearly empty town because the men are away
    hunting, and forces her way into the compound where the woman has taken refuge.
  source_text_path: texts/public-domain/ekoi/project-gutenberg/in-the-shadow-of-the-bush-talbot.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 12344-12349
  quote_or_summary: Ngbe Eing is described as very rapacious and watches the mother
    for days, while the mother guards her baby night and day.
  source_text_path: texts/public-domain/ekoi/project-gutenberg/in-the-shadow-of-the-bush-talbot.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: 12350-12356
  quote_or_summary: When Ngbe Eing goes to the spring, the husband returns; after
    hearing the story, he hides with an Ejimm belonging to his other wife.
  source_text_path: texts/public-domain/ekoi/project-gutenberg/in-the-shadow-of-the-bush-talbot.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: 12356-12363
  quote_or_summary: The Ejimm is a sharp-pointed iron for spearing meat from a boiling
    pot; the husband drives it into Ngbe Eing's eye so that it passes through her
    head.
  source_text_path: texts/public-domain/ekoi/project-gutenberg/in-the-shadow-of-the-bush-talbot.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: 12363-12370
  quote_or_summary: Ngbe Eing's magic prevents immediate death; she runs home and
    dies there. Witches like her remove the Ejimm, bury her, and mourn.
  source_text_path: texts/public-domain/ekoi/project-gutenberg/in-the-shadow-of-the-bush-talbot.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: 12371-12380
  quote_or_summary: The Ejimm belongs to the other wife, who is barren and hostile
    to the fruitful mother; she refuses compensation and demands that the mother recover
    the property.
  source_text_path: texts/public-domain/ekoi/project-gutenberg/in-the-shadow-of-the-bush-talbot.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: 12381-12386
  quote_or_summary: The mother gives her baby to a friend and goes to consult Porcupine
    about what she must do.
  source_text_path: texts/public-domain/ekoi/project-gutenberg/in-the-shadow-of-the-bush-talbot.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: 12387-12391
  quote_or_summary: Porcupine consults the charm and says she will succeed unless
    she offends someone she meets on the road.
  source_text_path: texts/public-domain/ekoi/project-gutenberg/in-the-shadow-of-the-bush-talbot.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: 12392-12396
  quote_or_summary: The woman sets out while the townspeople weep because they fear
    she may never return.
  source_text_path: texts/public-domain/ekoi/project-gutenberg/in-the-shadow-of-the-bush-talbot.md
  rights_note: Public domain source; summarized.
