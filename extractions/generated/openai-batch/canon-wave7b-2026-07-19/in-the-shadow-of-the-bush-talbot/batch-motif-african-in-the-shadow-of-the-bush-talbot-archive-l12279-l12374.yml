canonical_text:
  quote: ''
  summary: The passage first reports an annual sacrifice to a dead mother because
    ghosts are said to be hungry. It then begins a tale explaining why living people
    can no longer see the road to the ghost town. A young wife gives birth at a stream
    after her co-wife abandons her. A witch-monster named Ngbe Eing demands to divide
    and eat the newborn, but Ise the grey duiker tricks the monster into fetching
    a flat stone, allowing the mother to escape. Ngbe Eing pursues, watches the mother
    and child, and is later stabbed through the eye with an iron implement by the
    husband. The implement belongs to the hostile co-wife, who demands that the mother
    recover it. The mother consults Porcupine, receives a warning about not offending
    someone on the road, sets out toward the ghost town, and sees a terrible woman
    bathing near a stream before the provided passage breaks off.
  language: English
  quote_policy: summarized
