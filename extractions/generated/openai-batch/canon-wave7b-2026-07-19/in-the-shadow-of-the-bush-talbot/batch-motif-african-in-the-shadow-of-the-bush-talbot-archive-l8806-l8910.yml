canonical_text:
  quote: ''
  summary: 'The passage describes a practice in which a visitor places a stone in
    a tree fork and speaks a formula so that the stone''s spirit goes ahead and prevents
    the intended host from leaving. It then explains why bare corn cobs are also placed
    in tree forks: the corn spirit is said to punish neglect by causing the discarder’s
    body to waste as the cob decays. The passage continues with observations of elephants
    near Okarara, including a herd gathering around a killed elephant, and then describes
    caves near the Akwa Yafe River, their bats, underground waters, and methods of
    bat capture.'
  language: English
  quote_policy: summarized
