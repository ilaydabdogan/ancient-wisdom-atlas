canonical_text:
  quote: ''
  summary: Appendix passage listing Ekoi tabus regulating the distribution and consumption
    of hunted animals, consequences for violating the rules, special treatment of
    certain animals and animal parts, ritual and medicinal uses, and gender-specific
    food prohibitions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that strict laws and tabus regulate how animals killed
    in the chase are distributed.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a town hunt, parts of each killed beast are assigned to the townsfolk,
    the nearest man, the hunter's mother, the hunter's father or house head, and the
    actual slayer.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a man hunts alone or with one companion, the rules vary by animal; for
    boar, parts are assigned to the mother, father or house head, age class, wife,
    companion, and hunter.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Several animals, including water chevrotain, bay duiker, Ogilby's duiker,
    elephant, buffalo, pangolin, civet cat, and genet, must be brought before the
    head of the house or the hunter's father under specified rules.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the distribution rules are infringed, a Juju is said to catch the hunter
    and give him a sickness recoverable only by confession and sacrifice; for genet,
    the illness is said to be elephantiasis.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Keeping a male drill ape or chimpanzee to oneself is said to bring certain
    death, while doing so with a female kill is said to bring an illness from which
    recovery is unlikely.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: When a leopard or python is killed, the heart and gall are cut out, buried
    in a deep hole, and covered; eating those parts is said to cause death, and leopards
    are taboo for free men.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Certain birds and fish are forbidden, offered ritually, or used as medicine;
    the owl is described as a witch's familiar, and kingfisher skull is used in cough
    medicine.
  category: other
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: Men's specific tabus include the fish Eddokk, whose eating is said to cause
    a hunter to be killed in the bush, and crab, called the Father of all Jujus, whose
    eating would exclude a man from ceremonies.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Women's food tabus include nandinia binotata, wild cat, animals killed by
    leopard or wild cat, crocodile, the Greater Plantain-eater, and the first thing
    caught in a husband's new trap, with consequences tied to child death, barrenness,
    stillbirth, or abnormal birth.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The author states that many of the tabus probably arose from totemic causes,
    sanitary reasons, or the desire of old men to obtain a full share of juniors'
    kills.
  category: speech
  evidence_refs:
  - ev:10
