canonical_text:
  quote: ''
  summary: The passage frames an Ekoi hunting custom requiring an offering to a Juju
    and its priest after a kill, then gives an etiological tale explaining the right
    to kill animals. Obassi Osaw of the sky invites Obassi Nsi of earth to a feast;
    Nsi later invites Osaw and all his sky animals to an earth feast. Nsi prepares
    abundant fruit, food, and drink. The animals descend, scatter to feed, and do
    not return to Osaw. Osaw returns alone to the sky and decrees that the animals
    are no longer sky people but food for earth people, who may hunt and eat them.
    The tale closes by saying this is how animals came to this world and forgot the
    way back to the sky.
  language: English
  quote_policy: summarized
