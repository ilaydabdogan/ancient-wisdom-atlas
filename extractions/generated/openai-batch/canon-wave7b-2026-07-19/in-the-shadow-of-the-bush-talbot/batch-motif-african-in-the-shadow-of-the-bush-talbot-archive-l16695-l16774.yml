canonical_text:
  quote: ''
  summary: The passage describes colonial suppression of slave trading, the Southern
    Nigerian administration of Ekoi society through Heads of Houses, reciprocal obligations
    between household heads and members, debt pledging, differential burial of enslaved
    persons, service and punishment practices, and a Juju rite using a slave's hair,
    nail parings, and worn cloth to prevent escape.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that British abolition ended export slave trade, but slavery
    persisted among natives in out-of-the-way Ekoi areas and one of his duties after
    arriving in 1907 was to suppress it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Southern Nigerian administration is described as operating largely through
    Heads of Houses; a House includes family, retainers, freed slaves and their descendants,
    and others recognizing the chief's authority.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Head of a House supports members in infancy, sickness, and general welfare,
    and receives their services and lawful submission in return.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Government recognizes the House compact and provides a legal remedy if
    either party fails in his part; the text says the people still distinguish free-born
    and non-free members, though not before the law.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author argues that sudden removal of hereditary authority from chiefs
    and family heads would cause disorder and that gradual change is necessary.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Free-born persons could be pledged for debt; such pledged members were said
    to be well treated and restored to freedom when the debt was paid.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: At death, pledged free-born persons were buried like free-born men, while
    slaves were tied to bamboo poles, carried to a distant bush, and left unburied.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A good member gives one-third to one-half of his time to the Head of his House,
    mainly in farm work or hunting, and may trade with capital supplied by the Head.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the old days, an idle slave could be flogged; if complaints were unheeded
    the slave often ran away, and if caught could be punished or sold at Calabar.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: To guard against escape, a new master cut off a lock of hair and nail parings,
    took old cloth worn by the slave, carried them before the Juju, prayed for death
    or recapture if the slave escaped, kept the pieces secretly, and the slave believed
    the Juju would catch him.
  category: sequence
  evidence_refs:
  - ev:10
