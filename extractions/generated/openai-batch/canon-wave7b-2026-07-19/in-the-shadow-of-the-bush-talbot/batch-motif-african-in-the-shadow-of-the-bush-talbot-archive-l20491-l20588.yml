canonical_text:
  quote: That is why Nki always stays in the tops of palm trees.
  summary: The passage concludes a tale in which Nki is trapped by rubber while trying
    to take meat, is condemned by an assembly, manipulates the choice of execution,
    escapes into palm trees, and is thereafter excluded from ground-dwelling animals.
    It then begins a tale in which Python and Elephant dispute lordship of the bush,
    black ants propose a combat after seven days, attack several animals, and eventually
    drive Elephant to water, after which the bush creatures recognize the ants as
    lords.
