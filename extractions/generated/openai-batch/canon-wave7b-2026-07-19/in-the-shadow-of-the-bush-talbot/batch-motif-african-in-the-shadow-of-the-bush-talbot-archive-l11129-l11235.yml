canonical_text:
  quote: ''
  summary: Agbo helps an afflicted woman wash and shares plantains with her. The woman
    later reveals that his father has sent him on a journey intended to kill him,
    transforms herself and the bush, gives him chalk and instructions for surviving
    a ghost town, and appoints Mfut the Red Fly as his guide. Agbo avoids dangerous
    food, escapes a night attack by thunderbolt, and selects the correct tusk when
    the fly settles on it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman with sores is unable to wash herself well and asks Agbo to help her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Agbo helps the woman, supports her as she comes from the spring, gives her
    a place to sit, and shares his plantains with her; when he looks away at a bird,
    she is gone.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At a river, Agbo sees the same woman again; she again asks him to help wash
    her body, and he again gives her plantains.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman tells Agbo that he is not in the bush and says his father dislikes
    him and has sent him on the journey so that he may die.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The woman knocks upon her belly, after which the bush becomes a town, her
    sores disappear, and she becomes very beautiful.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman washes Agbo in the river, gives him a piece of chalk, and points
    out the road to the ghost town where the tusks are.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The woman instructs Agbo not to eat food cooked for him in the ghost town,
    but to throw it on the ground and eat only his plantains and the chalk.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The woman instructs Agbo to say he will sleep among the goats, but later leave
    quietly and choose a manger.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The woman asks Mfut, the Red Fly, to go with Agbo as a guide and tells Agbo
    to follow him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The woman says that when Mfut enters the Egbo shed and settles on a very small
    old chief, Agbo should kneel and beg the chief's protection.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The woman tells Agbo that the wanted tusk is a very long one pointing toward
    the town, or, if the tusks are moved, the one on which Mfut settles.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the town, food is brought to Agbo; he has it placed on a plate, throws
    it on the ground in the back yard, and sees the grass wither where it falls.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: At night Agbo says he will sleep among the goats, but secretly sleeps in the
