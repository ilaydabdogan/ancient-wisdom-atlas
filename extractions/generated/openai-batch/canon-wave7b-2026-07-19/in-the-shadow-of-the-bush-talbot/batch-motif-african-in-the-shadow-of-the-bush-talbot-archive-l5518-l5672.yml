canonical_text:
  quote: ''
  summary: 'The passage describes Nimm devotion among Ekoi women: a portrait grave
    statue of Maia, priestess of Nimm; Nimm’s women’s day, initiation, shrine objects,
    divination, offerings, sacred fertility stones called Eggs of Nimm, exclusion
    of men from Nimm rites, a comparison to the Mboandem Frauen, and the Enyere household
    Juju raised for families consisting solely of women.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mud-and-stick portrait statue representing Maia, priestess of Nimm, stands
    above Maia’s grave under a small hut, with broken objects formerly used by her
    hung around it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nimm is described as an object of devotion for Ekoi women, with a cult traditionally
    founded by a Divine woman who came down to earth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Every eighth day is sacred to Nimm and called the women’s day; no work is
    to be done on it.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: If someone works on a farm on Nimm’s day, Nimm is said to become angry and
    send her servants, the beasts, to destroy the farm.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: New initiates into Nimm’s mysteries are rubbed with red cam-wood dye and thereafter
    may wear special ornaments, carry Nimm feathers, and bear a Juju knife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Each Nimm woman keeps a corner shrine with a pot of cult medicine and objects
    including carved wood, corn cobs, a Juju knife, and white Ebekk feathers.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Some Nimm shrines include pieces of Ngaw creeper, said to be used by were-crocodiles
    to draw men down to death.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: A split palm leaf with downward-pointing spikes, often tied with corn cobs
    and Juju leaves, hangs across the door of a Nimm woman’s room.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: For divination, Nimm women strew white chalk before the shrine, place white
    feathers there, burn them to ashes, and gaze into the ashes until an answer can
    be given.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: When a Nimm priestess gives a dance, townspeople are expected to bring offerings
    of roasted corn cobs, palm oil, and dried duiker flesh.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A Nimm woman formerly appeared outside her compound carrying a Juju knife
    in the left hand and a symbolic white Ebekk feather in the right; by the passage’s
    time this was obligatory only ceremonially.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: Oval stones rounded by water are sacred to Nimm; large ones remain in place
    as rustic altars, and smaller egg-sized ones are collected for compounds and farms.
  category: object
  evidence_refs:
  - ev:11
- id: obs:13
  text: The sacred oval stones are used to promote fertility and are called the Eggs
    of Nimm, whether in crocodile or serpent shape.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:14
  text: Men are not permitted to share in Nimm’s mysteries, and male Ekoi are said
    not to intrude at her rites even under fear of death.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:15
  text: The passage states that Nimm’s cult resembles the Mboandem Frauen described
    by Dr. Mansfeld, while noting that the designation was not found on the British
    side of the frontier.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:16
  text: At Niaji, the Juju Enyere consists of a growing Egakk tree with an earthen
    pot attached by bronze wire, closed with an earthenware lid, and decorated with
    split palm leaves and two Nimm feathers.
  category: object
  evidence_refs:
  - ev:15
- id: obs:17
  text: When a family’s male priest of its Lares dies without a male relative to replace
    him, other Jujus are banished and Enyere is raised; this is the only Juju permitted
    to a family consisting solely of women.
  category: sequence
  evidence_refs:
  - ev:16
