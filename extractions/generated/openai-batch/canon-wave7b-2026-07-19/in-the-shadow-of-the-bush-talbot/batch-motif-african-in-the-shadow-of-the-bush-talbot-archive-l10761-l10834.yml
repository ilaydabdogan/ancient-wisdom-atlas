canonical_text:
  quote: ''
  summary: The passage describes a communal Blood Juju rite in which participants
    contribute blood to corn and eat it so that witchcraft or harm against one another
    will rebound on the offender. A similar blood-bond rite between friends uses blood
    mixed with Juju medicine and carries a death sanction for betrayal. The passage
    then recounts how fear of witchcraft in Oberekkai, attributed to enslaved newcomers
    from the Cameroons and their alleged secret rites, contributed to flight, violence,
    and decline; the narrator later presents insanitary conditions as a real cause
    of deaths and notes subsequent cleaning efforts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed male ordered an assembled group to practice the Juju called Njomm
    Aiyung, identified in the passage as the Blood Juju.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each person received a cut, and drops of blood were allowed to flow into a
    calabash half full of dry corn; even babies born that day contributed blood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the blood had been collected, each man, woman, and child was made to
    partake of the corn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The stated purpose of the rite was to prevent witchcraft against townsfolk;
    if a participant later tried to harm another, Njomm Aiyung would catch the offender
    and the intended evil would fall back on that offender.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'A rarer, similar ceremony binds friends: mutual cuts are made, blood flows
    into a small clay basin containing strong Juju medicine, and the celebrants drink
    it.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the friend blood-bond rite, a celebrant who later acts unfriendly toward
    the other is said to be caught by the Juju and to die.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Oberekkai is described as standing on a tributary of the Kwa River and as
    formerly large and prosperous, with Chief Nataba as the wealthiest man in the
    district.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nataba sent to buy workpeople from the German Cameroons for his plantations,
    and emissaries returned with about thirty captives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The newcomers kept apart from Oberekkai social life, watched plays from the
    edge of the crowd, and more often gathered secretly at night at a farm hut.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Stories spread that the newcomers practiced midnight rites before unknown
    Jujus brought from their own land.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Townsfolk sickened and died, and survivors whispered that the captives were
    wizards from the Cameroons who were eating out the hearts of those who had enslaved
    them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Terror led many inhabitants to flee; later, one after another, the slaves
