canonical_text:
  quote: ''
  summary: 'The passage closes a tale in which a hunter who alone understands animal
    speech reveals the forbidden secret to his wife and dies as warned. It then begins
    a tale explaining why children belong to the mother: the beast Ejimm sends her
    two sons to lure children, seizes two children with her long mouth, the father
    fails to defend them, and the mother arms herself to confront the beast.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hunter returns home, tells his townsmen where he had been and how he returned,
    but keeps secret his knowledge of the language of beasts.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A hen calls her chickens to eat fallen corn grains and tells them to avoid
    the visitor's right hand but approach her left eye because she is blind on that
    side.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The hunter laughs because he understands the hen and because his mother-in-law
    has lost her left eye.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The wife becomes angry, asks for the reason for the laughter, and persists
    until the hunter tells her what the hen said and how he came to understand animal
    speech.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After revealing the secret, the hunter dies immediately, as ghosts had warned
    would happen if he told it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator states that the hunter was the only living being who ever understood
    animal talk and that he told his wife to please her while knowing death would
    follow.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ejimm is introduced as a beast with two sons, Obegud and Igwe, living in the
    bush near a poor couple with twelve children.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: When the parents go to farm, Ejimm hears the children, sends Obegud to the
    house under the pretense of selling something, and the children ask to see his
    wares.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Obegud returns singing a song whose meaning the narrator says is unknown and
