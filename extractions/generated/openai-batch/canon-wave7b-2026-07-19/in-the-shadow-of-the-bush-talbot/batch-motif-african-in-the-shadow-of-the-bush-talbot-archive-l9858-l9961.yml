canonical_text:
  quote: ''
  summary: The passage first notes a conception-related charm associated with the
    Mboni, then narrates how Obassi Osaw wrongly drives away an unloved wife, how
    her son Effion Obassi is later recognized, excels in market dealings, receives
    a leaf-omen of Obassi's death, is blocked from inheritance by half-brothers, seeks
    divinatory aid from Porcupine, and is guided up a hill to encounter his dead father
    in a large house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman who conceives is said to go to the Mboni so that a charm may be practiced
    for her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Obassi Osaw has many wives; two are loved, while others are not cared for.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: One favored wife privately leads a weeping wife into Obassi's chamber at night.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Obassi later sees the woman's condition, thinks she has been unfaithful, and
    orders her driven away from the town.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The driven-away woman flees into the bush, gives birth there, and raises the
    boy until he becomes tall and strong.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Obassi's people see the boy while cutting bush for farms and say he strongly
    resembles Obassi.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The boy refuses Obassi's food for himself and his mother, saying Obassi drove
    her away without cause.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The returned woman is identified as the one Obassi drove away, and her son
    is named Effion Obassi.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Obassi hands the discarded wife over to be killed, but Effion questions why
    his mother should be killed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The wife who originally helped the discarded woman confesses that she brought
    her to Obassi's room at night and that the son is Obassi's.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the confession, Obassi orders a house built for the discarded wife and
    lets her live there with the boy.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Among Obassi's sons, Effion alone makes profitable market bargains and is
    then entrusted with merchandise.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: Obassi tells Effion that a fresh leaf falling before him on the road or in
    the market will show that Obassi is dead.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: A leaf falls at Effion's feet in the market, and when he hastens home his
