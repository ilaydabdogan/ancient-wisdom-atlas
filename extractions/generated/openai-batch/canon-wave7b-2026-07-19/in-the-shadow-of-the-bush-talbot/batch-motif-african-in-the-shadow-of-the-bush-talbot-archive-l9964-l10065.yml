canonical_text:
  quote: ''
  summary: The passage recounts Effion receiving access to a speaking magic box from
    Obassi, using it to obtain food, laborers, a town, farms, livestock, and feast
    provisions. After a wife opens the storehouse with a key, Effion consults the
    box, fashions a canoe from a great tree, carries the box to the river, travels
    by canoe, receives a peace offering at a landing place, and is told he must remain
    there forever. A second tale begins with three girls at a river; one catches a
    small black fish named Mbonne, dives after it under stones, and disappears.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At daybreak Obassi sends the people out hunting, keeps Effion in the house,
    and opens the door of his treasure house when they are alone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A box in the treasure house speaks and asks whom Obassi has brought; Obassi
    answers that he has brought his son.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The box opens by itself and food pours out for Effion, who eats until satisfied.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Obassi rubs medicine on Effion's eyes; the room fades from sight, and Effion
    sees himself standing on a grave while holding the magic box.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Effion goes into the bush to hide the treasure because his father had told
    him not to reveal the secret.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When Effion calls to the box, it provides planting yams, a long line of slaves
    who build a town and plant farms, and troops of sheep, goats, and cattle.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Effion brings his mother, brothers, and sisters to the new place, gives them
    a feast and fine linen, and they decide to remain with him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: At a great play for his father's death, Effion invites all nations on earth,
    and the box provides enough meat and drink for all who come.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Effion marries many wives, cares especially for two, and gives the key of
    his treasure house to his eldest son before leaving for a far town.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The mother of the eldest son takes the key while the boy sleeps, opens the
    storehouse, answers the box's question, and receives a piece of very fine cloth
    from the box.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Although Effion is far away, he knows within himself what has happened between
    his wife and the box.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: Effion asks the box what sacrifices he must offer so it may be as before;
    the box instructs him to cut down a great tree and fashion it like a canoe.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: The box tells Effion to carry it to the riverside and place it in the canoe;
    Effion embarks and paddles for hours under the box's instructions.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: People who see a man with a great box approaching their town make a sacrifice
    of white cloth and young palm leaves as a token of peace at the landing place.
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: The box tells Effion that he may not leave the place and that they must stop
    there forever.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:16
  text: Three girls go to the river to gather snails; one catches a small black fish
    named Mbonne, the fish slips under stones, and the girl dives after it but does
    not reappear.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:17
  text: The missing girl's two companions go to town and tell her parents.
  category: action
  evidence_refs:
  - ev:16
- id: obs:18
  text: A man building a house goes into the bush to cut tie-tie for roof binding
    and, while walking by the riverside, sees tie-tie lying there; the passage breaks
    off before the outcome.
  category: action
  evidence_refs:
  - ev:17
