canonical_text:
  quote: ''
  summary: The passage describes Obassi Osaw dwelling in the sky and Obassi Nsi dwelling
    on earth after a separation, with Nsi associated with birth, death, and crops.
    It then records Ekoi rain-making and rain-stopping practices involving crocodile
    Efumi, rain Juju priests, magic leaves gathered at the new moon, water and potions,
    a skeptical man who tests a powerful rain Juju, bundles kept over fire to prevent
    rain, and rainbows produced by ritual specialists to end downpours.
  language: English
  quote_policy: summarized
