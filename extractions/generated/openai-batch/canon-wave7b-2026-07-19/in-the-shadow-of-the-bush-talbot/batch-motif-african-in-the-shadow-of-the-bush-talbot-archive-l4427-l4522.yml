    usually found where rainfall is precarious, while suggesting these rites may survive
    from an earlier parkland setting.
  claim_level: same_function
  target: Rain-making customs in regions with precarious rainfall or an earlier parkland
    environment
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
