canonical_text:
  quote: ''
  summary: A precocious boy identifies himself as the son of the wife and husband,
    saying he stayed seven years in his mother's womb so he could emerge ready to
    help. He uses a magic two-edged knife called Isawm to hunt and to find the source
    of distant wrestling music. He climbs an otherwise inaccessible mountain to a
    plateau, defeats seven wrestlers, and is adopted by Obassi, who recognizes him
    as the one he had sent to help the poor couple. Obassi's chief wife desires the
    youth; after the youth admits wrongdoing and the woman denies it, Obassi forgives
    him.
  language: English
  quote_policy: summarized
