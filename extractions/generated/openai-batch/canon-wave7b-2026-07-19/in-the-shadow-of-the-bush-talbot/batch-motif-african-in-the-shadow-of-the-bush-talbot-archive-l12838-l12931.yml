canonical_text:
  quote: ''
  summary: The passage describes Ojo communities, their relation to Ekuri and migration
    from the north; the reverence, regalia, and taboos surrounding an old chief who
    is also head priest of Akillinga; a colonial demand that he remove his hat; his
    head wife's delighted gift of a large yam; a dispute over relocating the town
    near the Akillinga shrine; reports of sacrifice and cannibal rites associated
    with Akillinga; and the belief that Ojo souls are Efumi of elephants, alongside
    observations of elephant damage nearby and wounded elephants entering the Calabar
    River.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ojo are described as belonging to the same race as the Ekuri, having separated
    from them many years earlier, and as having gradually come down from the north
    like neighboring tribes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old chief is treated with great reverence, wears a scarlet cap decorated
    with leopards' claws, is not supposed to be seen bareheaded, and is subject to
    several taboos.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chief is required to remove his hat while addressing the white man and
    eventually consents.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The chief's head wife brings a very large yam as a present and expresses delight
    at her husband's discomfiture.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The head wife explains that the chief has long annoyed her with self-important
    behavior, in addition to taboos connected with his position as head priest of
    Akillinga, including eating alone.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The town is divided over relocation: women, young men, and members oppose
    the headmen''s chosen site because it lies in the bush away from the main road
    and lacks good nearby water.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The chiefs' preferred site is remote from the main road, near only a seasonal
    stream, and close to the head chief's compound containing the shrine of Akillinga.
  category: setting
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The passage states that women, young men, and members feared that isolation
    from the main road would make sacrifice to the Juju easier to conceal.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Akillinga is said to have a reputation as a particularly cruel Juju before
    which enemies were sacrificed and cannibal rites were carried out up to recent
    times, though such practices are now disclaimed.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The people of Ojo Nkonmba and Ojo Akangba believe that their souls are Efumi
    of elephants.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Ojo farms are described as undamaged by elephants, while nearby Ekuri
    territory suffers from depredations by large herds.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The hunter Okun Omin tracks two wounded elephants to the brink of the Calabar
