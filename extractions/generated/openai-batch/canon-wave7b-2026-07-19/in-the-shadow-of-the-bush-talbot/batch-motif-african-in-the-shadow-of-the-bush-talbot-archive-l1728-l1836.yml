canonical_text:
  quote: ''
  summary: 'The passage records a dialogue about Obassi Osaw and Obassi Nsi: Osaw
    is associated with thunder, lightning, sun, rain, and killing, while Nsi is associated
    with the earth, crops, offerings drawn downward, and the under-earth country of
    the dead. The respondent describes a new form emerging from a decayed body and
    going to Nsi with funeral expenditures, and speculates that Nsi is mother/lady
    and Osaw father/lord. The passage then introduces a story told by Itambo Isom
    about a poor man and a rich friend, their sons, a food offering made before the
    rich man''s death, and the boys'' later fostering and refusal to live outside
    their own house.'
  language: English
  quote_policy: summarized
