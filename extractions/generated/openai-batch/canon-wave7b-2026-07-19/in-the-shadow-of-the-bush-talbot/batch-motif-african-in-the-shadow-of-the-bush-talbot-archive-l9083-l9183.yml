canonical_text:
  quote: ''
  summary: The passage gives statements about witchcraft accusations and ordeals.
    A charm operated by a diviner answers questions about who has bewitched a girl
    and names Obassi Nenkui. Obassi eats the Esere bean, vomits, recovers, and treats
    this as proof that he is not guilty. Baii, the girl's mother, also takes Esere
    after being accused; her pregnant daughter is told not to touch her, while other
    women tend her until she recovers. Further statements describe parents of sick
    or dead children being accused by Chief Nenkui of witchcraft and being told or
    choosing to eat Esere. One parent also describes gathering sacrifices for the
    Juju to heal a sick son. The final statement is incomplete within the supplied
    passage.
  language: English
  quote_policy: summarized
