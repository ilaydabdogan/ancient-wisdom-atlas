canonical_text:
  quote: ''
  summary: Etuk and Njomm exchange farm produce and begin giving plantains and coco
    to a sequence of bush animals. News of the food passes from one animal group to
    another until Crocodile, who lives in the nearby river Akarram, comes to ask.
    Etuk refuses Crocodile as a non-friend, but Njomm gives him plantains. Crocodile
    shares them with Python in the water; Python gives Crocodile a shining stone from
    inside his head to buy more food, and the stone lights Crocodile's path at night.
  language: English
  quote_policy: summarized
