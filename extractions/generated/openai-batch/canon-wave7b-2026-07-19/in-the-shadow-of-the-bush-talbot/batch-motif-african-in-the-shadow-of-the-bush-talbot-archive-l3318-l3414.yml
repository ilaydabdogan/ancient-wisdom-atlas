canonical_text:
  quote: ''
  summary: The passage defines Ekoi Njomm or Juju as mysterious natural forces and
    the means of influencing them, then catalogs named Jujus at Ekong and Oban according
    to their protective, healing, hunting, weather, crop, harvest, poison-warning,
    and predator-averting functions. It also notes cult membership objects, household
    inheritance of Jujus, a harvest feast, and leopard attacks motivating a leopard-protection
    Juju.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Njomm, translated as Juju, is described as including mysterious forces of
    nature and also the means by which such forces may be controlled or influenced.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The means of influencing these forces are described as secrets obtained by
    unusually wise men from nature or given by deities to a favored mortal.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that towns have a dominant Juju, and that protection against
    witchcraft is its foremost attribute.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lesser Jujus are said to preside over particular departments, though their
    attributes may overlap.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ofiri at Ekong is described as defending the town against witchcraft and theft,
    destroying wizards, drawing distant people to join its cult, and using medicine
    poured on members' metal torques or anklets.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Members of Ofiri carry medicine back to be placed in a shrine at their own
    homes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nimm Asam is described as strong against witchcraft, helpful to hunters, and
    especially valued for warning members against poison in food or drink.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Certain members of Nimm Asam are said to be able to produce the rainbow and
    make rain cease for a time.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Egpatim is listed against witchcraft and theft; Nkajokk wards off sickness;
    Ebup supports hunting and fishing; and Ngapong protects against beasts of prey,
    especially leopards.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Some family Jujus are described as inherited from father to son and from mother
    to daughter over many generations.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Oban, Okpata and Ejamet are described as old Jujus against witchcraft and
    theft, while Eja increases crops, protects herds from wild animals, and protects
    from thunder and lightning.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The feast of Eja is described as the chief feast of the year and as corresponding
    to the harvest festival.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Ngbe Abum Obbaw, meaning 'Leopard knocks his foot,' is described as a leopard-protection
