canonical_text:
  quote: ''
  summary: The passage describes Obung's town condition and a prior incident in which
    the town's jar of Eja medicine was accidentally broken. The inhabitants dispersed
    into the bush out of fear that the Juju would avenge the damage, later regrouped
    after time had passed, and bought a new pot of Eja medicine. A later visit includes
    heavy rain, a Juju in the chief's compound, and an accidental rifle discharge
    that harmed no one. The passage then begins a description of Netim and its seasonal
    settlement pattern.
  language: English
