canonical_text:
  quote: ''
  summary: Ebopp arrives to keep funeral customs for a dead woman and says he has
    brought only plantains. During famine the plantains are distributed among Obassi
    Osaw's people, after which Osaw threatens to keep his daughter from returning
    with Ebopp unless more food is provided. Ebopp consults Mbaw about selling two
    valuable eyes; Mbaw advises grinding the bright eye-stones into many fragments.
    Ebopp grinds Iku's eyes into shining sand, carries the fragments in a black cap,
    finds hidden stores in Effion Obassi's house, and offers an exchange that he says
    will make the townsfolk bow down before Effion.
  language: English
  quote_policy: summarized
