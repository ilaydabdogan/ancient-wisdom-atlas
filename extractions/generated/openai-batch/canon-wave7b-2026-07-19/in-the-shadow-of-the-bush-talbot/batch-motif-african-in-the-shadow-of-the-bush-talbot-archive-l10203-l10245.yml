  quote: Ekoi people do not trouble themselves about the stars, because the trees
    always hide them.
  summary: 'The passage opens Chapter XVIII, headed “Ojje or Witchcraft,” then describes
    a night in a bush camp, the sounds of water, leaves, insects, birds, and animals,
    the forest canopy that hides much of the sky, and the limited role of heavenly
    bodies among the Ekoi because trees obscure the stars. It lists a few named celestial
    bodies or asterisms: Venus, Aldebaran, Orion’s girdle, and the Pleiades.'
