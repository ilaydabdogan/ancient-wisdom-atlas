  summary: A travel narrative describes the Ojuk river crossing, where a buried pot
    of Juju medicine was found under tree roots after many deaths. The narrator’s
    party later has a dangerous cobra encounter near the river. The passage then notes
    Aking, Ako, the collection of a Goliath beetle, and frescoes at Ntebbashott depicting
    the District Commissioner on horseback; the Ekoi call the horse the white man's
    cow.
