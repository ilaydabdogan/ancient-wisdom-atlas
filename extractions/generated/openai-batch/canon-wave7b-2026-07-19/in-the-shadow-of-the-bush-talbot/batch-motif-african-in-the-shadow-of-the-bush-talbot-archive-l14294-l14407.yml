canonical_text:
  quote: ''
  summary: Ekandem cannot turn back because the road closes and darkens behind her,
    while a skull rolls beside her. She and her maid arrive at Mfam Ane Achi, a town
    inhabited only by bounding skulls, who first treat them as fresh meat and then
    decide they should be given in marriage to Abia-Nkpaw, giant king of the skull-people.
    Ekandem becomes Abia-Nkpaw's wife and later, while fetching water at a spring,
    recognizes Nkundak, a bird friend of her father Obassi Nsi. Nkundak carries the
    girls away by his wings and informs Obassi Nsi, who rewards the bird with distinctive
    plumage, a crest, and a strong voice; Nkundak's feathers are said to remain a
    sign of bravery when worn at public dances.
  language: English
  quote_policy: summarized
