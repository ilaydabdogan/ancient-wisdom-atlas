  summary: The passage describes the route to Ekoi land by the River Kwa, the river’s
    vegetation and animals, an Efik ode to the Tatabonko fish, the manatee as a prized
    animal believed to confer magical properties when eaten, and Nimm, a female river-dwelling
    being associated with women worshippers, oath sanctions, animal servants, and
    manifestations as snake or crocodile.
