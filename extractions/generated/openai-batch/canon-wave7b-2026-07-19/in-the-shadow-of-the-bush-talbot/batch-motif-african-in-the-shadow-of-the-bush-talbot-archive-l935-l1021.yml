  text: The Ekoi people are described as divided by the Cameroon/Southern Nigeria
    boundary, and their land is most easily reached by way of the River Kwa.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A part of the river is called by the Ekoi “our own water,” where the river
    narrows and is described as more beautiful.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The river banks and nearby places are described with mangrove, screw pine,
    palm trees, arums, other flowering trees, white sand beaches, crocodiles, monitors,
    snakes, birds, butterflies, and fish.
  category: setting
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
- id: obs:4
  text: The narrator reports seeing an unfamiliar crocodile-like creature lying on
    a tree branch above the water, with a pig-like flat snout and black rings around
    its tail, which later slid out of sight.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tatabonko fish are said to be named by both Efik and Ekoi and to hold an important
