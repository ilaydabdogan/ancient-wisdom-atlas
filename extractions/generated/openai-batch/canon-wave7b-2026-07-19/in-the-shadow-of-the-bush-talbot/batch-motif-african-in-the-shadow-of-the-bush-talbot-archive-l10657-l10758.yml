canonical_text:
  quote: ''
  summary: 'The passage gives a contextual note about sickness ending in Oban and
    a similar event at Aking, states a belief that a dead witch or wizard may inhabit
    an animal form, and narrates the story of seven witchcrafts: four wizards and
    three witches. They devise ways to force people to make offerings against witchcraft.
    One buries harmful medicine in a farm path, causing a farm owner to become sick,
    receive a warning, report it, and die; the townspeople then make offerings. Another
    proposes rock magic, and the wizards imprison a victorious wrestler inside a rock
    with one hand and his red flower visible as a warning. Passers-by identify the
    hand and flower. The passage concludes that other magicians killed men in their
    own ways, leading people to make offerings and hang charms, and begins another
    account of deaths in a larger town attributed to witches.'
  language: English
  quote_policy: summarized
