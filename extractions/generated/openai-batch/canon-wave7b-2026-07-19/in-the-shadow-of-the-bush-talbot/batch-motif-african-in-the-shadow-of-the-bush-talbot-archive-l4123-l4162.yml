canonical_text:
  quote: ''
  summary: The passage reports that Jujus are used in court to influence judgments
    or incapacitate a judge. It recounts a case in which Nsa Obassi accused Egbo Club
    members of beating him, and Oberi Oye claimed that a strong Juju and a foot-stamp
    would make the Judge dumb and unable to pronounce judgment. The passage then states
    that a Juju cannot be revoked without proper offerings and full rites, citing
    testimony by Oyonmba, a head priest, that a revocation was invalid because it
    lacked full ritual and was done empty-handed. It introduces an example of revoking
    the Juju Ofiri at Ekong, with Akunane as head priest.
  language: English
  quote_policy: summarized
