canonical_text:
  quote: ''
  summary: 'The passage describes Ekoi burial customs, including road burial for strangers
    so their spirits can find the way home. It then presents a story explaining burial
    customs: a son secretly buries his mother in an inner room, substitutes a stone-filled
    coffin for public burial, agrees to bury an old woman named Anyin in the same
    way, and later kills and buries her after a chief rules that her burial agreement
    must stand. The passage states that this explains why Ekoi people are buried the
    same night they die.'
  language: English
  quote_policy: summarized
