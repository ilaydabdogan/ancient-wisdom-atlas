  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the story, a mother asks her son not to leave because she is old and near
    death; he goes to market but returns after inwardly perceiving that she has little
    time left.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The mother dies on the same day that her son returns, before sunset.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At midnight, instead of using the grave planned by the townspeople, the son
    digs a grave in the small inner room of his house, makes a coffin, and buries
    his mother alone.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The son places another coffin outside, and the next morning the age classes
    carry it to a bush grave; when opened, it contains only stones, which are then
    buried.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: An old woman provides palm wine and food for the son and asks what he has
    done with his mother's body and why he buried her secretly.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: After seeing the inner-room burial place, the old woman praises the son and
    orders him to bury her in the same way when she dies.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: When the father orders the son to return to market, the son worries that Anyin
    may die while he is away and asks her whether she will die that day so that he
    can bury her first.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Anyin says she gave the burial order because the son was dutiful and because
    she has no child to bury her, but she refuses the need to die immediately.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The son digs a grave in the small room of Anyin's compound and calls a meeting
    of the townspeople.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Head Chief says the woman's order was a binding agreement that cannot
