- id: obs:1
  text: Tortoise says the woman may act like a dumb woman, not answer when spoken
    to, and needs to rest until he has gone.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Obassi orders food for Tortoise, and Tortoise asks for large leaves so he
    can wrap the hot food and carry it away.
  category: action
  evidence_refs:
