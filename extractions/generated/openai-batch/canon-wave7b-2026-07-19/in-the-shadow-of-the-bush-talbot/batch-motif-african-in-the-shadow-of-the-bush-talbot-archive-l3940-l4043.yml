- id: obs:11
  text: During a year with no fruit, Mbaw goes to the bush and river, summons a floating
    calabash with a foul thing inside, sends it away, then summons a floating log
    carrying plantains and eats some of the fruit.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Mbaw takes some plantains home and gives them to Nki, who asks to accompany
    him the next day; Mbaw refuses.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Nki fills a leaf with ashes, puts it into a hole in Mbaw's bag, and later
