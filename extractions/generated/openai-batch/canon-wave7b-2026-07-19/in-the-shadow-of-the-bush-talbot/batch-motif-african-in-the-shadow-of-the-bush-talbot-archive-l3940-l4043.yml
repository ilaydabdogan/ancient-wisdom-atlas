- id: obs:3
  text: Tortoise tells Obassi that the woman in the bed is his only daughter, asks
    Obassi to care for her, and says he will claim her back if she dies; Obassi agrees.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Obassi enters the bride-room, calls to the woman, brings food and drink, and
    receives no response or movement.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
