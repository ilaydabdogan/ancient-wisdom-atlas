canonical_text:
  quote: ''
  summary: 'The passage finishes a tale in which Tortoise leaves a dead female slave
    in Obassi''s bride-room while claiming she is his daughter, uses a prior compact
    to avoid punishment, and causes future sacrifices to be made with Tortoise. A
    second tale begins with an announced explanation for the use of Crab''s Claw in
    Jujus: during famine, Mbaw finds floating food by a river; Nki secretly tracks
    him with ashes, rides a calabash downriver to a ghost town, and meets his dead
    sister.'
  language: English
  quote_policy: summarized
