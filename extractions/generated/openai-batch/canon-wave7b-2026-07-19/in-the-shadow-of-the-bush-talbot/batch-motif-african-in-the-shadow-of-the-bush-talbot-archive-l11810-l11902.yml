canonical_text:
  quote: ''
  summary: The passage describes a concluding funeral play for a deceased chief, the
    appearance of two restricted masquerade figures, the ritual skull called Ojjen
    and its marital use, and the beginning of a description of funeral customs for
    an important woman, including washing, dressing, sacrifice, and burial inside
    a room.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Oban head men invited the narrator to attend a great play held in honour of
    a deceased chief and serving as the finale to his long burial rites.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Principal compounds contained decorated stands spread with blankets or bright
    cloths and hung with handkerchiefs and prints, with china and earthenware displayed
    on them.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator states that two figures, said not previously to have shown themselves
    to a white man there, appeared before the visitors.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Igumi is described as a dark, skin-covered mask with a snake-like nose; its
    name is also the name of a tree associated locally with ants in hollow stems and
    supposed occult properties.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The club associated with Igumi had originally been formed for war against
    Aking, and the head was adopted as its standard or device.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ojjen sprang forward, bobbed and danced, and bore on its head a human skull
    or dried head with an open mouth and wrinkled skin around the eye-holes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The skull is described as a great Juju, brought by the Ekoi from an old home
    near Mkpott, and as the chief treasure of the company called Etim Ngbe or Ojjen.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: At certain marriages, the skull is carried to the bride-chamber door and remains
    there until dawn as a threshold sentinel.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The skull is believed to ensure a wife's fidelity; if she tried to leave,
    it would follow her and could summon ghost-town shapes to block her way to another
    lover.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The funeral customs following are described as typical for every woman of
    importance.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: After the death of Adet Awaw, friends and relatives bewailed her, women washed
    the corpse with heated water, new clothes were put on it, and the hair was arranged
    in tufts.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A coffin was lined with new cloths and four pillows, the corpse's hands were
    folded across the breast, a goat and cow were sacrificed while a grave was dug
    in a room, and the coffin was lowered and covered with earth.
  category: sequence
  evidence_refs:
  - ev:9
