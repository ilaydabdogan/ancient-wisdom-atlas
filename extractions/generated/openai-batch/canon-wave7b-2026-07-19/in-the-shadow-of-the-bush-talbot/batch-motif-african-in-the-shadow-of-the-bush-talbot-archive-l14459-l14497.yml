  text: Illness is described as usually caused by ancestors, an offended Juju, or
    the malice of a witch or wizard.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a man or woman falls sick, they go to a Diviner to discover the cause
