canonical_text:
  quote: '"illness is usually sent by ancestors"'
  summary: 'The passage describes Ekoi beliefs and practices concerning illness: spiritual
    causes are investigated by divination, some illnesses are treated as natural by
    native doctors using plant materials and other substances, the moon is believed
    to affect disease, named Jujus and protective objects are linked to specific ailments,
    and a brief example of improvised surgery is given.'
  language: English
  quote_policy: quoted
literal_observations:
