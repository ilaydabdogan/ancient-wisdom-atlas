canonical_text:
  quote: ''
  summary: A piece of palm leaf is found under Effion Obassi's mat, and the townsfolk
    apply a rule that he must die. Obassi tries to prevent his son's death and offers
    a slave as substitute, but the seven Images of the chief-only Nsibidi club demand
    Effion and behead him. Grieving his only son, Obassi causes a false friend and
    others involved in Effion's death to be killed through trees, a hole, a lengthening
    road, Nsibidi execution, a river, a farm Juju, a great snake, and a falling tree.
    Obassi's wife also uses Jujus against some injurers. When the parents of the dead
    ask the cause, Obassi says he killed those who had a part in his son's death,
    which he attributes to deceit and town jealousy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A piece of palm leaf was found under the mat on which Effion had sat after
    the townsfolk ordered everyone to sit where they had sat the previous day.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The townsfolk told Effion that he must die within twelve days under their
    rule; Obassi said his son should not be killed and later offered a slave in his
    place, but the townsfolk refused.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Nsibidi is described as a very powerful club to which only chiefs could belong;
    its seven Images demanded Obassi's son, received Effion, and cut off his head.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Obassi mourned Effion as his only son and remembered receiving plantains,
    yams, and fresh water from him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Obassi asked the man chosen as Effion's friend to pick kola nuts, then addressed
