    and the Nsibidi Images beheaded him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Obassi sent one of the seven Images to pick native pears; when the Image climbed
    the tree, Obassi spoke to it, and the tree grew high and flung him down dead.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A fourth man was sent fishing; the river had been ordered to kill him if he
    was guilty of Effion's death, and he was drawn under and drowned.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A fifth man was sent to plant yams, where a farm Juju caught him; he cried
