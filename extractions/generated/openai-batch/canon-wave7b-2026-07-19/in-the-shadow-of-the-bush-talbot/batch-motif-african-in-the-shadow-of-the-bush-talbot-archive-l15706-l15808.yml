    the man down so that he died.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: Obassi sent a man who had helped kill his son into a porcupine hole and commanded
    the hole to cover him if he was guilty and let him emerge unharmed if guiltless.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Obassi sent another man to Oremm with a one-day deadline and threatened Nsibidi
