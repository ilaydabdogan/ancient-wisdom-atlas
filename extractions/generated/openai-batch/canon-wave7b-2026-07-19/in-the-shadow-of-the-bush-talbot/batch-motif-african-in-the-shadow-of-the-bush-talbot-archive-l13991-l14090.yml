canonical_text:
  quote: '"I promise that I will war no more from this day."'
  summary: A man brings a calabash containing salt and cloth as a present for his
    wife and publicly promises to stop making war. The woman demands a more solemn
    pledge through mutual kola-nut eating and mixing of their blood; after this he
    ceases warring. The passage then describes Ekoi divisions of labor by sex in farming,
    fishing, house building, and craft work, including seasonal timing, crop storage,
    fishing practices, and ritual or lucky actions associated with food production.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A man brings a calabash containing ten parcels of salt and two pieces of native
    cloth, sets it before Asim Eji, calls it a present for his wife, asks the people
    to plead with her, and promises not to war any more.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman says that if her husband does not take another way of life according
