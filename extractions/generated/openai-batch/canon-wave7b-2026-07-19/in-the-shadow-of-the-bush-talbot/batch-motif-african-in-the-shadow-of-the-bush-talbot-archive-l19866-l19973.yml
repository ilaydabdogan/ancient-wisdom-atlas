canonical_text:
  quote: ''
  summary: Fish, also called Njokk Mbonn, uses magical waves to draw Elephant, Elephant's
    daughter, and Leopard into the river depths; Leopard dies in a prison below, while
    Fish marries Elephant's daughter and their children are identified as hippopotami.
    A second tale begins with Obassi and his wife as the first people; their two white
    and two black children are sent to hunt and fish, the white children receive rewards
    first through taking or falsely presenting food, and the black children are later
    sent away into the bush behind a blocked road. The passage ends while the white
    boy's son is playing by the river.
  language: English
  quote_policy: summarized
