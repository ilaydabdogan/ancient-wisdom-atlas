canonical_text:
  quote: ''
  summary: The passage describes a long-burning lamp and its materials; cult objects
    in the temple of Athena Polias, including a hidden wooden Hermes, old votives,
    Persian spoils, and the sacred olive associated with Athena's contest for the
    land and its regrowth after Persian burning; the adjoining temple of Pandrosus
    and the nocturnal rite of two maidens who carry unknown sacred objects through
    an underground passage to Aphrodite's precinct and return with covered objects;
    and several statues or images connected with Athenian history and heroic combat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A lamp filled with oil is said to remain alight day and night until the same
    day of the next year, with oil sufficient for the whole interval.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The lamp has a wick of Carpasian flax described as fire-proof, and a bronze
    palm above it reaches to the roof and draws off smoke.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Callimachus made the lamp and is described as exceptionally clever, associated
    with drilling holes through stones and with the title Refiner of Art.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the temple of Athena Polias there is a wooden Hermes said to have been
    dedicated by Cecrops, but it is hidden by myrtle boughs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Notable votive offerings include a folding chair made by Daedalus and Persian
    spoils connected with Masistius and Mardonius; the narrator questions the attribution
    of the scimitar to Mardonius.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The olive is described as the testimony produced by the goddess when she contended
    for the land, and a legend says it burned when the Persians fired Athens but grew
    again the same day to two cubits.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The temple of Pandrosus adjoins the temple of Athena, and Pandrosus is described
    as the only one of the sisters faithful to the trust.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Two maidens called Bearers of the Sacred Offerings live for a time with the
    goddess, and at the festival they carry on their heads objects given by the priestess
    of Athena; neither giver nor carriers know what the objects are.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The maidens descend at night by a natural underground passage to the precinct
    of Aphrodite in the Gardens, leave below what they carried, receive another covered
    object, bring it back, and are then replaced by other maidens.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Large bronze figures of men facing one another for a fight are called Erechtheus
    and Eumolpus, though the narrator says the victim of Erechtheus was Immaradus,
    son of Eumolpus.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Old figures of Athena are black and fragile from the flames that caught them
    when the King captured the emptied city, though their limbs are not missing.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: A boar-hunt is displayed, with uncertainty over whether it is the Calydonian
    boar, and Cycnus is shown fighting Heracles; Cycnus is said to have killed Lycus
    and later to have been killed by Heracles near the river Peneius.
  category: sequence
  evidence_refs:
  - ev:7
