candidate_motifs:
- id: motif:1
  label: Supernatural defense of a sanctuary against invaders
  taxonomy_refs: []
  basis: The attack on Delphi is met not only by human defenders but also by thunderbolts,
    rocks from Parnassus, and armed warrior shapes haunting the Gauls.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage reports the phenomena with 'they say' for the warrior figures;
    no broader comparative claim is made in the passage.
- id: motif:2
  label: Heroic apparition aiding in battle
  taxonomy_refs: []
  basis: Hyperochus, Amadocus, and Pyrrhus are identified as armed warrior figures
    active during the battle against the Gauls.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The literal status is reported tradition rather than direct authorial
    verification.
- id: motif:3
  label: Enemy tomb transformed into hero cult
  taxonomy_refs: []
  basis: Pyrrhus had formerly been dishonored as an enemy, but after his battle help
    the Delphians sacrifice to him as to a hero.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage gives only a brief cultic notice and does not narrate the
    full cult's origin.
- id: motif:4
  label: Spring-water and wine used to capture a mythic figure
  taxonomy_refs: []
  basis: The Spring of Midas is linked to the report that Midas mixed its water with
    wine to capture Silenus.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The report is brief and etiological context is limited to the named spring
    and associated capture.
- id: motif:5
  label: Eponymous civic ancestors naming tribes
  taxonomy_refs:
  - royal_legitimacy
  basis: Statues of heroes are said to stand near the Tholos, and the Athenian tribes
    received their names from these eponymous figures.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
