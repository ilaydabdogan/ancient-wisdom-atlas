canonical_text:
  quote: ''
  summary: The passage recounts the Celtic/Gaulish advance past Thermopylae, the defense
    of Delphi with help described as thunderbolts, falling rocks from Parnassus, and
    armed warrior apparitions, and later Gallic movements in Asia Minor. It then turns
    to places and statues near the Athenian Council Chamber, naming eponymous Athenian
    heroes and giving associated genealogical and mythic notices, including Leos's
    daughters, Pandion's exile, and the story of Tereus, Procne, and Philomela.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Celts found the path once used by Ephialtes of Trachis for the Persians,
    overwhelmed the Phocians stationed there, and crossed Oeta without being noticed
    by the Greeks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Athenians resisted the foreigners on two sides and took Greeks aboard
    their fleet while sailing through muddy waters of the Lamian gulf near Thermopylae.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Gauls south of the Gates were eager to sack Delphi and the treasures of
    the god rather than capture other towns.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The defenders of Delphi included Delphians, neighboring Phocians around Parnassus,
    and a force of Aetolians.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: During the engagement, thunderbolts and rocks broken from Parnassus were said
    to be hurled against the Gauls.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Terrible shapes in the form of armed warriors were said to haunt the foreigners
    during the battle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Two of the armed warrior figures were identified as Hyperochus and Amadocus
    from the Hyperboreans, and the third as Pyrrhus son of Achilles.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Because of Pyrrhus's help in battle, the Delphians sacrifice to him as to
    a hero, although they formerly dishonored his tomb as that of an enemy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Midas son of Gordius was said to have founded Ancyra, and an anchor associated
    with Midas was kept in the sanctuary of Zeus in Pausanias's time.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: A spring called the Spring of Midas was associated with a report that Midas
    mixed its water with wine to capture Silenus.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Pergameni took Ancyra and Pessinus, kept spoils from the Gauls, and had
    a painting portraying their deed against them.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: Near the Council Chamber of the Five Hundred stood the Tholos, where the Presidents
    sacrifice, and nearby were silver statues and statues of heroes from whom the
    Athenian tribes received their names.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:13
  text: The eponymous heroes listed include Hippothoön, Antiochus, Ajax, Leos, Erechtheus,
    Aegeus, Oeneus, Acamas, Cecrops, and Pandion.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:14
  text: Leos is said to have given up his daughters at the command of the oracle for
    the safety of the commonwealth.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: Erechtheus is said to have conquered the Eleusinians in battle and killed
    their general Immaradus son of Eumolpus.
  category: action
  evidence_refs:
  - ev:13
- id: obs:16
  text: Pausanias distinguishes earlier and later figures named Cecrops and Pandion,
    giving genealogical relationships and noting uncertainty about which figures were
    honored by the statues.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:17
  text: Pandion, son of Cecrops the second, was deposed by the Metionidae, fled to
    Megara with his banished children, died there, and had a tomb on the Megarid coast.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:18
  text: Pandion's children later expelled the Metionidae and returned from banishment,
    and Aegeus, as eldest, became king of the Athenians.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:19
  text: The passage states that a mortal cannot overstep what the deity thinks fit
    to send.
  category: speech
  evidence_refs:
  - ev:17
- id: obs:20
  text: Tereus, though married to Procne, is said to have dishonored Philomela, transgressed
    Greek custom, mangled the damsel's body, and thereby constrained the women to
    avenge her.
  category: sequence
  evidence_refs:
  - ev:18
