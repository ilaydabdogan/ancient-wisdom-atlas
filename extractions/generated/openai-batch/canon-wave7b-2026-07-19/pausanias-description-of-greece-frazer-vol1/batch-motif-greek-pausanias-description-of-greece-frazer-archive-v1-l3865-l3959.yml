canonical_text:
  quote: ''
  summary: Pausanias describes Brauron, where Iphigenia was said to have arrived with
    an image of Artemis, and Rhamnus, where a sanctuary and statue of Nemesis are
    associated with Persian overconfidence at Marathon. He gives details of Nemesis’s
    statue, discusses the Aethiopians carved on her cup, digresses on Ocean, Aethiopia,
    the Nile, and Mount Atlas, then describes traditions about Nemesis as Helen’s
    mother and the figures shown on the statue’s pedestal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Brauron, Iphigenia is said to have landed with the image of Artemis after
    fleeing from the Tauri; she left the image there and then went to Athens and later
    Argos.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports an old wooden image of Artemis at Brauron and postpones
    discussion of which place has the image taken from the foreigners.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Rhamnus has a sanctuary of Nemesis inland from the coast, and Nemesis is described
    as especially implacable toward violent men.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The foreigners who landed at Marathon are said to have brought Parian marble
    for a trophy because they believed Athens was already theirs; the wrath of Nemesis
    was thought to fall on them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Pheidias made a statue of Nemesis from the Parian marble; the statue has a
    crown with deer and small Victories, an apple branch in the left hand, and a cup
    with Aethiopians in the right hand.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The narrator reports but rejects the explanation that Aethiopians are carved
    on the cup because they dwell near Ocean and Ocean is father of Nemesis.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Some Aethiopians are described as showing the Table of the Sun and having
    no sea or river except the Nile.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: Water near Atlas is said to begin three streams, be swallowed by sand, contain
    small crocodiles near its source, and possibly reappear as the Nile in Egypt.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: Mount Atlas is described as so high that its peaks are said to touch heaven,
    and as inaccessible because of water and trees.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage states that ancient statues of Nemesis lacked wings, while later
    artists gave Nemesis wings as they did to Love.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Greeks are said to hold that Nemesis was Helen’s mother, Leda suckled
    and nursed Helen, and Zeus, not Tyndareus, was Helen’s father.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: On the pedestal, Pheidias represented Helen being led to Nemesis by Leda,
    with Tyndareus and his children, Hippeus with a horse, Agamemnon, Menelaus, Pyrrhus,
    Hermione, Epochus, and another youth; Orestes was omitted because of his crime
    against his mother.
  category: object
  evidence_refs:
  - ev:12
  - ev:13
