canonical_text:
  quote: The story told at the mysteries of the Mother about Hermes and the ram I
    know but do not relate.
  summary: The passage describes Corinthian sanctuaries, fountains, statues, wells,
    myths attached to Peirene and Glauce, a seated Hermes with a ram, ritual reticence
    about the Mother’s mysteries, the death and cult of Medea’s children, and Medea’s
    later flight and name-giving among the Medes.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A sanctuary for all the gods stands near a fountain with a bronze Poseidon
    and a dolphin spouting water under Poseidon’s feet; nearby are images of Apollo,
    Aphrodite, Hermes, and Zeus.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the market-place there is a bronze Athena with relief figures of the Muses
    on the pedestal, and above the market-place is a temple of Octavia.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the road to Lechaeum a gateway bears two gilded chariots, one carrying
    Phaethon son of Helius and the other carrying Helius himself; a bronze Heracles
    is farther on.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Peirene is said to have been a woman who became a spring because she wept
    for her son Cenchrias, unintentionally killed by Artemis.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Peirene spring is ornamented with white marble; water flows from cave-like
    chambers into an open-air well, is pleasant to drink, and is said to temper red-hot
    Corinthian bronze.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Near Peirene are an image and sacred enclosure of Apollo, with a painting
    of Odysseus’s exploit against the suitors.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: A bronze seated Hermes has a ram standing beside him; the explanation given
    is that Hermes especially cares for and increases flocks, supported by a Homeric
    quotation.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The narrator says he knows but does not relate the story told at the mysteries
    of the Mother about Hermes and the ram.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the image of Hermes come Poseidon, Leucothea, and Palaemon on a dolphin;
    elsewhere a notable well has a Bellerophontes above it, and water flows through
    the hoof of Pegasus.
  category: setting
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: At the Well of Glauce, Glauce is said to have thrown herself in because she
    believed the water would cure the drugs of Medea.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Beside the Odeum is the tomb of Medea’s children, Mermerus and Pheres, who
    are said to have been stoned to death by the Corinthians because of gifts they
    brought to Glauce.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Because the death of Medea’s children was violent and illegal, young Corinthian
    babies were destroyed by them until an oracle commanded yearly sacrifices in their
    honour and the setting up of a figure of Terror.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: After the Roman destruction of Corinth and the replacement of the old Corinthians,
    the new settlers stopped the sacrifices to Medea’s sons and no longer observed
    hair-cutting or black clothing for them.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Medea later went to Athens, married Aegeus, was detected plotting against
    Theseus, fled to Aria, caused its inhabitants to be called Medes after her, and
    brought with her a son said by some to be named Medus.
  category: sequence
  evidence_refs:
  - ev:12
