candidate_motifs:
- id: motif:1
  label: grief-born spring or transformation into water source
  taxonomy_refs: []
  basis: Peirene is said to have been a woman who became a spring because of tears
    shed for her dead son.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage reports the local legend but does not elaborate the mechanics
    of transformation beyond tears and spring.
- id: motif:2
  label: divine or heroic animal image marking a water source
  taxonomy_refs: []
  basis: Water is associated with Poseidon’s spouting dolphin, Palaemon on a dolphin,
    and Bellerophontes with Pegasus’s hoof as a water outlet.
  evidence_refs:
  - ev:1
  - ev:7
  - ev:8
  confidence: medium
  cautions: This is an internal visual pattern in the topographical description, not
    an explicitly named mythic motif.
- id: motif:3
  label: withheld sacred mystery knowledge
  taxonomy_refs:
  - forbidden_knowledge
  basis: The narrator states that he knows the mystery story of the Mother about Hermes
    and the ram but does not relate it.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage indicates ritual reticence, but the taxonomy reference is
    approximate because the content is not disclosed.
- id: motif:4
  label: water sought as cure for harmful drugs
  taxonomy_refs: []
  basis: Glauce throws herself into her well believing its water will cure the drugs
    of Medea.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage reports Glauce’s belief but does not state that the cure worked.
- id: motif:5
  label: violent child death followed by oracle-commanded annual sacrifices
  taxonomy_refs:
  - sacrifice
  basis: Medea’s children are said to have been violently and illegally killed; after
    Corinthian babies are destroyed, an oracle commands yearly sacrifices in their
    honour.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage does not specify the sacrificial procedure or identify the
    oracle by name.
- id: motif:6
  label: frightful female-shaped Terror image set up after child deaths
  taxonomy_refs: []
  basis: A figure of Terror, like a woman frightful to look upon, is set up along
    with the rites for Medea’s children.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage describes the image but does not explain its ritual use beyond
    its installation.
- id: motif:7
  label: eponymous naming of a people by a fleeing mythic woman
  taxonomy_refs: []
  basis: Medea flees to Aria and is said to have caused its inhabitants to be named
    Medes after her.
  evidence_refs:
  - ev:12
  confidence: high
