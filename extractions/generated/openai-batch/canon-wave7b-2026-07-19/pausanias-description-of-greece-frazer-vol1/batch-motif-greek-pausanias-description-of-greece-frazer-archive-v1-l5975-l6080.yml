canonical_text:
  quote: ''
  summary: The passage describes sanctuaries, statues, cult images, and ritual practices
    at Sicyon, including Apollo Lycius and a wolf-killing oracle, Heracles receiving
    offerings both as hero and god, an Asclepius sanctuary with sleep and dream imagery
    and a serpent-form transfer story from Epidaurus, and an Aphrodite sanctuary with
    restricted access and prescribed offerings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Zeus Meilichius is described as pyramid-like, and Artemis Patroa as pillar-like;
    both are called very inartistic works.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Apollo Lycius's ruined sanctuary, wolves had preyed on flocks, and the
    god gave an oracle naming a place where a dry log lay and directing that its bark
    be mixed with meat for the beasts.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After tasting the bark-and-meat mixture, the wolves died; the log remained
    in the sanctuary in Pausanias's time, though local guides did not know the tree
    species.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Heracles enclosure stands an old wooden figure, and a story says Phaestus
    rejected offerings to Heracles as a hero and insisted on sacrifice to him as a
    god.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the Heracles festival, the Sicyonians slay a lamb, burn the thighs on the
    altar, eat some meat as from a victim given to a god, and offer the rest as to
    a hero.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Asclepius enclosure includes a figure of Sleep, a priest-only room of
    Carnean Apollo, a huge bone of a sea-monster, an image of the Dream-god and Sleep
    lulling a lion, and images of Pan and Artemis.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The image of Asclepius is a beardless gold-and-ivory figure holding a staff
    in one hand and a cultivated pine cone in the other.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Sicyonians say Asclepius was carried to them from Epidaurus on a carriage
    drawn by two mules, in the likeness of a serpent, by Nicagora of Sicyon.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A small figure hanging from the roof shows Aristodama on a serpent; she is
    identified as the mother of Aratus, whom the Sicyonians hold to be a son of Asclepius.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Only a female verger and an annual virgin officeholder called the Bath-bearer
    may enter Aphrodite's sanctuary; others view the goddess and pray from the entrance.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: Aphrodite's seated gold-and-ivory image wears a polos and holds a poppy and
    an apple.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Offerings to Aphrodite exclude pigs; thighs are offered, other parts are burned
