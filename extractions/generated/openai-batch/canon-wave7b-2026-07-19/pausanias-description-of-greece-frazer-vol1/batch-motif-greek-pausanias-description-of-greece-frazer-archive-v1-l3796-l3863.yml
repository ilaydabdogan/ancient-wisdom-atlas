canonical_text:
  quote: ''
  summary: 'The passage describes Marathon as a memorial and legendary landscape:
    battlefield graves and a trophy, nightly sounds of battle, worship of heroic dead
    and local figures, the rustic hero Echetlaeus, the spring named for Macaria after
    her voluntary death, a marshy lake linked to Persian losses, and the Hill and
    Cave of Pan with goat-shaped rocks.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A foreign force landed in Attica, was defeated in battle, and lost some vessels
    while putting off from land.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Marathon plain contains a grave of Athenians with name slabs by tribe,
    another grave for Boeotian Plataeans and slaves, and a separate monument to Miltiades.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Marathon, horses neighing and men fighting are said to be heard every night;
    deliberate attempts to behold the vision bring no good, while accidental spectators
    do not anger the spirits.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Marathonians worship those who died in the fighting as heroes, and also
    worship Marathon and Heracles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A rustic-looking man was said to have appeared in the battle, killed many
    foreigners with an implement associated with the plough-tail, and disappeared
    after the engagement.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After Athenian inquiry at an oracle, the god ordered the Athenians to honor
    Echetlaeus as a hero.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: A white marble trophy was erected, and Pausanias reports finding no Persian
    grave despite an Athenian claim that the Persians were buried.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The spring called Macaria at Marathon is linked to a story in which the children
    of Heracles came to Athens as suppliants.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: An oracle said one child of Heracles had to die voluntarily for Athenian victory;
    Macaria killed herself and gave victory and her name to the spring.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A mostly marshy lake at Marathon caused fleeing foreigners to fall in because
    they did not know the roads; above it were stone stables of Artaphernes' horses
    and tent marks on rocks.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: A river flows from the lake; near the lake its water suits cattle, but near
    its mouth it is salt and contains sea fish.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: Beyond the plain are the Hill of Pan and Cave of Pan; the cave has a narrow
    entrance, inner chambers and baths, and rocks called Pan's herd of goats because
    they resemble goats.
  category: setting
  evidence_refs:
  - ev:9
