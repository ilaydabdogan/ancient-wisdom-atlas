  summary: The passage summarizes the regions and major sites covered in the first
    two books of Pausanias, explains his route-based method of description, notes
    that he selects only things worth recording, and introduces Greek religious patterns
    such as sacred topography, anthropomorphic personification of natural forces,
    and ancestor or hero worship through offerings at graves.
