canonical_text:
  quote: ''
  summary: The passage recounts Aratus's restoration of exiles, military and political
    actions for the Achaean League, Cleomenes's attempt to alter Spartan kingship
    and constitution, his defeat and death, and a later chain of poisonings involving
    Philip, Demetrius, and Perseus, framed by a citation of Hesiod about mischief
    returning upon the plotter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aratus restored houses and other possessions to exiles and compensated the
    buyers from his own money.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aratus induced the Sicyonians to join the Achaean League, was elected general
    by the Achaeans, and led them against enemy territory.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Aratus attacked Corinth suddenly, defeated the Macedonian garrison, killed
    its commander Persaeus, and liberated Corinth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aratus obtained Peiraeus, Munychia, Salamis, and Sunium by bribing Diogenes,
    the commander of the garrisons, and contributed part of the payment himself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cleomenes succeeded to the Spartan kingship, was compared to Pausanias for
    dissatisfaction with the established constitution, poisoned Eurydamidas, raised
    Epicleidas to the throne, destroyed the senate's power, and appointed a nominal
    Council of Fathers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Sellasia the Achaeans and Antigonus defeated Cleomenes; the people of Sellasia
    were sold into slavery, Lacedaemon was captured, and the ancestral constitution
    was restored to the Lacedaemonians.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Cleomenes fled to Egypt, was honoured by Ptolemy, was imprisoned, escaped,
    incited disorder in Alexandria, and, when captured, died by his own hand.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Philip secretly killed Aratus with poison; Aratus was carried from Aegium
    to Sicyon, buried there, and a hero-shrine of Aratus still stood in the city.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Philip also killed the Athenian orators Eurycleides and Micon by poison; later
    Philip's son Demetrius was poisoned by Perseus, and Philip died from grief at
    the murder.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The narrator cites Hesiod's words that one who plots mischief against a neighbour
    directs it first against himself.
  category: speech
  evidence_refs:
  - ev:9
