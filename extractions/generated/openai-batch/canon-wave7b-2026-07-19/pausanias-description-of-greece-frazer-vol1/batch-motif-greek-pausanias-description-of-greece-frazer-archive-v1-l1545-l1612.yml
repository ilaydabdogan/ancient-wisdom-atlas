  summary: 'The passage recounts episodes in the career of Lysimachus: peace with
    Dromichaetes after a captivity episode, dynastic marriages, campaigns in Asia
    and against Pyrrhus, destruction and foundation of cities, a contested report
    of Epeirot tomb desecration, and shifting relations with Macedonian rulers including
    Demetrius and Pyrrhus.'
