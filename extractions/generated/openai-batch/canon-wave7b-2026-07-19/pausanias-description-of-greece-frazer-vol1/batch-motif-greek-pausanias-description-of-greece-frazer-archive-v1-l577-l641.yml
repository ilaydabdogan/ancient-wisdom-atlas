canonical_text:
  quote: Other surnames are derived from the names of animals.
  summary: The passage comments on Greek divine epithets in Pausanias, grouping them
    by cult place, animal names, sacred plants, modes of divine manifestation, supplanting
    of one figure by another, and details of legend, temple, or image type.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Pausanias is said to give no surnames for Cronus, Hephaestus, Leto, Pluto,
    or the Graces.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The number of epithets attached to a deity is presented as a test of the power
    of that deity's cult to appeal to religious instinct.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Many epithets are said to refer to the city or place where a cult was established;
    Artemis and Poseidon are given as examples.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some surnames are said to derive from animal names; the passage states that
    in many cases the deity was originally an animal or manifested in animal form,
    while in other cases the animal epithet refers to a legend.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The animal-name examples are Apollo as Wolf-god and Locust-god, Athena as
    Horse-goddess, Zeus as Cuckoo-god, and Artemis as Goat-goddess.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Some surnames are taken from sacred plants, with Demeter Grass and Dionysus
    Ivy given as examples.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Many epithets are said to refer to a mode in which divine power manifests
