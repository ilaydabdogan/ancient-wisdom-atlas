canonical_text:
  quote: ''
  summary: 'The passage recounts Eleusinian and Athenian local legends: an old woman
    sits by a well after her daughter’s rape and is brought into Metaneira’s household;
    Theseus helps recover and bury the Argive dead after Creon refuses burial; Alope
    is said to have borne Hippothoön by Poseidon and been killed by her father Cercyon;
    Cercyon forces strangers to wrestle and kills them until Theseus defeats him and
    establishes wrestling as an art.'
  language: English
  quote_policy: summarized
