canonical_text:
  quote: ''
  summary: The passage recounts a Spartan royal succession leading to a disputed claim
    between Areus and Cleonymus, Cleonymus' appeal to Pyrrhus, Spartan defeats and
    preparations against invasion, Pyrrhus' near capture of Sparta, and his later
    death in street fighting at Argos. His death is reported as caused by a tile thrown
    by a woman, while the Argives say Demeter in female likeness killed him. A sanctuary
    of Demeter and Pyrrhus' burial are placed at the death-site. Pausanias then compares
    this end with other reported divine or oracular deaths among the Aeacidae, while
    noting a different account by Hieronymus the Cardian.
  language: English
  quote_policy: summarized
