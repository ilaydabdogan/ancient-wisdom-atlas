canonical_text:
  quote: ''
  summary: The passage describes routes, coastal headlands, islands, sanctuaries,
    cult titles, ritual customs, images, contests, wells, and local legends around
    Troezen, Hermion, Scyllaeum, Buporthmus, and Hermion. It includes the renaming
    of a rock after Theseus, the death of the daughter of Nisus after Minos rejects
    her, mystic ritual to Demeter within stone circuits, sacrifice to Aphrodite before
    marriage or remarriage, annual contests for Dionysus, an altar-only sanctuary
    of Hestia, Apollo's local titles, and an inexhaustible old well.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A road from Troezen to Hermion passes a rock formerly called the altar of
    Zeus Sthenius and later called the Rock of Theseus after Theseus took up tokens
    there.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The route reaches a temple of Apollo Platanistius and places with sanctuaries
    of Demeter and Core, including a sanctuary of Demeter Thermasia on the Hermionis
    border.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Scyllaeum is named after the daughter of Nisus; after her treachery Minos
    refused to marry her, ordered Cretans to throw her from the ship, she drowned,
    and sea birds tore the corpse, with no grave shown.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sailing route from Scyllaeum to the city passes named headlands, islands,
    harbors, a crescent-shaped beach, and a spit of land extending toward a sanctuary
    of Poseidon.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Buporthmus has sanctuaries of Demeter and Core and of Athena Promachorma;
    the former Hermionian city on the spit still has sanctuaries and temples including
    those of Poseidon and Athena.
  category: setting
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Large circuits of unhewn stones are used for mystic ritual to Demeter.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Hermion, Aphrodite Pontia and Limenia has a temple and a large white-marble
    image; maidens and widows about to remarry sacrifice to Aphrodite before weddings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Dionysus of the Black Goatskin is honored each year with musical competition
    and prizes for swimming-races and boat-races.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The sanctuary of Hestia contains no image, only an altar, and sacrifices are
    made to Hestia upon it.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Apollo has three temples and images in Hermion; one is called Pythaeus, and
