  quote: ''
  summary: The passage describes a route through Thyreatis, a fertile coastal tract,
    the site of a battle between selected Argive and Lacedaemonian warriors with common
    graves, later political control of the land, villages including one with a sanctuary
    of Polemocrates, and the surrounding sacred and geographic markers of Mount Parnon,
    Hermes figures, and the river Tanaus.
  language: English
  quote_policy: summarized
