candidate_motifs:
- id: motif:1
  label: Divine child exposed and killed by animals
  taxonomy_refs:
  - divine_parent_child
  - sacred_birth
  basis: Psamathe bears a son to Apollo, exposes him in fear of her father, and the
    child is destroyed by Crotopus’s sheepdogs.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not name the child or describe rescue, survival, or later
    return.
- id: motif:2
  label: Divine punishment through child-snatching and plague
  taxonomy_refs:
  - divine_judgment
  basis: Apollo sends Vengeance to punish the Argives by snatching children, and a
    plague follows after Coroebus slays Vengeance.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage reports the sequence as local story and does not explain the
    plague beyond its status as a second punishment.
- id: motif:3
  label: Hero slays a punitive personification and incurs divine consequence
  taxonomy_refs:
  - culture_hero
  - divine_judgment
  basis: Coroebus kills Vengeance to please the Argives, but the act leads to plague
    and requires him to seek Apollo’s punishment at Delphi.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage does not explicitly call Coroebus a hero; the role is inferred
    from his grave commemoration and action within the story.
- id: motif:4
  label: Oracular foundation by fallen sacred object
  taxonomy_refs: []
  basis: The Pythia orders Coroebus to carry a tripod and build a temple of Apollo
    and dwell wherever it falls; the tripod falls at Mount Gerania.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: No supplied taxonomy reference directly matches this foundation pattern.
- id: motif:5
  label: Purification after kin-slaying
  taxonomy_refs: []
  basis: Polyidus is said to purify Alcathous after Alcathous kills his son Callipolis.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage begins mid-context and gives no details of the purification
    ritual.
- id: motif:6
  label: Nakedness as athletic advantage and innovation
  taxonomy_refs:
  - initiation
  basis: Orsippus wins a foot-race naked while others wear girdles; Pausanias interprets
    this as intentional because a naked man can run more easily.
  evidence_refs:
  - ev:5
  confidence: low
  cautions: The supplied taxonomy only loosely fits; the passage treats the episode
    as athletic history rather than formal initiation.
- id: motif:7
  label: Foreign-arriving king with divine parentage
  taxonomy_refs:
  - divine_parent_child
  basis: Lelex is said to arrive from Egypt, become king, and be the son of Poseidon
    and Libya.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage records genealogy and arrival but does not elaborate a royal-legitimation
    argument.
- id: motif:8
  label: Annual sacrifice and festival at a named sanctuary
  taxonomy_refs:
  - sacrifice
  basis: At Melampus’s sanctuary, people sacrifice and hold a festival every year.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage adds that Melampus does not divine there, but gives no details
    of the festival or sacrificial rite.
- id: motif:9
  label: Grief-driven departure after family catastrophe
  taxonomy_refs:
  - departure
  basis: Autonoé leaves Thebes for Erenea because of grief at Actaeon’s death and
    the misfortune of her father’s house.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage references Actaeon’s death only briefly and does not narrate
    the death itself.
