canonical_text:
  quote: ''
  summary: Pausanias describes Megarian sanctuaries, images, graves, and local legends.
    The passage includes the story of Psamathe’s son by Apollo, his exposure and death,
    Apollo’s punitive Vengeance, Coroebus’s slaying of Vengeance, a plague, and an
    oracular foundation marked by a fallen tripod. It also records cult sites and
    tombs connected with Orsippus, Demeter Malophorus, Lelex, Artemis Saviour, Aegialeus,
    Melampus, Autonoe, and others.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Polyidus is said to have purified Alcathous after Alcathous killed his son
    Callipolis, and Polyidus also built a sanctuary of Dionysus and dedicated a wooden
    image covered except for its face.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists cult images and works associated with Dionysus, Aphrodite
    Praxis, Persuasion, Consoler, Love, Desire, Yearning, Fortune, Muses, and Zeus,
    with several attributed to Praxiteles, Scopas, or Lysippus.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Psamathe, daughter of Crotopus, bore a son to Apollo and exposed the child
    because she feared her father.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The exposed child was found and destroyed by sheepdogs belonging to Crotopus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Apollo sent Vengeance against the Argives, and Vengeance snatched children
    from their mothers until Coroebus slew her.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: After Coroebus slew Vengeance, a plague came as a second punishment, and Coroebus
    voluntarily went to Delphi to submit to Apollo’s punishment.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Pythia did not allow Coroebus to return to Argos, but ordered him to carry
    a tripod from the sanctuary and to build a temple of Apollo and dwell wherever
    it fell from his hands.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The tripod slipped and fell at Mount Gerania; Coroebus dwelt in a village
    called Little Tripods, and his Megarian grave bore verses and an image of him
    slaying Vengeance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Orsippus won the Olympic foot-race while running naked, unlike competitors
    who wore girdles, and Pausanias states his opinion that Orsippus intentionally
    let the girdle slip.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Near Megara are sanctuaries and images of Apollo Prostaterius, Artemis, Leto,
    Apollo Carinus in the form of a small pyramid-shaped stone, and the Eileithyiae.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Nisaea there is a sanctuary of Demeter Malophorus, with one explanation
    of the surname connecting it with the first people who reared sheep in the land.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Below the citadel near the sea is the tomb of Lelex, who is said to have arrived
    from Egypt, become king, and been the son of Poseidon and Libya.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage records the island of Minoa associated with the Cretan fleet,
    a rock filled with arrows shot by Persians, an image of Artemis Saviour, and the
    hero-shrine of Aegialeus.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: At Aegosthena there is a sanctuary of Melampus with annual sacrifice and festival,
    but the passage says he divines neither by dreams nor otherwise there.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Autonoé, daughter of Cadmus, left Thebes for Erenea because of grief at Actaeon’s
    death and the misfortune of her father’s house; her tomb is in the village.
  category: sequence
  evidence_refs:
  - ev:9
