canonical_text:
  quote: ''
  summary: 'The passage describes sacred sites and legends of Phlius: a cypress-grove
    sanctuary of Ganymeda/Hebe with asylum customs; local temples and images; a gold-covered
    bronze she-goat honored to avert damage associated with the Goat constellation;
    the House of Divination of Amphiaraus; an Omphalos called the center of the Peloponnesus;
    sanctuaries of Dionysus, Apollo, and Isis; a story of Heracles killing the cup-bearer
    Cyathus; and Demeter mysteries said to imitate Eleusinian rites, with a disputed
    foundation legend involving Dysaules.'
  language: English
  quote_policy: summarized
