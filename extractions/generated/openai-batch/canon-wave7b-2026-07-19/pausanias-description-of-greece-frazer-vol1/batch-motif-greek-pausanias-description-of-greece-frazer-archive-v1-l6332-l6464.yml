candidate_motifs:
- id: motif:1
  label: Sanctuary asylum with votive fetters
  taxonomy_refs: []
  basis: Suppliants at the sanctuary receive forgiveness, and freed prisoners dedicate
    their fetters on grove trees.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage describes the custom but gives no extended mythic explanation
    beyond local sacred practice.
- id: motif:2
  label: Absent or restricted cult image
  taxonomy_refs: []
  basis: The Ganymeda/Hebe sanctuary has no image, while the Isis image may be seen
    only by priests.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: medium
  cautions: These are separate cult sites; the passage does not state that the same
    rationale applies to both.
- id: motif:3
  label: Apotropaic honoring of an animal effigy against celestial crop damage
  taxonomy_refs:
  - sacred_exchange
  basis: The Phliasians honor and adorn a bronze she-goat with gold so that the Goat
    constellation's rising will not harm their vines.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The taxonomy link to sacred exchange is approximate; the literal action
    is local propitiatory honoring of an image.
- id: motif:4
  label: Incubation leading to divination
  taxonomy_refs:
  - wisdom
  basis: Amphiaraus sleeps in the House of Divination and afterward first begins to
    divine.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not elaborate the dream or mechanism of divination.
- id: motif:5
  label: Omphalos as regional center
  taxonomy_refs:
  - world_center
  basis: The Omphalos or Navel is identified by the Phliasians as the center of the
    Peloponnesus.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The claim is explicitly qualified by Pausanias with 'if they speak the
    truth about it.'
- id: motif:6
  label: Heroic killing memorialized by chapel and statues
  taxonomy_refs: []
  basis: Heracles kills Cyathus with a blow after being displeased with a drink, and
    a chapel with statues keeps the deed in memory.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage frames the chapel as memorial rather than explaining a ritual
    cult around Cyathus.
- id: motif:7
  label: Mystery initiation modeled on Eleusis
  taxonomy_refs:
  - initiation
  basis: The Phliasians celebrate Demeter mysteries every fourth year with an initiating
    priest and admit the performance copies Eleusinian rites.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not describe the inner content of the mysteries.
- id: motif:8
  label: Disputed foundation of rites by an expelled outsider
  taxonomy_refs: []
  basis: The Phliasians say Dysaules came from Eleusis after expulsion and established
    the mysteries, but Pausanias rejects or doubts key details.
  evidence_refs:
  - ev:10
  confidence: low
  cautions: The foundation story is presented as a local claim and is explicitly challenged
    by the narrator.
comparison_claims:
- id: claim:1
  claim: The local goddess Ganymeda is identified by later authorities with Hebe known
    from Homeric and hymnic traditions.
  claim_level: same_motif
  target: Homeric and hymnic Hebe traditions
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage reports an identification by later authorities, while also
    preserving a distinct earliest local name, Ganymeda.
- id: claim:2
  claim: The Phliasian Demeter mysteries function as a local ritual performance modeled
    on the Eleusinian rites.
  claim_level: same_function
  target: Eleusinian Demeter mysteries
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison rests on Pausanias's summary and the Phliasians' admission;
    the passage gives few ritual details.
- id: claim:3
  claim: The Phliasian foundation legend asserts historical contact with Eleusis through
    Dysaules, but Pausanias contests the reported circumstances and Dysaules' Eleusinian
    importance.
  claim_level: historical_contact
  target: Eleusis and Phlius mystery traditions
  evidence_refs:
  - ev:10
  counter_evidence_refs:
  - ev:10
  - ev:11
  confidence: low
  limitations: The same passage reports the local claim and Pausanias's objections,
    including appeal to the war's treaty outcome and Homeric silence about Dysaules.
