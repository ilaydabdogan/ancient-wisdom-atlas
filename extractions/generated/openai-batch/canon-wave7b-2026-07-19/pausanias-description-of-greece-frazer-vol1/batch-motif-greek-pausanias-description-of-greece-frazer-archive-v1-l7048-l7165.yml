literal_observations:
- id: obs:1
  text: Argive men were killed in fighting or after fleeing to the grove of Argus,
    where survivors were burned after an agreement to leave sanctuary was broken.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Telesilla placed slaves and those too young or too old to bear arms on the
    wall, gathered weapons from sanctuaries and houses, armed women of vigorous age,
    and posted them at the expected attack point.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Argive women stood their ground against the Lacedaemonian battle-cry and
    fought, after which the Lacedaemonians withdrew.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: An oracle is quoted as saying that a female would conquer in battle, drive
    away the male, and win glory in Argos.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A sanctuary of Artemis Persuasion is described as an offering of Hypermnestra
    after she won a trial brought by her father because of Lynceus.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says Tyrsenus invented the trumpet and Hegeleos taught the Dorians
    with Temenus to play it, giving Athena the surname Trumpet.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Epimenides was reportedly captured by the Lacedaemonians, killed for not prophesying
    good fortune to them, and buried by the Argives.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A white marble building in the Argive market-place is explained as Pyrrhus's
    monument at the place of his pyre, with reliefs of elephants and other war equipment;
    his bones are said to lie in Demeter's sanctuary and his bronze shield hangs at
    its entrance.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: A mound of earth in Argos is said to contain the head of the Gorgon Medusa.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: In one rationalized account, Medusa ruled near Lake Tritonis, hunted, led
    Libyans in battle, was assassinated by night while opposed to Perseus, and Perseus
    cut off her head to show the Greeks.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A variant attributed to Procles explains Medusa as a wild woman from the Libyan
    desert who harried neighbors near Lake Tritonis until Perseus killed her, with
    Athena supposed to have helped him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Gorgophone, daughter of Perseus, is said to have been the first woman to marry
