canonical_text:
  quote: ''
  summary: 'The passage describes tombs, sanctuaries, altars, and local traditions
    along an Attic route: Acestium’s torch-bearer lineage; Phytalus’s welcome of Demeter
    and the goddess’s gift of the fig tree; hair offered to the river Cephisus with
    a Homeric parallel; Theseus’s purification at an altar of Zeus Meilichius; Cyamites
    and beans in relation to Eleusinian or Orphic knowledge; Harpalus’s tomb for Pythonice;
    and an Apollo sanctuary connected with Cephalus’s descendants, an oracle, a snake
    sign, sacrifice, and Athenian citizenship.'
  language: English
  quote_policy: summarized
