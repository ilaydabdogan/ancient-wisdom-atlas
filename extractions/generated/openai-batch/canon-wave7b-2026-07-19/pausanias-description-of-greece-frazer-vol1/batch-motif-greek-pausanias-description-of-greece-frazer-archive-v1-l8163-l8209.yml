canonical_text:
  quote: ''
  summary: 'Pausanias describes cult sites and local traditions at Troezen: a temple
    of Artemis Saviour linked to Theseus''s return from Crete after defeating Asterion
    and escaping the Maze; altars to gods beneath the earth associated with Semele
    being brought from Hell by Dionysus and Heracles dragging up the Hound of Hell;
    the tomb and judgment seats of Pittheus; a sanctuary and altar of the Muses associated
    with Ardalus, flute invention, rhetoric, and sacrifices to the Muses and Sleep;
    and a temple of Artemis Lycea linked to Hippolytus and uncertain explanations
    of the goddess''s surname.'
  language: English
  quote_policy: summarized
