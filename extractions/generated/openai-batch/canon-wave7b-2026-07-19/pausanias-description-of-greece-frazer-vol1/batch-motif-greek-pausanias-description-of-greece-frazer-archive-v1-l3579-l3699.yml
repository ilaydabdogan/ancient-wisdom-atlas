canonical_text:
  quote: ''
  summary: The passage describes Athenian burial memorials and notable graves, Lycurgus's
    civic provisions and buildings, cult sites near the Academy, an aetiological story
    for the altar of Anteros, the Prometheus torch race, a sacred olive tree, Plato's
    monument and Socrates' dream of a swan, a reported Apollo-caused transformation
    of a musician named Swan into a bird, Timon's tower, the Hill of Horses associated
    with Oedipus, and the burning of Poseidon's grove and temple by Antigonus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nicias is said not to have had his name inscribed on a slab because he voluntarily
    submitted to surrender and was condemned as a voluntary prisoner and unworthy
    soldier.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several slabs and graves record Athenians who fought in multiple campaigns,
    including conflicts in Thrace, Megara, Sicily, the Hellespont, Chaeronea, Amphipolis,
    Delium, Thessaly, Cyprus, and Roman-Carthaginian warfare.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The roadside burials include military leaders, father-son pairs, philosophers,
    a painter, tyrannicides, and orators.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lycurgus is credited with increasing state funds, furnishing golden Victory
    figures and ornaments, providing arms and ships, completing a theatre, and building
    dockyards and a gymnasium; gold and silver objects were later plundered by Lachares,
    while buildings remained.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before the entrance to the Academy stood an altar to Love, said by inscription
    to have been first dedicated by Charmus.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: An altar of Anteros is explained by a story in which Meles spurned Timagoras,
    demanded that he leap from the rock, Timagoras died, and Meles then killed himself
    from remorse; resident aliens thereafter worshipped Anteros as the avenging spirit
    of Timagoras.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At an altar to Prometheus in the Academy, runners carried burning torches
    to the city, and victory depended on keeping the torch alight.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Academy also had altars to the Muses, Hermes, Athena, and Heracles, and
    an olive tree accounted the second that appeared.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Near the Academy stood Plato's monument; heaven was said to have foretold
    that he would be the prince of philosophers through Socrates' dream of a swan
    flying into his bosom before Plato became his pupil.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage explains the swan's musical reputation by reporting that a musician
    named Swan became king of the Ligyes and after death was changed by Apollo into
    the bird; the narrator says he accepts the musician-king but not a bird growing
    out of a man.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: A tower of Timon was shown in the area, linked with Timon's view that happiness
    required shunning other people.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: A place called the Hill of Horses was said to be the first point in Attica
    reached by Oedipus, though the passage states that this account differs from Homer;
    nearby were altars to Poseidon Horse God and Athena Horse Goddess and a chapel
    to Peirithous, Theseus, Oedipus, and Adrastus.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: The grove and temple of Poseidon were burned by Antigonus when he invaded
    Attica.
  category: action
  evidence_refs:
  - ev:10
