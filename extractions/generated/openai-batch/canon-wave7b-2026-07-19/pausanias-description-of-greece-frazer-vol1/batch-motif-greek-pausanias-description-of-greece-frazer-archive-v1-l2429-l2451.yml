canonical_text:
  quote: ''
  summary: The passage describes the road called Tripods, its shrines and bronze tripods,
    and artworks including a Satyr associated with Praxiteles. It then recounts a
    story in which Phryne uses a slave's false report of a studio fire to make Praxiteles
    reveal that his Satyr and Love are the works he values most, after which she chooses
    the statue of Love. It also notes a Satyr in the nearby temple of Dionysus and
    names Thymilus as maker of the Love standing with it and the Dionysus.
  language: English
