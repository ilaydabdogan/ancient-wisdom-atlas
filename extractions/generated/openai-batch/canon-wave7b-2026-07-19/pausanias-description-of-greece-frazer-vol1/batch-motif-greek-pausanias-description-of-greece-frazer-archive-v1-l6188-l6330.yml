  summary: The passage describes cult practice at Titane and nearby places, including
    sacrifice, the honoring of Coronis, cult images, sacred serpents, an Athena image
    said to have been struck by lightning, and secret rites to the winds. It then
    recounts Phliasian local traditions about Aras, Asopus, Aoris, Araethyrea, Phlias,
    Dorian settlement, Hippasus, and the ancestry of Pythagoras.
  language: English
