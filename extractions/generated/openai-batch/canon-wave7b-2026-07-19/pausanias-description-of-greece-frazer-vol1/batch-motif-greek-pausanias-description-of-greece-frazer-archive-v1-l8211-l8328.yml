  summary: 'The passage describes Troezenian sacred sites, cult objects, local legends,
    and rituals: Orestes'' purification from matricide, springs and trees linked to
    Pegasus and Heracles, an unfailing river during drought, the cult of Hippolytus
    and maiden hair dedications, variant traditions about Hippolytus and Damia and
    Auxesia, and Phaedra''s gaze upon Hippolytus from the sanctuary of Aphrodite Spy.'
