canonical_text:
  quote: ''
  summary: Pausanias describes the Oropian sanctuary of Amphiaraus, including a legend
    of his disappearance into the earth with his chariot, the establishment of his
    divine cult, the sanctuary altar, the Spring of Amphiaraus, post-cure offerings,
    and dream-oracle incubation rites. The passage then turns to islands near Attica
    and traditions concerning Helen, Salamis, Ajax, Eurysaces, Telamon, the Ajax flower,
    the armor of Ajax, and reports about Ajax's tomb and great bodily size.
  language: English
  quote_policy: summarized
