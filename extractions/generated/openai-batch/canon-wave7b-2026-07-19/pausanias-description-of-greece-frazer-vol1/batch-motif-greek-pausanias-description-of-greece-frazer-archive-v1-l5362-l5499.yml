candidate_motifs:
- id: motif:1
  label: Failed immortalization of children in a goddess's sanctuary
  taxonomy_refs: []
  basis: Medea conceals her children in Hera's sanctuary believing they will become
    immortal, but later learns her hope was vain.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage reports only this brief version and does not explain the ritual
    mechanism or the children's later fate.
- id: motif:2
  label: Divine helper equips hero with a bridled extraordinary horse
  taxonomy_refs: []
  basis: Athena Chalinitis gives Bellerophontes Pegasus after breaking in and bridling
    him.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not narrate Bellerophontes's subsequent exploits with
    Pegasus.
- id: motif:3
  label: Genealogical royal legitimacy through heroic descent
  taxonomy_refs:
  - royal_legitimacy
  basis: The Corinthian succession is framed through named descent lines, including
    Aletes's descent from Heracles and the Bacchidae's rule after Bacchis.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage presents genealogy and succession but does not explicitly
    argue a theory of legitimacy.
- id: motif:4
  label: Sacred mountain transferred between deities
  taxonomy_refs: []
  basis: Acrocorinthus is a mountain peak assigned to Helius by Briareos and then
    handed over by Helius to Aphrodite.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: Although the site is a sacred height, the passage does not describe it
    as a cosmic mountain.
- id: motif:5
  label: Restricted and hidden cult access
  taxonomy_refs: []
  basis: The sanctuary of Necessity and Force is not customarily entered, and images
    of the Fates and of Demeter and the Maid are not exposed to view.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage lists the restrictions without explaining their ritual rationale.
- id: motif:6
  label: Sacred exchange of water for information
  taxonomy_refs:
  - sacred_exchange
  basis: Sisyphus refuses to inform Asopus about Aegina until Asopus grants him a
    spring on Acrocorinthus.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage breaks off before any full account of the consequence for
    Sisyphus.
- id: motif:7
  label: Divine ravishing of a sought daughter
  taxonomy_refs:
  - stolen_beloved
  basis: Asopus seeks information about Aegina, his daughter, and Sisyphus reveals
    that Zeus had ravished her.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage uses the term 'ravished' but does not narrate the event itself
    or Aegina's perspective.
