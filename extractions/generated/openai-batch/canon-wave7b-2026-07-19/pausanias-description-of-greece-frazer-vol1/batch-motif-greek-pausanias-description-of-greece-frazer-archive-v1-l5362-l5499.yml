  quote: ''
  summary: The passage reports variant traditions about Jason, Medea, their children,
    Corinthian succession, Bellerophontes and Pegasus, several Corinthian sanctuaries
    and cult images, the sacred topography of Acrocorinthus, and the legend that Sisyphus
    obtained a spring from Asopus in exchange for revealing what Zeus had done to
    Aegina.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cited epic tradition says Jason moved from Iolcus to Corcyra after Pelias's
    death, and that his elder child Mermerus was killed by a lioness while hunting.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Another genealogical poet is said to name Jason's children by Medea as Medeiis
    and Eriopis, without further information.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Helius is said to have given land to Aloeus and Aeetes; Aeetes later entrusted
    his land to Bunus when departing for Colchis.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Corinthus died childless, the Corinthians sent for Medea from Iolcus
    and gave her the kingdom; through her Jason was king in Corinth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Medea carried each of her children to Hera's sanctuary and concealed them,
    believing this would make them immortal; she later learned the hope was vain,
    was detected by Jason, was refused pardon, and departed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Athena Chalinitis is said to have helped Bellerophontes by delivering Pegasus
    to him after breaking in and bridling the horse.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage gives a succession of Corinthian rulers, including Dorian conquest
    under Aletes, the reign of the Bacchidae, and the later tyranny of Cypselus.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Near the Corinthian theatre are sanctuaries and images of Athena Chalinitis,
    Heracles, Zeus Capitolinus, Zeus, Asclepius, and Health, and a spring called Lerna
    by the gymnasium.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Acrocorinthus is described as a mountain peak above the city, assigned to
    Helius by Briareos and handed over by Helius to Aphrodite.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the ascent of Acrocorinthus are precincts of Isis and Serapis, altars of
    Helius, and a sanctuary of Necessity and Force into which it is not customary
    to enter.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The images in the temples of the Fates and of Demeter and the Maid are said
    not to be exposed to view.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: On the summit of Acrocorinthus is a temple of Aphrodite with images of armed
    Aphrodite, Helius, and Eros with a bow.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: A spring behind Aphrodite's temple is said to have been given by Asopus to
    Sisyphus, who then informed Asopus that Zeus had ravished Aegina.
  category: action
  evidence_refs:
  - ev:8
