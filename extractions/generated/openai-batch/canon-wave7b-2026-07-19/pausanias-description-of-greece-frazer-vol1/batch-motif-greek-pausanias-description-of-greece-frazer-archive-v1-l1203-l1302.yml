canonical_text:
  quote: ''
  summary: The passage moves from Athenian eponymous tribal names to Hadrian’s pious
    benefactions and suppression of rebellion, then explains why Pausanias will recount
    older traditions about Attalus and Ptolemy. It narrates Ptolemy’s disputed parentage,
    his service to Alexander, his role after Alexander’s death in dividing the empire,
    his seizure and burial of Alexander’s corpse in Egypt, Perdiccas’s failed campaign,
    and subsequent wars among Ptolemy, Antigonus, Demetrius, and other successors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says later Athenian tribes were named after Attalus the Mysian,
    Ptolemy the Egyptian, and Emperor Hadrian.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hadrian is described as very religious toward the deity, beneficial to his
    subjects, reluctant to begin war voluntarily, and as having reduced rebellious
    Hebrews beyond Syria.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Hadrian is said to have built some sanctuaries, adorned others with offerings
    and furniture, and given bounties to Greek cities and some foreigners; these acts
    were inscribed in his honor in the Athenian sanctuary common to all the gods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pausanias states that traditions about Attalus and Ptolemy are old and neglected,
    and that he will narrate their deeds and how sovereignty came to their fathers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Macedonians are said to consider Ptolemy the son of Philip son of Amyntas,
    although he was putatively the son of Lagus.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ptolemy is credited with being foremost among Alexander’s companions in helping
    Alexander when he was in danger among the Oxydracae.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After Alexander’s death, Ptolemy resisted those who wanted to confer the whole
    empire on Aridaeus and became chiefly responsible for dividing the nations into
    kingdoms.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ptolemy crossed to Egypt, killed Cleomenes, persuaded the Macedonians carrying
    Alexander’s corpse to hand it over, buried the corpse in Memphis with Macedonian
    rites, and garrisoned Egypt.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Perdiccas took Aridaeus and the boy Alexander as a stated pretext for a campaign,
    while the passage says he really plotted to take Egypt from Ptolemy; after expulsion
    from Egypt he was killed by his bodyguard.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After Perdiccas’s death, Ptolemy rose in power, reduced the Syrians and Phoenicia,
    welcomed the exiled Seleucus, and sought allies against Antigonus.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Antigonus exploited Ptolemy’s absence during the revolt of Cyrene to reduce
    the Syrians and Phoenicians and give them to his son Demetrius.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Demetrius was later overcome by Ptolemy, but he also surprised and killed
    some Egyptians; when Antigonus arrived, Ptolemy returned to Egypt.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: After winter, Demetrius sailed to Cyprus and defeated Menelaus, Ptolemy’s
    satrap, and then Ptolemy himself in a naval action; Ptolemy fled.
  category: sequence
  evidence_refs:
  - ev:11
