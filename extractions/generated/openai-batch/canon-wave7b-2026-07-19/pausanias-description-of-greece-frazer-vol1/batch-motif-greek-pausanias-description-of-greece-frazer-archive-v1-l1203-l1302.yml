candidate_motifs:
- id: motif:1
  label: eponymous civic naming after rulers
  taxonomy_refs:
  - royal_legitimacy
  basis: Athenian tribes are said to be named after Attalus, Ptolemy, and Hadrian,
    making ruler names part of civic organization and honor.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage presents a historical civic practice, not a mythic narrative;
    the link to royal legitimacy is interpretive and should be reviewed.
- id: motif:2
  label: pious ruler as sanctuary benefactor
  taxonomy_refs: []
  basis: Hadrian is praised for religious respect, construction and adornment of sanctuaries,
    gifts to cities and foreigners, and inscriptions of these acts in a sanctuary
    common to all gods.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage is encomiastic and historical; it does not explicitly frame
    the benefactions as a mythic exchange.
- id: motif:3
  label: contested paternity supporting ruler identity
  taxonomy_refs:
  - royal_legitimacy
  basis: Ptolemy is described as putatively Lagus’s son while Macedonians assert that
    he was actually Philip’s son, with a pregnancy story explaining the claim.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage does not state why the paternity claim was made; its legitimating
    function is inferred from royal lineage context.
- id: motif:4
  label: possession and burial of a conqueror’s corpse
  taxonomy_refs:
  - royal_legitimacy
  basis: Ptolemy obtains Alexander’s corpse from its carriers and buries it in Memphis
    with Macedonian rites while consolidating Egypt and preparing for war.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage does not explicitly say the corpse grants legitimacy; the
    motif candidate rests on narrative placement in a succession conflict.
- id: motif:5
  label: partition of an empire after a ruler’s death
  taxonomy_refs:
  - royal_legitimacy
  basis: After Alexander’s death, Ptolemy resists the plan to confer all empire on
    Aridaeus and is said to be chiefly responsible for dividing the nations into kingdoms.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: This is a historical-political pattern rather than a mythic motif in the
    narrow sense.
- id: motif:6
  label: royal heirs used as campaign pretext
  taxonomy_refs:
  - royal_legitimacy
  basis: Perdiccas takes Aridaeus and the boy Alexander to lend color to his campaign,
    while the passage says his real purpose was to take Egypt from Ptolemy.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage gives a political explanation; comparison with broader motifs
    of legitimating heirs would require external evidence not used here.
