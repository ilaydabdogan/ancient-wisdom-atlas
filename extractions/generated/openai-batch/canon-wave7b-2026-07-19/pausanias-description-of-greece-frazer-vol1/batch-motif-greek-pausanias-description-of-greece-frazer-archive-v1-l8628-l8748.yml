canonical_text:
  quote: ''
  summary: 'Pausanias describes sanctuaries and local legends at Hermion and nearby
    places: the Chthonia sanctuary of Demeter, its origin story involving Demeter''s
    reception and Colontas''s punishment, the annual Chthonia procession and cow sacrifice
    performed by old women, restricted cult objects and images, underworld-associated
    places and a chasm linked to Heracles and the Hound of Hell, and nearby mountain
    sanctuaries including the place where Zeus was said to become a cuckoo.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sanctuary of Demeter on Pron is called the most noteworthy object in the
    area, and its foundation is explained by both Hermionian and Argive accounts.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Argive account, Atheras and Mysius gave hospitality to Demeter, while
    Colontas neither received her into his home nor honored her; Colontas's daughter
    Chthonia disapproved of his conduct.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Colontas was said to have been burnt up with his house, while Chthonia was
    brought to Hermion by Demeter and made the sanctuary for the Hermionians.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The goddess is called Chthonia, and the annual summer festival is also called
    Chthonia.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Chthonia procession is headed by priests and annual magistrates, followed
    by men, women, and children dressed in white and wearing wreaths.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The children's wreaths are made of a flower called cosmosandalon, which Pausanias
    compares to an iris and describes as bearing letters of mourning.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: A full-grown untamed cow is led from the herd with ropes, brought to the temple,
    released, and allowed to rush into the sanctuary before the doors are closed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Four old women remain inside the sanctuary and dispatch each cow; whichever
    woman gets the chance cuts the cow's throat with a sickle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Four cows are sacrificed in succession, and all must fall on the same side
    as the first cow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The most revered object of worship in the Chthonia sanctuary was not seen
    by Pausanias or by any man, whether stranger or Hermionian; the old women may
    keep its nature to themselves.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: A temple called that of Clymenus stands opposite the temple of Chthonia, and
    Pausanias interprets Clymenus as a surname of the god who is king in the underworld.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Portico of Echo is said to reverberate a speaker's voice at least three
    times.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: Behind the Chthonia temple are stone-fenced places called those of Clymenus,
    Pluto, and the Acherusian Lake; the place of Clymenus contains a chasm in the
    earth through which Heracles was said to have brought up the Hound of Hell.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: The sanctuary of Eileithyia receives daily sacrifices and incense, contains
    many votive gifts, and has an image that no one may see except perhaps the priestesses.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: A mountain formerly called Thornax was said to have been renamed because Zeus
    was transformed into a cuckoo there; sanctuaries stand on Mount Cuckoo for Zeus
    and on Pron for Hera.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: At the place called Twins there are sanctuaries of Apollo, Poseidon, and Demeter,
    with upright white marble images.
  category: setting
  evidence_refs:
  - ev:9
