- id: obs:1
  text: A Macedonian garrison was set over the Athenians and occupied Munychia, then
    Peiraeus and the Long Walls.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cassander seized Panactum in Attica and Salamis, established Demetrius son
    of Phanostratus as tyrant in Athens, and later induced Lachares to arrange a tyranny.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lachares was described as cruel to people and impious to the gods; he took
    golden shields from the Acropolis and stripped removable ornament from the statue
    of Athena.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lachares escaped to Boeotia after the capture of the fortifications and was
    later murdered at Coronea for the sake of the wealth he was suspected to possess.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Demetrius son of Antigonus overcame the Athenians, brought a garrison into
    the upper city, and fortified the Museum hill opposite the Acropolis.
  category: action
  evidence_refs:
  - ev:3
