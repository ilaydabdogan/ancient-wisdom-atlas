  text: Olympiodorus defeated the Macedonians, pursued them to the Museum, and captured
    the position, delivering Athens from the Macedonians.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Leocritus son of Protarchus was said to be the first to scale the fortification
    and rush into the Museum, and he fell fighting.
  category: action
  evidence_refs:
  - ev:5
