canonical_text:
  quote: ''
  summary: The passage recounts Athenian political struggles under Macedonian influence,
    including tyrannies, the plundering of sacred objects by Lachares, and the liberation
    of the Museum hill by Olympiodorus and Leocritus. It then describes Acropolis
    cult monuments and the Erechtheum, including bloodless offerings to Zeus, altars
    to several gods and heroes, a sea-water cistern and trident mark connected with
    Poseidon’s claim to the land, and Athena’s special sacred image said by legend
    to have fallen from heaven.
  language: English
  quote_policy: summarized
