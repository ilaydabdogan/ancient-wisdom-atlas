canonical_text:
  quote: ''
  summary: The passage describes an earthquake affecting Sicyon and surrounding regions,
    local tombs and burial customs, a dripping spring in a cave, sanctuaries and cult
    images on the citadel and near the marketplace, a nocturnal torch procession of
    secret images to Dionysus, traditions explaining the sanctuary of Persuasion through
    Apollo and Artemis, purification, plague, and child suppliants, and stories of
    dedications including Meleager’s spear and Marsyas’s flutes, though Pausanias
    reports these offerings were no longer extant after a temple fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An earthquake occurred after the loss of power, almost depopulating the city,
    damaging famous sights, and affecting Caria, Lycia, and Rhodes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sicyonians usually buried the dead by covering the body in the ground,
    building a stone basement with pillars above it, adding a temple-like pediment,
    and inscribing only the dead person's name and a farewell.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A spring by the gate is located in a cave, and its water flows down from the
    roof rather than rising from the ground.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The sanctuary of Fortune of the Height and the sanctuary of the Dioscuri have
    wooden images.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the theatre under the citadel there is a statue of a shield-bearing man
    identified as Aratus, son of Cleinias.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The temple of Dionysus contains a gold-and-ivory image of the god and white
    marble Bacchanals said to be sacred to Dionysus and maddened by his inspiration.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Certain secret images are carried one night each year from the Cosmēterium
    to the temple of Dionysus with lighted torches and native hymns.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The secret images named Baccheius and Lysius are associated respectively with
    Androdamas son of Phlias and with Theban Phanes acting under a Pythian command.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The temple of Artemis of the Lake had a fallen roof, and the inhabitants could
    not say whether its image had been removed or destroyed there.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: The sanctuary of Persuasion in the marketplace has no image.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: After Apollo and Artemis killed Pytho, they came to Aegialea for purification,
    were seized by dread at a place later called Fear, turned aside to Carmanor in
    Crete, and the people of Aegialea were struck by plague.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Seers instructed the people to propitiate Apollo and Artemis; seven boys and
    seven maidens were sent as suppliants to the river Sythas, and the deities were
    said to have been persuaded by them.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: 'A present-day ceremony reenacts the story: children go to the Sythas at Apollo’s
    feast, pretend to bring the deities to the sanctuary of Persuasion, and then take
    them back to Apollo’s temple.'
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: Apollo’s temple was said to have been founded by Proetus because his daughters
    recovered from madness there.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:15
  text: Meleager was said to have dedicated in Apollo’s temple the spear with which
    he slew the boar.
  category: object
  evidence_refs:
  - ev:14
- id: obs:16
  text: Marsyas’s flutes were said to have been carried by the river Marsyas to the
    Maeander, reappeared in the Asopus, washed ashore in Sicyonian territory, and
    been given to Apollo by a shepherd.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:17
  text: Pausanias reports that the named offerings were no longer extant because they
    were destroyed by fire when the temple burned.
  category: sequence
  evidence_refs:
  - ev:16
