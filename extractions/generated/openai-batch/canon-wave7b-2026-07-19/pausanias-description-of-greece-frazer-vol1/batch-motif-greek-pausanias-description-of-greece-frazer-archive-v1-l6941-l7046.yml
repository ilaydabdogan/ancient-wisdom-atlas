canonical_text:
  quote: ''
  summary: 'The passage describes monuments and sanctuaries at Argos and explains
    several local traditions: a dedication to Zeus Meilichius after civil bloodshed
    caused by Bryas''s assault on a bride; reliefs and shrines connected with Cleobis
    and Biton, Phoroneus, Palamedes, Chorea, the Theban expedition, Troy dead, Adonis,
    Cephisus, Medusa, Hypermnestra, Perilaus and Othryadas, and Telesilla.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The route passes a boxer statue and trophy before reaching a seated white-marble
    image of Zeus Meilichius made by Polycleitus.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pausanias explains the Zeus Meilichius image through a period of recurring
    war between Lacedaemonians and Argives.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Argives maintained a thousand picked men, commanded by Bryas.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Bryas behaved violently toward common people and seized and ravished a maiden
    who was being escorted to her bridegroom.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: At night the maiden waited until Bryas slept, put out his eyes, and then took
    refuge as a suppliant with the people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The people refused to surrender the maiden to the Thousand; both sides armed
    themselves, the people won, killed their opponents, sought purifications for kindred
    bloodshed, and dedicated the image of Zeus Meilichius.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Cleobis and Biton are shown in relief drawing a carriage and carrying their
    mother to Hera's sanctuary.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Phoroneus has a grave that still receives offerings as to a hero, and Palamedes
    is connected with dice that he invented and dedicated in a temple of Fortune.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: The maenad Chorea is said to have joined Dionysus's expedition against Argos;
    Perseus killed most of the women, and Chorea received a separate burial because
    of high rank.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage lists sanctuaries and statues connected with the Seasons, Polyneices,
    chieftains killed at Thebes, those who took Thebes, Danaus, Argives who died at
    Troy or returning home, Zeus the Saviour, and Adonis.
  category: setting
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: At the sanctuary of Cephisus, the river's water is said to have survived Poseidon
    and to be audible flowing underground.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: A stone head of Medusa is said to be a work of the Cyclopes, and a nearby
