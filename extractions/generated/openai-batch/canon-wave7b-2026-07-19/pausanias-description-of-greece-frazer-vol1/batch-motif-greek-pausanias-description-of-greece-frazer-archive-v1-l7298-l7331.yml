canonical_text:
  quote: ''
  summary: The passage recounts Argive survivors of a shipwreck after Troy who pray
    for divine help, find a cave of Dionysus with an image and storm-sheltering goats,
    use the goats for food and clothing, later take and honor the wooden image, then
    lists nearby sacred and memorial sites and recounts the earth swallowing Amphiaraus,
    his chariot, and Baton. It also mentions a disputed grave or cenotaph of Hyrnetho.
  language: English
  quote_policy: summarized
