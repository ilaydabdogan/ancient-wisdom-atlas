- id: claim:2
  claim: The Iphigenia material is presented as a set of related variant traditions
    across Megarian, Arcadian, Hesiodic, Herodotean, and Taurian accounts.
  claim_level: same_motif
  target: Iphigenia death/deification/sacrifice traditions
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: 'The variants conflict: one says she died, another says she did not
    die but became Hecate, and another concerns sacrifices to a maiden identified
