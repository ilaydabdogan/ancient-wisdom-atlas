  claim_level: same_function
  target: Delian girls’ hair-cutting rite for Hecaerge and Opis
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives a functional ritual analogy but does not provide
    a shared origin.
