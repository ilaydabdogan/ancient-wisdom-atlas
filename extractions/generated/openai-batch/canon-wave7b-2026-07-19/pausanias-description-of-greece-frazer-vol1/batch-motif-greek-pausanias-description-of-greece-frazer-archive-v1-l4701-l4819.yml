- id: ev:2
  type: summary
  locator: lines 4708-4723
  quote_or_summary: Megarian citadel has temples and images of Athena, including Athena
    Victory and Athena Aeantis; Pausanias infers Ajax made the Athena statue after
    succeeding to Alcathous’s throne.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain translation; summarized.
- id: ev:3
  type: summary
  locator: lines 4724-4739
  quote_or_summary: Apollo’s temple was rebuilt in white marble by Hadrian; Apollo
    images called Pythian, Decatephorus, and Archegetes are made of ebony, with comparisons
    to Egyptian wooden images and Aeginetan works; ebony is described as underground
    roots dug by Aethiopians.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain translation; summarized.
- id: ev:4
  type: summary
  locator: lines 4740-4752
  quote_or_summary: Callipolis hears of Ischepolis’s death, runs to the citadel, and
    throws logs from the altar where Alcathous is preparing a sacrifice to Apollo;
    Alcathous judges him impious and kills him with one of the logs.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain translation; summarized.
- id: ev:5
  type: summary
  locator: lines 4753-4763
  quote_or_summary: At Ino’s shrine, fenced with stones and beside olives, Megarians
    say her corpse was cast up on their coast, found and buried by Cleso and Tauropolis,
    first named Leucothea among them, and annually sacrificed to.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain translation; summarized.
- id: ev:6
  type: summary
  locator: lines 4764-4777
  quote_or_summary: Megarians have a shrine of Iphigenia and say she died in Megara;
    Pausanias also cites Arcadian, Hesiodic, and Herodotean accounts, including Iphigenia
    becoming Hecate by Artemis’s will and Tauri sacrificing castaways to a maiden
    identified as Iphigenia.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain translation; summarized.
- id: ev:7
  type: summary
  locator: lines 4778-4787
  quote_or_summary: Adrastus is honored among the Megarians, who say he died there;
    Agamemnon is said to have made a sanctuary of Artemis when he came to persuade
    Calchas to accompany him to Troy.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain translation; summarized.
- id: ev:8
  type: summary
  locator: lines 4788-4793
  quote_or_summary: A rock called Anaclethris is named because Demeter is said to
    have called her daughter back there while wandering in search of her; Megarian
    women perform a mimic representation of the legend.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain translation; summarized.
- id: ev:9
  type: summary
  locator: lines 4794-4808
  quote_or_summary: After Hyperion’s death, the Megarians adopt elected magistrates;
    Aesymnus asks Delphi how they may prosper, receives an oracle to take counsel
    with the majority, interprets the majority as the dead, and builds a council chamber
    containing heroic graves.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain translation; summarized.
- id: ev:10
  type: summary
  locator: lines 4809-4819
  quote_or_summary: Iphinoe, daughter of Alcathous, died a maid; girls customarily
    bring libations to her tomb and offer a lock of hair before wedding, as Delian
    daughters once cut hair for Hecaerge and Opis.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain translation; summarized.
