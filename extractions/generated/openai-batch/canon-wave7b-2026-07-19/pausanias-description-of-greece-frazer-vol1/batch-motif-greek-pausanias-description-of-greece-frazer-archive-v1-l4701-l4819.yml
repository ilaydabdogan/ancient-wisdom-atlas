candidate_motifs:
- id: motif:1
  label: sunrise-sounding damaged statue
  taxonomy_refs: []
  basis: A broken statue is said to make a lyre-like noise every day at sunrise.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage reports the marvel but does not explain its cause or cultic
    function.
- id: motif:2
  label: interrupted sacrifice and mistaken kin-slaying
  taxonomy_refs:
  - sacrifice
  basis: Callipolis disrupts a sacrificial fire to Apollo, and Alcathous kills him
    after interpreting the act as impiety.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage frames the action as impiety and punishment, but not as a
    formal sacrificial killing.
- id: motif:3
  label: shore-buried heroine receiving annual sacrifice
  taxonomy_refs:
  - sacrifice
  basis: Ino’s corpse is cast ashore, buried, renamed Leucothea, and annually sacrificed
    to by the Megarians.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: Transformation into Leucothea is indicated by naming, but the passage
    does not narrate a full metamorphosis.
- id: motif:4
  label: maiden’s disputed death, divine identity, and human sacrifice
  taxonomy_refs:
  - death_rebirth
  - sacrifice
  basis: Iphigenia is variously said to have died in Megara, not died but become Hecate
    by Artemis’s will, and to receive Taurian sacrifices of castaways.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: These are explicitly variant accounts from different traditions, not one
    continuous narrative in the passage.
- id: motif:5
  label: mother goddess searching for and recalling daughter
  taxonomy_refs:
  - mother_goddess
  basis: Demeter is said to have called her daughter back at Anaclethris while wandering
    in search of her, and the legend is ritually mimed by women.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The broader Persephone myth is not fully narrated in this passage.
- id: motif:6
  label: oracle interpreted through the dead as civic majority
  taxonomy_refs:
  - wisdom
  basis: The Delphic oracle tells Megarians to take counsel with the majority; they
    interpret this as the dead and include heroic graves within the council chamber.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The taxonomy link to wisdom is functional and civic; the passage emphasizes
    oracle interpretation and memorial placement.
- id: motif:7
  label: premarital hair and libation offering to a maiden dead
  taxonomy_refs:
  - sacred_exchange
  - initiation
  basis: Girls offer libations and a lock of hair at Iphinoe’s tomb before marriage,
    in a rite compared to a Delian hair-cutting custom.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage states the timing before marriage but does not explicitly
    call the rite an initiation.
