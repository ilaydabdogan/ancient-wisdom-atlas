canonical_text:
  quote: ''
  summary: The passage describes a broken statue that sounds at sunrise; Megarian
    sanctuaries and images of Athena and Apollo; a story in which Callipolis interrupts
    an altar fire and is killed by his father Alcathous; the shrine and annual sacrifice
    of Ino/Leucothea; variant accounts of Iphigenia, including identification with
    Hecate and Taurian sacrifices; Megarian honors to Adrastus and Artemis; a rock
    where Demeter called back her daughter, with a women’s performance of the legend;
    an oracle that led Megarians to build a council chamber over heroic graves; and
    a premarital offering of libations and hair to Iphinoe, compared with a Delian
    rite.
  language: English
  quote_policy: summarized
