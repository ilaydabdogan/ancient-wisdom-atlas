  locator: lines 4701-4707
  quote_or_summary: Some attribute a statue to Sesostris; Cambyses broke it in two;
    at sunrise it daily makes a sound likened to a harp or lyre string after breaking.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
