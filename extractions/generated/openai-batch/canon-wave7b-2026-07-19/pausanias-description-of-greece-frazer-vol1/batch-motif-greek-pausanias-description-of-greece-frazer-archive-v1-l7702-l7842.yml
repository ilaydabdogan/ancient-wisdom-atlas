  quote: ''
  summary: The passage describes the sanctuary and grove of Asclepius at Epidaurus,
    including boundary rules, cult images, sacred animals, incubation and healing
    records, the Hippolytus tradition, later benefactions, nearby mountains and sanctuaries,
    sacred serpents, a Heracles-shaped olive tree, and the opening of a story about
    Hyrnetho and Deiphontes.
  language: English
  quote_policy: summarized
