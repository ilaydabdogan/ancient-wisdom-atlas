  text: Reliefs on the seat show Bellerophontes against the Chimaera and Perseus after
    cutting off Medusa's head.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A place opposite the temple is used for suppliants of the god to sleep, and
