  quote: ''
  summary: 'Pausanias describes the Isthmian sanctuary and nearby Corinthian sites:
    Poseidon and marine imagery, Palaemon''s shrine with an underground descent and
    oath danger, an altar of the Cyclopes, hidden or disputed graves, harbours and
    Helen''s Bath, Lais''s tomb, and wooden images of Dionysus made from the tree
    associated with Pentheus''s death after an oracle.'
