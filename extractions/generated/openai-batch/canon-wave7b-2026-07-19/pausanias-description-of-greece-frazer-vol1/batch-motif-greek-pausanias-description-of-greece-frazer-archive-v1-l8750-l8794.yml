canonical_text:
  quote: ''
  summary: The passage describes the coastal ruins of Asine and an account of Lacedaemonian
    and Asinaean invasion of Argolis, Argive retaliation, evacuation by vessels, destruction
    of Asine, a spared sanctuary of Apollo Pythaeus, and the burial of Lysistratus.
    It then maps the road from Argos to Lerna by rivers and sanctuaries, including
    a sanctuary of the Dioscuri, a stone circuit where Pluto is said to have descended
    underground after carrying off Core, Demeter mysteries at Lerna, and a sacred
    grove on Mount Pontinus, which absorbs rainwater and gives rise to a river.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A district formerly called Asinaea belongs to the Argives, and the ruins of
    Asine are by the sea.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lacedaemonians, led by King Nicander, invaded Argolis; the Asinaeans joined
    the invasion and ravaged Argive land.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the Lacedaemonian expedition returned home, the Argives under King Eratus
    attacked Asine.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Asinaeans defended themselves from their wall for a time and killed Lysistratus,
    a notable man of Argos.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: When the wall was lost, the citizens put their wives and children on vessels
    and abandoned their country.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Argives levelled Asine, annexed its territory, left the sanctuary of Apollo
    Pythaeus visible, and buried Lysistratus by it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The sea at Lerna is described as forty stades from Argos.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: On the road to Lerna, the Erasinus empties into the Phrixus, and the Phrixus
    empties into the sea between Temenium and Lerna.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: A sanctuary of the Lords Dioscuri lies about eight stades to the left from
    the Erasinus, and its wooden images are made similar to those in the city.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: After returning to the straight road, one crosses the Erasinus and reaches
    the river Cheimarrus.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Near the Cheimarrus is a circuit of stones, where people say Pluto descended
    to his underground kingdom after carrying off Core, daughter of Demeter.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: At Lerna by the sea, mysteries are celebrated in honor of Lernaean Demeter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: A sacred grove begins on Mount Pontinus; the mountain absorbs rainwater rather
