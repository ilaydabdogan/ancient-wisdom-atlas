  quote: those whom the Greeks call brave are as nothing if Good Fortune be not with
    them
  summary: The passage describes a sequence of Athenian public graves, slabs, monuments,
    and inscriptions commemorating war dead, commanders, allied forces, slaves honored
    for loyalty, and casualties from campaigns across Greece and abroad. It also recounts
    political and military episodes linked to the memorials, including alliances,
    betrayal, defeat, and a reflection that courage does not ensure success without
    Good Fortune.
