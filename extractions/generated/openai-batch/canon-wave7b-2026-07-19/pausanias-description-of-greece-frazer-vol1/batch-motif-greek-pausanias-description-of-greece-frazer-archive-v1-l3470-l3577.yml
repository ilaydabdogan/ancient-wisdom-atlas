literal_observations:
- id: obs:1
  text: Athenian forces who advanced victoriously as far as Drabescus in Thrace were
    unexpectedly attacked by the Edonians and slaughtered; a legend also says they
    were struck by lightning.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Leagrus is named as the chief commander of that expedition, and Sophanes of
    Decelea is described as having killed Eurybates the Argive.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A slab before the monument shows horsemen fighting; the named horsemen, Melanopus
    and Macartatus, died fighting Lacedaemonians and Boeotians near Eleon and Tanagra.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage lists graves or monuments for Thessalian horsemen, Cretan bowmen,
    Cleisthenes, Athenian horsemen, and men of Cleone.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Athenians allowed slaves a public funeral and had their names inscribed
    on a slab because they were said to have proved good and true to their masters
    in war.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Athenian-Argive alliance is explained as arising after Sparta was shaken
    by an earthquake, the Helots seceded to Ithome, Athens sent picked troops under
    Cimon, and the Lacedaemonians dismissed them out of suspicion.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: At Tanagra, the Argives reinforced the Athenians; night removed certainty
    of victory, and the next day the Lacedaemonians prevailed after the Thessalians
    betrayed the Athenians.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Apollodorus, an Athenian commander of mercenaries, is said to have saved the
    Perinthians when Philip invaded their territory.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Other brave but unlucky men attacked Lachares or planned to capture the Peiraeus
    from a Macedonian garrison, but were betrayed by accomplices and put to death
    before accomplishing the deed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The narrator states that at Corinth and again at Leuctra Heaven showed that
    bravery is ineffective if Good Fortune is absent.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Elegiac verses state that a single slab was erected for those who died in
    Euboea, Chios, remote Asia, and Sicily; the generals' names were inscribed except
    for Nicias, and Plataeans were included among the private soldiers.
  category: object
  evidence_refs:
  - ev:8
