candidate_motifs:
- id: motif:1
  label: civic memorialization of war dead
  taxonomy_refs: []
  basis: The passage repeatedly links graves, monuments, slabs, names, and verses
    to war dead, allies, commanders, slaves, and distant campaign casualties.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: This is a commemorative and topographical pattern rather than a mythic
    narrative in the narrow sense.
- id: motif:2
  label: Good Fortune or Heaven overriding martial bravery
  taxonomy_refs:
  - divine_judgment
  basis: The narrator explicitly says Heaven showed at Corinth and Leuctra that brave
    Greeks are nothing without Good Fortune.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The available taxonomy term 'divine_judgment' is only approximate; the
    passage emphasizes fortune and outcome rather than moral judgment.
- id: motif:3
  label: betrayal turning expected success into defeat or death
  taxonomy_refs: []
  basis: The Thessalians' betrayal changes the outcome at Tanagra, and later accomplices
    betray men planning action against Lachares or the Macedonian garrison.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The two betrayal episodes differ in scale and political context.
- id: motif:4
  label: alliance redirected by insult and old enmity
  taxonomy_refs: []
  basis: After the Lacedaemonians dismissed Athenian troops out of suspicion, the
    Athenians viewed it as an insult and allied with the Argives, described as immemorial
    enemies of the Lacedaemonians.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage describes a historical-political alliance, not a sacred covenant.
- id: motif:5
  label: honor granted to enslaved war dead
  taxonomy_refs: []
  basis: The passage singles out the Athenians' public funeral and inscribed names
    for slaves who proved loyal and brave in war.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The motif is civic and memorial rather than explicitly mythological.
- id: motif:6
  label: death attributed to lightning in legend
  taxonomy_refs: []
  basis: Alongside the attack and slaughter by the Edonians, a legend says the Athenian
    dead were struck by lightning.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The text reports the lightning only as a legend and does not state a divine
    cause or punishment.
