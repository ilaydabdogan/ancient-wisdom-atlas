canonical_text:
  quote: ''
  summary: 'The passage describes reliefs and statues on the Athenian Acropolis and
    nearby monuments: griffins fighting the one-eyed Arimaspi for earth-born gold;
    the statue of Athena with Medusa''s head, Victory, spear, shield, and a serpent
    identified with Erichthonius; a relief of the birth of Pandora, named as the first
    woman; Apollo called the Locust God for driving locusts from Attica; statues including
    Io and Callisto, whose stories are summarized as Zeus''s love, Hera''s wrath,
    and metamorphosis; and wall representations of conflicts with giants, Amazons,
    Persians, and Gauls, followed by a historical account of Olympiodorus and anti-Macedonian
    resistance.'
  language: English
  quote_policy: summarized
