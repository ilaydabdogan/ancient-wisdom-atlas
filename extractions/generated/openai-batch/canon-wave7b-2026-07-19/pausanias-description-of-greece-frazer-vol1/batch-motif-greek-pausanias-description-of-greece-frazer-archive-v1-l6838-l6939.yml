  label: Royal succession validated by victorious animal omen
  taxonomy_refs:
  - royal_legitimacy
  - divine_judgment
  basis: A public royal dispute is delayed, then the wolf's victory over the bull
    is interpreted as corresponding to Danaus's victory over Gelanor and decides the
    kingship.
  evidence_refs:
