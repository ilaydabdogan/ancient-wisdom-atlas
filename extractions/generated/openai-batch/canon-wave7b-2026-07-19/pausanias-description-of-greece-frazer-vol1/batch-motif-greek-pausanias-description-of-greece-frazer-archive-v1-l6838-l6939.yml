canonical_text:
  quote: ''
  summary: The passage recounts Argive dynastic disputes, the limitation and deposition
    of kings, and several sacred objects and stories at Argos. Danaus wins the kingdom
    after an omen in which a wolf defeats a bull, interpreted as Danaus overcoming
    Gelanor, and he founds the sanctuary of Apollo Lycius. The sanctuary contains
    dedications including Danaus's throne, a statue of Biton carrying a bull, the
    fire of Phoroneus, images linked to Hypermestra, Hermes with a tortoise, and a
    relief of a wolf, bull, and maiden identified as Artemis. The passage also notes
    graves of Linus figures, an altar of Zeus God of Rain where Polyneices' allies
    swore an oath, and a local Prometheus tomb tradition that Pausanias distrusts.
  language: English
  quote_policy: summarized
