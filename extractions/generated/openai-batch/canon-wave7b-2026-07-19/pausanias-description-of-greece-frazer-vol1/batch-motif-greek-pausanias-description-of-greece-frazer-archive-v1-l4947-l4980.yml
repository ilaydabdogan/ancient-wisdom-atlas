canonical_text:
  quote: ''
  summary: 'The passage describes a monument attributed to Cleopatra, the tomb of
    Car adorned with mussel stone by command of an oracle, the Scironian road made
    by Sciron and later broadened by Hadrian, and legends of the Molurian Rock: Ino
    casts herself and Melicertes into the sea after Learchus is killed by Athamas,
    and Melicertes is carried by a dolphin to the Corinthian Isthmus, renamed Palaemon,
    and honored.'
  language: English
  quote_policy: summarized
