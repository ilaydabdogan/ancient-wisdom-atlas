comparison_claims:
- id: claim:1
  claim: 'Within the passage, the Geryon and Hyllus explanations serve a similar function:
    each attaches exceptionally large human-shaped remains in Lydia to a named mythic
    figure, though Pausanias rejects the Geryon identification and reports the guides''
    Hyllus account as the true story.'
  claim_level: same_function
  target: Geryon/Hyllus explanations of exposed large bones in Lydia
  evidence_refs:
  - ev:3
  - ev:6
  counter_evidence_refs:
