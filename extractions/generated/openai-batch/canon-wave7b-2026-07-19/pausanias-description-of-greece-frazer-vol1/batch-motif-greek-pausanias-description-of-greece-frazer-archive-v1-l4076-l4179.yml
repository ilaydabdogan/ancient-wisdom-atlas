canonical_text:
  quote: ''
  summary: The passage reports unusual corpses and large bones associated with Protophanes,
    Asterius, Geryon, and Hyllus; describes sanctuaries and battle memories at Salamis
    and Psyttalea, including a serpent identified by oracle as the hero Cychreus;
    and recounts tombs and named places along the Sacred Way, including divine wrath
    against the Megarians for killing the herald Anthemocritus and the burial of the
    seer Scirus near a torrent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Protophanes, a Magnesian citizen, won Olympic victories in the pancration
    and wrestling on the same day; after robbers entered his grave, people saw that
    his corpse had ribs joined together from shoulder to lower ribs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An islet near Lade was called the islet of Asterius; Asterius was said to
    be buried there, to be son of Anax, and to have a corpse not less than ten cubits
    long.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the Doors of Temenus in upper Lydia, a storm broke away a crest and exposed
    bones that seemed human in shape but were exceptionally large.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A local story identified the exposed remains as Geryon, son of Chrysaor, and
    connected him with a carved seat, a torrent called Ocean, cattle horns found while
    ploughing, and excellent cows.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Pausanias challenged the Geryon identification by saying that Geryon belongs
    at Gadeira, where there is a tree of different shapes rather than a tomb.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Lydian guides said the exposed corpse was Hyllus, a son of Earth; they also
    said the river was named from him and that Heracles named his son Hyllus after
    the river during his sojourn with Omphale.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: At Salamis there was a sanctuary of Artemis, a trophy for Themistocles' victory
    for the Greeks, and a sanctuary of Cychreus.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: When the Athenians fought the Persians at sea, a serpent was said to have
    appeared in the fleet, and an oracle told the Athenians that it was the hero Cychreus.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: On Psyttalea, about four hundred Persians were said to have landed and later
    been killed after Xerxes' fleet was defeated; the island had roughly carved wooden
    images of Pan.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Along the Sacred Way stood the tomb of Anthemocritus, a herald whom the Megarians
    killed after he came to forbid further encroachment on land.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage states that the wrath of the Two Goddesses lay on the Megarians
    because of the killing of Anthemocritus, and that even Hadrian could not make
    them prosperous.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Scirus, a seer from Dodona, came during the Eleusinian war against Erechtheus,
    set up the ancient sanctuary of Athena Sciras at Phalerum, fell in battle, and
    was buried near a torrent that, like the place Scirum, took its name from him.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: Cephisodorus is described as a champion of the people who opposed Philip of
    Macedon and sought alliances with kings, self-governing peoples, and the Romans.
  category: action
  evidence_refs:
  - ev:12
