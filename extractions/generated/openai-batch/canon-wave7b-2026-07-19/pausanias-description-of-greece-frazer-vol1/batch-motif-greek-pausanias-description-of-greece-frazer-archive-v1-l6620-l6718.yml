  label: Sacred landscape of the Heraeum
  summary: The Heraeum is approached near the Water of Freedom; priestesses use the
    water for purification and secret sacrifices, while the Asterion river, its daughters,
    and the asterion plant are linked to Hera’s cult and local place names.
