canonical_text:
  quote: ''
  summary: 'The passage describes the ruin and monuments of Mycenae, including Cyclopean
    walls, tombs, and royal deaths, then turns to the Heraeum near Mycenae: its sacred
    water, river and plant traditions, temple images, Hera’s cult statue and symbols,
    votive offerings, a myth of Zeus as a cuckoo courting Hera, the marriage of Hebe
    and Heracles in relief, and the burning of an earlier temple through the negligence
    of the priestess Chryseis.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Argives are said to have destroyed Mycenae out of jealousy after the Mycenaeans
    sent eighty men to Thermopylae during the Persian invasion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Parts of Mycenae’s city wall and a gate with lions remain; these are attributed
    to the Cyclopes, who are also said to have made the wall at Tiryns for Proetus.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ruins of Mycenae include the fountain Persea and underground chambers
    of Atreus and his children where treasures were stored.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage lists graves and tombs associated with Atreus, Agamemnon, Agamemnon’s
    murdered companions, Eurymedon, Teledamus and Pelops, Electra, Clytemnestra, and
    Aegisthus; Clytemnestra and Aegisthus are buried outside the wall as unworthy
    of burial within it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Near the Heraeum, priestesses use the brook called Water of Freedom for purifications
    and secret sacrifices.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The river Asterion is said to have three daughters, Euboea, Prosymna, and
    Acraea, who were nurses of Hera and whose names are applied to nearby places.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Asterion river flows above the Heraeum and disappears into a cleft; a
    plant called asterion grows on its banks and is offered to Hera and woven into
    her garlands.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Temple sculptures refer to the birth of Zeus, the battle between gods and
    giants, the Trojan war, and the capture of Ilium.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The cult statue of Hera is seated on a throne, made of gold and ivory, crowned
    with Graces and Seasons, and holds a pomegranate and a sceptre.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The narrator refuses to explain the pomegranate’s story because it is a holy
    mystery.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: A cuckoo is seated on Hera’s sceptre; the explanation given is that Zeus,
    in love with Hera in her maidenhood, changed into this bird and was caught by
    her as a pet.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage notes images and votive offerings including Hebe’s image, an older
    Hera image of wild-pear wood brought from Tiryns, a silver relief of the marriage
    of Hebe and Heracles, a gold and jeweled peacock sacred to Hera, and offerings
    of Nero.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: An earlier temple burned because the priestess Chryseis was overcome by sleep
    and a lamp set fire to wreaths; Chryseis then supplicated Athena Alea, and her
    statue remained before the burnt temple.
  category: sequence
  evidence_refs:
  - ev:10
