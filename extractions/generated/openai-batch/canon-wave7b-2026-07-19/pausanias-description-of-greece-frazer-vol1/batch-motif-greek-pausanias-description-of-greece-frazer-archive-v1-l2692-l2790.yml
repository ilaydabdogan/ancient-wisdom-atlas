candidate_motifs:
- id: motif:1
  label: river washing encounter represented in art
  taxonomy_refs: []
  basis: The scene with Nausicaa and women washing clothes at a river is explicitly
    described as a painting and compared to Homer.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The initial subject of the scene is partly obscured by the supplied OCR
    text.
- id: motif:2
  label: hero carries severed monster head to a ruler
  taxonomy_refs: []
  basis: Perseus is depicted journeying to Seriphos while carrying Medusa’s head to
    Polydectes.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The narrator explicitly declines to retell the Medusa legend, so the wider
    mythic context is not extracted here.
- id: motif:3
  label: flight bestowed by a wind power
  taxonomy_refs:
  - ascent
  basis: Verse is said to describe Musaeus receiving the gift of flight from the North
    Wind.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The narrator doubts the verses’ genuineness and attributes them to Onomacritus.
- id: motif:4
  label: oracle declares the wisest person
  taxonomy_refs:
  - wisdom
  basis: The Pythia testifies that Socrates is the wisest of men and refuses the title
    to Anacharsis.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage reports the title tradition only briefly.
- id: motif:5
  label: tortured woman commemorated by animal memorial
  taxonomy_refs: []
  basis: Leaena is tortured to death and later remembered by a bronze lioness.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage frames the story as generally credited among Athenians but
    not previously committed to writing.
- id: motif:6
  label: arrow-pierced martial statue
  taxonomy_refs: []
  basis: The bronze statue of Diitrephes is described as pierced with arrows, prompting
    comment on Greek archery customs.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not explain why the statue is pierced by arrows.
- id: motif:7
  label: sacred resting stone of Silenus
  taxonomy_refs: []
  basis: A small stone is explained by legend as the place where Silenus rested when
    Dionysus came to the land.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage gives no further ritual use or cult practice for the stone.
- id: motif:8
  label: wind-driven voyage beyond known sea to strange islands
  taxonomy_refs: []
  basis: Euphemus says winds carried him into the outer sea beyond ordinary routes,
    where he encountered uninhabited islands and islands of wild men.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The account is secondhand, reported by Euphemus through Pausanias.
- id: motif:9
  label: tailed wild island beings assault shipboard women
  taxonomy_refs: []
  basis: The Satyrides inhabitants are red-haired, horse-tailed, and rush silently
    to the ship to assault the women.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: The passage names them Satyrs or Satyrides inhabitants but presents the
    account as a sailor’s report.
- id: motif:10
  label: woman cast ashore to deflect danger from a ship
  taxonomy_refs:
  - sacrifice
  basis: The sailors, fearing the Satyrides inhabitants, cast a foreign woman onto
    the island, after which the Satyrs violate her.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The action is not described as a ritual sacrifice; the taxonomy reference
    is only a broad functional fit involving abandonment of a victim to avert danger.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares the painted river washing scene with Homer’s
    description, supporting a visual-literary correspondence to the Homeric Nausicaa
    episode.
  claim_level: visual_similarity
  target: Homeric Nausicaa river washing scene
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The supplied text’s opening words are corrupted, so the approaching
    figure is not securely named from this excerpt alone.
- id: claim:2
  claim: The report of the Satyrides is presented as part of an inquiry into who the
    Satyrs are and follows the note that the oldest Satyrs are called Sileni, supporting
    a cautious link to the Satyr/Silenus motif family.
  claim_level: same_motif
  target: Satyr/Silenus wild-man tradition
