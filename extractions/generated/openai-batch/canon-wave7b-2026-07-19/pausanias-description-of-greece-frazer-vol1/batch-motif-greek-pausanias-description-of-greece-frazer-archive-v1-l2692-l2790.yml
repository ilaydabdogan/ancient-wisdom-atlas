literal_observations:
- id: obs:1
  text: A painting is described as showing a figure coming upon women washing clothes
    with Nausicaa at a river, and the narrator says it is like Homer’s description.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A picture shows Perseus journeying to Seriphos while carrying the head of
    Medusa to Polydectes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator reports having read verse in which Musaeus receives the gift
    of flight from the North Wind, while also doubting the attribution and assigning
    the verses to Onomacritus.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the entrance to the Acropolis are a Hermes called Hermes of the Gateway
    and Graces traditionally said to have been sculptured by Socrates; the Pythia
    is said to have testified that Socrates was the wisest of men.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Hippias tortured Leaena to death after Hipparchus died because he knew she
    was Aristogeiton’s mistress and believed she must know of the plot.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the tyranny ended, the Athenians set up a bronze lioness in memory of
