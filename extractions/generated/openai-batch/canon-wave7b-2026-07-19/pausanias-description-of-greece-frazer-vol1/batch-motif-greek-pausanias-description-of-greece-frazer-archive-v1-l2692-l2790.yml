  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: 2711-2719
  quote_or_summary: At the Acropolis entrance are Hermes of the Gateway and Graces
    attributed by tradition to Socrates; the Pythia testified that Socrates was wisest
    and refused that title to Anacharsis.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: 2725-2733
  quote_or_summary: After Hipparchus died, Hippias tortured Leaena to death because
    she was Aristogeiton’s mistress and he believed she could not be ignorant of the
    plot.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: 2733-2737
  quote_or_summary: When the tyranny ended, the Athenians set up a bronze lioness
    in memory of Leaena; Callias dedicated it and Calamis made it.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: quote
  locator: 2738-2740
  quote_or_summary: "“Hard by is a bronze statue of Diitrephes shot through by arrows.”"
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain translation; short excerpt used.
- id: ev:8
  type: summary
  locator: 2740-2756
  quote_or_summary: Diitrephes is reported as leading Thracian mercenaries; they took
    Mycalessus and put combatants, women, and children to the sword, leaving no survivors
    to reoccupy the town.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 2766-2769
  quote_or_summary: Near Diitrephes are figures of Health, whom legend calls daughter
    of Asclepius, and Athena, also surnamed Health.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 2769-2774
  quote_or_summary: A small stone, large enough as a seat for a little man, is said
    to be where Silenus rested when Dionysus came to the land; the oldest Satyrs are
    called Sileni.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: 2774-2783
  quote_or_summary: Euphemus the Carian says winds drove him beyond ordinary sea lanes
    into the outer sea, where some islands were uninhabited and others inhabited by
    wild men.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: 2783-2786
  quote_or_summary: The sailors called the islands Satyrides, and the inhabitants
    are described as red-haired with tails on their flanks not much smaller than horses’
    tails.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: 2786-2790
  quote_or_summary: The inhabitants ran silently to the ship and assaulted the women;
    the frightened sailors cast a foreign woman onto the island, and the Satyrs violated
    her.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
