  locator: lines 3345-3468; Oedipus monument notice
  quote_or_summary: The precinct contains a monument to Oedipus; Pausanias says his
    bones were brought from Thebes and contrasts Sophocles' account of Oedipus's death
    with Homer's reference to funeral games after it.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
