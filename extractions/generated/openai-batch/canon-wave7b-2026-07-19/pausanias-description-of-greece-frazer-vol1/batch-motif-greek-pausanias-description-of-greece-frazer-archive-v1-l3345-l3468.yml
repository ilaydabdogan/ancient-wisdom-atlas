- id: ev:4
  type: summary
  locator: lines 3345-3468; Palladium court legend
  quote_or_summary: The Palladium court hears involuntary homicide; Demophon is said
    to have been first tried there after a dark mistaken attack on Argives near Phalerum,
    taking the Palladium, and an Athenian being killed by his horse.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: lines 3345-3468; Delphinium court notice
  quote_or_summary: At Delphinium are tried those claiming justifiable homicide; Theseus
    made this plea and was acquitted after killing Pallas and his sons, and earlier
    bloodshed required exile or equivalent death.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 3345-3468; Prytaneum court and ox-slayer incident
  quote_or_summary: The Prytaneum tries iron and inanimate things; when the ox-slayer
    killed an ox at Zeus Polieus's altar, left the axe, and fled, the axe was tried
    and acquitted, with the trial repeated annually.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 3345-3468; inanimate retribution statement
  quote_or_summary: Inanimate objects are said sometimes to inflict righteous retribution
    on men; the scimitar of Cambyses is named as the most famous example.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 3345-3468; Phreattys court legend
  quote_or_summary: At Phreattys, exiles answer further charges from a ship while
    judges listen on land; Teucer is said to have first defended himself this way
    before Telamon concerning Ajax's death.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 3345-3468; Panathenaic ship notice
  quote_or_summary: Near the Hill of Ares is a ship built for the Panathenaic procession;
    Pausanias compares it with a larger vessel at Delos having nine banks of oars
    below deck.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 3345-3468; road to Academy sanctuaries
  quote_or_summary: On the road to the Academy are a precinct of Artemis with wooden
    images Ariste and Calliste, and a small temple into which the image of Dionysus
    Eleuthereus is carried every year on fixed days.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 3345-3468; graves along road to Academy
  quote_or_summary: The road to the Academy has graves of Thrasybulus, Pericles, Chabrias,
    Phormio, and a monument for Athenians who fell in battle, except the Marathon
    fighters buried on the battlefield.
  source_text_path: texts/public-domain/greek/project-gutenberg/pausanias-description-of-greece-frazer-vol1.md
  rights_note: Public domain source; summarized.
