  quote: ''
  summary: Pausanias describes Athenian sanctuaries, law courts, mythic explanations
    for homicide procedures, trials involving heroes and inanimate objects, a ship
    used in procession, and graves and cult sites on the road to the Academy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Near the Hill of Ares is a sanctuary of goddesses called August by Athenians
    and Erinyes by Hesiod; Aeschylus is said to have represented them with snakes
    in their hair, but the local images of them and other under-world deities are
    not terrible.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The precinct contains images of Pluto, Hermes, and Earth, and sacrifices are
    made there by persons acquitted on the Hill of Ares and also by citizens and aliens
    on other occasions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Within the same precinct is a monument to Oedipus; Pausanias reports that
    Oedipus's bones were brought from Thebes and contrasts accounts of Oedipus's death
    in Sophocles and Homer.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Several Athenian law courts are named, including the Palladium court for involuntary
    homicide.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'A legend explains Demophon''s trial at the Palladium: in darkness he attacked
    Argives near Phalerum, killed some, took the Palladium, and an Athenian was killed
    by Demophon''s horse.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Delphinium are tried persons claiming justifiable homicide; Theseus is
    given as the precedent after killing Pallas and his sons and being acquitted.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Prytaneum court tries iron and similar inanimate things; after the ox-slayer
    killed an ox at Zeus Polieus's altar and fled, the axe was tried and acquitted,
    and the trial is repeated annually.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says inanimate objects have sometimes inflicted righteous retribution
    on men, with the scimitar of Cambyses named as the best-known example.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: At Phreattys, exiles facing an additional charge defend themselves from a
    ship while judges listen on land; Teucer is said to have first defended himself
    this way before Telamon concerning Ajax's death.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Near the Hill of Ares a ship built for the Panathenaic procession is shown;
    Pausanias compares it with a larger vessel at Delos with nine banks of oars below
    deck.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: On the road to the Academy are a precinct of Artemis with wooden images called
    Ariste and Calliste, and a small temple into which the image of Dionysus Eleuthereus
    is carried yearly on fixed days.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: The road to the Academy includes graves of heroes and men, including Thrasybulus,
    Pericles, Chabrias, Phormio, and a monument for Athenians who fell in battle except
    those buried at Marathon.
  category: setting
  evidence_refs:
  - ev:11
