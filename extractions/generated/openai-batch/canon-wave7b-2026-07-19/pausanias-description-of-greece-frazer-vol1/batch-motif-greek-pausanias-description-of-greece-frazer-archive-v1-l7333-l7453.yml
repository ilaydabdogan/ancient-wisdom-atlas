candidate_motifs:
- id: motif:1
  label: contested localization of heroic tombs and sacred objects
  taxonomy_refs: []
  basis: The passage reports Argive claims about tombs and an Athena image from Troy,
    then presents the narrator's corrections and alternate locations or traditions.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is a local tradition and antiquarian correction pattern rather than
    a single narrated myth episode.
- id: motif:2
  label: sacred city image transferred from fallen Troy
  taxonomy_refs: []
  basis: The Palladium or Athena image is linked to Troy, the capture of the city,
    and Aeneas's transfer of it to Italy.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage states and disputes claims about the object's location; it
    does not narrate the full theft or rescue of the image.
- id: motif:3
  label: daughter guarded in a bronze chamber
  taxonomy_refs: []
  basis: Acrisius is said to have made a bronze chamber to guard his daughter, with
    an underground building marking the place.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not name the daughter or explain the reason for guarding
    her.
- id: motif:4
  label: divine enmity resolved into local cult honor
  taxonomy_refs: []
  basis: Dionysus is said to have warred on Perseus, later laid aside enmity, and
    received a special Argive precinct.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage summarizes the tradition without narrating the conflict in
    detail.
- id: motif:5
  label: god buries Ariadne and local tomb confirms cult memory
  taxonomy_refs: []
  basis: Ariadne is said to have died and been buried by Dionysus in the precinct,
    and an earthenware coffin identified as hers was reportedly found.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not explicitly define Ariadne's relationship to Dionysus
    beyond burial.
- id: motif:6
  label: blood sacrifice produces oracular inspiration
  taxonomy_refs:
  - sacrifice
  basis: The oracle functions through monthly night sacrifice of a lamb; the chaste
    prophetess tastes the blood and becomes inspired by Apollo.
  evidence_refs:
