canonical_text:
  quote: ''
  summary: The passage describes Argive sanctuaries, cult images, local traditions,
    and Pausanias's corrections of some Argive claims. It includes sanctuaries of
    Asclepius, Artemis Pheraea, Dionysus, Apollo, Athena, Hera, Aphrodite, and Zeus;
    disputed traditions about tombs and Trojan images; an underground structure made
    by Acrisius to guard his daughter; the burial of Ariadne by Dionysus; an oracle
    in which a chaste woman tastes sacrificial lamb blood at night and becomes inspired;
    Athena's removal of mist from Diomedes' eyes; the severed heads of the sons of
    Aegyptus; and a three-eyed image of Zeus interpreted as signifying rule over heaven,
    underworld, and sea.
  language: English
  quote_policy: summarized
