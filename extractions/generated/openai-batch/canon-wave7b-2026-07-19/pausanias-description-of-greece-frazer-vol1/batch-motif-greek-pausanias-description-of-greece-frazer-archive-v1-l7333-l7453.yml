comparison_claims:
- id: claim:1
  claim: The passage itself compares Argive worship of Artemis Pheraea with Athenian
    and Sicyonian practice, noting that all assert the goddess's image came from Pherae
    in Thessaly.
  claim_level: same_motif
  target: Artemis Pheraea traditions among Argives, Athenians, and Sicyonians
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The passage reports a shared claim about an image's origin; it does
    not independently verify historical transfer.
- id: claim:2
  claim: The Argive claim to a Trojan Athena image is contrasted with a tradition
    that the Palladium was brought to Italy by Aeneas, indicating competing localizations
    of the same sacred-object motif.
  claim_level: same_motif
  target: Aeneas and the Italian Palladium tradition
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is limited to the narrator's assertion and the Argive
    claim; the full external Palladium narrative is not present here.
- id: claim:3
  claim: The three-eyed Zeus image is interpreted by comparing Zeus in heaven with
    underworld and sea figures also called Zeus in cited poetry, giving the image
    a shared cosmic-rulership function across three realms.
  claim_level: same_function
  target: Zeus of heaven, Zeus of the Underworld, and a sea-god called Zeus
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim follows the narrator's interpretive inference and literary
    citations rather than a detailed account of separate cult identities.
