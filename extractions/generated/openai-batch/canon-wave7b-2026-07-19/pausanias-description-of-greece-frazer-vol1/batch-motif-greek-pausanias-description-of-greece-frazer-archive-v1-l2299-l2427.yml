canonical_text:
  quote: ''
  summary: Pausanias describes the sanctuary of Olympian Zeus at Athens, Hadrianic
    dedications, a local deluge trace associated with Deucalion, and nearby sanctuaries
    and monuments. The passage recounts Theseus being mocked and demonstrating strength
    at the Delphinian, notices Aphrodite in the Gardens, Heracles at Cynosarges, Nisus
    whose fatal hair was cut by his daughter for love of Minos, Oreithyia carried
    off by the North Wind by the Ilisus, and Artemis Agrotera's first hunt.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hadrian dedicated the temple and statue of Olympian Zeus, and cities dedicated
    likenesses of Hadrian in the precinct.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In an enclosure of Earth surnamed Olympian, the floor opens to about a cubit's
    width; local tradition says flood water from Deucalion's time flowed off there,
    and wheat meal mixed with honey is cast into it yearly.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Athenians say the ancient sanctuary of Olympian Zeus was built by Deucalion
    and point to a nearby grave as evidence that he lived at Athens.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Theseus arrived at the unfinished temple of Apollo Delphinius as an unknown
    stranger, was mocked as a marriageable virgin because of his clothing and hair,
    and answered by throwing oxen higher than the temple roof.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Aphrodite near the Gardens is square like the Hermae, and its inscription
    says Heavenly Aphrodite is the oldest of those called Fates.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Cynosarges is described as sacred to Heracles, with a white-dog story referred
    to an oracle and altars to Heracles, Hebe, Alcmena, and Iolaus.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Nisus had red hair, was fated to die when it was cut off, and his daughter
    cut it after falling in love with Minos during a Cretan attack.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Athenian territory includes the Ilisus and its tributary Eridanus, whose
    name Pausanias says is the same as that of a Celtic river.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Oreithyia was playing by the Ilisus when the North Wind carried her off; he
