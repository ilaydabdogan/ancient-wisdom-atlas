  quote: ''
  summary: The passage identifies a precinct near the sanctuary of Persuasion, formerly
    the house of the tyrant Cleon, and a hero-shrine of Aratus. It recounts a sequence
    of Sicyonian tyrants and the exile and return of Aratus, who attacked Nicocles
    by night, captured the tyrant's house, and restored equal political rights to
    the Sicyonians.
