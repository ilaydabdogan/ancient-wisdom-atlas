- id: obs:1
  text: The opening fragment refers to a story involving punishment in Hades.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: People are reported to say that a spring and Peirene are the same because
    the water in the city flows from it underground.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Asopus is described as rising in Phliasian territory, flowing through
    Sicyonian territory, and emptying into the sea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Phliasians say that Corcyra, Aegina, and Thebe were daughters of Asopus
    and that their names explain the names of two islands and a city; the Thebans
    disagree about Thebe's parentage.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Other stories say that the Asopus water is foreign, because the Maeander goes
    to the Peloponnesus and forms the Asopus.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Pausanias reports a similar Delian story that Inopus comes from the Nile,
    and another story that the Nile is the Euphrates after disappearing and rising
    again beyond Aethiopia.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the mountain road from Acrocorinthus the passage locates the Teneatic gate
    and a sanctuary of Eilethyia.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The inhabitants of Tenea say they are Trojans captured in Tenedos by the Greeks
    and allowed by Agamemnon to dwell in their present home, and for this reason they
    honor Apollo especially.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: On the road from Corinth to Sicyon there is a burnt temple; one account says
    it was Apollo's and that Pyrrhus son of Achilles burned it down.
  category: speech
  evidence_refs:
  - ev:5
