canonical_text:
  quote: ''
  summary: The passage reports local accounts of connected waters and river identities
    involving Peirene, Asopus, Maeander, Inopus, Nile, and Euphrates; an Asopus genealogy
    explaining place names; a Tenean origin story from Trojan prisoners settled by
    Agamemnon and linked to Apollo worship; and a local account of a burnt temple
    of Apollo attributed to Pyrrhus son of Achilles. It also begins with a fragment
    mentioning punishment in Hades.
  language: English
  quote_policy: summarized
