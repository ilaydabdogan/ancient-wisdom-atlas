  quote: ''
  summary: Pausanias describes sacred streams, boundaries, graves, genealogies, Eleusinian
    mythic and cult sites, the settlement after war between Eleusis and Athens, places
    linked with Pluto’s carrying off of the Maid, Triptolemus and first sowing, secrecy
    around the sanctuary, Eleutherae’s Dionysus image, and a cave and spring associated
    with Antiope’s newborn babies.
  language: English
  quote_policy: summarized
