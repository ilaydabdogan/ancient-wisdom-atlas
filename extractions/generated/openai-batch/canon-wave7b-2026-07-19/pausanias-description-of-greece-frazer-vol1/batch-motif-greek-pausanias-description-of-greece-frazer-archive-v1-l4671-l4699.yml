canonical_text:
  quote: ''
  summary: The passage describes the Megarian citadel named for Alcathous, monuments
    on its ascent, a hearth of the gods called Prodomeis, a pre-building sacrifice,
    Apollo's aid in building a wall, and a stone that sounds like a lyre when struck
    because Apollo placed his lyre on it. It also mentions Periboea being sent with
    Theseus to Crete as tribute, and compares the Megarian sound-producing stone with
    a sound-producing seated statue in Egyptian Thebes, identified differently as
    Memnon or Phamenoph.
  language: English
  quote_policy: summarized
