canonical_text:
  quote: Dionysus went down to Hell to bring up Semele
  summary: The passage describes sacred sites around Lerna, including a grove with
    images of deities, traditions about Danaus and his daughters, the hydra at the
    source of the Amymone, the Alcyonian Lake as a route of Dionysus' descent to Hell,
    secret rites, Temenium and Nauplia, Hera's annual bath at Canathus, and a local
    story about an ass teaching vine-pruning.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A mountain called Pontinus has a ruined sanctuary of Athena Saitis and foundations
    of a house of Hippomedon.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A grove chiefly of plane trees extends to the sea and is bounded by the rivers
    Pontinus and Amymone; within it are images of Demeter Prosymne and Dionysus, and
    by the sea is a stone image of Aphrodite.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The daughters of Danaus are said to have dedicated the image of Aphrodite,
    and Danaus is said to have made the sanctuary of Athena by the Pontinus.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The mysteries of the Lernaeans are said to have been established by Philammon,
    but the narrator reports an argument that the ritual words and an orichalcum-heart
    inscription are not Philammon's.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the source of the Amymone grows a plane tree beneath which the hydra, described
    as a water-snake, is said to have grown.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator accepts the hydra as unusually large and deadly and says Heracles
    treated his arrow-points with its gall, but states that it had one head rather
    than several.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Peisander of Camirus is said to have represented the hydra with many heads
    to make the beast more frightening and his poetry more remarkable.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Argives say Dionysus descended through the Alcyonian Lake to Hell to bring
    up Semele, and that Polymnus showed him the descent.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Alcyonian Lake is described as apparently calm, without known bottom,
    and dangerous because swimmers are dragged down and swept away.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: Annual nocturnal rites in honour of Dionysus are mentioned, but the narrator
    says he must not divulge them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Temenium is named after Temenus, contains sanctuaries of Poseidon and Aphrodite,
    and has a tomb of Temenus worshipped by the Dorians in Argos.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Nauplia is said to have been founded by Nauplius, reputed son of Poseidon
    and Amymone, and contains a sanctuary of Poseidon, harbours, and the spring Canathus.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: At Canathus the Argives say Hera bathes every year and recovers her maidenhood;
    this is described as a holy secret in Hera's mysteries.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: A local story says an ass improved future grape yields by nibbling vine shoots,
    and for that reason an ass was carved on a rock as the teacher of vine-pruning.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: At Apobathmi, the Argives say Danaus first landed in Argolis with his daughters.
  category: action
  evidence_refs:
  - ev:9
