canonical_text:
  quote: ''
  summary: 'The passage describes Argolid and Epidaurian places and traditions: the
    ruins and Cyclopean wall of Tiryns, altars on Mount Arachnaeus where sacrifices
    are made for rain, local genealogies for Epidaurus, and several traditions about
    the birth, exposure, rescue, divinity, healing power, cult diffusion, and sacrificial
    customs of Asclepius.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tiryns is described as a ruined city whose remaining wall was made by the
    Cyclopes from very large unwrought stones bound with smaller stones.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tiryns, the hero from whom the city derived its name, is said to have been
    a son of Argus, who was a son of Zeus.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: On Mount Arachnaeus there are altars to Zeus and Hera, and sacrifices are
    offered there when rain is needed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Several different parentages are reported for Epidaurus: son of Pelops, son
    of Argus son of Zeus, or child of Apollo.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Phlegyas is described as a powerful soldier who entered the Peloponnesus ostensibly
    to see the land but actually to spy out its people, and who made raids for crops
    and cattle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Phlegyas was accompanied by his daughter, who hid from him that she was pregnant
    by Apollo.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: In Epidaurian country the daughter bore a son and exposed him on the mountain
    then called Myrtium and now called Nipple.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The exposed child was given milk by one of the goats pasturing on the mountain
    and was guarded by the herd's watch-dog.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The herdsman Aresthanas found the child, saw lightning flashing from him,
    judged the child divine, and turned away.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Reports spread that Asclepius discovered whatever he wished for healing the
    sick and raised dead men to life.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: A second tradition says that Coronis, while pregnant with Asclepius, had intercourse
    with Ischys and was killed by Artemis as punishment for insulting Apollo.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the Coronis tradition, Hermes snatched the child from the flames after
    the pyre had already been lighted.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: A third account made Asclepius the son of Arsinoe, but the passage says a
    Delphic oracle identified him instead as the child of Coronis, daughter of Phlegyas.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage says famous sanctuaries of Asclepius originated from Epidaurus
    and lists cult connections with Athens, Pergamus, Smyrna, Cyrene, and Lebene in
    Crete.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: The Cyreneans sacrifice goats to Asclepius, while goat sacrifice is against
    Epidaurian custom.
  category: action
  evidence_refs:
  - ev:12
