canonical_text:
  quote: ''
  summary: 'Pausanias describes sites and legends around the Megarian and Corinthian
    region: sacred and accursed rocks connected with Sciron, Theseus, and a sea tortoise;
    Zeus Aphesius and Aeacus''s sacrifice during a drought; genealogical accounts
    of Corinthian place-names; Roman destruction and refoundation of Corinth; Theseus''s
    exploits against Phaea, Sinis, and other evildoers; Melicertes brought ashore
    by a dolphin and honored with games; failed efforts to cut through isthmuses;
    and a Corinthian divine land dispute between Poseidon and Helius arbitrated by
    Briareos.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Molurian Rock is described as sacred to Leucothea and Palaemon, while
    later rocks are described as accursed because Sciron cast strangers from them
    into the sea and a tortoise seized those who fell.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sciron is said to have been cast into the same sea by Theseus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: On a mountain is a temple of Zeus Aphesius; after Aeacus sacrificed to Zeus
    during a drought, Zeus sent rain and ended the drought.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage mentions the tomb of Eurystheus and a boundary where Hyllus, son
    of Heracles, is said to have fought Echemus in a duel.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: A cited Corinthian account says Ephyra first dwelt in the land, Marathon later
    divided his kingdom among his sons, and Asopia and Ephyraea were renamed after
    Sicyon and Corinthus.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Corinth is described as no longer inhabited by old Corinthians but by Roman
    colonists after war, destruction by Mummius, and later refoundation by Caesar.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: At Cromyon, Phaea the sow is said to have been bred, and overcoming her is
    listed among the traditional achievements of Theseus.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Near a shore pine and an altar of Melicertes, the boy is said to have been
    brought ashore by a dolphin; Sisyphus found him, buried him on the Isthmus, and
    established the Isthmian games in his honor.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Sinis is said to have tied defeated victims to bent pine trees so that the
    trees tore them in two; the passage says Sinis himself was slain in this way by
    Theseus.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Theseus is said to have rid the road from Troezen to Athens of evildoers,
    including Periphetes, who fought with a bronze club.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Attempts to cut through isthmuses are described as abandoned, unsuccessful,
