canonical_text:
  quote: ''
  summary: The passage describes sites on the road from Mycenae to Argos, including
    a hero-shrine of Perseus, the grave of Thyestes with a stone ram, a sanctuary
    of Mysian Demeter, the river Inachus, an altar of Helius, and a sanctuary of Eileithyia.
    It recounts the golden lamb, Atreus's retaliation against Thyestes, inherited
    pollution and punishment, the curing of Argive women by Melampus in exchange for
    a royal share, the division and later reunification of Argive kingship, Orestes's
    rule, and the return and claims of the Heracleidae followed by expulsions and
    migrations.
  language: English
  quote_policy: summarized
