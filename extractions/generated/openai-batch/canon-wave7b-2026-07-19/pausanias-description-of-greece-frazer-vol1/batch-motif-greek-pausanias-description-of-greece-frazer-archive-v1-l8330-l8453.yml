canonical_text:
  quote: ''
  summary: Pausanias describes sacred places around Troezen and Calaurea, including
    fountains, temples, springs, named rocks and trees, stories of Theseus, Hippolytus,
    Poseidon, Aethra, Athena, Apollo, and Poseidon, as well as a comparison of the
    misfortunes of Homer and Demosthenes and an account related to Harpalus's bribes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fountain before the house of Hippolytus is called the Fountain of Heracles
    because the Troezenians say Heracles discovered the water.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A sanctuary of Pan Lyterius is named from a story that Pan showed the Troezenian
    magistrates dreams that supplied a cure for an epidemic.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A spring of the river Hyllicus was originally called Taurius, and a rock called
    the Rock of Theseus changed its name after Theseus took up Aegeus's boots and
    sword from under it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Near the Rock of Theseus stands a sanctuary of Aphrodite Nymphia, said to
    have been made by Theseus when he took Helen to wife.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Troezenians say Poseidon, angered with them, struck the land with barrenness
    by sending brine to seeds and roots until sacrifices and prayers appeased him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A place called Birthplace is identified as the place where Theseus is said
    to have been born.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: A temple of Ares marks a place where Theseus is said to have conquered the
    Amazons in battle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A wild olive called the Bent Rhacos is explained as the tree in which the
    reins caught when Hippolytus's chariot was upset.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The island once called Sphaeria was renamed Sacred Island after Aethra crossed
    to it in obedience to a dream from Athena, made libations for Sphaerus, and Poseidon
    was said to have had intercourse with her there.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Aethra set up a temple of Athena Apaturia on the island and established a
    custom for Troezenian maidens to dedicate their girdles before marriage.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A legend says Calaurea was once sacred to Apollo when Delphi was sacred to
    Poseidon, and that the two gods exchanged the two places.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: A holy sanctuary of Poseidon on Calaurea is served by a maiden priestess until
    she reaches an age fit for marriage.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The narrator compares the fates of Homer and Demosthenes as examples that,
