  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: In the Harpalus affair, a dispatch naming those who took bribes did not mention
    Demosthenes, despite hostility toward him.
  category: sequence
  evidence_refs:
  - ev:10
