    shared mythic origin.
- id: claim:2
  claim: The passage presents Calaurea and Delphi as paired sanctuaries in a divine
    exchange between Apollo and Poseidon.
  claim_level: same_motif
  target: Greek sanctuary-exchange legend involving Apollo and Poseidon
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The passage only summarizes the legend and quotes an oracle; it does
    not narrate the circumstances of the exchange.
- id: claim:3
  claim: The passage links the Troezenian Amazon battle site to the broader Attic
    conflict of the Amazons against Theseus and the Athenians.
  claim_level: same_motif
  target: Attic Amazonomachy tradition of Amazons fighting Theseus and the Athenians
  evidence_refs:
