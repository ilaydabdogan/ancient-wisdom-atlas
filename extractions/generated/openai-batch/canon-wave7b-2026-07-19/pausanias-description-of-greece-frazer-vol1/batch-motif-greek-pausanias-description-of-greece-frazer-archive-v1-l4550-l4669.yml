candidate_motifs:
- id: motif:1
  label: Oracle-directed burial place
  taxonomy_refs: []
  basis: A dispute over Alcmena's corpse is resolved by a Delphic oracle ordering
    burial in Megara.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents this as reported local tradition rather than an independently
    verified event.
- id: motif:2
  label: Water diversion followed by altar foundation
  taxonomy_refs: []
  basis: Theagenes diverts water once flowing from the mountains and makes an altar
    to Acheloüs at the site.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage does not elaborate a mythic narrative beyond the topographic
    explanation and cult foundation.
- id: motif:3
  label: Beast-slaying wins marriage and kingship
  taxonomy_refs:
  - royal_legitimacy
  - culture_hero
  basis: Megareus promises his daughter and royal succession to the killer of the
    deadly Cithaeronian lion; Alcathous kills it and comes to the throne.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The culture-hero classification is limited; the passage emphasizes kingship,
    marriage reward, and sanctuary foundation more than broad culture-giving acts.
- id: motif:4
  label: Hero tomb and local civic honors
  taxonomy_refs: []
  basis: Several named figures are associated with tombs, shrines, barrows, or civic
    honors at Megara, including Alcmena, Hyllus, Pandion, Hippolyte, and Tereus.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: This is a recurring topographic-cult pattern in the passage, not a single
    continuous mythic episode.
- id: motif:5
  label: Defeated warrior woman dies in exile and receives distinctive burial
  taxonomy_refs: []
  basis: Hippolyte, leader of the Amazons, escapes defeat with a few others, dies
    in despair at Megara, and receives a tomb shaped like an Amazonian shield.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage gives only a brief local account and does not develop the
    Amazon campaign beyond its cause and aftermath.
- id: motif:6
  label: Revenge, lamentation, and reported transformation into birds
  taxonomy_refs:
  - shapeshifter
  basis: The women connected with the Tereus story lament their sufferings and revenge,
    die through tears, and are reported to have been transformed into a nightingale
    and a swallow.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: Pausanias explicitly rationalizes the metamorphosis report as arising
    from the plaintive notes of the birds, so the passage both records and questions
    the transformation motif.
- id: motif:7
  label: Substitute material in annual sacrifice
  taxonomy_refs:
  - sacrifice
  basis: The Megarians annually sacrifice to Tereus using gravel instead of barley
    meal.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage does not explain why gravel replaces barley meal.
