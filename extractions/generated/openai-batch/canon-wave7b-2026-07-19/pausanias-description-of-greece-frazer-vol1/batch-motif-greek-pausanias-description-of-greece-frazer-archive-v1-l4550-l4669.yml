canonical_text:
  quote: ''
  summary: 'Pausanias describes tombs, shrines, local Megarian traditions, and his
    own critiques while descending from the citadel: the oracle-directed burial of
    Alcmena; a diverted stream and altar to Acheloüs; the tomb of Hyllus; Alcathous''s
    killing of the Cithaeronian lion, marriage reward, kingship, and sanctuary foundation;
    the shrine of Pandion; Hippolyte''s defeat, death, and shield-shaped tomb; and
    the grave and cult of Tereus, including annual gravel sacrifice and a reported
    bird-metamorphosis tradition involving lamenting women.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Alcmena's tomb is said to be near the Olympieum, and an oracle from Delphi
    resolved a dispute over whether her corpse should be taken to Argos or Thebes
    by directing burial at Megara.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A place called Rhus is explained as a former stream-site where water once
    flowed from the mountains above the city; Theagenes diverted the water and made
    an altar to Acheloüs.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hyllus, son of Heracles, is said to be buried at Megara near the place associated
    with his duel with Echemus.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Near the tomb of Hyllus are a temple of Isis and temples of Apollo and Artemis,
    which Alcathous is said to have made after killing the Cithaeronian lion.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Cithaeronian lion is said to have killed many people, including Euippus,
    son of King Megareus.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Megareus promised his daughter and succession to the kingdom to whoever killed
    the Cithaeronian lion; Alcathous attacked and overcame the beast, then built the
    sanctuary after coming to the throne.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Pausanias explicitly questions parts of the Megarian account and argues that
    the Megarians conceal a different political history concerning Nisus, Megareus,
    Alcathous, and the destroyed city wall.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A shrine of the hero Pandion stands near the sanctuary, and Pandion is said
    to receive honors in the city as well as to have been buried on the Rock of Athena
    Aethyia.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hippolyte, sister of Antiope and leader of the Amazons on this occasion, is
    said to have escaped to Megara after defeat by Theseus and to have died there
    in despair.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Megarians buried Hippolyte, and the shape of her tomb is described as
    like an Amazonian shield.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Tereus is said to have married Procne, daughter of Pandion; the Megarians
    locate his kingship near Pagae, while Pausanias favors Daulis beyond Chaeronea.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: After Tereus did something to Philomela and Itys suffered at the hands of
    women, Tereus could not seize the women and committed suicide at Megara, where
    a barrow was raised for him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Megarians sacrifice to Tereus every year using gravel instead of barley
    meal, and they say the hoopoe first appeared there.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The women in the Tereus story are said to have gone to Athens, lamented their
    sufferings and revenge, died through their tears, and were reported to have been
    transformed into a nightingale and a swallow; Pausanias explains the report by
    the plaintive notes of those birds.
  category: sequence
  evidence_refs:
  - ev:9
