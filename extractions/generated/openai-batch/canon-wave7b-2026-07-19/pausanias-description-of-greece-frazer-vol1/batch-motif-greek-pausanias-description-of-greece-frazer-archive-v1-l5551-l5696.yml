canonical_text:
  quote: ''
  summary: The passage recounts Sicyonian origin traditions, royal genealogies, divine-mortal
    parentage claims, Demeter's disguised care for a threatened child, the abduction
    of Antiope and resulting Theban conflict, a temple omen involving olive oil, the
    roadside birth and poetic traditions about Zethus and Amphion, later Sicyonian
    succession, conquest, refounding, and a cited Homeric saying about Zeus leveling
    cities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Corinthians are said to have built a temple for Olympian Zeus, and sudden
    fire fell on it and destroyed it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sicyonians say Aegialeus was their land's first aboriginal inhabitant,
    that the district Aegialus was named for him, that he founded Aegialea, and that
    their old citadel was where the sanctuary of Athena stood.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Sicyonian genealogy runs from Aegialeus through Europs and Telchis to
    Apis; Apis is said to have become so powerful that territory south of the Isthmus
    was called Apia after him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Leucippus had only a daughter, Calchinia; a story says Calchinia mated with
    Poseidon, and her child Peratus was reared by Leucippus and received the kingdom
    from him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: All children born to Plemnaeus by his wife died when they first wailed, until
    Demeter pitied him, came to Aegialea in the guise of a strange woman, and reared
    his son Orthopolis.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Orthopolis had a daughter Chrysorthe, who is thought to have borne Coronus
    to Apollo; Coronus had two sons, Corax and Lamedon.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: After Corax died without issue, Epopeus came from Thessaly and took the kingdom;
    Antiope was famed for beauty and was reported by some to be the daughter of Asopus
    rather than Nycteus.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Epopeus carried off Antiope; the Thebans came against him in arms, Nycteus
    and Epopeus were both wounded, and Epopeus won the battle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When dying, Nycteus appointed Lycus regent and guardian, and asked him to
    attack Aegialea with a larger army, avenge Epopeus's action, and punish Antiope
    if she were taken.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Epopeus sacrificed for victory, began and completed a temple of Athena, prayed
    for a sign that the temple pleased the goddess, and olive oil then flowed before
    the temple.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Epopeus died from his neglected wound; after him Lamedon became king and gave
    up Antiope, removing the need for Lycus to wage war.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: As Antiope was being taken toward Thebes by way of Eleutherae, she gave birth
    on the road; Asius says Zethus and Amphion were her sons and names Asopus, Zeus,
    and Epopeus in their parentage, while Homer says they were the first founders
    of Thebes.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Lamedon married Pheno of Athens, later allied with Sicyon from Attica, gave
    him Zeuxippe as wife, and Sicyon became king; the land and city were then named
    Sicyonia and Sicyon.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Later genealogy includes Chthonophyle and Hermes as parents of Polybus, Phlias
    as son of Dionysus, Phaestus as a child of Heracles, and Zeuxippus as son of Apollo
    and the nymph Syllis.
  category: relationship
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:15
  text: Agamemnon attacked Sicyon and Hippolytus, causing Hippolytus to accept subjection;
    later Phalces and the Dorians surprised Sicyon by night but spared Lacestades
    because he too was one of the Heracleidae and made him partner in the kingdom.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: The Sicyonians thereafter became Dorians; the city built by Aegialeus was
    destroyed by Demetrius son of Antigonus, who founded the modern city near the
    ancient citadel, and the passage cites a Homeric saying about Zeus leveling strongholds.
  category: sequence
  evidence_refs:
  - ev:13
