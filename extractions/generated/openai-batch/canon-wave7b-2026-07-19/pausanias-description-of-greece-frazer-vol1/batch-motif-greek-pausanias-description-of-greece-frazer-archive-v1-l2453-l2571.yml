  quote: ''
  summary: The passage describes monuments and images near the Athenian theatre and
    sanctuary of Dionysus, including painted myths of Dionysus, Hephaestus, Hera,
    Pentheus, Lycurgus, Ariadne, and Theseus; recounts Sulla's capture of Athens and
    the killing of Aristion after refuge in Athena's sanctuary; reports visions involving
    Dionysus and poets; and notes dedications of Medusa, Apollo, Artemis, and Niobe-related
    imagery near the Acropolis.
  language: English
  quote_policy: summarized
