    with Eleusis.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Pausanias reports numerous local divine epithets and images at Phlya, Myrrhinus,
    and Athmonia, and states that local guides knew nothing about some deities, leading
    him to offer his own conjectures.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The Myrrhinusians say Colaenus was a man who ruled before Cecrops, and Pausanias
    connects the name Colaenis with him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Acharnae, Dionysus is called Singer and Ivy, and the inhabitants say that
    the plant ivy first appeared there.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'The Attic mountains are described with practical features: Pentelicus has
    quarries, Parnes has wild boar and bear hunting, and Hymettus has notable bee
    pasture; the Alazones are said to have free-ranging bees that are not kept in
    hives.'
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Athenians maintain statues and altars of gods on mountains, including
    forms of Athena, Zeus, and Apollo; on Parnes they sacrifice to Zeus as Rain-god
    or Averter of Ills.
  category: action
  evidence_refs:
  - ev:8
