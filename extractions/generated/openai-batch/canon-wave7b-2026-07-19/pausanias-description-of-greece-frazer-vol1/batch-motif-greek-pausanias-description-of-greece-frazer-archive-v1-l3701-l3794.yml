canonical_text:
  quote: ''
  summary: Pausanias catalogs noteworthy cult sites, local stories, graves, divine
    epithets, sacred offerings, mountains, animals, and mountain altars in Attic parishes.
    The passage includes the naming of Zoster from Leto loosening her girdle, a relay
    of Hyperborean first-fruits to Delos, local cult-name explanations, a claim that
    ivy first appeared at Acharnae, and mountain cults of Zeus, Athena, and Apollo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several Attic parishes are described by their sanctuaries and altars, including
    cults of Demeter and the Maid, Leto, Apollo, Artemis, Athena, the Mother of the
    gods, the Dioscuri, and others.
  category: setting
  evidence_refs:
  - ev:1
  - ev:4
  - ev:6
- id: obs:2
  text: At Zoster, Leto is said not to have given birth there, but to have loosened
    her girdle in preparation for delivery; the place-name is explained from this
    incident.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: First-fruits attributed to the Hyperboreans are passed through a sequence
    of peoples and places before reaching Delos; the offerings are hidden in wheat
    straw and are not openly known.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A monument at Prasiae commemorates Erysichthon, who died on his return voyage
    from Delos after a sacred mission.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cranaus is said to have fled to Lamptrae, died, and been buried there, while
