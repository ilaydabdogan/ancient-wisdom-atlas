canonical_text:
  quote: ''
  summary: The passage recounts Hyrnetho’s refusal to leave Deiphontes, her seizure
    by Cerynes and Phalces, Deiphontes’ pursuit, Cerynes’ death, and Phalces’ killing
    of the pregnant Hyrnetho. Deiphontes and his children carry her body to the place
    later called Hyrnethium, establish a hero-shrine and honors, and leave fallen
    pieces of local trees sacred to her. The passage then lists nearby tombs and sacred
    sites in Epidaurus, and gives an origin account for Aegina in which Zeus brings
    Aegina to an uninhabited island and later raises inhabitants from the earth at
    Aeacus’ request.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young men accused Deiphontes, urged Hyrnetho to return to Argos, and promised
    her a husband they described as better and more prosperous than Deiphontes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hyrnetho answered by defending Deiphontes as a dear husband and blameless
    son-in-law to Temenus, and by calling the young men murderers of Temenus rather
    than his sons.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The youths seized Hyrnetho, put her in a chariot, and drove away; Cerynes
    and Phalces are named as taking her against her will.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: An Epidaurian informed Deiphontes, who rushed to the rescue and was reinforced
    by Epidaurians.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When Deiphontes overtook the runaways, he shot and killed Cerynes but avoided
    shooting at Phalces because Phalces was holding Hyrnetho.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Phalces dragged Hyrnetho with greater violence and killed her while she was
    pregnant, then drove the chariot recklessly after realizing he had killed his
    sister.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Deiphontes and his children took Hyrnetho’s body to the place later called
    Hyrnethium, built a hero-shrine for her, and gave her various honors.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A custom at Hyrnethium forbade carrying home or using broken pieces from the
    olive trees or other trees growing there; the pieces were left on the spot as
    sacred to Hyrnetho.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Near the city were tombs of Melissa, wife of Periander, and Procles, father
    of Melissa; Procles and Periander are described as tyrants of Epidaurus and Corinth
    respectively.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Epidaurus contained a precinct of Asclepius with images of Asclepius and Epione,
    temples of Dionysus and Artemis, a sanctuary of Aphrodite, a sanctuary attributed
    to Hera by the harbour, and a wooden image of Athena Cissaea on the citadel.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The island opposite Epidauria was said to have had no people at first; after
    Zeus brought Aegina there, its name was changed from Oenone to Aegina.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: When Aeacus grew up and asked Zeus for settlers, Zeus raised the inhabitants
    from the earth.
  category: action
  evidence_refs:
  - ev:8
