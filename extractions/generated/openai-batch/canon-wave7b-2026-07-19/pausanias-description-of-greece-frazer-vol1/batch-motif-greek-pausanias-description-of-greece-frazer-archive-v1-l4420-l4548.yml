  summary: Pausanias reports Megarian accounts of the district's political origins,
    royal genealogies, city-name traditions, sanctuaries, and monuments. The passage
    includes the Sithnid nymphs, a son of Zeus who survives Deucalion's flood by reaching
    Mount Gerania, a story of Artemis Saviour aiding Megarians against a Persian detachment,
    an unfinished image of Zeus associated with the Seasons and Fates, and cult places
    on the citadel.
