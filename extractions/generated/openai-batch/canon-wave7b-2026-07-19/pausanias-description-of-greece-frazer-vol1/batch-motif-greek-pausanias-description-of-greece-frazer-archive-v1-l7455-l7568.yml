  summary: The passage describes roads from Argos and nearby mountains, sanctuaries,
    cult images, springs, sacrifices, graves, ruins, etiological place-name stories,
    beacon signals connected with Lynceus and Hypermnestra, references to Homeric
    geography, and a pyramid-like tomb associated with the fight between Proetus and
    Acrisius.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mount Lycone is described as tree-covered, chiefly with cypresses, and has
    a sanctuary of Artemis Orthia on its summit with white-marble images of Apollo,
    Leto, and Artemis.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Near Mount Chaon, cultivated trees grow at the foot of the mountain, and the
    water of the Erasinus rises to the surface there after flowing from Stymphalus
    in Arcadia.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the places where the Erasinus gushes from the mountain, sacrifices are
    made to Dionysus and Pan, and a festival called Tyrbe is held for Dionysus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cenchreae is associated with common graves of Argives who conquered the Lacedaemonians
    at Hysiae; the ruins of Hysiae are later encountered on lower ground.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the road to Mantinea there is a two-room sanctuary with west and east entrances,
    containing wooden images of Ares and Aphrodite said to be votive offerings of
    Polyneices and the Argives who joined his campaign.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Oeneus is said to have been driven from his throne by the sons of Agrius,
    taken refuge with Diomedes at Argos, received aid in an expedition to Calydonia,
    been cared for by Diomedes, and buried at Oenoé, which was named after him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mount Artemisius above Oenoé has a sanctuary of Artemis on its summit and
    the springs of the river Inachus, though the water does not run far.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Lynceus is said to have come to Lyrcea as the only one of fifty brothers to
    escape death, and to have raised a beacon as an agreed signal to Hypermnestra
    that he had escaped Danaus and reached safety.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hypermnestra is said to have lighted a beacon on Larisa to show that she too
    was out of danger, and the Argives therefore hold an annual beacon festival.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage gives place-name explanations for Lyrcea from Lyrcus and Orneae
    from Orneus, and notes a figure of Lyrcus on a slab among the ruins.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Orneae there is a sanctuary with an upright wooden image of Artemis and
    a temple devoted to all the gods in common.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: On the road to Epidauria there is a pyramid-like building with relief shields;
    it is associated with a fight for the throne between Proetus and Acrisius, a drawn
    contest, reconciliation, the first use of shields in that battle, and a common
    tomb for the fallen.
  category: sequence
  evidence_refs:
  - ev:9
