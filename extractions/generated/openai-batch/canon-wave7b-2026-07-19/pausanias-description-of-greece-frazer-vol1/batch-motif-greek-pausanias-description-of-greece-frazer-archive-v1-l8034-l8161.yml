canonical_text:
  quote: ''
  summary: Pausanias describes cult images and sanctuaries on Aegina, including Hecate
    rites and the cult of Aphaea/Britomartis, then summarizes stories of Auxesia and
    Damia, Troezenian origins, a land dispute between Athena and Poseidon, and Saron’s
    fatal hunt that gives the Saronic sea its name.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Three temples stand close together, dedicated to Apollo, Artemis, and Dionysus;
    Apollo’s wooden image is naked, Artemis is dressed, and Dionysus is dressed and
    bearded.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sanctuary of Asclepius is in another place, and his image is stone and
    seated.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Aeginetans especially worship Hecate and celebrate yearly mystic rites
    that they say Orpheus the Thracian established among them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Hecate image in the Aeginetan enclosure is wooden, made by Myron, and
    has one face and one body; Pausanias contrasts it with an Athenian form of three
    Hecate images attached to one another.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A sanctuary of Aphaea lies on the way toward the mountain of Zeus, God of
    all the Greeks.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Cretan story, Britomartis is daughter of Zeus and Carme, delights in
    running and hunting, is dear to Artemis, flees Minos, and throws herself into
    fishing nets.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Artemis makes Britomartis a goddess; she is worshipped by Cretans and Aeginetans
    and is called Aphaea in Aegina and Dictynna in Crete.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Pausanias summarizes the story of Auxesia and Damia as involving drought,
    an oracle, olive-wood images from the Athenians, a broken payment agreement, and
    Athenians who died while trying to recover the images.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Pausanias says he saw the images of Auxesia and Damia and sacrificed to them
    in the way customary at Eleusis.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Troezenians claim Orus was first born in their land and became king, and
    that Althepus, son of Poseidon and Leis, inherited the kingdom after him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: During Althepus’s reign, Athena and Poseidon disputed over the land and then
    held it in common as Zeus commanded; the Troezenians worship both deities and
    place a trident and Athena’s face on old coins.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Saron built a sanctuary of Artemis by a shallow marshy sea, chased a doe into
    the sea, followed it into the open ocean, lost his strength, drowned, was buried
    in Artemis’s sacred enclosure, and gave his name to the Saronic sea.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Hyperes and Anthas are said to be sons of Poseidon and Alcyone and founders
    of Hyperea and Anthea; Pittheus later incorporated these places into a city named
    Troezen after his brother.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Descendants of Aetius are described as colonists from Troezen who founded
    Halicarnassus and Myndus, while Anaphlystus and Sphettus migrated to Attica and
    gave their names to parishes.
  category: sequence
  evidence_refs:
  - ev:9
