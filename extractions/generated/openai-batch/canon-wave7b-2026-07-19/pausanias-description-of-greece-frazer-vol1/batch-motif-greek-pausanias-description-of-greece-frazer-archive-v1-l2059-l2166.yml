canonical_text:
  quote: ''
  summary: The passage describes monuments and paintings in and near the Athenian
    Painted Portico, including battle scenes, heroic and divine portraits, trophies,
    shields, statues of Solon and Seleucus, an omen at Seleucus's sacrifice to Zeus,
    Seleucus's later career and religious acts, and an altar to Mercy in the Athenian
    market-place.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Near the Painted Portico are a bronze statue of Hermes of the Market-place
    and a gate bearing a trophy erected by Athenians after a cavalry victory over
    Pleistarchus.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Painted Portico includes a painting of Athenians arrayed against Lacedaemonians
    at Oenoe, shown at the beginning of the fight before close combat.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The middle wall depicts Athenians and Theseus fighting Amazons.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says the Amazons did not lose reckless courage despite defeats,
    including the taking of Themiscyra by Heracles and the destruction of an army
    sent to Athens; they later came to Troy to fight Greeks and Athenians.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Troy scene shows Greeks after taking Troy, kings assembled because of Ajax's
    outrage against Cassandra, and includes Ajax, Cassandra, and other captive women.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Marathon painting shows Plataeans and the Attic contingent fighting foreigners,
    foreigners fleeing into a morass, Phoenician ships, and Greeks killing foreigners
    who scramble into the ships.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Marathon painting also includes the hero Marathon, Theseus represented
    as coming up from the under-world, Athena, and Heracles.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that Marathonians were, according to their own account,
    the first to regard Heracles as a god.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Dedicated bronze shields are present; some are inscribed as taken from Scioneans
    and their allies, and others are said to be Lacedaemonian shields from prisoners
    at Sphacteria.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Bronze statues of Solon and Seleucus stand in or near the area of the Portico.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Seleucus's future prosperity is said to have been foreshadowed by unmistakable
    signs.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: While Seleucus sacrificed at Pella to Zeus before setting out from Macedonia
    with Alexander, wood on the altar moved by itself to the image and caught fire
    without a light being applied.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Seleucus fled to Ptolemy after Alexander's death, returned to Babylon, defeated
    Antigonus, captured Demetrius, and later entrusted his Asian empire to Antiochus
    before being assassinated by Ptolemy called the Thunderbolt.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Pausanias says Seleucus was especially righteous and religious, citing his
    return of a bronze Apollo carried by Xerxes to Ecbatana.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: When Seleucus founded Seleucea on the Tigris and brought Babylonian colonists
    there, he spared Babylon's wall and the sanctuary of Bel and permitted Chaldeans
    to live near it.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: In the Athenian market-place is an altar to Mercy, a divinity described as
    useful in mortal life and the changes of fortune, and Pausanias says Athenians
    alone among Greeks honor Mercy.
  category: object
  evidence_refs:
  - ev:13
