comparison_claims:
- id: claim:1
  claim: 'The passage itself links multiple Amazon-war episodes as a recurring Greek
    narrative pattern: Heracles at Themiscyra, an Amazon army against Athens, and
    Amazons at Troy against Greeks and Athenians.'
  claim_level: same_motif
  target: Greek Amazon-war episodes involving Heracles, Athens, and Troy
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage lists related episodes but does not analyze their origin
    or transmission.
- id: claim:2
  claim: The passage presents the Athenian cult of Mercy as exceptional within Greek
    practice by saying Athenians alone among Greeks honor Mercy.
  claim_level: same_function
  target: Athenian worship of Mercy compared with other Greek communities
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to Pausanias's statement in this passage and does
    not independently verify wider Greek practice.
- id: claim:3
  claim: The Seleucus omen functions as a sign of future prosperity attached to a
    ruler's sacrificial act.
  claim_level: same_function
  target: sacrificial omen marking future royal fortune
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supports the omen's function for Seleucus but does not
    compare it with other omen stories.
