  summary: The passage gives genealogical and historical notes on the Aeacidae and
    Aegina, describes Aegina's difficult sea approach as attributed to Aeacus, records
    the shrine of Aeacus and an embassy during a Greek drought in which Aeacus obtains
    rain from Zeus by sacrifice and prayer, and narrates the killing of Phocus by
    Peleus with Telamon's subsequent exclusion and exile.
