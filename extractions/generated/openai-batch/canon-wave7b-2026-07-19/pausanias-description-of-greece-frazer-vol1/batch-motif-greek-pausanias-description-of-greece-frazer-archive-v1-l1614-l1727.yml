canonical_text:
  quote: ''
  summary: The passage recounts dynastic conflict involving Lysimachus, Arsinoe, Agathocles,
    Lysandra, Seleucus, and Philetaerus; the defeat and burial of Lysimachus; and
    genealogical and political traditions concerning Pyrrhus, Andromache, Helenus,
    the Epeirot royal line, Olympias, Aeacides, Alcetas, and the restoration of Pyrrhus
    by Ptolemy.
  language: English
  quote_policy: summarized
