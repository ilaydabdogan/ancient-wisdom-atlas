candidate_motifs:
- id: motif:1
  label: genealogical royal legitimacy
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage establishes Pyrrhus' and Epeirot rulers' claims through named
    ancestors, especially descent from Pyrrhus son of Achilles through Pielus, and
    records transfers of kingdom and descent lines.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:11
  confidence: medium
  cautions: The passage presents genealogy and succession, but does not explicitly
    state a ritual or divine legitimation claim.
- id: motif:2
  label: dynastic flight to an external protector
  taxonomy_refs:
  - departure
  basis: Lysandra flees to Seleucus after Agathocles' death, and young Pyrrhus goes
    to Ptolemy in Egypt when attacked by Cassander.
  evidence_refs:
  - ev:3
  - ev:16
  confidence: medium
  cautions: These are historical-political departures rather than clearly mythic exile
    episodes.
- id: motif:3
  label: restoration of a displaced young ruler
  taxonomy_refs:
  - return
  - royal_legitimacy
  basis: After being attacked before consolidating his rule, Pyrrhus seeks Ptolemy's
    protection and is restored by an Egyptian force.
  evidence_refs:
  - ev:16
  confidence: medium
  cautions: The text reports restoration but gives limited detail about the return
    itself.
- id: motif:4
  label: oracle-guided settlement
  taxonomy_refs:
  - wisdom
  basis: Pyrrhus son of Achilles is said to have dwelt in Epeirus because of the oracles
    of Helenus.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The content of the oracle is not quoted, and the passage gives no ritual
    context.
- id: motif:5
  label: single combat for a kingdom
  taxonomy_refs: []
  basis: Pergamus crosses into Asia and kills Areius, who fights him in single combat
