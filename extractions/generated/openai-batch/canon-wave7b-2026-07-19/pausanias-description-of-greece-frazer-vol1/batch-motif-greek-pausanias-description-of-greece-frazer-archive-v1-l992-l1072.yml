  quote: ''
  summary: The passage moves from a genealogical note on Theseus and Athenian kingship
    to descriptions of painted and sculpted works in Athens, including Apollo with
    a plague-averting title. It then describes the Gauls/Celts, their remote geography
    near a great sea and the Eridanus myth of Helius's daughters mourning Phaethon,
    and recounts the Gallic advance toward Greece and the Athenians' defense at Thermopylae
    under Callippus.
  language: English
  quote_policy: summarized
