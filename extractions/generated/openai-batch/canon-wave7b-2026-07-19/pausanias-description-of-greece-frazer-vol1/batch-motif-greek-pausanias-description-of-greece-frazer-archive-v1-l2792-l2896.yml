candidate_motifs:
- id: motif:1
  label: Hidden warriors inside a constructed horse
  taxonomy_refs: []
  basis: The horse is described as a contrivance and as a bronze design fitting the
    legend that it contained valiant Greeks, with named warriors peeping out.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives the object and legend but does not develop the larger
    Trojan narrative.
- id: motif:2
  label: Heroic combat with monstrous or dangerous beings
  taxonomy_refs:
  - serpent
  basis: Perseus is represented after beheading Medusa, Theseus fights the Bull of
    Minos, and Heracles strangles serpents.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:6
  confidence: high
  cautions: The monster-combat examples are brief statue descriptions; only the serpents
    map directly to an available taxonomy reference.
- id: motif:3
  label: Divine punishment connected with rejected flutes
  taxonomy_refs:
  - divine_judgment
  basis: Athena is represented striking Marsyas because he took up flutes she wished
    to cast away.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage states the striking action and its cause but does not narrate
    a formal judgment scene.
- id: motif:4
  label: Transport by animal followed by sacrifice of the animal
  taxonomy_refs:
  - sacrifice
  basis: Phrixus is carried ashore by the ram and then sacrifices it, cutting out
    and burning the thighs.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The deity receiving the sacrifice is not identified with certainty in
    the passage.
- id: motif:5
  label: Birth of a goddess from the body of a divine parent
  taxonomy_refs:
  - sacred_birth
  - divine_parent_child
  basis: Athena is represented coming up out of Zeus’s head, and the Parthenon entrance
    pediment refers to Athena’s birth.
  evidence_refs:
