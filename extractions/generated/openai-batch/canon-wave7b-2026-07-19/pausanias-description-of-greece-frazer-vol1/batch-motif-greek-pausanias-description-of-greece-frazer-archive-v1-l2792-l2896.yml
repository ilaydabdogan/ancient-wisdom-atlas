canonical_text:
  quote: ''
  summary: Pausanias describes objects, statues, cult images, and sculptural programs
    on the Athenian Acropolis, including mythic representations of Perseus and Medusa,
    the Wooden Horse, Athena and Marsyas, Theseus and the Bull of Minos, Phrixus and
    the ram, Heracles with serpents, Athena’s birth from Zeus, Earth asking Zeus for
    rain, Procne and Itys, Athena’s olive plant and Poseidon’s wave, the Zeus Polieus
    ox ritual, and Parthenon pediments showing Athena’s birth and the contest between
    Athena and Poseidon.
  language: English
  quote_policy: summarized
