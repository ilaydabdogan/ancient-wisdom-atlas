canonical_text:
  quote: ''
  summary: The passage gives a series of ritual expiations for irregularities involving
    established sacred fires, including fires uniting with one another or with external
    fires, and for fast-day weeping, vow breach, or omitted lunar offerings. The remedies
    repeatedly prescribe a cake on eight potsherds to Agni under a specified epithet,
    or a libation in the Ahavaniya, with stated invitatory and offering verses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The excerpt opens in mid-question about a man’s fire; when the relevant fire
    can be seen, the former fire is to be removed and another put down, and when it
    cannot be seen, a cake or libation is prescribed to Agni with Agni.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a man’s Garhapatya and Ahavaniya fires unite together, the prescribed expiation
    is a cake on eight potsherds to Agni as delight, or a libation in the Ahavaniya.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If all of a man’s fires unite together, the prescribed expiation is directed
    to Agni as discrimination; if a man’s fire unites with other fires, the prescribed
    expiation is directed to Agni the charred.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If a man’s fires are involved in a village fire, the prescribed expiation
    is an offering to Agni the spoiler, or a libation in the Ahavaniya.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: If a man’s fires are united with a divine conflagration, the prescribed expiation
    is an offering to Agni as in the waters, or a libation in the Ahavaniya.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: If a man’s fires are united with the fire that burns a corpse, the prescribed
    expiation is an offering to Agni the pure, or a libation in the Ahavaniya.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: If a man’s fires are involved in a forest fire, the fires should be mounted
    on two fire sticks or a firebrand taken from the Ahavaniya or Garhapatya; if that
    cannot be done, an offering to Agni the spoiler or a libation in the Ahavaniya
    is prescribed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: If one who has established the fires weeps on the fast day, the prescribed
    expiation is an offering to Agni, supporter of vows, or a libation in the Ahavaniya.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: If one who has established the fires breaches his vow on the fast day, the
    prescribed expiation is an offering to Agni, lord of vows, or a libation in the
    Ahavaniya.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: If one who has established the fires omits the new-moon or full-moon offering,
    the prescribed expiation begins with a cake on eight potsherds to Agni, maker
    of ways, with specified verses.
  category: action
  evidence_refs:
  - ev:10
