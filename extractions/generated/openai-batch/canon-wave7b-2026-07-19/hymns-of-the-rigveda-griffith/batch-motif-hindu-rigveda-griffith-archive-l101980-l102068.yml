canonical_text:
  quote: ''
  summary: The passage gives ritual instructions involving recitation of metres, striking
    and transferring a lute with a fresh leafy udumbara branch, moving and mounting
    a swing with breath formulas, invoking divine groups to mount with metres, and
    arranging priestly seats near an altar. Notes compare some procedures with Sankhayana
    and Latyayana ritual texts and report Sayana's interpretation of the three-world
    formula.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The instructed actor recites a series of formulas saying that the object is
    produced with successive metres.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After going through the metres, the actor strikes the lute three times with
    the foot of a fresh leafy udumbara branch, using formulas for up-breathing, down-breathing,
    and cross-breathing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The actor hands the lute and branch over to the Saman singers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The actor touches the back plank of the swing and pushes it eastward, crosswise,
    and back toward himself, using formulas that compare the motions with breath functions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The actor repeats the words bhuh, bhuvah, and svar, then pushes the swing
    again in three directions with formulas for breath, cross-breathing, and down-breathing.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The actor invokes the Vasus, Rudras, Adityas, and All-gods as mounting the
    swing with named metres, and says that he mounts after them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The actor touches parts of the swing with elbows, hands, chin, thighs, and
    then mounts the swing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The actor's separate hand-touching of the front plank is compared to a serpent
    about to creep.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: After mounting, the actor places his feet near his own altar, and the instructions
