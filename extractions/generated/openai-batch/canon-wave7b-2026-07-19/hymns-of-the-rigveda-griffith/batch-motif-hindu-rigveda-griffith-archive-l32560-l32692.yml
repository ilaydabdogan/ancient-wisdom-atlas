canonical_text:
  quote: ''
  summary: The passage first recounts Svarbhanu obscuring Surya with darkness, Indra
    striking down Svarbhanu’s magic, and Atri or the Atris finding and restoring the
    Sun through sacred prayer and ritual praise. It then presents part of a Visvedevas
    hymn invoking many deities for preservation of holy Order, cattle, riches, offspring,
    sacrifice, and divine favor.
