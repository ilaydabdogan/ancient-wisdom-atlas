canonical_text:
  quote: ''
  summary: The passage presents Soma/Pavamana/Indu as a purified flowing deity-beverage
    who moves through filters, vats, streams, heaven, earth, and rain; is praised
    with animal, royal, luminous, and parental epithets; is directed toward Indra
    and the gods; and is invoked to grant strength, food, shelter, opulence, and nourishment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Purified Indu is asked to pour out hero strength, shelter, pasturage, opulence,
    and protection from oppression for the holy work.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A figure called Steer, Sage, and King rises above the sky, makes heavenly
    lights shine, passes through a filter with a roar, and has the milk of heaven
    drained from him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Loving Ones drain the mountain-haunting Steer, and the drop is described
    as grown in waters, lake, stream-wave, and cleansing sieve.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Loving Ones beseech an Eagle who has flown to heaven; hymns kiss a Youngling,
    a golden-coloured Bird resting on earth; a Gandharva rises to heaven’s vault and
    lights both worlds, the Parents.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:5
  text: Soma draughts and drops flow swiftly to the reservoir and toward Indra, compared
    with mares’ sons, eagles, chariot-steeds, waves, and milk-cows seeking a calf.
  category: action
  evidence_refs:
  - ev:7
- id: obs:6
  text: Soma is urged like a battle-steed toward the cloud-born reservoir of heaven,
    seeks the sieve over a woolly surface as a Steer, and is poured with milk into
    the vat by Rishis.
  category: action
  evidence_refs:
  - ev:8
- id: obs:7
  text: All-seeing Soma’s rays encompass all abodes; his beams travel round, and the
    Golden-hued one is cleansed on the sieve and rests in vats.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:8
  text: Soma flows as an ensign of sacrifice to the gods’ special place, speeds with
    thousand currents to the reservoir and filter, and moves in sea, streams, rivers,
    and the central point of earth.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:9
  text: Heaven and earth depend on Soma’s decree; he roars, flows to Indra, settles
    in jars, is called Father and begetter of the Gods, and enriches earth and heaven.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:10
  text: Soma flows to the beaker with thousand streams, rests in seats where Mitra
    dwells, stands in the forefront of rivers, hymn, and kine, shares booty in war,
    and is purified by worshippers.
  category: action
  evidence_refs:
  - ev:13
- id: obs:11
  text: Pavamana is compared to a sent-forth bird flowing to the fleecy sieve; Soma
    flows bright and pure between earth and heaven, fills the firmament, comes in
    rain, and summons his primeval Sire.
  category: action
  evidence_refs:
  - ev:14
- id: obs:12
  text: From the loftiest heaven Soma comes victorious to encounters, goes to Indra’s
    special place, and gains the beaker by a course of hundred paths.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:13
  text: Songs, worshippers, and milk-cows come near Soma; the hymn asks Soma, while
    being cleansed, to pour accumulated food, hero power, nourishment, strength, and
    meath three times daily.
  category: speech
  evidence_refs:
  - ev:16
