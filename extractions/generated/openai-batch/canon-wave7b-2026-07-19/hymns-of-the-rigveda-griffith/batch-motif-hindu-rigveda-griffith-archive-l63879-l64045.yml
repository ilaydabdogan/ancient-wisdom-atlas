candidate_motifs:
- id: motif:1
  label: Ritual purification and sacrificial offering of Soma
  taxonomy_refs:
  - sacrifice
  basis: The passage repeatedly describes Soma passing through filter or sieve, resting
    in vats, jars, reservoir, and beaker, being purified by worshippers, and advancing
    as an ensign of sacrifice to the gods’ special place.
  evidence_refs:
  - ev:2
  - ev:8
  - ev:9
  - ev:10
  - ev:13
  confidence: high
  cautions: The extraction treats the repeated ritual actions as a sacrifice motif
    without adding details beyond this passage.
- id: motif:2
  label: Soma’s movement between heaven, earth, and rain
  taxonomy_refs:
  - ascent
  basis: Soma rises above the sky, is connected with heaven’s vault, is an Eagle flown
    to heaven, flows between earth and heaven, comes in rain, and comes from loftiest
    heaven to earthly encounters.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:14
  - ev:15
  confidence: medium
  cautions: The passage includes both upward and downward movement; only the ascent
    aspect directly matches the supplied taxonomy term.
- id: motif:3
  label: Sacred exchange of offering and blessing
  taxonomy_refs:
  - sacred_exchange
  basis: Soma is purified and directed to Indra and the gods, while the hymn asks
    Soma to provide strength, shelter, food, nourishment, opulence, and meath to worshippers.
  evidence_refs:
  - ev:1
  - ev:7
  - ev:8
  - ev:10
  - ev:12
  - ev:16
  confidence: high
  cautions: The passage supports a ritual exchange pattern, but does not narrate a
    contractual covenant.
- id: motif:4
  label: Sacrificial center as central point of earth
  taxonomy_refs:
  - world_center
  basis: The hymn places Pavamana at the central point of earth while also describing
    him as high heaven’s Sustainer and moving amid heaven, earth, and waters; the
    note identifies the central point as the place of sacrifice.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The world-center reading relies partly on the translator’s explanatory
    note within the passage.
- id: motif:5
  label: Divine parent and progenitor relations
  taxonomy_refs:
  - divine_parent_child
  basis: Soma is called Father and begetter of the Gods, lights both worlds called
    the Parents, and summons his own primeval Sire.
  evidence_refs:
  - ev:5
  - ev:12
  - ev:14
  confidence: medium
  cautions: The familial language is explicit, but the relationships are hymnic and
    not narrated as a full genealogy.
- id: motif:6
  label: Multiple animal and divine forms of Soma
  taxonomy_refs: []
  basis: Soma is identified or compared with Steer, bull, Eagle, Youngling, golden
    Bird, Gandharva, King, Sage, and Lord; a note explicitly says Soma in one stanza
    is Eagle, Youngling, and golden Bird.
  evidence_refs:
