canonical_text:
  quote: ''
  summary: The passage explains several fivefold forms of sacrifice and their ritual
    correspondences; describes offerings to Indra, Pusan, Sarasvati, Bharati, and
    Agni; states that ritual knowledge and performance bring prosperity, union with
    deities, and access to Agni's dear home or the highest world. It then narrates
    a dispute among gods over first drinking Soma, resolved by a race in which Vayu
    leads and Indra bargains for a quarter share. It closes by assigning cups for
    paired deities to breath, speech, and other faculties.
  language: English
  quote_policy: summarized
