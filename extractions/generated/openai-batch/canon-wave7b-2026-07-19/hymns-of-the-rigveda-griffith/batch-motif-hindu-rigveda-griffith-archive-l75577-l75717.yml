canonical_text:
  quote: ''
  summary: The passage contains an Indra hymn section describing Indra’s force, his
    slaying of Vritra, release of rivers and kine, punishment of sinners and agreement-breakers,
    lordship over earth, heaven, waters, and mountains, and ritual invocation for
    aid. It then begins Hymn XC to Purusha, describing Purusha as a thousand-headed
    cosmic being, the totality of past and future, divided between creatures and heavenly
    immortality, linked in birth with Viraj, and offered in a primordial sacrifice
    by gods, Sadhyas, and Rishis.
  language: English
