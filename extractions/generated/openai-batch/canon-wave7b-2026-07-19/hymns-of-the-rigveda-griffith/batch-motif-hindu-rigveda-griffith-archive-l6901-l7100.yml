canonical_text:
  quote: ''
  summary: The passage contains an opening note and fragment, then Hymn 84 to Indra
    and the beginning of Hymn 85 to the Maruts. Hymn 84 invokes Indra with pressed
    Soma, praise, steeds, libations, cows and milk, and requests wealth and protection.
    It recalls Indra as slayer of Vritra and of ninety-nine Vritras with the bones
    of Dadhyach, mentions a horse's head found among mountains, and refers to Tvashtar's
    Bull in the mansion of the Moon. Later verses ask about Order, benediction, and
    offerings to Agni. Hymn 85 begins by describing the Maruts, Rudra's Sons, who
    increase heaven and earth and delight in sacrifices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sacred grass is trimmed for auspicious work, a hymn sounds praise to the sky,
    and a stone rings like a skilled singer; Indra delights when these approach him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Soma has been pressed for Indra, who is invited to come; Indra-vigour is asked
    to fill him, and his tawny coursers bring him to songs of praise and sacrifice
    performed by men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Indra is addressed as Slayer of Vritra and asked to mount his car; his Bay
    Steeds have been yoked by prayer, and the pressing-stone is asked to draw his
    attention.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Indra is invited to drink a poured libation; bright streams or drops flow
    to him at the seat of holy Law, and praise and reverence are directed to his might.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Indra is described as an unsurpassed charioteer when he yokes his steeds,
    and as the one who bestows wealth on mortal people who offer gifts.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bright cows drink Soma, dappled kine mingle Soma with their milk, milch-kine
    send forth Indra's death-dealing thunderbolt, and they follow his laws.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: With the bones of Dadhyach for his arms, Indra struck ninety-nine Vritras
    dead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A search for a horse's head among the mountains ends at Saryanavan; afterward
