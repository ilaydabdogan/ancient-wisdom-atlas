  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A source note says Dadhyach or Dadhicha was a Rishi, that the Asvins gave
    him a horse's head, that Indra cut it off, and that the bones of the horse's head
    became a thunderbolt used against demons who withheld rain.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: A sequence of questions asks who yokes strong steers to the pole of Order,
    who knows Indra present and near, and who sends benediction on offspring, household,
    wealth, person, and people.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: An offerer honors Agni with poured oil, offering, and ladle at appointed seasons;
