  quote: ''
  summary: The passage explains a sequence of ritual recitations in which speech,
    breath, seed, womb, bodily faculties, seasons, months, and divine powers are correlated.
    Silent praise develops seed; the Puroruc propagates it; verses to Agni are said
    to create and perfect faculties of the self and to order cosmic divisions. The
    one who knows the rite is said to come into being in a perfected form and go to
    the gods.
