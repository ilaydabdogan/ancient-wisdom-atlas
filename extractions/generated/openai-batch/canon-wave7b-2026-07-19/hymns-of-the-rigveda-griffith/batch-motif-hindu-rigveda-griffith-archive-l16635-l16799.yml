- id: obs:2
  text: Agni is called at night and morning, compared to milch-kine lowing to meet
    their young, and described as a messenger of heaven who lights human families
    through the night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Gods establish Agni at the region's base, and the notes identify that
