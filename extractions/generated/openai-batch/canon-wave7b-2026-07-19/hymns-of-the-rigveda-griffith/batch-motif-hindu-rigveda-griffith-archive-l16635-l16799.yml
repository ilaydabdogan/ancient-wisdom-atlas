canonical_text:
  quote: ''
  summary: The passage praises Agni as priest, messenger, herald, guest, king, and
    ritual fire who receives sacrifice and links human worshippers with gods, Heaven,
    and Earth. It asks Agni for wealth, strength, offspring, glory, and protection.
    The following Apris section invokes Agni, Narasamsa, divine grass, opened Doors,
    Night and Morning, heavenly Heralds, and goddesses connected with the sacrificial
    rite.
  language: English
  quote_policy: summarized
