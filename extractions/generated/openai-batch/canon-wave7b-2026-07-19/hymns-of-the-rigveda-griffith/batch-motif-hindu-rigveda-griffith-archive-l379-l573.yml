canonical_text:
  quote: ''
  summary: The passage contains hymnic praise addressed chiefly to Indra. Worshippers
    invite companions to sing, offer Soma, ask Indra for wealth, strength, and protection,
    and describe his horses, car, thunderbolt, and martial aid. A following hymn associates
    Indra, the Maruts or Tempest-Gods, the Sun, light, Dawns, the discovery of kine
    in a cave, and the sacrificer's cry. Another hymn praises Indra as golden and
    thunder-armed, says he raised the Sun, burst the mountain for the kine, aids battles,
    bends his bolt against fiends, and unclosed a cloud.
  language: English
  quote_policy: summarized
