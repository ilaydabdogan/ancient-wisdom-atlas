canonical_text:
  quote: ''
  summary: The passage explains ritual features of the Upasads and Soma sacrifice,
    including verses of slaying, ritual armour and arrow imagery, offerings near Soma,
    Soma as embryo of sky and earth, the myth of Soma among the Gandharvas and Speech
    bartered as a woman to buy him, the ritual imitation of that purchase with a young
    cow, and the bringing forward of Agni with recitations fitted to Brahman and Rajanya
    patrons.
  language: English
  quote_policy: summarized
