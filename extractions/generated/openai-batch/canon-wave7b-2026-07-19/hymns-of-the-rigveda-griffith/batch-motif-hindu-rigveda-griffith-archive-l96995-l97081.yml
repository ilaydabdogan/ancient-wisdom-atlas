canonical_text:
  quote: Sidadohas is breath and by breath he joins together all joints.
  summary: 'The passage gives a ritual exegesis of a sequence of verses: Sadadohas
    is identified with breath that joins bodily joints; neck, head, and vertebrae
    verses are assigned bodily correspondences; head verses are linked with gayatri
    metre, Arka/Agni, nine head-pieces, and a tenth verse as skin and hair. The text
    says the associated stoma and metre are productive, and that children and cattle
    belong to the one who knows this. Notes compare these ideas with nearby Vedic
    materials and interpret Sadadohas as milk-yielding.'
  language: English
  quote_policy: quoted
