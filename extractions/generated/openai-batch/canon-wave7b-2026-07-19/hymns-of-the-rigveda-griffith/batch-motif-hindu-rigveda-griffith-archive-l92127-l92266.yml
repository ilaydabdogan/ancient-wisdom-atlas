canonical_text:
  quote: The sacrifice is the expiation of the sacrifice.
  summary: The passage gives a series of ritual expiations for spoiled, carried-away,
    contaminated, spilled, or otherwise defective offerings and fires, especially
    involving Samnayya milk, Agnihotra, the offering spoon, and the Ahavaniya and
    Garhapatya fires.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: If the evening Samnayya milk is spoiled or carried away, the morning milking
    is divided; one half is curdled and used for sacrifice as expiation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the morning Samnayya milking is spoiled or carried away, a cake for Indra
    or Mahendra is prepared and sacrificed as expiation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the whole oblation is spoiled or taken away, offerings are made from butter
    according to the deities, producing another offering without flaw.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that sacrifice is the expiation of sacrifice.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: If something unfit for sacrifice falls into the Agnihotra on the fire, the
    rite may involve pouring the offering into the spoon, going east, using the Ahavaniya,
    taking a hot coal from the north of it, and pouring the offering silently or with
    a verse to Prajapati.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: If a spoiled portion can be removed, the spoiled portion is poured off and
    the unspoiled portion is offered in the ordinary way.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: If the Agnihotra spills or pours over on the fire, water is poured on it for
    expiation, and the passage says waters are expiation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After a spill, the performer touches the remainder with the right hand and
    mutters that thirds of the sacrifice have gone to sky and gods, atmosphere and
    fathers, and earth and himself, each time asking that wealth come from there.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: A verse to Visnu and Varuna says that regions are established by their might,
    that Visnu guards what is well sacrificed, and Varuna what is ill sacrificed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: If the Agnihotra spills or falls out while the performer is going eastwards,
    he should not fetch it again; others should fetch the remains to him, and he should
    offer them in the usual way.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: If the offering spoon splits, another spoon is fetched for the offering, and
    the broken spoon is placed on the Ahavaniya with handle in front and bowl behind.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: If the Ahavaniya fire remains but the Garhapatya fire is extinguished, the
    passage lists several rejected alternatives with negative consequences and prescribes
    gathering the fire with ashes, placing it where the Garhapatya belongs, and taking
    out the Ahavaniya eastward from it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: One rejected alternative says that taking the fire to the west would make
    the sacrificer perform sacrifices like the Asuras.
  category: relationship
  evidence_refs:
  - ev:7
