canonical_text:
  quote: ''
  summary: 'The supplied range is a mixed scholarly and translated passage. The readable
    main text presents teachings on the phonetic or ritual ''union'' of syllables:
    Madhyama identifies the intervening mora or ''sliding'' as union; a cited Rsi
    invokes Brhaspati and says nothing higher than the sliding is known; one who knows
    this union gains children, cattle, fame, glory, heaven, and full lifespan. Taruksya
    then identifies the union with the Brhat and Rathantara Samans, equating Rathantara
    with speech and Brhat with breath. A surrounding note discusses difficult curse
    formulas involving rebuke and grasping breath or beam.'
