  summary: Two hymns address Mitra-Varuna as divine kings and guardians of Law/Order.
    They establish heaven and earth, regulate the Sun’s course, ride a heavenly chariot,
    protect worshippers amid oblations, and are asked for shelter, victory, rain,
    and immortality. The passage also invokes Parjanya, the Maruts, thunder, clouds,
    the Sun, and the Asura’s magic power in connection with rain.
