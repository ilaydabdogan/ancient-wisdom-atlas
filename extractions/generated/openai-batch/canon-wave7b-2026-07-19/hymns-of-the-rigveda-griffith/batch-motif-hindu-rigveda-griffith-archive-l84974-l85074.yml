canonical_text:
  quote: ''
  summary: The passage gives ritual explanations for recitations in the Soma sacrifice.
    It describes the silent praise as the sacrifice's eye and root, orders the call,
    Nivid, and hymn as ritual equivalents of holy power, lordly power, and people,
    recounts Prajapati's propagation through restrained speech and the Nivid, identifies
    Agni, Vayu, and the sun with sacrificial functions in different worlds, and interprets
    Anustubh verse divisions as both reproductive pairing and a thunderbolt weapon
    against a foe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pressings are described as possessing eyes, and one who knows this goes to
    the world of heaven.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The silent praise is called both the eye and the root of the sacrifice; omission
    of it is said to bring ruin to the sacrifice and the man concerned.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the priest bears the whole sacrifice and that the
    sacrificer rests on the sacrifice.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The call, Nivid, and hymn are identified respectively with holy power, lordly
    power, and the people; their sequence is said to order these powers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Changing the placement of the hymn and Nivid is said to deprive a man either
    of lordly power or of the people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Prajapati is described as initially one, desiring propagation and greatness,
    practicing fervour, restraining speech, and uttering the Nivid twelve times at
    the end of a year.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After Prajapati's utterance of the Nivid, all beings are said to have been
    created.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Inserting the Nivid before the hymn is said to serve propagation, resulting
    in offspring and cattle for one who knows this.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Recitations identify Agni, Vayu, and the yonder sun with sacrificial functions
    and establish them in this world, the atmosphere, or yonder world.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Vayu is described as crossing all things and carrying the oblation to the
    gods, while Agni is described as offering to the gods.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The separation of the first two Padas and union of the last two Padas is interpreted
    through the separation and union of thighs, producing a pairing for generation.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The same verse arrangement is interpreted as making a thunderbolt, club, or
    axe-like weapon to hurl at a hateful foe.
  category: action
