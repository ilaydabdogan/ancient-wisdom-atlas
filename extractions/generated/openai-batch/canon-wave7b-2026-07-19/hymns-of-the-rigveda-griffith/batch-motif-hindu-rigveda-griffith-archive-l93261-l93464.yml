canonical_text:
  quote: ''
  summary: A passage in the legend of Cunahgepa describes Vicvamitra offering him
    the position of eldest son and a divine inheritance. Cunahgepa asks that Vicvamitra's
    sons agree. Vicvamitra commands his sons to accept the newcomer's superiority.
    Older sons object and are cursed so that their offspring occupy the ends of the
    earth, while Madhuchandas and the other fifty accept the father's will. Vicvamitra
    praises the obedient sons and appoints Devarata as leader, granting him inheritance,
    overlordship, and sacred lore.
  language: English
  quote_policy: summarized
