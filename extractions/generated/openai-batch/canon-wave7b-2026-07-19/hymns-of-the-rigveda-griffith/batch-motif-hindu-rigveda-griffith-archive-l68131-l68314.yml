canonical_text:
  quote: ''
  summary: The passage includes funeral-related notes, Hymn XVII, and the beginning
    of Hymn XVIII. It glosses cremation offerings and the extinguishing of funeral
    fire; narrates Tvashtar’s preparation of his daughter’s bridal, Saranyu/Yama’s
    Mother vanishing or being hidden and bearing twin children; invokes Pushan, Agni,
    Ayu, and Savitar to guide the departed to Fathers, Gods, and earlier pious dead;
    calls Sarasvati with the Fathers during oblations; describes purifying Floods,
    Soma-like drops, milk-rich plants, speech, and waters; and commands Death/Mrityu
    to depart, separating the living from the dead by a rampart and burying Death
    beneath a mountain.
  language: English
  quote_policy: summarized
