  summary: The supplied passage contains hymnic addresses to Indra. Indra is repeatedly
    invited to drink Soma prepared with milk, waters, mountains or pressing-stones,
    and ritual labor. The Maruts, Agni, and priestly figures are connected with the
    offering. Soma strengthens and enlarges Indra, who is praised as a battle champion,
    Vritra-slayer, giver of wealth, long life, and heroes. The passage also includes
    river and sea imagery for Soma and waters, petitions for victory and riches, a
    summons to Indra from near or far, and an opening line about longing to see sages
    full of wisdom.
