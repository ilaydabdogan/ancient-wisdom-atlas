canonical_text:
  quote: Agni is Priest, the great High Priest of sacrifice
  summary: The passage contains hymnic praise and notes centered chiefly on Agni,
    with one hymn to Indra-Agni. Agni is kindled by mortals, praised as priest, sacrificer,
    messenger, oblation-bearer, purifier, guardian of Law, wealth-giver, and one in
    whom the gods are centered. Notes mention Agni’s descent from celestial waters
    as lightning, the gods finding fugitive Agni, and Matarisvan bringing Agni to
    humans. Indra and Agni are invited to drink Soma and praised as joint victors
    who cast down forts held by Dasas.
