  quote: ''
  summary: The passage presents wedding verses and notes concerning the bride’s garment,
    removal of harmful influences, safe travel of the wedded pair, spectators’ blessings,
    the bridegroom’s hand-taking, divine bestowal of the bride, Sūryā’s mythic bridal
    sequence through Soma, the Gandharva, Agni, and a human husband, and blessings
    for longevity, progeny, household authority, livestock, and joined hearts. It
    then begins another hymn in which Vrishakapi drinks at a votary’s store and Indra
    is repeatedly called supreme.
