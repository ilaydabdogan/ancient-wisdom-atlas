  confidence: high
  cautions: The supplied excerpt begins after earlier departure stanzas; the departure
    frame is partly supported by notes in the passage.
- id: motif:2
  label: Sacred marriage as divine model for human marriage
  taxonomy_refs:
  - sacred_marriage
  basis: The bridegroom’s hand-taking and household formulae are framed by named deities
    giving the bride and by Sūryā’s mythic bridal sequence.
  evidence_refs:
  - ev:6
