- id: motif:3
  label: Sacred exchange or transfer of the bride
  taxonomy_refs:
  - sacred_exchange
  basis: The passage states a sequence of Soma, Gandharva, Agni, and human husband,
    and says Soma gave to the Gandharva, the Gandharva to Agni, and Agni bestowed
    spouse, riches, and sons on the speaker.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is a ritual-poetic transfer sequence, not a narrative of bargaining
    or theft.
- id: motif:4
  label: Apotropaic removal of bridal danger
  taxonomy_refs: []
  basis: The verses and notes associate the garment with a harmful female fiend or
