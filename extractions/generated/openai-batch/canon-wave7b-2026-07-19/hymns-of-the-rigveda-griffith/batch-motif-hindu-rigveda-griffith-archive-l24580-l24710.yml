canonical_text:
  quote: ''
  summary: The passage contains Rigvedic hymnic stanzas and translator notes concerning
    the gods’ eternal dominion, the alternating hidden and manifest pair of Morning
    and Night, rain-bearing cloud-cows and the Bull associated with Indra/Parjanya,
    Tvashtar as creator, heaven and earth as two meeting bowls, Indra as protector
    and recipient of earth’s wealth, and a Visvedevas hymn on fixed divine ordinances,
    the year and seasons, the triple Bull, the Waters, Savitar, Bhaga, and threefold
    blessings.
  language: English
  quote_policy: summarized
