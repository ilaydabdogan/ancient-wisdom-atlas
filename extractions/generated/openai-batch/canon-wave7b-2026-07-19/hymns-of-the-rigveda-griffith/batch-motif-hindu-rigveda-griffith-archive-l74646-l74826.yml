canonical_text:
  quote: ''
  summary: 'The passage describes the bridal procession of Sūryā: Soma woos the bride,
    Savitar bestows her, the Asvins serve as attendants and wooers, Agni leads the
    train, and a spirit-fashioned heavenly chariot carries the bride. Later formulae
    bless the bride''s journey, release her from Varuna''s noose, ask Visvivasu to
    depart from her, request smooth paths and divine guidance, and instruct her to
    enter the husband’s household as mistress, prospering with children and union
    with her lord. A short cosmological section speaks of wheels, hidden knowledge,
    the Sun/Moon pair, seasons, renewal, and the Moon prolonging life.'
  language: English
  quote_policy: summarized
