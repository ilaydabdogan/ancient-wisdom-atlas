  summary: The passage contains notes on ritual materials and several Rigvedic hymn
    excerpts. It invokes Mitra, Varuna, Aryaman, Aditi, the Adityas, Soma, Pusan,
    Agni, Indra, Vayu, and other gods. Recurrent actions include pressing and mixing
    Soma for divine consumption, asking gods for shelter, protection, long life, progeny,
    wisdom, and victory, and describing heavenly light, solar rays, and Soma-enabled
    vision.
