canonical_text:
  quote: The (sun) never really sets or rises.
  summary: The passage explains a ritual argument about beginning and end, describes
    how the Agnistoma should be completed within the day without haste through three
    pressings, links ritual recitation to the sun's increasing heat, and teaches that
    the sun does not truly rise or set but inverts itself at the boundaries of day
    and night. One who knows this attains union and identity with the sun in form
    and world.
  language: English
