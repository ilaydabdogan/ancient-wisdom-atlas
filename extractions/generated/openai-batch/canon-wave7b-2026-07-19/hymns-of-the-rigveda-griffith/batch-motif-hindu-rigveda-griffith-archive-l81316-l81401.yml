canonical_text:
  quote: ''
  summary: The passage contains the close of an invocation involving Sakra or Maghavan,
    libations, Soma, Varuna, Brihaspati, Anumati, jars, a bowl, and named seers. It
    then presents Hymn CLXVIII to Vayu, describing the Wind’s chariot, thunderous
    voice, movement through mid-air, unseen form, and cosmic vitality. Hymn CLXIX
    petitions for the health, nourishment, protection, milk, offspring, and possession
    of cows through several deities and ancestral or divine agents.
  language: English
  quote_policy: summarized
