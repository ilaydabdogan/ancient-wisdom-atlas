  quote: ''
  summary: The passage contains a fragment praising the paired Asvins, including their
    chariot, Soma, weapons, and aid to a mortal body; a hymn invoking Agni to drive
    harmful maladies or spirits away from a pregnant woman, womb, fetus, and progeny;
    a hymn driving disease away from a patient’s body part by part; and a conception
    blessing in which several deities form the womb, set the germ, and aid birth in
    the tenth month.
