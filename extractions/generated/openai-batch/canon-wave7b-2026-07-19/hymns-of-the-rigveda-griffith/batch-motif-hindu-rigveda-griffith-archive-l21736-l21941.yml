canonical_text:
  quote: ''
  summary: The passage contains hymns to Agni in which he is placed in a sacred earthly
    station, invoked to shine on rivers, accept offerings, call and bring the gods,
    grant wealth, sons, food, and heroic strength, and subdue foes. Agni is described
    as child of Dyaus and Earth, as kindled by ritual action, as connected with the
    floods, and as a threefold cosmic light knowing all creatures. The Maruts are
    invoked as storming sons of Rudra with spotted deer, rain, roaring, and mountain-shaking
    force. Another hymn describes oil and ladle offerings going up to heaven and Agni
    bearing sacrificial gifts to the gods.
  language: English
  quote_policy: summarized
