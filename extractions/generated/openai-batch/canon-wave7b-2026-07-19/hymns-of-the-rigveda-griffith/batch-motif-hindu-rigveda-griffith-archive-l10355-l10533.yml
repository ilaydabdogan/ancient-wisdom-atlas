canonical_text:
  quote: ''
  summary: The passage includes verses and notes on hymns to the Asvins and Indra.
    The Asvins restore Vandana, bring a sage to life, aid a distant mourner identified
    as Bhujyu, receive praise connected with Soma, Dadhyach, and a speaking horse
    head, and provide Pedu with a victorious white horse. A later hymn petitions the
    Asvins for wisdom, protection, cows, food, wealth, and conveyance by their car
    to the Soma draught. The Indra hymn describes Indra coming to sacrifice, establishing
    heaven, giving cattle wealth, preparing his bolt and team, restoring hidden cattle,
    opening troubling doors, and receiving milk or nectar connected with offerings.
  language: English
