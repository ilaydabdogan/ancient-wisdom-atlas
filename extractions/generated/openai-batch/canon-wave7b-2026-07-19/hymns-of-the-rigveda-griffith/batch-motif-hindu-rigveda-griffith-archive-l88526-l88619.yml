canonical_text:
  quote: ''
  summary: The passage gives ritual explanations for hymn selections and recitations
    on the third and fourth days of the Soma sacrifice. It connects hymns, deities,
    metres, stomas, repeated words, numbers, and the uttered sound “o” with ritual
    effects such as continuity, support, food production, cattle, conquest of worlds,
    and the sacrificer’s placement in proper food. It also states that Gaya Plata
    reached the dear abode of the All-gods and conquered the highest world through
    a hymn, and that one who knows this attains the same.
  language: English
  quote_policy: summarized
