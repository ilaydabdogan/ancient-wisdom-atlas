  summary: The passage contains hymnic petitions and praise addressed mainly to Indra,
    the Asvins/Nasatyas, and Soma. Indra is invoked as a thunderbolt-bearing warrior,
    destroyer of Sushna and other foes, giver of wealth, guardian of singers, and
    friend or brother-like protector. The Asvins/Nasatyas are described as a divine
    pair who forced apart united worlds or a united pair and are asked to bring the
    divided pair together again. Soma is invoked as Sweet Juice who grants mind, energy,
    protection, riches, and guardianship over herds and the moving world.
