canonical_text:
  quote: ''
  summary: 'The passage includes the Falcon hymn in which a speaker confined in a
    womb and iron fortresses is carried or released through the action of a Falcon
    who brings Soma from heaven while an archer, Krisanu, tries to strike him. A ritual
    stanza asks Indra to accept and drink a milk-filled beaker of shining liquid offered
    by priests. Translator notes identify the speaker as Agni or lightning, connect
    the Falcon with the heavenly Soma myth, and state that a fallen feather became
    a sacred tree. The passage then lists deeds of Indra: aiding Etasa with the Sun,
    quelling Vritra, smiting Ushas and breaking her chariot, resisting waters, defeating
    named enemies and fortresses, rescuing people over flood or distress, and receiving
    blessings from other gods.'
  language: English
  quote_policy: summarized
