  quote: ''
  summary: The passage contains petitions to Agni and Soma to accept oblations and
    grant protection, health, riches, power, cattle, and successful rites; a hymn
    to Agni as Jatavedas, protector, priestly mediator, seer in darkness, demon-smiter,
    chariot-riding flame, giver of wealth and long life; and the opening of a following
    Agni hymn describing two unlike beings who successively nourish an infant and
    one who bears a golden, godlike babe.
