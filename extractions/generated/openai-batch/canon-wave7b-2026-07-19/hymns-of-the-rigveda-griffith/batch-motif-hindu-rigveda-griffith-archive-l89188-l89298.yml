  summary: A ritual explanation of the seventh day within the Chandomas/Soma sacrifice.
    The passage identifies verbal and structural markers as symbols of the seventh
    day, connects the Ajya hymn’s ocean image with speech and ritual continuity, lists
    recitation sequences and metres, and describes hymns used for agreement, life,
    cattle, and support of the Stomas.
