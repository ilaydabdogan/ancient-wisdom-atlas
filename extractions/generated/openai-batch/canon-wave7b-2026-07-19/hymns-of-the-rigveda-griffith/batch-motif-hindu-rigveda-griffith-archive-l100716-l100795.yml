canonical_text:
  quote: The sun is the sclf of all that stands and moves.
  summary: The passage presents Badhva's view that the sun or self fills heaven, earth,
    and sky, is treated through Vedic hymnic and ritual contexts, is seen throughout
    natural and celestial domains, and is called Brahman. It describes a self made
    up of sight, hearing, metre, mind, and speech, like the year in number. It warns
    that one who recites this self for another loses Vedic benefit and should not
    perform specified ritual recitations for another except for a father or teacher.
    It concludes by identifying the incorporeal conscious self and the sun as one
    and the same.
  language: English
  quote_policy: quoted
