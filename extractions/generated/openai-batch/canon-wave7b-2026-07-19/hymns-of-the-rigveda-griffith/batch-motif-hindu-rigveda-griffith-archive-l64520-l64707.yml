canonical_text:
  quote: ''
  summary: The passage contains several Soma Pavamana hymns. Soma/Indu/Pavamana is
    praised as a flowing, purified, gold-hued divine juice associated with song, filtering,
    fleece, milk, waters, cows, divine refreshment, prosperity, light, protection,
    and the defeat of demons or hostile figures. Human and divine agents press, cleanse,
    adorn, and receive Soma, while worshippers ask for wealth, cattle, offspring,
    health, land, and long life.
  language: English
  quote_policy: summarized
