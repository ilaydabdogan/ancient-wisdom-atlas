  quote: ''
  summary: The passage invokes divine wives of gods, describes a feminine figure identified
    in the notes with Dawn and possibly Speech or Hymn, and presents a dense cosmological
    hymn around a solar figure called Steer, Sea, Red Bird, Stone, and Babe. It includes
    images of heavenly paths, waters and streams, Heaven and Earth supporting the
    Sun, Mothers and Spouses attending him, ritual praise to deities, magic energy
    seeking waters, Indra striking the Guileful One/Vritra, and divine inspiration
    or boon-giving.
