canonical_text:
  quote: ''
  summary: 'The passage gives a ritual-riddle enumeration of the twelve Bodies of
    Prajapati, identifies possible divine householders, then describes the Agnihotra:
    the Ahavaniya fire as sacrifice and heavenly world, the Agnihotra as sixteenfold
    and supported by cattle, and expiations for irregular actions of the Agnihotra
    cow during milking.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sequence of paired expressions is identified as the twelve Bodies of Prajapati,
    and the whole of Prajapati is said to be obtained on the tenth day.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The paired identifications include Agni, Aditya, Soma, cattle, Vayu, death,
    earth, sky, mind, and the year.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The riddle names Agni as householder of the world, Vayu as householder of
    the atmosphere, and a heat-giving yonder figure as lord with the seasons as house.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says householders and sacrificers prosper and smite away evil
    when there is a householder who knows the god as householder.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Ahavaniya is taken out in the afternoon and morning to place good acts
    of day and night in security.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ahavaniya is identified with the sacrifice and with the world of heaven.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Agnihotra is described as connected with the All-gods, having sixteen
    parts, and finding support in cattle.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: Different states or moments of the Agnihotra milk and offering are assigned
    to named deities, from the cow through the final offering.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: If the Agnihotra cow sits down while united with its calf and being milked,
    she is addressed with a protective verse, made to rise with a verse naming Aditi,
    touched with a pot of water on udder and mouth, and given to a Brahman.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: If the Agnihotra cow calls aloud while united and being milked, the passage
    says she foresees hunger for the sacrifices and should be made to eat food as
    expiation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: If the Agnihotra cow stumbles and milk spills, the spilled milk is touched
    with a verse naming earth, plants, waters, house, cow, and calves; an offering
    is then made with remaining or newly milked milk, or even in faith.
  category: sequence
  evidence_refs:
  - ev:7
