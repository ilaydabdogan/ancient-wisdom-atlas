  summary: The passage contains the end of one hymn, Hymn CVIII and Hymn CIX addressed
    to Indra-Agni, and the opening of Hymn CX addressed to the Ribhus. Indra and Agni
    are repeatedly invited to come from many possible locations and drink Soma libations.
    The hymns describe ritual preparations, past deeds such as Vritra’s fall, contention
    with Asuras over Soma, requests for wealth and protection, appeals to ancestors,
    and an opening offering of Soma to the Ribhus.
