  quote: ''
  summary: The passage contains the close of an Indra hymn praising Soma, Indra’s
    crushing of Sushna’s moving castle, praise at morning, noon, and night, and gifts
    associated with Asanga, Svanadratha, and other named patrons. It then gives an
    Indra hymn describing Soma preparation by washing, stone-pressing, wool-filtering,
    and mixing with milk, curd, barley, and cake; the hymn sets out triple Soma vessels
    and petitions Indra for wealth, favor, and protection.
