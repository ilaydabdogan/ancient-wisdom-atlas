- id: obs:2
  text: If all of a man’s fires are extinguished, the passage prescribes a cake on
    eight potsherds to Agni, or a libation in the Ahavaniya to Agni.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If a person with established fires eats new food without making the Agrayana
    offering, the passage prescribes an offering to Agni Vaicvanara or a libation
    in the Ahavaniya.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a potsherd, filter, or gold is lost after the fires are established, the
    passage assigns separate expiatory offerings involving the Acvins or forms of
    Agni.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: If one offers without having bathed in the morning, the passage prescribes
    an offering to Agni as Varuna or a libation in the Ahavaniya.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: If one eats the food of a pregnant woman, the passage prescribes an offering
    to Agni of the thread or a libation in the Ahavaniya.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: If one lives while hearing himself spoken of as dead, the passage prescribes
    an offering to Agni the fragrant or a libation in the Ahavaniya.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: If a wife or a cow produces twins, the passage prescribes a cake on thirteen
