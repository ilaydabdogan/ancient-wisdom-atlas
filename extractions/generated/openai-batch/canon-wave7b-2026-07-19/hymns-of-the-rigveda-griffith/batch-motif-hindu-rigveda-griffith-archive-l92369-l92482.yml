canonical_text:
  quote: ''
  summary: The passage lists ritual faults connected with established fires and prescribes
    expiations, usually a cake on specified numbers of potsherds or a libation in
    the Ahavaniya to Agni or other named deities. It also states that a man without
    a wife should still offer the Agnihotra and cites a sacrificial verse about sacrifice
    freeing one from debt to father and mother.
  language: English
  quote_policy: summarized
