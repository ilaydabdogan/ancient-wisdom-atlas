canonical_text:
  quote: ''
  summary: The passage invokes Agni and the Maruts, describing the Maruts as Rudras
    who ride swift cars and spotted deer, shake woods, earth, mountain, heaven, and
    move armed with lances. It describes their golden adornment, brotherhood, and
    parentage from Rudra and Prishni. Agni and the Maruts are invited to accept sacrificial
    food and Soma and grant riches. A following hymn questions the Maruts’ coming
    from a remote region, describes horses, heroes, bridegrooms with a spouse, human
    patrons and gifts, a revealed path to Syava, Marut glory, divine guidance through
    hymn, and Urmya bearing a hymn to Rathaviti/Dirbhya.
  language: English
  quote_policy: summarized
