canonical_text:
  quote: ''
  summary: The passage gives ritual instructions for reciting and transposing Valakhilya
    hymns and Pragathas, links recitational forms with breath, speech, bodily faculties,
    cattle, and the sacrificer, prescribes a difficult mounting in hymns to Indra
    or Indra and Varuna, explains why the sixth day should not be recited together
    by identifying it with the world of heaven, states that Varuna is Agni so Agni
    is not omitted from an offering verse, and begins a section on Cilpas as works
    of art of the gods imitated in human art.
  language: English
  quote_policy: summarized
