canonical_text:
  quote: ''
  summary: 'The passage praises the Asvins or Nasatyas for a sequence of wondrous
    acts: restoring sight, winning the Daughter of the Sun in their car, bringing
    wealth, rescuing people from danger, raising water from a well, making a barren
    cow give milk, restoring lost sons, freeing sages from pits and water, granting
    marriage, and giving Pedu a serpent-slaying horse. It also includes explanatory
    notes identifying several named figures and cross-references within the Rigveda.'
  language: English
  quote_policy: summarized
