  - ev:12
  confidence: medium
  cautions: The passage does not spell out a formal covenant or transaction; reciprocity
    is inferred from devotional offering contexts.
- id: motif:5
  label: bride won or bestowed through divine agency
  taxonomy_refs:
  - sacred_marriage
  basis: The note describes a contest in which the Asvins win Surya as bride by reaching
