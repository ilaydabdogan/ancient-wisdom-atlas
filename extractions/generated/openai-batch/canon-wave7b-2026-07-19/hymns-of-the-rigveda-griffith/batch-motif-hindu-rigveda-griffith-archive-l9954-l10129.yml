candidate_motifs:
- id: motif:1
  label: divine twin or paired helpers rescue and heal humans
  taxonomy_refs:
  - sacred_twins
  basis: The Asvins/Nasatyas are repeatedly addressed in the plural and perform rescue
    and healing acts for multiple figures, including restoring sight and freeing persons
    from water and pits.
  evidence_refs:
  - ev:1
  - ev:11
  - ev:14
  - ev:15
  confidence: medium
  cautions: The passage itself emphasizes the paired plural Asvins/Nasatyas but does
    not explicitly use the word 'twins' in the quoted lines.
- id: motif:2
  label: divine rescue from confinement, darkness, or water
  taxonomy_refs: []
  basis: Several episodes involve the Asvins raising or freeing figures from a pit,
    waters, bonds, burial-like darkness, or destructive conditions.
  evidence_refs:
  - ev:11
  - ev:14
  - ev:15
  - ev:16
  confidence: high
  cautions: This is a passage-level recurring action pattern rather than a supplied
    taxonomy family.
- id: motif:3
  label: restoration of bodily or social wholeness
  taxonomy_refs: []
  basis: The Asvins restore eyesight, restore a lost son, and provide spouses to Ghosha
    and Syava.
  evidence_refs:
  - ev:1
  - ev:10
  - ev:18
  - ev:19
  confidence: high
