canonical_text:
  quote: "“Not this way go I forth: hard is the passage. Forth from the side obliquely
    will I issue.”"
  summary: The passage praises Indra as a conquering warrior and wealth-giver, describes
    his relation to singers, priests, Soma offerings, and sacrificial praise, recounts
    a solar chariot and cloud-darkness episode, and begins a hymn on Indra’s unusual
    birth, in which he resists the ordinary birth-path, is associated with his mother,
    drinks Soma in Tvashtar’s dwelling, is hidden by his mother, and fills earth and
    heaven at birth. It closes with holy waters or floods flowing and bursting a surrounding
    rock.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Indra is described as conquering, slaying, winning cattle in combat, and causing
