  category: relationship
  evidence_refs:
  - ev:3
  - ev:13
- id: obs:4
  text: Maghavan is said to unsettle the settled man, scatter gathered dust, break
    in pieces like heaven armed with lightning, and enrich the person who lauds him.
  category: action
  evidence_refs:
  - ev:4
