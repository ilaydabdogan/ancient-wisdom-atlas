canonical_text:
  quote: ''
  summary: The passage contains notes and verses from hymns to Dawn, followed by the
    beginning of a hymn titled Svanaya. Dawn is described as a maiden, bride, Heaven’s
    Daughter, Mother of Cows, and recurring sister who appears from darkness, follows
    Order, awakens beings, spreads light, and brings wealth to worshippers and liberal
    givers. Savitar sends beings to labour, the sacrificial fire and Sun are associated
    with Dawn’s shining, Agni is present in dwellings, and a later hymn describes
    treasure-giving, hospitality, offspring, wealth, and Indra’s bestowal of vital
    power.
  language: English
