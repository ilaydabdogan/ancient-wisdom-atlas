canonical_text:
  quote: ''
  summary: The passage contains hymnic invocations to Mitra-Varuna and Indra-Varuna.
    Mitra-Varuna are addressed as two gods, boon-givers, work-controllers, children
    born of Aditi, holders of dominion, guardians through spies, receivers of drink
    and oblation, and establishers of laws. Indra-Varuna are invoked through sacrifice
    and Soma; they are praised as strong heroes and Vritra-slayers, with Indra slaying
    Vritra by thunderbolt and Varuna standing as sage and imperial governor. Worshippers
    request protection, wealth, victory, removal of curses, and safe passage through
    dangers.
  language: English
  quote_policy: summarized
