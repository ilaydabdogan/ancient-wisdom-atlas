canonical_text:
  quote: ''
  summary: The passage includes a protective invocation asking deities such as Soma,
    Agni, Brihaspati, the Asvins, and Indra to guard the sacrificer, children, and
    community from foes. It then presents a creation hymn describing a primordial
    state before existence, non-existence, death, immortality, day, night, air, or
    sky; a solitary One; darkness and chaos; the arising of Warmth and Desire; a separation
    of above and below; and uncertainty about who knows creation's origin. A following
    creation hymn depicts sacrifice as a woven, stretched work made by Fathers and
    extended by the Man toward heaven, with ritual hymns and implements posed as elements
    of creation-worship.
  language: English
  quote_policy: summarized
