canonical_text:
  quote: ''
  summary: 'The passage explains ritual recitations attributed to Aitaca and associated
    verses, presenting them as means by which gods overcame Asuras and sacrificers
    overcome rivals. It then narrates a Devanitha episode in which the Adityas and
    Angirases dispute over reaching the world of heaven, Agni is sent as messenger
    and becomes Hotr for the Adityas, and a later account explains rejected and accepted
    sacrificial fees: the earth burns and becomes a lioness, while the sun appears
    as a white horse and is accepted as a gift.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The prattle of Aitaca is associated with freedom from exhaustion and unfailingness
    in the sacrifice, and is recited by Padas with an om at the last Pada.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gods confounded the Asuras with riddles and overcame them; sacrificers
    are said to overcome a hated rival by confounding him with riddles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ajijñasenya, Pratiradha, and Ativada recitations are each described as
    means by which the gods overcame the Asuras, with corresponding effects for sacrificers
    against a hated rival.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Adityas and Angirases disputed over the world of heaven.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Angirases saw a Soma pressing on the next day for the world of heaven
    and sent Agni to tell the Adityas.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Adityas saw Agni, saw the pressing on the same day for the world of heaven,
    and told Agni they would go to the world of heaven with him as Hotr.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Angirases sacrificed for the Adityas, and the Adityas gave them this earth
    full of fees.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The accepted earth caused the Angirases to burn; when cast away, she became
    a lioness with gaping jaws and assailed men, and fissures came forth on her.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A gift laid aside is not to be accepted; if one accepts it, the passage says
    he should give it to a hated rival.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The sun took the form of a white horse with a body bound by a horse halter
    and was brought as a fee.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Devanitha verses explain that the Angirases did not approach or accept
    the earth but did approach and accept the sun.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The sun is called the discriminator of the days, and the fee is called the
