canonical_text:
  quote: ''
  summary: 'The passage explains technical recitations in the Soma sacrifice, especially
    the midday Pavamana, inserted verses, Upasad recitations, a Pragatha to the Maruts,
    and the Nivid. It attributes ritual effects to these recitations: conquering heaven,
    milking desires from the worlds, repairing breaches in sacrifice, producing rain
    and cattle, propagating the sacrificer, winning victory, ascending by a heavenly
    ladder, and performing hostile rites against people or lordly power.'
  language: English
  quote_policy: summarized
