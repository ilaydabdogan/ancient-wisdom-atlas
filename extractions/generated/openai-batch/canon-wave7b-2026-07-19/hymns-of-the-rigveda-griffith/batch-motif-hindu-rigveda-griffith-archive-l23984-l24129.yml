canonical_text:
  quote: ''
  summary: The passage invokes Indra after Soma drinking, describes his home, consort,
    chariot, horse, shape-changing power, and descent from heaven through prayers.
    It praises priestly groups, Visvamitra, the Kusikas, Sudas, and the Bharatas,
    linking Soma pressing, song, battle aid, altar worship, and prosperity. It contrasts
    the Kikatas as failing to produce milky or heated offerings and asks Indra to
    transfer Pramaganda's wealth. It also describes Sasarpari, a gift of the Jamadagnis
    and daughter of the Sun/Paksha, as lowing with a mighty voice, dispelling famine,
    spreading glory, and granting vital power.
  language: English
  quote_policy: summarized
