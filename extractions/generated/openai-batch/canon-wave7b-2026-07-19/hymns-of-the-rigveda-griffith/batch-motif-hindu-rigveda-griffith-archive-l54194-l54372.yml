canonical_text:
  quote: ''
  summary: The passage contains hymnic petitions and praise to Indra, Maruts, Vayu,
    and the Adityas. Indra is asked for cattle, horses, chariots, strength, wealth,
    and protection; the Maruts are worshipped as thundering troops over mountains;
    Vayu is invited to a rite and Soma draughts; gifts of animals, chariots, gold,
    and an adorned woman are catalogued; the Adityas, including Varuna and Mitra,
    are invoked for protection from harm.
