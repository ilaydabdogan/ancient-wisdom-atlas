canonical_text:
  quote: ''
  summary: The passage includes notes on a cow understood as Aditi and then two Agni
    hymns. Agni is invoked as house-lord, youthful sage, ally, priest, messenger,
    bearer of offerings to heaven, and giver of strength, wealth, spoil, fame, and
    descendants’ bounties. The hymns describe Agni as clothed with the sea, associated
    with waters, enkindled in homes, brought forth by the Gods as mothers, and able
    to accept humble fuel and devotion when the worshipper lacks a cow, milk, axe,
    or prepared wood.
