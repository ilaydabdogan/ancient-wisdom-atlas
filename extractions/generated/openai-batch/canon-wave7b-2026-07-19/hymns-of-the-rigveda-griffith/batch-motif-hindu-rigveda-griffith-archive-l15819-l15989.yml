canonical_text:
  quote: ''
  summary: A sequence of Rigvedic hymns invokes the Asvins/Nasatyas with chariot imagery,
    offerings, Soma, hymns, and requests for protection, food, and offspring. It includes
    a brief reference to Surya's bridal, then a hymn to Heaven and Earth as cosmic
    supporters and divine parents, and finally the opening of a hymn to the Visvedevas
    calling Savitar, the assembled gods, Agni, and Night and Morning to aid the worshippers.
  language: English
  quote_policy: summarized
