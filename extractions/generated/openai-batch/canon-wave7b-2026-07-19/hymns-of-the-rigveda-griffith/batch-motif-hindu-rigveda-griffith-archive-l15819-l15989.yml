  - ev:15
  confidence: high
  cautions: This is a ritual-exchange pattern rather than a complete narrative episode.
- id: motif:2
  label: Sacrificial invocation with Soma and oblations
  taxonomy_refs:
  - sacrifice
  basis: The Asvins are invoked amid oblations, vessels of pleasant juices, and a
    Soma stream, and Savitar is invited through praises offered as sacred food.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:14
  confidence: medium
