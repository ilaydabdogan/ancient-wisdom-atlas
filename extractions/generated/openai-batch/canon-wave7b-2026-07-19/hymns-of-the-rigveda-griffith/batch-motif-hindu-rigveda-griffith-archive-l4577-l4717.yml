canonical_text:
  quote: When Indra, thunder-armed, made bold by Soma draughts, broke Vala’s fences
    down
  summary: The passage praises Indra as protector, giver, battle-helper, Soma-drinker,
    and slayer of obstructing beings such as Sushna, Vritra, and Vala. Notes identify
    several atmospheric demons and explain Soma offerings, sacred grass, and figures
    associated with Indra. Indra receives or wields a thunderbolt associated with
    Usana and Tvashtar, rides steeds, destroys forts or fences, releases rain and
    floods, and sets the Sun in heaven.
  language: English
