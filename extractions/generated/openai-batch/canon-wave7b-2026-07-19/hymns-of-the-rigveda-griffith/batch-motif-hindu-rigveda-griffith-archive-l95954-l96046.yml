  quote: Much indeed is done on this day that is forbidden, and (the Marutvatiya)
    is the atonement. Now atonement is rest
  summary: The passage explains two Rigvedic tristichs as the first and second parts
    of the Marutvatiya hymn in a one-day ceremony. It states that forbidden acts occur
    on this day and that the Marutvatiya functions as atonement and rest. It then
    interprets words from cited Rigvedic verses as corresponding to the ritual day's
    perfect form, especially hymn, strength, heroic might, Indra's attributes, greatness,
    and complete ritual recitation.
