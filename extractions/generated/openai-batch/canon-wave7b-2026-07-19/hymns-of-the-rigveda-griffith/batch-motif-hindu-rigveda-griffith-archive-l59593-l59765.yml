canonical_text:
  quote: ''
  summary: Several Soma Pavamana hymns describe Soma or Indu being mixed with milk
    and curds, pressed with stones, strained through wool or fleece, poured into jars
    or special vessels, and offered to Indra and the Gods. The hymns ask for welfare,
    wealth, strength, victory, and protection, and use imagery of heaven, water, milk,
    a tree, kine, coursers, fingers, and severed limbs in describing Soma’s ritual
    flow and transformation.
  language: English
  quote_policy: summarized
