canonical_text:
  quote: ''
  summary: The passage invokes Agni to rise, burn and drive off enemies, destroy Rakshasas,
    protect worshippers, bless liberal givers, and preserve the pious. It recalls
    Agni’s guardian rays protecting blind Mamateya, asks for wealth and strength,
    and opens a hymn to Agni as Vaisvanara, a great light and sustainer. Agni is also
    described as revealing hidden knowledge to a mortal and as consuming those who
    disregard the commandments of Varuna and the laws of Mitra.
  language: English
  quote_policy: summarized
