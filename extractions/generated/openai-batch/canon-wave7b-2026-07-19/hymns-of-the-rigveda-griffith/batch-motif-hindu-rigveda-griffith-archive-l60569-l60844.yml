    one decked with tints.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Sons of Prisni milk Soma, who is described as the dwelling-place of sacrifice
    and a dear oblation.
  category: action
  evidence_refs:
  - ev:5
