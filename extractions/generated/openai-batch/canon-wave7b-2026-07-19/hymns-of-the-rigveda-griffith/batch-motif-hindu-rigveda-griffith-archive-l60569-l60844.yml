canonical_text:
  quote: ''
  summary: A sequence of Soma Pavamana verses describes Soma juice being pressed,
    milked, refined, filtered through wool or a sieve, and poured for deities, especially
    Indra. Soma is personified as flowing, bellowing, far-seeing, wealth-giving, light-bringing,
    rain-sending, fiend-slaying, and moving between heaven, the ritual vessels, and
    the gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A drop or stream of Soma juice flows onward with force and is said to rend
    strong places.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Soma is poured forth to named deities including Indra, Varuna, Vayu, the Marut
    host, and Vishnu.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
