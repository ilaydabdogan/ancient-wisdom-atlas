canonical_text:
  quote: ''
  summary: The passage contains hymnic invocations to the Asvins/Nasatyas and to Dawn.
    The Asvins are summoned from all directions to sacrificial offerings and asked
    to bring wealth, food, shelter, and protection. Dawn, together with Savitar's
    light, reveals the world, overcomes darkness, wakes paths, visits human settlements
    in a chariot, and is linked with Surya and ancestral Fathers who find light in
    darkness.
  language: English
