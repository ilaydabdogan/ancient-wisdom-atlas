comparison_claims:
- id: claim:1
  claim: A supplied note compares the Vedic Indra-Vritra episode with later Pauranik
    treatment, saying Pauranik writers made it a literal contest between Indra and
    an Asura, whereas the Vedic passage is described there as an allegory of rain
    production.
  claim_level: same_motif
  target: Later Pauranik Indra-versus-Asura form of the Vritra legend
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: This comparison is based on the translator/commentator’s note in the
    supplied passage, not on a quoted Pauranik passage or independent historical demonstration.
- id: claim:2
  claim: A supplied note links the robber or Pani with a wider nearby pattern of demons
    stealing cows and hiding them in mountain caverns.
  claim_level: same_function
  target: Pani cow-stealing demon pattern in Vedic explanatory tradition
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The full Pani cow-theft story is not narrated in the hymn excerpt;
    the connection comes from the note’s lexical and explanatory gloss.
