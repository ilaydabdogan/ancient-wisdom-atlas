canonical_text:
  quote: ''
  summary: The passage gives rules for distributing parts of a sacrificial animal
    among named priests and associated persons, explains that a correct thirty-sixfold
    division supports the sacrifice and grants access to breaths and heavenly worlds,
    contrasts correct division with the wrongful rending of an animal, attributes
    knowledge of the division to Crautarsi Devabhaga and its proclamation to Girya
    Babhravya by a superhuman being, and then gives expiations for cases where a fire-establisher
    dies during or before Agnihotra-related rites, including burning offerings together,
    offering prepared libations, using milk for the dead person's Agnihotra, keeping
    fires kindled until bones are collected, or making a human-like figure from leaf
    stalks if bones are unavailable.
  language: English
  quote_policy: summarized
