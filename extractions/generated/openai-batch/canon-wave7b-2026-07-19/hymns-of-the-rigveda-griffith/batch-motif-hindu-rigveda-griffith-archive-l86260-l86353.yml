  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Adityas are identified with breaths, and the rite avoids a second vasat
    call or eating so as not to bring the breaths to a conclusion.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Adityas ask Savitr to support the pressing, and Savitr agrees; the Savitr
    strophe and cup are placed in relation to the pressing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A verse containing the expression “be drunk” is explicitly called a symbol
    of the third pressing.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: Savitr is said to drink from both the morning pressing and the third pressing
    through ritual sentences containing “drink” and “be drunk.”
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Many verses to Vayu are recited in the morning but only one at the third pressing,
    and this is related to upward and lower breaths in a man.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A hymn to sky and earth is recited because sky and earth are supports, establishing
    the recipient on a pair of supports.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Rbhus are said to have won the drinking of Soma among the gods by fervour.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Rbhus are successively repelled from the morning, midday, and third Soma
    pressings by Agni with the Vasus, Indra with the Rudras, and the All-gods.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Prajapati tells Savitr that the Rbhus are Savitr’s pupils and arranges for
    drinking with them through verses recited around the Rbhu hymn.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The gods are said to have loathing of the Rbhus because of their human descent.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: 'The Vaishvadeva is compared to peoples and to a man: hymns are likened to
    inner members, and inserted verses to wastes or joints.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Inserted verses and offering verses are called the root of the sacrifice;
    using different ones would uproot the sacrifice.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Vaishvadeva litany is connected with the five folks, named as gods and
    men, Gandharvas and Apsarases, serpents and fathers.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The reciter is instructed to think of all quarters to place sap in them and
