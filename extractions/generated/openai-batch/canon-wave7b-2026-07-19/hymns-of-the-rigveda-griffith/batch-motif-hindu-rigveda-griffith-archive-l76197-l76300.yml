canonical_text:
  quote: ''
  summary: 'The excerpt closes a preceding hymn with patrons displaying a large gift
    of horses, with notes discussing priests, chariots, yokes, and reconciliation.
    It then gives a hymn to the Soma press-stones: the mountain stones speak and cry
    aloud, praise Indra, taste offered food, hum, devour the Soma plant, bellow like
    bulls, dance with the fingers, move in heaven like eagles, descend to the lower
    stone, pour out a stream, and are described with tenfold yoking imagery.'
  language: English
  quote_policy: summarized
