  summary: The passage includes commentary on a legend in which Mudgala’s cattle are
    stolen, he pursues the robbers with an old ox and a thrown mace that shows the
    way, and he recovers his property. Hymn verses and notes describe a bull or buffalo
    yoked to a chariot, Mudgala winning cattle in battle, Mudgalani’s chariot-driving
    role, and Indra’s favor toward the mortal. A following martial hymn invokes Indra,
    Brihaspati, Soma, sacrifice, and the Maruts for protection, leadership, and victory
    in battle.
