canonical_text:
  quote: '"Come nigh, O ye Twain Gods, to all libations here."'
  summary: The passage contains Vedic hymnic petitions to the Asvins and to Indra.
    The Asvins are invited to accept songs, rites, and Soma libations, to arrive with
    Surya and Dawn and other divine companions, to grant progeny, wealth, strength,
    protection, and treasures, and to slay Rakshasas and drive away disease. Syavasva’s
    present Soma-pressing praise is compared with Atri’s earlier eulogy. The Indra
    hymns ask Satakratu/Maghavan to drink Soma, describe his fixed share, his association
    with the Maruts, his creative and provider roles, and his martial help in conflicts
    with Vritra and hostile hosts.
  language: English
  quote_policy: quoted
