canonical_text:
  quote: The sacrifice is a chariot of the gods;
  summary: 'The passage explains ritual actions through divine precedents: gods and
    Asuras fight over worlds; gods take refuge at the Agnidh’s altar, recover fires,
    and repel Asuras and Raksases. It links Ajya rites, the Achavaka office, Indra
    and Agni, metrical conversions, divine drinking through syllables, a cup for Indra
    and Agni, silent praise with light formulas, and the Hotr’s muttering as an inaudible
    pouring of seed.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The gods and the Asuras are said to have fought over the worlds, and the gods
    used the Sadas and then the Agnidh’s altar as places of refuge and support.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Asuras scattered the fires of the gods in the Sadas; the gods drew off
    those fires from the Agnidh’s altar and repelled the Asuras and Raksases.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The text states that sacrificers likewise draw off fires in the Sadas from
    the Agnidh’s altar and thereby repel Asuras and Raksases.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Ajyas are associated with conquering in the morning, and their name is
    explained through this conquering action.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Indra and Agni take the place of the omitted Achavaka office, and the Achavaka
    recites a hymn to Indra and Agni at the morning pressing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The other Hotrakas creep to the Sadas in front, while the Achavaka comes behind
    as one anxious to follow after.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The sacrifice is described as the chariot of the gods, and the Ajya and Prauga
    Castras are described as its inner reins.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The text says the inner reins of men’s chariots are separated in imitation
    of the sacrificial chariot arrangement, to prevent confusion.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Soma the purifying is identified with Agni as a reason that recitation to
    Agni can follow verses to Soma the purifying.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage explains how Anustubh verses, by repetition and a Viraj offering
    verse, are treated as equivalent to Gayatri verses in recitation.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: An offering verse to Agni and Indra is said to serve conquest because Indra
    and Agni did not conquer in one order, but Agni and Indra did conquer in the other
    order.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Viraj is said to have thirty-three syllables, corresponding to thirty-three
    gods who become sharers in the syllables and drink syllable by syllable.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Adhvaryu draws a cup for Indra and Agni, and the Hotr recites a silent
    praise invoking Agni, Indra, Surya, and light.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The Hotr’s muttering is described as pouring seed; it is performed inaudibly
    and before the call, with a posture involving all fours and an averted face.
  category: action
  evidence_refs:
  - ev:11
