canonical_text:
  quote: ''
  summary: 'The passage describes ritual explanations for an animal sacrifice: the
    victim follows Agni toward heaven, is ritually approved by kin, its faculties
    are assigned to cosmic regions, its body is cut and disposed of according to formulae,
    Raksases are given blood as their excluded share, ritual agents and speech are
    managed to avoid danger, and a myth explains sacrificial fitness through a sap
    that passes from man through several animals and finally to earth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The victim sees death, resists going to the gods, accepts after being promised
    the world of heaven, and follows Agni after asking that one god go before it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Agni is borne before the victim because the passage says every animal is connected
    with Agni after the victim followed him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ritual formula connects the spread strew and plants with the victim's
    body.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The victim's mother, father, brother from the same womb, and flock-comrade
    are invoked to approve it before it is slain.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The victim's feet, eye, breath, life, ear, and body are assigned respectively
    toward the north, sun, wind, atmosphere, quarters, and earth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The officiant is instructed to flay the skin in one piece, handle the omentum,
    keep breath within, and cut or arrange body parts with named shapes such as eagle,
    hatchets, spikes, tortoises, door leaves, and oleander leaves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A hole is made in the earth to cover the offal because the offal is connected
    with plants and earth supports plants.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Raksases are united with blood; by giving them their own share, the ritual
    excludes them from the sacrifice.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage discusses whether to mention Raksases at sacrifice and says that,
    if mentioned, it should be inaudible because the inaudible is hidden like the
    Raksases.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The entrails are not to be cut while deeming them an owl, lest a howler howl
    in the sacrificer's family and offspring.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Adhrigu, Nigrabhitr, and slayers are addressed; good results are directed
    to the sacrificers and ill results elsewhere, while Agni and the Hotr are associated
    with dissection by speech.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A mythic sequence states that the gods slew man, then horse, ox, sheep, and
    goat; the sap departed each slain being and entered the next recipient, later
    entering earth.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the sap departs, the dismissed beings become monkey, Gauramrga, Gayal,
    camel, and Carabha; the goat is said to be most often employed because the sap
    dwelt in it longest.
  category: relationship
  evidence_refs:
  - ev:7
