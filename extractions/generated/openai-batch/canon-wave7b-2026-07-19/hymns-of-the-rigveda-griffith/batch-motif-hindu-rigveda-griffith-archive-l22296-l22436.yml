  summary: The passage closes an Indra hymn with petitions for Indra to destroy Rakshasas,
    use his weapon against a devotion-hater, grant wealth, horses, cattle, children,
    and victory, and open the cows’ stable. It then begins Hymn XXXI to Indra with
    obscure verses on succession through a daughter’s son, Agni’s birth and sacrificial
    fire, Indra’s coming with conquering bands and Dawns, sages or seven priests freeing
    beings from prison, and Sarama finding a mountain fissure and leading forth the
    lowing ones while a hill yields treasure to the pious.
  language: English
