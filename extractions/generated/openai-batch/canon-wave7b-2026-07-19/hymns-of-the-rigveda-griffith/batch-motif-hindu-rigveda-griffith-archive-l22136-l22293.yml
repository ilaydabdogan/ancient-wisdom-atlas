canonical_text:
  quote: ''
  summary: 'A closing fragment describes ancient seers, Kusikas, kindled fire, an
    elected priest, sacrifice, and Soma. Hymn XXX addresses Indra: worshippers offer
    Soma and viands, invite him with his Bay Horses, praise him as warrior and Vritra-slayer,
    recount his crushing of Kunaru and Vritra, credit him with establishing earth
    and heaven, sending floods, opening cattle paths, ordering Surya and Morning,
    and ask him to protect the sacrifice by destroying hostile foes.'
  language: English
  quote_policy: summarized
