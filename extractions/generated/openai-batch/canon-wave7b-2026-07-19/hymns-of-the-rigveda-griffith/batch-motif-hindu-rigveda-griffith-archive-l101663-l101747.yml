  quote: Standing there he worships the sun
  summary: 'The passage contains ritual commentary and instructions: a performer stands
    and worships the sun while keeping his right side toward it, recites verses with
    certain cries omitted, and instructs maidservants carrying full pitchers to circumambulate
    an altar and a pitcher of water while speaking a refrain. Notes discuss textual
    variants, parallel Vedic rites, a rain-and-vegetation interpretation of the dance,
    and a variant rite involving a round skin representing the sun.'
