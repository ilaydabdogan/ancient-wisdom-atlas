  quote: ''
  summary: The passage contains a closing Agni section and the opening of an Indra
    hymn. Agni is invoked for protection, wealth, victory, and ritual success; he
    is described as a bull-like fiery power, kindled in wood, bearing offerings, worshipped
    by priests, and repelling fiends, spells, hunger, Rakshasas, and demons. Indra
    is invited to hear prayer and drink Soma; he is praised as powerful, wealth-giving,
    fort-breaking, Vritra-slaying, protective, and armed with the thunderbolt.
