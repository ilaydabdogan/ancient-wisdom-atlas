  - ev:5
  - ev:7
  - ev:10
  - ev:13
  confidence: high
  cautions: The available taxonomy list does not contain a direct category for catalogue-invocation
    or divine rescue helpers.
- id: motif:2
  label: Rescue from waters, wells, pits, and drowning
  taxonomy_refs: []
  basis: Rebha and Vandana are raised from waters or wells, Antaka is rescued from
    a deep pit, and Bhujyu is rescued from danger of drowning.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: Although water is a supported symbol, the passage does not present this
    as a flood-renewal narrative.
