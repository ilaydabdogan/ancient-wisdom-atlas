canonical_text:
  quote: ''
  summary: The passage contains an Indra hymn in which Soma-bearing Brahmans invite
    Indra to hear prayer, come to the eulogy, drink Soma, receive the poured Soma
    through his body, and act as Vritra-slayer and giver of wealth. It then shifts
    to a hymn to the Adityas, Aditi, and allied deities, asking for shelter, protection
    of herds, health, removal of enemies, disease, famine, sin, and distress, and
    concluding with a prayer for mountains, water-floods, Heaven and Earth, and the
    Vasus to carry the speakers beyond trouble in a ship.
  language: English
  quote_policy: summarized
