canonical_text:
  quote: "“The gods eat not the food of a king without a Purohita.”"
  summary: The passage includes translated verse and prose on Bharata Dauhsanti’s
    large royal sacrifices, the great anointing of Indra transmitted by seers and
    used for conquest, a warning about dealing falsely with a knowing Brahman, and
    a section on Purohitaship. It states that a king about to sacrifice should select
    a Brahman Purohita, identifies the Purohita and his family with sacrificial fires
    leading to heaven, and describes the Purohita as Agni Vaisvanara with five missiles
    whose appeasement protects the king, kingdom, life, and people.
  language: English
  quote_policy: quoted
