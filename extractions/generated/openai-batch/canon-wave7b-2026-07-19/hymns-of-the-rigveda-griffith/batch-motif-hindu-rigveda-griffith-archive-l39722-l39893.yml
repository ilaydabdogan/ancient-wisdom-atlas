canonical_text:
  quote: ''
  summary: The passage contains Rigvedic hymnic invocations to Agni and multiple other
    deities. Agni is praised as a radiant fire, bearer of offerings, summoner of gods,
    household lord, battle-helper, and protector of children and seed. The text describes
    Agni being produced by rubbing with ritual materials on the altar and sending
    smoke to heaven. Later stanzas invoke the Asvins, Vata and Parjanya, Sarasvati,
    Pushan, Tvashtar, Rudra, Maruts, Vishnu, Bhaga, Aditi, Surya, and others for strength,
    water, inspiration, refuge, wealth, a lasting home, and freedom from sin.
  language: English
  quote_policy: summarized
