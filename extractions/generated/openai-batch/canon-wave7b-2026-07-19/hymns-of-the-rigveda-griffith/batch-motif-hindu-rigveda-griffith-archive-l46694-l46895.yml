canonical_text:
  quote: |-
    She hath made
    light and chased away the darkness.
  summary: A sequence of Rigveda Book VII dawn hymns praises Ushas/Dawn as a goddess,
    Daughter of Heaven/Sky, bringer of light, cattle or rays, days, wealth, and protection.
    The hymns describe priests waking to greet her, Agni/fire and the Sun appearing
    with her, darkness and gloom being driven away, chariots and horses in her procession,
    and a note on her opening mountain or cloud portals that held cows or rays of
    light.
  language: English
  quote_policy: quoted
