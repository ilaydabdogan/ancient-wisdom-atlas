canonical_text:
  quote: ''
  summary: A Rigvedic hymn passage addresses the Maruts with questions about their
    heavenly course, cows, favors, and prosperity; identifies them as sons of Prisni
    and Rudra; asks protection from death, plague, and drought; describes their rain,
    lightning, clouds, earth-shaking voice, steeds, cars, wheels, and reins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker asks when the addressed gods will take the petitioners by both
    hands, comparing this to a dear sire taking his son; sacred grass is clipped for
    those gods.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker asks the Maruts where they go in heaven rather than on earth,
    where their cows disport themselves, and where their newest favours, prosperity,
    and felicities are shown.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Maruts are called sons whom Prisni bore, and the passage speaks of one
    who sings their praise.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says that the praiser should not be loathed like a wild beast
    in pasture-land and should not go on Yama's path.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker asks that destructive plague and drought depart from the petitioners.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Maruts, called fierce and mighty sons of Rudra, send rain even on desert
    places.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Lightning is described as lowing like a cow and following motherlike after
    its youngling when the Maruts' rain-flood has been loosened.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: When the Maruts inundate the earth, they spread darkness even during daytime
    with a water-laden rain-cloud.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: At the sound of the Maruts' voice, the earthly habitation shakes and each
    human inhabitant reels.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Maruts hasten with strong-hoofed steeds along bright embanked streams.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The speaker asks that the fellies of the Maruts' wheels be firm, their horses
    and cars steady, and their reins well fashioned.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: A translator note records interpretations of the Maruts' cows as clouds or
    herds, and mentions milk and butter for sacrifice in one interpretation.
  category: other
  evidence_refs:
  - ev:12
