  quote: Thou, Helper, must be known as our Preserver, Father and Mother of mankind
    for ever.
  summary: The passage opens Book VI with hymns to Agni. Agni is praised as inventor
    of prayer, herald, priest, offerer, lord of riches, preserver, and radiant fire.
    Human worshippers approach him with kneeling adoration, kindled fuel, oblations,
    songs, hymns, and altar rites, seeking bliss, protection, cattle, food, fame,
    long life, and victory over enemies. Agni is compared with Mitra, Varuna, the
    Sun, wind, and several animals, and his smoke and splendour are described as reaching
    heaven.
