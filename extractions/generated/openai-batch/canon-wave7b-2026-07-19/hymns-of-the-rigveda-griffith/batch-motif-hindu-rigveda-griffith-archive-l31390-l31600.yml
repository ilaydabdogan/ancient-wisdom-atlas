canonical_text:
  quote: ''
  summary: The passage contains hymnic praise and ritual instructions centered mainly
    on Agni, with one opening fragment of an Indra hymn. Agni is invoked, enkindled,
    praised as bright, asked to bring the gods to the feast, made priest/envoy/bearer
    of offerings, and requested to grant protection, wealth, victory, household rule,
    and passage beyond foes. Other verses praise munificent princes and gifts of cattle,
    horses, wagons, and Soma-like bounty. The final fragment names the Maruts adoring
    Indra and mentions three great celestial lights.
  language: English
  quote_policy: summarized
