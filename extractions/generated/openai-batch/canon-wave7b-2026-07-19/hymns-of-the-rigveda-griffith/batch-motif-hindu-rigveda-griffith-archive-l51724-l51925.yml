  quote: ''
  summary: The passage praises Agni as priest, messenger of the gods, purifier, flame,
    guest of humankind, and granter of wealth, heroes, progeny, and renown. It then
    praises Indra as thunder-armed Vritra-slayer, giver of riches and strength, drinker
    of Soma, winner of kine, and conqueror of foes.
  language: English
