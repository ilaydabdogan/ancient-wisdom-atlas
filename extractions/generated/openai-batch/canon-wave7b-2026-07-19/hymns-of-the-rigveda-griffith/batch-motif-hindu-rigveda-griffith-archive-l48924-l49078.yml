canonical_text:
  quote: ''
  summary: 'A Rigvedic praise and invocation of Indra: he is called during sacrifice
    and battle, urged to drink Soma, credited with spreading heaven and earth, lighting
    the Sun, sending waters to the sea, helping named figures, defeating Vritra and
    the Great Dragon or Serpent, releasing cattle from a mountain hold, and being
    associated with the gift of an exceptional horse.'
  language: English
  quote_policy: summarized
