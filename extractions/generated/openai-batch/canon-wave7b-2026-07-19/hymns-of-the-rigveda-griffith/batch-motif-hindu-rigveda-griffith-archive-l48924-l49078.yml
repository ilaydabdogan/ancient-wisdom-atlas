  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Indra is said to have hurled Vritra down from lofty plains and driven forth
    the kine of Mrigaya and Arbuda from a mountain hold.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Bright fires, the shining Sun, and clear Soma accompany the statement that
    Indra blew the Great Dragon, or Serpent Ahi, from the air.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A very fine courser is linked with Indra, the Maruts, and Pakasthaman Kaurayana;
