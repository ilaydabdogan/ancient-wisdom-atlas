- id: obs:1
  text: Worshippers call Indra while sacrifice proceeds and in battle so that they
    may win spoil.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Indra is said to have spread out heaven and earth, lighted the Sun, held all
    creatures, and received the distilling Soma-drops.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men, the Ribhus, and the Rudras urge or sing to Indra to drink Soma first,
    and Indra's strength increases at sacrifice in the rapture of the juice.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker asks Indra for hero strength and says Indra helped Bhrigu, the
    Yatis, Praskanva, Paura, Rugama, Syivaka, Svarnara, and Kripa.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Indra is credited with sending mighty waters to the sea, and his power is
    described as unattainable.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Songs and hymns of praise ascend to Indra like ever-conquering chariots, and
