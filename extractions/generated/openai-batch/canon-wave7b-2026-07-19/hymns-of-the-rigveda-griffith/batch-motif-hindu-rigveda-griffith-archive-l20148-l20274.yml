  quote: ''
  summary: The hymn addresses Agni in a ritual setting, with the speaker acting as
    Soma priest and preparing press-stones and worship. Agni is described as discovered
    by the Gods in waters, born or received among the Seven Floods/Rivers and Sisters,
    nourished by rivers, mothers, bosoms, and sweet streams, connected with Heaven
    and Earth and a Father/Sire/Maker, and finally strengthened and placed within
    the lap of Order in the Sister Rivers’ service.
