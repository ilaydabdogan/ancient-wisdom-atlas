canonical_text:
  quote: ''
  summary: A Rigvedic hymn section praises Indra with lauds, Soma, and sacrificial
    imagery. Indra is described as growing great, receiving hymns and offerings, wielding
    thunder, consuming enemies, being set foremost by the Gods, slaying Vritra the
    stayer of floods, empowering Vishnu’s three strides, setting the Sun in heaven,
    receiving submission from creatures and Maruts, and being asked to grant wealth
    in men, horses, and cattle.
  language: English
  quote_policy: summarized
