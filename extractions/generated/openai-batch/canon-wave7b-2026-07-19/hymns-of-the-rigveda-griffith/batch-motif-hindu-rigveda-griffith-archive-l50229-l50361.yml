  evidence_refs:
  - ev:1
- id: obs:2
  text: Indra’s beams are described as strong, thunder rests between his arms, and
    he is said to have increased both Heaven and Earth like the Sun.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Indra is said to have eaten a thousand buffaloes and to consume a malicious
    man with the rays of Surya, with a comparison to Agni conquering woods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sacrificial thought, praise, and Soma are presented as purifying, increasing,
    and marking; sages gladden Indra with hymns, and sacrificial substance swells
    in Agni’s mouth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Aditi is said to bring forth a hymn for Indra, priests sing for aid, and Indra
