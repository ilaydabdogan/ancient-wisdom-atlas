canonical_text:
  quote: ''
  summary: The passage praises Soma Pavamana as an effused, purified divine juice
    that flows for Indra and the gods, is pressed by men, filtered through fleece
    and a sieve, mixed with milk and waters, and conveyed to Indra. Soma is described
    as bringing gifts, food, homes, progeny, wisdom, strength, possessions, fame,
    and protection. The hymns also attribute cosmic and martial powers to Soma, including
    sustaining the sky, generating the Sun, spreading moisture, overcoming Vritras
    and demons, and appearing as a gold-hued or playful infant during purification.
  language: English
  quote_policy: summarized
