    cannot show his strength and then proclaim him with royal titles and birth-formulas.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Before anointing, the officiant addresses the seated recipient with a verse
    about Varuna sitting within the waters and preserving order for forms of rule.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The anointing is performed while the recipient sits on the throne, through
