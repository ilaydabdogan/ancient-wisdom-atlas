canonical_text:
  quote: ''
  summary: 'The passage describes a royal consecration rite: a throne is ritually
    identified with chants, metres, furnishings, and divine supports; the recipient
    mounts it under invocations to divine groups; king-makers proclaim his royal status;
    an officiant anoints him with waters through an Udumbara branch and golden strainer
    while invoking directions and deities; the rite promises victorious kingship,
    supremacy, heaven, and immortality.'
  language: English
  quote_policy: summarized
