  quote: ''
  summary: The passage contains the end of an Agni hymn, Hymn V to Agni/Vaisvanara,
    and the opening of Hymn VI. Agni is praised as young yet wise, born of his Mother,
    an unborn babe supported by plants and earth, messenger between earth and heaven,
    cosmic ruler, giver of wealth and protection, and destroyer of forts and hostile
    Dasyu or dark foes. Worshippers petition him for defense, prosperity, strength,
    sons, understanding, and divine blessings.
