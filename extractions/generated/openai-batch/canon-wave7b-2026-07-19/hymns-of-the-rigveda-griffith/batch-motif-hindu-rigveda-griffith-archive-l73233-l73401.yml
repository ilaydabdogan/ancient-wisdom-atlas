canonical_text:
  quote: ''
  summary: The passage moves from Brihaspati cleaving a rock, recovering sweetness,
    light, fire, Morning, and cattle from Vala, and establishing celestial order,
    into hymns to Agni as Vadhryasva’s fire, fed with butter, protective, victorious,
    and ritually enkindled by Vadhryasva, Sumitra, and Manu. It then begins an Apris
    hymn in which Agni, Narasansa, Holy Grass, Doors, Dawn and Night, Aditi, and priests
    are invoked in sacrificial worship.
  language: English
  quote_policy: summarized
