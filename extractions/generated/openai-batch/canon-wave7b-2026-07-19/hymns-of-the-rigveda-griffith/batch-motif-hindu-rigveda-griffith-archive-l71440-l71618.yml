canonical_text:
  quote: ''
  summary: The passage presents Agni/Jatavedas as recipient of life and offerings,
    elected and seated by the Gods as priest, oblation-bearer, and invoker. It includes
    ritual instructions, divine honoring with grass and butter, references to Indra's
    thunder, the quelling of Asura foes, pleasing the Five Tribes and Cow's Sons,
    weaving and chariot imagery, a crossing of the Asmanvati river toward auspicious
    Powers, and Tvashtar preparing bowls and an axe for Brahmanaspati.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Agni/Jatavedas is given unwasting life and is asked to bear the Gods' share
    of human oblations; first and latter oblations and all sacrifice are assigned
    to him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A priestly speaker asks all the Gods how to sit, address them, distribute
    portions, and bring human oblation by the correct path.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says he sits as a skilled sacrificing priest, impelled by the
    Maruts and all deities; the Asvins are addressed in connection with daily Adhvaryu
    duty.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A question asks who the priest is and whether he is the priest of Yama; the
    answer says the Gods made him their oblation-bearer.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Agni says he slipped away, passed through many troubles, and will ordain worship
    in forms described as five-wayed, threefold, or seven-threaded.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Agni says he will win strength and life for the Gods and would consign the
    thunder to Indra's arms so that Indra will be victorious in battles.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Three thousand three hundred and thirty-nine deities are said to have served
    and honored Agni, strewn sacred grass, anointed him with butter, and seated him
    as priest and Gods' Invoker.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The sought figure arrives as one skilled in sacrifice, sits as Friend, makes
    the feast of the Gods effective, and is identified with the secret tongue of worship.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A divine speech is introduced as a means by which the Gods may quell Asura
    foes; the Five Tribes and the Cow's Sons are asked to be pleased with the oblation.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Earth and the mid-air realm are asked to protect from earthly trouble and
    from woe that comes from heaven.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage commands spinning a thread, following a region's splendid light,
    guarding wisdom-prepared pathways, weaving knotless labor, becoming Manu, and
    bringing the Heavenly People forth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage commands lovers of Soma to bind chariot traces, set reins in order,
    and bring a car with eight seats that has carried beloved treasure from the Gods.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: At the flowing Asmanvati, companions are told to hold fast, keep themselves
    up, pass the river, leave Powers that brought no profit, and cross the flood to
    auspicious Powers.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Tvashtar, described as a deft workman who knows magic arts, brings bowls for
