candidate_motifs:
- id: motif:1
  label: Divine warrior defeats demonic or hostile powers
  taxonomy_refs:
  - chaos
  basis: Indra slays Dasyus, gives adversaries to allies, quells Araru, and aids the
    bursting of Pipru's stall and subduing of forts; a note calls Pipru a demon of
    drought.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The taxonomy reference 'chaos' is approximate; the passage emphasizes
    combat with demons and hostile powers rather than an explicit cosmogonic chaos
    episode.
- id: motif:2
  label: Ritual offering exchanged for divine protection and wellbeing
  taxonomy_refs:
  - sacred_exchange
  basis: The hymn offers praise, Soma or juice, milk, and sacrifice while repeatedly
    asking the gods for freedom, complete felicity, protection, full life, happiness,
    and removal of enmity or malady.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:13
  - ev:14
  - ev:15
  confidence: high
  cautions: The exchange is liturgical and petitionary, not narrated as a single transaction.
- id: motif:3
  label: Sacrifice as sustaining ancestor or sire
  taxonomy_refs:
  - sacrifice
  - divine_parent_child
  basis: The hymn states that sacrifice is Manu, Providence, and Sire, and the note
    explains Manu as father of Aryan men and sacrifice as the basis of existence and
    preservation.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The parent-child taxonomy is only partially supported; the passage personifies
    sacrifice as a paternal source rather than telling a parent-child narrative.
- id: motif:4
  label: Healing through divine removal of malady and ritual substances
  taxonomy_refs:
  - sacred_exchange
  basis: Savitar is asked to remove malady, the Mountains to keep it away, the press-stone
    to avert enmities, and the kine's milk/body to be medicine for the worshippers'
    bodies.
  evidence_refs:
  - ev:13
  - ev:14
  - ev:15
  confidence: medium
  cautions: No dedicated healing taxonomy ref is available; 'sacred_exchange' is used
    because the healing is requested within ritual prayer and libation.
- id: motif:5
  label: Alien shape or sorcerous transformation denied
  taxonomy_refs:
  - shapeshifter
  basis: The worshippers declare that none of them has worn an alien shape, and the
    note explains this as something sorcerers are accustomed to do.
  evidence_refs:
  - ev:12
  confidence: low
  cautions: The passage denies the act rather than narrating a transformation; the
    motif candidate is based on a brief allusion.
comparison_claims:
- id: claim:1
  claim: The translator's note states that the last clause of stanza 12 is borrowed
    from Rigveda X.20.10, supporting a limited claim of textual reuse or close verbal
    parallel within the Rigvedic corpus.
  claim_level: linguistic_similarity
  target: Rigveda X.20.10
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supplies only the translator's note and does not provide
    the compared wording of Rigveda X.20.10.
- id: claim:2
  claim: The note on Araru points to Satapatha-Brahmana 1.2.4.17 and reports an alternative
    interpretation in which the passage concerns measuring the year in four divisions,
    indicating a cautious nearby-corpus interpretive comparison.
  claim_level: same_function
  target: Satapatha-Brahmana 1.2.4.17 and a fourfold-year interpretation
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: low
  limitations: The cited external passage is not included, and the note presents the
    interpretation as conjectural rather than certain.
