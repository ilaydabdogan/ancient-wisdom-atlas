- id: ev:9
  type: summary
  locator: lines 77111-77115
  quote_or_summary: Savitar is asked to send full life to each sacrificer who lives
    rightly and pours the juice, so that the worshippers may wait upon the gods with
    simple hearts.
  source_text_path: texts/public-domain/hindu/project-gutenberg/hymns-of-the-rigveda-griffith.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 77116-77126 and 77144-77146
  quote_or_summary: Indra is asked to be gracious; Soma to meditate happiness; Indra
    is said to have given body, song, and strength; Brihaspati lengthens life; sacrifice
    is called Manu, Providence, and Sire. A note explains Manu as father of Aryan
    men and sacrifice as supporting existence and preservation.
  source_text_path: texts/public-domain/hindu/project-gutenberg/hymns-of-the-rigveda-griffith.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 77127-77130 and 77147-77148
  quote_or_summary: Indra possesses celestial might; Agni is the singer in the house
    and prudent Sage, and is called sacrifice in synod; a note glosses this as worthy
    of sacrifice at the altar.
  source_text_path: texts/public-domain/hindu/project-gutenberg/hymns-of-the-rigveda-griffith.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 77131-77135 and 77149
  quote_or_summary: The speakers say they have not often sinned secretly, openly provoked
