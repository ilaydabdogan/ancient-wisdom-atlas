canonical_text:
  quote: ''
  summary: The passage contains a Vayu fragment, hymns to Indra-Agni, and a hymn to
    Sarasvati. Vayu is invited to the sacrifice and libation for protection and victory.
    Indra and Agni are invoked as paired deities who accept praise, grant strength
    and wealth, protect worshippers, aid the godly in battle, and slay hostile or
    demonic opponents, including a water-staying Serpent. Sarasvati is praised as
    a powerful protective river or Lady flowing from mountains to ocean, nourishing
    Nahusha with milk and fatness, receiving sacrifice and praise, sheltering worshippers
    like a tree, and being ritually approached by Vasishtha.
  language: English
  quote_policy: summarized
