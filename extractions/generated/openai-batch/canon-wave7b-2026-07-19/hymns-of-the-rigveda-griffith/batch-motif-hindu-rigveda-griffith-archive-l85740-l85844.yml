  quote: They who know this obtain immortality.
  summary: 'The passage explains ritual use of Vedic metres and Soma pressings through
    a series of etiological accounts: Prajapati assigns metres to gods and restores
    Anustubh to the beginning; Agni evades Death through ritual recitation; Indra
    withdraws into speech after slaying Vrtra and is brought back through pressed
    Soma and hymns; the Maruts remain as Indra''s true comrades; Brhaspati is named
    as priestly aid of the gods.'
  language: English
  quote_policy: quoted
