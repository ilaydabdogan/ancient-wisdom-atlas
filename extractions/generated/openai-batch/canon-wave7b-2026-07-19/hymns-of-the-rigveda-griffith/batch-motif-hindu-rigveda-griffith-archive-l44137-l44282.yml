canonical_text:
  quote: ''
  summary: The passage recounts Indra aiding Sudds and the Tritsus in the conflict
    with the Ten Kings through Vasishtha devotion and praise. It then praises the
    Vasishthas’ cosmic knowledge and describes Vasishtha’s extraordinary origin involving
    lightning or lustre, Varuna and Mitra, Urvasi or the Apsaras, Yama’s vesture,
    a lotus-blossom, sacrifice, a pitcher, and Mana or Agastya. The passage closes
    with ritual approach to Vasishtha and the beginning of a Visvedevas hymn in which
    waters listen and know the origin of heaven and earth.
  language: English
  quote_policy: summarized
