candidate_motifs:
- id: motif:1
  label: ritual praise secures divine battle aid
  taxonomy_refs:
  - sacred_exchange
  basis: The Vasishthas’ devotions and praise are the means through which Indra helps
    Sudds and gives the Tritsus freedom.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage presents the exchange as devotional praise and divine aid,
    not as a formal contract.
- id: motif:2
  label: sacred or miraculous birth of a sage
  taxonomy_refs:
  - sacred_birth
  - miraculous_child
  basis: Vasishtha’s origin is described through divine parents, Urvasi or the Apsaras,
    a fallen drop, lotus-blossom, lightning-like form, sacrifice, and a pitcher.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage describes birth imagery for a sage or priest; it does not
    narrate an ordinary childhood.
