  label: divine parentage of a priest-sage
  taxonomy_refs:
  - divine_parent_child
  basis: Vasishtha is explicitly called the son of Varuna and Mitra.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The birth account is mythic and obscure, with multiple overlapping explanatory
    images.
- id: motif:4
  label: birth from sacrificial vessel
  taxonomy_refs:
  - sacrifice
  - sacred_birth
  basis: The passage states that at the sacrifice a pitcher was bedewed, Mana rose
    from it, and Vasishtha was said to be born from it.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The relation between Mana, Agastya, and Vasishtha is explained only briefly
    in the note.
- id: motif:5
  label: hidden wisdom and cosmic knowledge
  taxonomy_refs:
  - wisdom
  basis: The Vasishthas use perceptions of the heart in secret, and Vasishtha is called
    a thinker and knower of earth and heaven.
  evidence_refs:
