canonical_text:
  quote: "“May Varuna untie the bond that binds us.”"
  summary: The passage contains prayers to Varuna, Vayu, and the paired Indra-Vayu.
    The speaker asks for favour from Aditi, release from Varuna’s bond, mercy from
    Varuna, avoidance of the “house of clay” glossed as the grave, and non-punishment
    for offences against divine law. Subsequent hymns invite Vayu and Indra-Vayu to
    drink Soma offered by priests, arrive with harnessed horses and teams, sit on
    sacred grass, and grant fame, sons, wealth, cattle, horses, protection, and renewed
    well-being. A dawn passage says the Dawns found spacious light, disclosed a stall
    of cattle, and caused floods to stream.
  language: English
  quote_policy: quoted
