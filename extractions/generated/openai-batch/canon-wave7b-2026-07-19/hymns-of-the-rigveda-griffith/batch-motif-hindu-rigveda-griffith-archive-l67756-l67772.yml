canonical_text:
  quote: ''
  summary: The addressed person is told to meet Yama, the Fathers, and the merit of
    deeds in highest heaven, to leave sin and evil, seek a new dwelling, and wear
    another body. Others are told to depart from the place prepared by the Fathers.
    Yama grants the person a resting place adorned with days, light, and waters. The
    person is urged to run beyond two four-eyed brindled dogs, offspring of Sarama,
    on a happy path, and then to approach the Fathers in company with Yama.
