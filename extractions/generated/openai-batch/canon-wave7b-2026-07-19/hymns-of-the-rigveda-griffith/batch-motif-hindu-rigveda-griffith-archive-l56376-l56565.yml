canonical_text:
  quote: The blind man sees, the cripple walks
  summary: The passage contains several translated Rigvedic hymn sections invoking
    Indra and Soma. Indra is praised as unconquerable, all-seeing, giver of gifts
    and spoil, helper in a chariot contest, and recipient of ritual song and offerings.
    Soma is praised as active, wise, healing, protective, gentle, and able to remove
    hatred and enmity. The passage also includes requests for harvest, cattle, gold,
    horses, wealth, victory, long life, and ritual favor.
  language: English
