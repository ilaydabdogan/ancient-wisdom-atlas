canonical_text:
  quote: ''
  summary: The passage contains the latter part of an Agni hymn and the opening of
    another. Agni is praised as accepting mortal worship, guiding worshipers to wealth
    and offspring, acting as a wise and priestly divine mediator, and receiving Soma
    and hymns. The speakers identify with seven sages or Angirases, invoke Dawn as
    Mother and Heaven as parent, and describe ancient Fathers who sought light, made
    Dawns apparent, and approached cattle imagery connected by the note with hidden
    cows or rays in a mountain or cave. The following hymn invokes Agni under the
    name Rudra, prepares a shrine for his arrival, and asks what Agni will say to
    several deities about complaint or transgression.
