canonical_text:
  quote: ''
  summary: The passage praises and invokes Indra as a mighty, thunderbolt-bearing
    warrior and wealth-giver. It recounts his destruction of named foes and forts,
    asks him to smite Vritra, refers to his slaying of Ahi, invokes Agni, describes
    Soma and sacrifice, and states that Indra, allied with Vishnu, slew Vritra the
    Dragon who enclosed the waters. Several stanzas ask Indra for protection, victory,
    wealth, offspring, cattle, and waters.
  language: English
  quote_policy: summarized
