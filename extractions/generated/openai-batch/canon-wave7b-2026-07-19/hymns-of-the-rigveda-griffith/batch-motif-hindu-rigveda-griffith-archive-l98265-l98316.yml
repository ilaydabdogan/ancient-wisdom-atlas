canonical_text:
  quote: ''
  summary: 'The supplied passage presents a sequence of correspondences in which breath,
    eye, and ear are treated as parent powers served by cosmic domains or luminaries:
    sky and air serve breath; heaven and sun are created by and serve the eye; quarters
    and moon are created by and serve the ear. It also links knowing these powers
    with an enduring world and includes editorial/commentarial notes on grammar, Asuras,
    Visnu, sacrificial acts, and a variant moon association.'
  language: English
  quote_policy: summarized
