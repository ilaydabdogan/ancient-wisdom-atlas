candidate_motifs:
- id: motif:1
  label: magical plant spell to remove a rival and secure a spouse
  taxonomy_refs: []
  basis: The spell addresses a god-sent victorious plant and uses it with a stronger
    spell to drive away a rival wife and draw the husband's spirit to the speaker.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage frames this as a spell, but no broader taxonomy reference
    from the supplied list exactly matches rival-removal magic.
- id: motif:2
  label: forest goddess as mother and provider
  taxonomy_refs:
  - mother_goddess
  basis: Aranyani is a goddess of the wild and forest, praised as Forest Queen and
    mother of all sylvan things, with untitled stores of food.
  evidence_refs:
  - ev:7
  - ev:13
  confidence: medium
  cautions: The mother-goddess taxonomy fit rests on the explicit phrase 'Mother of
    all sylvan things,' not on a developed maternal narrative.
