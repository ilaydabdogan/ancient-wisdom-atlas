canonical_text:
  quote: ''
  summary: The passage contains the end of a spell in which a favoured wife uses a
    victorious plant and a stronger spell to drive away a rival wife and draw the
    husband's spirit to herself; a hymn to Aranyani, the forest goddess, describing
    the sounds, illusions, food, and safety of the forest; hymns to Indra that recall
    his slaying of Vritra, request wealth, sons, protection, victory, and prosperity
    through hymns, oblations, pressed Soma, and sacrificial rites; and the heading
    of a hymn to Savitar.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A note identifies the first hymn segment as a spell to rid a jealous wife
    of a more favoured rival, with Indrani as the rishi and consort of Indra.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A plant is addressed as auspicious, expanded-leaved, sent by the gods, and
    victorious, and is asked to blow the rival wife away and make the husband belong
    only to the speaker.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker declares herself stronger and mightier, and says the rival wife
    is lower than the lowest women.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker refuses to utter the rival wife's name and says the rival takes
    no pleasure in the man; the rival is driven far away.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker and the plant are both called victorious, and together they are
    said to subdue the fellow-wife.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker says she has grasped the plant with a stronger spell and asks
    the husband's spirit to hasten to her like a cow to her calf and like water on
    its way.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Aranyani is addressed as a goddess of wild and forest who seems to vanish
    from sight and is asked why she does not seek the village and whether she is afraid.
  category: speech
  evidence_refs:
  - ev:7
