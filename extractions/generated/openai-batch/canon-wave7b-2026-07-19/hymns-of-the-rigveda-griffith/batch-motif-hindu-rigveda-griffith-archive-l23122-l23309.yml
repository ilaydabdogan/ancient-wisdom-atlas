canonical_text:
  quote: ''
  summary: The passage contains an obscure hymn with commentary, describing sages
    who frame and uphold heaven, cosmic measurement and separation of worlds, a self-luminous
    Bull or solar form reaching eternal waters, a holy synod with three seats and
    Gandharvas, Savitar’s golden light, divine protection, and Indra as battle-helper
    and Vritra-slayer. A following hymn to Indra describes an ancient hymn, the birth
    of Twin Children from the Mother of Twins, the defeat of darkness, and Indra’s
    recovery of cattle, the hidden Sun, meath in a milch-cow, and light from darkness.
  language: English
  quote_policy: summarized
