canonical_text:
  quote: ''
  summary: The passage invokes Aditi, Mitra, Varuna, Aryaman, the Maruts, rivers,
    Heaven and Earth, Fathers, Agni, Indra, Soma, and the collective gods. It asks
    divine powers to attend sacrifice, hear hymns, grant water, wealth, protection,
    gifts, and ritual kinship. It also describes Heaven and Earth as parents or mothers
    who uphold gods and men, and states that the gods dwell in Law, prop up heaven,
    bring waters, and make sacrifice fair.
  language: English
  quote_policy: summarized
