canonical_text:
  quote: ''
  summary: The passage contains Griffith notes and translated stanzas. The Asvins
    are invoked for favor, protection, sons, riches, a ford, and the removal of an
    obstacle from the path. Their three-wheeled car is called at dawn to the libations,
    and priests and sacrificers are mentioned. Indra is praised and invited to Soma;
    he is asked to grant wealth, quicken intelligence, defeat foes, subdue famine,
    and protect worshippers. Brihaspati and Indra are invoked as protectors from different
    directions, and Indra is pictured seated as king by the Soma juice.
  language: English
  quote_policy: summarized
