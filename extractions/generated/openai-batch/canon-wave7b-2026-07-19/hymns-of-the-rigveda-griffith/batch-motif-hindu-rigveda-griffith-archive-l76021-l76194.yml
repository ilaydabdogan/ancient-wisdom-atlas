canonical_text:
  quote: ''
  summary: The passage invokes many Vedic deities and divine groups, praises them
    through hymns and sacrifice, recalls ancestral ritual figures, and asks for protection,
    release from danger, wealth, fame, horses, and royal or noble favor. It includes
    imagery of Rudra and the Maruts, Indra’s thunderbolt, the Dragon of the Deep,
    Sun and Moon, Heaven and Earth, Agni as the Waters’ Child, sacrificial stones
    and drink, chariots, steeds, and patronal gifts.
  language: English
  quote_policy: summarized
