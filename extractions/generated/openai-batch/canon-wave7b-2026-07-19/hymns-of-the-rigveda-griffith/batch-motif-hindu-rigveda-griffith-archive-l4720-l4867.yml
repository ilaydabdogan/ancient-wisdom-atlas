canonical_text:
  quote: ''
  summary: The passage contains translator's notes and hymnic verses to Indra. It
    identifies Vritra as a rain-obstructing demon or Dragon; describes Indra, aided
    by the Maruts and gladdened by Soma, striking Vritra with a thunderbolt; praises
    Indra as cosmic, martial, and wealth-giving protector; and recounts victories
    over demons, forts, hostile kings, and enemies. Notes also compare Trita's escape
    from a covered well with Indra's breaking of Vala's defenses and gloss Tvashtar
    by comparison with Vulcan or Hephaestus.
  language: English
