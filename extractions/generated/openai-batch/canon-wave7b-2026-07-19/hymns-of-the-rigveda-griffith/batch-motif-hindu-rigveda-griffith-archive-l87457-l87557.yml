canonical_text:
  quote: ''
  summary: The passage gives ritual instructions for using particular metres in the
    vaṣaṭ call, then explains the Caturviṃśa and Mahāvrata days in relation to grasping
    the year, the Stomas, metres, deities, Soma pressing, and safe passage across
    the year. It uses images of ships, feet, wings, a vessel loose from its fastening,
    seed poured and born in a year, and the two sides of the year.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage prescribes saying the vaṣaṭ call with a Gāyatrī and a Triṣṭubh,
    or with a Gāyatrī and a Virāj.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the Gāyatrī is holy power, the Triṣṭubh is strength,
    and the Virāj is food.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The quoted ritual calls address the Aśvins, mention Vāyu, and refer to Soma
    juice ready to be drunk.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Caturviṃśa day is described as a beginning by which the year, the Stomas,
    the metres, and all the deities are grasped.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage connects twenty-four with the half-months, fifteen Stotras and
    fifteen Śastras with the month, and three hundred and sixty Stotriya verses with
    the days of the year.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Ukthya and the animal offering are described as serving the winning of
    cattle and as making the sacrifice and Sattra perfect.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Brhat and Rathantara Sāmans are described as two ships that carry the
    sacrifice across, and by them the performers cross over the year.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Brhat and Rathantara are also described as two feet and as two wings,
    while the day is described as the head, identified with prosperity.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage warns that the two Sāmans should not both be laid aside; if they
    were, the performers of Sattras would float like a vessel separated from its fastening
    and moving to either bank.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Those who know the rite obtain the year by days, half-months, months, Stomas,
    metres, and deities, practice fervour, partake of Soma, and continue pressing
    Soma all year.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage contrasts straight-on performance, which lays a heavy crushing
    burden on the performers, with approaching the rite reversed after obtaining it,
    which leads safely to the other side of the year.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Mahāvrata is identified with the Caturviṃśa, and the Hotr is said to pour
