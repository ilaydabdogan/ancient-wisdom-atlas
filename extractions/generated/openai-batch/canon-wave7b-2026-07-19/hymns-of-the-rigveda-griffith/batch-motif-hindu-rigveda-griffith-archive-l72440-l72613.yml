canonical_text:
  quote: ''
  summary: The passage praises the Angirases/Fathers as wise ritual figures who, through
    sacrifice and Indra's friendship, win eternal life, cleave Vala, release cattle,
    raise the Sun, spread Earth, and welcome the son of Manu. It then blesses liberal
    donors. A following hymn invokes the Visvedevas and Adityas as divine protectors
    born from waters, Aditi, and earth; it recalls Manu's first oblation by seven
    priests with kindled fire and asks the gods for shelter, safe paths, protection
    from sin, disease, enmity, and passage by a well-oared heavenly ship.
  language: English
  quote_policy: summarized
