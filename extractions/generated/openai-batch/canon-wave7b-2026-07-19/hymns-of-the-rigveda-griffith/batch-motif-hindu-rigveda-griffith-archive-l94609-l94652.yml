canonical_text:
  quote: ''
  summary: A ritual passage describes formulas involving milk, protection, offspring,
    cattle, movement through the quarters by threefold knowledge, concluding butter
    libations, an invocation for the propagation of cows, horses, and men, the benefits
    and dangers of knowledgeable or ignorant sacrifice, and Janamejaya Pariksita's
    claim of conquest, immunity to arrows, full life, and lordship over the earth.
  language: English
  quote_policy: summarized
