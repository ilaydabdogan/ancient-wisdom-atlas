- id: obs:1
  text: An unnamed ritual beneficiary approaches holy power, breath, immortality,
    protection, freedom from fear, safety, offspring, cattle, and milk described as
    a living gift.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The protected one wanders through all quarters by the form of threefold knowledge
    and finds support in the world of Indra.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the end, the priest offers three libations of butter in four portions with
    a bowl in the Prapad manner.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A concluding invocation asks that cows, horses, and men be propagated, and
    mentions a hero or protector sitting down where a thousand fees are to be given.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The one who invokes the propagation of cows, horses, and men becomes multiplied
    with offspring and cattle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Ksatriya for whom priests sacrifice with knowledge is not brought low; one
    for whom they sacrifice without knowledge is brought low.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A simile compares ignorant priests to outcasts, robbers, or evildoers who
