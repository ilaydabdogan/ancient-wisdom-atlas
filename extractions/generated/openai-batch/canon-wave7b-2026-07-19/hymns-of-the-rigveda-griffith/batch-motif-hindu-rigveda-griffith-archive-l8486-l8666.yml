canonical_text:
  quote: ''
  summary: The passage contains notes and hymnic material centered on Indra and the
    Visvedevas. It explains Indra’s power in relation to hymns, sacrifices, Soma libations,
    Sun, and fire; describes drought or enemy figures; recounts Indra finding cattle,
    horses, plants, forests, and waters and striking named opponents; invites Indra
    to an altar and to drink Soma; petitions him for water, sunlight, food, protection,
    and unborn offspring; and presents images of milk, rivers, Moon, lightning, conjugal
    union, sacrifice, and divine law.
  language: English
  quote_policy: summarized
