- id: motif:2
  label: Sacred exchange of praise and offering for rain, food, and long life
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The singer offers hymn and oblation and asks for showers, food, pasturage,
    plant fruitage, protection, and survival to a hundred autumns.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage gives ritual request and offering language but does not describe
    a full sacrificial procedure in detail.
- id: motif:3
  label: Seasonal reawakening at the first rains
  taxonomy_refs:
  - seasonal_cycle
  basis: The frogs lie quiet for a year, emerge and vocalize when Rain-time returns,
    and keep a twelve-month order.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The text suggests seasonal renewal but does not state that the frogs die
    and are reborn.
- id: motif:4
  label: Animals as ritual priests or priestly satire
  taxonomy_refs: []
  basis: The frogs are compared to Brahmans fulfilling vows, Brahmans at a Soma rite,
    and Adhvaryus; the note reports a satirical interpretation of the hymn as a panegyric
    on frogs representing priests.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:9
  confidence: medium
  cautions: The satirical reading comes from the note; the hymn itself states priestly
    similes but does not explicitly call itself satire in the translated verses.
- id: motif:5
  label: Divine destruction and punitive casting of demonic enemies
  taxonomy_refs:
  - divine_judgment
  basis: Indra and Soma are asked to burn, destroy, pierce, cast down, plunge into
    darkness, and prevent the return of wicked demonic foes.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage is an invocation against enemies; it does not present a courtroom-like
    judgment scene.
