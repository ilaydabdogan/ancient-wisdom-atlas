candidate_motifs:
- id: motif:1
  label: Cosmic parental fertilization by rain
  taxonomy_refs:
  - divine_parent_child
  - sacred_marriage
  basis: The passage uses Father, Mother, Sire, son, rain-flow, and impregnation imagery
    to describe rain nourishing offspring and living beings.
  evidence_refs:
