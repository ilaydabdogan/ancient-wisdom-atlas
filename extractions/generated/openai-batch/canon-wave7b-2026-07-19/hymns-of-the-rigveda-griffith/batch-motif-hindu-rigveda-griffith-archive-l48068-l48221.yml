  quote: ''
  summary: The passage contains hymnic material and notes on Parjanya as rain-giver
    and life-impregner; a Frog hymn in which frogs fall silent for a year and then
    call during the rains, with repeated comparisons to Brahmans and Soma ritualists;
    and the opening of an Indra-Soma hymn invoking the two gods to burn, cast down,
    and annihilate demonic enemies.
