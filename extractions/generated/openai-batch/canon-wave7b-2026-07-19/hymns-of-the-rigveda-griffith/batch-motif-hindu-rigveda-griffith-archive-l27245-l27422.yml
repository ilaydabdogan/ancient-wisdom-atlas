  quote: ''
  summary: The passage contains the close of an Indra hymn and Hymn XXII to Indra.
    The speakers call Indra to their dwellings and rites, praise his thunder-bearing
    power, describe his birth as shaking heaven and earth, recount his destruction
    of Vritra or the Dragon and the release or motion of waters, cattle, and prisoners,
    and ask him for bounty, strength, wisdom, cattle, and victory.
