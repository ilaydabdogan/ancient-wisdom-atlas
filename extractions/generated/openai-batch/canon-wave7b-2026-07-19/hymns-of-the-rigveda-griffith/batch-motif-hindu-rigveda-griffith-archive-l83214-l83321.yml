canonical_text:
  quote: ''
  summary: 'The passage explains the Upasads in the Soma sacrifice through mythic
    and ritual correspondences: gods and Asuras contend for the worlds; Asuras make
    the worlds into citadels; the gods use Upasad rites as siege-victories to repel
    them from cosmic regions and divisions of time. The gods also establish a bodily
    covenant in Varuna''s house, and the Upasads are associated with a divine arrow,
    butter, milk, and the body of the sacrifice.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The gods and the Asuras are said to have struggled for the worlds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Asuras made the earth, atmosphere, and sky into citadels described respectively
    as iron, silver, and gold.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The gods made opposing citadels from ritual elements: the Sadas, the Agnidh''s
    altar, and two oblation holders.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gods used Upasad performances as a siege means and repelled the Asuras
    from the world, atmosphere, and sky.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: After being repelled from the worlds, the Asuras successively resorted to
    seasons, months, half-months, and day and night; the gods matched these divisions
    with numbered Upasad performances and excluded them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Upasads are called victories, and the passage says the gods won an unrivalled
    victory by them.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The gods feared that disagreement among them would allow the Asuras to grow
    powerful, so they went apart in groups and took council.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The gods deposited their dearest bodies in the house of king Varuna, forming
    a bodily covenant that forbids treachery.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The guest reception is identified with the head of the sacrifice, and the
    Upasads with the neck.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Upasads the gods fashioned an arrow whose point was Agni, socket Soma,
    shaft Visnu, and feathers Varuna; they discharged it using butter as a bow to
    pierce the citadels.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The number of teats used for fast milk is correlated with the number of parts
    of the arrow, and the Upasads are performed from the top downward for conquering
    the worlds.
  category: relationship
  evidence_refs:
  - ev:8
