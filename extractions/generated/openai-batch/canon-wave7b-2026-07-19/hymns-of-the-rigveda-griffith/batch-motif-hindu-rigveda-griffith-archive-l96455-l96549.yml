canonical_text:
  quote: ''
  summary: A ritual passage prescribes mounting toward food, fortune, strength, sap,
    and proper food; priests sit on grass, vegetation bears fruit, and descent is
    to occur only after seeing the food and toward the east, where the seed of the
    gods is said to be born. A following section prescribes beginning the day with
    the word Aum, relating Aum to brahman, pairing a masculine word with a feminine
    counterpart for offspring, likening Aum to a wooden shovel that digs up brahman
    and desires, and making Aum the discriminator of divine and human speech.
  language: English
  quote_policy: summarized
