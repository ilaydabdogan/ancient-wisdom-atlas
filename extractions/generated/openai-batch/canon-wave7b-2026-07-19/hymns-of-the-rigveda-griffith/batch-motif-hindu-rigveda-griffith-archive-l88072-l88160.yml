    transposed by Prajapati in a twelve-day rite; the separation and reunion of the
    two worlds, earth and sky, through divine marriage and mutual quickening; the
    generative ordering of liturgical forms such as Brhat, Rathantara, metres, and
    Prsthas; and the symbolic marks of the first day of the Prsthya Sadaha under Agni.
  language: English
