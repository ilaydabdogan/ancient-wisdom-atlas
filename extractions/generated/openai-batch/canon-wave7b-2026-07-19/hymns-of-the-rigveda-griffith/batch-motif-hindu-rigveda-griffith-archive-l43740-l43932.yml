  quote: ''
  summary: The passage contains several hymnic stanzas to Indra. The speakers invoke
    him with prayers, Soma, libations, hymns, and offerings, asking for wealth, protection,
    battle aid, blessings, and divine attention. Indra is described as powerful, thunder-bearing,
    lord of bay or tawny steeds, Soma-drinker, warrior, friend, armor, Vritra-slayer,
    and king. The passage also mentions Varuna discovering sin, Agni as herald bringing
    the gods, the Maruts, Heaven and Earth, ascending drops reaching Indra in heaven,
    and worshippers gathered by poured juice at a feast.
