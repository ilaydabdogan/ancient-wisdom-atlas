canonical_text:
  quote: ''
  summary: The passage contains Rigvedic hymns and notes centered on Indra. Indra
    is praised as a heroic battle-god, ally of the Maruts, slayer of Vritras and foes,
    giver of cattle, riches, strength, and life. Worshippers invite him to drink Soma,
    often with milk, and offer roasted corn, groats, sacrificial cake, oblations,
    and songs. The passage also describes cosmic and natural domains preserving wealth
    for Indra and refers to his birth, his great fight, and his companions.
  language: English
