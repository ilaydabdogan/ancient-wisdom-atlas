canonical_text:
  quote: This world was water.
  summary: The passage describes mind as creating the waters and Varuna, who serve
    mind as their parent. It then states that the world was water and frames cause
    and effect through root and shoot, father and sons. Mahidasa Aitareya is said
    to know a reciprocal relation between himself and the gods. Eye, ear, mind, speech,
    and breath are called the hiding-place of Brahman. The one who knows this overcomes
    a hostile enemy. Breath or life is described as being and not-being, death and
    immortality; gods who adored it as being became great, while demons who adored
    it as not-being were overthrown. The passage cites RV I.164.38 about upward and
    downward movement, the immortal dwelling with the mortal, and mortal bodies with
    an immortal deity. It concludes that the knower becomes immortal in the other
    world, and begins a new section in which the shining one approaches the world
    in human shape as breath for a hundred years.
  language: English
  quote_policy: quoted
