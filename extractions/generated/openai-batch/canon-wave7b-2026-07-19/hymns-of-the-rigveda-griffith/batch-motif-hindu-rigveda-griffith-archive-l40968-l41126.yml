  quote: ''
  summary: The passage contains part of a note, Hymn LXIII addressed to the Asvins,
    and Hymns LXIV-LXV addressed to Dawn. The Asvins are invoked to attend sacrifice,
    drink the pressed juice, protect the house, receive oblation, and bestow wealth;
    Sūryā’s Daughter is said to have mounted their car, and patrons are praised for
    gifts. Dawn is described as radiant, heaven-born, path-making, wealth-bringing,
    and as driving away darkness while awakening humans and beginning ritual activity.
  language: English
  quote_policy: summarized
