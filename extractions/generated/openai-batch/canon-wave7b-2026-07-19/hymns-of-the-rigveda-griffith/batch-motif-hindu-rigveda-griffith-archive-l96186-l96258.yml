canonical_text:
  quote: ''
  summary: The passage gives ritual explanations for hymns associated with Indra,
    Agastya, the Maruts, Visvamitra, the sacrificer, and the Hotr priest. A scholarly
    note summarizes a possible story in which Agastya offers a sacrifice to the Maruts,
    Indra claims it, and Agastya pacifies both sides. The main ritual passage says
    a named hymn brought Indra, Agastya, and the Maruts into harmony, and that its
    recitation tends toward harmony and long life. It also explains a hymn by Visvamitra
    as creating friendship, and treats another hymn in the one-day ceremonial as atonement
    and rest after forbidden ritual acts.
