canonical_text:
  quote: ''
  summary: The passage describes a Vedic horse-sacrifice. A dappled goat precedes
    the sacrificial horse as Pishan's share. Priests, workers, implements, ropes,
    trappings, cooking vessels, flesh, and bodily parts are ritually ordered and offered
    so that the horse may go to the gods. The horse is addressed as not truly dying,
    but going by easy paths to the gods and bringing wealth, cattle, horses, offspring,
    freedom from sin, and lordship. The following hymn describes the horse's divine
    and cosmic origin from the sea or upper waters, its relation to the Sun, and its
    identification with several deities.
  language: English
  quote_policy: summarized
