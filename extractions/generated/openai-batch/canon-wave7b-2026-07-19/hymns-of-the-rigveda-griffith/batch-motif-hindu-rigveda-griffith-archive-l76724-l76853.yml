canonical_text:
  quote: ''
  summary: A Vedic hymn praises Herbs or Plants as ancient, powerful, maternal, divine
    healing agents. The speaker invokes them to free a patient from disease, drive
    away the spirit of illness, release sufferers from curse and divine fetters, and
    concentrate the powers of many plants into one medicinal herb.
  language: English
  quote_policy: summarized
