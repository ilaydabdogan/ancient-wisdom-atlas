canonical_text:
  quote: ''
  summary: A group of Rigvedic hymns invokes Indra to come from near or far, arrive
    with his Bay Steeds and chariot, sit on the sacred grass, and drink pressed Soma
    mixed with milk or barley. The singers and Kusikas offer hymns, cakes, libations,
    and oblations, asking for aid, blessing, wealth, rulership, and inspired status.
    Indra is praised as Vritra-slayer, battle-helper, winner of spoil, releaser of
    cow-stalls, driver-forth of kine and floods, wielder of the thunderbolt, and maker
    of Ushas and Surya shine. A note states that Soma was brought from heaven by a
    falcon and cites other Rigvedic passages.
  language: English
  quote_policy: summarized
