candidate_motifs:
- id: motif:1
  label: Deity summoned to sacrificial seat to drink Soma
  taxonomy_refs:
  - sacrifice
  basis: The passage repeatedly prepares grass, stones, prayers, cakes, libations,
    and pressed Soma while inviting Indra to sit and drink.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:6
  confidence: high
  cautions: This is a ritual pattern within multiple adjacent Indra hymns rather than
    a single narrative episode.
- id: motif:2
  label: Sacred exchange of hymns and offerings for divine aid, wealth, and authority
  taxonomy_refs:
  - sacred_exchange
  - royal_legitimacy
  basis: The singers offer hymns, Soma, and oblation and ask Indra for blessing, aid,
    lasting wealth, guardianship, rulership, and Rishi status.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:7
  confidence: medium
  cautions: The royal-legitimacy aspect is limited to a request for rulership and
    guardianship, not a described coronation or formal enthronement.
- id: motif:3
  label: Storm-warrior defeats obstruction and releases waters or cattle
  taxonomy_refs:
  - chaos
  basis: Indra is praised for slaying Vritra or Vritras, bursting the cloud, breaking
    strongholds, driving floods, unbarring cow-stalls, and driving forth kine.
  evidence_refs:
  - ev:8
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage names Vritra but does not describe Vritra as a serpent; the
    available serpent symbol is therefore not applied.
- id: motif:4
  label: Heavenly Soma brought by a falcon
  taxonomy_refs: []
  basis: The hymn says the Falcon brought Soma to Indra, and the note states that
    Soma was brought from heaven by a falcon.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage says 'brought' rather than 'stolen', so no sacred-theft taxonomy
    reference is assigned.
- id: motif:5
  label: Divine drink associated with battle-excitement and release
  taxonomy_refs: []
  basis: The strong pressed Soma is associated with Indra's wild joy, stirring people,
    unbarring cow-stalls, and martial victory.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: This overlaps with the broader Soma-sacrifice motif and is extracted only
    as a candidate functional pattern.
- id: motif:6
  label: Golden heaven-earth pair with sun between
  taxonomy_refs:
  - duality
  basis: Heaven and earth are described as a golden pair yielding nourishment to Indra,
