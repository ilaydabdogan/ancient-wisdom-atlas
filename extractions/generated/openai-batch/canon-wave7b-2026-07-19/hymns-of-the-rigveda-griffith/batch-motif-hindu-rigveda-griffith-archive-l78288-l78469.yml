canonical_text:
  quote: ''
  summary: The passage recounts Indra's defeat of Vritra, who held back the waters,
    followed by divine praise, Soma imagery, and a prayer for riches and a ford through
    troubles. It then presents a Visvedevas hymn with cosmic heat, heaven's milk,
    priests, Nirritis, a youthful ritual figure, birds, Soma measures, a sacrificial
    chariot, Vak/Speech, Indra's steeds, and the opening of an Agni hymn describing
    a youngling born from a mother without an udder and growing strong without milk.
  language: English
  quote_policy: summarized
