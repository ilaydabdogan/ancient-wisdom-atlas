  quote: ''
  summary: The passage invokes Indra with Soma offerings, praise, and sacrificial
    gifts, asking him for wealth, cattle, horses, battle protection, wisdom, and safe
    passage through peril. It presents Indra as a thunder-bearing giver and protector
    who rewards active, liberal worshippers and supports singers. The end begins Hymn
    XXXII, describing the Vasishthas by ritual appearance and stating that they brought
    Indra from afar with Soma, gaining his preference over another Soma-presser.
