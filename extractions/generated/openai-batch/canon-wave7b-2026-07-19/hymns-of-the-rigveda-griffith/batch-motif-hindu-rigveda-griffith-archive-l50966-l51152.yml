  quote: ''
  summary: The passage concludes a hymn asking the Adityas and allied deities for
    long life, kinship, protection, and a guarded home. It then praises Agni as Lord
    of Light, messenger of the gods, immortal priest, recipient and bearer of offerings,
    giver of wealth and security, and helper in conflict against fiends and enemies.
    Human worshippers offer oblation, fuel, Soma, pressed juice, sacrificial gifts,
    and oil, and the hymn links proper service to divine favor, prosperity, protection,
    and bliss.
