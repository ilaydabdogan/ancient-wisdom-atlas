canonical_text:
  quote: ''
  summary: The passage contains a portion of a Soma hymn, Hymn XXVI to Pushan, and
    Hymn XXVIII involving Indra and a Rishi. Soma is invoked as guardian, giver of
    strength, Indra's friend, and source of cattle-wealth and aid. Pushan is praised
    as a chariot-associated god who furthers songs, hears eulogies, moistens crops
    and cattle pasture, shares sacrifice, guards the singer, is linked with goats,
    and increases wealth. Indra is represented as aiding the Soma-pouring worshipper,
    opposing those without milk-oblation, receiving bullock and Soma offerings, claiming
    victory in battle, slaying a powerful enemy on a mountain, and overrunning blamers
    with his car.
  language: English
  quote_policy: summarized
