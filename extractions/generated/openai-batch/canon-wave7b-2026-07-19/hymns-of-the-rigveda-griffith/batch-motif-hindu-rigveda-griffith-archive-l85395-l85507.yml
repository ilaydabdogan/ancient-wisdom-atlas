- id: obs:3
  text: 'Different observed behaviors of fire are associated with different deity-forms:
    burning forward with Vayu, burning as two with Indra and Vayu, leaping with Mitra
    and Varuna, dread of contact with Varuna, friendliness with Mitra, kindling from
    two fire sticks with the Acvins, loud thundering with Indra, being carried to
    many places with the All-gods, and roaring speech with Sarasvati.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the Vaishvadeva litany, an offering verse to the All-gods is used, addressing
