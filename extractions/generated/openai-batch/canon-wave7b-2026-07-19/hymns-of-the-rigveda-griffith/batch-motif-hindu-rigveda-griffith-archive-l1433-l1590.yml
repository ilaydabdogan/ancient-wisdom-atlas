canonical_text:
  quote: ''
  summary: The passage contains closing material from an Agni-related invocation,
    Hymn XVI to Indra, Hymn XVII to Indra-Varuna, and the beginning of Hymn XVIII
    to Brahmanaspati. It invokes gods to accept sacrifice and drink Soma, asks Indra
    for strength and livestock wealth, asks Indra-Varuna for help, victory, and protection,
    and praises Brahmanaspati as a healer, protector, wisdom-giver, and promoter of
    successful oblation.
