canonical_text:
  quote: ''
  summary: The passage contains invocations to paired deities and other gods. The
    Asvins are approached through many paired similes and asked to protect, guide,
    strengthen, and accept hymns. Soma and Pishan are described as parents, protectors,
    darkness-dispellers, and riders of a region-measuring chariot, with petitions
    for riches, thought, and aid from Aditi. Vayu and Indra are invited to come by
    chariot and drink Soma juice mixed with milk. Notes explain Soma, Pishan, Vayu,
    the Chakwa bird pair, and a tree-of-treasure simile.
  language: English
  quote_policy: summarized
