canonical_text:
  quote: ''
  summary: A petitionary Vedic hymn asks the gods for auspicious favor, bounty, friendship,
    protection, prosperity, healing medicine, good senses, bodily firmness, and the
    completion of a full human lifespan. It invokes many named deities, Earth as Mother,
    Heaven as Father, Soma-pressing stones, the Maruts, and Agni as the medium of
    offerings. Notes identify some deities and compare the ideal of a hundred-year
    life with Isaiah.
  language: English
  quote_policy: summarized
