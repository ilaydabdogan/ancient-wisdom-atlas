canonical_text:
  quote: ''
  summary: The passage praises Agni as household fire, treasure-lord, priest, envoy,
    and giver of food and riches. It refers to Matarisvan bringing or stirring Agni,
    offerings to Heaven, Agni’s relation to worshippers, rivers and heavenly waters,
    cattle and nectar, the gods’ search for Agni’s highest home, ritual service by
    holy beings, the discovery of mystic things and preservation of Amrit, Sarama
    finding the cattle’s prison, and Aditi with her sons standing in power on a path
    associated with immortal life. The passage includes translator notes marking several
    identities and meanings as uncertain.
  language: English
  quote_policy: summarized
