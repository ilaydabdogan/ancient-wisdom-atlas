candidate_motifs:
- id: motif:1
  label: Bringing or diffusion of Agni to human households
  taxonomy_refs:
  - culture_hero
  basis: Matarisvan is said to have stirred Agni, the note says he brought Agni to
    Bhrigu, and Agni is bright in every house.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage itself is hymnic and brief; the note supplies the explicit
    statement that Matarisvan brought Agni to Bhrigu.
- id: motif:2
  label: Sacrificial reciprocity with Agni
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Daily flames, worship, viands, holy oil, and offerings are linked to Agni’s
    increase of wealth, sending of food, priestly function, and care from the gods.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:10
  confidence: high
  cautions: The passage presents requests and praise rather than a single narrative
    transaction.
- id: motif:3
  label: Search for hidden or fleeing Agni
  taxonomy_refs:
  - mystical_quest
  - ascent
  basis: The gods do not find Agni until they follow his track to his highest home;
    a mortal band also finds Agni standing in the loftiest station, and the note mentions
    Agni’s flight and pursuit by the gods.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The note gives a philosophical interpretation; the exact narrative details
    of the flight are not fully included in the verse excerpts.
- id: motif:4
  label: Ritual transformation toward immortality
  taxonomy_refs:
  - initiation
  - death_rebirth
  basis: Pure or holy beings serve Agni for three autumn seasons, obtain holy names,
    dignify their bodies, discover mystic things, preserve Amrit, and are linked in
    the note with exchange of perishable for immortal bodies.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:9
  confidence: medium
  cautions: The transformation details are largely clarified in the translator note;
    the verse language is compact and ritual.
- id: motif:5
  label: Discovery of hidden cattle wealth
