canonical_text:
  quote: ''
  summary: A ritual exposition explains how metrical recitations and additions fashion
    the Sodacin from metres, worlds, and Soma pressings. It states that certain recitations
    remove evil and send the sacrificer to heaven. In the Atiratra section, gods take
    refuge in day and Asuras in night; Indra seeks allies for a night attack, the
    metres alone follow him, and rounds of recitation repel the Asuras through the
    parts of the night.
  language: English
  quote_policy: summarized
