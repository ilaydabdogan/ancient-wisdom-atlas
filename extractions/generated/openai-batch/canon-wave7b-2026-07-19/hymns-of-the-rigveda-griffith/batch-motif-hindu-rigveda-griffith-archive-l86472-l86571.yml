canonical_text:
  quote: ''
  summary: 'The passage gives ritual instructions and explanations for recitations
    connected with Agnimaruta and related rites: breath-control and correction in
    recitation, the Maruts and seed, chant structure as womb and generation, Prajapati''s
    offspring encircled by Agni, water and the dragon of the deep, celebration of
    divine wives, Raka, Paviravi/Sarasvati, offerings to Yama and the fathers, and
    Indra''s after-drinking verses.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first verse is to be recited without taking in breath, and the passage
    says that with the breaths the reciter crosses the fires.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the reciter errs, another person should point out the error; the passage
    says that by making this person a bridge, he crosses, and that the reciter should
    not correct himself at the Agnimaruta.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A hymn is recited to the Maruts because the Maruts, by blowing, caused seed
    to move when it was poured.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The basis, called yoni, and the antistrophe are recited in the middle, and
    the passage explains this as placing the womb in the middle.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After two hymns are recited, the organ of propagation is said to be placed
    above two supports for generation.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Prajapati created offspring; the offspring went away and did not return until
    he surrounded them with Agni, after which they came up to Agni.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage links the phrase about finding offspring born by him with the
    name Jatavedas.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The offspring, surrounded by Agni and controlled, scorched and blazed; water
    was sprinkled on them, and brilliance was mysteriously placed in them by means
    of the dragon of the deep.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Agni Garhapatya is identified as the dragon of the deep and is said to place
    brilliance in the offspring; the passage says the offerer is more brilliant than
    one who does not offer.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: The wives of the gods are celebrated after Agni, lord of the house; the wife
    sits behind the Garhapatya.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage says the wives of the gods should be celebrated first and that
    Agni Garhapatya places seed in the wives for propagation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Raka is celebrated and is said to sew a suture in the male organ; male sons
    are born for one who knows this.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Paviravi is identified with speech and Sarasvati, and the passage says that
    speech is placed in speech.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: The verse to Yama is to be recited first because the first drink is the king's;
    verses for sages and then for the fathers follow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The passage mentions lower, higher, and midmost fathers and says that all
    are delighted without omission.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: The fathers are associated with sitting on the strew, called their dear abode,
    and homage to the fathers is paid at the end.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:17
  text: The sacrifice to the fathers is said to be incomplete unless recited separating
    the verses with the call.
  category: action
  evidence_refs:
  - ev:6
- id: obs:18
  text: Verses to Indra are recited for Indra's drinking after; by these, Indra drank
