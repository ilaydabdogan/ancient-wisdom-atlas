canonical_text:
  quote: ''
  summary: The passage contains prayers to Varuna, Mitra, Aryaman, Surya, Agni, Heaven
    and Earth, Vayu, and Savitar. The speakers describe offerings, hymns, sacrifices,
    and presents, and ask for mercy, safety over peril, freedom, room, long life,
    prosperity, rain, food, and blessings. Surya rises, spreads light, sees creatures,
    rolls away darkness, travels with horses, wheel, and car imagery, and moves on
    a prepared heavenly pathway. Varuna and Mitra are described as watchers, rulers,
    guardians of order, and knowers of hidden things.
  language: English
  quote_policy: summarized
