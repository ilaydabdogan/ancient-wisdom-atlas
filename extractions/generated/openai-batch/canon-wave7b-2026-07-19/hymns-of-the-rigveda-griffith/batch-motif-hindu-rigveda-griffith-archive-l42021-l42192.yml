canonical_text:
  quote: ''
  summary: The passage opens Book Seven with a hymn to Agni, describing humans generating
    him from fire-sticks, installing and honoring him in the dwelling, asking him
    for wealth, offspring, protection from demons, magic, hunger, sickness, and enemies,
    and requesting that he carry oblations to the gods. It then begins an Apris hymn
    in which Agni accepts fuel and smoke rises toward the celestial region; Narasansa
    and other divine recipients are honored, Agni is identified as one whom Manu kindled
    and as an envoy between worlds, and sacred grass and oblations are prepared by
    ritual officiants.
  language: English
  quote_policy: summarized
