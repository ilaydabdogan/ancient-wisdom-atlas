  quote: ''
  summary: A ritual and phonetic prose passage prescribes recitations for desired
    goods, gives replies to rebuke that invoke offended earth, heaven, and sky deities,
    describes imprecations involving breath as a beam, prohibits inauspicious speech
    toward a Brahmin, and teaches that knowledge of the union between syllable halves
    brings children, cattle, fame, glory, heaven, and a full lifespan.
  language: English
