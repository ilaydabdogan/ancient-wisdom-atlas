  summary: The passage contains invocations to many Vedic deities and divine groups.
    It praises gods as generators of prayer, animals, plants, trees, earth, waters,
    hills, heaven, and light; recounts the Sun mounting to heaven and the Asvins rescuing
    or restoring named figures; asks gods and cosmic beings to hear hymns, protect
    dwellings, grant refuge, preserve worshippers, and support sacrifice; and briefly
    refers to waters poured out when Vritra died and to a seven-headed holy hymn sprung
    from eternal Law.
