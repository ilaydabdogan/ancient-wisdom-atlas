canonical_text:
  quote: ''
  summary: The passage gives ritual instructions for recitations involving Surya,
    Brhati, Pragatha verses, Mitra and Varuna, sky and earth, and concluding verses
    to Brahmanaspati or Brhaspati. It explains how correct recitation avoids passing
    over Surya and Brhati, establishes the ritual subject in day and night and in
    sky and earth, neutralizes Nirrti's nooses against the Hotr, and obtains life,
    offspring, cattle, wealth, heroes, brilliance, and splendour.
  language: English
  quote_policy: summarized
