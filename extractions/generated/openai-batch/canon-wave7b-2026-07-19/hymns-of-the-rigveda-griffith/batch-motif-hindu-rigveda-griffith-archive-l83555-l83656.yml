canonical_text:
  quote: ''
  summary: A ritual exposition describes recitations, covering of oblation holders,
    repetition of verses, and the bringing forward of Agni and Soma. It explains why
    verses are addressed to Savitr, Brahmanaspati, Agni, Soma, Visnu, and Varuna,
    and recounts that Asuras and Raksases sought to slay Soma as he was brought forward,
    while Agni led him past by cunning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The officiant is instructed to recite while looking at the fronton, which
    is described as having all forms and as appearing white and black.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that every form is won for the reciter and the sacrificer
    when the verse is recited with knowledge while looking at the fronton.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The rite includes covering the oblation holders by a Yajus, with the explanation
    that the two are covered and that the wives of the Hotr and sacrificer are not
    likely to become naked when the conclusion is made at that time.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first and last verses are each recited three times; together they make
    twelve, which the passage links to the twelve months of the year and to Prajapati
    as the year.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The repeated first and last recitations are said to tie the two ends of the
    sacrifice for firmness, might, and prevention of slipping.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: When Agni and Soma are being brought forward, the Adhvaryu orders a recitation;
    a verse to Savitr is explained by saying that Savitr is lord of instigation and
    instigates their bringing forward.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A verse to Brahmanaspati is explained by identifying Brhaspati with holy power
    and by saying that holy power is made their harbinger.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Soma the king is brought forward while a triplet to Agni is recited.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Asuras and Raksases sought to slay Soma the king as he was being brought forward
    between the Sadas and the oblation holders.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Agni led Soma past by cunning, and Agni is therefore carried in front.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Two entities coming together are described as liable to injure the sacrificer;
