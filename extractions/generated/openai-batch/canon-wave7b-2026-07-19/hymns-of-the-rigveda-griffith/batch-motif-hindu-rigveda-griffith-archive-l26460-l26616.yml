  summary: The passage contains Vedic hymnic material invoking Dawn, the Asvins, Agni,
    and Indra. It describes Dawn arriving in a bright car, Asvins being summoned to
    Soma at sacrifice, Agni as a ritual herald and offering-bearer, patronal gifts
    of horses, and Indra's deeds of revealing light, releasing waters, smiting Vritra,
    cleaving mountain or rock, and opening cattle enclosures with Sarama and the Angirases.
