  quote: ''
  summary: Griffith's English translation of Rigveda Book II, Hymn I praises Agni
    as generated from waters, stone, trees, herbs, and plants; as holding priestly
    offices; as identified with many deities and ritual personifications; as protector,
    wealth-giver, kin, and friend of worshippers; and as the divine mouth or tongue
    through whom the gods consume offerings.
  language: English
  quote_policy: summarized
