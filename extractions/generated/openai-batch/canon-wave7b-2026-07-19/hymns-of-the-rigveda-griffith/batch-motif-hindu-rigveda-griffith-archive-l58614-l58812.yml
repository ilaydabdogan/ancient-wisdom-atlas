    Indra through songs, prayers, Soma, libations, and offerings; asks him for wealth,
    horses, cattle, progeny, food, battle-aid, and protection; recalls Vishnu’s three
    strides under Mitra’s statutes; calls on other deities and cosmic powers to listen;
