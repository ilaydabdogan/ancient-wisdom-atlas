canonical_text:
  quote: ''
  summary: 'The passage explains ritual meanings and effects of the vasat/vagat call:
    different forms of the call are identified with a thunderbolt, a sustaining form,
    and an empty harmful form; pronunciation and accompanying formulas affect the
    sacrificer, rivals, offspring, cattle, and life-breath. It also gives an etiological
    account in which the sacrifice goes away from the gods, is sought, found on the
    altar, drawn off with cups, and made known by Nivids. The Nivids are then described
    as embryos of the litanies placed differently at the three pressings.'
  language: English
  quote_policy: summarized
