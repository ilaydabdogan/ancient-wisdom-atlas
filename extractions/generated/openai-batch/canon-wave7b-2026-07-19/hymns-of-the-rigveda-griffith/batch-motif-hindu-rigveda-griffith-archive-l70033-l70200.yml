  - ev:3
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage is a hymn of petition rather than a narrative of a completed
    exchange.
- id: motif:2
  label: sacrifice ascending to heaven
  taxonomy_refs:
  - ascent
