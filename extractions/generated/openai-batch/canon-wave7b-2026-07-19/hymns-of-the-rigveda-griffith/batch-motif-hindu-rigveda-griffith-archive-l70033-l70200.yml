  quote_or_summary: Ringing press-stones are asked to keep Rakshasas, bad dreams,
    Nirriti, and fiends far away; libations flow and Indra sits on grass; Brihaspati
    is praised with Saman hymns; the Asvins are asked to make the sacrifice ascend
    to heaven; Maruts are called as swift-hearing purifying friends; Soma is called
    the Stay of Life and linked with swelling waters and bright rays.
