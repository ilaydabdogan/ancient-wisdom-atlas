canonical_text:
  quote: ''
  summary: The passage contains prayers to Agni and many other deities for felicity,
    protection, prosperity, cattle, sons, long life, and ritual success. It invokes
    Dawn and Night, Heaven and Earth, Waters, Mountains, Maruts, Adityas, Asvins,
    Soma, Savitar, Mitra, Varuna, and Surya. Ritual elements include kindled fires,
    libations, strewn grass, pressing-stones, hymns, holy oil, and sacrifice ascending
    to heaven. The passage also asks that hostile beings, distress, sin, and destruction
    be kept away. Surya is praised as Varuna’s and Mitra’s Eye, the far-seeing divine
    ensign, who rises with steeds while waters flow.
  language: English
  quote_policy: summarized
