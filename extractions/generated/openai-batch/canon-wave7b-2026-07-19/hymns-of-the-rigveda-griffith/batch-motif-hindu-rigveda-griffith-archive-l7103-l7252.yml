  summary: The passage combines commentary on priests and sacrifice with hymnic material
    addressed to the Maruts. The Maruts are identified as Rudra's sons and storm-gods,
    depicted as armed, ornamented, rain-bringing warriors who receive Soma and ritual
    food. The passage also recounts Tvashtar making Indra's thunderbolt, Indra slaying
    Vritra and releasing waters, the Maruts splitting clouds and aiding Gotama, and
    prayers for protection, wealth, light, and the removal of demons and darkness.
