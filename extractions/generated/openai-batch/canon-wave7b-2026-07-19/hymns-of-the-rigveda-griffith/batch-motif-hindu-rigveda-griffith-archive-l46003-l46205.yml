canonical_text:
  quote: ''
  summary: The passage contains the end of a hymn to Varuna and Mitra, Hymn LXV to
    Mitra-Varuna, and Hymn LXVI to Mitra-Varuna. The speakers invoke Mitra, Varuna,
    and related deities for guidance, protection, fruitful lands, celestial water,
    safe passage over distress, preservation, wealth, food, heaven's light, and the
    acceptance of Soma and sacrificial gifts. The hymns describe Mitra and Varuna
    as holy, wise, ruling, law-strengthening deities who restrain sinners with bonds
    or nooses. Later stanzas describe cosmic order, the establishing of time divisions,
    and the rising Sun or Surya borne on a car by celestial beings.
  language: English
  quote_policy: summarized
