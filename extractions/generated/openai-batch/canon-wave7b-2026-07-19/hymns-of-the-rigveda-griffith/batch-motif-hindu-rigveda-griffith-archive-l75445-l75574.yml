canonical_text:
  quote: ''
  summary: The passage describes the gods setting Surya in heaven, the arising of
    a wandering Pair, and Agni Vaisvanara as a light-bearing, ageless, cosmic fire.
    It asks about two paths of Fathers, gods, and mortals, identifies ritual roles
    around sacrifice, and then begins a hymn to Indra as a heroic upholder who separates
    earth and sky, directs or is identified with Surya, destroys darkness with light,
    receives flowing songs, and requires genuine Soma.
  language: English
