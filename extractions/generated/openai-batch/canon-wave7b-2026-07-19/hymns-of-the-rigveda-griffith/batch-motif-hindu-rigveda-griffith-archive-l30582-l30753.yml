canonical_text:
  quote: ''
  summary: The passage contains the end of an Agni hymn and Hymns VIII-X to Agni.
    Agni is described as a household master, guest, priest, bearer of oblations, messenger,
    divine fire, newborn from kindling-sticks, recipient of oil, fuel, songs, and
    offerings, and giver of wealth, food, protection, victory, and strength.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Agni is described as sought by many mortals, the stay of all, giver of flavor
    to food, and the home of every living man.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Agni's action is compared to a herd cropping grass; he shears the field and
    wilderness and is described with flashing teeth and a golden beard.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Mother is said to have borne or produced Agni at the proper time; the translator's
    note identifies this Mother as the lower fire-stick producing the spark.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:14
- id: obs:4
  text: Oil is shed to Agni, and Agni is asked to bestow fame, splendour, and intelligence
    on mortals.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Agni is invoked so that Atri may overcome Dasyus and men who give neither
    gifts nor food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Men of old who loved the Law enkindled Agni, called the Ancient, for aid.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Agni is established by men as an old guest and master of the household, with
    hair of flame, and is also called distributor of wealth and drier of floods.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The tribes of men praise Agni; he is described as dwelling in secret, visible
    to all, loud-roaring, skilled in worship, and glorified with oil.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Worshippers draw near to Agni with songs, reverence, and hymns; Agni gives
    subsistence in every house and rules over food of many sorts.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The gods made the inflamed Agni the bearer of oblations, the messenger, and
    the eye that stirs thought.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Men seeking joy lit and worshipped Agni with good fuel and sacred oil; anointed
    and strengthened by plants, he spreads over the realms of earth.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: Mortal men worship Agni while bearing oblations; in the home of the gift-offerer,
    Agni is priest, and sacrifices and strengthenings come to him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The kindling-sticks are said to bring Agni to life as an infant newly born;
    he is also called sustainer of the tribes of men and skilled in sacrifice.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Agni is said to be hard to grasp like offspring of wriggling snakes, and he
    consumes many woods like an ox in a meadow.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:15
  text: Trita, in the height of heaven, is compared to a smelter who fans or sharpens
    Agni.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: The hymn asks for Agni's succour and Mitra's friendly furtherance so that
    worshippers may avert hate, subdue wickedness, gain riches, and receive aid in
    battle.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:17
  text: Agni is asked to bring splendour, overflowing wealth, a path to strength,
