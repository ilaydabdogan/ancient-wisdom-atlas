canonical_text:
  quote: ''
  summary: A Rigveda Book IX passage praises Soma Pavamana as mountain-born plant
    and sacred juice, pressed by men, washed in waters, sweetened with milk, filtered
    through fleece and a cleansing sieve, and poured into vats, cups, and jars for
    Indra and other gods. Soma is described with bird, horse, warrior, and chariot
    imagery, as bringing wealth, cattle, steeds, strength, renown, nourishment, and
    holy lore. The passage also credits Soma with cosmic actions involving waters,
    rivers, rain-like streams, Surya’s light, and the Sun’s courser Etasa.
  language: English
  quote_policy: summarized
