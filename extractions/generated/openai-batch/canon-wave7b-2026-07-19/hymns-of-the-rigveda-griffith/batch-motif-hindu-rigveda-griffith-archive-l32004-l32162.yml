  summary: The passage includes Rigvedic hymnic verses and notes centered on Indra.
    Indra is invoked by Soma-pressing worshippers, cleaves a well or rain-cloud, frees
    obstructed waters, opens a mountain or cloud, and slays a Danava/Dragon described
    in dark, misty, serpent-like terms and named Sushna. The passage also presents
    Heaven and Earth yielding before Indra, human singers and Brahmans relying on
    him, and Indra as a chariot-riding battle helper with bay coursers.
