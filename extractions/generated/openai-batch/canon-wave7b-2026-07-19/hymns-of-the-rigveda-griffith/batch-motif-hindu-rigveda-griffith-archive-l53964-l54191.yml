canonical_text:
  quote: ''
  summary: Portions of Rigveda Hymn 45 and the opening of Hymn 46 invoke Indra as
    friend, protector, wealth-giver, Soma-drinker, Vritra-slayer, and warrior. The
    speakers offer praise, Soma, and libations while requesting cattle, hidden wealth,
    protection from enemies, forgiveness for trespasses, and Indra's presence with
    his bay or tawny steeds. The passage recalls Indra's battle deeds, his cleaving
    of a hill so cows might issue forth, and victory through sacrifice.
  language: English
  quote_policy: summarized
