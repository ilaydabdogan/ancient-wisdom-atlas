canonical_text:
  quote: ''
  summary: A sequence of Rigvedic hymnic passages praises Agni as radiant, protective,
    wisdom-giving, and responsive to offerings. Worshippers ask Agni to remove hatred,
    sin, prison, and affliction, and to grant wealth, offspring, and long life. The
    passage also invokes the Asvins/Nasatyas, Savitar, Surya, Varuna, Mitra, Aditi,
    radiant Mornings, Dawns, and images of the Sun rising, ascending, being carried
    by seven coursers, dispelling darkness, and guarding heaven like a pillar.
  language: English
  quote_policy: summarized
