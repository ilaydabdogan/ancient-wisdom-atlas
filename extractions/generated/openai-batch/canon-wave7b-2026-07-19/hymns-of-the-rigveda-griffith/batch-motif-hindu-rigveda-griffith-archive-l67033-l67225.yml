canonical_text:
  quote: ''
  summary: 'The passage contains parts of Rigveda Book X hymns in Griffith’s English
    translation: an Agni hymn using bull, calf, sky, waters, sacrifice, and oblation
    imagery; a Trita/Indra combat episode in which a seven-rayed, three-headed foe
    associated with the Son of Tvashtar is slain and cattle are freed; a Waters hymn
    invoking waters as beneficent, healing, strengthening, purifying goddesses; and
    the opening of a Yama-Yami dialogue, with notes identifying them as twin children
    of Vivasvin and the first human pair.'
