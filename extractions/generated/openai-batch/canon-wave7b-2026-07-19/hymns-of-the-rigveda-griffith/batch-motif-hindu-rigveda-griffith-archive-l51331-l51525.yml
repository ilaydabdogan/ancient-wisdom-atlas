canonical_text:
  quote: ''
  summary: The passage contains the end of a hymn to the Maruts, a hymn to Indra,
    and the beginning of a hymn to the Asvins. The Maruts are praised with rain, animal,
    dance, and battle imagery and are asked for friendship, medicine, protection,
    and healing. Indra is invoked for sacrifice, Soma drinking, wealth, friendship,
    and victory over enemies. Sarasvati and Chitra are named as bestowers of wealth,
    and Chitra’s gifts are likened to Parjanya’s rain. The Asvins’ wondrous car is
    called for succour.
  language: English
  quote_policy: summarized
