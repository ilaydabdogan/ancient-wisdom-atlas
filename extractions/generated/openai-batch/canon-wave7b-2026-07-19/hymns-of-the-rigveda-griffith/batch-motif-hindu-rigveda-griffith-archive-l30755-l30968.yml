canonical_text:
  quote: ''
  summary: The line range begins with a residual note from the preceding context,
    then contains several Rigvedic hymns addressed mainly to Agni. Agni is praised
    as guardian, priest, envoy, immortal bearer of oblations, knower or supporter
    of sacred Law, flame born and kindled with oil, discovered when hidden, generated
    by attrition, and victorious over Dasyus and darkness. The hymns also describe
    human worshippers, the Angirases, Indra and the Gods, the two Mothers or fire-sticks,
    Vivasvin, sacrificial gifts, praise songs, streams, smoke, and cosmic goods such
    as Kine, Floods, and Sun.
  language: English
  quote_policy: summarized
