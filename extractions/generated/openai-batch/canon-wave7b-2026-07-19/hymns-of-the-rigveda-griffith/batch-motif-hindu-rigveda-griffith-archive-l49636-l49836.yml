canonical_text:
  quote: ''
  summary: A hymn invokes the Maruts as bright, roaring, rain-bearing powers who move
    through mountain-clouds, bend mountains and rivers, receive hymns and offerings,
    aid worshippers and allied figures, help in battles against Vritra, and appear
    with chariots, lightning, golden helms, steeds, and rain. The passage then begins
    a hymn to the Asvins, asking them to come on a golden car and drink meath mixed
    with Soma.
  language: English
  quote_policy: summarized
