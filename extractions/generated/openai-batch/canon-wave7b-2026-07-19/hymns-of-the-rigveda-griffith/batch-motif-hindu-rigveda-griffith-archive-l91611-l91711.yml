canonical_text:
  quote: ''
  summary: The passage explains ritual recitation of the Evayamarut hymn as support
    and nourishment, links the Maruts with waters, discusses whether accompanying
    hymns should be recited together, narrates a dispute over the hymn's placement
    in the Visvajit rite, and describes the sacrificer as ritually prepared like an
    embryo whose members develop in sequence. It ends with an incomplete notice that,
    after the metres are obtained, their sap pours over and Prajapati becomes afraid.
  language: English
  quote_policy: summarized
