canonical_text:
  quote: ''
  summary: The passage explains sixth-day ritual recitations and tells how Nabhanedistha
    Manava, deprived of a share by his brothers, learned from his father how to help
    the Angirases complete a sacrificial session for the world of heaven. In exchange
    for revealing the sixth day through two hymns, he receives a thousand-gift, then
    resolves a dispute with a black-garmented claimant by truthful speech. The passage
    also explains companion hymns as ritual accompaniments linked with seed, breaths,
    body, support, womb, embryo, motion, and continuity.
  language: English
  quote_policy: summarized
