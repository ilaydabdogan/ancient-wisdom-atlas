canonical_text:
  quote: "“The cups for two deities are the breaths”"
  summary: A ritual exposition identifies paired deity-cups with the breaths, relates
    vessels and offering procedures to bodily faculties, gives formulas for cups associated
    with Indra-Vayu, Mitra-Varuna, and the Acvins, and forbids certain calls or approvals
    because they would disrupt or pierce the sacrificer’s breaths.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The cups for two deities are identified with the breaths; being drawn in one
    vessel explains one name, and being offered in two vessels explains pairing.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Adhvaryu offers with the Yajus, and the Hotr accepts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The cup for Indra and Vayu is accompanied by formulas about wealth, protection
    of speech, speech together with breath, and divine seers as guardians of the body
    born of fervour.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The cup for Mitra and Varuna is accompanied by formulas about wealth, guardianship
    of the eye, and the eye together with mind.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The cup for the Acvins is accompanied by formulas about wealth, guarding the
    ear, and the ear together with the self.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The divine seers, guardians of the body, born of fervour, are identified as
    the breaths and are invoked.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: Taking the Indra-Vayu cup front to front is connected with expiration and
    inspiration being in front; taking the Mitra-Varuna cup front to front is connected
    with the eyes being in front.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Acvins’ cup is carried all round, which is connected with humans and beasts
    hearing speech spoken on all sides.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The offering verses for cups for two deities should be said without taking
    in breath, for continuity of breath and to avoid splitting the breaths.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The second vagat call is forbidden for cups for two deities because it would
    bring the unresting breaths to rest and breath would forsake the person.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Hotr should not express approval between the two offering verses because
    the approval is described as a thunderbolt that would pierce the sacrificer’s
    breaths.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Maitravaruna is called the mind of the sacrifice, and the Hotr is called
    the voice of the sacrifice; speech is said to speak when impelled by mind.
  category: relationship
  evidence_refs:
  - ev:6
