canonical_text:
  quote: ''
  summary: The passage contains Griffith’s translation and notes for Rigvedic hymns
    to the Maruts. The Maruts are praised as a youthful, armed, radiant divine cohort,
    children or sons of Rudra and Prisni, dwelling on lofty mountains, riding horses
    and cars, receiving kindled fire and sacrifice, granting cattle, horses, heroes,
    rulers, rain, prosperity, and heavenly treasure. Their stormy movement disturbs
    waters, shatters woods, shakes Earth, brings thunder through Dyaus, and causes
    mountain waters and rain to descend. One stanza presents them as husbands who
    impregnate Earth.
  language: English
  quote_policy: summarized
