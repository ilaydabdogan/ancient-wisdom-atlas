  summary: The passage gives ritual explanations and prescriptions for inserting Nivids
    during Soma pressings, relating them to ornament, warp, the course of the sun,
    the gathered sacrifice, the origin and gift of the horse, correct recitation,
    fertility, expiation, and the ordering of metres through syllabic calls and responses.
