canonical_text:
  quote: ''
  summary: The passage praises Indra as a mighty, wise, invoked lord and hero. Ancient
    sages and present singers extol him, offer hymns, Soma, sacrificial cake, and
    milk, and ask him for wealth, cattle, heroes, protection, and guidance. Indra
    is depicted as riding with Bay Steeds, carrying thunder or a bolt, drinking Soma,
    helping at Vritra’s slaughter, overcoming Dasyus and other enemies, destroying
    enchantments, and granting aid. A later stanza says men draw waters from Indra
    by song and sacrifice as from a mountain ridge.
  language: English
  quote_policy: summarized
