  quote: ''
  summary: The passage presents Soma/Pavamana/Indu as a pressed and purified divine
    drink or deity. Soma is poured through fleece and sieve, mixed with milk and curds,
    directed to Indra and Vayu, and brought to the lake or sacrificial place. The
    hymns ask Soma to grant wealth, cattle, horses, gold, sons, renown, protection,
    and victory over foes and Rakshasas. Soma is also described through solar imagery
    and animal imagery, especially as a steer, horse, and courser, while singers,
    priests, and sages adorn him with hymns.
