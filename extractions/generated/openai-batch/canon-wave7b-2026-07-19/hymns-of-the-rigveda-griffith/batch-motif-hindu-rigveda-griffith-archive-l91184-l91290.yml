canonical_text:
  quote: ''
  summary: The passage gives ritual instructions and explanations for daily hymn recitations
    by several priests. It says certain hymns are heavenly and enable gods, seers,
    and sacrificers to conquer or reach the world of heaven, while also winning cattle,
    food, seasons, breaths, prosperity, Prajapati, and Indra’s protection. It compares
    performers of a year or twelve-day rite to men crossing an ocean in a well-equipped
    ship, with the Tristubh metre functioning as what they mount to reach heaven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Maitravaruna recites a hymn day by day before the hymns; the hymn is called
    heavenly, and gods, seers, and sacrificers are said to conquer the world of heaven
    by it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first hymn discussed is attributed to Visvamitra, contains the words “bull”
    and “cattle,” is said to win cattle, has five verses, and is linked with Pankti
    and food.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Brahmanacchansin recites a praise hymn day by day; it is called heavenly,
    attributed to Vasistha, and associated with going to Indra’s dear abode, conquering
    the highest world, and winning the seasons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Achavaka recites a hymn beginning with a carpenter simile; the passage
    links coming days with the world of heaven and identifies departed seers as sages.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: One hymn has no deity named and is connected with Prajapati; one mention of
    Indra preserves an Indra form; its ten verses are linked with Viraj, food, ten
    breaths, and placing breaths in the body.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Pragathas containing the word “who” are recited at the beginning; Prajapati
    is identified as Who, “who” is linked with food, and appeased hymns bring prosperity
    and carry participants toward the world of heaven.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage warns against treating certain Tristubh hymn beginnings as inserted
    verses, because the Hotr is identified with lordly power and the Hotracansins
    with the people.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Those performing the year or twelve-day rite are compared to men setting sail
    on an ocean and boarding a well-equipped ship to reach the other shore; they are
    said to mount the Tristubhs, and the metre carries them to the world of heaven.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Reciting the verses is said to mount the hymns with recognized beginnings,
    summon Indra like a bull to a cow, and maintain continuity of the Ahina.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Indra is asked to drive away enemies in front, behind, to the north, below,
    and to the south, so that the speakers may delight in his wide protection.
  category: speech
  evidence_refs:
  - ev:8
