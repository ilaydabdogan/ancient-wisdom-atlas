canonical_text:
  quote: ''
  summary: The passage describes the great anointing of Indra. The gods, with Prajapati,
    decide to anoint Indra because of his supreme might. A throne is assembled from
    named liturgical elements and supported by deities. Indra mounts it while groups
    of gods, metres, Stomas, and Samans are invoked for successive forms of rule.
    The All-gods proclaim him with royal and martial titles. Prajapati then anoints
    him with ritual implements, waters, formulas, and exclamations. The passage continues
    with divine groups in different quarters anointing him for different royal statuses,
    and connects these divine acts to regional royal titles and anointings.
  language: English
  quote_policy: summarized
literal_observations:
