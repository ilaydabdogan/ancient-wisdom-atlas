canonical_text:
  quote: ''
  summary: The passage closes an offering to Indra-Agni requesting renown, wealth,
    and food, then presents a hymn to Vishnu and the Maruts. The hymn sends songs
    to Vishnu, describes the Maruts as strong, shining, roaring, lightning-bearing,
    mountain-like, and protectively allied with Vishnu, and asks them to come to the
    sacrifice, hear the worshipper, avert enmity and demons, and oppose the sacrificer's
    hater. Notes discuss the offering, the term Evayamarut, and interpretive difficulties.
  language: English
