canonical_text:
  quote: ''
  summary: The passage includes hymns to Yama, the Kesins, the Visvedevas, and the
    opening of a hymn to Indra. It describes Yama among the Gods and ancient Sires
    in a leafy tree and the Home of Gods; an obscure funeral setting involving a child,
    a car, a ship, flame, and passage; long-haired Munis who move with the wind and
    associate with divine beings; divine healing by Gods, Wind, Waters, balms, and
    touch; and Indra with priests defeating Vritra and dragons while releasing Dawns
    and waters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yama drinks with the Gods in a tree clothed with good leaves, and as Father
    and Master of the house tends the ancient Sires.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A speaker looks reluctantly on one who cherishes men of old and treads an
    evil path, then yearns for this again; the note identifies the speaker as the
    spirit of a dead child yearning to return to life.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Child mounts a new, wheel-less, one-poled car fashioned mentally; the
    car is made to roll from the Sages, followed by the Saman, and is laid together
    on a ship.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the funereal gift is placed, a point of flame appears, a depth extends
    in front, and a passage out is made behind.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Yama has a seat called the Home of Gods, where minstrels blow the flute and
    he is glorified with songs.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The notes state that the hymn appears to concern the funeral ceremony of a
    boy and cite a legend in which Nachiketas is sent to Yama’s kingdom, treated kindly,
    and allowed to return to this world.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: The long-haired one supports Agni, moisture, heaven, and earth; Munis are
    wind-girdled, wear yellow-soiled garments, and follow the wind’s swift course
    where the Gods have gone.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Munis say they have pressed on into the winds through Munihood, and the
    Muni flies through the region of the air while looking on varied forms.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Muni is called the Steed of Vata and Vayu’s friend, has a home in the
    eastern and western seas, and treads paths associated with sylvan beasts, Gandharvas,
    and Apsarases.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Vayu churns and pounds hard things for the long-haired one, who drinks water
    from a cup with Rudra.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Gods are asked to raise up and restore to life a man who has been humbled,
    brought low, and committed sin; winds are asked to give energy and blow disease
    away.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: A speaker comes with balms and blessed strength, drives malady away, and asks
    the Gods, Maruts, and all things to deliver the man from disease.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Waters are said to have healing power, to drive disease away, and to have
