canonical_text:
  quote: ''
  summary: 'The passage gives ritual instructions for a Ksatriya consecrand: he asks
    Savitr for a sacrificial place, offers butter libations in the Ahavaniya to prevent
    decay of sacrifice and gifts, invokes Indra and Agni in relation to holy and lordly
    power, and undergoes a consecratory shift between Ksatriya, Brahmanhood, kingship,
    and priestly power. It describes protective formulas, ritual rebirth from sacrifice,
    and the safeguarding of power, strength, life, kingdom, glory, fame, and relationship.'
  language: English
  quote_policy: summarized
