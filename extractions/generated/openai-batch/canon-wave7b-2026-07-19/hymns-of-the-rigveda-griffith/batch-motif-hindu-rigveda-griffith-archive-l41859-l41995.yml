  summary: 'The passage contains Griffith''s notes and excerpts from Rigvedic material:
    explanations of arrows, armour, and battle-protection stanzas; a short appendix
    presenting omitted erotic Latin stanzas; and a note on Hymn CLXXIX, where Rati
    or Love is the deified object and Lopamudra addresses her aged husband Agastya.
