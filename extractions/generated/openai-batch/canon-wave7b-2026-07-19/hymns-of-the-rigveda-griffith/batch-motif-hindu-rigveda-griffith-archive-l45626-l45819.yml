canonical_text:
  quote: ''
  summary: The passage contains prayers to the Maruts for aid, forgiveness, battle
    protection, offerings, and Soma; a Tryambaka/Rudra prayer for release from death
    without loss of immortality; and a hymn to Mitra-Varuna in which the Sun rises,
    speaks truth, witnesses mortal deeds, travels with seven coursers, and the Adityas
    guard law, wisdom, safe passage, and Sudas’s lineage.
  language: English
  quote_policy: summarized
