    god, and divine conveyer who brings gods to the oblation. A following hymn describes
    a youthful mother keeping a boy in secret, the child being seen when carried on
    the arm, Agni appearing bright and armed, a hidden king being freed by prayers,
    Sunahsepa being loosed from a stake, and Agni overcoming godless and Rakshas forces.
