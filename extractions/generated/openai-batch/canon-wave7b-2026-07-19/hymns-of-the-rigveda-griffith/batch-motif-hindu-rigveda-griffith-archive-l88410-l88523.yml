canonical_text:
  quote: ''
  summary: A ritual exposition of the Soma Sacrifice explains the third day of the
    Prsthya Sadaha through deities, stoma, saman, metre, recurring words, and other
    textual signs. It narrates that the gods went to heaven on the third day while
    Asuras and Raksases tried to obstruct them; the Vairupa Saman is explained through
    the repeated phrase about becoming misshapen, and horses are connected with a
    transformation and hoof-striking that repels evil. Later sections list chant selections
    and state that ritual knowledge brings prosperity, desire-fulfillment, protection
    from evil, and access to Indra's abode or the highest world.
  language: English
  quote_policy: summarized
