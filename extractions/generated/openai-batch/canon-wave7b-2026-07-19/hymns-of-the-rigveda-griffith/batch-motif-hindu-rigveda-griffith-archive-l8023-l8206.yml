  quote: Night and Dawn...suckle one same Infant
  summary: The passage contains hymnic invocations to Agni and Indra. Agni is described
    as wealth-bestowing fire, an infant nourished by Night and Dawn, a purifier whose
    light chases sin, a protector who carries worshippers over danger like a ship
    or boat, and an all-present Vaisvanara pervading heaven, earth, and plants. Indra
    is invoked as a battle-helper, king of earth and heaven, Vritra-slayer, and companion
    of the Maruts.
