candidate_motifs:
- id: motif:1
  label: speaking plants with healing power
  taxonomy_refs:
  - wisdom
  basis: The Plants hold colloquy and state that they save from death the man under
    a Brahman's cure.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The taxonomy link to wisdom is broad; the passage emphasizes healing speech
    and plant power rather than abstract wisdom.
- id: motif:2
  label: divinely bestowed ritual speech
  taxonomy_refs:
  - wisdom
  basis: Brihaspati is asked to place speech in Devapi's mouth and later grants a
    voice that reaches the gods and wins the waters.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage frames the speech as ritual efficacy; no wider doctrine should
    be inferred beyond the hymn and notes.
- id: motif:3
  label: sacrifice and oblation obtain rain
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Devapi performs Hotar duties and oblations; Agni receives offerings and is
    asked to send or stimulate rain for Santanu.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage presents requests and ritual actions; it should not be expanded
    into a general theory of reciprocity without further context.
- id: motif:4
  label: obstructed celestial waters released
  taxonomy_refs:
  - chaos
  basis: Waters gathered in the highest ocean are obstructed by deities, then set
    free by Arshtishena and Devapi; Indra also makes the Vritra-slaying bolt and sends
    waters.
  evidence_refs:
  - ev:4
  - ev:9
  confidence: medium
  cautions: The obstruction in Devapi's hymn is by deities, while Indra's Vritra episode
    is separate in the following hymn; the combined motif should be reviewed.
- id: motif:5
  label: god or hero defeats demons and wins waters, light, or treasure
  taxonomy_refs:
  - chaos
  basis: Indra quells magic, seeks heaven's light, seizes the hundred-gated castle's
    treasure, slays demons, brings streams, and aids Trita against a monstrous boar/demon.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage does not explicitly call the adversaries cosmic chaos; that
    taxonomy is an interpretive grouping based on the combat and release motifs.
- id: motif:6
  label: priest-brother serving king-brother
  taxonomy_refs:
  - sibling_pair
  - royal_legitimacy
  basis: The commentary says the Sukta represents one Kshatriya brother becoming Purohita
    and Hotri of the other, who is the Raja; later notes identify Santanu as Devapi's
    brother.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: This motif rests on the translator's/commentarial note rather than on
    the hymn verses alone.
comparison_claims:
- id: claim:1
  claim: The commentary links this hymn's portrayal of Devapi as priest for Santanu
    with a later Mahabharata Śalya-parvan story in which Devapi attains Brahman status
    at Prithudaka.
  claim_level: same_function
  target: Mahabharata Śalya-parvan Devapi Brahman-status legend at Prithudaka
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is supplied by the note, not by the hymn text itself;
    the note also reports scholarly interpretation and should be checked against the
    cited Mahabharata passage.
