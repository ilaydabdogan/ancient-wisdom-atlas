  quote: ''
  summary: The passage includes verses on Soma and the Plants as healers; a hymn in
    which Devapi invokes Brihaspati and other gods to obtain speech and rain for Santanu
    through priestly sacrifice; and the opening of a hymn to Indra describing the
    making of the Vritra-slaying bolt, release of waters, battles with demons, seizure
    of treasure, and aid to Trita.
