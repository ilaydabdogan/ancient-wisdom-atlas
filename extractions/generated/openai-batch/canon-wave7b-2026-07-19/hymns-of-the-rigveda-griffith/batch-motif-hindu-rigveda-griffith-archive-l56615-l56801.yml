canonical_text:
  quote: ''
  summary: The passage contains invocations to several Vedic deities. Worshippers
    address Indra, Vishnu, the Asvins, and the Maruts as kin and invoke a shared maternal
    origin. A hymn to Agni praises him as guest, friend, protector, house-lord, and
    giver of wealth. Several hymns to the Asvins invite the twin Nasatyas to drink
    Soma, arrive in their car, grant an inviolable home, heal, save life, give wisdom,
    preserve life by wealth, and strengthen holy Law. The passage also mentions Krishna,
    Visvaka, Vishnapa, Savitar, the Priyamedhas, sacred grass, libations, golden paths,
    and the horn of holy Law.
  language: English
  quote_policy: summarized
