canonical_text:
  quote: ''
  summary: The passage includes editorial discussion of variant traditions around
    Vigvamitra, Devarita, Ajigarta, and the Jahnus; then describes the ritual narration
    of the tale of Gunahgepa after a king’s anointing, with golden seating, prescribed
    responses, removal of sin, gifts, and the obtaining of sons. It then gives a Rajasiya
    account in which Prajaépati creates sacrifice; holy power and lordly power arise;
    social classes are differentiated by relation to oblations; sacrifice departs
    and is recovered by holy power rather than lordly power; lordly power must lay
    aside its weapons and assume the form of holy power to approach sacrifice. A Ksatriya
    seeking consecration is instructed to ask the divine lordly power, identified
    with the sun, for a place of sacrifice.
  language: English
  quote_policy: summarized
