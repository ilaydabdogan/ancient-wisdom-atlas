canonical_text:
  quote: ''
  summary: 'The passage presents divine and royal anointing formulas. Gods anoint
    Indra for kingship and supremacy, and human kings are anointed in accordance with
    divine action. The Mahabhiseka of kings is then described: a Kshatriya is anointed
    with Indra''s great anointing after an oath, using products of named trees, green
    shoots of grains, an Udumbara throne and vessel, and a mixture including curds,
    honey, melted butter, and rain water with sunshine.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Human rulers in named northern and middle regions are said to be anointed
    and styled as sovereign or king in accordance with the action of the gods.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sadhyas and Aptyas anoint the recipient for kingship, and the Maruts and
    Angirases anoint him in the upward quarter for supreme authority, great kingship,
    suzerainty, supremacy, and pre-eminence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Indra, after the great anointment, wins all victories, finds all worlds, gains
    superiority over the gods, obtains many forms of rule, and becomes immortal in
    heaven.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A ritual knower who desires universal victory and rulership for a Kshatriya
    is instructed to anoint him with the great anointing of Indra.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The royal anointing is associated with an adjuration or oath covering the
    period from birth to death and naming sacrifice, gifts, place, good deeds, life,
    and offspring as forfeitable if false dealing occurs.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Four tree products are to be brought together: Nyagrodha, Udumbara, Asvattha,
    and Plaksa, each connected with a form of rulership or authority conferred on
    the recipient.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'Four plant shoots are to be brought together: rice, large rice, panic seed,
    and barley, each connected with lordly power, overlordship, paramount rule, or
    leadership.'
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The preparations include an Udumbara throne, an Udumbara goblet or bowl, and
    an Udumbara branch.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The collected preparations are mixed in the Udumbara bowl or goblet with curds,
    honey, melted butter, and water of the rains with sunshine before the throne is
    addressed.
  category: sequence
  evidence_refs:
  - ev:7
