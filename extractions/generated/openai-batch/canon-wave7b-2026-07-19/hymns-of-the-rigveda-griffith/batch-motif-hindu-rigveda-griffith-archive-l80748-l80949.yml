candidate_motifs:
- id: motif:1
  label: cosmic stabilization and expansion from primordial waters
  taxonomy_refs:
  - chaos
  basis: The passage describes Savitar fixing earth and heaven, bounding or knowing
    the fixed ocean, and the world, region, heaven, and wide earth arising or expanding
    from there.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage does not narrate combat with chaos; the motif assignment rests
    on water-boundary and world-ordering imagery.
- id: motif:2
  label: divine bird connected with Soma transport
  taxonomy_refs: []
  basis: Savitar’s Eagle is first born and law-obeying, and the note identifies it
    with Tarkshya, brother of Garuda, who brought Soma from the Moon at Savitar’s
    command.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: medium
  cautions: The Soma-transport detail is from the editorial note citing Sayana, not
    from the hymn lines alone.
- id: motif:3
  label: sacrificial mediation between humans and gods
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Agni bears oblations, accepts sacrifice and hymn, brings gods, and is invoked
    for favor and wealth; Faith enables oblation and blesses givers and worshippers.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The exchange is liturgical and petitionary; no mythic bargain narrative
    is given.
- id: motif:4
  label: divine warrior protects worshippers and defeats hostile powers
  taxonomy_refs:
  - chaos
  basis: Indra is invoked as foe-destroyer, fiend-slayer, and Vritra-slayer who drives
    away Rakshasas and foes, breaks Vritra’s jaws, wards off weapons, and upholds
    the heavens.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage names Vritra and hostile powers but does not retell a full
    combat myth.
- id: motif:5
  label: power-marked divine birth
  taxonomy_refs:
  - sacred_birth
  basis: The Active Ones come near Indra at his birth and share his heroic might;
    the passage says Indra’s birth is based on strength, victory, and power.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The birth scene is brief and does not include parentage or a full birth
    narrative.
- id: motif:6
  label: afterlife departure to ancestors, heaven, heroes, and ritual recipients
  taxonomy_refs:
  - afterlife_journey_map
  - ascent
  basis: The funeral hymn directs the deceased to depart to groups associated with
    Soma, offerings, heaven-winning Fervour, battle heroism, generosity, Law, the
    Fathers, and Yama.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: Only the opening portion of the funeral hymn is included, so the full
    afterlife geography may be incomplete.
comparison_claims:
- id: claim:1
  claim: The note’s identification of Savitar’s Eagle with Tarkshya, brother of Garuda,
    who brought Soma from the Moon, supports a cautious comparison between the hymn’s
    Eagle and an Indic divine-bird Soma-bringer pattern.
  claim_level: same_function
  target: Tarkshya/Garuda Soma-bringing tradition referenced in the note
  evidence_refs:
  - ev:2
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: This comparison depends on the translator’s note citing Sayana; the
    hymn excerpt itself only says that Savitar’s Eagle was first born and obeys his
    law.
