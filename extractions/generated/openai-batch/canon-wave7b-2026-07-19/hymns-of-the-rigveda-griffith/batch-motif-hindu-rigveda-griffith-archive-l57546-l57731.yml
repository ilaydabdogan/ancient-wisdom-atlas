canonical_text:
  quote: ''
  summary: The passage praises and invokes deities, especially Indra. It describes
    the Maruts aiding Indra when other deities fled from Vritra, Indra using thunderbolt
    and wheel against Asuras, and ritual praise, gifts, oblation, and Soma offered
    for cattle, wealth, and protection. A Black Drop appears in Ansumati’s waters,
    assumes a luminous proper body, and Indra with Brihaspati conquers godless tribes.
    Indra also finds Heaven and Earth, defeats Sushna, finds cattle, releases obstructed
    rivers and enthralled floods, and is invited from heaven, sea, earth, or firmament
    to the Soma feast.
  language: English
  quote_policy: summarized
