canonical_text:
  quote: ''
  summary: A sequence of hymnic passages to Agni describes him as tracked in a dark
    cave, hidden in waters, fed as a growing babe, born from dry wood, active in forest
    and flood imagery, serving as priest and offering-bearer, granting wealth and
    children, rising to heaven, and sustaining or adorning cosmic order.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wise, one-minded group tracks Agni like a thief lurking in a dark cave with
    a stolen cow; the Gods approach holy Law and the Holy Ones sit near him.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:9
- id: obs:2
  text: The waters feed with praise a growing Babe described as nobly born in the
    womb and the seat of Law.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Agni is compared to nourishing food, a wide dwelling-place, a fruit-bearing
    hill, a wholesome stream, a swift steed, and the unchecked course of Sindhu.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Agni is called kin as a brother to sister floods; he eats the woods and, urged
    by wind through the forest, shears the hair of earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Agni is compared to a swan sitting in floods; he pants, wakes at morn among
    men, and is called a sage like Soma, sprung from Law.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Agni offers safety, grants power, shines brightly, strikes terror like a fiery
    arrow, and is called master of present and future life, maidens’ lover, and matrons’
    lord.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Worshippers are told to lead all their ways to the kindled God; his flames
    are driven below like floods while rays rise to heaven.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Agni is victorious in the wood, a friend among men, kinglike in claiming obedience,
    gracious, blessing, priest, offering-bearer, and full of thought.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Agni, bearing manly might, crouches in a cavern and causes fear among the
    Gods; men of understanding find him after singing heart-formed prayers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Agni is said to hold up the broad earth, fix the sky with effective utterance,
    guard cattle-loved places, and move from lair to lair.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Those who know Agni in his lair, approach the stream of holy Law, and release
    him through sacred rites are promised announcement of great wealth; the note explains
    release as freeing him from fire-sticks by attrition.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:10
- id: obs:12
  text: Agni grows in herbs, in each fruitful mother and babe, and in the waters’
    home; sages have built a seat for him.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: Agni ascends the sky, unveils nights and all that stands or moves, is preeminent
    among the Gods, and is born living from dry wood.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Agni, seated as priest with Manu’s progeny, is lord of treasures; worshippers
    hope for children, and he unbars wealth and decks heaven’s vault with stars.
  category: action
  evidence_refs:
  - ev:8
