canonical_text:
  quote: ''
  summary: 'The passage contains the end of a funeral hymn: women and the dead man’s
    wife are addressed, a bow is taken from the dead man’s hand, the body is entrusted
    to Earth the Mother, the Fathers, and Yama, and an obscure closing verse follows.
    It then gives a hymn praying for the return of cows or waters, invoking Agni,
    Soma, Indra, a herdsman, a Home-leader, and the Holy Deities, with offerings of
    butter and milk and requests for wealth and kine to return from the four quarters.'
  language: English
  quote_policy: summarized
