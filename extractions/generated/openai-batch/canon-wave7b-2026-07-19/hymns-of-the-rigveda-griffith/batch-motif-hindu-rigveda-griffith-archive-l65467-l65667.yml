  summary: The passage contains Soma Pavamana hymns and notes. Soma/Indu is pressed,
    purified through sieve, fleece, filter, and bowls, praised with songs, and directed
    toward Indra and other gods. The hymns describe Soma as golden, flowing, powerful,
    associated with cows, mothers, waters, horses, wealth, speech, strength, and cosmic
    elevation. One hymn asks that a long-tongued dog be driven away before possession
    of the drink.
