canonical_text:
  quote: ''
  summary: The passage contains the latter part of a hymn on the gamester and the
    dice, describing family rejection, longing for play, the destructive power of
    dice, the gambler’s ruined household, an admonition to cultivate land instead
    of gambling, and a plea for the dice to show mercy. It then begins a Visvedevas
    hymn invoking fires, Dawn, Heaven and Earth, Soma, Surya, Agni, and the Gods for
    favour, innocence, light, wealth, and protection from sin.
  language: English
  quote_policy: summarized
