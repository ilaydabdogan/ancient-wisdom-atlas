canonical_text:
  quote: ''
  summary: 'The passage explains ritual libations and the omentum offering as ambrosial,
    incorporeal offerings through which the sacrificer conquers immortality and ascends
    to heaven with a golden body. It then explains the morning litany: Prajapati as
    Hotr recites for the gods rather than the Asuras, the timing of recitation before
    ordinary speech, the use of a waters verse to include all deities, and Indra’s
    use of a verse as a thunderbolt against the Asuras.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The omentum, Agni, butter, and Soma libations are described as libations of
    ambrosia and as incorporeal libations by which the sacrificer conquers immortality.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The omentum is identified with seed; seed and omentum are described as white
    and incorporeal, while blood and flesh are described as the body.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The omentum offering is made in five portions with butter, gold, and omentum,
    and the passage relates this to man being fivefold: hair, skin, flesh, bone, and
    marrow.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the sacrifice is made to the same extent as man, it is offered in Agni
    as the birthplace of the gods; from Agni and the libation the sacrificer comes
    into being with a body of gold and goes aloft to heaven.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The morning litany is introduced by the Adhvaryu’s instruction to the Hotr
    to recite for the gods that move at morn; Agni, Usas, and the Acvins are named
    as those gods.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: When Prajapati as Hotr recited the morning litany, both gods and Asuras approached
    the sacrifice, but he recited for the gods alone; the gods prospered and the Asuras
    were defeated.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The litany is to be recited in the deep of night and before the speaking of
    fowls; birds and fowls are described as the mouth of Nirrti, and speech is called
    the holy power.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Prajapati begins the morning litany with a verse addressed to the waters because
    the waters and the rich ones are identified with all the deities; all the deities
    are said to be delighted by this beginning.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The gods fear that the Asuras will take the morning sacrifice; Indra says
    he will hurl his thrice-made-perfect thunderbolt against them in the morning.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: A verse is identified as a thunderbolt because it is addressed to the son
    of the waters, because it is a Tristubh, and because it is speech; Indra hurls
    it and slays the Asuras.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The thrice-repeated verse is said to support all the metres and to be the
    generating of the metres.
  category: relationship
  evidence_refs:
  - ev:9
