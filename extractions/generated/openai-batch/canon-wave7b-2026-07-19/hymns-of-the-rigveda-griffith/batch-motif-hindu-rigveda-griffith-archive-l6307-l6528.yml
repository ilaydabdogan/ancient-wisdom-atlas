canonical_text:
  quote: ''
  summary: The passage contains notes and hymnic verses centered on Agni. Agni is
    described as kindled in dwellings, bearer of riches, recipient and conveyor of
    offerings, protector in battle, friend and kinsman of humankind, Hotar, herald,
    cleanser, and invoker who brings the Gods to sacrifice. The hymns ask Agni for
    food, wealth, long life, children, protection from Rakshasas and curses, victory,
    and divine favor. Notes explain sacrificial fire, Soma, cows' milk, rivers or
    water used in Soma pressing, and a possible identification of Agni with Indra
    in the Vritra-slaying line.
  language: English
