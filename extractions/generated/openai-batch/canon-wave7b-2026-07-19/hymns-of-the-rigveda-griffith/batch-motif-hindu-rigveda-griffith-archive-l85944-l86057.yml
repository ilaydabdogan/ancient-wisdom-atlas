canonical_text:
  quote: ''
  summary: The passage gives ritual instructions involving the Nivid, removal of darkness,
    preservation of sight, and release from a net or snare. It then explains Indra’s
    confrontation with Vrtra, the Maruts’ loyalty when other gods abandon him, and
    the Maruts’ resulting share in the litany and Soma. A further section explains
    Indra becoming Mahendra through speech with Prajapati and claiming a choice sacrificial
    portion. The gods then approach Indra’s favorite wife Prisaha to obtain a share,
    and she answers with a verse praising Indra as Vrtra-slayer.
  language: English
  quote_policy: summarized
