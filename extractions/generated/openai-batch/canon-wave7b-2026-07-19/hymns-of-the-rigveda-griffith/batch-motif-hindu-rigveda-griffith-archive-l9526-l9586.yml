  summary: The passage personifies Dawn as an auspicious heavenly maiden and lady
    who awakens living beings to activity, vocation, and worship; follows the sequence
    of past and future dawns; does not wake the dead; and is associated with the kindling
    of Agni, revelation by the Sun's eye, and service to the gods.
