  quote: ''
  summary: The passage contains several hymnic sections centered on Agni. Worshippers
    present fuel, oil, fat, prayer, and praise; Agni is chosen and seated as priest
    and sacrificer; multiple deities are invoked at dawn; Agni is described with many
    names, threefold powers, cosmic light in heaven, plants, waters, mist, and floods;
    worshippers ask for protection, cattle, riches, a son, and offspring; and Agni
    is generated in the dwelling by rubbing fire-sticks, called his Mothers.
