canonical_text:
  quote: ''
  summary: A prose ritual explanation describes the anointing, raising, recitation,
    and possible disposal of the sacrificial post. The post is addressed as a tree
    and lord of the forest, asked to bestow wealth, protect the sacrificer, and burn
    evil beings. A mythic explanation says cattle once refused slaughter until the
    gods raised the post as a thunderbolt against them. Another explanation identifies
    the post and strew with the sacrificer, links Agni with divine birth and heavenward
    ascent, and explains a victim offered to Agni and Soma as redeeming the sacrificer
    from the deities.
  language: English
  quote_policy: summarized
