canonical_text:
  quote: ''
  summary: The passage contains Agni verses and Hymns III-IV addressed to Agni. It
    petitions Agni for protection, victory, wealth, food, shelter, and guidance; presents
    him as divine fire, priest, guest, envoy, offering-bearer, father, child, and
    war-protector; and relates him to other Vedic deities, marriage consecration,
    Cows and milk, divine immortality, and sacrificial offerings.
  language: English
  quote_policy: summarized
