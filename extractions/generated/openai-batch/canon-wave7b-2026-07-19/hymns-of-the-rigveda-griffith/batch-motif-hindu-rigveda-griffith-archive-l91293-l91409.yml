canonical_text:
  quote: ''
  summary: The passage gives ritual instructions for the Ahina rite, describing daily
    recitations as symbols of yoking, leading, and proceeding. It explains the yoking
    and releasing of the Ahina with specified verses, compares the rite’s continuity
    to a long journey with periodic unyoking, warns about over-recitation, and says
    the third pressing may be unlimited to obtain heaven. It then recounts that the
    gods saw cows in a cave, sought to win them by sacrifice, opened and destroyed
    the cave by ritual hymns and speech, and drove out or obtained the cows; sacrificers
    ritually repeat this pattern during the pressings.
  language: English
  quote_policy: summarized
