  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The prelude, singing, and response are performed with mind, while recitation
    is done with voice; speech and mind are described as a pairing of the gods.
  category: relationship
  evidence_refs:
  - ev:2
