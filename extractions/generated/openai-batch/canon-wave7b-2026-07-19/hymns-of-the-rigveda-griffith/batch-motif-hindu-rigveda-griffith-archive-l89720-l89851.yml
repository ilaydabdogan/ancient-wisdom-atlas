canonical_text:
  quote: ''
  summary: 'A ritual passage describes formulas and actions in a Soma-sacrifice setting:
    divine pairings associated with propagation, priests creeping and offering a libation,
    the Udgatrs chanting serpent-queen verses that identify the serpent queen with
    earth, the Hotr reciting the Four Hotrs as the gods'' secret sacrificial name,
    participants laying hold of an Udumbara branch for sap and strength, restrictions
    and timed release of speech, transfer of defective and excessive acts to Prajapati,
    and a Four Hotrs litany mapping ritual implements and priests to mental, verbal,
    and vital faculties.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Brhat and Rathantara are described as a pairing of the gods, and the passage
    says that through such pairings propagation with offspring and cattle is gained.
  category: relationship
  evidence_refs:
