- id: obs:2
  text: The priests creep from place to place, purify themselves, go to the Agnidh's
    altar, and an offering is made with a formula about a sucking calf and increase
    of wealth, sap, and strength.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Udgatrs creep together in the Sadas and chant to verses of the serpent
    queen.
  category: action
  evidence_refs:
