  quote: ''
  summary: The passage explains ninth-day Chandoma recitations and their symbolic
    relations to the end, to metres, cattle, food, and atonement. It then introduces
    the tenth day, linking the Prsthya Sadaha and Chandomas to bodily organs and sensory
    faculties, prosperity, purification, the hut of the wives, and an offering formula
    to Agni.
  language: English
  quote_policy: summarized
