  summary: The passage contains a closing Dawn fragment, hymns to Savitar, and a Visvedevas
    hymn. Dawn spreads light after Night. Savitar is praised as a radiant divine sustainer
    who grants defense, governs life, motion, rest, seasons, and cosmic regions, and
    is asked for food, progeny, wealth, shelter, and absolution. The Visvedevas hymn
    invokes many deities for preservation, comfort at sacrifice, shelter, bounty,
    and ritual blessing through libations, watery oblations, sacred food, and Agni.
