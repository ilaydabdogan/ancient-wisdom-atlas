  summary: The supplied passage contains Agni hymnic material with translator notes,
    followed by Hymn XXI to Agni and the opening of Hymn XXIII to Indra. Agni is worshipped
    as a flame-bearing god, Lord of Sacrifice, invoking priest, recipient of offerings,
    giver of wealth and strength, and figure linked with Atharvan, Vivasvin, Yama,
    clouds, rain, and plants. Indra is praised as renowned Thunderer, wielder of thunder,
    rider of wind-steeds, companion of Usana, slayer of Sushna, and helper against
    Dasyu/Dasa enemies.
