canonical_text:
  quote: ''
  summary: The passage contains hymnic appeals to Dawn, Savitar, and Parjanya. Dawn
    is asked to grant fame, wealth, cattle, and light; she comes with sunlight, chariot,
    oxen, brightness, and the restoration of daylight. Savitar is praised as a god
    who directs priests, brings good to beings, measures regions, moves through spheres
    of light, encompasses night, and grants prosperity while removing evil dreams
    and sorrows. Parjanya is praised as a roaring bull who sets seed in plants, smites
    trees, slays demons, and makes life fear his thunderous weapon.
  language: English
  quote_policy: summarized
