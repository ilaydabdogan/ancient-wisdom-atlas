canonical_text:
  quote: ''
  summary: The passage contains Soma Pavamana hymnic stanzas and translator notes.
    Soma/Indu/Pavamana is described as pressed, flowing, filtered, mixed with waters,
    held in vessels, offered to Indra and the gods, and asked to bring cattle, wealth,
    security, light, water, and defeat of enemies. A Falcon is said to have snatched
    the sweet Soma from heaven through the air while a bow-armed guardian is present;
    the note identifies the guardian as Krishanu and describes him as guarding celestial
    Soma. The passage also describes Apsarases dwelling in sea-waters, the wool fleece
    used as filter, press-stones, an oxhide, sages, Varuna, Mitra, Brihaspati, serpent
    imagery of uncertain meaning, and overflowing Soma that calls the gods from heaven.
  language: English
  quote_policy: summarized
