canonical_text:
  quote: ''
  summary: 'The passage explains a sequence of Vedic hymns used in a one-day ceremonial
    setting, especially the Vaisvadeva and Agnimaruta recitations. It repeatedly justifies
    hymn choices by formal or ritual correspondences: the day is the end, verses end
    alike, a hymn is multiform, praise is the end, and the Jatavedas verse brings
    welfare. It also describes atonement as rest for forbidden actions done on the
    day, with the Hotr priest’s knowledgeable recitation benefiting the sacrificers.'
  language: English
  quote_policy: summarized
