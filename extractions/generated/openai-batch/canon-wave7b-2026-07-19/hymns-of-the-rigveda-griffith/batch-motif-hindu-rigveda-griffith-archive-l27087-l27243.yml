  summary: The passage praises Indra for releasing rivers after slaying Vritra, rescuing
    a child from an ant-hill in an obscure episode, and coming with thunder, horses,
    and the Maruts to protect worshippers in sacrifice and battle. It asks Indra to
    drink Soma, grant strength, riches, cattle, and victory, and come from cosmic
    regions to aid the singers.
