canonical_text:
  quote: ''
  summary: The passage closes an Agni invocation, gives Hymn VIII to the Sacrificial
    Post with explanatory notes, and begins Hymn IX to Agni. It describes priests
    and sages guarding, anointing, raising, and consecrating a tree-derived sacrificial
    post; asks the post and Agni for wealth, offspring, protection, and divine favor;
    likens stakes or pillars to birds and horns; and recounts Agni as the Waters'
    Child, hidden in floods and brought to mortals by Matarisvan from the gods.
  language: English
  quote_policy: summarized
