canonical_text:
  quote: ''
  summary: The passage gives ritual explanations for offerings to the seasons, cups
    for two deities, sacrificial food, Soma, and the Hotr's goblet by identifying
    them with breaths, cattle, food, and the body. It then explains the silent praise
    as a hidden ritual essence discovered by the gods, used like an uncountered thunderbolt
    against the Asuras, and as the means by which the gods conclude and protect the
    sacrifice. It also states a rule against reproaching or cursing after the silent
    praise has been recited, and begins an explanation of the silent praise as the
    eyes of the pressings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The offerings to the seasons are identified as breaths, and proceeding with
    those offerings is said to place the breaths in the sacrificer.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Six priests offer with the formula “With the season,” four offer with “With
    the seasons,” and two later offer with “With the season,” corresponding to expiration,
    inspiration, and cross-breathing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Breath is described as divided in three ways: expiration, inspiration, and
    cross-breathing.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The sequence of formulas is said to maintain continuity of the breaths and
    avoid splitting them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The second vasat should not be said for the offerings to the seasons because
    the seasons are unresting and the second vasat is an ending.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: If the second vasat were said for the offerings to the seasons, the passage
    says the unresting seasons would be brought to rest and there would be an ill
    season.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The cups for two deities are identified as breaths, and sacrificial food is
    identified as cattle.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: After partaking of the cups for two deities, the officiant invokes sacrificial
    food, thereby invoking cattle and conferring cattle upon the sacrificer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage prescribes eating the subdivided sacrificial food before partaking
    of the Hotr’s goblet.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage says food is enveloped on both sides with Soma drinkings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Hotr’s goblet is identified as the body, and the remains of the cups for
    two deities are poured into it to place breaths in the body.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The gods and Asuras are said to have done the same thing at the sacrifice
    and to have been of even strength and not discriminated.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The gods saw the silent praise, which the Asuras could not follow; the passage
    calls the silent praise a silent essence.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Weapons raised by the gods were perceived and countered by the Asuras, but
    the silent praise, seen as a thunderbolt, was not countered and was used to smite
    them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Asuras came intending to make confusion of the sacrifice, and the gods
    concluded the sacrifice in the silent praise with formulas naming Agni, Indra,
    Surya, light, and the realms.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The sacrifice comes to conclusion when the Hotr recites the silent praise.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: A person who reproaches or curses after the silent praise has been recited
    is said to fall into misfortune, so one who knows should not reproach or curse
    then.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: The silent praise is identified as the eyes of the pressings, and the formula
    involving Bhuh, Agni, and light is called the eyes of the morning pressing.
  category: relationship
  evidence_refs:
  - ev:10
