canonical_text:
  quote: ''
  summary: The passage contains the opening hymn to Agni and the beginning of the
    following hymn to Vayu. Agni is invoked as priest, divine minister of sacrifice,
    bringer of the gods, giver of blessing and wealth, protector of sacrifice, dispeller
    of night, and guardian of Law. The commentary identifies Agni as fire, mediator
    between earth and heaven, and bearer of oblations. Vayu, Indra, Mitra, and Varuna
    are then invoked in connection with prepared Soma libations, ritual completion,
    and Law.
