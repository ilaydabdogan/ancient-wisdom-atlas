canonical_text:
  quote: ''
  summary: The passage describes ritual consecration through bodily coverings likened
    to caul and placenta, closed hands likened to an embryo or newborn, and descent
    to a final bath likened to birth. It then gives directions for reciting verses
    to Agni, Soma, Agni and Visnu, including reference to slaying Vrtra and to Agni
    and Visnu as guardians of consecration. It also assigns desired ritual results
    to metres such as Gayatri, Usnih, Anustubh, Brhati, Pankti, Tristubh, Jagati,
    and Viraj, and states that consecration is holy order and truth.
  language: English
  quote_policy: summarized
