canonical_text:
  quote: ''
  summary: 'The passage invokes the Ribhus, also called Vajas, Ribhukshans, Sons of
    Strength, and Children of Sudhanvan, to attend sacrifice and drink Soma or meath
    with Indra and other deities. It recounts their crafted works: making a single
    chalice fourfold, forming a cow, horses, armor, a cup for the gods, tawny steeds
    for Indra, making their parents youthful, and separating heaven and earth. The
    hymn asks them to give riches and treasure.'
  language: English
  quote_policy: summarized
