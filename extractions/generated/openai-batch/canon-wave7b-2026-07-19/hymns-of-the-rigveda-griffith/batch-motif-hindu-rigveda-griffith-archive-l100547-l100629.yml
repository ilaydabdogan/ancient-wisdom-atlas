canonical_text:
  quote: ''
  summary: The passage gives teachings that correlate breath, the self, bodily parts,
    classes of letters, numerical counts, and the days and nights of the year. Breath
    is described as a supporting beam for faculties and the whole self. Bodily parts
    and aspects of self are mapped to letter classes. Counts of 360 and 720 are related
    to parts of the body and to days and nights of the year. Knowing this correspondence
    is said to bring union, likeness, nearness to the days, sons, cattle, and a full
    lifespan. A further teaching maps syllables, sibilants, and unions to days, nights,
    and their junctions.
  language: English
  quote_policy: summarized
