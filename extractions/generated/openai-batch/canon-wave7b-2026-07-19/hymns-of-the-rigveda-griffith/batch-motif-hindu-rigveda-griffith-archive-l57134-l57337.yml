canonical_text:
  quote: ''
  summary: The passage contains invocations to Indra as Soma-drinker, friend, protector,
    giver of wealth, and Vritra-slayer. Worshippers offer Soma, praise, and a prepared
    banquet while asking for cattle, horses, corn, protection, strength, blessings,
    and Indra's presence. The hymn also recalls Indra's bolt, his destruction of ninety-nine
    castles, his slaying of Vritra and Ahi, the fear of the gods before the dragon
    or monster, and Indra's recognized might before Earth and Heaven.
  language: English
  quote_policy: summarized
