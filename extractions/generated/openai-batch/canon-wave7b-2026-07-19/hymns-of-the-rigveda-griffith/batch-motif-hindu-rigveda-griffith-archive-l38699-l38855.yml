  quote: ''
  summary: A sequence of hymnic passages to Indra invites him by his Bay Horses and
    chariot to drink Soma, praises him as giver, Thunderer, and Vritra-slayer, recounts
    his breaking of Vala and subduing of the Panis, describes Soma/Indu as lighting
    nights and mornings, and asks Indra for food, waters, cattle, horses, men, and
    protection of the sacrifice.
