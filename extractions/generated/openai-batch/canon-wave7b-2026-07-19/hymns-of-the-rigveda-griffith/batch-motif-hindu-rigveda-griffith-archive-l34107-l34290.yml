canonical_text:
  quote: ''
  summary: The passage presents hymnic praise and petition to the Maruts. They are
    described as a gold-adorned, armed, chariot-riding company who move to victory,
    bring rain from the Ocean, shake earth, mountains, woods, and heaven, and are
    asked for shelter, prosperity, deliverance, riches, and immortality. Further verses
    call the Marut company down, yoke their red and tawny steeds, describe Rodasi
    mounted on their chariot, and invoke the Maruts with Indra as wise, well-armed
    Sons of Prisni.
