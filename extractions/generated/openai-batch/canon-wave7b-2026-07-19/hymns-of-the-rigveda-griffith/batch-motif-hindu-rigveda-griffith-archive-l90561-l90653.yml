canonical_text:
  quote: ''
  summary: A prose ritual passage interprets concluding verses of Hotraka recitations.
    It links Maitravaruna and Brahmanacchansin verses with this world, yonder-world,
    and the world of heaven; cites Indra’s breaking of Vala and release of hidden
    cows for the Angirases; identifies Sarasvati with speech as the dear abode of
    Indra and Agni; and gives rules for Ahina and one-day rites, the three pressings,
    offerings to the gods, and the analogy of Hotr/Hotrakas with breath/body and limbs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Maitravaruna verse invoking Varuna is said to end with a request for sap
    and light; the passage glosses sap as this world and light as yonder-world, and
    says the verse lays hold of both worlds.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Brahmanacchansin triplet containing the word “apart” is said to set apart
    the world of heaven for the ritual participants.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage refers to Indra breaking Vala in the joy of Soma and notes that
    the verse contains the word “hole” or “vala.”
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A cited verse says Indra drove out cows for the Angirases, revealed those
    that were hidden, and hurled Vala headlong; the prose explanation says this wins
    booty.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The spaces of the sky are identified with the world of heaven, and a verse
    about Indra making them firm is said to provide daily support in the world of
    heaven.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sarasvati is identified with speech; speech is called the dear abode of Indra
    and Agni, and the recitation is said to unite them with that abode.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The concluding verses of the Hotrakas are divided into two kinds, those of
    the Ahina and those of the one-day rites, used at the morning and midday pressings.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Maitravaruna concludes only with verses of the one-day rite, the Achavaka
    with those of the Ahina, and the Brahmanacchansin uses both to go to this and
    to yonder world.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the third pressing the Hotrakas’ concluding verses are only those of the
    one-day rite; the one-day rite is called a support, and the sacrifice is established
    on that support.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the morning pressing the offering verse should be said without taking a
    breath; the passage compares this to giving quickly to one who is neighing and
    thirsting, and says food and Soma drinking are swiftly given to the gods.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: An unlimited number of verses is used at the two later pressings because the
    world of heaven is unlimited and the practice serves to obtain that world.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Hotr is identified with breath and with the body, while the Hotrakas are
    identified with limbs; this analogy explains shared recitation and the sameness
    of the Hotrakas’ concluding verses at the third pressing.
  category: relationship
  evidence_refs:
  - ev:6
