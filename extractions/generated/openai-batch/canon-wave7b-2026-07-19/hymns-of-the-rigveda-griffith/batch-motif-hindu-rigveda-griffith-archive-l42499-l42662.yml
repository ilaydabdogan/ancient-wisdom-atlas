  summary: The passage contains Rigvedic hymnic material and notes centered on Agni.
    Agni is praised as priest, herald, bearer, household lord, light-bringer, receiver
    of oblations, messenger to the gods, giver of wealth and food, child or beloved
    of cosmic powers, and divine ally in conflict. The hymns describe ritual kindling,
    sacrifice, oblations, requests for protection and riches, Agni's relation to Heaven
