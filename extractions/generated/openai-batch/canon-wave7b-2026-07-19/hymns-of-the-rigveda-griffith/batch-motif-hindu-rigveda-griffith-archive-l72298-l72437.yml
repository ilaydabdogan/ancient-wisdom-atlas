candidate_motifs:
- id: motif:1
  label: Stolen cattle or rays concealed in a rocky enclosure
  taxonomy_refs:
  - sacred_theft
  basis: The commentary explicitly describes Panis keeping stolen cows or vanished
    rays concealed and refusing to yield them, with recovery imagined as forcing cows
    from a rocky prison.
  evidence_refs:
  - ev:1
  - ev:7
  confidence: medium
  cautions: The notes state that allusions in this hymn are conjectural, and the cows
    may be read as stolen cattle, vanished rays, or actual sacrificial cows.
- id: motif:2
  label: Sacred cow milked in ritual and cosmic contexts
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: The passage repeatedly mentions sacrificial cows, Sabardhu as a cow whose
    milk is used in sacrifice, Aditi as the Cow linked with milking forth the universe,
    and the statement that the cow can now be milked when the path is open.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage and notes offer multiple identifications of the Cow, including
    Sabardhu, Aditi, a sacrificial cow, and Ludwig's New Year interpretation.
- id: motif:3
  label: Divine messenger moving between heaven and earth
  taxonomy_refs:
  - ascent
  basis: Agni is described as a friendly envoy borne on two paths, and the note explains
    these paths as from earth to heaven and from heaven to earth.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: medium
  cautions: The available taxonomy reference 'ascent' only partly fits, since the
    passage emphasizes two-way movement rather than ascent alone.
- id: motif:4
  label: Solar or royal bridge over cosmic waters
  taxonomy_refs: []
  basis: A King is called the bridge and is said to speed over waters; the note explains
    this as Sūrya passing over waters of the firmament by long beams of light.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: medium
  cautions: The figure's identification is not fully uniform in the notes, which also
    cite Wilson's rendering as royal Soma.
- id: motif:5
  label: Sacred birth and first-born divine identity
  taxonomy_refs:
  - sacred_birth
  - miraculous_child
  - divine_parent_child
  basis: The passage describes a Babe springing up and being borne by his Mother,
    and another stanza has a speaker, identified in the notes as Agni, call himself
    twice-born and first-born Son of Order.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The Mother and Babe are not explicitly identified in the extracted passage,
    and the imagery may be ritual or metaphorical.
- id: motif:6
  label: Ritual praise exchanged for protection, wealth, and glory
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  - royal_legitimacy
  basis: The worshippers offer hymns, viands, and adoration while requesting riches,
    protection of nobles and princes, fleet horses, priestly glory, and enrichment
    for prayers and praises.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  confidence: high
  cautions: This is a broad ritual-exchange pattern rather than a single narrative
    episode.
