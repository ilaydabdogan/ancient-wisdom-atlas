canonical_text:
  quote: ''
  summary: The passage gives Soma-sacrifice instructions for the Brahman’s corrective
    offerings and chanting with Indra; narrates how Arbuda Kadraveya, a serpent seer
    and spell-maker, performed a missing Hotr office for the gods, praised the pressing
    stones, was blindfolded with a turban, and had his spell mixed with other verses;
    explains that gods and serpents smote away evil and that serpents cast off old
    skin; and gives rules for the Gravastut’s number of verses, use of half-verses,
    relation to metres and pressings, and independence from direction.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When trouble in the sacrifice is attributed to the Rc, Yajus, Saman, or is
    unknown, the Brahman is instructed to offer on specified altars using the syllables
    printed as bhih, bhuvah, svar, or all three together.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Prastotr asks the Brahman whether they shall chant, and the Brahman answers
    at the pressings with formulae that include the three syllables and the phrase
    “With Indra do ye chant.”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the sacrifice is connected with Indra and that Indra
    is the god of the sacrifice.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gods performed a Sattra at Sarvacaru but could not smite away evil until
    Arbuda Kadraveya offered to perform an unperformed Hotr office for them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Arbuda is described as a serpent seer and maker of spells who crept out at
    each midday and praised the pressing stones.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The passage explains the midday praise of pressing stones and the path called
    the creeping out of Arbuda as imitations or memorial traces of Arbuda’s action.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Arbuda episode, after the king made them drunk, Arbuda’s eyes were
    bound with a turban because he was described as a poisonous snake looking at the
    king.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The spell associated with Arbuda’s praise was mingled with other verses; after
    this mingling, he did not make them drunk, and the passage says the mingling serves
    for expiation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the gods smote away evil, serpents also smote away evil; after doing
    so, they laid aside old worn skin and went on with a new one.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that one who knows this smites away evil.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: For the Gravastut’s praise, the passage discusses one hundred verses, thirty-three
    verses, and an unlimited number, linking them respectively to human life and powers,
    the thirty-three gods, and Prajapati’s unlimited nature.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: 'The passage recommends praise by half-verses, explaining it through support:
    man has two supports and cattle have four feet, so the sacrificer is made to find
    support in four-footed cattle.'
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Although the pressing stones are praised only at midday, the use of Gayatri
    and Jagati verses is said to accomplish praise at the morning and third pressings
    as well.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: The Gravastut undertakes his office without a direction because the office
    is identified with mind, and the passage states that mind requires no direction.
  category: relationship
  evidence_refs:
  - ev:10
