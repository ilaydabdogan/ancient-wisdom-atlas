canonical_text:
  quote: ''
  summary: The passage includes the close of a hymn to the Sun, praying for deliverance
    as Surya ascends, followed by Rigveda I.116 to the Asvins. The Asvins are praised
    for rapid travel, bringing Vimada a consort, winning a race, rescuing Bhujyu from
    waters by aerial or maritime conveyances, giving a white horse, granting wisdom
    and abundance, rescuing Atri from a cavern, releasing water for the thirsty, rejuvenating
    Chyavana, delivering Vandana from a pit, receiving knowledge from Dadhyach through
    a horse's head, granting a son, rescuing a quail from a wolf, restoring vision,
    and giving Vispala an iron leg in battle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sun is described as assuming a form in the sky's lap for Varuna and Mitra
    to behold, and a prayer asks the gods for deliverance while Surya ascends.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The singer prepares and sends praise for the Nasatyas, who are said to have
    brought a consort to the youthful Vimada in a swift chariot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Nasatyas' stallion ass is said to have won a thousand in a race called
    Yama's contest.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tugra left Bhujyu in a cloud of waters, and the Asvins brought Bhujyu back
    in animated vessels that traversed the air without being wetted by billows.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bhujyu is borne for three nights and three days to the farther shore of the
    sea in three cars described as hundred-footed and drawn by six horses.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Asvins carry Bhujyu to his dwelling across an unsupportive ocean in a
    ship with a hundred oars.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Asvins give Aghasva or Pedu a white horse as a lasting gift and wealth.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Asvins give wisdom to Kakshivan and pour a hundred jars of wine from the
    hoof of their strong charger.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Asvins ward off the burning of fire with cold, provide nourishing food,
    and bring Atri and his people out from a cavern after he has been cast downward.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Nasatyas lift up a well, set its base high so it opens downward, and streams
    flow for thirsty people of Gotama.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Nasatyas strip the skin from the old Chyavana, lengthen his life after
    others have left him helpless, and make him lord of youthful maidens.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Nasatyas deliver Vandana from a pit like hidden treasure.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Atharvan's descendant Dadhyach makes known the sweetness of Soma to the Asvins
    by means of a horse's head; the note explains that this concerns prohibited knowledge
    and a substituted horse head used to evade Indra's threat.
  category: sequence
  evidence_refs:
  - ev:13
  - ev:14
- id: obs:14
  text: A wise dame calls the Nasatyas in a great rite, and they give a son named
    Hiranyahasta to the weakling's wife.
  category: action
  evidence_refs:
  - ev:15
- id: obs:15
  text: The Asvins free a quail from a wolf's jaws and give a poet perfect vision
    while he mourns his trouble.
  category: action
  evidence_refs:
  - ev:16
- id: obs:16
  text: In Khela's battle at night, after Vispala's leg is severed, the Asvins give
    her an iron leg so she can move when conflict opens.
  category: sequence
  evidence_refs:
  - ev:17
