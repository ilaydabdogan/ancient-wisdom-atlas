  quote: ''
  summary: The passage contains explanatory notes on a concealed divine nature and
    on the “dear milk” of the Sister-Pair, followed by hymns to Agni. Agni is invoked
    as priest, minister, messenger, radiant fire, friend, deliverer, homestead lord,
    king, bearer of gifts, giver of wealth and a son, and protector against foes.
    Worshippers kindle and establish Agni after Manus’s precedent, bring sacred food
    and oil, use ladles, sing hymns, and ask that sacrifice proceed for all the Gods.
