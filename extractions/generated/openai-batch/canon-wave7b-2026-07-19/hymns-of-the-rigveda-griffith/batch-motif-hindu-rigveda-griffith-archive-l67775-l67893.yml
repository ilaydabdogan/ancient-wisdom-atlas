canonical_text:
  quote: ''
  summary: The passage invokes Yama’s two four-eyed dogs or envoys as watchers of
    a pathway and asks for protection, health, and continued sunlight. It then prescribes
    Soma, butter-enriched gifts, and other oblations to Yama, mentions ancient Rishis
    who made the path, and describes Yama in cosmic terms. The following hymn invokes
    the Fathers, asking ancestral spirits who receive Soma and offerings on sacred
    grass to aid and bless the callers.
