canonical_text:
  quote: ''
  summary: 'The passage praises Indra for heroic and cosmic deeds, including defeating
    opponents, spreading light, enclosing darkness, establishing hills, waters, earth,
    and heaven, and wielding the thunderbolt against Krivi. It then turns to ritual
    invocation: worshippers ask Indra for knowledge, wealth, protection, and boons;
    a morning car is described and explained in notes as the morning sacrifice; Indra
    is summoned with Bay Steeds and increasing numbers of horses to drink Soma poured
    by worshippers.'
  language: English
  quote_policy: summarized
