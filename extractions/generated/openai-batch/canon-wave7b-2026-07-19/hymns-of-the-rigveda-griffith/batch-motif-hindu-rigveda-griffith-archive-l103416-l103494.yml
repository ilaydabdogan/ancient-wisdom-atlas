canonical_text:
  quote: ''
  summary: Ritual instructions for the Mahavrata/Agnistoma describe tying up the swing
    to the west, the Hotr consuming a libation in a vessel with mantras to Speech,
    Soma, breath, and life, substitutions and variants in the third pressing and associated
    hymns, completion of the rite, carrying the swing to the bath, burning the seats,
    and forbidding recitation of the Mahavrata by an uninitiated person.
