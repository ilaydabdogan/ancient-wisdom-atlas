canonical_text:
  quote: ''
  summary: The passage gives ritual instructions and explanations for Hotraka recitations
    at Soma pressings. It links verse counts, metres, filled goblets, Soma, and Indra;
    interprets the sacrifice through seed, womb, and embryo imagery; says the Maitravaruna
    carries the sacrificer through ordered worlds by proper recitation; rejects seven-verse
    sets as harmful; and explains how verses to various deities can function as symbols
    of Indra while also delighting those deities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the morning pressing, verses for the filled goblets are recited with repeated
    terms connected to strength, drinking, pressing, and intoxication; the passage
    says these verses are to Indra and in Gayatri form.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ritual sequence uses nine small verses at the morning pressing, ten at
    the midday pressing, and nine small verses at the third pressing, and explains
    this through seed, the middle part of the woman, firmness, and offspring.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Repeating the whole hymns is said to propagate the sacrificer as an embryo
    from the sacrifice, which is called the womb of the gods.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: An alternative practice of reciting seven verses at each pressing is rejected
    because it is said to injure the seed of the sacrifice and the sacrificer himself.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Maitravaruna is said to carry the sacrificer from this world to the atmosphere,
    from the atmosphere to yonder world, and from yonder world to heaven through the
    proper verse sequence.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Verses addressed to Mitra, Varuna, the Maruts, Agni, and Tvastr are interpreted
    through words or figures such as drink, protector, Tvastr, and creator as symbols
    of Indra.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says that although the verses are to Indra, their address to various
    deities also delights the other deities, and their Gayatri form connects them
    with Agni.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: At the midday pressing, a recitation refers to divine Soma juice pressed and
    mingled with milk; the verses are addressed to Indra and are Tristubh verses.
  category: object
  evidence_refs:
  - ev:8
