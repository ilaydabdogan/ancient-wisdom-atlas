canonical_text:
  quote: the ship fair crossing is the sacrifice; the ship fair crossing is the black
    antelope skin; the ship fair crossing is speech
  summary: Ritual prose identifies sacrificial elements with a ship for crossing evils
    and reaching heaven; links recitation counts with the year and Prajapati; prescribes
    handling Soma the king with yoked and unyoked oxen and a cart to conquer the quarters;
    describes Soma’s guest reception; and gives recitations for kindling Agni, including
    measures against Raksases if the fire is delayed in being born.
  language: English
  quote_policy: quoted
