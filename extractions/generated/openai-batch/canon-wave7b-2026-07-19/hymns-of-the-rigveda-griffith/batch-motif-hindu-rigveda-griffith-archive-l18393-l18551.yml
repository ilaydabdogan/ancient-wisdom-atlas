canonical_text:
  quote: ''
  summary: 'The passage invokes Brahmanaspati/Brihaspati for wealth, protection, victory
    over enemies, and prosperity. It describes him as an ally in battle, avenger of
    sin, destroyer of demons, and upholder of Law. It also recounts mythic deeds:
    cleaving a mountain or Vala, opening a stall of kine, releasing waterfloods, dispelling
    darkness, revealing heavenly light, opening a stone-mouthed well, and interacting
    with Panis'' hidden treasure and sages. The passage closes by pairing Brahmanaspati
    with Indra and inviting them to the oblation.'
  language: English
  quote_policy: summarized
