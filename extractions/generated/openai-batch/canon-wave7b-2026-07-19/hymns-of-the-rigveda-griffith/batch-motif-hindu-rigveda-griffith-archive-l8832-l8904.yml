  quote: ''
  summary: The excerpt contains a translator's note on an unclear wolf-and-carpenter
    comparison and an alternative Moon reading, followed by Rigvedic invocations asking
    Adityas, Vasus, Fathers, Heaven and Earth, Nardsansa/Agni, Pishan/Pashan, Brihaspati,
    Indra, Aditi, Varuna, Mitra, Sindhu, Maruts, and the Gods for prosperity, rescue,
    guarding, boons, protection, and shelter. Repeated refrains liken rescue from
    distress to freeing a chariot from a difficult ravine. Kutsa is said to call Indra
    while sunk in a pit. Hymn CVII states that sacrifice and praise-songs obtain divine
    acceptance and protection.
