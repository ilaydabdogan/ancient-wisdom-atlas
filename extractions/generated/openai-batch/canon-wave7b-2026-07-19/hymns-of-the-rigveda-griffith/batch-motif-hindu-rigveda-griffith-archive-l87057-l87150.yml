canonical_text:
  quote: ''
  summary: Ritual prose on the continued Soma sacrifice explains the fourth-day Sodacin
    rite. It identifies the Sodacin with Indra’s thunderbolt and with speech, describes
    its use against a rival, links its forms to cattle, syllable counts, truth and
    falsehood, recounts Indra’s smiting of Vrtra as the origin of the Nanada Saman,
    and explains the intertwining of metres to connect man, cattle, speech, strength,
    and the thunderbolt.
  language: English
  quote_policy: summarized
