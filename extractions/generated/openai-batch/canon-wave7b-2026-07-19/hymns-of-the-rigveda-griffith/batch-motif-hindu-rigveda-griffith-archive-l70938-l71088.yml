canonical_text:
  quote: ''
  summary: The passage contains Rigvedic hymn material and notes concerning Agni as
    priest, oblation-bearer, purifier, and fire fashioned for humans by cosmic and
    divine agents; petitions to Indra Vaikuntha for wealth, protection, victory, and
    a spacious home; and Indra’s first-person claims of possessing wealth, supporting
    Atharvan, recovering kine for Trita from the Dragon, defeating Dasyus, receiving
    Tvashtar’s thunderbolt, and holding divine intellectual power.
  language: English
  quote_policy: summarized
