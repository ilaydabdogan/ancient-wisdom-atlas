canonical_text:
  quote: ''
  summary: 'The passage contains several Rigvedic hymn fragments and notes: invocations
    to Indra with offerings, curd libation, treasure, rivers, weapons, and foe-defeat;
    a hymn on Vasistha, Bharadvaja, and sages finding or bringing ritual chants, formulas,
    and the Gharma from deities; an invocation to Brihaspati and Narasansa/Agni for
    protection from curses, sinners, and demons; a fertility/procreation hymn involving
    the sacrificer, wife, and Hotar-priest; a hymn to Aditi concerning the protection
    of Varuna, Mitra, Aryaman, and the Sons of Aditi; a hymn to Vayu/Vata for health,
    life, and Amrit; and the opening of a hymn to Agni asking him to carry worshippers
    past foes.'
  language: English
  quote_policy: summarized
