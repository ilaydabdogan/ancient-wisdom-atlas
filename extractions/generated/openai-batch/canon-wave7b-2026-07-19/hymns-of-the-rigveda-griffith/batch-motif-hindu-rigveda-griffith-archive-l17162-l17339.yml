  summary: The passage includes a brief Agni fragment about fire produced in wood
    and a hymn to Indra. Indra is invoked with offerings and Soma, praised as a heroic
    god who releases obstructed waters, defeats Ahi, Vritra, Dasa/Dasyu figures, Arbuda,
    and Vala, brings rain, discloses light for the Arya, and grants wealth, children,
    friends, habitation, and allies. A following hymn opening calls Indra a just-born
    chief god and protector before whom the two worlds tremble.
