  quote: ''
  summary: The passage contains stanzas and notes from hymns to Indra. It describes
    Soma pressing, hymns, oblations, Indra’s help in battle, the buying and returning
    of Indra after he slays Vritras, divine protection for pious Soma-offerers, exclusion
    and punishment of non-offerers, a first-person divine speaker claiming identities
    and cosmic acts, and the Falcon/Bird bringing Soma from the loftiest heaven to
    Manu.
  language: English
  quote_policy: summarized
