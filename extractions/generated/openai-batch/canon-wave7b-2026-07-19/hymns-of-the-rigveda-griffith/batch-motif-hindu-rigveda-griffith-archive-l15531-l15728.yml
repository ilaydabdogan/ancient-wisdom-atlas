canonical_text:
  quote: ''
  summary: The passage praises Indra as receiver of sacred food and protector in battle,
    then gives hymns to the Asvins. The Asvins travel in a celestial chariot with
    coursers, scatter moisture, are associated with dawn, waters, milk, fire-offering,
    sweetness, protection, rain, horses, riches, and the sacrificial exchange of praise
    and offerings for aid.
  language: English
  quote_policy: summarized
