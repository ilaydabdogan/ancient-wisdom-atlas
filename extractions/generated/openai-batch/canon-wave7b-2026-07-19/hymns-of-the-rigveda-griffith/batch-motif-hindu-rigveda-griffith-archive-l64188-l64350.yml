canonical_text:
  quote: ''
  summary: 'English translation of Rigvedic Soma Pavamana verses in which Soma/Indu
    is addressed as a flowing, purified deity and juice: sovereign, steer, king, warrior,
    mediator between men and gods, father and supporter. The passage describes Soma
    moving through worlds, streams, filters, fleece, bowls, jars, milk, and sacred
    grass, while granting wealth, cattle, children, protection, and wisdom-like discovery.'
  language: English
