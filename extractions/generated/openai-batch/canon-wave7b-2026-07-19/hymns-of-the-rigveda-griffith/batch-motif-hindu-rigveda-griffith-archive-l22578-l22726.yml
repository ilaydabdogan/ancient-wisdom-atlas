canonical_text:
  quote: ''
  summary: The passage praises Indra as empowered by Marut song, Soma, sacrifice,
    and worship. Indra strikes Vritra or Ahi, releases or channels the waters, upholds
    earth and heaven, and is invoked for protection and victory. A second section
    presents the rivers Vipās and Sutudrī as personified streams moving from mountains
    toward the ocean; the singer asks them to pause, and they state that Indra dug
    their channels after smiting the current-blocking Vritra, while Savitar set them
    flowing.
  language: English
