canonical_text:
  quote: ''
  summary: The passage contains ritual lines and notes on Agni, the Asvins, and sacrificial
    cups, followed by Hymn XXXVIII to Savitar and the opening of Hymn XXXIX to the
    Asvins. Agni receives offerings and is linked with fire, household light, and
    wealth-giving. Savitar rises, quickens beings, controls motion, divides seasons,
    sets creatures in their places, and is invoked for welfare, wisdom, and bounty.
    The Asvins are addressed as a paired divine presence and compared to paired objects
    and persons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ritual sequence mentions drinking from the Hotar’s, Potay’s, and Neshtar’s
    cups, proffered food, and a fourth cup for the wealth-giving God; a note identifies
    Agni as Dravinodas, Wealth-giver.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Twain, identified in a note as the Asvins, are asked to yoke a hero-bearing
    car, mix oblations, come with meath, and drink Soma.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Agni is asked to accept fuel, an offered gift, prayer, and eulogy, and to
    make the great gods taste the gift.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Savitar is described as uprisen, as quickening, as giving treasure to the
    gods, and as blessing one who calls them to the banquet.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Savitar goes up on high and spreads his arms; the waters bend to his service,
    and the wind rests in the circling region.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Savitar unyokes swift steeds, stops a fleet chariot, checks serpent-like haste,
    and Night follows his dominion.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The following stanza describes weaving or re-weaving, a paused labor, arising
    from rest, and parted seasons; the translator’s note says the stanza is obscure
