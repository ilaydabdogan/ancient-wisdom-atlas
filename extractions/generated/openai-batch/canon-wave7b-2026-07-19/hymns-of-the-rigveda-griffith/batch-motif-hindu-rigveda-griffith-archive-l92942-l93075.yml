canonical_text:
  quote: Do thou wander.
  summary: A repeated divine injunction to wander leads the wandering man through
    successive years in the wild. In the sixth year he meets the hungry seer Ajigarta,
    buys Ajigarta's middle son Cunahcepa as a substitute victim, and presents him
    for sacrifice to Varuna in the Rajasuya rite. Ritual priests are named; Ajigarta
    accepts further payments to bind and then to slaughter the boy.
  language: English
  quote_policy: quoted
