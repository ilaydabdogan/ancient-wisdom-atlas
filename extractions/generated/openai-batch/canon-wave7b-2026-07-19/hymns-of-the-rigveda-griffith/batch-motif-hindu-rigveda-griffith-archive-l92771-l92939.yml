canonical_text:
  quote: ''
  summary: The excerpt includes an obscure preceding statement about a son, mother,
    sister, a broad auspicious path, and herd behavior. In the following legend, an
    unnamed speaker tells a man to seek Varuna, the king, for a son and to promise
    sacrifice with that son. Varuna grants the request; Rohita is born. Varuna repeatedly
    demands fulfillment, while the human recipient postpones the sacrifice through
    successive life-stage criteria. When Rohita becomes fit to bear arms, he refuses
    to be sacrificed, takes his bow, and goes into the wild. Varuna then seizes Aiksvaka,
    whose belly swells. Rohita returns toward the village, but Indra appears in human
    form and repeatedly urges him to keep wandering, praising the prosperity and purification
    of the wanderer.
  language: English
  quote_policy: summarized
