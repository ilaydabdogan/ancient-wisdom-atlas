canonical_text:
  quote: ''
  summary: 'The passage first gives ritual expiations involving sacrificial fires,
    light, gold, silver, water, food-offering, reverence, and removal of guilt. It
    then begins the Legend of Cunahgepa: the sonless Hariccandra asks Narada what
    a man gains by a son, and Narada replies that a son pays debt, gives immortality,
    brings delight, ferries fathers over darkness, is a light in heaven, and embodies
    the father’s rebirth through wife and mother.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If the sun rises or sets on a man’s fire before it is taken out, the stated
    expiation uses gold in the evening and silver in the morning; gold is identified
    with pure light and silver with night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ahavaniya is to be taken out before the blending of shadows; shadow is
    identified with darkness and death, and light is said to cross over it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a wagon, chariot, or dog comes between the Garhapatya and Ahavaniya fires,
    one instruction is to ignore it; if attention is paid to it, a continuous stream
    of water is drawn from Garhapatya to Ahavaniya with a mantra about the atmosphere-thread
    and following light.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When fuel is piled on the fires, the Anvaharyapacana is to be procured; a
    libation is offered to Agni as eater of food and lord of food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The sacrificer moves between Garhapatya and Ahavaniya before offering; the
    fires are said to know he is going to offer, to smite away his guilt, and he then
    goes aloft to the world of heaven.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The fires may be revered in silence when departing, returning, or daily; another
    instruction gives the words of safety for the fires and for the speaker.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Hariccandra Vaidhasa Aiksvaka is described as a king’s son with a hundred
    wives but no son; Parvata and Narada dwell in his house, and Hariccandra asks
    Narada what a man gains by a son.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: Narada replies that a father who sees the face of a living son pays a debt
    in him and attains immortality; the delight of a father in a son is said to exceed
    other delights.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Narada says fathers have passed over deep darkness by means of a son, that
    the self is born from the self, and that the son is a ship fitted to ferry over.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Narada contrasts ascetic or ritual markers with the instruction to seek a
    son, and says a son is a light in the highest heaven.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Narada says the father enters the wife, becomes a germ in the mother, and
    is born in the tenth month; the gods and seers bring the mother together, and
    the saying is given that a sonless one cannot attain heaven.
  category: sequence
  evidence_refs:
  - ev:11
