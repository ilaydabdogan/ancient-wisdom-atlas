canonical_text:
  quote: ''
  summary: The passage gives ritual prescriptions and explanations for Hotr offices,
    Stomas, and a renewed royal anointing. A Ksatriya/Rajanya is prepared for anointing
    after a bath and cow offering; an Udumbara throne, goblet, branch, tiger skin,
    and mixed liquid elements are prepared. The throne is placed partly inside and
    partly outside the altar, covered with tiger skin, addressed with invocations
    to deities and metres, mounted for kingship and sovereignty, and followed by a
    prayer to waters to confer radiance, force, and might.
  language: English
  quote_policy: summarized
