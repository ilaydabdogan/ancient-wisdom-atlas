  summary: The passage praises Indra as a mighty, generous, warrior deity who gives
    wealth, cannot be barred by hills, exceeds heaven and earth, quells curses, comes
    with the Maruts, and is invoked to kill foes/Vritras with a thunderbolt. It also
    describes hymnic praise by worshippers, Maruts, and Gotamas, and includes notes
    on sacrificial cows and on the divine light as the Sun.
