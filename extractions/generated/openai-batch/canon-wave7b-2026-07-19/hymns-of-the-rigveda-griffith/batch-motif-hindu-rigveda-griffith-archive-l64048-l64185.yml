canonical_text:
  quote: ''
  summary: The passage praises Soma/Pavamana/Indu as a flowing, purified, sacrificial
    and cosmic figure. Soma is pressed, filtered through wool or a sieve, mixed with
    streams and milk, poured into beakers and vats, and received by Indra. Soma is
    also described as making dawns shine, giving room to rivers, raising a solar figure
    to heaven, opening a cow-stall for the Angirases, being brought from heaven by
    a Falcon, ruling the living world, establishing Law, and appearing as a newborn
    Child surrounded by Seven Mothers or Rivers.
  language: English
  quote_policy: summarized
