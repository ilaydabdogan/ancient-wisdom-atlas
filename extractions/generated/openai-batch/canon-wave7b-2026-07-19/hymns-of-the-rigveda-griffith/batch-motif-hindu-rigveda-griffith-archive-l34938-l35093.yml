canonical_text:
  quote: ''
  summary: A sequence of Rigvedic hymns invokes Mitra and Varuna as divine rulers
    associated with Law, Ordinance, rain, wealth, protection, Soma, and sacrifice.
    It also invokes Aditi, mentions Atri as an ancestral or ritual model, and turns
    to the Asvins, whose car, wheel, Surya’s mounting, red birds, burning splendors,
    and Atri’s stirring of a spotless flame are described.
