- id: obs:3
  text: The Soma-stalk roars, follows a wave, swells with sap, and lays a germ on
    Aditi’s lap so that children and progeny may be gained.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Exhaustless Ones, also called the kindred Four, descend from heaven or
    the third region with procreative power, oil, Amrit, and sacred gifts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Soma assumes a white colour, comes down a steep slope through song to sacrifice,
