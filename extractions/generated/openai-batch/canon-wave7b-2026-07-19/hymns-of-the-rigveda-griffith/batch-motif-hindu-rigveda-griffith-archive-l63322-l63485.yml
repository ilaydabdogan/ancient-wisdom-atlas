canonical_text:
  quote: ''
  summary: The passage contains hymnic praise of Soma Pavamana. Soma is described
    as rain- and flood-associated, produced and mixed with milk, butter, meath, streams,
    and Amrit, pressed and cleansed through wool or fleece, brought to vessels, and
    prepared for Indra’s drink. The passage also links Soma with Aditi, procreation,
    Heaven and Earth, Surya’s car and beam, the Rishis and sages, wealth, cattle,
    and victory in battle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A praised figure follows Aditi’s right path, commands rain, is called Steer
    of the kine and Leader of floods, and helps the worshippers.
