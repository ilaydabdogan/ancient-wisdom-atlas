  summary: The passage invokes Agni in images of fire moving over earth, asks him
    for wealth, refuge, long life, and food, describes his birth and production from
    strength, waters, plants, cosmic parents, and ritual action, presents him as herald,
    priest, and mediator of sacrifice, and opens an Apri sequence inviting gods, especially
    Indra, into the prepared rite.
