canonical_text:
  quote: ''
  summary: The passage contains explanatory notes and verses in which Indra defeats
    Dasyu, Vritra, Ilibisa, and Sushna with thunder and weapons, releases or makes
    waters flow, aids favored human figures in battle, and receives prayer and Soma-offering.
    It then opens a hymn to the Asvins, repeatedly asking them to come three times
    daily in their honey-bearing, three-wheeled car and grant food, wealth, medicines,
    health, strength, and protection.
  language: English
  quote_policy: summarized
