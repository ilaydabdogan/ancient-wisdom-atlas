- id: obs:1
  text: An officiant anoints the recipient with waters while placing an Udumbara branch
    between them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The anointing formula calls the waters auspicious, healing, realm-prospering,
    realm-supporting, and immortal, and tells the recipient to become an overking
    of kings.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The formula names Prajapati as having anointed Indra, Soma the king, Varuna,
    Yama, and Manu with these waters.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Another anointing formula invokes Savitr, the Acvins or Agvins, Posan or Pasan,
    Agni, the sun, and Indra for might, prosperity, glory, and the eating of food.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage discusses the use of the exclamations bhih, bhuvah, and svar in
    relation to descendants, rivals, whole speech, life span, and conquest.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says that holy power, lordly power, strength, food, plant and
    water sap, splendour, refreshment, growth, and propagation have departed from
    a Ksatriya who has sacrificed, and that two libations confer holy and lordly power
    on him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Udumbara throne, goblet, and branch are explained as conferring strength and
    the eating of food.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Curd, honey, ghee, rain-water in sunshine, grass, green barley, Sura, and
    Durva grass are each interpreted as conferring specified qualities such as sap,
    brilliance, splendour, refreshment, growth, propagation, lordly power, food sap,
    and support.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Sura vessel is placed in the recipient’s hand, a verse to Soma is recited,
    and an expiation formula separates the places of Sura and king Soma and tells
    Sura not to harm him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After drinking, the recipient is instructed to give the drink to one deemed
    generous, and the passage says this is a symbol of friendship and support in a
