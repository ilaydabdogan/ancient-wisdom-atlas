canonical_text:
  quote: ''
  summary: 'Ritual prose describes a royal re-anointing: the recipient is anointed
    with auspicious waters and Udumbara materials while divine powers are invoked;
    ritual utterances, libations, plants, drinks, and grasses are interpreted as conferring
    strength, food, splendour, royal power, support, and sovereignty. The passage
    distinguishes Soma and Sura, links a drink to friendship, and ends with a descent
    and support formula invoking sky, earth, day, night, food, drink, holy power,
    lordly power, and the three worlds.'
  language: English
  quote_policy: summarized
