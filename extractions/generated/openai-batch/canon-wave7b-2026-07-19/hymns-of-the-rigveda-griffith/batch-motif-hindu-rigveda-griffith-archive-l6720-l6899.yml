candidate_motifs:
- id: motif:1
  label: Thunder-god defeats dragon and releases waters
  taxonomy_refs:
  - serpent
  basis: Indra, called Thunderer and Thunder-armed, slays Vritra, called the Dragon,
    with the thunderbolt, and the floods are released.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage names Vritra as Dragon and connects the slaying with floods,
    but it does not provide a full narrative sequence beyond hymn praise.
- id: motif:2
  label: Cosmic trembling before divine warrior
  taxonomy_refs:
  - chaos
  basis: The Pair of Worlds, fixed and moving things, and Tvashtar tremble or shake
    at Indra’s wrath and shout during the Vritra conflict.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage emphasizes awe and shaking; assigning this to a broader chaos
    motif is interpretive.
