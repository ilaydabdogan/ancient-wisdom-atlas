canonical_text:
  quote: ''
  summary: 'The passage praises Indra as thunder-armed slayer of Vritra who releases
    floods, terrifies cosmic and divine beings, aids worshippers in battle, grants
    spoil and wealth, arrives with Bay Steeds and car, rejoices with Soma and his
    spouse, and blesses sacrificers. It also recalls older ritual figures and acts:
    Atharvan, Manu, Dadhyach, the Angirases finding the Pani’s hoarded cattle and
    wealth, Atharvan laying paths, the Sun arising, Usana driving kine, and offerings
    to Yama’s deathless birth.'
  language: English
  quote_policy: summarized
