  summary: The passage gives ritual directions for reciting Sampata and related hymns
    on specified days. It explains that particular recitations are used to obtain
    the worlds of heaven, invite Indra, continue the Ahina, align the rite with the
    twelve-month year and Prajapati, and use verse insertions by which gods, seers,
    and sacrificers conquer heaven.
  language: English
  quote_policy: summarized
