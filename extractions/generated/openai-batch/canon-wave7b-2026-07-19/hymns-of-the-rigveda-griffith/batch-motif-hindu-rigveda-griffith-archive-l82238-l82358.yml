canonical_text:
  quote: ''
  summary: 'The passage explains parts of a Soma consecration sacrifice: an offering
    to Agni and Visnu, numerical divisions of potsherds and verses, ritual substances
    linked with generation, offerings and libations as means of reaching or calling
    the gods, the Hotr’s invitatory role, and the consecrated person being ritually
    remade as an embryo and led to a hut described as a womb.'
  language: English
  quote_policy: summarized
