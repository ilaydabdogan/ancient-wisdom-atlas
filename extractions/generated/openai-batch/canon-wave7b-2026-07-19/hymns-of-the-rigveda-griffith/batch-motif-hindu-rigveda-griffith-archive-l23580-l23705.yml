canonical_text:
  quote: ''
  summary: A sequence of Rigvedic hymns praises Indra as bull, warrior, sovereign,
    thunder-wielder, Soma-drinker, and victorious slayer of Vritra/Ahi-like foes.
    The passage describes Soma flowing or being prepared for Indra, Indra drinking
    with the Maruts, his birth and first desire for Soma, his mother and father, his
    conquest of Tvashtar and taking of Soma, and his engendering by Gods, Heaven,
    and Earth to crush the Vritras.
  language: English
