  summary: A sequence of Rigveda hymns invokes Savitar, Bhaga, the Asvins, Agni, Indra,
    Vayu, Soma, the Visvedevas, and the Maruts. The speakers request wealth, protection,
    health, auspicious days, and prosperity; invite gods to a Soma sacrifice; describe
    Soma being poured, mixed with curd, and drunk by gods; and praise the Maruts as
    bold guardians.
