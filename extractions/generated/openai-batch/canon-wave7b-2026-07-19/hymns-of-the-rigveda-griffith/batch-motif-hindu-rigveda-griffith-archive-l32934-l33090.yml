canonical_text:
  quote: ''
  summary: A Rigvedic hymn passage invokes Earth and Heaven, prepares Soma libations,
    invites Vayu, Indra, Agni, Aramati, the Asvins, Pushan, the Maruts, Sarasvati,
    Brihaspati, and other deities to the sacrifice, and asks for protection, vitality,
    bliss, wealth, heroes, and guidance. Translator notes identify several figures
    and ritual images, including Soma pressing, the caldron and sacrificial offering,
    Aramati as a goddess linked with Earth, and a comparison with Zoroastrian Spenta-Armaiti.
  language: English
  quote_policy: summarized
