candidate_motifs:
- id: motif:1
  label: Soma sacrifice as divine invitation and exchange
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: The passage centers on preparing and pressing Soma, inviting deities to drink
    or attend, and asking for protection, power, guidance, riches, and bliss.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:7
  - ev:9
  - ev:15
  confidence: high
  cautions: The motif is extracted at the level of ritual pattern rather than a narrative
    plot.
- id: motif:2
  label: Cosmic parents protect worshippers
  taxonomy_refs:
  - divine_parent_child
  basis: Earth and Heaven are explicitly called Father and Mother and asked to protect
    the speakers.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage does not narrate a birth; the motif is limited to parental
    divine address.
- id: motif:3
  label: Fire-child tended at the altar
  taxonomy_refs:
  - divine_parent_child
  - sacred_birth
  - sacrifice
  basis: A caldron on the fire is compared to a son on a father's lap, and priests
    deck the Child at the Mother's loftiest station, glossed as Agni at the altar.
  evidence_refs:
  - ev:6
  - ev:13
  confidence: medium
  cautions: The Child is interpreted through the translator's note as Agni; the passage
    is ritual-poetic rather than a full birth narrative.
- id: motif:4
  label: Divine powers summoned from heaven, mountain, and sacred paths
  taxonomy_refs:
  - ascent
  basis: Aramati is brought by God-traversed paths, Sarasvati visits from high heaven
    and the mountain, and the Sustainer is invoked from high heaven.
  evidence_refs:
  - ev:5
  - ev:10
  - ev:12
  confidence: low
  cautions: The passage emphasizes invitation and descent/arrival more than an ascent
    journey; taxonomy fit is weak.
- id: motif:5
  label: Earth-linked piety goddess
  taxonomy_refs:
  - mother_goddess
  basis: The note identifies Aramati as a goddess presiding over worship and active
    piety and personifying Earth, while Earth is addressed as Mother elsewhere in
    the passage.
  evidence_refs:
  - ev:1
  - ev:16
  confidence: medium
  cautions: The mother-goddess taxonomy is applied cautiously because Aramati is not
    directly called Mother in the cited stanza.
comparison_claims:
- id: claim:1
  claim: The translator note compares Aramati with the Zoroastrian Spenta-Armaiti
    or Holy Piety and Spirit of Earth, suggesting a cautious same-function comparison
    between the Vedic and Zoroastrian figures as earth- and piety-associated goddesses.
  claim_level: same_function
  target: Zoroastrian Spenta-Armaiti / Holy Piety and Spirit of Earth
  evidence_refs:
  - ev:16
  counter_evidence_refs: []
  confidence: medium
  limitations: This is based on the translator's note within the passage, not on an
    independent linguistic or historical demonstration in the extracted text.
- id: claim:2
  claim: A translator note reports Ludwig's observation that the Indra-and-Earth statement
    is a germ of the myth of Prajapati and his daughter, with a cross-reference to
    Rigveda X.61.
  claim_level: same_motif
  target: Prajapati and his daughter; Rigveda X.61
  evidence_refs:
  - ev:17
  counter_evidence_refs: []
  confidence: low
  limitations: The passage provides only the commentator's brief comparison and does
    not include the Prajapati narrative itself.
