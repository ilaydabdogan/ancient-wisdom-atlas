canonical_text:
  quote: ''
  summary: 'The passage contains notes and hymnic material centered on Indra: a note
    recounts Indra slaying Asuras with the Sun-chariot’s wheel; hymns praise Indra
    for breaking forts, controlling earth and water-floods, aiding worshippers in
    battle, granting streams, spoils, and gifts, opening a stall for the Angirases,
    and being invoked with Parvata as champion. A later hymn invokes Indra to burn,
    crush, strike, and cast sorceresses, she-fiends, demons, and foes into a pit.'
  language: English
  quote_policy: summarized
