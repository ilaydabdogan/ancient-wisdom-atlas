canonical_text:
  quote: ''
  summary: The passage addresses Agni/Jatavedas with praise, describes him moving
    in flame, dwelling in fuel and wood, passing through waters, and being secured
    or produced by a twain with ten girdles. The worshipper offers hymn, homage, and
    prayer and asks Agni to protect children, descendants, and bodies. A following
    Agni hymn describes him as Sea and treasure-holder, born repeatedly, hidden in
    a secret couple's bosom, connected with a Bird in a fountain, with Stallions and
    Mares sharing a dwelling, sages guarding Holy Order and concealed names, and a
    Holy Pair forming the Infant identified in the note as Agni.
  language: English
  quote_policy: summarized
