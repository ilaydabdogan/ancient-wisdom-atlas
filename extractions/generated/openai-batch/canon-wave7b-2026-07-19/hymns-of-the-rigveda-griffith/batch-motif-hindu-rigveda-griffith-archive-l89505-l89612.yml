literal_observations:
- id: obs:1
  text: A hymn addressed to Agni/Jatavedas is said to contain the word “great,” making
    it a symbol of the eighth day; the verses are Gayatri and are assigned to the
    third pressing in a three-day set.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ninth day is described as a repetition of the third day, and features
    such as same endings, specific words, alliteration, past tense, mention of deity
    in the last Pada, and reference to yonder world are listed as symbols of the ninth
    day.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ajya of the ninth day is identified by the phrase about having “gone”
    with praise, and its occurrence on the ninth day is treated as a ninth-day symbol;
    it is in Tristubh.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A group of Prauga hymns includes invocations or references to the Acvins,
    Indra, the Angirases, Sarasvati, the sky, and a great mountain; words such as
    pure, true, dwell, gone, and house make the group a symbol of the ninth day.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A continuation of hymns is said to be the same as that of the third day, making
    it a symbol of the ninth day.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'Several hymn features are identified with the end: the call “Hail,” heaven,
