  category: action
  evidence_refs:
  - ev:10
- id: obs:9
  text: Pairing hymns in Tristubh and Jagati and a set of five hymns are connected
    with cattle and with winning cattle.
  category: relationship
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:10
  text: The ninth-day sequence includes Brhat as Prstha, a normal inserted verse,
