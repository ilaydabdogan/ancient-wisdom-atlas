canonical_text:
  quote: ''
  summary: The passage first describes Surya as moving between gods and humankind,
    seeing and measuring days, riding with seven bright steeds, rising to higher heaven,
    and being invoked to remove disease and yellowness. The yellowness is to be transferred
    to parrots, starlings, or Haritala trees. The passage then praises Indra as a
    wealth-giving divine warrior aided in battle, who opens enclosed cattle and waters,
    releases treasure, defeats Vritra and other enemies, raises the Sun, wields the
    thunderbolt, and is asked to distinguish Aryas from Dasyus and punish the lawless.
  language: English
  quote_policy: summarized
