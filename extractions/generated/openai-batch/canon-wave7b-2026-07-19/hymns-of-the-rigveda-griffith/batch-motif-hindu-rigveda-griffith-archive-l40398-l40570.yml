canonical_text:
  quote: ''
  summary: The passage contains notes and hymnic stanzas concerning Pushan, Indra
    with Pushan, and Indra-Agni. Pushan is described through goat-drawn transport,
    charioteer imagery, curd-and-meal offerings, cattle-guarding, kinship and courtship
    language, golden ships, and association with Surya. Indra and Pushan are invoked
    for prosperity, spoil, and aid against fiends, with Indra bringing down streams
    and floods while Pushan stands beside him. Indra and Agni are addressed as brothers
    and twins from a common father, armed with the thunderbolt and called to help.
  language: English
