canonical_text:
  quote: ''
  summary: Two hymns address Agni as a bright dawn-associated deity of sacrifice.
    Agni is praised as messenger, envoy, herald, priest, lord of riches and gifts,
    and bearer of oblations. Human priests and sacrificers sing, present offerings,
    and ask Agni to bring the gods, convey sacrifice to heaven, guard against curses,
    and secure riches, propitious days, and blessings.
  language: English
  quote_policy: summarized
