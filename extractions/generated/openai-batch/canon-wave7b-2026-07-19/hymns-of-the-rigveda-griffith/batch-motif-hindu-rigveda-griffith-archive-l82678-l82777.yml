canonical_text:
  quote: ''
  summary: The passage explains ritual actions and recitations connected with sacrifice
    and the buying and procession of Soma. It describes Aditi offerings at the beginning
    and end of the sacrifice, the gods' purchase of Soma in the eastern quarter, the
    recovery of Soma's powers with eight verses, formulas spoken as Soma is brought
    forward, blessings for progeny and wealth, protection from foes and household
    harm, and a concluding Varuna prayer with a ship image.
  language: English
  quote_policy: summarized
