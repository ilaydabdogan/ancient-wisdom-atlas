canonical_text:
  quote: ''
  summary: The passage includes commentary notes on fire, sacrificial implements,
    and difficult interpretations, followed by hymnic verses to Agni. Agni is established
    as priest, envoy, herald, leader, bringer of the gods, giver of cattle and offspring,
    and a cosmic power located between Heaven and Earth. A following Agni hymn describes
    seven tones or hymns rising from a Soma-and-milk offering between Heaven and Earth,
    celestial Agni with mares and milch-cows, fire emerging from brushwood, streams
    supporting Agni, and Agni entering both worlds.
  language: English
  quote_policy: summarized
