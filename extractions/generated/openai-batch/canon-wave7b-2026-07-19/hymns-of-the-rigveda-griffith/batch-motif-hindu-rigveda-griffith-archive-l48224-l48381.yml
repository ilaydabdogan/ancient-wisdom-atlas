  summary: The passage includes a note on frogs, rains, and a possible Harivamsa echo,
    then presents a hymn of imprecations against Rakshasas, Yatudhanas, and other
    evil spirits. Indra, Soma, Agni, the Maruts, and the Gods are invoked to cast
