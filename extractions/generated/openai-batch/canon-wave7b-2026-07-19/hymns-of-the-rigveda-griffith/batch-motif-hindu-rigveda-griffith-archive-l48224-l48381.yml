    consign evildoers to serpent or Nirriti, and destroy night-wandering demons that
    threaten food, bodies, sacrifices, oblations, and worship. Later notes connect
    some stanzas with legends about Vasishtha, Rakshasas, and accusations of demonic
    identity.
