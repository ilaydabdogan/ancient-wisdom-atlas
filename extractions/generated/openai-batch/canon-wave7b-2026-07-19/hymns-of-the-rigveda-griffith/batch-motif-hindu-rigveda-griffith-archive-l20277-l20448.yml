canonical_text:
  quote: ''
  summary: The passage praises Agni as Child of Floods, infant of waters, plants,
    wood, and two mothers; describes gods attending or creating him at birth; invokes
    him through oblations as household friend, protector, herald, high priest, bearer
    of sacrifice to the gods, giver of wealth, food, cattle, sons, and strength; and
    portrays him as filling heaven and earth, moving between worlds, possessing secret
    wisdom, and appearing in varied forms such as lion or bull.
  language: English
  quote_policy: summarized
