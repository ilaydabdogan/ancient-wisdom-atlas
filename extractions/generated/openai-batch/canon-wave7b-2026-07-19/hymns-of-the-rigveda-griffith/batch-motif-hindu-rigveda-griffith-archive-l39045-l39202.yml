canonical_text:
  quote: ''
  summary: The passage includes the end of a hymn to Indra and Soma/Indu and the beginning
    of another hymn to Indra. Indra is invited to drink Soma at the sacrifice, be
    strengthened, slay Vritra and hostile foes, grant battle success, waters, seed,
    and offspring, and come with his horses and chariot. Soma/Indu is described as
    swelling for Indra, acting as a god, restraining Pani, stealing weapons, foiling
    a malignant father, wedding the Dawns to the Sun, finding concealed Amrit in heaven,
    separating heaven and earth, and placing a spring in the milch-kine. The following
    hymn praises Indra as youthful friend, guide of Turvasa and Yadu, protector, Brahman/Priest,
    treasure-holder, fort-destroyer, and giver of spoil and prize.
  language: English
