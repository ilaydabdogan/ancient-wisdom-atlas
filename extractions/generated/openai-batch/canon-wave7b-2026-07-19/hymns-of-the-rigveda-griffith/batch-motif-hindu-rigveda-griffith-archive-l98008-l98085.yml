canonical_text:
  quote: Breath entered, (the body) arose, and (breath) became the hymn.
  summary: A didactic account presents speech, sight, hearing, mind, and breath contending
    over which is the hymn. Each leaves the body; the body remains functioning without
    the other faculties, but falls and decays when breath departs. When the faculties
    re-enter, the body rises only when breath enters, so breath is declared to be
    the hymn and is affirmed by the gods.
  language: English
  quote_policy: quoted
