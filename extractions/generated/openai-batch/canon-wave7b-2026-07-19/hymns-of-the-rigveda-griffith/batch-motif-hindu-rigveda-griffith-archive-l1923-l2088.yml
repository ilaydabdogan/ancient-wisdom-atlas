canonical_text:
  quote: ''
  summary: The passage invokes Vayu, Indra, Mitra, Varuna, the Maruts, Pusan, the
    Waters, Agni, Aditi, and Savitar. Soma mixed with milk is offered for divine drinking;
    protection, wealth, victory over Vritra, healing, purification from sin, splendour,
    offspring, and long life are requested. Pusan is associated with finding the hidden
    King/Soma in a cave. The Waters are described as goddesses, mothers, healers,
    and bearers of amrit and medicines. A following hymn asks which immortal god can
    restore the speaker to Aditi so that he may see father and mother; Agni is named
    as able to do so. The supplied notes also recount the Sunahsepa legend of intended
    human sacrifice and liberation through appeals to the gods.
  language: English
  quote_policy: summarized
