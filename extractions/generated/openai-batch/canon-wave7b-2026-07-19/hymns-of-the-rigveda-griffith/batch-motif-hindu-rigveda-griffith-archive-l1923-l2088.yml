candidate_motifs:
- id: motif:1
  label: Ritual offering and divine response
  taxonomy_refs:
  - sacred_exchange
  basis: Soma, oblations, and invocations are directed to deities in connection with
    requests for aid, protection, wealth, healing, offspring, and long life.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  - ev:7
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage does not formulate an explicit contract; the exchange is inferred
    from ritual offering and requested benefits.
- id: motif:2
  label: Sacrifice and substitute victim
  taxonomy_refs:
  - sacrifice
  basis: The hymnic section mentions sacrifice and oblations, and the supplied note
    recounts a vowed first-born sacrifice and the substitution of Sunahsepa, who is
    liberated after appealing to the gods.
  evidence_refs:
  - ev:6
  - ev:12
  confidence: high
  cautions: The human-sacrifice narrative appears in the supplied explanatory note
    rather than in the translated hymn verses quoted here.
- id: motif:3
  label: Healing and purifying waters
  taxonomy_refs: []
  basis: The Waters are invoked as goddesses containing amrit, healing balm, and medicines,
    and they are asked to protect the body and remove sin, evil, lying, and false
    oath.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: No available motif-family reference exactly names healing waters, so taxonomy_refs
    are left empty.
- id: motif:4
  label: Hidden sacred substance in a cave
  taxonomy_refs: []
  basis: Pusan is said to have found the King/Soma congealed and hidden in a cave,
    and the note identifies the King as Soma.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage does not describe a theft or full recovery narrative beyond
    finding and bringing.
- id: motif:5
  label: Divine combat against a named adversary
  taxonomy_refs: []
  basis: Indra and the Maruts are invoked as allies and the gods are asked to strike
    down Vritra and prevent the wicked from ruling the worshippers.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: Although Vritra is named, the passage gives little narrative detail about
    the adversary or combat.
- id: motif:6
  label: Restoration to divine mother or cosmic source
  taxonomy_refs:
  - mother_goddess
  - divine_parent_child
  basis: The speaker asks which immortal god can restore the worshippers to mighty
    Aditi so that father and mother may be seen, and Agni is named as the restorer.
  evidence_refs:
  - ev:10
  - ev:13
  confidence: medium
  cautions: The maternal or cosmic interpretation is partly supported by the note
    on Aditi and should be reviewed against the Sanskrit context.
comparison_claims:
- id: claim:1
  claim: The supplied note compares amrit in the Waters with Greek Ambrosia as an
    immortality-conferring drink.
  claim_level: same_function
  target: Greek Ambrosia
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is made by the translator's note, not by the hymn verse
    itself, and only the shared function as immortality-conferring nectar is stated.
- id: claim:2
  claim: The supplied note connects the hidden cave reference with a nearby Rigvedic
    motif, the flight of Agni in Rigveda III.9.4.
  claim_level: same_motif
  target: Rigveda III.9.4, flight of Agni
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The referred passage is not included here, so the claim rests only
    on the note's cross-reference.
