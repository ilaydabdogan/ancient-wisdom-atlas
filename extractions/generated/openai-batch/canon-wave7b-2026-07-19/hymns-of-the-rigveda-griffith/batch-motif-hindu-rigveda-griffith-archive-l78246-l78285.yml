canonical_text:
  quote: ''
  summary: The passage invokes Indra to drink Soma from an old cup and accept libations,
    recalls his old deed of loosening the mountain so the Brahman found cattle, asks
    him to fight and grant riches, and then praises his Soma-strengthened might, his
    combat with Vritra the Dragon, his cleaving of rock to release streams, his establishing
    of heaven’s vault, his separation of heaven and earth, and his hurling of the
    iron thunderbolt.
