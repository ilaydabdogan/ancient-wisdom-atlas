canonical_text:
  quote: "“The Stones press out the Soma”"
  summary: The passage closes a hymn to the Soma-pressing Stones, asking them to drive
    away demons and Nirriti, produce Soma, bring food, riches, and hero sons, and
    assign treasure to gods and worshippers. It then presents hymns to the Maruts,
    describing them as a worshipful company associated with cloud, rain, brilliance,
    chariots, storm movement, protection, punishment of wicked men, divine lineage,
    and benefits for the worshipper who offers oblation.
  language: English
  quote_policy: quoted
