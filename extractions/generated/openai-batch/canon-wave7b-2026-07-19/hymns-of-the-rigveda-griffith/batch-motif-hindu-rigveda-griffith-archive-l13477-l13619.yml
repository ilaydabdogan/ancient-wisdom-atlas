  summary: The passage praises Heaven and Earth as a divine parent pair, world-halves,
    and sustainers of creatures; describes cosmic measuring, weaving, pillars, the
    Sun’s travel between them, and milk drawn from cow and bull; then narrates the
    Ribhus receiving Agni’s message to turn one chalice into four, perform creative
