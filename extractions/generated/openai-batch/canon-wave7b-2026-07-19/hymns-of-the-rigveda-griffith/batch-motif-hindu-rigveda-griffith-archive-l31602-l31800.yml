canonical_text:
  quote: ''
  summary: 'The passage praises Indra through remembered heroic deeds: he slays the
    Dragon or Vritra with the thunderbolt, releases or recovers the waters, finds
    cattle, sunders and supports heaven and earth, receives Soma, demolishes castles,
    defeats named enemies, interacts with solar imagery, and is praised by gods, Maruts,
    priests, and singers. Hymn 30 continues by seeking Indra, recounting his birth,
    warfare, rock-cleaving, recovery of the Milch-kine, conquest of floods, and defeat
    of Namuchi.'
