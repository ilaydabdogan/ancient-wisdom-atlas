canonical_text:
  quote: ''
  summary: The passage contains Soma Pavamana verses in which Soma/Indu is pressed,
    purified, filtered, mixed with waters and milk, sent to bowls and deities, and
    invoked to grant riches, offspring, cattle, horses, wisdom, victory, and battle
    spoil. The passage also includes notes on uncertain place names, filters, and
    Soma’s relation to Earth’s vegetal forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speakers ask Soma/Indu to pour meath and treasure, send a hero son and
    good fortune, be sweet to Indra when cleansed, and pour riches from the ocean.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pressed Soma is described as flowing like an impetuous courser and a downward
    flood, settling in a wooden dwelling, and flowing with milk and waters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Soma is directed to flow to bowls and saucers for Indra while being described
    as chariot-borne, sun-bright, potent, and purified.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Soma is said to pervade his Daughter’s forms, find a threefold refuge in the
    waters, and go singing like a priest to assemblies.
  category: action
  evidence_refs:
  - ev:3
  - ev:13
- id: obs:5
  text: Soma is directed to flow to Vayu, Varuna, Mitra, and Indra, who is called
    mighty and thunder-wielding.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The speakers request garments, milch-kine, chariot-drawing horses, celestial
    riches, possessions, and Rishihood from purified Soma.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Purified Soma is directed toward a yellow lake and a famed ford; the passage
