canonical_text:
  quote: "“What pathway leadeth to the Gods? Who knoweth this of a truth”"
  summary: The passage asks about the path to the gods and their hidden regions, describes
    Heaven and Earth as parted yet paired in the seat of Order, refers to a One All
    governing fixed and moving creation, and invokes many deities for safety, wealth,
    offspring, rain, a soft path, protection, and victory.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker asks what pathway leads to the gods and says that only their lowest
    dwelling-places are seen while the gods are in remote and secret regions.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: An editorial note identifies the “lowest dwelling-places” as constellations
    and frames the higher divine realms as mysterious.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Sage who looks on mankind sees Heaven and Earth bedewed and rejoicing in
    the seat of Order, according to the verse and its note.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Heaven and Earth are described as parted partners standing on one firm place,
    watchful, young forever, and like sisters speaking united names.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Heaven and Earth part and keep living things asunder, bear up the mighty gods,
    and do not reel.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A “One All” is called lord of fixed and moving things, including what walks,
    flies, and the multiform creation.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker ponders ancient kinship with a mighty Sire and Father and then
    addresses Heaven and Earth and deities whose tongue is Agni.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Savitar is called fair-tongued and golden-handed, comes thrice from heaven
    as lord in the assembly, and is asked to carry praise to the gods and send complete
    safety.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tvashtar is asked to give helpful things; the Ribhus with Pushan are said
    to have prepared the rite with adjusted stones.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Maruts are described as spear-armed, nimble youths of heaven, sons of
    Order, borne on a flashing car; they and Sarasvati are asked to hear and grant
    wealth with noble offspring.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Vishnu is addressed as rich in marvels and as chieftain of the mighty stride;
    his many young Mothers are said not to disregard him.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: Indra is described as filling earth and heaven with majesty, ruling through
    heroic powers, and bearing titles including Fort-crusher and Vritra-slayer; he
    is asked to bring cattle.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Nasatyas or Asvins are called sires, kin, givers of riches, and guardians
    of their gift.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:14
  text: All deities are said to abide in Indra, and the invoked figure is asked with
    the Ribhus to fashion the hymn for the speaker’s advantage.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:15
  text: Aryaman and Aditi are named as deserving worship, Varuna’s laws are described
    as unbroken, and the deities are asked to remove childlessness and provide kine
    and offspring.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:16
  text: The gods’ envoy is asked to proclaim the speakers sinless for safety; Earth,
    Heaven, the Sun, the Waters, the firmament, and the constellations are asked to
    hear.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:17
  text: Mountains are asked to hear; they are described as distilling raindrops, resting
    firm, and rejoicing in freshening moisture.
  category: action
  evidence_refs:
  - ev:15
- id: obs:18
  text: The path is asked to be soft and well-provisioned; herbs are to be besprinkled
    with pleasant meath; Agni is asked for friendship, strength, glory, victory over
    foes, and daily loving-kindness.
  category: speech
  evidence_refs:
  - ev:16
