candidate_motifs:
- id: motif:1
  label: hidden pathway to remote divine realms
  taxonomy_refs:
  - ascent
  - mystical_quest
  - wisdom
  basis: The speaker asks who truly knows the pathway to the gods and says the gods’
    higher regions are remote and secret.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage poses a question about access and knowledge; it does not narrate
    an actual ascent or journey.
- id: motif:2
  label: paired Heaven and Earth as separated cosmic partners
  taxonomy_refs:
  - duality
  basis: Heaven and Earth are described as parted yet partnered, standing watchfully,
    likened to sisters, and bearing the gods without reeling.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage emphasizes pairing and separation but does not narrate a full
    cosmogonic separation event.
- id: motif:3
  label: primordial One governing multiform creation
  taxonomy_refs: []
  basis: The verse names a One All as lord of fixed and moving things, and the note
    interprets it as a primordial unity or substance from which the universe developed.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The explanatory note expands the philosophical interpretation; the verse
    itself is concise.
- id: motif:4
  label: sacred exchange through praise, rite, and offering
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The passage repeatedly offers praise and invokes deities to hear, bear the
    song, enjoy the offering, prepare the rite, and grant safety, wealth, offspring,
    and victory.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:16
  confidence: high
  cautions: The exchange is hymnic and ritual-petitionary rather than a narrated bargain.
- id: motif:5
  label: divine benefactors granting cattle, offspring, and removal of childlessness
  taxonomy_refs: []
  basis: The Maruts, Indra, Asvins, Aryaman, Aditi, and other powers are asked for
    wealth, cattle, kine, offspring, guarded riches, and the removal of childlessness.
  evidence_refs:
  - ev:8
  - ev:10
  - ev:11
  - ev:13
  confidence: high
  cautions: This is a prayer motif in the passage; no birth story or miraculous child
    narrative is given.
- id: motif:6
  label: divine warrior overcoming foes and securing wealth
  taxonomy_refs: []
  basis: Indra is titled Fort-crusher and Vritra-slayer and asked to bring cattle;
    Agni is asked to conquer foemen in battle.
