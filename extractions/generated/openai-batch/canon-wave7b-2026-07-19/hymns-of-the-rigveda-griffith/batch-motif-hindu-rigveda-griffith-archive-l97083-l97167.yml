  summary: The passage gives liturgical-exegetical correspondences for ritual elements.
    Food is linked with strength, and the sudadohas verse is identified with breath,
    which joins together all joints. A right wing is identified with this world, Agni,
    speech, the Rathantara, Vasistha, and a hundred; a left wing is identified with
    that world, the sun, mind, the Brhat, Bharadvaja, and a hundred. The sampata hymn
    is said to win desires and firmness, and the pankti verse to serve proper food.
    Notes explain some identifications and verse counts.
