canonical_text:
  quote: ''
  summary: 'The passage first describes personified Soma-pressing stones: they drink
    Soma, act in sacrifice, strengthen Indra, are described as enduring, and are linked
    by a note to mountains as their fathers. It then begins Hymn 95, a dialogue between
    Pururavas and Urvasi, with translator commentary summarizing the larger legend
    of a mortal king and a heavenly nymph whose union depends on conditions broken
    through Gandharva intervention, after which Urvasi vanishes. The hymn stanzas
    include appeals, departure imagery, lightning, heavenly nymphs, Rivers nurturing
    Pururavas, and gods empowering him for battle.'
  language: English
  quote_policy: summarized
