canonical_text:
  quote: ''
  summary: The passage presents an Upanisadic teaching on the Samhita text through
    correspondences of former half, latter half, and their union. Teachers map these
    to earth and heaven joined by air, ether, or rain, and to speech and mind joined
    by breath or truth. A compact of mind, speech, and breath is compared to a chariot
    with three horses. Knowledge of this union is said to bring children, cattle,
    fame, glory, the world of heaven, and full length of life. Sakalya’s teaching
    names Parjanya as the uniter when rain joins earth and sky.
  language: English
  quote_policy: summarized
