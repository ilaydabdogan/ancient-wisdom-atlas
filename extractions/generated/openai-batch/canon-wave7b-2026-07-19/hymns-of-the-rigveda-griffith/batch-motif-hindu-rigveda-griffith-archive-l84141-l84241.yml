canonical_text:
  quote: ''
  summary: The passage gives ritual explanations for parts of the animal and Soma
    sacrifice. The gods protect their sacrifice from Asuras with Agni-made citadels,
    a precedent for carrying fire around the sacrifice. The victim is led with a torch
    as the sacrificer’s essence toward heaven. Cakes, rice, barley, omentum, fat,
    ghee, drops, and offerings to Agni and the All-gods are explained as completing
    the victim, delighting deities, and connecting sacrifice with heaven and rain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The gods perform a sacrifice, and the Asuras come intending to disturb it
    and attack the sacrificial post from the east.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gods place around themselves and the sacrifice three Agni-made forts or
    citadels; these shine and blaze, and the Asuras flee while the Asuras and Raksases
    are smitten away with Agni before and behind.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Later sacrificers carry fire around the sacrifice as a way of placing three
    Agni-made forts around the sacrifice and themselves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The victim is led north after the Apris have been said and fire has been carried
    around it; a torch is carried before it, with the stated explanation that the
    victim is the sacrificer in essence and that the sacrificer goes to heaven with
    light before him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Before the victim is killed, the Adhvaryu throws strew below; a hole is dug
    for the offal, and the offal is connected with plants and the earth that supports
    plants.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A cake is offered at the animal sacrifice to make up for animal parts and
    saps that go away; the saps are said to become rice and barley.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The omentum is brought up, covered with butter, and associated drops are treated
    as connected with all the deities so that they do not go to the gods undelighted.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Agni is addressed as the Hotr of the gods, as the mouth in which oblations
    are offered, and as a recipient of drops of fat and ghee.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: A formula says that drops fall on the skin for Agni to taste among the gods;
    the passage connects the dropping of sacrificial drops with rain falling divided
    into drops.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The gods are said to have gone to the world of heaven by sacrifice, zeal,
    fervour, and libations; after the omentum was offered, heaven was discerned and
    they went aloft.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Men and seers come to the gods’ place of sacrifice, find the victim without
    entrails, perceive the victim to be as much as the omentum, and cook and offer
    it at the third pressing so that the sacrifice may have many libations and a whole
    victim.
  category: sequence
  evidence_refs:
  - ev:8
