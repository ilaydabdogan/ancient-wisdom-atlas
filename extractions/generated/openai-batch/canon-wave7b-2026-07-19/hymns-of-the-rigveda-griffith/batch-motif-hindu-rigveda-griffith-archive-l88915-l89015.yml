  summary: The passage gives ritual directions for a Soma-sacrifice context, especially
    the sixth day. It discusses correct use of directions and the vasat call, metrical
    insertions by Parucchepa, Indra's ascent of seven heavenly worlds by a mounting
    metre, the relation of Padas to ritual days, a conflict between gods and Asuras
    over the worlds with wealth cast into and recovered from the sea, and an explicit
    catalogue of items called symbols of the sixth day.
