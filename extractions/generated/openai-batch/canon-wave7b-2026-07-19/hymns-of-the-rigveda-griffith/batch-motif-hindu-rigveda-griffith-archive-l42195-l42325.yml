canonical_text:
  quote: ''
  summary: The passage contains invocations for deified doors, Morning and Night,
    ritual bards, goddesses including Bharati, Sarasvati and Rivers, Tvashtar, the
    Lord of Forests, Agni, Indra, Aditi, and other gods to come to the sacrificial
    grass and receive offerings. A hymn to Agni presents him as sacrificial envoy,
    flame-crowned purifier, newly born bull, messenger to the gods, guest in his dwelling,
    shining like gold and the sun, and protector of worshippers. It describes Agni’s
    flames, smoke, path, jaws, tongue, and ritual kindling, with notes explaining
    sacrificial doors, fire-sticks as parents, and forest imagery.
  language: English
  quote_policy: summarized
