canonical_text:
  quote: ''
  summary: 'The passage includes notes and verses invoking the Asvins for protection,
    describing their shared brotherhood, chariot, steeds, and association with Dawn,
    fire, and an obscure breaking of a black band or fort. It then gives Hymns LXIII
    and LXIV to Agni: Agni is praised as friend, guest, oblation-bearer, herald, charioteer,
    lord of wealth and spoil, helper in battle, and aid in cattle recovery. The passage
    also mentions human patrons, horse gifts, a sacred feast, the river Parushni and
    Waters, and a comparison to flying steeds that brought Tugra''s son Bhujyu.'
  language: English
  quote_policy: summarized
