canonical_text:
  quote: ''
  summary: The passage says that created deities fall into a great ocean and are affected
    by hunger and thirst. They ask for a place where they may rest and eat food. A
    cow and a horse are presented but rejected as insufficient; man is presented and
    accepted. The deities are then told to enter according to their places, and cosmic
    powers become bodily faculties and enter human organs. Hunger and thirst ask for
    a place and are assigned to the deities as sharers in offerings.
  language: English
  quote_policy: summarized
