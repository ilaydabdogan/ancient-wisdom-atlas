canonical_text:
  quote: ''
  summary: The passage contains praise of the Maruts as powerful, loud, armed divine
    beings who travel with fire, battle, spears, lightning, coursers, cars, ornaments,
    and chariots. Their coming shakes mountains and heaven, frightens creatures, and
    is also invoked for protection, wealth, food, offspring, and ritual success. Indra
    is invoked for thousandfold help and wealth, and the Maruts are said to be joined
    with him. The passage also introduces a hymn to Indra and the Maruts in which
    the Maruts approach from heaven, and female figures named Vak and Rodasi are described
    among or with them, with Rodasi following and mounting a chariot.
  language: English
  quote_policy: summarized
