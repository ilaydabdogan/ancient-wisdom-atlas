canonical_text:
  quote: ''
  summary: In this passage Indra speaks in self-praise. He claims to have won cattle,
    horses, kine, and gold with his bolt, to grant wealth to worshippers when Soma
    and hymns please him, and to be unconquered by death. He describes striking challengers
    and enemies, aiding favored figures such as Atithigva, Kavi, Kutsa, Srutarvan,
    Ayu, and Savya, and overcoming named foes including Karanja, Parnaya, Atka, Sushna,
    Mrigaya, Vesa, Padgribhi, Navavastva, Dasa and Dasyu enemies. The notes identify
    related obscure references including Atharvan, fire, the Dragon Ahi or Vritra,
    waters, Dadhyach’s bone, the Moon, and Vritra. The following hymn continues Indra’s
    claims that sacrifice and hymns strengthen him, that the heavenly, watery, and
    earthly peoples established him among the gods, and that he rides with horses
    and a thunderbolt to repel enemies when libation summons him.
  language: English
  quote_policy: summarized
