  summary: The passage contains Visvakarman hymnic material about the making of earth
    and heaven, questions about the support and material of creation, sacrificial
    invocation, a primeval germ received by the waters and resting on the Unborn's
    navel, and the difficulty of finding the producer of creatures. It then begins
