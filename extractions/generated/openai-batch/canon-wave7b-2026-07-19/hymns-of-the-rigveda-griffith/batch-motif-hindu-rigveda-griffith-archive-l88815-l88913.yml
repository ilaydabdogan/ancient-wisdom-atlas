  quote: ''
  summary: The passage explains ritual selections for the fifth and sixth days of
    a Soma-sacrifice sequence. It links chants, metres, words, additions, cattle imagery,
    pressed drink, oblation, seasons, and speech to day-specific symbolic functions.
    It also states that Indra became great through the Mahanamni verses, that Prajapati
    created the worlds and had power, and that the sixth day is a field of the gods
    where priests order sacrifices to the seasons.
