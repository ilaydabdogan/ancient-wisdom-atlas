canonical_text:
  quote: ''
  summary: 'The passage gives ritual instructions for a king or Ksatriya sacrificer
    in a Soma-related rite: fruits are divided and pressed, the sacrificer''s goblet
    is filled and handled with the other goblets, Darbha shoots are thrown within
    the altar after ritual calls, Soma is partaken with formulas, self-touching is
    said to prolong life, the fathers are made immortal sharers in the pressings,
    and named figures or kings are cited as transmitters or beneficiaries of the food
    who attained greatness and tribute.'
