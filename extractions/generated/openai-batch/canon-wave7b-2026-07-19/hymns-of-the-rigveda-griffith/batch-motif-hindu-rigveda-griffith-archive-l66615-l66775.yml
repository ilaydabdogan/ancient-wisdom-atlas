canonical_text:
  quote: ''
  summary: Book 10 opens with hymns to Agni. Agni is described as rising before dawn
    with light from darkness, born as a child of Earth and Heaven, nourished by Mothers
    or plants, and serving as priest, envoy, and messenger between gods and mortals.
    The passage also presents Agni as regulator of sacrifice, protector through a
    manifested Vishnu, divine creation of Heaven, Earth, Waters, and Tvashtar, and
    companion of Dawn who overcomes Night.
