canonical_text:
  quote: ''
  summary: The passage explains first-day Soma-sacrifice recitations and treats selected
    words in hymns as symbols of the first day. It says Tarksya and other recitations
    secure safety and safe passage to the other side of the year. It recounts that
    Vamadeva saw worlds and flew up with the Sampatas, whose repetition helps attain
    the world of heaven. It also explains that a hymn to the Rbhus keeps sacrificers
    in this world, that year-session and twelve-day performers are undertaking a long
    journey, and that All-gods and Jatavedas recitations secure safety. The Agnimaruta
    is said to be the same as in the Agnistoma, allowing offspring to breathe together.
  language: English
  quote_policy: summarized
