- id: motif:2
  label: Soma sacrifice empowers the deity and frames reciprocal aid
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Soma is offered and drunk by Indra, who then whets his thunderbolt and defeats
    enemies; Indra is also asked to bring goods as reward for Soma juice.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:10
  confidence: high
  cautions: The passage is hymnic petition rather than a narrative contract; reciprocity
    is inferred from offering and requested aid within the same hymn context.
