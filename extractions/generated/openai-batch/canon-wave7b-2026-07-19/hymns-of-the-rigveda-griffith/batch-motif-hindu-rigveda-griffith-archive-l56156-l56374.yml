canonical_text:
  quote: ''
  summary: The passage includes petitions to Agni for protection, battle-aid, cattle,
    and wealth; hymns to Indra as Marut-girt warrior, Vritra-slayer, Soma-drinker,
    and giver of goods; a birth scene in which Satakratu asks his mother about enemies
    to overthrow; accounts of Indra using thunderbolt, shaft, bow, and arrow; Indra
    releasing waters, piercing a Gandharva, gaining food, and slaying a ravening boar;
    and requests that Indra bring cattle, ornaments, steeds, and gold rings.
  language: English
  quote_policy: summarized
