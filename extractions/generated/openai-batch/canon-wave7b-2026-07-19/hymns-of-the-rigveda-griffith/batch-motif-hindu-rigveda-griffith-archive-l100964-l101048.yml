  summary: 'The passage includes a note on the Atman as subject rather than object,
    an analogy between a divine or human lute and the human body/speech, a speech
    verse invoking a she-ichneumon for eloquence, and a Brahmana in which Krsnaharita
    speaks of Prajapati as the year: after creating creatures, Prajapati bursts and
    is put together again by metres, with Samhita letters linked to strength and breath.'
