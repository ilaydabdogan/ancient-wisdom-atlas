  summary: The passage includes portions of Rigveda hymns in Griffith’s English translation.
    It describes ritual metres joined with deities, knowledge raising men to Rishis,
    ancient ritual predecessors, invocations to Indra for protection, the Asvins aiding
    Indra against Namuchi, Mitra and Varuna supporting worshippers, Aditi purified
    with water and heavenly light, and Indra destroying the Dragon and sending rivers
    to earth.
