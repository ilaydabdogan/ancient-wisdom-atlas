canonical_text:
  quote: '"What was the tree, what wood, in sooth, produced it, from which they fashioned
    forth the Earth and Heaven?"'
  summary: The passage contains Water and Soma ritual verses followed by Hymn XXXI
    to the Visvedevas. The Waters are addressed as wealthy, treasure-controlling powers
    who carry milk, meath, butter, and Soma to Indra; Adhvaryus seat them on holy
    grass and press Soma. The hymn then asks for divine blessing, speaks of Order
    and Immortals, names Savitar, Bhaga Aryaman, and a Bull who supports Heaven and
    Earth, and presents obscure cosmological images of tree or wood used for Earth
    and Heaven, Agni or fire in wood, a barren cow that calves, and Earth casting
    up the Sami.
  language: English
  quote_policy: quoted
