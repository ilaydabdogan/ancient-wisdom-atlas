canonical_text:
  quote: ''
  summary: 'Notes and hymnic verses describe Soma offerings, invocations to the Asvins,
    Indra, Agni, and other deities, and several deeds of the Ribhus: gaining immortality
    after sacrificial service, making a single chalice fourfold, crafting a car and
    horses, restoring their aged parents to youth, and producing or restoring a cow
    with its calf. A following Asvins hymn invokes divine aids for battle, holy acts,
    milk from a barren cow, and triple lore.'
  language: English
  quote_policy: summarized
