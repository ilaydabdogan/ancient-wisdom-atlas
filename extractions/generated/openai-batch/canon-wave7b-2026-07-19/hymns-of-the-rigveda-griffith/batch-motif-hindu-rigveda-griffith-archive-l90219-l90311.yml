canonical_text:
  quote: ''
  summary: Prajapati desires propagation, practices fervour, and creates the three
    worlds. Through successive brooding, luminaries, Vedas, pure exclamations, letters,
    and Om arise. Prajapati extends and hands over the sacrifice to the gods. The
    gods ask how errors in sacrifice are expiated, and Prajapati prescribes offerings
    with bhih, bhuvah, and svar on specified altars. The text explains these exclamations
    as fastenings that mend the sacrifice. A later section discusses the Brahman priest’s
    office, the two paths of sacrifice as speech and mind, the need for priestly silence,
    and the priestly fees, ending with the statement that the Brahman is the physician.
  language: English
  quote_policy: summarized
