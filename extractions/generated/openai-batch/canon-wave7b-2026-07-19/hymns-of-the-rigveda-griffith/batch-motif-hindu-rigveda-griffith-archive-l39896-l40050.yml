canonical_text:
  quote: ''
  summary: The passage contains Rigvedic invocations and translator notes. Heaven
    and Earth, the Maruts, Indra, Waters, Savitar, Agni, the Nasatyas, and other deities
    are called to provide shelter, protection, healing, wealth, food, and ritual aid.
    A prior deliverance of Atri from darkness is invoked as precedent. Aja-Ekapad
    and Ahibudhnya are summoned with Earth and Ocean; Ahibudhnya is explained in a
    note as a Dragon of the Deep. The passage also opens a following hymn with the
    rising solar eye of Varuna and Mitra, identified in a note as the Sun.
  language: English
  quote_policy: summarized
