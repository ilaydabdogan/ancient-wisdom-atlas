canonical_text:
  quote: "“They are ships which carry over to the world of heaven; verily with these
    (verses) they cross to the world of heaven.”"
  summary: 'The passage explains ritual chants and pressings through a mythic precedent:
    the gods defended their sacrifice from Asuras and Raksases by stationing deities
    at different parts and directions of the sacrifice. The ordered rite enables victory
    over hostile powers and conquest of the world of heaven. It also explains strophe-antistrophe
    practice and describes certain commencing verses as ships that carry practitioners
    to heaven.'
  language: English
  quote_policy: quoted
