- id: motif:2
  label: Ritual praise exchanged for wealth, strength, protection, and streams
  taxonomy_refs:
  - sacred_exchange
  basis: Worship, gifts, prayers, and hymns are linked with requests for wealth, strength,
    completion of sacrifice, victory, shelter, riches, and streams.
  evidence_refs:
  - ev:1
  - ev:6
  - ev:7
