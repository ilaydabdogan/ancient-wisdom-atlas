- id: motif:3
  label: Divine wisdom and hidden knowledge
  taxonomy_refs:
  - wisdom
  basis: Agni knows divine origins and human mysteries and cherishes wisdom; Varuna
    knows hidden names and cherishes wisdom, and a verse says wisdom is centred like
    a nave in a wheel.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:21
  - ev:22
  confidence: high
  cautions: The passage does not present a quest for wisdom; wisdom is an attribute
    of deities or sacred figures.
- id: motif:4
  label: Divine combat against obstructing enemies
  taxonomy_refs:
  - chaos
  basis: Indra-Agni are invoked as conquerors; the Dasa’s might is to be torn apart;
    rivers are released; Sushna’s brood is demolished and heavenly streams are won.
  evidence_refs:
