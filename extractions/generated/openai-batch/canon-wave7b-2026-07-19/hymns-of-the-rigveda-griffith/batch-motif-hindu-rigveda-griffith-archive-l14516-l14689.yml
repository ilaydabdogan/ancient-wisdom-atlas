canonical_text:
  quote: ''
  summary: The passage invokes Sarasvati as a nourishing wealth-giver, describes sacrifice
    as an early divine ordinance by which gods reached heaven, presents recurring
    waters, clouds, fires, rain, and a celestial bird/Sarasvan, and gives a dialogue
    in which Indra and the Maruts dispute and then affirm Indra’s slaying of Vritra/the
    Dragon and the making of waters for humans.
  language: English
  quote_policy: summarized
