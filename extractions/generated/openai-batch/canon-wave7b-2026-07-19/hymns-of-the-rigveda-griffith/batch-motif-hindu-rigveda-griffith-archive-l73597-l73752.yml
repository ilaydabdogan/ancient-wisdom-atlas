canonical_text:
  quote: ''
  summary: The passage includes a cosmogonic sequence in which gods stand together,
    raise dust like dancers, cause beings to grow, and bring a hidden figure from
    the sea. It then describes Aditi's eight sons, including Martanda, whom she casts
    away and later brings to life and death again. A following hymn presents Indra's
    powerful birth, strengthening by the Maruts, conflicts with Dasyu and Namuchi,
    removal of darkness, creation of paths for humans, and imagery of waters, trees,
    an udder over earth, and milk poured into cattle and plants.
  language: English
  quote_policy: summarized
