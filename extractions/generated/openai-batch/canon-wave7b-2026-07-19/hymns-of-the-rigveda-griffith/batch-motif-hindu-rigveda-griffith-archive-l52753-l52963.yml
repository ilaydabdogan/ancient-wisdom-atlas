canonical_text:
  quote: ''
  summary: The passage praises and summons Indra with bull imagery, Bay horses, chariot,
    Soma pressing, libations, and requests for aid, wealth, cattle, and horses. A
    difficult closing section includes a note about Asanga, son of Playoga, being
    changed to a woman by divine imprecation and later restored. Hymn XXXIV summons
    Indra with his Bays from heaven and cosmic regions, using Soma-stone imagery and
    recounting horse-gifts from Vasurochis/Paravata. Hymn XXXV invokes the Asvins
    together with many deities and cosmic powers, asking them to drink Soma, accept
    sacrifice and libations, and bring strengthening food.
