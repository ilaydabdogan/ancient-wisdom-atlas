canonical_text:
  quote: ''
  summary: A prose ritual passage explains the Praiiga/Pratiga within the Soma sacrifice
    as a litany of cups and breaths. It assigns triplet recitations to named deities
    and deity-groups, connects those recitations with food, bodily faculties, and
    speech, and describes how confused recitation or omission can deprive a man of
    specific faculties.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage states that the Praiiga is a litany of cups: nine cups are drawn
    in the morning, and a tenth is drawn after the Stoma has been performed.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Triplets are recited to Vayu, Indra and Vayu, Mitra and Varuna, the Agvins/Acvins,
    Indra, the All-gods, and Sarasvati; the passage says Sarasvati has no cup because
    Sarasvati is speech.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that by the Praiiga one wins proper food, and that different
    deities and litanies correspond to different foods placed in the cups.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Praiiga is described as closely related to the sacrificer's self, and
    the Hotr is said to make the sacrificer perfect by it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Specific recitations are linked with perfecting bodily faculties: breath,
