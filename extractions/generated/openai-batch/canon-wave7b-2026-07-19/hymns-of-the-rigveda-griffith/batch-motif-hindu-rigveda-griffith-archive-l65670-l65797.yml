canonical_text:
  quote: ''
  summary: A sequence of Soma Pavamana verses describes Soma juice being protected
    from dogs and Rakshasas, pressed, filtered through hides, wool, and sieves, blended
    with milk, curds, oil, and streams, and directed toward Indra and sacrificial
    vessels. Soma is personified as Friend, Hero, Child, Babe, Tawny Steer, Sage,
    and ordering Priest, associated with Trita, seven lights of sacrifice, the Seven
    Mothers/Rivers, Heaven and Earth, deities, and Rishis singing in a sevenfold choir.
  language: English
  quote_policy: summarized
