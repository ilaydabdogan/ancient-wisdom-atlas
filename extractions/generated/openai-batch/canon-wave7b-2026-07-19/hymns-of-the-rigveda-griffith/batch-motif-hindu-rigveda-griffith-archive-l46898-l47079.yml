canonical_text:
  quote: ''
  summary: The passage asks Dawn/Ushas for bounty, nourishment, fame, cattle-strength,
    and the removal of foes. It then invokes Indra and Varuna for protection, victory
    in battle, wealth, friendship, and shelter. The hymns praise the pair as sovereign
    powers who release waters, bring forth the Sun, create creatures, hear prayers,
    protect sacrificers, and aid Sudas and the Tritsus against hostile forces including
    the Ten Kings. The closing portion turns Indra and Varuna toward sacrifice, describes
    the sacrificial ladle, and mentions Varuna’s bonds, Varuna’s displeasure, and
    Indra’s gift of spacious dwelling.
  language: English
  quote_policy: summarized
