candidate_motifs:
- id: motif:1
  label: sacrifice and praise exchanged for divine protection and gifts
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: The passage repeatedly joins sacrifice, hymn, homage, prayer, and invocation
    with requests for bounty, protection, friendship, victory, shelter, and safety.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:6
  - ev:7
  - ev:13
  confidence: high
  cautions: The passage frames requests and divine favor liturgically; it does not
    narrate a single completed transaction in all cases.
- id: motif:2
  label: divine patrons grant victory to a ruler and his people
  taxonomy_refs:
  - royal_legitimacy
  basis: Indra and Varuna are said to aid Sudas and the Tritsus against enemies including
    Bheda and the Ten Kings, hearing prayers amid war and making the gods be on the
    worshippers’ side.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  - ev:14
  confidence: high
  cautions: The royal status of Sudas is supported by the embedded note; the verse
    excerpt itself mainly names him as the aided battle figure.
- id: motif:3
  label: paired deities with differentiated powers
  taxonomy_refs:
  - duality
  basis: Indra and Varuna are addressed together as Twain and kings, but one is associated
    with destructive battle action while the other maintains holy laws; one is called
    Monarch and one Autocrat.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:12
  - ev:13
  confidence: high
  cautions: The English translation and notes help distinguish the functions; the
    passage’s wording sometimes uses 'one' and 'the other' without always restating
    the name.
- id: motif:4
  label: release of waters and making dry places stream
  taxonomy_refs: []
  basis: Indra and Varuna are said to pierce fountains of floods and make dry places
    stream.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not explicitly frame this as a flood-renewal narrative;
    it is a praised divine deed.
- id: motif:5
  label: divine law, bonds, and averted displeasure
  taxonomy_refs:
  - divine_judgment
  basis: Varuna is linked with maintaining holy laws, binding with non-rope bonds,
    and displeasure that the speaker asks to keep far away.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: medium
  cautions: The passage mentions law, bonds, and displeasure, but does not present
    a formal judgment scene.
- id: motif:6
  label: dawn as giver of prosperity and remover of foes
  taxonomy_refs: []
  basis: Dawn/Ushas is asked to bring bounty, nourishment, opulence, fame, cattle-strength,
    and to dawn away foes.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: Only the final portion of the Dawn hymn is included in this line range.
