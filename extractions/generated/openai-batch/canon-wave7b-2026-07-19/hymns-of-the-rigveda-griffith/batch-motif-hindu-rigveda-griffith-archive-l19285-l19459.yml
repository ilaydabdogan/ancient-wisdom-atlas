  quote: ''
  summary: The passage invokes the Maruts/Rudras to come to libations, accept songs
    and offerings, grant food, steeds, wisdom, wealth, rain, and protection from foes.
    It recalls their relation to Prishni’s udder/cloud and sacrifice. A following
    hymn addresses the Son of Waters/Floods’ Child, surrounded and nourished by waters
    and goddesses, shining in the waters, and described as producing all existing
    things.
