canonical_text:
  quote: ''
  summary: The passage contains the close of a hymn to Dawn, a hymn to Rudra, and
    the opening of a hymn to the Sun. Dawn is praised as a law-protecting goddess
    who dispels darkness, awakens life, leaves a path for the Sun, and brings offspring,
    cattle, horses, and wealth to worshippers. Rudra is invoked with praise and offerings
    as a powerful, braided-haired, red, healing yet dangerous deity, asked to protect
    humans, cattle, progeny, and heroes and to keep his destructive dart away. The
    Sun is described as the divine eye and soul of all things, following Dawn and
    moving through sky, earth, and heaven with bay-colored horses while Night spreads
    her garment after his horses are loosed.
  language: English
  quote_policy: summarized
