  summary: The passage petitions Mitra-Varuna and Sindhu, praises gifts, libations,
    sacrificial offerings, and divine bounty, then turns to a Dawn hymn in which the
    goddess emerges from darkness, brings light to human homes, reveals treasures,
    and participates in the recurring alternation of day and night under Varuna's
    statute.
