candidate_motifs:
- id: motif:1
  label: Hidden cows or rays released from mountain or stall
  taxonomy_refs:
  - sacred_theft
  basis: The hymn speaks of opening the mountain, stable portals, and Cow’s stall;
    Sarama finds the cattle; and the note identifies the mountain as a cloud concealing
    stolen cows or vanished rays.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:6
  - ev:7
  confidence: medium
  cautions: The theft or concealment is stated in the translator’s note rather than
    narrated in full in the verse excerpt.
- id: motif:2
  label: Waters released or gained through hymn and divine action
  taxonomy_refs: []
  basis: The mountain parts for the birth of mighty waters; the wandering merchant
    gains heaven’s water; floods descend; and a hymn is laid upon the Floods for protection.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:8
  - ev:10
  confidence: high
  cautions: The passage links water-release with several images but does not provide
    a single continuous narrative.
- id: motif:3
  label: Ritual praise and sacrifice securing divine aid
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: Indra, Agni, Maruts, and a large group of gods and powers are invoked for
    favour, help, protection, joy, and wealth; sages are described as skilled in sacrificing.
  evidence_refs:
  - ev:3
  - ev:10
  - ev:12
  confidence: high
  cautions: This is a broad hymn pattern rather than a specific narrative episode.
- id: motif:4
  label: Falcon brings or reaches heavenly Soma
  taxonomy_refs: []
  basis: The rapid Falcon swoops down on Soma, and the note explains that the Falcon
    brought Soma from heaven.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage says the Falcon brought Soma from heaven but does not describe
    the act as theft here.
- id: motif:5
  label: Solar journey across a shining ocean
  taxonomy_refs:
  - ascent
  basis: Surya is carried by seven coursers on a long journey, yokes tawny horses,
    mounts the shining ocean, and is drawn like a ship through water.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The imagery is clearly journey-oriented, but the available taxonomy term
    'ascent' is only approximate.
- id: motif:6
  label: Self-binding to a guided sacred path
  taxonomy_refs:
  - mystical_quest
  basis: The speaker says he is bound horse-like to the pole, seeks no release or
    turning back, and asks the way-knowing Leader to guide him straight.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage frames commitment and guidance, but it does not narrate a
    developed quest.
comparison_claims:
- id: claim:1
  claim: The line about the wandering merchant gaining heaven’s water is explicitly
    connected by the translator to another Rigvedic story in which the Asvins send
    rain to Kakshivan.
  claim_level: same_motif
  target: Rigveda I.112.11, Kakshivan and rain sent by the Asvins
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim rests on the translator’s note; the present passage does
    not retell the referenced story.
- id: claim:2
  claim: The Navagvas and Dasagvas are presented in the note as priestly families
    frequently mentioned with the Angirases, supporting comparison with a broader
    Rigvedic Angirases praise-and-cattle complex.
  claim_level: same_function
  target: Other Rigvedic mentions of Navagvas, Dasagvas, and Angirases
  evidence_refs:
  - ev:7
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The note states the broader association but gives no specific parallel
    passage beyond the general connection.
