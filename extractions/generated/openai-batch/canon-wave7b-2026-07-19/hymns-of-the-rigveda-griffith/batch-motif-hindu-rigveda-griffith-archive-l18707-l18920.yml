canonical_text:
  quote: ''
  summary: The passage contains hymnic prayers to the Adityas, Varuna, and the Visvedevas.
    The speaker asks for guidance on safe paths, shelter, long life, forgiveness of
    sin, release from bonds and danger, protection from enemies, and access to light.
    Varuna and the Adityas are described as upholding cosmic regions and law, ruling
    without sleep, commanding rivers, and punishing sinners. Aditi is invoked as Mother
    of Kings. The passage also includes commentary notes explaining Aditi, the three
    functions, darkness, and the Twain-united as heaven and earth.
  language: English
