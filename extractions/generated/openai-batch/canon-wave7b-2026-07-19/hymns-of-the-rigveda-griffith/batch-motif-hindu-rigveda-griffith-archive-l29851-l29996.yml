canonical_text:
  quote: ''
  summary: 'The passage contains stanzas and notes concerning Ghrita or holy oil in
    sacrifice: a four-horned Buffalo or Steer, oil hidden within a Cow by Panis, divine
    recovery or forming of its shapes by Indra, Surya, and Vena, streams of oil flowing
    toward Agni/Jatavedas, and a petition for cattle and possessions. It then begins
    Book V Hymn I to Agni, where Agni is awakened by fuel at dawn, anointed with milk,
    receives offerings with tongues, is borne by Dawns, born in the fuel at daybreak,
    and seated as priest.'
  language: English
  quote_policy: summarized
