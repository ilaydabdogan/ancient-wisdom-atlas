  quote: ''
  summary: The passage contains hymns and notes centered on the Maruts. They are invoked
    as powerful, ornamented, storm-associated beings who move clouds, bring rain,
    ride chariots, bear weapons, join Indra in battle, receive Soma and praise, and
    are associated with ritual singers such as the Gotamas. The passage also begins
    a hymn to the Visvedevas asking auspicious divine powers to guard worshippers
    day by day.
