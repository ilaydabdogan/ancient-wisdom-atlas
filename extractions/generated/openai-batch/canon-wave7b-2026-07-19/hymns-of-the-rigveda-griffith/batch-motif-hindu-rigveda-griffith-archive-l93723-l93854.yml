canonical_text:
  quote: ''
  summary: A ritual passage describes a consecrated Kshatriya's formula of self-offering,
    his relation to Agni, Indra, Soma, and the Brahman/Purohita, and rules for handling
    the sacrificer's share. It then narrates how Vicvantara Sausadmana excluded the
    Cyaparnas from a sacrifice, how Rama Margaveya challenged that exclusion through
    ritual knowledge, and how Indra's deprivation and later theft of Soma from Tvastr
    provides a precedent for Soma access and substitute royal food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker states that he does not depart from Agni, the Gayatri metre, the
    Trivrt Stoma, or holy power, and asks that they not take his brilliance, strength,
    life, holy power, glory, and fame.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says he approaches Indra, the Tristubh metre, the Pancadasa Stoma,
    Soma the king, and lordly power, and says that he becomes a Kshatriya.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker addresses gods and fathers, identifies his sacrifice, gift, toil,
    and offering, and names Agni as witness, Vayu as hearer, and Aditya as proclaimer.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says that Agni, Gayatri, Trivrt Stoma, and the Brahmans do not
    appropriate the stated powers from the one who offers the libation, adores the
    Ahavaniya, and concludes as a Kshatriya.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: For announcing a Kshatriya's consecration, the passage prescribes using the
    Rsi descent of his Purohita and says the Kshatriya has laid aside his own weapons
    and resorted to the sacrifice in the form of holy power.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sacrificer's share is to be handed over to the Brahman because the Purohita
    is described as half the self of the Kshatriya, and the Brahman is said to support
    the sacrifice.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage rejects making an offering of the sacrificer's share in the fire,
    reasoning that the share is the sacrificer and that placing it on the fire would
    let Agni burn the sacrificer's breaths and cause death.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Vicvantara Sausadmana performs a sacrifice without the Cyaparnas; the Cyaparnas
    enter and sit within the altar, and Vicvantara orders them removed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After being removed, the Cyaparnas cite a precedent involving the Kacyapas,
    Janamejaya Pariksita, and the Bhutaviras, and Rama Margaveya declares himself
    their hero.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Rama Margaveya challenges the removal by asking whether one who knows the
    relevant matter can be removed from the altar; Vicvantara replies by calling him
    a worthless Brahman and asks what he knows.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: Rama says that the gods excluded Indra for several offenses, depriving Indra
    and lordly power of Soma drinking; he then says Indra later obtained a share by
    stealing Tvastr's Soma and claims to know the food proper to lordly power when
    deprived of Soma.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
