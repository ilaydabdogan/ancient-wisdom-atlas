canonical_text:
  quote: ''
  summary: The passage invokes goddesses including Raka and Sinivali for milk, wealth,
    food, a hero son, progeny, and aid. It then petitions Rudra for sunlight, long
    life, medicines, protection from enmity, disease, mischief, and his own weapons
    or wrath. The opening Maruts hymn describes the Maruts as rain-loving, fire-like,
    adorned storm deities associated with Rudra, Prisni, torrents, cloud, kine, and
    spotted deer.
  language: English
  quote_policy: summarized
