canonical_text:
  quote: Speech is fire,* sight yonder sun, mind the moon, hearing the quarters
  summary: The passage describes an unnamed figure carried forward by the gods, connects
    morning, evening, day, and night with movement, rest, and breathing, and maps
    speech, sight, mind, and hearing to fire, sun, moon, and the quarters. It cites
    Hiranyadant Vaida as a knower of the union of deities in the body, explains truth
    through breath, food, and sun, and then describes speech as a rope, names as knots,
    and Vedic metres as coverings of bodily parts.
  language: English
  quote_policy: quoted
