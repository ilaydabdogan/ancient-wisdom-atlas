  quote: ''
  summary: The passage contains notes on Soma terminology, then portions of two Soma
    Pavamana hymns. Soma/Indu/Pavamana is dressed by sages, called by kine, sent to
    the sky, sent to the sieve by the Sisters with pressing-stones, hurried to Indra,
    and poured or conducted through filtering cloth into wooden vats for Indra and
    Vayu.
