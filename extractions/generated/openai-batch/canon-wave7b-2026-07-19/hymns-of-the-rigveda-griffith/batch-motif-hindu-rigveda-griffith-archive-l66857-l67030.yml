canonical_text:
  quote: ''
  summary: The passage contains an Agni hymn fragment and two Agni hymns. Agni is
    described through cosmic images of Earth and Heaven, seven red sisters, seven
    pathways, a pillar at divided paths, and Being and Not-Being. Subsequent verses
    praise Agni as protector, priest, sacrificer, receiver and mediator of oblations,
    summoner of the gods, source of prosperity, divine kinsman, and guardian who grants
    life and vigor. Translator notes identify some images with Agni’s flames, solar
    forms, pathways of light, the Skambha-like pillar, and cosmogonic Being/Non-Being
    language.
