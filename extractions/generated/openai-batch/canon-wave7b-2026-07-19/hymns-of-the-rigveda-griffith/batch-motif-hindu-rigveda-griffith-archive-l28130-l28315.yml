canonical_text:
  quote: ''
  summary: 'The passage closes an Indra hymn asking the bounteous Vritra-slayer for
    gifts and praising his tawny or bay steeds. It then presents hymns to the Ribhus:
    they serve and rejuvenate their Parents, fashion a milch-cow and ritual beakers,
    gain immortality, make fields, rivers, chariots, cows, and Indra''s steeds, and
    are invited to Soma libations in exchange for riches. Translator''s notes add
    cautious interpretations and cross-references for some obscure details.'
