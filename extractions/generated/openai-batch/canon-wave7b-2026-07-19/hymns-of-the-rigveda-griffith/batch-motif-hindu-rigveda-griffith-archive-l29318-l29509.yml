canonical_text:
  quote: ''
  summary: The passage includes hymnic material and notes concerning Brihaspati, Indra,
    royal-priestly favor, Soma, and two Dawn hymns. Brihaspati is portrayed as heaven-born,
    thunderous, darkness-dispelling, and as destroying obstructive Vala and driving
    forth cattle. Worship and Soma offerings are linked to wealth, progeny, heroic
    strength, protection, and royal success when the Brahman has precedence. Dawn
    is portrayed as a heavenly goddess or group of Dawns who mount eastward from darkness,
    open the fold of darkness, travel with horses under Order, awaken living beings,
    bestow wealth, and appear as Daughter of Heaven, Mother of Kine, red-mare-colored,
    and friend of the Asvins.
  language: English
  quote_policy: summarized
