canonical_text:
  quote: ''
  summary: The passage explains a sacrificial sequence centered on Agni. Agni is described
    as a first-born child, a guest, a house-lord, a friend, and an oblation-bearer
    kindled by Agni. Gods and named divine groups are said to have sacrificed with
    Agni to Agni and thereby reached the world of heaven. The passage interprets recited
    verses, numbers, offerings, guest reception, food, breaths, the head, Prajapati,
    the year, months, and seasons as parts of the rite and its efficacy.
  language: English
  quote_policy: summarized
