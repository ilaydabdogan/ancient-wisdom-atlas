canonical_text:
  quote: ''
  summary: A sequence of Rigvedic hymns and notes praises Soma/Pavamana as purified
    divine juice, luminous bull, sacrificial offering, source of strength, wealth,
    heavenly light, wisdom, and joy for the gods, especially Indra. The passage includes
    an Apri-style invocation in which celestial doors, Night and Dawn, goddesses,
    Tvashtar, Vanaspati, and other gods are connected with Pavamana's sacrifice, followed
    by hymns describing Soma flowing through filter, fleece, milk, and waters toward
    Indra and other deities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A note identifies Soma juice with Amrit or nectar, the drink of the Gods,
    contained in the Moon.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speakers ask Soma to win light, heavenly light, felicities, strength,
    mental power, and victory over foes, with a repeated request that he make them
    better than they are.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Purifiers are told to purify Soma for Indra's drink, and worshippers ask for
    a portion in the Sun, long sight of the Sun, wealth, and support of Law.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pavamana is described as enkindled, self-produced, shining, glittering through
    the firmament, and as a bellowing Bull sharpening his horns.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Apri hymn says celestial doors are lifted high by Pavamana, and Night
    and Dawn are named as a great lofty Pair like beauteous maidens.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sarasvati, Bharati, and Ila are summoned to attend Pavamana's sacrifice, and
    Tvashtar is summoned as protector, champion, and earliest-born.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Pavamana's streams anoint Vanaspati, which is described as ever-green, golden-hued,
    refulgent, and with a thousand boughs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Soma flows toward the woollen sieve and filter; sparkling drops flow like
    waters down a steep descent and reach Indra purified.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the filter, ten dames cleanse Soma; a note identifies the ten dames
    as fingers. The juice is poured with milk for the service of the Gods and to strengthen
    Indra.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The effused juice is called the soul of sacrifice and is said to keep ancient
    wisdom and store hymns even in secret.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: In Hymn VII, the drops flow for maintenance of Law, the stream of meath sinks
    in mighty waters, and the Steer sends continuous voices in the wood.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Purified Soma sits as King among his folk, settles golden-coloured in the
