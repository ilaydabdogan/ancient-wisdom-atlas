canonical_text:
  quote: ''
  summary: The passage praises and invokes the Maruts as a powerful, luminous, armed
    company who receive sacrifice, guard mortals, ride with deer or steeds, are associated
    with lightning, rivers, clouds, rain, and chariots, and give gifts. It names Prishni
    as Mother-cow and Rudra as Sire in a difficult passage interpreted as involving
    the Sakins or princes. The following hymn asks who knows the Maruts’ birth and
    path, describes their arrival in chariots, and says they release the storm-cloud
    and rainfloods.
