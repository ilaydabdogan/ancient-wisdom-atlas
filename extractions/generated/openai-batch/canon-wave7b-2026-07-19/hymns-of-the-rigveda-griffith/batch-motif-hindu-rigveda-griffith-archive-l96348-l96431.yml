canonical_text:
  quote: ''
  summary: 'The passage gives ritual prescriptions and interpretive rationales for
    constructing and mounting a swing: its planks, wood, height, ropes, direction
    of mounting, bodily contact, and relation to the Hotr and Udgitr. It explains
    the swing and seat as masculine and feminine, united for offspring, and associates
    the rite with food, prosperity, children, and cattle. Notes compare related ritual
    details in other Brahmana and Aranyaka passages.'
  language: English
  quote_policy: summarized
