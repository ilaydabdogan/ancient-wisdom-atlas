candidate_motifs:
- id: motif:1
  label: hidden or stolen cattle in the mountain recovered with a deity
  taxonomy_refs:
  - sacred_theft
  basis: The stanza places hidden kine in a stable after emergence from a lofty mountain,
    and the note explicitly says Soma accompanies Indra in an expedition to recover
    stolen cattle.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  confidence: medium
  cautions: The main stanza says the cattle are hidden; the explicit recovery of stolen
    cattle comes from the accompanying note, and the note also reports that cows may
    signify water.
- id: motif:2
  label: serpent and Vritra-slaying divine warrior
  taxonomy_refs:
