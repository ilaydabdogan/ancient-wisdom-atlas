comparison_claims:
- id: claim:1
  claim: The passage explicitly aligns Soma’s function with the Vedic Vritra-slayer
    and serpent-slayer combat pattern by comparing Soma to Indra and Pedu’s horse
    and by calling Soma a Vritra-slayer.
  claim_level: same_function
  target: Vedic Vritra/serpent-slaying combat pattern associated with Indra and Pedu’s
    horse
  evidence_refs:
  - ev:6
  - ev:13
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal textual comparison and functional alignment, not
    evidence for historical contact or for a complete independent myth narrative.
- id: claim:2
  claim: The passage and note connect the hidden cattle episode with the Vedic stolen-cattle
    recovery pattern involving Indra and Soma.
  claim_level: same_motif
  target: Vedic hidden or stolen cattle recovery pattern
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The main verse says the kine are hidden; the phrase 'stolen cattle'
    appears in the explanatory note, and the note also allows cows to signify water
    or milk imagery.
- id: claim:3
  claim: The hymn uses a series of explicit similes to present Soma as sharing functions
    or qualities with multiple Vedic deities, including Vayu, the Nasatyas, Pushan,
    Agni, Maruts, Varuna, Mitra, and Aryaman.
  claim_level: same_function
  target: Named Vedic deities used as comparisons for Soma’s ritual, martial, purifying,
    and beneficent functions
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The claims are based on poetic simile and association within the passage,
    not on identity between the deities.
