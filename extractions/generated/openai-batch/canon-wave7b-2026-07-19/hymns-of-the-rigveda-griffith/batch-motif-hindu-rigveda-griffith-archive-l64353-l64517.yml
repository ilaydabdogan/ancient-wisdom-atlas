canonical_text:
  quote: ''
  summary: The passage contains stanzas and notes from Soma Pavamana hymns. Soma is
    described as issuing from a lofty mountain, finding hidden cattle, flowing and
    being cleansed for Indra, accompanying Indra around the herd, and being effused
    as Indra’s chosen drink. Subsequent stanzas compare Soma to chariots, horses,
    rivers, rain, fire, Vedic deities, and warriors; Soma is called a Vritra-slayer
    and Dasyu-slayer, passes through a fleecy filter into beakers, moves with waters
    and rivers, is associated with a ship of Order and a Hawk, is attended by twins/sisters
    and four pourers, supports heaven and earth, and goes to Indra with weapons and
    treasure.
  language: English
  quote_policy: summarized
