canonical_text:
  quote: ''
  summary: The passage contains hymnic praise and petitions to Sarasvati, Brihaspati/Brahmanaspati,
    and Indra. Sarasvati is praised as a divine stream and asked for protection, food,
    progeny, and good fortune. Brihaspati is invoked at assemblies and sacrifices
    for protection, wealth, prayer, and safe passage; Heaven and Earth are named as
    his divine parents. Indra receives libations and Soma, is described as empowered
    from birth, and is praised as a warrior who defeats hostile powers and controls
    cattle and treasure.
  language: English
  quote_policy: summarized
