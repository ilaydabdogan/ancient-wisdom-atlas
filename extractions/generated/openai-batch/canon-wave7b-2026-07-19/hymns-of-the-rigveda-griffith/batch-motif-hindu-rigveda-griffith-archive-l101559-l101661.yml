canonical_text:
  quote: ''
  summary: The passage combines ritual commentary and mantras. It describes the Hotr’s
    departure routes, oblations on the agnidhriya and marjaliya altars, placement
    of a divided oblation near the fire, kindling of the marjaliya fire, and verses
    invoking divine aid and protection. A later series of verses asks that the speaker
    become like fire, earth, sky, heaven, sun, moon, mind, wind, day, night, kine,
    a pair, water, plants, food, sacrifice, Brahmin, and Kshatriya.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The commentary distinguishes a departure after completion of the pressing
    by the west from a departure before the pressing is finished by the eastern side.
  category: sequence
  evidence_refs:
