- id: obs:2
  text: A ritual sequence includes oblations on the agnidhriya and marjaliya altars,
    recitation of verses, putting down the ladle, and departure by the way previously
    taken.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mantras say that Indra, Brhaspati, Soma, and the goddess Vac have aided
    the speaker, and ask Mitra, Varuna, Heaven, Earth, the Adityas, the all-gods,
    seven anointed Kings, and named deities or powers to help.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mantras ask the fathers, the universe, the children of Prsni, the Maruts,
    and gods described as having Agni as their tongue to protect the speaker or the
    group.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ten oblations are offered on the marjaliya altar to the south, and the last
    is divided into four and deposited north of the fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the middle of the day, after the carrying forth of the fire, the marjaliya
    fire is made to kindle, and the offering is made when it is covered up on one
    of several specified sides.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The verses repeatedly use the formula 'May I become' with comparisons to fire,
