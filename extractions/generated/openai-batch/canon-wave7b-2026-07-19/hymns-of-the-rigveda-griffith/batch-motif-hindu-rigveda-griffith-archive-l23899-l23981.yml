  quote: ''
  summary: The passage gives ritual directions for offerings at morning, noon, and
    evening, then presents hymnic material in which prepared foods, Soma, hymns, and
    oblations are offered to Indra and associated deities. Indra is invited to come
    with horses or chariot, receive Soma and food, sit on the sacrificial grass, and
    return again after departing. Notes identify Pushan’s association with groats,
    Parvata as connected with mountains and clouds, and ritual officiants who join
    in the ceremony.
