canonical_text:
  quote: ''
  summary: The passage contains the close of a hymn to the Fathers and a funeral hymn
    to Agni. Worshippers invite the Fathers, Yama, Agni, and associated divine groups
    to accept Soma and oblations, grant blessings, and receive offerings. The funeral
    section asks Agni not to destroy the deceased completely but to mature and send
    him to the Fathers, while parts of the deceased are assigned to the Sun, Wind,
    earth, heaven, waters, and plants. It also treats wounds, protective coverings,
    the sacrificial goat, the ladle, two functions of Agni, and the cooling and renewal
    of the burned place.
  language: English
  quote_policy: summarized
