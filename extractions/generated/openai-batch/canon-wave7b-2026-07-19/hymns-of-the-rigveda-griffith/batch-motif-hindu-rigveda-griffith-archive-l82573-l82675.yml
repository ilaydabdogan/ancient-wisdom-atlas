  text: Two Viraj verses of thirty-three syllables are prescribed; the gods are also
    enumerated as thirty-three, and the deities are made sharers in the syllables.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Fore-offerings are equated with breaths and after-offerings with offspring;
    omitting either is said to omit the sacrificer’s breaths or offspring.
  category: relationship
  evidence_refs:
  - ev:9
