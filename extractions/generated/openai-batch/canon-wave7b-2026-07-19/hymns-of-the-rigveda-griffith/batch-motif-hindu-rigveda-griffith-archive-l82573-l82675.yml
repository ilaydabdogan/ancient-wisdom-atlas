  summary: Ritual prose explains how offering verses, metres, and correct sequencing
    order divine and human subjects, reveal or win the world of heaven, announce the
    sacrificer to the Maruts, preserve the sacrificer’s breaths and offspring, and
    maintain continuity and success in both worlds.
