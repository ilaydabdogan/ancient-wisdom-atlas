  evidence_refs:
  - ev:7
- id: obs:9
  text: By asking the Maruts to bestow prosperity for wealth, the ritual announces
    the sacrificer to them, and they do not obstruct or crush him but speed him to
    the world of heaven.
  category: sequence
  evidence_refs:
  - ev:7
