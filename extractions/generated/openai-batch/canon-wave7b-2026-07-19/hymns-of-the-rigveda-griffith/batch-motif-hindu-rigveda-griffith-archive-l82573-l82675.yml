  text: Aditi is identified with the earth, and the offering verse for Aditi is said
    last for discernment of the sacrifice and revelation of the world of heaven.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that when the subjects of the gods are brought into order,
    the subjects of men also come into order, and the sacrifice comes into order where
    there is a knowing Hotr.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A recited verse asks for prosperity in ways, deserts, waters, light-bearing
    abode, child-bearing wombs, and wealth bestowed by the Maruts.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Maruts are called the subjects of the gods, and they are brought into
    order at the beginning of the sacrifice.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The gods are said to have conquered the world of heaven by sacrificing with
    all the metres; the sacrificer who knows this is said to do likewise.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage lists Gayatri, Tristubh, and Jagati as prominent metres of the
    sacrifice, with other metres dependent on them.
