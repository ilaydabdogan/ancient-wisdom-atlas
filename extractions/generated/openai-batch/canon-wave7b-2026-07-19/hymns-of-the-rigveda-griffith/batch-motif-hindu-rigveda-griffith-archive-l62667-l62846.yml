  quote: ''
  summary: The passage contains purification petitions to Pavamana/Soma, Agni, Savitar,
    and other gods; brief stanzas and notes on Pavamana hymns and their nourishing
    effects; and Hymn LXVIII to Soma Pavamana, where Soma flows, is pressed and filtered
    through fleece or sieve, is mixed with milk, waters, and grain, is associated
    with Heaven and Earth, is brought from afar by a Falcon, and is praised by Rishis,
    men, and women in ritual context.
  language: English
