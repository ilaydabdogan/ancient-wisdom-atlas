canonical_text:
  quote: ''
  summary: The passage contains notes on demons and several hymnic sections to Indra.
    Indra is filled with Soma and asked for wealth. In Soma’s rapture he slays the
    Dragon, establishes heaven and earth, releases rivers, rescues and enriches Dabhiti,
    controls floodwaters, reverses a stream, damages the car of Dawn, enables a disabled
    outcast to stand and see hidden maids, slays Vala and breaks mountain defenses,
    overwhelms Chumuri and Dhuni with sleep, kills a Dasyu, and enables discovery
    of golden treasure. Later verses describe Indra’s thunderbolt, car, steeds, Soma-drinking,
    ritual praise, saving-ship simile, boon-giving cow, and ancient opening of the
    cattle-stables.
  language: English
  quote_policy: summarized
