canonical_text:
  quote: "“Out of Destruction’s lap again I bring him, save him for life to last a
    hundred autumns.”"
  summary: 'The passage includes hymnic and charm material: Soma offerings to Indra
    for favor and goods; a healing charm freeing a person from disease, a seizing
    demon, and Destruction, with prayers for a hundred years of life; a dream charm
    expelling an evil dream-spirit and transferring harmful thoughts; an apotropaic
    hymn concerning a dove as an ominous envoy of Destruction, Death, or Yama; a spell
    for overcoming rivals; and the opening of another Indra hymn praising meath or
    Soma and heavenly light won through Fervour.'
