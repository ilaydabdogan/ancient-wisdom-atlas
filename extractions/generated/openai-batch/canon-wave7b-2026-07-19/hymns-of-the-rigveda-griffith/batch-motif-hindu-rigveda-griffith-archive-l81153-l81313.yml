candidate_motifs:
- id: motif:1
  label: Offering of Soma or oblation in exchange for divine favor
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The worshipper pours Soma for Indra and seeks goods, cattle, horses, protection,
    and welfare; oblation is also used in healing and apotropaic contexts.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:7
  - ev:10
  confidence: high
  cautions: The passage is hymnic and ritual; the exchange is stated as prayer and
    praise rather than narrated as a completed transaction in every case.
- id: motif:2
  label: Ritual restoration from disease, death-nearness, and demonic seizure
  taxonomy_refs:
  - death_rebirth
  - sacrifice
  basis: The charm frees a person from unknown decline, Consumption, possible demonic
    possession, and Destruction’s lap, then restores life, youth, sight, and bodily
    wholeness.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage concerns healing and longevity; “death_rebirth” is a broad
    taxonomy fit because the person is brought back from Destruction and death-nearness,
    not literally narrated as dead and resurrected.
- id: motif:3
  label: Hundredfold longevity blessing
  taxonomy_refs: []
  basis: The healing charm repeatedly asks for or declares a hundred autumns, springs,
    winters, lives, and years for the restored person.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No supplied taxonomy family directly names longevity; treated as a candidate
    motif without taxonomy reference.
- id: motif:4
  label: Expulsion and transfer of evil dreams, sins, and hostile thoughts
  taxonomy_refs: []
  basis: The dream charm expels Avapni, asks Agni to carry away hateful acts, and
    directs ill thoughts to seize an enemy and hater.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The exact ritual setting and identity of some names are uncertain in the
    translated and OCR-affected passage.
- id: motif:5
  label: Ill-omened bird as envoy of death averted by ritual
  taxonomy_refs: []
  basis: The dove entering the dwelling is described as an envoy of Destruction, a
    winged missile or arrow, and connected with Death or Yama; hymns, oblation, and
    holy verses seek to avert harm and drive it away.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage treats the bird ritually and ominously; the taxonomy list
    does not provide a direct bird-omen or death-messenger category.
- id: motif:6
  label: Ritual domination and humbling of rivals
  taxonomy_refs:
  - royal_legitimacy
  basis: The speaker asks to become a sovereign ruler and lord of kine, bind rivals,
    place enemies beneath his feet, and master their thought, assembly, and ritual
    work.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The royal-legitimacy taxonomy fit is partial; the hymn concerns rivalry
    and dominance rather than a formal enthronement narrative.
- id: motif:7
  label: Heavenly light won through Fervour
  taxonomy_refs: []
  basis: Indra is said to have glowed with Fervour and won heavenly light.
  evidence_refs:
  - ev:10
  confidence: low
  cautions: Only a brief opening stanza is included; the larger mythic context is
    not present in this passage.
comparison_claims:
- id: claim:1
  claim: The passage’s note explicitly compares the Vedic dove omen to a North-Lincolnshire
    belief in which a pigeon entering the house, perching on a tree, or becoming tame
    is a sign of death.
  claim_level: same_function
  target: North-Lincolnshire pigeon or dove death omen mentioned in the translator’s
    note
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a translator’s folkloric analogy within the note; it does not
    establish historical contact, common inheritance, or identical ritual meaning.
