  quote: |-
    Who cleft the water-cloud in twain, loosed rivers for their
    downward flow,
  summary: A sequence of hymnic verses and notes addresses Indra as Soma-drinker,
    Vritra-slayer, wealth-giver, helper, and warrior. Worshippers invite him to drink
    Soma, ask for food, cattle, steeds, gold, and protection, and recall his deeds
    of cleaving the water-cloud, releasing rivers, setting milk in cows, slaying Vritra
    and Ahiguva, and piercing Arbuda with frost. The passage also describes ritual
    pouring through a filter and Indra’s arrival by golden-maned Bay Steeds.
  language: English
  quote_policy: quoted
