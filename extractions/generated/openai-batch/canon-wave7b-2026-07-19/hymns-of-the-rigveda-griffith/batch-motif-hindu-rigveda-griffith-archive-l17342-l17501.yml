  quote: ''
  summary: The passage contains notes on several demonic or adversarial figures and
    hymnic praise of Indra. Indra is described as stabilizing earth, air, heaven,
    and mountains; slaying the Dragon or Ahi; releasing rivers and floods; freeing
    kine from Vala's cave; generating fire between stones; controlling cattle, chariots,
    horses, villages, the Sun, Morning, and waters; aiding worshippers and warriors;
    wielding thunder and the bolt; and receiving Soma, praise, and ritual gifts. A
    following hymn segment connects the Season or Rains, floods, milk, Soma, ritual
    specialists, and Indra's freeing of river paths after slaying Ahi.
