canonical_text:
  quote: By means of the sacrifice the gods went upwards to the world of heaven
  summary: 'The passage links ritual recitation with freedom from fear and a twenty-onefold
    Prajapati schema. It then explains the sacrificial post: the gods ascended to
    heaven by sacrifice, used a point-down post to block human and seer tracking,
    and men and seers later raised the post and discerned heaven. The post is further
    identified with a thunderbolt or weapon, and specific woods are prescribed for
    desired ritual results such as heaven, food, prosperity, brilliance, and splendour.'
  language: English
  quote_policy: quoted
