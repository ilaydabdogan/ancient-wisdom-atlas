canonical_text:
  quote: ''
  summary: The passage explains ritual recitations and their effects in sacrifice,
    including verses addressed to Mitra, Varuna, Visnu, Prajapati, Indra, Agni, and
    the Maruts. It then gives an etiological account in which the gods secure Agni's
    participation against the Asuras by praising him, links Agnistoma with Gayatri
    and the year, describes the rite as carrying the sacrificer to the sky, and states
    that other sacrificial rites are resolved in the Agnistoma.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A verse to Mitra and Varuna is recited; Visnu is said to guard what is ill
    offered in the sacrifice, Varuna what is well offered, and the recitation appeases
    both.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A verse to Visnu is recited; Visnu is compared to a roller, and the recitation
    is said to make what was ill sung or ill recited in the sacrifice well sung and
    well recited.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A verse to Prajapati identifies the web with offspring, identifies light-filled
    paths as paths that go to the gods, invokes Manu and the birth of divine folk,
    and states that one who knows this is propagated with offspring and cattle.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The concluding verse addresses Indra with epithets that are identified with
    the earth; the conclusion is to be spoken while touching the earth, thereby establishing
    the sacrifice at its end.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the Agnimaruta litany, a verse to Agni with the Maruts is recited as
    an offering verse, delighting the gods according to their portions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The gods undertake battle against the Asuras and ask Agni to accompany them;
    Agni refuses unless he is sung to, so the gods praise him and he follows them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Agni goes to battle in three rows and three columns; the rows are identified
    with metres and the columns with pressings, and Agni defeats the Asuras invincibly.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The text states that one who knows the battle teaching prospers while a hateful
    rival is defeated.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Agnistoma is identified with the Gayatri and with the year; the text links
    twenty-four syllables, twenty-four Stotras and Castras, and twenty-four half-months.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Gayatri and the Agnistoma are both said to take the sacrificer aloft from
    earth to the sky.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: All sacrificial rites are said to be resolved in the Agnistoma, like streams
    in the ocean.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The consecration offering, sacrificial food, cooked-food sacrifices, Agnihotra,
    fast milk, new and full moon sacrifices, Soma purchase, medicines, friction-kindled
    Agni, four-monthly sacrifices, Pravargya, Daksayana, and a fast-day victim are
    connected to the Agnistoma by ritual correspondences.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
