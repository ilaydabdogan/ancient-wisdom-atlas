canonical_text:
  quote: ''
  summary: 'The passage explains ritual chants and recitations that seize a foe''s
    property, equalize day and night portions, and win what is unlimited. It then
    gives an origin account of the Acvina Castra: Prajapati gives Surya Savitri to
    Soma, the gods attend as groomsmen, and a thousand verses are made for the wedding.
    The gods compete in a race for the rite; Agni, Usas, and Indra receive shares,
    while the Asvins win and give the rite its name. A final section connects the
    divine contestants'' vehicles with etiological traits of animals and dawn.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chanting the second and last rounds and repeating Padas is said to take carts,
    chariots, clothes, gold, and jewels from foes; the knower takes the foe's property
    and repels him from all worlds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Day and night are made to have Pavamana and Stotra portions through specified
    chanting, recitation, and the Sandhi Saman, so that both become equal in portions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage contrasts limited chanting with unlimited recitation, linking
    what has been with the limited and what is to be with the unlimited; reciting
    beyond the Stotra is said to win what is beyond the self.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Prajapati gives his daughter Surya Savitri to Soma the King; all the gods
    come as groomsmen, and Prajapati makes a thousand verses for the wedding ceremony
    called the Acvina Castra.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The reciter is instructed to eat ghee before reciting; the passage compares
    him to an oiled cart or chariot that goes well and says he should call in a posture
    like an eagle about to fly up.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The gods disagree over possession of the Acvina and agree to settle it by
    a race; the course is made from Agni, lord of the house, to the sun.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: During the race, Agni first takes the lead; the Asvins ask Agni, Usas, and
    Indra for precedence or victory, and each receives a share in the Acvina recitation.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Asvins win and attain the race's object, and this victory is given as
    the reason the rite is called the Acvina; the knower is said to attain whatever
    he desires.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: 'The race vehicles are tied to later traits: Agni''s mule chariot burns wombs,
    Usas''s ruddy cows correspond to dawn''s glow, Indra''s horse chariot is associated
    with lordly power, and the Asvins'' ass chariot explains the ass''s spent speed
    while preserving virility.'
  category: relationship
  evidence_refs:
  - ev:9
