canonical_text:
  quote: Over all woes and dangers, Jatavedas, bear us as in a boat across a river.
  summary: The passage invokes Agni/Jatavedas for protection, prosperity, food, descendants,
    and ritual mediation. It includes an Apri hymn summoning Agni, Indra, deified
    ritual objects, goddesses, priests, Tvashtar, Vanaspati, Varuna, the Maruts, and
    the Gods. It also praises Agni as home of cattle and horses, giver of wealth,
    bearer of gifts, household envoy, luminous fire, and director of sacrifice.
  language: English
