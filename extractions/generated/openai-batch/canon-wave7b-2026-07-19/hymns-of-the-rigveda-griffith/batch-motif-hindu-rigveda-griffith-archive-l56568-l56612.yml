canonical_text:
  quote: ''
  summary: A hymn calls Indra to come, rejoice, and drink Soma expressed with stones,
    mixed or dressed with milk, and held in chalices and vats; Soma is likened to
    the Moon in a flood and said to have been brought through the air by a Hawk. A
    following hymn chooses the protection of the Mighty Gods, names Varuna, Mitra,
    Aryaman, and the Adityas, and asks them to help, prosper, slay foes, and carry
    worshippers safely over many woes as ships cross water-floods.
  language: English
  quote_policy: summarized
