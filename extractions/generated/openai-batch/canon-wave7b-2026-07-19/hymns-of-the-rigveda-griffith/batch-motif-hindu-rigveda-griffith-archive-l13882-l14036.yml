canonical_text:
  quote: "“The strong Steed hath come forward to the slaughter”"
  summary: 'The passage presents a Courser or Steed with heavenly, solar, and sacrificial
    features: it is bound in heaven, waters, and ocean; moves like a bird through
    heaven; is associated with oblation, a goat, slaughter, the Gods, and Heaven and
    Earth as parents. A following hymn section gives riddling cosmological images
    of fire, the Sun, a one-wheeled chariot, sevenfold beings, cows, milk, water,
    sages, and questions about cosmic origins and knowledge.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Courser is said to have three bonds in heaven, three in the waters, and
    three within the ocean, and is addressed as seeming to be Varuna at a sublimest
    birthplace.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker points to places where the Courser was groomed, traces of its
    hoofs, and reins kept by those who guard holy Law.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says he recognized the Courser in spirit as a Bird flying through
    heaven and saw its head soaring upward on dust-free paths.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Courser is seen at the Cow’s station and swallows plants when brought
    to enjoyment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A car, bridegroom, kine, maidens’ charm, and full companies are said to follow
    after the Courser.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Courser is described with golden horns and iron feet; Indra is mentioned
    as less fleet, and the Gods come to taste the oblation of the one who first mounted
    the Courser.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Celestial Coursers reach a heavenly causeway, and the Charger is said to have
    a body formed for flight and a spirit swift as the wind.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The strong Steed comes forward to slaughter with a God-directed mind; a related
    goat is led before it, and sages and singers follow.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Steed comes to a noblest mansion, to its Father and Mother, and is to
    approach the Gods and declare gifts to the offerer.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: An explanatory note states that the horse is regarded as identical with the
    Sun in its heavenly course, that the Cow’s station is the altar, and that the
    Father and Mother are Heaven and Earth.
  category: other
  evidence_refs:
  - ev:10
- id: obs:11
  text: A hymn section describes a benignant Priest, a midmost brother identified
    in the verse as lightning, a third whose back is sprinkled with oil, and a Chief
    with seven male children.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: An explanatory note identifies the Priest as the Sun, the brother as lightning,
    the third brother as Agni or household sacred fire, and the seven male children
    as probably priests.
  category: other
  evidence_refs:
  - ev:12
- id: obs:13
  text: Seven are said to yoke the Courser to a one-wheeled chariot; the single Courser
    bears seven names and draws it; the wheel is three-naved and supports all worlds
    of being.
  category: object
  evidence_refs:
  - ev:13
- id: obs:14
  text: Seven mounted beings on a seven-wheeled car have seven horses, while Seven
    Sisters sing together and preserve names of seven Cows.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:15
  text: The speaker asks riddling questions about a boneless one supporting the bony,
    the blood of earth, life, spirit, and the man who knows.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:16
  text: The speaker, describing himself as unknowing, asks sages and knowers about
    established divine places, a seven-thread web, the One in the image of the Unborn,
    and six regions.
  category: speech
  evidence_refs:
  - ev:16
- id: obs:17
  text: A lovely Bird’s station is asked about; cows draw milk from its head and drink
    water while wearing its vesture.
  category: action
  evidence_refs:
  - ev:17
