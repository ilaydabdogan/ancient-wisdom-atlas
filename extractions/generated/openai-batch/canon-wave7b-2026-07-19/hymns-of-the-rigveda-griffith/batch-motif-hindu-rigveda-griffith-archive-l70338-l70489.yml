candidate_motifs:
- id: motif:1
  label: divine twin helpers
  taxonomy_refs:
  - sacred_twins
  basis: The Asvins are repeatedly addressed as a pair, including as Nasatyas, Asvins
    Twain, Two Kings, and two heroes who heal, rescue, and assist worshippers.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:7
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage itself emphasizes the pair’s actions more than origin or genealogy.
- id: motif:2
  label: rejuvenation and restoration from age, injury, and near death
  taxonomy_refs:
  - death_rebirth
  basis: The Asvins make aged Chyavana young again, restore Kali’s youthful vigor,
    give Vispala power to move, and bring forth Rebha when nearly dead.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: medium
  cautions: No completed death and return is explicitly narrated; the taxonomy link
    is approximate because the passage describes healing, rejuvenation, and near-death
    rescue.
- id: motif:3
  label: rescue from enclosing or devouring danger
  taxonomy_refs: []
  basis: The Asvins lift the son of Tugra from floods, raise Vandana from a pit, bring
    Rebha from a cave, make Atri’s fire-heated pit safe, and deliver a quail from
    a wolf’s throat.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:7
  confidence: high
  cautions: The passage gives brief catalogued allusions rather than full narratives
    for each rescue.
- id: motif:4
  label: sacred exchange of offerings for divine aid
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The Asvins’ deeds are to be praised at libations; worshippers call them with
    oblations at morning and evening, and they bring food, friendship, protection,
    and felicity.
  evidence_refs:
  - ev:1
  - ev:7
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The exchange is hymnic and ritual rather than a single narrated transaction.
- id: motif:5
  label: divinely aided marriage and offspring
  taxonomy_refs:
  - sacred_birth
  basis: The Asvins bring a bride to Vimada, grant noble offspring to a wife, and
    are asked by Ghosha to help her gain a car-borne chieftain.
  evidence_refs:
  - ev:3
  - ev:9
  - ev:14
  confidence: medium
  cautions: The marriage is mortal, not explicitly a sacred marriage; the sacred-birth
    taxonomy is only partly supported by offspring aid.
- id: motif:6
  label: miraculous infant with responding plants and rivers
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: A woman brings forth, an infant appears, plants immediately spring up, rivers
    run to him, and he becomes their master and lord.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage gives a compact image without identifying the infant or explaining
    the surrounding myth.
- id: motif:7
  label: dawn, night, and day around a divine chariot
  taxonomy_refs:
