canonical_text:
  quote: ''
  summary: The passage praises and invokes the Asvins/Nasatyas as twin healers, rescuers,
    chariot-riders, and helpers of worshippers. It lists their aid to named figures
    through healing, rejuvenation, rescue from floods, pit, cave, fire, and a wolf,
    marriage and offspring boons, gifts of horses and food, and ritual arrival at
    sacrifice. It also includes images of dawn, night and day, cow’s milk, honey,
    cattle, a birth scene, rivers, and a translator’s comparative note on widow marriage.
  language: English
  quote_policy: summarized
