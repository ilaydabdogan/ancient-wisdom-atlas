canonical_text:
  quote: ''
  summary: A sequence of Rigvedic Book IX Soma Pavamana verses and notes describes
    Soma flowing, being pressed and purified through hands, vessels, filter, cloth,
    and milk, moving to or for several deities, and being invoked to grant wealth,
    strength, rain, victory, progeny, light, wisdom, and kinship with the Gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pleasant Soma streams are said to flow to Bhaga and Mitra-Varuna, while Heaven
    and Earth are asked to gain riches, treasures, and renown for the speakers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Soma juices flow forth in connection with Indra, Vayu, and the Asvins, and
    are said to increase Indra's heroic might and incite his heart to bounty.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Soma is described in a ritual sequence involving ten fingers, seven ministers,
    sages, a bowl, a filter, milk, and jars.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Soma is petitioned to make the worshippers rich, drive enemies away, send
    rain and opulence, and give victory, progeny, and food.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Soma is called the Sage of Heaven, is laid between both hands and pressed,
    sends delightful powers of life, and flows toward a glorious home.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A bright Son is said to illumine his Parents when born; seven devotions stir
    guileless rivers and magnify the Single Eye.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: Soma is asked to aid holy rites, drive away dark shades, make paths ready
    for a hymn, make lights shine, and grant renown, cattle, horses, sons, wisdom,
    and light.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Soma drops are compared to thundering cars and eager coursers, and are said
    to rush forth from holding hands.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:9
  text: The Soma drops are decked with milk, associated with seven priests, flow with
    song, pass through the openings of the cloth, and are connected with Morning's
    light.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:10
  text: Ancient singing-men open doors of sacred songs; seven priests sit together;
