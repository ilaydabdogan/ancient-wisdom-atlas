canonical_text:
  quote: "“The wife is faith, the sacrificer truth; faith and truth are the highest
    pair.”"
  summary: The passage discusses how a man without a wife may continue the Agnihotra,
    links the wife and sacrificer with faith and truth, and states that this pair
    conquers heavenly worlds. It then explains fasting at the new and full moon so
    that the gods will eat the oblation, gives differing views on which lunar day
    to fast, names lunar days, and identifies the moon as the Soma of the gods.
  language: English
