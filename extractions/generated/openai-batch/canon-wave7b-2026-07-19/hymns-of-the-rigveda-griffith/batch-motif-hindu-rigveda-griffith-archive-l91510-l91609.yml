canonical_text:
  quote: ''
  summary: The passage explains ritual recitations by several priestly figures. Hymns,
    metres, and sounds are identified with seed, womb, speech, breaths, body, cattle,
    food, and bodily divisions, so that the sacrificer is perfected, provided with
    breaths, propagated, embodied, nourished, and made like a fivefold human being
    through the sacrifice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Cilpas or Castras are described as works of art and as a perfection of
    the self through which the sacrificer perfects himself as composed of metres.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Nabhanedistha hymn is identified with seed; its recitation without mention
    of the deity is described as seed secretly poured in the womb.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Naracgansa hymn is connected with offspring and speech; the passage says
    speech is placed in offspring and that offspring are therefore born speaking.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: After pouring in seed form, the Hotr hands the rite over to the Maitrivaruna
    and asks him to provide breaths for it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Valakhilyas are identified with breaths, and their transposed recitation
    is mapped to breath and speech, eye and mind, and ear and self.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Brhati is identified with the body, and the Satobrhati is identified first
    with breaths and then with cattle; intermingled recitation strengthens the body
    with these around it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Maitravaruna, after making breaths, hands the rite to the Brahmanacchansin
    and asks him to propagate it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Sukirti hymn is described as a birthplace of the gods and as producing
    the sacrificer from the sacrifice as a divine birthplace.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Vrsakapi hymn is identified with the body, and the sound o is identified
    with food given at birth like the breast to a child.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: 'Pankti verses are associated with the fivefold arrangement of man: hair,
    skin, flesh, bone, and marrow.'
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: After making the sacrificer as great as man, the Brahmanacchansin hands him
    to the Achavaka and asks him to fashion a support.
  category: sequence
  evidence_refs:
  - ev:10
