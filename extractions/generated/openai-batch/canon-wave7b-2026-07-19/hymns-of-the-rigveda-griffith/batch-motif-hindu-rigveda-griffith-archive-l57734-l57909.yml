canonical_text:
  quote: ''
  summary: The passage consists of several invocations to Indra. Indra is praised
    as surpassing gods and mortals, formed for kingship, a Soma-drinker, conqueror,
    destroyer of enemy castles, slayer of Dasyus, attacker of Vritra, provider of
    wealth and strength, and parental protector. Ritual singers, sages, worshippers,
    and priests address him with hymns, libations, and requests for aid. The passage
    also uses images of floods, rivers, ocean, mountain, chariot and Bay Steeds, Heaven
    and Earth, mother-cows and calf, and a dialogue-like address attributed in the
    heading to Vak, in which the speaker offers meath and Soma and asks Indra for
    a portion and comradeship.
  language: English
  quote_policy: summarized
