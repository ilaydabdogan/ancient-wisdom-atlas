candidate_motifs:
- id: motif:1
  label: Recalled divine aid invoked for present help
  taxonomy_refs:
  - sacred_exchange
  basis: The hymn repeatedly lists earlier Asvin aids and asks the Asvins to come
    with those same aids, make the hymn effective, and protect the speakers.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The taxonomy reference is broad; the passage emphasizes invocation and
    aid more than a fully described exchange ritual.
- id: motif:2
  label: Release of enclosed milk, cows, or waters
  taxonomy_refs: []
  basis: The Asvins are associated with liberating a flood of milk; the note explains
    this as cows enclosed in a cave, or rain-clouds prevented from releasing water.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The explanatory identification of milk, cows, cave, rain-clouds, and water
    comes from the translator's note rather than the verse alone.
- id: motif:3
  label: Divine arrangement of bride-transfer
  taxonomy_refs: []
  basis: The Asvins are said to bring a wife for Vimada and carry Sudevi home to Sudas.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not describe the marriage ritual or explain the social
    context.
- id: motif:4
  label: Divine assistance in race and battle
  taxonomy_refs: []
  basis: The Asvins speed a horse in a race, guard horses and car, help warriors or
    heroes, and are called upon for battle strength.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage lists acts formulaically and gives few narrative details.
- id: motif:5
  label: Alternating paired powers of Night and Dawn
  taxonomy_refs:
  - duality
  basis: Night and Dawn are described as akin immortal Sisters of different hues who
    follow the same path, travel alternately, and do not clash.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: The cycle is day-night alternation, not necessarily a seasonal-cycle motif.
- id: motif:6
  label: Dawn as threshold-opener after darkness
  taxonomy_refs: []
  basis: Dawn/Morning appears after Night yields and is said to unclose portals.
  evidence_refs:
  - ev:11
  - ev:14
  confidence: high
  cautions: The passage does not specify what the portals are.
