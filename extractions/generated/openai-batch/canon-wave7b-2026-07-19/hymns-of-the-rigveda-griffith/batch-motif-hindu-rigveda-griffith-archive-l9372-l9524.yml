canonical_text:
  quote: ''
  summary: 'The passage contains the close of an Asvins hymn, recalling many earlier
    acts of aid: release of a flood of milk, strengthening Manu, arranging marriages,
    giving cows, protecting named beneficiaries, helping in race and battle, and answering
    a petition for effective speech and protection. It then begins a Dawn hymn in
    which light arrives, Night yields to Morning, and Night and Dawn move alternately
    as related, differently colored powers.'
  language: English
  quote_policy: summarized
