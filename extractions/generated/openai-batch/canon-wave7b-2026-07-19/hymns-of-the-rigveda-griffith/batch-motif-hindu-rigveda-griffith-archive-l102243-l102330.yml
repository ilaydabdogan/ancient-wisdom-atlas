canonical_text:
  quote: ''
  summary: The passage contains ritual and philological notes on drumming over a raw
    hide outside the vedi, fertility-promoting ceremonies, male-female ritual references,
    priestly singing, a contest for a sun-compared skin, and the Aitareya Aranyaka
    V.1.6 prescription for beginning a Sastra with selected Rigvedic verses. It describes
    substitutions of body-verses with wing quarter-verses, the gaining of cow and
    horse, strengthening wings for flight, interlacing hymn quarter-verses, and inserting
    syllables of the word purusa into a stanza.
  language: English
