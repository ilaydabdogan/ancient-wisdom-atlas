canonical_text:
  quote: The sun is the self of all that goes or stands.
  summary: The passage presents ritual-philosophical correspondences among speech
    sounds, breath, soul, time, hymn, elements, food, feeder, plants, animals, and
    self. It also describes Indra proclaiming knowledge to Visvamitra and Bharadvaja,
    the knower attaining divine knowledge and going to the gods, and the sun as the
    self of moving and standing beings. Notes compare related Indra-Visvamitra dialogue
    traditions and the threefold boon with Naciketas.
  language: English
  quote_policy: quoted
