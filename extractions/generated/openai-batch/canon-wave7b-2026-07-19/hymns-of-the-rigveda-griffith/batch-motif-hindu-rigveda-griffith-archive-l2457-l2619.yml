canonical_text:
  quote: ''
  summary: The passage contains hymnic invocations to Indra, the Asvins, Dawn, and
    Agni. The speakers offer Soma and praise to Indra and request battle aid, strength,
    feasts, food, and wealth. The Asvins are summoned with a chariot, horses, kine,
    and gold, and their chariot is described in sea and sky imagery. Dawn is addressed
    as red-hued, mare-like, and Daughter of the Sky, and is asked to send riches.
    Agni is described as the earliest Angiras, a seer, a god, the gods' friend, born
    from two mothers, disclosed to Matarisvan and Vivasvan, and chosen as priest while
    Heaven and Earth shook.
  language: English
  quote_policy: summarized
