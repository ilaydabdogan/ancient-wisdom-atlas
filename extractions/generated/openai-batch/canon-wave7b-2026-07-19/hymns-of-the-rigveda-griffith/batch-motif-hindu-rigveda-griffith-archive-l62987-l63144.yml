  quote: ''
  summary: The passage presents Soma Pavamana in several hymnic stanzas as a steer,
    bull, gold-hued drink, seer, guardian, and ritual offering. Soma is pressed, purified,
    mixed with milk, poured for the gods and into Indra, urged by songs, and asked
    to carry worshippers beyond danger. The passage also uses images of cows, skins,
    cloud, water, a boat, stones, a car, a falcon, a courser, sacred grass, and a
    golden place, with translator notes identifying some figures and images.
  language: English
