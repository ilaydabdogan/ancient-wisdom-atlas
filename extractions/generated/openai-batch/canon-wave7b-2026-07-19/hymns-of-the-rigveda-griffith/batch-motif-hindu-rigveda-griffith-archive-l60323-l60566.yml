  text: The purified Soma flows to Indra in the firmament and is called a mighty tawny
    Steer.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Pressed by men, the vigorous Steed runs to the woollen straining-cloth, flows
    within the filter, enters the essences of the gods, and shines as an immortal
    god dear to the gods.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Sisters ten direct the bellowing Steer onward to the wooden vats.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Soma is praised by singers and adorned by learned priests, and the hymn asks
    him to fill the sea or Soma reservoir.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hymn asks Soma to win precious things, drive enemies together, preserve
    worshippers from godless or ill-omened speech, and bring wealth from earth and
    heaven.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Streams of Soma flow to the straining-cloth; pressers urge Indu to speed;
    he bellowingly settles in wooden vats, is driven by stones to waters, and is pressed
    as Indra's drink.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The purified Soma-drops are said to bestow visible wealth, increase might,
    stand high over heaven and earth, and gather powers from every side.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Winds are gracious to Soma, rivers flow to him, and kine pour oil and milk
    for him aloft on the sublimest height.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Trita's Maidens urge the tawny Soma with stones; Soma is compared to a swan
    that makes the company sing, a steed bathed in milk, and a deer running in the
    sacrificial place.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Cows sing joyfully to Soma, and the hymn asks him to bestow fame, glory, intelligence,
    and wealth.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Brown Soma drops flow to Indra, Vayu, Varuna, Vishnu, and the Maruts; kine
