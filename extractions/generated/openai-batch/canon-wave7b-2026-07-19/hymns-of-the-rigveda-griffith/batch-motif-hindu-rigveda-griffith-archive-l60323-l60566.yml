canonical_text:
  quote: ''
  summary: A sequence of Soma Pavamana hymns describes Soma or Indu as a personified
    purified draught, steer, steed, and divine being. He is pressed, filtered through
    wool or cloth, driven by stones and ritual agents into wooden vats and waters,
    flows to Indra and other gods, ascends with the Sun, receives milk and praise
    from cows or sacred mothers, and is invoked for wealth, protection, strength,
    fame, intelligence, and rich abundance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Indu Pavamana is described as lowing, longing for kine and gold, and as a
    conqueror who is never overcome.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pavamana drops onto the filtering cloth and is said to mount up with Sirya
