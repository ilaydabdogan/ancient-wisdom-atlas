  quote: "“The Waters’ Son hath risen, and clothed in lightning ascended up unto the
    curled cloud’s bosom”"
  summary: The passage first describes the Son of Waters, associated in the notes
    with Agni, as a golden, lightning-clothed being dwelling and growing in waters,
    kindled and fed with sacred oil, and worshipped with sacrifice. It then turns
    to Soma rites in which Soma is pressed, filtered, mixed with water and milk, poured
    into priestly bowls, and offered for Indra and other divine recipients to drink.
