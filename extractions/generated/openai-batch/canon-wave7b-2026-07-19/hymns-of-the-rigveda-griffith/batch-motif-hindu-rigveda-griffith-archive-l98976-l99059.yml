canonical_text:
  quote: ''
  summary: The passage explains speech, verse, breath, body, truth, untruth, and syllables
    as interrelated forms. The great litany is described as the highest development
    of speech and classified as measured, unmeasured, music, true, and untrue. Truth
    is called the flower and fruit of speech, while untruth is compared to exposed
    roots that dry and perish. The syllables om and no are contrasted, and proper
    alternation between giving and refraining is said to unite true and untrue. Speech
    is further identified with breath when whispered and body when spoken aloud. Knowledge
    of this speech or litany is linked with Indra, the lord of creatures, and with
    leaving this world, becoming Indra, and shining in other worlds.
  language: English
  quote_policy: summarized
