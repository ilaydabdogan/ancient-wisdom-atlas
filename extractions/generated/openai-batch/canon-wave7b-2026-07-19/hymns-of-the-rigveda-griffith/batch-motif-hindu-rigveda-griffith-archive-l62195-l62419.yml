canonical_text:
  quote: ''
  summary: The passage addresses Soma Pavamana, also called Indu and Sura, as a purified
    divine juice that is pressed, cleansed, poured into vessels, mixed with milk,
    and offered to gods including Indra, Varuna, Vayu, Vishnu, and the Maruts. The
    speakers request rain, food, wealth, cattle, horses, heroic strength, speech,
    holy lore, and prosperity. Soma is described through images of light, flowing
    streams, heaven, rivers, milk, a steer, a horse, and a falcon, and is accompanied
    by hymns, singers, sisters, and ritual agents.
