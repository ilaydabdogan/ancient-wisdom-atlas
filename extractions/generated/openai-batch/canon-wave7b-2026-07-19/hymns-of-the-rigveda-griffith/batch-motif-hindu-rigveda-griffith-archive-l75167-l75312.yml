canonical_text:
  quote: With fervent heat exterminate the demons ; destroy the fiends with burning
    flame, O Agni.
  summary: The passage first gives explanatory notes on an obscure hymn involving
    Indra, Indrani, and Vrishakapi. It then presents a hymn to Agni in which the speaker
    invokes Agni/Jatavedas as a protector and Rakshas-slayer, asking him to attack
    Yatudhanas and other fiends with flame, teeth, shafts, noose, and divine sight;
    to guard the sacrifice and conduct it to the gods; to turn curses and falsehood
    against evildoers; and to prevent a demon from stealing or tasting the cow’s milk.
  language: English
  quote_policy: quoted
