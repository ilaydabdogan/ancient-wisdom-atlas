canonical_text:
  quote: ''
  summary: The passage praises Indra as sovereign, world-separating power, and battle-helper,
    then invokes Indra and Agni together as priests, warriors, car-riders, Vritra-slayers,
    and recipients of Soma, libations, sacrifice, and praise. A hymn to Agni presents
    him as praised with sacred food, moving on embassy between gathering-places, burning
    hostile speech and hatred, serving as messenger, bestowing power and gifts, and
    urging deities to receive offerings.
