literal_observations:
- id: obs:1
  text: The word or formula translated as “be drunk” is described as a symbol of the
    third pressing, yet is also used at the midday pressing because the gods become
    drunk at both points.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: For the midday Prasthita libations, the passage says that all use verses manifestly
    addressed to Indra, and some use verses containing forms translated as “penetrate
    towards.”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Indra is said not to have been victorious at the morning pressing, and to
    have penetrated toward the midday pressing with the relevant verses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the third pressing, verses containing terms such as strong, drink, press,
    and be drunk are recited for the goblet being filled, and are addressed to Indra
    and the Rbhus.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Prajapati, described as father, made the Rbhus immortal though they were mortal
    and gave them a share in the third pressing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Tristubh metre is used at the third pressing to make the pressing full
