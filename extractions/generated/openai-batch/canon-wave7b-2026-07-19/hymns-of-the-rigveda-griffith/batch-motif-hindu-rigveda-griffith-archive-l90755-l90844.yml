  summary: The passage explains ritual reasons for using particular Soma-offering
    verses, formulaic words, metres, and priestly offices at the midday and third
    pressings. It links Indra, the Rbhus, Prajapati, and other deities to the pressings,
    and explains how certain verbal forms and plural references function as ritual
    symbols.
  language: English
