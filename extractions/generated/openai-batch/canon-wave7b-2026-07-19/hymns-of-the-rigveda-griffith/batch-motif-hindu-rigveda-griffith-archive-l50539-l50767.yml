  quote: ''
  summary: The passage contains several hymnic sections praising Indra. The speaker
    invokes Indra through Soma-pressing, sacrifice, sacred grass, and songs; describes
    him as sovereign, king, warrior, giver of cattle, horses, wealth, light, and protection;
    recounts his defeat of Vala, Namuchi, Dasyus, and Vritras; and asks him to bring
    worshippers safely beyond enemies.
