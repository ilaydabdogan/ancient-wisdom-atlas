canonical_text:
  quote: ''
  summary: The passage contains Vedic sacrificial invocations and hymns centered on
    Agni. Night and Morning, divine priests, goddesses, Tvashtar, Vanaspati, Vayu,
    Pishan, the Maruts, and Indra are invoked for sacrifice and gifts. Agni is described
    as Offspring of the Waters, newly born, fiery, world-illuminating, brought by
    the Bhrigus to the earth’s central point, consuming trees, carrying prayers, guarding
    children, and being tended by paired ritual figures. A following hymn addresses
    a wise figure who is questioned, holds commands and admonitions, hears words,
    and appears as a victorious, newly born perfecter of sacrifice.
  language: English
  quote_policy: summarized
