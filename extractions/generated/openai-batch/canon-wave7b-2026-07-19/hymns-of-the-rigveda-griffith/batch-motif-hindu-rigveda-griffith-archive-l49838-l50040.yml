canonical_text:
  quote: ''
  summary: A sequence of Rigvedic verses invokes the Asvins/Nasatyas to come from
    heaven and mid-air, drink Soma at Kanva’s sacrifice, ride their ornamented car,
    remember and aid Vatsa/Kanva and other named figures, bestow wealth, food, renown,
    protection, and healing help, and make visible their three places. Notes identify
    the Lady on their car as Surya, daughter of the Sun, and interpret their three
    places as heaven, firmament, and earth.
  language: English
  quote_policy: summarized
