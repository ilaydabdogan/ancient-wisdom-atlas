canonical_text:
  quote: With these for me now milk the great wealth of ambrosia.
  summary: The passage contains text-critical notes followed by a translated ritual
    prayer. The hymn or prayer is described through truth, speech, mind, heart, Brahmins,
    rains, cows, deities, penance, ambrosia, and letters. Prajapati is said to have
    created the prayer as the essence of the Vedas. The prayer is identified with
    bhuh, bhuvah, svar, and the Veda, and is asked to milk children, life, breath,
    cattle, prosperity, glory, the world to come, courage, and sacrificial prosperity.
    A final ritual instruction involves the Adhvaryu, sacrifice, Om, Soma, and the
    singer of the hymn.
  language: English with transliterated Sanskrit terms
  quote_policy: quoted
