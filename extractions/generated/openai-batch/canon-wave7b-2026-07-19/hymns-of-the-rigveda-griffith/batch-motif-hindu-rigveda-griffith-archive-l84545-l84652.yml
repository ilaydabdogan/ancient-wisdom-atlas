canonical_text:
  quote: ''
  summary: 'Ritual prose explains the morning litany, Soma cups, breath, speech, and
    offerings. Speech is treated as a thunderbolt that can harm the sacrificer''s
    breaths if uttered before the proper cup offerings. The Hotr performs breath-supporting
    formulas, recites seated at the Sarpana, and addresses the Bahispavamana as the
    mouth of the sacrifice. A legend explains the morning milk mess: an Asura woman
    named Long Tongue licked the gods'' morning pressing and made it intoxicated;
    Mitra and Varuna remove the fault and choose the milk mess as their portion. A
    further explanation says cakes support the Soma pressings, are like citadels,
    are offered to Indra, and become part of the delights flowing to the sacrificer
    who knows the rite.'
  language: English
  quote_policy: summarized
