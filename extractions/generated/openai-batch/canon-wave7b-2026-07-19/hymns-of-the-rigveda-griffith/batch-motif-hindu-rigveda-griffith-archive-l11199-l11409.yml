canonical_text:
  quote: ''
  summary: The passage contains Vedic hymnic praise and petitions directed chiefly
    to Agni and then to Indra. Agni is invoked as household guardian, guest, priest,
    messenger, bearer of oblations, giver of riches, and protector from misery and
    Varuna’s chastisement. The passage also recalls Agni’s birth by Manu’s law and
    his being brought from far away by Matarisvan for Manu. Indra is invoked to bring
    his car for aid, to help in battle, to pour forth rain, and to drive away enemies
    and wicked speech.
  language: English
