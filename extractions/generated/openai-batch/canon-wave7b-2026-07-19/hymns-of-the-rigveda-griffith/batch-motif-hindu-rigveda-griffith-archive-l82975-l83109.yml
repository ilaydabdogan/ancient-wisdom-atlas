canonical_text:
  quote: The sacrifice went away from the gods (saying), ‘I shall not be your food.’
  summary: 'The passage explains the Pravargya in ritual-mythic terms: the sacrifice
    separates itself from the gods, is crushed, gathered back together, and healed
    by the Acvins. Subsequent verses and ritual actions place holy power, speech,
    breath, body, offspring, and entrails into the restored sacrificial entity, while
    other recitations repel Raksases and map bodily numbers onto ritual verses.'
  language: English
  quote_policy: quoted
