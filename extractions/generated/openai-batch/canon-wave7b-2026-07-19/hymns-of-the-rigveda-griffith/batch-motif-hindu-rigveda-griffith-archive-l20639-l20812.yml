  summary: The passage invokes deities and ritual powers for a Vedic sacrifice, then
    praises Agni as priest, envoy, household and cosmic fire, guardian of solar places,
    child of plants and parents, and recipient of oil-filled oblation. It asks for
    divine acceptance, progeny, cattle wealth, and protection.
  language: English
  quote_policy: summarized
