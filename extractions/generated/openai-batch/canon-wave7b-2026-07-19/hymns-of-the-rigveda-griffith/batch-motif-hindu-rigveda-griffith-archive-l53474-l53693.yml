canonical_text:
  quote: ''
  summary: 'The excerpt includes commentary and hymnic stanzas about Varuna, the Asvins,
    and Agni. Varuna is described as cosmic ruler, oceanic and far-seeing, who orders
    heaven and earth, overcomes darkness with light, and grants protection. A speaker
    asks to ascend a saving ship to cross misfortune, with a note identifying the
    ship as a metaphor for hymn and sacrifice. The Asvins are summoned to the Soma-draught.
    Agni is praised as sacrificial fire: his flames consume forests and plants, rise
    heavenward with smoke and wind, dwell in the floods and plants, are born anew,
    receive oil and offerings, bear Soma, and are approached with hymns for wealth
    and protection.'
  language: English
  quote_policy: summarized
