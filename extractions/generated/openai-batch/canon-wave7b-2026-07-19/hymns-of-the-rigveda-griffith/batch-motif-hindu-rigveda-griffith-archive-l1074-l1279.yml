  summary: The passage contains notes and verses from Rigveda Book 1, Hymns XII-XIV.
    Agni is invoked as messenger, purifier, priest, and fire of sacrifice; the worshipper
    asks him to summon the gods, sit on sacred grass, receive oblations, burn enemies,
    and bring prosperity. Hymn XIII presents an Apri-style sequence invoking Agni
    and deified ritual elements or deities, including Narasansa, sacred grass, Divine
    Doors, Night and Dawn, Invokers, Ila, Sarasvati, Mahi, Tvashtar, Vanaspati/Sovran
    of Wood, Svaha, and Indra. Hymn XIV begins by inviting Agni and other gods to
    come for Soma.
