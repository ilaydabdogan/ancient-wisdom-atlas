canonical_text:
  quote: ''
  summary: The passage explains the Agnihotra through cosmic correspondences, reciprocal
    movement of gods and humans as ritual fees, evening and morning offerings to Agni
    and Aditya, yearly counts of libations, reports about alternate-day performance,
    and an instruction favoring offering after sunrise. It also compares day and night
    to the wheels of the year and links correct ritual timing with attainment of the
    world of heaven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage equates elements of the rite with cosmic or natural entities:
    the sacrificial post with the sun, the altar with earth, the strew with plants,
    kindling wood with trees, sprinkling waters with waters, and enclosing sticks
    with the quarters.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: It states that whatever belonging to the knowing offerer is lost, dies, or
    is driven away comes to him in yonder world.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The evening libation leads men, and all that exists here, as fees to the gods;
    the morning libation leads the gods, and all that exists here, as fees to man.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gods are described as leaping up while recognizing a deed to do and a
    place to go.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: By the evening libation for Agni, the offerer begins the Acvina recitation,
    and speech utters a response.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: By the morning libation for Aditya, the offerer begins the Mahavrata, and
    breath utters a response concerning food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage gives seven hundred and twenty evening libations and seven hundred
    and twenty morning libations in the year, comparing their number to the fire-bricks
    accompanied by Yajus verses.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Vrsacusma Vatavata Jatiikarnya says that he will declare to the gods that
    the Agnihotra formerly performed on both days is now performed only on alternate
    days; a maiden seized by a Gandharva says a parallel statement to the fathers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage contrasts offering before sunrise and after sunrise and repeatedly
    instructs that the offering should be made after sunrise.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Day and night are called the wheels of the year; offering before sunrise is
    compared to going with a single wheel, while offering after sunrise is compared
    to going swiftly with wheels on both sides.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Night is connected with the Rathantara and Agni; day is connected with the
    Brhat and Aditya.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The deities are said to make the knowing after-sunrise offerer attain the
    vault of the tawny one, described as the world of heaven.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Near the end of the passage, the deity is described as proceeding while all
