canonical_text:
  quote: the waters welled out after; all around him Sarasvati hastened
  summary: A Brahmana-style ritual explanation recounts how Kavasa Ailisa was expelled
    from a Soma rite at the Sarasvati, found the child-of-the-waters hymn while thirsty
    in the wilderness, and was encircled by the waters. The passage then gives ritual
    instructions for reciting water-related verses in the Soma sacrifice, harmonizing
    different ritual waters, honoring the waters, and obtaining rain, offspring, fame,
    brilliance, cattle, and other desired results through correct knowledge and recitation.
  language: English
  quote_policy: quoted
