canonical_text:
  quote: ''
  summary: 'The passage moves from the mysterious naming of Idamdra as Indra to an
    account of three births: seed as self in a man, its joining to and nourishment
    by a woman, the support of the child for the continuation of worlds, and a later
    departure after old age followed by rebirth. It then quotes a verse attributed
    to Vamadeva speaking from the womb, describing knowledge of the gods, restraint
    by brazen forts, and escape like a hawk.'
  language: English
  quote_policy: summarized
