canonical_text:
  quote: In it in unity the gods exist, / Casting aside all evil by this lore, / The
    wise one rises to the world of heaven
  summary: The passage presents verses and notes about an undying principle, breath
    or Brahman, in which the gods are united. It describes poets moving beyond oppositions
    of speech and names, rejoicing in revelation, the wise rising to heaven through
    lore, the difficulty of naming breath by gendered names, and a divine chariot
    that destroys desires. Notes connect the harnessed steeds with the senses and
    compare the verses with related Brahmana, Grhya Sutra, Upanishadic, and Akhyana
    patterns.
  language: English
  quote_policy: quoted
