canonical_text:
  quote: ''
  summary: The passage contains invocations to Indra for victory in a chariot contest,
    military aid, wealth, cattle, steeds, and fame. Singers press and pour juice and
    offer songs to Indra, who is praised as thunder-armed, foe-slaying, and generous.
    The passage also praises Bribu for liberal bounty above the Panis and includes
    translator notes linking Bribu to a later legend in which Bharadvaja receives
    cows from him. A following hymn again calls on Indra in war and the steed race,
    asking him to help in a battle for sunlight, water, and life.
  language: English
  quote_policy: summarized
