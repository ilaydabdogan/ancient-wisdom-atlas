  summary: The passage invokes and praises the Maruts. It describes floods, brooks,
    rivers, rain-showers, chariots, an armed divine host, lightning, hail, mountains
    and hills shaken or cast down, a tree smitten, and waters released. The speakers
    ask the Maruts for protection, safety from slander, progeny, corn, wealth, heroes,
    a responsive king, and long life through hymns, oblation, and praise.
