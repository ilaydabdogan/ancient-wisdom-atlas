  quote: ''
  summary: This passage contains Griffith's notes and several Soma Pavamana hymns.
    Soma/Indu/Pavamana is purified, pressed, poured through the sieve, adorned with
    songs and milk, and directed to Indra and the Gods. The hymns request wealth,
    food, heroic strength, renown, and access to the Gods. Soma is also associated
    with rain, lightning, waters, the Sun and heavenly lights, the production or appearance
    of Gods, protection, and the defeat of enemies or riteless Dasyu.
