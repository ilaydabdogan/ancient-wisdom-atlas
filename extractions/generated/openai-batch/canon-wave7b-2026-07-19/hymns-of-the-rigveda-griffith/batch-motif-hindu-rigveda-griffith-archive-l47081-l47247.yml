  summary: The passage contains hymnic petitions to Indra and Varuna for sacrifice,
    riches, battle protection, offspring, and blessings; a Varuna hymn in which the
    speaker asks about sin, divine anger, release from inherited and personal offenses,
    and wisdom; and a Varuna hymn describing cosmic ordering, rivers, spies, secret
    names, heavens, earths, and a golden swing.
  language: English
