canonical_text:
  quote: ''
  summary: Personified metres go toward Soma. Jagati and Tristubh fly upward but return
    diminished, while Gayatri, aided by a safe-passage recitation, fetches Soma and
    the dropped syllables, is wounded by a Soma guardian’s arrow, and gives rise to
    several animal forms. The account explains the three Soma pressings, the syllabic
    forms of Gayatri, Tristubh, and Jagati, and later ritual supports involving Indra,
    cattle products, and the Adityas.
  language: English
  quote_policy: summarized
