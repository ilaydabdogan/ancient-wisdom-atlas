  summary: The passage gives ritual-exegetical explanations of Vedic verses. It identifies
    an initial word with food and with the first point of speech, relates speech to
    naming, and describes a hidden bodily/divine manifestation. It then explains verses
    about an oldest principle from which a terrible, powerful one is born, who destroys
    foes, is feared, and receives or holds all. The passage closes with an explanation
    of two becoming three through offspring, with prosperity in children and cattle
    for one who knows this.
