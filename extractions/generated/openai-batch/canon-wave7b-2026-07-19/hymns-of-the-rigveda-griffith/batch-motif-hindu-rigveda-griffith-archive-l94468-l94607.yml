canonical_text:
  quote: ''
  summary: The passage gives ritual instructions and explanatory mythic precedent
    for a royal consecration or renewal rite. An anointed Kshatriya descends, pays
    homage to holy power, gives a boon of conquest, tends the fire, steps toward the
    north-east, and reveres the unconquered quarter. A mythic account says the gods
    and Asuras contended for the worlds and quarters, with victory in the north-east.
    Further instructions use chariot formulas, hymns, Indra verses, household fire
    offerings, butter libations, and Soma formulas for conquest, restoration, protection,
    sovereignty, offspring, cattle, and freedom from danger.
  language: English
  quote_policy: summarized
