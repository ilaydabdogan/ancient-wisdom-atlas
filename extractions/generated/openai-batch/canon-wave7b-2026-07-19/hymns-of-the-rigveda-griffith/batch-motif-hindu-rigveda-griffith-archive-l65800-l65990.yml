canonical_text:
  quote: ''
  summary: A sequence of Soma Pavamana hymns calls on friends, priests, and pressers
    to sing to Soma, purify and press him with stones, filter him through sheep's
    wool, and mix or clothe him with milk and water. Soma/Indu is described as a divine,
    gold-hued, flowing juice, a child or calf, food and banquet for the gods, and
    a source of wealth, cattle, steeds, strength, success, and protection against
    demons and false beings. Soma flows especially for Indra, empowering him to win
    waters and wield the thunderbolt. The hymns also associate Soma with rain from
    heaven, light, vessels and beakers, inspired sagehood, and the ascent of Surya
    to heaven.
  language: English
  quote_policy: summarized
