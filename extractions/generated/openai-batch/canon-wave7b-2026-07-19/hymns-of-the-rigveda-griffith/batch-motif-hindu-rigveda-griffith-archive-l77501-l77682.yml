  quote: ''
  summary: The passage contains battle invocations asking Indra and other gods to
    support an army, protect warriors, and afflict enemies; a hymn inviting Indra
    to drink Soma and accept sacrifice and praise; verses describing Indra as giver,
    helper in battle, Vritra-slayer, and freer or guardian of waters; and a following
    hymn with obscure images of Indra’s bay steeds, a Bird, a bolt striking a Dasyu,
    sacrificial fire, and a self-bright Ship.
