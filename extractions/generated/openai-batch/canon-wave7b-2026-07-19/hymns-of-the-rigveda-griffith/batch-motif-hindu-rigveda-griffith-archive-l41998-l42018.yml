  summary: The passage combines Latin and English stanzas. It states that labor favored
    by the gods is not useless and speaks of overcoming rivals in a contest. It describes
    desire for a bull/man or husband, with Lopamudra drawing him to herself. It addresses
    Soma as near and inwardly imbibed, asks pardon for sins, and notes mortal longing.
    It then says Agastya labored for children, progeny, and power, cherished both
    classes, and with the gods obtained fulfillment of his prayer. A note gives alternate
    interpretations of “both classes.”
