canonical_text:
  quote: "“Flow onward, Soma, winning kine, and steeds and all that gives delight.”"
  summary: The passage contains Soma Pavamana hymns calling Soma/Indu to flow from
    waters, plants, and pressing boards, through fleece or a purifying sieve and into
    jars; to reach Indra and other gods; to grant wealth, animals, food, progeny,
    fame, and protection; and to aid victory over foes, including Vritra, who held
    back the floods. Soma is also described as thousand-eyed, high-born, a child borne
    by streams, blended with milk, radiant, red-hued, and armed with protective weapons.
  language: English
  quote_policy: quoted
