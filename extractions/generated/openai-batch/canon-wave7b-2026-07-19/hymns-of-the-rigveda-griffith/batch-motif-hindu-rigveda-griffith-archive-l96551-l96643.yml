canonical_text:
  quote: Let him reply, ‘Mind and speech.’
  summary: 'In a ritual instruction, anonymous speakers ask what begins the day. The
    answer is mind and speech: desires rest on mind because humans conceive desires
    with mind, and speech yields desires because humans express desires through speech.
    The instruction then says not to begin the day with a rc, yajus, or saman verse,
    but to say the three preliminary utterances first; these are identified with the
    three Vedas.'
