canonical_text:
  quote: ''
  summary: The passage contains portions of hymns invoking Indra, Pushan/Pashan, and
    the Asvins. Indra is summoned by the Kanvas to drink Soma, is strengthened by
    the pressed juice, defeats opponents, and grants protection and wealth. Priests
    press Soma and call Indra with his Bay Steeds. Pushan/Pashan is invoked for alliance,
    wisdom, riches, seed, and protection of cattle. A donor-king and herds of cattle
    are mentioned. A following hymn describes Dawn spreading light and the Asvins
    arriving by car, traversing distances and heavenly lights, opening paths, bringing
    wealth, and drinking sweets with Soma.
