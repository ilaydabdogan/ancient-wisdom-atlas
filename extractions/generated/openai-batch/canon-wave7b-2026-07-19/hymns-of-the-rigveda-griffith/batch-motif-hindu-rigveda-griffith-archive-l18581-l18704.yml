  quote: ''
  summary: The passage includes verses addressed to Brahmanaspati and to the Adityas,
    with source notes. Brahmanaspati is praised as a powerful divine helper who hears
    ritual call, grants wealth, cattle, offspring, victory, guidance, and deliverance
    to worshippers. The Adityas are invoked as kings who receive hymns, are pure and
    many-eyed, discern good and evil, uphold law, protect beings, and exact debts.
