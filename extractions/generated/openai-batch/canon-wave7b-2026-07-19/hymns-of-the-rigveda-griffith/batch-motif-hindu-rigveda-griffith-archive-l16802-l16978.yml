  summary: The passage contains sacrificial verses and notes followed by hymns to
    Agni. It presents divine figures protecting ritual grass, preparing an oil oblation,
    and forwarding offerings to the Gods. Agni is invoked as guest, messenger, sovereign,
    household fire established by the Bhrigus, priestly leader, teacher, guardian,
    and receiver of praise, flame, and sacrifice. The hymns describe his burning movement
    through night, forests, and earth, and ask him for wealth, heroes, offspring,
    food, strength, and success.
