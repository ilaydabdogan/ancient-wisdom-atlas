  summary: The passage contains hymns and notes concerning the Asvins or Nasatyas.
    It recalls Bhujyu’s rescue from the ocean, invokes the divine pair to a food-filled
    home and to sacrifice, describes their dwellings in fields, heavenly streams,
    and a mountain summit, asks for wealth, protection, and release from sickness,
    personifies Night yielding to Dawn, describes the Asvins’ treasure-bearing chariot
    and horses, recalls their aid to Chyavana, Pedu, Atri, and Jahusha, and states
    an ancestral friendship and common kinship between the Nasatyas and the worshippers.
  language: English
