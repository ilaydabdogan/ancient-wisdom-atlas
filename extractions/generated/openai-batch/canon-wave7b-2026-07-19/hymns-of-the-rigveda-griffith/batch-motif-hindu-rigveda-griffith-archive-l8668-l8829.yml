canonical_text:
  quote: Trita, when buried in the well, calls on the Gods to succour him.
  summary: A suffering speaker appeals to Earth, Heaven, and the gods about truth,
    Law, divine paths, and undeserved distress. The passage includes celestial imagery
    of rays, Bulls, Birds, floods, the Sun’s path, and wolves; it invokes Agni as
    priestly mediator and tells how Brihaspati hears and releases Trita from distress
    in a well. The closing lines pray for victory and divine rescue from distress.
  language: English
  quote_policy: quoted
