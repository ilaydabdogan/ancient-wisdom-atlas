canonical_text:
  quote: ''
  summary: A prose ritual instruction describes the “dying round the holy power,”
    in which natural deities enter one another, become concealed, and are later born
    again. The knower or ritual speaker uses formulas wishing the enemy’s death, concealment,
    non-birth, or removal. The teaching is attributed to Maitreya Kausirava and is
    said to have empowered King Sutvan against five kings.
  language: English
  quote_policy: summarized
