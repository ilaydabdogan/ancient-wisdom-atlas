  summary: The passage closes an Agni hymn with sacrificial praise and then presents
    hymns to Indra. Indra is invited to drink Soma and is praised for breaking cattle
    enclosures, freeing cattle, making the Sun and Morning visible, slaying Vritra
    or the Dragon with a thunderbolt, releasing obstructed waters toward the ocean,
    supporting heaven and earth, and acting as champion in battle. The passage also
    includes petitions for protection, wealth, sons, and victory, plus an editorial
    note comparing Heaven and Earth as divine parents with Greek Uranus and Gaia.
  language: English
