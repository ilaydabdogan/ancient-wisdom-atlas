canonical_text:
  quote: ''
  summary: 'The passage gives ritual instructions for the morning litany: specified
    numbers of recited verses are correlated with life, sacrifice, offspring, cattle,
    removal of defilement, heaven, and all desires. It identifies Prajapati with the
    year, sacrifice, and the litany, treats metres as limbs of Prajapati, explains
    recitation patterns through bodily and cattle imagery, and distinguishes divine
    recipients of Soma, victim, libations, Stomas, and metres. It ends by explaining
    how one concluding verse completes rites for Usas, Agni, and the Acvins.'
  language: English
  quote_policy: summarized
