  summary: The supplied passage contains commentary on obscure divine kinship and
    elder-god language, followed by hymnic invocations to Indra and Agni for battle
    aid, cattle, waters, sunlight, wealth, food, horses, and Soma-drinking. It also
    includes praise of Dawn as a footless maid moving through thirty steps and a hymn
    to Sarasvati as giver of Divodasa, breaker of hills with waves, slayer of hostile
    groups, revealer of rivers, and remover of poison.
