candidate_motifs:
- id: motif:1
  label: Sacrificial invocation and blessing of ritual elements
  taxonomy_refs:
  - sacrifice
  basis: The passage repeatedly mentions sacrifice, oblations, hymns, lauds, praise,
    pressing stones, sacred pillars, grass, and altar, and asks gods to accept or
    protect the offering.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:8
  confidence: high
  cautions: The passage is liturgical and petitionary, not a narrative account of
    a single completed sacrifice.
- id: motif:2
  label: Prayer exchange for protection, wealth, health, and offspring
  taxonomy_refs:
  - sacred_exchange
  basis: Lauds, hymns, oblations, and praise are offered while the speakers ask for
    safety, battle help, sons, riches, cattle, horses, health, and auspiciousness.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The exchange is expressed as petitionary praise, not as a formal contract.
- id: motif:3
  label: Watchful divine ruler removes sin and protects from harm
  taxonomy_refs:
  - divine_judgment
  basis: Varuna is described as thousand-eyed, seeing river paths, ruling living beings,
    and being asked to put sin far away and avert enemy arrows.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage emphasizes petition for protection and cleansing more than
    an explicit judgment scene.
- id: motif:4
  label: Water-associated dragon of the deep
  taxonomy_refs:
  - serpent
  basis: The Dragon born of floods and Dragon of the Deep is associated with streams,
    the Deep, and Ocean, and is invoked not to harm the sacrifice.
  evidence_refs:
  - ev:4
  - ev:9
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage does not narrate a combat with the dragon or identify it as
    evil; the figure is treated as an invoked power.
- id: motif:5
