canonical_text:
  quote: ''
  summary: The passage contains the close of one hymn and the opening of Hymn XXXV
    to the Visvedevas. It invokes many gods and cosmic powers for protection, battle
    help, wealth, offspring, auspiciousness, and acceptance of sacrifice. It includes
    Varuna watching the river paths, Agni as oblation-eater, the Waters' Child, the
    Dragon born of floods/Dragon of the Deep, Tvashtar, Mountains, Waters, Herbs,
    Trees, Heaven and Earth, Maruts, and numerous other divine beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Broad waters are said to swell their flood for a named divine referent, and
    strong heroes think of him among foes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speakers call for coursers to be set to the pole, for awakening to sacrifice,
    for speed toward battles and sacrifice, and for a flag or hero to be set up for
    the folk.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker addresses Agni while invoking the Gods, forming a hymn and sending
    a heavenly song toward the place where the Gods abide.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Varuna is described as mighty, thousand-eyed, beholding the paths in which
    rivers run, and having resistless sway over living beings.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The speakers ask that Varuna assist them among tribes, remove the threatening
    arrow of foes, and put bodily sin far away.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Agni is called oblation-eater, and the Waters' Child is to be chosen as a
    Friend and asked to be good to the speakers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Dragon born of floods is sung with lauds, is said to sit beneath streams
    in middle air, and is asked not to harm the faithful servant's sacrifice.
  category: speech
  evidence_refs:
  - ev:4
  - ev:10
- id: obs:8
  text: Heroes are to receive renown, pious men are to march to wealth, and divine
    or martial powers are said to burn foes as the Sun burns the earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Tvashtar is asked to give hero sons when wives draw near, to accept the hymn,
    and to give riches or store of wealth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Mountains, Waters, Herbs, Heaven, Earth, Forest-Sovrans, and both World-halves
    are asked to protect the speakers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Indra, Varuna, Mitra, Agni, Waters, Herbs, Trees, and the Maruts are asked
    to accept praise, grant refuge, and protect with blessings.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Hymn XXXV invokes groups and pairs of deities to be friendly, health-giving,
    auspicious, and helpful in battle.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Sacrifice, pressing Stones, sacred Pillars, tender Grass, and Altar are
