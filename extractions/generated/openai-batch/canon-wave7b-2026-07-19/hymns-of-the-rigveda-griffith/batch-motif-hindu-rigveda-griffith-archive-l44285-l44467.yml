comparison_claims:
- id: claim:1
  claim: Within this passage, the Dragon born of floods / Dragon of the Deep can be
    cautiously compared to the serpent or water-dragon motif family because it is
    explicitly a dragon associated with floods, streams, the Deep, and Ocean.
  claim_level: same_motif
  target: serpent or water-dragon motif family
  evidence_refs:
  - ev:4
  - ev:9
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage presents the dragon as an invoked power and does not include
    dragon-slaying, chaos combat, or a creation episode.
- id: claim:2
  claim: The repeated pattern of hymns, oblations, praise, and sacrifice offered while
    requesting protection, wealth, sons, health, and auspiciousness supports comparison
    to a sacred-exchange pattern.
  claim_level: same_function
  target: sacred_exchange motif family
