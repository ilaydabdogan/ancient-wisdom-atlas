canonical_text:
  quote: ''
  summary: The passage presents ritual explanations for the Mahavrata and the twelve-day
    Dvadashaha Soma rite. It says Indra became Vishvakarman after slaying Vrtra, and
    Prajapati became Vishvakarman after creating offspring. Prajapati desires propagation,
    practices fervour, discovers the twelve-day rite in his own limbs and breaths,
    performs it, and prospers. The rite is encircled by Gayatri and described as winged,
    eyed, luminous, and brilliant, enabling the knower to go to heaven. The rite’s
    component days are mapped to wings, eyes, and body. A further section describes
    consecration, purification, ritual rebirth, going to the gods, and the Brhati
    metre as a thirty-six-syllable means by which the gods attained the worlds.
  language: English
  quote_policy: summarized
