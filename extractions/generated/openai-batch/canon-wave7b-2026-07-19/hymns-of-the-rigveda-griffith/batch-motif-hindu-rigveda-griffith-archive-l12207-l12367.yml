canonical_text:
  quote: ''
  summary: The passage combines translator/editorial notes and hymn text. It discusses
    an interpretation of the Sun as an apparent image of a deeper reality perceived
    through Soma-aided spiritual sight; invokes the Asvins with golden chariot imagery;
    invites Indra to drink pressed Soma; asks Agni to speak to the gods; recounts
    a milch-cow given to the Angirases and milked with Aryaman; petitions the Maruts;
    names ancient sages and Manu as lineage witnesses; calls on Brihaspati and the
    Eleven Gods; and begins a hymn to Agni as altar fire, double-born child, consumer
    of trees, and darkness-dispelling flame.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An explanatory note reports Ludwig's interpretation that the Golden One or
    Sun in the home of Mitra and Varuna is an apparent image of a transcendent reality,
    recognized through spirit strengthened by Soma rather than bodily sight alone.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Living men call the Asvins with hymns of praise to their oblations, and the
    Asvins are associated with glories, nourishment, wealth, and a golden chariot
    whose fittings scatter drops.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Asvins are said to open heaven; their steeds are yoked for morning rites,
    and they are set on a golden car to seek mid-air by a direct path.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The addressed divine powers are asked for blessings day and night, and the
    speaker says the offerings brought to them shall not fail.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Pressed Soma-drops are offered to Indra so that they may gladden his heart
    and prompt him to give great wealth and come benevolently.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Agni is asked to hear quickly and to speak for the worshippers to the adorable
    gods and kings.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The gods are said to have given a milch-cow to the Angirases, who milked her;
    Aryaman joined them in the work.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The Maruts are asked that their deeds and glories not grow old or decay, and
    that they grant whatever is difficult to gain.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Dadhyach, Angiras, Priyamedha, Kanva, Atri, ancient sages, and Manu are said
    to have known the speaker's birth, and the speaker's lineage is said to stretch
    to the gods.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Invoker is asked to bless, offerers are asked to bring gifts, Brihaspati
    sacrifices with steers, and the sound of the press-stone is heard.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Very Strong is said to have gained the waters and many resting-places;
