canonical_text:
  quote: ''
  summary: 'The passage presents correspondences between syllables and bodily parts,
    enumerates these as matching the rays of the sun, teaches that the self is like
    syllables in number, and says that the knower gains union, likeness, nearness,
    prosperity, and full life. It then lists four persons: the bodily person, the
    person of metres, the person of the Veda, and the great person identified with
    the year and the sun. It concludes that the incorporeal conscious self and the
    sun are the same and cites a Rigvedic verse calling the sun the bright face and
    eye of gods.'
  language: English
  quote_policy: summarized
