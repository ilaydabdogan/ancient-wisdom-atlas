canonical_text:
  quote: ''
  summary: The passage invokes Dawn for wealth, offspring, cattle, horses, and auspiciousness;
    describes her as shining, waking creatures, repeatedly born anew, diminishing
    mortal life, driving off Night, and appearing with sunbeams. It then invokes the
    Asvins to come by chariot, bring strength, and drink Soma. A following hymn invokes
    Agni and Soma as a mighty pair who reward offerings, recover cattle from Pani,
    destroy enemies, find and set heavenly light, free bound rivers, and are associated
    with the bringing of fire from heaven and Soma from the mountain.
  language: English
  quote_policy: summarized
