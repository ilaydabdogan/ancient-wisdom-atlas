canonical_text:
  quote: ''
  summary: A sequence of Soma Pavamana hymns describes Soma as friend, hero, bull,
    steed, sage, and flowing juice. Soma is pressed, purified through sieve, wool,
    vats, reservoirs, and pitchers, offered to Indra and the Gods, associated with
    water, streams, rain, kine, milk, light, heaven and earth, treasure, song, and
    the defeat of hostile beings.
  language: English
  quote_policy: summarized
