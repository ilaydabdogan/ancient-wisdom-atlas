canonical_text:
  quote: ''
  summary: The passage explains ritual correspondences between bodily or numerical
    smallness, Vedic metres, offerings, Prauga recitation, and desired benefits. It
    reports alternative views on which metre should be used for the Prauga, assigns
    each metre a benefit such as splendour, life, valour, prosperity, food, strength,
    or cattle, then prescribes a Gayatri hymn by Madhuchandas because of its relation
    to brahman, honey, food, and the obtainment of all desires. It also states that
    the one-day Prauga is perfect and functions as atonement for forbidden acts done
    on that day.
  language: English
