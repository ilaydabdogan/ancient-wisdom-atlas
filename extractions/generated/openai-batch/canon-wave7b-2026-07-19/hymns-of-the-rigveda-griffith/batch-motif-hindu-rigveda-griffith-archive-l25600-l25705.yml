  text: The speaker craves the cow’s true gift arranged by Order; the cow is described
    as raw, black-hued, full of milk, nutritious, shining, and all-sustaining.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Agni is called a Bull sprinkled with oil by eternal Law, and Prisni the Bull
    is said to have milked a pure white udder.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Angirases, by Law, cleft the rock, sang hymns with the cattle, encompassed
