canonical_text:
  quote: ''
  summary: The passage discusses a teaching called a union. Taruksya guards his teacher’s
    cows for a year for this Upanisad. The passage cites Rgvedic verses about Vasistha
    and Bharadvaja bringing the Rathantara and Brhat, then states that knowing the
    union brings children, cattle, fame, glory, heaven, and full lifespan. Kauntharavya
    gives a chain of gradual union from speech through breath, air, All-gods, heaven,
    and brahman. Pancalacanda identifies the union with speech and describes speech
    and breath as mutually swallowing one another, with speech as mother and breath
    as son, supported by a Rgvedic bird-and-mother verse.
  language: English
