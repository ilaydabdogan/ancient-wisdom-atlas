  summary: The passage contains prayers to Indra for protection from hostile people,
    relief from pain and grief, and provision of a nourishing great Cow. A following
    Indra hymn presents him as filling earth and heaven, born from the Goddess Mother,
    able to subdue wickedness, send lightning, remove malevolence, and provide aid.
    The passage also includes notes identifying the Great Cow as probably Earth and
    the Goddess Mother as Aditi.
