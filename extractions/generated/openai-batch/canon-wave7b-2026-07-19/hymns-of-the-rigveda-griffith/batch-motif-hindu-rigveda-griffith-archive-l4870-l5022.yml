  quote: ''
  summary: The passage praises Indra under names including Maghavan, Sakra, and Satakratu.
    It describes his overwhelming strength, thunderbolt, roar, Soma-drinking, aid
    to named human allies, destruction of castles, battles with Sambara, Sushna, Vrtra,
    and sorcerers, release of obstructed waters and floods, and bestowal of treasure,
    protection, food, and offspring. A note explains Dyaus as Heaven and compares
    the name Dyaus/Dyaushpitar with Greek and Roman divine names.
