canonical_text:
  quote: ''
  summary: A sequence of Rigvedic hymns and notes addressed chiefly to Agni. Agni
    is praised as wealth-giver, protector, envoy between gods and humans, Herald,
    priest, purifier, radiant fire, chariot-rider, daily newborn power, and infant
    or germ hidden in wood and plants. The speakers ask for rain, food, strength,
    wealth, offspring, victory over foes, and safe divine favor through worship, songs,
    sacred grass, oil, oblations, cattle, and gifts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speakers praise Agni with songs and reverence and ask him to be a liberal
    prince, give rain, strength, and plentiful food, and drive away those who hate
    them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Agni is described as passing to and fro between two races as a skilled sage
    and as an envoy friendly to mankind; he is asked to worship the gods and sit on
    sacred grass.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Agni is called Bharata and asked to bring desired wealth, prevent divine or
    human malignity, and save the speakers from enmity.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speakers compare overcoming enemies through Agni’s favor to passing through
    streaming water-floods.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Agni is said to shine as purifier when worshipped with sacred oil and to be
    honored with barren cows, bullocks, and kine in calf.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Agni is described as wood-fed, bedewed with sacred oil, ancient, an invoker,
    excellent, the Son of Strength, and wonderful.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The harnessing of Agni’s car is praised; Agni guides worshippers, withers
    the foe, is extolled morning and evening, and shines like the sun with fiery flame.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speakers ask to dwell uninjured and conquer attackers with the help of
    Agni, Indra, Soma, and all the gods.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Agni is seated in the Herald’s place; he is bright, mighty, pure-tongued,
    keeps the Law from violation, and brings thousands.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Agni is called an envoy and protector from the foeman who leads the speakers
