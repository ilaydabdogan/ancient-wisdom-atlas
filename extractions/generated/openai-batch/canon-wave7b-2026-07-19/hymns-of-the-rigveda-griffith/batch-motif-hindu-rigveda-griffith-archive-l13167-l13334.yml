canonical_text:
  quote: ''
  summary: The passage includes ritual praise to Mitra-Varuna with oblations, oil,
    hymns, Aditi as a milch-cow, heavenly Waters, milk, and Agni as House-Lord; then
    hymns to Vishnu and Vishnu-Indra describing Vishnu’s three wide strides, his measuring
    and upholding of earth, heaven, and living creatures, his highest footstep and
    mansion, Indra and Vishnu turning aside Krisanu’s arrow, and further praise to
    Vishnu with oil and oblations.
