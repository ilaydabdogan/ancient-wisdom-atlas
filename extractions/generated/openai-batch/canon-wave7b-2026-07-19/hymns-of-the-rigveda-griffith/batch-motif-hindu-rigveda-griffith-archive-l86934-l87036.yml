canonical_text:
  quote: ''
  summary: The passage gives ritual instructions for offerings to Surya, sky, Usas,
    cow, and earth, identifying them with goddesses and metres; discusses ritual pairing
    and propagation; gives an anecdote about Cucivrksa Gaupalayana and Vrddhadyumna
    Abhipratarina; and narrates gods and Asuras contesting ritual chants, including
    Agni becoming a horse and Indra driving Asuras away with Varuna, Brhaspati, and
    Visnu.
  language: English
  quote_policy: summarized
