canonical_text:
  quote: ''
  summary: The hymn praises Agni as an ancient heavenly Child and divine fire established
    in wood, a friend, guest, herald, envoy, oblation-bearer, priest, household lord,
    protector, and wealth-giver. Worshippers kindle him with wood and offerings, ask
    him to carry worship to the gods and announce offerings to the Immortals, seat
    him on a nest-like wool-lined altar, and describe priests rubbing him forth for
    the gods' banquet.
  language: English
  quote_policy: summarized
