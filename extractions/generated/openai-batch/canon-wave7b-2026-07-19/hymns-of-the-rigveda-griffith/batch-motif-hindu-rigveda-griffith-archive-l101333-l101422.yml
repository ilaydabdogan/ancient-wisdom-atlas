  summary: The passage contains philological notes and translated invocatory verses.
    The speakers address Indra as generous, strong, wise, bearer of the bolt, lord
    of thunder, conqueror, and slayer of Vrtra. They ask him to come, drink, grant
    wealth, guide them, convey them beyond foes, place them in favour, and accept
    a new hymn. A final formula also invokes Agni, Indra, Visnu, Piisan, and the Gods
    to come from all sides.
