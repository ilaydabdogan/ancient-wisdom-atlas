canonical_text:
  quote: A Rsi says (RV., I, 164, 13), ‘I saw the guardian,’ for he is a guardian,
    for he guards all this.
  summary: 'The passage interprets a Rigvedic guardian as breath, describing it as
    untiring, moving on its ways, illuminating the directions, moving up and down
    in the worlds, and covering ether and all things. It then describes powers of
    a person: speech creates earth and fire, plants grow on earth, fire ripens them,
    and earth and fire serve speech as their parent. Breath creates the sky and air,
    with people following and hearing along the sky.'
  language: English
  quote_policy: quoted
