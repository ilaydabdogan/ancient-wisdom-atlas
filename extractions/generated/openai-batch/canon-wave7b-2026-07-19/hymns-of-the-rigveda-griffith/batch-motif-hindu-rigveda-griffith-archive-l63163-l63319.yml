canonical_text:
  quote: ''
  summary: 'The passage presents Soma Pavamana in ritual and cosmic roles: poured
    for Indra, drained and filtered by sages, mixed with milk and hymns, flowing through
    waters, granting wealth, supporting heaven and earth, and acting as guardian of
    Law. It also describes ships of truth carrying a pious man across, warders and
    bonds, the punishment of riteless or wicked persons, the thread of sacrifice in
    the sieve, three purifiers, and Soma as a youngling or pillar associated with
    wood, water, and heavenly light.'
  language: English
  quote_policy: summarized
