candidate_motifs:
- id: motif:1
  label: storm god defeats serpent or dragon and waters flow
  taxonomy_refs:
  - serpent
  - chaos
  basis: Indra is named slayer of Ahi; waters and rivers flow in the same hymn; Indra
    casts his bolt and weapons at Vritra and subdues him.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage does not explicitly state within one sentence that the waters
    were blocked by Vritra; that relation is inferred only from the immediate juxtaposition
    of waters and the Vritra combat.
- id: motif:2
  label: divine mother and heroic son with weapon
  taxonomy_refs:
  - divine_parent_child
  basis: Indra’s mother is said to proclaim him before he casts his bolt at Vritra,
    and an editorial note identifies the mother as Aditi.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage gives only a brief reference to the mother-son relation and
    depends partly on the note.
- id: motif:3
  label: sacred exchange of worship, Soma, and divine gifts
  taxonomy_refs:
  - sacred_exchange
  basis: The speaker refers to Soma pressing, libations, hymn, and homage while requesting
    protection, firm standing, cattle, descendants, wealth, heroes, and fame.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  - ev:14
  confidence: high
  cautions: The passage presents reciprocal ritual and blessing language but does
    not frame it as a formal contract.
- id: motif:4
  label: divine protection from snares, beasts, and falling
  taxonomy_refs: []
  basis: The speaker asks that divine nets and offenses be far away and asks the Holy
    Ones to save from wolf, pit, and falling.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: No available taxonomy reference closely matches this protection pattern.
- id: motif:5
  label: divinely aided chariot or car contest
  taxonomy_refs: []
  basis: The hymn asks many deities to help or speed the car; horses fly forth eager
    for renown, and the car seeks gain, strength, prize, or goal.
  evidence_refs:
  - ev:15
  - ev:16
  - ev:17
  - ev:18
  confidence: high
  cautions: An editorial note says 'car' may be figurative for a hymn of praise, so
    the literal chariot-race reading needs review.
- id: motif:6
  label: divine warrior aid against human enemies
  taxonomy_refs: []
  basis: Brihaspati, Indra, Sarasvati, and the Maruts are invoked for piercing, slaying,
    conquering, and taking possessions from enemies such as Vrikadvaras and the Sandikas
    chieftain.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:12
  - ev:13
  - ev:14
  confidence: high
  cautions: The passage combines mythic and apparently martial prayer contexts; the
    human historical setting remains uncertain.
comparison_claims:
- id: claim:1
  claim: The editorial note links the Indra-Vritra combat in this passage to another
    Rigvedic Vritra passage.
  claim_level: same_motif
  target: Rigveda I.32 Vritra episode
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim relies on an editorial cross-reference in the provided passage,
    not on the quoted text of Rigveda I.32 itself.
- id: claim:2
  claim: The editorial note connects the reference to Indra’s mother with a related
    legend in another Rigvedic hymn.
  claim_level: same_function
  target: Rigveda IV.18 legend concerning Indra’s mother
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only the note’s brief cross-reference and does not
    include the other hymn’s narrative.
- id: claim:3
  claim: Within the passage, Ahi, Vritra, and the Dragon of the Deep support a cautious
    comparison to a recurring serpent/dragon sacred-being pattern.
  claim_level: same_motif
  target: serpent or dragon motif family
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:19
  counter_evidence_refs: []
  confidence: medium
  limitations: The Dragon of the Deep is invoked rather than fought, so it should
    not be simply equated with Ahi or Vritra without review.
