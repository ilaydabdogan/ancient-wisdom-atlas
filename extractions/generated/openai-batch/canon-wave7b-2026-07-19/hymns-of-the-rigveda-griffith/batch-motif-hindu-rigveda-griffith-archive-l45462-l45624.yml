canonical_text:
  quote: ''
  summary: The passage contains hymnic stanzas to the Maruts. They are described as
    adorned, gold-bearing, rain-gleaming, weapon-bearing storm deities who receive
    praise, household sacrifice, oblations, and a ritual banquet. The speaker asks
    them for wealth, heroic sons, offspring, protection from enemies, victory in conflict,
    shelter, and aid in crossing waters to fair lands. Later stanzas describe them
    making heaven and earth tremble, making springs flow, pouring rain, and being
    feared at their coming.
  language: English
  quote_policy: summarized
