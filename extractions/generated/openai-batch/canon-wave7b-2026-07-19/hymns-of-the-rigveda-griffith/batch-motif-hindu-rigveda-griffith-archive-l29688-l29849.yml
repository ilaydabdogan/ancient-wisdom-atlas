  summary: The passage includes hymnic praise of Heaven and Earth as luminous, rain-giving,
    law-observing cosmic deities; an agricultural hymn invoking the Master of the
    Field, Suna and Sira, Sita the Furrow, Indra, Pushan, and Parjanya for ploughing,
    sweetness, milk, fruits, and prosperity; and the opening of a hymn to Ghrita,
    the sacrificial clarified butter or holy oil, described as a wave of sweetness
    from the ocean connected with Amrit. Editorial notes identify agricultural personifications,
    ritual use at the start of ploughing, and the Dragon of the Deep, Ahibudhnya.
