canonical_text:
  quote: ''
  summary: The passage praises the Maruts as a powerful storm-like host associated
    with chariots, weapons, lightning, rain, food, offspring, and ritual song. A Maiden
    or Rodasi is set upon their car and identified in notes as lightning or the bride
    of the Maruts. The hymns invoke the Maruts and Indra for aid, protection, battle-friendship,
    offspring, and abundant food. Prishni is described as bringing forth the Maruts,
    who are linked with storm-clouds, water-floods, roaring rivers, and fertile plenty.
  language: English
