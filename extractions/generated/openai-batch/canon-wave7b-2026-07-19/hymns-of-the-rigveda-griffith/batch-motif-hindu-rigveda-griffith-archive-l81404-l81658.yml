- id: motif:1
  label: Soma offering and sacred exchange
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: The passage repeatedly links Soma, oblation, pressed juice, and sacrificial
    gifts with divine protection, uninjured life, victory, royal sway, and the bearing
    of gifts to heaven.
  evidence_refs:
