canonical_text:
  quote: ''
  summary: 'The passage contains several Rigvedic hymns or fragments: a Bright God
    drinks Soma and appears as victorious light; Indra aids Soma-pressers, acts against
    a combatant, frees Venya, and is asked to bring the Sun eastward; Dawn comes with
    cows and drives away gloom; a king is ritually established and made victorious;
    press-stones are addressed in Soma pressing; the Ribhus and Agni/Jatavedas are
    praised; and sages behold a magical Bird associated with Speech in the ocean depth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bright God is asked to drink Soma-mingled meath, give uninjured life to
    the lord of sacrifice, guard offspring, nourish them with food, and shine over
    many lands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same radiant figure rises as a light, kills Vritras and enemies, is described
