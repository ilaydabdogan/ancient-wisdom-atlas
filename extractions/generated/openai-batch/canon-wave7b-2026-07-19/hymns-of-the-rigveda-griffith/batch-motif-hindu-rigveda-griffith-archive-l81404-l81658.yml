  - ev:7
  - ev:8
  confidence: high
  cautions: The passage is hymn-fragmentary and contains OCR noise, but the ritual
    exchange pattern is explicit.
- id: motif:2
  label: Radiant divine combat against enemies
  taxonomy_refs:
  - chaos
  basis: The Bright God rises as a light that kills Vritras and enemies and is called
    a slayer of Dasyus, Asuras, and foes.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage names enemies but does not narrate a full chaos-combat myth;
    the taxonomy link is therefore broad.
- id: motif:3
  label: Royal establishment through divine sanction
  taxonomy_refs:
  - royal_legitimacy
  basis: The king is chosen, made steadfast like a mountain, supported by Indra and
    other gods, and made victorious and sovereign by ritual offering and divine aid.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The hymn is a benediction and victory rite rather than a narrative accession
    myth.
- id: motif:4
  label: Return of the Sun from west to east
  taxonomy_refs:
  - return
  basis: Indra is asked to bring the Sun, now in the west, back to the east, even
    against the will of the Gods.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage gives a brief request rather than an extended solar-cycle
