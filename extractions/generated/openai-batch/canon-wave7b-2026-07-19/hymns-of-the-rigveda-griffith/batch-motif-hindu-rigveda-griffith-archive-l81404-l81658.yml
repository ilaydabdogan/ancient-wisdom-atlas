  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Indra protected Ita’s car and heard the Soma-giver’s call.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Indra bore the head from the skin or body of a swift-moving combatant; the
    supplied note says the combatant is identified in Sayana’s legend as Sacrifice
    personified.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Indra is said to have set Venya free for the devout Astrabudhna and is asked
    to bring the Sun in the west back to the east, even against the will of the Gods.
