  summary: The passage includes hymnic appeals to Heaven and Earth as primal parents,
    to Vastoshpati as guardian of the homestead, a sleep-charm addressed to Sarama's
    Son and others around a dwelling, and a hymn to the Maruts as radiant, storm-like
    divine heroes of uncertain birth who receive pure sacrifice.
