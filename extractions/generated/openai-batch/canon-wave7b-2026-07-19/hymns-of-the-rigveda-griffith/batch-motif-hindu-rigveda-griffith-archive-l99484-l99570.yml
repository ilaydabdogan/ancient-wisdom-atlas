canonical_text:
  quote: ''
  summary: An unnamed thinking figure considers the worlds and their guardians and
    creates food for them by brooding over waters. The created food seeks to go away.
    He repeatedly fails to grasp it by speech, scent, sight, hearing, touch, mind,
    and the generative organ, but obtains it by down-breathing. Vayu is identified
    as the one who lays hold of food and lives by food. The figure then asks how the
    functions can exist without him, splits open the top of the skull, enters through
    that door, and is associated with three dwelling-places and three dreams.
  language: English
  quote_policy: summarized
