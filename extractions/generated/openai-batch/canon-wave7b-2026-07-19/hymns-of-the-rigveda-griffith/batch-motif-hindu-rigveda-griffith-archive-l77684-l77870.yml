canonical_text:
  quote: ''
  summary: The passage contains a fragment of notes and verses from a preceding hymn,
    then Hymn CVI to the Asvins, followed by a hymn to Dakshina or Guerdon. The Asvins
    are invoked as a paired divine addressee summoned to worship, banquet, shared
    work, honey, and one chariot. The Dakshina hymn praises sacrificial bounty and
    liberal donors, associating gifts with light, heaven, long life, social honor,
    wealth, food, protection, and victory.
  language: English
  quote_policy: summarized
