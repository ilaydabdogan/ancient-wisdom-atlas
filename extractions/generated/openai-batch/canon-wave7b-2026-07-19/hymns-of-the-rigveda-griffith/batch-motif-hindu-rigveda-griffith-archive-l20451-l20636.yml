canonical_text:
  quote: ''
  summary: The passage praises Agni as bright, gold-haired, true to law, priest, envoy,
    herald, sacrificer, household friend, and mediator between earth, heaven, gods,
    and humans. Notes explain Agni’s forms as sun, lightning, and domestic fire, the
    latent germ of fire in fire-sticks, and his lion and bull imagery. Subsequent
    verses invoke Agni for prosperity, food, strength, sons, protection, and the arrival
    of the gods at worship, including an Apri hymn in which kindled fuel, flashes,
    libation, oil, ascending flames, and sacred grass are part of the rite.
  language: English
  quote_policy: summarized
