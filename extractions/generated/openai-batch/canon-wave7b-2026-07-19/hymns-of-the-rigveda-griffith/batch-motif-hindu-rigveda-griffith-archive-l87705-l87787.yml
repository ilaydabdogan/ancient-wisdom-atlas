canonical_text:
  quote: "“He mounts the difficult mounting; the difficult mounting is the world of
    heaven”"
  summary: The passage describes ritual days, chants, and stomas as paths, supports,
    and fastenings connected with the world of heaven. It says the gods raised Aditya
    to heaven, feared his falling, propped and fastened him with ritual structures,
    and saved the worlds with the Svara Samans. It also prescribes offerings and recitations
    for Surya and describes the difficult mounting as mounting the world of heaven.
