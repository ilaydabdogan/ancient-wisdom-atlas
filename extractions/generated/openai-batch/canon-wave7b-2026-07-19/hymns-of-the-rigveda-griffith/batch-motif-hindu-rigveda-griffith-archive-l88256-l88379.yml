canonical_text:
  quote: The Prsthya Sadaha—Second Day
  summary: The passage gives ritual prescriptions and symbolic criteria for the second
    day of the Prsthya Sadaha within the Soma sacrifice. It names Indra as supporting
    the second day, lists verbal and metrical markers treated as symbols of that day,
    assigns various hymns to deities and ritual uses, and recounts that Caryata Manava
    corrected the Angirases’ second-day performance so that they discerned the sacrifice
    and the world of heaven.
  language: English
