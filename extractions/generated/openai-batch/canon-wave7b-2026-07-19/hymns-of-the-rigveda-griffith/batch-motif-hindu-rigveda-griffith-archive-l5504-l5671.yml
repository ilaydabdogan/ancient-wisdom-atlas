canonical_text:
  quote: ''
  summary: 'The passage praises Indra and related divine figures through hymnic verses
    and notes: a wonder-working deity makes four rivers flow, separates Heaven and
    Earth, and sets Night and Dawn in alternation; notes recount Sarama’s recovery
    of stolen cows and Brihaspati’s cleaving of a mountain. A hymn to Indra describes
    his birth shaking earth, heaven, mountains, and creatures, his use of the thunderbolt,
    his defeats of Sushna, Vritra, Dasyus, and castles, and his aid to named human
    allies. The opening of a hymn to the Maruts calls for a pure gift and compares
    prepared songs to ritual water.'
  language: English
  quote_policy: summarized
