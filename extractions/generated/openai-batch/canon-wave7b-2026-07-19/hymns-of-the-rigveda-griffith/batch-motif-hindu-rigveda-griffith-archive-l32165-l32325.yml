canonical_text:
  quote: ''
  summary: 'The passage contains Indra hymnic stanzas and notes: Indra is praised
    as a warrior for cattle, protector and giver of wealth, recipient of Soma offerings,
    slayer of a monstrous beast after receiving a weapon from Usana, avenger against
    those who neglect him, plunderer of niggards, and patron in contests over cows.
    Several human patrons give horses and wealth. A brief Agni stanza asks that waters
    yield plenty, and the opening of another Indra hymn invokes Indra''s conquering
    aid.'
  language: English
  quote_policy: summarized
