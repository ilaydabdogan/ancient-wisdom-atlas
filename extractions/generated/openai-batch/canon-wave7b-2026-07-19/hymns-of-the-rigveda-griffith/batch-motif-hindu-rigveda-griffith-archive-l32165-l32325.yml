candidate_motifs:
- id: motif:1
  label: Monster or serpent slaying with a gifted weapon
  taxonomy_refs:
  - serpent
  basis: Indra receives a thousand-pointed weapon from Usana in order to slay the
    monstrous beast identified by the note as Vritra or Ahi.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The English passage calls the opponent a monstrous beast; the serpent
    classification rests on the note's identification of Ahi and should be checked
    against the Sanskrit context.
- id: motif:2
  label: Sacrificial exchange between worshipper and deity
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Worshippers press Soma and offer gifts; Indra receives Soma and praise and
    gives protection, riches, progeny, kine, or wealth to the pious and offerers.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage presents several related exchanges across adjacent hymnic
    stanzas rather than a single narrative episode.
- id: motif:3
  label: Divine patron rewards piety and punishes neglect
  taxonomy_refs:
  - divine_judgment
  basis: Indra favors those who pour Soma and offer gifts, while he is described as
    avenger, killer, plunderer of niggards, and conqueror of those who provoke him.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage emphasizes ritual allegiance and patronage as much as moral
    judgment; the divine_judgment taxonomy fit is interpretive.
- id: motif:4
  label: Cattle wealth won through divine warrior patronage
  taxonomy_refs:
  - sacred_exchange
  basis: Indra wars for cattle, gives kine to the pious, and chooses an ally in a
    conflict over beautiful cows, sending the kine to him.
  evidence_refs:
  - ev:1
  - ev:8
  - ev:10
  confidence: high
  cautions: This motif is strongly present literally, though available taxonomy has
    no specific cattle-raid family.
- id: motif:5
  label: Solar darkening or eclipse caused by divine action
  taxonomy_refs: []
  basis: Indra is said to form a Dasa-like nature for Surya in his abode, and the
    translator's note explains this as an eclipse of the sun.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The eclipse reading is supplied by the note; the hymn line itself is terse
    and metaphorical in translation.
- id: motif:6
  label: Invocation of conquering divine aid
  taxonomy_refs: []
  basis: The speakers ask Indra to bring his effective power and all aids, specifically
    power that conquers men and wins spoil.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: This is an invocation pattern rather than a developed narrative motif.
- id: motif:7
  label: Waters as providers of plenty
  taxonomy_refs:
  - water
  basis: The stanza asks the collected waters to yield plenty and bright dominion
    to Agnivesi Satri.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The water symbolism appears briefly in a single stanza.
comparison_claims:
- id: claim:1
  claim: The translator's note explicitly compares the stanza's image of Indra dancing
    forth heroic exploits to a wider pattern in which battle is regarded as a war
    dance.
  claim_level: same_function
  target: War-dance imagery in Old German poetry and Homer, as mentioned in the passage
    note
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is in a translator's explanatory note, not in the Rigvedic
    verse itself, and no specific Old German or Homeric passage is quoted here.
