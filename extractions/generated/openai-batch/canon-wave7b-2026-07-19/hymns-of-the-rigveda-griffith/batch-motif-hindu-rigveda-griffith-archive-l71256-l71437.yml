  quote: ''
  summary: The passage presents Indra proclaiming victories, control over rivers and
    floods, and the placing of milk in cows, followed by a hymn praising Indra’s power
    in war, his relation to Soma/libations, and his aid to worshippers. It then presents
    a hymn and note about Agni hiding in waters and plants out of fear of sacrificial
    service, being found by the gods and Yama, and being summoned to resume carrying
    oblations Godward.
