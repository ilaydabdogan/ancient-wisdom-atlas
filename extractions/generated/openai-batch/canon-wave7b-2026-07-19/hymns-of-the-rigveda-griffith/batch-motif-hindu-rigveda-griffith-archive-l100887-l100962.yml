  summary: The passage describes an ominous vision involving a driver with asses,
    boars, red flowers, a black cow, and a black calf moving southward. It prescribes
    fasting, a milk oblation with verses from the Ratri hymn, feeding Brahmins, and
    eating the oblation. It then teaches that the inner person in all beings is the
    true self and presents an Upanisad of speech mapping mutes, sibilants, and vowels
    onto cosmic regions, deities or elements, Vedas, senses, and breaths, before mentioning
    a divine lute.
