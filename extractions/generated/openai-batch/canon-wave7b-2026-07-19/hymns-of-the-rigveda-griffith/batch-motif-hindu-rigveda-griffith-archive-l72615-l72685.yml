canonical_text:
  quote: ''
  summary: The passage contains prayers for divine guidance, happiness, battle protection,
    blessing on paths, waters, wombs, and wealth. It praises Aditi, the Adityas, the
    Maruts, Indra, Svasti, and other divine figures, then opens a hymn to the Visvedevas
    by asking which god will hear the sacrifice and give aid. It includes a catalogue
    of invoked deities and notes on serpents’ powers, the heavenly ship, Agni, Svasti,
    and Ahi of the Deep.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mortal who is untouched by evil is said to thrive, follow the Law, increase
    through progeny, and be led by the Adityas through pain and grief to happiness.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note glosses “serpents’ powers” as “of unsurpassable wisdom,” and describes
    a “heavenly Ship” as a metaphorical expression for sacrifice according to Siyana.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker asks the Gods and Maruts to guard and grace a battle setting,
    and asks to ascend Indra’s conquering car that sets forth at dawn and does not
    break.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker requests blessing in paths, desert tracts, waters, battle for
    light, wombs that bring male children, and the gain of wealth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Svasti is described as noble, rich, coming by a distant pathway, preserving
    at home and far away, and dwelling under the protection of the Gods.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:11
- id: obs:6
  text: The thoughtful sage, identified as the son of Plati and as Gaya in the note,
