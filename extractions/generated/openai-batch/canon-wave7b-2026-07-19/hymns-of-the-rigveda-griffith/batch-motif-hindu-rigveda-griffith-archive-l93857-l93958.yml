canonical_text:
  quote: ''
  summary: 'A Brahman instructs a king about foods that a Kṣatriya sacrificer should
    avoid and about the king''s proper food: the descending growths and fruits of
    several trees. The passage links Soma, curds, and water to social groups and offspring
    consequences; explains the origin of the Nyagrodha tree from divine sacrificial
    goblets; and describes royal empowerment through eating tree products and preparing
    Soma rites.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Brahman agrees to tell the king the requested teaching.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists three possible foods—Soma, curds, and water—and assigns
    them respectively to Brahmans, Vaiçyas, and Cudras, with consequences for the
    offspring of a Kṣatriya.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king as Kṣatriya sacrificer is told not to desire the three foods and
    instead to consume pressed descending growths and fruits of the Nyagrodha, Udumbara,
    Acvattha, and Plaksa trees.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The gods are said to have gone to the world of heaven by sacrifice; at that
    place they tilted over goblets, which became Nyagrodha trees.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage explains the Nyagrodha's downward growth through the goblets'
    downward movement and says its name is treated mysteriously by the gods.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sap of the goblets becomes the Nyagrodha's descending growths and fruits;
    the Kṣatriya who eats these does not depart from his proper food and obtains Soma
    drinking mysteriously.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Nyagrodha is identified with Soma the king and with the lordly power of
    trees; the Kṣatriya establishes lordly power in himself by eating its descending
    growths and fruits.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Nyagrodha is compared to the Kṣatriya's relation to the kingdom because
    both are described as fastened and supported.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'Udumbara, Acvattha, and Plaksa are each assigned an origin and a royal or
    controlling quality: strength and proper food; brilliance and overlordship; might,
    self-rule, and control.'
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Adhvaryu is instructed to prepare implements for Soma pressing, including
    a skin, pressing boards, tub, filter cloth, pressing stones, vessels, a drawing
    cup, and a goblet.
  category: action
  evidence_refs:
  - ev:8
