canonical_text:
  quote: He placed himself in the middle of all that is.
  summary: 'The passage identifies the sun and prana as corresponding representations,
    then explains a sequence of names or groups of seers as arising from prana''s
    actions and qualities: approaching for one hundred years, occupying the middle
    of all, functioning as up-breathing and down-breathing, being friend and dear
    to the gods, protecting from evil, supporting offspring, being richest, going
    forth to all, purifying all, and wishing to be everything small and great.'
  language: English
  quote_policy: quoted
