  quote: ''
  summary: A hymn addresses Dawn or the Dawns as red, shining, female divine figures
    who spread light in the eastern sky, bring perception, sing, adorn themselves,
    create light for living beings, open and drive away darkness, receive praise from
    the Gotamas, and bestow strength, offspring, people, cattle, and horses on worshippers
    who pour Soma juice.
