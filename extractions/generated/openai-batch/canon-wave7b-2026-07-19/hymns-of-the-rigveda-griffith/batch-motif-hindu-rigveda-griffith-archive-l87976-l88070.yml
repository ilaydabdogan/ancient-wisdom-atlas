canonical_text:
  quote: ''
  summary: The passage explains the twelve-day rite as a sacrifice first performed
    by Prajapati and then exchanged between Prajapati, the seasons, and the months.
    It links consecration, evil-removal, daylight and darkness, support between the
    year and its divisions, Indra’s recognized superiority after a rite by Brhaspati,
    a threefold ritual order mapped to cosmic directions and powers, the seasonal
    recovery of consecration in the cool season, and preparatory offerings to Prajapati
    and Vayu ending with spring, sap, and strength.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Prajapati first sacrifices with the twelve-day rite and commands the seasons
    and months to make sacrifice for him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The seasons and months ask for a gift before sacrificing; Prajapati gives
    them sap and strength, and the passage says sacrifice should be made both when
    giving and when receiving.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first half consecrates first and smites away evil, while the second half
    consecrates afterward and does not smite away evil; the passage associates them
    respectively with daylight and darkness.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Prajapati as the year and the seasons and months are said to find support
    in one another; the sacrificer with the twelve-day rite finds support in the priest.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The gods initially do not admit Indra’s seniority and superiority; after Brhaspati
    sacrifices for him with the twelve-day rite, they admit it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The rite’s three sets of three days are arranged as ascending, transverse,
    and descending, and are connected with Agni upward, Vayu and waters transversely,
    and the sun, rain, and constellations downward.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Consecration departs from the gods; after attempts with several seasonal pairs
    of months, they obtain it with the two months of the cool season.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the cool season, village and wild cattle become thin and shaggy and are
    said to acquire the form of consecration.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Before consecration, a victim is offered to Prajapati with seventeen kindling
    verses; the Apri verses are by Jamadagni, and the cake offering for the victim
    is for Vayu because Prajapati is identified with Vayu.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In a sacrificial session, the fires are deposited together, all are consecrated,
    all press, and the rite ends with spring, which is identified with strength and
    with sap and strength.
  category: sequence
  evidence_refs:
  - ev:8
