canonical_text:
  quote: ''
  summary: A sequence of Soma Pavamana hymns invokes Soma as a purified, flowing drink
    or being. Soma is pressed, cleansed with waters, mixed with milk or curds, filtered
    through sieve or filter, collected in jars, vats, or reservoirs, praised by hymns,
    and directed to Indra, Vayu, the Maruts, and the Gods. The hymns ask Soma to bring
    fame, wealth, cattle, food, progeny, strength, light, and victory; Indra drinks
    Soma and smites foes. Soma streams are repeatedly likened to steeds, cars, armies,
    winds, rain-storms, and flames, and are described in relation to high realms,
    threads, and the shining Sun.
  language: English
  quote_policy: summarized
