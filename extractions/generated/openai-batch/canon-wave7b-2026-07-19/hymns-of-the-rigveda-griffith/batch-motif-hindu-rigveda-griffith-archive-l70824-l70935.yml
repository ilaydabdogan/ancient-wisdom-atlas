  summary: The passage praises Agni as kindled in waters and heaven, born with flame
    and radiance, a king and guardian connected with Soma, a world-germ who fills
    heaven and earth, an immortal envoy among mortals, and a god who rewards offerings
    and worship. It also describes Agni being pursued and found by the Bhrigus in
    gathered floods and found by Trita on the Cow’s forehead, with notes identifying
    watery or cloudy settings with lightning imagery.
