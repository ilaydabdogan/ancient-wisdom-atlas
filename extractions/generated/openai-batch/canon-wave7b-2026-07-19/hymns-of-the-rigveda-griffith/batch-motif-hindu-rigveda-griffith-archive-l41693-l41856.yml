candidate_motifs:
- id: motif:1
  label: sacrifice and ritual offering to divine or sacralized powers
  taxonomy_refs:
  - sacrifice
  basis: The passage repeatedly refers to sacrifices reaching Soma-Rudra, Soma-draughts,
    an oblation associated with the car, and adoration paid to the shaft.
  evidence_refs:
  - ev:2
  - ev:12
  - ev:13
  - ev:18
  confidence: high
  cautions: The passage emphasizes ritual address and offering; it does not narrate
    an animal or human sacrificial act.
- id: motif:2
  label: protective sacred exchange through invocation
  taxonomy_refs:
  - sacred_exchange
  basis: Speakers request blessings, medicines, release from sin and a divine noose,
    protection from evil, and martial victory in connection with sacrifices, Soma-draughts,
    oblation, prayer, and adoration.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:13
  - ev:18
  confidence: medium
  cautions: The reciprocal structure is implied by prayer and offering rather than
    explicitly stated as a bargain.
- id: motif:3
  label: divine judgment through binding noose
  taxonomy_refs:
  - divine_judgment
  basis: The hymn asks Soma-Rudra to release the speakers from Varuna's noose, and
    the note describes Varuna as moral governor armed with a noose for capture and
    destruction of the wicked.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The judgment function is supplied partly by the explanatory note; the
    verse itself only mentions release from the noose.
- id: motif:4
  label: personified weapons as martial agents
  taxonomy_refs: []
  basis: Bow, bowstring, bow-ends, quiver, reins, whip, brace, shaft, and arrow are
    personified or directly addressed and given protective or destructive roles in
    battle.
