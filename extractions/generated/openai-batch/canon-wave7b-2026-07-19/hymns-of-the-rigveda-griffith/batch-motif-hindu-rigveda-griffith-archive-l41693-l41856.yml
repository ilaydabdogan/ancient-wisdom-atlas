canonical_text:
  quote: ''
  summary: The passage includes a fragment praising Brihaspati as a battle-victor
    who breaks enemies' castles, wins cattle, seeks waters and light, and smites foes.
    A Soma-Rudra hymn asks the paired deities to receive sacrifices, bless people
    and animals, drive sickness and Nirriti away, provide medicines, remove sin, and
    release worshippers from Varuna's noose. A weapons hymn personifies mail, bow,
    bowstring, bow-ends, quiver, chariot, horses, reins, arrows, whip, brace, and
    shaft as martial agents that protect the warrior and defeat enemies.
  language: English
  quote_policy: summarized
