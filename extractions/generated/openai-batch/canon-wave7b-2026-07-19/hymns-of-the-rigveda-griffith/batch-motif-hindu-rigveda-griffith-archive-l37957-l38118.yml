canonical_text:
  quote: ''
  summary: 'The passage contains hymn verses and notes centered on Indra. It praises
    Indra as unwithered by time, unimpeded by mountains or depths, and invoked for
    protection, sons, food, and victory. Subsequent hymns ask Indra to aid battle,
    defeat Dasyu/Dasa and other hostile bands, protect allies, and grant victory.
    The passage also recalls Indra''s earlier deeds: winning daylight, defeating Sushna,
    cleaving an invulnerable demon''s head, bringing a battle-car, aiding named allies,
    slaying Sambara of the mountain, sending Chumuri to sleep, and killing great numbers
    of foes.'
