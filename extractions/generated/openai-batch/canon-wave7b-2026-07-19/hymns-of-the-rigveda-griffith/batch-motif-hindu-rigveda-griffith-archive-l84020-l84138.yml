canonical_text:
  quote: ''
  summary: 'The passage gives ritual explanations for the animal and Soma sacrifices:
    a cake is treated as the killed victim and mapped to animal body parts; verses
    to Agni and Soma describe constellations placed in the sky and rivers released;
    the omentum offering frees the consecrated sacrificer; other verses connect sky,
    mountain, sap, strength, food, and cattle; and the Manotas of the gods are identified
    as speech, cow, and Agni, with all Manotas uniting in Agni.'
  language: English
  quote_policy: summarized
