canonical_text:
  quote: ''
  summary: 'The passage connects truth with seeing and discerning speech, then explains
    the introductory sacrifice: the sacrifice departed from the gods, who sought Aditi’s
    help to discern it. Aditi receives boons that sacrifices begin and end with her
    and that the quarters be known through deities. Offering verses align Pathya,
    Agni, Soma, Savitr, and Aditi with directions, cosmic phenomena, and ritual benefits.
    The passage further links speech, breath, eyes, and ordered regions with the performance
    and discernment of sacrifice.'
  language: English
  quote_policy: summarized
