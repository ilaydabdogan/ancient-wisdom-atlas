canonical_text:
  quote: Aditi is mother, is father, is son.
  summary: 'The passage explains a Prajapati union: its first half is wife, its latter
    half husband, the union is son, and the act of union is begetting. The union is
    identified with Aditi, who is described as all that exists, including father,
    mother, child, and begetting. A cited Rsi verse says Aditi is mother, father,
    and son. The one who knows this union receives children, cattle, fame, glory,
    heaven, and a full lifespan.'
