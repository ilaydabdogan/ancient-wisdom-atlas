canonical_text:
  quote: ''
  summary: A Rigvedic charm against poison describes unseen venomous creatures infecting
    the speaker, locates them among grasses and in darkness, addresses them through
    cosmic kinship, invokes the Sun and other natural powers to consume or carry away
    venom, and ends by crushing or weakening the poison-insect and scorpion venom.
    Translator notes identify the passage as an antidote charm traditionally associated
    with Agastya.
  language: English
  quote_policy: summarized
