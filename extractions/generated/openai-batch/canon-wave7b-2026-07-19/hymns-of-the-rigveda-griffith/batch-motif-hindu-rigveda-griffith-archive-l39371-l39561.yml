canonical_text:
  quote: ''
  summary: The speakers petition Indra for strength, refuge, victory over foes, protection
    in battle, and guidance to wealth, safety, and sunlight. A following hymn praises
    the sweet Soma draught offered to Indra, says it emboldened him in victories over
    Vritra and Sambara, and attributes cosmic creative and supporting acts to Soma,
    including measuring expanses, forming earth and heaven, creating nectar in rivers,
    supporting mid-air, and propping heaven with a pillar.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speakers call on Indra as king, mighty among the gods and ruler of men,
    asking him to succour them, strengthen what is weak in them, and make foes easy
    to subdue.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speakers ask Indra to bring them strength, valour, fame, and manly powers
    associated with named peoples or figures including the Nahushas, the Five Tribes,
    Trikshi, Druhyus, and Puru's folk.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speakers ask Indra for a happy home, a triple strong refuge, a dwelling-place,
    and for his dart to be kept far away from them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speakers describe warriors intent on spoil who attack and strike down
    the foe, and ask Indra to be the closest guardian of their lives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speakers ask Indra to aid them when feathered shafts and sharpened arrows
    fly in battle, and to give refuge to them and their sons while keeping hidden
    hostility far away.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Indra is described as urging chargers to speed in the mighty fray, on uneven
    and toilsome paths; the chargers are compared to falcons, rushing rivers, and
    birds drawn to bait.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Soma draught is described as sweet, strong, rich in flavour, and something
    after drinking which no one may conquer Indra in battle.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The sweet juice is said to have gladdened and emboldened Indra when he slaughtered
    Vritra, defeated Sambara's many onslaughts, and battered down ninety-nine ramparts.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The draught is said to stir the speaker's voice and awaken the speaker's yearning
    spirit; the Sage is said to have measured out six expanses from which no creature
    is excluded.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Soma, or the being praised as 'this', is credited with creating the breadth
    of earth and height of heaven, forming nectar in three headlong rivers, and supporting
    the wide mid-air.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Mighty One, called a Steer begirt by the Maruts, is said to have found
    a wavy sea of brilliant colours before the bright Dawns and to have propped the
    heavens with a mighty pillar.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The speakers invite Indra, called Hero and Vritra-slayer, to drink Soma from
    the beaker at the midday libation and to give them wealth.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The speakers ask Indra to act as leader and guardian, to guide them through
    peril toward treasure, happiness, security, and sunlight, and to shelter them
    beneath his high arms.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: The speakers ask Indra to set them on a wide chariot-seat with two steeds,
    bring them the best viands, lengthen the speaker's days, sharpen the speaker's
    thought, approve the speaker's words, and grant divine protection.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: Indra is called rescuer, helper, protector, preserver, lord of treasures,
    and invoked of many; the speakers ask him to baffle and drive away foes and give
    rest, safety, and hero vigour.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:16
  text: Songs, prayers, and linked verses are compared to rivers hastening toward
    Indra, and Indra is said to gather kine, water, drops, and manifold libations.
  category: relationship
  evidence_refs:
  - ev:16
- id: obs:17
  text: Indra is described as a hero who tames strong men, advances one after another,
