canonical_text:
  quote: ''
  summary: 'The passage praises Soma Pavamana or Indu as a purified, flowing sacred
    juice and deity: filtered through sheep''s wool, entering vessels, clothed in
    milk and water, flowing for Indra and the gods, granting riches, strength, lore,
    rain, light, and protection. It also names Dadhyach Navagva, fastened doors, sages,
    Amrita, the taking of red watery cows from a rocky cavern, the unclosing of the
    middle-air fount, and Soma as immortal and threefold-robed.'
  language: English
  quote_policy: summarized
