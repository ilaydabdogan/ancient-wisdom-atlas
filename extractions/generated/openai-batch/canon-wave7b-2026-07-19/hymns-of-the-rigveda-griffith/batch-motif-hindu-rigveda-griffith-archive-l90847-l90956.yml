canonical_text:
  quote: ''
  summary: A ritual-explanatory passage discusses how Hotrakas and related priestly
    offices recite litanies at Soma pressings. It gives mythic explanations involving
    Gayatri becoming an eagle and bringing Soma, Indra cutting off and assigning litanies,
    the gods strengthening offices through speech, Agni- and Indra-led expulsion of
    Asuras from litanies, and Indra and Visnu conquering Asuras and dividing domains
    through Visnu's three traversals.
  language: English
  quote_policy: summarized
