- id: obs:1
  text: The passage explains that Hotrakas recite at the morning and midday pressings,
    and that two hymns apiece at midday account for two litanies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The Agnidh, Potr, and Nestr offices are each associated with named litanies:
