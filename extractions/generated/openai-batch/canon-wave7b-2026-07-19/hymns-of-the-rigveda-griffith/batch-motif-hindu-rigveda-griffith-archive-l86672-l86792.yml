canonical_text:
  quote: ''
  summary: The passage explains ritual resolutions into the Agnistoma, relates the
    Agnistoma to Agni, the year, Stomas, and the sacrificer, then narrates how Agni
    opened and guarded the door of heaven after the gods defeated the Asuras. Divine
    groups gain passage by praising Agni with specific Stomas, and the knowledgeable
    sacrificer is promised passage to heaven. The Agnistoma is also described as a
    mysterious praise of Agni, a Stoma of light, and an endless rite compared to a
    chariot wheel and the creeping of a snake.
  language: English
  quote_policy: summarized
