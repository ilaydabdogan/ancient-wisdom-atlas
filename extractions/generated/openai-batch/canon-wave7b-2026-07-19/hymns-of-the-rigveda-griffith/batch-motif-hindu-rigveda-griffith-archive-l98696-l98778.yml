canonical_text:
  quote: This man is the sea, he is above all the world.
  summary: The passage contrasts human intelligence with animal knowledge governed
    by hunger and thirst. It says man desires the immortal through the mortal and,
    like the sea, remains unsatisfied and seeks beyond any world attained. It then
    describes man as fivefold, identifying elements of the body with fire, ether,
    water, earth, and air, and divides air into five breaths.
  language: English
  quote_policy: quoted
