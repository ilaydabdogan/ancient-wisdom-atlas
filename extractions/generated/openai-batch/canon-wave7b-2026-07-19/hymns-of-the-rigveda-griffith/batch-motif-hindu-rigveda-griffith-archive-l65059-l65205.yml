canonical_text:
  quote: ''
  summary: A Soma hymn passage describes Soma/Indu/Pavamana being praised, pressed
    with stones, mixed with milk and sweetness, purified through a fleecy filter,
    flowing for Indra and the gods, dispelling demons and misfortunes, bringing rain,
    paths, food, riches, heroes, victory, and cosmic stability. Translator notes identify
    the water-staying adversary as Vritra and explain some images such as the Swans,
    the Wide-strider, and Vayu.
  language: English
  quote_policy: summarized
