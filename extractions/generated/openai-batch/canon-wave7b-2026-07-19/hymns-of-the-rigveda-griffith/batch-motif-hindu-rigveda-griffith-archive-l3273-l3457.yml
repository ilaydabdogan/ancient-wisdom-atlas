canonical_text:
  quote: ''
  summary: The passage includes notes on Kanva and Vedic sacrifice, the latter part
    of an Agni hymn praising Agni as sacrificial priest, light, protector, wealth-giver,
    and destroyer of demons, followed by a hymn to the Maruts as a shining, armed
    storm-host whose movement shakes earth, heaven, and mountains and is associated
    with rain and cloud.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A note ascribes the hymn and twelve following hymns to Kanva, described as
    a celebrated Rishi, son of Ghora, and belonging to the family of Angiras.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note states that, in the Vaidik view, the preservation of the whole world
    rests on sacrifices offered by men because these give the Gods strength and enable
    them to perform their duties.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Agni is asked to sit, shine, and loose ruddy smoke; he is addressed as an
    entertainer of the Gods and as worthy of sacred food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Agni is described as bearer of offerings and best sacrificing priest, ordained
    by the Gods for Manu’s sake and kindled by Kanva and Medhyatithi for the rite.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Agni is asked to make the worshippers’ wealth perfect and is said to have
    kinship with the Gods and to rule as a king over strength.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Agni is asked to stand erect like Savitar, lend aid, preserve the speakers
    from trouble, burn a ravening demon, and raise the worshippers so that they may
    walk and live.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Agni is asked to preserve the speakers from fiend, malicious wrong, injurer,
    slayer, night-plotter, and foe, and to smite the wicked with fire for teeth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: A note reports an interpretation of Agni standing erect as identification
    with the yupa, the sacrificial post to which victims were bound at animal sacrifice.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: Agni is said to have given heroic might and felicity to Kanva and to have
    helped friends, Medhyatithi, and Upastuta to win.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The speakers call on Ugradeva, Yadu, and Turvasa by means of Agni from afar
    and ask Agni to bring Navavastva, Brihadratha, and Turviti to subdue the foe.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Manu is said to have established Agni as a light for all the race of men;
    Agni is described as sprung from the Law, oil-fed, blazing for Kanva, and reverenced
    by the people.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Agni’s flames are described as splendid, mighty, fearful, and not to be approached;
    Agni is asked to consume demons, sorcerers, and each devouring fiend.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Kanvas are told to sing to their band of Maruts, described as unassailable,
    sporting, and resplendent on their car.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Maruts are described as self-luminous, born together with the spotted
    deer, and accompanied by spears, swords, glittering ornaments, and cracking whips.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Maruts are called an exultant host, fierce, vigorous, and strong, and
    are praised as a bull among cows that strengthened itself as it drank the rain.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:10
- id: obs:16
  text: The Maruts are said to shake earth and heaven like a garment’s hem; a man
    holds himself down before their wrath and a rugged mountain yields.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: At the Maruts’ racing forth the earth trembles; their birth is strong, and
    they have strength to issue from their Mother.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: The Maruts, called Sons and Singers, enlarge the bounds in their racings so
    that the kine walk knee-deep, and they drop an offspring of the cloud that is
    long, broad, and inexhaustible.
  category: action
  evidence_refs:
  - ev:8
- id: obs:19
  text: The Maruts’ strength is said to cast men down on earth and make mountains
    fall; as they pass along, they talk together on the way.
  category: action
  evidence_refs:
  - ev:9
- id: obs:20
  text: The Maruts are invited to come quickly with swift steeds because they have
    worshippers among Kanva’s sons; the speakers say all is prepared for their delight
    and call themselves servants for life.
  category: speech
  evidence_refs:
  - ev:9
