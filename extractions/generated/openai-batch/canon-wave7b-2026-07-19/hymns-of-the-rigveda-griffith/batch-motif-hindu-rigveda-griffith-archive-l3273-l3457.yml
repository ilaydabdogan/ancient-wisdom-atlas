candidate_motifs:
- id: motif:1
  label: sacrificial mediation sustaining divine-human order
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: The note says human sacrifices preserve the world by strengthening the Gods;
    the hymn presents Agni as bearer of offerings and sacrificing priest who mediates
    between worshippers, Gods, and Manu.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The explicit world-preserving claim appears in the translator’s note rather
    than the hymn verses themselves.
- id: motif:2
  label: protective sacred fire destroying hostile beings
  taxonomy_refs:
  - divine_judgment
  basis: Agni is asked to protect against fiends, malicious wrong, injurers, night-plotters,
    and foes, and to burn or consume demons, sorcerers, and devouring fiends.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage frames the destruction as protection of worshippers; broader
    judgment motifs should not be assumed beyond this context.
- id: motif:3
  label: establishment of divine fire as light for humankind
  taxonomy_refs:
  - culture_hero
  basis: Manu is said to have established Agni as a light for all the race of men,
    while Agni is described as oil-fed, sprung from Law, and reverenced by the people.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage does not narrate a full culture-hero myth; the taxonomy link
    is limited to the establishment of a human religious/cultural institution.
- id: motif:4
  label: armed storm-host shaking earth, heaven, and mountains
  taxonomy_refs:
  - chaos
  basis: The Maruts appear as a fierce, armed, resplendent band whose movement shakes
    earth and heaven, makes mountains yield or fall, causes the earth to tremble,
    and is connected with rain and cloud.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage depicts violent storm power but not a primordial chaos combat
    or cosmogonic chaos narrative.
- id: motif:5
  label: collective divine birth from a Mother
  taxonomy_refs:
  - divine_parent_child
  basis: The Maruts are described as born together and as having strength to issue
    from their Mother; they are later called Sons.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The Mother is unnamed in this passage, and no detailed birth narrative
    is provided.
