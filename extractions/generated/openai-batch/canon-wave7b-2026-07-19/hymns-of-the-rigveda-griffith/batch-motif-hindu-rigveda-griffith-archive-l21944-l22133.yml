canonical_text:
  quote: ''
  summary: The passage praises Agni, asks him to accept sacrificial cakes and oblations
    at timed libations, describes producing Agni by friction from fire-sticks with
    birth and maternal imagery, installs him at a ritual center to carry offerings
    to the gods, and names him an immortal god, priest, offering-bearer, and battle-winning
    hero.
  language: English
  quote_policy: summarized
