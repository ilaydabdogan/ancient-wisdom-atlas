  summary: The passage praises Indra as strong, bountiful, thunder-armed, lordly,
    and guardian of kine. Speakers ask him for aid in battles, water, sun, spoil,
    room to live, and successful sacrifice. The passage also describes offerings,
    Soma, milk-yielding cows, horses gifted by human patrons, musical praise, ascent
    with Indra to the Bright One’s place, and Varuna’s relation to Seven Rivers and
    flowing waters.
