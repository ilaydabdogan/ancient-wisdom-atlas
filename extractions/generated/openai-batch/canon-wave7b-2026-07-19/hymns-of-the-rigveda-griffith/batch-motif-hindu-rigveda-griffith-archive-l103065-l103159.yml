canonical_text:
  quote: ''
  summary: 'The passage gives ritual instructions for a sequence of Rigvedic recitations:
    specified hymns and stanzas are recited, inserted, metrically transformed, and
    combined. It states that optional insertions of decades of verses addressed to
    Indra may correspond to years added beyond the normal lifespan. The sequence includes
    Indra hymns, Soma-related verses, completion of a Sastra, muttering of the ukthasampad,
    substitution of the ukthadoha, and a formula addressing an entity as the head
    of the world, essence of speech, and fire of breath.'
  language: English
  quote_policy: summarized
