candidate_motifs:
- id: motif:1
  label: Prayer-offering exchange for wealth and social favor
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The passage repeatedly invokes deities for wealth and gifts, and asks Agni
    to strengthen prayer and sacrifice and urge givers to bestow wealth for service
    of the gods.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage gives a ritual request rather than a narrative transaction.
- id: motif:2
  label: Protective and dangerous sacred fire redirected
  taxonomy_refs: []
  basis: Agni protects with a triple guard and is asked to keep lightning away, yet
    he is also depicted as a devouring flame across land and asked to take another
    path away from waters or the speaker’s house.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:11
  confidence: high
  cautions: The fire is not explicitly world-destroying; no broader cosmological destruction
    should be inferred.
- id: motif:3
  label: Divine-twin rejuvenation and rebirth
  taxonomy_refs:
  - sacred_twins
  - death_rebirth
  basis: The Asvins, addressed as a divine twain, make aged Atri free and newly-born,
    loose him like a knot, and restore Kakshivan to youth and strength.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage describes rejuvenation and renewed birth imagery, not literal
    death followed by return.
- id: motif:4
  label: Divine rescue from the end-region ocean
  taxonomy_refs: []
  basis: Bhujyu is tossed in the ocean at the region’s end, and the Asvins come with
    winged steeds and give him strength.
  evidence_refs:
