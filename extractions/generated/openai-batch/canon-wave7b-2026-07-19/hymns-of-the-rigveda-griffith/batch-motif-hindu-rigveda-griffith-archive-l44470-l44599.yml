canonical_text:
  quote: ''
  summary: The passage contains the close of one hymn and parts of two Visvedevas
    hymns. It invokes many deities and divine groups, asks them to accept hymns, hear
    prayer, grant broad paths, protect worshippers and offspring, and give blessings.
    It describes cosmic and sacrificial imagery including the seat of Order, Surya’s
    beams, Agni’s flame, overflowing springs, a bellowing Bull identified in the note
    with Parjanya, Sarasvati as Mother of Floods, and Soma libations for the Vajas
    and Ribhukshans.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker asks the Child of Waters, Prisni, Rudras, Vasus, Adityas, Holy
    Ones of earth and heaven, and the Cow’s offspring to be gracious, accept or hear
    the hymn, grant broad paths, and preserve the worshippers with blessings.
  category: speech
  evidence_refs:
  - ev:1
  - ev:11
- id: obs:2
  text: A prayer is said to issue from the seat of Order; Surya’s beams loose cattle,
    the earth is extended with ridges, and Agni’s flame lights the spacious surface.
  category: action
  evidence_refs:
  - ev:2
  - ev:12
- id: obs:3
  text: Varuna and Mitra are addressed as recipients of a hymn offered like food;
    one is called a strong unerring leader, and Mitra’s speech stirs men to labor.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says gliding wind comes, springs overflow like cows, and a Bull
    born in lofty heaven bellows in the region; the note identifies the Bull with
    Parjanya and the springs with rain-cloud fountains.
  category: action
  evidence_refs:
  - ev:4
  - ev:12
- id: obs:5
  text: Indra and wise Aryaman are invoked in connection with Bay Horses, a noble
    car, and a hero who defeats malicious wrath.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Adorers worship in their own place of sacrifice to gain long life and friendship;
    Rudra is said to have poured food on men when praised.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Sarasvati is described as Mother of Floods and the seventh, strongly flowing
    with copious milk, fair streams, and a swelling volume of water.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The mighty Maruts are asked to aid devotion and protect offspring; Akshara
    is asked not to neglect the worshippers, and riches are said to have increased.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Aramati, Pashan, Bhaga, Purandhi, the Maruts, and Vishnu are invoked; Vishnu
    is called guardian of the future infant, and the singer asks for strength for
    offspring and divine preservation.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: A best-bearing car is asked to bring the Vajas and Ribhukshans, who are invited
    to be filled with mighty Soma, thrice-mixed, at libations.
  category: action
  evidence_refs:
  - ev:10
