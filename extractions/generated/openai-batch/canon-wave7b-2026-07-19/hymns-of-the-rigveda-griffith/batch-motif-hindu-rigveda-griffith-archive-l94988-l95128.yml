canonical_text:
  quote: ''
  summary: The passage describes the great anointing of Indra for a Kshatriya or king.
    Curds, honey, ghee, and water are used to confer power, sap, brilliance, and immortality;
    the anointed ruler gives gifts to the officiating Brahman and drinks the Soma
    contained in Sura. A sequence of named priests anoints named kings, after which
    the kings go around the earth conquering and offer the horse sacrifice. The passage
    also includes a verse in which Earth speaks to Visvakarman Bhauvana, a verse on
    Marutta with the Maruts and All-gods, and verses about Anga’s large sacrificial
    gifts.
  language: English
  quote_policy: summarized
