canonical_text:
  quote: ''
  summary: A Vedic hymn addresses Agni as immortal priest, sacrificer, messenger between
    gods and humans, protector, guide, and giver of wealth. The hymn describes Agni’s
    horses and chariot, requests that he bring gods to the sacrificer, praises those
    who feed and kindle him, asks for protection and prosperity, recalls sages and
    ancestral worshippers, and mentions breaking rock, disclosing red cows, and dawns
    brightening Agni.
  language: English
  quote_policy: summarized
