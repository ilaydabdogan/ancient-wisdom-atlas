  summary: Oldenberg's notes on Mandala IV, Hymn 15 discuss the hymn's metrical and
    textual arrangement, repeated allusions to Agni being carried around, possible
    later additions, named princes connected with the Srz#gaya tribe, an offering
    enjoyed by gods, an identification of the red young child of Heaven with Soma,
    and a note on a gift of two horses.
