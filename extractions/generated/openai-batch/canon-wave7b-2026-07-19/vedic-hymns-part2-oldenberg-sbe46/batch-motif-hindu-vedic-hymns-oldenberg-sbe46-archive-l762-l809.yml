  summary: The passage translates verses invoking the all-shaped Tva-shévz, addressing
    a tree in relation to sacrificial food going to the gods, and instructing an offering
    with the word Svaha to Indra in the sacrificer's house. The notes classify the
    hymn as an Apri hymn for Prayaga offerings of the animal sacrifice and describe
    Apri hymns as addressed in regular order to Agni and to spirits or deified objects
    connected with sacrifice, including sacrificial grass and divine gates.
