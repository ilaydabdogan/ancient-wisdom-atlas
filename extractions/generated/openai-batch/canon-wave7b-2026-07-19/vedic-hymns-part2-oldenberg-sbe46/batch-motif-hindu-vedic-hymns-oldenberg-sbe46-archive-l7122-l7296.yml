  summary: Commentary notes on a Vedic hymn to Agni discuss the hymn's seer and metres,
    then give interpretive notes on Agni's womb or receptacle, births, sacrificial
    food, flames as tongue, mothers and father, horses, plants or hidden flames, Heaven
    and Earth, Dawn, Waters, a ship carrying worshippers across dangers, and offerings
    of milk and corn.
