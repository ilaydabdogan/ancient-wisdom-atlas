  summary: A hymn addresses Agni as newly born for welfare, shining for the Bharatas,
    kindled for sacrifice, seated as priest, born from two mothers, strengthened by
    ghee and prayers, serving as messenger and carrier of oblations, and discovered
    by the Angiras hidden in wood and produced by attrition.
