  quote: ''
  summary: Liturgical verses invoke paired goddesses, two divine Hotrs, Sarasvati,
    IA, Bharati, Tvash¢rz, Agni, a divine butcher, the gods, and an addressed bull
    in relation to weaving and performing sacrifice, seating goddesses on Barhis,
    obtaining a son, and sending an anointed offering to the gods with ghrita and
    Svaha.
