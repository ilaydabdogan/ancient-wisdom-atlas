canonical_text:
  quote: ''
  summary: 'A hymn addresses Agni at dawn: he is awakened and kindled by men, his
    flames rise skyward, he serves as Hotr and guest, receives praise and tribute,
    is described as born from the Dawns and seated in a mother''s lap, is groomed
    with ghrta, bestows treasures, and is asked to bring the gods to the oblation.'
  language: English
  quote_policy: summarized
