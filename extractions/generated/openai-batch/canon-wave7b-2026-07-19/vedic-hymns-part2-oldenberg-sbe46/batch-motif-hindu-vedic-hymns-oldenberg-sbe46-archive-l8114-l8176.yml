  quote: ''
  summary: The passage gives editorial notes on Agni, unidentified figures who approach
    him, two female beings explained as Heaven and Earth, and a recurring pada. It
    then presents verses describing a knowing and intelligent figure, identified as
    Agni later in the passage, who receives words, possesses strength, is connected
    with sacrifice, is called a young child, acts with companions, and is described
    as an animal living in water and walking in the forest who proclaims rules to
    mortals and is intent on Right.
