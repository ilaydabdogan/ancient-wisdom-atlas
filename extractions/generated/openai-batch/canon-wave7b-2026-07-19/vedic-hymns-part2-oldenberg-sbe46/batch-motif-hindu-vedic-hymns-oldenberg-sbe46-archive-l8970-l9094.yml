  quote: ''
  summary: Editorial and philological notes on Mandala I, Hymn 189 discuss the hymn’s
    rishi and metre, interpretations of verses 2, 3, 6, 7, and 8, an addressed god
    as deliverer from assaults, the relation of pious and impious or Aryans and Dasyus,
    terms connected with rest or advanced daytime, Mana as another name of Agastya,
    and the repeated conclusion of Agastya hymns with possible references to months,
    food, sap, and sacrificial hymns.
