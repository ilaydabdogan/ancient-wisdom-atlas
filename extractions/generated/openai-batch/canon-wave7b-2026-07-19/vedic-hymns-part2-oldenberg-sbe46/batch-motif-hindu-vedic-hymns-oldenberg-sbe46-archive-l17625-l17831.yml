canonical_text:
  quote: ''
  summary: The passage contains notes on Mandala V, Hymn 2, especially Agni’s obscure
    displacement, hostile female beings, fire imagery, ambrosia/purification vocabulary,
    and Agni as bull. It then gives Mandala V, Hymn 3, in which Agni is identified
    with several gods, serves as priest, guest, messenger, and protector, receives
    offerings and confession, unites husband and wife, guards secret names, grants
    favor, and protects worshippers from curses, thieves, deceitful people, and other
    dangers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The notes state that Agni has forsaken his proper dwelling and is degraded
    by sojourning with a wrong mother, while his proper nature is glorious and he
    is described as the queen’s son.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The notes describe hostile young women or female foes who try to seize Agni
    after he has already been born; his fiery and unassailable nature has already
    been formed, and the female foes become grey with age.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The notes identify the bull in the hymn with Agni and connect the bull with
    cows, which are tentatively glossed as oblations, prayers, clouds, or dawns in
    the commentary.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mandala V, Hymn 3 identifies Agni as Varuna when born, as Mitra when kindled,
    as Indra for the mortal worshipper, and says that the Visvedevas dwell in him.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Agni is said to become Aryaman when bearing the secret name of the maidens;
    the verse also says he is anointed with cows, explained in a note as butter, and
    that he makes husband and wife one-minded.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The hymn says the Maruts cleanse themselves for Agni’s glory and mentions
    the footprint of Vishnu placed in the highest place, with which Agni protects
    the secret name of the cows.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Men set Agni down as the Hotri, no better sacrificer is said to stand before
    him, and the house in which he is guest is said to overcome mortals by sacrifice.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The worshippers ask to overcome mortals while protected by Agni, striving
    for wealth and awakening him with offerings.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The hymn asks Agni and associated addressees to bring evil upon one who pronounces
    evil spells and to destroy the curse of one who injures by falsehood.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Ancient mortals are said to have made Agni their messenger at the break of
    dawn and to have sacrificed with oblations when he goes along in the abode of
    wealth.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Agni is asked to protect the father who is considered his son; the father
    gives many names to Agni, and Agni is asked to look upon the worshippers, know
    Rta, requite deeds, and grant favor.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Agni is said to bring his praiser across all dangers; thieves, deceitful men,
    and dishonest people are mentioned, and Agni is said not to surrender the worshippers
    to curse or harm-doer after guilt is confessed.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The commentary says it is uncertain whether the expression about ambrosia
    cleared from admixture refers to the myth of the churning of the ocean.
  category: other
  evidence_refs:
  - ev:13
- id: obs:14
  text: The commentary says the whole of verse 8 is nearly identical with Rig Veda
