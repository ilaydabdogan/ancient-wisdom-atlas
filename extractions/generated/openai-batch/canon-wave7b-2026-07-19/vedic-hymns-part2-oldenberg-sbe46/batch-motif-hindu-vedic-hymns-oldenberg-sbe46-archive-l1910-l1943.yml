    enemies, strike niggards, prevent an impostor from ruling, grant abundance and
    prosperity, call and conduct named peoples, serve as strength against the Dasyu,
    stand as a light established by Manu for all people, and burn sorcerers, allies
    of the Yatus, and ghouls.
