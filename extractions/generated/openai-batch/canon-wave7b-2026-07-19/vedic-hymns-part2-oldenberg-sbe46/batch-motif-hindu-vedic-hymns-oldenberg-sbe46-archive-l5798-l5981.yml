canonical_text:
  quote: ''
  summary: The passage consists of editorial and philological notes on Mandala I,
    Hymn 95. The notes identify figures and images in the hymn, including Agni as
    a calf/fire-being, Night and Dawn as two females, the ten young women as fingers
    producing fire by wood attrition, Tvashtri as father of Agni, waters as mothers,
    sacrificial cow-products, and Agni in sprouting grass/tinder. The notes also discuss
    uncertain interpretations of Agni’s birth in sea/waters, possible lunar light,
    and a cycle in which Agni and waters generate one another.
  language: English
  quote_policy: summarized
