  summary: Mandala I, Hymn 140 addresses Agni as a bright being seated on the Vedi,
    clothed in prayer, born twofold, fed by threefold food, approached by mothers,
    moving with swift teams and rays, consuming and renewing vegetation, protecting
    patrons, granting a saving ship, and receiving a final request for prosperity
    from Heaven, Earth, Rivers, and Dawns.
