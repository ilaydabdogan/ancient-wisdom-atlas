  summary: Commentary notes on Rig-Vedic hymn material discuss whether Ayu is Agni
    or whether the Ayus are a mythical sacerdotal tribe worshipping Agni; identify
    Dirghatamas, son of Mamata, with blindness and distress known from a Mahabharata
    story; interpret Agni and his guardians as saving Mamateya and good-doers; and
    mention the Vedic idea that evil deeds recoil on the evil-doer.
