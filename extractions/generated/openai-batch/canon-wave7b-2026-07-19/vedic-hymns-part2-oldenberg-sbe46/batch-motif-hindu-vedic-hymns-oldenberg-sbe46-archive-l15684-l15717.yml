literal_observations:
- id: obs:1
  text: The speaker asks how the addressed figure will answer the righteous, the host
    of the Maruts, the Sun, and Aditi, then asks Jatavedas to accomplish his work
    and describes him as knowing Heaven.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker magnifies the Azta of the cow and describes honey-sweet, ripe
    milk; the cow is described as black while swelling with bright drink or milk.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A bull is said to have been anointed with Azta and milk; he moves without
    trembling, bestows vigour, and pours out a bright udder.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Angiras break and cleave a rock by the Azta and shout together with the
    cows.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Men surround the Dawn, and the Sun appears when Agni the fire has been born.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Waters are called immortal and uninjured goddesses; with honey-sweet waves
    they speed forward to flow continually.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The speaker asks that the addressee not go on a crooked way to the guilt-avenging
    spirit of a trespassing vassal or friend.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The speaker asks not to be charged with a sinful brother’s debt and not to
    suffer under the spirit that avenges a friend’s or hostile deceiver’s guilt.
  category: speech
  evidence_refs:
  - ev:6
