  quote: ''
  summary: Verses address Jatavedas/Agni, speak of cow, milk, bull, Angiras breaking
    rock, Dawn and Sun appearing with Agni’s birth, divine Waters flowing, and a plea
    to avoid avenging guilt or debt.
  language: English
