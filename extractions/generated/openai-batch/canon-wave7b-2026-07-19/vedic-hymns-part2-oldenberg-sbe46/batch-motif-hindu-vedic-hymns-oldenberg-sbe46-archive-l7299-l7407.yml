canonical_text:
  quote: ''
  summary: A hymn to Agni describes his divine splendour, several births or forms,
    his production by attrition, his movement through mothers, plants, atmosphere,
    and heaven, his office as Hotr, and petitions that he bring rain, drink, treasures,
    divine friendship, good fortune, welfare, and sovereignty.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The god's splendour is described as beautiful, born of strength, and wondrous;
    prayer goes straight to him, and flowing streams of Ata are led forward.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The powerful one has multiple stated forms: he enters a wondrous body, has
    a second form in seven kind mothers, and is brought forth in a third form by ten
    young females as a bull and guardian to be milked.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rulers or liberal lords bring him forth by their power from the depth and
    from the buffalo's shape; Matarisvan produces the hidden one by attrition during
    purification of the sweet drink.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: He is led forward from the highest father; an ambiguous pair described as
    Heaven and Earth or the two Arazis promotes his birth, and the youngest one becomes
    bright by heat.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: He enters mothers in whom he grows far and wide, then climbs to former mothers
    and runs down in younger or later ones.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: He is chosen as Hotr; when praised by many, he moves with wisdom and power
    toward the gods and toward the praise of mortals for refreshing drink.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The worshipful burning one scatters himself, is driven by wind, speeds on
    a black way, has a bright birth, and ranges toward the atmosphere.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Agni goes to Heaven like a chariot with ruddy limbs and locks of flames; black
    clouds or smoke appear, and birds flee before his fierceness.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Through Agni, Varuna, Mitra, and Aryaman are glorious as givers of good rain;
    Agni is compared to a felly encompassing the spokes of a wheel.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Agni furthers treasures and the friendship of the gods for the one who worships
    and presses Soma; the speakers ask him to make good fortune swell and to fill
    praise with reward.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The speakers ask the brilliant Hotr with quick horses and a shining chariot
    to hear them and lead them by the best paths to welfare and bliss; Agni is praised
    with songs and brought forward for sovereignty.
  category: speech
  evidence_refs:
  - ev:8
