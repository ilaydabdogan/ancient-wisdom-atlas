  summary: Two verses address Agni, asking him to seat the morning-arriving gods on
    sacrificial grass to drink Soma, and to sacrifice with joint invocations while
    bringing the divine host to drink Soma kept overnight. The notes interpret the
    hymn as matutinal, discuss gods as offspring of Manu, explain day/morning ritual
    terminology, describe priests kindling Agni and performing oblations, and connect
    the overnight Soma with Asvin offerings at the Atiratra sacrifice.
