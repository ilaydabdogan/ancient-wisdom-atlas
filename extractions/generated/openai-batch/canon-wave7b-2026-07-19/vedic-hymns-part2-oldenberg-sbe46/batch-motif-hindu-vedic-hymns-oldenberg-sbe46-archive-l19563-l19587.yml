  summary: The hymn addresses Agni Angiras, asking that he be laid down and kindled
    as Manus did, and that he sacrifice to the gods for worshippers. It describes
    Agni as kindled among humans, approached by sacrificial ladles, drinking butter,
    appointed messenger by the gods, magnified at sacrifices, and instructed to shine
    and sit in the abodes of Azta and herbs.
