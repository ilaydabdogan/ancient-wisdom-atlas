canonical_text:
  quote: ''
  summary: Mandala I, Hymn 97 addresses Agni and repeatedly asks him to drive away
    evil with his light. The speakers sacrifice while seeking rich fields, a free
    path, wealth, offspring, and welfare. Agni is described as mighty, radiant on
    all sides, facing everywhere, and encompassing the world. The hymn asks Agni to
    carry the speakers across hostile powers and evil as a boat carries one across
    a stream.
