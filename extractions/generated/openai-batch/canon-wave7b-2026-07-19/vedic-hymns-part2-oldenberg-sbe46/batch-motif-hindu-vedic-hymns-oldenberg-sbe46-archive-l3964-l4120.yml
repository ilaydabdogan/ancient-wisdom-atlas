    or streams of Ghrta, and then arguing for Night and Dawn as dark and red sister
    goddesses linked with Agni. The notes also mention Angiras as fathers of priestly
    tribes, prayers and libations, and Matarisvan first kindling Agni before Agni
    is carried to human dwellings.
