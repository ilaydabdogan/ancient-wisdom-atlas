canonical_text:
  quote: ''
  summary: 'The passage includes a textual note on Agni as son of the two worlds and
    a brief note on a reading involving the killer of Vvitra. It then gives Mandala
    I, Hymn 60, verses 1-5: Matarisvan brings Agni to Bhrigu as a precious gift; Usigs
    and mortals follow Agni''s command; Agni sits before daybreak among the clans
    as Hotr and performer of worship; praise born from the heart is directed to honey-tongued
    Agni, whom human priests, the Ayus, have engendered; Agni is established among
    men and in the house as master and treasure-lord; the Gotamas praise him and ask
    the wealth-giver to come quickly in the morning.'
  language: English
  quote_policy: summarized
