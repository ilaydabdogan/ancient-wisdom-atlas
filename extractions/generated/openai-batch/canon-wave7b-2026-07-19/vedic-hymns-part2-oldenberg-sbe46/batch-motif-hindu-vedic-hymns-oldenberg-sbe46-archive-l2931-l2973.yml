canonical_text:
  quote: ''
  summary: The hymn addresses Agni as a hidden, trackable, worship-bearing figure.
    The wise and the gods approach him; the waters nourish him as a well-born child
    in the womb of Azta/A’ta. He is described through similes of abundance, speed,
    rivers, and brightness, as kin to rivers, a consumer of forests, wind-driven,
    seated in waters, awakening at dawn, and a performer of worship like Soma.
  language: English
  quote_policy: summarized
