canonical_text:
  quote: ''
  summary: 'The passage contains notes on Mandala I, Hymn 65 and the translated text
    and notes for Mandala I, Hymn 66. The notes identify a Vedic myth in which hidden
    Agni is sought and discovered by gods. Hymn 66 praises Agni through a series of
    comparisons: wealth, sun, breath, son, milk, cow, homestead, barley, seer, race-horse,
    chariot, army, and arrow. Agni is also described as kindled, as one twin born
    and another to be born, as lover and husband, as a center approached by moving
    beings, and as driving waters like the flood of the Sindhu.'
  language: English
  quote_policy: summarized
