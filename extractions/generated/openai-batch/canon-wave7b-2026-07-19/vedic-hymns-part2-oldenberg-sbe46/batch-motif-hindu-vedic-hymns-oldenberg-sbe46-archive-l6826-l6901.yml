  summary: The hymn praises Agni as born in Manu’s law, seated at the altar as Hotr
    and best sacrificer, made attentive by offerings, brought to Manu from afar by
    Matarisvan, moving swiftly through terrestrial spaces, watching sacrifices house
    by house, carrying oblations to the gods, dispensing goods and protection, and
    being roused by gods and praises.
