canonical_text:
  quote: ''
  summary: Mandala I, Hymn 188 invokes Agni and other deities in a sacrificial setting.
    Agni is kindled, asked to carry oblations, receive libations, summon the gods,
    and make offerings relishable. The hymn also mentions Tantinapat, Adityas, Divine
    Doors, two Dawns, two divine Hotrs, Bharati, I/4, Sarasvati, Tvashérz, a tree
    yielding sacrificial food, the Gayatra song, and the Svaha utterance over oblations.
  language: English
  quote_policy: summarized
