canonical_text:
  quote: ''
  summary: Philological notes on Rig-vedic usage of the verb id/ide argue that agnim
    ide originally referred to celebrating or magnifying Agni by pouring sacrificial
    butter into the fire. The passage cites Rig-vedic examples of gods and Agni being
    magnified with butter, sacrificial food, and a butter-dripping spoon, then discusses
    later uses with songs, praises, and adoration. It contrasts Agni, nourished by
    butter offerings, with Indra as drinker of Soma juice and with Soma/Soma Pavamana.
    It also notes a supplicatory praise to Indra and Vayu and discusses adhvara as
    a term for sacrifice or sacrificial work.
  language: English
  quote_policy: summarized
