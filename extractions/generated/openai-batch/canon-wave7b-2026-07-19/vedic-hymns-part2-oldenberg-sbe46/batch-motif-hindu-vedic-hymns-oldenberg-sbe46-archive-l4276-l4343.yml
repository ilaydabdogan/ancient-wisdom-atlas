canonical_text:
  quote: ''
  summary: An English translation of a Vedic hymn passage centered on Agni. Agni is
    praised as powerful, treasure-bearing, connected with immortality, found at a
    highest place, served with ghrita, and made bearer of oblations. The passage also
    describes immortal gods seeking a calf, secret steps in Agni, Sarama finding a
    cow-stable, seven rivers, Aditi/Earth with sons preparing a way to immortality,
    and heavenly eyes and descending streams.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Agni is described as surpassing the wisdom of many worshippers, holding manly
    power, becoming lord of treasures, and bringing together powers of immortality.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Clever immortals seek but do not find a calf; they follow footsteps and stand
    at the highest, beautiful standing-place of Agni.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bright ones serve Agni with ghrita through three autumns, assume worshipful
    names, and shape their own bodies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Worshipful ones acquire or explore the two great worlds and bring forward
    Rudra-like powers; a mortal perceives and finds Agni standing in the highest place
    when beings are in discord.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Like-minded ones approach Agni on their knees with their wives and venerate
    him; the passage also says they abandon their bodies and make them their own,
    with one friend waking when another closes his eyes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Worshipful gods discover thrice seven secret steps or places laid down in
    Agni and guard immortality with them; Agni is asked to protect cattle and what
    is steadfast and moving.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Agni is said to know the established orders of human dwellings and the ways
    the gods go; he distributes gifts and becomes the unwearied messenger and bearer
    of oblations.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Those who know the right way behold from heaven the seven young rivers and
    the doors of riches; Sarama finds the strong stable of cows from which human clans
    receive nourishment.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Earth, called mother Aditi in the passage, spreads herself with great ones
    and with her sons, who have assumed powers of dominion and prepare the way to
    immortality.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The immortals create the two eyes of heaven and place fair splendour in Agni;
    streams rush down, and red ones recognize those directed downward.
  category: sequence
  evidence_refs:
  - ev:10
