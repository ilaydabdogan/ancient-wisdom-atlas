canonical_text:
  quote: may he, Gatavedas, be merciful.
  summary: The passage is mainly Oldenberg's notes on a Vedic hymn. It identifies
    the seer and metres, gives Vedic textual parallels, argues that the hymn combines
    two independent hymns, and summarizes motifs in which Agni is invoked for protection
    and mercy, especially to appease Varuza's anger. Later notes mention ritual and
    cosmic images including Soma led to sacrificial grass like a horse by ropes, three
    abodes, the infinite sky, a bull identified with Agni, and a company of Angiras
    or seven rishis.
  language: English
  quote_policy: quoted
