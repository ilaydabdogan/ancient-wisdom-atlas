- id: obs:3
  text: Agni is described as wise, pure in powers, allied by birth with Heaven and
    Earth, and found by the gods in the waters in the work of the sisters.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Seven young wives make the blessed newborn grow; he is born white and becomes
