  quote: ''
  summary: A Vedic hymn passage addresses Agni in a sacrificial setting. The speaker
    prepares worship and Soma equipment; Agni is honoured with fuel and prayer. Agni
    is described as found in the waters, grown by seven young female figures or sisters,
    associated with Heaven and Earth, nourished by milk, ghee, and honey, and called
    son of the waters, plants, and wood.
  language: English
