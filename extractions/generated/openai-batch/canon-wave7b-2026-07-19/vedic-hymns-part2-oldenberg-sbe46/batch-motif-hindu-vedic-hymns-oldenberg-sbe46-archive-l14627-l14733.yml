  quote: ''
  summary: 'The passage gives scholarly notes on Rig Veda Mandala III, Hymn 29, especially
    terms and ritual imagery around fire-kindling: the pramantha or upper fire-stick,
    the lower Arani as receptacle and wife-like figure, the generation of Agni, possible
    ritual stones and grass, bull-like smoke, Matarisva wordplay about being shaped
    in the mother, ten fingers, and several uncertain identifications.'
