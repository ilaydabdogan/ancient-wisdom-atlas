canonical_text:
  quote: ''
  summary: The hymn describes Agni as victorious in forests, a friend among men, king-like
    in demanding obedience, and a carrier of offerings. Agni sits hidden after taking
    powers, causes the gods to fear, is found by thoughtful men through recited spells,
    is connected with cosmic support, cattle paths, a stream of Azta, riches, growth
    in plants and children, and a watery home where sages make him as if building
    a seat. Several lines show translator uncertainty or OCR corruption.
  language: English
