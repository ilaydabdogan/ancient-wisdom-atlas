canonical_text:
  quote: ''
  summary: The passage gives notes and the opening verses of Mandala III, Hymn 26.
    The Kusikas invoke Agni Vaisvanara with offerings and prayers for goods, rain,
    help, and abundance. Agni is described through several epithets and is kindled
    by women and by the Kusikas. Brzhaspati is invoked for worship of the divine host.
    The Vagas/Agnis are pictured harnessing spotted deer, while the Maruts are described
    as mountain-shaking, rain-bearing sons of Rudra who are implored with praise.
  language: English
  quote_policy: summarized
