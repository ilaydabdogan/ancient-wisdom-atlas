canonical_text:
  quote: ''
  summary: A hymn addresses Agni as a god and Gatavedas. Mortals bring offerings and
    ask Agni to carry them to the gods. Agni is described as Hotr in the ritual dwelling,
    born from the kindling-stick, young like a calf, a burner of woods, and associated
    with smoky flames. Trita in heaven blows upon him like a smelter. The speaker
    asks, through Agni's protection and the praises of Mitra, to overcome dangers
    and receive wealth, dwelling, prosperity, booty, and strength in fights.
  language: English
