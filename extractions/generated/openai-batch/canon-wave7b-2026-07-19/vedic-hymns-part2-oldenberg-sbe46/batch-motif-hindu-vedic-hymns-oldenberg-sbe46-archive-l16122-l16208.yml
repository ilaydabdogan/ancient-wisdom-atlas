canonical_text:
  quote: ''
  summary: A hymn addresses Agni Vaisvanara as a powerful, self-dependent god who
    supports, gives bounty, proclaims prayer, consumes violators of Varuna's and Mitra's
    laws, receives purifying prayer, knows hidden things, and is asked to declare
    treasure and the aim of the worshippers' way. The hymn also refers to cows, water,
    a summit, a bird's footstep, Heaven and Earth as parents, Dawns, and enemies whose
    weak speech should fall into nothingness.
  language: English
  quote_policy: summarized
