canonical_text:
  quote: ''
  summary: 'The passage contains editorial notes on Rig Veda III.7 and the translated
    text of Rig Veda III.8. The notes discuss conjectural identifications of Agni,
    Heaven and Earth, the Waters, Dawns, cows, and sacrificial songs. Hymn III.8 addresses
    the lord of the forest or sacrificial post: worshippers anoint it with heavenly
    honey, erect it before the fire, describe it as born and purified, fasten or fashion
    it, ask it to bestow wealth and offspring, and call on the gods to bless the sacrifice
    and raise the Yupa as the banner of the rite.'
  language: English
