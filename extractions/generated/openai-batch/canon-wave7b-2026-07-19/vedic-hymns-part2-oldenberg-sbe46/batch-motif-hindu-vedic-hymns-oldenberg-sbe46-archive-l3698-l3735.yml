  quote: ''
  summary: A hymn addresses Agni, asking for pious thought, protection, riches, and
    tribute. Agni is described as pure in splendour, knowledgeable about divine laws
    and origins, a child of waters, trees, standing things, and moving things, and
    a protector-like immortal figure. The passage also associates him with homage
    in a rock or dwelling, increase by nights and dawns, worship by human sacrificers,
    and excellence conferred on cows and trees. Several lines contain uncertain or
    corrupt wording.
