  summary: The passage presents Agni through riddling images as a calf, germ, child,
    seer, lion, and lord. Female figures suckle, bring forth, carry, and caress him.
    His births are located in the sea, heaven, and waters; he determines seasons for
    earth-dwellers; he grows in the lap of waters, while Heaven and Earth flee in
    fear at his birth and then return to caress him.
