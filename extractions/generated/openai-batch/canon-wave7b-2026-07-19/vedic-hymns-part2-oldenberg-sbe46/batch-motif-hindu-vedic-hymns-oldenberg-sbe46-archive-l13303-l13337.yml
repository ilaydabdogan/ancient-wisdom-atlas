  quote: ''
  summary: Mandala III, Hymn 17 addresses Agni as an anointed, flame-haired purifier
    skilled in sacrifice. The hymn asks Agni to perform the Hotr's duty, sacrifice
    the offering to the gods, prosper the sacrifice as he did for Manus, use his three
    lives and three births from Dawn for divine favor, and carry the sacrifice according
    to established ritual precedent.
