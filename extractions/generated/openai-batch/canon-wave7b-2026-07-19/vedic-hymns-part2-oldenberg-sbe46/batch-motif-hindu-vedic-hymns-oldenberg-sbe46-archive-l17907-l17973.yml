canonical_text:
  quote: ''
  summary: A hymn addresses Agni during sacrifice as treasure-lord, king, bearer of
    oblations, father, priest, household god, guest, purifier, and protector. The
    speakers ask him to bring the gods to the offerings, repel hostile forces, grant
    wealth, ferry them across dangers as a boat crosses a river, and bestow glory
    and immortality with offspring.
  language: English
  quote_policy: summarized
