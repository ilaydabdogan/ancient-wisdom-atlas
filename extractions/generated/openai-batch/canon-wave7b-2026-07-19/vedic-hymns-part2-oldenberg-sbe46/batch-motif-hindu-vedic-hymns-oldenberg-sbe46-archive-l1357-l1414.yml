canonical_text:
  quote: ''
  summary: A philological note proposes a possible translation of a prayer not to
    fall victim to a superior's praise or curse. The hymn then addresses Agni as first
    Angiras, divine friend of the gods, administrator of divine law, son of two mothers,
    wise manifestation to Matarisvan and Vivasvat, elected Hotr as the two worlds
    tremble, sacrificer to the great gods, benefactor of Manu and Pururavas, bull
    and augmenter of prosperity, and guide at sacrifice.
  language: English
  quote_policy: summarized
