  quote: ''
  summary: A hymn addresses Agni as a Vasu and asks him repeatedly to bring food to
    his praisers. Cows, horses, racers, and patrons are said to come to him. Agni
    is kindled, receives oblation, carries oblations, acts as messenger, warms butter-filled
    sacrificial ladles, and is led by prayers and sacrifices while the speakers request
    gifts, wealth, valiant men, and swift horses.
  language: English
