  summary: The excerpt begins with philological notes on a preceding hymn, including
    a proposed reading involving two goddesses at the sacrifice. It then gives Mandala
    III, Hymn 7, verses 1-6, describing beings rising from the drink of a white-backed
    one, entering two parents and seven sounds, heavenly milch-cows or mares of a
    manly figure, a wise lord with dark-blue back and many faces, streams carrying
    the never-ageing son of Tvashtri, ruddy Agni and shining gods, and a song of praise
    brought to the great one's parents when a bull grows strong.
