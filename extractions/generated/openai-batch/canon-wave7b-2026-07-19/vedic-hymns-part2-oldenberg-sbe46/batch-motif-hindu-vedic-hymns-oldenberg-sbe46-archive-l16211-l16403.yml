canonical_text:
  quote: ''
  summary: The passage includes the end of Mandala IV, Hymn 5, where a kindled, radiant
    Vasu shines in a house, notes identifying that hymn as addressed to Vaisvanara
    and commenting on Agni, cows, milk, and oblation, and the opening verses of Mandala
    IV, Hymn 6, where Agni is invoked as Hotr of the sacrifice. Agni is described
    as standing or sitting among the people, sending light upward, raising smoke to
    the sky, moving around the rite, and having flames compared to race-horses. The
    sacrificial setting includes a ladle filled with butter and gifts, a sacrificial
    post, victims, spread grass, kindled fire, and the Adhvaryu officiant.
  language: English
