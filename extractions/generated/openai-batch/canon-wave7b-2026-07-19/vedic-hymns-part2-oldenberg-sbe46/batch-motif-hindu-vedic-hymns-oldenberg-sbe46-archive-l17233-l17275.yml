    sacrifice. Agni circles the sacrifice and oblations, conveys enjoyment to the
    gods, and bestows treasures. The passage also describes Agni being kindled and
    cleaned daily. A prince, Somaka son of Sahadeva, offers two bay horses to the
    first-person speaker, and the hymn asks the divine Asvins to grant him long life.
