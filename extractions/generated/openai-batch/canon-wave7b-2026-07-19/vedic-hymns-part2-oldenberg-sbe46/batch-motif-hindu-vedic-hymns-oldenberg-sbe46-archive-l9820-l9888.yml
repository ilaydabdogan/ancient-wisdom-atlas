canonical_text:
  quote: ''
  summary: 'The passage first gives editorial notes to Mandala II, Hymn 3, including
    an identification of a pronoun as Agni. It then begins Mandala II, Hymn 4: the
    speaker calls Agni, described as shining, praised, a guest of clans, receiver
    of offerings, and desirable like Mitra or an ally. The Bhvzgus worship him in
    the abode of waters and establish him among the clans of Ayu; the gods establish
    beloved Agni among human clans. Agni is asked to illuminate nights and is described
    through fire imagery: driven forward, shaking a tongue among plants, waving a
    tail like a chariot-horse, eating forests, shining, growing old and becoming young
    again, and resounding like water or a chariot in the partial sixth verse.'
  language: English
