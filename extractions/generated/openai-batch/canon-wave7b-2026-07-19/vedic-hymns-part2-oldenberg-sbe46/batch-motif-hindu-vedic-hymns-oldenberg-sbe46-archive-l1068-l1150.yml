  summary: 'The passage first gives philological notes on Mandala I, Hymn 26, including
    a note that a form in verse 9 likely refers to mortals and immortals. It then
    presents Mandala I, Hymn 27, verses 1-9: a speaker reverently worships Agni, asks
    him to be bountiful and protective, asks him to announce a Gayatra song to the
    gods, seeks booty and wealth, describes Agni as a bright distributor flowing in
    a river wave for the liberal giver, and states that a mortal protected by Agni
    in battles and races will gain nourishment, be unsurpassed, win with horses, and
    become a gainer with priestly help.'
