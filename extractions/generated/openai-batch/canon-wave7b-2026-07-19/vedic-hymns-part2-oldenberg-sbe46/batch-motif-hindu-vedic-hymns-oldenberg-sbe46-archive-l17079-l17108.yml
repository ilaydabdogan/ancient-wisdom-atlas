  quote: ''
  summary: 'A Vedic hymn passage describes dawn and sunrise: Agni observes the shining
    dawns and treasures; the Asvins are summoned; the god Sitrya rises with light;
    Savitvz sends light upward; Varuza and Mitra make the Sun rise according to law;
    the gods create the all-observing Sun to disperse darkness; seven young fallow
    mares carry the Sun forward; the Sun''s rays remove and sink darkness into waters;
    and an unsupported figure is described as the pillar of Heaven protecting the
    firmament.'
