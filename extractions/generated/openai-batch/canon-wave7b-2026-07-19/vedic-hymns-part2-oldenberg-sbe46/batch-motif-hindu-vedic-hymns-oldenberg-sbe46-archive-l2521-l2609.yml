canonical_text:
  quote: ''
  summary: The passage presents Mandala I, Hymn 58, a hymn to Agni. Agni is described
    as an immortal Hotr and messenger of Vivasvat who travels through the air and
    invites the gods with sacrificial food. He stands and burns on brushwood, is sprinkled
    with ghee, roars, spreads through fuel and forest, and causes beings to fear.
    The Rudras and Vasus appoint him as Purohita and Hotr; the Bhrigus place him among
    men. The hymn asks Agni for treasure, protection, shelter, and aid to the praiser.
    The following notes ascribe the hymn to Nodhas Gautama and discuss metre and textual
    readings.
  language: English
  quote_policy: summarized
