canonical_text:
  quote: ''
  summary: The passage contains editorial notes on a Vedic Apri hymn and the opening
    verses of Mandala I, Hymn 143. The notes discuss ritual address, sacrificial grass,
    the personified offering Bharati, the navel as a father-son symbol, Tvashtri as
    giver of sons, and Vayu as Indra's companion. Hymn 143 addresses Agni with a new
    prayer, describes him as son of strength and child of the Waters, born in the
    highest heaven, visible to Matarisvan, filling Heaven and Earth with light, set
    by the Bhrigus at the navel of the earth, destructive like a warrior, and asked
    to fulfill desire and protect the people with guardians.
  language: English
