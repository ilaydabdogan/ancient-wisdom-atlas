    Soma with Agni, praises Agni as Gātavedas with great strength, locates Agni's
    splendour in heaven, earth, plants, waters, and air, describes Agni going to heavenly
    and lower waters and speaking to gods, and petitions fires of soil and hill-sides
    to accept sacrifice and plentiful food.
