  quote: ''
  summary: The hymn addresses Agni with prayer and song, associates him with sacrifice,
    Azta/Ata, and the bull, contrasts proper service with violence and falsehood,
    asks about fettering an impostor and protecting against untrue speech, says former
    friends harmed themselves by wrong words, and prays that one who magnifies Agni's
    sacrifice may receive a good dwelling.
  language: English
