  quote: ''
  summary: The passage includes two translated verses addressing sacrificial posts
    and a “lord of the forest,” followed by notes identifying the hymn as liturgical
    material for erecting, anointing, and binding the sacrificial post. The verses
    liken the posts to horns on the earth, ask them to hear invoking priests and protect
    in battles, and ask the forest-lord to rise with branches so that the worshippers
    may rise with offspring. The notes connect the post with a tree, butter or honey
    anointing, mother Earth, grass rope, and a comparison with a girdled youth in
    the Upanayana ceremony.
