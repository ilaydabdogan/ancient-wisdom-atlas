  summary: The passage contains notes identifying seers and metre, followed by Mandala
    V, Hymn 25, an English translation of a hymn to Agni. The hymn addresses Agni
    with song and prayer, describes him as kindled by ancient men and gods, calls
    him Hotri and carrier of offerings, asks him for wealth and protection, credits
    him with granting sons, lords, steeds, and gains, describes his flames and roar
    through similes, and ends by asking him to help the worshippers across enemies
    as with a ship.
