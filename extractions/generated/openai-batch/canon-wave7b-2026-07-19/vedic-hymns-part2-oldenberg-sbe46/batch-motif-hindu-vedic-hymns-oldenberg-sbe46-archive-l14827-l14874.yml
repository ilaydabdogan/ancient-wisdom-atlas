canonical_text:
  quote: ''
  summary: The passage describes figures invoking dawns, driving milch-cows out of
    a rock-stable or prison, renting and opening a closed rock with godly words, finding
    light, chanting prayers, naming or discovering essences of the cow, and seeing
    darkness disappear as Dawn and the Sun rise. It then mentions awakened gods receiving
    a treasure given by Heaven, a prayer to Mitra and Varuza, and an address to flaming
    Agni as Hotvz and sacrificer who makes milk flow like Soma sap. The supplied passage
    ends with a fragment about Aditi as freedom of all.
  language: English
  quote_policy: summarized
