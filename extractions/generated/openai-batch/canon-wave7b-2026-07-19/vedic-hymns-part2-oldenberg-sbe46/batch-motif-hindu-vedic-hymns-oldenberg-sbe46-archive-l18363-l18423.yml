canonical_text:
  quote: ''
  summary: A hymn addresses Agni as an ancient, kindled, brilliant household god,
    guest, and lord of the house. Human clans praise, kindle, and offer ghee, fuel,
    libations, songs, and adoration to him. The gods appoint kindled Agni as their
    messenger, bearer of oblations, and eye. Strengthened by offerings, fuel, and
    plants, Agni spreads over terrestrial spaces and is associated with shelter, help,
    treasure, vigour, and food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men who love Azta and ancient ones kindle Agni for bliss, and the stanza calls
    him highly brilliant, worshipful, household god, lord of the house, and chosen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The clans set Agni down as an ancient guest and flame-haired lord of the house
    with mighty light, many shapes, shelter, help, and activity among decayed wood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Human clans magnify Agni as one who knows sacrificial libations, bestows treasures,
    is hidden yet visible, roars, is an excellent sacrificer, and shines with ghee.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speakers say they praise Agni with songs, sit near him with adoration,
    and ask the kindled Angiras to be pleased through a mortal offering.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Agni is said to bestow vigour on every house, rule over much food, and rush
    forward with undefiable impetuousness.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: When Agni is kindled, the gods make him their messenger, bearer of oblations,
    and eye; offerings are poured into him and he dwells in ghee.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Men desiring Agni's favour kindle him with good fuel; offerings of ghee are
    poured on him, and strengthened by plants he spreads over terrestrial spaces.
  category: sequence
  evidence_refs:
  - ev:7
