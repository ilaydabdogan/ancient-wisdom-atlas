canonical_text:
  quote: ''
  summary: A hymn addresses Agni as purifier, brilliant god, offerer, Hotṛ, messenger,
    carrier of offerings, and priest. The speakers ask Agni to bring the gods to the
    sacrifice and feast, to bring abundance to the Soma-pressing sacrificer, and to
    sit on the sacrificial grass with the gods. The hymn asks that the sacrifice proceed
    in order and that the Maruts, Aśvins, Mitra, Varuṇa, and the gods with their folk
    sit on the sacrificial grass.
  language: English
  quote_policy: summarized
