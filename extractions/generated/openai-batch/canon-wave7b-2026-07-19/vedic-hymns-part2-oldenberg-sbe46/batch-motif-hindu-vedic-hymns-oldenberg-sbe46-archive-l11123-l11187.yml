canonical_text:
  quote: ''
  summary: A section of Mandala III, Hymn 2 praises Agni/Vaisvanara as the sacrificial
    priest and domestic divine fire. Worshippers surround him at sacrifice, offerings
    strengthen him, three logs are purified for him, and he is described as moving
    through heaven and earth, mounting the firmament, shining like the sun, and distributing
    wealth and welfare.
