canonical_text:
  quote: ''
  summary: 'The passage consists of notes on Mandala II, Hymn 4. The notes discuss
    Agni in priestly and ritual roles: as connected with the Hotṛ, Brahman, Neshtṛ,
    Ṛtvig, and possibly Agnīdh; as one who protected the fathers, is born again, and
    will protect the present sacrificer; as a strong horse; as possessing seven rays
    or reins and a mysterious eighth ray or rein; and as accompanied by female, cow,
    sister, oblation, dawn, spoon, and milk-vessel imagery in connection with sacrificial
    action.'
  language: English
  quote_policy: summarized
