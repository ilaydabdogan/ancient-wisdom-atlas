canonical_text:
  quote: ''
  summary: A hymn addressed to Indra-Agni invites the paired deities to come to the
    pressed Soma and drink. The speaker praises them as bounteous, foe-killing, united,
    unconquered winners of booty. The hymn describes worshippers praising them through
    sacrifice, recalls their destruction of ninety strongholds ruled by Dasas, says
    thoughts move toward them along the paths of Rta, and attributes to them powerful
    abodes, crossing of waters, and the display of heavenly lights.
  language: English
  quote_policy: summarized
