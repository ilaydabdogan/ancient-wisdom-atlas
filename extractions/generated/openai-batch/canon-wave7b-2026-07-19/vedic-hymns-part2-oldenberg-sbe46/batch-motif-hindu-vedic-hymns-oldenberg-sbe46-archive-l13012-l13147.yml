canonical_text:
  quote: O Vasu! Lead us and bring us across anguish.
  summary: The passage includes the close of a hymn to Agni, notes on textual readings,
    and the opening six verses of another hymn to Agni. Mortals ask Agni to notice
    their sacrifice, make sacrificial food savoury, repel fiends, sorcerers, and plagues,
    protect at dawn and sunrise, lead worshippers across anguish, help the Usigs to
    wealth, bring shelters, bring or increase Heaven and Earth, and keep mortal hatred
    away.
  language: English
  quote_policy: quoted
