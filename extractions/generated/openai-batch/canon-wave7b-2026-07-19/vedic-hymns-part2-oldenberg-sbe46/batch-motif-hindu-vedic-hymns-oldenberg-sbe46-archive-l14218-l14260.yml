  summary: A hymn addresses Agni in a sacrificial setting. Human worshippers use ghee,
    ladles, oblations, and prayer; Agni is praised as a strong immortal purifier,
    carrier and accomplisher of offerings, divine priestly figure, helper against
    hostile powers, horse-like figure led at sacrifices, and generative figure related
    to beings and Daksha.
