canonical_text:
  quote: ''
  summary: A hymn addressed to Agni asks him to lead the speakers on a good path to
    wealth, remove sin, carry them safely across difficulties, protect them from plagues,
    danger, foes, and harmers, and grant shelter, earth, wishes, food, and rain. The
    hymn also describes Agni as knowledgeable, discerning, flaming in his seat, and
    approached or tended by named groups.
  language: English
