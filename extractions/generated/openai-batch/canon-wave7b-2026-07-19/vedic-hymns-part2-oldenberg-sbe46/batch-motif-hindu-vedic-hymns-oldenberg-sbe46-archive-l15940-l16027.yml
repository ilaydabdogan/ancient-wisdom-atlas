canonical_text:
  quote: ''
  summary: A hymn addresses Agni, asking him to send flames, heat, arrows, spies,
    and guardians against sorcerers, evildoers, and enemies. It also asks Agni to
    favor worshippers who offer sacred speech, hymns, offerings, and hospitality,
    granting auspicious days, rain, wealth, protection, and household friendship.
    The hymn refers to kinship transmitted from Gotama and to Agni's guardians saving
    the blind son of Mamata from distress and deception.
  language: English
  quote_policy: summarized
