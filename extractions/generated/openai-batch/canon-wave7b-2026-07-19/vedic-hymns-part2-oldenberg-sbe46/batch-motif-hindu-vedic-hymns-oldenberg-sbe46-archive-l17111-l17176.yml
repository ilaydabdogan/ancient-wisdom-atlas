canonical_text:
  quote: ''
  summary: 'The passage gives notes on Mandala IV, Hymn 13, stating that Hymns 13
    and 14 form a paired set with the same verse count and metre and similar openings
    and endings, both involving Agni and the Asvins in a matutinal oblation context.
    It then gives Mandala IV, Hymn 14: Agni Gatavedas has looked on the shining dawns;
    the Nasatyas are invited on their chariot to the sacrifice; the god Savitzz sends
    brightness upward and the Sun fills Heaven, Earth, and air with rays; Ushas arrives
    with light, awakens beings to welfare, and rides a well-yoked chariot; chariots
    and horses are asked to bring the addressed gods at dawn to drink Soma or honey-drink
    at the sacrifice.'
