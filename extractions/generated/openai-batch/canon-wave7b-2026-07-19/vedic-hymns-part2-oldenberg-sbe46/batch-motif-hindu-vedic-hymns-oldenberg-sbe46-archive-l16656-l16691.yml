  summary: A hymn addresses Agni as an all-possessing messenger, immortal bearer of
    offerings, sacrificer, Hotṛ, and priest. Agni is said to know the place of wealth
    and the ascent to heaven, to conduct and direct the gods for the righteous worshipper,
    to move between men and gods, to receive offerings and kindling, to bring wealth,
    offspring, and gains, and to pierce hostile powers.
