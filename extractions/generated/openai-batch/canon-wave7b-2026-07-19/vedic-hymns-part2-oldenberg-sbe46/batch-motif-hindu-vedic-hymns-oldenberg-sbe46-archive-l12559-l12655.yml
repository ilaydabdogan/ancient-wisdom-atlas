  summary: Mandala III, Hymn 10 addresses Agni as a divine fire of worship and sacrifice.
    Mortals and priests kindle and praise him; he is asked to guard, come with the
    gods, receive speech and prayers, perform the sacrifice for the gods, carry sacrificial
    food, and grant strength, wealth, heroes, and welfare. The notes identify ritual
    and textual parallels, including the seven Hotrs at the Soma sacrifice.
