canonical_text:
  quote: ''
  summary: After philological notes, the passage gives part of a hymn to Agni. The
    hymn addresses Agni as vigorous, widely worshipped, and ritually placed or kindled
    by men and gods. Agni is chosen as messenger and Hotr, receives sacrificial food
    and oblations, carries sacrifice to the gods, and is asked to grant wealth, booty,
    valiant men, blessing, life, and protection from foes, ghouls, sorcerers, mischief,
    and niggards. His flames, rays, and smoke connect with heaven, and he is compared
    to a horse in battle.
  language: English
  quote_policy: summarized
