canonical_text:
  quote: ''
  summary: Commentary on Rig-veda Mandala I, Hymn 31 discusses the term vidatha in
    relation to ordinance, sacrifice, and council; notes variant interpretations of
    verses involving Agni; and comments on Agni as comforter, thirst-quencher, protector,
    and four-eyed divine guardian, with comparisons to Yama's four-eyed watchdogs
    and to genealogical figures such as Nahus, Manu, and Ila.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage explains vidatha as connected with distribution, disposition,
    ordinance, and says that sacrifice and vidatha became nearly synonymous in some
    Vedic usage.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports a translation in which an addressed figure saves a man
    who has gone the wrong way in battle and kills in the strife of heroes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Agni is described in commentary as giving comfort to two thirsty races, gods
    and men, and as quenching the thirst of other beings while being thirsty himself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nahus and Nahusha are said to have much the same value as Manus and Manusha,
    while only part of the Aryan tribes are said to have been considered descendants
    of Nahus.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The goddess Ila is described as the teacher of mankind and, in one possible
    explanation, as teacher of a newborn child.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: One reported interpretation says Agni was called the son of Ila in another
    cited passage, and says Manu is father and husband of Ila and father of mankind.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Agni is said to protect a man who has no quiver and therefore cannot protect
    himself.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The divine guardian's four eyes are interpreted as enabling vision in all
    directions and perhaps the sight of invisible bad demons.
  category: attribute
