canonical_text:
  quote: ''
  summary: Commentarial notes on Rig-veda I, Hymn 96 discuss the Dhishava/Dhishaza
    as a sacrificial support connected with Soma pressing, water, and fire; its theological
    development into a goddess of wealth and a likeness for Earth and Heaven-and-Earth;
    Nivids as invocation formulas; Ayu, Manu, Ushas, Vivasvat, and Yama; Agni’s epithets
    and identifications; and Matarisvan as Vivasvat’s messenger who carried fire from
    heaven to earth.
  language: English
  quote_policy: summarized
