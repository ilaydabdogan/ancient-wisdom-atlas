  quote: ''
  summary: Editorial notes discuss the Apri hymns in relation to corresponding Praishas
    of the Maitravaruna priest, cite scholarship on the Apri hymns' ritual position,
    and comment on verses 1-4. The notes examine the meanings of Tantinapat and Narasamsa,
    compare Narasamsa with Avestic Nairyésanha, caution against proving that Tantinapat
    and Narasamsa are forms of Agni, describe their work as spreading ghrta or honey
    over the sacrifice, and state that a regular Apri verse is addressed to Agni with
    the epithet meaning 'magnified.'
