canonical_text:
  quote: ''
  summary: A hymn to Agni praises him through comparisons to inherited wealth, sage
    instruction, a guest, a Hotyzz, Savitvz, a king, heroes, and a beloved wife. Agni
    is described as truthful, protective, dwelling on earth, kindled in the house,
    worshipped by men, and supporting life and riches. The speakers pray that liberal
    donors gain nourishment and long life, that they win booty from the non-giver,
    and that they obtain glory before the gods. The final provided lines mention lowing
    milch-cows of A’zta assigned by Heaven and rivers imploring divine favour from
    afar.
  language: English
  quote_policy: summarized
