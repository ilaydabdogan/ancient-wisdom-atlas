canonical_text:
  quote: ''
  summary: The passage contains notes on Rigvedic verses mentioning seven Azshis breaking
    a mountain that held cows, ritual men kindling Agni and strengthening Indra, Urvasis
    or Apsarases desiring mortal love and giving birth to children such as Ayu, and
    dawns manifesting Reta. It then gives Mandala IV, Hymn 3, verses 1-7, in which
    Agni/Rudra is invited for protection, seated in a prepared ritual home likened
    to a marriage-bed, praised with hymns, and questioned about what he will say concerning
    sin before several deities.
