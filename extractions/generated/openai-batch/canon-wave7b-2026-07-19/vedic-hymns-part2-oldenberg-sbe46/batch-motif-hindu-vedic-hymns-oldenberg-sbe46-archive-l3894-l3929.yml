  summary: The passage describes amorous women and sisters in dawn imagery; the Angiras
    fathers breaking fortresses and a rock through hymns and shouting, opening a heavenly
    path and obtaining day, sun, and dawn-light; prayers approaching the gods with
    delight; Matarisvan producing a reddish figure by attrition who enters every house
    and acts as messenger; and a later episode involving sap, Heaven, speckled cows,
    an archer, a god, and a daughter. The passage ends with an incomplete invocation
    to Agni.
