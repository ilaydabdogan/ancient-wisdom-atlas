canonical_text:
  quote: ''
  summary: The passage contains editorial notes on a preceding Agni hymn and the text
    and notes for Mandala I, Hymn 146. Hymn 146 praises Agni as a many-formed, ageless
    being with three heads and seven rays or reins, seated in the lap of his parents,
    identified in the notes with Heaven and Earth. Agni is described through images
    of a bull, flames or horses, red ones licking an udder, two milch-cows interpreted
    as Night and Dawn, wise poets or priests following his track and searching the
    river for him, and Agni becoming visible as the Sun. The final verse presents
    him as sought in his courses and as a progenitor for germs in many places.
  language: English
  quote_policy: summarized
