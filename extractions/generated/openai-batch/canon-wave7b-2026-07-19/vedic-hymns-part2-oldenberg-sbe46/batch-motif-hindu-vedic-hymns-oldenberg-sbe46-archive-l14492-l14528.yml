canonical_text:
  quote: ''
  summary: The passage describes preparing a ritual support and generative implement
    for producing Agni by rubbing. Agni or Gatavedas is said to dwell in the two fire-sticks
    like a germ in pregnant women, to be conceived and born, then laid on the navel
    of the earth so that he may carry offerings to the gods. Men rub and bring forth
    Agni as the banner of sacrifice; once born, he flames in the wood and is described
    as racer, priest, rain-giver, praised by sages, and placed by the gods in sacrifices.
  language: English
  quote_policy: summarized
