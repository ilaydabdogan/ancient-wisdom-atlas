canonical_text:
  quote: ''
  summary: The passage first gives philological notes on readings and named figures
    in Mandala I, Hymn 36, then presents Mandala I, Hymn 44.1-14. The hymn invokes
    Agni at dawn to bring wealth and the gods, describes him as messenger, bearer
    of sacrificial food, charioteer of worship, priest, protector, and guardian. Human
    ritual agents kindle Agni and press Soma; Agni is asked to conduct gods to drink
    Soma, to be placed on the altar as Manus did, and to hear praise with deities
    including the Asvins, Dawn, Mitra, Aryaman, Maruts, and Varuna.
  language: English
  quote_policy: summarized
