canonical_text:
  quote: ''
  summary: The passage includes notes on the goddesses Ila, Sarasvati, and Mahi; a
    note interpreting vanaspati, the “lord of the forest,” as the sacrificial post
    to which a victim is tied and from which it is released before being led away;
    and the opening ten verses of Mandala I, Hymn 26, in which Agni is invoked as
    sacrificial god and Hotr, offerings are made in Agni, other deities are invited
    to sit on sacrificial grass, and sacrifice is linked with blessings, wealth, friendship,
    and mutual praise between mortals and immortals.
  language: English
  quote_policy: summarized
