canonical_text:
  quote: ''
  summary: The passage is a hymn section addressing Agni as protector, father, kinsman,
    wealth-giver, law-guardian, and ritual mediator. Agni is asked to protect worshippers,
    givers, kin, cows, and Soma-offerers; to accept hymns and offerings; to bring
    wealth and heavenly reward; to forgive faults; and to conduct the host of gods
    to the sacrificial grass. Other figures named or invoked include Heaven and Earth,
    the gods, Ilā, Manus, Angiras, Yayati, and the ancients.
  language: English
  quote_policy: summarized
