canonical_text:
  quote: ''
  summary: A hymn addresses Agni with questions about acceptable supplication and
    sacrificial wisdom, invites him to sit as Hotr and leader, asks Heaven and Earth
    to protect him, requests that he sacrifice to the gods, burn sorcerers, protect
    rites from imprecations, bring Indra with his two bay horses, and act as giver
    and father of riches. The hymn recalls Agni’s sacrifice with the sacrificial food
    of wise Manu and asks him to perform the sacrifice today with his ladle.
  language: English
