  summary: The passage praises and petitions Agni. A central figure raises his arms,
    displays a fierce appearance, is associated with cows and waters, is invoked as
    kindled protector, produces streams or floods on dry ground, receives what is
    old into his belly, moves in young grass, and is asked to shine for wealth and
    glory. Mitra, Varuna, Aditi, Sindhu, Earth, and Sky are also asked to grant the
    request.
