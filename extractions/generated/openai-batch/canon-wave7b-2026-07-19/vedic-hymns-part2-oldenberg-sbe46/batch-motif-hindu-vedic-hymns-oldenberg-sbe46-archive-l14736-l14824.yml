canonical_text:
  quote: ''
  summary: The hymn addresses Agni as a god generated and appointed by the gods, asking
    him to intercede with Varuna and the Maruts for mercy, blessing, and removal of
    anger. It describes Agni’s brilliance, sacrificial offices, companionship with
    mortals, relation to divine treasure, and birth imagery involving dwellings, the
    air, a womb, a bull’s nest, and seven friends.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The gods set Agni to work as their divine steward and generated him as an
    immortal among mortals and a wise, god-loving god.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker asks Agni to turn with kindness toward Varuna and the gods; Varuna
    is described as one who accepts sacrifice, an eldest righteous Aditya, and a king
    supporting human tribes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Agni is asked to find mercy with Varuna and the all-brilliant Maruts and to
    bless the speakers so that they may propagate themselves and press onward.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Agni, who knows Varuna, is asked to deprecate the god’s anger, remove hatred,
    and cause Varuna to go away from the speakers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Agni’s appearance is described as excellent and brilliant among mortals, and
    is compared to bright heated cow-butter and the bountifulness of a milch-cow.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Agni is said to have three highest, true, and lovely births and to have come
    hither bright, brilliant, and shining while enveloped in the infinite.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Agni is described as a messenger and Hotri with a golden chariot, lovely tongue,
    and red horses, longing for all seats.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Agni, called the kinsman of sacrifice, has enlightened men, is led forward
    by a great rope, dwells in a mortal’s dwelling, and has obtained companionship
    with the mortal.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The speaker asks knowing Agni to lead the speakers to a god-given treasure
    that the immortals and Dyaus the father and begetter have created by thought and
    besprinkled.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Agni is said to have been born first in dwellings, at the bottom and womb
    of the air, footless and headless, hiding both ends, in the nest of the bull.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: A host came forth at first in the womb of A’ta and the nest of the bull; seven
    friends were born for the bull.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The partial final verse states that the speakers’ human fathers have sat down
    here.
  category: action
  evidence_refs:
  - ev:12
