  summary: The passage gives philological notes, then a hymn to Agni. Agni is addressed
    as the Hotr seated on the Hotr's seat, a messenger, protector, leader toward wealth,
    sacrificer, treasure-lord, source of brilliant speech, and guardian who shines
    with light and wealth. The speakers worship Agni at his birth-place and lower
    abode, honor the womb from which he sprang, offer oblations in him when kindled,
    and ask for protection, food, wealth, offspring, and continuity.
