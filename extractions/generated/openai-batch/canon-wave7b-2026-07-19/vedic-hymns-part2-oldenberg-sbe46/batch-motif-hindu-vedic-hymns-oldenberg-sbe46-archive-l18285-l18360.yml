  summary: A hymn fragment addresses Agni as a butter-drinking bestower, speaks of
    seizing the spirit of Adhrig(?) as a head of cattle, and asks Atri and Isha to
    overcome non-giving opponents. The notes identify Isha Atreya as rishi, discuss
    a difficult image of streams of Ghrita moving like an axe at Atri’s sacrifice,
    and raise a conjectural charm interpretation for verse 10.
