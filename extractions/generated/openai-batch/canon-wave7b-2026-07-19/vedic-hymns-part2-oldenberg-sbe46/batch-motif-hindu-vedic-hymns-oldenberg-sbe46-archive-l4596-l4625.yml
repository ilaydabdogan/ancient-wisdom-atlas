canonical_text:
  quote: ''
  summary: 'A fragment mentions floods breaking through a rock. The hymn then addresses
    Agni: worshipful gods seek his favor, win glory in the sky, and differentiate
    Night and Dawn by shape and color. The speakers ask Agni to further them and their
    patrons to wealth, protect them in contests against enemies, grant mastery of
    inherited riches and long life, and accept their hymns so that they may gain the
    glory assigned by the gods.'
