canonical_text:
  quote: ''
  summary: The passage includes editorial notes and Mandala I, Hymn 127. The hymn
    praises Agni as sacrificial priest, divine fire, guest and lord of the house,
    recipient and carrier of offerings, conqueror of foes, protector, and giver of
    wealth and valiant offspring. It repeatedly links Agni with flame, ghee, kindling,
    prayers, dawn, ritual production by attrition, and sacrificial procession.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An editorial note says that Agni, standing alone and not accompanied by Indra
    or the Maruts, is rarely mentioned as drinking Soma, and suggests that the verse
    may have been composed for a special occasion rather than the regular Soma sacrifice.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Agni is described as a munificent Hotvz, Vasu, Son of strength, Gatavedas,
    priest-like figure, best performer of the sacrifice, and god whose flame longs
    for the shine of boiling ghee or butter offered in the fire.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sacrificers call Agni with prayers and priestly prayers, and the hymn
    says all folks should favour him in order to speed him to the sacrifice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Agni is described as flame-haired, as the Hotvz of human tribes, and as one
    who encompasses the earth like heaven.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Agni is said to conquer deceitful foes; strong or steady things melt or waste
    away before him; he enters many forests and destroys firm food or firm things
    with his strength.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Agni's power is said to be more visible by night than by day; his life is
    compared to a firm hold and a safe refuge for a son; the fires are described as
    never growing old and tending toward blessings.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Agni is said to make a mighty noise like the host of the Maruts, to become
    the banner of the sacrifice, and to have men follow his path as for a triumphal
    procession.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Kistas and the Bhvzgus address Agni with reverence; the Bhvzgus produce
    him by attrition, and Agni is called lord of goods and supporter.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Agni is invoked as lord of all people, common master of the house of all,
    guest of men, and one carried by prayers as by a vehicle to enjoy the sacrifice.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Agni is said to be born mighty for the divine world, and others walk around
    him like obedient servants.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Praise is directed to the great Agni who awakens at dawn, and he is compared
    to a singer in front of the dawns.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The speaker asks Agni to bring great wealth, to make the worshippers behold
    bliss of valiant offspring, and to produce such bliss for those who praise him
    as fire is produced by attrition.
  category: speech
  evidence_refs:
  - ev:11
