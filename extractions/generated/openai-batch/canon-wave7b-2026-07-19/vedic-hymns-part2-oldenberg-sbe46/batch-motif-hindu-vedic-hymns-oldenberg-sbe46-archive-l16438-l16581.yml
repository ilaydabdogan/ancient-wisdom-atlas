canonical_text:
  quote: "“Thou goest as a messenger, chosen from of old, thou who knowest best the
    ascents to heaven.”"
  summary: The passage includes philological and ritual notes, then a hymn to Agni.
    Agni is described as established by sacrificers, made to shine by Apnavana and
    the Bhrigus, present in houses, set as Hotr with purifying flames, hidden in wood
    or mothers, recipient of offerings, messenger of the sacrifice across the two
    worlds, born as a child conceived by a virgin, strengthened by wind and fuel,
    and likened to a racing horse.
  language: English
  quote_policy: quoted
