  summary: The passage contains notes on Mandala III, Hymn 8 and the text and notes
    of Mandala III, Hymn 9. Hymn 9 addresses Agni as a god chosen by mortals for protection,
    offspring of the Waters, connected with wood and return from the Waters, found
    and brought from afar by Matarisvan, taken up as carrier of sacrificial food,
    served with offerings, and installed as Hotr by many gods.
