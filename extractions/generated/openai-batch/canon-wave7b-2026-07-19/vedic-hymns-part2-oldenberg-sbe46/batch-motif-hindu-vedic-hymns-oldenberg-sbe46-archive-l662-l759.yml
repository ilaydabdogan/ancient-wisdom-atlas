  summary: The passage contains the close of a hymn to Agni asking him to bring the
    gods to the sacrifice and grant wealth and food, followed by notes on the hymn’s
    attribution and metre. It then begins an Apri hymn invoking Agni, Tānūnapāt, Narāśaṃsa,
    the divine gates, Night and Dawn, two divine Hotṛs, and the goddesses Iḷā, Sarasvatī,
    and Mahī in the context of preparing and conducting a sacrifice.
