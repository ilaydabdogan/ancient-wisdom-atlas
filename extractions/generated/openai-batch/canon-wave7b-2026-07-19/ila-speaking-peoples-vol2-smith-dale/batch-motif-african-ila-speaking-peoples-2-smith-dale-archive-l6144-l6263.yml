canonical_text:
  quote: ''
  summary: The passage describes Ba-ila beliefs about a fixed number of spirits receiving
    successive bodies, the identification of a newborn as a returning ancestor through
    divination, naming, water offering, and suckling signs, taboos surrounding the
    birth name, gender-crossing and double incarnation, and an authorial comparison
    with Wordsworth's idea of a soul coming from afar.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ba-ila are described as holding that spirits were created at the beginning,
    receive bodies, live briefly as ghosts after bodily death, and then receive new
    bodies.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Disembodied spirits are said to desire rebirth.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: If a child cries before the mother emerges from the hut, people consult divination,
    and a female spirit in the divining rod may identify the returning person and
    instruct that the child receive that name.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After divination, water is offered at the door, the returning person is addressed
    by name, a formula about not coming with two hearts is spoken, and water from
    the mouth is spurted over the child.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the child continues crying when called by the first name, a second divination
    may bring another spirit, and the first spirit is said to be conquered or driven
    away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The birth name is described as the great name or the name of the spirit, and
    addressing an elder by it is taboo except for certain senior relations or parents.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A woman's spirit may be born in a male, and elsewhere the passage states that
    a man may return as a woman.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:8
- id: obs:8
  text: The phrase about not coming with two hearts is explained as meaning that the
    spirit should not hurry to die or go away again.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Another identification method is to place the child at the breast and pronounce
    names of the grandfather and other forebears; sucking at a name confirms the identity.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage reports disagreement over whether the ancestral spirit becomes
    the child at the naming ceremony or enters the womb or embryo earlier.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says the continuing self can take male or female form and itself
    has no sex.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Some people have name prefixes that conventionally indicate the opposite sex,
    such as males with mother-prefixed names and females with father-prefixed names.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: A discarnate spirit may be accepted as returning in two bodies at the same
    time, with no assumption that one identification must be mistaken.
  category: relationship
  evidence_refs:
  - ev:10
