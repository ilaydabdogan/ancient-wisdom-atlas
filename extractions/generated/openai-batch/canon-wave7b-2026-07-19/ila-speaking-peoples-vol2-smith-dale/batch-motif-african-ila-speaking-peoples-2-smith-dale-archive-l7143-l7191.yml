canonical_text:
  quote: before they eat any of the grain (kusoma) they make an offering to their
    divinities.
  summary: The passage describes the kusomya early-maize rite, in which first ripe
    maize is offered at an ancestor's grave and at the hut threshold before eating.
    It then classifies personal, family, chief/headman, and communal divinities, emphasizing
    the great mizhimo as permanent communal powers, and gives Shimunenga of Kasenga
    as a communal muzhimo trusted for wealth, war victory, and protection from lions
    and pestilence.
  language: English
  quote_policy: quoted
