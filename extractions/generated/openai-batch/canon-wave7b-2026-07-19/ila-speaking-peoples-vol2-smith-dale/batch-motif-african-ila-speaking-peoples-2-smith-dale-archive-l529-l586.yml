canonical_text:
  quote: ''
  summary: 'The passage describes Ila postpartum and early-childhood practices: a
    mother uses an insungu medicine at the hut doorway and on the child to remove
    diseases; nursing, weaning, and new-moon timing are noted; and a Mutumbu, a woman
    who has recently given birth, observes multiple tonda taboos to protect the nursing
    child from illness, death, milk loss, dangerous animal traces, and harm from renewed
    conception.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After coming out from her hut, the woman places an insungu by the door.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: People passing in or out must jump over the insungu so that diseases may be
    taken away and leave the child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mother gives the child some of the insungu contents to drink, sprinkles
    some on the fontanelle and heart, and then washes the child all over.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The insungu practice is performed daily until the child becomes a mupumpula,
    about three years old, and the medicine is called fsambabacheche, translated as
    the babies' washer.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A woman who has recently given birth is called a Mutumbu; the nursing period
    lasts two or three years, with porridge supplementing milk early.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Weaning is to take place at a new moon; if difficult, the mother rubs nicotine
    from her pipe on the nipples.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Mutumbu must avoid many things, called tonda to her, because harm may
    come to the nursing child.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Mutumbu should not come out very early in the morning because she may
    step on the footprints of the nocturnal animal shibandilwabana, described as maleficent
    to children.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Mutumbu is forbidden to eat inshima ya kubwenga lest her breast milk dry
    up.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Mutumbu is forbidden to drink cold water; the stated consequence is that
    she or the child, or both, may die.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Mutumbu is forbidden to sit on married people's beds; the stated consequence
    is that the child will get chest sickness and die.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Mutumbu is forbidden to strip where anyone might see her; the stated consequence
    is that the child would waste away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Mutumbu is tonda to all men, including her husband, because conception
    is said to harm both the nursing child and the unborn child.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The husband may resume cohabitation only after the milk has dried up in the
    woman's breasts.
  category: sequence
  evidence_refs:
  - ev:9
