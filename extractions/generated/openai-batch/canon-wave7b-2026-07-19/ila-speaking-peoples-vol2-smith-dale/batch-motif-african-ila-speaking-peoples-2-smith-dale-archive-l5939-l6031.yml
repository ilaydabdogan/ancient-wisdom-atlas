canonical_text:
  quote: ''
  summary: The passage describes a communal mourning rite involving ash heaps and
    a pole so that Leza will not destroy the village; discusses the antiquity and
    possible Christian influence of Mwana Leza traditions; records an 1895 diary account
    of a woman led by Mwana Nyambe/Leza to see dead cattle alive and abundant grain
    stores; and begins a 1913 account of the leper-prophet Mupumani being carried
    by a ghostlike man into the presence of Namulenga/Mulengashika, who throws away
    his leprous body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people gather outside the village, are warned by elders not to joke or
    play, mourn for more than a week, collect ashes from all fires into a heap outside
    the village, and erect a pole by the heap.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pole by the ash heap is said to prove that the command has been carried
    out, so that Leza will pass by and not destroy the village.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The source commentary says Mwana Leza is a figure in folk tales and proposes
    that the story may combine an older local idea with Christian teaching transmitted
    through other groups or missions.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: A woman gathering roots in the forest is confronted by a big man who says
    he is Mwana Nyambe, parenthetically identified with Leza, and says he has come
    to make a revelation to her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The woman is told to take her basket and hoe and follow the big man far away
    to a kloof overspread with white sand.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: In the kloof she sees cattle that had died of disease, described as alive
    and healthy; the big man says he has taken the cattle away and will not allow
    the Mashukulumbwe to have more.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The big man shows the woman granaries and abundant grain stores, tells her
    to throw away her roots, fills her basket with corn, and commands her to return
    home and report what she has heard and seen, including a promise of abundant food
    at the next harvest.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The diary source records the teller’s intense excitement, offers a possible
    dream explanation, and the authors state that the story illustrates how some prophets
    receive messages.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: Mupumani is described as a leper and a prophet near Nanzela in June 1913 who,
    according to his account, was not given to dreams and had only one vision.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: While asleep in his hut, Mupumani sees a man descend from the roof; he cannot
    see the man’s face and says the man must have been a musangushi, a ghost.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The ghostlike man lifts Mupumani onto his shoulders and carries him away to
    an unknown place.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Mupumani finds himself in the presence of Namulenga, also called Mulengashika;
    the names are glossed as Creator and Creator of Pestilences.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: Namulenga takes Mupumani’s leprous body and throws it away; the passage ends
    before stating the outcome.
  category: action
  evidence_refs:
  - ev:10
