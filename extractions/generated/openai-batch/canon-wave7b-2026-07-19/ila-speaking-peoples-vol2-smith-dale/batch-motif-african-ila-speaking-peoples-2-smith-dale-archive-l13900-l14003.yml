canonical_text:
  quote: ''
  summary: The passage discusses Ila animal folktales, especially the personification
    of animals and the rivalry between Sulwe the hare and Fulwe the tortoise. Sulwe
    is described as a popular but cruel and cunning trickster who deceives other animals.
    Fulwe alone repeatedly defeats him, notably in a race and in a drought-and-well
    episode where a birdlime trap catches Sulwe. The passage concludes by contrasting
    Sulwe's swift active cunning with Fulwe's slow passive cunning.
  language: English
  quote_policy: summarized
