canonical_text:
  quote: ''
  summary: The passage contains the end of a tale explaining how Oribis became open-plain
    dwellers after losing their white coats, a tale in which Hare tricks Elephant
    into leaving his clothing outside while diving and then makes Elephant eat the
    stolen clothing, and the beginning of a tale in which Wart-hog dirties water before
    Elephant drinks and a leech fastens to Elephant's trunk until Elephant dies. The
    editor's note states that Elephant's 'clothes' are a euphemism for testicles and
    compares the Hare-Elephant trickster pattern with Baganda and Banyoro tales.
  language: English
  quote_policy: summarized
