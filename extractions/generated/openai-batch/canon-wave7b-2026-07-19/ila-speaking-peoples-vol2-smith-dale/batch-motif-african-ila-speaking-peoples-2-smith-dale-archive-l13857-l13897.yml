canonical_text:
  quote: '"animals as persons capable of volition"'
  summary: The passage summarizes Ila animal tales in which animals' present traits
    or destinies are explained through lying, theft, failed promises, intoxication,
    false accusation, or, in one case, gratitude for help. The authors generalize
    that destiny is affected by personal will, and that the tale makers treated animals
    as volitional persons.
  language: English
  quote_policy: quoted
