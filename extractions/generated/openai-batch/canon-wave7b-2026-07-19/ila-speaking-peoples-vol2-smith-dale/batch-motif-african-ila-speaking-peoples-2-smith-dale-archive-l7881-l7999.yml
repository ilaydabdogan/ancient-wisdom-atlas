canonical_text:
  quote: I am seeking Leza.
  summary: The passage presents an Ila legend of an old bereaved woman who seeks Leza
    to ask why she has suffered. She attempts to reach Leza in the sky by building
    a heaven-reaching structure from trees, then travels through many countries seeking
    the place where earth and sky meet. She dies without resolving her question. The
    passage then introduces statements by old chiefs about Leza, including Shikanzwa's
    claim that Leza has abandoned earlier ways and was formerly the Water-giver.
  language: English with Ila terms
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Ba-ila are said to tell a legend about a very old woman who seeks Leza
    to demand an explanation for the painful condition of the earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Leza, named Shikakunamo, is said to have acted against the woman's family
    by killing or taking away her parents, relatives, and descendants.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After becoming withered with age and expecting to die, the woman undergoes
    a change and grows younger.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman cuts down immense tall trees, joins them, and plants them as a structure
    meant to reach heaven; the structure falls twice when the lower timbers or foundations
    rot, and she falls without being killed or breaking a bone.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After abandoning the tree structure, the woman travels through country after
    country seeking the end of the earth, where she expects earth and sky to touch
    and a road to God to be found.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When questioned by people in different countries, the woman says she is seeking
    Leza because she is alone and bereaved of friends and kindred.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The people answer that Shikakunamo sits on the back of everyone and cannot
    be shaken off; the woman dies of a broken heart, and the problem remains unsolved.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The narrator distinguishes the preceding story as legend and then introduces
    statements by living old men, described as intelligent old chiefs not under Christian
    influence.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Shikanzwa says Leza has turned over and abandoned his old ways; he says that
    in earlier times Leza was truly the Water-giver and that all things on earth were
    still sufficient.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Shikanzwa says that today there is no heavy rain, no continued rain, and no
    great hail-storms.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Kambunga is introduced as another speaker, but the supplied excerpt provides
