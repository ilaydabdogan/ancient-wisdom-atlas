canonical_text:
  quote: ''
  summary: 'The supplied passage contains four short fool tales: a man searches for
    an axe he is carrying; a hunter mistakes his knees for a lion and chops his own
    knee; a traveller misconstrues road directions and sleeps at a fork until termites
    build near him; and visiting men mishear a promise of milk with bread as a command
    to mourn. Several tales are linked to remembered sayings or wordplay.'
  language: English
  quote_policy: summarized
