canonical_text:
  quote: ''
  summary: The passage describes several Ba-Ila children's games involving singing,
    marching through an arm-arch, imitation of a leader's actions, girls moving between
    facing lines with a piece of grass, a playful smacking and position-exchange game,
    a noisy circle game, a revolving pole game called bwato, and a swing called Nyumbe.
  language: English with Ila song phrases and English translations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Kanzhinge, two boys form an archway with their arms while other players
    march in file and pass through it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Kanzhinge, the rear boy is cut off and stands behind one of the two boys
    forming the arch, until one boy remains and tries to break through without being
    trapped.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kanzhinge includes sung lines translated as children making a circling movement
    in the forest and a little quail scratching about among herd-boys.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: In Lembelembe, boys sit in a ring and repeat the leader's chant while the
    leader directs individuals to kneel, sit on one hip-joint, and lie down.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Lembelembe, the leader makes a ring on the ground before each boy and varies
    a sung formula naming objects or animals at home, including a cow, an ox, a grain
    bin, and a stamping block.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the end of Lembelembe, the leader says a tsetse-fly will bite the last
    one, and the boys jump up, run off, and jeer the last to rise.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: In a girls' game, two lines face each other while one girl holds a bit of
    grass and moves by short jumps to the other side without rising.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The girls' game includes a song translated as taking a little animal to the
    singer's father, with the opposite side answering, 'Bring, bring.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: In another game, one boy sits with legs stretched out while another lies on
    his stomach between the sitting boy's legs; the sitting boy smacks the other while
    singing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: At the last word of the Bombambomba song, the two boys twist and exchange
    positions, so that the boy first sitting is now prone and is smacked in turn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: In another game, boys squat on their heels in a close circle, beat the ground
    with their palms, make noise and dust, and sing 'Wansomba wansomba.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: In bwato, a pointed upright pole is fitted into a longer pole with a hole;
    a boy sits on each end and they use sticks to set the longer pole revolving.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: The bwato pole revolves faster and faster in a way said to make spectators
    dizzy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Nyumbe is described as a swing, and the one swinging sings a line translated
    as 'Let me swing.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The author explicitly compares Kanzhinge to the game Oranges and Lemons.
  category: relationship
  evidence_refs:
  - ev:8
