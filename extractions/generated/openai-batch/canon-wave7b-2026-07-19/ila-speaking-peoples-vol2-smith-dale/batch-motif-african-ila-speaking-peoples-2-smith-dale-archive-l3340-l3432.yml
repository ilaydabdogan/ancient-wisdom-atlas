canonical_text:
  quote: ''
  summary: The passage explains Ba-Ila Dynamism as a reverenced but not fully personal
    power called X. It relates X to personality, ghosts, ancestor-worship, and the
    Leza-cult through a stated dualism in which impersonal force and personal characteristics
    shade into one another. X is described as pervasive, usually quiescent, neutral,
    and usable for good or evil by specialists. The authors compare it to electricity
    or a live wire, emphasizing danger, taboo, and the need for proper handling. The
    passage also explains how normally taboo acts or words may be required in abnormal
    ritual circumstances to restore normal conditions.
  language: English
  quote_policy: summarized
