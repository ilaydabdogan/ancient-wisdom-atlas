canonical_text:
  quote: ''
  summary: 'The passage describes chiko marriage payments among Ila-speaking peoples:
    typical goods and amounts, kin contributions, distribution among the bride’s kin,
    named portions for guardian and mother, rules about cattle offspring, grounds
    for rescission, and several litigation examples involving contested marriages,
    compensation, and replacement claims.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Settlement examples include blankets, goats, hoes, salt, oxen, cows, impande
    shells, cash, print cloth, beads, sheep, and tobacco.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says a chief's daughter may require as much as thirty head of
    cattle, while the general chiko is reckoned as four or five head of cattle, valued
    at about £12 to £15.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the chiko amount is arranged, the bridegroom or his representatives
    seek help from family and clan; the man’s chief may help, and payment may be made
    in instalments.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Chiko is described as mostly contributed by the bridegroom’s clansmen and
    mostly distributed among the bride’s clansmen; the parents, especially the father,
    receive little.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Shimalelo, the guardian of the girl, is said to receive the largest share
    of the chiko, while the mother receives a named portion called mukako.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Another portion, called lushila, is said to defray the cost of doing the girl’s
    hair with ochre and is described as a sign of appropriation before settlements
    are made.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that offspring of cattle received as chiko should not be
    disposed of; calves may later go to clansmen who did not initially receive a portion.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Rescission of chiko is said to be claimable for virulent or contagious disease,
    laziness, neglect to provide food by hoeing or cooking, and inability to bear
    children.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says a husband would claim another wife if the woman were incapacitated
    by accident, and her people must provide a replacement woman if she dies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Disputes and litigation arise when a man wants chiko returned, the wife’s
    relations refuse to surrender anything, or a woman runs away to another man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the first litigation example, a woman sent home to visit her sick mother
    was later married to another man, after which the husband claimed return of the
    chiko.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: In the second litigation example, a woman given as settlement was seized on
    the pretext that she had thrown ash on a man, described as a serious offence.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: In the third litigation example, a woman was claimed through childhood marriage,
    inheritance, later marriage with chiko, and a release claim; she was ultimately
    returned to the man admitted to be her lawful husband.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: In the fourth litigation example, a childhood marriage was disputed after
    the girl returned home; another suitor obtained her, and a refusal to attend her
    initiation dance was cited as repudiation.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: The passage characterizes these claims as liable to become unusually entangled.
  category: attribute
  evidence_refs:
  - ev:12
