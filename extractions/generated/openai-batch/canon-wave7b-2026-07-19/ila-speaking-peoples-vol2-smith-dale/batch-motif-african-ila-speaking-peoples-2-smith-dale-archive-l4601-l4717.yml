canonical_text:
  quote: ''
  summary: 'The passage describes older and special funerary practices among Ila-related
    groups: violent chiefly burial at Nanzela; non-burial of a pre-dentition child
    among the Bambala; burial customs for women dying in childbirth and pregnant women;
    burning or exposure of corpses believed likely to haunt; a reported case of cremating
    a neglected woman who threatened to return as a ghost; and substitute rites when
    a body is unavailable, with the ghost said to return to the paternal home.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Nanzela, an important chief's funeral was described as involving a large
    pit with a mat at the bottom and layered bodies, including slaves, the chief,
    wives, children, and other corpses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Slaves were killed for the chief's burial, a passing stranger could be killed
    and added, and women could voluntarily enter the grave to be buried alive with
    their husband.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Nanzela chiefly burial custom is said to have died out and to have not
    existed among the Ba-ila proper.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Among the Bambala, a child who dies before cutting its teeth is not buried
    but is thrown into the bush.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When a woman dies in childbirth, the child, whether alive or dead, is customarily
    buried clasped in the mother's arms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A pregnant woman must have the child removed before she is buried; in the
    reported example, the husband's mother removed the child and it was buried in
    another grave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The stated reason for removing the child from a pregnant deceased woman was
    that otherwise the woman would rise and her ghost would kill people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A deceased person suspected of harassing the living may be exhumed and burned,
    and a corpse of someone who threatened to haunt may be thrown into the bush or
    burned rather than buried.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In Chapman's report, a neglected old woman said before death that after she
    died she would return and trouble the people who had neglected her.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: A doctor used incantations and medicines, took the old woman's corpse to a
    lonely place, cut it up, burned it piece by piece, and scattered the ashes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When a body is unavailable for burial, such as after drowning, funeral rites
    are performed and some belongings of the deceased are buried.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: For deaths by veld fire, deaths far from home, and women married into another
    district, ceremonies are still described; in all these cases the ghost returns
    to the deceased's paternal home.
  category: sequence
  evidence_refs:
  - ev:9
