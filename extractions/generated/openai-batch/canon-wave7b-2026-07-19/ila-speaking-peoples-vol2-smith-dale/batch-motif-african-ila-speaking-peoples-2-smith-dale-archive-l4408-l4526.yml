canonical_text:
  quote: ''
  summary: The passage describes Ila funeral attendance, mourning displays, funeral
    feasting, contributions called chidizho, killing of cattle for burial wrappings
    and food, reciprocal estate claims, a detailed account of Kakobela's burial goods
    and address to the dead, and prolonged drumming, singing, and dancing at funerals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People are expected to attend funerals for blood relations, clan members,
    allied clansmen, and friends; absence may lead to an accusation of having bewitched
    the deceased.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Chongo's funeral, Mungaila was covered with white ash, wore minimal cloth,
    carried a broken stick and a wildebeest tail containing musamo, shouted and gesticulated,
    and repeatedly wallowed in dust while throwing ash over himself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Three old women sat with their arms around each other; four wives of the deceased
    lay on the grave as if lifeless; a lad of about fourteen lay on an ash-heap sobbing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some mourners show only perfunctory respect, such as men running across the
    kraal with spears; some people may be attracted to funerals by the meat provided.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Funerals involve feasting, and contributors bring a chidizho, described as
    a thing to weep with, such as an ox, beer, grain, goats, beads, print, or another
    item.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Cattle belonging to the deceased are killed; some cattle called masunto are
    set aside for the funeral, and wrapping-up cattle provide skins for the bottom
    of the grave and around the corpse.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The flesh of the ox whose skin is laid on the floor of the grave is not eaten
    by mourners but is given to dogs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A person who brings a chidizho has the right to receive an equivalent or more
    from the deceased's estate.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says the animals are not slain outright but are speared in a nonvital
    spot and allowed to bleed to death; on some occasions the observers ended the
    suffering with a rifle bullet.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage summarizes mourners' behavior as trying to look unhappy, make
    noise, and eat and drink; men smear themselves with clay and ashes, and women
    plaster themselves and neglect their appearance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Drums are kept sounding day and night, with singing and dancing; at Sezongo's
    funeral this continued for a month with hardly an hour's cessation.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: At Kakobela's funeral, the corpse was placed on skins, wrapped, covered with
    shells and beads, supplied with tobacco, pipes, seed grains, and other goods,
    given a pipe in the mouth, and addressed so that any complaints would be spoken
    before going below.
  category: sequence
  evidence_refs:
  - ev:5
