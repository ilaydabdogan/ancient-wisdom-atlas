canonical_text:
  quote: ''
  summary: The passage describes Ila beliefs and customs concerning lineage continuation
    through sons, conception medicine, secrecy around pregnancy, medical charms, and
    numerous pregnancy taboos for the woman and husband intended to protect the unborn
    child and regulate childbirth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sons are preferred to daughters because the family is continued through sons,
    and a man is said to be reborn on earth through his son rather than his daughter.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a woman does not conceive within about three months after marriage, her
    people seek conception medicine, and a doctor gives her a daily potion.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At a first pregnancy, the woman may not tell or be asked by her husband directly;
    she tells her mother, the mother tells her father, and the father asks the husband
    for a spear, hoe, or shell before the husband is told.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pregnancy news is not told outside the family except to the doctor, because
    of fear that ill-practices may cause miscarriage.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: If someone asks whether a woman is pregnant and miscarriage or child death
    follows, that person is blamed, must pay damages, and is said to have evil lips
    and to have bewitched the child.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The doctor prepares a charm for the woman's waist, gives her a small pot containing
    medicine, and instructs her about conduct and taboos during pregnancy.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The pregnant woman is described as taboo and a source of danger to the community,
    and her husband is also taboo through his close connection with her.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Blood and most animal flesh are forbidden to the pregnant woman because they
    are said to endanger confinement and the child; fresh barbel is also taboo, while
    hippopotamus flesh is treated as an exception.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Both husband and wife may not eat hartebeest flesh, because the animal is
    said to bear blind young and their child might be born blind.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Both husband and wife may not eat makwelekwele, meat torn by birds, because
    the child is said to risk returning into the womb as birds pull meat about.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Goose, wildebeest, and leftover food are forbidden because they are associated
    respectively with a long-necked child or a lengthy confinement.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The pregnant woman may not sleep in the daytime, cross bushbuck spoor, or
    look at unpleasant objects, because these acts are said to harm the child.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Looking into a house and withdrawing, or going in and out of the hut indecisively,
    is taboo because the child may act similarly during birth.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Intercourse between husband and wife is not taboo in early pregnancy and is
    regarded as beneficial, but it must cease in the last month or so lest the child
    be killed or its fontanelle pierced.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: The pregnant woman is forbidden sexual connection with other men and must
    avoid sitting on others' beds or stools, with relations-in-law, or with her lover;
    the passage says she may harm them or they may blight the unborn child.
  category: action
  evidence_refs:
  - ev:13
