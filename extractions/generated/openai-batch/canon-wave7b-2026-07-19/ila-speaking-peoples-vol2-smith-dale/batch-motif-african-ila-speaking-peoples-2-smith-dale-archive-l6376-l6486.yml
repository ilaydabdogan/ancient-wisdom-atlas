canonical_text:
  quote: ''
  summary: The passage describes a Ba-ila belief that a person's musedi, namesake,
    or guardian spirit functions as a personal god, protecting and guiding the person,
    giving warnings through dreams or an inner low voice, and remaining with the person
    from naming until death. The authors compare this belief with Platonic, Zoroastrian,
    Roman, American, Socratic, and modern psychological ideas of a guardian spirit,
    daemon, divine double, or secondary self.
  language: English
  quote_policy: summarized
