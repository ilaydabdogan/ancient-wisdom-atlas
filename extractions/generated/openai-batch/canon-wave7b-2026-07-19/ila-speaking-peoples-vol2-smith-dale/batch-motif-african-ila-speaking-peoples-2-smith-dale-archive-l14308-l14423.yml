  text: The people cultivated the grain, harvested it, stored it, ate from it, and
    then decided to burn the remaining grain; their leader alone did not burn his
    grain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the grain was burned, famine came; God gave fruits and named foods such
    as mantembe, mankolongwa, and busala as what people would have to eat.
  category: sequence
  evidence_refs:
  - ev:3
