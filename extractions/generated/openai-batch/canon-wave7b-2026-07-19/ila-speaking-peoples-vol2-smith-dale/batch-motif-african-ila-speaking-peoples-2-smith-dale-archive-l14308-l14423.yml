canonical_text:
  quote: ''
  summary: 'The passage contains several Ila folk-tale explanations: God gives grain
    to humans descending to earth, people waste and burn it, famine follows, and God
    assigns them wild fruits or roots as food; baboons are explained as former humans
    of the Bankontwe who became field-thieves in the veld; and a woman’s child is
    repeatedly soothed by an Eagle, but her husband, attempting to shoot the Eagle,
    misses when it dodges and his arrows pierce the child.'
  language: English
  quote_policy: summarized
