  text: The passage says that, to this day, people waste grain and then have to eat
    those roots.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: Baboons are said to have once been men of the Bankontwe clan who lived by
    stealing and later went to live in the veld.
  category: relationship
