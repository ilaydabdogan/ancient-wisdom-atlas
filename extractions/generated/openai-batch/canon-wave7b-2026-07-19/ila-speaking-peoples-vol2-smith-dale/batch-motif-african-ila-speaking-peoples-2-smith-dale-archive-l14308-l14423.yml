  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: A woman working in the fields laid her crying child in the shade, and an Eagle
    came and soothed the child with its wings.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The woman first feared the Eagle was eating her child, but the Eagle flew
    away when she approached and the child was unharmed in the described encounter.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: On the second day the Eagle again quieted the child without biting or scratching
    it, and the woman later told her husband; he refused to believe her.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The husband brought a bow and three arrows, hid near the child, shot at the
