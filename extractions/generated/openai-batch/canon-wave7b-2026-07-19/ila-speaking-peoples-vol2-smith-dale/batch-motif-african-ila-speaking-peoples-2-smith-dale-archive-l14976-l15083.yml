canonical_text:
  quote: ''
  summary: 'The passage concludes an etiological animal tale about Wart-hog and Elephant,
    including their resemblance, tusks, and a leech associated with dangerous water.
    A note explains that the tale accounts for Ba-Ila perceptions of resemblance between
    the two animals and adds naturalistic commentary about elephants fearing leeches
    in drinking water. A second tale explains why Wart-hog lives in burrows: Elephant
    deceives Wart-hog by taking his tusks and not returning them; Wart-hog ends the
    friendship, seeks Ant-bear, blesses Ant-bear with easy food on the tongue, and
    thereafter uses Ant-bear''s burrows. A third tale begins with Hare and Bushbuck
    visiting villages, stealing and killing a goat, collecting its blood, eating,
    and sleeping.'
  language: English
  quote_policy: summarized
