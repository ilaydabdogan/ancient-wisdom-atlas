canonical_text:
  quote: ''
  summary: The authors discuss Ba-ila psychology and warn against imposing an over-systematic
    analysis on Ba-ila ideas. They compare several Egyptian concepts of the human
    ego with Ba-ila terms, including heart/inside, shadow, skull- or nape-associated
    spirits, double, name, vital breath, and life, but conclude that presenting a
    composite Ba-ila ego in this way would over-elaborate and misrepresent Ba-ila
    ideas.
