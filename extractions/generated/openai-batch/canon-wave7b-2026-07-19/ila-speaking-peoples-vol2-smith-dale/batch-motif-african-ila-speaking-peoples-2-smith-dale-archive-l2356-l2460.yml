canonical_text:
  quote: ''
  summary: 'The passage gives two accounts of Ila marriage procedure after a girl''s
    initiation: the bridegroom is seized or summoned, the marriage is consummated,
    an old woman inspects compliance and receives beads and a hoe, the couple share
    bread and receive or accept a name, kin perform gift exchanges called fwenezha,
    the bride returns to her home to throw away the masansa, later instruction is
    given to both spouses, and a mother-in-law-house rite with beer and a hoe partly
    removes a taboo.'
  language: English, with some Latin and Ila terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the initiation is completed, the girl is taken to the place where she
    is to be married.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men at the village are told to catch the bridegroom when the women shout;
    when the shout occurs, they catch him, carry him to his home, and put him in his
    house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After dark, the woman is taken to the man's house and the marriage is consummated.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After consummation, the bridegroom hangs strings of beads measured to the
    bride's height on the bedpost and places a hoe on the fireplace.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: At cockcrow an old woman enters, inspects whether the girl's instructions
    were followed, announces compliance if she finds it, takes the beads and hoe as
    her reward, sweeps the house, and leaves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Bread and relish are placed between the newly married couple as they sit face
    to face; the woman feeds the man a dipped morsel, and the man feeds the woman
    in the same way.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The man gives the woman a name by proposing names until she accepts one; acceptance
    is indicated by nodding, while refusal in the second account is indicated by shaking
    the head rather than speaking.
  category: speech
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:8
  text: Bread is distributed to all people, old and young, so that they may join in
    madyanshima, the eating of bread.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: On the third day the woman's sisters and relations come to fwenezha; the man
    solicits goods from the community and distributes items such as beads, spears,
    a fish-spear, a hoe, and an axe.
  category: action
  evidence_refs:
  - ev:4
  - ev:8
- id: obs:10
  text: A basket of meal is brought, and a hoe is placed in it during the fwenezha-related
    exchange.
  category: object
  evidence_refs:
  - ev:4
  - ev:8
- id: obs:11
  text: The woman goes to her home to throw away the masansa, spends two nights there,
    and returns on the third day; this action appears in both accounts.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:12
  text: In the supplementary account, the bridegroom loses heart, runs away, and hides;
    the son of his uncle is then brought to sleep with the woman to 'eat her the marriage.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the second account, the husband accompanies the woman toward her parents-in-law's
    village with a spear, throws the spear in front of her, and she picks it up and
    carries it into the village.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: At her own village the woman is asked whether her husband is good; later she
    is given meal to take to her husband's people because she has not yet begun to
    cook for them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The woman's namesake visits her, takes a hoe, gives the hoe to the woman,
    and returns.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Later, the man's people collect grain and make beer, the woman's people mould
    the fire cones, and the woman's people instruct the wife and husband about cooking,
    reserved food, fruit, fat, clothing, and proper husbandship.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: When the man enters his mother-in-law's house, the mother-in-law gives him
    a hoe; the passage states that this partly does away with the taboo, with shouting
    that he is seen.
  category: action
  evidence_refs:
  - ev:10
