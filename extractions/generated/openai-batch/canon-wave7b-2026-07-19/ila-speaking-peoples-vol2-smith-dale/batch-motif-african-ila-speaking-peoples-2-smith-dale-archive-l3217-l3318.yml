canonical_text:
  quote: ''
  summary: The passage introduces the authors' theory of Ba-ila dynamism. It says
    Ba-ila life is strongly concerned with the unseen, distinguishes personal higher
    powers such as Mizhimo and Leza from impersonal mysterious forces, defines dynamism
    as belief and practice concerning hidden super-sensible energies or powers, and
    identifies a dualism between personal agents and impersonal potencies in Ba-ila
    conceptions of the unseen.
