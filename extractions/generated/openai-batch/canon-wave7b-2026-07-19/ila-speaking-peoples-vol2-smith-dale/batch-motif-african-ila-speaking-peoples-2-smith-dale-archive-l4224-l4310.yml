canonical_text:
  quote: ''
  summary: The passage explains Ila views on death, survival of the person, rare bodily
    return through powerful medicine, death occurring at the return of one’s birth
    hour, the desire for home burial among one’s people, deathbed notification, and
    observed funeral preparations including corpse arrangement, adornment, shaving,
    wrapping, and farewells by wife and children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that statements about the dead not returning deny bodily
    resurrection, not the continued existence of the person.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A very rare and powerful medicine called musamo wa Iwende is said to enable
    some dead people to return in the flesh.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person who has taken the medicine warns his people not to weep after his
    death; they place his body on a platform in the veld without ceremony; after three
    days he is supposed to get up and go east.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: As the returned man reaches each kraal, people give him food because they
    believe he is alive, and only afterwards hear that he was dead.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The returned man travels east to Chundu, marries and settles there, but dies
    immediately if someone from his former home sees him alive.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A reported mulozhi was killed outright twice, was not buried, revived through
    drugs, lived in the veld, and was seen by people going to water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A saying states that a person dies only when the hour of his birth arrives
    again.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A sick Mwila away from home wants to return to his village so that, if death
    occurs, he may be buried among his own people, be mourned by them, and have his
    ghost join the ghosts of his fathers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Carrying a living person in an improvised stretcher is considered unlucky,
    and is done only when recovery is known to be impossible.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: A watcher at a deathbed raises a loud shrill cry that wakes the village; messengers
    inform friends and funeral preparations follow within hours.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The corpse in the observed burial was carried from the river suspended in
    a skin from a pole, placed on the ground, sat up with knees tucked and hands folded,
    given an impande on the head, measured, and assigned a grave place in the cattle
    kraal.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The deceased’s wife carried a spear with its point stuck into a mealie cob,
    a calabash churn, and a fly-whisk, approached the corpse, and cried that she came
    alone.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The corpse was anointed with butter, decorated with large white beads, given
    a cloth as chidizho, given a second impande, and shaved.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Mungalo said that if a man’s head were not shaved, his fellow ghosts would
    not receive him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The corpse was placed in a pre-natal position and wrapped in a skin; the wife
    and children were allowed to embrace it.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
