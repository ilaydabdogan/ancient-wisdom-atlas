canonical_text:
  quote: The saddest thing about the child life is the considerable mortality.
  summary: The passage describes Ba-Ila children, remarks on the emotional appeal
    of children at play, and gives an ethnographic account of infant mortality attributed
    to poor sanitary knowledge and child-care practices, including carrying a baby
    in a skin, nursing it after exposure to heat, leaving it naked in a cool wind,
    and neglecting mouth-cleaning.
  language: English
  quote_policy: quoted
