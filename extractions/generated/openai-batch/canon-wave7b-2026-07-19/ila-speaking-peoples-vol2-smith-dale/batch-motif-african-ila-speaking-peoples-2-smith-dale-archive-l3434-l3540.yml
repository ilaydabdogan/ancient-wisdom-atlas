canonical_text:
  quote: ''
  summary: The passage describes Ila concepts of musamo or misamo as medicines, charms,
    or objects whose potency is discovered as a manifestation of an all-pervading
    force. It gives a tale in which a rejected old man rewards a kind boy with a powerful
    musamo made from sputum and skin scrapings, granting chieftainship, wealth, long
    life, and hunting fortune. It distinguishes the medicines from ordinary animistic
    belief while emphasizing the power of names. It then describes the taboo and uses
    of the Kamwaya bush, the Mabanga tree, and certain animals and birds as manifestations
    or omens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Almost any object can be used as a musamo; a doctor is described as discovering
    potency in an object rather than imparting it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Medicines are said to act on bodily diseases, feelings, and disposition; they
    may act at a distance, separate a man's “life” from the rest of his constitution,
    change him into another form before or after death, affect ghosts, and affect
    rain-clouds, lightning, and rain.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the example tale, a very old man is driven away by his children, crawls
    into the forest, is mocked by boys, and is helped by one boy who brings him water
    and food.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old man coughs, spits sputum into a small pot, adds scrapings from his
    skin, mixes them, and tells the boy to drink; he then says the mixture is a powerful
    musamo that gives bwami, wealth, long life, good hunting fortune, and freedom
    from hindrance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boy who drank the musamo grows up fortunate, wealthy, and renowned, and
    dies at a ripe old age.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage says the medicines are not usually thought to possess a soul;
    users address the medicine itself, while the name of the medicine is described
    as important and as able in some instances to enter a person and cause sickness.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kamwaya, “the scatterer,” is a bush that may not be used as firewood or for
    building poles because it is said to disperse things, including friendship, houses,
    and villages.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A village fence partly made of Kamwaya is said to have caused people to leave
    one by one; after an elder learned the cause, the Kamwaya poles were removed,
    strangers came to build at the village, and the community was restored.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'Kamwaya can also be used beneficially: waving the bush scatters rain-clouds,
    and its roots can be made into a medicine for kafungo.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Mabanga is another tree not ordinarily used as firewood; it burns fiercely,
    is used for burning certain corpses, is said to destroy both body and spirit,
    and is also used in smelting iron.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Certain animals and birds are described as peculiar manifestations of the
    X and are called mupuka, muntu, mulozhi, or malweza.
  category: attribute
  evidence_refs:
  - ev:8
