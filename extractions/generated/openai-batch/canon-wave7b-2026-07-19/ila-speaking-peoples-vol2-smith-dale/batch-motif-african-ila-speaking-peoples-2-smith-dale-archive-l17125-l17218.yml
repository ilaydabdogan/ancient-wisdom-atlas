canonical_text:
  quote: ''
  summary: The passage contains the end of a famine tale in which a husband wrongly
    accuses his wife of eating mushrooms from a pot, kills her, later learns that
    mushrooms shrink in boiling, and is remembered as a warning against hasty accusations.
    It then gives the tale of Shezhimwe, a bogle who repeatedly eats his own children
    while they are left in his charge, denies knowledge of their disappearance, follows
    his wife to her kin, is killed and burned by them, and emerges from the fire as
    a continuing threat to naughty children. The passage ends with the heading of
    the next tale, without its narrative.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During a great famine, a woman found mushrooms and put them with water in
    a pot that appeared full before boiling.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The husband accused the woman of having eaten or stolen some mushrooms after
    the boiled contents appeared reduced; she answered that mushrooms shrink when
    cooked.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The husband beat the woman to death with a stick and told people she had died
    of starvation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Later the husband cooked mushrooms in the same pot and saw that they shrank
    until little remained.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The husband said he had killed his wife without reason, and the tale states
    that he became an example against hasty accusations of stealing.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The tale titled "The Bogle and his Child" is explicitly described as being
    told to frighten children.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: A bogle named Shezhimwe married a woman, and a child was born to them; before
    the child was weaned, the mother left it in Shezhimwe's charge while she went
    to work in the field.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: When alone with the first child, Shezhimwe ate it, left, later reappeared,
    and acted as if he did not know what child the mother meant.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After a second child was born, Shezhimwe again ate the child while the mother
    was away and then acted as if it had disappeared.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The mother challenged Shezhimwe about children being lost while in his hands;
    he had no excuse and remained silent, and she later told her parents.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The woman's parents comforted her, told her to return to her husband, and
    advised her to come home when another child was to be born; she later escaped
    home and Shezhimwe followed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The wife's people greeted Shezhimwe politely, cooked food for him, and after
    he ate they seized and killed him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After Shezhimwe was killed, he was burned in the fire; a great whirlwind came
    out of the fire, and the narrator says he is still alive and watching for naughty
    children.
  category: sequence
  evidence_refs:
  - ev:8
