canonical_text:
  quote: 'Riddles are more than mere amusement : they serve to quicken the wits.'
  summary: 'The passage describes Ila riddle practice: riddles are asked in the evening
    around fires using a fixed challenge-and-response formula; participants guess,
    surrender with a set phrase if unable, and receive the answer. The passage then
    gives examples of riddles that disguise household objects, body parts, animals,
    places, and natural phenomena through metaphor, archaic or meaningless words,
    and wordplay.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Riddles are said to be asked in the evening around fires, with the opening
    formula Kako and the reply Kakeza.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage gives the Ila term for riddle as kalabi, plural tulabi, and the
    verb for answering a riddle satisfactorily as kulabukulula.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a riddle is posed, others guess; after incorrect guesses the propounder
    repeats it, and when they give up they say twazhimina, after which the answer
    is given.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that many hundreds of riddles circulate, new ones are continually
