canonical_text:
  quote: ''
  summary: 'The passage gives several Ila song texts with English translations: a
    song identifying singers as children of Leza; a men''s funeral song with forest-and-wind
    imagery and spear-clashing; songs for and by the Baami connected with scarce rain
    and the east; a warrior''s spear song; a song about a man escaping a lion-like
    being made by a warlock; and a mourning song for a child involving hair-ornaments,
    a river, and crocodiles.'
  language: English with Ila song texts
  quote_policy: summarized
