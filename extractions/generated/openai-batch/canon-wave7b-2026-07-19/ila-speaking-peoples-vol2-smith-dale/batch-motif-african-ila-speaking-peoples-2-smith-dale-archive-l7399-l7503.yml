canonical_text:
  quote: ''
  summary: The passage describes restricted sacred groves associated with demigods,
    an abandoned grove whose spirits and demigod fade without devotees, the taboo
    Mala site Nakatunda with a solitary palm, and communal rites there for war, peace,
    and murder. Shimunenga's medium speaks for the demigod, cattle are killed and
    distributed as offerings or ratifications, and a custodian-priest receives and
    makes offerings and summons feasts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The interior of Shimunenga's grove is difficult to enter; there is no path,
    and only the priest enters, once a year, cutting his way in.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some groves in uninhabited regions are described as former revered centers
    of communities that have died out or dispersed.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Maundu grove has a single entry, a central vacant space, arching evergreen
    trees, hanging vines, leaf-strewn ground, and an old bleached bone from an offering,
    but no recent sacrifice.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nakatunda at Mala is a bare taboo place of about an acre with a solitary palm-tree;
    cultivation and building there are forbidden.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nakatunda is classified as chikomo and is used for communal gatherings before
    and after war and after murder.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: An embassy requesting war aid used the expression asking brothers to cut down
    a thorn-covered twig, after which Mala warriors gathered at Nakatunda and oxen
    were killed to seal the compact.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the close of war, opposing parties met at Nakatunda, killed oxen, and ate
    them as a declaration of peace.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After a murder, the people assembled at Nakatunda with a song asking who had
    done wrong and saying that no one could purge it with medicine.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Shimunenga's medium announced that the demigod was offended by the murder
    and that the criminal had to be discovered.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The murderer paid weregild in cattle; two oxen were killed at Nakatunda as
    an offering to Shimunenga, the flesh was eaten, the heads were deposited at the
    grove, and other cattle were assigned to the priest and chiefs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In these observances the community as a whole was regarded as assembling in
    the presence of the demigod.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: There was no organized priesthood for the demigods, but a central-grove custodian
    received and made offerings, summoned people to feasts, and received cattle as
    a perquisite.
  category: relationship
  evidence_refs:
  - ev:9
