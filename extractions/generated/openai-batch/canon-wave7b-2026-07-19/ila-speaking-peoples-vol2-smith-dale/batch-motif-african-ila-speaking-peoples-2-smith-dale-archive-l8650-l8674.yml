canonical_text:
  quote: By months we mean, of course, moons (miezhi).
  summary: 'The passage describes Ila lunar and seasonal time reckoning: months are
    counted as moons, moon phases and dark intervals have named terms, the year is
    reckoned from the appearance of the Pleiades, and three named seasons with transitions
    are listed.'
