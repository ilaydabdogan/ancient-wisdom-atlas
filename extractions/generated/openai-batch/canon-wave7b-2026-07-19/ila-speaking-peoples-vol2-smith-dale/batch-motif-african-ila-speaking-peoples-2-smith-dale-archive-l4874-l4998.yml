canonical_text:
  quote: ''
  summary: 'The passage describes Ila grave-temples and ancestral ghosts: small huts
    or temples associated with graves may be moved with a chief''s village so ancestral
    spirits remain near the living. Offerings and prayers are made to these spirits.
    Ghosts are said to be constantly present in villages and houses, mostly unseen
    by humans but visible to some specialists and to animals. A native account describes
    a dead husband opening the house door, ghosts dwelling near thresholds, and household
    ghosts tripping harmful visitors and protecting their people. Food, water, and
    tobacco are shared with ghosts. Deserted settlement sites, Matongo, are sacred
    and feared because ghosts of former inhabitants live there; such ghosts are portrayed
    as cold and hungry in trees and glad when living people settle nearby and give
    warmth, food, and drink. The passage ends by introducing Ila belief in metempsychosis
    and temporary metamorphosis into animal form.'
  language: English
  quote_policy: summarized
