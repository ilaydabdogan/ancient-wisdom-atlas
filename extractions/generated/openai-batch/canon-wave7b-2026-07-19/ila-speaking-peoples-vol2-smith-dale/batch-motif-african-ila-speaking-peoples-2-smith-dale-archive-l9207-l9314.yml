canonical_text:
  quote: ''
  summary: The passage catalogues Ba-ila notions about several snakes, including venomous
    snakes, omen-bearing snakes, and fabulous serpents or beasts. It then records
    reports of the bakamipilwi or Flying People, including uncertainty over whether
    they were men, birds, ghosts, or transformed trees. The final sections summarize
    Ba-ila colour terms and Ila counting practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chisambwe is described as a poisonous snake whose bite is said to cause
    defaecation followed by death.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ingongoki is described as a rare, nocturnal, distinctively marked snake;
    seeing it is treated by some as a good omen and by others as a bad omen.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The shimakoma is identified as a cobra that spits at a person's eyes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The shibudikila is described as a short dark snake believed by the Ba-ila
    to have two heads; seeing it is regarded as bad luck, and its name is used idiomatically
    for sudden arrival.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The chidingadinga is described as a small blunt-tailed snake; seeing it is
    said to bring ill-luck to one's friends and relations, and it is called the fellow
    of the shibudikila.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage distinguishes between snakes whose existence the Ba-ila believe
    and which the authors call fabulous because their descriptions were not verified
    by the authors.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ikonkola is described as a huge red-and-black snake two hundred yards
    long that leaps over trees and attacks a person's head from a tree; a pot of medicine
    carried on the head is said to make the snake strike the medicine and die.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The mulala is presented as another fabulous beast and is explicitly called
    a dragon by the authors; an unnamed groom claimed to have seen one recently.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Old Mungalo reported that beings called bakamipilwi came from the north-west
    and passed over Mala, appearing to be men flying over treetops, though he could
    not say whether they were men, enormous birds, or ghosts.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Chibaluma reported seeing bakamipilwi flying between his place and Nambala
    mountain toward the south-east; he said several companies passed over for several
    days, while some Bambala said trees were turned into people and passed east.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states that Ba-ila colour terms include red, white or light-coloured,
    and black or dark-coloured, while other colours may be named from objects such
    as butterflies, cattle urine, snakes, or water plants.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Ila counting system is described as decimal, with terms for one through
    ten, hundred, and thousand; the passage also notes practical counting of poles
    and recognition of missing cattle.
  category: other
  evidence_refs:
  - ev:10
