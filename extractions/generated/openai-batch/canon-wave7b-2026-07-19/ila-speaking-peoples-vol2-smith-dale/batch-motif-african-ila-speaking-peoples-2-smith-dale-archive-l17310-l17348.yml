canonical_text:
  quote: ''
  summary: A boy repeatedly tells his father to cook and eat a guinea-fowl alone and
    later insists on sleeping in the middle for fear of wild beasts. The father, being
    alone with the boy, puts a bundle of grass at one side of the bed to make a middle
    place. The boy discovers the bundle is not a person, takes his father's spear,
    sharpens it, and stabs his father. The father dies, and the child also dies from
    fright. A Latin closing couplet follows.
  language: English with a Latin closing quotation
