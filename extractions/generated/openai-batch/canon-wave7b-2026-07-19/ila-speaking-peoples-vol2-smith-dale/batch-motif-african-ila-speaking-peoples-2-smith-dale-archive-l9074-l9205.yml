canonical_text:
  quote: ''
  summary: The passage catalogues Ila names and beliefs concerning insects, molluscs,
    amphibians, and reptiles. It records practical and magical uses of animals and
    animal products, including mosquito protection, rain signs, teething and ear medicines,
    bee-product taboos, wax divination, frog medicines, a tadpole-to-fish belief,
    the mason-wasp as fire bringer, the chameleon as cause of death in the world,
    Fulwe the tortoise as a folktale figure, and beliefs about snakes and the puff-adder.
  language: English
  quote_policy: summarized
