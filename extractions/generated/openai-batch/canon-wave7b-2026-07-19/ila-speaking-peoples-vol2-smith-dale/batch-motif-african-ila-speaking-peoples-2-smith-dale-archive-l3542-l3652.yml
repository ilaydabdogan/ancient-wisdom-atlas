canonical_text:
  quote: ''
  summary: The passage describes Ila beliefs about animals, birds, rare sights, and
    new things as bearers of hidden force. Several animals are dangerous to children
    or adults, serve as omens of death, require rites after being killed, or can be
    converted into protective or beneficial medicine. The passage also explains that
    unusual or rare appearances and new foods may be regarded as tonda, taboo or charged
    with mysterious force.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Chinao cat is described as unlucky to children and as a being whose name,
    pelt, or proximity can affect a child with an illness resembling the animal.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pieces of Chinao pelt are sewn into children’s carrying-skins, or the mother
    wears a Chinao skin, so that children may be protected from the cat’s influence.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chikambwe, or blue jay, is said to fly screaming into the sky, fall lifeless,
    and affect a child so that the child may die suddenly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Feathers of the chikambwe are made into musamo to prevent untimely death.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some animals and birds are called persons and warlocks, are said to have shadow-souls,
    and are said not to reincarnate after death.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: After killing an eland, a hunter performs rites with leaves, ant-heap material,
    forehead-rubbing, throwing, jumping through a cleft stick, and sitting apart before
    joining the carcass-opening work.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the eland rites are omitted, the eland is said to trouble the hunter at
    night, horn him, or cause his death; medicine placed in the eland’s horn is said
    to become more potent.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: An owl crying on a roof at dusk is said to foretell a death in the home; a
    firebrand is thrown at it to drive it away and remove the spell.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The plantain-eater’s red feathers are thought to be dyed with human blood
    and are worn as trophies; killing the bird is treated reputationally like killing
    a man.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The nakansakwe is taboo when it jumps across a road; in the story, a man who
    proceeded after the bird jumped over the path disappeared.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A nakansakwe feather is described as powerful medicine for good fortune.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Strange, unusual, uncommon, and new things are described as manifestations
    of hidden powers; bananas are rejected by Mungalo as tonda because he had never
    seen them before.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: Chivubavuba is said to live in water and to be rarely seen, making it tonda;
    the mole is tonda when seen above ground in daytime, and its grin is said to cause
    a friend’s death.
  category: attribute
  evidence_refs:
  - ev:9
