canonical_text:
  quote: ''
  summary: Three Ila folk-tale passages featuring Hare are presented. In the first,
    Hare induces Hyena to seek a lion skin, escapes through a burrow, and Hyena dies
    trapped. In the second, Hare is ferried by Crocodile, then arranges for Crocodile
    to ambush Hyena in the river; a note links another version to a proverb about
    reciprocal help. In the third, Hare tricks Lions by pretending to pick fleas from
    their tails while burying them, frightens them with a drum, disguises himself
    by plucking his hair, and begins another trap with a game-pit before the passage
    breaks off.
  language: English
  quote_policy: summarized
