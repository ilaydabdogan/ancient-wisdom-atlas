canonical_text:
  quote: ''
  summary: 'The passage records Ila ideas about the world, celestial bodies, and weather
    phenomena: Leza as creator; heaven, earth, and horizon; a traditional race of
    dwarfs; the sun, moon, stars, Venus, Milky Way, Pleiades, falling stars, comet,
    rainbow, lightning, and related gestures or beliefs for averting ill-luck, marking
    time, explaining phenomena, or causing harm.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Creation of all things is ascribed to Leza.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The blue arch of heaven is called Izeulu; the earth is thought flat, with
    earth and sky meeting on a far horizon.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A traditional race of dwarfs, the Bashikampinukila, is said to live near the
    eastern horizon in holes in the earth, though nobody has seen them.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sun is called izuba and is partly personalized as Chisowa, whose rising
    signals men and women to begin daily work.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: At sunrise a man spits on the ground as an offering to avert ill-luck and
    gain good fortune for the day.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sun is thought to return from west to east at dawn by leaping from stump
    to stump on the earth; seeing this would mean malweza and death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Solar eclipses are feared and described as the sun rotting away, dying, and
    rising again.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Each month a new and different moon is thought to appear.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the new moon is first seen, a person waves charcoal round the head and
    throws it westward to remove ill-luck.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The early moon is considered to have ill-luck attached to it; after six days,
    at first quarter, the ill-luck is gone and people dance in joy.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: A tale says Sulwe the hare got into the moon and is still visible there.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: Venus is named as the moon's wife when near the evening moon and as the morning
    star when its rising marks dawn for travellers and hunters.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Pleiades are named Bulezhi and indicate the beginning of the new year
    and the time to begin cultivating.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: Stars are reported as sometimes being spoken of as the eyes of Leza.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:15
  text: A falling star is described as being cut off rather than falling; when seen
    it is cursed and spat toward its direction.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: Mungaila connected Halley's Comet with the death of King Edward when the death
    was later mentioned.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:17
  text: The rainbow is called Leza's bow and is thought to prevent rain from falling.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:18
  text: Below the point where the rainbow touches earth there is said to be a fierce
    goat-ram that burns like fire.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:19
  text: When the rainbow is brilliant, people silently point a pestle at it to drive
    it away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:20
  text: Lightning is described as the wide opening of Leza's mouth and as the quick,
    fierce glance of his eyes.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:21
  text: Ashes from a lightning-struck tree are mixed with ash from a tree named Mwande
    Leza and fat, then forced down an ox or cow's throat to make it waste away and
    die if acquired by an opponent in a lawsuit.
  category: action
  evidence_refs:
  - ev:8
