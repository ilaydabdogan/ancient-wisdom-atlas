  evidence_refs:
  - ev:1
  confidence: high
  cautions: No detailed creation narrative is given in this passage.
- id: motif:2
  label: Hidden dwarf people at the edge of the world
  taxonomy_refs: []
  basis: The Bashikampinukila are placed near the eastern horizon where earth and
    sky meet and are described as small unseen beings living in the earth.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage presents this as tradition only and says nobody has seen them.
- id: motif:3
  label: Sunrise offering to a personified sun for luck
  taxonomy_refs:
  - sacred_exchange
  basis: A man spits on the ground at sunrise as an offering to Chisowa to avert ill-luck
    and gain fortune for the day.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The taxonomy link is broad; the rite is described as an offering but not
    as a formal exchange system.
- id: motif:4
  label: Deadly sight of the hidden solar return
  taxonomy_refs: []
  basis: The sun is said to return unseen from west to east at dawn, and seeing it
    would be malweza and death.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not give a story about someone seeing it.
- id: motif:5
  label: Eclipsed sun as dying and rising again
  taxonomy_refs:
  - dying_and_returning
  basis: Eclipses are feared and the sun is described as rotting away, dying, and
    rising again.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is a description of eclipse language, not a full mythic episode.
- id: motif:6
  label: New moon ill-luck removed by charcoal and westward casting
  taxonomy_refs: []
  basis: At the first sight of the moon, charcoal is waved round the head and thrown
