  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not explain why charcoal or the west is used.
- id: motif:7
  label: Lunar danger giving way to first-quarter rejoicing
  taxonomy_refs: []
  basis: The early moon bears ill-luck; after six days at first quarter the ill-luck
    is gone and people dance.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: Only a brief ritual sequence is reported.
- id: motif:8
  label: Animal visible in the moon
  taxonomy_refs: []
  basis: A tale says Sulwe the hare entered the moon and is still visible there.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not recount the tale itself.
- id: motif:9
  label: Celestial spouse of the moon
  taxonomy_refs: []
  basis: Venus near the moon in the evening is called the moon's wife.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No marriage narrative is supplied.
- id: motif:10
  label: Pleiades as seasonal agricultural marker
  taxonomy_refs:
  - seasonal_cycle
  basis: The Pleiades indicate the beginning of the new year and the time to begin
