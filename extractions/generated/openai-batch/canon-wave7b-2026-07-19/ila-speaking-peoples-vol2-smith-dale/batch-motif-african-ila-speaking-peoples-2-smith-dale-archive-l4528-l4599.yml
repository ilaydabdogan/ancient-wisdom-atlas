  quote: ''
  summary: 'The passage reports funeral songs whose content surprises the observers:
    rather than lamenting death or praising the deceased, the songs mostly extol a
    living chief or use sexual and phallic language. Several songs are given in Ila
    with English translations. The passage then explains that women sing these songs
    at funerals, where ordinary restraints and taboos are suspended under a proverb
    granting mourners license to do as they please.'
