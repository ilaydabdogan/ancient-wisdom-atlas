  confidence: high
  cautions: The passage supports a recurring play pattern only; it does not identify
    initiation or ritual significance.
- id: motif:4
  label: escape from enclosure
  taxonomy_refs: []
  basis: In katundulwa the center boy tries to escape between legs, and in kanyanja
