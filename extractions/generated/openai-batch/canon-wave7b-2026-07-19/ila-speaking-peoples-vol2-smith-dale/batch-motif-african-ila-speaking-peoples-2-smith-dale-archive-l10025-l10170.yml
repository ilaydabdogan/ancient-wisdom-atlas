canonical_text:
  quote: ''
  summary: 'The passage describes several Ba-Ila boys'' games: a dramatic melon-patch
    theft game; energetic skill and noise games; ring games involving enclosure, escape,
    leaping, or silence; ball and hockey-like games; and an evening tickling game
    with songs about clouds and bugs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the melon-patch game, one boy stands with raised hands as a lubange bush,
    while other boys kneel around him as melons; one melon is positioned as caught
    in the bush.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The owner examines and taps the melons while asking whether they are all present;
    the melons answer in chorus or report an absent one.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The thief stealthily carries off loose melons, tries to remove the fixed melon,
    denies knowledge when questioned, later is found carrying off the last melon,
    and is chased by all the others.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says many other boys' games are entered into with great zest;
    some are treated as trials of skill and dexterity, while others emphasize noise
    and dust.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: In lutu, a seated boy whirls a string with a bunch of grass attached, while
    other boys jump over it and also pinch a crouching boy called kamwale, 'the maiden.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In katundulwa, boys form a close ring with arms around waists and press inward
    on a central boy who tries to escape between their legs; the game includes a call-and-response
    about escape.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In kanyanja, boys form a wrist-linked ring and dance round while a crouching
    boy inside hops about trying to escape; the song says Kanyanga cries in the enclosure.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In impila, boys play with a resin or rubber ball, throwing to friends while
    others try to intercept; clapping precedes throwing and catching.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: In kuuma bungo, two parties play a hockey-like game with sticks and a palm-nut
    used as a ball.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: In the muneke game, players dance in a hand-linked ring and sing about cooking
    muneke for a husband; a player must step over linked hands without releasing his
    hold, and failure leads to derision as the cooker of ill-cooked food.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: In nzenze, one player squats inside a ring; a linked player must leap around
    the inside boy without touching him while others try to pull him over the boy.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: In muvhumuko, boys stand in a ring with one inside and must remain silent;
    the first who speaks takes the inner place.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: In buwawa, boys sit in a line with legs stretched out while one boy moves
    along the line, touches their legs, tickles their knees, and sings; the others
    answer in chorus.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: In buwawa, commands for the cloud to descend and return correspond to the
    boys shooting out their legs and returning them; the game ends with a chorus about
    shaking out biting bugs.
  category: sequence
  evidence_refs:
  - ev:13
