canonical_text:
  quote: ''
  summary: The passage introduces Ba-ila beliefs about death and souls through funerary
    and mythic traditions. It reports that death was not thought to belong to the
    original order, gives two Ba-ila versions of a Chameleon-and-Hare messenger myth
    explaining mortality, then gives another Ba-ila myth in which first people descending
    from above fail to retrieve dead relatives, causing people thereafter to die and
    not return. A Bambala version attributes the beginning of death to a dispute in
    Leza's family and describes Leza sending diseases, medicines, and birth medicine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the Ba-ila do not treat every death as witchcraft-caused,
    but they speak of a beginning when death was absent.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage identifies the Ba-ila Chameleon-and-Hare story as belonging to
    the Two Messengers type and says this type is shared with many Bantu tribes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the first messenger version, Leza sends Chameleon with a message that people
    will die and pass away forever; Chameleon travels slowly and rests often.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the first messenger version, Leza sends Hare with a message that people
    will die and return; Hare announces this message to the people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Chameleon contradicts Hare's announcement, Hare reports the contradiction
    to Leza, and Leza accepts the message that people will pass away forever.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the second messenger version, Hare arrives first with a death message,
    while Chameleon arrives too late with a message that people will die and return.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In another Ba-ila myth, a man descends from above with his mother, wife, mother-in-law,
    cattle, goats, and dogs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The women quarrel over herding the cattle; the cattle are lost and later found
    changed into buffaloes, which the passage calls the first misfortune.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the wife's mother dies, the wife wants to bring her back, but the man
    says she will return on her own.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the man's dog and then his mother die, he wants to fetch them, but his
    wife refuses because he had not fetched her mother; the passage says this is why
    people die and do not come back.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the Bambala version, Leza's wife refuses to let Leza's mother return to
    life because she had eaten her beans, and Leza later refuses to let his wife's
    mother return.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Bambala version names this event lufu lukando, the great death, and attributes
    the beginning of death to the greed of Leza's wife.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Leza says he also shall die, that his heir will weep, and that he will descend
    and burn houses; the passage note connects this to rain and lightning.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Leza sends diseases and medicines, says the sick person will live or die according
    to his will, and gives birth medicine so that the race will not die out.
  category: action
  evidence_refs:
  - ev:8
