canonical_text:
  quote: ''
  summary: 'The passage describes Ba-ila views of Leza as more than a personified
    sky force: a personal god associated with sky phenomena, maker and guardian of
    humans, provider of grain, and sometimes punisher. It distinguishes Leza from
    the human-origin mizhimo spirits, describes mizhimo as intermediaries, and outlines
    drought rites involving divination, offerings, prayer, misamo powers, and ecstatic
    prophecy.'
  language: English
  quote_policy: summarized
