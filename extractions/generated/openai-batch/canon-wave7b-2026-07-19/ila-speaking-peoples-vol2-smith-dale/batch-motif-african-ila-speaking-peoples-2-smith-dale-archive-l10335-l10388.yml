canonical_text:
  quote: ''
  summary: The passage reports hidden tricks called mabibo, including fire-handling
    and instant healing feats, while noting that the authors did not witness them.
    It then describes a wood-and-cord puzzle used in a wager challenge, and gives
    an overview of Ba-ila stringed musical instruments, including the katumbu and
    the mantimbwa used by girls in initiation-hut seclusion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tricks are called mabibo, are said to have been hidden from the authors,
    and are described as possibly amusements or possibly having mystical significance.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Reported mabibo feats include handling and swallowing fire, gashing the tongue
    and healing it with medicine, chopping the leg with an axe and healing it without
    a scar, and sitting on a fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The authors state that they did not see the tricks and can only mention their
    reported existence.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some say the tricks are performed only by “drunken” men, and it is said of
    such conjurers that they cannot be bewitched and are impervious.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The described puzzle consists of small flat wooden pieces with pierced holes
    and a doubled spliced cord threaded through them.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The object of the puzzle is to unthread the sticks without breaking or unsplicing
    the string.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A man may challenge another who does not know the trick to untie the puzzle,
    offering a spear if he succeeds, while the other promises a spear if he fails.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The puzzle becomes more complicated when four, five, or more pieces of wood
    are used; the illustration mentioned shows seven.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Ba-ila are described as having no great range of musical instruments,
    and none not already described in books on other African tribes.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The katumbu is a musical bow with a calabash as a resonator.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: A second stringed instrument form is made from wood shaped into a shallow
    bow with notches at one end for tightening the cord.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The mantimbwa is used only by girls in the seclusion of initiation huts.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The mantimbwa consists of two rough bows cut from a Munto or Muntembwe bush,
    strung with twisted palm-leaf cord, and played with a pot or tin pan between the
    knees as resonator.
  category: object
  evidence_refs:
  - ev:8
