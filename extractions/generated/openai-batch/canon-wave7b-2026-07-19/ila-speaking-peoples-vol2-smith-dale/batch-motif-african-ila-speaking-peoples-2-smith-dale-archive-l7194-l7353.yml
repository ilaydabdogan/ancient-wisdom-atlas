canonical_text:
  quote: ''
  summary: The passage describes Ila communal divinities or mizhimo, offerings made
    to them, and a hierarchy of named demigods. It singles out Malumbe, Munyama, and
    Shimunenga as pre-eminent. Malumbe is given variant genealogies, is described
    as a wonder-working chief, contests territory with Munyama through the chisolo
    game, creates a salt spring in one tradition, and mysteriously disappears near
    a deep pool. Munyama is given a heavenly rainstorm origin in one tradition and
    a Lunda immigrant origin in another, becomes a powerful chief, and later his polity
    fragments. Shimunenga is described as the ba-Mala communal god and an immigrant
    from the north; Nachilomwe is a female divinity associated with him by variant
    kinship traditions.
  language: English
  quote_policy: summarized
