canonical_text:
  quote: "“the fire is new and the woman also becomes new”"
  summary: The passage describes final Ila marriage rites involving kin relations,
    household fire supports, and partial removal of taboo between son-in-law and mother-in-law.
    It then describes rites for widower and widow remarriage after death, including
    taboo, contagion called lusasa or chibinde, removal or transfer of that condition,
    cutting or discarding a belt, extinguishing and rekindling fire, and declaring
    the woman new.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A proverb states that marrying a woman also entails relation to her family,
    and the bride’s kin come after consummation to receive goods or recognition from
    the husband.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bride’s people mould mafua, described as conical lumps of baked clay used
    to support the fire, after which the bride is mistress of her own household.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A strict taboo exists between a man and his wife’s family, especially her
    mother; at a final feast she gives him a hoe, partly removing the taboo.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the marriage ceremony, the bridegroom is saluted as the father of a
    named child rather than by his own name; this part may wait until the first child
    is born.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the widower account, after five days the widower’s head is shaved, he is
    given a hoe to tread on, and an heiress or substitute woman is seized in the evening.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the widower rite, the house fire is put out, a sherd is heated red-hot,
    the woman is placed in the house, and the man cuts away the strings around her
    loins.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:7
  text: After a cough signal, people bring the red-hot sherd on grass, the grass catches
    fire, and a new fire is kindled in the hut.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:8
  text: The narrative states that the new fire makes the woman new.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:9
  text: The next morning the woman is anointed with fat and brought outside, and relatives
    instruct her and the man to look after one another’s kin as before.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The explanatory section says the widower is taboo until the vacant hut is
    again occupied and that something contagious from the deceased marital relationship
    attaches to him.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The contagious condition is called lusasa or chibinde, and some identify it
    as the deceased’s muzhimo attached to the widower and his clothes.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage says the condition can be removed by transferring it to someone
    else, including through intercourse with a friend of the deceased wife.
  category: action
  evidence_refs:
  - ev:5
  - ev:8
- id: obs:13
  text: The substitute woman may have been married before and is described as unclean
    because the contagion of her former marriage is still about her; removal of her
    garments and belt is said to throw away that contagion.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: A widow is also taboo and may not resume usual occupations or remarry until
    lusasa or chibinde is removed.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: For a widow, removal of the condition is described either as a boy cutting
    her belt or as intercourse with a relation of the deceased husband; if this does
    not occur, she seeks a man to remove the contagion.
  category: action
  evidence_refs:
  - ev:7
