canonical_text:
  quote: many people, especially chiefs, enter the water after death and become these
    monsters.
  summary: 'The passage discusses relations between living people and animals or monsters
    identified with named persons: a lion associated with Sezongo is treated as sacrosanct
    but may be killed if it becomes a man-eater; persons may be recognized in lion
    or wild-dog form and may avoid, play with, or provide meat for acquaintances;
    the Itoshi/mupuka/muzoka is described as a great water monster that seizes people
    and is associated with chiefs who enter rivers after death.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage asks about the relation between a lion who was once chief Sezongo
    and a boy in the kraal also called Sezongo, and states that the Ba-ila do not
    believe the lion is the boy's external or bush soul.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The community treats the lion identified with the former chief as more or
    less sacrosanct, avoids killing it, and may try to prevent a European from killing
    it, but will abandon this if it becomes a man-eater.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man named Nachibanga of the lion clan is said to have turned into a lion;
    members of the clan would not eat or attack that lion, and it would not attack
    them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A lion understood as a person in lion-form may chase an old friend only as
    a game, and turns away if addressed by the deceased person's name.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A wild-dog recognized as an old chum may be asked to get meat; it then drives
    game toward the village, kills it, and leaves it for the man to find.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: People who disturb a lion at its meal and receive the kill may recognize the
    lion as a friend and thank it for the meat.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says Ba-ila imagination peoples rivers, hills, pools, and forests
    with many monsters.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: The chief water monster is named Itoshi by Nanzela people and called mupuka
    or muzoka by the Ba-ila, glossed as reptile or great snake.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Itoshi is described as very large, with a crocodile body, human head, fish
    fins, and a length of more than fifty feet.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Itoshi is usually invisible except to those with proper medicine; appearing
    to others means death.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: Itoshi seizes people and takes them into a burrow under the river-bed; a medicine-protected
    person may sit on the bank and pray for the captive's release.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Many people, especially chiefs, are said to enter the water after death and
    become these monsters; the passage names chiefs living in the Kafue and identifies
    Namongwe and Shantalo as being in the river in the form of matoshi.
  category: sequence
  evidence_refs:
  - ev:10
