canonical_text:
  quote: VULTURE, Fish-eagle, and Crow were without fire, for there was no fire on
    earth.
  summary: 'The passage first comments on Ila animal tales, especially their imaginative
    freedom, humor, trickery, incongruity, wordplay, and emotional content. It then
    begins an etiological tale: birds lack fire on earth and seek fire from God. Mason-Wasp
    volunteers to go, accompanied by Vulture, Fish-eagle, and Crow. During the journey
    the companions fall as small bones, while Mason-Wasp continues alone on the clouds
    but never reaches the sky’s summit.'
  language: English
  quote_policy: quoted
