canonical_text:
  quote: It is at evening around the fires that the tales are told
  summary: The passage describes the performance of Ila tales by a skilled storyteller,
    the communal setting of evening fires, the audience’s participatory memory of
    repeated tales, and the classification of some tales as etiological explanations
    for animal traits, human violence, domestic fire, and other features. It also
    notes that these explanations are attributed to personal volition rather than
    natural causes, including examples in which animals pronounce destinies for other
    creatures.
  language: English
  quote_policy: quoted
