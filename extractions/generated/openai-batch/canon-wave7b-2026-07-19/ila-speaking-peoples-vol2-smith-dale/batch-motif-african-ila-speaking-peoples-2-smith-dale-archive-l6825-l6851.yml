canonical_text:
  quote: "“two figures about ten inches high, roughly carved in wood”"
  summary: The passage describes consecrated places for divinities, the Ba-ila proper
    as not making images of divinities, and a border exception attributed to Baluba
    influence. It recounts Chibaluma’s forbidden hut containing valuable property,
    hunting trophies, a bed, and two small carved wooden figures. The hut is sacred
    to Chinenga, Chibaluma’s ancestor and genius, and the images are associated with
    medicine, protection from witchcraft, renewed power, and a reported belief that
    Chibaluma’s life is hidden in them.
  language: English
  quote_policy: quoted
