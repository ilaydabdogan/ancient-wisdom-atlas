canonical_text:
  quote: ''
  summary: The passage contains several folktale episodes in which Hare deceives other
    animals. Jackal is tricked and killed after Hare buries his tail. Hare kills Lion
    by staging a stone-dropping game in a tree. Hare then eats Mrs. Lion's children,
    frames Elephants, uses Mrs. Lion as a supposed Dog to kill other animals, steals
    her meat, and finally breaks her teeth with a stone hidden in bread. Editorial
    notes compare the Lion stone episode with a Lala tale and the cub-eating episode
    with other Bantu and Suto examples.
  language: English
  quote_policy: summarized
