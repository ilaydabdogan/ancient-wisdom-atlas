canonical_text:
  quote: ''
  summary: The passage explains Ila locative prefixes and grammatical particles, then
    gives a sample dictionary entry for the root 'Amb-' meaning speak, say, talk,
    or utter. The examples include locative contrasts around a house, a comparison
    to rhinoceros and hippopotamus separating, idioms involving a dog and a jackal,
    and derivatives meaning to retract, turn aside, leave the road, go astray, converse,
    quarrel, or speak loudly.
  language: English
  quote_policy: summarized
