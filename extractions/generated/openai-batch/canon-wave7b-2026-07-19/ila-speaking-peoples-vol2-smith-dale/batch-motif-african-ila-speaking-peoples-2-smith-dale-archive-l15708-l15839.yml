canonical_text:
  quote: ''
  summary: The passage contains a note on Mulala, a fabulous man-eating, cattle-eating
    monster likened to a dragon, followed by several Ila Hare tales. Hare uses beeswax
    horns to enter a horn-only beer drink, tricks Ground Hornbill into losing bread
    and a spear at a stream crossing, frightens Hyena with a threatening self-description,
    and rescues his stolen mother from Lion by replacing her in a bundle with bees
    that kill Lion and his relations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mulala is described as a fabulous monster that can swallow many people and
    cattle, fly through the air to victims, inhabit avoided places, and have fire-darting
    eyes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a beer drink, only beings with horns are allowed to drink, so Hare moulds
    beeswax on his head to appear horned.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hare sits near the fire; Hornbill repeatedly says the beeswax is melting,
    and Hare tells the people that Hornbill is asking for beer sediment or lees.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the beeswax has melted, Hare runs out of the house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At a stream, Hare tells Hornbill that they must throw their bread into the
    water in order to cross safely.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hare throws a lump of ants' nest while Hornbill throws his bread into the
    river.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the crossing, Hornbill has no bread and gives Hare his spear to obtain
    Hare's bread; the narration says Hare had coveted the spear.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Hare frightens Hyena by claiming to be a blood-vomiting destroyer of Hyenas
    who will eat Hyena next; Hyena runs into a burrow.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Lion steals Hare's mother, ties her in a grass bundle, and calls Hare, Snake,
    and Frog to accompany him, with Hare carrying the bundle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: During village greetings, Lion says Hare is carrying a bundle he knows nothing
    about, while Snake and Frog make remarks about swallowing.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: On the road, Hare stays behind, opens the bundle, finds his mother inside,
    removes her, and ties bees in her place.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: At Lion's relations' house, the bundle is opened; bees fill the house, Snake
    enters a burrow, and Lion and his relations are killed by the bees.
  category: sequence
  evidence_refs:
  - ev:7
