canonical_text:
  quote: ''
  summary: The passage describes several Ba-Ila boys' games. The games use songs,
    lines, circles, bodily formations, and mock contests to represent animals, birds,
    a pot, plant stems, a tortoise, and blacksmith work. One game, 'blind cow,' is
    explicitly compared by the authors to blindman's buff.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In one game, boys jump in a halting fashion as if their legs were broken and
    sing about swift reedbuck and a broken leg after an attempted shot.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the secretary bird and ingoane game, two boys kneel facing one another
    with a pole over their shoulders, clap the ground, and move their heads under
    the pole until one knocks it off.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the carrion-bird game, two lines of boys represent bashikube and mwangvhwa,
    with a boy between them representing a carcase; the lines advance and retreat
    alternately.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: In an animal-play game, two lines of boys with arms around neighbors' necks
    sing about Mwanamukopwe, animals, buffaloes, and a river, then pass, wheel, return,
    dance up, and charge with yells.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the 'blind cow' game, the cow closes his eyes rather than being blindfolded,
    holds a reed, touches boys moving around him, and the first boy touched takes
    the cow's place.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the kabia game, boys stand in a close ring with linked fingers and thumbs;
    their raised hands make a circle that they raise and lower to show the form of
    a small pot.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the swallow-at-Mala game, boys stand in a circle with crossed arms grasping
    neighbors' knees, dance, clap, regrasp, and alter their grasp when singing the
    word for 'change.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the mambwanyanga game, boys stand in a long wrist-grasping line representing
    pumpkin and melon stems; the leader threads under pairs of arms and drags the
    others after him, then the motion reverses.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the hard-backed tortoise game, one boy kneels on all fours while two boys
    lie at right angles with legs over his back, grasp one another's feet, and are
    carried as he moves.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: In the hammer game, boys enact blacksmith work by requesting a hammer, naming
    smithery and forging a star, then fighting over the hammer while moving on hands
    and heels and kicking from that position.
  category: action
  evidence_refs:
  - ev:10
