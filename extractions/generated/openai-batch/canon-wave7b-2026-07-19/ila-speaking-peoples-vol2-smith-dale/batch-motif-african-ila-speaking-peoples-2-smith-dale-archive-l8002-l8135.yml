  quote: ''
  summary: The passage records an Ila account of Leza as ancient, associated with
    rain, owner of all things, unanswerable to human accusation, formerly responsive
    to entreaty, creator of people, and merciful despite human complaints about weather.
    It then explains several epithets and praise-names of Leza, including names translated
    as Creator, Moulder, and Constructor, with brief linguistic notes on their roots.
