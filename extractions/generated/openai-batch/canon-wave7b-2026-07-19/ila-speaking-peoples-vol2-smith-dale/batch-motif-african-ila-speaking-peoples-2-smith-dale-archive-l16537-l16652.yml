canonical_text:
  quote: ''
  summary: The passage gives the tale of a forest-dwelling man whose wife is repeatedly
    seized for a chief, but who rescues her and finally summons lions to destroy the
    chief's men. It then begins a second tale in which a pregnant woman bargains with
    lions during famine, promising her unborn child in exchange for meat; when the
    lions later call for Kantanga, the child distributes bracelets so that his companions
    all claim the same name.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man lives in the forest with his wife and son.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hunters sent by a master find the woman in the forest, receive milk from her,
    and report to their master that she is a fine woman whom the chief should marry.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men sent by the chief tell the woman to take a journey; she goes with a ceremonial
    axe and a pot of fat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The child calls to his father while the father is hunting in the forest.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The father follows the track of his wife, confronts the men taking her, kills
    one man, and cuts off the lips of another.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The chief sounds an alarm bell, gathers young men, and sends them to bring
    the woman.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The woman again gives milk to the chief's men before they tell her that the
    chief wants her as wife.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: At the chief's place, the husband refuses water from a slave; the wife is
    brought out and carries water to him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The husband and wife sit under a tree, speak together after dark, and escape
    at night after she says she will return home and cannot be a chief's wife.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: After returning home, the man summons lions and tells them that the chief's
    people must not come back.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The chief sends seventy people to fetch the woman again, and the man orders
    the lions to eat them all.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The lions attack the chief's people, kill them, spare one survivor, and the
    survivor warns the chief not to send people again.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: The chief abandons his plan out of fear, and the man and wife live happily.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: In a second tale, famine has entered the district where there is a lion or
    lions and a pregnant woman.
  category: setting
  evidence_refs:
  - ev:14
- id: obs:15
  text: The pregnant woman asks lions for meat and promises that, if they give her
    meat, they may later fetch and eat the child in her womb after the famine is over.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:16
  text: The lions give the woman meat, telling her to take it, eat, and live.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: Later the lions come and ask the woman for their meat; she identifies her
    child Kantanga and tells them to call him.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:18
  text: When the lions call Kantanga, he removes ivory bracelets from his arms and
    gives them to companions, who say that they are all Kantanga.
  category: sequence
  evidence_refs:
  - ev:18
