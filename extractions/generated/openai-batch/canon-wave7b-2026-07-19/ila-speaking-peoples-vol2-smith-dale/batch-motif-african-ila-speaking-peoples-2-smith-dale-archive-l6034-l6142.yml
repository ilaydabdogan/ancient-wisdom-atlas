canonical_text:
  quote: ''
  summary: The passage recounts Mupumani's visionary return with messages from Namulenga,
    including rejected threats of mass death and commands to reform mourning practices
    and denounce witchcraft. Mupumani attracts visitors and is associated with signs,
    portents, medicine, rumors of power, animal messengers, and a new salutation of
    humility. A related trance message attributes a death to Leza's punishment for
    scoffing at Leza's messenger. The passage then introduces the Ba-ila belief that
    most persons will return to earth, with stated exceptions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Namulenga begins to make a new body for Mupumani, but another figure stops
    this because the people would die of amazement if he returned with it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Namulenga proposes giving Mupumani a small calabash of blood to pour out so
    that all the people would die, but the second figure restrains him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Namulenga instructs Mupumani to tell people to stop killing cattle, violently
    throwing themselves down, and rushing about with spears during mourning.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The divine speaker says he takes men from earth and causes men to be reborn
    as he pleases, and therefore people should not mourn.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mupumani finds himself back in his house without knowing how he returned,
    and he begins telling people about his vision.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: People travel from many districts to see Mupumani, and villages whose people
    have already visited erect a long white pole as a sign.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mupumani initially accepts only a small ring of beads for the little finger,
    described as something given to every prophet.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: People demand medicine for crops and hunting luck; Mupumani gives them drugs
    and receives money in return.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mupumani later says the Ba-ila did not accept his messages and still kill
    cattle at funerals.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Mungaba scoffs at Mupumani and refuses to visit him; after Mungaba's return,
    one of his people dies suddenly.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A medium of Shimunenga enters trance and reports that Mungaba's child was
    slain by Leza because Mungaba scoffed at Leza's messenger.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Women collecting firewood from a blown-down tree find it standing upright,
    and the people interpret this as the work of occult powers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Mupumani is examined at the magistrate's camp; the narrator reports that he
    appeared sincere and innocent while extraordinary rumors circulated.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: A reported threat to stop rain is followed by drought in one district, and
