candidate_motifs:
- id: motif:1
  label: Foreign goods emerging from big water through monstrous or magical agency
  taxonomy_refs: []
  basis: The passage reports a belief that European merchandise is thrown up out of
    the big water by monsters or transformed men and then sold by traders.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is an ethnographic report of a belief, not a developed narrative
    episode.
- id: motif:2
  label: Magical transformation into undersea workers
  taxonomy_refs:
  - shapeshifter
  basis: Some are said to think the undersea beings are men transformed by white men's
    magic to work under the sea.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage states transformation but gives no detailed shapeshifting
    story or transformed individual's identity.
- id: motif:3
  label: Animal property transferred through medicine
  taxonomy_refs: []
  basis: The leech's sticking quality is used as medicine to keep women from running
    away and riches from vanishing.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not specify ritual procedure beyond making the leech
    into medicine.
- id: motif:4
  label: Small creature entering a human body and causing death
  taxonomy_refs: []
  basis: The feared shongolwe is explained by an account that it entered a woman's
    vulva long ago and she died.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The account is brief and framed as something 'they say'; no full tale
    is given.
- id: motif:5
  label: Apotropaic expulsion to prevent return
  taxonomy_refs: []
  basis: The shongolwe is lifted on a stick and thrown away with the stick so that
    it may not return; the related proverb expresses refusal to go back in a wrong
    direction.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not explicitly call the act ritual, so the label is functional
    and descriptive.
- id: motif:6
  label: Animal sign of hunting success
  taxonomy_refs: []
  basis: Spiders or their webs on a hunter's gun are treated as lucky signs that the
    hunter will successfully kill.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage gives the sign and expected result but no accompanying rite.
- id: motif:7
  label: Taboo on killing water-linked insect to protect vessels
  taxonomy_refs: []
  basis: Women drawing water avoid killing the mantis, called drawer of water, because
    their pots would break.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The causal connection is stated, but no larger myth explaining it is supplied.
- id: motif:8
  label: Unlucky body worm as omen of death
  taxonomy_refs: []
  basis: Ba-ila are said to believe that skin worms simply appear and that anyone
    who gets them is very unlucky and will die.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage is partly an authorial correction about fly larvae and partly
    a report of Ba-ila belief.
comparison_claims:
- id: claim:1
  claim: The passage itself cautiously attributes Ba-ila ideas about the sea to contact
    with early Mambari traders from the west coast.
  claim_level: historical_contact
  target: early Mambari traders from the west coast as a source for Ba-ila sea notions
  evidence_refs:
