canonical_text:
  quote: ''
  summary: The passage records Ba-ila notions about Bulawayo, the sea, European goods,
    animal classification, and miscellaneous beliefs about insects, reptiles, and
    related creatures, including beliefs about undersea monsters, leeches, millipedes,
    spiders, ticks, bugs, locusts, mantises, and skin worms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kumbulawayo or Bulawayo is described as the farthest-known place for most
    Ba-ila, who think all white people come from there.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Ba-ila ideas about the sea seem ultimately derived from early
    Mambari traders from the west coast.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ba-ila are reported to suppose that European merchandise is thrown out of
    the big water by monsters, or by men transformed by white men's magic to work
    under the sea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Traders are described as picking goods from the shore and selling them, while
    Ba-ila exchange cattle and grain for them and regard white people as selfish.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The passage lists Ba-ila animal categories: quadrupeds, creeping things or
    reptiles, insects, birds, and fish.'
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The leech is said to enter an elephant's trunk and brain and torment the animal
    until it kills itself while trying to be free of it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Because of its sticking quality, the leech is made into medicine to prevent
    women from rebelling or running away and to prevent riches from vanishing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The shongolwe millipede is familiar in the rainy season and is feared because
    of a report that one entered a woman's vulva long ago and she died.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: When a shongolwe is found, it is taken on a stick and thrown away with the
    stick so that it may not return.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: If someone brings a shongolwe to a house, the owner gives the person things,
    salutes humbly by clapping hands, and then throws the creature away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A proverb about having thrown a shongolwe there is used by a person repenting
    of a wrong action and saying they will not go that way again.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The scorpion and centipede are named and their sting is dreaded.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: 'Two named spiders are described: one makes a circular white silky nest on
    a hut wall, and another weaves from tree to tree and grass to grass.'
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: Spiders or their webs are lucky for hunters; if hunters find them on a gun,
    they expect success in killing.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Two ticks are named; one is called the biter of the lazy, and another is said
    to cause baldness if it keeps hold on the head.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: The inkofu bug infests houses, and its bite can cause sickness; a bite from
    a pregnant bug is said to cause swelling.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: Locusts have damaged crops and are also eaten roasted with salt in an earthenware
    pot on the fire.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: The mantis is named as a drawer of water, and women drawing water avoid killing
    it because their pots would break.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:19
  text: A fly is described as depositing an egg under skin, where it becomes a worm,
    but Ba-ila are said to think the worms simply appear and that a person who gets
    them is unlucky and will die.
  category: relationship
  evidence_refs:
  - ev:12
