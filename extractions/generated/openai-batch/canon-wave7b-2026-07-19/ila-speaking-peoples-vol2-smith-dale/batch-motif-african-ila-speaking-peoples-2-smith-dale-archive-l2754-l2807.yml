  quote: ''
  summary: The passage reports an Ila man's warning against marrying a slave woman,
    followed by an ethnographic discussion of Ba-ila polygyny, women’s jealousy, relevant
    Ila terms, and a native account of negotiation when a man seeks an additional
    wife.
  language: English
