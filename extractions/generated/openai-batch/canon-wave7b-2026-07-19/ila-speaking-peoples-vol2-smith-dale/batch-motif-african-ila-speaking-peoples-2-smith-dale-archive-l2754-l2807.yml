literal_observations:
- id: obs:1
  text: A man who had married a slave says it is best not to marry a slave because
    the owner retains rights over her, may have secret intercourse with her, and may
    take her away after a quarrel.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same speaker says a slave wife may work better in her master's fields
    than in her own, while a free woman's people may help her husband hoe his fields.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says that if a husband dies, the slave woman's master takes the
    woman and children, and they become slaves.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The authors describe Ba-ila polygyny as supported by male desire, periods
    of separation from wives, economic benefit, status, desire for children, lending
    a wife to a friend or visitor, and feeding visitors.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that Ba-ila women may be intensely jealous and may accept
    co-wives because more hands ease work and because marriage to a wealthy man gives
    reflected dignity.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage gives Ila terms for polygyny, a polygynist, marrying more than
    one wife, and being married to a polygynist.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the native account, a husband tells his wife he is going to marry another;
    if jealousy leads her to refuse, he may give her things and propitiate her until
    she agrees.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The native account says a man may seek a woman, an initiated girl, or a young
    girl as an additional wife; the girl's people may refuse because they do not want
    her to be a polygynist's wife, though they may later agree.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The account begins to describe the chief wife, called nabukando, going to
    seek a wife for her husband through his mother.
  category: action
  evidence_refs:
  - ev:8
