canonical_text:
  quote: ''
  summary: The passage discusses Ba-ila grammatical classes and the uncertainty of
    inferring ideas of personality from them. It distinguishes a personal mu-/ba-
    class, a thing chi-/shi- class, a mu-/mi- class including trees, medicines, and
    divinities as apparently intermediate, and animal names that often take the personal-class
    plural.
  language: English
  quote_policy: summarized
