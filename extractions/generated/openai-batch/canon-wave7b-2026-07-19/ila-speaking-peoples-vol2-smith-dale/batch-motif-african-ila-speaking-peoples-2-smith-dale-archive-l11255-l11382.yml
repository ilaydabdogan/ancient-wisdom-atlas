literal_observations:
- id: obs:1
  text: The passage compares the results of nasalisation in Ila and other Bantu languages,
    noting that Suto has different outcomes from Ila and Xosa in several sound correspondences.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage states two principles presented as widespread in Bantu languages:
    nasalisation does not shift consonants across articulation classes, and voiced
    fricatives become plosives after nasalisation.'
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'A third principle is attributed to Ila and some other languages: nasalised
    phonemes derived from voiced fricatives are distinguished from those derived from
    breathed plosives.'
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Ila, nasalisation accompanies morphological change when morphons such as
    in-, im-, n-, and m- are prefixed to roots.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage gives examples of noun, adjective, and pronoun-related forms produced
    by nasalising prefixes, including forms for house, pupil of the eye, brush, tongues,
    honouring the speaker, and building by the speaker.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: When certain morphons precede stems beginning with b or l that already contain
    a nasalised consonant, the b and l change into m and n respectively.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author explains this repeated-nasal avoidance as an instinctive economy
    of effort.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that nasalisation in Ila can express the grammatical copula,
    giving examples with meat and cattle nouns.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage describes frequent changes of mu into um and n(i) into in in Ila
    speech, with examples involving words for dog, seeing someone, and calling the
    speaker.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The author distinguishes the effects of improper nasalisation from true nasalisation
    and states that improper nasalisation does not enter Ila before consonants other
    than b because the prefix usually preserves mu-.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: After accounting for ten Ila phonemes, the passage turns to remaining fricatives
    and says they derive from primitive sounds under the influence of vowels and semi-vowels.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that primitive Bantu vowels i and u, especially when becoming
    y and w, cause many sound changes, while a is said not to play such a role.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Meinhof is cited as recognizing heavy vowels and as concluding that proto-Bantu
    had mixed sounds produced by palatalisation under the influence of the semi-vowel
    j/y.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage lists Ila correspondences for mixed proto-Bantu phonemes, including
    iz for ɣ'/7', ik for k', s for t', and dy for l', with examples from Ila and related
    languages.
  category: relationship
  evidence_refs:
  - ev:9
