  quote: ''
  summary: The passage describes two boys' games. In banakabwenga, stronger boys carry
    younger boys upside-down over their shoulders while singing, with an imagined
    reference to hyenas carrying their young. In shikoswe, boys crouch to resemble
    four-legged rats, dance, and perform a leader-and-chorus song about rats and field-rats
    before dancing back and repeating the pattern.
