  summary: The passage contains the end of a tale in which Hippo steals Rhino's tusks
    and Rhino declares differences in their colors, habits, and movement; a complete
    tale explaining cracks in Tortoise's shell through Tortoise's deceptive attempt
    to visit Vulture by being carried as a parcel; and the beginning of a tale in
    which Hornbill envies Tomtit's large beak and asks to try it on.
  language: English
