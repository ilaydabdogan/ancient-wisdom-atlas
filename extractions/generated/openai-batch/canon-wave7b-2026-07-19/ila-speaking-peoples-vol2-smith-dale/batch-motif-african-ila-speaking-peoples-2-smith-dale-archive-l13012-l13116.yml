canonical_text:
  quote: ''
  summary: 'The passage presents groups of Ba-ila proverbs: sayings encouraging self-interest
    and asking for gain; sayings encouraging patience, courage, and perseverance;
    sayings described as criticism of life, including observations about death, injustice,
    appearance versus reality, quarrelling in close relations, the inability to compel
    the heart, and personal preference. The line range ends with a caption identifying
    Lukendo, a Bambala chief, as an example of hairdressing.'
  language: English with Ila proverb forms and English translations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that one series of proverbs urges a man to look out for
    himself and get what he can.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several self-interest proverbs use images of a chief's work, eating with chiefs,
    a speaking god receiving meat, a young cow bearing calves, and a rat trying its
    teeth on iron.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A second group of sayings is described as inspiring patience and courage,
    with images of repeated work finishing a field, an elephant requiring more than
    one day to rot, water ahead, darkness without a hyena, and a man as an elephant.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The text introduces another class of proverbs as Ba-ila criticism of life.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some proverbs are said to recognize unpleasant facts, including the fading
    memory of the dead, blame shifted by a chief's wife onto slaves, and credit for
    a dog's barking going to the master of the village.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Proverbs on appearance and reality include seeing only roofs rather than interiors,
    cleansing that does not end slavery, empty laughter, and a person knowing his
    own woe.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: A proverb expresses that people living long together cannot avoid quarrelling
    by comparing rubbing buttocks with sweat.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'Several proverbs state that compulsion cannot control affection or inclination:
    the body may be held but not the heart, an insect cannot be forced into an unwanted
    burrow, food cannot hold a homesick person, and the heart leads.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage turns to proverbs about personal preference, introduced with the
    editorial phrase “de gustibus” and illustrated by a saying that an old thing pleases
    the one who married her.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The final caption identifies Lukendo as a Bambala chief and says the photograph
    shows a style of hairdressing.
  category: attribute
  evidence_refs:
  - ev:9
