canonical_text:
  quote: ''
  summary: The passage describes Ba-ila practices and beliefs around post-Chisungu
    marriage, menstruation taboos, treatment of a wasting person called an Imbala,
    the use of menstruating women to repel tsetse flies, and the opening actions of
    boys' initiation called Kushinga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the Chisungu, marriage is said to follow immediately among the Ba-ila,
    with the girl taken from her home to her future husband's patrilocal home.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bride must be carried to the husband's home; the bridegroom may not help
    carry her and may not see her on the road, which is described as taboo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Menstruation is called kusea, the menstruating woman is called Namusea, and
    euphemisms describe her as being in retreat and as having no hands.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The menstruating woman is described as dangerous and is to be separated as
    far as possible from contact with others.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: She may not enter a hut with people who have eaten medicine unless they leave
    first, and she may not eat in company.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Eating in company with a man is said to endanger his virility and life, and
    sleeping on her husband's bed is said to require damages.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: She must not use the common fire, shared pots, basins, cups, or pipes, and
    she may not cook food or draw water for another person.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: For five days she is tonda; she sleeps on the floor if in her hut, does not
    enter another village, does not wear fine clothes, then washes and rejoins others.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: An Imbala is described as a wasting man whose flesh is believed to be taken
    by a musangushi ghost; he is placed in a hut, and young girls kindle a new fire
    for him while menstruating women must not enter.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Menstruating women are believed able to drive away tsetse flies by sitting
    where the flies are and allowing themselves to be bitten.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: For boys' initiation, boys ask elders to take them to the cattle outpost to
    shinga; they sleep there, milk cows in the morning, and then run one by one through
    a gauntlet formed by herdsmen holding sticks, dry dung, and stones.
  category: sequence
  evidence_refs:
  - ev:8
