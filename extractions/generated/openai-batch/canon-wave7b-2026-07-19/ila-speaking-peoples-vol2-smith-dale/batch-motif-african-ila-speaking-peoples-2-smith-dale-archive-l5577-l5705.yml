canonical_text:
  quote: When a ghost enters his chest he will prophesy.
  summary: The passage describes reported cases of busala affliction or possession,
    including bodily contortions, drumming, rattles, attempts at cure or restraint,
    and a related prophetic form in which a ghost enters or seizes a person who then
    speaks messages from the unseen world.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A woman described as dancing busala was found face down on the ground, covered
    with dust, with rigid limbs, quivering eyelids, visible whites of the eyes, spasmodic
    foot movement, and head-wagging.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Drums were requested and beaten immediately outside the hut as a reported
    cure, with the expectation that the woman would dance to them, sleep, and recover.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the drumming began, the woman on the bed twitched, moved about, was helped
    to the floor, crawled toward the door with her forehead on the ground, and shook
    a rattle placed in her hands.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A second woman, said to be similarly affected at times, developed violent
    bodily contortions, held a rattle, dropped it, and also had a battle-axe whose
    sharp edge was removed by a man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A third woman made obeisance to the possessed because she felt the spirits
    calling her to dance, although she was unwilling to do so.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator stopped the drums, had the women taken to their beds, and after
    their heads were bathed with cold water they became quiet and apparently slept.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The second woman was later reported well again, though with neck pain where
    the spirits were said to have congregated; the first woman had another attack
    and was again grovelling in the dust.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The drum was said to be played in a peculiar way called kunzuma, producing
    a vibration felt by listeners, unlike ordinary drum-playing at dances.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: It was said that any busala dancer within earshot of such drumming, even miles
    away, must hurry to the place and begin the described contortions.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: If the drums were beaten long enough, the sick woman was expected to rise,
    speak the name of the spirit troubling her, and recover; alternatively, the condition
    might continue for days with intermittent drumming.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The afflicted were said not to eat and to drink only water with meal stirred
    into it; children and small babies were also said to be affected and to wag their
    heads.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: The described possession may pass into a prophetic form in which persons deliver
    messages from the unseen world and are called bashinshimi, baami, or basala.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Ba-ila described a ghost's entering or using such a person as kukwata,
    meaning holding or seizing.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: An informant's note says that when a ghost enters a prophet's chest, the prophet
    prophesies, and people ask the being to identify itself and tell its news.
  category: speech
  evidence_refs:
  - ev:11
