canonical_text:
  quote: ''
  summary: The passage describes the high value placed on having many children, especially
    sons; the shame attached to childlessness or barrenness; post-mortem treatment
    of a man without children involving removal of small digits and charcoal placed
    in the fist; fertility remedies, divorce or additional marriage when children
    do not come; insults directed at a barren woman; and a prayer to Leza asking for
    a child.
  language: English
