canonical_text:
  quote: ''
  summary: The passage describes Ila practices and reported attitudes concerning infertility,
    male impotence, the custom of lending a wife to another man for procreation under
    oath before elders, and adultery as a compensable breach of proprietary rights.
    It also summarizes penalties and damage claims involving cattle, aggravated cases
    involving pregnancy, nursing, or death, delayed disclosure, childhood betrothal
    claims, and claims based on touching or garment interference.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Infertility in marriage is described as disappointing to both spouses, and
    the introductory account says kusena may be practiced when the husband is impotent.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the described kusena procedure, the husband first proves that the cause
    of infertility is in himself and then hands his wife to a friend under an oath
    not to accuse the friend of adultery.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A woman who does not bear children is described in the quoted account as liable
    to divorce; a husband may test his own fertility by having intercourse with another
    woman to see whether she conceives.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the other woman conceives, the husband may attribute sterility to the first
    wife, divorce her, or, if he loves her too much to divorce her, build a house
    for a second wife who will bear children.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A newly married couple is put into a hut to sleep together; if the man cannot
    function, the wife goes early to her mother-in-law's hut and sits there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The man's people cook bread for the naming, call the man, and observe the
    wife's refusal of a morsel from him as evidence that he is impotent.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After a second night with the same failure, the wife says the man cannot beget
    children and returns to her own home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The husband's people tell him that he must give his wife to another man.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The husband brings a beloved friend before the elders and states that he lends
    or gives his wife to that friend.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The husband swears that if the friend and wife have intercourse he will not
    bring a fault against the friend, invoking death before sunset if he does.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the oath all salute, and the woman is later described as justified by
    bearing a child.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Adultery is described as illicit intercourse outside recognized sexual relations,
    treated as a breach of proprietary rights rather than as an act carrying moral
    disapproval.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Adultery penalties include former occasional cutting off of hands, ordinary
    payment of a cow, and enslavement unless the offender ransoms himself by a fine.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage contrasts reported Batema instances of a husband spearing an adulterer
    caught in the act with the statement that Ba-ila husbands are usually content
    with a cow.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: If adultery involves a chief's wife, damages may be increased to three cows;
    if it involves a pregnant or nursing woman, the offense is treated as serious
    because of harm to the child.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: If the woman dies in such a case, the matter becomes blood money and may require
    very large cattle compensation.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: Adultery claims are often brought after a long delay, when a woman later tells
    her husband; the husband is said to claim damages from the adulterer rather than
    resent the woman.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: Claims may be made over childhood sexual play if the girl was betrothed at
    the time, and actual intercourse need not be proved; garment interference or accidental
    touch may ground a claim.
  category: sequence
  evidence_refs:
  - ev:10
