canonical_text:
  quote: ''
  summary: The passage finishes a tale in which Kantanga is repeatedly trapped by
    his mother and Lions but evades capture through clever substitutions, causing
    the Lions to eat their own child and then leaving for another country. It then
    gives the tale of a woman who catches a barbel, places it in a water-jar, finds
    it transformed into a man, marries him, violates his food condition by stealing
    his fruit, and loses him when he returns to the water. The passage ends with the
    opening of a tale about a little old woman and children sent with cattle to the
    plain.
  language: English
  quote_policy: summarized
