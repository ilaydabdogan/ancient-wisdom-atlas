canonical_text:
  quote: ''
  summary: 'The passage describes Ila childbirth practice: a woman near labor goes
    home and gives birth in a separated shelter or enclosed verandah, assisted by
    women or midwives. It records medicinal plant preparations, required labor postures,
    bodily support and pressure by attendants, rough corrective speech during labor,
    cord tying and cutting with a short song, and procedures for delayed afterbirth.'
  language: English, with embedded Latin and Ila phrase
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman nearing birth goes to her home, and the birth may occur in a shelter
    away from the house or on a verandah enclosed with mats.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other women assist at the birth; women reputed to be skilled in midwifery
    or to have medicine may be called when needed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that women commonly resume ordinary life quickly after
    birth, and gives the example of carrying a half-hour-old child back from a forest
    shelter.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Deaths and severe complications are reported, including transverse presentation
    and a named condition called Kavhwi kakosoka.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: Men are not allowed to be present at births; the authors rely on notes from
    women who attended and watched cases.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the first pains, the woman is given an infusion made from the roots of
    the castor-oil plant, to drink repeatedly until the child is born.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: During early pains the woman may lie down briefly if tired, but during the
    final pains she must sit and is not allowed to lie down because doing so is said
    to endanger the child.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'Usually two women attend her: one supports the back while another holds the
    knees; during stronger pains they press the buttocks and knees.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A long strong cloth is put around the laboring woman's loins, and an attendant
    pulls the ends with strength during pains.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: If the woman becomes impatient, wants to stand or lie down, groans, or complains,
    she is addressed roughly, threatened with beating, and accused of wanting to kill
    her child.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: When the child is born, the cord, called ludila, is tied once and cut while
    the women sing a short song with the words translated as “Do not travel elsewhere!
    Meat!”
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: If the afterbirth does not come away, the patient is given medicine made from
    roasted mukonono root in water; if that fails, leaves are inserted and the placenta
    is manually removed.
  category: action
  evidence_refs:
  - ev:7
