canonical_text:
  quote: ''
  summary: The passage is an introductory discussion of Ila animal tales. It interprets
    animal figures as portrayals of Ila social values, especially admiration for cunning
    over physical strength; compares Ila animal tales with other African and Uncle
    Remus traditions; proposes an inherited Bantu antiquity for some incidents; and
    explains the didactic Kashimi tale category.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that animals in the tales portray the Ba-ila themselves,
    including valued virtues, condemned vices, and ridiculed follies.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage presents Sulwe as a hero through whom admired characteristics
    can be seen, especially mind or brain over physical strength.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Elephant and Lion are described as types of physical strength, while the
    Hare is described as a type of mind; Sulwe usually wins and is beaten only by
    superior cunning.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the Sulwe or Fulwe type appeals to the Ba-ila, and
    glosses wisdom as getting the better of neighbours without being found out.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that similar animal tales are told throughout Africa and
    claims Uncle Remus stories are African in origin.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage identifies Brer Rabbit and Brer Tarrypin with Sulwe, Fulwe, and
    related figures, and gives the Hippo-Rhino tug-of-war as an example of a tale
    corresponding to an Uncle Remus story.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage proposes that persistent incidents among widely separated African
    tribes are not explained by borrowing but by possession of the tales before Bantu
    migration, while allowing that many tales may be modern.
  category: other
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: The passage says Kashimi tales have a definite aim and end by making a person
    a byword or example not to be followed.
  category: sequence
  evidence_refs:
  - ev:8
