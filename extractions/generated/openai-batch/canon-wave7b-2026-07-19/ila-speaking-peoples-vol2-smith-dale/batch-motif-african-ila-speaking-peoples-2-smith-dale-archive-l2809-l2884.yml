canonical_text:
  quote: ''
  summary: 'The passage describes rules and examples concerning Ila polygyny: a husband
    is expected to keep houses, goods, food, water, sleeping time, and other provisions
    balanced among wives; a chief wife has higher rank; failure to maintain fairness
    may lead to quarrels, a wife returning to her natal home, disputes over chiko,
    or collective action by wives against the husband.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prospective wife says that whether wives fight may depend on their natures;
    the marriage proceeds after agreement.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: When marrying two wives, the man builds two houses side by side or places
    one in another enclosure because of concern that the wives may fight.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The husband is expected to provide firewood, goatskins, and water to both
    wives, with water carried in two calabashes and each filled to the brim.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Food and sleeping nights must be balanced between the two households; if the
    husband eats bread or sleeps four nights at one house, he must do the corresponding
    act at the other.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Spears, axes, blankets, stools, pipe, rug, and tobacco are treated as house-specific
    goods; the husband should find such items at each house rather than carry them
    from one wife’s house to another.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A man who maintains such balance is described as able to manage polygyny;
    a man who does not may have one wife run away to her home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wife’s people may refuse to let her return, may speak of her as a daughter
    not to be treated as a servant, and issues of returning or refusing chiko arise.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that a polygynist must exercise tact and that there is
    a recognized family scale of dignity, with the chief wife’s household potentially
    receiving more cows to milk than later wives’ households.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wives may fight among themselves but may unite against their husband; an observed
    case is reported in which four wives beat their husband for attention to other
    women and lack of children.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A polygynist with eleven wives is said to have sought a strong aphrodisiac
    from a missionary so that he could visit all his wives each night.
  category: action
  evidence_refs:
  - ev:7
