  quote: ''
  summary: The passage describes Ba-ila beliefs about witchcraft, suggestion, distant
    occult influence, and musamo. It gives examples of a man becoming ill after finding
    a suspicious object in his hut and a boy becoming lame after an old man declares
    him lame. The authors compare these beliefs with modern psychological ideas of
    suggestion and telepathy.
