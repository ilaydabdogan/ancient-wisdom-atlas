canonical_text:
  quote: ''
  summary: The passage describes Ba-ila prophets as mediums through whom ghosts or
    divinities announce dangers, identify alleged warlocks, foretell famine, rain,
    drought, abundance, and demand offerings. It distinguishes possession from ecstatic
    excursion and gives examples involving the prophet Longo and the deceased chief
    Sachele speaking through a woman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prophet may announce that a warlock is in the village and warn the community
    to seize him or risk disease and death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A prophet may foretell famine, abundant grain, drought, rivers lacking water,
    or rivers being full.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: After a person's death, if he is said to have been bewitched, he may enter
    another person and ask why he died or was killed without fault.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The community recognizes such speech as ghost possession and says the possessed
    person prophesies about the dead person's death.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Relations may ask the prophet to identify the warlock; the prophet names someone,
    and the men either kill the accused or drive him out of the community.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ghosts are said to enter the chests of people and speak messages about a lion
    attack, a pregnancy through which a ghost will be born, or a hostile plot by another
    community.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A ghost may threaten to kill a person if that person does not brew beer and
    make an offering.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: A ghost may complain that someone who has taken or bears his name does not
    care for his children, and may threaten the children or demand that the person
    leave the community and brew beer.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The authors describe prophets as mouthpieces of divinities with strong social
    authority, including the power to condemn accused witches or influence destruction
    of grain or cattle.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'One described method of receiving messages is possession: a disembodied spirit
    enters a medium and uses the medium''s brain and organs of speech.'
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: 'Another described method is ecstasy: the prophet''s spirit travels into other
    realms and returns to report what it has seen and heard.'
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Longo, a famous prophet, was captured by Sekeletu; at the Kafue she shouted
    Chinga's name from the river and later said he had answered and would arrive the
    next morning.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: When Longo was made to stamp grain in a mortar, a stream of water gushed out,
    after which the chief became afraid and sent her home.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The deceased chief Sachele was said to speak through a woman about six months
    after his death.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: Sachele said he had not been allowed to go to his mother Longo in the spirit
    world because she was angry that he had been buried with dogs instead of slaves.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:16
  text: Sachele's medium announced that those who paid respects would receive rain,
    while those who refused would experience famine.
  category: speech
  evidence_refs:
  - ev:13
