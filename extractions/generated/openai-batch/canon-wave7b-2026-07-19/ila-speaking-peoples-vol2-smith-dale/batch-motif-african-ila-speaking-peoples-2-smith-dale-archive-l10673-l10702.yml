  quote: ''
  summary: The passage describes Ila villagers quickly learning unfamiliar songs and
    dances introduced by visiting carriers. It distinguishes ordinary dances and songs
    from obscene songs and dances associated especially with girls' initiation and
    other ritual occasions. It lists occasions when lewd songs are permitted or required
    and notes prohibitions on certain kin as dance partners.
  language: English
