  summary: The passage describes hereditary ritual office, mediumistic possession,
    offerings to the demigod Shimunenga after a lion killing and at sowing time, and
    the annual ikubi festival at Mala involving beer brewing, cattle movements, adornment,
    invocations, exchange between men and women, and prayers for cattle fertility.
  language: English
  quote_policy: quoted
