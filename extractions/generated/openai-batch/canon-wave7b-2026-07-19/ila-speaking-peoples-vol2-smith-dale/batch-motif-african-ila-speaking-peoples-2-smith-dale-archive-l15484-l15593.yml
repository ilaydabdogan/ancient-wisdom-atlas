canonical_text:
  quote: '"Hare, give me my axe!"'
  summary: Two Ila animal tales about Sulwe the Hare are presented. In the first,
    Hare borrows Tortoise's axe and refuses to return it; Tortoise has himself cooked
    and eaten by Hare, speaks from inside Hare, and pronounces Hare's destiny as a
    wise deceiver who is not skinned after death. In the second, Hare tricks Hippopotamus
    and Rhinoceros into pulling against each other with a rope; after discovering
    the trick, they are reconciled, explaining Rhinoceros drinking at the river and
    Hippopotamus grazing on land.
  language: English
  quote_policy: quoted
