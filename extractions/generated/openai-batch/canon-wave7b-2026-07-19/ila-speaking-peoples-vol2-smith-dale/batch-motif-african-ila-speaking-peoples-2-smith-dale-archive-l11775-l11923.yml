  quote: ''
  summary: The passage is a philological discussion of Ila expressive particles, onomatopoeic
    words, and possible root syllables in Bantu vocabulary formation. It distinguishes
    repeated emphatic forms from onomatopes, analyzes the composite word Chimbundungu,
    summarizes Mr. Madan's theory of monosyllabic roots, and compares ya/za words
    in Nyanja, Bemba, Kongo, and Ila, especially meanings related to spreading and
    bursting.
  language: English
  quote_policy: summarized
