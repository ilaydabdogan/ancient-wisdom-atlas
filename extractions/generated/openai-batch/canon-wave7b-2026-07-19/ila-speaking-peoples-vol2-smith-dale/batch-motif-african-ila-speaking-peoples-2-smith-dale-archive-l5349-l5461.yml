canonical_text:
  quote: ''
  summary: The passage describes several kinds of ghosts among the Ba-ila, especially
    the tuyobela, which are dwarfish twittering ghosts of people pressed by witches.
    It gives a story in which a witch invites a ghost from a tree onto her back and
    cannot remove it until she dies. It then describes dreams as real ghost visitations,
    including dreams that give medicine, legal advice, hunting directions, and a missionary-related
    conversion vision involving a mountain, river, water flowing from a raised hand,
    prayer, and a call to become fishers of men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tuyobela are described as ghosts of men and women who have been pressed
    by witches and are now in witches' service.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tuyobela chirp and twitter like birds and are described as dwarfish.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A reported witness described the tuyobela as very short, with adult male bodies
    turned the other way, faces and bellies at the back, and hair standing upright.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The tuyobela are said to live in and around their master's hut, require the
    master's wife to cook food for them, and beat her if she does not.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The tuyobela are said to be sent out to steal, cause sickness, kill, bite
    people, and enter people to cut up the intestines.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Other named ghosts in the passage include tunchinya, mutalu, malendela, and
    bashituta.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the ghost story, a witch who had pressed many ghosts finds a ghost in a
    namuzungula tree eating flowers.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The witch calls the ghost to come down and lets it get onto her back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the witch reaches home, the ghost refuses to get down from her back
    despite being offered porridge, honey, miseza, other delicacies, and anything
    it likes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The witch cannot eat, lie down, or sit while the ghost remains on her back;
    after nine days she dies, and the ghost leaves.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that Ba-ila regard dreams of known persons or ghosts as
    actual visits by those persons or ghosts.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: Ghost appearances in sleep are said to be either beneficent or maleficent.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: A young man reports a dream in which he stands on a high mountain and sees
    villages and people below, then comes down to a crowd at a river.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: In the same dream, a missionary raises a hand with something in it and water
    immediately flows from it; the people fall to the ground amazed.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: In the same dream, the dreamer stands praying, then is in the river fishing
    and hears a voice calling him to follow and become a fisher of men.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: Ghosts in dreams are said to tell people where to find leaves for medicine
