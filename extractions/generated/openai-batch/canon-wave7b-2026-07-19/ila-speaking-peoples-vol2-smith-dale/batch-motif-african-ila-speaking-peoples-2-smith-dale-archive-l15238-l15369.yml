canonical_text:
  quote: ''
  summary: The passage closes an etiological note on Cheetah and Leopard, then gives
    a tale in which Tortoise and Fish-eagle form a friendship covenant, attempt to
    exchange forms of cunning, deceive one another over an axe, and thereby explain
    Tortoise's hissing and non-meat diet and Fish-eagle's meat-eating. It then begins
    a tale in which Rhinoceros and Hippopotamus quarrel over a razor, separate into
    different habitats, and are involved in a deceptive exchange of tusks and horns.
  language: English
  quote_policy: summarized
