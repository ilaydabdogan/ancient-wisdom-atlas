canonical_text:
  quote: ''
  summary: The passage discusses Ba-ila incest restrictions, situational sexual prohibitions,
    and ideals of sexual attraction. It argues that clan and family taboos, not childhood
    proximity, govern incest avoidance. It lists occasions requiring abstinence, including
    menstruation, pregnancy, nursing, sickness, beer making, sowing, grain processing,
    journeys, fishing, hunting, iron smelting, and war. It then describes traits considered
    attractive in women and men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says marriage may occur between village companions if family and
    clan taboos are respected, while marriage with someone of the same clan is refused
    even if she lives far away.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists particular occasions when sexual intercourse is prohibited
    to men and women.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
- id: obs:3
  text: Menstruous women, women near full-term pregnancy, nursing women, and recently
    weaning women are described as requiring sexual avoidance.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: If a man sleeps with a woman while milk remains in her breasts, the passage
    says he is liable to the sickness called mabishi, glossed as “sour milk.”
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: If either partner is sick or has open sores, intercourse is avoided; the passage
    gives the rationale that sickness might be worsened by “jumping over it.”
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A woman making beer must abstain or the beer is said to refuse fermentation;
    a woman before sowing abstains lest seed fail to sprout; people threshing or storing
    grain also abstain beforehand.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A man starting on a journey abstains from women the night before to avoid
    bad luck, frustration of the journey’s purpose, and bad bargains if he travels
    to trade.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Men going to fish, set traps, dig game-pits, or hunt are described as subject
    to sexual rules, though the passage notes that some hunters regard intercourse
    as giving good luck.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Men smelting iron must abstain from commerce with women, and men going to
    war must avoid women after war preparations and army doctoring begin.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage lists physical appearance, agricultural work, cooking, serving
