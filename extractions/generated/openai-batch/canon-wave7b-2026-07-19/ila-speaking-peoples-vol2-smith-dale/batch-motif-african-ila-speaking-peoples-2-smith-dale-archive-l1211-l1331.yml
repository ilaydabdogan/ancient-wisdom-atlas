canonical_text:
  quote: ''
  summary: 'The passage describes Ba-Ila boys undergoing puberty/initiation proceedings:
    a bull-touching ordeal under beating, evening discipline and commands, food and
    warmth restrictions, bathing, return for clothing, medicinal and bodily operations
    connected with sexual maturity and marriage, and elder instruction. An opening
    caption identifies boys in front of an ant-hill.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An opening caption identifies a group of Ba-Ila boys in front of an ant-hill.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Boys are beaten and pelted while trying to reach the herd bull; touching the
    bull frees a boy from that part of the ordeal, after which the boys take cattle
    to pasture and remain under clothing and bedding restrictions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'After an evening meal of very sour milk, men conduct kukoma discipline: boys
    must immediately obey commands to fight, dance, imitate dances, and perform actions
    such as grinding corn, or they are beaten and abused.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The boys must not show resentment toward the abuse or treatment.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: At dawn the boys are sent to bathe in cold water, are prevented from warming
    themselves at a fire, and receive no bread, only sour milk.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After two days of this treatment, on the third day the boys herd cattle, bring
    them near the kraal, run home naked, sit outside, call for clothing, and then
    enter when clothing is brought.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says boys, like girls, perform private operations to fit them
    for marriage, involving medicines for difuka, drinking, first semen, strength,
    enlargement, and blowing into themselves.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: One medicine procedure uses a bush substance applied to the scrotum; the medicine
    is then buried at a meeting of roads under a piece of pot, and people jump over
    it while speaking a formula.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A strengthening medicine is drunk, and a first-semen medicine made from the
    mubanga tree root is cooked repeatedly, combined with first-grinding white meal
    and an axe, eaten in part, stored in a calabash, and drunk at dawn while standing
    on a bed before flies arrive.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: An enlarging and cleansing medicine uses Mufufuma roots, burial at the threshold,
    ash, application to the genitals, and powdered root blown through a reed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: For the first pubic hairs, small dry sticks of the Mupazopazo tree are used
    with a small platform, fire made by friction, ash applied to the pubic area, hair
    plucking, a river bath, and avoidance of the place where the hair was plucked.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The account states that leaving even a little hair could cause the boy to
    become lame, have swollen knees, and be without strength.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: The fraenum is removed by tightly tying wildebeest hair for a day and night
    until it cuts through.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The authors state that the initiation proceedings serve to harden boys to
    endure pain without complaint, prepare them for manly functions, and include elder
    instruction with moral teaching mixed with other material.
  category: other
  evidence_refs:
  - ev:11
