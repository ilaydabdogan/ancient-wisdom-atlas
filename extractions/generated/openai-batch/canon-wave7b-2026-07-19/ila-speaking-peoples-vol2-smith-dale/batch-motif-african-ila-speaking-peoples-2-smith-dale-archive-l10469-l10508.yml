  quote: ''
  summary: The passage describes the namalwa or push-drum, including its construction,
    method of playing, sound, and uses for announcing war, accident, or disaster and
    for leading cattle across a river. It also describes the mwandu, made from a grain
    mortar, leather, reed, and water, and notes its use in girls' initiation ceremonies.
    It begins a description of the kayanda as an ordinary drum or tom-tom.
