canonical_text:
  quote: ''
  summary: 'The passage records several prophetic episodes: a Kakoma-area man predicts
    rain and abundant fish; a man calling himself Chilenga claims creator-like power,
    burns crop grubs, predicts cosmic and political upheaval, and demands cattle destruction;
    a Nanzela prophet professing Mwana Leza demands goods for prayers to end floods;
    and three baami recount Mwana Leza as a peace-preaching figure killed at Chongo
    whose spirit enters prophetesses.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man prophesying near Kakoma's village announced that there would be much
    rain and abundant fish of all kinds, including some already cooked, found on riverbanks.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kakoma prophet called district chiefs to him, named a lad as his slave,
    and ordered a clay pot to be placed outside as proof of coming rain; the pot was
    not filled and was thrown away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Old women told children that the prophet had previously predicted an eland
    in a game-pit, and the missionary disliked his claim that prayer to God was useless
    for obtaining rain.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: A man calling himself Chilenga, translated as “the Creator,” said he could
    destroy a crop-spoiling grub; people brought grubs to him, and he burned some
    with incantations, but the grubs continued their damage.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Chilenga predicted that he would blacken the sun for six days, destroy the
    Kafue bridge and railway, and cause Europeans to leave; he said people should
    destroy their cattle, and some Batwa killed cattle before he was arrested.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: At Nanzela during heavy rain, an unnamed man professed to be Mwana Leza or
    possessed by Him and ordered a chief to build a hut with east- and west-facing
    doorways before bringing grain for a prayer to stop the floods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Nanzela claimant demanded more grain and then cloth, shirts, cattle, and
    goats; after his prayer did not stop the rain, he said Leza had ordained a great
    flood, and the people eventually judged him false.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Three women identified as baami said Mwana Leza came down long ago in the
    Lusaka country, was kind and gentle, urged people to stop fighting, and was killed
    at Chongo because of an ox.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The baami said Mwana Leza's spirit enters many baami, who foretell events
    and urge people to live peacefully and cease shedding blood; one such woman was
    brought to help end fighting.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The three baami are described as light-skinned women with a far-away look
    in their eyes and hair twisted into small ochred and fattened knots called shimbulumbumba.
  category: attribute
  evidence_refs:
  - ev:4
