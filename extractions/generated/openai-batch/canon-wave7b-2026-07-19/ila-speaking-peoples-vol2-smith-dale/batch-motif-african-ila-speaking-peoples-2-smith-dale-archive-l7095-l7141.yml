canonical_text:
  quote: '"Hear us, O divinities, that our village may be firm and strong."'
  summary: The passage describes offerings to divinities after a safe return, libations
    at a grave to greet a divinity, and rites for moving a village to a new site,
    including medical protection, a medicine pot, ox blood, prayer, and boundary pegs
    against witchcraft. It also states that family heads and wives approach their
    own family divinities, while the village chief appeals to his divinities on behalf
    of the village.
  language: English
  quote_policy: quoted
