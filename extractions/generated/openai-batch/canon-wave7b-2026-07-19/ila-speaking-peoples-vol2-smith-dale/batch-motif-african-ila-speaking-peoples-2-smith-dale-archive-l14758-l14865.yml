canonical_text:
  quote: ''
  summary: The passage contains the end of a tale in which Squirrel receives a fortunate
    tree-dwelling life while Jackal is destined to be hunted by men; a tale in which
    Hare frightens and names Skunk, making Skunk useful to men and explaining Ba-ila
    skunk charms; and the beginning of a tale in which Duiker envies Oribi’s coat
    and tail, invites Oribi with beer, and steals the sleeping guests’ skins and tails.
  language: English
  quote_policy: summarized
