canonical_text:
  quote: ''
  summary: The passage records Ila interpretations of dreams as omens of death, life,
    hunting success, or danger; describes ghosts who may fight over or advise a sick
    person; prescribes divination and offerings to spirits at crossroads or under
    a tree; and explains several forms of spirit possession, including possession
    or haunting of murderers and illness attributed to ghosts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dreams involving a father, mother, or kinsman being dead, carried, well clothed,
    or fat are interpreted as signs of death, sometimes not of the dreamed person
    but of another person.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dream in which a father bathes at the river or appears very white and thin
    is interpreted as meaning that he is alive.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A dream of a dog biting the dreamer is treated as a warning that the dreamer
    should not go out that day, lest he be bitten by a lion; a dog biting the father
    in a dream means another person will be bitten by a lion.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Dreams of marrying or embracing a relation, pieces of tobacco, or red beads
    are interpreted as signs of meat or hunting success.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:5
  text: Dreams of weeping and dreams of fish are interpreted as signs that a person
    will die and be mourned.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:6
  text: A dream of flying through the air over trees is interpreted as a sign of life
    and as a great dream.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A dream of falling into a game pit is interpreted as a sign that the dreamer
    will die; the passage says the person then becomes sick and dies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: If two ghosts come to fetch a sick person and fight, this is interpreted as
    meaning they will kill him; if ghosts only tell him about medicine, he follows
    the instruction and recovers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: When a sick person reports ghosts fighting over him, friends consult a diviner,
    who identifies one ghost as a deliverer and the other as one who wants to kill.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The diviner instructs people to make offerings to the deliverer and also to
    the hostile ghost at the crossroads and at the foot of a tree, telling the hostile
    one never to return and motioning him off with medicine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The passage states that, according to Ba-Ila belief, a ghost may enter a living
    person temporarily, intermittently, or permanently, while reincarnation is treated
    as a separate category.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: A murderer’s uncomfortable feelings are attributed to the ghost of the murdered
    man; the phrase translated as “The chia seizes, possesses, him” is given for this
    state.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The ghost of a murdered man is said to lodge in the region of the epigastrium
    and to be expelled by an emetic or by cupping.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Chanzu or Lwanzu is described as a vague idea in which a murderer or other
    evil-doer is haunted by, or has within him, the ghost of a murdered man or another
    spirit.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Examples are given in which persons said to have Lwanzu are driven away, beaten
    until they repent, or sold into slavery.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Temporary possession is also assigned as the cause of many illnesses, including
    cases described as delirium.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: In one illness case, a man who had convulsions was thought to be possessed;
    when asked who he was, the answer was the name of a recently dead brother, Shacheza.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: The passage introduces people who are intermittently possessed and says they
    might be called demoniacs.
  category: attribute
  evidence_refs:
  - ev:10
