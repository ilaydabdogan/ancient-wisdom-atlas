canonical_text:
  quote: ''
  summary: 'An ethnographic account describes an Ila birth scene: attendants assist
    afterbirth expulsion, cut the cord with a knife over a reed while singing, wash
    the child, move and raise the child with collective acclamation, bury the afterbirth
    in the hut, and place mother and child together. The passage then describes postpartum
    seclusion, protections against mystical dangers to the newborn, taboos on pregnant
    women and sexually active visitors, congratulatory visits and gifts, paternal
    acknowledgement by bead-tying and holding the child, and suspicion of visitors
    who do not give a present.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the observer's arrival, the child was already born, lying on its left side
    on the mud floor, while the afterbirth had not yet come away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An attendant put fingers into the mother's throat to make her heave, apparently
    to help the afterbirth come away; after it came away the mother was given hot
    water with boiled tree bark and then warm watery gruel.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The cord remained attached while the women looked for implements; they used
    a dirty rag for tying, a reed laid under the cord, and an old penknife for cutting.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The cord was cut across four times while the women sang together in monotone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A calabash was broken into a bath; hot water was put in it, and the child
    was washed of blood before the mother washed her breasts in the same water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman holding the child jerked it head-first toward the east and west;
    the women ululated, clapped, shouted 'Up,' and praised and thanked the mother
    for bearing a child.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A hole was scraped in a rat-hole in the hut, and the afterbirth was dropped
    into it, straightened after an exclamation from the woman holding the child, and
    covered with earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A skin was spread with one end over the burial place of the afterbirth; the
    child was laid beside the mother, both were covered with blankets, and the child
    was not put to the breast.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The text states generally that the afterbirth is buried in the hut, and that
    the caul, if present, is also buried there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After confinement the woman returns to her house and stays there for at least
    six days.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: For several days the child is given a castor-oil-leaf concoction, and a palmleaf
    string is suspended on poles in front of the hut as a warning and means of fending
    off pregnant women.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A pregnant woman must not enter the hut because the child might die of luvhumwe
    or wars; the passage explains luvhumwe through examples of splitting, falling,
    or cracking in calabashes, fruit, pups, eggs, and a baby's skull.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The husband and male relations may enter during the mother's retirement to
    congratulate her and give gifts, but a person who had sexual intercourse the previous
    night may not enter.
  category: relationship
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:14
  text: When the mother emerges, the father ties beads on the child's wrists and legs
    and nurses it in his arms, which the text identifies as his acknowledgement of
    the child.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: Visitors who approach the child are treated with suspicion; unless they give
    a small present, they are not allowed to hold the child lest they hinder its growth.
  category: relationship
  evidence_refs:
  - ev:12
