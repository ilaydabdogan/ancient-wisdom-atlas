literal_observations:
- id: obs:1
  text: The chingvhule is said not to be a separate entity, although people may speak
    as if it were and may fear that a portrait could take a child's chingvhule.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Witches are said to be able to take away a man's shadow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: An elderly Ba-ila chief denied that the shadow and the self are identical,
    calling the shadow only something seen when a person stands in sunshine.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The informant stated that a dead man enters the womb and is born again, but
    did not identify clearly what part or entity enters.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The terms muwo, moza, breath, wind, and shadow are presented as metaphorical
    terms rather than distinct entities.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The authors state that the Ba-ila have no satisfactory word for soul as such;
    muzhimo and musangushi are described as discarnate spirits.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The authors formulate a possible account in which soul-stuff pervades the
    body and is especially active in blood, heart, genitals, taste, and hearing.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says that the essence of this soul-stuff may, with drugs, be separated
    from the body and hidden for safety as an external soul in other things.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A spirit from the spirit-world is said to give a person identity, name, position,
    and personality.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: At death the person becomes metamorphosed; the spirit is freed from the body
    and enters an unknown spirit-world to await reincarnation.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After death the person's soul-stuff is said to become a musangushi that hovers
    around the grave and lives in trees and houses.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Medicine may disturb the normal process by extracting an essence from the
    body that transforms into an animal, making one person into three distinct entities.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A magician may destroy the spirit entirely so that it cannot be reincarnated,
    and the soul-stuff may become a malevolent chizwa.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Until bodily decay is complete, the musangushi or chizwa remains attached
    in some way to the body; destroying the body destroys the chizwa.
  category: relationship
  evidence_refs:
  - ev:9
