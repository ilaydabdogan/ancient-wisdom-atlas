canonical_text:
  quote: ''
  summary: 'The passage contains three folk-tale episodes: Mbwalu is pursued by a
    little old woman who has tampered with his churn and who later changes into a
    pretty maiden after he consents to marry her; another little old woman offers
    to nurse a child, kills and cooks it, and deceives the mother into eating part
    of it; a foolish mother kills her crying child and mistakes or claims its death
    for sleep until elders discover the body and rebuke her.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At a cattle-post, a little old woman entered a house, stole out of Mbwalu's
    churn, and put many fleas into the churn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The little old woman claimed that Mbwalu had married her, while Mbwalu said
    he was still a youngster and would not marry her because she had stolen out of
    his churn.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The little old woman followed Mbwalu wherever he sat, and his comrades laughed
    at him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mbwalu told the elders he would kill the little old woman who stuck to him;
    at sunset he entered a hut and she followed him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After elders advised Mbwalu to marry the little old woman and he consented,
    she was found near dawn to have changed into a pretty maiden.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A little old woman offered to nurse a woman's child while the mother went
    to hoe, and on the first day told the mother to bring the child again the next
    day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the next day, the little old woman took the child, went to get a melon,
    throttled and killed the child, put it in a pot, and attached the child's cut-off
    arms and head to the melon.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The little old woman served the child's mother pieces of meat and said the
    meat was young wart-hog killed by her husband.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: When the little old woman was putting the supposed child on the mother's back,
    the melon fell down and the mother realized the child had been killed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The little old woman told the mother that they had both eaten her meat; the
    mother went weeping to the village, where people first laughed at her and then
    wept.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: A foolish woman had a child who cried continually, and elder women told her
    that children cry in that way.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: At night the foolish woman wrung the child's neck and said she had removed
    the thing from the child's head that made it cry.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The woman told elders the child was sleeping, though the passage states that
    it was dead and later partly rotten.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:14
  text: Elders inspected the child, said it was rotten-dead, accused the woman of
    having killed it earlier, and called her a fool.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: After being rebuked, the woman threw herself on the ground in grief, and the
    elders asked why she howled after killing the child herself.
  category: action
  evidence_refs:
  - ev:11
