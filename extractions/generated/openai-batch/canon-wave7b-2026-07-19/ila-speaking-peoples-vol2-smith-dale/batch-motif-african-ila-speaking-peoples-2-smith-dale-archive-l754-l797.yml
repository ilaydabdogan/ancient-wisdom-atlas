canonical_text:
  quote: ''
  summary: 'The passage records child-related prohibitions and introduces initiation
    as the transition from childhood to adolescence. It names three ceremonies and
    then describes Kudivhunga: girls decide during the wet season to begin initiation,
    prepare a space around a munto bush, leave clothing on their parents'' hut roofs
    at dawn, go naked to curl around the bush, are found and celebrated by their mothers,
    dressed in new clothes, danced with, carried back to the village, and placed together
    in one hut.'
  language: English
  quote_policy: summarized
