    now applied only to Leza.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Among the Bambala, Lukele is reported as a name given to Leza, and Leza under
    this name was described as the piler-up of the Nambala mountains; the authors
    add that Lukele seems to have been an ancient human hero.
  category: relationship
  evidence_refs:
  - ev:7
