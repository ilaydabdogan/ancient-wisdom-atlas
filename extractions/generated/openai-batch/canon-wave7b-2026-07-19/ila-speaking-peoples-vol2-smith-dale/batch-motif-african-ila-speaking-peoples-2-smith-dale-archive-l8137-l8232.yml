    and Deliverer of those in trouble.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Descriptive tembaula titles portray Leza as dissolving ant-heaps, filling
    great pits but not a small oribi footprint, and giving what cannot be eaten.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that Leza's names are common and not esoteric, and that
