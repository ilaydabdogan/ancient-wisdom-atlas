canonical_text:
  quote: ''
  summary: The passage lists and explains names and praise-titles applied to Leza,
    the Supreme Being, including titles relating to all things, duration, guardianship,
    giving, decay, ownership, fate, rain, water, suns or days, deliverance, and landscape
    imagery. It also notes neighboring or related divine names and cautions that the
    many names are praise-names of one Supreme Being rather than evidence of many
    gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Awemba, Mulenga is described as the chief mulungu or nature spirit,
    distinct from Leza, benevolent, and able to grant abundant rain.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The title Mlengi is reported as a Manganja title given to Chiuta.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Several names of Leza are explained as referring to all things, age-lasting
    presence, being everywhere and at all times, and being the one from whom all things
    come.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Other names relate Leza to people as Guardian, Giver, and one who gives and
    causes to rot.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage explains Leza's gifts as impermanent, giving examples of fruits
    falling and decaying, the rainy season passing into winter, and corn being spoiled
    by weevil.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The name Ushatwakwe or Shatwakwe is explained as Master or Owner of his things,
    and Leza is described as owner of all and ordainer of the fate of all.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A killed deadly snake is addressed as having come and been killed because
    this was ordered by Shatwakwe.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Names of Leza connected with elements include titles glossed as the Faller
