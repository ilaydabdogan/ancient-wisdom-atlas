canonical_text:
  quote: So Ringdove has colour around the neck where Blackbird's finger encircled
    it.
  summary: 'The excerpt first concludes a tale in which Blackbird curses Ringdove
    and all birds after birds seek medicines to become like Blackbird; Ringdove''s
    neck color and the birds'' vulnerability to killing and traps are explained by
    that curse. An editorial note compares an Uncle Remus explanation of Guinea-Fowl''s
    speckles. A new tale then begins: Ringdove and Grey Hornbill bear daughters in
    the same house; Hornbill envies Ringdove''s beautiful child, discards her own
    child in the veld, and takes Ringdove''s child away. The supplied passage ends
    mid-sentence as Ringdove returns home.'
