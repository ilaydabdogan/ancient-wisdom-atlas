canonical_text:
  quote: ''
  summary: The passage describes Ba-ila divinities, charms, and attitudes toward departed
    ghosts. The living and dead are said to depend on one another; ghosts are trusted
    for their unseen power but also feared as touchy and vindictive if neglected.
    Some embittered dead become harmful ghosts who cause deaths until diagnosed by
    a diviner and driven away through a purging rite using a potsherd, live coals,
    medicine, fumes, and disposal of the sherd. Divinities are also appeased by offerings
    and by giving their names to possessions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ba-ila are described as having personal attendant geniuses, family gods,
    communal divinities, and charms used together for protection against life’s ills.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage says the living and the departed exist in mutual need: the living
    need ghostly help, and the departed depend on the living for well-being.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The term shoma is glossed as trust or reliance, and ghosts are described as
    invisible, powerful, and normally devoted to family interests.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ghosts are said to retain human-like moods and may punish omissions of reverence,
    but can be placated by offerings.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The proper attitude toward divinities is called mampuba and includes reverence,
    fear, and trust.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Some ghosts, called larvae in the passage, are described as embittered dead
    persons who entered the other world angry after being bewitched by a relation.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The harmful ghost is said to kill outsiders, prompt relatives of the dead
    to consult a diviner, and continue troubling the person who caused its death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Purging is performed by holding a person’s face over a potsherd bearing live
    coals and medicine so that the person inhales fumes, then breaks away, is followed
    with the sherd until falling, and later returns free of the ghost.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Divinities are offered things and are pleased when their names are given to
    possessions and pronounced during use.
  category: action
  evidence_refs:
  - ev:8
