canonical_text:
  quote: ''
  summary: The passage recounts a witchcraft accusation tested by mwazhi administered
    to a dog, then explains distinctions between the munganga doctor and the mulozhi
    witch or warlock, describes dangerous witchcraft medicines, soul-pressing, spirit
    familiars, inzuikizhi effluence, animal transformation, worked food or milk, contact
    materials, and action at a distance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A witchcraft dispute involves Nakabanga, Mutabakomo and his household, the
    ba-Mala, and a named Kazhiampande; Nakabanga says Kazhiampande is the warlock
    and proposes buying mwazhi if he is not afraid.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the mwazhi test, a dog is made to drink while a conditional charge is spoken;
    the dog lives and recovers, after which the ba-Mala are said to stand condemned.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage distinguishes the munganga as a doctor skilled in medicines from
    the mulozhi as a witch or warlock associated with black magic, forbidden forces,
    and bad purpose.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person moved by hatred or jealousy may seek witchcraft medicine from a doctor,
    and such medicine is described as powerful and dangerous.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A warlock may press a living person's spirit by abstracting the soul, leaving
    an empty shell that dies, or may wait for death and then force the disembodied
    spirit into service.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The possessed spirit is named with variants such as Chizwa, Shikazwa, Kazwa,
    Kayobela, or Kapeo, and is described as subservient to the warlock's will.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The warlock can send the controlled spirit to appear to a person, after which
    the person sees it, is terrified, becomes sick, and dies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The warlock's familiar may fetch the essence of grain from another person's
    field, leaving phantasmal grain visible while the owner's store does not increase
    and the warlock's wealth increases.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The effluence called inzuikizhi is explained as something thrust out toward
    somebody and may take the form of an animal or snake, real or phantom.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The witch himself may appear in the shape of a hyena, lion, or snake, and
    a warlock may transform into a hyena at night to attack an enemy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Food may be worked upon by handling it and speaking an incantation, producing
    a phantom of the food that appears in a victim's dish and carries deadly essence.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A chief may be killed through milk that has been worked upon, either by contact
    or at a distance, rather than by ordinary poisoning.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A witch may use earth from footprints, ash from a fire, hair, or nail-parings
    connected with a person and work on these to kill the owner at a distance.
  category: object
  evidence_refs:
  - ev:8
