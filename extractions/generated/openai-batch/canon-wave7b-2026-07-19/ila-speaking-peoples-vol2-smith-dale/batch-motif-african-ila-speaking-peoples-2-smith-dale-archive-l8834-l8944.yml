canonical_text:
  quote: ''
  summary: The passage records Ba-ila notions about thunder, rain, hail, water, wind,
    whirlwinds, earthquakes, metals, directions, and travel. It describes prayers
    or defensive speech during thunder, rain as sent by Leza and controllable by medicine,
    hail as an agricultural sign, water taboos involving ghosts, streams as dangerous
    ghost-occupied places, wind and whirlwinds as mysterious or witchcraft-related
    phenomena, earthquakes as portents, and later ethnographic notes on metals, compass
    points, and limited knowledge of distant places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thunder is said to frighten people more than lightning, and a man may shout
    to the sky asking it to fall simply, give water, and spare those who have not
    offended anyone.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A prayer in the presence of thunder asks the addressee not to put people's
    complaints and talk in its heart, but simply to give water.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rain is thought to be sent by Leza; some say it comes through small holes
    in the vault of heaven.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rain may be stopped by people with proper medicine and released by others
    with more powerful medicine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hail is called an abundance of stone, and hail during the season is taken
    as a sign of an abundant harvest; large stones point to maize and small stones
    to sorghum.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Drinking water early in the morning is taboo unless one has first expectorated
    as an offering, because a ghost may have been one's companion at night and could
    be vengeful.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When crossing a stream, people customarily bathe and cook on the farther side,
    because someone may be drowned and the crossing should be completed first.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Streams are described as often regarded as occupied by ghosts in the form
    of monsters.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Wind is called muwo, is described as mysterious, and is identified with a
    person's breath and with ghosts.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Some people imagine the whirlwind to be a cock with a long tail.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: When a whirlwind approaches, one may stretch out the left arm and point with
    the little finger, or point with a pestle, to direct where it should go.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: If a whirlwind tears grass from a roof, the owner consults a diviner and may
    conclude that it is katumwa, one sent by an evil-wisher.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: If a whirlwind attacks a person, he spits and curses it as witchcraft, and
    this is said to avert the evil.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A slight earthquake in 1910 was called mududumo, the rumbling; some ascribed
    the shaking to Leza, others to white men, and all agreed it was a tremendous portent.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: Old men reported an earlier violent earthquake in which the ground opened
    and swallowed villages; an old song was said to commemorate it, and a later shortage
    of ground-nuts was attributed to the earthquake.
  category: sequence
  evidence_refs:
  - ev:9
