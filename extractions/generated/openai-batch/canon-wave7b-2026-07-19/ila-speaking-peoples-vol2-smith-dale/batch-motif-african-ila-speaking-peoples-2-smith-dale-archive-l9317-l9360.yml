canonical_text:
  quote: ''
  summary: The passage opens a chapter on Ba-ila amusements, describing energetic
    dance and sham-fight recreation, then introduces Chisolo as a leading adult game
    of skill. It explains that related forms are known under other names among the
    Bathonga and Banyanja, and describes Chisolo as played by two men using a ground
    board of shallow holes and equal numbers of small stones called lubwe, moved by
    fixed rules to sweep an opponent off the board.
  language: English
