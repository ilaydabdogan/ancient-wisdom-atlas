canonical_text:
  quote: ''
  summary: 'The passage contains several animal tales and a note: Honey-guide secretly
    traps Wheatear with bird-lime at honey and explains their later separation; Honey-guide
    loses a wife from Bee-town and begins guiding people to bees; a note discusses
    Honey-guide behavior and reputation; Squirrel obtains and keeps Coney''s tail,
    causing Coney to live among rocks; and Squirrel and Jackal begin a tree-felling
    contest for Elephant''s daughters and princeship.'
  language: English
  quote_policy: summarized
