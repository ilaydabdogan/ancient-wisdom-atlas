canonical_text:
  quote: ''
  summary: 'The passage gives a brief Italian comparative example of literal interpretation
    of food terms, then presents three Ila folk-tale items: fools who wait beneath
    a tree for ground-nuts to fall from shells; two men whose dispute escalates from
    a dog killed to free a pot to a retaliatory cutting off of a child''s hand to
    recover a bracelet, followed by divination and healing; and Mukamunkomba, a scolding
    woman whose mouth splits and who becomes a warning against repeated nagging.'
  language: English
  quote_policy: summarized
