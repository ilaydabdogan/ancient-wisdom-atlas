canonical_text:
  quote: ''
  summary: In this folktale fragment, Lions fail to find Kantanga and return to his
    mother. The mother instructs them to hide in the nut-patch, then sends Kantanga
    there to fetch a pumpkin. Kantanga, holding a play-spear, says he will spear something
    in the bushes and throws the toy-spear, striking a hidden Lion. The Lions flee,
    Kantanga returns with the pumpkin, and his mother fears the Lions will kill her
    when they come back. The Lions return and demand their meat. A source footnote
    states that Kantanga is alert to danger and has tried to reduce risk by making
    his companions resemble him.
  language: English
