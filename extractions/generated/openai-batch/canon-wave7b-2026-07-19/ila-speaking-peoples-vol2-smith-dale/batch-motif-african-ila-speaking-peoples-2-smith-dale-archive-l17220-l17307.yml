canonical_text:
  quote: ''
  summary: The passage contains the end of a tale about a pregnant woman whose craving
    for bird eggs leads her husband to climb nesting trees, where a snake eventually
    bites and kills him, followed by the woman's death. It then gives a tale titled
    "A Man and his Mother," in which a hungry man steals cattle and relies on his
    mother’s medicine to divide a river for escape, but he withholds meat from her,
    insults her, and is killed when she refuses to divide the river a final time.
    The passage closes with the beginning of a tale about a father and child hunting
    in the veld, where the child sets traps by a pool and catches a guinea-fowl.
  language: English
  quote_policy: summarized
