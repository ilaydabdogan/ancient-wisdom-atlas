canonical_text:
  quote: to get a new name is to be reborn, remade
  summary: The passage lists elements of Ba-ila marriage rites and interprets several
    as rites of passage. It describes teaching of the young couple, bridegroom seclusion,
    a selected boy spending the first night with the bride, the bride returning home
    to throw away masansa, pubic-hair removal, eating together, and giving the bride
    a new name.
  language: English
  quote_policy: quoted
literal_observations:
