  text: The passage lists named elements entering into the constitution of a marriage,
    including teaching, hiding the bridegroom, kudya bwinga, kunyonkola mazha, madyanshima,
    giving a new name, throwing the spear, and entering the mother-in-law's house.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some ceremonies are described as rites de passage marking movement from an
    old stage of life into a new one, with danger associated with the unknown transition.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Instruction is given to the girl and the man because they are no longer children
    and are preparing for new duties.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bridegroom is hidden away, and the passage reports this as a separative
