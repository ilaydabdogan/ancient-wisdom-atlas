canonical_text:
  quote: ''
  summary: The passage describes an Ila funeral with grave preparation, body placement,
    grave goods, direct speech to the deceased father, mourning songs and gestures,
    a stick-sniffing rite for men leaving the grave, martial display, and comments
    on cattle not killed because the deceased was poor. It then compares Nanzela funerary
    variations, including a side-cavity grave, washing corpse-handlers with water
    over the grave, an ash-rubbed stick purification rite, and mourning duration varying
    by the status or age of the deceased.
  language: English
  quote_policy: summarized
