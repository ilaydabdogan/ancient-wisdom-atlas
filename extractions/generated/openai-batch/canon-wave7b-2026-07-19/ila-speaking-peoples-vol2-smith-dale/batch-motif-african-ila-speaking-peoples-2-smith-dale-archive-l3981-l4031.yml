canonical_text:
  quote: ''
  summary: 'The passage describes a warlock who comes near an enemy’s hut at night
    without being noticed, performs a spell with grass, mentally repeats destructive
    words, and marks the places where funeral fires will be lit. It then discusses
    the social effects of witchcraft belief among the Ba-ila: suspicion of prosperity,
    accusations, ordeal by mwazhi or proxy, and violent deaths of accused people.
    The authors also state that auto-suggestion plays a part in the belief.'
  language: English
  quote_policy: summarized
