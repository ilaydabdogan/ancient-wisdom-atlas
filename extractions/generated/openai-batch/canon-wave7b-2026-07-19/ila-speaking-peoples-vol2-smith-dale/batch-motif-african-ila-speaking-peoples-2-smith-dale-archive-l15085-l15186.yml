canonical_text:
  quote: ''
  summary: 'The passage concludes a Hare and Bushbuck tale in which Hare prepares
    escape burrows, sabotages Bushbuck''s burrow, smears Bushbuck with goat blood,
    and escapes while Bushbuck is blamed and caught; Bushbuck then tricks his captors
    into throwing him into the air and escapes into the bush, with the tale explaining
    his color, name, and habitat. An editorial note compares Hare''s blame-smearing
    trick with Suto, Subiya, Ronga, and Lala tales. The passage then gives an etiological
    tale explaining why jackals do not go in herds: Jackal and his family drink Weasel''s
    honey-beer, become drunk, and scatter into the forest. The passage begins another
    etiological tale in which animals gather to choose horns, all are fitted with
    horns, and Zebra remains behind.'
  language: English
  quote_policy: summarized
