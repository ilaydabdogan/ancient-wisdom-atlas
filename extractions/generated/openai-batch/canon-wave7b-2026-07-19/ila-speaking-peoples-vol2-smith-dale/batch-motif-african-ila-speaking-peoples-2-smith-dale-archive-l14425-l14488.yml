canonical_text:
  quote: ''
  summary: 'The passage closes an origin-of-murder tale in which Eagle curses a father
    who killed his child, then gives a note reporting a Lokele parallel. It then tells
    how Ringdove acquired its black neck-ring: birds praise Blackbird''s blackness,
    Ringdove asks Blackbird for transforming medicine, and Blackbird marks Ringdove''s
    neck. Other birds ask for medicine; Blackbird assigns Guinea-Fowl a speckled coat
    and Francolin red markings and troublesome fates, saying he gives all petitioning
    birds good or bad things in the same manner.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator identifies the preceding episode as an explanation for the origin
    of murder; Eagle curses the father after the child is killed, and the curse says
    people will kill one another from then onward.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An editorial note reports a parallel to the story among the Lokele people
    of the Congo and cites Johnston's Grenfell and the Congo.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Blackbird, Ringdove, and all the birds meet together; Ringdove asks who is
    most beautiful, and the birds answer that Blackbird alone is beautiful because
    of his blackness.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ringdove decides to ask for medicine so that he may be like Blackbird and
    directly asks Blackbird to transform him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Blackbird says he will show the medicine when all species of birds are gathered,
    and Ringdove expresses gratitude.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: On the following morning Blackbird calls Ringdove forward and places his finger
    around Ringdove's neck, explaining Ringdove's black neck-mark.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After seeing Ringdove marked, another bird asks for medicine; the birds offer
    to let Blackbird do whatever he pleases if he gives them medicine to become black.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Blackbird finds Guinea-Fowl eating termites, refuses to give Guinea-Fowl the
    requested medicine, and assigns Guinea-Fowl a speckled coat resembling a Leopard,
    with a stated danger of being eaten by Leopard.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Blackbird assigns Francolin red markings around the mouth and head, grain-eating
    behavior, and the fate of being trapped and troubled by people.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Blackbird states that he gives all the birds who begged from him things good
    for them or not good for them in the same manner.
  category: speech
  evidence_refs:
  - ev:9
