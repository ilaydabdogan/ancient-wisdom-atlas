canonical_text:
  quote: ''
  summary: 'The passage closes a tale explaining why Zebra has no horns and is regarded
    as gluttonous: Zebra arrives after the horns have been taken and receives only
    features such as mane, ears, stripes, and a large mouth, while his friends mock
    his eating. A second tale explains why Leopard and Cheetah became distinct: Leopard
    kills a chief''s ox, smears the blood on Cheetah, denies involvement, proposes
    blood as the sign of guilt, and the chief assigns future hostile behaviors to
    Leopard and Cheetah.'
