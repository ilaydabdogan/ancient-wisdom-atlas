canonical_text:
  quote: This seclusion lasts two or three months. The girl may not be seen by any
    man during this period.
  summary: 'The passage describes part of a girl''s puberty initiation: her betrothed
    husband brings a mantimbwa instrument and a decorated wooden doll, accompanied
    by a woman associated with the girl''s future married name. They enter the initiation
    hut without seeing the girl, present the objects, and play indavu while avoiding
    dropped stones. The girl remains secluded for two or three months, unseen by men
    and covered when carried out for necessary purposes.'
  language: English
  quote_policy: quoted
