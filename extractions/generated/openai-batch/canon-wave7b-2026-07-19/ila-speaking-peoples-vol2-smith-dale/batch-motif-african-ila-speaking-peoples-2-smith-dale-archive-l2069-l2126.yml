canonical_text:
  quote: ''
  summary: 'The passage describes premarital residence and silence for a young prospective
    wife, menstruation followed by initiation and formal marriage, and the Ba-ila
    institution of chiko: goods given by or for the bridegroom to the bride''s kin,
    distinguished from dowry, bride-price, and slave purchase. It explains chiko as
    compensation, contract seal, and guarantee, notes women''s pride in its amount,
    gives a court case involving competing husbands, and states that chiko amount
    depends on the girl''s position and the suitor''s wealth and backers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before the woman becomes properly the man's wife, the man is said to have
    certain rights over her; at about age ten she is taken to his hut and they cohabit.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: While she remains at his home before formal marriage, she may not speak to
    him and must obey orders, such as fetching water, in silence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At first menstruation, she returns to her own home for an initiation ceremony,
    after which the marriage proper takes place.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The goods given by or on behalf of the bridegroom to the bride's clansmen
    and parents are called chiko, and giving them is called kukwa.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage explicitly distinguishes chiko from dowry, bride-price, ordinary
    buying, and slave purchase, and says the woman is not bought.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage describes chiko as compensation to the girl's clan, return to
    parents and guardians for rearing costs, seal of a contract for her to become
    mother of the man's children, and guarantee of good treatment.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Ba-ila woman may take pride in the amount of chiko given by her husband
    because it indicates her worth in his eyes and marks the marriage as honourable.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the reported court case, A was married as a child by B, who gave an ox-skin
    and two calabashes of fat; later C married her, but she returned to B and said
    she would not stay with a man who had given nothing for her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The amount of chiko depends on the girl's position and on the wealth of the
    suitor and his backers.
  category: relationship
  evidence_refs:
  - ev:6
