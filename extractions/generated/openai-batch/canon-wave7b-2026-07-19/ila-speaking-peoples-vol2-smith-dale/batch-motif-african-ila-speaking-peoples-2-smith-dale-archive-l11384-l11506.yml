canonical_text:
  quote: ''
  summary: A philological passage describes sound correspondences among Ila and other
    Bantu languages, especially Suto, Bemba, Nyanja, Xosa, and Swahili. It discusses
    how vowels and semivowels affect consonants, how certain primitive or ur-Bantu
    forms are reflected in Ila, and how Ila commonly produces zhi and shi sounds under
    specified phonetic conditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage compares words for items or actions such as road, laugh, and rise
    among Ila, Suto, Bemba, Nyanja, Xosa, and ur-Bantu, describing different consonant
    correspondences.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Ila ch can result from the influence of the vowel
    i on a primitive k, with examples involving the word for tail and related forms
    in other Bantu languages.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the semivowels i and u, identified as y and w, produce changes
    chiefly affecting gutturals and labials.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says heavy vowels i and u are now recognizable in only a few languages
    such as Suto, and reports that Meinhof attributed obscure modern Bantu phonetic
    changes to such heavy vowels in ur-Bantu.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage lists reflexes of primitive combinations such as yi, li, vi, ki,
    ti, and pi across Ila, Xosa, Suto, Nyanja, and Bemba, using examples including
    village, water, goat, pool, hide, smoke, leave, and dimness or darkness.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that in Ila primitive voiced fricatives with heavy i are
    represented by zhi, while breathed plosives are represented by shi, and describes
    these sounds as assibilated.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says that removal of the front teeth probably contributed to the
    described Ila assibilation and that a first impression of spoken Ila is that it
    contains many shi and zhi sounds.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage describes changes caused when the causative suffix ya is added
    to verbs, giving Ila forms such as katazha, bozha, zazha, sanzha, busha, chisha,
    papya, and lansha, and comparing them with forms in other Bantu languages.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: 'The passage concludes that the influence of y in Ila gives similar results
    to the influence of heavy i: primitive voiced fricatives become the voiced fricative
    3, and primitive breathed plosives become the breathed fricative represented in
    the passage as $ or shi.'
  category: relationship
  evidence_refs:
  - ev:9
