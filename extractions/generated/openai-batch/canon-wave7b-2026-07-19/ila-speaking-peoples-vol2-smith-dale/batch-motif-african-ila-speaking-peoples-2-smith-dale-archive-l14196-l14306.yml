canonical_text:
  quote: ''
  summary: The passage closes a tale in which Mason-Wasp reaches God to beg fire,
    receives a blessing and instructions for obtaining a child from Ngongwa and building
    at the fireplace, followed by an explanatory note on Mason-Wasp behavior and domestic
    fire. It then narrates a tale in which Blue-Jay seeks the Daughter of God as wife,
    brings her to earth under a food prohibition, loses her when a jealous first wife
    deceives her into eating zebra meat, and is punished by God, with an etiological
    explanation of Blue-Jay behavior and charms against sudden death.
  language: English
  quote_policy: summarized
