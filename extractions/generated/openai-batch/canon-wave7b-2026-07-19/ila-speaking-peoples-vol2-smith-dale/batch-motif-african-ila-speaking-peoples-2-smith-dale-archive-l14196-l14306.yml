- id: obs:3
  text: God instructs Mason-Wasp that he need not beget children; when he desires
    a child, he is to find Ngongwa in a grainstalk, carry him into a house, and build
    him a dwelling at the cooking fireplace.
  category: sequence
  evidence_refs:
  - ev:2
