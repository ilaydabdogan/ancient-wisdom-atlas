canonical_text:
  quote: '"he has become a young man"'
  summary: 'The passage records instruction given to boys: obey and honor elders,
    perform errands such as fetching firewood and water, avoid retaliating against
    elders, and refuse improper approaches from women involving tobacco, intimacy,
    or marriage. After the proceedings, boys are decorated with beads, impande shells,
    and anklets, may begin growing an impumbe, and are described as having become
    young men.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A boy is instructed to bring firewood, go on errands, fetch water for an elder,
    and answer that he will go because he is still a child.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The instruction says that honoring the mulumi and elders leads to living well,
    while failing to honor elders leads to not living well.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A third man recounts being taught not to speak evil to elders, not to fault
    them if they strike him, and not to curse them back if cursed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy is instructed not to strike a woman, not to ask her for tobacco, not
    to delay her, and not to agree if she seeks intimate discussion.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: If a woman enters his house, the boy is instructed to call out that a woman
    is there so others can question her conduct.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A woman is represented as offering tobacco and smoke, saying the boy can love
