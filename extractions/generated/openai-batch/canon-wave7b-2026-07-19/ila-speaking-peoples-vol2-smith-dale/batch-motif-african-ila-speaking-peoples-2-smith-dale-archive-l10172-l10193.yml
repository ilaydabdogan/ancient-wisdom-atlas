canonical_text:
  quote: ''
  summary: The passage describes children's play. In one sequence an unnamed actor
    manipulates boys' feet, speaks a formula about seeing bugs, and lifts each boy
    rigidly while saying a grain-bin formula that names the boy's village. In katantaile,
    boys stand in a file with hands on shoulders; the rear boy jumps onto the next
    boy, sings a line, receives an answering line, is carried to the front, and the
    players take turns until all have jumped.
  language: English with Ila phrases and English translations
