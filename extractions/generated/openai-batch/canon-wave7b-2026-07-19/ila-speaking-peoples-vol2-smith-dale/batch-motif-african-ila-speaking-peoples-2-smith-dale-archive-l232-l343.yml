canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing Ila pregnancy and birth taboos: restrictions
    on husbands, a hunter’s speech at a road fork, bodily and cold-avoidance precautions
    for a pregnant woman, fifth-month medicines in a covered insungu vessel, communal
    disease-removal medicines, preservation of the medicine vessel after birth, isolation
    and cleansing after abortion, and the taboo against giving birth in a hut.'
  language: English, with Ila terms and a brief Latin sentence
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A husband with a pregnant wife is described as taboo on account of her and
    must avoid specified sexual and domestic contacts, including intercourse with
    other women except co-wives and sitting or lying on other people’s furniture.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A hunter whose wife is pregnant is said to stop killing game unless, at a
    place where roads divide, he calls out a formula distinguishing a female child
    who should stay and hoe from a male child who should go hunting with him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says a pregnant woman is instructed to prepare her body with aloe
    juice and to keep covered from cold; failure to keep cold away may cause the child
    to die.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the fifth month, the pregnant woman goes home, receives medicine, an insungu
    medicine receptacle, and a covering basket; a three-pronged mufumu-tree stick
    is placed at the head of her bed to hold the vessel.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Medicine in the insungu is mixed with light beer or water, must remain covered,
    is taboo for others, and is drunk only by the husband and wife until the child
    is born to give them strength.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The husband drinks the medicine because diseases in him are said to prevent
    the woman from giving birth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Other medicine is given to people outside so that they may take away diseases
    and the woman may give birth properly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage explicitly states a sympathetic connection between father, mother,
    neighbours, and the unborn child, requiring all to be free from sickness for the
    child’s well-being.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: After birth, the mother or father returns the insungu to its givers with a
    gift of a hoe or beads; the vessel is preserved and taboo for ordinary use such
    as drawing water.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The insungu is said to be in sympathetic connection with the child; if it
    breaks, the child may die and the woman may become a Namantezi, a woman whose
    children all die.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Abortion is described as producing uncleanness and danger to the community,
    and the woman is isolated.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The account of an aborted woman includes a shelter to the west, daily washing
    with medicine, cooking in potsherds, return medicine procured by her mother, communal
    washing and drinking, and a marital restriction before reunion with her husband.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: It is taboo for a woman to give birth in a hut; if she does so and the child
    is born dead, penalties and contamination of grain and medicines in the hut are
    described.
  category: action
  evidence_refs:
  - ev:10
