canonical_text:
  quote: ''
  summary: 'The passage describes several forms of direct prayer and offering to Leza:
    a hunting ritual in a cleared space, offerings for sickness, offspring, daily
    fortune, and travel, and a homicide-related blood-offering in which Shimunenga
    conveys the ox''s shadow-soul to Leza as propitiation. It also states that Leza
    is not generally conceived as an ethical judge, with the murder offering treated
    as an exceptional case.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hunters assemble in a clear space; the eldest takes the centre while the others
    sit around him.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The eldest prays to Mutalabala, called the Eternal One, asking why they are
    kept from killing animals and asking to kill before sunset.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the elder's prayer, all fall to the ground and address the Chief with
    a request to let them kill that day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After an animal is killed, a participant throws a piece of meat into the air
    with thanks, and the oldest man later offers morsels of meat in the cleared space
    for Leza and between the horns of the beast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The participants say that Leza, not a divinity, gave them the meat.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: In some sickness cases, direct access is sought to Leza after prayers to divinities
    have been unsuccessful.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: For sickness, the head of the household fills a lukoma with meal and water,
    pours some on the ground at the right side of the threshold, and prays for the
    sick person to be left alone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The same household ritual includes filling the mouth with water and squirting
    some out as an offering.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: The passage states that access is also sought to Leza when offspring is desired.
  category: other
  evidence_refs:
  - ev:3
- id: obs:10
  text: In the early morning, a man may blow pipe smoke into the air as an offering
    and pray for health and good fortune that day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: When travelling and arriving at a river, a Mwila may squirt water on the ground
    and ask Leza to lead or shepherd him and grant a prosperous return.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage says Leza has no title of Judge, that invocations contain no confession
    of sin, and that an idea of sin against Leza was encountered only in connection
    with a murder blood-offering.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the murder blood-offering, cattle are paid as a fine, one or two are offered
    to the communal demigod, the people eat the ox, and Shimunenga takes the ox's
    chingvhule or shadow-soul to Leza as propitiation.
  category: sequence
  evidence_refs:
  - ev:7
