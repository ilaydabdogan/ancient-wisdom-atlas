canonical_text:
  quote: ''
  summary: The passage contains a fragment about Hare's shadow in water, a tale in
    which Mrs. Tortoise uses her many children to defeat Hare and other animals in
    a race to water, an editorial comparison with Brer Rabbit and Brer Tarrypin, a
    tale in which Hare and Jackal use Fish-eagle's voice from an Imbula tree to make
    the animals believe God has assigned the Imbula fruit to them, and the beginning
    of a tale in which Crested Crane eats Hare's roots and compensates him with a
    crest.
