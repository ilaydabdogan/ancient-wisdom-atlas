canonical_text:
  quote: '"Now you are grown, honour your elders."'
  summary: Two men recount teachings received from the initiator called mulumi. The
    teachings stress humility and obedience toward the initiator and elders, duties
    of service and giving, rules concerning the initiator's wife, respect for property,
    honouring the community and chief, helping elders, and avoiding conceit or rudeness.
  language: English with one Ila phrase
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The first speaker says he was taught not to curse elders or the initiator
    called mulumi, to be humble before the mulumi, and to listen to all his commands.
  category: speech
  evidence_refs:
  - ev:1
