- id: obs:3
  text: The first speaker says he was taught to go willingly when sent, bring hunting
    spoils to the mulumi, and assist the mulumi in work.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first speaker says he was taught rules concerning the mulumi's wife, including
    confronting or reporting another man found with her and not eating in her presence
    unless he had given her a bracelet.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A footnote states that the initiate sleeps with the mulumi's wife about five
