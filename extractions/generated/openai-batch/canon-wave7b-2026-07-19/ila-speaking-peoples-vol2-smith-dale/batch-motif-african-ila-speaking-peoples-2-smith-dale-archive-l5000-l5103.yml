canonical_text:
  quote: The person does not enter into an already existing animal, but becomes an
    animal.
  summary: The passage recounts a famine-time encounter with lions that become men
    and punish disclosure, then describes beliefs that living and dead persons can
    become dangerous animals through medicine, worms, taboos, burial channels, and
    grave manifestations, including the case of the deceased chief Sezongo.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A man in Bunkoya, searching for roots during famine, saw several lions dragging
    an eland and climbed a tree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The lions placed the eland under the tree and changed themselves into men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The transformed beings forced the man down, questioned him, gave him a leg
    of eland, and warned him not to speak about what he had seen.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After fleeing and dropping the meat, the man was chased by the beings after
    they resumed lion form; elders prevented a younger lion from killing him at that
    time.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man told villagers he had found a dead eland, but told his wife the fuller
    story; after she told others, he was killed and eaten by lions while gathering
    firewood.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Many men are said to gain, through powerful medicine, the ability to become
    lions, hyenas, or wild dogs and hunt at night.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A suspected shape-changer called mudisanguzhi, described as a self-changer,
    would be liable to swift punishment under older conditions.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that belief in metamorphosis makes it easy to believe that
    dead people can become animals, depending on their wishes and access to medicine.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Men are said to choose dangerous animals as forms, including lion, leopard,
    hyena, wild dog, elephant, shimakoma snake, and Itoshi monster.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: A doctor prepares medicine from small pieces of chosen animal hides, water,
    roots, and later worms found in the covered pot.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The person swallows selected worms alive and must avoid hot food and getting
    wet; water may cause madness with animal strength and cries, treated by inhaling
    medicated coal fumes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: At funerals, blood-stained earth may bring back frenzy, causing the person
    to rush to the grave and try to dig toward the corpse.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: At death, the person makes cries associated with the chosen animals; after
    burial, a hollow reed in the ear is left protruding above the surface under a
    potsherd so that worms can emerge and become animals.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: The passage distinguishes the animal transformation from the ghost's course,
    stating that the ghost has gone east or taken up residence near the grave while
    offerings continue at the grave.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: At the grave of the deceased chief Sezongo, a tortoise in the burial hut was
    identified as Sezongo, and a reed orifice under a potsherd was shown as the route
    by which worms became the tortoise.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:16
  text: Later reports said two lion cubs appeared in the hut and were accepted as
    Sezongo; still later, a group of roaring lions was said to have come to salute
    the two lions who were Sezongo.
  category: sequence
  evidence_refs:
  - ev:12
