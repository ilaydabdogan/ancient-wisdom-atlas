canonical_text:
  quote: ''
  summary: The passage gives three reported accounts of Bulongo. The accounts describe
    Bulongo as an unseen and uncertain being or force connected with rain, beer offerings,
    inherited festivals, ritual huts at Nalubwe's village, and communication through
    Shimunenga and a medium. The passage also names Nachilomwe, Shimunenga, and Bulongo
    as three great Mala beings whose speech is expected at the change of the year.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents three accounts of Bulongo received from different men.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the first account, people pray to Bulongo when water is not falling from
    Leza, and rain is said to come when Bulongo is called upon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first account says Bulongo's identity is not known and describes him as
    found on earth and as 'earth only,' not a person.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The first account says Bulongo is praised with a humility formula and receives
    a winter festival after the grain is ripe.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The second account says Bulongo is a musangushi, not a person, and that ancestors
    found him and sacrificed to him by inherited tradition.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The second account says Bulongo speaks through Shimunenga, who seizes a medium
    and commands the people to brew beer for Bulongo; the medium then recovers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: After the beer command, the people soak malt, brew beer, bring calabashes
    of beer to little huts, pour the beer on the ground, and address Bulongo humbly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Nalubwe is said to call the feast and to continue a sacred custom inherited
    from his fathers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Nalubwe may tell the people to build a house for Bulongo; people contribute
    sticks, grass, and clay to build and plaster small huts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The second account says Bulongo belongs to all communes and is recognized
    everywhere, but no one has seen him; reported opinions identify him variously
    as earth, a ghost, wind, or a man from Sala.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The third account says Bulongo was a man from the Sala country and a fellow
    of Shimunenga; it also connects impande shells, beads, and wealth with Bulongo's
    people.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The third account says Bulongo has a beer festival at Nalubwe's, is praised
    while people are dressed in finery, and is worshipped in summer when rain does
    not fall and there is great heat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The third account names Nachilomwe, Shimunenga, and Bulongo as three great
    ones of the Mala community, associated with little huts near the western side
    of Nalubwe's village by the big gate.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The third account says that if the three do not speak at the change of the
    year, the ba-Mala wonder where their mizhimo have gone.
  category: speech
  evidence_refs:
  - ev:6
