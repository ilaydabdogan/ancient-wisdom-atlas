  summary: 'The passage reports several ideas about the location and behavior of the
    dead: an underground Hades containing human and animal spirits; a Ba-ila view
    that ghosts go eastward to the Creator; funerary orientation of the corpse toward
    the east; beliefs that ghosts may remain near graves or houses; and the planting
    of sprouting sticks around graves to form groves called mabwabwa.'
