  text: The passage assigns semantic tendencies to noun classes, including persons
    and most animals in Class I, less-personal things in Class 2, augmentatives in
    Class 3, abstract or collective nouns in Class 4, diminutives in Class 6, worn-out
    or defective things in Class 7, things in Class 8, and abstract or semi-abstract
    things in Classes 9 and 10.
  category: relationship
  evidence_refs:
