canonical_text:
  quote: ''
  summary: Hare repeatedly escapes stronger animals by directing them to a burrow,
    denying that his captured body is himself, appearing in altered form, and injuring
    Elephant and Buffalo. Later, after refusing to help dig a communal water-hole,
    Hare obtains water by tempting successive guards with a calabash of honey or mangwalozhi
    and persuading them to be tied up. Tortoise finally volunteers to guard the water-hole
    and is covered with bird-lime as a trap.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Elephant seized Hare and accused him of telling lies about the elder.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hare told his captors not to hit him on a rock, but to hit him at Spring Hare's
    burrow, and he entered the burrow when brought there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a captor held Hare by the leg inside the burrow, Hare said the captor
    was holding a large root, and the captor let go.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hare came out along the road with braided hair and changed into a human being,
    then induced Elephant to use his body for striking the hoe-handle and wounded
    him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Buffalo caught Hare in the burrow; Hare repeated a song saying that the captor
    held a large root.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The animals consulted Mr. Ant for divination, and Mr. Ant told them to seize
    Hare when they saw him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hare appeared again in the road playing a hand-piano; the animals mistook
    him, did not seize him, and he wounded Buffalo before returning to the burrow.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The animals said Hare was too much for them and had very great cunning, and
    they left him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: All the animals went to dig out a water-hole; Hare refused to dig and said
    he had his own water, and the animals warned that they would kill him if he drew
    water from their hole.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Gnu guarded the water-hole; Hare showed him a calabash of honey or mangwalozhi,
    gave him a taste, tied him up at his request, and drew water.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:10
- id: obs:11
  text: Lion guarded the water-hole; Hare again used the calabash to make him ask
    to be tied up, tied him, cut off his tail, and went away.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Elephant guarded the water-hole; Hare again used the calabash to make him
    ask to be tied up, tied him, threw him away, and drew water.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Tortoise volunteered to guard the water-hole, and the animals put bird-lime
    all over his body and placed him by the hole.
  category: sequence
  evidence_refs:
  - ev:9
