canonical_text:
  quote: ''
  summary: The passage mentions the grave of Mungalo, describes post-funeral feasting
    for a deceased person and the final beer of weeping, then explains occasions when
    ordinary divinities are approached. Illness may be attributed by a diviner to
    a neglected divinity; the house head offers beer, tobacco, water, or food and
    prays for a child or for himself. Before hunting, a hunter places water, tobacco
    or hemp, and sometimes meal at the foot of the musemu, spits water, and prays
    to an unnamed addressee.
  language: English with Ila prayer excerpts and English translations
