canonical_text:
  quote: ''
  summary: 'The passage describes Ba-ila recognized sexual partnership institutions:
    Lubambo, a publicly announced lover relationship marked by exchange of gifts at
    a communal ceremony; Kusena, temporary lending of a wife to a friend or honoured
    visitor; and Kusenana, reciprocal wife exchange. It also records rules, restrictions,
    disputes, damages, and recognition of children as the husband''s.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lubambo is described as a recognized institution involving a public ceremony,
    known even to the woman's husband.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At an annual gathering in honour of Shimunenga at Mala, people sing and dance
    around a grove sacred to the muzhimo.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the observed ceremony, a procession of men includes one man leading a young
    ox, and a procession of finely dressed women includes one especially adorned woman.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man presents the woman with an ox and receives a spear in return; after
    this, the two parties separate and the crowd resumes singing and dancing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The exchange publicly signifies that the man and woman have agreed in private
    to be lovers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: At a feast, the lovers leave their spouses, become partners, drink together,
    and sleep together.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A young man without such a lover is not allowed into the hut during the feasting
    and is driven away with ridicule.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Lubambo partnership may continue beyond the feast for as long as the partners
    desire, with visits at intervals and possible further gifts.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The paramour is called Umambakwe, and Lubambo is glossed as an arranged thing.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Husbands may tolerate or benefit from the custom, but may bring claims when
    a wife shows excessive attachment to her lover or appears likely to leave.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Lubambo partners are restricted by the same choice restrictions as marriage
    partners.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: A man commits a serious offence if he visits his paramour while she is nursing
    a child, because the child may suffer; the husband may claim damages.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Kusena means temporarily handing a wife to another man, often as a courtesy
    to a friend or honoured visitor, with a present to the woman but no continuing
    right.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Kusenana is a mutual arrangement by which two men grant each other access
    to their wives' huts, and disputes may arise over unequal advantage.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: In the Jongo and Namaunga example, disputed ox payments lead to counter-claims
    and repayment demands.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: A married man may lend his wife to a bachelor friend on the understanding
    of later reciprocity after the bachelor marries.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: Children from such arrangements are recognized as the husband's, though claims
    may still be brought for causing pregnancy.
  category: relationship
  evidence_refs:
  - ev:10
