canonical_text:
  quote: ''
  summary: 'The passage presents three Ila conundrums: brothers with different abilities
    recover a dead sister from a lion and restore her to life, raising a dispute over
    who deserves a reward; four relatives fleeing dangerous creatures face a canoe
    that cannot carry them all and die together rather than abandon kin; a traveler
    with a leopard, rat, goat, and corn cannot solve a river-crossing dilemma and
    stays where he is. A note reports that similar examples were later read in Congo
    Life and Folklore.'
  language: English
  quote_policy: summarized
