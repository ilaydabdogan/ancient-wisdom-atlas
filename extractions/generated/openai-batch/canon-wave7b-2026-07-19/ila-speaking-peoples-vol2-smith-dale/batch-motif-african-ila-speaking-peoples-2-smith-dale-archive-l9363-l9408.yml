canonical_text:
  quote: ''
  summary: The passage describes rules and terminology for playing a variety of Chisolo
    called natatu. Two players arrange stones in rows of holes, move in fixed directions,
    distribute stones one by one, and capture an opponent’s stones by landing in a
    specified opposite empty hole. It also describes an extended relay move called
    kusuntula and refers to diagrams illustrating marked holes and numbered positions.
  language: English
  quote_policy: summarized
