  text: The section concerns playing Chisolo and introduces a variety called natatu,
    translated as “the one of three,” because most starting holes contain three stones.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each player has 33 stones and places them in the holes nearest to him; this
    placement is called kushanga, “planting.”
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Most holes begin with three stones, while the last four holes on the player’s
    right hand in the second row begin with 2, 1, 0, and 0 stones.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Players may move only in one direction, with the nearer row moving right to
    left and the farther row moving left to right.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The opening move is called kubingula, and later moves are called kuteka, translated
    as “to draw water.”
  category: speech
  evidence_refs:
