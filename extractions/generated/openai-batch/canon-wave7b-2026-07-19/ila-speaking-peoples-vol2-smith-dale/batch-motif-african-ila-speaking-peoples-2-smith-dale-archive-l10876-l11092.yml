    where those teeth would be.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage explains that nasals are formed when the lowered veil of the palate
    lets the voiced current enter and exit through the nose; it lists m, n, and q
    and describes nasal compounds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage describes q as important in Ila morphology and gives examples
