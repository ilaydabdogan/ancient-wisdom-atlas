  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that two consonants cannot come together without an intervening
    vowel, except for semivowels and nasal compounds treated as one consonant; it
    also says all syllables are open, each word ends in a vowel, and no consonant
    is doubled.
  category: sequence
  evidence_refs:
  - ev:8
