canonical_text:
  quote: ''
  summary: 'The passage describes Ila terms and practices for reckoning time without
    clocks or calendars: a day counted from sunset to sunset, named divisions of day
    and night, time names based on cattle, herding, meals, food preparation, and the
    sun’s position, borrowed week terms from Europeans and Tebele, and an indefinite
    but cyclic conception of the year tied to spring and agricultural seasons.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ila terms chindi and chidingo are glossed as a period or space of time
    and a definite point of time, respectively; the passage states that the people
    have no clocks and no calendars.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The twenty-four-hour day-period is called bushiku and is reckoned from one
    sunset to another.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Plural forms distinguish days and nights, and the terms for this night and
    yonder night distinguish the coming night from the night that has passed.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The daytime period is called buzuba, derived from the word for sun, or munza,
    which is also used specifically for the forenoon.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Several named time divisions refer to ordinary activities, including cattle
    going out to graze, cattle returning, herdsmen becoming weary, the last meal,
    and preparation of food.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Other named time divisions follow the sun’s course and visible sky conditions,
    including sunrise, the sun overhead, the sun’s decline, cooling, reddening sky,
    and diminishing sun.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When speaking of time, a Mwila points to the sun’s position in the sky to
    indicate when something will happen.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says there was no division of the month into weeks, but that week
    reckoning and Sunday terminology were being learned from Europeans.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Terms for Saturday and Monday are said to be Tebele words learned at the mines.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The year, mwaka, is described as indefinite; in common speech it may mean
    spring, the point where old year merges into new, or for some people a six-month
    agricultural period from October to March.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that the Ila recognize the cycle of the year and say that
    the year has revolved or come round, while not usually thinking about the exact
    number of months.
  category: attribute
  evidence_refs:
  - ev:6
