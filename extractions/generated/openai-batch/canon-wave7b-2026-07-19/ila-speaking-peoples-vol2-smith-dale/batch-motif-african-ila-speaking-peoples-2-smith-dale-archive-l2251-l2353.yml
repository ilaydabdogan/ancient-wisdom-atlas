canonical_text:
  quote: ''
  summary: The passage gives a series of Ba-ila marriage-dispute cases involving wives
    moving among husbands, chiko or bridewealth payments, inherited or transferred
    marital claims, replacement-wife obligations, and compensation claims after a
    wife's death. It concludes that these cases illustrate a fragile marriage bond
    among the Ba-ila and then introduces marriage ceremonies as following initiation
    rites in most cases.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the opening case, one woman is connected successively with several men,
    and disputes arise over cows, prior chiko contributions, inheritance, and transferred
    claims.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In case 6, a young woman has prior promised suitors and payments connected
    with them, but she rejects the original suitors and says she loves U.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In case 7, a woman married after a man took a deceased man's name is later
    taken as a slave because of trouble connected with medicine and child deaths,
    redeemed by another man, and then disputed between men.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In case 8, a girl is taken as an inheritance share, married with chiko, later
    given back as a present after a funeral exchange, and then disputed after she
    attempts to release herself with a slave.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In case 9, a woman is taken away by one man, seized by another, states that
    she wants her original husband F, and is sent back to him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In case 10, after a wife dies, the source says Ha custom would require the
    sister to take her place; because there is no sister, the parents must find another
    wife to settle the case.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In case 11, disputes over a woman continue after her death, including claims
    over a cow and earlier transfers of salt, blankets, and beads.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: In case 12, a husband is held accountable to his parents-in-law after his
    wife dies of an unknown disease and pays ten cows.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The authors state that the cases are specimens of continual occurrences and
    that the marriage bond among the Ba-ila is fragile.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage states that marriage ceremonies follow immediately after initiation
    rites in most cases.
  category: sequence
  evidence_refs:
  - ev:10
