canonical_text:
  quote: "“Leza is the sky and what comes from it.”"
  summary: The passage describes how the Ba-ila use the name Leza in ordinary speech
    for heat, wind, rain, thunder, lightning, the rainbow, oaths, curses, and a death
    idiom. It then discusses whether such language identifies Leza with weather elements
    or implies a personal being, noting both elemental language and personal grammar,
    proper names, and statements that Leza sends water.
