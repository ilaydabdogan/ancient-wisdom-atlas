canonical_text:
  quote: "“Wisdom does not sleep in one head”"
  summary: 'Hare converts a lost crest into successive compensations: a spear, meat,
    meal, and an unbaked pot. When the pot dissolves in water, he can no longer continue
    extorting people, and the tale closes with a proverb about the limits of wisdom.
    A second tale begins with Lion, Elephant, and Hare learning the name of munjebele
    fruit from an old woman. Lion and Elephant forget after falling at a slippery
    place, but Hare uses a bell and remembers. Later, at a pool, Hare relieves himself
    near Elephant so others will blame Elephant, who is killed. Hare carries Elephant’s
    head and sings about having shifted blame.'
  language: English
  quote_policy: quoted
