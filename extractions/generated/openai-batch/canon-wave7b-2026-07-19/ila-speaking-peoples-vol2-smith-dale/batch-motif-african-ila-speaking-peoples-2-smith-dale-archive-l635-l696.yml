  summary: The passage describes infant feeding and care practices, high infant mortality,
    greater mortality in tsetse-fly districts because of lack of milk, and the domestic
    and herding duties assigned to Ba-ila girls and boys during childhood. It also
    compares boys' services to elder brothers with fagging in English public schools
    and states that childhood is nevertheless described as happy and relatively unrestricted.
