canonical_text:
  quote: ''
  summary: The passage describes an unformulated Ba-ila conception of a hidden power
    called bwanga, especially associated with medicines, then turns to witchcraft.
    It reports that balozhi are thought to invoke hidden powers to harm or kill, and
    gives a dictated account in which a warlock raises a deceased person as an evil
    spirit, sends spirits to kill people, steal or increase grain, and destroy a rich
    clansman’s household and status.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The authors state that the Ba-ila have not formulated this belief clearly
    and that the nearest term for the unnamed power is bwanga, glossed as content
    or that which is contained in things, and commonly used of medicines.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the belief is treated as an emotional response to a mysterious
    environment rather than as a formal doctrine.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Illegitimate traffic with hidden powers, especially invoking them to harm
    or kill others, is described as dreaded and as the activity of balozhi, translated
    as witches, warlocks, or sorcerers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage reports that European government made it a crime either to practise
    witchcraft or to accuse others of practising it, and that some Ba-ila regarded
    this as preventing them from killing witches as before.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: A leading chief is reported as saying that a warlock committed adultery with
    the chief’s wife, caused her to swell and die, and that four wives of the chief
    had met the same fate; the warlock was driven out and, in the chief’s view, would
    formerly have been burnt.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the dictated account, a warlock hears of a person’s death, goes to press
    the deceased, raises the deceased as an evil spirit, and takes it to his own house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The warlock sends the evil spirit to kill someone he dislikes; the target
    sees a person known to be dead, becomes greatly startled, and dies unless treated
    by doctoring.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Evil spirits are sent to grain-fields to bring ears of corn from another person’s
    field to the sorcerer.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The owner of the field may harvest a large quantity, but the grain is said
    not to increase in the granary because it mysteriously disappears and is called
    fleeting grain on account of the spirits.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: If a person’s stored grain does not come to an end, the passage says an evil
    spirit adds more to it, and this is identified as witchcraft.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A warlock may send evil spirits against a rich clansman to kill children,
    then wives, then the man’s people or slaves, reducing even a chief from a great
    village to a single hut or vagabond status.
  category: sequence
  evidence_refs:
  - ev:8
