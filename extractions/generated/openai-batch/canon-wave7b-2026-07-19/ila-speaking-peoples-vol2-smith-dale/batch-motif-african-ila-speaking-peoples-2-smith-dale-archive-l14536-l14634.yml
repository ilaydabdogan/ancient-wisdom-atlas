canonical_text:
  quote: ''
  summary: The passage concludes a Ringdove tale in which Fish-eagle divines that
    Hornbill stole Ringdove's child and took her to Mala, where she became a chief's
    wife. Ringdove claims the child and is killed by the chief. The text then explains
    Ringdove as a good-omen bird whose wing-spreading brings happiness, with an accompanying
    offering and formula. A note compares dove associations with happiness, marriage
    customs, domestication, Semitic sacrosanct status, and possible onomatopoeic names.
    The passage then begins a Honey-guide tale in which Honey-guide and Capped Wheatear
    seek honey; Wheatear secretly steals honey, denies it, and proposes a bird-lime
    trap after a second honey-finding test.
  language: English
  quote_policy: summarized
