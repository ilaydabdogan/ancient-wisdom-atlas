canonical_text:
  quote: ''
  summary: The passage describes a medicine involving roots, serpent parts, and a
    reed that is said to cause a person after death to become an Itoshi, python, and
    other snakes. It recounts Chongo’s expected postmortem transformation into an
    Itoshi and installation in the river. It also describes transformed men or uncertain
    spirits inhabiting ant-hills, rocks, trees, groves, forests, mountains, and pools;
    some places are taboo, some beings guard clans or affect hunting, and ghosts are
    classified as changed people, divinities, enslaved ghosts, or dangerous free agents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A medicine is prepared from musamo root, an Itoshi scale, heads of a python,
    a Mulala, other snakes, and powdered reed; it is made into a small bread and swallowed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the recipient’s health fails, wet mud from the river is to be smeared
    on the heart, and python skin soaked in water and palm-string are put in the hands.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After death, the decaying body is said to produce an Itoshi, a python, and
    many snakes; the grown Itoshi goes into the river and the snakes into the veld.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Chongo, a Bakubi clan member, was said to have eaten the necessary medicine
    and was expected to become an Itoshi, emerge through the reed in the grave, be
    fed in his hut, and later be put into the river.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some bapuka are said to inhabit ant-hills, rocks, and trees and to have once
    been men; those places are taboo and may not be used for firewood or building
    earth.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Shichonka is described as a monster in a grove, once a man, and guardian of
    the Nyungwe clan, able to weaken enemies at the knees.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: At Chitumbi, Shikadio is said to live as a mupuka beneath a great ant-heap
    or to have become the ant-heap itself; another heap, Kafumpa, is inhabited by
    another ancient, and digging there was warned against.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Sprites are said to live in pools, trees, and forests; the passage states
    that their classification is uncertain and that some people say they once were
    men while others deny it.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Luwe is described as a one-legged goblin riding an eland, preventing people
    from killing game, being a great hunter, treating antelopes as cattle, and possibly
    giving hunting medicine.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: A deep pool on Nambala mountain and another pool in the forest are each associated
    with a being; Chobochobo in the forest pool is said to give hunting medicine and
    good luck.
  category: setting
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:11
  text: Basangushi are called changed people, are generally beneficent or neutral,
    may cause sickness if neglected, and may enter people to speak or appear in dreams.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:12
  text: Mizhimo are described as basangushi in their capacity as worshipped divinities,
    while some other ghosts are said to be pressed and taken as slaves by witches.
  category: relationship
  evidence_refs:
  - ev:13
  - ev:14
- id: obs:13
  text: Some ghosts named mazwa, tuzwa, or bashikazwa may act as free agents, causing
    disease, waylaying and killing people, or disrupting objects and burdens.
  category: action
  evidence_refs:
  - ev:15
