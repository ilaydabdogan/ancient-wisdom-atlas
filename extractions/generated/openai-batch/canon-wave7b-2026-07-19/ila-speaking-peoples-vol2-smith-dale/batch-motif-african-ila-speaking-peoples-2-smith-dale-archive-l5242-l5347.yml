candidate_motifs:
- id: motif:1
  label: Ritual ingestion leading to serpent transformation after death
  taxonomy_refs:
  - shapeshifter
  - death_rebirth
  basis: The passage describes a medicine made with serpent parts and states that
    after death the body produces an Itoshi, python, and snakes; Chongo is also said
    to become an Itoshi after eating medicine.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage uses language of becoming and emergence, not a formal rebirth
    doctrine; the taxonomy label is approximate.
- id: motif:2
  label: Dead or ancient people inhabiting taboo natural places
  taxonomy_refs:
  - shapeshifter
  basis: Bapuka and named ancients are described as formerly human or ancient beings
    inhabiting ant-hills, trees, rocks, groves, or heaps that must not be disturbed.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: Some cases are explicit transformations, while others are described as
    inhabitation rather than bodily transformation.
- id: motif:3
  label: Transformed guardian protects a clan against enemies
  taxonomy_refs: []
  basis: Shichonka is said to have once been a man, to inhabit a grove, to guard the
    Nyungwe clan, and to weaken enemies.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: Only one named example in this passage has the explicit clan-guardian
    function.
- id: motif:4
  label: Water or forest spirit grants hunting power and luck
  taxonomy_refs: []
  basis: Luwe may provide hunting medicine, and Chobochobo in a pool gives powerful
    hunting medicine and good luck.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: medium
  cautions: For Luwe the passage reports possibility according to some people; for
    Chobochobo the account is hearsay from another informant.
- id: motif:5
  label: Ghosts communicate through possession or dreams and may punish neglect with
    sickness
  taxonomy_refs: []
  basis: Basangushi are said to enter people and speak through them or appear in dreams,
    and neglect may induce them to make people sick.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage summarizes general beliefs rather than narrating a single
    episode.
- id: motif:6
  label: Ghosts enslaved by witches and acting as harmful agents
  taxonomy_refs: []
  basis: Some ghosts are said to be taken as slaves by witches; others may act freely,
    cause disease, kill, and disrupt ordinary tasks.
  evidence_refs:
  - ev:14
  - ev:15
  confidence: high
  cautions: The passage notes uncertainty about whether these ghosts are always under
    witches’ control.
