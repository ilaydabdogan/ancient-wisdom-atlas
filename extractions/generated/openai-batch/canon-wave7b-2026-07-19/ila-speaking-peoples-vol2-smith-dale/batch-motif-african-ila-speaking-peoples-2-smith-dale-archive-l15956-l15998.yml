canonical_text:
  quote: ''
  summary: 'The passage first concludes a Hare episode in which Hare uses a hung axe
    and a game-pit to make Lion, and then others, fall into the pit, where Hare kills
    them; afterward Hare dries meat, builds a village, and becomes a chief. It then
    begins the tale titled “Hare deceives Jackal three times”: Hare and Jackal travel
    together; Hare sends Jackal back for grass while Hare eats the nuts they were
    given and blames the owners; later Hare sends Jackal back for calabash pieces
    while Hare drinks the thick milk they were given. The excerpt breaks off during
    Hare’s reply about the milk.'
