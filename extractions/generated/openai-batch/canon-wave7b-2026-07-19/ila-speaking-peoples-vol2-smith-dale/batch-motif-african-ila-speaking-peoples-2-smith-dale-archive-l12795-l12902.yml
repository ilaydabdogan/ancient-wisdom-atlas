literal_observations:
- id: obs:1
  text: Several proverbs are presented as rebukes to arrogant or conceited people,
    using images of a chief eating like ordinary people, an ordinary pole stopping
    a fence hole, an axe-shaft made from ordinary wood, a self-styled wise man missing
    food, and a bull not being famous in two herds.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
- id: obs:2
  text: A group of proverbs is addressed to a know-all, especially younger people
    who try to instruct elders; the sayings state that wisdom comes from an ant-heap,
    does not dwell in one head, and that one may outrun an old man but not surpass
    him in wisdom.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:3
  text: A proverb aimed at grumblers says that the niceness of meat is one, with the
    explanation that this is so for a hungry person.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:4
  text: Several proverbs condemn false-tongued people, insult, backbiting, speaking
    evil of the living, and a person who runs down one chief to another.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  - ev:13
- id: obs:5
  text: Proverbs against greed compare a greedy person to a great open mouth or sack
    and remind those near the food not to deprive an absent person of a proper share.
  category: speech
  evidence_refs:
  - ev:14
  - ev:15
- id: obs:6
  text: A proverb praises the prudent hyena as living long, and another describes
    disaster befalling a hot-headed person who seeks danger despite warning.
  category: speech
  evidence_refs:
  - ev:16
  - ev:17
- id: obs:7
  text: A proverb says the first ox drinks the water, while a by-speech phrase about
    the mother wild-dog refers to a tale in which an old mother wild-dog lags behind
    the pack and receives only entrails.
  category: speech
  evidence_refs:
  - ev:18
  - ev:19
- id: obs:8
  text: A thanksgiving formula is glossed as meaning “To-morrow and to-morrow,” or
    “give me it again and again,” and a proverb says it is better to help a fighting-man
    than a hungry person because the hungry person has no gratitude.
  category: speech
  evidence_refs:
