canonical_text:
  quote: ''
  summary: The passage describes Ila funeral practices and explanations concerning
    suicides, strangers, grave goods, slain animals or persons, mourning behavior,
    survival after death, last words addressed to corpses, and varied possible destinations
    or transformations of ghosts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Suicides are said to be buried in the usual way, and their ghosts are not
    feared more than other ghosts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ghost of a suicide is called a shingonzunzu and is described as discontented,
    rebellious, headstrong, and likely to cause a reincarnated person to commit suicide.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: In one suicide case, the body was returned to the village for burial, but
    the funeral rites and a little spirit-temple were placed at the blood-bespattered
    spot because the ghost was said to be where the blood was.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A stranger's funeral rites are carried out in the village where he dies, while
    news is sent to his home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The stranger's relations provide a musambo to cleanse the village from corpse
    defilement; this is generally an ox killed and eaten by the villagers, after which
    the ghost returns home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The authors describe grave goods and cattle slain at funerals as world-wide
    practices that may point to belief in a spirit-world where life resembles earthly
    life.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some Mwila denied that buried goods are taken by the ghost and said they are
    buried because they belonged to the deceased and the ghost would be angry if they
    were not buried.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Killing slaves, wives entering graves, and a child being buried with its mother
    are explained in the passage by informants as grief or practical/nursing constraints,
    not as providing a retinue in the spirit world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Ba-ila explain funeral noise and disordered dress as expressions of grief.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Chongo's funeral, men charged up and down in war dress; a missionary suggestion
    that they looked as if fighting death was treated as a joke.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The authors state that the Ba-ila believe in survival of personality after
    death and seek communion with the departed.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: Last words are sometimes addressed to a corpse as a good journey and as a
    request to tell earlier dead that the living were left well.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage says Mwila informants did not dogmatise about the destination
    of the dead.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Possible states or destinations of the ghost include going underground or
    east, hovering near the grave or houses, becoming an animal, living in a tree,
    rock, or ant-hill, becoming an evil spirit or worshipped divinity, possessing
    a person, and later reincarnating.
  category: sequence
  evidence_refs:
  - ev:8
