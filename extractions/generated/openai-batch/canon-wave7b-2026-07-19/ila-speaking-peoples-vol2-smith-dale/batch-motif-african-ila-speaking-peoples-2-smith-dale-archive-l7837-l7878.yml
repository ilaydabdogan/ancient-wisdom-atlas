canonical_text:
  quote: ''
  summary: The passage reports discussion with Nalubwe about Bulongo, distinguishes
    Bulongo from Leza by praise-titles and cult practice, describes annual rites and
    houses for Bulongo, notes groves for other demigods and no local habitation for
    Leza, speculates that Bulongo was an ancient prophet and venerated muzhimo, reports
    an informant's earth-sky interpretation of Bulongo and Leza, and closes by placing
    Leza as the cosmical Supreme Being in an Ila hierarchy of mizhimo.
  language: English
  quote_policy: summarized
