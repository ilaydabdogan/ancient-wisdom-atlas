canonical_text:
  quote: ''
  summary: The passage describes girls' initiation and puberty-related seclusion practices,
    including weaving, sleeping restrictions, instruction by an older woman, preparatory
    bodily practices, dances, feasting, final emergence as women, reverence for specific
    ritual persons or places, seclusion games, and a comparison between Balumbu/Nanzela
    and Ba-ila timing of the rite in relation to first menstruation.
  language: English with Ila terms and a Latin gloss
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During seclusion, the girls weave mats and baskets, return to the hut after
    dark with heads covered, and sleep on the ground or under the bed rather than
    on a bed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Parents and relations bring food for a dance called kuhololwa; Kashimbo dancers
    and mwandu drum players assist, and assistants receive beads, tobacco, and spears.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: While in the initiation hut, the girls receive instruction from one another
    and from an old woman called the mubudi, or instructress.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage reports that the girls perform bodily operations with medicines
    as preparation for marriage over a period described as ten or twenty days.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The instructress gives lessons about conduct in marriage, holds a girl by
    the ear to secure attention, and the girl is expected to nod assent rather than
    speak.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the third month, relations brew beer, gather feast supplies, collect contributions
    from clansmen, and the girls are anointed with fat, dressed, decorated, and brought
    out after dancing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before emerging, the girls are told to reverence the munto bush and the shakamwale
    boy, respecting and obeying the latter.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After emerging, the girls are publicly admired and reported to have passed
    through initiation and become women.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: In seclusion, the girls play Indavu with pieces of broken pot, also play the
    mantimbwa, and sing a song naming Namunkulungu and muntembwe in relation to medicine.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'The passage distinguishes the Balumbu/Nanzela practice from the Ba-ila practice:
    at Nanzela the rite occurs before first menstruation and in company, while among
    the Ba-ila it occurs after first menstruation and alone.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Among the Ba-ila, a girl at first menstruation must keep quiet about it; speaking
    of it is described as taboo and associated in the passage with the death of her
    clan.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Women discover the first menstruation by examining clothes, dance for the
    girl, and the mother is said to weep while also being glad that the child has
    grown up.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The girl's clansmen rejoice, the father presents a hoe to the men before the
    Mwandu dance, and the girl is secluded in a hut.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: During Ba-ila seclusion, the girl plays Indavu using a round hole called the
    Mulao and broken pottery pieces; the passage also begins to describe the mantimbwa
    apparatus with a pot, bows, basket, and stick.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
