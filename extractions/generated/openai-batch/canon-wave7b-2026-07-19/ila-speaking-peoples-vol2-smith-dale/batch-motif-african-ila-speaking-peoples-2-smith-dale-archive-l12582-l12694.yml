  summary: The passage presents an Ila folktale, with original text and English translation,
    in which Hare challenges Elephant to hide-and-seek to test cunning. Elephant fails
    to hide effectively, while Hare lies near a bush with protruding eyes so that
    Elephant thinks the earth has grown eyes. Hare then reveals himself and declares
    his superior cunning, leaving Elephant ashamed.
