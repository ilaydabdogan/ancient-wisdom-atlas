canonical_text:
  quote: It signifies that the girl has now passed over from childhood to womanhood.
  summary: 'The passage describes Ba-Ila girls'' initiation connected with puberty
    and marriage: seclusion under a bed in a dark inner chamber, ritual sound-making
    with the mwandu and reeds, dancing and feasts, instruction for future married
    life, adornment, exchanges involving spear, gifts, cattle, and beer, and a final
    ox rite in which the girl jumps over the dead ox as a sign of passage into womanhood.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: An initiate and her attendants approach the huts, with one attendant bearing
    a burden on her back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl being initiated spends much of her time under a bed in an inner chamber
    described as utterly dark.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The girl's maternal aunt operates the mwandu using an earthenware pot, dressed
    skin, an upright reed, and water; the passage calls the mwandu consecrated to
    initiation ceremonies.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two girls blow through hollow reeds resting on a pot, making noise said to
    amuse the girl in the darkness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A party of women dances from mukobo to mukobo, enters the cattle-kraal, dances
    in a circle near the principal hut, and is joined briefly by the headman's wives
    in honor of the girl undergoing rites.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Early in the period, the young man and his friends join villagers in the Chululu
    dance; an ox is killed and consumed with beer in a feast lasting one night.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Near the end of the period, the young man asks for his wife to come from under
    the bed; the girl's relations delay and then agree to a day when she will emerge.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Before leaving the hut, the girl receives instruction from an old woman on
    expected conduct as a wife, including obedience to husband and mothers-in-law,
    hospitality, household care, and cooking.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The girl is anointed with butter, dressed in a new lechwe skin, and ornamented
    with beads to enhance her beauty in her husband's eyes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the final feast, the young man or his companions plant a spear upright
    in the courtyard and receive a return present called Chikwatamasumo, which may
    be an ox or another valuable item.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Cattle killed or given during the ceremonies have special names and specified
    providers or recipients, including the father, the husband's people, the girl's
    mother, the girl's cook during seclusion, and the husband.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The girl's clansmen kill an ox silently by stuffing things down its throat
    or closing its mouth and nostrils with clay; if it makes a sound, the passage
    says this means bad luck or death for the father.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the ox is dead, the girl comes out and jumps twice over it; if she cannot
    jump, her father carries her on his shoulder and jumps over with her.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage explicitly states that the final jumping-over act signifies the
    girl's passage from childhood to womanhood.
  category: other
  evidence_refs:
  - ev:8
