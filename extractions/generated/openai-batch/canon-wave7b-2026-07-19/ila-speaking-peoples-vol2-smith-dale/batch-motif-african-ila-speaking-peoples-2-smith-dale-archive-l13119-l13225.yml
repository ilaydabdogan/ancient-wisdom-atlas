  summary: The passage lists Ila proverbs and clever sayings about consequences, fate,
    death, hunger, exultation, wealth, need, suspicious kindness, impossible refusals,
    and lost opportunities. It then gives short narrative explanations for sayings
    about a thief escaping with stolen boiling porridge by claiming he must die outside,
    a blind man who gains meat by taking advantage of a friend's exclamation, and
    a coded shout meaning that travellers are approaching.
