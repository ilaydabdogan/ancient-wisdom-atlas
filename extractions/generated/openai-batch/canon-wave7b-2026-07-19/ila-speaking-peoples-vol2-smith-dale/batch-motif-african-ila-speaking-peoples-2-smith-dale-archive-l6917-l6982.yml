canonical_text:
  quote: ''
  summary: The passage describes Ila public and household sacred places, including
    the Iwanga public altar, private sacred spots in the hut, and sacred enclosures
    at the village gateway. It defines terms for offering, lists common offerings
    to divinities, distinguishes gentle expectoration as an offering from violent
    expectoration as a curse, and notes occasions for offerings, including propitiation,
    requests for blessing, honouring a divinity, and funerary offerings to the deceased.
  language: English
  quote_policy: summarized
