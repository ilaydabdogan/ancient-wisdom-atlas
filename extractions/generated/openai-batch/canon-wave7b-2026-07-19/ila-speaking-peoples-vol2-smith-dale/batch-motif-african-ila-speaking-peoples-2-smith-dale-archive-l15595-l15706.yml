  summary: The passage contains editorial notes on comparative variants of an artful
    Hare exploit, a note on animal praise-names, a tale in which Hare deceives Lion
    into a fatal fire ordeal at an ant-hill, and a tale in which Hare sends a she-Dragon
    to steal fire with grass tied around her head, causing her death and explaining
    later Dragon behavior and features.
