canonical_text:
  quote: ''
  summary: The passage lists Ila riddles with answers, including riddles answered
    as fire, feet, ears, grave, grain, sun and moon, hyena, head, dew, palm fruit,
    scar, crows, stamping-block, hair, tree, and eyes. It then gives phrase-answer
    riddles about the dead not returning and the long distance to God. A further series
    repeatedly addresses a clever person and poses impossible or unknowable questions
    about hiding, mixed milk and cattle, water, eggs, pregnancy, roads, death, shadows,
    self-treatment, and rebirth. The passage begins a conundrum in which a widow sends
    her gifted sons to find their missing sister, and the eldest sees her far away
    in a lion’s clutches.
  language: English with Ila phrases
  quote_policy: summarized
