canonical_text:
  quote: ''
  summary: The passage describes Ila customs concerning widowhood, remarriage, childbirth-death
    beliefs, chiefly marriage practices involving fat thrown over a chosen spouse,
    sanctions around sexual relations, and social conditions of polygyny and concubinage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For three days after her husband's death, a widow is not allowed to prepare
    food for herself because she is thought able to infect vessels with contagion;
    another woman feeds her and later receives a new hoe from her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the deceased man's relations meet to appoint the heir who will take the
    widow, the widow can refuse candidates until she obtains the man she wants.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: After a cleansing process, the widow is put in a hut with the new husband,
    a new fire is lit, she is freshly shaved, she is given a cow or ox called chishonsho,
    and the shaving woman is rewarded by the heir.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The term namantezi is applied to a woman whose children all die and also to
    a man whose wives die in childbirth; the passage reports a belief that after three
    childbirth deaths the fourth wife will survive.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Nanzela, a chief's daughter who wishes to marry names the man, and a messenger
    pours over him a potful of fat that must be wholly or partly hyena fat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A man marked with fat for marriage to a chief's daughter becomes a mukwetunga,
    a son-in-law of the ruling family, described as a condition like slavery; he can
    escape only by paying a heavy ransom.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The chosen man is instructed by headmen in duties including continence toward
    other women; if obstreperous he may be half-drowned in a river, and women are
    said to avoid him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: No equivalent law of faithfulness is imposed on the chief's daughter, while
    a woman who has intercourse with the chosen man is subject to severe punishment.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: If a chief desires a woman, he sends women to throw a pot of fat over her;
    she is brought, instructed in her duties, warned against unfaithfulness, and may
    be half-drowned if recalcitrant.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that adult women outnumber men, celibacy is regarded as
    unnatural, monogamous marriages are the majority, and polygyny is limited by available
    women and chiko.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Many unmarried women are described as slaves living in concubinage; a master
    may give a slave as a wife or keep her labor and sexual service without marrying
    her.
  category: relationship
  evidence_refs:
  - ev:7
