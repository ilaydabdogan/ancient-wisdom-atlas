canonical_text:
  quote: ''
  summary: 'The passage defines Kafunduluzho as something that does not come to an
    end or keeps regrowing. It then describes forms of witch medicine: warlocks sending
    snakes or lions to bite victims, working sorcery into food and drink, performing
    nocturnal dancing at a victim''s door, and measuring out future fire-places around
    a village. It states that the shadow is regarded as the person, normally going
    to God after death, but sorcerers may take a living person''s shadow and work
    on it so that the person dies and is not reborn. A narrated case says Namiyobo,
    seeking chieftainship, obtained medicine from a doctor, used ash from Namanza''s
    fire-place and ground from his footprints, pronounced a curse, and after milk
    was taken to Namanza he sickened and died; the aftermath included accusations
    and a note that the Creator and divinities had protected Pobola in an earlier
    accusation.'
  language: English
  quote_policy: summarized
