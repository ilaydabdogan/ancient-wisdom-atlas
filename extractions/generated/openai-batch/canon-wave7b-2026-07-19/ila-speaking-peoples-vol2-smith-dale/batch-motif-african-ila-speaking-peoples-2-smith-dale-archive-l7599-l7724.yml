canonical_text:
  quote: ''
  summary: 'The passage describes Shimunenga celebrations at Mala: women and men sing,
    dance, visit the grove, and pray for rain; Nachilomwe is associated with the first
    day and cattle are displayed to Shimunenga on the second day. It also describes
    a delayed festival caused by unpaid cattle obligations after murders, including
    oxen to die at Shimunenga''s grove, and then introduces Bulongo as a wider arch-demigod
    served through temporary huts and a hereditary representative at Mala.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women prepare festival finery, including mukaku girdles and strings of white
    beads, and begin passing by the village singing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A party of men sings, beats sticks together, kneels before Chidyaboloto, and
    is said to receive beer from headmen when going around villages.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Long lines of women converge from villages to Shimunenga's grove, sing, clap,
    and are accompanied by a drum while men stand and watch.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Shambweka says the proceedings are a customary way to pray for rain.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: One men's song says that where Shimunenga is, even an ugly visitor is not
    to be beaten.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The women's songs are described as the same as those sung at funerals and
