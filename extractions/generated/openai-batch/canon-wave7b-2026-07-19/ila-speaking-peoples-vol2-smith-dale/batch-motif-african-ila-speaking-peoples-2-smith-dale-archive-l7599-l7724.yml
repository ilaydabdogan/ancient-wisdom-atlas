  text: The authors state that Shimunenga is thought to be gratified by the display
    and to return prosperity in field and herd at a critical season of the year.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The makubi are described as involving beer, dancing, singing, men charging
    with spears, lewd songs, and general license.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kabombwe refuses to inaugurate the festival because cattle connected with
    murder cases have not been given; he says the usual practice is to give him a
    cow and collect two great oxen to be killed for Shimunenga.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The chiefs decide on cattle payments, including a fine big ox to die at the
    grove, a cow in calf for Kabombwe, ten cattle for damages, and another big ox
    to die at Shimunenga's grove; the feast is still not held by March 1915.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Bulongo is described as an arch-demigod, the muzhimo of the whole country,
