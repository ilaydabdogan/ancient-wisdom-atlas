canonical_text:
  quote: The genius is not only within him, but, in a sense, external to himself,
    protecting and guiding him.
  summary: The passage describes Ba-ila ideas of reincarnation as lacking memory of
    prior lives and moral retribution, then gives an account of the musediakwe muntu,
    a person's guardian spirit or namesake. A person makes offerings to this namesake
    after sneezing, before hunting, after killing game, and on returning to the village.
    The invoked namesake is identified as the ancestor, often a grandfather, whose
    name the person received after divinatory consultation; the person is said to
    be that ancestor reborn, while the same ancestor also functions as guardian spirit.
  language: English
  quote_policy: quoted
