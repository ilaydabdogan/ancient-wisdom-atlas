canonical_text:
  quote: ''
  summary: The passage describes Ila categories of ghosts and divinities, especially
    personal and family divinities. It explains that mizhimo are ghosts regarded as
    helpful objects of adoration, discusses the Bantu-wide distribution of related
    names, describes the personal guardian spirit and ancestral family divinities,
    and gives examples of offerings, kin-based spiritual jurisdiction, illness attributed
    to divinities, and gendered offering locations at the house doorway.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes basangushi, or ghosts, from mizhimo, saying mizhimo
    are ghosts regarded as objects of adoration and more or less helpful to people.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists related forms of the word for divinities across the Bantu
    field and says this indicates an ancient name and cult of the dead before Bantu
    emigration from an original home.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the word muzhimo is neuter or collective, but also says Ila
    divinities cannot now be denied all personality.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage divides mizhimo, for description, into personal, family, and communal
    divinities.
  category: sequence
  evidence_refs:
  - ev:3
