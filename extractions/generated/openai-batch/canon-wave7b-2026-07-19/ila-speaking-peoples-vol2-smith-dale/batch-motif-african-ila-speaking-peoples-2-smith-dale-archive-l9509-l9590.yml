canonical_text:
  quote: ''
  summary: 'The passage describes Chisolo board-game play and variants involving holes,
    stones, and capture or “eating” moves. It then describes an adult men’s imitation
    lion hunt used as tactical practice: men impersonate lions, a victim is staged
    in the lion’s grip, hunters with wand-spears attack and rescue the victim, spectators
    cheer, a second lion may enter, and the performance ends with the lions’ defeat.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Chisolo game may be complete in a fixed number of moves, but games can be
    lengthened when a player adds fresh stones to depleted holes, a practice called
    “passing in foreigners.”
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In a one-stone-per-hole variety, the starter creates vacancies by eating opponent
    pieces, after which the opponent does likewise and ordinary play can proceed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Players maneuver to place their pieces in “eating” positions while avoiding
    having their own pieces eaten.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The variety named namudilakunze, glossed as “eating on the outside,” allows
    eating of stones on the outer row rather than the inner row.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The variety named Nambidi is played with two stones in each hole and begins
    like the one-stone variety.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The hunting game is described as an adult men’s imitation lion hunt that also
    serves to practice tactics used in a real lion hunt.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: One or two men take the place of the lion and wear ruffs and a tail as costume.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: A herdsman is represented as having been attacked and lying in the grip of
    the lion.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:9
- id: obs:9
  text: Hunters, decorated with feathers and ruffs and carrying long wands as spears,
    advance against the lion.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A bold hunter throws a spear; the lion growls and bites at it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Other hunters distract the lion, retreat from its charge, and eventually rescue
    their comrade.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The performance includes lion growls and roars, hunters’ shouts, drums, singing,
    cheering spectators, and women cheering on the men.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: The scene intensifies when a second lion enters, causing the hunters to make
