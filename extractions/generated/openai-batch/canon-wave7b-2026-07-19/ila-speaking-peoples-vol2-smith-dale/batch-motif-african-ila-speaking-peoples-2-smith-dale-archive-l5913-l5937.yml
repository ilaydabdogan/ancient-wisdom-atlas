  summary: A man hunting a wounded wart-hog sees a dazzling earth-to-sky object, falls
    down, and hears a voice forbidding wart-hog flesh and commanding people to mourn
    the long-dead Mwana Leza. After people laugh at his report, two mysterious deaths
    occur and are taken as a sign that Leza is angry, prompting mourning ceremonies
    that spread through the country for the Child of God.
