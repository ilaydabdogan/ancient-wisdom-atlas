canonical_text:
  quote: In their set games the motive is largely the same — an imitation of birds,
    animals, and objects.
  summary: 'The passage describes Ila children''s play: boys use toy male equipment
    and mimic animals, birds, objects, work scenes, combat, and escape situations;
    girls play with dolls and miniature villages. Several named games are explained
    through their movements, songs, and represented subjects.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Boys wear a grass isusu on the head and carry a play bow and arrows or a small
    wooden spear, and the passage says the boy thinks himself very much a man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Girls play with dolls made from carved wood or mealie cobs, decorate them
    with beads, and build tiny villages with grinding stones and mortars.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that another favorite sport among boys is imitating and
    caricaturing the movements of animals and birds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A lad of about eleven performs a Honey-Guide imitation, making a rotating
    tail from his loin-cloth, shaping his body and face like the bird, approaching
    a post or tree, pecking, retreating from imagined bee stings, making a mock fire,
    and receiving a clod in a dish.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: During the Honey-Guide performance, a man plays a kankobele and spectators
    laugh and cheer; the performance ends when the boy's cloth drops off, causing
    embarrassment and merriment.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Katongotongo or Jacana game has a chorus of boys clapping and singing while
    a performer dances in front imitating the bird; the solo line asks Katongo to
    send fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In kabombwe, boys squat with arms under their knees, hop like frogs, and sing
    verses about a frog nursing a child and Frog speaking to Tortoise about eating
    mushrooms.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In chikwekwe, boys and girls hold hands in a long line and move circularly;
    the game is said to represent the Iwando reed mat stretched across a small river
    as a fish drag-net.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Another game represents warriors in a rainy-season battle in marshy ground;
    boys kneel in two lines, advance by changing knees, clap, and sing about the war
    of the rainy season.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: In chitendebele, boys hold wrists in a ring, dance and run while leaning back,
    and the game is said to represent a flat winnowing basket with sloping sides.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: In lutambo lwa ng'ombe, boys make a ring while one boy inside rushes at their
    joined hands and tries to break through; the game represents a calf tied by the
    leg trying to break free.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: In intululu, boys stand in a file with legs apart while the hindmost boy creeps
    through between their legs; it represents an animal entering its burrow and is
    also played as chombombo to represent foreigners stealthily entering a village.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Kulea miumba is described as a game in which players are supposed to be fish
    dodging fish-spears aimed at them.
  category: action
  evidence_refs:
  - ev:12
