canonical_text:
  quote: the union of both is made, as of the halt and the blind
  summary: 'The passage contrasts Sankhya’s separate souls with Vedanta’s teaching
    of one Spirit, then explains Karikas 19-21: the soul is an isolated, neutral,
    perceptive, inactive witness; through union the unintelligent body or intellect
    appears intelligent and the soul appears to act; the union of soul and Nature
    enables contemplation, eventual separation, and the formation of the universe.
    Commentary adds analogies for neutrality and apparent agency, and describes the
    subtle body or linga accompanying the soul until complete separation from matter.'
  language: English
  quote_policy: quoted
