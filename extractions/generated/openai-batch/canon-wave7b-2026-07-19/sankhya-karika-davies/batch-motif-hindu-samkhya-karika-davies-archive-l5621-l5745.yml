canonical_text:
  quote: ''
  summary: 'The passage summarizes doctrines attributed to Kanada and related Nyaya-Vaisesika
    teaching: inherited arts are argued to imply a superintending Mind; the soul is
    distinguished from matter; categories such as quality, action, community, particularity,
    co-inherence, and negation are described; theories of light, ether, mind, gravity,
    time, and space are outlined; and Gotama and Kanada are said to agree with Kapila
    that deliverance from pain is achieved through philosophical knowledge, ending
    in tranquil unconscious passivity.'
  language: English
  quote_policy: summarized
