canonical_text:
  quote: ''
  summary: The note presents pain as the chief evil and the destruction of pain as
    the highest human aim in Kapila’s system. It describes liberation as knowledge
    by which Soul is freed from contact with matter. It then explains cosmic misery
    and formal existence as arising from a primary unconscious substance or force,
    comparing Kapila’s Prakriti with Schopenhauer’s Will and Hartmann’s Unconscious.
    Prakriti is described as a primordial monad that emanates mind and matter, enfolds
    and animates all things, and finally absorbs all things. Its equilibrium is disturbed
    by proximity to Soul, producing material life so that Soul may know matter and
    gain isolation.
  language: English
  quote_policy: summarized
