canonical_text:
  quote: "“Perception, inference, and fit testimony are the threefold (kinds of) accepted
    proof”"
  summary: The passage explains Sankhya categories including unmanifest nature, soul,
    and in theistic Sankhya a supreme soul. It then presents Kapila’s three proofs
    of knowledge—perception, inference, and fit testimony—contrasts them with Nyaya
    and Vedantic proof-schemes, and states that release from pain comes through knowledge
    and eternal separation of soul from matter rather than moral or religious virtue.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: An invisible or unmanifest order is described as eternal, universal, single,
    without parts, invisible, inferred by reasoning from present existences, unproduced
    but productive, and containing the potentiality of all being except soul.
  category: attribute
  evidence_refs:
