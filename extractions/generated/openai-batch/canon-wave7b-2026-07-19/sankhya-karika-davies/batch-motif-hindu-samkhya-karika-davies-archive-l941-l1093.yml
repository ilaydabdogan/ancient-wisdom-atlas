  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that Kapila limits possible knowledge to three proofs and
    rejects innate ideas, knowledge from pure consciousness, and an inherent moral
    sense in the soul.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says the soul only knows or sees what Buddhi presents to it; goodness
