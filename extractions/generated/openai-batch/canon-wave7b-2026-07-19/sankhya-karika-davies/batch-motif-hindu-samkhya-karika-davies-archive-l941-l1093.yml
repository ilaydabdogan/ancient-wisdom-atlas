    supreme soul or Lord as intelligent cause of emanations from Prakriti.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage identifies twenty-five principles or categories of being in the
    Sankhya system and calls them a base for much Indian philosophy.
  category: other
  evidence_refs:
