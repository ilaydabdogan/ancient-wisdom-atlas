- id: obs:5
  text: The accepted proofs in Kapila’s account are perception, inference, and fit
    testimony.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: Perception is explained as the application or action of the senses toward
    special sense-objects; inference is connected with a sign or mark and its subject;
    fit testimony is identified with fit revelation.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says the Nyaya school admits four proofs and that the Vedantic
