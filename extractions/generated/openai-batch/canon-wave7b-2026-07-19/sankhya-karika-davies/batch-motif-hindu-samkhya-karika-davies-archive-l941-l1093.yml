  text: The passage states that Vedantists incorporated this productive principle
    into their system as Brahmi, the productive energy of Brahma.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The soul is described as uncompounded and eternal, neither a product nor producing;
