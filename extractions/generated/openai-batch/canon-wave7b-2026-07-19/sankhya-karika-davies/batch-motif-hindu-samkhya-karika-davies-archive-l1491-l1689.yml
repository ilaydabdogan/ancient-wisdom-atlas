canonical_text:
  quote: "“The undeveloped principle is the reverse.”"
  summary: The passage compares Kapila’s teaching on cause and effect with Aristotle’s
    report of Greek philosophers and with G. H. Lewes, then explains Sankhya distinctions
    between the visible or developed universe and the undeveloped source, Prakriti.
    It describes Prakriti as uncaused, eternal, universal, self-existing, and supreme,
    and introduces the three gunas—sattwa, rajas, and tamas—as constituent modes of
    Nature whose actions are compared to a lamp.
