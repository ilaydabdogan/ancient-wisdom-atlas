canonical_text:
  quote: ''
  summary: The passage explains five kinds of obstruction, errors that divert the
    soul from final liberation, injuries or incapacities of the organs and intellect,
    false acquiescence, and eight means of acquiring perfection or perfect knowledge,
    including reasoning, oral instruction, study, pain-suppression, friendship, and
    liberality. It also compares Gaudapada’s list of obstructions with Patanjali’s
    and comments on Kapila’s prioritization of reason.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gaudapada lists five kinds of obstruction as obscurity, illusion, extreme
    illusion, gloom, and utter darkness; the school of Patanjali defines corresponding
    obstructions as ignorance, self-love, love, hatred, and fear.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Obscurity includes errors in which a person thinks the soul merges into Nature,
    intellect, consciousness, or the five rudimental elements, and these errors obstruct
    final liberation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Illusion is defined as the error that induces people to seek eight degrees
    of supernatural power, drawing the soul away from its proper aim.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Extreme illusion is described as seeking happiness in sensual objects, with
    gods and humans able to seek such happiness through the senses or organs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Gloom is interpreted as hate; a person may hate the ten senses or organs and
    the eight degrees of supernatural power, while pure contemplation is described
    as a state in which nothing is hated or loved.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Utter darkness is interpreted as terror, including fear of death among humans
    and fear among gods of expulsion from heaven by Asuras.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage lists destructive injuries of the eleven organs and evil or inverted
    forms of acquiescence and perfection as injuries or hindrances of the intellect.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Internal false acquiescence includes passive reliance on Nature, religious
    or ascetic observances, time, or fortune to bring liberation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: External inversions of acquiescence involve abstaining from sensuous pleasure
    to avoid trouble and anxiety rather than from understanding its obstructive nature.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'Eight perfections or means of acquiring perfection are listed: reasoning,
    word or oral instruction, study or reading, suppression of the three kinds of
    pain, acquisition of friends, and liberality.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says Kapila treats the listed obstructions, incapacities, and
    acquiescences as checks in the pursuit of perfect knowledge and then defines means
    of attaining it.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage interprets Kapila as placing human reason above the Vedas as a
    source or judge of truth and error, though reason remains a means to final deliverance
    rather than the highest state itself.
  category: relationship
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:13
  text: Final deliverance of the soul is described as a state independent of motion,
    consciousness, and knowledge, marked by eternal calmness and repose.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:14
  text: Word is explained as instruction from a teacher; friendship is linked with
    philosophical discussion with a teacher or fellow-student.
  category: relationship
  evidence_refs:
  - ev:12
