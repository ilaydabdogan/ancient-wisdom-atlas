literal_observations:
- id: obs:1
  text: 'The passage says the organs are not intelligent and that their activity is
    unconscious, produced by the action of one organ upon another for a common design:
    the liberation of the soul from matter.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The organs are said to act spontaneously and unconsciously, by impulse from
    their own nature, and not by direction from an external agent.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The instrument or organ is described as thirteenfold, with the properties
    of seizing, retaining, and manifesting; the effect to be produced is tenfold.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The internal organs are three and the external organs ten; the external organs
    make external objects known to the internal organs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The external organs act only in the present, while the internal organs relate
    to past, present, and future time.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The commentary describes a sequence in which sight receives an impression
    from an external object, manifests it to manas, which passes it to consciousness,
    which passes it to intellect.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The intellect is compared to a mirror that receives, retains, and reflects
    an impression as a definite ideal form so that the soul may see it.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that Kapila has not determined where willing resides and
    has not treated memory or imagination as distinct faculties.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: The five intellectual organs are assigned specific and non-specific objects;
    speech is connected with sound, while the remaining organs are connected with
    the five objects of sense.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The three internal organs are called gatekeepers, and the remaining organs
    are called gates.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The organs are said to present the whole of being in the intellect for the
    sake of the soul, enlightening it with a likeness to a lamp.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The intellect accomplishes the fruition of the soul and discriminates the
    subtle difference between Pradhana or Prakriti and the soul.
  category: action
  evidence_refs:
  - ev:10
