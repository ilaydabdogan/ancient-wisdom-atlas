canonical_text:
  quote: Causality is implied as an absolute condition of all formal being.
  summary: The passage presents Kapila's Sankhya arguments about knowledge, the limits
    of the senses, the need for Buddhi, the relation of manifold existence to Prakriti,
    and the doctrine that formal existence is an effect requiring cause, while unformed
    Prakriti is eternal and uncaused. It contrasts Kapila with Patanjali's theistic
    school and with Vedantist claims about maya and the One supreme Spirit, and it
    reviews scholarly interpretations of Distich 9.
  language: English
  quote_policy: quoted
