    treats Nature as without personality, volition, or consciousness.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nature is described as acting for the benefit of Soul, exhibiting herself
    through gods, men, animals, sensuous objects, and then retiring after Soul's liberation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Soul is not itself liberated, bound, or migrating
    by its own act; the linga is said to migrate while Soul remains passive.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Vachaspati's analogy attributes victory and defeat to a king although the
    events occur to his generals; this is used to explain how circumstances are ascribed
    to Soul.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Karika 63 says Nature binds herself by seven forms and causes deliverance
    for Soul by one form; the commentary identifies the seven forms and identifies
    the one form as knowledge.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Karika 64 says that study of principles yields complete knowledge expressed
    by the formulas 'I am not,' 'Nothing is mine,' and 'There is no ego.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The commentary rejects an interpretation of absolute nihilism and says Sankhya
    treats Soul as self-existent, unborn, undying, separated from matter, and finally
    abstract, passionless, and unconscious.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Karikas 65-66 describe Soul as an unmoved spectator beholding Nature, while
    Nature ceases to act after being seen; the conjunction of Soul and Nature no longer
