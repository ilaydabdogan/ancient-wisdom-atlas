canonical_text:
  quote: ''
  summary: 'Davies comments on Sankhya Karikas 63-66, describing the relation of Nature
    or Prakriti, Soul, and the linga. Nature is personified as acting for Soul''s
    benefit, binding herself by seven forms and giving deliverance through knowledge.
    Soul is described as passive, separate from matter, and finally a spectator of
    Nature after production ceases. The passage also compares the final Sankhya state
    with Buddhist Nirvana while noting an important difference: Sankhya maintains
    the continued existence of Soul.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
