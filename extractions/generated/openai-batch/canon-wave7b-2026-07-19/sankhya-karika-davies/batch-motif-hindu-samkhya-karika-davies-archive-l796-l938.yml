canonical_text:
  quote: ''
  summary: 'The passage explains Samkhya emanation and perception: Ahankara or Consciousness
    produces subtle elements, gross elements arise from them, Consciousness also produces
    sense and action organs and manas, and the soul beholds presentations mediated
    by Buddhi. It distinguishes Kapila from idealism, compares aspects of the system
    with Kant and Hegel, affirms a continuing dualism between soul and matter, and
    identifies Avyakta as primordial matter.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ahankara or Consciousness is said to produce the five subtle elements, described
    as primary forms or essences of gross material things.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage denies that Kapila's system is idealism and states that Consciousness
    and external forms have objective being independent of the soul.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Kapila and Kant agree that an external world is known
    only as represented to the soul through the action of faculties, while objective
    sense-perceptions are taken as granted.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that Kapila's system resembles Hegel in one respect because
    thought, consciousness, and the external world have a substratum of the same kind.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The passage states that a dualism remains: the soul is different in kind
    from material things and will finally be separated from them in passive eternal
    repose.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The five subtle principles are named as sound, tangibleness or touch, odour,
    visibility or form, and taste.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'The five gross elements are said to proceed from the five subtle elements:
    ether from sound, air from tangibleness, earth from odour, light or fire from
    visibility, and water from taste.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Consciousness also produces the five organs of sense, the five organs of action,
    and manas.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Manas receives and individualises impressions from outward objects, submits
    them to Consciousness, and they pass to Buddhi, where they are defined and represented
    to the soul.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The soul is described as beholding presentations like objects seen in a mirror,
    thereby having knowledge of the external world.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Unmanifested or Avyakta is identified as primordial matter and as the
    primal source of material existences.
  category: attribute
  evidence_refs:
  - ev:10
