canonical_text:
  quote: ''
  summary: The passage explains Kapila's Sankhya as granting limited assent to Vedas
    and tradition while assigning emancipating power to philosophical knowledge. It
    presents Prakriti as the undeveloped, eternal source of material forms, compares
    this idea with Greek and modern philosophical accounts of primeval substance or
    will, and outlines the sequence by which disturbed Nature produces intellect,
    egoism, mind, senses, action-organs, and subtle elements for the soul's discriminating
    knowledge and release from matter.
  language: English
  quote_policy: summarized
