canonical_text:
  quote: ''
  summary: The passage explains that supreme knowledge frees the soul from dependence
    on Nature or matter. Nature acts for the soul’s purposes, but when those purposes
    are fulfilled, Nature ceases to act; the body may continue briefly like a potter’s
    wheel moved by a previous impulse, after which the soul attains complete and eternal
    isolation from matter. The closing distichs describe the doctrine as knowledge
    concerning the origin, production, and dissolution of beings, taught by Kapila
    to Asuri, then to Panchasikha, and later summarized by Iswara Krishna.
  language: English
  quote_policy: summarized
