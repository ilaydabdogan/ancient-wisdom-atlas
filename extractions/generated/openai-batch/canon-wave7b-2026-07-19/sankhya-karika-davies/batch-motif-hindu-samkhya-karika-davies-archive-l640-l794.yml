  quote: ''
  summary: The passage explains Kapila’s critique of the Vedic sacrificial system
    and presents the Sankhya account of final blessedness through discriminating philosophical
    knowledge. It summarizes an ontology of Prakriti, manifested matter, Intellect,
    Egoism or Consciousness, and the independent Soul, with several comparative philosophical
    notes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kapila judges the Vedic system to be not perfectly efficient, citing impurity
    through sacrifice, connection with destruction and renewal, and inequality caused
    by costly rites.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that animal blood is shed in sacrifice and that the Aswamedha
    could involve more than a hundred horses at one time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Brahmans are said to claim that the horse-sacrifice can expiate even the
    murder of a Brahman and confer supernatural power.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Vedas are said to teach that there is no return to bodily life for one
    who has attained the state of Brahmi, while Kapila’s school reserves blessedness
    for those who gain discriminating knowledge of soul and matter in the heaven of
    Brahma.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The final blessedness of the soul is described as absolute self-existence
    and is said not to be gained by religious rites but only by philosophical knowledge.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Kapila’s philosophy is described as treating existence in three forms: manifested
    matter, unmanifested or primal matter, and the knowing Soul.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nature or Prakriti is described as the unproduced root of material forms;
    Soul is described as neither producing nor produced.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Prakriti is described as eternal and self-existing, and all things except
    Soul are said to emanate from it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Intellect or Buddhi proceeds from Prakriti and is described as a subtle material
