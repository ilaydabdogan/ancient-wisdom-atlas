canonical_text:
  quote: ''
  summary: The note compares Kapila/Samkhya, Hartmann, Vedantist Brahma, and Renan
    on the extinction or absorption of individual conscious existence into an unconscious
    or single cosmic principle. It describes the soul freed from matter, developed
    existence absorbed into Prakriti, all life absorbed in Brahma, and Renan’s imagined
    single organized being or living universe, using images of suns, a burning throat,
    river/torrent/ocean imagery, and the earth crushed like a clod.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the system attributed to Kapila, calm eternal repose is gained by the soul
    when freed from contact with matter, while formal or developed existence is absorbed
    into formless unconscious Prakriti.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Hartmann is said to assert a true Nirvana: the extinction of conscious personal
    life as a final goal sought by the wise.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Hindi and German philosophers are described as denying hope for the world
    through amendment; the passage states that the sufficient cure for its woes is
    annihilation of individual life and universal destruction of the present order.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The unconscious that reabsorbs all existence is compared to the supreme Brahma,
    described as the efficient and material cause of created things.
  category: relationship
  evidence_refs:
