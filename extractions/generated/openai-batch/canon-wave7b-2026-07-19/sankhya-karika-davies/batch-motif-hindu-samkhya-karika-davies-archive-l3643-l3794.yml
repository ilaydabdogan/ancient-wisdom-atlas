  summary: The passage describes a ranked set of regions or heavens, possible degradation
    of the soul through vice, and final deliverance only through knowledge that Soul
    is distinct from Matter. It explains bondage as the soul's union with matter,
    discusses suppression of passion and supernatural power, and then presents classifications
    of intellectual states such as obstruction, incapacity, acquiescence, and perfection.
