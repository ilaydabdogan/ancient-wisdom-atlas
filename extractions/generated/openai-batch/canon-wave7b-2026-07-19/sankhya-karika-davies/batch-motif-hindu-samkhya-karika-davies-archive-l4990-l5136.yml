  quote: Knowledge is the only ark by which it can attain to its final position of
    pure abstraction
  summary: 'The passage explains Davies''s account of Kapila''s Sāṃkhya: the soul
    is unaffected by virtue and vice, which belong to the material/spiritual body
    and the modes of Nature; the system rejects absolute duty, guilt, a ruling Providence,
    and prayer; knowledge alone enables deliverance from contact with matter, imaged
    as an ark crossing the restless world''s ocean to a haven of rest.'
  language: English
