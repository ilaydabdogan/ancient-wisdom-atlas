  quote: ''
  summary: The passage discusses Kapila’s doctrine of cause and effect. It argues
    that Kapila posits an uncaused primal material cause, Prakriti, from which existent
    things proceed, while not admitting a supreme spiritual Lord as author or ruler
    of the visible world. It explains cause and effect through examples such as cheese
    requiring milk rather than water, a potter making a jar rather than cloth, and
    oil existing in sesamum seeds before extraction.
