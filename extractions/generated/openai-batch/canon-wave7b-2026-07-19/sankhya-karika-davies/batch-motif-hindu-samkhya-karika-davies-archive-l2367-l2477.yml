  quote: ''
  summary: The passage explains Sankhya dualism between soul and matter, the dependence
    of cognition on intellect and sense-presented objects, the evolution of categories
    from Prakriti, an illustrative blind-man-and-lame-man tale, and liberation through
    knowledge of the twenty-five principles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that soul and matter are absolutely distinct as subject
    and object and can never coalesce or exchange properties.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Knowledge is described as arising through the juxtaposition or synthesis of
    the discerning faculty and the thing discerned.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The soul is said to see only what buddhi presents, and when freed from contact
    with matter it lacks knowledge and self-consciousness.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The commentator says Kapila rejects a supreme personal Deity as established
    by logical inference and says God cannot be known as an object presented in buddhi.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The material universe is said to be evolved by unconscious Prakriti for the
    soul’s use, so the soul may know material things and itself and thereby attain
    liberation from matter.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: An illustrative tale describes a blind man and a lame man meeting in a forest,
    agreeing to help one another, and escaping the jungle when the blind man carries
    the lame man.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage explicitly identifies Nature or Prakriti with the blind man because
    it cannot see, and identifies the soul with the lame man because it cannot act.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'Distich 22 gives an emanation sequence: Nature produces the great principle
    or intellect, intellect produces Ego or Consciousness, Consciousness produces
    the sixteen principles, and five of those produce the five gross elements.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The tabular list includes Prakriti, Mahat or Buddhi, Ahankara, five subtle
    elements, five gross elements, five senses, five organs of action, Manas, and
    the soul.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: One who thoroughly understands the twenty-five categories is said to attain
    the highest state in this life and, after laying aside the body in death, to know
    birth no more.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says that a knower of the twenty-five principles is free regardless
