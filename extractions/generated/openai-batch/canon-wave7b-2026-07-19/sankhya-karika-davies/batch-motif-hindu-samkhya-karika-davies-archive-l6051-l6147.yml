  summary: The notes compare Spinoza’s philosophy with Vedantic, Sankhya, Patanjalian,
    and Bhagavad Gita doctrines. The passage discusses knowledge, mind-body identity,
    maya, the dual nature of the Supreme Being, cosmic manifestation and dissolution,
    gradations of being, fatalism, yoga as absorption into the divine, and alleged
    ethical consequences in Spinoza and Hindu systems.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Spinoza taught several sources of ideas, including bodily
    senses, imagination, reason, and intuition, and states that error arises from
    confused and imperfect sensory knowledge.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that mind and body are treated as one thing considered
    under different attributes in Spinoza’s system.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage compares a material world that is only a visible aspect or mode
    of divine extension with the Vedantist doctrine of maya, described as formal material
    existence being an illusive manifestation of the One Supreme Spirit.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage explicitly says Kapila’s system is not the same as Spinoza’s,
    but says Spinoza’s exposition of God and Nature closely resembles the theistic
    Sankhya associated with Patanjali and especially the Bhagavad Gita.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the described Bhagavad Gita doctrine, the One Supreme Being has a higher
    spiritual nature and a lower nature corresponding to Prakriti.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The world of existing things is described as a manifestation of the Supreme
    Spirit in the lower attribute, and as dissolving again into an all-containing
    self at the end of a kalpa.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage describes a gradation of being from the highest or sole being
    down to inanimate matter, including buddhi or intellect.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Both the Hindu and German philosophers are said to teach that mind or soul
    knows itself only through sense-perceptions originating in the bodily organs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says Spinoza’s fatalism is also maintained by his Hindu predecessor,
    and describes the universe as a vast machine caused to revolve by the action of
    the One Being.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says that in Patanjali’s system the highest good is obtained by
    absorption into the divine essence by yoga, described as union or blending of
    the human with the divine in this life through constant meditation.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says the deity has no concern with human actions and that the
