canonical_text:
  quote: ''
  summary: The passage explains Kapila's account of mind, consciousness, intellect,
    soul, and Nature in relation to cognition, action, and cosmological development.
    It compares these ideas with Wundt, Hegel, Schelling, and Fichte, emphasizing
    that soul is distinct and inactive while Nature is an eternal source of developed
    forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage compares Kapila's account of the formation of ideas and resulting
    action with Wundt's sequence from sense organ to brain, consciousness, attention,
    will, and motor transmission.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the described Kapila system, manas, consciousness, and buddhi are treated
    as forms of developed matter, and buddhi is said to have no proper cognition of
    its own.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage explains apparent agency of the soul and apparent intelligence
    of buddhi through influence or proximity between soul and buddhi.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Manas is classed with the organs of sense and action; the organs, manas, and
    five subtle elements are said to spring directly from consciousness, and the gross
    elements are formed from the subtle elements.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says that, in Kapila's system, the subjective element is genetic
