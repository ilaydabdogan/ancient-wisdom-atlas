- id: obs:7
  text: The aim of the Yogi or devotee is described as destroying all movement and
    all thought so that the soul may be absorbed in passive meditation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: For those unable to reach this elevation, the passage describes severe ascetic
