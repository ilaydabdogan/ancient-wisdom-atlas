canonical_text:
  quote: ''
  summary: The passage describes Patanjali as a later modifier of Kapila’s Sankhya
    system, introducing a Supreme Spirit and yogic meditation aimed at Nirvana or
    absorption into the Divine Essence. It summarizes Patanjali’s account of God,
    contrasts it with Kapila’s dependence on Consciousness and Buddhi, lists the means
    of attaining Yoga, and describes the Yogi’s ascetic practices, mystical syllable
    OM, incorporeal or spiritual states, claimed supernatural powers, and later popular
    association with sorcery and self-torture.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Patanjali is described as having supplemented Kapila’s system and as reputed
    author of the Yoga Sitra, where a theistic modification of Kapila’s system is
    expounded.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage identifies two main Patanjalian modifications: a Supreme Spirit
    presiding over Nature, and yoga as concentration of the soul on the Supreme Being
    by abstract meditation to obtain Nirvana or absorption into the Divine Essence.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage distinguishes Patanjali’s system as theistical Sankhya and Kapila’s
    as atheistical Sankhya, and states that Buddhism apparently owed its origin to
    Kapila’s system.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: God or Iswara is described as a soul or spirit distinct from other souls,
    unaffected by ills, unconnected with good or bad deeds and their consequences,
    absolutely omniscient, instructor of earliest beings, infinite, and unlimited
    by time.
  category: attribute
  evidence_refs:
  - ev:4
