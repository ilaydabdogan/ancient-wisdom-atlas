  summary: The passage is a philosophical note on the meanings of sat and asat in
    Hindu thought, contrasting common interpretations of entity and nonentity with
    Kapila's usage. It cites Vedic, Upanishadic, and Brahmana passages in which entity
    arises from nonentity, both are contained in Skambha, Agni is described as both
    asat and sat, and primordial mind is said to be neither entity nor nonentity.
    It also notes a Vedantic account of primal matter as divine productive energy
    dependent on the Supreme Deity.
