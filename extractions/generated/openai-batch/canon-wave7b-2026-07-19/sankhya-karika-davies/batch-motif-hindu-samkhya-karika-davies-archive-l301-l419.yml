canonical_text:
  quote: ''
  summary: The passage recounts a Purana-linked episode in which a Rakshasa steals
    a sacrificial horse and searchers accuse Kapila, who destroys them. It then characterizes
    Kapila’s Sankhya system as non-theistic, opposed to Vedic ritual as a means of
    soul-deliverance, centered on philosophical knowledge, reasoning, discrimination
    between spirit and matter, Prakriti, Gunas, and the twenty-four principles. It
    also compares Sankhya’s displacement of rites by knowledge and meditation with
    the system of Gautama Buddha and discusses later treatises and commentators.
  language: English
  quote_policy: summarized
