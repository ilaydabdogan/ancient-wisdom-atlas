canonical_text:
  quote: "“As a dancer, having exhibited herself on the stage ceases to dance, so
    does Nature (Prakriti) cease ... when she has made herself manifest to soul.”"
  summary: The passage explains Sankhya liberation as the soul’s release from pain-causing
    contact with matter and the subtle vehicle. Nature’s development exists for the
    deliverance of individual souls, illustrated by milk nourishing a calf and by
    a dancer who stops after being seen. Nature is described as generous and modest,
    benefiting Soul without return, while bondage, liberation, and migration are attributed
    to Nature rather than to Soul.
  language: English
  quote_policy: quoted
