canonical_text:
  quote: ''
  summary: A supplementary note explains Kapila's account of Intellect, Consciousness,
    the sensory and action organs, subtle and gross elements, and competing interpretations
    of “specific” and “non-specific” objects or elements. It distinguishes the faculty
    of seeing from the gross eye and compares Kapila's theory of sensation with a
    modern scientific account of sensation as involving mental activity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note is explicitly about the organs of the Soul in the system of Kapila
    and cites Distichs 22, 24, 26, and 34.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Intellect is described as the first emanation of Nature and as an organ or
    instrument of the immaterial Soul through which material things are brought into
    the Soul's view.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Consciousness or Mind-stuff is said to emanate from Intellect; when affected
    by the mode called goodness, it gives rise to eleven organs: Mind, five organs
    of sensation, and organs of action.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When Consciousness is affected by the mode called darkness, five subtle elements
    of matter emanate from it, and grosser elements evolve from the subtle elements.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The five organs of sensation are called intellect-organs and are connected
    in the passage with an obscure distinction between specific and non-specific elements
    or objects.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Gaudapada is reported as interpreting non-specific objects as objects apprehended
    by gods, but the note says that such objects would have no place in Kapila's system.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage distinguishes the faculty by which one sees, connected directly
    with Consciousness, from the eye as an instrument made of gross matter; without
    the faculty, the eye could not see, as in a dead body.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The author proposes that intellect-organs include non-specific, subtle forms
    of matter in the faculty of seeing and specific, grosser elements in the physical
    instrument, the eye.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The author of the S. Tattwa Kaumudi is said to interpret non-specific objects
    as objects too subtle for ordinary men to see.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The final paragraph states that Kapila's theory resembles conclusions of modern
    science because sensation is not purely passive but involves mental activity and
    attention.
  category: speech
  evidence_refs:
  - ev:7
