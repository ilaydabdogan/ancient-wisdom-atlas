canonical_text:
  quote: ''
  summary: 'The passage explains Sankhya and Nyaya epistemological terms: perception,
    inference, testimony or revelation, generic existence, non-perception, subtle
    Nature, and causality. It gives logical examples involving smoke, fire, hill or
    mountain, clouds, rain, and swelling rivers, and notes Kapila’s qualified relation
    to Vedic authority.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes the result of seeing from the physical application
    of the eye and describes a theory in which perception involves a ray of light
    proceeding from the eye.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Inference is described through the Nyaya school as knowledge from a logical
    antecedent and is divided into prior, posterior, and analogous or generic forms.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The terms linga and ligi are compared to the major and minor premises of Western
    logic, using the example of smoke indicating fire on a hill or mountain.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Revelation is identified with the Vedas or similarly authoritative works;
    Kapila is said not to have wholly rejected the Vedas but to have subordinated
    their authority to reason.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Formal or generic existence, samanya, is explained as community or genus associated
    with substance, quality, and action.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Things beyond the senses are said to include subtle things and things imperceptible
    by accident, such as fire in a smoking mountain; what is beyond perception and
    inference is said to be knowable only by testimony.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Distich 7 lists multiple reasons for non-perception, including distance, nearness,
    damaged organs, mental inattention, minuteness, concealment, predominance of other
    things, and intermixture with like objects.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Distich 8 says Nature is not apprehended by the senses because of subtlety
    rather than non-existence, and that it is apprehended through its effects, including
    Intellect and other derived principles.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Distich 9 presents a causal argument that existing things are effects, referring
    to cause, material cause, limits on universal production, efficient agency, and
    the nature of cause.
  category: relationship
  evidence_refs:
  - ev:9
