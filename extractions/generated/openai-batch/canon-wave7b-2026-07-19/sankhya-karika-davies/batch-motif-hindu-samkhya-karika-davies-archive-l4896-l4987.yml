canonical_text:
  quote: The soul is a monarch superior to Nature, which ministers to it
  summary: The passage explains Kapila’s psychology as a system in which the soul
    is a passive, isolated knower distinct from Nature. Through knowledge the soul
    is liberated from Nature and pain into an unmoving unconscious self-existence.
    Until liberation, it is connected with a subtle body, the linga Sarira, which
    migrates through bodies, enters the womb, and carries dispositions. The passage
    also compares this system with Von Hartmann’s philosophy and briefly with Buddhist
    nirvana.
  language: English
  quote_policy: quoted
