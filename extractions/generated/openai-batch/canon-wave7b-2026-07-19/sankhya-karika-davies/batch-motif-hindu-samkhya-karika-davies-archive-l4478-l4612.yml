canonical_text:
  quote: The aim of philosophy is simply to free the soul from this and every other
    connection with matter for ever.
  summary: The passage presents Davies’s account of Kapila’s Sankhya as rejecting
    Vedic ritual sacrifice, locating liberation in Sankhya knowledge, describing material
    life as painful bondage, listing three sources of knowledge, explaining causation
    as emanation rather than pure creation, and stating that soul and matter are eternal
    with different final conditions. It also includes comparisons with Bentham, Schopenhauer,
    and Buddhism.
  language: English
  quote_policy: quoted
