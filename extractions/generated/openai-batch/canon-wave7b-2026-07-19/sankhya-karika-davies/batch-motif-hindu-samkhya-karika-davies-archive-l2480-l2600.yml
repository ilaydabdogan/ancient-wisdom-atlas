canonical_text:
  quote: ''
  summary: The passage explains buddhi, or intellect, as a defining faculty that presents
    objects to the soul. It contrasts the inactive, contemplative soul with active
    states assigned to buddhi as an emanation of Nature. It describes the effects
    of the modes of goodness and darkness, distinguishes external and internal knowledge,
    links internal knowledge and dispassion with liberation from matter, lists supernatural
    powers of an abstracted devotee, and introduces egoism as self-consciousness from
    which a double creation proceeds.
  language: English
  quote_policy: summarized
