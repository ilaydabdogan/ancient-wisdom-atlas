  quote: ''
  summary: The passage explains the Sankhya account of Nature as constituted by three
    gunas, the movement from equilibrium into activity for the welfare of soul, analogies
    for the soul's proximity to Nature, the names and qualities of the three gunas,
    and the process by which sensations are presented to soul for discrimination and
    true cognition.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A state of rest or equilibrium is described as having no emanation into separate
    forms of matter until Nature began to act unconsciously for the welfare of soul.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage attributes motion or activity in general to the guna called passion,
    or rajas.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nature is described as one while also being compared to colourless light formed
    by a union of coloured rays whose individuality is undeveloped in light.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The gunas are presented as a hypothesis to account for manifest differences
    in formal existences, with three kinds of element: subtle or spiritual, passion
    or force, and dullness or insensibility.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A cited interpretation says soul has governorship over Nature by proximity,
    compared to a gem or loadstone and iron; by juxtaposition with soul, Nature changes
    into Buddhi, or intellect.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says the cause of soul's proximity to Nature is not explained,
    and says Nature brought soul into bondage by connecting it with matter.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kapila's three gunas are named sattwa, rajas, and tamas, glossed respectively
    as truth or goodness, passion or foulness, and darkness.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sattwa is described as the lighter and subtler formative element of Nature;
    rajas is the exciting element; tamas is described as the grossest element.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says the perfect state is inactive repose and describes action,
