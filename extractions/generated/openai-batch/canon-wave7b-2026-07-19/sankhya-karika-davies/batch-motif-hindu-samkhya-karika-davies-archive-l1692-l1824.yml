  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The gunas or modes are also termed Prakasa, Pravritti, and Moha, associated
    respectively with luminousness in fire, activity in air, and delusion in earth.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Every kind of existence except soul is said to be formed by the gunas, blended
