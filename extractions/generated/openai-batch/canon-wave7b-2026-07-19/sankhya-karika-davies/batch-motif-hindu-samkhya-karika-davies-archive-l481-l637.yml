canonical_text:
  quote: ''
  summary: The passage gives the opening of the Sankhya Karika and commentary. Threefold
    pain gives rise to inquiry into its removal; ordinary visible remedies and revealed
    ritual means are deemed incomplete. The proposed superior means is discriminative
    knowledge of manifested matter, unmanifested Prakriti, and the knowing Soul. The
    commentary explains Kapila's philosophy as aiming at release from suffering through
    separation of soul from matter, lists three kinds of pain, and gives examples
    of divine or supernatural affliction.
  language: English
  quote_policy: summarized
