  quote: ''
  summary: The passage explains Sankhya ideas about the linga or subtle body, its
    relation to the gross body and the soul, and its role in transmigration, after-death
    ascent, hell, personality, and liberation. It states that virtue leads to ascent,
    vice to descent, knowledge to deliverance, and the contrary to bondage; it also
    discusses dispassion, absorption into Nature, and different conditions or states
    of being.
  language: English
