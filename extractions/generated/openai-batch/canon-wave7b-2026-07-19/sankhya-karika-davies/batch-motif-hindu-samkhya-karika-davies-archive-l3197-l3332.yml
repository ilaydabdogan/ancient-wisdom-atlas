canonical_text:
  quote: ''
  summary: The passage comments on Sankhya Karika distichs concerning specific and
    non-specific objects, subtle and gross elements, sensory and mental agencies,
    the relation of intellect to soul, liberation through discriminating knowledge,
    and the distinction between subtle, parental-born, and gross bodies, including
    the migration of the subtle body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports uncertainty about the meanings of “specific” and “non-specific”
    objects and presents Gaudapada’s explanation that specific objects are perceived
    by men while non-specific objects are seen only by gods.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage identifies non-specific objects with subtle elements of matter
    and suggests that organs of sensation have a relation to subtle elements as well
    as gross elements.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Speech is described as referring only to sound, while the other four organs
    of action may be connected with all five kinds of sensation, illustrated by an
    object such as a water-jar.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: All organs are described as affected by the modes or constituents of Nature
    and as capable of causing pleasure, pain, and insensibility.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Vachaspati describes a sequence in which external organs provide ideas to
    manas, manas transfers them to consciousness, consciousness delivers them to intellect,
    and intellect serves the soul.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The intellect is described as the soul’s chief officer and direct agent, presenting
    what it receives to the gaze of the soul as in a mirror.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that discriminating knowledge between matter and the self
    frees the soul from contact with matter and leads to final liberation.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Distich 38 says that five gross elements proceed from five non-specific subtle
    elements and that the gross elements are tranquil, violent, and stupefying.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage explains that subtle elements are treated as having one nature
    and one effect, while gross elements may have various effects and change through
    commingling.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Distichs 39 and 40 distinguish subtle bodies, bodies born of father and mother,
    and gross forms of existence; the subtle body is described as permanent and migrating,
    while bodies born of father and mother perish.
  category: sequence
  evidence_refs:
  - ev:8
