- id: obs:1
  text: The passage states that creative action by the Supreme Deity would be inconceivable
    without Sakti.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage presents developed Vedantist doctrine as treating the external
    world as maya or illusion, with the Supreme Spirit as the All and Nature as a
    projection or manifestation of the One.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage summarizes Hegelian language about the Absolute or God as a process
    of thought manifesting through nature, logic, and universal spirit, and calls
    this 'Pure Vedantism.'
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The passage states that Kapila was not a Vedantist and treated sat, asat or
    formless Prakriti, Soul, and Prakriti as objectively real, eternal, uncaused,
    and distinct in relevant ways.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage reports an interpretation of asat as an undeveloped state and
    sat as a developed state or the existing world.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says a Vedic hymn is interpreted as meaning that Agni was asat
    and became sat in the birth of Daksha and in the womb of Aditi, and it notes that
    Agni is called guardian of present being.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage cites Rig-Veda x.129 as saying there was neither asat nor sat,
    only one Supreme Spirit in self-existence; desire then arose as the earliest germ
    of mind, and wise men beheld the bond between asat and sat in their heart.
  category: sequence
  evidence_refs:
  - ev:7
