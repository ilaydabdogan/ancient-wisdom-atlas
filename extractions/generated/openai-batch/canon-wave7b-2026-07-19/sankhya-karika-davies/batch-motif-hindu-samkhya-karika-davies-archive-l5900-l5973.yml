canonical_text:
  quote: ''
  summary: A scholarly note contrasts Vedantist and Sankhya/Kapila accounts of ultimate
    reality, nature, soul, sat and asat. It compares Vedantist ideas with Hegelian
    philosophy, interprets Vedic uses of asat and sat, cites Agni, Daksha, Aditi,
    and Rig-Veda x.129, and relates Vedic desire to Kapila's account of Prakriti's
    impulse toward emanation and liberation of soul.
  language: English
  quote_policy: summarized
