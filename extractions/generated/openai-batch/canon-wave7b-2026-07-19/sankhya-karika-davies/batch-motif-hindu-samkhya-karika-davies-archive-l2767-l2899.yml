canonical_text:
  quote: The manas then is the first agent between the outer world and the soul
  summary: The passage explains manas as a formative internal organ in Kapila's Sankhya
    system. It collects and shapes sensory impressions, is distinguished from soul
    and Western notions of mind, is treated as subtle matter from Prakriti, and is
    coordinated with the senses and buddhi in producing perception. Distichs 29-30
    summarize distinct and combined functions of internal organs and organs of sense.
  language: English
  quote_policy: quoted
