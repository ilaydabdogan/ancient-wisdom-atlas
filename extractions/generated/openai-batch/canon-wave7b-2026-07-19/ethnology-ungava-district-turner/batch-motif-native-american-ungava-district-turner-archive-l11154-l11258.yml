canonical_text:
  quote: ''
  summary: The passage first continues a tale in which a man’s wife and children are
    killed by a brother or uncle figure, the wife instructs her husband to preserve
    her right hand and arm skin, the bodies are treated as beavers, and a forced eating
    of female beaver flesh is followed by a river gushing from a man’s side and his
    being seen swimming beside his beaver-wife. The passage then begins a tale of
    an orphaned hare who catches many fish for his grandmother, goes to obtain fire
    from Indians across a river, commands whales to form a crossing, and is taken
    by Indian children to a kettle with a bright fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The father sees water going from the house and warns the children that their
    uncle is coming and will kill them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The attacking man pounds the mud walls, and after the children go out he quickly
    kills the two young ones.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wife tells her husband that, if he wants to see her again, he should keep
    the right hand and arm of her body, remove the skin, and keep it with him; she
    then goes out and is killed with a stick.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The brother brings warm clothing to the husband and notices hairs that have
    grown on the husband's back.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The brother carries the bodies of the children and mother back; at the home
    of their people the bodies are called beavers, and the husband asks for the right
    hand and arm of the beaver who had been his wife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Three nights later many beavers are killed and boiled; the people force the
    runaway brother to eat flesh after he says he will not eat it if it is female
    beaver flesh.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the second piece of beaver flesh is swallowed, a large river gushes
    from his side; he jumps into it, and others see him swimming beside his wife,
    who had been a beaver.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A hare who has lost his parents lives with his grandmother; because they are
    poor and hungry, he asks to set a net to catch fish.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The hare catches a net full of fish, brings fish home, and says he will go
    across the river to the Indians' tent to get fire for cooking.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At a river too wide to jump, the hare summons whales and orders them to lie
    side by side across the stream so he can walk over their backs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After crossing, the hare lies in the sand; Indian children find him, one carries
    him home, and he is directed to be put in the iron tent or kettle where a bright
    fire is burning.
  category: sequence
  evidence_refs:
  - ev:7
