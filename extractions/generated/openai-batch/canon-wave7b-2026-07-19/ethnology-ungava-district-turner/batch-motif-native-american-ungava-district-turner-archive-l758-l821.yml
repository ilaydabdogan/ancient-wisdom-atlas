canonical_text:
  quote: ''
  summary: The passage gives a geographic and navigational description of waterways
    in the Ungava District, including tides at Fort Chimo, tributaries of the Koksoak
    River, the Larch and Leaf rivers, Ungava Bay, Akpatok Island, currents, whirlpools,
    and ice hazards in Hudson Strait. It includes one ethnographic note about Little
    Whale River Indians using a Larch River route to join Naskopies of the Koksoak
    valley.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Fort Chimo, the tide is described as rising as much as 31 feet, with backwater
    reaching the upper rapids and, during a high June rise, extending about 3 miles
    beyond them.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Koksoak River is described as having few and unimportant branches, with
    the Larch River identified as the larger tributary and characterized as rapid,
    mostly shallow, variable in depth, and almost unnavigable.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The southwest fork of the Larch River is described as small, scarcely capable
    of ascent, and descendable only with caution; it is the course followed by Little
    Whale River Indians when traversing the country to join the Naskopies of the Koksoak
    valley.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Leaf River enters a bay called Tass‘iyak, glossed as “like a lake,” and
    is said to flow from a long, narrow lake draining much of a swampy tract near
    latitude 58° 30’.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The southwestern part of the swampy tract is described as an area of innumerable
    small lakes connected by short watercourses, making it difficult to tell whether
    water or land predominates.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ungava Bay is described as a pocket-shaped body of water south of Hudson Strait,
    with central depths estimated from 28 to 70 fathoms and a bottom formed by washings
    from freshwater streams.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Extreme tides in Hudson Strait are said to produce violent currents in Ungava
    Bay, including a considerable whirlpool opposite Leaf River Bay that is safe at
    high water but very dangerous at half-tide.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Akpatok Island is described as positioned to break much of the current along
    the south side of the middle of the strait while increasing currents at either
    end; it is about 100 miles long and averages 18 miles wide.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Navigation in Hudson Strait is described as dangerous because of strong tides
    and persistent ice; after August and September, anchorages may freeze in a single
    night.
  category: setting
  evidence_refs:
  - ev:7
