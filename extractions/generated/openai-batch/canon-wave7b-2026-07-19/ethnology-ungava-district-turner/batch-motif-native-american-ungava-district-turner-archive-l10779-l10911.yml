canonical_text:
  quote: ''
  summary: A rabbit leaves a frog in a tent while seeking food, sees smoke, and runs
    home frightened. The frog says the smoke comes from beavers, directs the rabbit
    to carry him and prepare a beaver hunt, then loosens the weir so the beavers escape.
    The rabbit shoves the frog under the ice, thinking he has drowned him, but the
    frog survives underwater, kills the beavers, and brings them home. The frog asks
    for fire; the rabbit first throws out dead coal, then brings him inside. The rabbit
    eats all the beavers. Later the rabbit again sees smoke, is frightened, and the
    frog says this smoke is deer; the rabbit carries the frog toward them after making
    a snowshoe for one of the frog’s feet.
  language: English
  quote_policy: summarized
