canonical_text:
  quote: ''
  summary: 'The passage describes practical methods for preparing deer and other animal
    skins for clothing, buckskin, and parchment: allowing skins to decompose enough
    to loosen hair, scraping hair and flesh with bone or metal-edged tools, using
    stakes and sticks as supports, applying tanning materials, softening the skins,
    absorbing excess oil, and treating parchment with fat before drying.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Deer skins intended for buckskin and parchment are laid aside in a heap before
    further processing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After several days in the heap, decomposition loosens the hair so that it
    can be pulled out readily.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A pelt ready for scraping is thrown over a round wooden stick, with one end
    on the ground and the other pressed against the abdomen of the woman doing the
    work.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hair-scraping tool is made from the radius of a deer and is shaped like
    a spoke shave with handles at the ends.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The bone scraping edge pushes or pulls out the hairs without cutting the skin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The flesh side of the pelt is worked to remove flesh, blood, and moisture,
    and the work must be done rapidly if many skins are present to prevent excessive
    decomposition and putrefaction.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When hunters kill many deer, some skins may remain unattended and be wasted.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Dried skins with adherent flesh, fat, and ligaments are moistened before scraping;
    fur-bearing and clothing skins are scraped to prevent fat from soiling the hairs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A second skin-cleaning tool is made from the reindeer tibia and shaped with
    a serrated chisel-like edge; some examples use a metal blade and wooden handle
    with a thong loop.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: To use the tibia tool, the skin is placed flesh side up over a stake, and
    a kneeling person strikes the tool while lifting an edge of the skin by hand.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The striking action separates subcutaneous tissue, which is later washed,
    dried, and used as coverings for bundles of dried meat and other articles.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The tanning material consists of putrefying brain, liver, and fat; the passage
    also states that skins are sometimes soaked in wine.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The tanning material is rubbed onto the flesh side, later scraped off, and
    the skin is rubbed and scraped until pliable.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Powdered chalk, clay, calcined bone, or flour may be rubbed over an oily skin
    to absorb remaining fat.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: Skins intended for parchment are rubbed with fat and dried, resulting in a
    yellowish or pale glue color.
  category: sequence
  evidence_refs:
  - ev:8
