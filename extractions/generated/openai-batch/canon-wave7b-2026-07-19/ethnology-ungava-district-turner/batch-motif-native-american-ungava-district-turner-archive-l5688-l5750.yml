canonical_text:
  quote: ''
  summary: 'The passage describes amusements among the Hudson Bay Eskimo/Ungava Inuit
    as represented by Turner: attachment to the frozen coastal homeland, games during
    intervals between hunts, football, wrestling rules and contests with Indians,
    stone throwing, card gambling learned from white people, a hidden-object guessing
    game among girls, and a cup-and-ball-like ivory game implement.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people are described as living on frozen sea shores, being reluctant to
    leave their birthplace, and longing to return when absent.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: During intervals between hunts, when food is still plentiful, they divert
    themselves with games and adopt outdoor games.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Football is described as involving people across ages, from an aged mother
    to a very young child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Men wrestle by removing extra garments, seizing each other around the waist,
    locking hands, spreading feet, trying to bend the opponent backward, and throwing
    him onto his back so the head touches the ground.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tripping with the feet is not allowed in wrestling and would cause witnesses
    to stop the struggle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Eskimo and Indians engage in comparative wrestling tests of strength, and
    the passage states that the Eskimo prove the better men in these contests.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Younger men throw stones at a mark, and some are described as highly dexterous.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When playing-cards are available, people play games learned from white people,
    teach them to each other, and lay small stakes on the result.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Women are described as showing a stronger passion for gambling than men and
