- id: obs:1
  text: A wet skin covering is cut, pierced along the edges, lashed with thongs, stretched
    over the boat frame, fastened, and dried with the boat keel-up.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the skin covering is properly cut and stretched, the dried boat covering
    is said to sound like a drum when struck.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: In shallow water the skin of the boat may be cut by contact with rocks, and
    rents are patched with pieces of skin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: During winter months the umiak is placed on staging of posts to protect it
    from mice and other animals.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Large families, or multiple families, may make lengthy journeys in umiaks,
