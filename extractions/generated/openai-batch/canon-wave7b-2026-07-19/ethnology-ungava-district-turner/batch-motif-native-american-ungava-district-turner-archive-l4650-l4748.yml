canonical_text:
  quote: ''
  summary: The passage describes construction and use of skin-covered boats, including
    fitting and stretching the skin over a frame, repairing and winter-storing the
    umiak, family travel by boat with towing by people or dogs, the form and equipment
    of the Hudson Strait kaiak, seasonal use of the kaiak, an anecdote about a woman
    seeing a wolf damage a kaiak at a distance, and details of a spear for white whales
    and large seals.
  language: English
  quote_policy: summarized
