literal_observations:
- id: obs:1
  text: A canoe is carried overland by a porter using a forehead attachment and side
    thongs that prevent it from slipping from the shoulders.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The portage route may be narrow, wooded, uneven, and rough; the porter may
    make long detours while others in the party take a shorter route to where the
    canoe will be put back into water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Canoe-trip repair equipment includes pieces of bark, root threads, and gum
    for damage from contact with stones or snags.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The birch-bark canoe is described as highly necessary for obtaining a living,
    more necessary than the sled and nearly as useful as the snowshoe.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Canoe paddles are described by length, blade size, knobbed handle, and a special
    flattened-spoon form used for applying gum and grease to canoe seams.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Heated gum or wax is poured along seams or used with a bark patch; a fire
    may be made to heat the wax, and additional coating is applied after cooling.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Large sleds called ta-bas-kin, glossed as equivalent to the name toboggan,
    are used for carrying loads over snow.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The sleds vary greatly in size according to their intended use.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Toboggan construction involves selecting a relatively knot-free tree, making
    thin boards, shaving them with a crooked knife, heating the front end until flexible,
    bending it upward, and fastening transverse bars with deerskin thongs and sinew.
  category: sequence
  evidence_refs:
  - ev:6
