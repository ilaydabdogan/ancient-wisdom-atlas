canonical_text:
  quote: ''
  summary: A wolverene stays with wolves who make fire by jumping over brush. He greedily
    eats fat and becomes ill. When he asks to return to his starving family, the wolves
    load a very long sled with meat and give him a temporary-looking fire-making ability
    with the instruction not to look back at the sled. On the journey he succeeds
    at making fire by jumping over brush, later fails after throwing away his flint
    and steel, retrieves them, then looks at the sled, cannot move it, and reduces
    the load to carry food home.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The wolverene rests, watches for returning hunters, and is sent by the wolves
    to gather dry brush while they gather green branches for the tent floor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wolves place stripped deer fat around the inside edges of the tent, put
    down brush, and the leader jumps over it, after which a bright fire starts.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wolves go outside to see what the wolverene will do when left alone with
    the fat; he selects a large piece and tries to swallow it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wolves address the wolverene as brother and ask about holes in the tent
    cover while his mouth is full of fat.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After eating frozen fat and then hot food, the wolverene becomes violently
    ill, vomits for a long time, and shivers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: One wolf offers its bushy tail as a covering; the wolverene rejects it, and
    the wolf gives him a soft skin blanket.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The wolverene says he intends to return to his family because he believes
    they may soon die from hunger.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The wolves prepare a very large, long sledload of meat for the wolverene to
    take home.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: When the wolverene asks for fire, a wolf asks how many nights the homeward
    journey will take; after the answer of three nights, the wolf jumps over the wolverene's
    body three times and instructs him not to look back at the sled.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: On the journey, the wolverene arranges dry brush as he saw the wolves do,
    jumps over it, and produces a large blaze; he melts snow for water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: After becoming confident in the fire-making ability, the wolverene throws
    away his flint and steel, but later fails repeatedly to make fire by jumping over
    a large pile of fuel.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The wolverene retrieves his flint and steel and uses them to start a fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The wolverene examines the sled, cannot see the far end of the load, cannot
    move it, blames his curiosity, removes some dry meat and fat to carry, and places
    the remainder on a stage.
  category: sequence
  evidence_refs:
  - ev:6
