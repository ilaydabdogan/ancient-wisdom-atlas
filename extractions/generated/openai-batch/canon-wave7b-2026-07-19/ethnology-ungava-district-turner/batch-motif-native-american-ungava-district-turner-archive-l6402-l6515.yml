canonical_text:
  quote: ''
  summary: The passage concludes a story of an abused boy aided by the moon man, enlarged
    by beatings, and made strong enough to avenge himself before returning to normal
    size and marrying the girl who helped him. It then gives accounts of the origins
    of the sun, moon, and stars from a brother-sister pursuit into the sky; auroras
    as spirit torches guiding the dead and communicating with the living; the sky
    as a hard dome with cloud bags carried by two old women; and winds as breath from
    directional spirits. The passage ends with ethnographic notes on the Nenenot or
    Naskopie.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A beaten poor boy grows larger and stronger the more he is beaten, until he
    can handle large rocks as easily as small stones.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The moon man tells the boy he is large enough to care for himself and to do
    as he pleases with the people who treated him badly.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The moon man goes to his hole in the sky, while the boy walks along the beach
    throwing rocks and changing the shoreline.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boy returns in daylight, terrifies the people, kills his former persecutors
    against rocks, and leaves only the girl who had often helped him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The spared girl becomes the boy's wife, and the man named Kou jé yuk returns
    within hours to natural size and lives comfortably.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The tale is attributed to a man from Labrador, located by Eskimo informants
    near Ohak or Okak, and connected with a rock said to look like it still bears
    dried blood and brains.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: In a time of darkness, a girl is nightly visited by an unknown person and
    uses soot mixed with oil to identify him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The girl discovers a black circle of soot around her brother's mouth; after
    parental anger and scolding, the brother flees.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The daughter seizes a firebrand and pursues her brother into the sky; he becomes
    the moon, she becomes the sun, and sparks from the brand become stars.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The sun is said to pursue the moon constantly, while the moon stays in darkness
    to avoid discovery; eclipses are understood as meetings between them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Auroras are described as torches held by spirits who seek the souls of the
    newly dead and lead them over an abyss at the edge of the world.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: A narrow pathway crosses the abyss to a land of brightness and plenty without
    disease or pain, and only the dead and the raven can go there.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: Aurora spirits communicate by whistling; people answer in whispers, call and
    converse with the aurora, and send messages to the dead through these spirits.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The sky is described as a hard dome over the earth, with land and sea edges
    bounded by high sides and a region beyond that is the source of light and heat.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:15
  text: Clouds are described as bags of water controlled by two old women who run
    across the sky; rain comes from escaping water, thunder is their voice, and lightning
    is their torch.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:16
  text: At each corner of the earth dwells a large-headed spirit whose breath produces
    wind, with male spirits assigned to some directions and female spirits to others.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:17
  text: The passage transitions to the Nenenot or Naskopie, explaining that Naskopie
    is a reproach term, while Nenenot is their own name meaning true or ideal red
    men.
  category: other
  evidence_refs:
  - ev:11
