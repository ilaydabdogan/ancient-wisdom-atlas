canonical_text:
  quote: ''
  summary: A wolf wife brings fish to the tent, prepares food, and gives birth to
    a young otter and a young wolf. Wanting deerskins for the children, she prompts
    her otter husband to hunt deer. The otter kills a band of thirty deer without
    a gun, but the wolf secretly retrieves all the carcasses at night. The couple
    skins the deer, places meat on a scaffold, and dries the skins around the tent.
    The passage ends with the wolf again quiet and hanging her head while the otter
    asks what is wrong.
  language: English
  quote_policy: summarized
