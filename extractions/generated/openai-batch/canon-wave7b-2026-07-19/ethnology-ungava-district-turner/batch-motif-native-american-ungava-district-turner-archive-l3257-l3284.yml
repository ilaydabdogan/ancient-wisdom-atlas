- id: obs:4
  text: When a girl reaches puberty, an old woman versed in tattooing takes her to
    a secluded locality and strips her of clothing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The tattooing uses half-charred moss lamp wick mixed with lamp oil; a needle
    pricks the skin, the paste is smeared over the wound, blood mixes with it, and
    a dark-bluish spot remains after a day or two.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The operation continues for four days.
  category: sequence
