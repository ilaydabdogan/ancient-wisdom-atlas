canonical_text:
  quote: ''
  summary: 'The passage describes clothing construction and use: moccasins made from
    selected parts of deerskin, smoked-deerskin mittens with ornament and cold-weather
    linings, summer and spring head coverings, bead headbands made by girls and newly
    married wives for lovers or husbands, and male winter coats made from skins with
    hair inside, sometimes with collars or hoods for protection.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Different parts of the animal skin are described as suitable for different
    parts of moccasins, including tongues, bottoms, tops, and strings.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Moccasins for young children may avoid toe creasing by using a seam parallel
    with the toes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Moccasins used in the tent or dry camp area may have no tops and may be held
    on by a drawstring.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The tongue of a moccasin is described as bearing much of the walking strain
    and as a common place for cloth or bead ornament.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A single deerskin is reported to make five to seven adult pairs of moccasins,
    while an adult may need many pairs because they wear out quickly.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mittens are made of smoked deerskin by folding the skin, cutting the mitten
    shape along the fold, sewing the edges, and forming the thumb from cut and fitted
    pieces.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mittens may be ornamented with red or black cloth, painted lattice-like designs,
    rows or zigzags of beads, pendant bead strands, and tassels.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Cold-weather mittens may be lined with thin fetal reindeer skin, but moisture
