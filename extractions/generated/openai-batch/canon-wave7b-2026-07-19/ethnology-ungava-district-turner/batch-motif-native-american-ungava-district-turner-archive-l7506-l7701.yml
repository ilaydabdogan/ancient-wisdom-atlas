  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Men’s summer head-dress may be a gaudy cotton handkerchief wound like a turban,
    or a simple deerskin thong, used to keep long hair from blowing over the face.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Girls and newly married wives are described as making bead bands for their
    lovers or husbands.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: A deerskin cap may be used in wet weather, and a stiff deerskin visor may
    be worn over the eyes during spring snow glare.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: Some men wear a high conical red-cloth cap ornamented with heavy beadwork
    for display.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: The male winter coat is made of skins with the hair inside and is constructed
