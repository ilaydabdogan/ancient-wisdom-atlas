  summary: The passage contains the end of an otter-husband episode, a tale in which
    bear cubs discover their mother has lied about summer and a devil kills her, a
    tale in which a hungry wolverene deceives and kills a bear by pretending to be
    her brother and offering eye-healing in a sweat house, and the opening of a rabbit-and-frog
