  summary: Ethnographic description of Koksoagmyut and Hudson Bay Eskimo implements.
    Older stone and ivory tools are described as mostly replaced by trader-supplied
    iron and steel, while ivory or horn tools remain useful for specific tasks. The
    passage describes snow knives, a back-scratcher, ivory needle cases, sealskin
    needle cushions, thimbles, and sewing bags.
