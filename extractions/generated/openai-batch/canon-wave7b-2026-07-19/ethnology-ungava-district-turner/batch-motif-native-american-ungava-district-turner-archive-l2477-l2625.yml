canonical_text:
  quote: ''
  summary: The passage gives an origin legend for Tung ak, in which a bereaved father
    becomes a harmful spirit after the death of his son and daughter. It then describes
    Tung ak as causing obstacles, illness, famine, disease, and death; explains how
    a person becomes an Angekok or shaman through fasting, isolation, and an ordeal
    involving Tung ak; and describes shamanic healing, payment, excuses for failed
    cures, penances, animal mutilations, weather lore, hunting charms, and attracting
    game.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A father loves his son and daughter, but both children become ill and die
    despite his care.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the children's death, the father becomes a vicious spirit who roams
    the world to destroy people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tung ak visits people of all ages, places obstacles in their way, provokes
    them, and causes them to become ill and die.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tung ak no longer recognizes his own children and imagines all people he meets
    to be his children.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Famine, disease, and death are described as being sent out to search for Tung
    ak's lost children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: People discover that fasting, abstaining from contact, and withdrawing to
    a lonely spot can give supernatural powers and knowledge of Tung ak's secrets.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The would-be Angekok fears being seized by the evil visitor and asks to be
    spared and given power to relieve his people from misfortune.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tung ak takes pity on the candidate and gives him the secret of preserving
    life or driving out the evil that causes death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The newly made Angekok returns to the people, tells what he has seen and done,
    and later demands compensation for his services.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: During healing, the shaman is blindfolded or covered, the patient lies before
    him, and the shaman enters frenzy, prostrates himself on the patient, and chases
    the evil from its seat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The patient may receive hard blows and jerks while the shaman makes loud noises
    and pursues the evil as it moves through the body.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: If the patient recovers, the shaman's reputation increases; if the patient
    dies, the shaman attributes failure to an interfering event or spirit.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: A person under the shaman's displeasure may undergo punishment or penance,
    including wearing a dog harness.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: A living dog's tail may be cut so that fresh blood can be cast on the ground
    for the spirit who caused harm.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Shamans are consulted for important undertakings, weather knowledge, hunting
    charms, and attracting deer or other game.
  category: action
  evidence_refs:
  - ev:10
