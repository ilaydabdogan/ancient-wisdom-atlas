canonical_text:
  quote: ''
  summary: The passage describes a cavern-dwelling spirit who controls reindeer and
    deer spirits, shamanic mediation for game abundance, taboos and ceremonies around
    the first deer or important animal killed, and several kinds of amulets used for
    protection, remembrance, success, naming relationships, and healing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A great spirit is said to control the reindeer, dwell in a huge cavern near
    the end of Cape Chidley, and obtain and control the spirit of every deer that
    is slain or dies.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Future supplies of deer for the people are said to depend on the goodwill
    of this spirit.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The form of the spirit is described as a huge white bear.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The shaman is described as able to prevail upon the spirit to send deer to
    people suffering from want of food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The shaman acts as mediator and tells the spirit that the people have not
    offended him, that past food was all eaten, and that unborn young deer were not
    fed to dogs.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: After much incantation, the shaman announces that the spirit will supply deer
    spirits in material form and that abundance will soon be in the land.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The people are instructed to slay deer to obtain the spirit's approval and
    to refrain from feeding dogs with unborn young so that deer spirits will return
    to the guardian's care.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: For the first deer killed, some parts must be eaten raw, some discarded, and
    some eaten cooked.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Dogs must not taste the first deer's flesh and may gnaw leg bones only after
    abundance has been obtained.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: If dogs get at the meat, part of the offending dog's tail is cut off or its
    ear is cropped to allow blood to flow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: Ceremonies are said to attend the capture of the first slain animal of the
    more important kinds.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The passage says amulets are universally used and that some charms are worn
    to ward off attacks of evil-disposed spirits.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: Some charms are worn as remembrances of deceased relatives and take the form
    of a headless doll hanging from the upper garment.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: People with personal names derived from natural objects may wear an image
    or portion of that object, such as a bird wing or animal skin, to gratify the
    object's spirit.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: Strange or previously unseen objects are sometimes considered to bring success
    to the finder.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:16
  text: Two collected examples of amulets are a small wooden model of a kaiak and
    a small block of wood carved into four human heads.
  category: object
  evidence_refs:
  - ev:7
- id: obs:17
  text: The four carved human heads represent four famous conjurers noted for driving
    away diseases.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:18
  text: A woman with rheumatism wore the four-head charm and stated that the pain
    always disappeared within a few hours when she wore it.
  category: speech
  evidence_refs:
  - ev:8
