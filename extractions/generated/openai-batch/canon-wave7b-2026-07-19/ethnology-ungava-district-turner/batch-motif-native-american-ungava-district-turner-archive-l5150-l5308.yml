    the bow and arrow.
  summary: 'Ethnographic passage describing Hudson Bay Eskimo hunting equipment: firearms
    replacing the bow and arrow; a similar East Main Innuit bow with sinew backing;
    several arrow types for different game; bow-drawing technique; a bow case and
    quiver; a short-head spear for whales and seals; and a sealskin float or ava tuk.'
