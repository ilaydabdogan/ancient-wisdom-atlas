canonical_text:
  quote: ''
  summary: 'The passage describes miscellaneous implements used by the Nenenot/Neneno
    and neighboring groups: a curved knife used for woodworking, awls, snow shovels,
    an ice-scoop, ice-picks, combs and hair boards, swimming boards, and a fish-hook.
    It emphasizes materials, construction, practical uses, and one explicit cross-group
    comparison of the crooked knife among Indians and Eskimo.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The crooked knife is made from steel files or knife blades, ground smooth
    on one side, edged on the other, heated, bent to a desired curve, and set in a
    curved handle.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The crooked knife is drawn toward the user and used for whittling or shaving
    wood, including strips and slats for canoes, paddles, snowshoes, and other wooden
    objects.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the crooked knife is used among both Indians and Eskimo
    and is one of the few implements the two groups have in common.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Awls are made of steel or iron, often from a pocketknife spring or small file,
    and are used to pierce holes in woods used in manufacture.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Wooden snow shovels are used to clear paths from tent doors and to bank snow
    around tents as protection against wind.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A special snow-shovel form is used to clean ice from fishing holes and may
    have a blade made from reindeer antler or horn palm attached to a wooden handle
    with thongs.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Older ice-picks were made of reindeer horn or bone attached to wooden staffs;
    later ones substitute iron or steel for the horn or bone.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Combs are purchased from traders, kept in small birchbark bags, and cleaned
    with a porcupine tail from which spines have been removed.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: After a woman’s hair is combed, half is collected on each side of the head
