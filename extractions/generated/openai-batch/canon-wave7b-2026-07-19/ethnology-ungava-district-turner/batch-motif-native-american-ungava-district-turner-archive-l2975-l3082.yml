canonical_text:
  quote: ''
  summary: 'The passage describes an annual outdoor routine in the Ungava District:
    spring ice breakup and household movement, coastal hunting and egg gathering,
    summer white-whale and salmon work, autumn reindeer hunting and ice hazards, winter
    settlement in snow houses, trapping, trading, and hauling wood with dog teams.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The account presents an annual routine beginning with spring breakup of the
    Koksoak River ice, affected by bay ice, wind, and weather.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Families gather belongings and transport tent, dogs, umiak, kaiak, and personal
    property by sled to the edge of the ice, then store them on shore until outside
    ice is free.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: While waiting for open water, men hunt land game and search the water edge
    for waterfowl and seals; later the party moves alongshore by umiak in stages depending
    on weather, floating ice, and food supply.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men seek seals from kaiaks, while women and children search islets and coves
    for edible things and take eggs from accessible bird nests.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When white whales appear sufficiently far upriver, the natives are summoned
    to a whaling station where nets form an enclosure into which whales are driven.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Natives spear whales in the pound, drag them ashore, skin them, and help take
    oil and skins to the post.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After whaling, the same natives attend salmon nets during late summer, and
    when fish runs end they go upriver to spear reindeer crossing the river.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: As shore ice forms, hunters who do not intend to remain in a locality descend
    the river because the river may freeze quickly and sharp floating ice can strain
    the umiak.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The head of a family chooses the winter location; the group moves there, builds
    or prepares for winter travel, constructs a snow house, sets traps, and hunts
    ptarmigan.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Furs are sold to the company in exchange for provisions and goods, and Eskimo
    dog teams are hired to haul wood cut by company employees to the river bank.
  category: relationship
  evidence_refs:
  - ev:6
