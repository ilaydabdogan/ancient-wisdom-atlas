canonical_text:
  quote: ''
  summary: 'The passage describes Nenenot sweat houses: their dome-like construction,
    use of fire-heated stones and water to make steam, frequent bathing practices,
    interruption of journeys for bathing, an incident at Fort Chimo in which reindeer
    drove bathers out of a sweat house, and traces of old sudatories along travel
    paths.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Nenenot are described as habitually taking steam baths in a sudatory or
    sweat house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sweat house is described as a hemispherical or dome-shaped structure made
    from flexible willow or alder poles and covered with tent skins.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A sandy or snow-free location is selected, a fierce fire is built, and stones
    are heated in the fire.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: After the fire is removed, the structure is erected over hot stones and the
    tenting edges are fastened down with stones to retain heat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Water from a kettle is poured over the stones to create intense heat and perspiration;
    water is not used for bathing except sometimes in a small amount on the head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The bather remains inside the hut until nearly exhausted by the heat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: These baths are said to be taken frequently and can delay a journey when the
    head of a family wants a bath after setting out.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Fort Chimo in spring 1882, reindeer were numerous while crossing toward
    the northeast to drop fawns.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Panic-stricken reindeer herds rushed among Indian tents and station houses,
    pursued by yelping dogs and screaming women and children.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: An old man and wife were inside the sweat house when a large drove of deer
    headed toward it, and someone shouted a warning to them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The old man and wife exited before the animals reached the spot; the man tore
    up and whirled the tenting, while the old woman made wild movements.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The population witnessed the incident and increased the tumult.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Signs of former sudatories are described as common along long-used Indian
    travel paths.
  category: setting
  evidence_refs:
  - ev:9
