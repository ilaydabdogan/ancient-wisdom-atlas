canonical_text:
  quote: ''
  summary: 'The passage describes kaiak hunting equipment and use: detachable spear
    points, thongs, lines, floats, hand spears, a trident for small seals and birds,
    a hand board for hurling spears, a double-bladed paddle with drip guards, and
    a hook used to recover sunken seals or whales and to maneuver among ice. It then
    describes a young man''s progression from gun ownership to kaiak, umiak, tent,
    and eventual household or gens headship, contrasted with improvident men unable
    to acquire these possessions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The spear point is attached through joints so it can detach after piercing
    game, preventing the bone or ivory head from breaking during the animal's movements.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Thongs connect the spear parts to each other and to the main shaft, and a
    long coiled line in front of the hunter gives scope while the animal tires.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: If sea conditions or the quarry exceed the hunter's ability, the float is
    thrown over and the hunter follows the seal or whale while harassing it when possible.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A wooden-shafted implement with three barbed iron prongs is used to kill small
    seals, white-coated young seals, and sometimes birds.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A hand board supports and launches certain spears; after a cast, the board
    is quickly placed under cords across the top of the kaiak so the paddle is ready
    for use.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The paddle is double-bladed and used alternately on each side of the kaiak;
    a rope or skin guard near the blade keeps dripping water outside the kaiak.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: A long hook with a weighted end and line is used to feel along the bottom
    for a sunken seal or whale and jerk into its skin to bring it to the surface.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The same hook is useful for moving the kaiak through narrow channels among
    ice fields where a long paddle would be impractical.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: A young man begins with a gun and ammunition; if successful as a hunter he
    can make a kaiak, obtain marine mammal skins, acquire an umiak and tent, and become
    head of a gens or family.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Brothers may live together and jointly own the tent and umiak, while other
    household goods are individual property not used without permission.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Men who fail to prepare skins may be unable to own a kaiak, umiak, or tent
    and may live with others or by themselves in poor conditions.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The collection includes a full-sized kaiak with fittings, models, and a toy
    kaiak cut from walrus tusk with a matching paddle.
  category: object
  evidence_refs:
  - ev:10
