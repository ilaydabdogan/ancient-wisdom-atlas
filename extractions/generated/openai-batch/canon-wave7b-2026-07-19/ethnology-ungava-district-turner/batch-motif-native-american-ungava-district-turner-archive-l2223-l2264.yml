canonical_text:
  quote: ''
  summary: 'The passage describes Inuit childhood and family relations: flexible naming
    practices, strong parental affection without corporal punishment, obedience grounded
    in trust, orphan girls serving as nurses, harmonious child play, consolation of
    injured children, games and toy-house play with dolls, older children gaining
    status through hunting-related provisioning, girls practicing sewing, and older
    boys teasing younger children while beginning to accompany elders on hunting trips.'
  language: English
  quote_policy: summarized
