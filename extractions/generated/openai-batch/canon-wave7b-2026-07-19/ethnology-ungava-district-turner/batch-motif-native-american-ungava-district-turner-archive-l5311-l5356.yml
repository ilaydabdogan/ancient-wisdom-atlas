canonical_text:
  quote: ''
  summary: 'The passage describes the preparation and use of an inflated animal-skin
    float: the skin is cleaned, inflated, dried, sewn closed, fitted with an ivory
    mouthpiece, wooden stopper, and stick handle, and then used with tracking or harpoon
    lines to keep lines clear, slow speared marine animals, and mark where they sink.
    It also describes hair removal methods intended to help preserve waterproofing.'
