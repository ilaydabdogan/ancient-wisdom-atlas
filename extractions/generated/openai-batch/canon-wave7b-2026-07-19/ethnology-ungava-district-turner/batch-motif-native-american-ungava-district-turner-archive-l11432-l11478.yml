canonical_text:
  quote: ''
  summary: A starving wolverene who failed to store food for winter leaves his wife
    and children to seek help from his wolf brothers. He meets wolves traveling on
    a frozen river, is recognized as their brother, and follows them to a marked riverbank
    camp. The wolves prepare a tent and fire materials while the wolverene wonders
    where the tent covering and fire will come from; the excerpt ends as a hunter
    leader takes up a kettle.
  language: English
  quote_policy: summarized
