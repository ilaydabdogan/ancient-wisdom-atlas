  text: The old man had departed before receiving the food, and the mother said she
    did not know where he had gone.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At daybreak the boy followed the old man's track until he saw the spirit crossing
    a large frozen lake.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The spirit told the boy that he could not dwell among living people because
    he was only a spirit and was returning to his abode.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The other people tied the boy to a tree, after which he forgot his benefactor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Two men traveling in intense winter cold had no food, and one said he would
    dream of porcupines.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the porcupine dream, porcupines came to the tent and gnawed the tent
    poles; one man killed some while barefoot and returned with nearly frozen feet.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The men warmed frozen feet in hot ashes, prepared porcupine flesh, ate one
    porcupine, and resumed travel.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: While shooting arrows in sport, the men discovered that an arrow had entered
    a bear den under the snow; they drove out, killed, and skinned the bear.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The men first left most of the bear because it seemed too big and ugly to
    eat, but took a large piece of fat.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the bear fat was hung over a fire, it smelled and tasted good, causing
    the men to regret leaving the carcass and return for it in the dark and cold.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The men found that wolves and foxes had eaten the bear meat, leaving only
    bones, and they blamed each other for leaving it.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: At a creek the men drank so long that their lips froze to the ice of the water
    hole, and they died by freezing.
  category: sequence
  evidence_refs:
  - ev:9
