canonical_text:
  quote: ''
  summary: 'A boy brings an old man who is later identified as a spirit into a tent,
    promises him deer lungs, and later follows his track across a frozen lake after
    the spirit departs. The spirit says he cannot remain among living people and is
    returning to his abode; the boy is later tied to a tree and forgets him. A second
    tale describes two men traveling in winter hunger: one dreams of porcupines, porcupines
    appear at the tent, and the men eat them. Later they discover and kill a bear
    but leave most of it; after tasting its fat cooked over a fire they return, find
    the carcass eaten by wolves and foxes, and eventually die when their lips freeze
    to ice while drinking at a creek.'
  language: English
  quote_policy: summarized
