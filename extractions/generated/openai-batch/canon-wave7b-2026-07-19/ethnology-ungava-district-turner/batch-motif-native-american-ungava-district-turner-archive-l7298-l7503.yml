    strip, and are painted much like the coat.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: Moccasins are rarely ornamented except with beads on the tongue or a strip
    of red, blue, or black cloth.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: Moccasin construction includes measuring the foot for an important person
    or skillful work, cutting a parallelogram-shaped sole, creasing and sewing the
    toe area with sinew, forming a heel seam, attaching a tongue, adding a top strip,
    and inserting a deerskin thong.
  category: sequence
  evidence_refs:
  - ev:11
