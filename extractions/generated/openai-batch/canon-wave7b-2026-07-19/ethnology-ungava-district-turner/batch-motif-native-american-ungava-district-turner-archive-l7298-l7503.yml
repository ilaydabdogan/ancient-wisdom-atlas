  text: The passage states that apparel differs for the sexes, while skin preparation
    is the same and garment forms differ.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men's clothing varies by season and includes a coat, breeches, leggings, moccasins,
    gloves or mittens, and a cap or headdress.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The men's coat is made from reindeer skins tanned into a pliable condition.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The summer coat is described as similar to a frock coat without tails, assembled
    from multiple skins for the back, sides, front, neck, sleeves, and collar.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The coat front is usually open, and if closed it is held by a belt or colored
    scarf purchased from a trader.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Garment seams are sewn with sinew, with two full-length side seams on the
    coat and shorter skirt, armhole, sleeve, and collar seams.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The coat is ornamented with painted designs using combinations of red, blue,
    yellow, and brown placed on edges, wrists, sleeves, skirt, hip areas, the back
