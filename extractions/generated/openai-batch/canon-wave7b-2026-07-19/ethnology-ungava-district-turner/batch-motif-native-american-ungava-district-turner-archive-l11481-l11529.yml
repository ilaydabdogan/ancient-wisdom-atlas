canonical_text:
  quote: ''
  summary: In a camp scene involving a wolverene and wolves, food and fire are provided
    quickly. The wolverene is served more deer meat than he can eat and secretly hides
    the remainder after being warned it would turn to bark if placed in a certain
    spot. While he sleeps, a wolf replaces the meat with bark, and the wolverene finds
    the bark in the morning. Later the wolves prepare another meal, break camp in
    a concealed way so the wolverene cannot see where the tent has gone, and continue
    along tracks toward a marked tent site after crossing a river and finding stripped
    deer bones.
  language: English
  quote_policy: summarized
