canonical_text:
  quote: ''
  summary: 'The passage describes clothing and adornment: gowns decorated with red
    ocher, paint, beads, and tassels; women’s leggings with crescent-shaped flapping
    ornaments, colored edging, and bead rows; moccasins; cold-weather mantles and
    blankets; children’s and infants’ garments; and a brief note that traveling men
    and women smoke or take snuff.'
