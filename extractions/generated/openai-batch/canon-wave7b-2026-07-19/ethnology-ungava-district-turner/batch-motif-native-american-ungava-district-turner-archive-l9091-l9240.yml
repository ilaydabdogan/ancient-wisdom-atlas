literal_observations:
- id: obs:1
  text: The sled is strengthened by a stout twisted thong run under notched bars,
    helping hold the two side boards in place over uneven ground.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sled uses two boards rather than one because a single board of sufficient
    width is unavailable and would be more likely to split; the two-board construction
    also makes the sled less stiff.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sled is shaped to be narrow at the nose and heel and wider near the first
    bars, and its length helps a person guide it.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: On journeys, younger women and men drag the sled; when men return to the station
    to trade, men alone drag it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A small dog is sometimes hitched to the sled by a thong, but the passage says
    it gives little assistance and is also kept from wandering in search of game.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: When people change camp, household effects such as the tent, cooking utensils,
