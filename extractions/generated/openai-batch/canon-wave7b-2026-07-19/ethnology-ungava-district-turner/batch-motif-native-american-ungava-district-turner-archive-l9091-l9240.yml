  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The Nenenot are described as skilled in making and using four styles of snowshoe:
    swallow-tail, beaver-tail, round-end, and single bar.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Snowshoe frames are made of wood, often birch when available, otherwise generally
