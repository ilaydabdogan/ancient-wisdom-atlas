canonical_text:
  quote: ''
  summary: 'The passage describes seasonal reindeer hunting and processing among Native
    peoples of the Ungava district: parties disperse according to animal habits, rely
    chiefly on reindeer for food and skins, anticipate autumn river crossings, drive
    swimming deer with canoes, spear them near shore, and dry meat and skins for use.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hunting parties disperse in different directions so that different parts of
    the district can provide products for them, and the people are described as knowing
    animal habits well enough to find game in particular localities.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Reindeer provide the greater part of the food, and their skins provide clothing;
    the people regard themselves as starving when without deer, even if other foods
    are abundant.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The principal means of procuring deer is by lance or spear, especially during
    September and October when deer collect from various directions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In spring, female deer go to treeless hills and mountains in the Cape Chidley
    region to give birth; later the mothers lead the young to places where males also
    return, with both groups meeting near the Koksoak river region.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Thousands of deer may congregate on riverbanks, and small herds swim back
    and forth across the river.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Hunters establish camps near expected crossing points, keep canoes ready,
    and watch the opposite hillsides for deer moving toward the riverbank.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The deer swim high in the water in a compact crowd, and their antlers are
    compared to branches of a tree floating with the current.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A canoe crew quietly approaches from below and behind the swimming deer, causing
    alarm and driving them upstream toward the camp-side shore.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Hunters spear deer in vital parts while the animals are in or near the water;
    wounded deer try to reach land and may die on shore or in nearby bushes, while
    some escape if the band is large or scattered.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After the hunt, carcasses are stripped of skins and fat, viscera are removed,
    fat is set aside, and skins are taken to camp or hung over poles to dry.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Meat is stripped from the bones and dried over smoke and hot air above a fire;
    some back fat is also dried and smoked.
  category: action
  evidence_refs:
  - ev:5
