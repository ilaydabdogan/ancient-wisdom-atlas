canonical_text:
  quote: ''
  summary: The passage describes children’s amusements, boys’ harassment of girls
    and women, retaliatory humiliation of a boy, games and strength contests, and
    a festival or feast of furs celebrating hunting success with a special tent, displayed
    skins, drumming, songs, spruce bough flooring, deerskins, and pemmican offered
    to guests.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Boys are described as treating females of their own age as inferiors and as
    subjecting women, including older women, to mischief.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In summer, a woman peeping from a tent may have water flung on her by a boy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In winter, boys annoy women with snowballs and waylay women returning from
    the woods with fuel.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If boys separate women from a group, they tear dresses and scatter bundles
    of fuel.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Women sometimes retaliate by stripping clothing from a boy, causing him to
    return to camp nude and be ridiculed for days.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Boys’ principal amusements include practical jokes, running, jumping, wrestling,
    and practicing with bows and other weapons suited to their age.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Girls are reported not to have been observed playing games; their chief occupation
    is described as keeping away from boys.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Girls toss stones or chips in the air and try to keep at least two in the
    air at once; Eskimo are also said to practice this.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Wrestling is described as a principal test of physical strength, sometimes
    involving contests with Eskimo wrestlers.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Feasts are given to celebrate success in hunting and similar achievements.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: At an 1883 feast of furs, skins of wolves, wolverine, beaver, otter, foxes,
    muskrat, and reindeer were displayed on a pole above the tent structure.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: Inside the feast structure, men were seated or standing around, the floor
    was covered with carefully arranged spruce boughs, and piles of deerskins and
    cloth-covered heaps were visible.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:13
  text: An old man prepared the drum by tightening it, arranging its suspension, wetting
    the drum-head with a few drops of water, and then songs with drum accompaniment
    were performed.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: Guests were treated to pemmican, and an attendant offered the narrator a piece
