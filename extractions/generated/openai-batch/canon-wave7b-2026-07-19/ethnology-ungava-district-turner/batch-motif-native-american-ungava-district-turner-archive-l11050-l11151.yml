canonical_text:
  quote: ''
  summary: 'The passage contains three adjacent folklore items: wolverene and muskrat
    marry and give birth to progenitors of several peoples; a marten is burned with
    hot water after pursuing a married woman, explaining a light mark and forest-dwelling
    habit; and an Indian hunter follows a beaver woman into her water home while his
    brother later searches for him.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wolverene wanders along a riverbank and sees a muskrat swimming at the edge
    of the water.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The muskrat identifies herself as a woman; the wolverene says he will take
    her as wife, and she comes onto the bank after he says she can live on land as
    well as in water.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wolverene and muskrat select a place, prepare a home, eat, and retire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'Five children are born in sequence, and the wolverene assigns each a people-name
    and progenitor role: white man, Indian, Eskimo, Iroquois, and Negro, using the
    source''s archaic ethnonyms.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The five children are described as born through different routes: natural
    exit, mouth, anus, nose, and ears.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: When the children are grown, their mother tells them to separate, sends them
    to different places, and directs them to go to white men when in need.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: A marten falls in love with a man's wife and, when the husband is absent,
    enters the home and tries to entice her to leave her husband.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The husband returns unexpectedly, sees the marten beside his wife, and the
    wife explains what the marten has been attempting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The husband tells his wife to boil water, hides near the house, listens when
    the marten enters, and then confronts the marten.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The husband throws hot water on the marten's breast; the marten scratches
    his burning bosom, runs into the woods, and thereafter keeps in dense forests
    away from people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: An Indian hunter sees a beaver house and a beaver swimming toward him; before
    he shoots, the beaver speaks and asks whether he would have her for a wife.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The hunter objects that he cannot live in water or eat willows, and the beaver
    says he will not perceive the water or willow food in those ordinary ways.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The beaver tells the hunter to remove his clothing and follow her; as he wades,
    he does not feel the water touching him, and they swim to her home.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Inside the beaver home, the hunter is offered food that he does not recognize
    as willow bark.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: After two nights, the hunter's brother searches, finds the clothing left on
    the bank, and thinks the hunter has drowned.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The brother dreams that the missing man is living with a beaver, prepares
    for a search, travels alone, and begins making a dam to lower the water around
    the beaver house.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The provided excerpt states that the beaver wife had borne two children before
