canonical_text:
  quote: ''
  summary: In a tale passage, a female wolf keeps one hole in the ice clear and waits
    for an otter who is searching for air beneath the ice. When the otter is nearly
    exhausted, the wolf moves away enough for him to surface. The otter dries himself
    in snow and says he will live with her. The wolf reminds him that she said she
    would smother him. The otter asks for fishing line and offers to catch fish if
    the wolf prepares a tent. She gives him the line and makes the tent. The otter
    returns through the ice hole with fish strung on the line, dries himself in snow
    again, and tells his wife to retrieve the fish from the hole.
  language: English
  quote_policy: summarized
