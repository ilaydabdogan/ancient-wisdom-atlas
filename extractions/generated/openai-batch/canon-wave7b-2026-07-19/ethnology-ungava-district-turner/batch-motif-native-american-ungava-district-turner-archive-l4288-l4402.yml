  quote: ''
  summary: 'The passage describes Hudson Bay Eskimo household articles and their use:
    preparation of lamp wicks, heat and light from oil lamps, frames for drying wet
    clothing over lamps, soapstone kettles formerly used for cooking, wooden dishes,
    sealskin buckets and cups, and wooden baskets, with notes on some native-made
    vessels being replaced by manufactured utensils.'
