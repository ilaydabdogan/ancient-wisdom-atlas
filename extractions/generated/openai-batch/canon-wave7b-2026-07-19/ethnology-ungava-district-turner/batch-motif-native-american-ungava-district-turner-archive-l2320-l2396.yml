canonical_text:
  quote: ''
  summary: 'The passage describes beliefs and practices concerning death among the
    Hudson Strait people: preferred afterlife destinations, a four-year grave probation
    after natural death, offerings and grave goods for the spirit, several burial
    or exposure locations, attitudes toward disturbing bones, grave-rifling by Indians,
    and a brief contrast with Alaskan Eskimo ceremonies for the dead.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that people desire to go to a lower region, where they
    may later communicate with the living; those who go above are denied this privilege.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: If death results from natural causes, the spirit is said to dwell on earth
    after four years of probationary rest in the grave.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the four-year period, the grave may be visited, food may be offered,
    and songs may be sung.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Offerings are described as oil, flesh, and tobacco for smoking and chewing;
    the living consume these at the grave.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Clothing may be placed near the grave so that the spirit can clothe itself
    after the garments decay.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Items considered immediately useful to the departed soul are placed in the
    grave at burial, including ammunition, a gun, kayak gear, a shirt, gloves, a knife,
    and a drinking cup.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The dead man’s spirit is said to appropriate the spirits of deposited articles
    as soon as the articles decay.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: When an article is lost, people may say that a named dead person has taken
    it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Some dead are exposed on the flat top of a high point extending into the water.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: Other remains are placed along the shore and covered with rocks, or placed
    on smooth ridges near a large glacial boulder with stones piled around and upon
    the body.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: The people are said to have little fear of the dead person’s bones, but they
    do not approve of others disturbing them.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Indians are reported to rifle Eskimo graves to obtain deposited guns, clothing,
    and similar items.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage states that the people of Hudson Strait do not have elaborate
    ceremonies for festivals of the dead comparable to those among the Eskimo of Alaska.
  category: relationship
  evidence_refs:
  - ev:6
