canonical_text:
  quote: ''
  summary: 'The passage describes Hudson Bay Eskimo handling and caching of deer or
    reindeer meat: valued tongue, hindquarters placed in the carcass cavity, meat
    cached near the kill site or moved by kayak for winter use, cache locations marked
    against winter snow, stone caches built to protect meat from scavengers, movement
    to new hunting stations when deer stop crossing, and early warm-season kills reserved
    as dog food when spoilage threatens.'
  language: English
  quote_policy: summarized
