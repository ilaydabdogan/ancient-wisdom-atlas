canonical_text:
  quote: ''
  summary: Ethnographic description of Indians southwest of Ungava and of Naskopies
    in the Ungava district, including physical appearance, clothing, livelihood, white-whale
    hunting, birch-bark canoes, polygamy and marriage practices, absence of recorded
    beliefs and traditions, bear-lip trophies, a white-whale harpoon compared with
    that of the Innuit, Naskopie self-designation, speech patterns, gestures, and
    long-distance conversation across the Koksoak River.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Indians dwelling southwest of Ungava are described as differing in speech
    from the Ungava-district Indians and as being slightly taller on average than
    the Naskopies.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes clothing and grooming practices, including women wearing
    cloth obtained through traders and imitating the dress of women associated with
    Moose Factory.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men are described as spending their time hunting and fishing, and scarcity
    of reindeer near Fort George is said to have led many Indians to move eastward
    near or with the Naskopies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: These Indians are said to assist in capturing white whales, to eat the flesh
    and blubber, and to prize the fins and tail; the Naskopies are said not to eat
    it because they consider it too fat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Little Whale River Indians are said to use birch-bark canoes with ends
    more turned up than those of the Naskopies, suited to swift currents; sails may
    be used on one canoe or on two canoes lashed together.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says the people practice polygamy and recounts that missionary
    E. J. Peck rebuked them, after which second wives were sent away until he left
    and then taken back.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Girls are said to be taken as wives before puberty; the passage also notes
