canonical_text:
  quote: ''
  summary: In an animal tale episode, a wolf wife asks her otter husband to set a
    mark in the middle of a lake so her starving wolf relatives can find her. Her
    brothers see the mark from a hill, report it to the old wolf father, and the family
    follows the mark and the otter’s track to the couple’s tent. The gaunt wolf relatives
    arrive, frighten the young otters, consume the household meat and fish, and then
    go hunting with the otter. The wolves kill one deer, while the otter kills the
    rest of the band before the passage breaks off mid-sentence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wolf speaker says she is thinking of her father, mother, and brothers, and
    says her old father told her to ask for a mark in the middle of the lake so they
    would know where she is.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The otter goes to the middle of the lake and erects a pile as a mark for the
    wolf’s relations.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The brothers of the otter’s wife watch from a hill, see the mark, say their
    sister has saved them, and return to tell their old father.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The old wolf says the family will seek their sister and daughter and live
    with her and her husband.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wolf family goes to the hill by the lake, sees the mark, follows the otter’s
