- id: obs:9
  text: The newcomers begin eating meat from the stage, and the otter’s wife tells
    them not to be greedy because her husband is not stingy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the otter is believed to be asleep, the newcomers eat all the raw meat
    and fish and finish it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The otter tells his wife that her brothers may make a fool of him because
    they stare at him so hard.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The otter and the wolf brothers go hunting deer; the wolves kill one deer,
    and the otter kills all the remaining deer in the band.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: After killing the deer, the otter cleans himself in dry snow and later says
    he killed all the deer in the band.
  category: sequence
  evidence_refs:
