  - ev:4
  - ev:5
- id: obs:7
  text: The young otters say they are running from “the Hunger,” the name they apply
    to the wolves.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the wife opens the door, the household sees a row of gaunt wolves described
