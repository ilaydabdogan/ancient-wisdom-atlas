canonical_text:
  quote: ''
  summary: 'The passage introduces winter storytelling by Indians around a fire, then
    records animal stories: a wolverene dresses birds in feathers, tries to fly with
    brant, disobeys a warning not to look below, falls, and is mistaken for a rotten
    brant. In another story, a wolverene lures water birds ashore to dance with eyes
    closed, kills ducks, is exposed by a whisky-jack to hungry Indians, and wakes
    to find only bones in the kettle. A final story begins with a reindeer assigning
    animal names; the squirrel asks for the black bear''s name and cries until its
    lower eyelids become white.'
  language: English
  quote_policy: summarized
