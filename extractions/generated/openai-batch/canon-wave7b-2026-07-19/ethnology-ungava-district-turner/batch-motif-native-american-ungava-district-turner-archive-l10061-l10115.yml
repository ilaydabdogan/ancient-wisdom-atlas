  summary: The passage describes drums, drum rattlers, children’s rattles, a doll,
    and boys’ target-shooting toys. Drums and rattles are made with deer skin, wood,
    reindeer horn, pebbles or shot, buckskin, and cords. Children’s rattles can be
    hung from a tent-pole for amusement. Boys shoot blunt arrows at board images of
    reindeer set in the snow.
