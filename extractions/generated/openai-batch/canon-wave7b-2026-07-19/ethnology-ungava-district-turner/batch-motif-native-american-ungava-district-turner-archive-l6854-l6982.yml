    a drum before announcing the appearance of the desired spirit.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The shaman implores the spirit to grant a request and tells the people outside
    that he has secured the spirit’s services.
  category: speech
  evidence_refs:
  - ev:3
