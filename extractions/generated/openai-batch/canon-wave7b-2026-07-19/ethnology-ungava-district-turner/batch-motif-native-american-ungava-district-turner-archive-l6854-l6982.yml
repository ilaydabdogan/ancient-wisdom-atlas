  text: The shaman is said to be believed capable of controlling spirits and foretelling
    the future, while remaining concealed from view during the performance.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A special high, narrow tent is used, and cracks and crevices are closed to
    exclude light.
  category: setting
  evidence_refs:
