canonical_text:
  quote: ''
  summary: The passage describes a concealed shamanic ceremony in a dark tent where
    a spirit is summoned for aid or divination, with later failure attributed to an
    offense needing reparation. It then describes hunting mementos and bear-skin amulets
    made from dangerous animals, followed by a seasonal account of spring return to
    Fort Chino, fur trading, summer labor, and dispersal for winter hunting.
  language: English
  quote_policy: summarized
literal_observations:
