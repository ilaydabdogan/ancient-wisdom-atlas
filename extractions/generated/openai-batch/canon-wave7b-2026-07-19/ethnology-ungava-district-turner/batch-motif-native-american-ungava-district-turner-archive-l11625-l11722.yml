canonical_text:
  quote: ''
  summary: 'The passage first concludes a wolverene tale: the wolverene returns home
    with meat and fat, his wife overeats fat and becomes ill, and after he looks at
    a loaded sled despite an injunction not to look back, the spell is broken and
    wolves eat nearly all his stored food. The passage then tells of starving Indians:
    a provident old man has stored meat and fat while others starve; he feeds a hungry
    boy, offers his food stores if the boy''s father gives him the boy''s sister,
    hosts a feast with clothing and seating arrangements, and later directs the boy
    to set thirty deer snares, each of which catches a deer as a season of abundance
    arrives.'
  language: English
  quote_policy: summarized
