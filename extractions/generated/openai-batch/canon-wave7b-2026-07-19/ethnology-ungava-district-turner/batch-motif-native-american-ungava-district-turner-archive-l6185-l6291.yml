canonical_text:
  quote: ''
  summary: A sequence of Hudson Bay Eskimo etiological tales explains the origins
    or traits of sea mammals, white bears, guillemots, ravens, loons, gulls, hawks,
    swallows, hares, and wolves through human injury, speech, teasing, hunger, painting,
    abandonment, or transformation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman is cast from an umiak; when she grasps the boat, her fingers are cut
    off and fall into the water, where they become sea animals including seals, walrus,
    whales, and white bears.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman cries out that she will take revenge, and the white bear is described
    as feeling revenge toward people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Children playing and shouting on a high sea cliff frighten seals away from
    hunters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After an angry man wishes the cliff would fall on the noisy children, the
    cliff tips over and the children become guillemots or sea-pigeons with red feet.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man repeatedly says the word for a lower deerskin bed-blanket, is told to
    fetch it himself, hurries, and becomes a raven that still calls that sound.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A man paints one child, identified as the loon, with a white breast and square
    back spots; the other child, identified as the raven, laughs and avoids being
    painted.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The loon is ashamed of the spots and goes to the water, where it shows its
    white breast to hide its back.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: A woman with children, told to walk over a neck of land while others take
    a boat around a rough point, becomes confused, fears desertion, repeats the last
    directions she heard, and becomes a gull.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A woman teased for having a short neck sits on high places, becomes a hawk,
    and calls out about the insult.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Unusually wise children building toy houses on a cliff become small birds
    identified with swallows, which continue to build mud houses on cliffs near people.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A child abused because of long ears goes to live alone and becomes the hare,
    which lays its ears down when it sees anyone.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A poor woman has many hungry children; the children become wolves that roam
    over the land seeking food, while the mother's cry is heard consoling them.
  category: sequence
  evidence_refs:
  - ev:9
