canonical_text:
  quote: ''
  summary: The passage describes the labor of preparing buckskins and deerskins for
    trade and local use; insect damage and seasonal quality of skins; the smoking
    of deerskins with rotten wood smoke; and tools, pigments, containers, and media
    used for decorating buckskin garments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Preparing large numbers of skins requires constant labor, and some energetic
    men have two or three hundred buckskins and parchment skins for the spring trade.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage connects the number of wives an energetic or wealthy man may have
    with the need to attend promptly to products of the chase.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Skins intended for sale are selected, bundled, and covered, while skins retained
    for local use are generally inferior grades.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A gadfly infests deer, deposits eggs under the skin, and produces larvae that
    leave cavities and scars when they exit.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Scars reduce the value of dressed skins, and the passage says they may be
    concealed with flour or chalk.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The skins are said to be in best condition from September to the middle of
    December, before larvae have grown large enough to damage them.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: For smoking deerskins, rotten wood with a dry-rot, spongy texture is sought
    in the woods and dried thoroughly.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Two similar skins are sewn into a bag with the hairy side inward, with the
    after portions suspended and the head and neck portions left open with a cloth
    conduit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Rotten wood is placed in a vessel and allowed to smolder without blazing so
    smoke rises into the deerskin bag, while the skins are kept from being too near
    the fire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The skins are inspected during smoking, then removed after taking on a pale
    clear brown color, folded with smoked side inward, and seasoned for several days.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Larval scars do not take smoke as well as healthy skin and give the surface
    a pitted or scaly appearance; heavily scarred skins are used for tents and lower-grade
    footwear parts.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Paints for buckskin garments are applied with bone, horn, antler, or sometimes
    wooden tools; multi-tined antler tools make parallel-line patterns.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: Mixed paints are held in wooden blocks with bowl-shaped cavities or in small
    wooden bowls.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: Pigments include traded indigo and vermilion, local red earth, and other colors;
    they are ground finely and mixed with water, oil or tallow, or prepared fish roe
    as a paint vehicle.
  category: object
  evidence_refs:
  - ev:11
