canonical_text:
  quote: ''
  summary: 'Ethnographic description of an Ungava Inuit skin tent: its construction
    from skins and poles, dismantling and umiak transport, seasonal use between rains
    and snow-house season, interior arrangement and social ordering, owner status,
    winter storage risks, and memory of earlier permanent sod-and-stone winter houses.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A skin tent commonly uses about ten to fifteen skins and can accommodate a
    large family.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The skins are usually left with the hair on, cleaned, trimmed, sewn into two
    side widths, and paired with a separate door piece.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The tent frame uses paired uprights, a ridgepole, side braces, and shorter
    leaning poles; the passage states that eleven poles are needed for a long tent.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: During prolonged rain the skins are adjusted to meet more closely over the
    ridge, with additional skins covering any remaining gap.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When dismantled, each tent width is folded and rolled; a carrier bears the
    load on head and shoulders while two people assist, and the bundle is placed in
    the umiak as ballast.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The skin tent is described as the usual shelter from the first rain until
    enough snow falls to build a snow shelter.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Inside the tent, the owner, wives, and children have bedding behind a timber
    at the far end; other occupants lie along the sides, and guests are assigned places
    by the host.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The central portion of the tent is reserved for a fireplace used for cooking
    and heating.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Seasonal work is carried on inside the tent, and the tent is moved by umiak
    when local food is exhausted or another region promises more abundance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The owner of a tent is considered important; illness may cause him to lose
    belongings, after which several seasons may be needed to gather enough skins for
    another tent.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: In winter, tent skins are stored on posts or rock piles to avoid damage by
    small animals, but mice and ermines may destroy them; unattended skins may become
    useless through rain and decay.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage reports ruins of former permanent sod-and-stone winter houses,
    with stone walls, turf or earth filling, roof timbers, and depressed excavated
    floors.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Present inhabitants say their ancestors lived in the former huts but cannot
    explain why the huts were deserted or why such structures are no longer built.
  category: speech
  evidence_refs:
  - ev:7
