canonical_text:
  quote: ''
  summary: 'The passage describes tobacco-related practices and objects: tobacco and
    molasses are boiled into an intoxicating drink; stone pipes are made from selected
    river pebbles or slate with spruce-wood stems; pipe-cleaners are made from bone
    or horn; tobacco is smoked with a coal of fire placed on it. It also notes restrictions
    on intoxicants, occasional distribution of spruce beer, and begins a section on
    transportation by water, stating that regional Indians use birch-bark canoes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several people at the station may contribute plugs of tobacco and molasses,
    which are boiled together and diluted with water to make a drink that causes stupefaction
    lasting several days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Smoking pipes are made from stone obtained from river pebbles, often fine-grained
    sandstone, with colors ranging from dark reddish brown to lighter red, sometimes
    with yellowish-drab spots.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The most valued pipes are made of greenish sandstone with darker strata that
    appear as graining after cutting and polishing.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pipe stems are made from spruce wood by boring through a stick lengthwise
    and whittling it to size; the stems may be ornamented with many-colored beads.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A pipe is made by selecting rough stone, chipping it into crude form, wearing
    it down with a coarse file or harder stone, and polishing it after several days
    of labor.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ashes and accumulations inside pipes are removed with a bodkin-shaped instrument
    of bone or horn; a broken horn comb may be used to make a decorated pipe-cleaner.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Moist black plug tobacco soaked with molasses and licorice is cut into pieces,
    and a coal of fire is placed on it for smoking.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage states that the people described do not know how to brew or ferment
