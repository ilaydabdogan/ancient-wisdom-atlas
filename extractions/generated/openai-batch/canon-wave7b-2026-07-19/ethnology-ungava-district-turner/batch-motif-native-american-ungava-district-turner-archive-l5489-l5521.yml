  quote: ''
  summary: The passage describes how killed deer or similar animals lying in water
    are brought to land, skinned, opened, and divided. Blood, stomach contents, heart,
    liver, flesh, head of a young deer, and tongue are kept for food in stated circumstances.
    Sinew from the lumbar region is removed, cleaned, washed, dried, and reserved;
    horns may be kept for tool handles.
