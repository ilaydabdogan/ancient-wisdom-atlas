canonical_text:
  quote: ''
  summary: 'The passage describes burial customs: binding and wrapping the corpse,
    moving the dying outside to avoid a spirit returning through the house, exposing
    the body near rock, shore, or hilltop with stones as protection, occasional transport
    of a beloved child’s body, restraint and grief around death, and beliefs that
    death separates soul from body, with souls going upward to the sky or downward
    into the earth depending on conduct and manner of death.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After death, the body is bound with cords in a drawn-up posture, with arms
    tied down, and wrapped in deerskin or sealskin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Near death, relatives remove the invalid outside the house; if death occurs
    inside, the body must leave through a hole cut in the side wall rather than through
    the door, and the hole is closed to prevent the spirit from returning.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The body is exposed in the open air beside a large rock, at the shore, or
    on a hilltop, with stones piled around it to keep birds and animals away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A dog eating flesh from a body is considered a great offense.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: If a beloved child dies, the body is sometimes taken along by its people if
    they leave for another locality before decomposition has advanced too far.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The dying person is described as accepting fate calmly, with little complaint
    even during painful illness.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Friends may show much grief, though extended weeping is said to be exceptional;
    the death of a husband can cause hardship for the wife and small children.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Death is described as the separation of the soul from the material body.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Souls or spirits are said to go either up to the sky, called keluk, or down
    into the earth, called Nuna; the two classes can communicate with each other.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The soul’s destination is said to depend on conduct on earth and especially
    on the manner of death; people dying by violence or starvation and women dying
    in childbirth are said to go to the region above.
  category: relationship
  evidence_refs:
  - ev:8
