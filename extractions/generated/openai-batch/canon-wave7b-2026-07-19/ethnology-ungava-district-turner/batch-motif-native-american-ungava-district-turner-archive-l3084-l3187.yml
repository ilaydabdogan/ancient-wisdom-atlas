canonical_text:
  quote: ''
  summary: The passage describes the yearly outdoor and domestic life of Inuit near
    Fort Chimo, including deliberation before journeys, gendered household and hunting-related
    labor, spring boot making from sealskin, skin-tanning techniques, boot repair,
    and a spring prohibition against sewing unused deerskin onto sealskin clothing
    lest seals take offense and leave the chosen hunting locality.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some Koksoagmyut live apart or do not work or hunt, while others take part
    in the described yearly occupations.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before deciding on a journey or undertaking, people deliberate, consult each
    other, consider game locations, and consider possible illness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Once a decision to journey is made, only serious obstacles are said to thwart
    it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women bring wood, water, and food when it is not too distant; men go for distant
    food with dog teams.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Women fashion skins into clothing and other articles and do the cooking.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After a hunt of several days, the family watches for the husband’s return,
    unloads the sled or boat, and listens to the chase account.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In early spring, women make boots for summer wear from seal skins prepared
    and stored during the previous fall.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Seal skin preparation includes removing fat, flesh, and hair; working the
    skin with a chisel-shaped implement; rubbing and chewing it; soaking it in fermented
    liquid; drying it; and softening it again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Boot soles are measured by hand spans and fingers, then cut with a round knife
    called an ulo.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Worn boots are turned inside out, dried, chewed, scraped, stitched, or patched,
    using sinew from reindeer or seal as thread.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: When making sealskin clothes in spring, women must not sew on any piece of
    deerskin that has not already been sewn.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The stated reason for the spring deerskin sewing prohibition is that seals
    might take offense and leave the selected spring seal-hunt locality.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: At this season deer flesh may be used, but the deer skin must be cast away.
  category: object
  evidence_refs:
  - ev:10
