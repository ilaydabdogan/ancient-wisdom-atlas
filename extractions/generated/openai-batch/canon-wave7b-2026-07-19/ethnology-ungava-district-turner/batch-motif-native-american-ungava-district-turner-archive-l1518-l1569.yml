canonical_text:
  quote: ''
  summary: 'The passage classifies Indian inhabitants of the region into three groups
    and describes the Mountaineers or Montagnais: their territory, trading stations,
    subsistence on reindeer and other animals, dependence on animal skins and furs,
    exchanges with coastal stations and white newcomers, missionary contact, and past
    conflict with Inuit and neighboring Naskopies.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Indian inhabitants of the region are said to be divisible into three groups
    with slight differences in speech and fewer differences in habits.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mountaineers, identified as the Montagnais of early Jesuit missionaries,
    roam south of Hamilton Inlet toward the Gulf of St. Lawrence, with uncertain western
    limits.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Mountaineers trade at accessible coastal stations, including Rigolet and
