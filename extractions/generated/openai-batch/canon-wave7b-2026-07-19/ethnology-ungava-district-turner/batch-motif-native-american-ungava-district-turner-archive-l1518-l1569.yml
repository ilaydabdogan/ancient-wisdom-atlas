- id: obs:4
  text: Their subsistence is described as relying on reindeer, porcupines, and birds
    including geese, ducks, ptarmigan, and grouse.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Reindeer are described as erratic in this area, sometimes absent for years
