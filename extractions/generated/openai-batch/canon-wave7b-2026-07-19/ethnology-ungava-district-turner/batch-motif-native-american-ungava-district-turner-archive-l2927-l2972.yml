  quote: ''
  summary: 'The passage describes Ungava Eskimo outdoor knowledge: learning country
    through childhood hunting travel with parents, relying on memory, naming terrain
    features, finding cached game despite snow, serving as guides, navigating by the
    north star, predicting weather, recognizing solstices by the sun''s bearing against
    fixed landmarks, and dividing the year into many named seasonal periods marked
    by environmental and subsistence events.'
