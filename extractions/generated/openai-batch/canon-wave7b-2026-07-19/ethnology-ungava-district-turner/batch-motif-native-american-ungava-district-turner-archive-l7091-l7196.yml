canonical_text:
  quote: ''
  summary: The passage describes deer processing, marrow and fat rendering, dried
    meat storage, seasonal deer hunting near Fort Chimo, communal ambush tactics,
    firearm use, winter snowbank hunting, and other game and food practices among
    groups named in the source as Indians, with a brief comparison to Eskimo marksmanship.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Long bones are cracked to extract marrow, which is described as highly prized;
    in plentiful seasons deer may be killed for the marrow alone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fat is rendered over fire and cooled in another vessel; it is used for trade,
    food, and tanning skins.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bones containing marrow are heated in a kettle over a slow fire to melt the
    marrow, and marrow is valued more highly than tallow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dried flesh is packaged in bundles wrapped in parchment-like subcutaneous
    tissue and stored for later food use.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Female deer and young bucks travel toward the Cape Chidley region, and their
    crossing place is at or near Fort Chimo at least in alternate years.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Around May 5 to May 10, the camp waits for the deer; when deer are sighted,
    men get guns and ammunition, women shout the direction of the game, and children
    run to high places to watch.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Men position themselves around a narrow defile and ambush the herd as it passes
    between hills toward level land.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The deer panic, some stand or walk without fleeing, and the Indians close
    in until the herd is destroyed or dispersed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The firearms are cheap single-barreled muzzle-loading shotguns loaded rapidly
    and sometimes carelessly, with occasional bursting or loss of the ball when shooting
    downhill.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Hunters practice rapid loading and firing; the passage says they surpass the
    Eskimo in this skill, while the Eskimo are better marksmen.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Snaring is identified as a third method for taking deer.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: In winter, people on snowshoes surround deer and drive them into a deep snowbank,
    where hunters kill the trapped animals with lances.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Small game such as ducks, geese, ptarmigan, hares, rabbits, porcupines, beavers,
    and occasionally lynx provide dietary variety.
  category: object
  evidence_refs:
  - ev:10
  - ev:12
- id: obs:14
  text: Ptarmigan are killed in large numbers, and their feathers are traded for small
    trinkets and often adhere to women's clothing or hair during that season.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Porcupines are found in trees and must be carefully cleaned; their hair and
    spines are removed by scorching or hot water.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: Among carnivorous mammals, lynx is eaten only when other food is scarce; bears
    are rare as food, and wolverines, wolves, and foxes are never eaten.
  category: relationship
  evidence_refs:
  - ev:12
