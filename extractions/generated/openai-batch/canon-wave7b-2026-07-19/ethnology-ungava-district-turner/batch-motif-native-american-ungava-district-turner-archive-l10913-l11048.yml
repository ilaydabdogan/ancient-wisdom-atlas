canonical_text:
  quote: ''
  summary: The passage closes one animal tale in which a frog deceives a rabbit into
    eating frozen deer lungs as punishment, then gives a tale of a wolverene who taunts
    a rock, is trapped by it, summons animal and storm helpers, loses and repairs
    his coat or skin, and rewards the mouse for sewing it well.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A frog kills and skins deer, sets one deer head and neck in the snow facing
    the route by which the rabbit will come, and freezes deer lungs until they become
    white.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rabbit sees the deer head staring at him, becomes alarmed, and the frog
    gives him the frozen lungs while presenting them as a desirable piece of fat.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The rabbit eats the frozen lungs, later becomes violently ill in the tent,
    and vomits through the night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator states that the frog served the trick as punishment because the
    rabbit had eaten all the beaver meat two days before.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A wolverene walking on a hillside encounters a large rock and asks whether
    it had been walking; the rock replies that it cannot move and therefore cannot
    walk.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wolverene repeatedly says he saw the rock walking, taunts it, strikes
    it with his paw, and challenges it to catch him; the rock answers that it cannot
    run but can roll.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The rock rolls after the wolverene, keeps close to his heels, and finally
    rolls onto him after he trips over a stick.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The trapped wolverene cries out that the rock is hurting him, and the rock
    refuses to move because the wolverene had tormented it and made it run after him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The wolverene calls wolves and foxes his brothers; they come, ask how he got
    under the rock, say it serves him right, and fail to move the rock.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The wolverene then calls lightning and thunder his other brother; a dark cloud
    arrives, lightning strikes the rock into pieces, and the wolverene's coat or skin
    is stripped and torn into pieces.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The wolverene takes the torn coat pieces to his sister the frog, asks her
    to sew them, rejects her work, strikes her on the head, and knocks her into the
    water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The wolverene takes the coat to his younger sister the mouse, who sews it
    well; he praises her and says she will live in tall green grass in summer and
    in grass houses in winter.
  category: sequence
  evidence_refs:
  - ev:8
