  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Women generally run the boat, assisted by younger men of the party who may
    not be walking along the shore.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The steersman sits on the after board and manages the helm and sail when the
