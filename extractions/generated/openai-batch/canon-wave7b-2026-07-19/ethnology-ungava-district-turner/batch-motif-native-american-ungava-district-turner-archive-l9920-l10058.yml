canonical_text:
  quote: ''
  summary: The passage describes a feast involving pemmican, a prohibition against
    carrying away remnants because it is believed this would drive deer away and cause
    starvation, the later inclusion of women to eat leftovers, a concluding dance,
    the feast-giver’s display of wealth after successful trapping, several games,
    and the construction and ritual/social use of drums, including beating the drum
    during illness, health, hunting success, and death to prevent the dead person’s
    spirit from troubling the living.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Guests eat a compound of rancid tallow, marrow, and pounded dried reindeer
    meat at the feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator is forbidden to take away the remaining pemmican.
  category: action
  evidence_refs:
