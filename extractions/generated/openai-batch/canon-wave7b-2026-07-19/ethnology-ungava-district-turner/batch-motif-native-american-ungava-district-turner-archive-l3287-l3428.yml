  text: Aged persons and orphans may have to wear cast-off clothing unless an orphan
    is adopted by someone well-to-do.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Young boys and girls are dressed alike, and females do not wear adult garments
    until puberty.
  category: sequence
  evidence_refs:
