  - ev:2
  - ev:3
- id: obs:5
  text: The hare leaped across the river, found the fire still smouldering in the
    net, and told its grandmother that it had got the fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the second narrative, a father advised the mother to leave their vermin-infested
    child behind when they went to distant friends' tents.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The mother told the boy she would put on his moccasins after putting on her
    snow-shoes, but then took her sled and left.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The boy cried, tried to follow in bare feet, and returned to the tent place
    after his mother was out of sight.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: A spirit of a dead man came to the boy, questioned him, and removed all of
    his lice except three.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The spirit put the boy on his back and followed the path made by the mother's
    sled.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: At a tree, the boy saw a porcupine and asked the spirit to kill it, but the
    spirit refused because it would make too much smoke.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: When they later came across a hare, the spirit put the boy down, caught the
    hare, and killed it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: At their night camp, the boy cooked the hare, gave the old man the lungs and
    kidneys, and ate the rest himself.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The next day they came to the tents, including the tent of the boy's father
    and mother.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: The spirit placed the boy outside near the door of his mother's tent and told
    him to go in.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The parents recognized the boy as the child they had deserted, and the boy
    said his grandfather had brought him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: The mother saw someone outside; the spirit rebuked the parents for leaving
    their child to perish, and the father told her to invite the old man into the
