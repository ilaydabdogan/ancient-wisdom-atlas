canonical_text:
  quote: ''
  summary: A hare avoids being killed in a tent by making a spark fall on its net,
    escapes through a hole in the tent top, outruns pursuers, leaps across a river,
    and returns home with fire. A second narrative tells of a lice-infested boy abandoned
    by his parents; a dead man's spirit removes most of the lice, carries him along
    his mother's sled track, helps obtain and cook a hare, brings him back to his
    parents' tent, and rebukes the parents for leaving him to perish.
  language: English
  quote_policy: summarized
