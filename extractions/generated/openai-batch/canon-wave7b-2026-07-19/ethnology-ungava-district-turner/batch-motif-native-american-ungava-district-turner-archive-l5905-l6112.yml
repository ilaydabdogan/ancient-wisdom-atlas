canonical_text:
  quote: ''
  summary: The passage describes a Hudson Bay Eskimo matching-piece game, its play
    procedure and stakes among northern Eskimo, children’s doll and snow-house play,
    a locally made violin copied from European instruments, and observations on art,
    including ivory carvings of birds, a polar bear, tattooed women, and oil bags.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Players sit with a set of pieces, one player mixes them in view of the others,
    and the players take portions of the pieces before attempting to match designs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The matching pieces bear paired designs with names including sled, canoe,
    navel, many, and the numbers one through five.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The game is known in the Ungava district, but the passage says only those
    who learned it from the Northerners can play it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Northern Eskimo are described as staking possessions on the game, and wives
    are described as being temporarily or permanently relinquished to the victor;
    the narrator also reports hearing that wives sometimes play and win themselves
    back.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Little girls play with dolls, build small snow huts, keep their playthings
    there, and play at keeping house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The described dolls are numerous in the collection and are said to be elaborately
    and accurately dressed, with additional doll clothing.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The only musical instrument observed by the narrator among these people was
    a locally made violin copied from instruments seen among whites.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The violin is made of birch or spruce, has two loosely twisted sinew strings,
    uses a bow with whalebone instead of horsehair, is resined with spruce gum, and
    is held across the lap when played.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: An old woman from whom the narrator obtained the instrument could play several
    airs that the people sang among themselves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The narrator states that weapons and implements are not adorned with animal
    carvings or conventional patterns, while garments and dolls show artistic skill.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Small ivory carvings from the so-called Northerners represent waterfowl, including
    loons, ducks, geese, sea pigeons, murres, and a female eider with two young on
    her back.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says the bird carvings show intended positions and actions, including
    a loon starting to swim away from something that alarmed it.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The bird carvings are made from walrus tusks or large mammal teeth and are
    described as skill tests made as toys for children, not as game pieces according
    to the narrator’s experience.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Additional carvings in the collection include a polar bear, two small human
    figures representing tattooed women, and two carvings representing bags of oil.
  category: object
  evidence_refs:
  - ev:9
