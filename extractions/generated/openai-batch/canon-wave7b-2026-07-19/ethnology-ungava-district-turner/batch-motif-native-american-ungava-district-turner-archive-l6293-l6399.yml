canonical_text:
  quote: ''
  summary: 'The passage contains several short folk-lore items: lice are explained
    as dropping from a punished upper-region spirit; mosquitoes arise from dirt flung
    from a badly cleaned coat; a solitary hunter discovers a fox who is also a wife
    and later loses her when he comments on her odor; two rivals create and move an
    island by feats of strength; a jealous man pursues two women who flee to a whale
    carcass; and an abused orphan boy receives secret help from a girl and calls to
    a man in the moon, who descends at the end of the supplied excerpt.'
  language: English
  quote_policy: summarized
