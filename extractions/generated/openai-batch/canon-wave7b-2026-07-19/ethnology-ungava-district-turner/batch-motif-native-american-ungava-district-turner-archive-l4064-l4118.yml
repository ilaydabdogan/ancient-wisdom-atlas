  quote: ''
  summary: The passage describes winter snow-houses, their internal conditions, the
    spring melting and collapse of these huts, makeshift shelters used afterward,
    hardship while waiting for shore ice to break, starvation among the weak, and
    later seasonal movement into sealskin tents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A snow-house may have a communicating passageway and an exterior opening closed
    with a snow block; large stored articles can be placed inside before the walls
    are completed.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator reports having slept in snow-houses and describes them as uncomfortable
    but necessary protection; an open doorway makes them cold, while closure over
    several people can make them excessively hot.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Within occupied snow-houses, family work is performed, skins are dressed and
    tanned, and food remnants, game offal, and hair from dressed skins can accumulate
    and putrefy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In spring, snow huts begin to melt and may fall down after several warm days;
    a hole may be patched with deerskin, but this gives limited night-time protection
    from cold.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After a structure falls, occupants may erect temporary shelters of deerskin
    or cloth on bare rocky ridges; poorer people may use only a deerskin blanket stretched
    over poles against northerly winds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: People remain in temporary camps until ice breaks from coves and bays, allowing
    hunters to obtain seals from the sea.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Poor wanderers search for food during the day and camp at night under the
    lee of rock with little covering, sometimes with clothing soaked by spray or rain.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Toward the end of winter, some people weakened and emaciated by lack of food
    starve before reaching the sea and are left to perish.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: When the season is warmer, people who possess sealskin tents move into them;
    these tents are usually made from large square flipper seal skins that are too
    heavy or unnecessary for other uses.
  category: object
  evidence_refs:
  - ev:7
