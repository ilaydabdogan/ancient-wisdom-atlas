canonical_text:
  quote: ''
  summary: 'The passage describes Koksoagmyut evening storytelling and gives several
    legendary accounts: the origin of the Inuit from a man created from nothing and
    a woman found in another land; the coming of Indians and white people through
    puppies set adrift by a great Tungaksoak; and two accounts of living things arising
    from tree chips or from seaweeds after waters receded. It ends with the beginning
    of a story about a widowed woman among strangers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Old men and old women tell remembered stories in the hut while younger members
    listen and fall asleep as the narration continues into the night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man is said to have been created from nothing, journeys in summer, finds
    a woman in another land, marries her, and the people there descend from the pair.
  category: sequence
  evidence_refs:
  - ev:2
