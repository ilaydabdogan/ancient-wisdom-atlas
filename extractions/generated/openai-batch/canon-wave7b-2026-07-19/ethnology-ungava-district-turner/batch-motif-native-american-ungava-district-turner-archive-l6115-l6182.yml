  - ev:3
- id: obs:4
  text: When the Eskimo are near starvation, the greatest Tungaksoak prophesies that
    light-haired, white-skinned people will arrive in an immense umiak.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Tungaksoak places one puppy on a chip and another puppy on an old sealskin
    boot and sets both adrift on the water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The puppy on the chip returns with Indians; later the other puppy appears
    associated with a strange white object like an iceberg, becomes a man who announces
    people with many curious things in their vessel, and then becomes a dog again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In one account, chips cut from a tree move as they fall; chips falling into
    water become water inhabitants, and chips falling on land become animals that
    later serve as food for humans.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In another account, water once covered the earth; people had abundant prepared
    food and knew no animals on land or in water.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the water goes away, seaweeds become trees, shrubs, bushes, and grass;
