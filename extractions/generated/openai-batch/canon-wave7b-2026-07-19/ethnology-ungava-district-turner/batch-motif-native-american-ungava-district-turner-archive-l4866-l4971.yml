canonical_text:
  quote: ''
  summary: 'Ethnographic description of land transportation by dog-drawn sled and
    of sled construction: dog teams, wooden runners and crossbars, sealskin lashings,
    iron runner shoes, and cold-weather frozen mud runner shoes polished and repaired
    with water or ice.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies the sled drawn by dogs as the universal means of transportation
    on land, with team size varying by distance, terrain, animal condition, and load.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The common dog team for general purposes is described as seven or nine animals,
    though from one to twenty dogs may be used.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sled construction varies slightly by region, especially where materials are
    difficult to obtain or a heavy sled is unnecessary.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A suitable tree, generally larch because of its strength, is selected for
    the sled runners.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Each runner is to be made from a single piece of timber, as free as possible
    from knots and crossgrain because those defects make the wood brittle in cold
    weather.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Crossbars or slats are fastened to parallel runners with heavy sealskin line
    threaded through holes and notches.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The sealskin line is soaked in water to make it flexible and able to stretch;
    as it dries, it shrinks tight around the slats and runners.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage says metal is not used for the slat bindings because it would
    snap in cold weather, while thong bindings permit the sled to move over uneven
    surfaces.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The bottom of the runner may be shod with trader-supplied hoop-iron fastened
    by countersunk screws.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: For very cold weather, a different shoe is made from swampy decomposed vegetation
    and fine soil that is boiled, stirred, and cleaned of debris.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The prepared mud is pressed by hand onto wetted runners and allowed to freeze
    solid before shaping.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After freezing, the owner planes the mud shoe to shape and smoothness.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The builder takes water in his mouth, sprays it along the mud shoe, and rubs
    it with a reindeer-skin mitten until the runner resembles black glass.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: If part of the mud shoe breaks away, the piece may be frozen on again with
    water; if it has crumbled, a shaped piece of ice may be frozen to the runner.
  category: sequence
  evidence_refs:
  - ev:8
