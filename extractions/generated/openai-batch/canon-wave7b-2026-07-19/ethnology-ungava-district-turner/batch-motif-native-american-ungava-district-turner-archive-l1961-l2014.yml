canonical_text:
  quote: ''
  summary: An ethnographic passage describes marriage arrangements, parental or sibling
    sanction, gift-giving to parents, coercive abduction, confinement, resistance
    by women, child and unborn-child betrothal, early motherhood, and a note that
    monogamy is said to be general but unstable.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that a woman is married after puberty when a male with
    enough physical strength can force her to become his wife, and that some females
    are taken before puberty.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says unions made before puberty produce few children, and those
    children are generally weakly.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Parental sanction may be obtained by favor or by giving skins, furs, and other
    valuables to the father and mother.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The girl is sometimes asked for consent; if unwilling, she may gain her mother's
    sympathy and the matter may be delayed or abandoned by the suitor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: If parents are not living, the brothers or sisters must favor the union.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: When other obstacles are removed and only the girl refuses, the passage describes
    her disappearing for two or three nights with a sympathetic female friend and
    later being abducted by her lover until subjected to his will.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In one reported instance, a girl was tied in a snow house for two weeks, not
    allowed outside, and eventually submitted.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The same woman later left her husband after two or three weeks; he said she
    had pulled nearly all the hair from his head and had bruised him by striking him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The same woman was later tied to a sled to make her accompany the man she
    subsequently chose as husband; old women pushed and persuaded her while younger
    women obstructed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Children are often mated at an early age, and two friends may promise that
    their unborn children will be mated to cement their fellowship.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Children promised in such arrangements are recognized as married and may address
    each other as husband or wife.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage says female marriageable age varies greatly, puberty occurs early,
    and girls aged fourteen or just over thirteen are reported as mothers.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage states that monogamy is generally the rule, but that a man seldom
    keeps a wife for many years because of counteracting influences; the line continues
    into a fragment mentioning jealousy.
  category: relationship
  evidence_refs:
  - ev:10
