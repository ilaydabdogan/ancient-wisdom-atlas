  summary: The passage describes trading-store interactions among Indians, spring
    goose-call hunting, a brief language classification placing regional Indians in
    the Cree branch, contact but little intermarriage between Indians and Inuit, and
    an ethnographic account of the Koksoagmyut around Fort Chimo, including their
    self-name, locality, range, physical descriptions, infant carrying, seasonal changes
    in complexion, and mixed families involving company servants and Eskimo women.
  language: English
