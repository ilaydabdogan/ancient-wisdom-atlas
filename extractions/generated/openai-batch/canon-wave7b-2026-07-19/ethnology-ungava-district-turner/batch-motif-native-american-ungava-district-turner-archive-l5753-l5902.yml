canonical_text:
  quote: ''
  summary: 'The passage describes several amusements and implements among Hudson Bay
    Eskimo groups: a cup-and-ball game using an ivory peg and ball or whale skull;
    children drawing lines in snow while reciting sounds identified as German numerals
    transmitted through Labrador Moravian missionary contact; a widely enjoyed winter
    football game using a stuffed skin ball and a whip; and a domino-like game using
    marked ivory pieces among people from the western end of Hudson Strait.'
  language: English
  quote_policy: summarized
