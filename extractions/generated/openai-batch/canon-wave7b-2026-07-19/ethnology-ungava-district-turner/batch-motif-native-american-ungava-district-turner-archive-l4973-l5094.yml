literal_observations:
- id: obs:1
  text: Bone-shod sled runners are described as uncommon in this district; the observed
    example used bone and reindeer horn on part of the curve and runner.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mud runner coating can loosen after warmth and can be damaged by rough ice
    or sand on snow.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A damaged runner surface is repaired by applying water and rubbing it evenly
    until an ice coating forms.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dog harnesses consist of two large nooses joined by straps, with sealskin
    or other available material used for the body harness.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Each dog has a trace of variable length attached to a common bridle, giving
    different positions to dogs in the team.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The variable trace system lets dogs move among rough ice but requires attention
    because traces can catch on projections.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The bridle is fastened to the sled runners by a yoke looped over toggles on
    the inner sides of the runners.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Loads are placed to avoid side projection and distributed along the sled,
    often with greater weight behind to help the sled follow or steer.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'Very rough ice can require several people: some attending the sled, one freeing
    traces, and one leading or driving the dogs.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The driver is described as always armed with a whip, and individual whips
    vary by maker.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The dog whip has a short handle with a wrist loop and a long plaited lash
    that may reach about 35 feet and weigh several pounds.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: Some users show great dexterity with the whip, and children practice with
    it when they are able to manage it.
  category: action
  evidence_refs:
  - ev:8
