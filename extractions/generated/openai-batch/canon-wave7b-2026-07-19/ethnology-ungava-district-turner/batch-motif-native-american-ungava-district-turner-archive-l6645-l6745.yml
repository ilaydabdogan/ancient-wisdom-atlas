  quote: ''
  summary: The passage describes attitudes toward death, shamanic and trader-supplied
    remedies, marriage formation and dissolution, polygyny and domestic conflict,
    gendered labor, childbirth and infant-care restrictions, rarity of twins, and
    presumed paternity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that death is approached with little terror and awaited
    with indifference.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Remedies for disease include drum beating and the shaman's mumblings; the
    shaman claims control over a spirit causing disease and death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Trader-supplied potions, powders, and liniments are used, and patients are
    reported sometimes to recover or ask for more of the same kind.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Marriage is described as consent to live together, obtained by request if
    possible and by force if necessary.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A suitor seeks the consent of a girl's parents or near relatives through presents;
    if the girl refuses, she may be forcibly taken to the man's or his father's tent.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The marital bond is described as loose and dissolvable by either party; polygyny
    is reported among wealthy men, with additional wives taken principally for labor.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Co-wives may fight among themselves; the husband may watch until the conflict
    goes too far and then beat the women. Women are also said sometimes to assault
    husbands.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In a reported incident near Fort Chimo, an enraged wife stripped her husband's
    clothing, tore down the tent, carried property to a canoe, paddled away, later
    relented, and relations resumed; the man was afterward ridiculed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In another reported incident, two men competing for a woman fought from canoes
    with deer spears; one was killed, and the survivor obtained the woman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Women are said to perform much manual labor, including bringing home food
    slain by husbands, fetching wood and water, tanning skins, making clothing, erecting
    tents, and hauling sleds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After birth, the child is not allowed nourishment until the third day, no
    water is to touch its body, and it is swaddled with skins, cloths, and sphagnum
    moss.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Girls are described as neglected while boys are given advantages and soon
    display a sense of importance.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Twins are said to be rare; when paternal origin is obscure, the man who has
    the woman as wife at the time of birth is supposed to be the child's father.
  category: relationship
  evidence_refs:
  - ev:8
