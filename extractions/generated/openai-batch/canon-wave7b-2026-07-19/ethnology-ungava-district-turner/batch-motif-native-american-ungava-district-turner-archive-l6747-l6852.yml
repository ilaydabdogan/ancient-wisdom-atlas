canonical_text:
  quote: ''
  summary: The passage describes Naskopie mortuary customs, mourning, dream divination,
    patron spirits, shamanic mediation, animal spirits, and beliefs about particular
    birds and a mouse species. It reports grave burial with a branch marker, tree
    suspension and scaffold burial, dream interpretation through drum trance, propitiation
    of spirits, a sky-dwelling great spirit, indestructible animal souls, the Canada
    jay as warning animals of hunters, a mouse unable to cross human tracks, and owl-related
    precautions involving a suspended garment and the spirit Wiq-ti-qu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the trading station, the passage says a Naskopie corpse was placed in a
    rudely constructed coffin in a shallow sandy grave, covered with dirt, and marked
    at the head with a small tree branch.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Away from the trading post, the dead were suspended from tree branches when
    the ground was too frozen to dig, with an effort to return in summer and inter
    the body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A distinguished person could be buried where long-maintained tent fire had
    thawed the ground enough to cover the body, after which the tent was moved.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports evidence that scaffold burial and suspension from trees
    were formerly practiced, while subterranean burial was introduced by missionaries.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mourning varied according to the deceased person's position in life; a favorite
    child's death could cause prolonged grief in the mother, and friends usually took
    the body to its final resting place while relations seldom accompanied it.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Dreams were treated as nighttime communication with spirits watching over
    daily occupations, and certain persons were consulted to divine dreams.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: During dream divination, a drum was used, the interpreter entered a stupor
    or trance, and then revealed the dream's meaning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says every object and each person had a patron spirit, that spirits
    were considered bad by nature, and that they had to be propitiated with acceptable
    offerings to secure favor.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Shamans or medicine men were consulted to identify a harmful spirit's form;
    the spirit was said to appear in the darkness of the conjuring house and be appeased
    by atonement made known through the shaman.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Minor spirits were described as being under the control of a single great
    spirit dwelling in the sky.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Each animal was said to have a protective spirit, and the soul of animals
    was described as indestructible, able to reappear after material destruction,
    and able to return to a home after death.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Canada jay was said to inform animals of the approach of Indians, who
    therefore rarely failed to kill the jay when they found it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A species of mouse was believed to dread humans so much that it died if it
    wandered near a person's track and was unable to cross the path.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: The appearance of certain owls near camp at dusk caused alarm; people suspended
    an unworn garment so the bird or Wiq-ti-qu would know they were not too poor to
    have extra garments.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The short-eared owl was associated with lower lands, and the Indians were
    said to choose higher camping sites to escape it.
  category: setting
  evidence_refs:
  - ev:10
