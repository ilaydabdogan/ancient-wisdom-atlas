canonical_text:
  quote: ''
  summary: An ethnographic description of family travel by umiak, camp foraging and
    hunting, opportunistic killing of animals, women’s skinning of seals and birds,
    seasonal reindeer hunting for winter clothing, preparation and tanning-like treatment
    of skins, and tools and techniques used in sewing garments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The entire family accompanies expeditions, and females often row the umiak.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During travel, the party may become animated when something ahead attracts
    attention, such as a half-fledged bird, and pursue it until captured.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At camp, men seek larger game while women and children search the shore for
    living creatures.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: At food-rich localities, the party kills more animals than required, and excess
    remains are left to putrefy on rocks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Women skin seals and birds obtained during the trip.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bird skins are removed by cutting off the wings at the body, extracting flesh
    and bones through the incision, turning the skin inside out, removing grease,
    drying the skin, and preserving it for footwear or hand-cleaning.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the reindeer-skin hunting season, women help prepare flesh and bring
    wood and water while men watch for herds on land or crossing water.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Women dry reindeer skins over poles, roll and store them, and later suitable
    skins are selected for winter garments at the permanent winter camp.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Skins are moistened, scraped, wetted with urine to make them more pliable,
    dried, worked, and cut into apparel shapes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Sewing thread is made from an untwisted strip of sinew prepared by splitting
    and smoothing it.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Needles are obtained from traders, though small bone imitations are sometimes
    used; older bone needles have mostly been replaced by metal ones.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The thimble is a stiff sealskin ring worn on the first finger, and the needle
    is pointed toward the operator while sewing.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: Women are described as highly dexterous with the knife when cutting and trimming
    skins.
  category: attribute
  evidence_refs:
  - ev:6
