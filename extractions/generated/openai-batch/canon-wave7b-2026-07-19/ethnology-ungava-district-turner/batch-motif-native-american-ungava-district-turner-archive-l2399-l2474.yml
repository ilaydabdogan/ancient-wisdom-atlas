canonical_text:
  quote: "“This Tung ak is nothing more or less than death”"
  summary: The passage describes religious authority, a spirit-governed world, malignant
    personal guardian spirits requiring propitiation, portable material forms for
    such spirits, transfer of a harmful spirit to another person through an object,
    local guardian spirits of natural places, and the great spirit Tung ak, identified
    with death and approached by the shaman.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The people are described as having no chief, but as recognizing a leader influenced
    by a conjurer or medicine-man; these two decide collective action.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Affairs of life are said to be controlled by spirits, with individual spirits
    ruling elements and all being under a greater spirit.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Each person is said to be attended by a malignant special guardian whose aid
    is obtained by propitiation with food, water, and clothing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The personal spirit is often represented in material form as a doll carried
    by the person; for success in hunting it may be carried in the ammunition bag.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Misfortune is attributed to the attending spirit; if the spirit refuses assistance,
    the person may punish it by depriving it of food or clothing or stripping its
    garments.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A person unable to control the spirit may give it unknowingly to another person,
    often through a bundle of clothing or a bag, transferring the spirit’s influence
    to the recipient.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Spirits are assigned to the sea, land, sky, winds, clouds, natural things,
    and local features such as coves, points, islands, and prominent rocks.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The minor spirits are described as malignant, unequal in power, and requiring
    offerings from those who wish to visit their localities.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The minor spirits are under the control of Tung ak, and the shaman or conjurer
    alone is said to deal with Tung ak and enlist his assistance.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tung ak is identified with death and is said to torment people so their spirits
    may dwell with him.
  category: relationship
  evidence_refs:
  - ev:8
