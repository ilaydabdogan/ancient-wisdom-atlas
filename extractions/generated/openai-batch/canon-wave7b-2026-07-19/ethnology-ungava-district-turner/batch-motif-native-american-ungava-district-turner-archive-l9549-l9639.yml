canonical_text:
  quote: ''
  summary: 'The passage describes the scarcity of beaver in the Ungava district, explains
    that their limited distribution is attributed to lack of food, and records several
    methods used to capture them: opening lodges after blocking underwater exits,
    draining water away from a lodge, shooting beavers on moonlit water, and setting
    a deerskin purse-net at an exit. It also notes the danger of beaver bites and
    the value of beaver flesh as food.'
  language: English
  quote_policy: summarized
