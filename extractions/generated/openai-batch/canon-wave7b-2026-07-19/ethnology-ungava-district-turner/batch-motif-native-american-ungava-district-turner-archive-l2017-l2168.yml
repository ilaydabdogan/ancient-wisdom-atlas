canonical_text:
  quote: ''
  summary: Ethnographic description of marriage, separation, polygyny, wife exchange,
    conjurer-mediated coercion involving disease and an evil spirit, household hierarchy,
    eldest-son precedence, and dependent families joining a headman’s community among
    the Ungava district Inuit groups described by Turner.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Separation of couples is described as simple: the party who wants separation
    leaves with little ceremony, though sometimes is sought and compelled to return.'
  category: action
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:2
  text: In rare instances, a compatible pair with a disposition to continence remains
    together for life.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Girls may bear children before being taken as wives, and such births are said
    not to destroy the mother’s respectability or prevent her from obtaining a husband.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Illegitimate children are usually cared for by an aged woman who devotes her
    energies and affections to the child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The usual number of children is given as two or three, though some couples
    may have as many as ten, and many children die in early childhood.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: A prosperous husband often takes a second wife, with or without the first
    wife’s approval; three or four wives sometimes occur, and one head of family reportedly
    had five wives.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The first wife’s household duties are lessened by a second wife, but the husband’s
    favors are divided, and the second wife may cause the first wife to leave or may
    herself be sent away.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: Two or three wives living in a single snow house are said to be brought into
    close intimacy and often quarrel.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:9
  text: The man is described as settling co-wife disputes by physical strength rather
    than affection.
  category: action
  evidence_refs:
  - ev:2
- id: obs:10
  text: Because females outnumber males and local kinship is close among the Koksoagmyut,
    many males seek wives from other localities, connecting distant people.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: Wives are often taken for a period, and exchange of wives is described as
    frequent, with parties sometimes returning without concern.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:12
  text: Community sentiment may compel a woman to leave her chosen partner and join
    another man who has bribed a conjurer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The conjurer is described as deciding that a diseased person will not be relieved
    from an evil spirit until the woman lives with the man who wants her.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:14
  text: A couple targeted by such a plot can escape separation by fleeing to another
    locality until the diseased person recovers or dies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: After recovery or death of the invalid, the conjurer declares that the couple’s
    cohabitation as man and wife caused the affliction.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:16
  text: A designing woman may cause a man to cast off the legal wife to whom he is
    attached and live with her instead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:17
  text: A cast-off woman may take her children to live with her relatives, where they
    become menials and she accepts poor support so her children may be cared for.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:18
  text: Some wives are considered unlucky; after trial they are cast off and then
    avoided by men who fear they may work a charm on them.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:19
  text: Within social relations, the head of the family comes first, the oldest son
    second, and other sons follow according to age.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:20
  text: Sons of the first wife take precedence over sons of second or third wives,
    while sons of a deceased first wife and a later wife may be treated as sons of
    one wife for ranking purposes.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:21
  text: When the father becomes superannuated or the sons are old enough to support
    him, management of affairs devolves on the eldest son.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:22
  text: An aged father may live among great-grandchildren, who are said to show respect
    for their ancestor.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:23
  text: Sons with wives and children may form a community, locally called by white
    people the head man’s “gang,” directed by the leader.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:24
  text: Families reduced by death or marriage may join such a community for protection
    and acknowledge dependence on the leader.
  category: action
  evidence_refs:
  - ev:8
