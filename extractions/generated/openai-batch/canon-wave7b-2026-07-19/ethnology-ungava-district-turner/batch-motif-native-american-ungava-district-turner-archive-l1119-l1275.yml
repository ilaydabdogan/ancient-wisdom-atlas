canonical_text:
  quote: ''
  summary: 'The passage gives an ethnographic account of the Tahagmyut Innuit: their
    name is explained through a shade/shadow term and contrasted with a light/sunshine-named
    group; their rugged homeland, seasonal sledge trade journeys, distinct language
    and customs, mortuary and elder-treatment practices, gender and sexual sanctions,
    gambling with marked walrus-ivory pieces, and strength games are described.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Tahagmyut are described as known by that name to other subdivisions and
    to themselves; the term is derived from a word for shadow and is contrasted with
    a group glossed as people of light or sunshine.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: White traders call the group “Northerners,” and the passage says they are
    little influenced by contact with white traders.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The region where they dwell is described as rugged, with mountain spurs, short
    ranges, deep valleys, and ravines.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Only a few sledges are annually sent to trading posts to carry furs and other
    commodities for barter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Certain persons who have made the trip and know the trail are selected and
    commissioned to barter goods on behalf of individuals.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sledge line forms by joining parties along the coast, then travels south
    toward frozen morasses, Leaf River, and Fort Chimo.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The homeward journey is often made along the coast because snow remains longer
    there, but warm weather may delay travelers until summer or even the next winter.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some members of these traveling parties have not seen white men before arriving
    at Fort Chimo, and women are often part of the party.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Their language is described as dialectically distinct, with harsher tones,
    deeper gutturals, and more prolonged vowels.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'The dead are said to be treated without ceremony: limbs are lashed to the
    body and the corpse is exposed away from immediate camp sight.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Old and infirm dependent people are described as being strangled or left to
    perish when the camp is moved.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Women are described as held in little respect, while men are said to be jealous
    of wives’ favors; female incontinence is punished, and a persistent male offender
    may be killed by an injured lover or husband.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Gambling is practiced by both sexes, and lives, wives, possessions, and garments
    may be staked.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The usual game uses flattened pieces of walrus ivory marked with dots and
    named crude designs, which must be matched.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: Other amusements include tests of personal strength, such as wrestling and
    leaping.
  category: action
  evidence_refs:
  - ev:8
