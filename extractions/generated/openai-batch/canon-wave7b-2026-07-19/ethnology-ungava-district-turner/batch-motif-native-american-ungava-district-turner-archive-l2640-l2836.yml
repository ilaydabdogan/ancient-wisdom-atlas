canonical_text:
  quote: ''
  summary: The passage describes an Ungava Inuit hunting talisman or magic doll representing
    the conjurer Sa‘pa, with attached amulets including a small doll, wooden pieces,
    bullets, and a hastening object used when sighting game. It then discusses shamanic
    influence over illness accusations and marriage relations, including cases where
    widows or wives are blamed for sickness through charms or jealous spirits. A further
    account describes a woman hearing unexplained rapping, an old woman interpreting
    it as the hunger of the woman’s dead brother, and the preparation of food for
    a nurse who is renamed after the dead. The passage closes with a statement that
    all things have attendant spirits and that animal spirits survive bodily killing.
  language: English
  quote_policy: summarized
