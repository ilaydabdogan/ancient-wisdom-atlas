canonical_text:
  quote: ''
  summary: The passage describes Ungava District Eskimo food practices, including
    raw, frozen, boiled, heated, fermented, and oil-dipped animal foods; limited use
    of vegetable foods and drinks; a seal-hunt return followed by communal eating
    and storytelling; and adult use of tobacco, snuff, seal-skin pouches, and ivory
    snuff spoons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Food is eaten raw under certain conditions, cooked when convenient, and frozen
    food is consumed in large quantities.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Deer flesh and fat, bird entrails, and incubated eggs are described as eaten
    directly, including while animal tissues are still warm or recently killed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Frozen deer meat from the previous fall is cut into chunks, distributed among
    an expectant crowd, and sometimes warmed or thawed before a fire.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Deer blood is mixed with the stomach contents of the animal and eaten raw,
    boiled, or after being set aside to ferment, frozen, and eaten.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Seal fat and seal blood are heated in a kettle; the oily liquid is eaten,
    lean flesh is dipped in oil, and pure seal or whale oil is not described as ordinary
    drink except medicinally as a laxative.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Vegetable foods are little used except near trading stations; seasonal berries,
    especially akpik or bake apple, are eaten eagerly, and women sometimes make herbal
    infusions as a substitute for tea.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: People drink large quantities of water, and in very cold weather they may
    drink water heated on a fire, saying that hot water weakens them less than cold
    water.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: When a seal is killed, the hunter signals success from a distance; people
    in camp shout, the seal is drawn ashore and skinned, and the flesh is eaten raw
    or divided among persons.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Seal blood is collected and mixed with hot liquid when meat is boiled, producing
    a dish eaten by adults and children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After the seal is brought in, the feast continues until the flesh is consumed
    and people are full; stories are told and general good humor prevails.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Adults use tobacco for smoking, chewing, and snuff; plug tobacco is carried
    in a seal-skin pouch, and snuff is prepared by drying and pounding tobacco.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: Snuff is kept in a small bag with an attached ivory spoon, and the spoon is
    used to place snuff at the nostril for inhalation.
  category: object
  evidence_refs:
  - ev:7
