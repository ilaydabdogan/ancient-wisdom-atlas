canonical_text:
  quote: ''
  summary: The supplied passage contains a tale in which a young man dreams that a
    deer asks him to live with the deer. A doe invites him, he consents, leaves most
    of his hunting gear, and enters the deer home associated with a large hill and
    valley path. The deer feed him and promise deer for his father. His father and
    other people set snares to recover him or catch deer, but only some deer are taken;
    the young man remains with the deer. The passage then begins another tale in which
    a mother wolf sends her daughter to seek the otter as her lover. The wolf daughter
    finds the otter at an ice hole, insists he come live on land, threatens to smother
    him in the water, and the passage breaks after snow blocks his breathing holes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man tells his old father that he dreamed a deer asked him to come
    live with the deer, and the father interprets the dream as a good sign for killing
    deer.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: While hunting, the young man sees a herd; a young doe approaches, asks him
    not to shoot, says her father sent her, and invites him to live with the deer
    forever.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man objects that he lives on deer, in a tent, and needs fire and
    water; the doe replies that the deer have fire, water, meat, and will provide
    deer for his father.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The doe points to a large hill as the deer home, tells the young man to leave
    his deerskin mantle, snowshoes, and arrows on the ground, and to keep his bow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The doe and young man travel by a valley path toward a steep hillside where
    many deer are present.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The father of the doe speaks to frightened deer, asks the young man if he
    is hungry, gives him meat and fat, and asks whether the young man's father is
    also hungry.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The old father finds the cast-off mantle, snowshoes, and arrows, sees tracks
    leading through the valley toward the deer home under the hill, and tells others
    that his son has gone to live with the deer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The old father and other people prepare snare nooses and set them among bushes
    on the valley path.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The old buck leads deer and the young man through the valley so that some
    deer will be taken; some deer are caught in snares, but the young man passes beyond
    them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After finding the young man's footprints and the mark of his dragged bow among
    the escaped deer tracks, his father says to let him go if he can live with the
    deer.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: A mother wolf tells her daughter to seek the otter as her lover because the
