canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing Koksoagmyut/Innuit social responses to
    offenders and dependent elders: exclusion from huts and food, communal stoning
    of murderers, vengeance by next of kin, the tabooing of Akpatok after a murder
    because victims'' ghosts might seek relief without proper offerings, abandonment
    or killing of elderly people without support, and a Fort Chimo case in which a
    proposed strangling was postponed.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says years of arduous life produce wrinkles, haggardness, and
    general physical breaking down that is seldom recovered from.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Koksoagmyut are described as usually peaceful and mild-tempered, with
    affrays rare, though jealousy may lead to murder.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person whose character is no longer tolerated by the community is forbidden
    to enter huts, partake of food, or hold intercourse with the rest.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If such a person is guilty of murder, several men may surprise him and put
    him to death, usually by stoning, with the action openly supported by public opinion.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: For premeditated murder, the next of kin is said to have the duty of avenging
    the deed, even if years pass before an opportunity arises.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: If an intended victim of revenge kills the assailant and becomes guilty of
    two murders, the people may soon decree his death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The island of Akpatok is described as tabooed after the murder of part of
    a wrecked vessel's crew, and people avoid it for fear the victims' ghosts may
    appear and seek relief requiring proper offerings.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: Aged people with no relatives for subsistence are said to be quietly put to
    death; an old woman may be neglected until too weak to keep up when the group
    moves.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Men may retrace their steps under pretexts such as recovering lost objects,
    and a followed track may reveal a corpse with stones piled around it and thongs
    binding it.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: At Fort Chimo an old woman with one sore eye was proposed to be strangled,
    but the proposal was postponed when the eye improved the next morning.
  category: sequence
  evidence_refs:
  - ev:10
