canonical_text:
  quote: ''
  summary: 'The passage describes reindeer-hunting weapons and especially snares:
    their materials, braided construction, placement in a narrow defile among bushes
    and trees, the coordinated driving of deer into the nooses by surrounding people
    and concealed hunters, the killing or choking of trapped animals, occasional capture
    of two bucks in one snare, and decorative variations such as bead strands and
    red coloring.'
  language: English
  quote_policy: summarized
