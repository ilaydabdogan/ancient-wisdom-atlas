canonical_text:
  quote: ''
  summary: 'The passage describes household utensils and portable containers: wooden
    vessels for water and drinking, spruce-bark berry baskets, buckskin-topped baskets
    for small items, deer-leg-skin bags for travel goods, pestles for food preparation,
    spoons for lifting meat, and pot-hooks for suspending pots over fire. It also
    notes comparisons to Yukon River Indian vessels and to a possible copied ladle
    form.'
  language: English
  quote_policy: summarized
