canonical_text:
  quote: ''
  summary: 'The passage describes Ila iron-smelting preparations and restrictions:
    charcoal is carried to the kilns; smelters and the doctor observe strict sexual
    and behavioral taboos; women in the village have related restrictions; a dream
    emission requires public disclosure and purification at a crossroads bower; menstruating
    women and dark cloth are excluded; lewd songs accompany the work; and the doctor
    performs a medicine rite before packing the kiln.'
  language: English with Ila terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Charcoal is dug out after several days and carried in long receptacles called
    miembo to the kilns for packing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The smelters staying in their shelter are described as being under strict
    taboo.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A smelter who visits the village must not have sexual connection with his
    wife, enter his house, or sit on his bed; if his wife cooks for him, he eats at
    the door.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women staying in the village may not wash, anoint themselves, or wear ornaments
    that might attract men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The women in the village are said to be in the same state as recently bereaved
    widows.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Sexual transgression by a man is said to cause the smelting to fail.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: If the fire burns badly or the ore is not properly smelted, wrongdoing is
    inferred, and the doctor is said to identify a defaulter by examining the material.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The identified defaulter is called a warlock and accused of bewitching the
    iron.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: While moulding the kilns, the men may not drink water and may drink only namenze.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: If a man sleeping in the shelter dreams of a woman and has an emission, he
    must disclose it to the others.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The doctor purifies the man by placing leafy branches at a crossroads to form
    a bower, performing incantations, sprinkling medicines, and having the man run
    through the bower along the roads.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The doctor himself is taboo and has no relations with wives or other women
    during the operations.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The doctor selects one man called mwinangu, translated as “my wife,” whose
    task is to cook for him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The doctor may not cut his hair or be shaved during the operations.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Menstruating women may not come near the camp, and no one wearing dark cloth
    may come near because dark or black is described as unlucky.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Songs sung during the operations are described as mostly lewd, and some are
    sung in response to a woman passing at a distance.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: On the morning when the kilns are to be packed, the doctor goes into the veld
    chewing medicines, sits facing east with wide eyes, then returns to begin the
    work.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: The doctor spits chewed medicines onto the stone in the kiln; the passage
    states that without this medicine there is no iron.
  category: action
  evidence_refs:
  - ev:9
- id: obs:19
  text: The kiln packing is done almost entirely by the doctor, while others hand
    him charcoal.
  category: relationship
  evidence_refs:
  - ev:9
