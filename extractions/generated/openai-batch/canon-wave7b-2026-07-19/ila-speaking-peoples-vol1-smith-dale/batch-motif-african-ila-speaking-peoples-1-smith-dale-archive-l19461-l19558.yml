canonical_text:
  quote: ''
  summary: The passage reports Ba-ila customs and anecdotes concerning infants considered
    dangerous or anomalous, including a child born with a tooth, the disposal of such
    children by water or a hole, burial of a living child with a mother who dies in
    childbirth, and several examples and explanations of suicide, including the term
    malweza for taboo self-killing or intended self-killing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mother is described as unable to give loud customary expression to grief
    and required to acquiesce to the custom, though some mothers rebel.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman who had given birth overheard older women discussing destroying her
    child because it had been born with a tooth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mother took the child, left the hut, and ran for protection, but was overtaken;
    the child was carried away to be destroyed.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Children of this kind are said in the passage to bring misfortune, and the
    Ba-ila are described as preferring to destroy one child rather than have whole
    families suffer.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The described method for killing a doomed child is for a woman to carry the
    child on her back in a skin, go to a river or a large hole, loosen the fastening,
    let the child fall into the water or hole, and walk straight on without stopping
    or looking back.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A living child born of a woman who dies during or soon after childbirth is
    buried with its mother, with the passage noting that the motives differ from the
    preceding cases.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Suicide among the Ba-ila is described as not uncommon, with methods including
    smoking mufwebabachazi, hanging, and spearing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A boy at Chiyadila, reproved by his mother for leaving his baby brother, left
    other children who were going to set bird-traps and hanged himself by a cord to
    a little fig tree.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Women in unhappy marriages are described as often threatening suicide and
    sometimes carrying it out; one of Malukwa's wives was found dead with a pipe after
    smoking mufwebabachazi.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At Banamwazi, after a marital quarrel over a basket of meal, a wife attempted
    poison and hanging, and her husband, believing she was not recovering, stabbed
    himself three times; both recovered.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: 'One attempted suicide is described as unserious: a man at Lubwe pretended
    to stab himself in the thigh, made only a small wound, and was laughed at.'
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: A man accused of stealing attempted suicide by stabbing himself in the abdomen
    and later claimed cattle from the accusers, saying they had caused him to stab
    himself.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: A man named Julwi committed suicide after murdering a child, and his father
    then also killed himself.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The passage lists trouble, remorse, shame, pique, and sorrow as reasons for
    suicide.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:15
  text: An informant says suicide does not destroy a fault but leaves it to relatives
    to settle, and says that in former times people did not weep for a suicide because
    self-killing was malweza.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:16
  text: The informant also says that even intending suicide without carrying it out
    is malweza and that one of the person's relations will suddenly die in consequence.
  category: speech
  evidence_refs:
  - ev:13
