  evidence_refs:
  - ev:8
  confidence: high
  cautions: Although twins are mentioned, the passage does not provide a broader twin
    narrative.
- id: motif:5
  label: Protective boundary that disables thieves
  taxonomy_refs: []
  basis: A ring of root powder around a field is said to keep away thieves by dislocating
