canonical_text:
  quote: ''
  summary: The passage introduces a doctor's remuneration and then lists named plant-based
    medicines in his outfit, describing their preparation and uses for bewitchment,
    pain, chest complaints, spirits, vomiting a disease object, bone-setting, conception,
    toothache, twin after-birth disease, trapping, diarrhoea, impotence, butter-making,
    menstruation, crop growth, anti-theft protection, sores, leprosy, and childbirth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One doctor treated a patient for four months and received money and goods;
    another doctor cured sores and claimed two women as slaves as payment.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The list is presented to show the range of one doctor's practice and his ideas
    about the remedies.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Inkandangombe roots are scraped, mixed with fat, rubbed on the body, and also
    soaked in hot water for drinking to treat someone said to be bewitched.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kapululu root scrapings are smoked in a pipe, and powder is rubbed into incisions
    before cupping, for painful afflictions described as disease to be driven out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Malumbwe tuber is peeled and eaten or soaked in water and drunk for chest
    complaints.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kalangu tuber is mixed with fat and used to anoint a person's body to keep
    off spirits.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mufwamba root is used as an emetic for kafungo; vomiting is expected to bring
    up a small white object in which the disease is located, and failure to vomit
    it is said to let it enter the heart and kill the patient.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mukulu-ufumbete roots are cooked and applied hot while manipulating a broken
    limb; a reed or grass mat splint is bound on with bark strips and later removed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Musekese and Kanembe roots are used to induce conception by wearing a threaded
    root under the arm, rubbing scrapings mixed with fat on the body, drinking soaked
    root liquor, or mixing root powder with porridge.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Mulembela roots are scraped, mixed with butter, rubbed on the body, and also
    drunk as a decoction to keep off evil spirits.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: If a person passes over the buried after-birth of twins, the passage says
    that person may get chinsangwa, with swollen feet and legs and a split head; sniffing
    Mufufuma roots is said to draw out the disease.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Tunkotonkoto root scrapings are mixed with fat and placed on a trap string
    and in a trap hole to enable a trapper to ensnare game.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Chibubu roots are prepared as powder eaten with flour and as a decoction drunk
    for diarrhoea.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Mubanga root is warmed over a fire and rubbed on the male organ, and Mushibampeyo
    powder is blown into the orifice, as a treatment for impotence.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Mulebelebe tuber is put into a churn to induce butter to come.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: Mukona root decoction is drunk and an ointment is rubbed on the abdomen to
    promote overdue menstruation.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: Mukuba root fragments are planted with seed to promote grain growth and prevent
    sorcerers from witching it away.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: Mukunku root powder is scattered in a ring around a field to keep away thieves;
    a thief crossing it is said to become helpless through bodily injury.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:19
  text: Chibumbwe and Mushenshe are used to foment and dust syphilitic sores, while
    Mubumbwe and Mukololo are used similarly for leprosy sores.
  category: action
  evidence_refs:
  - ev:13
- id: obs:20
  text: Shikantjo roots are rubbed on a midwife's hands before she stretches the vaginal
    passage, and Muyeye decoction is given to a parturient woman to promote birth.
  category: sequence
  evidence_refs:
  - ev:14
