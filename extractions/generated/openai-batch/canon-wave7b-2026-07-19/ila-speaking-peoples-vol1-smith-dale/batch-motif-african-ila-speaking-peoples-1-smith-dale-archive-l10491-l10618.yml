  evidence_refs:
  - ev:12
  confidence: high
  cautions: The account is an ethnographic report of a protective medicine, not a
    developed story.
- id: motif:6
  label: Hunting or trapping success charm
  taxonomy_refs: []
  basis: Tunkotonkoto is applied to a trap string and hole to enable a trapper to
    ensnare game.
  evidence_refs:
  - ev:9
