  summary: The passage gives an ethnographic description of physical characteristics
    among the people discussed, distinguishing two described physique types, noting
    gradations between them, stating that the types do not correspond to social rank,
    and describing variation in skin colour by age, body area, and sickness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that considerable variation in physique exists among the
    people described and that two distinct physical types can be traced.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: One described type is tall, strong, lean rather than corpulent, long-legged,
    narrow-hipped, broad-shouldered, with a finely shaped head, longish neck, long
    rather arched nose, thin nostrils, small mouth, relatively thin lips, small hands
    and feet, and tapering fingers.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The other described type is short, heavy-bodied, tending to corpulence, bull-necked,
    with coarse features, low forehead, squat nose, broad depressed bridge, wide wings
    of the nose, large mouth, large lips, and gross hands and feet.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says individuals corresponding to both described types are found,
    with numerous gradations between them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that neither physical type can be identified as aristocratic
    or plebeian, because chiefs and slaves are found in both types.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'The passage describes skin colour as varying considerably: newborn babies
    are described as dirty yellow and darkening as early as the second day, while
    young people and adults range from chocolate brown to almost black.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that the skin of the palms, soles, and armpits is always
    lighter than the rest of the body.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage reports repeated observations that people lose much colour when
    sick.
  category: attribute
  evidence_refs:
  - ev:6
