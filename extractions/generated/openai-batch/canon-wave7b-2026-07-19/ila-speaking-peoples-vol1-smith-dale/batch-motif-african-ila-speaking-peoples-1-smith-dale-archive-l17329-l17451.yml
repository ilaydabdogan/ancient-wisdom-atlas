canonical_text:
  quote: ''
  summary: The passage enumerates Ba-ila Buditazhi offences against personal respect.
    These include throwing ash on a person, misnaming someone, falsely claiming or
    assigning kinship, throwing someone onto excrement, false accusation or false
    witness, accusing someone of witchcraft or warlock status, questioning an innocent
    person about a fault, and informing on someone. Such offences may result in seizure,
    ransom, damages, or cattle compensation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Buditazhi is presented as a category of Ba-ila offences against personal respect
    in which an offender may be seized and held to ransom.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Throwing ash upon a person is described as a great offence, and ash is associated
    with a common oath formula.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Persons wishing to enslave themselves, and slaves wishing for a new master,
    may throw ash over another person; the act can make the thrower the recipient's
    slave and create a ransom claim against the old master.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Calling a person by the wrong name is treated as an offence; in the cited
    case a woman was seized and redeemed by payment of a cow and an ox.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Falsely claiming relationship with a person, or addressing someone as a relation
    when he is not, is described as an offence that can lead to damages.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Misinforming one person that another is his relation can make the misinformer
    responsible for causing Buditazhi.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Throwing someone down on excrement is a fault even if not intentional or angry;
    a court example involved a cow claim after boys were playing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: False accusation or false witness is said to make a Mwila very angry; an unsubstantiated
    charge can result in the accuser being held to ransom.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Accusing a person of being a warlock or witch is described as a special and
    very serious form of false accusation.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:10
  text: One cited witchcraft-accusation case includes a woman calling a man mulozhi
    after he did not salute, a counterclaim about misnaming, an attempted seizure,
    a beating, and payment of an ox for the beating.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:11
  text: Another cited case includes a man consulting a woman diviner about his wife's
    illness and later being accused by two men of being mulozhi and of nocturnal activity;
    he denied the charge and claimed compensation.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:12
  text: Questioning an innocent person about a fault, or even wondering aloud whether
    he did it, is called kuzunga and can lead to damages.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:13
  text: Informing on a person so that he gets into trouble is described as rare and
    as a crime.
  category: action
  evidence_refs:
  - ev:14
