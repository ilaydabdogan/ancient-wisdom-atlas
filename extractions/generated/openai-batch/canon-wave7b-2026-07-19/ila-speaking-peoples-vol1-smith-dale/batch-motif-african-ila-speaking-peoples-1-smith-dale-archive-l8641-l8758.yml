canonical_text:
  quote: ''
  summary: The passage lists Ila names, perceived causes, symptoms, taboos, and treatments
    for leprosy, malarial fever, general diseases, ghost-caused complaints, respiratory
    complaints, and circulatory swelling. Treatments include plant roots and leaves,
    decoctions, washing, drinking, cupping, fumigation with smoke, songs to drive
    away ghosts, and contact or transfer rules surrounding abortion-linked illness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The heading names Lukalo as a leper woman.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: For leprosy, the passage mentions food taboos involving eland and zebra meat
    and lists plant-root treatments used as washes, drinks, smoked bundles, or lotions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ba-ila are said to have no definite name for malarial fever; symptoms
    are described as severe headache or being dead in the head or whole body, and
    treatments include leaf juice, nostril and ear application, and cupping.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mushongo is described as sudden collapse and unconsciousness, attributed to
    hostile people using medicine through treading on a person or shadow or scraping
    a drinking basin.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kafungo is associated with abortion; a woman who has aborted is regarded as
    dangerous, and the buried foetus is said still to have harmful influence.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Kafungo may be contracted by walking near the buried foetus, having intercourse
    with the woman, or smoking her pipe; purification is required before she enters
    another person’s hut.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Before a husband resumes cohabitation with a woman after abortion, she is
    said to have connection with another man to whom the disease is transferred.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In Kafungo treatment, a strong emetic is administered and the patient is said
    to bring up something like an egg; Kamwaya root is also applied to external sores.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Diabana is described as a febrile condition in children during wet seasons,
    treated by smoking the child in fumes from burnt roots and leaves.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Maimbwe is described as general debility caused by a ghost, treated by friends
    singing special songs to drive the ghost away.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Imbala is described as weakness and thinness caused by a malevolent ghost
    that devours the patient’s food; girls who have not yet menstruated make a new
    fire and smoke the patient in a hut.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Lukoko or Bukola is described as extreme emaciation caused, like Kafungo,
    by walking over a buried foetus.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: Respiratory complaints are described with symptoms such as spear-like chest
    pain, blood-spitting, childhood illness, pneumonia, cold in the head, and chronic
    cough, with treatments including roots in porridge, decoctions, snuffing a strong-smelling
    plant, and insect bundles tied around a child’s neck.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Ushibangulwa is described as swellings in the hands and feet connected with
