canonical_text:
  quote: ''
  summary: The passage explains Ba-ila taboo, or tonda, as a category including ritual
    and moral prohibitions, gives an example in which ritual uncleanness is treated
    as a grave offense requiring a fine, classifies several kinds of taboos, and then
    describes self-help procedures for redressing wrongs such as theft, assault, and
    property damage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Ba-ila term tonda includes prohibitions that range
    from acts considered morally wrong to acts without moral significance in the authors'
    framework.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that a breach of what the authors call ceremonial law can
    be rated as a greater offense than a breach of what they call moral law.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A woman who had previously aborted is described as being in a state of uncleanness,
    or tonda, and her entry into a man's house is described as a serious menace to
    him and his family.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the example, theft might have been overlooked, but the tonda offense could
    only be expiated by payment of a heavy fine.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Physiological taboos are described as regulating relations between the sexes
    and as having special implications for women during menstruation, pregnancy, nursing,
    and widowhood.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Occupational taboos are said to apply to warriors, iron-smelters, merchants,
    and hunters because their occupations bring them into intimate contact with death
    and other mysteries.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: Special taboos are described as applying during certain periods, such as when
    a man is being doctored and must avoid certain foods and acts so that the medicine
    remains effectual.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Personal taboos may be associated with names or placed on an individual temporarily
    or for life by a diviner or by the individual himself.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Illness after eating a food is described as a sign that the food is taboo
    to the person, especially if the illness happens repeatedly.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Mungalo is described as abstaining from all beer after a diviner declared
    beer taboo to him following a headache after a feast.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: A wronged man may seek redress on his own initiative while relying on the
    background support of his chief and clan.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: A wronged person may shisha by invoking a more combative friend, who is repaid
    with part or all of the damages obtained.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: Retaliation is described as being directed more often against the offender's
    property than against his person.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Disputes may involve intimidation, the summoning of clansmen, and sometimes
    people from two whole districts.
  category: sequence
  evidence_refs:
  - ev:5
