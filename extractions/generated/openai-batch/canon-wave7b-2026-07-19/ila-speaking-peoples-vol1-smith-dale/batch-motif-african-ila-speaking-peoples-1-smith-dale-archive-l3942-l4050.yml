canonical_text:
  quote: ''
  summary: The passage describes Ba-ila bodily hygiene, village sanitation, body modification,
    tribal marks, tooth extraction, cicatrisation, and contrasts with nearby or referenced
    groups. It gives details on temple slits, removal of upper teeth, ridicule associated
    with unmodified teeth, scarification practices among women, and ear perforation
    among the Balumbu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ba-ila clothing is described as seldom cleaned except by wading through water
    or being caught in rain; perfumes are generally not used, though a scented powder
    called lukumba is made at Nanzela.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Village conditions are described as containing filth, decaying meat and fish,
    and cattle manure; no set places for relieving oneself are described except possibly
    the shade of a fine tree outside the village.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Relieving oneself near a house is said to be forbidden, while doing so within
    a hut, especially on a bed, is described as taboo.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the Ba-ila do not practise circumcision, unlike the Mankoya,
    and notes that an analogous rite and girls' private operations will be described
    elsewhere.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Two tribal marks of the Ba-ila are named: three temple slits called mapobe
    and the knocking out of the four upper incisor teeth, sometimes also the two canines.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Tooth removal is said to have no connection with puberty rites and may be
    done in childhood or later adolescence; no special office is required to perform
    it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The tooth-removal procedure places the boy between the operator's knees while
    an inkansho, a short iron chisel, is hammered sideways until the tooth comes away
    root and all.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A youth who clutches the operator's hands is said to commit kuditaya and become
    liable to enslavement; screaming or showing cowardice exposes the youth to derision.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Young people with all their teeth are mocked as 'zebra,' and the reported
    explanation is that teeth are removed so that people do not resemble zebras but
    cattle.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Temple cicatrices may be cut on a sick child with a razor and used with a
    cupping horn; the cuts may be reopened until scars remain, or made later as decorations.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Women practise cicatrisation more than men; misolo are vertical scars on the
    loins beneath the skin petticoat, enlarged by reopening and rubbing in medicine.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage states that the hidden misolo scars are described not as ornaments
    but as serving as a sexual stimulus; women also have cuts inside the thighs.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: Large keloids such as those seen among some Bambala are regarded by the Ba-ila
    as ugly.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Balumbu, unlike the Ba-ila proper, perforate their ears and insert rings,
    grass, or button-studs.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The authors compare the Ba-ila with the Fuegians as being content to be naked
    but anxious to be fine, and state that Ba-ila men until recently wore no clothing.
  category: relationship
  evidence_refs:
  - ev:10
