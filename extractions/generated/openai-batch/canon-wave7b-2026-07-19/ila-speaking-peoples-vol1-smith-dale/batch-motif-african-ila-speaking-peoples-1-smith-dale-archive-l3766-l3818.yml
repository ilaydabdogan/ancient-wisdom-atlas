canonical_text:
  quote: ''
  summary: The passage, in an ethnographic section on physical characteristics, includes
    a photo caption identifying Namushia, son of Mungaila, as chief at Kasenga. It
    describes unnamed people returning from long marches carrying goods, arriving
    in good spirits, helping comrades with loads, eating, and dancing. It also describes
    their endurance of hunger when water is available, the greater exhaustion caused
    by thirst, practices for avoiding heat during journeys, and cases of heat-stroke
    among babies carried on their mothers' backs.
