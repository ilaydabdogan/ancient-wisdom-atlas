canonical_text:
  quote: ''
  summary: The passage recounts a Banampongo tradition about a defeated clan attempting
    collective drowning in a lake and a Banankalamo husband saving himself and his
    Banampongo wife by cutting the rope. It then discusses Ba-ila explanations of
    ancestral origin through the term bakaseluka, either as literal descent from the
    sky with animals onto a marked rock at Bwengwa-Leza, or as spiritual descent into
    a woman for reincarnation. It also describes revered founder ancestors or demi-gods,
    uncertain chief lists, an authorial analogy to Greek clan eponymous heroes, and
    a brief historical summary of war, raids, disease, and witchcraft accusations.
  language: English
  quote_policy: summarized
