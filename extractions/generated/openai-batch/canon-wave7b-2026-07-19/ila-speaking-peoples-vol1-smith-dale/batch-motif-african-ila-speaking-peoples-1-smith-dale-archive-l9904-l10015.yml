canonical_text:
  quote: ''
  summary: The passage describes Ila medicines, charms, taboos, and analogical practices
    for calmness, protection from lightning, personal good luck, hunting success,
    trading profit, social advancement, wealth, and safety or concealment in war.
    It includes offerings to medicines, abstentions and food taboos, restrictions
    concerning menstruating women, and the use of animal or natural qualities as models
    for desired effects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A medicine named wetontozha is said to produce calmness and peace, described
    as quiet like still water.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A tortoiseshell may be hung under the eaves to ward off lightning; during
    a storm a piece of shell may be thrown on the fire while lightning is addressed
    with humble speech.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A doctor can provide a good-luck musamo called masamba, and the passage says
    a man seeking special luck may, under the doctor's instructions, commit incest
    with a sister or daughter before an undertaking.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Masamba is accompanied by taboos including sexual abstinence during Shimwenje,
    not shaking or sweeping the bed or hut, and not washing while away at work.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The bearer of masamba must avoid eating Kantanta and certain small antelopes;
    the passage explains this through qualities associated with darkness or escape.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A hunter with a gun takes it to a doctor, who washes it with musamo and may
    restrict what game may be shot.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: After a successful hunt, bits of meat are offered to the medicines, and the
    heart is cooked at the sacred forked-stick, cut up, and distributed among particular
    friends; the passage calls this a sacrifice.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The doctor warns the hunter not to allow a menstruating woman to enter the
    hut where the gun is, because she would render it useless.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: A trader places the trading medicine receptacle before him and asks it to
    help him buy desired goods; the doctor warns him against menstruating women touching
    his food and against intercourse on the journey.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: One trading medicine, mbimbe, is worn in a goat's horn and is compared to
    the bimbe hawk swooping on prey without missing.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Ba-ila do not eat rats, but they may drink water in which a rat has died
    because they say it gives good luck.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The charm chimbusha is used to raise a man above fellow villagers, and lukunka
