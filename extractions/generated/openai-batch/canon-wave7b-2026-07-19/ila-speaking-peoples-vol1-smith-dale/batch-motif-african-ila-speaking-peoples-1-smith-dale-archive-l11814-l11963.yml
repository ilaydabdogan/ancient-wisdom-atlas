canonical_text:
  quote: APPENDIX 1 / LIST OF MIKOA / (a) Those named from animals, plants, or things
  summary: The passage is an appendix table listing Ila mikoa or clans named from
    animals, plants, or things. For each entry it gives a clan name, a totem, and
    an associated place, with footnotes explaining some variant place-derived clan
    names, the relation of elephant and wart-hog, and a nickname for the honey-guide
    clan.
  language: English
  quote_policy: quoted
