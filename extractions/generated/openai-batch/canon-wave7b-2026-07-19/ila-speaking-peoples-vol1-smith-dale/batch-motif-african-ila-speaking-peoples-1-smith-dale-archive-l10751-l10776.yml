canonical_text:
  quote: '"It is enough to show with what suspicion a doctor is to be regarded when
    he professes to let a stranger into his secrets."'
  summary: The passage describes an ethnographic attempt to verify a doctor's list
    of medicinal drugs. The doctor names and describes many drugs, appears to accept
    an invented name as genuine, but later correctly identifies many numbered drugs
    and their uses, leading the authors to suspect partial deception connected with
    professional secrecy.
  language: English
  quote_policy: quoted
