canonical_text:
  quote: The clan, then, mukoa, is the line of the mother.
  summary: The passage explains that a woman is treated as an alien in her father’s
    clan but has proper clansmen at her mother’s home; at paternal sacrifices only
    a water oblation may be made for her. It then describes the Ila mukoa as a matrilineal,
    totemistic clan named from animals, plants, natural objects, places, or persons,
    and discusses clan-name evidence for relations with neighboring peoples.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A woman has no mukoa at her father’s home or father’s birthplace, where she
    may be called a child of the group but is explicitly described as an alien; at
    her mother’s home she has proper clansmen.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When sacrifices are offered in the father’s clan, an oblation may be made
    on the woman’s behalf, but it is water only; she is given a cupful, sips it, and
    the rest is poured out at the musemu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stated reason for the water-only oblation is that she is not of the father’s
    clan and cannot expect favour from that clan’s ancestral spirits.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The mukoa, or clan, is defined as the line of the mother.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Clan members call themselves by the name of an animal, plant, or natural object
    with which they conceive a relationship and which they treat with respect.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: A person may report a clan by the totem name, by an associated place name,
    or by the name of a prominent member or head; the passage says this may happen
    because of misleading intent, prohibition on pronouncing the totem name, or later
    renaming.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The buffalo clan is given as an example of a clan with several names derived
    from the common animal name, a praise name, a former head, and a place.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage interprets the Ila forms muna- and bana- as involving a person/living-thing
    prefix plus a possessive particle, so that Munampongo and Banampongo mean literally
    'he-of-the-goat' and 'they-of-the-goat.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Some animal terms embedded in clan names are not in common Ila use but are
    compared with forms used by neighboring peoples.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that some clans among neighboring peoples have the same
    names as Ila clans and that this may indicate immigration or ancient movements.
  category: relationship
  evidence_refs:
  - ev:7
