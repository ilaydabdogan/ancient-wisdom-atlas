canonical_text:
  quote: ''
  summary: 'The passage describes fish drying and trade, then records hunting and
    fishing customs: rites performed over a slain elephant, offerings to Leza, ancestral
    spirits, and the elephant ghost, admission rites for elephant hunters, and sexual
    abstinence, divination, expulsion, and cleansing connected with Iwando fishing.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fish are split, dried in the sun or over fires, consumed locally in large
    quantities, and traded to people living away from the river.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the purpose of the elephant rites is to prevent vengeance
    by the dead elephant's ghost and to induce it to help bring the same fate on other
    elephants.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the elephant is dead, the hunter runs away, is mock-chased by companions,
    returns, climbs onto the carcass, chews medicine, and ejects it into the wound
    and anus while crawling over the body.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The hunter dances on the carcass while companions surround the elephant and
    clap in greeting and congratulation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The hunters begin butchering by cutting fat from the temples, judge the animal's
    condition from it, remove the intestines, and dry cavity linings called ingubo
    for presentation to the bodi.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The hunter puts his head through the diaphragm opening, seizes the heart with
    his mouth, and drags it out; the passage says he does not eat it, and that biting
    it is to give him strength in future hunting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The tusk nerve called kamwale is carefully removed and buried under the camp-fire
    site; inexperienced hunters called tiros or bana must not look at it, or they
    would meet misfortune.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: After butchering, the hunters return to the village beating axes and singing,
    the people meet them, and a feast with beer is made.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Before the feast, an offering is made to Leza, to the ancestral spirits, and
    to the ghost of the dead elephant, which is addressed and told to fetch its brothers
    and fathers to be killed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The elephant ghost is said to return to the herd and become guardian of the
    elephant that has 'eaten its name'; the authors state that elephants are regarded
    as acting as men act in inheritance.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: 'Before admission to the brotherhood of elephant hunters, a man is doctored:
    gashes are cut in his right arm, medicine is rubbed in for pluck, and other medicines
    are given to let him approach quarry unseen.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: At the Iwando fishing, men leave the villages and encamp on the river-bank;
    until fishing is over they are forbidden sexual commerce with wives or other women.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: If a man breaks the sexual rule during Iwando fishing, the passage says the
    next pushing of the Iwando will take no fish, and people say someone has brought
    a sexual transgression to the Iwando.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: When such a breach occurs, a diviner is called to find the wrongdoer, the
    wrongdoer is driven away, medicine cleanses the Iwando, and a good catch follows
    if all is well.
  category: sequence
  evidence_refs:
  - ev:10
