canonical_text:
  quote: ''
  summary: The passage recounts Barotsi conflicts and raids against Ba-ila and related
    communities, including tribute enforcement, succession politics, Lewanika's expansionist
    policy, cattle raids, warfare, skull trophies, an expedition headed by a girl
    chosen through divination, surrender and resistance by local chiefs and individuals,
    flight to mountains, crossings of the Kafue, captives, and a widow's self-drowning
    after her husband's death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A tribute-collecting induna named Musisimi was killed by the Bwengwa people
    while trying to enforce payment, and his death was later avenged by an army led
    by Lutango.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mwanawina ordered a raid on the Ba-ila in 1878, but Mokubesa used the occasion
    of collecting the army to overthrow him in favor of Lobosi, also called Lewanika.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lewanika's policy is described as extending his empire, imposing Barotsi customs
    and the Kololo dialect, and training young men from provinces at court before
    sending them home as representatives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In 1882 Lewanika reassured Sezongo's people by calling them his children and
    invited any who wished to fight to join him against the Ba-ila and Batonga.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The 1882 expedition raided cattle from several Ba-ila areas, killed many Ba-ila,
    sustained small Barotsi losses, and divided slaves, cattle, and other spoil on
    return.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that Barotsi custom was to decapitate every slain enemy
    and give the calvarium as a drinking-cup to a warrior distinguished in battle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Barotsi are described as armed with guns, kerries, and shields, while
    the Ba-ila had only throwing-spears.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Coillard's account links cattle slaughter, famine, and the cry to go against
    the Mashukulumbwe with the start of the 1888 Barotsi expedition.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the head of the 1888 army marched a young girl chosen by divining-bones
    and regarded as the interpreter of the gods, without whom nothing was to be done.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The missionary F. Coillard tried unsuccessfully to dissuade Lewanika from
    the 1888 expedition, and the passage says this became Lewanika's last raid because
    of Coillard's growing influence.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: During the 1888 raid, many Ba-ila fled to mountain refuges, while Lewanika
    divided his army into sections, some of which crossed the Kafue, making escape
    difficult.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Some chiefs surrendered without resistance; Shaloba of Lubwe divided his cattle
    and handed the larger part to the Barotsi, while Shapela helped the invaders.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Katimbila, compelled to ferry Barotsi across the Kafue, seized a spear in
    mid-stream, killed one Barotsi, capsized the rest into the river, and escaped
    to land.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Women suffered with others and many were carried away by captors; the wife
    of Mwashaboya threw herself into the river after her husband's death.
  category: sequence
  evidence_refs:
  - ev:7
