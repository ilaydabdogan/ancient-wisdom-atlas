canonical_text:
  quote: ''
  summary: The passage reports Ila leechcraft concerning snake prophylaxis, snake
    handling, snakebite cures, and inoculation for immunity, including the practices
    of a named snake-cure doctor, Munyuni. It then reports Ba-ila aphrodisiacs or
    love-philtres involving roots, bird feathers, liver, smoking, whispered desire,
    and a claimed dream effect.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Doctors claim that fumes from Mompelempempe prevent snakebite and that Muntamba
    leaves and juice allow a person to grasp snakes safely.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The observers note that the two snake-related drugs have a pungent odor but
    say they have neither tested the claims nor seen such a test performed.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Munyuni is described as a doctor famed for snake cures and as someone who
    keeps snakes in his hut.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Munyuni pulled a snake from a hole, extracted its fangs, and brought it in
    a bag; it is identified as a green Mamba about four feet long.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The snake tried to escape when removed from the bag, but Munyuni caught it
    and made it lie quiescent by stroking its head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Munyuni's children played with the snake without nervousness; their father
    said they were immune, while the observers note that the fangless snake was harmless.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Munyuni says he was doctored by his father and has doctored his own children
    by rubbing a mixture of snake tail tip and tree roots into deep cuts in hands
    and feet, with repetition after several years.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: To remove fangs, a man chews Mushikadilo leaves and spits the juice into the
    snake's mouth, which is said to make the snake stupid before the fangs are wrenched
    out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: For a snakebite patient, Munyuni carries a Mutumbulwa-fibre cord, ties it
    above the wound, uses fire and smoke on the wound, and gives a warm decoction
    intended to drive out the snake's poison or anger.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: A young man was bitten on the hand by a poisonous snake in a hole, became
    unconscious before reaching the village, and died within three hours of the bite.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Munyuni claimed he could have cured the unconscious bitten man by using a
    platform over fire, medicine fumes, chewed leaves spat into bodily openings, and
    boys holding the man in the smoke.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Another doctor describes inoculating a young lad with fumes and powder from
    desiccated venomous snake heads, rubbed into repeated incisions in the hands,
    so that the boy is said to grow up immune.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage states that Ba-ila use several aphrodisiacs or love-philtres,
    while the observers do not claim to know whether they are efficacious.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: One love-charm for a rejected husband uses scraped Mudimbula root and ash
    from burned Inzhinge feathers concealed in liver for the woman to eat.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Another love-charm involves smoking Chikalamatanga root with tobacco while
    softly calling or whispering desire for the woman; the claimed effect is that
    she dreams of him and begins to think kindly of him.
  category: sequence
  evidence_refs:
  - ev:8
