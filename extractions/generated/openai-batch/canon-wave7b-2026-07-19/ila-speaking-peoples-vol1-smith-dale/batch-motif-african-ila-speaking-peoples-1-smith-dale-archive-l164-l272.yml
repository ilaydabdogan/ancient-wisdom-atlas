canonical_text:
  quote: ''
  summary: The preface explains how the authors gathered Ba-ila texts and ethnographic
    information through dictation, trained native assistants, chiefs and elders, translations,
    court records, and correspondence, while stating their intended scholarly and
    practical audiences and advising successors to learn the language, thought-world,
    and folklore of the Ba-ila.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The authors aimed to secure a large collection of native texts from the Ba-ila,
    whose language had not previously been reduced to writing when they first knew
    them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The authors obtained texts either by writing from dictation themselves or
    by using young men trained in mission schools; most of the collection was written
    down by the authors.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kayobe, described as a true Mwila, lived with Mr. Smith for ten years and
    wrote down the substance of conversations about customs with chiefs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kayobe conducted follow-up interviews when points were obscure, sometimes
    wrote long accounts spontaneously, and his accounts were checked with others.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Another native helper, a son of Sezongo II of Nanzela, wrote notes on customs
    and compiled a history of his father's people from old chiefs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The authors deliberately drew information from old men and elderly chiefs,
    especially Mungalo of Kasenga; they state that none of their native informants
    spoke English.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The authors wished to publish native texts with English translations in parallel
    columns, and they report using translations extensively in quotations and descriptions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The authors examined magistrates' court records with official permission and
    cooperation, quoted some cases with names changed, and used the records to identify
    customs and ideas previously unknown to them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The authors describe the work as intended for a narrow readership and for
    scientifically trained anthropologists, although they do not claim such training
    for themselves.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: The authors state that they studied the Ba-ila as fellow men and women and
    wrote partly to assist future magistrates or missionaries working among them.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The authors advise successors to learn to see through the eyes of the Ba-ila,
    learn their language and ways of thinking, and saturate themselves in Ba-ila folklore.
  category: speech
  evidence_refs:
  - ev:8
