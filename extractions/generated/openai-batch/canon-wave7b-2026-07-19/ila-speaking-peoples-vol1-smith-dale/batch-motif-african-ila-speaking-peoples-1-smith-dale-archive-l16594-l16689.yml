canonical_text:
  quote: ''
  summary: The passage describes Ila mechanisms for regulating communal life through
    clan responsibility, elder deliberation, arbitration, and chief-led lubeta courts.
    It illustrates these processes with an eyewitness description of a crowded court
    and two adultery-related cases, including a cow fine, banishment after insulting
    chiefs, and a decision that an offender rather than his relatives should pay a
    monetary fine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In important troubles or wrongs, a man is described as looking to his clan
    for assistance in obtaining redress.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a clan adopts a dispute, responsibility is described as collective and
    vicarious, and any clan member may be liable to punishment.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage lists clan-adopted claims including chiko cattle, ill-treatment
    of a clanswoman by her husband, raids and feuds, redemption from slavery, and
    large-scale theft of cattle or ivory.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: If disputes are not settled by elders' councils and mutual arrangements, they
    may persist, produce bad feeling, and lead to forays and reprisals until a mutually
    acceptable arbitrator is chosen.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Chiefs or headmen may intervene directly; a lubeta assembly hears the matter
    with elders as assessors, and the chief's decision has no appeal.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says obedience to a chief's decision depends on the chief's character
    and the respect or fear he commands.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The eyewitness court scene takes place in a dark crowded hut, with chiefs
    seated near the door, other men smoking long pipes, and some men hidden behind
    a reed screen.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Shingwe opens the case by saying that a case was brought against one of his
    men and that he asked brother chiefs to deliberate because he could not decide
    it satisfactorily.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The first case is described as an adultery case mixed with cattle debt and
    inheritance questions; the accused young man sits with his face covered and says
    little.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the chiefs decide that the young man should pay a cow, he insults them
    as shami, causing an uproar, and the chiefs declare that he should be banished.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In a second adultery case, the chiefs decide that the man himself should pay
    a £5 fine rather than burdening his father and relatives.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: If the second offender would not or could not pay, the chiefs say they would
    take him by force to the magistrate and ask that he be sentenced to work for the
    money.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The narrator reports being favorably impressed by the meeting's order and
    says speakers were generally allowed to speak.
  category: other
  evidence_refs:
  - ev:8
