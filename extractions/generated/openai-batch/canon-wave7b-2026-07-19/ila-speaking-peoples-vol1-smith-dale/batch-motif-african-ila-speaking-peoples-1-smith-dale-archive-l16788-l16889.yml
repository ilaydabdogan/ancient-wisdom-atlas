canonical_text:
  quote: ''
  summary: The passage describes Ila legal ordeals involving boiling water and mwazhi
    poison, including proxy testing with a dog or cock, ritual charging speeches,
    material proofs from dead animals, possible direct drinking by the accused, penalties
    for failed accusation, and ordinary court punishments including outlawry.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Two ordeal forms are named: a hot-water test and a poison test; the accused
    undergoes the former himself, while the latter is often administered by proxy.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the hot-water test, the accused may draw the water, cut the wood, and light
    the fire before a pot of water is boiled between the parties.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The accused is addressed with a formula linking burning and lost nails to
    guilt, then plunges his hand into boiling water and may have to pick up a stone.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Absence of blistering leads to acquittal, while blistering leads to a guilty
    pronouncement.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The authors report hearing that some accused persons obtain medicine from
    the presiding diviner to smear on the arm to prevent injury.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The poison test uses mwazhi, a decoction made from a shrub of the same name.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: A dog may be tied up, withheld from food, given mwazhi before clansmen from
    both sides, and ritually charged and recharged with speeches about whether the
    deceased died naturally or by witchcraft.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: If the dog dies, this is treated as a sign that the suspected man is guilty
    of warlockry; its tail is cut off and deposited with the chief.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A cock is also tested with mwazhi; vomiting and survival indicate innocence,
    while death indicates guilt, and its wings are taken to the chief.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: If the suspected man continues to deny guilt, he may be invited to drink the
    mwazhi himself; death is treated as proof of guilt and survival as proof of innocence.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: If the accused refuses to drink, the dog's tail and cock's wings are tied
    around his neck before he is led to execution.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: If the tests fail to show guilt, accusers are liable for buditazhi and must
    redeem themselves by a heavy ransom to the accused and his clansmen.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Sometimes the accused drinks the medicine on his own demand and is charged
    with a formula ordering him to live if innocent and die if a warlock.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: In some cases an appeal is made directly to mwazhi to reveal the truth.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Ordinary cases are described as being decided by evidence, including hearsay
    evidence, with variation in chiefs' judgment.
  category: other
  evidence_refs:
  - ev:9
- id: obs:16
  text: Punishments listed include outlawry, mutilation, death, confiscation, and
    fines; outlawry is said to be used reluctantly because it removes labor from the
    community and strengthens another community.
  category: other
  evidence_refs:
  - ev:10
