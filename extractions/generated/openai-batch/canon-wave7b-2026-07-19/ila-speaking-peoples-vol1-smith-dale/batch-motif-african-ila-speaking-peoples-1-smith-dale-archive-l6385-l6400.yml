  summary: The passage describes fishing in shallow floodwater by spearing, then describes
    a winter and spring method of placing plant-based fish-poisons in pools. The poison
    is said to make fish senseless and damage their eyes; the method is called kutwila.
    Fish not needed immediately are dried.
