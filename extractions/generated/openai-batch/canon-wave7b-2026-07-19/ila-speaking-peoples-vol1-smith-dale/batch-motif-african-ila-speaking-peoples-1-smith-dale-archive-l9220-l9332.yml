canonical_text:
  quote: These drugs are said to extract the poison, or, as the natives say, "to take
    out the teeth."
  summary: The passage describes Ila explanations for disease, including taboo-breaking,
    socially condemned actions, ghosts or ancestral spirits, and Leza. It then gives
    an ethnographic account of snake-bite remedies, plant preparations, smoke and
    water treatments, a neck-worn musamo, and treatment of poison spat into the eye
    by the Shimakoma cobra.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Some diseases are attributed to breaking a taboo or committing acts such as
    jealousy, false swearing, trespassing, or discontent; the bad action is said to
    have material consequences.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some baffling complaints, delirium, sickness, and death are attributed to
    ghosts or ancestral spirits; delirium is described as ghosts speaking inside,
    and death may be described as the basangushi taking the patient away.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some diseases, especially virulent diseases and plagues, are ascribed to Leza.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: For snake-bites, a doctor ties a cord above the wound, applies plant drugs,
    and may smoke the wound in fumes from materials heated over a fire.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Named plant materials used for snake-bite treatment include roots and leaves
    from Mompelempempe, Muntamba, Mubangalala, and Mungomba or Luminanzoka, prepared
    by rubbing, chewing, shredding, soaking, fomenting, or burning.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The drugs are said to extract the poison, described in the passage as taking
    out the teeth; after such treatment the patient may receive an emetic from the
    Musale tree.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A musamo for snake-bites is worn around the neck as a small black object,
    sometimes covered with beads; if the wearer is bitten, it is rubbed into the wound,
    and the drug is the black root of the Muma tree.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Shimakoma, identified as the African cobra, is described as spitting poison
    into a person's eye; a native doctor treated one such case with Kabwengwe leaves
    and twigs soaked in warm water, rubbing around the eye, and blowing into the eye.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The writers state that they cannot determine whether the reported snake-bite
    remedies are decisively effective, but they report recoveries after treatment
    and deaths when people were not doctored.
  category: other
  evidence_refs:
  - ev:7
