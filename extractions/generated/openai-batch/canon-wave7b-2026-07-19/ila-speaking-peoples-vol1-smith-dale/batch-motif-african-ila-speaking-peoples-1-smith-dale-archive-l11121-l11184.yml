canonical_text:
  quote: ''
  summary: The passage describes Ba-ila clan exogamy, the religious complication of
    same-clan marriage because ancestral ghosts aid only their own kin, and totemic
    reverence shown especially through avoidance of killing or eating animal totems.
    It also notes generational weakening of animal-totem food taboos, former avoidance
    of milk by one clan, uncertainty about non-animal totem reverence, and the authors'
    lack of evidence for totem-increase ceremonies among the Ba-ila.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The clans are described as exogamous, and marriage within the same clan is
    not recognised.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Members of the same clan are prohibited from regular or irregular intercourse
    even when they live far apart.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cases of same-clan marriage are said to have occurred, sometimes through ignorance;
    no punishment is imposed, but the marriage is dissolved or the pair are left to
    the expected fate of taboo-breakers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A saying states that an ancestral ghost, the muzhimo, hears members of its
    own family and does not heed those of another family.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Because the muzhimo helps only its own people, husbands and wives do not pray
    for one another; same-clan spouses would create an anomalous case of one spouse
    praying for the other, which is called taboo.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The authors report no observed or reported Ba-ila ceremonies for increasing
    the totem, and they say that if such ceremonies once existed they have faded from
    memory.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ba-ila totemism is described as mainly part of social organisation rather
    than religion, with reverence for the totem as its only semi-religious feature.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: For animal totems, reverence is shown by not killing or eating the animal,
    and informants describe the totem as a kinsman or as honoured.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Katumpa of the dog clan rejects the idea of eating dogs by comparing it to
    eating a man.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage contrasts older men, who refrain from killing or eating totems,
    with younger men, who may eat edible totems.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: One young man says he would eat his lion totem even if it had just devoured
    his father.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Clans with unpalatable totems such as vulture, crocodile, and wild-dog are
    described as unlikely to break the custom, while clans with edible totems such
    as cattle, oribi, and hartebeest are said to be tempted and, among the younger
    generation, to eat them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Bono are said formerly to have refrained from eating beef and from drinking
    milk.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: For non-animal totems, the authors say they do not understand how reverence
    was shown, since grain and water would be difficult to avoid.
  category: other
  evidence_refs:
  - ev:7
