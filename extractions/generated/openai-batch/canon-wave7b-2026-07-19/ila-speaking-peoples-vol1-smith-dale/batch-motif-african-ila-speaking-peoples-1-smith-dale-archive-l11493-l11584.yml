canonical_text:
  quote: To succeed a person is kudyaizhina ("to eat the name"), the successor is
    called Mudyezhina ("Eater of the name"), and actually adopts the deceased's name.
  summary: The passage describes Ila ideals of chiefship, including moral conduct,
    generosity, patience with dependents, ability to settle disputes, and responsibility
    to provide food. It then explains succession and inheritance, especially the idiom
    of a successor “eating the name” of the deceased, the distribution of property,
    council deliberations during mourning, death-bed nomination, and reciprocal succession
    rights between some neighboring chiefs.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A future chief may be recognized while still a boy because he listens to elders,
    obeys, behaves well, gives generously, and speaks pleasantly to people.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some men are described as reformed characters who become regarded as chief-like
    after abandoning dishonest or rogue behavior.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage contrasts fit chiefs with those who are chiefs only in name and
    cannot settle subjects' troubles or pay fines for them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A chief is expected to rule by doing well in affairs, giving food to people,
    building a large village, and treating subjects generously in exchanges.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The passage states that a chief tolerates backbiting, curses, destruction
    of his property, and even dependents sleeping with his wives without killing or
    driving them away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Succession is described with the expression kudyaizhina, “to eat the name,”
    and the successor is called Mudyezhina, “Eater of the name,” who adopts the deceased's
    name.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Eating the name involves inheriting a portion of the property, while another
    portion called lukono is distributed among people said to kona.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: During mourning ceremonies for a deceased chief, a council of clan members,
    elders, community members, and friends decides succession and inheritance.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: If a deceased chief expressed a death-bed wish about succession, grave reasons
    are required to set it aside; if there are several claimants, discussion may last
    for days.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: In some districts, neighboring chiefs have or claim reciprocal rights to appoint
    one another's successors.
  category: relationship
  evidence_refs:
  - ev:10
