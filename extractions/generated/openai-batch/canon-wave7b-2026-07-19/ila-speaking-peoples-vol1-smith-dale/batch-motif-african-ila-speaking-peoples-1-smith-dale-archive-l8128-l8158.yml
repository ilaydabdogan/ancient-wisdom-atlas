canonical_text:
  quote: ''
  summary: The passage lists blacksmith tools and describes the blacksmith's named
    medicine, glossed as a protection that encloses him against accusations of warlock-like
    practice. If someone accuses the smith of using his art magically to destroy and
    replace a chief, God sees the accuser's harmful intent, the accuser's medicines
    return upon him, and he dies. The passage also states that smithery is inherited
    from father to son and calls this the blacksmith's medicine.
  language: English
