canonical_text:
  quote: ''
  summary: The passage describes bodily gestures used for shyness, pain, grief, obeisance,
    gratitude, innocence, affection, anger, and indicating absence; it also describes
    nasal hygiene practices, a Balumbu nostril-scraping instrument, strength and athletic
    observations, walking endurance, and load-carrying methods among Ba-Ila people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Young girls are described as covering the left cheek and eye with the left
    hand to express shyness; boys are described as standing with eyes and head averted.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person in pain is described as clasping and wringing the hands while crying
    out, or sitting on the ground with head between the knees and rocking backward
    and forward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A woman crying for her child is described as walking upright with arms at
    her sides, clenched hands, and a repeated wail for the child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A slave is described as showing obeisance and gratitude by clapping hands,
    lying flat on the ground, and rolling his head in the dust.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Innocence is expressed by repeatedly throwing out both hands and arms as if
    repudiating a charge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A mother is described as expressing love for her child by pressing the child's
    head to her side and by running her lips over the child's face.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: An angry man in discussion is described as throwing elbows back, clenching
    fists, extending his neck toward an opponent, and grunting while listening.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: An angry woman is described as clutching an opponent's hair when possible,
    slapping, scratching, and screeching.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: The answer meaning 'there is none' is expressed by raising the left hand palm
    upward and waving it side to side, or by raising both hands and throwing them
    outward.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:10
  text: The passage describes blowing the nose by closing one nostril, blowing through
    the other, covering ejected mucus with sand by foot movement, wiping the nose
    with the hand, and rubbing the hands together.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The Balumbu are described as using a small spatula-shaped instrument hung
    around the neck on a chain to scrape out the nostrils.
  category: object
  evidence_refs:
  - ev:3
- id: obs:12
  text: Both men and women are described as strong; women accustomed to burdens and
    manual labor are described as powerful, with eighteen women repeatedly defeating
    twelve young men in tug-of-war.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:13
  text: Young men are described in athletic contests involving jumping and spear-throwing,
    including reported heights and distances.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Men are described as traveling fifty or sixty miles on foot in a day, and
    carriers are described as traveling for weeks with loads of forty to fifty pounds,
    with some carrying seventy-five pounds nearly one hundred miles in five days.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Loads are described as carried on the head, on the shoulder, in the fork of
    a branched pole, balanced in two parts on a straight stick, or carried by two
    men on a pole.
  category: object
  evidence_refs:
  - ev:6
