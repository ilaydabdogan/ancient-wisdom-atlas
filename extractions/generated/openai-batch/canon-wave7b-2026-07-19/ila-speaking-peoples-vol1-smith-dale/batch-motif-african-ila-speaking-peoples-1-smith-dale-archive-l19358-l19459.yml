canonical_text:
  quote: ''
  summary: The passage gives ethnographic accounts of pregnancy taboo, fetal or maternal
    death attributed to sexual transgression, Iwembe compensation, abortion by medicine
    and resulting liability, and infanticide of children with specified birth or developmental
    signs believed to bring misfortune.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pregnant woman is described as taboo and not to be slept with by any man
    other than her husband.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: If another man sleeps with the pregnant woman, the child is said to be born
    dead, with the woman delivering in unconsciousness.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The man who slept with the pregnant woman is treated as at fault against both
    the woman's clan and her husband; elders reject killing him and require payment
    of Iwembe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: If both mother and child die, two Iwembe faults are counted; the mother's
    Iwembe is greater and is paid to the wife's clan only.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A pregnant woman seeking abortion goes to an old woman with an abortifacient,
    gives a large gift, receives medicine, and is told how to take it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After drinking the medicine, the woman experiences abdominal pain and aborts;
    a witness may report her to the husband, after which she denies it and is convicted
    by testimony.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The husband and his clansmen demand Iwembe for the killed child; the woman's
    people pay, and the old woman who dispensed the medicine is also liable.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Infanticide is described as formerly practiced in specific cases where misfortune
    was thought otherwise to overtake the family.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: Children were destroyed immediately after birth if they defecated while being
    born, were born feet foremost, were born with a tooth already cut, or were born
    to a woman who had not yet menstruated.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A child around three years old who cannot walk may be blamed for family misfortunes
    and destroyed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A child whose first tooth cuts on the upper jaw is described as killed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the detailed upper-tooth account, a maternal relation reports the sign,
    clan members inspect the child's mouth by making the child laugh, decide the child
    is malweza, and throw it away without mourning or complaint.
  category: sequence
  evidence_refs:
  - ev:7
