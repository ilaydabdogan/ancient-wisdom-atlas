canonical_text:
  quote: ''
  summary: 'The passage describes spiritual ownership of fishing waters among the
    Ila: the Muvhumenzhi pool is communally held after conquest but ritually governed
    through Nalunkwamba, whose ancestors are guardians of the pool. Each year he offers
    beer at a sacred ant-hill and tree, asks ancestral help, inaugurates the fishing
    with spears, and the crowd enters the water. A feared mupuka is said to live in
    the pool. A parallel case at Nanzela has Lukalo, a leper woman, holding spiritual
    ownership and sacrificing to her ancestors for fishers. The passage then summarizes
    inheritance disputes, pre-death apportionment, the heir who "eats" a deceased
    person’s name, communal landholding, and inherited movable property.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Muvhumenzhi pool in Kasenga district is fed by rainy-season freshets and
    dries completely only in severe drought years.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pool once belonged to Kaulizhi people but was seized by the ba-Mala as
    a result of war.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Although the pool belonged to the community, Nalunkwamba’s family retained
    what the authors call spiritual ownership because their ancestral ghosts were
    considered guardians of the pool.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fishing at the pool could not begin until the goodwill of the ancestral guardians
    was secured through their living representatives.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nalunkwamba was the surviving representative of the family associated with
    the pool and became the presiding priest of the Muvhumenzhi fishing.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Once each year in October, Nalunkwamba fixes the fishing day, summons the
    people, and prepares beer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the morning of the gathering, Nalunkwamba goes to a sacred spot described
    as an ant-hill and a tree standing together, offers a pot of beer to his ancestors,
    and asks for their assistance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the beer offering, Nalunkwamba enters the pool with fish-spears and
    casts them in different directions as if to impale fish.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the inauguration is complete, the waiting crowd cries out and rushes
    into the water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A mupuka is said to live in the pool; the passage also reports numerous snakes
    in the water and describes the mupuka as a fabulous creature held in awe.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Before the inauguration, people are said not to venture to fish in the pool.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: At Nanzela, spiritual ownership of river fishing is held by Lukalo, a leper
    woman, and people seek her rather than the missionary for permission to fish.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Lukalo offers sacrifice to her ancestors on behalf of people who want to fish.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Inheritance disputes can become heated enough to suspend orderly apportionment
    and produce a scramble for cattle and movable property.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Some men select heirs and apportion goods before death; the practice is called
    kuvhubula and the goods received are called ivhubo.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Every freeman who dies is said to have somebody who "eats his name" and becomes
