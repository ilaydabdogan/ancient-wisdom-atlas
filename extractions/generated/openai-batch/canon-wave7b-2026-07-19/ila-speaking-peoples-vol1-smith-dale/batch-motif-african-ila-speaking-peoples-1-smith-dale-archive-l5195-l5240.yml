canonical_text:
  quote: ''
  summary: In an ethnographic section on agriculture, the authors contrast market-supported
    food supply with subsistence vulnerability, state that crop failure from drought
    or flood brings direct hunger, describe appeals to reputed rain-makers, summarize
    Ba-ila agricultural knowledge and resistance to new methods, and describe household
    selection of bush land for cultivation with freely granted permission when land
    lies in another district.
