canonical_text:
  quote: "“To shed blood is uncanny; it gives the mysterious powers a hold on you.”"
  summary: 'The passage describes Ba-ila ideas and practices concerning homicide:
    killing is treated less as an abstract offence against life than as an injury
    to the victim’s clan, communal deity, ghost, and hidden forces. Bloodshed brings
    dangerous consequences that may require ritual or medical treatment, while killing
    a blood relative is described as producing consequences that cannot be removed.'
  language: English
  quote_policy: quoted
