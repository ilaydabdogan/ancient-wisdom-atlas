canonical_text:
  quote: ''
  summary: The passage describes Ba-ila charms, amulets, and talismans by their intended
    effects. It emphasizes links between a charm’s name, material qualities, and effects;
    gives examples involving swollen tree roots, bird names, animal food taboos, groundpeas
    that sound like thunder, and unexplained restrictions concerning pots, a lukwi,
    and milk-bread; and frames many examples as sympathetic magic whose power is treated
    as real by the Ba-ila.
  language: English
  quote_policy: summarized
