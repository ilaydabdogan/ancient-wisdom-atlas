canonical_text:
  quote: "“to put one's life into a hiding-place”"
  summary: The passage describes Ila leechcraft practices in which a person uses medicines
    or charms to hide life in another person, an object, a tree, or an animal, with
    reciprocal death effects if the receptacle is destroyed. It then describes owelumbu
    or ilumbu medicines that bind another person to die with the taker or to die in
    the taker’s place, and the authors compare the hidden-life practice to the stories
    of Nisus and Meleager.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A described method of self-protection uses a powerful charm to put a person's
    life into a hiding-place, either another person or an object; the practice is
    named kudishita.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chief Mungaila said his life was hidden in a needle on an unnamed friend's
    head; another person said his life was in a friend's fingernail.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A patient asks a doctor for a place to keep his body and safeguard him, provides
    a hoe as an initial fee, and receives medicines to eat in porridge and rub on
    the body.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the doctor's example, the patient chooses to hide in a servant's eye and
    does not tell the servant.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: If the master dies while hidden in the servant's eye, the servant's eye is
    pierced or bursts as the master comes out; if the servant's eye is destroyed first,
    the master dies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Other people are said to hide in a palm-tree or thorn tree; when the person
    dies the tree falls or breaks, and if the tree falls first the person dies.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Some people hide in a cow or ox; when the beast dies, the person is said to
    take away its heart and die also.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage explicitly compares the hidden-life practice with King Nisus's
    life being bound to a purple lock and Meleager's life being bound to a billet
    of wood.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: Owelumbu or ilumbu medicine is described as being taken so that another selected
    person will die at the same time as the taker.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: The person affected by owelumbu is said to know nothing of the action; the
    passage says the charm binds the two so closely that one life nourishes the other.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: A different use of ilumbu is described in which, when the taker is sick and
    likely to die, a child or other family member dies and the taker lives, until
    no one remains to be affected.
  category: sequence
  evidence_refs:
  - ev:11
