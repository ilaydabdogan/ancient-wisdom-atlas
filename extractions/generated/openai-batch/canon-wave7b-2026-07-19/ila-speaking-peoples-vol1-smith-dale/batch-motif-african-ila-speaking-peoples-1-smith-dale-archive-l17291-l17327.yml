  quote: ''
  summary: The passage describes Ila rules of polite speech in which spouses, children,
    and near relations avoid speaking personal names or ordinary words contained within
    those names. Substitute terms are used instead; breach of the rule is described
    as cursing or despising and may incur a small fine. The rule is also applied in
    polite address to Europeans with native names.
  language: English
