canonical_text:
  quote: ''
  summary: The passage gives several Ba-ila legal-property cases involving claims
    for cattle, canoes, assistance, injury compensation, chiko payments, widower claims,
    funeral and inheritance disputes over women and children, and then introduces
    a section on slavery, describing purchase, war captivity, fault, seizure, sale,
    and transfer between masters as paths into enslavement.
  language: English
  quote_policy: summarized
