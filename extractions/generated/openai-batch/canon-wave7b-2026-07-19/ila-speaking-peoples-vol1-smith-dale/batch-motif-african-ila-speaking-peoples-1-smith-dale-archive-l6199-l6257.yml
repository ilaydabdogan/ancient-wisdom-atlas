canonical_text:
  quote: ''
  summary: 'Ethnographic description of fishing methods: baited iron hooks tied to
    reeds or reed bundles, fish-spearing from canoes and in seasonal watercourses,
    weirs and dams for trapping fish, and a Balumbu reed-mat enclosure method preceded
    by a fish-doctor carrying medicine.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A baited iron hook called ivwezhi is tied to reeds on the river-bank or to
    a bundle of reeds thrown into the stream; the fisher checks or retrieves it later.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fish are speared with barbed fish-spears called miumba; in one method two
    men travel by canoe, with one paddling and the other shooting the spear into the
    water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage reports a local explanation that, early in the rainy season, fish
    come from rivers into tributaries to chela, glossed as finding food.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Large groups of men wade in seasonal streams with miumba, prodding as they
    go, and often fish at night by torchlight; a similar harvest occurs later in large
    pools left by floods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Small streams are dammed and spaces among rocks are blocked so that falling
    water leaves fish unable to escape, after which they are scooped up or stranded.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Balumbu make a long open-work reed mat called lwando, with a supplementary
    mat called masambala and weights called manda, and push it upright in the river
    to enclose fish near the bank.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Before the Balumbu start pushing the lwando, a fish-doctor carrying a potful
    of medicine steps into the water; the passage breaks off immediately after this
    action begins.
  category: sequence
  evidence_refs:
  - ev:6
