canonical_text:
  quote: ''
  summary: Ethnographic description of an Ila blacksmith heating and hammering iron,
    adjusting a hoe, making or discussing iron bullets, repairing a fish-spear binding,
    finishing a spearhead and barbs, and listing named Ba-ila spear types with their
    uses and resemblances.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The smith repeatedly takes heated iron out, hammers it on a stone with the
    nyundo, and shapes it until it can be cut into pieces for a fish-spear and an
    ibezhi spear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man brings a hoe whose blade action does not satisfy him; the smith alters
    the tang, and the owner refits the blade using warmed mwanzu root scrapings as
    glue or cement.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A customer seeks iron bullets, and the passage distinguishes round imbwila
    bullets from flat-ended mitopo bullets cut from solid iron.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The village's old musician, identified as the chief's budimba player, is going
    fishing at night and wants a new iron binding for his fish-spear shaft.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The smith completes the iron band for the fish-spear, after which the owner
    heats, bends, hammers, and fits it around the spear shaft and tang.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The smith flattens the spear blade, leaving a midrib and sharp edge; spear-heads
    and hoes are not put in water for tempering, while axe-heads are.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The smith cuts cold barbs on the fish-spears with an inkansho chisel and chikoma,
    making four lines of barbs along the rectangular section of the head.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage lists named Ba-ila spear varieties and gives their functions in
    hunting, fishing, fighting, or close-quarters use.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
- id: obs:9
  text: The Lukona spear is described as a war spear whose name is connected with
    inheritance by a nephew from his uncle.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Mumba spear is described as used for fishing and war, associated with
    good fortune in war, and thrown first by the warrior from his bundle.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Several spear names are explained by resemblance to animals, fish, a goat
    head with horns, a mealie cob, or a swallow.
  category: relationship
  evidence_refs:
  - ev:8
