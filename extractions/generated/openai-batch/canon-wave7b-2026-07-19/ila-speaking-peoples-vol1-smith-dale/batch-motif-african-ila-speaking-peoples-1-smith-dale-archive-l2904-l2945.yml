canonical_text:
  quote: ''
  summary: The passage recounts a succession dispute involving Mungalo and Mungaila,
    escalating from contested chiefship and land occupation into wider fighting. It
    reports claims of spiritual instruction, bewitching, blood-stained spears used
    in a disputed appeal to police, Mungalo's capture and exile, and the later establishment
    of police and civil administration that ended local warfare and raiding.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the position was declined or avoided because of fear of dying of smallpox
    as Shambamba had, the position was offered to and accepted by Mungaila.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mungalo later said his spirit had instructed him to assume the chiefship,
    resulting in a quarrel because Mungaila refused to abdicate.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mwanankumba, one of Mungaila's men, took possession of land belonging to Mungalo
    and began building on it; after he refused to move, Mungalo attacked and killed
    some of his people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mungaila intervened in support of his vassal, while some other chiefs supported
    Mungalo, and the fighting became general.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mungaila died, with the passage reporting that he was said to have been bewitched;
    his younger brother took his name and position, while his nephew Shibenzu succeeded
    him at Kantengwa.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mungaila sent to ask for help from the European police.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: It was commonly said that Mungalo sent two blood-stained spears to the police
    camp as a challenge, but the authors state that the spears seem really to have
    come from Mungaila, who misrepresented the matter to secure police help.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Colonel Harding, with other white officers and many native allies, marched
    to Mala; Mungalo fled, was captured, and was sent into exile for some years before
    being allowed to return.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the incident, a police camp was established at Nkala, and later civil
    administration was introduced in the southern Kafue district and over much of
    the Ba-ila.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The authors state that intercommunal warfare, outside raids, and slave-trading
    came to an end after these administrative changes.
  category: sequence
  evidence_refs:
  - ev:6
