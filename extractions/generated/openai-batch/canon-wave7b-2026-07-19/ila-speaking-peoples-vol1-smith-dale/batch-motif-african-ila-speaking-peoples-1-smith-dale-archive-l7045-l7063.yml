canonical_text:
  quote: ''
  summary: 'The passage describes how an intumba basket is made: lubale is coiled
    on a mankuntu grass foundation, sewn with a needle by a woman maker, shaped from
    a small base into a widening basket, and finished in a uniform form without lids
    or handles. The basket can hold water.'
  language: English
  quote_policy: summarized
