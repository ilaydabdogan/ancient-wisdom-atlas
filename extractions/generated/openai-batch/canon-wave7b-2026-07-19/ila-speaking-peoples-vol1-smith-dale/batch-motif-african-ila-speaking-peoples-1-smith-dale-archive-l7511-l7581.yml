canonical_text:
  quote: ''
  summary: The passage describes the building of Ila smelting kilns, including named
    body-like parts of the kiln, a ceremony in which a boy and a girl crack beans
    inside the kiln and are thereafter expected to marry, the preparation and placement
    of clay spouts, and the making of charcoal for smelting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four inganzo smelting kilns are usually built in a line, and men build the
    kiln wall gradually by laying rolls of clay on one another.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The kiln has named parts including a lower bulging part called the belly,
    an upper lip, and a front projection called the navel.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the wall is about a foot high, a girl and a boy are brought from the
    village and put into the kiln.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A doctor gives each child a bean to crack in the mouth and swallow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: When the men hear the bean crack, they shout that it cracks inside.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that the bean-cracking sound is connected in local understanding
    with the crackling and roaring of the fire and is supposed to help proper smelting.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the ceremony, the children return home, and the passage reports that
    they should thereafter marry because they were brought into relationship on an
    important occasion.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Clay spouts are made by moulding fine clay around lubricated poles; women
    prepare the clay and men mould it, then the poles are drawn out to leave hollow
    cylinders.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Four openings are made near the kiln base on the north, south, east, and west
    sides, and clay spouts are arranged in named positions.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: Other men make charcoal by setting fire to winter-cut wood heaps, then returning
    at night to cover the fires with earth after damping them with branches.
  category: action
  evidence_refs:
  - ev:9
