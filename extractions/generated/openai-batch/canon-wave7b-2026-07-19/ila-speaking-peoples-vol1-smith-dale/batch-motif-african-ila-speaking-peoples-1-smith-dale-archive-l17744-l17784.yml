canonical_text:
  quote: ''
  summary: The authors describe lying and denial among the Ba-ila as frequent in conversation,
    theft accusations, and group questioning. They report that direct accusation of
    lying is accepted without indignation, that confession to wrongdoing is contrary
    to a stated code of honour, and that Mungalo explains collective denial as a Ba-ila
    way of not betraying the first speaker. The passage closes by attributing much
    deception to politeness and a wish not to hurt another's feelings.
  language: English
  quote_policy: summarized
