  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Makanka huts are described as conical structures made from poles tied at the
    apex and covered with grass, with roof and walls combined.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Among Bambala who have contact with Baluba, the passage describes a house
    form that combines features of makanka and Ba-ila huts.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Chief Shaloba is described as an old man and frequent host of the observers;
    his chief wife Ntambo is described as tall, handsome, and wearing a leopard skin
    during visits.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports visible mutual affection between Shaloba and Ntambo, including
    his calling her to hear witty remarks or admire gifts, and his delight when she
    received a present.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Etiquette is said to prevent Ntambo from eating with Shaloba when other men
    are present, but the passage says they ate together privately in the evening after
    visitors had gone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Village activity is said to vary by season; during field-work times many people
    are away working in lands some distance from the village.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: In hunting season, drums may awaken people before daylight by calling up hunters.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ordinarily in the morning, an elder calls boys to let calves out to the cows,
    after which boys and girls sit with men around fires of cattle dung in the kraal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: A woman brings the chief thick porridge and meat relish; the chief calls boys
    and men to share the meal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Cattle go out at about nine, each herd accompanied by herdsmen.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: Women are described as fetching stored grain from fields and preparing food,
    while men cut poles, hunt with dogs, wander, smoke, or converse.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Boys and girls fetch water and firewood, take turns herding calves and goats,
