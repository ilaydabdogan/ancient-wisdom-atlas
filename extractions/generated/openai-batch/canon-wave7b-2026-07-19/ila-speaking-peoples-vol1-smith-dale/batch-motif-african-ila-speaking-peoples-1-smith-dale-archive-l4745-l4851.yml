canonical_text:
  quote: ''
  summary: 'The passage describes house forms and residential arrangements among Ila-related
    peoples, then gives ethnographic observations of village life: hospitality by
    Chief Shaloba and his wife Ntambo, seasonal work rhythms, morning cattle and meal
    routines, gendered and age-based labor, crafts and healing, and the chief’s public
    court where business and humor occur.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes residential sleeping space by age and sex, including
    boys in an outer chamber, girls in an inner chamber, and separate huts for young
    unmarried men and young women.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The enclosed village is described as mainly for harboring cattle, and village
