canonical_text:
  quote: ''
  summary: 'The passage describes Ila fishing arrangements on the Nanzela River during
    flood rise: reed mats are set across watercourses, held by stakes, and arranged
    in a V-shape with holding enclosures called manda. Fishers spear or hand-catch
    the trapped fish, with risk from the spiny shichokochoko fish. The passage also
    names a lutele framework and notes downstream flooding through a break in the
    bank.'
  language: English
  quote_policy: summarized
