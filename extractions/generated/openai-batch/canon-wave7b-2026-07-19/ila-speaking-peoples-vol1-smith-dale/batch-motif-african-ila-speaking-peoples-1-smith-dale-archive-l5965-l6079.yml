canonical_text:
  quote: ''
  summary: 'The passage describes Ila hunting practices on the flats: large combined
    lechwe hunts tied to rising and receding water, dug-out canoe hunting, pursuit
    by youths with dogs, pitfall digging by older hunters, dangerous close-range hippopotamus
    hunting from canoes, a local hippopotamus trap, and smaller noose and fall-traps
    used by boys and herds.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Large hunts occur when flats begin to fill, with inhabitants of several districts
    combining in groups of several hundred men to surround retreating lechwe herds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says does are especially targeted because lechwe skin is used
    for Mwila women’s petticoats and rams are too large for that purpose.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When water deepens, hunters use light dug-out canoes propelled by long poles
    on the flooded flats and may kill multiple lechwe in a morning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: As water recedes, combined bands return and repeat their hunting tactics;
    when flats are dry and burnt, youths with dogs chase lechwe while older hunters
    dig concealed pitfall lines near water.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The passage states that European occupation increased security and thereby
    enabled more hunters to range farther and hunt lechwe more heavily.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: An old hippopotamus hunter and a youth paddler approach an isolated sleeping
    hippopotamus in a small dug-out canoe, spear it, and paddle away to safety.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A local hippopotamus trap is described as parallel lines of stout poles with
    a small upward-projecting blade that penetrates the animal and is driven deeper
    by its struggles.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Ba-ila are said to use traps and nooses less than many other native tribes,
    but boys and herds use noose-traps and fall-traps for birds and small game.
  category: action
  evidence_refs:
  - ev:7
