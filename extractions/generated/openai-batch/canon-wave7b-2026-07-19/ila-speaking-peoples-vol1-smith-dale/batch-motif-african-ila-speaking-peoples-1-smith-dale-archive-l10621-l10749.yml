canonical_text:
  quote: ''
  summary: Ethnographic list of Ila medicines made from roots, bulbs, seeds, skins,
    horns, smoke, water, and ointments. The listed medicines are used to ward witchcraft,
    protect hunters and warriors, aid fishing, treat ailments, promote conception,
    strengthen newborns, and prevent miscarriage. Several entries explain efficacy
    through analogy, prayer, or bodily contact.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the passage opening, unnamed substances are burned in a potsherd and their
    ashes scattered over a house; mumpempe roots are put into a horn and planted at
    a doorway to keep away witches or witchcraft.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chiwezezhi bulbous roots are crushed into a small horn worn around the neck
    to keep off witchcraft, and some is also put in a kiln to promote melting; katoze
    root is put in a large animal horn on the roof to keep off witchcraft.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: Muzhimbididi root is prepared in water and drunk by men to avoid catching
    lushinga during intercourse, an affliction described as moving from the abdomen
    into the genitalia and causing impotence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A game-pit digger uses muto roots by sitting beside the pit, closing his eyes,
    praying for meat to the creator of the medicine, animals, and himself, and throwing
    the medicine into the pit so animals will not see it and will fall in.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Malama roots are placed in small hollow crocodile teeth and tied around the
    chest for chest complaints.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Imbono black castor oil seeds are worn by warriors so enemy weapons will not
    wound them mortally; the passage says they also prevent witchcraft by making a
    harmful warlock's heart become black like the seeds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A small piece of hippo skin worn in a horn is said to prevent a pursued warrior
    from drowning in a river by enabling him, like a hippo, to stay under water and
    escape.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Mululwe is smoked in a pipe to keep off witchcraft; mupagapaga is carried
    in a horn under a warrior's arm and smoked with a prayer to escape alive and kill
    enemies.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Chitulu and mungunya are put into fire as spearing medicine, and a fisher's
    spears are held in the fumes to ensure hitting fish.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Several illness treatments use snuff, decoctions, hot-water mouth washing,
    ointments, fumes, blown powders, smoked powders, and massage for catarrh, epilepsy,
    bleeding teeth, kasema, incipient madness, kafungo, and fits.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:11
  text: Mudimbula pith and mufumu root are used to promote conception; muchinga is
    used to wash a newborn child to make it strong; mulwe is used when a woman shows
    signs of aborting, to make the child stay and grow.
  category: action
  evidence_refs:
  - ev:12
