  quote: ''
  summary: The passage describes Ila youths and young men observing and performing
    mimic fights at festivals, funerals, and other important gatherings. The practice
    called kukwenzha involves imitating charging, spear-casting, and dodging enemy
    spears. Large groups of young men face each other with reeds or spear-shafts while
    drums play war-dance rhythms.
