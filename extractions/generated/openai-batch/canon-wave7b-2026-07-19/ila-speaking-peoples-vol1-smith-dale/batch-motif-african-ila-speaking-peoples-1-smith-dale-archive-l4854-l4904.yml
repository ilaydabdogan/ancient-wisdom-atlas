canonical_text:
  quote: '"Bwami mbuzhike"'
  summary: The passage describes Chief Shaloba hearing disputes, inviting elders'
    opinions, receiving claimants, and continuing despite fatigue. It then describes
    cattle returning, calves being brought to their mothers, milking, the evening
    meal, fires, drumming, dancing by the chief's wives, boys playing and jumping
    through a grass fire, young men and women dancing around the fire, and the village
    falling asleep.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Two men are present after a fight about a woman, and they shout accusations
    and defence before the chief.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief listens calmly, invites opinions from elders, and gives judgment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Additional claims brought before the chief include adultery, land, a quarrel
    from work in the mines, and an accusation that a young man swore at an elder's
    wife.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The chief's wives bring refreshments at intervals, and all present are invited
    to share them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The chief sends away excited young men after judging their matter trivial
    and tells them to be good boys.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: After a long day of cases, Shaloba says that chiefdom is serfdom and that
    to be a chief is to be a slave.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Before the evening meal, cattle are home, boys bring in calves, calves are
    taken to their mothers, and milking is done.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: At evening, fires blaze and men and women gather in separate groups.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: Drummers and a budimba player perform while the chief's wives dance and sing
    in front of the hut until late.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Boys kindle a grass fire in the square, bring in a drummer, shout, skip, frolic,
