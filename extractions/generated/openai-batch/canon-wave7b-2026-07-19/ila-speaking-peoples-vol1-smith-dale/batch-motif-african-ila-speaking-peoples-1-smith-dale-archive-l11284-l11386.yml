canonical_text:
  quote: ''
  summary: The passage describes clan procedures among the Ila for homicide compensation,
    the taking of an unsupported killer as clan property, collective elder consultation
    over marriage, chiko cattle contributions and distribution, an authorial comment
    on the mukoa clan system, and the definition and social classes of the chishi
    community.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a Munsange has been killed, a speaker says he may go to fight, but an
    elder Munsange can dissuade him so that the matter is settled through talk.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Heads of the Bansange discuss the killing and may decide that the killer and
    his clansmen must pay what the Bansange determine, including cattle or people
    as slaves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the killer has no clansmen to stand behind him, the Bansange take possession
    of him, call him their man, and he lives with the head of the Bansange.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In a marriage case, clansmen and elders consult together, while young Bansange
    are not told of the deliberations.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: An elder may object to a proposed husband because of poverty, bad character,
    passion, adultery, theft, or other misconduct; other elders may dispute the objection
    and allow the marriage.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The elders may set a high chiko, such as twenty head, and tell the prospective
    husband to provide it because they do not regard him as marrying well.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The prospective husband returns to his clansmen, reports the required chiko,
    receives contributions from them, and gives the twenty head to the Bansange; the
    girl then goes to be married.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The elder receiving the chiko distributes cattle in ranked portions to other
    elders, clansmen described as the girl's brothers, grandparents if present, and
    the girl's mother's people.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The remaining cattle item taken by the girl's mother's people is called 'The
    one of the mother's girdle.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The authors state that the mukoa is in many respects a beneficent institution,
    acting as a unifying force between communities and softening hostility toward
    outsiders, while also noting a contrary view that it contributes to mental stagnation.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Ila word chishi is explained as meaning both a body of people and the
    locality in which they live; the Ila country is distributed among about eighty
    such communities.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The inhabitants of a chishi are described as freemen and slaves; freemen may
    be degraded into slavery, while slaves may gain freedom and even be elevated to
    chieftainship.
  category: attribute
  evidence_refs:
  - ev:8
