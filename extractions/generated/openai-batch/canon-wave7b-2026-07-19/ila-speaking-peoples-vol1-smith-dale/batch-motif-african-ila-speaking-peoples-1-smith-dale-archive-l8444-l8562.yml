canonical_text:
  quote: ''
  summary: The passage describes Ba-ila faith in musamo as including remedies, prophylactics,
    charms for skill and luck, and substances or practices used in healing. It records
    that the people do not separate therapeutic drugs from charms in the authors'
    terms; discusses empirical reasoning and counter-medicine explanations; describes
    transmission of medical knowledge, including dream revelation by a ghost; and
    lists treatments such as decoctions, sweating with medicated water, smoke, cupping,
    massage, phlebotomy, and tying a string around an affected part.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ba-ila are described as having medicines for disease, prevention, skill
    in activities, luck, gun success, and reading.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The authors divide the pharmacopoeia into drugs for diseases and charms, but
    state that the Ba-ila do not draw this distinction.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Failures of a charm can be explained by saying that someone with stronger
    medicine is secretly overcoming it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Misamo are said to be mostly leaves, bark, or roots of trees and shrubs; some
    knowledge is widely shared, while other knowledge is guarded by doctors and transmitted
    from parent to child or doctor to doctor.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A man may claim that a ghost revealed a medicine to him in a dream; if a cure
    follows, the medicine's reputation may be established and the man may gain profit
    and fame.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A decoction may be made from beaten leaves or roots soaked or boiled in water,
    then drunk or mixed with food.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: In one treatment, a patient sits over a pot of boiling water on embers under
    a skin or blanket until sweating occurs, and is then sprayed with cold medicated
    water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A smoke treatment burns drugs in a potsherd and has the patient sit covered
    in a blanket in the fumes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Cupping uses a hollow horn, incisions in the skin, suction, and sometimes
    medicine rubbed into the incisions; pain is supposed to be drawn out with the
    blood.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Massage is performed with the thumbs and fingers, and in some cases with leaves
    twisted around the operator's great toe for massaging the chest.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Phlebotomy ties a limb above and below, opens a vein with a razor, and treats
    the lushinga or blood-vessel as the cause or carrier of pain.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The simplest remedy without a drug is tying a string tightly around the head
    or another affected part.
  category: action
  evidence_refs:
  - ev:12
