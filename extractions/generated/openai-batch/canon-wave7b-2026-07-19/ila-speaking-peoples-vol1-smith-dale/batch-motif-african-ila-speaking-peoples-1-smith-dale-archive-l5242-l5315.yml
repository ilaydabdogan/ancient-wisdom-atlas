canonical_text:
  quote: ''
  summary: 'The passage describes Ila agricultural work: clearing fields by cutting
    and burning trees and brush, recognizing planting season by blossoms and the Pleiades,
    hoeing and sowing before rains, guarding crops from birds and animals, an incident
    in which a man waiting for bush-pig spears a slave woman gathering green maize
    during scarcity, digging later plots, the diminishing yields of successive crops,
    and harvesting maize for storage in granaries.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man prepares a field by lopping branches from trees, piling them at the
    bases, letting the wood dry, and setting fire to the heaps; the charred stumps
    remain standing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that ash has fertilising power, but fire is used mainly
    as the easiest way to remove timber.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wife takes the scent of mufufuma blossoms and the visibility of the Pleiades
    in the east after sunset as signs that her work should begin.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wife, assisted by household members, hoes the ground, stacks grass and
    rubbish to dry and burn, while her husband hoes his own small patch.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Seed is sown after hoeing and may remain in the ground for two or three weeks
    awaiting rain; a good shower helps it sprout, while a scanty shower may rot the
    seed and require resowing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: When young shoots appear, the field must be watched for about ten days because
    francolin scratch up fresh grain before or soon after sprouting.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the first stage, two hoeings are described as sufficient for weeds,
    but the owner must watch for monkeys and baboons by day and bush-pigs by night.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In early 1905, during grain scarcity, a man in the Bambwe district waited
    at night for bush-pig, threw a spear at a dark object in the mealies, and found
    it was a slave woman gathering green mealies because of hunger.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: While maize or sorghum ripens, the family digs fresh plots for beans, potatoes,
    or the following year's sowing.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The first year's crops are described as small, the second crop as usually
    good, and the third as a sign that new bush should be cleared and burnt while
    the old garden returns to jungle.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: At harvest people go to the gardens, strip cobs from stalks, husk them, tie
    two or three together by the sheaths, and put them into baskets for transport
    to granaries.
  category: action
  evidence_refs:
  - ev:10
