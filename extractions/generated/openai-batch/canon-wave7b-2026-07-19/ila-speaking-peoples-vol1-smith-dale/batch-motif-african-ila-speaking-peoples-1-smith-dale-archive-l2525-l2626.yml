canonical_text:
  quote: ''
  summary: The passage recounts Matabele raids against the Ba-ila, including capture
    of cattle and people, famine after crop destruction, and the drowning of some
    Matabele pursuers in flooded swamps. It then describes a later raid checked by
    smallpox, rinderpest devastation among Ila cattle, uncertainty about early European
    contact, remembered meetings with Dr. Livingstone, and an account of a pale solitary
    white traveler entering Ila country without food, weapons, or attendants.
  language: English
  quote_policy: summarized
