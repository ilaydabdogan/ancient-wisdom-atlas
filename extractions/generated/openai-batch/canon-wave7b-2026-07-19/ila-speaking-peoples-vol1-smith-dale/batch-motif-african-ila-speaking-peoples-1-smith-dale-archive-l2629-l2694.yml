literal_observations:
- id: obs:1
  text: An unnamed traveller arrived at Lubwe exhausted, sank to the ground, pointed
    to a pipe, filled it with powdered tobacco or possibly opium, smoked briefly,
    and coughed violently.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The traveller fell insensible, was revived when water was thrown on him, recovered,
    and continued eastward.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Mala, people fled at the unusual sight; the traveller and the local people
    could not understand one another, and he refused offered food before continuing
    along the Kafue.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two travellers named Chingaingai and Mitelo reportedly came from the west,
    passed eastward, and were said to be seeking ivory; their identity is variously
    described as Portuguese or Arab-like.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Three travellers named by the local people as Shimonze, Machenjezha, and Chikwasa
    reportedly came from the east, went west, carried long guns, and brought goods
    to buy ivory.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Balumbu of Nanzela tell of three “Matembezhi” who came from the south
