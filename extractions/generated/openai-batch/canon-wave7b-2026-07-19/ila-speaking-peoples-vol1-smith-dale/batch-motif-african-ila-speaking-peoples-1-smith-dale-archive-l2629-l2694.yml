  summary: 'The passage records ethnographic-historical accounts of early foreign
    travellers entering or passing through Ila-related territory: an unnamed exhausted
    traveller at Lubwe and Mala; pairs or groups of travellers associated with ivory,
    guns, goods, or hunting trophies; and Dr. Emil Holub’s recorded expedition toward
    the Ila country.'
