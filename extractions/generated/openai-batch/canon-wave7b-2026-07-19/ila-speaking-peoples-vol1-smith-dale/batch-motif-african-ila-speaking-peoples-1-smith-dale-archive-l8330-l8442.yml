canonical_text:
  quote: ''
  summary: The passage describes Ila expressions locating temperament, virtues, purpose,
    desire, astonishment, and vitality in the heart; explains vitality at the heart,
    fontanelle, and genitals; and records beliefs about reproductive bapuka, especially
    Chibumba, a personal female inner being that forms the foetus, may obstruct childbirth,
    may devour parts of the child, and can be strengthened, forced to release, or
    killed through medicine after divination.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists heart-based expressions for quick temper, resentment, quarrelsomeness,
    patience, lack of affection, kindness, faults, virtue, and trustworthiness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The heart is described as the seat of purpose, thoughts, desires, and astonishment.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The heart is said to beat in the chest and at the fontanelle in children,
    and the fontanelle is also called a mozo, 'the place of the heart.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The heart and genital organs are described as sharing the seat of vitality;
    the heart is said to breathe, and the genitals are called ku bumi, 'at the life.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A mupuka in the male is said to secrete semen, and impotence is attributed
    to that mupuka ceasing to function or to passages being blocked.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage describes impotence as a major misfortune with social consequences
    for boys and married men.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The doctor treats impotence either with an emetic intended to reopen the blocked
    passage or with a drug-thread passed into and drawn from the urethral orifice.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In a woman there are said to be two bapuka, one male and one female; the male
    is inert, while the female governs the generative functions.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The female mupuka is named Chibumba, 'the moulder,' is treated as personal
    in pronoun usage, grows with the girl, and is connected with first menstruation.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Chibumba is said to lie within the uterus, catch semen in its mouth, close
    the orifice, lick and roll the semen, and form it into a foetus.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At delivery Chibumba is said to be reluctant to release the child and may
    curl around the uterine orifice, prolonging labour.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: When labour is prolonged, relations consult a diviner, who may diagnose that
    the mupuka is angry and direct them to a named doctor for medicine.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Chibumba is said to try to prevent birth in order to devour the child, and
    incomplete parts after protracted labour are cited as evidence of partial devouring.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Barrenness is attributed to the lethargy or debility of Chibumba, and medicine
    is administered to stir, strengthen, and energise it.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: If a woman has repeated protracted confinements or children dying in early
    infancy, medicine may be given to kill Chibumba, after which she does not conceive
    again.
  category: sequence
  evidence_refs:
  - ev:11
