canonical_text:
  quote: ''
  summary: 'The passage describes the typical plan of Ba-ila villages: circular or
    horseshoe-shaped settlements with huts around the edge and a cattle-pen in the
    center. The chief or headman''s dwelling is placed on the east side, opposite
    the main entrance, with its door facing west toward the setting sun. The authors
    state that this placement has no esoteric reason and explain it as a practical
    sheltered location. The passage then introduces chief Shaloba''s village at Lubwe
    as a typical example, situated on a gentle slope overlooking the Kafue plain and
    bordered by forest on three sides.'
  language: English
  quote_policy: summarized
