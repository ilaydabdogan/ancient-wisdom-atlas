canonical_text:
  quote: ''
  summary: 'The passage catalogs wild fruits, prepared dishes, animals, birds, fish,
    drinks, tobacco, and snuff among the people described. It notes several food rules
    or taboos: one fruit may not be roasted in the rainy season lest grain dry up;
    baobab seeds should be soaked and drunk rather than sucked, otherwise a crocodile
    may bite; and adults eating a named redwing bird would become destitute. It also
    describes tobacco cultivation, smoking with shared pipes, and snuff preparation
    using tobacco, water-lily stalks, fire-drying, skunk glands, and seed-pod containers.'
  language: English
  quote_policy: summarized
