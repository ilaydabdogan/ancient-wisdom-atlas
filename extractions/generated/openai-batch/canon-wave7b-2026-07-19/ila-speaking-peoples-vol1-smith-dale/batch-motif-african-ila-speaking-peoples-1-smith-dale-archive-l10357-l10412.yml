canonical_text:
  quote: ''
  summary: 'The passage describes several Ila divinatory practices and instruments:
    blackened water in a mortar used for seeing distant or past/future events; a small
    earthenware pot said to answer questions; a leopard skin used by a diviner to
    expose and destroy a warlock; divining bones said to be non-native and probably
    introduced from the Barotsi; and the social position of doctors who guard and
    dispense medicinal knowledge.'
  language: English
  quote_policy: summarized
