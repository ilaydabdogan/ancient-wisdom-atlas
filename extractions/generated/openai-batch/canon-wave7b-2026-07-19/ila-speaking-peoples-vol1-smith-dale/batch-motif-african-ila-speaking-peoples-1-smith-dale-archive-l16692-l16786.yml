canonical_text:
  quote: ''
  summary: The passage describes Ila legal proceedings, including interruptions during
    a court debate, concerns about partial chiefs, local courts seeking to establish
    guilt, and the use of oaths and ordeals. Oaths are taken on sacred things such
    as funeral ash, mourning soil, the grave, and God. False oaths are treated as
    dangerous acts that may bring sickness, ill-fortune, or death, sometimes to unintended
    persons. Spitting on the ground is described as a precaution when suspected perjury
    is heard. Where ordinary oaths are insufficient, ordeal is used as an immediate
    appeal to hidden forces to show guilt or innocence.
  language: English
  quote_policy: summarized
