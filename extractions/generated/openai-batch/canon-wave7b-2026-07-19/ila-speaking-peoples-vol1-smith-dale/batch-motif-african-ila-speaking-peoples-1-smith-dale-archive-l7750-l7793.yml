canonical_text:
  quote: ''
  summary: 'The passage describes a smelting-kiln procedure: charcoal, stone, fire,
    and ritual medicines are placed in the kiln; a doctor and his ritual wife begin
    the packing; the fire is tabooed under a special name and praised; the firing
    roars and crackles; iron is extracted through openings, cleaned of slag, and plunged
    into water; afterward the doctor goes out at night and returns to shake a rattle
    and sing.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Charcoal is placed at the bottom of the kiln, a fire is lit, and stone and
    charcoal are piled in alternate layers until the kiln is full.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Medicines are added to the kiln; the known examples are a piece of hippopotamus
    hide and guinea-fowl feathers.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage explains the hippopotamus hide and guinea-fowl feathers by saying
    the fire makes a loud harsh noise like those animals' cries and that the medicines
    somehow promote burning.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The doctor places additional fire and charcoal near the top of the kiln and
    puts split wood pieces called intoba at the top; these are said to have mystic
    signification.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the doctor puts in the first lot, his 'wife' puts some in; the beginning
    of the packing is called kuyumbika.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The men are called basakwa while the packing is going on.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The fire is taboo and must not be named mudilo, but is called mukadi, 'the
    fierce one'; it is also spoken of as 'boiling'.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: As the fire crackles and roars, the people express excitement with cries describing
    the roaring, crackling, and repeated sound.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: If the firing is properly done, the doctor examines the kiln interior through
    the inchela and announces completion by late afternoon.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: To remove the iron, the inchela are removed, large holes are made on the four
    sides of the kiln, and a big hole is dug on the west to receive debris.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Men push poles through three openings, rake out debris, and work the iron
    toward the western opening.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The iron lump, called mutanda, is hacked with axes to remove slag and then
    plunged into water while still hot.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the afternoon operations, the doctor goes into the veld at night; on
    returning to his house he shakes a musebe rattle and sings.
  category: sequence
  evidence_refs:
  - ev:8
