canonical_text:
  quote: ''
  summary: The passage lists Ila disease names, attributed causes, taboos, contagion
    mechanisms, and treatments. It includes childbirth and reproductive ailments,
    childhood epilepsy associated with the Chinao animal and the Chikambwe bird, nervous-system
    conditions, and skin diseases attributed to contact with plants, dung, filth,
    or marked places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chipelwe is described as pains after childbirth, treated by putting stone-dust
    in water and drinking it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Masusu is described as a disease of young girls in which eating forbidden
    fish barbs causes similar things to grow in the vagina and obstruct menstruation.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Young girls who break a taboo are also said to be affected by the disease
    mafuta, with the same treatment administered.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Impwebwe is a painful affection after childbirth treated with pieces of menstruating
    women's clouts soaked in water and drunk, or burned so the smoke is inhaled.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mabishi occurs when a child dies and milk is not taken from the woman's breasts;
    her legs swell, and a drug rubbed on the legs brings out the milk.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Izuba, meaning the sun, is described as a white shiny thing at the vulva,
    treated with milk of the Mulundungoma Euphorbia.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Shibandilwabana is childhood epilepsy associated with the Chinao, an animal
    whose name means that it is not to be spoken of before children.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Chinao is said to be the owner of Shibandilwabana and to fall into fits
    each month when the moon is dark; children with the disease are said to behave
    similarly.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Touching a killed Chinao and then embracing a child, wearing Chinao skin among
    children, or a child treading where a Chinao has passed or urinated are all said
    to give the child the disease.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: If a child names the Chinao, or if anyone names it in the child's hearing,
    the name is said to enter and the child will get fits.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The preventive treatment for Shibandilwabana is a root soaked in water and
    poured into the patient's ears; nothing is done during the fit, and recovery is
    expected after the child passes water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Kalalu, lunacy, is treated by tying lunatics to prevent injury and pouring
    a cooked root decoction into the ears as a sedative when fits occur.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Mupuka convulsions in young nursing children are said to be caused by a mupuka
    coming from the mother's breast.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Kanono epilepsy is said to be caused by the Chinao and by the Chikambwe blue
    jay; seeing the bird or having it sit on the roof of a hut containing a child
    is dangerous.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Kanono treatment uses leaves of the sensitive plant Kadikumbati, a blue jay
    feather, and a piece of Chinao skin burned together, with the ash rubbed on the
    child.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Several skin diseases are attributed to contact with substances or places,
    including sweet-potato milky juice on a child's carrying skin, cattle dung or
    filth underfoot, and ground where women stamped grain.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
