canonical_text:
  quote: ''
  summary: Ethnographic description of slavery among the Ba-ila, including rules about
    marriage, children, sexual access, property, protection, violence, ritual treatment
    after death, possible elevation within servitude, and transfer to another owner
    by throwing ash.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A married female slave remains enslaved, and every child she bears is also
    a slave subject to the owner's disposal.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The owner may require the female slave's labor and is described as having
    rights over her body.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A male slave may be given a wife by the owner, and that wife may be taken,
    reassigned, or sold without warning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a master marries a favored slave woman, her children will be free and may
    attain an honorable position.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: An unmarried slave-woman is called nabutema and is described as subject to
    sexual access by the owner and others, with gifts or payments called chipo sometimes
    involved.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A master may protect slaves from harm by outsiders, while retaining the power
    under the old regime to beat or kill them without outside interference.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: After a slave's death, the owner would kill the luloa, one or two cattle eaten
    by the village people to allay the wrath of the demigod.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A slave may hold property, but the passage says it is not really his own and
    may be appropriated by the master.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The phrase that a slave redeems himself refers to gaining trust and influence
    in the master's service, not to becoming free.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: A zealous slave may trade for the master, increase the master's number of
    slaves, and be regarded by those slaves as their chief.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: An ill-treated slave may transfer himself to another and kinder owner by throwing
    ash upon him.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The passage explicitly characterizes Ba-ila slavery as real slavery rather
    than mere serfdom.
  category: attribute
  evidence_refs:
  - ev:11
