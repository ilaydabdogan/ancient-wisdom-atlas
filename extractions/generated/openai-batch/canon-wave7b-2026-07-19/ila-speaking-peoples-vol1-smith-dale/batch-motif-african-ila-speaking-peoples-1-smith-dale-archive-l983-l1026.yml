  summary: The passage explains the English usage of the term Ba-ila/Ila, then begins
    a chapter on environment. It locates the Ila-speaking people north of the Batoka
    plateau and above the middle Zambesi, centered around the Kafue/Kavuvu river and
    its wide fertile plains. It contrasts the flat cattle-rich Ila plains with neighboring
    wooded hills and valleys inhabited by the Bambala and Basala, where tsetse fly
    limits cattle wealth. It closes with a traveler’s view of the broad level Kafue
    plain.
