canonical_text:
  quote: ''
  summary: 'The passage recounts Dr. and Mrs. Holub''s dangerous travel through Ba-ila
    territory: warnings, attacks, difficult swamp travel, a suspected plot involving
    guides, an attack on the camp where Sollner is mortally wounded, Mrs. Holub''s
    armed intervention while Holub recovers diaries, and the party''s flight across
    plains and the Kafue River to relative safety. The authors then criticize Holub''s
    courage, tact, and suspicions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The expedition entered the Bwila after warnings and experienced attempted
    attacks, an attempted marooning on a Kafue island, suspected poisoning, and pillaging.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Lulonga, Dr. and Mrs. Holub left Sollner with donkeys and most remaining
    goods and departed before dawn to explore.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The exploring pair crossed swamps with breast-deep water, thick mud, lost
    boots, slipping, falling, and Holub at times carrying his wife.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A chief gave them guides, but Holub compelled the guides to disclose instructions;
    the passage says there were no Portuguese and that Holub believed the Ba-ila planned
    to separate him from Sollner and kill them all.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: On returning toward Lulonga, they learned from one of their men that the camp
    had been attacked, Sollner had been mortally wounded by spears, and goods had
    been plundered.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Among scattered books, scientific instruments, and other goods, Holub found
    and collected diaries, which he considered especially precious.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: As Ba-ila approached during the recovery of the diaries, Mrs. Holub seized
    a gun; the passage reports local details that she fired and killed people, frightening
    the Ba-ila away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The party left without visiting or burying Sollner's body and fled south;
    when Ba-ila tried to block the path, a volley scattered them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The fleeing party suffered on a newly burnt plain with short stubble, bare
    feet, intense heat, thirst, hunger, dizziness, and near-insensibility.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the Kafue they ate a small amount of half-rotten pumpkin, obtained canoes
    through promises of guns, crossed via an islet during a storm, and reached the
    south bank at midnight.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The authors conclude that Holub lacked courage and tact, was at times over-suspicious,
    and may have been misled by interpreters.
  category: other
  evidence_refs:
  - ev:9
