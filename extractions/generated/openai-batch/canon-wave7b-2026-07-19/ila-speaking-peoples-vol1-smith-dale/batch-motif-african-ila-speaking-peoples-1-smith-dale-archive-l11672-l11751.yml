    reinforce dignity, though not all are renowned magicians.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The word for a chief's relation to the people is explained as primarily meaning
    to nurse or cherish; the chief is described as father of the community and the
    people as his children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The chief's duties and privileges include protecting community interests,
    settling disputes with headmen, helping pay debts, allocating new grazing grounds,
    admitting strangers, setting certain dates, partaking first of first-fruits, acting
    with a diviner against warlocks and witches, and commanding in war.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
