  summary: The passage describes Ila inheritance after a death, including principal
    and lesser heirs and inherited debts; discusses chiefly authority, occult medicines,
    and the idea of the chief as a nurturing father of the community; lists chiefly
    duties and privileges; and describes friendship covenants, including blood brotherhood
    sealed by reciprocal blood-drinking and a lifelong vow.
  language: English
  quote_policy: summarized
