candidate_motifs:
- id: motif:1
  label: Regional ripple of conflict into local history
  taxonomy_refs: []
  basis: The passage explicitly uses a ripple image to explain how powerful neighboring
    leaders set forces in motion that disturb the Ba-ila.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is an authorial historical analogy rather than a mythic episode.
- id: motif:2
  label: Conflict-driven migration and displacement
  taxonomy_refs:
  - departure
  basis: The passage describes chiefs migrating for hunting grounds, Baluba fleeing
    across the Kafue into Ila country, and later raids pressing more Baluba into Ila
    country.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:9
  confidence: high
  cautions: The taxonomy ref is used only for literal departure or migration, not
    for a hero-departure narrative.
- id: motif:3
  label: Marriage alliance between host and newcomers
  taxonomy_refs: []
  basis: Kale receives the Baluba amicably and gives Kapidi his daughter as wife before
    relations break down.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not describe ritual details or the daughter's perspective.
- id: motif:4
  label: Chiefship emblem dispute leading to war
  taxonomy_refs:
  - royal_legitimacy
  basis: A quarrel over the right or act of wearing the impande shell, identified
    as an emblem of chiefship, leads from friendship to blows and war.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives only a brief account of the emblem and dispute.
- id: motif:5
  label: Humiliation of captive renews violence
  taxonomy_refs: []
  basis: Kapidi's capture and shaving are described as an insult that maddens him
    and prompts the resumption of war.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not explain the wider cultural meaning of hair-shaving.
- id: motif:6
  label: Poisoned or mad animal brings a leader's death
  taxonomy_refs: []
  basis: Variant reports state that Kale died after being bitten either by a poisoned
    dog sent by Kapidi or by a mad dog.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage preserves alternative explanations and does not resolve which
    version is accepted.
- id: motif:7
  label: Weapon advantage in conquest
  taxonomy_refs: []
  basis: The invaders' poisoned arrows give them advantage over the Ba-ila, and Mushidi's
    guns are described as a new factor enabling victory in Katanga.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: This is a historical warfare pattern rather than an explicitly symbolic
    weapon narrative.
- id: motif:8
  label: Raiding ruler scatters neighboring peoples
  taxonomy_refs: []
  basis: Mushidi expands by war, sends armies south, scatters the Bambwela, and drives
    further population movement into Ila country.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage presents Mushidi historically, not as a mythic culture hero
    or divine figure.
