  quote: ''
  summary: 'Historical-ethnographic account of nineteenth-century regional migrations
    and warfare affecting the Ba-ila: Balui/Bambwela movements, Baluba arrival from
    Lunda country, an alliance and conflict involving the impande chiefship shell,
    Kale''s death, Baluba-Ila conflict, and Mushidi''s expansion and raids driving
    further displacement into Ila country.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage frames Ba-ila history as affected by neighboring regions and by
    the disruptive effects of leaders such as Mushidi in the north and Chaka in the
    south.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the beginning of the nineteenth century, Balui clans inhabited the Upper
    Zambesi valley, and two Bambwela chiefs migrated north-east seeking new hunting
    grounds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: "'Kabulwebulwe settled near the Upper Kafue, while Kale settled farther north
    on the Lunga, a tributary of the Kafue."
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A party of Baluba from Lunda country, under six named chiefs, entered Kale's
    region after leaving their homes because of disturbances attributed to Mukumbi.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kale initially received the Baluba amicably and gave his daughter to Kapidi
    as a wife.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Friendly relations broke down over a quarrel about wearing the impande shell,
    described as an emblem of chiefship introduced by the Baluba.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kapidi was captured, had all his hair shaved off, was ransomed by his people,
    and then renewed the war after the insult.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The fighting continued for about three years; the Baluba fled across the Kafue
    into Ila country, and Kale pursued them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Kale died just as his people were about to cross the Kafue; the passage gives
    variant reports that he was bitten by a poisoned dog sent by Kapidi or simply
    by a mad dog.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Baluba chiefs settled near Mutumbwe Hill, fought the Ba-ila, and used
    poisoned arrows to gain an advantage, leading the Ba-ila to surrender territory.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Mushidi, associated with the Wakalaganza/Wanyamwezi, helped the Katanga chief
    Sanga with guns against the Baluba, returned with ivory, and later took Sanga's
    place after Sanga's death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Mushidi expanded war into surrounding countries, added Lubaland to his dominions,
    and sent armies known as Mapupushi or Bangalanganza southward.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Mushidi's armies attacked and scattered the Bambwela on the Lunga, killed
    Kabimba, and caused Muyani to flee and eventually settle in Isalama.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage states that Mushidi's raid pressed more Baluba into Ila country
    and that fighting between the Baluba and Ba-ila ended only with the arrival of
    Sebitwane.
  category: sequence
  evidence_refs:
  - ev:9
