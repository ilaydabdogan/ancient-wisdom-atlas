  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The one-leg standing posture is explained in the passage as a practical resting
    posture after movement through deep water in a grassy swamp.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:13
  text: For micturition both sexes are said to crouch, though men and women may also
