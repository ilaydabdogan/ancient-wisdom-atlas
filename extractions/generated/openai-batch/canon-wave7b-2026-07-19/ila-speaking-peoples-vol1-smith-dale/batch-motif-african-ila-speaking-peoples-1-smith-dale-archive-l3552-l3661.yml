- id: obs:3
  text: A favoured sleeping position is lying full length on the stomach with the
    head turned and resting on a bundle, wooden pillow, or the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that wooden pillows are used by those wearing the isusu
    and that the isusu may be tied to the rafters to avoid inconvenience while turning
    the head.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Pillows are described as taboo to young unmarried men, though the rule is
    said to have been relaxed.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Ba-ila are said to use stools called shuna, to sit on the ground, or to sit
    on a log of wood.
  category: object
  evidence_refs:
  - ev:3
