  summary: The passage gives ethnographic notes on Ila-area hairdressing, sleeping,
    sitting, standing, bodily functions, and emotional or directional gestures. It
    describes objects such as wooden pillows, stools, hair arrangements, skin-petticoats,
    and gestures, and notes some taboos or etiquette rules concerning pillows and
    exposure while sitting.
