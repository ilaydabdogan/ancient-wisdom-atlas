canonical_text:
  quote: ''
  summary: 'The passage describes Ila handicraft techniques: constructing a basket
    base from slit reeds, making winnowing trays and basket-work churn funnels, and
    beginning hand-built pottery by preparing clay with ground potsherds and shaping
    it on a base.'
  language: English
  quote_policy: summarized
