canonical_text:
  quote: ''
  summary: The passage recounts Nanzela origins and movements, conflicts with Makololo
    and earlier inhabitants, Shachibinzha's rebellion, Sezongo's rise through hunting
    wealth and warfare, the incorporation of immigrants, captives, and purchased people,
    and a stratagem in which Matabele fugitives were invited to a feast, overcome
    by a deadly drink, killed except for children, and their crania made into goblets
    associated with Sezongo's name.
  language: English
  quote_policy: summarized
