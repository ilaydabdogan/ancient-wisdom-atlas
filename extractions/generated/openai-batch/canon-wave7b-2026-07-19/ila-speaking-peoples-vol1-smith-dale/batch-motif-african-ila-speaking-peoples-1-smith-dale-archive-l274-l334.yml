canonical_text:
  quote: ''
  summary: The preface describes the wartime service of British residents and officials
    in the Kafue districts of Northern Rhodesia, praises the loyalty and carrier service
    of local African people during the war, lists named British associates who served,
    were wounded, or died, and adds a postscript memorializing Andrew Dale, who died
    of blackwater fever after returning to colonial service despite severe illness
    and disability.
