canonical_text:
  quote: ''
  summary: The passage describes Ila divination practices using a rod called Shimubi
    or chisondo. A diviner receives a fee, ritually prepares the rod with coals, smoke,
    and leaves, speaks to it, and uses its movements to locate lost objects, track
    game, diagnose illness, and investigate deaths suspected to involve witchcraft.
    A smaller rod answers questions by tapping for yes and stillness for no. In suspected
    witchcraft deaths, the rod is asked to distinguish natural death from bewitchment
    and may identify a relative as warlock; a cock ordeal may be used for confirmation.
    The diviner says the answer comes from the chisondo, not from himself.
  language: English
  quote_policy: summarized
