- id: obs:3
  text: The diviner uses a potsherd, live coals from a smouldering log, crushed dry
    leaves, pungent smoke, chewed leaves, and the head of the Shimubi in the preparation
    of the rod.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The diviner addresses Shimubi as if it can hear, know, discover, and find
    the lost object.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The diviner holds Shimubi and shakes a rattle while continuing to speak to
    it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Two men hold Shimubi; when they begin moving, they say the wood draws them
    and they must follow it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Diviners claim the chisondo can follow a thief, pick him out of a crowd, or
    lead people to an animal carcass taken by a lion.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The authorial observers report testing a diviner with hidden objects and say
    he was not successful in that test.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: A smaller rod called Shimubi mwaniche is used to divine the whereabouts of
    game and to diagnose disease.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the small-rod oracle, tapping the ground indicates yes, and ceasing to
    move indicates no.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: When asked about hunting eland, the rod’s taps and stillness are interpreted
    to predict a long search and uncertain killing success.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In disease diagnosis, the diviner talks to the rod and interprets its movements
    as an answer, such as an offended spirit needing sacrifice or a need to consult
    a doctor for medicine.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: When several family members die mysteriously, the head of the family may gather
    relations to decide whether to consult the diviner about bulozhi.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: In the death consultation, only family members are admitted, and three or
    four hoes are deposited as the fee.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:15
  text: The diviner asks Shimubi whether the deaths are to be ascribed to Leza or
    to a fellow-man who bewitched the dead.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: Shimubi’s tapping and stillness are interpreted to indicate that the deaths
