canonical_text:
  quote: ''
  summary: 'The passage describes the final preparation and firing of Ba-ila pots:
    patterns are indented around the neck with a thumbnail and a bone or stick; the
    pot is dried; dry pots are burnt in a dug hole under dry bark; ash is rubbed over
    the neck patterns; glazing is reported as unknown to the observers.'
  language: English
