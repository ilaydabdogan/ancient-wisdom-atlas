canonical_text:
  quote: ''
  summary: 'The passage describes Ba-ila hunting practices: pursuit with spears and
    lurcher dogs, year-round native hunting methods, occasional stalking with bows,
    poisoned arrows, or muzzle-loaders, and a rainy-season method of driving game
    into boggy ground where the animals are stabbed. An anecdote reports living zebra
    being deprived of their tails for fly-whisks while left stuck in mud.'
  language: English
  quote_policy: summarized
