canonical_text:
  quote: '"By the time this gets intolerably untidy she is ready to be shaved, a sign
    that she has reached adulthood."'
  summary: The passage describes dental avulsion effects and several Ila and Bambala
    hairdressing practices. Children receive early hair cutting and later wear a crown
    tuft. Girls' hair may be dressed with ash, clay, ochre, fat, paste, or beads,
    and in an initiation hut particular styles precede shaving as a sign of adulthood.
    Boys' hair may be formed into a wax-and-clay cone called impumbe, marking emergence
    from childhood, and later transformed by a professional hairdresser into the tall
    isusu coiffure.
  language: English
