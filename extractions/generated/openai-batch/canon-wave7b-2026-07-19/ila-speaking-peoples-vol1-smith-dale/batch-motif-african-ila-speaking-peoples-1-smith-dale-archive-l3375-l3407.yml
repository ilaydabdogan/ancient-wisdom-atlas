  summary: 'The passage describes the technical process of sewing and shaping an isusu
    hair form: stitching the outer hair layer, loosening and redistributing hair,
    cutting and adding hair as needed, tying and smoothing the mass, and continuing
    stitching so that the form rises in a controlled curved shape above the head.'
