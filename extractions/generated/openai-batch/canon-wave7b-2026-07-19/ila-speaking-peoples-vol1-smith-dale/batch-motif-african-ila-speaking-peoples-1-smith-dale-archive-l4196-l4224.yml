canonical_text:
  quote: ''
  summary: The passage describes Ba-ila preferences in decorative clothing and ornaments,
    including ivory bangles, rings, leglets, armlets, impande ornaments, and European
    imitations in celluloid or porcelain. It notes that imitation bangles were rejected
    if their colour or shape differed from the accepted pattern, while faithful imitations
    sold well. Men and women wear several ornaments, chiefs may wear multiple impande,
    and one imitation impande burned when it fell into fire.
