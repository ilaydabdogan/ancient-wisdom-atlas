canonical_text:
  quote: ''
  summary: The passage recounts nineteenth-century reports of Mambari, Makololo, and
    related raids affecting the Ba-ila, Bashikulompo, Batonga, and other groups. It
    describes exchanges of guns for boys or captives, arrangements for dividing raid
    spoils, Mambari slave-and-ivory trading, Sekeletu's campaigns, devastation and
    famine, a named cattle raid, and the overthrow of the Makololo dynasty by the
    Barotsi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Ba-ila first became known to the outside world
    through a paragraph by Dr. Livingstone published in England in July 1852.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mambari came to Sebitwane in 1850 with cloth and old Portuguese guns,
    and the quoted report says they refused cattle and ivory except for boys about
    fourteen years old.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Makololo exchanged boys for guns and agreed to a raid in which the Mambari
    would receive captives and the Makololo would receive cattle.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The Mambari left with about 200 chained slaves, and Arabs from Zanzibar later
    exchanged English muskets for about thirty captives.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Mambari are described as visitors from Bihe in Portuguese West Africa
    whose objects included slaves and ivory; the passage says they bought much ivory
    from the Ba-ila for slaves.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mpepe, among the Makololo, is described as a friend of the Mambari who assisted
    raids among the Ba-ila and Batonga.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sekeletu renewed forays upon the Ba-ila and led a large army toward the Kafue
    after Shipopa and Shimudizhi invited him and Ibn Habib supported a foray upon
    Chimbulamukoa.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the Kafue, Sekeletu divided his forces, with one party going up the river
    in canoes and other parties sweeping across country.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Old men described nights lit by the camp-fires of raiders, burnt villages,
    cattle taken, women and children captured, old people massacred, men killed or
    taken prisoner, and a devastated famine-stricken land.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: One old man said that in the famine a person who found a grain of corn would
    hide it in an impumbe until sowing time.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Sekeletu sent Leshodi and Katukula to loot cattle; the Makololo called the
    raid Bungwidimba, glossed as 'a flock of pigeons,' because the cattle were many
    but small.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage reports Sekeletu's death in 1863, Mamili's succession, Mbololo's
    displacement of Mamili, and a Barotsi-led revolution that expelled Mbololo and
    exterminated the Makololo while saving the women.
  category: sequence
  evidence_refs:
  - ev:9
