canonical_text:
  quote: The clan is your mother's, the family is your father's
  summary: The passage describes Ba-ila social organization, distinguishing family,
    clan, and community; explaining that these groups cross-cut one another; describing
    domestic household composition and authority; and contrasting paternal family/home
    with maternal clan/home through an example involving Shamatanga.
  language: English with Ila terms
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage identifies Family, Clan, and Community as the principal social
    groups, with Age-grades and covenanted friendships as secondary groups.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Families do not aggregate into clans, and clans do not aggregate into communities;
    clan members are distributed across several communities, and a community contains
    members of various families and clans.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says this cross-division creates some cohesion through affection
    and comradeship, but has not developed into a nation under one head.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A domestic establishment consists of a man, his wife or wives, their children,
    children under his guardianship, sometimes an aged parent, and slaves, all grouped
    as the man's bana, or children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that fathers and mothers delight in their children and
    act for their comfort and well-being.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The father rules within the family, but his authority is conditioned by clan
    rules, including a rule giving the mother's brother greater power over the children.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Divorce is described as frequent, making the family group unstable, though
    its members live and work together while it exists.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: When clan interests conflict with family interests, the passage says clan
    interests prevail.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Children are reckoned as members of their mother's clan rather than their
    father's, and maternal uncles have more power over them than the father.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage distinguishes mukwashi as the paternal line or family and mukoa
    as the maternal line or clan.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Ila word uko is given as the nearest equivalent to home, with distinct
    expressions for a father's home and a mother's home.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: Shamatanga calls Namwala his mother's home and Buzhiba his father's home;
    at Namwala he has status as a possessor of the land and potential eligibility
    for chiefship.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: Shamatanga and Kalubi's eldest child is described as a mere nobody at Buzhiba,
    her father's father's birthplace.
  category: attribute
  evidence_refs:
  - ev:9
