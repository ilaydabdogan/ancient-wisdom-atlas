canonical_text:
  quote: ''
  summary: 'The passage describes Ba-ila war-dance dress and ornamentation: feathers
    marking killing or valour, chiefs'' animal skins, warriors'' hide garments, manes,
    weapons, white paint and ash, dance seed-pod rattles, and treasured white glass
    beads called mai that were introduced through trade and used in exchange for ivory
    and cattle.'
