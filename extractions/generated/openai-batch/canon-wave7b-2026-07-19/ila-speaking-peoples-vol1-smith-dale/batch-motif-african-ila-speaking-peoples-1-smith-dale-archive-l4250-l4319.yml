literal_observations:
- id: obs:1
  text: The feather of the Plantain-eater, called induba, is described as a sign that
    its wearer has killed a man, lion, leopard, or eland.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Induba feathers were formerly awarded by chiefs, and their possession was
    regarded as great glory.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: An offender in a murder of a foreign native allegedly gave as motive the desire
    to become entitled to wear the induba feather.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Blue-jay feathers, called chikambwe, are also described as a sign of valour.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The insonde is a long needle carried in the impumbe and isusu and is said
    to have many uses.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: When dressed for war, chiefs put on leopard and lion skins, either tied around
    the loins or wrapped around the shoulders.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Warriors wear hard dry hide around the loins, belts, zebra or wildebeest manes
    around the arms, and a ruff of lion or old baboon mane around the neck.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A warrior carries a bunch of spears and either a feather-tufted stick or a
    mwiko made from an elephant's tail or palm-leaf imitation.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The feathered stick or mwiko was waved to disconcert an opponent's aim, and
    sweeping the ground with it after avoiding spears was admired.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Each warrior probably also carries an axe or battle-axe.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: When arraying themselves for war, the Ba-ila paint themselves with a white
    substance and throw ash from cattle-kraal heaps over themselves.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Men who dance the machacha dance wear dry globular seed-pods tied around the
    legs above the ankles, both as ornament and for making noise.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Some chiefs possess rare large white glass beads called mai, meaning eggs.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: The mai beads are said to have been introduced long ago by the Mambari, were
    the first European articles seen by the Ba-ila, were traded for ivory, and were
    used to buy cattle from people of Chimbulamukoa and Mongwe.
  category: sequence
  evidence_refs:
  - ev:8
