canonical_text:
  quote: ''
  summary: 'The passage describes Ba-ila cattle practices: cattle are named and marked
    with owners’ ear-marks; they sleep in pens protected by a horn containing medicine
    and by ash-fire smoke; milking is accompanied by drum-beats; cattle graze with
    herds during the day and return for evening milking; owners defend cattle against
    lions; the authors also comment on cattle stock origins and interbreeding.'
  language: English
  quote_policy: summarized
