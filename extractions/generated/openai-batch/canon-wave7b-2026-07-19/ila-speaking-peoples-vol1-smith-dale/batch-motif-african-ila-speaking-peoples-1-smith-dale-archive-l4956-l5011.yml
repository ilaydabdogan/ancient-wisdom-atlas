  text: Cattle sleep in large pens; in smaller villages the pen may be made of reeds
    and poles with gaps between them.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Outside the cattle enclosure there may be a pole topped with a small horn
