canonical_text:
  quote: ''
  summary: The passage introduces Ba-ila leechcraft by defining musamo as a category
    covering both medicinal remedies and powers the authors call magical. It then
    surveys Ba-ila anatomical vocabulary, named vital spots, ideas about organ functions,
    sight as reflection in the pupil, suspicion of a direct stare, an oath by the
    unseen back of the head, and the attribution of many organic processes to creatures
    called bapuka.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The term musamo is translated roughly as "medicine" and is said to include
    both medicinal remedies and powers described by the authors as magical.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: From the native point of view described in the passage, no difference is made
    between medicinal and magical uses of musamo.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Ba-ila are described as hunters accustomed to cutting up animals and cattle,
    and as sometimes having cut up human bodies; the passage says they know the shapes
    and names of many organs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage lists named parts of the head, trunk, genitalia, upper limb, lower
    limb, and bodily fluids.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Ba-ila name certain vital spots where wounds are considered dangerous
    or fatal, including spots at the back of the neck, above the knee, above the ankle,
    on the arm, and near the kidneys.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that the Ba-ila generally assign psychical rather than
    physiological functions to internal organs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The pupil of the eye is associated with sight; the reflection of external
    objects in the pupil is said to constitute vision, and absence of reflection means
    blindness.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: A direct glance or stare is considered baneful; one who stares at another
    is considered to be planning or causing evil and is called "hard-eyed."
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The back of the head and neck, called makoshi, is used in swearing an oath
    that refers to a part of the body the speaker cannot see.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Many organic processes are ascribed to beings called bapuka, a term applied
    to insects, reptiles, and fabulous animals.
  category: relationship
  evidence_refs:
  - ev:9
