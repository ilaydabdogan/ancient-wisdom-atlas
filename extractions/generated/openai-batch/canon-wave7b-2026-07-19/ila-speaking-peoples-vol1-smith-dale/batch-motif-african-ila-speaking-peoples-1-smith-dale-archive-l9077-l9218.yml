canonical_text:
  quote: ''
  summary: The passage lists Ba-ila disease names and treatments using plant, animal,
    water, fire, heat, clay, metal, and other materials. It includes a children’s
    scar-making practice connected with Leza and Leza’s wife, a child’s disease-removal
    treatment performed at crossroads, and a summary of disease causes as transferable
    substance, dangerous contact or distant influence, and witchcraft.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A poisoned arm called Chisubu is treated by making twigs of the Mwande tree
    into a coil, dipping it in hot water, and applying it repeatedly to the arm.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cracked heel skin called Manga is treated with ash from burnt castor oil seeds,
    and hare's brains are also used for the same condition.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mafubikila are sores that children intentionally make on themselves by lighting
    moistened cotton and placing it burning on the arm repeatedly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Children are told that if they do not make these sores, after death Leza will
    give them flies to eat and nothing more.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Children count the scars in play, naming some as their own, some as Leza's,
    and the last as Leza's wife's.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: After making Mafubikila burns, lizard dung is applied to heal the wounds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A small child's skin disease called Chimbalambala is treated by washing the
    child at crossroads in a cooked mixture and running away with the child swiftly,
    with the stated result that the disease is left behind.
  category: sequence
  evidence_refs:
  - ev:7
