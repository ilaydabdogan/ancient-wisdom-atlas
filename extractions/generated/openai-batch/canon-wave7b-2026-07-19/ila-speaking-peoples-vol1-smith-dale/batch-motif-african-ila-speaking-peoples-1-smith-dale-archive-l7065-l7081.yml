canonical_text:
  quote: ''
  summary: 'The passage describes basketry patterns among the Ba-ila: a coiled basket
    called chimb alamashasha, similar to the intumba but weaker because its lubale
    is alternately spaced to expose the grass foundation, and the intundu, described
    as the Ba-ila basket par excellence, made wholly of lubale with warp and weft
    elements in the base.'
