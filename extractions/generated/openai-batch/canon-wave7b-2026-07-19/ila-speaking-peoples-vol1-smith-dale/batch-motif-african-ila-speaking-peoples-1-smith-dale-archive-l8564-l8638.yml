canonical_text:
  quote: ''
  summary: 'The passage describes Ila leechcraft practices: topical treatments for
    skin disease; occasional forest segregation of the ill from influences attributed
    to pregnant women and women who have aborted; taboos attached to medicines; local
    symptom-naming; and named diseases with remedies or restrictions, including mumps,
    measles, smallpox, yaws, and leprosy.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For skin diseases, leaves or other drugs may be tied on, or decoctions may
    be made and used as embrocations.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An ill person may be placed in a shed built away in the forest to avoid influences
    said to emanate from pregnant women and women who have aborted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A musamo usually has an associated taboo; the patient must refrain from certain
    things or the medicine may lose efficacy.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Soft meat is prohibited in the stated taboo examples, and sexual intercourse
    is very frequently forbidden.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man was indignant at his son, treated repeatedly for elephantiasis, because
    the son disobeyed medical orders about women and worsened; the father called him
    “the village dog.”
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Mwila is said to name and describe symptoms rather than diseases, using
    phrases such as being “dead of the head” or “dead of the foot.”
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: For chisantula or bayibayi, identified in the passage as mumps, ground-nuts
    are threaded with grain-stalk pieces and tied around the neck.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: For chibombwe or ibombwe, identified in the passage as measles, the patient
    is smeared with impemba, a white substance said to be snake faeces.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: For chimbemba, identified in the passage as smallpox, the described treatment
    includes opening ripe pustules with a thorn, fomenting sores with Mukumbia root,
    sprinkling powdered leaves on sores, giving Mubumbu root decoction to drink, and
    rubbing lizard excrement around affected eyes.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Bunono, identified in the passage as yaws, is described as prevalent and marked
    by circular rounded excrescences with yellow matter; the Ba-ila say it came from
    the north-east, and the passage states that treatment is not known.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: Chinsenda, identified in the passage as leprosy, is also called Mudilo wa
    Leza, translated as “the fire of God.”
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: For leprosy, the passage says local people seem to take no segregation steps,
    except that the patient is ordered to leave his wife and avoid intercourse with
    her or other women until cured; this taboo is ascribed to Leza.
  category: action
  evidence_refs:
  - ev:10
