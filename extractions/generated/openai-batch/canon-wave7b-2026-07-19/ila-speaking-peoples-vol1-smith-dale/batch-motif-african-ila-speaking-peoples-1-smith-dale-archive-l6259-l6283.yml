  quote: '"Make good, O Leza, and give to us crocodiles and many fish"'
  summary: In a passage on the Ivhumbō fish-trap, a man places medicine in his mouth,
    spits it around, and prays to Leza for crocodiles and many fish. When a crocodile
    is enclosed while pushing the Iwando, it causes excitement and is treated as a
    good omen for fishing because crocodiles are believed to indicate many fish nearby.
  language: English with an Ila prayer and English translation
