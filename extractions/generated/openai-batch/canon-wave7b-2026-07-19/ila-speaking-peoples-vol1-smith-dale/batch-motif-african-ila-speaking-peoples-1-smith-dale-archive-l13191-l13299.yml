  text: Current custom does not allow marriage with the mother's brother's daughter
    despite reciprocal address terms translated as "my wife" and "my husband"; the
    passage states that only one of four possible cousin-marriages is now allowed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker may marry the father's sister's daughter, but the passage says
