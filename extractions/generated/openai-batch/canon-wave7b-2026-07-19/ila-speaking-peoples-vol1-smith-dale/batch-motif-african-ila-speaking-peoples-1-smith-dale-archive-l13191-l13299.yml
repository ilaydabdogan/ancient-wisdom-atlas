    her sisters, and his father's sisters bama.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The father's sister has a special term, tata mukaintu, glossed as "my female
    father," used to express paternal aunt.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mother's brother alone receives the term achisha, glossed as "my uncle."
  category: speech
