canonical_text:
  quote: ''
  summary: 'The passage describes Ba-ila kinship terminology and social rules: restricted
    cousin marriage, classificatory parent and grandparent terms, the special authority
    of the mother''s brother, cyclic naming of generations, exceptions for sister''s
    children, and spouse-like address terms used for some cousins and grandchildren
    without implying marital rights.'
  language: English
  quote_policy: summarized
