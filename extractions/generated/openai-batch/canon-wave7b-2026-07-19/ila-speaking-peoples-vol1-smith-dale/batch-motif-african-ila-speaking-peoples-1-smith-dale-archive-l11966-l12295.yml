canonical_text:
  quote: ''
  summary: A social-organisation register lists Ila clan names, their totems, and
    associated places. The section includes numbered clans with animal, plant, weather,
    food, material, and water/fish totems; subsections for clans named from places
    and persons; a doubtful list; and footnotes explaining selected clan names, nicknames,
    a medicine-horn etymology, a Creator relation claim, and a clan division from
    Bana-Leza.
  language: English
  quote_policy: summarized
