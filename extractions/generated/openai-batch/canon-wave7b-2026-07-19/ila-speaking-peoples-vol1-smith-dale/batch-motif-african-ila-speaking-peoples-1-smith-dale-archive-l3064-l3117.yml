  quote: ''
  summary: The passage describes reported physical characteristics of the Ba-ila,
    including eye color, facial features, hairdressing effects, hands and feet, muscular
    development, women’s carriage from carrying burdens, childcare handling, rapid
    ageing, slave women’s appearance, and boys’ post-puberty development.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The authors state that they have not found albinos among the group being described,
    while noting that they have seen albinos among the Basuto and other South African
    tribes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes the iris as dark brown or black, the pupil as black,
    and the sclerotic as usually yellowish and cloudy rather than white and clear.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says strong chins occur in some individuals, but chins are mostly
    rounded, weak, and retreating, without a firm jaw line.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The coiffure called en cornet is said to pull the scalp back, make the forehead
    prominent, and give an open-eyed, staring appearance.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ear is described as ordinarily small and set far back.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Hands and feet are described as often remarkably small; the authors report
    difficulty putting on bracelets that chiefs could put on and remove easily.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Many women are described as having handsome figures, well-moulded arms, and
    long tapering hands.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Muscular development in both men and women is described as magnificent, with
    fat and unwieldy persons said to be rare.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage describes the people’s carriage as graceful and says women’s practice
    of carrying heavy head-loads, including water pots and wood bundles, contributes
    to this carriage.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: When a woman removes her child from the skin on her back, she usually straightens
    and slightly stretches the child’s limbs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that Ba-ila age quickly, especially women, and describes
    visible changes after marriage and childbirth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Slave women are described as unkempt, wrinkled, prematurely aged, and clothed
    only in bits of rough hide.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Boys are described as developing rapidly after puberty, and the passage says
    people are younger than they look.
  category: sequence
  evidence_refs:
  - ev:7
