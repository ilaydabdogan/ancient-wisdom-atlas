canonical_text:
  quote: ''
  summary: 'The passage describes Ila blacksmithing: iron is broken, melted with bellows,
    formed into ingots and tools, and the village smithy contains a blacksmith, an
    assistant operating bellows, a charcoal fire, tools, an anvil stone, visitors
    or clients, and mention of scarce iron supplies.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A lump of iron is broken up, melted by a smith with bellows, made into ingots,
    and then turned into axes or sold.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The blacksmith, called mufuzhi, works in a smithy, called chifudilo, described
    as a roughly built roofed shelter without walls in an open village space.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: An assistant operates the bellows while the blacksmith is at work.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bellows consist of two shallow wooden bowls with elongated hollow tubes,
    hide binding, loose skin covers, and small sticks used as handles.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The projecting tubes of the bellows are inserted into a baked earthenware
    tube whose base is in the fire, and the operator moves the sticks up and down
    to send a continual blast into the fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The charcoal fire is made in a hollow scooped out of the floor.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The smithy contains hammers, tongs, an iron chisel, and an anvil made from
    a large stone embedded in the ground.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: To hold a pointed piece of iron, the smith cuts a short stick and burns a
    hole into its end with the object to be held, making a temporary handle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: About half a dozen people occupy the smithy; some are there for gossip, and
    others have jobs requiring the smith’s assistance.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that iron is presently scarce and mentions supplies from
    Bunduwe and Bumbala.
  category: other
  evidence_refs:
  - ev:6
