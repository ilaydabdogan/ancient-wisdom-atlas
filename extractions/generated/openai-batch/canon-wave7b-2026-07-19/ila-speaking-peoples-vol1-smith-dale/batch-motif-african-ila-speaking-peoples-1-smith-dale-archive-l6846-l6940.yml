canonical_text:
  quote: ''
  summary: The passage describes Ila ivory-turning with a bow-lathe, the making of
    ivory bangles, the attribution of ivory-turning skill to “medicine,” and brief
    accounts of skin-dressing and string-making practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ivory-turner begins a solid ivory piece by boring small holes at both
    ends, inserting poppet points, separating the sides of the lathe, adjusting the
    block, and fastening the wedges again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The turner squats on the ground, holds the bow in his right hand and a tool
    in his left, and steadies the tool under his big toe on the rest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In making a bangle, the first operation is to cut out the core of the ivory
    block, leaving a hollow cylinder.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bangle is cut to width and given a raised mongo, described as the bangle’s
    “backbone.”
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The tools named for ivory-turning include a hammer, various miengo or carving
    tools, cutters, and a hooked iron tool used as a gouge, mounted in wooden handles.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Ivory-turning is said to be regarded by the Ba-ila less as a matter of talent
    than as a matter of “medicine.”
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The ivory-turner procures medicine for skill and periodically washes his face
    in a decoction to keep his eyes sharp and prevent his chisels from going awry.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The turner and onlookers were amused when one of the observers tried the lathe
    without possessing the relevant “medicine.”
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage says the Ba-ila do not know tanning and are less expert than the
    Barotsi and Bechuana in dressing and sewing skins; it also says the Balumbu have
    the cleverest hands in this work and have been influenced from the west.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Animal skins are used for clothing and ornament; smaller antelope skins are
    preferred, lechwe skin is preferred for women’s dress, and lion, leopard, smaller
    carnivore, and other small animal skins are also used.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: Skin-dressing involves pegging the fresh skin down, removing flesh, scraping,
    rubbing with a stone or ant-heap lump, and working it between the hands with or
    without fat until soft.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Holes in skins are sewn or patched with thread from fibrous plants or fine
    sinews; except at Nanzela, skins are not sewn into karosses.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Twine is made from fibres without mechanical aid by rolling or twisting between
    the hands or on the thigh; the passage also names the making of three-ply cord
    and notes that spinning and weaving are not known.
  category: action
  evidence_refs:
  - ev:6
