canonical_text:
  quote: ''
  summary: The passage describes a Bambala doctor’s inherited knowledge of medicinal
    plants, his storage and display of numerous drugs, his ritualized manner before
    patients, his ornaments, his prayer with calabash and rattle before administering
    medicine, and the fee said to enable the digging and efficacy of the medicinal
    root.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The doctor’s knowledge is said to come from his grandfather, described as
    a noted physician who taught him roots, leaves, and their uses in the veld and
    forest.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the observers’ request and for payment, the doctor brought more than sixty
    drugs, which he named and described.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The drugs were produced one by one from a bag made from an entire monkey skin
    and were tied in bundles, wrapped in cloth, or held in receptacles such as antelope
    horns, crocodile teeth, and armlets.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The authors state that elaborate tying-up of medicines is a repeated practice
    among doctors and that it appears to enhance the medicine’s value.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: When sitting before a patient, the practitioner assumes a grave manner, slowly
    produces the drug, unrolls wrappings, and scrutinizes them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The doctor ornaments himself with feathers, antelope horns, and unusual objects.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The authors interpret the display, ornamentation, and solemn handling of drugs
    as impressing the patient and producing a strong suggestive effect.
  category: other
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Before administering medicine, the doctor prays while holding a small calabash
    of medicine in one hand and a rattle in the other.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The prayer addresses a creator of the medicine and all things, asks that the
    patient live, asks that witchcraft be driven away, and asks that the medicine
    strengthen the patient.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: A fee called chishishamutenga is described as necessary before the root can
    be dug or before the medicine can have its effect; some doctors demand additional
    payments.
  category: relationship
  evidence_refs:
  - ev:8
