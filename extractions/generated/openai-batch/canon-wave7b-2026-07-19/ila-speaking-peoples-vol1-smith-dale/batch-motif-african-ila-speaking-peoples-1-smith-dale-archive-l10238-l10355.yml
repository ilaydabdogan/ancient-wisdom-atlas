canonical_text:
  quote: ''
  summary: The passage describes several Ila divination procedures using balanced
    pots, an axe, roots, a walking-stick, medicine, and a calabash. Yes/no answers
    are read from movement, balance, adhesion, or the diviner's reading of a calabash.
    The passage reports that the first five methods are said to involve an ancestral
    ghost guiding the divining object, and it gives a Chilola diviner's explanation
    that parental shades appear in his calabash through medicine and answer questions
    with supernormal knowledge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Chipa method, the diviner washes in medicine, fixes an axe head edge-up
    in the ground, chews medicine, spits into a water-filled pot, and balances the
    pot on the axe with arrows helping support it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Chipa, the diviner addresses the pot with an incantation and interprets
    the pot remaining rigid as “Yes” and overbalancing as “No.”
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the observers tried the Chipa device and balanced the pot, the diviner
    explained the result by pointing to fragments of medicine that had fallen under
    the pot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kasambi is described as similar to Chipa, except that the pot is balanced
    on an untwisted piece of bark-string instead of an axe-edge.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In axe divination, the diviner doctors himself and the axe, rests the axe
    on bent iron, asks questions, and interprets forward movement as “No” and keeping
    still as “Yes.”
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In Impindo, the diviner chews drugs and spits the juice onto a walking-stick;
    two dark root pieces adhering to the stick mean “Yes,” while falling means “No.”
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: For the first five kinds of divining, the passage reports that the addressed
    power is said to be the muzhimo, an ancestral ghost, which guides the chisondo
    and gives the answer.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The authors state that, without the diviners’ explanation, they would have
    thought the power lay in the chisondo itself and that medicine enabled it to perform
    its office or released its energy.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: In Chilola, the diviner uses a small calabash with holes around the neck and
    whitish medicine inside, shakes a rattle, addresses the object, receives the applicant’s
    problem, and looks into the calabash while asking questions.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Chilola diviner said that two shingvhule, one male and one female, were
    in his calabash and were the shades of his father and mother.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Chilola diviner said his father had divined with the calabash and handed
    him the medicine so that he could take his place after death.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Chilola diviner said that when he puts the medicine into the calabash
    it changes into his father and mother, whose shades appear there, see what living
    people cannot see, and answer his questions.
  category: speech
  evidence_refs:
  - ev:8
