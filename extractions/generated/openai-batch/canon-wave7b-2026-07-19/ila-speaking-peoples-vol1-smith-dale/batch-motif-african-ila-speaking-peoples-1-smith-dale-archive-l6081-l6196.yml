canonical_text:
  quote: ''
  summary: The passage describes Ila hunting traps, pitfall hunting, pursuit of game
    with dogs, techniques for taking wart-hogs from burrows, encounters with lions
    and leopards while defending cattle, vowed hostility against predators after kin
    injury or death, and fishing practices on the Kafue and associated waters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'A spring noose trap is described: an animal steps on a hole, depresses the
    trigger, and is caught by the foot and jerked into the air by a sapling.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The inkolongo is a wooden cylinder fastened to the trap cord to prevent a
    captured animal from biting through the cord.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Pitfalls were formerly dug in thick bush used by eland, buffalo, and koodoo;
    when game was captured, the meat was divided between the pit owner and the finder.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hunters and dogs pursue forest animals; wart-hog, roan, and eland are named
    as common quarry, with roan and eland said to stand at bay against the dogs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When a pig enters a burrow, the hunter may block the earth with thorns or
    branches, use a smoke-fire to bring it to a spear, or dig it out with an axe blade
    fitted sideways as a hoe.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Many men are described as bearing scars from encounters with lions or leopards,
    including encounters connected with efforts to save cattle.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Two solitary herdsmen are reported to have killed a lion or leopard respectively
    but were mauled with fatal results.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After a lion killed a cow belonging to Chief Mwezwa of Nyambo, four young
    men went to the carcass, found the lion there, attacked it, and three were mauled
    or bitten before the fourth went for help.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that such encounters recur yearly and gives an example
    at Nalubanda where a lion attacking cattle was killed after mauling two assailants
    and after a third man was accidentally struck by a spear meant for the lion.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Some men are said to hold a special feud against fierce beasts; if a relation
    has been mauled or killed by a lion or leopard, the man declares enmity against
    the whole species and kills them when possible.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Kafue, its lagoons, and tributaries are described as rich in fish, which
    the Ba-ila use for food and merchandise and carry from the river in large seasonal
    quantities.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: One simple fishing method is to wade into a shallow pool and grope by hand
    for fish hidden in the mud; hooks called mavwezhi are also mentioned.
  category: action
  evidence_refs:
  - ev:10
