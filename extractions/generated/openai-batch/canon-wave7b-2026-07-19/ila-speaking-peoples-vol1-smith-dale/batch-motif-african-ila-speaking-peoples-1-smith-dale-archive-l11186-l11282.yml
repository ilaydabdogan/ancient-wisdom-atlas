canonical_text:
  quote: ''
  summary: 'The passage describes Ila clan transmission and its apparent change: the
    normal rule is maternal clan membership, though some speakers extend mukoa to
    paternal kin, half-clan relations, friendship, food-based address, and acquaintanceship.
    It distinguishes true clan or clan-like friendship by aid in illness, bereavement,
    danger, death, and other trouble. It also describes children of a bondwoman and
    freeman taking the father''s clan, and presents the clan as a mutual-aid body
    responsible for protection, feud, marriage consent, redemption from slavery, and
    hospitality to same-clan foreigners.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The stated general rule is that a child, male or female, takes the mother's
    clan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When directly asked whether they take the mother's or father's clan, different
    persons answer mother, father, or both; the passage says that taking both would
    give one person many clans, while speakers still affirm the mother's mukoa as
    the true one.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A trusted informant says a person's clan can include mother's side, father's
    side, grandparents, and ancestors, but elsewhere calls the father's and grandparents'
    clan kameko or kamekomeko, described as half-and-half clans.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The word mukoa is described as being used for food-based address, ordinary
    covenants of friendship, acquaintanceship through eating and drinking, and relations
    on both sides of descent.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: A true clan or true clansman is identified by practical help in trouble, bereavement,
    illness, death, and other misfortunes.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
  - ev:7
- id: obs:6
  text: One speaker describes a firm friendship as a long and unfailing covenant in
    which friends hold each other, are united like fingers in a hand, visit during
    illness, and weep together in bereavement.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The authors state that if the distinction between kameko and mukoa disappears
    and a person takes several clan names, the existing exogamous system must collapse.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Children of a bondwoman married to a freeman generally take the father's clan
    and may be preferred for a chiefship in the father's community because they are
    expected to have the place's interests at heart.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The clan is described as a mutual-aid society whose members help one another,
    right wrongs, share responsibility for wrongdoing, take up feud after a killing,
    consent to a daughter’s marriage, and contribute to redeem a clansman from slavery.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: If a Muluba visitor says he is Munampongo, meaning a Goat, Banampongo in the
    village show him hospitality as a clansman, despite his being from another tribe.
  category: action
  evidence_refs:
  - ev:8
