canonical_text:
  quote: 'The man was kuta : that is, the evil consequence, the curse, was upon him.'
  summary: 'The passage describes Ila ideas and procedures concerning homicide, especially
    killing close relations, elders, or incurables: such acts bring a named curse,
    require compensation, ghost-laying, and offerings to the communal god, and are
    illustrated by examples and an Isanti tradition of exemption from homicide damages.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Kabadi, a young man at Nanzela, killed one of his father's wives by hitting
    her with a stick; the woman's clansmen required heavy damages, the communal god
    had to be propitiated, the ghost had to be laid, and Kabadi was considered under
    a curse that was later connected with his suicide.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chikuto is described as a special curse falling on a person who sins against
    close relations; examples include a son seeing his mother's nakedness, and a mother
    may deliberately expose herself before a disobedient son so that he becomes kuta
    or mukute.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person who kills a father, mother, maternal uncle, sibling, or child is
    called mukute and is said to die soon, die violently in the veld, be taken by
    a lion, be drowned, become a warlock, or be killed by others.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Senicide and killing incurables are said to have similar consequences, and
    the Ba-ila have a term, kusaulula, for the action.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: An old man whose daughters were said to have considered killing him later
    rose at night, fell into the fire in his hut, and died of the injuries the next
    day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some old people ask to be killed or curse others in order to provoke a fatal
    blow; the passage says the Ba-ila are patient with such elders and have a saying
    that an angering aged person is not to be answered.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Killing an aged person or giving a death-stroke to a hopeless invalid is regarded
    as wrong; a stranger offender pays full homicide penalties, while a relative offender
    is left to chikuto.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Old men are said to be dangerous to harm because they may have accumulated
    misamo, such as lubabankofu and ngongoki, which can produce discomfort, emaciation,
    madness, and death in an attacker.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The ghost of a murdered person must be reckoned with; the luloa blood-offering
    to the communal god consists of two cattle, and Iwembe fines are paid to the murdered
    person's clansmen.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Village quarrels, especially during beer-drinking at feasts, can become fights
    with sticks and spears; if a man kills another, the victim's friends may spear
    him as vengeance, though often the matter is brought before the chief.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In a homicide settlement the chief may award damages of twenty cattle as Iwembe;
    the offender's clansmen contribute these to the murdered person's clan, also contribute
    two cattle as luloa, and obtain a doctor to treat the murderer, lay the ghost,
    and avert ill-luck.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Isanti, a part of the Kasenga chishi, is described as exempt from murder damages;
    the tradition says Shimunenga displaced the Banachindwe by sending them to hunt
    and then granted them Isanti with exemption from Iwembe and luloa.
  category: setting
  evidence_refs:
  - ev:8
