canonical_text:
  quote: ''
  summary: The passage describes Ila etiquette concerning house entry, hospitality
    to visitors, gift-handling, meal conduct, return gifts, favoured-guest courtesies,
    and several categories of personal names, including restricted birth-names tied
    to ancestor reincarnation, everyday nicknames, hunting names, and praise-titles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ba-ila houses are described as open; a visitor may enter by the open door
    without speaking or knocking, though asking permission is more polite, and the
    entrant may be held responsible if anything is later missing or damaged.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kuyumbula, the giving of an inyumbu or uncooked-food present to a visitor,
    is described as Barotsi in origin, tribute-like, somewhat compulsory, and disliked
    by the Ba-ila.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kutwila, preparing food for a visitor, is identified as Bwila custom.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The host tells his wives to prepare food; to show respect he brings or offers
    it himself, while for ordinary people he may send it by a servant.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The host should taste the food first; if he does not and harm comes to the
    visitor, he may be suspected of witchcraft.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The visitor should not eat alone; if he has no companion, he should invite
    a villager to share the meal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A gift should be received with both hands, since one-handed acceptance is
    said to imply that the gift is inadequate.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A stranger receiving food should leave something in the pot; scraping it out
    may bring laughter and a charge of gluttony, while a fellow-villager or friend
    may eat all without reproach.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After eating, the visitor says that he is satisfied, has been given food,
    and returns thanks.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: A casual visitor is not expected to give anything in return for hospitality;
    a hunter or trader may offer meat or merchandise to the chief, but an ordinary
    return gift to the host may offend the host.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage lists lending a wife as another courtesy extended to a favoured
    guest, and states that hospitality is highly esteemed and praised in proverbs.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Ila name etiquette restricts indiscriminate use of personal names; some people
    may not be addressed by birth-name, others by either birth-name or nickname, and
    others by neither.
  category: other
  evidence_refs:
  - ev:9
- id: obs:13
  text: A birth-name is given soon after birth after a diviner determines which forebear
    the child is the reincarnation of; the returning ancestor is said to bear the
    name from the previous sojourn.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The birth-name is termed 'the great one, the one of the divinity,' is tonda,
    and is not to be lightly used or pronounced by its bearer.
  category: attribute
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:15
  text: Calling someone by the birth-name is called shokolola and is an offence, except
    when done by the person's father, mother, brothers, or sisters.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:16
  text: A child is given another everyday name, often describing a birth circumstance
    or characteristic; later names may include a hunting name, and these secondary
    names are called nicknames.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: Praise-titles laud a person; they may be shouted aloud on occasions of fumba
    and are bestowed by fellows or sometimes assumed by the person, often alluding
    to traits and exploits.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:18
  text: Praise-titles are also used to flatter chiefs and others when followers hail
    them by these titles.
  category: speech
  evidence_refs:
  - ev:13
