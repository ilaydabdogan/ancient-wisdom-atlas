literal_observations:
- id: obs:1
  text: A screen and a small platform used as seat by day and bed by night are made
    of poles plastered with clay; the platform face has snake and impande moulding.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fireplace is moulded of clay, stands about a foot from the ground, has
    spaces for fire, and supports pots on its edges.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Behind the fireplace is a semicircular clay fireback on which a snake appears.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A platform called lupango is erected over the fireplace for storing firewood.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A low platform holds large beer pots, each with a moulded stand, and a suspended
    inkata holds a churn calabash or pot of milk with a calabash device to keep rats
    away.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Bundles of medicines are suspended from the roof, and a rack with a wooden
    trough holds spears against the wall.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: A partition dividing the hut is made from long clay grain receptacles called
    shumbwa, standing on a platform, sealed, and opened by puncturing a small hole
    near the foot.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The cornice above the shumbwa is decorated; the snake pattern predominates,
    and animal paintings include cattle, eland, lions, and leopards, using ash, charcoal,
    and tinted clays.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: The inner chamber, called chimpetu, contains a bed made from a platform of
    sticks covered with skins; the floor is below ground level and made of beaten
    ant-heap clay.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: A newly decorated hut later becomes soot-covered, its mouldings chip off,
    and its painted colours fade.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage reports calves kept in the hut, damage by termites, vermin infestation,
    voracious rats, ticks, and chigoe; after some years people build a new village
    on another site.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: A polygamist builds one hut for each wife; the chief wife's hut is central,
    the husband has a private hut near it, wives visit him by turn, and children sleep
    in the various huts.
  category: relationship
  evidence_refs:
  - ev:6
