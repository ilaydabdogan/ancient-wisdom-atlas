canonical_text:
  quote: ''
  summary: 'The passage describes stages of hand-making a clay pot: clay rings are
    built on a base, the wall is scraped and thinned with a cob, wood, or bone while
    being supported by hand, the neck is shaped, the surface is sprinkled with water
    and smoothed, the base is wrapped with moist cloth and dried in shade, and the
    bottom is later closed and indented by thumb.'
