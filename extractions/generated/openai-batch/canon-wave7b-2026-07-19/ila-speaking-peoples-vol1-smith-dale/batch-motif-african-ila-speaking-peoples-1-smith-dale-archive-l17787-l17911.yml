canonical_text:
  quote: ''
  summary: The passage describes Ba-ila rules of property acquisition and ownership,
    including individual, household, chiefly, and slave-related property relations.
    It emphasizes that women may acquire property through labor and crafts, gives
    Kasale as an example of a wealthy woman whose prosperity and posthumous transformation
    are attributed to powerful medicines, and describes several marital property arrangements
    involving food stores, private gardens, ornaments, an anointing-fat receptacle,
    and cattle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ba-ila are described as strongly attached to their land, cattle, and other
    property and as resenting unlawful interference with it.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Property is described as held individually, jointly by spouses, by a clan,
    or by a community; slaves are said not to hold property, because what they have
    belongs to their masters.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that Ba-ila law recognizes property-holding by women.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Women may acquire property through labor; an unmarried woman or widow may
    become wealthy, acquire cattle and slaves, establish a village, and rank as a
    chief.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kasale is identified as a famous wealthy woman of Ichila who died at an advanced
    age in 1914.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ba-ila explanation in the passage attributes Kasale's prosperity to her having
    eaten powerful medicines intended to secure long life and wealth.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: The medicines Kasale consumed are described as made from shin bones of a wild
    dog, a crocodile, a lion, and a man identified as a mwalanze, an outcast wanderer
    of the forest.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Before death Kasale ordered that she not be buried for four days, one day
    for each drug; she was buried and mourned on the fifth day.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'The passage states that the four medicines caused Kasale to become the named
    beings and that she now wanders in the country in four guises: wild dog, crocodile,
    lion, and vagabond.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Household food stores are divided between husband and wife when a marriage
    dissolves, while produce from a private garden may be held individually.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: A chief may have a field cultivated by slaves or servants, and its produce
    is kept for entertaining visitors in a guest granary.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Baskets and pots made by women belong to the maker, and proceeds from their
    sale are hers.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The impau, a receptacle for fat used by a woman to anoint herself and given
    at marriage, is described as absolutely hers.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage describes an arrangement in which a wife goes out to 'hunt wealth,'
    reports back, and the husband claims a cow from the man involved; after several
    cows, he may give one to her, and its progeny is hers.
  category: sequence
  evidence_refs:
  - ev:9
