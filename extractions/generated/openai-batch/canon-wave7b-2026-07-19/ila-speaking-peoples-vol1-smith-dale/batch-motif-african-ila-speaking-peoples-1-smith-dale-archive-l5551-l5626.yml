  quote: ''
  summary: The passage describes Ba-ila staple foods, seasonal changes in diet, fishing
    and garden produce in January, meat preferences and food prohibitions, ordinary
    meal practice, and a small food offering made to family ghosts when visiting a
    relative.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ba-ila staple foods are porridge, called inshima, and sour milk, called
    mabishi; sour milk is unavailable in tsetse-fly districts.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Food availability varies by season; when grain is scant from about December
    to February, the purple berry shikisu may be the sole article at many meals.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In early January 1915, men, women, and children were seen returning from fishing
    with traps and baskets of fish, while another procession returned from riverside
    gardens with green corn and pumpkins.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: As crops ripen, green corn gives way to meal and porridge; after floodplain
    waters subside hunting becomes easier and meat becomes prominent; later, the fruit
    harvest begins.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Milk and beer are described as common drinks, and herd-boys formerly lived
    almost exclusively on curds and whey, receiving porridge by stealth from their
    mothers.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Ba-ila are described as strongly desiring meat; most parts of an animal
    are eaten, and coagulated blood is cooked with salt.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: People liable to nosebleeds may not eat blood, and the same prohibition extends
    to sweetbread.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage notes numerous totem and other taboos, and states that the Ba-ila
    proper refrain from eating certain animals eaten by Bambala or Balumbu.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Regular set meal times are not the custom; wives cook according to supply
    and energy and await husbands returning from work or hunting.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The sexes generally eat separately, but the rule is not absolute; women may
    not eat in company with male visitors.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: A visitor at a relative's home first scatters a little food on the ground
    as an offering to the family ghosts.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Diners eat porridge and relish with their fingers, dipping porridge into gravy
    or another relish; an honored visitor receives a choice dish.
  category: action
  evidence_refs:
  - ev:10
