canonical_text:
  quote: ''
  summary: The passage describes the plan of Lubwe village, including central space,
    entrances, cattle-pens, chief's enclosure, mizhimo huts for ancestral spirits,
    and trees. It explains the circular arrangement of huts, subsidiary enclosures,
    offerings and prayers to spirits for cattle and village protection, access points
    and defensive entrances, mikobo units, cattle-pens, social activity near huts,
    and the gendered labor and technical steps of hut construction.
  language: English
  quote_policy: summarized
