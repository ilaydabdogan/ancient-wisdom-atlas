canonical_text:
  quote: ''
  summary: The passage describes Ila explanations of hearing, ear pain, deafness,
    taste sensations, speech, war trophies, and mental life through bodily residents
    and organs. It presents bashimpulukutwi as ear-dwelling bapuka linked to hearing,
    shiu as a resident of the mastoid process, mouth-to-ear ducts that respond to
    tasty food, the tongue and lips as organs of speech, an enemy calvarium used as
    a trophy and drinking-cup, and the chest or heart as the principal seat and source
    of thought and feeling.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bapuka called bashimpulukutwi are said to dwell within the ears and to have
    hearing as their function.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bashimpulukutwi are described as born with a person and remaining while the
    faculty of hearing remains; their death is said to cause deafness.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Earache is attributed to restless movement of the bashimpulukutwi, temporary
    deafness after nearby gunfire to their being stunned, and ear-wax to their production.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When good news is heard, the bashimpulukutwi are said to be delighted.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A mupuka called shiu is said to live in the mastoid process behind the ear,
    which is called shiu's house.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A heavy blow behind the ear is said to kill shiu and also the man.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ducts leading from the mouth to the ear are called bashikamilongwe oba shiu,
