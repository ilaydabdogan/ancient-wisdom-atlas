  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Thoughts are said to arise in the chest rather than the brain.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Pulsating ducts going up the neck and appearing on the temples are said to
    convey thoughts from the chest to the brain.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The chest is described as the seat of thought and feeling; a heavy chest denotes
