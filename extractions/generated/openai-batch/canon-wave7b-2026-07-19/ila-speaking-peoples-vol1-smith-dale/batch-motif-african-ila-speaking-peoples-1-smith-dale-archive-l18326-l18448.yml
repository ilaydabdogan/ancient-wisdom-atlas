canonical_text:
  quote: ''
  summary: The passage describes Ila rules and cases concerning theft, entrusted goods,
    property damage, damage caused by animals or pits, claims around hunted animals,
    medicine-related offenses, obligations between doctors and medicine recipients,
    and a court case involving a disputed cow and calves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A stranger's goods are described as vulnerable to theft unless placed in the
    chief's charge, and a chief's bag of tax money disappears during a mission service.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Losing something entrusted to a person is identified as a crime with severe
    penalties in examples involving a pumpkin and an alleged lost needle.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Damage to property is treated as a crime in examples involving a broken stool,
    a torn cloth, a beer spoon, and an accident in a hut.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
- id: obs:4
  text: The passage states that an owner is responsible when a dog or beast damages
    another person's property, and that a person who digs a game pit is responsible
    if cattle fall into it.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:5
  text: Taking or eating an animal killed by another is called a crime, and certain
    conduct around the back of a killed elephant is reckoned as buditazhi.
  category: action
  evidence_refs:
  - ev:8
- id: obs:6
  text: Theft, damage, or improper use involving medicine, a medicine receptacle,
    or a pipe containing another person's drug is described as a serious offense.
  category: object
  evidence_refs:
  - ev:9
- id: obs:7
  text: A girl who befouls someone's medicine is seized as a slave, and the medicine
    owner demands an ox for her ransom.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:8
  text: A recipient of insambwe medicine gives a spear to the doctor, may share trading
    profits, and if he dies during a trading trip the doctor can claim cattle or a
    relation as a slave; reciprocal claims are described if the doctor dies during
    treatment.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:9
  text: In a court case, Mooba obtains a cow for Shimunza, refuses several proposed
    rewards, retains the cow and its calves, and is advised to return them while Shimunza
    is advised to pay him an ox.
  category: sequence
  evidence_refs:
  - ev:11
