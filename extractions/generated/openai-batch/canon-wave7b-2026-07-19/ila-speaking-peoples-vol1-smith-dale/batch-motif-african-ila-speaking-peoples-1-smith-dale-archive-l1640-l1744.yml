canonical_text:
  quote: Old men tell us that war was the normal thing and peace unknown.
  summary: 'The passage describes Ba-ila political disunity and gives several historical
    examples of local conflicts: a Lubanda-Bunga feud after a running dispute, a Ngabo
    fishing-rights battle, a Chiyadila-Nyambo land feud, repeated recourse to allies
    or foreign aid, ritual compensation to appease slain warriors'' spirits, displacement
    of communities, and the broader unsettled condition of the country before recent
    rule.'
  language: English
  quote_policy: quoted
