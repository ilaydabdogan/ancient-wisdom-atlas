canonical_text:
  quote: ''
  summary: 'The passage gives historical accounts of Bakaundi and Makololo movements
    affecting the Ba-ila: Jipumpu/Kasempa rises after conflict with Kawambala, returns
    from exile, establishes a hill stronghold, and raids; Sebitwane leads the Makololo
    north, uses alliance and warfare against neighboring groups, seizes cattle, compels
    Batwa ferrymen, defeats Ba-ila communities, and receives submission from Shianamwenda.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bakaundi are described as an offshoot of the Baluba, originally from the
    Lukanga near the Lualaba and later moving south to the Lukanga near the Kafue.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kawambala annexed the chiefship and is described as jealous of young men in
    his family, especially Jipumpu, later entitled Kasempa, who was a mighty hunter.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kawambala attacked Jipumpu's village and carried off Jipumpu's wives; Jipumpu
    later ambushed Kawambala in the forest and killed him with an arrow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A wounded son of Kawambala escaped and later returned with an army against
    Jipumpu; Jipumpu withdrew into Congo country for a year, then returned, defeated
    opponents, and ruled under the title Kasempa.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kasempa settled on Kamsongolwa Hill, gathered refugees, withstood attacks
    by Mushidi's armies, raided across the Kafue, sent men against the Ba-ila, died
    in 1907, and was succeeded by his nephew Kasempa Kalusha.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sebitwane, a Bafokeng chief of Basuto stock, left his home after disturbances
    attributed to Chaka and moved north with a large following.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Sebitwane moved through several regions and peoples, reached the Zambesi opposite
    Kazungula, and crossed the Zambesi after Sundamo asked for help against Sekute
    on Kalai island.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Makololo planned to conquer or rob the Batonga; Sebitwane made a matrimonial
    alliance with Mosokotwane, gathered Batonga leaders as if for counsel, and had
    them massacred while unarmed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: After the Batonga leaders were killed, their cattle herds were captured; later,
    after a daytime defeat, the Ba-ila returned at night and recaptured their cattle.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Sebitwane settled at Kapoli near Kalomo and imposed rule on surrounding tribes,
    but the Ba-ila were not easily subdued.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: Sebitwane defeated Ba-ila groups at several places, including Kasenga, Kabulamwanda,
    Mbeza, and Nyambo.
  category: action
  evidence_refs:
  - ev:10
  - ev:12
- id: obs:12
  text: Sebitwane captured some Batwa and compelled them to ferry his army across
    the Kafue; other Batwa fled into swamps.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: At Nyambo, after three days of resistance, the Makololo drove off cattle and
    reportedly killed warriors as well as old men and women.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: Shianamwenda, the Basala chieftainess at Longo, submitted to Sebitwane.
  category: action
  evidence_refs:
  - ev:13
