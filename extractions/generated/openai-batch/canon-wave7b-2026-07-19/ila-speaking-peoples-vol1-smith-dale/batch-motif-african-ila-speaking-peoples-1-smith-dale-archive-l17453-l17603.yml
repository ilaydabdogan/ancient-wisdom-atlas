canonical_text:
  quote: ''
  summary: The passage lists Ila offenses classed as buditazhi, chisapi, or taboo,
    including acts that make a living person resemble a dead person, acts leading
    to another's injury, forbidden handling of body parts or hair, boundary violations
    involving kin, widow marriage, menses, sacrifice, and the category of matushi
    or abusive speech with grotesque bodily comparisons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage lists acts said to make a person appear, in others'' imagination,
    like a dead person: carrying someone frog-march or as in a hammock, lifting someone
    while saying that the person is heavy, knocking out a tooth or cutting off a finger
    or ear, and calling someone by the name of a dead person.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that a doctor amputating a limb would be a great crime,
    while relations may perform such an operation only when absolutely imperative.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Causing another injury is illustrated by calling people to hunt lion or leopard
    when someone is harmed, taking a youngster on a journey where harm befalls him,
    deceiving a person into going or doing something that leads to an accident, and
    taking someone in a canoe who then drowns.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The stated explanation for the preceding accident cases is that the agent
    is supposed to have bewitched the injured person; any act that may make people
    think the agent desires another's death is called buditazhi.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: Putting a hand on a person's head, plucking hair from a person's head, taking
    away cut hair, and removing a tooth from someone who is not a relation are listed
    as wrongful acts; cut hair was carefully buried.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Urinating on a person, having a nocturnal emission on a person who is not
    a relation, and attempting sodomy are listed among the offenses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Causing someone to dig the grave of a stranger and making a sacrifice to another
    person's divinity are listed as offenses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says that neighbors should not tell a bereft village member that
    he has relations elsewhere, because a mistaken report could make the informants
    liable to enslavement by the people named.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: A woman suckling a child not belonging to her family is listed as an offense.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A man who is not the heir and marries a widow to whom he has no right is said
    to commit a great crime and may be enslaved by the heir's or woman's relations;
    the passage gives the case of Posha and Silwele.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: A female under puberty touching a man's pudenda is said by some to be buditazhi
    and by others to be chisapi; the passage reports a known claim for a cow after
    such an accidental act.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A woman during menses touching her husband's gun is listed as an offense.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Matushi is defined as a broad category of vilification, including derogation,
    insult, ridicule, indecent remarks, and some rude acts; aggravated matushi are
    called malambatushi and the verb given is kutuka.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Matushi are described as chisapi, as taboo because evil may come upon the
    user, and also as buditazhi for which the offender may be fined.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: One form of matushi ridicules a person by comparing the person's body parts
    with repulsive or grotesque things, either directly addressed to the person or
    said indirectly.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: Examples of such derogatory comparisons include a mouth like a stork's pouch,
    teeth like poorly made piano keys, eyes like a louse, forehead furrows like river
    waves, stooping like a man carrying demons, a belly like one expecting twins,
    and ears like a kudu's.
  category: speech
  evidence_refs:
  - ev:10
