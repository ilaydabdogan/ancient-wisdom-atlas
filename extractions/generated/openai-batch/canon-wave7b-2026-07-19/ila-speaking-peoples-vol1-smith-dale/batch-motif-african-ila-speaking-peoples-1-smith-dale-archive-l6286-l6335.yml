canonical_text:
  quote: The fish entering the wide open end find themselves unable to get out again.
  summary: 'The passage describes Ila fishing equipment and practices: a conical basket
    trap used in pools and shallow water, a more elaborate mono trap with an internal
    trapdoor, arrangements of multiple traps and a reed-mat weir near the Kafue-lagoon
    confluence, and the removal, bundling, temporary storage, cutting, and drying
    of captured fish.'
  language: English
  quote_policy: quoted
