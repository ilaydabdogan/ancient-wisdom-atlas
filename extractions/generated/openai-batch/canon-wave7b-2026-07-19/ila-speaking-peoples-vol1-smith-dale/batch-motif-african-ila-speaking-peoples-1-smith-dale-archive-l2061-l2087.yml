  summary: The passage recounts a Makololo-named raid called Hoia-hoia or the Kasenga
    war, led by Munangombe and Muzazani, involving cattle-taking and captives. It
    then relates Nakabanga's capture, removal to Kazungula, and later escape. The
    passage also reports accounts of a man named Saidi traveling through the region
    with chained men and foreign religious or dietary practices, and the authors tentatively
    identify him with the Arab slave-trader Sa'id ibn Habib known from Livingstone-related
    accounts.
