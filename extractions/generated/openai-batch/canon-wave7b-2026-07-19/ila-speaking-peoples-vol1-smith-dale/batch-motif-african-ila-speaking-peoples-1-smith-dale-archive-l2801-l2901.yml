canonical_text:
  quote: ''
  summary: 'The passage recounts historical reports about the Ba-ila: a Barotsi raid
    that annihilated Chief Zumbwa Shimata and his people at Lulonga; Selous’s later
    ambush and escape after entering Ila country; early missionary and colonial administrative
    arrivals; and the opening of an account of a conflict involving Ba-ila chiefs,
    including Mungalo’s refusal of succession because of a guardian-spirit warning.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mwanashimabula reported that during Lewanika's 1888 raid the Barotsi found
    Chief Zumbwa Shimata and all his people on an island in the swamps, surrounded
    them, and annihilated them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Lulonga became desolate, Musulwe installed Mwanashimabula as chief and
    allowed people to remove there so the village could be re-established, but the
    passage says the place never flourished.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The report of the Lulonga misadventure increased dread of the Ba-ila and contributed
    to later advice that Selous avoid them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Selous intended not to enter Ila country but, after leaving the Batonga at
    Monze's, found himself among the Ba-ila at Minenga's.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Ba-ila at Minenga's appeared friendly and constrained Selous to camp before
    the principal village, while the passage states they had already determined to
    massacre the party.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Selous became suspicious only after hearing in the evening that all the women
    had been sent from the village.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The attack involved guns fired near Selous and a shower of spears into the
    camp.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Survivors escaped through long grass around the village; Selous became separated,
    lost his rifle, and reached Batonga villages safe but nearly naked and robbed
    of most possessions.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage offers an explanation that rebel Barotsi instigated the attack
    because they believed Selous had a large store of gunpowder wanted for use against
    their chief.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The first settlers among the Ba-ila named in the passage were Primitive Methodist
    mission pioneers who reached Nkala in 1893 and 1895.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Company and police activity expanded north of the Zambesi after a treaty with
    Lewanika, and a station was established near Monze to regulate trade and keep
    order.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: In 1900 Gielgud and Anderson marched through Ila country without molestation
    and built a station at Muyanga on the Upper Kafue.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage says the first conflict between Company officials and the Ba-ila
    arose from internecine quarrels among the Ba-ila, including friction between Mungalo
    of Mala and Mungaila of Kantengwa.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:14
  text: After Shambamba's death at Mala, Mungalo was invited to succeed him but refused
    because his guardian spirit had warned him in connection with acceding; the consequence
    of acceding is not included in the passage excerpt.
  category: speech
  evidence_refs:
  - ev:11
