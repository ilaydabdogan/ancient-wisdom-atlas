canonical_text:
  quote: '"They go on strike. They down tools, hoe and pestle, grinding-stone and
    cooking-pot"'
  summary: The passage catalogs forms of Ila matushi, or insulting/indecorous speech,
    including insults about kin, accusations of sexual or familial violations, forbidden
    admiration across communities, references to private parts or bodily functions
    in mixed company, and avoidance of words or syllables that sound indecent. It
    also describes collective sanctions, especially women acting together against
    men for sex-based offences, including withholding labor until apology and gifts
    are made.
