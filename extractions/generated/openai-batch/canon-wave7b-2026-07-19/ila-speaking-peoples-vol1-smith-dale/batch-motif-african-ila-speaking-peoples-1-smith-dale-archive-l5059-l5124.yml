canonical_text:
  quote: ''
  summary: 'The passage describes annual Ba-ila cattle ceremonies: a ceremonial departure
    of herds to the river when village water and pasture decline, rites at a new river
    post involving sacrifice and offerings to spirits, a later ceremonial return to
    the village with stored milk, meal preparation, decorated young men, and a feast.
    It also summarizes cattle diseases and hazards, and records an informant’s statement
    that dead cattle are not formally mourned but are skinned, distributed, and eaten.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two important annual events in the life of the herd are marked with ceremony.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When village drinking-water becomes scarce and pasture poor, the cattle are
    moved to the river-bank in an event called kuwila.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During kuwila, herdsmen dress for the occasion, young men with spears charge
    about, women shriek, drums beat, and cattle leave the pen for the river.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When a new post at the river is made, a young ox is sacrificed in the gateway
    and meal is offered to spirits toward north, south, east, and west.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the river site is the time-honoured one, tobacco is distributed to the
    herds instead of the new-post sacrifice and offering described immediately before.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A few months later the cattle return to the village in a ceremony called kubola,
    with stored milk and butter, women grinding meal, decorated young men bringing
    the cattle home, and a large feast.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage lists cattle deaths or illnesses from fluke, redwater, anthrax,
    contagious abortion, calf-scour, lions, crocodiles, funerary killing, old age,
    and poisonous water grass.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Ba-ila are described as affectionate toward their cattle and as good cattle-masters
    who care intelligently for their herds.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: An informant states that when an ox dies naturally or is killed by a wild
    beast, the owner does not summon people to weep, but skins it, distributes joints,
    and people eat it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The informant says that, for such a dead beast, the weeping comes in the eating.
  category: speech
  evidence_refs:
  - ev:6
