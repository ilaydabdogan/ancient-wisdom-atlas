  quote: ''
  summary: The passage describes Ba-ila etiquette in greeting, hosting, road encounters,
    age-based speech restraint, and handling spears in villages. It emphasizes a combination
    of personal independence and formal politeness, including prescribed salutation
    sequences, hospitality to visitors, and rules for laying down weapons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ba-ila mutual intercourse is described as combining bluff independence with
    scrupulous regard for politeness.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kneeling and clapping as a salutation is said not to be a Bwila custom among
    themselves, although the Barotsi and European officials imposed or insisted on
    it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man or woman may address even the biggest chief directly with the formula
    meaning 'You are seen' or 'Good day.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A stranger arriving at a Ba-ila village first asks where the chief is and
    may be directed to the chief's hut opposite the gateway.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The visitor sits down, and nobody speaks at first; this silence is described
    as polite because it lets the visitor recover and settle.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A cup of water is silently handed to the visitor before the chief or representative
    opens conversation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The person at home is expected to open conversation; the visitor should remain
    silent until addressed.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: Greeting formulas include 'You are seen,' 'You have got up,' and a reply acknowledging
    that both parties are seen.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The host asks for news, and the visitor conventionally first says there is
    none and asks about news there before giving fuller news later.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: If a visitor stays overnight, the chief will have food cooked or at least
    offer milk or beer.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Departure is marked by set phrases, and a chief may accompany a respected
    visitor to the gateway or partway along the road.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: A child should not address an elder first; a child who does so may be called
    cheeky or forward.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: People passing on a road are expected to stop and greet each other, and failure
    to do so can matter if a warning was missed and misfortune follows.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: When two men pass each other, each goes to the right, and stepping off the
    path on the right keeps the spear-hand free in case of treachery.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Proper etiquette for men passing each other is to stop, lay down spears, and
    salute.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: A man may carry spears into a strange village but must put them down before
    sitting and ask where he may stand them because the host may have a taboo about
    placing spears in certain places.
  category: sequence
  evidence_refs:
  - ev:8
