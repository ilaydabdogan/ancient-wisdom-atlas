canonical_text:
  quote: ''
  summary: 'The passage describes principles and examples of chiefship succession
    among Ila-related communities: birth alone does not determine succession; Nanzela
    succession is described as matrilinear while Bwila selection is freer; clan continuity,
    reincarnation belief, character, wealth, and community good may affect selection.
    It also gives an Itumbi case where a trial of skill chose Momba as chief, and
    describes inheritance and funeral exchange duties of the heir.'
  language: English
  quote_policy: summarized
