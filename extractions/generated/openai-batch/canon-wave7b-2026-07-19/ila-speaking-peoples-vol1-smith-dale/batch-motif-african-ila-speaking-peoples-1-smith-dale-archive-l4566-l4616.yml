canonical_text:
  quote: ''
  summary: 'The passage describes finishing and thatching Ba-ila huts, then explains
    roof-apex ornaments and projections: pots can mark the owner’s killings of a man,
    lion, or leopard; game heads may substitute for pots; at Nanzela a grass pinnacle
    is usual; projecting sticks on some huts memorialize spears fended off in battle.'
  language: English
  quote_policy: summarized
