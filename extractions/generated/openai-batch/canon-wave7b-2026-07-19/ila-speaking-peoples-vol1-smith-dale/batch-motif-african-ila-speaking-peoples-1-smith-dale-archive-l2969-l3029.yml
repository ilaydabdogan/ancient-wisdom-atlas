  quote: ''
  summary: An appendix lists chiefs and succession sequences for named Ila chiefdoms
    or localities. It notes that Shimunenga formerly ruled several places that largely
    became separate chiefdoms after his death, that Mala split among three chiefs
    with named successors, and that north of the Kafue Malumbe appears to have ruled
    several localities that later passed to different chiefs.
