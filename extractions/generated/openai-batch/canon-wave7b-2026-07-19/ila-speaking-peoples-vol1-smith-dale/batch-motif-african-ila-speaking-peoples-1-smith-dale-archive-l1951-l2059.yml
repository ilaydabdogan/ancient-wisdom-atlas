  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In a later encounter at the Zambesi, Sebitwane prevented the Matabele from
    crossing and sent cattle to them as food, after which they never attacked him
    again.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After Kataba, Sebitwane consolidated rule over the Barotsi and other tribes
