  evidence_refs:
  - ev:1
- id: obs:2
  text: A native prophet urged Sebitwane to go west and declared that the spirits
    willed that he should conquer the Barotsi or Baloiana.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sebitwane fought the Barotsi at Kataba and established ascendancy over them,
    then settled at Naliele.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sebitwane killed cattle, made large water-bags from their hides, loaded them
    on oxen, and ordered economical use of water for a desert crossing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The pursuing Matabele entered the desert without water or food, chewed shields,
    sandals, and other dry skin, and were attacked by Sebitwane when nearly exhausted.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Among the Matabele survivors, women and children were kept; only ten men reached
