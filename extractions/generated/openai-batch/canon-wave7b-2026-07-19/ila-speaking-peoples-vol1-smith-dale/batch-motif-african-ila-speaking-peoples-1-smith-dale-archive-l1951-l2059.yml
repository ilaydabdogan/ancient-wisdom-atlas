canonical_text:
  quote: ''
  summary: 'The passage recounts episodes in Sebitwane’s conflicts with the Matabele
    and other peoples: a battle at a mountain named for women fighters, a prophet’s
    declaration that spirits favored conquest of the Barotsi, strategic movement through
    waterless country using cattle-hide water bags, the destruction and near-annihilation
    of a pursuing Matabele force, later provisioning of starving enemies with cattle,
    consolidation of rule, and subsequent raids against the Ba-ila.'
  language: English
  quote_policy: summarized
