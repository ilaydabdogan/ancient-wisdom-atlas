canonical_text:
  quote: ''
  summary: The passage describes Ila political organisation, the selection of a chief
    after a predecessor's funeral, criteria for choosing an heir, and the use of medicines
    by a newly installed chief for protection, village-building, and potentially harmful
    witchcraft.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Communities are ruled by chiefs and headmen called bami, with the chief described
    as more nearly first among equals than an absolute ruler.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each chishi has a chief, villages or village segments have headmen, and chiefs
    with headmen form a council that settles disputes and judges cases.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After a chief's funeral, chiefs and headmen assemble to select a successor
    from among the deceased chief's 'children' and nephews.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The assembly debates the competence and conduct of proposed candidates before
    agreeing on one person to install.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The account states that there cannot be two chiefs; a disappointed 'child'
    of the chief may leave the village.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A candidate is not selected merely by relationship; the successor should have
    wealth to pay the deceased's debts and should be judged able, of good character,
    and competent to rule.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: When installed, the chief seeks medicines from doctors for protection against
    warlocks and people with complaints against him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The account says protective medicine can cause a person who plots against
    the chief to rise from bed diseased, showing that the chief has taken medicine
    and should not be plotted against.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: For building a village, the chief obtains medicine and has a doctor treat
    the site of the village.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The doctor places pegs of medicine at the hut site, doorway, around the hut,
    and around the intended village stockade.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says these medicines make the chief 'heavy' and dignified, so
    that the people recognise, revere, and fear his chiefship.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage says that if a chief goes too far with medicines, accumulates
    medicines for evil purposes, and mixes with witchcraft, he becomes a warlock and
    does not return to his former nature.
  category: sequence
  evidence_refs:
  - ev:7
