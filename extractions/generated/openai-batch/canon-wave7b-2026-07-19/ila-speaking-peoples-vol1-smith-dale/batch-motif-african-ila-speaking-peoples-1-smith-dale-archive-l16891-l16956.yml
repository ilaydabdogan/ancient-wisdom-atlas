canonical_text:
  quote: ''
  summary: 'The passage describes Ba-Ila judicial sanctions and customs: mutilation
    for repeated offenses, burning as execution for witchcraft, confiscation under
    kusala, elder-awarded damages and cattle compensation, sanctuary places where
    accused persons were safe until trial, deterrents against injustice, and an anecdotal
    legal claim involving a cock and a hen.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Persistent adulterers, thieves, and arsonists were punished by amputation
    of an ear, foot, finger, or toe; mutilation of the privates was not practiced,
    though burning with hot coals was.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A minor chief who sold into slavery the children born of his predecessor was
    opposed by their mother and punished by neighboring chiefs, who cut off both his
    hands.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Death was mostly reserved for persons found guilty of witchcraft; the condemned
    person was taken to the veld, laid on a pile of dry wood, surrounded with more
    wood, and burned while men watched.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the custom called kusala, a wrongdoer was treated as cut off from communal
    protection, and aggrieved persons could seize property and even lay claim over
    the wrongdoer's person, wife, and children.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Fines and damages awarded by elders included cattle compensation, such as
    twenty head for homicide, an ox-calf for minor buditazhi, and different adultery
    damages for a chief and a commoner.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A father had to pay for a child's fault, and a benevolent chief might show
    consideration to a poor person so as not to ruin him completely.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Certain places were treated as sanctuaries; a criminal, even a warlock, was
    safe until trial if he reached one, though many fugitives were mortally wounded
    during the chase.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sanctuary locations varied by district and included a chief's hut, a temple
    over a grave, and sacred groves such as those of Shimunenga at Mala and Chimbembe
    at Nanzela.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Judicial equity was said to depend on the chief's character; bribes occurred,
    but public opinion and assisting assessors deterred gross favoritism or injustice.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: A man brought a claim against another man whose cock had mated with his hen,
    asking damages equal to the value of a cow; the resolution was to kill and eat
    the cock.
  category: sequence
  evidence_refs:
  - ev:8
