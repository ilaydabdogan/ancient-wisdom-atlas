canonical_text:
  quote: ''
  summary: The passage describes Ila/Mwila property customs concerning marriage, children,
    game taken in hunting, animal portions with mystic significance for men, chiefly
    claims to hunting products, responsibility of a head hunter, and kinship rights
    of elders and some younger relatives to seize property under the practice called
    nanga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage begins with a caption naming a Mwila woman carrying a water-pot.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A husband is said not to have an absolute claim to his wife's hand-service,
    but by chiko to have secured the usufruct of her body.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Children are described as belonging to the husband; after dissolution of marriage
    the husband retains them, except that a nursing infant may stay with the mother
    until weaned.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men and women are both said to be entitled to the fruits of their labour.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In hunting, game belongs to the man who first wounds it, even if another person
    gives the death-stroke.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The person who gives the death-stroke is called a musuzhi and receives a piece
    of meat but has no ownership claim.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A hunting party may be led by an experienced elder who distributes the meat;
    the leader, owner, and chief each receive specified portions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The owner of the game receives the heart, head, feet, and insanda; on returning
    home he cooks them and invites male friends, while women must not share.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The special portions are said to have mystic significance, supplying the hunter
    with strength and skill; the insanda is described as sacred to men and eaten by
    men at a funeral to give strength.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: A hunter's claim to a wounded beast found dead is recognized if he has informed
    people that he wounded such an animal; otherwise ownership may pass to the finder.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: If hunters find an elephant carcass, it belongs to the head hunter; tusks
    are allocated among the head hunter, finder, and chief depending on the circumstances
    and land.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The head hunter is responsible for the safety of those he invites, and may
    owe damages if one is injured or killed in the hunt.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: A Mwila's personal property is subject to seizure by elder relations on both
    sides under the practice called nanga, which is not reckoned as robbery.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The younger relation, called mwana in relation to elders, is compared to a
    bag, pincers, and a soft skin that can be used, taken, or turned without resistance.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: An example is given of a young man's returned goods being taken by the chief,
    female relations, elder brothers, an aunt, and others, though he retained or exchanged
    some items.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Young men are said not to complain because the custom may later benefit them
    through younger kin, and because elders will help provide chiko, pay fines, or
    redeem them from slavery in times of need.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: A young person also has a right to nanga things from certain relations; grandfathers
    are said to hold their goods at the pleasure of their grandchildren.
  category: relationship
  evidence_refs:
  - ev:10
