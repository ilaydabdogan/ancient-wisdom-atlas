canonical_text:
  quote: ''
  summary: 'The passage moves from a brief note on carving a wooden human figure to
    an ethnographic description of iron smelting: regional sources of iron, the Bambala
    smelting industry near Shanaobi, the iron doctor and his guarded medicines, seasonal
    preparation of charcoal, quarrying and transport of ore, beer preparation, water
    and ant-hill clay gathering, camp arrangement, and the doctor pouring beer mixed
    with medicines into clay holes while men shout for the iron to die.'
