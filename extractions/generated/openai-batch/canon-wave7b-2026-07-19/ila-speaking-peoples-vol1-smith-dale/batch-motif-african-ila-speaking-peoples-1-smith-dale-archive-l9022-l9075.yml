canonical_text:
  quote: ''
  summary: A list of Ila disease names gives attributed causes and treatments, including
    ailments linked to meat distribution grievance, food taboo violation, dirt, kin
    transmission, spiders, and cures using named plants, water, fat, fire, salt, animal
    matter, and a cross-cousin’s fingernail action.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Insefu denotes swellings such as wens on the head and goitre; it is attributed
    to a silent grievance over the size of an eland-meat portion and is said to affect
    the grumbler’s child or relation rather than the grumbler.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated treatment for Insefu is to scrape Mufumu root, lance the swelling,
    and rub the scrapings into it; the authors add that they have seen uncured cases.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Chiloa, Chizengele, and Insokelela are rash or eye conditions treated with
    scraped or bruised plant matter combined with fat or water and applied by rubbing,
    bathing, or dipping.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Inkungwe is both the name of a fish and the name applied to certain ulcers
    on children’s buttocks, which are said to result from breaking a taboo by eating
    the fish’s flesh.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mambungu is treated by burning hare brains in a potsherd over fire, mixing
    the ashes with fat, and applying the mixture.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Bwele is treated by burning reed flowers and rubbing in their ashes mixed
    with fat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Bayubayu is described as sores all over the body caused by dirt and treated
    with Kaluya root scrapings mixed with fat.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Impuu sores are lanced and rubbed with salt; Intantamukoa is similar but all
    over the body and is said to go from relative to relative.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Shilubidila is circular erythema on different body parts and is said to be
    caused by a spider of the same name; its treatment uses Mudimbula root scrapings
    in water.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Tuzukuzhi, a split condition around the nails, is treated when the patient’s
    father’s sister’s child takes away one piece with his fingernail.
  category: action
  evidence_refs:
  - ev:10
