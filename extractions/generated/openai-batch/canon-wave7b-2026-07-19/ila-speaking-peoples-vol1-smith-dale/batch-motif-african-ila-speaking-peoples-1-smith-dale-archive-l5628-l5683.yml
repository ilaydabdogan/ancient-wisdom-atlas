canonical_text:
  quote: ''
  summary: 'The passage describes Ba-ila food consumption and preparation: eating
    among relatives and friends in times of plenty, use of earthenware pots rather
    than ovens or frying-pans, boiling, stewing, and roasting on embers, boiling whole
    grain when traveling or unable to prepare flour, preparing meal by stamping or
    grinding, making porridge by adding flour to boiling water over a fire, and boiling
    vegetables. The passage ends with an incomplete sentence on fish preparation.'
  language: English
  quote_policy: summarized
