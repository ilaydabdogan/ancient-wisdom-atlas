  summary: 'The passage gives an explanatory saying about mourning for oxen by comparing
    it with spilled honey, spilled fat, and eaten seed-corn. It then describes the
    importance of cattle to the Ba-ila and catalogs other domestic animals: dogs,
    goats, sheep, fowls, and pigeons, with notes on their care, value, and distribution
    among the Ba-ila and Bambala.'
