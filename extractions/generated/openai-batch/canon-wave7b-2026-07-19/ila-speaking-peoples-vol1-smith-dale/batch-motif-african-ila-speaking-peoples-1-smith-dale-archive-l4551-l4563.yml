canonical_text:
  quote: The clay is mixed with chopped grass and water
  summary: 'The passage describes construction work for the principal hut of Chief
    Sezongo at Nanzela: clay is obtained from an ant-heap or termite hillock, mixed
    with chopped grass and water, and applied as a first plaster coat in an operation
    called kumata; palm fronds are also cut short before completion.'
  language: English
