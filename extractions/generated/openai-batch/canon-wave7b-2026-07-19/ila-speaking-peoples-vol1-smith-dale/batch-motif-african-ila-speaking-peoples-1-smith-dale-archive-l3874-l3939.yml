canonical_text:
  quote: ''
  summary: The passage reports author observations about Ba-ila sensory abilities,
    spoor tracking, hearing, smell, touch, terrain movement, swimming, bathing, skin
    treatment with butter or castor oil, and tooth cleaning with fibrous sticks. It
    includes comparisons with Nanzela men, Bushmen, Bambala, Batwa of the Kafue, and
    Europeans.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The authors report that trained men, especially Nanzela men, can trace faint
    spoor of a wounded buck from small signs such as blood and crushed leaves, while
    unpractised people are said to be no better than Europeans.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes the Ba-ila sense of hearing as acute, noting their ability
    to catch a shouted message from a distance.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The authors describe the sense of smell as much less acute and explicitly
    caution that their sensory remarks lack precise psychometric data.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the Ba-ila sense of touch is less developed than that of
    refined Europeans and notes that they handle live coals with their fingers and
    place them in pipes without apparent inconvenience.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ba-ila of the plains are described as poor hill-climbers because their feet
    give out on stony ground.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Bambala are described as better on stony ground because of harder feet,
    but as soon overcome when they descend to plains and sandhills.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ba-ila who live near rivers are described as excellent swimmers, taught when
    young in shallow rainy-season pools.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Batwa of the Kafue are described as so at home in water that they are
    almost amphibious.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that Ba-ila persons and homes are not described as cleanly;
    men bathe opportunistically during travel, but at home people rarely bathe, especially
    far from rivers.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Butter or castor oil is rubbed into the skin as a substitute for water, for
    cleansing and softening, and the passage says skin cracks after washing unless
    an emollient is used.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Some people use fibrous sticks, of three varieties, for brushing the teeth,
    but the passage says this is not universal and not carried out as fully as desirable.
  category: object
  evidence_refs:
  - ev:6
