  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ba-ila are said to own about seventy thousand cattle, with herds increasing
    yearly; the largest owners may possess as many as six hundred.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Few cattle are sold, and cows are retained because they are valued by the
    Ba-ila and encouraged for retention by European advisers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A large number of oxen is killed at funeral feasts, estimated at about two
    thousand annually; as many as one hundred head may be killed at a big chief's
    funeral.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some large oxen in each herd are called masunto, or funeral oxen; their number
    varies with the owner’s status.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The masunto are kept until their master’s death, are intended to provide a
    feast for relations and mourners, and are not parted with once obtained.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The hides of funeral oxen form the grave bed.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Cows are seldom killed because their domestic value is considered too great.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: A familiar village sight is a person seated on the ground rocking a large
