canonical_text:
  quote: ''
  summary: The passage describes Ila property rights involving cattle herding, child
    guardianship, communal land and resource ownership, taboo boundaries, the chief
    as representative holder of land, settlement of strangers, land sale, trespass
    rules, offerings for hunting, fishing, and fruit-gathering, sacrifices to the
    mizhimo, and a form of spiritual ownership held by a family and its head.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person may gain property by looking after another person's cattle; the herder
    has use of the cattle and receives the milk but no wages.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the cattle owner's death, a herder may attempt to retain cattle by excuses
    or claims, and one court case involved disputed cattle and a promised wife described
    as lukono or the "rafter."
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A shimalelo who acts as guardian to a child is described as parent-like, receives
    no wages, and has different expected benefits or obligations depending on whether
    the child is a girl or a boy.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Communal property consists chiefly of land and also what is on the land and
    in rivers, including trees, fruit, game, and fish.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A chishi is divided into makute by natural boundaries such as a tree, an ant-heap,
    or a direction; these boundaries are said to be taboo and known to those concerned.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The chief apportions land publicly, after which a field-holder places stakes
    and clears a line around the field.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Moving a neighbour's boundary marks is described as a very serious crime and
    may lead to war when done by a neighbouring community.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Community land is invested in the chief as mwini-inshi, "master of the land,"
    but he may not alienate it without permission from his people.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The chief receives the land with taboos attached to sacred groves, trees,
    ant-hills, pools, streams, and matongo, and must hand them on intact to his successor.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A stranger wishing to live on the land is considered in a lubeta; if accepted,
    the chief points out where the stranger may build and cultivate and informs him
    of relevant taboos.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Land may sometimes be sold; the purchase price, called itongo, remains community
    property and may be held by the chief or a trustworthy elder.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: A stranger wishing to hunt, fish, or gather fruit must ask permission and,
    for hunting or fishing, give a portion of gains as an impaizho, an offering acknowledging
    the privilege.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Failure to seek permission for taking game, fish, or fruit brings confiscation;
    the passage says that formerly it meant death and that such trespass caused numerous
    wars.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Strangers who wish to fish or hunt also arrange sacrifices to the mizhimo
    to ensure success, which the passage links to spiritual ownership held by a particular
    family and represented by its head.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The passage compares an undesirable settler to the camel in a fable who first
    gets his head in and eventually displaces the rightful owners.
  category: speech
  evidence_refs:
  - ev:7
