canonical_text:
  quote: ''
  summary: The passage describes Ila rules and practices concerning death-related
    marital replacement, widow inheritance, distribution of slaves and cattle, reciprocal
    inheritance claims, chiefly funeral exchanges, and graded offences against property
    including theft and burglary.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a wife's death, the husband sends a present called chishonsho to his
    parents-in-law and states that he expects them to supply the vacant place left
    by their child's death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The parents-in-law first seek a sister of the deceased wife as replacement,
    and the passage says even a married sister with children may be separated from
    those ties and installed in the dead woman's place.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: If no heiress can be found, the chiko is returned; if an heiress is supplied,
    the husband pays a fresh but smaller chiko.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The replacement heiress may be a very young girl, and if she dies before maturity
    another heiress must be found.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage states that women may suffer under inheritance laws and may be
    forced into uncongenial unions.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The deceased man's widows are taken by his heir, or divided among the heir,
    nephew, son, and the deceased's mother's people, with the son not inheriting his
    own mother.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Slaves first pass with the hut or mistress to which they are attached and
    are then distributed by the heir in a manner compared to cattle distribution.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A doctor who has supplied medicine to the deceased may claim a cow and calf,
    and if unpaid may seize a child or nephew as a slave until redeemed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the death of a big chief, a woman slave may accompany cattle sent by another
    chief as a sign of added respect, and a different slave is sent in return.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the chief who sent the slave dies, the exchanged individuals are returned
    to their former homes with a fresh slave, regardless of ties or children formed,
    and such arrangements can continue for generations.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The inheritance principle called lubono talumana states that goods have no
    end, allowing later reciprocal claims on inherited goods when another estate is
    opened.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage distinguishes theft from some other appropriations and says a
    clansman's goods may be taken without its being treated as theft under the stated
    rule.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The seriousness of property offences depends on the property, the offender,
    the victim, and the time; cattle and grain theft are severe, and night entry by
    removing a door is treated as a great crime.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: If a night trespasser steals or assaults a woman, the crime is greater; assaulting
    a sleeping woman is worse, and assaulting a sleeping nursing mother is described
    as the summit of wickedness.
  category: sequence
  evidence_refs:
  - ev:7
