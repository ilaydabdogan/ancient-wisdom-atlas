canonical_text:
  quote: ''
  summary: 'The passage describes Ila-region practices and remembered cases involving
    slavery as property: purchase of children and adults with goods, deception of
    children during sale, attempts by enslaved adults to shift masters, people transferred
    as payment or fines, kin redemption through ransom, self-enslavement to satisfy
    fines or destitution, and a case of unintended enslavement under a chief.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person seeking to buy enslaved people equipped himself with merchandise
    such as hoes and negotiated for a boy, girl, or adult; prices are described in
    hoes, salt, beads, and other goods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During bargaining, an unsuspecting boy or girl could be called under the pretext
    of bringing visitors water or embers, examined for health and fitness, deceived
    about returning soon, and taken away without farewell to parents.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: An adult enslaved person purchased in this way might throw ash on a chief
    or another person while the travelling party rested, hoping to find a kinder master;
    the former master then had either to redeem the person or lose both person and
    purchase money.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Shialozhi was paid a man after bringing a case about being called by a dead
    man's name; he later offered that man as payment for grain, but when the man refused
    to go, Shialozhi paid Munampelo a girl, his daughter.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Shimunza bought Kabocha for salt, later paid her to a neighbouring chief as
    a fine for a young man's adultery, and then seized the young man's sister as compensation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mwanambo was caught and sold to Shapela; fifteen years later her brother came
    to redeem her, and Shapela demanded five cows as ransom.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mwezwa bought Kacha for cattle; she ran away twice, died after being away
    for a year, and subsequent claims were made concerning her death and burial.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A person unable to pay fines could offer himself to a wealthy man, who paid
    the fine; the person then became the wealthy man's slave until he or his kinsmen
    paid the demanded ransom.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: In cases of self-enslavement for fines, a proverb about a tiny calf later
    giving birth to ten is cited as meaning that heavy usury may be claimed for assistance
    given.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: A man who voluntarily moved to another chief's village, disowned his relations,
    and incurred repeated fines could have those fines paid by the chief and then
    be declared the chief's slave.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Nanshiku was captured while fishing, redeemed by the relation Mompizho who
    then claimed her, released by her brother's payment, later left without close
    relations and self-enslaved, and was eventually released by another relation's
    payment.
  category: sequence
  evidence_refs:
  - ev:9
