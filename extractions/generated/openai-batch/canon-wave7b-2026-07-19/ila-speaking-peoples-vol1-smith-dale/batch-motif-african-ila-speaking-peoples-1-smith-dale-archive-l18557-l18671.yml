candidate_motifs:
- id: motif:1
  label: Deceptive summons into slavery
  taxonomy_refs: []
  basis: The passage says an unsuspecting child is called to bring water or embers,
    examined, deceived with the claim that the child will return soon, and taken away
    into slavery.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is presented as ethnographic/legal description, not as a mythic tale.
- id: motif:2
  label: Ash gesture seeking change of master
  taxonomy_refs: []
  basis: A purchased adult may throw ash on a chief or other person in the hope of
    finding a kinder master, requiring redemption by the prior master if he wants
    to keep the enslaved person.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage states the action and desired outcome but does not explain
    broader symbolic meanings of ash.
- id: motif:3
  label: Human person transferred as compensation, payment, or fine
  taxonomy_refs: []
  basis: The passage gives cases in which a man, Shialozhi's daughter, Kabocha, and
    a young man's sister are treated as payment, fine, or compensation.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The motif is a social-legal pattern within the passage rather than a supernatural
    or mythological motif.
- id: motif:4
  label: Kin redemption of enslaved relative
  taxonomy_refs: []
  basis: Mwanambo's brother attempts redemption after fifteen years, and Nanshiku
    is released by payments from her brother and later another relation.
  evidence_refs:
  - ev:5
  - ev:9
  confidence: high
  cautions: Mompizho's case complicates the pattern because he redeems Nanshiku but
    then claims her as his own.
- id: motif:5
  label: Self-enslavement to discharge fines or survive destitution
  taxonomy_refs: []
  basis: The passage describes a person offering himself to a wealthy man to have
    fines paid and describes Nanshiku later enslaving herself because she was alone
    and without known relations.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: high
  cautions: This is described as customary practice and personal circumstance, not
    as an initiation or sacred exchange.
- id: motif:6
  label: Usury expressed through multiplying calf proverb
  taxonomy_refs: []
  basis: The proverb that a tiny calf will one day give birth to ten is explicitly
    glossed as meaning that heavy usury may be claimed for assistance given.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage provides the proverb's local explanation but no wider comparative
    context.
- id: motif:7
  label: Voluntary settlement becoming bondage through accumulated liability
  taxonomy_refs: []
  basis: A man moves to another chief's village, disowns his own relations, incurs
    fines, and becomes the chief's slave after the chief pays the liabilities.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This is a narrated customary scenario, not a mythic plot.
