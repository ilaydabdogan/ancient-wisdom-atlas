canonical_text:
  quote: '"the mouthpieces of the gods — the prophets"'
  summary: 'The passage describes prophets as influential law-givers whose authority
    is attributed to gods, gives an example in which a prophet forbids the use of
    Kamwaya bush to scatter clouds and a man who disobeys is killed by lightning,
    and then explains Ila categories of customary offences: Chisapi, Buditazhi, and
    Tonda/taboo, including automatic danger and retribution attached to taboo-breaking.'
  language: English
  quote_policy: quoted
