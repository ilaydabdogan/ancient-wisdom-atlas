canonical_text:
  quote: ''
  summary: The passage describes clothing and adornment among the Ila-speaking peoples,
    distinguishing ordinary clothing from ornament, medicine, regalia, war-toggery,
    and signs of bravery. It details a woman's festive dress, including the mukaku
    belt, beadwork, bells or shells, bracelets, necklaces, a medicine horn against
    witches, shell ornament, head ornaments, flowers, and an ornamental hoe. It also
    notes child ornaments, women’s post-childbirth and chest straps, men’s ornaments,
    chiefs’ ivory bangles, and a photo caption about swimming a river.
  language: English
  quote_policy: summarized
