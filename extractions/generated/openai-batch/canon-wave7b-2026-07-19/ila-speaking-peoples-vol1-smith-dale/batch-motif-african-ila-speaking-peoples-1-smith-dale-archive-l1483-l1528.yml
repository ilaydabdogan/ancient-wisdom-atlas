canonical_text:
  quote: ''
  summary: The passage reports granite grooves found in the Batoka hills, then gives
    a historical-linguistic account of the Ila-speaking peoples, their Bantu affiliations,
    hypothesized migrations and intermixture, shared cult vocabulary with nearby dialects,
    western lexical influences, and the lack of tradition about their arrival or any
    dispossessed peoples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mr. G. F. B. Handley found and photographed a series of grooves in solid granite
    rock in the Batoka hills.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the makers and purpose of the granite grooves are
    unknown; suggested possible uses include grinding neoliths or pulverising gold-bearing
    quartz.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Ila-speaking peoples and their neighbours are identified as belonging
    to the Bantu subdivision, with remote ancestors said to have come down from the
    southern Soudan.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The area is described as near the median line of the continent and at a junction
    of tribes apparently connected with separate immigration lines, according to linguistic
    evidence.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Ba-ila are described as mainly Eastern Bantu who entered their present
    domain from the north-east, from the region around the southern end of Lake Tanganyika.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ba-ila are also described as having been influenced by and partly intermixed
    with another section of peoples whose route is said to have passed through Congo
    territory toward the west coast and then back south-eastward toward the continent’s
    centre.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The closest affinities to Ila are said to lie in a dialect line from the Subia
    on the Zambesi to the Bemba on Lake Tanganyika, including Tonga, Lenje, Bisa,
    and others.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage identifies shared cult words including Leza, glossed as “the Supreme
    Being,” and chisungu, glossed as “the puberty rites”; it also identifies Ila words
    tonda, glossed as “taboo,” and ifuka, glossed as “nine,” as having western connections.
  category: other
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The passage states that Ila traditions provide no answer about when or under
    what conditions the people reached their present home, or what tribes, if any,
    they dispossessed.
  category: other
  evidence_refs:
  - ev:7
