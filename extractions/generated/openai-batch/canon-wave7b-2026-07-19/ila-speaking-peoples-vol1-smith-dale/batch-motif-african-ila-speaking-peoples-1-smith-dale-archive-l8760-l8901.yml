canonical_text:
  quote: ''
  summary: The passage catalogues Ila disease names and treatments. It describes remedies
    using smoke, plant roots, bark, leaves, ash, water, porridge, incisions, and ritual
    actions. Several ailments are linked to witchcraft, false swearing, theft or boundary
    violation, bodily-contact contagion, or taboo-breaking; one chest disease is treated
    by transferring it through a cord into the earth, and one childhood mouth disease
    is treated by a children’s circuit around the village with singing and shared
    food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mununka or Kunokola, glossed as bleeding at the nose, is said to be caused
    by exposure to the sun and treated by inhaling fumes from burning tree bark.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mozo, palpitation of the heart, is treated with a hard ant-formed lump called
    the heart of the earth, ground into water and drunk.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kalobo is described as a severe chest pain involving something clutching and
    pulling the heart, and is said to be due to witchcraft.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Kalobo treatment includes incisions over the heart, root scrapings rubbed
    into them, a cupping horn tied by string to a stick in the ground, and the disease
    passing along the cord into the earth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Miya is said to be caused by false swearing, but in the example the accuser
    suffers rather than the false swearer.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Miya treatment consists of smoking the patient in fumes from the burning root
    of the Mupazupazu tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Chimbalambala, sores in the mouth of a sucking child, is treated by putting
    the child on a youngster’s back while children go around the village singing and
    eating a cooked mixture of grains, beans, and nuts.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Chifundo, a swelling in the cheek, is said to be caused by jumping over a
    chifundululo field mark and stealing.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Ishinga or Chishinga is said to be infectious if a person urinates where a
    sufferer has urinated.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Sufferers from chishinga and mashingabotu are not allowed to drink strong
    funku beer; the passage calls this a taboo.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Mafuta is said to result when a boy breaks a taboo by eating fat, causing
    a fatty flux from the penis.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Across the entries, many remedies use roots, bark, leaves, ash, water, porridge,
    or decoctions that are drunk, rubbed on the body, smoked, or used as washes.
  category: sequence
  evidence_refs:
  - ev:10
