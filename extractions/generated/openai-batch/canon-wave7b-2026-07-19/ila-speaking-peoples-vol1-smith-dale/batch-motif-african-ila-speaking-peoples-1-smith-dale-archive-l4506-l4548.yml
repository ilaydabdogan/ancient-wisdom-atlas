canonical_text:
  quote: ''
  summary: The passage describes differences between Ba-ila and Balumbu/Nanzela methods
    of hut-roof construction, including use or omission of a central support pole
    and wooden disc, the binding of rafters, formation of eaves or verandahs, and
    the later role of women in accumulating clay inside the hut after men finish the
    wall and roof.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The true Ba-ila roof method uses a long straight central pole, called musemu,
    to support the hut roof.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The upper end of the Ba-ila central pole is cut into a tenon that passes through
    a wooden disc about eighteen inches to two feet in diameter.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Principal rafters are adzed, drilled, set with their thick ends on the disc
    and their other ends on the wallplate, then bound to the disc and wallplate.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Additional poles are inserted to fill gaps around the roof circle, and the
    overhanging rafter ends are cut even.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Short eaves can be supported by forked poles to form a narrow verandah; a
    more elaborate hut can have a secondary rafter system forming a wider portico
    around the hut.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Nanzela the musemu and wooden disc are generally not used except when imitating
    Ba-ila construction in large huts.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Nanzela method ties three or four principal rafters together on the ground,
    hoists them to the wallplate, spreads them apart, and binds them to the wall.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Basket-work of withes is woven around the roof apex, and secondary rafters
    and smaller subsidiary poles are added until the spaces are filled.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: For small houses and grain bins, the roof is completed on the ground and then
    hoisted into position.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the wall and roof are finished, men may rest while women accumulate
    a pile of clay inside the hut.
  category: sequence
  evidence_refs:
  - ev:7
