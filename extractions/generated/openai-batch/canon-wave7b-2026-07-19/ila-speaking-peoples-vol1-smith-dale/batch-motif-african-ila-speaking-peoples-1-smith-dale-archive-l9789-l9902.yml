canonical_text:
  quote: ''
  summary: The passage describes Ila musamo medicines, charms, and talismans used
    for healing, prolonging life, preserving charm efficacy through taboos, redirecting
    or harming enemies, countering witchcraft, protecting footprints, and drawing
    followers to chiefs. It includes a healing rite using a Butaba branch, an ancient
    life medicine associated with Leza, charms modeled on animal or plant traits,
    and attraction medicines used by chiefs and hunters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A doctor had a branch from a Butaba tree cut, carried without touching the
    ground, planted at Sezongo II's hut, and used with incantations; the passage says
    vitality from the tree passed into Sezongo and he recovered.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Butaba is described as a tree full of vitality, with sticks that readily
    take root and grow, and the planted tree was still pointed out.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wabumi is described as an ancient life medicine said to have been given by
    Leza to men in the beginning to enable propagation.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The owner’s people must observe taboos involving stones, spoons, pots, and
    food offerings; transgressions are said to rob the charm of virtue or endanger
    the owner’s life.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A court example states that Katumpa beat his wife because she had struck a
    stone, a taboo connected with the wabumi charm.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Several charms are said to prolong life, including mongo, inzhinge, and chiwena,
    the last connected with crocodiles swallowing pebbles.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some charms are described as causing enemies to relent, feel pity, remember
    their own sinfulness, or, conversely, preserve or remove resentment.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Other charms are said to harm or obstruct attackers, witches, litigants, and
    enemies by turning them back, making their magic kill them, causing itching, wasting,
    slowness, or a bodily disturbance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Mukombokombo is described as a mysterious plant whose leaves do not shake
