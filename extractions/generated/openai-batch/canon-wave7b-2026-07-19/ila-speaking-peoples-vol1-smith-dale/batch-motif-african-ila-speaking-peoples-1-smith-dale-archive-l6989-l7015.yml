  quote: ''
  summary: 'The passage describes plant materials used by the Ba-ila for net-related
    and other handicraft work: bark layers are cut and tied into strips; baobab inner
    bark is made into string; palms supply fibre, midribs, and strips used for basketry
    and cord-making.'
