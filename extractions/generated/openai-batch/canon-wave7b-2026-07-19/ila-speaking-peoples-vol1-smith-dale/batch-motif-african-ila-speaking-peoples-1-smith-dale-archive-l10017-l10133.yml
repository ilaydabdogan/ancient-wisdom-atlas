canonical_text:
  quote: ''
  summary: The passage catalogues Ila charms used for success in hunting, warfare,
    law, rebellion, ghost control, post-mortem transformation, harm to survivors,
    burial preferences, revival after burial, and funeral mourning. It then describes
    the diviner as a revealer and diagnostician, including the serpent-headed Shimubi
    divining rod and the initiation of a novice diviner through fees, incision, medicine,
    incense or smouldering herb, incantation, and instruction.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A charm named mulala is described as enabling a warrior or hunter to hit every
    time he throws his spear.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A charm named chipapa-cha-munkudi is said to help a person inclined to rebel
    against superiors become successful.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The charm wanzhimina protects a person in court by making accusers forget
    the charge, while mudimbula stimulates the user's wits and makes opponents stupid.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mudimbula is also said to stupefy the ghost of a killed man so that it cannot
    harm the killer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage explicitly states that misamo act on both the living and the dead.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Charms called wakudisangula and wakudifundula are described as enabling a
    person to change state after death or to turn into a lion or another beast.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A witchcraft musamo may be eaten to transform a person after death into a
    mutalu, described as a vengeful destructive ghost whose victims fall suddenly
    dead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The mudimbula medicine is presented as the remedy for doctoring a destructive
    ghost in its ghostly state.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A dead person may have procured charms, such as shombololo, to make survivors
    unhappy through fighting, suicide, rebellion, or crime.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Charms named kashise and kamivaya are said to cause family disappearance,
    property disappearance, the death of whoever takes the dead person's name, and
    family extinction.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A charm named after the tortoise is said to cause sudden death and puzzling
    disappearance, with an analogy to a tortoise withdrawing its head and seeming
    like stone.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Other charms ensure special treatment of the corpse, including placement on
    a high platform, burial sitting up, lifelike appearance after death, or rising
    from the grave for a second spell of life.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: A charm named after the tree mutesu is said to cause a large weeping crowd
    to gather at a person's funeral.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The diviner is described as one who reveals hidden things, finds lost things,
    identifies thieves, traces cattle, identifies a newborn child, diagnoses disease,
    and determines causes of death.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:15
  text: The Shimubi divining rod is described as a bow-shaped piece of wood carved
    at one end into the head of a Shimakoma snake with bead eyes and a mouth.
  category: object
  evidence_refs:
  - ev:12
- id: obs:16
  text: The diviner's profession is transmitted from older men to younger men through
    fees, a hand incision, medicine rubbed into the cut, handling the divining rod,
    smouldering herb, incantation, and instruction in drugs.
  category: sequence
  evidence_refs:
  - ev:13
