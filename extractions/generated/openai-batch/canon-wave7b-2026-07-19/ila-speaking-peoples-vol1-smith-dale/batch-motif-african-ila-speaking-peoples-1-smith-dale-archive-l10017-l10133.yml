candidate_motifs:
- id: motif:1
  label: Charm-mediated post-mortem transformation
  taxonomy_refs:
  - shapeshifter
  basis: The passage describes charms by which a person changes state after death
    into a lion, eagle, itoshi, ant-hill, other beast, or mutalu ghost.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage is an ethnographic catalogue of charms rather than a narrative
    myth episode.
- id: motif:2
  label: Shedding skin to become a beast
  taxonomy_refs:
  - shapeshifter
  basis: The charm wakudifundula is glossed as for shedding one's skin and is said
    to enable a man to turn into a lion or other beast.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: Only a brief functional description is given; no detailed transformation
    scene is narrated.
- id: motif:3
  label: Destructive ghost produced by witchcraft medicine
  taxonomy_refs: []
  basis: Eating witchcraft musamo can make a person become a mutalu after death, a
    ghost whose victims fall suddenly dead; a medicine is used to doctor the ghost.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No listed taxonomy reference directly matches the destructive-ghost pattern.
- id: motif:4
  label: Dead person's charm harms survivors
  taxonomy_refs: []
  basis: The passage describes dead men procuring charms that cause survivors' fighting,
    suicide, rebellion, criminality, family disappearance, and extinction.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: This is presented as a charm belief rather than as a complete mythic plot.
- id: motif:5
  label: Charm-mediated rising from the grave and second life
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: A medicine is said to enable a dead and buried man to rise from the grave,
    go to the doctor's village, and enjoy a second spell of life.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage gives a general belief about a medicine, not an individualized
    resurrection story.
- id: motif:6
  label: Divinatory revelation of hidden causes
  taxonomy_refs:
  - wisdom
  basis: The diviner reveals hidden things, diagnoses disease and its cause, identifies
    medicine and doctor, and determines whether death came from witchcraft or Leza's
    will.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The available taxonomy ref 'wisdom' is broad; the passage specifically
    concerns divination and diagnosis.
- id: motif:7
  label: Initiation of diviner through incision, medicine, rod, and incantation
  taxonomy_refs:
  - initiation
  basis: The profession passes from an older man to a younger man through payment,
    hand incision, rubbed-in medicine, receiving the rod, smouldering herb, incantation,
    and instruction.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage describes professional initiation rather than a mythic hero
    initiation.
- id: motif:8
  label: Serpent-headed divining implement
  taxonomy_refs:
  - serpent
  basis: The Shimubi divining rod is carved with the head of a Shimakoma snake and
    is used by some diviners.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The serpent form is attached to a ritual instrument; the passage does
