canonical_text:
  quote: ''
  summary: The passage lists Ila praise names and titles used politely for chiefs,
    warriors, hunters, and others, then describes rules forbidding the direct utterance
    of one’s own name, certain relatives’ names, the names of absent people, the lion,
    and the words for fire and water in specified contexts. It explains these avoidances
    as intended to prevent misfortune, danger, or offense, and notes substitute names
    and address terms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents Ba-ila names as illustrating qualities and deeds esteemed
    in chiefs and fellows.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Examples of hunter or warrior titles include names glossed as a spiller of
    blood, an intoxicator of men, one who faces the foe in the open, and a dangerous
    snake in a bundle of wood.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hailing someone by these praise names is described as an act of great politeness,
    while other names require caution.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person is not allowed to speak his own name, especially in the presence
    of older people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Pronouncing one’s own name in the presence of elders is described as a serious
    fault that could lead to sale, enslavement, expulsion, or redemption by clansmen.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: If asked his name, a person may turn to another person to answer, or may use
    an impromptu or externally given name in dealings with Europeans.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A man may not pronounce the names of his wife before or until she has borne
    children, his parents, parents-in-law, certain affinal kin, his wife’s siblings,
    or his uncle; women observe similar rules.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage gives substitute address terms for some avoided kin names, including
    terms for an uncle, an uncle’s wife, a brother’s wife, and a husband.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The stated reason for these taboos is that pronouncing a name may bring misfortune
    upon the named person or upon the speaker.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: When traveling through the veld, one should not speak of a lion by name, but
    should use substitute expressions, to avoid bringing the lion upon oneself.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: People remaining in the village should not speak by name of absent people
    away on business; they use role descriptions for absent hunters, warriors, fishermen,
    and merchants.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: During iron smelting, people must not speak of Fire by its name but must call
    it by a substitute term meaning the fierce one.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: When women are threshing grain, they may neither drink water nor speak of
    it by name, and if necessary refer to it as that which falls from the sky.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage adds that people must avoid naming things whose names closely
    resemble the prohibited personal names.
  category: speech
  evidence_refs:
  - ev:10
