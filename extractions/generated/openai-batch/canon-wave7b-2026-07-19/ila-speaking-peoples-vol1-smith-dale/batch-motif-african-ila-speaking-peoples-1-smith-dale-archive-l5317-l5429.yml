canonical_text:
  quote: ''
  summary: The passage describes Ba-ila grain bins and agricultural practices, including
    decorated granaries, statements about Leza as source of cultivated gifts, a first-rain
    work taboo, lucky-handed sowers and transfer of crop disease, first-fruits offerings
    to ancestral spirits, crops grown, and a calendar beginning with the Pleiades.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes temporary and permanent grain bins, including masumpila
    in fields and matala as permanent granaries, with cylindrical frameworks raised
    on forked supports.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men cut poles and build the grain-bin framework, while women cut grass for
    thatching and later mould decorative forms on the bin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women mould pairs of mammae with an impande between them on the grain bin
    and encircle the bin with a moulded serpent figure.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Some maize is strung on ropes of bark or hide in large bundles, and ground-nuts
    are stored on high platforms in the village.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage says the people have no knowledge or traditions about the origin
    of grains beyond saying that Leza caused these gifts to descend.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: On the day after the first rain the people do no work; the custom is called
    kutonda Leza, glossed as tabooing the Rain-giver.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Field-work on the day after the first rain is described as an offence against
    the Rain-giver that would harm the success of sowing.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Certain persons are believed to have chesha, a lucky hand for sowing, and
    their services are requested.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: If pumpkins sown by a lucky-handed person fail and rot, a specked fruit is
    placed where a path divides, so that the first person stepping over it carries
    the disease to his own garden.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Before eating the new harvest, each man makes an offering of fresh cobs to
    his ancestral spirit by placing them above the door and in the rafters.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says the Ba-ila do not have a first-fruits feast like that of
    the Zulus and other southern tribes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: It is considered bad form to celebrate the harvest in this way while one's
    wife is absent, and a person does not accept new grain from another before celebrating
    and tasting his own first-fruits.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Ba-ila reckon the year to begin with the rising of the Pleiades, and agricultural
    work is governed by the rains.
  category: setting
  evidence_refs:
  - ev:6
