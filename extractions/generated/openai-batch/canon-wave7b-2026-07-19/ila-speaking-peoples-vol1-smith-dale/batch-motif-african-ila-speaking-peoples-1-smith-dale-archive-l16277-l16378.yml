canonical_text:
  quote: ''
  summary: The passage describes Ba-ila communal regulation through custom, moral
    vocabulary, social teaching, and sanctions classed as traditional, religious,
    and magical. It gives examples of customs sanctioned by ancestral precedent, by
    Leza, by prohibitory boundaries called Chifundo/Shifundo shaka Leza, by the keeping
    of a leopard skin as a sacred family heirloom, and by the wishes of departed ancestors.
  language: English
  quote_policy: summarized
