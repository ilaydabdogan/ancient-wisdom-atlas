canonical_text:
  quote: ''
  summary: The passage gives a month-by-month agricultural and subsistence calendar,
    then describes Ba-ila practices concerning food, cooking, hearth fires, fire-making
    by friction, fire taboos, fuel, veld-fire precautions, and food security from
    wild resources.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage orders field work, planting, rains, harvesting, cattle movement,
    fishing, hunting, and house-building by months from October through August.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In March women begin harvesting maize, men begin building grain bins, new
    fields are prepared for the next year, and girls' initiation begins at Nanzela.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ba-ila can make fire by friction, but village fires are normally already
    burning, so friction is needed mainly away from habitations.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After a funeral, ashes from mourners' fires are collected and thrown away,
    outside fires are put out, but hearth-fires remain in the huts.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Each hut has a fireplace, and a hut without fire is considered very bad for
    both living people and the family ghosts who live in the hut; the coldness and
    darkness of a fireless house is called kanekezhi.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Fire-related taboos include not carrying a firestick from one hearth to another
    house, restrictions on menstruating women tending fire or carrying water or food,
    and restrictions on taking fire or water from a protected house after sunset.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: For friction fire-making, the lower stick is called chikazhi, described as
    female, and the upper twirling stick is called lupika, described as male; tinder
    receives the spark and several men may take turns twirling.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ordinary village fire is conveyed by carrying live coals on a potsherd, and
    one member of a short journeying party carries fire in this way.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Wood is the usual fuel, but in treeless Butwa reeds and grass are burned;
    when the veld burns, grass is cleared around villages, though houses and villages
    may still burn through carelessness.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Cooking may be done inside the living-hut or outside, with cooking-pots supported
    by stones, moulded clay lumps, or small ant heaps.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Drought famines occur, but the passage states that destitution is not absolute
    because wild animals and wild fruits can be used as food.
  category: other
  evidence_refs:
  - ev:8
