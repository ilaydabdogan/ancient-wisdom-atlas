canonical_text:
  quote: ''
  summary: The passage introduces Mukubu, an old chief in Busala and historical informant.
    It recounts that Sebitwane took him from Longo as a lad and that he was raised
    in Barotsiland. Mukubu is described as witnessing events involving Livingstone,
    Oswell, Sebitwane, and Sekeletu; serving and traveling with Livingstone; taking
    part in fighting; guiding mission pioneers; being sent by Lewanika as a representative
    to Busala; and enumerating thirty-six men he had killed in battle. The passage
    ends by beginning an account of Sebitwane meeting a Matabele impi at Kapoli.
  language: English
  quote_policy: summarized
