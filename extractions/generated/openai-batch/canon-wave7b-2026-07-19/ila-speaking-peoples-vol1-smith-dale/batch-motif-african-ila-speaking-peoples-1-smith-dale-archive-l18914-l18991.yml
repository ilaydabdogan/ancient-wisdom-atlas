canonical_text:
  quote: ''
  summary: The passage describes property and debt practices involving inheritance,
    ghost anger, seizure of kin or goods as compensation, pressure to settle debts
    before death, and the condition of enslaved people, especially elderly female
    slaves and their lack of recognized autonomy or family rights.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Manga inherited the name of Makoso.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Shitwe's child became sick and died, Shitwe said the death signified
    that ghosts were angry about Manga's inheritance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Shitwe claimed compensation for the child's death and seized Manga's niece
    Lubota and a shell when Manga had nothing to pay.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Manga went to Lufuka to borrow goods to redeem his niece, leaving his wife
    and son Shilo at the village.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After another child of Shitwe died, Shitwe seized Shilo and gave him to a
    woman, instructing her to pray to Makoso's ghost to stop troubling his children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In a described debt-collection case, a creditor may enlist a forceful friend
    with the promise of a substantial share of the recovered debt.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: If the promised reward is not paid, the helper may either take the recovered
    slave or later claim part of the friend's inheritance after the friend's death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A harsher claimant may choose a son or daughter of the deceased and insist
    on receiving that person.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The authors state that such cases induce men who want their children to prosper
    to settle their debts before death.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: Old female slaves are described going to field work on cold, wet mornings
    with a hoe in one hand and a sherd containing live coals in the other.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The elderly female slaves are described as poorly clothed, cold, frightened,
    and treated as property by their masters.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: One old woman was found outside the authors' gate after being turned out of
    a village because she no longer had strength to work.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage states that many slaves may live fairly happy lives, but they
    remain slaves and cannot call their souls and bodies their own.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that enslaved women who bear children mostly have no right
    to them.
  category: relationship
  evidence_refs:
  - ev:8
