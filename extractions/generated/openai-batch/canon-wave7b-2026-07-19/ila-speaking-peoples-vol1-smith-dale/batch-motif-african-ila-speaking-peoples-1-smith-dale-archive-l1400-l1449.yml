canonical_text:
  quote: ''
  summary: 'The passage describes a Kasenga river scene with abundant food supply
    and a fish-eagle, then gives an ethnographic account of the Ba-ila: population
    size, resources, reproductive claims made by the authors, physical characteristics
    attributed to swampy conditions, long cone coiffure explained as a visibility
    aid, and in-group/out-group identity terms.'
  language: English
  quote_policy: summarized
literal_observations:
