  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The authors remark that the Ba-ila population seems small despite these resources.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: The authors attribute low reproduction to what they describe as early and
    frequently changing sexual relationships, and report census observations of kraals
    inhabited only by adults and lacking children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ba-ila are described as distinct from neighboring peoples, with some characteristics
    traced by the authors to their land and circumstances.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The authors connect Ba-ila physique, height, and lower-limb development with
