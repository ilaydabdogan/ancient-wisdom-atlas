  text: The river setting is described as holding abundant food, with a fish-eagle
    sailing overhead and screaming harshly.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The inhabitants of the described country are said to number about sixty thousand,
    with females predominating in a ratio of three to two.
  category: attribute
  evidence_refs:
  - ev:2
