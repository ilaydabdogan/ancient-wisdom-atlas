    an apparently wounded man is dragged to the rear. If his friends cannot help him,
    another man mimics hacking off his head with a blunt battle-axe as a trophy while
    keeping watch for rescue attempts. The injured man's writhing is described as
    life-like; the final sentence is truncated in the supplied passage.
