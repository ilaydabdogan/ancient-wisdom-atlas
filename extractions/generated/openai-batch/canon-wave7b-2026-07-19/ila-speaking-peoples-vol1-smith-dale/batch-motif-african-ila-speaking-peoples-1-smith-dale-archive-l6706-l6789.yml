canonical_text:
  quote: ''
  summary: 'The passage describes warfare practices among the Ila/Mwila and, in comparison,
    the Balumbu: combat and weapon tactics, beheading and trophy-taking, treatment
    of testicles of slain foes, protective and cleansing medicines, thanksgiving sacrifices
    after victory, feasting and exclusion of cowards, Balumbu trophy dances, distribution
    and storage of heads, skull-cup use, and rites to prevent the ghost of a slain
    person from troubling the killer.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the described fighting, charge and counter-charge followed quickly, no
    quarter was given, enemies were beheaded, and skulls were taken home as kraal
    trophies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The testicles of slain foes were cut off; in the first account they were added
    to relish and eaten, with different stated effects for cowards and brave warriors.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Intertribal fights could last a long time while each side gathered thrown
    spears, and spear shafts might be half-sawn so they would break and hasten decisive
    combat.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the Mwila were at a disadvantage against Matabele and Barotsi
    opponents when their casting-spears were exhausted, because opponents used shields,
    short stabbing spears, or kerries.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Chiefs placed medicine around districts and on old trees so that attacking
    enemies would be discomfited, their knees would weaken, and defenders could overtake
    and kill them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After a successful fight, rejoicing occurred at the kraal; warriors bathed
    their faces in medicine, and fathers sacrificed individually to ancestral spirits.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The first sacrifice was made to the district demi-god, with heads of slain
    enemies placed before him and a thanksgiving prayer spoken.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The chief slaughtered oxen for a warriors' feast, while two young men who
    avoided battle by hiding their spears in mud were refused a share of the feast.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: 'Among the Balumbu, similar customs are reported: testicles of a slain foe
    were cut off and thrown away because they were described as bumi, or life; warriors
    returned to the chief''s village with enemy heads.'
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: In the Balumbu account, drums beat the next morning, the chief distributed
    honours, and each named warrior danced with the head or heads he had brought and
    then placed the trophy before the chief.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Balumbu chief retained some heads, distributed others with induba feathers
    to the bravest warriors, stored retained heads in the manes' hut, and heads could
    later be used in ceremonies or made into calvaria goblets.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:12
  text: Balumbu warriors who had killed were cleansed by medicine on the tongue or
    by fumigation; ashes from the medicines were placed in a koodoo horn at the hut
    threshold to drive off the ghost of the person killed.
  category: action
  evidence_refs:
  - ev:12
