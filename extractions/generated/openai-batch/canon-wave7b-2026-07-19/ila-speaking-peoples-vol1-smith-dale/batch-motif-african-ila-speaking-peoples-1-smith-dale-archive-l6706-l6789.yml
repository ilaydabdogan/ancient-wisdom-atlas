candidate_motifs:
- id: motif:1
  label: Enemy head trophy after battle
  taxonomy_refs: []
  basis: The passage repeatedly describes beheading enemies, carrying heads or skulls
    home, displaying or dancing with them, placing them before ritual or political
    authorities, and storing them for later use.
  evidence_refs:
  - ev:1
  - ev:6
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: This is an ethnographic warfare practice in the passage; no mythic narrative
    meaning beyond the stated actions is inferred.
- id: motif:2
  label: Slain foe's testicles as life, courage, or utter killing
  taxonomy_refs: []
  basis: The passage reports cutting off testicles; in one account they are eaten
    in relish with an effect on coward or brave warrior, while in the Balumbu account
    they are thrown away because they are called life and their removal means killing
    utterly.
  evidence_refs:
  - ev:1
  - ev:8
  confidence: high
  cautions: The two accounts differ in what is done with the testicles, so the motif
    is limited to the shared cutting-off and stated potency/life association.
- id: motif:3
  label: Protective war medicine placed in landscape
  taxonomy_refs: []
  basis: Chiefs are said to place medicine around a district and on old trees so enemies
    will be weakened and killed.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage gives a brief functional description without naming specific
    medicines or ritual procedure.
- id: motif:4
  label: Victory thanksgiving sacrifice to ancestral or district powers
  taxonomy_refs:
  - sacrifice
  basis: After successful fighting, fathers sacrifice to ancestral spirits; the first
    sacrifice is made to the district demi-god, with enemy heads placed before him
    and a prayer of thanksgiving for survival and victory.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: Only the sacrifice motif family is directly supported; broader claims
    about divine judgment or covenant are not supported by this passage.
- id: motif:5
  label: Feast as honour and exclusion after battle
  taxonomy_refs: []
  basis: The chief slaughters oxen to feast warriors, while two young men who avoided
    battle are publicly denied a share.
  evidence_refs:
