  confidence: medium
  cautions: The passage presents a social sanction and reward but does not explicitly
    frame it as a mythic or sacred exchange.
- id: motif:6
  label: Trophy dance before the chief
  taxonomy_refs: []
  basis: In the Balumbu account, warriors whose names are called dance with enemy
    heads, then kneel and place the trophies before the chief, who distributes honours.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The named practice kufumba is reported descriptively; interpretation beyond
