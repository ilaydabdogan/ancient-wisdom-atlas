  text: The musela is identified as an age-grade friendship involving men and women
    born in the same year and people who underwent initiation ceremonies in the same
    year.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Members of the same musela apply the term musama to one another; applying
    it to someone outside one's musela is described as a fault.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The passage gives outward signs of age-grade membership: simultaneous growth
    of the impumbe for men and a similar stage of breast development for women.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person's father's and mother's age-grades are also counted as a secondary
    musela for that person.
  category: relationship
