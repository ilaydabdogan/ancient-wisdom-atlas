canonical_text:
  quote: ''
  summary: The passage describes the Ila musela, an age-grade friendship group formed
    by people born or initiated in the same year, with special address terms, bodily
    signs of age-stage, extended membership through parents' age-grades, licensed
    mockery and cursing among members, and a mutual-aid function including help with
    compensation and possible entry by gifts.
  language: English
  quote_policy: summarized
