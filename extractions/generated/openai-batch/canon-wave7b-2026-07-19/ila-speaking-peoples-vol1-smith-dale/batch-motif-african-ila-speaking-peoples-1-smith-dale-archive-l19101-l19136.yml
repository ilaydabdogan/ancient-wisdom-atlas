canonical_text:
  quote: ''
  summary: The passage reports Lewanika's 1906 proclamation declaring slaves held
    by him and his people free, describes limits and conditions on movement and service,
    notes a two-pound payment provision for return or release, and adds a 1917 note
    that the Government refused to recognize domestic slavery, assembled people, explained
    the matter, and issued certificates to those claiming freedom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On July 16, 1906, Lewanika issued a proclamation declaring that slaves held
    by him and his people were free.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lewanika expressed a desire that slavery, trading in men, exchange of men,
    and separation of families would end in his dominions.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Chiefs and headmen retained authority to call people for twelve days of corvée
    work per year, with payment required if service continued beyond that time.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Formerly enslaved persons were generally not allowed to leave the old master's
    village without permission, but exceptions were listed for marriage residence,
    ill-treatment, refusal of marriage permission, and foreign origin within Lewanika's
    kingdom.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A person in this condition had the right to return home if two pounds were
    paid by his people or by himself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The law was understood to extend to the Bwila, and the passage states that
    no slavery was recognized if a slave paid or had paid two pounds to be free to
    go and act as he pleased.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says a few people had been released under this arrangement, but
    masters disliked it and it was doubtful whether slaves understood the matter.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: A 1917 note reports that the Government refused to recognize domestic slavery,
    explained the matter to assembled men and women, and gave certificates to those
    who stepped out to claim freedom, without mentioning the two-pound payment.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The 1917 note reports that scores claimed their freedom.
  category: action
  evidence_refs:
  - ev:5
