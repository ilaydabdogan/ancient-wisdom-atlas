canonical_text:
  quote: ''
  summary: 'The passage recounts several raids affecting Ba-ila and neighboring groups:
    Lewanika’s Barotsi campaign, a Barotsi defeat at Mbeza marked by a skull trophy
    in a sacred enclosure, the return of raiders with captives and cattle, Bachikundi
    raids led by Kanyemba, and Matabele raids motivated by reports of Ba-ila cattle
    wealth.'
  language: English
  quote_policy: summarized
