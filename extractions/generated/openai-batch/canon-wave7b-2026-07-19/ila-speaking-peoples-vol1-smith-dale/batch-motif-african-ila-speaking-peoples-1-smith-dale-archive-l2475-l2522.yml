- id: obs:1
  text: Lewanika personally led his men, and his appearance on horseback is described
    as a new terror to the Ba-ila.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lewanika returned to Barotsiland with most of the army, leaving another section
