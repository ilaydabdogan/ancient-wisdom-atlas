canonical_text:
  quote: The totem is regarded as a relation, but how or why it is so they can offer
    no explanation.
  summary: The passage discusses Ila clan totems and rejects several proposed explanations
    for their origin, including local distribution of animals or plants and direct
    connection with metempsychosis. It records beliefs about reincarnation into certain
    animals, an origin statement in which Leza caused an ancestor and a totem to descend
    together, a report that a hornbill totem was once a man, and an explanation for
    why clans are associated with particular localities while being dispersed across
    the country.
  language: English
  quote_policy: quoted
