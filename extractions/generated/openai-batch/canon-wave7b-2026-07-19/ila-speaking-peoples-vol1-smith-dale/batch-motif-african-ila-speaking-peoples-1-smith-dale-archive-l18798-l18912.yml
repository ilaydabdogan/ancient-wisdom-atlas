canonical_text:
  quote: ''
  summary: The passage gives ethnographic court examples in which persons are enslaved,
    claimed, or ransomed because of corporate responsibility, inherited claims, accusations
    of causing death or disease, debts, alleged taboo violations involving twins,
    hostage-taking, and compensation for deaths or disappearances. Payments include
    people, cattle, shells, tobacco, hoes, beads, blankets, calico, and other goods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that innocent people may be enslaved because of the faults
    of others under a clan system of corporate responsibility.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kabokota brought money and calico to release Nabwantu's children after Kaluya
    claimed them as slaves on the basis that his deceased brother had paid a fine
    for Nabwantu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In one short case, a woman accused of causing a child's death during delivery
    had friends who had to pay a man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In another short case, a man who became diseased accused a young woman of
    giving him the disease and enslaved both her and her mother.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In another short case, a loan of ten shillings for hut tax was repaid with
    a woman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A pregnant woman entered a hut containing twins, which the passage identifies
    as against Ila law; after the children died, she was held to have caused their
    death, and relatives and friends contributed goods and a slave to release those
    made responsible.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Chikumo seized and tied up Penze, who had no stated connection with the case,
    in order to pressure Penze's friends to help collect fines due to Chikumo.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Kalubu, Mukobela, and Kazuba case, killing, seizure of a girl, release
    payments, and a later child's death led to further demands involving a girl and
    goods.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage explicitly generalizes that many people are pressed into slavery
    as compensation for the death of others.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: After a boy taken by Lubesha from Mango's village died, Mango claimed a slave
    as compensation, and Lubesha gave his sister and her two children; later ransoms,
    sale of Chipila and Kabuka, Lube's flight and marriage, and succession created
    further disputes.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Shaba disappeared after following a honey-guide while carrying fat and salt,
    was later captured and enslaved by Shagele's people, and Solwe claimed Maso as
    a slave from Kabo, who instead paid goods; after Shaba returned, Solwe refused
    to return the beads.
  category: sequence
  evidence_refs:
  - ev:9
