  evidence_refs:
  - ev:8
  confidence: medium
  cautions: 'The taxonomy link is approximate: the passage concerns charm-mediated
    business and purchase of secret knowledge, not an explicit mythic exchange episode.'
- id: motif:6
  label: Curse transferred by first violation of taboo object
  taxonomy_refs: []
  basis: The workers avoid cutting the charm-bearing tree until Mr. Dale first chops
    it, after which the curse is said to have transferred to him and they can cut
    safely.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage reports a local explanation of behavior during a single incident.
- id: motif:7
  label: Tree as container of communal protective and aggressive medicine
  taxonomy_refs: []
  basis: A powerful musamo is described as having been deposited in a tree during
