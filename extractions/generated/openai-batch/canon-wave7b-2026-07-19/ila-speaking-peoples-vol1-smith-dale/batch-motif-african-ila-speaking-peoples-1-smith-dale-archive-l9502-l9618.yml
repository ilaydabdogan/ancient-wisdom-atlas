- id: motif:5
  label: Ritualized exchange and activation of charm power for bargains
  taxonomy_refs:
  - sacred_exchange
  basis: A charm armlet is to be pressed to the lips before business to secure a favorable
    bargain, and another charm secret is said to have been purchased for ten head
