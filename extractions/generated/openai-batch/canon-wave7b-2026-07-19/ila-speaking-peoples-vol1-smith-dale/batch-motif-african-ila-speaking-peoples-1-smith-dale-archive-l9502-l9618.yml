- id: motif:1
  label: Protective amulet as insurance against calamity
  taxonomy_refs: []
  basis: The passage frames misamo and related charms as practical protections against
    violence, robbery, death, and other dangers, and describes widespread wearing
    or carrying of them.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: This is an ethnographic motif pattern in the passage, not a narrative
    myth episode.
- id: motif:2
  label: Luck as cleanness and whiteness
  taxonomy_refs: []
  basis: Isambwe is linked with washing and good luck, impemba is used as a forehead
    talisman, and fortunate persons are described through clean or white imagery.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage reports symbolic associations but does not narrate a myth
    explaining them.
- id: motif:3
  label: Destructive charm that kills, disables, or destroys enemies
  taxonomy_refs: []
  basis: Inzuikizhi is defined as a medicine for killing and destroying, and a tree
    musamo is said to have been deposited to make enemies lame and helpless.
  evidence_refs:
  - ev:3
  - ev:11
  confidence: high
  cautions: The passage gives examples of destructive charm use but does not provide
    a full story cycle.
- id: motif:4
  label: Dream-revealed charm recipe
  taxonomy_refs: []
  basis: An old chief says the composition of a witchcraft-preventing armlet was revealed
