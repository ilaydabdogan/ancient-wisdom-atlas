canonical_text:
  quote: ''
  summary: 'The passage describes Ila categories of charms, amulets, talismans, and
    medicines: protective shinda, luck-bringing isambwe, destructive inzuikizhi, and
    broader musamo/bwanga. It explains how charms are worn, eaten, washed with, suspended
    in houses, given by chiefs, revealed in dreams, used for business or love, and
    embedded in a tree as a communal war charm with an attached curse.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shinda are described as amulets connected with applying or obtaining a charm
    for one’s own protection; a person without such protection is described as a deficient
    or merely human person.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Isambwe or insambwe is described as a talisman that brings cholwe, meaning
    luck, prosperity, or good fortune, to its possessor.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Good luck is associated in the passage with cleanness and whiteness, while
    misfortune is expressed by the image of blackness on the forehead.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Inzuikizhi is described as a kind of musamo whose function is to kill and
    destroy, used by warlocks and witches.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Misamo are said to be trusted as protection against calamities such as violence,
    robbery, and death, and to influence the mode of life beyond the grave.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Charms may be worn around the neck, arm, or head, placed in a small horn,
    kept in a snake-skin bag, made as an iguana-skin armlet, or suspended in a hut
    or under eaves.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: One chief had medicines suspended on his verandah for keeping people together,
    protecting cattle from crocodiles, increasing cattle, and giving hunting dogs
    speed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A minor chief kept a miniature bow and arrows in his hut and said he shot
    the arrows in different directions to induce people from those directions to join
    his adherents.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: An old chief transferred an iguana-skin armlet to the narrators, saying it
    contained pounded roots and insect remains and would prevent all kinds of witchcraft.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The old chief said the composition of the witchcraft-preventing armlet had
    been revealed to him in a dream by a Musangushi.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Another armlet was to be pressed to the lips before business to secure a favorable
    bargain, and another was said to make everyone love the wearer; the old chief
    had bought the latter secret for ten head of cattle.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: To “eat” a charm is explained as meaning that a person has the charm and its
    qualities available, not necessarily that the person consumes it by mouth.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Personal, village, and communal charms are all described as existing among
    the Ba-ila.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:14
  text: Mr. Dale’s workers refused to cut a tree believed to contain a communal charm
