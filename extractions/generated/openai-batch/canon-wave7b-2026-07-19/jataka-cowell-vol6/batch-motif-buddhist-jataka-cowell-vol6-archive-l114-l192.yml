canonical_text:
  quote: ''
  summary: The passage consists of the title page and preface to Volume VI of The
    Jataka. It identifies the work as stories of the Buddha’s former births translated
    from Pali under E. B. Cowell’s editorship, names E. B. Cowell and W. H. D. Rouse
    as translators of the volume, and gives Cambridge publication details. The preface
    recounts collaboration on revision, Cowell’s death, transfer of manuscripts, completion
    and revision of unfinished portions, editorial restraint, difficulties caused
    by obscure verse, thanks to H. T. Francis, and the prefacer’s earlier role in
    suggesting the project.
  language: English
  quote_policy: summarized
