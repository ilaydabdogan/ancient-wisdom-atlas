canonical_text:
  quote: ''
  summary: Mahosadha tells the addressed king that any torture inflicted on him will
    be reciprocated by Vedeha against the king's family. He then reveals that the
    king's wife, children, and mother have been taken through a tunnel to Vedeha.
    A messenger confirms that the inner palace is empty and desolate, with guards
    bound and the treasury plundered. Seeing the king's grief and anger, Mahosadha
    describes Queen Nanda's beauty to awaken the king's longing and deter harm, then
    invokes Nanda and himself going before Yama.
  language: English
  quote_policy: summarized
literal_observations:
