  text: Mahosadha states that if the addressed king cuts, cooks, pegs out, or pierces
    him, Vedeha will do the same to the king's named family members and household.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mahosadha says that a secret arrangement exists between Vedeha and himself,
    and compares his role for Vedeha to a hundred-layer leather shield that keeps
    off arrows.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king initially thinks Mahosadha is speaking from fear and doubts the claim
    because he believes his family is carefully guarded.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mahosadha says the king's inner apartments are empty and that the king's wife,
    children, and mother were carried through a tunnel and put in Vedeha's charge.
