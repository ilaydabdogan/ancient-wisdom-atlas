canonical_text:
  quote: ''
  summary: Mahosadha, acclaimed as a peerless sage, approaches Kevatta holding a precious
    gem. He offers it as a gift, drops it onto Kevatta's outstretched fingers, and
    the gem falls to his own feet. When Kevatta stoops for it, Mahosadha holds him
    down so that the crowd and opposing kings think Kevatta has bowed at his feet.
    The opposing rulers and army flee in panic. Kevatta later protests that he was
    tricked with the gem and eventually rallies the broken army.
  language: English
  quote_policy: summarized
