canonical_text:
  quote: Good is the secrecy of a secret, the revealing of a secret is not to be praised.
  summary: A king, after hearing an accusation of treachery, asks five wise men to
    whom a secret should be revealed. Several answers name trusted relations such
    as a wife, friend, brother, son, or mother. The sage answers that a secret should
    be kept until the matter is accomplished, after which one may speak. The king
    is displeased, and the Bodhisat recognizes that four men had previously slandered
    him.
  language: English
  quote_policy: quoted
