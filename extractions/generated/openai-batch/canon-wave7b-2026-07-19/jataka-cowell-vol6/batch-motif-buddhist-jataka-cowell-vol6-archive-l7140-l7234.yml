canonical_text:
  quote: ''
  summary: 'Introductory frame to the Mahanaradakassapa-Jataka: after converting Uruvela-Kassapa,
    the Buddha publicly shows that Kassapa is his disciple. Kassapa states why he
    abandoned fire sacrifice, performs a sevenfold aerial miracle, and the Buddha
    introduces an olden-time story in which he was Brahma Narada. The old story begins
    with King Angati of Videha, his meritorious daughter Ruja, royal provision for
    her adornment and almsgiving, and a full-moon consultation with ministers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Latthivana, the Buddha arrives after converting Uruvela-Kassapa and other
    ascetics, accompanied by a thousand bhikkhus who had formerly been ascetics.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dispute arises among the Brahmans and householders in the Magadha king's
    train over whether Uruvela-Kassapa is guided by the Buddha or the Buddha by Uruvela-Kassapa.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Buddha asks Kassapa what he saw that caused him to abandon his sacred
    fire and desert his fire sacrifice.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kassapa says sacrifices concern forms, sounds, tastes, sensual pleasures,
    and women, and that he no longer delights in sacrifices or offerings.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kassapa lays his head on the Buddha's feet, declares the Buddha his teacher
    and himself the Buddha's disciple, rises into the air seven times, descends, salutes,
    and sits aside.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The multitude interprets the miracle as showing the Buddha's power and Kassapa's
    conversion by the Tathagata.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Buddha says that in an olden time, when he was Brahma Narada, he also
    broke this same man's bonds of error and made him humble.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The olden-time story is set at Mithila in Videha under a righteous king named
    Angati.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ruja is conceived in the womb of Angati's chief queen; she is described as
    fair, gracious, meritorious, and one who had prayed for a hundred thousand ages,
    while the other sixteen thousand wives are barren.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Angati sends Ruja twenty-five baskets of flowers and raiment daily, and a
    thousand pieces for almsgiving every fortnight.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Angati has three ministers named Vijaya, Sunama, and Alata or Alataka.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: On the full moon of the fourth month, with the city and palace adorned, Angati
    stands at an open window on a terrace, sees the moon, and asks his ministers how
    they should pass the night.
  category: sequence
  evidence_refs:
  - ev:8
