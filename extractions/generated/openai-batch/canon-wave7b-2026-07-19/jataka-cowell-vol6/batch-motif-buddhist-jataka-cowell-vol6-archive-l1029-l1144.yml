canonical_text:
  quote: ''
  summary: Prince Temiya, after sending away the charioteer, takes up the ascetic
    vow. Sakka sends Vissakamma to provide a hermitage and ascetic requisites. Temiya
    dons ascetic clothing, rejoices, enters contemplative attainments, eats simple
    leaves, and settles there. The King of Kasi gathers a royal procession to meet
    his son at the hermitage. Temiya greets him and asks about his welfare, conduct,
    kingdom, and resources; the king answers, and then refuses a couch out of respect
    for the Great Being.
  language: English
  quote_policy: summarized
