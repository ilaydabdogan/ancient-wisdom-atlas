canonical_text:
  quote: '"My parents live in yonder wood, blind and dependent on my care"'
  summary: A wounded Sama questions the hidden shooter while carrying water for his
    blind parents. King Piliyakkha identifies himself as a royal hunter, first gives
    a false explanation about a deer, then confesses that wrath and greed led him
    to shoot. Sama truthfully identifies himself and laments that his dependent parents
    may die and grieve without him and the water he was bringing.
