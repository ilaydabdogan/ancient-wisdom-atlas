canonical_text:
  quote: ''
  summary: Mathara the wise parrot reports the story of the maynah to Mahosadha. Mahosadha
    foresees danger to King Vedeha if the king travels to Uttarapancala for Pancalacandi,
    resolves to aid him out of reciprocal loyalty, and plans an advance operation
    involving dwellings, a town, secret passages, a tunnel, route stations, ships,
    craftsmen, and military support. Vedeha authorizes him to go ahead with an army
    and released prisoners. Mahosadha organizes labor and logistics, crosses the Ganges,
    marks out the site for the tunnel, town, and passage, and enters the city.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker addresses a lady with words of attachment while inwardly thinking
    he does not care whether she lives or dies, then flies toward Sivi country, turns
    to Mithila, and reports to the wise man.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master identifies Mathara, the wise parrot, as telling Mahosadha the story
    of the maynah.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mahosadha thinks that the king will go and be destroyed unless he intervenes,
    and that withholding help from a king who gave him wealth would disgrace him.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mahosadha plans to go before the king, see the foreign ruler, build a city,
    make a smaller passage and a great tunnel, arrange the status of the foreign king's
    daughter, and bring Vedeha home even if surrounded by many kings and armies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mahosadha says a man should work for the interest of the person in whose house
    he is fed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: King Vedeha says he is going to Uttarapancala because he wants Pancalacandi
