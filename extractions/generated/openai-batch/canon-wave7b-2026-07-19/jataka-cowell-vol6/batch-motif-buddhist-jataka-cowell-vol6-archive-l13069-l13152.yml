  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mahosadha offers to go first and build dwellings for Vedeha, with the king
    to come when summoned.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Vedeha authorizes Mahosadha to take an army, open the prisons, break the prisoners'
    chains, and take the released robbers with him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mahosadha brings out capable prisoners, favors them, recruits companies of
    artisans with tools, and leaves the city with a large company.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: On the road, Mahosadha builds a village at every league and leaves a courtier
    in charge with instructions to prepare transport, resist enemies, and convey the
    king quickly to Mithila on his return with Pancalacandi.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: At the Ganges, Mahosadha orders Anandakumara and three hundred wrights to
    procure timber, build three hundred ships, gather wood, and return soon.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Mahosadha crosses the Ganges by ship, paces out distances from the landing-place,
