canonical_text:
  quote: ''
  summary: Somadatta rejects his father’s plan to betray Bhuridatta and leaves to
    become an ascetic. The outcast Brahmin then guides Alambayana to Bhuridatta, the
    Naga king, who is observing a fast-day on an ant-hill. Bhuridatta resolves not
    to feel anger even under attack. The head-jewel is lost into the Naga-world, the
    Brahmin laments losing jewel, friendship, and son, and Alambayana captures and
    tortures Bhuridatta with drugs and spells while Bhuridatta remains free from anger.
  language: English
  quote_policy: summarized
