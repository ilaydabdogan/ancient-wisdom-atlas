canonical_text:
  quote: ''
  summary: Sakka grants boons and departs. Vessantara and Maddi remain in a hermitage
    while Jujaka travels with their children. At night Jujaka binds the children,
    but deities in the parents' forms release, wash, feed, and comfort them before
    rebinding them at dawn. Divine guidance brings Jujaka and the children to Jetuttara,
    where King Sanjaya has an omen dream of two blossoms. The king recognizes the
    children, questions Jujaka, hears that Vessantara gave them as slaves, and then
    hears both criticism of Vessantara and the children's defense and complaint.
  language: English
  quote_policy: summarized
