canonical_text:
  quote: ''
  summary: Brahmadatta of Pancala approaches and surrounds Mithila with a large torch-lit
    army. King Vedeha is frightened and asks Mahosadha how deliverance can come. Mahosadha,
    called the Great Being, sets guards, consoles the king, and promises to scatter
    Brahmadatta's host. An interleaved explanatory note begins a separate legal anecdote
    about a river rescue and disputed reward.
  language: English
  quote_policy: summarized
