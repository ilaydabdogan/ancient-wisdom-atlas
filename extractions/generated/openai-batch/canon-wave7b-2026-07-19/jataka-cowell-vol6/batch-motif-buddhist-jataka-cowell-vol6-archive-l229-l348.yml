  quote: ''
  summary: The passage contains an errata note, a contents list summarizing Jatakas
    538-547, and the opening frame of the Muga-Pakkha Jataka, where the Master at
    Jatavana responds to discussion of his great renunciation by saying he had renounced
    a kingdom in a former birth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An errata note instructs the reader to omit and replace wording and includes
    a cross-reference for comparison.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The contents summary for Muga-Pakkha-Jataka says a prince pretends to be dumb
    and incapable for sixteen years, speaks when about to be buried, teaches religion
    to a charioteer, becomes an ascetic, and is followed by his father.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The contents summary for Mahajanaka-Jataka describes royal conflict, a pregnant
    queen's flight, a son raised without knowledge of his father, a sea voyage and
    wreck, rescue by a goddess, difficult questions, marriage to the usurper's daughter,
    and later ascetic renunciation followed by the wife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The contents summary for Sama-Jataka says a hunter's son and daughter become
    ascetics; the wife conceives without human intercourse; parents are blinded by
    a snake; their son tends them; a king shoots the son with an arrow, repents, and
    the son and parents are miraculously restored.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The contents summary for Nimi-Jataka says a king becomes an ascetic after
    seeing his first grey hair, and Sakka's charioteer takes him through the heavens
    and hells before bringing him to Sakka.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The contents summary for Khandahala-Jataka says a false judge misleads a king
    into decreeing the death of his family so that he may go to heaven, and Sakka
    eventually rescues them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The contents summary for Bhuridatta-Jataka mentions an ascetic seduced by
    a Naga-woman, scenes in Naga country, the feud between Nagas and Garulas, a magic
    spell, and a prince's adventures in snake form.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The contents summary for Mahanaradakassapa-Jataka says a pleasure-devoted
    king questions an ascetic about moral duties, while his virtuous daughter attempts
    to free him from heretical beliefs, finally with the Buddha's help.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The contents summary for Vidhurapandita-Jataka says four kings ask a wise
    man to resolve a dispute about virtue; the Naga king's wife desires the wise man's
    heart; a Yakkha wins claim to the wise man at dice, tries unsuccessfully to kill
    him, and is won over by him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The contents summary for Maha-Ummagga-Jataka contrasts four pretended wise
    men with one real wise man, describes problems solved by the real wise man, attempts
    to destroy him, and his final triumph, including wars, sieges, and a tunnel full
    of machinery.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The contents summary for Vessantara-Jataka says a gift-giving prince is disgraced
    after giving away a magical elephant, banished to the forest with his family,
    gives away everything including his two children, and is later restored to a good
    outcome.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: In the opening frame of Muga-Pakkha-Jataka, the Brethren discuss the Blessed
    One's great renunciation, and the Master says his present renunciation was not
    so wonderful because he had formerly left a kingdom and renounced the world while
    still perfecting wisdom.
  category: speech
  evidence_refs:
  - ev:12
