canonical_text:
  quote: ''
  summary: King Mahajanaka, called the Great Being and the Bodhisatta, refuses Queen
    Sivali's effort to bring him back. Near a forest he cuts a stalk of munja grass
    and uses it to declare their relationship permanently severed. The queen faints
    from grief; he disappears into the wood and hides his tracks. She later erects
    topes and makes offerings at places associated with him, crowns her son in Mithila,
    adopts ascetic life in the mango-garden, attains absorption, and becomes destined
    for the Brahma world. The Master frames the episode as a former performance of
    the Tathagata's great Renunciation and identifies the former-birth figures.
  language: English
  quote_policy: summarized
