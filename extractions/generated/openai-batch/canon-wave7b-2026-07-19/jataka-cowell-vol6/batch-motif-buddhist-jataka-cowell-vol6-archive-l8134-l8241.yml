canonical_text:
  quote: ''
  summary: After Vidhura-pandita has been honored for his moral discourse, the Naga
    queen Vimala learns that the Naga king gave him a jewel. Desiring to hear Vidhura,
    she feigns illness and asks for Vidhura's heart. The distressed Naga king tells
    his daughter Irandati to seek a husband able to bring Vidhura. Irandati adorns
    a Himalayan mountain with flowers and sings for such a husband. Punnaka, a Yakkha
    general riding a magic horse, hears her song, is fascinated by it, and offers
    to marry her and bring Vidhura's heart.
  language: English
  quote_policy: summarized
