canonical_text:
  quote: ''
  summary: The passage frames the Bhuridatta-Jataka with lay-brethren keeping the
    fast-day at Jetavana, after which the Master introduces an old legend. In the
    legend, King Brahmadatta sends away his son from Benares out of suspicion. The
    prince lives in a leaf hut between the Yamuna and the sea. A widowed Naga woman
    from the Naga-world beneath the ocean finds his hut, tests whether he is truly
    ascetic by adorning it with flowers and perfumes, and judges him a lover of pleasure
    when he sleeps on the flower couch. The prince later sees her, falls in love,
    and they agree to live together as husband and wife.
  language: English
  quote_policy: summarized
