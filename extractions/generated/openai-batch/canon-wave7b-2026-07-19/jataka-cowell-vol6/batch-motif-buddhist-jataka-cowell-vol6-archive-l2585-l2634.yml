canonical_text:
  quote: ''
  summary: The Master praises an ascetic for supporting his parents and introduces
    a former-birth story. Near Benares, two friendly hunter chiefs in villages on
    opposite riverbanks arrange that their future son and daughter should marry. Dukulaka
    and Parika are born, described as golden-complexioned, harmless, and newly come
    from the Brahma world. Both resist household life and marriage, yet their parents
    proceed with the marriage. The pair live chastely, refuse killing, receive permission
    to become ascetics, and depart along the Ganges toward the Himavat region.
  language: English
  quote_policy: summarized
