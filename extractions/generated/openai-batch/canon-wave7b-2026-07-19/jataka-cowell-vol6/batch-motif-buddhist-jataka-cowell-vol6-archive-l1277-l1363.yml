canonical_text:
  quote: Not now only but formerly also did I leave a kingdom and become an ascetic.
  summary: A royal father offers sovereignty, wealth, women, and palaces to the Great
    Being, who rejects them by teaching impermanence and the certainty of death. The
    king, queen, royal wives, citizens, and later neighboring kings take ascetic vows;
    a divinely provided hermitage houses the community, which attains meditative powers
    and favorable rebirths. The Master identifies the story as one of his former births.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A king addresses his son and offers him sole kingship, palace women, enemy
    daughters, sons, treasures, troops, palaces, slaves, queens, and the throne, while
    asking why he remains in the wood or waste.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Great Being replies that wealth, wives, youth, beauty, sport, royal food,
    and family ties are impermanent or snares, and tells the king to take the crown
    away.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the Great Being's discourse, the king, Queen Canda, and sixteen thousand
    royal wives desire to embrace the ascetic life.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king orders a drum proclamation for anyone wishing to become an ascetic
    with his son, opens his treasuries, and posts an inscription on a golden plate
    fixed to a bamboo pillar about taking exposed treasure-jars.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Citizens leave their houses with doors open and gather around the king; the
    king and the multitude take the ascetic vow together before the Great Being.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Sakka provides a hermitage three leagues long, and the Great Being assigns
    central branch-and-leaf huts to women and outer huts to men.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the fast-day the ascetics stand on the ground, eat fruits from trees created
    by Vissakamma, and follow ascetic rules.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Great Being knows each person's thoughts, including lust, malevolence,
    or cruelty, sits in the air, teaches the law, and his listeners develop the Faculties
    and the Attainments.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A neighboring king enters Benares intending to establish his rule, sees precious
    stones in the palace, suspects danger around the wealth, and follows the route
    by which the former king left.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Great Being meets the neighboring king, sits in the air, teaches the law,
    and the invader with his company takes the ascetic vow; the same happens to another
    king.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Three kingdoms are abandoned; elephants and horses roam wild, chariots decay
    in the woods, and treasury money is scattered in the hermitage as if it were sand.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: All residents attain the eight Ecstatic Meditations and become destined for
    the world of Brahma; animals calmed by seeing the sages are later reborn in the
    six heavens of the gods.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Master concludes that he had formerly left a kingdom and become an ascetic,
    and then identifies the Birth, naming corresponding figures from the Buddhist
    community.
  category: speech
  evidence_refs:
  - ev:8
