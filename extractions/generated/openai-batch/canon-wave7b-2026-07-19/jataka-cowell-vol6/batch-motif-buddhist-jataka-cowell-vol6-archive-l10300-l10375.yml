canonical_text:
  quote: ''
  summary: A sequence of five tests is posed to the villagers or people of East Market-town.
    The sage identifies male and female snakes by bodily signs, interprets a riddle-description
    as a cock, rethreads an octagonal gem by using honey, wool, and ants, answers
    the impossible demand that a royal bull deliver a calf by an analogous claim that
    a man is in labor, and solves a demand for boiled rice under eight negated conditions
    by substitutions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A male and a female snake are brought for identification, and the sage distinguishes
    them by tail, head, eye, and head-shape signs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A message demands a white bull with horns on its legs, a hump on its head,
    and an unfailing threefold voice; the sage says the requested creature is a cock,
    identifying spurs, crest, and crowing as the described features.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: An octagonal gem once given by Sakka to King Kusa has a broken thread that
    no one can remove or replace.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The sage smears the gem holes and a woollen thread with honey, places the
    gem where ants pass, and the ants remove the old thread and pull the new thread
    through.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A royal bull is fattened and sent to East Market-town with an order to deliver
    its calf and return both bull and calf.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sage instructs a bold man to lament before the king that his son is in
    labor, then answer the king's objection by applying the same impossibility to
    the royal bull.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'A message requires boiled rice cooked under eight conditions: without rice,
    water, pot, oven, fire, firewood, a road, or a male or female carrier.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The sage supplies substitutes for the rice challenge, including broken rice,
    snow, an earthen bowl, chopped wood-blocks, fire kindled by rubbing, leaves, a
    eunuch carrier, and a footpath.
  category: sequence
  evidence_refs:
  - ev:5
