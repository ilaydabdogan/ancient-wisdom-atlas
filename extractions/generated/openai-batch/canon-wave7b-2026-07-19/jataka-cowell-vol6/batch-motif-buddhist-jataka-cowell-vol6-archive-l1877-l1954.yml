    tree.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The fruit-bearing tree becomes broken and battered, while the fruitless tree
    remains beautiful and unharmed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The ministers tell the king that the fruitful tree was plundered because the
    crowd knew he had eaten from it, and that the other tree was unharmed because
    it had no fruit.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The king says the kingdom is like the fruitful tree and the ascetic life is
    like the barren tree, and says that the possessor of property has fears.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The king resolves to leave his glory, give up the world, become an ascetic,
