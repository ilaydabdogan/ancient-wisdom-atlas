canonical_text:
  quote: This kingdom is like the fruitful tree, but the ascetic life is like the
    barren tree
  summary: King Mahajanaka is celebrated as a wise ruler, recalls his courage in the
    ocean, rules righteously, and has a son made viceroy. During a garden visit he
    sees a fruit-bearing mango tree plundered while a fruitless tree remains unharmed.
    Interpreting this contrast as a lesson about possession and danger, he resolves
    to renounce royal glory, delegates rule, and lives as a Buddhist priest on the
    palace top.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: King Mahajanaka, son of Aritthajanaka, rules over all the kingdoms of Yideha,
    and the city comes to see him with presents.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The city prepares a great festival with palace decorations, perfumes, wreaths,
    thrown grain and flowers, food, drink, songs, dancing-girls, and musical instruments.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bodhisatta sits under the white umbrella, sees the royal pomp, remembers
    his struggles in the great ocean, and speaks of courage as the cause of attaining
    glory.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: He fulfills the ten royal duties, rules righteously, and waits on the pacceka-buddhas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Queen Sivali gives birth to Dighavu-kumara, and when he grows up his father
    makes him viceroy.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A gardener brings fruits and flowers to the king, is ordered to adorn the
    garden, and the king enters the garden gate on a royal elephant with his retinue.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Near the garden gate stand two bright green mango trees: one without fruit
    and one full of very sweet fruit.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king eats a fruit from the fruit-bearing mango tree and thinks he will
    eat more on his return.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the king has eaten the first fruit, people from the viceroy to the elephant-keepers
