canonical_text:
  quote: ''
  summary: The passage closes a preceding Jataka by identifying its characters with
    the Buddha and disciples, then begins the Maha-Ummagga-Jataka. At Jetavana, monks
    praise the Buddha's vast knowledge, and the Teacher says this wisdom was also
    present in former births. In a past story, King Vedeha rules Mithila and has four
    sages. When the Bodhisatta is conceived, Vedeha dreams of four fire columns and
    a small central flame that grows to the Brahma world, illuminates all worlds,
    receives worship from men and gods, and harms no one who passes through it. The
    king wakes in terror, and the sages come in the morning.
  language: English
  quote_policy: summarized
