canonical_text:
  quote: ''
  summary: Mahajanaka tries to send back the people following him by drawing a boundary
    line, but Queen Sivali crosses it and the multitude follows. He proceeds toward
    Northern Himavat. The ascetics Narada and Migajina, after trance states, appear
    in the air and exhort him concerning renunciation, hindrances, wise association,
    and the ascetic path; the Bodhisatta denies that injury or treachery caused his
    departure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people continue following the king after he has spoken, and he decides
    to make them return.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king asks his ministers whose kingdom it is, receives the answer that
    it is his, orders punishment for anyone crossing a line, and draws the line across
    the road with his staff.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: No one is able to violate the line, and the people stand behind it lamenting.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The queen, unable to cross at first and grieving as the king goes on, beats
    her breast, falls across, forces her way over the line, and the people follow
    where she leads.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Great Being goes toward Northern Himavat; the queen follows with the army
    and riding animals, and the king journeys sixty leagues while unable to stop the
    multitude.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Narada is an ascetic dwelling in the Golden Cave in Himavat, possessing five
    supernatural faculties; after seven days in ecstasy he rises from trance and exclaims
    about bliss.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Narada uses his divine eye to see Mahajanaka and resolves to exhort him so
    that his purpose will be strengthened against the hindrance posed by the followers
    headed by Queen Sivali.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Narada stands in the air in front of the king and speaks to strengthen his
    resolve.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The king says he has crossed the bound, left the world, and leaves the assembled
    hosts with a joyous heart.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Narada warns that the king has not fully crossed while still beset by the
    body, and lists sleep, sloth, pleasure-turned thoughts, surfeit, and discontent
    as hindrances.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'Narada identifies himself by name and gives counsel: association with the
    wise is best, the four perfections should be exercised, deficiencies should be
    supplied by patience and calm, and virtue, knowledge, and law should guard the
    pilgrimage.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Narada returns through the sky to his own abode.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Migajina, another ascetic, has just risen from ecstatic trance, sees the Great
    Being, and resolves to exhort him so that he might send the multitude away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Migajina appears above the Great Being in the air and says that Janaka has
    left horses, elephants, city and country dwellers, and is content with an earthen
    bowl; he asks whether subjects, friends, ministers, or kinsmen wounded him by
    treachery.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Bodhisatta replies that he has not wronged any friend and that no friend
    has wronged him.
  category: speech
  evidence_refs:
  - ev:8
