canonical_text:
  quote: ''
  summary: The passage concludes an episode in which a king, amazed that Sama appears
    alive after seeming dead, is instructed by Sama on filial duty, divine reward,
    royal duties, and moral precepts. The king accepts the teaching and later reaches
    heaven; the Bodhisatta and his parents reach the Brahma world. The frame lesson
    identifies the former-birth figures and states that the wise have long supported
    their parents.
  language: English
  quote_policy: summarized
