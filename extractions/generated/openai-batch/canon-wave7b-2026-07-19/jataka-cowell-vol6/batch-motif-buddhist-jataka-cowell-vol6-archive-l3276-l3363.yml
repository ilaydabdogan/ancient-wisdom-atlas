  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Great Being gives further instruction and teaches the five precepts; the
    king accepts the teaching with bent head.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The king returns to Benares, gives gifts, performs virtuous actions, and after
    death joins the host of heaven with his court.
