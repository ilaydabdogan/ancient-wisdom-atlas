canonical_text:
  quote: ''
  summary: The rescued kings thank Mahosadha, who reminds them that he had earlier
    saved them from poisoned food and drink prepared by King Culanī and Kevatta. Culanī
    admits the plot, asks pardon, and is reconciled with the kings. Culanī then honors
    Mahosadha and tries to retain him with rich rewards, but Mahosadha refuses to
    desert King Vedeha. After receiving gifts, troops, and honors from Culanī and
    the other kings, Mahosadha returns to Mithila, where Vedeha first fears the approaching
    army but then welcomes and embraces him.
  language: English
  quote_policy: summarized
