canonical_text:
  quote: '"There is no fruit, good or evil, in following the law ; there is no other
    world"'
  summary: Kassapa teaches the Videha king a doctrine denying moral fruit, afterlife,
    usefulness of giving, and consequences of sin. Alata supports this with a remembered
    former birth in which he sinned but was reborn well. Bijaka, a poor slave who
    fasts and gives alms, weeps because his own remembered virtuous former life was
    followed by misery. King Angati accepts Kassapa's fatalistic teaching, resolves
    to pursue pleasure, and departs.
  language: English
  quote_policy: quoted
