canonical_text:
  quote: ''
  summary: Vidhura addresses a mixed audience and gives an extended instruction on
    how a wise person may gain and keep honour in a king's court. He emphasizes moral
    character, readiness in royal business, restraint, avoidance of royal privileges
    and royal women, cautious conduct near the king, moderation in speech and appetite,
    respect for elders, and loyalty against foreign spies.
  language: English
  quote_policy: summarized
