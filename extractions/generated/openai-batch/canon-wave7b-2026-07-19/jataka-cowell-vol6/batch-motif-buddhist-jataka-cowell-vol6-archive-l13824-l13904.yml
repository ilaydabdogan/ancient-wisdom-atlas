canonical_text:
  quote: ''
  summary: The passage depicts the Bodhisat, identified as the wise Mahosadha, appearing
    richly adorned at a terrace window before King Ciilani. The king approaches on
    an elephant intending to seize him. Mahosadha speaks calmly, tells the king to
    put aside his weapons, announces that the plan against Vedeha has failed and that
    Vedeha has already crossed the Ganges, and illustrates the king's frustrated desire
    with animal comparisons. The enraged king orders violent mutilation, while Mahosadha
    privately knows that the king's family has been conveyed to Mithila and plans
    to reveal this to overwhelm him. The line range also contains an apparent embedded
    note about a steel-making process.
  language: English
  quote_policy: summarized
