canonical_text:
  quote: ''
  summary: The passage recounts failed attempts to find someone acceptable to the
    princess through difficult tests. Because the kingdom needs a king, the family
    priest sends out an empty festive chariot, ritually prepared and directed to go
    to the person with sufficient merit to rule. The chariot passes the officers of
    state, leaves the city, enters the park, circles a ceremonial stone, and stops
    by the Bodhisatta. The priest tests the Bodhisatta's composure, examines marks
    on his feet, declares his capacity to rule, and tells him that the kingdom belongs
    to him.
  language: English
  quote_policy: summarized
