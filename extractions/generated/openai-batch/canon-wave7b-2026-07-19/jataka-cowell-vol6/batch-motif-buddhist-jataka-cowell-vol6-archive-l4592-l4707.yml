canonical_text:
  quote: ''
  summary: A king orders sons, daughters, wives, merchants, and animals to be gathered
    for a sacrifice intended to secure heaven. Candakumara identifies Khandahala's
    instruction as the cause and hopes to secure the release of others. Merchants
    and kin plead for mercy. The king's mother and father remonstrate; the mother
    teaches that alms and non-injury, not killing, are the path to heaven. The king
    insists he must obey his teacher.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king proclaims that sacrificing his sons, daughters, and wives will take
    him to the world of the gods, and he orders his sons to be brought.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Officers tell Candakumara that his father wants to kill him, that the order
    comes through Khandahala, and that others will also be seized for a sacrifice
    of four kinds of victims.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Candakumara thinks Khandahala's hostility is directed at him because he prevents
    unjust judgments, and he intends to seek the release of the others.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The princes are placed in the palace yard; the daughters and wives are then
    brought near them, weeping and wailing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Four merchants are seized; their relatives and the city protest, and the merchants
    plead to be enslaved instead of killed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The king orders elephants, horses, mules, and bulls to be brought for the
    sacrifice, gifts to be given to officiating priests, and preparations to be ready
    by dawn.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king's mother asks whether the sacrifice of the four sons is truly intended;
    the king answers that a costly sacrifice will win him a heavenly dwelling.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The mother says sacrificing sons cannot lead to heaven and instead teaches
    that giving alms and harming no living thing is the certain path to heaven.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The king says he must obey his teacher's words and that heaven is the prize;
    afterward his father Vasavatti comes to remonstrate.
  category: sequence
  evidence_refs:
  - ev:8
