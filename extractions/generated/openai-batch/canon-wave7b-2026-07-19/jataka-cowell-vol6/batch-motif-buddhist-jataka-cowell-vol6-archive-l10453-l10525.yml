canonical_text:
  quote: ''
  summary: Mahosadha instructs his father how to appear before the king so that a
    seating incident will pose a question about whether a father is always superior
    to a son. After arriving in splendor, Mahosadha has an ass brought as evidence
    and uses the contrast between the low value of an ass and the great value of a
    mule colt from a fine mare to refute the claim that the sire is always better
    than the offspring. The king and assembly praise his solution, while the rival
    sages are humiliated. The narrator adds that the act was not disrespect toward
    his father but a strategy to solve the king's problem and display wisdom.
  language: English
  quote_policy: summarized
