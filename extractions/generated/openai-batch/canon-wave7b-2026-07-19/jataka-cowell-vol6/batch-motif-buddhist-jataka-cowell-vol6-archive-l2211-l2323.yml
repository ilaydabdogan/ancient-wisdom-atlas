canonical_text:
  quote: That pair of trees my teachers were
  summary: A king who has become an ascetic explains that no human religious teacher
    prompted him; the sight of a despoiled fruit-bearing mango tree beside an intact
    barren tree taught him the danger attached to wealth and kingship. Queen Sivali
    urges him to settle succession before leaving; he reassures her about Dighavu
    and the Videha nobles, counsels righteous rule and alms-dependence, and later
    demonstrates ascetic detachment by eating meat dropped by a dog, defending it
    as lawfully gained food.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker says he saw the world as consumed by pain, misery, and sin, and
    drew a warning from this to begin the ascetic life.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: An ascetic asks who taught him to choose the ascetic life, and the Great Being
    replies that no Brahman or ascetic words moved his heart toward it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In a royal park, the king saw a fruit-bearing mango tree broken and stripped
    by crowds seeking its fruit, while a nearby barren tree remained green and strong.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king states that kings and wealthy persons are vulnerable like the fruitful
    tree, and says the pair of trees were his teachers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Queen Sivali says the subjects lament the king's departure and asks him to
    comfort them and crown his son before forsaking the world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Bodhisatta says he has left subjects, friends, kin, home, and land, and
    tells the queen that Dighavu and the nobles of Videha will support her.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king counsels the queen that teaching his son to rule sinfully will lead
    to an evil end, and says that a beggar's portion received as alms is sufficient.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The queen encamps in a suitable place, while the king passes the night at
    the root of a tree; the next day he performs ablutions and goes on, with the queen
    and army following.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: At Thuna, a dog drops fried flesh it had carried away; the Great Being regards
    the owner as unknown, places the meat in his earthen dish, wipes it, and eats
    it near water.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The queen condemns the meat as dog leftovers, while the Great Being replies
    that leavings of a householder or dog are not forbidden if gained by lawful means.
  category: speech
  evidence_refs:
  - ev:9
