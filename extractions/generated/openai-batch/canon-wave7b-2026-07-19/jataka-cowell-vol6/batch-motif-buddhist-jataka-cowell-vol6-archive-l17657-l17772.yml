canonical_text:
  quote: '"a greater gift than children cannot be"'
  summary: Vessantara thinks Maddi has died, revives her with water, and tells her
    that he has given their children to a brahmin. He explains the gift as supreme
    giving, and Maddi approves and rejoices. Miraculous earth-rumbling, lightning,
    thunder, and rejoicing among divine beings are recounted. Sakka then plans to
    assume a brahmin form, ask for Maddi in order to complete Vessantara's perfection
    and protect her from another claimant, and restore her afterward. At dawn Sakka
    arrives in brahmin form, and Vessantara welcomes him with hospitality, food, and
    water from a cave.
  language: English
  quote_policy: quoted
