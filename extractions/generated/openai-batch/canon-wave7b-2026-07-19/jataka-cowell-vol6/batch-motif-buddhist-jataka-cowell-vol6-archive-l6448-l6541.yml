canonical_text:
  quote: ''
  summary: Sudassana publicly challenges Alambana’s snake display, summons Accimukhi
    from his matted locks, receives three drops of her poison, and warns that it cannot
    safely be dropped on earth, in the sky, or in water. At the king’s request he
    directs three holes to be dug and neutralizes the poison there; its heat afflicts
    Alambayana, who vows to free the snake-king, after which the Bodhisatta emerges
    radiant from a jeweled basket.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sudassana mocks Alambana’s snakes as harmless and says that, if people knew
    his real worth, he would receive only a little meal rather than gold.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Alambana becomes angry, insults Sudassana, and says that his snake’s bite
    would reduce Sudassana to dust.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Both Alambana and Sudassana refer to a teaching attributed to holy saints
    that those who give alms go to heaven after death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sudassana identifies his own snake as Accimukhi, daughter of the Naga king
    and his half-sister, with a flame-shooting mouth and deadly poison.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: When called, Accimukhi comes out of Sudassana’s matted locks, cries three
    times like a frog, sits on his shoulder, drops three drops of poison onto his
    palm, and returns into his locks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sudassana holds the poison and repeatedly declares that the country will be
    destroyed, with the sound reaching all Benares.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Sudassana says the poison cannot be dropped on the ground, thrown into the
    sky, or dropped into water because each location would suffer destructive effects.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The king asks how to prevent the land from being destroyed and orders three
    holes to be dug after Sudassana instructs him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Sudassana fills the holes with drugs, cowdung, and heavenly medicines, then
    drops the poison into the middle hole.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A flame and smoke burst from the poisoned hole, spread to the other holes,
    consume their contents, and then become extinguished.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Alambayana is struck by the heat of the poison, loses the color of his skin,
    becomes a white leper, and declares three times that he will set the snake-king
    free.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Bodhisatta comes out of the jeweled basket, assumes a radiant ornamented
