canonical_text:
  quote: ''
  summary: A king interprets an earlier list of treasure clues, recognizing that references
    to the sun point to pacceka-buddhas whom the former king fed. With help from the
    ministers, he orders digging at named places and retrieves multiple hidden treasures
    from royal, threshold, water, and tree-shadow locations. After recovering sixteen
    treasures, he devotes the wealth to charity, builds alms halls, distributes alms,
    and honors his mother and a Brahmin from Kalacampa.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The listener hears the repeated list, understands its meaning, and postpones
    taking the treasure until the next day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: He asks the ministers whether their king fed pacceka-buddhas, and they answer
    yes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: He reasons that the word “sun” in the list does not mean the actual sun, because
    pacceka-buddhas are called suns by likeness.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the ministers identify where the former king met and later bade farewell
    to the pacceka-buddhas, he orders those places dug and treasure is drawn out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The great multitude rejoices and says that earlier people had dug toward the
    literal sunrise and sunset, while the newly found locations reveal the real riches.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Treasures are retrieved at the palace gate thresholds, at the mounting and
    dismounting places for the royal elephant, and around the royal couch.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Treasures are also retrieved near the royal elephant’s tusks, near the royal
    horse’s tail, from the drained royal lake, and beneath the shade-circle of sal-trees
    in the royal garden.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After sixteen treasures are brought out and no further treasure remains, the
    multitude is delighted.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The king says he will give the wealth to charity, has five alms halls erected,
    makes a great distribution, and then honors his mother and the Brahmin from Kalacampa.
  category: action
  evidence_refs:
  - ev:8
