canonical_text:
  quote: ''
  summary: Senaka and three associates scheme to estrange Mahosadha from the king
    by stealing royal objects and planting them in Mahosadha's house. Lady Amara detects
    the plot, records the deliveries, and later exposes the thieves before the king
    after Mahosadha has fled in disguise. The passage ends with a deity in the royal
    parasol noticing the absence of the Bodhisat's discourse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Senaka tells the other three that they are not enough for Mahosadha and that
    Mahosadha has a wife cleverer than himself; he proposes making a breach between
    Mahosadha and the king.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Senaka assigns the theft of a jewel from the royal crest to himself, a golden
    necklace to Pukkusa, a woollen robe to Kavinda, and a golden slipper to Devinda.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stolen objects are sent into Mahosadha's house hidden inside ordinary
    goods, including dates, jasmine flowers, vegetables, and straw.
  category: action
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:4
  text: Lady Amara notices that Senaka's slave-girl goes nowhere else, suspects a
    hidden purpose, searches the pot of dates, and finds the jewel.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Amara asks the slave-girl whose servant she is and records on a leaf the date,
    sender, item, and messenger information.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Amara receives the other three concealed royal objects, writes down the names
    and details on a leaf, and tells the Great Being about it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The four men tell the king that his ornaments are in Mahosadha's house and
    accuse Mahosadha of being the king's enemy.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The angry king refuses Mahosadha an audience and sends to seize him; Mahosadha
    then escapes the city in disguise and works in a potter's house in South Town.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After Mahosadha's departure, the four men each send a separate letter to Amara;
    she appoints times for them to come, has them shaven and humiliated, wraps them
    in matting, and sends word to the king.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Amara brings the four men and the four precious things to the king's courtyard,
    states that Mahosadha is not a thief, names the thieves, and points to the leaf
    record.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The king is perplexed and tells the four men to bathe and go home.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: A deity dwelling in the royal parasol notices that it no longer hears the
    Bodhisat's discourse and wonders about the cause.
  category: other
  evidence_refs:
  - ev:10
