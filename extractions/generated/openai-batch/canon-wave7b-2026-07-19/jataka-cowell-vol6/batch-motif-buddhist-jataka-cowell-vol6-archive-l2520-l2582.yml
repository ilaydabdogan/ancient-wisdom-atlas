canonical_text:
  quote: "“Do not grieve, I will support you.”"
  summary: An unnamed young ascetic leaves his forest abode, chooses to see the Buddha
    before visiting his parents, hears teaching on the virtues of parents, and decides
    to support his impoverished parents while remaining an ascetic. He recognizes
    and reunites with them, gives them gruel, food, alms, and rainy-season provisions,
    uses their worn garments himself, grows thin and pale, and is reported by fellow
    ascetics for giving offerings of the faithful to laypeople. The Master summons
    him and asks whether the report is true.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The young ascetic gives up his forest abode to an elder, travels by stages
    to the monastery near Jetavana, and reaches a place where one road leads to Jetavana
    and another to Savatthi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the fork in the roads, he decides to see the Buddha and hear the law before
    visiting his parents the next morning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Master sees the young man’s potentialities and teaches on the virtues
    of parents; the young man resolves to support his parents while still remaining
    an ascetic.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before visiting his parents, the young ascetic obtains gruel because he thinks
    it would be improper to approach them in poverty empty-handed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The parents initially do not recognize him; the mother tells him they have
    nothing to give, and the father asks whether the man could be her son.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the mother recognizes him, she falls at his feet and laments; the father
    joins the lamentation, and the young ascetic also weeps.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: He comforts his parents, promises to support them, gives them gruel and food,
    begs separately for his own meal, and lives nearby.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: From that day onward, he gives his parents the alms and rainy-season provisions
    he receives, begs separately for himself, and uses their worn garments after dyeing
    them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Because he often fails to obtain food for himself, his clothing becomes rough
    and he becomes pale and thin.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Friends and intimates say that giving offerings of the faithful to laypeople
    is unlawful, report him to the Master, and the Master summons him to ask whether
    the report is true.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
