  text: The charioteer continues digging a hole and says he has been sent to bury
    the king’s only son, who is described as crippled, dumb, and an idiot.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bodhisatta replies that he is not deaf, dumb, crippled, or lame, and warns
    that burying him in the wood would incur great guilt.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The charioteer stops digging, looks up, sees the Bodhisatta’s beauty, and
    questions whether he is a heavenly minstrel, a god, Sakka, or a man.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Bodhisatta identifies himself as the son of the King of Kasi and says
    the charioteer serves under that king.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Bodhisatta says he would not break even one branch of a tree that had
