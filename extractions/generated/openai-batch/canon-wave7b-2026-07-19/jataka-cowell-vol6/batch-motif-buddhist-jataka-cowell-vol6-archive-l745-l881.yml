  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The friendship verses state that one faithful to friends receives food, honour,
    safety from robbers and warriors, welcome at home, mutual respect, fame, brightness
    like fire, prosperity, protection in falls from high places, and the strength
    of a banyan tree against wind.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Sunanda recognizes the prince, falls at his feet with folded hands, and offers
    to take him back home to sit on the throne and act as king.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Great Being refuses the throne, wealth, friends, and kin, saying the throne
    could be won only by evil acts.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The charioteer says that the prince’s return would bring welcome, joy, and
    gifts from parents, royal wives, princes, Vesiyas, brahmans, soldiers, guards,
    country folk, and city folk.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Great Being says he was left forlorn by parents, city, town, and princes;
