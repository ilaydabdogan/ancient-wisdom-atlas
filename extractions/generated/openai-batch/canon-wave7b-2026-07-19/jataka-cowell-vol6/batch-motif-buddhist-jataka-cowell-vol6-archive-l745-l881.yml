canonical_text:
  quote: ''
  summary: A charioteer sent to bury the king’s supposedly crippled and dumb son digs
    a hole in the forest. The Bodhisatta speaks, denies the disability, identifies
    himself as the son of the King of Kasi, warns that burying him alive would bring
    guilt, and teaches about loyalty to friends using tree imagery and a series of
    verses. Sunanda recognizes him, offers to return him to the throne, but the Great
    Being refuses worldly power because it would be gained through evil acts, states
    that he has taken an ascetic vow in the forest, and declares that he has attained
    ripe holiness.
  language: English
  quote_policy: summarized
