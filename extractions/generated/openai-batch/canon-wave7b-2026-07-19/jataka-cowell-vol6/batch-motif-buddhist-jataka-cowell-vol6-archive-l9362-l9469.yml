canonical_text:
  quote: "“by thine own well-spoken words thou art set free”"
  summary: After hearing the Great Being’s teaching on the duties of a good man, Punnaka
    decides not to harm him and offers release. The sage instead asks to be taken
    to the Naga king, saying he fears no death because he has done no evil and must
    soften the king as he softened Punnaka. Punnaka carries him to the splendid Naga
    palace, where the Naga king asks about the sought heart; the sage answers fearlessly
    and questions the impermanent and causally obtained nature of the king’s palace
    and glory.
  language: English
  quote_policy: quoted
