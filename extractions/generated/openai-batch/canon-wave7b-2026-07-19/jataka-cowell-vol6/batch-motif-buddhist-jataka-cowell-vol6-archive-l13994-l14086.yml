canonical_text:
  quote: ''
  summary: Mahosadha comforts the king over the loss of Queen Nanda and his family,
    explains Vedeha's escape through a secretly made underground way, and shows the
    king a decorated illuminated tunnel. After the king and his forces enter, Mahosadha
    shuts the tunnel doors, terrifies the company with darkness, brandishes a hidden
    sword before the king, then declares that he seeks to display wisdom rather than
    kill. He and the king establish friendship, and Mahosadha opens the tunnel and
    releases the trapped company.
  language: English
  quote_policy: summarized
