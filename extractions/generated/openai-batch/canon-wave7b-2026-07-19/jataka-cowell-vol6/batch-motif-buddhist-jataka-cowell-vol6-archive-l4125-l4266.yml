canonical_text:
  quote: ''
  summary: Matali conducts the king past heavenly mansions and explains that their
    residents attained these delightful abodes through generosity, support of holy
    men, water-giving, and sabbath observance. Sakka sends a swift god to hasten Matali,
    who then shows many fiery mansions at once and proposes that they proceed to the
    king of the gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Matali drives on and shows the king another crystal mansion surrounded by
    fruit, flowers, and trees; the king asks what deeds produced such fortune.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A jeweled mansion is described as bright, elevated, supplied with food and
    drink, attended by women skilled in dance and song, and accompanied by rivers
    fringed with trees and flowers.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Matali says a mansion resident had been a householder at Mithila who gave
    parks and wells, drew water, fed tranquil saints, provided necessities, and kept
    specified sabbath days.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Matali gives a similar explanation for a mansion resident who had been a Benares
    householder.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Matali shows a gold or fire-like mansion and explains that its resident had
    been a Savatthi householder who performed the same kinds of good conduct.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sakka, king of the gods, sends another swift god with a message because Matali
    is delayed.
  category: action
  evidence_refs:
  - ev:7
