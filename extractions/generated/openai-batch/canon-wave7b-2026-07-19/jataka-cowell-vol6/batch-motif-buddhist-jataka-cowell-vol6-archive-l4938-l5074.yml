canonical_text:
  quote: I sacrifice my son, because I wish to go to heaven, not hell.
  summary: In this Khandahala-Jataka passage, the royal family laments as the king
    prepares to sacrifice his son or sons. The mother appeals to the prince's wives,
    curses the priest Khandahala, and mourns. The Bodhisatta pleads from the sacrificial
    pit and takes leave of his mother. Canda, the chief queen, laments, asks to die
    first or together with the doomed prince, threatens poison, and offers herself
    instead. The passage emphasizes ritual adornment, the sacrificial pit and pile,
    the sword, and the king's claim that the sacrifice is meant to secure heaven.
  language: English
  quote_policy: quoted
