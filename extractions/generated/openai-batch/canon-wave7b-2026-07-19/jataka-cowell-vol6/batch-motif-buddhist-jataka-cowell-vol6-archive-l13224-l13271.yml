canonical_text:
  quote: ''
  summary: Agents connected with Mahosadha’s preparations seize houses in the city
    and receive large bribes to spare them. Mahosadha reports to the king that an
    outside site between the city and the Ganges is preferable, obtains restrictions
    against local access and permission for his elephants to use the water, then leaves
    the city, establishes a settlement across the river for animals and vehicles,
    assigns construction tasks, and begins making a great tunnel with its mouth on
    the Ganges bank.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A householder identified as the queen-mother asks why her house is being pulled
    down and pays one hundred thousand pieces of money so the house will be left alone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kevatta is unable to enter the palace after going to the palace gate and also
    pays one hundred thousand pieces.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: By seizing houses in different parts of the city and receiving bribes, the
    agents obtain nine crores of gold pieces.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mahosadha traverses the city, returns to the palace, and tells the king that
    the residents are willing to give places but become grief-stricken when possession
    is taken.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mahosadha proposes a building place outside the city, about a mile away, between
    the city and the Ganges.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The king thinks that fighting outside the city would make it easier to distinguish
    friend from foe and to kill the opposing party.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mahosadha asks that the king’s people be forbidden from entering the construction
    area for firewood, herbs, or similar things, saying this could cause a quarrel.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Mahosadha says his elephants like to play in the water and asks the king to
    tolerate complaints if the water becomes muddy.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The king proclaims by beat of drum that anyone going to the place where Mahosadha
    is building will be fined a thousand pieces.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Mahosadha goes out of the city with attendants and begins building a city
    on the set-apart spot.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: On the other side of the Ganges, Mahosadha builds a village called Gaggali
    and stations elephants, horses, chariots, cattle, and oxen there.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: After assigning work, Mahosadha begins making a great tunnel whose mouth is
    on the Ganges bank.
  category: action
  evidence_refs:
  - ev:10
