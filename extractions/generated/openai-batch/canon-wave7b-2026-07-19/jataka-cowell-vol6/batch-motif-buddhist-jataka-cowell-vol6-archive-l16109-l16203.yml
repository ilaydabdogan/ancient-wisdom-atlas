canonical_text:
  quote: ''
  summary: The passage describes directions through a mountain and forest landscape
    to a hermitage site; Vessantara travels there with Maddi and their children. Sakka
    sees that the Great Being has entered Himavat and orders Vissakamma to prepare
    hermitages. Vessantara and his family adopt ascetic dress and dwell as hermits,
    with Maddi gathering fruits and Vessantara requesting observance of chastity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The princes describe a route through Mount Vipula, the Ketumati river, a fruit-bearing
    banyan, Mount Nalika, Mucalinda Lake, a thick forest, cataracts, and a foursquare
    lake where a leafy cell can be built to the north.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The route is repeatedly described with shade, trees, fruit, birds, fish, lilies,
    water for drinking and bathing, and safe resort.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The princes appoint a wise and skilful man of their country to watch Vessantara’s
    goings and comings at the forest entrance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vessantara travels with his wife and children, rests at the Ketumati, bathes
    and drinks there, gives the guide a golden hairpin, eats banyan fruit, and continues
    through the named route to the foursquare lake.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sakka sees that the Great Being has entered Himavat and commands Vissakamma
    to build a hermitage in the dells of Mount Vamka.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Vissakamma makes two hermitages with covered walks, rooms for night and day,
    flowering trees, banana clumps, necessary items for hermits, and an inscription
    for anyone wishing to be a hermit.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Vissakamma drives away unhuman creatures and harsh-voiced beasts and birds
    from the hermitage area.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Vessantara enters the hermitage, sets aside his bow, sword, and garments,
    dons hermit garb, takes up a staff, and walks in the covered walk.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Maddi and the two children also enter the hermitage life and don ascetic dress.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Maddi asks to gather wild fruits while Vessantara remains with the children,
    and she thereafter feeds the three of them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Vessantara tells Maddi that they are now hermits and asks her not to approach
    him unseasonably; she consents.
  category: speech
  evidence_refs:
  - ev:6
