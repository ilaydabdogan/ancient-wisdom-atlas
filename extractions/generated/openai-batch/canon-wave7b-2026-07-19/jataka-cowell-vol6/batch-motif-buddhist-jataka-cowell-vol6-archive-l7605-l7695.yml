canonical_text:
  quote: ''
  summary: Princess Ruja teaches her father the king against false doctrine, urging
    belief in this world, another world, and consequences for good and evil action.
    Unable to convince him, she prays with joined hands toward the ten directions,
    invoking righteous ascetics, deities, and Brahma deities to help. The Bodhisatta
    Narada, then a Great Brahma, sees her, assumes a radiant ascetic human form, descends
    from the Brahma-world, and stands in the sky before the king. The king questions
    him about his origin, identity, miracle, and the recompense of good actions.
  language: English
  quote_policy: summarized
