canonical_text:
  quote: ''
  summary: An unnamed host believes the brahmin, entertains him, and points out the
    road to Vessantara. The host describes a lush route with green grass, fruit trees,
    fragrant streams, lakes filled with lilies, Lake Mucalinda, abundant flowers,
    plants, animals, and birds. He says the footpath leads to Vessantara's settling-ground,
    where hunger and thirst are absent, and where Vessantara lives with his children
    as an ascetic tending the fire. The brahmin respectfully goes on to seek Vessantara.
  language: English
