canonical_text:
  quote: ''
  summary: A dialogue of riddling statements occurs between Amara and the Great Being.
    He interprets her name, her reference to the “god of old time,” her father’s work
    and location, and her conditional return in practical terms. Amara offers him
    gruel with proper washing-water, explains the scant rice by lack of water in the
    field, and gives him cryptic directions to her house by a secret path. He reaches
    the house, is received by Amara’s mother, observes their poverty, offers tailoring
    without payment, mends old clothes, earns money, and is fed by the household.
  language: English
  quote_policy: summarized
