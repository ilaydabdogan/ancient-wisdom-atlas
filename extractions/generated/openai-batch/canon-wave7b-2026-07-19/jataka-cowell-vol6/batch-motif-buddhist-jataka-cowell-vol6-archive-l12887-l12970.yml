canonical_text:
  quote: "“In love there is no unlikeness.”"
  summary: A male bird conceals his origin, claims to have been sent by King Sivi,
    and fabricates a story of a former maynah wife killed by a hawk in order to win
    the trust of a female maynah. He proposes union with her and argues against species
    and status barriers by citing examples of cross-boundary love, including Jambavati
    and Vasudeva and Rathavati and Vaccha.
  language: English
  quote_policy: quoted
