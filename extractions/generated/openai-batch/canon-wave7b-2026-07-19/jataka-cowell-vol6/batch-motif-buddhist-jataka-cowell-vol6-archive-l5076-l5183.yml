canonical_text:
  quote: ''
  summary: At the sacrificial pit Khandahala prepares to cut the prince's neck. Queen
    Canda/Cauda performs a solemn truth-asseveration and calls on spirits and gods
    for help. Sakka hears her cry, descends with a blazing mass of iron, frightens
    the king, forbids the killing, and disperses the assembly. The victims are released,
    Khandahala is killed by the crowd, the king is spared but exiled as an outcast,
    and those complicit in the sacrifice go to hell. Prince Canda/Cauda is anointed
    king, peace follows, and the Bodhisatta later provides for his exiled father.
    The Master then identifies the figures of the story with figures in the Buddhist
    present, including Khandahala with Devadatta and Candaraja with himself.
  language: English
  quote_policy: summarized
