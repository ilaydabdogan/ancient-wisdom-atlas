canonical_text:
  quote: ''
  summary: The Great Being, also called the foster-king or king of Sivi, gives his
    children Jali and Kanha/Kanhajina to the brahmin Jujaka as a precious gift while
    praying for omniscience. He pours water from a waterpot to mark the gift, and
    the earth shakes. Jujaka binds the children with a creeper, beats and drives them
    away, but they briefly escape and plead with their father to wait for their absent
    mother. Jali describes the brahmin fearfully and laments the loss of his parents.
  language: English
  quote_policy: summarized
