    the chameleon's gift.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Pinguttara comes from Mithila to Takkasila, studies under a famous teacher,
    completes his education, and is given the teacher's daughter according to the
    teacher's family custom.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage describes Pinguttara as unfortunate and unlucky, while the girl
