- id: obs:2
  text: On a fast day when no killing occurs, the appointed man cannot find meat and
    ties a half-anna coin on a thread around the chameleon's neck.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chameleon becomes proud because of the coin, remains on the archway, and
    does not come down as usual when the king approaches.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mahosadha explains that the chameleon has gained a half-anna piece and therefore
