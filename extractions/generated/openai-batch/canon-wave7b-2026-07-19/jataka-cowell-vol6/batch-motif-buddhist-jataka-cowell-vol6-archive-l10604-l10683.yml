  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Near Mithila, Pinguttara climbs a fruiting fig-tree and eats figs; when the
    girl asks him to throw fruit down, he tells her to climb and get it herself.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the girl climbs the fig-tree, Pinguttara descends quickly, piles thorns
