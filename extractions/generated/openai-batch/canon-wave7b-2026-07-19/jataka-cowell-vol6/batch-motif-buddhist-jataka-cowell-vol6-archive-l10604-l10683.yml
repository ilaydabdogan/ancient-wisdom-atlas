canonical_text:
  quote: ''
  summary: The passage first tells how a king orders a regular meat reward for a chameleon;
    on a fast day a coin is tied around the animal's neck instead, causing it to act
    proudly until Mahosadha explains the cause. The passage then begins the story
    of Pinguttara, who is married to his teacher's lucky daughter, avoids her, abandons
    her in a fruiting fig-tree surrounded by thorns, and leaves. The king later discovers
    her, has her brought to the palace, consecrates her as queen, and names her Udumbara,
    Queen Fig, because she was first seen in the fig-tree.
  language: English
  quote_policy: summarized
