canonical_text:
  quote: ''
  summary: A king has a barber preserve a white hair, rewards the barber, installs
    his son as king, and renounces the world. He gives grey hairs as the reason for
    renunciation, follows former kings to the same mango grove, develops the Four
    Excellencies, and is destined for Brahma's heaven. The Master summarizes King
    Nimi's sacrifice and self-control, notes that Kalara-janaka also renounced, and
    identifies the figures of the birth story with Anuruddha, Ananda, the Buddha's
    followers, and himself.
  language: English
  quote_policy: summarized
