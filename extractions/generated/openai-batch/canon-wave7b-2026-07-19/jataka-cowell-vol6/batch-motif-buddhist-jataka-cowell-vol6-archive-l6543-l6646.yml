canonical_text:
  quote: ''
  summary: The passage describes a kinship reunion at a palace, the nephews' return
    to the Naga-world, Bhuridatta's illness after captivity, and Subhaga's encounter
    with the outcast Brahmin at the Yamuna. The Brahmin attempts to wash away guilt
    for betraying Bhuridatta for a jewel or gem-charm; Subhaga recognizes him, drags
    him under the water with his tail, identifies himself as the son of a serpent-king,
    and recalls the Brahmin's earlier wrongs before refusing to spare him.
  language: English
  quote_policy: summarized
