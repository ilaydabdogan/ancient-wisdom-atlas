canonical_text:
  quote: ''
  summary: At Kapilavatthu in the Banyan Grove, the Buddha is received by the Sakiyas,
    who initially withhold obeisance because of kinship pride. He rises into the air
    and performs a miracle, after which the king and all the Sakiyas bow. A great
    red, noisy rain then falls, wetting only those who wish to be wet. The Buddha
    says such rain has fallen on his kinsfolk before and begins a story of the past.
  language: English
  quote_policy: summarized
