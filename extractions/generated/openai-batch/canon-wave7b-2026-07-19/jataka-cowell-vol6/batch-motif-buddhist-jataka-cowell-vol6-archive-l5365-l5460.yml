canonical_text:
  quote: ''
  summary: A tortoise messenger defends his fitness for an errand and tells the Naga
    king Dhatarattha that a human king wishes to give his daughter Samuddaja in marriage
    to him. Dhatarattha sends four Naga youths with the tortoise. The tortoise escapes
    at a lotus pond by a ruse. The Naga youths, in human guise, request Samuddaja
    from the human king, offering jewels, but the king refuses a marriage with a Naga
    king and cites his daughter’s lineage. The Naga youths threaten him, refrain from
    killing him, report back angrily, and rouse Dhatarattha, who orders Nagas to occupy
    Benares without harming anyone, terrifying the city with a serpent siege.
  language: English
  quote_policy: summarized
