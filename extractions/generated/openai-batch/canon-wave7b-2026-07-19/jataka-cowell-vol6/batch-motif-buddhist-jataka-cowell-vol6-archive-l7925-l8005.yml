canonical_text:
  quote: '"The Master told this tale while dwelling in Jetavana, concerning the Perfection
    of Wisdom."'
  summary: The frame praises the Master's wisdom and introduces a former-birth story
    in which wisdom subdues an opponent. The past narrative names Vidhurapandita as
    a law-teaching minister, describes four Brahmin ascetics and their lay attendants,
    recounts visits to several realms, and links meritorious acts with rebirth as
    Sakka, a Naga-world being, a Supanna king, and a Koravya prince. The passage ends
    during an account of rulers undertaking fast observances in a garden.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Brethren discuss the Master's wisdom, saying he can overthrow opponents'
    questions, establish people in the refuges and moral precepts, and set them on
    the path to immortality.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master says that in an earlier age, on the summit of the Black Mountain,
    he converted and silenced the Yakkha general Punnaka by wisdom and made him give
    his own life as a gift.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Kuru kingdom at Indapatta, a king named Dhananjaya-korabba has a minister
    named Vidhurapandita, who instructs on temporal and spiritual matters and teaches
    the law eloquently.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Four rich Brahmin householders from Benares see the misery of desires, go
    to the Himalaya, become ascetics, attain transcendental faculties and mystical
    meditations, and live on roots and fruits.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Four householders in Kalacampa honor the ascetics, take their begging vessels,
    feed them, and arrange a home for them in their garden.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The four ascetics spend their days respectively in the heaven of the Thirty-three,
    the Naga world, the Supanna world, and the park of the Koravya king, then describe
    the glory of those places to their attendants.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The four attendants desire the abodes described by the ascetics, perform gifts
    and other meritorious works, and after death are reborn as Sakka, in the Naga
    world with wife and child, as the Supanna king, and as a Koravya prince; the four
    ascetics are born in the Brahma world.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Koravya prince grows up, succeeds his father, rules righteously, is skilled
    in dice, listens to Vidhurapandita, gives alms, keeps the moral law, and observes
    the fast.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Koravya king, Sakka, and Varuna the Naga king each undertake the fast
    and perform ascetic duties in a garden; Sakka and Varuna come there because of
    obstacles in their own worlds.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A footnote in the passage compares the simile of kings being fascinated by
    Vidhura's discourses as elephants by a lute with the Kathasaritsagara.
  category: other
  evidence_refs:
  - ev:10
