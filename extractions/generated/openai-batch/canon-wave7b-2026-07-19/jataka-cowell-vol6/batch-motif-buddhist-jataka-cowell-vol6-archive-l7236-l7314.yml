canonical_text:
  quote: ''
  summary: 'At King Angati''s court, advisers offer competing counsel: Alata urges
    conquest, Sunama urges festival pleasure, and Vijaya urges consultation with a
    learned ascetic or Brahmin. The king chooses inquiry and is directed to Guna Kassapa,
    a naked ascetic in the deer-park. The king travels there in a splendid white chariot,
    greets Guna, and asks questions about lawful conduct toward family, teachers,
    religious figures, the army, and the country, and about heaven and hell. The narrator
    then states that, lacking a true enlightened guide, the king has asked these questions
    of an ignorant mendicant who will teach false doctrine.'
  language: English
  quote_policy: summarized
