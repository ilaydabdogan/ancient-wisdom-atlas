canonical_text:
  quote: "“Happiness truly comes by living with the wise.”"
  summary: After being left in Kampilliya, the Great Being explains that he escaped
    by strategy and returned safely with gifts from King Cūlani. King Vedeha and Senaka
    praise Mahosadha for freeing them from enemies, and Vedeha orders a seven-day
    festival in his honor. Afterward the Great Being arranges the respectful return
    of King Cūlani’s mother, Queen Nanda, and Pañcālacanda, leading to reciprocal
    gifts and friendship between the kings.
  language: English
  quote_policy: quoted
