canonical_text:
  quote: Mithila's palaces may burn, but naught of mine is burned thereby
  summary: Queen Sivali and the royal women try to stop the Bodhisatta king from leaving
    palace and kingdom for an ascetic life. They plead, mourn, stage fires and apparent
    devastation, and urge him to return; he persists in his vow and declares that
    one who has nothing owns nothing that can be burned or harmed.
  language: English
  quote_policy: quoted
