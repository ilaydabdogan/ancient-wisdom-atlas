canonical_text:
  quote: ''
  summary: A king reports a troubling dream. Pandit Senaka interprets it as auspicious,
    foretelling the birth of a fifth sage who will surpass the four existing sages.
    In the East town of Mithila, the Great Being descends from the heaven of the Thirty-three
    and is conceived in Sumanadevi's womb, while many other sons of gods are also
    conceived in merchant families. At birth the child is golden, painless to his
    mother, receives a medicinal herb from Sakka, speaks to his mother, and directs
    that the medicine be given to the sick. Sirivaddhaka uses it and is cured of a
    seven-year headache; news spreads and the sick come to request the medicine.
  language: English
  quote_policy: summarized
