canonical_text:
  quote: ''
  summary: Maddi argues that widowhood is unbearable and declares that she will accompany
    her husband Vessantara into banishment. The king urges her to leave the two young
    sons behind because they are used to royal luxury and would suffer in the forest,
    but Maddi insists that Jali and Kanhajina will go with her. At dawn the family
    departs in a four-horse chariot toward Vaihka's peak after reverencing the parents
    and bidding farewell to the crowd. Vessantara exhorts the people to give alms
    and gives away ornaments and precious things to beggars on the road.
  language: English
  quote_policy: summarized
