canonical_text:
  quote: ''
  summary: In the Naga-world, Kanarittha/Arittha prevents Subhaga from harming a Brahmin
    and delivers a long defense of Brahmins, Vedas, sacrifice, gifts, and heavenly
    rewards. The Nagas risk accepting his account as true, but the Bodhisatta rises
    from his sick-bed, gathers the assembly, and declares Arittha's teaching false,
    especially the claim that Vedic victim sacrifice leads to heaven.
  language: English
  quote_policy: summarized
