canonical_text:
  quote: In this world there is no protection like the truth ; [285] one must speak
    the truth.
  summary: Punnaka tests Vidhura in the king's court by asking whether he is the king's
    slave or kinsman. Vidhura chooses to speak truthfully, declares that he is a slave
    from birth and may be given by the king, and thereby enables Punnaka to claim
    victory. The king gives Vidhura to Punnaka, but first asks Vidhura to teach on
    householder life. Vidhura teaches moral restraint, generosity, reverence for the
    learned, and truthfulness as a path to welfare here and in the next world. Punnaka
    then calls for departure, and Vidhura asks to host him for three days while exhorting
    his sons.
  language: English
  quote_policy: quoted
