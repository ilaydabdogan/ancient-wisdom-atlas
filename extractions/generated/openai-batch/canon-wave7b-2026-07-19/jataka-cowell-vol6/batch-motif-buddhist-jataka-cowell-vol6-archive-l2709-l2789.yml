canonical_text:
  quote: ''
  summary: Sama discovers that his parents have lost their sight after sheltering
    near tree roots and an ant-hill, infers that a snake's poisonous breath caused
    it, and vows to care for them. He establishes a daily routine of service in the
    forest hermitage. King Piliyakkha, hunting deer in Himavat, sees Sama at the Migasammata
    river, wonders whether he is a god or a naga, and shoots him with a poisoned arrow
    in order to question him. Wounded, Sama keeps the water-jar steady, lies facing
    his parents' hut, and declares that he has no enemies.
  language: English
  quote_policy: summarized
