canonical_text:
  quote: ''
  summary: King Culani falsely promises immediate action, instead musters the hundred
    and one kings and their hosts for battle, leaving his royal family in the palace.
    The Bodhisat hosts King Vedeha's army while Culani surrounds the city with armed
    forces and many torches. The Bodhisat orders three hundred warriors to enter by
    a smaller tunnel, remove Culani's mother, consort, son, and daughter through the
    great tunnel, and keep them safe there. The warriors infiltrate the palace, bind
    and gag guards, deceive the royal family with a false report of victory, lead
    them into the tunnel, plunder the treasury, and lodge the four in a chamber near
    the river. When informed, the Bodhisat is pleased. King Vedeha, expecting the
    sending of a daughter, sees the city surrounded by lights and troops and becomes
    fearful.
  language: English
  quote_policy: summarized
