canonical_text:
  quote: ''
  summary: A garula bird captures a Naga king near the southern ocean, inadvertently
    tears up an ascetic's banyan tree when the Naga grips it, kills the Naga, and
    consults the ascetic in disguise about karmic fault. The ascetic judges that ignorance
    and lack of harmful intent mean no demerit. The garula rewards him with the Alambayana
    spell and its simples; later the ascetic transmits the spell and its method to
    an indebted Brahmin who has come to serve at the hermitage.
  language: English
  quote_policy: summarized
