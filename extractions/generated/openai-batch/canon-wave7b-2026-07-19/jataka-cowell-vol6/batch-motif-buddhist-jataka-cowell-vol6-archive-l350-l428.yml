canonical_text:
  quote: ''
  summary: A childless king of Benares and his chief queen Candadevi seek a son. Candadevi
    undertakes full-moon Uposatha vows and makes an Act of Truth; her piety draws
    Sakka's attention. Sakka asks the Bodhisatta, then in a divine realm after previous
    births in Benares, hell, and the world of the thirty-three gods, to be born as
    Candadevi's son for the benefit of humankind. The Bodhisatta consents, is conceived
    with five hundred attending deities who are born as young nobles, and is born
    with auspicious marks. Brahmans read his marks as signs of universal royal capacity,
    and he is named Temiya-kumaro because rain fell over Kasi at his birth and he
    was born wet.
  language: English
  quote_policy: summarized
