    a noble steed through the sky.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The king embraces Vidhura, seats him on a throne, and asks how the young man
    let him go.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Vidhura explains that Punnaka is the Yakkha minister of King Kuvera, loves
