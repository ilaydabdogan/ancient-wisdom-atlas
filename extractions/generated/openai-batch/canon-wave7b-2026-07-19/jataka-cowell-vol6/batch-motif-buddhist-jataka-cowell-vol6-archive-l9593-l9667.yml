  text: Punnaka points out Indapatta, its mango groves, and says that he has obtained
    a wife while Vidhura has obtained his home.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king dreams of a great tree at the palace door with a trunk of wisdom,
    branches like virtues, fruits identified as sacred cow-products, and elephants
    and horses upon it, worshipped by a multitude.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the dream, a black man in red clothing and red flower earrings, carrying
