canonical_text:
  quote: '"there stood a great tree whose trunk was wisdom"'
  summary: Punnaka, having won the Naga maiden Irandati, promises Vidhura a jewel
    and return to the Kurus, then carries him swiftly to Indapatta. The king has dreamed
    of a wisdom-tree being cut down and replanted, interprets it as Vidhura's removal
    and return, prepares the Hall of Truth, and receives the sage. Vidhura explains
    that Punnaka is a Yakkha minister of Kuvera who sought Vidhura's death in order
    to obtain Irandati, daughter of the Naga king Varuna, but released him after obtaining
    his wife and the jewel.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Punnaka says Vidhura has made him possessed of a wife and promises to give
    him a jewel and restore him to the Kurus.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vidhura blesses Punnaka's friendship with his wife and asks him to give the
    jewel and carry him to Indapatta.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Punnaka places Vidhura on a seat before him and carries him to Indapatta with
    speed described as swifter than thought.
  category: action
  evidence_refs:
  - ev:2
