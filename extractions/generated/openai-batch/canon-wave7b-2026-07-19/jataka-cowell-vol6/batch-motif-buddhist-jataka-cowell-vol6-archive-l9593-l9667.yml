    it in its old place.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king interprets the great tree as Vidhura and the tree-cutter as the youth
    who carried Vidhura away, and expects Vidhura to be restored at the Hall of Truth.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The king orders the city decorated, the Hall of Truth prepared, and reassures
