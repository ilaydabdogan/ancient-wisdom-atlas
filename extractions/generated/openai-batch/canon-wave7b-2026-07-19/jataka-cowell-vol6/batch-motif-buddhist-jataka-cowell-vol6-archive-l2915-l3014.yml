canonical_text:
  quote: ''
  summary: After Sama is wounded by a poisoned arrow, the king repents and vows to
    care for Sama's blind parents in his place. Sama directs him to their hut and
    makes a final respectful request before becoming unconscious as if dead. The king
    laments his guilt, mortality, and expected hell. A goddess named Bahusodari, a
    former mother of Sama, sees the crisis from Gandhamadana mountain and decides
    to intervene invisibly, foreseeing that a solemn asseveration will overcome the
    poison, restore Sama's life, restore his parents' sight, and turn the king toward
    charity and heaven.
  language: English
  quote_policy: summarized
