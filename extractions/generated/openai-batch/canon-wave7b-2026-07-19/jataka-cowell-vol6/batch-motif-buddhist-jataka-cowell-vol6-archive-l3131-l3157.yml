canonical_text:
  quote: ''
  summary: Two mourners lament the Bodhisatta/Sama. The king tries to console them
    and offers to serve and nurse them in the lonely wood, gathering food for them.
    They refuse, saying he is their lord and rightful king. The king is glad that
    they do not rebuke him despite his sin, and he calls one a father and the other
    a mother to him.
