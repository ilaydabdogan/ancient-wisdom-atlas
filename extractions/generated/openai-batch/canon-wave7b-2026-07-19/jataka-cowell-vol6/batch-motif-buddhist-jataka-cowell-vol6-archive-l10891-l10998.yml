canonical_text:
  quote: '"yet there might be friendship betwixt ram and dog."'
  summary: A king tests named wise men with a riddle about friendship and exchanged
    food between a ram and a dog. Mahosadha explains the event, the king rewards all
    five men, and Queen Udumbara later points out that the others learned the answer
    from Mahosadha. The king then poses a question about whether wisdom without wealth
    or wealth without wisdom is better; Senaka favors wealth, while Mahosadha favors
    wisdom on moral grounds.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Senaka, Pukkusa, Kavinda, and Devinda each recite animal-riddle stanzas about
    possible friendship between a ram and a dog, but the narrative states that they
    do not understand the matter.
  category: speech
  evidence_refs:
  - ev:1
