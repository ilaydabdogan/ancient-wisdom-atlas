  text: The king believes the reciters understand the riddle because he himself has
    seen the incident referred to in it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mahosadha states that he can understand the question and explains that the
    king saw a ram and a dog exchanging food.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The explained exchange involves meat and grass being brought by one animal
    for the other.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king praises the five men as wise and gives each a chariot, a she-mule,
    and a rich village.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Queen Udumbara says the four other men got their knowledge through the sage
    and argues that Mahosadha should receive a special distinction.
