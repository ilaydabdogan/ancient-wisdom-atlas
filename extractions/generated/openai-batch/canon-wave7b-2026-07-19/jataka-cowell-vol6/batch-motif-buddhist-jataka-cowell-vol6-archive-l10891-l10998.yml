  evidence_refs:
  - ev:4
- id: obs:7
  text: The queen says Mahosadha taught the others so that they would not be ruined
    through him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king is pleased that Mahosadha did not disclose that the others learned
    through him, and he plans to ask Mahosadha another question before giving him
    a great reward.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The king asks whether clever men call better a person endowed with wisdom
    but without wealth, or a wealthy person without wisdom.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Senaka answers that the wealthy person is better, saying that wise and foolish,
