canonical_text:
  quote: ''
  summary: Kevatta proposes a non-military “Battle of the Law” in which the sages
    of two kings meet and the one who salutes the other is counted defeated. The Bodhisat
    Mahosadha learns of the plan, arranges the contest at the western gate, obtains
    an eight-sided gem from King Vedeha, and approaches the gate with a large retinue
    while Kevatta waits in the sun under guard of the hundred and one princes.
