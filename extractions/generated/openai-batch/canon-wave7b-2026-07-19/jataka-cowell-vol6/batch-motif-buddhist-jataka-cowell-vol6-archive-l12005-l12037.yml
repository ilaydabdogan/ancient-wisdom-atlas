canonical_text:
  quote: ''
  summary: A sage called the Great Being sends a carefully provisioned parrot to learn
    why King Sarhkhapala is assembling an army. After finding out the matter, the
    parrot travels through India and reaches the city of Uttarapancala, where the
    brahmin Kevatta, adviser to King Culani-Brahmadatta, resolves to make his king
    chief ruler of all India. Kevatta asks the king for a private meeting in the park.
    The parrot hides in the leaves of the royal sal-tree and overhears Kevatta begin
    a secret plan intended only for the king.
  language: English
  quote_policy: summarized
