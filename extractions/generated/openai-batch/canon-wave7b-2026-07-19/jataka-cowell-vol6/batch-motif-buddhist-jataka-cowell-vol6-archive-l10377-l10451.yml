canonical_text:
  quote: ''
  summary: 'The king repeatedly tests the villagers, and indirectly the sage Mahosadha,
    with impossible demands: a rope made of sand, a movable tank filled with lilies,
    and a new park. Mahosadha instructs speakers to answer each demand with a counter-question
    or parallel absurdity, pleasing the king. Senaka delays the king from summoning
    Mahosadha out of jealousy. When the king sets out himself, his royal horse breaks
    its leg, and Senaka then proposes another test involving a message about sending
    a better horse or a more excellent one; Mahosadha recognizes that the king wishes
    to see him.'
  language: English
  quote_policy: summarized
