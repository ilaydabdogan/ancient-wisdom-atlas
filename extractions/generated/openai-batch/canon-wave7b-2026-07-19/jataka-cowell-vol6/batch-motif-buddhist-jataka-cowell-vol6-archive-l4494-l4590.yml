canonical_text:
  quote: ''
  summary: The passage introduces King Ekaraja of Pupphavati/Benares, his son Candakumara,
    and the brahmin Khandahala, a corrupt priest and judge. Candakumara corrects one
    of Khandahala's unjust judgments and is made judge, causing Khandahala to hate
    him. After the king dreams of the heaven of the Thirty-three gods and asks Khandahala
    for the road to heaven, Khandahala maliciously advises gifts and the killing of
    innocent royal and animal victims. The palace reacts with fear, and a sacrificial
    pit is prepared and fenced to prevent righteous interruption.
  language: English
  quote_policy: summarized
