canonical_text:
  quote: '"like a fish that has swallowed the hook"'
  summary: Kevatta proposes to lure King Vedeha by desire for King Culani's daughter,
    then kill him and Mahosadha. The king commissions poems and staged songs, including
    birds with bells, so people believe even gods praise the princess. Kevatta travels
    to Mithila with a present to fix a day under the appearance of friendship. The
    Great Being hears of the matter, seeks information through spies and the maynah
    bird, and screens the city so Kevatta cannot inspect it.
  language: English
  quote_policy: quoted
