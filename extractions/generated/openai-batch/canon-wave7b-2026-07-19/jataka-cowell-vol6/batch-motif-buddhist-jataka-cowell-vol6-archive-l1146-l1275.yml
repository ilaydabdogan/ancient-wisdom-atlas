canonical_text:
  quote: ''
  summary: A king visits the Bodhisatta prince in his forest hermitage. The Bodhisatta
    offers a leaf seat, water for foot-washing, and leaf food. The king, queen Candadevi,
    and royal ladies react to the austerity of his life. The king offers armies, palaces,
    women, kingship, and later the white umbrella, but the Bodhisatta refuses royal
    life and teaches on contentment, present-mindedness, old age, death, and the passing
    of time. The king is moved toward renunciation himself.
  language: English
  quote_policy: summarized
