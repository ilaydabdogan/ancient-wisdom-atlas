canonical_text:
  quote: "“Fear not, come hither.”"
  summary: 'The passage introduces the Khandahala-Jataka frame: Devadatta, after the
    killing of King Bimbisara, seeks Ajatasattu’s help to kill the Buddha. A chain
    of archers is arranged so that each returning assassin can be killed and the plot
    concealed. The first archer cannot shoot, confesses, is pardoned, hears the Truths,
    and attains the first grade of sanctification. The other archers likewise encounter
    the Buddha, are instructed, and are sent away by another road. They later embrace
    ascetic life and become arhats. The Brotherhood discusses the incident, and the
    Master says Devadatta has tried such violence before, leading into a story of
    the past.'
  language: English
  quote_policy: quoted
