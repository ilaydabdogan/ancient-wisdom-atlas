canonical_text:
  quote: ''
  summary: The passage describes punishments in hell involving a blood-covered tree,
    sword- and iron-leaf forests, and the boiling river Vetarani. The king, frightened
    by this description, asks Narada/the Great Being to teach him the path of purity
    so he may avoid hell. The Great Being gives examples of righteous kings, instructs
    the king in liberality and humane conduct, and then explains moral discipline
    through an extended chariot figure in which the body, mind, speech, restraint,
    wisdom, and other virtues are mapped onto parts and guidance of a chariot.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A suffering person climbs an infernal silk-cotton tree while bloodied, gashed,
    flayed, and described as expiating former crimes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lofty forests are described as having swords for leaves and iron knives that
    drink the blood of men; the climber is cut by these leaves.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: After escaping the hell of iron leaves, the sufferer falls into the river
    Vetarani, which is described as boiling and covered with iron lotuses and sharp
    leaves.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king hears the Great Being's description of hell, becomes bewildered and
    terrified, and addresses him as a refuge.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The king asks Narada to teach him the sacred text, its meaning, and the path
    of purity so that he will not fall into hell.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Great Being names former kings who served Brahmins and Samanas, followed
    righteousness, and went to Sakka's heaven.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Great Being instructs the king to have proclamations made offering food,
    drink, garlands, ointment, garments, umbrellas, and shoes to those in need.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Great Being tells the king not to put aged men, oxen, or horses to labor,
    but to give them due honor for past service.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Great Being instructs the king in the law under the figure of a chariot
    that brings every desire.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: In the chariot figure, the body is called a chariot, the mind or soul is the
    charioteer, and virtues such as non-injury, liberality, truthful speech, self-restraint,
    humility, righteousness, memory, firmness, and wisdom are mapped onto chariot
    parts or controls.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: The passage contrasts desire and lust as an evil path with self-control as
    the straight road, and says one who goes with the properly governed chariot will
    not go to hell.
  category: speech
  evidence_refs:
  - ev:10
