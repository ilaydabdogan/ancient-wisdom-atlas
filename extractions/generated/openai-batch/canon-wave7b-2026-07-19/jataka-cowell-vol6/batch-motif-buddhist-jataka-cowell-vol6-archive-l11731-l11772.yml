canonical_text:
  quote: ''
  summary: At evening in the palace, the sage suspects that a question has been used
    to test him and decides to investigate the four wise men. Knowing that they usually
    sit on a trough at the palace door, he hides beneath it. Meanwhile Senaka persuades
    the king to have the sage killed in the morning with the king's sword. The four
    wise men sit on the trough, discuss who will strike, and press Senaka to reveal
    his own secret. Senaka briefly suspects the sage may be beneath the trough, but
    his companions dismiss the idea. Senaka then confesses that he killed a harlot
    in a sal-grove for her ornaments and hid them at his house.
  language: English
  quote_policy: summarized
