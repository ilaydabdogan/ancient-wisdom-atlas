- id: obs:1
  text: The conversation occurs after sunset, when lamps have been lit, and the sage
    decides he must depart quickly because the ways of kings are uncertain.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sage reflects that four men had said a secret should be told respectively
    to a friend, a brother, a son, or a mother, and he resolves to find out what lies
    behind these statements.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The four men usually sit on a trough at the palace door and talk over their
    plans before going home.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sage has a rug spread beneath the trough, creeps under it, and tells his
    men to fetch him after the four wise men have finished talking and gone away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Senaka tells the king that the sage must be killed without delay and without
    telling anyone.
  category: speech
  evidence_refs:
