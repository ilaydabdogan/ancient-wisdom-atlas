- id: obs:6
  text: The king accepts the accusations without investigation, fears what to do,
    orders the killing at the door in the morning, and gives his own precious sword
    for the act.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The four wise men leave saying they have seen the back of their enemy, sit
    on the trough, and assign Senaka the task of striking the target.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Senaka asks whether the others' statements about whom to tell a secret were
    based on something done, seen, or heard; the others press him to reveal his own
    secret about telling a friend.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Senaka says his life would be forfeit if the king learned his secret, then
    taps on the trough and asks what if the target is underneath it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The companions dismiss the possibility that the target would hide under the
    trough and urge Senaka to speak.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Senaka says he lay with a harlot in the sal-grove, killed her to obtain her
    ornaments, took the ornaments home in a bundle, and hung them on an elephant's
    tusk.
  category: speech
  evidence_refs:
  - ev:6
