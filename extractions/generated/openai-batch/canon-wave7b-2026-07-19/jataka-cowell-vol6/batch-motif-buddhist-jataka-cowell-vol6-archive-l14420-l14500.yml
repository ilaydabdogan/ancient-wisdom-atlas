canonical_text:
  quote: ''
  summary: The passage first narrates Queen Talata arranging for a cook to save Prince
    Culani from the brahmin Chambhi by staging a kitchen fire with animal bones and
    taking the prince abroad under concealed identity. In Sagala, the king observes
    Culani's conduct and appearance, forces the cook to disclose the truth, and gives
    his daughter to Culani. The queen deceives Chambhi by presenting goat bones as
    the prince's remains. A later excerpt presents an ascetic questioning a king about
    why he would give his wife and younger brother to a water-demon; the king answers
    by naming their perceived faults.
  language: English
  quote_policy: summarized
