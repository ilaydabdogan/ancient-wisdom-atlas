- id: obs:2
  text: The queen's escape plan requires the cook to put animal bones where they sleep,
    set fire to the kitchen at night, and leave with Prince Culani and the cook's
    son for another country while concealing Culani's princely identity.
  category: sequence
  evidence_refs:
