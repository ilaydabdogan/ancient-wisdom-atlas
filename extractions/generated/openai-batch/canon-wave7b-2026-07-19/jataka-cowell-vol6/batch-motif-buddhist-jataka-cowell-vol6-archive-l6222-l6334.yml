canonical_text:
  quote: ''
  summary: Sudassana questions his distressed mother, who reports an evil dream in
    which a man cut off her arm and carried it away. She laments the disappearance
    of Bhuridatta. Bhuridatta's wives report that he has been absent for a month,
    and the household mourns. Arittha and Subhaga try to console their mother with
    the law of change and rebirth, but she threatens to die if Bhuridatta is not found.
    The brothers promise to search for him. Sudassana divides the search among the
    world of the gods, Himavat and its rivers, and the world of men, then disguises
    himself as an ascetic and departs.
  language: English
  quote_policy: summarized
