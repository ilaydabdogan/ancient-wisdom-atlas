canonical_text:
  quote: ''
  summary: A king sees armed forces and blazing torches and receives reassuring explanations
    from Senaka and Pukkusa. The Great Being, Mahosadha, deliberately frightens the
    king by warning of betrayal and imminent death, then reproaches him for ignoring
    wise counsel and pursuing a dangerous desire. The king asks for deliverance, but
    Mahosadha says human action is too late and contrasts this with impossible-seeming
    escape by magical flying beings or animals. Senaka then prepares to appeal to
    the sage.
  language: English
  quote_policy: summarized
