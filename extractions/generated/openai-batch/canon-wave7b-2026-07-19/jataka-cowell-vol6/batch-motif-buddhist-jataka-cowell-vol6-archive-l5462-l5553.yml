canonical_text:
  quote: ''
  summary: A human king, fearing death after threats connected with Dhatarattha, agrees
    to give his daughter Samuddaja to the Naga king. The Nagas create an adorned city,
    send gifts, and receive the princess, who is transported to the Naga-world while
    believing it to be a human realm. Dhatarattha forbids any display of snake-nature
    before her. Samuddaja bears four sons, including Datta, the Bodhisatta. Her son
    Arittha later reveals his serpent form while nursing, frightening her and causing
    her to injure his eye; she then learns she is among Nagas. The sons receive kingdoms.
    Datta regularly discusses difficult questions and, in the gods' assembly before
    Sakka, answers a question that none of the gods can answer; Sakka honors him and
    names him Bhuridatta.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king hears wailing, fears death because of threats, and three times says
    he will give his daughter Samuddaja to Dhatarattha.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Naga kings withdraw to a distance, establish a camp, build an adorned
    city described as like a city of the gods, and send a complimentary present.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king shows Samuddaja the adorned city, tells her she is to be chief queen
    there, has her washed and ornamented, places her in a covered carriage, and sends
    her with ministers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Naga kings meet Samuddaja with honor; the ministers hand her over and
    return with wealth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Samuddaja is placed on a divinely decked bed, and young Naga women attend
    her while assuming humpbacked and otherwise deformed appearances like human attendants.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Dhatarattha receives Samuddaja, vanishes with his host, and appears in the
    Naga-world, where she sees golden and jewelled palaces, gardens, and tanks.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Dhatarattha proclaims punishment for anyone who reveals signs of snake-nature
    to Samuddaja, so she lives with him thinking the place is a world of men.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Samuddaja bears four sons named Sudassana, Datta, Subhaga, and Arittha; Datta
    is identified as the Bodhisatta.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Arittha, having heard that his mother is a woman and not a Naga, decides to
    test her; while drinking at her breast he assumes serpent form and strikes the
    back of her foot with his tail.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Samuddaja cries out in terror, throws Arittha down, and injures his eye with
    her nail; Dhatarattha threatens him, but forgives him when Samuddaja pleads for
    her son.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the incident, Samuddaja learns that the place is the dwelling of the
    Nagas, and Arittha is thereafter called Kanarittha, or one-eyed Arittha.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The four princes grow up, and their father gives each a kingdom one hundred
    yojanas square; each is attended by sixteen thousand Naga maidens.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Bodhisatta visits his parents more often than his brothers, raises questions
    from the Naga realm, and discusses them with Virupakkha.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the gods' world before Sakka, a question arises that none can answer; the
    Great Being answers it, and Sakka honors him with divine flowers and fruits and
    names him Bhuridatta.
  category: sequence
  evidence_refs:
  - ev:8
