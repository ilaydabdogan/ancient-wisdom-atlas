canonical_text:
  quote: At such a time prosperity is of no use, but only one who is wise.
  summary: A courtier summons Mahosadha because a deity in the royal parasol has asked
    the king questions that the four wise men cannot solve. Mahosadha praises wisdom,
    returns from potter's work still mud-stained, and is tested by the king about
    loyalty. He answers with moral verses on righteousness, gratitude, friendship,
    and just kingship. The king seats him on the royal throne beneath the white parasol
    and asks him to solve the deity's questions, beginning with a riddle about one
    who strikes and yet is dearer than a husband.
  language: English
  quote_policy: quoted
