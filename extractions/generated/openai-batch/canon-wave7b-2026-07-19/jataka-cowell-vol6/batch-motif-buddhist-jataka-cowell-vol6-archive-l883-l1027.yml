canonical_text:
  quote: ''
  summary: Prince Temiya, called the Great Being, explains that he was not truly crippled,
    deaf, or dumb but feigned incapacity because he remembered a former birth as a
    king and the long hell-punishment that followed. Sunanda the charioteer asks to
    become an ascetic with him, but Temiya sends him back first with the chariot,
    horses, ornaments, and messages for his parents. Queen Candadevi sees the charioteer
    returning alone, fears her son has been slain, and laments. The charioteer receives
    her promise of pardon and reports that Temiya is alive, sound in body and mind,
    calm, free, and on the road to salvation.
  language: English
  quote_policy: summarized
