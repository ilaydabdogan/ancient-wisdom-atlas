canonical_text:
  quote: ''
  summary: Jujaka asks Vessantara for his children. Vessantara grants the request
    and proposes that Jujaka wait until the children's mother returns and prepares
    them. Jujaka refuses delay, argues that the mother may obstruct the gift, and
    insists on taking the children as servants for his wife. The children flee and
    hide in a lake beneath lily leaves. Vessantara searches for them and calls Jali
    and Kanhajina, saying they will fulfill his perfect state and be like a ship ferrying
    him over the sea of existence. Jali emerges and embraces his father's foot; Vessantara
    then calls Kanhajina.
  language: English
  quote_policy: summarized
