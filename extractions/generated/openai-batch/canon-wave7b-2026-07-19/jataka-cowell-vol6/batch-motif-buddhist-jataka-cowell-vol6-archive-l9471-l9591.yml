canonical_text:
  quote: '"this palace of mine was gained by my own virtuous deeds"'
  summary: A Naga king explains to the Great Being that his palace, splendor, and
    Naga birth resulted from former generosity in the human world. The Great Being
    teaches continued virtue and non-harm. The Naga king then brings the sage to Vimala,
    questions how Punnaka gained power over him, hears that he was fairly won at dice,
    and later grants Irandati to Punnaka while affirming that the sage's true heart
    is wisdom.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Naga king says his palace was not made by himself or given by gods, but
    was gained through his own virtuous deeds.
  category: speech
  evidence_refs:
