canonical_text:
  quote: '"Let who will take my skin or muscles or bones or blood"'
  summary: A Naga Bodhisatta, longing for birth among the gods after seeing Sakka's
    court, undertakes a fast outside the Naga realm near a banyan tree and ant-hill
    by the Yamuna. Naga maidens attend him at dawn with flowers, perfumes, music,
    song, and dance. A Brahmin hunter and his son spend the night in the banyan after
    killing a deer; at dawn the Brahmin sees the Naga attendants and the Bodhisatta's
    divine form, approaches, and the maidens sink into the earth.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Bodhisatta visits Sakka, sees the splendour of Sakka's court and heavenly
    nymphs, and longs for the heavenly world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: He decides to return to the snake-world and keep the fast and observances
    by which one may be born among the gods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: His parents permit him to keep the fast but tell him to keep it inside an
    empty palace in the Naga realm because there is danger for Nagas outside.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Snake maidens attend him with musical instruments in the empty palace, and
    he thinks their presence will prevent completion of the fast.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: He tells his wife that he will go to a banyan tree on the bank of the Yamuna,
    fold his body on an ant-hill, lie there, and have ten women bring him back at
    dawn with music, perfumes, flowers, song, and dance.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: He folds his body on the top of an ant-hill, offers his skin, muscles, bones,
    or blood to anyone who wants them, undertakes the fast with four divisions, and
    lies down in a body consisting only of a head and a tail.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At daybreak Naga girls come, adorn him as instructed, and conduct him back
    to the Naga abode; this practice continues for a long time.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A Brahmin living near Benares goes into the forest with his son Somadatta,
    uses snares, nets, and stakes, kills wild animals, sells the flesh, and lives
    by this work.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After failing to catch anything, the Brahmin wounds a deer by the Yamuna,
    follows it with his son, takes its flesh, and at sunset climbs the banyan tree
    to spend the night.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: At dawn Naga maidens come to the place and prepare a flowery couch for the
    Bodhisatta.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Bodhisatta lays aside his snake body, assumes a divine body adorned with
