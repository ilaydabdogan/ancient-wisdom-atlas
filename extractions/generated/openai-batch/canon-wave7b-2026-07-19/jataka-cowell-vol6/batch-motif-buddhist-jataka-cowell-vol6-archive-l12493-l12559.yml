canonical_text:
  quote: ''
  summary: 'During a siege, Kevatta advises a blockade to force the city to open its
    gate. The sage devises a counter-stratagem using Anukevatta: he is to appear to
    aid the enemy with food, be publicly punished and expelled as a traitor, gain
    Brahmadatta''s trust, misdirect the army toward dangerous parts of the moat, accuse
    the allies of bribery, and induce Brahmadatta to flee by night. Anukevatta agrees,
    asking only that his life and limbs be spared.'
  language: English
  quote_policy: summarized
