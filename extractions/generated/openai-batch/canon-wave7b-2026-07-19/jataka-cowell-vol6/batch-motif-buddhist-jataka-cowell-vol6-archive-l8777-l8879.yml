canonical_text:
  quote: ''
  summary: Punnaka agrees to remain three days at Vidhura's home so Vidhura can instruct
    his household before being taken away. Vidhura receives him with lavish palace
    hospitality, attendants, food, and music, then summons his wife, daughter-in-law,
    children, and kin. He embraces his sons, explains that he has been given to the
    young man and will be taken away, and gives farewell instruction about proper
    conduct toward King Janasandha. The family and attendants lament; Vidhura consoles
    them with teaching on impermanence and begins instruction about the royal court,
    making them enter a court through Buddha's magic power.
  language: English
  quote_policy: summarized
