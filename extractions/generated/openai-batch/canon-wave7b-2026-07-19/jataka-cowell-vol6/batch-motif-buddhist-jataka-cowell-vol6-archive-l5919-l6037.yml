canonical_text:
  quote: ''
  summary: Alambayana leaves the ascetic after learning a spell and travels repeating
    it. Naga youths who attend Bhuridatta are guarding a wish-granting jewel, but
    they hear the charm, fear a Garula king, flee into the earth, and abandon the
    jewel. Alambayana takes it. An outcast Brahmin and his son Somadatta recognize
    the jewel and the father tries to obtain it by deceit. Alambayana refuses ordinary
    sale but says he will give the gem to one who can reveal the mighty Naga. He explains
    that the hermit Kosiya learned a serpent-spell from a Garula and taught it to
    him. The outcast Brahmin resolves to show Bhuridatta to gain the gem, while Somadatta
    rebukes the plan as repayment of kindness with robbery.
  language: English
  quote_policy: summarized
