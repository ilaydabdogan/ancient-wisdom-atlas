canonical_text:
  quote: ''
  summary: The passage reports that the king, withdrawn and detached from desires,
    longs to find the dwelling of pacceka-buddhas. After four months of ascetic life
    in the palace, he wishes to leave splendid Mithila for Himavat, describes the
    city he will abandon, and imagines the solitary ascetic life. He secretly obtains
    yellow robes and an earthen vessel, has his hair and beard cut, dresses as an
    ascetic, takes a walking-stick, and begins to descend from the palace at sunrise
    while Queen Sivall summons seven hundred concubines.
  language: English
  quote_policy: summarized
