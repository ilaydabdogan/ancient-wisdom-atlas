canonical_text:
  quote: ''
  summary: The king orders food, drink, music, and entertainment to be placed along
    the road for his son's journey. Jujaka dies after overeating and receives royal
    funeral arrangements. On the seventh day, Sanjaya's host, guided by Jali, travels
    through the forest toward Vessantara's abode and camps by Lake Mucalinda. Vessantara
    hears the army, fears it may be hostile, and climbs a hill with Maddi; Maddi reassures
    him. Sanjaya approaches on an elephant to seek his son and give him the throne,
    and the family greets one another at the leafy hut.
  language: English
  quote_policy: summarized
