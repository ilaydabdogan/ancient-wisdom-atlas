canonical_text:
  quote: ''
  summary: A magically controlled Naga king/Bodhisatta is forced by Alambayana to
    enter a basket and perform snake dances and transformations before village crowds
    and later before the king at Benares. The captor prolongs the captivity for profit.
    Meanwhile the Great Being's mother has a frightening dream of mutilation, interprets
    it as an omen of danger, grieves for Bhuridatta, and is questioned by her eldest
    son Sudassana.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that drugs of magic power and muttered spells were used
    to seize and hold the Great Being.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After making the Great Being helpless, Alambayana prepared a basket of creepers
    and forced him into it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Alambayana set the basket down in a village and called people to come see
    a snake dance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Great Being resolved to comply with the performance in the hope that the
    captor might earn money and release him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: When commanded, the Great Being changed size, shape, number of hoods, height,
    visibility, and color, and emitted water or water and smoke.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The spectators wept and brought valuables, so that Alambayana gained a large
    sum in the village.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Alambayana had first intended to release the Great Being after earning a smaller
    amount, but after receiving more money he decided to seek greater profit in a
    city.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Alambayana made a jewel-covered basket, travelled with attendants, and made
    the snake-king dance in villages and towns until they reached Benares.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The snake-king was offered honey, fried grain, and frogs, but would not take
    the food because of his captivity.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Alambayana announced a royal performance, and the king ordered a proclamation
    by drum and scaffolding in the palace courtyard.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: On the day of the seizure, the Great Being's mother dreamed that a black man
    with red eyes cut off her arm with a sword and carried it away streaming with
    blood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The mother interpreted the dream as an evil omen and particularly worried
    that the Bodhisatta, who was in the world of men observing precepts and a fast-day
    vow, might have been seized by a snake-charmer or garula.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: After continued absence, the mother wept, watched the road, and repeatedly
