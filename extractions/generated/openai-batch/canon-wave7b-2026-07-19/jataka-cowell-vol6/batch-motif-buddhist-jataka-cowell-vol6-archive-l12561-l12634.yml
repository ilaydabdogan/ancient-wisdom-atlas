canonical_text:
  quote: '"You have not a friend but me."'
  summary: Anukevatta gains Brahmadatta's trust, misleads him about bribery among
    his allies, arranges a rigged midnight flight, and spreads news of the king's
    escape so that the princes and host panic and abandon the camp. The Great Being
    distributes the abandoned wealth in Mithila. Later Kevatta sees his forehead scar
    in a mirror, grows angry, and begins a new plan involving Brahmadatta's daughter
    Pancalacandi and King Vedeha.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Anukevatta is handed over to Brahmadatta's men; the king tests, trusts, honors
    him, and gives him charge of the army.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The army is brought to places infested by snakes and crocodiles, where men
    are terrified, wounded by weapons cast from battlements, and perish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Anukevatta tells the king that no one is left to fight for him because all
    have been bribed; the king checks garments and accoutrements and sees inscriptions
    on them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Anukevatta tells Brahmadatta that Kevatta accepted a precious gem, is a traitor,
    and that the king should escape in the middle watch.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Anukevatta informs the scouts of the planned escape and prepares the king's
    horse so that pulling the reins makes it go faster.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At midnight Brahmadatta mounts the horse and flees; Anukevatta rides as if
    accompanying him, then turns back.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Anukevatta loudly announces that Culani-Brahmadatta has fled, and the scouts
    and attendants also cry out.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The princes and the wider host panic, run away in rout, abandon the camp,
    and Culani-Brahmadatta enters his own city with the hundred and one chiefs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The next morning soldiers open the city gates, find great booty, and ask the
    Great Being what should be done with it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Great Being orders distribution of the abandoned goods, honors Anukevatta,
    and the citizens of Mithila gain plenty of gold.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A year later in Uttarapancala, Kevatta sees the scar on his forehead in a
    mirror, remembers the farmer's son, and becomes angry.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Kevatta plans to show Brahmadatta's daughter Pancalacandi to King Vedeha;
