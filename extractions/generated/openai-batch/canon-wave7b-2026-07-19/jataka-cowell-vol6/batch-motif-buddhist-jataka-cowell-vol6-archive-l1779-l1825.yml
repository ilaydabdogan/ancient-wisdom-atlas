canonical_text:
  quote: ''
  summary: 'After learning that the former king is dead without son or brother, Mahajanaka
    accepts the kingdom, is anointed, enters the city, and takes royal position in
    the palace. Princess Sivali tests him by summonses, which he disregards while
    attending to royal arrangements. She later gives him her hand as he approaches,
    and he uses this as evidence that he has pleased her. The ministers report further
    succession tests: identifying the head of a square bed, stringing a bow requiring
    the strength of a thousand men, and drawing out sixteen great treasures. Mahajanaka
    determines the bed''s head by giving a golden needle to the princess and watching
    where she places it, then strings the mighty bow with ease. A footnote compares
    the proverb about giving him a sword with a Kathasaritsagara episode.'
  language: English
  quote_policy: summarized
