canonical_text:
  quote: ''
  summary: During a journey, Golakala and the woman with him fear a shallow stream
    and do not cross. Dighapitthi lies that the water is deep and dangerous, carries
    the woman across, persuades her to go with him, and leaves Golakala behind. Golakala
    finally enters the water, discovers it is shallow, crosses, and pursues them.
    The dispute is brought before the Great Being, who questions the parties about
    names and kinship, determines that Golakala's account fits the woman's story,
    declares Golakala her husband and Dighapitthi a thief, and obtains Dighapitthi's
    confession.
  language: English
  quote_policy: summarized
