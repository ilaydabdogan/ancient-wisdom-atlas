canonical_text:
  quote: ''
  summary: Jujaka follows the road given by Accata the Hermit, waits near a foursquare
    lake and hill until Maddi leaves, and intends to ask Vessantara for the children.
    Maddi has a violent dawn dream and reports it to Vessantara, who understands it
    as foretelling a request for the children but reassures her deceptively. Maddi
    entrusts the children to Vessantara and goes to gather forest food. Jujaka approaches
    the hermitage; Vessantara joyfully welcomes the brahmin as a petitioner, while
    Jali first honors him and is treated harshly. Vessantara offers hospitality and
    asks the reason for the brahmin's visit.
  language: English
  quote_policy: summarized
