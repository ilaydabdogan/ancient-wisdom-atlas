canonical_text:
  quote: ''
  summary: A king reassures others that the wise seer will return. Punnaka places
    the Great Being on the Black Mountain and plans to kill him for his heart's flesh
    in order to gain the Naga maiden Irandati. Punnaka tries to frighten or destroy
    him through demonic, animal, serpent, wind, mountain, sound, and sky-suspension
    ordeals, but the Great Being remains undismayed and questions Punnaka. Punnaka
    identifies himself as a Yakkha minister of Kuvera and says his love for Irandati
    motivates the attempted killing. The Great Being says misunderstanding destroys
    people and asks to hear the whole matter.
  language: English
  quote_policy: summarized
