canonical_text:
  quote: ''
  summary: A royal observer repeatedly asks Matali, the divine charioteer, why various
    beings suffer in punitive realms. The punishments include being preyed on by carrion
    animals, beaten with red-hot lumps, struggling in coals, being cast into a blazing
    iron cauldron or boiling water, finding river water turned to chaff, being pierced
    with weapons, being torn to pieces, eating filth, and drinking blood. Matali explains
    most punishments as the ripening fruit of prior wrong actions, including harming
    ascetics or innocent people, perjury, killing birds, adulterating grain, theft,
    slaughtering animals, and malicious harm to others. The supplied excerpt ends
    after the question about the blood lake, before its answer appears.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fearful observer asks Matali about people preyed on by black dogs, speckled
    vultures, crows, and ravens; Matali answers that they were churls, misers, foul-tongued
    toward brahmins and ascetics, and hurtful.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: People with bodies ablaze lie prostrate and are beaten with red-hot lumps;
    Matali says they hurt and tormented sinless men and women.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Others struggle and roar in a pit of coals; Matali says they suborned a witness
    and forswore a debt before a crowd.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A huge blazing iron cauldron receives mortals cast headfirst; Matali says
    they hurt a virtuous brahmin or ascetic.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some have their necks wrung and are cast into a cauldron of boiling water;
    Matali says they caught and destroyed birds.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Men scorched with heat go to an accessible river to drink, but the water turns
    to chaff; Matali says they mixed good grain with chaff and sold it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Loudly wailing people are pierced with spikes, spears, and arrowheads; Matali
    says they took what was not theirs, including animals, corn, treasure, silver,
    and gold.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: People fastened by the neck are cut and torn apart; Matali says fishers, butchers,
    boar hunters, and slayers of cattle, bulls, and goats laid corpses in a slaughter-house.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Starving men eat from a foul lake of filth and ordure; Matali says malicious
    persons lived with others for harm and harmed their friends.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Scorched men drink from a foul lake full of blood; the observer asks Matali
    what sin caused this, but the answer is not included in the supplied passage.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Several of Matali's answers are introduced as descriptions of how sin ripens
    and bears fruit.
  category: sequence
  evidence_refs:
  - ev:11
