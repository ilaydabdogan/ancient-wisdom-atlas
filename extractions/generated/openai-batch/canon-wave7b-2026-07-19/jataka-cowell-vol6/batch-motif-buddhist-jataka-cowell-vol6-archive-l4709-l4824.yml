canonical_text:
  quote: ''
  summary: After an old king departs advising generosity and non-harm, Candakumara
    pleads with his father to spare the royal sons and other captives from sacrifice,
    offering slavery or exile instead. The king twice releases the captives but, under
    Khandahala's insistence that such offerings lead to heaven, orders recapture.
    Candakumara argues that killing innocent sons is wrong, invokes birds' care for
    their young, warns of brahmin betrayal, and says sacrificers and approvers will
    go to hell. He appeals to the people and sends his wives to plead, but the king
    disregards them and Candakumara laments.
  language: English
  quote_policy: summarized
