canonical_text:
  quote: ''
  summary: The king becomes angry at accusations against the wise man and orders punishment
    for the accusers. The sage repeatedly intercedes for them, securing pardon and
    restoration. Later the sage instructs the king, fortifies the city, organizes
    provisions and defenses, gathers information from merchants, and sends agents
    with gifts and hidden letters to other royal cities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king becomes angry after hearing the Great Being and concludes that the
    accusers are themselves traitors who are calling the wise man a traitor.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king orders the accused men driven out, impaled or beheaded; they are
    bound, beaten at street corners, and dragged along.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sage asks the king to pardon the ancient ministers; after further pleading,
    the king restores their positions.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The king is pleased with the sage and reflects that mercy toward foes indicates
    even greater mercy toward others.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The four wise men are said to be unable to speak, and are compared to snakes
    whose teeth and poison are gone.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: After this episode, the sage instructs the king in temporal and spiritual
    matters and thinks of himself as the king's white parasol and manager of the kingdom.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The sage has a city rampart built, adds watch-towers, and digs three moats:
    a water-moat, a mud-moat, and a dry-moat.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The sage restores houses, makes reservoirs, fills storehouses with corn, cleans
    water conduits, and has mud and edible lily-seeds brought from Himavat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Merchants from different places are asked where they came from and what their
    king likes, and are treated kindly before departure.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The sage sends one hundred and one soldiers with gifts to one hundred and
    one royal cities, instructing them to please the kings, enter their service, listen
    to their actions and plans, and send word back.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The gifts include earrings, golden slippers, and golden necklets with engraved
    letters appointed to reveal themselves when useful.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The dispatched men give false places of origin, are accepted into service,
    remain in attendance, and become trusted.
  category: action
  evidence_refs:
  - ev:7
