canonical_text:
  quote: ''
  summary: Sakka has Vissakamma prepare a forest hermitage for Dukulaka and Parika/Pari
    after they enter Himavat. The pair live as ascetics, and their benevolence pacifies
    the animals. Sakka foresees that they will lose their sight and tells Dukulaka
    that they need a son; after Dukulaka refuses sexual intercourse, Sakka instructs
    him to touch Pari's navel. The Bodhisatta descends from heaven into her womb and
    is born as the golden-hued Suvannasama. Kinnara beings wash and adorn the child.
    Later, while the parents take shelter during a storm at the roots of a tree on
    an ant-hill, an angry snake's breath blinds them. The passage explains this as
    the result of a former sin in which, in a previous birth, they blinded a rich
    patient's eye with false medicine.
  language: English
  quote_policy: summarized
