canonical_text:
  quote: ''
  summary: Kevatta advises Culani-Brahmadatta to raise an army, coerce kings into
    alliance, and later kill the hundred and one kings with poisoned liquor, keeping
    the plan secret. A parrot overhears the plan, mocks the secrecy, and carries the
    news to the sage Mahosadha at Mithila. Mahosadha prepares the city and uses watchers.
    Culani-Brahmadatta conquers all India except Vedeha, but Kevatta eventually advises
    him not to attack Mithila because Mahosadha is too skilful in device.
  language: English
  quote_policy: summarized
