canonical_text:
  quote: ''
  summary: A brahmin yields to his wife's demand, has road provisions prepared, promises
    to bring her an equal pair of slaves, secures his cottage, dons ascetic garb,
    ritually walks around his wife to the right, and departs in tears. In the Sivi
    capital he asks for Vessantara, but the people say Vessantara was banished to
    Vamka hill because of his repeated giving, and they drive the brahmin away. Gods
    guide him toward the right road, but in the forest wolves surround him and he
    becomes lost. He laments and asks who can direct him to Vessantara, praising the
    prince as a refuge for suitors and comparing him to cool water and shade-giving
    roadside trees. A forester set as a watchman hears the outcry.
  language: English
  quote_policy: summarized
