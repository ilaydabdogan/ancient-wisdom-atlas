canonical_text:
  quote: ''
  summary: In the morning four armed wise men fail to find the sage. The Great Being
    takes control of the city, comes to the palace, and confronts the king about a
    secret order for his death. He reveals private secrets of Senaka, Pukkusa, Kavinda,
    and Devinda; each admits the charge and is imprisoned. The Bodhisat then teaches
    that secrets should be guarded and not disclosed before an aim is accomplished.
  language: English
  quote_policy: summarized
