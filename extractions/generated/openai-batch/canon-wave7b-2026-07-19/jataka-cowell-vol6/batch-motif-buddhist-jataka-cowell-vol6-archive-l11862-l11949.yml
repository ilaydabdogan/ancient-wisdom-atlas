  text: Senaka, Pukkusa, Kavinda, and Devinda each have a secret revealed, admit it
    as true, and are sent to prison by the king.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
- id: obs:10
  text: The passage states that those who had plotted to slay the Bodhisat are all
