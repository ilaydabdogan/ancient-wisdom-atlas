canonical_text:
  quote: ''
  summary: The passage introduces the Sama-Jataka frame at Jetavana. A wealthy merchant's
    son in Savatthi sees people going to hear the law, visits Jetavana with offerings,
    hears the teaching, and seeks ordination. After obtaining parental consent by
    fasting, he is ordained, studies the law, and later withdraws to a forest to seek
    mystic insight but fails for twelve years. Meanwhile his parents lose their wealth
    and become homeless beggars. A visiting Brother from Jetavana tells the son of
    their ruin; the son weeps, identifies them as his parents, and resolves to leave
    ascetic life, support them, and give away wealth.
  language: English
  quote_policy: summarized
