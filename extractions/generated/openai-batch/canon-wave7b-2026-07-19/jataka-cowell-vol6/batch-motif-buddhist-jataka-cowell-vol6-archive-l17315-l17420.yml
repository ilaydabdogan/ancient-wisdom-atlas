canonical_text:
  quote: the earth did resound with a great uproar that reached even to Brahma's heaven
  summary: After Vessantara gives his children to a brahmin, Kanhajina and the children
    lament as they are driven away. Vessantara suffers intense grief but calms attachment
    through knowledge. Their lament reaches deities in Himavat, who arrange for three
    gods to take the forms of a lion, tiger, and pard to delay and protect Maddi on
    her return. Maddi experiences ominous signs while gathering food and finds wild
    beasts blocking the homeward path at sunset.
  language: English
  quote_policy: quoted
