canonical_text:
  quote: ''
  summary: Punnaka challenges the king to a dice game, staking a precious jewel while
    the king stakes his possessions except his body and white umbrella. In the gaming
    hall, before assembled kings, both parties agree to fair play. The king is aided
    by a guardian goddess, but Punnaka uses his power to make the dice fall against
    the king and frightens the goddess away. Punnaka wins and claims Vidhura the minister
    as the true prize; the king resists, calling Vidhura his refuge and like his life.
    Punnaka proposes that Vidhura himself decide the dispute.
  language: English
  quote_policy: summarized
