canonical_text:
  quote: ''
  summary: Sakka, appearing as an old beggar, asks the Great Being for his wife Maddi.
    The Great Being gives her by pouring water as a donation sign; portents occur,
    and Maddi accepts the act without anger. Sakka praises the deed, returns Maddi,
    reveals himself as King of Gods, offers eight boons, and the Bodhisatta requests
    reconciliation with his father, restoration to the royal seat, merciful rule,
    moral restraint, his son's welfare, and celestial food.
  language: English
  quote_policy: summarized
