canonical_text:
  quote: ''
  summary: Maddi praises Himavat as a forest and mountain realm whose sights and sounds
    will make Vessantara forget kingship. Queen Phusati overhears Maddi and Vessantara,
    laments Vessantara's banishment, defends his innocence and generosity, appeals
    to the king not to exile him, and contrasts Vessantara and Maddi's former royal
    splendor with the hardship of going on foot into the woods in bark or rough garments.
  language: English
  quote_policy: summarized
