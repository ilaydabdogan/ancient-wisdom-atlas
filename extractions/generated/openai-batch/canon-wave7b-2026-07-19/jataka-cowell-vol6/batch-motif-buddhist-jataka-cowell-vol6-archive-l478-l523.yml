canonical_text:
  quote: ''
  summary: The Bodhisatta, called Temiya in his self-address, fears hell and refuses
    to cry for milk or show desire for foods, fruit, playthings, and special child
    food. Nurses, Queen Canda, the king, brahmans, the mother, and other children
    appear in a sequence of tests intended to discover why he does not behave like
    other children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bodhisatta is afraid of hell, reflects that dying of thirst would be better
    than reigning, and does not cry.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The nurses report his behavior to Queen Canda; Queen Canda tells the king;
    the king consults brahmans skilled in signs and omens.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The brahmans advise giving the prince milk only after the proper time has
    passed, expecting him then to cry, seize the breast, and drink.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Milk is delayed or withheld, sometimes for the whole day, but the Bodhisatta
    remains silent even when thirsty; the mother or nurses give him milk because they
    say he is famished.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Other children cry when they do not get milk, while the Bodhisatta does not
    cry or sleep, does not double up his hands or feet, and does not respond to sound.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The nurses examine whether his condition resembles being crippled, dumb, or
    deaf, and decide to test him further with milk.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After a year of giving milk at intervals, the testers do not discover his
    weak point.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The testers place cakes and dainties near the Bodhisatta and five hundred
    children; the other children quarrel, strike one another, seize the cakes, and
    eat them, but the Bodhisatta refuses even to look at them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When tried with fruit, the other children fight for and eat the fruit, while
    the Bodhisatta does not look at it; this trial lasts a year.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: When tried with playthings, including golden and other elephant figures, the
    other children seize them as spoil, but the Bodhisatta does not look at them;
    this trial lasts a year.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When tried with special food for four-year-old children, the other children
    break and eat the food, while the Bodhisatta reminds himself of innumerable past
    births without food and does not look at it; his mother finally feeds him.
  category: sequence
  evidence_refs:
  - ev:8
