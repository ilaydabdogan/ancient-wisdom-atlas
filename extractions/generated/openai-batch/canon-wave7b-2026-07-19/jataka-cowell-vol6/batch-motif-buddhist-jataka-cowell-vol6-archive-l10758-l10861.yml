canonical_text:
  quote: ''
  summary: A goat and a dog, described as natural enemies, make a bargain to obtain
    food for one another from places where each will be ignored. They live together
    peacefully by a wall. The king observes this and turns it into a riddle for his
    wise men, threatening banishment if they fail. Senaka gains a delay. The Bodhisat,
    Mahosadha, infers that the king must have seen something, asks Queen Udumbara
    where the king had been looking, observes the goat and dog from that place, and
    concludes that the question is solved.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The goat and the dog both consider certain places too dangerous to revisit
    for their own food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The goat proposes that the dog go to the stable for grass and that the goat
    go to the kitchen for meat, because the keepers or cook will not expect those
    animals to eat those foods.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The dog brings grass to the great wall, the goat brings meat to the same place,
    and each animal eats the food appropriate to it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The goat and dog live together in harmony by the great wall, and the king
    describes them as natural enemies who have become friends.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The king asks his wise men to explain why two natural enemies have become
    inseparable, and he threatens banishment if they cannot solve the question before
    noon.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Bodhisat reasons that the king likely formed the question after seeing
    something, not by inventing it unaided.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: Senaka obtains time for the wise men by arguing that a difficult question
    should be considered calmly and in solitude.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Bodhisat asks Queen Udumbara where the king had been, learns he had been
    walking and looking out of a window, then goes to that place and observes the
    goat and dog.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The other wise men fail to discover the answer and go to Senaka, then to the
    Bodhisat.
  category: action
  evidence_refs:
  - ev:7
