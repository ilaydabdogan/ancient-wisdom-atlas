canonical_text:
  quote: ''
  summary: The passage credits Mahosadha with freeing people from danger. Vedeha crosses
    a river and travels through villages prepared by the Bodhisat, receiving transport,
    food, and drink until he reaches Mithila the next morning. The Bodhisat buries
    his sword in sand at the tunnel gate, enters the tunnel and town, bathes, eats,
    and rests. King Culani/Culaniya of Pancala musters an army with elephants, charioteers,
    footmen, archers, weapons, armor, and banners, orders Vedeha to be taken alive
    and the city trampled, and advances on Upakari like a flood.
  language: English
  quote_policy: summarized
