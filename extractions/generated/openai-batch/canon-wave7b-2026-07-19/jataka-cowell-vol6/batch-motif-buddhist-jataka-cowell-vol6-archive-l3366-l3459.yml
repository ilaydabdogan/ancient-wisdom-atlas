canonical_text:
  quote: ''
  summary: The Master, in Makhadeva's mango park near Mithila, tells Ananda and the
    Brethren a former-birth story. King Makhadeva takes grey hair as a sign of mortality,
    installs his son, renounces the world, practices the Four Excellencies, and is
    reborn in Brahma's heaven. A long succession of royal descendants repeats this
    renunciation. Makhadeva later returns from Brahma's heaven to be conceived as
    Prince Nemi, who becomes King Nimi, gives alms, observes vows and precepts, teaches
    the Law, and leads many people to divine rebirth. The gods praise him, and the
    passage ends as Sakka's throne becomes hot.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master smiled in Makhadeva's mango park and, when Ananda asked why, said
    he had once dwelt there in ecstatic meditation in King Makhadeva's time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Makhadeva is described as king in Videha, in the city of Mithila, with extremely
    long periods as youth, viceroy, and king.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Makhadeva instructed his barber to inform him when grey hairs appeared; when
    they did, the barber plucked them out and placed them on the king's hand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Seeing the grey hairs, Makhadeva thought of death and said that the hairs
    were God's messengers reminding him that the time to renounce the world was near.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Makhadeva gave the barber a village, installed his eldest son as king with
    ceremonial sprinkling, left the city, embraced the life of a Brother, practiced
    the Four Excellencies, and was reborn in Brahma's heaven.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Makhadeva's son and then many royal princes in succession renounced the world
    after seeing a white hair, became ascetics in the mango park, fostered the Four
    Excellencies, and were born in Brahma's heaven.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: From Brahma's heaven, Makhadeva looked down at his family and resolved that
    he must round it off; he then came from there and was conceived in the king's
    consort in Mithila.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Soothsayers examined the prince's marks and said he was born to round off
    the family of hermits; the king named him Nemi-Kumara, explained as Prince Hoop.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: From childhood, Nemi was devoted to giving, virtue, and the sabbath vow; after
    his father saw a white hair, Nemi was made king.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: King Nimi established five almshalls, one at each of the four city gates and
    one in the center, and distributed large gifts daily.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: King Nimi kept the Five Precepts, observed the sabbath on moon-days, encouraged
    almsgiving and good works, pointed out the road to heaven, warned of death, and
    preached the Law.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: People followed Nimi's admonitions, gave gifts, did good, died one after another,
    and were born in the world of gods; the divine world became full and hell was
    described as nearly empty.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The gods assembled in Sudhamma, the divine hall in the Heaven of the Thirty-three,
    praised King Nimi as their teacher, and credited him with their divine enjoyment.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The Master recited verses saying Nimi gave alms and wondered which was more
    fruitful, holy life or giving alms; immediately afterward Sakka's throne became
    hot.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
