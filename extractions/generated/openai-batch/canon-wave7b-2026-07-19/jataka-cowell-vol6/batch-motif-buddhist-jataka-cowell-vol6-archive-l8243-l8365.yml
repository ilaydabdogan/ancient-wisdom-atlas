canonical_text:
  quote: ''
  summary: Punnaka seeks Irandati as his wife from the Naga king Varuna. Wealth is
    rejected as bride-price, and the condition is set that Punnaka must bring the
    heart of the sage Vidhura. Punnaka identifies the sage, travels by a richly adorned
    sky-going horse to Vessavana Kuvera, describes the golden Naga city and Vimala's
    desire for Vidhura's heart, then uses an ambiguous command spoken by Vessavana
    in another matter as authorization to depart.
  language: English
  quote_policy: summarized
