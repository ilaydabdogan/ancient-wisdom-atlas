canonical_text:
  quote: ''
  summary: After Sama has been struck down by the king's arrow, an unnamed female
    speaker tells the king that his guilt can be addressed by nursing Sama's blind
    parents. The king mourns, honors Sama's body, takes the water-jar, and goes to
    the hermitage. Dukula, Sama's blind father, hears unfamiliar footsteps and asks
    who is approaching. The king identifies himself as King Piliyakkha, a hunter and
    archer. Dukula welcomes him hospitably and offers fruit and water. The king asks
    how blind hermits obtained the fruit, and Dukula explains that their son Sama
    gathers food and has gone to fill the water-jar. The king confesses that he has
    killed Sama. Parika, Sama's mother, hears this and laments. Dukula counsels restraint
    and says the wise forbid anger against the wrongdoer.
  language: English
  quote_policy: summarized
