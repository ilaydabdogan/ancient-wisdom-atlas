canonical_text:
  quote: ''
  summary: 'The passage presents three tests or demonstrations of Mahosadha''s wisdom:
    a chariot ownership dispute staged by Sakka in human form, an acacia pole whose
    root and top must be identified, and two heads that must be distinguished as male
    and female. Mahosadha resolves each case by observation and practical reasoning,
    and Sakka reveals himself and praises the judgment.'
  language: English
  quote_policy: summarized
