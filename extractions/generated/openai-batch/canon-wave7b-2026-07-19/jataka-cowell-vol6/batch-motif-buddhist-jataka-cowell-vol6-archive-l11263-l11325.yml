canonical_text:
  quote: ''
  summary: Amara returns from the forest and serves her parents and the Bodhisat.
    The Great Being repeatedly tests her by food preparation, false criticism, humiliation,
    gifts, bribery, coercion, and disguise. Amara remains obedient, loyal, and morally
    discerning; she is then honored by the queen, king, and townspeople, shares back
    half of the gifts she receives, and lives happily with the Great Being, who instructs
    the king.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Amara comes back from the forest carrying wood and leaves, enters the house,
    serves her parents before eating, and washes her parents' feet and the Bodhisat's
    feet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Great Being stays for several days watching Amara and then asks her to
    make gruel, a cake, and boiled rice from half a measure of rice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Amara husks and sorts the rice grains by size, using the large grains for
    gruel, the middling grains for boiled rice, and the small grains for a cake with
    condiments.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Although the food pleases him, the Great Being falsely rejects each preparation,
    accuses Amara of spoiling or wasting his rice, smears the food over her body,
    and tells her to sit at the door.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Amara does not become angry and obeys the instruction to sit at the door;
    the Great Being concludes that there is no pride in her.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Great Being gives Amara a dress, gives her parents the money he has brought
    or earned, comforts them, and takes Amara back to town.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Great Being leaves Amara at a gatekeeper's house and sends men with money
    to test her; she refuses the offer, saying it is not worth the dust on her master's
    feet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After repeated failed attempts to tempt her, the Great Being orders the men
    to drag Amara away by force.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When Amara sees the Great Being in magnificence, she smiles and weeps, explaining
    that she smiles at the fruit of past goodness and weeps from pity that he might
    sin against another's property and go to hell.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: After this test the Great Being knows Amara's chastity, sends her back, resumes
    a tailor's disguise, returns to her, and spends the night there.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Queen Udumbara tells the king, adorns Amara with ornaments, seats her in a
    great chariot, and brings her with honor to the Great Being's house for a gala
    day.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The king and townspeople send gifts; Amara divides the gifts into halves and
    returns one half to each giver, winning the hearts of the people.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: From that time the Great Being lives happily with Amara and instructs the
    king in temporal and spiritual matters.
  category: sequence
  evidence_refs:
  - ev:7
