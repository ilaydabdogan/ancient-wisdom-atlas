canonical_text:
  quote: ''
  summary: Brahmadatta and Kevatta prepare a victory festival that includes a plan
    to poison the assembled kings. Mahosadha, knowing of the plot from a parrot and
    reports from his men, sends ten thousand warriors to disrupt the feast by claiming
    precedence for King Vedeha, breaking the vessels, scattering the food, and making
    the provisions unusable. The disruption succeeds. Brahmadatta then resolves to
    march on Mithila with the hundred and one princes and eighteen armies, despite
    Kevatta's warning that Mahosadha protects Mithila and that the city cannot be
    taken.
  language: English
  quote_policy: summarized
