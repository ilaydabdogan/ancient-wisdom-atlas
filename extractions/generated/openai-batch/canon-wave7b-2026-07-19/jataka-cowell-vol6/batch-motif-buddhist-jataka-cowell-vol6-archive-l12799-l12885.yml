canonical_text:
  quote: ''
  summary: A king considers traveling to Uttarapancala to marry King Culani-Brahmadatta's
    daughter. Senaka and the other advisers encourage him, but Mahosadha warns that
    the proposal is a lethal lure. Angered, the king dismisses Mahosadha. Mahosadha
    leaves, remains loyal, and sends a clever green parrot to question a caged maynah
    who knows the secrets of the Pancala court.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king suspects that the brahmin's visit may be unfriendly and meant to
    attract him to another city so that he can be captured.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king asks Senaka whether he should go to Uttarapancala and marry King
    Culani's daughter.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Senaka advises the king to go and marry the daughter, saying the marriage
    would place him nearly equal to Culani-Brahmadatta and that the advisers would
    receive dresses and ornaments.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The other advisers give the same advice as Senaka.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Brahmin Kevatta comes from his lodging to take leave of the king, and the
    king lets him go.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Mahosadha visits the king; the king thinks Mahosadha is resourceful and knows
    past, present, and future, but the passage says the king is befooled by passion.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The king asks Mahosadha whether he should go or remain.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Mahosadha decides to dissuade the king and warns that Culani-Brahmadatta wants
    him killed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mahosadha compares the danger to a hunter catching a deer by decoy and to
    a fish failing to recognize a hook hidden in bait.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The king becomes angry, insults Mahosadha's origins, and orders him taken
    by the neck and removed from the kingdom for hindering his acquisition of a jewel.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Mahosadha leaves voluntarily to avoid being seized and disgraced; the king
    does not enforce the order because of respect for the Bodhisat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Mahosadha concludes that the king is in love and blind to danger, but also
    calls him a benefactor and resolves to investigate before going himself.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Mahosadha sends the clever green parrot to question the Pancala king's maynah,
    who watches his bed and knows secrets of the king and Kosiya.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The parrot goes to the maynah, greets her in her fine cage, asks about her
    welfare and food, and the maynah asks why he has come and why he was sent.
  category: sequence
  evidence_refs:
  - ev:8
