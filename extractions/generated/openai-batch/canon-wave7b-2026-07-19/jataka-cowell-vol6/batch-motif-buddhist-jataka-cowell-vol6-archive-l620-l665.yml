canonical_text:
  quote: ''
  summary: Courtiers arrange a sensual test for the prince by sending graceful women
    to make him laugh or stir sinful thoughts. The prince is bathed, adorned, placed
    in a luxurious royal chamber, and surrounded by music, dance, fragrances, and
    speech. He remains unmoved, restraining his breath and becoming rigid, so the
    women report that he is like a goblin. After many tests over sixteen years, the
    king confronts the fortune-tellers, who declare the prince ill-luck and advise
    sending him through the western gate in an unlucky chariot to be buried in the
    charnel-ground. Queen Candadevi invokes an unclaimed boon and asks that the kingdom
    be given to her son, but the king refuses even shortened terms of rule.
  language: English
  quote_policy: summarized
