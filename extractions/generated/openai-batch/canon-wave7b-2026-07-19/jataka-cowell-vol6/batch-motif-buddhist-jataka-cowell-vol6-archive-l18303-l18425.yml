canonical_text:
  quote: ''
  summary: Vessantara learns from his father that Jali and Kanhajina have been ransomed
    from the brahmin. Queen Phusati arrives, Maddi sees the children safe, and the
    royal kin are reunited. The reunion is accompanied by cosmic disturbance, Sakka
    sends a selective rain that revives the senseless royal persons, and the people
    call for Vessantara and Maddi to rule. Vessantara reconciles with his father,
    leaves his hermit's dress and hut, honors the ascetic place, and receives royal
    consecration water.
  language: English
  quote_policy: summarized
