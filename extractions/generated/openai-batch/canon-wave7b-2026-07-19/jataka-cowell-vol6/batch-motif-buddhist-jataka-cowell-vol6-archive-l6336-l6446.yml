canonical_text:
  quote: ''
  summary: Accimukhi, the Bodhisatta's half-sister, turns into a young frog to accompany
    the ascetic searcher in his matted hair. The searcher follows traces of the Bodhisatta's
    capture by the snake-charmer Alambana and reaches a palace performance where the
    Great Being, held as a snake-king in a jewelled basket, recognizes his brother
    in the crowd and weeps at his feet. Sudassana then challenges Alambana to a contest
    between his frog and Alambana's snake, secures the king as surety for a wager,
    and causes Alambana to become afraid of his royal backing.
  language: English
  quote_policy: summarized
