canonical_text:
  quote: ''
  summary: Prince Temiya is ceremonially proclaimed ruler for a short period, then
    the king orders the charioteer Sunanda to take him to a charnel-ground and kill
    and bury him. The queen pleads with Temiya, who remains silent to preserve the
    purpose of his sixteen-year effort. Sunanda removes him from the palace and drives
    out of the city; by divine power the chariot reaches a forest that appears to
    Sunanda like a charnel-ground. While Sunanda digs, Temiya tests his limbs, displays
    great strength, receives heavenly adornment through Sakka and Vissakamma, and
    asks the charioteer why he is digging the pit.
  language: English
  quote_policy: summarized
