canonical_text:
  quote: ''
  summary: The Bodhisat Mahosadha leads King Vedeha through a large decorated tunnel,
    brings out the family of King Culani, installs Princess Pancalacandi as Vedeha's
    queen, and sends Vedeha away by ship. Mahosadha refuses to depart with the king
    because he will not abandon his army, stating that wise counsel can overcome a
    larger army. Vedeha praises Mahosadha for delivering them from danger.
  language: English
  quote_policy: summarized
