canonical_text:
  quote: ''
  summary: During King Vessantara’s departure from the city, the earth and Mount Sineru
    respond miraculously. He sends followers back, gives away his horses and chariot
    to brahmin petitioners, receives temporary divine help from gods appearing as
    red deer, and then travels on foot with Maddi and their children. Trees bend down
    to feed the children, and yakkhas shorten the road so the family reaches Ceta
    before night.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the departing figure wished to look back, the earth cleft to the measure
    of the chariot, turned it toward the city, and allowed him to see where his parents
    dwelt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Earthquakes and other wonders followed; a stanza says Mount Sineru shook like
    a banyan tree when he came forth from the city and looked back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Great Being addressed Maddi and pointed out the place they had come from,
    identified as the king of Sivi’s dwelling-house and ancestral home.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Great Being looked toward the courtiers and other people and made them
    turn back.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Four brahmins who had missed the earlier distribution came after the prince,
    asked for the horses, and received them from the Great Being.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the horses were given away, the chariot yoke remained suspended in the
    air until four gods in the guise of red deer came and caught it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Great Being recognized the red deer-shaped draught animals as gods and
    described them to Maddi as a marvel.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: A fifth brahmin asked for the chariot; the Great Being dismounted his wife
    and children and gave the chariot to him, after which the gods disappeared.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After losing the chariot, the family continued on foot, with the Great Being
    carrying Jali and Maddi carrying Kanhajina.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: On the road they asked travelers the way to Vaiiika or Variika hill; the travelers
    wept and said the road was long.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: When the children cried for fruit, trees beside the road bowed their branches
    down so the children could pick fruit within reach.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The stanza attributes the bending of the trees to the power of King Vessantara.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The route from Jetuttara through several named places is described as thirty
    leagues, but yakkhas shortened the journey so the travelers reached Ceta before
    night.
  category: sequence
  evidence_refs:
  - ev:7
