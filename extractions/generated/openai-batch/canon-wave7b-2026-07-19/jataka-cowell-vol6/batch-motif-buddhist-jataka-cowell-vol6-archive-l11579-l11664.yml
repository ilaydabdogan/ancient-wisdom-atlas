canonical_text:
  quote: ''
  summary: The Great Being answers a king's questions about why certain persons are
    dear despite apparent harm, abuse, reproach, or receiving gifts. A goddess in
    the royal parasol approves the answers and gives offerings; the king also rewards
    him and later makes him Commander in Chief. Afterward, four rivals led by Senaka
    question the wise man about truth, wealth, counsel, and secrecy, then report to
    the king that he is a traitor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Great Being explains the first question by describing a mother who embraces
    and kisses a small child even after the child strikes and pulls at her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A goddess shows half her body from an aperture in the royal parasol, says
    the question is well solved, gives the Great Being a precious casket of divine
    perfumes and flowers, and disappears.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king also presents gifts and asks further questions in stanzas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Great Being explains the second question by describing an angry mother
    who abuses a disobedient son verbally, later searches for him with tears, and
    embraces him when found.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Great Being explains the third question by describing secret lovers who
    reproach each other falsely and then become dearer to each other.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Great Being explains the fourth question as referring to righteous mendicant
    brahmins who receive food, drink, clothes, and lodging from pious families.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: After the fourth answer, the goddess gives a precious casket full of the seven
    precious things, and the king makes the Great Being Commander in Chief.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Four rivals complain that the Great Being has become greater and ask Senaka
    what to do.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Senaka proposes asking the wise man to whom a secret should be told, intending
    to accuse him as a traitor if he says it should be told to no one.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The wise man answers that a man should be established in truth, then make
    wealth, learn good counsel, and tell no man his own secret.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The four rivals go to the king and say that the wise man is a traitor.
  category: action
  evidence_refs:
  - ev:10
