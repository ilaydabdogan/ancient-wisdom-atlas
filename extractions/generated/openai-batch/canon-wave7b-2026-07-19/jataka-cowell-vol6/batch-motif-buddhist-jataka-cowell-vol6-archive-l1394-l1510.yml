canonical_text:
  quote: '"This is not the first time that the Tathagata performed the great Renunciation"'
  summary: The passage opens the Mahajanaka-Jataka as a former-birth story about the
    Tathagata's great Renunciation. It recounts a royal succession conflict in Mithila,
    Polajanaka's imprisonment and miraculous release, his rebellion against Aritthajanaka,
    the king's death in battle, the pregnant queen's disguised flight with hidden
    treasure, and Sakka's divine assistance to her because the unborn Great Being
    is in her womb.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: At Jetavana, the Brethren discuss the Tathagata's great Renunciation, and
    the Master says he also performed it formerly before telling a past story.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: King Mahajanaka of Mithila has two sons, Aritthajanaka and Polajanaka; offices
    and kingship pass within this royal family.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A slave reports that Polajanaka wants to kill the king; after repeated reports,
    the king has Polajanaka chained and imprisoned under guard.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Polajanaka makes a conditional asseveration about whether he is his brother's
    enemy; after it, his chains break and the door opens.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Polajanaka goes to a frontier village, gains supporters, marches on Mithila,
    and demands either the royal umbrella or battle.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Before battle, Aritthajanaka tells his principal queen to preserve the child
    in her womb if he dies; Polajanaka's soldiers then kill him in battle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The pregnant queen hides gold and treasures in a basket under cloth and husked
    rice, disguises herself in soiled clothes, and leaves the city unrecognized by
    the northern gate.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The queen does not know the way and asks whether anyone is going to Kalacampa.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The child in the queen's womb is described as the Great Being reborn after
    accomplishing the Perfections, and Sakka's world shakes with his majesty.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Sakka decides to see the being of great merit, creates a covered carriage
    with a bed, and appears as an old carriage driver.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: When the pregnant queen cannot climb into the carriage, Sakka uses divine
