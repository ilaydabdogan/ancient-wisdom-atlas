canonical_text:
  quote: ''
  summary: Maddi laments that she has cared for her husband and children in forest
    exile and cannot find Jali and Kanhajina. The Great Being remains silent. Maddi
    searches by moonlight and through the night around the hermitage, trees, river,
    lakes, hills, caves, toys, animals, and former play places. At dawn she returns
    lamenting and falls to the ground with outstretched arms.
