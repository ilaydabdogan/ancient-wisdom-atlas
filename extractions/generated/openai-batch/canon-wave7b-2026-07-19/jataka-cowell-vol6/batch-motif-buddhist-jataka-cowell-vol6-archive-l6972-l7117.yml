canonical_text:
  quote: ''
  summary: The passage first presents verses disputing Brahmin explanations and doctrines,
    including a challenged legend about the salty sea, social hierarchy, Vedic authority,
    royal policy, and livelihood. The narrative then states that the Great Being refutes
    the arguments, delights the Naga assembly, releases an outcast Brahmin from the
    Naga-world without contempt, and journeys with pomp across the Yamuna to visit
    his maternal kin at a hermitage. Sagara-brahmadatta, not recognizing the splendidly
    adorned youth, asks his ascetic father about him. The ascetic identifies the visitors
    as Dhatarattha's Naga sons and children of Samuddaja.
  language: English
  quote_policy: summarized
