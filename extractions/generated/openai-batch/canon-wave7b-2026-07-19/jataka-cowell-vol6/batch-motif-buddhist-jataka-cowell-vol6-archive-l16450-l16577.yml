canonical_text:
  quote: ''
  summary: A hunter hears a brahmin asking about Vessantara’s dwelling and threatens
    him, fearing he has come to request Maddi or the children. The frightened brahmin
    falsely claims to be an ambassador sent to bring Vessantara home. The hunter accepts
    this, gives him food, honey, and deer meat, points out the mountain where Vessantara
    lives as an ascetic with his family, and describes the abundant forest hermitage
    with trees, birds, flowers, and a lily-covered lake likened to a divine garden.
  language: English
  quote_policy: summarized
