canonical_text:
  quote: ''
  summary: A queen laments that a formerly delicate noble woman must walk in the forest
    and that her unoffending son is being banished. The Master narrates the palace
    and city mourning. At dawn King Vessantara distributes food, drink, clothes, and
    many royal gifts, including seven hundred elephants, horses, chariots, and women,
    before going into banishment.
  language: English
  quote_policy: summarized
