canonical_text:
  quote: ''
  summary: In a public exchange, the king questions Narada about the reality of gods,
    ancestors, and another world. Narada affirms another world, rebukes the king's
    mocking loan proposal, and then describes hells and torments in order to frighten
    the king away from false doctrines.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Narada invites the king to ask his doubt and says he will solve it by reasoning,
    logic, and proofs.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king asks whether gods, ancestors, and another world really exist.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Narada answers that gods, ancestors, and another world do exist, but greedy
    and pleasure-infatuated people do not know this because of illusion.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The king laughs and proposes that Narada give him five hundred pieces now
    in exchange for one thousand in the next world.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Great Being answers that he would lend if the king were virtuous and generous,
    but not if the king were merciless and destined to dwell in hell.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king is rebuked and is not ready with an answer.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The multitude praises the speaker as miraculously powerful, and the city hears
    the teaching of the law through the Great Being's power.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Great Being decides to frighten the king with the fear of hell and then
    comfort him with a heaven of the gods.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Great Being warns that, if the king does not give up his doctrines, he
    will go to hell with endless torments.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
