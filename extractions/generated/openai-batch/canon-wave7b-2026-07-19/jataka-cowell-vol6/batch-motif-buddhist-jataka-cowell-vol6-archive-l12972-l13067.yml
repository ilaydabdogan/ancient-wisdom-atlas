canonical_text:
  quote: ''
  summary: A parrot recounts the story of Vaccha, an ascetic who renounced wealth
    but accepted the fairy Rahavati and killed a poisonous spider that was destroying
    her people. The parrot uses this example to argue for union with a maynah. He
    then courts and tests her, extracts from her a secret about a planned royal wedding
    being used to lure and kill the king of Videha, and asks leave to depart for seven
    nights.
  language: English
  quote_policy: summarized
