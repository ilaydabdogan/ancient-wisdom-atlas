canonical_text:
  quote: ''
  summary: Prince Mahajanaka seeks wealth in order to reclaim his father's kingdom,
    sails despite his mother's warning, and survives a catastrophic shipwreck through
    composure and effort. A sea guardian goddess, Manimekhala, notices him after seven
    days and questions him about striving in the hopeless mid-ocean; he answers with
    a teaching that one should do all one can even without assurance of success.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The prince intends to seize the kingdom that belonged to his father and asks
    his mother whether she has money available.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: His mother says she has pearls, jewels, and diamonds sufficient for gaining
    the kingdom and advises him not to trade.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: He takes half the wealth, prepares stock-in-trade, boards a ship bound for
    Suvannabhumi, and leaves despite his mother's warning about the sea.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the same day, disease breaks out in Polajanaka's body, and he later dies.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:5
- id: obs:5
  text: The ship carries seven caravans with their beasts, travels seven hundred leagues
    in seven days, then breaks apart as water rises and it sinks in the ocean.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The crew weep, lament, and invoke their different gods, while the Great Being
    does not lament or invoke deities and instead prepares himself with food, oil,
    garments, and the mast.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The crowd on board becomes food for fishes and tortoises, the water is colored
    with blood, and the Great Being leaps from the upright mast toward Mithila.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Great Being travels through the waves for a week, sees shore again, washes
    his mouth with salt water, and keeps a fast.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Manimekhala, a daughter of the gods, has been appointed guardian of the sea
    by the four guardians of the world and instructed to watch for virtuous beings.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: After not looking at the sea for seven days, Manimekhala sees the Great Being,
    assumes an adorned form, stands in the air, and tests his powers.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: Manimekhala asks who he is and what friend he trusts for help; the Bodhisatta
    answers that he strives because he knows his duty.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: Manimekhala says his efforts are vain and that he must die in the shoreless
    ocean; the Bodhisatta replies that one who does all one can is free from blame
    and remorse.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: When Manimekhala questions the use of striving where there is no reward, the
    Bodhisatta says that one who refuses to battle because he sees nothing to gain
    bears the blame.
  category: speech
  evidence_refs:
  - ev:10
