canonical_text:
  quote: ''
  summary: The passage presents two property-dispute episodes. In the first, a sage
    adjudicates a quarrel over stolen cattle by testing what the cattle have eaten,
    exposing the thief, who confesses and is admonished. In the second, a young woman
    steals a poor woman's thread necklace at a bathing tank; the sage resolves the
    dispute through a scent test using water and a perfume-seller, leading to confession
    and public recognition of his wisdom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sage is said to know at once which disputant is the thief and which is
    the real owner, but he asks what they are quarrelling about.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cattle owner says he bought the cattle, put them in a grassy field, and
    pursued the thief after seeing them carried off.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The accused man denies the owner's claim and says the cattle were born in
    his own house.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The sage asks both parties to abide by his decision and questions them about
    what the cattle were fed and given to drink.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The accused thief claims the cattle drank rice gruel and ate sesame flour
    and kidney beans; the owner says he fed them grass.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The sage has panic seeds ground, moistened with water, and given to the cattle;
    the cattle vomit only grass before the assembly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The accused cattle thief confesses; the sage tells him not to commit such
    sin again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Bodhisatta's attendants maim the thief, and the sage warns him about future
    torment in hells and teaches him the five commandments.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A minister sends an account of the cattle incident to the king; the king asks
    Senaka, who says it is only a cattle affair and anyone could decide it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A poor woman makes a necklace by tying together threads of different colours
    and places it on her clothes while bathing in a tank made by the pandit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A young woman asks to try on the necklace to measure it, then puts it on and
    runs away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The older woman comes out of the water, pursues the young woman, seizes her
    dress, and accuses her of running away with the necklace.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The young woman denies taking anything and claims the necklace as the one
    she wears on her neck, causing a crowd to gather.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The sage hears the quarrel, summons both women, is said to know by countenance
    which is the thief, and asks them to accept his decision.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The young woman says she scents the necklace with a perfume named in the passage
    as sabbasaihhdraka; the poor woman says she scents it with perfume made of piyaiigu
    flowers.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: The sage puts the necklace in water and has a perfume-seller smell the vessel;
    the perfume-seller recognizes the scent of piyaiigu flower.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: The Great Being tells the bystanders the circumstances, questions the women,
    makes the guilty one confess, and his wisdom becomes known to the people.
  category: sequence
  evidence_refs:
  - ev:8
