canonical_text:
  quote: ''
  summary: An ascetic questions King Culani/Pancala about why he would surrender various
    close persons to a water-demon, yet would give his own life to protect the wise
    Mahosadha. The king faults his friend and chaplain but praises Mahosadha as sinless,
    steadfast, beneficial to his descendants, and knowing past and future. The ascetic
    publicly repeats the Water-Demon Question before the people of Pancala to demonstrate
    the power and value of wisdom. A note within the passage also narrates a prince
    learning his true royal parentage, killing a brahmin usurper with a sword, and
    restoring his brother as king.
  language: English
  quote_policy: summarized
