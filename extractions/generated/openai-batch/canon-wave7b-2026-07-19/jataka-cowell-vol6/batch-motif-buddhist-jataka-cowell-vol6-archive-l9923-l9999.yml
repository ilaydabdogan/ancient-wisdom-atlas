canonical_text:
  quote: ''
  summary: After seven years, King Vedeha remembers the prediction of a fifth sage
    and sends councillors to search. At the eastern gate, a councillor finds a hall,
    tank, and park attributed to the seven-year-old Mahosadha Pandit, son of Sirivaddha,
    and reports that he seems to fulfil the king's dream. Senaka, envious, minimizes
    the evidence, so the king orders further local testing. In the first test, Mahosadha
    makes a hawk drop a piece of flesh by tracking and treading on its shadow, clapping,
    and shouting, then catches the flesh before it reaches the ground. A second test
    begins with a dispute over stolen cattle.
  language: English
  quote_policy: summarized
