canonical_text:
  quote: ''
  summary: After the Bodhisat's solution of an earlier problem, the king rewards his
    father, claims the young Bodhisat as his son, houses and maintains the sage and
    his retinue, and later tests him with a jewel whose reflection appears in a lake.
    Senaka fails by draining the lake, while the sage identifies the reflection and
    locates the jewel in a crow's nest in a palm-tree. The recovered jewel is given
    to the king, the sage is praised and rewarded, and a new episode begins with a
    chameleon descending before the king in the park.
  language: English
  quote_policy: summarized
