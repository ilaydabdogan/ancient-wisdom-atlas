canonical_text:
  quote: "“Like fireflies are they, like a great flaming fire is Mahosadha blazing
    with wisdom.”"
  summary: A deity dwelling in the king’s parasol asks the king four questions that
    he and his wise men cannot solve. She threatens him unless he recalls Mahosadha,
    whom she contrasts with false advisers through firefly, fire, milk, and horn analogies.
    The king sends courtiers through the four gates to bring Mahosadha back. A courtier
    finds Mahosadha living humbly as a potter-worker, taunts him, and Mahosadha answers
    that by wisdom he can restore his prosperity.
  language: English
  quote_policy: quoted
literal_observations:
