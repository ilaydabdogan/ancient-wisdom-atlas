canonical_text:
  quote: ''
  summary: A Brahmin encounters a radiant youth in the forest and asks whether he
    is Sakka, a yakkha, or a Naga prince. The Great Being truthfully declares himself
    to be Bhuridatta, a powerful Naga. Fearing betrayal to a snake-charmer, he invites
    the Brahmin and his son Somadatta to the Naga realm beneath dark waters. By his
    power he brings them to the Naga dwelling, grants them divine prosperity and Naga
    maidens, and continues his fast and religious duties. After a year the Brahmin
    becomes discontented with the Naga realm and plans a way to request return to
    the human world while praising Bhuridatta’s splendid home.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A red-eyed, broad-shouldered youth is seen in forest greenery with ten maidens
    guarding him, the maidens wearing fair robes and golden bracelets.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker compares the youth’s brightness to fire newly dressed with ghee
    and asks whether he is Sakka, a yakkha, or a powerful Naga prince.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Great Being decides to speak only the truth and declares that he is a
    powerful Naga named Bhuridatta, son of Samuddaja and Dhatarattha and youngest
    brother of Sudassan.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Great Being thinks that the Brahmin may betray him to a snake-charmer
    and thereby hinder his fast, so he decides to take the Brahmin to the Naga kingdom
    and honor him there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Brahmin says he will go to the Naga home if his son also comes, and Bhuridatta
    tells him to fetch the son.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bhuridatta describes his home as an awful, dark, storm-tossed lake whose inhabitants
    obey him, and he invites the Brahmin to plunge beneath the dark blue waves.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bhuridatta brings the Brahmin and his son to the bank of the Yamuna and then,
    by his power, brings them to the dwelling of the Nagas, where they obtain a divine
    condition.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Naga dwelling Bhuridatta gives the father and son divine prosperity
    and four hundred Naga maidens each.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Bhuridatta continues to practice his fast, goes every fortnight to honor his
    parents, discourses on the law, and checks on the Brahmin and Somadatta.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After a year in the Naga realm, the Brahmin becomes discontented and longs
    to return to the world of men.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: To the Brahmin, the Naga dwelling seems like a hell, the adorned palace like
