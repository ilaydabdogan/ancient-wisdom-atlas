canonical_text:
  quote: ''
  summary: The passage recounts Vessantara's birth in Vessa Street, his immediate
    speech and first act of giving, the arrival of an auspicious white elephant, his
    childhood generosity, his resolve at age eight to give even his own body if asked,
    the cosmic upheaval that follows that resolve, and his later mastery, marriage,
    coronation, almsgiving, and children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Phusati bears the Great Being after ten months and gives birth to him in Vessa
    Street.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Great Being comes from the womb free from impurity, open-eyed, and immediately
    asks his mother for something to give.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Phusati permits him to give and places a purse of a thousand pieces in his
    outstretched hand.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: He is named Vessantara because he was born in Vessa Street.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: On his birthday a female flying elephant brings a white young elephant of
    lucky omen to the royal stables, and the young elephant is named Paccaya.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The king appoints nurses with sweet milk for the Great Being and attendants
    for the sixty thousand children born with him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: As a young child, Vessantara gives away costly princely necklaces to his nurses
    repeatedly, nine times in all.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At age eight, Vessantara thinks that if asked he would give his heart, eyes,
    flesh, blood, or body.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: After this thought, the earth quakes, Sineru bows and seems to dance, the
    sky thunders, lightning flashes, rain falls, and the ocean is stirred.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Sakka claps his arms and Mahabrahma gives a sign of approval during the cosmic
    upheaval.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: By age sixteen, Vessantara has mastered all sciences, marries Maddi, is sprinkled
    with coronation water, and begins daily large-scale almsgiving.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Maddi bears Jali, named from a golden hammock, and Kanhajina, named from a
    black skin; Vessantara visits his six alms-halls monthly while mounted on his
    elephant.
  category: sequence
  evidence_refs:
  - ev:6
