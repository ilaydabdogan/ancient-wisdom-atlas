canonical_text:
  quote: ''
  summary: Ruja recounts former births and future births to a king/father, linking
    each condition to prior actions. She describes heavenly existence in Nandana and
    Sakka's court, future divine births, the persistence of actions across lives,
    and then teaches an ethical law about avoiding sin, following the threefold law,
    and understanding the causes of fortune.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says she was previously born as a castrated ox among the Dasannas,
    drew a carriage for a long time, and states this birth was the consequence of
    going after other men's wives.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says that after that birth she was born among the Vajji people
    and was neither man nor woman, again stating this as a consequence of going after
    other men's wives.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says she was next born in Nandana wood as a heavenly nymph in
    the heaven of the Thirty-three, adorned, skilled in dance and song, and attending
    Sakka's court.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: While in that heavenly state, the speaker remembered these births and seven
    future births, and says that after the sixth future birth she will finally be
    born as a male deity in a divine body.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker says garlands are being gathered from a heavenly tree in Nandana
    and that a son of the gods named Java is seeking a garland for her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker contrasts mortal time and heavenly time, saying that sixteen years
    of present life are like one heavenly moment and that a hundred mortal autumns
    equal one heavenly day and night.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The speaker states that actions follow beings through countless births, bringing
    good or evil, and that no action is lost.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The speaker declares a law advising avoidance of another's wife, worship of
    the Lord as attendants worship Indra, avoidance of sins, and watchfulness in body,
    word, and thought.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The speaker asks the king to consider what caused him to possess wives who
    are compared with heavenly nymphs.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The narrative says the maiden Ruja counselled her father, pleased him, taught
    the bewildered one the true road, and declared the law to him.
  category: relationship
  evidence_refs:
  - ev:9
