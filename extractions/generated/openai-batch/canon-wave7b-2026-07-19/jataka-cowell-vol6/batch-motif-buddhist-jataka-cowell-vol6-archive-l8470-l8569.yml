canonical_text:
  quote: ''
  summary: A quoted speaker tells a king to look at a bright jewel. Within the jewel
    are created images of an army, a fortified city, urban trades and entertainments,
    crowds, animals, rivers, trees, lakes, the earth surrounded by sea, the four great
    lands, the sun and moon moving around Mount Sineru, Sineru and Himavat, the four
    world guardians, Indra's gardens and palaces, heavenly beings and heavens, and
    many colored lines. The jewel is described as flame-like and as the destined prize
    for the winner.
  language: English
  quote_policy: summarized
