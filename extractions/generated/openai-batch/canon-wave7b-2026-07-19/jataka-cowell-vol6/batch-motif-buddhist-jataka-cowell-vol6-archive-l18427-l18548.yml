canonical_text:
  quote: '"No beast or bird did any harm to the others, all did good."'
  summary: Vessantara and Maddi are restored with royal honors after their troubles.
    Vessantara mounts a richly adorned elephant with sword and retinue; Maddi is bathed,
    consecrated, adorned, reunited with her children, and blessed. Queen Phusati sends
    Maddi garments and ornaments. The royal party stays in the forest, where animals
    do no harm through Vessantara's glory, then returns along a decorated road from
    Vanka hill to Jetuttara, which is prepared to receive them.
  language: English
  quote_policy: quoted
