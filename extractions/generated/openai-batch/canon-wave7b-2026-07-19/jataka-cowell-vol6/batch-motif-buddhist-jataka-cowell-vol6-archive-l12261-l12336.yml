canonical_text:
  quote: ''
  summary: Mahosadha encourages the besieged city by proclaiming a seven-day festival,
    creating the appearance of fearlessness. Culani-Brahmadatta, hearing the merrymaking
    despite his encircling armies, is angered by a false report and orders an assault.
    The attackers fail at the walls under missiles, mud, stones, arrows, and mockery
    from the defenders. Kevatta then advises cutting off the city's water. Mahosadha
    receives the news by a leaf fastened to an arrow and prepares a bamboo-and-lily
    countermeasure using Himavat soil and seed. The included footnote-like passage
    recounts Queen Talata correcting a mistaken judgment by eliciting and enforcing
    a man's own stated preference.
  language: English
  quote_policy: summarized
