  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The unsuccessful attackers report that no one but a magician could get into
    the city.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Kevatta advises that the city’s outside water supply be cut off so that the
    inhabitants will be worn out by lack of water and open the gates.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Mahosadha’s spies send word by writing on a leaf fastened to an arrow, and
    the leaf is brought to Mahosadha according to his prior orders.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Mahosadha prepares sixty-cubit bamboo poles, removes the knots, rejoins and
