- id: obs:1
  text: Mahosadha has drums beaten and proclaims that the people should have no fear
    and keep a seven-day holiday with garlands, scents, perfumes, food, drink, singing,
    dancing, and merrymaking at his cost.
  category: action
  evidence_refs:
  - ev:1
