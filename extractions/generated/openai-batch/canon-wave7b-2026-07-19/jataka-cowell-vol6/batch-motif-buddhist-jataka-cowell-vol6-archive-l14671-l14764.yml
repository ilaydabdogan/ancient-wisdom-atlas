  quote: ''
  summary: The passage introduces King Sivi, his son Sailjaya, and Phusati, then recounts
    earlier karmic histories involving offerings to the Buddha Vipassi, rebirths in
    divine and human worlds, identifications of figures across Buddha eras, and Phusati's
    impending departure from heaven when Sakka offers her ten boons before death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: King Sivi reigns in Jetuttara in the kingdom of Sivi and has a son named Sailjaya.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Sailjaya comes of age, King Sivi brings him Princess Phusati, daughter
    of King Madda, gives her as queen consort, and hands over the kingdom to him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the ninety-first age from the narrative present, the Teacher Vipassi dwells
    in the deer-park of Khema near Bandhumati.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A king sends King Bandhuma a golden wreath and precious sandal wood; Bandhuma
    gives the sandal wood to his elder daughter and the wreath to his younger daughter.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Both daughters decline to use the gifts for themselves and state their intention
    to offer them in respect to the Master.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The elder princess powders the sandal wood, places it in a golden box, sprinkles
    the Buddha's body with it, scatters the rest in his cell, and prays to become
    the mother of a Buddha.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The younger princess has the golden wreath made into a necklet, places it
    on the Buddha's body, prays that the ornament not part from her body until sainthood,
    and the Master grants the prayers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: After death, both princesses come into being in the world of gods.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The elder princess passes between the worlds of gods and men and eventually
    becomes Queen Maya, mother of the Buddha.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The younger princess, in the time of the Dasabala Kassapa, becomes King Kiki's
    daughter, is born with the semblance of a necklet, is named Uracchada, hears a
    pious utterance, attains the First Path, sainthood, enters the Order, and enters
    Nirvana.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: King Kiki has seven other daughters, and the passage lists their names and
    identifies them with named women in the current manifestation of the Buddha.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage identifies Phusati with Sudhamma, says she did good deeds and
    gave alms, and says the fruit of a sandal wood offering to Vipassi made her body
    appear sprinkled with choice sandal wood.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Phusati passes between the worlds of men and gods and eventually becomes chief
    queen of Sakka, king of the gods.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: When Phusati's days are done and the five customary signs appear, Sakka escorts
    her to the pleasaunce in Nandana grove and offers her ten boons.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Phusati fears she is being sent away for sin, but Sakka says she has not sinned,
    her merit is used up, and her death is near.
  category: speech
  evidence_refs:
  - ev:9
