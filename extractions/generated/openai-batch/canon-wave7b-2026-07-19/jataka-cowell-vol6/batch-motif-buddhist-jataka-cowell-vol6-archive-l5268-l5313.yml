canonical_text:
  quote: ''
  summary: A prince lives with a Naga woman, who uses magic to provide a fine dwelling
    and bears a son and a daughter. A forester from Benares recognizes the prince
    and informs the ministers after the king's death. The ministers ask the prince
    to take the kingdom. The prince invites the Naga woman to Benares, but she refuses
    because of her poisonous and easily angered nature. She entrusts the children
    to him, advising that they be carried in a water-filled boat and housed near a
    palace lake because of their watery nature, then vanishes to the Naga-world. The
    grieving prince returns to the ministers, who besprinkle him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Naga woman uses magic power to make a costly house, couch, and bed for
    life with the prince.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After this arrangement, the prince stops eating roots and fruits and feasts
    on divine meat and drink.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Naga woman gives birth first to a son named Sagara-Brahmadatta and later
    to a daughter named Samuddaja, whose name is linked to her birth on the seashore.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A forester from Benares comes to the place, recognizes the prince, and says
    he will tell the king's family where the prince is dwelling.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the king dies and is buried, the ministers say a kingdom without a king
    cannot stand and discuss how to obtain a king because they do not know whether
    the prince is alive or dead.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The forester reports to the ministers that he recently stayed near the prince,
    and the ministers go to the prince under the forester's guidance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ministers tell the prince that the king is dead and ask him to assume
    the kingdom.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The prince asks the Naga woman to come with him to Benares and reign with
    him, promising that she will be chief among sixteen thousand queens.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Naga woman refuses to go, saying that her kind have deadly poison, are
    easily displeased, and can destroy something by an angry glance.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The next day the Naga woman again refuses to go but says the children are
    the prince's children and of the race of men.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Naga woman says the children are watery in nature and delicate, so they
    would die from road travel, wind, and sunshine unless carried in a boat filled
    with water and later provided with a palace lake.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Naga woman salutes and respectfully circles the prince, embraces and kisses
    the children, entrusts them to him, weeps, vanishes, and departs to the Naga-world.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The prince is overcome with sorrow, wipes his tears, goes to the ministers,
    and is besprinkled by them.
  category: sequence
  evidence_refs:
  - ev:9
