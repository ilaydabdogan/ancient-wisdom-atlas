canonical_text:
  quote: ''
  summary: Vidhura, called the Great Being, salutes the king, exhorts the royal household
    and city, comforts his dependents, arranges household matters, and prepares to
    leave with Punnaka. Punnaka tells him to take hold of the horse's tail for a long
    journey and a last sight of the living world. Vidhura declares himself fearless
    because he has done no evil. He seizes the horse's tail, and Punnaka's reason-endowed
    horse carries him into the sky to the Black Mountain. Vidhura's family and the
    citizens lament, report to the king that Punnaka was a Yakkha disguised as a Brahmin
    youth, and vow to enter fire if Vidhura does not return by the seventh day.
  language: English
  quote_policy: summarized
