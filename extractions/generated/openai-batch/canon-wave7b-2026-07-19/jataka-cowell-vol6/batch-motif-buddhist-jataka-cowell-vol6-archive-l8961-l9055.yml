canonical_text:
  quote: ''
  summary: 'The passage gives extended advice on how a person should behave in a king’s
    court, including honoring monks and Brahmins, protecting gifts and alms, managing
    household affairs, appointing virtuous servants, serving the king loyally, and
    practicing generosity. It then narrates Vidhura’s departure: after three days
    of counsel to his relatives, he goes to the king, says a youth is leading him
    away, asks that his family and property be protected, and compares his family’s
    fate to things trembling when the earth trembles. The king proposes killing the
    youth to prevent Vidhura’s departure, but Vidhura rebukes the plan as unrighteous
    and sinful, says such action leads to hell, and departs without wrath.'
  language: English
  quote_policy: summarized
