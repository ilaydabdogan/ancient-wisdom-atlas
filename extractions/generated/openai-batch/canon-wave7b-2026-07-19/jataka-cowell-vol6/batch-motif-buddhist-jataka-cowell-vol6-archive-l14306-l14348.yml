canonical_text:
  quote: ''
  summary: Unidentified slanderers tell the king that gestures exchanged between the
    ascetic Bheri and Mahosadha meant a plot against him. The king questions Bheri,
    who explains that the gestures were a silent inquiry about the king's generosity,
    Mahosadha's lack of reward, and his need to support many dependents. Mahosadha
    confirms the same account. The king rewards him with command, but Mahosadha suspects
    sudden royal favor may conceal danger and asks Bheri to discover the king's mind.
    Bheri promises, and the Question of Dakai-akkhasa the Water-Demon comes into her
    mind.
  language: English
  quote_policy: summarized
