  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The general comes to the royal gate when summoned and tries to obey the princess's
    commands quickly in order to please her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Princess Sivali tests the general, sees his lack of wisdom, orders him to
