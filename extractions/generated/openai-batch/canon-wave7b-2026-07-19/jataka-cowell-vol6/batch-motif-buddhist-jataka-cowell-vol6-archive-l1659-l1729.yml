canonical_text:
  quote: ''
  summary: After declaring that he will strive through the ocean as long as strength
    remains, the Bodhisatta is praised by a goddess, who carries him through the air
    to Mithila and leaves him on a ceremonial stone in a mango grove. The passage
    then recounts King Polajanaka's succession conditions, including pleasing Princess
    Sivali, knowing the head of a square bed, stringing a powerful bow, and finding
    sixteen treasures. Ministers test possible successors, and Princess Sivali humiliates
    the general and other officials for lacking wisdom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man in the sea states that his own actions have saved him while others have
    drowned, and he says he will keep striving toward shore while strength remains.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A goddess hears the man's words, praises his brave struggle in the boundless
    sea, and tells him to go where his heart wishes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The goddess asks where she should carry him, and he answers that he wants
    to go to Mithila.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The goddess seizes him in both arms, treats him like a dear child, springs
    into the air, and transports him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Bodhisatta sleeps for seven days with his body wet from salt spray and
    affected by heavenly contact.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The goddess brings him to Mithila, lays him on his right side on a ceremonial
    stone in a mango grove, leaves him with garden goddesses, and departs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: King Polajanaka has no son and has one wise and learned daughter named Sivali.
  category: relationship
  evidence_refs:
