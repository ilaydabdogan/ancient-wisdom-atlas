canonical_text:
  quote: ''
  summary: Vidhura recounts how his wisdom attracted the Naga queen Vimala, how Punnaka
    won him by dice and tried unsuccessfully to kill him, and how moral teaching led
    to Punnaka’s conversion, Vidhura’s journey to the Naga world, Punnaka’s marriage
    to Irandati, and Vidhura’s return with a desire-granting jewel. The king then
    tells a dream of a wisdom-tree delivered from captivity, orders public homage,
    releases captives, holds a festival, and the Great Being teaches the law before
    the people perform good works and attain heaven.
  language: English
  quote_policy: summarized
