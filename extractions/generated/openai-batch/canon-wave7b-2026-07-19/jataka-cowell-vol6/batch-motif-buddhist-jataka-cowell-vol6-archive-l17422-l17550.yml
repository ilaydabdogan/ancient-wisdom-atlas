canonical_text:
  quote: ''
  summary: Maddi, returning late with forest food, pleads with beasts blocking the
    only path to let her pass to her children. The gods release her, and she reaches
    the hermitage on the full-moon night but cannot find Jali and Kanhajina. She laments
    their absence, questions the silent Great Being, and explains that ominous signs
    and three beasts delayed her return.
  language: English
  quote_policy: summarized
