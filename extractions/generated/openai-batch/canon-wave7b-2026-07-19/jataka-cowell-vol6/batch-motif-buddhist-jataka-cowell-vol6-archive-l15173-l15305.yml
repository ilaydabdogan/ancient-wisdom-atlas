canonical_text:
  quote: ''
  summary: An agent tells Vessantara, the Great Being, that the Sivi people are angry
    at his gifts and will banish him. Vessantara declares that he would give even
    bodily parts and will not cease giving, asks for one day to perform the great
    gift of the seven hundreds, and orders extensive gifts prepared. He counsels Maddi
    about wealth and family duties, then tells her of his coming forest exile. Maddi
    refuses separation, says she would rather die than live apart, and vows to follow
    him with their sons into the forest and mountain landscape.
  language: English
  quote_policy: summarized
