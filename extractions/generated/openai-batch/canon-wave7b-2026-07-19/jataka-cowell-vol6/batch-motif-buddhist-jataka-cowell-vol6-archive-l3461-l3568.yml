canonical_text:
  quote: ''
  summary: Sakka/Vasava perceives King Nimi's doubt, appears in the palace with radiant
    light, identifies himself as king of gods, and answers Nimi's question about whether
    holy living or almsgiving is more fruitful. He teaches that holy life surpasses
    charity, gives examples of former kings and ascetics, describes remote hermits
    near the Sida river and golden mountains, affirms moral action over caste, advises
    Nimi to practice both almsgiving and virtue, then returns to the gods and recounts
    his visit.
  language: English
  quote_policy: summarized
