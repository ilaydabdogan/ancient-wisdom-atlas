canonical_text:
  quote: ''
  summary: Four kings meet in a garden by a royal lake while observing ascetic duties
    and debate which of their virtues is superior. Varuna the Naga king praises freedom
    from anger toward an enemy; the Supanna king praises restraint from eating the
    Naga; Sakka praises leaving heavenly pleasures; and King Dhananjaya praises abandoning
    courtly luxury. They bring the dispute to Vidhura-pandita, the Bodhisatta, who
    declares that all four virtues are well spoken and together define a true ascetic.
  language: English
  quote_policy: summarized
