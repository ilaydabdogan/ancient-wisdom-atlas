canonical_text:
  quote: ''
  summary: After consulting Guna, King Angati abandons public affairs for pleasure
    and delegates judgment to others. His daughter Ruja prepares for the sacred fifteenth
    day, enters the Candaka palace, and asks for money to give to mendicants. Angati
    denies the value of fasting, merit, and another world. Ruja rebukes him, warns
    against foolish associations and wrong doctrines, and teaches through parables
    of a moth, a hooked fish, and an overloaded merchant ship sinking into the sea
    like a sinner sinking into hell.
  language: English
  quote_policy: summarized
