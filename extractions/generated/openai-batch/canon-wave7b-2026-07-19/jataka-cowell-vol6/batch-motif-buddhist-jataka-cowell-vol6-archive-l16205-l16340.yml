canonical_text:
  quote: ''
  summary: The passage describes the forest life of Vessantara's household under the
    Great Being's compassion, then introduces the brahmin Jujaka, his young wife Amittatapana,
    the public mockery she suffers because she is married to an old man, and her demand
    that Jujaka obtain a slave or maid by petitioning Vessantara.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Great Being's compassion causes wild animals within three leagues to have
    compassion for one another.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Maddi daily provides water and food, prepares water and a tooth-brush, sweeps
    the hermitage, leaves the children with their father, and goes to the forest with
    a basket, spade, and hook to gather roots and fruits.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At evening Maddi returns, sets out the fruit, washes the children, and the
    four members of the household eat fruit at the cell door before retiring; they
    live in the mountain recesses for seven months.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Jujaka is a brahmin in Dunnivittha in Kalinga; after a brahmin family spends
    money he had deposited with them and cannot repay it, they give him their daughter
    Amittatapana.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Amittatapana tends Jujaka dutifully, and young brahmin men reproach their
    own wives by comparing them unfavorably with her.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The reproached wives decide to drive Amittatapana out and revile her at the
    river and elsewhere.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The women mock Amittatapana for being a young wife married to an old decrepit
    man and use images of spear-thrust and serpent bite in their speech.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Amittatapana returns home with her waterpot, weeping, and tells Jujaka she
    cannot fetch water because the women mock her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Jujaka offers to fetch water and do the work himself.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Amittatapana says she will not stay with Jujaka unless he buys a slave or
    maid to do the work.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Amittatapana tells Jujaka that Vessantara lives on Variika hill and urges
    him to ask Vessantara for a slave, saying the prince will grant the request.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Jujaka protests that he is old, weak, and faces a rough, long road; Amittatapana
    rebukes him and repeats her threat to leave.
  category: speech
  evidence_refs:
  - ev:8
