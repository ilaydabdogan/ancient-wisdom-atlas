canonical_text:
  quote: ''
  summary: The passage recounts Queen Udumbara seeing Pinguttara, her former husband,
    doing road work and smiling at his reduced condition. The king suspects her and
    threatens to kill her, but Mahosadha gives an answer that supports her explanation
    and calms the king. The king rewards Mahosadha, and the queen receives permission
    to treat him as a younger brother and send him food. A later episode begins with
    the king seeing a goat and a dog making friends after each has been beaten by
    palace servants for taking food.
  language: English
  quote_policy: summarized
