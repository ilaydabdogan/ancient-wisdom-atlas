canonical_text:
  quote: ''
  summary: A Brahmin praises Bhuridatta's Naga palace by comparing it to Sakka's halls.
    Bhuridatta replies that Sakka's glory is vastly greater and says he fasts on an
    ant-hill because he longs for Vejayanta. The Brahmin asks to return to his kin.
    Bhuridatta permits him to go and offers a heavenly jewel that grants desires,
    but the Brahmin refuses, saying he will adopt the ascetic life. Four young Nagas
    escort the Brahmin and Somadatta back to the human world. After the father and
    son bathe in a lake, their divine ornaments and clothes vanish back to the Naga
    world, while their poor clothes and hunting weapons return. At home, Somadatta's
    mother rebukes the Brahmin for refusing the jewel, and he and his son resume hunting.
  language: English
  quote_policy: summarized
