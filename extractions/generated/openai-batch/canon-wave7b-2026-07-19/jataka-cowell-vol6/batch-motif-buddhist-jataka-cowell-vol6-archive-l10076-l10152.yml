canonical_text:
  quote: ''
  summary: 'The passage presents adjacent episodes of adjudication by a sage: a stolen
    ball of cotton thread is identified by the seed hidden inside it; a mother and
    a female goblin dispute over a child, and the sage exposes the goblin through
    a pulling test and supernatural signs; the next episode begins by introducing
    Golakala and his wife Dighatala.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman watching cotton fields spun clean cotton into fine thread, made it
    into a ball, and later placed it on her dress while bathing in the sage's tank.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Another woman saw the thread ball, desired it, asked whether the first woman
    had made it, put it in her lap as if inspecting it, and walked away with it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sage asked each woman what seed was inside the thread ball; one answered
    cotton seed, the other timbaru seed, and the ball was found to contain a timbaru
    seed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The thief confessed after the thread ball was untwisted, and the multitude
    applauded the decision.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: A mother took her son to the sage's tank, bathed him, laid him in her dress,
    and went to bathe herself.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A female goblin saw the child, wished to eat him, received permission to give
    him suck, played with him, and then tried to run off with him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The mother pursued the goblin, and both claimed the child as their own before
    the sage.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: The sage recognized one claimant as a goblin by her red unwinking eyes, but
    still asked both claimants to accept his decision.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The sage drew a line, placed the child in the middle, ordered the goblin to
    hold the hands and the mother to hold the feet, and declared that the child would
    belong to whoever pulled him over.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: When the child cried from pain during the pulling, the mother let him go and
    stood weeping.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The sage reasoned that the true mother was the one whose heart was tender
    toward the child and who let him go.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The sage identified the child-stealer as a goblin by red unwinking eyes, absence
    of shadow, fearlessness, and lack of mercy; the goblin confessed and said she
    had seized the child to eat him.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: The sage admonished the goblin, established her in the five precepts, and
    sent her away; the mother blessed him and departed with her son.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Golakala is introduced as a man named for his ball-like dwarfish size and
    black colour; after working seven years he obtained a wife named Dighatala and
    proposed visiting her parents.
  category: attribute
  evidence_refs:
  - ev:11
