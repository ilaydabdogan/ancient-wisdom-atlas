canonical_text:
  quote: ''
  summary: 'Kevatta urges the king to accept an offer involving a beautiful princess
    and friendship between kings. The king sends Kevatta to speak with Mahosadha and
    reconcile an earlier quarrel. Mahosadha, called the Great Being, arranges a staged
    sickroom-like audience to avoid speaking with Kevatta: ghee is used as the excuse,
    seats are removed, attendants enforce silence through seven gates, and Kevatta
    is humiliated and driven away. Kevatta reports that Mahosadha said nothing and
    denounces him. The king, though displeased, concludes that Mahosadha must have
    foreseen some future danger.'
  language: English
  quote_policy: summarized
