  text: When Kevatta reaches the sage, the sage appears about to speak, but attendants
    stop him using the ghee explanation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Kevatta cannot find a place to sit or stand near the bed and passes over the
