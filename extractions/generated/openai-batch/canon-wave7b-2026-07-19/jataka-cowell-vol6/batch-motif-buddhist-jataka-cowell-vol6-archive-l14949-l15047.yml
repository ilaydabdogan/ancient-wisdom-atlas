canonical_text:
  quote: ''
  summary: A drought and famine afflict Kalinga. After the Kalinga king's vow and
    observance fail to bring rain, citizens advise him to obtain Vessantara's all-white
    rain-bringing elephant. Eight brahmins are sent to Jetuttara and ask Vessantara
    for the elephant while he is giving alms. Vessantara resolves to fulfill their
    wish, dismounts, and gives the elephant with its costly ornaments, equipment,
    and attendants. The gift is accompanied by an earthquake, trembling of the town,
    and a great roar, which the Master explains in stanzas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: There is drought in Kalinga; corn does not grow, famine is severe, and some
    people resort to robbery.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people gather in the king's courtyard and reproach the Kalinga king about
    their condition.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Kalinga king promises to bring rain and keeps a virtue pledge and holy-day
    vow for seven days, but rain does not come.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The citizens say Vessantara of Jetuttara, son of King Sahjaya, is devoted
    to charity and owns a glorious all-white elephant wherever whose movement rain
    falls.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Kalinga king selects eight brahmins, gives them provisions, and sends
    them to fetch Vessantara's elephant.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The brahmins travel to Jetuttara, receive hospitality in the alms-hall, cover
    themselves with dust and mud, and position themselves at city gates on the full-moon
    day.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Vessantara washes with sixteen pitchers of perfumed water, breaks his fast,
    mounts his richly adorned elephant, and proceeds toward the alms-hall and city
    gates.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The brahmins hail Vessantara, stretch out their hands, and ask him for the
    precious elephant.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Vessantara thinks that he is willing to give anything of his own, even from
    his head onward, and that the elephant is external to him; he resolves to fulfill
    the brahmins' wish.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Vessantara dismounts from the elephant and gives it to the brahmins.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The gift includes the elephant's costly ornaments, equipment, canopy jewels,
    attendants, grooms, and stablemen; the elephant itself is described as priceless.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the elephant is given, an earthquake occurs, the town trembles, hair
    bristles with terror, and the city rings with a great roar.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: The Master explains the event by speaking stanzas about the terror, earthquake,
    trembling town, and city roar when the great elephant was given.
  category: speech
  evidence_refs:
  - ev:8
