canonical_text:
  quote: ''
  summary: The king asks whether the Bodhisat can answer Senaka. The Great Being refutes
    Senaka and praises wisdom over wealth. Senaka cannot answer. The king rewards
    the Great Being richly. Later, Queen Udumbara proposes finding him a wife. The
    Great Being decides to seek one himself, goes out alone in the outfit of a tailor,
    and meets Amara, a wise young woman from a decayed merchant family. They recognize
    one another as possible marriage partners, and he tests her understanding by gesture.
  language: English
  quote_policy: summarized
