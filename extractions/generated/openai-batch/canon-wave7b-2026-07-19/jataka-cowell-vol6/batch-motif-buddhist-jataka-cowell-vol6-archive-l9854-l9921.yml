canonical_text:
  quote: ''
  summary: The passage recounts a divine medicine that cures diseases and gives its
    name to Osadha Kumara. The child, called the Great Being, is associated with thousands
    of boys born at the same time. At seven years old he responds to weather and other
    disruptions by organizing the boys to fund a public hall. He corrects the carpenter's
    plan, arranges spaces for lodging, justice, religious assemblies, trade storage,
    sports, alms distribution, and later adds a tank and park. His civic works draw
    crowds, and he sits in the hall giving judgments; several constructions are compared
    to heavenly models.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A medicine is rubbed on a grindstone, mixed with water, and cures all diseases
    when it touches affected bodies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The merchant names the child Osadha Kumara after the medicine rather than
    after an ancestor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The merchant thinks his son has great merit, learns that thousands of boys
    were born at the same time, and arranges nurses, clothing, and attendance for
    them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: At seven years old the Great Being is described as beautiful as a golden statue
    and plays with the other boys.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Animals, heat, rain, and an unseasonable storm disturb the children's games;
    when the children run for shelter, some fall and bruise themselves.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Great Being proposes building a hall where the children can stand, sit,
    or lie during wind, heat, or rain, and asks each boy to bring money.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the carpenter fails to grasp his design, the Great Being draws out the
    plan himself and instructs the carpenter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The hall is arranged with separate spaces for strangers, the destitute, destitute
    women giving birth, Buddhist priests and Brahmins, other men, and foreign merchants'
    goods.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The complex includes a public sports place, a court of justice, and a hall
    for religious assemblies, and is painted by selected painters.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: A tank is constructed with many bends and bathing ghats, lotus-covered water,
    and a surrounding park with trees.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: A public distribution of alms is established near the hall for holy men, strangers,
    and people from neighboring villages.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Crowds gather, and the Great Being sits in the hall, discusses right and wrong
    in petitioners' circumstances, and gives judgments.
  category: action
  evidence_refs:
  - ev:10
