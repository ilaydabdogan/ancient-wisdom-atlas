canonical_text:
  quote: ''
  summary: A first-person speaker rejects Vedic and Brahmin ritual claims, especially
    fire worship and animal sacrifice. The speaker argues that fire is insatiable
    and ordinary, that Brahma and caste doctrines are unjust or fabricated, that sacrificial
    animals do not consent to death, and that priests exploit offerers with ritual
    promises and objects such as the sacrificial post and Butea shoot.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says the Vedas have no hidden power to save immoral persons and
    that tended fire ultimately leaves its base master without hope.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker describes fire as insatiable, saying even all the trees of the
    earth could not satisfy it, and asks how a Naga could fill it.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker uses milk changing into butter and curds as an analogy for change,
    then says fire once stirred mounts higher and higher.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The speaker states that fire does not burst forth from dry or new wood by
    itself and needs effort before appearing.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The speaker argues that piling fuel on fire gives no merit, comparing ritual
    fires with fires lit by cooks, blacksmiths, and corpse-burners.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:6
  text: The speaker says some worship fire as a god and others call water a god, but
    declares both unworthy of being called gods.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:7
  text: The speaker says Brahmins need a livelihood and therefore say that Brahma
    worships fire, then questions why an increate planner would worship a creature
    of his own hand.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: The passage reports a doctrine assigning Brahmins to study, Khattiyas to command,
    Vessas to plough, and Suddas to serve.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The speaker calls the propagators of these doctrines greedy liars and asks
    why Brahma does not correct pain, fraud, falsehood, and injustice.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The speaker says some people are counted pure while killing frogs, worms,
    bees, snakes, or insects, and rejects such customs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The speaker says cattle do not ask to be slain and instead go unwillingly
    to death while struggling.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The speaker says Brahmins use rhetoric to veil the sacrificial post, victim,
    and blow, calling the post a cow of plenty that secures desires.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The speaker says priests solicit wealth and bodily offerings such as cut nails,
    beard, and hair, gather around the offerer, and leave him bankrupt.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The speaker says priests hold a Butea shoot as part of an old rite and call
    it Indra's right arm, but disputes its practical power.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage mentions a claim that mountain-ranges were once heaps in ancient
    altar-yards.
  category: setting
  evidence_refs:
  - ev:9
