canonical_text:
  quote: "“the sage's heart won in fair fight”"
  summary: Punnaka explains that he seeks the Great Being's heart as the demanded
    prize for marrying the Naga maiden Irandati. The Great Being infers a misunderstanding,
    asks to be lifted from danger so he can teach the laws of the good man before
    death, and Punnaka carries him to a mountain summit. After bathing, receiving
    food and adornment, and sitting on a decorated seat, the Great Being teaches rules
    about gratitude, hospitality, loyalty to friends, avoiding treachery, and avoiding
    the power of unchaste women.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Punnaka says that the Naga kinsfolk will give him the Naga maiden Irandati
    if he brings the sage's heart won in fair fight.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Punnaka states that this marriage condition is why he is set on killing the
    Great Being and taking his heart.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Great Being reflects that Vimala has no need of his heart and that Punnaka's
    actions may have arisen from a misconception connected with Varuna's report of
    his discourse on the law.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: While hanging head downward, the Great Being asks Punnaka to hold him up if
    his heart is needed and offers to declare the laws of the good man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Punnaka lifts the Great Being from the precipice and places him on the summit
    of the mountain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: On the mountain summit, Punnaka asks the Teacher of lofty wisdom to tell him
    all the laws of the good man, while the Great Being is described as sitting and
    looking at a pipul tree.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Great Being says that his body is dirty and bathes; Punnaka brings water,
    heavenly cloth, perfumes, and heavenly food.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Great Being causes the top of the Black Mountain to be adorned, prepares
    a decorated seat, sits on it, and utters a stanza on the duty of the good man.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The concise teaching tells the youth to follow the path already traversed,
    put away the soiled hand, not be treacherous to friends, and not fall into the
    power of unchaste women.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Punnaka asks for the meaning of the four rules because he cannot comprehend
    them in their concise form.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Great Being explains the teaching through rules about honoring one who
    receives a stranger, not forming evil thoughts against a host who gives lodging
