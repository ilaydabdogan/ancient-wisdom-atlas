canonical_text:
  quote: ''
  summary: The passage describes Vessantara's children lamenting the loss of their
    forest play-place as Jujaka leads them away. Vessantara grieves intensely after
    giving the children, considers pursuing and killing the brahmin, but restrains
    himself because taking back a gift is not righteous. Jujaka beats and binds the
    children; they briefly escape when he falls but are recaptured with cord and staff
    while Vessantara is forced to watch.
  language: English
  quote_policy: summarized
