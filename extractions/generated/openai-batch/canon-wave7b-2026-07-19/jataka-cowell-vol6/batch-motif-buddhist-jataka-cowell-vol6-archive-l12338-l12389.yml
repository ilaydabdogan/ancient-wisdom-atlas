canonical_text:
  quote: ''
  summary: 'During a siege, Brahmadatta and Kevatta consider cutting off the city’s
    water, food, and wood supplies. Each plan is countered by displays and explanations
    of abundance: an extraordinary lily stalk, rice growing above the rampart, and
    a visible heap of firewood. Mahosadha/the Bodhisat is presented as foreseeing
    danger, using spies or scouts, and frustrating the blockade plans.'
  language: English
  quote_policy: summarized
