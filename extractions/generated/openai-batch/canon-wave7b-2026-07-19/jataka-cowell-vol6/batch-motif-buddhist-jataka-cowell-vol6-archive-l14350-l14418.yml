canonical_text:
  quote: ''
  summary: A female ascetic privately tests the king with a hypothetical question
    about sacrificing companions to a water-demon at sea. The king says he would give
    up kin, friend, brahmin, and himself before giving up Mahosadha. The ascetic repeats
    the test publicly, praises the king's mother, and the king replies by acknowledging
    her merits but naming faults for which he would give her to the water-demon.
  language: English
