  summary: A knowledgeable speaker decides to help a group rather than let them be
    punished. He instructs them in a set of Pali stanzas without revealing what the
    king truly saw. The next day Senaka answers the king by reciting one of the taught
    stanzas, which mentions young beggars, young princes, ram's flesh, dog's flesh,
    and possible friendship between a ram and a dog.
