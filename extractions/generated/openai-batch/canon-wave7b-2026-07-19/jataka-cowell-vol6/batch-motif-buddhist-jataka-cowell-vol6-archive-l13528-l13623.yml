canonical_text:
  quote: ''
  summary: In a moment of danger, the king and his advisers seek a plan. Several counsellors
    propose self-destruction to avoid death by Brahmadatta, while Devinda says Mahosadha
    alone can save them. The king laments his distress and failed advisers. Mahosadha
    consoles him, promises rescue for the king, court, chariots, and army, and orders
    his followers to open a decorated tunnel, whose door and mechanical bolts are
    opened.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Senaka addresses Mahosadha as firm ground for the king and the group in a
    mighty ocean and asks him to deliver them from woe.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mahosadha reproaches Senaka and says that it is too late and difficult for
    him to deliver Senaka, who must decide for himself.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king is terrified, cannot find an opening, and asks Senaka what ought
    to be done.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Senaka proposes setting fire to the door, taking a sword, and wounding one
    another so that Brahmadatta will not kill them by a lingering death.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Pukkusa proposes poison, Kavinda proposes a noose or casting themselves from
    a height, and Devinda repeats the fire and sword plan while saying Mahosadha can
    save them easily.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Devinda thinks that no one except Mahosadha can save them and criticizes the
    king for asking others instead of Mahosadha.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The king remembers his ill-treatment of the Bodhisat and laments that he has
    found no answer among worthless and foolish men.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The king describes bodily distress, including a throbbing heart, parched mouth,
    restlessness, and inward burning like a smith's fire.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mahosadha sees the king's sorrow and speaks to console him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Mahosadha promises to set the king free, together with his chariots and army,
    and to scare away Pancala.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Senaka asks how Mahosadha will get away with them all, and Mahosadha answers
    that it will be by a decorated tunnel.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Mahosadha orders his men to open the mouth of the entrance so that Vedeha
    and his court can go through the tunnel.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Mahosadha's followers open the tunnel door and mechanical bolts, and the tunnel
    shines like a decorated hall of the gods.
  category: action
  evidence_refs:
  - ev:8
