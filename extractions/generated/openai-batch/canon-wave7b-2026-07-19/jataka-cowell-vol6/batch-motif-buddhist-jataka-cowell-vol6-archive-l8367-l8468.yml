canonical_text:
  quote: ''
  summary: Punnaka, a Yakkha, decides that Vidhura-pandita cannot be taken by force
    and plans to win control through gambling with King Dhananjaya Koravya. He takes
    a precious jewel from Mount Vepulla near Rajagaha, arrives at Indapatta, challenges
    the Kuru court, conceals his servant identity by naming himself Kaccayana, and
    offers a miraculous jewel and steed as gaming stakes. He demonstrates the steed's
    supernatural speed and movement over water and lotus leaves, then begins to show
    the jewel's wondrous contents.
  language: English
  quote_policy: summarized
