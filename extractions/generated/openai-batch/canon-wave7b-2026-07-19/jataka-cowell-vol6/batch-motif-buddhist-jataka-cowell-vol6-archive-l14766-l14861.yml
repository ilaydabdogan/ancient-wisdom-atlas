canonical_text:
  quote: ''
  summary: Phusati receives ten boons from Sakka, is reborn as a princess, marries
    Sanjaya of Sivi, and later conceives the Great Being after Sakka directs his descent
    from the Heaven of the Thirty-Three. Her pregnancy is marked by almsgiving, prophecy
    of a child devoted to giving, increased royal prosperity, and the birth of a son
    during a royal city procession.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Phusati asks Sakka for a set of boons, including life in Sivi's realm, dark
    eyes and eyebrows, the name Phusati, a generous and renowned son, preserved bodily
    beauty, the ability to free the condemned, and queenly status.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sakka states that all ten boons granted to Phusati will be fulfilled in the
    Sivi kingdom.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: After choosing her boons, Phusati leaves that world, is conceived in the womb
    of King Madda's queen, is named Phusati at birth, and grows up with many attendants.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Prince Sanjaya, son of the King of Sivi, is to be invested with the White
    Umbrella; Phusati is brought as his bride and made Queen Consort.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sakka recalls that nine of Phusati's ten boons are fulfilled and identifies
    the remaining boon as the birth of a goodly son.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sakka approaches the Great Being in the Heaven of the Thirty-Three and tells
    him to enter the human world by being conceived in Phusati's womb.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Great Being comes down and is reborn in Phusati; sixty thousand sons of
    gods are born in the families of sixty thousand courtiers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: When Phusati finds herself with child, she wants six alms-halls built at the
    four city gates, in the middle of the city, and at her own door, with a large
    daily distribution.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Fortune-tellers tell the king that the being conceived in the queen's womb
    is devoted to almsgiving and will never be satisfied with giving.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: From the time of the Bodhisat's conception, the king's revenue increases greatly,
    and kings of all India send presents.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: At the end of ten months, Phusati rides in a royal procession through the
    decorated city; labor begins in the Vessa quarter, and she gives birth to a son
    in a chamber made there by the king.
  category: sequence
  evidence_refs:
  - ev:10
