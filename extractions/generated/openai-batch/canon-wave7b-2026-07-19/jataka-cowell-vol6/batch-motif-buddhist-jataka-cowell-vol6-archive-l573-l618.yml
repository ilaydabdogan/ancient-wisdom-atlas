canonical_text:
  quote: ''
  summary: A youth identified as Temiya, prince, and the Bodhisatta is subjected to
    repeated tests meant to reveal movement, fear, discomfort, or responsiveness.
    Watchers, drums, sudden lamplight, flies with molasses, enforced uncleanness,
    fire under the bed, public reproach, and parental pleas all fail to make him reveal
    a weak point. He remains motionless, recalling the torments and fires of hell
    as worse than his present suffering.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Observers watched him through holes in a curtain for a whole day and did not
    detect confusion of thought, disturbance of hand or foot, or a start.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: They tested him for another year with drums and still did not discover his
    weak point.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At night they used lamps in jars to create a sudden blaze and watched his
    behaviour, but did not see him start.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: They smeared his body with molasses, laid him in a place infested with flies,
    and the flies covered and bit him while he remained motionless.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: When he was fourteen, they withheld bathing, rinsing, and bodily ablutions
    until he was in a miserable and unclean condition.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: People came around and reviled him, telling him to rise and cleanse himself,
    but he lay quietly in his squalor.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: They put pans of fire in the bed under him; boils seemed to break out, but
    he remained motionless after comparing this heat with the fire of Avici hell.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: His parents removed him from the fire, implored him as prince Temiya, and
    said they had gained him as their child after many prayers; he remained as if
    he did not hear them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the parents went away weeping, his father or mother sometimes returned
    alone to implore him, and the tests continued for a year without revealing a weak
    point.
  category: sequence
  evidence_refs:
  - ev:8
