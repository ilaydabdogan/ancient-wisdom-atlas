canonical_text:
  quote: ''
  summary: A one-month-old Bodhisatta, Temiya, is presented to his king-father and
    hears harsh sentences imposed on robbers. He recalls former births, including
    kingship followed by long suffering in hell, and fears that becoming king again
    will lead to hell. A goddess dwelling in the royal umbrella, formerly his mother
    in another birth, advises him to feign incapacity and lack of intelligence; he
    agrees and begins practicing this concealment.
  language: English
  quote_policy: summarized
