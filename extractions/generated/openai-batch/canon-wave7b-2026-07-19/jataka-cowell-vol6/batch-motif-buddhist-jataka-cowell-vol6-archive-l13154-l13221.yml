canonical_text:
  quote: ''
  summary: King Ciilani welcomes the Bodhisat Mahosadha while privately planning to
    kill him and King Vedeha. Mahosadha says he has come to prepare a dwelling for
    Vedeha, gains permission to make repairs and choose houses, uses the stairway
    area to prepare a tunnel exit, posts his own guards to control access, and has
    his men pressure the queen-mother by attacking her house and blocking her from
    the palace.
  language: English
  quote_policy: summarized
