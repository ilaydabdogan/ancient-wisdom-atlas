canonical_text:
  quote: ''
  summary: Vessantara, called the Great Being, arrives with Maddi and the children
    outside the Ceta city but does not enter it. Maddi makes their arrival known,
    and the people and Ceta princes mourn at the family's reduced condition. Vessantara
    explains that he was banished after giving away a royal white elephant. The Ceta
    princes offer hospitality and then kingship, but he refuses to stay or rule, accepts
    only their goodwill, and continues toward Vamka hill/Gandhamadana as a forest
    dwelling with his wife and children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Great Being does not enter the city but sits in a hall at the city gate.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Maddi brushes and rubs the dust from the Great Being's feet, then goes out
    to stand where she can be seen, and women gather around her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women remark that Maddi once rode in a palanquin or chariot but now must walk,
    with the woods as her abode.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: People report the arrival of Vessantara, Maddi, and the children to the king,
    and sixty thousand princes come weeping and lamenting.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Ceta princes ask Vessantara where his army, royal car, chariot, and horse
    are, and whether he has been defeated by enemies.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Vessantara states that he gave away the white saviour elephant with its jewels,
    yak-tail fan, trappings, white parasol, physician, and driver.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Vessantara states that the people were angry, his father took the gift badly,
    and he was banished; he says he is going to Vamka hill and asks for a dwelling
    place.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Ceta princes welcome Vessantara and offer him herbs, roots, honey, meat,
    rice, and guest hospitality.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Ceta princes ask Vessantara to stay in Ceta and later offer him their
    realm, asking him to govern it as king.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Vessantara refuses to have a message sent to the Sivi king and says the palace
    folk and townsfolk had gathered in anger because of him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Vessantara refuses Ceta kingship, saying that the Sivi people would be displeased
    if he were consecrated while banished and that he does not want quarrelling.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Ceta princes honor Vessantara outside the city, adorn and screen the hall,
    guard it, feed him the next morning, and escort him fifteen leagues to the edge
    of the wood.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: At the wood's entrance, the Ceta folk describe the remaining route and point
    him north toward Gandhamadana, where he may stay with his wife and children.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The Ceta folk describe a king who leaves the world as peaceful by his sacred
    fire.
  category: speech
  evidence_refs:
  - ev:10
