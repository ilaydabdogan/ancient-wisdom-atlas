canonical_text:
  quote: ''
  summary: 'The passage describes Mahosadha''s large-scale tunnel and city works:
    workers conceal excavated earth through river disposal and urban construction,
    the great tunnel is fitted with mechanical doors, lamps, chambers, and cosmological
    paintings, and hidden ships are prepared. After the city and tunnels are completed,
    the Great Being summons King Vedeha. Vedeha arrives, sends a marriage request
    to King Culani/Brahmadatta, and Culani outwardly welcomes him while inwardly planning
    violence against his enemies.'
  language: English
  quote_policy: summarized
