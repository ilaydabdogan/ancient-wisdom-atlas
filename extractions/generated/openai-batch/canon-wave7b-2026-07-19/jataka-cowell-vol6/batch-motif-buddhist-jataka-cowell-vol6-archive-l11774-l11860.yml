canonical_text:
  quote: ''
  summary: Several men disclose dangerous secrets involving hidden crime, disease,
    possession, and a stolen lucky gem, while Mahosadha, the Great Being, carefully
    notes them. The men intend to kill him. After being taken home, he anticipates
    a message from Queen Udumbari. The king, distressed by his order to have Mahosadha
    killed, confesses his grief to the queen. Udumbari outwardly consoles the king,
    then secretly sends Mahosadha a warning letter hidden in a sweetmeat and sealed
    jar. Mahosadha receives, opens, and reads the message, understands the danger,
    deliberates, and goes to rest.
  language: English
  quote_policy: summarized
