canonical_text:
  quote: ''
  summary: In the Nimi-Jataka passage, deities ask Sakka to summon righteous King
    Nimi, whom they call their teacher. Sakka sends Matali with a divine chariot to
    Mithila. On the full-moon night the chariot appears like a second moon, Matali
    summons Nimi, and Nimi enters after instructing his people to do good and give
    alms. Matali offers to take him to the places where the wicked or the good dwell;
    Nimi chooses to see hell first. Matali shows him the hell-river Vetarani and explains
    that those who harmed and oppressed the weak are cast there.
  language: English
  quote_policy: summarized
