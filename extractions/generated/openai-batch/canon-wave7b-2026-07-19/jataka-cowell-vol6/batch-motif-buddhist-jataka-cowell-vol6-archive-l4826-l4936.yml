canonical_text:
  quote: ''
  summary: A condemned royal prince is taken toward a sacrificial pit while relatives,
    queens, and citizens lament and plead for his life. Vasula briefly persuades the
    king to release his father, but Khandahala urges the king to continue the sacrifice
    for heavenly reward. The royal women and the city mourn; gates are blocked, birds
    gather, and Queen Gotami prostrates before the king begging that her son be spared.
  language: English
