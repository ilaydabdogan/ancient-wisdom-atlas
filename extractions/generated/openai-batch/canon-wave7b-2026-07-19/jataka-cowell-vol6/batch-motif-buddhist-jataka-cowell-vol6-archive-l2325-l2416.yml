canonical_text:
  quote: "“Would'st thou be happy? be alone; only the lonely happy are.”"
  summary: 'At the city gate and later at a fletcher''s house, the Bodhisatta encounters
    two everyday examples: bracelets that make noise only when paired, and an arrow-maker
    who closes one eye to focus. Both are interpreted within the passage as lessons
    favoring solitary renunciation, and the Bodhisatta twice tells Sivali to take
    a separate path.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: At the city gate, boys are playing, and a girl is shaking sand in a small
    winnowing basket.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl has one bracelet on one hand and two bracelets on the other; the
    two bracelets jangle together, while the single bracelet is noiseless.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king thinks that Sivali keeps following him and that a wife is a bane
    to an ascetic; he decides to ask the girl so Sivali may hear the explanation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The girl explains that the sound comes from contact between two bracelets,
    while a single bracelet remains silent; she concludes that one should be alone
    to be happy.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king addresses the queen, says the second brings blame, tells her there
    are two paths, and declares that they should no longer call each other husband
    and wife.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The queen tells him to take the better right-hand path while she takes the
    left, but after going a little way she returns in grief, and they enter the city
    together.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After entering Thuna, the Bodhisatta goes on his begging-round to the door
    of an arrow-maker, while Sivali stands on one side.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The arrow-maker heats an arrow in coals, wets it with sour rice-gruel, closes
    one eye, and uses the other to make the arrow straight.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The arrow-maker explains that using both eyes distracts the view, while a
    single line fixes the aim and makes vision true; he repeats the advice that the
    solitary are happy.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the advice, the Great Being continues his round, collects food, leaves
    the city, sits in a place pleasant with water, puts away his bowl, and addresses
    Sivali.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Great Being tells Sivali that the fletcher, like the girl, would bring
    shame on him if he yielded to her request; he again says there are two paths and
    rejects the husband-wife relation.
  category: speech
  evidence_refs:
  - ev:8
