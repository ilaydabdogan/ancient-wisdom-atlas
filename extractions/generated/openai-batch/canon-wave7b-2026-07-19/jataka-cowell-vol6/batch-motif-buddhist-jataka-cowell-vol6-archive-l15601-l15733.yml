canonical_text:
  quote: ''
  summary: Vessantara gives extensive gifts and is described as banished from the
    land. A deity spreads news of his giving, and various social groups receive gifts.
    At evening Vessantara travels with Maddi to take leave of his parents. He tells
    his father and mother that he will go to Vamka hill and the panther-haunted wood.
    Phusati blesses him but urges him to leave Maddi and the boys behind. Vessantara
    says Maddi may choose for herself. Sanjaya warns Maddi of the hardships and dangers
    of forest life, but she declares that she will go with Vessantara and accept the
    terrors.
  language: English
  quote_policy: summarized
