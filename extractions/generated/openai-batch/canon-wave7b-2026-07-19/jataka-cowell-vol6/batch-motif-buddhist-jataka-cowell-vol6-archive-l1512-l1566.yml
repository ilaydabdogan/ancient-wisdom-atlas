canonical_text:
  quote: ''
  summary: Sakka departs. A pregnant queen sits in a hall at Campa after fleeing the
    killing of King Aritthajanaka in order to save her unborn child. A Brahmin teacher
    with five hundred disciples sees her and, through the power of the being in her
    womb, feels sibling-like affection toward her. He protects her by presenting her
    as his sister, brings her into his household, and his wife cares for her. She
    gives birth to Prince Mahajanaka. As a boy he is taunted as the widow's son, questions
    his mother about his father, forces a confession while nursing, and learns that
    he is the son of King Aritthajanaka of Mithila. By sixteen he has learned the
    three Vedas and all the sciences.
  language: English
  quote_policy: summarized
