canonical_text:
  quote: ''
  summary: Blind parents ask the Kasi king to lead them to their injured son Sama.
    The king warns them of a dangerous forest but eventually guides them. They find
    Sama prostrate, dusty, wounded, and apparently poisoned, and they lament their
    dependence on him. Sama's mother, then his father, and then a hidden goddess on
    Gandhamadana mount perform solemn acts of truth so that the poison may lose its
    force. Sama rises restored, the parents regain their sight, and dawn appears;
    Sama reassures them that he is safe and well.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sama's parents respectfully raise their hands and petition the Kasi king to
    guide them with the end of a staff to the place where Sama lies.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The parents say they will touch Sama's face, eyes, and limbs and wait for
    death near him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king warns that Sama lies in a region full of beasts of prey, at a place
    described as the world's furthest end, and urges the parents to remain in their
    cottage.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The parents answer that they have no fear of beasts of prey, even if they
    swarm in great numbers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Unable to stop them, the king takes the parents by the hand and leads them
    to Sama.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: When shown their son, the father clasps Sama's head to his bosom, the mother
    clasps his feet, and both sit down and lament.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sama is described as covered with dust, pierced to the heart, prostrate, and
    like the sun or moon fallen from the sky.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The parents lament that Sama used to tend them by dressing their matted locks,
    sweeping, bringing hot or cold water, and fetching roots and fruits for them as
    a blind old couple.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: After long lamentation, Sama's mother concludes that he has swooned because
    of poison and performs a solemn asseveration of truth to remove the poison.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The mother's truth-statement invokes Sama's virtuous life, truthfulness, care
    for his parents, and the parents' accumulated merit so that the poison may be
    overpowered.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the mother's truth-act Sama turns where he lies; after the father makes
    the same solemn asseveration, Sama turns onto the other side.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A hidden goddess on Gandhamadana mount, moved by pity, performs her own solemn
    act of truth and asks that all the poison's power depart from Sama.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the truth-acts, Sama springs up young, fair, and vigorous; his recovery,
    his parents' restored sight, and the appearance of dawn occur together by the
    goddess's supernatural power.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Sama tells his parents that he is safe and well and asks them to dry their
    tears and rejoice.
  category: speech
  evidence_refs:
  - ev:10
