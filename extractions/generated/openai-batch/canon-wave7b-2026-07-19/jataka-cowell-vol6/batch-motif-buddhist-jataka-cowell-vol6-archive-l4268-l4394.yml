canonical_text:
  quote: ''
  summary: King Nimi journeys in Matali's celestial car through heavenly regions,
    sees the ring of hills around Sineru and the gates and halls of the Heaven of
    the Thirty-three, is welcomed by the gods and Sakka, declines celestial pleasures
    given by another, resolves to earn merit through good deeds, returns to Mithila,
    and exhorts his people to give alms and do good so they may be born in the divine
    realm.
  language: English
  quote_policy: summarized
