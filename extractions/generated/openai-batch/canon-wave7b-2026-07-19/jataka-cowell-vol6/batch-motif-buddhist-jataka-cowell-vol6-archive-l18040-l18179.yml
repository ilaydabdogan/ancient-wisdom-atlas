canonical_text:
  quote: ''
  summary: Royal children who have become a brahmin's slaves are ransomed by their
    grandfather, King Sanjaya. After the children are washed, fed, dressed, and held
    by their grandparents, Jali reports on his parents' wilderness life and his mother's
    hardship. Jali reproaches the king for banishing his son; the king acknowledges
    fault, promises wealth and rule to Vessantara, and orders a royal expedition and
    decorated road toward Mount Vanka.
  language: English
  quote_policy: summarized
