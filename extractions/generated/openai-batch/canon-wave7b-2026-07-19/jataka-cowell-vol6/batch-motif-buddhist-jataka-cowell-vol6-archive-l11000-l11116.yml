canonical_text:
  quote: ''
  summary: In a royal court exchange, Senaka argues repeatedly that wealth is superior
    to wisdom, using examples of prosperity, social influence, possessions, and the
    king's attendants. Mahosadha answers that wisdom is superior to foolish wealth,
    because a wealthy fool is unstable, morally culpable, subject to downfall, and
    destined for misery, while the wise person is truthful, honored, and happy hereafter.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king turns to Senaka after saying that Mahosadha has declared the wise
    man to be best.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Senaka calls Mahosadha a child whose mouth still smells of milk and argues
    that Luck can make an idiot such as Gorimanda prosper.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mahosadha answers that Senaka is like a crow where rice is scattered and like
    a dog trying to lap up milk; he says a small-witted person intoxicated by wealth
    writhes like a fish in hot sun when struck by luck or misfortune.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Senaka compares crowds around a rich man to birds gathering from all quarters
    to a forest tree with sweet fruit.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mahosadha says a powerful fool who wins treasure by violence is dragged off
    to hell.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Senaka compares the world's devotion to wealth to streams entering the Ganges
    and the Ganges entering the sea, where names and kinds are lost.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mahosadha replies that the ocean, though fed by innumerable rivers, cannot
    pass beyond the shore, and compares this limit to the inability of a fool's prosperity
    to surpass the wise.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Senaka says a wealthy man in high position may lack self-control but his words
    have weight among his kinsfolk, while wisdom without wealth does not have that
    effect.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Mahosadha says a fool speaks falsely for his own or another's sake, is shamed
    in company, and hereafter goes to misery; he contrasts this with the wise person
    who does not lie, is honored in assembly, and hereafter goes to happiness.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: Senaka lists elephants, kine, horses, jewelled earrings, and women as goods
    found in rich families for the enjoyment of the rich man.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Mahosadha says the foolish and unwise person is cast off by Fortune as a snake
    casts off its old skin.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Senaka says five wise men wait upon the king with gestures of respect and
    compares the king to Sakka, king of the gods.
  category: speech
  evidence_refs:
  - ev:12
