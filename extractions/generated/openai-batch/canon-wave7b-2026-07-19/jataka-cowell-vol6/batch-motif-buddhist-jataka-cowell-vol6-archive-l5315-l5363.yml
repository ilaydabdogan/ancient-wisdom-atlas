canonical_text:
  quote: ''
  summary: The king of Benares prepares water-filled conveyances and a lake for his
    sons, who are described as having a watery nature. A tortoise enters the lake;
    the princes are frightened and identify it as a yakkha or demon. The king orders
    punishment, and after several proposals a water-fearing minister suggests throwing
    the tortoise into the whirlpool of the Yamuna. The tortoise protests that this
    punishment is especially cruel, causing the king to choose it. In the Yamuna the
    tortoise finds a current to the dwelling of the Nagas, where young sons of the
    Naga king Dhatarattha seize him. The tortoise then invents a story that he is
    Cittacula, a messenger from the king of Benares bearing a marriage proposal for
    Dhatarattha.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king commands that a ship be hollowed out, placed on a cart, filled with
    water, and strewn with flowers for his sons, who are said to have a watery nature.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Benares, the king enters an adorned city, sits on a terrace with attendants,
    holds a seven-day drinking feast, and has a lake prepared for his sons.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A tortoise enters the lake with incoming water, floats, rises, puts out its
    head, looks at the boys, and sinks again.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The boys are frightened and tell their father that a yakkha has frightened
    them in the lake; after the tortoise is caught, they call it a demon.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The king orders men to seize the tortoise, and they catch it with a net and
    show it to him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The king, angered by love for his sons, orders attendants to punish the tortoise.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Various proposed punishments include pounding the tortoise with pestle and
    mortar, cooking it repeatedly, baking it on hot coals, and baking it in a jar.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: One minister, described as afraid of water, proposes throwing the tortoise
    into the whirlpool of the Yamuna as the harshest punishment.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The tortoise speaks, asks what sin he has committed, and says he can bear
    the other punishments but that the Yamuna punishment is excessively cruel; the
    king chooses that punishment.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: When thrown into the Yamuna, the tortoise finds a current leading to the dwelling
    of the Nagas and reaches their place.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Young sons of the Naga king Dhatarattha are sporting in the stream, see the
    tortoise, and call for him to be seized.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The tortoise thinks he has escaped the king of Benares only to fall into the
    hands of fierce Nagas, and he considers how to get away.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The tortoise invents a story, names himself Cittacula, claims to be a messenger
    from the king of Benares, and says the king wishes to give his daughter to King
    Dhatarattha.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The young Nagas are pleased, take the tortoise to their king, and report the
    matter; the king orders him brought.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
