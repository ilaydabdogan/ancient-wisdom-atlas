canonical_text:
  quote: ''
  summary: After Vessantara gives the royal elephant to brahmins, the city and earth
    tremble and the people of Sivi protest to King Sanjaya. They describe the elephant
    as a revered white royal and military protector, argue that such a gift is improper,
    and demand that Vessantara be banished rather than killed or imprisoned. Sanjaya
    resists harming his son but agrees to a one-night reprieve before banishment,
    and sends a messenger to warn Vessantara.
  language: English
  quote_policy: summarized
