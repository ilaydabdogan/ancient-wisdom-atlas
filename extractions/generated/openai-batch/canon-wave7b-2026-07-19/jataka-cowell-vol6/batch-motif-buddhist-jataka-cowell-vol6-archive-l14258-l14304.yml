canonical_text:
  quote: ''
  summary: After King Vedeha dies, the Bodhisat raises the royal parasol for the young
    son and then leaves, despite pleas to stay, because of a prior promise to King
    Culani. At Uttarapancala he enters Culani's service. Queen Nanda, hostile to him,
    sets trusted women to find fault with him. A learned religious woman named Bheri
    tests the Bodhisat through hand gestures, and he answers through gestures. The
    queen's confidantes observe the exchange and report it as a plot.
  language: English
  quote_policy: summarized
