canonical_text:
  quote: ''
  summary: A statement claims that study, prayers, and libations in sacred fire protect
    a Brahmin's life. Subhaga hears this, hesitates, and decides to take the addressed
    man to the Naga-world to ask his brothers. He describes a Naga capital beneath
    the Yamuna and reaching toward the Himalaya, where Dhatarattha is seated and his
    brethren dwell. He says their judgment will determine the final sentence, then
    seizes the man and carries him to the gate of the Great Being's palace.
  language: English
  quote_policy: summarized
