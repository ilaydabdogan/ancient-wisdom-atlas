  summary: The preface passage discusses limits on pantheistic interpretation in Greek
    and Norse religion, divine personification of elements and implements, symbolic
    objects such as hammer, spear, flint, and phallus, transformations or re-presentations
    of gods as forms, heroes, and animals, and examples of Scandinavian mockery or
    rejection of old gods as Christianity approached. It then begins a discussion
    of elements as visible natural bases that might receive divine honours while deity
    remains unseen.
