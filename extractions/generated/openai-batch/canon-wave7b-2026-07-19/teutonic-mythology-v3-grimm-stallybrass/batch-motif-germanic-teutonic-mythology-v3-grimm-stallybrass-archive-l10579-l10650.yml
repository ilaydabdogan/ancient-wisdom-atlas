canonical_text:
  quote: ''
  summary: The passage collects Latin reports and Grimm's commentary on beliefs about
    nocturnal female or lamia processions. Disguised thieves exploit belief in beings
    who multiply goods; an old woman claims to travel at midnight with such beings
    through closed doors; Gervase describes lamiae entering houses, searching household
    vessels, taking infants, lighting lamps, afflicting sleepers, flying over sea
    and world, falling if Christ is named, and appearing as cats. Grimm compares these
    witches' night-trains with visitant fays and elves for whom tables were set, and
    notes later associations with kidnapping, roasting, and devouring.
  language: English with Latin quotations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men disguised themselves in women's clothing, entered a peasant's house with
    torches, danced, sang a formula about taking one and returning a hundred, and
    removed the household goods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The peasant told his wife to be silent and close her eyes because he believed
    the visiting 'good things' would multiply their goods.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: An old woman said she had gone with the 'good things' at midnight, entered
    the priest's house and chamber with lights, and found him asleep.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old woman claimed she covered the sleeping priest so that her ladies would
    not see his nakedness and have him scourged to death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The priest asked how the visitors entered when the house and chamber were
    locked, and the old woman answered that they entered through closed doors.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The priest shut the old woman inside the chancel, beat her with the staff
    of the cross, called her a sorceress, and used her inability to leave as a test
    against her claim.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Gervase describes lamiae as women who at night penetrate houses, search tubs,
    baskets, jugs, and pots, remove infants from cradles, light lamps, and sometimes
    afflict sleepers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Women were said to claim that, while their husbands slept, they traveled with
    a company of lamiae on swift wing across the sea and around the world.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the reported lamia flight, anyone who named Christ would immediately fall,
