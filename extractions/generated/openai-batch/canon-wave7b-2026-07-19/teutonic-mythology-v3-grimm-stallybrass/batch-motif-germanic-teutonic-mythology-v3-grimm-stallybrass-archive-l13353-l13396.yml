  summary: The passage surveys weather and fertility prognostication. It describes
    foretelling winter weather from the breastbones of capon, goose, and duck, notes
    names for weather-watchers or weather-choosers, and reports an Esthonian practice
    in which fish entering the middle of three baskets set in a beck indicated weather
    and fruitfulness; a scaleless fish was taken as a bad sign, prompting ox sacrifice
    for better weather.
