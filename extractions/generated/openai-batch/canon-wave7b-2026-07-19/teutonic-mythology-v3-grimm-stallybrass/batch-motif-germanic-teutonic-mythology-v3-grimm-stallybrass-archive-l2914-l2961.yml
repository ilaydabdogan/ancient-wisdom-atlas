canonical_text:
  quote: ''
  summary: 'The passage surveys accounts in which poetic ability or poetic commission
    comes from an apparitional, divine, or otherwise supernatural source: Helena appears
    to Homer at night; Dionysus appears to the sleeping Aeschylus and commands tragedy;
    Wuotan''s gift comes to Teutonic herdsmen; the dead minstrel Thorleif appears
    to Hallbiorn and unlooses his tongue; a Christian shepherd and Caedmon are linked
    with sleep-visions that enable verse. The passage then states that poetic faculty
    and song-instruments proceed from gods.'
  language: English with embedded Greek
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Helena is reported to have appeared to Homer by night and instructed him to
    sing about those who warred against Troy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The account says Helena wished to make the deaths of the Trojan-war fighters
    more enviable than other men's lives, and that Homer's poetry became lovely and
    renowned chiefly through her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Aeschylus is reported to have fallen asleep as a boy in a field while guarding
    grapes; Dionysus appeared and told him to write tragedy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the Dionysus apparition, Aeschylus is said to have composed easily in
    the morning when he tried to obey.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says Teutonic herdsmen were pasturing sheep or oxen when the gift
    of Wuotan came to them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hallbiorn had wanted to sing praise of the dead minstrel Thorleif but could
    not until Thorleif appeared at night, unloosed his tongue, and displayed his shoulder
    while vanishing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A poor shepherd, while asleep, heard a voice urging him to put the Scriptures
    into Saxon verse; though previously unskilled in song, he understood it from that
    moment and fulfilled the command.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says a similar fuller account is told of Caedmon and that all
    these poets, on waking in the morning, succeed at a task untried before.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that poetic faculty proceeds from the gods and that gods
    invent the instruments by which song is accompanied.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Apollo is identified as playing the phorminx in Homer.
  category: action
  evidence_refs:
  - ev:6
