  summary: The passage surveys witch and magic terminology, including lizard birth
    in witch-trial reports, nightbird and nightmare terms used for witches, Old Norse
    links among witches, troll-women, and giantesses, and Scandinavian sorcery in
    which women, especially volur or volva, are described as leading figures. It also
    describes seið practitioners, the burning of Rognvald and eighty seiðmenn, and
    magic women who wander at evening or night, are hosted, speak prophecy, and sit
    on a four-legged seið-stool during ritual performance.
