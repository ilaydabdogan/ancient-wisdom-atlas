canonical_text:
  quote: ''
  summary: The passage reports variants in which Frederick, or alternatively Charles
    the Great or Charles V, sits in a cave or mountain location while his beard grows
    around a table. When the beard completes a third circuit, the end of the world
    begins with battle, Antichrist, trumpets, and judgment. A withered tree on the
    Walserfeld repeatedly regrows; its leafing and fruiting signal the battle, and
    Frederick hangs his shield on it as men gather. The passage then cites older literary
    parallels concerning Frederick, a leafless tree, Antichrist, and disappearance
    during a hunt. A separate note recounts sailor encounters with a blind giant or
    with an old man named Thore Brack, who questions them about local sacred and ancestral
    sites and asks that stones, mounds, and an altar be preserved.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some accounts place Frederick in a cave or rock near Kaiserslautern, at Trifels
    by Anweiler, or in the Unterberg near Salzburg; some accounts substitute Charles
    the Great or Charles V.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The variants share the detail that a beard grows around a table, and the third
    reaching of the last corner marks the beginning of the end of the world.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The end-time sequence includes a bloody battle on the Walserfeld, the appearance
    of Antichrist, angel-trumpets, and the Last of Days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Walserfeld has a withered tree that has been cut down three times, but
    its root has sprouted and grown into a full tree again.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The tree's next leafing indicates that the terrible fight is near, and the
    fight begins when the tree bears fruit.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Frederick is said to hang his shield on the tree, after which men flock to
    it and a slaughter follows in which the wicked are slain by the righteous.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A sixteenth-century religious poem is reported to speak of Duke Frederick
    winning back the Holy Sepulchre, hanging his shield on a leafless tree, and Antichrist.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: A fourteenth-century lay fragment is reported to say that Emperor Frederick
    disappeared during a hunt and was never seen again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In another account, a blind giant asks sailors whether the church's 'jingling-cow,'
    explained as the bell or belfry, is still alive.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The blind giant tests strength by asking for a hand; the sailors instead give
    him a red-hot boat-bar, which he crushes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the Bahuslan story, a ship's crew driven off course sees a fire at night
    on an out-of-the-way coast and goes ashore.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: An old man by the fire questions a sailor about Hisingen, Thorsby, Ulfveberg,
    stones, barrows, and Glosshed-altar.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The old man asks that the stones and mounds on Ulfveberg not be destroyed
    and that Glosshed-altar be kept in good condition, promising fair weather for
    the return voyage.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The old man names himself Thore Brack, says he once lived there until forced
    to flee, says his kin lie in the mounds of Ulfveberg, and says sacrifices to the
    gods were made at Glosshed-altar.
  category: speech
  evidence_refs:
  - ev:7
