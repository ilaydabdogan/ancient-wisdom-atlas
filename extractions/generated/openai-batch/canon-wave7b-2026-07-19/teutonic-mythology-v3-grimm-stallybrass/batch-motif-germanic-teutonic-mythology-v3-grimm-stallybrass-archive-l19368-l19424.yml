canonical_text:
  quote: ''
  summary: The passage presents multilingual charm material for protection, horse
    ailments, and worms, including Christian invocations and commands to expel disease.
    It comments that some charms concern lame or sick horses and that the bodily progression
    in a worm charm resembles sprain-spells. It then generalizes that old charms pass
    into prayers repeated during sacrifice, especially in pastoral life, and introduces
    Cheremiss Shurem offerings and prayer.
  language: English with Latin and Old Saxon/Old High German charm text
  quote_policy: summarized
