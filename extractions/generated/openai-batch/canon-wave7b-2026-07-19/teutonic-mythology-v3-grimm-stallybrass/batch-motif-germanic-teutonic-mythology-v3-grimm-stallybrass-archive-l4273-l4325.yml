  summary: The passage compares traditions of Perhta/Berahta, Holda, Diana/Frau Unhold,
    Herodias, Abundia, the Vicentine wood-wife, Posterli, and Dziwitza. It notes funeral
    tears and children in Perhta's train, female nocturnal processions in the twelve
    nights around Christmas/New Year, an Entlibuch Posterli-hunt performed with loud
    noise before Christmas, and a footnote account of Dziwitza as an armed woodland
    huntress with hounds.
