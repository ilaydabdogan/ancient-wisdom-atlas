  quote: ''
  summary: 'The passage says that Teutonic stone-legends are comparatively few, then
    surveys several precious-stone traditions and terms: the Eddic holy iarkna-stone,
    Volundr’s ability to make it from children’s eyes, Old English and reconstructed
    Germanic cognates for a precious or holy stone, the royal orphanus/weise stone
    in the imperial crown, and Duke Ernst’s winning of such a stone from living rock
    as a gift for a king.'
