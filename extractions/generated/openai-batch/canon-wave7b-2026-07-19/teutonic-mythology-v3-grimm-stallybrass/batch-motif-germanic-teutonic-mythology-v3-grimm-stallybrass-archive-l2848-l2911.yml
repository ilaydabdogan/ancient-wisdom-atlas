  summary: The passage discusses poetic inspiration and the Old Norse term óðr, including
    Hœnir giving óð to Askr and Embla, Oðr as Freyja’s husband, Kvasir’s world-travel
    and murder by dwarfs, and Oðhrœrir as a vessel or source of a sweet divine poetic
    drink that grants immortality and is sought back by the gods, especially Odin,
    after passing to dwarfs and giants. It compares this drink with amrita, ambrosia,
    and nectar, and adds motifs of a Paradise-derived bee bringing honey of song to
    a sleeper and of poets receiving inspiration overnight in sleep.
