canonical_text:
  quote: ''
  summary: 'The passage collects prescriptions and literary examples concerning the
    ritual time and manner of gathering herbs or roots: gathering before sunrise or
    on St. John the Baptist''s day, fasting, silence, unwashed hands, use of gold,
    silver, sword, or non-iron tools, careful pulling without bruising, guarded herbs,
    and the tying of herbs to a patient''s body or arm.'
  language: English with quoted French, Latin, and German
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cited practice describes gathering a plant very early in the morning while
    fasting, without washing hands, praying, speaking, or greeting anyone, then placing
    it on a bewitched or ensorcelled person.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A chicory root is described as being touched on the feast day of St. John
    the Baptist with gold and silver while kneeling, shortly before sunrise, then
    pulled from the earth with an iron implement and ceremonies after exorcism with
    the sword of Judas Maccabee.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator comments that the chicory-root practice seems Celtic and resembles
    Roman practices, with Judas's sword functioning like a circle-drawing iron implement.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: Another cited superstition has lopping performed with gold instead of iron.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In a Renart episode, Renart finds a desired plant in a meadow, pulls it up
    carefully, eats part without bruising or crushing it, and rubs the remainder on
    his wounds; his skin closes and he is healed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A prescription attributed to Thurneisser says vervain, agrimony, and related
    herbs dug on Friday help to win women's favor, but instructs the gatherer not
    to use iron and to dig with gold.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A song about the herb Hope calls it a precious herb and instructs the gatherer
    to dig quietly; guards are set over it, and if the gatherer is caught he will
    be injured in his highest pledge of happiness.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The narrator compares the warders and watchers of the herb with a woodpecker
    that guards the peony.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Pliny is cited for tying a herb to the left arm so that the sick person does
    not know what it is.
  category: action
  evidence_refs:
  - ev:9
