canonical_text:
  quote: ''
  summary: 'The passage surveys legends of hidden or destructive treasure: a treasure
    known only to one speaker and God, hoards located in mountains or caverns, Etzel
    and Gremild destroyed in connection with mountain-locked Nibelung treasure, and
    the aurum Tolosanum sunk in a lake. It then turns to submerged castles whose towers
    and bells may be perceived in calm water, and to talking beasts that announce
    impending doom.'
  language: English with quoted Middle High German/Norse forms
  quote_policy: summarized
