canonical_text:
  quote: ''
  summary: 'The passage excerpts and comments on accounts of mistletoe: a ritually
    harvested all-healing plant cut from a tree by a white-clad priest with a golden
    sickle after sacrifices involving white bulls; a plant believed to aid fertility
    and counter poison; a plant said to grow through bird-mediated seed and venerated
    in French New-Year and Welsh Christmas customs and names.'
  language: English with quoted Latin
  quote_policy: summarized
