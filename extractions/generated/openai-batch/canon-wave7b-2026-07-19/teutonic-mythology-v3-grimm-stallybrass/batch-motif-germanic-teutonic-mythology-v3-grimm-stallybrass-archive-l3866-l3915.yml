canonical_text:
  quote: ''
  summary: The passage recounts Wod on a white horse giving a peasant game and blood
    to carry in a boot, which later become gold and silver. It then tells of Frau
    Gauden and her twenty-four daughters, whose impious preference for hunting over
    heaven leads to the daughters becoming bitches and the whole train hunting continually
    in the clouds. During the twolven, especially Christmas Eve or New Year's Eve,
    Frau Gauden's hunt approaches human dwellings and sends a dog into open doors,
    disturbing the household.
  language: English
  quote_policy: summarized
