  quote: ''
  summary: The passage gathers examples of rulers whose reigns, births, elections,
    or arrivals are associated with peace, safety, public trust, treasure, fertility,
    and favorable signs in nature. It compares Augustus, the Norse Froði/Fruoto, Helgi,
    Hakon, an unnamed king in Hartmann’s song, Eadwine, and other kings as examples
    of royal peace and blessedness.
