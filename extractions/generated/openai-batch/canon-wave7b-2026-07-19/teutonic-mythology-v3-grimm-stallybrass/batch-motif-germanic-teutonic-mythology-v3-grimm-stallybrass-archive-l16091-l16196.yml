  text: In the Latvian headache cure called Raibiht, the sufferer is measured several
    times around the head with inner lime bark and then crawls through that bast.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Water is poured through holes bored in a healing tree and then drunk.
  category: action
  evidence_refs:
  - ev:2
