canonical_text:
  quote: ''
  summary: 'The passage compares rules and rites for gathering medicinal herbs: a
    Latin note on digging before sunrise with the left hand; Burcard''s account of
    henbane pulled by a naked virgin; AS Herbal instructions for Proserpinaca against
    sore eyes; and a more elaborate elecampane rite for aelf-adle involving sunset
    timing, prayers, a seax, silence, church and altar, milk, holy water, and cross-like
    sword marking. The author comments on Roman, Gaulish, Latin, and Christian ritual
    connections.'
  language: English with Latin and Old English quoted material
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A herb is to be dug with the left hand before sunrise; when gathered in that
    manner it is believed to have greater power.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Burcard's account says bilisa, identified here as hyoscyamus or henbane, is
    pulled up by a naked virgin with the little finger of her right hand and tied
    to the little toe of her right foot after being uprooted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author relates the nudity of the herb-puller to the laying aside of belt
    and shoes, while noting that the right hand and right foot differ from a Roman
    preference for left limbs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: For sore eyes, the AS Herbal directs the practitioner to go to Proserpinaca
    before sunrise or near sunset, mark around it with a golden ring, state that it
    is being taken as eye medicine, return after three days before sunrise, take it,
    and hang it around the patient's neck.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: For aelf-adle, the rite begins on Thursday evening at sunset at a known elecampane
    plant; the practitioner sings benedicite and pater noster and sticks a seax into
    the plant.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the next stage of the aelf-adle rite, the practitioner goes first to church,
    signs himself and commends himself to God, proceeds silently, does not speak even
    if something frightening or a person comes toward him, returns to the marked plant,
    prays, and digs up the plant while leaving the seax in it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The dug plant and seax are taken to church and placed under the altar until
    sunrise; afterward the plant is washed and made into a drink with bishopwort,
    Cristes maeles ragu, milk, holy water, prayers, creed, and a sword-drawn cross
    around the patient.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The author states that the AS Herbal material shows a Latin groundwork with
    an admixture of Christian rites.
  category: other
  evidence_refs:
  - ev:8
