canonical_text:
  quote: ''
  summary: The passage discusses sicknesses attributed to a meridian or midday demon,
    comparing field-labour afflictions with Slavic and Germanic noontide female figures
    such as Polednice, Dziewanna/Diana, Holda, Berhta, white ladies, and pshi-polnitsa.
    It also notes animal diseases attributed to spirits, a nesso with nine young,
    and a worm under a dog’s tongue.
