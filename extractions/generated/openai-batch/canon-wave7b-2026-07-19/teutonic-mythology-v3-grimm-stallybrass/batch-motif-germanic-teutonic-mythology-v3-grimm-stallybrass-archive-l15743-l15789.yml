  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman returning from cultivation falls to the ground, her tongue is bound,
    and she cannot speak.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Local people identify the woman’s condition as an incursion of the meridian
    demon and bring herb-bindings and incantation words.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage connects the name daemon meridianus with Psalm 91:6, Notker’s
    “midday devil,” and Greek meridian-demon terminology, and describes the disease
    as epileptic in nature.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage gives Bohemian polednice and Polish Dziewanna as names associated
    with the malady, identifies Dziewanna with Diana, and says Diana often means the
    same thing as Holda.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Holda is said to appear at noon, and white ladies are said to be seen at the
    same season, with Berhta named as their original.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that the malady is traced to the operation of deities and
    elves.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: An aunt in the rye or woman in the wheat is described as passing through corn
    at noontide.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Wendic pshi-polnitsa appears between 12 and 1 to labourers, especially
    women weeding flax; she is clothed in white and talks about flax-raising and spinning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The pshi-polnitsa is said to have wrung the necks of women who would not answer
    her, and people dread her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage compares the Gregory episode to Russian peasants falling before
    a “weeping widow” who breaks their bones.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says spirits also have to do with animal diseases.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: An Old Saxon formula adjures the nesso and its nine young ones to leave the
    flesh and skin of a spur-lamed horse.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Dog madness is attributed to a worm under the tongue, which can be cut out.
  category: relationship
  evidence_refs:
