literal_observations:
- id: obs:1
  text: A capitulary citation states a pagan belief that women can take human hearts;
    Burchard’s cited passage adds that they can leave through closed doors, kill men,
    eat their cooked flesh, put straw, wood, or something similar where the heart
    was, and make the victims live again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Notker is cited in connection with man-eaters and says that hazessa are said
    to do such things in the land; the author comments that the tenth and eleventh
    centuries had not abandoned the notion and that it lingered later.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Herbort, Diomed says his lady-love has his heart and that in the place
    where his heart should be he carries a light wisp, straw, or similar substitute;
    the author treats this as an amorous heart-loss expression.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A poem previously cited is summarized as saying that an unholde strides over
    a man, cuts out his heart, stuffs in straw, and the man remains alive.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Berthold is quoted as rebuking belief that someone can take a man’s heart
    from his body and put straw back in its place.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Northern terminology is cited for manncetta and for the phrase “troll ok manncetta,”
    with the note that the word is also used for male magicians.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: A Polish story is summarized in which a witch pulls out the heart and puts
    a hare’s heart in its place.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Contemporary fairy tales are said to represent the witch as a wood-wife who
    feeds and fattens children for her own consumption and, if they escape, pursues
    them in league-boots.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the tale of Frau Trude, the witch throws a girl into the fire as a log
    of wood and warms herself by it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Roman striges are cited as beings believed to consume particular parts of
    a man who still lived on; Petronius is quoted about striges eating nerves and
    snatching a boy.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A footnote says the Weletabi or Wilze were accused of eating their aged parents
