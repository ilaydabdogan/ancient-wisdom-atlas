  summary: The passage surveys charms involving phylacteries, tied objects, ligatures,
    knots, locks, garments, and bodily postures. It describes wedding bewitchment
    by tying or locking, childbirth customs involving garments and release gestures,
    Greek and Roman childbirth beings, Oddrun's Eddic childbirth charm, and obstructive
    or releasing postures in labour.
