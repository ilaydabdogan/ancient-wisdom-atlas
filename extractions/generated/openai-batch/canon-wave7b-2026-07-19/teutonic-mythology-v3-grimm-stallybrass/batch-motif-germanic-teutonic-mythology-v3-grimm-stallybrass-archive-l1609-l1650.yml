canonical_text:
  quote: ''
  summary: The passage describes the transfer and reinterpretation of older Germanic
    sacred places, customs, beings, gods, and myths under Christian institutions and
    names. It gives examples of heathen practices taking Christian forms, Christian
    material appearing in heathen form, and older figures or legends being recast
    as Christian or diabolic figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sacred woods are described as being handed over to a newly founded convent,
    to a king, or to private ownership, while retaining some customary homage.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Law-usages such as ordeals, oath-takings, beating of bounds, consecrations,
    image-processions, spells, and formulas are said to retain a heathen character
    while being clothed in Christian forms.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The heathen practice of sprinkling a newborn child with water is said to resemble
    Christian baptism.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sign of the hammer is compared with the sign of the cross.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The erection of tree-crosses is compared with irmensuls and pagan world-trees.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that Voluspa and the Bible coincide in a referenced passage,
    and that the later Solar-ljod shows traces of Christian teaching.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says that older and newer religious conceptions became interwoven,
    producing Christian material in heathen form and heathen matter in Christian disguise.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ostara is described as being converted into a notion of time, while Hellia
    is described as being converted into a notion of place.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Beliefs about elves and giants are said to have been intensified and expanded
    into angels and devils, while the legends remained the same.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Wuotan, Donar, Zio, and Phol are described as taking on the nature of malignant
    diabolic beings.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: A story of a solemn yearly visitation is described as taking shape as a wild
    rabble rout that people shunned with horror, unlike earlier processions to which
    they had thronged.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Biblical names including Cain, Elias, Enoch, Antichrist, and Herodias are
    described as veiling old myths about moon-spots, giants' buildings, and a god
    of thunder and storm.
  category: relationship
  evidence_refs:
  - ev:7
