canonical_text:
  quote: ''
  summary: 'The passage catalogs beliefs about weather magic: hanging an unspecified
    filled object on a tree to raise wind and clear rain; witches making storms from
    cloud fragments; a huntsman shooting a consecrated bullet into a storm-cloud,
    causing a naked female to fall dead and the storm to end; people shooting storm-clouds
    to frighten evil spirits; a parson blamed for failing to charm away hail; families
    in France raising storms by lashing lake water; German insult-names for weather-witches;
    and comparative remarks linking goddess, valkyr, witch, Zeus, Serbian vila, and
    Scandinavian half-goddesses with cloud, hail, and storm phenomena.'
  language: English
  quote_policy: summarized
