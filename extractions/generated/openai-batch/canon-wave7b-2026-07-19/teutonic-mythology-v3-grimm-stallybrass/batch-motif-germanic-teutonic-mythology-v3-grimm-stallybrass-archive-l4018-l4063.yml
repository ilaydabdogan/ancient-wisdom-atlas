canonical_text:
  quote: ''
  summary: 'The passage compiles German legends of spectral hunters and wild chases:
    a cruel forest-law enforcer becomes a restless nightly hunter after death; the
    wild knight Tils loses his castle in a lake after hunting on Easter Sunday; and
    a Harz wild hunter rides with hounds, cries, terrifying apparitions, and occasional
    aid to wanderers. A footnote cautiously connects cries such as wod or woit with
    Wodan/Wuotan.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed authority punishes forest-law breaches by mutilating a boy who
    barked a willow and fastening a peasant to a stag after the peasant shot at it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same unnamed figure breaks his neck while hunting against a beech-tree
    and afterward has no rest in the grave, but must hunt every night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The nightly hunter rides a white horse with sparks from its nostrils, wears
    armour, cracks a whip, is followed by hounds, and cries out.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hunter keeps to forests and lonely heaths, avoids the common highway,
    falls at a cross-road, and pursues thieves, robbers, murderers, witches, and other
    weird rabble.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Low Saxon wild knight Tils disregards holidays and on Easter Sunday vows
    to bring down a beast even if it costs him his castle; the castle then sinks in
    a lake.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A diver at the bottom of the lake sees Tils old and hoary, seated at a stone
    table, with his white beard grown through the table.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Harz, when a carpenter echoes the wild chase’s cry, a black mass falls
    down the chimney onto the fire, sparks and brands scatter, a huge horse’s thigh
    lies on the hearth, and the carpenter dies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Harz wild hunter rides a black headless horse, carries a hunting-whip
    and a bugle, has his face set in his neck, cries between bugle blasts, and is
    accompanied by women, huntsmen, and dogs.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Harz wild hunter is sometimes said to be kind and to comfort a lost wanderer
    with meat and drink.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says that in Central Germany this apparition is called the wild
    huntsman, and a footnote proposes that wod and woit may refer to Wodan or Wuotan.
  category: speech
  evidence_refs:
  - ev:8
