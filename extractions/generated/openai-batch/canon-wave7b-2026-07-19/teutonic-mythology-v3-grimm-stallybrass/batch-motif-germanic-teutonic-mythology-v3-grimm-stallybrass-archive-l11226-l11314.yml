canonical_text:
  quote: ''
  summary: 'The passage compiles beliefs about witches: a novice witch and the Devil,
    witches'' dances halted by divine names, theft or spoiling of milk, magical countermeasures,
    storm and dew magic, fertility binding with a padlock, image or puppet injury,
    child-corpse materials for salve, and non-human elvish offspring described in
    insect or worm forms. It also notes connections with elves, dwarfs, butterflies,
    valkyrian steeds, and a Faust-related comparison.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A novice witch is described as inverted by the Devil, with a candle placed
    in part of her body; a staff in the bed deceives her husband, who remains unaware.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When someone sees a witches' dance, uttering the name of God or Christ makes
    it stop and disappear.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says witches chiefly harm their neighbours' cattle and crops.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Witches are said to drain milk from cows remotely by using objects such as
    a knife in an oaken post with a string, an axe in a doorpost, a spindle, or a
    suspended handkerchief.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Witches are said to turn good milk blue or blood-coloured and to prevent butter
    from coming in the churn; they are given names meaning milk-thief or milk-bewitcher.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage explicitly connects witches with elves, butterflies, and dwarfs
    in beliefs about drawing milk from cows.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Countermeasures against bewitched milk include whipping it in a pot, stirring
    it with a sickle, or chopping into a frying-pan behind bolted doors; these actions
    are said to make the witch suffer or reveal herself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Witches are said to bring storm and hail by lashing brooks with brooms, squirting
    water upward, shooting gravel, scattering sand toward sunset, boiling bristles
    or oak-leaves, or strewing devil's-ashes on fields.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Witches are said to strip or skim dew from grass and other people's meadows
    before sunrise, using it to harm cattle or make their own grass grow ranker.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says the dew practice hangs together with dew-brushing after the
    nightly elf-dance and dew shaken from valkyrian steeds' manes, but in the witch
    context is perverted to evil.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: A witch is said to heal the broken bones of an absent person by binding up
    the legs of a footstool.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: At a wedding, a witch may snap a padlock shut as the blessing is pronounced
    and drop it into water; the marriage remains unfruitful until the padlock is recovered
    and unlocked.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Witches are said to kill men by pricking images or puppets and to dig up young
    children's bodies, cut off fingers, and use the children's fat for salve.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Devil's commerce with witches is said to produce no human offspring, but
    elvish beings named dinger, elbe, or holden, described as butterflies, humble-bees,
    queppen, caterpillars, or worms.
  category: relationship
  evidence_refs:
  - ev:8
