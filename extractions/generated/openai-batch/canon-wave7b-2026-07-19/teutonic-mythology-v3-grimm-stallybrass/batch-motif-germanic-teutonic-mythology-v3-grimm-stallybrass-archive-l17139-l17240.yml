  summary: The passage surveys antiquarian and comparative beliefs about the healing
    powers, origins, sacred locations, and names of herbs and stones. It discusses
    herbs created by gods, growing from blood, graves, barrows, mountains, statues,
    and divine footfalls; plants named after gods, beasts, and the devil; and linguistic
    classifications of plants as friendly or hostile.
  language: English
  quote_policy: summarized
