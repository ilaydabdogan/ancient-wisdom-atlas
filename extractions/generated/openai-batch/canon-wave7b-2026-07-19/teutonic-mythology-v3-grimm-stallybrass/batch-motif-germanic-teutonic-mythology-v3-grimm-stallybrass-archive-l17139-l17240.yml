  text: The passage states that dwarfs have special acquaintance with hidden healing
    virtues in herbs, and it attributes to Goldemar a dictum assigning Christians
    to faith in words, Jews to precious stones, and Pagans to herbs.
  category: relationship
  evidence_refs:
  - ev:1
