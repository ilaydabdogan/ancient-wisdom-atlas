  summary: The passage gathers Germanic, Slavic, Finnic, and Lausitz traditions in
    which plague, cattle-plague, death, or death-omens appear as named beings, animals,
    ghosts, or female figures. It reports cures, expulsion formulas, fatal window-gazes,
    house visitations, and the author's comparison of plague personifications with
    older divine or fate-related female figures.
