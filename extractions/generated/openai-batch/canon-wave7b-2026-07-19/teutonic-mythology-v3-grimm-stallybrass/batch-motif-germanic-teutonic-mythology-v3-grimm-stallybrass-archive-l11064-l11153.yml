canonical_text:
  quote: ''
  summary: 'The passage summarizes witch-trial narratives: accused witches are said
    to deny accusations, confess under torture, and be condemned and burned. It then
    lists recurrent alleged elements, including the Devil appearing as a young man
    or animal, compelling renunciation of God, rebaptism, a bodily mark, deceptive
    gifts, and the witch’s flight by salve, girdle, spell, and household implements
    to nocturnal gatherings with witches and devils.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that witch-trials followed a repeated pattern in which
    the accused first denies, then under torture confesses, and is condemned and burned.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Devil is described as appearing in the shape of a fine young man before
    his horsefoot or goosefoot is noticed.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Devil is said to compel the witch to abjure God, rebaptize her, make her
    choose sponsors, give her a new name, and reveal his own name.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A mark is said to be printed on the witch’s body, and the marked place thereafter
    has no feeling.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Devil is also said to come as a mouse, goat, crow, or fly, and then change
    into human shape.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The witch receives small gifts of money, but glittering coin is said to appear
    by daylight as muck and dirt.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: On certain days the Devil fetches or appoints the witch to attend nightly
    feasts with other witches and devils.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After anointing her feet and shoulders with salve or tying on a girdle, the
    witch bestrides an implement such as a stick, rake, broom, distaff, shovel, ladle,
    or oven-fork.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The witch mutters a spell, flies up the chimney, and travels through the air
    over hill and dale.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: When the Devil fetches the witch, he may sit in front on the stick while she
    sits behind, or he may appear as a goat for her to mount.
  category: relationship
  evidence_refs:
  - ev:10
