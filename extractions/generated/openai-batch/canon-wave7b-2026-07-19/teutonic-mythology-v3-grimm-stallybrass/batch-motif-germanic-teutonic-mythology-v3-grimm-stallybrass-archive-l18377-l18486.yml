canonical_text:
  quote: ''
  summary: 'The passage surveys several herbs and their attributed powers or myths:
    waybread or wegwarte as a maiden awaiting a lover, leek in sacred and naming contexts,
    rowan as Thor''s saving shrub and as apotropaic wood, Serbian and Polish herbs
    for love, forgetting, transport, or healing, and herbs or animal foods that grant
    understanding of animal speech. It then begins a contrast between herb-lore and
    stone-lore.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Waybread or wegwarte is associated with a myth in which the herb was once
    a maiden waiting by the wayside for her lover; its flowers are said to turn to
    the sun, and after seven years the root changes into the form of a bird.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Leek is described as a general name for juicy herbs, with some species regarded
    as sacred; in the Helgi passage Sigmundr comes from battle with a leek to meet
    and name his son, and a leek is also thrown into a blessed drinking-cup.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The service-tree or rowan is called a holy shrub; Thor clutches it in a river
    to save himself, and Swedish belief attributes protective power to rowan staffs
    or rowan-wood objects against sorcery, storms, and water-sprites.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Serbian samdokaz and okolochejp are herbs used in a love-potion to compel
    a lover to come to his mistress.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ustuk is described both as a herb and as a charm repeated by a sorceress to
    make a disease depart.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Polish trojziele, or three-herb, is described as a marvellous plant with blue
    leaves and red flowers that inspires love, causes forgetting, and transports a
    person wherever desired.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: A nameless herb in Elegast lets a person understand cocks and dogs when placed
    in the mouth; a golden herb causes sleep and understanding of dogs, wolves, and
    birds; other examples connect bird-language knowledge with eating a white snake
    or a dragon's heart.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Stones are described as less mythical than herbs, less accessible than plants,
    and associated with medieval medicinal and miraculous powers brought through Jewish
    and Moorish merchants from the East.
  category: attribute
  evidence_refs:
  - ev:7
