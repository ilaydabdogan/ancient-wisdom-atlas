canonical_text:
  quote: ''
  summary: 'The passage surveys path-crossing or first-encounter prognostics: Prussian
    beliefs about meeting sick, mounted, or animal figures; wider European beliefs
    that meeting old women, women with loose hair, or women spinning may bring ill
    luck; counterexamples in which a prostitute is lucky; and an apotropaic Hessian
    custom in which a huntsman makes an old woman step over him. The author links
    some of these signs to witch, night-wife, fate, spindle, and goddess-spindle traditions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports that Prussians regarded encountering a sick man as bad,
    a mounted man as good, and a fox or hare as bad.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says human angang may bring ill luck when the encountered figure
    is an old woman, a woman with dishevelled hair, or a woman with a loosened headband;
    meeting an old wife in the morning or passing between two old wives is also described
    as unlucky.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In a Hessian popular custom, a huntsman who meets an old woman in the morning
    lies down and has her step over him to ward off mischief.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage reports Swiss and Swedish examples in which meeting women is unlucky,
    with cited exceptions or reversals where a virgin or priest is an evil sign and
    a prostitute is a good sign.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Finnish song is cited as warning someone to go out early lest an ancient
    crone with a crooked chin squint at him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage's author connects the crone and loose or flying hair with the
    notion of a witch, night-wife, fortune-teller, heathen priestess, and compares
    loose-haired imagery with a depiction of Sibylla.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: The approach of a woman spinning is described as hurtful, and Pliny is cited
    for an Italian rural rule against women twisting spindles or carrying uncovered
    spindles while walking on roads, because this was considered adverse to hopes
    and especially crops.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The author says the spindle rule resembles traditions in which goddesses scrutinize
    whether spindles have been spun full.
  category: relationship
  evidence_refs:
  - ev:8
