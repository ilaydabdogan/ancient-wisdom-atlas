canonical_text:
  quote: ''
  summary: The passage discusses examples of European spells and charms, focusing
    first on the first Merseburg poem as a bond-spell for tying or unloosing bands
    and releasing a prisoner. It summarizes the poem’s idisi, who bind fetters, delay
    an army, and loosen bonds, and compares this with Bede’s account of a man whose
    bonds repeatedly fall off and with an Anglo-Saxon version mentioning dissolving
    runes and inscribed stones. The passage then begins the second Merseburg formula,
    a healing charm for a lamed horse involving Phol, Wodan, and Balder’s foal.
  language: English with Old High German, Latin, and Old English excerpts
  quote_policy: summarized
