canonical_text:
  quote: ''
  summary: The passage surveys Germanic and neighboring traditions concerning spectres,
    the furious host or Wild Hunt, will-o'-wisps, and regional Wild Hunter figures.
    It links violently dead persons and unbaptized children with the furious host
    and will-o'-wisps; describes the replacement of Wuotan by the devil in Christianized
    accounts; mentions a Swiss giant or Durst hunting with hounds on the Jura; and
    gives Westphalian and Low Saxon traditions of Hackelbarend, Hackelberg, Hackelblock,
    and Hans von Hackelnberg as wild hunters.
  language: English, with cited German and Latin phrases
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that those who die a violent death before their appointed
    time and unbaptized children come into the furious host to Holda, Berhta, and
    Abundia, and are also said to turn into will-o'-wisps.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage presents Wuotan as the older heathen figure connected with this
    host and says that the cultivated tradition put the devil in his place.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A cited exemplum tells of a vain woman buried in fine new shoes whose soul
    is hunted by an infernal hunter, with a terrifying hunter's voice and the barking
    of hunting dogs heard from afar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports a Bavarian belief that on Ash Wednesday the devil chases
    the little wood-wife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Switzerland the wild hunt is named dursten-gejeg, and on summer nights
    the Durst is heard hunting on the Jura, urging on hounds with a call; heedless
    persons may be ridden over.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: An old gloss cited in the passage renders Latin Dis or Ditis by duris or durisis,
    which the author interprets as a subterranean infernal deity.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A footnote reports phantom hunts appearing on earth and in the clouds with
    dogs, nets, hoarse cries, hunting implements, and forms of long-dead humans.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Westphalian traditions name the Wild Hunter Eackelbarend, Eackelbernd, Eackelberg,
    or Eackelblock.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Eackelbarend is described as a huntsman who hunted even on Sundays and was
    after death banished into the air, where he must hunt with his hound day and night
    without rest.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Some accounts say Eackelbarend hunts only during the twelve nights from Christmas
    to Twelfth-day; others say he hunts whenever the storm-wind howls.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: One of Hackelberg's hounds is said to have remained for a whole year in Fehrmann's
    barn at Isenstadt, then rejoined the wild hunt when Hackelberg returned.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Two young men hear wild barking in the air and Hackelblock's call; one mocks
    the call, after which Hackelblock sets the hounds on him and he disappears.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Low Saxon legend identifies Hans von Hackelnberg as chief master of the
    hounds to the Duke of Brunswick, a mighty woodman, with dates and a tombstone
    tradition attached to him.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: Hans von Hackelnberg dreams of fighting and being defeated by a terrific boar,
    later kills such a boar, kicks it, and is injured when its tusk pierces his boot
    and foot.
  category: sequence
  evidence_refs:
  - ev:8
