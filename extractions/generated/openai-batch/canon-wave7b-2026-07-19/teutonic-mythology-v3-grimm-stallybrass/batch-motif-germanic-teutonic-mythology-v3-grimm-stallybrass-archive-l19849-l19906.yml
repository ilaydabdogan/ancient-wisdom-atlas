  quote: ut, lytel spere, gif her inne sie !
  summary: The passage gives an Old English charm and Grimm's commentary on a stitch
    or pain caused by supernatural shots. It names herbs, describes mighty women or
    witches riding and sending darts, repeatedly orders a little spear to come out
    if it is inside, names shots of ases, elves, and witches, invokes Dryhten for
    help, and gives ritual instructions involving a knife and liquid.
