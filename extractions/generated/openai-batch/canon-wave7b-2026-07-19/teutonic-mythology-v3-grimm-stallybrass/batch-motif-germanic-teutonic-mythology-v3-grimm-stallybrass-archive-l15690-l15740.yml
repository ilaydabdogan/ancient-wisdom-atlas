  summary: The passage surveys mythical explanations and personifications of disease.
    It describes diseases as devised by gods, spirits, or magicians and as becoming
    malign living agents; discusses a head-ailment producing haze and double vision;
    cites a Finnic song in which Launawatar or Louhiatar bears nine sons that include
    monsters and maladies; notes a Modern Greek female personification of smallpox;
    and introduces an early medieval account of demonic affliction by a being called
    Biana.
  language: English with cited Latin and Greek terms
