canonical_text:
  quote: ''
  summary: The passage cites texts in which Augustus establishes perfect peace and
    weapons are made into harvest tools. It then discusses Fruoto/Fruote’s place in
    heroic lays and associations with gold, ground gold, shield-filling liberality,
    and a mill grinding gold and love. The passage further argues that a shared mythic
    basis underlies German heroic lays and is also found in Carolingian and British
    material, linking Arthur, Morgana, Charles, Roland, Gralans/Wayland, Berthe/Berhta,
    Flore and Blanchefleur, Charles’s elfin beloved, and Auberon/Elberich.
  language: English with quoted German and Middle High German terms
  quote_policy: summarized
