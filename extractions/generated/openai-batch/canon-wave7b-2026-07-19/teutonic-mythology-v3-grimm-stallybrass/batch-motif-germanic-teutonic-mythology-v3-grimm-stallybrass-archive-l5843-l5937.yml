canonical_text:
  quote: ''
  summary: The passage gives a series of local accounts of white women, dames, or
    king's daughters appearing on hills, at sunken castles, or near castle hills.
    Several ask humans to fulfil precise conditions for their release; the attempts
    fail through baptism, fear, delay, speech, or looking back. Other accounts emphasize
    keys, slippers, gold, water, combing hair, and appearances between 11 and 12.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a fragmentary preceding account, cherries examined at home are found changed
    into gold and silver pieces.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Near Feeben, a white woman appears before a fisherman with a bunch of leys
    and asks him to bring his newborn son so that she may kiss him and be saved.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fisherman finds his wife has delivered a boy, but the child is christened
    before being taken to the hill; the white woman weeps because the required deliverer
    had to be an unbaptized infant.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Hennikendorf, a half-white, half-black woman appears on a mountain, offers
    a shepherd all the gold in the mountain if he enters and frees her, and says no
    other capable liberator will be born for a hundred years if he fails.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Hennikendorf shepherd remains afraid until the hour of deliverance passes;
    the woman sinks into the mountain and is heard moaning for a long time.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Near Chorin monastery, the white woman known as the utgebersche appears carrying
    a large bunch of leys; a group later observes her feet and sees yellow or green
    slippers.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: After a man laughs and calls out about the slippers, the Chorin white woman
    flees and is never seen again.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Beside the brook of the Bütow castle hill, a maiden repeatedly draws water
    in a golden bucket and washes herself.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Bütow maiden says she is a king's daughter who sank with the mountain-castle
    into the ground and can be saved only by being carried without halting or looking
    round to the Wendish burial-ground and thrown down there.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The ploughman carrying the Bütow maiden looks round after something clutches
    his hair from behind; the maiden flies into the air and says she must suffer more
    severely and wait another hundred years.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: On the banned Pillberg castle, a woman appears from 11 to 12 at noon, smoothing
    her hair and asking shepherds to lay hold of her, hold tight, and say nothing.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: A cowboy holds the Pillberg castle-dame while frightening apparitions of dogs
    and horses threaten him, but he utters a religious cry; the dame becomes loose,
    says she is lost for ever, and vanishes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: At Kleinteich, people say a swallowed castle once stood on the hill and a
    king's daughter used to come up daily between 11 and 12 to comb her golden locks
    over a golden trough.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: At the Hünenberg by Eckritten, described as a former holy mount where Prussians
    sacrificed to their gods, a dame now appears combing her hair; the account breaks
    off after she addresses a peasant kindly.
  category: setting
  evidence_refs:
  - ev:8
