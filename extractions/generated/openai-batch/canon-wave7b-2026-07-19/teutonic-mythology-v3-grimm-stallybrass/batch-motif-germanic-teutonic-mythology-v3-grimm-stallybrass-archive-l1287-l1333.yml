canonical_text:
  quote: ''
  summary: The prefatory passage argues for comparing Germanic pagan material with
    classical, Celtic, Slavic, Lithuanian, and Finnish traditions while resisting
    over-attribution to borrowing. It mentions omens involving beasts, herb virtues,
    grave-mounds, weapons, fays, roof-gable horses' heads, German and Celtic elements
    in fable, several named divine or legendary correspondences, needfires, and May-offerings.
  language: English
  quote_policy: summarized
