canonical_text:
  quote: ''
  summary: The passage surveys Germanic folk beliefs about divination as a hereditary
    or transferable gift. It describes family lines of fortune-tellers, fore-peepers
    who foresee fires, deaths, corpses, and misfortune, prophetic or spirit-seeing
    animals, bodily gestures that transmit or remove second sight, powers granted
    to the first child christened at a new font, sight gained through the loop of
    a wise man's arm, dogs receiving the gift, and children born with a helmet seeing
    spirits, ghosts, or witches. The author frames these as remnants of older priestly
    practices passing into conjuring and witchcraft.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that sacred priestly divination appears to have been hereditary
    in families, like the priestly office itself.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A female fortune-teller is reported to have said that the gift had long been
    in her family and would descend to her eldest daughter after her death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage reports views that soothsaying and healing may pass from mother
    to daughter, father to son, or cross-sex from women to men and men to women.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Some families are said still to possess the gift of foreseeing fires, deaths,
    corpses, and coming misfortune, and in Low Germany such people are called fore-peepers.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says the power to perceive coming misfortune is also allowed to
    horses, sheep, and dogs; horses prophesy and hounds see spirits.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Gifted men are said to be able to impart their gift to a person who treads
    on their right foot and looks over their left shoulder.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The foot-and-shoulder posture is described as apparently ancient and heathen,
    and it is compared with a legal formality for taking possession of cattle and
    with a penance posture involving a hermit.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: The first child christened at a newly consecrated font is said to receive
    power to see spirits and coming events until another person treads on the child's
    left foot and looks over the child's right shoulder, at which point the gift passes
    to that person.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A person who looks through the loop of a wise man's arm is said to become
    a seer of spirits and to behold the natural and preternatural.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A dog is said to receive the gift if its right foot is trodden and it is made
    to look over a person's right shoulder.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Children born with the helmet are said to be able to see spirits, ghosts,
    or witches.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage characterizes these practices as last survivals of heathen priesthood
    practices before they pass into conjuring and witchcraft.
  category: other
  evidence_refs:
  - ev:6
