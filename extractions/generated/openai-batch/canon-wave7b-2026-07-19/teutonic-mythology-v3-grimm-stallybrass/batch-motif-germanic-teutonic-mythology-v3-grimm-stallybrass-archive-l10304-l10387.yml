canonical_text:
  quote: ''
  summary: 'The passage surveys traditions of nocturnal riding and witchcraft: supernatural
    women or witches ride wolves, bear, stag, or boar, sometimes using snakes as bridles
    or a whip; a law formula accuses a person of riding at twilight in troll''s garb;
    Freyja and Hyndla ride to Valholl by night; and the author describes a German
    sequence in which former goddesses and pagan rites become reclassified as illicit
    magic and witch-retinues.'
  language: English
  quote_policy: summarized
