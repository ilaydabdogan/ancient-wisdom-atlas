  summary: 'The passage discusses reported beliefs about unholden or witch-like women:
    a feast directress returns stolen infants; Crescentia is accused of being an unholde
    and denies sorcery; unholden are connected with woods, the Wild Host, horn-blowing,
    and nocturnal bird imagery; Swedish woodland old women are called wolf-mothers
    and linked with a long-nosed beast-mother; Grimm argues that many witch-trial
    spells point to elvish or Christian rather than devilish material.'
