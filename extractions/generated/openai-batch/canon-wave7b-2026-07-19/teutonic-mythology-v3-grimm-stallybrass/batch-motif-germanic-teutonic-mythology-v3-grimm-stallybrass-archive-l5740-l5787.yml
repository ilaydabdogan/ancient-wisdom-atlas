canonical_text:
  quote: ''
  summary: The passage lists several German local traditions about white women or
    maidens appearing near castle-rocks, castle-vaults, hills, ruins, and brooks.
    They often carry keys, appear at marked times such as noon, every seventh year,
    Easter before sunrise, or Christmas night, and are associated with treasure, lilies,
    washing at brooks, gold objects, and encounters with children or other witnesses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A white woman with a bunch of keys appears on the castle-rock at Baden at
    noon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Wolfartsweiler a hidden treasure lies in a castle-vault, and a white maiden
    appears every seventh year when may-lilies are in bloom.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Wolfartsweiler maiden has black hair plaited in long tails, a white gown
    with a golden girdle, keys, and a bunch of may-lilies.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Wolfartsweiler maiden is said to like showing herself to innocent children
    and beckons one child from near the grave below; the child runs home frightened
    and returns with its father after the maiden has gone.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Two goose-herd's girls see the Wolfartsweiler maiden descend to the brook
    at noon, comb and plait her hair, wash her face and hands, and return up the castle
    hill.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The girls are told at home to speak to the maiden but lack courage; on the
    third day they do not see her and find a freshly fried liver-sausage on a stone
    in the brook.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Two men from Grünwettersbach see the maiden fill a tub with brook water and
    carry it up the hill; the tub has two broad hoops of pure gold.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Osterrode, a white maiden appears every Easter Sunday before sunrise, walks
    down to the brook, washes there, and has a large bunch of keys hanging at her
    girdle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Osterrode maiden takes a poor linen-weaver into castle ruins and plucks
    one of three white lilies for him; when he returns home, the lily is pure gold
    and silver.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Duke takes the Osterrode Easter-maiden's marvellous flower in return for
    a pension to the weaver and places it in his princely coat of arms.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the final fragment, on a snowy Christmas night a waggoner walking home
    by a footpath sees a maiden; the supplied passage breaks off before her description
    is complete.
  category: sequence
  evidence_refs:
  - ev:7
