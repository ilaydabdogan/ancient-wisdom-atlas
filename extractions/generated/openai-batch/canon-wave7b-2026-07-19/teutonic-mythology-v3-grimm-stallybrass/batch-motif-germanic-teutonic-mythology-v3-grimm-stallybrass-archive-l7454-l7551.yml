canonical_text:
  quote: ''
  summary: 'The passage catalogs animal and bodily forms attributed to the Devil in
    medieval and folk materials: dog or hell-hound, raven and other birds, cock, snake,
    worm, dragon, Leviathan or whale, and fly. It notes links to treasure-guarding,
    underworld dogs, ravens associated with Wuotan/Odinic tradition, the Paradise
    serpent, Revelation’s dragon, folktale dragons or griffins, Leviathan pierced
    by Christ’s hook, and Thor fishing up the world-serpent.'
  language: English with cited Germanic, Latin, French, and biblical terms
  quote_policy: summarized
