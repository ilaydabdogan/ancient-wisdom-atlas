canonical_text:
  quote: ''
  summary: 'The passage reviews German and Scandinavian traditions of the Furious
    Host or ghostly array: a moving host that may drag living people, be seen or heard
    in the air, ride horses during Yule, and be explained as an Asgard march, a divine
    procession, a procession of souls, or a storm manifestation. It then compares
    female leaders such as Guro, Huldra, Holda, and Berhta, and reviews Wuotan/Othin
    and other divine figures connected with the host. The author distinguishes a beneficent
    visible divine visitation from an unseen stormy aerial host, and describes how
    Christianity reinterpreted the divine procession as a pack of spectres, unchristened
    dead, sinners, and a tailed unholde figure linked to later Venus-mount legend.'
  language: English
  quote_policy: summarized
