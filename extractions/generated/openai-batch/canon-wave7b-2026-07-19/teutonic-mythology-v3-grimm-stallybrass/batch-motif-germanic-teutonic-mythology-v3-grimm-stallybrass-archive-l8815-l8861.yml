    the last or seventh person, especially pupils or students. Spanish and Scottish
    variants describe a scholar escaping because the Devil takes only his shadow,
    leaving him shadowless. The excerpt also introduces a related Norrland/Danish
    giant or trold church-building narrative involving Esbern Snare.
