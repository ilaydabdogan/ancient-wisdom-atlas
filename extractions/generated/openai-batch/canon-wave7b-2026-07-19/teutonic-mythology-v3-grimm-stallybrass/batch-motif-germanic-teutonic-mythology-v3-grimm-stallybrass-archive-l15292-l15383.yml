canonical_text:
  quote: ''
  summary: 'The passage surveys older Germanic disease terminology and associated
    beliefs: sacrifices in pestilence or severe sickness, sickness as divine dispensation
    or as work of sprites and daemons, disease as a personified force that attacks
    or carries people off, oath-bound diseases in the Balder story, euphemistic names
    for diseases, and fever or ague imagined as an elf-like rider using rein and spur.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sacrifices are described as being performed when pestilence approached and
    in severe cases of actual sickness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that older native names for diseases preserve older notions
    about sickness and cure, then lists terms such as krank, siech, and sucht.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Scandinavian ailment of great age is said to be called Ana sott from king
    On or Ani, who gained long life by sacrificing his sons and finally lived on milk
    like a child.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage contrasts a Christian view of sickness as a dispensation of God
    with a heathen view of sickness as the handiwork of sprites or something elvish.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sickness is personified as coming upon, surprising, attacking, seizing, taking
    hold of, and overpowering a person.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The cited examples include a daemon afflicting or sending pestilence, secret
    beings or wights affecting people, and gods healing.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says that in the Edda an oath is exacted from diseases as from
    living creatures so that they will do no harm to Balder.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Pestilence is described as carrying off, and a Swedish oath is interpreted
    as invoking disease to take a person away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Because diseases are treated as daemonic, people are said to avoid their right
    names and address them with friendly or flattering names such as the good, the
    blessed, or gossip.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Fever or ague is connected with riding language and is imagined as an elf
    who rides a person with rein and spur; related phrases say that the alp bridles
    and the mare rides.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: Curses invoke the ride or ritt as a force that shakes, attacks, or fells someone,
    and one cited fable has the rite appear in person.
  category: speech
  evidence_refs:
  - ev:11
