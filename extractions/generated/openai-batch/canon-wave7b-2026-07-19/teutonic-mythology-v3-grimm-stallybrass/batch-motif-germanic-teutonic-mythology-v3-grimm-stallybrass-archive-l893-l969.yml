canonical_text:
  quote: ''
  summary: The preface lists several divinities whose names or traces survive in later
    words, names, or discoveries. It then presents the author’s analytic view that
    many divine personages can be reduced to a unity from which multiplicity springs,
    with gods associated with heaven, fatherhood, rule, victory, bliss, and elements,
    and goddesses associated with earth, motherhood, nourishment, spinning, tilling,
    beauty, adornment, and love. The passage compares this mythological reduction
    and gradation to the derivation and shifting of language sounds.
  language: English
  quote_policy: summarized
