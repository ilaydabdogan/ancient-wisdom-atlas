canonical_text:
  quote: ''
  summary: The passage discusses Germanic and Scandinavian legends of Christ and Peter
    as Christianized forms of older mythic traditions, cites episodes involving an
    ogre’s house, a fallen man in a rivulet, a woodcutter being hoisted toward heaven
    by a mallet and falling to hell, and a fairy-tale blacksmith or pikeman gaining
    better entry by throwing an object into heaven. It compares these wanderings with
    biblical journeys, angelic visitations, Greek and Indian divine avatar traditions,
    and introduces the Fruoto legend as another case of mingled Christian and heathen
    ideas.
  language: English
  quote_policy: summarized
