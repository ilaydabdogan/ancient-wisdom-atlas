- id: obs:3
  text: The author states that the legends are grounded in primitive traditions and
    that an old myth was already being dressed up in Christian form by the thirteenth
    century.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: One allusion relates Christ and Peter coming to a deep rivulet into which
    a man had fallen while doing nothing to help himself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another allusion tells of Peter trying to hoist a woodcutter into heaven by
    his mallet; when the woodcutter was on the topmost rung, the mallet handle came
