- id: obs:1
  text: A cited tale incident has unnamed travelers putting up at an ogre's house
    in a wood and being concealed by the ogre's compassionate wife.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author says Afzelius proves that legends of Christ and Peter exist in
    Sweden, but rejects Afzelius's view that they are fabricated drolleries.
  category: other
  evidence_refs:
