canonical_text:
  quote: ''
  summary: The passage surveys Germanic and neighboring folk beliefs about humans
    changing into animals, including werewolf or dog, bear, cat, goose, raven, and
    crow forms. It emphasizes bodily marks, enchanted garments or objects, wounded
    animals later recognized as humans, taboo against harming cats, and restoration
    or prevention of human form through clothing, hides, silence, and a sewn shirt.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cited werewolf belief says the being goes in human shape by day, has eyebrows
    growing together over the nose, turns at a certain time of night into a three-legged
    dog, and can be freed when someone calls him “werewolf.”
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage treats human transformation into bears as familiar in Norse-related
    material and mentions an iron collar, Laplanders said to become bears, and a slain
    destructive bear said to have a girdle on him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The cat is described as connected with home-sprites, witches, night-wives,
    and Frouwa; the passage says there is no hint of donning a belt or shirt for cat-shape.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A common saying reports that a cat of twenty years turns witch, and a witch
    of a hundred turns cat again.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage notes recurring witch-trial stories in which a wounded cat is
    later recognized as a bandaged woman.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A farmer is said to have become ill from his wedding day after throwing a
    stone at a saddled cat that entered his yard.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A sportsman shot a wild goose, but when he reached the place where it fell,
    he found a naked woman who asked him not to betray her and to send clothing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: An innkeeper is said to have been changed by a woman’s witcheries into a wild
    goose for more than a year until another goose tore from his neck a kerchief in
    which the enchantment was bound.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author says raven transformations by magicians may be assumed but gives
    no example; the passage then mentions trolls appearing as ravens and witches or
    named figures taking crow-shape.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that if cast-off human or animal clothing is removed, resuming
    the former shape becomes impossible; legends therefore include secretly burning
    a stripped-off beast hide.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage describes restoration of human shape on the condition that a spotless
    maid keep silence for seven years and spin and sew a shirt to throw over the enchanted
    person.
  category: sequence
  evidence_refs:
  - ev:7
