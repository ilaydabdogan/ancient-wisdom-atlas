canonical_text:
  quote: ''
  summary: The passage presents Mecklenburg legends in which the wild hunter is identified
    with Wod/Wodan. On dark nights his aerial hounds bark in liminal places, and he
    warns travellers to stay in the middle of the road. A tipsy peasant ignores the
    warning, encounters a tall man on a white horse descending from the clouds, and
    is challenged to a chain-pulling contest. The peasant secretly fastens the chain
    to an oak while pretending to hold it, resists being pulled into the clouds, and
    is praised and promised a reward as the hunt departs.
  language: English
  quote_policy: summarized
