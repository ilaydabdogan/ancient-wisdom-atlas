canonical_text:
  quote: ''
  summary: 'The passage catalogs werewolf and related animal-transformation beliefs:
    a wedding party is turned into werewolves and later restored by a fur-outward
    pelisse; French and Marie de France variants involve undressing, a magic ring,
    laid-aside clothing, and a key; a common belief uses a human-skin strap; Lorrain
    records describe wolves produced through blessed grass thrown against a tree;
    Rhenish and Westphalian superstition distinguishes male wolf transformation from
    female iitterbock transformation; and a Danish childbirth-charm notice is truncated.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bride, bridegroom, and six bridesmen are said to have been turned into werewolves
    and to have run howling around the witch's house for three years.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The witch restores human form by covering each werewolf with a pelisse whose
    fur is turned outward; the bridegroom becomes human again but retains a wolf's
    tail where the covering did not reach.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Schafarik is reported as saying that these wolf-stories are especially native
    to Volhynia and White Russia and using that distribution in an argument about
    the Neuri being Slavic.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the cited Lai de Melion variant, an undressed man touched with a magic
    ring becomes a wolf and runs after game.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the cited Marie de France variant, a knight becomes a bisclaveret three
    days each week; if his laid-aside clothes are removed, he must remain a wolf.
    Pluquet adds a deliverance by beating with a key until bleeding.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A common belief described in the passage says transformation is caused by
    tying around the body a three-finger-broad strap cut from human skin; such a werewolf
    is distinguished by a truncated tail.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Lorrain witch-record notice says that pulled-up, blessed stalks of grass
    thrown against a tree produce wolves that immediately attack a flock; the passage
    notes uncertainty about whether the grass throwers themselves become wolves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Rhenish and Westphalian superstition is summarized as making men become wolves,
    while maids and matrons change into an iitterbock; an uncanny old hag may be called
    'the cursed iitterbock'.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Danish superstition notice begins by saying that if a bride uses a specified
    charm for painless labour, her sons become something identified only by the truncated
    form 'vbir-' in the provided passage.
  category: sequence
  evidence_refs:
  - ev:7
