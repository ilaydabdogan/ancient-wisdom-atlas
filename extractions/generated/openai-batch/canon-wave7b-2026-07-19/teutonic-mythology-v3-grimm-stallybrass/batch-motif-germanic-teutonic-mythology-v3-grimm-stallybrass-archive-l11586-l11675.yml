canonical_text:
  quote: ''
  summary: The passage surveys folk methods for recognizing witches or related beings,
    including trough-backed figures, ritual objects taken to church, reversed posture,
    eye-reflection tests, and tales of witches removing or eating hearts. It also
    notes comparisons with Norse and Danish elf-like beings, Berhta, ancient legends
    of pursuit, Pliny, and early Germanic legal references.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pail or trough is discussed in connection with bewitching milk and with
    beliefs that giantesses, ellekoner, and huldre-wives carry a trough on their backs.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A night-faring woman sits in a dough-trough, anoints herself with oil, speaks
    magic words, and slips away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Several female or elf-like beings are described as beautiful in front but
    deformed behind, with backs compared to a dough-trough or named as riven-backed.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Maundy Thursday egg taken to church on Easter Sunday morning is said to
    reveal women who belong to the devil; those women try to crush the egg, and if
    it is crushed the carrier’s heart breaks too.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Swiss recipe says that clover placed in a shoe before sunrise on Sunday
    and worn to church lets a person see witches; those sitting hind foremost are
    witches.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: At Christmas matins, standing on a footstool made of nine sorts of wood is
    said to reveal witches in the congregation because they turn their backs to the
    altar.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The witches can also see the recognizer, who must escape after service by
    throwing out tempting items while running home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Spoon-and-dough or spoon-and-millet rites taken to matins or church are said
    to reveal unholden or witches, who face the wrong way or appear upside down; the
    practitioner risks death if he does not get home before the benediction.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The author states that these recognitions occur when going to church and may
    depend on being first to see.
  category: other
  evidence_refs:
  - ev:9
- id: obs:10
  text: Another sign of a witch is that a viewer sees his own image reflected upside
    down in her eyes; running eyes are also named as a mark of old witches.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage says that tales of witches eating men’s hearts remain prominent
    in Serbian belief; a Serbian song has a sleeping shepherd boy say that witches
    ate him out, his mother took his heart, and a cousin lit her with a torch.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: In an account attributed to Fortis, two witches remove a young man’s heart
    in his sleep and fry it; when he wakes, the spell is broken, the witches anoint
    themselves and flee, and the young man is restored by swallowing the half-cooked
    heart.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: The author compares the Serbian witch appearing at Shrovetide and cutting
    open breasts with Berhta, who cuts open a lazy workman’s body and stuffs it with
    chopped straw.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: The passage reports village beliefs about wicked wives with white livers whose
    husbands waste away and die.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:15
  text: The passage cites early legal references as evidence that a belief in a stria
    eating a human also existed among ancient Germans.
  category: other
  evidence_refs:
  - ev:15
