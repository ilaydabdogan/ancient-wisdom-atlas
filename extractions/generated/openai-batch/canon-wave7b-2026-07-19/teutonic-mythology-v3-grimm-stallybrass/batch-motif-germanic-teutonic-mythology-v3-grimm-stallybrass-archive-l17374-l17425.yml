  summary: 'The passage discusses rules and times for gathering herbs: before sunrise,
    at new moon, around the Dog-star rising, at midnight on St. John''s eve, or before
    thunder is heard. It associates herb-lore with maidens, matrons, wise women, witches,
    and old women, and cites Pliny and other references for ritual conditions such
    as secrecy, silence, fasting, left-handed gathering, saluting plants, and avoiding
    the sight of humans or heavenly bodies.'
