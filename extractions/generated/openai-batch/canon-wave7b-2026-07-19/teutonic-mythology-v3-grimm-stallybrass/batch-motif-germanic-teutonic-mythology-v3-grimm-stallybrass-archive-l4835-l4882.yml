canonical_text:
  quote: ''
  summary: 'The passage surveys Danish and Schleswig traditions of spectral or legendary
    hunters: Gronjette hunts nightly in a wood with his head under his arm, spear,
    horse, and hounds; peasants leave oats for his horse and may be rewarded for holding
    his dogs; he hunts and kills a merwoman. Other local versions name Palnejager/Palnatoki,
    a flying huntsman or Markolfus, Christian II, and King Abel. A footnote describes
    a harvest/Yule-eve offering of the last sheaf of oats for the horse of the ''jode
    of Upsala,'' interpreted by the author as a euphemism for Wodan/Odinn.'
  language: English
  quote_policy: summarized
