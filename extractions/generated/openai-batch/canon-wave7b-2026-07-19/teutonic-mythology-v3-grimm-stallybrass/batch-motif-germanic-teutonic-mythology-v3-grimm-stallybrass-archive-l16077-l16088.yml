canonical_text:
  quote: ''
  summary: 'The passage cites a Staffordshire custom in which a tree is made into
    a “nursrow tree” to cure unexplained swellings in cattle: mice thought to bite
    and swell cattle are sealed inside a bored hole in the tree, and afterwards swollen
    cattle are wiped with the tree’s boughs as a remedy.'
  language: English
