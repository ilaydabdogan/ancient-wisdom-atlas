  summary: 'In a section on names taken from the Devil’s figure, the passage explains
    that many names derive from outward form: a lame foot, black or dark coloration,
    hiddenness, gray-man forms, black animal shapes, and an empty-spindle folktale.
    It compares these features with Hephaestus, Wieland/Volundr, light and dark divine
    contrasts, and Berhta/Berhtold traditions.'
