canonical_text:
  quote: ''
  summary: The passage describes the mandrake or alruna as a personified object cared
    for with ritual washing, clothing, and housing; when questioned it reveals hidden
    and future matters, brings wealth and household benefits, and passes by inheritance
    under funeral-deposit conditions. Grimm then compares Germanic names and traditions
    with biblical, classical, medieval Latin, French, and Anglo-Saxon references,
    including accounts of gendered mandrakes, ritual digging, semi-human form, spring
    immersion, and dog participation in gathering.
  language: English with quoted Latin, Greek, Hebrew, Old High German, and Middle
    High German terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mandrake is referred to with a feminine pronoun and is described as washed
    with red wine, wrapped in red and white silk, laid in a casket, bathed every Friday,
    and clothed in a new white smock at every new moon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When questioned, the mandrake reveals future and secret things concerning
    welfare and increase, makes the owner rich, removes enemies, blesses wedlock,
    and doubles a coin left with her overnight; the passage adds that she must not
    be overloaded.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the owner dies, the mandrake goes to the youngest son if he places bread
    and a coin in his father's coffin.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the youngest son dies before the father, the mandrake passes to the eldest
    son, who must bury his brother with bread and money in the same manner.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says Old High German glosses use alruna for mandragora in the
    Vulgate passage at Genesis 30, while the Hebrew text has dudaim and a Middle High
    German poetic version translates it as erd-ephil.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Pliny is cited as saying that mandragora is also called Circaeum, has a white
    male kind and a black female kind, and that diggers avoid a contrary wind, mark
    three circles with a sword, and dig while facing west.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Columella is cited for a description of mandrake as semi-human, and Grimm
    notes that this agrees with the legend under discussion.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Hildegard is cited as saying that mandragora developed from the earth from
    which Adam was created, that diabolic suggestion lies in wait for it because of
    its human likeness, and that once dug up it should be put into a spring for a
    day and night.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage conjectures that French mandagloire and the fairy Maglore may
    relate to mandragore, comparing this with Alruna as wise-woman and alruna as mandrake.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says an Anglo-Saxon description confirms a dog's participation
    in the act of gathering the mandrake.
  category: action
  evidence_refs:
  - ev:8
