canonical_text:
  quote: ''
  summary: The preface discusses medieval and early modern sources for information
    about pagan gods, idols, and superstitions. It notes a lost translation of the
    Metamorphoses, Rudolf’s Christian refutation of Grecian gods, late medieval interest
    in the past, Botho’s unreliable but possibly valuable statements, a chronicle
    report of Johannis Vanderi’s illustrated book on local gentile deities, possible
    idol figures at Reinhartsbrunn or Brunswick, and potential notices of superstition
    in Berthold of Regensburg’s sermons.
  language: English with Latin quoted material
  quote_policy: summarized
