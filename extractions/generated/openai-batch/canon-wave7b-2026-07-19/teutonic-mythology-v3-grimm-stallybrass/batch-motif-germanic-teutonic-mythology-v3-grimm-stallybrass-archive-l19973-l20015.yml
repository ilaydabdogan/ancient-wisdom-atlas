canonical_text:
  quote: ''
  summary: 'A fragmentary charm discussion links healing or sheltering with the earth,
    then the passage surveys beliefs about the elvish mare or nightmare: it rides
    men and horses, leaves horses sweaty and tangled, is driven away by horse-skull
    bones on roofs, and is discussed through Germanic terms for horse or mare. The
    passage cites an Old Norse example in which a mara kills King Vanlandi in sleep
    by trampling him, compares the image to other riding or treading beings, and gives
    part of a Dutch spell-song against the maer.'
  language: English with embedded Latin, Old Norse, Dutch, and Germanic philological
    forms
  quote_policy: summarized
