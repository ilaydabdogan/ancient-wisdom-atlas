canonical_text:
  quote: ''
  summary: The passage surveys comparative legend variants in which the Saviour or
    Peter grants wishes or a wishing-die, Peter descends from heaven to hell with
    dice to win souls, and Peter or a travelling companion serves as cook or steals
    portions from a roast. Grimm relates these Christianized figures and episodes
    to Wuotan, Mercury, and Loki/Othin-type heathen material.
  language: English
  quote_policy: summarized
