  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the Fabliau St. Pierre et le jongleur, Peter comes down from heaven to
    hell with dice to win souls from a showman or juggler.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says Peter’s appearance in that fabliau resembles Wuotan, who
