canonical_text:
  quote: ''
  summary: 'The passage assembles medieval learned and vernacular testimonies about
    night-faring women or spirits: Diana, Herodias, and Minerva in source traditions;
    night-women or night-farers making painful nocturnal journeys; riders on calves
    and he-goats; a nocturnal presider summoning assemblies and banquets; lamiae or
    striges attacking infants; S. Germanus exposing supposed night-women as demons;
    and nocturnal ladies described as good women who frequent homes and give gifts.'
  language: English with quoted Latin and Middle High German
  quote_policy: summarized
