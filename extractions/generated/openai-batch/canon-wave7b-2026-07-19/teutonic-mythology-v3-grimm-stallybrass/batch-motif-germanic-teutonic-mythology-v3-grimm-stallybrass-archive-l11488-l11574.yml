canonical_text:
  quote: ''
  summary: The passage discusses alleged heathen or ancient antecedents for witch-ducking,
    blood marks, witchcraft practices, and witch-recognition. It describes blood covenants
    and Odinic spear-marking, then summarizes Servian beliefs about the veshtitsa,
    including possession, animal-form spirit departure, heart-eating, garlic safeguards,
    nocturnal flight, water ordeal, and snake-head detection, followed by German,
    Danish, and Dalarne parallels for recognizing witches in church.
