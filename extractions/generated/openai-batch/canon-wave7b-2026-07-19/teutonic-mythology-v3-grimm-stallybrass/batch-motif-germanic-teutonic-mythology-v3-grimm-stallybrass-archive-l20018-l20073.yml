  summary: The passage compares several charms against a nocturnal mare/drude-like
    spirit. The charms occupy or divert the spirit with exhaustive movement through
    hills, waters, trees, leaves, stalks, and sticks until dawn, and one spell forbids
    it from house, yard, and bedstead. Grimm then notes that dawn scares the sprite
    away and compares the closing formula to the Alvismal. The passage shifts to healing
    and blood-stanching spells, describing narrative openings involving Hille/Hilda,
    Mary, Christ, and God the Father.
