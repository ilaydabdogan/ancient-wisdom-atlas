canonical_text:
  quote: ''
  summary: The passage recounts several legends in which a trold or Devil bargains
    to build a church, barn, castle wall, or water conduit in exchange for a human
    forfeit or condition. The supernatural builder is defeated either when a secret
    name is learned or when a cock is made to crow before daybreak, leaving an unfinished
    structure or landmark. The passage also notes parallels involving an unborn child
    promised by ambiguous wording.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A trold offers to help finish a church on condition that Esbern must know
    the trold's name when the church is completed, or else forfeit his heart and eyes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the work is nearly finished, Esbern hears a trold-wife on a rock soothing
    her child and naming the father as Fin.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Esbern addresses the trold by the name Fin; the trold becomes enraged, rises
    into the air with the remaining half-pillar, and the church is left with three
    and a half pillars.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author notes that Finnr is the name of a dwarf in the Edda.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In a Lower Hesse tale, a peasant needing a larger barn meets a gray old mannikin
    who offers to build one before dawn in exchange for whatever hidden property the
    peasant owns.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After accepting the bargain, the peasant notices a cow's foot and a horse's
    foot under the gray coat, and his wife says he has signed away their unborn child
    to the Evil one.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: During the night, the Devil directs workers who build the barn rapidly; the
    peasant's wife, dressed in her husband's clothes, imitates a cockcrow, causing
    the cocks to crow and the evil spirits to flee before the barn is fully closed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the same barn tale, the Devil smashes a carter, cart, and horses against
    the barn; a figure is said to remain printed on the stone, and the unfinished
    gable cannot be closed by human work.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The hill where the gray man first appeared to the peasant is called Teufelsburg.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Gleichberge tale, the Devil builds a wall around a knight's castle
    after bargaining for the knight's daughter's hand, but the nurse makes the cocks
    crow before daybreak and the Devil destroys his own work.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A variant says the nurse overhears the compact, takes a dark lantern to the
    hen-roost, and makes the cock crow by showing it light before day.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the Coslitz mill tale, the Devil agrees to provide water by daybreak before
    the cock crows in exchange for the miller's daughter, but an early cockcrow trick
    causes him to leave the conduit unfinished.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: A footnote compares the unborn-child incident with stories in which Höttr/Odinn
    demands what is between Geirhildr and the vat and the wilde walrabe demands what
    the queen has under her belt.
  category: relationship
  evidence_refs:
  - ev:7
