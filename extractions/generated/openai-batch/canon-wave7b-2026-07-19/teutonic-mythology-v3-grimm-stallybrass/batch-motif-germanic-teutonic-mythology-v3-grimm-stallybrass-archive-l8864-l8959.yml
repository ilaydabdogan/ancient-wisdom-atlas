  locator: 8864-8959; Lower Hesse barn remains and place-name
  quote_or_summary: The barn gable cannot be closed, work built by day falls out at
    night, and the hill where the gray man appeared is called Teufelsburg.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v3-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 8864-8959; footnote on unborn-child comparanda
  quote_or_summary: A footnote says Höttr/Odinn demands what is between Geirhildr
    and the vat, namely her unborn child, and that the wilde walrabe requires of a
    queen what she has under her belt; the author treats this incident as evidence
    for heathen origin of the Hessian tale.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v3-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 8864-8959; Gleichberge wall tale
  quote_or_summary: At the Gleichberge, the Devil carries a wall around a knight's
    castle after bargaining for the daughter's hand; before daybreak the nurse slaps
    her knees, the cocks crow, the Devil loses, and he destroys his own work, leaving
    ruins.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v3-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 8864-8959; Gleichberge variant
  quote_or_summary: A variant says the nurse overhears the compact and uses a dark
    lantern at the hen-roost so the cock thinks it is day and crows.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v3-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 8864-8959; Coslitz mill conduit tale
  quote_or_summary: The Devil undertakes to supply a Coslitz mill with water by daybreak
    before the cock crows in exchange for the miller's daughter; he nearly finishes
    a conduit from the Elbe, but an imitated cockcry or knocked leather apron makes
    the cock crow, so he departs angry and the trench remains unfinished.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v3-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: 8864-8959; closing footnote on devil-exit holes
  quote_or_summary: A footnote says that in any church, the hole through which the
    devil has flown out can never be closed, and notes the same incident in a Thuringian
    story.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v3-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
