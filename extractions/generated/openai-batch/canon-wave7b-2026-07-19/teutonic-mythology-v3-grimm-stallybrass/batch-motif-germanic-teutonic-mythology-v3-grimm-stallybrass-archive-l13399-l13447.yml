canonical_text:
  quote: ''
  summary: 'The passage describes several divinatory practices: interpreting fish
    found in baskets in connection with sacrifice, weather, and fertility; listening
    in sacred grain fields for voices or spirits speaking of future events; using
    cross-roads as places for omen-seeking, prayer, sacrifice, and spirit or witch
    meetings; sitting on an animal hide at a cross-way to learn the future; a Gaelic
    rite in which a man wrapped in the warm skin of a freshly killed animal is laid
    beside a waterfall for revelation; and related cross-road omen practices in Persian
    and Christmas Eve examples.'
  language: English
  quote_policy: summarized
