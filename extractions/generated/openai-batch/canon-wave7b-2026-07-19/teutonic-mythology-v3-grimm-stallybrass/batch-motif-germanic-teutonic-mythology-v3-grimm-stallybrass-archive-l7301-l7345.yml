  quote: ''
  summary: The passage catalogs the Devil and other supernatural figures as mainly
    human beings marked by animal appendages or features. It then notes how such partial
    animal traits could lead to complete animal form or temporary transformation,
    with emphasis on horse-footed or horse-formed figures, including the Devil, kobolds,
    water-spirits, Grant, and Loki’s mare transformation.
  language: English
  quote_policy: summarized
