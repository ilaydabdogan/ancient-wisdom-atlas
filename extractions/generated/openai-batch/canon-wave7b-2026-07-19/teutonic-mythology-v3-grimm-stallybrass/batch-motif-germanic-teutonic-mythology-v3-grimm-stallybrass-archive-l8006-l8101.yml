canonical_text:
  quote: ''
  summary: The passage surveys medieval and folk references to the devil's mother,
    grandmother, wife, bride, or related female figure; compares her with female figures
    in giant-household stories; records weather and natural-phenomenon sayings involving
    the devil and his female kin; gives an Austrian tale explaining a Danube whirlpool
    and devil's tower; and then discusses lingering private offerings to gods, spirits,
    water beings, and the devil, including black animal sacrifices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In one recurring story pattern, human guests arrive while the devil is away,
    are concealed by a female figure in the house, and are detected by the son when
    he returns.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage compares this with Thorr and Tyr entering giant Hymir's house,
    finding his 900-headed grandmother and another female, his sweetheart, who hides
    them under a cauldron.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Medieval and later sayings cited in the passage name the devil's mother, dam,
    grandmother, son, wife, or bride; the passage states that the mother is sometimes
    represented as worse than her son and sometimes as gentler.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Several proverbs explain alternating rain and sunshine, or thunder while the
    sun shines, as the devil bleaching, beating, or otherwise acting upon his mother,
    grandmother, or wife; Dutch and French variants name the wife.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage also connects related sayings or comparisons with crackling fire,
    earthquake, the devil's bride, a giant grinding fire out of stones, the Wind's
    bride, and Percuna tete bathing the Thunder-god.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Austrian tale summarized, the devil's franel becomes bored in hell,
    comes to Upper Austria, has her son build her a castle near the Danube, is mocked
    when no one worships her, and throws a piece of rock with part of the castle into
    the Danube at the place called wirbel and strudel; the ruins are called the devil's
    tower.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says private sacrifices intended for gods or spirits persisted
    after conversion, including leaving a clump of ears in a field for Wuotan or Dame
    Gaue, presenting oats to Death or the Wild Hunter, and placing lighted candles
    beside holy waters.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage reports black lambs and kids offered in Norway to the watersprite,
    similar sacrifices among Lettons and Lithuanians, goats and horses demanded by
    whirlpools and rivers, and black lambs offered to Hecate.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: In a Hessian folktale, the Devil guards a treasure and will not allow it to
    be lifted unless a black he-goat exactly a year and a day old is offered to him.
  category: action
  evidence_refs:
  - ev:8
