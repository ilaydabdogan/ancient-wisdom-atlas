canonical_text:
  quote: Our early ages appear also to have seen a meaning in the over-flight of certain
    birds.
  summary: The passage discusses meaningful bird overflight and overshadowing, especially
    eagles shading heroes or appearing at Charles's hall; it then interprets a Havamal
    stanza about an 'oblivion's heron' as OSinn taking eagle form after drinking nectar
    at Gunnlo^'s house. It compares this with Zeus as an eagle in the Ganymede myth,
    notes Roman and Greek poultry divination, and contains a fragment about a snake
    crossing a path as an omen of misfortune.
  language: English, with cited Old Norse/Icelandic and Latin glosses
  quote_policy: quoted
