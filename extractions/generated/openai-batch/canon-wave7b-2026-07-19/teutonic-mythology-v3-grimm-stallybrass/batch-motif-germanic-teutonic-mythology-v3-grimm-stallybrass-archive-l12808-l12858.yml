canonical_text:
  quote: ''
  summary: 'The passage lists safeguards against magic and harmful beings: spitting,
    drawing blood from a suspected witch, firebrands, bread, salt, coals, marked loaves,
    steel, knives marked with a cross, crosses on doors, fields, and cradles, a hammer
    wrapped in white linen near a woman in childbed, and bells. It also gives a footnoted
    werewolf encounter involving fire-steel tied to a whip.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Spitting is cited as a repellent or averting act in several examples, including
    Greek and Latin references and home-sprites that cannot bear spitting.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In urgent need, the passage says a suspected witch may be struck so that blood
    is drawn, or a firebrand may be thrown at her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bread, salt, and coals are described as protective against magic; witches
    are said to abstain from bread and salt, and a marked loaf is described as distasteful
    to wood-wives.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Steel thrown over enchanted beasts is said to make them resume their natural
    shape.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A knife marked with the cross is said to reveal a witch, steel placed between
    an elfin being and a hill prevents entry into it, and steel protects a child in
    a cradle from being changed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Witches and devils are said to shun the sign of the cross; crosses are placed
    on doors on the first night in May, ploughed into field corners, and used on cradles
    before baptism against elf or devil.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says heathens similarly used a hammer, and cites a hammer wrapped
    in white linen where a woman in childbed lies.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Evil spirits are said to hate and shun bells, whose sound disturbs their dance
    at the cross-road.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In a footnote, a peasant tries to disenchant an approaching werewolf by tying
    fire-steel to his whip-lash and flinging it over the wolf's head; the wolf catches
    the steel, and the peasant flees.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The author states that many magical appliances run into superstition and that
    a fixed boundary between superstition and magic is impossible to draw.
  category: relationship
  evidence_refs:
  - ev:8
