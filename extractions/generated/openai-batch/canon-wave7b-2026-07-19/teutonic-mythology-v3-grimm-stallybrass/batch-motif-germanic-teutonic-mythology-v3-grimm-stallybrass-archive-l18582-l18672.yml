canonical_text:
  quote: ''
  summary: The passage discusses the pearl and its possible Teutonic etymology, then
    surveys medieval and comparative lore about precious or magical stones generated
    in human or animal bodies, especially stones associated with oysters, lynxes,
    cocks, adders, toads, and birds. These stones are said to adorn royal objects,
    confer victory or invincibility, quench thirst, grant wishes, or be stolen and
    transferred to another owner.
  language: English with Latin and Middle High German quotations
  quote_policy: summarized
