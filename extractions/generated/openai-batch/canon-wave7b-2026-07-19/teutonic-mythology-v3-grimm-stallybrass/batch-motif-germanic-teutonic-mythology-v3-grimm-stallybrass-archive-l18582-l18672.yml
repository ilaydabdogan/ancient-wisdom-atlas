  text: The passage proposes that words for pearl such as OHG marigreoz, OS merigriota,
    and AS meregreot mean grit or pebble of the sea, and it presents the possibility
    that Greek and Roman terms may have borrowed from Teutonic usage.
  category: other
  evidence_refs:
