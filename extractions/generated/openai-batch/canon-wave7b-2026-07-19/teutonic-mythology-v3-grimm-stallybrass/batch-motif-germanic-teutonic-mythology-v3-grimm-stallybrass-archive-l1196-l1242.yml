canonical_text:
  quote: ''
  summary: In a preface passage, the author criticizes attempts to explain Germanic
    witchcraft, demonology, heroes, giants, deities, and customs as direct derivations
    from Greek or Roman antiquity. He rejects comparisons such as the devil with Dionysus,
    witch with Hecate, Walburgis-night with Roman lares, and possible reductions of
    Wuotan, Holda, and the alp to classical figures.
  language: English
  quote_policy: summarized
