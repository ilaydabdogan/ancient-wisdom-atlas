canonical_text:
  quote: ''
  summary: 'The passage surveys beliefs about crop magic: sorcery may destroy produce
    or transfer it from one field to another; examples include Roman literary notices,
    unholden shaking vines, a staff placed in a field or under an oak, boiling vine-shoots,
    and witches bathing naked in grain or flax. It also notes witch implements and
    a footnote association of whirlwinds or storms with witches and air-riding women.'
  language: English
  quote_policy: summarized
