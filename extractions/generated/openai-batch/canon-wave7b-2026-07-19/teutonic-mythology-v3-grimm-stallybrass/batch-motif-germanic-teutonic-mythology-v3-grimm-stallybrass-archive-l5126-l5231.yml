canonical_text:
  quote: ''
  summary: 'The passage explains Entrückung, or removal/translation, as a mythological
    idea distinct from metamorphosis: a cursed or banned person or thing remains in
    its natural form but becomes withdrawn from ordinary perception and may reappear
    periodically. It associates vanishing with gods, spirits, and certain heroes,
    describes translated men as spirit-like sleepers, links vanished figures with
    spectres and dead souls, and describes a common representation in which the enchanted
    are enclosed inside mountains or received into the earth. Footnotes compare long-sleep
    examples such as the Seven Sleepers and Endymion.'
  language: English
  quote_policy: summarized
