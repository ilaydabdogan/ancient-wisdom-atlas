    Devil, including storm and wind associations, hammer and bolt terms, and round
    rolling forms. It reports that the Devil may unwind from a ball of yarn or roll
    down a mountain as a millstone, compares this to Swedish legends of giants rolling
    from mountains as balls or bundles of thread when frightened by Thor's lightning,
    and notes related accounts of whirlwinds, storms, chained devils, and witches
    transformed into balls.
