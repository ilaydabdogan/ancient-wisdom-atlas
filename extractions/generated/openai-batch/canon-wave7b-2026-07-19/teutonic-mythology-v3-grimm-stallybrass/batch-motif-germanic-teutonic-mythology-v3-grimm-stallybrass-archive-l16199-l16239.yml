canonical_text:
  quote: ''
  summary: The passage lists charms and remedies in which fever, gout, corns, or hidden
    internal diseases are transferred into trees, animals, bird-associated verbal
    formulas, or animal skins. It cites a willow charm with silence and no-looking-back
    rules, a pine-tree gout charm, Pliny’s puppy and duck cures, later whelp-suckling
    practice, bird-eye names for corns with a Swiss magpie saying, and beast-fable
    or medieval examples of wrapping patients in animal hides to sweat out illness.
  language: English with embedded Latin citations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fever-prevention charm directs the participant to avoid crossing water,
    breathe three times into a hollowed willow, block the hole, and return home without
    looking back or speaking.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A gout charm is described as handing the gout over to a young pine tree with
    a courteous verbal greeting.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: One Pliny passage says that a suckling puppy pressed to painful human body
    parts receives the disease; after dissection the corresponding organ is found
    damaged, and the animal is to be buried.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Another Pliny passage says that blind puppies applied for three days to the
    stomach and chest receive hidden disease through sucked milk and die; a duck applied
    to the belly is likewise said to receive the disease and die.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage reports that in recent centuries people placed young whelps at
    the human breast and let them suck.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Corns are associated with bird-eye names, and a Swiss saying at the place
    where a magpie sat is presented as a way to get rid of a magpie’s eye.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Flying gout is treated by swathing the patient in clean flax, spreading a
    sheepskin over the patient, and administering a sweating medicine.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the cited Aesopic beast-fable, a feverish lion is told to wrap himself
    in the hide of a three-and-a-half-year-old wolf flayed alive and to sweat.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: In an old German poem, the lion’s illness is caused by an ant in his brain;
    Reynard prescribes an old wolf hide, a bearskin, and a catskin hat, and the warmed
    cat fur draws the ant out.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage states that wrapping in the newly stripped hide of an animal was
    practiced in the Middle Ages in various emergencies, including for weak prematurely
    born infants.
  category: action
  evidence_refs:
  - ev:10
