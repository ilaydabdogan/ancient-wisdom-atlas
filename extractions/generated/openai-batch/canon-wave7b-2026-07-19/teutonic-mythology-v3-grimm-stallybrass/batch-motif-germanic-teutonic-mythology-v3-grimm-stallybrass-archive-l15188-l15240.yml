canonical_text:
  quote: ''
  summary: The passage surveys Germanic and related terms for physician, leech, healing,
    drugs, herbs, poison, and magic. It notes examples of women healers, peasant old
    women who heal by stroking, pouring, and spells, a rule that healing spells are
    transmitted between women and men rather than within the same sex, Wate learning
    healing art from a woman, shepherds and other rural figures as mediciners, and
    medieval itinerant leeches accompanied by trick-performing assistants.
  language: English
