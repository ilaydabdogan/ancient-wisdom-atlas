canonical_text:
  quote: ''
  summary: A philological and folklore-oriented catalogue of terms for miscarriage,
    childbirth, colic, heart and stomach complaints, headaches, respiratory ailments,
    skin diseases, jaundice, leprosy, stone, and excrescences. Several diseases are
    described through proverbial metaphors or as animal-like agents such as toads,
    mice, worms, beetles, and a pursuing wolf in a charm.
  language: English with Germanic, Latin, Greek, and other comparative terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Miscarriage and abnormal birth are associated with terms such as moon-calf,
    misbirth, misgeburt, fehlgeburt, miskram, and phrases of upsetting, tipping, spilling,
    or going wrong.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: Proper birth is contrasted with abnormal birth by expressions of bringing
    the child to the right place or getting the child on the knee.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Birth-related idioms describe a house cracking when birth is near, a house
    tumbling when it is over, an oven breaking down, and a chamber being unlocked.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bermutter, used of colic and identified with hysterica passio, is represented
    as a toad and also as a mouse that runs out of the body.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: For the mouse-form Bermutter, a sword is laid across a stream.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A heartworm is said to be present in every person, and the person would die
    if it crept out of the mouth or got onto the tongue.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Hot hunger is explained by an animal-like worm: a lizard-like worm living
    in the stomach, also called a zadelwurm that gnaws people.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: St. Anthony's fire, erysipelas, and related skin afflictions are named with
    images of fire, running fire, sacred fire, and in one Swiss term a flying cloud.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Red spots on a child's face are explained by the saying that the Jiidel has
    burnt the child.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: A note says that Greeks also imagined impetigo as caused by a small beetle.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: A charm against impetigo addresses beetles and tells them to go away because
    the wild wolf chases them.
  category: speech
  evidence_refs:
  - ev:8
