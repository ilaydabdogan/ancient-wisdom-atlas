canonical_text:
  quote: Two requisites for raising the treasure are silence and innocence.
  summary: 'The passage describes Germanic folk beliefs about hidden treasures: treasures
    may rise to the surface and show fiery signs, or remain in caverns; raising them
    requires silence and innocence; tokens may be thrown on them to claim and ward
    danger; hoards are indicated or guarded by vanished heroes, white dames, animals,
    flames, flowers, and beetles; and a plant or wonderflower can open a mountain
    entrance to treasure for a favoured person.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The treasure is said to rise out of the ground to sun itself on Fridays in
    March and to appear with clear blaze, blue flame, glowing embers, red gold, or
    fire over it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some treasures are said not to move toward the surface and instead must be
    sought inside the cavern.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that raising treasure requires silence and innocence; crying
    out over a treasure makes it sink, while children or shepherd lads may find it
    and a person stained with vice cannot come near it.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person who spies the treasure is advised to throw bread, clothing worn next
    to the skin, or a three-halfpenny piece over it as an act of possession and protection
    from danger.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The hoard is described as indicated by vanished heroes and white dames, and
    as indicated and watched by dogs, snakes, and dragons; flickering flame, a blooming
    flower, and swarming beetles are also signs of it.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: To enter the mountain where the treasure is concealed, one usually needs a
    plant or root to clear the way or burst the door.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Folktales call the access-plant a beautiful wonderflower, which a favoured
    person finds and sticks in his hat; then entrance and exit to the mountain treasure
    stand open.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Inside the cavern, the favoured person fills his pockets with valuables and,
    bewildered, lays aside his hat before the passage breaks off at the mention of
    a warning.
  category: sequence
  evidence_refs:
  - ev:7
