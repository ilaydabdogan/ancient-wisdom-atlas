canonical_text:
  quote: ''
  summary: 'The passage discusses Germanic and Norse magical practices and beliefs:
    weapon-proofing magic, nocturnal gatherings and excursions of magic-wielding women,
    pagan half-goddess figures associated with ring-dances, storm-raising, invulnerability,
    and prophecy, and ritual seats or stools such as the seið-hjallr. It also makes
    cautious comparisons to German night-women, Hulda and Berhta, the Delphian Pythia’s
    tripod, and wider pre-Christian beliefs in magic-wielding women.'
  language: English with Old Norse citations
  quote_policy: summarized
