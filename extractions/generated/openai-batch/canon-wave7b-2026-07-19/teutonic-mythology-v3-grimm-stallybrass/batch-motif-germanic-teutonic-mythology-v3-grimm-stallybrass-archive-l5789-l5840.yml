  quote: ''
  summary: The passage presents several local legends of female figures, often white
    women or white maidens, appearing at ruins, a convent garden, an underground well,
    and a deserted castle. Some beckon to human witnesses, vanish, or are associated
    with buried treasure, keys, vaults, flax-pods that become gold or ducats, and
    a gift of cherries in an episode whose ending is truncated.
  language: English
