canonical_text:
  quote: ''
  summary: The passage discusses apparitional dead and heroes associated with mountains
    or rock interiors. It identifies Donnersberg as a mountain where ancient ghosts
    or fallen and resuscitated heroes ride in and out, interpreted by a Christian
    eye as hell-fire. It then lists legends in which Siegfried and other heroes dwell
    in Geroldseck, the three founders of the Swiss Federation sleep in a rock cleft
    near Lake Lucerne, and Frederic Barbarossa sleeps at Kyffhäuser until signs indicate
    his awakening and future return.
  language: English with Latin fragment
  quote_policy: summarized
