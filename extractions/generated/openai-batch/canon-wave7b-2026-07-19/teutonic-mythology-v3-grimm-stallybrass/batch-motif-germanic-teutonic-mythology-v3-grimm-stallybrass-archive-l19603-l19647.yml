canonical_text:
  quote: "“ploughing is here preceded by sacrificial rites”"
  summary: 'The passage describes rites for blessing a cornfield before ploughing:
    sods from the four field corners are consecrated with substances, herbs, holy
    water, and masses; spells are spoken; unknown seed is placed on the plough; the
    first furrow is ploughed with an address to Earth; and a milk-kneaded loaf is
    placed under the first furrow. It also cites ordinances concerning honey, milk,
    and wheel-sized plough loaves, and compares the practice with Roman agricultural
    offerings.'
  language: English
  quote_policy: quoted
