  summary: The passage describes seasonal avoidance practices connected with feared
    wild or woodland spirits, including offerings to the wood-wife. It then discusses
    the wild hunt, especially boar-hunting traditions and stories in which people
    mock the supernatural hunter and are punished or given boar meat to gnaw.
  language: English with German dialect quotations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Vicentine and Veronese Germans, hunters avoid tracking game at certain
    seasons because they fear the wild man and the wood-wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Herdsmen do not drive cattle out during those seasons; flocks and herds are
    watered in the stable, with children fetching water from the nearest spring in
    earthen vessels.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women spin a portion of hair or flax on their distaffs and throw it into the
    fire as a peace-offering to the wood-wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says the legend of the wild hunt extends to the Ardennes and that
    the hunted object is usually the boar.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A wood-cutter who took part in the hunt is said to have spent a fortnight
    salting boar flesh.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that people dread dealing with these powerful spirits and
    that those who overcome this reluctance pay heavily.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Münsterland tailor mocks the wild hunter's cry when the hunt passes over
    his house; a horse's foot comes through the window and knocks him from his table,
    while a voice threatens that if he hunts with the hunter he must gnaw with him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In a Delligsen/Hohne tale, the helljäger hunts through the air and calls out;
    local labourers gather with village dogs to tease him by imitating his calls and
    the sounds of the aerial dogs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Delligsen/Hohne tale, the helljäger throws something down and says
    that if they hunt with him they can gnaw with him; the next morning the object
    is found to be an old boar gammon.
  category: sequence
  evidence_refs:
  - ev:5
