canonical_text:
  quote: ''
  summary: 'The preface discusses losses in Germanic mythology and identifies surviving
    sources: written memorials, living popular tradition, Roman records, Christian
    Latin authors, and Gothic linguistic material. It lists several Germanic divine,
    heroic, female, and ethnographic/place names preserved in or inferred from these
    sources.'
  language: English
  quote_policy: summarized
