canonical_text:
  quote: ''
  summary: The passage describes the spring-wurzel, an explosive or wonderful root
    obtained by sealing a woodpecker's nest while it has chicks. The parent bird retrieves
    the root to open the sealed nest; a hidden human may frighten the bird into dropping
    it. Related attestations describe a tree-hacker bird using a herb to force out
    wedges and open locks, the woodpecker as sacred and knowledgeable about herbs,
    and comparative analogues involving Solomon's shamir and an ostrich fetching the
    thumare.
  language: English, with quoted Middle High German and Latin excerpts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some stories use the spring-wurzel, described as an explosive root or herb,
    instead of a wonderflower or keyflower.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described procurement procedure begins by closing tightly the nest of
    a green or black woodpecker while it has chicks, using a wooden bung.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woodpecker, finding the nest blocked, flies away to obtain a wonderful
    root, returns carrying it in its bill, and holds it before the bung.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the root is held before the bung, the bung immediately flies out as if
    struck by a powerful blow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A hidden person may raise a loud clamour when the woodpecker arrives, frightening
    it so that it lets the root fall; another version places a white or red cloth
    under the nest to catch the root after use.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the Conrad von Megenberg passage, the tree-hacker nests in hollow trees;
    if its young are nailed up with a wedge, it brings an herb and holds it before
    the wedge, which starts out.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Conrad passage says the herb should not be generally known, because locks
    fly open before it and imprisoned people could be freed by it.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that the pecker was esteemed as a sacred and divine bird
    and that other tales present the woodpecker as knowing and guarding the magic
    virtues of herbs.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The footnote recounts a Rabbinic legend in which Solomon has a woodcock's
    nest with chicks covered with white crystal, the bird fetches the shamir, and
    a messenger's loud cry makes the bird drop it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The footnote states that the Gesta Romanorum tells nearly the same story of
    an ostrich fetching the blaster worm called thumare.
  category: sequence
  evidence_refs:
  - ev:7
