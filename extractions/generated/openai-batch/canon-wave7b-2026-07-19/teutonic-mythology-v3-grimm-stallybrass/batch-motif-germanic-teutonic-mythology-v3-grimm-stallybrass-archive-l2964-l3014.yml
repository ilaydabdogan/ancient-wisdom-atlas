canonical_text:
  quote: ''
  summary: The passage surveys comparative traditions about the divine or supernatural
    invention of musical instruments and the power of music. It links Wuotan with
    Hermes and Apollo as an inventor of rhythm, writing, and possibly an instrument;
    describes Wainamoinen inventing the Finnish kantelo; compares Hermes making the
    lyre from a tortoise shell; cites northern songs and tales where dead victims'
    remains become instruments that reveal or punish murder; and describes music moving
    nature and producing miraculous tears.
  language: English
  quote_policy: summarized
