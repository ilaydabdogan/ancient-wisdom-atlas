canonical_text:
  quote: ''
  summary: 'The passage surveys healing charms and formulaic patterns: colored worms
    killed in a charm; Christian sacred names replacing older heathen names such as
    Wuotan; wandering or staff-bearing sacred figures; repeated triads of personages,
    especially female figures connected with healing; a Brandenburg eye-disease charm
    performed with gestures and crossed fingers; and charms in which remedies and
    diseases are represented as combatants or as beings sent away over the sea.'
  language: English, with quoted Latin and German charm material
  quote_policy: summarized
