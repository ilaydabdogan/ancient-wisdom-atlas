canonical_text:
  quote: ''
  summary: 'The passage catalogs divinatory customs: floating marked pots or nutshells
    to predict romantic matches; signs and a church ritual to determine an unborn
    child’s sex; shoe-throwing to discover where one will stay longest; salt heaps
    to foretell death or survival; lead pouring as a widely received custom; and filberts
    placed in wine to divine by whether they rise or sink.'
  language: English with quoted Old French and Latin
  quote_policy: summarized
