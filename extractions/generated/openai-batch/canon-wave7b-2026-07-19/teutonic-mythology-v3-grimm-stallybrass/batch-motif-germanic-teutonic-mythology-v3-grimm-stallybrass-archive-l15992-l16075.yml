canonical_text:
  quote: ''
  summary: The passage surveys healing and protective customs involving passage through
    holes in stone, earth, or trees; cleft trees used to cure children; naturally
    formed tree openings used for afflicted people and women in labour; English pollard-ashes
    used for ruptured children; and the shrew-ash, a medicated ash tree used against
    cattle pains attributed to shrewmice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that creeping through a gap in oak, earth, or stone seemingly
    transferred sickness or sorcery to the tree or soil.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Poitou, weak children are said to regain strength after being seated in
    the hole of a stone associated with Saint Fesse, and farmers leave space around
    the stone when ploughing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Magdeburg country example, two brothers, preferably twins, split a
    cherry-tree, pull a sick child through it, and bind the tree again; the child's
    healing is linked to the tree's healing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Near Wittstock in the Altmark, afflicted people crept through holes made by
    intergrown boughs of a gnarled oak and were said to recover; crutches left by
    convalescent cripples lay around the tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In Sweden, round openings in intertwisted boughs are called elf-bores, and
    women in labour are forced through them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: At Selborne, young pollard-ashes were cleft open while ruptured naked children
    were pushed through; afterward the tree was plastered with loam and swathed, and
    the cure was expected if the cleft coalesced.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A shrew-ash is described as an ash whose twigs or branches relieve cattle
    pains when applied to affected limbs.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage attributes cattle pain to a shrewmouse running over the affected
    part of a horse, cow, or sheep.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: A shrew-ash was made by boring a hole in the tree, thrusting a live shrewmouse
    into it, and plugging the hole; forgotten incantations are mentioned as likely
    accompaniments.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The old shrew-ash near the church area was cut down and burnt by the late
    vicar despite bystanders asking for its preservation.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A footnote cites an Old French Tristan episode in which Frocine speaks a secret
    under the hollow root of a blackthorn, and the secret passes to the thorn.
  category: speech
  evidence_refs:
  - ev:10
