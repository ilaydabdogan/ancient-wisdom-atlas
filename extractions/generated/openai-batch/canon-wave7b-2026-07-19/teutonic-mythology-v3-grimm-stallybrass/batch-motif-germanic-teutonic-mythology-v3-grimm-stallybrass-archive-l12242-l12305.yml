canonical_text:
  quote: ''
  summary: 'The passage surveys wax and other images used in magic: wax figures as
    limited mimics of creation, a Morgante witch whose vitality is bound to a wax
    figure that Malagigi melts, baptized wax/wood/bone used for bewitching, votive
    wax images or limbs used in churches for healing, Ovidian red-wax needle magic,
    a Gesta Romanorum story of attacks on an image evaded by ducking under water,
    and a Hist. Trev. anecdote alleging a baptized wax image of a bishop burned to
    cause illness and death.'
  language: English
  quote_policy: summarized
