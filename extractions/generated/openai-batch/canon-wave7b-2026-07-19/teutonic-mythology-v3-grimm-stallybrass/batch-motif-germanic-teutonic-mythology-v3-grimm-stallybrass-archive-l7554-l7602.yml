canonical_text:
  quote: ''
  summary: 'The passage surveys names and forms of the Devil or diabolic spirits derived
    from physical figure: especially fly and other insect forms, the ability to become
    very small or large, and the association of the Devil with the hammer and bolt.
    It compares these with Loki''s fly transformation, fairy-tale imprisoned fly-spirits,
    Lombard and Benedictine examples of fly-like evil spirits, butterflies as souls
    or spirits, beetles as devils, biblical and church uses of malleus, and Donar''s
    hammer.'
  language: English
  quote_policy: summarized
