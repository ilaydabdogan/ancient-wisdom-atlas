  quote: ''
  summary: The passage compares several tales of supernatural or wild hunters. It
    summarizes Boccaccio’s story of a ghost who repeatedly hunts and kills his former
    mistress with hounds; notes parallel chases by the Wunderer and by Fasolt; and
    describes the Danish legend of King Waldemar or Wolmar as a night-riding wild
    hunter in Gurre, accompanied by black hounds, a white horse, a whip, and an established
    supernatural route.
  language: English
