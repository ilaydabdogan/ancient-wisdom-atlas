  summary: The passage surveys lot divination as a venerable Germanic method for resolving
    uncertainty and forecasting, describes two procedures for casting or drawing lots,
    quotes Tacitus on marked twigs from a fruit-bearing tree scattered on a white
    cloth and interpreted by a priest or household head, notes a connection with runes
    and ciphers, and adds an Armenian example of augury from wind-moved cypress boughs.
  language: English with quoted Latin and Germanic linguistic forms
