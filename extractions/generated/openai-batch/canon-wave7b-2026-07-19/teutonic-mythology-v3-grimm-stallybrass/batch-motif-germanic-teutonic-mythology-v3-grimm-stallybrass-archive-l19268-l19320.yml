canonical_text:
  quote: "“bone to bone, and sinew to sinew”"
  summary: The passage records a Scotch sprain charm using a black wool thread with
    nine knots, tied around the injured limb while an operator whispers a formula
    about the Lord, a sliding foal, and the setting of joint, bone, and sinew. It
    then compares similar body-part rejoining formulas in Teutonic versions and cites
    a Vatican charm invoking the Crucifixion, Longinus, and a third-day command restoring
    body parts.
  language: English with embedded Scots and German charm text
  quote_policy: quoted
