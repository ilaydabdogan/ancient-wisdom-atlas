  quote: another very ancient means of discovering and obtaining the gold or treasure
    buried in the earth is the wishing-rod.
  summary: The passage discusses magical plants and roots said to open doors or affect
    metal, then treats the wishing-rod as an old Germanic magical rod for finding
    buried treasure. It connects the Old High German term for a wishing-rod with the
    caduceus or magic wand of Mercury, explains the term through ideas of wish, happiness,
    and possible personification, links the rod’s bliss-giving power to Wuotan, and
    surveys medieval poetic uses involving Moses’ rod, the Virgin, Helena, Danish
    lily-stalk imagery, fern, and the Nibelung hoard context.
  language: English with cited Latin and Middle High German forms
