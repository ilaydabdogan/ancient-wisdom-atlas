- id: obs:4
  text: The passage compares Kriemhild's dream-image with ISiinn, described parenthetically
    as possibly a swallow, being seized by eagle Thiassi, and with OSinn, called the
    divine heron, being pursued by eagle Suttungr.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Other cited dream or poetic images include dancers compared with a falcon
