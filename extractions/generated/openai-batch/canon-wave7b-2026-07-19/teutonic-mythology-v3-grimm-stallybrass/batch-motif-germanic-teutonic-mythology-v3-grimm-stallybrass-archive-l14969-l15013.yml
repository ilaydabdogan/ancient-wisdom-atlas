canonical_text:
  quote: ''
  summary: 'The passage surveys dream-related superstitions: dreams are associated
    with birds and flying, bird dreams are compared with older mythic images, and
    certain times or places make dreams more truthful. It also notes prophetic wedding-night
    dreams, first dreams in a new house or bed, ritual counting of rafters, and advised
    dream-sleeping in specially chosen places such as a new-built house or pigsty.'
  language: English
  quote_policy: summarized
