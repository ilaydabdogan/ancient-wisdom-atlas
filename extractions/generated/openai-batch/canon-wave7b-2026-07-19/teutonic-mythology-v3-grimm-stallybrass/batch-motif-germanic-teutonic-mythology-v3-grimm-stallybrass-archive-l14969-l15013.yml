    and that dreams themselves are conceived as birds that come flying.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The subject matter of dreams is said to often be a vision of birds, and the
    author suggests that some such dreams may preserve echoes of ancient myths.
  category: other
  evidence_refs:
