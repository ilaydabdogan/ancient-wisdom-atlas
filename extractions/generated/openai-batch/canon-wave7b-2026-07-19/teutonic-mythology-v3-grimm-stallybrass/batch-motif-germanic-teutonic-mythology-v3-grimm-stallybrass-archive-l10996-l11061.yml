  summary: 'The passage discusses historical and legal treatment of sorcery and witchcraft:
    inquisitorial authorship in 1487, doubtful claims of early witch burnings, older
    laws treating sorcery as tied to concrete crimes such as poisoning, legal penalties
    against those who killed supposed witches, rational refutation of night-excursion
    confessions, and later folk violence against suspected witches by fire or water.'
