canonical_text:
  quote: ''
  summary: The passage recounts how OSinn, under the name Bolverkr, uses a whetstone
    stratagem that kills Baugi’s workers, bargains to do nine men’s work for a drink
    of Suttung’s mead, enters the mountain by means of the gimlet Rati and a worm-shape,
    receives three draughts from Grunnlo^, drains the mead vessels, escapes in eagle-shape
    while Suttungr pursues, and delivers the mead to the Aesir and to men skilled
    in poetry. The passage then lists poetic names for the mead and comments on related
    terms and parallels in notes.
  language: English
  quote_policy: summarized
