  quote: |-
    They  have  had  their  revenge  now,  those
    norns  and  spindle-bearers.
  summary: The preface argues that Germanic mythology should be treated as ancient
    and continuous, like language. It rejects dismissals of old songs as merely Christian,
    Anglo-Saxon, or nurse-and-spinner lore; names “norns and spindle-bearers”; and
    uses water and soil imagery to describe inferring an older heathen tradition from
    scant surviving traces.
  language: English
