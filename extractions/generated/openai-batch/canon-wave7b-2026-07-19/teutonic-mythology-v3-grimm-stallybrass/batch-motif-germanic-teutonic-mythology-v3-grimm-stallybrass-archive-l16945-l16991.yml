canonical_text:
  quote: where she waves her kerchief, everybody dies
  summary: The passage collects plague and sickness tales in which Plague is personified
    as Powietrze or Dzuma, travels through settlements, causes death by movement or
    gesture, is sensed by dogs, appears with white clothing and supernatural mobility,
    rides in a ghostly procession, and is said to end at New Year's. It also begins
    an incomplete Wendish cart tale about a weary stranger taken up by Hans Niebuhr.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Powietrze is glossed as meaning air or vapour and also plague; she is described
    as white-clothed, walking on stilts, naming herself to a man, and asking to be
    carried on his shoulders through all the Russias while promising him safety among
    the dead and dying.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man carries Powietrze through villages and towns; when she waves her kerchief,
    everybody dies and people flee.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the Pruth, the carrier tries to drown Powietrze by jumping into the river,
    but she floats up, flies to the woodland, and he sinks.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In another story the plague is called Dzuma; while she prevails, villages
    are deserted, cocks cannot crow, and dogs no longer bark but scent the Plague
    from afar and growl.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: A peasant sees Dzuma in white garb with waving hair clearing a high fence
    and climbing a ladder to escape howling dogs; he pushes the ladder over, she falls
    among the dogs, disappears, and threatens vengeance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Dzuma sometimes rides through the wood in a wagon attended by owls and uhus;
    the ghostly procession is called Homen.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Plague is said to last only until New Year's Day; those who fled then
    return to their homes but climb in by the window rather than entering through
    the door.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: An incomplete Wendish tale begins with Hans Niebuhr riding home from town;
    a weary man comes alongside, asks to ride in the cart, is taken up, and after
    questioning begins to declare himself.
  category: sequence
  evidence_refs:
  - ev:8
