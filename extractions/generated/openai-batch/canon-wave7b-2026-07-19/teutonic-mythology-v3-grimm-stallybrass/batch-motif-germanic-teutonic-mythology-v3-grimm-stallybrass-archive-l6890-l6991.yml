canonical_text:
  quote: The Devil is Jewish, Christian, Heathen, a false god, an elf, a giant, a
    spectre, all in one.
  summary: The passage analyzes how older heathen gods and spirits were reclassified
    under Christian devil-concepts, how the Devil could be treated as an inverted
    parody of God, how a Devil's mother might parallel Mary and an older giant's-mother
    type, and how the word devil spread and was euphemized across European languages.
  language: English
  quote_policy: quoted
