canonical_text:
  quote: ''
  summary: The passage surveys European superstitions about animals encountered on
    the road and about bird augury. It describes weasel and fox path-crossing omens,
    swine and sheep as signs of welcome or unwelcome reception, right-left distinctions
    in animal omens, Etruscan observation of horses and oxen, and bird divination
    among Greek, Roman, Slavic, and Teutonic traditions. A footnote notes respectful
    or caressing names for the weasel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If a weasel runs past a person, the cited superstition says the person should
    not continue until someone else has paced the road or until the person has picked
    up three stones from it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fox's path-crossing or approach is reported as interpreted differently
    in different cited sources, either as bad or as good.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says domestic animals are generally less available as omens because
    they are common, tame, and dependent on humans.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A reported saying states that meeting swine early when setting out means the
    traveler will not be welcome at the destination, while meeting sheep means the
    traveler will be welcome.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: According to some, sheep appearing on the wayfarer's right hand signify welcome,
    while sheep on the left signify unwelcome.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage reports that Etruscans observed what horses and oxen a new magistrate
    encountered when riding into his province.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In horse prophecy, the passage notes attention to whether the animal plants
    the right foot or the left.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The observation of birds is described as more minute than that of quadrupeds
    because birds move freely through the air, which the passage says gives them a
    marvellous and spirit-like quality.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Greek and Roman systems of bird divination are mentioned, and Bohemian and
    Polish terms connected with bird augury are listed.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that heathen Teutons regarded birds as messengers of the
    gods and heralds of important tidings.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
