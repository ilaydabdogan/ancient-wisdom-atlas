canonical_text:
  quote: ''
  summary: 'The passage surveys the development of ideas about Satan or the Devil:
    Jewish monotheism gives Satan a subordinate role as tempter and traducer; later
    demonology expands around evil spirits and Beelzebub; Christian tradition adds
    Lucifer as a rebel spirit of light banished into darkness; a satanic empire rivals
    the celestial one, recruits wicked people, and enters compacts; and Christianization
    recasts former heathen deities as defeated but still active fiendish powers. A
    footnote mentions Slavic white and black gods while cautioning against treating
    that dualism as thoroughgoing or primitive.'
  language: English
  quote_policy: summarized
