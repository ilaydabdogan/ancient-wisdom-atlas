canonical_text:
  quote: ''
  summary: The passage describes how medieval accusations against heretics and witches
    combined Christian heresy charges with older beliefs in demonic beings. It surveys
    reports from the 13th to 15th centuries concerning alleged compacts with the Devil,
    witch-devil intrigue, a diabolic sisterhood, worship or kissing of animal forms
    such as a he-goat or cat, harmful touch or sight, executions by burning, confiscation,
    and the expansion of witch prosecutions across Europe.
  language: English with embedded Latin quotations
  quote_policy: summarized
