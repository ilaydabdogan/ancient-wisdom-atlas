canonical_text:
  quote: ''
  summary: 'The passage collects Latin and German charm material: a dislocation/fracture
    charm using a split green reed, chanted formula, iron, cutting, and binding; commentary
    on obscure spell words, rhyme, and the invoked god Dissunapiter compared with
    Phol and Wodan; a Marcellus Empiricus heart-pain charm using a tin neck amulet
    and sung formula; and Codex Vindobonensis material on spurihalz, worm-killing,
    and a fragmentary bee charm heading.'
  language: English with Latin quoted charm formulas
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A dislocation/fracture charm instructs the practitioner to take a green reed
    four or five feet long, split it in the middle, and have two men hold it at the
    hips.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same charm directs a chant containing obscure formula words and the name
    Dissunapiter to be recited until the split reed-parts come together, with iron
    thrown over them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the reed-parts meet and touch, the practitioner is told to take the
    reed by hand, cut right and left, bind it to the dislocation or fracture, and
    continue daily chanting; the text states that it becomes sound.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The commentary states that Pliny attributed such words to Cato for dislocated
    limbs and the joining of split reeds, while also noting that the words now seem
