- id: ev:4
  type: summary
  locator: lines 5243-5335; Odenberg gift
  quote_or_summary: Inside the Odenberg, strong men bowl iron balls and offer the
    blacksmith a present. He takes an iron ball home; when heated and struck on the
    anvil, it bursts into pieces of gold.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v3-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: lines 5243-5335; Odenberg lost opening and Sunday children
  quote_or_summary: The blacksmith never again finds the opening. It opens on certain
    days to men and to Sunday children, who see an old long-bearded man holding a
    metal goblet and receive presents inside the mountain, as in the Kifhauser.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v3-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 5243-5335; Guckenberg introduction
  quote_or_summary: In the Guckenberg, a kaiser disappeared long ago with his army;
    when his beard has grown three times around his table, he will come out again.
    An old man tells a poor roll-selling boy he will show him a place to sell rolls
    every day if he tells no one.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v3-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 5243-5335; Guckenberg boy episode
  quote_or_summary: The old man leads the boy into the mountain, where there is buying
    and selling; the kaiser sits with his beard twice around the table. The boy is
    paid ancient coin, reveals the matter under pressure, and then cannot see or find
    the mountain entrance.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v3-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 5243-5335; Kaiser Carlsberg
  quote_or_summary: Between Nurnberg and Furt stands Kaiser Carlsberg, from which
    singing once came; a similar tale is told about carrying bread, and in a vaulted
    chamber a baker's boy sees men in armour sitting.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v3-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 5243-5335; die Babilonie
  quote_or_summary: In the Westphalian hill called die Babilonie, Wedekind or Weking
    sits enchanted, waiting until his time comes; favoured people who find the entrance
    are dismissed with gifts.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v3-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 5243-5335; Chronicon Ursbergense excerpt ad an. 1223
  quote_or_summary: A chronicle describes armed horsemen appearing for several days
    and returning to a mountain. A local man, making the sign of the cross, adjures
    one figure, who says they are souls of slain soldiers and that their arms, clothing,
    and horses are fiery matter of torment.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v3-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
