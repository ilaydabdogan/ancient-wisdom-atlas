canonical_text:
  quote: ''
  summary: The passage surveys traditions of heroes, rulers, divine or legendary figures,
    and armed dead dwelling inside hills or mountains. Certain humans find temporary
    entrances, receive gifts or trade goods, and may lose access after disclosure.
    Several hidden rulers or warriors are described as waiting for a future time to
    emerge. A Latin chronicle excerpt reports armed souls returning to a mountain
    and explaining their fiery torment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists Scandinavian and Old Norse expressions for being taken into
    a mountain, height, fell, or hill.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Frau Holda, Frau Venus, their following, Wodan, and king Charles are said
    to dwell in mountains while sequestered until a time for appearing among men.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tanhauser is said to have spent many years at the court of Venus.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A blacksmith looking for hawthorn on the Odenberg sees a gap in the cliff
    that he had not noticed before and enters it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Inside the Odenberg, strong men bowl iron balls and invite the blacksmith
    to play; he declines because the balls are too heavy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Odenberg men offer the blacksmith a present; he asks for an iron ball,
    later heats it, and it breaks into pieces of gold on the anvil.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The blacksmith never finds the Odenberg opening again; the passage says it
    stands open to men only on certain days and to Sunday children.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sunday children see an old man with a long beard holding a metal goblet inside
    the mountain and receive presents there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Guckenberg, a kaiser disappeared long ago with his army and will come
    out again when his beard has grown three times around the table at which he sits.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A poor boy who sells rolls meets an old man on the Guckenberg; the old man
    offers to show him a place to sell rolls every day if he tells no one.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The boy is led into the mountain, finds a busy market, sees the kaiser seated
    at a table with his beard twice around it, and is paid in ancient coin for his
    rolls.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After villagers press the boy to explain the ancient coin and he confesses
    what happened, he cannot see or find the mountain entrance the next day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: At Kaiser Carlsberg, sounds of singing were formerly heard from the mountain,
    and a similar tale is told about carrying bread into a vaulted chamber where a
    baker's boy sees men in armour sitting.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: In the hill called die Babilonie, Wedekind or Weking sits enchanted and waits
    until his time comes; favoured entrants who find the entrance are dismissed with
    gifts.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: A chronicle report for 1223 says an armed multitude of horsemen were seen
    for several days coming and going and returning about the ninth hour to a mountain.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: In the chronicle report, a local man makes the sign of the cross, adjures
    one encountered figure, and is told that the apparitions are souls of slain soldiers,
    not phantoms or ordinary troops.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: The chronicle spokesman says the soldiers' arms, clothing, and horses, formerly
    instruments of sin, are now matter of torment and are truly fiery, though bodily
    eyes cannot discern this.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:18
  text: A footnote compares the iron-ball or skittle playing with thunder and cites
    a North German saying that angels are playing bowls when it thunders.
  category: speech
  evidence_refs:
  - ev:11
