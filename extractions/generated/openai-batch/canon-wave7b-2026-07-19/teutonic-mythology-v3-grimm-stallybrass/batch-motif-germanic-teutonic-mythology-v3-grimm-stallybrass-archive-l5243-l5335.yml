candidate_motifs:
- id: motif:1
  label: Hidden or enchanted ruler inside a mountain awaiting emergence
  taxonomy_refs:
  - return
  basis: The passage repeatedly describes rulers or heroes in mountains who are sequestered,
    enchanted, or disappeared until their time comes, including king Charles, the
    Guckenberg kaiser with his army, and Wedekind.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:9
  confidence: high
  cautions: The supplied taxonomy does not include a specific 'sleeping king in mountain'
    category; 'return' is used only for the expected future emergence.
- id: motif:2
  label: Human entry into a hidden mountain world
  taxonomy_refs:
  - hero_descent
  basis: Tanhauser, the Odenberg blacksmith, Sunday children, the roll-selling boy,
    the baker's boy, and favoured entrants are all associated with gaining entrance
    to otherwise hidden mountain interiors.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: The entrants are not always heroes and do not always descend; the taxonomy
    reference is approximate for entry into a concealed otherworld-like interior.
- id: motif:3
  label: Gift or payment from hidden mountain inhabitants
  taxonomy_refs:
  - sacred_exchange
  basis: The blacksmith receives an iron ball that proves to be gold, Sunday children
    and favoured entrants receive presents, and the roll-selling boy is paid in ancient
    coin for rolls sold inside the mountain.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  - ev:9
  confidence: medium
  cautions: The passage presents gifts and transactions but does not explicitly call
    them sacred.
- id: motif:4
  label: Disclosure of a hidden entrance causes loss of access
  taxonomy_refs:
  - forbidden_knowledge
  basis: The Guckenberg boy is told not to reveal the place; after villagers press
    him and he confesses, he can no longer see or find the entrance.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The motif is based on secrecy and disclosure; 'forbidden_knowledge' is
    the closest available taxonomy family.
- id: motif:5
  label: Beard as time marker for the hidden ruler's return
  taxonomy_refs:
  - return
  basis: The Guckenberg kaiser will come out again when his beard has grown three
    times around the table, and the boy sees it twice around the table.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: This is a specific sign within the return motif rather than a separate
    taxonomy family.
- id: motif:6
  label: Armed dead as fiery apparitions linked to a mountain
  taxonomy_refs: []
  basis: The chronicle episode identifies armed horsemen returning to a mountain as
    souls of slain soldiers whose arms, clothing, and horses are fiery instruments
    of torment.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage gives one chronicle example and does not connect it explicitly
    to the gift-giving mountain-king legends beyond placement in the same discussion.
- id: motif:7
  label: Supernatural bowling or skittles associated with thunder
  taxonomy_refs: []
  basis: The Odenberg men bowl iron balls, and a footnote says this skittle-playing
    sounds like thunder and cites a saying that angels play bowls when it thunders.
  evidence_refs:
  - ev:4
  - ev:11
  confidence: medium
  cautions: The thunder comparison occurs in a note rather than in the main Odenberg
    narrative.
