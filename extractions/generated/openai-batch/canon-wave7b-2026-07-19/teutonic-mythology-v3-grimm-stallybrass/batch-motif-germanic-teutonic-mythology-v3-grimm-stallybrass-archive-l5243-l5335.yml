- id: ev:3
  type: summary
  locator: lines 5243-5335; Odenberg entry
  quote_or_summary: Tanhauser sojourned many years at Venus's court; a blacksmith
    on the Odenberg finds an unexpected gap in the cliff, steps in, and stands in
    a wondrous new world.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v3-grimm-stallybrass.md
