  summary: The passage surveys magical flight involving stolen church bells and kidnapped
    children, then compares traditions of weather-making, hail-raising, crop destruction,
    beneficent dew, storm-stirring women, and vessels whose emptying produces storms,
    hail, lightning, or rain.
