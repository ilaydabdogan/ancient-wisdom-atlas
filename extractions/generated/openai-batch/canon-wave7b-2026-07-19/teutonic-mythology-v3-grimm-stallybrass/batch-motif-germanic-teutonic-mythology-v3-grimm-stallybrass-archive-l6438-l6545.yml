candidate_motifs:
- id: motif:1
  label: Wishing implement linked to a divine or personified Wish
  taxonomy_refs: []
  basis: The passage associates the wishing-rod and wishing-hat with personal Wish
    and Wuotan, while comparing Wuotan and Mercury through headgear.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is an authorial comparative argument rather than a narrative episode
    in the passage.
- id: motif:2
  label: Mountain-confined treasure known to a deity
  taxonomy_refs: []
  basis: Mountain-prisoned treasures are discussed with mountain-prisoned heroes and
    gods, and Wuotan is said to know hidden treasures.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage states a thematic connection but gives limited narrative detail
    here.
- id: motif:3
  label: Black animal rite for lifting hidden treasure
  taxonomy_refs:
  - sacrifice
  basis: A black he-goat is tied at the hidden money site like a sacrifice to the
    guarding spirit; black fowl and black cocks are also prescribed for treasure lifting.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The word 'like' marks the he-goat act as sacrificial analogy rather than
    a fully described rite.
- id: motif:4
  label: Animal guardian of hoard
  taxonomy_refs:
  - serpent
  basis: The passage explicitly states that dogs, snakes, and dragons lie on hoards
    to guard them, then supplies examples with black dogs, snakes, worms, and Fafnir.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The taxonomy ref 'serpent' covers only the snake, worm, and dragon subset,
    not the dog examples.
- id: motif:5
  label: Fiery or black treasure guardian
  taxonomy_refs: []
  basis: The guarding dog has fiery eyes and black color; snakes shake off sparks;
    other examples include burning coals, coal-black transformation, and a black worm
    around gold.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage groups these images near treasure guardianship, but the fiery
    and black traits are not always attached to the same being.
- id: motif:6
  label: Serpent obstacle transformed into bridge to treasure
  taxonomy_refs:
  - serpent
  basis: A huge snake guards by water outside a gold cavern and, when struck, arches
    itself into a bridge so the seeker can cross and take golden earth.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The episode is reported briefly and without broader context beyond the
    cited treasure-lifting example.
- id: motif:7
  label: Serpent ring enclosing a gold heap
  taxonomy_refs:
  - serpent
  basis: A black worm coils around a gold heap, leaving a gap through which the man
    enters; after the demand to return the coin, the worm and treasure sink into the
    mountain.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The term 'serpent ring' appears in the passage's description, but the
    underlying story is summarized second-hand.
- id: motif:8
  label: Stolen dwarf-gold becomes dragon hoard
  taxonomy_refs:
  - sacred_theft
  - serpent
  basis: The Fafnir hoard consists of gold handed over by the gods for Otter and previously
    taken by Loki from the dwarf Andvari; Fafnir lies on it as dragon guardian.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage gives only a compressed account of the mythic sequence.
- id: motif:9
  label: Broken silence prevents treasure deliverance
  taxonomy_refs: []
  basis: In the vault scene, the woman is frightened when the dog turns black, breaks
    silence, and the deliverance comes to nothing.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage provides this as one cited example without elaborating the
    full silence condition.
- id: motif:10
  label: Gold carried away on horse or courser
  taxonomy_refs: []
  basis: After the dragon-slaying, the hoard is conveyed on Gram's back; a Swedish
    folksong similarly imagines gold carried on a courser's back.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The comparison is based on a shared image of gold carried by a horse-like
    mount, not on a full shared plot.
comparison_claims:
- id: claim:1
  claim: The passage presents Wuotan and Mercury as comparable through distinctive
    headgear and wish-bestowing associations, and reports the author's conclusion
    of primitive unborrowed identity.
  claim_level: same_function
  target: Wuotan-Mercury comparison
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: This is Grimm's comparative claim within the passage; the extraction
    does not independently verify historical identity or inheritance.
- id: claim:2
  claim: The cited Germanic and Scandinavian examples are grouped as instances of
    a recurring hoard-guardian pattern involving dogs, snakes, worms, dragons, and
    Fafnir.
  claim_level: same_motif
  target: animal guardian of hidden, cave, mountain, or gold hoard
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The examples vary in animal type and narrative details; the claim is
    limited to the shared guarding function around treasure.
- id: claim:3
  claim: The passage compares the Fafnir-hoard tradition with a Swedish folksong image
    through the motif of gold carried on a horse or courser's back.
  claim_level: visual_similarity
  target: gold carried on Gram/Grana or a courser
  evidence_refs:
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The link is an image-level comparison; the passage does not establish
    that the folksong shares the full dragon-hoard narrative.
- id: claim:4
  claim: The passage places the white woman's serpent appearance beside serpent-guarded
    treasure examples, suggesting a shared nearby pattern of supernatural female and
    serpent forms around treasure.
  claim_level: same_function
  target: white woman in serpent shape and serpent treasure guardianship
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: low
  limitations: The passage notes the white woman's serpent shape but does not fully
    narrate her function in the gold-cavern episode.
