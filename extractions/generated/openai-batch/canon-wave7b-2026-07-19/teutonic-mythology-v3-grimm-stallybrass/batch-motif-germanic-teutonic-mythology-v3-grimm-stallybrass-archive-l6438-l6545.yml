canonical_text:
  quote: on the hoard lie dogs, snakes, dragons to guard it
  summary: The passage links wishing implements and divine figures, then surveys ways
    to lift hidden treasure and examples of hoards guarded by black animals, dogs,
    snakes, dragons, and Fafnir. It also notes mountain-prisoned treasures, treasure
    hidden in caves or vaults, serpent-guarded gold, and gold carried away after dragon-slaying.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage links Mercury's winged petasus, Wuotan's pilei umbraculum, the
    idea of a wishing-hat, and the wishing-rod referred to personal Wish or Wuotan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mountain-prisoned treasures are discussed alongside mountain-prisoned heroes
    and gods, and Wuotan is described as a supreme maker and giver who knows hidden
    treasures.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Black animals without light or white markings are prescribed or used for locating
    or lifting hidden or enchanted money.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A black he-goat is to be tied at the place where hidden money lies, like a
    sacrifice to the spirit guarding it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dogs, snakes, and dragons are described as lying on hoards to guard them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Brunsberg treasure is said to be guarded by a black dog with fiery eyes;
    a poem describes the dog as bound at a dark cave and guarding the hidden treasure.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Other treasure examples include burning coals and a black poodle under a pear-tree,
    and a vault where a toad lies on one chest and a white dog lies on another.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the vault example, a woman strikes with a rod received from the white woman;
    the dog turns coal-black, the woman breaks silence, and the deliverance fails.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The snake is associated with gold and treasures by coiling on gold-heaps,
    shaking off sparks, wearing gold crowns, and keeping watch near a gold cavern.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: A huge hissing snake by water outside a gold cavern can be struck on the head;
    it then arches into a bridge over the water so treasure may be taken.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A black worm encircles a glittering gold heap with a small gap; after a man
    gathers gold and a roar demands the coin, the worm and treasure sink into the
    mountain, leaving only coins outside the serpent ring.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Fafnir lies on a great hoard made of gold connected with Otter, the gods,
    Loki, and Andvari; after the dragon is slain, Signer conveys the hoard away on
    Gram's back.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: A Swedish folksong image has a maiden say that the swain she awaits would
    bring gold on the courser's back.
  category: speech
  evidence_refs:
  - ev:10
