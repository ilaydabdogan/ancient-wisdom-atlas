canonical_text:
  quote: ''
  summary: The passage discusses Saga as a personified and deified tale, personified
    Aventiure in medieval poetry, the image of tales passing from house to house,
    and parallels in Middle Netherlandic Aventure and Frau Sælde. It then compares
    alternating tale-telling to Greek and Roman examples, especially Ovid’s Minyads
    telling tales while spinning and weaving, followed by Bacchus’s punishment of
    them through transformations. It closes by mentioning women’s song at the loom
    and the anger of Holda and Berhta at spinning.
  language: English
  quote_policy: summarized
