canonical_text:
  quote: ''
  summary: The passage gives flax-blessing and sowing charms involving ritual posture,
    cakes, beer, and spoken analogies for plant growth; then it describes Roman and
    late medieval herdsman charms intended to keep wolves, foxes, and other predatory
    animals from fields or cattle.
  language: English with Latin and German quoted material
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the flax blessing, the tallest woman fills her lap with cakes, stands on
    one foot on a seat, raises a strip or book of linden or elm bark in her left hand,
    holds a bowl of beer in her right hand, and asks Waizganthe to make the flax as
    high as she is and not allow the people to go naked.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the flax-blessing speech, the woman drinks the beer, refills the bowl,
    pours it into the earth for the god, throws out the cakes for Waizganthe’s associated
    deities if any exist, and interprets remaining steady on one foot as a sign of
    a good flax crop.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Wetterau sowing custom, the dame jumps on the fireplace and calls for
    flax heads as large as her head, leaves like her apron, and stalks like her legs;
    the passage says the plant will then turn out well.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Pliny excerpt says wolves can be kept from a field by breaking the feet
    of a captured wolf, sprinkling its blood around the field boundaries, and burying
    it at the place from which it began to be dragged.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Pliny excerpt also says that if the ploughshare that made the first furrow
    of the year is removed from the plough and consumed in the household Lar hearth,
    a wolf will harm no animal in that field while the rite is performed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The herdsman’s charm says the speaker drives the herd into Our Lady’s house
    or grove and Abraham’s garden, asks St. Martin to guard the cattle, and invokes
    St. Wolfgang and St. Peter to block the throats of wolf and vixen so they shed
    no blood and crunch no bone.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The herdsman’s charm asks help from the sinless man, identified in the passage
    as Christ, and from the five holy wounds to protect the herd from all wood-hounds;
    it is accompanied by five Pater and five Ave Maria prayers.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
