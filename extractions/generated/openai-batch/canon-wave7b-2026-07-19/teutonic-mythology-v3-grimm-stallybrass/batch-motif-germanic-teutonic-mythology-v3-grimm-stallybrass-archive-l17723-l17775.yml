canonical_text:
  quote: ''
  summary: The passage discusses the Alrune or mandrake as a famous root identified
    with mandragora, personified as a plant or goddess, and described as a man-shaped
    root. It recounts a mandrake-pulling procedure involving a gallows origin, deadly
    shriek, protective ear-stopping, Friday-before-sunrise timing, crosses, and a
    black dog that pulls up the root and dies. A footnote gives a tale in which a
    wife consults an old sorceress, is told to address Alrawn in a hemp garden with
    lard offerings, and receives counsel from the hidden sorceress posing as Alrawn.
    The note also mentions related versions in Paulli, a Middle High German poem,
    and a Grimm nursery tale involving consultation of a hollow tree or spindletree.
  language: English with quoted Latin and German passages
  quote_policy: summarized
