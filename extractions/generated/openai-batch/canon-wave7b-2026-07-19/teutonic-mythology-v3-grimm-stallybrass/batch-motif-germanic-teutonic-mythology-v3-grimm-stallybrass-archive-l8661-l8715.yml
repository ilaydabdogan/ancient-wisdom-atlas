canonical_text:
  quote: ''
  summary: The passage surveys legends in which the Devil, giants, or a giantess build
    or wager to build bridges, churches, mills, or waterworks. Several Devil-builder
    stories involve a bargain for the first being to cross or enter, which is then
    fulfilled or evaded by sending an animal first, while one French example has a
    holy man confront and defeat the Devil. Related notes mention first-entry customs,
    a year-long tower confinement, mountain mills, and the Cologne aqueduct tradition.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Giants are said to propose building a bridge on the Main, but the motive is
    stated to be no longer told.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the Devil builds a bridge, the passage says he is either compelled by
    men or hunting for a soul, and must accept the first animal made to run across
    the new bridge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Swiss shepherd wishes the Devil would bridge a brook; the Devil appears
    and agrees on condition that the first thing crossing belongs to him, and a goat
    crosses first.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In a French story, the Devil reserves every thirteenth creature crossing the
    bridge and has seized men and beasts before a thirteenth holy man confronts and
    conquers him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A church-building Devil bargains for the soul of the first entrant; a wolf
    is sent through the door, after which the Devil flies through the roof and leaves
    an unfillable gap.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Devil is said to build mills on mountains and destroy them again.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Devil wagers with the architect of Cologne cathedral that he can lead
    a rivulet from Treves to Cologne before the church is finished.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A giantess wagers to throw a stone bridge over a sea strait before St. Olaf
    finishes his church; when bells sound from the church before the bridge is half
    done, she angrily throws stones and one of her legs at the church tower, with
    variant outcomes reported.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A footnote states that before entering a new house it is safest to let a cat
    or dog run in first.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A footnote says the Devil is shut in a tower where he may exit at the top
    only by mounting one stair per day; with 365 stairs, the journey takes a whole
    year.
  category: sequence
  evidence_refs:
  - ev:8
