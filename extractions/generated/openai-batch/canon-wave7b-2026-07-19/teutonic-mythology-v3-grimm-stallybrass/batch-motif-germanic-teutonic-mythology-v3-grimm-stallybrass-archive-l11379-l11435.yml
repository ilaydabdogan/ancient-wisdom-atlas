canonical_text:
  quote: ''
  summary: The passage discusses witch-belief under the heading of misery. It describes
    ducking as an old witch-bath ordeal, says witches were believed able to soften
    a judge by catching his eye, emphasizes that witches are portrayed as poor despite
    sorcery and devilish aid, and argues that the witchcraft business rested on imagination
    and coerced confessions, with only practical knowledge of medicines, poisons,
    salves, and potions behind it. It also notes confessions naming dead persons as
    confederates and the implausibility of unwitnessed witch meetings in accessible
    places.
  language: English
  quote_policy: summarized
