  summary: 'The passage surveys reported names and local forms of the furious host
    or spectral hunt: a dead Charles V apparition, Hellequin and related names, Charlemagne
    with Roland in an airy apparition, King Hugon''s carriage, regional French hunts,
    Arthur''s hunt, and Herne the hunter at an oak.'
