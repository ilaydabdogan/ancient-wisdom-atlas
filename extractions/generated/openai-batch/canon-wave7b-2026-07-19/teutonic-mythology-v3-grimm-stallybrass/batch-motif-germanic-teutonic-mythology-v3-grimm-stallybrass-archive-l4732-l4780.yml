literal_observations:
- id: obs:1
  text: A dead Charles V is said to have appeared again and, when questioned, reported
    that the furious host had ceased after Carolus quintus performed penance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the furious host is called Caroliquinti or Allequinti and
    connects these names with Hellequin and the Hessian Karlequinte.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage rejects identifying the older Hellequin with the later French
    king Charles V because Hellequin's mesnie is attested in thirteenth-century poems
    and by Guil. Alvernus.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Burgundian poem is reported to place Charlemagne on horseback at the head
    of an airy apparition, with Roland carrying the standard.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author speculates that Hellequin may derive from German helle or hellekin,
    interpreted as an underworld term personified and made masculine.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: At Tours, King Hugon's carriage is said to ride around the city walls at night
    and to beat or carry off those who meet it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says King Hugo Capet's carriage represents that of a heathen god.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: In Poitou the apparition is called chasse-gallerie, and in the forest of Fontainebleau
    the grand veneur is supposed to hunt.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: Gervase of Tilbury is cited for British woods where foresters report seeing
