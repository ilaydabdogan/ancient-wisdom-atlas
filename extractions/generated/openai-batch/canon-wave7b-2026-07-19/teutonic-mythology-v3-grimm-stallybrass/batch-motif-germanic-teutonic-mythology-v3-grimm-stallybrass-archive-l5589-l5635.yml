  text: A Low Saxon legend says an ash will one day grow in the churchyard of Nortorf
    in Holstein; no one has yet seen it, but a small shoot comes up unnoticed every
    year.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Every New-year's night a white horseman on a white horse comes to cut off
    the young ash shoot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A black horseman on a black horse appears at the same time to hinder the white
    horseman; after a long fight, the black rider is put to flight and the shoot is
    cut.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The legend says that someday the white horseman will not overcome the black
    horseman, the ash will grow, and when it is tall enough for a horse to be tied
    under it, a king with mighty hosts will come and a long battle will be fought.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: During the future battle, the king's horse will stand under the tree, and
