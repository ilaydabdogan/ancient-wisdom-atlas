canonical_text:
  quote: ''
  summary: The passage reports a Low Saxon legend in which a hidden ash shoot appears
    yearly in Nortorf churchyard and is cut by a white horseman after combat with
    a black horseman. One day the black horseman will prevail, the ash will grow,
    a king with hosts will come, a long battle will occur, and the king will become
    more powerful. The author interprets this as related to the World-tree and the
    battle at the world's destruction. The passage then discusses popular belief in
    the reawakening of loved kings and heroes from mountain-sleep, naming Frederick,
    Charles, Siegfried, and Dietrich, and includes footnoted signs that the end of
    the world is near.
  language: English
  quote_policy: summarized
