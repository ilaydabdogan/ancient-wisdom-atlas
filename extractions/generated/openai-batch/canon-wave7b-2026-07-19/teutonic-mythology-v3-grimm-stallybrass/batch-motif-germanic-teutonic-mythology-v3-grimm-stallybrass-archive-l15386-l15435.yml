canonical_text:
  quote: ''
  summary: 'The passage surveys folkloric and philological accounts of human diseases
    as personified or supernatural agents: fever as a Bavarian shaker, plural fevers,
    Russian fever sisters chained in caverns, ague expressed as riding colors, Greek
    nightmare-fever terms linked with an incubus or elf and with butterfly terminology,
    Baltic fever-bird or moth terms, Anglo-Saxon elf-related remedies, colored dog
    figures for rash-like illness, Persian scarlet fever as a rosy maid with fiery
    locks, and older German terms for gout and related pains.'
  language: English
  quote_policy: summarized
