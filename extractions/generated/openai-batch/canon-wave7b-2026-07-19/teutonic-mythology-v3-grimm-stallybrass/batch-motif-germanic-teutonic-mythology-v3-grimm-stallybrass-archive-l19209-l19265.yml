canonical_text:
  quote: ''
  summary: The passage presents an Old High German healing charm in which named divine
    figures besing an injury, followed by commentary identifying Wodan as healing
    the sprained foot of Balder's foal through song. It then compares the charm with
    later Norwegian, Swedish, and Netherlandish popular healing charms for injured
    or afflicted animals, including variants naming Jesus, Oden, and Frygge.
  language: English with Old High German, Norwegian, Swedish, and Dutch quoted material
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Old High German charm names Sinthgunt with Sunna her sister, Fruwa with
    Folia her sister, and Wodan as figures who besing or charm the injury.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The Old High German formula aligns injured parts with corresponding parts:
    bone with bone, blood with blood, and limb with limb.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prose commentary says Wodan healed the sprained foot of Balder's foal
    by besinging it, and that repeating the song cures other lame horses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The commentary contrasts Wodan with the other gods and cites a statement that
    Óðinn could, by words alone, quench fire, calm the sea, and turn winds.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Norwegian charm says Jesus rode to the heath, the leg of his foal broke,
    and Jesus dismounted and set it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Norwegian formula joins marrow to marrow, bone to bone, and flesh to flesh,
    and places a leaf there so the injury remains in place.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Swedish charm for a horse ailment places Oden on a hill, asking after
    his foal, and includes instructions to spit in the hand and into the horse's mouth
    for a cure in the same hour.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Another Swedish fragment begins with Frygge asking how one should heal a sheep
    affected by the ailment called flag.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that the Swedish stanzas are incomplete and that similar
    snatches of song survive in the Netherlands, where witch-doctors mutter a rhyme
    while treating the affected foot of a horse.
  category: other
  evidence_refs:
  - ev:7
