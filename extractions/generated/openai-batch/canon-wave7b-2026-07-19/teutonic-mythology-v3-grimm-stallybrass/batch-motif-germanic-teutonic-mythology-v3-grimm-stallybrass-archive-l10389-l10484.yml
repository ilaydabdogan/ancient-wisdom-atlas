canonical_text:
  quote: ''
  summary: The passage discusses enchanters, enchantresses, witches, fays, night-women,
    and goddess figures such as Holda, Abundia, Diana, and Herodias. It links witches'
    nocturnal rides and dances with the Wild Host, female supernatural retinues, mountain
    meeting places, airborne riding on beasts, obedience and sacrifice to a female
    leader, and older festive or heathen dance customs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that enchanters and enchantresses attach themselves to
    a spectral train of deities and to the Furious Host, with which elvish and evil
    beings became associated.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says enchantresses would be ranged especially with goddesses,
    while Christian teachers might use the names Diana or Herodias and the populace
    retained native names.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage presents Dame Holda, Freyja, or Abundia as formerly leading the
    round dance of elves and related beings, and then being reclassified as an unholde
    escorted by unholden.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Norwegian fairytale is said to place a troll-woman in the position of Dame
    Holda.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the cited Jeu d'Adans example, three fays assemble on a meadow where old
    women of the town await them; the author states that this shows fellowship between
    fays and witches.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Thuringian Horselberg is described as both the residence of Holda and
    her host and as a trysting-place of witches; the Venusberg is described as an
    assembly-place for night-faring wives with good living, dancing, and hopping.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage reports that night-women in Dame Holda's service rove through
    the air on appointed nights, mounted on beasts, obey her, and sacrifice to her,
    with no league with the Devil mentioned.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The night-women, shining mothers, dominae nocturnae, bonnes dames, and related
    figures are described as originally daemonic elvish beings who appeared in woman's
    shape and did kindnesses to men.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Holda and Abundia are said to lead the ring of dancers, and dances are said
    to have been trod on the goddess's itinerant ship.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The author traces the idea of witches' dances to dancing at heathen worship,
    airy elf-dance, the hopping of will-o'-wisps, festive heathen May-meetings, and
    seasonal dances at Shrovetide, Easter fire, May fire, solstices, harvest, and
    Christmas.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Swedish stories are reported in which heathen dances and reels around holy
    places of the gods are so enticing that spectators are drawn into the revelry.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Medieval chronicles are said to record wild dancing on holy days, punished
    by being forced to continue dancing for a whole year.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Herodias is said to have been drawn into the circle of night-women because
    she played and danced and, after death, goes through the air as the wind's bride.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:14
  text: The Latin passages cited describe women claiming or believing that they ride
    at night on beasts with a transformed demonic company, Diana, Herodias, or a multitude
    of women, crossing lands and obeying a mistress's commands.
  category: action
  evidence_refs:
  - ev:12
