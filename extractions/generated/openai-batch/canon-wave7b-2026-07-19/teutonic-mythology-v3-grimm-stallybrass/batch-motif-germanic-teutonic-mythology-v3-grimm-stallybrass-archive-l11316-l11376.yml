  summary: The passage surveys magical uses of infant, dead-child, and thief body
    parts; demonic or mythic names for insects and witches; witches using holden or
    elves to cause illness and wasting; dedication of witches' children to the devil;
    black-cattle sacrifice; witch gatherings and threshold powers; and trial signs
    including transformation if touching ground, inability to weep, and floating in
    water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fingers of an unborn child, when lit, are described as making all inmates
    of a house remain asleep; a hanged thief's thumb and dead children's hands are
    also listed as magical materials.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage records names linking caterpillars, dragonflies, butterflies,
    and witches with devil, death, thunder, wolf, troll, or other mythic associations.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Witches are said to use holden or elves to produce illness and swellings by
    conjuring them into the skin and bones of humans and animals.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Witches are said to place holden on forest trees or under elder-bushes; as
    the beings gnaw aspen wood, the intended human target wastes away, and the same
    witch must remove them again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A person into whom holden have been charmed is identified by the absence,
    or faintness, of the little manikin or baby normally visible in the eyes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The demon lover may appear as an elf or butterfly; witches' daughters born
    in human wedlock are promised to the devil at birth and raised in his service,
    and children are presented to him at great assemblies by lifting them backwards.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Witches are said sometimes to sacrifice black cattle to the devil.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Witches are said to gather where roads divide, enter and leave houses through
    the keyhole, gain power where three lights burn in a room, and be unable to bear
    ringing bells.
  category: setting
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Before the judge, witches must not be allowed to touch bare ground or they
    will change themselves; they are said to be unable to shed tears and to float
    when thrown into water.
  category: sequence
  evidence_refs:
  - ev:7
