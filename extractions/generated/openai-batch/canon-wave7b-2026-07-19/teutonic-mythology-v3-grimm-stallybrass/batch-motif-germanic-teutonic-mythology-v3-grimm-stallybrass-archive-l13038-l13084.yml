- id: obs:1
  text: Ordeals are described as a means of discovering obscure past events and deeds,
    called judgments of God and used in judicial procedure.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A German ordeal is said to require the accused to perform the ritual personally,
    not the judge.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sieve-driving or sieve-turning is described as a practice performed by wise
    women, witches, conjurors, and respectable persons to expose concealed criminals.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In one described procedure, a woman holds an heirloom sieve between her two
    middle fingers, utters a spell, and names suspected persons.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The sieve’s swaying or tilting at a named suspect is treated as indicating
    the culprit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The practice is said to be used against thieves, wounders in a tumult, and
