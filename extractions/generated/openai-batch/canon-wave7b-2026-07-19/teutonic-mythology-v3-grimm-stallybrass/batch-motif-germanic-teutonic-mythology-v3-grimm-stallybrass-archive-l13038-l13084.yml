canonical_text:
  quote: ''
  summary: The passage contrasts German ordeals as judgments of God, performed by
    the accused, with later sieve-turning or sieve-running divination used to identify
    criminals or reveal the future. It describes variants in which a woman or household
    master balances or holds a sieve with fingers, tongs, or scissors, recites a formula,
    names suspects, and interprets the sieve’s movement or fall as indicating the
    guilty person.
  language: English
  quote_policy: summarized
