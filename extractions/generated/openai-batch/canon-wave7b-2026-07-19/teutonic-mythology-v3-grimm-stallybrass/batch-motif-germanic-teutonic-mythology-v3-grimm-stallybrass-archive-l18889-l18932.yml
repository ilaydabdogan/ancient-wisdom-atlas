canonical_text:
  quote: ''
  summary: 'The passage surveys Germanic traditions about runes, spells, and charms:
    Sigrdrifa/Brynhildr teaches Sigurd classes of runes; Odin is described as inventor
    of runes and master of words able to affect elements and hidden treasures; a Swedish
    tale tells of Kettil Runske stealing Odin''s rune-sticks; and songs and runes
    are said to heal, harm, revive, control weather, open bonds and mountains, unlock
    treasures, and affect birth.'
