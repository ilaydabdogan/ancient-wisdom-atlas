canonical_text:
  quote: We have never had an Edda come down to us
  summary: The preface argues that Norse and German mythology mutually attest one
    another's genuineness and antiquity. It laments the absence of a German Edda or
    early collection of heathen tradition, describes Christian and ecclesiastical
    writers as preserving only fragments, imagines a lost opportunity for a monk to
    record German antiquities, compares Danish preservation through Saxo, and notes
    the destruction of a collection begun by Charles the Great and the accidental
    survival of older material in poetry and idiom.
  language: English
  quote_policy: quoted
