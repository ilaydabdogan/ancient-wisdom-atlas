canonical_text:
  quote: It was essential for the plant to have grown up to the hem of the garment,
    it was only by touching it that it acquired healing efficacy.
  summary: The passage reports a tale, attributed through Gregory of Tours to Eusebius,
    about a metal image of the Saviour and the woman of Caesarea. A herb grows at
    the statue’s base and gains power to heal illnesses only when it has reached and
    touched the hem of the statue’s bronze garment. The note adds that Agobardus also
    copied the myth, and begins a separate Old French passage about powerful relics
    and a crippled person.
  language: English with embedded Latin and Old French
  quote_policy: quoted
