canonical_text:
  quote: ''
  summary: The passage compares accounts of Siegfried/Sifrit acquiring the Nibelung
    hoard. In one account the treasure originates with the dwarf king Nibling and
    is hidden in a cave under the dragon-stone after two sons carry it away from a
    moving mountain without telling their brother Eugel. Siegfried later finds it
    and frees a white woman or princess with the treasure. The passage then compares
    the Nibelungen account, where Schilbunc and Niblunc ask Siegfried to divide the
    treasure carried from a hollow mountain, and notes parallels with dwarf Andvari
    in the Edda. Grimm comments that dwarfs and dragons function as keepers of subterranean
    treasure and mentions wishing-hats, cover-capes, and mist-mantles of dwarfs.
  language: English
  quote_policy: summarized
