canonical_text:
  quote: ''
  summary: The passage surveys signs used to judge whether a dangerously ill person
    would recover or die, procedures for releasing a dying person, and traditions
    about plague, including its environmental onset, names, divine or angelic agents,
    and ritual efforts to avert it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Omens for a dangerously ill person include bird cries, flight, and wheeling;
    lifting stones or earth to look for a living creature; the look of the bird Galadrot;
    and whether Death stands at the patient's head or feet.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A cited Pliny augury says that if the sick person answers a questioner standing
    at the feet, there is hope of life; if the person gives no answer, death is expected.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Scottish belief says that if the mannikin or bystander's image cannot be
    seen in a sick man's eye, he will die; an Old English dialogue similarly says
    that two human figures absent from a person's eyes indicate death within three
    days.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage also notes that the eye-image is absent in a bewitched man's eyes
    and appears upside down or double in a witch's eye.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: When a dying person cannot obtain release, a roof shingle may be turned, three
    tiles may be taken up, or a hollow house utensil may be inverted; similar actions
    are mentioned for convulsions and childbirth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Plague is described as breaking out after great floods, heavy fog, and sultry
    mist poison the air, then spreading irresistibly over the earth.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage lists names for plague or swift death in Greek, Old High German,
    Middle High German, Old Norse, Latin, Servian, Bohemian, Polish, Lithuanian, Lettish,
    Netherlandish, Swedish, Danish, and related forms.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Greek tradition is described as attributing plague to the whizzing shafts
    of wrathful Apollo; sudden death of a man is assigned to Apollo's artillery and
    sudden death of a woman to Artemis's artillery.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Hermes, called protector of the flock, carries a ram around the flock to ward
    off murrain and later around the city also.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Virgins are said to have been sacrificed to stop pestilence, and Pliny is
    cited for a maiden curing boils by placing verbascum on them while naked, fasting,
    speaking a formula, repeating it three times, and spitting with the patient.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage says the angel of death means Death himself, and it cites a Lombard
    legend in which a good angel and a bad angel traverse a city at night; the bad
    angel carries a hunting spear and strikes doors at the command of the good angel.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: A footnote reports that at Massilia, during pestilence, a poor person was
    maintained for a year, adorned with sacred dress and verbenas, led around the
    city with curses so that the city's evils would fall on him, and then expelled.
  category: sequence
  evidence_refs:
  - ev:12
