canonical_text:
  quote: ''
  summary: 'The passage catalogs traditions in which the redemption of white ladies,
    enchanted maidens, water-women, or treasure-guarding serpent figures depends on
    difficult conditions: the growth and use of specific trees, a kiss given to a
    maiden in animal form, or the timely release of a buried treasure that rises,
    blossoms, ripens, and may sink again. It also connects mountain-banishment with
    hidden hoards guarded by white women, snake-women, snakes, or dragons.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Several redemption conditions require a tree or seed to grow: a cherry-stone
    carried by a little bird, a double fir cut after one hundred years by two unmarried
    persons, or a walnut-tree whose future planks will form a deliverer''s cradle.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A formula involving a lime-tree says that wood from its boughs will be made
    into a buoy or cradle; the first child lying in it is doomed to be brought from
    life to death by the sword, after which salvation will ensue.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that in these tales the future event is linked with the
    germinating of a tree and compares this with a World-fight depending on the sprouting
    of an ash or leafing of a dry tree.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Another condition for deliverance is that a maiden in the shape of a snake,
    dragon, toad, or frog must be kissed three times.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The poem of Lanzelot is cited for a dragon-mouth kiss after which the dragon
    turns into a fair lady.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The white dame basking, beaming, or bathing is said to merge at times with
    water-holde, nixe, Scandinavian hafs-fru, sea-maids, and the Romance legend of
    Melusina; these spirits likewise need redemption.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mer-women are described as assuming fish or snake shape wholly or in part;
    a king's daughter is immured in the golden mount as a snake and recovers human
    form once in three nights.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A snake with a woman's head and a bunch of keys about the neck is said to
    dwell in the Oselberg by Dinkelsbühl.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mountain-banishment is commonly associated with an enchanted recoverable treasure;
    a hero or god sits in a mountain cavern, and a huge hoard lies hidden as in a
    hero's grave or barrow.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The white woman, snake woman, snake, or dragon are named as guardians of the
    hidden hoard.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage includes a philological note on words for hoard, treasure, money,
    and guarding, distinguishing older senses of keeping watch and ward from later
    meanings of treasure or wealth.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: Treasures are said to sleep in the bosom of the earth; an Old High German
    passage on the earthquake at the Saviour's resurrection is cited as saying the
    earth gave up the treasure lying in it.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: A buried treasure must be dug up; it is also supposed to move upward by itself,
    sometimes at the rate of a cock's stride each year.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: If the appointed time arrives and the required condition fails, the treasure
    is snatched back into the depths.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The treasure's nearing the surface is described as blossoming, ripening, coming
    forth, then fading and sinking again; it may ripen every seven years or every
    hundred years, especially under a full moon.
  category: sequence
  evidence_refs:
  - ev:10
