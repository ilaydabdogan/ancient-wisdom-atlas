canonical_text:
  quote: ''
  summary: A story tells how Frau Gauden left the country after a household at Semmerin
    found her black dog on the hearth following an open-door St. Silvester night.
    A shrewd woman advised brewing beer through an eggshell; the dog, astonished,
    spoke and vanished, and Frau Gauden and her dogs were not seen again. The author
    then compares Frau Gauden with Holda, Berhta, Gode/Wode, Woden/Wodan as wild hunter,
    Hakelberg's dog, and other ghostly or elvish beings, before beginning another
    wild-hunter tale from Saxony.
  language: English with quoted Low German
  quote_policy: summarized
