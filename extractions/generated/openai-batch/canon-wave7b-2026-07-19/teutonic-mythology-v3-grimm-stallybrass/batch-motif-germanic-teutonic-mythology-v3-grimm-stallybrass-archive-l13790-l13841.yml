canonical_text:
  quote: ''
  summary: The passage catalogs path-crossing or angang omens connected with setting
    out, being on the road, or going to battle. Hnikarr/Odinn teaches Sigurd auspicious
    signs involving a raven, two warriors, and a wolf under ash-boughs, and inauspicious
    signs involving sunset-facing combat and tripping. The author then cites later
    examples involving encountered people, animals, shoes, one-foot turning, and hunting
    omens among Swedish, Lithuanian, and Samogitian materials.
  language: English, with Old Norse and Latin quotations
  quote_policy: summarized
