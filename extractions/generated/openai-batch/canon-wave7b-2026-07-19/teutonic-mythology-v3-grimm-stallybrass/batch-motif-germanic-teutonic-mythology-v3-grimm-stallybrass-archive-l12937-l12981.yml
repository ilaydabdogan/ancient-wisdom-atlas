  quote: ''
  summary: The passage describes active superstition as practically aimed at averting
    evils, illness, enemies, or uncertainty about future luck. It emphasizes that
    customs can change meaning across periods and peoples, with older war- and victory-related
    practices reinterpreted in agricultural contexts. It gives examples of weather
    magic, omens, agricultural and domestic rites, and divination by priests, heads
    of families, magicians, augurs, and a Lombard-era aruspex interpreting lightning.
  language: English
  quote_policy: summarized
