canonical_text:
  quote: ''
  summary: The passage collects examples of animals, birds, and sacred objects that
    guide hunters, armies, founders, settlers, or builders to routes, fords, boundaries,
    and building sites. It then turns to traditions of burying or immuring live animals
    and humans in foundations, churchyards, stables, castles, bridges, and ramparts
    to secure stability, protection, weather, or release from disease, with later
    symbolic substitutions such as empty coffins.
  language: English with Latin quotations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says a stag showed the way to Huns during a hunt, and generalizes
    that hunters are led by the stag, herdsmen by the ox, and heroes by the wolf.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts Christian preference for deer as guides with the 'heathenish
    wolf,' and says Christians would have taken a raven as a messenger of the devil.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A doe is said to have shown the Franks a safe ford over the Main, and a white
    hart is mentioned as guiding over the Vienne.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An eagle is described as circling and hovering over the future site of a monastery
    or church for Theoderic, and as later circling the monastery on Christmas Day
    for four years.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A flying hen is said to indicate a future castle site; a blind horse and a
    crab are named as boundary-hallowing animals; vultures are named as auspicious
    birds at the founding of Rome.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The fratres Philaeni are said to have won a new frontier by running and then
    allowed themselves to be buried alive there.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says Northmen threw high-seat pillars or seat-posts overboard
    and landed wherever they drifted; the posts bore images of trusted gods who pointed
    to the new habitation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that people often thought it necessary to immure live animals
    or humans in foundations, as if offering a sacrifice to Earth to obtain stability
    or other advantages.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: Danish traditions are cited in which a lamb is built under an altar and a
    live horse is buried in a churchyard before any corpse, with later apparitions
    of the lamb or horse betokening death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage lists practices of burying swine and fowls under houses, walling
    in a cock for good weather, bricking up a blind dog under a stable-door, and burying
    one herd animal under a stable-door during murrain.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Stories are cited in which children are believed or said to be walled into
    bridge or castle foundations to make the structures stable or impregnable.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: A Copenhagen rampart story says that, after the rampart repeatedly sank, an
