canonical_text:
  quote: ''
  summary: 'The passage recounts legends of submerged or doomed castles and valleys:
    a serving-man gains understanding of bird speech by tasting a silver-white snake
    and hears of a castle''s downfall; a sick old man has his son watch a growing
    cloud before divine judgment falls on Suggenthal; after floodwaters swamp the
    houses, an infant boy survives in a cradle with a cat that balances it until the
    cradle lodges in an oak crown. The foundling is named Dold after the treetop,
    and the author compares the cradle-survival element to a Welsh story.'
  language: English
  quote_policy: summarized
