canonical_text:
  quote: ''
  summary: The passage compares the Devil or valant with elves, the alp, wind and
    storm, and doctrines of demonic possession. It notes shapeshifting and vanishing
    powers, the riding of humans, devil-words as negative intensifiers, wind-like
    swiftness, and examples of demonic indwelling or departure in Saul, Nalas and
    Kalis, and a medieval demoniac.
  language: English
  quote_policy: summarized
