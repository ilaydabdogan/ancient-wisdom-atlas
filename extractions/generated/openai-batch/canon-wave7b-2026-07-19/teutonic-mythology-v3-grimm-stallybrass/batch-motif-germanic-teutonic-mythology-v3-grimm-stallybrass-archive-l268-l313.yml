canonical_text:
  quote: ''
  summary: The preface discusses the persistence of early Germanic songs, genealogies,
    heroic legends, and court poetry across centuries. It cites figures such as Tuisco,
    Mannus, Hygelac, and others as examples of traditions echoed in later sources.
    It also proposes possible explanations for literary and mythic coincidences, including
    historical contact with the Greek empire or a deeper unity among European nations,
    and rejects the idea that earlier centuries were merely barbarous by invoking
    divine providence and the sun giving light to all times.
  language: English
  quote_policy: summarized
