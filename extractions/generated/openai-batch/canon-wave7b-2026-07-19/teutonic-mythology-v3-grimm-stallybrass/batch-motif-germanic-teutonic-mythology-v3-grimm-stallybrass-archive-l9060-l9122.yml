canonical_text:
  quote: ''
  summary: The passage recounts a Normandy legend of Mont St. Michel in which Michael
    and the Devil compete in church-building and then divide cultivated produce, with
    the Devil presented as the outwitted party. It then catalogs animals, plants,
    and natural objects named after the Devil, and closes with a comparative statement
    that the folkloric Devil has taken over attributes formerly associated with heathen
    gods, spirits, and giants.
  language: English
  quote_policy: summarized
