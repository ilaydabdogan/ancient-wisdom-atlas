  text: The passage says a being unknown to the heathen has taken the place of heathen
    gods, spirits, and giants and united similar or conflicting attributes in himself.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Devil is compared with Wuotan as grayman, cloaked wild hunter, aerial
    rider or carrier, discord-sower, dice-player, and receiver of vowed service; his
