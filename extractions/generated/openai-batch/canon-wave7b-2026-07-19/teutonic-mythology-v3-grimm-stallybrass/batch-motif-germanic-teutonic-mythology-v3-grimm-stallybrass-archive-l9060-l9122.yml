- id: obs:4
  text: The passage states that in these tales the bear, giant, troll, or devil is
    the outwitted party, compared with the giant who built a castle for the gods.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that animals and plants are named after the Devil, as they
