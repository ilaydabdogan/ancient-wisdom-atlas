  text: A Normandy folk legend of Mont St. Michel says Michael and the Devil disputed
    which of them could build the finer church.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the legend, the Devil builds a church of stone, while Michael constructs
    a handsomer church of ice; when the ice melts, both agree to till the soil.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Devil chooses the upper herbs, while Michael keeps what is hidden in the
    ground.
  category: action
  evidence_refs:
