canonical_text:
  quote: ''
  summary: The passage surveys magical sticks and staves associated with invisibility,
    aerial travel, and possible transformation into animal mounts; witches' ability
    to pass through narrow spaces and between wood and bark; beliefs about beings
    hidden in trees or bark; enchanting music that draws things from their places;
    and witches' dislike of bells, compared with elves, giants, an old heathen crone,
    and Swedish witches who disturb bells.
  language: English
  quote_policy: summarized
