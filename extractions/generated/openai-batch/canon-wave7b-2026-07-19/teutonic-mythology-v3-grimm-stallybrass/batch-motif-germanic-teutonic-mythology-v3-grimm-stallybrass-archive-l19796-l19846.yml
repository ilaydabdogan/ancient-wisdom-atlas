  summary: The passage collects regional notices about making bark whistles or pipes
    from green twigs, including children's tapping and singing formulas, commands
    addressed to the pipe or rind, a report of a marvellous fuyarka made from a special
    green willow, and a comparison with Pliny on cutting elder beyond hearing of cock-crow.
