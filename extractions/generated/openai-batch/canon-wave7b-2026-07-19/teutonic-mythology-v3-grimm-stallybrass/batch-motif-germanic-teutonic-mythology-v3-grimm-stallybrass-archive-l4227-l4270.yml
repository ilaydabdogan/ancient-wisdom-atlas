canonical_text:
  quote: ''
  summary: The passage describes a Swabian spectre named Berchtold as a white-clad
    rider with white horse, white hounds, and horn, placed at the head of the furious
    host. It then states that goddesses as well as gods may lead the furious host,
    and gives stories of Perchtha ruling dead unbaptized children. A grieving mother
    sees Perchtha's child procession before Twelfth-day, recognizes her own dead child
    carrying a water jug with a soaked shirt, lifts the child over a fence, and is
    told that her tears fill and burden the jug.
  language: English
  quote_policy: summarized
