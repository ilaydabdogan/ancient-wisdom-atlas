canonical_text:
  quote: ''
  summary: The passage collects Germanic and Swiss reports of Posterli, Straggele,
    and the furious host. It describes a puppet-like Posterli procession, Straggele's
    Ember-night punishment of girls who have not finished spinning, the furious host
    passing through aligned doors, protective use of a cart-wheel, local routes and
    witnesses, Frau Holla/Holda's association with the host, Trusty Eckhart's warning
    role, dead and distorted figures in the troop, and a peasant punished for refusing
    to make way. Footnotes compare related nightly excursions, anomalous horses, and
    headless figures in other traditions.
  language: English
  quote_policy: summarized
