  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Thuringia the furious host travels in the train of Frau Holla; at Eisleben
    and in the Mansfeld country it came on the Thursday in Shrove-tide, and people
    gathered to await it like a monarch's entry.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Trusty Eckhart appears before the troop as an old man with a white staff,
