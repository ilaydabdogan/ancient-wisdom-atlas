canonical_text:
  quote: ''
  summary: The passage argues that the Christian notion of the Devil was unknown to
    Germanic heathenism. It contrasts full good-versus-evil dualism, exemplified by
    Zendic Ormuzd and Ahriman, with Indian, Greek, and Teutonic theologies. It presents
    divine triads as growing out of divine unity, states that goodness predominates
    in polytheism, treats Loki and other beings as only partially harmful, and notes
    that dualistic antagonism may appear in isolated features without shaping the
    whole system.
  language: English
  quote_policy: summarized
