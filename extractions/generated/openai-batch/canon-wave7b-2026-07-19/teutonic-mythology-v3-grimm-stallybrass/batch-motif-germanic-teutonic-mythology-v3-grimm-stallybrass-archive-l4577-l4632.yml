canonical_text:
  quote: go in and out of the mountain
  summary: The passage reports a story in which a wise man tells people to look through
    the ring of his arm, revealing soldiers entering and leaving a mountain. It then
    compares a Saxo episode in which Biarco can see Othin only through Ruta’s instructed
    viewing gesture, lists other methods for seeing spirits, and notes a red rider
    around Odenberg identified as the ghost of Carolus Quintus but compared by the
    author with Barbarossa and Donar. The passage also lists other excursions said
    to be similar to the Odenberg host.
  language: English with quoted Latin verse
