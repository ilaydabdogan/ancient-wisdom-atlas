canonical_text:
  quote: ''
  summary: The passage explains medieval ideas about witches by linking women with
    divination, priestly and prophetic functions, secret sorcery, hidden science,
    and knowledge of drugs. It notes that magic was often attributed to old women,
    that Snorri reports men considered such arts undignified and taught them to goddesses
    or priestesses, and that Norse female figures such as norns, volvas, valkyrs,
    and swan-maids could be viewed as divine beings or sorceresses. It also compares
    German hexe with Latin terms for witches and related beings, and includes a footnote
    story of a hag whose craft surpasses the devil’s.
  language: English
  quote_policy: summarized
