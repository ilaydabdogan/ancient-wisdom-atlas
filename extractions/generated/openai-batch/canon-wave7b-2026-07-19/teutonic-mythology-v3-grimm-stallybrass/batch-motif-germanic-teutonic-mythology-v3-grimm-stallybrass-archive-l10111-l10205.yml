canonical_text:
  quote: ''
  summary: A comparative discussion links accusations about witches eating horseflesh,
    handling salt, meeting at calendrical festivals, dancing at trees and mountains,
    and using horse body parts with older sacrificial, judicial, and popular assembly
    settings. It also notes cautious comparisons with Roman and Greek festivals and
    horse rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that witches were accused of eating horseflesh at their
    assemblies and interprets this accusation as keeping up heathen sacrifices.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Boguet is cited as describing a large cauldron on the fire from which each
    participant took meat, with no salt present, and as identifying the meat as horseflesh.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage lists horses' heads nailed up, thrown into Midsummer fires, and
    used by a piper or ghostly beings for music; it also mentions the devil with horse's
    feet and drinking from horse-hoofs.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says the preparation and distribution of hallowed salt and the
    eating of horseflesh were connected with sacrifices and popular assemblies in
    heathen times.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The main annual witch excursion is placed on the first night in May, Walpurgis,
    which the passage connects with a sacrificial feast, May-gathering, assizes, May-ridings,
    and sacred fire.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Other named witch-festival times include Whitsuntide, Autumn, St Walburg's,
    St John's, St Bartholomew's, and Danish trial dates including Valborg evening,
    St Hans evening, and the eve of Mary's visitation.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that witches resort to places where justice was formerly
    administered or sacrifices were offered.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: Named meeting places include the mead, oak-sward, under the lime, under the
