  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Some witch dances are located at places of execution, under the gallows-tree,
    or in the sand-pit.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Mountains, hills, knolls, peaks, and high points of a neighbourhood are described
