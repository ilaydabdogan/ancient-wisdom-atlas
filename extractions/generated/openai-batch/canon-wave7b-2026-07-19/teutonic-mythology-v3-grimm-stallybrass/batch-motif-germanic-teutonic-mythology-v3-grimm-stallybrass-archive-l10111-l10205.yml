  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says elves and bilweises are housed in hills, and Servian vilas
    and Romance fays dwell on mountains.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage states that almost all witch-mountains were once hills of sacrifice,
