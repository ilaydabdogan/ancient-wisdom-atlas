canonical_text:
  quote: ''
  summary: 'The passage gathers German and comparative folklore concerning a wild
    man or wild hunter: a grey giant haunting Wallrod crags, an unseen aerial hunter
    pursuing moss-folk or little wood-wives, a peasant who mimics the hunt and receives
    a quartered moss-wife at his door, a Latin parallel in which demons hunt priests''
    concubines, and notes on wood-sprites, offerings of flax, cross-marked trees,
    and protective tree-felling words.'
  language: English with quoted Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Near Wallrod are tall basaltic crags described as like ruins; the place is
    said to have been the wild man's house, and a grey gigantic figure is said to
    make rounds through forest, heath, and field with crashing and uproar.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Thuringian story says the wild hunter pursues the moss-folk or little wood-wives;
    he remains unseen but is heard blustering in the air.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A peasant near Saalfeld hears shouting and dogs in the wood, mimics the hunters'
    cry, and the next morning finds a quarter of a little moss-wife hung outside his
    stable door as payment for his share in the hunt.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Latin account says demons chase priests' concubines in the air like wild
    beasts chased by hunting dogs, tear them apart, and hang a severed part at the
    door of a human who helped the hunt by shouting.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author notes that in the Latin account wood-wives are replaced by priests'
    wives, and also states that the German tradition gives no reason why the airy
    hunter pursues the wood-wife.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The note describes moosleute and holzweibel as wood-sprites linked with dwarfs;
    they look like three-year-old children, are friendly with humans, make presents,
    help with haymaking, feed cattle, and sit at table with humans.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: At flax-harvest, the countryman leaves three handfuls of flax in the field
    for the holzweibel.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: During tree-felling, the countryman marks three crosses on the trunk with
    an axe; inside the triangle formed by the crosses, the holzweibel sit and gain
    respite from the wild hunter, who is said to be shy of the cross.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A Voigtland tradition describes the wild hunter as a small man hideously overgrown
    with moss, roaming in a narrow glen.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: A Riesengebirg tradition says a night-spirit chases the rüttelweibchen, who
    can find protection under a tree felled while the words 'Gott wait's!' are spoken
    in the stated order.
  category: sequence
  evidence_refs:
  - ev:10
