canonical_text:
  quote: ''
  summary: 'The passage assembles classical and medieval testimonies about superstition
    and auspices: people are said to take omens from birds, chance encounters, voices,
    objects carried by others, threshold mishaps, the direction and cries of birds,
    animals met on the road, insects, a spider’s thread, and certain encountered persons.'
  language: English with Greek and Latin citations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Xenophon citation is used to introduce practices in which birds and people
    met by chance may turn someone away or urge them on, and in which stones, wood,
    and chance animals are treated with reverence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A passage attributed to St. Eligius forbids observing what occurs when one
    exits or enters a house, including what meets the person, a responding voice,
    a bird’s song, or what someone is carrying.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Gregory of Tours is cited for a traveller who, according to a stated barbarian
    custom, began attending to auspices and declared them contrary to himself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: John of Salisbury is cited for the rule that if someone steps on the threshold
    while going out or stumbles on the road, the foot should be held back.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: John of Salisbury says birds called ominales announce hidden future things,
    and that the position, flight, silence, cries, and direction of the crow-like
    bird should be carefully observed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The raven is said to give auspices for greater matters, the swan is described
    as very pleasing in auguries to sailors, and the albanellus bird’s movement from
    left to right or the reverse is tied to the expected quality of lodging.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'The passage lists road encounters with animals as differently valued: the
    hare is to be feared, the wolf welcomed, sheep met gladly, the goat avoided, oxen
    met favorably, the mule inauspicious, the ass useless, and the horse sometimes
    good but associated with quarrels and fighting.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'The passage assigns effects to smaller creatures and human encounters: the
    locust hinders travellers, the cicada advances the wayfarer’s step, a spider drawing
    a thread from above seems to bring hope of coming money, a priest or other religious
    person is called inauspicious, and an uncovered-headed woman is considered unlucky
    unless public.'
  category: relationship
  evidence_refs:
  - ev:7
