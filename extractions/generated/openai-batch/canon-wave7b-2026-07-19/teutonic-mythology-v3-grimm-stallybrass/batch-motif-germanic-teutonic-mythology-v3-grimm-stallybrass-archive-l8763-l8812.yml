canonical_text:
  quote: ''
  summary: 'The passage discusses popular names and legends attached to devil''s walls,
    ditches, and stones: a Devil-built boundary wall, Roman earthworks called devil''s
    walls and pfalgraben, a swinedike said to have been rooted up by a chanticleer
    and hog, the Devil driving on the wall at Christmas, striking rocks or walls attributed
    to devils and giants, a rock-strength episode involving the Devil and the Saviour,
    cliff footprints linked to a temptation scene, and a devil''s stone from which
    the Devil preached.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cited tradition says that, after an agreement to divide the earth, the Devil
    builds a boundary wall.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Roman fortifications in several German regions are said to be popularly called
    devil's walls and also pfalgraben, pfahlgraben, pfahltäbel, or pfal, though the
    passage says these walls contain stones and bricks rather than stakes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage connects the place-name forms Wulsgraben, Phulsgraben, Phol, Pfal,
    and Pful as related or interchangeable forms.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The devil's wall is also called schweingraben, and a Swabian folktale says
    it was scratched and rooted out of the ground at night by a chanticleer and a
    hog.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Devil is said to come driving on the devil's wall on Christmas night,
    and the passage notes that heathen gods are generally astir from Christmas to
    Twelfthday.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: In districts without Roman walls, conspicuous rocks and walls are said to
    be traced by popular imagination to giants, devils, Romans, or Hellenes.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: One story has the Devil put a piece of rock on as a hat to show his strength;
    then the Saviour slips the same rock onto his little finger.
  category: action
  evidence_refs:
  - ev:7
