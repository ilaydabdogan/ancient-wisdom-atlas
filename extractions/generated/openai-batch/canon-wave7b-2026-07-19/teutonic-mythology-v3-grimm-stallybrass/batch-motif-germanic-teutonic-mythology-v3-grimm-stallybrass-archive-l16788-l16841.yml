  text: A pestilence is said not to cease until an altar of Saint Sebastian is placed
    in the basilica of Saint Peter in Chains; after Sebastian's relics are brought
    and the altar is established, the pestilence ceases.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the year 589, the Tiber overflows, a plague arises, and Saint Gregory orders
    a solemn procession of the Cross; many people in the church die suddenly at his
    feet.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After prayer, Saint Gregory sees an angel with a bloody sword on Dietrich's
    house; the angel wipes the sword on his garment, and Gregory understands that
    divine anger will turn away from the people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Norse Hel is described as riding about on her steed, which the passage identifies
