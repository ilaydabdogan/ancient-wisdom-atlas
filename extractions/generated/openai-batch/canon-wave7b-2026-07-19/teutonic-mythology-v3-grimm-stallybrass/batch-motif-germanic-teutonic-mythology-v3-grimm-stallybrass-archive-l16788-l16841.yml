canonical_text:
  quote: ''
  summary: 'The passage collects plague traditions: a pestilence ceases after an altar
    and relics of Saint Sebastian are installed; Saint Gregory sees an angel with
    a bloody sword after a plague procession; Norse Hel is compared to an angel of
    death riding a steed; plague appears as blue vapour or blue flame, may be walled
    in, may leap from an opened hidden place, or may be charmed into a lime-tree hole
    and plugged.'
  language: English with Latin and Middle High German quotations
  quote_policy: summarized
