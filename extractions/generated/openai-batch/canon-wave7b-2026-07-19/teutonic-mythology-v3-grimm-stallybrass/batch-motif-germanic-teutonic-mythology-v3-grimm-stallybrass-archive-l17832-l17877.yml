canonical_text:
  quote: ''
  summary: 'The passage presents a mandragora extraction prescription in which the
    plant shines by night, has bodily features, is circumscribed with iron, dug with
    ivory, and pulled up by a hungry dog. It then discusses sleep-causing plants and
    objects: mandragora''s sleep power, Odin''s sleep-thorn used on Brynhild, Dornröschen''s
    spindle-prick, sleep-apple growths on thorn plants, and other sleep-causing media
    such as cushions, runes, and feathers.'
