canonical_text:
  quote: ''
  summary: The passage argues that Christian conversion discourse often treated older
    gods not as nonexistent but as sinful or demonic powers. It gives examples of
    pagan images that wail, speak, move, crumble, or are cast toward hell; compares
    Wuotan’s Wild Hunt and dice-playing associations with later Devil traditions;
    discusses feminine demonic terminology in relation to Holda; and links Grendel’s
    mother and nursery-tale figures such as the Devil’s grandmother as female kin
    attached to demonic or monstrous households.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the new doctrine could take root by representing older gods
    as odious and sinful rather than absolutely null.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Beelzebub is described as having dropped into the class of devils, and classical
    and Germanic deities are grouped as beings converters could regard diabolically.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that broken or overthrown heathen images were credited
    with diabolic activity and could complain as demons.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Perun’s image is described as dragged through Novgorod streets, thrown into
    the Volkhov, and breaking into wailings over former worshippers’ faithlessness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Olaf is said to speak to Freyr’s statue and contend with Thorr, while St.
    George compels Apollo’s image to walk and speak.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Mars’s image is described as suddenly crumbling at the Saviour’s birth, with
    the devil suffering a heavenly blow and going bound to hell among his comrades.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wuotan is described as distorted into a furious hunter at the head of the
    Wild Host and thereby made into a devil; the Devil is also called a hell-hunter.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Folktales are said to make the Devil ride a black steed or drive a magnificent
    car like Wuotan and Donar.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wuotan is described as god and inventor of gaming, especially dice, and as
    giver of an all-winning die in a fairytale.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Dice-playing is commonly ascribed to the Devil, who watches games played during
    divine service on Sunday, plays with men staking their souls, is called a dicer,
    and waits for gamblers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage contrasts Judaism’s devils without she-devils with Teutonic paganism’s
    many female supernatural beings, including divine mothers, norns, valkyrs, wood-wives,
    water-maidens, and a goddess of the dead.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Ulphilas is said to translate daimonion with a feminine term, and the converted
    Goths’ feminine unholda is said to fill the place of Holda.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Grendel is described as having a mother, more giant-like than he, who tries
    to avenge his death; the hero’s exploit is complete only after her defeat.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: In nursery-tales, the Devil’s dwelling is said to contain his grandmother,
    mother, or sister, who pities a shelter-seeking hero and helps him against the
    monster.
  category: sequence
  evidence_refs:
  - ev:10
