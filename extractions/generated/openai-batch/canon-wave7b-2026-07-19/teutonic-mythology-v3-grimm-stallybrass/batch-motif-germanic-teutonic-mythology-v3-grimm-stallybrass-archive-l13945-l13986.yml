canonical_text:
  quote: ''
  summary: The passage surveys superstitions about animal encounters and path-crossing
    omens. It reports that Slavs took auspices from the first animal met before undertaking
    business, notes an Eddic wolf omen associated by the author with Óðinn, and contrasts
    the wolf as a favorable or courage-giving sign with the hare as a sign of fear,
    failure, or misadventure. Later anecdotes treat a hare crossing the road as unlucky
    and a wolf crossing or running before travelers as lucky.
  language: English with quoted Latin and Middle High German
  quote_policy: summarized
