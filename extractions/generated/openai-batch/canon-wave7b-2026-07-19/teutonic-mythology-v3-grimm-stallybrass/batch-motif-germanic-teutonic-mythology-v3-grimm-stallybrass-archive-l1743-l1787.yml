canonical_text:
  quote: ''
  summary: The passage surveys myths in which gods visit the earth unrecognized, often
    as strangers or travellers, and mortals or animals are rewarded or punished according
    to their treatment of the visitor. Examples include Greek accounts involving Orion,
    Hyrieus, Philemon and Baucis, Mercury, and Demeter; Indian references to Brahma
    and Vishnu visiting earth; and a Lithuanian legend in which Perkunos asks directions
    from a horse and an ox.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that gods may walk the earth unrecognized and enter mortal
    houses, and that this gives hospitality a special religious force because a stranger
    might be a god in disguise.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Orion story, three gods take lodging with Hyrieus, are feasted, allow
    him to ask a favor, and create a son for him when he wishes for one.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says Hyginus relates the same fable of the Thracian Byrseus.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the legend of Philemon and Baucis, Jupiter and Mercury travel, are kindly
    entertained, and reward their hosts by saving them from an impending deluge.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A fable of Phaedrus is summarized as having the divine messenger, the god
    of roads and highways, pass the night with mortals.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Demeter is described as travelling and associating with humans; in an Aesop
    fable she travels with a swallow and an eel, who respond differently when they
    reach a river.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says that among Indians, Brahma and Vishnu are the principal gods
    who visit the earth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: In a Lithuanian legend, Perkunos walks the earth when beasts still spoke and
    asks a horse for directions; the horse refuses because it is eating.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: An ox nearby hears the traveller’s request and offers to show the stranger
    the way to the river.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Perkunos punishes the horse with never being satisfied and rewards the ox
    with ease in appeasing hunger and chewing the cud.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage explicitly says the Lithuanian myth inculcates kindness to the
    stranger.
  category: other
  evidence_refs:
