  summary: The passage lists superstitious omens drawn from animal behavior, insects,
    and lifeless elements. Certain animals are said to announce death; ants, spiders,
    bees, and grasshoppers are associated with prophecy, luck, disaster, guests, or
    abundance; and flames appearing on weapons are described as omens of victory,
    with cited parallels from several textual traditions.
