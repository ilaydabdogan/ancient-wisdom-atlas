  quote: ''
  summary: The passage discusses witch-trial torture to force confession; witch-story
    renunciation of God, signing away to the devil, and goat adoration; goat and black
    animal offerings; a Dalecarlian tradition of a chained devil under a table whose
    chain is repaired by an angel; salt-related witcheries; horseflesh consumption;
    seasonal witch flights with festival fires and night processions; renunciation
    formulas involving a white stick, dung, a toad, and water; and accusations that
    shepherd-sorcerers baptized sheep with salt.
