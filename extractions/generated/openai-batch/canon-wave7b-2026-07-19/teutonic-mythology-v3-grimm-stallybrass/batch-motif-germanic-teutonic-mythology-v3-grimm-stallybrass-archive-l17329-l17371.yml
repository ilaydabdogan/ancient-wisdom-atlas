canonical_text:
  quote: ''
  summary: The passage surveys Germanic and comparative plant names connected with
    mythic beings, heroes, goddesses, Mary, wise women, and seasonal or ritual associations.
    It treats possible links between wolf's bast and Fenris's bonds, herb names tied
    to Wieland and Wate, many female sacred plant names, Mary as replacing Frouwa
    in such names, Freyja's hair and tears, flowers and stones arising from goddesses'
    tears or laughter, key-flowers associated with spring or treasure, and cautions
    about deriving oster-blume from Ostara/Eostre.
  language: English
  quote_policy: summarized
