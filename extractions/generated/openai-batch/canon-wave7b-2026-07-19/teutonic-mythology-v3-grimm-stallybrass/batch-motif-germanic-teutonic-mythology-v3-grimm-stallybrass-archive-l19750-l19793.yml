literal_observations:
- id: obs:1
  text: The passage lists Wuotan's forest-hounds, Anglo-Saxon and other woodland terms,
    and notes that the fox named with the wolf is treated as feminine vohe in relation
    to Gothic and Old High German forms.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Wolfgang is described as one who fends the flock, with two proposed explanations:
    going against the wolf, or a wolf meeting the hero at a lucky moment.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author introduces a Latin bee-spell from a St Gall manuscript because
    he has not found a German bee-spell.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bee-spell adjures the mother of the bees by God and the redeeming Son
    of God not to rise high or fly far, but to come quickly to a tree with her company.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The bee-spell says prepared vessels are available so the bees may work there
    in God's name.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage glosses mater aviorum as Anglo-Saxon beomodor and lists terms
    for comb, hive, and fly-hole.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that runes were written on bast or cortex and suggests
    that olden time may have had runes for detaching bast from wood.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Incantations are said to have power to release the babe from ante-natal durance
    and the hard rind from the bast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Shepherd boys in many parts of Germany are described as singing rhymes while
    tapping a piece of willow on the knee with a knife-handle until the bark slips
    off unbroken for making a whistle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: One simple willow rhyme names Fabian and Sebastian; a Ditmarsen variant asks
    the sap to go out of the wood, and the passage says sap is believed to enter the
    willow on the saints' day, Jan. 20.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: A longer willow-bark spell variant lacks the saints' names and includes a
