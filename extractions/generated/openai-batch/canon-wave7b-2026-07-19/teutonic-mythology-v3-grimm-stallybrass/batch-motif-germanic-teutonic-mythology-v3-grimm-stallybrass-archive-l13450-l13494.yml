canonical_text:
  quote: ''
  summary: 'The passage surveys several superstitious practices: sitting on a roof
    on New-year''s day with a sword to explore the future; placing sick children on
    the roof; turning or removing roof shingles or planks in cases of difficult dying
    or childhood convulsions; and listening while dangling a thread-ball fastened
    to a hereditary key out of a window. It then discusses sneezing as meaningful,
    citing Greek, Roman, Arab, and medieval German evidence for saluting or blessing
    the sneezer, German legendary examples of enchanted sprites whose sneeze can be
    answered with ''God help'' to undo a spell, and Greek ideas that sneezing has
    divine or truth-confirming force.'
  language: English with cited Old Norse, Greek, Latin, German, and French phrases
  quote_policy: summarized
