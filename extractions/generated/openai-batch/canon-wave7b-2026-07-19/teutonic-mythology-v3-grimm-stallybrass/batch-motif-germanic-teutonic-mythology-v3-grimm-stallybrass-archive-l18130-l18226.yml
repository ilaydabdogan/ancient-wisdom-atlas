- id: obs:2
  text: A man looking for a lost foal passes through a field where fernseed is ripening,
    and some of the seed falls into his shoes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the man comes home, his family hears his voice but cannot see him; after
