canonical_text:
  quote: ''
  summary: The passage discusses fernseed, fern or adder-herb, and mugwort/beifuss.
    It reports a Westphalian tale in which fernseed ripening on Midsummer night falls
    into a man's shoes and makes him invisible until he shakes it out; literary and
    French notices about fernseed or fern; Thuringian beliefs that fern can bewilder
    travelers and attract adders; a Slavic notice of a St John's eve fern flower granting
    wealth and prophecy; and mugwort protections, St John's fire rites, and anti-fatigue
    uses.
  language: English
  quote_policy: summarized
