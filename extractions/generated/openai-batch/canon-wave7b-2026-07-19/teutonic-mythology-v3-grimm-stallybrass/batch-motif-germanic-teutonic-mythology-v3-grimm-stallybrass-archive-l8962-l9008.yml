canonical_text:
  quote: ''
  summary: 'The passage recounts a West Flemish devil''s barn story in which a farmer
    is saved by his wife''s cunning: she imitates or calls for cockcrow before the
    normal hour, causing nearby roosters to crow and the workmen building the devil''s
    barn to vanish, leaving an unfinished opening that Satan later reopens at night.
    It then gives an Estonian tale in which a barn-and-grain servant tricks the Devil
    by pretending to cast new eyes for him, binding him to a bench, pouring hot lead
    into his eyes, and using the name ''self'' so that the Devil appears to say he
    harmed himself.'
  language: English with Dutch quoted narrative
  quote_policy: summarized
