    connected with the Germanic wild hunt or furious host through boar, distaff, winter,
    storm, and sea-travel associations.
  claim_level: same_motif
  target: Germanic wild hunt / furious host
  evidence_refs:
  - ev:1
  - ev:4
  counter_evidence_refs:
  - ev:1
  confidence: low
  limitations: The author explicitly calls the connection doubtful and frames major
    links as questions.
- id: claim:2
  claim: The blind giant Orion guided by Kedalion is tentatively compared with the
    headless wild hunter.
  claim_level: visual_similarity
  target: Headless wild hunter
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: low
  limitations: The proposed match is phrased as a question, and blindness is not the
    same feature as headlessness.
- id: claim:3
  claim: Orion’s fatal ankle-sting by a scorpion is compared with Hackelberend’s fatal
    foot-wound from a wild boar’s tusk.
  claim_level: same_motif
  target: Hackelberend’s fatal boar-tusk foot wound
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The wound location and fatal outcome are similar, but the attacking
    creatures and narrative contexts differ.
- id: claim:4
  claim: Holda is presented as functionally resembling Artemis/Diana and especially
    Hecate as female huntress figures, though Orion’s relation to Artemis is not equated
    with Wuotan’s relation to Holda.
  claim_level: same_function
