  quote: ''
  summary: The passage surveys traditions in which figures such as Charles, Wuotan/Odin,
    Arthur, Holger/Ogier, Svatopluk, and unnamed men are hidden or lodged in cellars,
    mountains, caverns, or chambers, are thought to remain alive, and are expected
    or sought to return. Several examples include stone tables, long beards grown
    into stone, armed companions, abundant provisions, and search customs.
  language: English
