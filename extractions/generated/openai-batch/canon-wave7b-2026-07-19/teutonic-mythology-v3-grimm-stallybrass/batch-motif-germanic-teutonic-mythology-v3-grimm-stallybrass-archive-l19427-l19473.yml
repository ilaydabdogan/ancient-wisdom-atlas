canonical_text:
  quote: ''
  summary: 'The passage collects agricultural prayers and charms: a Chuvash/Cheremis
    prayer to God Lath for health, wealth, bees, honey, cattle, protection, and increase;
    a Latin Roman daps and wine offering to Jupiter for oxen and later sowing; an
    Old English remedy for barren land blasted by magic using turfs, farm products,
    plant materials, holy water, and an increase formula; and a footnote comparing
    increase imagery with a Servian Yule-log spark blessing.'
  language: English, with quoted Latin and Old English
  quote_policy: summarized
