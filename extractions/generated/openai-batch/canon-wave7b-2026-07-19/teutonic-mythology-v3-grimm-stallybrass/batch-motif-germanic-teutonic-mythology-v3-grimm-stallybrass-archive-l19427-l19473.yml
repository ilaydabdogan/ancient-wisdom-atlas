  text: The prayer uses comparisons of thick hops, bright light, and increasing wax
    as verbal models for good hap, sound mind, life, and increase.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: Cato's Latin passage directs a daps or offering for oxen, including wine offered
    to Jupiter dapalis.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Cato's rite declares the day a holiday for oxen, cattlemen, and those who
    make the offering; it also mentions an optional offering to Vesta and sowing crops
    after the daps.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Old English passage presents a remedy for fields or land that do not grow
