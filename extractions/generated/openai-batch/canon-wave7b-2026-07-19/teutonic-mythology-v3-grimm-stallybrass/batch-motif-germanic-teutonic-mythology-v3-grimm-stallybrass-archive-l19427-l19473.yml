  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Old English remedy instructs the practitioner to take four turfs from
    four sides of the land at night before daybreak and mark how they previously stood.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The remedy instructs the practitioner to collect oil, honey, barm, milk from
