  summary: 'The passage surveys magical apparatus and effigy sorcery: an Icelandic
    snake-shaped object called a snackr drains cattle of milk for a witch; wax figures
    manipulated with words, water, fire, needles, and burial affect absent people;
    charms may be aimed at love or harm; counter-agencies may turn the danger back
    on the conjuror. Notes add a Lapland magic vessel and begin a story of a scholar-errant
    making a wax image to kill an absent husband.'
