canonical_text:
  quote: ''
  summary: The passage describes poetry and music as associated with gods, elves,
    watersprites, and Hniharr/OSinn, then says the gift of poesy passed from gods
    to certain heroes. Horant’s songs affect people and animals; Volker’s fiddle calms
    anxious men to sleep. The passage compares these effects with Greek figures Orpheus
    and Amphion, whose music affects stones, animals, trees, the Argo, and dragons.
    It also cautiously speculates about HermoSSr/HerincVSr and Balder, while noting
    that such music is not recorded in the Edda.
  language: English
  quote_policy: summarized
