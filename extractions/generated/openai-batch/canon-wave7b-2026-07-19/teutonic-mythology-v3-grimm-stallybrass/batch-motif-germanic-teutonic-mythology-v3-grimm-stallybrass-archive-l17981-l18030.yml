canonical_text:
  quote: ''
  summary: The passage surveys mistletoe names, host trees, handling rules, appearance,
    child neck-wearing, and hazel-treasure lore; then compares viscum with Pliny’s
    druidical herbs selago and samolus, giving ritual collection rules and protective
    uses. It records Welsh and Breton identifications of selago or a golden herb,
    and ends by clarifying that baldrian derives from Valeriana, not Baldr, while
    another herb was called Baldr’s brow.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Breton lay says Merlin goes at early morning to fetch the high branch on
    the oak.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old herbals divide mistletoes by host tree, including oak, hazel, and pear
    tree; none of them are to touch the ground, and some are set in silver and hung
    around children’s necks.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Prussian Samland, mistletoe is called wispe; the passage notes a resemblance
    to viscum or gui and also notes possible confusion of mistel with mispel.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says the plant is common on birch, cherry, and lime trees, rare
    on hazel, grows straight from the trunk, has smooth evergreen willow-like leaves,
    and bears silvery-white berries like peas or small nuts.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Where hazel has a wispe, a treasure is said to be hidden.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage lists Bohemian, Russian, Polish, Lithuanian, and Lettish names
    for mistletoe-like terms, but says no legends are found there.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Pliny’s selago is to be gathered without iron, with the right hand covered
    by the tunic and then drawn out with the left; the gatherer wears white, is washed,
    has bare feet, performs a rite with bread and wine beforehand, and carries it
    in a new cloth.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:8
  text: The Druids of Gaul are cited as saying selago should be kept against every
    harm.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Samolus is described as a herb growing in wet places, gathered with the left
    hand by fasting persons against diseases of swine and cattle; the gatherer must
    not look back, and the herb is deposited and crushed only in a channel for drinkers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Davies is cited as saying selago is the Welsh gras Duw, and Villemarque is
    cited as thinking it is the Breton aurea herba, which is to be pulled before sunrise,
    barefoot and bareheaded, shines like gold, is rare, and is found only by holy
    persons.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The passage says baldrian is a corruption of Valeriana and has nothing to
    do with Baldr; it says anthemis cotula was named Baldrs bra or Baldersbra.
  category: speech
  evidence_refs:
  - ev:9
