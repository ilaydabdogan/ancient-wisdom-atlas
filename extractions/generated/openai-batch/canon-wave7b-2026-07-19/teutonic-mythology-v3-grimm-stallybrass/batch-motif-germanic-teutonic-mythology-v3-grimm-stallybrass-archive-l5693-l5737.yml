canonical_text:
  quote: ''
  summary: The passage surveys German legends of enchanted or dead figures enclosed
    in mountains or stone tombs, a disturbed grave whose dead occupants threaten the
    disturber, and white or snow-white maidens associated with mountains, sunlight,
    agricultural materials, and gold. It ends with an incomplete notice of a night
    fire and a maiden emerging every seven years from Otomannsberg.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage links three enchanted malefactors at a table with a broader pattern
    of heroes shut up in mountains and naturally dead persons sleeping in stone tombs
    who sometimes visibly appear.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Steinfeld, after a man disturbed a Hüne-grave, three men appeared to him
    the following night; one of the three is described as one-eyed, with the source
    noting an allusion to Wuotan.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Steinfeld grave-men converse in an unintelligible language, threaten the
    tomb-disturber, say they fell in their country's cause, and warn that further
    disturbance will deprive him of luck or star.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says Holda is spell-bound in a mountain and applies the same idea
    of mountain banishment especially to white women or white-robed maidens, described
    as divine or semi-divine beings visible to mortals at appointed times.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The white women or white-robed maidens are said to prefer appearing in warm
    sunlight to poor shepherds and herd-boys.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the Lahnberg in Upper Hesse, a white maiden sits at sunrise with wheat
    spread on sheets to dry in the sun and is spinning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A baker of Marburg takes a handful of the Lahnberg maiden's grains and later
    finds grains of gold in his pocket; the passage adds that a like tale is told
    of a peasant near Friedigerode.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the Boyneburg, a poor shepherd tending his flock sees a snow-white maiden
    sitting in the sunshine by the castle door with flax pods laid on a white cloth
    before her.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Boyneburg shepherd steps up, praises the pods, takes a handful to examine,
    and lays them down again; the maiden looks at him kindly and mournfully without
    speaking.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the Boyneburg shepherd goes home, pods that had fallen into his shoe
    trouble his foot; when he removes the shoe, five or six grains of gold roll into
    his hand.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the Otomannsberg near Geismar village, a fire is said to burn at night,
    and every seven years a maiden comes out; the supplied passage breaks off before
    completing the description.
  category: setting
  evidence_refs:
  - ev:7
