  summary: The passage describes a golden wishing-rod lying among the gold and gems
    of a hoard. The rod is said to bring treasure, increase treasure's value, and
    grant power over all men to one who knows its worth. The passage then describes
    traditions for obtaining a forked hazel or holy-thorn shoot under lunar, solar,
    directional, silent, bowed, and spoken-spell conditions, and explains how the
    rod is held so that it turns toward hidden objects or ore.
