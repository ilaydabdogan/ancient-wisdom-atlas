literal_observations:
- id: obs:1
  text: The passage asks how Zio came to unite the ideas of sky and war, and links
    terms for fighting, sacredness, priesthood, Mars, holiness, brightness, and beaming.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage compares Gothic, Sanskrit, and Slavic terms connected with whiteness,
