  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Svetovit or Swantowit is identified with Ares and war, and a parallelism is
    stated between Wuotan, Donar, Zio and Eadigast, Perun, Svetovit.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Suryas is described as denoting sun, light, and day, and as resembling Zio.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage summarizes a story in which Suryas takes hold of a victim, the
    victim bites off his hand, and a golden hand is put on; this is compared with
    Tyr, whose hand the wolf bit off.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage connects eye with sun, blood with water, tears with the bitter
    sea, and mentions myths of Sif's hair and Freyja's tears.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that ancient cosmogonies may invert each other, giving
    the examples of man made of world and world made of man.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says heathen gods should not be referred exclusively to astrology
