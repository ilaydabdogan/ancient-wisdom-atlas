    a strong horse.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The angel is said to visit the gentle Moringer in similar distress, while
    Henry the Lion and Gerhart travel with the Devil's aid.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The passage states that angel and devil can exchange places in these narratives
    and interprets the older figure as Wuotan carrying his foster-son through the
    clouds.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A devil carries a late canon from Bayeux to Rome in time for pontifical mass;
