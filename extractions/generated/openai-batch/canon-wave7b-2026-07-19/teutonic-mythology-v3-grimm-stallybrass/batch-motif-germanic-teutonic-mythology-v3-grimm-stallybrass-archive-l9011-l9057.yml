canonical_text:
  quote: ''
  summary: 'The passage surveys devil traditions: a blinded, giant-like devil compared
    with Polyphemus and Depeghoz; Esthonian thunder tales in which God pursues and
    smites the devil at rocks; medieval narratives where a devil, angel, or Wuotan-like
    helper transports figures rapidly through the air; and beast-fable variants about
    dividing field produce by upper and lower growth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage characterizes the Devil in a preceding tale as more like a blundering
    giant than the malignant enemy of humankind, and refers to his blinding.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Devil's blinding and the name Issi are said to recall Homer's Polyphemus
    and OZtis, as well as the oriental Depeghoz; the passage also mentions a nursery-tale
    giant whose eyes are scalded out with oil.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Other Esthonian tales explain thunder by saying that God pursues the Devil,
    who flees to rocks for refuge and is smitten down.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says medieval poetry often has heroes carried by the Devil through
    the air from distant countries to their home when their presence is urgently needed
    because a marriage threatens their wife or lover.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: King Charles is described as riding a devil transformed into a horse from
