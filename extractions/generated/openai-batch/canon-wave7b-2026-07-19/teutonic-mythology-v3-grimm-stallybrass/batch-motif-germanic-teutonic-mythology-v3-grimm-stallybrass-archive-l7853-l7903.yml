  quote: ''
  summary: Grimm discusses names and associations of the Devil that he treats as mixed
    with older Germanic pagan beings and gods. The passage links Devil-names with
    trolls, giants, hostile spirits, animals, weapons, northern residence, Loki, Hel,
    and Death, then describes how Christian converts and abjuration formulas grouped
    the Devil with former gods such as Thuner, Woden, and Saxnote.
  language: English with Old Norse and Old Saxon terms
  quote_policy: summarized
