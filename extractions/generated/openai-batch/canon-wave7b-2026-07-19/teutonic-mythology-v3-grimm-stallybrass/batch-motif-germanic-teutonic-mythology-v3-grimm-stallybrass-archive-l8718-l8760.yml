canonical_text:
  quote: ''
  summary: The passage surveys legends in which bell-ringing repels dwarfs, giants,
    and devils; devils remove bells or attempt to destroy churches with stones; large
    stones and earthworks are explained as traces of the Devil's actions; and specific
    Limburg and Durbach stories describe failed attempts to throw stones at churches,
    leaving bodily imprints in rock. Devil's Dikes are explained as boundaries of
    the Devil's kingdom, with an analogy to a hostile neighboring Jotunheimr.
  language: English
  quote_policy: summarized
