canonical_text:
  quote: ''
  summary: The passage lists effects attributed to spells, charms, and runes, then
    discusses the force of curses in German poetic language and comparative examples.
    Curses are described as hard to break, as obeying a speaker’s will, as stronger
    when received on an empty stomach, as floating or flying until they strike a target,
    and as producing visible or bodily effects in examples from Irish belief, the
    Pentamerone, and Old Norse poetry.
  language: English with Middle High German, Old Norse, and Italian citations
  quote_policy: summarized
