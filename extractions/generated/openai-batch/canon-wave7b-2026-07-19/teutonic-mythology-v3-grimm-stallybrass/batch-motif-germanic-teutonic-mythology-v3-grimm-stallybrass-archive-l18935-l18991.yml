  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Walther passage is presented in which a first-person speaker says he knows
    two curses that curse according to his will.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that curses received on an empty stomach are thought to
    be more effectual.
  category: attribute
