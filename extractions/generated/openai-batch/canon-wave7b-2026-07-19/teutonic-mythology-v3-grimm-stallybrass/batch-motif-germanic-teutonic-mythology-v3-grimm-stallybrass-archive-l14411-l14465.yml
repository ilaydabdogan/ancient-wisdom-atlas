canonical_text:
  quote: ''
  summary: 'The passage catalogs omens and funeral-related bird beliefs: the owl and
    other night birds are treated as baleful or death-announcing; some names connect
    birds with witches, lamias, sprites, or spectral winged beings; raven behavior
    and cock-or-hen behavior are listed as death prognostics; wooden doves and carved
    cuckoos serve as mourning figures at graves; and a Wend wailing being appears
    as a white hen or white child announcing misfortune.'
  language: English with cited Latin and Germanic/Slavic terms
  quote_policy: summarized
