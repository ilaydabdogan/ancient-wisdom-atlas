canonical_text:
  quote: ''
  summary: The passage surveys legends of white ladies or white women in hills, caverns,
    forests, and lonely places. It describes gifts that prove to be gold, regional
    variants across Germanic areas, a white maid whose garden attracts a lost child,
    midnight visitations asking deliverance, associations with treasure, gold, death
    omens, anomalous feet or nails, and Grimm's proposed connection with earlier female
    supernatural figures such as Holda, Berhta, Ostara, elfins, and swan-wives. It
    also states a release condition involving a future deliverer rocked in a cradle
    made from a tree now only a twig in a tower wall.
  language: English
  quote_policy: summarized
