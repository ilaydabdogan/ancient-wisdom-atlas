  summary: The passage catalogues vernacular names for human diseases, including ailments
    linked with holdichen, worms called white folk or elves, divine strokes or hands,
    falling sickness, nosch/noschen charm material, colic as a biting bermutter, and
    other named afflictions such as consumption and dropsy.
