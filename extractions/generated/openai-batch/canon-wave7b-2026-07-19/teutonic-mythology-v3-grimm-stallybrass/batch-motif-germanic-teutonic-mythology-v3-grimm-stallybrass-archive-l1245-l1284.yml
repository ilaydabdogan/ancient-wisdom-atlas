canonical_text:
  quote: ''
  summary: In a prefatory methodological passage, the author argues that comparative
    mythology should weigh both resemblances and divergences rather than infer borrowing
    too quickly. He cites Germanic heroic adventures compared with the Odyssey, messenger
    missions resembling Hermes' mission to Calypso, broad epic patterns of hero wanderings
    and encounters, deity correspondences between Germanic and Greco-Roman figures,
    distinctions between divine and human speech in Homer and the Edda, and linguistic
    parallels, while repeatedly warning against assuming direct derivation.
  language: English
  quote_policy: summarized
