canonical_text:
  quote: ''
  summary: The passage surveys legends of people selling, giving, or binding themselves
    to the Devil, often through a document, bargain, payment term, or service period.
    It emphasizes that the Devil is commonly cheated of his claim through Marian aid,
    verbal or legal loopholes, impossible demands, or seven years of peculiar service.
    It then compares Christian medieval formulas of vowing or writing oneself into
    the Devil's hands with Old Norse expressions for giving oneself to Odin.
  language: English
  quote_policy: summarized
