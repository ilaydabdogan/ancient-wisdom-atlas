canonical_text:
  quote: ''
  summary: 'The passage collects German reports and prophecies about Kaiser Frederick:
    peasants are said to have seen him as a pilgrim and heard that he would yet become
    powerful, recover the Holy Sepulchre and Holy Land for Christians, and hang his
    shield on a withered bough. A poem of about 1350 and a Sibylline prophecy similarly
    describe Frederick hanging his shield on a dry or withered tree, after which the
    tree becomes green and bears, in connection with winning the Holy Sepulchre over
    the sea.'
  language: English with Middle High German/German excerpts
  quote_policy: summarized
