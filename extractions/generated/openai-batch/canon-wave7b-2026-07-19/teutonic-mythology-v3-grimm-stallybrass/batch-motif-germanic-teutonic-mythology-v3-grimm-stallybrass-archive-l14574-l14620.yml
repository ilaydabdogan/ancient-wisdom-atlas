  summary: The passage catalogues superstitions about luck-bearing or efficacious
    objects, including found, begged, stolen, execution-related, wooden, bedding,
    and gateway objects. It then discusses the selection of auspicious or inauspicious
    days across Jewish, Greek, Christian admonitory, and Roman examples, including
    travel, work, building, nail cutting, and bodily signs on fingernails.
