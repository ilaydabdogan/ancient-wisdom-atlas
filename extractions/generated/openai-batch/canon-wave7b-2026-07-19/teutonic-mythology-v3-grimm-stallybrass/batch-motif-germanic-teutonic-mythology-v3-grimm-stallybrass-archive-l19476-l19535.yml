canonical_text:
  quote: ''
  summary: 'The passage gives Old English ritual instructions for blessing a cornfield:
    turf is taken to church for masses, returned before sunset, crosses with evangelist
    names are set in a pit, prayers and bows are performed facing east, liturgical
    texts are sung, the rite is commended to Christ, Mary, and the holy cross, and
    seed and plough materials are ritually handled.'
  language: Old English with English headings and glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A turf is taken to church, four masses are sung over it by a mass-priest,
    and its green side is turned toward the altar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The turf is brought back before sunset to the place from which it was taken.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Four Christ-crosses are made from cwicbeam wood, and the names Matthew, Mark,
    Luke, and John are written on their ends.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The crosses are laid in the bottom of a pit, the turf is set above them, and
    the names of the four evangelists are spoken with the word crux.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The word Crescite and the Pater noster are each said nine times.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The practitioner faces east, bows humbly nine times, and asks the great Lord,
    the holy guardian of heaven, earth, heaven, Saint Mary, and heavenly powers to
    empower the charm and make the crops useful.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The practitioner turns three times with the course of the sun, stretches out,
    says litanies and Sanctus, sings Benedicite with outstretched arms, and says Magnificat
    and the Pater noster three times.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The rite is commanded or commended to Christ, Saint Mary, and the holy cross
    for praise and glory, and for the benefit of the landholder and those subject
    to him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: After the preceding actions, unknown seed is taken from almsmen and twice
    as much is given back to them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: All plough-tackle is gathered together, and incense, fennel, hallowed soap,
