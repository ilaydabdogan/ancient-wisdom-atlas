  summary: 'The passage catalogs German and neighboring variants of the Furious or
    Wild Host: a request for game from a passing hunt, a West Prussian wild hunter
    who throws a man''s thigh from the air, named and unnamed spectral hunters, headless
    and mounted riders, night sightings with dogs or colored horses, and a song in
    which a former lord is condemned to hunt an unattainable stag until Judgment-day.'
