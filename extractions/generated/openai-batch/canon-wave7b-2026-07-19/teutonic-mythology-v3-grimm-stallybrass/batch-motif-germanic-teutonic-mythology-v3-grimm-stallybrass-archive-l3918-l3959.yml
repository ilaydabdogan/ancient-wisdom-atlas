canonical_text:
  quote: ''
  summary: The passage describes a stone/dog entity associated with household danger
    during the twelves, consequences after the dog is killed, and several episodes
    in which Frau Gauden needs help with her carriage at cross-roads and rewards helpers
    with gold. It also notes that Frau Gauden favors young children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An entity is described as a stone by day, as returning to the house if thrown
    away, and as a dog again at night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dog is said to whimper throughout the year and to bring sickness, death,
    and danger of fire to house, people, and animals until the twelves return.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the twelves, householders are said to keep the great house-door locked
    after nightfall, with neglect associated with Frau Gauden coming to the person.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The grandparents at Bresegardt are said to have killed the dog; afterward
    the household lost blessing or thriving, and the house eventually burned.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Frau Gauden sometimes loses her way in the darkness of night and reaches a
    cross-road, where some part of her carriage breaks.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Frau Gauden appears dressed as a stately dame, wakes a labourer at Boeck,
    asks for help, and the labourer repairs her carriage wheel at the cross-roads.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Frau Gauden tells the labourer to collect deposits left by her canine attendants
    at the cross-roads.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: At daybreak, the deposits taken by the labourer are revealed to be gold, while
    no trace remains at the cross-roads in daylight.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A man at Conow and a woman at Gohren are said to have repaired parts of Frau
    Gauden's carriage and received chips that turned into glittering gold.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Frau Gauden is said to love young children and give them various good things.
  category: attribute
  evidence_refs:
  - ev:6
