  summary: 'The passage surveys expressions and comparative notices about the Devil:
    a formula about the Devil''s death possibly linked to an elf or dwarf king''s
    death; Wuotan and other figures as sowers of strife or seed; the Devil as soul-killer
    with a fiery bow; Devil and Death imagery involving bonds, ropes, bridle, steed,
    and horse; and folk sayings attributing mishaps, idleness, concealment, or harmful
    conditions to the Devil.'
