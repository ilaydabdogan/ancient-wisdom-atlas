canonical_text:
  quote: ''
  summary: The passage discusses a thunder-protective water-plant called Britannica
    or hcewen-hycFele, its possible relation to the seeblatt and to lotus names associated
    with Lakshmi, and several Roman ritual procedures for digging herbs, including
    offerings to the earth, sword-circles, directional orientation, lifting plants
    skyward, purification with hellebore, eagle augury, mandrake precautions, and
    replacing some roots after use.
  language: English with Latin quotations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A plant identified as Britannica is described as esteemed by ancient Germans
    and as to be gathered before hearing thunder.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The plant is said to protect from lightning and therefore to be sacred to
    the Thunder-god, like the house-leek called donner-wehr.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage treats Britannica as a water-plant, possibly hydrolapathum, with
    an Old English gloss hcewen-hycFele and a possible meaning like blue sea-flower.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The author proposes a possible recognition of the plant as the seeblatt sacred
    to Frisians and Zealanders and notes that names such as nixblume and mummel recall
    Indian lotus names associated with Lakshmi or Sri.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Roman herb-digging custom summarized here, mead and honey or sweetened
    water are poured around the plant as a propitiation of the earth before extraction.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Roman procedures include cutting or drawing a circle around the root with
    iron or a sword, facing east, west, or the sunrise, and lifting the plant high
    or toward the sky after it is pulled out.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
- id: obs:7
  text: Black hellebore is described as used to fumigate and purify houses and to
    sprinkle cattle, accompanied by solemn prayer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The collection of black hellebore includes drawing a sword-circle, facing
    sunrise, praying for divine permission, and observing an eagle's flight as an
    omen; a near approach of the eagle predicts the cutter's death that year.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mandrake diggers avoid a contrary wind, draw three circles with a sword, and
    dig while facing west.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In some cases, after a root had been dug and used, it was put back in the
    same place so that it might continue living.
  category: sequence
  evidence_refs:
  - ev:6
