canonical_text:
  quote: ''
  summary: 'The preface passage compares names for a Supreme Being across northern
    Eurasian peoples, then emphasizes sacred-animal practices and related customs:
    the Votiak sacred woodpecker, bear-worship with ceremonial hunts, oaths and sacrifices
    involving bearskins, the bear as king of beasts and Great Bear constellation,
    boar worship among Circassians and ancient Germanic-related peoples, veneration
    of Elias, sword worship, shoulder-blade inspection, and Mongolian parallels with
    Celtic and Germanic customs.'
  language: English
  quote_policy: summarized
