canonical_text:
  quote: ''
  summary: 'The passage describes reported witch-trial motifs: a woman carried through
    the air by the devil in a cloak to a trysting-place; an assembly of witches with
    demon lovers around an enthroned goat-shaped Chief Devil; a queen chosen among
    the witches; a deficient feast, mischief-accounting, dance, beating, and distribution
    of ashes from the burned goat; and the probation of an untried witch tending toads
    with a white wand.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Older accounts say the devil takes the woman inside his cloak and carries
    her through the air; she is called mantelfahre or mantelfahrerin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the trysting-place there are many witches, each with a demon lover; the
    witches include neighbour women, women long dead, and some masked or muffled superior
    figures.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The demon lovers are described as servants of the Chief Devil, who appears
    in goat-shape with a black human face and sits in the middle of the ring on a
    high chair or large stone table while others kneel and kiss in reverence.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the Chief Devil favours a particular woman, she is named the witches'
    queen and ranks above the others.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The meal is lit by black torches kindled from a light between the horns of
    the great goat; the food lacks salt and bread, and drink is taken from cows' hoofs
    and horses' heads.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The witches relate past mischief and plan new mischief; if their misdeeds
    do not satisfy the Devil, he beats them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the feast, a musician sits in a tree; his fiddle or bagpipe is described
    as a horse's head, and his fife as a cudgel or a cat's tail.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: During the dance, partners face outward with their backs to one another; in
    the morning a circular grass-track may show the prints of cows' and goats' feet.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The dance is compared in the passage to that of sword-dancers in Hessian trials,
    and the passage mentions a golden shoe on a woman's right foot and red shoes associated
    with the trut.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: When the ring-dance is over, participants beat each other with swingle-staves
    and mangle-bats and practise lewdness.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: At last the great goat burns himself to ashes, and the ashes are distributed
    among the witches to work mischief with.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A young untried witch is not immediately admitted to the feast and dance but
    is set aside to tend toads with a white wand; the passage also says the witches
    breed and maintain these at home.
  category: sequence
  evidence_refs:
  - ev:9
