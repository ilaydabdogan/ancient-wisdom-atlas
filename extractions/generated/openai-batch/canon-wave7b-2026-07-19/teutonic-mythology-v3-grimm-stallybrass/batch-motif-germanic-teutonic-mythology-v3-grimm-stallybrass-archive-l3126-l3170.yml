  quote: ''
  summary: The passage describes contests of poetry, wisdom, lays, and riddles in
    which heads or lives are wagered; a widely circulated story-pattern in which a
    poet's songs are endangered by another's memorization; poets treated as incarnations
    of Brahma; and the goddess Saga, associated with Oðinn, cool waters, golden cups,
    immortality, and poesy, with comparisons to Greek Muses and northern wise women
    or norns.
