canonical_text:
  quote: ''
  summary: The preface passage comments on the fundamental character of Teutonic mythology,
    saying it was interrupted early and its heathen remains survived under a new guise.
    It describes the highest god as father and grandfather who grants aid to the living
    and entrance to his dwelling for the dead, death as a return home to the father,
    and the highest goddess as mother, grandmother, and wise white ancestress. The
    god and goddess are said to appear in the land and instruct in different arts.
    The passage also notes paternal authority in ancient law through a father acknowledging
    a newborn son.
  language: English
  quote_policy: summarized
