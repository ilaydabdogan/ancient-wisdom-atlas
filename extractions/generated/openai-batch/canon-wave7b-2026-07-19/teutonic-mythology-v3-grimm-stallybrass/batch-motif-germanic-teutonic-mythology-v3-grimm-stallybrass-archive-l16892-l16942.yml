canonical_text:
  quote: ''
  summary: The passage describes Breton and Lithuanian/Polish-Lithuanian traditions
    in which plague is personified as a female figure. In the Breton account, the
    Plague is carried across, reveals herself, kills those touched by her staff, spares
    her carrier and his mother, and is later driven away by songs naming her. Variant
    song details include mass death, a full churchyard, and a kerchief tied to an
    oak. The passage then describes Lithuanian Giltine/Magila/diewe and Mickiewicz's
    plague-maiden, who appears in white with a fiery wreath and bloody kerchief and
    brings desolation and graves to settlements.
  language: English with Polish and Lithuanian terms
  quote_policy: summarized
