canonical_text:
  quote: ''
  summary: The passage summarizes attributes and comparative identifications of Wuotan/Odin
    under several names, including Wish, Omi, Hackelbernd, Longbeard, and the blind
    graybeard. It links him with attendant women, a hoard-opening wand, an air-carrying
    mantle, the furious host, cloak and hat imagery, mountain-sleep, ravens, wolves,
    victory, blessing, poetry, measurement, boundaries, dice-throwing, gifts, treasures,
    and arts. It then describes Donar/Thunar/Thor as Wuotan's son, sometimes overlapping
    with him or older than him, and as a father/grandfather god associated with hills,
    rocks, hammer, forest, mountain-top throne, lightning bolt, sacred oak, land measurement,
    combat with giants, and walking or driving rather than riding.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One of Wuotan's names is given as Wish, and the passage connects this name
    with women who do the god's bidding, a wand that unlocks his hoard, and a mantle
    that carries him through the air.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Norse name Omi is compared with the Anglo-Saxon Woma and is said to mark
    a stormful god known through the legend of the furious host.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The name Hackelbernd is said to retain the imagery of a wide cloak and low
    hat.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: As Longbeard, the god in mountain-sleep is said to be reproduced in the royal
    heroes Charles and Frederick.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ravens are described as sitting on Wuotan's shoulder and bringing him thoughts
    and tidings; ravens and wolves are also said to scent his march to victory.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: In Norse sagas, the questioner is described as a blind graybeard and identified
    with old Odin.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wuotan/Odin is described as Father of victory, god of blessing and bliss,
    god of poetry, measurement, span, boundary, and dice-throw; gifts, treasures,
    and arts are said to have proceeded from him.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Donar, also named Thunar and Thor, is described as a son of Wuotan who yields
    to him in power or influence, but is at times identical with him and to some extent
    an older god.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Donar is described as a father and grandfather, a god of hills and rocks,
    a hammer, seated in the forest and throned on the mountain top, and as hurling
    an old stone weapon identified with the lightning bolt.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The oak is said to have been sacred to Donar, and his hammer's throw is said
    to have measured out land as Wuotan's wand later did.
  category: relationship
  evidence_refs:
  - ev:7
