  summary: The passage discusses orally transmitted magical formulas invoking elves,
    sprites, dwarfs, Aesir, and witches; witches' reported journeys to Venusberg and
    paradise; the replacement of Holda or an older nocturnal goddess by the Christian
    Devil in accounts of witches' night rides; benign bonds between humans and elves,
    home-sprites, or guardian spirits; and the names of witches' devils, which are
    compared with names of elves, kobolds, fairies, plants, trees, feathers, and human
    diminutives.
