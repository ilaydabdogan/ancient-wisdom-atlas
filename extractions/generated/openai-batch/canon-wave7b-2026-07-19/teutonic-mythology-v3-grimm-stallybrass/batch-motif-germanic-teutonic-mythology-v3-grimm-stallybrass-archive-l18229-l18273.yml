  quote: "“whoever wears this on his head can tell who are witches”"
  summary: The passage collects notes on herbs and their names. It describes taking
    artemisia before sunrise with a spoken formula; recounts Scottish mermaid stories
    in which mugwort, nettles, and muggons are named as healing or life-preserving
