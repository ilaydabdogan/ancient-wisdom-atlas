canonical_text:
  quote: ''
  summary: The passage surveys beliefs about witches, bogies, and sorceresses that
    consume children or human flesh, then describes traditions in which a sleeping
    witch’s spirit or a sleeper’s soul-like animal leaves the body. It recounts King
    Gunthram’s snake-like animal leaving his mouth, crossing water on a sword, entering
    a hill, and corresponding to his dream of an iron bridge and a mountain full of
    gold. Later variants involve a weasel, cat, red mouse, or mouse leaving sleepers,
    and the author notes possible links with mouse-making, a soul’s narrow bridge
    to the underworld, and Servian parallels.
  language: English, with Latin and Germanic/Slavic terms
  quote_policy: summarized
