  quote: ''
  summary: The passage surveys divinatory practices, distinguishing learned Greco-Roman
    methods from local customs. It describes battle omens from war-song, a Polish
    account of a pythoness carrying river water in a sieve before an army, water in
    a sieve as an innocence test or impossible task, and a Northmen's raven standard
    whose appearance indicated victory or defeat. The author also compares the raven
    sign with Odin's victory bird.
  language: English with embedded Latin and German citations
  quote_policy: summarized
