canonical_text:
  quote: ''
  summary: 'The passage collects Scandinavian examples concerning völvas, seiðr, and
    sorcery: Heiðr and other fortune-telling women are described with derogatory terms;
    King Froði tries to compel prophecy from the völva Heiðr on a seiðhjallr; seiðr
    is described as a nocturnal practice performed while others sleep; Ketill encounters
    a troll-woman going to a supernatural assembly; legal terminology is cited for
    outdoor night magic intended to wake trolls; and sorceresses are paid to send
    weather or storms.'
  language: English with Old Norse quotations
  quote_policy: summarized
