  quote: ''
  summary: 'The passage collects examples of storm-raising magic: figures holding
    pots from which storms rise, corpse ashes or dust connected with clouds and hail,
    imprecatory weather magic in conflict, hidden words raising storms from a castle,
    wind and foul weather tied in bags, sacrifices to devils for hail, and witches
    producing fog and clouds by working water and other objects.'
