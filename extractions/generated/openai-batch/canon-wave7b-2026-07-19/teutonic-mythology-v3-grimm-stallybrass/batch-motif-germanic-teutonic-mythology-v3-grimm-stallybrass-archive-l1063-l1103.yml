canonical_text:
  quote: ''
  summary: The preface passage moves from philological notes on terms for Huns, giants,
    and elves to a methodological argument that Germanic mythology must be studied
    in relation to other nations' religions. It describes nations as tending toward
    isolation, uses a river-and-water image for domestic tradition and later mixture,
    and states that language, literature, and faith were disrupted by conversion to
    Christianity.
