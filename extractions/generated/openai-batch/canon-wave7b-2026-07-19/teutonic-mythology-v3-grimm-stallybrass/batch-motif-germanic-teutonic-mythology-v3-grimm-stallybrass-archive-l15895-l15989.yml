candidate_motifs:
- id: motif:1
  label: Diagnosis or protection by ritual measuring
  taxonomy_refs: []
  basis: The passage repeatedly describes measuring bodies, images, belts, threads,
    and yarn to diagnose illness, assess danger, or perform a bodily rite.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not give a single unified ritual system; examples come
    from multiple places and citations.
- id: motif:2
  label: Illness sign revealed by shortening or failed length
  taxonomy_refs: []
  basis: Nightgrip is signaled if the belt is shorter on remeasurement, and consumption
    danger is assessed by thread length across body dimensions and by whether length
    returns over time.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The interpretation of why shortening occurs is not explained beyond its
    use as a sign.
- id: motif:3
  label: Invoked holy witnesses for diagnostic sign
  taxonomy_refs: []
  basis: The nightgrip procedure includes a prayer asking God, by the three virgins
    Margarita, Mariamagdalena, and Ursula, to grant a sign on the sick man.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage reports the formula without elaborating a wider theological
    context.
- id: motif:4
  label: Wise-woman diagnosis and prescription
  taxonomy_refs: []
  basis: The measuring-woman assesses consumption by measuring, and the wise woman
    receives the ash-line count and prescribes accordingly.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage uses several roles and local terms; it does not prove all
    are the same institution.
- id: motif:5
  label: Stroking and binding as bodily cure
  taxonomy_refs: []
  basis: The passage states that patients are stroked with hand, sleeve, or knife-back,
    and that thread may be tied around afflicted parts or used to tie on medicine.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: Specific diseases treated by these actions are not detailed in this short
    section.
- id: motif:6
  label: Spirit tracks read in ashes
  taxonomy_refs: []
  basis: Ashes are strewn around a sickbed; in the morning lines are counted, and
    the passage states that spirits leave tracks in the ashes.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The identity of the spirits is given only as white folk or spirits in
    this passage.
- id: motif:7
  label: Silent reporting of divinatory count
  taxonomy_refs: []
  basis: After lines in the ashes are counted, someone goes silently without greeting
    anyone and reports the count to the wise woman.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage does not explain the function of silence or non-greeting.
- id: motif:8
  label: Fire and oven as therapeutic media
  taxonomy_refs: []
  basis: Fire is used against envenomed wounds, sickness, erysipelas, and childhood
    fever or growth affliction; children may be laid near fire or on an oven or pushed
    into a baking oven.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage groups several fire-related cures but they vary in ailment
    and procedure.
- id: motif:9
  label: Needfire passage for animal protection
  taxonomy_refs: []
  basis: Cattle are driven over holy needfire to insure them against fire.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: Only the protective function against fire is stated here.
- id: motif:10
  label: Healing or anti-magic passage through apertures
  taxonomy_refs: []
  basis: Children, infants, cattle, and sheep are made to pass through tunnelled earth,
    holes, hollow stones, cloven trees, vines, or a young oak cleft to prevent or
    neutralize magic or work homeopathically.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage offers multiple explanations and examples rather than a single
    fixed interpretation.
- id: motif:11
  label: Perforated stone as enduring aperture object
  taxonomy_refs: []
  basis: The passage names early records of perforated stones and stones called needles'
    eyes, in connection with practices involving hollow stones and hollow trees.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The suggested replacement of hollow trees by stones is explicitly tentative
    in the passage.
comparison_claims:
- id: claim:1
  claim: The author explicitly invites comparison between human measuring rites and
    cited measuring of corn and water.
  claim_level: same_function
  target: Measuring of corn and water cited in the same work and supplement references
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The target practices are only referenced, not described in this passage.
- id: claim:2
  claim: The ash-strewing around a sickbed is compared by the author to ash strewing
    for the earth-mannikin.
  claim_level: same_function
  target: Earth-mannikin ash-strewing practice cited elsewhere in the work
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The earth-mannikin practice is not described in detail within this
    passage.
- id: claim:3
  claim: The child oven and fire cures are compared by the author to the plan of goddesses
    and night-wives laying children by the flame.
  claim_level: same_function
  target: Goddesses and night-wives laying children by the flame, cited elsewhere
    in the work
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The related episode is only summarized by cross-reference, so the extent
    of similarity cannot be assessed here.
- id: claim:4
  claim: The passage presents Anglo-Saxon canonical prohibitions and later folk examples
    as variants of the same aperture-passage practice for infants or animals.
  claim_level: same_motif
  target: Infants drawn through perforated earth and livestock passed through hollow
    trees or perforated earth in cited canons and later practices
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The examples are compiled from different dates and places; the passage
    does not demonstrate direct continuity.
- id: claim:5
  claim: Perforated stones called needles' eyes are linked by the author to hollow-tree
    aperture practices through the suggestion that some stood where hollow trees had
    died.
  claim_level: visual_similarity
  target: Perforated stones and former hollow trees used or esteemed as aperture sites
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: low
  limitations: The author phrases the connection tentatively; the passage provides
    no independent evidence for placement on former tree sites.
