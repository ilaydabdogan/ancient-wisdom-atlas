canonical_text:
  quote: ''
  summary: 'The passage catalogs folk-medical and ritual procedures for diagnosing
    or curing sickness in humans, children, and animals: measuring bodies with wicks,
    belts, threads, or yarn; stroking and binding afflicted parts; strewing ashes
    around a sickbed to read spirit tracks; citing water-drawing, a hatchet charm,
    fire cures, oven and roof cures for children, and passage through tunnelled earth,
    hollow stones, cloven trees, vines, or perforated stones.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pregnant women measure a wick to the length of a saint's image and tie it
    around their body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For suspected nightgrip, a sick man's belt is drawn around his naked body
    lengthwise and breadthwise, hung on a nail with a prayer for a sign, and measured
    again.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the belt used for the nightgrip test is shorter on the second measurement,
    the shortening is taken as a sign of the sickness.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A village measuring-woman measures a patient with a thread from head to heel
    and then from fingertip to fingertip across outspread arms to assess consumption.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the consumption test, lesser arm measurement indicates the disease has
    advanced; if the thread reaches only to the elbow, there is said to be no hope.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Repeated measuring is used to track danger: if the thread stretches and reaches
    its expected length again, the danger is considered removed.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The measuring-woman is described as an old woman who must not ask money for
    the work, but may take what is given.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A woman may be stripped and measured with red yarn spun on a Sunday.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that much can be done by stroking the patient's body with
    a hand, sleeve, or back of a knife, and by tying a thread around the affected
    part or tying medicine on with it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In a Polish procedure, a sick man tormented by the white folk is laid on a
    sheet over pease-halm while a person walks around him carrying a sieve of ashes
    on the back and letting ashes fall around the bed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the morning, the lines in the ashes are counted, and someone silently reports
    the count to the wise woman without greeting anyone on the way.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that spirits leave their tracks in the ashes.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage cites drawing and pouring water by a wise woman and charming apoplexy
    by a hatchet on the threshold.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage states that fire and flame were used against envenomed wounds
    by burning them out, and cites fire against sicknesses.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Fire struck from flint is mentioned for erysipelas, and cattle are driven
    over holy needfire to insure them against fire.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: An old fever cure lays a child on the oven or roof; another cited procedure
    places an infant near fire.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: If a child does not grow and is said to have the elderling, the child is pushed
    into the baking oven a few times so that the elderling will leave.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: The author says the oven-and-fire child cure follows the plan of goddesses
    and night-wives laying children by the flame.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:19
  text: Children and cattle are made to walk or creep through tunnelled earth, hollow
    stones, or a cloven tree to prevent or neutralize magic or work homeopathically.
  category: action
  evidence_refs:
  - ev:10
- id: obs:20
  text: The passage cites a canon describing women with crying infants digging and
    perforating earth and drawing the infant through the hole.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:21
  text: Nurses thrust a newborn babe through a hole, and a child slow to learn walking
    is made to crawl under blackberry vines fixed in the soil at both ends.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:22
  text: Sick sheep are made to creep through the cleft of a young oak, and a cited
    prohibition mentions passing livestock through a hollow tree or perforated earth.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:23
  text: Early records mention perforated stones, some called needles' eyes, and the
    author says some may have been placed where esteemed hollow trees had died.
  category: object
  evidence_refs:
  - ev:11
