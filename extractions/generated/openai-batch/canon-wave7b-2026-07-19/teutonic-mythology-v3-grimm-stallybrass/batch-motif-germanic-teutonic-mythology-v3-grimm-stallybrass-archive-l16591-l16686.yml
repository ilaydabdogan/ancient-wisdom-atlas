canonical_text:
  quote: ''
  summary: The passage surveys healing customs involving relics, tombs, sacred woods,
    votive body-part models, dream cures, and the hanging up of limbs, images, diseases,
    and crutches. It contrasts Greek votive offerings made after recovery with German
    pagan limb images hung to obtain relief, notes clerical prohibitions and later
    church acceptance, and compares Greek temple dream healing with medieval saint
    legends.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Legends report many sick pilgrim patients receiving marvelous deliverances
    at saints' tombs; a beast-apologue parodies this with a hare, wolf, and martyred
    hen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that he does not find heathens seeking healing from relics
    or from royal and giant mounds, but says they resorted to sacred woods.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Greece, especially Boeotia, recovered patients set up metal models of the
    affected body part in a temple, and these offerings could later be melted into
    sacred vessels.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gregory's cited passage describes people carving painful body parts in wood
    and hanging them up to an idol expected to help.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Eligius and the Indiculus are cited for prohibiting wooden feet and hands
    placed at cross-roads in a pagan rite.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A woman with a palsied arm is described as being told in a dream to make a
    wax hand and take it to St Ida's tomb.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage distinguishes Greek body-part offerings as acts of gratitude after
    healing from German limb hangings intended to obtain relief.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage links German limb-hanging to wax-image sorcery and to analogical
    offerings, including child figures offered by those wishing for children.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says practices once condemned as pagan were later tolerated by
    the church; pilgrimage sites displayed wooden or wax hands and feet on walls and
    crutches outside the church after healing.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Greek sick persons are said to have slept in a trusted deity's temple and
    received dream instructions for cure; similar dream-cure material is noted in
    medieval legends.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A footnote says diseases could be hung up pictorially, including a crab- or
    toad-like figure understood as the 'ber-mutter' among waxen hands and feet before
    miraculous images.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage raises, but does not decide, the possibility that votive tablets
    with depicted limbs entered Germany through the Romans.
  category: relationship
  evidence_refs:
  - ev:10
