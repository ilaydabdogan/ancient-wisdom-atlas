canonical_text:
  quote: ''
  summary: 'The passage collects learned and folk notices about betony, madalger,
    mangold, and fern: betony is credited with power against bites and serpents; madalger
    root is used with prayer in swine disease; plant names are compared with mythic
    or heroic names; fern is described as repelling the devil, weather dangers, and
    misfortune, and its seed is gathered ritually on St John''s night.'
  language: English with cited Latin, Germanic, Romance, and Slavic plant names
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Betony is said to be put on bites, and serpents enclosed within a circle of
    it are said to kill themselves by lashing or beating themselves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Betony is associated with several names and customs: an Italian proverb recommends
    buying it at any price; Swiss herdsmen bring badonihli or cowslip home from the
    Alp for their sweethearts; the Anglo-Saxon name biscop-wyrt is cited as implying
    sacredness.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Madalger is identified in glosses and herbals with basilicum and senecio,
    and a proverb calls it the honour of all roots.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the Westerrich, when disease breaks out among swine, people chop madalger
    root into the pigs' wash while muttering a short prayer, to keep the schelm from
    attacking the animals.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that the name Madelger is borne by Heime's father in heroic
    legend and by a mermaid's son who puts on a cloak of darkness; the author says
    this makes a mythic significance in the plant-name credible.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The author connects Mangold, lapathum or beet, with an ancient name of a giant-maiden
    who could grind gold.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Fern is described in Hildegard's Physica as a plant whose growing-place, house,
    or location the devil avoids, and where lightning, thunder, and hail rarely fall.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: A herbal says fern is hard to destroy unless stubbed up on the day of John's
    beheading, and that a fern-seed gatherer must go on St John's night before daybreak,
    light a fire, spread cloths or broad leaves beneath, and be bold enough to daunt
    the devil.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Many people fasten fresh fern over the house-door, after which all is said
    to go well as far as the whip on the wagon reaches.
  category: action
  evidence_refs:
  - ev:9
