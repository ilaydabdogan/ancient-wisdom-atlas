  quote: ''
  summary: The passage is an antiquarian and philological discussion of dream interpretation.
    It links words for dream and sleep with ecstasy, trance, and the spirit’s movement
    into the air; notes selective belief in certain significant dreams; identifies
    dream interpreters with soothsayers; and describes dreams as foretokens, runes
    of destiny, and messages from gods or daemonic beings. A fragmentary opening sentence
    mentions wood feared to cause twistings or convulsions.
