canonical_text:
  quote: ''
  summary: The passage surveys Germanic and neighboring terms for gout and related
    illnesses. It notes that shifting or “flying” gout was named as a faring or running
    thing, interpreted as a spiritual-animal being conjured into the body. It adds
    that some names identify the illness with elves or good holds, that such beings
    were imagined as butterflies or worms causing joint pain and swelling, and that
    common people attributed the stubborn disease to witches. The passage also mentions
    hair-related disease names such as Hollenzopf and Wichtelzopf and a spell classifying
    kinds of gout.
  language: English
  quote_policy: summarized
