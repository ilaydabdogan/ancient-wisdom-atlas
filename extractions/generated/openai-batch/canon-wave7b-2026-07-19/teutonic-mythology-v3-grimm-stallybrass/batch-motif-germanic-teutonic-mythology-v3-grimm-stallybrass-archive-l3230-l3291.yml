  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Souls separated from the body are described as passing to another dwelling-place
    and finding rest in hades or heaven.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Other spirits are described as not fully partaking of blessedness and peace,
    hovering between heaven and earth, sometimes returning to their old home, and
    being called spectres or ghosts.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage distinguishes Roman manes as peaceful happy spirits of the dead
    and lemures or larvae as uncanny apparitions, while noting that the terms fluctuate.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says that Roman lares were often understood as manes or souls
    of departed ancestors, and that German superstition includes souls becoming homesprites
    or kobolds.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A note links Christian All-souls’ Day grave-visiting with Roman holidays when
    the underworld opened and the manes ascended.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Esthonians are said to set food for the dead on the night of Nov. 2 and
    to rejoice if any is gone in the morning.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the Fellin district near Dorpat, departed souls are said to be received
    in the bath-room and bathed one after another.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Kurt, a farmer at Hachborn, is said not to quit the farm after death, but
    to help with field and barn work as a good spirit.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: When a strange servant enters the loft and calls for Kurt to throw, Kurt seizes
    him, throws him onto the threshing floor, and breaks his legs.
  category: sequence
  evidence_refs:
  - ev:9
