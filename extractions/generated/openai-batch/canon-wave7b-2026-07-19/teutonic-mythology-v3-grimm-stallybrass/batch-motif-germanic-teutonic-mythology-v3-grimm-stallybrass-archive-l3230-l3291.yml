canonical_text:
  quote: These souls that appear, that come back, that haunt, we call spectres (ghosts).
  summary: The passage first notes norns and wise women as spinning and singing figures,
    then distinguishes rested souls of the dead from restless souls called spectres.
    It compares Roman terms for peaceful and uncanny dead, links ancestor-souls with
    household spirits, and gives examples of calendrical rites for the dead and a
    Hessian tale of Kurt, a dead farmer who remains on his farm as a helping but dangerous
    spirit.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Norns making visitations are described as having spindles and singing while
    spinning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wise women and divine mothers of antiquity are said to be regarded as teachers
