canonical_text:
  quote: ''
  summary: 'The passage describes a breeding-dollar that brings a dragon into the
    house, where it must be treated well or it sets the house on fire; it can only
    be transferred by an informed underpriced sale. Grimm then compares the Christian
    Devil with older giant figures: both are linked with hammer-strikes, large building
    and stone-throwing feats, hostility to churches, soul-bargaining construction,
    and bridge-building legends involving jutuls, huldras, water, and the rising sun.'
  language: English
  quote_policy: summarized
