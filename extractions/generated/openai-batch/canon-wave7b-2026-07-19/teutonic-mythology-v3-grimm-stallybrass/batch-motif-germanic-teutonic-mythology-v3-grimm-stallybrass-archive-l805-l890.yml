canonical_text:
  quote: ''
  summary: 'The passage summarizes and compares several Germanic deities and goddess
    traditions: Wuotan, Donar, Zio/Tius, Froho, Phol/Balder, Loki, Nerthus, Holde,
    Berhte, Frouwa, Frigg, and related female legendary beings. It assigns them domains
    such as heaven, thunder, war, fertility, fire, springs, trickery, motherhood,
    and preserved popular legend.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Donar is said to be heard in curses, possibly to sit in a mountain as Redbeard,
    and to receive common folk, while heroes go to Wuotan's heaven.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes Donar as plebeian, boorish, uncouth, and seemingly more
    primitive, and says he was displaced in some places by a kindred, more comprehensive
    deity.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wuotan is associated with heaven, air, the turning of battle, and the spear;
    Donar is associated with the thunderstorm and the hammer.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Zio or Tius is described as a sky deity, a special god of war, a god of the
    sword, and as seeming to rush down from the sky in tempest form.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Froho is described as a god of hunting, generation, fertility, and summer,
    with a sacred golden-bristled boar and a yearly kingly journey through the lands.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Phol is cautiously treated as likely synonymous with Paltar or Balder and
    is associated with light, fire, tempest, wells, and springs.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says Phol could be perverted into a diabolic being, and Loki,
    representing fire in another aspect, was also suited to stand for the devil.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Loki is associated with artfulness and cunning tricks, whose stories are said
    to have reproduced themselves in all branches of the Germanic race.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Nerthus is named as a mother of gods by Tacitus, and her name is described
    as the counterpart of a Norse god's name.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A group of female beings—Holde, Berhte, Fricke, Harke, Gaue, Stempe, and Trempe—is
    described as almost identical with Nerthus and as living on in legend.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Berhte is connected with medieval poems, Carolingian Berhta, Eddic Biort,
