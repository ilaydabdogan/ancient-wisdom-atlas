  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Charles fought a battle at the foot of the Odenberg; the passage describes
    streaming blood cutting furrows in the ground and red waves running toward Bessa,
    after which Charles won.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the evening after the victory, the rock opened, received Charles and his
    exhausted soldiers, and closed again.
  category: action
  evidence_refs:
  - ev:6
