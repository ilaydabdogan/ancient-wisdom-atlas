canonical_text:
  quote: ''
  summary: The passage describes Hessian traditions associating Charles V or, earlier,
    Charles the Great with the Odenberg and Gudensberg region. A legend recounts Charles
    leading a thirsty army, a snow-white horse opening a spring by striking rock,
    a battle marked by blood-furrows, and Charles with his exhausted soldiery being
    enclosed in the Odenberg. The hidden host periodically emerges, passes the Glisborn
    spring to water its horses, and returns into the mountain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Karle Quintes, identified with Charles V in the passage, is said to be lodged
    with his soldiers in the Odenberg and is used in a Hessian child-stilling warning.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that in earlier times the figure was understood as Charles
    the Great, connected with a thirsting-army legend in the Gudensberg country.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Charles moved his army into the mountains of the Gudensberg country, and his
    warriors became thirsty while the king sat on a snow-white steed.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The horse stamped on the ground, broke away rock, and a bubbling spring came
    out, watering the whole army.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The spring is named Glisborn; local people attribute to its clear cold water
    a cleansing power greater than common water, and women come there to wash linen.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: A stone with a hoof-mark is said to be visible, set into the wall of Gudensberg
