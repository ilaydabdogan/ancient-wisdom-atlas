canonical_text:
  quote: ''
  summary: 'The passage describes ritual rules for gathering herbs, roots, branches,
    and fruits: avoiding cold iron, preventing contact with the ground, sometimes
    using gold or red-hot iron, gathering before sunrise, using the left hand or one
    hand, removing bonds such as belt, shoes, and ring, naming the intended beneficiary
    and purpose, and sometimes not looking back. Examples are cited for aristolochia,
    mistletoe, tamarisk, iris, parthenium, pseudanchusa, thlaspi, nettle, bugloss,
    and other plants used for healing.'
  language: English with Latin citations
  quote_policy: summarized
