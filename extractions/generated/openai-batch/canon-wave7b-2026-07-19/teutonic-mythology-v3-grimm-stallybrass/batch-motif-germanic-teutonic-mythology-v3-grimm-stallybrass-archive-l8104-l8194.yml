canonical_text:
  quote: ''
  summary: The passage gathers folk traditions and comparative notes about the Devil
    receiving black animal offerings, food and drink offerings, candles, and proverbial
    sacrifices; it also discusses beliefs about a devil's bath, the Devil bound until
    Judgment Day, tales in which he is trapped or hammered by a smith, and comparisons
    with other bound supernatural adversaries.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Low Saxon peasant tradition says that someone who goes into the forest on
    Shrove Tuesday and sits under a harrow can see nocturnal events, including beasts
    running through the wood and a king on a car with foxes or possibly sorrel horses
    before him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the shepherd story, the shepherd sits under the harrow, becomes unable
    to crawl out after the devilry is over, and is released only after a coal-black
    sheep is fetched; the Devil takes the sheep and flies up into the air with it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage reports black cocks as sacrifices and specifies that they must
    have no white feather; it also describes conjuring little men of the mountain
    with a new table, dishes of milk and honey, plates, nine knives, and the killing
    of a black hen.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage cites a cock sacrifice in France in which a cock is roasted and
    carried to a pond, glossed by the author as connected with a watersprite.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage lists popular phrases or examples involving giving decorated old
    women, a soul stuck over with may or birch, or a lit candle to the Devil.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that drink-offerings to former heathen gods came to appear
    devilish after conversion, and it notes expressions for the Devil's cup and the
    proverb that leaving something in a glass is sacrificing to the Devil.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says there is ground for belief in a devil's or hell's bath and
    cites expressions in which the Devil's bathroom signifies extreme distress.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says medieval imagination often pictured the Devil as bound in
    hell until Judgment Day, when he would be released and appear with Antichrist;
    his release marks general confusion and the world's destruction.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: One popular tradition has the Devil tightly bound under a table where two
    virgins are spinning; other tales put a bast noose over his head or have a blacksmith
    make him creep through a keyhole into a sack and then hammer him.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The author explicitly connects these bound-Devil pictures with Prometheus,
    Ahriman, and Loki, and also connects the expression that the Devil is loose with
    fire breaking loose and with rubbing fire out of wood to break the Devil's strength.
  category: relationship
  evidence_refs:
  - ev:7
