canonical_text:
  quote: "“this device whereby thou hast locked me out of the whole village”"
  summary: 'The passage collects plague legends and customs: a personified Plague
    is kept out of a village by Niebuhr’s naked circuit with a pot-hook; Swedish and
    Norwegian plague figures use a grater and broom to determine survival or total
    death; a Västergötland story describes the live burial of two beggar children
    to stop plague; and Serbian Kuga traditions portray plague as a veiled woman who
    may be carried, appeased by euphemistic naming, and delayed by household tasks.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A personified Pest tells Niebuhr to leave him in the cart outside the village,
    strip naked, take a pot-hook, run around the homestead with the sun, and bury
    the object under the doorstep.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Niebuhr leaves the Pest in a cart away from the village, runs naked around
    the village with the pot-hanger, and places the iron under a bridge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The village where Niebuhr performed the action is reported to have no pestilence,
    while surrounding villages suffered plague.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author comments that removing the pot-hook from the hearth seems to mean
    leaving the house open, and compares the running round the house or village and
    the undressing with other ritual customs.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: Swedish stories describe the Plague entering from the south as a pretty little
    boy with a grater, followed in another village by a Plague-damsel who sweeps with
    a broom.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the Swedish account, the grater leaves one or two people alive in a house,
    while the Plague-damsel’s broom causes everyone in the village to die.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In Västergötland, two beggar children are fed cake with lard in a pit and
    buried alive as a human sacrifice to stop the digerdod.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Norwegian Pesta is imagined as a pale old woman travelling with a grater and
