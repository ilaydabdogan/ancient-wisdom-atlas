  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: A man rows Pesta over water, asks for fare, is told his quittance is at home,
    and then sickens and dies.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Serbian Kuga is described as a real woman in a white veil who can be carried
