canonical_text:
  quote: ''
  summary: 'The passage describes medieval Germanic presages called aneganc, an-gang,
    widerganc, and widerlouf: the first unexpected encounter at the start of a day,
    journey, or undertaking could signify good or ill and guide whether to proceed.
    It connects this to cautious treatment of beginnings, first entries into houses
    or bridges, a divine or daemonic claim on the first met person, Latin superventa,
    Greek and broader comparative parallels, Tacitus’s notice of Germanic divination
    by birds and horses, and a mythic example of Wodan granting victory to those he
    first sees at sunrise. A fragmentary opening also mentions divination by motions
    of molten lead.'
  language: English with Latin, Greek, and Germanic technical terms
  quote_policy: summarized
