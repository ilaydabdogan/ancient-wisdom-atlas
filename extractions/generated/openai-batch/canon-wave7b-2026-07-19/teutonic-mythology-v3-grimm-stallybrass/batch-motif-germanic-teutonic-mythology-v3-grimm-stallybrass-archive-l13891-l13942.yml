canonical_text:
  quote: ''
  summary: 'The passage catalogs path-crossing and encounter omens: priests or clerics
    met while hunting or early in the day are treated as ill omens; sudden silence
    is explained by a priest, angel, or Hermes passing; the author proposes transfer
    from pagan to Christian religious figures and from wise women to witches; further
    examples include bodily marked persons, walkers, riders, water-bearers, a woman
    handing a sword, and the sight of two warriors as a victory sign.'
  language: English
  quote_policy: summarized
