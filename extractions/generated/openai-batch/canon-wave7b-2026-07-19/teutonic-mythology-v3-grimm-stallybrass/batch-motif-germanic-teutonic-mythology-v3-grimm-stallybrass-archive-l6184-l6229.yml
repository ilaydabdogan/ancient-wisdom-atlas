canonical_text:
  quote: forget not the best !
  summary: A departing visitor hears a warning too late, an iron door closes, the
    place and road vanish, and Grimm discusses recurring legends of a wonderflower
    or key-flower, a key-bearing white woman, hidden treasure, and violent doors that
    injure heels.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A voice sounds as a person departs, warning him not to forget the best; an
    iron door shuts behind him, everything disappears, and the road cannot be found
    again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the same formula appears regularly in legends of the
    Odenberg, the Weser mountains, the Harz, and other cited collections.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The flower is commonly described as blue, though purple and white flowers
    are also mentioned.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The flower is called Schlüsselblume or key-flower because it locks the vault,
    and is also called luck-flower and most often wonderflower.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The key-flower is linked to a key-wearing white woman, described as an old
    mistress and housekeeper who can unlock the treasure.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: When three wonderflowers are named, the passage says this seems to mean three
    flowers on one stalk.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The sudden violent closing of the door is compared with Eddaic and saga phrases
