canonical_text:
  quote: ''
  summary: The passage collects examples of binding and loosening charms, harsh poison
    remedies, healing wells and rock-drippings, maternal milk cures, and saintly relic
    cures. It includes classical childbirth charms, a violent remedy for poisoning,
    sacred springs and serpent imagery, dripping walls or stones that restore lactation,
    and medieval saint-relic materials that heal humans and animals and confer welfare.
  language: English with embedded Latin quotations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Interlaced fingers beside a pregnant woman or a person receiving a remedy
    are described as harmful magic, with Alcmena's childbirth cited as an example.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Crossing or placing limbs around the knees is said to worsen the childbirth
    obstruction.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Difficult births are said to be released if a projectile, stone, or spear
    with specified prior use is passed over the roof without certain conditions being
    broken.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A poisoning remedy is described in which the sufferer is suspended by the
    feet and an eye is pulled out so that venom may escape.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Water, springs, and fire are said to preserve or restore health, especially
    springs that burst from rock at the command of a god or saint.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A snake is described as lying coiled around a holy well or being seen beside
    it, and the passage compares it to the serpent-rod of Aesculapius.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Healing water or oil is said to trickle from rocks and walls.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A walled-in mother nourishes her child through a hole in a wall until she
    dies; afterward a continual dripping at the hole is visited by women whose milk
    has dried up.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Negarina near Verona, a hard rock shaped with female breasts is described
    as perpetually dripping water from its nipples, and washing with that water restores
    milk to a nursing woman.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage also notes a milk-dropping rock and the Lithuanian name Laumes
    papas, or teat, for a hard stone.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Saints' tombs and materials that touch them, including water poured over bones,
    garments, splinters, earth, turf, and dew from graves, are said to heal.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: At St. Oswald's death site, dust or earth mixed with water and wood connected
    with his body are described as healing humans and animals.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: At St. Ceadda's tomb, visitors put a hand through a hole, take dust, mix it
    with water, and give it to infirm humans or animals.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Earconwald's stretcher and chips cut from it are said to heal sick people.
  category: object
  evidence_refs:
  - ev:12
- id: obs:15
  text: Relics are said not only to heal but also to bring fortune, peace, and fruitfulness,
