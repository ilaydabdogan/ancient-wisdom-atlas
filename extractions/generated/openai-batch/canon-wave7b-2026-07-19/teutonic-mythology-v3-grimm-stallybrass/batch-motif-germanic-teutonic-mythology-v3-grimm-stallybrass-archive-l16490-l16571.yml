candidate_motifs:
- id: motif:1
  label: Birth bound by locked body and loosed by weapon or projectile charm
  taxonomy_refs: []
  basis: The passage places clasped fingers and crossed limbs in opposition to childbirth-loosening
    actions involving stones, missiles, and a spear.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The source reports learned and folkloric material together; the passage
    does not give a single named Germanic narrative for this pattern.
- id: motif:2
  label: Violent expulsion of poison by inversion and body opening
  taxonomy_refs: []
  basis: The poisoned sufferer is hung by the feet and loses an eye in the hope that
    venom will leave through the opening.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: Only one example is given, and it is framed as a remedy rather than a
    mythic episode.
- id: motif:3
  label: Sacred water, spring, fire, rock, or wall as healing source
  taxonomy_refs: []
  basis: Water, springs, fire, rock-born springs, and liquid trickling from rocks
    or walls are all described as preserving or restoring health.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The available taxonomy has water and fire as symbols, not as motif families;
    no broader historical claim is made here.
