canonical_text:
  quote: ''
  summary: The passage presents a prophecy of a tree becoming green again, followed
    by discussion of popular disbelief in Emperor Frederick's death and impostors
    claiming to be him. A note gathers dry or withered tree traditions in which a
    guarded tree is linked to sovereignty, Christian ritual, renewed greenness, fruitfulness,
    and conversion, while the author questions whether such traditions moved between
    Western and Eastern contexts.
  language: English with embedded German, Latin, Middle Low German, and Old French
    terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A quoted prophecy says that when the tree becomes green again, good years
    will come, the whole world will stand well, and heathen belief will perish.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that common people disbelieved Emperor Frederick's death
    and expected him to come back.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: One chronicle reports an impostor who claimed to be the former Emperor Frederick
    and tried to prove it with signs and tricks; King Rudolf had him burnt on a pile
    in 1285.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Detmar reports an old man at Lübeck who said he was the exiled Emperor Frederick;
    lads and common people listened to him, honoured him, and heard him promise great
    favour if he returned to his kingdom.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The same Detmar passage says the old man later disappeared and that news later
    came of a similar trickster near the Rhine who deceived people and was burned.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The author notes that the legend may confound Frederick I and Frederick II.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: A cited account of a Tartar temple describes a withered tree standing behind
    walls, locks, and bolts, guarded by men-at-arms.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: In that account, whichever prince can hang his shield on the withered tree
    becomes lord of all the East; the Great Khan is said to have succeeded.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Montevilla is reported to describe a woeful withered oak in the vale of Mambre,
    called Trip or the tree of victory, said to have stood from the beginning of the
    world.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Mambre tree is said to have been green before Our Lord suffered and to
    have withered when God died on the cross.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A prophecy says that a prince from Netherland with many Christians will win
    the lands and have mass sung under the dry tree, after which the tree will grow
    green leaves, be fruitful, and Jews and Heathens will turn Christian.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage says the dry tree is shown great honour and carefully guarded,
    and the author asks whether the tradition is a German interpolation, a Western
    legend transported east, or due to Eastern travel reports.
  category: other
  evidence_refs:
  - ev:8
  - ev:9
