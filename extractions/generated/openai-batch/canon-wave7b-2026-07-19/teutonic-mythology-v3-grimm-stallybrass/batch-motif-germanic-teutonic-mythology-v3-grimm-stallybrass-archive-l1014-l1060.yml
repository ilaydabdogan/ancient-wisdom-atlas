canonical_text:
  quote: ''
  summary: A preface passage surveys Germanic divine names, tribal attributions, gender
    variation in related deity names, regional aliases of a female deity, and westward
    tracing of certain mythological figures and objects, including Isis and a Suevian
    ship.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author conjectures that the Cheruscans had the best claim to Eru while
    also mentioning Swabia and Bavaria in relation to Eru.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The plant name Ziolinta is described as worth taking into account.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sahsnot or Seaxneat is identified as an eponymous deity of the Saxons.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author asks how Paltar and Phol stand to one another in relation to the
    nations devoted to them, and states that Phol seems to point both eastward and
    westward.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage identifies change of gender in the same divine name among different
    tribes as an important distinction.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Goths and Saxons are said to have preferred the god, High Germans the goddess,
    while the North honors both Freyr and Freyja.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The North is said to know only the god NiorSr, while Germans on the opposite
    side of the Baltic are said to know only the goddess Nerthus.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The relation of Zio to Zisa, and perhaps Isis, is said to require further
    explanation.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says that numerous aliases of a female deity are likely due to
    differences of race, naming Holda and Berhta in different regions and mentioning
    a male Berhtold.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that Lower Germany shows no trace of either Holda or Berhta,
    but that Dame Freke appears in the Mark and Dame Gaue haunts Mecklenburg between
    Elbe and Weser.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Holda as Huldana is said to have extended westward to the Rhine and possibly
    the Netherlands, while Berhta Pedauca and the Eddaic Biort are said to indicate
    a similar extension of Berhta's worship.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The author urges attention to a westward movement of nations and says Isis
    and her Suevian ship were traced as far as the Ardennes.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage closes by saying that other portions of mythology must also be
    considered, including heaven-related terms and the change from Himil to Gimill.
  category: other
  evidence_refs:
  - ev:9
