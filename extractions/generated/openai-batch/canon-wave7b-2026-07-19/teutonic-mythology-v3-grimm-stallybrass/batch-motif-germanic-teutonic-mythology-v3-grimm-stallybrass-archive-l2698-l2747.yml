canonical_text:
  quote: ''
  summary: 'The passage introduces figures associated with poetry and recounts the
    Eddic myth of poetry''s origin: the Aesir and Vanir seal peace by placing spittle
    in a vessel; the gods shape the wise Kvasir from the token; two dwarfs kill him
    and mix his blood with honey to make a mead that grants poetry and wisdom; the
    mead passes to Suttungr and is guarded by his daughter; Odin begins an effort
    to recover it.'
  language: English
  quote_policy: summarized
