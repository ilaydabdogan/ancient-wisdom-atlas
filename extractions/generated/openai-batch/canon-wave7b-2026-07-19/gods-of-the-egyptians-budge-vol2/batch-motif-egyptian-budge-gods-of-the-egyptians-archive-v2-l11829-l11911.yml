canonical_text:
  quote: ''
  summary: Isis responds to a noble lady whose son has been stung and is without breath.
    She uses words of power, taught by divine instruction, to command poison and stinging
    creatures to fall away. The passage states that the child lives and the poison
    dies, links the cure to Horus and similar sufferers, describes the extinguishing
    of fire in the noble lady's house, and ends with Isis protecting her son Horus
    after the gods call her to him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman who had not opened her doors to Isis laments because she does not
    know whether her son will live; Isis says her own heart is sad for the child and
    wishes to restore him to life.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Isis tells the noble lady that her speech has protective power and life, and
    that she can drive evil out of the woman's son by an utterance taught by her father.
  category: speech
  evidence_refs:
