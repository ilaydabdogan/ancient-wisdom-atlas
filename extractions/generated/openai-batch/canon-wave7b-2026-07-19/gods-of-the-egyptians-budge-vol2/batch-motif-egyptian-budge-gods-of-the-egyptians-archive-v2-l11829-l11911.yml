- id: obs:3
  text: Isis lays her hands on the child described as being without breath in order
    to restore him to life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Isis commands the poison of named beings to come forth, appear on the ground,
    not enter, and not rise up; she also orders stinging reptiles to listen and fall
    down.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
