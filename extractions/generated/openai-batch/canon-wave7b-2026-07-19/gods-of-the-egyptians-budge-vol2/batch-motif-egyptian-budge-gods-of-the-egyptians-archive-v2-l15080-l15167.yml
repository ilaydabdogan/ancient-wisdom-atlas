  quote: ''
  summary: The passage describes Nephthys as the faithful sister and helper of Isis,
    a friend of the deceased, and a protector and restorer of Osiris. It summarizes
    her iconography, titles, cult centers, Book of the Dead scenes, magical powers,
    identifications with Hathor and other forms, her role as nursing mother in a rebirth
    setting, and Plutarch's report linking her with territorial limits and Nile overflow.
  language: English
  quote_policy: summarized
