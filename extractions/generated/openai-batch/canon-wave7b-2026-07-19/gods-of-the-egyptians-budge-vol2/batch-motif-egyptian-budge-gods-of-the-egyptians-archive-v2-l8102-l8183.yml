canonical_text:
  quote: ''
  summary: A hymn praises Osiris, describes his divine birth, inherited sovereignty,
    royal crowns and regalia, and the fear and offerings accorded to him. It then
    addresses him as a holy god associated with solar boats and several sacred localities.
    A speaker approaches the Lord of Maati, names the forty-two gods in the Hall of
    Maati, refers to a day when human lives are accounted, recites denials of wrongdoing,
    and declares ritual purity with reference to the Bennu and the god of winds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The lords of all lands praise Osiris in comparison with praise of Ra when
    Ra rises at the beginning of each day.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Osiris is said to receive sovereignty from his father Seb, and Mut is named
    as his mother who brought him forth as first-born of five gods and fashioned his
    members.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Osiris is described as established as king, wearing the white crown, holding
    the crook and whip, and having been crowned lord of the two lands while still
    in the womb.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gods come to Osiris bowing low, fear him, retreat when they see him, and
    offerings of meat and drink are presented before him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Osiris is addressed as a holy, mighty, beneficent god and Prince of eternity
    who dwells in the Sektet Boat and has risings in the Atet Boat.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Praise of Osiris is said to occur in heaven and on earth, and his soul, terror,
    visible emblems, and transformations are associated with named places.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: A first-person speaker comes to the Lord of Maati, says he knows the deity
    and his name, and says he knows the names of the forty-two gods in the Hall of
    Maati.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The forty-two gods are described as existing with the addressed deity in the
    Hall of Maati, acting as warders of sinners, and feeding on sinners' blood on
    the day when human lives are taken into account before Un-nefer.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The speaker says he has brought Maat to the deity, destroyed wickedness, and
    not done evil to mankind or his family.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The speaker denies acts including oppression, harming servants, causing pain
    or hunger, murder, temple theft, theft of offerings, fornication, pollution in
    holy places, fraudulent measures, land encroachment, and cheating with scales.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The speaker denies taking milk from children, driving cattle from pastures,
    snaring divine-preserve birds, obstructing water, cutting a canal of running water,
    extinguishing a fire when it should burn, violating offering seasons, and repulsing
    God in his manifestations.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The speaker declares purity four times and compares his purity with the great
    Bennu in Suten-henen, then identifies himself as the nose of the god of winds
    who makes mankind live.
  category: speech
  evidence_refs:
  - ev:7
