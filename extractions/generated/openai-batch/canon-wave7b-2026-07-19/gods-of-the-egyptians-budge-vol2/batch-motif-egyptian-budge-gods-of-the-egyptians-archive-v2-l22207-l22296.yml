canonical_text:
  quote: ''
  summary: The passage describes the sacred crocodile at Crocodilopolis/Arsinoe and
    its feeding by priests, then summarizes iconography and theological roles of Sebek/Sebek-Ra
    as crocodile deity, destructive animal, solar form, helper of Horus, helper of
    the dead, opener of heavenly ways, and creator-form associated with the sun.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Crocodilopolis, also called Arsinoe in Strabo's day, is described as a famous
    center of crocodile worship.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sacred crocodile was kept apart in a lake, was called Suchos, and was
    said to be tame and gentle toward the priests.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Visitors brought food and drink offerings, and priests opened the crocodile's
    mouth and placed or poured the offerings into it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After being fed, the crocodile leaped into the lake and crossed to the other
    side; the same feeding procedure was repeated for another stranger's offering.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Sebek is described in Egyptian pictures and reliefs as a crocodile-headed
    man with solar or horned headgear, and also sometimes simply as a crocodile.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that Sebek's exact early attributes are unknown, but probably
    included those of an evil and destructive animal.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Before the end of the Sixth Dynasty, Sebek is said to have been identified
    with Ra, with a form of Ra connected to Neith, and with Set.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Brugsch's view is reported that Sebek was a four-fold deity representing Ra,
    Shu, Seb, and Osiris; the passage links this to Book of the Dead vignettes where
    the deceased repulses four crocodiles.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: A reported etymological interpretation derives Sebek's name from a root meaning
    to collect or bring together, with Sebek gathering what Set separated and giving
    new life to elements severed by death.
  category: other
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage cautions that this etymological and reconstituting interpretation
    cannot be very old, but states that Sebek was believed to be good to the dead.
  category: other
  evidence_refs:
  - ev:4
- id: obs:11
  text: In the Book of the Dead summary, Sebek, Temu, and Hathor are called Spirits
    of the West, and Sebek dwells in a temple on the Mount of the Sunrise.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Sebek is said to assist Horus to be re-born daily.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: In the Pyramid Texts summary, Sebek restores the deceased's eyes, makes firm
    the mouth, gives use of the head, brings Isis and Nephthys, assists against Set,
    opens heaven's doors, leads the deceased on heavenly ways, and helps the dead
    rise to new life.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Ombos is named as a center of Sebek's cult, where he is described as father
    of Heru-ur and given royal and divine titles.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:15
  text: As Sebek-Ra-Temu, Sebek is described as the power of the sun that created
    the world and as a green disk proceeding from Nu.
  category: attribute
  evidence_refs:
  - ev:8
