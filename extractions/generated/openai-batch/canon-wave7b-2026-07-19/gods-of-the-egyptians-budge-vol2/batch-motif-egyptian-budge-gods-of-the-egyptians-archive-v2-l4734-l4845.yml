canonical_text:
  quote: ''
  summary: The passage summarizes divine production accounts and iconography for Shu
    and Tefnut. It quotes a deity addressed as the One God who formed himself into
    two gods, created the Egg, and produced the Twin-Gods; compares this with Hu and
    Sa arising from Ra's blood; describes Shu as a feathered male deity of space,
    light, and sky-support; describes Tefnut with solar, serpent, and lioness imagery;
    and cites an Edfu text in which Tauith emits Shu from his mouth and Shu supports
    heaven.
  language: English
  quote_policy: summarized
