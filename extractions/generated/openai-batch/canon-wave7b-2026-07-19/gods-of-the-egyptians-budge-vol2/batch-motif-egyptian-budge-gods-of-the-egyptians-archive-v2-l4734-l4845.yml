  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: A described scene shows Shu rising from behind the earth with the solar disk
    on his head and his hands supporting the object on which it rests.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: An Edfu text says Tauith emitted Shu, that Shu came forth from Tauith's mouth,
