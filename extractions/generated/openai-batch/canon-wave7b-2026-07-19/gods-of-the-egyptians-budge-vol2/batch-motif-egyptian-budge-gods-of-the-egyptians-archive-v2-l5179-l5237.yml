  summary: The passage describes Seb and Nut with Shu standing between them, supporting
    the starry sky-form of Nut and separating her from Seb to form earth and sky.
    It also describes Seb’s royal, creative, elemental, gatekeeping, underworld, and
    thunder-producing attributes, and compares him with elemental gods and the Akeru
    lion pair connected with the sun’s night passage through the earth.
