- id: motif:2
  label: Kingship passes from dead divine father to son
  taxonomy_refs:
  - royal_legitimacy
  - divine_parent_child
  basis: Osiris is crowned lord, dies leaving the throne vacant, and his son Horus
    assumes his father's throne.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage summarizes the succession briefly and does not narrate the
    full Horus-Osiris cycle.
- id: motif:3
  label: Divine destruction of disrespectful mankind
  taxonomy_refs:
  - divine_judgment
  basis: Ra orders Sekhet to destroy mankind because they mocked him and spoke lightly
    of his age.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage only gives the departure point and cause, not the full destruction
    episode.
