    saying he was regarded as a form of Khnemu and that, as a solar god, many titles
    of Ra were bestowed on him.
  claim_level: same_function
  target: Khnemu and Ra within Egyptian theology
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal theological identification reported by the source;
    the passage does not establish historical origin or development of the assimilation.
