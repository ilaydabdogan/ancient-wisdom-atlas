canonical_text:
  quote: as soon as Ra rose he separated the earth from the sky
  summary: The passage describes Henen-su/Herakleopolis as a mythic place of creation,
    royal succession, divine conflict, Osirian afterlife geography, and local theology.
    It recounts actions of Ra, Osiris, Horus, Sekhet, Set, and Shu; names the Great
    Bennu, the Crusher of Bones, mythological lakes, an Osiris sanctuary, a region
    and lake of fire, and a heart-devouring guardian; and concludes by describing
    Her-shef as a local solar god regarded as a form of Khnemu and assimilated to
    Ra.
  language: English
  quote_policy: quoted
