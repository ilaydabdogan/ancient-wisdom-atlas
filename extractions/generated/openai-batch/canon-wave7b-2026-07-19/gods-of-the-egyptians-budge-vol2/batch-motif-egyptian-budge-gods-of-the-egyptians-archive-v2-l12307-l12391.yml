  summary: The passage describes the spread and Roman worship of Isis and Serapis,
    including syncretic identifications with Greek and Roman deities, mystery-cult
    features, ascetic practices, expectations of future life, Roman temple history,
    and festival rites involving the unveiling of Isis's image, prayer, sistra, sacrifice,
    incense, and a vessel of holy Nile water.
  language: English
