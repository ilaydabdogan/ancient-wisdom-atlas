canonical_text:
  quote: ''
  summary: A hymn addresses Osiris as a cosmic and royal deity who brings waters,
    wind, air, light, order, and sovereignty. Gods, stars, lands, and mankind praise
    him. He is described as heir of Seb, son of Nut, establisher of Maat, victor over
    enemies, and ruler of the two lands. Isis protects and seeks him, uses words of
    power, laments at his bier, stirs him from inactivity, draws his seed, produces
    and nurses Horus in secrecy. The gods and assessors of Maat gather at Horus's
    coming, and Horus receives rank and sovereignty through Maat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The addressed deity brings waters from the abyss of heaven, the north wind,
    air for the nostrils, and produces light for divine food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The height of heaven, starry gods, heavenly pylons, imperishable stars, and
    offerings are placed in relation to the addressed deity.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The company of gods, starry gods of the Underworld, the earth's ends, and
    heaven's bounds bow, prostrate themselves, or supplicate before the addressed
    deity.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The two lands, all mankind, and festival celebrants praise and make offerings
    to the addressed deity.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Osiris is called stablisher of Maat and is said to place his son upon the
    great throne of his father Seb; he is also linked to his mother Nut.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Osiris is said to cast down Seba, slay his enemy, and put fear in his foe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Osiris is called heir of Seb and of the sovereignty of the two lands, and
    he is commanded to lead the two lands until the end of time.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The earth, its waters, air, vegetation, cattle, birds, fishes, reptiles, and
    four-footed beasts are said to be made in Osiris's hand.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Osiris rises in the horizon, gives light through darkness, spreads light from
    his plumes, floods the two lands with light like the Disk at sunrise, and has
    a crown that pierces heaven.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Isis, identified as Osiris's sister and avenger, protects him, drives away
    foes, wards off evil, and utters effective words of power.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Isis seeks Osiris without weariness, travels through the land in sorrow until
    finding him, makes light with her feathers, makes air with her wings, and laments
    at his bier.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Isis stirs Osiris from inactivity, draws seed from him, makes an heir, suckles
    the babe in solitude, and rears him in an unknown place.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The company of gods rejoices at the coming of Horus, son of Osiris, son of
    Isis, and heir of Osiris; Horus is described as having a stable heart and effective
    word.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The assessors of Maat, the company of gods, Neb-er-tcher, and the lords of
    Maat gather with Horus; those who repulse faults rejoice to bestow rank and sovereignty,
    and Horus's voice has the power of Maat.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
