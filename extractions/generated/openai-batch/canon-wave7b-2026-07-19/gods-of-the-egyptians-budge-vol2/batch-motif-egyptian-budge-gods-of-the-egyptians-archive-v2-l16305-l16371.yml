  summary: The passage identifies Baal-Sephon in relation to cities or districts on
    Egypt’s borders and in Northern Phoenicia, notes an Esarhaddon inscription in
    which Baal-Sephon and other Phoenician gods are invoked in curses against ships,
    and describes Baal Sameme, Baal Malagi, and Baal-Sephon as “gods across the river.”
    It then introduces the Syrian god Reshpu from a British Museum stele, describes
    his Syrian popularity and war-god status, reports a comparison with Greek Apollo
    Amyclaeus, and lists Egyptian epithets for Reshpu as a great god, lord of eternity,
    lord of heaven, and governor of gods.
