  category: attribute
  evidence_refs:
  - ev:10
- id: obs:16
  text: The passage states that the distinction between Day-sky and Night-sky was
    later forgotten in speech but preserved in some funeral texts in writing.
  category: sequence
  evidence_refs:
  - ev:11
