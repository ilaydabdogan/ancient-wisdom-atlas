canonical_text:
  quote: ''
  summary: The passage describes lion figures marking temporal and directional thresholds,
    Seb's afterlife aid to the deceased, a Book of the Dead allusion in which Osiris
    shuts in Seb and Nut on a day of great slaughter, Brugsch's interpretation involving
    Ra's self-mutilation and the blood-born Ammiu gods, and Nut's genealogy and identity
    as sky goddess, day-sky, mother of celestial bodies, and counterpart to distinct
    night-sky figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two lion heads mark the entrance and exit of a passage; one is associated
    with evening and west, and the other with morning and east. Later each head is
    given a separate body and named Sef, “Yesterday,” and Tuau, “To-day.”
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Seb is described as god of the earth who also guides the deceased in heaven
    and provides meat and drink.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The deceased asks Seb for the same protection and help that Seb gave to Osiris,
    his son.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A caption describes Shu supporting the boat of the Sun-god beneath the sky-goddess
    Nut.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two Book of the Dead passages have the deceased speak as Osiris, saying that
    he shut in his father Seb together with his mother Nut on the day of the great
    slaughter.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Budge states that the word translated “slaughter” is shdt and that Brugsch
    understood the passage as referring to Ra’s self-mutilation.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Ammiu gods are said to have sprung from drops of blood that fell from
    Ra after the mutilation.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Budge reports Brugsch’s comparison between Osiris shutting in Seb and Kronos
    punishing Uranus, and between the Ammiu gods’ origin and that of the Erinnyes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Nut is described as daughter of Shu and Tefnut, wife of Seb, and mother of
    Osiris, Isis, Set, and Nephthys.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Nut personifies the heavens and sky, the cloud-forming region, and the region
    in which the sun rises and travels from east to west.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Pyramid Texts present Nut as the regular female counterpart of Seb, who
    is called the “Bull of Nut,” and one cited line says that Nut brought forth her
    daughter Venus.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Nut is identified as the Day-sky resting on the mountains Bakhau and Manu,
    the mountains of sunrise and sunset.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: A caption describes Nut giving birth to the Sun, whose rays fall on Hathor
    in the horizon.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Pyramid Texts also indicate a personification of the Night-sky distinct
    from Seb and Nut; the figures Nau and Naut are mentioned and treated as one god
    in one passage.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: Naut is interpreted in the passage as representing the Night-sky because her
    name uses an inverted sky determinative; another cited line refers to the star
