comparison_claims:
- id: claim:1
  claim: Budge reports Brugsch’s comparison between Osiris shutting in his father
    Seb and the punishment Kronos inflicted on Uranus.
  claim_level: same_function
  target: Greek mythic pattern of Kronos punishing Uranus
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage presents this as Brugsch’s scholarly comparison; it does
    not demonstrate historical contact or full narrative equivalence, and Budge says
    the Egyptian myth is otherwise unknown.
- id: claim:2
  claim: Budge reports Brugsch’s comparison between the Ammiu gods springing from
    Ra’s blood and the origin of the Erinnyes.
  claim_level: same_motif
  target: Greek tradition of the Erinnyes arising from blood after Uranus’s punishment
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is explicitly reported but remains a similarity claim
    only; no historical relationship is established in the passage.
