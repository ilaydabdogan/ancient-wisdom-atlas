canonical_text:
  quote: ''
  summary: A hymn and litany address Osiris/Un-Nefer as a powerful underworld and
    royal deity, associated with Maat, the Nile, the boat, divine parentage, mortuary
    offerings, Horus’s vengeance, the coming of Osiris’s ka, opened ways, and solar
    attributes shared with Ra. The deceased asks Osiris for a peaceful path and asserts
    truthfulness.
  language: English
  quote_policy: summarized
