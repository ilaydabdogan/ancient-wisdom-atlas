canonical_text:
  quote: "“I am Yesterday, and I am To-day; and I have the power to be born a second
    time.”"
  summary: The passage summarizes Budge’s account of Osiris as an ancient Egyptian
    god of the dead who was assumed to have lived in human form, died, acquired renewed
    life in a new body, ruled a realm of the dead, and admitted properly prepared
    persons who had lived correctly. It also discusses the Pyramid Texts, the Heliopolitan
    theological system, early dynastic centers of Osiris worship at Abydos and Tettu/Mendes,
    a Book of the Dead passage naming divine figures and spirits, and a plaque scene
    of a king dancing before a deity.
  language: English
  quote_policy: quoted
