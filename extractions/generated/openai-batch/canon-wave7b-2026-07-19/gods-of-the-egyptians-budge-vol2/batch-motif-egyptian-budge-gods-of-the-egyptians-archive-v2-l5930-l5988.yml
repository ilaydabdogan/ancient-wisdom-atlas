  summary: The passage describes Nut as a protective goddess associated with coffin
    imagery, celestial water and air, and invocations from the text of Pepi I. She
    protects the deceased, is addressed as possessing the Two Eyes, Horus, and Set,
    is asked to decree Pepi's continued life, and restores bodily parts and movement
    after giving protection.
