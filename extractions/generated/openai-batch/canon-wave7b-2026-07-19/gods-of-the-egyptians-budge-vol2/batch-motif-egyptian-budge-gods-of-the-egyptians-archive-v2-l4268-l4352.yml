canonical_text:
  quote: ''
  summary: The passage gives the closing portion of a hymn to Aten, in which life
    depends on Aten's presence in the sky, work ceases when he sets, and the earth
    is founded and raised for his son. Budge then comments that the Aten hymn omits
    many features found in hymns to Ra, including enemies, named fiends, associated
    deities, and solar boats. The commentary describes Aten as eternal, self-existent,
    creator and sustainer of all life, and interprets Aten worship as monotheistic.
    It also describes daily worship with incense, hymns, music, fruit and flower offerings,
    bloodless altars, bright temple surroundings, lively mural painting, and innovations
    in light and shade.
  language: English
  quote_policy: summarized
