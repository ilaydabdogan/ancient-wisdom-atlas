canonical_text:
  quote: "“grant thou that I may have peace in the Tuat”"
  summary: The passage gives part of a ritual address to Amen involving hidden or
    magical names, a request for understanding, peace, and bodily integrity in the
    underworld, and a reply from the divine Soul in Nut promising protection. Budge
    then explains a rubric for reciting the text over a blue figure of Amen as the
    god of the lifted hand; correct performance lets the deceased drink pure water
    from the celestial stream in the underworld and become like the stars. The passage
    continues with scholarly comments on the non-Egyptian appearance of some names,
    the place of these chapters in the Saite Recension of the Book of the Dead, the
    syncretic identification of Amen-Ra with other gods, and the spread of Amen-Ra
    worship into Egypt’s regions, Nubia, Syria, and the oases.
  language: English
  quote_policy: quoted
