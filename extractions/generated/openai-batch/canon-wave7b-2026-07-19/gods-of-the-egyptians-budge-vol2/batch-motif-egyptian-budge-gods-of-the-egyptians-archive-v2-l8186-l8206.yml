canonical_text:
  quote: ''
  summary: A hymn passage states that the Eye of Ra is full in Annu at the end of
    the second month of Pert, in the presence of the divine lord of the earth. The
    speaker says they have seen the Eye of Ra full in Annu and asks that no evil befall
    them in the land or in the Hall of Maati, because they know the names of the gods
    there, who are followers of the great god. A note explains Pert as the Season
    of Growing and identifies the second month of Pert as the sixth month of the Egyptian
    year.
