canonical_text:
  quote: a child in the morning, an old man in the evening
  summary: The passage describes Khensu's worship centers and Theban shrines; his
    composite forms with Thoth, Ra, and Shu; child and lunar forms connected with
    crescent light, fertility, and renewal; genealogical identifications with Amen,
    Nubit, Osiris, and Isis; and monument iconography including disks, uraeus, youth-lock,
    eyes, ears, and crocodiles.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Khensu is said to have been worshipped at several named places, including
    Shentu, Nubit or Ombos, Behutet or Edfu, Sma-Behutet, and Khemennu or Hermopolis.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Khemennu he was called Khensu-Tehuti, described as twice great and lord
    of Khemennu, and the passage says this proves a late identification with Thoth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Thebes his name was united with those of Ra and Shu in forms such as Khensu-Ra
    and Khensu-Shu.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The great temple of Khensu at Thebes is described as probably containing three
    shrines corresponding to three aspects of the god.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Khensu-pa-khart, translated as Khensu the Babe, and Khensu-Hunnu, translated
    as Khensu the Child, are described as forms of the Moon-god.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: In temple inscriptions Khensu is called lord of Maat and moon by night; the
    new moon is likened to a mighty or fiery bull, and the full moon to an emasculated
    bull.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: As Khensu-pa-khart, he causes the crescent moon's light to shine, women to
    conceive, cattle to become fertile, the germ to grow in the egg, and nostrils
    and throats to be filled with fresh air.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: He is described as the second great light in the heavens, the first great
    son of Amen, the son of the goddess Nubit, a child in the morning, an old man
    in the evening, and one who renews his births like the Disk.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage interprets Khensu-pa-khart as spring sun, spring moon, beginning-of-month
    moon, renewed light of sun and moon, and source of generation and reproduction.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: As a Horus god, he is described as son of Osiris and of a form of Isis; as
    Bull of his mother, he is identified with Amsu-Ra and regarded as brother of the
    Bull Osiris.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage reports that the two Bulls in late-period texts are Osiris and
    Khensu and that they represent the Sun and the Moon.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: On monuments Khensu may appear standing or seated on a throne with a man's
    body and hawk head, or sometimes with a human head.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: His headdresses include the lunar disk in a crescent, the solar disk with
    a uraeus, and the solar disk with plumes and a uraeus.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: As Khensu Nefer-hetep on the stele of Pai he appears as a mummied man seated
    on a throne with a royal uraeus, a lock of youth, a mendt, a Hathor collar, and
    objects in his hands; the stele has two pairs of ears and two pairs of eyes behind
    his back.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: A caption identifies a depiction as the dual God Khensu standing upon crocodiles.
  category: action
  evidence_refs:
  - ev:8
