candidate_motifs:
- id: motif:1
  label: cyclical renewal of celestial light
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage describes Khensu-pa-khart as child in the morning, old man in
    the evening, youth at the beginning of the year, returning as a child after infirmity,
    and renewing births like the Disk; Budge then summarizes him as renewed light
    of sun and moon.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage frames this as solar and lunar renewal, not as a full death-and-rebirth
    narrative.
- id: motif:2
  label: celestial fertility through crescent light
  taxonomy_refs:
  - sacred_birth
  basis: Khensu-pa-khart's crescent moon light is linked to women's conception, cattle
    fertility, the germ growing in the egg, and generation and reproduction.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: The passage emphasizes fertility and generation broadly; it does not narrate
    a specific sacred birth episode.
- id: motif:3
  label: divine parent-child relationship
  taxonomy_refs:
  - divine_parent_child
  basis: The passage names Khensu or Khensu-pa-khart as son of Amen and Nubit, and
    in another aspect as son of Osiris and a form of Isis.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The parentage varies by aspect or identification; it should not be flattened
    into a single genealogy without review.
- id: motif:4
  label: sun-moon duality in paired bulls
  taxonomy_refs:
  - duality
  basis: The passage reports that Osiris and Khensu are the two Bulls and that they
    represent the Sun and the Moon.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The claim is reported through Brugsch's interpretation of late-period
    texts.
- id: motif:5
  label: multiple divine aspects housed in temple shrines
  taxonomy_refs: []
  basis: The Theban temple is described as probably containing three shrines corresponding
    to three aspects of Khensu.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage says the correspondence is probable, not certain, and no supplied
    taxonomy family directly matches this pattern.
comparison_claims:
- id: claim:1
  claim: The passage explicitly says Khensu-pa-khart and Khensu-Hunnu bore the same
    relation to the Moon-god that Heru-pa-khart and Hera-Hunnu bore to Horus the Great
    or Ra.
  claim_level: same_function
  target: Heru-pa-khart and Hera-Hunnu in relation to Horus the Great or Ra
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal comparison within the passage, not evidence for
    historical derivation.
- id: claim:2
  claim: The passage states that Khensu-pa-khart was readily identified with young
    Sun-god forms such as Horus or Ra and with reproduction gods such as Amsu or Min.
  claim_level: same_function
  target: young Sun-god forms Horus/Ra and reproduction gods Amsu/Min
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: This is Budge's interpretive summary of identifications rather than
    a fully quoted primary text.
- id: claim:3
  claim: The passage reports Brugsch's claim that the late-period two Bulls are Osiris
    and Khensu, representing the Sun and the Moon.
  claim_level: same_function
  target: late-period two Bulls pattern of Osiris and Khensu
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is presented through a secondary scholarly report and
    needs review against the underlying late-period texts.
