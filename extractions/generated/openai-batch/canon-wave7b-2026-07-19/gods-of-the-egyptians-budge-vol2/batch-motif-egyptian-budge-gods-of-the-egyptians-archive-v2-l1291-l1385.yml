canonical_text:
  quote: ''
  summary: 'The passage describes multiple iconographic forms of Amen-Ra: hawk-headed,
    man-headed, ram-headed, ithyphallic, crocodile-headed, goose-shaped, and a late
    composite bronze form. It notes solar disks, serpents or uraei, plumes, horns,
    lotus flowers, persea trees, an anthropomorphic ankh offering flowers, fertility
    attributes, animal attributes, and an interpretation that the composite form represents
    the company of gods contained in Amen.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Amen-Ra is described with a hawk head or a human head, each surmounted by
    a solar disk encircled by a serpent.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before Amen-Ra is an ankh-sign with human legs and arms offering lotus flowers
    to the god.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that in this form Amen-Ra becomes the god both of Heliopolis
    and Thebes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Amen-Ra is often shown with the head of a ram and usually wears the solar
    disk, plumes, and uraeus, though sometimes he wears fewer of these elements.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Titles in the passage call Amen-Ra lord of the thrones of the two lands, dweller
    in Thebes, a great god appearing in the horizon, and governor of Ta-Kenset or
    Nubia.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A caption in the passage names Heru-sa-atep, king of Ethiopia, as adoring
    Amen-Ra.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Another form of Amen-Ra has the body of the ithyphallic god Amsu, Min, or
    Khem and is described as the personification of the power of generation.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the ithyphallic form, Amen-Ra wears either disk and plumes or the united
    crowns of South and North and has one arm raised to support a sign above his shoulder.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The ithyphallic form is called Amen-Ra, the bull of his mother, and is said
    to possess the attributes of the god of the lifted hand.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: One example shows ithyphallic Amen-Ra beside a pylon-shaped building topped
    by two trees and a large lotus flower.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: The lotus flower is said to represent the rising sun, which was supposed to
    issue daily from between two persea trees.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: Another form gives Amen-Ra the head of a crocodile and a crown composed of
    solar disk, plumes, and horns.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: The crocodile-headed form is called the disposer of the life of Ra and of
    the years of Temu.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: Amen-Ra is sometimes represented as a goose, while the ram is identified as
    sacred to him in many parts of Egypt and throughout Nubia.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: Late bronze figures of Amen-Ra combine a bearded human head, beetle body,
    hawk wings, human legs, lion toes and claws, four hands and arms, and four extended
    wings.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:16
  text: In the composite bronze form, one hand grasps symbols and two knives, another
    supports a sign in the manner of the god of the lifted hand, a third holds the
    symbol of generation and fertility, and the fourth is lifted to the head.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: The face of the composite god is described as the solar disk, from which proceed
    the heads and necks of eight rams.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:18
  text: The composite form has ram horns with disks, the two plumes of Amen, and lion-headed
    uraei projecting from the plumes and ejecting moisture from their mouths.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:19
  text: The passage states that the underlying idea of the composite figure is to
