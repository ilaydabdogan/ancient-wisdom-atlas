  summary: The passage discusses a Hemaka plaque scene interpreted as King Semti dancing
    before Osiris, who is shown as a crowned deity seated in a shrine on steps, with
    a ceremonial Hennu Boat below. It connects Osiris with the White Crown, Abydos,
    Amenti, and the title Khent-Amenti, then summarizes Pyramid Text descriptions
    of the blessed dead receiving food, drink, garments, washing, and boat travel
    in the afterlife under Osirian auspices.
