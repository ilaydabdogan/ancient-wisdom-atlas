    his body is carried away and dismembered, and Isis uses Thoth-given words of power
    to restore him, unite with him, and conceive Horus. It also notes Pyramid Text
    allusions in which the deceased breathes the breath of Isis, travels with her
    in the Matet Boat, and is called the son of Isis and Nephthys.
