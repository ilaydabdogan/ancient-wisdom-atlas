  quote: ''
  summary: A fragment from the 'Sorrows of Isis' refers to a house, incense trees,
    Annu, and the House of Net. A figure called the brother of the Abt Fish and disposer
    of what is to be is said to be nursed by a cat. Rert, Hat, and Bes protect the
    addressee's limbs; the addressee's head will not fall before a hostile one, and
    the fire of the addressee's poison will not conquer the limbs.
