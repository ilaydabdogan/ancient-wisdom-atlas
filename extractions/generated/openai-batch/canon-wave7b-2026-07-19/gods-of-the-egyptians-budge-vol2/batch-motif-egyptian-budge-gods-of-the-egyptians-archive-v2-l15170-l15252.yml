canonical_text:
  quote: Nephthys is not a goddess with well-defined characteristics, but she may,
    generally speaking, be described as the goddess of the death which is not eternal.
  summary: The passage discusses Plutarch's explanations of Nephthys, her relation
    to Osiris, Typho, Isis, Horus, and Anubis, the iconography of the sistrum with
    a lunar cat and the faces of Isis and Nephthys, and Budge's interpretation of
    Nephthys as darkness, death, and the paired opposite of Isis. It then cites a
    Book of the Dead passage in which Isis and Nephthys are identified with plumes
    on the head of Amsu/Horus and function as protectors, supporting the claim that
    Nephthys is linked with life emerging from death.
  language: English
  quote_policy: quoted
