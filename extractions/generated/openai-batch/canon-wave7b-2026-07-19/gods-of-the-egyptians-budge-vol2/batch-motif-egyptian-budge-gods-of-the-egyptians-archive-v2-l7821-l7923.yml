canonical_text:
  quote: ''
  summary: The passage contains hymnic praise of Osiris Un-nefer. It asks that a soul
    may enter and leave Re-stau, be accepted in the Underworld, receive offerings,
    and breathe the north wind. Osiris is praised as eternal lord, child of Nut and
    Seb, holder of royal crowns and regalia, ruler of the world and Underworld, and
    father whose throne is occupied by Horus. Isis embraces Osiris and drives fiends
    from his paths. The dead rise, breathe air, and see Osiris when the disk rises
    on the horizon. The passage also names the Acacia Tree and the Seker Boat.
  language: English
  quote_policy: summarized
