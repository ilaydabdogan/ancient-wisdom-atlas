  summary: A hymnic address offers homage to Osiris, naming him lord of eternity,
    king of the gods, possessor of many names and hidden attributes, and linking him
    to multiple Egyptian cult places. The passage identifies him with a hidden soul,
    the Soul of Ra, Tern, the substance of Egypt, divine food of the doubles, chief
    of the divine company, and a beneficent spirit. It also notes offerings, praise,
    Osiris's underworld seat, and a footnote explaining Qereret as two Nile-source
    caverns at Elephantine.
