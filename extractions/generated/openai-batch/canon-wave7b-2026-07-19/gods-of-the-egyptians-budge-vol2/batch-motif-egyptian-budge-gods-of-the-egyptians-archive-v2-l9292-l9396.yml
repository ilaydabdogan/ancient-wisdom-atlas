canonical_text:
  quote: ''
  summary: A hymn passage says that the son of Isis comes as the avenger of his father.
    It describes holy authority, established laws, opened paths and roads, peace in
    the Two Lands, the departure of evil, and the establishment of Maat. It also says
    the son of Isis receives the White Crown and the rank of his father within the
    House of Seb, invokes Ra, Thoth, assessors, and Seb’s decree, and includes a royal
    offering formula for Osiris as governor of Amenti and lord of Abydos, with funerary
    provisions and transformations.
  language: English with Egyptian transliteration
  quote_policy: summarized
