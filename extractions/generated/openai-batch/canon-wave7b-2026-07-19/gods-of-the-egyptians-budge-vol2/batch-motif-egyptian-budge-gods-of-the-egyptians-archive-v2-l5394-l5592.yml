- id: obs:2
  text: Nut is described as the female counterpart of Nu, representing the great watery
    abyss from which all things came and forming the celestial Nile on which the Sun
    sailed in boats.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The celestial watery path is divided into a daytime route and a nighttime
    route for the Sun.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nut is described as the wife of Seb and is given titles including daughter
    of Ra, lady of heaven, mistress of the gods, and one who gave birth to the gods.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nut is usually represented as a woman bearing a vase of water on her head;
    the passage says this sign indicates both her name and her nature.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nut sometimes wears the horns and disk of Hathor and holds a papyrus sceptre
    and the symbol of life.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nut appears in a sycamore tree pouring water from a vase for souls of the
    dead who come to her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In a Turin mummy-case scene, Nut stands on the emblem of gold and is accompanied
    by solar, uraeus, goddess, sky-goddess, and Horus symbols.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Below Nut in the Turin mummy-case scene is a sycamore tree in which the great
    Cat of Ra cuts off the head of Apep, described as the god of darkness and evil.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says that in this Turin depiction Nut has absorbed the attributes
    of all the great goddesses and is the type of the great mother of the gods and
    of the world.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: On coffins and in many papyri, Nut is depicted as a woman whose bent body
    forms a semicircle representing the sky or heaven.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Nut's legs and arms represent four pillars on which the sky rests and mark
    the cardinal points.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Shu supports Nut and is said to have lifted her from the embrace of Seb, who
    lies on the ground with one hand raised to heaven and the other touching the earth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: A hawk on each side of Shu represents the rising sun and the setting sun.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: One myth says Nut gives birth to the Sun-god daily; he passes over her body,
    enters her mouth, passes through her body, and is reborn the following morning.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Another myth says the Sun sails up Nut's legs and over her back in the Atet
