canonical_text:
  quote: ''
  summary: The passage describes Nut as the Night-sky, the female counterpart of Nu,
    the watery abyss and celestial Nile, the wife of Seb, and the mother of gods.
    It catalogs her titles, shrines, and iconography, including her water-vase sign,
    Hathor-like attributes, sycamore tree form, and funerary representations. It also
    describes scenes in which Shu supports Nut above Seb, hawks mark the rising and
    setting sun, and the Sun-god travels across or through Nut and is born again each
    morning.
  language: English
  quote_policy: summarized
