canonical_text:
  quote: ''
  summary: The passage lists several epithets or forms of Khnemu, then describes Sati/Satet/Sethat
    as Khnemu's principal female counterpart at Elephantine. It associates her with
    Anqet, the Nile inundation, fertility, hunting weapons, the crown of the South
    and horns, Isis-Sothis and other local goddess forms, ritual purification of Pepi
    I, a Book of the Dead sacred-place itinerary, the star Sept, Isis, Osiris, and
    the cult center at Sahal.
  language: English
  quote_policy: summarized
