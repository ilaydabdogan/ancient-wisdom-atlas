  summary: The passage lists Egyptian names and divine associations for several planets
    in the XIXth-XXth Dynasties and in the Graeco-Roman period. It identifies a planet
    associated with Horus, Mars with Ra, Mercury with Set, and Venus with Osiris,
    and gives several planetary epithets including a ship image for Venus and a backward-journeying
    description for Mars.
