canonical_text:
  quote: ''
  summary: The passage describes ritual inspection and sacrifice of oxen offered to
    Apis; an apotropaic formula spoken over the severed head; traditions about Apis's
    fixed lifespan and sacred burial; the post-mortem union of Apis with Osiris as
    Asar-Hapi/Osiris-Apis; the Greek development of Serapis; Apis's associations with
    strength, Ptah, Osiris, and the Underworld; iconographic markings of the Apis
    bull; and the mummification and burial of Apis bulls in the Serapeum at Sakkara.
  language: English
  quote_policy: summarized
