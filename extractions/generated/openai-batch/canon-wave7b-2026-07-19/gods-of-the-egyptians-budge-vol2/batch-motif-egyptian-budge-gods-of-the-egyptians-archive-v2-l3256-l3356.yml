- id: obs:11
  text: 'Khnemu is introduced in two important forms: as Her-shef at Herakleopolis
    Magna and as Osiris at Mendes.'
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Khnemu as Her-shef was worshipped at Suten-henen or Henen-su in the form of
