canonical_text:
  quote: ''
  summary: The passage describes Anqet as a member of the Elephantine triad with Khnemu
    and Sati, her iconography, local cult centers, identification with Nephthys, and
    interpretation as a personification of the Nile waters. It also describes pictures
    of Anqet in a shrine-boat and suckling a young king, then turns to Khnemu as Her-shef,
    including his ram-headed form, name variants, associations with Osiris, and Henen-su
    as a place where Ra first rose at creation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Anqet is described as the third member of the triad of Elephantine, which
    consisted of Khnemu, Sati, and Anqet.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In pictures, Anqet is represented as a woman holding a sceptre and the emblem
    of life, and wearing a feather crown.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Anqet is said to have originally been a goddess of an island in the First
    Cataract, later associated with Khnemu and Sati and worshipped in Northern Nubia,
    with Sahal as a later cult center.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Sahal Anqet was called lady of Satet, and temples in her honour are named
    at Sahal and Philae.
  category: setting
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The passage says Anqet was identified with Nephthys from Philae southwards.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Brugsch is cited as deriving Anqet's name from a root meaning to surround
    or embrace, with reference to the Nile waters that embrace, nourish, and fructify
