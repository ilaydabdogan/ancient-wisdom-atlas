canonical_text:
  quote: ''
  summary: The passage describes a judgment tableau centered on Osiris in a shrine,
    with Isis, Nephthys, the four Children of Horus, offerings, sacrificial imagery,
    and Ani kneeling in adoration. Horus presents Ani to Osiris after the weighing
    of Ani's heart by Thoth, declaring it righteous. Ani prays to Osiris, and the
    author states that Osiris's reply is not recorded but assumes Ani was admitted
    to Osiris's realm. The passage also explains the Eater of the Dead as devouring
    condemned souls and discusses the status called maa kheru, whose right and true
    word opens doors in the Underworld and removes hostile powers.
  language: English
  quote_policy: summarized
