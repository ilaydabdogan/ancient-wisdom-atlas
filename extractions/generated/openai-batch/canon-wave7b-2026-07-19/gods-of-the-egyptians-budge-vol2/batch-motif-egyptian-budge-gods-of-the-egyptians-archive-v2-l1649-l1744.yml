canonical_text:
  quote: ''
  summary: The passage describes Menthu-Ra's titles and antiquity, quotes a Pyramid
    Texts passage in which the dead king Mer-en-Ra appeals to gods and ascends with
    divine protection, notes Menthu's appearances in the Book of the Dead, and describes
    Menthu's hawk-headed iconography with solar disk, uraeus, plumes, and scimitar.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Menthu-Ra is given titles including lord of Thebes, King of the gods, throne-holder
    in Aptet, Governor of Behutet, lord or prince of northern and southern Annu, and
    lord of Manu, glossed as the Libyan mountain.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Menthu is said to be mentioned in the Pyramid Texts of Mer-en-Ra with ancient
    gods, and the author infers widespread worship by the Sixth Dynasty.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Khepera, Nu, Tern, Uash son of Seb, and Sekhem son of Osiris are entreated
    to listen to words addressed by the dead king.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nekhebet is said to protect the dead king; he is identified with the star
    Apsh; gods who traverse the land of the Thehennu and live on the indestructible
    heavens are asked to allow him to be with them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Five obscure gods are named, followed by statements that Seb listens, Tern
    provides the king with his form, Thoth hears for him what is in the books of the
    gods, Horus opens a path, and Set protects him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mer-en-Ra rises in the eastern part of heaven like Ra, goes forth from Pe
    with the spirits of Pe, is likened to Horus, is strengthened by the Great and
    Little Companies of the gods, rises as a king, and enters heaven like Ap-uat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king receives the White Crown and the Green Crown, has a club and an ams
    weapon or sceptre, has Isis as mother and Nephthys as nurse, receives milk from
    the cow Sekhat-Heru, and is accompanied by Net behind him and Serqet on his two
    hands.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage calls for the king, his flesh, and his apparel to pass, and says
    that he has gone forth as Menth, gone down like Ba, and hunted like Ba-ashem-f.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The author states that Menthu's origin and early history are unknown, but
    that his worship must have been ancient, and that the deceased hoped to resemble
    Menthu in the Underworld.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Book of the Dead chapter cxl, Menthu is named with other gods as the soul
    and body of Ra; in chapter clxxi, his name occurs among gods asked to bestow a
    garment of purity on the deceased.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Menthu is usually depicted as a man with a hawk head wearing a crown of solar
    disk, uraeus, and two high plumes; another described figure has two hawks' heads,
    each with solar disk, two uraei, and two plumes, and holds a scimitar.
  category: attribute
  evidence_refs:
  - ev:8
  - ev:9
