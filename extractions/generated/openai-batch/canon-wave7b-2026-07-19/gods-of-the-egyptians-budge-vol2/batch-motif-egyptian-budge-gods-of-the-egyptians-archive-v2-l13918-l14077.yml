  quote: ''
  summary: A protective utterance denies reptile, lion, stinging danger, and poison
    mastery over the addressee, identified as Horus and a divine son. Isis speaks
    in the first person, recounting that she conceived and bore Horus, son of Osiris,
    in a papyrus nest, hid him out of fear that he would be bitten, went to seek food
    for him, and returned to find the child motionless with eye water and lip foam;
    she cries out and swamp dwellers gather around her.
  language: English with Egyptian transliteration
