  summary: The passage describes tomb scenes and royal monuments connected with Aten
    worship at Khut-Aten, then narrates the death of Amen-hetep IV, the restoration
    of Amen worship under Tut-ankh-Amen, Ai, and Heru-em-heb, and the abandonment,
    dismantling, and desecration of Khut-Aten and its Aten sanctuary.
