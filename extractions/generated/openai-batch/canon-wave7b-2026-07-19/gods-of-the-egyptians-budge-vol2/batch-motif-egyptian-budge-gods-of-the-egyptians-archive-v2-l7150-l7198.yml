canonical_text:
  quote: ''
  summary: The passage describes iconographic scenes of Osiris rising from a bier
    and from a basket, attended by Isis, receiving life from a bearded god, kneeling
    in a double-Tet boat with papyrus and lotus plants, and appearing under several
    titles and forms. It also notes funerary regalia, lotus imagery associated with
    dawn and renewed life, a libation scene for a deceased person, and a caption of
    King Seti I addressing Osiris Khent-Amentet.
  language: English
  quote_policy: summarized
