  text: Aroueris is said to be born on the second of the added days and is also called
    the elder Orus; some identify him with Apollo.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Typho is said to be born on the third day, not at the proper time or place,
    forcing his way through a wound in his mother’s side.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Isis is said to be born on the fourth day in the marshes of Egypt, and Nephthys
    on the last day.
  category: sequence
  evidence_refs:
  - ev:1
