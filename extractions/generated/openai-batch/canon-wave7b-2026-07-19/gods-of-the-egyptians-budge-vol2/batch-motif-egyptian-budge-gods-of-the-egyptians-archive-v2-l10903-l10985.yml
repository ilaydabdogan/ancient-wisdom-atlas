canonical_text:
  quote: ''
  summary: The passage recounts divine births on added days, kinship and marital relations
    among Aroueris, Typho, Isis, Nephthys, and Osiris; Osiris’s civilizing reign and
    peaceful mission abroad; Isis’s vigilance during his absence; Typho’s conspiracy
    with seventy-two others and Queen Aso; the measured chest trick by which Osiris
    is sealed and carried by the Nile to the sea; and the first report of the event,
    followed by Isis’s mourning gesture.
  language: English
  quote_policy: summarized
