  summary: In a hymn to Osiris, a female figure at her brother's bier revives the
    still-hearted one, extracts seed, makes an heir, suckles and secretly rears the
    babe. The gods rejoice at the coming of Horus, son of Osiris and Isis, and divine
    powers assemble to bestow the rank of Osiris.
