canonical_text:
  quote: "“Mut, who giveth birth, but was herself not born of any”"
  summary: The passage describes Mut as a goddess who absorbed or was identified with
    many older Egyptian goddesses and their iconographic attributes, especially mother-goddess
    forms. It also describes her Theban cult center at Ashert, its sacred lake and
    temple, her titles in inscriptions, her primeval association with Nu, and the
    construction of her great temple by Amen-hetep III.
