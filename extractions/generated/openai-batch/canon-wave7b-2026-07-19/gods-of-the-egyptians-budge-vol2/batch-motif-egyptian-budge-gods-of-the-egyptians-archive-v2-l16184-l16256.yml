  summary: The passage describes Qetesh as an Egyptian form of Hathor and as a Moon-goddess,
    details several iconographic representations of her, notes a British Museum stele
    where she appears with Amsu/Min and Reshpu, and briefly describes Aasith as an
    armed woman riding a horse into battle.
