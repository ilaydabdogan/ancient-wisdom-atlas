comparison_claims:
- id: claim:1
  claim: Within the Kadesh narrative as quoted, Rameses II is functionally compared
    to Menthu and Ra as a royal warrior entering battle under divine likeness.
  claim_level: same_function
  target: Rameses II as Menthu-like and Ra-like warrior in the Kadesh battle narrative
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: This claim is limited to the passage's quoted narrative and does not
    establish broader historical or cultic equivalence.
- id: claim:2
  claim: Within the Book of the Dead Chapter 164 vignette described here, Mut is brought
    into a same-image or same-function association with Sekhet-Bast-Ra because the
    rubric calls the goddess Mut while the accompanying text addresses her as Sekhet-Bast-Ra.
  claim_level: same_function
  target: Sekhet-Bast-Ra in the Chapter 164 Book of the Dead vignette
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supports an association in this vignette only; it does
    not prove that Mut and Sekhet-Bast-Ra are identical in all contexts.
