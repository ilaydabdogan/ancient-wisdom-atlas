canonical_text:
  quote: ''
  summary: The passage describes Menthu/Menthu-Ra as a warlike god shown spearing
    bound enemies, bearing weapons, associated with bull and hawk forms, solar heat,
    and royal battle imagery in the Kadesh narrative. It then describes Mut as Amen-Ra's
    female counterpart and world-mother, with several iconographic forms including
    crowns, wings, vulture heads, animal and human heads, a phallus, and an association
    with two dwarfs and the name Sekhet-Bast-Ra in a Book of the Dead vignette.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A depicted scene shows Menthu with a long spear, described as having a bronze
    or iron head, spearing a foe whose hands and feet are tied together.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the city of Tchert, Menthu is described as worshipped in the form of a
    man with a bull's head and a lunar crescent and disk on his head, sometimes with
    plumes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The local Tchert form of Menthu holds a bow and arrows, a club, and a knife.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that this form of Menthu was understood as a personification
    of the fierce, destroying heat of the sun, fighting the enemies of the Sun-god
    with burning rays likened to fiery spears and darts.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Kadesh battle narrative, Rameses II is described as rising like Ra,
    taking the weapons of father Menthu, raging like Menthu, leaping into his chariot,
    and driving into battle.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Menthu is said to be often styled the mighty bull, and the passage presents
    a possible origin in the strength of a raging bull fighting a foe.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The compound name appears as Menthu-Ra rather than Ra-Menthu, which the passage
    cites as evidence for the antiquity of Menthu's worship.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: One image represents Menthu standing upright with a hawk head, holding what
    appears to be an ear of corn in one hand and a vase in the other, as if making
    offerings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Another image represents hawk-headed Menthu wearing the solar disk encircled
    by a uraeus, seated on a throne and embracing a young Horus god standing beside
    him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Mut is described as the principal female counterpart of Amen-Ra in the New
    Empire; her name is said to mean Mother, and she is described as the world-mother
    who conceived and brought forth whatsoever exists.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Pictures usually show Mut as a woman wearing the united crowns of South and
    North and holding the papyrus sceptre and the emblem of life.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Another form shows Mut standing upright with outstretched winged arms, the
    feather of Maat at her feet, united crowns, and vulture heads projecting from
    her shoulders with crowns or plumes.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: Other pictures show Mut with heads of a woman or man, a vulture, and a lioness,
    together with a phallus, wings, and lion or lioness claws.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: In the vignette of Chapter 164 of the Book of the Dead, Mut is associated
    with two dwarfs, each with a hawk face and a human face, who lift an arm to support
    the symbol of Amsu or Min.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: The accompanying text calls the three-headed goddess Mut in the rubric but
    addresses her as Sekhet-Bast-Ra; the passage says this accounts for the phallus
    and male head and shows that Mut was believed to possess both male and female
    reproductive attributes.
  category: relationship
  evidence_refs:
  - ev:11
