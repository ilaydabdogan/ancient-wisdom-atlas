    and earlier Egyptian conquests in Syria and Palestine.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: A letter from Tushratta to Amen-hetep III refers to Ishtar of Nineveh, called
