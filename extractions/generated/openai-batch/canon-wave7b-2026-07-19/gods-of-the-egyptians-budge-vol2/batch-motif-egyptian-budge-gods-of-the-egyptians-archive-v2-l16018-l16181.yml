canonical_text:
  quote: ''
  summary: The passage describes Anthat as a goddess titled lady of heaven and mistress
    of the gods, associated with conception without birth, weapons, crowns, and war,
    and discusses the spread of her cult from Syria into Egypt. It then describes
    Astharthet, Ashtoreth, or Ishtar as a horse and chariot goddess, lioness-headed
    and martial, whose cult entered Egypt and was identified with forms of Hathor
    or Isis-Hathor. The passage closes by beginning a description of Qetesh as akin
    to Astharthet and titled mistress of all gods and eye of Ra.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Anthat is called the lady of heaven and mistress of the gods, is said to conceive
    offspring but not bring them to birth, and is said to have been produced by Set.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Anthat is depicted either seated with shield, spear, and club, or standing
    with a panther skin, papyrus sceptre, life emblem, White Crown, feathers, and
    sometimes horns.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Anthat was a war goddess and that her cult extended
    through Northern and Southern Syria, where certain places were dedicated to her
    worship.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says Anthat’s worship entered Egypt after the Egyptians began
    forming their Asiatic empire, with a shrine at Thebes in the reign of Thothmes
    III and later honor by Rameses II.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:5
  text: Astharthet, identified in the passage with Ashtoreth, is called mistress of
    horses, lady of the chariot, and dweller in Apollinopolis Magna or Edfu.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Astharthet is represented as a woman with a lioness head surmounted by a disk,
    standing in a chariot drawn by four horses and driving over prostrate foes.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage dates the Egyptian introduction and establishment of Astharthet’s
