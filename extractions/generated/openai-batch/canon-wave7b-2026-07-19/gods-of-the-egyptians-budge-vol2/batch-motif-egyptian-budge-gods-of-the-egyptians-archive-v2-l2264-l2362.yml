canonical_text:
  quote: ''
  summary: 'The passage describes several forms and powers of Khensu, especially Khensu
    Nefer-hetep, including lunar and solar iconography, authority over harmful spirits,
    growth, fertility, and love. It then recounts the beginning of the Princess of
    Bekhten tradition: a foreign prince gives his daughter to the Egyptian king, later
    petitions for help for another sick daughter, and the king sends a learned royal
    scribe and physician to Bekhten.'
  language: English
  quote_policy: summarized
