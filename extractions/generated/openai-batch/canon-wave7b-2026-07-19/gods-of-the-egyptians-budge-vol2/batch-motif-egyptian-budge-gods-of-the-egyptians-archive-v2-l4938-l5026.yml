canonical_text:
  quote: ''
  summary: The passage describes cultic place names associated with Shu and Tefnut,
    probable lion-form worship, and a myth in which Ra responds to human sedition
    by sending Hathor, the Eye of Ra, to destroy mankind. Ra then withdraws from earth
    onto Nut transformed as a cow; when the cow trembles, Shu supports her in the
    sky, producing heaven, earth, and the four heavenly props. The passage then introduces
    Seb/Geb as son of Shu and Tefnut, brother and husband of Nut, father of several
    major gods, earth god, goose-associated deity, and authority over vegetation and
    tombs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dendera, Edfu, Memphis, and a portion of Dendera are named with titles connecting
    them to Shu or Tefnut, including house, seat, palace, or Aat designations.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says it is very probable that Shu and Tefnut were worshipped in
    sanctuaries under lion forms, and notes a report that people of Heliopolis worshipped
    lions in the temple of Helios.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Shu is described as the sky-bearer, and the passage introduces a myth explaining
    why he occupies that position.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: In remote times, Ra ruled gods and men from Suten-henen or Henen-su; mankind
    uttered seditious words against him, and Ra determined to destroy them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ra summoned Hathor, Shu, Tefnut, Seb, and Nut, told them what men had said,
    and asked their advice before slaying the rebels.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Nu, called the first-born god, advised Ra to send Hathor, the Eye of Ra, to
    slay men; Ra accepted, and Hathor went forth and slew mankind.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the slaughter, Ra became weary of the earth; Nut was turned into a cow,
    and Ra mounted on her back.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The cow trembled because she was high above the earth, and Ra commanded Shu
    to support her and hold her up in the sky.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The accompanying picture is described as showing the cow's body resting on
    Shu's head and raised hands and arms.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: When Shu took his place beneath the cow and bore up her body, the heavens
    above and earth beneath came into being, and the cow's four legs became the four
    props of heaven at the cardinal points.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says that Seb and Nut began their existence after the cosmic arrangement
    with Shu, the cow, heaven, and earth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Seb is described as son of Shu and Tefnut, brother and husband of Nut, and
    father of Osiris, Isis, Set, Nephthys, and, according to some, one Horus god.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Seb is represented as a man with specified crowns or a goose, and the goose
    is sacred to him because he was believed to have moved through the air in that
    form.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Seb is god of the earth; the earth forms his body and is called the house
    of Seb, and he is associated with vegetation on the surface and tombs beneath
    the ground.
  category: attribute
  evidence_refs:
  - ev:8
