candidate_motifs:
- id: motif:1
  label: Young Horus subduing crocodiles and hostile animals
  taxonomy_refs:
  - miraculous_child
  - chaos
  basis: The large scene shows Horus with the lock of youth standing on two crocodiles
    and grasping reptiles and animals identified as emblems of foes of light and powers
    of evil; other registers show Horus spearing a crocodile and standing on the oryx
    emblem of Set.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: medium
  cautions: The passage describes iconography, not a narrative episode; the taxonomy
    label 'miraculous_child' is inferred only from Horus' youth-lock and child-associated
    forms, not from an explicit miracle story in this passage.
- id: motif:2
  label: Defeat or immobilization of serpents
  taxonomy_refs:
  - serpent
  - chaos
  basis: Serpents are pierced by arrows or darts, coiled serpents have knives in their
    foreheads beneath Thoth and Isis, and Horus-Ra stands on a coiled serpent.
  evidence_refs:
  - ev:6
  - ev:10
  confidence: high
  cautions: The passage does not identify every serpent by name or provide a full
    mythic narrative for their defeat.
- id: motif:3
  label: Crocodile subjugation by deities and royal figures
  taxonomy_refs:
  - chaos
  basis: Multiple scenes show gods or a king standing on, spearing, restraining, sitting
    on, or galloping over crocodiles; the large scene links the grasped reptiles and
    animals with foes of light and powers of evil.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:9
  confidence: high
  cautions: Crocodile is not among the supplied symbol taxonomy refs, so the motif
    is recorded under a broader hostile/chaos-animal pattern.
