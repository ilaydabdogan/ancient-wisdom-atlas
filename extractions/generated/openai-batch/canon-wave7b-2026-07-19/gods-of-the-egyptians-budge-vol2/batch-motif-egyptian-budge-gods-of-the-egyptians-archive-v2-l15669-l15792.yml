canonical_text:
  quote: ''
  summary: 'The passage describes side and back scenes on the Metternich Stele: apes
    praising the morning and evening sun; royal and divine figures; registers of gods
    standing on, restraining, spearing, or trampling crocodiles and serpents; Isis,
    Horus, Thoth, Ta-urt, Bes, and other deities; and a large central scene in which
    Horus stands on two crocodiles and grasps hostile animals and reptiles identified
    as emblems of the foes of light and powers of evil.'
  language: English
  quote_policy: summarized
