canonical_text:
  quote: ''
  summary: 'The passage describes Khoiak/Pert festival rites for Osiris: burial of
    a previous-year divine model, embalming of a new Osiris, setting up the Tet at
    Tettu, a seven-day interval linked to Osiris in Nut''s womb, and sanctuary ceremonies
    using illuminated papyrus boats for deities. It then summarizes Budge''s claims
    about continuity between Ptolemaic Osiris rites and Pyramid Text traditions, Osiris''s
    identifications with dead kings, the dead Sun-god, sun and moon, regenerative
    powers, and Dionysos, and describes common iconographic forms of Osiris as mummy
    and as Tet.'
  language: English
  quote_policy: summarized
literal_observations:
