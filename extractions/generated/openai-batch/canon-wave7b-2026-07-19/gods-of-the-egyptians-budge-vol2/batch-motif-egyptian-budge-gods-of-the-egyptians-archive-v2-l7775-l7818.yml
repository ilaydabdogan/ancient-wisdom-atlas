canonical_text:
  quote: He judgeth the earth according to his plans
  summary: A hymn passage praises a crowned divine ruler who receives his father's
    rank, judges the earth, commands human, spiritual, territorial, and natural realms,
    gives food and abundance, defeats an enemy, establishes law and Maat, and is associated
    with Ra and Thoth. A closing petition asks Osiris, Governor of Amentet and lord
    of Abydos, to grant funerary offerings and afterlife powers.
  language: English
  quote_policy: quoted
