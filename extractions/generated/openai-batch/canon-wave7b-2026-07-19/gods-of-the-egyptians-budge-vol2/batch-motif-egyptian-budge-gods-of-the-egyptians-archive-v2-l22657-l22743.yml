  quote: ''
  summary: The passage surveys Egyptian religious and mythological references to apes,
    elephants, bears or wolves, dogs, jackals, and wolves. It describes lunar and
    dawn associations of sacred cynocephali; possible predynastic reverence for the
    elephant; a disputed report that Horus and Set changed from men into bears or
    wolves while fighting; funerary respect for dogs; a rejected Greek report that
    dogs guarded and guided Isis in the Osiris myth; the jackal-god's role as minister
    and guide to Osiris and the dead in the Underworld; and a brief reference to wolves,
    Lycopolis, and a festival linked with Rhampsinitus's descent to the Underworld.
