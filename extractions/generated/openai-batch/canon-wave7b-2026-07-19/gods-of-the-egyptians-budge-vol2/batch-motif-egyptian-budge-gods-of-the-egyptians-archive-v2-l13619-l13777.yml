  quote: ''
  summary: In this fragment from the “Sorrows of Isis,” Isis appears as wounded, stretches
    out her arms, and twice promises to protect her son Horus. She tells him not to
    fear, says no evil will happen to him, and describes him as containing seed for
    future things, as a son within Mesqet proceeding from Nu, as one who will not
    die by the flame of poison, and as the Bennu Great born.
