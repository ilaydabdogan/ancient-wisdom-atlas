  summary: The passage describes the Gizeh Sphinx as a solar symbol and guardian of
    tombs, rejects interpretations of it as Egyptian enigmatic wisdom or as derived
    from the Greek Sphinx, and surveys lion-related divine, royal, underworld, and
    funerary imagery in Egyptian religion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Gizeh Sphinx, named Hu in Egyptian, is described as a symbol of the Sun-god
    Ra-Temu-Khepera-Heru-khuti and as made to keep evil spirits away from nearby tombs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Gizeh Sphinx is described as a guardian and protector of the dead and
    their tombs, a colossal abode for the spirit of the Sun-god, and a figure facing
    the rising sun.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage rejects the view attributed to Plutarch and others that the Gizeh
    Sphinx typified Egyptian enigmatic wisdom, strength, and wisdom.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says the Egyptian man-headed lion statue has no connection with
    Greek views about the Sphinx and contrasts Greek winged female sphinxes with Egyptian
    lion statues that may have heads of men, sheep, or rams.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Gizeh Sphinx is associated by the author with a theological setting in
    which lion cult was common in the Delta or Northern Egypt, and later reproductions
    preserved the idea of protection in major temples.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Amen-hetep III is said to have boasted of shooting 102 lions in the first
    ten years of his reign, though the author states these were lions of Mitanni rather
