canonical_text:
  quote: ''
  summary: 'The passage describes several forms of conflict involving Set: Set as
    the serpent Apep fighting Ra each night, Set as killer of Osiris, and Set as the
    opponent of Horus. It also summarizes Book of the Dead passages where the deceased
    conquers or is aided by Set, and cites Plutarch and Manetho on names and material
    associations of Typhon/Seth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Set is said to assume the form of a monster serpent in order to prevent Ra
    from appearing in the East; the serpent is named Apep or Afiapef, also Rerek,
    and is accompanied by small serpents and noxious creatures.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Apep’s weapons are described as cloud, mist, rain, darkness, and similar things;
    Ra’s weapons are the burning heat of the sun and darts and spears of light.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The fight’s result is described as constant: Apep is shrivelled and burnt
    by Ra, renews himself daily, gathers his fiends at the end of each night, and
    fights Ra again.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In a third form of the story, Osiris and Set are the combatant gods; Set slew
    his brother, persecuted his widow and child, and escaped punishment because Osiris
    had no avenger at his death.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In a fourth form of the story, Horus, son of Osiris and Isis, fights Set with
    the stated intention of killing the killer of his father Osiris.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Horus and Set fight first in the forms of men and then in the forms of bears;
    Horus has Set fettered, but Isis pities her brother, loosens his bonds, and frees
    him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The fight between Horus and Set is said to affect the destinies of the dead,
    to carry the moral idea of the victory of Good over Evil, and to be a model by
    which the deceased conquers Set.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Book of the Dead examples cited in the passage include the deceased saying
    that he has seen Osiris and stabbed Suti, and a passage where Set’s fiends become
    wild beasts and Osiris, aided by Thoth, slays them.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The deceased prays for Thoth to loosen the mouth-bandages with which Set has
    fettered him; elsewhere the deceased declares himself to be Set who releases storm-clouds
    and thunder.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Some cited passages present Set as friendly to the deceased, purifying and
    strengthening along with Horus, and identify the deceased’s backbone with Set’s
    backbone.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Other cited passages say that Set lies under fetters he made for the deceased,
    departs with an iron harpoon in him, throws up what he has eaten, and is put in
    restraint.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: A cited statement from Plutarch says Typhon was called Seth, Bebo, and Smy,
    and a cited statement from Manetho says load-stone was called the bone of Horus
    and iron the bone of Typho.
  category: speech
  evidence_refs:
  - ev:12
