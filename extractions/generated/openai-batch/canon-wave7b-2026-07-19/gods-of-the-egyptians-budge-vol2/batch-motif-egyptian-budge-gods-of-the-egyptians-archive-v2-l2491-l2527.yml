  quote: ''
  summary: The passage introduces Hap/Hapi as the god of the Nile. It states that
    Osiris was probably a predynastic river- or water-god and later became identified
    with Hap/Hapi, though the date of that identification is unknown. It discusses
    Hep/Hap as an ancient name for the Nile and Nile-god, cites an Unas text in which
    several beings are addressed and in which the Great Terror comes forth from Hep
    while Ap-uat comes forth from the Asert Tree, and notes Hep’s connection with
    Kenset, the first nome of Egypt.
