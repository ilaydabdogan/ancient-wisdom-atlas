canonical_text:
  quote: ''
  summary: The passage describes Osiris iconography as a vegetation figure, including
    plants growing from his mummied body and trees growing from a mound called Osiris.
    It then summarizes the spread and local identifications of Osiris across Egypt,
    and introduces Osiris as judge of the dead and symbol of resurrection. In Budge's
    account, Osiris died, was dismembered, was reconstituted, became immortal, and
    was embalmed by Horus, Anubis, and Isis according to prescriptions of Thoth. Thoth's
    words and priestly ceremonies are presented as bringing Osiris back to life and
    as the model for Book of the Dead rituals intended to secure eternal life for
    the deceased.
  language: English
  quote_policy: summarized
