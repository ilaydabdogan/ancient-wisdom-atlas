canonical_text:
  quote: ''
  summary: Budge describes a period of poverty, weakened priestly influence, and tomb
    robberies, then introduces a document for Nesi-Khensu in which Amen-Ra is made
    to enter a legally phrased agreement for the deceased's happiness and deification
    in the Underworld. The quoted introduction catalogs Amen-Ra's attributes as primeval
    god, creator, self-formed being, celestial and underworld traveler, rejuvenated
    old man, animal-formed protector, lord of flame, and source of humans, gods, food,
    and created things through eyes and utterance.
  language: English
  quote_policy: summarized
