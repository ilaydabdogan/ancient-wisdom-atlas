  summary: The passage describes the Nile-god Hep/Hapi in relation to the Nile’s source,
    royal and afterlife sustenance, fertility, South and North Nile forms, papyrus
    and lotus emblems, royal union iconography, and Hapi’s identification with primeval
    creative waters and comparison with Ra.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Nile-god and Ap-uat were exhorted to send waters
    from Kenset so that grain would be produced for the needs of the king, in a context
    also mentioning Unas’s food in the Underworld and Sekhet-Aaru.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A separate cited passage refers to the destroying power of Hep in connection
    with those who would steal the king’s food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hep or Hapi is described as depicted in the form of a man with the breasts
    of a woman, which the passage says indicate fertility and nourishment.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that, as Egypt was divided into South and North, the Nile
    was also divided, producing a god of the Nile of the South and a god of the Nile
    of the North.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Egyptians are said to have believed that the Nile rose in the First Cataract,
    in Qerti, described as the Double Cavern.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The South Nile god is described with a cluster of lotus plants on his head,
    while the North Nile god is described with a cluster of papyrus plants; the names
    Hap-Reset and Hap-Meht are given.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: When the two forms of Hep or Hapi are indicated in a single figure, the god
    holds papyrus and lotus plants, or two vases from which he was believed to pour
    out the two Niles.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage describes two Nile-gods tying lotus and papyrus stems in a knot
    around the emblem of union, symbolizing the union of South and North.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A modified version of the union design was cut on the sides of kings’ thrones
    to indicate that the South and North thrones had been united and that the sovereign’s
    rule extended over Upper and Lower Egypt.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Hapi is said to have become identified with primeval creative gods, to have
    absorbed attributes of Nu, and to have been declared maker of the universe, creator
    of everything, and father of all beings and things.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Nu is described as the primeval watery mass from which Ra, the Sun-god, emerged
    on the first day of creation.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage contrasts Ra’s visible movement and life-giving light and heat
