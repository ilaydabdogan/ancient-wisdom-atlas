  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Bes is usually depicted as a dwarf with a huge bearded head, protruding tongue,
    flat nose, shaggy eyebrows and hair, projecting ears, thick arms, bowed legs,
    an animal skin of the panther tribe, a tail hanging behind, and a feather tiara.
  category: attribute
  evidence_refs:
  - ev:9
