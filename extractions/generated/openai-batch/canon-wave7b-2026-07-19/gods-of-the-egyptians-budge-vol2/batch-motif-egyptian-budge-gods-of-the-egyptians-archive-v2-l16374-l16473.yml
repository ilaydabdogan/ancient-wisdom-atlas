canonical_text:
  quote: ''
  summary: 'The passage surveys foreign or Syrian deities known in Egyptian religion:
    Reshpu''s cult sites, martial iconography, gazelle emblem, and association with
    destructive fire and lightning; Atuma/Athuma and Syrian goddesses; Sutekh gods
    listed in the treaty of Rameses II with Kheta-sar and their Egyptian identification
    with Set; and Bes''s debated origin, physical depiction, animal skin, feather
    tiara, and roles in music, dance, war, slaughter, and destructive force.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cult place at Het-Reshp in the Delta is named, and Reshpu is said to have
    probably been specially worshipped at many small provincial shrines on Egypt's
    eastern frontier.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Reshpu is represented as a warrior holding a shield and spear in his left
    hand and a club in his right, with the White Crown, a turban, and a gazelle head
    projecting above his forehead.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The gazelle head is described as a very ancient symbol of Reshpu and as indicating
    his sovereignty over the desert.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Reshpu is connected with a Phoenician god whose name is discussed as Reshef
    or Rashshuf and who is interpreted as a god of burning and destructive fire and
    lightning.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Müller is reported as seeing the Egyptian Atuma or Athuma as equivalent to
