  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Two Western Syrian goddesses named Ennukaru and Amait are mentioned.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: A copy of the treaty made by Rameses II with Kheta-sar lists multiple Sutekh
    gods of different cities.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that, in Egyptian eyes, Sutekh and Set were for practical
    purposes one and the same god, and that the fabulous Set animal symbolized both.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Sutekh is described as more or less a god of evil, whose favour Egyptians
    attempted to obtain through offerings and prayers.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Bes is identified as a foreign god known to Egyptians, with origin debated
