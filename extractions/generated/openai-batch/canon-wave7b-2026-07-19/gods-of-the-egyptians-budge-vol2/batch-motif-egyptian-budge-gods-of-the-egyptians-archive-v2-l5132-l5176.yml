canonical_text:
  quote: ''
  summary: The passage discusses the Bennu, its sanctuary Het Benben at Heliopolis/Annu,
    and cited funerary passages in which the deceased identifies with or takes the
    form of the Bennu, the soul or Morning Star of Ra, and in one scholion Osiris.
    It also describes the Bennu’s morning solar appearance and renewal at the Persea
    tree. The passage then turns to Seb as earth god, Heliopolis as the birthplace
    of the gods and beginning-place of creation, and images of the first creation
    in which the Sun-god’s rays reach earth while Seb lies on the ground with one
    hand toward earth and the other toward heaven.
  language: English
