  quote: ''
  summary: The passage describes Amen's early local worship at Thebes, the sanctuary
    in the Apt quarter, the goddess Apt as a place-personification and Hathor-form,
    and the political and priestly elevation of Amen after Theban rulers made their
    city Egypt's capital. It also includes an illustration caption in which Horns
    and Hekan present Amen-lietep III as a babe, with his double, to Amen-Ea.
  language: English
  quote_policy: summarized
