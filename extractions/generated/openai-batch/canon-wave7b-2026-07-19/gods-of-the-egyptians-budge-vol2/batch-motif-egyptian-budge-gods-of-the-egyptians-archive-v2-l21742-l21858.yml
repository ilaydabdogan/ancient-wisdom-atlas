canonical_text:
  quote: individual animals were the abodes of gods
  summary: The passage is a modern scholarly discussion of Egyptian sacred animal
    worship. It describes animals, birds, and reptiles as worshipped from early times;
    explains the belief that gods could be incarnate in individual animals; describes
    temple care, death, mummification, replacement, and reincarnation of sacred animals;
    discusses priestly handling of animal movements as revelations of divine will;
    and introduces Hap/Hapi, called Apis by the Greeks, as an ancient sacred bull
    cult with traditions about its unusual birth.
  language: English
