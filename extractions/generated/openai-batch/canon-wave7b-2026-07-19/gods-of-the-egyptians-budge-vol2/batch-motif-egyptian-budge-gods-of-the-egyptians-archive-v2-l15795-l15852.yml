canonical_text:
  quote: ''
  summary: 'Budge describes images and texts on the Metternich Stele: a fire-emitting
    god, Utchat eyes, vanquished dangerous animals, rows of gods and mythological
    scenes, and narrative texts concerning Ra, Isis, Horus, Set, Nephthys, Thoth,
    and Osiris, including scorpion bites, divine appeal, words of power, and resurrection
    language.'
  language: English
  quote_policy: summarized
