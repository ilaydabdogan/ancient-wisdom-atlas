canonical_text:
  quote: ''
  summary: 'The passage explains Egyptian ideas about the judgment of the dead, especially
    the weighing of the heart or body against the feather of Maat. It then describes
    the Judgment Scene in the Papyrus of Ani: Ani and his wife enter the Hall of Maati;
    divine figures attend the Balance; Thoth reports that Ani is justified; the gods
    ratify the favorable verdict; Amemet does not devour him; Horus leads Ani before
    enthroned Osiris.'
  language: English
  quote_policy: summarized
