canonical_text:
  quote: ''
  summary: The passage describes Aaru or Sekhet-Aaru as an afterlife region originally
    placed in the sky but also entered through Delta locations including Tettu. A
    quoted Pepi I text presents Pepi traveling with divine assistance to Sekhet-Aar,
    ascending to Nut and sailing with the four Spirits of Horus. The passage then
    describes Sekhet-Aaru as a fertile Field of Reeds or Plants with lakes, canals,
    crops, grain, beer, and homestead life. It locates Osiris traditions at Tettu/Busiris,
    where his dismembered body was reconstructed and his backbone ritually set up.
    It also describes Osiris as a water-god connected with the Nile and Inundation,
    opposed by Set, deity of death, destruction, and the desert.
  language: English
  quote_policy: summarized
