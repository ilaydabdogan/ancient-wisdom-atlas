canonical_text:
  quote: ''
  summary: The passage first gives a fragmentary Egyptian text and translation in
    which a speaker comes in the boat of the disk of Ra and light dispels night to
    heal Horus for Isis. It then begins a chapter on Set/Suti and Nephthys, describing
    Set's genealogy, his older cult, his association with Horus as helper of the dead
    in Pyramid Texts, myths of a heavenly iron plate reached by ladder, and the roles
    of Ra, Horus, Set, Heru-ur, Osiris, Unas, and Thoth in ascent, guidance, opposition,
    and arbitration. It closes by presenting Heru-ur and Set as paired opposites,
    including day/night and light/darkness, and as a dual god with both heads on one
    body.
  language: English, with transliterated Egyptian fragments
  quote_policy: summarized
