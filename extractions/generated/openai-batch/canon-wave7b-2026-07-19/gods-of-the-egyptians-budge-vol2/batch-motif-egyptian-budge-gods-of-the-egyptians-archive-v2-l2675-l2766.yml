  summary: The passage presents the Nile god Hapi as a life-giving and protective
    divine power who causes vegetation to grow, yet cannot be adequately imaged, housed,
    named, or known. Budge identifies Hapi as honored as Father of the gods, creator,
    and Vivifier, and notes an aspect in which Hapi is identified with Osiris, with
    Isis as female counterpart and later cultic links to Osiris-Apis or Serapis.
