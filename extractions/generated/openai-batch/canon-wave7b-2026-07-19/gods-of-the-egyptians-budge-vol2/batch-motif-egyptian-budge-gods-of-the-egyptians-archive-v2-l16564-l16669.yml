canonical_text:
  quote: ''
  summary: The passage describes a Book of the Dead vignette showing an unidentified
    monster, probably Bes or a related form, before the deceased with a knife and
    an apparent intent to remove the deceased's heart. It then discusses Bes as both
    a god of mirth and a potentially avenging underworld figure, his possible African
    origin, Punt-related attributes, and his animal tail. The final section introduces
    the Nubian god Merul or Meril, son of Horus and Isis, member of local triads,
    and describes his iconography and titles.
  language: English
  quote_policy: summarized
