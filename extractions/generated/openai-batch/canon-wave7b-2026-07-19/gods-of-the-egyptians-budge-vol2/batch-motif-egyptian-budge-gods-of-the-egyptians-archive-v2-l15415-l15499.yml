canonical_text:
  quote: ''
  summary: The passage describes Anubis as a funerary god connected with embalming,
    purification, bodily restoration, and the guidance of the dead. It distinguishes
    Anubis from Ap-uat, another jackal-associated god who opens ways, and explains
    their northern and southern functions, solstitial associations, and appearances
    as jackals on funerary monuments. It also reports Plutarch's interpretation of
    Anubis as a boundary between visible and invisible regions and as comparable in
    function to Hecate.
  language: English
  quote_policy: summarized
