  summary: The passage discusses the Ram of Mendes/Ba-neb-Tet as a sacred ram or goat
    worshipped in the Delta, associated with generation and fecundity, selected by
    marks, ceremonially brought to Mendes, enthroned, and later identified with Osiris,
    Ra, and Khnemu. It also begins a discussion of the crocodile as a feared and deified
    animal named Sebek/Sebeq/Souchos, sacred in some places and killed in others,
    with tame sacred crocodiles adorned, fed, embalmed, and buried.
