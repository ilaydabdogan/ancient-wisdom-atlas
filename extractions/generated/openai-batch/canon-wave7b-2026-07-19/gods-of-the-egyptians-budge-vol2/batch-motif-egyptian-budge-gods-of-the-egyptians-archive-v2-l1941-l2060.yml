canonical_text:
  quote: ''
  summary: The passage describes temple and Delta cult sites associated with Mut,
    including a temple lake, sacred boat processions, and black basalt statues of
    Mut in the form of Sekhet. It discusses place-name identifications, shrines at
    Bekhen and An, a border tradition involving Horus and Set, and theological statements
    that Mut was the female counterpart of Nu and was never born or self-produced.
    It also cites Pyramid Texts material in which Unas has union with Mut, draws the
    flame of Isis, and unites with the lotus, and notes a Book of the Dead hymn to
    Osiris that mentions Mut.
  language: English
  quote_policy: summarized
