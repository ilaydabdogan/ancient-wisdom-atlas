canonical_text:
  quote: ''
  summary: The passage describes Aten’s visible emblem as a solar disk whose rays
    end in hands holding emblems of life and sovereignty and shining on Amen-hetep
    IV, Nefert-ith, the royal family, and royal cartouches. It then discusses the
    king’s altered Amarna portrayal, his activity at Khut-Aten, the apparent lack
    of emphasis on death and Osiris in Atenite hymns and inscriptions, and the survival
    of traditional funerary practices in his rock-cut tomb, including mummification,
    amulets, ushabtiu figures, and assumptions about material life in the Osirian
    afterlife fields.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Aten is represented by a visible emblem: the solar disk, with rays ending
    in hands that hold emblems of life and sovereignty.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bas-reliefs and frescoes show the human-handed rays shining on the king, his
    queen, his family, and cartouches containing the names of the king and Nefert-ith.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The passage states a simple interpretation of the scenes: the sun is the
    source of all life and of everything that supports life on earth.'
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: Amen-hetep IV liked to be depicted with human-handed rays falling on him and
    officiated as high-priest of the cult on special occasions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: After changing his religion and name, the king also changed the form and figure
    used for his representation in bas-reliefs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: At Tell el-Amarna the king is portrayed with a high receding forehead, aquiline
    nose, weak mouth, projecting chin, long slender neck, rounded chest, inflated
    stomach, large thighs, and a figure said to resemble that of a woman in many respects.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage says some high officials were represented in the same manner as
    the king, and that some drawings of the king must be regarded as caricatures,
    though intent is uncertain.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: For a few years Amen-hetep IV lived happily in his new capital, adorning it
    with buildings, sculptures, and gardens filled with trees and plants, and giving
    gifts to favourites and officials who carried out his wishes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Life at Khut-Aten is described as joyous, with no evidence that men troubled
    themselves with death or the kingdom of Osiris in their hymns and inscriptions.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that Amen-hetep IV did not, or could not, abolish characteristic
    Egyptian funeral customs and beliefs, and that the tombs of Aten adherents bear
    witness to this.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: The king caused a rock-cut tomb to be made in the mountains east of the town,
    and when found it contained objects usually found in tombs of high-ranking people.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: The sarcophagus was broken, and the mummy-chamber and corridor contained objects
    and fragments made of purple and blue glazed faience characteristic of Amen-hetep
    IV’s reign.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage infers that the king’s body was mummified and supplied with the
    same classes of amulets found on royal mummies at Thebes.
  category: other
  evidence_refs:
  - ev:6
- id: obs:14
  text: Fragments of granite ushabtiu figures were found, and the passage says this
    shows that the king’s buriers assumed he would enjoy a material life in Sekhet-hetepet
    and Sekhet-Aarru in the kingdom of Osiris.
  category: object
  evidence_refs:
  - ev:6
- id: obs:15
  text: The state of the tomb is presented as evidence that Amen-hetep IV gave little
    thought to his own death and burial, even though his eldest daughter Aten-merit
    had been buried in the tomb.
  category: sequence
  evidence_refs:
  - ev:7
