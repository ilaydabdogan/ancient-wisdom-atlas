  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The hymn says the earth came into being through the deity's divine plans,
    and that the Soul gives light from his two Utchats or Eyes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The hymn names Baiti as creating divine transformations and Khepera as unknown
    and more hidden than other gods.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: The deity is called a holy unknown one, a king who makes kings rule, and one
