canonical_text:
  quote: ''
  summary: A hymn praises Amen-Ra with epithets of life-giving power, solar light,
    victory over foes, hiddenness, creation, royal authority, fixed decrees, protection,
    and cosmic lordship. The following prose commentary interprets the composition
    as a creed of Amen-Ra's worshippers and contrasts it with claims associated with
    Aten and Osiris. The passage then describes Amen-Ra's common iconographic form
    on monuments and papyri.
  language: English
  quote_policy: summarized
literal_observations:
