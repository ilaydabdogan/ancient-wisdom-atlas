  evidence_refs:
  - ev:1
- id: obs:2
  text: The deity is called lord of life, grants the circuit of the earth and the
    abode of his divine face to whom he pleases, and sets out on a journey without
    mishap.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mankind make supplications to the deity at dawn.
  category: action
  evidence_refs:
  - ev:1
