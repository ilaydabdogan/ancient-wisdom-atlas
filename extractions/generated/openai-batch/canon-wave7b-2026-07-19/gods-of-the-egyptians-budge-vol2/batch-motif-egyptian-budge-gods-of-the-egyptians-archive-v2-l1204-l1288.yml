  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The deity is described as a creator of the world by secret counsels and as
    having the divine Disk as his vicar.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The hidden deity is described as a flame that sends rays of light; he can
    be seen at his appearance but cannot be understood.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Nu comes forward with the north wind in the hidden god.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The deity makes decrees for immense periods of time, has fixed ordinances,
    gives duration of life, doubles years for those he favors, and protects the one
    set in his heart.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Amen-Ra is called the one who formed eternity and everlastingness, king of
    the South and North, king of the gods, and lord of heaven, earth, the deep, and
    the two mountains.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: The prose commentary says the composition appears to have formed a creed of
