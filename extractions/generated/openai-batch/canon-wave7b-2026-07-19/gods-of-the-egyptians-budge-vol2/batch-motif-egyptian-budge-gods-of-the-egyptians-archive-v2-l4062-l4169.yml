canonical_text:
  quote: "“Thy beams of light embrace the lands”"
  summary: Budge introduces Aten worship, distinguishes it from Yahweh and Adon, compares
    its ceremonies with older Heliopolitan sun-worship, and notes its limited monotheistic
    character. He then gives extracts from a hymn to Aten attributed to Amen-hetep
    IV/Khu-en-Aten. The hymn praises Aten as a living solar deity whose rising fills
    lands with light and life, whose setting leaves earth dark and dead-like, and
    whose return awakens people, animals, plants, boats, fish, and waters into activity
    and praise.
  language: English
  quote_policy: quoted
