  summary: The passage quotes hymnic statements addressed to Ra in which Aten is the
    form through which Ra renews himself, shines on the horizon, illuminates the Underworld,
    and is beheld by the dead. Budge then explains Aten as the solar disk and visible
    emblem of Ra, before discussing royal and priestly politics around Aten, Amen/Amen-Ra,
    Heliopolitan sun forms, Thothmes IV, Amen-hetep III, and Queen Thi.
