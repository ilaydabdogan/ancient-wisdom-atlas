canonical_text:
  quote: ''
  summary: The passage describes a four-headed form of Khnemu of Henen-su and identifies
    its heads with Ra, Shu, Seb, and Osiris. It then describes Her-shef’s female counterpart
    under local names such as Atet/Mersekhnet and reports a tradition in which Atet,
    as a cat, slays Apep, the serpent of darkness, paralleling a Book of the Dead
    passage where Ra as the Cat Mau defeats Apep by the Persea Tree at Annu before
    rising as the sun. The passage also describes Neheb-kau, worshipped at Henen-su
    as a serpent goddess, as an assessor of the Hall of Maati and as a provider of
    divine food for the dead in connection with the Egyptian Elysian Fields.
  language: English
  quote_policy: summarized
