  quote: ''
  summary: The passage describes Osiris in the Book of the Dead as a divine instructor
    and judge of the dead. It explains that Egyptian judgment of the dead involved
    a weighing of words or actions, represented by scales called Makhaat and watched
    by Thoth on behalf of Osiris. It also notes earlier allusions in the Pyramid Texts,
    a judgment place apparently in the sky, and later pictorial representation of
    the Balance in the Underworld.
