canonical_text:
  quote: thou comest in peace to make Egypt to live.
  summary: Budge introduces Egyptian reverence for the Nile and quotes a hymn to Hapi
    from an XVIIIth or XIXth Dynasty papyrus. The hymn praises Hapi as the hidden
    Nile power who comes peacefully, waters fields, gives life to animals and people,
    creates and strengthens food supplies, cares for the poor, sustains gods and humans,
    receives association with Khnemu/Khnemu-Ra, and fills storehouses and granaries.
  language: English
  quote_policy: quoted
