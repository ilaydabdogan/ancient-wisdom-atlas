canonical_text:
  quote: ''
  summary: In a hymn addressed to Aten, the deity is said to cause conception, form
    a human being from seed, sustain the child in the mother’s body, give breath,
    enable speech at birth, and provide necessities. The deity is also said to give
    air to a chick within an egg, bring it to completion, and enable it to break the
    shell and emerge.
