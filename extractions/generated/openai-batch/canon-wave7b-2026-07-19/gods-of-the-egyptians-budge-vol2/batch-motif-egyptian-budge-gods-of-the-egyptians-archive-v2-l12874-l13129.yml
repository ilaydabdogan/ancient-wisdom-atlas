canonical_text:
  quote: A charm is my word having life.
  summary: In a passage from the “Sorrows of Isis,” the speaker enters a poor woman’s
    house. Tefen enters under the door, a noble lady’s son is smitten, and fire breaks
    out without water or rain to quench it. The woman who had not opened to the speaker
    laments because she does not know whether the child lives. The speaker, identified
    as Isis, declares her life-giving charm, says her father taught her, lays hands
    on the child, and commands the poison of Tefen and Befent to come forth and not
    enter further.
  language: English
  quote_policy: quoted
