canonical_text:
  quote: ''
  summary: The passage describes ritual practices at an Isis festival at Tithorea,
    including shrine cleaning, burial of sacrificial remains, fairs, animal sacrifices,
    linen wrapping of victims, processions, burning booths, and stories of unauthorized
    shrine entrants who die after seeing forbidden sights. It then discusses Isis
    mourning Osiris, the Nile rising through her tears, and modern scholarly comparisons
    between Isis, Horus, Neith, the Virgin Mary, Christ, Christian iconography, apocryphal
    narratives, parthenogenesis, and resurrection beliefs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A festival in honor of Isis is described as being held twice yearly, in spring
    and autumn.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two days before each festival, persons permitted to enter the shrine clean
    it secretly, remove remaining sacrificial victim material from the previous festival,
    and bury it at a fixed place about two furlongs from the shrine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the next day hucksters set up improvised reed booths, and on the last day
    a fair is held for slaves, cattle, garments, silver, and gold.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After noon, richer people sacrifice oxen and deer, while poorer people sacrifice
    geese and guinea fowl; swine, sheep, and goats are excluded from this sacrifice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ritual handlers wrap the victims in common or fine linen in an Egyptian mode,
    lead the animals in procession, bring victims into the shrine, burn the booths
    in front of it, and depart quickly.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A profane man without permission is said to have entered the shrine out of
    curiosity when the pyre began to burn, seen the place full of spectres, returned
    to Tithorea, reported what he saw, and died.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Phoenician informant reports that Egyptians hold the festival of Isis at
    the time when she is said to mourn for Osiris.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: At that season the Nile begins to rise, and a native saying attributes the
    rising and watering of fields to the tears of Isis.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Roman governor of Egypt is said to have bribed a man to enter the shrine
    of Isis at Coptos; the man returned, reported what he saw, and immediately died.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The quoted passage concludes with the saying that it is harmful for humans
    to see the gods in bodily shape.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The author states that peoples of Syria venerated Isis and identified her
    with certain local goddesses.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The author states that early Christians bestowed some attributes of Isis upon
    the Virgin Mary.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The author states that representations of Isis suckling Horus formed the foundation
    for Christian Madonna and Child figures and paintings.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The author states that incidents in Apocryphal Gospel accounts of the Virgin
    and Child in Egypt reflect scenes from the life of Isis described on the Metternich
    Stele.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: The author connects Neith with parthenogenesis, Isis with the conception of
    Horus through power given by Thoth, and Egyptian religion with belief in bodily
    resurrection and everlasting life.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: The author notes the probability that some early Egyptian Christian heresies
    resulted from survival and adaptation of ideas connected with old native gods.
  category: relationship
  evidence_refs:
  - ev:9
