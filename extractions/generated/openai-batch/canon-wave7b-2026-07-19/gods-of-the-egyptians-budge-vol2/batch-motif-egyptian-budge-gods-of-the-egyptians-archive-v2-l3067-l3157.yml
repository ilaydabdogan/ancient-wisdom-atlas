canonical_text:
  quote: I am Khnemu the Creator.
  summary: Tcheser asks Mater where the Nile rises and which deity guards it. Mater
    identifies Elephantine, the double cavern Qerti, and Khnemu as guardian of the
    Nile flood. Tcheser sacrifices and supplicates Khnemu; Khnemu appears, declares
    himself creator, primeval watery abyss, and Nile, and promises the annual rise
    after famine. Tcheser decrees lands and taxes for Khnemu's temple. The passage
    then describes Khnemu as ram-symbolized creator, cosmic architect, and possessor
    of seven forms.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: King Tcheser asks his governor Mater where the Nile rises and what god or
    goddess is its tutelary deity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mater reports that the Nile flood comes from the Island of Elephantine, described
    as the first city that ever existed and as a place from which the Sun rose to
    give life to humans.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Nile source on Elephantine is called the double cavern Qerti and is likened
    to two breasts from which good things pour forth; it is also called the couch
    of the Nile.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Nile-god waits until the inundation season approaches and then rushes
    forth like a vigorous young man to fill the country; the passage gives different
    flood heights at Elephantine and Diospolis Parva.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Khnemu is named as guardian of the flood, keeper of the doors that hold it
    in, and the one who draws back the bolts at the proper time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mater describes the temple of Khnemu at Elephantine, names other gods in it,
    and lists local products from which offerings should be made to Khnemu.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: After hearing Mater, the king offers sacrifices to Khnemu and enters the temple
    to make supplication before him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Khnemu appears and speaks, identifying himself as creator, protector of Tcheser,
    giver of Tcheser's heart, self-created being, primeval watery abyss, Nile, guide
    and director of men, father of the gods, Shu, and possessor of the earth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Khnemu promises that the Nile will rise every year as formerly and describes
    the good that will come when the famine ends.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Tcheser issues a decree setting aside lands near Elephantine and levying a
    tax on local products for the temple and priesthood of Khnemu; the decree is copied
    onto a stone stele.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The narrator states that the summarized narrative of the Seven Years' Famine
    has a Ptolemaic form but probably preserves much older subject matter, possibly
    from the Early Empire.
  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: Khnemu's spirit or soul is described as pervading all things, his symbol is
