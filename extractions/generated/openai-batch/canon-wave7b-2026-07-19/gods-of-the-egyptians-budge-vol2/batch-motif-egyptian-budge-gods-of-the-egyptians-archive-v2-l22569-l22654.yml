canonical_text:
  quote: ''
  summary: The passage surveys Egyptian mythological and cultic roles of the lynx/Maftet,
    the cat as sacred to Bast and as a solar form of Ra, cat reverence and funerary
    treatment reported by monuments and classical authors, and the dog-headed ape
    as Thoth’s companion in the Judgment Scene.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The lynx is identified by the Egyptian name Maftet, with spellings associated
    with the Pyramid Texts and the Theban Recension of the Book of the Dead; it is
    described as a large cat-like animal with ear tufts and a generally benevolent
    disposition.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the text of Unas, Maftet is said to attack the serpents An-ta-f and Tcheser-tep,
    and the passage infers that the Lynx-god was a friend of the dead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Theban Recension of the Book of the Dead, Maftet joins gods including
    Serqet and Maat in overthrowing Apep; the passage states that the lynx was treated
    as a destroyer of serpents and a warder against serpent attacks on the dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The cat was sacred to Bast of Bubastis, regarded as her incarnation, and also
    described as an ancient cult animal and a personification of the Sun-god.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: In Book of the Dead chapter xvii, a Cat is placed by the Persea tree in Heliopolis
    on the night when the foes of Osiris were destroyed; the commentary identifies
    the male Cat as Ra, called Mau by the god Sa.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The vignette described in the passage depicts the Cat cutting off the head
    of the serpent of darkness.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In Book of the Dead chapter cxxv, the deceased says he has heard the mighty
    word spoken by the Ass to the Cat in the House of Hapt-re; the passage says the
    word itself is not stated.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that the Ass and the Cat are forms of the Sun-god and suggests
    that the deceased probably learned from them words for vanquishing the powers
    of darkness.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'Two steles are described: one records prayers offered to two cats by two
    women, with uncertainty about whether the cats are divine forms or pets; another
    shows worship offered to a swallow and a cat.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says monuments and inscriptions show great reverence for the cat
    throughout Egypt, and cites Diodorus on cats being fed bread, milk, and Nile fish
    and called to meals by special sounds.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: According to the Diodorus report in the passage, a dead cat was wrapped in
    linen, taken to embalmers, treated with spices and drugs, and placed in a prepared
    case.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Diodorus report says that killing a cat, whether intentionally or unintentionally,
    was punishable by death, and gives an example of a Roman killed by an angry populace
    after killing a cat.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Herodotus is cited as saying that during a conflagration Egyptians protected
    cats rather than putting out the fire, while cats escaped, leapt over men, and
    threw themselves into the fire, causing lamentations.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Herodotus is cited as saying that when a cat dies naturally in a house, the
    family shaves only the eyebrows, and that dead cats are embalmed and buried in
    Bubastis.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The dog-headed ape is described as the most revered of the sacred apes, the
    companion of Thoth, and an animal present in Egyptian mythology from an early
    period.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:16
  text: In the Judgment Scene, the dog-headed ape sits on the standard of the Great
    Scales and reports to Thoth when the pointer marks the middle of the beam.
  category: action
  evidence_refs:
  - ev:12
