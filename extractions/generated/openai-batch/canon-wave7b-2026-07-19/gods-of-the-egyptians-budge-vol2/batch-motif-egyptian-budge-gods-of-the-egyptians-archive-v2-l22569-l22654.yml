comparison_claims:
- id: claim:1
  claim: The passage links Maftet’s serpent-attacking role in the Pyramid Texts of
    Unas with Maftet’s participation in overthrowing Apep in the Theban Recension
    of the Book of the Dead, supporting a cautious same-function comparison within
    Egyptian funerary texts.
  claim_level: same_function
  target: Pyramid Texts of Unas and Theban Recension of the Book of the Dead
  evidence_refs:
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage summarizes rather than quotes both source contexts, and
    it does not provide the full ritual or narrative setting of either text.
- id: claim:2
  claim: The passage connects the Cat’s solar identity in Book of the Dead chapter
    xvii with the Ass and Cat as solar forms in chapter cxxv, supporting a cautious
    same-function comparison around solar animal forms opposing darkness.
  claim_level: same_function
  target: Book of the Dead chapters xvii and cxxv as summarized in the passage
  evidence_refs:
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The chapter cxxv connection to vanquishing darkness is presented by
    the author as probable, and the actual mighty word is not given.
- id: claim:3
  claim: The passage juxtaposes monument and inscription evidence with Diodorus and
    Herodotus to support a cautious comparison of cat reverence, embalming, and burial
    as a consistent Egyptian cultic pattern also reported by classical writers.
  claim_level: same_function
  target: Egyptian monuments/inscriptions and classical accounts of Diodorus and Herodotus
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison concerns reported cultic practice rather than a myth
    narrative, and the passage does not independently verify each classical report.
