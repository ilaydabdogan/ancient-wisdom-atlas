canonical_text:
  quote: ''
  summary: The passage describes Osiris as opposed by Set, identified with the past
    and with regenerative power expressed through Horus, and personified as the falling
    or winter Nile, the night sun, and the winter sun. It explains that the Nile’s
    annual cycle was compared with human life and immortality, then summarizes Plutarch’s
    account of Osiris’s birth, kingship, civilizing acts, murder by Typhon/Set and
    his companions, Isis’s mourning and search, the waterborne chest, and the tamarisk
    tree that encloses it.
  language: English
  quote_policy: summarized
