canonical_text:
  quote: ''
  summary: The hymn addresses Osiris as a beneficent spirit among divine spirits.
    It describes him drawing waters from Nu, bringing evening wind and air to his
    nostrils, satisfying and germinating his heart, producing light and divine food,
    receiving obedience from heaven and star-gods, opening great gates, being praised
    in the southern and northern heavens, being associated with imperishable and never-resting
    stars, and receiving an offering.
  language: English with Egyptian transliteration
  quote_policy: summarized
