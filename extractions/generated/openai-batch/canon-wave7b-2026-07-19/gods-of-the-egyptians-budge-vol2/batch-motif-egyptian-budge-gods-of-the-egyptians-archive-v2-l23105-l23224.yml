  summary: The passage surveys Egyptian veneration of the ibis and several reptiles.
    It links the ibis with Hermopolis, the Moon, and Thoth, and reports a story in
    which ibises destroy winged serpents attempting to enter Egypt. It then describes
    the tortoise or turtle as a feared sacred reptile associated with darkness and
    opposition to Ra, and discusses serpents, snakes, the uraeus cult of Uatchet at
    Buto, and related royal titles.
