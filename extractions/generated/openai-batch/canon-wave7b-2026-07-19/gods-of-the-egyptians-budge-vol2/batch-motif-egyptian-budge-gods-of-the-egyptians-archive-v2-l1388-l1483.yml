canonical_text:
  quote: ''
  summary: 'The passage describes three ritual or funerary passages concerning Amen/Amen-Ra:
    a Chapter clxii cow amulet intended to keep heat in the deceased body in the Underworld;
    a Chapter clxiii address to Amen as divine Bull Scarab and lord of two Utchats;
    and a Chapter clxv petition to Amen-Ra that enumerates magical names and asks
    for bodily preservation, divine likeness, and escape from an evil chamber in the
    underworld.'
  language: English
  quote_policy: summarized
