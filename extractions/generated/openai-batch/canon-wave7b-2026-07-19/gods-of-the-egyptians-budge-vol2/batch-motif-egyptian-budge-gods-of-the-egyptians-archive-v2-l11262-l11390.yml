canonical_text:
  quote: ''
  summary: The passage discusses Apis in relation to Ptah, Osiris, Asar-Hapi, and
    Serapis. It states that Apis acquired funereal and Underworld associations, was
    called the renewed life and second form of Ptah, was identified with Osiris through
    the title “Bull of the West,” and was believed to be animated by the soul of Osiris.
    A sepulchral tablet is described as showing the deceased adoring Osiris, Serapis,
    and other gods.
  language: English
