canonical_text:
  quote: I die and I am born again each day.
  summary: The passage surveys Egyptian religious associations of serpents, scorpions,
    beetles, mantis-like insects, and frogs. It contrasts Apep as a monster serpent
    and enemy with the uraeus as a royal and divine emblem; describes a funerary formula
    allowing the deceased to become the serpent Sata and renew daily; links scorpions
    and the scorpion-goddess Serqet with Isis, the deceased, and child Horus; describes
    the Apshait beetle as attacking the dead body; describes Abit or Bebait as guiding
    the deceased to underworld gods; and presents the frog and frog-goddess Heqet
    as signs of generation, birth, fertility, and creation.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Apep or Apophis is described as a monster serpent, enemy of Horus, Ra, Osiris,
    and the deceased in the Underworld, directing attacks by serpent broods and personifying
    evil.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The uraeus is described as a symbol of divinity and royalty, appearing on
    the abode of Osiris, on Ra's forehead, and on the forehead of every king.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Priests are said to have supplied formulae enabling a person after death to
    assume forms of birds and reptiles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One formula gives the deceased power to become the serpent Sata, who says
    that he dies, is born again, renews himself, and grows young each day.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The uraeus is associated in religious texts with Isis and Nephthys because
    those goddesses were later identified with Uatchet, the uraeus-goddess.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Uatchet is described as having been absorbed into many great goddesses who
    were regarded as benevolent protectors of house, land, crops, and children.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The scorpion was venerated in Egypt from a very early period, and the scorpion-goddess
    Serqet or Selqet is described as having aspects connected with evil and other
    aspects connected with Isis.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: In cited chapters of the Book of the Dead, Serqet appears as a friend of the
    deceased, and the deceased's teeth are identified with hers.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the legend of Isis on the Metternich Stele, Isis travels accompanied by
    Seven Scorpions, and the child Horus is stung by a scorpion despite Isis's precautions.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Aelian is cited for the claim that scorpions of Coptos were deadly but did
    not sting women who went barefoot or prostrated themselves at the temple of Isis.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Apshait beetle is said in a chapter of the Book of the Dead to gnaw the
    bodies of the dead; vignettes show the deceased threatening it with a knife or
    spearing it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Apshait is identified by the author as probably the beetle found crushed in
    mummy bandages or inside bodies, where it had forced its way in search of food.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The insect Abit or Bebait is said to lead the deceased into the House of the
    King and bring him to see the great gods in the Underworld.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The frog is described as a primitive symbol of generation, birth, and fertility,
    and the frog-goddess Heqet or Heqtit is identified with Hathor.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: Heqet is described as the female counterpart of Khnemu and as mother of Heru-ur.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: The primeval gods Heh, Kek, Nau, and Amen are said to be depicted with frog
    heads, while their female counterparts have serpent heads.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:17
  text: The frog-god and frog-goddess are said to have played prominent parts in the
    creation of the world.
  category: action
  evidence_refs:
  - ev:9
