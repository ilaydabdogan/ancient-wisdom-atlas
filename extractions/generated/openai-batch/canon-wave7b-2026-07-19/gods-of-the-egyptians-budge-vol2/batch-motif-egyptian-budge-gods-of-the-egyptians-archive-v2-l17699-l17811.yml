  summary: The passage describes an Edfu relief of the gods of the Four Senses, including
    the solar disk in a boat and a king offering Maat; a bull-headed variant form
    of Setem; Ba as a World-Soul symbolized by a bearded man-headed hawk; the double
    divine soul of Ra and Osiris inhabiting Tchafi; the World-Body identified with
    Osiris, Neith, or local gods; human and divine component parts; multiple divine
    souls and doubles; and the beginning of a list of goddesses of the Twelve Hours
    of the Night.
