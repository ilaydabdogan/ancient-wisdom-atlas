canonical_text:
  quote: ''
  summary: The passage recounts Isis mourning over Osiris' corpse in a chest, the
    deaths and variant traditions concerning a royal child, explanations of Maneros
    and a banquet skeleton custom, Typho's discovery and dismemberment of Osiris into
    fourteen pieces, and Isis' renewed search by papyrus boat, including explanations
    for multiple sepulchres and the unrecovered member eaten by Nile fish.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Isis makes a loud lamentation that frightens the younger of the king's sons
    to death; she takes the elder son with her and sails with the chest for Egypt.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In anger, Isis dries up the current of the river Phaedrus after it sends forth
    rough and sharp air.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At a desert place, Isis opens the chest, lays her face on her dead husband's
    face, embraces his corpse, and weeps.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A little boy secretly observes Isis' grief; in one version he dies of fright
    after Isis gives him a fierce look.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Alternative accounts say the boy fell into the sea, was honoured as Maneros,
    was named Palaestinus or Pelusius, or that Maneros was an inventor of music or
    a banquet greeting formula.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A human skeleton in a box is carried around and shown to guests at banquets;
    the passage reports an explanation that it reminds them of mortality and urges
    enjoyment of present goods.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Isis intends to visit her son Orus, who is being brought up at Butos, and
    leaves the chest in a remote place.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Typho finds the chest while hunting by moonlight, recognizes the body inside,
    tears it into fourteen pieces, and scatters them in different parts of the country.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After learning of the dismemberment, Isis searches again for the scattered
    fragments of her husband's body.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Isis uses a boat made of papyrus reed to pass through lower and fenny parts
    of the country during her search.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage reports that crocodiles do not touch people sailing in such papyrus
    vessels, either from fear of the goddess or respect for the vessel that carried
    her.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Many sepulchres of Osiris are explained either as burial places for limbs
    found by Isis or as images distributed by Isis to spread honours and mislead Typho.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Isis is unable to recover Osiris' privy member; it had been thrown into the
    Nile and devoured by the Lepidotus, Phagrus, and Oxyrynchus fish.
  category: sequence
  evidence_refs:
  - ev:8
