canonical_text:
  quote: ''
  summary: The passage first cites an address to Khnemu-Shu in which heaven is raised
    as a dwelling for the god's soul and the great deep is made as a hiding-place
    for his body, then notes that Khnemu-Shu absorbed attributes of several gods and
    that goddesses were identified with his female counterparts. It then introduces
    Aten as both sun-god or solar spirit and the solar disk, describes his obscure
    and provincial origin near Heliopolis, and states that in the XVIIIth Dynasty
    he was made to take titles and attributes of older Egyptian solar gods. Book of
    the Dead passages associate Ra, Aten, the horizon, a mountain, life-giving light,
    and beams of light.
  language: English
  quote_policy: summarized
