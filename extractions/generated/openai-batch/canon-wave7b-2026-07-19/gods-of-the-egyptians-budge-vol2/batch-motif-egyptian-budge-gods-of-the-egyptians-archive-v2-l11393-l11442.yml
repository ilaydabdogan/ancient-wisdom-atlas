canonical_text:
  quote: ''
  summary: The passage describes Serapis as related to Osiris and Ptah, describes
    the double god Asar-Hapi/Hapi-Asar in bull form with solar and uraeus imagery,
    and recounts a tradition in which Ptolemy Soter sought a Greek-Egyptian common
    shrine at Alexandria. It then narrates Ptolemy's dream of a colossal statue that
    commanded removal to Alexandria, Sosibius's identification of a similar statue
    at Sinope, and the tradition that the reluctant inhabitants of Sinope eventually
    lost the statue when it acted of its own accord after three years. A footnote
    adds a caution about Ur-sheps-f being called a son of Ptah.
  language: English
  quote_policy: summarized
