canonical_text:
  quote: ''
  summary: The passage gives caption-like descriptions of several funerary representations
    of Osiris. Osiris lies on a bier in varied forms, with divine attendants or protective
    beings placed at his head, foot, above the bier, or beneath it. Isis, Nephthys,
    the four children of Horus, Uatchet, Nekhebet, a hawk, a Hawk-goddess, and a Vulture-goddess
    appear in relation to the bier, along with funeral objects such as crowns, caps,
    a tunic, a funeral chest, and the Atef Crown.
  language: English
  quote_policy: summarized
