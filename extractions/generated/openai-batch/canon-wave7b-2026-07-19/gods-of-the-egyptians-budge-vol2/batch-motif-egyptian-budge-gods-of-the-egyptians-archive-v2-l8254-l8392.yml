canonical_text:
  quote: HYMN   TO    OSIRIS
  summary: A hymn segment praises Osiris with a sequence of divine epithets and sacred-place
    associations. The praised figure is called a hidden soul, lord of Qerert, holy
    one in White Wall, soul of Ra, recipient of offerings and praise, lord of the
    Great House in Khemennu, lord of eternity, chief of Abydos, and seated in the
    Land of holiness. The final visible fragment also names Tern as a divine god and
    chief of the paut, though the context is damaged.
