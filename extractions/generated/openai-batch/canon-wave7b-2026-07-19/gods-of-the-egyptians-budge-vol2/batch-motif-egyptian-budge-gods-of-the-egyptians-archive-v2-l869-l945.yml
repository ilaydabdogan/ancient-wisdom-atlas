  quote: ''
  summary: A hymn praises Amen-Ra/Ra as maker of living beings, crops, gods, heaven,
    and earth; as a divine child begotten by Ptah; as solar ruler sailing the sky;
    as royal lord of the Two Lands bearing crowns and sceptres; and as a radiant deity
    whose flame and Eye defeat enemies, fiends, and the serpent-fiend Nak. A footnote
    cites a Text of Unas passage concerning royal sceptres and command authority.
  language: English
  quote_policy: summarized
