canonical_text:
  quote: ''
  summary: 'The passage describes Egyptian deities associated with intelligence and
    the senses: Saa as intelligence, Hu as taste and divine food, Maa as sight, and
    Setem as hearing. It records their iconography, roles in funerary and judgment
    contexts, creation from Ra’s blood, relation to the deceased, and Hu’s presence
    at the birth of Horus.'
