canonical_text:
  quote: ''
  summary: The passage surveys cult centers and forms of Sebek, reports classical
    and later beliefs about crocodiles, describes the hydrus and human methods of
    killing crocodiles, and summarizes Egyptian mythological roles of the crocodile
    as protector, solar symbol, helper and enemy of Osiris, and threat to Horus from
    which Isis protects him with a papyrus ark.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sebek is said to have been merged with Ra at Smen and held there to be the
    father of Horus.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Pa-Sebek and Hermonthis, Sebek-Seb is described as connected with a local
    triad and as merged with Menthu, becoming a counterpart of Menthu-Ra and Amen-Ra.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Tuphium, near Thebes, Sebek was worshipped in crocodile form with a sun-disk
    and the feathers of Amen on his head.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Krokodilonpolis-Arsinoe near Lake Moeris is identified as the chief 'city
    of Sebek.'
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the city of Apis in the Libyan nome, Osiris was worshipped under the form
    of a crocodile, while Isis was worshipped in her usual form.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Classical writers are reported as attributing unusual traits to crocodiles,
    including quietness during the Apis festival, lack of a tongue, winter fasting,
    and blindness in water.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A small bird called the trochilus is said to enter the sleeping crocodile's
    open mouth and remove leeches from its teeth and gums.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The hydrus or ichneumon is said to enter the crocodile's mouth, crawl into
    its stomach, devour its entrails, return out again, and also break crocodile eggs
    found in the sand.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: People are described as catching crocodiles by lowering a pig-chine baited
    hook into the river while beating a young pig on the bank to make it squeal; after
    the crocodile swallowed the hook, it was landed, its eyes plastered, and it was
    slain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Crocodiles are said to have been regarded at one time as protectors of Egypt
    against robbers swimming across the Nile.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The crocodile is described as playing a prominent part in Egyptian mythology
    and appearing both as friend and foe of Osiris.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: One legend says that a crocodile carried the dead body of Osiris on its back
    safely to land.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Another legend says that Isis made a little ark of papyrus plants for her
