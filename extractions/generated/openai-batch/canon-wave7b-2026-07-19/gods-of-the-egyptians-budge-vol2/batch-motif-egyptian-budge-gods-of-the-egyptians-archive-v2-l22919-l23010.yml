- id: motif:6
  label: Rebirth of the phoenix from its predecessor’s remains
  taxonomy_refs:
  - dying_and_returning
  - death_rebirth
  - resurrection
  basis: The Plinian report describes the old phoenix dying in an aromatic nest and
    a worm from its bones and marrow becoming a new bird that buries the predecessor.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is a classical report cited in the passage, not a direct Egyptian
    text.
- id: motif:7
  label: Female-only bird fecundated by wind
  taxonomy_refs:
  - sacred_birth
  - miraculous_child
  basis: Aelian’s report says all vultures are female and obtain young by turning
