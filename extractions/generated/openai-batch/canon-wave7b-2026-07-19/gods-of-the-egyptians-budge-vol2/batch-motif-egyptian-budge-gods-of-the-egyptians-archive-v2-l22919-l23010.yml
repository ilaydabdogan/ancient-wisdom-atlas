- id: motif:3
  label: Resurrection as life springing from death
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: The passage explicitly says the Bennu symbolizes mankind’s resurrection because
    the spiritual body springs from the dead physical body like today’s sun from yesterday’s
    dead sun.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The claim is framed through Budge’s exposition of Egyptian belief.
- id: motif:4
  label: Deceased transformed into sacred bird
  taxonomy_refs:
  - shapeshifter
