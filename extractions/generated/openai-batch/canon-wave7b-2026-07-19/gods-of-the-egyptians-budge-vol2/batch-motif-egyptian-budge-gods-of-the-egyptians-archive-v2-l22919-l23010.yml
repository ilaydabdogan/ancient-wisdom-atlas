- id: motif:5
  label: Solar bird carries and buries the father’s body
  taxonomy_refs:
  - divine_parent_child
  - death_rebirth
  basis: The Herodotean report says the phoenix carries its father’s body in a myrrh
    egg to the temple of the sun and buries him there.
  evidence_refs:
