comparison_claims:
- id: claim:1
  claim: The passage explicitly identifies the Egyptian Bennu with the Phoenix and
    juxtaposes Egyptian Bennu symbolism with Herodotus’s and Pliny’s phoenix-renewal
    accounts.
  claim_level: same_motif
  target: Classical Phoenix tradition as reported by Herodotus and Pliny
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supports identification and comparison, but it does not
    by itself establish the historical process by which Egyptian Bennu traditions
    and classical phoenix accounts are related.
- id: claim:2
  claim: 'The passage compares the Bennu’s solar renewal function with human resurrection:
    the living sun arises from the dead sun as the spiritual body arises from the
    dead physical body.'
  claim_level: same_function
  target: Solar rebirth pattern and human resurrection pattern
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: This is an analogy stated in the passage; it is not an independent
    cross-cultural comparison.
