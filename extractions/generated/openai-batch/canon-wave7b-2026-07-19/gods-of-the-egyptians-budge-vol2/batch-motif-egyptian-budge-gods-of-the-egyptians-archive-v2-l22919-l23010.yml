canonical_text:
  quote: "“The Bennu ... was identified with the Phoenix.”"
  summary: The passage surveys Egyptian sacred animals and birds, especially the hare,
    Bennu/Phoenix, vulture, and hawk. It describes hare-headed divinities, the Bennu
    as a self-created solar and resurrection bird linked with Osiris and the Book
    of the Dead, classical phoenix traditions reported by Herodotus and Pliny, vulture
    symbolism for goddesses and royal titulary, and the hawk as sacred to solar and
    related gods and as a symbol of the human soul.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The hare is described as worshipped as a deity, and the vignette of the Elysian
    Fields shows a hare-headed god seated beside snake-headed and bull-headed gods.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A hare-headed god guards one of the Seven Halls in the Underworld, and the
    Hare-god is said probably to have been called Unnu.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bennu is described as a bird of the heron species and is identified with
    the Phoenix.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Bennu is said to have created itself and to have come into being from
    fire burning on the top of the sacred Persea Tree of Heliopolis.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Bennu is described as essentially a Sun-bird and as a symbol both of the
    rising sun and of the dead Sun-god Osiris.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Bennu typified the new birth of the sun each morning and became a symbol
    of the resurrection of mankind; a spiritual body was believed to spring from the
    dead physical body.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Bennu is said to have sprung from the heart of Osiris and is represented
    in a picture sitting on tree branches beside a sepulchral chamber.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: Chapter 83 of the Book of the Dead is described as giving a formula that enables
    the deceased to take the form of the Bennu.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the passage’s report of Herodotus, the phoenix appears once in five hundred
    years, comes from Arabia, carries the body of its father enclosed in an egg of
    myrrh to the temple of the sun, and buries him there.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the passage’s report of Pliny, the aged phoenix builds a nest of cassia
    and incense, dies there, and from its bones and marrow a worm arises that becomes
    a little bird; the new bird buries its predecessor’s remains and carries the nest
    to the City of the Sun.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The vulture is described as the symbol of Nekhebet, Mut, Neith, and other
    goddesses identified with Nekhebet; its cult is said to be extremely ancient in
    Egypt.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: One old pharaonic title is given as lord of the city of the Vulture and lord
    of the city of the Uraeus.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the passage’s report of Aelian, vultures hover around the dead and dying,
    all vultures are female, and they are fecundated by the south or south-east wind.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The hawk is described as sacred to Horus, Ra, Osiris, Seker, and other cognate
    gods; its worship is said to have been universal throughout Egypt in predynastic
    times.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The hawk is described as a Sun-bird, and when shown with a human head it is
    symbolic of the human soul.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage reports that killing a hawk or ibis was punished by death and
    that sacred hawks were maintained at public expense.
  category: action
  evidence_refs:
  - ev:10
