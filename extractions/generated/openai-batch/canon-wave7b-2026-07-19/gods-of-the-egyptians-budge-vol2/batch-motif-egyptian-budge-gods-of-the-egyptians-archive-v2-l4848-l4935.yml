canonical_text:
  quote: ''
  summary: 'The passage summarizes scholarly and textual statements about Shu, Tefnut,
    and Bebi/Baba: Shu is associated with rays from Ra''s eyes, fiery noon heat, the
    north wind, atmosphere, breath, pillars holding up the sky, serpent-control, the
    opening of the mouth, and the ladder to heaven; Shu and Tefnut share one soul
    and are connected with Osiris, Ra, Tattu, and the deceased; Tefnut is described
    as Shu''s counterpart and as providing breath; Bebi/Baba is described as a first-born
    son of Osiris, a Typhonic animal-like figure, and as linked to blood that becomes
    plants and cedars.'
  language: English
  quote_policy: summarized
