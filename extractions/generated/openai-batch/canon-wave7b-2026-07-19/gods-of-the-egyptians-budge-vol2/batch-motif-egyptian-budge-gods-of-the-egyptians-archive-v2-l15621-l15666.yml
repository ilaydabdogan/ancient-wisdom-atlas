  quote: ''
  summary: 'The passage identifies the Metternich Stele as a late native Egyptian
    monument and describes a front-scene: a solar disk contains the seated four-fold
    god Khnemu, representing the gods of earth, air, fire, and water. The image rests
    between a sign rendered in the text as “LJ,” supported on a lake of water. Four
    apes stand on each side with paws stretched out in adoration. The passage adds
    that the apes are unnamed on this stele but may be named in an Edfu text.'
