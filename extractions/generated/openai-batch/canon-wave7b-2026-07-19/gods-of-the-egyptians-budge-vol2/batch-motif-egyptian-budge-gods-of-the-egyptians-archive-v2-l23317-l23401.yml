canonical_text:
  quote: ''
  summary: The passage reports classical and Egyptian associations of frogs, grasshoppers,
    and scarab beetles. Frogs are described as imperfectly formed creatures generated
    from river slime. Grasshoppers are associated with a Field of the Grasshoppers
    in the Book of the Dead and with the heavenly arrival of Pepi II. The scarab beetle
    is identified as the symbol of Khepera, a creator and resurrection god linked
    with self-generation, the rising sun, new birth, and the renewal of life. The
    passage also describes dung beetle reproduction and explains how the beetle rolling
    an egg-bearing ball was compared with Khepera rolling the sun across the sky.
  language: English
  quote_policy: summarized
