canonical_text:
  quote: ''
  summary: A hymn praises Aten as the self-existing creator of earth, humans, animals,
    lands, seasons, heaven, and the Nile/Hapi. Aten provides for peoples, differentiates
    their languages and characteristics, sends life-giving waters, rises and returns
    in a visible path, and uniquely makes his son Nefer-kheperu-Ra-ua-en-Ra wise and
    knowing.
  language: English
  quote_policy: summarized
