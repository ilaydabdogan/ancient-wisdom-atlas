  text: Aten is addressed as having created the earth at will while existing by himself,
    including men and women, animals, flying creatures, Syria, Nubia, and Egypt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aten sets each man in his place, provides what people need, measures each
    life, and makes differences in tongues, dispositions, skins, and desert dwellers
    discernible.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hapi, identified as the Nile, is made in the Tuat and brought according to
    Aten’s will so that rational beings may live.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Aten is described as making Hapi in heaven come down, with rushing waters
