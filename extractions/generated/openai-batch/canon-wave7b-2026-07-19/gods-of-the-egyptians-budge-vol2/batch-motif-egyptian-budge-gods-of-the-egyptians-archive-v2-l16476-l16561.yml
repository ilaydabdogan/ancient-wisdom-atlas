  - ev:3
- id: obs:7
  text: In the birth chamber scene, Meskhent, goddesses acting as midwives, nurses,
    and gods of the four quarters wait to minister to Hatshepset and to her Ka.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Bes and Ta-urt stand by the couch in the birth chamber scene; Ta-urt is represented
    as a hippopotamus standing on her hind legs and leaning on an emblem of magical
    protection.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that the precise function of Bes and Ta-urt for the princess
    is not apparent, but their presence in royal lying-in rooms was considered important
    to mother and child.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: Bes is said not to occur in the Heliopolitan and Theban Recensions of the
    Book of the Dead, but to appear in a Saite Recension vignette guarding one pylon
    of the house of Osiris in the Underworld.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Under the New Empire, the passage says Bes assumed the character of a solar
    god and became identified with Horus the Child, or Harpocrates.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says Bes was gradually merged in other forms of the Sun-god and
    absorbed characteristics of Horus, Ra, and Temu.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: As Horus or Harpocrates, Bes is described as wearing the lock of hair symbolic
    of youth on the right side of his head.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: As Ra-Temu, Bes is described as receiving withered cheeks and attributes of
    an old man.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: On the Metternich Stele, the head called the Old Man who renews his youth
    and the Aged One who becomes a boy is placed above the head of Horus, showing
    two phases of one god according to the passage.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: After the XXVIth Dynasty and during the Ptolemaic period, bronze figures show
    Bes merged wholly in Horus with hawk body and wings joined to the body of a vigorous
    young man and the head of a very aged man.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:17
  text: On the Metternich Stele, Bes is described as wearing plumes of Shu and other
    gods of light and air, horns of Amen or the Ram of Mendes, eight knives, and the
    emblem of a million years.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:18
  text: Bes is described as holding emblems of sovereignty and dominion like those
