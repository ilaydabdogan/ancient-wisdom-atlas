canonical_text:
  quote: ''
  summary: The passage describes Bes as an Egyptian deity represented with weapons
    and on household or personal objects, associated with rest, pleasure, childbirth,
    and the protection of children. It discusses evidence for Bes at Kahun and Der
    al-Bahari, where Bes appears in the birth chamber of Hatshepset alongside Meskhent,
    Ta-urt, midwives, nurses, and other divine attendants. It further describes Bes
    as an underworld pylon guardian in a Saite Book of the Dead vignette, and as later
    modified into a solar form identified with Horus the Child, Harpocrates, Ra, and
    Temu. Later images show him with hawk features, aged and youthful traits, divine
    plumes and horns, knives, emblems of long duration and sovereignty, and crushed
    serpents while standing over Typhonic beasts.
  language: English
  quote_policy: summarized
