canonical_text:
  quote: ''
  summary: 'The passage catalogs local and general titles of Isis, including divine,
    maternal, royal, agricultural, fiery, and flood-related epithets. It then describes
    Isis as highly skilled in magic: she creates a venomous reptile from dust and
    Ra’s spittle to force Ra to reveal his hidden name, heals him with words of power,
    and uses such words to restore Osiris to life and obtain an heir, apparently through
    words received from Thoth.'
  language: English
  quote_policy: summarized
