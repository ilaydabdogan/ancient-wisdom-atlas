canonical_text:
  quote: ''
  summary: The passage summarizes a Metternich Stele episode in which Thoth gives
    Isis powerful incantations, Isis recites them, and Horus is restored after poison
    leaves his body. Budge then describes the stele as a protective talisman or amulet
    whose words of power could be ritually recited by people bitten or stung by harmful
    creatures. The passage then begins a chapter on foreign gods, describing Egyptian
    contact with alien deities, identification of some foreign gods with Egyptian
    gods, tolerance toward conquered gods, removal of foreign divine images, Libyan
    adoption into Egyptian religion, and the spread of the cult of Ra.
  language: English
  quote_policy: summarized
