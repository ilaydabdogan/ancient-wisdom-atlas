canonical_text:
  quote: ''
  summary: The passage describes Seb as hereditary chief of the gods and as an important
    figure in Book of the Dead scenes involving judgment, release from the earth,
    protection from serpents, food, opened thresholds, and divine inheritance. It
    then describes Seb and Nut at Heliopolis producing the Great Egg from which the
    Sun-god appears as a phoenix or Bennu, and distinguishes Egyptian Bennu symbolism
    from later classical phoenix stories of self-burning and rebirth.
  language: English
  quote_policy: summarized
