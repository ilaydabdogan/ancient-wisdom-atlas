canonical_text:
  quote: ''
  summary: The passage describes the scarab or scarabaeus as a symbol of life, resurrection,
    funerary renewal, solar association, and generation, including accounts from Pyramid
    Text material and Horapollo. It also introduces Egyptian fish cults and explains
    the sacred status of the Oxyrhynchus Fish through its connection with the dismembered
    body of Osiris.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the dead human body contained the germ of life, identified
    as the germ of the spiritual body, which was called into being by funeral prayers
    and ceremonies.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that, from this point of view, the egg-ball of the scarabaeus
    and the dead body were identical.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A model scarab placed on a dead body was thought to give potential life to
    that body and to keep life in a living body if proper words of power were first
    spoken over it or written on it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage reports a belief in Egypt and the Eastern Sudan that dried, pounded
    scarab mixed with water and drunk by women promotes large families.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A passage in the text of Unas says that Unas flies like a bird and alights
    like a beetle upon the empty throne in the boat of Ra.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports that Teta/Pepi textual material declares a figure to be
    the son of the scarab born in Hetepet under the hair of Iusaas the Northern and
    connected with the brow of Seb.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says that some classical writers held that female scarabs did
    not exist, and it reports Latreille's explanation that female scarabs closely
    resemble males.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: According to Horapollo as summarized in the passage, the scarabaeus denotes
    an only-begotten, generation, father, world, and man.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Horapollo's account says that the male scarab forms ox-dung into a world-like
    sphere, rolls it from east to west while facing east, buries it for twenty-eight
    days, opens it on the twenty-ninth day, throws it into water, and scarabs come
    forth from it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage reports that several Nile fish were known by name and that the
    Oxyrhynchus, Phagrus, Latus, and Lepidotus were especially worshipped.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Oxyrhynchus Fish was held in special reverence at Oxyrhynchus and was
    considered sacred because it was supposed to have swallowed the phallus of Osiris
    while Set hacked Osiris's body into pieces.
  category: relationship
  evidence_refs:
  - ev:7
