canonical_text:
  quote: ''
  summary: 'Fragment of an interlinear rendering from the “Sorrows of Isis”: Horus
    has been stung and stabbed; Isis checks for breath, opens the wound, finds poison,
    embraces him, and laments. Nephthys arrives weeping, and Serqet addresses Isis,
    telling her to pray to heaven so that Ra’s sailors and boat will stop.'
  language: English with Egyptian transliteration
