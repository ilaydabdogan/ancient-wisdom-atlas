canonical_text:
  quote: ''
  summary: Budge summarizes the Heliopolitan Great Company, describes Tem as an evening
    or night form of the Sun-god and local god of Annu, and treats Shu and Tefnut
    as paired deities associated respectively with dry heat/atmosphere and sky moisture.
    The passage gives an origin legend in which Tem produces Shu and Tefnut from his
    own body at Annu, later variants involving Tem's shadow or Iusaaset as wife, and
    hymnic material identifying Amen-Ra with Tem as the source of Shu, Tefnut, and
    the nine gods.
  language: English
  quote_policy: summarized
