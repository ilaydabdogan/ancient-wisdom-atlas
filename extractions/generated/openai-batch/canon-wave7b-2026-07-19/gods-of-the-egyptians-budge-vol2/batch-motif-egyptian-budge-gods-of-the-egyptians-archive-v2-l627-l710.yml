  quote: ''
  summary: Budge introduces Amen and Ament as very early Egyptian deities attested
    in the Pyramid Texts, places them among primeval gods associated with Nau and
    Nen, Shu and Tefnut, and Temt, interprets Amen as a hidden creative power linked
    to the primeval abyss, and lists five iconographic forms of Amen.
  language: English
  quote_policy: summarized
