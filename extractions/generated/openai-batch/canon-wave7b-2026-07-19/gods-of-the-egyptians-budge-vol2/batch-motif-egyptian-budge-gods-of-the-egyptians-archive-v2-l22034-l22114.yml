canonical_text:
  quote: ''
  summary: The passage describes the Serapeum galleries and ascetic holy men connected
    with rites for dead Apis bulls; then surveys Egyptian sacred bovine cults, especially
    Apis of Memphis, Mnevis of Heliopolis, and the Hermonthis bull Bacchis/Bakha,
    including their solar, lunar, Osirian, agricultural, and iconographic associations.
    It also recounts a story in which a wild bull set against Mnevis is defeated after
    its horns become caught in a persea tree.
  language: English
  quote_policy: summarized
