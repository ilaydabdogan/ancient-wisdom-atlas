canonical_text:
  quote: ''
  summary: The passage discusses ritual language connected with Unas and several gods,
    then describes festivals at Henen-su, including Neheb-kau, the Festival of Ploughing
    the Earth, Bast, and the annual reconstituting of the heavens. It also mentions
    Heneb and possible agricultural associations. The passage then turns to the Mendes
    form of Khnemu, identified with Ba-neb-Tettu, a ram deity interpreted as the Soul
    and life of Ra, associated with virility, the Nile, life-giving power, four heads,
    and four ram-shaped Souls connected with Ra, Osiris, Seb, and Shu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ritual address names Netetthab as daughter of four gods in the Great House
    and asks that figures uncover themselves so that Unas may see them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ritual comparison says Unas may see as Horus sees Isis, as Nehebu-kau
    sees Serqet, as Sebek sees Net or Neith, and as Set sees Netetthab.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Festivals in honor of Neheb-kau at Henen-su are said to have been celebrated
    on the first of Tybi, nine days after the Festival of Ploughing the Earth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Festival of Ploughing the Earth is linked with the time when people began
    to plough after the waters of the Inundation had subsided.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The ceremony of ploughing the earth is described as having a double signification:
    it commemorated the burial of Osiris and symbolized ploughing the land for sowing
    the next year''s crop.'
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: Festivals of Bast were celebrated in the spring, and a festival called the
    hanging out of the heavens is explained as the supposed yearly reconstituting
    of the heavens in spring.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: The god Heneb is mentioned in connection with Henen-su; in the Saite period
    the official Heru planted two vineyards for him, and the author says his attributes
    are unknown but probably connected with grain and other products of the land.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A god called Henbi in the Book of the Dead is said to appear identical with
    Heneb of Heru's stele.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Khnemu worshipped at Mendes is identified with Ba-neb-Tettu, glossed as the
    Ram, lord of Tettu, and also sometimes interpreted as the Soul, lord of Tettu
    because ba can mean both soul and ram.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The symbol of the Mendes local form of Khnemu is a ram.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ba-neb-Tettu is called the living soul of Ra, the holy Sekhem dwelling within
