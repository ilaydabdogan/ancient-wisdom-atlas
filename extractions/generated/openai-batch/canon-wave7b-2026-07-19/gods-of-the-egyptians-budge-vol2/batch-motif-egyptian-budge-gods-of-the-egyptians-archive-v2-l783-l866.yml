canonical_text:
  quote: ''
  summary: 'Budge describes the rise of Amen after Theban royal success, the theological
    joining of Amen with Ra into Amen-Ra, and two hymnic presentations of Amen-Ra:
    one from the Papyrus of Hu-nefer emphasizing unity, invisibility, vast duration,
    and cosmic travel, and a later hymn emphasizing Amen-Ra as bull, lord, king, chief
    of gods, and stabilizer of creation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Amen's power and glory increased after his royal devotees
    expelled the Hyksos and later kings of the XVIIIth Dynasty carried conquest into
    Palestine.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The priests of Amen asserted Amen's equality with older major gods and joined
    Amen's name with Ra's to form Amen-Ra.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Amen-Ra is described in the commentary as an invisible creative power and
    the source of life in heaven, earth, the great deep, and the Underworld, manifesting
    under the form of Ra.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that attributes familiar from hymns to Ra were ascribed
    to Amen after his union with Ra, and that Amen's priests declared him uniquely
    greatest among the gods.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the Papyrus of Hu-nefer, a hymn to Amen-Ra follows a hymn to Ra; Budge
    notes that the two gods are addressed separately there.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Hu-nefer hymn says Amen-Ra rests upon Maat, passes over the heavens, is
    seen by every face, and sends rays upon all faces.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Hu-nefer hymn calls Amen-Ra unknown, indescribable by any tongue except
    himself, one, lord over men, and able to hear and see.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Hu-nefer hymn describes Amen-Ra as a traveller who passes through immense
    spaces, steers across the watery abyss to a beloved place, then sinks down and
    ends the hours.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Budge comments that the first hymn chiefly emphasizes Amen-Ra's unity, invisibility,
    and long duration, and does not mention self-begetting, self-birth, creative powers,
    or defeat of the serpent-fiend Nak.
  category: other
  evidence_refs:
  - ev:9
- id: obs:10
  text: The later hymn praises Amen-Ra as Bull in Annu, chief of all the gods, beloved,
    giver of warmth-life to cattle, lord of the thrones of the two lands, ruler of
    Thebes, king of heaven, first-born god of earth, lord of existing things, and
    stabilizer of creation.
  category: speech
