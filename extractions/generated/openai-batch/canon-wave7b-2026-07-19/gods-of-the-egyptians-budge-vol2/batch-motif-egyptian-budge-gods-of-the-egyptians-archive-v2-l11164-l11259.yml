canonical_text:
  quote: ''
  summary: 'The passage recounts episodes after the dismemberment of Osiris: Isis
    consecrates an imitative phallus and establishes a festival; Osiris returns from
    the other world to encourage and train Orus; Orus prepares to avenge his parents,
    receives deserters from Typho, defeats Typho, and has his legitimacy judged by
    the gods. The passage also introduces Asar-Hapi or Serapis as a fusion of Osiris
    and Apis/Hapi, describing Apis as connected with Osiris after death and as a life-giving
    divine form.'
  language: English
  quote_policy: summarized
