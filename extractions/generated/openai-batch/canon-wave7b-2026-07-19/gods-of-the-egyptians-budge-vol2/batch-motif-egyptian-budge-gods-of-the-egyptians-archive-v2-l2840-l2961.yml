canonical_text:
  quote: ''
  summary: 'The passage first states that Mut, Isis, and Nekhebet are closely related
    and that Mut and Nekhebet were identified with Isis, with Uatchet also discussed
    in relation to Isis. It then introduces the triad of Abu or Elephantine: Khnemu,
    Satet, and Anqet. Khnemu is described as an ancient, exalted god, represented
    as ram-headed and associated with water, the Nile, the annual flood, the sun,
    the moon, and creative building. The passage says Khnemu made the first egg from
    which the sun sprang, made gods, fashioned the first man on a potter’s wheel,
    and maintained bodies and life.'
  language: English
  quote_policy: summarized
