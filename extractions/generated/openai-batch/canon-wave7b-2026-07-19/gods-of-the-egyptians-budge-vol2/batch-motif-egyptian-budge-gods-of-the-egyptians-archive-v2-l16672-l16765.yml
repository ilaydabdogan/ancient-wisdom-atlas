canonical_text:
  quote: ''
  summary: The passage discusses Merul, later Mandulis, as a god probably not of Egyptian
    origin, with connections to Ta-neter and cult centers at Telmes and Philae. It
    then summarizes and critiques a theory that several Egyptian gods were worshipped
    as pre-Islamic Arabian idols on the basis of similar names. The author allows
    that knowledge of Egyptian gods could have reached Arabia through Sinai mining
    and turquoise caravan routes, but states that proof is lacking for actual adoption
    or identity of the gods, except for a few local Arabian gods said to have been
    adopted in Egypt during the late Ptolemaic period.
  language: English
  quote_policy: summarized
