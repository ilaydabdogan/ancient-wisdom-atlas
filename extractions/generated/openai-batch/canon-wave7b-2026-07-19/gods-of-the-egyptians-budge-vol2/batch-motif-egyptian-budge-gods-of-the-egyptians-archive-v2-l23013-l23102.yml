  summary: 'The passage surveys sacred birds in Egyptian religious material: a divine
    hawk identified with the Bennu or Phoenix, funerary transformation into heron
    and swallow, offerings to swallows and geese, Isis taking swallow form while mourning
    Osiris, and goose associations with Amen-Ra, Seb, Isis, Egyptian place-names,
    and the hieroglyphic meaning “child.”'
