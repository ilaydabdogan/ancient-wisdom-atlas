canonical_text:
  quote: ''
  summary: The passage describes Nut under several identifications, including Api/Apet
    and Heqet; cites a Pyramid Text passage in which Api is mother of Unas and gives
    him milk; lists Nut's five children and their births on the five epagomenal days;
    and explains Nut's protective role for Osiris and for the deceased in the Tuat,
    including renewed bodily rising, solar journeying, and coffin inscriptions in
    which Nut spreads herself over the dead as coverer of heaven.
  language: English
  quote_policy: summarized
