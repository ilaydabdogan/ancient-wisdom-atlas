canonical_text:
  quote: ''
  summary: 'The passage compiles classical reports about the Apis bull: its identifying
    marks, ritual death or burial and mourning, discovery of a successor, oracular
    consultation at Memphis, public and festival appearances, costly care of sacred
    animals, transport of a new Apis by barge, and explanations connecting Apis with
    the soul or body of Osiris.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Apis is described as a black calf or bull with specific identifying marks,
    including white markings, an eagle figure on the back, double hairs in the tail,
    and a beetle on the tongue; Pliny adds a crescent-shaped white spot on the right
    side.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pliny reports that after Apis lived a certain number of years, the animal
    was destroyed by drowning in the priests' fountain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the death or destruction of Apis, general mourning occurred, and priests
    and others shaved their heads until a successor was found.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A found Apis was brought to Memphis, where two bed-chambers were set apart
    for him and used for favorable or unfavorable auguries depending on which chamber
    he entered.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Apis was said to answer devotees by taking food from the hands of those who
    consulted him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Apis was usually kept in seclusion, but when he appeared publicly, boys attended
    him and sang hymns.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Once a year a cow was presented to Apis, and the passage says she was killed
    on the same day she was found.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The birthday of Apis was marked by an annual seven-day festival, during which
    no man was said to be attacked by a crocodile.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A courtyard before the sanctuary of Apis contained another sanctuary for the
    dam of the god, and Apis was exhibited there to worshippers.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: Diodorus groups Apis with Mnevis, the Ram of Mendes, the crocodile of Lake
    Moeris, and the lion of Leontopolis as sacred animals kept at considerable expense
    and given special foods.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Sacred animals were washed in hot baths, anointed with precious unguents,
    perfumed, and provided with rich beds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: When sacred animals died, Egyptians were described as grieving as if for their
    own children and spending heavily on burial; an Apis keeper in the reign of Ptolemy
    Lagus borrowed fifty talents of silver to bury Apis.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: After the funeral of Apis, priests sought another calf as similar as possible
    to the former Apis; once found, mourning and lamentation ended.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The new young ox was led through the city of Nile, fed for forty days, placed
    in a barge with a golden cabin, transported as a god to Memphis, and placed in
    Vulcan's grove.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: During the forty-day period, only women were admitted to see the new ox; the
    passage says they exposed themselves before him and were afterward forbidden to
    see the new god.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: One explanation for adoring Apis is that the soul of Osiris passed into an
    ox and that the spirit of Osiris is infused into successive oxen.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: A variant explanation says that Isis put the members of Osiris, who had been
    killed by Typhon, into a wooden ox covered with ox-hides, and connects this with
    the name Busiris.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:18
  text: Aelian reports that Apis was recognized by twenty-nine marks known to the
    priests, housed near his birthplace in an east-facing house for four months, and
    later conveyed by barge to Memphis at the new moon.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: At Memphis, Aelian reports that Apis had chambers, spacious courts, carefully
    chosen cows, and a special well; he was not allowed to drink Nile water because
    it was thought too fattening.
  category: setting
  evidence_refs:
  - ev:8
