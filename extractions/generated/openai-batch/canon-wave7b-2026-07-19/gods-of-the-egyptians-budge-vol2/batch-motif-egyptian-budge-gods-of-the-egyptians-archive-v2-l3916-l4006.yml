canonical_text:
  quote: ''
  summary: The passage describes Amen-hetep IV as an early adherent of Aten worship
    who initially reigned at Thebes while outwardly serving Amen-Ra. It presents his
    titles and building activity as evidence of devotion to solar gods, then recounts
    mounting conflict with the priests of Amen-Ra, his foundation of a new capital
    called Khut-Aten, an edict against the name and image of Amen, and his renaming
    of himself in relation to Aten.
  language: English
  quote_policy: summarized
