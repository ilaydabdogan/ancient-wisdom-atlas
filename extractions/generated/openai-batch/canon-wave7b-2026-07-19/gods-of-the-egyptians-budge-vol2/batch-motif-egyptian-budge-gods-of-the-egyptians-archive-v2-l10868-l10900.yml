canonical_text:
  quote: "“the lord of all the earth is born”"
  summary: Plutarch’s account says Rhea was cursed by Helios not to give birth in
    any month or year after her stealth association with Kronos. Hermes wins portions
    of Selene’s illuminations, makes five added days, and these become divine birthdays.
    Osiris is born on the first added day and announced by a voice. A variant has
    Pamyles hear and proclaim Osiris’s birth while fetching water at Thebes; Kronos
    entrusts the child’s education to him, and the Pamylia festival is instituted
    in memory of the event.
  language: English
  quote_policy: quoted
