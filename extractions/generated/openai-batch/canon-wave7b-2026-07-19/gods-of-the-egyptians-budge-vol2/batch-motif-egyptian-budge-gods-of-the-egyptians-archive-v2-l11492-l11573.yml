canonical_text:
  quote: ''
  summary: A quoted account attributed to Plutarch describes Isis and Osiris as elevated
    from good demons to gods, identifies Osiris with Pluto and Isis with Proserpine,
    and narrates Ptolemy Saviour's dream-command to bring an unknown colossal statue
    from Sinope to Alexandria. The statue is identified as Pluto/Sarapis by Timotheus
    and Manetho because of its accompanying Cerberus and Dragon. The passage then
    presents several explanations of the name Sarapis, including identifications with
    Osiris, Bacchus, Pluto, Apis, and Egyptian or Greek etymologies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Isis and Osiris, because of their virtue, were translated
    from the order of good Demons to the order of Gods, while still receiving mixed
    honours due to Gods and Demons.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Osiris is identified with Pluto and Isis with Proserpine,
    and it connects the oracle at Canopus with Pluto.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ptolemy Saviour has a dream in which an unknown colossal statue commands him
    to remove it to Alexandria.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sosibius reports that he has seen such a statue at Sinope, after which Soteles
    and Dionysius are dispatched to bring it away; the removal is said to occur with
    difficulty and providential aid.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Timotheus the Interpreter and Manetho identify the statue as Pluto from the
    Cerberus and Dragon accompanying it, and persuade the king that it is the Egyptian
    Sarapis.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says the statue did not have the name Sarapis before it was brought
    to Alexandria, and that Egyptians gave it the name afterwards as equivalent to
    Pluto.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage reports an argument that Pluto and Bacchus are the same, explaining
    this through Bacchus as Osiris and Osiris as Sarapis.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says the name Sarapis is known among those initiated into the
    mysteries of Osiris as a common name for those who have changed their nature from
    Genii to Gods.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage dismisses certain Phrygian tales that name Sarapis as the daughter
    of Hercules and Typho as born of Isaeacus.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage reports Phylarchus as saying that Bacchus brought two bullocks
    from India into Egypt, named Apis and Osiris, and that Sarapis signifies one who
    ordered the universe.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage reports an alternative claim that Sarapis is the name of the sepulchral
