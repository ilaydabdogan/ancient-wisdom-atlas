canonical_text:
  quote: ''
  summary: Budge summarizes Pyramid Text evidence for Heliopolitan divine companies.
    He describes varying lists of the Great Company of gods at Heliopolis or Annu,
    notes groupings of nine, ten, twelve, eighteen, and three companies, identifies
    Ra-Tem/Tem as head or progenitor in some lists, and describes provincial priesthoods
    as adopting Heliopolitan cosmogony and identifying local gods with Heliopolitan
    forms.
  language: English
  quote_policy: summarized
