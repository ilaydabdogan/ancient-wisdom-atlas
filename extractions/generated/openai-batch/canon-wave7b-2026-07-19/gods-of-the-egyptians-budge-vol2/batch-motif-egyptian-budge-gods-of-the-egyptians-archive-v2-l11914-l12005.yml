canonical_text:
  quote: ''
  summary: A protective speech identifies the addressed being with Horus and other
    sacred forms, promises protection from poison, flame, water, stinging reptiles,
    lions, and enemies, and extends the effect to a person under treatment. Isis then
    narrates conceiving, bearing, hiding, and provisioning Horus in the papyrus marshes.
    On returning, she finds him motionless and poisoned. Local people and a notable
    woman gather but cannot restore him. The passage attributes safety to Tern's word
    of power and exclusion of Set, but attendants reveal Horus's location; a scorpion
    stings him and Aun-ab stabs him. Isis examines the wound, laments to Ra, and is
    joined by Nephthys and Serqet. Isis prays to the Boat of Millions of Years; Ra's
    disk stops, and Thoth arrives. A caption states that Mersekert is suckling Horus.
  language: English
  quote_policy: summarized
