- id: motif:1
  label: Protective healing speech against venom and hostile forces
  taxonomy_refs: []
  basis: The opening speech repeatedly denies the power of poison, flame, stinging
    reptiles, water peril, lions, and enemies over the addressed being, and invokes
    protective deities.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents the speech as translated religious-medical material;
    no external motif classification is asserted beyond the passage.
- id: motif:2
  label: Divine mother hides her child in the marsh
  taxonomy_refs:
  - mother_goddess
  - divine_parent_child
  - sacred_birth
  basis: Isis conceives and bears Horus, places him in papyrus, rejoices in his role
    for his father, and hides him because she fears he will be bitten.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The papyrus setting is literal in the passage; broader symbolic readings
    of the marsh are not inferred here.
- id: motif:3
  label: Poisoned divine child awaiting restoration
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: Horus is found motionless and helpless, no one knows how to restore him to
    life, Isis finds poison in his wound, and divine action follows her lament and
    prayer.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  confidence: medium
  cautions: The excerpt ends with Thoth's arrival and does not include the completed
    restoration within the supplied passage.
- id: motif:4
  label: Hostile brotherly threat to the divine heir
  taxonomy_refs:
  - sibling_pair
  basis: The passage says Horus had been smitten by the evil of his brother and describes
    Set as excluded from the region while Horus is safe from the wickedness of his
    brother.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage does not fully explain the kinship relation or the wider Set-Horus
