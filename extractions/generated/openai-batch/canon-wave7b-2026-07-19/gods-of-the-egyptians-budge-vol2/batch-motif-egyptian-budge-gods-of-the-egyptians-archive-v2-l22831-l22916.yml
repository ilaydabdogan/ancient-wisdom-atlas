canonical_text:
  quote: ''
  summary: The passage surveys several animals in Egyptian religious and antiquarian
    tradition. It discusses the pig as abominated yet also sacrosanct and connected
    with Osiris; a Book of the Dead rubric requiring a new tile not trodden by a pig
    or other animal; the bat as archaeologically attested and probably sacred though
    not proven to have been worshipped; the shrew-mouse and hedgehog as sacred small
    animals with tomb figures; a legend in which Uatchit/Buto takes shrew-mouse form
    to escape Typhon while guarding Horus; the shrew-mouse as blind, a symbol of darkness,
    and identified with Blind Horus; and classical legends of the ichneumon as a destroyer
    of serpents, crocodiles, and crocodile eggs, with later naturalistic caveats.
  language: English
  quote_policy: summarized
