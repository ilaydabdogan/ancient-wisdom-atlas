canonical_text:
  quote: ''
  summary: 'A sequence of illustrated captions describes funerary scenes of Osiris:
    Osiris or his mummy lies on a bier, with Canopic jars, divine regalia, hawks,
    Isis, Nephthys, Hathor, Heqet, serpents, Bes, and other figures nearby. One scene
    shows Osiris raising himself from the bier at the command of Heru-netch-tef-f.
    Another describes Heru-netch-tef-f touching Osiris''s face with a lance in a presumed
    opening-of-the-mouth rite. A caption explicitly identifies one scene as connected
    with the resurrection of Osiris.'
  language: English
  quote_policy: summarized
