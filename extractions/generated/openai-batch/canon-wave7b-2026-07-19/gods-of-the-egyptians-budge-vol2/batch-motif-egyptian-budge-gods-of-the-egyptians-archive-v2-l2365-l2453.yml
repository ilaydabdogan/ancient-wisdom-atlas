canonical_text:
  quote: ''
  summary: The passage describes the Bekhten narrative in which an afflicted princess
    is not helped by an Egyptian scribe, so the king of Bekhten requests that Egypt
    send a god to heal her. The Egyptian king petitions the statue of Khensu Nefer-hetep,
    whose nodding signifies assent, and asks that Khensu be sent with saving power.
    Budge comments on mechanically movable divine statues, describes a fourfold transfer
    of power to the statue of Khensu, compares this to the Nubian Nastasenen stele
    in which Amen-Ra's statue selects a king, and then returns to the narrative of
    Khensu's seventeen-month journey to Bekhten.
  language: English
  quote_policy: summarized
