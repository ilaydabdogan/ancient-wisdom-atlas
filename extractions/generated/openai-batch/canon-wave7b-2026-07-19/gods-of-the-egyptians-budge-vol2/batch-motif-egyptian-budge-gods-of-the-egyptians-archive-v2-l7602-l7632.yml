  summary: The passage introduces a hymn to Osiris as important evidence for an account
    of Osiris's life and death and Horus's birth. It describes Isis, sister and wife
    of Osiris, as a miracle worker who knows words of power. In bird form she searches
    the earth for Osiris's body, finds him dead, produces light and air with feathers
    and wings, uses words obtained from Thoth to rouse him from helplessness, unites
    with him, conceives, and gives birth to Horus in a hidden lonely place.
