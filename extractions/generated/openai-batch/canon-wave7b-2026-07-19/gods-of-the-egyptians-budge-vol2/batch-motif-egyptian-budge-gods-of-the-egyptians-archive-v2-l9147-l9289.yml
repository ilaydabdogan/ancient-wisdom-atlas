    Horus as vindicated, given the rank of his father, crowned by Seb's command, and
    invested with the sceptre and White Crown. He judges and commands heaven, earth,
    humans, spirits, the dead, Egypt, and cosmic waters or winds. The text also describes
    abundance, green herbs, food, joy, adoration, right action toward the son of Isis,
    and the fall of his enemy before his wrath.
