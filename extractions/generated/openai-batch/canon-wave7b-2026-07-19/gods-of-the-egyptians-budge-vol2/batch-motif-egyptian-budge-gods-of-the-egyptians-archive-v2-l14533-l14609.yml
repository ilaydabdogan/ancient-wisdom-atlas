  summary: The passage discusses the name, determinatives, animal symbol, regional
    association, coronation roles, martial instruction scenes, destructive cosmic
    associations, and mythic combats of Set, especially in relation to Horus, Ra,
    kingship, and day/night opposition.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Horus means “he who is above” and suggests by analogy
    that Set may mean something like “he who is below.”
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hieroglyphic name of Set is described as having either a stone determinative
    or an unidentified animal determinative; the stone is said to indicate Set as
    personification of stony or desert land and regions of death.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The animal associated with Set is described as unidentified, camel-headed
    in appearance, with pricked ears and a straight bifurcated tail; the author presents
    further claims about its nocturnal, hostile, desert-haunting nature as assumptions
    made in the absence of facts.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the Set animal lived in the South, leading Set to become
    god of the South, while Heru-ur became god of the North.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Theban relief is reported to show Horus and Set standing on either side
    of Seti I and pouring a libation of “life” over the king’s head.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Another scene is reported to show Horus and Set placing the double crown of
    South and North upon Rameses II, with each god speaking blessings of life, years,
    strength, and health.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the coronation scene, each god holds a notched palm branch identified as
    a symbol of years; it rests upon a frog and an emblem of the Sun’s path in the
    heavens and of eternity.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: A further scene is reported in which Set teaches Thothmes III the use of the
    bow in connection with the emblem of Neith, while Horus instructs him in wielding
    a staff-like weapon.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage reports Brugsch’s view that Set was linked with the sun’s downward
    motion, destructive summer heat, theft or withdrawal of light, storms and other
    natural disturbances, reversal of order, and moral evil.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that texts from all periods allude to Set’s fight against
    Horus, with one form recording the natural opposition of Day and Night and another
    naming Ra and Set as the combatants.
  category: sequence
  evidence_refs:
  - ev:7
