canonical_text:
  quote: ''
  summary: Isis searches for the chest containing Osiris, receives information from
    children, learns of Anubis’s exposed birth and raises him, discovers that the
    chest has been enclosed within a tamarisk tree made into a pillar at Byblos, enters
    the Byblos court as a nurse, attempts to burn away a child’s mortal part while
    lamenting in swallow form, is interrupted by the queen, reveals herself, opens
    the pillar, retrieves the hidden chest, and treats the remaining wood as a sacred
    object.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Isis wanders through the country in distress, searching for the chest and
    asking people, including children, about it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The children had seen what Typho's accomplices did with the body and tell
    Isis by which mouth of the Nile it was conveyed into the sea.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says Egyptians regard children as having a faculty of divining
    and observe their play-talk for omens and presages, especially in sacred places.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Isis learns that Osiris had unknowingly fathered a child with Nephthys, identifies
    the matter through a melilot garland, searches for the exposed child, finds him
    with the aid of dogs, and raises him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The child raised by Isis becomes her constant guard and attendant and receives
    the name Anubis.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The chest is carried by sea waves to the coast of Byblos and lodged in the
    branches of a tamarisk bush.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The tamarisk grows into a large tree around the chest, enclosing it so that
    it cannot be seen.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The king cuts down the unusual tree and makes the part of the trunk containing
    the hidden chest into a pillar supporting the roof of his house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Isis is informed of the chest's location by the report of demons and goes
    to Byblos.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: At Byblos, Isis sits beside a fountain and speaks only to the queen's women,
    whom she greets, caresses, and whose hair she plaits.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: A fragrant odour issues from Isis's body and is transferred to the queen's
    women, making the queen want to see the stranger.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: The queen summons Isis to court and makes her nurse to one of her sons.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: Isis feeds the child by giving him her finger to suck instead of the breast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Isis places the child in fire every night to consume his mortal part.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: While the child is in the fire, Isis transforms herself into a swallow, hovers
    around the pillar, and mourns her fate.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: The queen watches, sees the child in flame, cries out, and thereby prevents
    the immortality that would otherwise have been given to him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:17
  text: Isis reveals herself and asks for the pillar supporting the roof.
  category: action
  evidence_refs:
  - ev:6
- id: obs:18
  text: Isis takes down and cuts open the pillar, removes what she wants, wraps the
    remaining trunk in fine linen, pours perfumed oil on it, and returns it to the
    king and queen.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:19
  text: The remaining piece of wood is said to be preserved in the temple of Isis
    and worshipped by the people of Byblos.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:20
  text: After retrieving the chest, Isis throws herself upon it.
  category: action
  evidence_refs:
  - ev:7
