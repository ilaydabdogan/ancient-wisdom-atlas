candidate_motifs:
- id: motif:1
  label: mourning search for the hidden divine body
  taxonomy_refs:
  - stolen_beloved
  basis: Isis wanders in distress searching for the chest containing Osiris's body
    and follows reports until she reaches and retrieves it.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage emphasizes the hidden body/chest rather than explicitly naming
    a romantic abduction motif; the taxonomy link is functional and needs review.
- id: motif:2
  label: children as diviners and omen-bearers
  taxonomy_refs:
  - wisdom
  basis: Children provide critical information to Isis, and the passage explicitly
    states that Egyptians regarded children as having a faculty of divining and read
    omens from their play-talk.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The available taxonomy has no exact child-divination category; the wisdom
    reference is approximate.
- id: motif:3
  label: exposed divine child rescued and raised
  taxonomy_refs:
  - miraculous_child
  - divine_parent_child
  basis: The child of Osiris and Nephthys is exposed after birth, found through animal
    guidance, raised by Isis, and becomes Anubis.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage presents divine parentage and exposure clearly, though the
    child's later mythic status is only briefly described.
- id: motif:4
  label: sacred tree enclosing a hidden chest and becoming a pillar
  taxonomy_refs:
  - sacred_tree_axis
  basis: A tamarisk grows around the chest, hides it, is cut down, and becomes a pillar
    supporting a royal house; the remaining wood is wrapped, anointed, preserved,
    and worshipped.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: The tree's axis or cosmic function is not explicitly stated; the support-pillar
    and cultic preservation support the motif cautiously.
- id: motif:5
  label: divine nurse attempts to confer immortality through fire
  taxonomy_refs:
  - initiation
  - death_rebirth
  basis: Isis, acting as nurse, feeds the child and places him nightly in fire to
    consume his mortal part; the queen's cry interrupts the immortality that would
    have been conferred.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The rite is interrupted, so the passage describes attempted rather than
    completed immortalization.
- id: motif:6
  label: shape-shifting bird lament around hidden sacred object
  taxonomy_refs:
  - shapeshifter
  basis: Isis transforms into a swallow and hovers around the pillar while lamenting
    her fate.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage names the transformation but does not elaborate the swallow's
    wider symbolic meaning.
- id: motif:7
  label: divine fragrance revealing a disguised goddess
  taxonomy_refs: []
  basis: Isis's fragrance passes into the queen's women and causes the queen to summon
