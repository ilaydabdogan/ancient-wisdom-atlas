canonical_text:
  quote: ''
  summary: The passage discusses names and symbols associated with Set/Typhon, including
    Baba/Bebo, Smai, iron, the knife, serpents, the Set animal, water-associated beasts,
    red-haired beings, and ritual animals. It describes Set as linked with darkness,
    evil, and waters resisting light and order; lists animals treated as his symbols,
    habitations, or incarnations; reports Plutarch's statement that gods hid from
    Typho by taking animal forms; and describes calendrical rituals in which Typhonic
    animals or models were sacrificed, cut, stamped, or driven away with sistra.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies Seth as Set, Bebo as Egyptian Baba, and Smai as a known
    Egyptian name for Set as the Arch-Fiend; it also says the name of Set's associates
    implied violence.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Thoth obtained from Set a knife with which he cut up a bull,
    and uses this to connect iron with Set or Typhon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the serpent and the Set animal were common symbols
    of Set, while also noting depictions of Set as a bearded man with a tail and divine
    symbols.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: An example cited in the passage names the god as a mighty one of two-fold
    strength and shows him accompanied by Nephthys, who wears horns and a disk.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage characterizes Set as the personification of darkness, evil, and
    waters that were supposed to resist light and order.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage says water-dwelling or partly aquatic animals were regarded as
