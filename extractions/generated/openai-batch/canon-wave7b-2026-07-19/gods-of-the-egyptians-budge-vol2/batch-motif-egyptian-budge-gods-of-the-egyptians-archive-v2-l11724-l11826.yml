canonical_text:
  quote: ''
  summary: 'The passage describes Isis in funerary and mythic contexts: as mother
    of Horus, mourning widow of Osiris, protector and life-giver of the dead, a figure
    associated with Osiris in the Judgment Hall, and a wanderer after Set''s violence.
    It then summarizes a Metternich stele narrative in which Thoth advises Isis to
    hide the child Horus, Isis escapes at evening with seven scorpion helpers, reaches
    marshes and Teb, is refused entry by a noble woman but admitted by a poor fen-woman,
    and the scorpions retaliate by poisoning the noble woman''s son, after which fire
    breaks out and no water or rain is available.'
  language: English
  quote_policy: summarized
