canonical_text:
  quote: ''
  summary: A hymn passage to Osiris enumerates waters, air, plants, and animals; states
    that the desert belongs by right to the son of Nut and that the Two Lands crown
    him on the throne of the father like Ra; describes him rising on the horizon,
    giving light through darkness like the solar Disk, with a crown piercing heaven;
    identifies him with star gods and divine companies; and says his sister protects
    him by driving away foes and evil hap through utterance.
  language: English with Egyptian transliteration and hieroglyphic transcription fragments
  quote_policy: summarized
