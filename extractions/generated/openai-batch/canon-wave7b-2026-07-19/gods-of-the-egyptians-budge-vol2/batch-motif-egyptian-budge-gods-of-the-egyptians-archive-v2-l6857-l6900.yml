canonical_text:
  quote: ''
  summary: The passage describes several forms and symbols of Osiris, including Osiris
    as the Tet pillar, mummied Osiris with regalia and companions, a relic-box symbol
    at Abydos, Osiris forming the Tuat, and a throne scene involving a monster serpent
    and accompanying deities. It also introduces Dendera temple scenes concerning
    the death and resurrection of Osiris, beginning with Osiris lying on a bier with
    four crowns beneath it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pillar called Osiris Tet stands at the head of a bier on which the god Seker
    lies in mummied form.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: On a Turin stele, Osiris is shown in mummied form, seated, holding a sceptre
    and flail or whip, and wearing the White Crown with plumes, usually called Atef.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Osiris is given titles including Khenti-Amentet, Un-nefer, lord of Tatcheser,
    the great god, and king of the living.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ptah-Sekri, Anpu, Horus son of Isis, and Hathor are seated behind Osiris in
    the Turin stele description.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: As a form of Khnemu-Ra, Osiris has the head of a ram, with horns surmounted
    by a solar disk and four knives.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: A common symbol of Osiris is a box containing the head and hair of Osiris,
    preserved at Abydos where the relics were buried.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The body of Osiris is elsewhere shown bent backward so as to form the region
    of the Tuat or Underworld.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Osiris is sometimes seated on a throne supported on the back of a monster
    serpent resting on a mythological flight of steps at Henen-Su.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the Henen-Su throne scene, Osiris is accompanied by Maat, Horus son of
    Isis, Thoth, Heka holding a serpent in each hand, and the snake-headed goddess
    Heptet.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that Heptet assisted in bringing about the resurrection
    of Osiris, while also noting that her exact role is unknown.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Heptet is described with the body of a woman and the head of a bearded snake,
    wearing horns, a solar disk, Atef Crown, and uraei with disks and horns, and holding
    a knife in each hand.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The walls of the temple of Dendera preserve scenes connected with the death
