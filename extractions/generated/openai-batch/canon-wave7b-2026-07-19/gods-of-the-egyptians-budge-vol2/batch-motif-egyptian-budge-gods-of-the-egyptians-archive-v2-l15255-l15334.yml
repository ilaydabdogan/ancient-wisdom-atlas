canonical_text:
  quote: ''
  summary: The passage describes Isis and Nephthys preparing Osiris's funeral bed
    and swathings, aiding his resurrection, and aiding deceased followers to rise
    to new life through chants. It then describes late ritual literature and an Abydos
    rite in which two pure virgin priestesses personify Isis and Nephthys, wear prescribed
    objects, and sing hymns to Osiris with a precentor. The quoted hymn repeatedly
    summons Osiris to return to his temple, calls him by many titles, says the two
    sisters will join his limbs and end his pain, and associates him with crowns,
    boats, the Tuat, renewal, the moon, and a hidden coffin at Heliopolis.
  language: English
  quote_policy: summarized
