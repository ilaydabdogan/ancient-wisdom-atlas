canonical_text:
  quote: ''
  summary: A hymn praises Amen-Ra as lord of the two lands, king among the gods, daily
    radiant solar power, master of the Sektet and Atet Boats, destroyer of enemies,
    maker of Maat, creator of mortals and all things, and many-formed divine figure.
    The accompanying commentary states that Amen absorbed the attributes of Ra and
    other ancient Egyptian Sun-god forms, rose from a local god to king of the gods,
    and that his priesthood grew into a major political and economic power culminating
    in priest-kings.
  language: English
  quote_policy: summarized
