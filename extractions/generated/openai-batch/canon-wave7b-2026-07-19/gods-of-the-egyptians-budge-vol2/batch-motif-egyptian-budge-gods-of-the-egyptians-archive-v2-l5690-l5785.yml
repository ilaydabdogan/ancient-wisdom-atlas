comparison_claims:
- id: claim:1
  claim: The passage claims that the Heliopolitan sycamore of Nut may have served
    as an archetype for the later tradition of the Virgin Mary resting under a sycamore
    during the flight to Egypt.
  claim_level: historical_contact
  target: Christian tradition of the Virgin Mary’s flight to Egypt and resting under
    a sycamore
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: This is presented as the author’s comparative inference using cautious
    wording, not as evidence from a cited ancient source in the passage.
- id: claim:2
  claim: The passage claims that many details about Mary’s wanderings in the Delta
    in apocryphal and similar writings were borrowed from old Egyptian mythology.
  claim_level: historical_contact
  target: Apocryphal Gospel and related traditions about Mary’s wanderings in the
    Delta
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: low
  limitations: The passage makes a broad borrowing claim without giving the details
    of the apocryphal texts within this excerpt.
- id: claim:3
  claim: The passage compares plants associated with Seb’s laying of the Egg of the
    Sun to balsam trees whose oil was used by Egyptian and Abyssinian Christians in
    baptism.
  claim_level: historical_contact
  target: Christian Egyptian and Abyssinian baptismal use of balsam oil
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: low
  limitations: The passage says the plants 'may well be identified' with the balsam
    trees, so the identification is tentative.
- id: claim:4
  claim: The passage states that a Coptic legend of Mary and her Son hiding in a sycamore
    trunk is based on an Egyptian myth, recorded by Plutarch, in which Isis hid Osiris’s
    body in a tree trunk.
  claim_level: same_motif
  target: Coptic Mary-and-Son hiding-in-sycamore legend and Plutarch-linked Isis-Osiris
    tree-trunk myth
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage reports the relationship as a claim; it does not quote
    Plutarch or the Coptic legend directly.
