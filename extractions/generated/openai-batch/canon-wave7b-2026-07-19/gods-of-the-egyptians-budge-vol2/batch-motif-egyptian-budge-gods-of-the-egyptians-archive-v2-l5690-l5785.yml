canonical_text:
  quote: ''
  summary: The passage describes a text and vignette in which the deceased addresses
    the sycamore of Nut for water and air, guards the egg of the Great Cackler, and
    receives food and water from the goddess in a tree. It then discusses the sycamore
    of Nut at Heliopolis, associated solar mythology, Apep’s defeat by Ra, refuge
    for souls, later Christian and Coptic tree traditions, and Dendera and Theban
    traditions concerning Nut, Isis, Osiris, Horus, and Nephthys.
  language: English
  quote_policy: summarized
