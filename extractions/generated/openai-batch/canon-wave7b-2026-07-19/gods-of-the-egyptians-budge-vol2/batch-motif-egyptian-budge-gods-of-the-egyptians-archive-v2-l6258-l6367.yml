canonical_text:
  quote: ''
  summary: 'Budge describes Egyptian afterlife beliefs associated with Osiris and
    Ra. The passage contrasts a material heaven resembling earthly life with a solar
    theology in which the blessed live in light and in the boat of Ra. It then cites
    Pyramid Text material about Unas: divine beings witness the purity of the king,
    Unas eats and drinks with them, sails as they do, nets in Aaru, possesses waters
    in Sekhet-hetep, and moves through heaven like Ra and Thoth. The passage identifies
    Aaru/Sekhet-Aaru as a reed-field afterlife region with named districts, fields,
    lakes, and purifying waters used by Ra and the deceased.'
  language: English
  quote_policy: summarized
