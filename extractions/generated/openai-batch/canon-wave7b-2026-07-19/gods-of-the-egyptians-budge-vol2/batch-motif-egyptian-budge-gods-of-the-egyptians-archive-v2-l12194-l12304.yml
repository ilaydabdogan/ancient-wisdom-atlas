canonical_text:
  quote: ''
  summary: The passage describes Isis appealing for Horus's restoration after a scorpion
    death, a Book of the Dead chapter and thet amulet used to confer Isis's magical
    protection on the deceased, Isis's heavenly symbol as the star Sept, her relation
    to Osiris and the Nile inundation, her destruction of Apep by words of power,
    and her many forms as water, earth, harvest, underworld, life-giving, motherly,
    and syncretic goddess.
  language: English
  quote_policy: summarized
