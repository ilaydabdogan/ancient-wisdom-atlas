canonical_text:
  quote: Khensu was, in fact, the "traveller,"
  summary: The passage describes Mut as a divine mother identified with Nut and paired
    with Seb, then treats Khensu as the Theban triad's third member, son of Amen-Ra
    and Mut. It explains Khensu's name as connected with travel, identifies him with
    Thoth and the Moon-god, cites the Unas text where Khensu acts as slaughterer and
    messenger in the king's hunting and eating of gods, and describes Khensu's later
    Theban cult and temple.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Mut is described as a mother who gave birth to gods, brought forth a first-born
    among five gods, and was identified with Nut and as the female counterpart of
    Seb in the period of Seti I.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Khensu is presented as the third member of the great triad of Thebes and as
    the son of Amen-Ra and Mut.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The name Khensu is explained from a root meaning to travel, move about, or
    run; the passage calls Khensu the traveller and identifies him with Thoth and
    the Moon-god.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A cited Unas passage says that Unas goes around heaven like Ra and travels
    through heaven like Thoth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In another cited Unas passage, Khensu is called the slaughterer who cuts the
    gods' throats and draws out their intestines for the king, and is also called
    a messenger sent out to meet them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that in the Early Empire Khensu held an important mythological
    position as messenger of the great gods and as the traveller who journeyed through
    the sky in the form of the moon.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Other gods in the cited Unas section are said to assist in marking, snaring,
    and cutting up the gods.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage states that among certain ancient Oriental nations Moon worship
    preceded Sun worship and that some of Egypt's oldest gods were forms of the Moon
    in various phases.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage describes older gods being preserved by identification or adoption
    in the Heliopolitan theological system and later by selection into the Theban
    company of Amen-Ra.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Theban priesthood is said to have made Khensu one of the most ancient
    forms of the Moon-god into the son of Amen-Ra and to have identified him with
    sons of Horus and Ra.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Thebes is described as Khensu's chief cult center in the later dynastic period,
