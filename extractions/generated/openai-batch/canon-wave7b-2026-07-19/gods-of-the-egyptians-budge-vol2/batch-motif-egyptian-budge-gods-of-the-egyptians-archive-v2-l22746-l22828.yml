canonical_text:
  quote: ''
  summary: The passage discusses canid animals in Egyptian divine and funerary contexts,
    including wolves identified with jackal-gods, Osiris returning from the Underworld
    in wolf form to aid Horus, and the jackal's association with dead persons and
    tombs. It then describes the ass as both divine and demonic, including serpent-combat
    scenes and solar symbolism. The final section describes the pig as an animal associated
    with Set or Typhon, recounting a black-pig form of Suti injuring Horus's eye and
    later pollution, exclusion, and sacrifice practices connected with pigs.
  language: English
  quote_policy: summarized
