    a Lion-god.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: In the Theban Recension of the Book of the Dead, the Akeru gods are represented
    as two lions seated back to back, supporting between them the horizon with the
    sun's disk on it; later theology names them Sef and Tuau, meaning Yesterday and
    To-day.
  category: object
  evidence_refs:
  - ev:7
- id: obs:16
  text: Because Egyptians believed Lion-gods guarded the gates of morning and evening,
