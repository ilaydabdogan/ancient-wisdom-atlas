canonical_text:
  quote: ''
  summary: The passage describes Egyptian views of animal divinity, then discusses
    the hippopotamus goddess under several names, her maternal and underworld roles,
    and the destructive hippopotamus aspect of Am-mit. It then describes the ancient
    lion cult, sacred lions, Aker and the paired Akeru lion-gods as solar gate guardians,
    and the use of lion and sphinx statues as protective threshold guardians.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening fragment says an animal was viewed as the image of God and explains
    its supposed absence of a tongue by saying that divine reason does not need speech.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The opening fragment credits the same animal with wisdom and foreknowledge,
    using the location where the female lays eggs as an indicator of the season's
    inundation extent.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says these views show how legends of animal gods and their powers
    grew in a later period and how Egyptian mythological ideas were modified over
    time.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: The hippopotamus is said to have been worshipped by primitive Egyptians, and
    the hippopotamus goddess is named as Rert, Rertu, Ta-urt, Apet, and Sheput, among
    other names.
  category: relationship
  evidence_refs:
  - ev:2
