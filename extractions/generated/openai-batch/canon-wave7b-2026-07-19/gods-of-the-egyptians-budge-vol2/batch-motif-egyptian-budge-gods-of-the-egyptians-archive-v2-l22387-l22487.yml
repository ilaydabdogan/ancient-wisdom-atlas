  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The lion cult is described as very ancient and widespread in early dynastic
    Egypt; the lion was worshipped for strength and courage and was associated with
    the Sun-god, Horus, Ra, and solar deities.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Sacred lions are said to have been kept in temples, including Leontopolis
