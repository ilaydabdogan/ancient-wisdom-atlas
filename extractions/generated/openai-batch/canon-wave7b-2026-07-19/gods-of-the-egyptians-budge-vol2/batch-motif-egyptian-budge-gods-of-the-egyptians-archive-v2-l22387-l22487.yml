  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Aker is described as an old Lion-god who guarded the gate of the dawn through
    which the Sun-god passed each morning.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Later Egyptian mythologists are said to have believed that the sun passed
