    she brought into the world at Ombos.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ombos is described as the Meskhenet or birth-house of Apet.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: The hippopotamus goddess is described as generally beneficent and as appearing
    in the last vignette of the Theban Recension of the Book of the Dead as an Underworld
    deity and kindly guardian of the dead.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: In that vignette the hippopotamus goddess holds an unexplained object in her
