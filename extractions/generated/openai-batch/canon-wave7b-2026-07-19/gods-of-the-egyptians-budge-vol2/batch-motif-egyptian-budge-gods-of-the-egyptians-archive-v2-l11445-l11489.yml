canonical_text:
  quote: ''
  summary: A divine statue is brought by ship to Alexandria, introduced to Greeks
    as Hades, and named Asar-Hapi or Serapis by Egyptian priests. Greeks and Egyptians
    in Alexandria accept the god as an underworld deity. After establishment in Alexandria,
    Serapis's rites are modified to resemble Egyptian services and to harmonize with
    the cult of Osiris. Ptolemy's role in this accommodation is emphasized, and the
    Serapeum near Raqetit is described as resembling the Memphis Serapeum and containing
    rich decoration and a library.
  language: English
  quote_policy: summarized
