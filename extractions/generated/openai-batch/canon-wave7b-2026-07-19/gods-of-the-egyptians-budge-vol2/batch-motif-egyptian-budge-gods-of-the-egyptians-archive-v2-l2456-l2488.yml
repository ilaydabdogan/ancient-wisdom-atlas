canonical_text:
  quote: ''
  summary: Khensu discovers that Bent-reshet is possessed by an evil spirit and heals
    her when the demon leaves after he uses magical power. The demon submits to Khensu,
    requests a feast with Khensu and the Prince of Bekhten, and then returns to its
    own land. The Prince attempts to keep Khensu in Bekhten, but after a fixed delay
    the god returns to Egypt in the form of a golden hawk. The chariot of Khensu,
    with gifts and offerings, is sent safely back to Thebes, and the gifts are deposited
    at the temple of Khensu Nefer-hetep. The passage closes by identifying the account
    as a priestly story about Khensu's miracles and defeat of demons of darkness.
  language: English
  quote_policy: summarized
