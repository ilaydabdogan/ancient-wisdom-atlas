canonical_text:
  quote: ''
  summary: The passage describes Khnemu-Ra as a self-created maker and sustainer of
    heaven, earth, the Tuat, water, and mountains; as a four-headed ram-form deity
    uniting Ra, Shu, Seb, and Osiris; as a southern Nile and shrine god associated
    with Isis and identified with Nu and Hap-ur; and introduces the Sahal inscription
    narrative of King Tcheser’s distress during seven years of failed Nile inundation
    and famine.
  language: English
  quote_policy: summarized
