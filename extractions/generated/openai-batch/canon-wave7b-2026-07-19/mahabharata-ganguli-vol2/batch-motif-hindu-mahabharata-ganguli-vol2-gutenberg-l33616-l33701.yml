canonical_text:
  quote: "“there flowed a terrible river of bloody current”"
  summary: Sanjaya describes a midday battle in which Bhishma attacks the Somaka/Pandava
    forces. Dhrishtadyumna, Sikhandin, Virata, and Drupada strike Bhishma; Bhishma
    wounds them but does not strike Sikhandin because he regards him as female. Allied
    warriors rush to protect the Panchalas and Bhishma, producing a general engagement
    with riderless cars, elephants, and horses crushing troops. The carnage is figured
    as a river of blood, compared to Vaitarani carrying the dead toward Yama, and
    Kshatriyas blame Duryodhana for their destruction.
  language: English
