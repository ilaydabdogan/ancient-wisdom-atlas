canonical_text:
  quote: ''
  summary: Bhima and Draupadi arrange a secret night meeting in the dancing-hall to
    trap Kichaka. Kichaka boasts of his power, propositions Draupadi, and agrees to
    come alone. Draupadi reports the plan to Bhima, who swears to kill Kichaka, using
    comparisons to earlier or divine slayings.
  language: English
