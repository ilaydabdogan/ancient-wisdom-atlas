canonical_text:
  quote: ''
  summary: Dhritarashtra laments the insult and killing of Drona and asks Sanjaya
    how the warriors reacted. Sanjaya reports that most present were silent or ashamed,
    while Satyaki angrily condemns Dhrishtadyumna for killing his preceptor, invokes
    lineage-wide disgrace and hell, disputes blame for Bhishma's death, threatens
    Dhrishtadyumna with his mace, and Dhrishtadyumna prepares to answer harshly.
  language: English
  quote_policy: summarized
