canonical_text:
  quote: ''
  summary: In a chaotic battle, Karna is made steedless, driverless, and carless,
    and Ashwatthaman takes him onto his car. Several opponents wound Arjuna and Vasudeva,
    while Arjuna counters with arrows, invokes the Varuna weapon, remains composed
    amid confusion, and slaughters enemy troops with Gandiva. The scene includes meteors,
    crows on dead bodies, comparison of Arjuna to Mahadeva slaying Asuras with Pinaka,
    comparison of Gandiva to Indra's bow, and the claim that Arjuna increases the
    population of Yama's realm.
  language: English
  quote_policy: summarized
