canonical_text:
  quote: Everything springeth from the earth and everything, when destroyed, mergeth
    into the Earth.
  summary: After Vyasa departs, Dhritarashtra reflects on the kings assembled for
    war and asks Sanjaya to describe the earth and the lands from which they have
    come. Sanjaya, empowered with special perception, classifies creatures, animals,
    plants, and universal constituents, links these to Gayatri, and states that all
    beings arise from and return to Earth; therefore kings kill one another for possession
    of Earth.
  language: English
  quote_policy: quoted
