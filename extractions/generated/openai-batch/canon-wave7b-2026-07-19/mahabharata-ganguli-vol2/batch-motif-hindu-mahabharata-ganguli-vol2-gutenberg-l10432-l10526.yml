canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanat-sujata about the attainment of Brahman, Brahmacharya,
    and immortality. Sanat-sujata explains that the knowledge of Brahman is inherent
    but unmanifest, is made manifest by pure intellect and Brahmacharya, and is reached
    through disciplined discipleship under a preceptor, restraint of desires, study,
    service, gifts, yoga-practices, meditation, and knowledge. He describes the preceptor
    as a second father and mother who gives a sacred, immortal birth, and says that
    Brahmacharya enabled celestials, sages, Gandharvas, Apsaras, and Surya to attain
    their states. Knowledge, rather than mere work, leads to everlasting Brahman and
    emancipation.
  language: English
  quote_policy: summarized
