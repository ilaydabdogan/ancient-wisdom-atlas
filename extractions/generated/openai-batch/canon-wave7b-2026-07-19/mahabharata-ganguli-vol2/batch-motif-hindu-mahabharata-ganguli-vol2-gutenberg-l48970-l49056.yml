canonical_text:
  quote: ''
  summary: Sanjaya reports Satyaki speaking with his charioteer after killing Sudarsana.
    Satyaki describes Drona's battle division as an ocean he has crossed, says Arjuna
    is near, identifies hostile forces ahead, and vows to destroy them while proceeding
    toward Dhananjaya. The charioteer declares fearlessness under Satyaki's protection
    and compares Satyaki's destructive prowess to the Destroyer at the end of the
    Yuga. Satyaki compares his intended slaughter to Vasava destroying Danavas and
    predicts grief for Duryodhana and the Kauravas.
  language: English
  quote_policy: summarized
