canonical_text:
  quote: ''
  summary: Sanjaya narrates that Duryodhana, Sakuni, Dussasana, and Karna consult
    on how to defeat the Pandavas. Duryodhana complains that senior Kuru warriors
    are not stopping the Parthas. Karna advises him to ask Bhishma to withdraw from
    battle, promising that he will then destroy the opposing forces. Duryodhana proceeds
    in royal display to Bhishma's quarters, salutes him, sits before him, and tearfully
    asks him either to fulfill his promise by slaying the Pandavas and their allies
    or to allow Karna to fight.
  language: English
  quote_policy: summarized
