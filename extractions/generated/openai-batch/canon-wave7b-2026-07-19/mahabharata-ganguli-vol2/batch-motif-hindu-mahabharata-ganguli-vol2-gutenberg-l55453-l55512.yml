canonical_text:
  quote: ''
  summary: In a night battle, Karna and Vrishasena fight Satyaki. Karna hears the
    sounds of Arjuna's bow and chariot, describes Arjuna routing the Kaurava army,
    and advises Duryodhana to have Satyaki and Dhrishtadyumna surrounded and killed
    while preventing Arjuna from rescuing them. Duryodhana orders Sakuni to advance
    against Arjuna and the Pandavas with a large force. Sakuni proceeds, Karna advances
    against Satyaki, and Drona fights Dhrishtadyumna and the Panchalas at night.
  language: English
  quote_policy: summarized
