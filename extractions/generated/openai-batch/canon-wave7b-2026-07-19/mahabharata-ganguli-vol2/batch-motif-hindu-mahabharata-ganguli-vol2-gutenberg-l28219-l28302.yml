canonical_text:
  quote: ''
  summary: Sanjaya narrates a battle in which Bhima confronts the Kalinga and Nishada
    forces. After being surrounded and losing his chariot horses, Bhima kills Sakradeva
    with a mace, cuts arrows and darts with his sword, terrifies the Kalinga army
    with his shout, leaps onto Bhanumat's elephant, kills Bhanumat and the elephant,
    and continues fighting on foot. The battle is described through images of divine
    warfare, oceanic sound, a crematorium-like field, serpent poison, a collapsing
    mountain, fire, and hawk-like movement.
  language: English
  quote_policy: summarized
