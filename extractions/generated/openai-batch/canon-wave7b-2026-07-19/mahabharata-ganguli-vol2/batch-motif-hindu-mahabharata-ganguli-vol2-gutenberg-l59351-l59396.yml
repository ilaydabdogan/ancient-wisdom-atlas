canonical_text:
  quote: ''
  summary: Sanjaya narrates that Arjuna, grieving and angered, speaks harshly to Drona's
    son. Aswatthaman becomes enraged, touches water, invokes the Agneya weapon with
    mantras, and releases a fiery shaft against his foes. The weapon produces showers
    of fiery arrows, darkness, ominous signs, heated waters, terrified creatures,
    and widespread burning of warriors, elephants, horses, and chariots, finally likened
    to Agni or the Samvarta fire consuming all at the end of the Yuga.
  language: English
  quote_policy: summarized
