canonical_text:
  quote: ''
  summary: After being insulted by the Suta's son, Krishna/Draupadi washes herself,
    grieves, and decides that only Bhima can accomplish her purpose against Virata's
    general. At night she goes to Bhima's quarters, embraces and awakens him, and
    urges him not to let the man who disgraced his wife live. Bhima rises, asks why
    she has come, notes her distress, and promises to hear everything and apply a
    remedy.
  language: English
  quote_policy: summarized
