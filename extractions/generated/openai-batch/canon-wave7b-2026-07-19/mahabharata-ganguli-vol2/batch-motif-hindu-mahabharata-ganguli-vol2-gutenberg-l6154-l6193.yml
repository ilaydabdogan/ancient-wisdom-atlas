canonical_text:
  quote: ''
  summary: 'Krishna advises a politic course: a respected senior king should send
    a message to the Kurus in the interests of the Pandavas, seeking equitable peace
    but preparing for war if Dhritarashtra''s son refuses. Krishna then departs for
    Dwaraka. Yudhishthira, Virata, and Drupada begin war preparations and summon rulers;
    the sons of Dhritarashtra also assemble rulers. Armies gather on both sides, the
    Earth is said to tremble beneath them, and the king of the Panchalas sends an
    old and wise priest to the Kurus after consulting Yudhishthira.'
  language: English
  quote_policy: summarized
