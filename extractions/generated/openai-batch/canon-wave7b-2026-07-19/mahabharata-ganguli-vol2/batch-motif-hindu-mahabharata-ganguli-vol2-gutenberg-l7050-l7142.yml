canonical_text:
  quote: ''
  summary: Vrihaspati praises Agni as the gods' mouth, sacrificial carrier, cosmic
    source, and consuming end, then asks him to enter the waters. Agni searches the
    waters and finds Indra hidden in a lotus-stalk in minute form. Vrihaspati and
    a divine assembly praise Indra and urge him to rise; Indra regains his form. Vrihaspati
    explains that the human Nahusha has become king of heaven through divine power
    and now terrifies gods and saints. Kuvera, Yama, Soma, and Varuna arrive; Indra
    requests aid against Nahusha, grants sacrificial shares, and assigns sovereignties
    to Kuvera, Yama, and Varuna.
  language: English
  quote_policy: summarized
