  quote: ''
  summary: Narada recounts to Srinjaya the greatness, generosity, sacrifices, divine
    boon, death, and heavenly departure of king Sivi, son of Usinara, and uses Sivi's
    example to tell Srinjaya not to grieve for his own son.
  language: English
  quote_policy: summarized
