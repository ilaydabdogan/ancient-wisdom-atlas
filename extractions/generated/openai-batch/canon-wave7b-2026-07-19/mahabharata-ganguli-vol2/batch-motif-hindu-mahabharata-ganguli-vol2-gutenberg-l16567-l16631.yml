canonical_text:
  quote: Do not set thy heart for battle.
  summary: An admonishing speaker tells a king that virtue underlies profit and desire,
    warns that unrighteous ambition and anger destroy, urges peace with the sons of
    Pandu, emphasizes the martial power of Bhima and Arjuna, warns against Kaurava
    extermination, and proposes a settlement involving half the kingdom and continued
    royal offices.
  language: English
