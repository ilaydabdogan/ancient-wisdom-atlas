canonical_text:
  quote: ''
  summary: Sanjaya describes Arjuna advancing against Bhishma amid a large battle.
    Arjuna’s standard, bow, shouts, and arrow-showers terrify the opposing army. The
    warriors seek Bhishma’s protection while other forces and named combatants engage
    across the field. Dust, cloudless lightning, meteors, winds, obscured directions,
    and the disappearance of the sun accompany widespread destruction of chariots,
    animals, and bodies.
  language: English
  quote_policy: summarized
