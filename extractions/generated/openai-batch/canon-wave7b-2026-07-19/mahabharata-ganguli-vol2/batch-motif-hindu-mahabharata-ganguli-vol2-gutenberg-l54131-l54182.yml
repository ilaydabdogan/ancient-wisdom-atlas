canonical_text:
  quote: ''
  summary: 'Sanjaya narrates a quarrel within the Kuru side: Aswatthaman, angered
    by Karna''s insult to Kripa, rushes at Karna with a scimitar and rebukes him by
    invoking Arjuna''s superiority and divine associations. Duryodhana and Kripa restrain
    Aswatthaman. Karna challenges him, but Duryodhana urges restraint because the
    Pandava forces are approaching. Aswatthaman and Kripa both say Karna is pardoned,
    while predicting that Phalguna will humble his pride.'
  language: English
  quote_policy: summarized
