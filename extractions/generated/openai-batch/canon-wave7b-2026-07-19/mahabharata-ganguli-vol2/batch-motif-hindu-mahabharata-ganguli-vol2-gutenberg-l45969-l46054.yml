canonical_text:
  quote: ''
  summary: Sanjaya narrates a battle episode in which Arjuna/Partha is attacked by
    many warriors, wounded and briefly senseless under the assault of Srutayus and
    Achyutayus, comforted by Krishna, then revives, invokes a weapon named after Sakra,
    and kills those opponents, their sons, and many elephant troops and allied warriors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Warriors from several named groups rush at Partha, shower arrows on him, are
    slain in large numbers by his arrows, flee, rally, and surround him again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The battlefield is described as strewn with severed heads and arms, with crows,
    vultures, and ravens hovering overhead.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Srutayus and Achyutayus attack Arjuna from the right and left with arrow showers;
    Srutayus strikes him with a lance, and Achyutayus strikes him with a spear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Arjuna swoons, supports himself by seizing the flag-staff, and the troops
    shout because they believe he has lost his life; Krishna grieves and then comforts
    him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Srutayus and Achyutayus cover Arjuna, Krishna, the car, its wheels, steeds,
    flagstaff, and banner with arrows until they are invisible.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Arjuna slowly regains his senses, sees the two antagonists before him, invokes
    a weapon named after Sakra, and releases thousands of straight shafts.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Arjuna's arrows deprive Srutayus and Achyutayus of their arms and heads, and
    they fall to the earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Niyatayus and Dirghayus, identified as sons of the slain princes, rush against
    Arjuna in rage because of the deaths of their fathers, and Arjuna kills both with
    straight shafts.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Elephant-riders from the Angas and kings from the west and south, including
    forces headed by the ruler of the Kalingas, surround Arjuna with elephants.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Arjuna cuts off the heads and ornamented arms of advancing combatants; elephants
    pierced by arrows bleed, fall, flee, shriek, vomit blood, or crush their own men.
  category: action
  evidence_refs:
  - ev:5
