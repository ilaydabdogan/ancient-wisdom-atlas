canonical_text:
  quote: ''
  summary: Pritha/Kunti, speaking to Krishna/Govinda, laments the Pandavas' exile,
    concealment, separation from her, and Draupadi's humiliation in the Kuru assembly.
    She recalls being given away to Kuntibhoja as a child, cites an invisible birth-night
    voice prophesying Arjuna's victories and sacrifices, invokes Dharma, and instructs
    Krishna to urge her sons toward Kshatriya duty, vengeance, and kingdom recovery.
  language: English
  quote_policy: summarized
