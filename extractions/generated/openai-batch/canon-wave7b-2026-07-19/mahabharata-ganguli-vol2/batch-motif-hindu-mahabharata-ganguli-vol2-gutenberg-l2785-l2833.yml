canonical_text:
  quote: ''
  summary: While the Matsya king is away pursuing the Trigartas, Duryodhana and Kaurava
    warriors invade Virata's dominion and seize sixty thousand royal cattle. A frightened
    cowherd chief reaches the city and urges prince Bhuminjaya to recover the kine,
    praising him as the kingdom's protector and comparing the hoped-for victory to
    Arjuna's protective role and to the thunderbolt-wielder defeating the Asuras.
    The exhortation uses martial images of arrows, chariots, a lion standard, and
    a bow likened to a Vina.
  language: English
  quote_policy: summarized
