canonical_text:
  quote: ''
  summary: Arjuna tells Krishna that he will defeat the warriors guarding Jayadratha,
    pierce through Drona's van, and slay Jayadratha the next day. He swears by Truth
    and by touching his weapons, invokes his celestial bow Gandiva, his divine weapons,
    and Krishna as charioteer, and asks that his chariot be readied at dawn.
  language: English
  quote_policy: summarized
