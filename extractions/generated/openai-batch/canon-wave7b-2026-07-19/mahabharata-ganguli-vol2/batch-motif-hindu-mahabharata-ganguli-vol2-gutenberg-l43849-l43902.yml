canonical_text:
  quote: ''
  summary: Narada tells Srinjaya that Rama, son of Jamadagni, though an ascetic warrior
    of great fame, will die. Rama avenges his slain father and a stolen calf by killing
    Kartavirya and vast numbers of Kshatriyas, creates blood-filled waters, performs
    many sacrifices, gives rich offerings and the earth to Kasyapa and the Brahmanas,
    is ordered by Kasyapa to leave the earth, makes the ocean stand aside with arrows,
    and dwells on Mount Mahendra. Narada uses this example to counsel Srinjaya not
    to grieve for his son.
  language: English
  quote_policy: summarized
