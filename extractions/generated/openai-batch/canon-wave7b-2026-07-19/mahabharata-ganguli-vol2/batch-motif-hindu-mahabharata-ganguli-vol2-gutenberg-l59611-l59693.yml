canonical_text:
  quote: None can venture to stay before the warrior that hath Maheswara walking before
    him.
  summary: Vyasa tells Arjuna that he has seen Sankara/Mahadeva and urges him to seek
    that deity's protection. The passage gives a long hymn-like catalogue of the deity's
    names, cosmic attributes, attendants, martial aid, powers of granting boons, and
    emblems including mountains, trees, sacred waters, the bow, the bull, and references
    to Uma, Daksha's sacrifice, and Vishnu as an arrow.
  language: English
  quote_policy: quoted
