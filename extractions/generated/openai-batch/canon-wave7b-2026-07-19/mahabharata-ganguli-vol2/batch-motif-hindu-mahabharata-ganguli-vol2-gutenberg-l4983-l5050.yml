canonical_text:
  quote: ''
  summary: In battle, Duryodhana turns back after being reproached, and major Kuru
    warriors move to protect him from Arjuna. The Kuru forces surround Arjuna and
    shower arrows upon him, but Arjuna counters their weapons, deploys the Sanmohana
    weapon obtained from Indra, and blows his conch, causing the Kuru warriors to
    lose consciousness and drop their bows. Arjuna instructs Uttara to take colored
    garments from named warriors while they are insensible and to avoid Bhishma, who
    can counteract the weapon. Uttara retrieves the garments and drives Arjuna away.
    Bhishma attacks as Arjuna departs, but Arjuna disables Bhishma's chariot, wounds
    him, and exits the field. When Duryodhana recovers, Bhishma rebukes him, explains
    that Arjuna spared them because he does not commit atrocious deeds, and advises
    Duryodhana to return to the Kuru city while Arjuna departs with the cattle.
  language: English
  quote_policy: summarized
