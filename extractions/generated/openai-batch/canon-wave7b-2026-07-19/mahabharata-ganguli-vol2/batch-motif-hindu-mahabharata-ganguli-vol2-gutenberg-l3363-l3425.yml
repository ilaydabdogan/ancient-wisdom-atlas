canonical_text:
  quote: Protected by me, the top of this car will be to thee as a citadel.
  summary: Uttara offers to drive Arjuna's car. Arjuna reassures him, asks him to
    bring weapons, vows to fight the Kurus and recover the cattle, and describes the
    battle car as a citadel. Uttara says his fear is gone, questions Arjuna's third-sex
    guise, hears Arjuna explain a completed year-long vow, and then offers to serve
    as charioteer while praising the horses.
  language: English
  quote_policy: quoted
