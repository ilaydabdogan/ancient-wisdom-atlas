canonical_text:
  quote: ''
  summary: A mother counsels Sanjaya that a king must not reveal fear in calamity,
    because fear spreads through the kingdom and alienates allies. She urges him to
    take courage, promises hidden treasure and loyal allies, and Sanjaya resolves
    to recover his paternal kingdom or die. Kunti then says the son was roused by
    his mother's words, achieved her aims, and that this victory-giving history, called
    Jaya, should be heard by those desiring victory and by women who wish to bear
    heroic sons.
  language: English
  quote_policy: summarized
