canonical_text:
  quote: ''
  summary: Vaisampayana narrates Bhishma's speech after Drona's speech. Bhishma approves
    Drona, praises the Pandavas and Yudhishthira, advises truthful and honest counsel,
    opposes discovering the Pandavas by spies, and describes the land where Yudhishthira
    is concealed as prosperous, ritually active, morally upright, and free from fear
    and misery.
  language: English
