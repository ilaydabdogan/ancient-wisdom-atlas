canonical_text:
  quote: ''
  summary: Satyaki describes the hostile warriors he must face and asks that his chariot
    be heavily equipped. Yudhishthira has Satyaki's car, weapons, horses, and standard
    prepared. Satyaki undergoes auspicious rites, gives gold to Brahmanas, receives
    blessings and honors, worships Yudhishthira, and mounts his car. Bhima starts
    with him, but Satyaki sends him back to protect the king. Satyaki declares victory
    assured by omens, embraces Bhima, and dashes against the enemy troops to reach
    Arjuna.
  language: English
  quote_policy: summarized
