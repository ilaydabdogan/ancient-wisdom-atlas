canonical_text:
  quote: '"I shall, therefore, resort to Yoga for shrouding the sun."'
  summary: Arjuna advances through the Kuru forces toward Jayadratha, overpowering
    many warriors with arrows. Jayadratha briefly retaliates, but Arjuna cuts down
    his driver and standard. As sunset approaches, Krishna tells Arjuna that Jayadratha
    is protected by six warriors and creates darkness by Yoga so the enemy will think
    the sun has set. When Jayadratha looks up, Krishna directs Arjuna to strike and
    fulfill his vow.
