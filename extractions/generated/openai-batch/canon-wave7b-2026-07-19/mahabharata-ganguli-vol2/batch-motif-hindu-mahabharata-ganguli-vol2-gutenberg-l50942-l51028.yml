canonical_text:
  quote: ''
  summary: Sanjaya narrates a battle episode in which Karna attacks Bhima with dense
    showers of arrows after seeing slain sons of the king. Bhima counters Karna, is
    cheered by warriors, kills seven brothers sent by Duryodhana to rescue Karna,
    grieves for Vikarna while affirming his vow, signals victory to Yudhishthira with
    a roar, and Duryodhana remembers Vidura's earlier counsel after seeing many sons
    slain.
  language: English
  quote_policy: summarized
