canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanjaya what happened after the commander Sweta was
    slain. He reflects on Duryodhana's earlier hostility and dependence on the Pandavas,
    names several figures who disliked or warned against the war, blames Duryodhana's
    malicious conduct and counsellors, and expresses fear of Arjuna's impending wrath
    and the Pandavas' anger after old wrongs and Sweta's death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dhritarashtra asks Sanjaya what the Panchalas and Pandavas did after their
    generalissimo Sweta was slain in battle.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dhritarashtra says that hearing of his side's victory pleases him and that
    his heart feels no shame in remembering their transgression.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dhritarashtra says Duryodhana provoked hostilities, at one time sought the
    protection of the sons of Pandu because of anxiety and fear due to Yudhishthira,
    lived in misery, and temporarily resorted to honourable behaviour after receiving
    checks from enemies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sweta is described as devoted to Yudhishthira and slain; Bhishma's victory
    after Sweta's slaughter is later mentioned.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:5
  text: Bhishma, the preceptor, Kripa, Gandhari, Dhritarashtra, Vasudeva, Yudhishthira,
    Bhima, Arjuna, and the twins are all said not to have liked the war.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Dhritarashtra says Duryodhana and Dussasana behaved maliciously toward the
    Pandavas, despite repeated prohibitions by Dhritarashtra, Gandhari, Vidura, Rama
    son of Jamadagni, and Vyasa, while following the counsels of Karna and Suvala's
    son.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Dhritarashtra says his fears arise from Arjuna and cannot be dispelled.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Arjuna is described as son of Kunti, son of Indra, equal in battle to Upendra,
    brave, Veda-knowing, splendid like fire and the Sun, knowledgeable in the Aindra
    weapon, and a mighty car-warrior whose weapons fall with the force of the thunderbolt.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Dhristadyumna, son of Drupada, is described as formidable and wise, and Dhritarashtra
