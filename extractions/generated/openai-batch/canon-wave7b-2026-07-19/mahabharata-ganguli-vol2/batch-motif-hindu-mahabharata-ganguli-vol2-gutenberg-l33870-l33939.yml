canonical_text:
  quote: ''
  summary: Sanjaya narrates a battle scene in which Bhishma and Drona strike Pandava
    warriors. Bhishma, though surrounded, is described through consuming fire imagery
    as he destroys cars, elephants, horsemen, and car-warriors. The field becomes
    strewn with broken vehicles, weapons, armor, bodies, and fallen standards, and
    the Pandava army breaks into a chaotic rout in which kin and friends strike one
    another.
