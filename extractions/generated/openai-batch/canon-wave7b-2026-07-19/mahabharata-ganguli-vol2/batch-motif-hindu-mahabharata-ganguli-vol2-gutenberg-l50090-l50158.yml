canonical_text:
  quote: ''
  summary: Sanjaya describes Bhimasena forcing his way through hostile ranks. Drona
    attempts to check him with arrows, but Bhima uses illusion, hurls a mace, routs
    troops, confronts Drona, throws down Drona's car, passes through multiple divisions,
    sees Arjuna fighting, and signals with roars that are answered by Arjuna and Krishna
    and heard by Yudhishthira.
