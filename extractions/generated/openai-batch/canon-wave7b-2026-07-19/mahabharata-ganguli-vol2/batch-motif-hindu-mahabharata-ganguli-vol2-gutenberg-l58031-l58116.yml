canonical_text:
  quote: ''
  summary: Sanjaya narrates a battle episode in which Satyaki is surrounded by Duryodhana,
    Karna, Kripa, and Kuru allies, while Yudhishthira, Bhima, and the sons of Madri
    protect him. The field is described as filled with severed bodies and broken chariot
    gear and is compared to mythic scenes of destruction. Yudhishthira orders the
    Srinjayas against Drona. Drona advances amid ominous portents, remembering sage-words
    about leaving the world for heaven, then slaughters many warriors and uses the
    Brahma weapon. Bhima places the weaponless Dhrishtadyumna on his chariot, tells
    him that Drona's death is his burden, and later rebukes Drona for a Brahmana's
    violence.
  language: English
  quote_policy: summarized
