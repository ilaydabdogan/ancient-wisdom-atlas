canonical_text:
  quote: ''
  summary: The passage lists warriors and allied groups advancing to battle, often
    identifying the color, ornaments, breed, or other qualities of the steeds that
    bear them. It gives a brief backstory for Sarangadhwaja, king of the Pandyas,
    including his father’s death by Krishna, his acquisition of weapons from famed
    teachers, his abandoned wish to destroy Dwaraka, and his present rule. It also
    describes Ghatotkacha, Vrihanta’s allegiance to Yudhishthira, and the Prabhadraka
    host proceeding with Bhimasena, compared in appearance to heavenly beings with
    Indra at their head.
  language: English
  quote_policy: summarized
