  cautions: The passage gives only a brief statement and does not narrate the outcome
    of this resolve.
- id: motif:3
  label: acquisition of weapons from renowned masters
  taxonomy_refs:
  - initiation
  basis: Sarangadhwaja obtains weapons from Bhishma, Drona, Rama, and Kripa and becomes
    equal in weapons to major heroes.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage does not describe a formal initiation rite; the taxonomy ref
    is therefore tentative.
- id: motif:4
  label: renunciation of destructive revenge after wise counsel
  taxonomy_refs: []
  basis: Sarangadhwaja intends to destroy Dwaraka and subjugate the world, but wise
    friends counsel him against it, after which he gives up revenge.
  evidence_refs:
  - ev:6
