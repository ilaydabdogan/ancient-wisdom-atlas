  category: action
  evidence_refs:
  - ev:4
- id: obs:4
  text: Sarangadhwaja’s country had been invaded, his kinsmen fled, and his father
    slain by Krishna; he later obtained weapons from Bhishma, Drona, Rama, and Kripa
    and became comparable in weapons to Rukmi, Karna, Arjuna, and Achyuta.
  category: sequence
  evidence_refs:
  - ev:5
