canonical_text:
  quote: ''
  summary: Warriors fear that Yudhishthira has been slain or will be seized by Drona.
    Arjuna arrives, routs the Kurus, and is described as creating and crossing a battlefield
    river of blood. He overwhelms Drona’s divisions with arrows until directions,
    sky, earth, friends, and foes are obscured. At sunset both sides withdraw. The
    Pandava-allied forces praise Arjuna, who retires to his tent with Kesava on a
    jeweled car, compared to the moon among stars.
  language: English
  quote_policy: summarized
