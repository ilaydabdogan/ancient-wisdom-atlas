canonical_text:
  quote: ''
  summary: In a battlefield episode, Bhagadatta wounds Bhimasena and his elephant
    alarms the opposing warriors. Ghatotkacha, a Rakshasa, responds by vanishing,
    creating a terrifying illusion, reappearing in fierce form, and leading illusory
    or supernatural elephants against Bhagadatta's elephant. Bhishma first urges the
    Kuru leaders to rescue Bhagadatta, then judges Ghatotkacha too dangerous to fight
    at that time and orders withdrawal. The Kauravas withdraw at night, the Pandavas
    celebrate victory, and Duryodhana grieves his slain brothers.
  language: English
  quote_policy: summarized
