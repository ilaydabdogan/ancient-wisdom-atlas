canonical_text:
  quote: They that were Nara and Narayana in days of yore are now Arjuna and Kesava.
  summary: Rama recounts how King Dambhodbhava demanded battle from the Rishis, was
    defeated by Nara using grass-blades, submitted, received moral instruction, and
    reformed. Rama then applies the example to warn the addressed Kuru king about
    Arjuna, Kesava, and the weapons of Gandiva, urging peace with the sons of Pandu.
  language: English
  quote_policy: quoted
