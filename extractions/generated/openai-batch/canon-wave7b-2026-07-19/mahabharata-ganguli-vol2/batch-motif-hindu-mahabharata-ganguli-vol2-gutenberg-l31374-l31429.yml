canonical_text:
  quote: ''
  summary: 'Dhritarashtra complains that Sanjaya always reports the Pandavas as cheerful
    and victorious while his own side is defeated, and he attributes this to Destiny.
    Sanjaya replies that Dhritarashtra''s warriors exert themselves, but their valor
    is made futile against the sons of Pandu; he also says the destruction swelling
    Yama''s domains arose from Dhritarashtra''s and his sons'' misconduct. Sanjaya
    then narrates a fierce forenoon combat: the Avanti brothers Vinda and Anuvinda
    attack Iravat, exchange arrows with him, suffer the loss of Anuvinda''s horses,
    bow, standard, and charioteer, and are vanquished as Iravat ravages the Dhartarashtra
    ranks.'
  language: English
  quote_policy: summarized
