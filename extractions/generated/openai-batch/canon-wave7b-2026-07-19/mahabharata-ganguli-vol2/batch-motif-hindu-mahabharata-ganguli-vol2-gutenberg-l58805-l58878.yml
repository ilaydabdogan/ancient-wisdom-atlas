  summary: Dhrishtadyumna rebukes Satyaki over unrighteous conduct, invokes forgiveness,
    catalogs contested acts of adharma by both sides, and says morality is hard to
    determine in war. Satyaki becomes enraged, takes up his mace, and rushes at Dhrishtadyumna,
    but Bhima, urged by Vasudeva, restrains him. Sahadeva then appeals to friendship
    among the allied groups and urges forgiveness.
