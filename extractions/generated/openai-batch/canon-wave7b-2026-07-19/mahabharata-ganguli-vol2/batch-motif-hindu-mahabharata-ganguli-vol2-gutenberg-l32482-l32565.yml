canonical_text:
  quote: Quickly then he soared up into the firmament like Garuda.
  summary: Sanjaya narrates that Ghatotkacha, after routing warriors and attacking
    Duryodhana, is surrounded, wounded, ascends into the sky, and roars. Yudhishthira
    orders Bhima to aid him. Bhima advances with allied warriors and elephants, causing
    fearful troops to leave Ghatotkacha. A confused and bloody battle follows, marked
    by dust, failed recognition between kin, infernal noise, a river of blood, severed
    bodies, and wounded elephants described through cloud and mountain imagery.
  language: English
  quote_policy: quoted
