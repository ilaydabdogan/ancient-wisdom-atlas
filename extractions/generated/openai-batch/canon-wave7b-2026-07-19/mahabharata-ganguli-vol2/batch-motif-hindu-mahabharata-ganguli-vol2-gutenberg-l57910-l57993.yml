canonical_text:
  quote: ''
  summary: Sanjaya describes Dhrishtadyumna attacking the grieving Drona with celestial
    weapons. The passage recalls that Dhrishtadyumna was obtained by Drupada through
    sacrifice for Drona's destruction. Drona's weapons fail to answer him as before,
    yet he continues fighting, cutting down Dhrishtadyumna's weapons, chariot, driver,
    and steeds. Dhrishtadyumna persists with mace, sword, and shield, maneuvers around
    Drona's chariot, and is compared to Garuda attacking a snake and to Vishnu before
    slaying Hiranyakasipu.
  language: English
  quote_policy: summarized
