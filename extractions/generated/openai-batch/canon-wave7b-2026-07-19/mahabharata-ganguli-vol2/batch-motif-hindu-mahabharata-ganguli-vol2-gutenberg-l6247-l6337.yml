canonical_text:
  quote: ''
  summary: Duryodhana and Arjuna separately come to Dwaraka to seek Krishna's aid
    for the impending war. Duryodhana arrives first and sits by Krishna's head while
    Krishna sleeps; Arjuna stands respectfully with joined hands, and Krishna sees
    Arjuna first on waking. Krishna grants Arjuna first choice between his large Narayana
    army and Krishna himself, unarmed and not fighting. Arjuna chooses Krishna; Duryodhana
    chooses the army. Balarama refuses to fight for either side, while Kritavarman
    gives Duryodhana an Akshauhini of troops. Krishna then agrees to serve as Arjuna's
    charioteer.
  language: English
