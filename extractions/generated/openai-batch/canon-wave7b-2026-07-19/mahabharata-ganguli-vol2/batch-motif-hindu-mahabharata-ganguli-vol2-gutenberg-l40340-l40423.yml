  quote: ''
  summary: 'Sanjaya narrates a battle deployment: numerous Pandava-allied warriors
    and regional contingents advance in chariots drawn by distinctively colored and
    ornamented steeds. Several move against Drona. Royal leaders and troop bodies
    are described with gold ornaments, standards, weapons, and named lineages. Dhrishtadyumna
    is identified as commander of the Pandava army and as having Drona as his allotted
    victim.'
