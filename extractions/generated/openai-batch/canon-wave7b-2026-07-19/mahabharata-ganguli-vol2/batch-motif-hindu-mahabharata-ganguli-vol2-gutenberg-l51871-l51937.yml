canonical_text:
  quote: ''
  summary: 'Dhritarashtra asks how Satyaki, after crossing the Kaurava forces, could
    be thrown down and humiliated by Bhurisravas. Sanjaya answers with a genealogy
    of Sini and an account of Devaki''s swayamvara: Sini took Devaki onto his car
    for Vasudeva, defeated and publicly humiliated Somadatta, and spared him. Somadatta
    then worshiped Mahadeva and received a boon for a son who would later humiliate
    Sini''s descendant; Bhurisravas fulfills this in battle. Sanjaya praises the Vrishnis
    and attributes the present events to Dhritarashtra''s policy.'
  language: English
  quote_policy: summarized
