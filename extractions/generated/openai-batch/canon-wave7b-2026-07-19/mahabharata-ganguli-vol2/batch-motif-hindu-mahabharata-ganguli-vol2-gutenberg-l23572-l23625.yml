canonical_text:
  quote: In him the universe merges (when dissolution comes), and from him it again
    emanates (when the creative desire seizes him).
  summary: Dhritarashtra asks Sanjaya to describe Varshas, mountains, and their inhabitants.
    Sanjaya gives a cosmographic account of Romanaka, Hiranmaya, Sringavat, Airavat,
    and Lord Hari north of the milky ocean. Dhritarashtra then reflects on Time, destruction,
    creation, and the names Vaikuntha and Vishnu.
  language: English
  quote_policy: quoted
