canonical_text:
  quote: ''
  summary: Narada meets Matali while traveling to Varuna and agrees to accompany him
    into the nether regions to search for a bridegroom. They visit Varuna, receive
    honor, and enter the region of the Nagas. Narada describes Varuna’s watery dominion,
    Pushkara and Jyotsnakali, Varuni wine, captured Daitya weapons, a lake containing
    fire and Vishnu’s discus, a guarded world-destroying bow, and Varuna’s showering
    umbrella before urging that they leave to continue their business.
  language: English
  quote_policy: summarized
