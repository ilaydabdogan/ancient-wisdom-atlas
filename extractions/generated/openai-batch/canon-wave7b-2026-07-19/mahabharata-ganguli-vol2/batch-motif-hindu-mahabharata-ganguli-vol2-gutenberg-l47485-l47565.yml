canonical_text:
  quote: ''
  summary: 'Sanjaya narrates a sequence of battlefield encounters: Vrihatkshatra kills
    Kshemadhurti; Dhrishtaketu kills Viradhanwan with a dart; Sahadeva disables Durmukha
    and kills Niramitra; Nakula vanquishes Vikarna; Satyaki defeats Vyaghradatta and
    the Magadhas; Drona then rushes toward Satyaki.'
  language: English
  quote_policy: summarized
