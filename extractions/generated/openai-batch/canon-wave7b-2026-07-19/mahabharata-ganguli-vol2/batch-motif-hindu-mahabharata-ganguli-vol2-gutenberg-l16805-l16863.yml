canonical_text:
  quote: ''
  summary: 'Vaisampayana narrates that a man of Dasarha''s race angrily addresses
    Duryodhana in the Kuru assembly, recounting Duryodhana''s alleged wrongs against
    the Pandavas: the gambling match, Draupadi''s humiliation, hostile speech, attempted
    burning at Varanavata, concealment at Ekachakra, attempted destruction by poison,
    snakes, and cords, and refusal to return the Pandavas'' paternal share or make
    peace. Dussasana then warns Duryodhana that if he refuses peace, the Kauravas
    may bind him and surrender him, along with Karna and Dussasana, to the Pandavas.'
  language: English
  quote_policy: summarized
