  quote: accepted them not, like a dying man refusing medicine
  summary: A wounded Bhishma praises Dhananjaya and Krishna, warns Duryodhana to make
    peace with the Pandavas before further destruction, proposes that the Pandavas
    receive half the kingdom and that Yudhishthira go to Indraprastha, then falls
    silent and practices yoga despite arrow-wounds. Sanjaya reports that Duryodhana
    rejects the peaceful counsel.
