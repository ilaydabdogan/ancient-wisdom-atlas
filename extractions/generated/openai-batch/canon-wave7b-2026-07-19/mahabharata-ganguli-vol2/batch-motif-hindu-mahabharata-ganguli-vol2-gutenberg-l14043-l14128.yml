canonical_text:
  quote: ''
  summary: Krishna visits his paternal aunt Pritha after meeting Vidura. Pritha embraces
    him, weeps, receives him with hospitality, and laments the sufferings of her sons,
    contrasting their former royal comfort with their exile in the forest. She praises
    Yudhishthira's virtue and royal fitness, Bhima's strength and obedience, Arjuna's
    martial supremacy and role as refuge, and Sahadeva's compassion, modesty, youth,
    and service to his brothers.
  language: English
  quote_policy: summarized
