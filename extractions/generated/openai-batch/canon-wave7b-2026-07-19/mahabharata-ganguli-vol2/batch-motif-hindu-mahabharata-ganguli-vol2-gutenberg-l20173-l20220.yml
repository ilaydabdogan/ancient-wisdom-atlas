canonical_text:
  quote: Array (yourselves) before sunrise tomorrow!
  summary: Several Pandava-allied figures give Uluka replies and battle vows for Duryodhana.
    Sikhandin vows to slay Bhishma and says he was created for that purpose; Dhrishtadyumna
    vows to slay Drona. Yudhishthira disclaims desire for kin-slaughter but blames
    Duryodhana and permits Uluka to depart. Uluka returns and reports the speeches,
    after which Duryodhana orders the army arrayed before sunrise.
  language: English
  quote_policy: quoted
