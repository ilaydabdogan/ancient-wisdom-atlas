canonical_text:
  quote: ''
  summary: Vidura counsels a king not to speak falsely for land or from affection
    for his son. He teaches that divine protection comes through intelligence, that
    falsehood and sinful conduct lead to ruin, and that character is tested by conduct,
    danger, poverty, and calamity. He lists improper witnesses, grave offenders, destructive
    passions, and virtues connected with prosperity, royal favour, heaven, and the
    good.
  language: English
