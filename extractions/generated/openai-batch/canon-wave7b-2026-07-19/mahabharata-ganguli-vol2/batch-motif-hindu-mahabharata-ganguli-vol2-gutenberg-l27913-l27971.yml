  quote: ''
  summary: Sanjaya describes Duryodhana responding to a Pandava battle array called
    Krauncha, exhorting allied warriors, ordering troops to protect Bhishma, and arranging
    the Kaurava army. Both sides sound conches, drums, and roars, including named
    conches blown by leading Pandava-side figures, before the Kurus and Pandavas advance
    against each other again.
