canonical_text:
  quote: ''
  summary: Narada recounts how Galava brings Madhavi to king Divodasa of the Kasis.
    Divodasa agrees to beget one royal son upon her, citing his wealth in steeds.
    Galava gives Madhavi to Divodasa, who duly weds her. Their union is compared to
    many divine, sage, royal, and epic couples. Madhavi bears Divodasa a son named
    Pratardana. At the appointed time Galava asks for Madhavi back while allowing
    the steeds to remain with Divodasa, and Divodasa returns her.
  language: English
  quote_policy: summarized
