  quote: This battle between the Kurus and the Pandavas, resembling that (of old)
    between the gods and the Asuras...
  summary: Dhritarashtra asks Sanjaya to narrate the combat involving Salya and Subhadra's
    son. Sanjaya describes Salya and Bhima entering a mace duel, their evenly matched
    blows, their simultaneous fall, Kritavarman carrying away the unconscious Salya,
    Bhima rising, and the subsequent fear and flight of Dhritarashtra's forces while
    the Pandavas rejoice.
