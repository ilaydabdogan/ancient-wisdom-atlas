  text: Duryodhana asks Bhishma to calculate whether the promised period has fallen
    short or been exceeded.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Duryodhana says his side came to fight the Matsyas and seize cattle stationed
    toward the north while aiding the Trigartas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Duryodhana describes an arrangement in which the Trigartas first seize cattle
    on the seventh lunar day and his side seizes cattle at sunrise on the eighteenth
    day while the Matsya king pursues the first seizure.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Duryodhana considers several possibilities for the approaching force, including
    the Trigartas, the king of the Matsyas, the Matsya army, or a mighty leader among
    them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Duryodhana says they must fight whether the opponent is the king of the Matsyas
    or Vibhatsu, and he rebukes leading car-warriors as panic-stricken.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Duryodhana says that if an encounter occurs over the seized cattle even with
