canonical_text:
  quote: ''
  summary: Duryodhana argues on the battlefield that Arjuna's apparent appearance
    may violate the Pandavas' period of exile and concealment, explains the planned
    seizure of the Matsyas' cattle with the Trigartas, and urges battle. Karna then
    criticizes Drona's fear and praise of Arjuna, dismisses the neighing of Arjuna's
    horses as insufficient evidence, and orders the cattle secured and the army arrayed.
  language: English
  quote_policy: summarized
