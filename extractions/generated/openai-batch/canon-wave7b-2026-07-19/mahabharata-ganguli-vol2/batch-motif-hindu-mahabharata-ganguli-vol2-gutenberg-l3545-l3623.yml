  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Duryodhana claims the thirteenth year is still running and that Vibhatsu has
    appeared before them; he says this would require the Pandavas to spend another
    twelve years in the woods.
  category: speech
  evidence_refs:
  - ev:1
