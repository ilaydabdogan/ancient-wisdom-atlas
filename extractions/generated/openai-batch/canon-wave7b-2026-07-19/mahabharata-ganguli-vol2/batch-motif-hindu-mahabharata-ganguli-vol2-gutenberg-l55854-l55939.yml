canonical_text:
  quote: ''
  summary: In a night battle, Duryodhana orders Karna protected against Ghatotkacha.
    Alamvusha, son of Jatasura, asks permission to avenge his father by killing the
    Pandavas and offering their blood and flesh to his dead sire; Duryodhana instead
    sends him against Ghatotkacha. Alamvusha and Ghatotkacha fight with arrows, bodily
    force, weapons, vehicles, and many illusionary forms. Ghatotkacha finally seizes
    Alamvusha, beheads him, and throws the bloodied head onto Duryodhana's car while
    threatening Karna and Duryodhana.
  language: English
  quote_policy: summarized
