canonical_text:
  quote: ''
  summary: Sanat-sujata teaches that yogic practice, Vedic sacrifice, hidden ascetic
    conduct, knowledge of the Supreme Soul, and disciplined virtues lead to different
    forms of spiritual outcome. He contrasts public honour and ritual exertion with
    concealed practice, wisdom, non-dual self-knowledge, and the six difficult gates
    of truth, uprightness, modesty, self-control, purity, and knowledge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sanat-sujata says some regenerate persons proud of Yoga practices depart and
    shine in the region of Brahman.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: He says some regenerate persons who perform sacrifices and other Vedic rites
    are freed from this world and proceed to the abode of the deities.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: He describes another group conversant with the Vedas who hold sacrifices and
    rites to be obligatory and are wedded to external forms; he says they should not
    be regarded very highly.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: He instructs that a Yogin should seek livelihood where food and drink suitable
    for a Brahmana are abundant and should not afflict a householder of scant means
    or himself by hunger and thirst.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: He says that one who does not proclaim superiority is better than one who
    discloses it in a place of inconvenience or danger.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: He says food offered by a person who is not pained at another's superiority
    and who shares with Brahmanas and guests is approved by the righteous.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: He compares Yogins who procure livelihood by disclosing their pre-eminence
    to dogs that consume their own evacuations or vomit to their injury.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: He says the wise know as a Brahmana the person who lives among kindred while
    wishing his religious practices to remain unknown to them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: He describes the Supreme Soul as unconditioned, without attributes, unchangeable,
    one and alone, and without duality.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: He says a Kshatriya can know the Supreme Soul and behold it in his own soul
    through such practices.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: He says a Brahmana should be without exertion, never accept gifts, be quiet,
    and appear otherwise than conversant with the Vedas in order to attain knowledge
    and know Brahman.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: He says a performer of sacrifices who meets gods that bestow desirable objects
    is not equal to one who knows Brahman.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: He teaches that worldly esteem and ascetic practice cannot exist together,
    assigning this world to candidates for esteem and the other world to those devoted
    to asceticism.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: 'He lists six difficult gates to the last kind of prosperity: truth, uprightness,
    modesty, self-control, purity of mind and conduct, and knowledge of the Vedas.'
  category: object
  evidence_refs:
  - ev:7
