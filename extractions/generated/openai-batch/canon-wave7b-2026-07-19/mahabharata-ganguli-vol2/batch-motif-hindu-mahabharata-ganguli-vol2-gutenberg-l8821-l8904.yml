canonical_text:
  quote: One's body, O king, is one's car; the soul within is the driver; and the
    senses are its steeds.
  summary: 'Vidura gives the king moral and political counsel: speak truth for the
    hearer’s good, avoid unjust means, deliberate before action, govern with measure,
    master the senses and speech, avoid sinful association, and recognize that dimmed
    intellect precedes defeat. The passage ends while Vidura is warning that clouded
    intellect has possessed the king’s sons.'
  language: English
  quote_policy: quoted
