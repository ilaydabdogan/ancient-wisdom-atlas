canonical_text:
  quote: ''
  summary: The Holy One teaches the son of Kunti about the body as Kshetra, the knower
    as Kshetrajna, true knowledge, the object of knowledge as Supreme Brahma, and
    the relation of Nature and Spirit. The passage describes paths of meditation,
    Sankhya devotion, works, and hearing-based worship, and says that knowledge of
    the matter-spirit distinction leads beyond death, rebirth, and toward the Supreme.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker calls the body Kshetra and the knower of it Kshetrajna, and treats
    knowledge of Kshetra and Kshetrajna as true knowledge.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kshetra in its modified form is described through elements, egoism, intellect,
    the unmanifest, senses, sense-objects, desire, aversion, pleasure, pain, body
    consciousness, and courage.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Knowledge is defined through qualities and practices such as absence of vanity,
    non-injury, forgiveness, purity, self-restraint, detachment, devotion, solitude,
    and perception of truth; its contrary is called ignorance.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The object of knowledge is identified as Supreme Brahma, described as beginningless,
    all-pervading, present with hands, feet, eyes, heads, and faces on all sides,
    and seated in the hearts of all.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker says that a devotee who knows Kshetra, Knowledge, and the Object
    of Knowledge becomes one in spirit with him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Nature and Spirit are said to be beginningless; modifications and qualities
    spring from Nature, while Spirit dwelling in Nature enjoys the qualities.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Connection with the qualities is given as the cause of births in good or evil
    wombs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Supreme Purusha in the body is described as surveyor, approver, supporter,
    enjoyer, mighty lord, and Supreme Soul.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage lists meditation, Sankhya devotion, devotion through works, and
    worship based on hearing from others as paths by which people may cross over death
    or avoid rebirth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Seeing the Supreme Lord dwelling alike in all beings, and seeing actions as
    wrought by Nature while the self is not the doer, is linked with reaching the
    highest goal and attaining Brahma.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The soul is compared to ubiquitous space that is not tainted, and Spirit is
    compared to the single Sun lighting the entire world.
  category: other
  evidence_refs:
  - ev:8
