canonical_text:
  quote: To dwell with a king is, alas, difficult.
  summary: After the Pandavas plan their offices for a period of hidden residence,
    they seek Dhaumya's advice. Dhaumya approves their arrangements, urges special
    provision for Draupadi's protection, and gives detailed instructions for living
    in a king's palace without discovery or fault. He presents the king as a dangerous
    sacred authority and outlines protocols of access, speech, secrecy, seating, humility,
    bodily restraint, loyalty, and courtly praise.
  language: English
  quote_policy: quoted
