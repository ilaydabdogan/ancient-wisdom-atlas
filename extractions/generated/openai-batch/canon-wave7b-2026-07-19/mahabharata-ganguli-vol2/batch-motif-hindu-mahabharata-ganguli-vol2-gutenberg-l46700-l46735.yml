canonical_text:
  quote: ''
  summary: At dusk on a dusty battlefield, Sanjaya describes Arjuna and Vasudeva advancing
    by chariot toward the ruler of the Sindhus. Arjuna clears a path with arrows while
    Vasudeva drives with skill and extraordinary speed. The arrows are likened to
    Yuga-fire and kill foes ahead of the chariot. The chariot horses, though swift,
    become hungry, thirsty, wounded, and weary as they move over corpses, broken cars,
    and dead elephants.
  language: English
  quote_policy: summarized
