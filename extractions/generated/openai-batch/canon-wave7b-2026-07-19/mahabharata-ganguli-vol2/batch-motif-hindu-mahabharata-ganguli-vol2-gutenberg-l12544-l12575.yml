canonical_text:
  quote: ''
  summary: Vaisampayana narrates that Duryodhana disregards Sanjaya’s words, the assembled
    kings depart, and Dhritarashtra privately asks Sanjaya to compare the strengths
    and weaknesses of his side and the Pandavas and to say which party will perish
    in battle. Sanjaya refuses to answer in secret, asking that Vyasa and Gandhari
    be summoned as morally perceptive witnesses. Dhritarashtra has them brought into
    court by Vidura, and Vyasa instructs Sanjaya to tell Dhritarashtra truly what
    he knows about Vasudeva and Arjuna.
  language: English
  quote_policy: summarized
