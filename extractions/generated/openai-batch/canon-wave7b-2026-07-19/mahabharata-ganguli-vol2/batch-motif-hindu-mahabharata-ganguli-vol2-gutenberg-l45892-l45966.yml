canonical_text:
  quote: ''
  summary: Arjuna disables Srutayudha in battle. The passage gives Srutayudha’s parentage
    as Varuna and the river Parnasa, and recounts Varuna’s conditional gift of a mace
    that would make him invincible unless used against one not engaged in combat.
    Srutayudha hurls it at Janardana/Krishna, who is not fighting; the mace returns
    and kills Srutayudha. Sudakshina of the Kamvojas then attacks Arjuna, wounds him
    with an iron dart, but Arjuna recovers, destroys Sudakshina’s chariot, and kills
    him.
  language: English
  quote_policy: summarized
