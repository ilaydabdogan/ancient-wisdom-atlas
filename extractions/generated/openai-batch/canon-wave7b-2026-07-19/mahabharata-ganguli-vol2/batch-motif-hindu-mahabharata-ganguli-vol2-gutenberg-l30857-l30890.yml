canonical_text:
  quote: ''
  summary: Sanjaya narrates that Duryodhana recovers and renews combat against Bhima
    with arrows. Bhima mounts his car, exchanges severe arrow-strikes with Duryodhana,
    and then confronts Duryodhana's brothers, who had resolved to strike him down.
    Bhima wounds Chitrasena and smites the other sons. Yudhishthira sends twelve car-warriors,
    including Abhimanyu, to follow Bhima; seeing these radiant warriors, Duryodhana's
    sons abandon their fight with Bhima.
  language: English
  quote_policy: summarized
