canonical_text:
  quote: ''
  summary: Sthanu and Rudra appeal to Brahma to show grace because creatures are being
    consumed by a fire born from Brahma's wrath. Brahma explains that the goddess
    Earth, burdened by creatures, had urged destruction, and that wrath arose when
    he found no means to reduce creation. Brahma then withdraws his wrath, extinguishes
    the fire, and a female being emerges from his senses and body. Brahma names her
    Death and commands her to slay creatures; she weeps, and he catches her tears
    for the benefit of creatures.
  language: English
  quote_policy: summarized
