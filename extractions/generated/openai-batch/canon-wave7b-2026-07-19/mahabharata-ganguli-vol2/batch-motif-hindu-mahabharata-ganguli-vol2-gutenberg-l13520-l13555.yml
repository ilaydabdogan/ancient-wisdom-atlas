canonical_text:
  quote: ''
  summary: A weeping female figure called Krishna approaches Krishna/Kesava, holds
    up her tresses that had been seized by Dussasana, rejects peace without vengeance,
    and names warriors who may fight for her. Kesava comforts her, foretells enemy
    bereavement and death, invokes fate and the Ordainer, and swears that his words
    will not fail.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The female figure called the beautiful Krishna approaches the lotus-eyed Krishna
    while crying and holding her own tresses in her left hand.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Her tresses are described as curly-ended, deep-blue, perfumed, auspicious,
    braided, soft, glossy, and like a mighty snake.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: She asks Krishna, who is seeking peace with the enemy, to remember that Dussasana's
    hands seized her tresses.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: She says that if Bhima and Arjuna desire peace, her aged father, his war-like
    sons, her five sons, and Abhimanyu will fight the Kauravas.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: She says her heart cannot know peace unless she sees Dussasana's dark arm
    severed from his body and pulverised.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: She says she has spent thirteen years hiding wrath in her heart like a smouldering
    fire, and that Bhima's words about morality pierce her heart.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: She weeps aloud with sobs, and her tears are described as hot as liquid fire.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Kesava comforts her by saying that the ladies of Bharata's race will weep
    as she does when their kinsmen and friends are slain.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Kesava says that, with Bhima, Arjuna, the twins, and Yudhishthira's command,
    and in accordance with fate and the Ordainer, he will accomplish the destruction
    described.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Kesava says that if the sons of Dhritarashtra do not listen to his words,
    they will lie on the earth as food for dogs and jackals.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Kesava swears that his words cannot be futile even if Himavat's mountains
    shift, the Earth splits, and the starry firmament falls; he tells her to stop
    crying and promises she will see her husbands victorious and prosperous.
  category: speech
  evidence_refs:
  - ev:11
