canonical_text:
  quote: ''
  summary: Sanjaya narrates Satyaki/Yuyudhana advancing toward Arjuna through the
    Kaurava army after defeating other forces. Satyaki is described with golden, radiant
    martial equipment and is compared to Meru and the sun. Surrounded and pursued
    by named Kaurava warriors, he tells his charioteer to proceed slowly and vows
    to resist the sea-like army with arrows. He kills many troops, and the battle
    is compared to the conflict of gods and Asuras. Duryodhana and other commanders
    wound him, and he retaliates against them.
  language: English
  quote_policy: summarized
