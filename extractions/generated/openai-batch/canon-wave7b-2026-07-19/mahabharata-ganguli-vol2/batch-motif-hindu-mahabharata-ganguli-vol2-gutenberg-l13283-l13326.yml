canonical_text:
  quote: ''
  summary: Arjuna addresses Krishna, assesses the prospects of peace with the foe,
    asks Krishna to attempt peace for the good of both Pandavas and Kurus, and says
    the Pandavas will honor Krishna's choice whether peace, war, or another treatment
    of Duryodhana. Arjuna recalls Duryodhana's deceitful dice, the loss of the kingdom,
    banishment to the woods, and Draupadi's public insult, then urges Krishna to do
    what is proper and beneficial for the Pandavas.
  language: English
  quote_policy: summarized
