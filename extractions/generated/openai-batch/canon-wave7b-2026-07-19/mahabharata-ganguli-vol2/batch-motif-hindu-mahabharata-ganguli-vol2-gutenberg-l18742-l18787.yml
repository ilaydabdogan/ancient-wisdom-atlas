canonical_text:
  quote: ''
  summary: Vasudeva reports that Duryodhana rejected counsel from elders and left
    the assembly in anger. Duryodhana ordered allied rulers to march to Kurukshetra
    under the ascendant Pushya constellation, with Bhishma made generalissimo over
    the Kaurava host. Vasudeva recounts his attempts at conciliation, dissension,
    supernatural display, rebuke, intrigue, and proposed settlement, including the
    offer that the Pandavas accept dependence and receive only five villages. He concludes
    that Duryodhana will not yield the kingdom without battle and that the assembled
    kings are moving toward universal destruction.
  language: English
  quote_policy: summarized
