canonical_text:
  quote: ''
  summary: In Section LXXXI, Sahadeva urges Krishna to ensure war with the Kauravas
    even if they seek peace with the Pandavas, citing the treatment of the princess
    of Panchala and his desire to fight Duryodhana. Satyaki endorses Sahadeva, says
    his rage toward Duryodhana can be appeased only by death, recalls Krishna's rage
    at seeing the distressed Pandavas in the woods, and says the assembled warriors
    agree. The warriors roar, praise Satyaki, and rejoice at the prospect of fighting.
  language: English
  quote_policy: summarized
