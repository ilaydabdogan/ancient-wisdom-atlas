canonical_text:
  quote: ''
  summary: Dhritarashtra asks what Duryodhana and Bhishma did after Falguni vowed
    to slay Bhishma. Sanjaya reports that Bhishma accepted command of Duryodhana's
    army, invoked Kumara, described his knowledge of military arrays, and reassured
    Duryodhana. Duryodhana expressed confidence and asked Bhishma to classify the
    warriors as Rathas and Atirathas. Bhishma listed and evaluated principal Kaurava-side
    warriors, including Duryodhana and his brothers, Kritavarman, Salya, Bhurisravas,
    and the king of the Sindhus, noting the Sindhu king's past humiliation after abducting
    Draupadi, his austerities, and his boon for battle against the Pandavas.
  language: English
  quote_policy: summarized
