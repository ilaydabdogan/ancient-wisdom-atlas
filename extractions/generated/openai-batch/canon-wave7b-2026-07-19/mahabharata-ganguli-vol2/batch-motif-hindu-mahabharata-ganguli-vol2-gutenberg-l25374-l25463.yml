  quote: ''
  summary: Krishna instructs Arjuna that knowledge dispels doubt and that disciplined
    action without attachment is superior to mere abandonment of action. He describes
    the unity of Sankhya and Yoga in result, nonattachment, equality of vision, inner
    happiness, absorption into Brahma, yogic restraint of senses and breath, and tranquillity
    through knowing Krishna as lord, sacrificer’s enjoyer, and friend of all creatures.
  language: English
  quote_policy: summarized
