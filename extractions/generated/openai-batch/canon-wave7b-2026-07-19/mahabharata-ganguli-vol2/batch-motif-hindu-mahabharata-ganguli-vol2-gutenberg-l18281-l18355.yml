canonical_text:
  quote: ''
  summary: After Krishna's peace mission fails, Vidura tells Kunti that Duryodhana
    refuses counsel and that war and destruction are coming. Kunti grieves over the
    impending slaughter of kinsmen, fears Karna's power on Duryodhana's side, recalls
    Durvasa's mantra-boon and her maiden summons of Surya, and resolves to disclose
    the hidden truth to Karna. She goes to the Ganga, waits behind Karna while he
    prays facing east with raised arms, and Karna turns, sees her, and respectfully
    salutes her.
  language: English
  quote_policy: summarized
