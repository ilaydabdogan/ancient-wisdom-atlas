  quote: ''
  summary: A Pandava-aligned speaker urges Satyaki to go aid Arjuna, invoking Satyaki's
    loyalty, truthfulness, martial skill, Arjuna's praise of him, and the merit of
    risking one's life for friends. The speaker reports that Suyodhana and other Kaurava
    warriors have followed Arjuna, that Drona threatens the speaker's forces, and
    that Arjuna is alone within an immense hostile army before Jayadratha.
