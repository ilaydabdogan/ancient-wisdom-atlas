canonical_text:
  quote: ''
  summary: Sahadeva, dressed and speaking as a cowherd, comes to King Virata’s cowpen
    under assumed identities. Virata suspects that his appearance is too noble for
    a Vaisya’s office, but Sahadeva presents himself as an experienced keeper of cattle
    formerly employed by Yudhishthira. He claims extensive knowledge of cattle, including
    their past, present, and future condition, disease prevention, multiplication,
    and auspicious bulls connected with fertility. Virata places his cattle and keepers
    under Sahadeva’s charge, and Sahadeva remains unrecognized except by his brothers.
  language: English
  quote_policy: summarized
