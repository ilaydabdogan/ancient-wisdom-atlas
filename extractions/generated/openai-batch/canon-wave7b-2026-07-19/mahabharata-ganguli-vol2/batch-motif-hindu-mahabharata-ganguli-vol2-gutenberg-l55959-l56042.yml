canonical_text:
  quote: ''
  summary: Sanjaya describes the gigantic Rakshasa Ghatotkacha, his armor, chariot,
    steeds, driver, standard, and thunderous bow as he advances at night against Karna.
    Karna and Ghatotkacha fight an intense and evenly matched chariot duel. When Karna
    invokes celestial weapons, Ghatotkacha answers with Rakshasa illusion, producing
    a terrifying force and a rain of rocks and weapons that causes many combatants
    to flee while Karna remains firm.
  language: English
