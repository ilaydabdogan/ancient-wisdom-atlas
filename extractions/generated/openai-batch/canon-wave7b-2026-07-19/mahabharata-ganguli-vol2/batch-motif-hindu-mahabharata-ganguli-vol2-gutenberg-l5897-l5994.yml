canonical_text:
  quote: ''
  summary: 'After Abhimanyu''s nuptials, allied kings and heroes assemble in Virata''s
    decorated court. Krishna addresses the assembly about Yudhishthira and the Pandavas:
    their deceitful dice defeat, loss of kingdom, pledged exile, hardship, and rightful
    claim. Krishna urges a righteous and peaceful course, recommending that an able
    ambassador ask the sons of Dhritarashtra to give half the kingdom to Yudhishthira.'
  language: English
  quote_policy: summarized
