literal_observations:
- id: obs:1
  text: Vidura says that when an aged and venerable guest comes to a young man's house,
    the host should advance, salute, offer a seat, bring water, have the guest's feet
    washed, make welcoming inquiries, discuss affairs, and offer food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that a man lives in vain if a Brahmana conversant with
    mantras does not accept water, honey, curds, and kine in his dwelling because
    of fear, miserliness, or unwillingness in the giving.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says that even guests described as undeserving should receive
    water from a householder.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Brahmana is instructed not to sell salt, cooked food, curds, milk, honey,
    oil, clarified butter, sesame, meat, fruits, roots, potherbs, dyed clothes, perfumery,
    and treacle.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A real Yogin of the Bhikshu order is described as without anger, above grief,
    beyond need of friendship and quarrels, indifferent to praise and blame, and withdrawn
    from agreeable and disagreeable things.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: A virtuous forest ascetic is described as living on wild rice, roots, or potherbs,
    controlling his soul, keeping fire for worship, dwelling in the woods, and being
    regardful of guests.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage warns that one should not feel secure after wronging an intelligent
    person merely because of distance, since intelligent persons have long arms by
    which they can return wrongs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage advises renouncing envy, protecting wives, giving others what
