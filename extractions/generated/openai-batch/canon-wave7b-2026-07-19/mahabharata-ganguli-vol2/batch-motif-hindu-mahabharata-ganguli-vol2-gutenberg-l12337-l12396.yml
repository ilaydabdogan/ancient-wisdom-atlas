canonical_text:
  quote: Self-restraint enhanceth energy, and is an excellent and holy attribute.
  summary: Duryodhana argues that the sons of Pritha are human and equal to his own
    side, boasts that he, Karna, and Dussasana will slay the five Pandavas, and promises
    post-victory sacrifices and gifts to Brahmanas. Vidura replies with a discourse
    praising self-restraint, wisdom, control of the senses, universal harmlessness,
    renunciation, emancipation, absorption into Brahma, and heavenly regions for the
    renunciant.
  language: English
  quote_policy: quoted
