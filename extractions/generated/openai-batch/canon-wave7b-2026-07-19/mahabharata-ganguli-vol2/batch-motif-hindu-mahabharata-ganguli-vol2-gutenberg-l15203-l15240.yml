canonical_text:
  quote: ''
  summary: Narada describes Rasatala, the seventh stratum below Earth, where Surabhi,
    mother of all kine, dwells. Her milk creates or sustains sacred substances including
    the Milky Ocean, and four cows born from her support the four quarters. The gods
    and Asuras churned ocean waters mixed with the cows' milk using Mandara mountain
    and obtained divine treasures. A remembered couplet praises Rasatala as a happy
    residence.
  language: English
  quote_policy: summarized
