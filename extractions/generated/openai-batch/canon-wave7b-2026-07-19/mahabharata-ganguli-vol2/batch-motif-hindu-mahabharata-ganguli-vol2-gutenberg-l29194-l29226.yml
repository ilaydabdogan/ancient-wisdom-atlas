canonical_text:
  quote: ''
  summary: Amid a battlefield rout, Bhishma sights Arjuna by the ape emblem on his
    standard and rushes toward him. Other named warriors also advance against Arjuna.
    Abhimanyu leaves the ranks, confronts those warriors, and baffles their weapons,
    being compared to Agni on a sacrificial altar. Bhishma creates a river of foes'
    blood in battle, avoids Abhimanyu, and engages Arjuna. Arjuna and Bhishma exchange
    arrow-showers, and the Kurus, Srinjayas, and others witness their single combat.
  language: English
  quote_policy: summarized
