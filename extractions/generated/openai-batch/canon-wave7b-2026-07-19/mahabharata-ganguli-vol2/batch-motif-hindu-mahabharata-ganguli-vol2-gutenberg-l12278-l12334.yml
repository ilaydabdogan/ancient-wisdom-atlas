canonical_text:
  quote: ''
  summary: Karna recalls that Rama cursed him because he obtained the Brahma weapon
    by false pretence, but he claims he still possesses the weapon and vows to destroy
    the Pandavas and allied peoples for Duryodhana. Bhishma rebukes him, invokes Arjuna's
    earlier feat with Krishna, predicts that Karna's divine and serpent-mouthed shafts
    will fail against Krishna and Arjuna, and says Vasudeva protects Arjuna. Karna
    responds by laying down his weapons and withdrawing from battle while Bhishma
    remains active. After Karna leaves, Bhishma laughs at his pledges and again condemns
    the deceit by which Karna obtained the weapon from Rama.
  language: English
  quote_policy: summarized
