canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanjaya how Satyaki could pass alone through the Kaurava
    force toward Arjuna. Sanjaya describes the unprecedented battle array and uproar
    with end-of-yuga and stormy-ocean similes, reports exhortations by Pandava leaders
    to aid Madhava and Arjuna in reaching Jayadratha, and narrates reckless fighting,
    Satyaki's advance, sun-glare from armor, and Duryodhana's penetration of the Pandava
    host. Dhritarashtra then worries whether Duryodhana turned back from the unequal
    fight.
  language: English
  quote_policy: summarized
