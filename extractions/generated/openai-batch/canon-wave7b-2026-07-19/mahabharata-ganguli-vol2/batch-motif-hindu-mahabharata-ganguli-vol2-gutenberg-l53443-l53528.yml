canonical_text:
  quote: ''
  summary: Sanjaya narrates that Somadatta, enraged over Bhurisravas's death, rebukes
    Satyaki for violating Kshatriya conduct and vows to kill him before nightfall
    or suffer hell. Satyaki replies without fear and makes a counter-vow by Krishna's
    feet. The two fight; allies gather around Somadatta, Dhrishtadyumna advances toward
    Satyaki, and Satyaki wounds Somadatta so severely that he swoons and is carried
    away. Drona then rushes against Satyaki; Pandava warriors protect him, and Drona
    wounds many named warriors and routs Yudhishthira's troops until Arjuna advances
    and the host rallies.
  language: English
  quote_policy: summarized
