candidate_motifs:
- id: motif:1
  label: Warrior-code accusation after killing a helpless opponent
  taxonomy_refs: []
  basis: Somadatta frames Satyaki's killing of Bhurisravas, who had sat in Praya and
    had his arms cut off, as a violation of Kshatriya duty.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents Somadatta's accusation; it does not independently
    adjudicate the charge.
- id: motif:2
  label: Vengeance vow with self-curse
  taxonomy_refs:
  - divine_judgment
  basis: Somadatta swears by sons, dear things, and merit to kill Satyaki before nightfall,
    and invokes terrible hell upon himself if he fails.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The divine_judgment taxonomy link is based on the oath's threatened hell
    consequence, not on an explicit divine trial in the passage.
- id: motif:3
  label: Counter-vow by sacred feet
  taxonomy_refs: []
  basis: Satyaki answers Somadatta's threat by swearing by Krishna's feet and his
    good acts to kill Somadatta and his sons unless Somadatta flees.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage supplies the oath formula but does not elaborate ritual details.
- id: motif:4
  label: Protected duel within massed armies
  taxonomy_refs: []
  basis: Duryodhana and Sakuni surround Somadatta with troops, while Dhrishtadyumna
    and later Pandava warriors move to protect or rescue Satyaki.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: This is a battlefield pattern rather than a named mythic motif.
- id: motif:5
  label: Hero wounded into swoon and removed by charioteer
  taxonomy_refs: []
  basis: Satyaki's arrows cause Somadatta to lose consciousness on his car terrace,
    and Somadatta's driver carries him away from battle.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage describes battlefield removal, not death or resurrection.
- id: motif:6
  label: Overwhelming preceptor routs warriors until champion advances
  taxonomy_refs: []
  basis: Drona wounds numerous warriors and routs troops, but Arjuna's advance toward
    him causes Yudhishthira's host to rally.
  evidence_refs:
