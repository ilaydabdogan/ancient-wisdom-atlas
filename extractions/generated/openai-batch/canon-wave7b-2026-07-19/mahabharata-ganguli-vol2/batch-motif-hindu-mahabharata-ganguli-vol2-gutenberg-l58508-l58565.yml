canonical_text:
  quote: ''
  summary: Sanjaya reports that the Narayana weapon is invoked, producing violent
    natural disturbances, omens, darkness, and fear among beings. Dhritarashtra asks
    what counsel the Pandavas adopted to protect Dhrishtadyumna when the Kauravas
    advanced again under Drona's grieving son. Yudhishthira recounts the Kuru army's
    rout after Drona's death, describes battlefield chaos, and asks Arjuna who has
    rallied the returning host, whose uproar he compares to the thunderbolt-wielder
    or Vasava.
  language: English
  quote_policy: summarized
