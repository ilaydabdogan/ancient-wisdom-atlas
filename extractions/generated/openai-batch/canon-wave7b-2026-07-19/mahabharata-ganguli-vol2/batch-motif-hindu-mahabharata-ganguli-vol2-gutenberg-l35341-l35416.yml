canonical_text:
  quote: ''
  summary: Duryodhana exhorts Kaurava forces and allied warriors to attack Arjuna
    under Bhishma's protection. Arjuna uses celestial weapons and vast showers of
    arrows to rout the attackers, defeat several named car-warriors, and leave the
    battlefield filled with blood, bodies, broken vehicles, scavenging creatures,
    spirits, and ominous winds. Bhishma advances against Arjuna with a celestial weapon,
    but Sikhandin confronts him and Bhishma withdraws the fire-like weapon while Arjuna
    continues slaughtering the troops.
  language: English
  quote_policy: summarized
