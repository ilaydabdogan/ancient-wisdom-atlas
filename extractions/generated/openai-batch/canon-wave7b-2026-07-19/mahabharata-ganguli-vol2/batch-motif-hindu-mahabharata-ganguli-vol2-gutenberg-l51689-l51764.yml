canonical_text:
  quote: ''
  summary: Sanjaya reports that Arjuna cuts off Bhurisravas's armed arm while Bhurisravas
    is restraining Satyaki. Bhurisravas accuses Arjuna of violating righteous warfare
    by attacking him unseen and while he was engaged with another. Arjuna answers
    that he acted to protect Satyaki, his disciple and kinsman, who was exhausted
    and about to be beheaded, and argues that failing to protect him would have been
    sinful negligence.
