canonical_text:
  quote: ''
  summary: 'Sanjaya describes a fierce battle: Phalguni is surrounded and repels many
    weapons; Satyaki and Abhimanyu fight from one car; Drona and Bhishma attack Yudhishthira''s
    division; Bhima wounds Duryodhana, whose army flees and is later rallied; Duryodhana
    accuses Bhishma of holding back against the Pandavas, and Bhishma answers that
    the Pandavas cannot be vanquished even by the gods with Vasava.'
  language: English
  quote_policy: summarized
