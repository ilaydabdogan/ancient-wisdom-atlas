canonical_text:
  quote: ''
  summary: Sanjaya narrates a battle episode in which Duryodhana endures and returns
    Ghatotkacha's attack. Ghatotkacha raises a blazing dart against Duryodhana, but
    Bhagadatta, ruler of the Vangas, interposes on a great elephant; Ghatotkacha kills
    the elephant. Duryodhana remains firm, shoots at Ghatotkacha, and Ghatotkacha
    evades the arrow and roars. Bhishma calls for warriors to protect Duryodhana.
    A large Kuru-allied force arrives, and a fierce battle follows between that division
    and the Rakshasas. Ghatotkacha disables weapons, standards, chariots, steeds,
    and warriors among the opposing force.
  language: English
  quote_policy: summarized
