canonical_text:
  quote: ''
  summary: At sunset during battle, the field becomes dreadful, with a blood-like
    river, jackals, spirits, Rakshasas, Pisachas, and cannibals. Major warriors and
    armies on both sides withdraw to their tents when darkness comes. In camp they
    arrange protection, remove arrows, bathe, receive propitiatory rites and praise,
    enjoy music, avoid speaking of battle, and sleep.
  language: English
  quote_policy: summarized
