  quote: libations may not have to be poured into the arrowy fire of the great sacrifice
    of battle
  summary: 'Dhritarashtra asks Sanjaya to report what Arjuna said after Vasudeva''s
    speech. Sanjaya recounts Arjuna''s message: the kings fighting for the Kauravas
    are on the eve of death, and unless Yudhishthira''s share of the kingdom is restored,
    Arjuna will send them and their forces to the regions of departed spirits. Arjuna
    frames the coming battle as a sacrifice with fire, libations, mantras, and a ladle.'
  language: English
  quote_policy: quoted
