canonical_text:
  quote: ''
  summary: Kunti recounts an exchange between a mother and her son, addressed as Sanjaya.
    The son objects that his mother urges him toward battle despite maternal affection.
    The mother argues that wise action seeks virtue and profit, that a Kshatriya must
    pursue battle and victory, and that victory or death brings Indra's region. She
    condemns passive affection and dishonor, urges reliance on both divine aid and
    human exertion, and says she will honor him after success against the Saindhavas.
    The son, lacking wealth and allies, asks her to state the means by which success
    can be attained and promises to obey.
  language: English
  quote_policy: summarized
