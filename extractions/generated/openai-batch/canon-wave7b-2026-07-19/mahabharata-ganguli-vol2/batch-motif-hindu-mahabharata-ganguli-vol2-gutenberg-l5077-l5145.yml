canonical_text:
  quote: ''
  summary: After Arjuna defeats the Kurus and recovers Virata's cattle, frightened
    Kuru soldiers surrender and receive Arjuna's protection. Arjuna asks Uttara to
    keep the Pandavas' presence hidden and to claim the victory publicly. The pair
    return to the Sami tree near the cemetery, restore banners, weapons, ornaments,
    and disguises, and send messengers ahead to announce the victory and recovered
    cattle.
  language: English
  quote_policy: summarized
