canonical_text:
  quote: ''
  summary: Sanjaya recounts Abhimanyu's final battle. After his bow, car, sword, and
    wheel are lost, Abhimanyu fights on with a mace, attacks Aswatthaman and other
    foes, crushes Duhsasana's son's car, and then duels Duhsasana's son with maces.
    Both fall, but Duhsasana's son rises first and strikes Abhimanyu on the head as
    he is rising. Abhimanyu falls senseless and is described as slain by many while
    fighting singly. Enemy troops rejoice, Pandava heroes weep, sky-beings condemn
    the killing as unrighteous, and the battlefield is depicted as blood-covered and
    strewn with corpses, weapons, cars, horses, and elephants.
  language: English
  quote_policy: summarized
