canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanjaya what occurred when Drona, enraged after the
    fall of Jayadratha and Bhurisravas, entered the hostile ranks and attacked the
    Srinjayas and Panchalas. He asks what Arjuna and Duryodhana thought, who supported
    Drona in battle, how Drona died, and how Sanjaya distinguished the hopeful Pandavas
    from the panic-stricken Kurus on the dark night of fighting.
