canonical_text:
  quote: ''
  summary: In battle, Duryodhana wounds Arjuna, Arjuna's horses, and Vasudeva, and
    cuts Vasudeva's whip. Arjuna's arrows fail against Duryodhana's armour. Krishna
    expresses amazement and questions whether Arjuna's bow and strength have diminished.
    Arjuna explains that Drona placed an impenetrable armour on Duryodhana; the armour
    has cosmic power, cannot be pierced even by thunder, and was transmitted among
    celestial and sage figures before being given to Arjuna with mantras. Arjuna declares
    that he will still defeat Duryodhana.
  language: English
  quote_policy: summarized
