canonical_text:
  quote: ''
  summary: Sanjaya describes a terrible night battle. Yudhishthira orders the Pandavas,
    Panchalas, and Somakas to advance against Drona and slay him. Opposing warriors
    interpose themselves against named attackers, while elephant riders, horsemen,
    and other combatants fight in mass slaughter. Kritavarman resists Yudhishthira,
    defeats him by cutting down his weapons, chariot, and armor, and Yudhishthira
    retreats. Kritavarman then resumes protecting the wheel of Drona's chariot.
  language: English
  quote_policy: summarized
