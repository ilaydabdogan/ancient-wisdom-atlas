canonical_text:
  quote: ''
  summary: Sanjaya describes a fierce battle in which darkness and dust cover the
    world, preventing combatants from seeing one another. Warriors fight by conjecture
    and by uttered names, named heroes afflict each other and the troops, both armies
    panic and flee, and many are slaughtered. Sanjaya attributes the disaster to the
    evil counsels of Dhritarashtra's son. Dhritarashtra asks what state of mind they
    were in and how the troops became visible again.
  language: English
  quote_policy: summarized
