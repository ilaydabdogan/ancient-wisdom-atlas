canonical_text:
  quote: ''
  summary: Govinda consoles the grieving Yudhishthira by naming allies and commanders.
    Yudhishthira addresses Dhrishtadyumna as commander of the Pandava army, comparing
    his role to Kartikeya's command of the celestial host. Dhrishtadyumna declares
    that Sambhu ordained him as Drona's slayer. Yudhishthira orders him to form the
    Krauncharuma battle array, said to have been taught by Vrihaspati to Indra during
    a war of gods and Asuras. At dawn Dhrishtadyumna places Dhananjaya in the vanguard
    with a celestial standard, arranges kings and troops as parts of the formation,
    and the armored Pandavas wait for battle beneath shining umbrellas.
  language: English
  quote_policy: summarized
