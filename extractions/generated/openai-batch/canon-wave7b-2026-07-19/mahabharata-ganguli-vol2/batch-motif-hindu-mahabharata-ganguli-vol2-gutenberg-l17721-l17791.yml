canonical_text:
  quote: ''
  summary: Kunti instructs Krishna to carry messages to Arjuna, Bhima, Draupadi, and
    the sons of Madri. She recalls a celestial voice at Arjuna's birth that foretold
    his victories, recovery of the kingdom, and sacrifices. She urges the warriors
    to remember Draupadi's public humiliation and asks Krishna to protect her sons.
    Krishna salutes Kunti, departs with Karna and Satyaki, and the Kurus speak of
    impending destruction caused by Duryodhana's folly. Krishna then proceeds toward
    Upaplavya.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kunti tells Krishna to speak to Arjuna and recalls that, when Arjuna was born,
    a celestial voice was heard in the sky while she was in a hermitage surrounded
    by ladies.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The celestial voice predicts that Kunti's son will rival the deity of a thousand
    eyes, vanquish the assembled Kurus, conquer the Earth with Bhima, gain fame reaching
    heaven, slay the Kurus with Vasudeva as ally, recover his lost paternal share
    in the kingdom, and perform three great sacrifices with his brothers.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kunti says the celestial voice's words should become true if righteousness
    exists, and she connects their fulfillment with Krishna's own action.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kunti instructs Krishna to tell Bhima that the time has come for the purpose
    for which a Kshatriya woman bears a son, and she describes Bhima as always ready
    for exertion and never pacified until foes are exterminated.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kunti instructs Krishna to praise Draupadi's behavior toward Kunti's sons
    as worthy of her noble birth and fame.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kunti instructs Krishna to tell the sons of Madri to value enjoyments won
    by prowess and reminds them that Draupadi was addressed with cruel and abusive
    words before their eyes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Kunti says the loss of kingdom and defeat at dice grieved her less than Draupadi
    weeping in the assembly and hearing insulting words without a protector.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kunti tells Krishna to instruct Arjuna to follow the path pointed out by Draupadi,
    to remind Bhima and Arjuna of Draupadi being dragged into the assembly, and to
    recall Dussasana's harsh words to Bhima.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kunti asks Krishna to inquire after the welfare of the Pandavas, their children,
    and Draupadi, to say that she is well, and to protect her sons.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Krishna salutes Kunti, walks around her, leaves her abode, dismisses the Kuru
    chiefs with Bhishma at their head, takes Karna on his chariot, and leaves the
    city accompanied by Satyaki.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: After Krishna leaves, the Kurus discuss a wonderful incident connected with
    him and say that the earth is entangled in death and doomed to destruction through
    Duryodhana's folly.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Outside the city, Krishna deliberates with Karna, dismisses him, and is driven
    by Daruka with swift steeds to Upaplavya.
  category: sequence
  evidence_refs:
  - ev:8
