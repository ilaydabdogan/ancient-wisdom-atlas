canonical_text:
  quote: ''
  summary: Krishna urges Arjuna to attack Bhishma and fulfill his earlier martial
    pledge. Arjuna orders Krishna to drive toward Bhishma. Bhishma overwhelms Arjuna's
    chariot with arrows; Arjuna cuts Bhishma's bows, and Bhishma praises him. Bhishma
    wounds both Krishna and Arjuna and devastates Yudhishthira's army. Krishna, seeing
    Arjuna's restraint toward the revered grandsire, resolves to stop Bhishma himself.
    Bhishma's arrow-storm darkens the directions, and allied Kaurava forces surround
    Arjuna and Krishna. The chief of Sini comes to Arjuna's aid, compared to Vishnu
    aiding the slayer of Vritra, and begins to rally the fleeing Kshatriyas.
  language: English
  quote_policy: summarized
