canonical_text:
  quote: ''
  summary: Sanjaya reports that after Arjuna has slain Jayadratha, Krishna goes to
    Yudhishthira and announces the success. Yudhishthira rejoices, embraces Krishna
    and Arjuna, and praises Krishna as supreme deity, creator, refuge, and source
    of cosmic order and victory. Krishna and Arjuna answer by attributing Jayadratha's
    fall and the destruction of the Kauravas to Yudhishthira's wrath. Bhima and Satyaki
    then return wounded, salute Yudhishthira, and are congratulated for surviving
    and prevailing against powerful foes.
  language: English
  quote_policy: summarized
