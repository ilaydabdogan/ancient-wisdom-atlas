canonical_text:
  quote: ''
  summary: Bhagadatta, ruler of the Pragjyotishas, attacks Bhima while mounted on
    the elephant Supratika. Supratika crushes Bhima's chariot, but Bhima enters beneath
    the elephant, strikes it, escapes its trunk, and is mistakenly believed slain.
    Yudhishthira and allied warriors surround Bhagadatta, who continues to break their
    attacks with his elephant. Supratika kills the elephant of the ruler of the Dasarnas,
    and Bhagadatta kills that ruler. Bhagadatta later scatters chariots, hurls away
    Yuyudhana's car, drives off Bhima's horses with water from the elephant's trunk,
    kills Ruchiparvan, and disables Yuyutsu's car while Pandava allies continue to
    shoot at him and the elephant.
  language: English
  quote_policy: summarized
