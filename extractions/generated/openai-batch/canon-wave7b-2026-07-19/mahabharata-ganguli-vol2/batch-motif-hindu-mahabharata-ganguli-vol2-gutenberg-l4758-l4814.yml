  quote: ''
  summary: Vaisampayana narrates Arjuna’s rout of the Kuru host. Arjuna’s arrows overwhelm
    warriors, animals, and armor; opposing soldiers flee; the battlefield is covered
    with corpses and severed limbs. The passage culminates in an extended image of
    a dreadful river of blood, compared to a death-river created by Time at the end
    of a Yuga, made from bodies, weapons, animals, ornaments, and battlefield sounds.
  language: English
  quote_policy: summarized
