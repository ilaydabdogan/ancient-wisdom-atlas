canonical_text:
  quote: Proceed, Proceed
  summary: Sanjaya reports that after hearing Yudhishthira, Abhimanyu, the son of
    Subhadra, urges his charioteer toward Drona's array. The charioteer cautions him
    that the Pandavas have placed a heavy burden on him, advises him to judge his
    own capacity before engaging, and contrasts Drona's martial mastery with Abhimanyu's
    luxurious upbringing and lack of battle experience.
