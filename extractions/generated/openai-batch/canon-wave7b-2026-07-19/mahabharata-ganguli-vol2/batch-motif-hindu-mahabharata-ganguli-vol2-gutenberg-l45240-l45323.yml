canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanjaya what the Pandavas did after Abhimanyu's slaughter
    and imagines Arjuna advancing in grief and fury. He laments that the Kuru camps
    and houses, formerly filled with songs, music, debate, ritual recitation, and
    martial sounds, are now marked by grief and silence. He recalls advising Duryodhana
    to accept Krishna's peace mission, condemns the rejection of that counsel and
    the dice game, praises the Pandavas' righteousness and claim to half the earth,
    and attributes Duryodhana's refusal to the influence of Time.
  language: English
  quote_policy: summarized
