canonical_text:
  quote: ''
  summary: Sanjaya narrates a battle sequence in which Satyaki slays many opponents
    and then confronts Bhurisravas. Bhurisravas kills the sons of Yuyudhana, after
    which Satyaki attacks him; the two warriors lose their cars and prepare to fight
    on foot before being taken up by allies. Elsewhere Dhananjaya kills a large body
    of warriors, and at sunset Devavrata withdraws the troops for the night.
  language: English
  quote_policy: summarized
