canonical_text:
  quote: wealth supports the world and sustains life
  summary: Narada recounts Garuda advising the distressed Galava about the origin,
    guardianship, and difficulty of obtaining wealth. Garuda proposes that they ask
    the wealthy royal sage Yayati for aid so Galava can fulfill Viswamitra’s demanded
    preceptor’s fee of eight hundred special horses. Garuda and Galava visit Yayati
    at Pratisthana, receive hospitality, and Garuda explains Galava’s need while praising
    the merit of gifting horses.
  language: English
  quote_policy: quoted
