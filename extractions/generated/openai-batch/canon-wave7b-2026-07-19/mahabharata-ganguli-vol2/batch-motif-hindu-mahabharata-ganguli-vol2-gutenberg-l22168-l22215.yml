canonical_text:
  quote: ''
  summary: Bhishma narrates that Drupada, confronted by a messenger and unable to
    answer, sends emissaries denying the charge. Hiranyavarman confirms that Sikhandin
    is a daughter, alerts allies, musters an army, and threatens Drupada. His council
    resolves to depose and kill Drupada with Sikhandin if the report is true. Drupada,
    afraid, consults his wife and asks how to deal with the danger and the deception
    surrounding Sikhandin.
  language: English
  quote_policy: summarized
