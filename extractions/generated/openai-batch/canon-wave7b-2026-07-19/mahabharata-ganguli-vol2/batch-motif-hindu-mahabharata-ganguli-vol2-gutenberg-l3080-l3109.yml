  summary: The Kauravas see the disguised son of Pandu but cannot identify him with
    certainty. Arjuna pursues the fleeing prince Uttara, seizes him by the hair, and
    brings him back toward the chariot. Uttara, terrified, offers wealth and animals
    to be released. Arjuna tells him that if he will not fight, he should hold the
    reins while Arjuna battles the Kurus, penetrates their array, and recovers the
    cattle. Arjuna comforts the fainting prince and raises him onto the car.
