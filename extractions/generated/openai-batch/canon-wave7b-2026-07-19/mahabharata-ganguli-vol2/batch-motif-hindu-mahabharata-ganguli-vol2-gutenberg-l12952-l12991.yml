canonical_text:
  quote: ''
  summary: Vaisampayana narrates Krishna's reply to Yudhishthira. Krishna says he
    will go to the Kuru court to seek peace and save the contending groups from death.
    Yudhishthira fears Duryodhana will not listen and worries that Krishna may be
    harmed, but Krishna says the mission will at least avoid blame and that he can
    overpower the assembled kings. Yudhishthira then consents and asks Krishna to
    speak for the Pandavas' benefit and make peace if possible.
  language: English
