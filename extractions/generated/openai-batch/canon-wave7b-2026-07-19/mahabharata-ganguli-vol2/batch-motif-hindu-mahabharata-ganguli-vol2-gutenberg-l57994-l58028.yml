canonical_text:
  quote: ''
  summary: Dhrishtadyumna performs practiced battle evolutions with sword and shield,
    astonishing warriors and celestials. Drona counters at close range, cuts off Dhrishtadyumna's
    sword and shield, and prepares a powerful shaft to kill his disciple. Satyaki
    cuts that shaft with arrows and rescues Dhrishtadyumna. Krishna and Dhananjaya
    applaud Satyaki, and Dhananjaya praises Satyaki's skill while troops, Siddhas,
    and warriors of both armies marvel at him.
  language: English
  quote_policy: summarized
