  summary: Bhishma explains a calendrical reckoning by which the Pandavas have fulfilled
    their promised term. He argues that they are truthful and guided by virtue, warns
    that Arjuna is at hand, and advises practical military arrangements. Duryodhana
    refuses to return the Pandavas' kingdom and orders preparation for battle. Bhishma
    then divides the army and assigns commanders to positions in the battle formation.
  language: English
