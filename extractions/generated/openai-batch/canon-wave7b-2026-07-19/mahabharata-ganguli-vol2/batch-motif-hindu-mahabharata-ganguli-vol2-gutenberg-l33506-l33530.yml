canonical_text:
  quote: ''
  summary: In battle, Aswatthaman, the son of Drona, regains consciousness, strikes
    Satyaki, cuts off his standard, and exchanges showers of arrows with him. Satyaki
    counterattacks and afflicts Aswatthaman. Drona rushes in to rescue his son and
    pierces Satyaki, who then turns his arrows against Drona. Partha, Kunti's son,
    rushes against Drona, and Drona and Partha encounter one another in fierce combat.
  language: English
