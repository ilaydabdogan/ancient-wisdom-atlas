canonical_text:
  quote: '"a person of blazing hue, as if endued with the effulgence of fire"'
  summary: After Drona's slaughter and the rout of the Kuru army, Dhritarashtra asks
    what followed. Sanjaya reports that Dhananjaya saw a blazing, lance-bearing figure
    advance before his car in battle; foes broke before that figure, though others
    credited Dhananjaya. Dhananjaya asks Vyasa to identify the figure, who did not
    touch the earth or throw the lance, yet from that one lance thousands of lances
    issued.
  language: English
  quote_policy: quoted
