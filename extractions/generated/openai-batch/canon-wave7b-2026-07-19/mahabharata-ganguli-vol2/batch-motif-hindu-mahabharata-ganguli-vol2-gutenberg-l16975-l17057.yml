canonical_text:
  quote: There is no good in battle, no virtue, no profit.
  summary: Gandhari addresses Duryodhana as her son and urges him to heed his well-wishers,
    restrain lust, wrath, avarice, pride, and the senses, make peace with the sons
    of Pandu, seek Kesava's protection, give the Pandavas their due share, and avoid
    a war that would exterminate people and destroy the Kurus and the earth.
  language: English
  quote_policy: quoted
