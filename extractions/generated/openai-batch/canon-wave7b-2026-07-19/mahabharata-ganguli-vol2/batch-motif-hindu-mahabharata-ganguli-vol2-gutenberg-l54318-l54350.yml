canonical_text:
  quote: '"Thou hast been born, O mighty-armed one, for the destruction of the Panchalas."'
  summary: Duryodhana addresses Aswatthaman during battle, reproaching him and Drona
    for perceived favor toward the Pandavas, lamenting the suffering of his own allies,
    and urging Aswatthaman to destroy the Panchalas and Somakas. He praises Aswatthaman's
    weapons and celestial energy, invokes a prediction that Aswatthaman was born to
    destroy the Panchalas, and describes the Kaurava army as breaking under Arjuna's
    shafts.
  language: English
