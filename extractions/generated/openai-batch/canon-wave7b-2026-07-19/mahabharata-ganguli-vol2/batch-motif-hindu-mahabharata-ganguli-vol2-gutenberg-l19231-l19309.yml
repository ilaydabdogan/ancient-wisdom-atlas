canonical_text:
  quote: ''
  summary: Duryodhana asks Bhishma to become commander of his army, supporting the
    request with an exemplum about victory through unified command and with divine
    and cosmic comparisons. Bhishma agrees under stated limits involving the Pandavas
    and Karna. Karna declares he will not fight while Bhishma lives. Bhishma is installed
    as commander amid celebration, ominous portents, priestly benedictions, a march
    to Kurukshetra, and the pitching of camp.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dhritarashtra's son, accompanied by kings, addresses Bhishma with joined hands
    and says an army without a commander is easily routed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker recounts an exemplum in which Brahmanas, followed by Vaisyas and
    Sudras, first fail against Haihaya Kshatriyas because they act separately, then
    appoint one commander and succeed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Duryodhana compares Bhishma to eminent divine, cosmic, and natural exemplars,
    and asks him to march at the army's head.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bhishma says the Pandavas are as dear to him as Duryodhana's side, yet he
    will fight for Duryodhana because of a prior pledge.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bhishma states that only Dhananjaya is equal to him, that he can destroy the
    universe with his weapons, but that he cannot exterminate the sons of Pandu.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bhishma says he will slay ten thousand warriors each day unless he is slain
    first, and sets a condition that either Karna should fight first or Bhishma will
    fight first.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Karna declares that he will not fight as long as Ganga's son lives, and will
    fight the wielder of Gandiva after Bhishma is slain.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Duryodhana installs Bhishma as commander, distributes presents, and musicians
    play drums and blow conchs while roars and animal cries arise in the camp.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Bhishma's installation, a bloody shower, whirlwinds, earthquakes, elephant-roars,
    incorporeal voices, meteoric flashes, and howling jackals appear as fierce portents.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: After giving kine and gold to Brahmanas for benedictions, Duryodhana marches
    to Kurukshetra with Bhishma in the van and later measures and pitches camp on
    a level fertile spot.
  category: sequence
  evidence_refs:
  - ev:7
