canonical_text:
  quote: ''
  summary: Sanjaya narrates that Arjuna urges Krishna to drive quickly toward Jayadratha
    before sunset so that Arjuna may fulfill his vow. Duryodhana urges Karna and other
    Kuru warriors to protect Jayadratha until the sun sets, predicting that Arjuna
    will enter fire if the vow fails. Karna, though wounded by Bhima, promises to
    fight. Arjuna then slaughters many in the Kuru host and reaches Jayadratha, protected
    by Bhimasena and Satwata.
  language: English
  quote_policy: summarized
