canonical_text:
  quote: ''
  summary: Sanjaya recounts the tenth day of battle, when Bhishma has inflicted heavy
    losses but then tells Yudhishthira that he no longer desires to preserve his body
    and asks to be slain with Arjuna and the Panchalas at the front. Yudhishthira
    urges the Pandava forces forward, placing Sikhandin and Arjuna in the van against
    Bhishma. The armies engage with named warrior pairings, banners, weapons, dust,
    sound, and extreme carnage.
  language: English
  quote_policy: summarized
