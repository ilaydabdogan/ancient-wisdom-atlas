canonical_text:
  quote: ''
  summary: In a battlefield-message exchange, Arjuna, Yudhishthira, and Krishna reply
    to Duryodhana through the envoy Uluka. Arjuna says envoys should not be blamed
    and that his answer will come through Gandiva in battle. Yudhishthira angrily
    tells Duryodhana to act as a Kshatriya and challenge the Pandavas by his own strength
    rather than relying on others. Krishna says Duryodhana wrongly assumes he is harmless
    as Arjuna's charioteer; if angered he could consume the assembled kings like fire,
    though he will serve as charioteer at Yudhishthira's command.
  language: English
  quote_policy: summarized
