canonical_text:
  quote: ''
  summary: Yudhishthira tells Arjuna that after Arjuna went toward the Samsaptaka
    army, Drona tried to seize Yudhishthira. The Pandavas urged Abhimanyu to pierce
    Drona's array; Abhimanyu entered it, while Jayadratha blocked the others through
    a boon from Rudra. Six warriors surrounded and disabled Abhimanyu's chariot, and
    Dussasana's son killed him after Abhimanyu had slain many fighters. Arjuna hears
    the report, collapses in grief, and then becomes furious.
  language: English
  quote_policy: summarized
