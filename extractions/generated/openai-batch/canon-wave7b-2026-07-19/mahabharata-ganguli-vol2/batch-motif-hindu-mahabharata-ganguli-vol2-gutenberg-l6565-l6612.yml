canonical_text:
  quote: ''
  summary: Salya narrates that, at Indra's request, a carpenter cuts off the heads
    of a three-headed son of Twashtri, and birds issue from the severed mouths. Indra
    is relieved, but Twashtri angrily vows to create Vritra for Indra's destruction.
    After ritual actions involving water, fire offerings, and austere rites, Twashtri
    creates Vritra, who grows greatly and is told to kill Indra. Vritra fights Indra,
    swallows him, and Indra escapes when Vritra yawns after the gods create Jrimbhika.
    The passage explains the yawn as attached to the breath of living beings. The
    renewed fight goes badly for Indra, and the gods, distressed, consult saints and
    sit on Mandara mountain thinking of Vishnu.
  language: English
  quote_policy: summarized
