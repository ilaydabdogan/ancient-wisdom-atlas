  summary: Sanjaya narrates a battle sequence in which Sahadeva kills Duhsasana's
    charioteer, Duhsasana controls his driverless chariot, Sahadeva wounds the horses,
    Karna intervenes to rescue Duhsasana, and Bhima engages Karna. Bhima and Karna
    exchange arrows and maces, damaging each other's equipment and chariots. Karna
    kills Bhima's horses and drivers, after which Bhima jumps into Nakula's chariot.
