canonical_text:
  quote: ''
  summary: Dhritarashtra laments that his sons are repeatedly slain despite the presence
    of powerful Kaurava warriors and attributes their defeat to fate and ignored warnings.
    Sanjaya replies that Vidura’s counsel to restrain the sons from dice was rejected
    and says the Kauravas are now suffering the consequences. He then narrates a midday
    battle in which Pandava forces attack Bhishma and other Kauravas, Drona slaughters
    Somakas and Srinjayas, Bhima is likened to a second Yama and attacks the elephant
    division, Nakula and Sahadeva attack cavalry, and the field is covered with slain
    men, animals, broken chariots, banners, weapons, ornaments, and bodies.
  language: English
  quote_policy: summarized
