candidate_motifs:
- id: motif:1
  label: Ignored wise counsel before catastrophe
  taxonomy_refs:
  - wisdom
  basis: Vidura’s instruction to restrain the sons from dice and the counsels of Vidura,
    Drona, Bhishma, Gandhari, and other well-wishers are said to have been rejected
    before the present destruction.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage frames the motif through Sanjaya’s retrospective explanation,
    not as a separate didactic tale.
- id: motif:2
  label: Fate named as explanation for familial military ruin
  taxonomy_refs: []
  basis: Dhritarashtra repeatedly interprets the deaths and defeats of his sons as
    evil destiny or the result of fate.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is the speaker’s stated interpretation; Sanjaya also emphasizes rejected
    counsel as a cause.
