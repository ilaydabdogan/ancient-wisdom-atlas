canonical_text:
  quote: ''
  summary: At twilight the battle is halted and both sides withdraw. The Pandavas,
    distressed by Bhishma's destructive power, consult at night. Yudhishthira laments
    to Krishna, considers retreating to the woods, and asks for counsel. Krishna consoles
    him, offers to fight Bhishma if Arjuna will not, affirms his mutual bond with
    Arjuna and the Pandavas, and recalls Arjuna's vow to slay Bhishma.
  language: English
  quote_policy: summarized
