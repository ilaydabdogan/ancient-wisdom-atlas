canonical_text:
  quote: ''
  summary: Sanjaya narrates that Arjuna and Krishna worship Siva and request a celestial
    weapon. Siva directs them to a sacred celestial lake containing his bow and arrow.
    At the lake they encounter fiery serpents, perform ritual praise to Rudra, and
    the serpents become a bow and arrow. A Brahmacharin emerges from Siva, demonstrates
    the weapon and its mantras, and Arjuna learns them. Bhava grants Arjuna the Pasupata
    weapon and fulfillment of his vow; Arjuna and Krishna worship him and return joyfully
    to camp.
  language: English
  quote_policy: summarized
