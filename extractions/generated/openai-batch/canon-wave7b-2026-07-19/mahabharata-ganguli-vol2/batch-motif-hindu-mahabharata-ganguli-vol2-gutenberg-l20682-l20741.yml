  quote: ''
  summary: Bhishma addresses a king and evaluates numerous warriors allied with Yudhishthira
    and the Pandavas, assigning them martial ranks such as Ratha, Maharatha, Atiratha,
    and half-Ratha. He notes supporting troops, kinship, training, allegiance, comparative
    prowess, banners, and battle similes involving a divine dissolution image, the
    ocean, gods, and furious elephants.
  language: English
  quote_policy: summarized
