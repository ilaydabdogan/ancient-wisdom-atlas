canonical_text:
  quote: Behold the change brought on by time.
  summary: A first-person speaker laments the changed fortunes of Sahadeva and Nakula/Granthika
    in Virata's court. Sahadeva tends cattle and sleeps on calf-skins, while Nakula,
    formerly feared in battle, trains and displays horses before King Virata. The
    speaker says these miseries, connected with Yudhishthira and endured while the
    addressed group is alive, have made life unbearable.
