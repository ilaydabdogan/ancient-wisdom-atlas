canonical_text:
  quote: ''
  summary: A speaker laments that a famous invincible pair could destroy an army but
    refrain because of their humanity. He reflects on the deaths of Bhishma and Drona,
    the inevitability of death, the destruction of the Kurus as the consequence of
    his own acts, Yudhishthira’s coming prosperity, Righteousness siding with Yudhishthira,
    and the irresistible force of Time and Destiny, then asks Sanjaya to report the
    calamity fully.
  language: English
  quote_policy: summarized
