canonical_text:
  quote: to look like the great Vaitarani
  summary: Arjuna's Gandiva sounds over the battlefield. Kuru warriors attack him
    with weapons, which he cuts down. He invokes the Mahendra or Indra weapon with
    mantras, sends blazing showers of arrows through the Kaurava host, and creates
    a battlefield scene described as a terrible river of blood and corpses, compared
    to the Vaitarani. Pandava-side allies shout in victory, while the Kurus withdraw
    at sunset after seeing the Indra weapon spread like the end of a Yuga.
  language: English
  quote_policy: quoted
