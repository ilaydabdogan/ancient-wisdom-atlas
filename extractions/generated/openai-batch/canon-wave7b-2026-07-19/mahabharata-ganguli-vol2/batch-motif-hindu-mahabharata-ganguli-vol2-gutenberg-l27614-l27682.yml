canonical_text:
  quote: '"Even this is the hour fixed by the Creator of the Universe"'
  summary: In battle, Sweta destroys Bhishma's chariot with a mace. Bhishma receives
    a celestial message that the appointed hour has come for victory over Sweta. Bhishma
    then checks the warriors trying to rescue Sweta, shoots Sweta with an irresistible
    Brahma-weapon-like arrow, and Sweta dies. The Pandava side laments and withdraws,
    while the Kuru side rejoices.
  language: English
