canonical_text:
  quote: ''
  summary: The divine speaker instructs Arjuna on devotion, renunciation, self-mastery,
    contemplative practice, temperance, equanimity, and final absorption with the
    divine or Brahma. Arjuna replies that the mind is restless and difficult to restrain,
    comparing its restraint to restraining the wind.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says that one who performs required actions without regard for
    their fruits is a renouncer and devotee, and not merely one who discards the sacrificial
    fire or abstains from action.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker identifies renunciation with devotion and states that one cannot
    be a devotee without renouncing resolves.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Action is described as the means for a sage rising to devotion, while cessation
    of action is described as the means after one has risen to devotion.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that one should raise the self by the self, and that one’s
    own self can be either friend or enemy depending on whether it is subjugated.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A self-subjugated ascetic is described as steady amid cold and heat, pleasure
    and pain, and honour and dishonour, and as regarding a sod, a stone, and gold
    alike.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The distinguished devotee is said to view well-wishers, friends, foes, strangers,
    indifferent persons, partisans of both sides, disliked persons, relatives, good
    persons, and wicked persons equally.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The devotee is instructed to remain alone in a secluded place, restrain mind
    and body, erect a steady seat on a clean spot, and sit on cloth, deer-skin, or
    Kusa grass.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The contemplative posture includes keeping body, head, and neck even and steady,
    gazing at the tip of the nose, not looking in different directions, being fearless,
    observing Brahmacharin practices, and fixing the heart on the speaker.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Constant application of the soul in this manner is said to bring tranquillity
    culminating in final absorption and assimilation with the speaker.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The speaker says devotion is not for one who eats too much or not at all,
    nor for one who sleeps too much or is always awake; it belongs to one temperate
    in food, amusements, works, sleep, and vigils.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: A restrained heart fixed on the self and indifferent to objects of desire
    is compared to a lamp in a windless spot that does not flicker.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Devotion is described as a condition in which the mind rests through abstraction,
    one is gratified within the self, and one experiences highest felicity beyond
    the senses.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The speaker says devotion involves severance from pain and should be practiced
    with perseverance, renunciation of desires born of resolves, restraint of the
    senses, patience, and repeated direction of the mind to the self.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:14
  text: The devotee with tranquil mind, suppressed passions, freedom from sin, and
    oneness with Brahma is said to obtain highest happiness.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The devotee who casts an equal eye everywhere is said to behold the self in
    all creatures and all creatures in the self, and to behold the speaker in everything
    and everything in the speaker.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Arjuna says that the devotion of equanimity declared by the speaker does not
    seem stable to him because the mind is restless, boisterous, perverse, and obstinate.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: Arjuna compares restraining the mind to restraining the wind.
  category: speech
  evidence_refs:
  - ev:8
