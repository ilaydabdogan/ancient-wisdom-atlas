canonical_text:
  quote: Do not quarrel, give them half the kingdom.
  summary: Vasudeva reports Bhishma's speech to Duryodhana in the Kuru assembly. Bhishma
    recounts his difficult vow for the sake of Santanu, Kali, and the Kuru line; his
    installation of Vichitravirya; the kingdom's crisis after Vichitravirya's death;
    his refusal to break his vow despite petitions; Vyasa's begetting of heirs; and
    the resulting succession argument that Pandu's sons should receive half the kingdom
    for the sake of peace.
  language: English
  quote_policy: quoted
