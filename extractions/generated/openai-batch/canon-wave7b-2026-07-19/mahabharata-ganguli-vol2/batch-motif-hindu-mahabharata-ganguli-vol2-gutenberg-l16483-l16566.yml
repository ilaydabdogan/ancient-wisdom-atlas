  summary: Dhritarashtra tells Krishna that Duryodhana disobeys him and asks Krishna
    to counsel his son. Krishna addresses Duryodhana, urging righteous conduct, peace
    with the Pandavas, obedience to parents and elders, avoidance of wrath and bad
    advisers, and acceptance of beneficial counsel. He warns that disregarding good
    counsel leads to ruin and recalls the Pandavas' generosity despite Duryodhana's
    past persecution of them.
