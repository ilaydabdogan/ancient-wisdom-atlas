canonical_text:
  quote: ''
  summary: After Kichaka is found dead, his Suta relatives blame Krishna/Sairindhri
    and obtain Virata's permission to burn her with Kichaka. They seize and bind her,
    place her on a bier, and carry her toward the cemetery. She cries out for her
    Gandharva husbands. Bhima hears, secretly leaves the palace, uproots a large tree,
    rushes to the cemetery, frightens the Sutas into releasing her, and kills one
    hundred and five of them with the tree. He frees and comforts Draupadi, and the
    onlookers are left astonished.
  language: English
  quote_policy: summarized
