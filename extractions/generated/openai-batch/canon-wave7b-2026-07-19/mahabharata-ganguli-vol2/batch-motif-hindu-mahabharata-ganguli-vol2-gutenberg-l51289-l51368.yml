canonical_text:
  quote: ''
  summary: In a battlefield encounter, Bhima and Karna attack one another but each
    refrains from killing the other because of remembered obligations. Karna taunts
    Bhima, Bhima challenges Karna to a bare-armed contest, and Karna abstains. Arjuna,
    urged by Krishna, wounds Karna and drives him away. Ashvatthaman intercepts a
    shaft aimed at Karna and is then pursued by Arjuna into the Kaurava force.
  language: English
  quote_policy: summarized
