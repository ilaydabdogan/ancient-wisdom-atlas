canonical_text:
  quote: ''
  summary: Vaisampayana narrates Yudhishthira's selection and preparation of an army
    encampment on Kurukshetra. The camp is sited on suitable and sacred ground while
    avoiding consecrated places. Kesava, Partha, Dhrishtadyumna, and Satyaki assist
    in clearing outposts, surveying the ground, and fortifying the site near the holy
    Hiranwati river. Tents, supplies, weapons, medical personnel, mechanics, and armored
    elephants are assembled, and allied kings with ritual and sacrificial credentials
    come to support the sons of Pandu.
  language: English
  quote_policy: summarized
