canonical_text:
  quote: "“When, however, he was dragged down from his car and made to lay aside his
    weapons, the Narayana weapon, that scorcher of foes, became pacified.”"
  summary: Sanjaya reports that Arjuna and Vasudeva/Krishna intervene when Bhima is
    overwhelmed by Aswatthaman’s Narayana weapon. Arjuna uses the Varuna weapon, the
    two heroes drag Bhima from his car and make him lay aside his weapons, and the
    Narayana weapon becomes pacified. After the battlefield calms and the Pandava
    host arrays again, Duryodhana asks Aswatthaman to use the weapon once more, but
    Aswatthaman says it cannot be used twice and would kill the one who recalled it.
