canonical_text:
  quote: ''
  summary: A mother exhorts her son, addressed as prince, not to anticipate failure
    but to act despite uncertain outcomes. She advises exertion, auspicious rites,
    divine and Brahmanical support, alliance-building among disaffected persons, gifts
    and conciliatory speech, and strategic dealings with enemies; she warns that loss
    of wealth leads to abandonment and that trusting an enemy prevents recovery of
    a kingdom.
