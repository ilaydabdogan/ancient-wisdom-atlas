canonical_text:
  quote: ''
  summary: Abhimanyu confronts Duhsasana in battle, accuses him of earlier wrongs,
    and wounds him severely. Duhsasana is carried away senseless, prompting rejoicing
    among the Pandava forces. Duryodhana urges Karna to respond; Karna and Abhimanyu
    exchange volleys, but Abhimanyu continues advancing toward Drona and disables
    Karna's chariot equipment before Karna's younger brother advances.
  language: English
  quote_policy: summarized
