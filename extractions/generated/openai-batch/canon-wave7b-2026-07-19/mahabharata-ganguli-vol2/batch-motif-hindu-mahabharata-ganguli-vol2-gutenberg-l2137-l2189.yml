canonical_text:
  quote: ''
  summary: After Kichaka and his brothers are slain, public rumor attributes the killing
    to Gandharvas and links it to Kichaka's wrongdoing. Dhritarashtra's son's spies
    return to Duryodhana's court after searching many places for the Pandavas. They
    report finding no trace, learning that charioteers reached Dwaravati without the
    Pandavas or Krishna, and hearing that Kichaka and his brothers were slain by invisible
    Gandharvas at night. The spies ask Duryodhana for further instructions.
  language: English
  quote_policy: summarized
