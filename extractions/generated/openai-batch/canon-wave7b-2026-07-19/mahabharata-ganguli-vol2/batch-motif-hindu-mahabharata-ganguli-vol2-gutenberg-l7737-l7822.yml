  summary: Yudhishthira addresses Sanjaya, says peace is preferable to war, criticizes
    desire as insatiable, and argues that Dhritarashtra's attachment to Duryodhana
    and rejection of Vidura's counsel have made peace unattainable. He names Duryodhana's
    counselors, recalls the dice game as a sign of impending Kuru destruction, and
    asserts that Arjuna, Bhima, Nakula, and Sahadeva make the Pandu sons' sovereignty
    impossible to seize safely.
