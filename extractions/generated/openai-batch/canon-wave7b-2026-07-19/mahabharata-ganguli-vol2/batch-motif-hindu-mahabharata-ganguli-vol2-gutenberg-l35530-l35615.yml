canonical_text:
  quote: ''
  summary: Sanjaya narrates a phase of battle in which the Pandavas place Sikhandin
    before them and repeatedly pierce Bhishma. Bhishma continues fighting while compared
    to destructive end-of-Yuga fire. Arjuna protects Sikhandin, cuts off Bhishma's
    bows, and severs a dart hurled by Bhishma. Bhishma reflects that he will not fight
    the Pandavas because of their protection and Sikhandin's femininity, remembers
    his boons of death by choice, and resolves that the proper hour for his death
    has arrived. Rishis and Vasus approve his resolve from the firmament, and auspicious
    celestial signs occur.
  language: English
