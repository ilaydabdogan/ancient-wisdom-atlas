canonical_text:
  quote: ''
  summary: Kichaka attempts to entice Draupadi with wealth, a bed, and wine, but she
    says she has come only to fetch wine for the princess. He seizes her; she invokes
    the truth of her fidelity and foretells his helpless fall. When he further attacks
    her, she throws him down and flees to the court for protection. Kichaka follows,
    seizes her hair, and kicks her before the king. A Rakshasa appointed by Surya
    to protect Draupadi knocks Kichaka senseless. Yudhishthira and Bhima witness the
    outrage; Bhima is enraged, but Yudhishthira restrains him to preserve their disguise.
    Draupadi rebukes the king of the Matsyas, the court, and the duty-bound warriors
    for allowing the insult.
  language: English
  quote_policy: summarized
