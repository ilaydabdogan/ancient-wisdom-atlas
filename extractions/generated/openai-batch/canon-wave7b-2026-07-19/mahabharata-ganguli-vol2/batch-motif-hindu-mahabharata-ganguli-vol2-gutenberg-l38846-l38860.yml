canonical_text:
  quote: ''
  summary: After addressing the Suta's son, Dhritarashtra, overcome by grief and without
    hope for his son's victory, falls senseless to the ground. Attendants sprinkle
    him with perfumed cold water and fan him, while Bharata royal ladies surround
    him, rub him, lift him to his seat, and weep. He remains motionless in a swoon,
    trembles, slowly regains consciousness, and resumes questioning Gavalgana's son
    about the battle events.
