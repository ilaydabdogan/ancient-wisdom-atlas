canonical_text:
  quote: ''
  summary: In a framed dialogue, Yudhishthira asks how misery befell Indra and his
    queen. Salya narrates that Twashtri, hostile to Indra, created a powerful three-headed
    son whose austerities and desire for Indra's seat frightened Indra. Indra resolved
    to divert the ascetic into sensual enjoyment and sent celestial nymphs to tempt
    him; the nymphs agreed to attempt the task.
  language: English
  quote_policy: summarized
