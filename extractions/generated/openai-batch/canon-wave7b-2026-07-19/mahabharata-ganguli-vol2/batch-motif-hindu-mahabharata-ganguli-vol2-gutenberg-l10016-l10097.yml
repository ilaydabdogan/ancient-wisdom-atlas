canonical_text:
  quote: I say that ignorance is Death, and so the absence of ignorance (Knowledge)
    is immortality.
  summary: Dhritarashtra privately questions Sanat-sujata about whether death exists
    and whether austerities avert it. Sanat-sujata teaches that ignorance is death,
    knowledge is immortality, desire and passions lead beings into death, hell, heaven,
    and rebirth, and self-knowledge with renunciation overcomes death. Dhritarashtra
    then asks about Vedic acts, emancipation, and the Unborn Ancient One.
  language: English
  quote_policy: quoted
