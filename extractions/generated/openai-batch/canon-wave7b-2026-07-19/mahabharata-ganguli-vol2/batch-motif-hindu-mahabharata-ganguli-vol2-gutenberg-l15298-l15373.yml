canonical_text:
  quote: ''
  summary: Narada presents Matali’s proposal that his daughter Gunakesi marry Sumukha,
    Aryaka’s Naga grandson. Aryaka hesitates because Garuda has devoured Sumukha’s
    father and threatened Sumukha. Matali takes Sumukha with Narada and Aryaka to
    Sakra’s heavenly court, where Vishnu is present. Vishnu urges that Sumukha receive
    Amrita and immortality, but Sakra grants him length of days instead. Sumukha marries
    Gunakesi and returns home.
  language: English
  quote_policy: summarized
