canonical_text:
  quote: ''
  summary: At night, after Krishna has dined and rested, Vidura warns him that Duryodhana
    and Dhritarashtra's sons are proud, wicked, and unwilling to accept peace or return
    what is due to the Pandavas. Vidura says Krishna's counsel will be futile before
    them, describes Duryodhana's confidence in his warriors and army, notes the fated
    assembly of kings for war, and speaks out of affection while acknowledging Krishna's
    divine and unconquerable nature.
  language: English
  quote_policy: summarized
