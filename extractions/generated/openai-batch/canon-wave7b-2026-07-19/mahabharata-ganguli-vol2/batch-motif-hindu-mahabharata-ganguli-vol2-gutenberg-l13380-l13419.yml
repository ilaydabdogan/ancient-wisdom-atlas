canonical_text:
  quote: ''
  summary: Nakula addresses Krishna, noting prior counsel from Yudhishthira and Falguni.
    He argues that action should fit the occasion, since the Pandavas' wishes have
    changed from forest exile and concealment to their present return. He points to
    the assembled seven-Akshauhini army and urges Krishna to go among the Kurus, speak
    first mildly and then threateningly, and move Suyodhana to fear. He lists major
    Pandava allies and expects Vidura, Bhishma, Drona, and Vahlika to understand Krishna's
    wisdom and advise Dhritarashtra and Suyodhana to follow it.
  language: English
  quote_policy: summarized
