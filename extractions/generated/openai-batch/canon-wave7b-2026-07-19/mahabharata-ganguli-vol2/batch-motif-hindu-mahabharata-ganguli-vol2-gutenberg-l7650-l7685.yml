canonical_text:
  quote: ''
  summary: Sanjaya answers Yudhishthira about the Kurus, reports on Dhritarashtra
    and his son, condemns internal dissension and harm to the innocent, recalls the
    battlefield prowess of the Pandavas, reflects that futurity is unknowable, and
    says Yudhishthira's intelligence and virtue may bring peace among the assembled
    parties.
  language: English
