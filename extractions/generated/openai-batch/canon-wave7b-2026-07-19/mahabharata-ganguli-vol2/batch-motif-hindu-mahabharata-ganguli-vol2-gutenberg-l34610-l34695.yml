canonical_text:
  quote: ''
  summary: 'Sanjaya narrates a sequence of battlefield encounters in which warriors
    advancing toward Bhishma are resisted by opposing warriors. Satyaki fights Alamvusha
    and Bhagadatta, cuts Bhagadatta''s iron dart, and is then surrounded on Duryodhana''s
    order. Other paired combats follow: Sudakshina against Abhimanyu, Aswatthaman
    against Virata and Drupada, Kripa against Sahadeva, Vikarna against Nakula, Durmukha
    against Ghatotkacha, and Kritavarman against Dhrishtadyumna.'
  language: English
  quote_policy: summarized
