canonical_text:
  quote: "“the six set out, placing Yajnaseni in their front”"
  summary: A speaker gives rules for disciplined conduct in a royal household, including
    humility before the king, loyalty, courage in entrusted tasks, secrecy, refusal
    of bribes, and acceptance of royal gifts. Yudhishthira praises the instruction
    and asks for arrangements for departure, safety through hardship, and victory.
    Dhaumya performs departure rites with fires, mantras, and oblations for the Pandavas’
    success and reconquest; the party circumambulates the fires and Brahmanas and
    sets out with Yajnaseni in front. Dhaumya carries the sacred fires to the Panchalas,
    while Indrasena and others go to the Yadavas to care privately for the Pandavas’
    horses and cars.
  language: English
  quote_policy: quoted
