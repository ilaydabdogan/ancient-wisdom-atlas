canonical_text:
  quote: ''
  summary: After Drona is slain, the Kuru army becomes leaderless, fearful, and disorderly,
    and many commanders flee the battlefield with their divisions. Aswatthaman, Drona's
    son, alone advances against the enemy and then questions Duryodhana about the
    rout. Duryodhana, overcome with grief and shame, asks Kripa to explain to Aswatthaman
    how Drona was killed.
  language: English
  quote_policy: summarized
