canonical_text:
  quote: ''
  summary: Sanjaya narrates a battlefield sequence in which Bhishma, protected by
    five Kaurava warriors, advances through the Pandava host. Abhimanyu attacks Bhishma
    and his protectors, displays exceptional archery, cuts down Bhishma's standard,
    and withstands counterattack. Pandava warriors rush to protect Abhimanyu as Bhishma
    uses celestial weapons. In a later exchange, Uttara charges Salya on an elephant;
    Salya hurls an iron dart that fells Uttara and then cuts off the elephant's trunk.
  language: English
  quote_policy: summarized
