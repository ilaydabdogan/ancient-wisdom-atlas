canonical_text:
  quote: ''
  summary: Drona and Arjuna, preceptor and pupil, fight an extraordinary chariot duel.
    Drona invokes named celestial weapons and later the Brahma weapon; Arjuna counters
    each weapon, including with his own Brahma weapon. Celestial and semi-divine beings
    witness the combat, voices praise both warriors, and sages describe the encounter
    as beyond ordinary categories, comparing it to Rudra divided in two and fighting
    himself. The Brahma weapon disturbs earth, waters, winds, seas, and living beings
    until Arjuna pacifies it. The duel remains undecided and the general battle resumes
    amid showers of arrows.
  language: English
  quote_policy: summarized
