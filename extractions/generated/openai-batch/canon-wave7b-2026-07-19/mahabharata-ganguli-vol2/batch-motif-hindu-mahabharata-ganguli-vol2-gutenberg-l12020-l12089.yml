canonical_text:
  quote: ''
  summary: Dhritarashtra urges Duryodhana to desist from war and return the Pandavas'
    share, warning that leading Kaurava warriors do not approve of battle. Duryodhana
    refuses to surrender even a needle-point of land and describes the coming battle
    as a sacrifice in honor of Yama, with Yudhishthira as victim and martial equipment
    as ritual implements. Dhritarashtra abandons Duryodhana and foretells destruction
    of the Kaurava host by Pandava allies, especially Bhima.
  language: English
  quote_policy: summarized
