canonical_text:
  quote: ''
  summary: Bhishma recounts that Drupada educated his daughter in arts and weapons,
    treated her as a son, and concealed her sex because of the words of a trident-bearing
    deity. Drupada and his queen arrange her marriage, as Sikhandin, to the daughter
    of Hiranyavarman, king of the Dasarnakas. After the wedding the bride discovers
    that Sikhandin is a woman like herself, informs her attendants, and the news reaches
    Hiranyavarman. Enraged, Hiranyavarman sends a messenger accusing Drupada of deception
    and threatening to kill him with his relatives and advisers.
  language: English
  quote_policy: summarized
