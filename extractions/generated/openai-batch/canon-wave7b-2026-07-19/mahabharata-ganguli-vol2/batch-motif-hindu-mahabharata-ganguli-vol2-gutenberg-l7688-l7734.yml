canonical_text:
  quote: ''
  summary: Yudhishthira asks Sanjaya to deliver Dhritarashtra's message. Sanjaya greets
    the assembled leaders and urges peace, saying Dhritarashtra welcomed the chance
    for peace. He praises the sons of Pritha, warns that war would bring universal
    slaughter, sin, hell, and kin-killing, compares the formidable forces on both
    sides, and supplicates Krishna and the aged king of the Panchalas so that Kurus
    and Srinjayas may benefit. He closes by saying Dhritarashtra and Bhishma desire
    confirmed peace.
  language: English
  quote_policy: summarized
