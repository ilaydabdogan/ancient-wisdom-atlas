canonical_text:
  quote: ''
  summary: 'The Holy One teaches Arjuna about Brahman, remembrance at death, yogic
    departure with Prana and Om, release from rebirth, the cyclic day and night of
    Brahman, and two post-mortem paths: a bright path of non-return and a dark path
    of return.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker defines Brahman as supreme and indestructible, Adhyatma as its
    own manifestation, and sacrificial offering as action.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says that a person who remembers him in the last moments while
    casting off the body comes into his essence, and that the form remembered at death
    determines the destination.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker tells Arjuna to think of him at all times and engage in battle,
    and says that fixing mind and understanding on him will bring Arjuna to him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A departing person with steady mind, reverence, abstraction, and Prana directed
    between the eyebrows reaches the Divine and Supreme Male Being.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The described departure practice includes stopping up all the doors, confining
    the mind within the heart, placing Prana between the eyebrows, meditating, uttering
    Om, thinking of the speaker, and attaining the highest goal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Persons who attain the speaker do not incur rebirth, while all worlds from
    Brahman's abode downward undergo a round of births.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Brahman's day and night each last a thousand Yugas; at day the manifest arises
    from the unmanifest, and at night things disappear into the unmanifest.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: An unmanifest, eternal, indestructible entity beyond the unmanifest is identified
    as the highest goal and the speaker's Supreme seat.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The path of fire, light, day, bright fortnight, and the northern solstice
    is said to lead persons knowing Brahma to Brahma.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The path of smoke, night, dark fortnight, and the southern solstice is said
    to lead a devotee to lunar light and return.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The bright and dark paths are called the eternal two paths of the universe;
    one leads to non-return and the other to return.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: A devotee who knows the teaching is said to gain the fruits associated with
