  summary: Sanjaya narrates a battle episode in which Duhsasana attacks Satyaki/Yuyudhana
    with arrows. Satyaki withstands the assault, defeats Trigarta reinforcements sent
    by Duryodhana, disables Duhsasana's chariot and weapons, but spares Duhsasana
    because he remembers Bhimasena's vow to destroy the king's sons. Satyaki then
    continues along the route taken by Dhananjaya/Arjuna.
