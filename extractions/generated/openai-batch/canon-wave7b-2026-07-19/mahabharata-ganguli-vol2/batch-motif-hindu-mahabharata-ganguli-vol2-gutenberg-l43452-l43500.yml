canonical_text:
  quote: ''
  summary: Narada tells Srinjaya that Mandhatri, son of Yuvanaswa, died despite extraordinary
    birth, divine nurture, universal conquest, royal sacrifices, great gifts, and
    fame. Yuvanaswa conceives after drinking sacred sacrificial butter; the twin Aswins
    extract the child; Indra nourishes the child from his fingers. Mandhatri rapidly
    grows, conquers the earth, performs grand sacrifices, gives lavish gifts to Brahmanas,
    and finally goes to the regions of the righteous. Narada uses the example to tell
    Srinjaya not to grieve for Swaitya.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mandhatri is identified as the son of Yuvanaswa, as a king who vanquished
    gods, Asuras, and men, and as one who eventually died.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yuvanaswa, thirsty while hunting deer in the forest, followed a wreath of
    smoke to a sacrifice, drank sacred sacrificial butter, and conceived.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The twin Aswins, described as celestial physicians, extracted the child from
    Yuvanaswa's womb.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The gods wondered what would support the child, and Indra said the child should
    suck his fingers and draw sustenance from him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Milk sweet as nectar and drops of milk and clarified butter issued from Indra's
    hand into the child's mouth; the gods named the child Mandhatri.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The boy grew to twelve cubits in twelve days and conquered the whole earth
    in a single day.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Mandhatri defeated several named kings, and his dominion is described as extending
    between the hill of sunrise and the hill of sunset.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mandhatri performed one hundred Horse-sacrifices and one hundred Rajasuya
    sacrifices, and gave huge golden Rohita fish to Brahmanas.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The sacrifices are described with mountains of food and rivers or lakes of
    clarified butter, soup, curds, honey, and milk.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Gods, Asuras, Men, Yakshas, Gandharvas, Snakes, Birds, Brahmanas, and Rishis
    attended Mandhatri's sacrifices, and none present was illiterate.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Mandhatri bestowed the earth bounded by the seas upon the Brahmanas, disappeared
    like the sun, and went to the regions of the righteous.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Narada tells Srinjaya not to grieve for Swaitya, because Mandhatri was superior
    and still died.
  category: speech
  evidence_refs:
  - ev:1
  - ev:8
