canonical_text:
  quote: ''
  summary: Sanjaya, dismissed by the Pandavas, returns to Hastinapura and announces
    through the gatekeeper that he bears an important message from the sons of Pandu.
    Dhritarashtra welcomes him into the royal apartment. Sanjaya approaches the enthroned
    king with joined hands and relays Yudhishthira's salutations and inquiries after
    Dhritarashtra's welfare. Dhritarashtra blesses Yudhishthira and asks in return
    about his welfare and that of his family and counsellors.
  language: English
