canonical_text:
  quote: ''
  summary: 'Sanjaya narrates that Krishna drives Arjuna toward Durmarshana. A destructive
    one-against-many battle follows: Arjuna showers enemies with arrows, cuts down
    warriors and elephants, causes confusion among the opposing troops, and routs
    them. The narration uses images of rain-clouds, severed bodies, snakes, the sun
    dispersing darkness, and universal dissolution.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kesava urges the steeds to the place where Durmarshana is staying after being
    addressed by Savyasachin, and a destructive encounter between one and many begins.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Partha covers his foes with showers of shafts; hostile car-warriors also cover
    Krishna and Dhananjaya with arrows.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Partha, filled with wrath, strikes heads from warriors' trunks, and the earth
    becomes strewn with heads, horse heads, elephant trunks, and limbs of warriors.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The narration compares scattered heads to plucked and crushed lotuses, golden
    mail dyed with gore to clouds charged with lightning, and falling heads to ripened
    palmyra fruits.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Warriors are described as losing distinct perception, seeing the whole world
    as full of Partha, and perishing by striking one another or themselves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Severed arms bearing weapons and ornaments are described as jumping, jerking,
    and moving, and as looking like large snakes and huge clubs.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Arjuna moves and shoots from his car so quickly that enemies cannot detect
    an opening to strike him, and his speed in taking, fixing, and releasing shafts
    amazes them.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Arjuna pierces elephants, elephant-riders, horses, horse-riders, car-warriors,
    and car-drivers, and no enemy before him, fighting him, or wheeling around escapes
    being slain.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The narration compares Arjuna's destruction of the elephant-force to the rising
    sun destroying thick gloom and also says Dhananjaya in wrath is like the midday
    sun, impossible for enemies to look at.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The opposing troops break and flee in fear; the routed army is compared to
    a mass of clouds pierced and driven away by a mighty wind.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Some fleeing warriors run against Partha himself, and the warriors are described
    as cheerless and confused in understanding.
  category: attribute
  evidence_refs:
  - ev:8
