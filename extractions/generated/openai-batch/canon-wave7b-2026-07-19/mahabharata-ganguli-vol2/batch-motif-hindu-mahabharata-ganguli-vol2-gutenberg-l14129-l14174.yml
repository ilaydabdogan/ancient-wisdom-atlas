canonical_text:
  quote: ''
  summary: A speaker addresses Krishna, asking after Sahadeva and Nakula, lamenting
    separation from them, and expressing special affection and concern for Draupadi.
    The speaker recalls Draupadi leaving her children to follow the sons of Pandu,
    suffering despite five heroic husbands, and being dragged by Dussasana into the
    Kuru assembly while in a vulnerable state. The speaker notes grief among some
    witnesses and praises Vidura as morally exemplary, saying disposition rather than
    learning or wealth makes one worthy of respect.
  language: English
