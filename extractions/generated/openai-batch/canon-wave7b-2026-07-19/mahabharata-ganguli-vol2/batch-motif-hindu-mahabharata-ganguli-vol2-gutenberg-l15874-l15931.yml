canonical_text:
  quote: ''
  summary: Narada narrates that Galava and Garuda visit the Brahmana ascetic Sandili
    on the peak of Rishabha. After receiving hospitality and food, Garuda loses his
    wings because he had contemplated carrying Sandili away against her will to a
    divine abode. Garuda confesses and seeks forgiveness. Sandili restores his wings,
    warns him against contempt for her and for women, and teaches the power of purity
    of conduct. Garuda and Galava depart but fail to find the steeds they seek. Viswamitra
    then reminds Galava of the promised wealth owed to him, and Garuda urges Galava
    to deliberate on fulfilling that obligation.
  language: English
  quote_policy: summarized
