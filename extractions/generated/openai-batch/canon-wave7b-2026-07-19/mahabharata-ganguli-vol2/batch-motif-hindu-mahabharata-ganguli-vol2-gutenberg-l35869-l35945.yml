canonical_text:
  quote: '"I will sleep on this bed till the Sun turneth to the northern solstice!"'
  summary: Arjuna reverently obeys the fallen Bhishma by making a pillow from mantra-empowered
    arrows. Bhishma praises him, declares that a Kshatriya should lie on a battlefield
    bed of arrows, announces that he will yield up his life when the Sun turns north,
    refuses medical treatment, asks the kings to cease enmity, and is honored by both
    Pandavas and Kauravas. Krishna then speaks with Yudhishthira about victory, and
    Yudhishthira attributes victory to Krishna's grace and protection.
  language: English
  quote_policy: quoted
