canonical_text:
  quote: ''
  summary: Sanjaya describes a phase of battle after both armies have been arrayed.
    Arjuna causes carnage among Kaurava car-ranks; dust, blood, broken formations,
    and mass killing make directions and identities difficult to distinguish. Different
    classes of warriors kill one another across categories. The battlefield becomes
    filled with broken weapons, bodies, flesh, and blood, and is described through
    world-destruction imagery. Named leaders on both sides renew the battle.
  language: English
  quote_policy: summarized
