canonical_text:
  quote: ''
  summary: Vaisampayana reports that Yudhishthira privately summons his brothers and
    repeats intelligence from spies about Kuru warriors estimating how quickly they
    could destroy the Pandava forces. Yudhishthira asks Arjuna for his own estimate.
    Arjuna replies that, with Vasudeva as ally, he could destroy the three worlds,
    but that he possesses a weapon given by Mahadeva that should not be used against
    ordinary men; instead the Pandavas will fight fairly with their many capable allies.
  language: English
  quote_policy: summarized
