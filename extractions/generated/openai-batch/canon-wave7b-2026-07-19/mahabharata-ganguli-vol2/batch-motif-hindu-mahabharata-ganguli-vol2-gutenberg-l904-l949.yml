canonical_text:
  quote: '"No one recognised him while living under Virata''s protection."'
  summary: Nakula, one of the sons of Pandu, approaches King Virata while observing
    the royal horses. Virata perceives him as radiant, godlike, and skilled in horse-lore.
    Nakula presents himself under the name Granthika as an expert keeper and trainer
    of horses formerly employed by Yudhishthira. Virata appoints him over the horses,
    while remarking that he looks kingly and that the office seems beneath him. Nakula
    lives respectfully and unrecognized in Virata’s palace, and the sons of Pandu
    continue their pledged incognito stay in Matsya.
