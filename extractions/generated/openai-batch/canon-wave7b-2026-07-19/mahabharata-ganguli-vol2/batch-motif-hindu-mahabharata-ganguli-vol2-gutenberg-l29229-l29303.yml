canonical_text:
  quote: ''
  summary: Sanjaya narrates a battle sequence in which Subhadra's son fights several
    major warriors, is surrounded, and continues attacking. A large enemy force surrounds
    Kiritin and his son, prompting the Panchala commander Dhrishtadyumna to advance
    with troops. Dhrishtadyumna defeats Samyamani's son in close combat with a mace,
    after which Samyamani angrily attacks him and a new battle begins.
  language: English
