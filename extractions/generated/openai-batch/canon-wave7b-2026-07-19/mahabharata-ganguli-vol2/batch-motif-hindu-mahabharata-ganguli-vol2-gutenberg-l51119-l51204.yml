canonical_text:
  quote: The very sun was then shrouded, and the very wind ceased to blow.
  summary: Sanjaya narrates a fierce bow-duel between Karna and Bhima. Karna wounds
    Bhima, Bhima wounds Karna and knocks down his earring, and both warriors exchange
    dense showers of arrows. The battlefield is strewn with dead troops and broken
    equipment, while the warriors' arrows fill the sky, clash with sparks, darken
    the sun, and obscure visibility.
  language: English
