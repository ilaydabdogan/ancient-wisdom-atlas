canonical_text:
  quote: ''
  summary: Vidura addresses Duryodhana and warns him not to try to seize Krishna by
    force. He lists failed attempts by monkeys, Danavas, and Asuras to capture Krishna,
    recounts Krishna's child exploits, demon- and king-slaying victories, defeats
    of divine opponents, acquisition of the Parijata flower, primordial slayings,
    and cosmic status as unmade maker and source of power. Vidura concludes that violence
    toward Krishna will destroy Duryodhana and his followers.
  language: English
  quote_policy: summarized
