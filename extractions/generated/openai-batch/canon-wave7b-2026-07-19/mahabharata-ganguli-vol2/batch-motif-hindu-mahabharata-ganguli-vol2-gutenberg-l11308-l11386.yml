canonical_text:
  quote: ''
  summary: Sanjaya reports to Dhritarashtra in the Kuru hall that the Pandavas, though
    formerly worn by restraint in Matsya, are now prepared for war with many powerful
    allies. He lists warriors and kings supporting them, recalls earlier feats of
    Bhima, Arjuna, Nakula, Sahadeva, and Sikhandin, and concludes that Yudhishthira
    is ready for battle with support from many rulers.
  language: English
  quote_policy: summarized
