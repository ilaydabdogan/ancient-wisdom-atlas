candidate_motifs:
- id: motif:1
  label: assembled allies for decisive royal battle
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage presents a roster of kings and warriors supporting Yudhishthira,
    who is called just and prepared for battle.
  evidence_refs:
  - ev:2
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage frames alliance and battle preparation, but does not itself
    narrate coronation or formal legitimation.
- id: motif:2
  label: strong hero as rescuer of endangered kin
  taxonomy_refs:
  - culture_hero
  basis: Bhimasena is credited with rescuing the Pandavas from fire, from Hidimva,
    and from the danger surrounding Jayadratha’s carrying away of Draupadi.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage is an encomiastic battle roster rather than a full rescue
    narrative.
- id: motif:3
  label: hero gains divine recognition through combat or gratification
  taxonomy_refs:
  - sacred_exchange
  basis: Vijaya/Arjuna is said to have gratified Agni, vanquished Purandara, and gratified
    Mahadeva by combat.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage mentions gratification and combat but does not detail the
    reciprocal outcome or ritual form.
- id: motif:4
  label: rebirth and sex metamorphosis for destined vengeance
  taxonomy_refs:
  - death_rebirth
  - shapeshifter
  basis: Sikhandin is described as formerly female, taking a later birth connected
    to Bhishma’s destruction, and being metamorphosed into a male by a Yaksha.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage summarizes the transformation and prior-life desire but does
    not narrate the full earlier life episode.
- id: motif:5
  label: protector or refuge figure for threatened heroes
  taxonomy_refs: []
  basis: Virata is described as a former refuge of the Pandavas, and Vasudeva is described
    as their refuge in a divine comparison.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage states the refuge relationship but does not narrate the acts
    of protection here.
- id: motif:6
  label: poisonous serpent image for dangerous youths
  taxonomy_refs:
  - serpent
  basis: The young sons of Draupadi are called invincible and unapproachable like
    snakes of virulent poison.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This is an explicit simile, not a separate serpent episode.
comparison_claims:
- id: claim:1
  claim: Sikhandin’s account can be cautiously compared to a shapeshifter or metamorphosis
    motif because the passage explicitly says a Yaksha metamorphosed Sikhandin into
    a male.
  claim_level: same_motif
  target: shapeshifter motif family
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives only a compressed summary of the transformation and
    does not describe the mechanics beyond the Yaksha’s action.
- id: claim:2
  claim: The account of Vijaya/Arjuna gratifying deities through combat can be cautiously
    compared by function to a sacred-exchange pattern, since heroic action is presented
    as pleasing divine figures.
  claim_level: same_function
  target: sacred_exchange motif family
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not describe an explicit bargain, gift, or ritual
    exchange; the comparison rests on the language of gratification.
- id: claim:3
  claim: The snake comparison for Draupadi’s sons supports a limited visual-symbolic
    comparison to serpent imagery as a marker of danger and unapproachability.
  claim_level: visual_similarity
  target: serpent symbol family
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The passage uses serpent language only as a simile for warriors, not
    as a mythic serpent being or episode.
