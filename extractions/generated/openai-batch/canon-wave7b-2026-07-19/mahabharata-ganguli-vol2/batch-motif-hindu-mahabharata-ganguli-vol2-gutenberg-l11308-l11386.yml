  text: Sanjaya, after recovering consciousness and being comforted, addresses king
    Dhritarashtra before an assembly of Kurus in a hall.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sanjaya says he saw the sons of Kunti thinned in body because of restraint
    during their stay in the land of the Matsya king.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sanjaya tells Dhritarashtra that the Pandavas will fight against him with
    Dhrishtadyumna and a truth-observing, virtuous personage identified in the passage’s
    conclusion as Yudhishthira.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:9
- id: obs:4
  text: Bhimasena/Vrikodara is described as a mighty warrior who previously rescued
    the Pandavas from the burning lac house and the conflagration at Varanavata, protected
    them from Hidimva, and aided Draupadi when Jayadratha carried her away.
  category: action
  evidence_refs:
  - ev:3
