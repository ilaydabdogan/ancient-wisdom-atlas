canonical_text:
  quote: ''
  summary: Narada tells Srinjaya of King Gaya, son of Amartarayas, who died despite
    prolonged sacrificial austerity, a boon from Agni, victories, and a century of
    immense sacrifices and gifts. Gaya's Horse-sacrifice includes a golden earth,
    golden gemmed stakes, and a golden altar. All classes of creatures are gratified
    by his distributions of wealth and food, and the sacrifice makes him known in
    the three worlds and is linked to the eternal Banian and sacred Brahmasara. Narada
    uses the example to tell Srinjaya not to grieve for Swaitya.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Narada tells Srinjaya that Gaya, son of Amartarayas, fell prey to death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: For one hundred years Gaya ate only what remained of clarified-butter libations
    poured into the sacrificial fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Agni offers Gaya a boon after this devotional practice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gaya requests Vedic knowledge, inexhaustible wealth without injury to others,
    the ability to give to Brahmanas and give food with devotion, sons by wives of
    his own order, delight in righteousness, and freedom from impediment in acts for
    religious merit.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Agni says the boon is granted and disappears; Gaya obtains what he requested
    and subjugates foes in fair fight.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Gaya performs diverse sacrifices for a full hundred years with profuse presents
    to Brahmanas, including Chaturmasya vows and other sacrifices.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Each year for a century Gaya gives one hundred and sixty thousand kine, ten
    thousand steeds, and one crore gold nishkas.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: In his Horse-sacrifice Gaya makes a golden earth and gives it to the Brahmanas;
    his sacrificial stakes are of gold, decked with gems, and also given away.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Creatures and places associated with the ocean, woods, islands, rivers, waters,
    towns, provinces, and heaven are gratified with wealth and food from Gaya's sacrifices
    and praise the sacrifice.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Gaya's sacrificial altar is described with large dimensions, made entirely
    of gold, and overspread with pearls, diamonds, and gems; he gives it to the Brahmanas
    with robes and ornaments.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: After the sacrifice, twenty-five hills of food remain untouched, along with
    lakes and rivulets of juicy drinks and heaps of robes and ornaments.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The merit of Gaya's great sacrifice makes him well known in the three worlds,
    and the eternal Banian and sacred Brahmasara are attributed to that sacrifice.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Narada concludes that because Gaya, who is said to be superior to Srinjaya
    and to Srinjaya's son, died, Srinjaya should not grieve for Swaitya.
  category: speech
  evidence_refs:
  - ev:10
