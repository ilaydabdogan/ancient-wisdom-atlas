canonical_text:
  quote: ''
  summary: In a battle against the Kalingas, Bhimasena terrifies and scatters the
    enemy. Dhrishtadyumna, Yudhishthira, Sikhandin, and Satyaki move to support him.
    Bhima creates great slaughter, described as a bloody river and as Death fighting
    in Bhima’s shape. Bhishma comes against him, kills Bhima’s horses, and cuts down
    Bhima’s dart. Bhima leaps from his car with a mace, Dhrishtadyumna rescues him
    onto his own car, and Satyaki kills Bhishma’s charioteer so that Bhishma is carried
    away by his horses. Bhima completes the destruction of the Kalinga forces and
    is praised and embraced by his allies.
  language: English
  quote_policy: summarized
