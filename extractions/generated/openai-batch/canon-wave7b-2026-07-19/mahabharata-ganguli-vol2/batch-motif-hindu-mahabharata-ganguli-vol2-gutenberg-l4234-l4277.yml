canonical_text:
  quote: ''
  summary: On a battlefield, the Kuru ranks, horses, and armored elephants stand ready.
    Sakra arrives in a heavenly car with celestial beings, and the sky fills with
    gods, Yakshas, Gandharvas, Nagas, sages, kings, and jeweled cars to watch the
    coming encounter of Bhishma and Arjuna and the use of celestial weapons in human
    warfare. Celestial fragrance, light, ornaments, and breeze transform the scene;
    Sakra gazes at his son on the battlefield.
  language: English
  quote_policy: summarized
