canonical_text:
  quote: "“Born a daughter, she will become a son!”"
  summary: Sikhandini's mother tells Drupada that Sikhandini was born a daughter but
    was represented as a son, given rites for a son, and married to the daughter of
    the Dasarnaka king, in reliance on Siva's words that she would become a son. Drupada
    prepares for danger from the Dasarnaka ruler, while the queen counsels worship,
    offerings, and practical defense. Ashamed that her parents suffer because of her,
    Sikhandini leaves home for a dangerous forest haunted by the Yaksha Sthunakarna,
    fasts in his mansion, and asks him to save her family and make her a perfect man
    until the enemy king departs.
  language: English
  quote_policy: quoted
