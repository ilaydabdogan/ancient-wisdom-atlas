canonical_text:
  quote: ''
  summary: Kripa is led away after being deprived of his car. Drona then advances
    toward Arjuna with bow and arrow ready. Arjuna asks Uttara to carry him before
    Drona, identifying Drona by his golden car, fire-like banner emblem, flags, and
    red steeds. Arjuna praises Drona as preceptor, learned in Vedas, Brahmacharya,
    morality, celestial weapons, their withdrawal, and virtues, and says he desires
    to fight him.
  language: English
