canonical_text:
  quote: ''
  summary: Sanjaya narrates Arjuna's advance into the Kaurava army to kill Jayadratha.
    Yudhamanyu and Uttamaujas follow as protectors of his chariot wheels. Named chiefs,
    ten thousand car-warriors, and many tribes under Bharadwaja's son attempt to stop
    him. Arjuna is described as angry and grief-stricken over his son's death, ready
    to risk his life in battle, and compared to all-destroying Death, an enraged elephant
    leader, and a raging disease resisted by medicines.
  language: English
  quote_policy: summarized
