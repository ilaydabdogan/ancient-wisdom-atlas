canonical_text:
  quote: The world being enveloped in darkness, nothing could be seen.
  summary: Sanjaya describes a night battle after Duryodhana rebukes Karna and Drona
    for allowing the Pandavas to rout the Kaurava army. Karna and Drona reenter the
    battle fiercely, Drona slaughters Panchalas and causes the Pandava host to flee,
    Krishna encourages Arjuna as Bhima advances, and the Pandava force returns. In
    the darkness, warriors fight by torchlight, by uttered names, and amid alternating
    silence and uproar.
  language: English
  quote_policy: quoted
