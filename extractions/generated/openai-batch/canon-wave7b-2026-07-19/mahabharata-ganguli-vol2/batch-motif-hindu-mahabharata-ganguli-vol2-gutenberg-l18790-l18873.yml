canonical_text:
  quote: ''
  summary: Vaisampayana narrates a war council in which Yudhishthira, after hearing
    Janardana/Kesava, asks his brothers to arrange seven Akshauhinis of troops and
    to choose a generalissimo able to withstand Bhishma. Sahadeva recommends Virata,
    Nakula recommends Drupada, Arjuna recommends Dhrishtadyumna, and Bhima recommends
    Sikhandin.
  language: English
  quote_policy: summarized
