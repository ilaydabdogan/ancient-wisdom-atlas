canonical_text:
  quote: ''
  summary: Sanjaya reports Karna's address to Krishna. Karna predicts a destructive
    battle between the Pandavas and Kurus and lists celestial, animal, auditory, bodily,
    divine, and landscape portents that indicate Duryodhana's defeat and Yudhishthira's
    victory.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sanjaya frames the episode by saying that Karna heard Kesava's words, worshipped
    Krishna, and then spoke to him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Karna asks Krishna why he seeks to beguile him despite knowing everything.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Karna says destruction of the whole earth is near and names Sakuni, himself,
    Dussasana, and Duryodhana as its causes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Karna predicts a fierce battle between the Pandavas and Kurus, says it will
    cover the earth with bloody mire, and says Duryodhana's followers will be consumed
    by weapon-fire and go to Yama's abode.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Karna says frightful visions, portents, and disturbances indicate the defeat
    of Dhritarashtra's son and the victory of Yudhishthira.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The celestial signs include Saturn afflicting Rohini, Mars moving toward Jyeshthya
    and Anuradhas, Mahapat afflicting Chitra, a shifted lunar spot, Rahu approaching
    the sun, and meteors falling with noise and trembling motion.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Elephants cry frightfully, and steeds shed tears and do not delight in food
    and drink.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In Duryodhana's army, animals eat little but evacuate much; Pandava animals
    are cheerful and move to the right, while animals pass on the left of Duryodhana's
    army and incorporeal voices are heard overhead.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Auspicious birds follow the Pandavas, while vultures, Kankas, hawks, Rakshasas,
    wolves, and bees follow the Kauravas.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Duryodhana's drums make no sound, Pandava drums sound without being struck,
    and wells in Duryodhana's encampment roar like bulls.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The gods shower flesh and blood on Duryodhana's soldiers; vapoury edifices
    appear in the sky over the Kuru encampment; a black circle surrounds the sun;
    the twilights indicate terrors; jackals yell.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: Birds with one wing, one eye, and one leg utter terrible cries, and black-winged,
    red-legged birds hover over the Kuru encampment at nightfall.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Duryodhana's soldiers show hatred first for Brahmanas, then for preceptors,
    and then for affectionate servants.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The eastern horizon of Duryodhana's encampment appears red, the southern horizon
    has the hue of weapons, the western horizon has an earthy hue, and the surrounding
    quarters seem ablaze.
  category: setting
  evidence_refs:
  - ev:10
