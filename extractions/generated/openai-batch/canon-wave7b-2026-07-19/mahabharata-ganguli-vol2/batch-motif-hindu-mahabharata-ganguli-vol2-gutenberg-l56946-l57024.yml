canonical_text:
  quote: ''
  summary: After Karna slays Ghatotkacha at night, the Kaurava forces rejoice and
    attack the Pandava army. Yudhishthira grieves, recalls Ghatotkacha's past services
    to the Pandavas, judges Drona and Karna as central causes of their suffering,
    and advances to fight Karna. Krishna counsels against grief, warns Arjuna that
    Yudhishthira is rushing in wrath, follows after him, and Vyasa approaches Yudhishthira.
  language: English
  quote_policy: summarized
