canonical_text:
  quote: As regards my army, it is a veritable main
  summary: A first-person speaker taunts the addressed warrior about former humiliating
    roles in Virata's city, refuses to yield the kingdom, dismisses fear of Vasudeva
    or the addressee, challenges the opponent to fight with Kesava as ally, and describes
    the speaker's army as a dangerous ocean filled with warriors figured as sea-creatures
    and maritime forces. The speaker predicts that the opponent will plunge into this
    weapon-filled ocean, lose relatives and friends, and abandon hope of ruling the
    earth.
  language: English
