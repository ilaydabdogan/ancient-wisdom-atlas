canonical_text:
  quote: ''
  summary: 'A quoted speaker gives a king moral and practical counsel: righteousness
    is described through enumerated virtues, truth is linked to morality, sin and
    virtue are said to produce recurring consequences, Yama is named as controller
    of secret sinners, righteous conduct is linked to enduring rule, and the king
    is urged not to rely on Duryodhana, Sakuni, Dussasana, and Karna but to rely on
    the virtuous Pandavas as sons.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The speaker lists eight paths of righteousness: sacrifice, study, charity,
    asceticism, truth, forgiveness, mercy, and contentment.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker states that morality cannot be separated from truth, and that
    truth is not truth if it is joined with deceit.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker says sin brings evil consequences and destroys intelligence when
    repeatedly committed, while repeated virtue increases intelligence and leads to
    happiness and blessed regions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker says envious, injurious, cruel, quarrelsome, and deceitful persons
    meet misery, while a non-envious wise person who does good shines everywhere.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker advises drawing wisdom from the wise, attending to both virtue
    and profit, and acting in the present to secure future happiness at night, in
    the rainy season, in old age, and hereafter.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker says wealth acquired wrongfully fails to fill the gap it is meant
    to fill, and new gaps appear elsewhere.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The speaker assigns different controllers: the preceptor controls those whose
    souls are self-controlled, the king controls wicked persons, and Yama controls
    those who sin secretly.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The speaker says the greatness of Rishis, rivers, river-banks, high-souled
    men, and the cause of woman's wickedness cannot be ascertained.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The speaker says those devoted to worship of Brahmanas, giving, righteous
    conduct toward relatives, and noble Kshatriya conduct rule the earth forever;
    he also says bravery, learning, and knowledge of protection enable persons to
    gather flowers of gold from the earth.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The speaker ranks acts accomplished by intelligence first, acts accomplished
    by arms second, acts by thighs lower, and acts by bearing weights on the head
    as worst.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The speaker asks how the king can hope for prosperity while the care of the
    kingdom rests on Duryodhana, Sakuni, Dussasana, and Karna, and says the Pandavas
    are virtuous, depend on the king as father, and should be relied on as sons.
  category: relationship
