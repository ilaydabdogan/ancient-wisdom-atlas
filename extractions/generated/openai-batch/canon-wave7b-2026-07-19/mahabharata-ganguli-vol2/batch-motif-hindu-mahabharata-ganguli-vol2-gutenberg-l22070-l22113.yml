canonical_text:
  quote: '"Thou shalt have a child who will be a female and male."'
  summary: Duryodhana asks Bhishma how Sikhandin, formerly born as a daughter, became
    a man. Bhishma recounts that Drupada performed severe austerities to Sankara/Mahadeva
    for a son who would avenge him against Bhishma. The deity instead declared that
    the child would first be female and later male, according to destiny. Drupada's
    queen conceived and gave birth to a daughter, but she and Drupada represented
    the child as a son, performed male-child rites, concealed the child's sex, and
    named the child Sikhandin. Bhishma says he knew the truth through spies, Narada,
    the god's words, and Amva's austerities.
  language: English
  quote_policy: quoted
