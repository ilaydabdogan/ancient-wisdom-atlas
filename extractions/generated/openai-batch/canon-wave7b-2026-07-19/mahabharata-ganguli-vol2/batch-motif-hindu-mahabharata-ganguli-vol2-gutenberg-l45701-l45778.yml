canonical_text:
  quote: ''
  summary: Sanjaya narrates that Arjuna, seeking to reach Jayadratha, approaches Drona
    at the entrance of the battle array and asks for his blessing. Drona replies that
    Arjuna cannot defeat Jayadratha without first defeating him, and the two engage
    in a fierce arrow battle. After Drona delays and wounds Arjuna and Krishna, Krishna
    urges Arjuna to avoid Drona and continue toward the more important objective.
    Arjuna proceeds while affirming that Drona is his preceptor, not his foe, and
    that no one can defeat Drona in battle.
  language: English
  quote_policy: summarized
