canonical_text:
  quote: ''
  summary: Yudhishthira tells Krishna that Dhritarashtra, speaking through Sanjaya
    and influenced by his son, seeks peace without restoring the Pandavas' kingdom
    despite their fulfilled exile pledge. Yudhishthira says he requested only five
    villages to avert destruction of the Bharatas, but Dhritarashtra's son refused.
    He then gives an ethical discourse on avarice, loss of wealth, poverty as social
    death, moral collapse, hell, and the restorative power of wisdom, shame, virtue,
    and self-control.
  language: English
  quote_policy: summarized
