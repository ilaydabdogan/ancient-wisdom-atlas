canonical_text:
  quote: Death hath been ordained by the Creator himself for all creatures!
  summary: Brahman instructs the personified Death to take lives without sin, explains
    that Death's tears will become diseases, and Narada uses the account to console
    Akampana about his dead son. Vyasa then applies the teaching to Yudhishthira after
    Abhimanyu's death, stressing heroic heaven, the inevitability of death, and renewed
    warrior duty.
  language: English
  quote_policy: quoted
