canonical_text:
  quote: Even death in battle is better than flight from fear.
  summary: After setting out from Virata's city, Uttara and Vrihannala/Arjuna approach
    the Kuru army. On seeing the formidable force, Uttara refuses battle and flees;
    Vrihannala rebukes him and pursues him while Kuru observers suspect the disguised
    figure is Arjuna.
  language: English
  quote_policy: quoted
