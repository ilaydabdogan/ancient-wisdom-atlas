canonical_text:
  quote: ''
  summary: Arjuna fights large opposing forces, slays many warriors and animals, and
    the battlefield is described through images of arrows, blood, a river flowing
    toward Yama, and fire consuming a forest. Srutayus, ruler of the Amvashthas, attacks
    Arjuna and Kesava with a mace; Arjuna cuts down his horses, bow, mace, arms, and
    head. Partha is then surrounded by many cars and elephants and becomes hidden
    like the sun by clouds.
  language: English
  quote_policy: summarized
