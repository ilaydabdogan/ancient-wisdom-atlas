canonical_text:
  quote: ''
  summary: Krishna describes god-like and demoniac dispositions, their traits, their
    consequences for deliverance or bondage, and the ruinous path of lust, wrath,
    and avarice. He instructs Arjuna to use scripture as authority for action. Arjuna
    then asks about people who perform sacrifices with faith while abandoning scriptural
    ordinance.
  language: English
  quote_policy: summarized
