  quote: ''
  summary: Dhritarashtra asks how Yudhishthira arranged a smaller Pandava force against
    Bhishma and the larger Kaurava army. Sanjaya reports that Yudhishthira invoked
    Vrihaspati's tactical rule for the few against the many, and Arjuna chose the
    invincible Vajra array, placing Bhima at the front. The passage then describes
    the layered arrangement of Pandava warriors, protectors, standards, elephants,
    and foot-soldiers, ending with the Pandavas waiting for battle in an array protected
    by Arjuna and made invincible by the Pandavas.
