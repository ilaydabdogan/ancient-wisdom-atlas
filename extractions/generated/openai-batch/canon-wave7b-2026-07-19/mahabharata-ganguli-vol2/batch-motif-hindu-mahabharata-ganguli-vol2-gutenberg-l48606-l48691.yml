canonical_text:
  quote: ''
  summary: Sanjaya narrates that Satyaki, also called Yuyudhana and the grandson of
    Sini, turns back to protect the Pandavas, defeats Kritavarman by disabling his
    chariot, then directs his charioteer toward an elephant division near Drona's
    host. Satyaki advances in a bright chariot drawn by white steeds, routs the elephant
    corps with arrows, and then faces Jalasandha, ruler of the Magadhas, mounted on
    an elephant. Jalasandha wounds Satyaki and cuts his bow, but Satyaki takes up
    another bow and counterattacks before Jalasandha hurls a lance as the supplied
    passage breaks off.
  language: English
  quote_policy: summarized
