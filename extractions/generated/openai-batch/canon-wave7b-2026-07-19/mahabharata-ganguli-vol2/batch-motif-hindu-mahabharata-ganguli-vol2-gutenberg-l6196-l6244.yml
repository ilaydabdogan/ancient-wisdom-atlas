canonical_text:
  quote: ''
  summary: Drupada addresses his learned priest, praises his wisdom, recounts the
    deceitful gambling by which Yudhishthira and the Pandavas were dispossessed, and
    instructs the priest to go as a Brahmana ambassador to Dhritarashtra and the Kauravas.
    The priest is to speak righteous words, influence Kuru fighters and elders, and
    buy time while the Pandavas prepare for war. The priest then departs for Hastinapura
    with disciples.
  language: English
