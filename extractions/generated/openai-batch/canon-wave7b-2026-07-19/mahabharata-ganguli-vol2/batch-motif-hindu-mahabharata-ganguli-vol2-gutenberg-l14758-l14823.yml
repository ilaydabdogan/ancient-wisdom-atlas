canonical_text:
  quote: ''
  summary: Kesava speaks before a royal assembly, urging the addressed Bharata king
    to treat the Pandavas as sons, recognize that they fulfilled their exile pledge,
    restore their rightful kingdom share, and make peace. The speech warns that an
    assembly allowing righteousness to be overcome by unrighteousness becomes morally
    implicated. It recalls Yudhishthira's endurance of exile, attempted burning, dice
    dispossession, and public humiliation involving Krishna. The assembled rulers
    inwardly approve Kesava's words but remain silent before Duryodhana.
  language: English
  quote_policy: summarized
