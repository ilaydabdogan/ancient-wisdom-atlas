canonical_text:
  quote: ''
  summary: Sanjaya narrates a fierce battle in which Duryodhana orders the Kuru-side
    combatants to begin fighting. Bhishma attacks the Pandava forces, causing them
    to waver. Arjuna asks Krishna to drive him toward Bhishma, and Krishna brings
    Arjuna’s bannered chariot before the grandsire. Arjuna and Bhishma exchange volleys
    while allies on both sides surround them; Duryodhana urges Bhishma to stop Arjuna,
    and the duel begins again with conches and battle roars.
  language: English
  quote_policy: summarized
