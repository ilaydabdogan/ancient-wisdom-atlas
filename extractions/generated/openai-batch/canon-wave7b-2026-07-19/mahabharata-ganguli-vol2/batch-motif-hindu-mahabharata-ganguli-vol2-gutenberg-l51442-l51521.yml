canonical_text:
  quote: ''
  summary: Sanjaya reports that Satyaki is surrounded by Trigarta warriors but fights
    through them and other divisions, reaches the sight of Arjuna, and is praised
    by Kesava for piercing the Kaurava army and defeating many opponents. Arjuna is
    troubled by Satyaki's arrival because Yudhishthira may now be exposed to Drona,
    Jayadratha remains unslain, the sun is low, and Bhurisravas is moving against
    an exhausted Satyaki.
  language: English
  quote_policy: summarized
