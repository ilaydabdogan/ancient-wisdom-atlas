    while describing it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the vision, Yudhishthira ascends a palace supported by a thousand columns
    with his brothers; they wear white head-gears and white robes and sit on white
    seats.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Krishna is seen enveloping a blood-dyed earth with weapons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yudhishthira ascends a heap of bones, eats buttered payasa from a golden cup,
    and swallows the earth handed to him by Krishna; Karna says this indicates Yudhishthira
    will rule the earth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Vrikodara stands on a summit with a mace and appears to devour the earth;
