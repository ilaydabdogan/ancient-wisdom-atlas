canonical_text:
  quote: ''
  summary: Karna recounts to Krishna a vision in which Yudhishthira and his allies
    appear in white and are associated with rule and victory, while other kings are
    marked by red, a journey toward Yama's abode, and entry into the Gandiva fire.
    Krishna says destruction is near when his words are not accepted. Karna answers
    that they may meet again if they survive, otherwise in heaven; he embraces Krishna
    and departs dejected.
  language: English
  quote_policy: summarized
