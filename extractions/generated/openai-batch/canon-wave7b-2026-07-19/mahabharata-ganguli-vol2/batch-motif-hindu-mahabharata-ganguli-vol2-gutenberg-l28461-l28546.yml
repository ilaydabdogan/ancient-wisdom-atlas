canonical_text:
  quote: ''
  summary: Sanjaya narrates a battle sequence in which Dhrishtadyumna fights Drona's
    son, Salya, and Kripa; Abhimanyu joins the fighting and duels Lakshmana; Duryodhana
    and Kuru kings surround Abhimanyu; Arjuna rushes to rescue his son and routs the
    opposing host. After Arjuna and Vasudeva blow their conches, Bhishma tells Drona
    that Arjuna cannot be defeated that day, compares his form to the Destroyer at
    the end of the Yuga, and orders withdrawal as the sun sets.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sanjaya reports that after the forenoon, destruction among chariots, elephants,
    horses, foot-soldiers, and cavalry continued while Dhrishtadyumna fought Drona's
    son, Salya, and Kripa.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dhrishtadyumna killed the celebrated steeds of Drona's son; Drona's son then
    mounted Salya's car and shot arrows at Dhrishtadyumna.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Abhimanyu came to the battle, struck Salya, Kripa, and Aswatthaman with arrows,
    and was pierced by them in return.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lakshmana, Duryodhana's son, rushed at Abhimanyu; the two fought, Abhimanyu
    pierced Lakshmana with many arrows, and Lakshmana cut Abhimanyu's bow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Abhimanyu took up another bow after his bow was cut, and the two cousins continued
    to pierce each other with arrows.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Duryodhana came toward the place where his son was afflicted, and Kuru-side
    kings surrounded Arjuna's son with crowds of cars.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Abhimanyu was described as not agitated while surrounded; Arjuna then rushed
    to rescue his own son.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Kuru-side kings led by Bhishma and Drona rushed at Arjuna, and dust raised
    by soldiers, horses, cars, and cavalry covered the sky.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Within range of Arjuna's arrows, elephants and kings could not advance; creatures
