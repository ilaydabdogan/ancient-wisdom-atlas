canonical_text:
  quote: '"This is the awful evening time; it is neither day, nor night"'
  summary: Vritra obtains conditions under which he cannot be killed and peace is
    concluded with Indra. Indra continues seeking a loophole, finds Vritra at the
    sea at evening, and uses sea-froth blended with the thunderbolt; Vishnu enters
    the froth and Vritra dies. The world rejoices, but Indra is overcome by falsehood
    and the sin of Brahmanicide, hides in water, and his disappearance brings environmental
    disorder and fear over the lack of a king of the gods.
  language: English
  quote_policy: quoted
