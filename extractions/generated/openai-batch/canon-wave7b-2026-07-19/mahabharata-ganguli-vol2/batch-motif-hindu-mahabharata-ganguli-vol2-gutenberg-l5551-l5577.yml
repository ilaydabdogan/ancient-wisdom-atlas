canonical_text:
  quote: ''
  summary: Virata offers his daughter Uttara to Arjuna as a wife. Arjuna refuses direct
    marriage, explaining that Uttara has trusted him as a father and protector during
    his year in the inner apartments. To avoid suspicion and attest her purity, he
    asks that Uttara become his daughter-in-law by marrying his son Abhimanyu. Virata
    approves Arjuna's decision.
