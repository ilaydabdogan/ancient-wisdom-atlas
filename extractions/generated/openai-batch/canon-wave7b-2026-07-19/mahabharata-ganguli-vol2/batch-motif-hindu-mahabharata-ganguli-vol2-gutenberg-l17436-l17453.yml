canonical_text:
  quote: ''
  summary: A son tells his mother that without seeing him, earth, ornaments, pleasures,
    and life would be useless to her. The mother urges Sanjaya not to live in weak
    dependence on others, but to become one on whom Brahmanas, friends, and creatures
    depend for sustenance. She compares such dependence to creatures relying on clouds,
    gods relying on Indra, and birds going to a fruitful tree. She praises prowess,
    fame in this world, and blessedness in the next.
  language: English
  quote_policy: summarized
