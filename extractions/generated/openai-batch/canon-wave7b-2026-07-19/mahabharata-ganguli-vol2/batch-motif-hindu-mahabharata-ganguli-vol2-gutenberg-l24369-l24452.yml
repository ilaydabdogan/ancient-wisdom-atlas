canonical_text:
  quote: ''
  summary: 'Sanjaya reports the opening of battle as foretold by Vyasa: celestial
    and animal omens appear, Bhishma exhorts the assembled Kshatriyas that battle
    death is the open path to heaven, Karna abstains for Bhishma''s sake, and the
    Kaurava army advances and deploys with named commanders, standards, elephants,
    cars, steeds, and a many-sided Vyuha described as a living body.'
  language: English
  quote_policy: summarized
