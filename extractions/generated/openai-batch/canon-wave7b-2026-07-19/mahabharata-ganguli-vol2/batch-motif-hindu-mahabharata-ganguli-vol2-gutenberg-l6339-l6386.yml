canonical_text:
  quote: ''
  summary: A son of Kunti returns to Yudhishthira with Krishna and another Dasarha
    figure. Salya approaches the Pandavas with a large army and sons. Duryodhana learns
    of Salya’s approach, secretly arranges lavish reception pavilions, and has his
    servants attend Salya. Salya mistakenly believes Yudhishthira’s men prepared the
    hospitality and offers to reward them. Duryodhana reveals himself, and Salya,
    pleased, grants him a boon. Duryodhana asks Salya to lead his army.
  language: English
