canonical_text:
  quote: I am Death, the destroyer of the worlds, fully developed.
  summary: Arjuna describes a terrifying universal form containing gods, creatures,
    sages, celestial snakes, and doomed warriors entering flaming mouths. The deity
    identifies himself as Death, says the warriors are already slain, and commands
    Arjuna to fight as his instrument. Sanjaya reports Arjuna trembling, bowing, and
    speaking in fear.
  language: English
  quote_policy: quoted
