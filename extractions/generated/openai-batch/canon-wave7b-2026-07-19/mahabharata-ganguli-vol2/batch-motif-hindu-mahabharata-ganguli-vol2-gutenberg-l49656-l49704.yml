canonical_text:
  quote: ''
  summary: Sanjaya reports an afternoon battle in which Drona attacks the Pandavas
    and Somakas. The Kaikeya prince Vrihatkshatra challenges him, counters many arrows,
    and baffles Drona's celestial Brahma weapon with a Brahma weapon of his own. Drona
    then wounds Vrihatkshatra, disables his chariot, kills his horses, fells his charioteer
    and emblems, pierces him in the chest, and Vrihatkshatra falls from his car.
  language: English
  quote_policy: summarized
