canonical_text:
  quote: without casting a single glance at all those pavilions and all those gems
    of diverse kinds.
  summary: Dhritarashtra hears from spies that Krishna has set out for the Kurus on
    behalf of the Pandavas. He tells Duryodhana and the counsellors that Krishna is
    universally revered, deserving of worship, and capable of granting happiness or
    misery. Dhritarashtra orders lavish reception pavilions to be built along the
    road. Duryodhana has jeweled pavilions and hospitality goods prepared, including
    a special pavilion at Vrikasthala, but Krishna arrives at the Kuru capital without
    looking at them.
  language: English
  quote_policy: quoted
