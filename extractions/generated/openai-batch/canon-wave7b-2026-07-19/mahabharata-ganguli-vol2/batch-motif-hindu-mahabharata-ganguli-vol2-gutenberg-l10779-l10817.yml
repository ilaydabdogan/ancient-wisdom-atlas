canonical_text:
  quote: that hall looked, O king, like a mountain-cave filled with lions
  summary: After a night of conversation with Sanat-sujata and Vidura, Dhritarashtra
    and assembled Kuru princes, chiefs, and warriors enter an ornate court-hall to
    hear Sanjaya, the Suta's son, who has returned from the Pandavas. Sanjaya reports
    that the sons of Pandu send appropriate greetings and says he will relate what
    he told them on Dhritarashtra's instructions.
  language: English
