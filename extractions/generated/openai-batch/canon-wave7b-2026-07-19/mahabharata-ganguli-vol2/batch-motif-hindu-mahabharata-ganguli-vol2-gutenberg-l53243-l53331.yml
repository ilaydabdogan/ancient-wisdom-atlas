canonical_text:
  quote: ''
  summary: Dhritarashtra asks how Drona was opposed and how he died after entering
    the Pandava host. Sanjaya answers by describing many Pandava-allied warriors advancing
    against Drona during a pitch-dark night battle marked by omens, noise, dust, blood,
    fire and storm imagery, and Drona's destructive resistance.
  language: English
  quote_policy: summarized
