canonical_text:
  quote: ''
  summary: The passage praises king Marutta's golden sacrificial establishment, abundant
    offerings, hospitality to Brahmanas, divine participation, reciprocal rain and
    crops from gratified gods, gifts to sacred recipients, happy subjects, and posthumous
    bliss. It closes by using Marutta's death as a consolation to Srinjaya for his
    son, who had performed no sacrifice and given no sacrificial present.
