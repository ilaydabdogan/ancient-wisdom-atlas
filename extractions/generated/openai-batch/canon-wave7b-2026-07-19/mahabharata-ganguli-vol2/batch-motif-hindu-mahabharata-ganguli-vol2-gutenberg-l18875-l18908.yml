    describing Krishna as knowing strength, weakness, intentions, and the outcome
    of success and defeat. Yudhishthira proposes worshipping the weapons and marching
    at daybreak under Krishna’s orders. Krishna approves the warriors, states that
    he had already tried to prevent war through peace, calls Duryodhana foolish, predicts
    the enemy host’s defeat, and names Dhrishtadyumna as commander.
