canonical_text:
  quote: ''
  summary: Sanjaya narrates an afternoon battle between the Panchalas and Kurus in
    which Drona becomes the central objective. Many warriors engage in paired combats.
    Yudhishthira and Drona exchange arrows, darts, Brahma weapons, and maces. Drona
    eventually disables Yudhishthira’s chariot, cuts his bow and standard, wounds
    him, and leaves him standing weaponless with raised arms as the supplied fragment
    ends.
  language: English
  quote_policy: summarized
