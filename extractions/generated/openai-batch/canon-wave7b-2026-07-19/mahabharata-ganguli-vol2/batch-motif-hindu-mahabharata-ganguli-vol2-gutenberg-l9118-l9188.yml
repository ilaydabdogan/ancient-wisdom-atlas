canonical_text:
  quote: ''
  summary: Vidura cites an old discourse in which the deities called Sadhyas question
    the wise son of Atri, who is wandering as a mendicant Rishi. The Rishi teaches
    tranquillity, mastery of passions, restraint from harsh speech and retaliation,
    the influence of companions, and distinctions among good and bad persons. Dhritarashtra
    then asks Vidura what families are called high.
  language: English
  quote_policy: summarized
