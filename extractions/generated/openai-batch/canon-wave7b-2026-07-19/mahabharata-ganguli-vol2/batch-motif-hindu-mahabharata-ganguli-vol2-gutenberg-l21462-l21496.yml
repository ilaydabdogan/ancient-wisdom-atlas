canonical_text:
  quote: ''
  summary: Bhishma recounts his battlefield exchange with Rama. Bhishma asks Rama
    to mount a chariot and wear armor before fighting. Rama replies with a Vedic and
    cosmic description of his own chariot and protection, then attacks with arrows.
    Bhishma sees Rama on a wondrous will-created chariot, with Akritavrana as driver.
    After Rama's arrow showers, Bhishma descends from his own chariot, lays aside
    his bow, worships and salutes Rama as his preceptor, and asks for a blessing for
    victory.
  language: English
