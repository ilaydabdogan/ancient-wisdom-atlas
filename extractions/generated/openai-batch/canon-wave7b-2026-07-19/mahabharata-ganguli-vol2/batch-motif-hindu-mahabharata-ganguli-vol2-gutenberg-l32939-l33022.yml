canonical_text:
  quote: ''
  summary: The passage describes a battle in which Arjuna is resisted by Ganga's son,
    Bhagadatta, and Gautama, while Abhimanyu overcomes king Amvashta's chariot and
    evades his thrown sword. A fierce melee follows between the two armies, including
    hand-to-hand fighting and kin-slaying. The battlefield is then described as covered
    with weapons, ornaments, bodies of men, horses, and elephants, blood, broken vehicles,
    banners, conches, and royal equipment. The earth and battlefield are compared
    to hills, mild fires, an adorned damsel, moving hills, and the starry firmament.
    The armies crush one another until fatigue, rout, and nightfall.
  language: English
  quote_policy: summarized
