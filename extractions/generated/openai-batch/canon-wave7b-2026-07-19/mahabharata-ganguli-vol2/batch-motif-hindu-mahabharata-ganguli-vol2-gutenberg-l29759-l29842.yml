canonical_text:
  quote: ''
  summary: Bhishma counsels a Kuru king to make peace with the Pandavas and explains
    their invincibility by the protection of the wielder of Saranga. He recounts an
    ancient scene in which celestials and Rishis attend Brahma on Gandhamadana; a
    blazing heavenly car and divine form appear, and Brahma worships the Supreme Being
    as Vasudeva, Narayana, Vishnu, creator, destroyer, and cosmic-bodied Lord whose
    form includes earth, heavens, directions, fire, wind, waters, the Vedas, and other
    divine powers.
  language: English
  quote_policy: summarized
