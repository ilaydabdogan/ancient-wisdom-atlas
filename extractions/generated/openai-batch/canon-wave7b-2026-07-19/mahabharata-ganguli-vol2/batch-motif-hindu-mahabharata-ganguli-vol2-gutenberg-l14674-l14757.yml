canonical_text:
  quote: ''
  summary: In a royal assembly, Krishna addresses Dhritarashtra and urges him to establish
    peace between the Kurus and Pandavas. He praises the Kuru lineage, rebukes Dhritarashtra's
    sons led by Duryodhana, warns that battle will bring wholesale destruction and
    depopulate the earth, and asks the king to restrain his sons, revive affection
    for the Pandavas, and allow the assembled kings to reconcile and return home.
  language: English
  quote_policy: summarized
