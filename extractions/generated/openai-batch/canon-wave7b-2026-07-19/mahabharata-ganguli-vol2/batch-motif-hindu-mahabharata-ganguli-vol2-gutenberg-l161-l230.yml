canonical_text:
  quote: ''
  summary: Bhima describes how he will enter Virata's service as the cook Vallabha
    while also performing feats of strength and nonlethal wrestling. Yudhishthira
    then asks what office Arjuna will take and praises Arjuna through recollections
    of Khandava, Agni, Nagas, celestial weapons, and superlative comparisons. Arjuna
    answers that he will conceal his warrior marks with ornaments, assume the name
    Vrihannala as one of the third sex, live as a female, entertain and instruct women
    in music and dance, and claim former service as Draupadi's waiting maid.
  language: English
  quote_policy: summarized
