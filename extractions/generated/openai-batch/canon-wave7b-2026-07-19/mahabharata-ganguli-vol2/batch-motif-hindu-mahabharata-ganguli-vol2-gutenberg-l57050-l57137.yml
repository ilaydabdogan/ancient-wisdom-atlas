canonical_text:
  quote: ''
  summary: Sanjaya reports that, after Vyasa's counsel and after Ghatotkacha's death
    at Karna's hands, Yudhishthira orders Dhrishtadyumna and other Pandava allies
    to attack Drona. Drona withstands them while Duryodhana moves to protect him.
    Exhausted troops on both sides fight through a terrible night; many fall asleep,
    are killed, or strike comrades in confusion. Arjuna calls for both armies to rest
    until moonrise, and both sides cease fighting, praise and bless him, and sleep
    on the battlefield among their animals and weapons.
  language: English
  quote_policy: summarized
