canonical_text:
  quote: ''
  summary: Dhritarashtra questions Sanjaya about Yudhishthira's response to the assembled
    forces, the approaching conflict, and those urging peace. Sanjaya reports that
    the Panchalas and other sons of Pandu look to Yudhishthira while he restrains
    them, and that allied forces and spectators are gathering and rejoicing. When
    Dhritarashtra asks about the forces of Dhrishtadyumna and the Somakas, Sanjaya
    becomes thoughtful, sighs, and collapses senseless in the Kuru hall; Vidura announces
    this, and Dhritarashtra attributes it to Sanjaya's anxiety after seeing Kunti's
    sons.
  language: English
  quote_policy: summarized
