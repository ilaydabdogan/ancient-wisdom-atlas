canonical_text:
  quote: "“Be thou the raft in this battle to the sinking Pandavas.”"
  summary: Vasudeva advises Arjuna not to face Karna while Karna still holds Vasava’s
    blazing dart. He summons Ghatotkacha, describes Karna’s devastation of the Pandava
    forces at night, and urges Ghatotkacha to rescue his kinsmen and fight Karna with
    Rakshasa powers and illusions. Arjuna supports the order, comparing the planned
    combat to Indra’s slaying of Taraka with Skanda’s aid. Ghatotkacha accepts, vows
    a ruthless night battle, and rushes against Karna; their clash is likened to a
    mythic battle between Indra and Prahlada.
  language: English
  quote_policy: quoted
