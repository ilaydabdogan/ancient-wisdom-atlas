canonical_text:
  quote: ''
  summary: Janamejaya asks what the Pandavas and Krishna said when Bhishma was installed
    as commander of the Kuru army. Vaisampayana recounts that Yudhishthira summoned
    his brothers and Vasudeva, ordered precautions, and selected seven leaders for
    seven divisions. Dhrishtadyumna, said to have sprung from blazing sacrificial
    fire for Drona's destruction, was placed over the troops, Arjuna over the leaders,
    and Janardana as Arjuna's guide and charioteer. Rama/Halayudha then came to the
    Pandava camp, was honored, declared the coming slaughter inevitable by fate, explained
    his divided loyalty between Bhima and Duryodhana as his mace disciples, and departed
    for the sacred waters of the Saraswati for ablutions rather than witness the Kauravas'
    destruction.
  language: English
  quote_policy: summarized
