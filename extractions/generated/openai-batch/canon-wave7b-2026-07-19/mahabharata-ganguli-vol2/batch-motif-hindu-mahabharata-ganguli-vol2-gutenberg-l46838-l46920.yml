  quote: ''
  summary: Sanjaya narrates a battlefield episode in which Arjuna creates water and
    an arrow-built hall while holding off the hostile army. Krishna unyokes the wounded
    horses, tends them, gives them water, and re-yokes them. Arjuna and Krishna then
    resume their swift advance toward Jayadratha as Kuru warriors despair, Duryodhana
    follows, and the setting sun and battlefield dust mark the urgency of the pursuit.
  language: English
