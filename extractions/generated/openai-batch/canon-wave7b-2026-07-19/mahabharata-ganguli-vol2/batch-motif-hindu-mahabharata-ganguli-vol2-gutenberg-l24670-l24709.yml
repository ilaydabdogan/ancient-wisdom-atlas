canonical_text:
  quote: ''
  summary: Sanjaya reports that Yudhishthira is grieved by the vast Dhartarashtra
    army and Bhishma's impenetrable array. Yudhishthira asks Arjuna how victory can
    be possible. Arjuna replies with a teaching that the few may defeat the many through
    truth, compassion, righteousness, exertion, and freedom from arrogance. He asserts
    that victory belongs where Krishna is, and recalls an old divine-Asura conflict
    in which Hari's grace enabled the gods headed by Sakra to obtain the three worlds.
  language: English
  quote_policy: summarized
