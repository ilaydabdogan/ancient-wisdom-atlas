canonical_text:
  quote: ''
  summary: Bhishma urges forgiveness and unity among the Kuru leaders in the face
    of Arjuna and other powerful adversaries, praises the rare union of Vedic and
    weapon knowledge in Drona and his son, and warns that disunion among commanders
    is disastrous. Aswatthaman accepts the justice of Bhishma's remarks, Duryodhana
    requests reconciliation with Drona, and Drona, pacified, orders measures to prevent
    Arjuna from reaching or capturing Duryodhana.
  language: English
  quote_policy: summarized
