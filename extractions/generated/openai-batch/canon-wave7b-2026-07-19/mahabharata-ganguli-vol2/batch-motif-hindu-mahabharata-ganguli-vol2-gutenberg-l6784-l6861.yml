canonical_text:
  quote: ''
  summary: Nahusha, king of the gods, is angry and lusts after Indra's queen. The
    gods urge him not to violate another's wife, but he cites Indra's past act against
    Ahalya and commands that the queen be brought to him. The gods and Gandharvas
    ask Vrihaspati to surrender Sachi, who has taken refuge in his house. Sachi weeps
    and refuses Nahusha. Vrihaspati vows not to abandon a protected supplicant, citing
    severe consequences for anyone who betrays one seeking refuge. He advises that
    Sachi ask Nahusha for time. The gods, led by Agni, tell Sachi to go, saying Nahusha
    will soon fall and Indra will regain sovereignty; she goes bashfully, and Nahusha
    is pleased.
  language: English
  quote_policy: summarized
