  quote: ''
  summary: Translator's footnotes 330-364 give textual variants, glosses of names
    and images, and editorial notes. The notes discuss Bengal and Bombay readings,
    identify several figures and terms, mention a disputed interpolation involving
    Sweta, explain Bhishma's killing of Sweta as a possible transgression, describe
    Vyasakutas as deliberate obscurities used to puzzle Ganesa the scribe, and gloss
    images such as Vishnu's discus, Indra's bow or rainbow, Gandharvanagara, and Meru
    with the Sun.
