canonical_text:
  quote: The heroic king Paurava also, O Srinjaya, we hear, fell a prey to death.
  summary: Narada tells Srinjaya that the heroic king Paurava died despite his vast
    sacrificial generosity. Paurava is described as performing a Horse-sacrifice and
    many other auspicious sacrifices, giving immense numbers of animals, vehicles,
    people, goods, gems, food, and other gifts to Brahmanas and others. Narada concludes
    that Srinjaya should not grieve for his son, since even a king superior in virtues
    and sacrifice died.
  language: English
  quote_policy: quoted
