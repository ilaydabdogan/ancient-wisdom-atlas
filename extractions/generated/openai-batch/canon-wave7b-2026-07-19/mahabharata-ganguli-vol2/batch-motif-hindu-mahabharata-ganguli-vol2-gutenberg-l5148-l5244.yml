canonical_text:
  quote: ''
  summary: Virata returns to his city after recovering cattle and defeating the Trigartas,
    learns that his son Uttara has gone with Vrihannala as charioteer against the
    Kuru warriors, sends forces in anxiety, and is reassured by Yudhishthira/Kanka.
    Messengers then report the cattle recovered, the Kurus defeated, and Uttara safe.
    Virata orders a public celebration and then asks for dice; Kanka warns against
    gambling by recalling Yudhishthira's earlier loss at dice, but the game begins.
  language: English
  quote_policy: summarized
