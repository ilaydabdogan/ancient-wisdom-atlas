canonical_text:
  quote: Without a leader, an army cannot stay in battle for even a short while.
  summary: Sanjaya reports a council after Bhishma's fall from command. Duryodhana
    asks Karna to identify a suitable commander, warning that a leaderless army is
    like an unguided boat or driverless car. Karna argues that only one leader should
    be chosen, recommends Drona because he is the preceptor and foremost wielder of
    weapons, and compares the appointment to the celestials making Kartikeya their
    leader against the Asuras.
  language: English
  quote_policy: quoted
