canonical_text:
  quote: ''
  summary: Sanjaya narrates Yudhishthira arranging the Pandava army against Bhishma's
    divisions and exhorting his troops to fight fairly for heaven. The passage lists
    the placement of Sikhandin, Arjuna, Dhristadyumna, Bhima, Yuyudhana, Yudhishthira,
    and others, describes royal and ritual honors around Yudhishthira, depicts Arjuna's
    radiant ape-bannered chariot driven by Kesava, presents Bhima as a terrifying
    vanguard protector, and closes with Janardana pointing out Bhishma to Arjuna and
    urging battle.
