    are matched against their own kinds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Dhrishtadyumna mixes his steeds with Drona's steeds; the mixed teams are described
    as swift, white as pigeons and red as blood, and like clouds charged with lightning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Dhrishtadyumna casts off his bow, takes up sword and shield, seizes the shaft
    of Drona's car, enters it, and moves on the yoke, joints, and behind the steeds
    so that Drona cannot find an opportunity to strike.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Drona cuts off Dhrishtadyumna's shield, sword, steeds, standard, umbrella,
