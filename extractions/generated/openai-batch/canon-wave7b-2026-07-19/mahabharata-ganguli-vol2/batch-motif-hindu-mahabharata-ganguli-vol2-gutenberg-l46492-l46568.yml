canonical_text:
  quote: ''
  summary: Sanjaya narrates a fierce battle between Pandava and Kaurava forces. Named
    warriors rush against one another, the battlefield becomes filled with severed
    bodies, weapons, armor, animals, and scavengers, and Dhrishtadyumna attempts a
    close assault on Drona by entering his chariot. Drona destroys Dhrishtadyumna's
    equipment and shoots a fatal arrow, but Satyaki cuts it off and rescues Dhrishtadyumna,
    after which Panchala car-warriors withdraw him from battle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sanjaya describes the Pandavas rushing against Kauravas divided into three
    bodies, with Bhimasena against Jalasandha, Yudhishthira against Kritavarman, and
    Dhrishtadyumna against Drona.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Drona and the prince of the Panchalas cut off heads by thousands and scatter
    them on the battlefield, which is compared to a forest of lotuses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The battlefield is strewn with robes, ornaments, weapons, standards, coats
    of mail, swords, shields, bows, heads, and armor.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Vultures, Kankas, jackals, and other carnivorous animals eat flesh, drink
