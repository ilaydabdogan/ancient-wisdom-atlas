canonical_text:
  quote: ''
  summary: Sanjaya reports that, after speaking to Aswatthaman, the king's son addresses
    Sakuni, son of Suvala, ordering him to attack Dhananjaya with large chariot and
    infantry forces. The speaker commands him to slay Bhima, the twins, and Yudhishthira,
    noting that they have already been wounded by Drona's son, and compares the desired
    slaughter to divine figures slaying Asuras. Sakuni then moves quickly against
    the Pandavas, to the speaker's delight.
  language: English
  quote_policy: summarized
