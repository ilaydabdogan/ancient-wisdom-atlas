canonical_text:
  quote: ''
  summary: 'Duryodhana asks Bhishma why he will not slay Sikhandin despite a former
    martial pledge. Bhishma begins an explanatory history: after Santanu''s death
    he installed Chitrangada and then Vichitravirya as Kuru kings; seeking wives for
    Vichitravirya, he went to Kasi, took the three princesses Amva, Amvika, and Amvalika
    by force from a gathering of kings, defeated the pursuing rulers, returned to
    Hastinapura, and gave the maidens to Satyavati for his brothers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Duryodhana asks why Bhishma will not slay Sikhandin when Sikhandin approaches
    as an armed foe, and recalls Bhishma's earlier statement that he would slay the
    Panchalas with the Somakas.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma tells Duryodhana and the assembled lords that he will narrate the
    history explaining why he will not slay Sikhandin in battle.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bhishma says that after Santanu's death he installed Chitrangada on the Kuru
    throne, and after Chitrangada's death installed Vichitravirya as king in obedience
    to Satyavati's counsel.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bhishma sought suitable daughters for Vichitravirya's marriage and heard that
    the three daughters of the ruler of Kasi, Amva, Amvika, and Amvalika, would select
    husbands at an assembly of kings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bhishma went on a single car to the city of Kasi and saw the three ornamented
    maidens and the invited kings gathered there.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Bhishma challenged the assembled kings, took the three maidens onto his car,
    and publicly announced that he was carrying them away by force while inviting
    the kings to attempt a rescue.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The kings responded by unsheathing weapons, readying chariots, and advancing
    with car-warriors, elephants, and horses.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The kings surrounded Bhishma; he stopped their onrush with arrows, cut down
