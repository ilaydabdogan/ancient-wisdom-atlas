canonical_text:
  quote: ''
  summary: Bhimasena, joyful after the feat of a Rakshasa prince, takes up another
    mace and enters a dreadful battle with a Rakshasa. Their mace blows shake the
    earth; after discarding the maces they fight with fists and then with chariot
    parts and whatever objects are at hand. Both become blood-covered and are compared
    to enraged giant elephants. Hrishikesa, favoring the Pandavas, sees the combat
    and sends Hidimva's son to protect Bhimasena.
  language: English
