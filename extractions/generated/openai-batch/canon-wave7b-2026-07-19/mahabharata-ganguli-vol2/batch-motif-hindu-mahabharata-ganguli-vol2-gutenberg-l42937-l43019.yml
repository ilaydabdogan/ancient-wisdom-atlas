canonical_text:
  quote: ''
  summary: Narada reports that Death, personified as a helpless lady created by Brahma,
    refuses the office of killing creatures because she fears unrighteousness and
    the grief of survivors. Brahma commands her to destroy creatures, but she remains
    reluctant and departs to Dhenuka. She performs immense austerities and pilgrimages
    to sacred waters and mountains. When Brahma again addresses her, she asks for
    protection from sin. Brahma declares that killing creatures will not stain her,
    appoints Yama and diseases as her helpers, and promises divine boons. Death then
    asks that passions such as covetousness, wrath, malice, jealousy, quarrel, folly,
    and shamelessness tear the bodies of embodied creatures.
  language: English
  quote_policy: summarized
