  evidence_refs:
  - ev:1
- id: obs:2
  text: Narayana is described as older than the oldest, as creator of the universe,
    and as taking birth as the son of Dharma for a purpose.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Narayana practices austerities on the mountain Himavat, standing with arms
    upraised and subsisting on air for sixty-six thousand years, followed by further
    austerities for twice that period.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Narayana's austerities are said to fill the space between earth and heaven
    with his energy.
  category: action
  evidence_refs:
