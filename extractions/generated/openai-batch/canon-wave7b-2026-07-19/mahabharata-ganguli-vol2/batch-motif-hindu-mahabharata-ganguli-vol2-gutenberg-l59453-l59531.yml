- id: obs:5
  text: After austerities, Narayana beholds Rudra, who is described as supreme, difficult
    to gaze at, minute and vast, and the first cause of mobile and immobile things.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rudra is described with weapons and attributes including a celestial bow,
    quivers, golden armour, Pinaka, thunderbolt, blazing trident, battle axe, mace,
    sword, short club, moon on his forehead, tiger-skin, bludgeon, and snakes for
    his sacred thread.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Rudra is surrounded by diverse creatures of the universe and by numerous ghosts
    and spirits.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Rudra is identified with Water, Heaven, Sky, Earth, Sun, Moon, Wind, Fire,
    and the measure of the universe's duration.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that persons of wicked behaviour cannot see Rudra, while
    righteous Brahmanas cleansed of sins can behold him with the mind's eye.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Narayana worships, salutes, and praises Rudra, who is described as sporting
    with Parvati and surrounded by bands of ghosts and spirits.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In Narayana's praise, Prajapatis, gods, Asuras, Nagas, Rakshasas, Pisachas,
    humans, birds, Gandharvas, Yakshas, other creatures, and the whole universe are
    said to have sprung from Rudra.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Narayana says that offerings made to Indra, Yama, Varuna, Kuvera, the Pitris,
    Tvashtri, and Soma are really offered to Rudra.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Narayana says that form and light, sound and sky, wind and touch, taste and
    water, scent and earth, time, Brahma, the Vedas, Brahmanas, and mobile objects
