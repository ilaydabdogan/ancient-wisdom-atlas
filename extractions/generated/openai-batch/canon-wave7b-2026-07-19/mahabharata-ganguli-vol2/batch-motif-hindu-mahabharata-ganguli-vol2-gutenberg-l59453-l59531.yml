canonical_text:
  quote: ''
  summary: Vyasa explains that Narayana, born as the son of Dharma, performs immense
    austerities on Himavat and thereby obtains a vision of Rudra. Rudra is described
    with ascetic marks, weapons, cosmic identities, and a retinue of beings. Narayana
    worships and praises him as the source of gods, beings, elements, time, worlds,
    and sacred knowledge, using images of separated drops returning to one water at
    universal dissolution and esoteric images of birds, trees, guardians, and senses.
    Narayana asks for grace, protection from evil thoughts, and desired boons.
  language: English
  quote_policy: summarized
