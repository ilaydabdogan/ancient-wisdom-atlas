canonical_text:
  quote: ''
  summary: Sanjaya reports that near dawn the battle between Kurus and Pandavas resumes.
    Aruna, charioteer of Surya, appears as the sky reddens. Warriors from both hosts
    dismount, face the sun with joined hands, and recite dawn prayers. The Kuru army
    divides; Drona, with Duryodhana before him, advances against the Somakas, Pandavas,
    and Panchalas. Madhava/Krishna gives Arjuna a tactical instruction, which Arjuna
    follows. Bhimasena then exhorts Arjuna to fulfill Kshatriya martial duty and pay
    his debt to Truth, Prosperity, Virtue, and Fame by piercing the enemy division.
  language: English
  quote_policy: summarized
