canonical_text:
  quote: ''
  summary: Krishna prepares for and rides in a splendid procession to the Kuru court,
    accompanied by attendants, warriors, kings, music, soldiers, elephants, and public
    spectators. At the court, the assembled rulers honor him and rise for him. Krishna
    then sees Rishis with Narada in the firmament and instructs Bhishma to seat and
    worship them before the assembly sits; the Rishis receive seats and Arghyas, after
    which Krishna and the kings take their places.
  language: English
  quote_policy: summarized
