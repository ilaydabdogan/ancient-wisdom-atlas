  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: Krishna instructs Sanjaya to salute elders, inquire after younger persons,
    and tell Dhritarashtra, Bhishma, and Drona to perform sacrifices, give presents
    to Brahmanas, rejoice with family, and give wealth, because great danger threatens
    and Yudhishthira is eager for victory.
  category: speech
  evidence_refs:
