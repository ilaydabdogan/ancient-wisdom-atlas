  text: Arjuna points Sanjaya to a golden footstool; Sanjaya touches it and sits on
    the ground, then sees auspicious marks of two longitudinal lines on the soles
    when feet are withdrawn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sanjaya describes the two youthful heroes as dark-complexioned, tall, erect
