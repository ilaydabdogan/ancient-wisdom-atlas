canonical_text:
  quote: ''
  summary: 'Dhritarashtra asks Sanjaya to report what Krishna and Arjuna said. Sanjaya
    describes entering a restricted inner apartment where Krishna and Arjuna sit adorned
    on a jeweled golden dais with Draupadi and Satyabhama present. He observes intimate
    foot placements, a golden footstool, auspicious marks on soles, and compares the
    two heroes to Indra and Vishnu seated together. After hospitality, Sanjaya delivers
    Dhritarashtra''s message. Krishna, urged by Arjuna, sends a warning: the Kauravas
    should perform sacrifices and gifts because danger is near and Yudhishthira seeks
    victory. Krishna declares Arjuna, armed with Gandiva and aided by Krishna, impossible
    to defeat, citing Arjuna''s rout of many warriors at Virata.'
  language: English
  quote_policy: summarized
