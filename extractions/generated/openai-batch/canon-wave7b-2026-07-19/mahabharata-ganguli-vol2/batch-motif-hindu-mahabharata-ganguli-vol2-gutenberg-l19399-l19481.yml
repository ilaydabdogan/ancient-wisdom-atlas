canonical_text:
  quote: ''
  summary: Rukmi, son of Bhishmaka, comes to the Pandava camp with a great army and
    the celestial bow Vijaya. The passage recounts the lineage of several celestial
    bows, Rukmi's earlier pursuit of Krishna after the ravishment of Rukmini, his
    defeat and foundation of Bhojakata, his boastful offer of aid to Arjuna, Arjuna's
    refusal, and Rukmi's later rejection by Duryodhana.
  language: English
  quote_policy: summarized
