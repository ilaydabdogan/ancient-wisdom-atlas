canonical_text:
  quote: Let the avabhritha of this hostility be now accomplished.
  summary: In Section CI, Vasudeva/Krishna urges Arjuna to attack Duryodhana, recalling
    Duryodhana's martial strength and wrongs against the Pandavas. Arjuna agrees and
    vows revenge for Draupadi's humiliation. Krishna and Arjuna advance toward Duryodhana,
    who resists, challenges them, and calls for Arjuna to use all weapons against
    him. The surrounding warriors react with fear, grief, shouting, and the sounding
    of conchs.
  language: English
