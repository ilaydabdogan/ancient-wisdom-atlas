canonical_text:
  quote: ''
  summary: 'A warrior addressing Krishna describes the coming war as a sacrifice:
    weapons, arrows, warriors, priests, victims, ritual payments, Soma-drinking, suspension,
    conclusion, and final bath are mapped onto battle events. He repents earlier hostile
    speech toward the sons of Pandu, predicts his own death by Arjuna, foresees other
    deaths and lamentations, asks that the Kshatriyas die by weapons at sacred Kurukshetra
    and attain heaven, and requests Krishna to bring Arjuna to him while keeping their
    discourse secret.'
  language: English
  quote_policy: summarized
