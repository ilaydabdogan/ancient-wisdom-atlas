canonical_text:
  quote: ''
  summary: Bhishma turns from classifying the Kaurava warriors to classifying the
    Pandava warriors. He praises the sons of Pandu as superhuman fighters, singles
    out Bhimasena and the sons of Madri, recalls the injuries to Draupadi and the
    dice defeat as causes of battle fury, and gives an extended description of Dhananjaya/Gudakesha/Partha
    as a peerless car-warrior aided by Narayana and driven by Vasudeva. Vaisampayana
    reports that the listening kings are frightened by Bhishma’s words.
  language: English
  quote_policy: summarized
