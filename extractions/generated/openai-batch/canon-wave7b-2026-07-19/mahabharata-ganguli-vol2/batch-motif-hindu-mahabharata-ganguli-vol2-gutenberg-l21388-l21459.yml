canonical_text:
  quote: ''
  summary: Bhishma recounts how Rama accepted his challenge and went to Kurukshetra
    for combat. Bhishma made preparations with rites, blessings, a chariot, white
    battle gear, and a conch. Celestial and ascetic spectators gathered. Ganga, Bhishma’s
    divine mother, appeared and urged him not to fight Rama, then asked Rama not to
    fight his disciple. Rama refused unless Bhishma desisted; Bhishma refused Ganga’s
    command, and Rama appeared and challenged him.
  language: English
  quote_policy: summarized
