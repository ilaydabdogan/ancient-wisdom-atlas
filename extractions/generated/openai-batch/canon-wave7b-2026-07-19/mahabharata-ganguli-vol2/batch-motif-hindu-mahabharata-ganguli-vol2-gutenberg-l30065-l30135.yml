canonical_text:
  quote: ''
  summary: Sanjaya narrates a dawn battle in which the Kaurava army forms a Makara-shaped
    array under Bhishma, while the Pandavas form a Syena array with named warriors
    positioned as its body parts. Bhima breaches the Makara array, Arjuna counters
    Bhishma, Duryodhana urges Drona to destroy the Pandavas, and several warriors
    intervene. Bhishma avoids Sikhandin because of remembered femininity, Drona is
    compared to end-of-age fire, and the battle is likened to an ancient conflict
    between gods and Danavas.
  language: English
  quote_policy: summarized
