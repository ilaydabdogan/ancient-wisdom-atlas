canonical_text:
  quote: ''
  summary: In a night battle, Karna uses the divine dart he had long kept for Pandu's
    son against Ghatotkacha. The dart, given by Sakra in exchange for Karna's earrings,
    destroys Ghatotkacha's illusion, pierces him, and ascends to the stars. As he
    dies, Ghatotkacha assumes an immense form and falls on the Kuru army, killing
    many troops for the benefit of the Pandavas. The Kauravas rejoice and honor Karna,
    with an explicit comparison to Sakra after the slaughter of Vritra.
  language: English
  quote_policy: summarized
