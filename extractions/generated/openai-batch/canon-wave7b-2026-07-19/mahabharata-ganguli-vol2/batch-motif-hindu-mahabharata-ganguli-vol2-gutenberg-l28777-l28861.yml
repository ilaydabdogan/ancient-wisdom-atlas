  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Bhishma shoots blazing-pointed shafts likened to poisonous snakes and strikes
    Pandava car-warriors after naming them beforehand.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Bhishma’s speed and movements make him appear everywhere, like a circle of
