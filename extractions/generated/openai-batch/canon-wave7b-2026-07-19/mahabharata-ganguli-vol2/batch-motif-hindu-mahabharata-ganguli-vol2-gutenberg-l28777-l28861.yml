canonical_text:
  quote: ''
  summary: Sanjaya narrates a fierce battle after a Pandava victory. Devavrata/Bhishma
    charges the Pandava army, the field fills with corpses and a blood-river image,
    and Bhishma’s rapid assault with serpent-like arrows makes him appear fiery, ubiquitous,
    and multiplied. Yudhishthira’s host is routed, kin strike kin in confusion, and
    Vasudeva stops the chariot he guides to address Partha as the passage breaks off.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the forenoon and the sun’s westward movement, the Pandavas are said
    to have won victory, and Devavrata rushes toward their army in a chariot drawn
    by swift steeds and protected by a large force and the addressee’s sons.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dreadful battle begins between Sanjaya’s side and the Pandavas, accompanied
    by bow-sounds, bowstrings, and shouted battlefield commands and challenges.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The battlefield is described with fallen armor, crowns, diadems, standards,
    heads, and ornamented arms; some headless combatants still stand holding weapons
    or drawn bows.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: A river of blood flows through the battlefield, mixed with flesh and blood,
    using dead elephant bodies as rocks, and is said to run toward an ocean representing
