canonical_text:
  quote: ''
  summary: Princess Uttara, sent by her brother, goes to the dancing hall and asks
    Vrihannala, identified in the narration as Arjuna/Partha, to serve as charioteer
    for prince Uttara because the Kurus are driving away the cattle and the prince
    lacks a charioteer. Vrihannala feigns lack of chariot skill and comically mishandles
    armor, though the narrator states he knows everything. The prince equips him,
    mounts the chariot under a lion-banner, and departs with Vrihannala as charioteer.
    Maidens request fine cloths from the defeated Kurus, and elders, women, maidens,
    and Brahmanas bless the departing car by invoking Arjuna’s former Khandava victory.
  language: English
  quote_policy: summarized
