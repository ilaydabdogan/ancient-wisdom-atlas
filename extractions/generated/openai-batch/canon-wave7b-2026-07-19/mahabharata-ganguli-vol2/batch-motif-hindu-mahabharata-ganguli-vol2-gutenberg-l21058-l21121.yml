canonical_text:
  quote: ''
  summary: Hotravahana directs Amva to seek Jamadagni's son Rama, an ascetic warrior
    dwelling on Mount Mahendra. Akritavrana, Rama's companion, arrives and is received
    with hospitality. Hotravahana recounts how Bhishma abducted Amva and her sisters
    from the Kasi swayamvara, brought them to Hastinapura for Vichitravirya, released
    Amva when she declared she had chosen Salwa, and how Salwa then rejected her.
    Amva says she cannot return home because of shame and will accept Rama's instruction
    as her duty.
  language: English
  quote_policy: summarized
