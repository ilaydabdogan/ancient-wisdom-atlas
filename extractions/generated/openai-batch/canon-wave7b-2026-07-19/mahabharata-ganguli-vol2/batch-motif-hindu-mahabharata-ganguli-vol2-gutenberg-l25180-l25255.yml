  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker contrasts a person who outwardly restrains the senses while mentally
    cherishing sense objects with a person who restrains the senses by the mind and
    works without attachment.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker tells Arjuna to perform action, saying that action is better than
    inaction and that bodily support cannot be accomplished without work.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
