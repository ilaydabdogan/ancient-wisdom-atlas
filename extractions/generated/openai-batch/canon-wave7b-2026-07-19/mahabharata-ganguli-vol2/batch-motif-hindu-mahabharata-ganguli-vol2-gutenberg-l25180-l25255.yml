canonical_text:
  quote: ''
  summary: The Holy One teaches Arjuna that devotion has paths of knowledge and work,
    that inaction or renunciation alone does not bring emancipation, and that action
    should be performed without attachment. He presents sacrifice as a reciprocal
    order linking humans, gods, food, work, Vedas, and the Supreme Being. He says
    exemplary action preserves the worlds and social order, instructs Arjuna to devote
    all work to him and engage in battle, and concludes that one's own duty is preferable
    to another's. Arjuna then asks what impels unwilling sin.
  language: English
  quote_policy: summarized
