  evidence_refs:
  - ev:1
- id: obs:2
  text: Sanjaya says Yudhishthira is cheerful about battle, Bhimasena and Arjuna are
    also cheerful, and the twins are fearless.
  category: speech
  evidence_refs:
  - ev:2
