  summary: Duryodhana questions Sanjaya about the Pandavas' preparations for war.
    Sanjaya reports their confidence, Arjuna's testing of mantras with his celestial
    car, Arjuna's favorable signs of victory, and a detailed description of Arjuna's
    divine banner and the celestial steeds assigned to Arjuna and other Pandava warriors.
  language: English
