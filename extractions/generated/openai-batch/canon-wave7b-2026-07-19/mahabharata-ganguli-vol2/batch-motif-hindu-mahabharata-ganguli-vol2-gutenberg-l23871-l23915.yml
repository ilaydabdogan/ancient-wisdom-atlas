canonical_text:
  quote: ''
  summary: 'Sanjaya describes the island called Saka: its mountains, seven Varshas,
    a central Saka tree adored by the people, sacred provinces where Siva is worshipped,
    long-lived virtuous inhabitants, many sacred rivers including currents of Ganga,
    four named provinces associated with the four social orders, and a society without
    king or punishment in which people follow duty and protect one another.'
  language: English
  quote_policy: summarized
