canonical_text:
  quote: ''
  summary: 'Vidura counsels Dhritarashtra with two exempla: two netted birds escape
    only while united but are captured after quarreling, and hunters perish while
    seeking serpent-guarded, life-giving honey on Gandhamadana. Vidura applies these
    examples to kinship discord, Duryodhana''s ambition, Arjuna''s prowess, and the
    need for reconciliation with Yudhishthira.'
  language: English
  quote_policy: summarized
