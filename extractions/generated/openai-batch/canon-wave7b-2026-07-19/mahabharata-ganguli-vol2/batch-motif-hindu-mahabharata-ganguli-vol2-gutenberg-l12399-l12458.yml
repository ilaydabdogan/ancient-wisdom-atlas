candidate_motifs:
- id: motif:1
  label: Unity lifts the snare, quarrel restores captivity
  taxonomy_refs:
  - wisdom
  basis: The birds escape upward together while united with the net, but after quarreling
    they fall and are captured; the fable is presented as counsel.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The taxonomy reference is broad; the passage supplies a didactic fable
    rather than a named motif family.
- id: motif:2
  label: Kinship concord prevents enemy triumph
  taxonomy_refs:
  - wisdom
  basis: Vidura explicitly states that kinsmen who quarrel over wealth fall into enemy
    hands and that kin should eat and talk together rather than contend.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is an ethical-political motif within the passage; no external parallel
    is asserted.
- id: motif:3
  label: Serpent-guarded life-giving substance on a mountain
  taxonomy_refs:
  - mystical_quest
  - serpent
  basis: The honey on Gandhamadana is inaccessible, guarded by poisonous snakes, linked
    to Kuvera, and said to grant immortality, sight, and youth; seekers perish while
    trying to obtain it.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage names honey rather than a generic elixir; the quest is fatal
    for the hunters and is used as a warning.
- id: motif:4
  label: Blind ambition sees the prize but not the fall
  taxonomy_refs:
  - wisdom
  basis: Vidura applies the honey episode to Duryodhana, saying he desires the whole
    earth without a rival and beholds the honey but not the terrible fall.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The motif is inferred from Vidura's explicit analogy, not from an independent
    mythic episode.
- id: motif:5
  label: Martial wrath as destructive fire
  taxonomy_refs: []
  basis: Vidura compares angry Drupada, the king of Matsyas, and Dhananjaya to wind-driven
    flames that will leave no remnant of the army.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage uses a simile of fire in a war warning; it does not describe
    a cosmic or world-destroying fire.
