canonical_text:
  quote: ''
  summary: Sanjaya reports Vasudeva's rebuke of Arjuna for making a rash vow to kill
    Jayadratha without consulting him. Intelligence from the Kaurava camp shows that
    Jayadratha and the Kauravas are frightened by the vow. Jayadratha asks Suyodhana
    either to protect him or to let him return home, citing Arjuna's power, Vasudeva's
    alliance, and earlier heroic exploits. Suyodhana seeks Drona's help, and a protective
    battle arrangement is planned with six major warriors in front and Jayadratha
    guarded within a complex formation.
  language: English
  quote_policy: summarized
