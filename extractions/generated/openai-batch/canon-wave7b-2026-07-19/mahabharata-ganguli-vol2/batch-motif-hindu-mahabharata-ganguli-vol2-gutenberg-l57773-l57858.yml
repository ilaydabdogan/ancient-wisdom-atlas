canonical_text:
  quote: ''
  summary: Sanjaya narrates Drona's devastating attack on the Panchalas and allied
    forces. Kesava advises that Drona cannot be defeated by force but can be slain
    if he lays aside his weapons, and proposes reporting the death of Aswatthaman.
    Bhima kills an elephant named Aswatthaman and announces the death, but Drona initially
    doubts that his son has died and continues fighting. Drona invokes the Brahma
    weapon and causes further slaughter. Sages arrive, wishing to take Drona to the
    region of Brahman, and admonish him to lay aside his weapons because his death-hour
    has come and his actions are unrighteous for a Brahmana.
  language: English
  quote_policy: summarized
