canonical_text:
  quote: ''
  summary: Kaurava warriors surround Arjuna and Krishna while protecting the ruler
    of the Sindhus as the sun reddens toward setting. Arjuna cuts down volleys of
    arrows and pierces the opposing warriors. Karna then resists Arjuna, Bhima, and
    Satwata, leading to an intense duel between Karna and Arjuna in which arrows fill
    the sky. Arjuna cuts Karna's bow and shoots a solar-bright shaft, but Aswatthaman
    cuts it down. Duryodhana orders Karna protected, and Arjuna kills Karna's four
    steeds.
  language: English
  quote_policy: summarized
