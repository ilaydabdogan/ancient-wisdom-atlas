  quote: ''
  summary: Sanjaya reports that Devavrata, moved to tears by Duryodhana's harsh words,
    reminds him that wise warnings had already been given. Devavrata declares that
    he and Drona will not survive the battle, predicts Bhima's deadly prowess, urges
    Duryodhana to fight with heaven as his goal, and says the Pandavas cannot be defeated
    even by the gods led by Vasava.
