canonical_text:
  quote: ''
  summary: Narada describes to Matali a region belonging to powerful birds descended
    from Garuda. These birds subsist on snakes, have noble lineage and prosperity,
    are favored and protected by Vishnu, and include many named chiefs. Narada then
    offers to take Matali elsewhere if none in this region is a suitable husband for
    Matali's daughter.
  language: English
  quote_policy: summarized
