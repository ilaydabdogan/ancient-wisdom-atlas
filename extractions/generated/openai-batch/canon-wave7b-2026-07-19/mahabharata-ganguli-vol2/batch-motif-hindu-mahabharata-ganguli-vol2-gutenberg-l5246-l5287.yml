canonical_text:
  quote: But the son of Pritha held it in his hands before it fell on the ground.
  summary: King Matsya rebukes Yudhishthira for praising Vrihannala over Uttara, strikes
    Yudhishthira with a dice, and causes his nose to bleed. Yudhishthira and Draupadi
    prevent the blood from falling to the ground. When Uttara arrives with Vrihannala,
    Yudhishthira instructs the warder to admit Uttara alone, explaining that Vrihannala
    has vowed to kill anyone who wounds him or sheds his blood outside battle.
  language: English
