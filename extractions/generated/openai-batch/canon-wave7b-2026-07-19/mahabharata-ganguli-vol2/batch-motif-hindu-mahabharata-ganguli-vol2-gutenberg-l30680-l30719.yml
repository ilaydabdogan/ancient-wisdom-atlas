canonical_text:
  quote: ''
  summary: Sanjaya tells the king that the present calamity is the fruit of the king's
    own sinful acts, including the dice match and the battle with the Pandavas. He
    then narrates Bhima breaking into the Kaurava array, being surrounded by Duryodhana's
    brothers and other warriors, remaining fearless like Surya or Indra in mythic
    comparisons, killing many opponents, and finally leaving his car to fight with
    a mace against the mass of Dhartarashtra troops.
  language: English
  quote_policy: summarized
