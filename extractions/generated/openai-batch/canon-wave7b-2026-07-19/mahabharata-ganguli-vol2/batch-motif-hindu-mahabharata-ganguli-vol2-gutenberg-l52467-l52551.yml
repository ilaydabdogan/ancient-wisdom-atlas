canonical_text:
  quote: ''
  summary: Sanjaya reports to Dhritarashtra what followed the slaying of the ruler
    of the Sindhus by Arjuna. Kripa and Aswatthaman attack Arjuna with arrows; Arjuna
    counters them without wishing to kill them, but Kripa is wounded, swoons, and
    is carried away. Arjuna laments striking Kripa, his preceptor, recalls Vidura's
    earlier warning about Suyodhana, and says that striking one's teacher after receiving
    knowledge leads to hell. Karna then advances, Satyaki and the Panchala princes
    move against him, and Krishna advises Arjuna not to fight Karna yet because Karna
    possesses a blazing dart from Vasava kept for Arjuna.
  language: English
  quote_policy: summarized
