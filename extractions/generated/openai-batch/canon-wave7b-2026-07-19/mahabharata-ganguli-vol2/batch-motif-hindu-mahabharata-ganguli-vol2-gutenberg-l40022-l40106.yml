canonical_text:
  quote: ''
  summary: 'Sanjaya narrates a fierce battlefield sequence: Dhrishtadyumna advances
    against Drona, Durmukha intervenes, Drona ravages Yudhishthira’s host, and the
    larger battle becomes confused and indiscriminate. Elephants, chariots, steeds,
    drivers, and warriors are destroyed in a bloody field described through images
    of clouds, fire, hills, mire, and a sea of troops.'
  language: English
  quote_policy: summarized
