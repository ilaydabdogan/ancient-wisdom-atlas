canonical_text:
  quote: ''
  summary: The passage presents ethical counsel praising self-restraint, ritual observance,
    social prudence, frugality, generosity, secrecy in counsel, non-injury, truthfulness,
    and purity. It then recalls that King Pandu, consumed by a Brahmana's curse, had
    five sons born in the woods like five Indras, and tells the son of Ambika to return
    their just share of the kingdom so that he may be happy with his sons and inspire
    confidence among gods and men.
  language: English
  quote_policy: summarized
