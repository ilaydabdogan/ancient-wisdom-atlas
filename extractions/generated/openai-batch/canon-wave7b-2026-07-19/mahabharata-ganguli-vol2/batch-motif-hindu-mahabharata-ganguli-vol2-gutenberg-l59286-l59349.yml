  quote: ''
  summary: A battle passage describes Bhima and Aswatthaman exchanging dense showers
    of arrows. Aswatthaman disables Bhima’s charioteer, causing Bhima’s horses to
    carry him away and prompting fear among the Panchalas. Arjuna and Govinda rally
    the troops; Arjuna confronts Aswatthaman with harsh words. Dhritarashtra asks
    Sanjaya why Arjuna would address Aswatthaman so, given their mutual affection.
  language: English
