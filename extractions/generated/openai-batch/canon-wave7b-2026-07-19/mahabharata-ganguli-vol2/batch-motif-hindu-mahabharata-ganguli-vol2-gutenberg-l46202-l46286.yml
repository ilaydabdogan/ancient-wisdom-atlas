canonical_text:
  quote: ''
  summary: Drona ritually fastens a mantra-protected golden armour on Duryodhana and
    invokes blessings from many divine and cosmic beings. He recounts that Vritra
    once defeated the gods, that the gods sought aid from Brahman and then Maheswara
    at Mandara, and that Maheswara gave Sakra an effulgent armour with mantras by
    which Sakra slew Vritra. Drona traces the armour-mantra knowledge through a lineage
    ending with himself.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Drona says he will tie Duryodhana's golden armour so that no weapon used by
    man can strike him, and says Krishna, Arjuna, and other weapon-bearers will not
    pierce it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Drona touches water, utters mantras, and ties bright armour on Duryodhana
    for victory in battle, causing amazement among those present.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Drona invokes blessings from Vedas, Brahman, Brahmanas, reptiles, royal sages,
    creatures with various numbers of legs, goddesses, sages, deities, directions,
    planets, the earth, the firmament, quarter-elephants, and Sesha.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Drona recounts that the Asura Vritra defeated the celestials, whose bodies
    were mangled, and that the frightened gods led by Indra sought Brahman's protection.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Brahman says Vritra was created from Tvashtri's energy after long ascetic
    penance and through Maheswara's permission or grace, and tells the gods to go
    to Mandara to see Hara.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The gods go to Mandara, behold Maheswara with great splendour, and ask him
    to be their refuge against Vritra.
  category: action
  evidence_refs:
  - ev:6
