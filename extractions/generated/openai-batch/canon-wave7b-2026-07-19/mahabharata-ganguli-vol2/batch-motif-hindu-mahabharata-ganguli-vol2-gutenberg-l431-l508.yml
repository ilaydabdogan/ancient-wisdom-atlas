canonical_text:
  quote: ''
  summary: The Pandavas leave their forest life and proceed toward Matsya, intending
    to pass the thirteenth year undiscovered. Near Virata's city, Draupadi is carried
    by Arjuna because of fatigue. Yudhishthira warns that their weapons, especially
    Arjuna's Gandiva, may reveal them, so Arjuna proposes hiding the weapons in a
    Sami tree near a cemetery. The weapons are unstrung, tied in the tree, and guarded
    by a corpse-decoy with a false explanation to local shepherds and cowherds. Yudhishthira
    assigns alternate names, and the group enters the city.
  language: English
  quote_policy: summarized
