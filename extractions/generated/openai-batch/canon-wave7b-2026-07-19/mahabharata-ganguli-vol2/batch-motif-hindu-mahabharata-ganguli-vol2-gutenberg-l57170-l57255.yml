canonical_text:
  quote: ''
  summary: Sanjaya narrates that Duryodhana angrily reproaches Drona for sparing the
    weary Pandavas and praises Drona's celestial weapons. Drona answers that he is
    still exerting himself, vows to slay the Panchalas, and praises Arjuna's prior
    victories over divine and supernatural opponents. Duryodhana proposes that he,
    Duhsasana, Karna, and Sakuni will divide the host and slay Arjuna. Drona laughs,
    declares Arjuna nearly unwithstandable, rebukes Duryodhana and Sakuni, urges Duryodhana
    to fight Arjuna himself, and the battle begins.
  language: English
  quote_policy: summarized
