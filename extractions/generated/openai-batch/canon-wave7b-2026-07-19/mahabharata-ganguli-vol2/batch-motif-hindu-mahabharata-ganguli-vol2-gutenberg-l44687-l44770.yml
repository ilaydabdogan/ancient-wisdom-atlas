canonical_text:
  quote: ''
  summary: Kesava prepares Arjuna with ritual and auspicious objects, then meditates
    for Arjuna’s benefit while the Pandava camp remains sleepless over Arjuna’s vow
    to slay Jayadratha before sunset or enter fire. At midnight Krishna tells Daruka
    that he will ensure Arjuna’s success, declares Arjuna dearer than his own kin
    and half of himself, and orders his divine chariot, weapons, Garuda standard,
    horses, armor, and conch signal readied for battle.
  language: English
  quote_policy: summarized
