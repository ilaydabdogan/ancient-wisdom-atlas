canonical_text:
  quote: ''
  summary: Narada recounts that Galava, distressed after Viswamitra's address and
    unable to fulfill his preceptor's demand for eight hundred lunar-white steeds,
    laments poverty, debt, falsehood, and the possibility of death. He resolves to
    seek Vishnu/Krishna's protection. Garuda, son of Vinata and Galava's friend, appears
    and offers to carry him to the far shore of the ocean or the extremity of the
    earth, saying Vishnu has granted his wishes.
  language: English
  quote_policy: summarized
