canonical_text:
  quote: ''
  summary: Indra tells Sachi that Nahusha is too strong for direct opposition and
    instructs her to secretly request that Nahusha come to her in a palanquin borne
    by Rishis. Sachi makes the request with flattery, and Nahusha, boasting of his
    power, accepts. He employs ascetic saints as bearers. Sachi asks Vrihaspati to
    find Indra. Vrihaspati predicts Nahusha's fall, kindles sacrificial fire, and
    asks Fire to search for Indra. Fire assumes a feminine form, searches many realms,
    returns without finding Indra, and says only the waters remain, which Fire cannot
    enter because extinction awaits there.
  language: English
  quote_policy: summarized
