canonical_text:
  quote: ''
  summary: In a battlefield episode, Sweta, son of Virata, attacks Duryodhana's forces
    and repeatedly confronts Bhishma. Sweta cuts Bhishma's bow and palmyra standard,
    causing both armies to react. Duryodhana sends warriors to protect Bhishma. Bhishma
    disables Sweta's chariot by killing the horses, cutting the standard, and beheading
    the charioteer. Sweta dismounts, takes up a gold-decked dart described through
    death, serpent, meteor, and fire imagery, and hurls it at Bhishma, who cuts it
    apart with arrows.
