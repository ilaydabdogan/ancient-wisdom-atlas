canonical_text:
  quote: ''
  summary: Narada shows Matali Hiranyapura in Patala, a magnificent city of Daityas
    and Danavas filled with illusion, powerful demonic residents, jeweled mansions,
    fountains, and self-moving trees. Narada asks whether Matali can find an acceptable
    bridegroom there. Matali refuses to seek an alliance among the Danavas, calling
    them enemies of the gods despite kinship, and asks to go elsewhere.
  language: English
  quote_policy: summarized
