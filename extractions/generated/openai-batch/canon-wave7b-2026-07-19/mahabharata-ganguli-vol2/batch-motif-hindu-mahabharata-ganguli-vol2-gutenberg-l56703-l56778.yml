canonical_text:
  quote: ''
  summary: Arjuna asks Vasudeva how certain powerful kings and warriors were slain
    for the Pandavas' good. Vasudeva explains that Jarasandha, the ruler of the Chedis,
    Ekalavya, several Rakshasas, and Ghatotkacha were removed by special means because
    they were otherwise nearly invincible or hostile to righteousness. He describes
    Jarasandha's mace being countered, Ekalavya's thumb being taken by guile, the
    Chedi ruler's death, the killing of Rakshasas, and Karna's dart being spent on
    Ghatotkacha. He states his vow to slay destroyers of righteousness and promises
    means for the deaths of Karna and Suyodhana while Drona presses the battle.
  language: English
  quote_policy: summarized
