canonical_text:
  quote: "“Without doubt, the wielder of Gandiva hath sworn for my death!”"
  summary: Jayadratha, frightened by the Pandavas’ joyful uproar and by Arjuna’s vow,
    asks either to flee or be protected. Duryodhana reassures him with promises of
    surrounding warriors and troops. Jayadratha then consults Drona, who says Arjuna
    is superior through yoga and hard discipline but promises protection, teaches
    that death should not terrify a dutiful Kshatriya, and consoles Jayadratha into
    readiness for battle.
  language: English
  quote_policy: quoted
