canonical_text:
  quote: ''
  summary: Sanjaya narrates Arjuna's reply to Uluka, the messenger of Duryodhana.
    Arjuna rebukes Duryodhana for relying on Bhishma, announces the coming battle,
    and vows to bring Bhishma down. He recalls the rejected request for five villages
    and Vasudeva's rejected counsel. Bhimasena then orders Uluka to relay his vows
    to kill Dussasana, drink his blood, destroy Duryodhana's brothers, smash Duryodhana's
    thighs, and humiliate him before Yudhishthira. Nakula briefly says that Duryodhana's
    words have been heard and understood.
  language: English
  quote_policy: summarized
