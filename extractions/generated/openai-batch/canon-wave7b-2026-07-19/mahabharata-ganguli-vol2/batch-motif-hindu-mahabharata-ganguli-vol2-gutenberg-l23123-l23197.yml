canonical_text:
  quote: '"it is Time that destroyeth the universe. It is Time also that createth
    the worlds."'
  summary: A series of dire omens is reported before battle. Dhritarashtra accepts
    the coming slaughter as ordained and as a path to heroic afterlife for warriors.
    Vyasa, after yogic concentration, teaches that Time creates and destroys worlds,
    urges Dhritarashtra to restrain his kin, condemns kin-slaughter, and advises giving
    the Pandavas their kingdom while the Kauravas keep peace. Dhritarashtra then asks
    to hear signs of victory in battle.
  language: English
  quote_policy: quoted
