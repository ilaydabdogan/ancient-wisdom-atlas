canonical_text:
  quote: '"the high-souled Pandavas ... completed the promised period of non-discovery"'
  summary: Vaisampayana narrates that the Pandavas, living in disguise in King Virata's
    city, completed their period of non-discovery. After Susarman and the Trigartas
    seized Virata's cattle, a herdsman reported the raid. Virata mustered and armed
    the Matsya forces, ordered Satanika to provide chariots, armour, banners, and
    weapons to the disguised Pandavas, and marched with a large army following the
    cattle tracks.
  language: English
  quote_policy: quoted
