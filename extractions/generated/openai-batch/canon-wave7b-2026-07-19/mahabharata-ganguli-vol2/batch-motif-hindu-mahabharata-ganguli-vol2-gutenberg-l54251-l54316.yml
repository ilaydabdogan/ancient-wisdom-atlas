canonical_text:
  quote: ''
  summary: Sanjaya reports a fierce encounter between Arjuna and Karna. Arjuna wounds
    Karna, cuts his bow, kills his horses and driver, and Karna retreats onto Kripa's
    chariot. Duryodhana rallies his fleeing troops and advances toward Arjuna, but
    Kripa warns Ashwatthaman that the king is rushing into deadly danger. Ashwatthaman
    then tells Duryodhana to stand aside and promises to check Arjuna himself.
  language: English
  quote_policy: summarized
