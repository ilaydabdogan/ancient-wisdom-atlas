canonical_text:
  quote: Be thou, therefore, our leader.
  summary: Sanjaya reports that, after hearing Karna, Duryodhana addresses Drona in
    the midst of the troops. Duryodhana praises Drona’s birth, learning, prowess,
    self-control, austerities, gratitude, and virtues, then asks him to protect and
    lead the Kaurava army. He compares Drona’s proposed leadership to preeminent divine
    and cosmic figures, asks him to command eleven Akshauhinis and slay the foes,
    predicts Arjuna will not strike him and that Yudhishthira will be defeated, and
    the Kaurava kings and troops acclaim Drona before Drona replies.
  language: English
  quote_policy: quoted
