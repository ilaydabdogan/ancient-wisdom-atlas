canonical_text:
  quote: ''
  summary: Bhishma is overwhelmed by arrows in battle, falls from his chariot before
    sunset, and lies on a bed of arrows. Because the Sun is in the southern solstice,
    he refuses to let his life depart and vows to wait for the northern solstice,
    citing a boon that his death depends on his own will. Ganga sends Rishis in swanlike
    form to see him. The opposing armies react with grief, praise, fear, celebration,
    and reflection, while Bhishma remains quiet in yogic mental prayer awaiting his
    hour.
  language: English
  quote_policy: summarized
