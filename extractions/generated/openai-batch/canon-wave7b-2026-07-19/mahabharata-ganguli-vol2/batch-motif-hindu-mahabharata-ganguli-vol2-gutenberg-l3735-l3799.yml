canonical_text:
  quote: ''
  summary: Aswatthaman rebukes Karna for boasting before the cattle have been secured.
    He contrasts silent true power with boastfulness, outlines duties of social orders,
    condemns the dice-game seizure of Pandava wealth and Indraprastha, recalls Draupadi
    being dragged to court, and warns that Arjuna will come in wrath with the Gandiva.
    He refuses to fight Arjuna and says the proper fight is with the king of the Matsyas
    if he follows the cattle.
  language: English
  quote_policy: summarized
