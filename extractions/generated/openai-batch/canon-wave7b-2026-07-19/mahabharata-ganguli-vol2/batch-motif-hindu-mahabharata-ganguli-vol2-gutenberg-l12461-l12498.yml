canonical_text:
  quote: ''
  summary: Dhritarashtra warns Duryodhana that opposing the Pandavas is a mistaken
    course. He praises the strength and virtue of Yudhishthira, Bhima, Arjuna, Dhrishtadyumna,
    Satyaki, and Krishna, urges Duryodhana to heed elder counselors, cites Arjuna's
    earlier victory at Virata, and advises reconciliation through brotherhood and
    a share of the kingdom.
  language: English
