canonical_text:
  quote: ''
  summary: A first-person speaker instructs Sanjaya on righteous kingship, condemns
    Dhritarashtra and his sons for seizing the Pandavas' lawful share, recalls Draupadi's
    seizure and humiliation in the assembly after the dice game, proposes going to
    the Kurus to seek peace with words of wisdom, warns of destruction by Arjuna and
    Bhima if peace fails, and contrasts Duryodhana's party and Yudhishthira's party
    as trees of evil passions and righteousness.
  language: English
  quote_policy: summarized
