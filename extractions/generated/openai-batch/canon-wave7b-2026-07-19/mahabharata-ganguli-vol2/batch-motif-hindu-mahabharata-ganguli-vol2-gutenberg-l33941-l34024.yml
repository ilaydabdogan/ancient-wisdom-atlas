canonical_text:
  quote: ''
  summary: Krishna urges the reluctant Arjuna to fight Bhishma and fulfill his warrior
    vow. Arjuna and Bhishma engage in battle while Krishna drives the chariot. Seeing
    Arjuna fight mildly and Bhishma devastate Yudhishthira's army, Krishna angrily
    leaves the chariot and rushes toward Bhishma, intending to slay him despite his
    prior vow not to fight. Bhishma welcomes being struck by Krishna. Arjuna restrains
    Krishna and recommits himself to killing Bhishma.
