canonical_text:
  quote: ''
  summary: Sanjaya narrates a night battle in which Vasudeva directs Ghatotkacha to
    stop fighting Karna and instead slay Alayudha, who is attacking Bhima. Ghatotkacha
    and Alayudha exchange blows, illusions, weapons, trees, and mountain-summits.
    Ghatotkacha kills Alayudha, displays his severed head, and throws it before Duryodhana,
    causing anxiety among the Kuru side and celebration among the Pandavas.
  language: English
  quote_policy: summarized
