canonical_text:
  quote: ''
  summary: 'Narada recounts to Srinjaya the death and deeds of Rama, son of Dasaratha:
    his forest exile, the abduction of his wife by Ravana, his destruction of Rakshasas,
    his sacrifices and ideal reign, his restoration of rites, and his eventual going
    to heaven with his subjects. Narada uses Rama’s death as an argument against lamenting
    Srinjaya’s son.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Narada states that Rama, son of Dasaratha, fell prey to death and was loved
    by his subjects.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At his father’s command, Rama lived for fourteen years in the woods with his
    wife; he is identified as the elder brother of Lakshmana.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Rama slew fourteen thousand Rakshasas in Janasthana for the protection of
    ascetics.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ravana beguiled Rama and Lakshmana and abducted Rama’s wife, the princess
    of Videha.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Rama slew Ravana in battle, along with Ravana’s kinsmen and followers; the
    passage compares this to Mahadeva slaying Andhaka.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Rama protected his subjects and performed major sacrifices, including a hundred
    Horse-sacrifices and the Jaruthya sacrifice, with clarified-butter libations for
    Indra.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: During Rama’s rule, hunger, thirst, disease, calamities, and premature death
    are described as absent, and gods, Rishis, and men lived together on earth.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Rama’s realms are described as free from flies, gnats, beasts of prey, poisonous
    reptiles, unrighteousness, covetousness, and ignorance.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: When Rakshasas obstructed offerings to the Pitris and worship of the gods
    in Janasthana, Rama slew them and restored those rites.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Men are said to have had a thousand children and thousand-year lives; seniors
