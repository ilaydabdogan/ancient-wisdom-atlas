canonical_text:
  quote: ''
  summary: Baladeva urges a conciliatory settlement between the Pandavas and the Kuru
    side. He says the sons of Kunti are ready to give up half their kingdom, proposes
    that an envoy journey to Duryodhana and the Kuru elders, recounts Yudhishthira's
    loss of the kingdom in dice-play against Sakuni, and advises humble speech rather
    than war. Vaisampayana then reports that the son of the race of Sini rises indignantly
    to oppose Baladeva's words.
  language: English
  quote_policy: summarized
