canonical_text:
  quote: He is One, he is Many, he is hundred and thousand.
  summary: Vyasa describes Maheswara/Rudra/Siva being gratified after Brahma's words,
    praised with Uma by the celestials, and associated with the restoration of Sakra's
    arm. The passage then praises Maheswara as all-pervading, identified with many
    gods, cosmic powers, time divisions, and the universe; it describes terrible and
    auspicious forms, protective and salvific powers, an oceanic mare-headed mouth,
    crematorium dwelling, Vedic praise, the title Pasupati, worship of the phallic
    emblem, and explanations of many divine names and attributes.
  language: English
  quote_policy: quoted
