canonical_text:
  quote: ''
  summary: Bhuminjaya, also called Uttara in the passage, enters Virata's court and
    sees Kanka bleeding and attended by Sairindhri. Virata says he struck Kanka because
    Kanka praised a person of the third sex while Virata was praising Uttara. Uttara
    warns Virata to appease Kanka so that a Brahmana's curse will not destroy him.
    Virata seeks forgiveness; Kanka, identified as Kunti's son and a Pandava, says
    he has already forgiven Virata, but that if his blood had fallen on the ground
    Virata and his kingdom would have been destroyed. After the bleeding stops, Vrihannala
    enters silently, and Virata praises Uttara for the battle and the recovery of
    his cattle wealth from the Kurus.
  language: English
  quote_policy: summarized
