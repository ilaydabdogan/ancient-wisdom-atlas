canonical_text:
  quote: ''
  summary: Sanjaya describes a fierce, indiscriminate battle in which ordinary combatant
    classes break down. Named Kuru-side warriors shake the Pandava host; Bhishma and
    Partha slay warriors and elephants; the battlefield is strewn with bodies. Both
    sides are depicted as seeking heaven or the region of Brahma through battle.
  language: English
  quote_policy: summarized
