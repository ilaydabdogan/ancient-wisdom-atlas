canonical_text:
  quote: ''
  summary: During the Pandavas’ disguised residence in Matsya, Draupadi serves Sudeshna
    in misery. Kichaka, commander of Virata’s forces and Sudeshna’s brother, sees
    Draupadi, becomes overwhelmed by desire, asks Sudeshna about her, then directly
    addresses Draupadi with elaborate praise, divine and natural comparisons, offers
    of wealth and pleasure, and a request that she surrender to him. Draupadi begins
    her reply by pointing to her apparent low-status role as a female servant who
    dresses hair.
  language: English
  quote_policy: summarized
