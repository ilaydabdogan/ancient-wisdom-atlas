canonical_text:
  quote: Thou, O Krishna, art our refuge, thou art our lord, thou art our guide!
  summary: Krishna returns from Hastinapura to Upaplavya, reports his failed counsel
    to Duryodhana, and is asked by Yudhishthira to recount the words spoken in the
    Kuru assembly. The Pandavas deliberate after evening prayer and treat Krishna
    as their refuge and guide.
