  summary: Sanat-sujata instructs a monarch on destructive faults, wicked dispositions,
    Brahmana virtues, friendship, sense-restraint, asceticism, sacrifice, Yoga philosophy,
    knowledge of Brahman, and the inadequacy of ritual Work without knowledge for
    attaining immortality or emancipation.
