canonical_text:
  quote: ''
  summary: Galava asks Garuda to carry him east to behold the gods. After mounting
    Garuda, Galava is overwhelmed by the bird-being's speed, storm, darkness, and
    firelike radiance. He recalls an unfulfilled pledge to give his preceptor eight
    hundred rare horses and contemplates death. Garuda rebukes this thought, says
    means exist, and proposes resting at the seaside mountain Rishabha.
  language: English
  quote_policy: summarized
