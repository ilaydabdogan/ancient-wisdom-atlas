canonical_text:
  quote: "“Remembering his femininity, O king, Bhishma, in the very sight of all,
    struck him not.”"
  summary: Sikhandin attacks Bhishma, who refuses to strike him because he remembers
    Sikhandin’s femininity. Arjuna urges Sikhandin to attack Bhishma, while Bhishma
    attacks Arjuna and the Pandava army. Dussasana protects Bhishma and fights fiercely
    until Arjuna defeats him and advances. Sikhandin’s arrows strike Bhishma, who
    receives them with little pain and continues consuming the Pandava troops.
  language: English
