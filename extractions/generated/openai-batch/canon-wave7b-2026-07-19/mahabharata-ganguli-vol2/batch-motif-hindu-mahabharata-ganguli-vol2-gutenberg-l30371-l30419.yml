canonical_text:
  quote: ''
  summary: Sanjaya narrates battlefield exchanges among Virata, Bhishma, Aswatthaman,
    Arjuna, Krishna, Duryodhana, and Bhima. Aswatthaman resists Arjuna and Krishna
    while trying to protect Bhishma; Arjuna shows him mercy because of his relation
    to Drona and his Brahmana status. Duryodhana and Bhima then wound one another
    fiercely, with several celestial and animal similes used to describe the combat.
  language: English
