canonical_text:
  quote: ''
  summary: Sanjaya narrates that Krishna, knowing past and future, had Daruka keep
    his chariot ready. When Satyaki is without a car and Karna is ready to fight,
    Krishna blows his conch; Daruka brings the radiant, gold-standarded chariot, and
    Satyaki mounts it. Satyaki and Karna fight a spectacular duel watched by armies
    and celestial beings. Daruka’s chariot-driving amazes the spectators. Satyaki
    disables Karna by wounding him, killing his horses, felling his charioteer, and
    cutting his standard. Karna is rescued onto Duryodhana’s car. Satyaki spares Karna
    and the king’s sons because Bhima and Partha have prior vows concerning their
    deaths, and the narrator praises Satyaki’s prowess.
  language: English
  quote_policy: summarized
