candidate_motifs:
- id: motif:1
  label: Foreknowledge and battlefield preparation by a divine helper
  taxonomy_refs:
  - wisdom
  basis: Krishna is said to know past and future and to have prepared the car in advance
    of Satyaki’s danger.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents foreknowledge in a martial context; it does not elaborate
    a separate wisdom teaching.
- id: motif:2
  label: Conch-signal summons the prepared chariot
  taxonomy_refs: []
  basis: Krishna’s conch blast is understood by Daruka, who immediately brings the
    equipped car.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The conch functions as a signal in this passage; broader ritual meaning
    is not stated here.
- id: motif:3
  label: Radiant celestial vehicle enabling a hero’s return to combat
  taxonomy_refs: []
  basis: Satyaki mounts Krishna’s radiant, gold-standarded car, compared to fire,
    sun, and a celestial vehicle, and rushes against Karna.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage uses celestial imagery for the chariot but does not describe
    an ascent or journey beyond the battlefield.
- id: motif:4
  label: Human duel elevated to superhuman spectacle
  taxonomy_refs: []
  basis: The duel is called unlike any heard on earth or in heaven; armies cease fighting,
    and celestial beings watch from the sky.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage emphasizes scale and spectatorship rather than a named mythic
    combat cycle.
- id: motif:5
  label: Battlefield restraint governed by prior vows
  taxonomy_refs: []
  basis: Satyaki disables but does not kill Karna or the king’s sons so that the vows
    of Partha and Bhima will remain valid.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The vows are mentioned as prior commitments; the passage does not narrate
    their original making except briefly.
- id: motif:6
  label: Friendship and promised sovereignty motivating a warrior
  taxonomy_refs: []
  basis: Karna, weakened and defeated, mounts Duryodhana’s car while remembering their
    childhood friendship and his promise concerning Duryodhana’s sovereignty.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The political promise is recalled briefly; the passage does not establish
    a full royal-legitimation episode.
