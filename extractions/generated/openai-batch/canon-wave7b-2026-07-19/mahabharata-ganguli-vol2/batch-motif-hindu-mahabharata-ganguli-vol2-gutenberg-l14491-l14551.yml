canonical_text:
  quote: ''
  summary: Krishna responds to Vidura, praises his counsel, and explains that he has
    come to the Kurus to attempt peace despite knowing Duryodhana's wickedness and
    the hostility of allied Kshatriyas. He states that a sincere effort toward virtue
    has merit even if it fails, that a true friend should act as intercessor among
    quarrelling kin, and that he wishes to avert slaughter between the Kurus, Srinjayas,
    Pandavas, and other Kshatriyas. He names Duryodhana and Karna as direct causes
    of the impending calamity, warns that rejection of his counsel will bring fate
    upon Duryodhana, and says that if anyone seeks to injure him, all kings together
    cannot withstand him. Vaisampayana then narrates that Krishna lies down to sleep.
  language: English
  quote_policy: summarized
