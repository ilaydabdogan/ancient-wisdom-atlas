  summary: The passage presents a battlefield catalogue centered on Drona and a series
    of paired encounters among warriors. Several combatants disable each other's chariots,
    standards, drivers, bows, steeds, or insignia, then continue with other weapons.
    It includes similes of mountains, elephants, lions, and an explicit comparison
    of Lakshmana's duel with Kshatradeva to Vishnu's ancient battle with Hiranyaksha.
    Rakshasa warriors fight through illusion, and Abhimanyu shifts from bow combat
    to sword and shield after intervention by Hridika's son.
  language: English
