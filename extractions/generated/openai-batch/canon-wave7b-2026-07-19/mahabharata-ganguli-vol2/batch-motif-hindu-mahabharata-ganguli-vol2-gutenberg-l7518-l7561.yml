canonical_text:
  quote: ''
  summary: Dhritarashtra recalls Krishna's defeat of Sishupala and the fear it caused
    among kings. He fears Krishna and Dhananjaya seated together on one car, compares
    them to Indra and Upendra destroying Daityas, identifies Krishna with Vishnu,
    and especially fears Yudhishthira's just wrath. He instructs Sanjaya to go as
    messenger to the Panchala camp, ask after Yudhishthira and Krishna, and declare
    Dhritarashtra's desire for peace with the sons of Pandu.
  language: English
  quote_policy: summarized
