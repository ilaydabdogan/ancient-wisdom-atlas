canonical_text:
  quote: ''
  summary: Sanjaya reports that Duryodhana's forces were discouraged after Drona failed
    to seize Yudhishthira while Arjuna protected him. Duryodhana rebukes Drona, and
    Drona answers that a force guarded by Arjuna and Govinda cannot be overcome, promises
    to kill a foremost Pandava car-warrior, and says Arjuna must be drawn away. The
    Samsaptakas challenge Arjuna and take him south. Drona forms an impenetrable circular
    array, which Abhimanyu enters at the command of his father’s elder brother. Abhimanyu
    kills many warriors, is confronted by six heroes, and is finally slain by Duhsasana’s
    son. Dhritarashtra laments that many armed warriors killed a child and asks Sanjaya
    to narrate the event in detail.
  language: English
  quote_policy: summarized
