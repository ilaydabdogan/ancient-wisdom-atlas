canonical_text:
  quote: '"Protect Me," she said and sat down on his lap.'
  summary: 'Narada recounts to Srinjaya the death and merits of king Bhagiratha: his
    lavish sacrificial gifts, Ganga''s appeal for protection and adoption-like relation
    to him, the divine approval of his sacrifices, his generosity to Brahmanas, and
    his ascent to the region of Brahman. The account is used to counsel Srinjaya not
    to grieve for Swaitya.'
  language: English
  quote_policy: quoted
