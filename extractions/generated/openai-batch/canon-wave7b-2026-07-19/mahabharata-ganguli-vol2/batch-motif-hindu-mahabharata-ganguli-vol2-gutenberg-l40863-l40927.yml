canonical_text:
  quote: ''
  summary: Sanjaya reports that Arjuna, driven by Krishna, must choose between answering
    Susarman's challenge and protecting his troops from Drona. Krishna turns the chariot
    back; Arjuna defeats Susarman's party, advances through the Kaurava host, and
    encounters Bhagadatta mounted on an elephant. Bhagadatta attacks Arjuna and Krishna
    with arrows and drives his elephant against them. Krishna maneuvers the chariot,
    and Arjuna refrains from striking the elephant and rider from behind because of
    the rules of fair fight, though the elephant continues killing others.
  language: English
  quote_policy: summarized
