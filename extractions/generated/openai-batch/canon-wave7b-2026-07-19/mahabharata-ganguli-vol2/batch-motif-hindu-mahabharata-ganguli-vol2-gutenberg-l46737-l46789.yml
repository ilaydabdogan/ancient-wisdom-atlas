canonical_text:
  quote: ''
  summary: Vinda and Anuvinda of Avanti attack Arjuna and Krishna when Arjuna's horses
    are tired. Arjuna cuts down their weapons, supporters, and Vinda; Anuvinda attacks
    Krishna with a mace to avenge his brother and is killed by Arjuna. After further
    enemies rush and surround him, Arjuna consults Krishna about the wounded horses
    and says he will hold back the army while Krishna tends to what must be done.
  language: English
  quote_policy: summarized
