canonical_text:
  quote: He who hath been created for Drona's destruction will, without doubt, slay
    him.
  summary: In battle, Yudhishthira counters a Vayavya weapon and cuts Drona's bows.
    Vasudeva counsels him to stop fighting Drona, saying that another being has been
    created to destroy Drona, and directs him toward Suyodhana and the battle where
    Dhananjaya, Vasudeva, and Bhima fight the Kurus. Yudhishthira joins Bhima's flank
    while Bhima slaughters troops; Drona continues attacking the Panchalas at night.
  language: English
