canonical_text:
  quote: ''
  summary: Salya recounts how Agastya told Indra the circumstances of Nahusha's fall.
    Nahusha, carried by Brahmanas and celestial saints, denied the authority of Vedic
    hymns, struck Agastya's head with his foot, and was cursed to lose his splendour,
    fall from heaven, and roam the earth for ten thousand years as an enormous snake.
    Indra is urged to return to heaven and protect the worlds, while gods, ancestral
    and celestial beings, and elements of the natural world rejoice.
  language: English
  quote_policy: summarized
