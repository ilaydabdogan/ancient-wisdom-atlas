canonical_text:
  quote: ''
  summary: Yudhishthira hears Bhima roaring and reflects with relief that Arjuna,
    Satyaki, Vasudeva, and others still live. He recalls Arjuna's earlier martial
    victories, notes Krishna as Arjuna's charioteer and protector, worries about Arjuna's
    vow to slay Jayadratha before sunset, and wonders whether Duryodhana might make
    peace after further losses. His thoughts are marked by compassion while the battle
    continues fiercely.
  language: English
