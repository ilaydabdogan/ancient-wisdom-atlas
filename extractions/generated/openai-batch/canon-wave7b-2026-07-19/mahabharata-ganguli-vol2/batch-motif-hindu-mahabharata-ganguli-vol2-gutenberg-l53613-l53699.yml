canonical_text:
  quote: ''
  summary: In a night battle, Aswatthaman disarms and kills the Rakshasa Anjanaparvan.
    Ghatotkacha, grieving for his slain son, challenges Aswatthaman and asserts his
    heroic and Rakshasa lineage. Their combat includes arrow-showers, aerial imagery,
    invisibility, mountain and cloud illusions, and the use of the Vajra and Vayavya
    weapons to destroy those illusions. Aswatthaman then reassures the fearful Duryodhana
    that he will defeat the approaching Rakshasa host.
  language: English
  quote_policy: summarized
