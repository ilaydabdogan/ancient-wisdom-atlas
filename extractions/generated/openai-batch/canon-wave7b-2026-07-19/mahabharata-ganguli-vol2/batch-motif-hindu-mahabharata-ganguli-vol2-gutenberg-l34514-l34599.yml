  quote: ''
  summary: Sanjaya narrates how Arjuna urges Sikhandin to advance on Bhishma, prompting
    many Pandava warriors to rush toward Bhishma while Kaurava warriors intercept
    them. Dhrishtadyumna encourages the Pandava troops by declaring that Arjuna is
    advancing and that Bhishma is old and unable to attack them. Dussasana blocks
    Arjuna’s advance, and the two warriors exchange arrows in a fierce duel marked
    by epic similes.
