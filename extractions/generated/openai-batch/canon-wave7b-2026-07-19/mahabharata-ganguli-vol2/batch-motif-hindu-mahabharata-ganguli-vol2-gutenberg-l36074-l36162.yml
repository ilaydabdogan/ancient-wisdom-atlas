canonical_text:
  quote: ''
  summary: Sanjaya reports that after Bhishma lies wounded on a bed of reeds, Karna
    comes to him, falls at his feet, and asks recognition. Bhishma privately embraces
    Karna, reveals and confirms his birth from Kunti rather than Radha or Adhiratha,
    praises him, and urges him to end hostilities by joining the sons of Pandu. Karna
    acknowledges the hidden birth but refuses to abandon Duryodhana, citing obligation,
    destiny, omens of destruction, and his resolve to fight Dhananjaya. Bhishma grants
    permission, counsels righteous battle without vindictiveness, forgives Karna,
    and Karna departs toward Duryodhana.
  language: English
  quote_policy: summarized
