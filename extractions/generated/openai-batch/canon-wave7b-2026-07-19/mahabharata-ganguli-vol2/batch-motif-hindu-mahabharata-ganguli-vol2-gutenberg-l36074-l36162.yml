candidate_motifs:
- id: motif:1
  label: concealed parentage revealed by an elder
  taxonomy_refs:
  - divine_parent_child
  basis: Bhishma privately tells Karna that he is Kunti's son, not Radha's or Adhiratha's,
    and Karna is also addressed as son of Surya; Karna confirms his birth but says
    he was abandoned and reared by a Suta.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: medium
  cautions: The passage confirms hidden parentage and divine paternity by epithet,
    but it does not narrate Karna's birth itself.
- id: motif:2
  label: blood kinship offered as a path to end war
  taxonomy_refs: []
  basis: Bhishma identifies the sons of Pandu as Karna's uterine brothers and urges
    him to unite with them so hostilities may end and kings may be freed from danger.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage presents the appeal, but Karna rejects it.
- id: motif:3
  label: loyalty to patron over birth family
  taxonomy_refs:
  - sacred_exchange
  basis: Karna says he has long enjoyed Duryodhana's wealth and cannot falsify that
    obligation, even though he acknowledges Kunti and the Pandavas as his blood relations.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: medium
  cautions: The exchange is explicit as patronage and loyalty; the taxonomy reference
    is cautious because the passage does not call the exchange sacred.
- id: motif:4
  label: inescapable destiny and omens of destruction
  taxonomy_refs:
  - chaos
  basis: Karna and Bhishma both speak of destiny as not overcome by exertion, and
    Karna mentions omens indicating destruction of the Earth.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: medium
  cautions: The passage refers to Earth-destruction omens but does not describe a
    full cosmic chaos episode.
- id: motif:5
  label: righteous warrior battle as path to heaven
  taxonomy_refs:
  - sacrifice
  basis: Karna says death from disease does not suit a Kshatriya and offers his body
    and possessions for Duryodhana; Bhishma permits him to fight for heaven and says
    righteous battle brings the regions attainable by Kshatriya duty.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:11
  confidence: medium
  cautions: The passage frames battle as Kshatriya duty and possible self-offering,
    but it does not describe a formal sacrificial rite.
- id: motif:6
  label: forgiveness and permission before a fatal conflict
  taxonomy_refs: []
  basis: Karna asks forgiveness and permission to fight; Bhishma grants permission,
    forgives him, and Karna salutes him before departing.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:13
  confidence: high
  cautions: The passage implies grave danger but does not narrate Karna's death within
    this excerpt.
