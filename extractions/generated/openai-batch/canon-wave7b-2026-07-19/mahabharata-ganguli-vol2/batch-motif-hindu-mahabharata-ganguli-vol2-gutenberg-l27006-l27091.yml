canonical_text:
  quote: ''
  summary: 'Sanjaya describes the forenoon of an awful battle day: a deafening battlefield
    uproar, Kuru warriors rushing against the Pandavas, and a sequence of fierce paired
    combats among major warriors, with repeated imagery of death, roaring animals,
    flowers, clouds, gods and Danavas, elephants, and planets.'
  language: English
  quote_policy: summarized
