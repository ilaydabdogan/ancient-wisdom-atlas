canonical_text:
  quote: ''
  summary: Vidura instructs Dhritarashtra on the marks of high families, proper conduct,
    hospitality, friendship, control of grief, the cycle of death and rebirth, and
    the danger posed by uncontrolled senses. Dhritarashtra then says he has deceived
    Yudhishthira, fears that Yudhishthira will destroy his sons in battle, and asks
    Vidura for words to dispel his anxiety.
  language: English
