canonical_text:
  quote: ''
  summary: Bhima reaches the nighttime assignation place first in disguise and waits
    for Kichaka. Kichaka adorns himself and enters the dark dancing hall expecting
    to meet Panchali, but instead approaches Bhima, who is angry over an insult to
    Krishna. The narration compares Kichaka's approach to an insect nearing fire and
    a weak animal nearing a lion. Kichaka speaks of wealth, servants, robes, and a
    mansion set aside for the person he thinks he is meeting. Bhima replies with praise
    of Kichaka's beauty and skill in love-making.
  language: English
