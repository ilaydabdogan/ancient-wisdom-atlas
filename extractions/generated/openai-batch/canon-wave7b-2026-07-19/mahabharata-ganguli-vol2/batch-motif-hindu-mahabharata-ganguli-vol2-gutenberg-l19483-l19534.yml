canonical_text:
  quote: ''
  summary: 'Rama and Rukmi withdraw from the impending battle, after which the Pandavas
    consult under Yudhishthira. Janamejaya asks what the Kauravas did after the armies
    were arrayed. Vaisampayana introduces Dhritarashtra''s request to Sanjaya for
    details. Dhritarashtra laments destiny, his inability to restrain Duryodhana,
    and the ruinous war, while calling bodily sacrifice in battle a Kshatriya duty.
    Sanjaya answers by discussing blame, misconduct, the dice injury to the Pandavas,
    impending slaughter, and differing views of agency: divine ordination, free will,
    and effects of past acts.'
  language: English
  quote_policy: summarized
