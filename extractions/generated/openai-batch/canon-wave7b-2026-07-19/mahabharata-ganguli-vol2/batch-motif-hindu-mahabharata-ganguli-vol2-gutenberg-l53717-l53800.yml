canonical_text:
  quote: ''
  summary: A night battle unfolds between Ghatotkacha with Rakshasa forces and Aswatthaman,
    Drona's son. Ghatotkacha wounds Aswatthaman and cuts his bow, but Aswatthaman
    responds with volleys of arrows, destroys large numbers of Rakshasas, and is repeatedly
    compared to consuming fire. Ghatotkacha orders the Rakshasas to attack, then seeks
    single combat and hurls a celestial Asani. Aswatthaman catches and returns it,
    destroying Ghatotkacha's chariot. Ghatotkacha then joins Dhrishtadyumna's car,
    and both continue fighting Aswatthaman.
  language: English
