canonical_text:
  quote: ''
  summary: In the Kuru court, Suyodhana/Duryodhana angrily leaves despite the presence
    of elders and Krishna, and his supporters follow him. Bhishma warns that wrath
    and avarice will lead him and the Kshatriyas toward ruin. Krishna argues that
    the elders should seize and bind Duryodhana, citing the precedent of Kansa's removal
    for the good of the Yadava race and a cosmic precedent in which Parameshthin ordered
    Dharma to bind the Daityas and Danavas and hand them to Varuna. Krishna urges
    that Duryodhana, Karna, Sakuni, and Dussasana be bound and handed to the Pandavas
    to preserve the wider Kshatriya race.
  language: English
  quote_policy: summarized
