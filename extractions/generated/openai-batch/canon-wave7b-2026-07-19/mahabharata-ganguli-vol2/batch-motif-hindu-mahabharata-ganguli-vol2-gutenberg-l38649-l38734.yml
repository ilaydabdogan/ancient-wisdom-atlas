canonical_text:
  quote: ''
  summary: Sanjaya narrates Drona's devastating attack on the Pandava and Panchala
    forces. Yudhishthira orders Dhrishtadyumna and Arjuna to check him, but Drona
    scatters arrows, slays many warriors and animals, and is compared to Death, fire,
    storm, and the end-Yuga Sun. After killing many, Drona is slain by Dhrishtadyumna,
    proceeds to heaven, and is witnessed by gods, Pitris, friends, and all creatures
    amid cosmic uproar and Pandava victory shouts.
  language: English
  quote_policy: summarized
