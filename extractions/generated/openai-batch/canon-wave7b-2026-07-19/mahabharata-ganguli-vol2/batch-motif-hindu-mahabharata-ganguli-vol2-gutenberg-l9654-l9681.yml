canonical_text:
  quote: ''
  summary: Dhritarashtra states that humans are subject to Destiny like wooden dolls
    moved by strings and asks Vidura to continue. Vidura gives counsel on timely speech,
    social favor, love and hatred, and recalls warning Dhritarashtra at Duryodhana's
    birth to abandon one son to preserve the prosperity of the hundred. Vidura contrasts
    gains that cause loss with losses that bring gain and warns against wealth without
    good qualities. Dhritarashtra accepts the advice as wise but says he cannot abandon
    his son, adding that righteousness brings victory.
