canonical_text:
  quote: ''
  summary: Vyasa recounts how Narada and Parvata visit King Srinjaya, dispute over
    Srinjaya's daughter, and curse each other. Srinjaya later seeks a son through
    service to Brahmanas; Narada grants a boon, and Srinjaya asks for an accomplished
    son whose bodily emissions produce gold. The son Suvarnashthivin is born and enriches
    the kingdom, but robbers kidnap and kill him hoping to obtain gold. They find
    none, the boon-derived gold disappears, and the robbers perish and fall into hell.
    Srinjaya laments, and Narada appears to console him by citing the mortality of
    Marutta despite wealth and sacrifices.
  language: English
  quote_policy: summarized
