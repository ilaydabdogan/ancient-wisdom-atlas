canonical_text:
  quote: ''
  summary: Kripa rebukes Karna, praising Krishna, Arjuna, Yudhishthira, the Pandavas,
    and their allies as nearly unconquerable. Karna replies that Kripa speaks truly
    about the Pandavas' virtues, but claims he will slay Arjuna with an unerring dart
    given by Vasava/Sakra; he then threatens Kripa, lists Kaurava champions, and says
    victory depends on destiny.
  language: English
  quote_policy: summarized
