- id: obs:2
  text: Sanat-sujata says the Supreme Soul cannot be penetrated by the Vedas and the
    mind, is therefore called mauna, and is the source from which Om and ordinary
    sounds have arisen.
  category: speech
  evidence_refs:
  - ev:1
