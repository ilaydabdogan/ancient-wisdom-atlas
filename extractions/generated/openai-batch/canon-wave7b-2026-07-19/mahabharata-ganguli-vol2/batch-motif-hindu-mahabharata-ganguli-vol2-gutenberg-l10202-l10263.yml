canonical_text:
  quote: ''
  summary: Dhritarashtra questions Sanat-sujata about mauna, Vedic learning, sin,
    and ascetic austerity. Sanat-sujata explains the Supreme Soul as beyond Veda and
    mind, source of Om and ordinary sound, and describes virtue, knowledge, asceticism,
    sacrifice, postmortem fruits, return to action, and the distinction between unstained
    and fault-stained asceticism.
  language: English
  quote_policy: summarized
