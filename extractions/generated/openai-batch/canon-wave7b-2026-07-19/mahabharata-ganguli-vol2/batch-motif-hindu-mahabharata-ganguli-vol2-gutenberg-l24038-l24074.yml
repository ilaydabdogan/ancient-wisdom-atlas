canonical_text:
  quote: ''
  summary: Vaisampayana introduces Sanjaya, who comes grief-stricken from the battlefield
    to Dhritarashtra and reports that Bhishma has been slain. Sanjaya describes Bhishma
    as lying on a bed of arrows, killed by Sikhandin/the prince of Panchala, recalls
    his former feats and comparisons to powerful beings and natural forms, and says
    he protected the Kuru army for ten nights before falling like the sun and like
    a tree broken by wind.
  language: English
