  summary: The passage recounts Krishna’s slaying of Naraka and Mura, recovery of
    jeweled ear-rings, and reception of divine blessings. The speaker predicts the
    destruction of Duryodhana and the sons of Dhritarashtra, invokes justice and past
    wrongs at dice, cites astrologers and foresight, describes ominous signs around
    his weapons and chariot, and declares his resolve to destroy opposing kings with
    divine weapons.
