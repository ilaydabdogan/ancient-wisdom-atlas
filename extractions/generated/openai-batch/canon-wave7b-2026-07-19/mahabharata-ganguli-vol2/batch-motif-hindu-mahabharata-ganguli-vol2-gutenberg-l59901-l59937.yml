canonical_text:
  quote: ''
  summary: The passage explains Mahadeva/Rudra as present in living bodies, associated
    with vital airs, fire, moon, auspicious and terrible forms, and the phallic emblem.
    It recalls Arjuna's dream-vision of the deity on a mountain, the deity's advance
    before Arjuna in battle, and the weapons given to him. It describes the Veda-approved
    Sata-Rudriya hymn and its benefits for listeners, readers, and worshippers, then
    urges Arjuna to fight under Janardana's protection. Sanjaya reports that the son
    of Parasara departs after speaking.
  language: English
  quote_policy: summarized
