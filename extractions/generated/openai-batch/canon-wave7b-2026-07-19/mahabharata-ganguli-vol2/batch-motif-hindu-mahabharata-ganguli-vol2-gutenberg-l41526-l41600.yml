canonical_text:
  quote: I shall not be able, however, to come out if any kind of danger overtakes
    me.
  summary: Drona repels the Pandava-side warriors from his array. Yudhishthira asks
    Abhimanyu to break Drona's circular formation because few know how to pierce it.
    Abhimanyu says he knows how to enter and strike it but may not know how to escape
    if danger arises. Yudhishthira and Bhima promise that the others will follow and
    protect him. Abhimanyu vows to enter the array and orders his charioteer to drive
    toward Drona's army.
  language: English
  quote_policy: quoted
