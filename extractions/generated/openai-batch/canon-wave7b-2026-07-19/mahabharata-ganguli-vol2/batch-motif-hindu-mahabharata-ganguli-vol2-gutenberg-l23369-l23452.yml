  quote: ''
  summary: Sanjaya describes a sacred geography of mountain ranges, Varshas, Meru
    at the center, divine beings and sages resorting there, the circumambulation of
    Meru by celestial bodies, Pasupati with Uma in a northern forest, the descent
    of Ganga from Meru, Kuvera’s wealth, and blessed northern regions marked by longevity,
    health, and prosperity.
