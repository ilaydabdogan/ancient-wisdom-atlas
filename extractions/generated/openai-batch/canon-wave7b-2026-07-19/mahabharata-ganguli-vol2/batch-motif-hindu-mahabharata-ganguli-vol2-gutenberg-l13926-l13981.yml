canonical_text:
  quote: ''
  summary: In a Kuru council, Duryodhana rejects honoring Krishna with wealth or worship,
    although he acknowledges Krishna's worthiness and devotion to the Pandavas. Bhishma
    urges peace with the Pandavas through Krishna. Duryodhana declares that he will
    imprison Krishna when Krishna comes as an ambassador, expecting the Vrishnis,
    the Pandavas, and the earth to submit. Dhritarashtra rebukes the plan as improper,
    and Bhishma condemns Duryodhana, predicts destruction from hostile contact with
    Krishna, and leaves in anger.
  language: English
  quote_policy: summarized
