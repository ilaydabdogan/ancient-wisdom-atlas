    his Yoga-enabled powers of perception granted through the son of Parasara; and
    reports Duryodhana's battlefield orders to Dussasana to protect Bhishma, especially
    from Sikhandin, whom Bhishma will not kill because Sikhandin was formerly female.
  language: English
