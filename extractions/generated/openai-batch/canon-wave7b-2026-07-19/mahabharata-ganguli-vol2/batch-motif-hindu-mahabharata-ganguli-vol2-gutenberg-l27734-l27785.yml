canonical_text:
  quote: ''
  summary: 'Sanjaya rebukes the king for belated understanding. He narrates battlefield
    events after Sweta''s death: Sankha attacks Salya, Bhishma advances, Arjuna protects
    Sankha, Salya disables Sankha''s car, and Bhishma devastates Pandava-allied troops
    until sunset, when the Parthas withdraw for the night.'
  language: English
  quote_policy: summarized
