  quote: ''
  summary: Sanjaya narrates a battle sequence in which Bhurisravas and Satyaki exchange
    arrows and are surrounded by their respective allies. Bhimasena confronts Duryodhana
    and the sons of Dhritarashtra, is wounded and briefly swoons, then recovers and
    kills or routs several named sons of Dhritarashtra. Santanu's son orders the army
    to seize Bhima, after which Bhagadatta attacks on an elephant and shrouds Bhima
    with arrows before Pandava warriors surround Bhagadatta.
