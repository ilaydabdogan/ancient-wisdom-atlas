  quote: '"I salute thee, O invincible one. With thee we will do battle. Grant (us)
    thy permission... Give (us) also (thy) blessing."'
  summary: Before battle, Yudhishthira lays aside armor and weapons, walks into the
    hostile array with his brothers and Krishna following, salutes Bhishma, asks permission
    and blessing to fight, and then asks how Bhishma may be defeated.
