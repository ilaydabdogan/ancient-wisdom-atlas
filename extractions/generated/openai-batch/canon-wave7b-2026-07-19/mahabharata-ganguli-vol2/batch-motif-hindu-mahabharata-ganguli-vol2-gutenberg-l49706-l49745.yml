  summary: After Vrihatkshatra is slain, Dhrishtaketu, son of Sisupala and ruler among
    the Chedis, orders his charioteer to take him to Drona. He attacks Drona with
    arrows, but Drona cuts his bow, kills his steeds and charioteer, and counters
    his mace, lance, and dart. Drona then kills Dhrishtaketu with a shaft and also
    kills Dhrishtaketu's son when the son seeks to continue his father's burden.
  language: English
  quote_policy: quoted
