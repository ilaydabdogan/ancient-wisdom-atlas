canonical_text:
  quote: ''
  summary: Sanjaya reports Aswatthaman's reply to Duryodhana. Aswatthaman says the
    Pandavas are dear to him and his father outside battle, criticizes Duryodhana's
    suspicion, and vows to fight for him. He enters battle, challenges enemy warriors
    to strike him, kills combatants, and causes a retreat. Dhrishtadyumna then confronts
    him, wounds him, and exchanges threats with him, declaring a vow to kill Drona
    first and then Aswatthaman.
  language: English
  quote_policy: summarized
