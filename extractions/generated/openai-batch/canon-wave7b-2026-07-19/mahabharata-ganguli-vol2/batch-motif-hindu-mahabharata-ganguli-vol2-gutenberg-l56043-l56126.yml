canonical_text:
  quote: ''
  summary: In a battle between Ghatotkacha and Karna, Ghatotkacha attacks with arrows,
    a celestial wheel, a mace, aerial showers of trees, and many illusions. Karna
    repeatedly counters with arrows and celestial weapons. Ghatotkacha assumes many
    forms, appears dead and then reappears, becomes huge, tiny, mountain-like, invisible,
    and cloud-like, moves through sky, earth, and waters, challenges Karna, and finally
    approaches again with a host of Rakshasas.
  language: English
  quote_policy: summarized
