canonical_text:
  quote: ''
  summary: In a battle scene, Bhimasena cuts down hostile shafts and strikes opposing
    bowmen. Arjuna comes to Bhima in his car, and the opposing army loses hope on
    seeing the two sons of Pandu together. Arjuna advances with Sikhandin placed before
    him, aiming at Bhishma and aiding Bhima against enemy warriors. Duryodhana orders
    Susarman to attack and kill Arjuna and Bhima. Susarman rushes against the two
    bowmen with a large force and surrounds them with many thousands of cars, beginning
    a fierce battle.
