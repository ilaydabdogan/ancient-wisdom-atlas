canonical_text:
  quote: ''
  summary: Sanjaya narrates a renewed duel between Karna and Bhima. Karna attacks
    from another car, and the two warriors exchange dense arrow-showers amid images
    of fire, ocean, serpents, clouds, and death. Bhima recalls earlier wrongs against
    himself, the Pandavas, Kunti, and Krishna, becomes reckless of life, and charges.
    The fight agitates the surrounding army, appears evenly matched, and causes many
    casualties among elephants, horses, and men.
  language: English
  quote_policy: summarized
