  quote: ''
  summary: Narada recounts the death and extraordinary sacrificial generosity of King
    Rantideva, describing his hospitality to Brahmanas, vast gifts of gold and cattle,
    sacrifices that generated the named river Charmanwati, visible acceptance of offerings
    by gods and Pitris, and concludes by telling Srinjaya not to grieve for Swaitya.
  language: English
