candidate_motifs:
- id: motif:1
  label: restrained vengeance under oath or concealment
  taxonomy_refs: []
  basis: Bhima states that he would have killed Kichaka and caused slaughter but remained
    quiet because Yudhishthira forbade him by a glance.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not explicitly name the surrounding disguise or oath;
    the restraint is directly stated, but its full narrative rationale lies outside
    the excerpt.
- id: motif:2
  label: exemplary wife following husband through hardship
  taxonomy_refs: []
  basis: Bhima lists several women who followed husbands into forest, severe age,
    calamity, renunciation, or Yama's world, and then says Draupadi is like them.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: This motif is presented as rhetorical counsel inside Bhima's speech rather
    than as a new event occurring in the immediate scene.
