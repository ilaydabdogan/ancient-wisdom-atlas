canonical_text:
  quote: ''
  summary: Bhima laments Draupadi's suffering and his own restrained anger after Kichaka
    assaulted her, explains that Yudhishthira's glance prevented immediate violence,
    and urges Draupadi to endure a little longer by citing exemplary wives who followed
    husbands through hardship. Draupadi answers that grief caused her tears, asks
    Bhima to act quickly, and recounts Kichaka's harassment, Kaikeyi's role in sending
    her to Kichaka for wine, Kichaka's attempted violence and public kick, the king's
    failure to punish him, and her fear that Kichaka will again outrage her unless
    protected.
  language: English
  quote_policy: summarized
