  quote: ''
  summary: Sanjaya narrates Abhimanyu’s fierce assault on Duryodhana’s army, using
    elemental and cosmic similes for his arrows and battlefield power. Duryodhana
    commands the unnamed Rakshasa son of Rishyasringa to kill Abhimanyu. The Rakshasa
    terrifies and attacks the Pandava host, then rushes the sons of Draupadi, who
    counterattack and pierce him with arrows.
