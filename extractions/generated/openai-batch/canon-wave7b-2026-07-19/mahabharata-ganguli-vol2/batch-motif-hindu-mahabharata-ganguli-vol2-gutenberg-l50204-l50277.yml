  quote: '"that blazing fire, represented by Bhima, which so consumed my sons"'
  summary: Dhritarashtra asks Sanjaya who faced the enraged Bhima after Bhima slew
    his sons. Sanjaya reports that Karna confronted Bhima, exchanged arrows with him,
    was wounded and deprived of bow, charioteer, and horses, then mounted Vrishasena's
    car. Bhima's roar terrifies combatants and is answered by conchs and war-noises
    from both armies.
