canonical_text:
  quote: ''
  summary: The divine speaker describes the three qualities, duties arising from nature,
    perfection through one’s own duty, renunciation, assimilation with Brahma, devotion
    and refuge in the divine, and the proper transmission of this supreme mystery.
    Arjuna replies that his delusion and doubts have been destroyed and that he will
    obey.
  language: English
  quote_policy: summarized
