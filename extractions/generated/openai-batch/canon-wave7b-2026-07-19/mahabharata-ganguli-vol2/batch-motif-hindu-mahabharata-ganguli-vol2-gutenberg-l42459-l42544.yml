canonical_text:
  quote: ''
  summary: In a battle sequence, Abhimanyu duels Karna, kills or wounds several opponents,
    and prompts opposing warriors to consult Drona about how to stop him. Drona praises
    Abhimanyu's speed and skill, notes his impenetrable armour, and advises disabling
    his bow, reins, horses, and charioteers. Karna, Kritavarman, and Kripa carry out
    this disarming, after which six car-warriors shower arrows on the bowless and
    carless youth. Abhimanyu then takes up sword and shield and leaps into the sky,
    moving like Garuda.
  language: English
  quote_policy: summarized
