  summary: Vidura instructs Dhritarashtra through moral aphorisms. He cites Manu on
    seventeen foolish kinds of persons, describes Yama's noose-bearing envoys dragging
    such persons to hell, explains reciprocal conduct, answers a question about why
    humans do not reach the Vedic hundred-year lifespan, lists six life-shortening
    vices as sharp swords, names grave sins requiring expiation, and concludes with
    virtues that lead to heaven.
  language: English
