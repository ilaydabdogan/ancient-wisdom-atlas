canonical_text:
  quote: ''
  summary: Sanjaya narrates a battlefield sequence in which Abhimanyu, son of Subhadra
    and Arjuna, fights the Rakshasa Alamvusha. Alamvusha uses illusion and darkness,
    but Abhimanyu invokes a blazing solar weapon and neutralizes the illusion, forcing
    Alamvusha to flee. Abhimanyu then attacks the opposing troops and is surrounded;
    Arjuna comes to rescue him while Bhishma and other warriors engage. The passage
    then shifts to combat among Kripa, Satyaki, and Drona's son.
  language: English
  quote_policy: summarized
