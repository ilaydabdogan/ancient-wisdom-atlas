canonical_text:
  quote: ''
  summary: Dhrishtadyumna attacks Drona, cuts his bowstring, and battles him. Drona
    takes another bow and wounds Dhrishtadyumna and his driver. Dhrishtadyumna checks
    Drona, destroys the Kaurava host, and the slaughter is described as a terrible
    blood-river carrying away warriors and animals, resembling the Vaitarani flowing
    toward Yama. Dhrishtadyumna is compared to Sakra among the celestials, and several
    Pandava-side warriors blow conchs after vanquishing many kings.
  language: English
  quote_policy: summarized
