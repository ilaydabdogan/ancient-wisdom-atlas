canonical_text:
  quote: ''
  summary: In a battlefield passage, Drona overwhelms and kills multiple Pandava-allied
    warriors, including the son of Jarasandha and Kshatradharman, routs Panchalas
    and Srinjayas, and is described through death, fire, ascetic, and Indra-like imagery.
    Drupada condemns Duryodhana’s covetousness and advances toward Drona with the
    Parthas.
  language: English
  quote_policy: summarized
