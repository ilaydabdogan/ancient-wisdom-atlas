candidate_motifs:
- id: motif:1
  label: warrior as death-like destroyer
  taxonomy_refs: []
  basis: Drona is repeatedly shown killing those who approach him and is explicitly
    compared to the Destroyer swallowing creatures when their hour arrives; slain
    warriors are sent to Yama’s presence.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: high
  cautions: The passage uses simile and battlefield narration; it does not identify
    Drona as a death deity.
- id: motif:2
  label: ascetic fire as destructive martial power
  taxonomy_refs: []
  basis: The troops describe Drona as a Brahmana with ascetic merit and learning,
    able to burn through glances, and they call his weapons an uncrossable fierce
    fire.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The fire is figurative and tied to weapons and Brahmana ascetic power
    in speech, not a separate fire episode.
- id: motif:3
  label: aged warrior with youthful force
  taxonomy_refs: []
  basis: Drona is described as eighty-five years old with white hair but moving in
    battle like a youth of sixteen.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is a characterizing battle image, not a full rejuvenation narrative.
- id: motif:4
  label: divine-warrior comparison in battle
  taxonomy_refs: []
  basis: Drona’s enemies regard him as Indra armed with thunder, and the slaughtered
    Panchalas are compared to Asuras destroyed by Sakra.
  evidence_refs:
  - ev:3
  - ev:10
  confidence: high
  cautions: The comparison is explicit but does not make Drona divine.
- id: motif:5
  label: wicked royal covetousness and next-world consequence
  taxonomy_refs:
  - divine_judgment
  basis: Drupada says Duryodhana’s covetousness caused many Kshatriya deaths and that
    he will obtain miserable regions in the next world.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage predicts afterlife consequence but does not describe a judgment
    scene or identify a judging deity for Duryodhana.
