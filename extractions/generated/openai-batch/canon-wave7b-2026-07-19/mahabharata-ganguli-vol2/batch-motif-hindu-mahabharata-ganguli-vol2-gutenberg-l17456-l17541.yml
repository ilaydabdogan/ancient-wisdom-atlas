canonical_text:
  quote: ''
  summary: Vidula exhorts her son Sanjaya not to live in fear, poverty, or dependence.
    She urges him to act as a Kshatriya, seek allies, take refuge in mountain fastness
    if needed, remember a prophecy of restored greatness, rescue his household from
    ruin, and win fame and sovereignty by fighting his foes, citing Indra’s slaying
    of Vritra as an example.
  language: English
  quote_policy: summarized
