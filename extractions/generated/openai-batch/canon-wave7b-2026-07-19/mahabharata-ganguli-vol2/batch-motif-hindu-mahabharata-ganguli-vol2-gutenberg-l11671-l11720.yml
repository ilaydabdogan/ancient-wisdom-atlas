canonical_text:
  quote: ''
  summary: Duryodhana tells the king not to fear and recounts that, after the Parthas
    were exiled to the woods, Krishna and many allied kings gathered near Indraprastha,
    honored Yudhishthira in deerskin, and urged him to take back the kingdom. Duryodhana
    says he feared destruction of the Kuru kindred and asked Bhishma, Drona, and Kripa
    whether to surrender, flee, or fight. He worries for his blind father and anticipates
    Pandava revenge. Bhishma, Drona, Kripa, and Drona's son reassure him that they
    can defeat the foe, citing Bhishma's former conquest of kings who then sought
    his protection.
  language: English
  quote_policy: summarized
