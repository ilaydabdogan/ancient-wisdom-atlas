canonical_text:
  quote: "“Oh, every thing human is as transitory as a bubble of water.”"
  summary: Sanjaya reports that Subhadra, grieving for her slain son Abhimanyu, laments
    his death in battle, imagines his body on the field, reproaches those who failed
    to protect him, mourns his young wife, reflects on transience and the Destroyer,
    and repeatedly prays that he attain the auspicious end granted to sacrificers,
    virtuous people, and warriors fallen in battle.
  language: English
  quote_policy: quoted
