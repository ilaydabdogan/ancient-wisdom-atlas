canonical_text:
  quote: ''
  summary: Sanjaya reports that Drona's son, enraged and grieving after hearing that
    Drona was killed by Dhrishtadyumna after laying aside his weapons, vows revenge
    on Dhrishtadyumna, Yudhishthira, and the Panchalas. He laments the humiliation
    of Drona's seized locks, declares his filial debt, boasts of unmatched weapon-knowledge,
    and recounts how Narayana granted Drona the Narayana weapon with strict warnings
    about its use. He then declares his intention to use it against the Pandavas and
    their allies.
  language: English
  quote_policy: summarized
