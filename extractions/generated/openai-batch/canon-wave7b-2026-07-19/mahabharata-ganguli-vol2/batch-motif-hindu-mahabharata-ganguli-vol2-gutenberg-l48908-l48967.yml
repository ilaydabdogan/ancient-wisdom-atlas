canonical_text:
  quote: ''
  summary: Sanjaya narrates Satyaki/Yuyudhana's advance in battle. Satyaki tells his
    charioteer that the foes had already been destroyed by Kesava and Phalguna and
    that he is only an apparent instrument. He breaks through the Kuru ranks, is challenged
    by Sudarsana, exchanges arrows with him, kills Sudarsana's horses and driver,
    beheads Sudarsana, and then continues along Arjuna's path while checking the opposing
    troops.
  language: English
  quote_policy: summarized
