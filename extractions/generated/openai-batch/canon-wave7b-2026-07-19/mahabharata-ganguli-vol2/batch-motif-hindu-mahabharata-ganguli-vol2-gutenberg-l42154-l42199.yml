canonical_text:
  quote: ''
  summary: Sanjaya describes Jayadratha, ruler of the Sindhus, entering battle with
    royal insignia and a splendid chariot, shooting many Pandava-side warriors, recovering
    quickly when his bow is cut, disabling Bhima’s car, and single-handedly blocking
    the path through Drona’s array because of a boon from Mahadeva.
  language: English
  quote_policy: summarized
