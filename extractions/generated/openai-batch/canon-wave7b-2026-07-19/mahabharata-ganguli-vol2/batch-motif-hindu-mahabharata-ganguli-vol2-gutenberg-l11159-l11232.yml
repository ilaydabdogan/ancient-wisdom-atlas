candidate_motifs:
- id: motif:1
  label: One soul in two divine warrior forms
  taxonomy_refs:
  - duality
  basis: Bhishma states that Narayana is Krishna, Nara is Falguna, and the two are
    one soul born in two forms.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage uses a paired-divine identity formula, but it does not describe
    biological twins.
- id: motif:2
  label: Recurring birth of divine agents for necessary wars
  taxonomy_refs:
  - return
  basis: The two figures are said to be repeatedly born in worlds when destructive
    wars are necessary, and their mission is said to be fighting.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage states repeated birth and martial mission, but does not give
    a full cycle of death, rebirth, and return.
- id: motif:3
  label: Boon-request for divine military aid
  taxonomy_refs: []
  basis: Indra asks Nara and Narayana to grant him a boon of aid during war, and they
    agree to do what he wishes.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage presents a granted request for aid; it does not describe a
    reciprocal offering or bargain.
- id: motif:4
  label: Divine warriors destroy Asura enemies
  taxonomy_refs: []
  basis: Brahma says Nara and Narayana exist for the destruction of Asuras, and the
    narrative lists victories over Daityas, Danavas, and named Asura groups.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage emphasizes battle and destruction of Asuras, but does not
    explicitly frame this as punishment or judgment.
- id: motif:5
  label: Armed divine pair on a shared chariot as ominous sign
  taxonomy_refs: []
  basis: Bhishma warns Duryodhana that seeing Kesava armed and Arjuna armed on the
    same car will confirm the danger he predicts.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage treats the image as a warning within Bhishma’s speech; broader
    symbolic interpretation requires review.
comparison_claims:
- id: claim:1
  claim: The passage explicitly identifies the contemporary epic pair Vasudeva/Krishna
    and Arjuna/Falguna with the ancient divine pair Narayana and Nara.
  claim_level: same_motif
  target: Nara-Narayana divine pair within the passage
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal textual identification, not an external historical-contact
    claim.
- id: claim:2
  claim: The passage assigns Krishna and Arjuna the same martial, demon-destroying
    function associated with Nara and Narayana.
  claim_level: same_function
  target: Ancient Nara-Narayana as destroyers of Asuras
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The function is stated for conflicts with Asuras and destructive wars;
    the passage does not explicitly call the Kurus Asuras.
- id: claim:3
  claim: The phrase that the two are one soul born in two forms supports a cautious
    comparison to a duality or two-in-one motif family.
  claim_level: same_motif
  target: duality motif family
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a taxonomy-level pattern comparison only; it does not imply
    borrowing, common inheritance, or a complete twin narrative.
