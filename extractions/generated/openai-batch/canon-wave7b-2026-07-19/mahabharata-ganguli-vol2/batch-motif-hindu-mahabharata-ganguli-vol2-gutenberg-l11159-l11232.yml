canonical_text:
  quote: ''
  summary: Bhishma addresses Duryodhana and recounts how celestial beings once approached
    Brahma. Vrihaspati asks Brahma about Nara and Narayana, and Brahma describes them
    as radiant ascetic beings whose purpose is the destruction of Asuras. Indra later
    asks the pair for aid in a war with Asuras, and with their help defeats Daityas
    and Danavas. Bhishma identifies Vasudeva/Krishna and Arjuna/Falguna with Narayana
    and Nara, calls them one soul born in two forms, and warns Duryodhana about their
    united power. Karna then rejects Bhishma’s reproach and vows to fight the Pandavas
    for Duryodhana and Dhritarashtra.
  language: English
  quote_policy: summarized
