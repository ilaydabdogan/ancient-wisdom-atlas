  quote: ''
  summary: The passage first describes the battlefield as a terrible river made from
    the bodies, weapons, animals, and equipment of warriors, running toward Yama’s
    abode and haunted by beings who feed on corpses. It then narrates Drona being
    surrounded and attacked by Pandava-side warriors, but he continues to wound and
    kill opponents, causing Yudhishthira to flee and crushing the Panchalas, Matsyas,
    Kaikeyas, Srinjayas, and Pandavas with Kuru support.
  language: English
  quote_policy: summarized
