canonical_text:
  quote: ''
  summary: Duryodhana, angered by his father's fears about the Pandavas' divine allies,
    argues that the gods do not act from desire or hostility. He boasts that his incantations
    can overpower or restrain fire, cleft earth and mountains, storms, stones, waters,
    snakes, clouds, gods, Asuras, and other beings. He claims his realm is protected
    and orderly, that no divine or supernatural beings can save those who incur his
    displeasure, and that the Pandavas and their allies will be annihilated like rivers
    entering the ocean. He then asks Sanjaya about Yudhishthira's war preparations.
  language: English
  quote_policy: summarized
