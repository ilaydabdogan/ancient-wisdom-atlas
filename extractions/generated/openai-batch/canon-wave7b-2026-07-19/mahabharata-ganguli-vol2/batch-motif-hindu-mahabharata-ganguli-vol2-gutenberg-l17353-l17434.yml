canonical_text:
  quote: Blaze up (like a well-fed fire).
  summary: Vidula, a learned high-born woman devoted to Kshatriya virtues, rebukes
    her son Sanjaya after his defeat by the king of the Sindhus. She urges him to
    rise from despair, abandon fear, pursue martial honor, recover his lost standing,
    and act for the prosperity of his kingdom rather than live in weakness or disgrace.
  language: English
  quote_policy: quoted
