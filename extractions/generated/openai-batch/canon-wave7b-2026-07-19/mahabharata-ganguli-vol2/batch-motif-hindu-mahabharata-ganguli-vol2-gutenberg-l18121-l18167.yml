canonical_text:
  quote: ''
  summary: Sanjaya reports Kesava speaking to Karna. Kesava says Pandava victory is
    certain, describes Arjuna's ape-banner and coming battlefield signs, foretells
    feats of Arjuna, Yudhishthira, Bhimasena, and the sons of Madri, and instructs
    Karna to tell the opposing leaders to begin battle on the new-moon day presided
    over by Indra. He adds that kings dying by weapons will attain an excellent state.
  language: English
  quote_policy: summarized
