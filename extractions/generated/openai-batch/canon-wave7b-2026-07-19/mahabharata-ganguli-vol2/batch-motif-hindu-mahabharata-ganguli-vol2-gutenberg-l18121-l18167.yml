candidate_motifs:
- id: motif:1
  label: Celestial victory standard
  taxonomy_refs: []
  basis: Arjuna's standard is described as divinely made, bearing a fierce ape and
    celestial creatures that indicate victory, and as radiantly unobstructed when
    raised.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage identifies the standard as a victory sign but does not narrate
    its origin beyond Bhaumana's construction.
- id: motif:2
  label: Battle as transition into Kali's presence
  taxonomy_refs:
  - chaos
  basis: The passage repeatedly says that when key battlefield acts occur, the signs
    of the Krita, Treta, and Dwapara ages disappear and Kali embodied is present.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The supplied taxonomy label 'chaos' is only a broad fit; the passage specifically
    emphasizes age-sign disappearance and Kali's presence, not a full cosmogonic chaos
    narrative.
- id: motif:3
  label: Divine charioteer and celestial weapons in decisive battle
  taxonomy_refs: []
  basis: Arjuna is predicted to enter battle in a white-steed chariot driven by Krishna
    and to use Aindra, Agneya, and Maruta weapons while Gandiva sounds like thunder.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage presents these as predicted battlefield details; no separate
    initiation or quest pattern is stated.
- id: motif:4
  label: Blood-drinking vengeance in battle
  taxonomy_refs: []
  basis: Bhimasena is predicted to drink Dussasana's blood and dance like a fierce
    elephant after overcoming an antagonist.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage gives the violent act as prophecy without explaining its prior
    cause in this excerpt.
- id: motif:5
  label: Auspiciously timed battle by season, lunar phase, and divine presiding day
  taxonomy_refs: []
  basis: Kesava cites abundant supplies, good roads and water, mild weather, and a
    new-moon day presided over by Indra as reasons to commence battle after seven
    days.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This is a campaign-timing motif rather than one of the supplied motif-family
    taxonomy labels.
- id: motif:6
  label: Death by weapons leading to an excellent state
  taxonomy_refs: []
  basis: Kesava says kings and princes obedient to Duryodhana who obtain death by
    weapons will attain an excellent state.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage states the posthumous outcome but does not describe an afterlife
    journey or judgment process.
