    the victory of the Pandavas is certain.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Arjuna's standard bears a fierce ape, is said to be constructed with celestial
    illusion by the divine artificer Bhaumana, displays terrific celestial creatures
    indicating victory, extends widely upward and around, resembles fire in radiance,
    and is unobstructed by hills or trees when raised.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kesava predicts that Arjuna will be seen in battle on a chariot drawn by white
    steeds and driven by Krishna, using Aindra, Agneya, and Maruta weapons, while
    the sound of Gandiva pierces the sky like thunder.
  category: action
  evidence_refs:
  - ev:3
