canonical_text:
  quote: ''
  summary: Sanjaya reports that Arjuna has broken through the Bharata host and slain
    or overcome several warriors. Duryodhana, fearing for Jayadratha, appeals angrily
    to Drona, accusing him of partiality to the Pandavas and asking him to save Jayadratha.
    Drona says Arjuna’s speed is aided by Krishna and that he cannot abandon his own
    vow to seize Yudhishthira, so Duryodhana should fight Arjuna himself. Duryodhana
    protests that Arjuna is invincible and asks Drona to protect his fame.
  language: English
  quote_policy: summarized
