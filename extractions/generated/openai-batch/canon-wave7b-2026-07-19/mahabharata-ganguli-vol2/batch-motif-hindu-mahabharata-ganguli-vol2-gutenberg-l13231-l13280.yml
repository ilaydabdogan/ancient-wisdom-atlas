canonical_text:
  quote: ''
  summary: A holy speaker explains to Bhima that his earlier words were spoken from
    affection, praises Bhima's strength and usefulness to the Pandava cause, and teaches
    that human action has uncertain results because both Providence and exertion shape
    outcomes. He counsels action without excessive grief at failure or delight at
    success. He then states that he will go to Dhritarashtra to seek peace without
    harming the Pandavas' interests; if the Kauravas reject peace, war will follow,
    with Bhima and Arjuna bearing the chief burden, and the speaker serving as driver
    of Vibhatsu's car.
  language: English
  quote_policy: summarized
