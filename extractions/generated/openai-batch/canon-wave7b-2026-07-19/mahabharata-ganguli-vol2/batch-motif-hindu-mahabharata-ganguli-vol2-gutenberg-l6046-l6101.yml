canonical_text:
  quote: ''
  summary: Satyaki rebukes a plough-bannered addressee and defends Yudhishthira against
    blame for the dice loss. He argues that Yudhishthira was tricked by skilled dice
    players, fulfilled the agreed stakes, completed the forest and concealment terms,
    and remains entitled to his ancestral throne. Satyaki rejects begging before enemies,
    urges armed coercion, lists powerful allied warriors, and vows to slay Dhritarashtra's
    son, Sakuni, and Karna if the kingdom is not restored.
  language: English
  quote_policy: summarized
