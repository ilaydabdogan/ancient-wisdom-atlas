canonical_text:
  quote: ''
  summary: Sanjaya describes daybreak before battle. The Kuru and Pandava armies complete
    their arrays at sunrise amid conches, drums, elephants, chariots, weapons, armor,
    and standards. Named Kaurava-aligned commanders stand at the heads of divisions
    under Duryodhana. Bhishma stands in the vanguard with white regalia and a palmyra
    standard, frightening Dhrishtadyumna’s side. The two armies face each other and
    are compared to two oceans at the end of the Yuga.
  language: English
  quote_policy: summarized
