canonical_text:
  quote: ''
  summary: Prince Uttara says he can pursue and recover the cattle taken by the Kurus
    if a skilled charioteer is found. Arjuna, concealed as Vrihannala, privately asks
    Draupadi to recommend Vrihannala as a tested charioteer. Draupadi publicly praises
    Vrihannala’s skill and past service, and suggests that Uttara’s younger sister
    ask Vrihannala. Uttara sends his sister to the dancing-hall, where the disguised
    son of Pandu is staying.
  language: English
  quote_policy: summarized
