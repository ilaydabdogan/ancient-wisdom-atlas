- id: obs:1
  text: Uttara declares that he is firm in the use of the bow but needs someone skilled
    in managing horses to serve as his charioteer before he can follow the track of
    the cattle.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Uttara says his own charioteer was slain in a great battle lasting a month
    or twenty-eight nights.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Uttara vows to hoist his standard, enter the hostile army, vanquish the Kurus,
    frighten named warriors, and bring back the cattle.
  category: speech
  evidence_refs:
  - ev:1
  - ev:8
- id: obs:4
  text: Arjuna privately instructs Draupadi to tell Uttara that Vrihannala was formerly
    the accomplished charioteer of Arjuna and should serve as Uttara’s charioteer.
  category: action
  evidence_refs:
  - ev:2
