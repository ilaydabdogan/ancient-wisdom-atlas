canonical_text:
  quote: '"between one and the many"'
  summary: Dhritarashtra asks Sanjaya to recount Abhimanyu's youthful one-against-many
    battle, comparing it to Skanda's encounter with the Asura host. Sanjaya describes
    Abhimanyu attacking many Kaurava warriors, Drona praising him, Duryodhana accusing
    Drona of protecting Arjuna's son, and Duhsasana vowing to kill Abhimanyu before
    engaging him in a chariot duel amid loud battle music and roars.
  language: English
  quote_policy: quoted
