- id: obs:2
  text: Vidura says fear is dispelled by self-knowledge, greatness is won by asceticism,
    learning is acquired by attending superiors, and peace is gained by self-restraint.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Vidura associates alienation from relatives with sleeplessness, loss of pleasure,
    inability to practice virtue, and destruction.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vidura compares good relatives united together to many thin threads able to
    bear strain and to burning brands that blaze when brought together.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Vidura says those who tyrannise over Brahmanas, women, relatives, and kine
