    did not follow his words.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Vidura says true policy is strength mixed with softness, that prosperity based
    only on crookedness will be destroyed, and that prosperity based on both strength
    and softness descends to descendants.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Vidura urges the king's sons and the Pandavas to cherish each other and says
