  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Vidura contrasts a single strong tree smashed by wind with compactly growing
    trees that resist stronger winds through mutual dependence.
  category: relationship
  evidence_refs:
  - ev:4
