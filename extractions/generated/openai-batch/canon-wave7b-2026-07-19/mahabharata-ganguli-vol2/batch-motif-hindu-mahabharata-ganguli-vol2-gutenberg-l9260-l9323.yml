  summary: Vidura advises Dhritarashtra that knowledge, asceticism, self-restraint,
    abandonment of avarice, kinship unity, anger-control, honest policy, and reconciliation
    with the Pandavas are necessary for peace and preservation of the Kuru line.
  language: English
  quote_policy: summarized
