canonical_text:
  quote: ''
  summary: Sanjaya narrates the morning advance of Bhishma and the Bharata/Kuru army
    against Arjuna. The armies are described through images of gods, clouds, lightning,
    the rainy-season sky, and the current of the Ganga. Arjuna appears with white
    steeds, Krishna as charioteer, and the ape-bannered standard. Battle sounds, dust,
    and clashes between chariots, elephants, horsemen, and foot-soldiers follow, with
    many warriors and objects falling on the field.
  language: English
  quote_policy: summarized
