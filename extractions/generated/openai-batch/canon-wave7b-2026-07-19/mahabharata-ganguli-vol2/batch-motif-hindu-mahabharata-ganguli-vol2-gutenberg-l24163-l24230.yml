canonical_text:
  quote: ''
  summary: A speaker addressing Sanjaya laments the reported death of Bhishma. He
    asks how the Pandavas could strike such an invincible, wise, and revered warrior;
    recalls Bhishma’s former greatness and victory over Rama son of Jamadagni; identifies
    Sikhandin as Bhishma’s slayer; compares the Kuru army and sons to beings bereft
    of protection; reflects that no quality can avert death or transgress Time; and
    concludes with a meditation on Kshatriya duty, sovereignty, and Bhishma being
    offered as a sacrifice.
  language: English
  quote_policy: summarized
