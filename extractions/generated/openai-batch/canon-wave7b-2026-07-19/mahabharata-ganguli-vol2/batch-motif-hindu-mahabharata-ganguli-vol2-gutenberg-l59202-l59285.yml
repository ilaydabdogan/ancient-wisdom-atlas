  quote: ''
  summary: A group of warriors attacks Aswatthaman, who repels their arrows, wounds
    several opponents, and kills Sudarsana, a Paurava prince, and a Chedi prince.
    Bhima becomes enraged and enters a prolonged arrow duel with Aswatthaman. The
    combat is described through images of poisonous snakes, rain-clouds, fire, sun,
    locusts, and Yama-associated death.
