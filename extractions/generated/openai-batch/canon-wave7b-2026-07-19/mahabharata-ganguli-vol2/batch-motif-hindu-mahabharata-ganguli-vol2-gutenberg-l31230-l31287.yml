canonical_text:
  quote: ''
  summary: Sanjaya narrates a battlefield sequence in which Duryodhana urges allied
    kings and Susarman to protect Bhishma as he advances against Arjuna. Arjuna appears
    on a resplendent chariot with white horses and an ape-banner, with Krishna holding
    the reins. Bhishma also appears in white martial splendor and is surrounded by
    allies. In a separate combat, Drona disables Virata’s chariot; Virata joins his
    son Sankha on another car, and Drona kills Sankha with a snake-like arrow, after
    which Virata flees and Drona checks the Pandava host.
  language: English
  quote_policy: summarized
