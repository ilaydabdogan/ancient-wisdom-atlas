canonical_text:
  quote: ''
  summary: Sanjaya narrates that Arjuna, grieving over his vow to kill Jayadratha,
    falls asleep after remembering mantras. Krishna appears in Arjuna's dream, counsels
    him not to yield to grief, and advises remembrance and worship of the bull-marked
    god Maheswara/Bhava for the Pasupata weapon. Arjuna meditates, sees himself traveling
    through the sky with Krishna across sacred mountains, rivers, gardens, forests,
    and divine regions, and reaches a blazing mountain where he beholds the bull-marked
    god.
  language: English
  quote_policy: summarized
