canonical_text:
  quote: ''
  summary: In a tenth-day battle scene, Bhishma is pierced by Sikhandin and Arjuna.
    Arjuna places Sikhandin in front, repeatedly cuts Bhishma's bows, standard, dart,
    and shield, and wounds him severely. Bhishma tells Dussasana that the painful
    arrows are Arjuna's, not Sikhandin's. Yudhishthira urges an attack on Bhishma;
    the armies clash in a gore-soaked, vortex-like battle. Bhishma remains calm despite
    wounds and kills many warriors before Arjuna breaks the Kuru center and the Kuru
    side flees.
  language: English
  quote_policy: summarized
