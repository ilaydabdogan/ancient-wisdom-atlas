  quote: ''
  summary: An unnamed adviser says the duties of the four orders have been explained
    and urges the king to place Yudhishthira, son of Pandu, where he can perform kingly
    duties. Dhritarashtra replies that he agrees with the counsel and inclines toward
    the Pandavas, but his mind changes when he is with Duryodhana. He concludes that
    fate cannot be averted and that individual effort is futile.
