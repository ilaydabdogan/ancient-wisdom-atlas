canonical_text:
  quote: ''
  summary: Bhishma recounts a hymn said to have been uttered by Brahman and transmitted
    by sages and gods. The hymn praises Kesava/Hari/Krishna as supreme, cosmic, creative,
    and the refuge of ascetics and royal sages. Sanjaya reports that the king begins
    to regard Kesava and the sons of Pandu highly. Bhishma then explains that Nara
    and Narayana have taken births among humans, that these heroes and the Pandavas
    are invincible, and that peace should be made with the Pandavas; he warns that
    disregarding divine Nara and Narayana will bring destruction. Bhishma retires
    to his tent, and the king worships him and goes to sleep.
  language: English
  quote_policy: summarized
