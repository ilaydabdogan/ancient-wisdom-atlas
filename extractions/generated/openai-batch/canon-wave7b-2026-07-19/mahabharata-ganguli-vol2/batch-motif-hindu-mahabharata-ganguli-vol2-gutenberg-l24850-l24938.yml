canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanjaya about the opening of battle. Sanjaya reports
    that both armies were cheerful and that their collision was accompanied by instruments,
    conches, shouts, and elephants. Duryodhana, seeing the Pandava army, addresses
    Drona, names warriors on both sides, and commands the protection of Bhishma. Bhishma
    roars and blows his conch; Krishna, Arjuna, and other warriors answer with conches.
    Arjuna asks Krishna to place their chariot between the armies so he can see those
    assembled to fight. Krishna does so, and Arjuna sees kinsmen and well-wishers
    in both armies and becomes overcome by pity and despondency.
  language: English
  quote_policy: summarized
