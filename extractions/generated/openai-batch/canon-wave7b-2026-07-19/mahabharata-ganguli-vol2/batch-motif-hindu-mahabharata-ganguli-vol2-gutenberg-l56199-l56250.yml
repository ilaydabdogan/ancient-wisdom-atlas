canonical_text:
  quote: ''
  summary: Sanjaya narrates the arrival of the Rakshasa prince Alayudha during a night
    battle. Alayudha approaches Duryodhana with a frightening Rakshasa force, recalls
    grievances against Bhima for the deaths of his kin and friend, and offers to slay
    and devour Bhima and other Pandava-side figures. Duryodhana accepts his aid but
    keeps his own troops engaged. Alayudha advances against Bhima in a blazing chariot
    repeatedly compared to Ghatotkacha’s, with monstrous steeds, weapons, and ominous
    standards, and Pandava kings engage him.
  language: English
  quote_policy: summarized
