canonical_text:
  quote: '"I am lying on a bed of arrows."'
  summary: At dawn, kings, Pandavas, Dhartarashtras, and spectators gather around
    Bhishma on his bed of arrows. Bhishma refuses ordinary food and water, says he
    is beyond human enjoyment, and asks Arjuna for water. Arjuna uses Gandiva, mantras,
    and the Parjanya weapon to pierce the earth, producing a pure, cool, nectar-like
    jet that quenches Bhishma's thirst. Bhishma praises Arjuna's superhuman prowess
    and urges Duryodhana to abandon wrath after noting his refusal to heed counsel.
  language: English
  quote_policy: quoted
