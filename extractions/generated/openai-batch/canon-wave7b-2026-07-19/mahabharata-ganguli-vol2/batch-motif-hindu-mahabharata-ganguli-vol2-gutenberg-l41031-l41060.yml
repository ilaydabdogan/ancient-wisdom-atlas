canonical_text:
  quote: ''
  summary: Sanjaya narrates that, after slaying Bhagadatta and circumambulating him,
    Arjuna is attacked by the Gandhara brothers Vrishaka and Achala. Arjuna disables
    Vrishaka's chariot, kills many Gandhara warriors, withstands the brothers' renewed
    attack from one chariot, and finally kills both brothers with a single arrow.
  language: English
  quote_policy: summarized
