canonical_text:
  quote: ''
  summary: Yudhishthira approaches Bhishma, Drona, Kripa, and Salya before battle.
    He salutes or circumambulates these elder warriors, asks permission to fight without
    sin, seeks prayers or counsel for victory, and asks how invincible opponents may
    be defeated. Bhishma says his death time has not come. Drona, Kripa, and Salya
    state that wealth binds them to fight for the Kauravas, while granting permission,
    prayers, or goodwill toward Yudhishthira. Drona also links victory with Hari/Krishna
    and righteousness, and reveals the condition under which he would lay aside arms
    and become killable.
  language: English
  quote_policy: summarized
