canonical_text:
  quote: ''
  summary: Sanjaya narrates a duel between Drona and Yuyudhana/Satyaki. Drona advances
    with serpent and storm imagery; Yuyudhana orders his charioteer forward; both
    warriors cover the sky with arrows until the sun is hidden and the battlefield
    falls silent to watch. Celestial beings observe from sky-ranging cars. Satyaki
    repeatedly cuts off Drona's shafts and bows, prompting Drona to think of Satyaki's
    weapon-force as comparable to that of several renowned warriors.
  language: English
