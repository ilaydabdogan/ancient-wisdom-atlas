canonical_text:
  quote: ''
  summary: After Abhimanyu's death, grief and blame spread among the Pandava side.
    Yuyutsu rebukes the Dhritarashtra warriors for rejoicing over the killing of a
    child and casts away his weapons. Krishna consoles Arjuna by describing heroic
    battle-death as the ordained Kshatriya goal and saying Abhimanyu has ascended
    to righteous regions. Arjuna asks how Abhimanyu fought, vows to destroy his son's
    slayers, reproaches his allies for failing to protect him, and sits in terrible
    grief and wrath until Yudhishthira begins to address him.
  language: English
