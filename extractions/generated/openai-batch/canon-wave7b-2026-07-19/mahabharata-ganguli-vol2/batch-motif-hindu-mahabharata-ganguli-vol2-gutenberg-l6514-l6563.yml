canonical_text:
  quote: ''
  summary: 'Salya narrates that Indra sends celestial nymphs to tempt a three-headed
    ascetic being, but they cannot disturb him. Indra then kills the being with a
    fire-like thunderbolt. The dead body remains luminous and frightening, and Indra
    orders a passing carpenter to cut off its heads. The carpenter objects on moral
    grounds, naming the deed as Brahmana-killing. Indra promises later purification
    and grants the carpenter a future ritual share: the head of the sacrificial beast.'
  language: English
  quote_policy: summarized
