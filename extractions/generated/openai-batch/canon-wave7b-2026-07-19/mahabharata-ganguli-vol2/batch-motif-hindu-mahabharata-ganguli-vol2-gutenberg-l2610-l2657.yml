  quote: '"Uprooting this mighty tree of huge trunk looking like a mace, I will rout
    the enemy."'
  summary: During a night battle made visible by the moon, Susarman and his brother
    capture King Virata. Yudhishthira urges Bhima to rescue Virata as repayment for
    their stay in Virata's city. Bhima proposes to uproot a great tree as a weapon,
    but Yudhishthira forbids a superhuman act that would reveal Bhima's identity and
    instructs him to use ordinary human weapons while the twins guard his wheels.
  language: English
