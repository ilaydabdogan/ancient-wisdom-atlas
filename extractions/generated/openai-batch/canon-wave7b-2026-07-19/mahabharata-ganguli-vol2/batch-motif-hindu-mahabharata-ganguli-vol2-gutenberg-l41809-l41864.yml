canonical_text:
  quote: ''
  summary: Dhritarashtra asks who tried to check Abhimanyu as he broke the Kaurava
    car-ranks. Sanjaya recounts that Abhimanyu killed Salya's younger brother with
    rapid arrow-work, causing his followers to flee and others to praise the feat.
    A larger group of warriors then charged him with threats and noise. Abhimanyu,
    using weapons received from Vasudeva and Dhananjaya, fought with great speed,
    solar and storm-like imagery, and covered the Kaurava car-division with arrows
    until the army turned away.
  language: English
  quote_policy: summarized
