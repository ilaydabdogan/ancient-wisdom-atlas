  summary: Narada narrates that king Yayati, after being recognized by virtuous persons,
    rises again to heaven without touching earth. Vasumanas, Pratardana, Sivi, and
    Ashtaka each offer him merit, truth, or sacrificial merit, and these daughter's
    sons cause their maternal grandfather to ascend again to heaven.
