canonical_text:
  quote: ''
  summary: Vaisampayana narrates that Kesava hears Bhima's unexpectedly mild words,
    laughs, and tries to stir him by recalling his warlike anger, his oath to kill
    Duryodhana with a mace, and his usual desire for battle. Kesava accuses Bhima
    of fear and despair, says his brothers' hearts will sink, and urges him to arise
    and act according to Kshatriya prowess.
