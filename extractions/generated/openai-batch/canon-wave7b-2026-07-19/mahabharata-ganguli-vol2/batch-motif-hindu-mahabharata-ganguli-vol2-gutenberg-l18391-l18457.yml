canonical_text:
  quote: ''
  summary: Karna hears Surya confirm Kunti's words, but he refuses to join her sons.
    He cites Kunti's abandonment of him, his lost Kshatriya rites, fear of dishonor
    if he changes sides before battle, and loyalty to Dhritarashtra's sons. He vows
    to fight Arjuna alone and to spare Kunti's other four sons, so that Kunti will
    still have five sons whether Karna or Arjuna dies. Kunti embraces him, asks him
    to remember the pledge, blesses him, and they depart separately.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vaisampayana reports that Karna heard an affectionate voice from the solar
    circle, uttered by Surya with paternal affection, confirming that Pritha's words
    were true and urging Karna to act according to his mother's words.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Karna remains unwavered despite being addressed by both his mother and his
    father Surya, because he is described as firmly devoted to truth.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Karna tells Kunti that she abandoned him at birth, exposed him to danger,
    and deprived him of the rites due to a Kshatriya.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Karna says that if he goes to the Pandavas on the eve of battle after revealing
    he is their brother, others would think he acted from fear of Arjuna, who has
    Krishna as charioteer.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Karna says Dhritarashtra's sons have furnished and honored him, depend on
    his strength, and are like men wishing to cross an impassable ocean of battle
    with him as their boat.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Karna declares he will fight for Dhritarashtra's son, even recklessly of his
    life, and will not speak deceitfully to Kunti.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Karna pledges not to slay Yudhishthira, Bhima, and the twins, though he says
    he could withstand and kill them; he will fight only Arjuna among Yudhishthira's
    combatants.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Karna tells Kunti that the number of her sons will always remain five, either
