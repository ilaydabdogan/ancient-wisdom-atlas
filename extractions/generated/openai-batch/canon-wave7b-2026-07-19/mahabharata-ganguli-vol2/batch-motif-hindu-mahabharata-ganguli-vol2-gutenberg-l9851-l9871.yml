  summary: The passage presents a sequence of aphoristic statements about pitiable
    conditions, sources of weakness, impurity or decline, and the futility of satisfying
    desire by feeding it. It then addresses Dhritarashtra directly, telling him to
    forsake desire, recognize that possessions cannot satiate even one person, avoid
    grief over lack of universal dominion, and treat the sons of Pandu and his own
    sons equally.
