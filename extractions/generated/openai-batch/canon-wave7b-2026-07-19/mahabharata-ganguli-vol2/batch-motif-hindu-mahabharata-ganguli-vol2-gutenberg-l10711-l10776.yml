  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Knowledge of Brahman is said to free the Soul from grief and ignorance and
    to impart wisdom obtained by those who restrain the mind.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: One who beholds the Self in everything is said to have no grief, and the purposes
