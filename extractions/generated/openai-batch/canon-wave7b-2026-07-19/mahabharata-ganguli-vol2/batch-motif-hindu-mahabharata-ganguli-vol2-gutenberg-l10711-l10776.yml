canonical_text:
  quote: ''
  summary: The passage describes the Supreme Soul or Brahman as Pure Knowledge, unseen
    except by restrained and pure-hearted Yogins. It teaches purification of mind,
    release from grief, and the knowledge of the Self in all things. It warns against
    persons who conceal vice like serpents in holes. It describes the emancipated
    knower as beyond birth, death, joy, grief, virtue, and vice, and presents Brahman
    as indwelling the heart, subtler than the subtle, awake in every creature, and
    identified with universal kinship and the fabric of the universe.
  language: English
  quote_policy: summarized
literal_observations:
