  text: The Supreme Soul is also named Pure Knowledge and is obtained or beheld by
    those who restrain the mind, especially Yogins using the mental eye.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: All living creatures are said to be merged into the Supreme Soul, and knowing
    the embodiment of Fullness is said to lead to emancipation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Purification of heart is associated with seeking the good of all, controlling
    the mind, and not letting the heart be affected by grief; abandoning the world
    and its cares is linked with becoming immortal.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some persons are compared to serpents concealing themselves in holes; they
    conceal vices, deceive people of little sense, and lead victims to hell.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The emancipate person thinks the transitory organism cannot make the self
    liable to joy, grief, death, or birth.
