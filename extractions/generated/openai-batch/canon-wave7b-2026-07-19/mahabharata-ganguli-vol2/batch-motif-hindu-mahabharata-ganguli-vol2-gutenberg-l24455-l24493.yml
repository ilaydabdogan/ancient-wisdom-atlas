canonical_text:
  quote: ''
  summary: Sanjaya narrates to the king the beginning of a massive battle encounter.
    The armies of the king’s sons and the Pandavas tremble amid conches, drums, elephants,
    chariots, horses, and shouts. Gold-decked elephants, chariots, standards, and
    warriors are described through similes of clouds, lightning, fire, the Sun, Indra’s
    banners, and the rivers Ganga and Yamuna. Named warriors and allied peoples guard
    Bhishma with large divisions of chariots, elephants, and infantry.
  language: English
