canonical_text:
  quote: ''
  summary: Sanjaya narrates that after night rest the Kurus and Pandavas prepare for
    battle at dawn. Yudhishthira orders Dhrishtadyumna to form the Pandava army in
    the Makara array, with named warriors assigned to creature-like body positions.
    Bhishma sees this and arranges the Kaurava army in a huge crane array, also assigning
    named warriors and groups to body positions. Battle begins at sunrise with elephants,
    horsemen, car-warriors, and infantry engaging one another. Bhima attacks Drona’s
    division; Drona wounds Bhima, Bhima kills Drona’s charioteer, and Drona continues
    fighting while driving his own horses. Both armies suffer distress, flight, and
    reciprocal weapon-countering.
  language: English
  quote_policy: summarized
