  summary: A first-person speaker instructs Uluka to deliver provocative battle messages
    to Yudhishthira, Vasudeva/Krishna, Bhima, Nakula, Sahadeva, Virata, Drupada, Dhrishtadyumna,
    and Sikhandin. The messages urge Kshatriya conduct, recall past wrongs and vows,
