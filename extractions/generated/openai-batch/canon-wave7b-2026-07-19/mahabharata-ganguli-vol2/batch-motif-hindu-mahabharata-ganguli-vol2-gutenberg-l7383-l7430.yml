canonical_text:
  quote: ''
  summary: Bhishma responds to a Brahmana envoy by acknowledging the Pandavas' hardship,
    their legal claim to their father's property, Arjuna's exceptional martial power,
    and their desire for peace. Karna interrupts and argues that Yudhishthira must
    honor the dice-game stipulation and that Duryodhana will not surrender land from
    fear. Bhishma warns that Arjuna previously defeated six car-warriors single-handedly
    and that ignoring the envoy's advice will lead to destruction. Dhritarashtra calms
    Bhishma, rebukes Karna, honors Drupada's priest, sends him back to the Pandavas,
    and prepares to send Sanjaya.
  language: English
  quote_policy: summarized
