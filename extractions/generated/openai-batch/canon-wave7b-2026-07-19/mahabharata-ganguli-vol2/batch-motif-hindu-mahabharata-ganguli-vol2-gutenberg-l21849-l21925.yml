canonical_text:
  quote: ''
  summary: Bhishma recounts that heavenly voices, Narada, the gods, Brahma-utterers,
    Rama's ancestors, ascetics, and Bhagirathi intervene to stop his battle with Rama.
    Bhishma withdraws the Praswapa weapon, both combatants initially refuse to desist
    because of vows, and Rama is finally caused to lay aside his weapons. Bhishma
    approaches and honors Rama, who praises him and then summons the daughter of Kasi.
  language: English
  quote_policy: summarized
