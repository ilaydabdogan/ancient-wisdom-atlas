canonical_text:
  quote: ''
  summary: Duryodhana, Karna, Sakuni, and Dussasana resolve to seize Kesava/Krishna
    in order to weaken the Pandavas. Satyaki discovers the plot, prepares a military
    response through Kritavarman, and informs Kesava, Dhritarashtra, and Vidura. Satyaki,
    Vidura, Kesava, and Dhritarashtra each describe the plan as impossible or censurable.
    Kesava states that he could overcome the conspirators but refuses to commit a
    wrathful or sinful act. Dhritarashtra summons Duryodhana and rebukes him, comparing
    any attempt to seize Kesava to impossible acts such as grasping the wind or reaching
    the moon.
  language: English
  quote_policy: summarized
