canonical_text:
  quote: ''
  summary: Vaisampayana narrates that Krishna visits Kunti after the Kuru assembly,
    reports that Duryodhana rejected counsel, and asks for Kunti's message to the
    Pandavas. Kunti instructs Krishna to tell Yudhishthira to act according to Kshatriya
    duty, recover his paternal kingdom, protect subjects, and avoid disgrace or sin.
    She supports this instruction with the example of Muchukunda, teachings on royal
    punishment, the king's relation to social order and the yugas, and warnings about
    heaven, hell, lineage, and dependence.
  language: English
  quote_policy: summarized
