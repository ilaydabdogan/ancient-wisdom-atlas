canonical_text:
  quote: '"slay, O mighty-armed one, the enemy in the shape of desire"'
  summary: The Holy One describes desire and wrath as a passion-born foe that envelops
    knowledge, compares this concealment to smoke around fire, dust on a mirror, and
    a foetus in the womb, and instructs the addressee to restrain the senses and overcome
    desire. He then says he formerly declared an imperishable system of devotion to
    Vivaswat, who transmitted it to Manu, who communicated it to Ikshaku; after it
    was lost over time, he declares it again to Arjuna, who questions how this could
    be given their relative births.
  language: English
  quote_policy: quoted
