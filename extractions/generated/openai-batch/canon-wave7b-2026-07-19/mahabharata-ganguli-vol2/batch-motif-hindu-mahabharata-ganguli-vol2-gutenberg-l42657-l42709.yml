canonical_text:
  quote: '"An awful river, difficult to cross, like the Vaitarani itself..."'
  summary: Sanjaya describes a bloody evening retreat from battle. At twilight, ominous
    sounds and the setting sun frame a field covered with dead men, animals, broken
    chariots, weapons, and feeding scavengers and spirits. The battlefield is imagined
    as a terrible blood-river like Vaitarani, carrying beings toward the realm of
    the dead. The warriors leave after seeing Abhimanyu lying fallen, compared to
    Sakra and to a sacrificial fire no longer fed with clarified butter.
  language: English
  quote_policy: quoted
