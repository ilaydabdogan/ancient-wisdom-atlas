canonical_text:
  quote: ''
  summary: 'Sanjaya narrates a series of battlefield encounters: Abhimanyu fights
    Duryodhana and later Vrihadvala; Aswatthaman exchanges arrows with Satyaki; Paurava
    and Dhrishtaketu pass from chariot fighting to a sword duel after their bows and
    steeds are destroyed; Chitrasena and Susarman exchange arrow-strikes. The passage
    closes by comparing the Abhimanyu-Vrihadvala combat to the encounter of Vali and
    Vasava during the battle between gods and Asuras.'
  language: English
  quote_policy: summarized
