canonical_text:
  quote: ''
  summary: Vidura addresses a monarch, praises his established virtue, urges sincerity,
    warns against destroying his kin, rejects the king’s intended hospitality to Kesava
    as deceptive, states that the Pandavas seek only five villages, affirms that Krishna
    cannot be separated from Dhananjaya, specifies minimal hospitality Janardana will
    accept, and urges the king to follow Kesava’s peace counsel and behave as a father
    toward the Pandavas.
  language: English
  quote_policy: summarized
