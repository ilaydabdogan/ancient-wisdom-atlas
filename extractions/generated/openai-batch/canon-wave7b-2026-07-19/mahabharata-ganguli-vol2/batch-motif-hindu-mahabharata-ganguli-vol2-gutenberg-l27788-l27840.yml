canonical_text:
  quote: ''
  summary: Sanjaya reports that after the first day’s fighting, Yudhishthira, grieving
    over defeat and Bhishma’s prowess, goes to Krishna with his brothers and allied
    kings. Yudhishthira says Bhishma is destroying his troops like fire consuming
    dry grass, appears harder to defeat than major divine figures, and leaves him
    like a man sinking in an ocean without a boat. He considers retreating to the
    woods and practicing austerities rather than causing allies to die. He says Arjuna
    watches indifferently while Bhima fights, and asks Krishna to find a great bowman
    who can bring Bhishma down like rain clouds quenching a forest fire.
  language: English
  quote_policy: summarized
