canonical_text:
  quote: '"If fall I must, let me fall amongst the righteous."'
  summary: Narada recounts that Yayati, deprived of his celestial place after his
    merits are exhausted and after being charged with pride, falls from heaven. He
    asks to fall among the righteous and descends toward four kings performing a Vajapeya
    sacrifice in the woods of Naimisha, guided by sacrificial smoke that reaches heaven
    and is compared to a river and to the descending Ganga. The kings, Madhavi, and
    Galava offer virtues or ascetic merit so that Yayati may be rescued and ascend
    to heaven again.
  language: English
  quote_policy: quoted
