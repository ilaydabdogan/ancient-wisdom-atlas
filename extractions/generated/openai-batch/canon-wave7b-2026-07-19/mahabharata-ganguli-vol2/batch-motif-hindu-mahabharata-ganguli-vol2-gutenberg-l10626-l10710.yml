canonical_text:
  quote: ''
  summary: Sanat-sujata describes a primary Seed called Mahayasas or TATH/Tad as a
    pure, self-luminous, divine source and support of the cosmos, visible to Yogins
    by mental vision. The passage uses images of body as car, illusion as a stream,
    Avidya as a golden-foliaged tree, the Supreme Soul as four-legged like a swan
    over an ocean, and emancipation as honey flowing for the liberated. It treats
    souls, births, sacrifices, vital airs, states of consciousness, and knowledge
    of Self and Not-Self in relation to the Supreme principle.
