canonical_text:
  quote: ''
  summary: A speaker identified within the passage as Brahma praises Krishna/Vasudeva
    as refuge, guide, cosmic support, and source of divine emanations. He says beings
    were created through Krishna’s grace, asks Krishna to take birth in the Yadu race
    to establish righteousness and slay Asuras, recounts a sequence of emanations
    from Krishna to Sankarshana, Pradyumna, Aniruddha, and Brahma, and says Rishis,
    gods, and all creatures take refuge in him and sing him as the world’s bridge.
  language: English
  quote_policy: summarized
