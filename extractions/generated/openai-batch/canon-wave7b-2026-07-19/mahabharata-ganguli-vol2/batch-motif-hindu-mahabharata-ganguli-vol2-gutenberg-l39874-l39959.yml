  summary: Sanjaya narrates Arjuna ordering Krishna to drive toward the Samsaptakas,
    the encirclement of Arjuna and Krishna by arrows, Arjuna's use of the Tvashtra
    and Vayavya weapons, the enemies' confusion and mutual slaughter, and the devastation
    of the battlefield, while Drona advances against Yudhishthira elsewhere.
  language: English
  quote_policy: summarized
