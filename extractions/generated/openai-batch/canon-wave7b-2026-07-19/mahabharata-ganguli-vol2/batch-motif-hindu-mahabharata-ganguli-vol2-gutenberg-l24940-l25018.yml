canonical_text:
  quote: ''
  summary: Arjuna, seeing kinsmen and revered elders arrayed for battle, is overcome
    by bodily distress and moral grief. He argues that killing kin would bring sin,
    destroy family customs, interrupt ancestral rites, and lead to hell. He sets aside
    his bow and arrows and sits on his chariot. Krishna rebukes his despondency and
    urges him to arise. Arjuna then states his inability to fight Bhishma and Drona,
    asks Krishna to instruct him as a disciple, says he will not fight, and falls
    silent while Krishna prepares to speak.
  language: English
  quote_policy: summarized
