canonical_text:
  quote: Death takes all viz., Gods and Danavas and Gandharvas (without exception).
  summary: Yudhishthira grieves over Abhimanyu, who was slain after entering the enemy
    formation under unequal conditions. Vyasa comforts him by saying the slain youth
    ascended to heaven and that Death takes all beings. Yudhishthira then asks about
    the origin and nature of Death. Vyasa introduces an ancient story in which Narada
    instructed King Akampana, who likewise grieved for his slain son Hari, about the
    origin of Death.
  language: English
  quote_policy: quoted
