canonical_text:
  quote: ''
  summary: Draupadi disguises herself as a Sairindhri and seeks service. Queen Sudeshna
    notices that her beauty seems inconsistent with servile status and compares her
    to celestial women and Sri. Draupadi claims practical skills in hairdressing,
    unguents, and garlands, says she is secretly protected by five Gandharva husbands,
    and states conditions for service. Sudeshna accepts her into the household, and
    Draupadi remains unrecognized.
  language: English
