canonical_text:
  quote: Today I will either sleep myself being slain, or, I will slay the Pandavas.
  summary: Dhritarashtra asks how Sikhandin confronted Bhishma and who protected him.
    Sanjaya reports that Bhishma's bow and car were uninjured, that Bhishma and Arjuna
    caused terror and mass slaughter, that Duryodhana appealed to Bhishma as the refuge
    of his routed troops, and that Bhishma declared his vow, debt, and readiness either
    to die or to slay the Pandavas before attacking again.
  language: English
  quote_policy: quoted
