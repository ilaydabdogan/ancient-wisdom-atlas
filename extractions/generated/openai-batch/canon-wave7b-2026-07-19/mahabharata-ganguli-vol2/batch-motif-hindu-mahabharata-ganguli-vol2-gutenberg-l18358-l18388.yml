canonical_text:
  quote: ''
  summary: Karna identifies himself as the son of Radha and Adhiratha. Kunti tells
    him he is her own son, born while she was a maiden, begotten by the divine Surya,
    born in Kuntiraja's palace with natural earrings and armor. She urges him not
    to remain with Dhritarashtra's son, appeals to parental duty, asks him to reclaim
    Yudhishthira's prosperity from Dhritarashtra's sons, and calls for Karna and Arjuna
    to unite as brothers.
  language: English
  quote_policy: summarized
