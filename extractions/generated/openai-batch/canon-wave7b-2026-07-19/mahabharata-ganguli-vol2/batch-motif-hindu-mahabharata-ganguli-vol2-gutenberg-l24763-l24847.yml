canonical_text:
  quote: There where righteousness is, there is Krishna; and there where Krishna is,
    there is victory.
  summary: On the eve of battle, Krishna instructs Arjuna to cleanse himself and recite
    a hymn to Durga. Arjuna descends from his chariot, praises Durga through many
    names and attributes, and asks for victory. Durga appears in the sky, grants him
    victory and invincibility with Narayana as his aid, then disappears. Arjuna returns
    to the chariot with Krishna, and they blow celestial conches. The passage also
    states protective benefits of reciting the hymn and closes with Sanjaya’s assertion
    that Krishna and righteousness ensure victory.
  language: English
  quote_policy: quoted
