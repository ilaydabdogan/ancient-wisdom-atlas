canonical_text:
  quote: Dhananjaya then caused a fierce and terrible river full of fearful objects
    and enhancing the fear of the timid, to flow resembling the Vaitarani itself.
  summary: Sanjaya describes Dhananjaya/Arjuna terrifying the Kaurava host, invoking
    the Aindra weapon, filling the sky with fiery mantra-powered shafts, dispersing
    arrow-darkness, killing and dismembering hostile warriors, and transforming the
    battlefield into a terrible river of blood, corpses, weapons, scavengers, and
    spirits compared to Vaitarani.
  language: English
  quote_policy: quoted
