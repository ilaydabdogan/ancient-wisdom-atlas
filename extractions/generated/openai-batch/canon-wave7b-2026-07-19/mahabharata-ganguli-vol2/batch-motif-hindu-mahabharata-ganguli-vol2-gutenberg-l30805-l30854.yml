canonical_text:
  quote: ''
  summary: A battle passage describes a weapon called Prajna neutralizing Dhrishtadyumna's
    Pramohana weapon and restoring the senses of the king's sons. Yudhishthira sends
    Abhimanyu and allied warriors to follow and rescue Bhima and Dhrishtadyumna. The
    rescue force penetrates the Dhartarashtra division in Suchimukha array. Dhrishtadyumna
    turns from attacking the king's sons to confront Drona. Drona defeats Dhrishtadyumna's
    chariot, kills his horses and charioteer, and then breaks the Pandava army, which
    is compared to an agitated sea, while the opposing troops praise him.
  language: English
  quote_policy: summarized
