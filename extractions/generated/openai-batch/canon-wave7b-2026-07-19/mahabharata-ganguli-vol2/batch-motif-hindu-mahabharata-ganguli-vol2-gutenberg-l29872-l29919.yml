canonical_text:
  quote: '"take his birth among mankind in the family of Vasudeva"'
  summary: Bhishma reports Brahma's explanation to gods, Rishis, and Gandharvas that
    the supreme Lord, identified with Vasudeva and Hrishikesa, has agreed to take
    human birth for the good of the universe and the slaughter of Asuras. Brahma warns
    that this divine being should not be dismissed as merely human and describes his
    emblems and supreme attributes.
  language: English
