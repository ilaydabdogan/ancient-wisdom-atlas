canonical_text:
  quote: ''
  summary: 'Narada tells Srinjaya of the death of Amvarisha, son of Nabhaga: Amvarisha
    fought and subdued many kings, conquered the earth, performed a hundred sacrifices
    with lavish feeding, drinking, music, and priestly honor, gave vast royal gifts
    to priests and Brahmanas, was praised by great Rishis for unprecedented liberality,
    and is used as an example to counsel Srinjaya not to grieve for Swaitya.'
  language: English
  quote_policy: summarized
