canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanjaya to describe the Varsha called after Bharata,
    the land over which forces have gathered and which Duryodhana and others desire.
    Sanjaya replies by attributing covetousness chiefly to Duryodhana, Sakuni, and
    other rulers, then describes Bharatvarsha as beloved by Indra, Manu, and many
    ancient kings. He catalogs its seven principal mountains, many other mountains
    and peoples, and a long list of rivers, concluding that these rivers are mothers
    of the universe and productive of great merit.
  language: English
  quote_policy: summarized
