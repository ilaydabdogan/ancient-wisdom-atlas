canonical_text:
  quote: ''
  summary: In a battlefield passage, Phalguni declares that an invincible car-warrior
    will be thrown down like the crescent moon at the end of the Yuga. Madhava silently
    remounts the car in anger. Bhishma/Devavrata attacks with showers of arrows, breaks
    the Pandava ranks, and is repeatedly compared to the Sun draining, blazing, and
    scorching. The Pandava troops flee in fear, cannot find protection, and the battle
    moves toward withdrawal at sunset.
  language: English
  quote_policy: summarized
