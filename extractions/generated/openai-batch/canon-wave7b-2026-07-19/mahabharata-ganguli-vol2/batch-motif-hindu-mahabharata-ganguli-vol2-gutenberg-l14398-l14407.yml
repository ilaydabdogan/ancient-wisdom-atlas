canonical_text:
  quote: ''
  summary: The slayer of Madhu dismisses the Kurus after acknowledging their offers.
    Vidura carefully entertains him, and Kunti sets abundant clean food before Kesava.
    Before eating, he gives a portion of the food and wealth to Veda-conversant Brahmanas,
    then dines with his attendants on the remaining food, in a simile comparing him
    to Vasava among the Marutas.
