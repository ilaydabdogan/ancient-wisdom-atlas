canonical_text:
  quote: ''
  summary: Sanjaya narrates Satyaki's reply to Yudhishthira. Satyaki declares loyalty,
    recalls Arjuna's charge that Yudhishthira be protected while Jayadratha is pursued,
    describes Drona's threat to seize the king, praises Arjuna's unmatched power,
    and refuses to go toward Arjuna unless Yudhishthira is safely entrusted to someone
    else.
  language: English
