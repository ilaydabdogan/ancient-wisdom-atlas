canonical_text:
  quote: ''
  summary: Vasudeva explains that the Narayana weapon will spare warriors who lay
    down their weapons and descend from their vehicles, but will kill those who contend
    against it. The Pandava warriors disarm, while Bhima refuses and attacks Aswatthaman.
    Arjuna states a vow not to use Gandiva against the Narayana weapon. Aswatthaman
    covers Bhima with blazing mantra-charged arrows, the weapon increases in force,
    the Pandava army panics and dismounts, and the weapon falls upon Bhima.
  language: English
  quote_policy: summarized
