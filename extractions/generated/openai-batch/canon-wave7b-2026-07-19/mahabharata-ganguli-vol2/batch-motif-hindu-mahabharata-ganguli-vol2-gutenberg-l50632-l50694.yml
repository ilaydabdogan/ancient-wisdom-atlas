canonical_text:
  quote: ''
  summary: Sanjaya narrates a chariot battle between Karna and Bhima. Karna wounds
    Bhima, hurls a deadly dart, and continues fighting, but Bhima cuts Karna's bow,
    destroys or fells his charioteer and steeds, cuts the dart in the sky, kills Durjaya
    when Duryodhana sends him to aid Karna, and leaves Karna pierced and carless while
    Karna mourns Durjaya.
  language: English
  quote_policy: summarized
