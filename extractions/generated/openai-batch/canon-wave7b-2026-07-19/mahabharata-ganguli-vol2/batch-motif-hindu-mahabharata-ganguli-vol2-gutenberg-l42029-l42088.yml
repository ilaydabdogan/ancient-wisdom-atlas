canonical_text:
  quote: ''
  summary: Sanjaya narrates Abhimanyu’s continued fighting in the Kaurava host. Karna’s
    younger brother intervenes and wounds Abhimanyu, but Abhimanyu beheads him. Karna
    is grieved and driven away. Abhimanyu then breaks and terrifies the Kaurava formation,
    filling the battlefield with slain warriors, animals, broken chariot parts, weapons,
    standards, and severed limbs. His arrows are compared to locusts or rain, and
    his destructive movement through the army is repeatedly compared to fire among
    dry grass. Hidden by dust and surrounded by enemies, he later appears resplendent
    like the meridian sun and is compared to Vasava in battle.
  language: English
  quote_policy: summarized
