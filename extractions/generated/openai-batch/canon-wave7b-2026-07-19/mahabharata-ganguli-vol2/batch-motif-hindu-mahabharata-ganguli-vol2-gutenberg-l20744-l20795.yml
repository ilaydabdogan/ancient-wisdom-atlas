canonical_text:
  quote: ''
  summary: Bhishma continues a catalog of warriors, judging Rochamana and Kuntibhoja
    among the Pandava-aligned fighters, describing Ghatotkacha as an illusion-wielding
    Rakshasa leader, and naming Vasudeva and Arjuna among the opponents he expects
    to meet. He then declares that, because of his vow and his rule about not slaying
    a woman or one formerly a woman, he will not fight Sikhandin, whom he says was
    born female and later became male. He recalls renouncing the kingdom, observing
    Brahmacharya, and installing Chitrangada and Vichitravirya in succession roles.
