canonical_text:
  quote: ''
  summary: Bhishma narrates that Sthuna the Yaksha and Sikhandini make a covenant
    and exchange sexes, after which Sikhandini is accepted as male by Drupada and
    later by the Dasarnaka king after witness verification. Kuvera visits Sthuna's
    decorated abode, learns that Sthuna remains inside in a feminine form because
    of the exchange, summons him, and angrily curses him that his femininity remain.
  language: English
  quote_policy: summarized
