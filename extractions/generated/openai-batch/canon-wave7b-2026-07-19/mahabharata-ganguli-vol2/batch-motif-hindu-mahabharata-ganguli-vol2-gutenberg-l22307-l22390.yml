- id: obs:1
  text: Sthuna and Sikhandini make a covenant and exchange sexes; Sthuna becomes female
    and Sikhandini obtains the Yaksha's blazing form.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sikhandini returns to the city with manhood, tells Drupada what happened,
