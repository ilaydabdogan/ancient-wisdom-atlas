literal_observations:
- id: obs:1
  text: A king is advised to cherish a counselor who honors wise persons and has learning,
    virtue, pleasant speech, friends, and a good heart.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that humility, modesty, and adherence to polite conduct
    can make a person superior to many of high birth.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Friendship is described as lasting when hearts, secret pursuits, pleasures,
    and acquirements accord; wicked and ignorant associates are to be avoided.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Withdrawal of the senses from their objects is compared to death, while excessive
    indulgence of the senses is said to ruin even gods.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: Perseverance, planning across past, present, and future, acquaintance with
    scriptures, activity, straightforwardness, and meeting good persons are presented
    as causes of prosperity.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Forgiveness is recommended for the weak, for the powerful from motives of
    virtue, and for one who regards success and failure alike.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Prosperity is personified as something that resides in, avoids, or approaches
