  text: Acts intended to secure prosperity in the other world are said not to bear
    fruit if performed using wealth sinfully acquired.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A person with strength of mind is said to feel no fear in deserts, deep woods,
    fastnesses, dangers, alarms, or before raised deadly weapons.
  category: setting
  evidence_refs:
  - ev:6
