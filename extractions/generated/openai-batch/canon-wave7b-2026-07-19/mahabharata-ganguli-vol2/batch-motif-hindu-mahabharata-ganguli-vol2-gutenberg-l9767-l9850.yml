  summary: A speaker gives aphoristic instruction to a king on testing character,
    choosing counselors and friends, avoiding wicked associates, controlling the senses,
    perseverance, forgiveness, prosperity, ritual and other-worldly fruits, fearlessness,
    vow-observance, reciprocal ethics, and respect for elders.
  language: English
