  quote: that resembled the awful battle of old between the gods and the Asuras.
  summary: In fierce battle, a lance pierces Madhava's left arm. Satyaki/Yuyudhana
    fights Jalasandha, loses a bow to Jalasandha's hurled scimitar, takes another
    bow, and cuts off Jalasandha's arms and head. Jalasandha's elephant becomes bloodied
    and runs wild, crushing friendly ranks. The king's troops wail and flee. Drona
    and many Kurus then attack Yuyudhana, and the fight is compared to the ancient
    battle between gods and Asuras.
