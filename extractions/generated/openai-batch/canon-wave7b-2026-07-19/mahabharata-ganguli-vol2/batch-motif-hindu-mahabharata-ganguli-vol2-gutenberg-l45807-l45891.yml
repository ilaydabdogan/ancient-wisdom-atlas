canonical_text:
  quote: ''
  summary: Sanjaya narrates a battle sequence in which Arjuna, pursued and challenged
    by Drona, counters arrow barrages with the Brahma weapon, avoids Drona, fights
    Kritavarman, advances into the Kamvoja force, while Kritavarman blocks Arjuna's
    two Panchala wheel-protectors. Srutayudha then attacks Arjuna and Krishna, and
    Arjuna counters by cutting off Srutayudha's weapons and wounding him before the
    excerpt breaks off.
  language: English
  quote_policy: summarized
