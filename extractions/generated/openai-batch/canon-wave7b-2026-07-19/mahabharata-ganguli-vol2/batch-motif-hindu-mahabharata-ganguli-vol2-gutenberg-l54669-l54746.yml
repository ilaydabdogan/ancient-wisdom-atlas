canonical_text:
  quote: the field of battle looked like a second heaven
  summary: Sanjaya describes the night battle after Duryodhana orders the Kaurava
    foot-soldiers to take blazing lamps. Celestial beings also take up lamps, and
    lamps come from divine sources. The Kaurava and Pandava armies illuminate their
    cars, elephants, horses, standards, and formations. The battlefield shines with
    reflected light from armor, ornaments, and weapons; Drona and Aswatthaman are
    compared to the midday sun. The light draws gods, celestial beings, ascetics,
    Apsaras, and spirits of slain warriors about to enter celestial regions, making
    the battlefield appear like a second heaven and like ancient arrays of celestials
    and Asuras. The night encounter is further described through storm imagery.
  language: English
  quote_policy: quoted
