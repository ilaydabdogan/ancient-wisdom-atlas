canonical_text:
  quote: ''
  summary: Dhritarashtra asks which warriors surrounded Abhimanyu after he entered
    the Kaurava array. Sanjaya reports that six car-warriors surrounded Abhimanyu
    while other troops supported Jayadratha against Yudhishthira. Abhimanyu exchanges
    arrow-fire with Drona, Kripa, Karna, Aswatthaman, Vrihadvala, and Kritavarman,
    kills Vrindaraka, withstands Aswatthaman without trembling, and later kills Vrihadvala,
    after which many kings flee.
  language: English
  quote_policy: summarized
