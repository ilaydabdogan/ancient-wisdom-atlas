canonical_text:
  quote: ''
  summary: Bhurisravas, after Arjuna cuts off his arm, enters the vow of Praya and
    yogic silence while the army praises him and censures Krishna and Arjuna. Arjuna
    defends his intervention as protection of Satyaki and contrasts it with the killing
    of Abhimanyu. Arjuna and Vasudeva direct Bhurisravas toward blessed regions. Satyaki,
    despite censure and prohibition from many warriors, beheads Bhurisravas while
    he is seated in Praya. The act is debated as destiny; Satyaki defends it by invoking
    the Kauravas' killing of Abhimanyu, his own vow, fate, and a verse attributed
    to Valmiki.
  language: English
  quote_policy: summarized
