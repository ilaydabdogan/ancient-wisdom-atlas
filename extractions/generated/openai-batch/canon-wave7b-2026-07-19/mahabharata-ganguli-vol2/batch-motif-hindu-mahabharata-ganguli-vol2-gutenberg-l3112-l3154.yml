canonical_text:
  quote: ''
  summary: Vaisampayana narrates that a warrior in the habit of a person of the third
    sex drives Uttara toward the Sami tree. The Kuru warriors fear he is Dhananjaya.
    Drona reads several violent and ominous signs, orders vigilance, identifies the
    warrior as the son of Pritha, and recalls his prowess, his instruction by Indra,
    and his encounter with Mahadeva disguised as a hunter on Himavat. Karna rejects
    Drona's praise, while Duryodhana says that if the warrior is Partha the Pandavas
    may be forced into another exile, and if not he will defeat him. The Kuru elders
    applaud Duryodhana's words.
  language: English
  quote_policy: summarized
