canonical_text:
  quote: ''
  summary: Sanjaya reports the Pandava warriors mourning the slain Abhimanyu around
    Yudhishthira. Yudhishthira laments that Abhimanyu entered Drona's array for his
    sake, defeated enemies, was killed after encountering Duhsasana's son, and is
    now associated with Yama's abode. He blames his own desire for victory, grieves
    for Subhadra, Krishna, and Arjuna, praises Arjuna's virtues and past feats, predicts
    Arjuna's destructive vengeance against the Kauravas, and says that victory, sovereignty,
    immortality, or celestial dwelling now bring him no delight.
  language: English
  quote_policy: summarized
