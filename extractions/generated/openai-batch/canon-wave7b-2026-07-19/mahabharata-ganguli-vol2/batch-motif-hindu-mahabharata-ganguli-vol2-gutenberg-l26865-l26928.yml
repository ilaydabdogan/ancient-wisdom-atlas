canonical_text:
  quote: ''
  summary: Before battle, Salya promises Yudhishthira that he will weaken Karna despite
    fighting on the opposing side. Krishna attempts to persuade Karna to join the
    Pandavas temporarily, but Karna refuses out of loyalty to Duryodhana. Yudhishthira
    publicly welcomes allies; Yuyutsu offers to fight for him against the sons of
    Dhritarashtra and is accepted. Yuyutsu crosses to the Pandava army, Yudhishthira
    resumes his armor, the armies rearray, and onlookers praise the Pandavas' conduct
    while war instruments and conches sound.
  language: English
  quote_policy: summarized
