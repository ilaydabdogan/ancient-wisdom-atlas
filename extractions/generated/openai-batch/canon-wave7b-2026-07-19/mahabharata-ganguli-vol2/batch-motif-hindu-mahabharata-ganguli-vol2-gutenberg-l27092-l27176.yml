canonical_text:
  quote: ''
  summary: The passage catalogs many simultaneous single combats within a larger battle.
    Named warriors, rulers, princes, and groups exchange arrows, disable steeds and
    chariots, use swords or maces, and are described through similes involving rain-clouds,
    mountains, animals, planets, and divine or demonic combat. The passage closes
    by saying that thousands of duels briefly made the engagement appear beautiful
    before it became furious and indistinct.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ghatotkacha and Alamvusha pierce and mangle one another with arrows, and their
    duel is compared to Sakra fighting Vala in an ancient celestial-Asura combat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sikhandin and Aswatthaman strike each other with arrows; Aswatthaman makes
    Sikhandin tremble with a keen-edged shaft.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Virata attacks Bhagadatta with an arrow shower compared to rain on a mountain,
    while Bhagadatta envelops Virata with arrows compared to clouds covering the risen
    sun.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kripa and Vrihadkshatra exchange arrow showers, slay one another's steeds,
    cut off one another's bows, lose their cars, and then approach each other with
    swords.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Drupada and Jayadratha pierce each other with shafts, and their combat is
    compared to a conflict between the planets Sukra and Angaraka.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Vikarna and Sutasoma pierce one another with arrows, but neither can make
    the other waver.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Chekitana and Susarman exchange showers of arrows; Chekitana's arrows are
    compared to clouds raining on a mountain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sakuni rushes against Prativindhya like a lion against an infuriate elephant;
