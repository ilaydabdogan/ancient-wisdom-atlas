canonical_text:
  quote: ''
  summary: Bhishma classifies warriors for Duryodhana's side, praises Achala and Vrisha,
    and disparages Karna as only half a Ratha because of lost protective accoutrements
    and curses. Drona agrees. Karna angrily accuses Bhishma of bias and of weakening
    the army, boasts that he alone can fight the Pandavas, and vows not to fight while
    Bhishma lives. Bhishma replies that he is taking up the burden of Duryodhana's
    battle, recalls earlier martial exploits, calls Karna a source of strife, and
    urges him to fight Partha.
  language: English
  quote_policy: summarized
