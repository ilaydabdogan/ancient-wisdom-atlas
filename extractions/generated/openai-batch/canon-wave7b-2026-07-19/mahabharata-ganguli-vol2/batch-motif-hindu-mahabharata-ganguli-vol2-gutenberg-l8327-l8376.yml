canonical_text:
  quote: ''
  summary: Yudhishthira instructs Sanjaya to carry messages to Dhritarashtra, Bhishma,
    Vidura, and Duryodhana. He appeals for truthfulness, respect for elders, peace
    among kin, forgiveness of past wrongs, and the return of a proper share of the
    kingdom, even if reduced to five villages. He closes by declaring himself capable
    of either war or peace.
  language: English
  quote_policy: summarized
