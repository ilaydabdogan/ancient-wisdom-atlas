canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanjaya what happened after Satyaki, riding Vasudeva's
    car driven by Daruka, made Karna carless. Sanjaya reports that Daruka's younger
    brother brought Satyaki an ornate replacement car, that Satyaki mounted it and
    attacked the king's troops, that Daruka went to Kesava, and that Karna also received
    a new richly equipped car and returned to battle. Sanjaya then reports heavy losses
    among Dhritarashtra's sons and other warriors, attributing the destruction to
    Dhritarashtra's evil policy.
  language: English
  quote_policy: summarized
