canonical_text:
  quote: ''
  summary: Bhishma tells the monarch that several warriors allied with the Pandavas
    are powerful car-warriors. He praises Abhimanyu, Satyaki, Uttamaujas, Yudhamanyu,
    the sons of Draupadi, Uttara, Virata, and Drupada, and predicts that these allies
    will fight fiercely, even at the risk of their lives, because of their relationship
    and loyalty to Kunti's sons.
  language: English
  quote_policy: summarized
