canonical_text:
  quote: ''
  summary: Dhritarashtra asks Vidura to continue his discourse. Vidura says the ancient
    immortal Rishi Sanat-sujata, a perpetual celibate who teaches that there is no
    Death, can answer Dhritarashtra's doubts. Vidura declines to explain further because
    of his social order and instead invokes the Rishi by thought. Sanat-sujata appears,
    is received ritually, and Vidura asks him to expound Dhritarashtra's doubt so
    the king may bear sorrow, death, and other opposing conditions.
