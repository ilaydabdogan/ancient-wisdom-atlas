  quote: ''
  summary: Sanjaya describes Kuru warriors advancing against Krishna and Arjuna in
    splendid chariots, the answering blasts of conchs by both sides, fear spreading
    through the Kuru host, the surrounding of Arjuna by Duryodhana and eight car-warriors,
    and a rapid exchange of arrows in which Arjuna wounds multiple opponents.
