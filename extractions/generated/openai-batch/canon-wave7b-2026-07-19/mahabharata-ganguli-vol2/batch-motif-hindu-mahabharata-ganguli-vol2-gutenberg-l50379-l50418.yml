canonical_text:
  quote: ''
  summary: Sanjaya reports that Karna advances against Bhima in a terrifying battle.
    Dhritarashtra asks how Karna and Bhima, both mighty car-warriors, fought near
    Arjuna's car, recalling Karna's previous defeat by Bhima, Yudhishthira's fear
    of Karna, Karna's brotherhood with the Pandavas and words to Kunti, Bhima's remembered
    wrongs, Duryodhana's reliance on Karna, Karna's past conquest on a single car,
    and Karna's birth with natural earrings.
