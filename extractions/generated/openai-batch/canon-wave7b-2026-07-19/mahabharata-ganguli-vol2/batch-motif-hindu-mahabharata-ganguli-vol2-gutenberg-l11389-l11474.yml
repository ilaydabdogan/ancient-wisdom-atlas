canonical_text:
  quote: ''
  summary: Dhritarashtra tells Sanjaya that Bhima alone equals many warriors and that
    he fears Bhima greatly. He describes Bhima’s wrath, strength, childhood hostility
    toward Dhritarashtra’s sons, destructive mace, and anticipated battlefield slaughter.
    He compares Bhima to Yama, Death in human form, a lion or tiger among deer, an
    ocean, a blazing flame, universal Dissolution at the end of a Yuga, and the current
    of the Ganga. He also recalls Bhima’s former overthrow of Jarasandha with Vasudeva’s
    aid.
  language: English
  quote_policy: summarized
