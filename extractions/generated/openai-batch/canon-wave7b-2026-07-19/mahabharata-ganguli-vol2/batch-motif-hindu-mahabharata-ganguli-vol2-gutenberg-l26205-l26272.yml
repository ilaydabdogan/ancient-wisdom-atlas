canonical_text:
  quote: ''
  summary: The Holy One teaches Arjuna about a supreme science leading beyond rebirth,
    describes Brahma as the womb and himself as the seed-imparting sire of beings,
    explains how goodness, passion, and darkness bind the embodied soul and shape
    post-dissolution outcomes, and gives signs and practices of one who transcends
    the three qualities through equanimity and exclusive devotion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Holy One says he will declare a supernal science by which munis attained
    the highest perfection, attained his nature, and are not reborn at a new creation
    or disturbed at universal dissolution.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker calls Brahma a mighty womb for him, says he places the living
    germ therein, and says all beings are born from it; he also calls himself the
    seed-imparting Sire.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Goodness, passion, and darkness are described as qualities born of nature
    that bind the eternal embodied soul in the body.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Goodness binds through happiness and knowledge, passion binds through attachment
    to work, and darkness binds through error, indolence, and sleep.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The development of goodness is marked by the light of knowledge in the body;
    the development of passion by avarice, activity, works, restlessness, and desire;
    and the development of darkness by gloom, inactivity, error, and delusion.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: At dissolution, one in whom goodness prevails attains spotless regions; one
    in whom passion prevails is born among those attached to work; and one dissolved
    during darkness is born in wombs that beget the ignorant.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that goodness produces knowledge, passion produces avarice,
    and darkness produces error, delusion, and ignorance.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Those dwelling in goodness are said to go high, those addicted to passion
    dwell in the middle, and those of darkness go down.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: An observer who recognizes that only the qualities act, and who knows what
    is beyond the qualities, attains the speaker's nature.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The embodied soul that transcends the three qualities enjoys immortality and
    is freed from birth, death, decrepitude, and misery.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Arjuna asks for the indications, conduct, and means of one who has transcended
    the three qualities.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Holy One says that one who has transcended the qualities neither hates
    nor desires light, activity, or delusion, remains unconcerned and unshaken, and
    thinks that the qualities are engaged in their own functions.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The described transcender treats pain and pleasure, earth, stone, and gold,
    praise and censure, honor and dishonor, and friend and foe alike, and has renounced
    all exertion.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Holy One says that one who worships him with exclusive devotion transcends
    the qualities and becomes fit for admission into the nature of Brahma.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The speaker states that he is the stay of Brahma, immortality, undestructibility,
    eternal piety, and unbroken felicity.
  category: speech
  evidence_refs:
  - ev:9
