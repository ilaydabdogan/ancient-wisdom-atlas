canonical_text:
  quote: ''
  summary: Sanjaya narrates a battle sequence in which Duryodhana attacks and wounds
    Bhimasena. Ghatotkacha and Pandava warriors react with wrath, while Bharadwaja's
    son urges Kuru warriors to protect Duryodhana. A close melee follows. Bhima and
    Bharadwaja's son exchange arrows, and the preceptor loses consciousness. Duryodhana
    and Aswatthaman advance on Bhima, who descends from his car with an upraised mace.
    Kaurava warriors surround and afflict Bhima, prompting Pandava warriors to rush
    to rescue him. Nila attacks Drona's son, wounds him, and is then disabled and
    made to swoon. Ghatotkacha and Rakshasas rush at Aswatthaman; after many Rakshasas
    are slain or repulsed, Ghatotkacha exhibits a fierce illusion.
  language: English
  quote_policy: summarized
