canonical_text:
  quote: Karna is now like a man (and no longer like a god).
  summary: Sanjaya reports that after Ghatotkacha is slain, the Pandavas grieve while
    Vasudeva rejoices. Arjuna asks why Vasudeva is joyful at such a time. Vasudeva
    explains that Karna has spent the infallible dart he had obtained from Sakra in
    exchange for his natural armor and earrings, so Karna is now vulnerable. Vasudeva
    tells Arjuna that Karna can be killed when his car-wheels sink in the earth and
    says he will give Arjuna a sign.
  language: English
  quote_policy: quoted
