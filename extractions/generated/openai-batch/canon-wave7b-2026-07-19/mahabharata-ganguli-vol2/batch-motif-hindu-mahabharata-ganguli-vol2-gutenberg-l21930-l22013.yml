canonical_text:
  quote: I am practising the severest penances for the destruction of Bhishma.
  summary: Rama admits he cannot defeat Bhishma and releases the maiden from his protection.
    The princess of Kasi resolves not to return to Bhishma but to obtain the means
    to slay him herself. Bhishma returns home, reports events, appoints spies, and
    is advised by Narada and Vyasa not to grieve against destiny. The princess undertakes
    extreme ascetic austerities and pilgrimages through sacred retreats and waters.
    Ganga questions her purpose; the princess states that all her vows are for Bhishma's
    destruction. Ganga warns that the wish will not be achieved and that, if she dies
    during these vows, she will be reborn as a dangerous seasonal river. The princess
    resumes severe fasting vows.
  language: English
  quote_policy: quoted
