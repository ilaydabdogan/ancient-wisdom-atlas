  quote: Yonder stands Drona like a fire swelling with its own energy.
  summary: Bhimasena rebukes a warrior of Drupada's line for inaction before Drona,
    describes Drona as a consuming fire, declares that he will attack him, and enters
    Drona's array. Dhrishtadyumna also enters the host and fights Drona. A fierce
    general battle follows, with entangled chariots, scattered corpses, and combatants
    attacked while moving or fleeing, until the morning sun rises.
