canonical_text:
  quote: ''
  summary: Sanjaya narrates to the king a fierce battle between Kurus and Pandavas.
    The passage presents Drona defending his array, multiple paired combats among
    named warriors, dense arrow-showers, striking similes drawn from animals, flowering
    trees, clouds and rain, the mind and senses, and earlier divine or heroic conflicts.
    Sakuni is routed by the two sons of Madri, while the Pandavas' wrath is likened
    to a fire ready to consume the earth.
  language: English
  quote_policy: summarized
