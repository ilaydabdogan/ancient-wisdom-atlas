canonical_text:
  quote: ''
  summary: The passage describes a sacred geography north of Kailasa, centered on
    Manimaya mountain and Vindusaras lake. It recounts Bhagiratha’s residence there,
    ritual features, divine presences, the celestial Ganga emerging from Brahman’s
    region and dividing into seven streams, sacrifices after a Yuga, the distribution
    of various beings among mountains, and the division of the world into seven Varshas
    within a hare-shaped Jamvudwipa.
  language: English
