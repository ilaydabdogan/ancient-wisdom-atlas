canonical_text:
  quote: '"The encounter ... between Drona and Satwata ... was extremely fierce, like
    that between Vali and Vasava"'
  summary: Sanjaya narrates a fierce chariot duel between Drona and Satyaki/Yuyudhana.
    They exchange arrows, cut each other's weapons and chariot fittings, wound each
    other's drivers, and continue fighting. Satyaki drives his own chariot after his
    driver swoons, then fells Drona's driver and causes Drona's driverless steeds
    to carry his chariot away. Drona returns to protect the broken array and is described
    through a destructive fire/end-of-Yuga image.
  language: English
  quote_policy: quoted
