canonical_text:
  quote: There can be no forest without tigers, and no tigers without a forest.
  summary: A speaker counsels a king against rupture with the Pandavas, warning of
    political and cosmic-scale harm, teaching prudence and the superiority of intellect,
    and using metaphors of forest and predators, fire in wood, creepers and trees,
    and forest and lions to describe mutual dependence and latent danger.
  language: English
  quote_policy: quoted
