  quote: ''
  summary: Sanjaya narrates a duel in which Karna blocks Sahadeva's attempt to reach
    Drona. Karna destroys Sahadeva's bow, chariot support, weapons, and improvised
    missiles, then taunts and spares him because he recalls Kunti's words. Sahadeva,
    wounded and humiliated, ascends Janamejaya's car.
  language: English
