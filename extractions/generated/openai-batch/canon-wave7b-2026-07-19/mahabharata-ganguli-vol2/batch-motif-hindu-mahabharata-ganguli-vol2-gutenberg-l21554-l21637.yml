canonical_text:
  quote: ''
  summary: Bhishma recounts a renewed duel with Rama after both sides recover from
    the previous day's battle. The combatants exchange arrows and celestial weapons,
    each neutralizing the other's attacks. Both are wounded and fall into swoons at
    different moments. Dense clouds of arrows block the sun and wind, generate a sky-fire,
    and burn to ashes before Rama withdraws at evening.
  language: English
  quote_policy: summarized
