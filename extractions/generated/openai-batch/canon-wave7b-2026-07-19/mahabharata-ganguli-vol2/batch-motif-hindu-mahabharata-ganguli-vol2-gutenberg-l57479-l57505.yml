canonical_text:
  quote: the field of battle looked beautiful like the firmament bespangled with stars
  summary: 'The passage first describes a battlefield covered with severed bodies,
    weapons, broken vehicles, slain elephants, frightened driverless steeds, ornaments,
    armour, and royal gear. It then narrates an encounter between Duryodhana and Nakula:
    both are wrathful; Nakula shoots many arrows and gains an initial positional advantage,
    but Duryodhana counters him, forces him to turn back, and receives applause. Nakula
    calls for Duryodhana to wait while remembering wrongs caused by his counsels.'
