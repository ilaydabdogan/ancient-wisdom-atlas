canonical_text:
  quote: ''
  summary: Vyasa narrates how Narada consoles Srinjaya after sacred histories of sixteen
    kings, offers a boon, and restores Srinjaya's son from hell. Vyasa then explains
    that this son could return because he had not fulfilled life's purposes, while
    Abhimanyu, slain heroically in battle, has attained heavenly regions and a luminous
    lunar body and should not be grieved. Vyasa urges Yudhishthira to abandon grief
    and act, then disappears; Yudhishthira is consoled but worries about what to say
    to Dhananjaya.
  language: English
  quote_policy: summarized
