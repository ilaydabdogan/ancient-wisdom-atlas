canonical_text:
  quote: ''
  summary: Krishna teaches Arjuna that the restless mind can be controlled through
    practice and abandonment of desire. Arjuna asks what becomes of a faithful but
    unsuccessful devotee. Krishna replies that such a person is not ruined, dwells
    in meritorious regions, is reborn in favorable households or among intelligent
    devotees, recovers former Brahmic knowledge, strives onward through many births,
    reaches perfection and the supreme goal, and that the faithful devotee who worships
    him is most devout.
  language: English
  quote_policy: summarized
