canonical_text:
  quote: ''
  summary: Sanjaya narrates a sequence of battlefield combats. Bhuri and Satyaki wound
    each other until Satyaki kills Bhuri with a dart. Aswatthaman then attacks Satyaki,
    but Ghatotkacha intervenes, threatens Aswatthaman, and fights him at night with
    showers of arrows. Aswatthaman counters with mantra-empowered celestial weapons.
    Ghatotkacha briefly stuns Aswatthaman, but Aswatthaman recovers and shoots a terrible
    shaft that pierces Ghatotkacha, whose charioteer removes him from the field.
  language: English
  quote_policy: summarized
