canonical_text:
  quote: The Kurus and the Pandavas seemed to gamble, making Drona their stake.
  summary: Dhritarashtra asks Sanjaya about the routed troops. Sanjaya describes warriors
    rallying around Drona, the Kurus and Pandavas fighting over whether Drona should
    be slain, Drona breaking Pandava divisions and being checked by Dhrishtadyumna,
    and Ashwatthaman killing Nila in single combat. The Pandava host grieves and fears
    because Arjuna is elsewhere on the field.
  language: English
  quote_policy: quoted
