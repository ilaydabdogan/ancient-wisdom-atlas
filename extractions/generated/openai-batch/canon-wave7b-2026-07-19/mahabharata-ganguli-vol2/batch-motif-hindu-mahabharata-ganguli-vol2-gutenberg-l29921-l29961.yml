canonical_text:
  quote: There, where Krishna is, there righteousness is; and there is victory where
    righteousness is.
  summary: Bhishma recounts an authoritative teaching about Vasudeva/Krishna as eternal
    supreme deity, source of Brahman, creator and upholder of the worlds, protector
    of the Pandavas, and guarantor of righteous victory. He rebukes the addressed
    king for ignoring warnings against war with Vasudeva and the Pandavas, and closes
    by describing Vasudeva’s worship across social orders and his cyclic creation
    of worlds across Yugas.
  language: English
  quote_policy: quoted
