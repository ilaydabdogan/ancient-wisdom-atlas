canonical_text:
  quote: '"a fire sprang from the sky"'
  summary: Narada tells a king a history in which Brahma first creates all creatures,
    sees that creation shows no decay, seeks a means to destroy the universe, and
    through anger produces a sky-born fire that fills heaven, sky, and earth and destroys
    mobile and immobile beings. Hara, also called Sthanu or Siva, appeals to Brahma
    for the good of creatures, and Brahma asks what wish he desires.
