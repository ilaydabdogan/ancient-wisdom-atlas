  quote: '"the Aswattha, having its roots above and branches below, is eternal"'
  summary: The Holy One teaches Bharata about an inverted eternal Aswattha tree, liberation
    by cutting it with unconcern, the no-return supreme seat, the embodied individual
    soul, divine immanence in cosmic and bodily processes, and the Supreme Being called
    Purushottama.
  language: English
