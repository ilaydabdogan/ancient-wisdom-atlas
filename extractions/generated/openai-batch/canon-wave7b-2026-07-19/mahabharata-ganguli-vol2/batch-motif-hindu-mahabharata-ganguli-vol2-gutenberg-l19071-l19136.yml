canonical_text:
  quote: War, therefore, is that which should now take place.
  summary: Yudhishthira asks Krishna what course accords with duty after Duryodhana
    rejects counsel. Krishna reports Duryodhana's refusal, hostility, and attempted
    incarceration of him, and concludes that war should occur. The assembled kings
    look to Yudhishthira, who orders the troops into battle array but laments the
    prospect of killing revered elders and preceptors. Arjuna reminds him of the counsel
    of Krishna, Kunti, and Vidura, and the Pandavas settle on war.
  language: English
  quote_policy: quoted
