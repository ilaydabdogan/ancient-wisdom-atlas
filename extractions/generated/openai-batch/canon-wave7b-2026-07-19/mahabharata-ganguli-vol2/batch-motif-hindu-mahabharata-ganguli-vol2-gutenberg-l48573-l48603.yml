canonical_text:
  quote: ''
  summary: In battle, Kritavarman, son of Hridika, charges Sikhandin, son of Yajnasena,
    and the two car-warriors exchange many arrows amid fire, sun, elephant, and animal
    similes. Kritavarman pierces Sikhandin repeatedly, causing him to throw aside
    his weapons and swoon on his car. Sikhandin's charioteer removes him from battle.
    Kritavarman then holds off and routs several Pandava-aligned forces, who flee
    and do not face him.
  language: English
