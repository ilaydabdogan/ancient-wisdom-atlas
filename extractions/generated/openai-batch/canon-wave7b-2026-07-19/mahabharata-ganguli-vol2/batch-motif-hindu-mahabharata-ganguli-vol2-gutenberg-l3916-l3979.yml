canonical_text:
  quote: ''
  summary: Arjuna approaches the Kuru army in his chariot. Drona recognizes him by
    his banner, the roar of the ape emblem, the sound of the car, and the twang of
    the Gandiva, and interprets Arjuna’s arrows as a respectful salutation. Arjuna
    orders Matsya’s son to drive toward Duryodhana, who is retreating with the cattle.
    Kripa recognizes Arjuna’s purpose and urges the Kurus to defend Duryodhana. Arjuna
    then announces himself, overwhelms the troops with arrows, blows his conch, twangs
    his bow, and makes the creatures on his flagstaff roar; the earth trembles and
    the cattle turn back along the southern road.
  language: English
  quote_policy: summarized
