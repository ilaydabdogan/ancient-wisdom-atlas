canonical_text:
  quote: ''
  summary: Dhritarashtra addresses Sanjaya and recounts Krishna/Vasudeva’s extraordinary
    feats, including childhood demon-slaying, victories over kings and beings, acquisition
    of celestial objects and weapons, a manifestation as Supreme Lord in court, and
    the danger posed by Krishna’s alliance with Arjuna and the Pandavas. He identifies
    Krishna and Arjuna with Nara and Narayana, appearing as two forms though possessing
    one soul.
  language: English
  quote_policy: summarized
