canonical_text:
  quote: ''
  summary: After being rejected by Sairindhri, Kichaka asks Queen Sudeshna to arrange
    for Sairindhri to come to him. Sudeshna devises a pretext involving wine and sends
    Sairindhri with a golden covered vessel. Sairindhri protests that Kichaka will
    insult her and appeals to her faithfulness to her husbands. Weeping and afraid,
    Draupadi prays for divine protection, adores Surya, and Surya commands an invisible
    Rakshasa to guard her. Kichaka sees her enter and rises joyfully.
  language: English
  quote_policy: summarized
