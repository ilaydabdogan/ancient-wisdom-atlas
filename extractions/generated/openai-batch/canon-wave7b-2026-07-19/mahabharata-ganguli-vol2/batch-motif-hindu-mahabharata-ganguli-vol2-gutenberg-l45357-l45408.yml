canonical_text:
  quote: ''
  summary: 'Sanjaya tells the king that he witnessed the events and rebukes him for
    useless lamentation after calamity. He says the Destroyer''s decrees cannot be
    transgressed, but also lists earlier acts by which the king might have averted
    disaster: restraining the dice match, restraining both sides before battle, acting
    against Duryodhana, or guiding him to righteousness. Sanjaya accuses the king
    of abandoning virtue, following bad counsel, tolerating harsh words against the
    sons of Pritha, and endangering ancestral sovereignty. He then describes the Kauravas
    as fighting according to Kshatriya duty against a force protected by Krishna,
    Arjuna, Satyaki, and Vrikodara, and prepares to narrate the battle between Kurus
    and Pandavas.'
  language: English
  quote_policy: summarized
