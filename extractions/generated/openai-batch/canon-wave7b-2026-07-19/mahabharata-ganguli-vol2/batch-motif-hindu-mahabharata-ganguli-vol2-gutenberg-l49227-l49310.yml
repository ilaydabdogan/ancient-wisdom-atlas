canonical_text:
  quote: alone he fought fearlessly with those innumerable foes.
  summary: Sanjaya narrates that forces commanded by Duryodhana and exhorted by Duhsasana
    attack Satyaki. Satyaki, fighting alone, destroys large numbers of warriors, elephants,
    horses, and foot-soldiers. Duhsasana then sends mountain fighters skilled in stone-combat,
    but Satyaki cuts their stones and weapons apart with arrows, causing slaughter
    and rout. Drona hears the uproar and orders his charioteer toward the scene while
    Kaurava troops flee.
  language: English
  quote_policy: quoted
