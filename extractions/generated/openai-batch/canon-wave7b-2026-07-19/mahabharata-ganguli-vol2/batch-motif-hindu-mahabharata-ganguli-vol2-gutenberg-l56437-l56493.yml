canonical_text:
  quote: ''
  summary: Sanjaya narrates Ghatotkacha's triumph after slaying Alayudha, Karna's
    attack on the Panchala warriors, the storm-like night battle, and the duel between
    Karna and Ghatotkacha. When Ghatotkacha cannot prevail over Karna, he invokes
    a fierce weapon, kills Karna's steeds and driver, and becomes invisible; Dhritarashtra
    asks what his army thought of the disappearance.
  language: English
  quote_policy: summarized
