canonical_text:
  quote: ''
  summary: Sanjaya narrates that Arjuna stands on the battlefield with Gandiva and
    is surrounded by Kshatriya warriors. He resists them alone amid fiery arrow-clashes
    and an extended image of the army as an ocean. Janardana asks for drinking water
    for the steeds; Arjuna pierces the earth with a weapon and creates a lake. Narada
    comes to view the lake, and Arjuna constructs an arrow-made hall, which Govinda
    praises.
  language: English
  quote_policy: summarized
