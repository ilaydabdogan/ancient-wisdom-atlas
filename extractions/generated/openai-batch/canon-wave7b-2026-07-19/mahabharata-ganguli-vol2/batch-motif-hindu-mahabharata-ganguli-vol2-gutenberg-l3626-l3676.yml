canonical_text:
  quote: ''
  summary: Karna speaks before an anticipated battle, observes others as alarmed,
    declares that he will resist the arriving fighter if it is the king of Matsyas
    or Arjuna, boasts of his arrows and weapons, vows to defeat Arjuna for the benefit
    of Dhritarashtra's son and Duryodhana, threatens the ape and beings on the enemy
    banner, and tells the Kauravas either to take the cattle or watch his combat.
  language: English
  quote_policy: summarized
