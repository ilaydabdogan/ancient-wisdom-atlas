  summary: Dhritarashtra and Sanjaya discuss why Karna's one-use dart from Sakra was
    not used against Arjuna. They say Krishna protected Arjuna by directing Ghatotkacha
    into single combat with Karna, causing the dart to be spent. Sanjaya also reports
    earlier counsel to kill Arjuna or Krishna and describes Krishna as the root and
    central support of the Pandavas.
