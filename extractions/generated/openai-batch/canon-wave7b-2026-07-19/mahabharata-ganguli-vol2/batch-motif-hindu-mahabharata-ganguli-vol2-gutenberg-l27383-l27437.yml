canonical_text:
  quote: ''
  summary: After Uttara is slain, his brother Sweta becomes wrathful and rushes against
    Salya. Seven car-warriors from the opposing side surround Sweta to protect Salya,
    but Sweta repeatedly cuts their bows and darts, wounds Rukmaratha, and presses
    toward Salya. The addressed king's son, with Bhishma at the head, rescues Salya,
    and a broader confused battle begins, with Bhishma showering arrows on named Pandava-aligned
    warriors and troops.
