  quote: ''
  summary: In battle, Bhimasena casts aside bow and arrows, takes up a mace, and charges
    Jayadratha after seeing Yudhishthira afraid. Jayadratha pierces Bhimasena with
    many arrows, but Bhimasena kills Jayadratha’s steeds. Chitrasena then rushes at
    Bhimasena in a car, but dismounts with scimitar and shield before the mace destroys
    the car, its steeds, and charioteer. The troops shout with joy and applaud Chitrasena.
