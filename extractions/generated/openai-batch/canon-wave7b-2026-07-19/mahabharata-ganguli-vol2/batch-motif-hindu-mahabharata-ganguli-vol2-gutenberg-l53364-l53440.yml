canonical_text:
  quote: "“That is Rudra who is fighting in Bhima's form among the Dhartarashtras.”"
  summary: Sanjaya narrates a fierce night battle. Drona kills many attackers and
    beheads Sivi. Bhima then kills several opponents with fists, a slap, and a foot-stamp,
    catches and returns Karna's dart, terrifies the Kaurava forces, and is compared
    to Rudra or Mahadeva. The passage closes with Kaurava forces surrounding Bhima
    in darkness during a battle pleasing to carrion animals.
  language: English
  quote_policy: quoted
