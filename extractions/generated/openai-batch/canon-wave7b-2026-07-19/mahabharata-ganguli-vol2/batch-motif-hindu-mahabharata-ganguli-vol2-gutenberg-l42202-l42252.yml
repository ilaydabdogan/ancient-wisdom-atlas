canonical_text:
  quote: ''
  summary: Sanjaya narrates an episode in which Abhimanyu, the son of Arjuna and Subhadra,
    penetrates the Kaurava battle array, fights alone against many warriors, disables
    Vrishasena, kills Vasatiya, and cuts down surrounding Kshatriyas. The battlefield
    becomes strewn with bodies, weapons, ornaments, chariots, and animals. Abhimanyu
    is described through images of a Makara disturbing the ocean and of the sun in
    blazing effulgence.
  language: English
  quote_policy: summarized
