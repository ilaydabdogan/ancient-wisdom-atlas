canonical_text:
  quote: OM, TAT, SAT, this is said to be the three-fold designation of Brahma.
  summary: In a doctrinal discourse, the Holy One classifies faith, worship, food,
    sacrifice, penance, and gifts according to goodness, passion, and darkness. He
    explains OM, TAT, SAT as a threefold designation of Brahma used in rites and states
    that acts done without faith are ineffectual. Arjuna then asks about the true
    nature of renunciation and abandonment.
  language: English
  quote_policy: quoted
