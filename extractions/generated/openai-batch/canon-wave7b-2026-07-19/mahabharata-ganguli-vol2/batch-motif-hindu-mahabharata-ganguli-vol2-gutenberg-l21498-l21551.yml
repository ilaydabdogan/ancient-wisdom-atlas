canonical_text:
  quote: ''
  summary: Rama approves the narrator's respectful approach before combat but refuses
    to wish him victory. The narrator returns to his chariot, blows a gold-decked
    conch, and fights Rama for many days. Rama strikes first; the narrator then distinguishes
    Rama's Brahmana, Vedic, and ascetic status from the Kshatriya role Rama has adopted
    by taking weapons. The narrator wounds Rama, Rama attacks again, and the exchange
    is described with arrows likened to snakes, fire, poison, and the sun. Seeing
    Rama afflicted, the narrator pities his Brahmana preceptor, condemns battle and
    Kshatriya practices, stops striking him, and the battle ceases at sunset.
  language: English
  quote_policy: summarized
