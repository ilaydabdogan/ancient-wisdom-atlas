canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanjaya about the battle, especially Arjuna and the
    Samsaptakas. Sanjaya reports that Duryodhana led an elephant division against
    Bhimasena. Bhima routed the elephants, exchanged arrows with Duryodhana, cut off
    Duryodhana's bow and jewelled-elephant standard, then slew a ruler who advanced
    on an elephant. The ruler's divisions fled in panic.
  language: English
