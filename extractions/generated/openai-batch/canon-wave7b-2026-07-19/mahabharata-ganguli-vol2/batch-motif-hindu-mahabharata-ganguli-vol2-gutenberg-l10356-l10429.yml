canonical_text:
  quote: There is but one Brahman which is Truth's self.
  summary: Sanat-sujata teaches a king that Brahman is one and identical with Truth,
    that mere ritual, scriptural reading, or outward ascetic signs do not constitute
    knowledge of Brahman, and that the seeker should restrain mind and senses and
    seek Brahman within the Self. The passage also discusses Chhandas, Vedas, Atharvan,
    the true Brahmana, the true Muni, and a stepwise attainment of a high state.
  language: English
  quote_policy: quoted
