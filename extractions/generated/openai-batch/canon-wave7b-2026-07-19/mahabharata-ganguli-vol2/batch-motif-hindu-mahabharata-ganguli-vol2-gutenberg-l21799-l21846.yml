canonical_text:
  quote: "“the two weapons began to blaze forth brightly, showing what happens at
    the end of the Yuga”"
  summary: Bhishma narrates a renewed duel with Rama. They exchange arrows and darts,
    wound one another, and Rama is briefly comforted by Akritavrana. Rama invokes
    a great Brahma weapon, Bhishma counters with the same weapon, and the two weapons
    blaze in mid-air, distressing beings and shaking the earth. Seeing the whole world
    cry out, Bhishma prepares to use the Praswapa weapon remembered from a dream-command.
  language: English
