canonical_text:
  quote: ''
  summary: 'Draupadi tells Bhima of her grief at seeing the Pandavas concealed in
    Virata''s court in diminished or altered roles: Bhima as the cook Vallava and
    fighter of beasts, Arjuna as a dancing master in feminine adornment among women,
    and Sahadeva as a cowherd. She reports Kaikeyi''s suspicion that Draupadi grieves
    for Bhima from romantic attachment, notes Yudhishthira''s misery from dice, and
    recalls Kunti''s earlier request that Draupadi care for Sahadeva during the forest
    exile.'
  language: English
  quote_policy: summarized
