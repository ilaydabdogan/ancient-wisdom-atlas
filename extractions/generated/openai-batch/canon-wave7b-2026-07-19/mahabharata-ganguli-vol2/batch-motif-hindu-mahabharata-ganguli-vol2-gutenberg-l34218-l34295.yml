canonical_text:
  quote: ''
  summary: Bhishma tells the Pandavas that he is undefeatable while armed and exerting
    himself, but he will not fight certain classes of opponents or inauspicious omens.
    He identifies Sikhandin, formerly female and now male, as one he will not strike,
    and instructs Arjuna to place Sikhandin before him and shoot him. Arjuna grieves
    at the thought of killing his grandfather-like elder, while Krishna urges him
    to fulfill his warrior duty, invoking destiny, the gods, Yama, and an old teaching
    of Vrihaspati to Sakra. Arjuna accepts the strategy, and the Pandavas depart with
    Krishna.
  language: English
  quote_policy: summarized
