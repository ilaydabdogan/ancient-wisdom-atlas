  quote: ''
  summary: Vaisampayana describes Duryodhana urging allied kings to march against
    the Pandavas after ritual purification, fire libations, and Brahmana blessings.
    The forces march in ordered divisions, take position at Kurukshetra, and occupy
    an elaborate encampment made to resemble Hastinapura, with provisions for rulers,
    troops, followers, tradespeople, entertainers, spies, and spectators.
  language: English
