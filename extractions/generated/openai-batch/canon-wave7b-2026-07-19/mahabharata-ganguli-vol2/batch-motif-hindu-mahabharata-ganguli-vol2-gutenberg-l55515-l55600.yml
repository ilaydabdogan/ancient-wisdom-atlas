canonical_text:
  quote: ''
  summary: Sanjaya narrates a night battle in which Yuyudhana/Satyaki routs attackers
    and forces Duryodhana onto another warrior's car, while Arjuna defeats Sakuni's
    surrounding force, wounds Uluka, causes a larger rout, and then blows conchs with
    Vasudeva.
  language: English
  quote_policy: summarized
