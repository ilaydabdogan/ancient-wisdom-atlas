canonical_text:
  quote: ''
  summary: During a night battle, Drona devastates and routs the Pandava host. Arjuna
    and Bhima advance toward Drona with allied warriors following. Aswatthaman attacks
    Satyaki, but Ghatotkacha, riding a terrifying black-iron Rakshasa vehicle and
    accompanied by Rakshasas, confronts him. Ghatotkacha's night-empowered forces
    create an illusionary shower of stones and weapons that terrifies the hostile
    warriors, but Aswatthaman dispels it. Ghatotkacha and Aswatthaman exchange arrows;
    Ghatotkacha hurls a thousand-spoked wheel, which Aswatthaman cuts apart. Ghatotkacha's
    son Anjanaparvan then checks Aswatthaman.
  language: English
  quote_policy: summarized
