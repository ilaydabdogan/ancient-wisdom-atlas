  quote: ''
  summary: Sanjaya tells the king that Arjuna and Vasudeva are godlike bowmen born
    by their own will. He describes Vasudeva/Krishna's discus, past victories, cosmic
    sovereignty, superiority to the universe, association with virtue and success,
    use of the Pandavas against the king's sinful sons, and lordship over time, death,
    and the universe through divine illusion.
