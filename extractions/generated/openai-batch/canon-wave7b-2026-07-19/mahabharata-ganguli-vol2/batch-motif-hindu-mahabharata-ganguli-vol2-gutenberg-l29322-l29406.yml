canonical_text:
  quote: ''
  summary: Sanjaya reports a fierce battle involving Dhrishtadyumna, Salya, Abhimanyu,
    Duryodhana, Bhima, and other warriors. After exchanges among matched car-warriors,
    Bhima takes up his mace and attacks a Magadha elephant division. The narration
    emphasizes terrifying roars, arrow showers, severed riders, and similes comparing
    Bhima to a mountain, the Destroyer, and the slayer of Vritra. Abhimanyu kills
    the ruler of Magadha's elephant and then the ruler himself.
  language: English
  quote_policy: summarized
