candidate_motifs:
- id: motif:1
  label: battle framed as divine-Asura conflict
  taxonomy_refs:
  - duality
  basis: The passage compares battles to Indra and Agni encountering Vali and to gods
    fighting Asuras.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The divine-Asura material is used as simile within the battle narrative,
    not as a separate narrated mythic event.
- id: motif:2
  label: guardians blocking access to a central warrior
  taxonomy_refs: []
  basis: Many named warriors resist opponents who are advancing toward Drona, making
    Drona the focal protected figure of the passage.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: This is a battlefield pattern in the passage; no broader mythic taxonomy
    is assigned.
- id: motif:3
  label: disabling a warrior by severing body parts or martial equipment
  taxonomy_refs: []
  basis: The passage describes severed arms and head, cut bows and standards, and
    removal of bowstring, banner, charioteer, and umbrella.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:10
  confidence: high
  cautions: The motif is literal martial action rather than a supernatural transformation.
- id: motif:4
  label: death as dispatch to Yama's abode
  taxonomy_refs:
  - afterlife_journey_map
  basis: Bhimaratha's killing of Salwa is expressed as sending Salwa, his steeds,
    and charioteer to Yama's abode.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage gives a death formula rather than a detailed afterlife journey.
- id: motif:5
  label: battle standard as identity marker
  taxonomy_refs: []
  basis: The passage identifies warriors through standards and devices, including
    red standards, a lion-tail device, and a sacrificial-stake device.
  evidence_refs:
  - ev:4
  - ev:7
  - ev:10
  confidence: high
  cautions: The emblems are described, but the passage does not explain their ritual
    or genealogical meanings.
- id: motif:6
  label: animalized heroic combat
  taxonomy_refs: []
  basis: The passage repeatedly uses animal comparisons for warriors and clashes,
    including elephant leaders and opposed groups likened to predatory and powerful
    animals.
  evidence_refs:
  - ev:1
  - ev:8
  confidence: high
  cautions: These are similes in the narration rather than literal animal transformation.
comparison_claims:
- id: claim:1
  claim: The passage itself compares the human battlefield to divine-Asura combat,
    using older mythic conflict as a scale model for the current war.
  claim_level: same_function
  target: divine-Asura combat pattern within the Mahabharata's own similes
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is rhetorical and internal to the passage; it does not
    establish identity between the human warriors and the mythic figures.
- id: claim:2
  claim: The animal comparisons function as visual analogies for force, ferocity,
    and matched combat.
  claim_level: visual_similarity
  target: animalized heroic-combat simile pattern
  evidence_refs:
  - ev:1
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The passage uses figurative comparisons only; no shapeshifting or animal
    incarnation is narrated.
- id: claim:3
  claim: The reference to Yama's abode aligns the death of a warrior with an afterlife-destination
    formula.
  claim_level: same_function
  target: afterlife destination or journey-to-death formula
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not narrate an actual journey, judgment, or map of
    the afterlife.
