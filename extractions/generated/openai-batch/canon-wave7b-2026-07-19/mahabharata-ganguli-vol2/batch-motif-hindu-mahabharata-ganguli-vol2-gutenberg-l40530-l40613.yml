canonical_text:
  quote: ''
  summary: The passage describes a sequence of battlefield encounters around Drona.
    Many named warriors resist opponents advancing toward Drona; several combatants
    are wounded, disabled, or killed by arrows; standards and chariot equipment are
    cut down; and the fighting is repeatedly compared to divine-Asura conflicts, animal
    combats, sowing, and a lotus image.
  language: English
  quote_policy: summarized
