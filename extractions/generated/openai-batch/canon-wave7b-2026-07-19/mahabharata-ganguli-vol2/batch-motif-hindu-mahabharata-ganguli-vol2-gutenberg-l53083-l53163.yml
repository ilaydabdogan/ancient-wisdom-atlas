canonical_text:
  quote: Success depends on Fate!
  summary: Sanjaya reports Duryodhana's anger and lament after Arjuna, aided by Krishna,
    penetrates Drona's battle array and kills Jayadratha. Duryodhana blames Drona
    for failing to protect Jayadratha, while Karna defends Drona and attributes Arjuna's
    success and the failure of Duryodhana's plans to Fate. The passage closes with
    renewed battle between the two armies, which Sanjaya attributes to Duryodhana's
    evil policy.
  language: English
  quote_policy: quoted
