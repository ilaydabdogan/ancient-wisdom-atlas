canonical_text:
  quote: ''
  summary: Dhritarashtra instructs Sanjaya to greet the Pandavas at Upaplavya after
    their difficult sojourn. He praises their truthfulness, discipline, and generosity,
    condemns Duryodhana and Karna, and says Yudhishthira should receive his due share
    before war. He then enumerates the strength of Arjuna, Krishna, Bhima, the sons
    of Madri, and the many kings and warriors allied with the Pandavas, including
    a retrospective allusion to Arjuna’s Khandava exploit and offerings to Agni.
  language: English
  quote_policy: summarized
