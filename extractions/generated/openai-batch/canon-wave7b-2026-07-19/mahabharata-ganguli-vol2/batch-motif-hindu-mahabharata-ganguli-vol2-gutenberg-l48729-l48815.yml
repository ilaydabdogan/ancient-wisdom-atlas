canonical_text:
  quote: ''
  summary: Sanjaya narrates a battlefield sequence in which Yuyudhana/Satyaki is attacked
    by many Kuru warriors, answers each with arrows, defeats Duryodhana by cutting
    his bow, felling his standard, killing his steeds and charioteer, and forcing
    him to flee to another car. Kritavarman then rushes in, attacks Satyaki, his driver,
    and steeds, but is pierced by Satyaki, wounded through his armor by a fiery snake-like
    arrow, and collapses on his car.
  language: English
  quote_policy: summarized
