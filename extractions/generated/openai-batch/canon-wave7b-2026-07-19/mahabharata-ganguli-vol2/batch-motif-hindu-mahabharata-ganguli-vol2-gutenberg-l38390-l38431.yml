  quote: ''
  summary: Sanjaya narrates Bhishma's exhortation to Karna. Bhishma urges Karna to
    serve as refuge and protector of the Kauravas, recalls Karna's earlier conquests
    for Duryodhana, commands him to lead the Kurus in battle, and frames Karna as
    kin. Karna salutes Bhishma, returns to the Kaurava warriors, encourages them,
    and is joyfully received by the army.
