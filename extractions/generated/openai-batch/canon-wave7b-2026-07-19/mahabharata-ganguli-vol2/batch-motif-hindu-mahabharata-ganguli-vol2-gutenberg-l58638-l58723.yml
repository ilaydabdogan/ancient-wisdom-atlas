- id: obs:3
  text: Bhima states that a Kshatriya is so called because he rescues others from
    wounds and injuries, and that such a person must also save himself from wounds
    and injuries.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bhima describes Arjuna as possessing Kshatriya attributes, having prowess
    like Sakra, observing moral bounds like the ocean, and now inclining toward virtue
    and compassion.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bhima recounts that the Pandavas' kingdom was unrighteously taken, Draupadi
