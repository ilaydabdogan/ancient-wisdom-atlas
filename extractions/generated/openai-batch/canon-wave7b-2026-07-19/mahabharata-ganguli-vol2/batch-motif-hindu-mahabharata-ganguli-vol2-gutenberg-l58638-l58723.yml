canonical_text:
  quote: ''
  summary: Sanjaya reports that after Arjuna's words the warriors remain silent. Bhima
    angrily rebukes Arjuna for privileging compassion and moral restraint over Kshatriya
    duty, recalls the Pandavas' loss of kingdom, Draupadi's humiliation, and their
    thirteen-year exile, and offers to defeat Drona's son himself. The son of the
    Panchala king then defends his killing of Drona, arguing that Drona had abandoned
    Brahmana duties, used superhuman weapons and illusion, and that the Panchala son
    was born from sacrificial fire for this purpose.
  language: English
  quote_policy: summarized
