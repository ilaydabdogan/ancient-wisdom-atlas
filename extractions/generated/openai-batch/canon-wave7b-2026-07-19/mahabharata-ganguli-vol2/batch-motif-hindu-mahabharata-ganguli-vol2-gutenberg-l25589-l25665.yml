canonical_text:
  quote: ''
  summary: In a discourse to Arjuna, the Holy One explains how he may be known through
    devotion, refuge, knowledge, and experience. The speaker describes an eightfold
    lower nature, a higher animate nature, his status as source, support, and dissolution
    of the universe, his presence in natural and sacred phenomena, the deluding power
    of the three qualities, classes of worshippers, and the destinies of those who
    worship divinities or him. He also speaks of knowing him at the time of departure
    from the world. Arjuna then asks for definitions of Brahman, Adhyatma, action,
    Adhibhuta, Adhidaiva, Adhiyajna, and the means of knowing the speaker at departure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker tells the son of Pritha to fix his mind on him, practice devotion,
    take refuge in him, and listen to teaching about knowledge and experience.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker lists earth, water, fire, air, space, mind, understanding, and
    consciousness as his eightfold lower nature, and distinguishes a higher animate
    nature by which the universe is held.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says that all creatures have these natures for their source and
    that he is the source of the evolution and dissolution of the entire universe.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker compares all things resting on him to a row of pearls on a string.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker identifies himself with taste in waters, the splendour of moon
    and sun, Om in the Vedas, sound in space, manliness in men, fragrance in earth,
    splendour in fire, life in living creatures, penance in ascetics, the eternal
    seed of beings, intelligence, glory, strength, and duty-consistent desire.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker says that existences marked by goodness, passion, and darkness
    are from him, that they are in him, and that the universe is deluded by those
    three qualities.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker says that his illusion, depending on the three qualities, is difficult
    to transcend, and that those who resort to him alone cross it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speaker identifies four classes of good worshippers and states that the
    man of knowledge is especially dear and rare.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The speaker says that people robbed of knowledge by desire resort to their
    godheads and follow diverse regulations according to their own nature.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The speaker says he steadies whatever faithful form a worshipper desires to
    worship, and that the worshipper obtains desired fruits ordained by him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The speaker says that those who worship divinities go to the divinities, while
    those who worship him come to him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The speaker says he is unmanifest, unborn, undecaying, hidden by illusion,
    and knows past, present, and future, while nobody knows him fully.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The speaker says all creatures are deluded at birth by pairs of opposites
    arising from desire and aversion, while meritorious persons freed from such delusion
    worship him firmly.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The speaker says those who take refuge in him and strive for release from
    decay and death know Brahman, Adhyatma, and action, and that those who know him
    with Adhibhuta, Adhidaiva, and Adhiyajna know him at the time of departure from
    the world.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Arjuna asks what Brahman, Adhyatma, action, Adhibhuta, Adhidaiva, and Adhiyajna
    are, and asks how the speaker is to be known at the time of departure by those
    who have restrained themselves.
  category: speech
  evidence_refs:
  - ev:9
