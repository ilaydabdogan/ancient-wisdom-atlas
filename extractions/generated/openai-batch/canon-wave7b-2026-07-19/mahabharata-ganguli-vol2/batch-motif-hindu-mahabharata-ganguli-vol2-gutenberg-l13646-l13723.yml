canonical_text:
  quote: ''
  summary: Yudhishthira asks Krishna to comfort his sorrowing mother and salute Kuru
    elders. Arjuna states the demand for the kingdom and threatens destruction if
    Dhritarashtra's son refuses. Bhima's delighted rage produces a terrifying shout.
    Krishna departs by chariot, meets radiant sages on the road, worships them, and
    hears from Jamadagni's son that the sages wish to witness the royal conclave and
    hear Krishna's virtuous counsel.
  language: English
  quote_policy: summarized
