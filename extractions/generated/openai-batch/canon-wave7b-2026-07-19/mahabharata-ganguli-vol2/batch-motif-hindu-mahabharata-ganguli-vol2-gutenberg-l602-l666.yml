canonical_text:
  quote: ''
  summary: Yudhishthira enters King Virata's court carrying jeweled golden dice and
    appears with hidden royal radiance. Virata suspects he is a kingly man, asks his
    identity, and Yudhishthira presents himself as Kanka, a Brahmana skilled at dice
    and formerly a friend of Yudhishthira. Virata welcomes him, grants privileges
    and protection, and Yudhishthira lives there honored without being discovered.
  language: English
  quote_policy: summarized
