canonical_text:
  quote: ''
  summary: 'Sanjaya narrates a fierce battlefield sequence: Vrishasena defends a broken
    Kaurava force; Pandava warriors and Draupadi''s sons engage him and his supporters;
    the battle is described through mythic and cosmic similes; Drona rallies the Kauravas,
    attacks Yudhishthira, kills or fells several defenders, and stands before Yudhishthira''s
    car like Death.'
  language: English
  quote_policy: summarized
