canonical_text:
  quote: "“Drona will, surely, never succeed in seizing thee as long as I am alive.”"
  summary: Sanjaya reports that after Drona vows, under limitations, to capture Yudhishthira,
    Yudhishthira learns of the plan and asks Arjuna to remain near him. Arjuna refuses
    both to kill his preceptor Drona and to abandon Yudhishthira, making a strong
    protective vow. The two armies sound instruments, array for battle, and fight.
    Drona, compared to the Sun and to Indra in martial brilliance, attacks the Pandava
    forces and Dhrishtadyumna’s division with arrows.
  language: English
  quote_policy: quoted
