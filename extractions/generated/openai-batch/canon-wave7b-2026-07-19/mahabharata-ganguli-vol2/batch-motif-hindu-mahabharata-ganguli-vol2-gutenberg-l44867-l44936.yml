canonical_text:
  quote: ''
  summary: A radiant ascetic deity identified by names including Bhava, Mahadeva,
    Rudra, Sarva, Sankara, and Siva is seated with Parvati, brilliant creatures, attendants,
    and worshipping Rishis. Vasudeva/Krishna and Partha/Arjuna prostrate themselves,
    praise the deity as cosmic source and destroyer, are welcomed by him, and recite
    a hymn asking that their wish be accomplished. Sanjaya states that they then sought
    to gratify Mahadeva in order to obtain the Pasupata weapon.
  language: English
  quote_policy: summarized
