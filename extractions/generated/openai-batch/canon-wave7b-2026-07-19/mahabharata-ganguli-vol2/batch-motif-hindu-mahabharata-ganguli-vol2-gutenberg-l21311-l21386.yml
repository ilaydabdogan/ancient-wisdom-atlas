canonical_text:
  quote: I shall fight with thee, O regenerate one, on the field of Kurukshetra!
  summary: Bhishma recounts refusing to give the Kasi maiden to his brother because
    she had declared herself Salwa's and had been allowed to go to Salwa's city. Rama,
    Bhishma's former preceptor in arms, angrily orders Bhishma to take the maiden
    and threatens him. Bhishma refuses on grounds of Kshatriya duty and dharma, cites
    a Puranic maxim on renouncing a misguided preceptor, argues that an armed Brahmana
    fighting like a Kshatriya may be met in battle, and challenges Rama to single
    combat at Kurukshetra, invoking Rama's earlier slaughter of Kshatriyas and vowing
    to quell his pride.
  language: English
  quote_policy: quoted
