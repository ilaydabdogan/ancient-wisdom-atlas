canonical_text:
  quote: Prosperity and adversity revolve like a wheel.
  summary: Draupadi laments to Bhima that, because of the dice loss and exile, she
    lives disguised as a Sairindhri under Sudeshna’s command. She contrasts her former
    royal status with present servitude, reflects on destiny and changing fortune,
    shows her corn-marked hands from pounding sandal, and weeps. Bhima is moved to
    tears and holds her hands.
  language: English
  quote_policy: quoted
