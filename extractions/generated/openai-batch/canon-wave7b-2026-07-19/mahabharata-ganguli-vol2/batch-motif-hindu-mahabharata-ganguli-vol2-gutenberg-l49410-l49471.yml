canonical_text:
  quote: ''
  summary: Drona destroys royal princes with arrows, killing them and their attendants.
    Dhrishtadyumna, enraged by the slaughter, attacks Drona, briefly causes him to
    swoon, and attempts to mount Drona's car with a sword to behead him. Drona revives,
    repels him with short close-combat arrows, resumes the duel, kills Dhrishtadyumna's
    charioteer, and routs the Panchalas and Srinjayas. The passage uses similes comparing
    the slain warriors to Daityas and Danavas in the gods-Asuras battle, the duel
    to Indra and Prahlada, heads to plucked flowers or fruit, and arrows to rain-clouds.
  language: English
  quote_policy: summarized
