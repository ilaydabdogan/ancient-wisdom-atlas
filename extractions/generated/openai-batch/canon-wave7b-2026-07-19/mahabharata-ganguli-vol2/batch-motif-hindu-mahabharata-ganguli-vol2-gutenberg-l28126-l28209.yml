canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanjaya about the battle between Drona and the Panchala
    prince Dhrishtadyumna and reflects on destiny. Sanjaya narrates a duel in which
    Drona repeatedly cuts off Dhrishtadyumna's weapons, disables his chariot, and
    checks him with arrows, while Dhrishtadyumna continues to resist with arrows,
    dart, mace, shield, and scimitar. Bhima intervenes to rescue Dhrishtadyumna onto
    another chariot. Duryodhana sends the Kalinga ruler and division to protect Drona,
    leading to a fierce battle between the Kalingas and Bhima while Drona turns against
    Virata and Drupada and Dhrishtadyumna goes to support Yudhishthira.
  language: English
  quote_policy: summarized
