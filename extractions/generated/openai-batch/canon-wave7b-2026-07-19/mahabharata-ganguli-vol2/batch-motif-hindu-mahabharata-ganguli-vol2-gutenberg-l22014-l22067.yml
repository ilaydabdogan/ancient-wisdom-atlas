- id: obs:3
  text: Ascetics in Vatsabhumi behold the princess of Kasi resolved on ascetic austerities,
    try to dissuade her, and ask her purpose.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The maiden says Bhishma expelled her and prevented her from the virtue of
    life with a husband; she states that her vow is for his destruction and not for
    regions of bliss.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The maiden says she has become neither woman nor man, will not desist without
