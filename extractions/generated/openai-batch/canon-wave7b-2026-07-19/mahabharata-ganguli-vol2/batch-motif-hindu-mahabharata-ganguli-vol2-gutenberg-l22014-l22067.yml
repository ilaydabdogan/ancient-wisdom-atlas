- id: obs:8
  text: The deity says his words cannot be false and promises that she will slay Bhishma,
    obtain manhood, remember this life in a new body, be born in the race of Drupada,
    become a skilled Maharatha, and become a man after some time from birth.
  category: speech
  evidence_refs:
  - ev:5
