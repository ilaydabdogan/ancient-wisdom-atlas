canonical_text:
  quote: "“(I do so) for Bhishma's destruction!”"
  summary: The passage describes a female ascetic associated with a partial transformation
    into a river in Vatsabhumi. In Section CXC, the princess of Kasi declares that
    her austerities are for Bhishma’s destruction, receives a promise from the lord
    of Uma/Rudra that she will slay Bhishma after rebirth with memory and eventual
    manhood, and then enters a self-kindled funeral pyre on the bank of the Yamuna.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A female figure in Vatsabhumi is said to have become a river that fills only
    during the rainy seasons, has crocodiles, follows a crooked course, and is difficult
    to access.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Only half of her body is said to have become the river, while the other half
    remained a maiden as before.
  category: attribute
  evidence_refs:
