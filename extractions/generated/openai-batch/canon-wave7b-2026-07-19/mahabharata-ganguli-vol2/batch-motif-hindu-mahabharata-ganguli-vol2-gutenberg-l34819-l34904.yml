  quote: ''
  summary: Sanjaya narrates a battle episode in which Bhimasena is attacked by a group
    of named warriors and a large host. Bhima answers their arrow attacks, cuts bows
    and weapons, disables Jayadratha’s chariot, withstands repeated wounds, and is
    described through similes of Yama, a lion, and a mountain under rain.
  language: English
  quote_policy: summarized
