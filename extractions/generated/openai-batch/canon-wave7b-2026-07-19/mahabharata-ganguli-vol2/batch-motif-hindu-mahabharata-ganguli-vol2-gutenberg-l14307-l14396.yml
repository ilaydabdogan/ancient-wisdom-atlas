canonical_text:
  quote: He that hateth them, hateth me; he that loveth them, loveth me.
  summary: Govinda enters Duryodhana's court, is formally honored with guest-offerings,
    and is invited to eat. He refuses, first saying that envoys accept food and worship
    only after their mission succeeds, and then explaining that Duryodhana's hatred
    of the virtuous Pandavas makes his food unfit. Govinda declares his own soul common
    with the Pandavas and leaves for Vidura's abode.
  language: English
  quote_policy: quoted
