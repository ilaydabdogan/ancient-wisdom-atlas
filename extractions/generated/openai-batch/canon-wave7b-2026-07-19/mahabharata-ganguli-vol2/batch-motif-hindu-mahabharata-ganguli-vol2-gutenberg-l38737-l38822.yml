  quote: destiny is superior to exertion
  summary: Dhritarashtra asks Sanjaya how Drona, a highly accomplished preceptor and
    warrior, could have been slain by the Pandava-allied side and especially by Dhrishtadyumna.
    He laments Drona's death, praises his skill, learning, car, steeds, and role as
    teacher, and speculates that Drona must have been surrounded or checked by many
    opponents before being killed.
