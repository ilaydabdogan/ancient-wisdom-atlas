canonical_text:
  quote: ''
  summary: Sanjaya narrates that the Samsaptakas form a half-moon battle array and
    joyfully await Arjuna. Arjuna tells Krishna that the Trigarta brothers are rejoicing
    when they are about to die, or because they will gain excellent regions unattainable
    by cowards. Arjuna blows his gold-decked conch Devadatta, frightening the opposing
    host and their animals. The warriors recover, exchange arrows with Arjuna, and
    are repeatedly cut down or routed. Arjuna kills Sudhanwan, and the Trigarta king
    rebukes the fleeing warriors for cowardice. The Samsaptakas then rally, blow their
    conchs, and return to battle with the Narayana cow-herds, resolved to face Death.
  language: English
  quote_policy: summarized
