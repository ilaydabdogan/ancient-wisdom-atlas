canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanjaya what Bhima did in battle. Sanjaya reports that
    Bhima, made carless and angered by Karna's insults, reminds Arjuna of their vow.
    Arjuna rebukes Karna for boasting and abusing Bhima, recalls Abhimanyu's death,
    and vows to slay Karna, Karna's son Vrishasena, and other opposing kings. At sunset
    Krishna embraces and praises Arjuna for a fulfilled vow, while Arjuna attributes
    success and future victory to Krishna's grace. Krishna then drives the steeds
    and shows Arjuna the cruel battlefield.
  language: English
  quote_policy: summarized
