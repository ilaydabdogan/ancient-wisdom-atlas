canonical_text:
  quote: ''
  summary: Bhagadatta attacks on an elephant, and Bhimasena reports Iravat's death
    to Kesava and Arjuna. Arjuna grieves for his son, condemns kinslaying for wealth
    and kingdom, and asks Krishna to drive onward through the battle. The fighting
    intensifies; Bhima, opposed by Dhritarashtra's sons and Drona, kills several sons
    and frightens the rest.
  language: English
