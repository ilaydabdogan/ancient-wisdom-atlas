canonical_text:
  quote: ''
  summary: After Jayadratha's fall, Sanjaya describes Suyodhana grieving over the
    slaughter of his forces. Suyodhana goes to Drona and laments the deaths of allies
    including Bhishma, Jayadratha, Jalasandha, the Kamvoja ruler, Alamvusha, and others.
    He calls himself sinful and responsible for the deaths, speaks of slain warriors
    going to Yama's abode, vows either to kill the Panchalas and Pandavas or die and
    go where his allies have gone, and asks Drona's permission.
  language: English
  quote_policy: summarized
