canonical_text:
  quote: ''
  summary: A holy speaker responds to the Pandavas and Arjuna, saying he will strive
    for peace and for what benefits both Pandavas and Kurus, while explaining that
    human effort cannot control providence. He judges Duryodhana unlikely to surrender
    the kingdom, recalls past wrongs against the Pandavas, and says peace with the
    foe should not be expected, though he will do what can be done by speech or act.
  language: English
