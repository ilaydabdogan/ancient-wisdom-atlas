canonical_text:
  quote: Sakuni also, conversant with a hundred different kinds of illusions ... created
    illusions for confounding the two Krishnas.
  summary: After Sakuni's brothers are slain by Arjuna, Sakuni creates multiple battle
    illusions, including weapons, animals, darkness, and water. Arjuna counters them
    with celestial weapons, destroys the illusions, routs the Kaurava host with arrows,
    and the battlefield descends into slaughter and flight.
  language: English
  quote_policy: quoted
