canonical_text:
  quote: '"Except Dhananjaya, the son of Pritha, thou shalt in battle check the four
    other sons of Pandu."'
  summary: Dhritarashtra asks Sanjaya who followed the young Abhimanyu into the Kaurava
    army. Sanjaya says that Pandava and allied warriors attempted to follow Abhimanyu’s
    path to rescue him, but Jayadratha checked them. Sanjaya explains that Jayadratha
    had previously performed severe austerities to Mahadeva after humiliation by Bhimasena,
    received in a dream a boon allowing him to check the sons of Pandu except Arjuna,
    and used that boon with celestial weapons to hold back the Pandava army.
  language: English
  quote_policy: quoted
