canonical_text:
  quote: ''
  summary: 'Sanjaya narrates a battlefield sequence: Satyaki answers Duryodhana by
    invoking Kshatriya duty and readiness to die, then duels him. Karna moves to rescue
    Duryodhana, but Bhimasena intercepts and damages Karna''s chariot. Yudhishthira
    urges Panchala and Matsya warriors to fight according to Kshatriya duty, promising
    sacrificial rewards for victory and blessed regions if slain. Warriors then move
    against Drona, and Arjuna is urged to drive the Kurus away from Drona''s vicinity.'
  language: English
  quote_policy: summarized
