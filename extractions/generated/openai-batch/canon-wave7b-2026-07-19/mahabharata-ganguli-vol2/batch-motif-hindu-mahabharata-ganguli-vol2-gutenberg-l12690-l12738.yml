canonical_text:
  quote: Kesava, however, is immeasurable, being above the power of speech to describe.
  summary: Dhritarashtra asks Sanjaya to recount Krishna's names and their meanings.
    Sanjaya explains a sequence of names of Krishna/Kesava by linking them to divine
    attributes, cosmic functions, illusion, knowledge, truth, slaying of Madhu, and
    a future arrival to prevent the slaughter of the Kurus.
  language: English
  quote_policy: quoted
