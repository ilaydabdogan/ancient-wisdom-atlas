canonical_text:
  quote: Let the earth today be without Arjuna or let it be without the Trigartas.
  summary: After Drona's words, the Trigarta ruler, his brothers, Susarman, and allied
    warriors vow to draw Arjuna away and either kill him or die. They prepare fires,
    Kusa grass, armor, clarified butter, and gifts to Brahmanas, then take a public
    oath before the fires, invoking bad afterlife regions if they return without killing
    Dhananjaya or turn back from fear. They summon Arjuna to the southern part of
    the battlefield. Arjuna asks Yudhishthira for permission to answer the challenge.
    Yudhishthira warns him that Drona has vowed to seize him, and Arjuna appoints
    Satyajit as Yudhishthira's protector, advising withdrawal if Satyajit is slain.
  language: English
  quote_policy: quoted
