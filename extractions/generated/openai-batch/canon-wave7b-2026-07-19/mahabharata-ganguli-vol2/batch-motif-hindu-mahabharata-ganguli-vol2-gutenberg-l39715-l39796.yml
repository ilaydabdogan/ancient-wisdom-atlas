  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The warriors are described as gift-givers to Brahmanas, performers of sacrifices,
    blessed with children, ready to die in battle, and desirous of fame, victory,
    and blessed regions.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: They give gold, kine, and robes to Brahmanas, speak lovingly to one another,
