  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: 'Bhishma states a rule of warrior conduct: ordinary combatants should be fought
    straightforwardly, while deceptive opponents should be fought by deceptive methods.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Bhishma says he can take ten thousand ordinary warriors and one thousand car-warriors
