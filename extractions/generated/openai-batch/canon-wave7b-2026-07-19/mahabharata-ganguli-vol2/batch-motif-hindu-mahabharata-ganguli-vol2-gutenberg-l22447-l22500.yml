canonical_text:
  quote: ''
  summary: Sanjaya reports that, after night has passed, Duryodhana asks Bhishma how
    long the chief Kuru warriors would need to annihilate the Pandava army. Bhishma
    gives a daily slaughter estimate and says he could finish in a month with great
    weapons. Drona, Kripa, Aswatthaman, and Karna give their own estimates. Bhishma
    laughs at Karna's five-day claim and warns that it applies only before Karna meets
    Arjuna in battle with Vasudeva.
  language: English
  quote_policy: summarized
