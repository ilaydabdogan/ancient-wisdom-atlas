  text: The Pandava army is likened to an unbounded sea or sea of warriors that even
    gods could not agitate in battle.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The question names Bhishma, Drona, Kripa, Karna, and Drona's son as Kuru-side
