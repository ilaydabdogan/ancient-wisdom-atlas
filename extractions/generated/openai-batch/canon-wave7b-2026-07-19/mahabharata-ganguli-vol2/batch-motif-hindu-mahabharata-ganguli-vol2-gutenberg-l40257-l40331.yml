canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanjaya who approached Drona after Drona broke the Pandava
    and Panchala forces. Sanjaya reports that Drona routed multiple allied groups
    with arrows, that the Kauravas pursued the fleeing enemy, that Duryodhana rejoiced
    and spoke to Karna, and that Karna warned Duryodhana that Bhima and the Pandavas
    would not abandon battle. Karna recalls earlier wrongs done to the Pandavas, says
    Bhima has turned back with allied warriors, and urges Duryodhana to go to Drona
    before Drona is overwhelmed. Duryodhana and his brothers proceed toward Drona
    as Pandava warriors return with the desire to slay Drona.
  language: English
  quote_policy: summarized
