canonical_text:
  quote: '"this fall and re-ascension of thine"'
  summary: Narada recounts Yayati's restoration to heaven after a fall caused by vanity.
    The Grandsire explains how vanity exhausted Yayati's heavenly merit, while the
    merit and affection of his daughter's sons restored him. Narada applies the story
    as counsel against vanity, wrath, and obstinacy, urging peace with the sons of
    Pandu and teaching that deeds and ritual acts bear fruit for their agent.
  language: English
  quote_policy: quoted
