canonical_text:
  quote: I shall know no peace till I slay all the Panchalas.
  summary: Sanjaya narrates a battle sequence in which Aswatthaman, remembering the
    killing of his father Drona, attacks Dhrishtadyumna. Dhrishtadyumna and Satyaki
    wound and repeatedly disable Aswatthaman, but Aswatthaman vows to kill the Panchalas
    and Somakas, then wounds Satyaki and Dhrishtadyumna with powerful arrows.
  language: English
  quote_policy: quoted
