  quote: '"For the protection of the righteous and for the destruction of the evil
    doers, for the sake of establishing Piety, I am born age after age."'
  summary: The Holy One tells Arjuna of divine births, recurrent self-manifestation
    when piety declines, detached action, varied forms of sacrifice, and liberating
    knowledge that burns actions and carries one over transgressions.
