canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanjaya to describe regions around Meru and Malyavat.
    Sanjaya describes the Northern Kurus, Bhadraswa, the Kalamra and Jamvu trees,
    the Jamvu juice river, the Samvataka fire on Malyavat, and ascetic beings associated
    with the sun and moon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dhritarashtra asks Sanjaya to describe the regions north and east of Meru
    and the mountains of Malyavat.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Northern Kurus are placed south of Nila and north of Meru and are described
    as a residence of Siddhas.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Trees in the Northern Kurus bear sweet fruits and flowers; some yield fruits
    according to the plucker's will, and some yield milk, foods, cloths, and ornaments.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Northern Kurus have golden sands, jewel-like radiance, agreeable seasons,
    and tanks full of crystal water.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The people of the Northern Kurus are described as of celestial origin, pure
    birth, handsome, free from illness, cheerful, and long-lived.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Northern Kurus, opposite-sex twins are born, grow up equally, dress
    alike, love one another, and do not abandon one another.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Bharunda birds with sharp beaks and great strength carry the dead and throw
    them into mountain caves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Bhadraswa, east of Meru, contains Bhadra-sala forest and a large Kalamra tree
    that bears fruits and flowers and is adored by Siddhas and Charanas.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The inhabitants of Bhadraswa are described as strong and radiant; women are
    moonlike, beautiful, and skilled in singing and dancing.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Bhadraswa inhabitants live ten thousand years and remain youthful by drinking
    Kalamra juice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Jamvu tree, located south of Nila and north of Nishadha, is eternal, sacred,
    adored by Siddhas and Charanas, grants every wish, and gives Jamvudwipa its name.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Jamvu fruits are enormous; when ripe they burst, fall with a loud noise, and
    pour out a silvery juice.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The juice of the Jamvu becomes a river, passes circuitously around Meru, and
    reaches the Northern Kurus.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Drinking the Jamvu juice brings peace of mind, prevents thirst, and prevents
    decrepitude.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:15
  text: A brilliant gold called Jamvunada is produced there and is used for celestial
    ornaments.
  category: object
  evidence_refs:
  - ev:6
- id: obs:16
  text: On Malyavat's summit is the Samvataka fire, which blazes at the end of the
    Yuga for the destruction of the universe.
  category: object
  evidence_refs:
  - ev:7
- id: obs:17
  text: The men born on Malyavat are golden-complexioned, fallen from the region of
    Brahman, utterers of Brahma, and practitioners of severe ascetic austerities.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:18
  text: For the protection of creatures, the Malyavat ascetics enter the sun, surround
    it in advance of Aruna, and later enter the lunar disc.
  category: sequence
  evidence_refs:
  - ev:8
