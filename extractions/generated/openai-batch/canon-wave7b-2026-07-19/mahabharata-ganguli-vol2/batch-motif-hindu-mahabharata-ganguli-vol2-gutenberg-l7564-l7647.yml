  summary: Sanjaya visits Yudhishthira at Upaplavya as Dhritarashtra's envoy. After
    formal greetings and welfare inquiries, Yudhishthira asks about the Kuru elders,
    warriors, household, Brahmanas, state functionaries, political dangers, and whether
    the Kurus remember the Pandavas' former martial deeds and rescues.
