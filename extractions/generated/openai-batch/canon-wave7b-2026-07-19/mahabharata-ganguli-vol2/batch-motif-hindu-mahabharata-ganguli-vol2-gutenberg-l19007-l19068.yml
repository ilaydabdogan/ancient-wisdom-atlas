- id: obs:1
  text: Janamejaya asks what measures Duryodhana concerted after hearing that Yudhishthira
    had marched with troops and encamped on Kurukshetra under Vasudeva's protection
    and with allied kings.
  category: speech
  evidence_refs:
  - ev:1
