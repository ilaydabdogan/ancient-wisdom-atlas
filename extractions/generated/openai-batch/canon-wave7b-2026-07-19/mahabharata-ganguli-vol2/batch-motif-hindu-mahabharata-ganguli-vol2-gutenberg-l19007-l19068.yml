canonical_text:
  quote: ''
  summary: Janamejaya asks what Duryodhana did after Yudhishthira encamped on Kurukshetra
    with Vasudeva and allied kings. Vaisampayana reports that after Kesava left the
    Kuru court, Duryodhana told Karna, Dussasana, and Sakuni that war was likely and
    ordered extensive camp, road, supply, weapon, and march preparations. The allied
    monarchs and troops then armed and equipped vehicles and animals, and the Kuru
    capital is described as festive and compared to an ocean.
  language: English
  quote_policy: summarized
