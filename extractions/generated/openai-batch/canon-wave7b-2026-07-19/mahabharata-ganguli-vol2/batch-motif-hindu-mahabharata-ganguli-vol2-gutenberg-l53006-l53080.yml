candidate_motifs:
- id: motif:1
  label: Ignored wise counsel leading to ruin
  taxonomy_refs:
  - wisdom
  basis: Vidura’s peace counsel is described as wise, tearful, and ignored; Drona
    says the present carnage has come from disobedience of those words.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage presents this through Drona’s retrospective accusation rather
    than through a neutral narrator’s separate analysis.
- id: motif:2
  label: Deceitful game becoming lethal consequence
  taxonomy_refs: []
  basis: Drona explicitly links Sakuni’s dice to arrows capable of slaying foes and
    says those arrows are now killing the Kaurava side.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The dice-as-arrows connection is metaphorical speech within the passage.
- id: motif:3
  label: Exile to the woods after deceitful defeat
  taxonomy_refs:
  - departure
  basis: Drona says the Pandavas were vanquished at dice by deceit and sent into the
    woods wearing deer-skins.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This passage only recalls the exile briefly rather than narrating the
    departure in full.
- id: motif:4
  label: Moral consequence and otherworldly punishment for wrongdoing
  taxonomy_refs:
  - divine_judgment
  basis: Drona says the wrong done in the assembly and the ignored counsel have produced
    present calamity and that dire consequences remain for Duryodhana in the next
    world.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:6
  confidence: medium
  cautions: The passage frames judgment through Drona’s moral warning; no separate
    divine adjudication scene is narrated here.
- id: motif:5
  label: Fall of an almost invincible champion as omen of doom
  taxonomy_refs: []
  basis: Drona says Bhishma, regarded as the foremost hero and incapable of defeat
    by gods and Danavas, was slain, after which Drona knew the Bharata host was doomed.
  evidence_refs:
  - ev:1
  - ev:6
  confidence: high
  cautions: The ominous reading is Drona’s interpretation within the speech.
- id: motif:6
  label: Warrior vow before desperate battle
  taxonomy_refs: []
  basis: Drona vows not to remove his armour until he has slain the Panchalas and
    then proceeds into the hostile host as night battle approaches.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: medium
  cautions: The passage gives the vow and advance but not its later outcome.
- id: motif:7
  label: Priestly figures likened to dangerous sacred fire
  taxonomy_refs: []
  basis: Drona instructs Aswatthaman to gratify, worship, and never injure Brahmanas,
    saying they are like flames of fire.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: This appears as ethical instruction within a martial speech, not as an
    enacted ritual scene.
