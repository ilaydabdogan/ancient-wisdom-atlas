canonical_text:
  quote: ''
  summary: Drona answers Duryodhana’s reproaches, recounting Arjuna’s invincibility,
    Bhishma’s fall, the ignored counsel of Vidura, the dice deceit, the assembly wrong
    done to Krishna, the exile and anger of the Pandavas, and the failed rescue of
    Jayadratha. He declares the Kaurava host doomed, gives instructions for Aswatthaman,
    urges reverence toward Brahmanas, and goes to fight the Pandavas as night battle
    approaches.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Drona asks Duryodhana why he wounds him with words and says he had already
    stated that Arjuna cannot be defeated in battle.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Drona says Sikhandin slew Bhishma while protected by Arjuna, and that after
    Bhishma’s fall he knew the Bharata host was doomed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Drona says Sakuni’s dice in the Kuru assembly were not merely dice but lethal
    arrows, and that Vidura’s tearful words urging peace were not heeded.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Drona states that the present carnage came from Duryodhana’s disobedience
    of Vidura’s words and from ignoring trusted friends’ salutary counsel.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Drona refers to the dragging of Krishna into the Kuru assembly, the deceitful
    dice victory over the Pandavas, their being sent to the woods in deer-skins, and
    the provoking of their anger by Duryodhana with Sakuni, Duhsasana, and Karna.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Drona asks why Jayadratha, the ruler of the Sindhus, was slain despite defenders
    including Duryodhana, Karna, Kripa, Salya, Aswatthaman, and other kings, and despite
    Jayadratha’s expectation of rescue from Drona.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Drona says he is grieving, does not see safety for himself, and feels as if
    he is sinking in a mire associated with Dhristadyumna.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Drona refers to Bhishma, Jayadratha, and Bhurisravas as slain warriors and
    notes that Kripa is still alive.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Drona says the Pandava and Srinjaya troops are rushing against him, and he
    vows not to remove his armour until he has slain the Panchalas.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Drona instructs Duryodhana to tell Aswatthaman not to leave the Somakas alone
    even at the risk of his life and to follow his father’s teachings.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: Drona’s instructions for Aswatthaman include humility, self-restraint, truth,
    righteousness, and gratification and worship of Brahmanas, who are compared to
    flames of fire.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Drona says he will penetrate the hostile host, asks Duryodhana to protect
    the troops if he can, and proceeds against the Pandavas as the Kurus and Srinjayas
    prepare to fight at night.
  category: action
  evidence_refs:
  - ev:9
