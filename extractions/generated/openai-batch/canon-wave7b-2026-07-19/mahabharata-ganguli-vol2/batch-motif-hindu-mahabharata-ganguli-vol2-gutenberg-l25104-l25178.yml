canonical_text:
  quote: ''
  summary: A dialogue presents teaching on action without attachment to its fruit,
    equanimity as Yoga, and the signs of a steady-minded contemplative. The Holy One
    describes sense-restraint, the dangers of attachment and anger, peace of mind,
    the ocean-like reception of desires without disturbance, and final absorption
    into the Supreme Self. Arjuna then asks why he is urged toward dreadful work if
    devotion is superior to work.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A water analogy contrasts service by a tank or well with service by a vast
    sheet of water, and compares this to what is available through the Vedas and through
    a Brahmana having knowledge of self or Brahma.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker tells Dhananjaya that his concern is with work only, not with
    the fruit of work, and that the fruit should not be his motive.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker tells Dhananjaya to apply himself to work while casting off attachment
    and remaining the same in success and unsuccess; this equanimity is called Yoga
    or devotion.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker says that the wise, possessed of devotion, cast off the fruit
    born of action, are freed from repeated birth, and attain a region without unhappiness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Arjuna asks Kesava for the indications, speech, posture, and movement of one
    whose mind is fixed on contemplation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Holy One says that one of steady mind casts off desires, is pleased within
    the self, is not agitated amid calamities, and is free from craving, attachment,
    fear, and wrath.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Holy One compares withdrawal of the senses from their objects to a tortoise
    withdrawing its limbs from all sides.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage gives a sequence in which thinking about sense objects gives rise
    to attachment, then wrath, want of discrimination, loss of memory, loss of understanding,
    and ruin.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The self-restrained person, whose senses are under control and free from attachment
    and aversion, attains peace of mind, and the peaceful heart soon becomes steady.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The heart that follows the senses among their objects is said to destroy understanding
    like wind destroying a boat in the waters.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The restrained man is described as awake when it is night for all creatures,
    while what is waking for other creatures is night for a discerning Muni.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The person into whom objects of desire enter is compared to an ocean that
    receives waters while maintaining its water-mark unchanged; such a person obtains
    peace, unlike one who longs for desires.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The person who gives up objects of desire and is free from craving, affection,
    and pride attains peace, reaches a divine state, is not deluded, and on death
    obtains absorption into the Supreme Self.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Arjuna asks Janardana why he is engaged in dreadful work if devotion is regarded
    as superior to work, and he asks for one definite teaching by which he may attain
    what is good.
  category: speech
  evidence_refs:
  - ev:8
