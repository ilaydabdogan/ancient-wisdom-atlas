canonical_text:
  quote: ''
  summary: Narada recounts Yayati's response to Garuda/Tarkshya and Galava. Yayati
    says his wealth is diminished but refuses to disappoint a supplicant, warning
    that a disappointed alms-seeker can destroy a host's lineage. He gives his daughter
    Madhavi to Galava, saying her beauty and value will bring a great dower and desiring
    a daughter's son through her. Galava accepts Madhavi, Garuda departs, and Galava
    approaches King Haryyaswa of Ayodhya, offering Madhavi as wife in return for a
    dower.
  language: English
  quote_policy: summarized
