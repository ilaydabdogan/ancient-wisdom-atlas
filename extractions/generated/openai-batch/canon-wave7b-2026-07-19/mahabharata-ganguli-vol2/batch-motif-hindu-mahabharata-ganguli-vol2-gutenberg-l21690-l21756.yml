canonical_text:
  quote: ''
  summary: Bhishma narrates a renewed day of battle with Rama of Bhrigu's race. Rama
    kills Bhishma's charioteer and strikes Bhishma down; eight radiant Brahmanas support
    and comfort him, and his mother Ganga appears on his car, having controlled and
    protected it. Bhishma resumes fighting, wounds Rama so that he falls unconscious,
    and frightening omens appear. Rama rises again in anger; the combat continues
    until sunset and is said to last twenty-three days.
  language: English
