canonical_text:
  quote: ''
  summary: Indra declares Vritra too powerful to oppose and proposes consulting Vishnu.
    The gods and Rishis seek Vishnu’s protection, praising his earlier cosmic and
    martial deeds. Vishnu advises a conciliatory approach to Vritra and says he will
    invisibly enter Indra’s thunderbolt so Indra can win. The Rishis and celestials,
    led by Indra, approach Vritra, describe the suffering caused by the long conflict,
    and propose eternal friendship between Vritra and Indra. Vritra questions how
    peace can exist between hostile powers, and the Rishis answer with a discourse
    on friendship among righteous persons and Indra’s virtue.
  language: English
  quote_policy: summarized
