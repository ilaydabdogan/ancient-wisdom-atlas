canonical_text:
  quote: Thinking of this, one should cultivate contentment.
  summary: Narada tells Srinjaya that Yayati, son of Nahusha, died despite great sacrifices,
    gifts, victories, offspring, and celestial pleasures. Yayati, finding desire unsatisfied,
    retires to the forest with his wives, teaches contentment, installs his son on
    the throne, and dies. Narada uses the example to tell Srinjaya not to grieve for
    Swaitya.
  language: English
  quote_policy: quoted
