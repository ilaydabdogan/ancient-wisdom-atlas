canonical_text:
  quote: ''
  summary: Sanjaya narrates a night battle in which Salya, ruler of the Madras, attacks
    Virata, kills Satanika, wounds Virata, and routs his force. Vasudeva and Arjuna
    then advance toward Salya. The Rakshasa Alamvusha comes against them in a fearsome
    chariot; Arjuna disables Alamvusha’s chariot and weapons, pierces him, and continues
    toward Drona while striking men, elephants, and steeds.
  language: English
  quote_policy: summarized
