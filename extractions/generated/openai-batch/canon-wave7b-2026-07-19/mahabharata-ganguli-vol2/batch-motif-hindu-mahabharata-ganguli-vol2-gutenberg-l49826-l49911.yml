canonical_text:
  quote: "“universal carnage like to what happens ... at that end of the Yuga”"
  summary: In a fierce battle, Yudhishthira becomes anxious because he cannot see
    Arjuna, Krishna, or Satyaki. He reflects that Satyaki was sent after Arjuna and
    resolves to send Bhima after Satyaki. Yudhishthira goes to Bhima, grieves over
    Arjuna's absent standard, and, hearing Krishna's conch, fears Arjuna may have
    fallen.
  language: English
  quote_policy: quoted
