candidate_motifs:
- id: motif:1
  label: ominous portents before a decisive battle
  taxonomy_refs: []
  basis: The passage gathers weapon anomalies, animal cries, distorted heavenly bodies,
    trembling earth, and animated temple idols before the anticipated Bhishma-Arjuna
    encounter.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:8
  confidence: high
  cautions: This motif is described inside a martial omen-reading scene; no external
    comparison is made in the passage.
- id: motif:2
  label: vow-bound warrior made vulnerable through an unstruck opponent
  taxonomy_refs: []
  basis: Drona says Arjuna advances with Sikhandin before him because Bhishma had
    said he would not slay Sikhandin.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage states the tactical fact and Bhishma's refusal, but it does
    not give the full backstory of the vow.
- id: motif:3
  label: gender-transformed warrior as battlefield pivot
  taxonomy_refs: []
  basis: Sikhandin is described as made female by the Creator and later becoming male,
    and this status is linked to Bhishma's refusal to strike him.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage gives only a compressed statement of transformation; it should
    not be expanded into a full shapeshifting motif without additional textual evidence.
- id: motif:4
  label: battle as perilous river-crossing
  taxonomy_refs: []
  basis: Arjuna on his car is described as crossing a difficult river of battle whose
    eddies are cars, elephants, and steeds.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The image is martial and metaphorical; the passage does not describe an
    actual river journey.
- id: motif:5
  label: army as sea disturbed by a great creature
  taxonomy_refs: []
  basis: Arjuna is compared to a large whale agitating a vast sea of crested waves,
    and Yudhishthira's array is likened to the inaccessible interior of the sea.
  evidence_refs:
  - ev:15
  - ev:17
  confidence: high
  cautions: This is an epic battle simile rather than a literal water setting.
- id: motif:6
  label: warrior duty oriented toward heaven, fame, and victory
  taxonomy_refs: []
  basis: Drona tells his son not to prioritize life, but to go to battle keeping heaven
    before him and seeking fame and victory under Kshatriya duty.
  evidence_refs:
  - ev:11
  - ev:19
  confidence: high
  cautions: The passage states a martial ethical exhortation; it does not narrate
    the son's death or heavenly ascent.
- id: motif:7
  label: protected righteous king at the center of a guarded formation
  taxonomy_refs:
  - royal_legitimacy
  basis: Yudhishthira is characterized by virtues, protected by Vasudeva, and guarded
    by major warriors within a hard-to-access array.
  evidence_refs:
  - ev:13
  - ev:17
  confidence: medium
  cautions: The link to royal legitimacy is based on the passage's virtuous king and
    protector imagery; the passage does not explicitly stage a coronation or succession
