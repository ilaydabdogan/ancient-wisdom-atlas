canonical_text:
  quote: ''
  summary: Sanjaya reports that Drona, while fighting among the Pandava ranks, reads
    numerous ominous signs and tells his son that Arjuna will strive to slay Bhishma.
    Drona explains that Arjuna is advancing with Sikhandin in front because Bhishma
    has said he will not slay Sikhandin, who had been made female and later became
    male. Drona predicts great carnage, tells his son to avoid Arjuna and fight for
    fame, victory, and heaven, describes the battle through river and sea images,
    and assigns his son to face Sikhandin and Vrikodara while Drona goes against Yudhishthira.
  language: English
  quote_policy: summarized
