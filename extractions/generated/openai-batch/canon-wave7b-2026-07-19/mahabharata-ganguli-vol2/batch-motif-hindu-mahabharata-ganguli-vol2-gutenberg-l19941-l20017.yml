canonical_text:
  quote: ''
  summary: Sanjaya narrates that Uluka repeats Duryodhana's harsh message to Arjuna,
    Krishna, and the Pandava side. The Pandavas and their allies become visibly enraged.
    Krishna sends Uluka back with a brief reply that Duryodhana's meaning has been
    understood. Bhima then gives Uluka a longer response for Duryodhana, including
    vows to fight, to kill Duryodhana and his brothers, to drink Dussasana's blood,
    and to send opponents to Yama's abode. Sahadeva also speaks angrily and vows to
    kill Uluka and Sakuni.
  language: English
  quote_policy: summarized
