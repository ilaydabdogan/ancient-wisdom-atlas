canonical_text:
  quote: ''
  summary: Bhishma narrates how Rama, moved by pity for Amva, asks her to speak and
    then promises to command Bhishma or to fight him if he disobeys. Rama also offers
    to address the ruler of the Salwas. Amva recounts that Bhishma released her after
    learning of her attachment to Salwa, that Salwa refused her because he doubted
    her purity, and that Bhishma's violent abduction was the root of her distress.
    She asks Rama to slay Bhishma, comparing the desired act to Purandara slaying
    Vritra.
  language: English
  quote_policy: summarized
