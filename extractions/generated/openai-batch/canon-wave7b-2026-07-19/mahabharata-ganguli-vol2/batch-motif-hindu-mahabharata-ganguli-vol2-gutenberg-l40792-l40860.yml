canonical_text:
  quote: ''
  summary: Sanjaya narrates Arjuna’s response to Bhagadatta’s elephant assault. Arjuna
    first directs Krishna toward Bhagadatta, but when the Samsaptaka car-warriors
    summon him, he deliberates and chooses to attack them. The Samsaptakas cover Arjuna,
    Krishna, the horses, and the chariot with arrows. Arjuna uses the Brahma weapon
    and nearly exterminates them, causing extensive battlefield destruction. Witnesses
    applaud, Krishna praises the feat as beyond what major deities could perform,
    and Arjuna then tells Krishna to go toward Bhagadatta.
  language: English
  quote_policy: summarized
