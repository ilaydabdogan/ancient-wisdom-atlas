canonical_text:
  quote: ''
  summary: 'Draupadi addresses an unnamed Pandava/Bharata and recounts accumulated
    griefs: public dragging and being called a slave, an insult by Saindhava in the
    forest, assault and daily solicitation by Kichaka while she lives as Sairindhri
    in Virata''s palace, and Yudhishthira''s fall from a wealthy, generous sovereign
    to a dice-casting dependent after gambling away his kingdom, wealth, and Draupadi
    herself.'
