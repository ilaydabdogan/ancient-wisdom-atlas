canonical_text:
  quote: Thy speech is of one kind, and thy conduct is of another.
  summary: 'Sanjaya reports that Duryodhana, after arranging the Kaurava camp and
    consulting advisers, sends Uluka to deliver a taunting message to the Pandavas.
    The message includes an old animal exemplum: a wicked cat feigns ascetic virtue
    by the Ganges, gains the trust of birds and mice, becomes the mice''s supposed
    protector, secretly eats them, is exposed by wise mice through signs of predation,
    and is finally abandoned. Duryodhana applies the fable as an accusation against
    his addressee.'
  language: English
  quote_policy: quoted
