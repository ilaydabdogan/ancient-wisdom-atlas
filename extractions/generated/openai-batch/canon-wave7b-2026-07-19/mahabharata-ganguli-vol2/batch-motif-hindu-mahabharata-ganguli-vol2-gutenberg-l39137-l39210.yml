canonical_text:
  quote: '"Upon his seizure is victory and not upon his slaughter"'
  summary: Sanjaya narrates that after Drona receives command of the troops, he offers
    Duryodhana a boon. Duryodhana asks that Yudhishthira be seized alive. Drona questions
    the reason, Duryodhana reveals a plan to defeat Yudhishthira again at dice and
    send the Pandavas back to the woods, and Drona promises only conditionally, saying
    Arjuna must first be removed from Yudhishthira's protection.
  language: English
  quote_policy: quoted
