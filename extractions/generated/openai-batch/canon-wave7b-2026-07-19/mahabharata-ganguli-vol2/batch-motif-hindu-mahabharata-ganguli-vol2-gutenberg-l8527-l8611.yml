  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Vidura defines a wise person as one served in the high ends of life by self-knowledge,
    exertion, forbearance, steadiness in virtue, praiseworthy action, rejection of
    blameworthy action, faith, and reverence.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Vidura says a wise person is not drawn away from high ends by anger, joy,
    pride, false modesty, stupefaction, or vanity, conceals counsels from foes, and
    acts without being obstructed by heat, cold, fear, attachment, prosperity, or
    adversity.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Vidura says a wise person follows virtue and profit rather than pleasure,
    strives according to ability, listens patiently, pursues objects with judgment,
    does not grieve for what is lost, completes what is begun, does not waste time,
    and has the soul under control.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Vidura says wise persons delight in honest deeds, do what tends to happiness
    and prosperity, do not sneer at good things, do not exult at honors or grieve
    at slights, and remain cool and unagitated like a lake in the course of Ganga.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Vidura says a wise person knows the nature of creatures, the connections of
    acts, means for attaining objects, argumentation, books, reason, scriptures, and
    respect for good persons.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Vidura defines a fool as one ignorant of scripture yet vain, poor yet proud,
    using unfair means, neglecting his own objects for others, desiring what should
    not be desired, and bearing malice toward the powerful.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Vidura says a foolish person treats a foe as friend, hates a friend, commits
    wicked deeds, divulges projects, doubts in all things, delays short tasks, neglects
    Sraddha, deities, and noble-minded friends, enters places uninvited, talks unasked,
    and trusts untrustworthy people.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Vidura says the most foolish person blames others while guilty himself, vents
    anger though impotent, and seeks a difficult object without knowing his own strength
    or adopting adequate means.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Vidura says a person of little sense punishes the undeserving, pays homage
