canonical_text:
  quote: ''
  summary: Dhritarashtra asks Vidura for beneficial moral counsel. Vidura replies
    by contrasting Yudhishthira's virtues and claim to sovereignty with Dhritarashtra's
    actions, then gives a long catalogue of the marks of wise and foolish persons,
    concluding with warnings about sin, wealth, dependents, and the destructive power
    of misused intelligence in a kingdom.
  language: English
  quote_policy: summarized
