  quote: ''
  summary: Sanjaya narrates a battlefield encounter in which Ghatotkacha and Alamvusha,
    both Rakshasas, fight with arrows and illusion-making. Alamvusha withstands encirclement
    by Pandava warriors, but Ghatotkacha seizes him from his car, whirls him, hurls
    him to earth, and kills him. The Pandava side celebrates while the Kaurava side
    laments, and the passage frames parts of the combat through several mythic similes.
  language: English
