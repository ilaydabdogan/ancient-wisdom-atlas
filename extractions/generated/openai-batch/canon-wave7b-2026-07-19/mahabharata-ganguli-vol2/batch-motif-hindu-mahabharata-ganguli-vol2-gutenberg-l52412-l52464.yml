canonical_text:
  quote: ''
  summary: Krishna directs Arjuna to kill Jayadratha in a way that the old Sindhu
    king will not know. Arjuna uses a mantra-inspired celestial arrow from Gandiva
    to sever Jayadratha's head, then keeps the head aloft with arrows and sends it
    to Vriddhakshatra, Jayadratha's father, who is performing evening prayers. The
    head lands unseen on Vriddhakshatra's lap; when he stands and it falls to the
    earth, Vriddhakshatra's own head cracks into a hundred pieces. Vasudeva then withdraws
    an illusory darkness, revealing the stratagem. Conches and Bhimasena's shout signal
    the killing to Yudhishthira, and battle resumes after sunset.
  language: English
  quote_policy: summarized
