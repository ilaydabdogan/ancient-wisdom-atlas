canonical_text:
  quote: ''
  summary: At sunset after a destructive day of battle, Arjuna returns toward the
    Pandava camp with Krishna. Arjuna is troubled by fear, weakness, and ominous signs.
    Krishna reassures him that his brother and friends are safe, though some lesser
    evil may have occurred elsewhere. After honoring Twilight, the two reach a melancholy
    and confused camp where auspicious music and praise are absent, warriors hang
    their heads, and Subhadra's son does not come smiling to greet Arjuna.
  language: English
  quote_policy: summarized
