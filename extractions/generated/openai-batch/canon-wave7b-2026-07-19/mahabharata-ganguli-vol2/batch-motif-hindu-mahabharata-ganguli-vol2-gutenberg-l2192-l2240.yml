canonical_text:
  quote: ''
  summary: Vaisampayana reports Duryodhana's council after hearing spy reports. Duryodhana
    worries that the Pandavas' thirteenth year of concealment is nearly complete and
    fears their powerful return if they fulfill their pledge; he urges measures to
    make them re-enter the woods. Karna advises sending more able, well-disguised
    spies to search many political, domestic, sacred, rural, ascetic, river, mountain,
    and cave locations. Dussasana approves renewed spying but doubts the Pandavas'
    path or abode will be discovered and speculates that they may be hidden, beyond
    the ocean, devoured by beasts, or dead from danger.
  language: English
  quote_policy: summarized
