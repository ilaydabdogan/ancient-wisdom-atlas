canonical_text:
  quote: ''
  summary: Sanjaya narrates that Vasudeva and Dhananjaya pass a sleepless night in
    grief while ominous cosmic and natural signs appear. Arjuna sends Krishna to comfort
    Subhadra and her daughter-in-law after the death of Subhadra's son. Vasudeva consoles
    Subhadra by describing her son's heroic Kshatriya death, his attainment of righteous
    heavenly regions, and the certainty that Partha's vow will destroy the ruler of
    the Sindhus.
  language: English
  quote_policy: summarized
