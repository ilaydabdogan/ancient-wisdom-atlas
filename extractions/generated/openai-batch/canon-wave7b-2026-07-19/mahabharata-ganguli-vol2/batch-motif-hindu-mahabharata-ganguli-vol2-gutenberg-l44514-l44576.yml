  text: Arjuna tells Krishna to go comfort Subhadra, her daughter-in-law, and the
    daughter-in-law's companions with soothing and truthful words.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Vasudeva goes to Arjuna's abode with a cheerless heart and comforts his grieving
    sister Subhadra, who is afflicted because of her son's death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Vasudeva tells Subhadra not to grieve, saying that all creatures have one
    end ordained by Time and that her son's end befits a heroic Kshatriya.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Vasudeva says Subhadra's son vanquished many foes, sent them to Yama's presence,
    and then went to eternal regions for the righteous and to heaven.
  category: speech
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:11
  text: Vasudeva foretells that the ruler of the Sindhus, described as a murderer
