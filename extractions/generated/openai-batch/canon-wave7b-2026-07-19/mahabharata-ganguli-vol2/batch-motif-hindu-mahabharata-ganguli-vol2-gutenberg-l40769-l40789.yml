canonical_text:
  quote: people regarded that single elephant as multiplied into many
  summary: In battle, Draupadi's sons and Dhrishtaketu strike Bhagadatta's elephant
    with shafts. The elephant, driven by its riders and by Bhagadatta, throws and
    routs Pandava warriors. The scene is described through comparisons to clouds lit
    by sun-rays, cattle driven by a cowherd, crows fleeing hawks, a winged mountain,
    merchants fearing a surging sea, and Virochana entering the divine host. Wind
    and dust obscure the field so that the single elephant seems multiplied.
  language: English
  quote_policy: quoted
