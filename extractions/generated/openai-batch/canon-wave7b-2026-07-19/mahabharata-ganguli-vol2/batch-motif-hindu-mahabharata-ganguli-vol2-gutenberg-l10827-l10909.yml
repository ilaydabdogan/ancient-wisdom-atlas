canonical_text:
  quote: ''
  summary: Sanjaya reports Arjuna's message, given with Yudhishthira's sanction and
    in Kesava's hearing, to be relayed to Duryodhana, the Kurus, and assembled kings.
    Arjuna says that unless Duryodhana surrenders the kingdom to Yudhishthira, war
    should proceed. He contrasts Yudhishthira's virtue and long endurance of wrongs
    with Duryodhana's unjust conduct, and forecasts Duryodhana's repentance when Yudhishthira,
    Bhima, Nakula, allied monarchs, Draupadi's sons, and Sahadeva devastate the hostile
    army.
  language: English
  quote_policy: summarized
