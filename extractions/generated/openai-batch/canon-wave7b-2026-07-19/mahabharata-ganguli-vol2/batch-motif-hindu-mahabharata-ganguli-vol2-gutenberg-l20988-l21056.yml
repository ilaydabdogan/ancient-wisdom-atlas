canonical_text:
  quote: ''
  summary: Bhishma narrates that ascetics advise the distressed princess Amva not
    to remain in the forest and to return to her father, but she refuses and asks
    to practice austerities. The royal sage Hotravahana, her maternal grandfather,
    arrives, comforts her, and directs her to seek Rama son of Jamadagni, who may
    compel or fight Bhishma. Amva agrees and asks how she may reach Rama and how he
    will relieve her grief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ascetics deliberate about what should be done for the maiden, including
    returning her to her father, reproaching themselves, or asking the ruler of the
    Salwas to accept her despite his prior rejection.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ascetics advise the maiden not to adopt forest life and say that a woman’s
    protector is her father or husband, with her father as protector in misery.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Other ascetics warn that, if she remains alone in deep solitary woods, kings
    may court her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Amva refuses to return to her father’s city of Kasi because she expects disregard
    from her relatives, and she states her desire to practice austerities under ascetic
    protection so that such afflictions may not occur in a future life.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The royal sage Hotravahana enters the forest and is received by the ascetics
    with worship, welcome, a seat, and water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Hotravahana hears Amva’s story, is moved with pity, places her on his lap,
    comforts her, and asks for the details of her distress.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Hotravahana identifies himself as the father of Amva’s mother and tells her
    to rely on him rather than return to her father’s abode.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Hotravahana instructs Amva to go to Rama, son of Jamadagni, saying that Rama
    will dispel her grief and may slay Bhishma if Bhishma does not obey his command.
  category: speech
  evidence_refs:
  - ev:7
