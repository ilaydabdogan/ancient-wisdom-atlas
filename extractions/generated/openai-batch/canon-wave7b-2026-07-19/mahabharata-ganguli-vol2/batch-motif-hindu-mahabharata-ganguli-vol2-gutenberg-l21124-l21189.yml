canonical_text:
  quote: ''
  summary: Akritavrana asks Amva whether she wants Salwa urged to marry her or Bhishma
    defeated by Rama Bhargava. Amva explains that Bhishma abducted her without knowing
    her attachment to Salwa and asks for action consistent with justice. Akritavrana
    argues that Bhishma’s forced abduction caused Salwa’s suspicion and advises vengeance
    against Bhishma. Rama then arrives in the forest as an armed ascetic with disciples;
    he is honored by the assembled ascetics, Hotravahana, and Amva. Hotravahana introduces
    Amva, who bows to Rama, weeps, seeks his protection, and asks him to raise her
    from her sorrow.
  language: English
  quote_policy: summarized
