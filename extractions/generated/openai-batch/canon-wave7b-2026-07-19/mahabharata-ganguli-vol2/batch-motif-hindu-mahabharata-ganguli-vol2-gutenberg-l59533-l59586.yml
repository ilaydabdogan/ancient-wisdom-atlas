canonical_text:
  quote: ''
  summary: Vyasa recounts Rudra/Siva's boons to Narayana/Vasudeva, identifies Nara
    with Arjuna, describes the repeated births of Nara and Narayana in every Yuga,
    and explains Aswatthaman as a portion of Rudra who had worshipped Mahadeva. The
    passage also describes Kesava's worship of Siva in the Phallic emblem and his
    cosmic knowledge. Sanjaya reports Aswatthaman's reverent response, the withdrawal
    of the armies, and Drona's departure to Brahma's region.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The blue-throated God, described as the wielder of Pinaka, grants boons to
    Vasudeva/Narayana/Sauri, including immeasurable might, invincibility in battle,
    and freedom from harm by many classes of beings and objects.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that Narayana now walks the earth as Vasudeva and beguiles
    the universe by his illusion.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nara is said to be born from Narayana's asceticism and equal to Narayana;
    Arjuna is identified as that Nara.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nara and Narayana are said to be older than the oldest gods and to take births
    in every Yuga for the purposes of the world.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The addressed figure, later identified in the narrative as Drona's son, is
    said to have been born as a portion of Rudra because of religious acts and ascetic
    austerities.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:6
  text: In a former life the addressed figure practiced vows, regarded the universe
    as consisting only of Mahadeva, worshipped the great god with mantras, homa, and
    offerings, and received numerous boons.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage compares the addressee's birth, acts, and ascetic austerities
    with those of Kesava and Arjuna, and says the addressee has adored the great God
    in his Phallic form in every Yuga.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kesava is described as a devoted worshipper of Rudra who has sprung from Rudra
    himself and who worships Siva's Phallic emblem as the origin of the universe and
    of all creatures.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Kesava is described as possessing knowledge of the identity of Brahman with
    the universe and as seeing past, present, future, near, and remote things as if
    before his eyes.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: After hearing Vyasa, Aswatthaman bows to Rudra, regards Kesava as worthy of
