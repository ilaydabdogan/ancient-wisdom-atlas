  text: Duryodhana describes the defeat as consuming his limbs like fire consuming
    a dry tree, and asks Bhishma to enable him to slay Ghatotkacha himself.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Bhishma advises Duryodhana to protect himself in battle and says that a king
    should strike a king, naming Yudhishthira, Arjuna, the twins, and Bhimasena as
    proper opponents.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bhishma says that he, Drona, Kripa, Drona's son, Kritavarman, Salya, Somadatta's
