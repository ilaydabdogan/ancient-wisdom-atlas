canonical_text:
  quote: ''
  summary: Duryodhana reports his defeat and Ghatotkacha's victory to Bhishma and
    asks to slay Ghatotkacha. Bhishma advises him on kingly conduct and appoints Bhagadatta
    to confront the Rakshasa. Bhagadatta advances on the elephant Supratika, and a
    fierce battle follows against Pandava warriors, culminating in his attack on Bhimasena.
  language: English
  quote_policy: summarized
