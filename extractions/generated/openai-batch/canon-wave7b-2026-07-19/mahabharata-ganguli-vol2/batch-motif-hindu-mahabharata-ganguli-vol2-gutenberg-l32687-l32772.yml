  evidence_refs:
  - ev:1
- id: obs:2
  text: Duryodhana says he began war relying on Bhishma, has eleven Akshauhinis obedient
    to Bhishma, and yet was defeated by Pandava warriors headed by Bhimasena and relying
    on Ghatotkacha.
  category: speech
  evidence_refs:
  - ev:1
