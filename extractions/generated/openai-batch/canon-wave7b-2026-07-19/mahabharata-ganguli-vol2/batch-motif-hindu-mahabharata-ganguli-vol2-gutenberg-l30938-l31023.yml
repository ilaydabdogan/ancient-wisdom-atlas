  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The serpent taxonomy is supported as imagery for arrows; the passage does
    not present an independent serpent being or serpent cult motif.
- id: motif:6
  label: rejected peace leading to combat
  taxonomy_refs: []
  basis: Bhima includes Duryodhana’s disregard of Krishna’s plea for peace among the
    offences for which he now seeks lethal revenge.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage refers backward to the rejected peace effort but does not
