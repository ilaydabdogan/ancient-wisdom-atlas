candidate_motifs:
- id: motif:1
  label: revenge duel after prior humiliation
  taxonomy_refs: []
  basis: Bhima frames the encounter with Duryodhana as the long-awaited moment to
    avenge exile, humiliation, ignored peace, and other former offences.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This is a battlefield revenge pattern rather than one of the supplied
    high-level mythic taxonomy families.
- id: motif:2
  label: fall of the warrior’s standard
  taxonomy_refs: []
  basis: Bhima cuts down Duryodhana’s gemmed standard bearing an elephant device;
    the passage highlights its fall before all the kings.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage presents this literally as a battle event; symbolic implications
    of royal defeat should be reviewed rather than assumed.
- id: motif:3
  label: chariot rescue of wounded or stranded warrior
  taxonomy_refs: []
  basis: Kripa causes the wounded Duryodhana to mount his own car, and Sutasoma later
    brings the car-deprived Srutakarman onto his car.
  evidence_refs:
  - ev:4
  - ev:9
  confidence: high
  cautions: The repeated pattern is clear, but the passage does not explicitly assign
    a ritual or mythic meaning to the rescue.
- id: motif:4
  label: young champion against many opponents
  taxonomy_refs: []
  basis: Abhimanyu, called the son of Subhadra and a foremost car-warrior, pierces
    many opponents, endures their shaft-shower, and makes them tremble.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage supports the martial pattern; broader heroic typology would
    require comparison outside the supplied text.
- id: motif:5
  label: weapons as fire, thunderbolt, serpent, rain, and meteor
  taxonomy_refs:
  - serpent
  basis: 'The passage repeatedly describes missiles through natural and mythic imagery:
    Bhima’s shafts as flame and thunderbolt, Abhimanyu’s shafts as snakes, the opposing
    arrows as rain on Meru, and Srutakarman’s dart as a blazing meteor.'
  evidence_refs:
