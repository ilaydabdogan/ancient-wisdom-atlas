canonical_text:
  quote: ''
  summary: Sanjaya narrates a battlefield episode at sunset. Duryodhana rushes toward
    Bhima; Bhima recalls earlier wrongs and vows to kill him. Bhima disables Duryodhana’s
    chariot, cuts down his royal standard, and wounds him. Kripa removes the wounded
    Duryodhana to his own car while Jayadratha and others act in support. Abhimanyu
    and allied Pandava warriors then engage Duryodhana’s brothers and other opponents,
    with repeated descriptions of arrows as fire, thunderbolts, rain, snakes, and
    a meteor-like dart.
  language: English
  quote_policy: summarized
