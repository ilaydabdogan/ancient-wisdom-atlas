canonical_text:
  quote: ''
  summary: Sanjaya narrates that the Pandavas and Panchalas advance against Karna,
    who resists them with arrow-showers and inflicts heavy slaughter. The combat is
    repeatedly compared to battles of gods against Asuras, including Sakra, Kartikeya,
    and Purandara against Vritra. Duryodhana asks allies to prevent Arjuna from killing
    Karna, and Dhritarashtra asks what Karna did when facing his deadly foe Arjuna.
  language: English
  quote_policy: summarized
