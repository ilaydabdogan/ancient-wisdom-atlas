canonical_text:
  quote: ''
  summary: The passage describes Bhimasena being urged by the son of Dharma to go
    to Dhananjaya after the renewed blasts of Krishna's conch Panchajanya are heard.
    Bhima prepares for battle, advances with followers, is surrounded by Kuru warriors,
    breaks through toward Drona's division, scatters an elephant force, confronts
    Drona, hurls a mace that destroys Drona's chariot after Drona escapes, and continues
    fighting Duryodhana's sons, cutting Duhsasana's iron dart and killing three brothers
    with shafts.
  language: English
  quote_policy: summarized
