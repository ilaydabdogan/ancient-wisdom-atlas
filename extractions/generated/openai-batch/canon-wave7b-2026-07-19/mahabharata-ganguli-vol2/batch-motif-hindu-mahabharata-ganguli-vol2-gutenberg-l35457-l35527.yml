canonical_text:
  quote: ''
  summary: Dhrishtadyumna orders allied troops to attack Bhishma. Bhishma, relying
    on weapon instruction formerly received from Rama, devastates the Pandava forces
    and stands between the armies. Krishna urges Arjuna to check and slay Bhishma.
    Arjuna and many Pandava warriors attack, while Sikhandin advances under Arjuna's
    protection. Bhishma refuses to shoot Sikhandin because he recalls Sikhandin's
    femininity. Arjuna places Sikhandin before him and repeatedly pierces Bhishma.
  language: English
  quote_policy: summarized
