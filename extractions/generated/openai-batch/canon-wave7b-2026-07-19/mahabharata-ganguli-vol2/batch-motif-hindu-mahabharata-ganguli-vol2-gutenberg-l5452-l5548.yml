canonical_text:
  quote: ''
  summary: Virata asks for the true identities of Yudhishthira's brothers and Draupadi.
    Arjuna reveals that the persons who had served in Virata's household are the Pandavas
    and Draupadi, and says their period of non-discovery is complete. Uttara further
    identifies them and praises Arjuna's martial deeds. Virata seeks to propitiate
    Yudhishthira, asks forgiveness for offenses committed in ignorance, forms an alliance,
    offers his kingdom and his daughter Uttara, and Arjuna accepts Uttara as his daughter-in-law
    to seal a Matsya-Bharata alliance.
  language: English
  quote_policy: summarized
