canonical_text:
  quote: ''
  summary: Nahusha, ruling as king of the gods, presses Indra's queen Sachi to accept
    him as her lord. Sachi delays by asking time to discover Indra's whereabouts.
    The gods seek Vishnu's counsel for Indra, who is burdened by the sin of Brahmanicide
    after Vritra's death. Vishnu prescribes sacrifice; a horse-sacrifice purifies
    Indra, who distributes his sin among trees, rivers, mountains, the earth, and
    women. Indra still fears boon-protected Nahusha and vanishes. Sachi grieves, worships
    Night, and invokes Divination to find Indra.
  language: English
  quote_policy: summarized
