canonical_text:
  quote: ''
  summary: Before the impending battle, Vyasa speaks privately to the sorrowing Dhritarashtra,
    predicts the destruction of his sons and other monarchs, offers him vision of
    the battle, and then grants Sanjaya celestial sight so he can narrate the war.
    Vyasa also describes numerous terrifying omens in birds, beasts, celestial bodies,
    divine images, instruments, vehicles, weather, and astral signs.
  language: English
  quote_policy: summarized
