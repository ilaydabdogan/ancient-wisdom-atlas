canonical_text:
  quote: ''
  summary: In a battlefield duel, Karna and Bhima exchange dense showers of arrows
    while warriors and celestial beings watch. Karna repeatedly disables Bhima's chariot,
    horses, banner, bow, shield, and other weapons. Bhima continues fighting with
    improvised means, seizes Karna's flagstaff, and later takes cover among slain
    elephants, lifting one before Karna cuts it apart. The narration repeatedly heightens
    the combat with fire, serpent, divine-war, Garuda, and Hanumat similes.
  language: English
  quote_policy: summarized
