canonical_text:
  quote: ''
  summary: Vyasa describes favorable omens of battle success, including auspicious
    fire, sounds, celestial rays, birds, sensory conditions, weather, and warrior
    cheerfulness. He contrasts these with signs of destruction, explains how panic
    routs armies, ranks negotiation above battle, notes that determined small groups
    may overcome larger forces, cites Garuda as an example of not needing many followers,
    and concludes that victory is uncertain and costly.
  language: English
  quote_policy: summarized
