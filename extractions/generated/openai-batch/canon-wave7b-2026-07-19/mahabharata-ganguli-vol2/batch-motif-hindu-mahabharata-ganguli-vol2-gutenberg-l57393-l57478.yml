canonical_text:
  quote: The heroic combatants caused a river there, that ran its course towards the
    regions of the dead.
  summary: Sanjaya narrates the dawn resumption of battle after night fighting. A
    mailed warrior worships Aditya at sunrise, the armies clash again with immense
    noise and exhaustion, and the battlefield is described through images of blood,
    a river flowing toward the dead, a crematorium, dust-darkness, and indistinguishable
    friend and foe. Drona and Arjuna are singled out as refuges for their sides, and
    named Kaurava and Pandava warriors enter matched engagements watched by the troops.
  language: English
  quote_policy: quoted
