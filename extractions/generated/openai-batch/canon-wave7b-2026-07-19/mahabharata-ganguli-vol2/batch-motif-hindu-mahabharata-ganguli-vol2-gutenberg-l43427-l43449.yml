canonical_text:
  quote: ''
  summary: Narada tells Srinjaya that King Dilipa, son of Havila and also called Khattanga,
    died despite extraordinary sacrificial merit, wealth, truthfulness, divine regard,
    and marvels associated with him. Narada uses Dilipa’s superiority to argue that
    Srinjaya should not grieve for his son Swaitya, who made no sacrifices or sacrificial
    gifts.
  language: English
