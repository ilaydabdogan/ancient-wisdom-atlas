canonical_text:
  quote: ''
  summary: The Holy One tells Arjuna that gods and great Rishis do not know his origin
    because he is their source; all attributes and all things proceed from him. He
    describes mind-born Rishis and Manus, devotion to him, and a divine gift of knowledge
    that dispels ignorance. Arjuna praises him as supreme, cites Rishi authorities,
    and asks for a fuller declaration of the divine perfections and modes for meditation.
  language: English
  quote_policy: summarized
