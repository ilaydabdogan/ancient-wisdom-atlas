canonical_text:
  quote: ''
  summary: Sanjaya narrates a battlefield episode in which Karna and Bhima repeatedly
    wound one another. Bhima disables Karna’s chariot, Duryodhana sends Durmukha to
    aid Karna, Bhima kills Durmukha, Karna briefly mourns and then continues fighting
    from Durmukha’s car. After further exchanges of arrows, Karna flees while Bhima
    remains in battle.
