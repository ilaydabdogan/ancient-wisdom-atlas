canonical_text:
  quote: ''
  summary: 'Sanjaya narrates night battle episodes: Satanika and Chitrasena exchange
    arrows until Chitrasena is stripped of armour, bow, chariot, horses, and driver
    and ascends another warrior''s car. Vrishasena and Drupada exchange volleys; Vrishasena
    wounds Drupada so severely that he swoons and is carried away. The Kaurava army
    then presses Drupada''s troops; lamps and ornaments make the battlefield shine
    like the sky, the Panchalas flee, and Vrishasena is compared to the sun and a
    single luminary before moving toward Yudhishthira.'
  language: English
  quote_policy: summarized
