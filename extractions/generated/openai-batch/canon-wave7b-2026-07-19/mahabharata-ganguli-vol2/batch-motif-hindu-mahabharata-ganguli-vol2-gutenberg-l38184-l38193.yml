  summary: Dhritarashtra says that the listeners' hearts are turned toward Karna,
    described as Radha's son and a Suta hero ready to die in battle. He asks whether
    Karna met the hopes of the grieving and fearful sons of Dhritarashtra after Bhishma,
    the refuge of the Kauravas, was slain, and whether Karna could fill the resulting
    gap, frighten the foe, and fulfill hopes of victory.
