canonical_text:
  quote: ''
  summary: In a battlefield passage, Arjuna has struck several opposing warriors and
    disabled Karna's car, causing supporting troops to break. Uttara asks where to
    drive the chariot. Arjuna identifies major warriors by their banners, armor, steeds,
    and positions, instructing Uttara how to approach Kripa, Drona, Aswatthaman, Duryodhana,
    Karna, and Bhishma. He commands special reverence toward Drona, caution before
    Karna, and delays approaching Bhishma until last. Uttara then drives toward Kripa.
  language: English
  quote_policy: summarized
