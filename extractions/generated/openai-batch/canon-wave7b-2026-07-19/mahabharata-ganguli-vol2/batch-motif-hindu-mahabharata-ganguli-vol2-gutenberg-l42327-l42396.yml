canonical_text:
  quote: battle, fierce and terrible, between the one and the many
  summary: Dhritarashtra asks Sanjaya what Dhritarashtra's army did after Abhimanyu's
    feats. Sanjaya narrates the troops' fear and flight, renewed attacks by named
    commanders, Abhimanyu's killing of Lakshmana, Duryodhana's angry order, Abhimanyu's
    encirclement by six car-warriors, his attack on Jayadratha's forces, his destruction
    of an elephant division, and his killing of Kratha's son.
  language: English
  quote_policy: quoted
