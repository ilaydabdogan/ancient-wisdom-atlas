canonical_text:
  quote: They who have Vishnu himself on their car, clad in mail and reins in hand,
    they who have Arjuna for their warrior, they can never have defeat!
  summary: A speaker laments the strength of opposing warriors, names Duryodhana,
    Karna, Sakuni, and Duhsasana as the few willing to resist them, stresses that
    Vishnu guides the car while Arjuna fights, recalls Bhishma's death and Vidura's
    foresight, compares Dhananjaya's expected destruction of troops to a wind-driven
    fire consuming dry grass, and asks Sanjaya what measures Duryodhana and others
    adopted after Abhimanyu's death and the wrong done to Partha.
  language: English
  quote_policy: quoted
