canonical_text:
  quote: The kingdom of the Kurus is enjoyable in due order of succession.
  summary: Vidura falls silent in sorrow. The daughter of king Suvala addresses Duryodhana
    before kings and Rishis, condemning his claim to sovereignty and arguing from
    Kuru custom, Bhishma's authority, and paternal right that the kingdom belongs
    to Pandu's line and that Yudhishthira should lawfully rule.
  language: English
  quote_policy: quoted
