canonical_text:
  quote: ''
  summary: Abhimanyu rejects his charioteer's warning, boasts that he would not fear
    even divine or paternal opponents, and orders the chariot toward Drona's army.
    He enters and breaks the Kaurava array, is surrounded, and slaughters warriors,
    vehicles, elephants, and horses. The battle is described with images of a Ganga-ocean
    eddy, insects falling on fire, a sacrificial altar strewn with Kusa grass, five-headed
    snakes slain by Garuda, and severed lotuses.
  language: English
  quote_policy: summarized
