  summary: Janamejaya asks what the sons of Pandu did after Sanjaya returned to the
    Kurus. Vaisampayana recounts that Yudhishthira appealed to Krishna for protection
    in a time of distress, saying that the Pandavas had relied on Krishna while asking
    Duryodhana for their share. Krishna replies that he is present and will do whatever
    Yudhishthira asks.
