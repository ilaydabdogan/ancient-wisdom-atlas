canonical_text:
  quote: ''
  summary: After completing their vow, the five Pandavas enter Virata's palace in
    ceremonial attire and sit on royal thrones. Virata angrily questions Kanka, whom
    he knows as a dice-playing courtier, for occupying a royal seat. Arjuna responds
    by identifying him as Yudhishthira and praising his royal, moral, sacrificial,
    martial, and protective qualities, arguing that he deserves a royal seat.
  language: English
  quote_policy: summarized
