canonical_text:
  quote: ''
  summary: After the thirteenth year, the Pandavas take residence at Upaplavya. Yudhishthira,
    Virata, and their allies gather kings, kinsmen, troops, and gifts for the marriage
    of Abhimanyu and Uttara. The nuptial festival includes music, feasting, bards,
    a procession of women, formal acceptance of the bride, libations on a blazing
    fire, dowry, homage to Brahmanas, and large redistributions of wealth. The Matsya
    city is described as bright and festive.
  language: English
  quote_policy: summarized
