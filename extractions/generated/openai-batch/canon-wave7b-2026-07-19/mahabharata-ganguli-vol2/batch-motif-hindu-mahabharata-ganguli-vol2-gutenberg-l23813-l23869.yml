  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sakadwipa contains seven mountains decked with jewels and functioning as mines
    of gems and precious stones, as well as many rivers.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Meru is named as the first mountain and is described as the abode of gods,
    Rishis, and Gandharvas.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Malaya stretches eastward; clouds are generated there and disperse from there
    in all directions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Jaladhara is named as a large mountain from which Indra daily takes excellent
    water, and rainy-season showers are said to come from that water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Raivataka is a high mountain over which the constellation Revati has been
