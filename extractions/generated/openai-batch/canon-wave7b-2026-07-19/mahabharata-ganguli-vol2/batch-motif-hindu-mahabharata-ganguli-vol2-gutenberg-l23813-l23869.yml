canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanjaya for a true account of the dimensions of islands,
    oceans, and celestial bodies. Sanjaya describes a cosmographic arrangement of
    islands and oceans, especially Jamvu and Sakadwipa, and then details seven jeweled
    mountains of Sakadwipa, including Meru, Malaya, Jaladhara, Raivataka, and Syama,
    with their divine, meteorological, celestial, and color attributes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dhritarashtra asks Sanjaya to describe the dimensions and extent of Jamvukhanda,
    several islands and oceans, and Rahu, Soma, and Surya.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sanjaya says there are many islands over which the Earth extends and that
    he will describe seven islands, the moon, the sun, and Rahu.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sanjaya gives a measurement for the Jamvu mountain and says the salt ocean
    is twice its extent, circular, adorned with gems, corals, metal-variegated mountains,
    and populated by Siddhas and Charanas.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sakadwipa is said to be twice the extent of Jamvudwipa and to be surrounded
    on all sides by an ocean that is twice Sakadwipa's extent.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The kingdoms of Sakadwipa are described as righteous; its people are said
