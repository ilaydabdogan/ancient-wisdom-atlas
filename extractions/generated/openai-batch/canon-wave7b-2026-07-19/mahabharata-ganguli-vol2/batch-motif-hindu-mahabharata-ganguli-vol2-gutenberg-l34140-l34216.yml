canonical_text:
  quote: ''
  summary: Yudhishthira asks Krishna to aid without fighting and proposes going to
    Bhishma, the Pandavas' aged grandsire and battlefield opponent, to ask the means
    of Bhishma's death. Krishna approves. The Pandavas and Vasudeva lay aside armor
    and weapons, enter Bhishma's tent, bow, and seek his protection. Yudhishthira
    asks how victory, sovereignty, and the stopping of destruction may be obtained.
    Bhishma states that victory is impossible while he lives, but that after he is
    vanquished or slain the Pandavas may win, and he gives them permission to strike
    him.
  language: English
  quote_policy: summarized
