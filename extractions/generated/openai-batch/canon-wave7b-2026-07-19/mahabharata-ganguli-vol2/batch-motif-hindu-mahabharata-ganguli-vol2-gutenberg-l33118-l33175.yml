canonical_text:
  quote: ''
  summary: Sanjaya reports that Bhishma, grieved by Duryodhana's reproach, answers
    calmly. Bhishma says the Pandavas, especially Arjuna, are invincible, citing prior
    victories and Vasudeva's protection. He warns Duryodhana, vows to fight the Somakas
    and Panchalas while avoiding Sikhandin, explains Sikhandin's female birth and
    later male transformation by boon, and Duryodhana later orders the army to be
    arrayed at dawn.
  language: English
  quote_policy: summarized
