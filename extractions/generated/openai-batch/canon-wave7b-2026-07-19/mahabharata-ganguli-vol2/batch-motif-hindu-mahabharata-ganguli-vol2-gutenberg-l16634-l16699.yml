canonical_text:
  quote: ''
  summary: In a council scene, Bhishma, Drona, Vidura, and Dhritarashtra each address
    Duryodhana after Krishna's peace counsel. They urge him to accept counsel, avoid
    wrath, reconcile with the Pandavas, and warn that refusal will bring defeat, destruction
    of kin, grief for his parents, and ruin for the Bharatas.
  language: English
  quote_policy: summarized
