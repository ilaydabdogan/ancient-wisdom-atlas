canonical_text:
  quote: ''
  summary: Dhritarashtra questions Sanjaya about knowing Madhava as Supreme Lord.
    Sanjaya attributes this knowledge to wisdom, faith, purity of soul, and scripture,
    and identifies Kesava as creator, increate, and the source and return of all things.
    Dhritarashtra urges Duryodhana to seek refuge in Janardana, but Duryodhana refuses.
    Gandhari rebukes Duryodhana and predicts his fall by Bhimasena. Vyasa and Sanjaya
    advise Dhritarashtra that salvation comes through the wise path of sense-control,
    spiritual knowledge, renunciation, noninjury, and freedom from avarice and desire.
  language: English
  quote_policy: summarized
