canonical_text:
  quote: ''
  summary: Sanjaya narrates Bhurisravas advancing against Satyaki/Yuyudhana, threatening
    to kill him, and Satyaki answering with defiance. The two warriors exchange rebukes
    and fight first with arrows from their cars, then, after killing each other's
    steeds and cutting each other's bows, continue on foot with swords and shields.
    The narration uses animal and martial similes and mentions death as a passage
    to Yama's abode or to the highest region of Brahman.
  language: English
  quote_policy: summarized
