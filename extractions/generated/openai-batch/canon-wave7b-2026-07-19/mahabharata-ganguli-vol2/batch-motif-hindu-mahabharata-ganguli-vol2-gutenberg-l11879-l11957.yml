canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanjaya which allies have come to fight for the Pandavas.
    Sanjaya lists Krishna, several kings, warriors, and Akshauhini divisions, then
    explains how the Pandava side has assigned particular enemies to particular champions.
    Dhritarashtra responds with dread, describing his sons and many kings as doomed
    before the strength of Bhima, Arjuna, Krishna, Yudhishthira, and the Pandava allies.
  language: English
  quote_policy: summarized
