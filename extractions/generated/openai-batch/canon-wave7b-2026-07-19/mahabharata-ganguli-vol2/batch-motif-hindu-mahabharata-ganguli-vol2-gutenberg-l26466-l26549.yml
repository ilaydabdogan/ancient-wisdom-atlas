  quote: ''
  summary: The Holy One instructs Arjuna on renunciation, abandonment of the fruit
    of action, prescribed works such as sacrifice, gift, and penance, the five causes
    of action, non-egoic agency, and the threefold classification of knowledge, action,
    agents, intellect, constancy, and happiness according to goodness, passion, and
    darkness.
