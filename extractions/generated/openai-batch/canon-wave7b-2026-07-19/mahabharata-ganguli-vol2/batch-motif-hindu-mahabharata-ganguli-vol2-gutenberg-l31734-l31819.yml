canonical_text:
  quote: ''
  summary: Sanjaya narrates a battlefield sequence in which Vikarna helps Chitrasena
    after the loss of his car; Bhishma attacks Yudhishthira and the twins, exchanges
    arrows with Yudhishthira, kills Yudhishthira's horses, and continues devastating
    opposing warriors after being surrounded. Sikhandin rushes at Bhishma, but Bhishma
    disregards him because of remembered femininity. Dhrishtadyumna and Satyaki attack
    the Bharata host; Vinda and Anuvinda of Avanti counterattack, and Dhrishtadyumna
    mounts Satyaki's car after his own horses are slain. Yudhishthira, Duryodhana,
    Arjuna, Drona, and other warriors continue the wider battle.
  language: English
  quote_policy: summarized
