canonical_text:
  quote: ''
  summary: Kesava responds to Duryodhana's plan to seize him by revealing a blazing,
    many-formed divine body containing gods, heroes, beings, and weapons. Selected
    witnesses are given divine sight while other kings close their eyes; celestial
    and terrestrial portents occur. Kesava withdraws the form, leaves the Kuru court,
    answers Dhritarashtra's plea, and departs by chariot toward Kunti's abode.
  language: English
  quote_policy: summarized
