canonical_text:
  quote: '"rescued from within the jaws of Death"'
  summary: Vasudeva tells Satyaki that Duryodhana and others had urged Karna to reserve
    a deadly dart for Arjuna. Vasudeva says he stupefied Karna so the dart was not
    used on Arjuna, and that he rejoiced when the weapon was rendered futile through
    Ghatotkacha. He explains that he had sent the Rakshasa against Karna because no
    one else could withstand Karna at night. Sanjaya closes by noting Vasudeva's devotion
    to Dhananjaya's welfare.
  language: English
  quote_policy: quoted
