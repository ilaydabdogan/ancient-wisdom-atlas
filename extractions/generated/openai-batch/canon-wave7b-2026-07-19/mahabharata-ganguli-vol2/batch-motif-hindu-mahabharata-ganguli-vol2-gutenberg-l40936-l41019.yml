canonical_text:
  quote: ''
  summary: Sanjaya narrates Bhagadatta's battle against Arjuna and Krishna from atop
    an elephant. Bhagadatta attacks with arrows, lances, and finally the Vaishnava
    weapon, which Krishna intercepts so that it becomes a garland on his breast. Krishna
    explains the weapon's ancient origin as a boon granted to Earth for her son Naraka
    and says Bhagadatta received it from Naraka. After the weapon is baffled, Arjuna
    kills Bhagadatta's elephant and then Bhagadatta.
  language: English
  quote_policy: summarized
