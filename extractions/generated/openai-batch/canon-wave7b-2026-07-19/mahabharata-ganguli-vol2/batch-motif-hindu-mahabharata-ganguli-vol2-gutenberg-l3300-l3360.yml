canonical_text:
  quote: ''
  summary: Uttara observes weapons belonging to Partha and asks where the Pandavas
    and Draupadi are. Arjuna reveals the disguised identities of himself, the other
    Pandavas, and Draupadi in Virata's household. Uttara asks Arjuna to prove his
    identity by naming and explaining the ten names of Partha. Arjuna lists and explains
    the names through conquest, victory, horses, birth, divine gift, conduct, martial
    skill, complexion, invincibility, parentage, and affectionate naming. Uttara then
    salutes Partha, gives his own names, welcomes him, apologizes for ignorant speech,
    and says his fears are dispelled.
  language: English
  quote_policy: summarized
