canonical_text:
  quote: ''
  summary: Salya concludes a sacred account of Indra’s victory and restoration, applying
    it to Yudhishthira’s expected recovery of his kingdom. Indra returns with divine
    attendants, reunites with his queen, honors Angiras/Atharvangiras, and governs
    virtuously. Salya predicts the fall of Yudhishthira’s enemies and describes the
    protective and victory-conferring benefits of hearing or reading Indra’s victory
    story. Yudhishthira then asks Salya to weaken Karna’s morale while serving as
    his charioteer, and Salya agrees before departing to Duryodhana.
  language: English
  quote_policy: summarized
