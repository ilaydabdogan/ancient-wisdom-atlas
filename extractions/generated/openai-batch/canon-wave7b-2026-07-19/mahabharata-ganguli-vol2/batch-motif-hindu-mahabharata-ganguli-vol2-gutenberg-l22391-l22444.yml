canonical_text:
  quote: ''
  summary: Vaisravana curses the Yaksha Sthunakarna to remain a woman while Sikhandin
    remains a man, but after intercession by the Yakshas he limits the curse until
    Sikhandin's death. Sikhandin returns to Sthuna, learns what happened, returns
    joyfully to his city, worships deities, big trees, and crossways, and is trained
    by Drona in arms. Bhishma explains that Sikhandin was first born female, later
    became male, and was Amva reborn in Drupada's line; because of his vow not to
    strike a woman, former woman, or one with feminine name or form, Bhishma will
    not slay Sikhandin. Duryodhana accepts this conduct as proper.
  language: English
  quote_policy: summarized
