canonical_text:
  quote: ''
  summary: Vaisampayana describes Krishna's departure for Hastinapura with an armed
    and provisioned train. Janamejaya asks about the journey and omens. Vaisampayana
    recounts disorderly omens in sky, rivers, earth, fire, water, darkness, wind,
    and Hastinapura, while the places Krishna passes become auspicious with pleasant
    breezes, flowers, and a cleared road. People, women, citizens, and Brahmanas honor
    Krishna with worship and offerings. At Vrikasthala he performs evening rites,
    orders a night halt for Yudhishthira's mission, receives Brahmanas, feeds them,
    and spends the night.
  language: English
  quote_policy: summarized
