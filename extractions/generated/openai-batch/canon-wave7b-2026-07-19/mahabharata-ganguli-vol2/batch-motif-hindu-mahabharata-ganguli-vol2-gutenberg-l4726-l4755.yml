  quote: ''
  summary: Vaisampayana narrates a chariot-battle episode in which the son of Virata
    enters Bhishma's protected array after assurance from Savyasachin. Arjuna, under
    several epithets, confronts Bhishma, cuts down his standard, and then defeats
    or disables Dussasana, Vikarna, Dussaha, and Vivinsati as they surround or attack
    him.
