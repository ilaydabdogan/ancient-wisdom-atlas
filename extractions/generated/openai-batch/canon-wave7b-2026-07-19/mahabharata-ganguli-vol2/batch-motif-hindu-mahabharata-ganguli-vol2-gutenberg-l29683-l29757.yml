canonical_text:
  quote: And victory is there where righteousness is.
  summary: Dhritarashtra asks Sanjaya why the Pandavas appear unslayable while his
    own sons are being defeated. Sanjaya answers that the Pandavas are not using incantation
    or illusion but prevail because they act according to morality and righteousness,
    while Dhritarashtra's sons reap the result of sinful and deceitful conduct and
    rejected counsel. Sanjaya then reports that Duryodhana had asked Bhishma a similar
    question after seeing his brothers defeated.
  language: English
  quote_policy: quoted
