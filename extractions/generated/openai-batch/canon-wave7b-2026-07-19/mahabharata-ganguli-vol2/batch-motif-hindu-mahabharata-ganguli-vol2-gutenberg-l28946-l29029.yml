canonical_text:
  quote: ''
  summary: During battle, Krishna announces that he will take up his discus and personally
    slay Bhishma, Drona, the sons of Dhritarashtra, and their allies in order to secure
    a kingdom for Ajatasatru. He abandons the chariot reins, advances toward Bhishma
    with Sudarsana, and is described through lotus and world-ending fire imagery.
    Bhishma welcomes death at Krishna's hands. Krishna rebukes Bhishma for failing
    to restrain a wrongful king, while Bhishma invokes destiny. Arjuna restrains Krishna,
    swears to fight as pledged, and Krishna resumes the reins and blows Panchajanya.
  language: English
  quote_policy: summarized
