canonical_text:
  quote: ''
  summary: After Jimuta is killed, King Virata rewards Vallava, who continues to please
    the king through combat against strong men and animals. Arjuna pleases the king
    and women of the inner apartments by song and dance; Nakula and Sahadeva please
    Virata through trained steeds and bullocks and receive rewards. Draupadi is distressed
    at the warriors' suffering. The eminent persons live in disguise while serving
    Virata.
