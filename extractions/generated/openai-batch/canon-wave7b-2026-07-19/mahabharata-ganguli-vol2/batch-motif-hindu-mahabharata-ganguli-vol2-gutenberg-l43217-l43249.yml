canonical_text:
  quote: The deity of the clouds showered gold unto him from year's end to year's
    end.
  summary: Narada tells Srinjaya that the virtuous and sacrificial king Suhotra also
    died. Suhotra ruled justly, consulted ritual authorities, received miraculous
    gold from the cloud deity, gave vast wealth to Brahmanas, performed many sacrifices,
    and attained a desirable end. Narada uses Suhotra’s greater merit and mortality
    to tell Srinjaya not to grieve for his son.
  language: English
  quote_policy: quoted
