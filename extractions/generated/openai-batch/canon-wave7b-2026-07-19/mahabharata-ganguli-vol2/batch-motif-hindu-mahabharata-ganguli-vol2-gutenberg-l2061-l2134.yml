canonical_text:
  quote: those mighty sons of the Sutas have all been slain by the Gandharvas.
  summary: After the Sutas/Kichakas are slain, citizens warn King Virata that Sairindhri’s
    return may endanger the kingdom because of her beauty and her Gandharva protectors.
    Virata orders funeral rites and, through Queen Sudeshna, tells Sairindhri to leave.
    Draupadi/Sairindhri, delivered by Bhima, washes and returns to the city, privately
    acknowledges Bhima as her rescuer, meets Vrihannala/Arjuna and the princesses,
    and finally asks the queen for permission to remain only thirteen more days.
  language: English
  quote_policy: quoted
