canonical_text:
  quote: ''
  summary: Susarman argues that Matsya is vulnerable after Kichaka's death and urges
    Duryodhana and the Kauravas to invade Virata's kingdom, plunder wealth, and seize
    cattle. Karna approves the plan. Duryodhana orders Dussasana to array the forces,
    sends Susarman and the Trigartas first under concealment, and has the Kauravas
    follow in divisions. The Trigartas and then the Kauravas begin seizing Virata's
    cattle by thousands.
  language: English
  quote_policy: summarized
