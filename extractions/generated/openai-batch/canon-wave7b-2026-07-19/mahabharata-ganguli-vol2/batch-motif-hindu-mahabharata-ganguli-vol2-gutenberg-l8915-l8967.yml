canonical_text:
  quote: ''
  summary: Dhritarashtra asks Vidura for more instruction. Vidura teaches that kindness
    to creatures is at least equal to ablution at holy places, urges kindness toward
    Dhritarashtra's sons, and introduces an old story about Kesini and two suitors,
    Virochana and Sudhanwan. In the story, Kesini asks Virochana whether Brahmanas
    or the sons of Diti are superior. Virochana claims superiority for his own lineage.
    Sudhanwan later arrives, is ritually received by Kesini, refuses to share Virochana's
    golden seat as an equal, and disputes Virochana's claim of status. The rivals
    agree to stake their lives and take the question to Prahlada, whom Sudhanwan says
    will not lie even for his son.
  language: English
  quote_policy: summarized
