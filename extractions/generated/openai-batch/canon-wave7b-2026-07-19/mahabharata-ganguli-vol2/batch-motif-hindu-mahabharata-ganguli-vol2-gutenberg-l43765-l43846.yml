canonical_text:
  quote: ''
  summary: Narada recounts to Srinjaya the death and greatness of King Prithu, describing
    his consecration as emperor, the abundance and safety of his reign, the petition
    of many classes of beings, the milking of the Earth for each group's desired substance,
    and Prithu's sacrificial gifts before using his death as an argument against grief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Narada tells Srinjaya that Vena's son, King Prithu, died.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Great Rishis installed Prithu as emperor in a Rajasuya sacrifice, and he vanquished
    all.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Prithu is said to have received names or titles because he protected people
    from injury and was loved by his subjects.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: During Prithu's time, the earth yielded crops without cultivation, cows yielded
    milk on touch, lotuses contained honey, Kusa blades were golden, fruits were sweet,
    people did not starve, and people were healthy and unafraid.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: People in Prithu's dominion dwelt on trees or in caves as they wished, without
    the realm being divided into provinces and towns.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: When Prithu went to the sea, the waves became solid, mountains opened passages
    for him, and the standard of his car was not obstructed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Trees, mountains, gods, Asuras, men, snakes, seven Rishis, Apsaras, and Pitris
    came to Prithu and asked him for boons, calling him emperor, king, protector,
    father, and lord.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Prithu told the Earth to yield the milk desired by the assembled beings; the
    Earth asked to be regarded as his daughter, and Prithu agreed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The assembled beings milked the Earth using different calves, milkers, vessels,
    and forms of milk, each receiving what it desired.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: Trees received torn buds as milk; mountains received gems and herbs; gods
    received things giving energy and strength; Asuras received wine; humans received
    cultivation and crops; snakes received poison; Rishis received the Vedas; Yakshas
    received disappearance at will; Gandharvas and Apsaras received fragrant perfumes;
    Pitris received Swaha.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: Prithu performed sacrifices, gratified creatures with gifts, made golden images
    of articles on earth, gave golden elephants to Brahmanas, and gave the jewel-
    and gold-decked earth to Brahmanas.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Narada concludes that since Prithu, who was superior in virtues and sacrifice,
    died, Srinjaya should not grieve for Swaitya.
  category: speech
  evidence_refs:
  - ev:10
