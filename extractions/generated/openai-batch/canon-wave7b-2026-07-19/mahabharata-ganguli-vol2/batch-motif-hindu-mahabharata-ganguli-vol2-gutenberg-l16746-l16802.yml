canonical_text:
  quote: ''
  summary: Duryodhana replies to Krishna in the Kuru assembly. He denies personal
    fault, argues that the Pandavas lost their kingdom through dice, asserts a Kshatriya
    duty not to bow to enemies, presents battle death on a bed of arrows as leading
    to heaven, cites Matanga's maxim about remaining erect rather than bending, and
    refuses to give the Pandavas even a needle-point portion of land.
  language: English
  quote_policy: summarized
