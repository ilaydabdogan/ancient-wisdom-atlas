  summary: A first-person warrior identified by epithets Partha and Savyasachin predicts
    that his Gandiva arrows will devastate the Kaurava forces and make Dhritarashtra's
    son repent. He recalls a Brahmana's prophecy that either Indra or Krishna would
    aid him, states that he chose Vasudeva/Krishna, and then catalogs Krishna's invincibility
    and past deeds, including carrying off Rukmini, restoring kings, defeating enemies,
    and being employed by the gods against Asuras.
