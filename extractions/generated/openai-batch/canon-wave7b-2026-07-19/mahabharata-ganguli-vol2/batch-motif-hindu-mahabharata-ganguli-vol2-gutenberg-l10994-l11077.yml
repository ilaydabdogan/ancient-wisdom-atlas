candidate_motifs:
- id: motif:1
  label: foretold battlefield devastation and enemy repentance
  taxonomy_refs: []
  basis: The speaker repeatedly predicts that his weapons will destroy the enemy host
    and cause the son of Dhritarashtra to repent for the war.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: This is framed as a warrior's prediction or boast, not as a completed
    event within the passage.
- id: motif:2
  label: battle destruction likened to world-ending fire
  taxonomy_refs:
  - world_destroying_fire
  basis: The speaker explicitly compares consuming the Kauravas to Agni consuming
    wicked souls at the end of a Yuga.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The end-of-Yuga fire is used as a comparison for battle destruction rather
    than narrated as an actual cosmic event.
- id: motif:3
  label: prophecy of divine aid before difficult combat
  taxonomy_refs: []
  basis: A Brahmana foretells that the speaker must fight a difficult battle and that
    either Indra or Krishna will aid him.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not identify the Brahmana beyond his social/religious
    label.
- id: motif:4
  label: chosen divine ally assures victory
  taxonomy_refs: []
  basis: The speaker states that he chose Vasudeva as ally and that a person whose
    success Krishna merely wishes is certain to prevail over enemies.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The statement is made by the speaker and should be treated as character
    speech within the passage.
- id: motif:5
  label: impossible assault on an invincible divine hero
  taxonomy_refs: []
  basis: The passage describes conquering Krishna as equivalent to crossing the ocean
    with one's arms, splitting Kailasa by a slap, extinguishing fire, stopping the
    sun and moon, and plundering Amrita.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: These are rhetorical similes for impossibility, not literal attempted
    actions in this passage.
- id: motif:6
  label: carrying off a woman for marriage
  taxonomy_refs:
  - stolen_beloved
  - sacred_marriage
  basis: Krishna is said to have carried off Rukmini on a single car for the purpose
    of making her his wife.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage does not provide Rukmini's consent, prior relationship, or
