canonical_text:
  quote: ''
  summary: Yudhishthira addresses Sanjaya on discerning virtue and vice, especially
    when distress alters ordinary duties. He argues that one should follow the duties
    of one’s birth order in ordinary times but that exceptions exist in distress.
    He refuses wealth or heavenly regions gained by unrighteous means and appeals
    to Krishna as a wise judge of whether rejecting peace or fighting would be blameworthy.
    He praises Krishna’s counsel as bringing victory, friendship, prosperity, and
    proper moral judgment.
  language: English
  quote_policy: summarized
