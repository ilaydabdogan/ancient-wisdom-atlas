canonical_text:
  quote: "“Drona had arrayed his forces in the form of a Garuda, Yudhishthira disposed
    his troops in counter array in the form of a semi-circle.”"
  summary: Drona arranges the Kaurava forces in a Garuda-shaped battle formation after
    Arjuna has been drawn away, advances with the aim of seizing Yudhishthira, and
    is opposed by Yudhishthira’s semi-circular array. The passage details commanders
    placed in the bird-shaped formation, describes the army with oceanic, celestial,
    and mountain imagery, and ends with Yudhishthira asking Dhrishtadyumna to prevent
    his capture; Dhrishtadyumna vows to check Drona.
  language: English
