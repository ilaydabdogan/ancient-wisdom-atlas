canonical_text:
  quote: ''
  summary: At dawn, court musicians and praise-singers awaken king Yudhishthira. He
    bathes with fragrant and mantra-purified water, prays facing east, worships the
    blazing fire, honors Veda-knowing Brahmanas with benedictions and lavish gifts,
    sees and touches auspicious objects, sits adorned on a golden seat amid praise,
    and then orders Krishna/Hrishikesa admitted, seated, welcomed, and worshipped.
  language: English
  quote_policy: summarized
