canonical_text:
  quote: "“That child is the divine Hara the Lord of the entire mobile and immobile
    universe.”"
  summary: Mahadeva destroys the three cities with a fiery shaft. Parvati beholds
    the burning and holds a strange child on her lap. Sakra attacks the child with
    a thunderbolt, but the child, who is Mahadeva himself, paralyzes Sakra’s arm.
    The gods ask Brahma who the child is; Brahma identifies him as Hara/Maheswara,
    the supreme lord, and praises him while asking grace for Sakra.
