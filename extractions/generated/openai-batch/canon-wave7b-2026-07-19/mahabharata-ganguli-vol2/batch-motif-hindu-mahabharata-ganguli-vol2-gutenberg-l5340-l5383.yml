canonical_text:
  quote: All that hath been accomplished by the son of a deity.
  summary: Uttara tells Virata that a celestial youth, not he, recovered the cattle
    and defeated the Kauravas. The youth challenged Duryodhana, routed the Kuru warriors,
    took their garments, then disappeared. Virata wishes to behold and worship him,
    but remains ignorant that the son of Pandu is living in the palace in disguise;
    Partha later gives the captured garments to Virata's daughter.
  language: English
  quote_policy: quoted
