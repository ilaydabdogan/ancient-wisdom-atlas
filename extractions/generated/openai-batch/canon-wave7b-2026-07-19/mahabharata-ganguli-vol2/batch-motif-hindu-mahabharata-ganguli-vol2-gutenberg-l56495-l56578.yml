canonical_text:
  quote: ''
  summary: 'Sanjaya narrates a night battle in which Ghatotkacha, the Rakshasa, vanishes
    and creates a terrifying aerial illusion: fire-like clouds, thunderous noise,
    and a storm of weapons that devastates the Kaurava army. Karna resists with arrows
    and remains composed, but Ghatotkacha’s Sataghni kills Karna’s horses. The routed
    Kauravas urge Karna to kill the Rakshasa with the dart given by Vasava. The supplied
    excerpt ends in the middle of this appeal.'
  language: English
  quote_policy: summarized
