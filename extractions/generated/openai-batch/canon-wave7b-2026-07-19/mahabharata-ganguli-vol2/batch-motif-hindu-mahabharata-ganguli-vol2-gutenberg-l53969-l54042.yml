canonical_text:
  quote: ''
  summary: On the battlefield, Duryodhana asks Karna to save the Kaurava warriors
    from the enraged Pandava-allied forces. Karna vows to kill Arjuna with Sakra's
    fatal dart, defeat the Pandavas and their allies, and give Duryodhana the earth.
    Kripa mocks Karna's boasts, citing prior defeats and urging deeds over words.
    Karna replies that heroes rightly roar before battle, that resolve is aided by
    Destiny, and repeats his vow to defeat Krishna, Arjuna, and their allies.
  language: English
  quote_policy: summarized
