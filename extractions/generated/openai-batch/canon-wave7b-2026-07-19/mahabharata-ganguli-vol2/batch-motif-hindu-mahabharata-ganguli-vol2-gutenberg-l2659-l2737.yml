canonical_text:
  quote: ''
  summary: Bhima and the Pandavas fight Susarman and the Trigarta forces. Bhima disables
    Susarman's chariot, seizes him by the hair, subdues him, and binds him. The Trigarta
    army flees, and the Pandavas recover Virata's cattle and wealth. Bhima proposes
    that Susarman live only by declaring himself a slave, but Yudhishthira orders
    him released and warns him not to act this way again.
  language: English
