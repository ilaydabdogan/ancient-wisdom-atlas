canonical_text:
  quote: ''
  summary: Dhritarashtra addresses Sanjaya and speaks in praise of Vasudeva. He says
    those with sight will behold Vasudeva’s radiant body and hear his auspicious words.
    He describes Vasudeva as leader of the Yadavas and Vrishnis, slayer of foes, an
    eternal Self-knowing being, refuge of the universe, creator and destroyer, and
    author of gods, Asuras, Nagas, and Rakshasas. Dhritarashtra declares that he puts
    himself in Vasudeva’s hand.
