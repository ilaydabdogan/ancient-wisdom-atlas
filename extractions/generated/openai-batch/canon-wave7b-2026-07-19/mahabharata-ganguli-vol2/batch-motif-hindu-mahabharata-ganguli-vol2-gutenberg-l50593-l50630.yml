  quote: ''
  summary: A brief battlefield aftermath leads into Dhritarashtra asking Sanjaya to
    recount the life-staking combat between Bhimasena and Karna. Dhritarashtra praises
    Bhima's prowess, notes Karna's strength and repeated defeats, laments Duryodhana's
    deceitful policy and seizure of Pandava wealth, acknowledges his own partiality,
    and recalls Yudhishthira's desire for peace before asking how Bhima and Karna
    fought each other.
