canonical_text:
  quote: ''
  summary: 'Vyasa addresses a king and lists many prodigies and omens: unnatural births
    among humans and animals, unseasonable plant growth, children imitating battle,
    violent weather, earthquakes, strange planetary movements and eclipses, blood
    appearing in milk, rain, and rivers, and blazing weapons. He states that these
    signs forebode the destruction of the Kurus and great slaughter in the battle
    between the Kurus and the Pandavas.'
  language: English
  quote_policy: summarized
