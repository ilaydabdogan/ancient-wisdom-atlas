canonical_text:
  quote: ''
  summary: 'As Drona, Bharadwaja''s son and commander of the Kaurava army, advances
    to battle, the scene is marked by ominous portents: trembling earth, dust covering
    sky and sun, a shower of flesh, bones, and blood, carrion birds and jackals, meteors,
    and a disturbed sun. Battle begins between Kurus and Pandavas. Drona attacks the
    Pandava, Srinjaya, and Panchala forces with arrows and celestial weapons, causing
    them to break. Dhrishtadyumna counters Drona, but Drona rallies his men and continues
    to afflict the enemy, moving through the Pandava force like a circle of fire from
    his splendid chariot.'
  language: English
  quote_policy: summarized
