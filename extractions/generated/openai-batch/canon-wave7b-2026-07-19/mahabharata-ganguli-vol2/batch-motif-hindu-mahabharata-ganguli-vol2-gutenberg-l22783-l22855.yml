  summary: The passage consists of footnotes explaining terms and narrative background.
    The main narrative note recounts Viswamitra's dispute with Vasishtha, his appeal
    to Siva for mastery of weapons, Vasishtha's defeat of those weapons with a Brahmanical
    bamboo stick, and Viswamitra's renunciation and austerities leading to Brahmana
    status. Other notes explain sacrificial libations, the Pranava, auspicious bodily
    marks, classes of weapons, a river reading involving the Vitasta, and Kartaviryarjuna's
    identity and death.
  language: English with Sanskrit transliterations
  quote_policy: summarized
