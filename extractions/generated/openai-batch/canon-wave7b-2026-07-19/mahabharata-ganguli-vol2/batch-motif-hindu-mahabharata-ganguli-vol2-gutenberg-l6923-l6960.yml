canonical_text:
  quote: ''
  summary: The goddess Divination appears to Sachi, Indra's queen, and offers to show
    her Indra because of Sachi's truthfulness, devotion, restraint, and rites. Sachi
    follows Divination across celestial and remote landscapes to a lotus-filled lake,
    where Indra is found hidden in the fibres of a lotus-stalk in minute form; Sachi
    reports Nahusha's coercive command and asks Indra for protection and restoration
    of celestial rule.
  language: English
  quote_policy: summarized
