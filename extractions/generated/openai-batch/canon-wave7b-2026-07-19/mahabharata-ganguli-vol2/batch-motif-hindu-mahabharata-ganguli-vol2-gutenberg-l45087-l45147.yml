canonical_text:
  quote: ''
  summary: Sanjaya narrates a morning assembly in which Yudhishthira receives Kshatriya
    allies and addresses Krishna. Yudhishthira relies on Krishna for victory, asks
    him to save the Pandavas from distress, and asks him to help fulfil Arjuna's vow
    against Jayadratha. Krishna praises Arjuna, promises to aid him, and foretells
    Jayadratha's death and Arjuna's return.
  language: English
  quote_policy: summarized
