canonical_text:
  quote: ''
  summary: Arjuna, with Uttara as his charioteer, circumambulates the Sami tree, takes
    up his weapons, replaces a lion banner with a celestial golden ape-banner, and
    sets out northward. His conch blast and Gandiva bow overwhelm the horses and Uttara,
    whom he repeatedly comforts. Drona recognizes the warrior as Savyasachin and reads
    many ominous signs among the opposing ranks as foretelling destruction in battle.
  language: English
  quote_policy: summarized
