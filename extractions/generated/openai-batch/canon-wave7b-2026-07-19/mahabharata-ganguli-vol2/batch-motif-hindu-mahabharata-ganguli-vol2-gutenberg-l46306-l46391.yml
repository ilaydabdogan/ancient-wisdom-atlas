canonical_text:
  quote: ''
  summary: Sanjaya narrates a fierce midday battle at the gate of the Kaurava array.
    The Pandavas and Somakas attack Drona's troops. Drona and Dhrishtadyumna repeatedly
    strike each other and the opposing forces. The armies are described through images
    of clouds, rivers, torrents, embankment, hill, fire, Yuga-fire, dust, sun, and
    Death. Dhrishtadyumna divides the Kaurava force into three, while Drona attempts
    to reunite it and consumes the Panchalas with arrows. Several named warriors then
    engage or resist one another in battle.
  language: English
  quote_policy: summarized
