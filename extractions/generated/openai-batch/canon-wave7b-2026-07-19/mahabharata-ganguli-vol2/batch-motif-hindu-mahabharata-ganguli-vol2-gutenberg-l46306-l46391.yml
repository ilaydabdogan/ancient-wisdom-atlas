- id: ev:4
  type: summary
  locator: lines 46325-46332
  quote_or_summary: The two hosts are likened to two mighty cloud masses driven together
    by opposite winds and to the swollen rivers Ganga and Yamuna in the rainy season.
  source_text_path: texts/public-domain/hindu/project-gutenberg/mahabharata-ganguli-vol2.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: lines 46332-46341
  quote_or_summary: The Kuru host is depicted as a fierce cloud with weapons as winds,
    maces as lightning, and arrows as rain, urged by the Drona-tempest to quench the
    Pandava-fire.
  source_text_path: texts/public-domain/hindu/project-gutenberg/mahabharata-ganguli-vol2.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 46341-46350
  quote_or_summary: Drona is compared to a summer hurricane agitating the ocean and
    then to an immovable hill resisting the fiercest current of water while facing
    the Pandavas, Panchalas, and Kekayas.
  source_text_path: texts/public-domain/hindu/project-gutenberg/mahabharata-ganguli-vol2.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 46344-46347
  quote_or_summary: The Pandavas rush toward Drona like a mighty torrent of water
    toward a strong embankment.
  source_text_path: texts/public-domain/hindu/project-gutenberg/mahabharata-ganguli-vol2.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 46352-46357
  quote_or_summary: Dhrishtadyumna, the son of Prishata, joins the Pandavas and repeatedly
    strikes Drona; each showers arrows on the other.
  source_text_path: texts/public-domain/hindu/project-gutenberg/mahabharata-ganguli-vol2.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 46357-46365
  quote_or_summary: 'Dhrishtadyumna is described as a weapon-cloud: scimitars and
    swords as winds, bow-string as lightning, bow-twang as roars, and weapons as showers
    of stones.'
  source_text_path: texts/public-domain/hindu/project-gutenberg/mahabharata-ganguli-vol2.md
  rights_note: Public domain source; summarized.
