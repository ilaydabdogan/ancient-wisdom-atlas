candidate_motifs:
- id: motif:1
  label: Cosmic-scale battle as elemental storm and flood
  taxonomy_refs:
  - chaos
  basis: The opposing hosts are repeatedly described through clouds, rivers, torrent,
    hurricane, ocean, and fire, presenting the battle as an overwhelming elemental
    collision.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:9
  confidence: medium
  cautions: The passage uses battlefield similes; it does not narrate a literal cosmic
    catastrophe.
- id: motif:2
  label: World-destroying fire imagery applied to a warrior
  taxonomy_refs:
  - world_destroying_fire
  basis: Drona's form while crushing enemy divisions is explicitly compared to blazing
    Yuga-fire.
  evidence_refs:
  - ev:15
  confidence: medium
  cautions: The Yuga-fire appears as a comparison for Drona's destructive appearance,
    not as an actual world-ending event in the scene.
- id: motif:3
  label: Personified Death devouring warriors
  taxonomy_refs: []
  basis: People are said to think that Death himself was swallowing warriors stupefied
    by Dhrishtadyumna.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The passage reports an impression or comparison, not a direct action by
    a divine figure in the battle.
- id: motif:4
  label: Heroic refusal to flee
  taxonomy_refs: []
  basis: Warriors of both armies disregard their lives and no warrior in either host
    flees through fear.
  evidence_refs:
  - ev:19
