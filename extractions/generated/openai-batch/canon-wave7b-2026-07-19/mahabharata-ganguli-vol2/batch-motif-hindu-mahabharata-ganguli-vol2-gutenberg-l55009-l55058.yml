  summary: The passage describes Aswatthaman roaring and shining like the midday sun,
    followed by a night battle in which Bhima and Duryodhana exchange arrows, cut
    weapons, and escalate to a dart and mace. Bhima destroys Duryodhana's car, leading
    Bhima, Kaurava warriors, and Yudhishthira to think Duryodhana has been slain.
    Allied forces then advance against Drona, and fighting continues in thick gloom.
