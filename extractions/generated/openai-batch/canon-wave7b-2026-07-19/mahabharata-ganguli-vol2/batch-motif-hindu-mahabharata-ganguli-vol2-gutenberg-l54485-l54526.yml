  quote: ''
  summary: Sanjaya reports a fierce battle in which Yudhishthira, Bhima, and Arjuna
    attack Duryodhana's forces and Drona. Drona uses the Vayavya weapon, the battlefield
    is described through blood, fallen elephants, snake-like trunks, royal umbrellas
    like heavenly bodies at the end of the Yuga, and a dark rout in which troops and
    kings flee.
