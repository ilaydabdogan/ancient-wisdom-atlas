  summary: In Section XLII, Uttara addresses Vrihannala and asks whose remarkable
    bows, arrows, quivers, swords, and scimitars are before him. He describes their
    gold, gems, animal images, skins, weapon quantities, sharpness, and terrifying
    qualities, and asks Vrihannala to answer truthfully because the sight fills him
    with wonder.
