canonical_text:
  quote: ''
  summary: Sanjaya narrates that blood-covered warriors rest and rearm. Duryodhana,
    wounded and anxious, tells the grandsire, the son of Ganga, that the Pandavas
    and Bhima have penetrated his battle array and escaped or inflicted harm. The
    son of Ganga promises to fight for Duryodhana even at the cost of his life. Encouraged,
    Duryodhana orders his army of chariots, horses, infantry, and elephants to advance;
    the advancing force is described with red dust, banners like lightning, bow-noise
    like the churned ocean, and clouds at the end of the Yuga.
  language: English
  quote_policy: summarized
