canonical_text:
  quote: ''
  summary: Yudhishthira slaughters and routs enemy troops, sending many to Yama's
    realm. Drona, urged by the king's son, attacks him with volleys and a succession
    of celestial weapons, but Yudhishthira neutralizes them with corresponding weapons,
    including a Brahma weapon that dispels Drona's Brahma weapon amid gloom and fear.
    Drona then turns on Drupada's division; the Panchalas flee, but Arjuna and Bhima
    check the flight and attack, after which the Bharata host breaks despite efforts
    to rally it.
  language: English
  quote_policy: summarized
