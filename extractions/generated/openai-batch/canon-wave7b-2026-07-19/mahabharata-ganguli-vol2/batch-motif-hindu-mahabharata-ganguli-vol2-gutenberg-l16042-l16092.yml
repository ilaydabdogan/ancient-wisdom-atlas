canonical_text:
  quote: ''
  summary: Narada narrates how king Haryyaswa evaluates Madhavi’s auspicious bodily
    signs and asks Galava her dower. Galava demands eight hundred rare horses. Haryyaswa
    has only two hundred and asks to beget one son. Madhavi discloses a boon that
    she becomes a maiden again after each delivery and proposes that Galava obtain
    the full number of horses from four kings while she bears four sons. Galava accepts
    a quarter dower from Haryyaswa; Madhavi bears Vasumanas. Later Galava returns,
    and Haryyaswa, unable to supply the remaining horses, gives Madhavi back; she
    becomes a maiden again and follows Galava.
  language: English
  quote_policy: summarized
