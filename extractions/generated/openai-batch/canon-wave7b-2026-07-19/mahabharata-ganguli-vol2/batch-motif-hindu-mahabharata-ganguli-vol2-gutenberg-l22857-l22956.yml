  quote: ''
  summary: The section opens with an invocation and a narrative question about how
    the assembled heroes fought. Vaisampayana describes the Pandavas and Somakas entering
    sacred Kurukshetra against the Kauravas, the vast muster of forces, Yudhishthira’s
    encampment and recognition systems, Duryodhana’s arraying of troops, the sounding
    of conches, terrifying and ominous battlefield portents, and the armies’ formal
    covenants governing fair combat.
