canonical_text:
  quote: ''
  summary: Sanat-sujata instructs the king on faults that stain asceticism, wicked
    conduct, Brahmanical virtues, self-restraint, six forms of renunciation, and qualities
    of Self-knowledge. He connects truth, self-control, renunciation, and self-knowledge
    with happiness and liberation from birth, death, and decrepitude. Dhritarashtra
    then asks which doctrine of the Supreme Soul or Brahman should be understood as
    true knowledge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sanat-sujata identifies anger, lust, avarice, ignorance, discontent, cruelty,
    malice, vanity, grief, love of pleasure, envy, and speaking ill of others as faults
    to be avoided.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The faults are described as capable of destroying people individually and
    as waiting for opportunity like a hunter waiting for deer.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Additional wicked acts include asserting one’s superiority, desiring others’
    wives, humiliating others from pride, wrathfulness, fickleness, refusing to maintain
    dependents, oppressive taxation, delighting in humiliation, and hating one’s wives.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sanat-sujata lists twelve practices of Brahmanas, including righteousness,
    truth, self-restraint, asceticism, delight in others’ happiness, modesty, forbearance,
    love, sacrifices, gifts, perseverance, and scriptural knowledge.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Self-restraint, renunciation, and knowledge of Self are said to be connected
    with emancipation and to have truth as their predominant attribute.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:6
  text: Self-restraint is defined through freedom from enumerated vices, and the passage
    associates these faults with mada, or pride.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: Six kinds of renunciation are described, including non-elation in prosperity,
    abandonment of desire, equanimity in failure or disagreeable events, non-solicitation
    of dear relatives, and giving to a deserving solicitor.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'Self-knowledge is said to involve eight qualities: truth, meditation, distinction
    of subject and object, inference, withdrawal from the world, not taking what belongs
    to others, Brahmacharya vows, and non-acceptance of gifts.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that liberation from the five senses, mind, past, and future
    brings happiness, and that truth is the ordained vow of the righteous.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Dhritarashtra says that the Vedas with Akhyana as fifth declare the Supreme
    Soul to be the universe of mobile and immobile things, then asks which view of
    Godhead or Brahman should be known as true knowledge.
  category: speech
  evidence_refs:
  - ev:5
