canonical_text:
  quote: ''
  summary: Arjuna and Bhishma fight an evenly matched chariot duel with dense arrow-fire.
    Each counters the other's shots and wounds the other, while Bhishma also strikes
    Vasudeva and Arjuna strikes Bhishma's charioteer. Their chariots maneuver skillfully;
    their conches, roars, and wheels make the Earth tremble. Both armies identify
    their champions by their standards. The two warriors are alternately hidden and
    revealed amid clouds of arrows. Celestial and sage witnesses praise the battle
    as unprecedented and declare that neither warrior can conquer the other. Meanwhile,
    other warriors on both sides continue killing one another, and Drona's encounter
    with the prince of the Panchalas is described as awful.
  language: English
  quote_policy: summarized
