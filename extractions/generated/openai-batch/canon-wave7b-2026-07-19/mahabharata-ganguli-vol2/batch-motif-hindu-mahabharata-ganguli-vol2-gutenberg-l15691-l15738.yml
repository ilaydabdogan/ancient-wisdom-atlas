- id: obs:1
  text: Garuda says the western quarter is favored by Varuna, ruler of the ocean,
    and that Varuna had his origin there.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kasyapa installed Varuna in the western region to rule aquatic creatures and
    protect the waters.
  category: action
  evidence_refs:
  - ev:1
