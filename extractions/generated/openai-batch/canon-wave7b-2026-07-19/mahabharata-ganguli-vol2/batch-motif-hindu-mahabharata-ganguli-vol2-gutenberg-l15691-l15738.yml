canonical_text:
  quote: ''
  summary: Garuda describes the western quarter to Galava as Varuna's favored region
    and a cosmological zone containing sunset, lunar renewal, defeated Daityas, Asta
    mountain, Night and Sleep, the birth of the Maruts from Diti's divided fetus,
    roots of Himavat stretching toward Mandara, Surabhi's milk, Rahu's headless trunk,
    Vedic chanting, cosmic waters, and abodes of Anarta, Vishnu, and Kasyapa. Garuda
    then asks Galava which direction they should go.
  language: English
  quote_policy: summarized
