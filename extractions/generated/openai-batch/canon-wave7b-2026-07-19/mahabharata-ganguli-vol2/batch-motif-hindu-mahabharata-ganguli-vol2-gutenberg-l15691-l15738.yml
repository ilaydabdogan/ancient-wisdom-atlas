    the Maruts sprang from those parts.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The roots of Himavat stretch in this direction toward Mandara, and their end
    cannot be reached even by a thousand-year journey.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: Surabhi, mother of cows, pours milk on the shore of a large lake adorned with
    golden lotuses.
  category: action
  evidence_refs:
  - ev:9
