  text: The quarter is called west because the sun dismisses its rays there at the
    end of the day.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The moon becomes young again at the beginning of the fortnight after quaffing
    Varuna's six juices.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Daityas were routed and bound by the wind-god in this region and then lay
    down in a sleep described as knowing no waking.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Asta mountain is located in this quarter and is described as causing evening
