canonical_text:
  quote: ''
  summary: Krishna/Draupadi, called Sairindhri, rebukes King Virata after Kichaka
    has insulted and struck her. Virata says he cannot judge without knowing the facts,
    while the courtiers praise her and censure Kichaka. Yudhishthira, visibly angry,
    tells her to leave the court and says her Gandharva husbands will eventually avenge
    her. She goes to Sudeshna, reports that Kichaka struck her in the king's presence
    while she was fetching wine, and hears Sudeshna offer to have Kichaka slain. Draupadi
    predicts that others whom Kichaka has wronged will slay him and send him to Yama's
    abode that day.
  language: English
  quote_policy: summarized
