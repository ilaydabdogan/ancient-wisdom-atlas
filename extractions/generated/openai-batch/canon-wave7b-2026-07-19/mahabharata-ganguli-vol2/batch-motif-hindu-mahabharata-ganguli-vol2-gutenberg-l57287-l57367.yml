canonical_text:
  quote: ''
  summary: 'Sanjaya narrates a battle sequence: Arjuna resists the Kuru warriors amid
    dust, darkness, and confusion. Drona moves north, inspires fear, defeats several
    opposing forces, kills Drupada’s grandsons, and later kills Drupada and Virata.
    Dhrishtadyumna, enraged and grieving, vows that Drona shall not escape alive or
    vanquish him, then advances against him while other warriors protect Drona.'
  language: English
  quote_policy: summarized
