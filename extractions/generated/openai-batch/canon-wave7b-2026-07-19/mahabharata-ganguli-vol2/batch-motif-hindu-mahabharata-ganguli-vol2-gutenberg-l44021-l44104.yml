canonical_text:
  quote: I will repair to the abode of Yama.
  summary: Sanjaya recounts that Krishna and Arjuna return to their camp and find
    the Pandavas grieving. Arjuna, not seeing Abhimanyu, asks whether the youth entered
    Drona's circular battle array and was slain. He laments Abhimanyu's virtues, imagines
    his body lying on the battlefield, speaks of Yama's abode and heaven, and wonders
    whether his son looked for him as rescuer while surrounded by enemy warriors.
  language: English
  quote_policy: quoted
