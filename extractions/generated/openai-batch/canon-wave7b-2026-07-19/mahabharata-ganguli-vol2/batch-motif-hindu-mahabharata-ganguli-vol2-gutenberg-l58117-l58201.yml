canonical_text:
  quote: ''
  summary: After Bhima invokes Yudhishthira's statement, Drona lays aside his weapons,
    addresses his allies, and enters Yoga on his chariot. Dhrishtadyumna rushes upon
    him with a sword. Drona is described as concentrating on Vishnu, Om, and the Supreme
    Being, then proceeding to heaven and the region of Brahman with blazing celestial
    signs visible only to a few witnesses. Dhrishtadyumna, apparently unaware of the
    ascent, cuts off Drona's head despite pleas from Arjuna and others, displays it
    before the Kuru army, and the armies break in fear and confusion.
  language: English
  quote_policy: summarized
