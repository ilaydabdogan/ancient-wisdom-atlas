canonical_text:
  quote: ''
  summary: Sanjaya narrates Aswatthaman's renewed slaughter, his vow to destroy Yudhishthira's
    army because of Drona's death, the rallying of the Kaurava troops, and the renewed
    clash of armies. Aswatthaman invokes the Narayana weapon, which fills the sky
    with fiery missiles and devastates the Pandava-allied forces. Yudhishthira, frightened
    and remorseful, tells allies to withdraw and declares an intention to die on a
    funeral pile. Kesava stops the flight and orders the troops to lay down their
    weapons and descend from their vehicles as the means to baffle the weapon.
  language: English
  quote_policy: summarized
