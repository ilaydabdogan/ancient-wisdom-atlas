canonical_text:
  quote: ''
  summary: After Kesava's speech, the assembly remains silent. Jamadagni's son addresses
    Duryodhana with an illustrative tale about King Dambhodbhava, a proud world-sovereign
    who repeatedly asks whether anyone equals or surpasses him in battle. Brahmanas
    counsel him to curb his pride, then direct him toward the ascetics Nara and Narayana
    in the Gandhamadana mountains. The king marches there with an army, finds the
    austere pair in the woods, receives hospitality, and asks them for battle. Nara
    and Narayana reply that wrath, covetousness, weapons, unrighteousness, and malice
    have no place in their retreat, and tell him to seek battle elsewhere.
  language: English
  quote_policy: summarized
