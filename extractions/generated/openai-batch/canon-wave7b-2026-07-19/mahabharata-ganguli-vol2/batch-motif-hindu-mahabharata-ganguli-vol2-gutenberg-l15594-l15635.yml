canonical_text:
  quote: This is the gate of the three worlds. This is the path of heaven and felicity.
  summary: Garuda, commanded by God, asks Galava which direction he should first take
    him to see. Garuda describes the eastern quarter, Purva, as the place of sunrise,
    ascetic austerities, divine and ritual origins, sacred teachings, sacrifices,
    celestial prosperity, and as a gate of Day, Time, the three worlds, and the path
    of heaven.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: 'Garuda says he has been commanded by God and asks Galava which quarter he
    should first take him toward: east, south, west, or north.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The eastern quarter is described as the place where Surya first rises, where
    the Sadhyas perform evening austerities, where universal Intelligence first springs,
    and where Dharma and his two eyes are stationed.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The eastern quarter is called the gate of Day and Time, and later the gate
    of the three worlds and the path of heaven and felicity.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:9
- id: obs:4
  text: In the eastern quarter, Daksha's daughters gave birth to their children and
    the sons of Kasyapa first multiplied.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The east is said to be the source of the gods' prosperity; Sakra was first
    anointed king of the celestials there, Indra and the gods performed austerities
    there, and the gods performed religious ceremonies there.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The divine Creator first sang the Vedas in the east; Surya first preached
    the Gayatri there and delivered the Yajurvedas to Yajnavalkya there.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage locates first sacrificial drinking of Soma by the Suras and first
    drinking by the Homa-fires in the eastern quarter.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Varuna first went to the nether regions from there; the birth, growth, and
    death of Vasishtha took place there; and the hundred branches of Om first grew
    there.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Smoke-eating Munis and sacrificial fires are mentioned in that region, and
    Sakra killed boars and other animals there to offer as sacrificial portions to
    the gods.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The rising thousand-rayed sun consumes wicked and ungrateful men and Asuras,
    and Garuda says he will go east if it pleases Galava or to another quarter if
    Galava prefers.
  category: sequence
  evidence_refs:
  - ev:9
