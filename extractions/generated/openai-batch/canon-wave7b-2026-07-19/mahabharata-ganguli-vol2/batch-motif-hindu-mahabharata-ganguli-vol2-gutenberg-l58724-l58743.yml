  quote: Even this is the duty of a Kshatriya, viz., to slay or be slain.
  summary: An unnamed speaker defends the killing of Drona as righteous warfare against
    a foe. He argues from Kshatriya duty, compares Arjuna's own killings in battle,
    invokes a hereditary hostility with the preceptor, forgives Arjuna's reproach
    for the sake of Draupadi and her children, and urges him to fight with victory
    expected.
