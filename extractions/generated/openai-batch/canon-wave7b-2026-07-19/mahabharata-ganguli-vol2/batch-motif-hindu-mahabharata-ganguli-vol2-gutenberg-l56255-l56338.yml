canonical_text:
  quote: ''
  summary: Sanjaya narrates a night battle in which Alayudha arrives to aid the Kauravas.
    Duryodhana asks Alayudha to prevent Ghatotkacha from killing Karna by illusion.
    Alayudha fights Ghatotkacha and then Bhima. Krishna observes Bhima's danger and
    gives Arjuna and other warriors tactical orders. Alayudha cuts Bhima's bow, kills
    his horses and driver, and Bhima descends from his chariot to fight with a mace.
  language: English
  quote_policy: summarized
