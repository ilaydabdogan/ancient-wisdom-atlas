canonical_text:
  quote: ''
  summary: 'Sanjaya narrates a Kurukshetra battle sequence: named Pandava and Kaurava
    warriors advance against assigned opponents, a fierce midday clash fills and obscures
    the sky with arrows and shining weapons, Bhishma checks and wounds Bhima, cuts
    Bhima''s dart and bow, then kills Satyaki''s charioteer so that Satyaki''s horses
    bolt, after which both armies rush again into battle.'
  language: English
  quote_policy: summarized
