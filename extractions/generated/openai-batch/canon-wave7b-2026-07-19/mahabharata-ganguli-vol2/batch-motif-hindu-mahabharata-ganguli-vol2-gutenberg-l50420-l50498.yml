canonical_text:
  quote: ''
  summary: Sanjaya narrates that Bhimasena attempts to proceed toward Krishna and
    Dhananjaya, but Karna intercepts and challenges him. Bhima turns back and engages
    Karna in single combat. The two warriors exchange dense volleys of arrows described
    through numerous martial similes. Karna initially covers Bhima and his car with
    arrows, but Bhima endures the wounds, fights with fury because of remembered wrongs,
    cuts off Karna's bow, kills his steeds and charioteer, wounds him, and Karna moves
    to another car.
  language: English
  quote_policy: summarized
