canonical_text:
  quote: ''
  summary: Narada reports Garuda advising Galava that the remaining two hundred rare
    horses cannot be obtained because four hundred of the original thousand were taken
    by the Vitasta river. Garuda advises Galava to offer Madhavi as an equivalent
    to Viswamitra. Galava presents six hundred horses and Madhavi to Viswamitra, who
    accepts her to beget one son. Madhavi bears Ashtaka; Viswamitra gives the horses
    to Ashtaka, returns Madhavi to Galava, and goes to the woods. Galava praises Madhavi's
    sons, dismisses Garuda, returns Madhavi to her father, and goes to the woods.
  language: English
  quote_policy: summarized
