canonical_text:
  quote: ''
  summary: Sanjaya reports the Kuru army arrayed for battle amid martial sounds and
    ominous portents. Arjuna appears, Durmarshana boasts that he will resist him,
    Arjuna is described through destructive divine and cosmic similes, and Arjuna
    and Krishna blow their conchs, terrifying the Kuru troops. Arjuna then tells Hrishikesa
    to drive toward Durmarshana and the elephant division.
  language: English
  quote_policy: summarized
