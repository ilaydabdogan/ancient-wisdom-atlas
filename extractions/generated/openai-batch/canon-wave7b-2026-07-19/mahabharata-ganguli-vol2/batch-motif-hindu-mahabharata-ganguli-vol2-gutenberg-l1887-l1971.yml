canonical_text:
  quote: ''
  summary: Bhima confronts Kichaka at night in a solitary place, wrestles him in a
    violent hand-to-hand fight, kills him for threatening Draupadi, crushes his body,
    shows it to Draupadi by torchlight, and then leaves. Draupadi summons the dancing-hall
    guards and says Kichaka has been slain by her Gandharva husbands.
  language: English
