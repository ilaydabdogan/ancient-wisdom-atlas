canonical_text:
  quote: ''
  summary: Vidura recounts how Virochana and Sudhanwan, after wagering their lives,
    approach Prahlada for judgment. Prahlada honors Sudhanwan as a Brahmana guest,
    hesitates because Virochana is his son, hears Sudhanwan describe the consequences
    of false speech, then truthfully declares Sudhanwan superior and Virochana defeated.
    Sudhanwan grants Virochana his life back and requires him to wash Sudhanwan's
    feet before Kesini.
  language: English
  quote_policy: summarized
