canonical_text:
  quote: A battle is never won by bragging.
  summary: Uluka turns from King Yudhishthira to Arjuna and delivers a hostile challenge.
    The speech rebukes Arjuna's boasting, invokes Vasudeva, Gandiva, the Supreme Ordainer,
    past dice-enslavement, Krishna's deliverance, and the Pandavas' disguised service
    in Virata's city. It refuses to yield the kingdom and describes the opposing army
    as an ocean of named warriors and weapons into which Arjuna will plunge and fail.
  language: English
  quote_policy: quoted
