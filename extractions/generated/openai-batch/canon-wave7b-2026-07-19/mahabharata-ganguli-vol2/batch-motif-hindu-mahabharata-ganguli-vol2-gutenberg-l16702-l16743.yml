canonical_text:
  quote: ''
  summary: Vaisampayana reports that Bhishma and Drona, after hearing Dhritarashtra,
    urge Duryodhana to cease hostility before the Pandava side enters battle. They
    describe not-yet-unleashed warriors, weapons, and ritual war-fire, then imagine
    gestures of reconciliation among Duryodhana and the sons of Pandu, public joy,
    proclamation of union, and rule of the Earth in brotherly affection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vaisampayana says Bhishma and Drona, who sympathize with Dhritarashtra, address
    Duryodhana after hearing Dhritarashtra's words.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma and Drona repeatedly urge that hostility cease while the two Krishnas
    are not yet armored, Gandiva remains inactive, Dhaumya has not poured libations
    on the war-fire, and Yudhishthira has not cast angry glances at Duryodhana's troops.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: They say Bhimasena is not yet stationed in his division or stalking the battlefield
    with mace in hand, grinding hostile divisions and making warriors' heads roll.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: They say Nakula, Sahadeva, Dhrishtadyumna, Virata, Sikhandin, and Sisupal's
    son have not yet entered Duryodhana's ranks in armor and poured arrow-showers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: They say iron and steel weapons shot by skilled bowmen have not yet pierced
    the breasts of ornamented warriors.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speakers propose that Yudhishthira receive Duryodhana with an embrace
    as Duryodhana bows, place his marked right hand on Duryodhana's shoulder, and
    pat his back.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: They propose that Bhima embrace Duryodhana and speak gently for peace, and
    that Duryodhana smell the heads of Arjuna and the Twins after their reverential
    greeting.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: They imagine monarchs weeping tears of joy at Duryodhana's union with the
    sons of Pandu, the union being proclaimed in royal cities, and Duryodhana ruling
    the Earth with brotherly affection and without jealousy or wrath.
  category: sequence
  evidence_refs:
  - ev:8
