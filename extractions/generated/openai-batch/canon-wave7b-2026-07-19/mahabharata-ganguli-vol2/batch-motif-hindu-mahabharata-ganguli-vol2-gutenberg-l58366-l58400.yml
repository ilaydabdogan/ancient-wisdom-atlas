canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanjaya what Aswatthaman said after learning that his
    father and preceptor Drona had been slain unrighteously by Dhrishtadyumna. He
    describes Aswatthaman as heir to Drona's celestial weapons and martial science,
    compares him to gods, heroes, natural forces, and animals, and states that Aswatthaman
    is ordained to slay Dhrishtadyumna just as Dhrishtadyumna was ordained to slay
    Drona.
  language: English
  quote_policy: summarized
