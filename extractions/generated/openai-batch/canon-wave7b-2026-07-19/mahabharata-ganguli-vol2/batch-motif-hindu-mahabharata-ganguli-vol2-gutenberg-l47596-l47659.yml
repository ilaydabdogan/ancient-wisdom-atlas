canonical_text:
  quote: ''
  summary: In battle the Rakshasa Alamvusha fights Bhimasena. After wounding Bhima
    and recalling that Bhima killed his brother Vaka, Alamvusha becomes invisible,
    changes size and form, and sends down a destructive storm of weapons that creates
    a battlefield described as a river of blood. Bhima, enraged, uses the weapon named
    Tvashtri, which produces arrows, routs the opposing troops, destroys Alamvusha's
    illusion, and drives Alamvusha to flee. The Pandavas celebrate Bhima's victory.
  language: English
  quote_policy: summarized
