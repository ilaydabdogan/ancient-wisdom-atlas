canonical_text:
  quote: ''
  summary: Kanwa narrates that Garuda, angered because Sakra has granted length of
    days to the Naga Sumukha, complains that his destined food has been protected.
    Garuda boasts of his strength and service in bearing Vishnu. Vishnu tests him
    by placing one arm on him; Garuda collapses, repents, and is forgiven. Vishnu
    then places Sumukha on Garuda’s breast, and Garuda thereafter lives in friendship
    with the snake.
  language: English
  quote_policy: summarized
