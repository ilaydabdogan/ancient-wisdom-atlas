canonical_text:
  quote: ''
  summary: Sanjaya reports that Duryodhana, enraged by Abhimanyu's rout of his army,
    advances against him. Drona orders the Kaurava warriors to rescue the king, and
    many named warriors surround and shower Abhimanyu with arrows. Abhimanyu resists
    them, roars like a lion, wounds or kills several opponents including the ruler
    of the Asmakas, pierces Karna, kills three warriors, and wounds Salya so severely
    that Salya faints and the troops flee. The passage closes with praise of Abhimanyu
    by ancestral, divine, and other beings, and compares him to a sacrificial fire
    fed with clarified butter.
  language: English
  quote_policy: summarized
