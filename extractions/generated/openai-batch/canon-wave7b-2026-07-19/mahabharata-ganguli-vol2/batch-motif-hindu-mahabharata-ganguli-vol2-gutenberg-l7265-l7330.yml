  quote: ''
  summary: Vaisampayana recounts the arrival of allied kings and armies for Yudhishthira
    and Duryodhana. The Pandava side gathers seven Akshauhinis, while Duryodhana gathers
    eleven. The passage emphasizes weapons, banners, troop origins, visual similes
    for massed armies, and the Kaurava host spreading beyond Hastinapura across surrounding
    regions, where it is seen by a Panchala priest sent to the Kurus.
