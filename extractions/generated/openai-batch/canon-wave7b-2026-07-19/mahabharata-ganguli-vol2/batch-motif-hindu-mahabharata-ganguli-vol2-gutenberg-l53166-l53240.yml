canonical_text:
  quote: ''
  summary: Sanjaya describes a fierce night battle in which Panchalas, Pandavas, Kurus,
    Kauravas, elephants, horsemen, charioteers, and foot-soldiers kill one another
    and are repeatedly described as going to Yama's realm. Duryodhana penetrates the
    Pandava host, wounds many warriors, and is compared to the scorching sun and the
    Destroyer. Yudhishthira cuts Duryodhana's bow and wounds him, leading to a cry
    that the king is slain; Duryodhana recovers, and Drona intervenes against the
    advancing Panchalas.
  language: English
  quote_policy: summarized
