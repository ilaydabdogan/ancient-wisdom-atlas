canonical_text:
  quote: It seems that the influence of Time is irresistible.
  summary: Sanjaya describes Duhsasana being driven back by Dhrishtadyumna, who then
    advances toward Drona. Kritavarman and three brothers try to stop him, while the
    twins Nakula and Sahadeva protect him and engage the opposing warriors. The battle
    is described as dreadful but conducted with fair weapons and righteous methods.
    Duryodhana rushes in and is met by Satyaki; the two recall their childhood friendship
    and lament that wrath, covetousness, Kshatriya usage, and irresistible Time have
    brought them into battle against one another.
  language: English
  quote_policy: quoted
