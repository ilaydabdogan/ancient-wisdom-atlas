canonical_text:
  quote: ''
  summary: Narada describes Patalam, a celebrated region in the world of the Nagas,
    with water-fed fire, Amrita, lunar and rain phenomena, confined Danavas, ascetics,
    elephant lineages, and a primordial egg in the waters from which world-consuming
    fire will emerge at the end of the world. Matali finds no eligible bridegroom
    there and asks to depart.
  language: English
  quote_policy: summarized
