canonical_text:
  quote: ''
  summary: Sanjaya narrates a fierce battlefield duel between Bhima and Karna. Bhima
    attacks while recalling former wrongs; Karna is wounded, disarmed, and forced
    back. Duryodhana sends named sons to assist Karna, but Bhima kills them. Karna
    returns to combat, and the renewed duel is described through images of clouds,
    rain, mountains, snakes, trees, animals, and a comparison to Sakra and Prahlada.
  language: English
  quote_policy: summarized
