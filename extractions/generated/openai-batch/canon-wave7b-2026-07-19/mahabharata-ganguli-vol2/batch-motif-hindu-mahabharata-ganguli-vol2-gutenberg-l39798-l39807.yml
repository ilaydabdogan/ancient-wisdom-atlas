canonical_text:
  quote: ''
  summary: Sanjaya narrates that Yudhishthira grants Arjuna leave, embraces him, looks
    on him affectionately, and gives benedictions. After arranging for Yudhishthira's
    protection, Arjuna goes out against the Trigartas. Duryodhana's troops rejoice
    at Arjuna's absence and seek to seize Yudhishthira, while the two armies clash
    with the force of swollen rivers in the rainy season.
