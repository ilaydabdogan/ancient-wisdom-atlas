canonical_text:
  quote: ''
  summary: Vaisampayana narrates that Bhima, disguised as the cook Vallava, approaches
    King Virata with cooking implements and a sword. Virata is struck by his appearance
    and doubts that cooking is his proper office. Bhima presents himself as both cook
    and wrestler. Virata appoints him superintendent of the kitchen, where he remains
    favored and unrecognized.
  language: English
  quote_policy: summarized
