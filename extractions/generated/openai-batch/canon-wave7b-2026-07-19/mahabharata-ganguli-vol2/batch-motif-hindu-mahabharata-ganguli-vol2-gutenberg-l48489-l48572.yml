canonical_text:
  quote: ''
  summary: Sanjaya rebukes an addressed king, saying his calamity is the result of
    his own fault, ignored counsel, and rejected peace. He says Vasudeva caused the
    flame of war to blaze among the Kurus. The narration then describes a fierce battle,
    likened to one between gods and Asuras, in which Kritavarman alone resists many
    Pandava-side warriors. Bhima is wounded, recovers, hurls a blazing steel dart,
    and has it cut down by Kritavarman. Sikhandin later attacks with sword and shield,
    cuts Kritavarman's bow, and the fight continues with renewed archery.
  language: English
  quote_policy: summarized
