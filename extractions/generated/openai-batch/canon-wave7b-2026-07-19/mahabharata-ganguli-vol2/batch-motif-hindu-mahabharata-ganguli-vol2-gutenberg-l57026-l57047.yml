    single combat with Karna, who had preserved Indra's dart for him. Vyasa explains
    that Ghatotkacha's death used up that dart for Yudhishthira's good, urges Yudhishthira
    to abandon grief and anger, commands him to fight the Kauravas with his allies,
    predicts that the earth will be his in five days, counsels virtue, and then disappears.
