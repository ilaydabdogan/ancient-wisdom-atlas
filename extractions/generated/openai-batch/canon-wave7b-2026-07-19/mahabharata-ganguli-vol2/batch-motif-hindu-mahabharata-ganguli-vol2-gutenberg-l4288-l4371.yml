canonical_text:
  quote: ''
  summary: Uttara drives Arjuna's chariot with swift and bewildering maneuvers toward
    Kripa. Arjuna announces himself and blows the conch Devadatta; Kripa answers with
    his own conch and bowstring. Kripa and Arjuna exchange arrows. Arjuna disables
    Kripa's horses, repeatedly cuts off his bows, strips his armor without wounding
    his person, cuts down his missile weapons, breaks his chariot, kills his driver,
    wounds Kripa in the breast, and turns back Kripa's mace with arrows. Kripa's warriors
    move to rescue him while Uttara performs a named maneuver to withstand them.
  language: English
  quote_policy: summarized
