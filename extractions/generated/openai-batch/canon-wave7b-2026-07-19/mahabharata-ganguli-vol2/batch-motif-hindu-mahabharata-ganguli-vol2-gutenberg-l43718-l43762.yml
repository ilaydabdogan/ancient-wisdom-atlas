canonical_text:
  quote: ''
  summary: Narada tells Srinjaya that Bharata, son of Dushmanta and Sakuntala, died.
    As a child in the forest, Bharata subdued powerful wild animals and was called
    Sarvadamana by ascetics, until his mother forbade the animal-torturing. Later
    he performed numerous horse-sacrifices and other royal sacrifices at river banks
    and elsewhere, gave immense wealth to Brahmanas and Kanwa, and had gods led by
    Indra attend his sacrifice. Narada uses Bharata’s death and superiority as a reason
    Srinjaya should not grieve for Swaitya.
  language: English
  quote_policy: summarized
