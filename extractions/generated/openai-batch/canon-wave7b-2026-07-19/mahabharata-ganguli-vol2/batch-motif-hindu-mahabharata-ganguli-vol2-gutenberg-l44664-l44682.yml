canonical_text:
  quote: ''
  summary: Subhadra laments Abhimanyu, joined by Draupadi and Uttara. The women weep,
    faint, and fall to the earth. Krishna sprinkles water on his unconscious sister
    and consoles Subhadra, Draupadi, and Uttara, saying Abhimanyu has attained a laudable
    goal through his unsupported feat in battle. Krishna then returns to Arjuna's
    side and enters the inner apartments of Arjuna's tent.
