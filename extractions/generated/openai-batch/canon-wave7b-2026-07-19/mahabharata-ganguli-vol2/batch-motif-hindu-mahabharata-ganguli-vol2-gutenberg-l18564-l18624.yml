canonical_text:
  quote: Victory is there where righteousness is.
  summary: Vasudeva narrates Drona's counsel to Duryodhana, in which Drona recalls
    Pandu's transfer of sovereignty to Dhritarashtra and Vidura, Vidura's service,
    and Bhishma's supervision of royal policy, then urges Duryodhana to unite with
    the Pandavas and give them half the kingdom. Vasudeva then narrates Vidura's appeal
    to Bhishma, warning that Duryodhana endangers the Kuru race and urging Bhishma
    either to withdraw to the woods with Vidura and Dhritarashtra or restrain Duryodhana
    and rule with the sons of Pandu guarding the realm.
  language: English
  quote_policy: quoted
