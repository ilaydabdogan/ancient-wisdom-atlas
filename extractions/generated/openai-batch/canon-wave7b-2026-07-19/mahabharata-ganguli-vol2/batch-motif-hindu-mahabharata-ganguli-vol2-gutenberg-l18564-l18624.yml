candidate_motifs:
- id: motif:1
  label: legitimate transfer and disputed division of kingship
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage emphasizes Pandu's rightful kingship, his transfer of sovereignty,
    Dhritarashtra's enthronement, public submission, and the later demand that the
    sons of Pandu receive half the kingdom.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage is political and dynastic; it does not present a divine enthronement
    rite.
- id: motif:2
  label: wise counsel to avert kin-conflict
  taxonomy_refs:
  - wisdom
  basis: Drona and Vidura each deliver advisory speeches urging restraint, unity,
    lawful division, and action to prevent the Kuru family's destruction.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:9
  - ev:11
  - ev:14
  - ev:15
  confidence: high
  cautions: The wisdom motif is expressed as political-moral counsel rather than a
    riddle, revelation, or didactic parable.
- id: motif:3
  label: withdrawal to the woods from kingship
  taxonomy_refs:
  - departure
  basis: Pandu leaves the throne and goes to the woods with his two wives; Vidura
    later proposes that Bhishma withdraw to the woods with Vidura and Dhritarashtra
    if he cannot avert the impending slaughter.
  evidence_refs:
  - ev:3
  - ev:13
  confidence: medium
  cautions: The passage gives little detail about the woods journey itself; the motif
    is inferred from explicit withdrawal language.
- id: motif:4
  label: lineage extinction and revival
  taxonomy_refs:
  - death_rebirth
  basis: Vidura says the Kuru race had become extinct and was revived by Bhishma,
    and he warns Bhishma against allowing the race's extinction before his eyes.
  evidence_refs:
  - ev:10
  - ev:12
  confidence: low
  cautions: The language concerns a royal lineage or family, not an individual death
    and resurrection event.
- id: motif:5
  label: moral victory tied to righteousness
  taxonomy_refs:
  - wisdom
  basis: Drona ends his appeal by stating that victory is where righteousness is.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: This is a concise ethical maxim within counsel, not an extended wisdom
    narrative.
