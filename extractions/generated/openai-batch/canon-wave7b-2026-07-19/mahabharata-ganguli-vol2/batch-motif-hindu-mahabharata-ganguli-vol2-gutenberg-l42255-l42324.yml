canonical_text:
  quote: ''
  summary: Sanjaya narrates Abhimanyu's violent attack within the Kaurava host. Abhimanyu
    seizes Satyasravas, kills Rukmaratha after Rukmaratha vows to capture him alive,
    withstands encirclement by many princes, uses the Gandharva weapon and its illusion
    to confound opponents, slays numerous warriors, and forces Duryodhana to retreat.
  language: English
  quote_policy: summarized
