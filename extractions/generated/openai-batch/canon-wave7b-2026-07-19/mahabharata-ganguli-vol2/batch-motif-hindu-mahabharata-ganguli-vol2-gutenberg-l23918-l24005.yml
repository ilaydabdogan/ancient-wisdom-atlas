  summary: Sanjaya describes northern islands, encircling oceans of different substances,
    sacred mountains, varshas and regions inhabited by gods and other beings, the
    worship and rule of Prajapati, self-arising food, and four immense elephants whose
    breathing regulates winds and the life-breath of earthly creatures. Dhritarashtra
    asks Sanjaya to continue.
