canonical_text:
  quote: ''
  summary: Sanjaya narrates Drona's rebuke of Duhsasana for fleeing battle, recalling
    Duhsasana's abusive words to Draupadi after the dice game and warning him about
    the Pandavas. Drona urges either peace with the Pandavas and recognition of Yudhishthira's
    sovereignty or renewed combat. Duhsasana silently proceeds to fight Satyaki. Drona
    then attacks the Pandava-allied forces, is challenged by Viraketu, and kills him
    with a fiery shaft; Viraketu's brothers rush against Drona in grief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sanjaya narrates that Drona, identified as the son of Bharadwaja, addresses
    Duhsasana when Duhsasana's car is near his own.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Drona asks why the cars are fleeing, whether the king is well, whether the
    ruler of the Sindhus is alive, and why Duhsasana, a prince and brother of the
    king, flees from battle.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Drona recalls Duhsasana's earlier speech to Draupadi after the dice game,
    in which Duhsasana called her a slave won at dice and disparaged her husbands.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Drona says Duhsasana provoked fierce hostilities with the Panchalas and Pandavas
    and calls Duhsasana the root of Draupadi's woes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Drona uses serpent imagery for the dice, weapons, the Pandavas, and Phalguna's
    shafts, comparing them to poisonous or slough-free snakes.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Drona advises Duhsasana to make peace with the Pandavas before Yudhishthira,
    Krishna, Bhima, Phalguna, and the Parthas act against him and his brothers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Drona recalls that Bhishma previously told Suyodhana that the Pandavas were
    unconquerable and advised peace, but Suyodhana did not follow that advice.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Drona tells Duhsasana to go quickly to the place where Satyaki is and fight
    him, saying the host will flee without Duhsasana.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Duhsasana gives no reply, feigns not hearing Drona, proceeds toward Satyaki
    with a large force of unretreating Mlecchas, and fights Satyaki.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Drona rushes against the Panchalas and Pandavas, penetrates the Pandava host,
    and causes carnage among the Pandavas, Panchalas, and Matsyas.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Viraketu, a Panchala prince, attacks Drona, piercing Drona, Drona's standard,
    and Drona's charioteer; Drona is temporarily unable to approach him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Panchalas surround Drona and cover him with showers of shafts, lances,
