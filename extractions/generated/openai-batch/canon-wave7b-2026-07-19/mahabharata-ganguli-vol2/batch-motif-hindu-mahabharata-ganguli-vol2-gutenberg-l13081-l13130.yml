canonical_text:
  quote: ''
  summary: Bhima urges Krishna to address Duryodhana mildly and seek peace with the
    Kurus. He describes Duryodhana as wrathful, deceitful, hostile to the Pandavas,
    and difficult to pacify. Bhima compares him to a serpent hidden in reeds and warns
    that his anger may consume the Bharatas like fire consumes forests. He lists former
    destructive kings said to have arisen at the end of a Yuga to destroy their kin,
    and presents Duryodhana as a similar figure among the Kurus. Bhima asks Krishna
    to use sweet, virtuous words and to involve the Grandsire and other counselors
    to restore brotherly feeling; he adds that Yudhishthira approves and Arjuna is
    averse to war.
  language: English
  quote_policy: summarized
