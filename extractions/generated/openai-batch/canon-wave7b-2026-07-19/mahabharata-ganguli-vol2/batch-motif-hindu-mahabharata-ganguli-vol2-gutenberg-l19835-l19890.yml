canonical_text:
  quote: ''
  summary: 'Sanjaya narrates Uluka''s arrival at the Pandava camp as Duryodhana''s
    envoy. Yudhishthira grants him freedom to speak. In an assembly of Pandavas and
    allied kings, Uluka delivers Duryodhana''s message: he recalls the dice defeat,
    exile, and humiliation of Krishna, challenges the Pandavas to battle at Kurukshetra,
    invokes Bhima''s vow against Dussasana, praises Kaurava champions such as Bhishma,
    Karna, Salya, and Drona, and compares the Kaurava host to a celestial army and
    to the swollen, uncrossable Ganga.'
  language: English
  quote_policy: summarized
