canonical_text:
  quote: ''
  summary: 'Dhritarashtra asks Sanjaya what Krishna said to Karna after taking him
    away in a car. Sanjaya reports Krishna''s appeal: Krishna cites scripture to identify
    Karna as morally the son of Pandu and as Kunti''s son born before Yudhishthira,
    urges him to accept kingship, and describes a royal installation supported by
    the Pandavas, priests, allies, ritual objects, regalia, praise, and brotherly
    union.'
