canonical_text:
  quote: ''
  summary: The Rishis and gods ask Nahusha to become king of the gods. Nahusha initially
    protests that he is feeble and that Indra is strong, but the gods empower him
    through their austerities and tell him that beings within his sight will increase
    his power. Nahusha is crowned in heaven, becomes ruler of the worlds, turns toward
    sensual enjoyment, and demands that Sachi, Indra's queen, attend him. Sachi seeks
    refuge with Vrihaspati, who promises she will be reunited with Indra and need
    not fear Nahusha. Nahusha hears of this refuge and becomes enraged.
  language: English
  quote_policy: summarized
