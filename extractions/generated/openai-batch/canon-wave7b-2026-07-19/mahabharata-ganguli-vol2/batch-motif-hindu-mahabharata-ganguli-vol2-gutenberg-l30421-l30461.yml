canonical_text:
  quote: ''
  summary: Abhimanyu wounds several Kuru-side warriors, is attacked and surrounded,
    and fights Lakshmana. He disables Lakshmana's chariot, cuts down a dart likened
    to a snake, and Kripa carries Lakshmana away. The battle then becomes a general
    melee, with warriors fighting bare-armed after losing armor, cars, and bows; Bhishma
    uses celestial weapons against Pandava troops, and the earth is covered with fallen
    bodies.
  language: English
  quote_policy: summarized
