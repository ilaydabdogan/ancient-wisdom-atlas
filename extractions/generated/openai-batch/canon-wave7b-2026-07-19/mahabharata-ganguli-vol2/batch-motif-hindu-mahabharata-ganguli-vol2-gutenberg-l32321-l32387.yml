canonical_text:
  quote: ''
  summary: After Iravat is slain, Ghatotkacha roars so violently that earth, sky,
    directions, and troops tremble. He advances in wrath with Rakshasa allies against
    Duryodhana, who is supported by the Vanga ruler and an elephant division. The
    Rakshasas devastate the elephants using weapons, mountain-summits, and trees;
    Duryodhana counters and kills named Rakshasas. Ghatotkacha then accuses Duryodhana
    of past wrongs against the Pandavas and Krishna/Draupadi, vows vengeance, and
    covers Duryodhana with arrows.
  language: English
  quote_policy: summarized
