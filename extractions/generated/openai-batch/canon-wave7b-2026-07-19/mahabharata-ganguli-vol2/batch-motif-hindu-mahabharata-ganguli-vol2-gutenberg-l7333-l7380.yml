  quote: ''
  summary: Drupada's priest comes before the Kaurava leaders and delivers a diplomatic
    speech. He argues that Dhritarashtra's and Pandu's sons should have had equal
    paternal shares, recounts the Pandavas' dispossession, attempted murders, deceitful
    loss of kingdom, exile, humiliations, and hardships, and urges restitution and
    peace while warning of the Pandavas' military strength, including Arjuna and Krishna.
  language: English
