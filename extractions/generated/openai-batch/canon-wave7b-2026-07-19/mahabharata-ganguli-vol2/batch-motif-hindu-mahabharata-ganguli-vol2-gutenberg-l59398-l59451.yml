canonical_text:
  quote: ''
  summary: In a fierce battle, Aswatthaman's weapon burns the Pandava force and darkness
    covers the scene. Arjuna invokes the Brahma weapon, dispelling the darkness and
    revealing that a full Akshauhini has been slain, while Kesava and Arjuna remain
    unharmed. The Pandavas rejoice and the Kauravas are astonished. Aswatthaman, distressed
    that his weapon failed against them, abandons the fight, meets Vyasa, and asks
    why the weapon became fruitless.
  language: English
  quote_policy: summarized
