canonical_text:
  quote: ''
  summary: In SECTION LXI, after defeating Vikartana's son, Arjuna asks Uttara to
    drive toward Bhishma's division, marked by a golden palmyra. Uttara, wounded and
    overwhelmed by the sights, sounds, smells, and weapons of battle, says he can
    no longer hold the reins. Arjuna reassures him, orders him to stand firm as charioteer,
    and declares that he will attack Bhishma and the Kuru host using celestial and
    divinely obtained weapons. His speech describes the coming battle through images
    of lightning, a river of death, a forest cut down or burned, Mount Sumeru, and
    divine-warrior comparisons.
  language: English
  quote_policy: summarized
