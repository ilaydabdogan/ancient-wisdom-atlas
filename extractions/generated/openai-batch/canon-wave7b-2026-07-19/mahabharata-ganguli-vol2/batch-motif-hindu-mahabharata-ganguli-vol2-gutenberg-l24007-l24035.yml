canonical_text:
  quote: ''
  summary: Sanjaya reports to a king the measured dimensions of Swarbhanu, the Moon,
    and the Sun, and states that Rahu envelops the Sun and Moon at appointed times.
    He says he has described the construction of the universe according to the Shastras
    and urges the king to pacify Duryodhana. The passage then states the benefits
    of listening to the Bhumi Parva, especially for a Kshatriya or king observing
    vows on full-moon or new-moon days, including prosperity, fulfilled desires, longer
    life, fame, energy, righteous approval, and satisfaction of ancestors.
  language: English
  quote_policy: summarized
