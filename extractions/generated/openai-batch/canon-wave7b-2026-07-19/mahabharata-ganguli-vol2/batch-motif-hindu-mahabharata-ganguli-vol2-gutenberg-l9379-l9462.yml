  quote: ''
  summary: A speaker counsels a king on the value of disagreeable but beneficial speech,
    the sacrifice of lesser goods for greater ends, the dangers of gambling, the king's
    treatment of servants and allies, social and ethical cautions, personal disciplines
    such as ablution and moderate eating, and retiring to the woods as a Muni after
    fulfilling family duties.
