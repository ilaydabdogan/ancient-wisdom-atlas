canonical_text:
  quote: ''
  summary: 'Sanjaya describes a fierce battlefield episode: Bhima is wounded by Drona
    and other warriors, allies are sent to rescue him, the Pandava forces advance
    against Drona, and the battle becomes chaotic with elephants, chariots, weapons,
    kinship cries, severed limbs, mingled blood, dust, and an advance toward Drona''s
    car.'
  language: English
  quote_policy: summarized
