  summary: Dhritarashtra laments Bhishma's death and asks Sanjaya to describe what
    occurred. Sanjaya reports Bhishma's fall onto a bed of arrows, the grief and fear
    of both armies, cosmic darkening, the cessation of battle, the gathering of warriors
    around Bhishma, and Bhishma's request for a fitting pillow from Dhananjaya.
  language: English
