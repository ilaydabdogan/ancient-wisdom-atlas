canonical_text:
  quote: ''
  summary: Narada tells Srinjaya that King Sasavindu, though exceptionally beautiful,
    powerful, sacrificially active, wealthy, fertile, and prosperous in rule, died
    and ascended to heaven. Narada recounts Sasavindu’s many wives and sons, the sons’
    sacrifices and martial excellence, Sasavindu’s Horse-sacrifice and vast gifts
    to Brahmanas, the abundance of food and drink, and then uses Sasavindu’s superiority
    to urge Srinjaya not to grieve for Swaitya, who made no sacrifice or sacrificial
    gift.
  language: English
  quote_policy: summarized
