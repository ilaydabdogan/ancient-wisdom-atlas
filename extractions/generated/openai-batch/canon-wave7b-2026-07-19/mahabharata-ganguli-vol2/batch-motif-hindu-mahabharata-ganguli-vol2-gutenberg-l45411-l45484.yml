canonical_text:
  quote: ''
  summary: Sanjaya describes Drona arranging the Kaurava forces at dawn. Warriors
    prepare weapons and call for Arjuna, Govinda, and Bhima. Drona reassures Jayadratha
    and places him behind a large guarded force. He forms a vast compound array with
    Sakata, circular, lotus, and needle forms, positions named commanders, and stands
    at the entrance. The array is described with oceanic and earth-devouring imagery,
    astonishing celestial witnesses and pleasing Duryodhana.
  language: English
  quote_policy: summarized
