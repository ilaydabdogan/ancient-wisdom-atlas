canonical_text:
  quote: None in that battle, was capable of even looking at Arjuna.
  summary: Dhritarashtra asks who opposed Arjuna after the army’s van broke. Sanjaya
    reports that Duhsasana attacked Arjuna with a large elephant-force, but Arjuna
    penetrated and destroyed it with arrows, leaving the battlefield covered with
    bodies, weapons, and wreckage. Duhsasana and his forces fled into the Sakata array,
    seeking Drona as deliverer.
  language: English
  quote_policy: quoted
