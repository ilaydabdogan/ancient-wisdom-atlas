canonical_text:
  quote: the mighty-armed Bhimasena began to roar like a bull
  summary: Dhritarashtra asks Sanjaya which side struck first after the armies were
    arrayed. Sanjaya describes Dussasana advancing with Bhishma at the head of the
    Kuru troops and the Pandavas advancing with Bhimasena at their head. Both armies
    rush together amid horns, drums, conches, shouts, elephants, horses, arrows, and
    dust. Bhimasena's roar terrifies the opposing warriors and animals. Kuru princes
    surround Bhima with arrows, while Pandava warriors rush against them. The first
    encounter is fierce, confused, and marked by kin fighting kin, with Bhishma shining
    amid the host.
  language: English
  quote_policy: quoted
