canonical_text:
  quote: ''
  summary: Yudhishthira asks Nakula, Sahadeva, and Draupadi how each will live in
    Virata's dominions while disguised. Nakula proposes to become Granthika, keeper
    and trainer of horses. Sahadeva proposes to become Tantripal, keeper of kine.
    Draupadi proposes to become a Sairindhri skilled in dressing hair and to serve
    Sudeshna. Yudhishthira expresses concern for Draupadi's status and chastity and
    warns her about sinful men gazing at her.
  language: English
