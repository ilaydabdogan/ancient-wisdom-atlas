canonical_text:
  quote: ''
  summary: Arjuna returns to Yudhishthira, reports a wondrous meeting with the Three-eyed
    god, and receives approval and blessings. Krishna equips Arjuna's ape-marked chariot,
    Arjuna circumambulates and ascends it after rites and benedictions, and Krishna
    takes the reins. Auspicious sounds, hymns, breeze, and omens accompany the departure.
    Arjuna interprets the omens as signs of victory, declares his intent to slay the
    ruler of the Sindhus, and assigns Satyaki/Yuyudhana to protect Yudhishthira.
  language: English
  quote_policy: summarized
