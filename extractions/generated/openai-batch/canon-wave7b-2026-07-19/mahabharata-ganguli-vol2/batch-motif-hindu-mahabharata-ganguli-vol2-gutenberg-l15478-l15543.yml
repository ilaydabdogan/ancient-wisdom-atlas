canonical_text:
  quote: ''
  summary: Janamejaya asks why friends and revered counselors did not restrain a destructive,
    avaricious person. Vaisampayana replies that the holy one, Bhishma, and Narada
    did give beneficial counsel. Narada warns that good counsel and receptive friends
    are rare, and introduces an old story about Galava's disgrace through obstinacy.
    Dharma, in the form of Vasishtha, tests the ascetic Viswamitra by appearing hungry
    at his hermitage. Viswamitra prepares Charu of rice and milk but is delayed; the
    guest says he has already eaten and tells Viswamitra to wait. Viswamitra stands
    for a hundred years with the food on his head, subsisting on air, while Galava
    waits upon him. Dharma returns in the same assumed form, accepts the still warm
    food, and is gratified. Viswamitra attains Brahmana status and tells Galava to
    go, but Galava persistently asks what final gift he should give his preceptor.
    Angered by Galava's obstinacy, Viswamitra demands eight hundred white horses,
    each with one black ear.
  language: English
  quote_policy: summarized
