canonical_text:
  quote: ''
  summary: 'After a star-lit night of conversation between Vidura and Krishna, dawn
    arrives. Choristers and bards wake Kesava with conchs and cymbals. Krishna performs
    morning acts: bathing, reciting sacred Mantras, pouring clarified butter on the
    sacrificial fire, and worshipping the rising sun. Duryodhana and Sakuni invite
    Govinda to Dhritarashtra''s court, where the Kurus, Bhishma, and kings are assembled
    and seek his presence. Krishna greets them courteously and later gives gold, robes,
    kine, and steeds to Brahmanas.'
  language: English
  quote_policy: summarized
