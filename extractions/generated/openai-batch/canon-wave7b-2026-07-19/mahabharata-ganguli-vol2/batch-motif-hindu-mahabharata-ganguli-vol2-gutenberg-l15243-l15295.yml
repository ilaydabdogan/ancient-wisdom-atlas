canonical_text:
  quote: ''
  summary: Narada describes Bhogavati, the city of the Nagas, ruled by Vasuki and
    inhabited by Shesha and innumerable powerful Nagas. Matali notices the radiant
    Naga youth Sumukha, asks about his lineage and parents, and expresses the wish
    to make him husband to his daughter Gunakesi. Narada identifies Sumukha's ancestry
    and says his father Chikura was slain by Vinata's Son; Matali then asks Narada
    to secure Sumukha as son-in-law.
  language: English
  quote_policy: summarized
