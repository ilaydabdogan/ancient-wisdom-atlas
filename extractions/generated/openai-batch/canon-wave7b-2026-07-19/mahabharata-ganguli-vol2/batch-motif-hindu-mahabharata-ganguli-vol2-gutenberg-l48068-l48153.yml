    of public shame for disobeying Yudhishthira, accepts Yudhishthira's command to
    follow Arjuna. Satyaki declares his loyalty to Arjuna and to Yudhishthira, promises
    to pierce Drona's host and reach Jayadratha, and describes several formidable
    enemy divisions, including elephant corps, Rukmaratha warriors, Kirata riders,
    and northern Mleccha forces under or associated with Duryodhana's side.
