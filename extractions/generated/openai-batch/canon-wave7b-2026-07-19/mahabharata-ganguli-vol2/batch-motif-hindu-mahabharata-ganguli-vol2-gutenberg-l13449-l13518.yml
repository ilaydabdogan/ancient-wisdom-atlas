canonical_text:
  quote: ''
  summary: Draupadi, grieving and in tears, addresses Krishna after hearing peace-oriented
    speech. She recalls the deceit against the Pandavas, the rejected request for
    five villages, her public humiliation in the assembly, her appeal to Govinda,
    Dhritarashtra's boon freeing the Pandavas, and their subsequent exile. She urges
    Krishna to punish the sons of Dhritarashtra and rescue her from grief.
  language: English
