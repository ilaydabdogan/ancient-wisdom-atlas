canonical_text:
  quote: ''
  summary: Duhsasana attacks Prativindhya as he advances in battle. The two exchange
    arrows; Duhsasana disables Prativindhya’s horses, driver, standard, car, banner,
    quivers, strings, traces, and bow. Prativindhya continues fighting on foot until
    his brothers arrive; he mounts Sutasoma’s car and resumes shooting. Warriors from
    Duhsasana’s side surround him, and a fierce midnight battle begins, said to increase
    the population of Yama’s kingdom.
  language: English
  quote_policy: summarized
