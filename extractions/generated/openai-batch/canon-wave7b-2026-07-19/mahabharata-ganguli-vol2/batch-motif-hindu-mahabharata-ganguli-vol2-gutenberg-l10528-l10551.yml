canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanat-sujata about the true form and colour of omnipresent,
    eternal Brahman. Sanat-sujata replies that Brahman may appear in various colours
    but cannot be located or seen in earthly, celestial, scriptural, or sacrificial
    domains. He describes Brahman as beyond limited intellect, subtler than a razor’s
    edge and grosser than mountains, the unchangeable basis of everything, the visible
    universe, the source from which creatures arise and to which they return, and
    free from duality.
  language: English
  quote_policy: summarized
