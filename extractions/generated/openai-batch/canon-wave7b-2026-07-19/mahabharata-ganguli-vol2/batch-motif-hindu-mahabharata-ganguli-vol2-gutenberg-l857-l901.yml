canonical_text:
  quote: ''
  summary: Arjuna, in the disguise of Vrihannala, appears before King Virata wearing
    women's ornaments and presenting a gender-liminal status. Virata questions the
    unknown newcomer, praises his strength and appearance, and offers him high status.
    Arjuna asks to serve as dancing-master to Princess Uttara. Virata grants the request
    after tests and examination, and Arjuna teaches music and dance in the women's
    quarters while remaining unrecognized.
  language: English
  quote_policy: summarized
