canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanjaya why Karna did not use Vasava's fatal dart against
    Krishna or Arjuna. Sanjaya says the warriors repeatedly resolved at night that
    Karna should do so, but in the morning they forgot through destiny and the illusion
    of the gods. Dhritarashtra says the dart has been lost after killing Ghatotkacha
    and asks how the nocturnal battle continued after that fall, especially around
    Drona and those protecting or attacking him.
  language: English
