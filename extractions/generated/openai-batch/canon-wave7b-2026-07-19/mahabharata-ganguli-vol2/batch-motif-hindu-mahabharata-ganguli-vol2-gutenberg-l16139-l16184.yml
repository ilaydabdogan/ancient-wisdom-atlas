canonical_text:
  quote: ''
  summary: Narada narrates that Madhavi, having become a maiden again, follows the
    Brahmana Galava. Galava approaches the childless king Usinara and proposes that
    Madhavi bear him royal sons in exchange for rare black-eared horses needed for
    Galava's preceptor. Usinara says he has only two hundred such horses and will
    beget one son, while refusing to misuse wealth belonging to his subjects. Galava
    gives Madhavi to Usinara; Sivi is born, and afterward Galava takes Madhavi back
    and continues onward.
  language: English
  quote_policy: summarized
