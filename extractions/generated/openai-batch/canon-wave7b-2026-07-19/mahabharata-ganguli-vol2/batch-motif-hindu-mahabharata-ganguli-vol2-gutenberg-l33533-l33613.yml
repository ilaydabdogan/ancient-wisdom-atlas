canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanjaya how Drona and Arjuna, though mutually dear,
    fought each other. Sanjaya explains that Kshatriya duty overrides personal regard
    in battle. Arjuna, Drona, Susarman, and the Trigartas exchange arrows; Arjuna
    counters many attackers, witnessed approvingly by gods and Danavas. Arjuna uses
    the Vayavya weapon to raise a destructive wind, and Drona counters with the Saila
    weapon, restoring calm. Kaurava warriors surround various Pandava heroes. Bhima
    dismounts with a mace, fights an elephant division, kills elephants with mace
    and tusks, and the surviving elephants flee, causing Duryodhana's troops to rout.
  language: English
  quote_policy: summarized
