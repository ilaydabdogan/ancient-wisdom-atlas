canonical_text:
  quote: ''
  summary: Salya parts from Duryodhana after acknowledging a boon or promise, then
    visits Yudhishthira and the Pandavas at Upaplavya. He receives formal hospitality,
    greets the brothers, praises Yudhishthira's endurance, virtue, and release from
    exile and concealment, and reports his promise to Duryodhana. Yudhishthira asks
    Salya, when serving as Karna's charioteer in Karna's combat with Arjuna, to protect
    Arjuna by discouraging Karna. Salya agrees and consoles Yudhishthira by recalling
    past sufferings of Draupadi and other exemplars, including Damayanti and Indra
    with his wife.
  language: English
  quote_policy: summarized
