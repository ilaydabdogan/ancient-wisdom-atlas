canonical_text:
  quote: What can it, therefore, be but Destiny that even such an army should be slain?
  summary: Dhritarashtra describes the Kuru army as numerous, trained, paid, well-treated,
    and protected, then compares it to a vast ocean. He laments that Arjuna, Krishna,
    and Satyaki have entered or pierced the host, bringing Jayadratha within reach
    and causing panic, rout, and grief among the Kauravas.
  language: English
  quote_policy: quoted
