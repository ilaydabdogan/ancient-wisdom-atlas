canonical_text:
  quote: ''
  summary: Sanjaya reports that Yuyudhana/Satyaki advances through the Kaurava host
    with Pandava support, routs and slays many foes, and seeks to follow Dhananjaya/Arjuna’s
    path. Drona blocks him and exchanges arrows with him. Drona taunts him about Arjuna’s
    avoidance, while Satyaki answers that, under Yudhishthira’s command, he will follow
    his preceptor’s track.
  language: English
  quote_policy: summarized
