  summary: Sanjaya reports that Duryodhana orders Dussasana to protect the surrounded
    Bhishma, sends cavalry and then Salya against Yudhishthira, Nakula, and Sahadeva;
    the Pandava leaders defeat the cavalry, exchange arrows with Salya, and Bhima
    moves to aid Yudhishthira as the battle intensifies late in the day.
