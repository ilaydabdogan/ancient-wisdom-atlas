canonical_text:
  quote: ''
  summary: Krishna describes to Arjuna a battlefield covered with slain and wounded
    kings, soldiers, elephants, horses, vehicles, weapons, ornaments, and blood. He
    compares Arjuna's feat to the battle power of Indra. Sanjaya then narrates that
    Krishna shows Arjuna the field, blows his conch Panchajanya along with the Pandava
    soldiers, and goes to Ajatasatru to report Jayadratha's slaying.
  language: English
  quote_policy: summarized
