canonical_text:
  quote: ''
  summary: Dhrishtadyumna finds Bhima's empty chariot, learns from Visoka that Bhima
    has entered the Dhartarashtra host alone, and resolves not to abandon him. Following
    Bhima's path, he finds him wounded and surrounded, lifts him onto his car, removes
    arrows, and embraces him. The Dhartarashtra princes attack Dhrishtadyumna, who
    uses the Pramohana weapon to stupefy them. Drona wounds Drupada, sounds his conch,
    learns of the princes' condition, and goes to rescue them.
  language: English
  quote_policy: summarized
