canonical_text:
  quote: ''
  summary: 'Vasudeva reports Dhritarashtra’s speech to Duryodhana. Dhritarashtra cites
    ancestral succession precedents: Yayati disinherited the proud eldest Yadu and
    enthroned obedient Puru; Devapi was excluded from kingship because of a bodily
    defect and Santanu became king; Dhritarashtra himself was passed over for Pandu.
    He argues that Yudhishthira, Pandu’s son and a virtuous ruler, lawfully holds
    the kingdom, and urges Duryodhana to give up half the kingdom and possessions.'
  language: English
  quote_policy: summarized
