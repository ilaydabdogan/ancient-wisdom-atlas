canonical_text:
  quote: ''
  summary: Bhishma says he consulted his mother, counsellors, and priests, then allowed
    Amva to leave for Salwa’s city with escorts. Amva asks Salwa to accept her, but
    Salwa rejects her because Bhishma had carried her away and because he regards
    her as belonging to another. Amva insists she was taken by force, remained attached
    only to Salwa, and swears to her fidelity. Salwa still refuses her, says he fears
    Bhishma, and sends her away; Amva leaves in grief.
  language: English
  quote_policy: summarized
