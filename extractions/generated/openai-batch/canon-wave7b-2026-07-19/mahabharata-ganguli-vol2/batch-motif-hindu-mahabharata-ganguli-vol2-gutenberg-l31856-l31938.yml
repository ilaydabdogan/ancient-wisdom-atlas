    same-function comparison to death-as-passage-to-the-lord-of-death language.
  claim_level: same_function
  target: death destination in Yama's abode
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: low
  limitations: The passage gives no journey map, judgment scene, or developed afterlife
    narrative.
