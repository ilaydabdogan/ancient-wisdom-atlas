candidate_motifs:
- id: motif:1
  label: ordered army array and counter-array
  taxonomy_refs: []
  basis: The Kaurava army is carefully arrayed, and Yudhishthira orders Dhrishtadyumna
    to form the Sringataka counter-array.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: This is a battlefield formation pattern rather than a mythic symbol by
    itself.
- id: motif:2
  label: oceanic battle host
  taxonomy_refs: []
  basis: The army's uproar and the Kaurava array are repeatedly likened to the ocean,
    including language of billows and current.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage uses simile; it does not make the army literally aquatic.
- id: motif:3
  label: serpent-like weapon shower
  taxonomy_refs:
  - serpent
  basis: Arrows or shafts falling in showers are compared to terrible snakes with
    mouths open.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The serpents are figurative weapon imagery, not literal serpents in the
    scene.
- id: motif:4
  label: cosmicized opposing hosts
  taxonomy_refs:
  - duality
  basis: The passage explicitly says the two armies looked like celestial and demoniac
    hosts battling each other.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The comparison is visual and rhetorical; the combatants remain human armies
    in the narrated action.
- id: motif:5
  label: death as dispatch to Yama's abode
  taxonomy_refs: []
  basis: Combatants kill one another and are described as sending one another to the
    abode of Yama.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage contains only a brief death-destination formula, not a detailed
    afterlife journey.
- id: motif:6
  label: battlefield fire from animal combat
  taxonomy_refs: []
  basis: Fire mixed with smoke arises from friction in the tusks of battling elephants.
