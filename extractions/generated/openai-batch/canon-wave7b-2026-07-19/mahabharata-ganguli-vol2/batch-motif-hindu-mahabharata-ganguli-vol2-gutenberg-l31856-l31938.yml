canonical_text:
  quote: ''
  summary: Sanjaya reports that, after a night of sleep, the Kaurava and Pandava armies
    advance to battle. The Kauravas arrange their forces under named leaders, and
    Yudhishthira orders Dhrishtadyumna to form the Pandava counter-array called Sringataka.
    The armies sound drums, conches, roars, and challenges, then engage in a fierce
    battle described through images of ocean, serpents, lightning, hill-crests, fire,
    smoke, and celestial versus demoniac hosts. Bhishma charges the Pandavas, who
    rush against him, and the fighting becomes entangled among infantry, chariots,
    and elephants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After passing the night in sleep, the Kauravas and Pandavas proceed again
    to battle, accompanied by an uproar likened to the ocean.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Named Kaurava leaders form a carefully ordered array, with Bhishma proceeding
    in the van and other leaders and allied peoples placed after him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Standards, white umbrellas, bracelets, and costly bows are described as shining
    in the Kaurava force.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Yudhishthira sees the Kaurava array and instructs Prishata's son to form a
    counter-array without delay.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Prishata's son forms the Pandava array called Sringataka, with Bhimasena and
    Satyaki at the horns, Arjuna with Krishna as charioteer near them, Yudhishthira
    and the twins in the center, and Abhimanyu, Virata, Draupadi's sons, and Ghatotkacha
    in the rear.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The armies produce a loud mixture of drums, conches, leonine roars, shouts,
    and armpit-slapping before the warriors gaze at and challenge one another by name.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'The battle begins with combatants striking one another, and weapons are described
    through similes: shafts like snakes, darts like lightning, maces like hill-crests,
    and sabres and shields spread over the field.'
  category: action
  evidence_refs:
