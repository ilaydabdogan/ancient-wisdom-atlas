canonical_text:
  quote: ''
  summary: At the opening of Virata Parva, Janamejaya asks how the Pandavas and Draupadi
    lived unrecognized in Virata. Vaisampayana recounts that Yudhishthira, after receiving
    boons from the god of Justice and restoring a Brahmana's lost implements, gathers
    his brothers to plan their thirteenth year of concealment. Arjuna lists possible
    regions; Yudhishthira chooses the city of Virata in Matsya and proposes to enter
    the king's service disguised as a Brahmana dice-player named Kanka.
  language: English
  quote_policy: summarized
