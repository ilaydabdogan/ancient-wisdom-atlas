canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanjaya how Sikhandin and Bhishma advanced in battle.
    Sanjaya describes the Pandava army marching at sunrise with Sikhandin in the van,
    the Kaurava army advancing with Bhishma at its head, Bhishma's varied battle arrays,
    and the ensuing fight in which warriors die, the Kaurava host is afflicted, and
    Dhritarashtra asks what Bhishma did next.
  language: English
  quote_policy: summarized
