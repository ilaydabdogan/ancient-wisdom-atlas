canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanjaya to describe the earth's rivers, mountains, provinces,
    forests, and their dimensions. Sanjaya answers with an account of the five elements
    and their attributes, the composition and dissolution of creatures, the limits
    of reason concerning the inconceivable, and a brief cosmographic description of
    the circular island Sudarsana, surrounded by the salt ocean and visible in the
    lunar disc with portions resembling a peepul tree and a hare.
  language: English
  quote_policy: summarized
