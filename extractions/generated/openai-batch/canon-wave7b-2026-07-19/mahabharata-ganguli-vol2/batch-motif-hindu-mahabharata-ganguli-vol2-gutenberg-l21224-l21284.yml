canonical_text:
  quote: ''
  summary: Rama tells Amva that he does not take up arms except for Vedic or Brahmana
    causes, but Amva repeatedly asks him to slay Bhishma, whom she names as the cause
    of her misery. The rishi Akritavrana urges Rama not to abandon a girl seeking
    protection and recalls Rama's earlier vows. Rama resolves first to try conciliation
    with Bhishma and then to slay him if he disobeys. After rites and prayers, Rama,
    Amva, and ascetics travel to Kurukshetra and camp by the Saraswati.
  language: English
  quote_policy: summarized
