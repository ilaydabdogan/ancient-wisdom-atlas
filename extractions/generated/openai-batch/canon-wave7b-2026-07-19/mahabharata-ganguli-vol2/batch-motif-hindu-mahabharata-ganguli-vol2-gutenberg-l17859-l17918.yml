  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Drona says Yudhishthira, even if dwelling in the woods with Draupadi and his
    armed brothers, cannot be easily vanquished.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Drona says Yudhishthira shone in Kuvera’s presence and that the Pandavas procured
    wealth from Kuvera’s abode before seeking sovereignty.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Drona says he and Bhishma have given gifts, poured libations on fire, studied
