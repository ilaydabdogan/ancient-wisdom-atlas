canonical_text:
  quote: ''
  summary: Vaisampayana narrates Duryodhana’s silent, cheerless reaction after being
    addressed. Bhishma laments the need to fight the righteous Yudhishthira. Drona
    says he loves Dhananjaya more than his own son, condemns the Kshatriya duty that
    will force him to fight, rebukes Duryodhana’s deceit and refusal of counsel, praises
    the strength and righteousness of the Pandavas and their allies, recalls completed
    ritual duties, and urges Duryodhana to make peace rather than seek a disastrous
    war.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Duryodhana becomes cheerless, lowers his face, casts oblique glances, and
    gives no reply after being addressed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma says it is a great grief that they must fight Yudhishthira, whom he
    describes as respectful to superiors, without envy, conversant with Brahma, and
    truthful.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Drona says his affection for Dhananjaya is greater than his affection for
    his son Aswatthaman, and that Kshatriya duty will require him to fight Dhananjaya.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Drona describes Dhananjaya as reverent and humble toward him, as the Ape-bannered
    hero, and as an unmatched bowman whose superiority came through Drona’s grace.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Drona contrasts sinful and righteous conduct and says the Pandavas still wish
    to do what is agreeable to Duryodhana despite his falsehood and deceit toward
    them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Drona says Duryodhana has already been addressed by senior advisers including
    the eldest of the Kurus, Drona, Vidura, and Vasudeva, yet has not understood what
    benefits him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Drona compares Duryodhana’s wish to pierce the Pandava host with a great force
    to the current of the Ganga piercing an ocean full of sharks, alligators, and
    makaras.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Drona says Duryodhana treats Yudhishthira’s prosperity as his own, like another
