canonical_text:
  quote: ''
  summary: Bhishma describes lying wounded at night after many days of combat with
    Rama, son of Jamadagni. In a dream near morning, eight effulgent Brahmanas who
    had previously comforted him appear, promise protection and victory, and instruct
    him to recollect and use the Praswapa weapon, a divine weapon known to him from
    a former life. They say it will not kill Rama but will cause him to sleep, after
    which Bhishma can awaken him with the Samvodhana weapon. The Brahmanas then vanish.
  language: English
  quote_policy: summarized
