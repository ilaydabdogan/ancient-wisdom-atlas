canonical_text:
  quote: ''
  summary: Vaisampayana reports that Kanwa addresses Duryodhana in the Kuru assembly.
    Kanwa contrasts eternal divine beings with destructible cosmic elements and mortal
    kings, urges peace with Yudhishthira and joint rule by Pandavas and Kauravas,
    and introduces an old story about Matali, Indra's charioteer, seeking a worthy
    husband for his beautiful daughter Gunakesi. After finding no suitable groom among
    gods, humans, and other groups, Matali consults his wife Sudharma and enters the
    nether regions to search among the Nagas.
  language: English
  quote_policy: summarized
