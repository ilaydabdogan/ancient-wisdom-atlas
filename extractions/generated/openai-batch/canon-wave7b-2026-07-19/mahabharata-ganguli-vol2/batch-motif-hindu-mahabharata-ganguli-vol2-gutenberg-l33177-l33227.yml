canonical_text:
  quote: "“Taking her birth as a daughter she hath become a man. Indeed, she will
    fight with me, but I will never shoot my arrows at her.”"
  summary: Duryodhana treats Bhishma’s situation as requiring urgent protection and
    orders Dussasana and other warriors to surround him. Bhishma has declared that
    he will not kill Sikhandin, who was born female and later became male, though
    he will fight other Pandava-aligned warriors. Duryodhana fears Sikhandin may kill
    an unprotected Bhishma, while Arjuna arranges to protect Sikhandin and place him
    before Bhishma.
  language: English
  quote_policy: quoted
