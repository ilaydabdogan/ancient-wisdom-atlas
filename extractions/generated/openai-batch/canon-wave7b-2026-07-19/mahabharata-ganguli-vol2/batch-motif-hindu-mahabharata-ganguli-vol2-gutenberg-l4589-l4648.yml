canonical_text:
  quote: ''
  summary: Arjuna challenges Karna to fulfill his former boast in battle, recalls
    the outrage against Panchala's princess and the Pandavas' forest suffering, and
    frames the combat as vengeance delayed by moral restraint. Karna answers with
    counter-boasts and accepts the duel. In the ensuing arrow battle, Arjuna neutralizes
    Karna's weapons, kills Karna's followers and steeds, wounds Karna through his
    armor, and Karna flees north after losing consciousness.
  language: English
  quote_policy: summarized
