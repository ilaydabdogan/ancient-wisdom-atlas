canonical_text:
  quote: ''
  summary: 'Sanjaya reports a sequence of battlefield encounters: allied leaders renew
    their resolve after earlier slaughter; Somadatta attacks Satyaki and is struck
    down by Bhima and Satyaki; Valhika retaliates and is killed by Bhima; Bhima then
    defeats multiple named and unnamed opponents, including groups of sons, car-warriors,
    and Sakuni''s brothers.'
  language: English
  quote_policy: summarized
