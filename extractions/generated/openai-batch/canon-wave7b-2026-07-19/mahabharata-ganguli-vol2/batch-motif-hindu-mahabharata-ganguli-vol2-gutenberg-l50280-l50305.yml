  quote: ''
  summary: Sanjaya reports that, after an army has been routed and enemy warriors
    have advanced toward the ruler of the Sindhus, Duryodhana hastens to Drona. In
    anger, Duryodhana reproaches Drona for having been bypassed or defeated by Arjuna,
    Bhimasena, and Satyaki, compares the event to the drying of the ocean, and asks
    Drona what should now be done for the ruler of the Sindhus.
