canonical_text:
  quote: ''
  summary: After hearing Bhishma's beneficial counsel, Duryodhana falls silent and
    the Kuru warriors decide to return. Dhananjaya follows, honors elders and venerable
    warriors with martial gestures, breaks Duryodhana's jeweled crown with an arrow,
    sounds Gandiva and Devadatta, and tells Matsya's son to turn back because the
    cattle have been recovered and the enemy is leaving. Celestials who witnessed
    the encounter depart delighted, reflecting on Partha's feats.
  language: English
  quote_policy: summarized
