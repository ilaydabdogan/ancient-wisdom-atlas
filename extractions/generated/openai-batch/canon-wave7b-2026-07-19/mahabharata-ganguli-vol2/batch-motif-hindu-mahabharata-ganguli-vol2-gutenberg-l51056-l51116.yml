canonical_text:
  quote: ''
  summary: 'Dhritarashtra asks Sanjaya to describe the slaughter that he attributes
    to his own evil policy. Sanjaya narrates the battle between Karna and Bhima: they
    exchange heavy arrow-fire, wound each other, kill many soldiers and animals, scatter
    the surrounding troops, and leave the battlefield covered with blood, corpses,
    broken vehicles, weapons, armor, ornaments, and standards. The scene is described
    through images of poisonous snakes, rain clouds, oceanic agitation, a river of
    blood, fire, broken trees, and elephants crushing reeds. Celestial beings are
    said to marvel at the warriors'' feats.'
  language: English
  quote_policy: summarized
