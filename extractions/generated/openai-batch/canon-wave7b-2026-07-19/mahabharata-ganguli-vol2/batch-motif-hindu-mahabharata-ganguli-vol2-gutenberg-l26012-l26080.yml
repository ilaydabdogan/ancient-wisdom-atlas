canonical_text:
  quote: ''
  summary: Arjuna praises Krishna as the all-pervading supreme deity, apologizes for
    having treated him casually as a friend, and asks to see his gentler ordinary
    or four-armed form rather than the frightening universal form. Krishna says the
    universal form was shown by his own mystic power to Arjuna alone and cannot be
    seen through Vedic study, sacrifice, gifts, or austerity. Krishna reassumes a
    gentle human form, restoring Arjuna's composure, and teaches that exclusive reverence
    allows one to know, see, and attain him. The next section begins with Arjuna asking
    about worship of Krishna versus meditation on the Immutable and Unmanifest.
  language: English
  quote_policy: summarized
