canonical_text:
  quote: '"the encounter ... was like unto that of old between the gods and the Asuras"'
  summary: The Matsya army overtakes the Trigartas after midday and engages them in
    a fierce battle of infantry, cavalry, chariots, and elephants. Dust, arrows, blood,
    corpses, birds, and vultures mark the battlefield. Satanika and Visalaksha penetrate
    the Trigarta host. King Virata maneuvers his chariot, reaches Susarman, king of
    the Trigartas, and the two rulers engage in a chariot duel, but dust prevents
    the soldiers from distinguishing one another.
  language: English
  quote_policy: quoted
