canonical_text:
  quote: ''
  summary: Bhishma recounts that he approached his mother Satyavati, reported that
    he had defeated kings and abducted the daughters of the ruler of Kasi for Vichitravirya,
    and received her joyful approval. As the nuptials approached, the eldest daughter
    of Kasi appealed to Bhishma on grounds of morality, saying she had already mentally
    chosen the ruler of the Salwas and had been privately solicited by him. She asked
    Bhishma to let her depart to the Salwa ruler, who she said was waiting for her.
  language: English
