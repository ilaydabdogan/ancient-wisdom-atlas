canonical_text:
  quote: ''
  summary: Arjuna urges Krishna to go as a peace-making envoy to the Kurus and to
    warn Duryodhana of the consequences of rejecting righteous counsel. Krishna agrees
    to go for righteousness and the good of both sides. At an auspicious morning hour,
    Krishna performs purifying and devotional rites, orders his chariot readied with
    weapons, mounts the adorned chariot with Satyaki, and departs amid favorable omens,
    sacred fire, animals, birds, and Rishis. Yudhishthira, the Pandavas, and allied
    kings follow to honor him, and Yudhishthira embraces Krishna before instructing
    him further.
  language: English
  quote_policy: summarized
