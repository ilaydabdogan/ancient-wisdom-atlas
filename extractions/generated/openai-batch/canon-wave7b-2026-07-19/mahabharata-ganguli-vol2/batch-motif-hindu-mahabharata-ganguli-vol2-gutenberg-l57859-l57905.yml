canonical_text:
  quote: ''
  summary: Drona, distressed by admonitions and by reports concerning his son Aswatthaman,
    asks Yudhishthira whether his son is dead because he trusts Yudhishthira's truthfulness.
    Krishna urges Yudhishthira that a falsehood may be justified to save lives, warning
    that Drona could destroy the Pandava army. Bhima explains that he has slain an
    elephant named Aswatthaman and has told Drona that Aswatthaman is dead. Yudhishthira
    then says distinctly that Aswatthaman is dead and indistinctly adds that it was
    the elephant. After this untruth, his chariot, formerly raised above the earth,
    touches the ground. Drona, grieving for his supposed dead son and mindful of the
    Rishis' rebuke, becomes despairing and cannot fight as before.
  language: English
  quote_policy: summarized
