  summary: Amva leaves the city after Salwa rejects her, laments her condition, curses
    or blames herself, Bhishma, her father, Salwa, and her creator, and decides that
    vengeance should fall on Bhishma through austerities or battle. She goes to an
    ascetics' asylum, recounts her abduction and rejection, and asks for a renounced
    forest life and instruction in severe penance. The sage Saikhavatya consoles her
    and promises help with the other Brahmanas.
