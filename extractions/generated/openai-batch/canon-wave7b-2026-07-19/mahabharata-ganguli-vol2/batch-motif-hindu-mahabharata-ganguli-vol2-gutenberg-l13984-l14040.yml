canonical_text:
  quote: ''
  summary: Vaisampayana narrates Krishna's dawn departure toward the city of the Kurus,
    his public and royal reception, ritual hospitality in Dhritarashtra's palace,
    and a subsequent visit to Vidura, who welcomes him, asks about the Pandavas, and
    receives Krishna's account of them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Krishna rises at daybreak, performs morning rites, takes leave of the Bharatas,
    and sets out for the city of the Kurus.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The inhabitants of Vrikasthala bid farewell to Krishna and return to their
    homes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Dhartarashtras, except Duryodhana, go out with Bhishma, Drona, Kripa,
    and others to meet Krishna.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Thousands of citizens come out on vehicles and on foot because they desire
    to behold Krishna.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The city is adorned in Krishna's honor, and the principal streets are decorated
    with jewels and gems.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Citizens line the streets, bend their heads to the ground, and sing eulogies
    as Krishna passes through the city.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
