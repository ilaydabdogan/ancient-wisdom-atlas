  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Krishna worships Dhritarashtra and Bhishma with proper words, then greets
    other kings and named elders according to seniority.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A spacious seat made of gold and set with jewels is present in the chamber,
    and Krishna takes it at Dhritarashtra's request.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Dhritarashtra's priests offer Krishna a cow, honey, curds, and water as part
    of the hospitality rites.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the hospitality rites, Krishna stays for a while among the Kurus, laughing
