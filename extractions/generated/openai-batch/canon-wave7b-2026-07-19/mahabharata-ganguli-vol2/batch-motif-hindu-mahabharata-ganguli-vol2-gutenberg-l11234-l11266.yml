canonical_text:
  quote: ''
  summary: Vaisampayana reports a council scene in which Bhishma rebukes Karna before
    Dhritarashtra, contrasts Karna’s boasts with the past feats of the Pandavas, and
    blames Karna for the coming calamity. Drona then supports Bhishma’s counsel and
    urges peace with the Pandavas before war. Dhritarashtra disregards both advisers
    and questions Sanjaya about the Pandavas, after which the Kauravas lose hope of
    life.
  language: English
