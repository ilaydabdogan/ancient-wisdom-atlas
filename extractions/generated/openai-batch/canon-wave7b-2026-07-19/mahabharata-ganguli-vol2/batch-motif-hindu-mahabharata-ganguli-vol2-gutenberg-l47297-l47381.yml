canonical_text:
  quote: ''
  summary: Dhritarashtra asks Sanjaya to describe the standards of the warriors. Sanjaya
    lists resplendent standards and banners on chariots, many golden or jewel-adorned
    and marked with animals, implements, or sacred images. He then describes the warriors
    taking up bows against Arjuna, who with Krishna as charioteer fights the assembled
    warriors while both sides obscure one another with showers of arrows.
  language: English
  quote_policy: summarized
