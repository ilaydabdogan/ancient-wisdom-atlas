canonical_text:
  quote: selected the forest as her lord
  summary: Narada recounts that Yayati brings Madhavi to a hermitage at the confluence
    of the Ganga and Yamuna for a swayamvara. Before an assembly of many beings and
    sages, Madhavi passes over the assembled bridegrooms, chooses the forest as her
    lord, enters it, and undertakes severe ascetic life resembling that of a deer.
    Later Yayati, after long heavenly enjoyment, becomes proud and mentally disregards
    gods, sages, and humans; Sakra perceives this, the heavenly community fails to
    recognize Yayati, and he is divested of splendour.
  language: English
  quote_policy: quoted
