canonical_text:
  quote: ''
  summary: 'A dreamer reports the sixth through ninth dreams: a jackal urinating in
    a golden bowl, a rope-maker whose rope is eaten by a she-jackal, people pouring
    water into a full pitcher while empty pitchers stand nearby, and a lotus-covered
    pool muddy at the center but clear at the margins. The interpreter says each dream
    will be fulfilled in a future time of social decay, status inversion, household
    waste, royal exploitation, unjust rule, and flight from the center of the realm
    to its borders.'
  language: English
  quote_policy: summarized
