canonical_text:
  quote: ''
  summary: 'A present-frame story explains Sariputta''s refusal ever again to eat
    meal-cakes after he ate a portion set aside for an absent youth. The Master then
    tells a former-birth story: the Bodhisatta was a doctor skilled in curing snakebite.
    A bitten countryman is brought to him; the doctor has the snake caught and orders
    it to suck back its poison. The snake refuses, even when threatened with fire,
    preferring death to taking back what it had once shed. The doctor prevents the
    snake from entering the fire, cures the man with simples and charms, instructs
    the snake not to harm others, and releases it. The Master identifies Sariputta
    as the snake and himself as the doctor.'
  language: English
  quote_policy: summarized
