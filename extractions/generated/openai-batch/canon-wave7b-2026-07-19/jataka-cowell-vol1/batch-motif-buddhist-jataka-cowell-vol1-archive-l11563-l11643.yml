canonical_text:
  quote: ''
  summary: 'The Master interprets a king’s first five dreams as future omens: drought
    and famine in unrighteous times; tiny trees flowering and fruiting as very young
    girls bearing children; cows suckled by day-old calves as elders becoming dependent
    on children; strong oxen replaced by weak steers as wise officials being passed
    over for incapable youths; and a two-mouthed horse eating from both sides as judges
    taking bribes from both parties.'
  language: English
  quote_policy: summarized
