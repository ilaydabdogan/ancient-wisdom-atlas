canonical_text:
  quote: ''
  summary: The passage concludes a dream-interpretation episode in which the Bodhisatta
    reassures a king, rejects animal sacrifice, saves many creatures, and the Master
    identifies the former-birth roles. A note gives comparative references. The passage
    then begins the Illisa-Jataka, introducing a wealthy miser whose hoarding extends
    even to his own craving for a stuffed cake; his wife questions him and offers
    to prepare cakes in progressively smaller quantities, while he resists sharing
    with anyone.
  language: English
  quote_policy: summarized
