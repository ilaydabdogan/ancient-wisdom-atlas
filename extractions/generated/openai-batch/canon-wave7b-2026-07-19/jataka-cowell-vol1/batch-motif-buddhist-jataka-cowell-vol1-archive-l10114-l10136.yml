canonical_text:
  quote: ''
  summary: The passage opens the Mudulakkhana-Jataka frame story. The Master at Jetavana
    tells a story about concupiscence. A young man of Savatthi hears the Master's
    preaching, embraces the Doctrine of the Three Gems, renounces the world for the
    Brother's life, and practices meditation. While on alms round he sees a well-dressed
    woman, gazes at her in violation of higher morality, and passion arises. His joy
    in the Doctrine disappears, his appearance becomes neglected, and fellow Brethren
    take him to the Master, before whom he begins to explain what happened.
  language: English
