canonical_text:
  quote: ''
  summary: In the Dubijaca-Jataka, the Master rebukes an unruly Brother by telling
    a former-birth story. In Benares, the Bodhisatta is a wise acrobat and pupil of
    an acrobat master. The master, drunk and overconfident, attempts to dance through
    five javelins though he knows only the four-javelin dance. The Bodhisatta warns
    him to remove one javelin, but the master ignores the advice, clears four, and
    dies on the fifth. The Bodhisatta states the lesson, performs the funeral rites,
    and the Master identifies the unruly Brother with the former master and himself
    with the pupil.
  language: English
  quote_policy: summarized
