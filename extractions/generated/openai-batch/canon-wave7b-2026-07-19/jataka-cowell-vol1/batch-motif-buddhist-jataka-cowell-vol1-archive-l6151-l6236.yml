canonical_text:
  quote: '"With wings that fly not."'
  summary: The Master and the Brethren encounter a jungle fire in Magadha. The flames
    stop before the place where the Buddha stands, which he explains as the result
    of a former Act of Truth. He then begins a past-life story in which the Bodhisatta
    was a helpless young quail abandoned in its nest as a jungle fire approached,
    and the quail reflects on the efficacy of goodness and truth.
  language: English
  quote_policy: quoted
