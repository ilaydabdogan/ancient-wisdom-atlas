canonical_text:
  quote: ''
  summary: Sakka reveals himself in mid-air, rebukes the miserly Treasurer for hoarding
    wealth and neglecting the poor, threatens divine punishment unless he restores
    almsgiving, and then accepts the Treasurer's vow to be generous. The Treasurer
    practices almsgiving and secures future rebirth in heaven. The Master identifies
    the birth, saying Moggallana was Sakka and had converted the same miserly Treasurer
    before.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Lord High Treasurer trembles and faints when his last hope fails and he
    faces the loss of his beloved riches.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sakka puts forth transcendental powers, rises in the air, and tells the king
    that he is Sakka rather than IllTsa.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: People around IllTsa wipe his face, dash water over him, and he recovers,
    stands, and bows before Sakka, King of Devas.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sakka says the wealth was his, says he is IllTsa's father and IllTsa his son,
    and contrasts his own former generosity with IllTsa's miserliness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sakka says IllTsa burnt the almonry, drove the poor from the gate, hoarded
    riches, and made his store like a demon-haunted pool where no one may drink.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Sakka says rebuilding the almonry and giving to the poor will count as righteousness;
    if IllTsa refuses, Sakka threatens to strip him of wealth, strike his head with
    the thunderbolt of Indra, and cause his death.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: IllTsa promises to be bountiful; Sakka accepts the promise, teaches him the
    Commandments and the Truth, and departs to his own abode.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: IllTsa becomes diligent in almsgiving and other good works, and thereby assures
    later rebirth in heaven.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Master states that Moggallana has converted the miserly Treasurer before
    and identifies Moggallana with Sakka, Ananda with the king, and himself with the
    barber.
  category: speech
  evidence_refs:
  - ev:5
