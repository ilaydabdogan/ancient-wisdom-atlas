canonical_text:
  quote: ''
  summary: An Elder identified as Moggallana uses transcendental powers to transport
    a wealthy treasurer and his wife to Jetavana by relocating the foot of their staircase.
    The couple offers cakes and other food to the Buddha and the Brotherhood; the
    cakes do not diminish and are finally placed in a cave. The couple attains the
    Fruition of the First Path and returns home. The Buddha praises Moggallana's way
    of converting households with a bee simile, then introduces a past-life story
    in which a treasurer named Illisa, under King Brahmadatta of Benares, is described
    as a miser who breaks his family's tradition of generosity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Elder says the Buddha and five hundred Brethren are waiting at Jetavana
    for a meal of cakes and asks the Lord High Treasurer to bring his wife and the
    cakes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Elder says he can transport the Treasurer by transcendental powers by
    keeping the top of the staircase at the Treasurer's house while placing the bottom
    at Jetavana's main gate.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Elder commands the foot of the staircase to be at Jetavana's main gate,
    and the Treasurer and his wife are transported faster than they could descend
    the stairs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Treasurer pours the Water of Donation over the hands of the Brotherhood
    with the Buddha at its head, while his wife places a cake in the Buddha's alms-bowl.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Milk mixed with ghee, honey, and jagghery is offered, and the Buddha and the
    Brotherhood finish their meal.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
