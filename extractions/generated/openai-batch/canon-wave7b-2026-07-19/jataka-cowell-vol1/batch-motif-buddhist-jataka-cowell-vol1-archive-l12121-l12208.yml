    still shows no sign of ending.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The remaining cakes are thrown into a cave near the monastery gateway, where
    a spot called 'The Crock-Cake' is said to be shown.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Treasurer and his wife attain the Fruition of the First Path of Salvation
    and return home by mounting the stairs at the great gate.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Afterward, the Lord High Treasurer spends eighty crores of money solely on
    the Faith taught by the Buddha.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Brethren praise the power of Moggallana, saying he converted a miser to
    charity, brought him with the cakes to Jetavana, set him before the Master, and
    established him in salvation.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Buddha says a Brother converting a household should approach it without
    annoyance or vexation, as a bee takes nectar without harming a flower.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The Buddha says Moggallana had converted the miserly Treasurer in former days
    as well and had taught him how deeds and their effects are linked.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the past story, during Brahmadatta's reign in Benares, a treasurer named
    Illisa is described as wealthy, physically impaired, unconverted, and miserly.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: Illisa's ancestors had been generous for seven generations, but Illisa burned
