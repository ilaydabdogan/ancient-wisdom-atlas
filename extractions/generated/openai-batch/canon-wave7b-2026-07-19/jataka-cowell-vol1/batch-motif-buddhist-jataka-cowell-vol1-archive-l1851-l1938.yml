canonical_text:
  quote: ''
  summary: The Bodhisatta is born into a trader's family and leads a caravan of 500
    carts across a dangerous sandy wilderness by night. After the caravan discards
    wood and water near the expected end of the crossing, the desert-pilot falls asleep
    and the oxen turn back to the previous camp. With the caravan despairing, the
    Bodhisatta finds kusa-grass, infers underground water, orders digging, and hears
    water beneath a rock. A serving-lad breaks the rock with a hammer, water rises,
    and the caravan is saved. The Buddha later gives a stanza connecting the digging
    to perseverance until the heart finds Peace, preaches the Four Truths, and identifies
    the serving-lad with the fainthearted Brother, the caravan people with the Buddha's
    followers, and himself with the leader.
  language: English
  quote_policy: summarized
