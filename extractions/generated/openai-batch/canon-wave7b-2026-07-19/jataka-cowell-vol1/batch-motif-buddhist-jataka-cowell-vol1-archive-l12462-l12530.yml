canonical_text:
  quote: ''
  summary: At Jetavana, the Master addresses a case of a monk who falsely boasts of
    noble descent and wealth. After another Brother exposes the pretension, the Master
    says the monk also boasted and deluded people in the past. In the past story,
    while Brahmadatta reigns at Benares, the Bodhisatta is born as a brahmin, studies
    at Takkasila, becomes known as Little Bowman, and seeks practical experience.
    Because he is a crooked little dwarf and expects kings to scorn him, he recruits
    the huge weaver Bhimasena to serve as his public front. Bhimasena claims to be
    an unmatched archer before the king, while the Bodhisatta acts as his page and
    performs the work for him. A tiger then blocks a high-road in Kasi and kills many
    people, and the king asks Bhimasena whether he can catch it.
  language: English
  quote_policy: summarized
