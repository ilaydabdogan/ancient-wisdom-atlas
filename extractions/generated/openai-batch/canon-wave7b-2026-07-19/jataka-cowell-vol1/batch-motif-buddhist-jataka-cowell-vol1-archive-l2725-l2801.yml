canonical_text:
  quote: |-
    Those only 'godlike' call who shrink from sin.
    The white-souled tranquil votaries of Good.
  summary: A king, fearing danger to two sons after a queen seeks the kingdom for
    Prince Sun, sends the two sons into the forest; Prince Sun follows them. In the
    Himalayas, the Bodhisatta sends Prince Sun and then Prince Moon to a pool. A water-sprite,
    empowered by Vessavana to seize entrants who do not know what is truly godlike,
    imprisons both princes after wrong answers. The Bodhisatta recognizes the pool
    as a spirit-domain, refuses to enter the water, confronts the water-sprite in
    its forester disguise, receives hospitality, and teaches that the truly godlike
    are those who shrink from sin and are devoted to good.
  language: English
  quote_policy: quoted
