canonical_text:
  quote: ''
  summary: A horse-dealer, acting on the Bodhisatta's advice, bribes a foolish valuer
    and brings him before the king. The valuer states that five hundred horses are
    worth one measure of rice and that the measure of rice is worth all Benares and
    its suburbs. The ministers laugh at the absurd valuation, the Bodhisatta recites
    a stanza exposing it, and the shamed king dismisses the fool and restores the
    Bodhisatta to office. The Master then identifies Udayi the Dullard as the former
    foolish valuer and himself as the wise valuer.
  language: English
  quote_policy: summarized
