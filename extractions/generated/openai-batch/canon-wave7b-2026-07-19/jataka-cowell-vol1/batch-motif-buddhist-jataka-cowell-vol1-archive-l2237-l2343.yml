canonical_text:
  quote: "“Impermanent indeed are all compounded things!”"
  summary: Little Wayman handles a clean cloth while repeating a phrase about removing
    impurity. When the cloth becomes soiled, he reflects on impermanence and attains
    illumination. The Master sends an apparition to teach that true impurity is lust,
    wrath, and delusion. A past-life episode repeats the image of a spotless cloth
    stained by the body. Jivaka offers donation water, and Little Wayman demonstrates
    his attainment by filling the mango-grove with a thousand forms of Brethren who
    vanish when the true Little Wayman is identified.
  language: English
  quote_policy: quoted
