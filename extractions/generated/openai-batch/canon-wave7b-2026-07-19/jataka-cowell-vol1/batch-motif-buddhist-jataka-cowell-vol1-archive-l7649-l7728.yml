canonical_text:
  quote: ''
  summary: The Master tells a headstrong Brother that in a former birth, as the hermit
    called Bamboo's Father, he ignored the Bodhisatta's warning not to keep a poisonous
    viper. After being left unfed in a bamboo joint, the viper bit and killed him.
    The Bodhisatta uses the event to exhort the hermits against disregarding wise
    counsel, and the Master identifies the former and present figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Jetavana, the Master addresses a Brother who admits being headstrong and
    introduces a former-life story in which headstrong refusal to follow advice ended
    in death by snakebite.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the past, the Bodhisatta is born in a wealthy family in Kasi, renounces
    passion, goes to the Himalayas, becomes a hermit, attains higher knowledge and
    meditative attainments, and teaches five hundred hermits.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A young poisonous viper comes to one hermit's hut; the hermit becomes fond
    of it as if it were his child, houses it in a bamboo joint, and the viper is named
    Bamboo while the hermit is called Bamboo's Father.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Bodhisatta warns the hermit that a viper cannot be trusted and that this
    snake will cost him his life.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The hermit refuses to give up the viper, saying it is dear to him as a pupil
    to a teacher and that he cannot live without it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The hermits go fruit-gathering for two or three days; Bamboo's Father leaves
    the viper behind in its bamboo enclosure, then returns, opens the cane, and stretches
    out his hand to feed it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The viper, angry from its long fast, bites the hermit's outstretched hand,
    kills him immediately, and escapes into the forest.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The brethren report the death to the Bodhisatta, who orders the body burned
    and recites a stanza saying that a headstrong person who ignores friendly counsel
    will be brought to nought like Bamboo's Father.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Bodhisatta exhorts his followers, develops the four Noble States, and
    is reborn in the Brahma Realm at death.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Master identifies the headstrong Brother as Bamboo's Father, his disciples
