canonical_text:
  quote: ''
  summary: 'The Master instructs a young Brother to guard the three avenues of voice,
    mind, and body, reducing the whole of morality to three rules. The Brother understands,
    keeps them, gains Insight, and attains Arahatship. The Master then tells a past-life
    story: as a farmer, the Bodhisatta discovered a huge buried bar of gold while
    ploughing. Unable to lift it whole, he divided it into four portions assigned
    to livelihood, burial as treasure, trade, and charity, then carried it home. The
    Master applies the lesson and identifies himself as the man who found the gold.'
  language: English
  quote_policy: summarized
