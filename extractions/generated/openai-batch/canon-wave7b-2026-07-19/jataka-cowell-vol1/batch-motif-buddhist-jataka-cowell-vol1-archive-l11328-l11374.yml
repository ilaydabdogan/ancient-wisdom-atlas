canonical_text:
  quote: ''
  summary: In a former birth at a pond in Kosala/Savatthi, the Bodhisatta is born
    as a fish during a drought. As fish and tortoises are exposed in the mud and eaten
    by birds, he resolves to save his kin by a solemn Profession of Goodness. He emerges
    from the mud, addresses Pajjunna, King of Devas, declares that he has never eaten
    fish or killed any creature, and calls for rain by the truth of this protestation.
    Heavy rain falls and many are saved from fear of death. The framing passage identifies
    the former fish with the Master, Pajjunna with Ananda, and the fishes with the
    Buddha's disciples; a note refers to Cariya-pitaka.
  language: English
  quote_policy: summarized
