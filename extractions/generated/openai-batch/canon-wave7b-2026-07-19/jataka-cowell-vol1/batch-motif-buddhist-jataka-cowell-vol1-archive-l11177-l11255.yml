canonical_text:
  quote: "“United, forest-like, should kinsfolk stand; / The storm o'erthrows the
    solitary tree.”"
  summary: The Master addresses kinsfolk involved in a water quarrel and tells a past-life
    story in which the Bodhisatta, born as a tree-fairy in a Himalayan Sal-forest,
    advises other tree-fairies to live together. Fairies who settle in isolated giant
    trees near human settlements lose their dwellings in a tempest, while the interlaced
    Sal-forest withstands the storm. The lesson is that kinsfolk should live in concord
    and unity.
  language: English
  quote_policy: quoted
