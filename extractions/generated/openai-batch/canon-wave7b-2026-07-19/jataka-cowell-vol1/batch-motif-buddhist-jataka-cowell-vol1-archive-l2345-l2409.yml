canonical_text:
  quote: '"Any decent young fellow with his wits about him has only to pick that mouse
    up, and he might start a business and keep a wife."'
  summary: 'The brethren praise the Buddha for enabling Little Wayman, whom Great
    Wayman had expelled as dull, to attain Arahatship and master sacred texts. The
    Buddha enters the Hall of Truth, asks about their discussion, and says that Little
    Wayman has risen through him in the present and formerly rose to wealth through
    him. He then recounts a past life in Benares: the Bodhisatta, as Treasurer Little,
    reads signs and remarks that a dead mouse could start a prudent young man in business.
    A poor young man follows the hint, sells the mouse for a farthing, uses the proceeds
    to provide molasses and water to flower-gatherers, receives flowers and plants
    in return, and accumulates eight pennies.'
  language: English
  quote_policy: quoted
