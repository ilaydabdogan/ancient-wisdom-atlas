canonical_text:
  quote: "“Let me be given nothing beyond what I formerly gave him.”"
  summary: A king hears that a millionaire had once given half his possessions to
    Piliya, questions Piliya about his failure to show reciprocal hospitality, and
    orders restitution. The Bodhisatta refuses to take more than what he had formerly
    given, regains his own wealth, returns to Rajagaha, lives charitably, and is later
    identified by the Master as the former-birth Millionaire, while Devadatta is identified
    with Piliya.
  language: English
  quote_policy: quoted
