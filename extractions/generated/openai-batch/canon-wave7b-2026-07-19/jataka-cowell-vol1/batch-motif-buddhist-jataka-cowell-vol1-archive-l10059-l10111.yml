    is.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The present lay-brother's wife also gives up misconduct after hearing that
    the Master knows what she is.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the Master preaches the Truths, the lay-brother wins the Fruit of the
