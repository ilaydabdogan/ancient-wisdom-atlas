canonical_text:
  quote: ''
  summary: At Jetavana, the Master responds to a lay-brother upset by his wife's misconduct
    by recounting a former birth in Benares. In that earlier story, the Bodhisatta
    as a renowned teacher counsels a pupil not to be angered by his wife's unfaithfulness,
    using a misogynistic simile that compares women to public places. The pupil becomes
    indifferent, the wife gives up misconduct, the present wife likewise reforms,
    the lay-brother attains the Fruit of the First Path, and the Master identifies
    the figures' former-birth connections.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Jetavana, a lay-brother reports that he had been absent for seven or eight
    days because he was upset after discovering his wife's misconduct.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master says that the wise and good had long ago taught the lay-brother
    not to be angered, but that rebirth had hidden this from him, and then tells a
    story of the past.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the past story, Brahmadatta reigns in Benares, and the Bodhisatta is a
    teacher of world-wide reputation.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: A pupil of the Bodhisatta is absent for some days after finding his wife unfaithful,
    and he explains this to his teacher.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The teacher tells the pupil that wise men are not angered at women's perceived
    frailty, and recites a stanza comparing womankind to highways, rivers, courtyards,
    hostelries, and taverns.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the instruction, the pupil becomes indifferent to what women do, and
