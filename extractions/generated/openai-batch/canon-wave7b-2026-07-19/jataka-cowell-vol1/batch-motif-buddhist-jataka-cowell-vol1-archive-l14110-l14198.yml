canonical_text:
  quote: ''
  summary: A Bodhisatta is warned that ogresses on the road to Takkasila captivate
    the five senses and destroy those who yield. He receives charmed thread and sand,
    sets out with five companions, and each companion is lured away by one sense-temptation
    and eaten. One ogress pursues the Bodhisatta, falsely claims to be his wife, simulates
    pregnancy and motherhood, and later stands at a Rest-house threshold where she
    cannot enter because of his power. The king of Takkasila sees her beauty and is
    captivated.
  language: English
  quote_policy: summarized
