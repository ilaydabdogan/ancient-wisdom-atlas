canonical_text:
  quote: ''
  summary: 'The passage describes a public inquiry ordered by the Master to determine
    whether a young Sister conceived before or after joining the Order. Visakha determines
    that conception preceded ordination, and Upali proclaims the Sister innocent.
    The Sister later gives birth to Kassapa, who is taken into royal care, raised
    as a prince, ordained under the Master, and eventually attains Arahatship; his
    mother also attains the Supreme Fruit. The Brethren praise the Buddha as their
    savior, and the Buddha says he had been their refuge in a past birth. The passage
    then begins the past-life story: under King Brahmadatta in Benares, the Bodhisatta
    is born as a splendid golden deer, King Banyan Deer, leading five hundred deer;
    nearby lives another golden deer leader, Branch Deer, with another herd of five
    hundred.'
  language: English
  quote_policy: summarized
