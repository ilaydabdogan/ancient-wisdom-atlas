canonical_text:
  quote: ''
  summary: A present-time thief returns a jewel by dropping it into water, and Ananda
    is praised for recovering it without troubling many people. The Master says that
    wise persons in the past also found stolen property and spared others by showing
    it had passed into the hands of animals. In the past tale, King Brahmadatta goes
    to a royal tank with his harem; a female monkey steals the queen's pearl necklace
    from the guarded boxes, hides it in a tree, and a slave mistakenly cries that
    a man stole it. Guards seize and beat a fleeing rustic, who falsely confesses
    and implicates others. The Bodhisatta, a royal minister, begins reasoning that
    the theft happened inside the guarded grounds while the rustic was outside.
  language: English
  quote_policy: summarized
