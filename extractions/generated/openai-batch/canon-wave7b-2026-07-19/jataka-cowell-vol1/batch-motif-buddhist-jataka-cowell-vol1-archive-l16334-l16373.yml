canonical_text:
  quote: ''
  summary: The Great Being asks the merchant's daughter about her husband and, after
    learning that he finds fault with food, teaches her a verse to recite. After the
    Bodhisatta leaves for Benares, Katahaka grows proud and grumbles at dinner. His
    wife recites the taught stanza, naming him; he thinks his story has been revealed
    and thereafter behaves humbly. The Master closes by identifying the present bumptious
    Brother with Katahaka and himself with the Treasurer of Benares.
  language: English
  quote_policy: summarized
