canonical_text:
  quote: Sense-lacking friends are worse than foes with sense;
  summary: The Master explains that foolish villagers who tried to fight mosquitoes
    injured one another, then tells a former-birth story in which a carpenter's son,
    trying to kill a mosquito on his father's head, kills his father with an axe.
    The Bodhisatta, present as a trader, draws a moral about foolish friends. The
    passage then begins the Rohini-Jataka, where Rohini kills her mother with a pestle
    while trying to kill flies.
  language: English
  quote_policy: quoted
