  evidence_refs:
  - ev:5
- id: obs:7
  text: A bald, grey-haired carpenter is planing wood when a mosquito settles on his
    scalp and stings him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The carpenter asks his son to drive away the mosquito; the son tells his father
