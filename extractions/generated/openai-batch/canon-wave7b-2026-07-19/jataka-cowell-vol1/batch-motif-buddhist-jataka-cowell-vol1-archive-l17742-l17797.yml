canonical_text:
  quote: "“Thy tightening grip upon thy club doth show / Thy rank imposture—thou'rt
    no corpse, I trow.”"
  summary: The Master tells a past-birth story in which the Bodhisatta, born as a
    jackal king in a charnel-grove, detects a rogue who is pretending to be a corpse
    in order to kill a jackal for meat. The Bodhisatta exposes the deception by tugging
    at the rogue's club and noticing the tightened grip. The rogue attacks and misses,
    then leaves empty-handed. The Master identifies Devadatta as the rogue and himself
    as the jackal king.
  language: English
  quote_policy: quoted
