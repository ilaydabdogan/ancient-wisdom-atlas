canonical_text:
  quote: ''
  summary: A corrupt minister or headman secretly arranges for robbers to plunder
    an unprotected border-village while he marches the defenders away, then returns
    pretending ignorance. His guilt is exposed and the king punishes him. The Master
    tells a former-birth parallel in which the Bodhisatta, living in the same sort
    of village as a trader, denounces the same misconduct in verse; the offender is
    again detected and punished, and the Master identifies the present headman with
    the past headman.
  language: English
  quote_policy: summarized
