canonical_text:
  quote: Go not too far, but learn excess to shun; / For over-blowing lost what blowing
    won.
  summary: The Master tells of a former birth in which the Bodhisatta was a conch-blower.
    After earning money at a festival with his father, he warns his father not to
    keep blowing the conch while passing through a robber-infested forest. The father
    ignores the warning, the robbers return and plunder them, and the Bodhisatta states
    a verse about avoiding excess.
  language: English
  quote_policy: quoted
