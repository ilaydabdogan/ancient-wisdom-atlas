canonical_text:
  quote: ''
  summary: 'The Master presents an allegory of a man carrying a brimful pot of oil
    past the Belle of the Land while a swordsman threatens death for spilling a drop,
    and interprets it as a lesson in careful mindfulness concerning the body. He then
    introduces a past story: the Bodhisatta, youngest of King Brahmadatta''s hundred
    sons, serves Pacceka Buddhas and asks about his royal future. They foretell that
    he will not rule in Benares but can become king in Takkasila if he reaches it
    in seven days, though the forest route is dangerous because ogres and ogresses
    lure travellers with magical houses, luxury, beauty, food, and drink, then kill
    and eat those who yield.'
  language: English
  quote_policy: summarized
