- id: obs:2
  text: In the allegory, a man with a drawn sword follows the oil-bearer and will
    cut off his head if he spills a single drop.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Master says the brimming oil-pot typifies a collected state of mind concerning
    the body and teaches that such mindfulness should be practised and perfected.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Brethren say it was hard for the man not to gaze at the Belle of the Land,
    and the Master replies that the sword-threat made that task easy.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Master says wise and good people of the past had the harder task of preserving
    mindfulness, curbing passions, not looking at celestial beauty, and passing on
    to win a kingdom.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the past story, Brahmadatta reigns in Benares, and the Bodhisatta is the
