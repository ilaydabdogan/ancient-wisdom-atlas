canonical_text:
  quote: ''
  summary: The Master addresses a monk troubled by attachment to his former wife and
    tells a past-life story. In the past, the Bodhisatta is a family-priest in Benares.
    A male fish, following his wife, is caught in a fisherman's net after she escapes.
    The fishermen prepare to roast him, but the fish laments chiefly that his wife
    may think he has gone with another. The priest, who understands animal speech,
    hears him, obtains him from the fishermen, warns him against slavery to passion,
    and releases him into the water. The Master then identifies the former wife with
    the female fish, the monk with the male fish, and himself with the family-priest.
  language: English
  quote_policy: summarized
