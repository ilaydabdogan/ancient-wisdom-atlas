canonical_text:
  quote: ''
  summary: The passage explains that a seven-day blockade led to a seven-year stay
    in the womb and a seven-day birth. Prior prayers and gifts before the Buddhas
    Padumuttara and Vipassi are said to have produced the merit by which Arahatship
    was won. Suppavasa's message urging the blockade caused her seven-year pregnancy
    and seven-day travail. The Master recites a moral verse and identifies the former
    birth roles of Sivali, Suppavasa, and himself.
  language: English
