canonical_text:
  quote: ''
  summary: The Master tells a Jataka about Anatha-pindika's safe return after seeing
    robbers on the road. In the past, the Bodhisatta, then a rich merchant of Benares,
    also saw robbers while returning home, urged his oxen onward, reached safety,
    and expressed gratitude with a stanza warning the wise not to loiter among enemies.
    The Master identifies himself as that former merchant.
