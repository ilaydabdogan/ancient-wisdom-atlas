canonical_text:
  quote: ''
  summary: 'The excerpt first concludes the Mittavinda-Jataka: the Bodhisatta speaks
    of Mittavindaka''s loss of jeweled island palaces and his torment under flinty
    headgear until his sin is spent, then the Master identifies the present self-willed
    Brother with Mittavindaka and himself with the King of the Devas. The excerpt
    then gives the Kalakanni-Jataka: Anatha-pindika refuses to dismiss an old friend
    named Curse despite warnings about the ill-omened name; while Anatha-pindika is
    away, Curse creates noise as though a large household guard were present, causing
    robbers to flee. The Master says a similar event happened in the past, when the
    Bodhisatta as treasurer in Benares likewise defended a friend named Curse and
    recited a stanza on friendship.'
  language: English
  quote_policy: summarized
