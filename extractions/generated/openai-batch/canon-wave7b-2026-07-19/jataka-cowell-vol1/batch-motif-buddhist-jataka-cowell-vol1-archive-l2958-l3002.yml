canonical_text:
  quote: Their heart's desire they reap, who hurry not; Know, Gamani, ripe excellence
    is thine.
  summary: An editorial note cites comparisons for a Jataka at the boundary of the
    excerpt. In No. 8, the Gamani-Jataka, the Master at Jetavana addresses a Brother
    who had given up perseverance. The text says the full introductory and past stories
    are given elsewhere in connection with the Samvara-jataka, with the same incidents
    but different stanzas. Prince Gamani, the youngest of a hundred brothers, follows
    the Bodhisatta's counsel, becomes king under the white canopy, and attributes
    his glory to his teacher. His brothers depart, he rules righteously, and both
    he and the Bodhisatta die according to their deserts. After the Master's lesson,
    the faint-hearted Brother wins Arahatship.
