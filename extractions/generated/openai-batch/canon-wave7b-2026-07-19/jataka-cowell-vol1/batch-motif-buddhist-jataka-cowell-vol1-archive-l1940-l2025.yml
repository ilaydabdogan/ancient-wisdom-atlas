canonical_text:
  quote: ''
  summary: The Blessed One addresses a Brother who has given up perseverance by recounting
    a former-birth story. In the kingdom of Seri, the Bodhisatta and a greedy hawker,
    both dealers in pots and pans, enter Andhapura and divide the streets for hawking.
    A poor grandmother and girl possess a dirt-grimed golden bowl without knowing
    its value. The greedy hawker discovers its gold, falsely devalues it, and leaves
    hoping to obtain it for nothing. The Bodhisatta later recognizes and declares
    its high value, gives the women all his available money and goods except necessary
    items, takes the bowl, and departs by boat. When the greedy hawker returns, the
    old woman tells him the bowl has been taken by an upright hawker.
  language: English
  quote_policy: summarized
