canonical_text:
  quote: ''
  summary: In the PUPPHARATTA-JATAKA frame, a passion-tossed monk longs for his former
    wife. The Master says that in a past life this same woman led him to be impaled
    and reborn in hell, then narrates the past story. In Benares during the Kattika
    festival, a poor man's wife demands safflower-coloured festival cloths. At her
    urging he breaks into the king's guarded conservatories at night to obtain safflowers,
    is caught, and is ordered by the king to be impaled alive. Even while crows peck
    out his eyes, he grieves not for his pain but because his wife will not attend
    the festival in the desired red garments; he dies and is reborn in hell. The Master
    identifies the present husband and wife with the past pair and himself with the
    Spirit of the Air. The excerpt then begins the SIGALA-JATAKA, where five hundred
    newly ordained rich young men are seized by lust at night, and the Master perceives
    their condition and resolves to teach them.
  language: English
  quote_policy: summarized
