canonical_text:
  quote: ''
  summary: A treasurer named Illisa develops a craving for spirits but, because he
    fears sharing expense, arranges to drink alone in a remote riverside thicket.
    His father, reborn as Sakka because of charity and good works, observes the son's
    stopped bounty and miserliness, descends to earth in Illisa's likeness, obtains
    the king's permission to give away the treasure, and opens Illisa's stores to
    the public. A countryman departs with oxen, carriage, and valuables, praising
    Illisa as donor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Treasurer sees a weary yokel drinking rank spirits from a jar with dried
    fish as relish.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sight makes the Treasurer thirsty for spirits, but he suppresses the desire
    because he thinks others will want to drink with him at ruinous expense.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: As he suppresses the desire, the Treasurer becomes yellow, sunken, and visibly
    veined, then lies on his bed while his wife asks what is wrong.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Treasurer rejects brewing liquor in the house and sends a slave with a
    single penny to buy a jar, which is placed in a remote thicket by the riverside
    so he can drink alone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Treasurer's father has been reborn as Sakka in the Realm of Devas because
    of charity and other good works.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Sakka becomes aware that the family bounty has stopped and that his son has
    burned the almonry, driven poor people from the gates, and gone to drink alone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Sakka resolves to make his son see that deeds have consequences, to convert
    him, and to make him charitable and worthy of rebirth in the Realm of Devas.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: Sakka comes down to earth and takes on the semblance of Illisa, including
    the latter's lameness, crookback, and squint.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: In Illisa's likeness, Sakka goes to the king and offers eighty crores of treasure
    for the royal treasury; when the king declines, he says he will give it away.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The household servants cannot tell that the disguised Sakka is not their real
    master.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The disguised Sakka orders the porter to cudgel and expel anyone resembling
    him who claims to be master of the house.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: When the disguised Sakka proposes bounty, Illisa's wife, children, and servants
    think he must have been drinking because he is unusually generous.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: A crier is sent to proclaim by drum that anyone wanting valuables should come
    to Illisa's house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The treasure-chambers are opened, and the crowd takes stored wealth away in
    baskets, sacks, bags, and vessels.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: A countryman loads Illisa's oxen and carriage with the seven things of price,
    leaves the city, and praises Illisa as the source of the gift.
  category: action
  evidence_refs:
  - ev:7
