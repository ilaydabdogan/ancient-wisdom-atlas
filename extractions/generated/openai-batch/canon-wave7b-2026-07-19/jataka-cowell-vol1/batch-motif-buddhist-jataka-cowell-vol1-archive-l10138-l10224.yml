canonical_text:
  quote: '"Sire, my heart is fettered by lust; that is my sole ailment."'
  summary: The Master tells a past-life story to explain how passion can disturb even
    advanced ascetics. The Bodhisatta, once a brahmin ascetic with higher knowledges,
    lives in the Himalayas and later in the king's pleasaunce at Benares. After the
    king leaves, Queen Gentle-heart prepares to serve him. When the ascetic enters
    by air, her dress slips; he gazes at her beauty, loses insight, and lies for seven
    days consumed by desire. The returning king learns the cause and gives the queen
    to him, privately asking her to save the holy man.
  language: English
  quote_policy: quoted
