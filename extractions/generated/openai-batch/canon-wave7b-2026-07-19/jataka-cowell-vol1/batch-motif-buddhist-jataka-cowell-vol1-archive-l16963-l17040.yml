canonical_text:
  quote: ''
  summary: The Master recalls the failure of Mara's daughters to seduce him and explains
    that in a former birth, as a prince seeking wisdom, he likewise avoided gazing
    lustfully on dangerous divine loveliness. In the past story, the Bodhisatta becomes
    king, sits enthroned amid royal splendor and entertainers, reflects that he would
    have perished if he had yielded to ogresses, and attributes his kingdom to heeding
    the counsels of Pacceka Buddhas. He then rules righteously and is identified by
    the Master as his own former birth.
  language: English
  quote_policy: summarized
