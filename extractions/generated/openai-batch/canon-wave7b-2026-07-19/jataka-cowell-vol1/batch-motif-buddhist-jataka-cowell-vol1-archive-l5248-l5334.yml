canonical_text:
  quote: Speak only words of kindness, never words Unkind.
  summary: The Master rebukes the Six Brethren for abusive speech by telling a past-life
    story. The Bodhisatta, born as the bull Nandi-Visala, is raised kindly by a brahmin
    and offers to earn him money through a wager that he can draw one hundred loaded
    carts. When the brahmin calls him a rascal, the bull refuses to move and the brahmin
    loses. After the bull explains the fault, the brahmin repeats the wager using
    respectful words, and the bull draws the carts and wins wealth for him.
  language: English
  quote_policy: quoted
