canonical_text:
  quote: '"The greed-denouncing bird, to greed a prey"'
  summary: A greedy Sister warns other Sisters away from a profitable alms district
    so she can keep the food for herself, then is injured there by a ram. The Master
    tells a former-birth story in which a greedy bird similarly warns other birds
    away from a grain-scattered highway, ignores the danger herself, and is killed
    by a carriage wheel. The Sister is identified with the past bird, and the Bodhisatta
    with the King of the birds.
  language: English
  quote_policy: quoted
