canonical_text:
  quote: Ingratitude lacks more, the more it gets; Not all the world can glut its
    appetite.
  summary: An ungrateful man mutilates the Bodhisatta elephant by removing the stumps
    of his tusks. After the man leaves, the earth opens, flames from Hell carry him
    away, and a Tree-fairy recites a teaching on ingratitude. The passage closes with
    the Bodhisatta's death and the Master's identification of the former-birth figures.
  language: English
