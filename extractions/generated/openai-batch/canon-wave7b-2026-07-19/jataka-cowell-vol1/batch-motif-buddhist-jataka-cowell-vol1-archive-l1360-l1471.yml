canonical_text:
  quote: ''
  summary: A group associated with Anatha-pindika hears the Buddha preach, takes refuge
    in him, then relapses to other doctrines when he leaves. On his return, the Buddha
    questions them, teaches the superiority of the Three Gems as refuge, cites sacred
    texts on avoidance of suffering states and deva rebirth, contrasts true refuge
    with refuges such as mountains and forests, and commends meditation on the Buddha,
    Truth, and Brotherhood.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The visitors salute the Buddha, sit near Anatha-pindika, and gaze at the Buddha's
    countenance, marks, light, and glory.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Buddha preaches the Truth in a discourse described through images of thunder,
    lion-roar, storm-cloud, celestial river, jewels, and an eightfold-perfect voice.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: After hearing the discourse, the group is converted, abandons the doctrines
    in which it had taken refuge, and takes refuge in the Buddha.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After conversion, the group accompanies Anatha-pindika to the monastery with
    perfumes and garlands, practices charity, keeps commandments, and observes the
    weekly fast-day.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the Buddha goes from Savatthi back to Rajagaha, the group abandons its
    new faith and returns to the other doctrines as refuge.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After seven or eight months, the Buddha returns to Jetavana, and Anatha-pindika
    brings the friends to him and reports their relapse.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Buddha asks whether the disciples have forsaken the Three Refuges for
    other doctrines, and they confess that they have.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Buddha states that nowhere between hell below, the highest heaven above,
    and infinite worlds to the sides is there an equal or superior to a Buddha in
    virtuous excellences.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Buddha teaches that male or female disciples who seek refuge in the Three
    Gems are not reborn into hell or similar suffering states, but pass to the Realm
    of Devas and receive great glory.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The cited sacred texts say that those who find refuge in the Buddha, Doctrine,
    and Order do not pass to suffering states, receive a Deva-form after death, and
    that people seek many refuges including mountain peak and forest solitude.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Buddha teaches that meditation on the Buddha, Truth, and Brotherhood gives
    entry to and fruition of the First through Fourth Paths to Bliss.
  category: speech
  evidence_refs:
  - ev:9
