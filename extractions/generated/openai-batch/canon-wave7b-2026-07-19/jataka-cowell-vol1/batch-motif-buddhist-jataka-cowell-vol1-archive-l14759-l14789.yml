canonical_text:
  quote: ''
  summary: A Jataka frame story says the Master at Jetavana tells of an unruly Brother.
    In a past setting associated with Buddha Kassapa, a damned man wearing a tormenting
    circlet asks the Bodhisatta what sin he committed. The Bodhisatta explains his
    evil deeds and recites a verse describing insatiable greed increasing from four
    to eight, sixteen, and thirty-two, ending in the misery of the circlet. The Bodhisatta
    returns to the Realm of Devas, while the man remains in hell until his sin is
    purged and then goes on according to his deserts. The Master identifies the unruly
    Brother as Mittavindaka and himself as the Deva.
  language: English
  quote_policy: summarized
