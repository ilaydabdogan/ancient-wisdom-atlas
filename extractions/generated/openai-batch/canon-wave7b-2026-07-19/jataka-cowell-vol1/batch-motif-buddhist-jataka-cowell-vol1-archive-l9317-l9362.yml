canonical_text:
  quote: Go not too far, but learn excess to shun
  summary: The Master tells a self-willed Brother a former-birth story. The Bodhisatta,
    born as a drummer, goes with his son to Benares, earns money by drumming at a
    festival, and returns through a forest infested by robbers. The father advises
    the son to drum only occasionally, but the son drums continuously. Robbers first
    flee, then return when they realize the sound is not a lordly procession; they
    beat and rob the pair. The Bodhisatta states that excessive drumming lost what
    drumming had won. The Master identifies the Brother as the former son and himself
    as the father.
  language: English
  quote_policy: quoted
