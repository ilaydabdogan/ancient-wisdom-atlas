canonical_text:
  quote: ''
  summary: The passage opens the Surapana-Jataka. In the present frame, local people
    warn the Buddha about a dangerous Naga at Mango Ferry. Elder Sagata confronts
    the Naga with smoke and flames, masters it, and establishes it in Buddhist refuges
    and commandments. After news spreads, townsfolk give Sagata clear white spirit
    at the prompting of followers of the Wicked Six. Sagata becomes drunk, loses his
    composure and respect before the Buddha, and the Buddha uses the incident to declare
    drinking intoxicants an offence. The monks discuss the danger of spirits, and
    the Buddha introduces a past-life story in which renunciants likewise lost their
    senses. The past story begins with the Bodhisatta as a Himalayan hermit teacher
    with five hundred pupils.
  language: English
  quote_policy: summarized
