canonical_text:
  quote: ''
  summary: 'A Naked-ascetic, offended because a family fixed a wedding day before
    consulting him, declares the stars unfavorable. The marriage party stays away
    and the bride is given to another. The Master says the same pattern occurred in
    a past birth: an ascetic similarly prevented a wedding by invoking unfavorable
    stars, after which a wise man rejected reliance on lucky days and emphasized practical
    opportunity. The Master identifies himself as that wise man.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the present-frame story, a country gentleman near Savatthi arranged for
    his son to marry a Savatthi lady, fixed a day to fetch the bride, and then consulted
    a Naked-ascetic about whether the stars were favorable.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Naked-ascetic was indignant at not being consulted first and answered
    that the stars were unfavorable, the nuptials should not be held that day, and
    misfortune would result if they were held.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Trusting the ascetic, the country family did not go for the bride on the appointed
    day.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Savatthi bride's side, having prepared for the wedding and seeing that
    the other party did not come, married the girl to someone else.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the country party came the next day, the Savatthi people rebuked them,
    a quarrel began, and the country party returned home without the bride.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Master told the Brethren that this ascetic had previously thwarted the
    same family's festivities out of pique.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the past story, set when Brahmadatta reigned in Benares, townsfolk had
    arranged to marry a country-girl and then asked their family ascetic whether the
    stars were propitious.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The past-story ascetic, piqued because he had not been consulted before the
    day was fixed, declared the stars unfavorable and warned of grave misfortune,
    so the townsfolk stayed home.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the town party failed to arrive in the past story, the country folk married
    the girl to someone else.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A wise man heard the dispute, questioned the importance of the stars, and
    recited a stanza saying that a fool may watch for lucky days while luck is missed.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: At the end, the Master identifies the ascetic as the same ascetic in both
    stories, the families as the same, and himself as the wise and good man who spoke
    the stanza.
  category: relationship
  evidence_refs:
  - ev:8
