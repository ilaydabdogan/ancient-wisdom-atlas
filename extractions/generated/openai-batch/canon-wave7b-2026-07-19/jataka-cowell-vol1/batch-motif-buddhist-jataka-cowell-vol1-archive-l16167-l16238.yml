canonical_text:
  quote: '"Toil on, my brother; still in hope stand fast"'
  summary: At Jetavana, the Master tells of a diligent Brother whose goodness benefits
    the community. In a former birth during a Himalayan drought, one hermit made a
    trough from a tree and gave scarce water to thirsty animals, neglecting his own
    food. The animals repaid him by bringing fruit, enough to feed five hundred hermits.
    The Bodhisatta praised steadfast right-doing, and the Master identified the present
    Brother with the former good hermit.
  language: English
  quote_policy: quoted
