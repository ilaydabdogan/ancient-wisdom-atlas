canonical_text:
  quote: ''
  summary: A superstitious wealthy brahmin in Rajagaha regards a mouse-gnawed suit
    of clothes as accursed and sends his son to discard it in a charnel-ground without
    touching it. The Master, knowing father and son are fit for salvation, goes there
    in the guise of a hunter, accepts the discarded clothes despite warnings, and
    later explains that renunciants are content with cast-off rags. He then introduces
    a story of the past involving a Bodhisatta hermit and a righteous King of Magadha.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The frame story is told at the Bamboo-grove about a Rajagaha brahmin skilled
    in cloth prognostications, superstitious, wealthy, holding false views, and not
    believing in the Three Gems.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A female mouse gnaws a suit of the brahmin's clothes that had been lying in
    a chest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The brahmin concludes that the gnawed clothes will bring ill-luck or a curse
    if they remain in the house or are kept by others.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The brahmin orders his son to carry the clothes on a stick, without touching
    them by hand, throw them away in a charnel-ground, bathe, and return.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Master at dawn recognizes that the father and son are destined to attain
    salvation, goes to the charnel-ground in the guise of a hunter, sits at its entrance,
    and emits six-coloured rays.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The young brahmin carries the clothes on the end of a stick, with the narration
    comparing the carrying to carrying a house-snake.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The young brahmin tells the Master that the mouse-gnawed clothes are regarded
    as ill-luck personified and deadly as venom.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the son throws the suit away, the Master picks it up, says it will suit
    him, disregards the son's warnings, and goes toward the Bamboo-grove.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The son reports the event to his father; the father fears the accursed clothes
    will harm Gotama and brings many other robes to persuade him to discard the suit.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The Master replies that, as one who has renounced the world, he is content
    with rags from roadsides, bathing-places, dustheaps, and charnel-grounds.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Master states that the brahmin has held superstitions in bygone days as
    well as in the present, and begins a story of the past.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the past story, a righteous King of Magadha reigns at Rajagaha, while the
    Bodhisatta is born as a North-western brahmin, renounces the world, becomes a
    hermit, gains Knowledges and Attainments, and dwells in the Himalayas.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: When the Bodhisatta returns from the Himalayas and goes into the city for
    alms, the king summons him to the palace, gives him a seat and food, and obtains
    his promise to dwell in the royal pleasaunce.
  category: relationship
  evidence_refs:
  - ev:11
