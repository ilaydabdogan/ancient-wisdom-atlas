canonical_text:
  quote: ''
  summary: A hawker, distraught over losing a valuable golden bowl to the Bodhisatta,
    throws away his goods and clothing, arms himself with a scale-beam, and pursues
    the Bodhisatta to a river. As the Bodhisatta crosses, the hawker fails to recall
    the boat, is overcome by grief and hatred, and dies. The passage says this was
    Devadatta's first grudge against the Bodhisatta. The Buddha then gives a stanza
    comparing spiritual remissness to the hawker's lost prize, teaches the Four Truths,
    establishes a fainthearted Brother in Arahatship, and identifies Devadatta as
    the foolish hawker and himself as the wise and good hawker.
  language: English
  quote_policy: summarized
