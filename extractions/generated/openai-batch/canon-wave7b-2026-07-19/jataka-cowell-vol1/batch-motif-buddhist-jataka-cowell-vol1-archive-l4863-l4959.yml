canonical_text:
  quote: ''
  summary: An ex-goldsmith monk fails to progress under Sariputta’s assigned meditation
    on impurity. The Buddha recognizes the monk’s disposition, creates a lotus pond
    and flower for him to contemplate, causes the flower to decay, and teaches him
    through the image. The monk realizes impermanence, wins Insight, and then attains
    Arahatship; the community praises the Buddha’s ability to know minds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sariputta prescribed meditation on impurity to his co-resident, an ex-goldsmith
    monk, but the monk made no progress for four months.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says, according to tradition, the monk had been born as a goldsmith
    through five hundred successive births and had long seen pure gold.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sariputta brought the monk to the Buddha, saying that only a Buddha could
    convert him; the Buddha questioned Sariputta about the meditation prescribed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Buddha stated that Sariputta did not have knowledge of hearts or the ability
    to read men’s thoughts, and told him to return in the evening.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Buddha clothed the monk well, kept him beside him, brought him on the
    alms-round, and saw that he received choice food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At evening the Buddha made a pond, a clump of lotuses, and a great lotus-flower
    appear, then told the monk to sit and gaze at the flower.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'As the monk watched, the Buddha made the lotus decay: its colour faded, petals
    and stamens fell away, and only the pericarp remained.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The monk reflected that the once beautiful flower had decayed and extended
    that observation to his own body and to all compounded things; with this thought
    he won Insight.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Knowing the monk’s mind had risen to Insight, the Buddha emitted a radiant
    semblance of himself and recited a stanza urging the plucking out of self-love
    and the pursuit of the Path of Peace and Extinction.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the close of the stanza the monk won Arahatship and uttered verses about
    purity, final embodiment, release, and the dispelling of delusion.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Brethren praised the Buddha’s power to know the monk’s disposition and
    to bestow Arahatship in a single day.
  category: speech
  evidence_refs:
  - ev:7
