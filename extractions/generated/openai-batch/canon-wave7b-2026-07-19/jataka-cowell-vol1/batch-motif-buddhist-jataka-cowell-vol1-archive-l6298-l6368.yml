canonical_text:
  quote: "“Our trusted stronghold harbours death!”"
  summary: 'A Brother whose cell has burned down spends the rainy season in discomfort
    and fails to complete his meditation theme. The Master tells a past-life story:
    the Bodhisatta, born as a wise bird leading other birds in a giant tree, sees
    dust and smoke from grinding branches and predicts fire. He warns the birds to
    fly away. Wiser birds follow him and survive; foolish birds mock the warning,
    remain in the tree, and are destroyed when it catches fire. The Master applies
    the lesson to knowing what dwelling is suitable and identifies himself with the
    wise bird.'
  language: English
  quote_policy: quoted
