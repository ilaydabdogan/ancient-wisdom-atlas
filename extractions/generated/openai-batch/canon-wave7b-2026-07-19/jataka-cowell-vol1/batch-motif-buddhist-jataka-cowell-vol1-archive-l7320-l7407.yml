canonical_text:
  quote: ''
  summary: A lay squire honors a guest Elder and invites him and a resident Brother
    for a meal. The resident Brother becomes jealous, makes only a token attempt to
    summon the Elder, lies about him to the squire, and discards the food prepared
    for him. The Arahat understands the jealousy and departs. The resident Brother
    recognizes his greed as sin, suffers, dies, and undergoes hell, hungry ogre and
    dog births, and a poor human birth as Mitta-vindaka, who is later driven away
    by his parents and becomes a charity scholar under the Bodhisatta.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The squire arrives in the evening with servants carrying flowers, perfumes,
    lamps, and oil, and asks whether a guest Elder has appeared.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The squire bows to the Elder, listens to a discourse, makes offerings at the
    Tope and Bo-Tree, lights a lamp, and invites both the Elder and the resident Brother
    to his house for the next day's meal.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The resident Brother thinks he is losing his hold on the squire and schemes
    to make the Elder understand that he should not settle there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Arahat reads the resident Brother's thoughts and returns to his cell,
    where he becomes absorbed in the bliss of Insight and the Fruits.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The resident Brother lightly sounds the gong and goes alone to the squire's
    house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the squire's house, the resident Brother says he could not wake the Elder
    and suggests that the Elder's previous meal may have disagreed with him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Meanwhile, the Arahat waits until the proper time for alms, washes and dresses,
    rises with bowl and robe in the air, and goes elsewhere.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The squire gives the resident Brother rice and milk with ghee, sugar, and
    honey, and fills the bowl afresh for the Elder.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The resident Brother fears that the Elder will stay if he tastes the food,
    considers ways to dispose of it, and finally throws it into a hole in a fired
    field and covers it with embers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After not finding the Elder at home, the resident Brother thinks the Arahat
    understood his jealousy and declares that greed has made him sin.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After affliction and death, he is reborn in hell, then in repeated ogre and
    dog births marked by lack of food, and then in a beggar family where he is called
    Mitta-vindaka.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Mitta-vindaka's parents beat him and drive him away, after which he wanders
    to Benares and becomes a charity scholar under the Bodhisatta, though he remains
    fierce and intractable.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
