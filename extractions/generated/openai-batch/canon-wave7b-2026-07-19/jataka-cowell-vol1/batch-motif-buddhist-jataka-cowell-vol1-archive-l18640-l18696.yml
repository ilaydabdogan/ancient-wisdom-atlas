canonical_text:
  quote: ''
  summary: A renowned brahmin teacher, the Bodhisatta, teaches a pupil named Sanjiva
    a spell for raising the dead but not its counter-charm. Sanjiva boastfully revives
    a dead tiger in the forest; the other pupils climb a tree first. The revived tiger
    kills Sanjiva and then falls dead itself. The teacher uses the event as a lesson
    that aiding a villain or honoring the undeserving brings harm. The Master identifies
    Ajatasattu with Sanjiva and himself with the former teacher.
  language: English
  quote_policy: summarized
