canonical_text:
  quote: ''
  summary: A crane deceives pond fish by claiming to carry them to a better pool,
    but instead kills and eats them at a tree. When the crane tries the same deceit
    on a crab, the crab grips the crane's neck, forces him back to the water, and
    kills him. A tree-fairy praises the reversal with a stanza about guile failing
    the guileful.
  language: English
  quote_policy: summarized
literal_observations:
