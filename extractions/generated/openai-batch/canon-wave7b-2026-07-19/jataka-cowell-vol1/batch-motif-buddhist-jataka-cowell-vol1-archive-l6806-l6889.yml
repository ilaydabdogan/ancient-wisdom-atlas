canonical_text:
  quote: ''
  summary: The passage describes Anathapindika's lavish and continuing support of
    the Buddha and the Brotherhood, the loss and depletion of his wealth, a heretic
    fairy's failed attempt to stop holy visitors from entering his house, and the
    Buddha's teaching that a small, unpalatable gift given with faith to worthy recipients
    is not small in fruit. The Master supports this by referring to the Velamaka Sutta
    and to the rarity of worthy recipients.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Anathapindika is described as valuing only the Three Gems and attending services
    daily while bringing offerings such as rice-gruel, ghee, butter, honey, molasses,
    perfumes, garlands, and cloths.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Traders owed the merchant eighteen crores, and another eighteen crores of
    family property buried in a river-bank was washed into the ocean during a storm.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The merchant's house kept rice ready for five hundred Brethren, and the Buddha,
    the Eighty Chief Elders, and many other Brethren visited it.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The house is described as seven stories high with seven portals, and a heretic
    fairy dwelt over the fourth gateway.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: When the Buddha, the Eighty Chief Elders, or other Elders entered the house,
    the fairy had to come down with her children to the ground floor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The fairy resolved to stop Gotama and his disciples from coming to the house
    and appeared visibly to the business manager.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The fairy told the business manager that the merchant was depleting his resources
    for Gotama, neglecting trade and business, and should be advised to stop the visits.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The business manager rejected the fairy's advice and defended the merchant's
    spending on the Buddha's Faith.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The fairy later gave the same advice to the merchant's eldest son, who also
    rejected her; she did not dare speak directly to the merchant.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Because of unending munificence and no business activity, the merchant became
    poor, but he continued to entertain the Brotherhood with what he could provide.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: When the merchant had only sour husk-porridge left from the previous day,
    the Master told him not to be distressed by the unpalatable nature of the gift.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The Master taught that if the heart is good and faithful, a gift to Buddhas,
    Pacceka Buddhas, and their disciples cannot be unacceptable or small.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Master contrasted the householder's gift with his own former vast giving
    in Velama's time, where no recipients had reached the Three Refuges or kept the
    Five Commandments.
  category: speech
  evidence_refs:
  - ev:10
