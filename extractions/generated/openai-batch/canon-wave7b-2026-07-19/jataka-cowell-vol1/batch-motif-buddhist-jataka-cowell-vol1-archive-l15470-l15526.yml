canonical_text:
  quote: |-
    “As died the partridge for her clamorous cry,
    So prate and chatter doomed this fool to die.”
  summary: The Master tells a past-life story in which a chattering ascetic is killed
    after meddling in another ascetic’s wood-chopping, and a partridge is killed because
    its cry reveals it to a sportsman. The Bodhisatta links the two deaths as examples
    of destructive chatter and is later destined for rebirth in the Brahma Realm.
  language: English
  quote_policy: quoted
