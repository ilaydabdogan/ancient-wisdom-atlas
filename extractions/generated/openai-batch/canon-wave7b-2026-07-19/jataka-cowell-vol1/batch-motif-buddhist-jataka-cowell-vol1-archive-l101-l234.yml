  summary: The passage is front matter and preface material. It introduces the Jataka
    as stories of the Buddha's former births, contrasts the Greek example of Pythagoras
    remembering previous lives with Indian and Buddhist traditions of remembered births
    and transmigration, notes Jataka material in canonical and visual traditions,
    and describes Jataka stories as didactic examples used in religious discourse
    and later collected in systematic form.
  language: English
  quote_policy: summarized
