canonical_text:
  quote: ''
  summary: The Master addresses a monk who has given up effort by telling a former-birth
    story. The Bodhisatta is born as the queen's child in Benares, receives a prophecy
    of kingship and renown through five weapons, studies at Takkasila, and returns
    armed with five weapons. On the road he enters a forest haunted by the ogre Hairy-grip
    despite warnings. The ogre threatens him; the Bodhisatta attacks with arrows,
    sword, spear, club, hands, feet, and head, but all stick fast in the ogre's shaggy
    hair. Even trapped, he remains fearless, prompting the ogre to ask why he does
    not fear death.
  language: English
  quote_policy: summarized
