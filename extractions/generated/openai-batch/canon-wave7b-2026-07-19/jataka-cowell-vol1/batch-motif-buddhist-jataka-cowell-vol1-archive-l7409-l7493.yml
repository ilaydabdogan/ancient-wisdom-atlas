canonical_text:
  quote: ''
  summary: The passage recounts Mitta-vindaka’s refusal of correction, his expulsion
    from a village after repeated disasters, the death of his family in a haunted
    forest, his casting overboard from a stopped ship, his encounters with supernatural
    women in ocean palaces, his seizure of a goat-shaped ogress who throws him to
    Benares, his later arrest for seizing a royal goat, and the Bodhisatta’s moral
    explanation that refusing good counsel brings harm.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mitta-vindaka was heedless of his master’s reproofs, quarrelled, ran away,
    married a poor woman, had two children, and settled in a border-village where
    he was paid to teach and given a hut.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Mitta-vindaka came to the village, the villagers experienced seven instances
    of the king’s vengeance, seven burnings of their homes, and seven dryings of their
    water-tank.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The villagers concluded their worsening condition began with Mitta-vindaka’s
    arrival and drove him away with blows.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In a haunted forest, demons killed and ate Mitta-vindaka’s wife and children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mitta-vindaka joined a ship at Gambhira; on the seventh day the ship stopped
    in mid-ocean, lots were cast, the lot fell on him seven times, and the crew cast
    him overboard on a bamboo raft.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After Mitta-vindaka was cast overboard, the ship immediately moved again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Floating on the waves, Mitta-vindaka encountered groups of daughters of the
    gods in palaces of crystal, silver, jewels, and gold, with group sizes of four,
    eight, sixteen, and thirty-two.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The palace-dwellers warned or instructed him, but Mitta-vindaka left them
    and sailed onward.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In a city of ogres among islands, an ogress was moving about in the shape
    of a goat; when Mitta-vindaka seized her by the leg, she hurled him over the ocean
    to a thorn-brake by the dry moat of Benares.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Mitta-vindaka saw royal goats near Benares and seized one by the leg, thinking
    the act might send him back to the ocean palaces.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Goatherds seized, beat, and bound Mitta-vindaka, accusing him of being the
    thief who had been taking the King’s goats.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Bodhisatta recognized Mitta-vindaka as his pupil, obtained his release
