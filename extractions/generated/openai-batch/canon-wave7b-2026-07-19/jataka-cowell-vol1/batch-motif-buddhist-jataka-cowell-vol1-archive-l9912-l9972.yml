canonical_text:
  quote: ''
  summary: A robber beats and binds the Bodhisatta, called the Date-Sage. The Date-Sage
    explains that he had once been a forest hermit who rescued a woman from the Ganges,
    fell from his ascetic state through her, supported her, and then came to rescue
    her after she was taken by robbers, only to be betrayed into the robber's hands.
    The robber kills the woman, tends the Date-Sage, and later follows him into hermit
    life. Both gain higher attainments and are qualified for the Realm of Brahma.
    The Buddha then gives a moral stanza, the listener gains the Fruit of the First
    Path, and the former births are identified.
  language: English
  quote_policy: summarized
