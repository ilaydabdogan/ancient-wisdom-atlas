canonical_text:
  quote: ''
  summary: In a past life, the Bodhisatta is a sea-sprite. A male crow and his mate
    eat and drink from offerings made to the Nagas at the seashore and become drunk.
    While they try to play in the surf, a wave carries the hen-crow out and a fish
    eats her. The male crow laments, and other crows gather; they decide to rescue
    her by emptying the sea with their beaks, but exhaustion and the refilling water
    defeat them. As they praise the dead hen-crow and blame the sea for stealing her,
    the sea-sprite makes a bogey appear from the sea, frightening them away and thereby
    saving them. The Master then identifies the past-life figures.
  language: English
  quote_policy: summarized
