canonical_text:
  quote: They harness 'Blackie'; he soon draws the load.
  summary: The Bodhisatta, called Granny's Blackie, returns exhausted after drawing
    five hundred wagons over a river and wearing a thousand pieces of money around
    his neck. The old woman who calls him her child tends him with warm water, oil,
    drink, and food, and later dies together with him according to their deserts.
    The frame states that the Buddha uses the story to show his unmatched status and
    identifies Uppala-Vanna as the old woman and himself as Granny's Blackie.
  language: English
  quote_policy: quoted
