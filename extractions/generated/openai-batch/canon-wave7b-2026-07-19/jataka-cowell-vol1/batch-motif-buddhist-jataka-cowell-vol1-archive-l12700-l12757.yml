canonical_text:
  quote: ''
  summary: Five hundred hermits from the Himalayas take up residence in the royal
    pleasaunce at Benares and receive royal hospitality. During a city drinking festival
    the king gives them spirits; they drink, behave riotously, awaken remorseful,
    and return to their master in the Himalayas. They confess that forbidden drink
    made them lose their senses. The Bodhisatta rebukes them, exhorts them not to
    repeat the act, and the frame identifies the hermits with the Master's disciples
    and their teacher with the Master.
  language: English
  quote_policy: summarized
