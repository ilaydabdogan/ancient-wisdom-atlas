canonical_text:
  quote: ''
  summary: The Radha-Jataka tells of a Brother attached to a former wife and a past-life
    story in which the Bodhisatta, born as the parrot Potthapada, refuses his brother
    Radha's proposal to restrain a brahmin's unfaithful wife, reports the matter to
    the brahmin, and departs to the forest. The passage then begins the Kaka-Jataka,
    where aged former householders become monks but remain attached to household food
    and lament the death of a benefactress; the Master says the same grief occurred
    in a past crow story involving a drowned crow and an attempt to empty the sea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Jetavana, the Master addresses a Brother who hankers after the wife of
    his mundane life and says that earlier safeguards over a woman had also failed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the past, while Brahmadatta ruled Benares, the Bodhisatta was born as a
    parrot named Potthapada, with a younger brother named Radha, and a brahmin treated
    both like his own children.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before leaving home on business, the brahmin asks the two parrots to stop
    his wife if she is minded to behave badly; Potthapada says they will do so if
    they can, otherwise they will keep silent.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: During the brahmin's absence, his wife repeatedly misconducts herself, and
    Radha proposes that the brothers stop her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Potthapada calls Radha's proposal foolish, says the task is impossible, and
    prevents Radha from speaking to the brahmin's wife.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: When the brahmin returns and asks about his wife's conduct, Potthapada reports
    what happened and advises him not to continue with such a wife.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Potthapada bows at the brahmin's feet and flies away with Radha to the forest.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the story, the Master teaches the Four Truths; the Brother attains the
    first Path, and the Master identifies the present husband and wife with the brahmin
    and his wife, Ananda with Radha, and himself with Potthapada.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: At the start of the Kaka-Jataka frame, aged wealthy friends of Savatthi hear
    the Master preach, distribute their belongings to their families, and enter the
    Brotherhood.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: After ordination, the aged Brethren do not live as Brethren should; they build
    nearby huts on the monastery outskirts and commonly go to their wives' and children's
    houses for alms-food.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: One aged man's wife provides sauces and curries for the group, and when she
    dies the aged Brethren return to the monastery lamenting her death.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: 'The Master says that in the past this same woman''s death also made them
    lament: she was then a crow drowned in the sea, and they tried to empty the sea
    until wise figures saved them.'
  category: speech
  evidence_refs:
  - ev:11
