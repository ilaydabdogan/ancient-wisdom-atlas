canonical_text:
  quote: ''
  summary: 'The Master tells a self-willed Brother a past-life story: a brahmin possessing
    the Vedabbha charm ignores the Bodhisatta''s warning, invokes a treasure-rain
    during a planetary conjunction to pay robbers, and is killed when further robbers
    demand the same wealth; the robber bands then destroy one another over the booty.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master addresses a self-willed Brother at Jetavana and introduces the
    past story as another instance of refusing wise advice.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A village brahmin knows the Vedabbha charm, which can make seven precious
    substances rain from the heavens when repeated under a certain planetary conjunction
    with the gaze directed upward.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Bodhisatta is the pupil of the Vedabbha-brahmin and travels with him toward
    the country of Ceti.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A forest road is controlled by five hundred robbers called the Despatchers,
    who capture pairs of travelers and release one to fetch ransom.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: When the robbers keep the brahmin and send the Bodhisatta for ransom, the
    Bodhisatta warns the brahmin not to use the charm during the coming conjunction.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: At sunset, after being bound, the brahmin sees the full moon and recognizes
    that the required conjunction is taking place.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The brahmin decides to use the charm to call down precious rain, pay the ransom,
    and go free.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Before reciting the charm, the brahmin asks the robbers to untie him, bathe
    his head, dress him in new clothes, perfume him, deck him with flowers, and leave
    him alone.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The brahmin repeats the charm with eyes uplifted, and the Things of Price
    pour down from the skies; the first robber band gathers them into bundles.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A second band of five hundred robbers captures the party and seizes the brahmin
    after being told that he caused riches to rain from the sky.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The brahmin says the needed planetary conjunction will not occur again for
    a year, and the second robber band kills him with a sharp sword and leaves his
    body in the road.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: The second robber band kills the first band, takes the booty, then fights
