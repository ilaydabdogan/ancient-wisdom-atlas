canonical_text:
  quote: ''
  summary: A repentant fairy tells Anatha-pindika that, at Sakka's instance, she has
    restored lost and unowned wealth to his treasure-chambers and asks pardon. Anatha-pindika
    brings her before the Buddha, who teaches that sin and goodness are recognized
    when their fruits ripen; the fairy attains the Fruit of the First Path and receives
    pardon. Anatha-pindika notes that the fairy could not stop his gifts, and the
    Master contrasts this with a bygone case of giving despite Māra's threat of a
    fiery hell. The past story begins with the Bodhisatta as a charitable treasurer
    in Benares who builds almonries, while a Pacceka Buddha rises from trance and
    comes through the air to his mansion gate.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fairy identifies herself as the blind and foolish being who lived over the
    merchant's fourth gateway and asks the merchant to pardon her former fault.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fairy says Sakka directed her atonement and that she recovered three sums
    of eighteen crores each, making fifty-four crores, which she placed in the merchant's
    empty treasure-chambers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Anatha-pindika decides that the Buddha should hear the matter and takes the
    fairy to the Master in the early morning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Master teaches that a sinful person may regard sin as excellent before
    it bears fruit, and that a good person may regard goodness as sin before goodness
    bears fruit.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After hearing the stanzas, the fairy is established in the Fruit of the First
    Path, falls at the Master's wheel-marked feet, confesses delusion and ignorance,
    and receives pardon from the Master and from the merchant.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Anatha-pindika says the fairy tried to stop him from supporting the Buddha
    and his following and from giving gifts, but did not succeed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Master says the greater marvel was that wise and good people of a bygone
    day gave gifts even when Māra appeared in mid-heaven, threatened hell, and showed
    a deep pit filled with red-hot embers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the past story, the Bodhisatta is born into the family of the Lord High
    Treasurer of Benares, later holds that office, builds six almonries, gives bountifully,
    keeps the commandments, and observes fast-day duties.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Pacceka Buddha rises from seven days of mystic trance, prepares for alms-round,
    calls a bowl into being, travels through the air, and arrives at the gate of the
    treasurer's mansion as breakfast is being brought in.
  category: sequence
  evidence_refs:
  - ev:6
