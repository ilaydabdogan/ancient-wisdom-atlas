canonical_text:
  quote: ''
  summary: The Buddha says he knows a brother's disposition now and knew it in a past
    birth. In the past, under King Brahmadatta of Benares, the Bodhisatta served as
    the king's wise director. The royal state-charger refuses to enter its usual bathing
    water after an ordinary horse has been washed there. The Bodhisatta examines the
    horse, infers that wounded pride is the cause, and orders the animal to be taken
    to other waters, where it is successfully watered and bathed. The king praises
    the Bodhisatta's ability to understand the mind of an animal. The Buddha identifies
    the brother with the former state-charger, Ananda with the king, and himself with
    the wise minister.
  language: English
  quote_policy: summarized
