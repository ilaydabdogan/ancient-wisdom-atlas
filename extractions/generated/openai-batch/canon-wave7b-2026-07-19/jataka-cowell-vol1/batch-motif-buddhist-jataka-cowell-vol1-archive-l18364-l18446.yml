    and watch-towers, and governed by many kings and officials.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Licchavi prince called Wicked is described as fierce, passionate, cruel,
    and frightening like an enraged viper.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prince's parents bring him to the Buddha because they believe only the
    Buddha can tame his fierce spirit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Buddha tells the prince that human beings should not be passionate, cruel,
    or ferocious.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Buddha's lecture says that rage and harming others lead to suffering,
    post-mortem punishment, and later disease, while kindness removes fear of hell
    and punishment.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After one lecture, the prince's pride and arrogance are humbled, and he no
    longer reviles or strikes others.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Brethren discuss the prince's change and compare the Buddha's guidance
