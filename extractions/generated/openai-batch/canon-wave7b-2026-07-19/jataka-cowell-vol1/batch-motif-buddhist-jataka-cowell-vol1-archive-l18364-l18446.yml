canonical_text:
  quote: ''
  summary: In Vesali, a cruel Licchavi prince called Wicked is brought by his parents
    to the Buddha, who rebukes cruelty and teaches the consequences of rage and harm.
    The prince is immediately softened and becomes kind. The Brethren praise the Buddha
    as a trainer of men, comparing him to animal-tamers. The Buddha says this has
    happened before and begins a past-life story in which the Bodhisatta, born as
    a learned brahmin who becomes a Himalayan recluse, comes to Benares for necessities
    and is seen by the king.
  language: English
  quote_policy: summarized
