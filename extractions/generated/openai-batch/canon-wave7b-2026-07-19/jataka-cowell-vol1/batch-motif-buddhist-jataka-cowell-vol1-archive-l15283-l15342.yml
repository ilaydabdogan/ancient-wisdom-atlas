canonical_text:
  quote: ''
  summary: The Master tells of two aged monks who delayed visiting him through indolence,
    then recounts a former birth in which three fish approached a dangerous inhabited
    river area. Thoughtful warns the others to return to the wild country, but Over-thoughtful
    and Thoughtless delay, are caught in fishermen's nets, and are freed by Thoughtful's
    deceptive splashing maneuver. The Master identifies the two monks with the two
    imprudent fish and himself with Thoughtful.
  language: English
  quote_policy: summarized
