canonical_text:
  quote: ''
  summary: The passage concludes an interpretation of one of the sixteen dreams as
    a future age of unrighteous kings, social inversion, and oppression. The Master
    rejects the brahmins' sacrificial prophecy as greed-driven and says earlier kings
    had the same dreams. In the past story, King Brahmadatta dreams the same dreams;
    brahmins begin sacrifices; a young brahmin objects to killing; and the Bodhisatta,
    an ascetic with higher knowledges, arrives by air in the royal pleasaunce to explain
    the dreams and deliver creatures from danger.
  language: English
  quote_policy: summarized
