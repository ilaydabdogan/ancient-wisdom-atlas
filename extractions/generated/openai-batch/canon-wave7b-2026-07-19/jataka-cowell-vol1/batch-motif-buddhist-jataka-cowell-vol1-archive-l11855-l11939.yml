- id: obs:1
  text: The dream is explained as referring to a future time when low-born favourites
    gain power, nobles are dispossessed and threatened, and evil Brethren harry good
    Brethren.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master tells the king that the dream concerns future times only and that
    the brahmins' prophecy was motivated by greed rather than truth or affection.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Master states that kings of earlier days also had the sixteen dreams and
    that brahmins then, as now, used the dreams as a pretext for sacrifices until
    the Bodhisatta was consulted.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the past story, the Bodhisatta is born a brahmin in the North country,
    renounces the world, gains the higher Knowledges and Attainments, and dwells in
    the Himalaya country.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: King Brahmadatta of Benares dreams the same dreams and asks brahmins about
