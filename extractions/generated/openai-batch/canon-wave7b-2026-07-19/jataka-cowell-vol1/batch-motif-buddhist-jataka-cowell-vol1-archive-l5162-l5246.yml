canonical_text:
  quote: ''
  summary: In the present frame, the Master addresses talk among the Brethren about
    the close intimacy between a lay-disciple and an aged Elder. He tells a former-birth
    story in which the Bodhisatta is a minister under King Brahmadatta. A dog becomes
    closely attached to the king's state elephant through sharing fallen rice at the
    elephant's stall. After a villager buys and removes the dog, the elephant becomes
    sad and refuses food, drink, and bathing. The Bodhisatta infers that the elephant
    is grieving for a lost friend, advises the king to proclaim a penalty for whoever
    keeps the dog, and the dog is released. The elephant joyfully receives the dog
    and resumes eating after the dog eats. The king honors the Bodhisatta for understanding
    animal minds. The Master identifies the present lay-disciple as the former dog,
    the aged Elder as the former elephant, and himself as the wise minister.
  language: English
  quote_policy: summarized
