canonical_text:
  quote: ''
  summary: King Goodness refuses to attack the invading king of Kosala and opens the
    city gates. The invader seizes King Goodness and his ministers, has them buried
    alive up to the neck in a cemetery, and leaves jackals to kill them. King Goodness
    remains free from anger, exhorts his companions to love and charity, uses a jackal's
    attack to loosen the earth, frees himself, and releases his ministers. Two ogres
    then bring a disputed corpse to him for division, and by magic provide him with
    scented bath water, royal robes, scents, and flowers.
  language: English
  quote_policy: summarized
