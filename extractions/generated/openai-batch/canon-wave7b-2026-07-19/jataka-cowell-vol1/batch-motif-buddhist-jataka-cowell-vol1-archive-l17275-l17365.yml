canonical_text:
  quote: ''
  summary: The frame story tells how Kana's mother repeatedly bakes cakes for her
    daughter to take home, but successive monks receive the cakes as alms, delaying
    Kana until her husband takes another wife. The Master says the same four Brothers
    had caused sorrow before by eating another's store and tells a past-life story.
    In that story, the Bodhisatta is a stone-cutter near a deserted village where
    a rich merchant's wife has been reborn as a mouse guarding treasure. The mouse
    gives the Bodhisatta coins in exchange for meat, but after being caught by four
    cats she must divide the meat among them and herself, becoming emaciated before
    telling the Bodhisatta what happened.
  language: English
  quote_policy: summarized
