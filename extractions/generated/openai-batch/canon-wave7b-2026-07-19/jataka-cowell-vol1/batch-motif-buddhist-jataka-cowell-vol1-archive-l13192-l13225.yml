canonical_text:
  quote: Whoso renounces omens, dreams and signs.
  summary: A brahmin called Cloth-omens fears that a mouse-gnawed suit discarded at
    a charnel-ground will bring death to the King's ascetic. The Bodhisatta, as that
    ascetic, retrieves the suit and rejects belief in luck and omens. The brahmin
    abandons his error and takes refuge. The Buddha then teaches that renouncing omens,
    dreams, and signs frees one from superstition; after the Four Truths are preached,
    the brahmin and his son attain the First Path, and the former birth is identified.
  language: English
  quote_policy: quoted
