canonical_text:
  quote: "“While concord reigns, the birds bear off the net. When quarrels rise, they'll
    fall a prey to me.”"
  summary: The Master warns his kinsfolk that quarrelling among relatives leads to
    destruction. In a past birth, the Bodhisatta was a wise quail leader who taught
    the flock to lift a fowler’s net together and escape. When the quails later quarrelled,
    they failed to cooperate and were caught. The Master identifies Devadatta with
    the foolish quail and himself with the wise quail.
  language: English
  quote_policy: quoted
