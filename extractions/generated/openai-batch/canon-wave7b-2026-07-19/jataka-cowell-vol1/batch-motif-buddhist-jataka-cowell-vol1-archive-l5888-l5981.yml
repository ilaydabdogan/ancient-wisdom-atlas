canonical_text:
  quote: ''
  summary: 'At Jetavana, the Master addresses a Brother with many belongings who reacts
    by stripping naked, is censured, and returns to lay life. The Master says shamelessness
    has cost him before, and tells a past-life tale: in an early age the birds'' king,
    Golden Mallard, lets his daughter choose a husband from birds gathered in the
    Himalayas. She chooses a beautiful peacock, but the peacock publicly dances and
    exposes himself. The king refuses him and gives the princess to a young mallard.
    The peacock flees in shame. The Master identifies the present Brother as the peacock
    and himself as the Royal Mallard.'
  language: English
  quote_policy: summarized
