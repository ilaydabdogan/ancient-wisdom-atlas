candidate_motifs:
- id: motif:1
  label: prolonged gestation and extraordinary infant speech
  taxonomy_refs:
  - miraculous_child
  basis: Sivali remains in the womb for seven years, is born after seven days of labor,
    and as a seven-day-old infant converses with Sariputta about his experience.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage frames the birth as karmically caused suffering, not as a
    divine birth; the taxonomy label is used only for the extraordinary child pattern.
- id: motif:2
  label: speech of a holy figure brings safe delivery
  taxonomy_refs: []
  basis: After the Buddha speaks a wish for Suppavasa's health and a healthy child,
    she becomes well and delivers safely.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage reports the sequence directly but does not describe a ritual
    procedure beyond the spoken wish.
- id: motif:3
  label: karmic explanation of present suffering by past deeds
  taxonomy_refs: []
  basis: The Brethren ask what deeds caused the pain of mother and child, and the
    Buddha states that Sivali's and Suppavasa's sufferings resulted from their own
    past deeds before telling the past story.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: No specific taxonomy reference from the supplied list exactly corresponds
    to karmic causation.
- id: motif:4
  label: renunciation leading to Arahatship
  taxonomy_refs:
  - departure
  - wisdom
  basis: Sivali gives his heart to the Faith, forsakes the world to join the Brotherhood,
    and attains Arahatship.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage presents this briefly as a life outcome rather than a detailed
    quest or instruction episode.
- id: motif:5
  label: maternal counsel secures victory without battle
  taxonomy_refs:
  - wisdom
  basis: The prince's mother advises avoiding battle and instead blockading Benares
    until deprivation forces surrender; the prince follows this counsel and gains
    the city.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: The action is strategic and coercive; the taxonomy reference 'wisdom'
    is limited to practical counsel in the passage.
- id: motif:6
  label: exiled prince returns and gains kingship
  taxonomy_refs:
  - return
  - royal_legitimacy
  basis: After his father is killed, the prince escapes, gathers a force, returns
    to Benares, and becomes king after the city surrenders.
  evidence_refs:
  - ev:11
  - ev:13
  confidence: medium
  cautions: The passage does not explicitly discuss legal legitimacy beyond royal
    descent and the final accession.
- id: motif:7
  label: city subdued by deprivation blockade
  taxonomy_refs: []
  basis: Every approach to the city is invested and barred so that lack of firewood,
