canonical_text:
  quote: ''
  summary: Suppavasa endures a seven-year pregnancy and seven days of labor while
    recollecting the Buddha, the Elect, and Nirvana. After her husband carries her
    message to the Buddha, the Buddha blesses her, and she safely gives birth to Sivali,
    who as an infant speaks with Sariputta about his suffering in the womb. Sivali
    later renounces the world and attains Arahatship. The Buddha explains that Sivali's
    and Suppavasa's sufferings arose from past deeds, then narrates a past-life story
    in which a prince, advised by his mother, blockades Benares for seven days until
    the citizens kill their king and surrender the city.
  language: English
  quote_policy: summarized
