canonical_text:
  quote: "“Unknowable, uncertain as the path / Of fishes in the water, women prove.”"
  summary: A lay-brother complains to the Buddha that his wife's changing conduct
    has kept him from attendance. The Buddha recounts a former birth in which a young
    brahmin pupil had the same difficulty, and the Bodhisatta as teacher gave counsel
    in a stanza. In both present and past frames, the wife's misconduct ceases after
    she hears that a spiritual teacher knows of it; the Buddha then identifies the
    past figures with the present ones.
  language: English
  quote_policy: quoted
