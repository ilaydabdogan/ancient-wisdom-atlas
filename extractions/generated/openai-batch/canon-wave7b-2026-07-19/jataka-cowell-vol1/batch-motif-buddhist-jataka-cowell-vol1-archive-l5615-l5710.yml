canonical_text:
  quote: this is our spell, our safeguard, and our strength.
  summary: A village headman falsely accuses Magha and his companions before the king.
    The king orders them trampled by elephants, but the elephants refuse to approach.
    Asked for their spell, the Bodhisatta explains that their protection is moral
    conduct, lovingkindness, charity, and public works. The king rewards them. The
    group builds a public hall at a crossroads; after initially excluding women, they
    accept Goodness's donated pinnacle and later the site gains water, food, trees,
    a garden, and a lotus tank.
  language: English
  quote_policy: quoted
