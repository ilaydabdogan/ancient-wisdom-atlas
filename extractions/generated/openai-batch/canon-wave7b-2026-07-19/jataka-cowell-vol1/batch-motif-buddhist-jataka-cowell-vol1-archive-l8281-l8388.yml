canonical_text:
  quote: ''
  summary: In the Dummedha-Jataka, the Bodhisatta is born as Prince Brahmadatta of
    Benares. Seeing that the people kill animals in rites to gods, he resolves to
    stop the destruction of life without harming humans. As prince, he publicly worships
    a holy banyan tree. After becoming king, he claims that he had vowed to sacrifice
    a thousand commandment-breakers to that tree deity. A drum proclamation of this
    threatened sacrifice causes the people to abandon wrongdoing, so no one is harmed.
    The story closes by identifying the former king with the Buddha and the ministers
    with the Buddha's disciples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bodhisatta is reborn in the womb of the Queen Consort of Benares, is named
    Prince Brahmadatta, is educated at Takkasila, learns the Three Vedas and Eighteen
    Branches of Knowledge, and is made Viceroy by his father.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people of Benares hold festivals to gods and perform rites involving the
    killing of sheep, goats, poultry, swine, and other living creatures.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Bodhisatta thinks that people are led astray by superstition and resolves
    that, when he becomes king, he will end the destruction of life by a clever stratagem
    without harming any human being.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The prince sees a crowd praying at a holy banyan tree to the fairy reborn
    in that tree for sons, daughters, honour, and wealth.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The prince offers perfumes and flowers to the banyan tree, sprinkles it with
    water, and walks reverently around its trunk; he later repeats visits and worship
    at the tree.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After his father's death, the Bodhisatta becomes king and is described as
    ruling righteously while shunning the four evil courses and practising the ten
    royal virtues.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The king gathers ministers, brahmins, gentry, and other orders of people and
    asks whether they know how he became king.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king tells the assembly that his former banyan-tree worship was a vow
    to offer a sacrifice to the tree if he became king, and says that the god helped
    him become king.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The king defines the promised sacrifice as the killing of subjects addicted
    to the Five Sins or walking in the Ten Paths of Unrighteousness, with their flesh,
    blood, entrails, vitals, and hearts to be offered.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The king orders a proclamation by beat of drum that he will slay one thousand
    such transgressors for the promised sacrifice.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the proclamation, the townsfolk do not persist in the old wickedness,
    no one is convicted of transgressing during the Bodhisatta's reign, and the Commandments
    are observed without any subject being harmed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: At the close of a life of alms-giving and other good works, the Bodhisatta
    passes away with his followers to the city of the devas.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Master says that the Buddha has acted for the world's good before, and
    identifies the Buddha's disciples as the former ministers and himself as the King
    of Benares.
  category: speech
  evidence_refs:
  - ev:8
