canonical_text:
  quote: ''
  summary: A passionless rich man's son is given a girl during the Kattika festival,
    sees her body as bones, and sends her away. When she is later missing, he is accused
    and led to execution; in peril he resolves to renounce lay life if spared. The
    girl appears, he is freed, enters the Buddha's Brotherhood, meditates, and attains
    Arahatship. The Master says wise figures of former times also escaped death by
    taking thought in danger.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master tells the story at Jetavana about the son of Over-Treasurer, a
    rich man of Savatthi.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man is described as a righteous being from the realm of Brahma angels
    and as purged from passion because he had lived long in the Brahma Realm.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: During the proclaimed Kattika festival in Savatthi, the whole city gives itself
    to festivities.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young man's companions arrange for a charming girl to go to his chamber
    so that he can keep the feast with them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the girl enters, the young man gives her no look or word; she responds
    by displaying graces and smiling so that her teeth show.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sight of the girl's teeth suggests bones to the young man, and he perceives
    her whole body as a chain of bones.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The young man gives the girl money and sends her away; afterward a nobleman
    in the street gives her a present to accompany him home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: After seven days, the girl's mother seeks her daughter and brings the young
    man before the king when she is not restored.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The king orders that the young man be executed if he cannot produce the girl;
    he is led away with his hands tied behind his back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The people follow the condemned young man with lamentations, saying he suffers
    unjustly.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: In danger, the young man thinks that the sorrow has come from living a lay
    life and resolves to give up the world if he escapes.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The missing girl hears the uproar, shows herself to the king's men, is handed
    to her mother, and the young man is freed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After release, the young man bathes in the river, tells his parents his resolve,
    takes cloth for an ascetic robe, and asks the Master for admission to the Brotherhood.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: He becomes a novice and then a full Brother, meditates on the idea of Bondage,
    gains Insight, and wins Arahatship.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The assembled Brethren discuss his virtues, and the Master says that wise
    people of former times also escaped death by taking thought in peril.
  category: speech
  evidence_refs:
  - ev:9
