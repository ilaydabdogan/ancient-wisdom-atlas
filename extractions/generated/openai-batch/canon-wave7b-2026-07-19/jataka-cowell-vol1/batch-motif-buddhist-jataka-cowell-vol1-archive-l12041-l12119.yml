canonical_text:
  quote: teaching that giving was true sacrifice
  summary: A wealthy treasurer arranges for cakes to be cooked secretly on the seventh
    story of his house so that he can eat alone. The Master sends Elder Great Moggallana
    to convert him. The Elder appears by supernatural power at the high window, performs
    actions in mid-air, and produces smoke after the treasurer repeatedly says he
    will receive nothing. When the treasurer tries to give only one cake, the dough
    and cakes become miraculously abundant and inseparable. His craving leaves him,
    and he gives the whole basket to the ascetic, who teaches the truth, the Three
    Gems, and the value of charity.
  language: English
  quote_policy: quoted
