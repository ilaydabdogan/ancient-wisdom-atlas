canonical_text:
  quote: ''
  summary: 'The passage concludes a dog-birth Jataka in which dogs vomit leather after
    drinking, the king honors the Bodhisatta, receives moral instruction, protects
    creatures, supports dogs, and is reborn in Deva Heaven. The Master then identifies
    the former birth. The passage then begins the Bhojajaniya-Jataka: the Master addresses
    a monk who has given up persevering, recounting a past life in which the Bodhisatta
    was a royal Sindh horse. Seven kings besiege Benares; a knight uses the horse
    to capture six kings, but the horse is wounded and still insists that only he
    can complete the capture of the seventh king.'
  language: English
  quote_policy: summarized
