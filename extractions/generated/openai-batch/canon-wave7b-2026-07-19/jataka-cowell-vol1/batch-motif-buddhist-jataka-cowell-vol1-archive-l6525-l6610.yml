canonical_text:
  quote: Guile profits not.
  summary: The passage opens the Baka-Jataka with a frame story about a Jetavana monk
    who deceives others in robe exchanges and is then deceived by a country robe-maker.
    The Master identifies this as a repeated pattern from a former time. The past
    story begins with the Bodhisatta as a tree-sprite near a lotus pond, where a crane
    sees fish in a shrinking pond, plans to cajole and eat them, and offers to carry
    them to a larger lotus pond; the fish suspect him and choose a large one-eyed
    fish as a tester.
  language: English
  quote_policy: quoted
