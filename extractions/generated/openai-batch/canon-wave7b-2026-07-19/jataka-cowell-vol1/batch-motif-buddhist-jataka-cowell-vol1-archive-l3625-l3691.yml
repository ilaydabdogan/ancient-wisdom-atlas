canonical_text:
  quote: ''
  summary: The Bodhisatta as King Banyan Deer instructs a king in righteousness, a
    doe warns her fawn to keep Banyan's company rather than Branch Deer's, the king
    upholds a promise not to harm the deer, and Banyan Deer creates a reciprocal rule
    by which deer avoid fields marked with tied leaves. The frame narrative closes
    with the Master preaching the Four Truths and identifying the past-life roles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Great Being establishes the king in the Five Commandments and tells him
    to walk in righteousness and justice toward family, townspeople, and countryfolk.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Great Being teaches the Truth to the king, remains for several days in
    the pleasaunce for instruction, and then returns to the forest with his attendant
    herd.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A doe gives birth to a fawn described as fair like the opening bud of the
    lotus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fawn plays with the Branch deer, and his mother tells him to go only with
    the herd of the Banyan deer.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mother recites a stanza saying death in Banyan's company is preferable
    to a long life with Branch.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The deer, enjoying immunity, eat men's crops, and the men petition the king
    because they do not dare harm or drive away the deer.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The king says he promised the Banyan deer a boon and would give up his kingdom
    rather than break the promise that no one may harm the deer.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Banyan deer gathers his herd and forbids them from eating other people's
    crops.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Banyan deer sends word that farmers should mark fields with tied leaves
    rather than fence them, and deer no longer trespass on fields so marked.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Bodhisatta exhorts his herd throughout life, and both he and the king
    pass away to fare according to their deserts.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Master preaches the Four Truths, links the present and past stories, and
