canonical_text:
  quote: ''
  summary: The Bodhisatta finds that an elephant has no bodily illness and concludes
    that it was morally altered by overhearing burglars. He advises the king to place
    good men, sages, and brahmins in the elephant's stall to speak about goodness.
    The elephant hears them, resolves to be good, and becomes good again. The Master
    then applies the episode to a Brother who follows others and identifies the past-life
    figures.
  language: English
  quote_policy: summarized
