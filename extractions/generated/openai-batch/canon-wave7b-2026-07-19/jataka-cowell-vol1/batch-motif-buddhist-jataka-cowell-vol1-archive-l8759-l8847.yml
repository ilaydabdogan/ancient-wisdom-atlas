canonical_text:
  quote: ''
  summary: In the frame narrative, the Master at Jetavana explains that expert knowledge
    of fruit existed in former days. In the past, the Bodhisatta is a merchant and
    caravan leader who warns his caravan not to eat unfamiliar forest plants. Near
    a village at the forest border, a poisonous What-fruit tree closely resembles
    a mango. Some men eat its fruit, while others wait to consult the leader. The
    Bodhisatta identifies the tree, treats those poisoned, prevents the caravan's
    death, frustrates villagers who expected to loot the dead caravan, explains his
    reasoning, teaches the truth, and completes the journey safely. The Master identifies
    himself as the former caravan leader.
  language: English
  quote_policy: summarized
