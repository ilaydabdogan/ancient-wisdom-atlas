canonical_text:
  quote: '"Through hearing first."'
  summary: 'In the frame story, a monk who has taken vows under the Master is repeatedly
    invited by a disciple of Devadatta to eat rich food at Devadatta''s monastery,
    accepts, and is rebuked for eating food connected with Devadatta''s unrighteous
    gain. The Master says the monk has long been prone to being led away and tells
    a past story: when Brahmadatta ruled Benares, the Bodhisatta was his minister;
    the king''s gentle state elephant Damsel-face overheard burglars repeatedly teaching
    one another cruel criminal methods, interpreted their speech as instruction, became
    violent, killed his mahout and others, and the king sent the Bodhisatta to discover
    what had perverted him.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Prince Ajata-sattu supports Devadatta, builds him a monastery at Gaya-sisa,
    and supplies rich perfumed rice; Devadatta gains honor and a following.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two friends live in Rajagaha; one has taken vows under the Master and the
    other under Devadatta, and they continue to see each other.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The disciple of Devadatta urges the other monk to stop alms-going and come
    to Gaya-sisa for rice-gruel, solid victuals, and soft food.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After repeated pressing, the monk under the Master begins going to Gaya-sisa
    to eat while still returning to the Bamboo-grove at the proper hour.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The monk's friends discover his visits, challenge him about eating food provided
    for Devadatta, rebuke the connection with unrighteous gain, and take him to the
    Master.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Master rejects the monk's excuse, calls Devadatta a man of bad conduct
    and bad principle, says the monk has always been prone to being led away, and
    begins a story of the past.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the past story, Brahmadatta rules in Benares, the Bodhisatta is his minister,
    and the king's state elephant Damsel-face is described as virtuous, good, and
    harmless.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Burglars come near Damsel-face's stall at night and discuss tunneling, breaking
    through walls, carrying off plunder, murder, and abandoning goodness and virtue.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The burglars repeat similar talk on many days; the elephant concludes that
    the talk is meant to instruct him and becomes pitiless, cruel, and violent.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Damsel-face kills his mahout with his trunk and then treats a second, third,
    and every person who comes near him the same way.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When the king hears that Damsel-face has gone mad and is killing people, he
    sends the Bodhisatta to find out what has perverted him.
  category: action
  evidence_refs:
  - ev:8
