canonical_text:
  quote: ''
  summary: The passage recounts the King’s encounter with the learned lay-brother
    Chattapani, the appointment of Ananda to teach the King’s wives, and Ananda’s
    advice for recovering the missing jewel from the King’s turban without distressing
    the palace household. Ananda first proposes a private straw-or-clay return method,
    which fails after three days, and then advises a screened water-pot handwashing
    procedure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A lay-brother named Chattapani sits at the Master's feet listening to teaching;
    the King approaches, bows, and sits to one side.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chattapani does not rise or salute the King because of reverence for the Buddha;
    the King becomes angry, and the Master praises Chattapani's learning and freedom
    from passion.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The King concludes that Chattapani is not an ordinary person and invites him
    to say if he needs anything.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The King asks Chattapani to teach his wives, but Chattapani declines, saying
    that teaching doctrine in the King's harem is the prerogative of the Brethren
    rather than a layman.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The King's wives choose Ananda as their teacher; the Master consents, and
    Ananda begins regularly teaching them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The jewel from the King's turban goes missing, and the King orders ministers
    to search everyone with access to the precincts, including women.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The palace women are dejected because the search for the missing jewel is
    distressing everyone, and Ananda tells them not to think any more about it.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Ananda advises the King to privately give each suspected person a wisp of
    straw or lump of clay and instruct each to place it in a specified place at daybreak,
    so the taker can return the jewel inside it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The King follows the straw-and-clay procedure for three successive days, but
    the jewel is not recovered.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ananda next advises that a large water-pot be filled with water in a secluded
    courtyard corner behind a screen, and that all who frequent the precincts remove
    outer garments and wash their hands there one by one.
  category: speech
  evidence_refs:
  - ev:7
