  summary: 'The Master tells the brethren that a present-day fellow has previously
    been deceived in the same way. He closes the lesson by connecting the story to
    past births: the Jetavana robe-maker was the crane, the country robe-maker was
    the crab, and the Master himself was the Tree-Fairy. An editorial note points
    to other works for migrations of the popular story.'
