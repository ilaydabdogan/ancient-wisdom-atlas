canonical_text:
  quote: ''
  summary: A young man feigns illness from love for a guarded young wife. His mother,
    an old woman with access to the house, defeats the guards by throwing dust from
    a flower-basket and later smuggles him in and out in the basket. The wife admits
    him, deceives her brahmin husband by blindfolding him while he plays the lute,
    and signals the lover to strike him. The lover reports the affair to the king,
    who later exposes the deception during a dice game and recites a stanza presenting
    the episode as a warning about women.
  language: English
  quote_policy: summarized
