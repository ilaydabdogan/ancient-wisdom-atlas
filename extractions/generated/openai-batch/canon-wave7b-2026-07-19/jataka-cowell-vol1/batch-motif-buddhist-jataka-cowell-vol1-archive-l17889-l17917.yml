canonical_text:
  quote: ''
  summary: A lion warns a jackal that only lions can kill elephants and advises him
    to keep eating what the lion kills. The jackal persists, so the lion lets him
    try. After the lion sights an elephant from a peak and calls to the jackal at
    the cave mouth, the jackal bounds from Gold Den, howls three times, and leaps
    at the elephant. He misses the elephant's head, falls at its feet, and is crushed
    and defiled by the elephant. The Bodhisatta comments ironically on the jackal's
    mangled body, and the Master identifies Devadatta as the jackal and himself as
    the lion.
  language: English
  quote_policy: summarized
