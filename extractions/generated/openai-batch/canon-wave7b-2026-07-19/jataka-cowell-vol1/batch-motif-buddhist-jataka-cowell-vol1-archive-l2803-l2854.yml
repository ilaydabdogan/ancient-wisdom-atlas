canonical_text:
  quote: ''
  summary: In the concluding section of the story, a demon praises the Bodhisatta's
    wisdom, releases the Bodhisatta's brothers, receives moral instruction, and is
    converted. After learning by the stars that his father has died, the Bodhisatta
    returns to Benares, takes the kingdom, appoints his brothers to offices, provides
    for the water-sprite, and rules righteously. The frame narrative ends with the
    Buddha identifying the former-birth characters with present figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The demon is pleased with the Bodhisatta and offers to return one of his brothers;
    the Bodhisatta asks for the youngest, and the demon questions this choice as disregard
    for seniority.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bodhisatta explains that the boy's circumstances caused the brothers'
    forest refuge and that he fears blame if the boy were said to have been eaten
    by a demon.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The demon approves of the Bodhisatta's reasoning and brings forth both brothers,
    giving them back to him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Bodhisatta tells the water-sprite that past evil deeds led to his demon
    birth and that continuing evil will keep him from escaping hell and other evil
    states.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Bodhisatta instructs the water-sprite to renounce evil and live virtuously.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After converting the demon, the Bodhisatta remains at that place under the
    water-sprite's protection.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Bodhisatta reads in the stars that his father has died, then returns to
    Benares with the water-sprite and takes possession of the kingdom.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Bodhisatta appoints Prince Moon as viceroy and Prince Sun as generalissimo.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Bodhisatta makes a pleasant home for the water-sprite and arranges for
    him to receive garlands, flowers, and food.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Bodhisatta rules in righteousness until he dies and fares according to
    his deeds.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the frame narrative, the Master preaches the Truths, a Brother wins the
    Fruit of the First Path, and the Buddha identifies the former-birth characters
    with present figures.
  category: sequence
  evidence_refs:
  - ev:7
