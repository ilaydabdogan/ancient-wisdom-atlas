canonical_text:
  quote: ''
  summary: The passage lists four enduring Era-miracles, including the hare sign in
    the moon and the hollow canes around a lake. It then recounts how the Bodhisatta,
    as a monkey-king, and eighty thousand monkeys drank lake water through canes from
    the bank so that a water-ogre could get none of them. The Master explains the
    hollowness of the canes as the result of his own former ordinance and identifies
    the past-birth figures.
  language: English
  quote_policy: summarized
