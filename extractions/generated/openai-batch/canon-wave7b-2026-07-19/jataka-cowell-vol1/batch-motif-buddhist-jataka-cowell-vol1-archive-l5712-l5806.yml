candidate_motifs:
- id: motif:1
  label: virtue leading to divine rebirth
  taxonomy_refs:
  - death_rebirth
  basis: The passage links praised virtues with rebirth in the Realm of the Thirty-three
    as Sakka, king of Devas.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage presents the rebirth causally in narrative terms, but the
    extracted motif label is a generalized description.
- id: motif:2
  label: cosmic mountain with tiered divine and asura realms
  taxonomy_refs:
  - cosmic_mountain
  - ascent
  basis: Mount Sineru contains the lowest-level Asura Realm, while the Asuras climb
    its sides toward the Realm of the Thirty-three.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage gives only part of the wider cosmography.
- id: motif:3
  label: expulsion from heaven to a lower rival realm
  taxonomy_refs: []
  basis: Sakka intoxicates the Asuras and has them thrown down from the Realm of the
    Thirty-three to the Asura Realm.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The act is presented as political conflict rather than as a formal divine
    judgment.
- id: motif:4
  label: self-sacrifice to save small creatures
  taxonomy_refs:
  - sacrifice
  basis: Sakka refuses to destroy the young Garulas for empire's sake and states he
    will offer his life as a sacrifice to the Asuras so the birds are not harmed.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The sacrifice is offered or declared; Sakka is not actually killed in
    the passage.
- id: motif:5
  label: compassionate reversal becomes victory
  taxonomy_refs: []
  basis: Sakka's chariot turns back to spare the Garulas; the Asuras misinterpret
    the turn as a sign of reinforcements and flee.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage does not explicitly call this strategy; the victory results
    from the Asuras' misunderstanding.
- id: motif:6
  label: merit and lack of merit reflected in rebirth and heavenly forms
  taxonomy_refs:
  - death_rebirth
  - sacred_exchange
  basis: Goodness, Thoughtful, and Joy receive handmaiden rebirths and heavenly places
    linked to prior acts, while Highborn, lacking merit, is reborn as a crane.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The label 'sacred_exchange' is used cautiously for merit-result reciprocity,
    not for a negotiated exchange.
- id: motif:7
  label: guarded boundary between rival realms
  taxonomy_refs: []
  basis: After Sakka's victory, guards are set in five places between the cities to
    prevent the Asuras from returning.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The wider significance of the five guardian classes is not developed within
    this passage.
comparison_claims:
- id: claim:1
  claim: The passage's editorial note explicitly identifies Sakka with Indra of the
    pre-Buddhist faith while also noting that every world-system has its own Sakka.
  claim_level: same_function
  target: Indra of the pre-Buddhist faith
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: high
  limitations: This is an edition note within the passage, not an independent historical
    argument; it also qualifies the identification by describing multiple Sakkas across
    world-systems.
- id: claim:2
  claim: The tiered Mount Sineru setting supports comparison with a cosmic-mountain
    motif family in which vertical movement links divine and rival lower realms.
  claim_level: same_motif
  target: cosmic_mountain motif family
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives a specific Buddhist cosmological instance and does
    not by itself establish historical relationships with other cosmic-mountain traditions.
- id: claim:3
  claim: Sakka's stated willingness to give his life so the Garula nestlings are not
    destroyed supports comparison with a self-sacrificial protection motif.
  claim_level: same_motif
  target: sacrifice motif family
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The passage records a willingness to sacrifice rather than an actual
    death.
