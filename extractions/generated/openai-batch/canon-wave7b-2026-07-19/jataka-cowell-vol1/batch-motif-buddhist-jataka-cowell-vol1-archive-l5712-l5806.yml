canonical_text:
  quote: ''
  summary: The passage praises virtues and says the virtuous being is reborn as Sakka
    in the Realm of the Thirty-three. Sakka expels the Asuras from that realm to the
    Asura Realm on Mount Sineru. When the Asuras attack, Sakka flees in his Chariot
    of Victory, but turns back to avoid killing young Garulas in the Silk-Cotton Forest,
    offering his own life instead. The Asuras mistake his return for the arrival of
    reinforcements and flee. A Palace of Victory rises, guards are placed, and several
    figures are reborn with results corresponding to merit or lack of merit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening stanza praises supporting parents, honoring age, gentle and truthful
    speech, freedom from slander, generosity, and mastery over wrath.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the close of life, the praiseworthy being is reborn in the Realm of the
    Thirty-three as Sakka, king of Devas, and his friends are also reborn there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Asuras are described as dwelling in the Realm of the Thirty-three before Sakka
    decides that a shared kingdom is undesirable.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sakka makes the Asuras drink the liquor of the Devas and, when they are drunk,
    has them hurled by the feet down to the Asura Realm on Mount Sineru.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Asura Realm is described as a region on the lowest level of Mount Sineru,
    equal in extent to the Realm of the Thirty-three, with a Pied Trumpet-flower tree
    rather than the Devas' Coral Tree.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Asuras recognize they are not in the Deva realm, accuse Sakka of making
    them drunk and seizing their city, and climb Mount Sineru to win the realm back
    by force.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sakka goes out into the great deep to fight the Asuras, is worsted, and flees
    in his Chariot of Victory.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: As Sakka's chariot passes through the Forest of the Silk-Cotton Trees, the
    trees are mowed down and the young Garulas cry out in fear.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Matali explains to Sakka that the noise is the united cry of young Garulas
    whose forest is being uprooted by the chariot.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Sakka says he will not destroy life for the sake of empire, offers his life
    to the Asuras for the birds' sake, and orders Matali to turn the chariot back.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: When Matali turns the chariot, the Asuras think other Sakkas are coming as
    reinforcements, flee in fear, and return to the Asura Realm.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Sakka enters heaven, the Palace of Victory rises through the earth, and guards
    are set in five places to prevent the Asuras from returning.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The fivefold guard is said to consist of Nagas, Garulas, Kumbhandas, Goblins,
    and the Four Great Kings.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: Goodness is reborn as Sakka's handmaiden, and the effect of her gift of the
    pinnacle is the arising of a jeweled mansion named Goodness.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: Thoughtful and Joy are reborn as Sakka's handmaidens, with a creeper-grove
    and a tank respectively arising as fruits of their prior actions.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: Highborn, having performed no act of merit, is reborn as a crane in a grotto
    in the forest.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: A footnote identifies the Realm of the Thirty-three as a devaloka and identifies
    Sakka with Indra of the pre-Buddhist faith, while adding that every world-system
    has its own Sakka.
  category: other
  evidence_refs:
  - ev:13
