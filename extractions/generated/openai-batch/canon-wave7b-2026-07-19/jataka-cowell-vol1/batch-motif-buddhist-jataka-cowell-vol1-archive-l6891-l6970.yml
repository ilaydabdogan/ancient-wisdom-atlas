canonical_text:
  quote: ''
  summary: A fairy who dwells over a gateway appears at night to the impoverished
    merchant Anatha-pindika and advises him to stop supporting Gotama Buddha and the
    Order. The merchant rebukes her, declares his faith steadfast, and expels her.
    The fairy leaves with her children and seeks help from the city deity, the Four
    Great Regents, and Sakka. All condemn her words; Sakka tells her to atone by recovering
    debts, lost treasure, and unowned wealth for the merchant. She obeys, recovers
    the money, and returns to the merchant's chamber at night.
  language: English
  quote_policy: summarized
