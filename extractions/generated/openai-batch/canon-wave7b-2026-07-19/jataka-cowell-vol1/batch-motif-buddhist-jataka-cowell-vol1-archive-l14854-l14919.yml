canonical_text:
  quote: ''
  summary: At Jetavana, the Master addresses a Brother who is in love with a fat girl
    and says that she led him astray in a former birth as well. In the past, during
    Brahmadatta's reign in Benares, the Bodhisatta returns to a hermitage and finds
    his son neglecting duties after a woman has tried to lure him away. The father
    permits the son to leave but warns him to remember the hermitage if the woman
    makes him run errands. The son goes with her, is made to fetch whatever she wants,
    feels like a slave, and returns to his father. The Bodhisatta teaches him kindness,
    mercy, right feeling, and Insight; the young man gains Knowledges and Attainments,
    and he and his father are reborn in the Brahma Realm. The Master identifies the
    present fat girl with the woman of the past, the Brother with the son, and himself
    with the father.
  language: English
  quote_policy: summarized
