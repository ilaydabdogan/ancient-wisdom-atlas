canonical_text:
  quote: ''
  summary: The king of Benares is fond of hunting, so his subjects drive deer into
    the royal pleasaunce. The king grants immunity to two golden deer, but other deer
    are killed regularly. The Bodhisatta arranges that deer go to the execution block
    by turns to avoid unnecessary wounding. When a pregnant doe’s turn comes and Branch
    refuses to postpone it, the Bodhisatta takes her place. The king, moved by this
    act, spares the Bodhisatta, the doe, all deer, four-footed creatures, birds, and
    fishes.
  language: English
  quote_policy: summarized
