canonical_text:
  quote: ''
  summary: In the frame story, the Master says Devadatta was a liar in the past as
    in the present. In the past story, a drunken jackal exploits a greedy brahmin's
    desire for gold to be carried out of Benares, humiliates him by soiling his robe,
    and flees. The Bodhisatta, as a Tree-sprite in a cemetery grove, reveals the deception
    and instructs the brahmin to wash and leave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Brethren discuss Devadatta as leading followers into error, lying, and
    breaking up the Brotherhood.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master states that Devadatta was also a liar in past times and begins
    a story of the past.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: When Brahmadatta reigns in Benares, the Bodhisatta is born as a Tree-sprite
    in a cemetery grove.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: During a festival in Benares, people prepare sacrifices to ogres by placing
    fish, meat, and strong drink in multiple places.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At midnight a jackal enters the town through the sewer, consumes meat and
    liquor, and falls asleep in bushes until morning.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After waking in daylight, the jackal hides near the roadside because he thinks
    he cannot safely return then.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The jackal sees a solitary brahmin, thinks brahmins are greedy, and calls
    to him with a human voice.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The jackal promises the brahmin two hundred gold pieces if the brahmin hides
    him in his clothing and carries him out of the city unseen.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The brahmin accepts the offer, hides the jackal in his waist-cloth under his
    outer robe, and carries him outside the city and onward to the cremation-park.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The jackal orders the brahmin to spread out his robe and dig up a tree, then
    soils the robe in five places and escapes into the wood.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Bodhisatta speaks from the fork of the tree, saying the drunken jackal
    has cheated the brahmin and that no promised gold will be found.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Bodhisatta tells the brahmin to wash his robe, bathe, and go about his
    business; the brahmin departs mortified.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Master identifies Devadatta as the jackal of the past and himself as the
    Tree-sprite.
  category: relationship
  evidence_refs:
  - ev:7
