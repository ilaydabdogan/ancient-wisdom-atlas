canonical_text:
  quote: ''
  summary: 'The passage frames the Apannaka-Jataka with the Blessed One teaching about
    true and false refuge, then introduces a past story in Benares: the Bodhisatta
    is a prudent merchant with five hundred carts, while another young merchant is
    foolish. To avoid the difficulties of two large caravans travelling together,
    the Bodhisatta lets the other merchant choose whether to go first or last. The
    foolish merchant chooses to go first, while the Bodhisatta sees practical advantages
    in travelling later.'
  language: English
  quote_policy: summarized
