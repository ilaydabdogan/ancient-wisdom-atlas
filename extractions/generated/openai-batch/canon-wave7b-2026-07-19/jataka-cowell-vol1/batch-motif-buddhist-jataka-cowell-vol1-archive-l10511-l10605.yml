canonical_text:
  quote: '"I have conquered ! I have conquered !"'
  summary: The frame story tells of Cittahattha-Sariputta, who repeatedly leaves and
    rejoins the Brotherhood before attaining Arahatship. The Master explains the difficulty
    of taming the heart and narrates a former birth in which the Bodhisatta, as the
    gardener Spade Sage, repeatedly renounces the world but returns because of attachment
    to his spade. On the seventh attempt he throws the spade into a river, declares
    conquest, gains Insight by concentrating on water, rises into the air, and teaches
    the King of Benares that conquest of inner lusts is superior to military victory.
  language: English
  quote_policy: quoted
