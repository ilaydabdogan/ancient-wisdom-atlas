canonical_text:
  quote: ''
  summary: In the Tayodhamma-Jataka, Devadatta is reborn as a monkey lord who mutilates
    his male offspring to prevent them from replacing him. The Bodhisatta's mother
    hides before his birth, and the Bodhisatta later grows strong and seeks his father.
    The father first tries to crush him in a false embrace, then sends him to collect
    lotuses from a lake inhabited by an ogre. The Bodhisatta reads the tracks at the
    lake, avoids entering the water, gathers the flowers by leaping across the lake,
    and wins the ogre's admiration and help. When the father sees the plot fail, he
    dies, and the monkeys choose the Bodhisatta as king.
  language: English
  quote_policy: summarized
