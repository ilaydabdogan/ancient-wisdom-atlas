canonical_text:
  quote: Water is used to quench fire; but here is the water itself on fire.
  summary: A monk whose hut burns down fails in meditation for lack of shelter, and
    the Master tells a past-birth tale in which the Bodhisatta, as king of birds,
    recognizes danger when a Naga makes lake-water boil and flame beneath the birds'
    tree; obedient birds depart and survive, while disobedient birds perish. The passage
    then gives two brief Jataka episodes in which the Bodhisatta dies after terse
    doctrinal words, returns from a radiant realm to clarify them from mid-air, praises
    the chief disciple, and returns to the Brahma Realm.
  language: English
  quote_policy: quoted
