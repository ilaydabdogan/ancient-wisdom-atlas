canonical_text:
  quote: ''
  summary: In a former birth as a young quail, the Bodhisatta recalls the Buddhas
    of the past and performs an Act of Truth. He addresses Fire as Jataveda and asks
    it to turn back. The flames retreat sixteen lengths and go out like fire quenched
    by water; the spot remains unburned for an aeon and is called an aeon-miracle.
    The Master explains the event to the brethren, preaches the Truths, and identifies
    the former birth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bodhisatta says he should call to mind the Buddhas of the past, their
    efficacy, and his true belief, and by an Act of Truth make the flames go back
    to save himself and the other birds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Verses state that goodness, truth, compassion, and purity of life have saving
    grace, and that an Act of Truth is wrought while remembering faith and past victors.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Bodhisatta performs an Act of Truth in the name of the true faith in him
    and repeats a stanza addressing the Lord of Fire as Jataveda.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The stanza describes the speaker as lying with wings that cannot yet fly,
    feet that cannot yet walk, and parents who have forsaken him.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the Act of Truth is performed, Jataveda goes back sixteen lengths; the
    flames do not continue through the forest but go out at that place.
