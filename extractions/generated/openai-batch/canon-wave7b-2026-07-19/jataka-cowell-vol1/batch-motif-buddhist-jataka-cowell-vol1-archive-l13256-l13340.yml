canonical_text:
  quote: ''
  summary: The Master tells a Jataka about a deceitful matted-haired ascetic who steals
    gold entrusted to him by a village squire, then feigns scrupulous honesty by returning
    a straw. The Bodhisatta detects the deception, helps recover the gold, rebukes
    the ascetic, and the Master identifies the present knavish Brother with the former
    ascetic.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master, while at Jetavana, tells a story about a knave; the passage says
    further details of that knavery are to be related in another Jataka.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: During Brahmadatta's reign in Benares, a matted-haired ascetic lives near
    a village; the village squire builds him a forest hermitage and provides food
    for him.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The squire buries a hundred pieces of gold at the hermitage and asks the ascetic
    to watch over them; the ascetic replies that hermits do not covet other people's
    goods.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ascetic secretly removes the gold, buries it by the wayside, and later
    tells the squire he must depart because long residence in one place is improper
    for ascetics.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After leaving, the ascetic returns with a straw in his matted hair and says
    he is returning it because hermits may not take anything not bestowed on them;
    the squire becomes more delighted with him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Bodhisatta, travelling for trade and halted at the village, hears the
    ascetic's statement and suspects that the ascetic has robbed the squire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The squire checks the hermitage and finds the money gone; the Bodhisatta says
    the thief is the long-haired ascetic and they pursue him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: After the ascetic is caught and beaten, he reveals where the money is hidden;
    the gold is recovered and the Bodhisatta rebukes him for being careful about the
    straw but careless about the gold.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: At the end, the Master says the present knavish Brother was also knavish in
    the past and identifies him as the former ascetic, while identifying himself as
    the wise and good man.
  category: relationship
  evidence_refs:
  - ev:9
