canonical_text:
  quote: ''
  summary: The Master addresses a monastic lodging dispute in which Sariputta and
    other elders were left without quarters. He teaches that seniority, not birth,
    wealth, textual mastery, or meditative attainment, is the basis for precedence
    in lodging, water, rice, salutation, and service. He then introduces a past-life
    animal story in which a partridge, monkey, and elephant near a Himalayan banyan
    tree decide to find their senior and honor him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The story is introduced as one told by the Master on the way to Savatthi concerning
    Elder Sariputta being kept out of a night's lodging.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The disciples or adherents of the Six hurried ahead and monopolized the available
    lodgings, distributing them among their superiors, teachers, and themselves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The elders found no quarters for the night, and Sariputta spent the night
    without lodging at the foot of a tree near the Master's quarters, either walking
    or sitting there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At dawn the Master questioned Sariputta and later convened the Brethren; the
    Brethren confirmed that adherents of the Six had kept elders from lodging.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: When asked who deserved the best lodging, water, and rice, the Brethren proposed
    criteria including former noble birth, brahmin status, wealth, mastery of rules
    or doctrine, meditative ecstasies, paths of salvation, great truths, and higher
    knowledges.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The Master rejected those proposed criteria and stated that seniority is the
    standard for respect, salutation, service, and access to the best lodging, water,
    and rice.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Master identified Sariputta as his chief disciple, one who deserved lodging
    next after himself, yet Sariputta had spent the night without lodging at the foot
    of a tree.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: For further instruction, the Master said that animals in the past decided
    to identify their senior and show him reverence, and that they later passed to
    heaven.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the past story, a partridge, a monkey, and an elephant lived as three friends
    near a great banyan tree on the slopes of the Himalayas.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The three animal friends lacked respect, subordination, and ordering of common
    life, then decided to find out which of them was senior and honor him.
  category: action
  evidence_refs:
  - ev:7
