canonical_text:
  quote: ''
  summary: In the frame narrative, monks discuss Devadatta’s repeated attempts to
    kill the Buddha. The Master says Devadatta tried to kill him in former times as
    well and tells of a past birth in which the Bodhisatta was an antelope living
    on forest fruit. A hunter hides on a platform in a fruit tree, drops fruit to
    lure the antelope, and throws a javelin when detected. The antelope escapes and
    warns the hunter of the painful karmic result of his conduct. The Master identifies
    Devadatta with the hunter and himself with the antelope.
  language: English
  quote_policy: summarized
