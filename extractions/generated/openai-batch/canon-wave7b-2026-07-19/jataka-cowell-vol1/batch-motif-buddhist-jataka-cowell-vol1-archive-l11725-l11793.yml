canonical_text:
  quote: ''
  summary: 'A king reports successive dreams: rice in one pot cooking unevenly, sour
    buttermilk exchanged for very valuable sandalwood, empty pumpkins sinking in water,
    and great rocks floating on water. The interpreter explains the first three as
    future signs of unrighteous rulers, social and religious corruption, disordered
    weather and crops, the selling of doctrine for material gain, and the elevation
    of low-born or wicked counsel over noble or modest counsel. The answer to the
    thirteenth dream is not included in this passage.'
  language: English
  quote_policy: summarized
