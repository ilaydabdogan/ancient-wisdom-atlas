canonical_text:
  quote: ''
  summary: Sakka locates Highborn across successive rebirths, instructs her in the
    Five Commandments, tests her conduct through disguises, rewards her with golden
    cucumbers, and later is chosen by her in an Asura husband-selection assembly.
    The Master then applies the story as a lesson against harming living creatures
    and identifies the former births.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sakka looks for Highborn, finds where she has been reborn, brings her to heaven,
    and shows her the city of the Devas and several named heavenly places.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sakka says three others have been reborn as his handmaidens because of good
    works, while Highborn has been reborn in the brute creation because she did no
    good work; he exhorts her to keep the Five Commandments and then releases her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sakka later lies before Highborn in the shape of a fish; when the crane realizes
    the fish is alive, she lets it go, and Sakka approves her conduct.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After dying as a crane, Highborn is reborn into a potter's family in Benares.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sakka, disguised as an old man, brings a cart of cucumbers made of solid gold
    and says he will give them only to those who keep the Commandments; Highborn says
    she keeps them, and he leaves the cucumbers and cart at her door.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Highborn continues keeping the Commandments throughout life and after death
    is reborn as the daughter of the Asura king Vepacittiya, with great beauty.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Vepacittiya gathers the Asuras so his daughter can choose a husband; Sakka
    comes in the shape of an Asura, and Highborn chooses him because of love from
    a previous existence.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sakka carries Highborn to the city of the Devas and makes her chief of twenty-five
    million dancing-girls.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Master rebukes a Brother for drinking unstrained water containing living
    creatures and identifies Ananda as Matali the charioteer and himself as Sakka
    in the former birth.
  category: speech
  evidence_refs:
  - ev:5
