canonical_text:
  quote: ''
  summary: The Master tells a Jataka about Anatha-pindika and an ungrateful border
    merchant. A border merchant first receives generous hospitality and fair exchange
    through Anatha-pindika, but later refuses comparable hospitality to Anatha-pindika's
    people. When the border merchant sends another caravan, Anatha-pindika's people
    retaliate by stripping and immobilizing it. The Master says the same disposition
    occurred in the past, when the Bodhisatta was a wealthy merchant in Benares; the
    Bodhisatta teaches that an ungrateful person will find no helper in need. The
    Master identifies the present border merchant with the past one and himself with
    the merchant of Benares.
  language: English
  quote_policy: summarized
