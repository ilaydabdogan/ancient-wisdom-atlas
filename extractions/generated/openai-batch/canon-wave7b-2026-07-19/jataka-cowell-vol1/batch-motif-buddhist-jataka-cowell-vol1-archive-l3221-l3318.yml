canonical_text:
  quote: ''
  summary: 'The passage closes one Jataka by identifying present figures with their
    former births, then begins the Lakkhana-Jataka. In the introductory frame, Devadatta
    has led five hundred brethren away in schism, and the Master sends Sariputta to
    teach them and bring them back. The brethren praise Sariputta’s return with the
    recovered following and contrast it with Devadatta’s loss. The Master says this
    pattern also occurred in the past and begins the former-birth story: the Bodhisatta
    was born as an aged stag, leader of a thousand deer, who entrusted five hundred
    deer each to his sons Luckie and Blackie. At harvest-time, when traps and ambushes
    make the lowland route dangerous, the Bodhisatta instructs the sons to take their
    herds to the mountainous forest tracts and return after harvest; the excerpt ends
    by noting that men lie in wait along the route and that Blackie is ignorant of
    proper travel times and resting places.'
  language: English
  quote_policy: summarized
