canonical_text:
  quote: ''
  summary: Sariputta foresees that Losaka Tissa will die that day and tries to ensure
    he eats. Ordinary alms fail, sent food is forgotten and eaten by others, and Sariputta
    finally obtains sweet foods from the king. Sariputta holds the bowl himself so
    the food will not vanish, and Losaka eats, is satisfied, and dies by a death described
    as ending existence forever. The Buddha watches the cremation and a shrine is
    built for the ashes. The brethren ask how Losaka could be both unlucky and an
    Arahat; the Master explains that his own past actions caused both his lack of
    support and his attainment through meditation on sorrow, transitoriness, and non-self.
    The passage then begins the past-life story in the days of Buddha Kassapa, involving
    a resident Brother, a country squire, and a visiting Arahat elder.
  language: English
  quote_policy: summarized
