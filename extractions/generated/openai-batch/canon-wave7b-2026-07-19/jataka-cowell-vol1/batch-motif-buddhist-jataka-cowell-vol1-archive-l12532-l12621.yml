    him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the sound of the martial drum and the sight of the battlefield, Bhimasena
    trembles with fear, and the Bodhisatta ties a cord around him to keep him from
    falling off the elephant.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Bhimasena is so afraid of death that he fouls the elephant's back.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Bodhisatta rebukes Bhimasena in a stanza that contrasts his former boasting
