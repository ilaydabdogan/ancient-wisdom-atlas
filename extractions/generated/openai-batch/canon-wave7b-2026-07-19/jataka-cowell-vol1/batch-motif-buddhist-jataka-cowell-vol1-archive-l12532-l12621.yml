canonical_text:
  quote: ''
  summary: The Bodhisatta advises Bhimasena how to gain credit for killing a dangerous
    tiger and later a buffalo without facing them directly. After receiving royal
    rewards, Bhimasena grows proud and rejects the Bodhisatta's counsel. When sent
    against a hostile king, Bhimasena panics on an armoured war-elephant, while the
    Bodhisatta protects him, rebukes him, enters battle, captures the hostile king
    alive, and gains fame. The frame identifies the braggart Brother with Bhimasena
    and the Master with the Sage Little Bowman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bodhisatta tells Bhimasena not to approach the tiger's lair alone, but
    to gather many countryfolk with bows, hide when the tiger is aroused, and let
    the countryfolk kill it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bodhisatta instructs Bhimasena to approach the dead tiger with a creeper
    and claim he had intended to lead the tiger to the king alive.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bhimasena follows the plan, reports to the king that he killed the tiger,
    and is rewarded after the road is made safe for travellers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bhimasena later kills a buffalo in the same way and receives more money from
    the king.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After gaining honours, Bhimasena treats the Bodhisatta with contempt and says
    he can get on without him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: A hostile king besieges Benares and demands that its king either surrender
    the kingdom or do battle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king of Benares orders Bhimasena to fight; Bhimasena is armed and mounted
