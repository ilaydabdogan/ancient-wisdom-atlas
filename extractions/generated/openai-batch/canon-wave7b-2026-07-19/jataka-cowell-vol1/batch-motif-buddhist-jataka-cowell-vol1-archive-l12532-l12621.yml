  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Bodhisatta reassures Bhimasena, sends him home, enters the battle, breaks
    through the hostile king's camp, captures the hostile king alive, and brings him
    to Benares.
  category: action
  evidence_refs:
  - ev:8
