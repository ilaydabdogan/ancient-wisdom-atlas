canonical_text:
  quote: ''
  summary: At Jetavana, the Master hears the Brethren praise Sariputta for explaining
    a terse saying and says Sariputta did the same in a former birth. In the past,
    the Bodhisatta, a northern brahmin hermit in the Himalayas, dies after saying
    he has won “Nothing” and is reborn in the Brahma Realm. His disciples misunderstand
    the statement and withhold customary cremation honours. The chief disciple explains
    that the statement referred to insight into the Nothingness of Things, but the
    others do not believe him. The Bodhisatta returns from the Brahma Realm, appears
    in mid-air above the hermitage, praises the wise hearer who understands, rebukes
    the hermits, and returns to the Brahma Realm. The Master identifies Sariputta
    as the former chief disciple and himself as Maha-Brahma.
  language: English
  quote_policy: summarized
