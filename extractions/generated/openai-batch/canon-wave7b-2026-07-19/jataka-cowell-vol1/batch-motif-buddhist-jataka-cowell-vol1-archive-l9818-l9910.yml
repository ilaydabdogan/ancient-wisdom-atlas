  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Bodhisatta makes a fire for her, gives her fruits, asks about her home
    and fall into the river, and lets her stay in the hermitage while he remains outside.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: When told to depart, the girl stays with the intention of making the ascetic
    fall in love with her; he loses his Insight and continues to live with her in
    the forest.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Because she dislikes solitude, he takes her to a border village, supports
    her by selling dates, and becomes known as the Date-Sage; villagers give him a
    hut and pay him for advice about lucky and unlucky seasons.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Robbers from the mountains raid the border village, loot it, and take the
    treasurer's daughter with the villagers' belongings to their own abodes.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The robbers release everyone else, but the robber chieftain takes the girl
    as his wife because of her beauty.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Bodhisatta expects the girl to escape and return to him, so he waits for
    her.
  category: other
  evidence_refs:
  - ev:12
- id: obs:13
  text: The girl is happy with the robbers, fears that the Date-Sage will come for
