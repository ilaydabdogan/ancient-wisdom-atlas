canonical_text:
  quote: ''
  summary: In a Jataka frame, the Master addresses a passion-troubled monk and tells
    of a past life in which the Bodhisatta lived as an anchorite by the Ganges. A
    cruel treasurer's daughter is thrown into the river by her attendants during a
    storm. The Bodhisatta rescues, warms, feeds, and shelters her. She refuses to
    leave, makes him fall in love, and he loses his Insight. They live together in
    a border village, where he is known as the Date-Sage. Mountain robbers raid the
    village, carry her away, and the robber chieftain takes her as wife. She is happy
    there, fears the Date-Sage will reclaim her, and sends a false message of distress
    to lure him to his death. When he comes, she hides him and tells the drunken chieftain
    that his rival is in the next room.
  language: English
  quote_policy: summarized
