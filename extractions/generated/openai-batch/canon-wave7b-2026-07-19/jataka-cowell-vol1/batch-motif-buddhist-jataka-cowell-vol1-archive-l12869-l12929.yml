canonical_text:
  quote: '"Seek Health, the supreme good; be virtuous;"'
  summary: 'After a brief closing identification from a preceding birth story, the
    passage presents a Jataka frame at Jetavana. A wealthy Treasurer’s seven-year-old
    son asks about paths leading to spiritual welfare. The father cannot answer and
    brings the boy with offerings to the Buddha. The Master says the same child had
    asked this in a former birth but forgot through change of birth. In the past at
    Benares, the Bodhisatta, as a wealthy Treasurer, answers his son with a sixfold
    instruction: seek health, be virtuous, listen to elders, learn from scriptures,
    conform to truth, and break attachment. The boy follows these rules; the Bodhisatta
    lives charitably and dies to fare according to his deserts. The Master identifies
    the present child with the former child and himself with the Lord Treasurer.'
  language: English
  quote_policy: quoted
