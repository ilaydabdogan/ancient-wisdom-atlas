canonical_text:
  quote: As he lies couched on earth, he lifeless seems.
  summary: In the frame narrative, the Brethren praise Rahula for observing rules,
    and the Master says Rahula showed this quality in a former animal birth. In the
    past story, the Bodhisatta is born as a stag and teaches his nephew the ruses
    of deer. When the young stag is caught in a snare, he applies these ruses by lying
    rigid and corpse-like, using breath control and other bodily signs to appear dead.
  language: English
  quote_policy: quoted
