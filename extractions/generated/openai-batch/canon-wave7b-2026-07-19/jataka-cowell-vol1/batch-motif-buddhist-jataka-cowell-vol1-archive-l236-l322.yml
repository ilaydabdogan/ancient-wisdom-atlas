canonical_text:
  quote: ''
  summary: The preface describes the Jataka collection as both Buddhist literature
    and a body of widely circulating folklore. It summarizes the collection's structure,
    including present-life frame stories, past-birth narratives, final identifications
    of actors across births, and gatha verses. It also discusses variant transmission
    through commentaries, possible older verse kernels, and the Ceylonese tradition
    of Singhalese commentary translated into Pali.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes birth-stories dependent on Buddhist custom or ideas
    from many stories described as pieces of folklore that have circulated widely.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The same stories are described as being used under different aspects: merry
    tales, Arthurian embellishment, Buddhist discourse, or medieval Christian discourse.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that Chaucer places a Jataka story in the mouth of the
    Pardoner and that another appears in Herodotus in connection with Megacles, Cleisthenes'
    daughter, and Hippocleides.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Pali Jataka work is described as containing 550 Birth-stories arranged
    in 22 nipatas or books.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The division of the books is said to be roughly based on the number of gathas
    or verses quoted in each story.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Each story is said to open with a paccuppannavatthu, a story of the present,
    relating the circumstance in the Buddha's life that led him to tell the birth-story.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The birth-story is described as revealing an event from the Buddha's previous
    existences as a bodhisatta destined for Buddha-ship.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: At the end of each story, the Buddha identifies the actors in the story with
    their present births at the time of his discourse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: The passage states that the Buddha can remember past events in every being's
    previous existences as well as in his own, and it compares this power with one
    claimed by Pythagoras.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:10
  text: Every story is said to be illustrated by one or more gathas, usually uttered
    by the Buddha while still a Bodhisatta, with some verses placed in his mouth as
    the Buddha and called abhisamhuddha-gatha.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:11
  text: Some Jataka stanzas are said to occur in the Dhammapada, and many Jataka stories
    occur in an old commentary on that book with varying details and sometimes different
    associated verses.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:12
  text: The passage states that the gathas are more archaic than the stories and presents
    the view that the verses were the older kernel of the work.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:13
  text: The passage compares the prose explanations of the verses to oral commentary
    accompanying proverbial sayings and notes that a birth-story may be repeated elsewhere
    with variations.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:14
  text: The passage reports a Ceylonese tradition that the original Jataka Book consisted
    only of gathas, with a Singhalese commentary later translated into Pali by Buddhaghosa,
    after which the Singhalese original was lost.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:15
  text: A footnote gives a proverbial reference to Pingala in the Sankhya Aphorisms
    and says it is explained by Jataka 330 and also referred to in the Mahabharata.
  category: relationship
  evidence_refs:
  - ev:5
