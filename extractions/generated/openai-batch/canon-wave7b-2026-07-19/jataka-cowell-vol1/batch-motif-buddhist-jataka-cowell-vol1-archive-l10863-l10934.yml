- id: obs:2
  text: The Bodhisatta, in elephant form, hears the forester's cries, is moved by
    compassion, and resolves to help him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The forester initially runs away from the elephant in terror; the elephant
    repeatedly halts when the man runs and advances when the man stands still, leading
    the man to conclude that the elephant intends help rather than harm.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The elephant asks the forester why he is wandering and lamenting, and the
