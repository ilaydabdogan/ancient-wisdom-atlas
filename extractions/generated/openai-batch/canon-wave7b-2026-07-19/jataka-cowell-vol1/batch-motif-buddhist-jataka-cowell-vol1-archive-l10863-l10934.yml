canonical_text:
  quote: '"may my gift of these to you bring me omniscience"'
  summary: A forester from Benares becomes lost in a Himalayan forest. A Bodhisatta
    in elephant form rescues him, hosts him, guides him back to human settlement,
    and asks him not to reveal the elephant's abode. The forester later uses remembered
    landmarks to return with a saw and request ivory. The Bodhisatta allows his tusks
    to be cut off and gives them as a gift directed toward omniscience. After selling
    the tusks, the forester returns for more ivory and then asks for the stumps of
    the tusks.
  language: English
  quote_policy: quoted
