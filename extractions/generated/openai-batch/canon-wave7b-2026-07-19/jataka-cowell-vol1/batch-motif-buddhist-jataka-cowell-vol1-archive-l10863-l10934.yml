    is worth much more than a dead elephant's tusk.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The forester returns to the Bodhisatta's dwelling with provisions and a sharp
    saw, claims he cannot make a living, and asks for a piece of the elephant's tusk
    to sell.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Bodhisatta agrees to give a tusk if the forester has a saw, then tells
