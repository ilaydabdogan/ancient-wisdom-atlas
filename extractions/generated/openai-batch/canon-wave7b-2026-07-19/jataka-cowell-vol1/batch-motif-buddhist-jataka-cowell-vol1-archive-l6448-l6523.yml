canonical_text:
  quote: ''
  summary: A partridge, monkey, and elephant determine their relative seniority by
    comparing how long each has known a banyan tree. The partridge proves oldest because
    it had eaten seeds from an earlier banyan and voided them where the present tree
    began. The monkey and elephant honour the partridge, accept his counsel, and all
    three keep the Commandments, securing rebirth in heaven. The Buddha applies the
    story to monastic respect for seniority and identifies the former births.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The partridge, monkey, and elephant sit together at the foot of a banyan tree
    while considering which of them is oldest.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elephant says that when he was a baby the banyan was a bush small enough
    for him to walk over, with branches reaching his belly.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The monkey says that when he was young he could sit on the ground and eat
    the topmost sprouts of the banyan by stretching his neck.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The partridge says he ate seeds from an older banyan elsewhere and voided
    them at the present spot, causing the origin of this tree.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The monkey and elephant acknowledge the partridge as oldest and promise him
    honour, veneration, homage, respect, salutation, and obedience to his counsels.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The partridge gives counsel, establishes the three animals in the Commandments,
    and also undertakes to keep them himself.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The three animals live with respect, subordination, and proper ordering of
    common life, and are said to secure rebirth in heaven after death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Master ordains that seniority should receive respect in word and deed,
    salutation, service, and priority in lodging, water, and rice.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Master states a stanza that those who honour age are versed in Truth and
