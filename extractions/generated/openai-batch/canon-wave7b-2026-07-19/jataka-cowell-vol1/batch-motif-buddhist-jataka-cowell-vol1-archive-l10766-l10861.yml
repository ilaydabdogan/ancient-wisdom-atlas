canonical_text:
  quote: ''
  summary: 'The passage first tells of the Bodhisatta as a renowned teacher at Takkasila
    whose pupils are prevented from travelling to a feast because a lazy pupil, after
    delaying his firewood gathering, brings green wood that prevents the morning cooking
    fire from lighting. The teacher turns the mishap into a lesson on deferred tasks
    and the frame identifies the past-life figures. The passage then begins the Silavanaga-Jataka:
    the Brethren discuss Devadatta''s ingratitude, the Master says this has happened
    before, and the Bodhisatta is born as a beautiful white elephant who becomes leader
    of a vast herd before withdrawing into solitary forest life because of sin in
    the herd.'
  language: English
  quote_policy: summarized
