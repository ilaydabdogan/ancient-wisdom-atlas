canonical_text:
  quote: ''
  summary: At Jetavana, the Master addresses a monk who drank unstrained water after
    a quarrel over a shared strainer. He introduces a past story about wise beings
    who chose not to kill living creatures for power or glory, and then begins the
    past-life account of the Bodhisatta as Magha, a charitable keeper of the Five
    Commandments who leads village men in precepts and public works.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The story is framed as being told by the Master at Jetavana about a brother
    who drank water without straining it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two young Brothers travelled from Savatthi to the country and later set out
    for Jetavana; one carried a strainer and the other did not.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the two Brothers quarrelled, the owner of the strainer did not lend
    it to his companion, and the companion drank unstrained water because he could
    not endure thirst.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Jetavana, the Brother with the strainer accused the other of knowingly
    drinking water containing living things, and the other admitted that he drank
    unstrained water.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Master says that wise and good beings of the past turned their chariot
    back and sacrificed great glory rather than kill living creatures, in order to
    save the young of the Garulas.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the past story, the Bodhisatta is born in the hamlet of Macala in Magadha
    as a young noble named Prince Magha, later known as Magha the young Brahmin.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Magha has a wife and children, excels in charity, and keeps the Five Commandments.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: When other men take his cleared comfortable standing-place, Magha repeatedly
    makes new comfortable standing-places until every man has one.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Magha puts up a pavilion and later replaces it with a hall containing benches
    and a jar of water.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Magha leads thirty men to become like-minded with him and establishes them
    in the Five Commandments.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: 'The group performs good works: clearing stones from roads, cutting obstructing
