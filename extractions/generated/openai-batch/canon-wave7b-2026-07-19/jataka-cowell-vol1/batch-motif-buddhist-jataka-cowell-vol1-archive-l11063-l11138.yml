canonical_text:
  quote: ''
  summary: After flood waters subside, a snake, rat, parrot, and prince take leave
    of the Bodhisatta hermit. The animals promise treasure or rice in gratitude; the
    prince secretly intends harm while promising support when king. The Bodhisatta
    later tests each promise. The animals respond respectfully, but the now-king orders
    him bound, flogged, and executed. While being flogged, the Bodhisatta repeats
    a proverb about some men being less worth rescuing than a log, then explains how
    he rescued the king. The assembled people condemn the king's ingratitude, kill
    him, discard his body, and anoint the Bodhisatta king.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After all four had recovered strength and the waters had subsided, the snake
    bade farewell to the hermit.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The snake said it had forty crores of gold hidden at a certain spot and promised
    the hoard to the hermit if he came and called 'Snake.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The rat took leave with a similar promise concerning its treasure and told
    the hermit to call 'Rat.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The parrot said it had no silver or gold but would provide many waggon-loads
    of rice with the aid of its kinsfolk if called.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The prince concealed a determination to kill his benefactor if the Bodhisatta
    visited him, while promising the Four Requisites when he became king.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Bodhisatta decided to test the professions of the snake, rat, parrot,
    and king.
  category: action
  evidence_refs:
