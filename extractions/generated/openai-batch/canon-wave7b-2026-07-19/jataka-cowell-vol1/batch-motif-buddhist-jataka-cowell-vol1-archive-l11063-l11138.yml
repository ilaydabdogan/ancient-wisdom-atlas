  - ev:4
- id: obs:7
  text: When called, the snake and rat responded respectfully and affirmed their offers
    of treasure.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: When called, the parrot flew down from the tree-top and offered to gather
    paddy from the region around the Himalayas with its kinsfolk.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The king, riding on an elephant of state in procession, saw the Bodhisatta
    and thought of having him killed before he could publicize the service rendered
    to him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The king ordered attendants to seize and bind the hermit, flog him at every
    street-corner, take him to the place of execution, cut off his head, and impale
    his body.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The attendants bound and flogged the Bodhisatta on the way to the place of
    execution.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: During the flogging, the Bodhisatta repeated a stanza saying that a log pays
    better salvage than some men.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Wise bystanders asked what service the hermit had rendered to the king, and
    the Bodhisatta told the whole story, including that he had rescued the king from
    the torrent.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: Nobles, brahmins, and all classes condemned the king as ungrateful and attacked
    him as he rode on his elephant.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The crowd killed the king, dragged his corpse to a ditch, and flung it in.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:16
  text: After the king's death, the people anointed the Bodhisatta king and set him
    to rule over them.
  category: action
