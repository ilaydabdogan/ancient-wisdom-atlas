  evidence_refs:
  - ev:6
- id: obs:9
  text: On returning, the brahmin reasons that the Lord of Fire cannot protect him
    if he cannot protect what belongs to himself.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The brahmin throws the leftover tail and other remains onto the fire and addresses
