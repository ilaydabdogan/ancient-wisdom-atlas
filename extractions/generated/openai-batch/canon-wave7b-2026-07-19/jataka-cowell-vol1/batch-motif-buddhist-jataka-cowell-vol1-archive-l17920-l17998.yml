  - ev:1
- id: obs:2
  text: The Ajivikas are described as practising austerities such as squatting painfully,
    swinging like bats, reclining on thorns, and scorching themselves with five fires.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Master states that no good results from such austerities and says that
    in the past wise people eventually extinguished the birth-fire with water and
    gained attainments by meditation.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the past, during Brahmadatta's reign at Benares, the Bodhisatta is born
    as a brahmin in the North country, and his parents light a birth-fire on his birth
    day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When he reaches sixteen years of age, his parents tell him to choose either
    family life with study of the Three Vedas or forest life tending the fire for
    Maha-Brahma's favour and rebirth in the Brahma Realm.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Bodhisatta says family life has no charms for him, goes into the forest,
