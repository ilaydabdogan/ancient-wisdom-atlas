canonical_text:
  quote: ''
  summary: At Jetavana, the Master answers a question about the false austerities
    of Ajivika ascetics by telling a past-life story. In the past, the Bodhisatta
    is born a brahmin whose parents light a birth-fire. Choosing the forest life over
    family life, he tends the fire to seek Maha-Brahma's favour. He receives an ox,
    intends to sacrifice it to the Lord of Fire, and goes to fetch salt. Hunters kill
    and eat the ox, leaving only remains. The brahmin concludes that a fire unable
    to protect its own offering cannot protect him, throws the leftovers into the
    fire, extinguishes it with water, becomes a recluse, gains the Knowledges and
    Attainments, and secures rebirth in the Brahma Realm. The Master identifies himself
    as that ascetic.
  language: English
  quote_policy: summarized
