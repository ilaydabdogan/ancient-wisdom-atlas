  text: After receiving an ox as a fee, he plans to sacrifice a cow to the Lord of
    Fire but leaves for the village to obtain salt for the offering.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: While he is absent, hunters find the ox, kill it, cook and eat it, carry away
