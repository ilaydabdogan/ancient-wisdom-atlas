canonical_text:
  quote: '"The five prisoners are innocent; it was a female monkey in the pleasaunce
    tliat took it."'
  summary: The Bodhisatta reasons that the five accused persons are innocent of stealing
    a necklace and that a female monkey must have taken it. With the king's permission
    he investigates, has the prisoners watched, confirms that their accusations were
    self-serving fabrications, and devises a bead-necklace ruse to make the monkey
    reveal the real pearl necklace. The necklace is recovered, the prisoners are cleared,
    the king praises and rewards the Bodhisatta, and the Master identifies Ananda
    as the king in that former birth and himself as the wise counsellor.
  language: English
  quote_policy: quoted
