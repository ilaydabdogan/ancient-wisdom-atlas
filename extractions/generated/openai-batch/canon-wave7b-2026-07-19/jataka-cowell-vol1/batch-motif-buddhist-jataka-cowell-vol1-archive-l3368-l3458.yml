canonical_text:
  quote: ''
  summary: 'The passage opens the Nigrodhamiga-Jataka by telling of the mother of
    the Elder Prince Kassapa: a wealthy merchant''s daughter of Rajagaha seeks to
    renounce worldly life, is refused by her parents, later gains her husband''s consent,
    becomes a Sister among Devadatta''s following while unknowingly pregnant, is condemned
    by Devadatta without inquiry, and asks to be taken to the Buddha at Jetavana.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator says the Master told this story at Jetavana about the mother
    of the Elder named Prince Kassapa.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman is described as the daughter of a wealthy merchant of Rajagaha,
    rooted in goodness, taking no joy in worldly life, and hoping for Arahatship.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: She asks her parents to allow her to take vows and embrace the Buddha's saving
    doctrine, but they refuse because she is their only daughter in a wealthy family.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After failing to gain her parents' consent, she resolves to seek a future
    husband's consent; after marriage she lives as a devoted and virtuous wife and
    unknowingly conceives.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: During a city festival, others keep holiday and the city is decorated, but
    she does not anoint herself or put on finery and remains in everyday attire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When her husband asks about her lack of adornment, she describes the body
    as made of thirty-two component parts, subject to decay, disease, death, and worms,
    and compares bodily adornment to decorating a close-stool.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Her husband asks why she does not become a Sister if she regards the body
    so negatively; he then arranges bounty and hospitality for the Order, escorts
    her to a nunnery, and has her admitted as a Sister among Devadatta's following.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: As her time draws near, the Sisters notice swelling in her hands and feet
    and her increased size; when questioned, she says she cannot explain it and only
    knows she has led a virtuous life.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Sisters bring her before Devadatta; he thinks the report would damage
    him and orders that she be expelled without inquiry.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The woman says Devadatta is not the Buddha, that her vows were taken under
    the Buddha, and asks to be taken before the Master at Jetavana.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Sisters travel with her from Rajagaha to Jetavana, a distance stated as
    forty-five leagues, and lay the matter before the Master.
  category: action
  evidence_refs:
  - ev:10
