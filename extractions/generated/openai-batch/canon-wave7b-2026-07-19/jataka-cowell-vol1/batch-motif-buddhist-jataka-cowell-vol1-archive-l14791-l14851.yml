canonical_text:
  quote: Such fear will waste thee quite away!
  summary: A monk at Jetavana is constantly afraid of death. The Master says this
    fear also appeared in a former birth and tells of a king's state elephant that
    fled harsh training to the Himalayas but remained terrified by even the wind.
    The Bodhisatta, then a Tree-Sprite, admonished the elephant from a tree, after
    which the elephant no longer feared. The Master then teaches the Four Truths and
    identifies the monk with the elephant and himself with the Tree-Sprite.
  language: English
  quote_policy: quoted
