  quote: ''
  summary: 'The Master rebukes an erring Sister, establishes a penance rule for Sisters
    who eat garlic, and then gives the Jataka identity-connection: Fat Nandil corresponds
    to the brahmin''s wife, her three sisters to the brahmin''s daughters, and the
    Master to the golden mallard. An editorial note cites a Vinaya occurrence and
    compares the story with La Fontaine''s golden-eggs fable.'
