canonical_text:
  quote: ''
  summary: The passage closes a preceding Jataka with a lesson on kind speech and
    a birth identification, then opens the Kaxha-Jataka. In the present frame, the
    Buddha's Double Miracle and Descent from Heaven are mentioned, the brethren praise
    his peerlessness, and the Master introduces a past life as an unmatched animal.
    In the past story, the Bodhisatta is born as a black bull raised by a poor old
    woman. Wanting to help her, he contracts with a caravan merchant to pull five
    hundred wagons across a difficult ford, refuses to move until payment is agreed,
    pulls the wagons across, and blocks the road when underpaid until the full thousand
    coins are given.
  language: English
  quote_policy: summarized
