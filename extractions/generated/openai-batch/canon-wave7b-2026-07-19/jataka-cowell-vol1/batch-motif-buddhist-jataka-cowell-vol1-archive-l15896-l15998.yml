canonical_text:
  quote: ''
  summary: 'A Tree-sprite whose tree-home is to be cut down is saved when the Bodhisatta,
    as a humble Kusa-sprite, assumes the form of a chameleon and makes the tree appear
    rotten. The Tree-sprite praises friendship and wise helpers regardless of rank,
    and the Master identifies the former births. The passage then begins DUMMEDHA-JATAKA:
    Devadatta is said to have been jealous of the Buddha''s praises in former times;
    in that past story, a king becomes jealous when people praise the Bodhisatta as
    a beautiful white state elephant and orders a mountain test at a precipice.'
  language: English
  quote_policy: summarized
