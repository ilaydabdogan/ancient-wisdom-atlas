canonical_text:
  quote: ''
  summary: At the Bamboo-grove, the Master answers a discussion about Devadatta trying
    to kill him by saying this had happened in a former time. In the past story, the
    cruel Prince Wicked of Benares is thrown into a storm-swollen river by his servants.
    He clings to a tree-trunk, where he is joined by a snake, a rat, and a parrot.
    A Bodhisatta hermit hears the cries, pulls the trunk to shore, saves all four
    beings, warms and feeds the animals before the prince, and thereby provokes the
    prince's resentment.
  language: English
  quote_policy: summarized
