canonical_text:
  quote: ''
  summary: The Master teaches at Jetavana that careless use of monastic requisites
    is like taking deadly poison. He tells a past-life story in which the Bodhisatta,
    a dice-player, exposes a sharper who hides dice in his mouth when losing. The
    Bodhisatta poisons dice, the sharper swallows one, suffers, and is then saved
    and admonished by the Bodhisatta. The Master identifies himself with the wise
    gambler. The excerpt then begins the Mahasara-Jataka, where the wives of the King
    of Kosala seek religious instruction and the king goes to hear the Master in a
    royal pleasaunce.
  language: English
  quote_policy: summarized
