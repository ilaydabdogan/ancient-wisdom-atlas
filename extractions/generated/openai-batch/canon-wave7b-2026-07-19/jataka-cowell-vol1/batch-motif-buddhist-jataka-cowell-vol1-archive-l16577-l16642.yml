canonical_text:
  quote: ''
  summary: In the Bilara-Jataka, the Master tells a story about a former hypocrite.
    In the past, the Bodhisatta is a wise rat king. A jackal pretends to be a holy
    being, wins the rats' reverence, secretly eats the last rat in the procession,
    is tested by the Bodhisatta, exposed, killed, and eaten by the rat community.
    The Master then identifies the hypocritical Brother with the jackal and himself
    with the rat king.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Jetavana, the Master responds to a report about a hypocritical Brother
    by saying he had shown the same conduct in a former time.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: During Brahmadatta's reign in Benares, the Bodhisatta is born as a rat, described
    as perfect in wisdom, large, forest-dwelling, and ruling many hundreds of rats.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A roving jackal sees the troop of rats, plans to beguile and eat them, and
    stands near their home facing the sun, snuffing the wind, and standing on one
    leg.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The jackal gives his name as 'Godly' and explains his one-legged stance, open
    mouth, and sun-facing position as signs of exceptional weight, air-feeding, and
    worship.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Bodhisatta initially regards the jackal as saintly and begins visiting
    him morning and evening with the other rats.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: As the rats depart, the jackal seizes and eats the hindmost rat, wipes his
    lips, and appears as if nothing has happened.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: When the rats become fewer, the Bodhisatta suspects the jackal and tests him
    by letting the other rats go first while he stays at the rear.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The jackal springs at the Bodhisatta; the Bodhisatta turns and denounces the
    jackal's saintliness as hypocrisy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The stanza says saintliness can be a cloak used to deceive guileless people
    and conceal treachery, and calls this a cat-like nature.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The rat king bites through the jackal's windpipe; the jackal dies, the rats
    eat his body, and afterward the rats live peacefully.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Master identifies the hypocritical Brother with the jackal and himself
    with the king of the rats.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: A note says that although the prose speaks of a jackal, the stanza speaks
    of a cat, as does the Mahabharata in its version of the story.
  category: other
  evidence_refs:
  - ev:10
