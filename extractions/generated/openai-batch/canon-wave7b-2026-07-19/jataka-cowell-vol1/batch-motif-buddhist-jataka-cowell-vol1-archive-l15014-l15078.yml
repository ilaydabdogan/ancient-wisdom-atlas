canonical_text:
  quote: "“Learn thou betimes, though headstrong folk there be; / The rustic pleased
    the King by modesty.”"
  summary: After the Brethren wonder that a Licchavi prince is fond of his fat and
    badly dressed wife, the Master tells a former-birth story. In Benares, a king
    sees a fat country woman conduct herself decently while relieving herself near
    the palace courtyard. He infers health, cleanliness, and virtue, makes her queen,
    and she bears a son who becomes an Universal Monarch. The Bodhisatta, as a wise
    courtier, praises proper observances and modesty. The Master identifies the present
    husband and wife with the past husband and wife, and himself with the wise courtier.
  language: English
  quote_policy: quoted
