canonical_text:
  quote: "“A name only serves to mark who's who.”"
  summary: 'A monk named Base believes his unlucky-sounding name affects his fortune
    and asks for another name. The Master says he held the same belief in a former
    birth and tells of a young brahmin named Base who was sent by his teacher to find
    a better name. On his journey he meets examples contradicting name-based fate:
    a dead man named Quick, an impoverished slave-girl named Rich, and a lost man
    named Guide. He returns satisfied that names identify persons but do not govern
    destiny. The Master identifies the present monk with the former young brahmin
    and himself with the former teacher.'
  language: English
  quote_policy: quoted
