canonical_text:
  quote: ''
  summary: At Jetavana, the Master addresses a Brother who has abandoned earnest effort
    and introduces a story of the past about rulers who lost and regained sovereignty
    through resolution. In Benares, the Bodhisatta is born as the queen's child, named
    Prince Goodness, and later becomes King Goodness, a ruler known for almsgiving,
    observance, patience, loving-kindness, and mercy. He expels a minister guilty
    of treachery in the harem. The exiled minister becomes adviser to the King of
    Kosala and urges him to conquer Benares, testing King Goodness through repeated
    raids. King Goodness releases captured raiders with gifts. Kosala then invades;
    despite having loyal warriors who ask to fight, King Goodness refuses to let anyone
    suffer for him and says he will not fight if Kosala seizes the kingdom.
  language: English
  quote_policy: summarized
