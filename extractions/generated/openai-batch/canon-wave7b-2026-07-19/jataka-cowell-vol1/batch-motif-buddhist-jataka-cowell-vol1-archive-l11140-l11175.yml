canonical_text:
  quote: "“Thus in harmony and goodwill one with another, these four lived their lives...”"
  summary: A righteous king visits a snake, a rat, and a parrot. The snake and rat
    surrender stored gold, while the parrot offers to collect rice. The king returns
    to the city with the creatures and treasure, houses and feeds the animals honorably,
    and the four live in harmony. The Master then identifies the present-life figures
    with their former births.
  language: English
  quote_policy: quoted
