canonical_text:
  quote: Sense-lacking friends are worse than foes with sense
  summary: During Brahmadatta's reign in Benares, the Bodhisatta becomes Lord High
    Treasurer. His maid-servant Rohini, asked by her mother to drive away flies while
    she is pounding rice, strikes her mother with a pestle, kills her, and weeps.
    The Bodhisatta draws a lesson that a sensible enemy is preferable to a senseless
    friend, and the Master identifies the past-birth characters with present figures.
