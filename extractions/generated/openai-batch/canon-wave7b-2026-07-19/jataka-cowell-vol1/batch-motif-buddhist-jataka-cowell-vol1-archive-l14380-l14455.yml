canonical_text:
  quote: ''
  summary: At Jetavana, the Buddha hears of a cheating merchant who delays dividing
    partnership profits. He tells a former-birth story in which a merchant named Wisest
    demands twice the share of his partner Wise, hides his father in a hollow tree
    to impersonate a Tree-Sprite, and receives a false judgment. Wise tests the tree
    by fire, exposing the hidden father, after which the merchants divide equally.
    The Buddha identifies the present cheating merchant with the past cheat and himself
    with Wise.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the present-frame story, two merchants return with proceeds, and the cheating
    partner plans to keep two portions while assigning one portion to his partner's
    orphans if the partner dies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The honest partner goes to the Master at the monastery and tells him what
    happened.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Master says the cheating partner was also a cheating merchant in past
    times and begins a story of the past.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the past story, the Bodhisatta is born in a merchant family, is named Wise,
    and partners in trade with another merchant named Wisest.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Wise and Wisest trade with five hundred wagons of merchandise and return to
    Benares with the proceeds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the profits are to be divided, Wisest demands a double share because
    his name is Wisest, while Wise argues that their stock, oxen, and wagons were
    held equally.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Wisest makes his father hide in a hollow tree and instructs him to say that
    Wisest should receive a double portion.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Wisest proposes that the dispute be referred to the Tree-Sprite, and the hidden
    father speaks in a changed voice from inside the tree.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The voice from the tree declares that Wise should receive one share and Wisest
    two.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Bodhisatta fills the hollow trunk with straw and sets it on fire to determine
    whether the voice is truly a Tree-Sprite.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Wisest's father is burned by the flames, climbs out, falls to the ground,
