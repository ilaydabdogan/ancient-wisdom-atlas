canonical_text:
  quote: ''
  summary: The Master addresses the king of Kosala about the degradation of Vasabha-Khattiya
    and her son Vidudabha, then tells a former-birth story. In that past story, King
    Brahmadatta of Benares fathers a son with a stick-gathering woman, gives her a
    signet-ring as proof, later denies the son before his court, and is forced by
    a truth appeal and the child's miraculous suspension in mid-air to acknowledge
    him. The king appoints the child viceroy, makes the mother queen-consort, and
    the child later becomes King Katthavahana.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The frame narrative says Vasabha-Khattiya, daughter of Mahanama Sakka by the
    slave-girl Nagamunda, became consort of the king of Kosala and bore him a son,
    Vidudabha.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king of Kosala degraded Vasabha-Khattiya and Vidudabha after learning
    of her servile origin, and mother and son remained inside the palace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Master came to the palace with five hundred Brethren, asked about Vasabha-Khattiya,
    and questioned the king about her lineage, marriage, and son.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The Master argues that Vasabha-Khattiya is a king's daughter, married to a
    king, and mother of a king's son, and asks why that son is not in authority over
    his father's realm.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Master introduces a past precedent in which a monarch gave sovereignty
    to a son born from a casual union with a faggot-gatherer.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the past story, King Brahmadatta encounters a woman gathering sticks in
    a grove, becomes intimate with her, and the Bodhisatta is conceived.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: King Brahmadatta gives the woman his signet-ring and instructs her to use
    it for a daughter or bring it with a son to him.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: When the child is old enough to play, other children mock him as fatherless;
    he asks his mother who his father is, and she identifies the king of Benares.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The mother brings the boy to the palace and presents him to the king as his
    son.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Although the king knows the claim is true, he denies both the child and the
    signet-ring because of shame before the court.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: 'The mother makes a truth appeal: if the king is the child''s father, the
    child should remain in mid-air; if not, he should fall and die. She then throws
    him upward.'
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Bodhisatta sits cross-legged in mid-air and declares to the king that
    he is his son and should be reared by him.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: The king accepts the child, who descends into the king's arms and lap, and
    the king makes him viceroy and makes his mother queen-consort.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: After the king's death, the Bodhisatta becomes King Katthavahana, rules righteously,
    and later dies according to his deserts.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: The Master closes by identifying Mahamaya as the mother of the past story,
    Suddhodana as the father, and himself as King Katthavahana.
  category: speech
  evidence_refs:
  - ev:14
