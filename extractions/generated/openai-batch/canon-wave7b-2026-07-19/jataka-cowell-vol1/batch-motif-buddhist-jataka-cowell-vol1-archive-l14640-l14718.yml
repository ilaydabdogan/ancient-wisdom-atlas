canonical_text:
  quote: ''
  summary: 'The passage first gives the Parosata-Jataka stanza contrasting one who
    immediately understands with a hundred fools who think hard for a hundred years,
    with an editorial note comparing it to Parosahassa-Jataka. It then gives the Pannika-Jataka:
    a Savatthi greengrocer tests his laughing daughter’s virtue before marriage by
    leading her into the forest and speaking words of love; she weeps, rejects the
    act as monstrous, and declares her chastity. The Master says the same happened
    in a past birth, when the Bodhisatta was a Tree-Sprite in a forest near Benares.
    The past daughter laments that her helper has become her enemy; the father reassures
    her, and she is married. The story concludes with teaching, attainment, and identification
    of the birth.'
  language: English
  quote_policy: summarized
