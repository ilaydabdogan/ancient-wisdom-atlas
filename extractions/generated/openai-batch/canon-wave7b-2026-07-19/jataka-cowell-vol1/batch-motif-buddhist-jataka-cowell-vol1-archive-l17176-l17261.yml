canonical_text:
  quote: "“Contented be, nor itch for further store. They seized the swan — but had
    its gold no more.”"
  summary: A present-frame story condemns Fat Nanda’s greedy taking of garlic. In
    the former-birth tale, the Bodhisatta, reborn as a golden mallard after death,
    gives his impoverished former wife and daughters golden feathers one by one. The
    mother greedily plucks all his feathers, but the feathers lose their gold, and
    when plain white feathers grow back, the bird leaves and never returns.
  language: English
  quote_policy: quoted
