canonical_text:
  quote: ''
  summary: 'The Master tells of a sword-smelling brahmin whose corrupt testing is
    exposed when a smith hides pepper in a sword sheath, causing the brahmin to sneeze
    and cut his nose. The Master says the same mishap occurred in a former time. In
    the past tale, King Brahmadatta''s daughter and nephew love each other, but the
    king separates them for dynastic reasons. The young prince hires a wise woman,
    who devises a false exorcism at a cemetery: the prince will lie like a dead man
    under a bed, use pepper to sneeze, frighten the guards, and escape with the princess.
    The excerpt ends as the wise woman warns the guards.'
  language: English
  quote_policy: summarized
