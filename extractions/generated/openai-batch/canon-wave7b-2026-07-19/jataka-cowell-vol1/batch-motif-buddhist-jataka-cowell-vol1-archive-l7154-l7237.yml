canonical_text:
  quote: ''
  summary: The passage introduces the Losaka-Jataka. The Master tells a story about
    Elder Losaka Tissa. After a previous existence, Losaka is conceived in a fisherman's
    household in Kosala, and his conception is associated with failed fishing, fires,
    royal vengeance, communal ruin, and the expulsion of his family. His mother later
    abandons him with a potsherd for begging. As a destitute child he survives on
    scraps until Sariputta finds him, feeds and washes him, and admits him into the
    monastic order. Losaka later becomes an Elder and an Arahat, but remains unable
    to receive enough food; even generous giving seems to fail around him. The passage
    closes by noting the approach of his death when the conditions of his separate
    existence are exhausted.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master, while at Jetavana, tells this story about Elder Losaka Tissa.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Losaka Tissa is said to have a fisherman for a father in Kosala and to have
    been conceived by a fisherman's wife after his previous existence ended.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the day of his conception, the thousand fishing families of the village
    failed to catch any fish in river or pool, and similar bad fortune continued afterward.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before his birth, the village is said to have been destroyed seven times by
    fire and visited seven times by the king's vengeance.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The villagers divided themselves repeatedly to identify a source of misfortune,
    until the family containing Losaka's parents was isolated and driven away with
    blows.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the family was driven away, Losaka's mother gave birth; the passage
    states that one born into a last existence cannot be killed and compares his destined
    life to a lamp or flame within a jar.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Losaka's mother cared for him until he could run about, then put a potsherd
    in his hands, told him to beg at a house, and ran away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The child begged for food, slept wherever he could, remained unwashed and
    unkempt, and at seven years old picked up discarded rice lumps near a house door.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sariputta, called Captain of the Faith, saw the child while entering Savatthi
    on an alms round, felt love for him, called him, and asked about his village and
    parents.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The child said he was destitute because his parents had grown tired and forsaken
    him, and he expressed a wish to become a Brother if someone would receive him.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: Sariputta gave the child a meal, took him to the monastery, washed him with
    his own hands, admitted him first as a Novice, and later as a full Brother.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In old age he was known as Elder Losaka Tissa; he remained unlucky and received
    little food, with one ladle seeming to fill his alms-bowl and food in the giver's
    dish vanishing.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Even after developing Discernment and attaining Arahatship, Losaka still received
    little; when the conditions of his separate existence were outworn, the day came
    for him to pass away.
  category: sequence
  evidence_refs:
  - ev:9
