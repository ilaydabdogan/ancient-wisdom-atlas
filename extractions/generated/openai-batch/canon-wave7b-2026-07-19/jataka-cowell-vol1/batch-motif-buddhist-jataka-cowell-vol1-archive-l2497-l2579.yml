- id: obs:1
  text: The Master tells the account at Jetavana about the Elder Udayi, who is called
    the Dullard.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dabba the Mallian allots rice checks for the Brotherhood; when Udayi receives
    inferior rice, he makes a commotion and challenges Dabba's role.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Udayi is given the check-basket and thereafter distributes the checks, but
    he cannot distinguish the best rice from inferior rice or match rice quality to
    seniority.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Udayi marks the ground or wall to indicate where detachments stood, then uses
    the old marks even when the number and grade of Brethren change the next day.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Brethren tell Udayi that the marks are too high or too low and explain
    which seniorities should receive which rice quality.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Udayi refuses the correction and says he trusts his mark.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Boys and novices thrust Udayi from the check-room, saying he docks the Brethren
    of what they ought to get and is not fit to give out the checks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Buddha tells Ananda that this is not the only time Udayi, by stupidity,
    has robbed others of their profit.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the bygone account, Brahmadatta reigns in Benares in Kasi, and the Bodhisatta
    serves as his valuer.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Bodhisatta values horses, elephants, jewels, gold, and similar goods and
    pays owners the proper price as he fixes it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The greedy king fears that the Bodhisatta's valuations will exhaust the royal
    riches and appoints a stupid greedy hind as valuer.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The new valuer fixes prices according to his own fancy while neglecting true
    worth, and his official valuation stands.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: A horse-dealer from the north arrives with 500 horses, and the new valuer
    sets the price of all 500 horses at one measure of rice.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The horse-dealer goes to the old valuer, who advises giving the new valuer
