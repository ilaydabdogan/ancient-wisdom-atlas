canonical_text:
  quote: ''
  summary: At Jetavana, the Master tells a story about Elder Udayi, called the Dullard,
    after Udayi mishandles rice-check distribution for the Brotherhood and deprives
    others of their proper share. The Buddha says Udayi had similarly robbed others
    by stupidity in former times, and recounts a Benares episode in which a greedy
    king replaced the Bodhisatta, a fair valuer, with a stupid greedy man. The new
    valuer arbitrarily valued 500 horses at one measure of rice, and the horse-dealer
    sought advice from the former valuer.
  language: English
  quote_policy: summarized
