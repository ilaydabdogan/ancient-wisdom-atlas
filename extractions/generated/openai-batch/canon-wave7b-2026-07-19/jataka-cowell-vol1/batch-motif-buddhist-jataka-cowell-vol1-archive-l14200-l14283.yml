canonical_text:
  quote: ''
  summary: A king installs an ogress as a queen-consort and grants her authority within
    the palace. She brings other ogres, kills and devours the king, and the palace
    is later found strewn with bones. The Bodhisatta, praised for mastering his senses
    and for wisdom, is chosen and anointed king; the Buddha closes with a stanza comparing
    self-governance of the heart to carrying a brimming pot of oil.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man returns to the king and reports what each party had said.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king declares treasure-trove a royal perquisite, has the ogress seated
    on his elephant, processes around the city, and lodges her in apartments reserved
    for a queen-consort.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ogress lies beside the king, weeps, says women of the harem will taunt
    her unknown family, and asks for power and authority over the whole kingdom.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king says he cannot grant authority over the whole kingdom, only over
    rebels or wrongdoers, but he gives her authority over all within the palace.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the king falls asleep, the ogress goes to the city of the ogres, returns
    with ogres, kills the king, and devours him, leaving only bones.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The other ogres enter the gate and devour living beings in the palace; the
    next day people enter and find the palace strewn with bones.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The Bodhisatta stands in the Rest-house until dawn with charmed sand on his
    head, charmed thread around his brow, and a sword in his hand.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Courtiers and citizens say the Bodhisatta mastered his senses by not looking
    at the ogress in her beauty, call him wise, and choose him as king.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Bodhisatta is escorted into the capital, adorned with jewels, anointed
    king of Takkasila, and described as ruling righteously.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The Buddha utters a stanza comparing careful carrying of a brimming pot of
    oil with governing one's heart when going to foreign lands, and identifies the
    past birth.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
