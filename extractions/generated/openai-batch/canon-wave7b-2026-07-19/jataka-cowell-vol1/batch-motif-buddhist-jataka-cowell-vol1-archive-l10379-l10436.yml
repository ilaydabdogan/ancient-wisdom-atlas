canonical_text:
  quote: The man thy mind rests on, with whom thy heart / Is pleased at first sight,--place
    thy trust in him.
  summary: In the Saketa-Jataka frame, an aged brahmin and his wife greet the Buddha
    as their son and host him. The monks question why the Buddha allowed this claim,
    since his known parents are Suddhodana and Mahamaya. The Buddha explains that
    the couple had been his parents and close relatives through many former births,
    and he identifies them as the same husband and wife in those existences and himself
    as the child.
  language: English
  quote_policy: quoted
