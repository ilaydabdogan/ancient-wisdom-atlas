canonical_text:
  quote: '"Hast thou forgotten that thou art a holy man and a brahmin?"'
  summary: The queen says she will save the ascetic and takes him from the palace.
    She repeatedly sends him to obtain a house, tools, furnishings, water, and other
    items, making him clean a filthy dwelling. When they sit together on the bed,
    she seizes him by the whiskers and reminds him of his identity as a holy man and
    brahmin. He comes to himself, reflects on the danger of craving, returns the queen
    to the king, renounces desire for her, regains Insight, rises into the air, teaches
    the king, and departs through the air to the Himalayas. He later attains rebirth
    in the Realm of Brahma. The Master closes the lesson, the Brother wins Arahatship,
    and the figures of the past birth are identified.
  language: English
  quote_policy: quoted
