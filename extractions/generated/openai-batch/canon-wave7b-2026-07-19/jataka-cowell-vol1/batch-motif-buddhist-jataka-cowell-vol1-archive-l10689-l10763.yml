canonical_text:
  quote: ''
  summary: At Jetavana, thirty young men of Savatthi come to hear the Buddha, make
    offerings, enter the Brotherhood, train, and ask for a meditation theme to escape
    the round of existence. All go forth toward ascetic practice, but Tissa the Squire's
    Son turns back from fear of hardship. The other monks practice during the rainy
    season, attain Arahatship, and return to report their success. Inspired by praise,
    Tissa attempts austerity with excessive and untimely zeal, falls while sleeping
    upright, breaks his thigh, and delays the others. The Buddha says this pattern
    also occurred in the past and begins to tell the former story.
  language: English
  quote_policy: summarized
