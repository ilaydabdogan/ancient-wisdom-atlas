  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the next frame story, Anatha-pindika maintains friendship with a man despite
    objections about inequality in birth and wealth, and he places that friend in
    charge of his wealth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Master says that a true friend is measured by ability to befriend and
    that such a friend grapples with trouble affecting oneself.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the past story, the Bodhisatta is born as a Sprite in the king's pleasaunce
