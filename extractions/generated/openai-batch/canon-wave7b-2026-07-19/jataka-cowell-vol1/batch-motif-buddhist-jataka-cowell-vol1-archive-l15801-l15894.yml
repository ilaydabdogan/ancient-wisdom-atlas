canonical_text:
  quote: ''
  summary: The Bodhisatta defends himself before a king, exposes the queen's conduct
    with sixty-four messengers, intercedes to save both the queen and the men from
    punishment, teaches that wisdom frees those bound by folly, and then renounces
    lay life for ascetic practice in the Himalayas. The next frame tale introduces
    Anatha-pindika's loyal friend and begins the Kusanali-Jataka, where the Bodhisatta
    is born as a Sprite in kusa-grass, befriends a Tree-sprite dwelling in a sacred
    Wishing Tree, and the king orders that tree cut down for a replacement pillar.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bodhisatta tells the king that he was born a brahmin and has not killed,
    stolen, lusted after another man's wife, lied, or drunk strong drink.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bodhisatta says the queen took him by the hand lustfully, threatened him
    after being rebuffed, and disclosed wrongdoing involving sixty-four messengers.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king has the sixty-four men bound and sends for the queen; she confesses
    to guilty converse with the men, and the king orders the men beheaded.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Bodhisatta asks the king to pardon the men and the queen, saying the men
    were constrained by the queen and that the queen acted according to her inborn
    nature.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king is merciful after the Bodhisatta's plea, and the Bodhisatta saves
    the lives of the queen and the sixty-four men and gives each a place to dwell.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Bodhisatta teaches that baseless accusations of folly bind the wise, while
    the words of the wise release the foolish from bonds.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Bodhisatta obtains the king's permission, gives up the world, leaves his
    relations and wealth, and becomes a recluse.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Bodhisatta dwells in the Himalayas, wins the Higher Knowledges and Attainments,
    and becomes destined for rebirth in the Brahma Realm.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Master identifies the queen, the king, and the chaplain of that birth
