canonical_text:
  quote: A son 's an easy find; of husbands too / An ample choice throngs public ways.
  summary: A Jataka tale recounts a woman whose husband, brother, and son are falsely
    arrested as robbers. Asked by the king to choose one for release, she chooses
    her brother because a husband and son can be replaced but, with her parents dead,
    another brother cannot be found. The king is pleased and releases all three. The
    Master explains that the same woman saved the same three men in a former birth,
    when he was the king.
  language: English
  quote_policy: quoted
