canonical_text:
  quote: "“this is not the first time that Devadatta has been ungrateful”"
  summary: At the Bamboo-grove, the Master responds to the Brethren’s discussion of
    Devadatta’s ingratitude by telling a past story. In the past, the Bodhisatta is
    a wealthy treasurer called the Millionaire, friend of the Benares treasurer Piliya.
    When Piliya loses his property, the Millionaire gives him forty crores and half
    his fortune. Later the Millionaire is ruined and goes to Piliya for help, but
    Piliya refuses lodging and sends only a small quantity of pollard despite having
    abundant rice. The Bodhisatta accepts the meager gift to avoid breaking friendship.
    His wife weeps, and a former farm-servant recognizes them, shelters them, feeds
    them, and gathers other slaves to go to the king’s palace.
  language: English
  quote_policy: quoted
