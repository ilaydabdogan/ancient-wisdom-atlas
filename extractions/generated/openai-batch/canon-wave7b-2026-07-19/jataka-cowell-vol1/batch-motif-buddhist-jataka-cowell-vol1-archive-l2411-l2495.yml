canonical_text:
  quote: ''
  summary: 'A young pupil of Treasurer Little turns small opportunities into increasing
    wealth: he clears storm debris for the gardener, sells it as fuel, gives water
    to mowers and later receives grass from them, profits from news of horses arriving,
    then uses credit and display to profit from a newly arrived ship. He returns with
    wealth, gives half to Treasurer Little in gratitude, marries the treasurer''s
    daughter, inherits the estate, and later becomes treasurer. The Buddha states
    the lesson that a shrewd person can rise from a humble beginning and identifies
    Little Wayman as the former pupil and himself as Treasurer Little.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a rainy, windy day, fallen branches, boughs, and leaves lay in the king's
    pleasaunce, and the gardener accepted the young man's offer to remove them in
    exchange for keeping them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young man gave children molasses so that they would gather the sticks
    and leaves into a heap at the entrance to the pleasaunce.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king's potter, needing fuel to fire bowls for the palace, took the heap;
    the sale gave the young man sixteen pennies, five bowls, and other vessels.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: With twenty-four pennies, the young man took a jar of water near the city
    gate and supplied five hundred mowers with drinking water; they offered to help
    him in return.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After hearing from a land-trader that a horse-dealer would arrive with five
    hundred horses, the young man asked the mowers for bundles of grass and asked
    them not to sell their own grass until his was sold.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The horse-dealer could not get grass elsewhere and bought the young man's
    five hundred bundles for a thousand pieces.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: After a sea-trading friend reported the arrival of a large ship, the young
    man hired a carriage, went to the port, bought the ship on credit, and left his
    signet-ring as security.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The young man used a pavilion and three successive ushers to receive merchants,
    who paid him to share in the ship and then to buy him out altogether.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The young man returned to Benares with two hundred thousand pieces.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The young man brought one hundred thousand pieces to Treasurer Little in gratitude
    and said he had gained the wealth by following the treasurer's advice.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Treasurer Little married the young man to his grown-up daughter, settled the
    family estates on him, and after the treasurer's death the young man became treasurer
    in the city.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Buddha gives a stanza teaching that a shrewd and able man may rise to
    wealth from a humble start and trifling capital, then identifies Little Wayman
    as the former pupil and himself as Treasurer Little.
  category: speech
  evidence_refs:
  - ev:5
