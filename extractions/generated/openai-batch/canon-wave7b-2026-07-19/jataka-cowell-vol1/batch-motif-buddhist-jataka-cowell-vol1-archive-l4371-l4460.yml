canonical_text:
  quote: |-
    I found the footprints all lead down, none back.
    With canes we'll drink ; you shall not take my life.
  summary: A frame story explains why cane-sticks near Nalaka-pana are hollow. In
    the past, the Bodhisatta, born as a monkey king, protects a large troop from a
    lake-dwelling water-ogre by reading footprints that go into the water but do not
    return, refusing to enter the ogre's domain, and making canes hollow so the troop
    can drink through them from outside the lake.
  language: English
  quote_policy: quoted
