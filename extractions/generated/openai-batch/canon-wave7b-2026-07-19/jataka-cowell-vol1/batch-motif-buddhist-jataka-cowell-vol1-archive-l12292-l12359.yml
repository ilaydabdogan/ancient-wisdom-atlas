canonical_text:
  quote: Both squint; both halt; both men are hunchbacks too; / And both have warts
    alike!
  summary: Illisa, the Lord High Treasurer, tries to stop people from carrying away
    his wealth after a double has ordered its distribution. He is beaten by a cart-driver,
    townspeople, and his own porters, then appeals to the king. The king summons Sakka,
    who is indistinguishable from Illisa. Illisa’s wife, children, and servants identify
    Sakka as the real treasurer. Illisa calls for his barber, the Bodhisatta, to identify
    him by a hidden wart, but Sakka produces the same mark, and the barber declares
    that he cannot distinguish the two.
  language: English
  quote_policy: quoted
