candidate_motifs:
- id: motif:1
  label: Perilous journey in which survival depends on preserving or recovering water
  taxonomy_refs:
  - departure
  - wisdom
  basis: The contents summaries contrast desert travellers destroyed after discarding
    water with a caravan saved when its leader persists in digging until water is
    found.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage is a table-of-contents synopsis, not the full narrative; the
    'departure' taxonomy fit is general.
- id: motif:2
  label: Deceptive or dangerous nonhuman beings at travel and water boundaries
  taxonomy_refs:
  - trickster_boundary
  basis: Goblins deceive a desert merchant, and ogres haunt pools where princes or
    monkeys seek water.
  evidence_refs:
  - ev:1
  - ev:6
  - ev:19
  confidence: medium
  cautions: The summaries name goblins and ogres but do not provide extended description
    of their boundary role.
- id: motif:3
  label: Wisdom or correct knowledge rescues others from danger
  taxonomy_refs:
  - wisdom
  basis: A prince saves his brothers by correctly defining 'godlike'; a caravan leader
    saves travellers by finding water; a monkey leader saves monkeys by creating safe
    drinking canes; a pack-leader dog reveals truth.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:19
  - ev:21
  confidence: high
  cautions: The evidence is summarized rather than narrated in full.
- id: motif:4
  label: Miraculous child sign confirms royal paternity
  taxonomy_refs:
  - miraculous_child
  - royal_legitimacy
  basis: A child rests in mid-air during a paternity test, after which the king recognizes
    him as his son.
  evidence_refs:
  - ev:7
