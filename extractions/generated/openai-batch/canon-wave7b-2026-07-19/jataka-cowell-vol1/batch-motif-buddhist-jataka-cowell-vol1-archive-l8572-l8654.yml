canonical_text:
  quote: ''
  summary: King Goodness is served by ogres, receives the usurper's royal food and
    sword, feeds the ogres with a divided corpse, and gains their magical help. They
    place him in the usurper's chamber and return his ministers to their homes. The
    usurper, confronted by the king, repents, swears friendship, asks forgiveness,
    and publicly restores the kingdom. King Goodness reflects that perseverance restored
    his royal state and saved his ministers, and the Buddhist frame closes with the
    Master preaching, the Brother attaining Arahatship, and the births being identified.
    An editorial note points to the Volsung-Saga for comparison.
  language: English
  quote_policy: summarized
