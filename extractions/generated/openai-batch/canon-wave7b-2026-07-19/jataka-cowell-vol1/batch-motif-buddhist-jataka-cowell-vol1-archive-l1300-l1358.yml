  summary: The passage opens the Apannaka-Jataka. The Blessed One is said to deliver
    a discourse regarding Truth while dwelling at Jetavana near Savatthi. Anatha-pindika
    the Treasurer brings five hundred friends, described as disciples of other schools,
    to Jetavana with offerings for the Buddha and the Order. Editorial notes explain
    terms and identify Anatha-pindika as Sudatta, the patron associated with founding
    the Great Monastery in Jeta's grove.
