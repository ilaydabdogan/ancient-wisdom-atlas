canonical_text:
  quote: ''
  summary: 'In the concluding portion of the Vedabbha-Jataka, two surviving robbers
    hide treasure and plot separately to keep it all: one plans to kill with a sword,
    the other poisons rice. Both die. The Bodhisatta returns with ransom, finds his
    master''s body and the bodies of the robbers, reconstructs the events, performs
    funeral rites for his master, and teaches that misguided, self-willed effort brings
    ruin to oneself and others. The frame identifies the self-willed Brother with
    the Vedabbha-brahmin and the Master with the former pupil. An editorial note reports
    a comparison with Chaucer''s Pardoner''s Tale.'
  language: English
  quote_policy: summarized
