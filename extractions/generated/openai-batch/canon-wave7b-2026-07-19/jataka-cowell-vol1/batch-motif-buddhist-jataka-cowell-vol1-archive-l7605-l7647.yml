canonical_text:
  quote: '"your own greed has worked you woe."'
  summary: A cook finds a crow near his master's dinner, punishes it severely, and
    throws it back into its basket. The Bodhisatta returns, admonishes the crow for
    ignoring counsel, leaves the place, and the crow dies. In the frame, the Master
    explains the lesson, says greed caused wise and good beings to abandon their homes,
    and identifies the greedy Brother as the former crow and himself as the pigeon.
  language: English
  quote_policy: quoted
