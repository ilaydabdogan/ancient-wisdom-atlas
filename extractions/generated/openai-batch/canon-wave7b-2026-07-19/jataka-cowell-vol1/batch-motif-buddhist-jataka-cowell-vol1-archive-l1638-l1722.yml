canonical_text:
  quote: ''
  summary: The Bodhisatta leads a caravan through a waterless wilderness, conserves
    water, recognizes a deceptive goblin, instructs his men by practical tests, finds
    the remains of a previous caravan, guards his party overnight, completes profitable
    trade, and returns without losing anyone. The Master concludes by contrasting
    the destruction of the fatuous with the safe return of those who cleave to truth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bodhisatta waits about six weeks after the foolish young merchant departs
    before setting out with five hundred carts.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the outskirts of the wilderness, the Bodhisatta has water-jars filled and
    orders that no water be used without his sanction.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Bodhisatta warns his men not to eat unfamiliar leaves, flowers, or fruit
    in the wilderness without asking him because there are poison trees there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the middle of the Waterless Desert, a goblin appears on the Bodhisatta's
    path.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Bodhisatta identifies suspicious features of the goblin, including red
    eyes, aggressive bearing, and lack of shadow.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Bodhisatta refuses to throw away the caravan's water before seeing where
    more water will come from.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The men report claims of rain, forest, lotuses, water-lilies, wet clothing,
    and streaming water, and ask to discard their water to lighten the carts.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Bodhisatta questions the men about whether they have experienced wind,
    clouds, lightning, or thunder as evidence of nearby rain.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Bodhisatta concludes that the apparent people are goblins who hope to
    devour the caravan after the men become weak from discarding their water.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The caravan finds the previous five hundred carts and the skeletons of men
    and oxen scattered around.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Bodhisatta arranges his carts in a circle as a fortified laager and guards
    the camp through the night with leading men, swords in hand.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The next day he exchanges weak carts and common goods for stronger carts and
    costly derelict goods, reaches his destination, profits by barter, and returns
    without losing a man.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The Master states that the fatuous came to destruction while those who clave
    to truth escaped demons, reached their goal, and returned home.
  category: speech
  evidence_refs:
  - ev:11
