canonical_text:
  quote: Bad company can never end in good.
  summary: In the Godha-Jataka, the Bodhisatta is born as an iguana king. He warns
    his son against intimacy with a chameleon, prepares an escape outlet when the
    warning is ignored, and later survives when the chameleon betrays the iguana community
    to a trapper who smokes them out and kills many. The Master identifies the past-life
    roles at the end.
  language: English
  quote_policy: quoted
