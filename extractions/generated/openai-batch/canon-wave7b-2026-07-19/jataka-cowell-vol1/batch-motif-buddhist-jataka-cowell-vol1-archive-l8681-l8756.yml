  text: A group of tipplers in Savatthi lacks money for drink and takes counsel about
    how to obtain it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: One ruffian proposes drugging liquor, setting up a drinking-booth, inviting
    Anatha-pindika, stupefying him, and taking his rings and clothes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The rogues carry out the plan and invite Anatha-pindika to taste their liquor
    as he passes.
  category: action
  evidence_refs:
