canonical_text:
  quote: ''
  summary: A group of drinkers plots to drug liquor, lure a wealthy or respected man
    into drinking it, and rob him. In the present frame Anatha-pindika detects and
    exposes the scheme, and the Buddha says that the same kind of trick was attempted
    in a former birth. In the past story, the Bodhisatta as Treasurer of Benares likewise
    observes that the drinkers do not taste their own praised liquor and declares
    it drugged. The Buddha identifies the present rascals with the past rascals and
    himself with the former Treasurer.
  language: English
  quote_policy: summarized
