  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Master says that the present rogues tried to trick Anatha-pindika just
    as they had tried to trick the good and wise in the past.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the past story, during Brahmadatta's reign in Benares, the Bodhisatta is
    the city's Treasurer, and the same gang drugs liquor and approaches him in the
    same way.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Treasurer does not want to drink, goes with the rogues only to expose
