canonical_text:
  quote: ''
  summary: The Master tells of a brahmin royal chaplain who tests whether the king
    honors him for goodness or for birth and accomplishments by taking money from
    the treasury. After being accused and ordered to punishment, he explains his motive,
    renounces lay life, enters the Brotherhood, and attains Arahatship. The Master
    then says this has a precedent and begins a past-life tale in which the Bodhisatta,
    as a royal chaplain in Benares, undergoes the same pattern and, while being led
    in bonds, warns snake-charmers handling a cobra.
  language: English
  quote_policy: summarized
