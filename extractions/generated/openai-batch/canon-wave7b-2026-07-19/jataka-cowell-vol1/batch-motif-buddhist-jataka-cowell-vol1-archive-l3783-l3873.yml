canonical_text:
  quote: ''
  summary: The frame story recounts how Elder Tissa, formerly Prince Tissa, becomes
    a monk practicing direct alms, but is lured back from the Brotherhood by a slave-girl
    acting for his grieving family through gifts of food and drink. The Master tells
    the Brethren that this same subjection to craving for taste happened before and
    begins a past story in which the gardener Sanjaya tells King Brahmadatta that
    he could catch a Wind-antelope in the royal pleasaunce with honey.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master is said to tell the story at Jetavana about the Elder Tissa called
    Direct-alms the Less.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Prince Tissa hears a discourse, wishes to join the Brotherhood, gains parental
    consent by refusing food for seven days, and takes vows with the Master.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After moving to Jetavana, Tissa undertakes the Thirteen Obligations and goes
    house to house for alms, omitting none.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: During a festival at Rajagaha, Tissa's parents place his former lay trinkets
    in a silver casket and mourn their only son.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A slave-girl asks what Tissa was fond of and offers to fetch him back if given
    authority in the household.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The slave-girl goes to Savatthi, lives in the street where Tissa goes for
    alms, surrounds herself with her own servants, and keeps Tissa from seeing his
    father's people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The slave-girl gives Tissa food and drink as alms, gets him to sit in the
    house, and the passage says she binds him by craving for taste.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The slave-girl feigns illness in an inner chamber; when Tissa comes, he is
    told she wants to see him, and he breaks his vow and obligation by going to her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The slave-girl tells Tissa why she came, persuades him to forsake the Brotherhood,
    places him in a palanquin, and returns with him to Rajagaha.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Brethren discuss the report, and the Master states that Tissa had fallen
    into the same power through craving for taste in bygone days.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: In the past story, during Brahmadatta's reign at Benares, a Wind-antelope
    comes into the king's pleasaunce and gradually roams there after Sanjaya does
    not frighten it.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The king asks Sanjaya whether he could catch the Wind-antelope, and Sanjaya
    says that with a little honey he could bring it into the palace.
  category: speech
  evidence_refs:
  - ev:11
  - ev:12
