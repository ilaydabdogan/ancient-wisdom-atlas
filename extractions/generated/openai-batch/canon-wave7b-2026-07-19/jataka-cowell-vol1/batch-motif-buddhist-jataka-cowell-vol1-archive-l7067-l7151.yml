canonical_text:
  quote: ''
  summary: The Bodhisatta, identified at the end as the Treasurer of Benares in a
    former birth, attempts to give alms to a Pacceka Buddha. Mara creates a deep blazing
    pit to prevent the gift and to destroy the Pacceka Buddha. The Bodhisatta refuses
    to turn back, steps toward the fire with the food bowl, and a lotus rises from
    the pit to support him. He gives the food, the Pacceka Buddha rises into the air
    and returns to the Himalayas, Mara departs defeated, and the Bodhisatta teaches
    the people about alms-giving and commandments.
  language: English
  quote_policy: summarized
