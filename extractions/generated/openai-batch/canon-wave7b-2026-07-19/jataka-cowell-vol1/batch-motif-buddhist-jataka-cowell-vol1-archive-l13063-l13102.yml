canonical_text:
  quote: ''
  summary: The Bodhisatta reflects that even cobras are called good if they do not
    bite or wound, and concludes that goodness is unsurpassed. Brought before the
    King and accused of robbing the treasury, he denies being a thief and explains
    his reasoning about goodness. He praises goodness in a stanza, preaches to the
    King, renounces worldly lusts, goes to the Himalayas for the hermit's life, attains
    five Knowledges and eight Attainments, and gains hope of rebirth in the Brahma
    Realm. The Master then identifies the disciples with the King's following and
    himself with the King's chaplain. An editorial note directs comparison with other
    Jataka numbers.
  language: English
  quote_policy: summarized
