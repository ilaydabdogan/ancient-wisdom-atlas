canonical_text:
  quote: ''
  summary: The Master introduces a past-life story about acting for the good of kinsfolk.
    The Bodhisatta is born as a dog leading several hundred dogs in a cemetery. After
    palace dogs gnaw the king's wet chariot harness, the king orders dogs killed indiscriminately.
    The Bodhisatta reasons that the palace dogs are the true culprits, enters the
    city unharmed, takes refuge under the king's throne, challenges the king's partial
    judgment, and proposes a test with buttermilk and kusa-grass to prove the palace
    dogs' guilt.
  language: English
  quote_policy: summarized
