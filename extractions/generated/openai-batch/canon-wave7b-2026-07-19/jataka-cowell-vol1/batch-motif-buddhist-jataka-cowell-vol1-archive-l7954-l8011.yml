canonical_text:
  quote: ''
  summary: 'At Jetavana the Master hears from Anatha-pindika about a tavern apprentice
    who, seeing customers take salt and jagghery after drinking, mixed salt into the
    liquor and spoiled it. The Master says the same person did this before and tells
    a past-life story in Benares: a tavern-keeper''s apprentice similarly salted the
    spirits while his master was away. The Bodhisatta, then the Treasurer of Benares,
    states that ignorant fools may do harm while intending good, and recites a stanza
    that knowledge crowns endeavor. The Master identifies the present spoiler with
    the past spoiler and himself with the Treasurer.'
  language: English
  quote_policy: summarized
