  evidence_refs:
  - ev:8
- id: obs:11
  text: The king salutes the Buddha, asks what the fruit of the religious life is,
    and hears the Samannaphala Sutta.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The king is glad, makes peace with the Buddha, and departs with solemn obeisance.
