canonical_text:
  quote: ''
  summary: King Ajatasattu, terrified after hearing that Devadatta had been swallowed
    by the earth, imagines hellish punishment and seeks reconciliation with the Buddha.
    During the Kattika festival he indirectly asks which sage can give peace. Ministers
    name several teachers, but Jivaka recommends the Buddha dwelling in his mango-grove
    with the Brotherhood. The king visits, asks about the fruit of the religious life,
    hears the Samannaphala Sutta, and makes peace. Afterward the Buddha says the king’s
    patricide and favoring of Devadatta have cost him spiritual attainment, and introduces
    a past-life story of similar ruin through favoring the sinful.
  language: English
  quote_policy: summarized
