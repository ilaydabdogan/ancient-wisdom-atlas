canonical_text:
  quote: '"Take thought of life hereafter when you seek / ''Release''; for this release
    is bondage strict."'
  summary: The passage frames a Jataka story around people who vow sacrifices to gods
    before journeys and kill living creatures after safe, profitable returns to release
    their vows. In a past-life story set in Kasi, a village squire promises a sacrifice
    to a banyan-tree Fairy, returns, kills creatures, and goes to the tree. The Tree-Fairy
    rebukes the practice, saying this supposed release is bondage. Afterward people
    refrain from killing and live righteously, and the Master identifies himself as
    the Tree-Fairy of that former birth.
  language: English
  quote_policy: quoted
