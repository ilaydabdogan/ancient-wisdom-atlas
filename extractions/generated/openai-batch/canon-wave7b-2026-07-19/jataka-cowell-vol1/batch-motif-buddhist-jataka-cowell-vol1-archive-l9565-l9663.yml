canonical_text:
  quote: ''
  summary: The Master tells a former-birth story to a passion-afflicted monk. In Benares,
    the Bodhisatta becomes a righteous king who plays dice with his chaplain using
    a lucky verse about women and opportunity. The chaplain tries to defeat the verse
    by raising a newborn girl in strict seclusion, then wins by excepting her from
    the verse. The king suspects the arrangement and hires a clever scamp, who opens
    a perfumery near the guarded house and begins deceiving the girl's waiting-woman
    through gifts and a false mother-son recognition.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Jetavana, the Master addresses a passion-afflicted Brother and introduces
    a past story by saying that even wise men who guarded a woman from birth failed
    to keep her safe.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the past setting at Benares, the Bodhisatta is born as the child of the
    queen-consort, masters accomplishments, succeeds his father, and is described
    as a righteous king.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king plays dice with his chaplain, throwing golden dice on a silver table
    and singing a lucky catch that includes rivers, trees, opportunity, and women
    working iniquity.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lucky catch repeatedly makes the king win, bringing the chaplain close
    to financial ruin.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The chaplain resolves to obtain a newborn girl who has never seen another
    man, keep her under lock and key, and use her fidelity to reverse his losses against
    the king.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chaplain uses prognostication to identify a pregnant poor woman whose
    child will be a girl, pays for the birth to occur in his house, sends the mother
    away, and has the infant brought up only by women, with no man except himself
    seeing her.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: When the girl is grown and under his control, the chaplain resumes dice with
    the king and adds an exception for his girl to the king's catch; the chaplain
    then wins while the king loses.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Bodhisatta suspects that the chaplain has a virtuous girl shut up in his
    house, verifies this by inquiry, and hires a clever scamp to seduce her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The hired scamp uses the king's money to buy perfumes, incense, aromatics,
    and related goods, and opens a perfumery shop close to the chaplain's house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The chaplain's house is described as seven stories high with seven guarded
    gateways, women guards only, inspection even of baskets of dust and sweepings,
    and access to the girl limited to the chaplain and one waiting-woman.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The scamp identifies the waiting-woman as the girl's attendant, falls at her
    feet, clasps her knees, calls her his mother, and is supported by confederates
    who claim a strong likeness between them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The waiting-woman accepts the false kinship, says she serves the chaplain's
    beautiful young wife, receives perfumes and flowers from the scamp without payment,
    and later keeps the chaplain's money while getting goods free from the shop.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
