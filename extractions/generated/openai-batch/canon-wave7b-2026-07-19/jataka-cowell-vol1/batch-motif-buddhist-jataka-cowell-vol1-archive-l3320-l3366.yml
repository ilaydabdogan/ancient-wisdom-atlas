canonical_text:
  quote: ''
  summary: 'The passage contrasts two deer leaders: Blackie leads his herd imprudently
    near villages and loses them, while Luckie avoids villages, travels only at night,
    and preserves all five hundred deer. The Bodhisatta-father praises Luckie and
    contrasts him with Blackie. The Master then identifies the deer-story figures
    with Devadatta, Sariputta, their followers, Rahula''s mother, and himself, and
    an editorial note points to a Dhammapada parallel for the introductory story.'
  language: English
  quote_policy: summarized
