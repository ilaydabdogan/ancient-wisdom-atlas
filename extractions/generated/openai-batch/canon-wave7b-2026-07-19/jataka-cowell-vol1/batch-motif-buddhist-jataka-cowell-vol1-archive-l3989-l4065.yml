canonical_text:
  quote: ''
  summary: The passage frames a Jataka story about Rahula's strict observance of monastic
    rules. After the Master lays down a rule against a Brother sleeping in the company
    of Novices, the Brethren refuse Rahula lodging. Rahula sleeps in the Buddha's
    jakes rather than seek special help. The Master discovers this, admonishes Sariputta
    and the Brethren, and adds a rider requiring Novices to be housed under supervision
    before being lodged elsewhere.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The story is introduced as told by the Master at Badarika Monastery in Kosambi
    about Rahula's commitment to observing the rules of the Brotherhood.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the Aggalava Temple near Ajavi, preaching shifts to the evening after women
    cease attending, leaving Brethren and male disciples present.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After evening preaching, younger Brethren and lay-disciples lie down in the
    Service-hall; noisy sleep and perceived impropriety are reported to the Blessed
    One.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Master declares that a Brother sleeping in the company of Novices is a
    Pacittiya offence requiring confession and absolution.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the precept is issued, the Brethren tell Rahula to find his own quarters
    and refuse him house-room because they fear transgressing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Rahula does not seek lodging from the Buddha, Sariputta, Moggallana, or Ananda
    despite their stated relationships to him; instead he takes up residence in the
    Buddha's jakes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Buddha's jakes is described as having a closely shut door, a perfumed-earth
    floor, flowers and garlands on the walls, and a lamp burning all night.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The narration states that Rahula chose the jakes because he reverenced instruction
    and wished to observe the rules, not because of the place's adornment.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Brethren test Rahula by throwing down a hand-broom or dust-sweepings;
    he removes the litter and asks pardon until assured of pardon.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Before dawn, the Master comes to the jakes, coughs, and learns from Rahula
    that he slept there because he had nowhere else to go and wished to avoid contact
    with anyone.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Master reflects that such treatment of Rahula implies worse treatment
    for other youths admitted to the Order, then assembles the Brethren and questions
    Sariputta.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Master orders that Novices be kept in the Brethren's own quarters for
    one or two days and lodged out only on the third day with their lodging known.
  category: speech
  evidence_refs:
  - ev:10
