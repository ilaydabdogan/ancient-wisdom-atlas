  quote: ''
  summary: 'A contents passage summarizes several Jataka episodes: parrots watch and
    report on a brahmin''s wife; crows attempt to bale out the sea after a hen crow
    drowns; a wife induces her husband to steal flowers from royal conservatories,
    leading to his impalement; a jackal becomes trapped in a dead elephant''s carcass;
    a wicked prince is reformed by analogy to a poisonous seedling; and a youth uses
    a life-restoring charm on a tiger with fatal consequences.'
