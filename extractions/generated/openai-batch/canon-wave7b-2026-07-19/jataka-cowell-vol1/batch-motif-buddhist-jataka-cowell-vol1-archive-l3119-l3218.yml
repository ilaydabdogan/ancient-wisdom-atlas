canonical_text:
  quote: The man who guards not, nor is guarded, sire, / Lives happy, freed from slavery
    to lusts.
  summary: The passage tells of Bhaddiya’s fearless happiness after becoming an Arahat,
    then recounts a former-birth story in which the Bodhisatta becomes a hermit and
    an ex-king disciple rejoices in the happiness of renunciation. The Bodhisatta
    explains to a displeased king that this happiness is greater than guarded royal
    life and teaches a stanza on being unguarded and free from lusts.
  language: English
  quote_policy: quoted
