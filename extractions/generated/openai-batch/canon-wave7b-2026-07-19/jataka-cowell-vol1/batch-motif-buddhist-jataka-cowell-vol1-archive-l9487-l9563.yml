canonical_text:
  quote: ''
  summary: A young brahmin reports a matter to the Bodhisatta. The Bodhisatta makes
    a wooden effigy from a fig-tree, places it in his bed, and uses a string and axe
    to test his mother. The old woman strikes the effigy, discovers it is wood, and
    dies. Her son cremates her and uses the event to instruct the young brahmin, who
    later renounces household life for a hermit's life. In the frame, the Master preaches
    and identifies the figures of the birth story.
  language: English
  quote_policy: summarized
