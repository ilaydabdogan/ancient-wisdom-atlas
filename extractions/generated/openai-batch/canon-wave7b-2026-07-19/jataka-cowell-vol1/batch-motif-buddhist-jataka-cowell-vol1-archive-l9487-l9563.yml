    her death at that moment and under her own roof was fated.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After his mother dies, her son burns her body and adorns her ashes with wild
    flowers after the flames are quenched.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Bodhisatta tells the young brahmin that there is no separate passage called
    the Dolour Text and interprets the episode as a lesson about women.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The young brahmin returns to his parents, rejects family life, says he will
    renounce the world, and voices this choice in a stanza.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The young brahmin takes leave of his parents, becomes a hermit, gains the
    desired peace, and is said to secure admission after that life into the Realm
