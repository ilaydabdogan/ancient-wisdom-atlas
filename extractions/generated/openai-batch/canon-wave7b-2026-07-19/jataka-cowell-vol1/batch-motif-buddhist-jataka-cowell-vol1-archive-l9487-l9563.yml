  text: The young brahmin reports the matter to the Bodhisatta, who commends him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bodhisatta studies how long his mother is destined to live, concludes
    that she is to die that day, and proposes to put her to a test.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bodhisatta cuts down a fig-tree, makes a wooden figure about his own size,
    wraps it in a robe, lays it on his bed, and ties a string to it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The young brahmin gives the old woman an axe and a string clue, telling her
    that the master is lying on his bed and that she may kill him if she can.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The old woman takes the axe, follows the string, bares the head of the figure,
    and strikes the figure's throat, thinking she is killing her son.
