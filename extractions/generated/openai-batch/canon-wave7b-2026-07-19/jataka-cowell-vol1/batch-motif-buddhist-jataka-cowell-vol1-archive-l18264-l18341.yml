canonical_text:
  quote: ''
  summary: 'In Jetavana, the Master has Elder Ananda assemble the Brethren in the
    perfumed chamber, sits on the Buddha-seat in radiant dignity, and teaches that
    lust, hatred, cruelty, and desire must not be harboured. He then tells a past-life
    story: when Brahmadatta reigned in Benares, the Bodhisatta was a jackal living
    near the river. The jackal finds a dead elephant by the Ganges, eats into its
    belly, decides to dwell there, and becomes trapped when summer dries the hide
    shut. A storm later moistens the carcass and opens the way; the jackal escapes
    hairless and says the misfortune came from his greed.'
  language: English
  quote_policy: summarized
