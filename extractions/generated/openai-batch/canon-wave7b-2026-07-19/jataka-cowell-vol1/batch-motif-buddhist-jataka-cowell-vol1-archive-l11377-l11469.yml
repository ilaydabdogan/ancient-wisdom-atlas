canonical_text:
  quote: ''
  summary: In the frame story, an earnest lay-brother traveling with a caravan walks
    at the foot of a tree through the night; robbers mistake him for a sentry and
    leave. The Buddha teaches that guarding oneself guards others and tells a past-life
    tale in which the Bodhisatta, as a penniless ascetic, similarly protects a caravan
    by pacing near a tree and teaches fearlessness born of love and charity.
  language: English
  quote_policy: summarized
