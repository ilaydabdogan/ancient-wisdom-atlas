    drink so that he becomes too thin to sell, and escapes when handled. The Master
    identifies himself with the quail. The next story concerns a noisy Brother: in
    a former birth, a cemetery-bred cock with no knowledge of proper times crowed
    at midnight and daytime, disrupting young brahmins until they killed it; the Bodhisatta,
    their teacher, explains that lack of training caused the cock''s end. The passage
    then begins another story by stating that Cinca''s false accusation of the Master
    had also occurred in a former time, when the Bodhisatta was born in a chaplain''s
    family.'
  language: English
  quote_policy: summarized
