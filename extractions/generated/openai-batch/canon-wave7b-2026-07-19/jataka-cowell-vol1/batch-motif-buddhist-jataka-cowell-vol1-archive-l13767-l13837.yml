canonical_text:
  quote: Trust not the trusted, nor th' untrusted trust; Trust kills; through trust
    the lion bit the dust.
  summary: The Master teaches monks not to use requisites from relatives without circumspection,
    warning that trust can be deadly. He tells a past-life story in which the Bodhisatta,
    as a wealthy merchant, instructs a herdsman to poison a doe loved by a lion. The
    lion licks the doe and dies; the Bodhisatta draws a lesson about the danger of
    trust and attachment.
  language: English
  quote_policy: quoted
