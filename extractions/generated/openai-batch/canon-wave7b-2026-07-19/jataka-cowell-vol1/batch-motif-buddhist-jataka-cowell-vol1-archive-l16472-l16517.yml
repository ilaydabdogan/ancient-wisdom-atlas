canonical_text:
  quote: What brings me weal, may work you woe.
  summary: A prince hides under a bed as arranged, sniffs pepper, and sneezes; the
    resulting panic makes the woman and armed men flee, allowing him to carry off
    the princess. The older king accepts the outcome and later makes his nephew king
    with his daughter as queen-consort. The new king contrasts his own gain from a
    sneeze with the brahmin's loss of a false nose-tip, and the Master states the
    lesson that things are not absolutely good or bad in all cases.
  language: English
  quote_policy: quoted
