canonical_text:
  quote: ''
  summary: In the Matakabhatta-Jataka, the Master rejects animal killing for feasts
    for the dead and tells of a brahmin who prepares a goat for sacrifice. The goat
    remembers former births, explains that killing one goat led to repeated beheadings
    across births, and warns that the brahmin would incur the same result. Though
    the brahmin frees and guards the goat, it dies when a thunderbolt breaks a rock
    and severs its head. The Bodhisatta, born as a Tree-Fairy, preaches from mid-air
    against taking life; the people renounce killing and practice good works.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People are killing goats, sheep, and other animals as offerings called Feasts
    for the Dead for departed kinsmen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Brethren ask the Master whether any good comes from killing living creatures
    for a Feast for the Dead, and the Master replies that no good arises from it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the past story, a Vedic brahmin teacher in Benares orders his pupils to
    take a goat to the river, bathe it, garland it, feed it grain, groom it, and bring
    it back.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The goat remembers deeds from past lives, laughs aloud at the thought of being
    freed from misery that day, and weeps out of compassion for the brahmin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The goat says it was formerly a brahmin who killed a goat for a Feast for
    the Dead and, because of that act, has had its head cut off five hundred times
    all but one.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The goat says the current birth is its five hundredth and last, and that the
    brahmin who kills it would be doomed to lose his head five hundred times.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The brahmin promises not to kill the goat and says he will guard it, but the
    goat says it cannot escape death that day and that evil-doing is stronger than
    the brahmin’s protection.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After being set free, the goat stretches its neck to browse leaves on a bush
    near the top of a rock; a thunderbolt strikes the rock, and a broken mass tears
    off the goat’s head.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Bodhisatta is said to have been born as a Tree-Fairy in that same spot
    and seats himself cross-legged in mid-air while the crowd watches.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Bodhisatta teaches that if beings knew the penalty of evil-doing and the
    sorrowful birth that follows taking life, they would cease killing.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The people, frightened by fear of hell, leave off taking life, remain in the
    Bodhisatta’s teaching, practice charity and good works, and eventually throng
    the City of the Devas.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: At the end, the Master identifies himself in that former birth as the Tree-Fairy.
  category: speech
  evidence_refs:
  - ev:8
