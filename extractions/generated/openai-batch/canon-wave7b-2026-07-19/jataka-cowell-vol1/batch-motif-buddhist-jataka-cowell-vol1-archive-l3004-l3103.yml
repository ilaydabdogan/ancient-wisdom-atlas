canonical_text:
  quote: ''
  summary: At Jetavana, the Master responds to praise of the Buddha's Great Renunciation
    by recounting a former birth. In Mithila, King Makhadeva sees a single grey hair,
    interprets it as a messenger of death, transfers sovereignty to his son, and becomes
    a recluse in Makhadeva's Mango-grove. He cultivates the Four Perfect States, is
    reborn in the Realm of Brahma, later returns as King Nimi, and again becomes a
    hermit. The Master then teaches the Four Truths and identifies the past figures
    with Ananda, Rahula, and himself.
  language: English
  quote_policy: summarized
