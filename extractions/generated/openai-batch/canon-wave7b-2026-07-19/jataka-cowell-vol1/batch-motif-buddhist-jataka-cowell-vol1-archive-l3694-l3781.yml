canonical_text:
  quote: ''
  summary: 'In the Kaxdina-Jataka frame, the Master explains a monk''s present temptation
    by recounting a past birth: a mountain-stag follows a village doe despite her
    warning about human danger, is killed by a hunter lying in ambush, and is cooked
    over embers. The Bodhisatta, then a fairy in a grove of trees, observes the event
    and gives a moral teaching against passion. The Master then preaches the Four
    Truths and identifies the monk as the former stag, his former wife as the doe,
    and himself as the fairy teacher.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master tells a Brother that because of the same woman he had formerly
    died and been roasted over glowing embers, and he makes clear what had been hidden
    by rebirth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the past story, the kingdom is Magadha with the king reigning at Rajagaha;
    when crops are grown, deer face dangers and retire to the forest.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A mountain-stag of the forest becomes attached to a doe from near a village
    and follows her when the deer return from the forest, despite her warning that
    villages are dangerous.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Magadha people post themselves in ambush when deer come down from the hills,
    and a hunter waits beside the road taken by the stag and doe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The young doe scents a man, suspects a hunter in ambush, lets the stag go
    first, and follows at a distance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The hunter kills the stag with a single arrow, and the doe flees after seeing
    the stag struck.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hunter skins the stag, lights a fire, cooks the flesh over embers, eats
    and drinks, and carries the remaining carcass home for his children.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Bodhisatta is described as a fairy dwelling in the same grove of trees
    and as having marked what happened.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Bodhisatta's speech says that passion, not parents, destroyed the deer,
    and he recites a stanza cursing the dart of love, a land ruled by women, and the
    fool who bows to women's sway.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Other fairies of the wood applaud and offer perfumes, flowers, and similar
    homage while the Bodhisatta teaches.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: After the lesson, the Master preaches the Four Truths; the love-sick Brother
    reaches the Fruit of the First Path, and the Master identifies the former births.
  category: sequence
  evidence_refs:
  - ev:8
