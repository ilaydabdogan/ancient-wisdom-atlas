  quote: ''
  summary: A renowned Bodhisatta teacher in Benares advises a country brahmin how
    to deal with his wife Kosiya, who is feigning illness. The brahmin presents a
    repellent remedy and a threat that she must either take it or work. Terrified
    and aware that the master knows her deception, Kosiya resumes work and repents.
    The frame identifies the present husband and wife with the story pair, and the
    Master with the teacher.
