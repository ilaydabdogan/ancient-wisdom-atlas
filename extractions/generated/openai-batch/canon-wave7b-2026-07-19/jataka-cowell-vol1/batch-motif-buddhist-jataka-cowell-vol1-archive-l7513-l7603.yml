  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Bodhisatta-pigeon lives in the kitchen basket, leaves at daybreak to seek
    food, and returns in the evening.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A crow flying over the kitchen smells salt fish, fresh fish, and meat, and
    longs to taste them.
  category: action
