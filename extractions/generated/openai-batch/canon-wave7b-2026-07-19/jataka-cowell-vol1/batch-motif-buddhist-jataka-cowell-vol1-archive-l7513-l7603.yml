canonical_text:
  quote: ''
  summary: At Jetavana, the Master addresses a greedy Brother and tells a past-life
    story. In Benares, the Bodhisatta is born as a pigeon living in a straw basket
    in a treasurer's kitchen. A crow, attracted by the smell of fish and meat, attaches
    himself to the pigeon, receives warnings about unsuitable food and greed, and
    later pretends illness so he can remain in the kitchen. When the cook leaves prepared
    fish unattended, the crow decides to seize a large piece and lands on a colander,
    which clicks.
  language: English
  quote_policy: summarized
