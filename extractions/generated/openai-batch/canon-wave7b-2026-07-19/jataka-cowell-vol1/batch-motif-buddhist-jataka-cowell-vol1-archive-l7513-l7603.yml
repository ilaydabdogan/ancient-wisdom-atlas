  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The next day the crow follows the Bodhisatta-pigeon from place to place like
    a shadow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The crow tells the pigeon that the pigeon's demeanor has won his admiration
    and that he wishes to follow him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Bodhisatta-pigeon warns that pigeons and crows eat different food; after
    the crow says he will feed beside him, the pigeon allows it but says the crow
    must be earnest.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Bodhisatta-pigeon pecks grass seeds, while the crow turns over cow dung
    and eats insects underneath.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: After eating, the crow tells the Bodhisatta-pigeon that he gives too much
    time to eating and that excess should be shunned.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: When both birds enter the kitchen, the cook notices the additional bird and
    hangs up a second basket for the crow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The treasurer has fish in store; the cook hangs fish around the kitchen; the
