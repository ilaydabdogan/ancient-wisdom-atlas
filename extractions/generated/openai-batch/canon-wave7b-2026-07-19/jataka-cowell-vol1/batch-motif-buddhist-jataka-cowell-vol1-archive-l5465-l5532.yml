canonical_text:
  quote: ''
  summary: 'In the Munika-Jataka, the Master addresses a passion-tost monk by telling
    a former-birth story: two ox brothers, Big Red and Little Red, work for a household
    while a pig named Munika is fed rich food for a wedding. Little Red envies the
    pig, but Big Red explains that the rich food is preparation for slaughter. Munika
    is later killed and cooked for the guests. The Master identifies the monk with
    Munika, Ananda with Little Red, and himself with Big Red.'
  language: English
  quote_policy: summarized
