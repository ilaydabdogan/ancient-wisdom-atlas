canonical_text:
  quote: ''
  summary: The Master teaches a monk troubled by sensual desire through a past-life
    story. The Bodhisatta, born as a caravan leader, warns his men not to eat unknown
    forest fruit. Some mistake the poisonous What-fruit for mango and eat it; some
    die, while those who wait for the leader are saved. The Master compares sensual
    lusts to the attractive but deadly fruit and identifies the caravan people with
    his disciples and himself with the leader.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Jetavana, the Master tells a story about a Brother who joined the Brotherhood
    and was stirred to concupiscence by seeing a beautifully dressed woman while going
    for alms in Savatthi.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Brother is brought by his teachers and directors before the Master and
    admits that concupiscence has entered him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Master says the five lusts of the senses are sweet during enjoyment but
    are like the What-fruit, which is fair, fragrant, sweet, and deadly when eaten.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the past story, Brahmadatta reigns in Benares, and the Bodhisatta is born
    as the leader of a caravan traveling with five hundred carts from East to West.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the outskirts of a forest, the caravan leader warns his men that poisonous
    fruit grows there and tells them not to eat unfamiliar fruit without first asking
    him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the other border of the forest, the caravan reaches a What-fruit tree whose
    trunk, boughs, leaves, and fruit resemble a mango in form, smell, and taste.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some caravan men mistake the What-fruit tree for a mango, pluck the fruit,
    and eat it; others pluck fruit but decide to wait for the leader before eating.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the leader arrives, he orders the uneaten fruit to be thrown away and
    has an emetic administered to those who have eaten.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Some who ate the fruit recover, but those who were first to eat die.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Bodhisatta reaches his destination safely, sells his wares at a profit,
    returns home, and later passes away according to his deserts after a life of good
    works.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the past story, the Master states in verse that lusts, like the What-fruit,
    slay those who do not know the suffering they bring afterward.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Master preaches the Four Truths; the concupiscent Brother wins the Fruit
    of the First Path, and others in the following attain various stages including
    Arahatship.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Master identifies his disciples as the caravan people in the past and
    himself as their leader.
  category: relationship
  evidence_refs:
  - ev:7
