canonical_text:
  quote: ''
  summary: During a drought in Kosala, ponds and the Jetavana tank dry up, leaving
    fish and tortoises exposed to predatory birds. The Master is moved by compassion,
    declares that he must cause rain to fall, and stands on the dry tank-steps intending
    to bathe. Sakka notices his throne growing hot, understands the situation, and
    commands the King of the Storm-Clouds to pour rain over Kosala. A torrential rain
    fills the Jetavana tank, the Master bathes, returns to the monastery, and later
    tells the Brethren that he had caused rain in a similar time of need when born
    as the King of the Fish.
  language: English
  quote_policy: summarized
