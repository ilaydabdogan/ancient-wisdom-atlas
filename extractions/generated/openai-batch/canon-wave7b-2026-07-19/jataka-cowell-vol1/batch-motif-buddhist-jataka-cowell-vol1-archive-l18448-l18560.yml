canonical_text:
  quote: ''
  summary: A king honors a Himalayan ascetic, installs him in the royal pleasaunce,
    and entrusts to him a fierce son called Prince Wicked. The ascetic has the prince
    taste a bitter leaf from a two-leaved Nimb seedling. The prince spits it out,
    calls the seedling potentially deadly, and uproots it. The ascetic turns this
    into a warning that the people will similarly uproot and exile a dangerous prince
    before allowing him to rule. The prince reforms and later becomes a charitable
    king. The Master identifies the past figures with present figures. The passage
    then begins the SANJIVA-JATAKA by describing King Ajatasattu's trust in Devadatta
    and his killing of his father under bad counsel.
  language: English
  quote_policy: summarized
