canonical_text:
  quote: ''
  summary: A foolish young merchant leads carts into a drought and demon wilderness
    with stored water. A goblin creates the appearance of a wet, water-rich party
    and tells him that water lies ahead, inducing him to break the jars and discard
    the water. The caravan finds no water, collapses from thirst, and is killed and
    devoured by goblins at night, leaving bones and untouched carts.
  language: English
  quote_policy: summarized
