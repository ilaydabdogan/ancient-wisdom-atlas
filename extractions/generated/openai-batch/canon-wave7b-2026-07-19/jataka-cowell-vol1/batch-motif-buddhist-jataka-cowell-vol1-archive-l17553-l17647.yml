canonical_text:
  quote: "“In ceaseless dread, with all mankind for foes, / Their life is passed;
    and hence no fat have crows.”"
  summary: A crow who is the Bodhisatta intervenes after a revengeful chaplain’s false
    medical advice leads a king to order crows killed. The Bodhisatta teaches the
    king to investigate before acting and to protect living creatures.
  language: English
  quote_policy: quoted
