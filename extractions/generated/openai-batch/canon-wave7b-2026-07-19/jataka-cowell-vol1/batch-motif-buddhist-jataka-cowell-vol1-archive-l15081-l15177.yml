canonical_text:
  quote: ''
  summary: A poor man at Savatthi offers a humble bran-cake to the Buddha, who accepts
    it over other cakes. The public honors the act, gives the man gifts, and the king
    makes him Lord Treasurer. The Buddha then tells a past-life story in which the
    same poor man offered a cake of husk-powder and water to a castor-oil tree inhabited
    by the Bodhisatta as a Tree-sprite. The Tree-sprite accepted the offering, revealed
    buried treasure around the tree, and the king again made the man Lord Treasurer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A very poor hired labourer cannot provide rice-gruel but resolves to give
    cakes for the hospitality offered to the Buddha and the brotherhood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The poor man makes a round cake from red powder scraped from empty husks mixed
    with water, wraps it in a swallow-wort leaf, and bakes it in embers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The poor man decides that only the Buddha should receive his cake and places
    it in the Master's alms-bowl before others can offer cakes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Master declines other cakes and eats the poor man's cake.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: People from different social ranks gather, salute the Master, and offer food
    or money to the poor man in exchange for sharing the merit of his act.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Master tells the poor man to accept the offerings and impute his righteousness
    to all living creatures.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Nine crores of gold are contributed, and the king later makes the poor man
    Lord Treasurer.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Master says he had previously accepted the same poor man's bran-cake when
    he was a Tree-sprite and had then also helped him become Lord Treasurer.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the past-life story, the Bodhisatta is a Tree-sprite dwelling in a castor-oil
    plant during Brahmadatta's reign in Benares.
  category: setting
  evidence_refs:
