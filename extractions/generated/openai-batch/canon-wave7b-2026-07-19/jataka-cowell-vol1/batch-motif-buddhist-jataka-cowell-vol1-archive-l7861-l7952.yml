canonical_text:
  quote: "'Tis knowledge crowns endeavour with success. / For fools are thwarted by
    their foolishness, / — Witness the ape that killed the garden trees."
  summary: In a frame narrative, the Buddha explains a bare patch in a pleasaunce
    by recounting a former birth. In the past, a gardener asked monkeys to water young
    trees while he attended a festival. The monkey king ordered the monkeys to pull
    up each tree to inspect its roots and ration water accordingly, causing the trees
    to die. A wise man rebuked the foolish action, and the Buddha identifies the present
    village lad with the former monkey king and himself with the wise man.
  language: English
  quote_policy: quoted
