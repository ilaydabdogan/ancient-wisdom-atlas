canonical_text:
  quote: ''
  summary: In the Aggika-Jataka, a forest fire leaves a jackal bald except for a top-knot.
    He uses this appearance to pose near the rats' cave as Bharadvaja, a votary of
    the Fire-God, claiming that he will guard the rats by counting them morning and
    evening. Instead he eats the hindmost rat at each count. The King of the Rats
    recognizes that greed, not sanctity, explains the jackal's crest and dwindling
    rat numbers, and rejects him. The Master identifies the jackal with a hypocritical
    Brother and himself with the King of the Rats. The excerpt then begins the Kosiya-Jataka,
    where a wife feigns illness to obtain rich food and meet paramours while her husband
    seeks counsel from the Master, who says former-birth wisdom has been forgotten
    through rebirth.
  language: English
  quote_policy: summarized
