canonical_text:
  quote: ''
  summary: A brahmin’s wife denies an accusation and offers to undergo an ordeal by
    fire. Before the ordeal she arranges for her attendant’s son, identified as her
    paramour, to seize her hand at the decisive moment. She then says her truth-statement
    has been invalidated because another man has now touched her, so she cannot enter
    the flames. The brahmin recognizes the trick. The frame draws a negative didactic
    lesson about women, reports the Master’s teaching, and identifies the birth.
  language: English
  quote_policy: summarized
