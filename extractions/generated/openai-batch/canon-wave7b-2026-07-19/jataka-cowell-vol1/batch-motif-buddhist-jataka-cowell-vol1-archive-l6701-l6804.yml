canonical_text:
  quote: |-
    Methinks  the  gold  and  jewels  buried  lie
    Where  Nanda,  low-born  slave,  so  loudly  bawls!
  summary: At Jetavana, the Master explains Sariputta's co-resident pupil by telling
    a past-life story. In the past, an old squire buried family wealth in a forest
    with the slave Nanda and charged him to reveal it to the son. When the son later
    sought the treasure, Nanda became insolent while standing over the buried money.
    The Bodhisatta, as a wise squire, inferred the location from Nanda's conduct,
    and the son recovered the wealth. The Master identifies the co-resident as Nanda
    and himself as the wise squire.
  language: English
  quote_policy: quoted
