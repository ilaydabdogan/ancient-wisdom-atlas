canonical_text:
  quote: ''
  summary: The Master tells a former-birth story in response to Devadatta's intent
    to kill him. In the past, the Bodhisatta is a powerful monkey who travels between
    a riverbank and a fruit island by way of a rock. A crocodile, urged by his pregnant
    mate who wants the monkey's heart, waits on the rock to catch him. The monkey
    detects the deception, tricks the crocodile into opening its mouth, leaps over
    its head to safety, and is praised for virtues that defeat enemies. The Master
    identifies the crocodile with Devadatta, the crocodile's wife with Cinca, and
    himself with the Monkey-King.
  language: English
  quote_policy: summarized
