canonical_text:
  quote: ''
  summary: In a frame at Jetavana, the Master addresses a passion-tossed Brother and
    tells a past-life story. The Bodhisatta is a famed brahmin teacher at Takkasila.
    A young brahmin of Benares, whose birth fire has been kept burning, chooses study
    and household life over forest fire-worship. His mother later sends him back to
    learn supposed 'Dolour Texts.' The teacher, caring for his own very elderly mother
    in a forest hut, recognizes the device and instructs the youth to serve and flatter
    the old woman while reporting her words. The old woman responds with desire and
    urges the youth to kill her son, then offers to kill him herself.
  language: English
  quote_policy: summarized
