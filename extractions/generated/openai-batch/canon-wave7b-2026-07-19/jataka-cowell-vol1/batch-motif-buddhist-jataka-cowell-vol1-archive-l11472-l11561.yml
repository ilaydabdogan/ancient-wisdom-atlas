canonical_text:
  quote: ''
  summary: At Jetavana, the King of Kosala is frightened by sixteen dreams and consults
    his brahmins, who declare them evil and propose sacrifices at crossroads. Queen
    Mallika urges him to consult the Blessed One instead. The king visits the Master,
    reports the dreams and the threatened sacrifice of living creatures, and begins
    recounting the dream series, including the first dream of four black bulls that
    gather to fight but depart without fighting.
  language: English
  quote_policy: summarized
