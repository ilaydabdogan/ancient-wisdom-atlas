canonical_text:
  quote: ''
  summary: A Bodhisatta teacher observes a young brahmin pupil's devotion after the
    pupil props up the teacher's bed with his own leg through the night. The teacher
    tries to train the pupil by asking him to report things seen, eaten, or drunk
    and to compare them with other things. The pupil first compares a snake to a plough-shaft,
    then repeats the same comparison for an elephant, sugar-cane, and curds with milk.
    The teacher concludes that the pupil misapplies one limited comparison universally
    and will not learn. The closing identification says Laludayi was the dullard and
    the speaker was the renowned professor.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After supper, the Bodhisatta lies on his bed and is washed and perfumed by
    the young brahmin on hands, feet, and back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When asked to prop up the bed's feet, the young brahmin props one side with
    available support and uses his own leg to support the other side all night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bodhisatta is moved by the young brahmin's devotion while still regarding
    him as the dullest of his pupils.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Bodhisatta decides to train the pupil by asking him, after gathering firewood
    and leaves, what he has seen or done and what it was like, in order to practice
    comparison and reasoning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The pupil sees a snake in the forest and says it is like the shaft of a plough;
    the Bodhisatta approves this comparison.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The pupil sees an elephant and again says it is like the shaft of a plough;
    the Bodhisatta silently allows that the trunk and tusks may partly resemble a
    plough-shaft, though the answer is imprecise.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The pupil is invited to eat sugar-cane and says sugar-cane is like the shaft
    of a plough; the Bodhisatta thinks this is scarcely a good comparison.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The pupil reports eating molasses with curds and milk and again compares curds
    and milk to the shaft of a plough.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Bodhisatta reasons that curds and milk are white and take the shape of
    their vessel, so the pupil has missed the comparison entirely.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: A stanza states that the pupil applies a limited term universally and treats
    plough-shaft and curds as the same.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The closing identification states that Laludayi was the dullard of that past
    birth and that the speaker was the renowned professor.
  category: relationship
  evidence_refs:
  - ev:7
