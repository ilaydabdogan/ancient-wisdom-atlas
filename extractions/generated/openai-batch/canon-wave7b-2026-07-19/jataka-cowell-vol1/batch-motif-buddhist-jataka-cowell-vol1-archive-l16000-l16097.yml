canonical_text:
  quote: "“Exalted station breeds a fool great woe; / He proves his own and others'
    mortal foe.”"
  summary: The passage completes a Jataka episode in which a king tests a trained
    elephant at a precipice, the mahout realizes the king means harm, and the Bodhisatta-elephant
    flies with the mahout to Benares, where a wiser king receives and rewards them.
    The Master then identifies the former-birth figures. The next Jataka begins with
    the Master at Jetavana telling the brethren that Elder Laludayi’s habit of saying
    the wrong thing is an old fault, and introduces a past-life setting in which the
    Bodhisatta is a learned brahmin professor with a foolish pupil.
  language: English
  quote_policy: quoted
