canonical_text:
  quote: ''
  summary: A king grants his queen a boon, and she asks that he look lovingly at no
    other woman. When the king goes to the frontier, she asks him to send messengers
    at each league; she has sexual relations with the messengers. The Bodhisatta,
    left in the city as chaplain, refuses her later sexual demand despite threat of
    execution. The queen feigns illness and falsely accuses him of assault. The enraged
    king orders the Bodhisatta bound and beheaded, but the Bodhisatta asks to be brought
    before the king, saying he knows of hidden treasures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king promises to grant any boon the queen asks, and she asks that he no
    longer look on any other woman with loving eyes; after resisting, he agrees.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A disturbance on the kingdom’s borders leads the king to assemble a host and
    go to the frontier while telling the queen to remain behind.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The queen asks the king to send a messenger at every league to inquire how
    she fares, and the king promises to do so.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king sends thirty-two messengers on the outward journey and thirty-two
    more on the return; the passage says the queen sinned or misbehaved with each
    of them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Bodhisatta is left in the city and later prepares the city and palace
    for the king’s return.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the Bodhisatta enters the queen’s apartments, she calls him to satisfy
    her lust, but he refuses, citing the king’s honour and his own refusal to commit
    sin.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The queen threatens to have the Bodhisatta’s head cut off if he refuses, and
    he answers that he will not do her bidding even if his head is cut off.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The queen scratches herself, puts oil on her limbs, dresses in dirty clothes,
    pretends to be ill, and orders her slaves to tell the king she is ill.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The queen tells the king that the chaplain came under pretense of inspecting
    the palace and beat her because she would not yield to his will.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The enraged king orders servants to bind the chaplain like a condemned man
    and cut off his head, and the execution drum is beaten.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Bodhisatta concludes that the queen has poisoned the king’s mind against
    him and asks to be brought before the king before he is killed.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Bodhisatta tells his captors that he knows where great hidden treasures
    are, and that this wealth will be lost if he is killed before seeing the king.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The captors bring the Bodhisatta before the king, who asks why reverence did
    not restrain him from wickedness.
  category: sequence
  evidence_refs:
  - ev:10
