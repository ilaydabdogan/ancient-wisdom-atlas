canonical_text:
  quote: There's nothing worse, men say, than taste to snare,
  summary: A king has honey given to a gardener, who uses honeyed grass to habituate
    and lure a timid wind-antelope from the pleasaunce into the palace. The trapped
    animal trembles in the hall. The king teaches that desire for taste is a powerful
    snare, then releases the antelope. The Master then identifies the past-birth figures
    with present figures in the frame story.
  language: English
  quote_policy: quoted
