canonical_text:
  quote: '"Face towards the East, and as you handle this cloth, repeat these words
    — ''Removal of Imj^urity; Removal of Impuritj''.''"'
  summary: The Master arranges for a merchant's grandson to enter the Order, and the
    boy later attains Arahatship. He then admits Little Wayman, who proves unable
    to memorize a stanza because of past karmic conduct. Excluded from a meal invitation
    and expelled by his elder brother, Little Wayman resolves to return to lay life.
    The Master perceives this, intercepts him, keeps him in the religious life, and
    gives him a supernaturally created clean cloth and a repeated phrase about removing
    impurity.
  language: English
  quote_policy: quoted
