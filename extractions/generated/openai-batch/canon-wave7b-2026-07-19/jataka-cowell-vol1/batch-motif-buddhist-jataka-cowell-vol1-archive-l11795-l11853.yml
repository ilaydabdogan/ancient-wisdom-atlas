canonical_text:
  quote: ''
  summary: 'A dream interpreter explains several royal dreams as future signs of social
    and moral decline: low-born upstarts will be honored while nobles and excellent
    brethren are ignored; tiny frogs eating large black snakes signify wives dominating
    husbands; a vicious village crow escorted by golden birds signifies weak kings
    raising servants over nobles; and a further dream reports goats devouring panthers
    while wolves flee.'
  language: English
  quote_policy: summarized
