canonical_text:
  quote: ''
  summary: A Jataka frame says the Master tells a story at Jetavana about a boastful
    Brother. In the past, the runaway slave Kalanduka lives luxuriously with a merchant's
    daughter. The Treasurer of Benares sends a pet parrot to find him. The parrot
    sees Kalanduka at a river party, rebukes him for falsely vaunting high descent,
    reports him to the Treasurer, and Kalanduka is brought back to slave fare. The
    Master identifies the Brother with Kalanduka and himself with the Treasurer.
  language: English
  quote_policy: summarized
