canonical_text:
  quote: ''
  summary: 'Opening frame of the Vannupatha-Jataka: while the Buddha dwells at Savatthi,
    a monk who has abandoned perseverance in meditation is brought before him. The
    Buddha rebukes and encourages him by recalling that in a former time this same
    person, through perseverance, obtained water in a sandy desert for the people
    and oxen of a caravan of five hundred carts. The monks ask the Buddha to tell
    the concealed past-life story.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The discourse is said to have been delivered by the Blessed One while he was
    dwelling at Savatthi, and its immediate subject is a Brother who gave up persevering.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A scion of a Savatthi family heard a discourse by the Master, understood that
    lusts breed suffering, and was admitted to the first stage of the Brotherhood.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After five years of preparation, the Brother learned two summaries, trained
    in methods of Insight, received a meditation theme from the Master, and retired
    to a forest for the rainy season.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After three months of striving in the forest, the Brother could not develop
    even an initial sign of Insight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Brother concluded that there was neither Path nor Fruit for him in that
    birth and returned to Jetavana to see and hear the Buddha.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Brother’s friends questioned his return, heard him admit that he had won
    neither Path nor Fruit and had given up persevering, and took him to the Master.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Master asked whether the Brother had given up persevering and contrasted
    his present lack of perseverance with his former stout-heartedness.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Master stated that in bygone days the Brother single-handedly, through
    perseverance, enabled the men and oxen of a caravan of five hundred carts to get
    water in a sandy desert.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Master’s words gave heart to the Brother.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Brethren said that the Brother’s present faintheartedness was clear to
    them, but the past event concealed by rebirth was known only to the Buddha, and
    they asked him to tell it.
  category: speech
  evidence_refs:
  - ev:5
