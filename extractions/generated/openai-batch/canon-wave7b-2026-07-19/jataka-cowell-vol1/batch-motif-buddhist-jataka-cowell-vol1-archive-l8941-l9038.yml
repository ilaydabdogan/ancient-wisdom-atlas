canonical_text:
  quote: ''
  summary: The Bodhisatta, seized by an ogre, declares himself unafraid because an
    adamantine sword within him would destroy the ogre if he were eaten; the narrator
    identifies this as the Sword of Knowledge. The ogre releases him, and the Bodhisatta
    teaches the karmic dangers of killing, converts the ogre, establishes him in the
    Five Commandments, and appoints him fairy of the forest. The Bodhisatta returns
    to Benares, later rules righteously, and dies according to his deserts. The Buddha
    then applies the teaching to Arahatship, identifies Angulimala as the ogre and
    himself as Prince Five-Weapons. The passage then begins the Kancanakkhandha-Jataka,
    in which a young monk is overwhelmed by moral rules and is brought to the Buddha,
    who says he should not have been burdened beyond what he can do.
  language: English
  quote_policy: summarized
