canonical_text:
  quote: ''
  summary: The Master tells of a past life in which the Bodhisatta was a noble Sindh
    horse. Though wounded after helping capture six of seven besieging kings, he urges
    perseverance, is harnessed again, helps defeat the seventh camp, gives counsel,
    and dies. The story is applied to a Brother who had abandoned perseverance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master, while at Jetavana, addresses a Brother who had given up persevering
    and introduces a past story about the wise and good persevering even when wounded.
  category: speech
  evidence_refs:
  - ev:1
