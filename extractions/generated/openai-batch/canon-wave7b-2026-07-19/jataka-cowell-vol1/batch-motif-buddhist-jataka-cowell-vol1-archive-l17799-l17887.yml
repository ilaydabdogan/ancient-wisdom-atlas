canonical_text:
  quote: ''
  summary: The frame narrative tells how Devadatta, after losing spiritual standing,
    forms a schismatic group and poses as a Buddha. Sariputta and the other chief
    disciple teach Devadatta's followers and bring them back, after which Kokalika
    angrily injures Devadatta. The Master says Devadatta has likewise imitated him
    to his own hurt in former times. In the past story, the Bodhisatta is a lion in
    the Himalayas who accepts a hungry jackal as servant and feeds him from his kills.
    The jackal becomes fat and proud, then asks to occupy the lion's place and have
    the lion scout for him so that the jackal can kill an elephant himself. The excerpt
    stops before the outcome of this attempt.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Devadatta loses spiritual Insight, honour, and profit, asks for the Five Points,
    is refused, and leaves with five hundred young Brethren to form a separate Brotherhood.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Devadatta expounds far into the night while flattering himself that he has
    the masterly power of a Buddha, then asks Sariputta to give a discourse while
    Devadatta rests his aching back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two chief disciples teach the young Brethren about the Fruitions and the
    Paths and win them back to the Bamboo-grove.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Kokalika finds the monastery empty, reports the loss of followers to Devadatta,
    strips off Devadatta's outer cloth, kicks him on the chest, and blood gushes from
    Devadatta's mouth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Master tells Sariputta that Devadatta has imitated him to his own hurt
    both now and in former times.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the past story, Brahmadatta reigns in Benares and the Bodhisatta is a maned
    lion dwelling at Gold Den in the Himalayas.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The lion leaves his lair, roars in the four directions, kills a large buffalo,
    eats the prime of the carcass, drinks from a pool of crystal water, and turns
    back toward his den.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A hungry jackal meets the lion, cannot escape, throws himself at the lion's
    feet, and asks to be the lion's servant.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The lion accepts the jackal's service and says the jackal shall feed on prime
    meat; after this, the lion's leavings fall to the jackal and the jackal grows
    fat.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The lion instructs the jackal to climb to the mountain top, scan the valleys
    for animals such as elephants, horses, and buffalos, and report with the formula
    of obeisance, 'Shine forth in thy might, Lord.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: When the jackal reports suitable prey, the lion bounds forth, kills the animal,
    shares the prime carcass with the jackal, and the jackal sleeps after eating.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: After growing bigger, the jackal becomes haughty, reasons that he too has
    four legs, and decides that he should kill elephants and other beasts for himself.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The jackal asks the lion to let him lie in the lion's corner of Gold Den while
    the lion climbs the mountain to find an elephant and then comes back to address
    the jackal with the same empowering formula.
  category: action
  evidence_refs:
  - ev:6
