canonical_text:
  quote: Prize .skill, and note the marksman lame; — Four villages reward his aim.
  summary: A monk skilled at throwing stones strikes down a swan and is rebuked. The
    Master tells a past-life story in which a lame marksman uses accurate projectiles
    to silence an excessively talkative royal chaplain and is rewarded by the king;
    the Bodhisatta states a moral about cultivating skill.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A Brother from a good family in Savatthi is described as highly skilled at
    hitting things with stones, though he does not excel in monastic study or practice.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the river Aciravati after bathing, the skilled Brother tells a younger
    Brother that he will hit the rear swan in the eye.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Brother first throws a three-cornered stone, then throws a smooth round
    stone that passes through the swan's eyes; the swan screams and falls.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The younger Brother calls the act improper and brings the skilled Brother
    before the Master, who rebukes him and says the same skill existed in past times.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: In the past story, Brahmadatta reigns in Benares, the Bodhisatta is one of
    the king's courtiers, and the royal chaplain is described as so talkative that
    no one else can speak.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The king looks for someone who can cut short the chaplain's talking.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: A cripple in Benares is known as a remarkable stone marksman; boys place him
    on a cart near a large banyan-tree and pay him to cut the foliage into requested
    shapes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The king encounters the cripple at the foot of the tree after the boys run
    away, has him brought over, and asks whether he can stop the chaplain's talking.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The cripple says he can do it if supplied with a peashooter full of dry goat's
    dung, and he is placed behind a curtain with a slit facing the chaplain's seat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the chaplain monopolizes the conversation, the cripple shoots pellets
    of dry goat's dung through the slit into the chaplain's gullet, and the chaplain
    swallows them without noticing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The king tells the chaplain that he has swallowed the pellets, advises an
    emetic, and thereafter the chaplain remains silent in conversation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The king rewards the cripple with four villages in the four directions, and
    the Bodhisatta comments that skill should be cultivated by the wise.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
