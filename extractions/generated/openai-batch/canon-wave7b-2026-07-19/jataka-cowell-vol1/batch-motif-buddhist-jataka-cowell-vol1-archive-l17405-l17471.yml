canonical_text:
  quote: ''
  summary: The Godha-Jataka is introduced as a story told by the Master at Jetavana
    about a hypocrite. In a former birth, the Bodhisatta is born as a lizard who lives
    near a respected ascetic and visits him for instruction. After that ascetic leaves,
    a rascally ascetic replaces him. Having tasted lizard flesh, the replacement ascetic
    plots to kill and eat the Bodhisatta, hiding a mallet under his robe while appearing
    peaceful. The Bodhisatta detects the danger by the ascetic's altered look and
    the smell of lizard flesh, escapes the thrown mallet, rebukes the ascetic's false
    piety, and returns to his ant-hill. The wicked ascetic departs, and the Master
    identifies the figures of the former birth.
  language: English
  quote_policy: summarized
