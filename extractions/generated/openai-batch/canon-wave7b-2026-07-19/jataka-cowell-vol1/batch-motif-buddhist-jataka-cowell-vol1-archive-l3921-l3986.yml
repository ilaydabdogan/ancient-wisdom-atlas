canonical_text:
  quote: ''
  summary: In the Kharadiya-Jataka frame, the Master addresses an unruly Brother who
    admits he does not heed admonition. The Master recounts a past life in which the
    Bodhisatta was a deer leading a herd. His sister entrusted her son to him to learn
    deer ruses, but the nephew repeatedly skipped lessons, failed to learn, was caught
    in a gin, and was killed by a hunter. The Master then identifies the unruly Brother
    with the nephew-deer, Uppalavanna with the sister, and himself with the admonishing
    deer.
  language: English
  quote_policy: summarized
