canonical_text:
  quote: How transient are all component things!
  summary: The passage frames the Buddha's impending death at Kusinara and Ananda's
    objection to that town as a death-place. The Buddha answers by recounting that
    in a former birth as the universal monarch Sudassana he dwelt there when it was
    a magnificent city. In the past-life story, Queen Subhadda urges the dying king
    to set his heart on his vast sovereignty, but Sudassana rejects attachment, declares
    that he will die that day, quiets the lamenting court, teaches the transience
    of all compounded things, exhorts ethical conduct, and is later reborn in the
    Realm of Devas. The passage ends with the Jataka birth-identification.
  language: English
  quote_policy: quoted
