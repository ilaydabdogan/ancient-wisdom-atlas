    the bank.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The fisherman's wife, intending to occupy the neighbours with a quarrel, appears
    with a palm-leaf behind one ear, one eye blackened with soot, and a dog in her
    arms.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The wife's quarrel goes before the zemindar; after inquiry she is fined, tied
