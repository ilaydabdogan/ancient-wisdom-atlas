  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The fisherman thinks he has hooked a fine fish and sends his boy home to tell
    his wife to start a quarrel so neighbours will not come to share the prize.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The fisherman removes his coat, enters the water to secure the imagined fish,
