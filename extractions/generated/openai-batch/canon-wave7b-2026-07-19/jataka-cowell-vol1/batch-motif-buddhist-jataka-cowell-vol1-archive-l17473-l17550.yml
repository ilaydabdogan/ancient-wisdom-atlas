canonical_text:
  quote: ''
  summary: 'In the frame narrative, the Brethren discuss Devadatta as having missed
    both lay comfort and monastic fulfillment. The Master tells a past-life story:
    a fisherman mistakes a snag for a large fish, sends his son to tell his wife to
    distract the neighbours, enters the water, blinds himself on the snag, and has
    his clothes stolen. His wife stages a quarrel but is fined and beaten. A Tree-Sprite
    observes the husband''s and wife''s paired misfortunes and recites a stanza on
    twofold failure. The Master identifies Devadatta as the former fisherman and himself
    as the Tree-Sprite.'
  language: English
  quote_policy: summarized
