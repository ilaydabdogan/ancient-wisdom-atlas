canonical_text:
  quote: ''
  summary: In the frame, the Master at Jetavana tells a story about a boastful Brother.
    In the former birth story, Katahaka, a slave-born young man in the Bodhisatta
    Treasurer's household, learns writing and crafts, becomes a private secretary,
    forges a letter under his master's seal claiming to be the Treasurer's son, and
    uses it to marry a border merchant's daughter. After giving himself airs, he is
    located by the Treasurer's searchers. When the Treasurer comes to retrieve him,
    Katahaka publicly prepares an explanation of servile behavior, meets the Treasurer
    with a present, privately falls at his feet, and begs not to be exposed. The Treasurer
    promises not to expose him and speaks kindly to the border merchant, though afterward
    he cannot bear the sight of Katahaka.
  language: English
  quote_policy: summarized
