canonical_text:
  quote: ''
  summary: The Bodhisatta helps a troubled mouse by placing her inside a hollowed
    block of pure crystal and instructing her to threaten anyone who approaches. Cats
    come demanding meat, attack the mouse without realizing she is protected by the
    crystal, and die from the force of their attacks. The grateful mouse repays the
    Bodhisatta with increasing numbers of coins and eventually the whole hoard. The
    Buddha then states a lesson in verse and identifies the figures of the past birth.
  language: English
  quote_policy: summarized
