canonical_text:
  quote: ''
  summary: In the Maluta-Jataka, Elder Dark and Elder Light disagree about when cold
    appears and ask the Master. The Master says he had answered the same question
    in a former existence. In the past story, a tiger and a lion living together in
    a cave at the foot of a mountain dispute whether cold belongs to the dark or light
    half of the month. The Bodhisatta, living nearby as a hermit, says cold comes
    whenever the wind blows and declares both partly right, thereby making peace.
    The Master then identifies Dark with the tiger, Light with the lion, and himself
    with the ascetic.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The story is told by the Master at Jetavana about two Brethren who joined
    the Brotherhood in old age and were named Elder Dark and Elder Light.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Elder Light asks Elder Dark when cold appears, and Elder Dark answers that
    it appears in the dark half of the month; Elder Dark later asks Elder Light, who
    answers that it appears in the light half.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two Elders cannot solve the question together, so they go to the Master
    and ask him when cold appears.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Master says he had answered the same question for them in bygone days,
    but their previous existences have become confused in their minds.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: In the past story, a lion and a tiger live together as friends in one cave
    at the foot of a mountain, and the Bodhisatta lives nearby as a hermit.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The tiger says cold occurs in the dark half of the month, while the lion says
    it occurs in the light half, and they ask the Bodhisatta to settle the question.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Bodhisatta states that cold occurs in either the light or dark half whenever
    the wind blows, because cold is caused by wind.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Bodhisatta decides that both animal disputants are right and makes peace
    between the friends.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: After the Master ends the lesson and preaches the Four Truths, both Elders
    win the Fruit of the First Path.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Master identifies Elder Dark with the tiger, Elder Light with the lion,
    and himself with the ascetic who answered the question.
  category: relationship
  evidence_refs:
  - ev:8
