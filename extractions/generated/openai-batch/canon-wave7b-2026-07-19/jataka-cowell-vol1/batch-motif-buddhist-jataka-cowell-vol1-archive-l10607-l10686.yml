canonical_text:
  quote: ''
  summary: After hearing the Truth, the king loses desire for royal dominion and follows
    the Bodhisatta, called the Spade Sage, to the Himalayas for anchorite life. The
    king's host and the inhabitants of Benares also go forth. Sakka notices the Great
    Renunciation and sends Vissakamma to create a vast hermitage. The Spade Sage leads
    the people in renunciation and meditation, resulting in Attainments and future
    entry into divine realms. The Master then gives a lesson on passion and identifies
    the birth.
  language: English
  quote_policy: summarized
