canonical_text:
  quote: ''
  summary: A wounded Bodhisatta-horse insists on being harnessed, is tended and armed
    again, and helps the knight capture the seventh king. The Bodhisatta counsels
    the king not to kill the seven captive kings, to release them under oath, to honor
    the knight, and to rule justly. The Bodhisatta dies as his mail is removed; the
    king honors him, releases the captives after oaths, and rules righteously. The
    Master then interprets the former birth as a lesson in perseverance, preaches
    the Four Truths, and identifies the past figures.
  language: English
  quote_policy: summarized
