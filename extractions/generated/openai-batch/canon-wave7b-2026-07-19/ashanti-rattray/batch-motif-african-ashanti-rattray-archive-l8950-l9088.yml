    are repeated in forty-day (really forty-two-day) cycles.
  summary: 'The passage explains a recurring calendrical cycle of holy-day prefixes,
    then describes a quiet Brong Adae ceremony: priests and elders salute the chief,
    visit the Pantheon of shrines, sit before uncovered shrines, and note the usual
    but omitted palm-wine offering and petitions to the gods. An evening drum summons
    later calls a small group back to the chief''s palace.'
