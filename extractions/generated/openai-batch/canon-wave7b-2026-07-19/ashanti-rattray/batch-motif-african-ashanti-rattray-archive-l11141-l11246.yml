canonical_text:
  quote: ''
  summary: 'An ethnographic account of an Apo ceremony afternoon and evening: chiefs
    and officials assemble; priests and priestesses of attending gods process, greet
    the gathering, sprinkle clay, and sit in a circle; sub-chiefs salute the head
    chief; priests dance, including one who impersonates a leopard; songs mention
    witchcraft, the door of ghosts opening, and a royal god removing misfortune; an
    executioner performs comic antics; the head priestess sits in trance with an attendant
    holding white clay; in the evening the gods'' shrines are paraded, including Ta
    Kese carried on priests'' heads.'
  language: English
  quote_policy: summarized
