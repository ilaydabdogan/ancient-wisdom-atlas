literal_observations:
- id: obs:1
  text: A fowl is decapitated, and the bleeding bird is held over a cairn so that
    its blood falls on it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The headless body of the fowl is cast onto the cave floor, and participants
    watch its convulsive movements.
  category: action
  evidence_refs:
