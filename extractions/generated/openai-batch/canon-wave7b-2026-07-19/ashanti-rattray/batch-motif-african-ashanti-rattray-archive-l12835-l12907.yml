  text: The fowl is dissected; the legs, head, wing tips, and intestines are placed
    on the Amoa stone, while the rest is placed on the Bokoro rock.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The kidneys are examined; one is white and the other black and white, which
