canonical_text:
  quote: ''
  summary: The passage reports the death of a priest after an incident involving a
    mampam, later explained by an old priest as violation of a red taboo of the god.
    It then describes the narrator’s plan to visit Tano Oboase near the source of
    the Tano water, to seek knowledge of shrine-making for Ta Kora/Tano. The narrator
    describes Ta Kora’s temple, its decorated walls, and explanations of mural elements
    including celestial bodies associated with Nyame, a craftsman’s hand, an inscription
    naming builders, and fetters.
  language: English
  quote_policy: summarized
