canonical_text:
  quote: ''
  summary: 'The appendix describes sacred Lake Bosumtwi in central Ashanti: its geography,
    uncertain depth, lack of outlet, freshwater character, suggested formation by
    subsidence, local sacred status, beliefs about a powerful spirit manifesting on
    the lake surface, prohibitions on certain objects near the lake, and a fishing
    method using reed traps and logs rather than canoes or hooks.'
  language: English
  quote_policy: summarized
