canonical_text:
  quote: ''
  summary: A field-recorded account describes a visit with an old priest to Bosomtwe
    Rock and then to the source of the Tano River. The passage reports a legend that
    Lake Bosomtwe once stood near the rock and moved away after conflict with its
    brother Tano. The priest offers eggs and palm wine to Bosomtwe and then performs
    water, egg, and wine rites at the Tano source, asking for life, health, and strength.
    The passage also reports royal and chiefly animal sacrifices connected with fishing
    abundance and appeasement after taboo violations.
  language: English with Akan ritual speech
  quote_policy: summarized
