canonical_text:
  quote: ''
  summary: 'The passage records an Ashanti ceremony on sacred Monday in which ancestral
    spirits are invited to eat rice and grant blessing. It then describes related
    domestic and social practices: offerings at the Queen Mother''s house, white clay
    on women participants, routine food and drink portions placed in the ground for
    the samanfo, thanks to spirits after recovery from illness, rum and wine used
    to propitiate spirit owners of land, sacrifices at a chief''s installation, and
    wine poured upon ancestral stools at a royal marriage.'
  language: English with Akan/Twi ritual formulae
  quote_policy: summarized
