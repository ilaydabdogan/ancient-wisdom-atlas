canonical_text:
  quote: ''
  summary: 'Field-recorded account of Apo Ceremony events: a priest dances with a
    shrine and uses eggs in ritual action; a girl is publicly questioned about marriage;
    priests visit shrines of named gods, dance with eggs, messenger dolls, mirror,
    sword, and spear; outlying shrines return home before dawn for local water-sprinkling;
    informants explain anxiety that a spirit may not return to its shrine; a Monday
    procession carries local shrines, umbrellas, red caps, a tree branch, stools of
    former priests, and ritual officers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A priest picked up an egg, moved outside the circle of people, and threw the
    egg on the ground; he later explained this as averting ill that another priest
    might will against his god.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The priest danced with drums and singing, sometimes holding the shrine on
    his head and sometimes having it supported by an attendant.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The priest called attention to a young girl, used a spokesman to ask why she
    was not yet married, and the nervous girl promised she would soon marry.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The hunter-priest, described as having the spirit upon him, went toward the
    town with followers while carrying his god on his head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The party visited the place where Akua Tia’s shrine was kept and then the
    house of Ta Kese, where priests greeted the old head priest, briefly entered the
    temple, and danced.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Priests cast eggs into the air and intercepted the descending eggs with their
    heads while dancing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Priests danced holding two small wooden dolls named Kwaku and Akua, identified
    as male and female and as speedy messengers of the gods.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Priests danced holding a looking-glass, a sword, and a spear; the mirror was
    said to let them see things.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Some gods brought from outlying villages were expected to return home before
    dawn on Monday so water-sprinkling could be performed at their own local water,
    completing the ceremonies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Informants explained that shrines were taken home at night because the gods
    might enjoy their outing and not wish to return if departure were delayed until
    daylight.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states a dread that a spirit which settles in an acceptable shrine
    may fail to return home, and notes empty shrines awaiting a returning spirit.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: On Monday, local shrines were formed up outside the Ta Kese house; fourteen
    lesser gods were carried on boys’ heads, followed by Ta Kese and Ta Kwesi under
    large umbrellas with red fez caps on top of their shrines.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The procession included priests in white clay, a large branch of the summe
    tree, blackened stools of former priests, executioners, a herald, a soul washer,
    priestesses, and priests.
  category: object
  evidence_refs:
  - ev:7
