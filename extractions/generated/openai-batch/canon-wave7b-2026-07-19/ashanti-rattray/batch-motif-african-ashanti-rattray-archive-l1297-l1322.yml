  summary: The author introduces tables and charts for examining Ashanti relationship
    terms. Kakari is named as the central reference figure. The passage explains that
    terms are given relative to him and reciprocally, arranged by generations, and
    that the chart uses names, English and Ashanti relationship terms, abusua blood
    patterns, fictitious ntoro division signs, a marriage sign, and male/female circle-arrow
    symbols.
