canonical_text:
  quote: "“red clay (mixed with the blood, water, and gold dust)”"
  summary: Men plaster room floors with a red clay mixture containing blood, water,
    and gold dust. The omanhene marks people’s foreheads with the same mixture in
    three parallel lines. A second sheep is killed. The narrator reports that in olden
    times human victims would have been sacrificed so their ghosts could attend dead
    rulers. The chief and Queen Mother sit in a room, rum is served, and the chief
    later appears in the street and is captioned as dancing with a rifle.
  language: English
