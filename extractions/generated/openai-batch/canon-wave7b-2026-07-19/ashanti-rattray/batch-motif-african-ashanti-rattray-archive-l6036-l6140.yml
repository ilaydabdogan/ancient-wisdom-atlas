canonical_text:
  quote: ''
  summary: The passage recounts a tradition about Akorobompi’s discovery and use of
    a lake, conflict over control of the lake, Komfo Anotchi’s wartime instructions
    involving two chiefs’ sons, a battle and division of lake territory, and then
    describes observed rites at a lake cult stone where a headman addresses the stone
    and sacrifices a white fowl for fruitful water, fish, and prosperity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Akorobompi returned home and told his wife what he had seen at the lake; she
    told him to return to the lake and splash it dry to get fish.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Akorobompi made repeated visits to the lake and returned with increasing catches
    of fish; the first two catches were given to his dog before he and his wife ate
    the fish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Chiefs heard of the fishing and settlements of their slaves were founded along
    the lake shore for fishing purposes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The chief of Akyem, Ampao, claimed the lake, ordered others to leave, and
    captured and killed Akorobompi and his wife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The killing led to a war involving Asaman, Asansu, and Ahuren against the
    Akyems.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Komfo Anotchi was consulted by Ashanti chiefs about the conduct of the war.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Anotchi advised that the Asaman and Asansu chiefs should each take one son,
    clothe them in nkrawo, arm each with a short gun or pistol, and place them in
    the path of the advancing Akyem army.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The two boys were set on a hill near present Abrodwum and were slain.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The two armies met near a great odum tree on the mountain side near Anamrako,
    fought for three days, and Ampao and many captains were killed.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: The lake was divided among the Asaman, Asansu, and Ahuren chiefs.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Ashanti say Akorobompi was following a duyker when he saw the lake, though
    the author cautions that this tradition has been too readily accepted as the origin
    of the lake name.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: At the ritual site, a flat-topped boulder called Abrodwum stone lies at the
    foot of a gyedua tree and its sides are streaked with blood from former sacrifices.
  category: object
  evidence_refs:
  - ev:12
- id: obs:13
  text: The Abrodwum stone had been moved from successive villages as advancing lake
    waters submerged them.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: The ground around the stone was swept clean before the rite.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: The headman advanced barefoot and bare-shouldered to the stone holding a white
    fowl.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: The headman addressed the stone as an immovable one and rock in a temple,
    asking it to receive the fowl, make the water fruitful, provide many fish, and
    grant life or prosperity to named chiefs, the Ashanti nation, the white man and
    Government, and those present.
  category: speech
  evidence_refs:
  - ev:16
- id: obs:17
  text: The headman wrung the fowl’s head from its body, put blood on the stone, rubbed
    the bleeding neck over it, opened the fowl, removed the heart, and cast the heart
    on the stone.
  category: action
  evidence_refs:
  - ev:17
