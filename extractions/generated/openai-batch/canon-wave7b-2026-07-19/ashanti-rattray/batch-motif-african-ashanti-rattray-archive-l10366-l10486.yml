canonical_text:
  quote: ''
  summary: The passage describes offerings to the Sky God, including white clay, mashed
    yams, sheep, and fowls, followed by the chief sleeping in the Sky God's temple.
    It then explains Ashanti shrines as potential abodes of spirits, usually brass
    pans or bowls containing ingredients, and outlines a myth in which Nyame's sons
    become important waters such as rivers, a lake, and the sea. Waters are described
    as containing the Creator's power and as life-giving.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage addresses God as Kwame, whose day of service is Saturday, and
    presents white clay as an offering connected with life for the master.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Once a year, on an appointed Saturday, priests cook mashed yams, and the chief
    places a spoonful in a pan on top of a forked branch while praying to God for
    life and strength.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A sheep is killed; its blood is allowed to fall on the ground, and pieces
    of meat are threaded on skewers projecting from the forks of God's altar, with
    words asking the deity to eat and give health and strength.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the ceremony, the chief must sleep in the Sky God's temple for eight
    nights, and one of his wives may sleep with him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the end of the eight nights, two white fowls are killed; their flesh is
    placed on skewers, and their blood and feathers are smeared over the pole or stick
    of the altar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Apart from the annual ceremony, a priest of one of the abosom may tell the
    chief or someone else to give a sacrifice to Nyame.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Old people are described as making small offerings to the great God of the
    Sky by casting them onto a hut roof or placing them on an altar beside the door.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The lesser gods are described as having power that emanates from the great
    spirit of the one God and is delegated by him so human affairs may receive attention.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A shrine is defined as the potential abode of a superhuman spirit and generally
    consists of a brass pan or bowl containing ingredients.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The brass pan becomes the temporary dwelling or resting-place of a non-human
    spirit or spirits on certain definite occasions.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The shrine is described as spiritually empty until the particular spirit for
    which it has been prepared chooses to enter it, though it has sanctity as a potential
    abode.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Blackened stools, rocks, stones, and trees may also be called shrines when
    treated as potential abodes of departed human spirits or another spiritual presence.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: A popular Ashanti myth says Nyame had various sons, including a favourite
    son, and sent these children down to earth to receive benefits from and confer
    benefits upon mankind.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Nyame's sons in the myth bear the names of important waters, including Tano,
    Bosomtwe, Bea, Opo, and other rivers or waters; tributaries are described as their
    children.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: A water that dries up in the hot season is called a 'dan Nyame' water, or
    a rely-upon-God water.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: The passage says that because of the machinations of the goat, the final resting-place
    of all the waters was not as Nyame intended; the goat is hateful to this god and
    taboo to his priests.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: Waters in Ashanti are said to contain the power or spirit of the divine Creator
