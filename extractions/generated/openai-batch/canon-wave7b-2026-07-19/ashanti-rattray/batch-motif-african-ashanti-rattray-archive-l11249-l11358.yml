canonical_text:
  quote: ''
  summary: 'Field account of episodes during the Apo ceremony: a water-pot rite before
    a shrine; display and procession of gods, shrines, umbrellas, and stools of deceased
    priests and priestesses; an egg rite involving the observer under Ta Kese’s umbrella;
    an evening storyteller whose hat carries mnemonic objects; and a fourth-day priest
    preparing ritual dress, charms, shrine objects, eggs, drums, and dance to bring
    on the spirit of his god.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A medicine man carrying a pot of water ran to a shrine, waved the pot three
    times in front of it, inverted the pot, and placed it on the ground; the ceremony
    is called summum.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Priests walked behind the brass pan of Ta Kese with uplifted hands, ready
    to catch it if it fell from the bearer’s head while the bearer was under the influence
    of the spirit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ta Kese and many other gods were under their own umbrellas during the ceremony.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Several gods were pointed out by name, and the passage gives brief name explanations
    for Ta, Ani Koko, and Kum Aduasia.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The stools of two dead priestesses, wrapped in cloths, were carried on the
    heads of two women stool-carriers under one great umbrella; another group of men
    carried blackened stools of dead priests on the napes of their necks.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bands of women ran backwards and forwards singing previously given songs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The observer was invited under Ta Kese’s state umbrella, received four eggs,
    was violently embraced by a priest, and saw that priest snatch and swallow one
    egg whole.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The remaining eggs were said to be for washing the observer’s ntoro; before
    dark the gods were returned to the pantheon containing Ta Kese’s shrine.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the evening the chief sat in the palace court-yard listening to a storyteller
    whose hat rim carried objects that represented or recalled proverbs, stories,
    or riddles.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: On the fourth festival day, fresh priests danced before an admiring circle,
    with dancing and songs much like the earlier performances.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Near the rest-house a chair held a stool, the stool held a god’s shrine, and
    sandals were placed on the shrine; nearby were drums, plates with yellow powdered
    clay and eggs, and a priest’s dress.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: A bearded priest, previously known to the observer as a hunter, dressed in
    a palm-fibre skirt and put on suman charms, saying he had come away from town
    to work the spirit of his god upon him before taking part in a dance.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Figure captions in the passage show the priest dancing with drums and singing,
