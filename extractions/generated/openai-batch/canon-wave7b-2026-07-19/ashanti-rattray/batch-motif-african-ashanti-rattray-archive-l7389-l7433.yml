canonical_text:
  quote: ''
  summary: The passage describes the Ashanti Queen Mother as retaining influence over
    women, birth and puberty ceremonies, and the morals of the young. It notes that
    a male ruler who has held a stool-house ceremony and received subjects must wait
    for the Queen Mother to salute him before returning to his room. The author reports
    that colonial officials failed to recognize women’s official power, and that older
    Ashanti women interpreted this as disregard for women; the author frames Queen
    Mothers as a potential power and as having opposed colonial influence in the past.
  language: English
  quote_policy: summarized
