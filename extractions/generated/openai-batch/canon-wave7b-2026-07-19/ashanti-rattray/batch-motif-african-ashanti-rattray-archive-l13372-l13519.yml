canonical_text:
  quote: ''
  summary: The passage describes part of an Afahye ceremony involving water sprinkled
    on the Queen Mother's stools, sacrifice and new-yam offerings, restrictions on
    who may eat new crops before the rite, and a later phase focused on gods at Ejura.
    The pantheon is washed, whitewashed, and replastered by women under a chief priestess
    while songs invoke spirits and water from Tano and Bosomtwe. A list of gods attending
    the rite is given, all described as sons of Tano, and the observer later waits
    at night by a baobab near the Konkroma temple courtyard.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Queen Mother's stools were taken part of the way to the river, and water
    was carried back and sprinkled on them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A ritual address asks for children, hunting success, the begetting of children
    by men, protection from bad sickness, and says new yams are being given so the
    recipient may eat.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pieces of sacrifice and sliced boiled new yams were placed on stools; remaining
    yams went to the chief's house, after which the chief and certain others could
    eat them for the first time that season.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage lists groups not allowed to taste the new season's crops before
    the ceremony, including ancestral spirits, the Queen Mother, the chief, stool-carriers,
    adult royal children, adults of the chief's clan, the chief's soul-washers, and
    the chief's head wife.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that if those listed ate yams before the prescribed time,
    the crops were thought not to be fruitful.
  category: other
  evidence_refs:
  - ev:4
