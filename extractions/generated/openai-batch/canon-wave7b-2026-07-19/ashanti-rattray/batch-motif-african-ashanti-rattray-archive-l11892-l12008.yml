canonical_text:
  quote: ''
  summary: The passage describes ritual and mural designs associated with Ashanti
    shrines, including binding motifs, a rainbow identified as the Sky God's bow,
    ritual instruments, shrine-wall paintings, a white stool turned aside to deter
    ghosts, and a calabash for wine offerings. It then recounts the narrator's arrival
    at Tano Oboase, his meeting with Kofi Duro, the chief and high-priest of Ta Kora,
    and his request for permission to have a new shrine made; the request is to be
    placed before Ta Kora on a sacred Friday.
  language: English
  quote_policy: summarized
