canonical_text:
  quote: ''
  summary: The excerpt first cites Bosman on an annual ceremony at Axim in which the
    Devil is ceremonially driven from town after an eight-day feast with singing,
    dancing, public satire, drink, and subsequent washing of household vessels. The
    narrator then introduces his own arrival at Tekiman in April 1922, his acceptance
    by local authorities and ritual specialists, and his permission to observe a great
    annual eight-day ceremony attended by priests and priestesses of many gods, identified
    at the end of the excerpt as the Apo custom.
  language: English
  quote_policy: summarized
