canonical_text:
  quote: ''
  summary: A communal consecration speech addresses Ta Kwesi, also called Tano’s fire,
    asking the new shrine-being to give truthful guidance about war, sickness, death,
    and causes of misfortune. The town offers sheep, fowl, and wine so the being will
    reside there and preserve the town’s life. Sacrificial blood is allowed to fall
    into a brass pan containing shrine materials. The narrator explains that a shrine
    is treated as a temporary home for a manifestation of a universal spirit, while
    lesser spirits and powers of nature may also appear during priestly ecstasy. An
    old priest states that Ashanti people must attend to many spirits of sky and earth,
    including transforming humans, witches, dangerous trees, and rivers. The passage
    closes by introducing the Ado ceremony at Tekiman and comparing it to Bosman’s
    earlier account of a ceremony at Axim.
  language: English
  quote_policy: summarized
