comparison_claims:
- id: claim:1
  claim: The narrator states that the Ado ceremony witnessed at Tekiman is the same
    ceremony that Bosman had earlier seen at Axim on the Gold Coast.
  claim_level: same_motif
  target: Bosman’s account of a ceremony at Axim compared with the Ado ceremony at
    Tekiman
  evidence_refs:
  - ev:17
  counter_evidence_refs: []
  confidence: medium
  limitations: This excerpt gives only the narrator’s comparison and migration explanation;
    it does not include the detailed descriptions of both ceremonies needed for independent
    verification.
- id: claim:2
  claim: The narrator links the coastal Axim performance and the Tekiman ceremony
    through traditions of migration from Gyaman in northern Ashanti to the coast.
  claim_level: historical_contact
  target: Brong/Fanti migration tradition connecting northern Ashanti, Tekiman, and
    the coastal belt
  evidence_refs:
  - ev:17
  counter_evidence_refs: []
  confidence: medium
  limitations: The historical-contact claim is reported as the narrator’s interpretation
    of traditions and ceremonial similarity within the passage.
