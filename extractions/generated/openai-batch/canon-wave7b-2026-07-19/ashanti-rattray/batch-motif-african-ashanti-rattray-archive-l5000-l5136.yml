canonical_text:
  quote: ''
  summary: The passage describes Ashanti ntoro and abusua classifications, marriage
    prohibitions, and rules of succession to property and stools. It presents proverbs
    treated as legal axioms and explains that inheritance is restricted to persons
    of the same abusua or blood, excluding many paternal or child relations and identifying
    maternal-line successors such as the mother’s brother and elder brother.
  language: English
  quote_policy: summarized
