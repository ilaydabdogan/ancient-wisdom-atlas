canonical_text:
  quote: ''
  summary: 'The passage first describes treatment of a child who dies before the eighth
    day as a ''little stranger ghost'': the body may be whipped, placed with sharp
    elephant grass in a pot, and buried near the women''s latrine while the parents
    stage a joyful feast to shame and discourage its return. It then describes the
    geography, names, and sacred associations of Lake Bosomtwe, including the belief
    that a dying person''s spirit goes to the lake to say farewell. A myth explains
    the lake spirit Twe emerging as a man, making love to a solitary old leprous woman,
    promising her fish from the water, and fathering Twe Adodo, the first human with
    the Bosomtwe ntoro. The passage also notes periodic Sunday appearances of Twe,
    an annual descent of Twe Adodo into the lake, and begins a rediscovery tradition
    in which the hunter Akorobompi follows an antelope and comes upon the lake.'
  language: English
  quote_policy: summarized
