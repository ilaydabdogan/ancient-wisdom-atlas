canonical_text:
  quote: "“we do not use our hands to beat you without propitiation”"
  summary: 'The passage describes the materials and fittings of ntumpane talking drums,
    then recounts a consecration performed by the drummer Osai Kojo: he marks the
    drums with “eyes,” pours spirit, breaks and smears eggs on the marked places,
    addresses Tweneboa Kodia, asks for health, skill, and good fortune, and says the
    drums are then ready for use. The passage also notes a white-cloth dressing formula
    requesting a prosperous reign and the standard placement of male and female drums.'
  language: English, with Akan ritual phrases and translations
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The tense membrane for ntumpane drums is made from elephant ear skin, preferably
    from a female elephant, and is tightened or loosened by pegs and rope.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Named trees supply materials for parts of the drum outfit: ofema for pegs
    and supports, ofenta for drum-sticks, and bofunu fibre for rope.'
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: An iron attachment called akasa is fastened on the tense membrane of the male
    drum and is described as pea-pod-shaped, with small iron pieces and rings.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The cloth for an ntumpane drum must be white; the chief presents it to the
    drummer, who fastens a strip around the drum and asks the drum to grant a prosperous
    reign and good health.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The drummer Osai Kojo said the new drums could not yet be played because they
    had no “eyes” and apparently had received no offering since leaving the workman.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Osai Kojo cut a small square with diagonal lines on the left side of the male
    drum and on the right side of the female drum; he called these marks the “eyes
    of the drums” and said they marked the place for offerings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: He poured drops of spirit on the rim of each drum while addressing Tweneboa
    Kodia and asking that those who sound the drum not fall ill.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: He broke an egg on the eye of the male drum and smeared it there, requesting
    instruction, knowledge, freedom from illness, and good fortune; he then broke
    and smeared another egg on the eye of the female drum and told it to accept and
    eat the egg.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: A fowl was also to be given to the drummer, and after this the drums were
    considered ready for use.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: When placed for playing, the male drum is normally on the left and the female
    on the right, touching or nearly touching; the arrangement is reversed for a left-handed
    drummer.
  category: setting
  evidence_refs:
  - ev:9
