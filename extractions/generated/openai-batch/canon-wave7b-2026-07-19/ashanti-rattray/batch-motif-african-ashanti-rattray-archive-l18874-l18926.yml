canonical_text:
  quote: This stool did not fall to earth but alighted slowly upon Osai Tutu’s knees.
  summary: The passage recounts a public gathering in Coomassie where Anotchi, using
    supernatural power, brings a partly gold-covered wooden stool down from the sky.
    The stool alights on Osai Tutu’s knees, is described as containing the sunsum
    of the Ashanti nation, and is consecrated with hair, nail pieces, and medicine
    from royal and chiefly participants. A note states that the Golden Stool never
    touched the ground and was never sat upon as an ordinary stool.
  language: English
  quote_policy: quoted
