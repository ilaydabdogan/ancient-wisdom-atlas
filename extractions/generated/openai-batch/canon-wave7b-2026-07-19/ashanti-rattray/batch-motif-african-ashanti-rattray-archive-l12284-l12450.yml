  summary: The passage describes the close of an oracular possession sequence, the
    priest’s dazed recovery and lack of memory, temple observations concerning charms,
    murals, dormant shrines, spirit descent as a means of becoming a priest, taboos
    of Ta Kora, and the beginning of Fofie rites in which eggs are broken and their
    yolks rubbed on the shrines of Ta Kora and Ati Akosua while prayers for life and
    protection are spoken.
