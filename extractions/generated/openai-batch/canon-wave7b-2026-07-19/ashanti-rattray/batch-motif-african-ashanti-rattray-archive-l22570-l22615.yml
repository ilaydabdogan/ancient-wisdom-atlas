canonical_text:
  quote: ''
  summary: The passage records Ashanti beliefs and elder testimony about stone implements
    called “God’s axes” or 'Nyame akuma. They are described as medicinally potent
    objects associated with gods, charms, the Sky God’s altar, drinking water, bodily
    cures, and ingestion as powder. Several elders and named informants also report
    traditions that these implements were once long stone hoes used by Ashanti ancestors,
    before or alongside iron smelting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Stone implements are said to be regarded as potent medicine and are found
    with abosom, suman, the 'Nyame dua altar, or in a pot where drinking water is
    kept.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The implements are sometimes fastened against the body to cure diseases, or
    ground down so that the powder can be drunk.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator states that popular beliefs about the implements are encouraged
    by akomfo, while some old people remain silent, confess ignorance, or acquiesce.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Several old men told the narrator that traditions identify the so-called “God’s
    axes” as tools used by ancestors before and during a period when iron smelting
    was practiced.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kakari reports that his grandfather told him the Ashanti once used stone hoes
    now called 'Nyame akuma, and that ancestors formerly wore a girdle with leaves
    before and behind.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kakari reports that the axes were originally very long and were used for hoeing,
