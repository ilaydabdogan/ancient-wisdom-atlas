  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kakari could not clearly say whether the implements were hafted.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kobina Wusu reports that his grandfather said very old Ashanti used stone
    hoes a cubit long, and he demonstrated the length with his arm and hand.
  category: speech
  evidence_refs:
