  quote: ''
  summary: The passage introduces Rattray's memorandum on the Golden Stool after recent
    events in Coomassie. It states that misunderstanding of the object has had serious
    consequences and that its supposed desecration or destruction has caused national
    mourning among the Ashanti. The author explains his former reluctance to ask about
    the matter, then describes asking Ashanti friends for its history after the words
    Sika ’Gua became widely discussed. A note reports red clay mourning marks on heads
    and arms in towns and villages.
