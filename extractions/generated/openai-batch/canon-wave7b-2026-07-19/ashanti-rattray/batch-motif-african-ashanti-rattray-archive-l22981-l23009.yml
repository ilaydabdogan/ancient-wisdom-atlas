  summary: The passage discusses a fluted stone celt or hoe, suggests functional reasons
    for its form, and proposes that stone and iron implements were used side by side
    during a gradual transition to the Iron Age. It explains the rarity of full-sized
    “God’s axes” by arguing that most stone implements were used down to short, stumpy
    forms, while only pieces lost before heavy use would survive in their original
    shape.
