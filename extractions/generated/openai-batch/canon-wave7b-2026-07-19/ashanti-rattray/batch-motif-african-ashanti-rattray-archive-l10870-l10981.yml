canonical_text:
  quote: ''
  summary: 'The passage describes part of the Apo ceremony: shrine processions by
    priests and priestesses, ceremonial greetings between covered shrine-pans, display
    of blackened stools of former ritual specialists, use of white powdered clay,
    a Wednesday pause in shrine processions, the chief’s expectation of ritual abuse,
    and women’s groups singing translated Apo songs that criticize kingship, political
    failure, and named historical or genealogical figures.'
  language: English
  quote_policy: summarized
