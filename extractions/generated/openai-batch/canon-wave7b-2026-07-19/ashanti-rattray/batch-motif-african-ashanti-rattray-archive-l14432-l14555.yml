canonical_text:
  quote: ''
  summary: 'The passage describes Ashanti land-tenure obligations and services: greater
    chiefs hold under the Ashanti King; tenants owe military service, fealty, reliefs,
    aids, and escheat obligations; a fealty ceremony uses a stool, removed sandals,
    a sword gesture toward sky and earth, the chief''s foot on the oath-taker''s head,
    and an oath invoking the Sky God and Earth deity.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Greater chiefs became tenants in capite of the Ashanti King while retaining
    substantial rights to their lands, and they owed services at Coomassie.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Military service, called Osako, is presented as the most important service:
    a tenant and his family must follow and fight for the person from whom they hold
    land; refusal would result in forfeiture of land.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Because a man's children are not of their father's clan, war between a father's
    clan and a child's clan creates a divided allegiance; the passage reports a later
    arrangement in which one son could fight for the father's clan and another for
    his own blood group.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Fealty, called nsua, is sworn by a tenant to a chief and by a chief to a king.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the described fealty ceremony, the oath-taker approaches a seated chief,
    removes or stands on sandals, receives a sword, raises it to the sky, lowers its
    point to earth, bows his head, and has the sole of the chief's left foot placed
    on his crown.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The oath says that if the oath-taker fails in service, help in ruling, or
    truthfulness, the Sky God and Earth deity may 'get' him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A stranger who receives land also swears fealty, and both tenant and owner
    drink abosom.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Reliefs are death-related payments or shares owed on a tenant's death; they
    concern personal and privately acquired property, while land and family property
    are excluded, and the heir sends a funeral contribution.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Aids, called Etuo, include contributions for a chief's funeral, stool purchases
    or regalia, buildings, debts, war expenses after war, and religious customs.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: If a tenant dies without heirs, movable property, slaves, and money escheat
    to the overlord.
  category: relationship
  evidence_refs:
  - ev:9
