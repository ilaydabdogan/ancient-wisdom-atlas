  summary: The passage describes Ashanti land grants, obligations and reversion, then
    explains Ashanti mortgage law, including terminology, witness procedure, libation
    to stools and spirit ancestors, distribution of a witness fee, and rules preserving
    redemption rights over generations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A grant of land in fee simple was made in the presence of the interested parties
    and their witnesses, with a stated formula of presentation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The grantee became effectively owner of the land, but denial of the grantor's
    reversionary title or repudiation of expected obligations caused the land to revert
    to the grantor.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:3
  text: The passage says land grants encouraged strangers and settlers to become attached
    to the clan or stool that had given them settlements, increasing a chief's followers
    and indirectly his wealth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The grant in fee simple was connected with definite services, especially the
    obligation to fight for the grantor.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Ashanti word for mortgage is given as awowa; the mortgagor is called okafo
    and the mortgagee osikani.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the described mortgage, the borrower entered upon and made full use of
    the land; produce either served as interest while the land secured the loan or
    was applied for a fixed time to liquidate loan and interest.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The mortgagor and mortgagee, with adult witnesses, viewed the land and its
    boundaries as part of the procedure.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Some mortgage money was used to buy rum, and the mortgagor, if a chief, poured
    some over his stools to inform his spirit ancestors and ask their help in redeeming
    the mortgage.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The mortgage money was paid to the mortgagor in the presence of witnesses,
    and a portion called ntiani was divided among presiding authorities and witnesses.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that an Ashanti mortgage could run for generations, that
    no limitation barred redemption, and that the mortgagee could not foreclose without
    giving the mortgagor a full chance to redeem.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: A note reports a similar rule in Ewe country east of the Volta, where heirs
    of mortgagors brought redemption money to heirs of mortgagees for long-pledged
    land.
  category: other
  evidence_refs:
  - ev:9
