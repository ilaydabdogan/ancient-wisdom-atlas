canonical_text:
  quote: It does not contain our soul
  summary: A senior Ashanti Queen Mother presents Princess Mary's Silver Stool as
    a wedding gift from the Queen Mothers and women of Ashanti. The speech contrasts
    it with the Golden Stool, which contains the soul of the Ashanti nation, while
    the Silver Stool contains the women's love. The passage also states Ashanti rules
    of matrilineal royal transmission, invokes Nyankopon for blessing, and describes
    the ritual selection, propitiation, cutting, and carving of an osese tree into
    the stool.
  language: English
  quote_policy: quoted
