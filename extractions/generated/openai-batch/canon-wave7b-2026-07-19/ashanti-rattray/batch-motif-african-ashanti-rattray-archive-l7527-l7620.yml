  summary: An introductory methodological passage states that earlier anthropology
    of this region depended mainly on educated African informants and on Europeans
    questioning uneducated Africans through interpreters. It argues that mission-educated
    and semi-educated intermediaries often lacked sympathy with older beliefs, while
    elder custodians of lore would not disclose their knowledge to a foreign stranger
    through such a medium.
