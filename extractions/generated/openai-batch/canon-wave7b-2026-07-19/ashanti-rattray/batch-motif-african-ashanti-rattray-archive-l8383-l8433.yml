canonical_text:
  quote: ''
  summary: During a Wednesday Adae ceremony, a drummer plays a cautionary summons
    while messengers urge the chief to appear. The omanhene emerges richly dressed
    and adorned with gold, followed by kwadwumfo who recite the names and deeds of
    dead rulers. At the palace gate he is met by young royals and attendants bearing
    plumes, swords, staves, keys, sandals, drums, and umbrellas. He proceeds slowly
    and carefully to his seat, with special concern that he not stumble; a footnote
    describes older customs connected to a king’s stumble.
  language: English
  quote_policy: summarized
