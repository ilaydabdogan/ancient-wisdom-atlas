canonical_text:
  quote: ''
  summary: A field-recorded account describes the making and consecration of a shrine
    for one of the Tano gods. After possession is diagnosed, the possessed person
    prepares ritual materials, dances, captures or retrieves an unidentified object,
    cools it with water, and places it in a brass pan with clay, plants, roots, gold,
    and beads. An incantation invokes deities, forest beings, and a tree while installing
    Ta Kwesi and asking for communal life and aid.
  language: English with Ashanti/Twi incantation and English translation
  quote_policy: summarized
