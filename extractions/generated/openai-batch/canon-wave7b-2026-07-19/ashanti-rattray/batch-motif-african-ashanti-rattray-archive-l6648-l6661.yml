  summary: The narrator records a raft survey offshore from Abono, identifying two
    abandoned village sites by soundings and anchored markers. Abono No. 2 is marked
    by an anchored raft and associated with the reign of Mensa Bonsu; Abono No. 1
    is marked by an anchored log and associated with the reign of King Kwaku Dua I.
    The present chief of Abono is said to have been born at Abono No. 1.
