  summary: The passage explains the limits and conventions of Ashanti talking-drum
    communication, lists common drum-message subjects, distinguishes ntumpane and
    fontomfrom drums, and describes the chiefly commissioning and ritual manufacture
    of ntumpane from a tweneboa tree through offerings, spoken petitions, cutting,
    carving, transport to the village, and assembly of the drum outfit.
  language: English
