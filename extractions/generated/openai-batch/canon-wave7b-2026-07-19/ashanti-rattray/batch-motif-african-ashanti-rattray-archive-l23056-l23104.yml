  summary: 'The appendix passage discusses anthropometric measurements and comparisons:
    cephalic, nasal, bizygomatic, and facial indices; resemblance and divergence from
    Keith’s Nigerian types and Sergi’s figures; a notable difference in stature; the
    exclusion of one unusually short female from statistical constants; and an argument
    that the measured series appears relatively homogeneous rather than racially mixed.
    It also cites Arthur Thomson on correlations between nasal index and climatic
    conditions.'
