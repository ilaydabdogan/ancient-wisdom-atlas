canonical_text:
  quote: ''
  summary: In the sacred grove at Santemanso, the chief/officiant addresses Santeman
    Kobina over ritual pots while a sheep is held. The translated prayer says Pensan
    has brought sheep, wine, and cloth after failing to bring marriage gifts, and
    asks for life, fertility, and well-being. Wine is poured into a hole, on a stone,
    and on the ground for Bohyemo. A sheep is killed; its blood and meat are distributed
    to pots, the stone, and the hole. The cutting-up of the sheep is accompanied by
    loud noise. The Queen Mother places meat portions into ritual vessels and locations,
    and strips of white calico are tied around a fig tree and other nearby trees and
    creepers.
  language: English with Akan ritual speech and English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief/officiant, with his feet out of but upon his sandals, takes rum;
    a hunchback herald first sips a little, and the chief leans over pots to speak.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One of two sheep is held across the shoulders of a man while the chief/officiant
    speaks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prayer addresses Santeman Kobina and states that Pensan took Ofiri in
    marriage but had not brought marriage gifts, causing sickness; Pensan now brings
    a sheep, wine, and cloth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The prayer asks for life, bodily well-being, life for the Asante nation, the
    Government, and the white man, and children for Pensan and his wife; it invites
    the recipient to eat the sheep and drink the wine.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The drums are described as speaking; the narrator says he could not make out
    what they said and speculates they may have indicated that the spirits were drinking.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The chief pours wine into the hole dug by the Queen Mother, then on the truthful
    stone, and finally on the ground for Bohyemo, the leopard described as the son
    of Santeman.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The first sheep is held by several men by the legs and muzzle to prevent it
    crying out, and the chief presses a small pointed knife into its throat while
    addressing Santeman Kobina.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The blood is allowed to drip into each small pot, then over the truthful stone,
    and finally into the hole; Dansu cuts the sheep’s throat and the blood is collected
    in a brass basin.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The carcass is placed on leaves near the stools and cut up amid loud, simultaneous
    talking; the narrator reports that the noise seemed to be an intentional part
    of the rite.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Young royals snatch small pieces of meat as it is cut up and are playfully
    switched with twigs by elders; the carcass is moved beside the pots where the
    youngsters do not dare go.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Queen Mother places small meat pieces in a kuduo, then uses a brass spoon
    to put spoonfuls into each of the eight pots, into the hole, and onto the stone;
    a spoonful is given for the chief, the sheep’s head is laid beside the pots, and
    the rest of the meat is divided.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Pieces of white calico are torn off and fastened around the fig tree and several
    other nearby trees and creepers; the remaining cloth is shared.
  category: action
  evidence_refs:
  - ev:7
