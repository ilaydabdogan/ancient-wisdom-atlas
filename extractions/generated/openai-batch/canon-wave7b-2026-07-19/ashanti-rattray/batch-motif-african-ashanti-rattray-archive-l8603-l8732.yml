canonical_text:
  quote: ''
  summary: The passage records part of a Sunday Adae and the beginning of a Wednesday
    Adae. In the Sunday sequence, a sheep is offered to the Ghost Grandsires, its
    blood and portions are applied to stools, rum is poured, a bell is rung, the chief
    is summoned and seated publicly, palm wine circulates, and the chief is later
    carried to a forest glade. The Wednesday account describes a palace-courtyard
    setting, drums, the chief’s appearance with young minstrels, the fetching of blackened
    stools, and an intervening oath ordeal in which a priest drinks a god-potent liquid
    and swears to speak truth under threat of divine death.
  language: English
  quote_policy: summarized
