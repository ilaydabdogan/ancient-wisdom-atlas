canonical_text:
  quote: ''
  summary: 'The passage introduces Ashanti drum language. It reports that Ashanti
    and some other West Coast peoples can send messages over long distances rapidly
    by drums, rejects a Morse-code model, and explains the practice as drum-talking:
    two differently pitched drums imitate the tones and sounds of spoken words. The
    narrator outlines a planned account of the drums, their making and associated
    religious observances, a full drum-history set piece, phonographic records, lessons
    from expert drummers, and the linguistic basis supplied by Ashanti as a tonic
    language.'
  language: English
  quote_policy: summarized
