  summary: The passage introduces an investigation of Ashanti ntoro divisions and
    Bosomtwe ntoro. It defines ntoro as an exogamous division or spirit inherited
    through the male line, contrasted with female-transmitted blood or abusua, and
    records beliefs about conception, sunsum, semen, marriage prohibitions, washing
    days, taboos, and totems.
