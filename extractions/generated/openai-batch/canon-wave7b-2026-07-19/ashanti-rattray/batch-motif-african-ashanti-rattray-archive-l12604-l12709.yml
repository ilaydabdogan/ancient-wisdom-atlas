canonical_text:
  quote: ''
  summary: The passage describes ritual actions at the shrine of Ta Kora, including
    placing staves, beads, cloth, and cowrie shells on or near the altar. Two clay-powdered
    women akomfo dance, kneel, and call out “father.” The group later processes to
    the natural shrine of Tano, the “King from within the rock,” passing a temple
    of Ntoa, crossroads leading to a cave and the Tano River source, and paths associated
    with earlier royal consultation of Tano. At the sandstone rocks, some participants
    halt, priestesses curtsy near Ame Yao’s cave, and two men bar further passage
    until paid gold dust.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two silver-topped staves belonging to the akyeame were brought, rested on
    the altar against the shrine of Ta Kora, and hung with a string of beads called
    akomen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ta Kora was covered with a native-woven cloth bearing a small cross of cowrie
    shells, then a larger striped cloth was placed over all, and the staves and beads
    were replaced on the altar.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two women akomfo, described as not priestesses of Ta Kora, danced in the courtyard
    with drums and songs while heavily powdered with clay.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The two women repeatedly ran into the room, bent on one knee, and uttered
