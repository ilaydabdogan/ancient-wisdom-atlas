canonical_text:
  quote: "“Let all evil sickness away and may a good year meet us once more.”"
  summary: 'The passage describes part of the Afahye ceremony: songs invoke Tano;
    the head priestess of Konkroma emerges, dances, is covered in white clay, and
    speaks when the spirit of Ta Amoa comes upon her. A ritual phrase gives the king
    a path, after which she is carried into the temple. Later, shrines are carried
    in procession with water, yams, guns, drums, and attendants to the Asasebon River,
    where river water is mixed with water brought in a pot and used in a rite by Konkroma’s
    linguist.'
  language: English with Akan ritual phrases
  quote_policy: quoted
