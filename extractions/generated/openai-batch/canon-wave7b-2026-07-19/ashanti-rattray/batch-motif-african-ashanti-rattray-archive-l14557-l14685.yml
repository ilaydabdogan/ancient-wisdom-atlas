canonical_text:
  quote: ''
  summary: The passage describes Ashanti rules concerning forfeiture, treasure trove,
    agricultural service, court attendance, and forms of land tenure. It compares
    Ashanti restrictions on alienating land with earlier English fee-simple law, emphasizes
    that landholding is not individual ownership but a trusteeship accountable to
    kin, councillors, family, and the dead, and describes matrilineal succession and
    marriage-based land grants from a wife’s family. Notes mention gifts sent north
    to solicit prayers at Mecca and a tribunal response to desecration of the Golden
    Stool.
