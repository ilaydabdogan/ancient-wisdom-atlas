canonical_text:
  quote: ''
  summary: A letter written on behalf of Princess Mary thanks the Queen Mothers and
    women of Ashanti for a Silver Stool given as a wedding gift, expresses sadness
    at the death of the Queen Mother who organized the gift, and offers sympathy.
    The passage then opens a chapter on Ashanti goldsmiths, gold weights, and kuduo,
    discussing prior literature, doubts about whether intricate cast objects can function
    as accurate gold weights, their connection with proverbial sayings, and captions
    showing a Queen Mother instructing her daughter and a Stool carried under an umbrella.
