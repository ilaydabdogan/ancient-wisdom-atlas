  quote: ''
  summary: A signed assay-office letter reports examination of two mud samples from
    Lake Bosomtwe. The writer describes their composition, notes no detected free
    sulphur, mentions a possible fish scale, reports absence of rock chips and useful
    minerals, and concludes the mud is likely suspended matter accumulating on the
    lake bottom with little bearing on periodic disturbances. A stream mud sample
    from Obuasi is said to be similar.
