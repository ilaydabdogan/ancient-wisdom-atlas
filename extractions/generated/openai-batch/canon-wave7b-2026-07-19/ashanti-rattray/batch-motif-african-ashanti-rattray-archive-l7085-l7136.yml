canonical_text:
  quote: ''
  summary: The passage explains an Ashanti understanding of descent in which bogya,
    or blood/clan identity, is not transmitted by the male parent, while the male-transmitted
    ntoro is associated with spirit and sometimes semen. Abusua, described as clan
    or blood, determines succession to stools and property inheritance, while ntoro
    chiefly regulates some sexual unions by exclusion. The author states that this
    social organization elevates women's status, cites a proverb that a woman gave
    birth to a man, and adds a royal succession example in which sons of king’s sisters
    could become king through their mothers’ royal blood even if their fathers were
    socially inferior or enslaved.
  language: English
  quote_policy: summarized
