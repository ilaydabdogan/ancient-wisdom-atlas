canonical_text:
  quote: ''
  summary: 'The passage describes pipe-like pottery fragments from Ashanti identified
    by an elderly Ashanti man as nsemua, implements said to have been handed down
    by ancestors and used for smelting gold. Assay evidence is reported: used samples
    showed traces of gold, one end bore ferrous silicate, and the objects were concluded
    to be tuyers for a native blast furnace.'
