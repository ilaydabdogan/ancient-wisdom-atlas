canonical_text:
  quote: ''
  summary: 'The passage describes Asante land tenure and alienation: conditional post-death
    residence and life interests, leasehold formation by public formula and produce
    payment, transfer ceremony including wine for spirits of the dead, communal and
    spiritually sanctified landholding that limits sale or seizure, and fee-simple
    grants to newcomers ratified by consent, rum offering to spirits, and reciprocal
    services.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wife may have a right to remain in the house after her husband's death,
    subject to good behaviour, because she may become the property of the late husband's
    heir.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: An estate may be given to a man for his life or as long as he remains the
    husband of a certain woman.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Land could be granted to a favourite household slave for life with reversion
    to the donor, while the slave's children were often allowed to continue occupying
    and using the land if they served the household.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: A leasehold could involve a grantee holding land from a grantor in return
    for a fixed annual payment of a proportion of the soil's produce.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A leasehold was created when the owner, with family permission, spoke a transfer
    formula to the grantee in the presence of witnesses.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Military service and aids were optional for the lessee, who could give up
    the land instead; wine for the samanfo was always part of the transfer ceremony.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Awowa is described as resembling leasehold at first sight but as arising from
    a mortgage of land.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that in Ashanti land was not individually owned but held
    by an interested group, valued highly, and associated with spiritual sanctity.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Communal and family interest in land protected it from forfeiture, and the
    king did not seize an offender's land because of expected clan opposition.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ashanti people are said to have regarded land as their greatest worldly asset,
    and women could own land apart from men.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Fee-simple grants to a tribesman or stranger could be made with the consent
