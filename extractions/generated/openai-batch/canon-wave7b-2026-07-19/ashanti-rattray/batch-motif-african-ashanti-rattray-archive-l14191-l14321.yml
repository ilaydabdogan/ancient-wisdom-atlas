canonical_text:
  quote: ''
  summary: 'The passage gives a historical and legal reconstruction of Ashanti landholding
    and political authority: isolated matrilineal clan or family groups, headed through
    the Queen Mother and delegated male kin, united into larger clan groupings under
    chosen chiefs; family lands became tribal lands and later stool lands associated
    with chieftainship, augmented by conquest and other legal processes; unwritten
    history preserved ancestral and Oyoko royal names, titles, and deeds.'
  language: English
  quote_policy: summarized
