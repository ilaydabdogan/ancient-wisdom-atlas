  quote: ''
  summary: The passage first comments on a ceremony in which fasting, private solemn
    rites, later public relaxation, and controlled consumption of liquor are described.
    It then records the Baya ceremony at Nsoko, where offerings of rice, ground-nut
    soup, and water are made to the samanfo, the spirits of dead ancestors, in thanksgiving
    for the previous rice crop and to seek blessing for the next season. The passage
    notes similar rice-related rites elsewhere and describes rooms, platforms, pots,
    and bottles prepared for ancestral eating and drinking.
