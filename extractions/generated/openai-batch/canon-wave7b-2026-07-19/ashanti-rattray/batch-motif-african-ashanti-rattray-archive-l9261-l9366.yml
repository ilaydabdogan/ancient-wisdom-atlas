canonical_text:
  quote: the first human beings, belonging to certain of their ruling clans, came
    forth from the ground
  summary: The passage closes an account of Adae ceremonies by noting the mingling
    of ancestor propitiation and worship of gods, then introduces the sacred grove
    at Santemanso as an especially hallowed Ashanti site. It reports a myth that ancestors
    of ruling clans emerged from the ground there, settled, learned fire and other
    arts, multiplied, scattered, and became the clans from which later kings and queens
    were chosen. The passage also describes physical features of the grove, prohibitions
    on cultivation, reverent behavior during a visit, and a clearing with Costus shrubs,
    an ancient wild fig tree, and eight buried pots.
  language: English
  quote_policy: quoted
