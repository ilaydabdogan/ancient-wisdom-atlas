canonical_text:
  quote: ''
  summary: During a Brong Adae ceremony, wine offerings are addressed to the god Ta
    Kese Birimpon. The prayers ask for life, strength, health, fertility, prosperity,
    money, successful foraging or hunting, and avoidance of trouble. The priest pours
    wine at the altar, the remaining wine is shared, participants converse quietly,
    and food placed by blackened stools is later to be given to the stool-carriers'
    children.
  language: English with Akan quoted speech and English translation
  quote_policy: summarized
