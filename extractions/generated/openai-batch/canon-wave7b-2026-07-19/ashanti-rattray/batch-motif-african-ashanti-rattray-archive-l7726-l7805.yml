canonical_text:
  quote: ''
  summary: The passage criticizes the broad use of “fetish” and “fetishism” for West
    African religion, comparing that usage to how Greek and Roman religious practices
    would be mislabeled under the same logic. It then introduces the Ashanti Adae
    ceremony as a recurring rite for propitiating ancestral spirits of departed rulers.
    It describes how a deceased ruler’s white stool is blackened into a black stool,
    deposited in a stool house, and treated as a shrine connected with the owner’s
    soul and spirit. The passage also notes the Adae’s Sunday and Wednesday forms
    within a forty-three-day cycle.
