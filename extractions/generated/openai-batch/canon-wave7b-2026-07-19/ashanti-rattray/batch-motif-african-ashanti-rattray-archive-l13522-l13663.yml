canonical_text:
  quote: ''
  summary: During the Afahye ceremony, the narrator meets Opoku, an Ashanti hunter,
    and discusses spiritually dangerous animals. At midnight, drums and spirit-calling
    singers perform in the temple courtyard. The songs address Death, call deities
    including Tano/Twumpuduo and Banie, use hunter and animal imagery, describe a
    hunter lamenting after killing a spiritually powerful animal, and include drum-speech
    about a hero, leopard, king, and a primordial stream whose origin is linked to
    the Creator.
  language: English
  quote_policy: summarized
