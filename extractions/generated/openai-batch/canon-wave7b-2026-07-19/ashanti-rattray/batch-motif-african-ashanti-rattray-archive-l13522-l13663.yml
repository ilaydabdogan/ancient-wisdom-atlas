  evidence_refs:
  - ev:3
- id: obs:7
  text: The songs state that Twumpuduo, also named Tano Twumpuduo, has come, and call
    Banie to come quickly.
  category: speech
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:8
  text: After the narrator gives the drummers two shillings, they drum a response
    thanking a brave man whose skin smells of gunpowder.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A song says the hunter has killed and has tears near his eyes; Opoku explains
    that the bongo is meant and that a hunter laments after killing one of the sasa
    boa.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: A song says entangling creepers lie upon someone and asks whether they will
