canonical_text:
  quote: the edge of the year has come round, and we are sprinkling you with water
    that you may eat yams
  summary: During an Afahye ceremony, named figures address Amoa Kotoku and associated
    persons or spirits, saying the year has come round and that they sprinkle water
    so yams may be eaten. Offerings of yams, a sheep, wine, and salt are presented.
    Shrines are sprinkled with water, carried through the village, brought into the
    stool-house with blackened stools, and later returned to the pantheon. Priests
    and a chief priestess dance with shrines while powdered with clay.
  language: English with Akan ritual speech transcribed and translated
  quote_policy: quoted
