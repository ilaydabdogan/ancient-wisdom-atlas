  summary: In a preface, the speaker describes urging Ashanti people not to abandon
    their own institutions, religion, manners, customs, and past in favor of blind
    imitation of European culture. He presents the new Department as studying, helping,
    advising, and conserving beneficial customs. He reports a positive response and
    depicts Ashanti society as standing at a parting of ways between unrest caused
    by institutional decay and a surer course guided by retained landmarks.
