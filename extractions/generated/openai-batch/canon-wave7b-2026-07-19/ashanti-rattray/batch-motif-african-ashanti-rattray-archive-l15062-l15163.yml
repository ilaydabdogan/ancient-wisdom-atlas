canonical_text:
  quote: "“Spirits, this is my child to whom I have given this land…”"
  summary: The passage records a formula addressed to spirits during a land grant
    to a child, asking for health, long life, and plentiful crops. It then discusses
    samansie as a limited form of testamentary land transfer sanctioned by ancestral
    authority, compares a similar Fanti procedure, and reflects on changed land obligations,
    stool revenues, chiefly authority, and the preservation of Ashanti court organization.
    The passage ends by introducing West African drum language as a subject of widespread
    curiosity and misconception.
  language: English with an Akan formula
  quote_policy: quoted
