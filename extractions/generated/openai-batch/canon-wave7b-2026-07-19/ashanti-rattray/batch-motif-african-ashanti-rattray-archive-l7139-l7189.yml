canonical_text:
  quote: ''
  summary: The passage explains that, although certain Ashanti marriage and inheritance
    practices might appear to treat wives as transferable property, matrilineal descent
    gives women strong protection and status. A woman is backed by her blood family;
    her children and property belong to her and her clan; female blood relations inherit
    before males; and women are described as the transmitters of blood to kings and
    clans.
  language: English
