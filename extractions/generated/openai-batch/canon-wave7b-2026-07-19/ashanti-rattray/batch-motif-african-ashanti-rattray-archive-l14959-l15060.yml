canonical_text:
  quote: ''
  summary: The passage describes Ashanti land customs concerning sale, redemption,
    and wills of land. It reports that outright sale was treated as exceptional and
    not necessarily beyond redemption. A custom called pon allowed a vendor or heir,
    through the chief and with payment and sacrifice, to seek return of family land,
    with burial-ground exceptions. A footnote compares this to Levitical land redemption
    law. The passage then describes samansie, a family-approved verbal gift or will
    by which a man may leave a small portion of land to a son, accompanied by an aseda
    offering and a libation addressed to ancestral spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Informants told the author that before selling land, a debtor would try to
    raise money by a loan, called awowa, and that only dire necessity was assumed
    to justify a sale.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that his inquiries led him to think outright sale of land
    for valuable consideration was a comparatively modern innovation and formerly
    unthinkable.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: A sale, including one described as tramma, was not treated as alienation of
    land beyond all hope of redemption.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The vendor, or the vendor's heir, could approach the chief requesting permission
    to repurchase family land by paying the original money received and an overplus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the pon procedure, a sheep was bought and sacrificed; if the purchaser
    agreed, the land returned to the original family that had owned it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: If the purchaser or purchaser's heirs had made a family burial-ground on the
    land, that portion was not re-conveyed.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The procedure is called pon, and the redeemer is said to pon asase.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: A recognized method called samansie allowed a man, with full family consent,
    to leave a small portion of his land to a son by verbal gift or will, taking effect
    during his lifetime or after death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the described samansie procedure, the man calls his kindred, states his
    wish to leave land to a son, and, if the abusua agree, the son brings gold dust
    and rum called aseda, which is divided among those present, including witnesses.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The father then pours some rum upon the ground and addresses the ancestral
    spirits, called samanfo.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The author notes an almost exact similarity between the Ashanti custom and
    old Levitical law on land not being sold forever and kin redeeming what a poor
    brother sold.
  category: relationship
  evidence_refs:
  - ev:7
