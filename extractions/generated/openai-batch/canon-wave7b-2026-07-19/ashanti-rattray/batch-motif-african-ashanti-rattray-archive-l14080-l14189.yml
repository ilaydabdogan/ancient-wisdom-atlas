literal_observations:
- id: obs:1
  text: The passage states that belief in spirit ownership of land is modified by
    a belief that departed spirits act mainly upon members of their own clan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old Ashanti informant says spirits of people outside one's clan cannot
    affect the questioner's group because such spirits can take revenge only on their
    own kindred.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same informant says that defeating and making subject people of one's
    own clan also renders their ghost ancestors subject and harmless.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a witnessed Adae, after rites in the stool-house and a state reception,
    the chief and officers went to a grove in the forest.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the grove, eleven small enamel bowls were arranged in two rows, and palm
    wine was poured into each bowl from a large demijohn.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The names spoken over the bowls were different from the names spoken in the
    stool-house.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narrator was later told that the spirits addressed in the grove were the
    real owners of that piece of land and were propitiated to avoid unpleasantness
    between friendly parties.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that a larger stool might publicly swear to its right to
    the disputed land while nevertheless making acknowledgement to the dead.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage describes tribal memory as kept by appointed persons whose duty
    is to remember names and events in correct chronological order.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Custodians of tribal lore and their understudies had to be word-perfect, and
