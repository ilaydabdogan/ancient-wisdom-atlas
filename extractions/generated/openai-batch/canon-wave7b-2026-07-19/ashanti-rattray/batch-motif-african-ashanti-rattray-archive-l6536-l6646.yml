canonical_text:
  quote: "“the lake conceives”"
  summary: 'The passage records reports about Lake Bosomtwe periodically undergoing
    a disturbance: its water darkens, a gunpowder-like smell arises, and many fish
    appear dead or gasping on the surface. Lake dwellers interpret recent absence
    of the event as the lake spirit withholding gifts because taboos are being broken.
    The passage also describes attempts to investigate the lake’s depth and rising
    level, including accounts of former villages now under water and tree stumps protruding
    from the lake.'
  language: English
  quote_policy: quoted
