canonical_text:
  quote: ''
  summary: The passage describes ceremonies at the sacred grove at Santemanso, including
    offerings of spirits, sheep, blood, and meat to named recipients, ritual handling
    by the chief and Queen Mother, disposal and distribution of sacrificial remains,
    and further information about the fig tree as a sanctuary for persons under threat
    of death.
  language: English with quoted Akan and English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fig tree is described as a famous sanctuary where a person sentenced to
    death who escaped there would be safe.
  category: setting
  evidence_refs:
  - ev:1
  - ev:9
- id: obs:2
  text: All present returned thanks to Pensan, identified as the Queen Mother’s husband,
    before the next ceremony began.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the second ceremony, the chief stood over pots while holding a glass containing
    spirits and addressed Santeman Kobina.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief’s speech to Santeman Kobina offered wine and a sheep, identified
    Monday as the day on which Santeman Kobina eats, and petitioned for safety, health,
    fertility, public peace, and benefit to the Government.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The chief poured spirits into a hole in the ground, upon a stone, and upon
    the ground after changing the glass from his right hand to his left hand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chief addressed Bohemo as a leopard who springs to the left and gave an
    offering to Bohemo after saying that Bohemo’s father was being given something
    to eat.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A second sheep was supported on the neck of a stool-carrier, its throat was
    pricked, and its blood was allowed to drip on the stone, into the hole, and into
    the pots.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The sheep was killed and cut up; small portions, including three pieces each
    of several organs and body parts, were placed in the kuduo.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Queen Mother used a brass spoon to lift pieces from the kuduo and place
    some in each pot, on the stone, and in the small hole.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A small piece of the breast was dipped into the hole by the Queen Mother,
    taken out, and handed to the herald to take home for the chief; the stated purpose
    was for it to get ‘the spirit’.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The remaining sacrifice was divided among the Queen Mother, the chief and
    elders, the linguist, and the Queen Mother’s household.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Offerings in the little pots were reported to have disappeared by the following
    day, and white cloths were left upon the trees.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A specified place near the grove was used for throwing away the contents of
    the intestines of the sacrifice; the old woman who had carried the kuduo showed
    the men where it was.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: Further information states that a person sentenced to death or about to be
    killed at a funeral custom could run away, catch hold of the fig tree, and generally
    be spared, becoming a servant of the grove.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: If the King of Ashanti insisted that such a protected person be returned for
    punishment, the informants said that something would happen to the king before
    the year was over.
  category: speech
  evidence_refs:
  - ev:9
