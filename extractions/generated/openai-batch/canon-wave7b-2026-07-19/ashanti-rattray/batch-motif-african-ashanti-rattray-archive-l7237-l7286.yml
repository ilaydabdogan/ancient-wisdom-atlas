  summary: 'The passage describes Rattray’s access to old Ashanti women as informants
    and summarizes claims about the Ohema or Queen Mother: her senior stool, her relation
    to the chief’s stool, her role in local government and chiefly selection/enstoolment,
    and restrictions on women’s war participation connected to menstruation avoidances,
    with named exceptions of older queens who accompanied armies.'
