canonical_text:
  quote: ''
  summary: 'The passage describes sacrifices and offerings connected with Lake Bosomtwe/Twe:
    fowl and whisky at a stone, a white fowl cast into the lake, an older annual ceremony
    involving fowls, a cow, a sheep, and a dog, injuries during ritual path-clearing
    attributed to disturbed spirits of the dead, and the river Aberewa Awukuwa as
    mother of the lake spirit.'
  language: English with Akan ritual speech
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fowl is dissected; portions of legs, wings, breast, lungs, intestines, and
    liver are laid upon a stone, and the remainder is shared among those present.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Whisky is poured over the stone with wording adapted from the fowl offering,
    and the remaining whisky is shared among those present.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men clear a track from the main road to the lake edge, said to follow the
    route taken by Akorobompi when he first discovered the lake.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An accident involving bloodshed is expected during the clearing of the track;
    one man returns with a gash on his left hand, and multiple men are sometimes wounded.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The stated reason for the injuries is that cutting the path disturbs the sasa
    of dead people killed in war, who wake in alarm and brandish invisible weapons.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the lake edge, a chief holds a white fowl and addresses Bosomtwe Akwesi,
    asking the lake to receive the fowl, make the water fruitful, provide fish, and
    grant life to named chiefs, the Ashanti nation, and the assembled people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The chief wrings off the fowl’s neck and casts it into the lake; its drifting
    away is interpreted in the passage as acceptance by the lake spirit, while return
    to shore would mean non-acceptance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the older ceremony, when the lake was expected to conceive, the Asaman
    chief informed the Ashanti King, who supplied gold dust for two white fowls, a
    cow, a sheep, and a dog, and sent a representative.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the older ceremony, a sheep is offered to the stools of Asaman, identified
    as the departed spirits of dead chiefs, with special mention of Akuro Gyima Panyin.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the older ceremony, one white fowl is sacrificed at the Abrodwum stone
    and another to the lake.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A cow is led to the lake, bound and thrown over; the Asaman chief addresses
    the lake with the cow as an offering from the Ashanti King and asks for fish and
    life.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: After the cow’s throat is cut, its heart and part of its lungs are cast into
    the lake, and the carcass is divided among the assembled people.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: A dog is sacrificed across the lake to the mother of Twe near the mouth of
    the Aberewa river; its heart and lungs are cast into the river and the remainder
    is eaten.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The river Aberewa is addressed as Aberewa Awukuwa and is stated to be the
    mother of the lake spirit, but not connected with the old leper woman described
    as Twe’s human wife.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: The passage states that the lake cult’s myth and tradition say Twe has forbidden
    certain methods of catching fish as hateful to him.
  category: attribute
  evidence_refs:
  - ev:11
