canonical_text:
  quote: ''
  summary: 'The preface recounts an episode concerning the Golden Stool of Ashanti:
    it had been hidden for over twenty years, was nearly unearthed during road work,
    was moved at night by custodians and old men, was later stripped of gold ornaments,
    and the incident caused widespread mourning, rumours, and political tension.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies the Golden Stool of Ashanti as a symbol widely known
    beyond anthropological readers and states that it had involved the British Government
    and British taxpayer in two costly wars, with a possible third.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Stool had been hidden for more than twenty years, since the Ashanti rising
    of 1896.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In 1921, labourers working on a new government road nearly unearthed the hidden
    Stool without knowing it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Stool had been buried enclosed between two great brass pans at a spot
    over which the new road was to pass.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Custodians reached the spot in time to prevent the Stool from being dug up
    and told the labourers that the spirit of small-pox was buried there and would
    seize anyone who disturbed the soil.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The custodians returned at night, and the Golden Stool was dug up and carried
    by seven old men to the hut of Yao Kyira, also called Wereko, chief of Aboabogya.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the new hiding place became known, several persons stripped the Stool
    piece by piece of the massive gold ornaments or insignia with which it was adorned.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: An old woman recognized one of the gold ornaments when it was offered for
    sale, bringing the matter to light.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The robbers were rushed into prison under escort to save them from instant
    death, and a few hours later all Ashanti was in national mourning and tribulation
    greater than at the loss of any king.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Rumours circulated that the Government had seized the Stool or was about to
    demand it again; local feeling was high, and the Government prepared for eventualities.
  category: speech
  evidence_refs:
  - ev:9
