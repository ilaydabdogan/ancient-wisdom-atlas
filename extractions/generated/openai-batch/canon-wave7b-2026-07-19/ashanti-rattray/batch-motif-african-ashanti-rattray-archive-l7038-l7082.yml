canonical_text:
  quote: ''
  summary: The passage introduces an examination of women and queen mothers in Ashanti
    society by restating an orthodox account of matrilineal and matripotestal descent.
    It says clan descent and blood pass through women, family authority lies mainly
    with the maternal uncle, males transmit ntoro or spirit rather than blood, and
    the two exogamous categories explain marriage prohibitions. It also reports that
    Ashanti explanations for female-line blood transmission are linked to observed
    blood at childbirth and menstruation, and introduces a discussion with three old
    women, including a Queen Mother.
  language: English
  quote_policy: summarized
