canonical_text:
  quote: "“Here is meat, receive and eat.”"
  summary: During a Wednesday Adae ceremony, a chief and attendants sacrifice a sheep,
    apply its blood and fat to stools, prepare and offer roasted and uncooked meat,
    ring a bell indicating the spirits are eating, pour whisky as wine for named ancestral
    figures, petition them for the town’s welfare and the chief’s continued tenure,
    share the remaining whisky, and leave offerings on the stools until evening.
  language: English
  quote_policy: quoted
