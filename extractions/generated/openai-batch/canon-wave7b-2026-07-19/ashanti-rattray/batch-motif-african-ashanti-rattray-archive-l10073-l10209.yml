canonical_text:
  quote: ''
  summary: 'The passage records ritual speech and beliefs concerning ancestral spirits:
    wine or marriage gifts are offered to ancestors for a marriage blessing; priests
    describe ancestors as seeking or summoning the dying; ancestral spirits may call
    a chief to account for words about the stool; a fire was kept for the samanfo;
    and sacrificial blood may condone incest when poured on ancestral stools. The
    passage then turns to Nyame/Nyankopon, quoting Ellis’s claim of European borrowing,
    opposing that view, citing Bosman on a Supreme God and subordinate mediators,
    and arguing that the Ashanti conception of a Supreme Being is not due to missionary
    influence.'
  language: English
  quote_policy: summarized
