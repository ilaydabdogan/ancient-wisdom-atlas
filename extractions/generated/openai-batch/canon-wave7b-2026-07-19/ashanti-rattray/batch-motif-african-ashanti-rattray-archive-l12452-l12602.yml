canonical_text:
  quote: ''
  summary: The passage describes portions of an Apo ceremony in which eggs, palm wine,
    and fowls are offered to shrines including Ta Kora, Ati Akosua, and Ta Kwesi/Kramo
    Kese. The chief priest pours libations to deities and ancestral stools, petitions
    for life, health, support, and prosperity, sacrifices fowls after their behavior
    on the shrine indicates acceptance, and is briefly replaced after a seizure during
    a wine offering.
  language: English with Akan ritual speech
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An egg is offered to Ati Akosua on sacred Friday with petitions for life for
    Oboase, the Chief of Tekiman, the white man and his companions, the speaker, and
    successful hunting.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The third shrine, Ta Kwesi, also called Kramo Kese, is treated in the same
    manner with the last egg.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Palm wine is poured into a calabash, the chief priest dips a cow-tail switch
    or palm-fibre implement into it, sucks it, and sprays wine against the wall near
    Ta Kora.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Before the Ta Kora shrine, the priest presents wine to the “Lord of within
    the rock,” says that it is sacred Friday, and says the deity has gone into seclusion
    and come forth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wine is poured for the other two gods with requests for life for Ashanti divisions
    and a closing request for life for all without partial love or hatred.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The priest pours wine on four blackened stools addressed as elders and on
    a fifth stool addressed as an old woman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the ordinary forty-third-day ceremony, members of the public bring offerings
    including eggs, a pot of wine, a fowl, wine, and salt.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A donor’s fowl is received by the chief priest in both hands, held near Ta
    Kora’s shrine, and accompanied by a petition for life, health, divine support,
    success, and household life.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The fowl placed on Ta Kora’s shrine stands still, prunes its feathers, is
    watched by the priest, is lifted again, and is presented with a request for pardon
    and acceptance.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: When the fowl sits and pecks at the shrine surface, the priest wrings off
    its head, lets blood fall on the pan, and throws the body into the yard for later
    division among the priest’s children.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: During a later wine offering, the old priest drops the calabash, staggers,
    falls against the altar, is supported, and recovers with his head against the
    brass basin.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Another priest immediately takes the old priest’s place, a fresh calabash
    of wine is offered, and another fowl is sacrificed in the same way.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:13
  text: If a fowl does not behave in the described way, it is returned to the donor
    because the god is said to have refused it.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:14
  text: Wine from the large calabash offered to the gods is drunk only by the herald
    and observers of the god’s taboos.
  category: action
  evidence_refs:
  - ev:11
