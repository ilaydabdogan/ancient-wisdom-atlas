canonical_text:
  quote: ''
  summary: The passage describes the Ashanti Queen Mother’s relationship to the chief’s
    senior wife or regent, her judicial authority, her share in oath fees, her possession
    and custodianship of stools connected with Queen Mothers, her role in Adae rites
    for departed ancestral ghosts, and her expected daily attendance at the chief’s
    palace.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chief’s senior wife, or her daughter if the senior wife is very old, is
    described as the potential regent when the king goes to war.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The senior wife takes the chief’s name, is called “my child” by the Queen
    Mother, and calls the Queen Mother “mother.”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Although the regent is originally a woman of the royal harem, the passage
    says she lacks training in customary law and court procedure, so those duties
    devolve upon the Queen Mother.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Queen Mother holds court and decides cases with the full powers of the
    chief.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Queen Mother has jurisdiction over women connected with her attendants
    and over disputes between the chief and his wives.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Cases could be transferred from the chief’s court to the Queen Mother’s court
    when both parties applied, and litigation there was cheaper.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Queen Mother was entitled to a share of oath fees from cases heard in
    the chief’s court.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: At Bekwai, the oath fee was divided between the male stool and the woman’s
    stool according to stated portions.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Queen Mother has her own stool and is custodian, with her stool officials,
