canonical_text:
  quote: ''
  summary: The passage describes the consecration of a Silver Stool after carving
    and silver work. A messenger avoids touching it because she has not bathed. In
    the Queen Mother of Mampon’s courtyard, the stool is placed upside down on a silk-covered
    cushion and surrounded by ritual materials. The Queen Mother breaks an egg and
    addresses the Osese tree, asking long life for Mary, child of the King of England.
    The Queen Mother’s daughter prepares a mixture of yolk and soot, and both women
    raise their hands to the sky and pray to Onyankopon Tweaduampon for Mary’s long
    life and grace, ritually seating her upon the stool.
  language: English with Akan prayer quotations and English translations
