canonical_text:
  quote: ''
  summary: During the Apo ceremony, Yao Kramo addresses those present, offers a sheep,
    and prays for life, health, and peaceful relations with the Government. The sheep
    is killed; its blood and portions of its body are placed on shrines, stools, pans,
    and drums, while other portions are shared or reserved for later eating by ritual
    officials. The chief and congregation exchange blessings. The passage then reports
    that Kofi Afona, a young priest of Obo Kyerewa, is gravely wounded by his own
    spear while hunting an iguana in a tree; he says Tano will soon call him and that
    he is dying. The spear is later called odiawuo, “the murderer,” and becomes the
    chief’s property.
  language: English
  quote_policy: summarized
