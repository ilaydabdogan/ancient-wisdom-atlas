canonical_text:
  quote: "“a worm bored its way up through the ground and was followed by seven men...”"
  summary: 'A Queen Mother recounts the sacred history of the Santemanso grove: ancestral
    humans and animals emerge from the ground; Adu Ogyinae calms the frightened group
    and later dies when a tree falls; a dog brings fire, enabling cooked food; the
    ancestors and clans are linked to the place; Odomankoma later meets the people
    already settled there; ritual pots, annual sacrifice, and royal restrictions mark
    the grove’s sanctity.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The narrator says the grove tradition was told by an old Queen Mother in the
    presence of the chief, Kobina Wusu, and elders.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The names of dead forbears were not to be mentioned except on Monday or Tuesday;
    when later recited, those present stood, and men bared shoulders and removed sandals.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Queen Mother’s story, a worm bored upward through the ground and was
    followed by seven men, several women, a leopard, and a dog.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: All of the emergent people except Adu Ogyinae were frightened by the new surroundings;
    Adu Ogyinae laid hands on them and soothed them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: By Wednesday the group began building huts; while they were building, a tree
    fell on Adu Ogyinae and killed him, which the account identifies as the origin
    of the wukuda oath.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dog went away and returned with fire in its mouth; food was put on the
    fire, first fed to the dog, and then eaten by people after the dog grew fat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The first ancestors settled at Nampansa, a place described as having very
    red soil.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The men and women who came from the ground are identified as belonging to
    the Aduana blood clan and its subdivisions; the Owoko or Oyoko clan is also said
    to have come up from the ground at Santemanso.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Odomankoma, the Creator, is said to have met these people already settled
    at Santemanso while journeying about the earth making things.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The narrator comments that the feature of mortals already being on earth when
