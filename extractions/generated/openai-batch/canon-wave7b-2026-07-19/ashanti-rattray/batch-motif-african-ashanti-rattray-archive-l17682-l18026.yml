canonical_text:
  quote: ''
  summary: The passage presents Akan drum-history material and an English translation
    for Mampon. The divine drummer addresses spirits and beings including tree spirits,
    Earth, Sky, Elephant, fibre, pegs from a tree stump, Kokokyinaka bird, and Witch
    Adwo. Repeated formulas state that the drummer has arisen from sleep at dawn when
    the fowl crows, addresses the beings, and expects understanding. A note identifies
    Kokokyinaka as a forest bird, a drummer's totem, and a teacher of drumming.
  language: English with Akan/Twi names and untranslated lines
  quote_policy: summarized
