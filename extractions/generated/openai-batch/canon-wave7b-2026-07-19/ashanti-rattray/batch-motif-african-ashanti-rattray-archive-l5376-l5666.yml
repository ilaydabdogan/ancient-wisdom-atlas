canonical_text:
  quote: ''
  summary: 'The passage lists Ashanti ntoro exogamous divisions, associated observance
    days, taboos or totems, and remarks. It then gives a myth of the Bosommuru ntoro:
    primordial humans from sky and earth were childless until a python from the Sky
    God, dwelling in the Bosommuru river, performed a water-sprinkling rite that led
    to conception and the first children. The passage also summarizes related ntoro
    origins involving a crocodile, a lake spirit, and a dove sent by the Sky God,
    and discusses ntoro taboos and funeral customs as totemistic relationships.'
  language: English
  quote_policy: summarized
