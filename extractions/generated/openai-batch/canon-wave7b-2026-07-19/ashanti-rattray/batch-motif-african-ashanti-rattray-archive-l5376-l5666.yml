  - ev:11
- id: obs:5
  text: A python came from the Sky God, Onyame, and made its home in the river called
    Bosommuru.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At first the men and women had no children, no desire, and conception and
    birth were unknown.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The python asked whether they had offspring and said it would cause the women
    to conceive.
  category: speech
  evidence_refs:
