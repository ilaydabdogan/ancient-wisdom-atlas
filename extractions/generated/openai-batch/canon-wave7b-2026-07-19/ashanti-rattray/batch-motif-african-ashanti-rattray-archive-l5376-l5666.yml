- id: obs:8
  text: The python told the couples to stand face to face, entered the river, rose
    up, sprayed water on their bellies with the words kus kus, and ordered them to
    go home and lie together.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:11
- id: obs:9
  text: The women conceived and bore the first children in the world; those children
    took Bosommuru as their ntoro, and each male passed this ntoro to his children.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A Bosommuru ntoro man or woman who sees a dead python sprinkles white clay
    on it and buries it; they would never kill a python.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says Agyinadie ntoro was given in a similar manner by a crocodile,
    Bosomtwe ntoro by Twe the anthropomorphic spirit god of the lake, and Akankadie
    ntoro by a dove sent by Onyame with blessing and a promise of children.
  category: sequence
  evidence_refs:
  - ev:8
