canonical_text:
  quote: ''
  summary: 'The passage explains ntoro divisions in Ashanti kinship thought: conception
    is described as the mingling of a man''s ntoro with a woman''s mogya, with mogya
    transmitted through women and ntoro through men. It then applies abusua and ntoro
    descent to prohibited and allowed marriages, including cross-cousin unions, and
    records an additional taboo against unions with grandparent/grandchild categories,
    including a ''red taboo'' and a belief that a great-grandchild touching a great-grandparent''s
    ear can cause speedy death.'
  language: English
  quote_policy: summarized
