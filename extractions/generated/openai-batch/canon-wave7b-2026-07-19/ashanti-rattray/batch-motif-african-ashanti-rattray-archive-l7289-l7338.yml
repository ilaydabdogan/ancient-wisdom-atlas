canonical_text:
  quote: ''
  summary: The passage describes Ashanti matrilineal royal succession, emphasizing
    that a king’s son cannot inherit the kingship while a woman of royal blood may
    be mother of a king. The Queen Mother leads or strongly influences selection of
    a chief, can veto installation, participates in the installation, and holds continuing
    privileges beside the chief in travel and court.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Under the described matrilineal system, a king’s son cannot become king, while
    a woman of royal blood is described as a potential mother of a king.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a chief was to be chosen, the Queen Mother summoned male and female clan
    mates to discuss the choice apart from sub-chiefs and elders of other clans.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After choosing a nominee, the Queen Mother sent a message to the sub-chiefs
    and elders, and no one could be put upon the stool if she gave a veto.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The new chief-to-be was admonished before the clan by a figure called ‘his
    mother,’ identified in a note as not necessarily his biological mother and often
    his sister.
  category: speech
  evidence_refs:
  - ev:4
  - ev:8
- id: obs:5
  text: The installation included taking the chief-to-be to his stool, setting him
    on it three times, placing sandals on his feet, throwing a robe over his shoulder,
    and administering customary oaths.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:6
  text: At the installation, the new chief sat on the right of the Queen Mother to
    receive homage and oaths of allegiance, while thereafter the Queen Mother’s place
    was on his left hand.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Queen Mother was expected to accompany the chief when he traveled abroad,
    except to war, and to sit beside him when he sat in court.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Queen Mother alone had the privilege of openly rebuking the chief, his
    spokesman, or his councillors, and could address the court and question litigants.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Petitions for pardon or mitigation of a sentence were addressed to the Queen
    Mother.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: A note states that when the Queen Mother had her menses, she could not attend
    court.
  category: attribute
  evidence_refs:
  - ev:10
