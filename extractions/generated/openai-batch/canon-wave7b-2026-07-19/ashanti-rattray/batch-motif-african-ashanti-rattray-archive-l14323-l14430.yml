canonical_text:
  quote: tumi nyina wo asase so (‘ all power is in land ’)
  summary: 'The passage argues that in Ashanti land cannot be ownerless: land belongs
    to someone, and if a family or clan becomes extinct its land is absorbed by the
    stool under which it was held rather than reverting to the King. It cites an Ashanti
    proverb saying that all power is in land, links the value of land to spiritual
    associations and reluctance to sell land, compares Ashanti land law with English
    real-property and feudal law, and describes the Ashanti King as Lord Paramount
    of all land but checked by councillors and the clan system.'
  language: English with Akan proverb
  quote_policy: quoted
