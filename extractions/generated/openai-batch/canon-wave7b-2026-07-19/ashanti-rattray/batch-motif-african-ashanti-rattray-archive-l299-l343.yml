canonical_text:
  quote: ''
  summary: The preface states that official research on the Golden Stool helped the
    government respond sympathetically to its desecration. It then describes a ceremony
    in which Queen Mothers of Ashanti presented a Silver Stool for Princess Mary,
    and Sewa Akoto distinguished it from the Golden Stool by saying the Silver Stool
    did not contain the Ashanti soul, as the Golden Stool did, but contained the Queen
    Mothers' love. The author also frames much of the book as concerning religion,
    gods, and ancestors.
  language: English
  quote_policy: summarized
