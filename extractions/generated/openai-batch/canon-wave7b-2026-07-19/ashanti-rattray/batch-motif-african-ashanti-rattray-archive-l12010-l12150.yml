canonical_text:
  quote: ''
  summary: A storm splits a tree near the observer's camp, which a villager explains
    as the work of God's axe and which is later taken as a favorable omen because
    no one was killed. The next morning, on a sacred Friday, priests gather in the
    Ta Kora temple. The passage describes the temple layout, drum and dance music,
    the placement of several shrines, and a ritual in which the shrine of Ati Akosua
    is carried on a priest's head. The author reports an explanation that gods, like
    kings, speak through an okyeame or spokesman, and records the beginning of an
    invocation by the old red priest.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At night during a tornado, lightning split a small tree near the observer's
    camp from top nearly to the ground; the current entered the ground and left a
    hole, while the tree was not blackened or charred.
  category: action
  evidence_refs:
  - ev:1
