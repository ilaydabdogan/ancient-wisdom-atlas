canonical_text:
  quote: ''
  summary: The passage explains Ashanti classificatory kinship terms for A's ascendants
    and descendants, especially how terms such as agya, ena, sewa, wofa, ase, nana,
    'ba, and wofase are assigned. It focuses on the mother's brother's daughter and
    her children, whose relation to A may vary according to whether A exercises, postpones,
    or gives up a customary marriage right. A saying states that if a mother's brother's
    child or father's sister's child is not obtained for marriage, she is treated
    as one's own sister. The passage distinguishes a courtesy or fictitious wofase
    relation from a blood-related wofase relation with succession privileges.
  language: English
  quote_policy: summarized
