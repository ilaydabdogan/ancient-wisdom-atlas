canonical_text:
  quote: A BRONG ADAE CEREMONY
  summary: 'Field account of a Brong Adae ceremony: offerings of food, water, and
    palm wine are made before blackened stools; a dead king and named gods are addressed;
    the offered wine is shared; the group proceeds with the chief''s white stool to
    the Ta Kese temple, where shrine objects are displayed and a priest performs a
    wine offering and invocation for life, health, peace, fertility, and wealth.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Seven blackened stools rested on a long board, with boiled yams, plantains,
    ground nuts, water, and covered dishes of food set before or near them.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Gyase chief held palm wine, and a linguist held an empty calabash at the
    foot of each stool while wine was poured into it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speech to Tekyia Kwame says that the day is Muruwukuo, identifies the
    wine as from Yao Kramo, asks the recipient to accept and drink it, and asks for
    support, long reign, health, and life for the town, women, and men.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the seventh stool, wine was again poured and addressed to Ta Kora, Ta
    Mensa, Obo Kyerewa, and Ati Akosua with the formula that it was theirs.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The chief did not take part in the stool-house ceremony and did not enter
    the stool-house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Wine that had been offered to ancestral spirits and gods was passed around,
    and the two linguists drank first.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The group then went to the Ta Kese temple, preceded by the chief's stool-carrier
    carrying the chief's white stool.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The old head priest waited at the Ta Kese temple and led the group into the
    room where the shrines of the gods were kept.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The raised altar for Ta Kese's shrine was draped with white cloth, covering
    the shrines of Ta Kobina and Ati Akosua; Ta Kese's brass basin shrine was uncovered,
    tied with a coloured silk handkerchief, and had five eggs resting on its contents.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Three elephant tails, a state sword, and two linguists' rods rested against
    the altar.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The room walls were draped with white kente cloth and Manchester brocades;
    shrines of lesser gods stood uncovered on a low ledge, and blackened stools of
    departed priests stood at the opposite end of the room.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: Each entrant greeted the priest as 'Man of god, greetings.'
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The omanhene handed a pot of wine to his linguist, the linguist handed it
    to the priest, and the accompanying words identified the wine as from Yao Kramo
    so that he might look upon the face of Tano.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The priest poured wine into a calabash, filled his mouth with it, sprayed
    it against the wall, and recited a request to Ta Kese Birimpon for life, strength,
    peace, health, town welfare, children, and wealth.
  category: action
  evidence_refs:
  - ev:10
