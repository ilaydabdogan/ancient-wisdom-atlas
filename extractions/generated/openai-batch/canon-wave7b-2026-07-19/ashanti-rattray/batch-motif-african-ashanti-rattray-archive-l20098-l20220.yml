canonical_text:
  quote: ''
  summary: The passage first notes a proverb about a greedy family member as an illustration
    of failure in the family system, then turns to kuduo, brass vessels associated
    with Ashanti metal work. It rejects an interpretation that they are gold-weight
    boxes or shea-butter melting pots, describes their ceremonial use for offerings,
    notes their funerary burial with gold dust and aggrey beads, and records cases
    where kuduo or related bowls are reverenced as shrines or as a god.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A proverb is said to illustrate a breakdown in the family system when one
    member becomes greedy and wants to seize everything for himself.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author introduces kuduo as a branch of Ashanti metal-worker art and states
    that they have no connection with gold weights, despite Zeller's association of
    the two.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Zeller described brass boxes as containers for Ashanti weights and compared
    them with pomade boxes heated by a candle to melt shea butter.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that kuduo may now be used in connection with gold weights
    or shea butter by Africans who adapted them, but that these were not their original
    uses.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says the original place or technique of kuduo manufacture is uncertain,
    with West Africa, North Africa, and Europe all mentioned as possibilities.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kuduo were used as ceremonial vessels for offerings during the rite called
    washing the ntoro and in other religious rites.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When a kuduo owner died, the kuduo was buried with him, with gold dust and
    aggrey beads placed inside it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Several kuduo were dug up during construction of the Coomassie-Ejura road,
    and the passage suggests that some may be deliberately exhumed to retrieve valuable
    contents for family debts.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kuduo are described as very valuable and difficult to obtain, with collections
    or specimens held by Mr. F. W. Leat and by the author.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: In one or two cases, the author found kuduo reverenced as shrines; one at
    Kokofu was said to have belonged to Anotchi, a famous priest in the reign of Osai
    Tutu.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: A bowl or basin at Nsoko is described as venerated as a god and as having
    its own custodian.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: A footnote suggests that perforated stands may have been made to keep the
    bottom of a kuduo from direct contact with the earth.
  category: object
  evidence_refs:
  - ev:11
