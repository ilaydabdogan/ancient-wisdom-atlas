  quote: ''
  summary: A 1921 letter from T. Robertson describes Shropshire freshwater meres with
    no outlet that periodically produce a black, foul-smelling scum from decomposed
    organic matter. Robertson compares this behavior to Rattray’s lake and explains
    rotten-egg smell, marsh gas, ignition, will-o’-the-wisp, and possible loud reports
    as effects of decomposing gases rather than necessarily volcanic activity.
