canonical_text:
  quote: ''
  summary: 'The passage describes an Ashanti lost-wax casting procedure for brass
    gold weights: a wax model and handle are coated in fine and coarse clay, heated
    to remove wax, joined to a crucible containing brass, placed in a charcoal furnace
    with bellows, judged by flame colour, cooled, opened, filed, and polished. It
    also comments on small protuberances left by the moulding stick and on the uncertain
    meanings of geometric designs, including a swastika design called the “monkey’s
    foot.”'
  language: English
  quote_policy: summarized
