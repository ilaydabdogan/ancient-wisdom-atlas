canonical_text:
  quote: ''
  summary: A priest guides a restricted party up a cliff, through a low archway and
    tunnel, into a sacred cave associated with Ta Kora. The passage describes a boulder
    called the king’s stool, a smaller rock shrine of Amoa, a high rock wall described
    as the eating place of the gods, and pottery fragments said to date from creation.
    The priest recounts an earlier royal consultation by Bonsu Panyim, then performs
    offerings of eggs, palm-wine, and a fowl while praying for life, strength, health,
    and favor.
  language: English with Akan ritual speech and English translations
  quote_policy: summarized
