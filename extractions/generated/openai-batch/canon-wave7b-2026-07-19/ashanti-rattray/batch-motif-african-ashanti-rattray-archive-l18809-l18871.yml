canonical_text:
  quote: ''
  summary: The passage frames the author's source for information on the Golden Stool,
    lists early Ashanti kings down to Osai Tutu, and states that Osai Tutu made the
    Ashanti great through the power of the Golden Stool, which came into being during
    his reign. It then describes Coomassie as subject to Denkyira, introduces Ntim
    Gyakari and his clansman Agyei Frimpon/Okomfo-Anotchi, recounts Anotchi's flight,
    ritual training, return to Ashanti, and arrival at Juaben, and includes captions
    referring to desecration of the Golden Stool and a tribunal.
  language: English
  quote_policy: summarized
