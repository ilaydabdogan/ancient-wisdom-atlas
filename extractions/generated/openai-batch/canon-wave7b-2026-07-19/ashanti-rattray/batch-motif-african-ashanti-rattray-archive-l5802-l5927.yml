canonical_text:
  quote: ''
  summary: The passage describes Ashanti ntoro lustration, including an ordinary household
    rite and an older weekly Bosommuru rite in Coomassie led ceremonially by the King
    of Ashanti. It records water drawn from the Suben river and a special spot, palace
    rites with water-spraying, food offerings and distribution, and white-clay markings.
    It then discusses when ordinary persons wash their ntoro, the postmortem fate
    and guardianship of ntoro, associations of ntoro with water and saliva, birth
    and death water practices, eighth-day naming by a same-ntoro grandfather using
    saliva, Tano River as a deity and son of the Supreme God, and begins a geographical
    description of Lake Bosomtwe with captions mentioning a white fowl sacrifice near
    the lake.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person is said to wash his or her ntoro on the weekday proper to that ntoro;
    an ordinary man or woman performs the rite at home without a priest or intermediary.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In former times a weekly Bosommuru ntoro rite was performed in Coomassie;
    many famous Ashanti kings belonged to this ntoro, and the King of Ashanti appeared
    to officiate in the final ceremony for all, without priests in the strict sense.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Every Tuesday the King washed in his palace while chiefs and populace went
    to the Suben river; some people bathed in the river, while water for higher-status
    persons was carried in brass pans.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Water from a special spot called kwasu was placed in a gold kuduo called akra
    yawa, or souls’ basin, and brought back to the palace room called Bosommuru dan
    or Akrafieso, Souls’ House.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the palace, a drummer beat a drum, the king led the assembled people to
    the Bosommuru chamber, put water in his mouth, sprayed it out, and spoke a blessing
    for his life and the prosperity of the nation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The king placed mashed yams, eggs, Bosommuru adwira leaves, and eggshells
    in a large kuduo, ate a little, and the remainder was shared among the assembled
    people through the Bosommuru hene.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the rite, participants smeared three lines of white clay on cheeks,
    head, chest, shoulders, upper arms, and backs of wrists; the king applied it only
    on the wrists.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: An ordinary person does not wash every week automatically when the ntoro day
    returns, but does so when his obosom tells him to or when it is thought necessary.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: When a person dies, the ntoro does not accompany the ghost to the spirit world;
    it remains behind to look after living people of the same ntoro and is said by
    the author to be believed eventually reincarnated.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: For a deceased man, the disembodied ntoro may concern itself with his children;
    for a deceased woman, it does not look after her children because they belong
    to her husband’s ntoro, but may look after siblings by the same father.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states that the ntoro element in a person often seems connected
    with water or liquid, including saliva, and to have derived its origin from such
    forms.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: Water is described as having divine origin from Onyame, the Sky God; newborn
    infants must not be washed with boiled water, while corpses generally are so bathed,
    and boiling water is described as killing it.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: At the naming of a child on the eighth day, a grandfather after whom the child
    is named spits in the child’s mouth to strengthen the spirit or ntoro already
    there; only a person of like ntoro may perform this ceremony.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The Tano River is described as the great obosom of all Ashanti, the source
    of many lesser abosom called his children, and the son of the Supreme God.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:15
  text: The passage introduces Lake Bosomtwe as a lake in Central Ashanti and includes
    captions depicting Lake Bosomtwe, the Abrodwum stone, and a white fowl about to
    be sacrificed and cast into the water.
  category: setting
  evidence_refs:
  - ev:13
