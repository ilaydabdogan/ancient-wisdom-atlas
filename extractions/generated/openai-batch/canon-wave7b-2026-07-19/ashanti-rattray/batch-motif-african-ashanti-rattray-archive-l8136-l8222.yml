canonical_text:
  quote: ''
  summary: 'The passage describes portions of a Wednesday Adae ceremony: distribution
    of sheep parts and skewered meat; the chief’s withdrawal to dress and his explanation
    of plain attire before superior ancestral spirits; the ritual status and presentation
    of twins; the absence of invocation of non-ancestral powers; the presence and
    composition of the Gyabom suman used to repel revengeful dead spirits; accounts
    of its red dye, former washing with blood, use in executions, human sacrifice,
    and treatment of jaw-bones; and Osai Kojo’s ntumpane drum recitation of divisional
    history while the chief dresses.'
  language: English
  quote_policy: summarized
