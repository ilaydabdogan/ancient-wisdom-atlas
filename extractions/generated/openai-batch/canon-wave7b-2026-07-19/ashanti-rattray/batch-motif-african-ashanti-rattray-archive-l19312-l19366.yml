canonical_text:
  quote: An Ashanti stool is supposed to be the repository of its owner’s soul
  summary: 'The passage describes the finishing of a Silver Stool design, its royal
    presentation under an umbrella to a paramount chief, and explanations of Ashanti
    stool taboos: the stool is treated as the repository of its owner’s soul, miniature
    fetters are used to bind the soul to it, and a vacated stool is not left upright
    lest a wandering spirit sit on it and harm the owner.'
  language: English
  quote_policy: quoted
