canonical_text:
  quote: ''
  summary: 'The passage describes Ashanti goldsmith tools and gold-dust weights: scales,
    shovel, spoons, gold-dust boxes, proverb or named weights, odds and ends used
    as known weights, and the beginning of an observed process for copying a square
    weight in wax. It also records limited evidence for weights being used as reminders
    in debt and for named weights representing court fines and fees.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A portion of money was taken to pay numerous court officials, and settling
    directly with them was described as contrary to etiquette.
  category: relationship
  evidence_refs:
