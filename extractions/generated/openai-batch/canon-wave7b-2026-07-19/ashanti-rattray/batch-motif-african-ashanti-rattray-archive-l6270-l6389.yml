canonical_text:
  quote: ''
  summary: The passage describes rules restricting fishing methods, boating implements,
    Sunday fishing, and menstruating women on a lake. It then describes local use
    of hewn log craft called padua, lashed rafts called mpata, bodily propulsion by
    hands and feet, swimmers who push and tow rafts, reported women swimmers, and
    reed-mat fishing appliances.
  language: English
  quote_policy: summarized
