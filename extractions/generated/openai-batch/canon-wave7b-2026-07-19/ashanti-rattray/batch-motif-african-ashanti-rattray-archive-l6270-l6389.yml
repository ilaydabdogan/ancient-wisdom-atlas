- id: obs:3
  text: Lake-side dwellers use a padua instead of canoes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A padua is described as a light corkwood log with roughly hewn sides, commonly
    6 to 10 feet long, about a foot wide, and 6 to 8 inches deep, with some ends cut
    away for less resistance.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two or more mpadua can be lashed together to make an mpata, or raft, used
    to carry larger and heavier nets to fishing grounds.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The raft has top fastenings made with creepers, and the passage states that
