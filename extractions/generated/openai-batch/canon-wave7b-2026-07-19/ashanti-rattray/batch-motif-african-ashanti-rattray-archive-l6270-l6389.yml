  text: Rules forbid iron hooks, lures, line fishing, cast nets, seine nets, canoes,
    boats, sails, paddles, poles, hollowed logs, and brass or metal pans; wooden pans
    are specified as the permitted alternative.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Additional rules prohibit fishing on Sunday and prohibit a menstruating woman
    from going upon the lake.
  category: action
  evidence_refs:
