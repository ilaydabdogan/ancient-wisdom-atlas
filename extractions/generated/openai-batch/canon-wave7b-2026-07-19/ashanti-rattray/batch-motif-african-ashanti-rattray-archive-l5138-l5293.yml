canonical_text:
  quote: ''
  summary: The passage describes Ashanti inheritance rules for property and stools
    through ordered male and female heirs, then explains the status and succession
    role of the odonko 'ba, or slave child. It emphasizes that slave children may
    inherit property but not stools, and that their inheritance could preserve the
    old family home and rites for departed spirits when the abusua had become extinct.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For property from a deceased male, the listed heirs proceed through male and
    then female matrilineal relatives; when all abusua relatives are dead, the property
    may be given to a slave.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that this slave inheritance excludes persons who would
    have legal claims under the author's comparison to his own law, including Kakari’s
    own children and brother’s children.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: For a male stool, the heirs are the same up to a stated point, but if those
    issue are extinct, a male of the same clan must be brought in because neither
    a slave nor a woman may occupy a male stool.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:11
- id: obs:4
  text: For property from a deceased female, the order begins with the deceased’s
    mother, sisters, daughters, and female-line descendants; after the female line
    is extinct, property passes to male heirs, and after all heirs are extinct it
    goes to a female slave child.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: For a female stool, after the listed female heirs are exhausted, a successor
    is sought among females bearing the deceased’s clan name because neither a slave
    nor a male can sit on a woman’s stool.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A slave child, odonko 'ba, may inherit property but may never inherit a stool.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:7
  text: Male members of a clan purchased female slaves by whom they had children;
    those children had no abusua but had the father’s ntoro.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The children of such purchased female slaves and their descendants lived with
    the family, were treated much like family members, and regarded the master’s home
    as their domicile.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: When a family became extinct, such a slave child could be preferred as heir
    over a member of the deceased’s ntoro, because the ntoro member might carry the
    movable property away and leave the ancestral home and spirits neglected.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The odonko 'ba, having no abusua or other home, would carry on the old master’s
    home at the same place and maintain rites for the departed spirits.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says an Ashanti man formerly feared family extinction, and that
    purchasing and rearing slave children was his insurance against that calamity.
  category: other
  evidence_refs:
  - ev:9
