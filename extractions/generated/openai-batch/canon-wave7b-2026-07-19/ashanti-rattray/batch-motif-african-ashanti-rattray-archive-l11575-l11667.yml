canonical_text:
  quote: ''
  summary: 'The passage describes the close of an Apo ceremony and the beginning of
    the Tekiman new year: evil from the past year is ritually blocked from returning,
    shrines are restored with food offerings, the Ta Kese temple and its sacred objects
    are described, Amoa is identified as messenger and guardian of the gods, and Chief
    Yao Kramo presents a sheep to Ta Kese while requesting protection, fertility,
    hunting success, and the return of snails.'
  language: English with quoted Akan speech
  quote_policy: summarized
