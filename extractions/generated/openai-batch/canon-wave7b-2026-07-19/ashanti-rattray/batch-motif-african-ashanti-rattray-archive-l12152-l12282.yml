canonical_text:
  quote: ''
  summary: A prayer summons Kwampiri/Ta Kora. After silence, the priest carrying the
    shrine twitches and strikes the brass pan, understood as a sign that the god’s
    spirit has entered the shrine and priest-medium. Participants greet the god. A
    representative explains the visitor’s request to witness the making and consecration
    of a shrine. Through the priest, Ta Kora refuses to give one of his sons for a
    shrine but grants the visitor permission to visit his rock/cave and water, saying
    he supports those who love him and identifies himself as a son of God. The visitor
    thanks him and comments on education and the Supreme Being; the god replies with
    thanks.
  language: English with embedded Akan/Twi speech
  quote_policy: summarized
