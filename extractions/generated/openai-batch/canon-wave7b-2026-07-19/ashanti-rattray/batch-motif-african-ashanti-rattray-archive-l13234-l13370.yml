- id: motif:6
  label: Ancestor stools renewed at the meeting of the years
  taxonomy_refs:
  - seasonal_cycle
  basis: At the point when the old and new years meet, the chief cleans stools and
    houses, pours wine to the grandsires, and takes the blackened stools to the river
    to be sprinkled with water.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  - ev:14
  confidence: high
  cautions: The supplied taxonomy has no specific ancestor-veneration motif; seasonal_cycle
    is used because the rite is explicitly tied to the year boundary and Afahye.
- id: motif:7
  label: Sacrifice accompanying sacred river access and ritual transition
  taxonomy_refs:
  - sacrifice
  basis: Offerings of sheep and fowls are made to the river before war crossing; a
    sheep must be sacrificed before a corpse crosses higher up the river; a sheep
    is killed after the ancestral stools return.
  evidence_refs:
  - ev:4
  - ev:7
  - ev:14
  confidence: high
  cautions: The passage gives ritual actions but does not fully explain sacrificial
    theology.
- id: motif:8
  label: Ritual restrictions at a sacred ford
