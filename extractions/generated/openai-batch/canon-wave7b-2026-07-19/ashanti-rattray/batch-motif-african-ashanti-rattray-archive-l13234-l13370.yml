  source_text_path: texts/public-domain/african-akan/project-gutenberg/ashanti-rattray.md
  rights_note: Public domain source; summarized from provided passage.
- id: ev:7
  type: summary
  locator: lines 13270-13273
  quote_or_summary: No dead body may cross at the ford; if taken higher up the river,
    a sheep sacrifice must be made before it crosses.
  source_text_path: texts/public-domain/african-akan/project-gutenberg/ashanti-rattray.md
  rights_note: Public domain source; summarized from provided passage.
- id: ev:8
  type: summary
  locator: lines 13274-13279
  quote_or_summary: A woman who begins her period after crossing the river may not
    re-cross the ford until she is better; widows are sprinkled with Tano water on
