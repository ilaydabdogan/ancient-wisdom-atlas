candidate_motifs:
- id: motif:1
  label: Sacred river as deity, recipient, and source of ritual power
  taxonomy_refs:
  - sacred_exchange
  basis: Tano receives offerings, gives blessing through river rites, has fish called
    children of Tano, and provides water used for ordeal, restoration, and sprinkling.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:8
  - ev:13
  - ev:14
  confidence: high
  cautions: The passage is an ethnographic ritual account rather than a mythic narrative;
    the taxonomy assignment reflects ritual exchange with a sacred river.
- id: motif:2
  label: War blessing and omen mediated by river beings
  taxonomy_refs:
  - sacred_exchange
  basis: An army offers sheep, fowls, and gold dust to the river, the priest calls
    the fish, the general explains the campaign, and fish-produced sand and water
    are sprinkled over captains as an omen.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage records the rite and omen procedure but not the outcome of
    any campaign.
- id: motif:3
  label: Ordeal by drinking sacred water
  taxonomy_refs:
  - divine_judgment
  basis: Tano water is explicitly said to be used for drinking as an ordeal, with
    an invocation to the drinker’s ntoro.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage does not describe the judicial context, test criteria, or
    possible outcomes of the ordeal.
- id: motif:4
  label: Sacred water restores or maintains ritual efficacy
  taxonomy_refs: []
  basis: Tano water is not to be boiled for ordinary cooking; it can restore a shrine’s
    virtue and is used to sprinkle widows, ancestral stools, the chief, his sons,
    and his clan.
  evidence_refs:
  - ev:5
  - ev:8
  - ev:13
  - ev:14
  confidence: high
  cautions: No narrower supplied taxonomy category directly names purification or
    ritual restoration; the linked symbol is water.
- id: motif:5
  label: First-fruits and new-year festival
  taxonomy_refs:
  - seasonal_cycle
  basis: Afahye is defined as an annual custom connected with eating first fruits
    of each crop, here yams, and the Ejura new year begins during the described ceremony.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: Only the beginning and ancestor-related portion of the ceremony is included
