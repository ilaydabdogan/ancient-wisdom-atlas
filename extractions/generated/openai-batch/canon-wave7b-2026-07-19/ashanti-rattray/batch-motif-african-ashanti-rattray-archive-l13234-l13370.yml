    are called Tano mma, children of Tano, and that catching or eating them formerly
    caused instant death.
  source_text_path: texts/public-domain/african-akan/project-gutenberg/ashanti-rattray.md
  rights_note: Public domain source; summarized from provided passage.
- id: ev:4
  type: summary
  locator: lines 13249-13260
  quote_or_summary: An Ashanti army crossing the Tano ford halts, asks blessing, offers
    sheep, fowls, and gold dust; fish are called, the campaign is explained to them,
    fish produce sand and water into a brass pan, and this is sprinkled over captains
    as an omen and carried with the army.
  source_text_path: texts/public-domain/african-akan/project-gutenberg/ashanti-rattray.md
  rights_note: Public domain source; summarized from provided passage.
- id: ev:5
  type: summary
  locator: lines 13260-13264
  quote_or_summary: Water from this part of the Tano is not used for cooking, must
    not be boiled, and is sprinkled on a failing shrine so its virtue is recovered.
  source_text_path: texts/public-domain/african-akan/project-gutenberg/ashanti-rattray.md
  rights_note: Public domain source; summarized from provided passage.
- id: ev:6
  type: summary
  locator: lines 13265-13270
  quote_or_summary: Tano water is used for drinking as an ordeal; the drinker invokes
