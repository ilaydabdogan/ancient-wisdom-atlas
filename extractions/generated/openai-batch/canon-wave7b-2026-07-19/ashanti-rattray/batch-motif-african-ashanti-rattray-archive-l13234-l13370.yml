canonical_text:
  quote: ''
  summary: The passage records prayers for help, ritual practices connected with the
    god and river Tano, taboos and uses of Tano water, and the beginning of an Afahye
    first-fruits/new-year ceremony at Ejura involving ancestral stools, cleansing,
    offerings, river-water sprinkling, and sacrifice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An opening invocation asks Father, Father Ta Kese, and Ati Akosua for help
    in misery or unhappiness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A priest from Akumadan says the beating of his gong helps him hear the voice
    of the river and call up the spirit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fish in this part of the Tano are called Tano mma, meaning children of Tano,
    and catching or eating them was said to bring instant death in former times.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: An Ashanti army crossing the Tano at the ford would halt while captains asked
    for a blessing and gave sheep, fowls, and gold dust to the river.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The priest would call the fish, the general would explain the campaign to
    them, large fish would come partly out of the water, and sand and water vomited
    into a brass pan would be sprinkled over the captains.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the sprinkled water dried white, it was considered a good omen, and some
    of the water was carried with the army.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Water from this part of the Tano is not used for cooking, must not be boiled,
    and is sprinkled on a shrine that seems to have lost its spirit-attracting power
    so that its virtue may be recovered.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tano water is used for drinking as an ordeal, with the drinker invoking his
    or her ntoro or spirit before drinking.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: No dead body is allowed to cross at the ford; if taken across higher up the
    river, a sheep must first be sacrificed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A woman who has crossed the river and then begins her period must not re-cross
    the ford until she is better; widows are sprinkled with Tano water on the eighth
    day after their husbands’ death.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Afahye ceremony is described as an annual custom connected with eating
    the first fruits of each crop, in this case yams, and the Ejura new year is said
    to commence during the ceremony.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: The chief local god at Ejura is Konkroma, described as a child of Tano.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: The chief’s white stools and chair were scrubbed with cold unboiled water,
    sand, and a pineapple-fibre sponge; the stool-house and houses were replastered
    with white and red clay, without songs or music.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The chief poured wine upon the blackened stools and addressed the grandsires,
    saying the edges of the years had met and that he was taking them to the stream
    to sprinkle them with water.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:15
  text: The blackened stools were carried to the river, the first king’s stool under
    an umbrella, and water drawn in a brass pan was sprinkled on each stool with a
    cow-tail switch while the linguist repeatedly said that they were being sprinkled
    with water.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:16
  text: Water was also sprinkled on the chief, his sons, and members of the chief’s
    clan or blood; after the stools were returned, a sheep was killed.
  category: sequence
  evidence_refs:
  - ev:14
