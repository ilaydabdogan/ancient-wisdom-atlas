  quote: ''
  summary: The passage records Ashanti statements about long stone celts, limited
    use of iron for nabuo or iron money, and a surviving tradition of a stone age.
    It also cites Reindorf on an early Ashanti king, Kwabia Amanfi, whose time is
    described as one when gold was unknown and pieces of iron served as currency.
    The passage adds an etymology of nabuo connected with iron ore, pounding or breaking,
    and preparing laterite for smelting.
