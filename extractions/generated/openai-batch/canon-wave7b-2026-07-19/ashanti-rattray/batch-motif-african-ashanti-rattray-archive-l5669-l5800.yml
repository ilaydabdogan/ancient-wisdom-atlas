canonical_text:
  quote: ''
  summary: The passage distinguishes ntoro taboos and avoidances from totems, explains
    that a wife observes her husband’s ntoro taboos during marriage and childbearing,
    and describes a pregnancy rite in which the husband’s ntoro, the Sky God, and
    Earth spirits receive offerings so that the child in the womb may be born safely.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that animals or things connected with an obosom may be taboos
    or avoidances, but should not all be labeled as totems.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A python accorded funeral rites is distinguished from animals or substances
    that a Bosommuru person merely avoids eating or drinking.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a woman marries, she treats her husband’s ntoro taboos as her own while
    still observing those of her own ntoro; the husband does not reciprocally adopt
    hers.
  category: action
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:4
  text: The passage states that the husband’s ntoro is believed to make and build
    up offspring resulting from the union.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Adultery with a pregnant woman is described as especially serious because
    the meeting of two ntoro is supposed to cause the child in the womb to die; if
    the adulterer has the same ntoro as the husband, the offence is less serious.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A rite after conception and before birth is introduced as an account translated
    from the vernacular and told by a Queen Mother.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: About the sixth or seventh month of pregnancy, the husband gives his wife
    a white cloth and gold ornaments, and the woman gives him a fowl and eggs for
    his ntoro.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The husband takes the fowl to the corner of his sleeping room, addresses his
    ntoro, cuts off the fowl’s head, lets blood fall on the floor, and puts eto and
    blood into a kuduo.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The fowl is plucked outside at the onyame dua, singed over fire, roasted,
    and then used in a rite where the man invokes the Supreme God, his ntoro, his
    breath, and his obosom for the infant to come forth peacefully.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The invocation is performed three times with adwira leaf and salt renewed
    between the lips; the husband, wife, and their children each eat some roasted
    fowl.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The wife wears the white cloth and gold ornaments given by the husband, and
    the child in her womb is said to be wearing them.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Fufu and soup from the fowl are brought; the fufu is brought by someone of
    the wife’s abusua, the wife carries the soup, and some food is placed in the kuduo.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: After eating, the husband marks the backs of his wrists with white clay, the
    wife paints lines of clay on her body, the husband dresses in white, and the couple
    have intercourse beside the kuduo.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: In the evening, some eto and meat are given to the couple’s children, and
    some is cast on the ground and on the roof for the Earth spirits and the Sky God.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: The ceremony is called afodie and takes place on the day assigned to the husband’s
    ntoro.
  category: setting
  evidence_refs:
  - ev:11
