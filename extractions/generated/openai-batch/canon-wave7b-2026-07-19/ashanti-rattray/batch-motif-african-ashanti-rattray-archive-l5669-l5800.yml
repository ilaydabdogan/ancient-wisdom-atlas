candidate_motifs:
- id: motif:1
  label: Patrilineal spirit as procreative parent of the child
  taxonomy_refs:
  - divine_parent_child
  basis: The husband’s ntoro is said to make and build offspring, and the offering
    formula addresses the ntoro concerning its child in the woman’s womb.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage treats ntoro as a spirit category and obosom-related force;
    the taxonomy reference is approximate and should not imply a fully anthropomorphic
    deity without review.
- id: motif:2
  label: Prebirth rite for safe delivery
  taxonomy_refs:
  - sacred_birth
  basis: A post-conception, prebirth ceremony uses gifts, offerings, food, prayer,
    white cloth, gold ornaments, white clay, and ritual timing so the infant may come
    forth well, sound, without harm, and peacefully.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: This is an ethnographic ritual for ordinary childbirth rather than a narrative
    of miraculous birth.
- id: motif:3
  label: Fowl sacrifice and reciprocal offering meal
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: The wife provides fowl and eggs, the husband kills the fowl for the ntoro,
    blood and food are placed in the kuduo, participants eat portions, and food is
    also offered to Earth spirits and the Sky God.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:8
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage describes ritual practice rather than a mythic episode; interpretation
    should remain tied to the described rite.
- id: motif:4
  label: Exogamous taboo boundary and dangerous mixing of same or different ntoro
  taxonomy_refs: []
  basis: The text describes ntoro taboos, wife’s adoption of the husband’s taboos,
    danger from the meeting of two ntoro in pregnancy, and the law against sexual
    intercourse between like ntoro.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: medium
  cautions: No available taxonomy reference directly covers ntoro exogamy or taboo
    law, and the passage cautions against calling all avoidances totems.
- id: motif:5
  label: Serpent-origin or serpent-lineage bond
  taxonomy_refs:
  - serpent
  basis: The Bosommuru ntoro is said to have a special magico-religious connection
    with the python, including funeral rites and a stated origin link, unlike ordinary
    food avoidances.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage is brief and explicitly says the distinction requires future
    investigation; no full serpent myth is narrated here.
- id: motif:6
  label: Ritual marital intercourse beside an offering vessel
  taxonomy_refs: []
  basis: After offerings, eating, and white clay marking, the husband and wife have
    intercourse beside the kuduo.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The scene is a human marital fertility rite; it should not be equated
    with a divine sacred-marriage motif without further evidence.
