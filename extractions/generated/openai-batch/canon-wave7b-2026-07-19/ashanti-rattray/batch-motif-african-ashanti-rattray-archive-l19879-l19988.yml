  quote: ''
  summary: The passage explains Ashanti metal “proverb” weights whose designs represent
    proverbial sayings, gives several examples of such weights, and corrects an earlier
    interpretation of one design by identifying it as a medicine man sacrificing a
    fowl to the nkabere charm. The charm is described as a suman made from three selected
    sticks or roots associated with named trees.
