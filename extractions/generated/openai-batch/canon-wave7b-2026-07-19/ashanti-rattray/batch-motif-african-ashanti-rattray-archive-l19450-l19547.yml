canonical_text:
  quote: ''
  summary: The passage describes Ashanti goldsmiths as an honoured brotherhood with
    special privileges; their Bekwai origin is traced to Fusu Kwebi, the first goldsmith,
    whose preserved tools and associated god Ta Yao are venerated. It also records
    the use of an ancient bellows fragment in innocence attestation, a goldsmith informant’s
    claim of prior craft activity in the spirit world marked by birth lines like tongs,
    rules concerning adultery and tool purification, inheritance of the craft, and
    the contents and design classes of goldsmiths’ gold-weight equipment.
  language: English
  quote_policy: summarized
