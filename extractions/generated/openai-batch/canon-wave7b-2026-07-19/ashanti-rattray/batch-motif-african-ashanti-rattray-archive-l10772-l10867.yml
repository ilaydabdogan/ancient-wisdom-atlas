  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author reports that he did not see drunken men or women during the ceremony
    and did not hear later of adultery cases arising from it.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: During the eight days of the ceremony, no redress for seduction or adultery
    may be claimed, but after the period such cases may be tried and punished under
    customary law.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: An aggrieved party who lodges a complaint or makes a violent scene during
    the ceremony forfeits later satisfaction and is fined.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: A carnival freedom permits a man to say to a girl, except the king's or priests'
