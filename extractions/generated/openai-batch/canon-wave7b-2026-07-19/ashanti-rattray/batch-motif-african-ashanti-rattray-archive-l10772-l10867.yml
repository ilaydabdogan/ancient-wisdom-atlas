canonical_text:
  quote: ''
  summary: The passage describes the Ashanti Apo ceremony as an eight-day rite also
    called Attenie or Ahorohorua. A priest of Ta Kese explains that resentment and
    hostile thoughts can make a person's sunsum sick, and that an annual period of
    unrestricted speech allows people of all statuses to speak openly to neighbors
    and rulers, cooling the sunsum of both parties. The passage also discusses accusations
    of moral license, legal restrictions on complaints during the rite, a carnival
    speech formula addressed to girls, and captions showing Apo scenes, a shrine,
    and gods taking the air.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ceremony is called Apo and is also known as Attenie and Ahorohorua; it
    lasts eight days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: One informant described the custom as involving mutual cursing, relaxed morals,
    fetishes brought out to walk about, and witch doctors performing rites.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The old high-priest of Ta Kese says every person has a sunsum that can be
    hurt, knocked about, or made sick.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The priest states that hatred or evil in one person's head against another
    can make the sunsum sick.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The priest says the forbears ordained an annual time when every man and woman,
    including free people and slaves, could speak openly about what was in their head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The permitted speech could be directed at neighbors and also at the king or
    chief.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
