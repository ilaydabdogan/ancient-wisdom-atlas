canonical_text:
  quote: ''
  summary: The passage describes an Adae ceremony in which a chief and Queen Mother
    greet ancestral stools, pour rum or wine to Grandmother Asiama and the ancient
    ones, sacrifice a sheep, smear blood and place meat on the stools, and ask for
    long reign, good rule, prosperity, and peace. Minstrels sing the names and stories
    of dead rulers, offerings remain before the blackened stools, and a public reception
    follows. The passage then introduces a Brong Adae ceremony at Tekiman and notes
    that it differs from other Adae ceremonies previously observed.
  language: English
  quote_policy: summarized
