canonical_text:
  quote: ''
  summary: The passage explains the timing of Sunday and Wednesday Adae observances,
    defines the preparatory Adapa day, and begins a description of a Wednesday Adae
    witnessed in August 1921. It records preparations involving the chief, stool-carriers,
    cooks, townsfolk, treasurer, Queen Mothers, musicians, royal stools and vessels,
    provisions, drinks, drums, horns, the palace courtyard, a Nyame temple, and entry
    into the stool house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The interval from one Sunday Adae to the following Wednesday Adae is given
    as 22 days exclusive or 24 inclusive, and from Wednesday Adae to the next Sunday
    Adae as 17 or 19 days; these recurrent periods are called adaduanan, literally
    forty-day periods.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The day immediately preceding any Adae is called Adapa, literally a good or
    lucky day.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A child born on Adapa receives Dapa as a suffix to the natal-day name.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Adapa is spent gathering food, firewood, water, wine, and other supplies because
    on Adae no work may be done except work connected with the ceremony.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author states that earlier brief accounts of Adae had been given by Bowdich
    and Ellis, and that native rulers granted him access to sacred rites.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: On the morning before the witnessed Wednesday Adae, the paramount chief’s
    white stool and chair were scrubbed by stool-carriers, while cooks cleansed calabashes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A sheep was chosen; townsfolk stored food, firewood, water, and other items;
    the chief arranged palm wine, rum, and whisky; and the treasurer counted money
    and weighed gold dust.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The accounting and provisioning activities are called akonta buo, or reckoning
    up accounts.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author remarks that chiefs and Queen Mothers personally attend to ceremonial
    details.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the evening of Adapa, drummers and horn-blowers assembled with many named
    drums and elephant horns, and music and firing continued through the night.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The next morning, those concerned assembled in a small courtyard inside the
