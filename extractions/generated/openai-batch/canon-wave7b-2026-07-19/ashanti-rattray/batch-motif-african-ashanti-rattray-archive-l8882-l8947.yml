canonical_text:
  quote: ''
  summary: The passage gives an ethnographic preface on Fanti, Brong, and Ashanti
    relationships, then introduces an account of a Wednesday Adae witnessed at Tekiman
    in Brong country. It describes Brong and Ashanti names for the Wednesday Adae,
    notes the lack of a Brong Sunday Adae, explains the forty-two-day recurrence of
    the observance, reports that Brong were regarded as keepers of the Ashanti king’s
    calendar, and includes captions referring to spirits left to eat and drink and
    a guardian of blackened stools.
  language: English
  quote_policy: summarized
