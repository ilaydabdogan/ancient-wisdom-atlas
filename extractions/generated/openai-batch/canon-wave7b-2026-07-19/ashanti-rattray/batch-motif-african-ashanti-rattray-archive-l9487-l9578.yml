canonical_text:
  quote: ''
  summary: 'A field description of rites at the sacred grove at Santemanso: participants
    proceed from the Queen Mother''s settlement along a path, pass a prohibitory barrier,
    assemble beneath a fig tree with pots, sheep, and a sacred stone, and begin ancestor-name
    recitation connected with a marriage-related sacrificial offering called ayedie.'
  language: English with Akan terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kobina Wusu quotes an Ashanti proverb about not looking backward down the
    path one has come.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Asantemanso the Queen Mother is present with several very old women; one
    woman carries a brass kuduo vessel intended to receive pieces of the sacrifice,
    and some of the old women are said to be priestesses of the local god Ta Kofi.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The party follows a narrow path toward the grove after leaving the settlement.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The path is barred by a creeper set above the path with split sticks attached;
    the device is called mma, literally 'do not pass,' and marks a route that unauthorized
    persons must not enter.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the barrier the Queen Mother sends back about twenty followers, mostly
    youths and boys; the remaining group passes under the mma.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The group reaches a dark clearing beneath a fig tree where eight little pots
    stand; women and men sit opposite one another with the pots between them, and
    two sheep are tied to trees behind them.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: A small moss-covered stone beside the pots is called nokwabo, 'the truthful
    stone'; the chief says it was brought from Coomassie and presented by King Osai
    Bonsu the elder together with a slave before an expedition against Gyaman.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: One very old woman takes a position beside the pots; the group stands, the
    Queen Mother scoops a small hole near the pots, and Amma Amoako recites the names
    of male and female ancestors with the suffix kwa while the Queen Mother repeats
    them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that formerly it was a capital offence to recite the ancestor
    names in the wrong order, on a day other than Monday or Tuesday, or outside an
    authorized ceremonial context.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Queen Mother had recently married; the passage states that anyone marrying
    her should make a sacrifice in the grove to the spirit ancestors and possibly
    to another non-human spirit, and that the offering is called ayedie.
  category: relationship
  evidence_refs:
  - ev:7
