canonical_text:
  quote: ''
  summary: A night procession for the Apo ceremony goes to the Tano river with royal
    representatives, the Queen Mother, attendants, drums, shrines, guns, and ritual
    objects. At the river, water is drawn and invoked with prayers to divine and natural
    powers. The shrines are sprinkled, scrubbed, marked with clay, and returned, while
    participants ask for protection, life, fertility, hunting success, and a safe
    new year.
  language: English with Akan ritual speech transcribed and translated
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The procession includes stool-carriers, fontomfrom drums, a female tumpane
    drum, cow-tail switches, and guns.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A message to the chief says that the year has come round, the festival ends
    that day, and the people wish to go to the river.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The chief replies with a wish that no misfortune happen in the approaching
    new year and that another year come round again.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The chief does not accompany the procession to the river, but is represented
    by two spokesmen; the Queen Mother goes with the procession.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The path to the Tano river is lit by men carrying tied bundles of palmleaf
    stalks.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the river, more important shrines are placed on their own stools, while
    lesser shrines rest on circular head-pads.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: A Tanokwa attendant draws a basin of water from the river before a prayer
    is spoken.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The prayer addresses the Sky God, Earth Goddess, an underworld being, Leopard,
    and Tano River, and states that the year has completed its circle and the shrines
    have been brought to be sprinkled with water.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The same prayer asks the addressed powers to stand behind the people, prevent
    bad things, and receive the people, their wives, and their children into their
    hands.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: A note says that this part of the river was formerly closed for weeks to avoid
    pollution and that the night ceremony was associated with obtaining pure water.
  category: other
  evidence_refs:
  - ev:4
- id: obs:11
  text: White clay and adwira leaves are mixed with the river water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A spokesman of one of the gods holds a branch of summe in each hand and calls
    Ta Kese and other powers to come for sprinkling if any foul thing has touched
    them during the past year.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The spokesman dips summe leaves in the water and sprinkles each shrine in
    turn, beginning with Ta Kese.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: During sprinkling, the spokesman asks for life, hunting success, childbirth,
    life for the chief, life for hunters, and life for priests.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: The prayer states that the apo of the year has been taken and put into the
    river.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: Water is sprinkled upon the stools and all present; guns are fired and everyone
    shouts farewell.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: The brass pans identified as shrines are scrubbed with sand and water, marked
    outside with three wet-clay fingers, covered again with silk handkerchiefs, and
    carried home.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: After the last person passes down the path, the head priest and spokesman
    place three long branches of summe across the road.
  category: action
  evidence_refs:
  - ev:9
