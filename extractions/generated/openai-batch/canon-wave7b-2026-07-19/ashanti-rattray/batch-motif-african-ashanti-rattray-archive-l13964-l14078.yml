canonical_text:
  quote: ''
  summary: The passage describes Asante ideas about the Earth as Asase Ya, Old Mother
    Earth, including Thursday observance and an agricultural offering of eto and a
    fowl before cultivation. It also notes taboos against the Golden Stool and the
    king's feet touching the earth, then explains that departed ancestors, the samanfo,
    are treated as continuing landowners and that similar ideas are reported among
    other African peoples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Earth is named Asase Ya, Aberewa, glossed as Old Mother Earth, and is
    also described as Creator of the Underworld.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:2
  text: Thursday is set aside for observance of Old Mother Earth, and farmers avoid
    tilling or breaking the soil on that day.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: At the beginning of the cultivation season, a farmer's wife or sister cooks
    eto, and the eto and a fowl are taken to the land to be cultivated.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:4
  text: The farmer stands on the land, kills the fowl by wringing off its neck, and
    lets its blood drip onto the eto and the earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The farmer addresses a named grandfather and Earth Ya, says the yearly cycle
    has returned, and asks for a fruitful year and protection from knife injury, falling
    trees, and snakebite.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The fowl is cut up and mixed with the eto; portions are thrown to the four
    points of the compass, and some remains are placed in a leaf at the spot where
    the farmer stood.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Golden Stool is described as having religious and spiritual significance
    and as never being allowed to come into direct contact with the Earth.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:7
- id: obs:8
  text: The king of Ashanti's feet were not to touch the ground, and the passage says
    this was to avoid a great famine coming upon the nation.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that Sky and Earth deities are not the predominant influences
    in Ashanti religion; the samanfo, spirits of departed forbears, are said to be
    predominant.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The samanfo are described as real landowners, while living landowners are
    characterized as holding from and acting as trustees for the dead.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage states that beliefs in an Earth deity and continuing spirit owners
    of land are also found among other African peoples, including examples involving
    the tindana and the Mang'anja.
  category: relationship
  evidence_refs:
  - ev:11
