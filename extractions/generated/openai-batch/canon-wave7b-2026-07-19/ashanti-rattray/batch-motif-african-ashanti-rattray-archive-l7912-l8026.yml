canonical_text:
  quote: ''
  summary: Field account of a Wednesday Adae ceremony in which an Asante chief and
    attendants enter the stool room, greet ancestral spirits, reveal thirteen blackened
    ancestral stools, offer water for ritual hand-washing, place mashed plantain on
    the stools with petitions for prosperity, fertility, and wealth, scatter remaining
    food for attendant spirits, and bring in a sheep for an offering addressed to
    the spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The persons admitted include the chief, a spokesman, a gun-bearer, a sword-bearer,
    a herald, and several members of the chief’s household.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief and all present wear their oldest cloths; the chief bares his shoulder,
    removes his sandals, stands on them, greets the spirits, and then sits on his
    stool.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the end of the room is a raised low platform holding ancestral stools under
    a coarse cloth; when uncovered, thirteen blackened stools are visible in three
    rows, many aged and caked with clotted blood and pieces of fat.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two brass bells are described as the only other contents of the room.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Water is brought in, poured into a jar, and later said to have been drawn
    early that morning from a stream by an old woman who had passed menopause.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The text states that, in former times, a menstruating woman entering the room
    where ancestral stools were kept would have been killed immediately.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: The head stool-carrier pours water on the ground at the door and addresses
    Grandfather Eguayeboafo, asking the recipients to take the water and wash their
    hands.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mashed plantain is brought in by a cook; the chief offers it on the oldest
    stool while again removing sandals and baring his shoulder.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the plantain offering speech, the chief addresses the spirit grandfathers,
    names the Wednesday Adae, asks them to receive and eat the food, and petitions
    for the town’s prosperity, childbirth, and riches.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The spokesman punctuates the speech with deep exclamations, and the herald
    cries “Tie”; only the oldest stool is addressed with an ancestor’s actual name.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The remaining plantain is sent outside and scattered on the ground for the
    attendant spirits of the stool-carriers of the dead kings.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A sheep is brought into the room slung across a cook’s shoulders and neck,
    while the herald cries; the chief rises with a small knife and addresses the spirits
    using the same words as before but substituting sheep for plantain.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A note states that the blood clotted on the ancestral stools was not from
    human sacrifice; it describes an apparent exception involving a different stool,
    identified as a suman or fetish rather than an ancestral stool.
  category: other
  evidence_refs:
  - ev:9
