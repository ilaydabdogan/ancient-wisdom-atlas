canonical_text:
  quote: ''
  summary: The passage describes Ashanti mortgage, foreclosure, and sale procedures
    for land, including the role of clan members, chiefs, spokesmen, and the Queen
    Mother; the use of tramma as witness money and as a term for outright sale; boundary
    marking; communal drinking or hunting; and an offering to the Earth Creature who
    rules the underworld for the purchaser’s safety on the land.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mortgagee who wants repayment must bring the matter to the chief rather
    than seize the land directly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kwaku Dua Panyin is said to have made illegal a practice of seizing people
    or things connected with a debtor to compel payment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tramma literally means cowries and is described as an added payment set aside
    for the witnesses of a sale transaction.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says old Ashanti bought cats as repositories of their okra or
    breath.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: When land foreclosure proceeds, the clans of the interested parties, the head
    of the stool, his spokesman, and the Queen Mother meet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: If the debt cannot be shared among the mortgagor’s family, the mortgage may
    become a tramma sale, with the price agreed and counted out publicly.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After sale, the chief, spokesman, vendor and purchaser representatives, and
    village representatives view the land and fix boundaries.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Boundaries are fixed using trees, a river, a hill, connecting lines, and planted
    ntome cuttings.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: If the land is already cultivated, vendor and purchaser buy palm wine and
    all present drink it on the spot.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: If the land is virgin forest or bush, a hunter kills an antelope, a tree is
    cut down, and a rough mortar is made for preparing fufu and eto.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Some antelope blood is sprinkled on the ground, and lungs with eto are placed
    in adwin leaves.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The spirit of the land is addressed as Earth Creature who rules the underworld
    and is asked to receive eto and meat and protect the purchaser when he comes onto
    the land.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The purchaser must build a hut at the spot, which is called nnanso.
  category: action
  evidence_refs:
  - ev:10
