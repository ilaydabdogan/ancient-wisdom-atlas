canonical_text:
  quote: ''
  summary: The passage describes parts of a Wednesday Adae ceremony, including the
    chief's seating, ranked attendance, sub-chief homage, and distribution of liquor;
    then records the Queen Mother's account of her Adae offerings to blackened stools
    and ancestors; and begins a Sunday Adae sequence with a protective water-pot gesture
    and yam and water offerings to ancestral recipients.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The seated chief is surrounded by court officials, minstrels, linguists, gun-bearers,
    executioners, drums, and an appointed place for the Queen Mother; attendees know
    their places, and no women are among the select throng.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sub-chiefs come one by one to do homage to the stool, removing sandals, baring
    the left shoulder, bowing from the waist, greeting the chief as 'Grandfather,'
    and retiring.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After greetings, attendees sit on stools in places assigned by rank or army
    position.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: State officials carrying rum and whisky approach the chief, who orders distribution
    among the assembly; after partaking, the advance-guard leader thanks the chief,
    and all give thanks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The chief may not retire or eat until the Queen Mother comes to greet him;
    she may keep him waiting while performing her own Adae.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Queen Mother reports that her women stool-carriers prepare eto, fish from
    Lake Bosomtwe, and possibly antelope meat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The head stool-carriers pour water on the ground so the spirits may wash their
    hands, and the Queen Mother places eto on each stool.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: There are seven Queen Mothers' blackened stools in the Queen Mother's stool
    house.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: While placing eto on the stools, the Queen Mother addresses ancestors, asking
    for health, strength, fertility, wealth, protection of the town, and the return
    of evil upon anyone wishing evil to the town.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Some remaining eto is placed on a rock near the river because, according to
    the Queen Mother, any stone or rock may after dark become a spirit's abode.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Meat is placed on the stools and wine is poured over them.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: When the Queen Mother visits the King, he gives her wine, and she first pours
    a little on the ground to the spirits with a health and protection formula.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: A menstruating woman may not enter the Queen Mother's stool house; if the
    Queen Mother is ill, the head stool-carrier officiates for her.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:14
  text: The Queen Mother does not eat the offerings placed on the stools; children
    of the stool-carriers may eat them, and the remains are said to enable impotent
    or barren people to beget or bear children.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:15
  text: At the Sunday Adae, an old woman waves a pot of water over her head, inverts
    it, sets it down bottom upward, and places a stone on it to prevent quarrelling
    or disagreement among attendees.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: A plate of cut yams called pusa is set beside the blackened stools, and water
    is poured outside the stool house to the 'Ghost Grandfathers' so they may wash
    their hands.
  category: action
  evidence_refs:
  - ev:13
- id: obs:17
  text: The chief places yams upon the stools as the head stool-carrier points out
    and names each stool; remaining yams are scattered outside for the slaves of former
    stool-carriers.
  category: action
  evidence_refs:
  - ev:14
