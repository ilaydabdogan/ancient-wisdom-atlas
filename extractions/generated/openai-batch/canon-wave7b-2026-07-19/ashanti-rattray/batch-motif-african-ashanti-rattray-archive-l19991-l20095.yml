  summary: The passage describes an Asante charm rite involving an inverted pot, broom
    pieces, string, pepper, guinea grain, crossed-leg gestures, binding words, and
    fowl offerings, then lists several gold-weight designs representing ritual actions,
    offerings to the Sky God, legendary friends, animals, traps, and proverbial sayings.
  language: English
