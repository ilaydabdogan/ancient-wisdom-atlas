canonical_text:
  quote: This stool was never to be sat upon.
  summary: The passage describes the Golden Stool as bound to Ashanti national vitality,
    ritually invoked but not sat upon, annually conveyed with its own retinue, and
    credited with power in the defeat of Denkyira. It also recounts a Denkyira tribute
    demand, the killing of the messenger Abebrese, an oath by Ashanti chiefs, the
    defeat and beheading of Ntim Gyakari, and notes on bells and fetters on Ashanti
    stools in relation to ghosts and souls.
  language: English
  quote_policy: quoted
