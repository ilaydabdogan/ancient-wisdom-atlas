canonical_text:
  quote: ''
  summary: The passage describes rules and taboos associated with the sacred grove
    at Santemanso, including sanctuary rights, exceptions for capital offences, offerings
    to ancestral forbears, prohibitions on blood, death, menstruation, and cultivation
    on Tuesday, and the local spirit Santeman Kobina. It then describes a ceremony
    during repairs to royal burial rooms, involving mourning, fasting, drumming of
    royal ancestors' names, a chiefly procession, mixing red earth and water, sheep
    blood added to clay and floors, and gold dust sprinkled by the chief and Queen
    Mother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who reached the sanctuary could be handed over to his master only
    after the master swore that his life would be spared.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Certain offences were excluded from sanctuary protection: adultery with specified
    royal or Blood women, murder, cursing the king or his ancestors, and invoking
    a god or superhuman spirit to kill the king.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before a culprit in the excluded offence cases could be returned for punishment,
    the Ashanti king sent gifts to the chief of Asubengya, and the chief addressed
    the seven forbears of the seven clans in the sacred grove.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The address to the seven forbears states that the offence is forbidden by
    their law and asks that no harm come to the Ashanti king when the culprit is returned.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Rum was poured on a fig tree draped with white cloth; a cow was killed and
    portions were put into little pots.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sanctuary was still used in a minor way by people seeking mitigation or
    redress of sentences from a chief's tribunal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Santemanso, spilling human blood was absolutely taboo; menstruating women
    had to leave the village; no one was allowed to die there, and very ill persons
    were removed.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Santeman Kobina is explicitly described as not a human or ancestral spirit;
    informants described him as a spirit of nature or the soul of the leaves, trees,
    and earth at the spot.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Santemanso, breaking the soil for cultivation was not permitted on Tuesday,
    the day associated with Kobina.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Barim dan or burial rooms for persons of royal blood had fallen into disrepair
    and were being repaired; under the floor of each small room was said to be a former
    ruler of the clan.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The ceremony began with talking drums sounding the history, names, and attributes
    of the dead kings and queens; participants wore mourning cloths and had fasted.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The chief processed from his palace with court officials, state chairs, sandal-bearers,
    a young treasurer carrying iron keys, and minstrels singing his ancestors' names.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Townspeople identified as royals and children of the chief carried water and
    red earth into the courtyard and mixed them; the old Queen Mother assisted.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: A sheep was brought to the mixing place; the omanhene pricked its throat so
    that its blood mingled with the clay, then blood was let fall on the floor of
    each small room.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The chief and Queen Mother sprinkled gold dust over the mixed earth and water;
    the Queen Mother carried a brass vessel said to contain water.
  category: action
  evidence_refs:
  - ev:11
