  summary: The passage explains how Ashanti drum language approximates spoken language
    through accent, pauses, tones, syllable count, and familiar phrase patterns. It
    argues that Ashanti speech may be partly holophrastic, so meaning is often recognized
    in whole phrases rather than isolated words. The author compares drum-talking
    with Morse code, praises its practical communication value, and says it helps
    preserve records and traditions.
