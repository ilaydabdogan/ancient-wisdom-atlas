canonical_text:
  quote: ''
  summary: The passage describes Ashanti drummers, drum etiquette, taboos concerning
    talking drums, and a daily libation ceremony before drumming. It also explains
    the sacred significance of drum-histories of chiefs and says that the spirits
    of drum materials, deities of Earth and Sky, and witches are addressed before
    serious drumming.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ashanti drummers are called the Creator’s or divine drummers, and a myth states
    that the Creator made a herald, a drummer, and an executioner, with court precedence
    in that order.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A drummer is not to carry his own drums; women are not to touch or carry drums;
    and a father is not to teach his own son drumming.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Talking drums have a special room in the chief’s house and are said to observe
    their owner’s ntoro taboos.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ntumpane talking drums are said to taboo blood, menstruating women, and
    jaw-bones or skulls.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ntumpane drums are carried behind a chief and placed behind him when he sits
    to receive courtiers.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Before a drummer drums for the first time on a given day, wine or another
    spirit is brought in a cup and poured in drops on the drum edges.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The drummer addresses the recipients of the libation with the repeated request
    to accept the wine and drink.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The address names drum-related materials and beings including cedar tree,
