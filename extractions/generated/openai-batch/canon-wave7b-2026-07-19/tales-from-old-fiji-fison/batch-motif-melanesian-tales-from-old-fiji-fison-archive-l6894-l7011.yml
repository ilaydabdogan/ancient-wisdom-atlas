canonical_text:
  quote: ''
  summary: 'The passage closes the story of Matandua: the king dies, his body is carried
    by canoe back to Tonga, Kalo-fanga dies beside him, and both are buried with the
    king in his father''s tomb. It then begins a Tongan account of Napoleoni, describing
    Tongan claims of greatness, Napoleoni''s unusual birth, a prophecy about a child
    of a red father, French ambassadors searching for him in America, and their mockery
    by youths who show them a calf.'
  language: English
  quote_policy: summarized
