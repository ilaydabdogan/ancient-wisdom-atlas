  text: Bokola or Bakola is glossed as a dead body intended to be eaten; calling a
    living man by this term is described as scorn, and referring to a father or ancestor
    as an oven inmate is described as a still stronger insult.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says that a war-canoe could arrive at Bau with one or more botowalai
    fastened in a sitting posture on the deckhouse.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Thakombau, also called Thikinovu or the Centipede, is said to have restored
    his father Tanoa to the throne of Bau after rebellion and exile; father and son
    then visited Ngau for vengeance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: At Sawaieke, more than a hundred botowalai, described as corpses of men who
