  text: The passage identifies 'thatha-veitathini' as murderous hatred between brothers
    and states that another word denotes similar hatred between father and son.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Admiral Erskine and officers met the Fijian chief Ngavidi at a Wesleyan missionary's
    table in Viwa and found his bearing difficult to reconcile with reports of him
    as a warrior and cannibal.
  category: attribute
  evidence_refs:
