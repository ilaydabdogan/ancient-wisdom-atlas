canonical_text:
  quote: ''
  summary: 'The passage gives introductory ethnographic and lexical material about
    Fijian cannibalism and hostility: words for murderous kin-hatred, the term Bokola/Bakola
    for a dead body to be eaten and its use as insult, corpse display and eating after
    vengeance, and competing explanations of cannibalism including quality-transfer
    through enemy flesh and hunger or taste.'
  language: English
  quote_policy: summarized
