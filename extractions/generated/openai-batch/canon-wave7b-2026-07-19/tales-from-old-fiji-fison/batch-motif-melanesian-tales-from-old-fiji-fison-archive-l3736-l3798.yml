canonical_text:
  quote: ''
  summary: An old chief, Tui Naiau, explains that no mortal may be called Lord of
    Lakemba because that title belongs to an old god of the land. He recounts that
    this Lord of Lakemba was a great chief among the old gods, son of Tui Langi the
    Sky-King and a Tongan woman called the Charitable One. As a boy he kept apart
    from other chiefly children. His mother warned that isolation would bring hatred
    and leave him without followers in war. The boy asked who his father was, comparing
    himself to other boys whose fathers loved and instructed them, and said that he
    taught himself martial skills. His mother was troubled because she feared both
    concealing and revealing his father's name.
  language: English
  quote_policy: summarized
