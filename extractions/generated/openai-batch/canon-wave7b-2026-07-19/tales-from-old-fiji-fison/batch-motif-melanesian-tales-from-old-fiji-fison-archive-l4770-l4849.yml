canonical_text:
  quote: ''
  summary: A little old man taunts Longa-poa about his helplessness after his canoe
    has sunk and his men have drowned. Longa-poa angrily admits his hunger and wish
    to return to Tonga. The old man laughs, praises his courage, and promises pity.
    He instructs Longa-poa to prepare an earth oven, drops him a fire-stick, and tells
    him to bake a branch from a nearby tree. Longa-poa protests but obeys. When he
    opens the oven, expecting only a scorched branch, steam rises and he finds a great
    pig for a feast.
  language: English
