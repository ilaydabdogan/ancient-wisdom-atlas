canonical_text:
  quote: ''
  summary: A Livuka origin account says that the Livuka people now at Lakemba descend
    from ancestors at Bau who became Bauan fishermen after defeat and a peace-offering.
    The passage explains that conflict began when tribal fishers caught a huge unknown
    fish, secretly ate it instead of giving it to their Bauan lords, and were exposed
    when a boy used the fish rib as a bow and Nabuna carried the roe in her basket.
  language: English
  quote_policy: summarized
