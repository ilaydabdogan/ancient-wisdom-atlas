canonical_text:
  quote: ''
  summary: The passage describes the long construction of a double canoe at Kambara
    for a god, using pre-metal tools and fire. After the canoe is launched with rejoicing,
    Tuwara sails beyond the reef with the ten carpenters and many Kambarans. The passengers
    become seasick in the open water. Malani sees Oneata ahead, and Tuwara orders
    the canoe steered to land. The people of Oneata first hide in the forest because
    they mistake the canoe for a living sea-monster, then approach when they see the
    arrivals are peaceful humans and marvel at the vessel.
  language: English
  quote_policy: summarized
