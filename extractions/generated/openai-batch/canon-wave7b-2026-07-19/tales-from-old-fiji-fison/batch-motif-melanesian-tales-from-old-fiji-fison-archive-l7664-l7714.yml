canonical_text:
  quote: ''
  summary: In the section headed “The Death-Canoes,” Ata-longa and a crew of runaways
    sail a stolen canoe to Tonga. The travelers rejoice in the island’s beauty and
    abundance, decide to stay there rather than return to Bulotu, dismantle the large
    canoe into eight smaller canoes, and explore the coast. The narrator then foreshadows
    a terrible woe. Fifita, a young god and friend of Ata-longa, returns from fishing
    and notices that his wife Moa and their only daughter are not waiting for him
    on the beach as usual.
