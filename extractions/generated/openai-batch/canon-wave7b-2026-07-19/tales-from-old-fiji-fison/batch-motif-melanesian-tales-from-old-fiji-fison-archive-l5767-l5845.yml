canonical_text:
  quote: ''
  summary: The boy reports a dream of a sorrowful lady, and his foster-mother dismisses
    it as only a dream. While he sleeps and continues to weep, the old man says the
    lady was the boy's mother and wants to reveal the truth, but the old woman refuses
    and insists the boy must know only her as mother. The boy grows into a strong,
    gentle youth devoted to his aged foster-parents. Other young men hate and fear
    him because he will not join their wrongdoing. When Yango-levu strikes Tausere
    with a club, the One-eyed one knocks Yango-levu down, seizes the club, and publicly
    challenges the others.
  language: English
  quote_policy: summarized
