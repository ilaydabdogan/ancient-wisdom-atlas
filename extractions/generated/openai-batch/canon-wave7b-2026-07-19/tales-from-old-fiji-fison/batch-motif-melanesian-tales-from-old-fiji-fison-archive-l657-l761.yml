canonical_text:
  quote: ''
  summary: The introduction cites Lord Avebury and argues that language can reveal
    social character. It describes Fijian society, crafts, agriculture, canoes, and
    cannibalism in colonial-era terms, then focuses on the Fijian word Vaka-sombu,
    meaning a lowering. The passage contrasts its ordinary use for lowering bananas
    into a fermentation pit with Vaka-sombu-ninduru, “lowerers of the post,” referring
    to men killed when temple or chief’s-house corner-posts were set up. It describes
    living men being placed in post-holes and buried alive beside posts, with later
    houses having skeletons beneath the floor. The author identifies the practice
    as a human foundation sacrifice meant to propitiate gods and secure a building’s
    stability.
  language: English
  quote_policy: summarized
