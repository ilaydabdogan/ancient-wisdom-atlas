canonical_text:
  quote: ''
  summary: After learning that the woman who bore him is not the same as the couple
    who raised him after finding him on the beach, the young man reaffirms his love
    for his foster parents. They sail by canoe toward Tonga. On the last night before
    landfall, he dreams of his mother walking over the waves and giving advice about
    conditions in Tonga. A little green bird with a white breast guides the canoe
    toward another island and through a reef passage into a lagoon. They land at Tonga-tabu,
    near the king's town, but find it deserted, ruined, and silent. Tausere, the One-eyed
    One, and the wife discuss whether the town has been struck by war, disease, or
    death, and the wife begs to be led to a dwelling-place of the living.
  language: English
  quote_policy: summarized
