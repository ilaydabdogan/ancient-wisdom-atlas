canonical_text:
  quote: ''
  summary: Matandua, called the son of Talingo, questions why a town is deserted and
    why people hide in the forest. Anga-tonu, an old survivor, explains that a huge
    white-faced giant came through the sea, slaughtered the people, abducted the women,
    keeps them in a war-fence as slaves, hunts the remaining men, and is aided by
    an imp in the form of a white vampire-bat. Anga-tonu advises Matandua and his
    companions to flee by canoe and save as many survivors as possible, while he himself
    stays with his dead lord.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The son of Talingo asks why the town is deserted, why people are hiding in
    the forest, and where the rest of the people are.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The greybeard says the chiefs, serfs, young, and old are dead; only his group
    and the women remain, and the women have also been taken from them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Anga-tonu says destruction came to the land eight months earlier, after a
    time of peace and plenty.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A great giant came wading through the sea, with his feet on the ocean bottom
    and his head and shoulders above the waves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The giant is described as having a white face and speaking the local language
    with the tongue of a stranger.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The people fought the giant with spears, clubs, and arrows, but the weapons
    could not pierce his skin and he brushed them away.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The giant killed people by squeezing them with his hands and crushing them
    under his feet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The giant gathered the women, took them away, built a large war-fence, and
    keeps wives and daughters there as slaves.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The giant hunts the remaining men through the forest, kills them one by one,
    and feasts on the slain.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The survivors are few and miserable, cannot go to the beach to fish, eat roots
    found in the woods, and eat them raw.
  category: setting
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The survivors avoid making fire because smoke would betray their hiding place.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: An evil imp in the shape of a white vampire-bat helps the giant by watching
    the fence while he is away and staying awake while he sleeps.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: When men crept to the fence and called to the women for food, the vampire-bat
    imp discovered them, leading to many being killed before they could hide from
    the giant.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Anga-tonu urges Matandua and his two friends to return to their canoe, escape
