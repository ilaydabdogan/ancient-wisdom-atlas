  summary: After rising waters and a receding sea, people who had fled are brought
    into valleys and become servants of chiefs, building canoes. A banyan tree formerly
    used by a dove is carried by the great flood to Vatu-lele; earth on its roots
    turns a reef into land where people dwell. The passage closes by explaining this
    as the way Fijians learned to build canoes.
