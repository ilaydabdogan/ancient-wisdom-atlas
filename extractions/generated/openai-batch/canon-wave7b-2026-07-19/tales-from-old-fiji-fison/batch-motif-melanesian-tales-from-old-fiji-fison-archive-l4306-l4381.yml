canonical_text:
  quote: ''
  summary: In this passage from the story of Longa-poa, the Ferocious One/Fekai beats
    a girl, demands bokolas, and becomes enraged when Longa-poa says the men of Haa-pai
    brought a peace-offering and wealth and therefore were spared. She insults and
    strikes Longa-poa, who flees to the seaside, weeps on the prow of his canoe, orders
    the canoe launched, renounces remaining in the land where she dwells, and calls
    for loyal followers to seek a new land with him. Pulu and Lolo-hea affirm that
    they will follow, though Pulu grieves over Fonua and the pending marriage feast.
  language: English
  quote_policy: summarized
