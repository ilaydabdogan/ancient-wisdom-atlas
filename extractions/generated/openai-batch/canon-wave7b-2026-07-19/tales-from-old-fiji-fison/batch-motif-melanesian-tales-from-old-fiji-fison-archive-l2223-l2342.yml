canonical_text:
  quote: ''
  summary: Five Livuka men reach the Lakemba king, explain that they come from Bau/Ra,
    and describe a wider world beyond Lakemba. They report that they have brought
    the king's daughter, Lady Langi, whom he had mourned as dead. The king treats
    the visitors as god-sent, asks them to wait four days for preparations, and then
    receives Lady Langi from their canoes with a ceremonial path of joined hands and
    native cloth, songs, spear-dancing, feasts, presents, and land gifts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Five men are followed up to the town after observers remark on their voices,
    turbans, and apparent chiefly status.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The five men ask for the king's house and loudly ask for the Lord of Nayau
    while the king is asleep and the women in the house are trying not to wake him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Their loud speech wakes the king, who sits before them and asks where they
    are from and who they are.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The visitors first say they are from Ra and then answer that they are from
    Bau, after which they tell the king about their land.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king says the men of Lakemba had thought they were the only people in
    the world but now learn of another kingdom called Bau.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Livuka men describe Great Fiji, Long Island, and the Yasawas, and state
    that beyond the end of the earth is water.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The king expresses wonder and tells his people to listen so that they may
    be wise and know more than their fathers knew.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: An orator reports that they sailed from Bau bringing the king's daughter,
    Lady Langi, so that the king and his people might rejoice.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The king is troubled because a death-feast had already been eaten and mourning
    for his daughter had ended.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The visitors insist that their claim is true and say that, if they do not
    bring the king's child, they should die.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The king calls the visitors gods and invokes Bulu, Spiritland, while asking
    whether his daughter has truly been brought back.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The visitors say their canoes are anchored at Wangka-talatha and ask when
    they should bring Lady Langi up to the king's town.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The king asks the visitors to wait four days so that preparations can be made
    for feasts, presents, and a proper welcome.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: On the fifth day at high tide, the canoes are poled through the shallows from
    Wangka-talatha to the beach below the town, bringing Lady Langi and singing the
    song of the god Roko-ua.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Lakemba men gather on the beach, board canoes, join hands, and make a path
    for Lady Langi to walk to land.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: A bale of native cloth is unrolled from the water as a path up to the town
    for Lady Langi.
  category: object
  evidence_refs:
  - ev:7
- id: obs:17
  text: Chiefs lead Lady Langi to the town with great respect while children of Livuka
    follow, dancing a spear dance and singing the god's song.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: Feasting is great, rich presents are given to the visitors, and land is also
    given to them.
  category: action
  evidence_refs:
  - ev:8
