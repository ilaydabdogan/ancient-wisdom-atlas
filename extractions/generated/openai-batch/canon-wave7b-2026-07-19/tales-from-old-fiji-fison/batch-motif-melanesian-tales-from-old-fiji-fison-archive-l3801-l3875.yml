canonical_text:
  quote: ''
  summary: A mother, afraid her son will leave her, tells him his father's name only
    after he threatens her. The lad leaves, strikes off flower heads with an ironwood
    stick as a rehearsal of killing enemies, plants the stick, and finds it has become
    a huge tree reaching the sky. He climbs to the Sky-King, identifies himself as
    the Sky-King's son from Tonga, is mocked as small, kills a laughing sky-man with
    a club, and is accepted by the Sky-King for feasting and war. The next morning
    the foe approaches the town.
  language: English
  quote_policy: summarized
literal_observations:
