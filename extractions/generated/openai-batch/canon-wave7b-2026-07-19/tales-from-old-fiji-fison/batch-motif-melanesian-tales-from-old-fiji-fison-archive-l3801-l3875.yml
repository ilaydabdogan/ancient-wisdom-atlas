  text: The mother says she fears telling her son his father's name because he may
    leave her alone, and she says she will die if he goes away.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The lad asks for his father's name and threatens to kill his mother if she
    does not tell him; after she tells him, he leaves without a word.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: While walking across the land, the lad strikes off the heads of flowers with
    a noko-noko or ironwood walking-stick and says he will strike off the heads of
    his enemies in the same way.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At night the lad thrusts the ironwood stick into the ground; in the morning
    it has grown into a great tree whose top is hidden in the clouds and reaches the
    sky.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The lad climbs the tree above the clouds to the sky and calls out to the Sky-King
    as his father.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Sky-King responds angrily and is described as troubled because there has
    been fighting in the sky and he has fled before enemies.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The lad identifies himself as the 'Child that challenges Men,' the Sky-King's
    son from Tonga; the narrator adds that he was later called Lord of Lakemba.
  category: speech
  evidence_refs:
  - ev:4
  - ev:9
- id: obs:8
  text: The Sky-King tells the lad he is small and should return to his mother because
    men, not boys, are needed for the fighting; the surrounding sky-men laugh at the
    child.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The lad strikes the loudest laughing sky-man senseless with his fist, then
    takes a club from the Sky-King and strikes the sky-man again, breaking his skull.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Sky-King rejoices, calls the lad his son, orders ovens heated for a feast,
    plans to slay enemies the next day, and the lad makes himself a club from the
    ironwood tree.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: On the following morning, the foe comes up to the town shouting for war.
  category: action
  evidence_refs:
