canonical_text:
  quote: one of the places where men's ghosts went down to Bulu, the land of spirits
  summary: Fekai gathers people with grievances against Longa-poa and pursues him
    at sea. After three days of chase, Longa-poa tries to reach land and make a stand,
    but both canoes are caught in boiling water and a raging current leading to a
    black rock and dark cavern associated with the route of ghosts to Bulu. Fekai's
    canoe goes down first. Longa-poa orders his men to leap, catches a bush on the
    rock, reaches shore alone, and later sleeps by a palm tree on a sandy beach.
  language: English
  quote_policy: quoted
