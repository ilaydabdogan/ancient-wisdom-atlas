canonical_text:
  quote: ''
  summary: A grieving couple mourns their boy, described as their seventh child, after
    a chief has eaten him. A hidden household imp named Ilo-anga, the Cunning One,
    lives in the loft above the fireplace, receives food from the family, and guards
    the house at night. Hearing their weeping, he questions them, learns of the chief’s
    act and the threat to the remaining children, pities them, and promises to save
    the children because a strange thing will happen that night.
  language: English
  quote_policy: summarized
