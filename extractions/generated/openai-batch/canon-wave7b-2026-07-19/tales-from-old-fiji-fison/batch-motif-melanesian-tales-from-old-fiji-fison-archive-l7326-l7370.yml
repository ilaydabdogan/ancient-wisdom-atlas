canonical_text:
  quote: ''
  summary: Maui stamps down hills on Ata, a land said to be the first he fished up
    from the sea. He sails on, uses his hook to raise Tonga above the waves, and treads
    its hills into fertile plains where plants and food crops spring up. He also fishes
    up other nearby islands, while the narration notes disagreement about Samoa, Fiji,
    and an alternate claim involving Tanga-loa and Papa-langi. Maui and his crew return
    to Bulotu, where he triumphs over Hiku-leo, but an assembly of gods around the
    Water of Life is overshadowed by Akau-lea's groans, silent kava drinking, and
    fear of unknown evil.
  language: English
  quote_policy: summarized
