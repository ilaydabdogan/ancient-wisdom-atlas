canonical_text:
  quote: ''
  summary: Ata-longa urges others to leave Bulotu for a new land. He proposes taking
    Maui's canoe while Maui sleeps after kava drinking, secures secrecy, presents
    a large kava root as an atonement gift, insists Maui alone drink it, and serves
    him until he falls into deep sleep. At night Ata-longa and the plotters launch
    the canoe, board their families, and sail away unseen by the gods of Bulotu. The
    narrator identifies the event with the Beginning of Death.
  language: English
  quote_policy: summarized
