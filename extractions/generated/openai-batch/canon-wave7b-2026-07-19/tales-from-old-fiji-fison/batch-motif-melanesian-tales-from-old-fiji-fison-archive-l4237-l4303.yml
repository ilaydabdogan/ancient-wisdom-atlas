  summary: The passage introduces Longa-poa, a powerful Tongan chief of royal descent,
    who fears his wife Fekai because she is the daughter of a Sacred King and nearer
    to the gods. A note says the legend is being viewed from a Fijian perspective.
    Longa-poa returns from Haa-pai with tribute after an expedition ordered by the
    War-King Kano-ku-bolu. After a feast, he goes home and finds Fekai beating one
    of her women; she greets him scornfully and asks about the bodies of his foes.
