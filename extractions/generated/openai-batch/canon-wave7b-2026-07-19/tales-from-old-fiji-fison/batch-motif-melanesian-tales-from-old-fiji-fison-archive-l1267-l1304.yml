  quote: makes ready the strangling cord, or goes forth to dig the grave
  summary: The passage describes elderly parents as safe while they remain useful,
    but liable to be strangled or buried once considered unproductive. It presents
    this as an established custom, sometimes requested by the old people themselves,
    and links it to a communal-family survival logic. It also states that Fijian beliefs
    about life after death offer terror rather than comfort, with annihilation imagined
    as possible under some circumstances.
