canonical_text:
  quote: ''
  summary: 'A fragment first describes drowned children whose voices are heard singing
    by moonlight at the Ono passage. The following tale begins an account of how Tongans
    came to Fiji: a Samoan fisherman named Lekambai is driven out to sea by a storm,
    loses his canoe, clings to a rock, climbs until he reaches the Sky, and is pitied
    by the Sky-king, who sends him home on a turtle with instructions not to look
    up and to bring back a coconut and a coconut-leaf mat.'
  language: English
  quote_policy: summarized
