canonical_text:
  quote: ''
  summary: The excerpt describes Fijian fear of witchcraft, counterspells, and reputed
    wizards, then discusses the term for murderous hatred between brothers, chiefly
    succession rivalry, and a narrative in which Thakombau ambushes and kills his
    brother Raivalita, who dies after cursing him with bloody dust.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fijians are described as greatly afraid of witchcraft; mission agents may
    abandon posts from fear, and people may die when they believe themselves bewitched.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dying chief says that he will be at rest if Pela is brought from Totoya
    and clubbed before his eyes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some men claim to be wizards and use fear to obtain blackmail, but reputed
    wizards may be killed by the kinsmen of people whose deaths they claim to have
    caused.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The word Bula-kaureki is given as the counterspell used in witchcraft cases
    and is glossed as meaning, by etymology, “live, and I rejoice.”
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator states that sorcery rites among widely separated tribes show
    notable similarity or coincidence, citing collections by Tylor, Avebury, and others.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Fijian word Thatha-veitathini is defined as murderous hate between brother
    and brother and is said to be in common use.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Brothers of equal rank, especially sons of a great chief by women of equal
    rank, are described as rivals for succession, while their mothers foster their
    enmity from childhood.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The narrator speculates that, if Bau were still heathen, Thakombau’s sons
    Abel, Timothy, and Joseph Thelua would be scheming to murder one another or one
    would already have killed the others.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Central Arabian example from Palgrave is quoted or paraphrased as a parallel
    involving expected sword-clashing after Feysul’s death and enmity between Abdallah
    and his brother.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: Raivalita, son of Tanoa and brother of Thakombau, plots to kill Thakombau
    and receives encouragement from Rewa and alleged secret help from white residents.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Raivalita goes to Levuka to obtain arms and ammunition from white traders
    and returns to Bau in a laden canoe.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Thakombau ambushes Raivalita from behind a house with trusted followers, seizes
    him, orders a strike, and a heavy war-club breaks Raivalita’s skull.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The dying Raivalita regains consciousness, throws bloody dust in Thakombau’s
    face with a curse, falls back, and speaks no more.
  category: action
  evidence_refs:
  - ev:10
