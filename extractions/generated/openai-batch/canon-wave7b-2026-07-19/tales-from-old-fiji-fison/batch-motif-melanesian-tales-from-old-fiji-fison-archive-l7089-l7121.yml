  quote: In  the  beginning  there  was  no  land
  summary: The passage opens an account of how men came upon the earth and became
    subject to decay and death. It describes an initial world with only the gods'
    land, no dry land for men, all sea beneath the sky, no day or night, and continual
    mild light. It then locates the gods in Bulotu, an island of uncertain location
    said by some to be where the sky meets the waters in the sun's climbing-path,
    and names Maui, his two sons, and his brothers among the ruling gods.
