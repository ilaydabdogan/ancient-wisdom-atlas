canonical_text:
  quote: ''
  summary: The Sun rises while the Sun-child delays in his sail. At evening the Sun-child
    sails close to the Moon, identifies himself as the child of her brother the Sun,
    and holds her until she promises not to leave. Against his father's words, he
    asks for Monuia rather than Melaia. The Moon gives him Monuia wrapped in cloth
    and tied with string, warning him not to open it at sea but to sail to Tonga and
    look only after landing. The Moon then climbs into the sky and sailors rejoice.
  language: English
  quote_policy: summarized
