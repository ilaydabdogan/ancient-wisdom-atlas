  summary: Longa-poa and a little old man share a miraculous cooked feast. At the
    old man's command, Longa-poa gathers small green coconuts that provide abundant
    milk. The little old man, then identified as a god, tells Longa-poa he can be
    sent back to Tonga before sunrise, orders him to take a slip from the Tree of
    Feasts for planting in Tonga, and provides a huge bird to carry him home. Longa-poa
    ties himself to the bird and pledges himself to the god.
