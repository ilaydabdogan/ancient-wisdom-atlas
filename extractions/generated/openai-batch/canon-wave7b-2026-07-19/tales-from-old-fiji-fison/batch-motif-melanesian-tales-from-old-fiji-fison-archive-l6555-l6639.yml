canonical_text:
  quote: '"His knee !  His knee !"'
  summary: A young chief enters the giant's fenced place, where a white vampire-bat
    flies away and the captive women warn him to flee. The giant attacks, but the
    young chief strikes the weak place behind his knee, knowledge previously given
    by Talingo. Kalo-fanga joins the fight, and both men keep striking the giant's
    knee. The giant uproots a tree and knocks them down, but a little green bird flies
    into his face and pierces his eye.
  language: English
