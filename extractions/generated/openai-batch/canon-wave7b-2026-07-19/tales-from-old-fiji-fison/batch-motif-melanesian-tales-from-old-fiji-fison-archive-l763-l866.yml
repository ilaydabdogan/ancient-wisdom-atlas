canonical_text:
  quote: ''
  summary: The passage lists Fijian terms whose ordinary meanings refer to house-building
    materials, grave bedding, canoe rollers, mast operations, animals, ornaments,
    and other objects, but whose secondary meanings denote people killed, dead bodies,
    cannibal feasts, grave attendants, canoe rites, and raid displays. It also reports
    women strangled for a chief's grave and supposed to accompany him to Bulu, the
    Spirit-land, and includes an explicit comparison to a Tahitian term for a slain
    enemy's body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At several stages of house construction, people were killed; the setting up
    of the first pair of rafters was accompanied by a cannibal feast, and other victims
    were killed and eaten when the building was finished.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The word thotho primarily means dried grass used on house floors, but in a
    chief's grave it denoted women strangled and laid at the bottom of the grave.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the souls of the strangled women were supposed to accompany
    the dead chief to Bulu, the Spirit-land, and wait upon him there.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports that more than twenty women had been sacrificed at the
    death of a great chief as the thotho of his grave.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lango primarily meant short log rollers used to move a canoe, but the rollers
    of a new war-canoe were bodies of men killed for the occasion.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Men were killed when the mast of a new war-canoe was first raised, and victims
    were slain when the mast was first lowered and unstepped.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: If a chief presented a new canoe to friends, the recipients were expected
    to visit him bringing a dead body on the deck, called the Vaka-ndrandra, or stainer
    with blood; the deck was then said to be washed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the windward islands, Vonu balavu, or long turtle, denoted the dead body
    of a man to be eaten; in the leeward islands, Vuaka balavu, or long pig, had the
    same reported meaning.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Manu-manu-ni-latha, bird of the sail, once meant a child suspended by one
    foot or hand from the gaff when canoes returned from a successful raid.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Taumbe-vandra, literally necklace of the screwpine, denoted a dead body whose
    head had been smashed by repeated club-strokes, and the passage compares it with
    a Tahitian term for a slain enemy's body beaten flat and worn as a cloak in battle.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Boto-walai, literally a trussed frog, once denoted a man baked whole.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The author characterizes these as double-meaning words that attempted to hide
    the loathsomeness of the practices they implied.
  category: other
  evidence_refs:
  - ev:11
