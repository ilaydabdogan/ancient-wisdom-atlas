canonical_text:
  quote: '"I am going. Talingo beckons me away."'
  summary: After earlier events, old Anga-tonu lives on as a teller of old stories.
    The King prospers through Talingo's recurring advice in dreams and through Kalo-fanga's
    loyal protection. Years later the King voyages toward Fiji to visit his mother's
    grave, stays peacefully at Ono, forms a friendly league, and reaches Nairai. There
    Talingo appears one last time in the night, silently beckoning, and the King says
    farewell to Kalo-fanga.
  language: English
  quote_policy: quoted
