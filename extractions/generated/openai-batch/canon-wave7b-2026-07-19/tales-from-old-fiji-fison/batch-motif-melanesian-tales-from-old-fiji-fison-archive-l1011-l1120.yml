canonical_text:
  quote: ''
  summary: The passage describes the Koroi title and special blackened body decoration
    granted to a young warrior after a killing, public admiration for the decorated
    warrior, examples in which non-combatants are killed or threatened so that a man
    may become Koroi, Fijian lexical equations of war with evil, and several Fijian
    terms for torture, corpse concealment, and cannibal-related violence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young warrior who gained the title Koroi after killing was permitted for
    two or three days to smear his face and bust with lampblack and oil, distinct
    from ordinary black war-paint.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The decorated Koroi warrior passed through the town and received admiration
    from old men, women, boys, girls, and comrades.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator states that the Koroi distinction was not necessarily earned
    through a gallant battlefield deed.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: One Koroi-decorated warrior was said to have earned the distinction by lying
    in wait among mangrove bushes at the waterside and killing an old woman from a
    hostile tribe as she sought shellfish on a mudflat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A girl fleeing after an attack threw herself at a Viwa man's feet, clasped
    his knees, and begged to live, offering to become his wife, fish-catcher, and
    slave.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Viwa man stepped between the girl and her pursuer and asked the pursuer
    to be merciful.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The pursuer said he would be Koroi that day, swung his club, threatened the
    intercessor, and the intercessor fled before hearing the girl's death-shriek.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage says the Fijian word tha, meaning evil, was used as a synonym
    for valu, meaning war, with examples connecting evil phrases to war.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The narrator reports that the Fijian language had many words for cruelty and
    torture, many of which he says could not be recorded, and that many concerned
    punishment of women.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: Thulang-gungguna is described as pinning a man to the ground with spears or
    sharp stakes, and more usually as hiding a dead body under water by holding it
    down with forked sticks over the arms and legs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The underwater hiding of a body is said to be used after murder to erase identifying
    marks, or when a bokola, described as a dead body for eating, had been stolen
    and needed concealment before cooking and eating.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Vaka-totogana is described as torturing an enemy by cutting off a body part,
    preferably the tongue but sometimes the nose or ears, roasting and eating it before
    him while taunting him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage says another class of words denoted cruel practices that could
    be viewed as socially and religiously justified from a Fijian point of view and
    were rites of extensive prevalence among other nations.
  category: other
  evidence_refs:
  - ev:8
