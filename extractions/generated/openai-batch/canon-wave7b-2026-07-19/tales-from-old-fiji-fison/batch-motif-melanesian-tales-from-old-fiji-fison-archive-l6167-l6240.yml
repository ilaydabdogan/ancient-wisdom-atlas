canonical_text:
  quote: ''
  summary: Talingo speaks to Matandua in a dream, identifies herself as his true mother,
    recounts earlier dangers, warns him that Big-body sent him adrift, and instructs
    him to return to Ono and then Tonga with the two old people. Matandua wakes to
    find a steer-oar floating by the canoe; it moves in his hand and helps him row
    swiftly. He later tells the old people that his mother came over the waves to
    save him, while Senirewa denies this and her husband confirms Talingo's words.
  language: English
  quote_policy: summarized
