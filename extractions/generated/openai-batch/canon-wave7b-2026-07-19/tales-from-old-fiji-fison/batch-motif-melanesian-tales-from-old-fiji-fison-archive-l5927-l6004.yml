canonical_text:
  quote: ''
  summary: Matandua and Tausere receive wondrous aid while making sinnet and preparing
    posts for a temple. Tausere and his wife discuss whether the unseen helper is
    Matandua's absent mother. The young men then plot to kill Matandua with a concealed
    pit, but on their return they encounter a silent sea-wet woman holding a steer-oar,
    whom they pursue.
