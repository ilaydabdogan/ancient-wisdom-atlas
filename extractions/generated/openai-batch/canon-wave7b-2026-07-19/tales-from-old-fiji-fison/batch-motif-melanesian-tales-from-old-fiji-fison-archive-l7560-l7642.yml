canonical_text:
  quote: ''
  summary: Tanga-loa coerces Hiku-leo by twisting his tail while Maui seeks an explanation
    for the missing canoe, Ata-longa, and crew. Hiku-leo denies involvement. The Tree
    of Speech mourns, sheds tear-like drops into the Water of Life, and announces
    that Ata-longa has taken the disobedient ones to a new land, never to return;
    hunger, thirst, trouble, sorrow, sickness, and Death are now their lot. The gods
    dread the unfamiliar word Death and understand it inwardly.
  language: English
  quote_policy: summarized
