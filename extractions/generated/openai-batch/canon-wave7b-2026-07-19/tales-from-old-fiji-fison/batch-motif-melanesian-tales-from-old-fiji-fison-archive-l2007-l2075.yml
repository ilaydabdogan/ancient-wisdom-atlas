canonical_text:
  quote: ''
  summary: Bauans prepare to attack after the people regret eating a great fish instead
    of giving it to Bau. A great wave rises with the attackers, and a god speaks through
    a convulsed priest, sparing the Livuka and Bu-toni men but ordering their expulsion
    by canoe. At Lakemba, a king entrusts unpainted native cloth to his daughter Langi;
    she sleeps, rain ruins it, and he beats and drives her away. Langi floats out
    to sea on old coconuts and later ties herself to a great bird, which carries her
    toward Ra.
  language: English
  quote_policy: summarized
