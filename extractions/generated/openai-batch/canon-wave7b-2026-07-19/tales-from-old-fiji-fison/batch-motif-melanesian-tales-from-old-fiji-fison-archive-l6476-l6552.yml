canonical_text:
  quote: '"I will not flee!"'
  summary: A young chief declares his intention to confront a giant who has slain
    his people. Anga-tonu urges him to flee abroad and preserve the chiefly line,
    while Kalo-fanga and others vow loyalty. The young chief refuses flight, goes
    with Kalo-fanga through the forest toward the giant's war-fence, then orders Kalo-fanga
    to stay behind and watch.
  language: English
  quote_policy: quoted
