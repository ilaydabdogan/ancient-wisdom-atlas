  summary: The passage explains Fijian terms and customs connected with killing, including
    an afterlife punishment in Bulu for a man whose club had no bloodstain, named
    Datuvu or “Dung-beater.” It lists terms for killers and acts of killing, describes
    a night killer called Bati-kandi, mentions bamboo sleeping protections against
    such attacks, and explains honorific titles for men who had shed blood.
