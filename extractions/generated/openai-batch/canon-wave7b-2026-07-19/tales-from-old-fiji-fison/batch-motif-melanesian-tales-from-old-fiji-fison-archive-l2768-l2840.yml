canonical_text:
  quote: ''
  summary: A turtle that had come from heaven is buried in an unusually deep grave
    with a mat and coconut. The Sky-king sends a sandpiper to investigate the turtle's
    failure to return, and the bird brushes the head of a lad, Lavai-pani. Lavai-pani
    remains a child for generations and silently preserves knowledge of the turtle's
    grave. Later the King of Tonga sends men to Samoa to obtain the heavenly turtle's
    shell for fish hooks; after an unsuccessful mission and a royal threat, the Tongans
    return. Samoan elders cannot locate the grave, but Lavai-pani says he can show
    it and is mocked because he appears to be only a boy.
  language: English
  quote_policy: summarized
