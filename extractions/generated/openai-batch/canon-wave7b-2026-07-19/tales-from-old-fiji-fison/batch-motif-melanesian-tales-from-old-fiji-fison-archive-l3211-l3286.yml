canonical_text:
  quote: ''
  summary: The Sun-child leaves his mother and the human world to seek his father,
    the Sun. He prepares a canoe and sail, pursues the Sun east and west, finally
    meets him at dawn by advising him to hide his face behind a cloud. The Sun praises
    the boy's wisdom, descends to the sea, speaks with him, and instructs him to wait
    for the Moon and ask for Melaia rather than Monuia.
  language: English
  quote_policy: summarized
