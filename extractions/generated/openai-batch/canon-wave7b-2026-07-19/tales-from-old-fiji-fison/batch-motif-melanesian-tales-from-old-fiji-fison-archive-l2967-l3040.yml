canonical_text:
  quote: When he closed his eyes then it was dark... when he opened his eyes, then
    darkness fled away
  summary: The Great Serpent dwells on the hill of Kau-vandra, grants land to a chosen
    tribe, visits and teaches them, and sleeps in a cave. His closing and opening
    eyes correspond to night and morning, and his movements cause earthquakes. A black
    dove sleeps on a banyan tree near his cave and wakes him at morning, after which
    he calls to the Boat-builders to rise and work.
