canonical_text:
  quote: ''
  summary: The passage recounts Livuka’s building, later conflict with Lakemba, and
    a subsequent voyage by some Livuka ancestors and their families in a great canoe
    toward windward lands. They visit Oneata and Vatoa, perform spear dances, decide
    Vatoa is the end of the earth, and prepare to return. Two gods living in a hollow
    tree stump hear the dance and look out; a leprous Livuka man who stayed aboard
    the canoe sees them.
