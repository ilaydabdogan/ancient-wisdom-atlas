canonical_text:
  quote: ''
  summary: 'Chiefs from Faranise continue searching for a prophesied deliverer: the
    child of a red father. Napoleoni’s mother recognizes the sign because her son’s
    father is a Tongan chief, though Napoleoni has been dumb from birth. Napoleoni
    then speaks for the first time, declares himself the one sought, departs by canoe
    to lead the Faranise, receives a red flower from his mother, defeats Uelingtoni,
    and is later claimed by competing peoples, while the narrator asserts his Tongan
    origin.'
  language: English
  quote_policy: summarized
