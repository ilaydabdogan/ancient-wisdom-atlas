canonical_text:
  quote: ''
  summary: After a violent death is heard, Talingo escapes in darkness by drifting
    away with her child on the broad blade of a steer-oar. For four days she drifts,
    nursing the child and defending him from seabirds, one of which tears out one
    of his eyes. On the fifth day they reach the reef at Ono; Talingo swims through
    the breakers and lagoon, lands near Onolevu, crawls to the foot of a palm, and
    dies while still holding the sleeping child. An elderly childless couple, Tausere
    and Senirewa, find her and the baby on the beach.
  language: English
  quote_policy: summarized
