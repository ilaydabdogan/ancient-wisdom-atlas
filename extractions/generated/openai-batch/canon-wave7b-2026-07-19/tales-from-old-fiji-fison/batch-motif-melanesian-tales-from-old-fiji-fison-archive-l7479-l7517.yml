canonical_text:
  quote: ''
  summary: In Bulotu, described as a sleepy land of rest, a messenger reports that
    a canoe is gone and that Hiku-leo, Ata-longa, and others are missing. Hiku-leo,
    angered by Maui's mocking words, has withdrawn to a cave in the forest for many
    days. Maui suspects Hiku-leo has taken the canoe and worries that Ata-longa will
    learn evil from him. Tanga-loa suggests that Ata-longa is only a boy eager for
    a sail, but agrees he should be scolded and warned against Hiku-leo.
