- id: obs:1
  text: A great bird or feather-borne transport arrives at Kamba before dawn; Lady
    Langi unties herself from the feather, and the bird flies away, leaving her alone.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kamba is described as empty in those days, with no people dwelling there;
    people from Bau came there to set and collect fish-snares.
