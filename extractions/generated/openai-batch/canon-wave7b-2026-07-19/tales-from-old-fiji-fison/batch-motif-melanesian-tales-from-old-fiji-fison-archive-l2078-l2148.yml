  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The old chief says the gods have sent Lady Langi to him and says the mind
    of the god has declared that his people should sail away and seek a land to dwell
    in.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The old chief plans to take Lady Langi back to her father and expects her
    father to give him land for himself and his people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The old chief says Lady Langi must be hidden at Bau and lie close in his house;
