  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Lady Langi identifies herself as the daughter of the Lord of Nayau, whose
    land is Lakemba and who rules many islands.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Lady Langi says rain spoiled the cloth, she feared the king's anger, she drifted
