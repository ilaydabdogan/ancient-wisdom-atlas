canonical_text:
  quote: ''
  summary: Lady Langi is brought by a great bird to empty Kamba, where an old chief
    from Bau finds her while tending fish-snares. She explains her origin in Lakemba
    and how she drifted away on nuts intending to die in the waters before the bird
    carried her to Kamba. The old chief interprets her arrival as divine help for
    his people, who have been ordered to seek a new land. He hides her in Bau, then
    in a fenced deck-house on his canoe, telling his people that a god travels with
    them and must not be seen. The canoe fleet reaches Koro safely.
  language: English
  quote_policy: summarized
