  text: An old man who is a chief comes by canoe from Bau to take up his fish-snares
    and meets Lady Langi on the beach.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old chief is afraid because of Lady Langi's appearance and says she is
