  summary: The passage concludes a migration account in which Tongans, guided by an
    ageless boy named Lavai-pani, recover a buried turtle shell, conceal one of its
    thirteen pieces from their king, flee royal punishment by following the wind,
    and arrive near Fiji, where they are settled by the King of Rewa and continue
    worshipping a turtle shell. The next account begins with Tui Nayau describing
    the hill and temple of Dengei, the Great Serpent, who taught a chosen tribe to
    build canoes and gave them power in Fiji.
