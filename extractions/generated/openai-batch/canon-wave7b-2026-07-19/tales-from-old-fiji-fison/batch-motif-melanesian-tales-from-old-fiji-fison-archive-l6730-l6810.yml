canonical_text:
  quote: ''
  summary: The passage describes the growth of a population descended from the giant,
    the founding of additional towns, a coalition attack on Tonga-tabu after the giant's
    death, the King's refusal to surrender, his successful ambush and rout of the
    attackers, his decision to stop the slaughter, the establishment and enforcement
    of tribute, his just rule over the islands, and his honor toward his foster-parents
    after their deaths.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Many children, sons of the giant born of women, grow into mighty men; the
    town becomes too small and divides into three bands, building Mua and Hihifo as
    additional towns.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men from Vavau, Haapai, and other islands hear that the giant is dead and
    form a league to attack Tonga-tabu in revenge for earlier slaughter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some in Tonga-tabu fear the attack and propose peace-offering and submission,
    but the King rejects surrender and threatens anyone who speaks of it with his
    club.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the enemy lands, the King attacks their rear; the enemy panics, throws
    down arms, flees, and is slain, with women from the town also taking part in the
    killing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Many enemies flee toward the canoes, but the King has already dragged the
    canoes up onto the beach, cutting off retreat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The King stops the slaughter and says living men remain useful through life,
    while the dead have no further usefulness.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The King sends surviving enemies back to their own lands, keeps only those
    who stay voluntarily, and appoints a yearly tribute from every land.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Some tributaries rebel the next year, fortify their towns, and refuse tribute;
    the King attacks them, destroys their war-fences, and burns their towns.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The King is described as just and wise toward the obedient, preventing oppression,
    turning enemies into friends, and bringing all the islands under his rule by strength
    and counsel.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The King's foster-parents live to old age, are loved and honored by him, and
    after death are buried in the tombs of chiefs while the King and people mourn
    them.
  category: relationship
  evidence_refs:
  - ev:8
