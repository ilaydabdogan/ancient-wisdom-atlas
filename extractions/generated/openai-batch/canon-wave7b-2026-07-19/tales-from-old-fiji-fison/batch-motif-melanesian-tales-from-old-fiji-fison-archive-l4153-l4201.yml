canonical_text:
  quote: ''
  summary: The people and chiefs of Haapai deliberate over Alo-alo speaking to them
    in a foreign or Fijian tongue. The priest interprets the event as possible divine
    anger or hunger, calls for larger feasts, and says Dau-lawaki must kill, bake,
    and eat Alo-alo's cat according to the god's repeated word. The Rogue/Dau-lawaki
    fears punishment for killing the sacred cat, but the chiefs threaten him, so he
    kills, cooks, and eats it. The skull and bones are buried in the temple, and he
    is later sent back to Lakemba by double canoe.
  language: English
  quote_policy: summarized
