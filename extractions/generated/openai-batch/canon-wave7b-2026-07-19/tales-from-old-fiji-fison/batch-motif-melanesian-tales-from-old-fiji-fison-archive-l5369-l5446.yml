canonical_text:
  quote: ''
  summary: At dawn the Oneata god Wakuli-kuli urges Tuwara to give him the mosquitoes
    and leave. Tuwara tells him that mosquitoes are gathering to sleep in a cave and
    that they must not be disturbed too early. After repeated impatient questions,
    Tuwara eventually has the mosquitoes confined in a lined, mat-covered basket and
    taken by canoe to Oneata. There he persuades Wakuli-kuli not to open the basket
    until Tuwara is beyond the reef, receives the shellfish, and departs with them
    in the canoe.
  language: English
  quote_policy: summarized
