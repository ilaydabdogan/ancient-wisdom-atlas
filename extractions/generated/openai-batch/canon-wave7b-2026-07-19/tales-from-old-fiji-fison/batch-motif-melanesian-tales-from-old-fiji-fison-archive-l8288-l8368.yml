canonical_text:
  quote: ''
  summary: 'The passage describes a Fijian funerary practice in which a dead grandfather
    is expected to want to take his grandson, and the mother’s brother carries the
    child around the bier to confuse the dead man before the corpse is taken quickly
    to the grave. It then describes Fijian yaqona/kava: its names, plant source, ceremonial
    bowl and cup, ranked assembly, presentation and preparation of the root, serving
    procedure, and stupefying effects.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A kinship example states that a grandfather marked as A has a son marked as
    B, and that son’s son is A like the grandfather.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the dead grandfather is therefore likely to want to take
    his grandson with him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The dead man’s body is put on a bier and carried on the shoulders of several
    young men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mother’s brother runs around the bier, back and forth, holding the child.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dead man is supposed to follow the movements, become giddy, and lose track
    of the grandson while the uncle darts away and the carriers run to the grave.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Fijian tang-gona or yaqona is identified as Piper methysticum and equated
    with forms written ava, cava, and kava; the passage says kava is the Samoan form
    of the word.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Yaqona is drunk in solemn assembly on almost all state occasions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The drink is made in a bowl called a tanoa, which may be elaborately carved
    and has a small rope fastened to its rim; the drinking cup is half a large coconut
    shell.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Drinkers squat in a semicircle facing the great chief; the tanoa is placed
    inside the circle with its rope stretched toward the greatest chief present.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: A man enters bearing a yaqona root, and the assembly cries out, “A great root,”
    ending with a shrill neigh.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The root is cut into small pieces, chewed in solemn silence by young men or
    girls, placed into the tanoa, mixed with water, and worked by hand.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The chewings are strained out with a fibre bundle; the cup is filled by squeezing
    the wet fibre, the cup-bearer shouts “Poured forth,” the master of ceremonies
    names the next drinker, and the named person claps twice.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage says tang-gona has an intoxicating or stupefying effect, and habitual
