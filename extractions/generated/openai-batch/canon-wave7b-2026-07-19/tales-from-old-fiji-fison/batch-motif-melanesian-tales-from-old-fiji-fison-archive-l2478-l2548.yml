canonical_text:
  quote: ''
  summary: Bound gods in a canoe are accused of pushing land away with their feet;
    after being turned around, they are left under the guard of children while the
    elder men go ashore at Ono. The gods persuade most of the children to untie them
    in exchange for a beautiful new song, despite one lad's warning. The gods climb
    the mast, sing of islands including hidden Burotu, and then pull down on the mast
    until the canoe sinks and the children drown. The passage also explains Burotu
    as an elusive land sometimes seen but never reached.
  language: English
  quote_policy: summarized
