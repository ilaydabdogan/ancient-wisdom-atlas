canonical_text:
  quote: ''
  summary: During a night after unsuccessful turtle fishing, Big-body finds One-eye/Matandua
    asleep alone on a canoe, unties its mooring, and has followers steal the paddles
    so the canoe drifts away. While sleeping, Matandua dreams he is adrift in an empty
    canoe without paddles, sees a fair woman swimming with a steer-oar carrying a
    blood-stained child with a wounded eye, and hears a hidden weeping voice call
    him son and identify itself as his true mother, Talingo, not Senirewa.
  language: English
  quote_policy: summarized
