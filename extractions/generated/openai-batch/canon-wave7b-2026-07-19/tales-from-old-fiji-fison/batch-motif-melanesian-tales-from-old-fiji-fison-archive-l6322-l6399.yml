canonical_text:
  quote: ''
  summary: A bird leads Matandua and others from the town into a valley thicket, where
    famine-stricken men sit around a dying old chief. The One-eyed One confronts the
    dying man, who reacts in terror to the bird and addresses Talingo, pleading not
    to be struck and blaming Faha before admitting he killed Faha with a spear. The
    old man dies. The young man says the dead man was his father, that his father
    killed his mother Talingo, and that the gods have taken vengeance out of his hands.
    Anga-tonu questions the young man's claim because Talingo and her nursing child
    were thought drowned together; after the young man tells his story, Anga-tonu
    says he should succeed the dead king, though the land is ruined.
  language: English
  quote_policy: summarized
