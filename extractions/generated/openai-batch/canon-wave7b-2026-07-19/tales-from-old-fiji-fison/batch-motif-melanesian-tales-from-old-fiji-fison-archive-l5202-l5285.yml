canonical_text:
  quote: ''
  summary: Tuwara and other Kambarans leave Oneata after friendly treatment and bring
    the god of Oneata to Kambara. After a feast, Tuwara hides the mosquito plague
    of his land behind an explanation of a large mosquito curtain. At night the god
    of Oneata hears the mosquitoes buzzing, calls the sound sweet, and asks Tuwara
    to give him the mosquitoes after Tuwara describes them as insects kept to sing
    him to sleep.
