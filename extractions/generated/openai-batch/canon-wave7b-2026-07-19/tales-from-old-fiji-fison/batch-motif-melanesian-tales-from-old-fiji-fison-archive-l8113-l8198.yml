canonical_text:
  quote: ''
  summary: The appendix passage describes preparation of a dead body in an earth oven
    with fire-heated stones, later explanation of the trunk of a body as food, construction
    and terminology of a Fijian double canoe with an explanation of Talingo's escape
    by diving between its two hulls, and reports of spirit possession in which priests
    or a king/high-priest show twitching flesh, convulsions, and altered speech.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hole is dug in the earth, filled with dry wood, set on fire, and supplied
    with stones about the size of a man's fist.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Heated stones are thrust inside the dead man's body and arranged around and
    over it after the body is placed on leaves in the fire pit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The covered body is buried under earth; steam issues from cracks in the mound
    until the cooking process is judged complete.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After removal from the oven, the body is unwrapped, its face painted, and
    a wig or turban put on its head; the passage says the features remain recognizable.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Vale-karusa is explained as the trunk of the body, eaten first because it
    does not keep as long as the limbs when part of a bokola is saved.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: A chief with bitter enmity toward a victim may insist on eating the body himself,
    with repeated bakings used to keep it usable.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: A double canoe consists of two side-by-side boats fastened by cross timbers,
    with a deck laid over the timbers and open spaces for bailing.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The weather-side boat is called the thama, and the leeward boat is called
    the kata.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Talingo's escape is explained as occurring when she came up after diving between
    the thama and kata, hidden from those on board by the deck planks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage reports twitching flesh in some Fijians under violent excitement
    and says priests are affected this way when a god enters them.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: An observed king who was also high-priest had flesh that twitched, quivered,
    and crept while the narrator's party spoke with him.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Convulsions occurring when priests' god enters them are called Kudru; the
    passage describes whole-body convulsion, twitching and crawling flesh, and a squeaking
    tone of speech among possessed priests.
  category: speech
  evidence_refs:
  - ev:7
