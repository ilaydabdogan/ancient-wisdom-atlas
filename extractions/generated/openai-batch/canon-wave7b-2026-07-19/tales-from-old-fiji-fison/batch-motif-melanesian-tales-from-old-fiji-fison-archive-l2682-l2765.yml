canonical_text:
  quote: ''
  summary: Lekambai rides on a turtle over the sea while keeping his eyes covered
    in obedience to the Sky-king's warning. Threatening and tempting voices from sea
    creatures, wind, waves, and a bird urge him to look up, but he refuses until the
    turtle reaches his home beach. His friends welcome him as one mourned for dead.
    In the reunion he forgets the turtle and the promised gifts for the Sky-king;
    townsfolk spear and kill the turtle for food. Lekambai laments the death of his
    friend and orders the cooking fire put out so the oven can become the turtle's
    grave.
  language: English
  quote_policy: summarized
