canonical_text:
  quote: ''
  summary: A boy, son of the Sky-King, defeats his father's enemies, then returns
    from the sky toward earth to seek a wife. After his descent to Fiji at Bengga,
    he conquers or subdues local gods and distributes land. At the Hill of Kauvandra,
    the great Serpent-god avoids battle by offering his daughter Lady Sweet-eyes in
    marriage. The heavenly slayer and the Serpent become the two greatest gods in
    Fiji.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Enemies address the Sky-King, say they are hungry, and ask him to come out
    so they may eat.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy orders that no one follow him, tells the others to stay in the town,
    takes his club, and rushes alone into the enemy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy strikes right and left, kills with every blow, and the enemy eventually
    flees.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the enemy flees, the boy sits on a heap of dead bodies and calls the
    townsfolk to drag the slain away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The townsfolk come out singing the Death-song, drag away forty-two bodies,
    and the lali wooden drum sounds the Dorua or Death-roll in the town.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The boy smites his father's enemies five times in all; they bring peace-offerings
    to the Sky-King and his rule extends over all the sky.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The lad remains with his father and grows into a great and tall youth; the
    passage recalls that he had climbed the ironwood tree and killed a big sky-man.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: When no fighting remains, the Child-that-challenges-men says he will go back
    to earth and seek a wife among human beings.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Sky-King approves his son's plan, kisses him, and weeps over him, though
    the narration says he is inwardly glad because he fears him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The ironwood tree has been swept away by a great flood, so the boy cannot
    descend by it; the manner of his descent is unclear, but he first lands in Fiji
    at Bengga.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Bengga people say two great tall men with white faces came with him, though
    the passage states that it is not known whether they helped him.
  category: other
  evidence_refs:
  - ev:5
- id: obs:12
  text: At Bengga, the local gods raise their people and fight him; he slaughters
    them, takes their land, and divides it between the white men and the King of Rewa.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: He goes from island to island, smiting gods and forcing them to make peace-offerings,
    until he reaches the Hill of Kauvandra where the great Serpent-god dwells.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The great Serpent-god comes out, asks why the two should fight, and offers
    his daughter Lady Sweet-eyes as a wife.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Slayer-that-came-from-Heaven marries the daughter of the great Serpent.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: He later goes to Bau and the kingdoms of Vanua Levu, fights the gods of the
    land, makes them servants, and is said to be one of the two greatest gods in Fiji
    along with the great Serpent.
  category: sequence
  evidence_refs:
  - ev:9
