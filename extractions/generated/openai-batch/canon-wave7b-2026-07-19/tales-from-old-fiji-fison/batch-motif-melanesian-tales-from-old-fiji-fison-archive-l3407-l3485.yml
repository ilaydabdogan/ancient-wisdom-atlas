canonical_text:
  quote: ''
  summary: The passage begins an origin tale titled as explaining how Samoans first
    got pigs. It describes an earlier time without pigs, fowls, or ducks in Samoa,
    Tonga, and Fiji, and a famine in Samoa after fish disappear, possibly because
    a great monster eats them. A mighty chief takes children for food. Kailufahe-tuugau,
    the Man of Luck, and his wife Faei-puaka have eight children; when their turn
    comes, messengers bring a whale's tooth to demand a child. The parents choose
    their seventh child instead of the youngest, prepare him for death with oiling,
    combing, a white cloth, kisses, and hand him over. Afterwards, the grieving mother
    finds the whistle of her dead son.
  language: English
  quote_policy: summarized
