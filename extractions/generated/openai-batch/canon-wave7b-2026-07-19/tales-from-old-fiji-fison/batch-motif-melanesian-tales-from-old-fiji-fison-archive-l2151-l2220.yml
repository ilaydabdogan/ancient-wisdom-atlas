canonical_text:
  quote: ''
  summary: The passage describes a sea migration in which some voyagers settle at
    islands, while the old chief urges the remainder onward. He consults Lady Langi,
    who identifies Thithia as the boundary of her father's land. At Thithia an old
    woman recognizes Lady Langi, who had been mourned as dead, and announces her return.
    The Thithia people rejoice and reward the Livuka men; the voyagers then receive
    similar gifts at Naiau and proceed to Lakemba, where five men are sent to report.
  language: English
  quote_policy: summarized
