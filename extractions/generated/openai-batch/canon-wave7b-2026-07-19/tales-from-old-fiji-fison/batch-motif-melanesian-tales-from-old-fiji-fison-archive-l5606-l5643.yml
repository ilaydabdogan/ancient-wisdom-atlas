canonical_text:
  quote: ''
  summary: Talingo, daughter of Takape, is selected from among frightened women and
    approaches the chief while holding her baby. As a club is raised to strike her,
    she leaps into the sea with the child, hides under the canoe, and is assumed to
    have been eaten by sharks. The chief then turns on Faha, blaming him for failing
    to strike her, and declares that Faha will be eaten instead.
  language: English
