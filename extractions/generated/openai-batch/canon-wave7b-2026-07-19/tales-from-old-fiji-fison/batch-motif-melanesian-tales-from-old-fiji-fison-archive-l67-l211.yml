canonical_text:
  quote: ''
  summary: Front matter and preface to Tales from Old Fiji. Fison describes the legends
    as genuine traditional skeletons retold in a native pattern, names several informants,
    comments on Fijian influence in stories involving Tonga and Samoa, gives historical
    notes on chiefs, and explicitly compares motifs in “The Beginning of Death” with
    Polynesian traditions of Bulotu and Maui’s fishing or island-raising.
  language: English
  quote_policy: summarized
