canonical_text:
  quote: ''
  summary: In the tale of how the Samoans first got pigs, the Cunning One rebukes
    the grieving woman and says the eaten one cannot be saved, but the living will
    live. At night the old wife unexpectedly has labor pains. Her husband fetches
    a midwife, who hears the Cunning One singing that one is dead but seven will be
    saved. Behind the screen the midwife hears squeaking and finds eight strange creatures.
    The Cunning One names them pigs, instructs the Lucky One to build an enclosure,
    and says they will become food for chiefs so the children may live. The continuation
    says the pigs multiply, are shared with others, replace cannibal eating, and are
    later given to visitors from Tonga who carry pigs onward, with the tale concluding
    that this is how the Samoans got pigs.
  language: English
  quote_policy: summarized
