candidate_motifs:
- id: motif:1
  label: Inaccessible return to the land of the gods
  taxonomy_refs:
  - afterlife_journey_map
  - return
  basis: The council sends a canoe to Bulotu seeking return to the land of the gods
    and release from death, but voyagers and later heroes fail to reach the island,
    which can fade from sight.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The voyagers are living petitioners rather than dead souls; the passage
    gives a sea approach and vanishing island, not a complete route-map.
- id: motif:2
  label: Sacred fire brought from otherworld and hidden in wood
  taxonomy_refs:
  - culture_hero
  - sacred_exchange
  basis: Maui sends Kiji-kiji with sacred fire from Bulotu, and Kiji-kiji places it
    in a tree so people can draw it out by rubbing wood.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage presents the fire as a divine gift, not as theft.
- id: motif:3
  label: Divine supporter of sinking land and earthquake aetiology
  taxonomy_refs:
  - culture_hero
  basis: Maui dives beneath the waters, holds up Tonga on his shoulders, and earthquakes
    are explained as Maui nodding in sleep until awakened by shouting, stamping, and
    beating the ground.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: Available taxonomy has no exact earth-bearer or earthquake-aetiology category.
- id: motif:4
  label: Afterlife transport by Death-canoe to a tormenting ruler
  taxonomy_refs:
  - afterlife_journey_map
  basis: All souls of the dead go to Hiku-leo when the Death-canoe brings them from
    earth and lands before his house, where escape is impossible.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage describes coercive transport and torment but not moral judgment
    or weighing of souls.
- id: motif:5
  label: Dangerous ruler restrained by unbreakable bond
  taxonomy_refs:
  - chaos
  - duality
  basis: Hiku-leo would destroy everything in Bulotu during rages if not checked by
    his two elder brothers using an unbreakable cord and knot.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The taxonomy references are approximate; the passage does not explicitly
    name chaos or cosmic dualism.
- id: motif:6
  label: Cosmic apportionment of sky, sea, and supported land
  taxonomy_refs:
  - ascent
  basis: Tanga-loa goes up to reign in the sky, Maui's brother rules the sea, and
    Maui remains beneath the waters holding the land.
  evidence_refs:
  - ev:5
