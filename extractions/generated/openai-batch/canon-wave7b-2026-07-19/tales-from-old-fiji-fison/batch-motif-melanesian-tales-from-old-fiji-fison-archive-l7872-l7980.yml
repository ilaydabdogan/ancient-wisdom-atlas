- id: ev:6
  type: summary
  locator: lines 7922-7938
  quote_or_summary: Maui hears Tonga's distress as the land sinks beneath the waves,
    possibly through the Tree of Speech; he dives beneath the waters and holds up
    the land on his shoulders. Earthquakes are attributed to Maui nodding in sleep,
    and people shout, stamp, and beat the ground to wake him.
