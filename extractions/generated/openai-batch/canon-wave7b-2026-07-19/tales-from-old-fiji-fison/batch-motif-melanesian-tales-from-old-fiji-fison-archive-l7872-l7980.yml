canonical_text:
  quote: ''
  summary: After Fifita, Moa, and a child are buried, the people in council build
    a canoe to seek Bulotu, pardon from Maui, return to the land of the gods, and
    release from disease and death, but the voyagers fail. The passage then describes
    Maui sending Kiji-kiji with sacred fire enclosed in a tree, Tanga-loa becoming
    sky king, an unnamed brother becoming sea ruler, Maui holding up the sinking land
    and explaining earthquakes, Hiku-leo ruling Bulotu and tormenting the dead brought
    by Death-canoe, and a sandpiper uncovering worms that become soulless slave-men
    under the sun. The narrating group asserts Tongan divine descent and superiority
    over earth-born peoples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A grave is dug for Fifita and Moa, and a child is laid on its mother's breast
    before the grave is filled with sand.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The council resolves to build another canoe so that some may sail to Bulotu,
    seek Maui's pardon, ask to return to the land of the gods, and ask that disease
    and death be removed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The canoe voyagers return weak and worn after hardship; they report storms,
    waves, monsters of the deep, and not seeing Bulotu.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Later heroes are said to search for the good land; some see it as a green
    island with hills, surf, and reef, but it fades away as they approach.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Maui sends his son Kiji-kiji with sacred fire from Bulotu; Kiji-kiji brings
    it to the land, shuts it inside a tree, and people obtain it by rubbing two pieces
    of wood together.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After bringing the fire, Kiji-kiji returns to his father and takes Ata-longa
    with him, and no one else.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tanga-loa goes up to the sky, reigns there as king, and draws aside a cloud-curtain
    so the sun, moon, and stars shine more clearly on the earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Maui's brother takes up residence in the sea and is its ruler.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: When Tonga begins to sink beneath the waves, Maui dives below the waters,
    takes the land on his shoulders, and remains holding it up; earthquakes are explained
    as Maui nodding in sleep, and people make noise to wake him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Hiku-leo becomes king of Bulotu and is described as delighting in tormenting
    souls of the dead brought from earth by the Death-canoe.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Death-canoe must land in front of Hiku-leo's house, and when Hiku-leo
    goes out he leaves his tail behind to watch in his place.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: Hiku-leo seizes souls of the dead, making some slaves and using others as
    posts, fence-stakes, and gate-bars.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Hiku-leo's two elder brothers restrain him with an unbreakable cord tied in
    an unloosenable knot; Tanga-loa holds one end in the sky and Maui holds the other
    beneath the earth.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: A sandpiper scratches in mud, uncovers foul worms, rejects them as food, and
    scatters them over the mud.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: After the sun shines on the scattered worms for many days, they grow into
    men, whom the gods in Tonga take as slaves.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage states that these slaves and white men have no souls, while the
    people of Tonga are children of the gods and inhabitants of Bulotu.
  category: speech
  evidence_refs:
  - ev:9
