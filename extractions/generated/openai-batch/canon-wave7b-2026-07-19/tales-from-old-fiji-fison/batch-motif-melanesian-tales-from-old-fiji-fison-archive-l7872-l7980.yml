- id: ev:7
  type: summary
  locator: lines 7939-7951
  quote_or_summary: Hiku-leo becomes king of Bulotu, delights in tormenting souls
    of the dead, and receives all souls brought from earth by the Death-canoe, which
    must land before his house; his tail watches when he leaves.
  source_text_path: texts/public-domain/fijian/project-gutenberg/tales-from-old-fiji-fison.md
  rights_note: Public domain source; summarized excerpt.
- id: ev:8
  type: summary
  locator: lines 7951-7964
  quote_or_summary: Hiku-leo seizes souls of the dead, making some slaves and using
    others as posts, stakes, and gate-bars. His elder brothers restrain him with an
    unbreakable cord and knot, one end held by Tanga-loa in the sky and the other
    by Maui beneath the earth.
  source_text_path: texts/public-domain/fijian/project-gutenberg/tales-from-old-fiji-fison.md
  rights_note: Public domain source; summarized excerpt.
- id: ev:9
  type: summary
  locator: lines 7965-7980
  quote_or_summary: A sandpiper scratches in mud, uncovers foul worms, rejects and
    scatters them; after the sun shines on them, they become men taken as slaves by
    the gods in Tonga. The passage says these slaves and white men have no souls,
    while Tongans are children of the gods and inhabitants of Bulotu.
  source_text_path: texts/public-domain/fijian/project-gutenberg/tales-from-old-fiji-fison.md
