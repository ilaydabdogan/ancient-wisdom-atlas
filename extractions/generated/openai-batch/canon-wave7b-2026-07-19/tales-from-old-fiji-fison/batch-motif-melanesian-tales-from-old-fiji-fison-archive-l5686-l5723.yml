canonical_text:
  quote: "“Our son, our true son, whom the gods have sent us over the sea”"
  summary: An old couple find a dead Tonga woman and child after a canoe wreck. As
    they prepare to bury them, the child opens his eyes and smiles. The woman takes
    the child, calls him her true son sent by the gods, and says their empty house
    will no longer be a cause for weeping. They bury Talingo on the beach, carry the
    boy to town, and tell neighbors he is their son sent over the sea by the gods.
    The child lives and thrives.
