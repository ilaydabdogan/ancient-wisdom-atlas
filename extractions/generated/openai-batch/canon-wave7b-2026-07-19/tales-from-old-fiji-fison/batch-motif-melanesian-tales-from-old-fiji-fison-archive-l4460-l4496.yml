canonical_text:
  quote: ''
  summary: 'The passage summarizes episodes from the exiles'' voyage: hunger, thirst,
    and hardship; Moala''s treacherous killing and Longa-poa''s annihilating retaliation;
    Pulu''s desertion with a young woman, his murder, and the consumption of his body;
    a retaliatory slaughter by the Tongans; the hungry voyagers'' killing of a sleeping
    whale; and a self-deifying boast that provokes the gods to plan the exiles'' death.'
