canonical_text:
  quote: ''
  summary: 'The passage first concludes the tale of how mosquitoes came to Oneata:
    Tuwara departs with the shellfish while the god of Oneata opens a basket that
    releases mosquitoes, after which the god fails to rid himself of them and later
    fails to recover the shellfish from Kambara. The passage then begins a tale about
    a fierce Tonga king whose double canoe is disabled by a sudden storm; when the
    exhausted crew has no food, the chief gives a coded order whose explained meaning
    is to kill one of the women so they may eat.'
  language: English
  quote_policy: summarized
