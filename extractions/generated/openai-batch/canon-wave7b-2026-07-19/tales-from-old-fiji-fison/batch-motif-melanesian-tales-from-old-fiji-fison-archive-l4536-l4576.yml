  quote: ''
  summary: At sea, Longa-poa's Tongan crew prepares to attack an approaching canoe,
    but the chief loses courage and turns the canoe into the wind. A laugh from the
    other canoe is recognized as Fekai's voice. Fekai taunts Longa-poa and his crew,
    orders her men to display their “gifts,” and the men brandish weapons. Longa-poa
    and his men then recognize that the other crew are bitter enemies, including Lutui
    and Mafi, because of earlier wrongs attributed to Longa-poa.
