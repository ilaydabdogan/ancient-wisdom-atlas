canonical_text:
  quote: ''
  summary: Rokola, chief of the Boat-builders, and his brother Kausam-baria kill the
    Great Serpent's dove. The Great Serpent grieves and curses the Boat-builders,
    transferring their kingdom and declaring they will be scattered as servants. The
    Boat-builders defy him and build a war-fence. The god throws his club into the
    sky, causing a deluge and rising sea that sweep away their fence and town; many
    drown, while others drift on trees, rafts, and canoes to mountain tops still above
    the water.
  language: English
  quote_policy: summarized
