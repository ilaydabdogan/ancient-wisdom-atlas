  summary: The passage describes the boy Matandua as beloved by his foster-parents,
    who thank the gods for the child brought by the sea and name him for his missing
    eye. Talingo lies in a beach grave washed by high tide. At night, men of Ono hear
    weeping on the shore; the boy responds in sleep with moaning and tears. His foster-mother
    wakes him, and he reports seeing and hearing a tall, noble, wet lady weeping over
    him, though the foster-mother says the tears are his own.
