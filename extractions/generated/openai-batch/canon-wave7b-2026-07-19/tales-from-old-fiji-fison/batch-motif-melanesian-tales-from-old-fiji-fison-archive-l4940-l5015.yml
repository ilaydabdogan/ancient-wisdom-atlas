canonical_text:
  quote: ''
  summary: A great bird carries Longa-poa away after a little old man warns him to
    plant a slip before sunrise and not to mistake whale-killing for godhood. At daybreak
    the bird lands near the king's town in Tonga-tibu. Longa-poa reunites with his
    son Vea and with the king, who had believed him dead. The town gathers to see
    the returned chief. Longa-poa notices the sun, hastily plants and fences the slip,
    then recounts what happened. The community rejoices at his return while also mourning
    the dead; the king mentions Fekai as gone and wonderful.
  language: English
  quote_policy: summarized
