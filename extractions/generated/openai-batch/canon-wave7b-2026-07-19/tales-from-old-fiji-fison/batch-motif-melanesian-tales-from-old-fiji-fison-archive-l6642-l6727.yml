canonical_text:
  quote: ''
  summary: A young chief and his allies kill a giant monster by blows and strangling
    with a turtle-net rope. A vampire-bat leaves and does not return. The fearful
    people in the thicket hear a victorious chant, see the young chief and Kalo-fanga
    returning with the giant's head on a fish-spear, and learn that the town has been
    burned around the giant's body. Tonga is said to be delivered from a scourge brought
    by the anger of the gods. The people repair the town, make the young chief King
    of Tonga, and he begins his reign with Tauki as his only wife.
  language: English
  quote_policy: summarized
