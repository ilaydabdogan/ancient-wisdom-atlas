canonical_text:
  quote: ''
  summary: Appendix notes describe a canoe party surviving after being carried over
    a reef; Bulotu/Burotu as an abode or island of gods and the blest; mortuary beliefs
    concerning a whale's tooth thrown at a pandanus tree on the way to Bulu; descent
    places into Bulu; bodily descent of some heroes; corpse-touch pollution; terms
    for spirits and ghosts; haunting by ghosts of the slain; ritual actions at death-sites;
    the Bau temple as a high place where a bokola is presented to gods; and preparation
    of a whole human body for baking.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A canoe was lifted over the surf into still shallow water, where the people
    stayed four days, ate raw fish, and were later picked up by another canoe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bulotu is identified as the abode of the Blest; Burotu is linked to another
    story, Samoan Pulotu is named as an island of the gods, and people of Kandavu
    are said to see Burotu from hilltops but no longer expect to find it.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A whale's tooth is placed in a dead man's hand so that he may throw it at
    a pandanus tree on his way toward Bulu; hitting or missing the tree affects whether
    his wife later dies and whether his ghost howls.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Thimba-thimba is named as the place where departed spirits go down into Bulu;
    each island is said to have one such place, and some Fijian heroes are believed
    to have gone down to Bulu bodily.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: A person defiled by touching a corpse is called yambo and is barred from touching
