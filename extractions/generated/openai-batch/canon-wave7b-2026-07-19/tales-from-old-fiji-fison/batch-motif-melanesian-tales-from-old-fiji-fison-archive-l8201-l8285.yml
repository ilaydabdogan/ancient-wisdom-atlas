- id: ev:9
  type: summary
  locator: lines 8255-8262
  quote_or_summary: At Nandi, people with grievances may dig up and eat a chief's
    body; to prevent this, official attendants remove the body and bury it secretly
    by night.
  source_text_path: texts/public-domain/fijian/project-gutenberg/tales-from-old-fiji-fison.md
  rights_note: public_domain
- id: ev:10
  type: summary
  locator: lines 8262-8268
  quote_or_summary: One attendant personates the chief under a mosquito curtain, speaking
    like a dying man, and later tells townsfolk that the chief was buried long ago.
  source_text_path: texts/public-domain/fijian/project-gutenberg/tales-from-old-fiji-fison.md
  rights_note: public_domain
- id: ev:11
  type: summary
  locator: lines 8270-8276
  quote_or_summary: The widow must follow her husband; at least one woman must accompany
    the dead man to wait upon him, and an old mother is sometimes chosen instead of
    a desired widow.
  source_text_path: texts/public-domain/fijian/project-gutenberg/tales-from-old-fiji-fison.md
  rights_note: public_domain
- id: ev:12
  type: summary
  locator: lines 8276-8281
  quote_or_summary: The doomed woman is told to expel her breath and signal by raising
    her hand; then the strangling-cord is tightened, a procedure said to hasten death
    and prevent suffering.
  source_text_path: texts/public-domain/fijian/project-gutenberg/tales-from-old-fiji-fison.md
  rights_note: public_domain
- id: ev:13
  type: summary
  locator: lines 8281-8285
  quote_or_summary: The widow ought to wear her best dress and ornaments; the sick
    and aged are sometimes buried alive with similarly described motives.
  source_text_path: texts/public-domain/fijian/project-gutenberg/tales-from-old-fiji-fison.md
  rights_note: public_domain
- id: ev:14
  type: summary
  locator: lines 8285-8289
  quote_or_summary: Cutting off the little finger is mentioned as a sign of mourning
    when relatives or great chiefs die.
  source_text_path: texts/public-domain/fijian/project-gutenberg/tales-from-old-fiji-fison.md
  rights_note: public_domain
- id: ev:15
  type: summary
  locator: lines 8290-8296
  quote_or_summary: The note on 'Cheating the Grandfather' says the custom is especially
    practiced in Vanua-levu, where descent is reckoned through the mother and the
    paternal grandfather is nearer to the child than the father.
