canonical_text:
  quote: ''
  summary: Appendix notes describe spirit-medium speech, chiefly burial customs, construction
    of chiefs' stone graves, the hereditary grave-digger's seclusion, hill-country
    shaft burial and alleged survival of cave-burial, protection of a chief's body
    by secret burial and impersonation, widow-strangling and live burial of sick or
    aged persons, and cutting off the little finger as mourning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Certain ritual speakers profess to be the mouthpiece of a god, proclaiming
    the god's name before delivering a message.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dead chief lies on a mat in the centre of the house, oiled and painted,
    with a whale's tooth in his hand.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The dead chief is expected to throw the whale's tooth at a baka tree on the
    road to Bulu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the dead chief hits the tree, he is said to be sure to be followed by his
    strangled wife; if he misses, he continues alone and complains that his kinsfolk
    left him alone on the way to Bulu.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Chiefs' stone graves are principally found in Eastern Fiji and are made from
    shaped coral slabs, with sea sand, flat stones from the reef, and coloured pebbles
    from the beach.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The office of chief's grave-digger is hereditary in a certain clan.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the funeral, the grave-digger is shut in a house, painted black from
    head to foot, covered by a mantle when outside, and treated as though invisible.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The grave-digger's food is brought after dark by silent bearers and placed
    just inside the doorway; his seclusion may last a long time.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In parts of the hill-country of Great Fiji, a chief is placed in a side drive
    from the main shaft when thought to be dying, with his head on a wooden pillow
    and food and water at the shaft bottom.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: When the food and water are unconsumed, the grave is filled up.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage reports that natives identify this hill-country burial as a survival
    of cave-burial from an earlier place where their ancestors lived before migration.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: In Nandi, persons with a grievance against a chief may dig up and eat his
    body; attendants may prevent this by taking the body away and burying it secretly
    at night.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: One attendant may impersonate the chief under a mosquito curtain, speaking
    like a dying man, and later indicate that the chief was buried long ago.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: A widow is described as required to follow her husband, and at least one woman
    must accompany the dead man to wait upon him.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: The doomed woman is instructed to expel her breath and signal by raising her
    hand; then a strangling-cord is tightened.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: The widow is expected to be dressed in her best clothing with all ornaments.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:17
  text: The sick and aged are sometimes buried alive, described in the passage as
    done with benevolent motives.
  category: action
  evidence_refs:
  - ev:13
- id: obs:18
  text: Cutting off the little finger is mentioned as a sign of mourning when relatives
    or great chiefs die.
  category: action
  evidence_refs:
  - ev:14
- id: obs:19
  text: The beginning of a note on 'Cheating the Grandfather' states that in Vanua-levu
    descent is still reckoned through the mother, making the paternal grandfather
    nearer to the child than the father under that descent rule.
  category: relationship
  evidence_refs:
  - ev:15
