- id: motif:3
  label: hereditary funerary specialist under seclusion and invisibility
  taxonomy_refs:
  - initiation
  basis: The chief's grave-digger holds a hereditary office, is painted black, shut
    in a house, veiled outside, supposed invisible, and fed silently after dark.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage does not explicitly call the seclusion an initiation; the
    taxonomy link is functional and should be reviewed.
