candidate_motifs:
- id: motif:1
  label: mapped journey of the dead with test at a tree
  taxonomy_refs:
  - afterlife_journey_map
  basis: The dead chief travels the road to Bulu and must throw a whale's tooth at
    a baka tree; the result affects whether his wife follows him.
  evidence_refs:
