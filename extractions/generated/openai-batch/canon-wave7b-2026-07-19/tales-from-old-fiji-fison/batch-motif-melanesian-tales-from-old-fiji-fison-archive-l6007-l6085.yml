canonical_text:
  quote: ''
  summary: A woman flees through the forest and leads pursuing young men into the
    pit they had dug for Matandua, the One-eyed one. Several pursuers die or are wounded;
    Big-body is lamed and renamed. Tausere tells his wife that the woman was Matandua's
    mother watching over him. That night a Tongan death chant is heard from the beach;
    Matandua laughs in his sleep as if holding a spear. An old blind man from Vavao
    recognizes the chant from a slaughter in Tonga, names it the Song of Death, and
    dies. Fear falls on the people, and the young men stop plotting against Matandua.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman runs through the forest, doubles back, comes onto the path behind
    her pursuers, and passes over the pit as if it were solid ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young men pursue her and forget the pit; Big-body and ten others fall
    into it, while those behind turn and flee back to the town.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The pit had been dug for the One-eyed one and contained sharp stakes planted
    at the bottom; three young men are killed outright and others are badly wounded.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: One stake tears Big-body's knee, leaving him permanently lame; people thereafter
    call him Loki-loki, the Lamester, rather than Yango-levu, Big-body.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Lord of Ono cries out that his son is dead and leads a great company through
    the wood to the mouth of the pit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Tausere whispers to his wife that it was Matandua's mother and that she watches
    over him; the two rejoice.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the night, when the moon is high, a singing voice is heard from the
    beach, chanting in the Tongan tongue; Matandua laughs in his sleep and shakes
    his hand as if holding a spear.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Vatui, later called Latui in the passage, is described as a man of Vavao who
    drifted to Ono years earlier in a large canoe driven from Tonga by a storm; he
    is now old, feeble, and blind.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: On hearing the chant, the old blind man rises, cries out about death, slaughter,
    and blood, and says he knows the chant from a day when warriors took a stronghold,
    slew people, and dragged bodies to ovens.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: After naming the chant The Song of Death, the old man sinks down with blood
    gushing from his mouth and dies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Great fear falls on the people, and the young men no longer plot against Matandua.
  category: sequence
