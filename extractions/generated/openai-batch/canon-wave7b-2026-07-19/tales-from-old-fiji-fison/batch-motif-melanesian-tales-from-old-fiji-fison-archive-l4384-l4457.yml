  summary: The exiles prepare food and water, sail away in a great canoe, and are
    encouraged by Longa-poa. A canoe-chant turns to grief over the lost homeland,
    but Longa-poa changes to a war-chant that restores the young men’s courage. They
    sail past the islands into open water, later reaching other lands and becoming
    accustomed to life at sea.
