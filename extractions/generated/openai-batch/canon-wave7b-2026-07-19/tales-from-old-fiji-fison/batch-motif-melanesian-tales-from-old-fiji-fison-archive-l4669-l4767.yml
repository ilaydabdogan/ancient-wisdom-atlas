canonical_text:
  quote: ''
  summary: Longa-poa wakes grieving for his dead men and longing to return to Tonga.
    Hungry and stranded, he searches an empty land for food and finds none. On the
    second night, a voice calls his name from above. He sees a tiny old man seated
    on a palm-leaf, with large fiery eyes, and understands him to be a god. The old
    man mocks Longa-poa for having claimed divinity after killing a whale, asking
    why he weeps, why he fled his wife Fekai, where his men are, and why his worshippers
    do not make him a feast. Longa-poa responds with fear, supplication, groans, silence,
    and inward anger.
  language: English
  quote_policy: summarized
