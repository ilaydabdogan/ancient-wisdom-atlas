canonical_text:
  quote: ''
  summary: A man sees two gods looking from a hollow stump and calls others. Young
    men use a mast stay as a running noose to catch the gods while the dance and song
    continue. The men of Livuka threaten to kill them. The gods offer, in turn, to
    become gods of houses, sailing, and war, but these offers are refused. They then
    offer to guide the people to the land of Ono. The men agree, bind the gods on
    a canoe, and threaten to eat them if they have lied. During the voyage, Ono is
    seen but appears to recede as they approach, and an old leper watches the bound
    gods.
  language: English
  quote_policy: summarized
