canonical_text:
  quote: ''
  summary: The passage is an introductory ethnographic discussion of Fijian terms
    for revenge, malicious injury, and witchcraft. It describes retaliatory crop destruction,
    collective punishment, removal of sick persons because of feared contamination
    of food and vessels, and several named practices in which reeds, clothing, personal
    traces, bundles, or a coconut are ritually used to cause disease or death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the Fijian language contains many words denoting malicious
    injury, hatred, and revenge.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Beti-mbeti and Namu-namu are defined as wanton destruction of food-plantations,
    used for private revenge, wartime destruction of enemy crops, and sometimes punishment
    of a whole tribe for one member's wrong-doing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the cited 1869 example, a high-ranking Rewa woman ran into the mountains
    with a common man from another tribe to vex her kinsfolk, who then damaged the
    man's tribe by destroying plantations, breaking canoes, and causing other damage.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Vaka-tasisiri and Veina-dui are defined as injuries prompted by envy of another
    person's prosperity.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage reports a missionary protest against thrusting sick persons out
    of dwelling-houses and putting them in small outbuildings such as yam-garners.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Vaka-sambiri is defined as expectoration on food, food-preparation vessels,
    dishes, water-pots, cups, or similar items, secretly done by sick persons in the
    belief that it will infect users with disease.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The sick are described as generally removed to an outhouse apart from the
    family dwelling as protection against Vaka-sambiri.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sauva is described as placing reeds or pointed sticks, after incantations,
    where they may wound a targeted man and transmit the disease with which the reed
    is believed to be charged.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nothata is described as infecting an enemy's dress by sorcery, including the
    end of a man's malo or a woman's liku; without a counterspell, death is said to
    follow.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Vaka-ndraunikau-taka is described as tying leaves with a target's hair, clothing
    shred, food leavings, or other belongings; the bundle may be cooked, buried, or
    hung in the forest, with wasting disease expected to result.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says draunikau leaves may also be placed beneath the doorstep
    or into the thatch of the victim's house, but this is considered less efficacious
    than the bundle method.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The cited account from Thomas Williams describes burying a ritually prepared
    coconut under the fireplace so that it represents the hated person, with the person's
    health expected to fail as the nut's life is destroyed.
  category: action
  evidence_refs:
  - ev:9
