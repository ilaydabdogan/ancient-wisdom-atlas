canonical_text:
  quote: ''
  summary: After Matandua protests that his aged father was struck without cause,
    the Lord of Ono publicly protects him. Matandua's enemies continue plotting secretly
    and burden Tausere's tiny household with full communal work shares, but Matandua's
    tasks succeed with Talingo's help. When a new large temple is ordered, a whole
    end is assigned to Tausere's household. Tausere and his wife despair and ask Matandua
    to kill them, but Matandua urges them to try once more and, if necessary, flee.
  language: English
  quote_policy: summarized
