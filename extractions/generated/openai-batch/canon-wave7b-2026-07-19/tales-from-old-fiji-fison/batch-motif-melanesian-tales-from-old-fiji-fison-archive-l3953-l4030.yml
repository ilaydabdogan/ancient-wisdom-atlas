  text: A figure called the Slayer-that-came-from-Heaven lands at Lakemba at night
    and is found on the beach by an old woman going to fetch salt water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Slayer asks the old woman to take him to the house of her lord, and she
