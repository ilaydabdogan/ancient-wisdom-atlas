  summary: The Slayer-that-came-from-Heaven arrives at Lakemba, is brought to Ratu-mai-na-koro
    at Tubou, challenges the reserved first-fruits bananas, defeats attackers, extends
    violence against resisting towns, receives submissions and offerings, is offered
    rule over the land, settles at Tubou, and has a son with Lady Sweet-eyes.
  language: English
  quote_policy: summarized
