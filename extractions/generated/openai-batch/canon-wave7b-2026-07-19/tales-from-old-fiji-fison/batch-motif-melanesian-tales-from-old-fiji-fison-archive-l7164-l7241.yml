canonical_text:
  quote: ''
  summary: Hiku-leo angrily curses Maui and the others as they prepare to leave Bulotu.
    The Tree of Speech warns Maui not to go because great evil will result, but Maui
    proceeds with his two sons and a chosen crew. Maui asks his brothers to remain
    behind to watch Hiku-leo, lest he harm the Tree of Speech or the Water of Life.
    Maui and his party launch a double canoe, sail far from Bulotu, and later lower
    the sail after crossing a great stretch of water.
