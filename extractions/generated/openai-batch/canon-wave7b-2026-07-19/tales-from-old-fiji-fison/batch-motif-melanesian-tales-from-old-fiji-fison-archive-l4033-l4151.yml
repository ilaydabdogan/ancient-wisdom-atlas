canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale explaining why the ruler bears the
    title Lord of Naiau rather than Lord of Lakemba: a heaven-associated ruler gives
    his kingdom to his son, conquers elsewhere, returns to his Sky-King father, receives
    worship, and is said to punish anyone who claims his former title. The passage
    then begins a tale in which Tongan people at Haapai plot unsuccessfully to kill
    a ship''s crew and seize the vessel; after the ship escapes and fighting breaks
    out among them, a priest consults the god Alo-alo. A cat emerges from the temple,
    is mistaken for a heavenly manifestation, and is honored with feasts. A Fijian
    named Dau-lawaki, called the Great Rogue, desires to eat the cat. A nighttime
    temple voice commands that the cat be delivered to the Fijian for eating, and
    the next morning the bound cat is brought before the assembled people while the
    priest summons Dau-lawaki.'
  language: English
  quote_policy: summarized
