canonical_text:
  quote: ''
  summary: 'Fifita tries to wake Moa and their child, then sees seaward canoes that
    the other gods cannot see: Moa and the child are in them, and one empty canoe
    is for him. Fifita dies beside Moa. A god falls into convulsions, and the voice
    of the Tree of Speech declares that those who left the Waters of Life are now
    subject to disease and death and commands burial of the dead.'
  language: English
  quote_policy: summarized
