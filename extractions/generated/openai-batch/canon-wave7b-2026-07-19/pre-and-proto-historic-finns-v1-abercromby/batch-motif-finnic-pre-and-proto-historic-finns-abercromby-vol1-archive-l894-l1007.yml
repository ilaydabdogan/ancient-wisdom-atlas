canonical_text:
  quote: ''
  summary: The passage describes the physique and movement of MokSan women and Mordvins,
    then discusses medieval reports about the Rus, Arthaniya, Slawia, and related
    towns. It reports scholarly attempts to identify Arthaniya with the Erza Mordvins
    or Biarmians, but the author argues that geographic evidence places Arthaniya
    far to the south, in or near Comania, rather than among those Finnic groups. The
    passage also summarizes Idrisi's and Ibn Batuta's geographical notices about Rus-related
    peoples, towns, hills, trade goods, and mines.
  language: English
  quote_policy: summarized
