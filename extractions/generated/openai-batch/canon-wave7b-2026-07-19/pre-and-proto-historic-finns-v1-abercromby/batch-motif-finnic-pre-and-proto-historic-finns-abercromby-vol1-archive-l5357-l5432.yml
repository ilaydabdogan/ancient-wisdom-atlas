  quote: ''
  summary: The passage summarizes notices about Slavs/Wends, Cudes/Esthonians, Variags,
    Finnic and Slavic groups, tribute, revolt, the summoning of Rurik and his brothers,
    military expeditions under Oleg, later conflicts involving Yaroslav, Vladimir,
    Ostromir, and brief remarks on the limited ethnographic information in the Chronicle.
  language: English
  quote_policy: summarized
