  text: Three years later, the named peoples refused to pay the tax, drove the Variags
    back across the sea, and attempted self-government.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Internal quarrels led a deputation of Cudes, Slavs, and others to ask the
