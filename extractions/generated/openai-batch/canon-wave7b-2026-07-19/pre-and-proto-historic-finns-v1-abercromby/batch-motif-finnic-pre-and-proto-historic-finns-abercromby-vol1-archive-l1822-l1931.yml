canonical_text:
  quote: ''
  summary: The passage moves from a craniological table to an argument about contact
    between Livs, Letts, Letto-Lithuanians, Finns, and Esthonians. It describes Liv
    raids on Letts, the killing of men, and the carrying off of women and children
    as prisoners; the author interprets this as producing blood mixture and Finnicisation.
    It then argues from skull evidence and ethnonyms that Esthonia had an earlier
    Letto-Lithuanian-related population which was later absorbed by Finns, who inherited
    the name associated with Aistii/Estas/Eistir.
  language: English
