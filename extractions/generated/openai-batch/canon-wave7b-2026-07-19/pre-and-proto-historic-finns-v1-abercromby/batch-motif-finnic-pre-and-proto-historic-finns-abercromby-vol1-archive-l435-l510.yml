  quote: ''
  summary: A historical-geographical discussion of Permian, Finnish, Zirian, and Ugric
    populations in north-eastern European Russia, using place-names, river names,
    archaeological finds, chronicles, tribute records, warfare, missionary activity,
    and later documentary evidence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Permian place-names are reported in the Pinega and Dvina regions, while Finnish
    and Permian names are said to occur side by side in the Lower Dvina region.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The southern boundary of the Permians is described as difficult to fix; toward
    the east, the passage states that traces are absent south of the Silva or the
    Volga.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some river names in the governments of Kostroma, Vladimir, and Moscow are
    presented as possibly Permian, but the passage cautions that endings such as -ma
    and -va are unsafe as sole evidence for ethnic boundaries.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: A bone arrow-head, metallic brooches, beads, and other objects found at the
    prehistoric fort of Didkovo near Moscow are compared with grave finds from Viatka,
    Perm, and Kazan.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: Several rivers in eastern Vologda are said to have two names, including non-Zirian
    names alongside Zirian equivalents such as Vitegda/Ezva and Vim/Yemva.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Nestor is said to mention Ugrians with Petérans and Yems in north-eastern
    European Russia by the end of the eleventh century, placing them in Japhet's portion
    rather than Shem's portion.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: In 1185, Ugrians are described as living on the Petéra and, with the Petérans,
    paying tribute to Novgorod.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the fifteenth century, Voguls and Ostiaks are said to have carried on constant
    war with Permians and Russians.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In 1445, Novgorodans are said to have been beaten by Ugrians through treachery.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Ten years after 1445, Voguls are described as fighting on the Vitegda and
    killing the missionary bishop Pitirim at Ust-Vim after he had converted certain
    Voguls to Christianity.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage states that documentary evidence proves Voguls lived permanently
    near Ust-Vim and did not merely make raids from beyond the Urals.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: As Russians advanced eastward, they continued to encounter Voguls; Andrew
    Misnev defeated Voguls below Cérdin in 1481.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: A document of 1607 is said to show that Voguls along the Viśera paid tribute,
    later found tribute difficult to pay, dispersed, and some crossed into Siberia.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Ostiaks are said to have nomadized where the town of Perm later stood, possessed
    the whole Cusovaya, and were mentioned in the district of Cérdin.
  category: setting
  evidence_refs:
  - ev:5
