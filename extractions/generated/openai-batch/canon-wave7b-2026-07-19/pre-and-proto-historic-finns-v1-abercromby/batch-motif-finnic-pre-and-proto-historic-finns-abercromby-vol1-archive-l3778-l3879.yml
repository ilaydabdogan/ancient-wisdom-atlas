  summary: The passage describes archaeological finds from Andnino and from ossiferous
    forts along the Kama and Viatka rivers, emphasizing bone tools and ornaments,
    limited metalworking, animal-head bone carving, a carved animal on a perforated
    stone disk or whorl compared with an Andnino bronze bit cheek-piece, and pottery
    differences used for chronological comparison.
  language: English
  quote_policy: summarized
literal_observations:
