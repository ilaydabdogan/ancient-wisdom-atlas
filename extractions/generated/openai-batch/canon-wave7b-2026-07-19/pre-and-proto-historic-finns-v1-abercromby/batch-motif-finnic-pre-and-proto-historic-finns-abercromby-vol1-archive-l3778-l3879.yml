  text: A schematic animal form is described as having a parallelogram body, four
    vertical lines for legs, and a tail made by extending the hindmost leg.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bone arrowheads, flint implements, and two partly polished whitish flint gouges
    are reported from graves, though the gouges may belong to an older neolithic station
    beneath the cemetery.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A series of prehistoric forts along the Kama and Viatka region is described
    as having instruments and ornaments made almost entirely of bone.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The inhabitants of the forts are described as chiefly hunters and partly pastoral,
    and the forts are called ossiferous because of the great accumulation of bones
    within them.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage lists animal bones from the forts, especially reindeer, elk, horse,
    bear, and beaver, with other animals, birds, and fish less frequent.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Most archaeological objects from the forts were bone objects such as battle-hammers,
    arrow-heads, knives, knife-handles, spoons, awls, fish-hooks, needles, combs,
    beads, and playthings, though bronze, copper, and iron were also present.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: A celt mould and clay crucibles are said to show that metallurgy was understood,
    though little practiced because metal was scarce.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ornaments included bear teeth, small knuckle-bones, perforated bone beads,
