canonical_text:
  quote: ''
  summary: The passage describes Neolithic archaeological finds east of the Volkhov
    and around the south-eastern shore of Lake Onega and nearby lakes and rivers.
    It lists stone, flint, clay, and bone artifacts; notes pottery decoration; mentions
    instruments ornamented with elk and bear heads; and reports animal bones, including
    seal bones, used to infer earlier lake conditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Articles of human industry were found in peat on dried-up lake sites and in
    sand and clay on existing lake shores and river valleys east of the Volkhov and
    around south-eastern Lake Onega; no human remains were found with or near them.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Arrow-heads were made of flint and were abundant, with lancet- or almond-shaped
    types and workmanship ranging from coarse to fine.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Knives and scrapers were made of flint, while axes, hammers, chisels, and
    gouges were usually made of hard clay slate, diorite, greenstone, or quartzite.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some axe forms are described as like examples in Finland and at KartaSikha
    on the Volga, and a narrow gouge type is also said to occur at KartaSikha.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Later polished and perforated axe hammers and round hammers were found on
    the Kinema river and in a few other places in Olénets.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Two instruments from Olénets are reported as ornamented respectively with
    an elk head and a bear head in relief.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The pottery clay was mixed largely with sand, and at Lake Tud a strong fibrous
    mineral was added; no complete vessels were found, so their original shapes are
    undetermined.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Pot exteriors bore diagonal parallel rows of squarish comb-like impressions,
    sometimes separated by belts of small pit-holes, and sometimes impressed lines
    or furrows formed a zigzag around the rim.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The pottery ornament is stated to resemble ornament found in Finland and at
    the Ladogan station.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'A single bone instrument is reported: a six-inch lance-head found at the
    mouth of the river Kinema.'
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Near pottery sherds at the mouth of the Tikhmangia, broken bones of beavers,
    elks, reindeer, birds, fish, and a large seal breed were found.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The author infers from the seal bones that when Neolithic people lived by
    the river, large seals were present in the lake and the lake was larger and deeper
    than in the author's time.
  category: relationship
  evidence_refs:
  - ev:6
