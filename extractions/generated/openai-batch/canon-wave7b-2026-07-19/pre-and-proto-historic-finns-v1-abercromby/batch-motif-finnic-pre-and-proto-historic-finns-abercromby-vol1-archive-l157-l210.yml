canonical_text:
  quote: ''
  summary: The passage gives a geographical and historical account of western Finnic
    populations. It describes Finns of Finland as divided into Tavastlanders and Karelians,
    notes Swedish-speaking coastal inhabitants and the limited presence of Lapps in
    the Grand Duchy, and summarizes earlier wider Finnic or Karelian distribution
    through accounts of Qvens, Beormas, place-names, raids, waterways, and migration
    to Ingria.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Finns of Finland are said to call themselves Suomafaiset and to be broadly
    divided into Tavastlanders and Karelians.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tavastlanders are described as occupying south-west Finland, while Karelians
    occupy northern and eastern areas and extend eastward toward Lake Onega and northward
    to the White Sea.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Swedish-speaking coastal fringe is described along the west and south coasts,
    forming about fourteen percent of the population and mostly descending from Swedish
    settlers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that there is no natural northern boundary between Finns
    and Lapps, but that Lapps are then found within the Grand Duchy only around Lake
    Enare.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says Finns formerly covered a larger area and cites Ohthere’s
    account to King Alfred that Qvens, identified parenthetically as a Karelian tribe,
    lived in northern Sweden in the ninth century.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Qvens are described as using light portable boats and long narrow lakes to
    travel inland, crossing the Fells, and raiding Northmen, who sometimes retaliated.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The old Qven name is said to survive in the Kalix river, known to Finns as
    Kainuhunjoki or the Qven river.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: At the mouth of the Northern Dvina, Ohthere is said to have found a people
    called Beormas, generally believed to have been Karelians.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Place-name evidence attributed to Sjogren is said to show former Karelian
    residence in parts of Archangel, including the Northern Dvina mouth, Senkursk,
    Pinega, and Mezen areas, and the south coast of the White Sea is said to have
    been called the Karelian coast by Russians in the fifteenth century.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Three small Karelian groups are said to be found in Ingria and are believed
    to have migrated from Finland around the end of the eleventh or beginning of the
    twelfth century.
  category: sequence
  evidence_refs:
  - ev:10
