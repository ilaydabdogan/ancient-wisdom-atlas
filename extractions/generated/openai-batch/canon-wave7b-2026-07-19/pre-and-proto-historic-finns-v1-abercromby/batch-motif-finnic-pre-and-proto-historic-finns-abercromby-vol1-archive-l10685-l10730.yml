canonical_text:
  quote: ''
  summary: The passage surveys Finnish magical and mythic references in which Kivutar,
    Vainamoinen, Vaino's daughter, and related objects or places are invoked for healing,
    war protection, boat-making by magic song, and associations with northern lands
    of wizardry.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kivutar, described as sickness and pain personified as a woman, is invoked
    to take a plume from the Creator's mouth or a feather from Vainamoinen's belt
    to sweep away pains and sores.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A soldier going to war prays for old Vainamoinen's cloak and for the mantle
    of the distant Lapp; the passage states that the latter expression means a wizard
    in this instance.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author states that several cures or protections are expected from external
    means independent of Vainamoinen's magic song.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Old Vainamoinen, called a reliable diviner as old as time, is invited to raise
    his paddle or sword from the sea and destroy abscesses and scabs on a human body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Vainamoinen is asked to clip wool from a stone and hair from a rock, and to
    make a war shirt in which a soldier can fight safely.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Vainamoinen is asked to take a bath-switch and a honied wing from his belt
    to sweep a sufferer's fearful pains away to the land of Lapps.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Vainamoinen makes a boat from fragments of an oak by singing a series of magic
    songs, one for each part of the boat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In another passage summarized here, the outside chip of a gigantic oak, struck
    with an axe, flies into the sea and serves as a boat for Vainamoinen the singer.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Vainamoinen is also known as Vaine or Vaino, and his daughter is coupled with
    Kivutar, the Pain-maiden, because both are helpful in removing pains and diseases.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A soldier begs Vaino's girl, described with golden ornaments, a copper petticoat,
    and a silver belt, to dash water on the pan of a touch-hole so that his enemy's
    gun will not go off.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The home called Vainola is collocated with Pohjola, Ulappala, Lapland, or
    Turja, and the passage explains this by saying the far north was pre-eminently
    the land of wizards, sorcerers, and magic.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: Vainamoinen appears as a warrior and the old son of Kaleva when he sharpens
    his spears and arrows before battle and tests his sword against an iron hill.
  category: action
  evidence_refs:
  - ev:9
