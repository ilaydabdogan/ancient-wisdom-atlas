  category: object
  evidence_refs:
  - ev:7
- id: obs:16
  text: Ilmarinen is asked to forge a sword, pikes, and spears for a soldier going
    to war.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: A best-man boasts that Ilmarinen shod the horse that carried him to woo girls
    in Hiisi’s castle.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:18
  text: An exorcist threatens to place Tuoni’s grub, glossed as generally meaning
