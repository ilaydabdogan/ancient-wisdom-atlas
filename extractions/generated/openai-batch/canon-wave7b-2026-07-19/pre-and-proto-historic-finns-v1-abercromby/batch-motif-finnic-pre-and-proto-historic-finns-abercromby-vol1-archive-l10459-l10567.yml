canonical_text:
  quote: ''
  summary: The passage describes Ilmarinen as an older Finnic air, sky, weather, and
    storm divinity who later became best known as a divine smith. It surveys comparative
    names, Sámi borrowing and drum depictions, Agricola’s notice, exorcistic and charm
    uses, fire and lightning origins, rowing in a red boat, divine forging of ritual
    implements and weapons, production of copper and iron, and a tale in which Ilmari
    overcomes personified frost by fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ilmarinen is presented as connected with air and weather and as an old air
    and sky god of the Finns.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage compares Ilmari formally with Votiak Inmar and notes meanings
    involving god, sky, or heaven in related terms.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Lapps are said to have borrowed the name as Ilmaris and sometimes to have
    drawn his portrait on magic drums.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Sámi drum context described here, Ilmaris is not regarded as a smith
    but as a god able to produce storms and bad weather.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bishop Agricola is reported as describing Ilmarinen as a Tavastlander god
    who made calm and weather and led travellers forward.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The author proposes that the smith character developed by analogy between
    hammer, anvil, sparks, thunder, and lightning.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says Ilmarinen’s thunder and storm aspect continued under the
    newer appellation Ukko, the old man.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Ilmarinen, Vainamoinen, and an aerial god are invoked by an exorcist to crush
    a malady personified as the evil spirit Hiisi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Fire is said to have originated from a spark struck in the sky by Ilmarinen
    and Vainimoinen, after which it fell to earth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A riddle identifies Ilmarinen striking fire and Vainamoinen causing a flash
