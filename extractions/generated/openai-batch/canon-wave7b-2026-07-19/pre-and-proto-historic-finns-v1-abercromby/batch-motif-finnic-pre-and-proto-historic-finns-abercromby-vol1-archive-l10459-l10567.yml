comparison_claims:
- id: claim:1
  claim: The passage makes a linguistic and semantic comparison between Finnic Ilmari
    and Votiak Inmar, with related meanings involving god, sky, or heaven.
  claim_level: linguistic_similarity
  target: Votiak Inmar and related god/sky terminology
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to the formal and semantic comparison reported
    in this passage; it does not by itself establish a shared narrative motif.
- id: claim:2
  claim: The passage compares the god-and-sky semantic range of Ilmari/Inmar-type
    terms with Altai Turkish tängri, which is said to signify both god and sky.
  claim_level: linguistic_similarity
  target: Altai Turkish tängri as god and sky
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a semantic comparison in the author’s discussion, not evidence
    of direct historical borrowing or a shared mythic episode.
- id: claim:3
  claim: The passage states that the Lapps borrowed Ilmarinen’s name as Ilmaris and
    adapted him as a storm and bad-weather god on magic drums.
  claim_level: historical_contact
  target: Sámi/Lappish Ilmaris drum figure
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The passage asserts borrowing but gives only a brief summary and does
    not provide the drum images themselves.
- id: claim:4
  claim: The passage treats Ukko as a newer name under which Ilmarinen’s thunder and
    storm-spirit aspect continued.
  claim_level: same_function
  target: Ukko as thunder and storm spirit
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is about continuity of function as reported by the author;
    the passage does not give an independent Ukko narrative.
- id: claim:5
  claim: The passage notes that the episode in which frost is subdued by fire is related
    in the Kalevala of Ahti rather than Ilmari.
  claim_level: same_motif
  target: 'Kalevala Runo 30, 174: Ahti and Pakkanen episode'
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison depends on the passage’s brief citation and does not
    reproduce the Kalevala episode.
