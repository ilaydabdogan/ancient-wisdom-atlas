  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Ilmarinen, Vainamoinen, and Lemminkainen are mentioned as rowing in a red
    boat toward the north; Ilmarinen takes the bow oar and Vainamoinen steers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The red-boat episode is recited as a charm by persons travelling by water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: In later instances in the passage, Ilmarinen appears as a smith and is appealed
    to as a divinity rather than as an earthly man.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: Ilmarinen is asked to forge imaginary weapons and instruments whose assumed
