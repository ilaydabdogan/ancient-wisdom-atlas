canonical_text:
  quote: ''
  summary: The passage surveys Finnish earth spirits and earth-associated beings invoked
    for aid, exorcism, travel, labor, sleep, vegetation growth, and disease explanations.
    It then describes Pellervoinen or Sampsa Pellervoinen as a vegetation and sowing
    spirit, including an Ingria song in which Sampsa sleeps while crops fail, rejects
    Winter-lad, and rises for Summer-lad, whose coming restores leaves, catkins, and
    blood.
  language: English
  quote_policy: summarized
