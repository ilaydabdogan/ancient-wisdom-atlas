    Russian colonists in Vologda are said probably to have caused this eastward migration.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Permians and Zirians are treated as nearly one people because their languages
    are mutually intelligible and both call themselves Xoms.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Permian is more strictly applied to people on the right bank of the Upper
