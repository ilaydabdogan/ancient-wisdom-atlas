  summary: The passage discusses inferred historical territories and migrations of
    Finnic and neighboring peoples, using place-names and river-names as evidence.
    It treats the Ceremis, Votiaks, Permians, and Zirians in relation to neighboring
    groups, Russian colonization, and geographic regions around rivers such as the
    Sura, Vetluga, Volga, Kama, and Ob.
