- id: obs:5
  text: The Votiaks are said to call themselves Ud-murt or Urt-murt and to occupy
    territories east of the Vidtka and in other named districts; those in Ufa are
    described as newcomers from the Kama no earlier than the sixteenth century.
  category: attribute
  evidence_refs:
