canonical_text:
  quote: ''
  summary: 'The passage discusses attempts to locate the Phinnoi/Fenni and explains
    far-west reports by hypothesizing hunting or predatory excursions. It then describes
    Aistii/Estas geography, social drinking customs, and funeral practices: delayed
    cremation, prolonged feasting, racing for property lots, and burning the corpse
    with weapons and clothing.'
  language: English
  quote_policy: summarized
