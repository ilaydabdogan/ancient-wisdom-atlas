canonical_text:
  quote: ''
  summary: The passage surveys Finnish charms that curse envious onlookers, spell-repeaters,
    sorcerers, warlocks, disease spirits, frogs, and bears; charms that flatter spirits,
    diseases, animals, and steam; and offerings or exchanges made to divinities, forest
    powers, Para, Water, and other beings for hunting luck, healing, or appeasement.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Curses against envious or prying people wish injury or obstruction to their
    eyes, faces, mouths, jaws, tongues, heads, sight, and hearing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A withered, iron-branched fir-tree is wished to grow before an envious person's
    house and hold that person's eyes until release.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A bloody cloak of Huisi, described as requiring five men to lift, is wished
    to be bound around the heads of jealous and prying people so that they cannot
    see or hear.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: People who repeat private spells or use bewitchment are cursed with damage
    to the tongue, mouth, and hair.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Necromancers, warlocks, and a disease spirit are consigned or banished to
    named rapids and threatened with sleep, bodily overgrowth by grass, or punishment
    by Ukko with needles or iron hail.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Sorcerers, witchcraft users, diviners, and strong men are wished to perish
    through their own arrows, knives, steel tools, or strength, and spells are wished
    to return to their homes and be cast upon the spell-casters' own families.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A frog is threatened with smashed limbs and marrow extraction for ointment,
    and a forest bear is wished choked with a honey ball so its jaws, teeth, and tongue
    cannot move freely.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Some charms use flattering or affectionate address for Kalma, Gout, Kivutar,
    Vammotar, a hornet, a snake, an ermine, and Steam.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that Finns made offerings to divinities for benefits and
    to harmful spirits to induce them to desist.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Hunters and trappers offer or exchange gold and silver with forest deities
    and forest rulers; the offered metals are described as old as the moon and sun
    or as silver brought from battle.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: Food, animal, blood, salt, sea, and fat offerings or exchanges are described
    in charms involving Kuippana, Tapio, Para, Water, Water's mistress, and chaff
    in the eye.
  category: action
  evidence_refs:
  - ev:7
