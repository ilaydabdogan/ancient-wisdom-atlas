canonical_text:
  quote: ''
  summary: The passage summarizes West Finnish charms and belief-notes about personified
    female beings connected with fire, pain, sickness, wounds, and swellings. It describes
    the birth and quenching of Fire, invocations of fire maidens to use cold substances
    and other means against burns, and several named pain or sickness maidens who
    collect, contain, boil, spin, sweep, pack, or cast afflictions into holes, stones,
    water, trees, or receptacles. It ends with origin accounts in which pain-related
    beings are connected with inflammatory wounds, a snake, and snails.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fire is described as the offspring of Hoyhenes or Hdyhenes of the Panutars
    and of Lemmes of the Lentohatars, with the child born in the sea.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The birth-giver could not hold or touch the child and from this recognized
    that the child must be fire.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hoyhenes or Hdyhenes is invoked with Nunnus to bring frost and ice so an exorcist
    may handle fire without harm.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Panutar is asked to quench a fire by putting it into her clothes and keeping
    it safe there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: An anonymous Maid of Fire is asked to extinguish Fire, repair Panu’s work,
    bring frost, ice, and iron hail for burns, and if needed use a heifer’s hide against
    Fire or Panu.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kivutar is described as a kindly and benevolent personality despite being
    called the Maid of Pain and Sickness.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kivutar has a kettle and the daughter of Vaino has a pot in which pains are
    boiled on the Hill of Pain and then flung into a deep hole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The maid of Kipula sits on a speckled stone, spins pains on a copper spindle,
    winds them into a ball, and hurls them into the sea.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kivutar and Vammotar are asked to sweep wounds away with a feather, place
    them in a glove, enclose the glove in a stone on the Hill of Pain, and roll it
    into the sea.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Kivutar is also asked to see sufferings in a human body, wrap them in a bundle,
    and throw them into a mountain cleft, blue stone, or liver-coloured chink.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Kirsti sits on a stone of pain where three rivers flow, works with the stone
    and hill of pain, and is asked to gather pains into a stone hole and roll them
    into the water.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: An exorcist wishes pains to be sent into the cup of Kivutar, the box of Vammotar,
    the bed of Vaivatar, or the pillow of Paivatar.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Kullatar, the Maid of Swellings, is asked to pack up and remove swellings
    or monstrous things to an apple or oak tree.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: An old mother of Pains and mistress of the Hill of Pain is asked to test ointments
    and anoint a sick man’s wounds.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: In origin accounts, an old wife or daughter of pain and sickness is treated
    as evil; inflammatory wounds come from fire that fell from a fiery horn carried
    by Kivutar.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: A daughter of Pain and daughter of Death becomes pregnant by an east wind
    and gives birth to a snake; a daughter of Pain and Tuoni’s son are parents of
    snails.
  category: sequence
  evidence_refs:
  - ev:13
