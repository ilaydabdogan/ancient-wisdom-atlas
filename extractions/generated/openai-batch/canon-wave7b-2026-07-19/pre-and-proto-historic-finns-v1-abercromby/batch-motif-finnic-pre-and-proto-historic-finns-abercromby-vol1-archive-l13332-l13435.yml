  summary: The passage surveys examples from Finnic magic songs and charms in which
    animals, trees, rocks, divine or supernatural figures, and cited precedents are
    invoked for healing, exorcism, protection, legal aid, herding, hunting success,
    bread rising, blessing, and cursing.
