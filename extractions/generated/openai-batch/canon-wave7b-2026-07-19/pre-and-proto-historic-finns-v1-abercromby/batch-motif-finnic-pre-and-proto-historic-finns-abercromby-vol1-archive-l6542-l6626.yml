candidate_motifs:
- id: motif:1
  label: Shamanic journey to the land or house of the dead
  taxonomy_refs:
  - afterlife_journey_map
  basis: The Lapp wizard may journey to Jabmi aimo, and during trance his spirit travels
    to Saivvo or Jabmi aimo.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: high
  cautions: The passage is a secondary ethnographic summary and uses variant spellings;
    it does not provide a first-person myth narrative.
- id: motif:2
  label: Appeasing or negotiating with the dead for the living
  taxonomy_refs: []
  basis: The wizard appeases the inhabitants of the dead, prevents pursuit of a sick
    man, and later reports arrangements made with the dead.
  evidence_refs:
  - ev:2
  - ev:8
  confidence: high
  cautions: The exact nature of the arrangements is not specified in the passage.
- id: motif:3
  label: Animal helper as spirit-travel vehicle or messenger
  taxonomy_refs: []
  basis: The wizard summons a saivvo bird to bring beings from the other region and
    travels on the saivvo fish or snake during trance.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: high
  cautions: The passage gives fish or snake as an alternative form and does not explain
    whether this is a stable species identity or textual/terminological variation.
- id: motif:4
  label: Drum-induced divination and trance
  taxonomy_refs:
  - wisdom
  basis: The wizard uses a drum as a divining apparatus, summons spirits while striking
    it, and later gives oracular directions.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:8
  confidence: medium
  cautions: The taxonomy reference is broad; the passage supports divination and oracle-giving
    but not a developed wisdom myth.
- id: motif:5
  label: Ecstatic ritual ordeal before soul travel
  taxonomy_refs: []
  basis: The wizard fasts, performs violent exertions, handles hot ashes, strikes
    himself with an axe, and falls into a swoon understood as the time of spirit-travel.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage reports ritual actions without explaining their internal symbolism.
- id: motif:6
  label: Ancestor or dead shaman as helper spirit
  taxonomy_refs: []
  basis: The Lapp saivvo helpers are interpreted as possibly deceased ancestors; Altaian
    ancestor spirits mediate for wizards; and the Jakut emekhet is generally a defunct
    shaman.
  evidence_refs:
  - ev:14
  - ev:15
  - ev:16
  confidence: medium
  cautions: The passage itself includes qualifications for the Lapp material and says
    not all Saivvo people are human spirits.
comparison_claims:
- id: claim:1
  claim: The passage supports a cautious same-function comparison between Lapp saivvo
    helpers, Altaian Turk ancestor intermediaries, and Jakut emekhet spirits as helper
    beings connected with the dead or ancestors who assist wizards.
  claim_level: same_function
  target: Ancestor or defunct-shaman helper spirits in Lapp, Altaian Turk, and Jakut
    wizard traditions
  evidence_refs:
  - ev:14
  - ev:15
  - ev:16
  counter_evidence_refs:
  - ev:11
  - ev:14
  confidence: medium
  limitations: The passage explicitly marks uncertainty for Samoyed and Ostiak helper
    spirits and qualifies the Lapp identification by noting that Saivvo people were
    not wholly composed of human spirits.
- id: claim:2
  claim: The Altaian Turk and Jakut examples are presented as nearby comparative cases
    for wizard-helper spirits rather than as evidence of historical contact or common
    inheritance.
  claim_level: same_function
  target: Altaian Turk am with ancestor intermediaries and Jakut ojus with emekhet
    helper spirit
  evidence_refs:
  - ev:15
  - ev:16
  counter_evidence_refs: []
  confidence: high
  limitations: The passage does not provide chronological, linguistic, or transmission
    evidence, so stronger historical claims are unsupported.
