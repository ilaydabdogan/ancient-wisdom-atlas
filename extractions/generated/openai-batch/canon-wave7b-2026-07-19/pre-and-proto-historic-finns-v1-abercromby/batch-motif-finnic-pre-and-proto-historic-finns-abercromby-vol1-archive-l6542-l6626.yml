canonical_text:
  quote: ''
  summary: The passage describes Lapp wizard practices involving drum-divination,
    summoning helpful saivvo spirits, ecstatic ritual actions, spirit-travel to Saivvo
    or Jabmi aimo, dealings with the dead, and oracular reporting after return. It
    also summarizes Votiak seers and exorcists, Lapp beliefs about saivvo people as
    tutelary or ancestral spirits, and cautiously compares ancestor-helper spirits
    among Altaian Turk and Jakut wizards.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In important matters, Lapps summoned a wizard who used a drum as a divining
    apparatus to explain the gods' will and answer questions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lapp wizard was said to be able to journey to Jabmi aimo, the house of
    the dead, to appease its inhabitants or to obtain help involving a sick man or
    a deceased relative.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wizard struck his drum and sang loudly while summoning saivvo followers
    or helpful spirits, including a saivvo bird and a saivvo fish or snake.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: During the ceremony the wizard removed his cap, loosened his belt, placed
    his hands on his face, knelt, swayed, and moved rapidly on his knees while holding
    the drum.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The wizard cried out commands to harness the reindeer and launch the boat.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The wizard handled hot ashes from the fire with bare hands, drank brandy,
    struck his knee with an axe, and finally fell into a swoon after fasting and violent
    exertion.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: While the wizard was in the swoon, no one was allowed to touch him because
    his spirit was described as travelling on the saivvo fish to Saivvo or Jabmi aimo.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: After reviving, the wizard reported what he had seen, described arrangements
    made with the dead, and announced what should be done in an oracular manner.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Among some Votiaks, the seer chose sacrificial animals, indicated sacrifice
    sites for each god, and identified the cause or agent of illness; he was respected
    in some places and despised in others.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A Votiak exorcist pronounced exorcisms while accompanying the words with blowing.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: For Samoyedes and Ostiaks, the passage states uncertainty about who or what
    the spirits were that assisted and protected wizards.
  category: other
  evidence_refs:
  - ev:11
- id: obs:12
  text: Among the Lapps, saivvo people were described as living in a saivvo home close
    beneath the ground, and souls were believed to pass into saivvo aimo after death.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:13
  text: The inhabitants of saivvo aimo were said to live like people on earth but
    with greater prosperity and happiness, and they became guardian spirits of the
    living.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: Every adult Lapp, especially noaides, was said to be able to have several
    saivvo people as tutelary spirits.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:15
  text: The passage states that the Lapp wizard's helpful spirits may have been deceased
    ancestors, while also cautioning that the Saivvo people were not wholly human
    spirits and that not all human souls went there.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:16
  text: 'The passage compares Altaian Turk and Jakut wizard-helper beliefs: Altaian
    ancestor spirits mediate between the wizard and lower nature spirits, and the
    Jakut helpful spirit is generally a defunct shaman or occasionally a secondary
    deity.'
  category: relationship
  evidence_refs:
  - ev:15
  - ev:16
