canonical_text:
  quote: ''
  summary: The passage gives an ethno-geographical account of western Finnic groups,
    especially Vepsas, Votes, and Esthonians. It reviews documentary notices of Em/Yem,
    Cudes, Karelians, and Lapps around Lake Onega and Lake Kubinsk; discusses whether
    Vepsas correspond to the Ves or to the Visu/Isu of chronicles and Arab travellers;
    reconstructs a northern route from Bolgari toward the Usa; and summarizes the
    later distribution and assimilation of Votes, Esthonians, and other Finnish-speaking
    inhabitants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage names three divisions of the Finns: Vepsas or Northern Cudes,
    Votes or Southern Cudes, and Esthonians.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Northern Cudes/Vepsas are located in districts around Bielozersk, Tikhvinsk,
    the upper Ojat basin, and eastward into Vitegorsk; Sjogren estimated their number
    at about 21,000.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Documentary testimony is summarized for Em/Yem east of Lake Onega in the eleventh
    century, Cudes/Vepsas and Karelians near Lake Kubinsk in the thirteenth century,
    and Cudes and Lapps near Lake Onega in the fourteenth century.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the Vepsas are generally believed to represent the
    Ves of the Russian chronicle, while rejecting Fraehn’s identification of Ves with
    Visu/Isu as based on name similarity.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Reports attributed to Ibn Fozlan and Abu el Kassim place the Visu three months’
    journey from Bolgari, north of the Bolgars, where the summer night was said to
    last less than an hour.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage describes the Visu as adjacent to the Yura/Ugrians and uses a
    river-and-portage route toward the Usa to argue that the Isu/Visu correspond to
    the Petérans and are now represented by the Zirians.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Votes are described as restricted to north-western Ingria, first mentioned
    by Nestor in 1069, and formerly occupying more of Ingria before displacement by
    Karelians and Russians.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Esthonians are said to call themselves ‘Country people’ and to inhabit
    Esthonia, northern Livland, and the islands of Dago and Oesel; older Finnish inhabitants
    of West Livland and North Kurland are described as largely absorbed by Letts.
  category: setting
  evidence_refs:
  - ev:7
