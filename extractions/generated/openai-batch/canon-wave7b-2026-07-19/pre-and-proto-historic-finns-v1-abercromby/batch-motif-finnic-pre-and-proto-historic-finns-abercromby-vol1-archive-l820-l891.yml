  summary: The passage gives physical, psychological, and ethnographic descriptions
    of Karelians and Mordvins, including measurements and observations attributed
    to Retzius, Mainov, Sommier, Pallas, and Smirnov. It contains no narrative myth,
    ritual episode, deity, supernatural being, or symbolic object.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes Karelians as having an animated, open, attractive expression
    with seriousness, dark or chestnut hair that is often curly and abundant, and
    a small beard that is usually shaved off.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes Karelians psychologically as lively, brisk, enterprising,
    expansive, friendly, attentive, obliging, and elegant in deportment, while also
    less persevering, deep, penetrating, and fatalistic than another implied comparison
    group.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Karelian women are described as often having an oval face, regular features,
    a straight pointed nose, large blue eyes, a pretty mouth, an animated expression,
    and a well-proportioned or slim figure.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Mainov is reported to have measured 225 Erza Mordvins of both sexes and to
    have given average heights for men and women.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mainov reports percentages for Erza Mordvin hair darkness, color, and texture,
    including predominance of dark or cinnamon-colored hair and a high rate of straight
    hair.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'Sommier is reported to have found two Mordvin types in one village: one blonde,
    broad, and squat; the other darker, brisker, and described as having more Aryan
    features.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sommier is reported to have found blonde hair predominant, beards usually
    scanty, and iris color usually grey inclining to blue or chestnut among the Mordvins
    he observed.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Sommier found the people extremely shy and difficult to deal with; he reports
    that men would not allow measurement, while seven women allowed some measurements.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage contrasts Pallas's negative description of Mordvin cleanliness
    with Sommier's view that other groups surpassed them in that respect and that
    the Mordvins were cleaner than Votiaks and Ceremis.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Sommier is said to regard the Mordvins as healthier, more robust, more alert,
    and less intellectually torpid than Votiaks and Ceremis, assigning them second
    place after the Zirians among Eastern Finns in activity of mind and body.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Smirnov is reported to describe the MokSas as more varied in type than the
    Erzas, including a considerable percentage with black hair, dark eyes, and swarthy
    yellowish skin, and as more thickset.
  category: attribute
  evidence_refs:
  - ev:5
