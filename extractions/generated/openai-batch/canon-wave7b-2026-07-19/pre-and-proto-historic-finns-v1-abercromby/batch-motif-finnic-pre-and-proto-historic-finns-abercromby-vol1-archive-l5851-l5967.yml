canonical_text:
  quote: ''
  summary: The passage discusses Finnic and related Uralic terms for sky, air, god,
    and lightning, arguing that a physical sky meaning preceded a sky-spirit or god
    meaning. It describes an inferred early pattern in which a single sky-spirit controlled
    aerial phenomena, contrasted with later or present specialization of natural and
    domestic spirits. It then catalogs water, forest, house, dead, Samoyede, and Ostiak
    spirits, including anthropomorphic forms, animal forms, invisibility, spirit habitations
    in objects, and idol gods tied to worshippers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Finnish jumala now means “god,” while a corresponding
    Ceremis word means “sky,” and a Mordvin term for lightning is glossed as “the
    fire of jom.”
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that “sky” is the older meaning of the relevant terms and
    that “god” is secondary, with Western Finnic borrowing used as part of the explanation.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage describes an initial single deity or spirit of the sky named with
    forms such as jumala, jumo, and inmar, later expanded into plural epithets for
    several deities.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: As a sky god, Jumala is described as sending thunder, rain, snow, and wind
    upon mortals, though the author says his worship is doubtful.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says present Eastern Finns assign many aerial phenomena to distinct
    fathers, mothers, rulers, or other functionaries, and also differentiate domestic
    tutelary spirits by location such as hearth, courtyard, cowhouse, stable, and
    sheep-pen.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says Samoyedes refer the aerial phenomena collectively to the
    will of a single spirit, and the author uses this to infer a prehistoric Finnic
    single-sky-spirit attribution.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Eastern Finn nature spirits are said to be named by kinship or authority terms
    such as father, mother, ruler, prince, or god, and to be generally conceived anthropomorphically.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: A Votiak water-spirit is described as being shot, after which the water was
    tinged with his blood; a forest spirit’s shed blood is said to generate a fresh
    spirit from each drop.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Mordvin water-mother is described as appearing as a beautiful woman, as
    a huge fish surrounded by smaller fish, and as a bird skimming over water; pity
    toward her children in a fisherman’s net brings a good catch.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Mordvin forest-wife is described as appearing as a beautiful woman and
    changing into fire, whirlwind, cat, dog, horse, or wolf.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Votiak water-spirit is also described as a huge pike; the passage says
    the pike is sacred among the Voguls and was probably sacred to prehistoric Finns.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: 'The passage presents several examples of invisibility or non-corporeality:
    a Votiak house-spirit that is tangible but invisible, Lapp spirits of the dead
    that are visible but not corporeal, and a Permian invisibility superstition using
    parts or clothing of a dead man.'
  category: attribute
  evidence_refs:
  - ev:12
  - ev:13
- id: obs:13
  text: Samoyede spirits are described as visible only to wizards and as having habitations
    in stones, trees, natural objects, or dolls; some Samoyede idol gods die with
    their worshippers and are thrown into a river, while Ostiak household and clan
    gods appear as dressed dolls.
  category: object
  evidence_refs:
  - ev:14
