  summary: 'The passage introduces the work''s purpose: to examine Finnish magic songs
    while first giving historical, philological, archaeological, and craniological
    background on Eastern and Western Finnic groups. It explains that language community
    does not necessarily prove racial community, argues that knowledge of the past
    is needed to distinguish layers in Finnish magic songs, outlines the possibility
    of broad prehistoric epochs, and cautions that such reconstructions remain uncertain.'
