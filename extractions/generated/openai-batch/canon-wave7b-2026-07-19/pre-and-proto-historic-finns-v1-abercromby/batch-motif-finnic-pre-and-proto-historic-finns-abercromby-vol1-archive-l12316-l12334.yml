canonical_text:
  quote: ''
  summary: 'The passage discusses Rahkoi/Rahko: Agricola reports Rahkoi as a Tavastlander
    god who darkened the moon, while the Rahko of Magic Songs is treated as probably
    different. In nightmare charms Rahko wears iron boots, makes a stony hill revolve,
    and is asked to put the nightmare under hard or iron objects. Similar formulas
    occur in riddles whose answers point to mill or tool imagery. The author interprets
    the stony hill as a millstone and suggests Rahko was likely a stone-spirit or
    stone-ha/fia.'
