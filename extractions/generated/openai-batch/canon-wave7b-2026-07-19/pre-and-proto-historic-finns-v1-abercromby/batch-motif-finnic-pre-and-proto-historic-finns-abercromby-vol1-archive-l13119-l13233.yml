canonical_text:
  quote: ''
  summary: The passage summarizes Finnish magic-song and exorcistic practices in which
    pains, diseases, animals, pests, and even Ukko are addressed or redirected. It
    lists destinations to which disease spirits are banished, including sea, sky,
    forests, mountains, underworld places, stones, animal bodies, and trees. It then
    catalogs real and imaginary instruments used by exorcists to be heard, draw down
    milk, extract disease objects, cut disorders away, and weigh down nightmares.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Pain is directed either into the sea, where its relatives reside, or to
    the stars if it has vanity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Exorcists or reciters of Magic Songs offer inducements to birds, animals,
    and pests, including a raven, bear, ermine, game bird, cabbage grub, and bug,
    so that they will go elsewhere or behave as desired.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ukko, identified as the god of the sky, is addressed in an attempt to persuade
    him to send rain to another place.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Spirits of disease are conjured to many localities and are said to be unable
    to escape unless the exorcist comes to set them free.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Banishment destinations include the diseases’ own country, Metsola, forests,
    the north, mountains and hills, places below the earth, Manala, Sariola, swamps,
    the sky, stones, holes, the sea, rapids, animal vehicles or bodies, Tuonela, and
    apple or oak trees.
  category: setting
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The passage states that belief in the power of magic song did not exclude
    the use of instruments, whether real or imaginary.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: A horn or pipe may be blown toward the sky so the exorcist can be heard, and
    a herding-horn may be thrust toward the sky to bring down milk.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Instruments and materials used against Disease include bear or eagle claws,
