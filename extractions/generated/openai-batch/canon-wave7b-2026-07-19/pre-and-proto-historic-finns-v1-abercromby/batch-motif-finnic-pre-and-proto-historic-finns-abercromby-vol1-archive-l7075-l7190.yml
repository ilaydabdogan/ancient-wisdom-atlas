canonical_text:
  quote: ''
  summary: The passage analyzes Finno-Ugrian kinship terms and verbs for marriage
    to infer patterns of wife acquisition, in-law relations, family authority, and
    affinal relations. It emphasizes linguistic evidence for pacific marriage arrangements
    rather than exclusive hostile capture, notes male-centered in-law terminology,
    and discusses expressions such as giving a daughter to a man, a woman going or
    running away to a man, and a possible Ostiak image of a father seating his daughter
    in a boat or sleigh after a marriage feast.
  language: English
  quote_policy: summarized
