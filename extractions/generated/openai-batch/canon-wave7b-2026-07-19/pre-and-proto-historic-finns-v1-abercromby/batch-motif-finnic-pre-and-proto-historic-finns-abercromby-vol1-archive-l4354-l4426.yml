canonical_text:
  quote: ''
  summary: The passage describes Early Iron Age and later cemeteries and finds in
    the Baltic Provinces, including an Allats-Kivi stone-row cremation cemetery, an
    adjacent later inhumation cemetery with grave orientations, transition finds in
    Lettish Livland and Kurland, and scholarly debate over whether archaeological
    evidence indicates Esthonian/Finnish, Lettish, Gothic, Teutonic, or Scandinavian
    attribution.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Allats-Kivi there is a large stone-row cemetery with cremation; its long
    axis lies east-west and most transverse rows run north-south.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many bones lay between the rows at Allats-Kivi, most showing marks of fire.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A nearby cemetery is assigned entirely to the later period, 700-1200 A.D.,
    and contained one or more uncremated bodies in shallow graves over which mounds
    were raised.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: One male skeleton in the nearby cemetery lay with head to the north and feet
    to the south; another was oriented west to east.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author reports that two skulls from the nearby cemetery had been described
    as far removed from the Finnish type.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The author states that Hausmann positively attributed the nearby cemetery
    to the Ests, but the author regards this as doubtful because of the skulls and
    the mode of burial.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Transition finds are listed from several places in Lettish Livland, the Vitebsk
    region, and Kurland; the passage states that, where known, the burial mode was
    inhumation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that inhumation in these transition finds helps connect
    them with older graves where a similar interment method was practiced.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Grewingk attributed the Vella latva at Musching and thirty or more so-called
    ship-graves in Esthonia and Livland to Goths and Scandinavians, but the author
    rejects the ship-grave theory as based on inexact plans, preconceived ideas, and
    a chronological mismatch with Scandinavian ship-graves.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Montelius and Aspelin are reported as believing the Baltic Provinces were
    solely inhabited by a Gothic or Teutonic people until about 400 A.D., based on
    archaeological object types also found on Teutonic soil.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Hausmann is said to consider the Gothic or Teutonic theory unproved, and Kharuzin
    is said to incline toward some graves in Esthonia belonging to an Esthonian, Finnish
    people.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage argues that in a non-metalliferous country, natives would long
