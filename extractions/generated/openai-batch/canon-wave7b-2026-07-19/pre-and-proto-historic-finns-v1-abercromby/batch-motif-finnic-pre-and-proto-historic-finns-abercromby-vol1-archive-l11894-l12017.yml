    mistress of Pohjola, is impregnated by a violent east wind and bears diseases
    and other offspring.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:2
  type: summary
  locator: 11902-11909
  quote_or_summary: Raani, old wife of Pohja, is impregnated by wind and bears Tuuletar,
    Viimatar, and Pakkanen in Pohjola; another old wife of Pohja rubs her hands until
    blood is produced, and rust in corn originates from it.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: 11909-11921
  quote_or_summary: A crone or Louhiatar eats iron groats prepared by Tuoni’s girl
    and bears maladies and injuries. Akahatar, the Pain-maiden, is described with
    long hair and pendant breasts, compared to several northern European female beings,
    and bears wind, fire, frost, snow, and diseases in Sariola.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: 11922-11944
  quote_or_summary: Lapland is described as a real country but also a vague dark northern
    land of sorcery and magic; Lapp is often another term for wizard or sorcerer.
    Turja is identified geographically with part of the Kola Peninsula and linked
    with Ter-Finnas in Ohthere’s voyage account.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: 11945-11955
  quote_or_summary: Lapland and Turja are said to be imagined as remote northern regions
    with game and woods; hunters ask forest divinities or the old crone of the north
    to send game from Lapland, Lake Imantra, or the Turja Fells.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: 11956-11966
  quote_or_summary: An old man from Turja or Pimentola repairs a wounded man with
    skin, sinews, flesh, and blood. A maiden from Turja or Lapland sails over icicles
    in a red boat with a kettle of ice for someone burned or scalded.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 11966-11973
  quote_or_summary: An eagle dwelling in Turja or Lapland has a steel beak, iron claws,
    wings touching water and sky, and a beak like five sickles; it is invoked to devour
    pain. Another eagle with five sickle-like talons and eyes at its wing tips is
    asked to extract Keito’s spears from a sick man.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 11973-11986
  quote_or_summary: A famous eagle in north-east Turja shelters armed men under its
    wings and tail and is invoked to remove spell injury. A fiery-throated Lapp who
    has drunk rivers of fire is invited to stop bleeding with a stopper, nail, or
    metal pipe.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 11986-11989
  quote_or_summary: A fiery Tursas, described as a Lapp from Turja, comes and burns
    hay being made by four celebrated maidens.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 11990-12003
  quote_or_summary: Kalma is explained as grave, corpse-smell, corpse, and a personification
    of the grave; it is compared with Mordvin kalma. Tuoni is explained as originally
    meaning the deceased and compared with Lapp duodna. Mana is explained as formed
    from Manala, the underground place of the dead.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: 12004-12017
  quote_or_summary: The abode of Death is underground and sometimes linked with a
    river. Oak chips drift into the black river of Tuoni and subterranean waters of
    Manala; an old witch hurls a ball of fire through earth into the river of Tuonela
    and depths of Manala. A man should not go there except by disease or ordinary
    death, and Manala’s huts are eternal.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
