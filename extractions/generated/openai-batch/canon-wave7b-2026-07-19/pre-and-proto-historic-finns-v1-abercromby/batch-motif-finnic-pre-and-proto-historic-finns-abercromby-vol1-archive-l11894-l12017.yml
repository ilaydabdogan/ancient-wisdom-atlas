  claim: The passage supports a linguistic comparison between Finnish Kalma and Mordvin
    kalma, both associated with the meaning ‘grave’ in the author’s account.
  claim_level: linguistic_similarity
  target: Mordvin kalma and related verb meaning ‘bury’
