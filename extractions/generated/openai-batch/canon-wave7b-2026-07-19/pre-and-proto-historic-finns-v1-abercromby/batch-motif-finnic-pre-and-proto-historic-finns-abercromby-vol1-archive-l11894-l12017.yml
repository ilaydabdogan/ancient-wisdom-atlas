  claim: The passage explicitly compares Akahatar’s long hair and pendant breasts
    to those of a Swedish Skogsnufva, a Danish sea-woman, and a Wildfraulein of the
    Eifel.
  claim_level: visual_similarity
  target: Swedish Skogsnufva, Danish sea-woman, and Eifel Wildfraulein
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to physical description and does not establish
    shared origin, contact, or identical narrative function.
- id: claim:2
  claim: The passage states that what is said of Tuonela, the home of Death, in one
    version may be told of Pohjola in a variant, suggesting overlapping narrative
    function for these places in cited variants.
  claim_level: same_function
  target: Tuonela and Pohjola in variant traditions
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The specific variant texts are not quoted here; the claim rests on
    the author’s summary.
