canonical_text:
  quote: ''
  summary: The passage describes Pohjola as a source of evils and harmful births;
    Lapland and Turja as northern lands associated with game, sorcery, healing, and
    dangerous beings; and Kalma, Tuoni, and Mana as personifications or names connected
    with death, grave, and the underworld. It also describes the abode of Death as
    underground and associated with a river or subterranean waters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pohjola is described as having a bad aspect, with all sorts of evils able
    to come from it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Louhiatar, mistress of Pohjola, is made pregnant by a violent east wind and
    gives birth to named diseases, a nameless boy, and a daughter named Tuuletar.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Raani, the swarthy old wife of Pohja, is impregnated by a wind, confined in
    an outhouse of Pohjola, and gives birth to Tuuletar, Viimatar, and Pakkanen.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A cold-throated old wife of Pohja produces blood by rubbing her hands together
    after sleeping in the cold, and rust in corn originates from that blood.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A furious old crone, given as a variant of the strong woman Louhiatar, eats
    iron groats pounded by Tuoni’s girl, becomes pregnant, and gives birth to many
    maladies and injuries.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Akahatar, the Pain-maiden, is described as huge, with a hair-plait reaching
    her heels and breasts reaching her knees; she goes to a bathhouse in Sariola and
    gives birth to wind, fire, cold, snow, and several diseases or harmful beings.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Lapland is described as both a real country and, in this context, a vague
    dark northern land of sorcery and magic; the word Lapp is said often to mean a
    wizard or sorcerer.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Lapland and Turja are described as remote northern regions thought to abound
    in game and sometimes dense woods; hunters ask forest divinities or the old crone
    of the north to send game from those regions.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: An old man from Turja or Pimentola repairs a wounded man with a roll of skin,
    a skein of sinews, spare flesh, and a ladle of blood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A maiden from Turja or Lapland sails in a red boat over icicles with a kettle
    full of ice, which she is asked to give to a burned or scalded person.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Eagles dwelling in Turja or Lapland are described with metal beaks, claws,
    sickle-like talons, wing-tip eyes, and great size; they are invoked to devour
    pain, extract spears, or remove spell-caused injury.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: A fiery-throated Lapp who has drunk rivers of fire is invited to stop a flow
    of blood by fetching a stopper or nail and using a pipe to draw the blood back
    to its proper place.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A fiery Tursas, described as a Lapp from Turja, burns hay that four celebrated
    maidens were making.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Kalma, Tuoni, and Mana are explained as names or personifications connected
    with grave, corpse, deceased, and places of the dead.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: The abode of Death is described as underground and associated with a river;
    chips of an oak drift into the black river of Tuoni and the subterranean waters
    of Manala, and an old witch sends a ball of fire through earth into the river
    of Tuonela and depths of Manala.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:16
  text: The passage says a man must not go to the death realm without being killed
    by disease or ordinary death, and it calls the huts of Manala eternal.
  category: attribute
  evidence_refs:
  - ev:11
