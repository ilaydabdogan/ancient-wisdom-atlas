canonical_text:
  quote: ''
  summary: The passage surveys Finnish charm and song fragments concerning the concealment
    and release of sun and moon, possible oak imagery that darkens heavenly bodies,
    invocations of Paivatar, Kuutar, Otavatar, and other powers in charms, exchanges
    offered for hunting and fishing success, an oak springing from a tear, and the
    genealogy of Fire/Panu as offspring of the Sun.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sun is described as enclosed in a rock or iron mountain, and the moon
    as shut in an enclosure or iron barn by Kuume or a Pirulainen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The release of the enclosed heavenly body or bodies is attributed in different
    passages to a woman, Paivatar, or the daughter of nature, and is cited as a precedent
    for child delivery.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A later version says that the Creator freed moons and released suns, and with
    a curse sent Satan away to steel hills and iron rocks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author states that these release passages do not seem to refer to an eclipse
    or the waning of the moon, and suggests that the concealment of the sun in winter
    may be the natural phenomenon hinted at.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: A gigantic or lovely oak is said in variants to darken or conceal part of
    the sun, part of the earth, and the sun and moon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author cautions that the oak passages may be due to singers' imagination
    rather than being mythical.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: Paivatar, called the doughty maiden and releaser, is invoked with other powers
    to deliver a sufferer from spell-sent sickness.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The sun, moon, and Great Bear are requested to guide a child from the womb
    into open air so that the child may see the sun, moon, and stars.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Otavatar, maid of night and steady watcher, is asked to watch over property,
    notice theft, and have stolen things returned.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Kuutar and Paivatar are asked by a hunter to bake a suet cake or honeyed bannock
    for propitiating the forest.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A fisherman promises Vellamo a linen shirt woven by Kuutar and spun by Paivatar
    in exchange for a good haul of fish.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: In a charm against wasps, Kuutar and Paivatar are asked to conceal their children,
    identified by the author as wasps, and not to follow a sorcerer's wish.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: When Paivatar bewails her gold and Kuutar her silver, a tear rolls into a
    dell and a lovely oak springs from it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Fire, named Panu, is said to be the offspring of the Sun, made in the centre
    of the sky near the Great Bear.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Elsewhere Panu is described as the son of Aurinkoinen and Auringatar and as
    living under forge-fires.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Three or four famous maidens are said to wash with lye the head of the son
    of the sun.
  category: action
  evidence_refs:
  - ev:7
