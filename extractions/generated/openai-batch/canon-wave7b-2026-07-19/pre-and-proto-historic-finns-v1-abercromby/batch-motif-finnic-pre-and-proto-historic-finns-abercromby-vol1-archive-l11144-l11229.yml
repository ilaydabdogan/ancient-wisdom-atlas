candidate_motifs:
- id: motif:1
  label: Infernal being invoked as ritual helper
  taxonomy_refs: []
  basis: Hiisi and beings of Hiitola or Pirula are called from Hell-like places to
    aid exorcists, heal wounds, remove stings, cut out evil, and assist childbirth.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage reports charm examples rather than a single continuous myth
    narrative.
- id: motif:2
  label: Supernatural garments and headgear used to bind perception or speech
  taxonomy_refs: []
  basis: The bloody cloak, gory rug, cap, and hats of Hiisi or Lempo are used to cover
    eyes, head, ears, or a dog’s mouth and to receive divination slips.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The items function in several charm contexts; the passage does not state
    a unified mythic episode.
- id: motif:3
  label: Disease or evil transferred, extracted, or cut away with infernal aid
  taxonomy_refs: []
  basis: The passage includes extraction of arrows, stopping a torn vein, moving a
    sting into bear bones, and cutting out the evil causing a sick man pain.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The examples come from charms and exorcisms, not from a full etiological
    myth.
- id: motif:4
  label: Childbirth obstruction removed by supernatural implement
  taxonomy_refs: []
  basis: The humpbacked of Hiitola is asked to arrive with a golden axe in a golden
    sleigh to remove obstructions and facilitate childbirth.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: Only one childbirth-aid example is summarized in the passage.
- id: motif:5
  label: Ore origin from bodily fluid on stone
  taxonomy_refs: []
  basis: Copper ore is explained as stale from a Hiisi-related girl, wife, or mare
    drying on a rock.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage says this probably explains something bad in the nature of
    copper; broader symbolic interpretation is not supplied.
- id: motif:6
  label: Milk theft to the realm of death
  taxonomy_refs: []
  basis: Hiki-tukka steals milk and takes it to Mana or Tuonela.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage gives only a brief notice and does not elaborate the consequences
    of the theft.
- id: motif:7
  label: Water-spirit as source of disease
  taxonomy_refs: []
  basis: Water-Hiisi is described as an evil water-spirit associated with rash, possible
    origins of malady, and a sea-den.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The text notes that water was not originally part of Hiisi’s domain.
- id: motif:8
  label: Tree-spirit becoming forest-spirit and clan divinity
  taxonomy_refs: []
  basis: The author connects Hiisi with tree-spirit analogies and concludes that Hiisi
    was likely a tree-spirit before becoming a forest-spirit, and once a favoured
    family or clan god.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage explicitly notes uncertainty about formal identification with
    the Lapp Siese or Seita.
comparison_claims:
- id: claim:1
  claim: The passage itself compares the invocation of Hiisi as an infernal helper
    to the invocation of the devil by witches and sorcerers in medieval Europe.
  claim_level: same_function
  target: devil invoked by witches and sorcerers in medieval Europe
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is functional and rhetorical in the passage; it does
    not establish historical contact or shared origin.
- id: claim:2
  claim: Hiisi is cautiously compared with the Lapp Siese or Seita through shared
    features such as high-ground placement and material representations involving
    stumps, posts, stones, and renewed twigs.
  claim_level: same_function
  target: Lapp Siese / Seita
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage explicitly says formal identification is not certain and
    does not decide whether the names or beings have the same origin.
- id: claim:3
  claim: The passage compares Hiisi’s probable tree-spirit status with Votiak vorsud
    and Ceremis household-spirit twig forms, emphasizing annual renewal of twigs or
    faggots.
  claim_level: same_function
  target: Votiak vorsud and Ceremis kuda vodizh / house-spirit
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is analogical; no historical derivation is asserted.
- id: claim:4
  claim: The passage compares Hiisi as a possible family or clan god with Lapp Seitas
    and Stor Junkares, which are said to give wild forest animals.
  claim_level: same_function
  target: Lapp Seitas and Stor Junkares
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim rests on the author’s stated analogies and probability judgment,
    not on a directly narrated shared myth.
