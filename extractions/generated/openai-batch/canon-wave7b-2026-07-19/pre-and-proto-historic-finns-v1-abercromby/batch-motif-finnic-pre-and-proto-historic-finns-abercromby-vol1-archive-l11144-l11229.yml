canonical_text:
  quote: ''
  summary: 'The passage surveys charms and beliefs involving Hiisi and related beings:
    Hiisi is associated with fire, Hell, Piru, infernal helpers, ritual implements,
    disease removal, childbirth aid, concealment, divination, weapon disabling, copper
    origin, theft recovery, milk theft, water-Hiisi illnesses, and possible analogies
    with Lapp, Votiak, and Ceremis sacred tree or household spirit forms. It concludes
    that Hiisi may earlier have been a tree-spirit and family or clan divinity before
    becoming a forest-spirit.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hiisi is described as associated with fire and coals, enabling identification
    of Hiitola with Hell and Hiisi with Piru and the Evil Power.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In several charms, Hiisi or beings of Hiitola are invoked as helpers for exorcistic
    or practical ritual aims.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
- id: obs:3
  text: Fiery Hiisi is asked to come from fiery Hell with three sons and two daughters
    and to press a shaggy glove against a torn vein, or use flesh from his thigh to
    plug the wound.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hiisi as Pirulainen is asked to remove a sting or goad from human skin and
    put it into a bear’s bones instead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The humpbacked being of Hiitola is asked to bring a scythe from Hell to an
    exorcist, who will cut out the evil causing pain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The humpbacked being of Hiitola is also asked to come in a golden sleigh containing
    a golden axe to remove obstructions and facilitate childbirth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A bloody cloak or gory rug of Hiitola or Lempo is used in wishes to cover
    or bind another being’s eyes, head, or ears so that it cannot see or hear.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hiisi or Lempo is asked to lend headgear for divination slips or to close
    a dog’s mouth.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: A hide of an elk from Hiisi’s land is wished to disable an enemy’s gun by
    affecting its mechanism and bullet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: One origin account derives copper ore from stale made by Hilahatar, Hiisi’s
    girl, Hiisi’s old wife, or Hiisi’s mare on a rock, which dried and became copper
    ore.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Hiisi’s daughter Hippa and cat Kipinatar are asked to tear and torture a thief
    until stolen property is returned.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Hiisi’s maiden Hiki-tytto is asked to sharpen a knife with sweat so that a
    tumour may be removed without harming the patient.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Hiisi’s girl Hiki-tukka steals milk and takes it to Mana or Tuonela.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Although Hiisi is said originally not to have been connected with water, an
    evil water-spirit could be called a water-Hiisi.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: A water-Hiisi is associated with rash, maladies, and a den in the sea entered
    by the daughter of Tuoni during labour.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: The passage states that formal identification of Hiisi with Lapp Siese or
    Seita is uncertain, though several common points are noted.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:17
  text: The Lapp seita is described as often positioned on high ground and consisting
    of a tree-stump, post, or small pile of stones, with fresh twigs and leaves renewed
    annually.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:18
  text: Votiak vorsud and Ceremis household-spirit forms are compared through annually
    changed birch, fir, or other twigs.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:19
  text: The author concludes that before becoming a forest-spirit, Hiisi was probably
    a tree-spirit and once a favoured divinity of protohistoric West Finns, in some
    measure a family or clan god.
  category: attribute
  evidence_refs:
  - ev:9
  - ev:10
