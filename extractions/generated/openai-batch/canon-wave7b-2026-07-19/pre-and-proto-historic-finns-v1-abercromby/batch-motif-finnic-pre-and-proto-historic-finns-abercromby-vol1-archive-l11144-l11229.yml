  quote_or_summary: Votiak vorsud may be represented by birch or fir twigs changed
    every spring, and Ceremis kuda vodizh or house-spirit inhabits an annually replaced
    faggot; the passage states that before becoming a forest-spirit, Hiisi was no
    doubt a tree-spirit.
