candidate_motifs:
- id: motif:1
  label: malignant forest spirit leading travellers astray
  taxonomy_refs:
  - trickster_boundary
  basis: Vepsa Lempos are described as evil forest spirits, tree-tall, who try to
    lead travellers astray.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The taxonomy reference is broad; the passage calls the beings evil spirits
    rather than tricksters.
- id: motif:2
  label: fiery wandering light personified as demon or forest spirit
  taxonomy_refs: []
  basis: The passage connects the Vepsish word for Lempo with devil, fire, and flame,
    and suggests a possible ignis fatuus or Will o’ the Wisp personification.
  evidence_refs:
  - ev:1
  confidence: low
  cautions: The author presents this as possible, and says there is no direct trace
    in the Magic Songs.
- id: motif:3
  label: disease or pain as demonic missiles lodged in the body
  taxonomy_refs: []
  basis: Stitch and pleurisy are called arrows or spears of Piru or Lempo; Piru and
    Lempo make arrows or spears from fiery oak or evil tree and shoot them into a
    human body.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage summarizes song examples rather than quoting each song in
    full.
- id: motif:4
  label: exorcistic removal of harm by animal carrier
  taxonomy_refs: []
  basis: Lempo is asked to extract his arrows and shoot them down a raven’s throat
    so the raven will carry them to Lempo’s family and birthplace, never to be seen
    again.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not detail the full rite beyond the summarized invocation.
- id: motif:5
  label: water spirits grant safe passage through dangerous waters
  taxonomy_refs: []
  basis: Ahti, Vellamo, Litvetti/Livetti, Melatar, and other water beings are invoked
    to calm waves, steer, soften rocks, provide oars, control foam, and help through
    witch-inhabited or spell-bound waters.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The examples are summarized from multiple song references.
- id: motif:6
  label: supernatural army summoned from waters
  taxonomy_refs: []
  basis: Water beings are asked to raise men, bowmen, swordsmen, heroes, and a thousand
    armed men from seas, lakes, streams, wells, gravel, and pools against enemies.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The exact identity of all listed helper beings is not resolved in the
    passage.
- id: motif:7
  label: fishing success through water deity and gift exchange
  taxonomy_refs:
  - sacred_exchange
  basis: Fishermen ask water rulers and mistresses to send fish, and one offers Vellamo
    a linen shirt spun by daughters of the Moon and Sun in return for help.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: Only the Vellamo example explicitly frames the fishing help as a return
    for a gift.
- id: motif:8
  label: resourceful deity defeats freezing force with improvised magical clothing
  taxonomy_refs:
  - wisdom
  basis: Ahti knows tricks, cuts moss and fluff from stone, makes socks and mitts,
    and thereby holds Sharp Frost after Frost tries to freeze him.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The wisdom taxonomy is broad; the passage emphasizes a practical trick
    rather than an explicit wisdom contest.
comparison_claims:
- id: claim:1
  claim: The passage explicitly treats Lempo as functionally close to Hiisi and Piru
    in magic-song language for evil, disease, and bodily affliction.
  claim_level: same_function
  target: Hiisi and Piru within the summarized Finnish Magic Songs material
  evidence_refs:
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The passage says synonymous or nearly so, but does not establish that
    the names are identical beings in every context.
- id: claim:2
  claim: The passage supports a cautious comparison between Lempo or the Vepsa Lempos
    and the ignis fatuus / Will o’ the Wisp pattern because of the fire/flame word
    meaning and the motif of misleading travellers.
  claim_level: visual_similarity
  target: ignis fatuus / Will o’ the Wisp pattern
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: low
  limitations: The author presents the connection as possible and notes no direct
    trace in the Magic Songs.
