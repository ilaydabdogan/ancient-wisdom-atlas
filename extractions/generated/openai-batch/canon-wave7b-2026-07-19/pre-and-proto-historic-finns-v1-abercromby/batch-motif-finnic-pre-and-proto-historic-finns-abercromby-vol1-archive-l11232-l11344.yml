canonical_text:
  quote: ''
  summary: The passage describes Lempo as a malignant forest-associated spirit and
    as a name or source for diseases, pains, missiles, accidents, and evil generally,
    with links to Hiisi, Piru, ravens, fire, and trees. It then surveys water spirits
    including Ahti, Vellamo, Litvetti/Livetti, Melatar, and other named or unnamed
    water beings invoked for safe water travel, help against enemies, successful fishing,
    and control of waves, rocks, foam, fish, and frost.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that Lempo seems originally to have been a malignant forest-spirit;
    among Vepsas, plural Lempos are described as evil forest spirits as tall as trees
    who try to lead travellers astray.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the Vepsish form of the word means both “devil” and
    “fire, flame,” and suggests that Lempo may have been a personification of ignis
    fatuus or Will o’ the Wisp.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lempo is said to be synonymous or nearly synonymous with Hiisi, Piru, and
    evil in general; diseases, tumours, hornets, stitch, pleurisy, and toothache are
    given names connected with Lempo, Hiisi, or Piru.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Piru and Lempo are described as making arrows or leaf-headed spears from a
    fiery oak or evil tree and shooting them into a human body; Lempo is then asked
    to extract the arrows and send them away by raven.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The raven is described as Lempo’s bird, with body parts made from Lempo’s
    spinning-wheel, sail, and needle-case.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A slipping knife in an operator’s hand is attributed to Lempo, who is then
    made to suffer by being cut in two with a knife made by himself.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Homma is invoked to take flesh from Lempo’s thigh or groin and use it to plug
    a severed vein.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ahti and Vellamo are invoked by water travellers to calm waves and water-force;
    Ahti is asked to steer through dangerous rapids with his sword, and Litvetti or
    Livetti is asked to soften rocks in rapids.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ahti is asked to provide better oars and still high waves; an old woman below
    the waves is asked to gather foam, and Melatar is asked for a steering oar on
    spell-bound streams.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A blue-capped mistress of the waters and other water beings are invoked to
    raise men, bowmen, swordsmen, heroes, and armed followers from seas, lakes, streams,
    wells, gravel, and pools to help against enemies.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Ahti and his wife are described as ruling fish; fishermen ask Ahti, Vellamo,
    the old wife of the sea, and Juolehetar to send fish to nets or lines, and one
    fisherman promises Vellamo a linen shirt in return.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Sharp Frost tries to freeze the sea and Ahti, but Ahti’s warship remains unaffected;
    Ahti makes socks and mitts from moss and fluff cut from a stone, enabling him
    to hold Sharp Frost.
  category: sequence
  evidence_refs:
  - ev:9
