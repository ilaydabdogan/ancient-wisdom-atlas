canonical_text:
  quote: ''
  summary: The passage describes Finnic exorcistic defensive measures and helper-invocations.
    Protective formulas present the exorcist as putting on magical armour or garments
    supplied by dead kin, mythic female figures, Ukko, or the Virgin Mary. The passage
    then lists helpers sought from ancestors, landscapes, animals, birds, and Christian
    figures; these helpers eat spells, drive off disease or hostile beings, remove
    sorcerers' arrows and spears, protect against burns, or guard a boat in rapids.
  language: English
  quote_policy: summarized
