literal_observations:
- id: obs:1
  text: The author leaves the anthropological assessment of two cranial series to
    experts and states that the claim is not that the Ladogans were Ceremis, but that
    the Ceremis may be partly descended from the same stock as the Ladogans.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Prehistoric people are described as living on the south shore of Lake Ladoga,
    bordered by dense forests and broad swamps.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The region is said to have supported large numbers of animals, including Bos
    latifrons, bison, elk, reindeer, wild boar, beaver, and sable.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two dog breeds are mentioned, a larger and a smaller; possible uses include
    draught and hunting, but Count Uvarov is reported as doubting domestication and
    suggesting dogs may have been used as food.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Seals are still present in the lake but are said to be smaller than prehistoric
    seals; the puffin is said formerly to have frequented Ladoga but now to require
    travel to northern Norway to find.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The climate is inferred to have been milder than at present because oak, now
    scrubby so far north, is described as formerly growing large and being the predominant
    hardwood.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The forests are described as largely deciduous, including oak, maple, willow,
    poplar, and alder, with beavers and elks linked to hardwood and foliage.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Objects of bone and horn are said to be more than twice as numerous as stone
    objects and include lance-heads, arrow-heads, daggers, knives, scrapers, shovels,
    hooks, harpoons, needles, awls, and ornaments.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Stone objects include scrapers, ground axes, flat-sided chisels, gouges, wedges,
    mallets, whetstones, awls, knives, and ornaments, with some items showing symmetry
    and care in manufacture.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Some bones show traces of sawing, probably done with a stone wedge, coarse
    quartz sand, and water; the passage cites an oak dug-out canoe and carved animal
    heads and outlines as evidence that the tools were effective.
  category: action
  evidence_refs:
  - ev:9
