canonical_text:
  quote: ''
  summary: 'The passage describes Neolithic Ladogan and Kolomtsi finds: carved animal
    and possible human bone objects, pottery forms and ornament, stratigraphy and
    skulls at Kolomtsi, implements, distant stones, and perforated carnivore teeth
    worn as ornaments or amulets. It reports comparisons with Finnish, East Prussian,
    Galician, Ladogan, Onega, and Russian finds, while noting uncertainty and disagreement.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Ladogan bone plaque is described as a seal silhouette, with short surface
    strokes representing fur and a suspension hole forming the eye; the passage says
    it may have been worn as an amulet to bring luck.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A second Ladogan object is described as the muzzle of a dog or bear carved
    at the end of a bone-scraper and as a precursor of stone picks with animal heads.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'A third Ladogan carving has conflicting reported identifications: Inostrantsev
    compared it to a dagger handle, Tischler recognized it as a human figure, and
    the author expresses doubt about the human interpretation.'
  category: speech
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:4
  text: The passage compares Ladogan carvings with East Prussian and Galician bone
    and amber figures, especially noting suspension holes under the armpits, but also
    emphasizes differences in head rendering and workmanship.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Ladogan pottery is described as coarse, thick, uneven, often mixed with pounded
    granite or mussel shells, made in large vessels without handles, and ornamented
    on about ten percent of sherds with rows of holes, punch-marks, grooves, or combinations
    of these.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: No date is assigned to the Ladogan station, but it is described as very ancient
    and earlier than the introduction of perforated axes and hammers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Kolomtsi station is placed on the right bank of the Volkhov where it issues
    from Lake Ilmen, with a dark-earth bed containing crania beneath brick-clay, sand,
    and vegetable earth layers.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: Several crushed and broken skulls were found at Kolomtsi; eight were restored,
    seven described as dolichocephalous and one as brachycephalous, but the passage
    says no details are given.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Kolomtsi bone carvings include one piece carved as a bird head and another
    representing a man’s head with a pointed chin, very long nose, and fez-shaped
    head-dress.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Kolomtsi pottery clay is described as mixed with gravel, quartz bits, and
    broken shells; some designs are said to match a Ladogan sherd and sherds from
    Lake Onega, and pot bottoms were round or flat.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: Kolomtsi implements are listed in flint, schist, and bone, and small pieces
    of cornelian, jade, agate, and similar stones with traces of use are said to have
    been brought from a distance.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: Perforated teeth of bear, lynx, and other carnivores were worn as ornaments
    or amulets.
  category: object
  evidence_refs:
  - ev:12
