canonical_text:
  quote: ''
  summary: 'The passage surveys marriage and affinal customs among several Finnic
    and neighboring peoples: Ceremis polygyny, indirect polygyny through an adult
    wife acquired for an infant son, Zirian levirate, wife purchase, bride capture,
    bride-price payment by instalments or service, occasional son-in-law residence
    with the wife’s family and name transfer, and mutual avoidance between in-laws.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ceremis in some districts are described as polygamous when circumstances permit,
    usually taking two and more rarely three wives.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among wealthy Ceremis, each wife may have a separate house, wives have identical
    positions, and children of different wives have equal inheritance rights.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that several sisters may live with one husband among the
    Ceremis.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: An adult wife could be acquired for an infant son and live in the same house
    as the father, producing concubinage with the father-in-law.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'A Zirian example of levirate marriage is given: a brother married his deceased
    brother’s wife.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The usual mode of obtaining a wife among the Eastern Finns is described as
    purchase, though forcible capture is also reported in certain circumstances.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bride capture is described as occurring from a festival dance, in woods while
    gathering berries and mushrooms, or at a stream bank while washing clothes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Among Votiaks in Sarapul, capture may occur to avoid wedding expense, when
    the girl is willing but parents refuse, or when parents prefer a rich suitor whom
    she detests.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Yakut example, a husband cannot bring his wife home until the full
    bride price is paid; a poor man may pay by instalments while visiting her at her
    home.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Barabints and Katints Tatar examples, a poor suitor may work for his
    father-in-law by hunting, fishing, ploughing, guarding herds, or getting wood
    for several years.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A Zirian son-in-law may rarely settle permanently in his wife’s home, sever
    connection with his own people, abandon his family name, assume his wife’s father’s
    name, and have children bearing that name.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Among Votiaks, a bride must hide from her father-in-law, cover her face with
    a kerchief in his presence, avoid speaking to him or naming him for a year, and
    avoid appearing bare-headed or bare-footed before certain senior in-laws.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage states that similar avoidance occurs in the son-in-law’s behavior
    toward his wife’s father and mother.
  category: relationship
  evidence_refs:
  - ev:10
