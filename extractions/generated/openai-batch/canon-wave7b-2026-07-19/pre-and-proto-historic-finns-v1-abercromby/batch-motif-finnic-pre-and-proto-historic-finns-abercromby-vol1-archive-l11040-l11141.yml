canonical_text:
  quote: ''
  summary: The passage surveys descriptions of Hiisi’s animals, especially oxen, elk,
    reindeer, and horses with exaggerated or composite features. It then describes
    Hiisi’s later devil-like character, his associations with disease, snakes, omens,
    and nightmares, and a Hiitola smithy where disease-weapons are forged. It also
    recounts charm-material involving oak chips, horse blood at a forge, coals, soot,
    and fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the original animal assigned to Hiisi was elk, reindeer,
    or ox, while the horse is described as a later substitution; Hiisi’s ox ascends
    the Hill of Pain and has one hundred horns and one thousand nipples full of ointments.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hiisi’s chestnut horse has a fire-coloured forelock, an iron-coloured mane,
    extraordinary height, a lake on its croup from which sorcerers drink, and does
    not sweat or slip on the icy path of the air.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Hiitola an ox or elk is described with one hundred horns, a mouth one hundred
    fathoms wide, and a throat like three cataracts that can extract a sorcerer’s
    arrows.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Another account gives Hiisi’s horse a stone head, copper shanks, tarry wooden
    back, iron feet, and fiery muzzle; another invokes Hiisi’s elk or reindeer to
    drive away snakes and adders drinking ale.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says Hiisi later acquired a very bad character and became nearly
    synonymous with the devil, in connection with the spread of Christianity, missionary
    opposition, banned sacrifices, and sacred-grove worship.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage lists diseases, ill omens, and beings as named from or attributed
    to Hiisi, including sickness addressed as Hiisi or hound of Hiisi, a tumour as
    his toadstool, toothache as his son or cat, the snake from his saliva or from
    animated spittle, and nightmares as Hiisi’s corpses.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Diseases and maladies are described as bolts, spears, arrows, or jagged spikes
    of a sorcerer or evil spirit; Hiitola has a smithy where such instruments are
    made, and Piru, Aijé’s son, forges bolts and jagged spikes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In a charm against pleurisy, Hiisi’s little girl carries home chips of a huge
    oak floating on the sea, says sorcerer’s arrows could be made from them, and Hiisi
    sends his son to the smithy to make them into spears and arrows; a variant has
    Hiisi’s iron-toothed dog bring an oak-chip to Hiisi’s daughter.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: When the people of Hiitola celebrate a wedding and drinking-bout, they kill
    a horse and sprinkle its blood at the back of the forge of Hiitola.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Charms and wishes involving Hiisi’s slag, soot, coals, fire, and coal-stirring
    pole are applied to a jealous eye, whooping-cough, toothache, separating lovers,
    and driving reluctant wild animals toward a hunter.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
