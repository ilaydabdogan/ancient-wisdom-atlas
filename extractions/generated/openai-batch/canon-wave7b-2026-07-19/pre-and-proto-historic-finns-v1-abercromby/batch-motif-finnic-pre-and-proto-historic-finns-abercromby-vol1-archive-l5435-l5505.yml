canonical_text:
  quote: ''
  summary: 'The passage describes medieval notices about the Livs: failed missionary
    efforts, reported pagan reverence for animals, trees, water, herbs, and spirits,
    divine images associated with trees and woods, offerings including animals and
    sometimes humans, divination by a horse stepping over a lance, and brief notes
    on cremation among the Kurs, social organization, warfare, subsistence, trade,
    and boats.'
