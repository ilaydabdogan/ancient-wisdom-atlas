canonical_text:
  quote: ''
  summary: The passage compares cranial measurements and indices among Hame/West Finns,
    Russians, Ceremis, Permians, Teutonic crania, Laurenzberg Slavs, Letts, Ostiaks,
    Votiaks, and Scandinavians. It concludes by raising a question about the origin
    of dolichocephaly among West Finns and related groups, mentioning a small-headed
    dolichocephalous people on the Lower Volkhov near Lake Ladoga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage compares Hame crania with dolichocephalous Russians and says their
    skull length, breadth, and cephalic index are the same, while the Hame orbital
    index is slightly higher.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ceremis head is described as longer, broader, and higher than the referenced
    Russians, but shorter, nearly the same breadth, and lower than the referenced
    Teutonic crania.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the sub-dolicho group, the Ceremis skull is described as shorter and narrower
    than the Hame skull, though about the same height.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Compared with the Permian male, the Hame head is described as longer and broader
    but not as high; in female skulls, the Hame is described as higher than the Permian.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Hame orbital index is described as mesoseme, while the Permian orbital
    index is described as megaseme.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the mesocephalous, sub-brachycephalous, and brachycephalous groups, the
    passage continues comparing Hame, Ceremis, and Permian male and female skull dimensions,
    with some observations based on single skulls.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'On average, North Russian crania are contrasted with West Finn crania: West
    Finns are said to have a lower cephalic index, a rather higher vertical index,
    and considerably higher transverse vertical and orbital indices.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The orbital index of the Hame is presented as remaining higher than that of
    the Laurenzberg Slavs and as perhaps the best test among the indices given.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Permian crania are said to agree broadly with Hame crania on average, except
    for having a lower orbital index.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: When separated by sex, Permian males are described as brachycephalous and
    Permian women as mesocephalous, while sex differences in the Hame type are said
    to be nearly smoothed over on average.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Ceremis are described as dolichocephalous in the wider sense, with a low
    vertical index similar to purely dolichocephalous Letts and Russians but distinct
    from the platycephaly of the Ostiaks.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage states that West Finns contain a percentage of long-heads not
    entirely accounted for by crossing with Scandinavians; Permians and Votiaks also
    contain a few; and Ceremis may be regarded as mainly long-headed.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage asks how these groups acquired dolichocephaly and what race they
    were crossed with, then notes that a small tribe of small-headed dolichocephalous
    people lived on the Lower Volkhov near Lake Ladoga in the distant past.
  category: speech
  evidence_refs:
  - ev:6
