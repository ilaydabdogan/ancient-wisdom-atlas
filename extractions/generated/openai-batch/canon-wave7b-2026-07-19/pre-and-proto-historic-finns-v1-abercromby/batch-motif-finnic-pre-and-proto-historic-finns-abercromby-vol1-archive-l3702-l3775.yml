  summary: The passage describes the Andnino cemetery near the old mouth of the Toima
    on the Kama, dated approximately to the fourth century B.C., as an archaeological
    site where bronze and iron objects occur together. It summarizes burial treatments,
    grave orientation, incomplete cremation, grave goods associated with male and
    female skeletons, later finds from an untouched sepulchre, artifact comparisons
    with Siberian and other types, and decorated pottery including a bowl with a row
    of quadrupeds.
  language: English
