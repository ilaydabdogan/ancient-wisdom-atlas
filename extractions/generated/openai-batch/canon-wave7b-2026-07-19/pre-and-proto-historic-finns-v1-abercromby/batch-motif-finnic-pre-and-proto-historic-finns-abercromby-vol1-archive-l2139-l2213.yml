canonical_text:
  quote: ''
  summary: The passage describes Neolithic stone-tool types and distributions in Finland
    and nearby regions, including axes, chisels, gouges, boat-shaped hammer-axes,
    flint daggers, perforated double-picks, and animal-headed picks. It notes Scandinavian
    comparisons and possible imports or imitations for some forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A longer axe type is described as generally quadrangular, sometimes oval in
    section, and thinly distributed over roughly the same area while extending eastward
    into Olenets.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some chisels are described as almost triangular in section, mainly confined
    to Karelia and Olenets, and absent from Scandinavia and the Baltic coast.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Chisels are said to have been mainly used for cutting wood, with an ethnographic
    example of stone chisels used in Kuusamo for removing hair from moistened reindeer
    hides.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One gouge type has a flat face with a groove at one end, with rounded short
    sides and back.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The first gouge type is described as common over much of Finland up to the
    Arctic Circle, especially Karelia and Häme/Tavastland, and also present in Kazan
    and Viatka.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A second gouge type has a flat back, does not taper, has flat parallel short
    sides, is chiefly in Central Finland, and scarcely reaches Karelia.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: More than a hundred perforated, boat-shaped hammer-axes are recorded, with
    general forms compared to Swedish examples.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The boat-shaped hammer-axes occur only in the south-west angle of Finland
    and are not found east of a line from near the Kymmene mouth to Ny Karleby.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: A couple of flint daggers with serrated ridges along the haft, described as
    Scandinavian in type, were found in south-west Finland and are inferred to have
    been imported from Sweden because Finland lacks flint.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The boat-shaped hammer-axes and flint daggers are assigned by the passage
    to the fourth or latest Neolithic period in O. Montelius's classification.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A rude perforated instrument, pointed at both ends, may have a lozenge-shaped
    or elongated body and has pivot-like protuberances on each side of the hole.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The rude perforated instrument is described as chiefly developed in Olenets,
    but also found in Bothnia and Satakunta; a related lozenge-shaped axe or double
    pick without lateral pivots is reported near Volosovo.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: Perforated picks of various forms, including lozenge forms, are described
    as terminating in the head of an animal.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: The animal-headed perforated picks are said to belong to a stone age, and
    the passage reports Aspelin's view that they were probably imitated from later
    bronze weapons.
  category: relationship
  evidence_refs:
  - ev:8
