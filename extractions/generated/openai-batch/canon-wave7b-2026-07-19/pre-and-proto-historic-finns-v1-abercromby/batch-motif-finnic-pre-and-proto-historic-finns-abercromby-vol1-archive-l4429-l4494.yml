canonical_text:
  quote: ''
  summary: The passage compares Iron Age burial forms in Finland, Esthonia, North
    Livland, South Livland, and Kurland. It contrasts Finnish cairn graves attributed
    to a Scandinavian people with Esthonian and North Livland compartment graves,
    distinguishes Kurland mound and kist graves from the northern forms, and uses
    these differences and continuities to argue for two long-standing populations.
    It identifies Kurland and perhaps South Livland as probably Letto-Lithuanian,
    the northern provinces as probably Finnish in part, and discusses objections and
    a hypothesis of absorption through carrying off women and children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author compares Finnish cairn graves, described as Bronze-to-Iron Age
    and Scandinavian-built, with compartment graves at Tiirpsal and Tiirsel in Esthonia
    and says there is little in common and many important differences.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The grave structure in North Livland is said not to differ much from that
    in Esthonia, and the Livland method is traced south to Ronneburg in the east and
    Auzeem in the west.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A line between Ronneburg and Auzeem is described as lying about twenty miles
    south of the boundary between the Esthonians and the Letts around 1250.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author says Table VIII shows more intercourse between Esthonia and Livland
    north of that line than between the northern and southern halves of Livland.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: South of the line, the author says little is known about sepulchral modes
    until Kurland is reached, while the single kist grave at Auzeem indicates a type
    different from northern Livland.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The mound graves with inhumation in Kurland are described as contemporary
    with, but very different from, the compartment graves of Esthonia and northern
    Livland.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The author states that the evidence suggests two distinct peoples divided
    the Baltic Provinces nearly equally and remained there from the beginning of the
    Christian era to the author's present.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says the transition from the older to the younger Iron Age brought
    no change of sepulchral construction at Allats-Kivi, that old interment places
    were reused at Tiirsel, Waets, and Pajus, and that Kurland transition finds suggest
    no alteration in native population.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The author identifies the population of Kurland, and perhaps South Livland,
    as probably Letto-Lithuanian, while the northern half of the Provinces is described
    as probably Finnish at least in part.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The author notes that the Finnish-population hypothesis is opposed by reputable
    Finnish historians and archaeologists, but cites Dr. Virchow's view that Finns
    were temporarily at Rinnekaln in the Neolithic age.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: The main objection to the Finnish-population hypothesis is said to be the
    absence of earlier Iron Age finds east of the Narva, although the author proposes
    an uninhabited tract as a possible explanation and allows that future finds may
    appear.
  category: other
  evidence_refs:
  - ev:10
- id: obs:12
  text: The passage says a Finnish people were not the earliest settlers in the region
    and refers to their practice of carrying off women and children, producing Finnish-speaking
    clan members without Finnish blood and eventual absorption of a non-Finnish people.
  category: action
  evidence_refs:
  - ev:11
