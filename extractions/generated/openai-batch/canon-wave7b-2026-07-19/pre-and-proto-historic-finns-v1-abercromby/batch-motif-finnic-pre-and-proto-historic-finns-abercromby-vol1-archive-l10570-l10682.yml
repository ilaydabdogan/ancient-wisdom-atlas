canonical_text:
  quote: ''
  summary: 'The passage surveys Vainamoinen as a Finnic mythic and ritual figure:
    a god or hero of magic song and wisdom, a possible sky or thunder figure, a giver
    of fire with Ilmarinen, a helper in exorcism and healing, and a figure associated
    with childbirth charms, tree-sowing, sunshine, celestial bodies, storms, sea imagery,
    and healing objects.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Vainamoinen's original mythological role is hard to
    determine, but that he was more than a personification of magic wisdom and song.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bishop Agricola is reported as recording in 1551 that Vainamoinen was a god
    of the Tavastlanders who composed songs; the passage infers that he was chiefly
    viewed as a divinity of magic song and supernatural wisdom.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Current ballads are described as presenting Vainamoinen as a human hero endowed
    with wonderful magic power.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The author proposes two alternatives for Vainamoinen''s origin: a historical
    wizard overlaid with fabulous stories, or a natural-phenomenon spirit anthropomorphized
    over time; the author favors the latter and suspects he is a sky-god under a new
    name.'
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says that Vainamoinen and Ilmarinen gave fire to humankind.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In an exorcistic context, Vainamoinen is asked to utter incantations, bring
    an iron-coloured dog to eat sorcerers' spells, send long-dead old folk to assist
    the exorcist, and bring a fiery-edged sword of the air.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage identifies the fiery-edged sword of the air in the cited charm
    as a thunderbolt.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Vainamoinen, titled the old man and diviner as old as time, is asked to bring
    a scythe from Estonia and a reaping-hook from hell to facilitate childbirth; Ukko
    is said to perform a similar function with a golden axe or club.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A variant says Vainamoinen put six or seven seeds into a martin-skin bag and
    went to sow the earth with trees.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A riddle says Vainamoinen's milk-bowl upset upon a rock and gives the answer
    as sunshine.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Streamers on the sea after a storm are called the tracks of Vainamoinen's
    boat or the path of Vainamoinen.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Sandy ridges and furrows in parts of Sordavala are called the ploughing of
    the Vainamoinens; the passage says that in this area Vainamoinens, giants, Hiisis,
    and Lapps can mean the same supernatural beings.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: 'Vainamoinen''s name is borne by celestial bodies: Orion''s belt is called
    his scythe, and the Pleiades his bast-shoe.'
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: Vainamoinen and his wife are described as setting to work to sweep the sea
    and mop the waves with a broom.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The passage says Vainamoinen was clearly regarded as a god of the healing
    art and as a special friend of the wizard or exorcist summoned to eject disease-causing
    evil spirits.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:16
  text: A fisherman invokes Ahti, the sea god, to send fish to listen to the music
    of Vainamoinen; the passage explains this music as the fisherman's own charms
    and incantations attributed to the immortal singer.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:17
  text: Healing formulas request the Virgin Mary to take Vainamoinen's belt and yellow
    cloak to bind a cut vein, tell a bee to fetch a honeyed wing from his belt, and
    salute bath steam as Vainamoinen's sweat.
  category: action
  evidence_refs:
  - ev:13
