  text: The passage states that little can be learned from the text about Kaleva and
    suggests that the tradition about him may have been fading or his importance exaggerated.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lencqvist describes Kaleva as a giant and as father of twelve sons, with Hiuisi,
    Soint, Vainimoinen, and Ilmarinen among the remembered names.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Riddles explain the sons of Kaleva as roof rafters in a bath-house, whose
    projecting ends are washed by falling rain in the yard.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Agricola regarded the sons of Kaleva as benevolent divinities of the Tavastlanders
    who mowed meadows and similar places.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage compares these mowing sons of Kaleva with Tyrolean Selige Fraulein
