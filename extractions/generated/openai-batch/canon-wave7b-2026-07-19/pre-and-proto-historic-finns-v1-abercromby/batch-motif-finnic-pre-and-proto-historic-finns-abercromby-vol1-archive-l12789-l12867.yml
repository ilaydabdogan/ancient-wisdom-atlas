canonical_text:
  quote: ''
  summary: The passage surveys traditions about Kaleva, describing him as a giant
    and father of twelve sons, associating his sons with giant size, meadow-mowing
    benevolent divinities, and named figures. It links Kaleva and related figures
    to vegetation, fields, wells, brewing, water emerging from rock or mountain, the
    quenching of Fire, and an oath sworn by Iron before God on Kaleva’s shoe.
  language: English
  quote_policy: summarized
