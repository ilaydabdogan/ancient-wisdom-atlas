  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: An anonymous author from 1778 says that Kaleva covered fields with green grass
    and filled country barns with new hay.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
