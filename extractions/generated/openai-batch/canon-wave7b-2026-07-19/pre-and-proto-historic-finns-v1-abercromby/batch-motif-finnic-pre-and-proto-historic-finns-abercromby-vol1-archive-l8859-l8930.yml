canonical_text:
  quote: ''
  summary: The passage discusses inferred Iranian-period cultural contacts among Finnic
    and Ugric groups, then reports Abu el Kassim's account that Bolgars transported
    sword blades to the Yugra. The Yugra bought the blades at high price and threw
    them into the Sea of Darkness. God then caused a huge fish to come from the ocean,
    pursued by a still larger fish; the first fish fled into shallow coastal water,
    where the Yugra surrounded it in boats and cut off its flesh. They held that without
    throwing a sword into the sea, no fish would come and famine would follow.
