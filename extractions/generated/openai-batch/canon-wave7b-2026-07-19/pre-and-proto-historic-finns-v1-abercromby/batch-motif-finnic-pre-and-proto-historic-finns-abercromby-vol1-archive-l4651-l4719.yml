canonical_text:
  quote: ''
  summary: The passage catalogs anthropomorphic, animal, and ornamental bronze objects,
    iron tools, beads, pottery, and related finds from an earlier Iron Age context
    in eastern Russia. It then reports an excavator's view that the site was a Cudish
    place of sacrifice, probably connected with Voguls, and cites a modern Vogul practice
    in which divine demands for offerings are known through a shaman and must be fulfilled
    promptly; if fulfillment is impossible, a figure of the sacrificial animal is
    cut from birch bark.
  language: English
  quote_policy: summarized
