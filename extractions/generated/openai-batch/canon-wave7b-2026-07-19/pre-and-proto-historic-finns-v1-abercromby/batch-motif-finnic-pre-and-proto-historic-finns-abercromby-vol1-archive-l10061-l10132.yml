  summary: The passage describes social, familial, domestic, agricultural, dietary,
    musical, transport, and clothing terms said to have entered or changed in the
    Seventh or Tatar period. It notes altered social equality, hospitality terms,
    formalized marriage arrangements and bride price, new house features and courtyard
    structures, domestic animals, transport by wagon and riding animals, agriculture
    and gardening, cooking and drink, weaving tools, and more splendid clothing materials.
  language: English
