canonical_text:
  quote: ''
  summary: The passage describes wizards or shamans as spirit-chosen interpreters
    of the invisible world, often inheriting their office and using mimicry, dramatic
    ascent or descent performances, familiar spirits, drums, drum divination, deity
    images, and sacrificial procedures to mediate between humans and spirits or gods
    among several Siberian and Finno-Ugric groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Certain men are described as showing unusual behavior, fits, spasms, incoherent
    raving, and related signs interpreted as possession by a spirit and fitness to
    interpret the invisible spirit-world.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Buriats, Altai Turks, and Yakuts are said to recognize such signs as indicating
    that a youth has been specially chosen by the gods to act as a shamanic figure.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wizard's power is described as generally passing from father to son because
    partial mental alienation is said to run in families.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The young shaman had to imitate animal sounds, including eagle, goose, raven,
    snake, and horse sounds, when pretending to ascend to the sky or descend to lower
    regions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The shamanic journeys are described as dramatic representations rather than
    verbal reports, with the shaman playing many invisible characters and animals
    by changing voice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The wizards and seers are described as originally not using magic to thwart
    or coerce a god, but as answering practical questions such as causes of illness,
    sacrificial acceptability, and the location of lost animals.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Friendly familiar spirits are said to be available to the wizard and able
    to inquire of higher spirits with whom the wizard cannot converse directly.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A drum is used to summon distant familiar spirits, who are supposed to place
    themselves inside the drum when they arrive.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The drum can produce varied tones, including hollow sounds associated with
    depths of the earth, sharp raps marking a decisive point, and loud tumultuous
    sounds depicting conflict.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: 'Some drums have red designs: upper figures for gods and sky, lower figures
    for the lower world, and a central horizontal band for the earth.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: A ring or similar object moves over the drum surface, and its stopping place
    is observed to give information about persons and things above, below, or on the
    earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: For the Samoyedes, the wizard is described as an interpreter of the spirit-world
    whose drum sound penetrates to the world of spirits and awakens them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Among the Ostiaks, a spiritual man connected with clan gods acts as seer,
    priest, and doctor; he consults the gods and explains their replies rather than
    answering directly.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Among the Ostiaks, Tiirm is said to be inaccessible to mortals, and the drum
    is indispensable because an ordinary voice does not reach the gods.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Among the Voguls, the wizard determines sacrificial offerings, serves as medium
    between god and human, leads important religious acts, and signals assistants
    to slaughter the sacrificial animal.
  category: action
  evidence_refs:
  - ev:8
