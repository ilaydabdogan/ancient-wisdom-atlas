canonical_text:
  quote: ''
  summary: 'The passage summarizes West Finnish forest beliefs and charms: forest
    beings are invoked to release game to hunters, protect cattle from bears, provide
    honeyed healing substances from Metsola/Tapiola, and explain Hiisi as a forest
    or hill divinity associated with sacred groves, mountains, game-driving, and tree-riddle
    imagery.'
  language: English
  quote_policy: summarized
