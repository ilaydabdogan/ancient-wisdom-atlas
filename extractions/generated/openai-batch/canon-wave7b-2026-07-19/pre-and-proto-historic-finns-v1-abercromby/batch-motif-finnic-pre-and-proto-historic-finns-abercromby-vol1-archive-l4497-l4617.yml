canonical_text:
  quote: ''
  summary: The passage argues for an early Finnish presence and gradual movement near
    Lake Peipus, surveys sparse early Iron Age evidence in Eastern Russia, and focuses
    on the Gliadenova site near Perm. The Gliadenova finds are described as a large
    deposit in a fortified high-ground setting with ashes, burnt bones, and many objects
    interpreted by the author as possible sacrificial or votive offerings, including
    bronze human and animal images, snake, bird, and bee cutouts, a cast beardless
    human head, and bear reliefs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Finnish groups are described as entering in small parties around both ends
    of Lake Peipus and later attacking and supplanting earlier settlers as their numbers
    increased.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Early Iron Age traces in the described part of Russia are said to be scanty,
    with Roman coins of the first two centuries found at Mokšansk and Saransk.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage describes a large region from the head of the Gulf of Finland
    to the bend of the Volga as nearly without iron until later Volga-directed trade,
    while local Finnish populations are said to have mainly used stone and bone with
    rare copper and iron articles.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Gliadenova station is placed near Perm within a ditch-and-rampart prehistoric
    or Cudish fort on high ground near the ancient bank of the Kama, with an open
    space covered by ashes and burnt animal bones.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Excavations by Mr. Novokreščennikh in 1896 and 1897 brought about 23,000 objects
    to light at no great depth among bone fragments and ashes of burnt wood.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The site is described as seeming to have been a place of sacrifice, and the
    discovered objects are described as possible votive offerings made of gold, bronze,
    iron, flint, bone, and glass beads.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: Two Indo-Bactrian coins, one attributed to Kadphises I and another of later
    date, are used to place the finds in the second or third century A.D.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Bronze objects include human and animal figures and representations of birds,
    snakes, and bees cut from sheet bronze; cast bronze examples include low-relief
    human or animal figures on round flat disks with suspension rings.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: A cast bronze object is described as the head of a beardless man with a distinctive
    headdress and two depending grooved bands; the author notes but questions a possible
    reading of the bands as hair plaits.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Several castings represent the head and shoulders of a bear in high relief,
    framed by a cord pattern, and some have a suspension ring.
  category: object
  evidence_refs:
  - ev:10
