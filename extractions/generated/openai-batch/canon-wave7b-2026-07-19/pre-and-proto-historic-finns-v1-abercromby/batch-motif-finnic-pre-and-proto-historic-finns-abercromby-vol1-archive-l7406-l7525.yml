canonical_text:
  quote: ''
  summary: The passage reconstructs prehistoric Finnic domestic life, including lake-shore
    habitation, simple summer and winter dwellings, a central domestic fire treated
    as non-cultic, sparse furnishings, women’s sewing, spinning, and weaving, plain
    cookery, and the later emergence of milking and churning among some groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage places traces of neolithic habitation in suitable lake-shore localities.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The summer dwelling is described as a simple conical frame of light poles
    covered with bark, hides, or turf, with a central fire, smoke aperture, and a
    likely south-facing door.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: For northern winters, people are described as using partly underground huts
    made from an excavation roofed with poles and covered with turf.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Although the author finds no common word for village, he states that ancient
    Finns were unlikely to have lived permanently in isolated dwellings far from neighbours.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A word for fire is said to be common to Ugric, East Finnic, and West Finnic
    groups; the author infers that fire was neither sacred nor an object of worship,
    though its warmth was valued.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Fortified refuges with rampart and ditch are said to have been unknown in
    remote prehistoric times, while furniture in the hut is described as almost absent
    and animal skins were used for sitting and sleeping.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Women are described as caring for children and, in smoky huts, sewing boots
    or clothing with bone needles and sinew.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Women are also described as spinning fibre into thread, winding it into a
    ball, and using it for sewing or weaving on a simple loom.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: 'Food preparation is described as plain: fish and flesh were generally eaten
    raw, fat meat formed the basis of broth, and broth was boiled in a fire-resistant
    pot or with hot stones.'
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The absence of a common word for milk is used to infer that there were no
    domestic milking animals in the first period; later, Mordvins and West Finns are
    said to have learned milking and churning.
  category: sequence
  evidence_refs:
  - ev:10
