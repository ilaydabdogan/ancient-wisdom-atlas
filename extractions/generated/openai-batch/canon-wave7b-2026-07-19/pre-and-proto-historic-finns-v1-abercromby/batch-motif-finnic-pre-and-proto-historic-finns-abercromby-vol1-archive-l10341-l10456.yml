canonical_text:
  quote: ''
  summary: The passage surveys spells and invocations addressed to Ukko. He is described
    as a sky, air, thunder, and lightning god who uses fiery weapons, gives household
    fire and rock-salt, controls snow, rain, storms, hail, clouds, and water, protects
    cattle and people, counters witches, sorcerers, spells, and disease, and is later
    treated as a more all-powerful father or Creator figure. It also describes Ukko
    producing three Luonnatars who become mothers of iron, and notes that no sacrifices
    or promised offerings are made to Ukko, comparing this with some neighboring sky-god
    traditions.
  language: English
  quote_policy: summarized
