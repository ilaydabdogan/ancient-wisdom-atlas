  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ukko is invoked for bridal protection and betrothal, for battle protection
    through fiery garments, walls, and swords, and for protective fences, shields,
    and horns against sorcerers.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:7
  text: Ukko is asked for hunting equipment, to stop bleeding with turf or his thumb,
    to grow skin over a wound, and to prepare healing salves from water, honey, fish,
    butter, fat, and bacon.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: Ukko, called the aerial god and Creator on high, is said to give birth to
    three Luonnatars by rubbing his hands against his left knee; the Luonnatars are
    to become mothers of iron.
  category: action
  evidence_refs:
  - ev:9
- id: obs:9
  text: 'The passage states that no sacrifices are made to the sky god among Voguls,
    Ostiaks, and some Votiaks, and says the same seems true of the West Finns: Ukko
    is asked for help, but nothing is offered or promised in return.'
  category: relationship
