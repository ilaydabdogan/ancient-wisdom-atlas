    for travel, warfare, crop growth, salves, childbirth aid, concealment on rapids,
    and the treatment of burns.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ukko is invoked to watch cattle at pasture, make summer and the landscape
    favorable, hide the flock under a cloud, and turn cows temporarily into stumps
