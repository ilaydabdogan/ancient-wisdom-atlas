  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Luonnotar is asked in different charms to show the way for a bridal procession,
    to bewitch sorcerers, crush witches, weave a cloth of gold and silver, and make
    a defensive shirt for an exorcist.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: In two charms, Nature is listed together with the Creator and God on high
    as the power asked to save soldiers, crews, or an individual from danger and spells.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Luonnotar is also described as a furious old wife who sweeps the sea and mops
