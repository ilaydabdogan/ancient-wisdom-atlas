  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Old mother Kave, identified as a daughter of nature, the oldest of womankind,
    and first mother, is invoked to inspect pains and remove them and to help an exorcist.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Kave is asked to ease childbirth pains on the ground that she formerly freed
    the moon from a cell and the sun from a rock.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Three Luonnotars are described as sitting where three roads meet and gathering
