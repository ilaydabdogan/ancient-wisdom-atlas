  category: speech
  evidence_refs:
  - ev:12
- id: obs:17
  text: Suvetar and Etelatar are asked to bore field-holes for liquid honey, sink
    a well, provide rivers of milk, feed cows, restore carried-away milk through a
    sky horn, tend swine in the woods, clean the byre, bring luck, and make a golden
    comb or silver brush for cattle.
  category: sequence
  evidence_refs:
  - ev:13
