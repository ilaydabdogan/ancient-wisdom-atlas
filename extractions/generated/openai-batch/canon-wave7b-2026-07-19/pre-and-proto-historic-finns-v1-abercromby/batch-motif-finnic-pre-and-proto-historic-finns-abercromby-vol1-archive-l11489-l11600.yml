canonical_text:
  quote: ''
  summary: The passage surveys Finnish charm and mythic material concerning Luonto
    or Luonnotar as a female personification of nature, including three Luonnotars
    as creators or mothers, nature daughters connected with mist and disease origins,
    Kave as a primordial mother invoked for healing, Luonnotar in anti-pain and anti-sorcery
    charms, Nature’s apparent merging with the Creator/God in some charms, a sea-sweeping
    toothache-origin episode, and Suvetar/Etelatar as summer or south-wind figures
    invoked for crops, herds, milk, honey, and cattle luck.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage explains Luonto as a term connected with creating or beginning
    and treats Nature not as external nature but as a female personification of the
    force behind it.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three Luonnotars are said to have created the birch-tree.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ukko, described as the aerial god and Creator on high, produces three Luonnotars
    to be mothers of iron; they later milk iron from their breasts.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Udutar, called a daughter of nature, and Terhetar sift mist in a sieve at
    the end of a misty promontory, giving origin to fevers and pleurisy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nature’s daughters are placed near a sky setting where the bear is born on
    the horns of the moon and the back of the seven stars.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: In one narrative, three Luonnotars walking by the sea see Syojatar’s spittle
