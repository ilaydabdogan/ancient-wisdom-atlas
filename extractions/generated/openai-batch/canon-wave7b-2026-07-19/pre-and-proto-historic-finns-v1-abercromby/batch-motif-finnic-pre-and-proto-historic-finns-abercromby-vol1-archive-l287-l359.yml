  text: The Mordvins are described as linguistically nearest to the Western Finns
    and as dispersed across several governments on both sides of the Volga.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mordvins are divided into two major divisions, the Mokša and the Erza,
    with the Erza predominating numerically.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Mordvin country west of the Volga is described as partly covered with
