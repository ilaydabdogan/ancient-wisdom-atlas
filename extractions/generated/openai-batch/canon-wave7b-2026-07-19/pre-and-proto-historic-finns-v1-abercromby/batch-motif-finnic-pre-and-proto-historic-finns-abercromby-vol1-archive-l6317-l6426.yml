canonical_text:
  quote: ''
  summary: The passage catalogs reported beliefs among Samoyedes, Ostiaks, Votiaks,
    Ceremis, Mordvins, Lapps, Turks of the Altai, and inferred prehistoric Finns concerning
    animal and food taboos, disease causation, ancestor neglect, postmortem perception,
    deceased relatives drawing the living toward the dead, funerary effigies, finite
    spirit survival, and wizards or exorcists as mediators with unseen powers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Samoyedes are reported to avoid certain bear-related food dangers, including
    a risk attached to eating bear flesh and a prohibition against eating fish and
    bear meat in the same meal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ostiaks are reported to interpret being eaten by a bear, drowning, fire injury,
    or accident as likely punishment for perjury during a person's lifetime.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Votiaks are reported to say that the bear originated from man and understands
    human speech, that a dog killed with a stick may revive if the weapon is not left
    on its body, and that the Milky Way prevents migrating wild geese from losing
    their way.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sickness is reported as sendable by an evil-disposed person or by God, and
    fever and ague are attributed by Votiaks to an evil spirit named Per2ino who is
    appeased with food offerings.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ceremis are reported to imagine disease-causing spirits being recruited from
    old maids, murderers, and those who died violently; Mordvins are reported to connect
    sterility, family sickness, and cattle plague with neglect of ancestors.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Lapps are reported to interpret dangerous illness as a deceased relative wanting
    the sick person's company in the region of the dead, while the passage says Turks
    of the Altai have a similar belief about the soul lingering and taking family
    members or cattle.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Votiaks and Ceremis are reported to believe that the dead retain perception
    for some time after death or until burial, and Ceremis are reported to believe
    unmarried youths may marry in the next world.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: When a respected Ostiak dies, relatives make a figure of him, honor it in
    domestic routines for three or four years, and then throw it into the grave; the
    passage links the end of immortality with the corpse having become dust.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The author infers that prehistoric Finns probably attributed sudden sickness
    to ill wishes, oath or taboo violation, or neglect of deceased ancestors, and
    that they considered something of the dead person to survive only temporarily.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: The author states that prehistoric Finns probably had recourse to wizards
    and exorcists credited with communicating with the unseen world and interpreting
    gods and invisible spirits.
  category: action
  evidence_refs:
  - ev:8
