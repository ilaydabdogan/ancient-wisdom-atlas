  quote: ''
  summary: 'The passage discusses Neolithic material finds in the Baltic Provinces
    and adjacent regions: double-cone arrowheads, amber and animal-tooth ornaments,
    reindeer-bone evidence, scarcity and distribution of stone implements, possible
    imports, scholarly period attributions, and a hypothesis that the Baltic Provinces
    may not have been permanently inhabited in the earlier Neolithic.'
  language: English
