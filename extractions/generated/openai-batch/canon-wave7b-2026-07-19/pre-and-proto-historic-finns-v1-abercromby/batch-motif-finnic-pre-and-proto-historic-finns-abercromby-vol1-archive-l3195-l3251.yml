  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Baltic Provinces, chisels are described as rare and gouges, knives,
    spear-heads, and arrow-heads as almost wanting; the scarcity of spear- and arrow-heads
    is attributed to the rarity of flint.
  category: object
  evidence_refs:
  - ev:3
