    from south-west Finland or Sweden.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Virchow is reported as believing that most polished stone implements in the
    Baltic Provinces belong to the Iron Period, because they are sometimes found in
    the same grave with bronze and iron.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'Stone-tool and weapon finds are described as unevenly distributed: few in
    Esthonia except Oesel and Mohn, more in Livland especially along the Dvina, and
    most plentiful in central and eastern Kurland.'
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: J. R. Aspelin is reported as considering Baltic stone implements so similar
    to those from Lithuania, Vitebsk, Kovno, Grodno, and Minsk that they can scarcely
    be distinguished.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says the evidence is scanty but suggests that in the earlier Neolithic
