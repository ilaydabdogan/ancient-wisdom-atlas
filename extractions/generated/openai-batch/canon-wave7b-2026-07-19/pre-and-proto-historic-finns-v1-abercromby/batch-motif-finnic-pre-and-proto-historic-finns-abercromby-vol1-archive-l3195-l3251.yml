- id: obs:3
  text: Grewingk considered the station at Rinnekaln younger than Kunda because no
    reindeer bones were found at Rinnekaln, with the presumption that reindeer were
    extinct in Livland when the shellmound formed.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that during one Neolithic period the reindeer seem to have
