canonical_text:
  quote: ''
  summary: The passage surveys Finnic charms and mythic episodes involving maidens
    of the air, clouds, springs, dells, swamps, mist, and fog. These female beings
    are invoked to cool burns, extinguish fire, heal wounds, repair veins, provide
    protective fog, and participate in several origin episodes in which oak trees
    or healing ointments arise from ash, tears, a comb tooth, milk, or other materials.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Maidens of the air, springs, dells, swamps, and similar places are described
    as beneficent beings often invoked to extinguish fire and cool burns.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In one oak-origin episode, four maidens mow and dry hay on a misty cape or
    foggy island; a fiery Tursas from Turjaland burns the hay, the ash is blown to
    the banks of a holy stream, and a splendid oak grows from it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In another version, four maidens make hay; a boy from Pohjola or an eagle
    from Turja burns it, puts the ash in a wallet, carries it to Lapland, sows it
    in black mud, and a huge oak grows from it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In another version, four maidens find and plant an oak sapling on an island
    formed where three rivers flowed from a tear shed by a Kyytdéldinen.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In fire-injury charms, named or unnamed daughters of the air are asked to
    bring water, frost, ice, or cooling substances to burns, or to enable fire to
    be handled without harm.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
- id: obs:6
  text: After Ukko strikes fire in the sky and puts it into a golden bag, he gives
    it to an Air-maiden to rock; she lets it fall to the earth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:7
  text: Cloud or rainbow maidens are described wiping away burn pain, carrying slush
    and ice to extinguish fire, or being raised from a swamp to repair fire injury.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:8
  text: A little girl or woman appears at the edge of a rainbow; while smoothing her
    hair, milk from her breast overflows onto a honey-dropping meadow, and salves
    and ointments are obtained from it.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:9
  text: A maiden in the air lets fall a skein of veins and a roll of skin; pieces
    of skin from them are used on wounds from wolf teeth or bear claws.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:10
  text: A maiden from above the air is asked to come in a copper boat with honeyed
    oars, row around an iron wound, arrange veins properly, and stitch vein ends with
    needle and silk thread.
  category: action
  evidence_refs:
  - ev:13
- id: obs:11
  text: Suonetar is described as a beautiful woman of veins who spins veins from a
    golden tuft on a copper spinning-rock, weaves a cloth of veins, and is invoked
    to tie up broken vein ends.
  category: action
  evidence_refs:
  - ev:14
- id: obs:12
  text: Maidens from dells, springs, or swamps are invoked to gag Fire’s mouth, weigh
    down Panu’s head, bring cooling substances, throw water on burns, fetch love-water
    for washing a child, or fetch empowered water from Jordan.
  category: action
  evidence_refs:
  - ev:15
  - ev:16
  - ev:17
- id: obs:13
  text: A maiden from a dell, humid earth, spring, or swamp holds a copper box with
    a golden comb; one tooth falls from the comb, and a splendid oak grows whose head
    reaches the sky and whose branches hold the clouds.
  category: sequence
  evidence_refs:
  - ev:18
- id: obs:14
  text: Mist- and Fog-Maidens, including Auteretar, are invoked to sift down mist
    and fog so an enemy cannot see to attack or escape.
  category: action
  evidence_refs:
  - ev:19
- id: obs:15
  text: The Maid of Mist and Fog is asked to make a shirt or cloak of mist as protection
    against sorcerers and Lapps.
  category: action
  evidence_refs:
  - ev:20
- id: obs:16
  text: A mist/fog figure is invoked to scatter fog from a sieve before wild animals
    approaching a hunter, giving him time to prepare his bow.
  category: action
  evidence_refs:
  - ev:21
