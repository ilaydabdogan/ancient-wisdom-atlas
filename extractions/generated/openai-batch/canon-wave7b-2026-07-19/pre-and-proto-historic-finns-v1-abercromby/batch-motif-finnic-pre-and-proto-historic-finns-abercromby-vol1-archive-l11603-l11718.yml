candidate_motifs:
- id: motif:1
  label: Beneficent maidens invoked to cool burns and extinguish fire
  taxonomy_refs: []
  basis: The passage repeatedly describes air, cloud, rainbow, dell, spring, swamp,
    mist, or frost maidens as beings called on to bring water, ice, frost, slush,
    or salves for burns and fire injuries.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:6
  - ev:9
  - ev:10
  - ev:15
  confidence: high
  cautions: This is a passage-level functional motif rather than a supplied taxonomy
    family.
- id: motif:2
  label: Miraculous oak growing from transformed small material
  taxonomy_refs:
  - sacred_tree_axis
  basis: Several episodes explain the growth of a splendid or huge oak from ash, a
    planted sapling, or a fallen golden-comb tooth; one oak reaches the sky and holds
    the clouds.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:18
  confidence: medium
  cautions: The supplied taxonomy reference is supported most directly by the sky-reaching
    oak; other oak-origin versions mention size and splendor but not explicitly an
    axis function.
- id: motif:3
  label: Lost or fallen sky-fire reaches earth
  taxonomy_refs: []
  basis: Ukko strikes fire in the sky and gives it in a golden bag to an Air-maiden,
    who carelessly lets it fall to earth.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage gives the sequence but does not elaborate its wider consequences
    beyond the fall to earth.
- id: motif:4
  label: Healing substances arise from a female body fluid
  taxonomy_refs: []
  basis: Milk overflowing from a female figure on the edge of a rainbow falls on a
