candidate_motifs:
- id: motif:1
  label: Tribute exchanged for hunting success
  taxonomy_refs:
  - sacred_exchange
  basis: The hunter offers groats, salt, tribute, or gold and asks forest powers to
    send animals into traps or release animal wealth.
  evidence_refs:
  - ev:2
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage summarizes hunting prayers and charms rather than presenting
    a single narrative episode.
- id: motif:2
  label: Ranked forest realm with castles and rulers
  taxonomy_refs: []
  basis: Tapio's abode has several names, and the forest is imagined with forts or
    castles inhabited by forest lassies, mistresses, and a master.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The internal arrangement of the three forts is briefly and somewhat ambiguously
    reported.
- id: motif:3
  label: Marriage or service alliance with forest beings for game
  taxonomy_refs:
  - sacred_marriage
  basis: The hunter offers to serve Tapio and asks that his men be married to the
    daughters of the woods as part of the appeal for hunting success.
  evidence_refs:
  - ev:4
  confidence: low
  cautions: The marriage language occurs in a hunting prayer context and should not
    be assumed to represent a full sacred-marriage myth without further evidence.
- id: motif:4
  label: Female forest spirits nurse, guard, and drive animals
  taxonomy_refs: []
  basis: Hongatar and Tuometar nurse or rock the bear; woodland sprites muzzle bears;
    other female forest beings chase, fetch, and drive game.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage lists multiple invocations and may combine separate charm
    formulas.
- id: motif:5
  label: Locked storehouse of game animals
  taxonomy_refs: []
  basis: Wild animals are said to be kept in a magazine, storehouse, honeyed chest,
