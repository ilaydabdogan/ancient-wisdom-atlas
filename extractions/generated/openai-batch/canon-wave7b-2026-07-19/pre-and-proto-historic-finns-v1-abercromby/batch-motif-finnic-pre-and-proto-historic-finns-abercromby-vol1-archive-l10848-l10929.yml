canonical_text:
  quote: ''
  summary: The passage describes Tapio's forest abode, ranked forest dwellers, and
    hunting prayers in which hunters offer tribute, request exchange, seek marriage
    or service relations with forest beings, ask spirits to guide or drive game, and
    ask female forest powers to open storehouses containing animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tapio's abode is named Tapiola, Metsola, Havulinna, and the famous village
    of the woods.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The forest is sometimes imagined as containing three forts or castles of wood,
    bone, and stone, with forest lassies, mistresses, and the master of the forest
    associated with them.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Prayer alone is said not always to be enough for Tapio and his family; an
    offering may be required.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A trapper or hunter asks forest powers to accept groats, salt, or other tribute
    in return for sending animals into traps.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'One prayer frames the transaction as an exchange of gold: the hunter''s Swedish
    gold against Tapio''s wild animals with valuable furs.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The bear is described as a forest animal nursed by Hongatar and rocked by
    Tuometar at the foot of a stunted fir.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Woodland sprites are asked by a bear-hunter to muzzle their 'dogs,' glossed
    in the passage as bears, until he can approach them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The hunter says he is willing to become Tapio's man-servant or arrow-picking
    boy if Tapio will be favorable.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The hunter asks the forest to marry his men to the pleasant daughters of the
    woods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Annikki is asked to wake the king of the forest or the forest-mistress if
    Tapio is asleep.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The forest is invited to play the kantele so that wild animals will listen
    and be attracted toward the hunter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Forest figures are invoked to show the hunter the direction to take by setting
    up posts and landmarks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Several forest beings are asked to beat the wilderness, chase animals, fence
    them in with hands, remove obstacles, fetch animals from Lapland, send the best
    of their flock, or drive game with whips.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:14
  text: Mielikki is asked either to send animals very near the hunter or to support
    his bow or steady his gun so he can shoot a squirrel and pay his tax.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Wild animals are represented as kept in a magazine, storehouse, honeyed chest,
    or money magazine, which Mielikki or Kuuritar is asked to open so animals can
    be released for the hunter.
  category: object
  evidence_refs:
  - ev:9
  - ev:10
