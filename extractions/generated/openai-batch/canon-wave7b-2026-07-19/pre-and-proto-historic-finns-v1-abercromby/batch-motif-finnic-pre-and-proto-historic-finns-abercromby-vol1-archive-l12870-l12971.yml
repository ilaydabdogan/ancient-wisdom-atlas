canonical_text:
  quote: ''
  summary: The passage catalogues Finnish terms for wizards, sorcerers, witches, seers,
    diviners, ecstatic practitioners, singers, and exorcists; distinguishes generally
    harmful and beneficial magic; describes the sorcerer’s northern origin, appearance,
    naked ritual state, weapons, arrows, curse speech, and widespread presence; and
    describes exorcists as singers who expel disease, receive power through washing,
    lineage, learned songs, northern teachers, maternal ability, and later Christian
    divine words.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists many Finnish appellations for wizard, sorcerer, witch, seer,
    ecstatic, diviner, reciter, song-man, archer, and related practitioners, and notes
    that some terms are native while others are foreign loans.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says there is no hard division between good and bad categories,
    but it generally associates injurious or black magic with certain sorcerer, archer,
    witch, and bag-man terms, and beneficial or white magic with exorcistic reciters
    of Magic Songs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Where the type of wizard is not clear, the passage proposes calling the disease-expelling
    reciter an exorcist.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: The sorcerer or fortune-teller is said to have been born beyond the limits
    of the north, on the flat land of the Lapps, on fir boughs and a stone pillow.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sorcerer is described as having a nose like an eagle’s beak, wearing a
    tall hat, and being naked when exercising magical arts.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Sorcerers are said to drink water from a pool in the croup of Hiisi’s horse
    and to make the water hiss while drinking.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The offensive weapons of sorcerers, wizards, archers, and witches are described
    as iron knives, pointed iron, shooting instruments, arrows, and steel knives.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage explains that these weapon expressions are usually not literal
    weapons but imply sickness, disease, or injury caused by spells, though it also
    notes possible footprint magic and image magic with knives, nails, pins, roasting,
    or melting.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Sorcerers’ arrows are said to be made from a tall fir on the Hill of Pain
    or from chips of a huge or fiery oak made into disease-causing arrows by a scoundrel
    or Hiisi’s son.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The disease effects attributed to the arrows include stitch, pleurisy, sudden
    horse sickness, and elf-shots in cattle.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Wizards, sorcerers, witches, and diviners are said to be present at gates,
    fences, roads, damp dells, near water, and everywhere.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:12
  text: A cursing spell may be repeated in a whining or mumbling voice and is said
    to be bitten off with the teeth; spells or Magic Songs are said to be brought
    from the north, from Lapland.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: An exorcist requires a fluent mouth, ready tongue, and pliant fingers; one
    exorcist is made into a wizard, skilful man, and singer by being washed naked
    three times by his mother on the nether stone of a handmill during a summer night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Exorcists boast of northern, Turja, Lapp, sorcerer, and diviner connections,
    and of dependence on a father’s strength and inherited knowledge.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:15
  text: An exorcist also inherits power from his mother, who could bring back stolen
    milk from Mana, Tuonela, sorcerers, and other sources; the exorcist says he can
    do the same.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: The passage says an exorcist kills Sharp Frost and takes its clothing for
    protection; if he needs Magic Songs he can learn them from the old wife of Pohjola
    and learn the use of eagle’s claws.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:17
  text: At a later date, the exorcist wishes the Creator to speak for him and asks
    God to save a person from village spells and incantations by words made by the
    Creator and prescribed by the Holy Ghost.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:18
  text: By song or lay, an exorcist boasts that he can split or bisect the bones of
    a witch or sorcerer and feed that opponent on snakes and toads.
  category: action
  evidence_refs:
  - ev:8
