comparison_claims:
- id: claim:1
  claim: The passage presents several magical-practitioner terms as linguistically
    connected with neighboring or foreign languages, including Gothic, Swedish, early
    Slav, and Russian sources.
  claim_level: linguistic_similarity
  target: Foreign loanword layer in Finnish magical-practitioner vocabulary
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a lexical comparison reported by the source passage; the extraction
    does not verify etymologies independently.
- id: claim:2
  claim: Within the passage, northern and Lapp/Pohjola/Turja references repeatedly
    function as sources of sorcerous birth, spell words, lineage, and instruction.
  claim_level: same_function
  target: Northern/Lapp/Pohjola source-of-magic pattern
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a pattern within the supplied Finnic material and authorial
    summary, not evidence by itself for historical contact or shared origin.
- id: claim:3
  claim: The passage shows Christian divine names and divine speech serving an anti-spell
    and protective function similar to the exorcist’s Magic Songs.
  claim_level: same_function
  target: Christian invocation as protective exorcistic speech in Finnic charm context
  evidence_refs:
  - ev:1
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage only says this is at a later date and provides a summary,
    not a full comparative corpus.
