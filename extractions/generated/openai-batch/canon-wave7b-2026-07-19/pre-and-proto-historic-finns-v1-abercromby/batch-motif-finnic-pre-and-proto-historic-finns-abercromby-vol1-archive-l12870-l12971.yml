candidate_motifs:
- id: motif:1
  label: Harmful magic as missiles, knives, and disease
  taxonomy_refs: []
  basis: The passage connects sorcerers’ and witches’ weapons with sickness, disease,
    injuries, stitch, pleurisy, horse sickness, and elf-shots rather than always literal
    weapons.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage is an antiquarian summary of charm material and says some
    expressions may sometimes also refer to literal harmful acts.
- id: motif:2
  label: Northern land as source of sorcery and spells
  taxonomy_refs: []
  basis: The sorcerer’s birth, magic words, lineage boasts, and northern female teacher
    are all associated with the north, Lapland, Lapp land, Turja, or Pohjola.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  - ev:8
  confidence: high
  cautions: The passage reflects the author’s synthesis and charm citations; it does
    not independently describe historical northern practice.
- id: motif:3
  label: Exorcistic singer expels disease spirits
  taxonomy_refs: []
  basis: The passage says white magic and the bulk of Magic Songs are used for ejecting
    evil spirits of disease, and labels the disease-expelling reciter an exorcist.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: Individual Magic Song texts are not quoted in full here.
- id: motif:4
  label: Curse spoken as bitten-off speech
  taxonomy_refs: []
  basis: A cursing spell is described as whining or mumbling and as bitten off with
    the teeth, likened to biting thread from a clew.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage gives a brief explanation rather than a complete ritual performance.
- id: motif:5
  label: Initiation by triple washing on a stone
  taxonomy_refs:
  - initiation
  basis: An exorcist is made into a wizard, skilled man, and singer by being washed
    naked three times on the nether stone of a handmill by his mother.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The author adds an interpretation about hardening and strengthening; the
    extraction records only the literal washing sequence as basis.
- id: motif:6
  label: Inherited and taught magical knowledge
  taxonomy_refs:
  - wisdom
  basis: The exorcist claims spells from his father, strength of mind and knowledge,
    maternal power to retrieve milk, and further songs from the old wife of Pohjola.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The available taxonomy term wisdom is broad; the passage concerns practical
    magical songs and powers.
- id: motif:7
  label: Sympathetic harm through footprint or image
  taxonomy_refs: []
  basis: The passage mentions a sorcerer driving a knife or nail into an enemy’s footprint
    and alludes to roasting or melting an image into which pins or nails were first
    stuck.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The image magic is described as a vague allusion, and details are not
    fully supplied.
- id: motif:8
  label: Exorcist overcomes personified Frost
  taxonomy_refs: []
  basis: The exorcist boasts that Frost has no effect on him or his kin, kills Frost,
    and takes clothing from it for protection.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage gives only a compressed reference to the Frost episode.
- id: motif:9
  label: Christian divine words incorporated into anti-spell protection
  taxonomy_refs: []
  basis: A later exorcist asks the Creator to speak for him and asks God to save from
    village spells with words made by the Creator and prescribed by the Holy Ghost.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage describes a later development but does not provide the full
