  summary: The passage surveys Bronze Age finds in Finland, especially bronze weapons
    and cairn graves. It describes the artifacts as largely Swedish in character and
    probably imported through Sweden or Scandinavia, notes their distribution and
    chronology, and describes cairn graves with similarities to Swedish and especially
    Uppland examples, including central stones, stone kists, cremation, and occasional
    reports of unburnt human and animal bones.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bronze Age objects described are few in number and mostly weapons, including
    swords, daggers, a lance-head, knives, palstaves, socketed celts, spectacle fibulae,
    and a large copper arrow-head.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The objects are described as Swedish in character; no moulds have been found,
    and the passage says they must have been imported from Sweden or probably brought
    through Scandinavia.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Most objects came from south-western Finland, including the Aland Islands,
    the lower courses of the Kumo and Kyro rivers, and the area between Viborg and
    the west coast of Lake Ladoga; one copper arrow-head was found much farther north
    near Varanger Fjord.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nearly a third of the bronzes were found in cairn graves.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Using Montelius's classification, the passage assigns the weapons and other
    bronze items to several Bronze Age periods between 1450 and 650 B.C.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author states that intermittent communication existed between Finland
    and Sweden for several centuries.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Hundreds of cairn graves are described along the gulfs of Bothnia and Finland,
    on southern and south-western islands, and in the Aland Islands, with smaller
    numbers along inland lake shores.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Finnish cairn graves are said to correspond strongly in external form
    and partly in internal structure to cairn graves in Sweden, especially Uppland.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The cairns occur singly, in groups, or in long rows, and vary in diameter
    from about 20 to 81 feet and in height from about 3 to 10 feet.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Many cairns are arranged around a tall upright central stone, while others
    contain one or more stone kists made of flagstones or angular stones.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Cineration is described as the rule, if not universal; no skeletons had been
