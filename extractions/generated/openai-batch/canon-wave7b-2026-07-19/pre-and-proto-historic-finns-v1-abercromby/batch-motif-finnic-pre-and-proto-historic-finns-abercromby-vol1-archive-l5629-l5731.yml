canonical_text:
  quote: ''
  summary: The passage offers a cautious reconstruction of prehistoric Finnic religion.
    It argues that later Christian, Bolgar, Turkish, and agricultural influences must
    be discounted; that hunting-nomadic Finns should not be assigned agriculture-dependent
    earth-mother or sun-god worship; that early Finns lacked a developed natural/supernatural
    distinction; and that older gods were conceived as human-like, forceable, punishable
    beings residing in nearby trees, wells, rivers, and animals, before a later higher
    sky divinity was added.
  language: English
  quote_policy: summarized
