  summary: The passage discusses classical and modern attempts to identify and locate
    peoples in ancient eastern Europe and Russia. It questions whether the Budini
    lived east of the Don, rejects several proposed identifications with Finnic or
    neighboring peoples, and evaluates Ptolemy’s geographical information about the
    Volga, Don, Kama, and groups near the Don bend.
