canonical_text:
  quote: ''
  summary: The passage discusses cranial measurements from Baltic and neighboring
    regions, comparing Lettish, Lithuanian, Yatving, Esthonian, Hame, Finnish, and
    related populations in terms of cephalic, vertical, transvertical, and orbital
    indices. It concludes that some older Lettish and Lithuanian crania are described
    as dolichocephalous, that Esthonian crania do not match the average Hame type,
    and that the author sees evidence of mixture between Finns and a long-headed population
    such as the Letts.
  language: English
  quote_policy: summarized
