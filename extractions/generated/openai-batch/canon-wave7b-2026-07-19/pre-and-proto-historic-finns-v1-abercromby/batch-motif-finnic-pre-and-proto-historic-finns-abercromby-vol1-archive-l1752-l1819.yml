- id: obs:3
  text: The passage says that eleventh-century pagan cemeteries near Bielsk and Drohiczyn,
    in a region identified with Yatvings, yielded only dolichocephalous crania.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage adds ten crania from the three Baltic Provinces, measured by Dr.
    Weinberg and dated to burial places from the tenth to twelfth centuries.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author reviews Tables IV and VI to assess how far the Finnish skull type
