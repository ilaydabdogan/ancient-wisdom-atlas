canonical_text:
  quote: ''
  summary: The passage catalogues Finnic healing and exorcistic formulas in which
    Jesus, the Virgin Mary, Peter, spring or older maiden figures, and personified
    afflictions appear. Sacred water, blood, milk, spittle, salves, golden implements,
    fire, snow, stone, and other materials are invoked for healing wounds, stopping
    blood, countering venom, quenching fire, protecting against cold or enemies, removing
    spells, and banishing disease.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Healing water is described as taken from Jordan where Christ was baptized;
    other water is described as Jesus' washing water or tears, and a maiden from a
    spring is asked to bring water from Jordan.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: An exorcist declares that Jesus' blood and Mary's milk, said to have come
    from the sky, are used as ointment for wounds.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Jesus, described as lord of the air and a God dwelling in the sky, is asked
    to come to a sick son and use spittle as a healing ointment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Jesus is asked to protect a created child or soldier with a stone wall and
    iron enclosure, and to bring a fiery sword against wicked persons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A scene describes Jesus travelling over a red sea in a red sloop; red ointment
    trickles from the sails and yards and becomes a salve for injuries.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Jesus and Mary are asked to test salves; Jesus heals a horse's sprained leg;
    a cow-house snake bites Christ's horse and kills a foal, and Jesus and Mary are
    invoked if a snake will not remove venom.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Jesus and Peter meet a personified Cancer that says it is going to bewitch
    bones and make flesh putrefy; Jesus orders it under a thick flat stone where sun
    and moon do not shine.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mary receives epithets including dear mother, compassionate mother, holy handmaid
    of the sky, and holy little serving-maid; the passage says she sometimes replaces
    Air, Spring, or other maidens of an older period.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mary is described carrying veins, blood, bone, and flesh, and repairing a
    body by splicing a vein, replacing blood, fastening bone, and adding flesh.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'Mary is associated with golden healing objects and milk: she sits on the
    sea with a golden ring bearing six horns of cures, her breast milk becomes wound
    ointment, and she is asked to bring a golden cup and honeyed wing for a vapour
    bath.'
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Mary is asked to weave a gold or silver belt as a bandage, fetch snow from
    gloomy Pohjola to quench fire, stop bleeding with thumb or materials such as turf,
    flax, or birch-bark, and sew the wound with needle and silk thread.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Mary is asked to seize pains and plagues and throw them into the sea or wind,
    protect against cold with a fur coat and fire, anoint frostbite, and produce water
    from a rock with a golden staff to wash a girl.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: Mary is invoked to heal by the word of God, bring honey and water from the
    sky, use milk from her breasts, anoint with Jesus' blood, or use salves associated
    with Jesus.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: A ritual operator asks Mary to transform her skilled fingers into his or to
    use a golden hook to remove chaff from an eye; Mary, Jesus, and Peter also appear
    in formulas for gout, sleep, land, and water given after gelding a horse.
  category: speech
  evidence_refs:
