canonical_text:
  quote: ''
  summary: The passage surveys West Finnish spirit-beliefs as reflected in magic songs.
    It describes haltia as spirit-rulers or guardians of places, beings, and individuals,
    with examples from invocations. It then describes Ukko as an old sky, air, and
    thunder god with many honorific epithets, little family mythology, and golden
    or silver implements requested in childbirth, healing, hunting, and trapping contexts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The West Finns are said to have believed that lakes, streams, forests, heaths,
    swamps, trees, flowers, and living beings were inhabited or ruled by a spirit
    called a haltia.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that a haltia could be of either sex and that the word
    is an early Scandinavian loan-word meaning governor or ruler.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Examples from magic songs identify or invoke haltia figures connected with
    God, the Creator, life, the forest, cattle, a mountain, Earth, and individual
    luck.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: A snake is addressed as a ghost or phantom resembling a haltia, and a wizard
    summons his haltia from hidden places with details that the author reads as snake-like.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
