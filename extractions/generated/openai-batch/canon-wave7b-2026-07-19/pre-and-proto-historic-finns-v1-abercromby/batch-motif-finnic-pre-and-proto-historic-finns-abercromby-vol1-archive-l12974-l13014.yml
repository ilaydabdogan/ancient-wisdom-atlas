canonical_text:
  quote: ''
  summary: The passage describes an exorcist or ritual singer who boasts of disabling
    rival magical practitioners by song, sending them into rapids, controlling wolves,
    bears, adders, and snakes, gaining bodily hardness from a Hiisi companion, and
    possessing invulnerable or hardened skin. It then contrasts this boasting with
    passages where the exorcist is uncertain, asks how to proceed, stresses the difficulty
    of expelling disease spirits, uses protective clothing, and in a later Christianized
    setting depends on God, the Creator, the Lord, and Jesus in healing.
  language: English
  quote_policy: summarized
