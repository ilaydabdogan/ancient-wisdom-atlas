canonical_text:
  quote: ''
  summary: The passage closes a historical note on Baltic Finnic coastal settlement
    and then introduces a reconstruction of prehistoric Finnic civilisation through
    ethnography and philology. It proposes first and second prehistoric periods, describes
    Finn-Ugrian contact, Finnic movement into Europe and westward settlement, and
    discusses lexical borrowing, especially fear-based avoidance of names for spirits,
    divinities, sacred animals, and food animals, with Lapp and Finnish examples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that, in Kurland and Livland, place-name evidence suggests
    Finns occupied only a coastal fringe, and that the Finnish name for the Dvina
    is probably borrowed from a Slav dialect.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author turns from craniological, archaeological, and historical facts
    to comparative ethnography and philology as sources for reconstructing prehistoric
    Finnic conditions.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The prehistoric past is divided into a first and second period; the first
    is associated with words common to Ugrian and Finnish groups and with close contact
    between Finns and Ugrians in Asia.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says Finns and Ugrians were neighbours under similar conditions
    of life, while rejecting descent from a common stock on physical and craniological
    grounds.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage proposes that early neolithic inhabitants of Central Russia may
    have been ancestors of Finns who reached Europe and settled on the Oka.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Possible internal causes for movement are listed as natural increase of population,
    famine, and pestilence; natural increase is treated as the most efficient factor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author assumes that by the end of the first period the undivided Finns
    had entered Europe and that later settlements at Lake Ladoga and the Upper Volkhov
    indicate a westward movement.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The second period is described as the time between first European settlements
    and first contact with an Iranian civilisation, possibly four hundred to six hundred
    years before the present era.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage notes that borrowed words do not always represent new ideas, giving
    Lapp borrowing for “moon” and Finnish borrowing for “neck” as examples.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Names of spirits, divinities, sacred animals, and animals or fish caught for
    food are singled out as classes where borrowing or substitution may occur because
    of reluctance or fear.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says that a native might use an epithet, allusive term, or foreign
    borrowed word instead of a feared name.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Lapps are said to have used the Norwegian name Svor Junkare for powerful
    spirits whose real name they feared to use, and the Finns are said to have given
    a Scandinavian-origin name, printed as Aa/fa, to spirits of nature.
  category: speech
  evidence_refs:
