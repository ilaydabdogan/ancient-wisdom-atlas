  summary: A scholarly linguistic passage discussing proposed Iranian-period loanwords
    and semantic developments in Finno-Ugrian languages, including numerals, terms
    for lord/master, gold, iron, steel, otter, and goat. The passage evaluates several
    proposed etymologies and repeatedly marks some connections as doubtful or uncertain.
