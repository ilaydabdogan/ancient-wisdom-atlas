literal_observations:
- id: obs:1
  text: The passage says the Ostiaks had learned to count up to a thousand, but that
    the use of the same words for 80/800 and 90/900 suggests hazy arithmetic and that
    a thousand may have functioned mainly as a round number.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author connects the chronology of West Finnish and Mordvin words for ten
    with a possible borrowing of a word for one hundred between 600 and 700 B.C.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage reports Dr. Munkdcsi’s proposed derivation of Permian words for
    lord or master from a Skolotan or Scythian form, while also noting that the Osetan
    or Scythian identification is not thoroughly established.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage treats one set of words for gold as later than other listed forms,
    based on the way an initial Old Bactrian sound is represented.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that a term for iron likely came into use around the same
    time as the later gold vocabulary and that the new metal was introduced under
    a term meaning knife or short sword.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says the Magyars retained the original sense of the iron-related
    term, while the Mordvins changed the sword sense into plough-share and also have
    a special word for iron that may have an East Persian origin.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage places the word for steel later in the Iranian period and summarizes
    disagreement among scholars about whether the Osetan or East Finnish form is original.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage presents Colonel Yule’s connection of Marco Polo’s ondanique with
    New Persian vocabulary for Indian steel or a sword, and says the Osetan form is
    from that New Persian expression.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says the Permian words for otter may derive from an Iranian form,
    but might also be referred to a European word.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage marks one proposed equation as very doubtful because contact between
    Sanskrit-speaking people and protohistoric Finno-Ugrians is considered unlikely,
    while still allowing the possibility of a Scythian original because Scythian dialects
    are unknown.
  category: relationship
  evidence_refs:
  - ev:10
