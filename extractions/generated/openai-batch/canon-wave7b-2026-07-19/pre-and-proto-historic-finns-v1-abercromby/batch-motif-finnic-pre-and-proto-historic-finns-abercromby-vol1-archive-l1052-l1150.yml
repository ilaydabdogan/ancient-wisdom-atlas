canonical_text:
  quote: ''
  summary: The passage gives ethnographic and physical descriptions of Ecremis/Ceremis
    and Votiaks, contrasts Hill Ceremis with left-bank Volga Ceremis, discusses environmental
    explanations for physique, and reports historical notices and proposed affiliation
    of the extinct Méria/Merens with the Ceremis.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes the Ecremis with varied iris colour, usually small and
    sometimes slightly oblique eyes, and character traits including mildness, honesty
    as praised by Russians, poverty, shyness, mistrustfulness, obstinacy, and slow
    intellect.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dr. Papai is cited as observing white skin bronzed in uncovered places, predominantly
    dark hair with lighter tones also occurring, and eyes generally dark though medium
    and lighter tones are common and predominant among women.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Hill Ceremis are said to differ markedly from those on the left bank of
    the Volga by being taller and stronger, while the overall face type is described
    as the same in both groups.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The left-bank Ceremis are described as living among large swamps and extensive
    forests, drinking bad water, having insufficient and improper food, and suffering
    from fevers, lung disorders, goitre, and premature old age.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Méria are described as an extinct people generally believed to be of the
    same stock as the Ceremis, with this belief linked to name resemblance and geographical
    position; they are placed historically near Lake Rostov, Lake Kleštino, and a
    larger territory including Vladimir, Yaroslav, and western Kostroma.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Votiaks are said to number about 276,000, and Dr. Buch describes their
    physique, skin, hair, beard growth, eye colour, face, forehead, mouth, lips, and
    nose.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Votiaks are described as peaceful, industrious, hard-working, retiring,
    avoiding surrounding stranger nations especially Russians, slow to answer simple
    questions, and prone to male excess drinking on feast days while women remain
    sober.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage links the Votiaks' low stature and feeble frame to low marshy
    surroundings and says Votiaks who migrated into fertile black soil in the Ufa
    government became physically regenerated.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that, in general, the Votiaks are said to bear a great
    resemblance to the Esthonians.
  category: relationship
  evidence_refs:
  - ev:5
