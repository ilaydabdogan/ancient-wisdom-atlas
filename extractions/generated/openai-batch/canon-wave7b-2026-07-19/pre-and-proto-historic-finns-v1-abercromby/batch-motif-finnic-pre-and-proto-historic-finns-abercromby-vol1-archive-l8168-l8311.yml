    horses, cattle, and reindeer among Finnic and neighboring language groups. It
    uses animal ranges and loanword analysis to infer when the Finns may have encountered
    certain animals and how animal terms may have spread through contact with Ugrian,
    Permian, Turkic, Baltic, Iranian, Lappish, Mordvin, and Ceremis contexts.
  language: English
