canonical_text:
  quote: ''
  summary: The passage summarizes and evaluates classical notices about northern and
    eastern European peoples and geography. It discusses Marcian’s notice of the Agathursoi,
    criticizes Ptolemy’s coordinates east of the Vistula, proposes identifications
    for rivers and tribes, and speculates about Sarmatian inhabitants and boat navigation
    on the Dvina.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Marcian is reported as saying that the Agathosoi or Agathursoi were a Sarmatian
    people in Europe living on the Khesynos.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage treats Ptolemy’s map data east of the Vistula as extremely doubtful
    and argues that his furthest known point should be placed near the north-west
    coast of Esthonia.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Archaeological objects found in Esthonia are said to corroborate knowledge
    of the region, with some objects evidently brought by a maritime route.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The passage proposes identifications for four rivers: Khronos with the Pregel,
    Rhubon with the Niemen, Turuntos with the Windau, and Khersinos with the Dvina.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Venedai are placed on the south coast of the Gulf of Dantzig, perhaps
    as far as the Niemen, in territory later associated with the Old Prussians of
    Lithuanian stock.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Veltai, Ossioi, and Carbones are tentatively placed respectively on the
    coast of Kurland, in Livland, and in Esthonia.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The passage says the only evidence for the nationality of tribes in the area
    is negative: the statement that the Agathyrsi on the Khesynos were Sarmatian implies
    at least that they were not Germans.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage explains the northern occurrence of the names Agathyrsi and Aorsi
    as possibly due to local names being transformed by a careless scribe.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Agathyrsi are tentatively placed around the Drissa, a northern affluent
    of the Dvina, and four tribes between the Agathyrsi and the Rhipaian Hills are
    said possibly to have lived along its banks.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage hypothesizes that the Dvina was navigated in boats as far as the
    site of Bieli, and that some or all inhabitants of the valley were Sarmatians.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that, if Ptolemy is credited, most or all inhabitants of
    East Prussia in the mid-second century were Slavs because he calls them Venedai
    or Wends.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Ptolemy’s omission of the Atstii is interpreted as possibly meaning that he
    included them among the Venedai; he also places the Guthones south of them and
    presumably south of the Venedic Hills.
  category: relationship
  evidence_refs:
  - ev:7
