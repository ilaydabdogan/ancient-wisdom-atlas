canonical_text:
  quote: ''
  summary: The passage surveys ancestor worship and commemorative rites among Finnic
    and neighboring peoples, including offerings to the dead, animal sacrifice, invitations
    to deceased ancestors to eat and drink, Mordvin impersonation of a dead person
    after death, petitions to ancestors for prosperity and harvest, punishment for
    neglect through dreams, and a brief transition to clan and family organization.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that there is reason to believe prehistoric Finns worshipped
    deceased ancestors, and reports that Ostiaks and Samoyedes make offerings to the
    dead on the belief that the dead retain needs and occupations from life.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Lapps, relatives sacrificed reindeer in memory of the dead for several
    years and regarded their luck as a gift from the deceased.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At a Votiak annual commemoration, a priest invites the deceased, offers a
    bloody sacrifice described as a roan stallion, asks the deceased not to be angry,
    asks protection for cattle, and calls the dead to eat and drink with the living.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Permians in the district of Glazov bring food in birch baskets to the cemetery,
    hang the baskets on tree branches, and call the deceased to come and eat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Among the Mordvins, forty or forty-nine days after a death, a nearest relative
    who resembles the defunct person is asked to personify the dead person.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Mordvin personifier comes to the house, wears the clothes in which the
    dead person died, sits on the deathbed, and receives gifts of flour, bread, pancakes,
    or mutton while being asked about the other world.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: During a noisy night feast, the Mordvin personifier describes life beyond
    the grave, speaks about crops there, and gives detailed reports about dead relatives
    of the visitors.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Around midnight the Mordvin personifier gives the wishes of the dead man,
    advising peaceful living, care for cattle, avoidance of theft, and abundance of
    beer and brandy.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the Mordvin rite, a bull is slaughtered, boiled, and consumed by the guests
    before the personifier announces that it is time to re-enter the grave.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Mordvin participants kneel for the personifier's blessing, carry him with
    a bed and food to the cemetery, place him on the grave, offer food there, invite
    him to return in summer when the corn is ripe, and the personifier then rises
    and leaves the scene.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Mordvins ask deceased ancestors for long life, prosperity, harvest, and increase
    of cattle; when ancestors are neglected and left to starve, they warn relatives
    in a dream, after which a feast involving pancakes and a hen is prepared and remains
    are taken near the cemetery.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The author says that Mordvin attribution of prosperity, health, and cattle
    increase to ancestors closely parallels the capabilities of family and clan gods
    of the Ostiaks and Lapps, while stating that there is not enough evidence for
    a definite conclusion that those gods are ancestral spirits.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: In the family section, the author states that prehistoric Finns were likely
    acquainted with clan or tribe ideas, notes that Votiaks were formerly divided
    into tribes, that those who worship the same voriud cannot intermarry, and that
    Ostiak clans consist of families descended from a common ancestor.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage contrasts a Western Finn conception of family as a man, wife,
    and children with an Eastern Finn family that may include twenty to forty or even
    sixty persons under one head.
  category: attribute
  evidence_refs:
  - ev:10
