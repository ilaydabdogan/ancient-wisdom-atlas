canonical_text:
  quote: ''
  summary: The passage describes Bronze Age or transitional archaeological finds in
    northern Russia, including animal-headed bronze weapons from the Pinega and Eldbuga
    areas, a Fatidnovo settlement and cemetery with skeletons, ashes, urns, copper
    and bronze traces, a bear-tooth ornament, decorated globular pottery, cranial
    measurements, and typological comparisons with Siberian or Ostiak materials.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that northern Russia, like Finland, had no Bronze Age in
    a strict sense, though a few objects assigned to that period had been found.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two socketed bronze battle-axes from the banks of the Pinega were ornamented
    with a dragon head at the hammer end and a bird, probably eagle, head at the socket
    end; the two heads faced in opposite directions.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A similar bronze object from Eldbuga and a socketed bronze pick from the same
    area are mentioned; the pick had one end terminating in a boar's head.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The author says the forms of these weapons are not quite like Siberian finds,
    while comparable animal-head details occur on objects from the Altai, Yenisei,
    and Minussinsk regions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Fatidnovo, an ancient settlement and cemetery had stone implements, but
    copper oxide staining, bronze wire, a copper disk, and glass pieces showed it
    was not a genuine Neolithic site.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Fatidnovo skeletons lay on their backs on a layer of ashes, with urns
    at the head and feet, generally placed mouth downward.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A copper disk contained an iron core and lead alloy, and a copper wire had
    been curled into a loop and passed through a bear's tooth.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Fatidnovo urns had no handles or suspension holes, were generally globular
    with short necks and everted lips, and had decoration confined to the upper part.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The urn decoration included horizontal rows of short diagonal strokes, vertical
    strokes, dog-tooth rows, crossed lines, and sometimes lines made with a comb-like
    punch.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Fatidnovo crania were measured and compared with Kurgan, Ladogan, Merian,
    and Ostiak crania; the author concludes there seems to be kinship between the
    Fatidnovo and Ostiak sets of crania.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The Fatidnovo pottery is described as not European and as resembling small
    globular pots from Tobol river kurgans and Cuva near Tobolsk in form and ornament.
  category: relationship
  evidence_refs:
  - ev:7
