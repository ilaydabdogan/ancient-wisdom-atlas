canonical_text:
  quote: ''
  summary: The passage describes Tapio as chief forest divinity and lord of game,
    with a wife or forest mistress under many names, several sons and daughters, daughters-in-law,
    and other forest spirits connected with hunting, animal herding, traps, trees,
    wasps, foxes, and forest cattle. It also notes a comparison between a hollow tree-like
    forest figure and hollow forest-women in Teutonic folklore.
  language: English
