  quote_or_summary: Spirits are invisible yet imagined in human terms and needing
    food; Samoyedes, Ostiaks, Voguls, and Lapps smear idol mouths with blood and fat.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 5970-6087, paragraph on bad fishing on the Ob
  quote_or_summary: When fishing on the Ob is bad, Ostiaks throw a reindeer into the
    river to propitiate the spirit.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 5970-6087, paragraph on animal sacrifice as feast
  quote_or_summary: In animal sacrifice, worshippers eat most of the flesh, some is
    set aside for the god, and the sacrifice is described as a feast at which the
    god is an invited guest.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 5970-6087, paragraph on Southern Ostiak coercion of gods
  quote_or_summary: Among Southern Ostiaks, a god that has received an offering must
    fulfil the request; if it refuses, its image is threatened, thrown down, beaten,
    trampled, sometimes burned, and replaced.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 5970-6087, paragraph contrasting hunting/fishing and agricultural
    peoples
  quote_or_summary: For hunting and fishing peoples, river spirits, forest spirits,
    and household spirits are described as the divinities most likely to receive sacrifices
    and offerings.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 5970-6087, paragraph on Ostiak reverence for the Ob
  quote_or_summary: The Ostiaks esteem the river Ob above all other gods, address
    it with warm prayers, and approach it with rich offerings.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 5970-6087, paragraph on Lapp water-spirits and East Finmark fish-god
  quote_or_summary: Lapps make prayers and offerings to water-spirits to obtain fish;
    in East Finmark a special fish-god is noted.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 5970-6087, paragraph on Samoyed Aake
  quote_or_summary: Since the household god looks after family interests, Samoyedes
    turn to their Aake when they want a good haul of fish.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 5970-6087, paragraph on destructive water spirits
  quote_or_summary: The Ostiak water-spirit is described as evil and destructive,
    and the Votiak water-man as thoroughly evil.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: lines 5970-6087, paragraph on Votiak water spirits and drowned men
  quote_or_summary: Votiak water spirits live in rivers, brooks, and lakes; drowned
    men increase their number and become their servants or horses.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: lines 5970-6087, paragraph on Mordvin water-father
  quote_or_summary: After bathing, Mordvins thank the silver-bearded water-father;
    a story says he seizes a drinking man by the beard and releases him only after
    the man promises his son.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: lines 5970-6087, paragraph on the Lapp forest-god
  quote_or_summary: The Lapp forest-god rules forest animals as his herds, controls
    hunting luck, receives prayers and offerings, and especially protects the bear.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: lines 5970-6087, paragraph on Votiak forest beings
  quote_or_summary: Votiak forest men send game to hunters and food to cattle; the
    forest-uncle or forest-man controls all forest animals, has human shape, and is
    bad-tempered.
  source_text_path: texts/public-domain/finnic/internet-archive/pre-and-proto-historic-finns-v1-abercromby.md
