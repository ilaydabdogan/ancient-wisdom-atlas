- id: motif:3
  label: Propitiatory animal offering to water for fishing success
  taxonomy_refs:
  - sacrifice
  basis: When Ob fishing is bad, Ostiaks throw a reindeer into the river to propitiate
    the spirit.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage provides only one brief example for this specific act.
- id: motif:4
  label: Reciprocal offering that binds or coerces a god
  taxonomy_refs:
