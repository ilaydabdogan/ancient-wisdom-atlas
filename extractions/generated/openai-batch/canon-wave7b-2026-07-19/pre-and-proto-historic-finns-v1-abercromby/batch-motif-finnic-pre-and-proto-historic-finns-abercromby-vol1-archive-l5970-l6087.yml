canonical_text:
  quote: ''
  summary: The passage surveys Finno-Ugric and related northern Eurasian beliefs about
    spirits embodied or localized in images, stones, branches, chests, baskets, posts,
    rivers, water beings, and forest beings. It describes offerings, sacrificial feeding,
    coercion of certain household or tribal gods after unsatisfactory offerings, water
    spirits as both fish-givers and dangerous drowners, and forest spirits as controllers
    of game animals and hunting luck.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vogul ghosts or manes of heroes are said to dwell at the places of their former
    exploits and to be represented by images called pupy, while the indwelling spirit
    is distinguished from the image and may appear when summoned by incantation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vogul divine images may be replaced by natural stone or rock formations believed
    to be transformations of heroes, and a birch sapling may be set up in a sacrificial
    place as a sacred resting-place for the god invoked.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Votiak household god vorsud is described as living in a special chest
    or basket containing offerings, or in fir branches strewn in a special place,
    while otherwise invisible.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Ceremis household spirit is said to be embodied in a bundle of sticks,
    and Lapp seita are described as visible in a pile of stones or in a roughly human-shaped
    wooden post.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Although the spirits are invisible, the passage says they are conceived in
    human terms and need to be fed; Samoyedes, Ostiaks, Voguls, and Lapps smear idol
    mouths with blood and fat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: When fishing on the Ob is bad, Ostiaks throw a reindeer into the river to
    propitiate the spirit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Animal sacrifice is described as a feast in which worshippers eat most of
    the flesh and some is set aside for the god, who is treated as an invited guest.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Among the Southern Ostiaks, a god who has received an offering is said to
    be bound to fulfil the request; if the god refuses, its image may be thrown down,
    beaten, trampled, burned, and replaced.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage states that hunting and fishing peoples especially worship river,
    forest, and household spirits with sacrifices and offerings.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Ostiaks are described as esteeming the river Ob above all other gods and
    approaching it with warm prayers and rich offerings.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Lapps make prayers and offerings to water-spirits to obtain fish; the passage
    also notes a special fish-god in East Finmark.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Samoyedes turn to their household deity Aake when they want a good haul
    of fish.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: 'Water spirits are also described as dangerous: the Ostiak water-spirit is
    called evil and destructive, and the Votiak water-man is described as thoroughly
    evil.'
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: Votiak water spirits are said to live in rivers, brooks, and lakes, and drowned
    men increase their number by becoming servants or horses of these spirits.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:15
  text: After bathing, Mordvins thank the silver-bearded water-father; in a story
    he seizes a man by the beard and releases him only after the man promises his
    son.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: The Lapp forest-god rules forest animals, treats them as his herds, controls
    hunting luck, receives frequent prayers and offerings, and gives special protection
    to the bear.
  category: relationship
  evidence_refs:
  - ev:16
- id: obs:17
  text: Votiak forest beings send game to hunters and food to cattle; the forest-uncle
    or forest-man controls all forest animals, has human shape, and is described as
    bad-tempered.
  category: relationship
  evidence_refs:
  - ev:17
