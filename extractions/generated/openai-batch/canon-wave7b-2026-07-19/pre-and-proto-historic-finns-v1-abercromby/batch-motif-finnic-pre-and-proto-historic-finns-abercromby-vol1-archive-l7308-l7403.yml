canonical_text:
  quote: ''
  summary: The passage surveys reported naming customs among prehistoric Finns and
    neighboring northern peoples. It emphasizes chance encounters, luck, gendered
    naming, avoidance of spouse names, seasonal or occupational names, names used
    to break ill-luck after child deaths, and Lapp renaming when a child’s illness
    or excessive crying was attributed to a wrong name. The excerpt ends with the
    opening of a new section on domestic occupations and settlements near rivers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that prehistoric Finns had no surnames or family names,
    but likely had something corresponding to clan names and gave names to children.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says chance was an important factor in naming, and that the first
    person or natural object encountered by the name-giver could be treated as a supernatural
    coincidence bringing luck to the newborn’s name.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A reported Samoyede practice named a child after the first man or beast entering
    the hut, the first being met outdoors, or the first object seen, including beast,
    bird, river, or tree.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An Ostiak heroic-ballad example gives an old prince a long descriptive name
    involving a rotten elderly hero and grebe chicks, though the author says such
    a name could not have been given at birth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: For the Ceremis, the passage reports that a male child could be named by the
    first male friend arriving and a female infant by the first female friend or neighbor
    looking in.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Ceremis husband and wife are described as not using each other’s personal
    names, instead using words meaning woman and man.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: For former Mordvins, choosing a child’s name was important because the name
    should bring luck; the father went outside and named the child after the first
    living or inanimate object that caught his eye.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mordvin example names include Splinter, Leaf, Grass, Smith, and Fiddle, with
    Smith and Fiddle explained as deriving from the first person or associated object
    met.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Among Votiaks, the midwife formerly gave the newborn child’s name, and in
    one district this remained for female infants, whose name could come from the
    father’s vorsud and be used after marriage.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Kazan government, Votiak children could receive names connected to
    agricultural seasons, such as a name from plough for ploughing season or a name
    from sickle for harvest-time.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: When several children had died in succession, the Votiak name Zukéar, meaning
    Stay, was given to break a run of ill-luck.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Another cited author says Wolf, Bear, Squirrel, and Thrush were common male
    names given to children born in the season when those animals were hunted or caught.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In some parts of Glazov, the passage reports that a husband called his wife
    by an inherited maternal name rather than by her own name; the midwife’s naming
    formula includes the mother’s name.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Professor Smirnov interprets the Glazov maternal naming practice as a survival
    of the maternal system, but the author cautions that it may be a more modern development.
  category: other
  evidence_refs:
  - ev:8
- id: obs:15
  text: If a Lapp child became ill or cried excessively, the reason was said to be
    that it had received a wrong name; the child was rebaptized and might acquire
    three or four additional names.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The excerpt’s next section begins by stating that prehistoric Finnic settlements
    must have been on or near the bank of a river.
  category: setting
  evidence_refs:
  - ev:10
