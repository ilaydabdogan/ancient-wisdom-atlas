  quote: ''
  summary: 'Archaeological description of the Volosovo neolithic station: graves with
    skeletons, ashes, urns, animal bones, and a flint arrow-head; craniological comparisons;
    pottery and stone tools; and chipped flint silhouettes of human and animal forms
    with comparisons to other finds.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The described graves contained skeletons lying in a bed of wood ashes, with
    a clay urn at the head filled with burnt animal bones and a flint arrow-head placed
    among the bones.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The graves were filled level with the ground, had no surface marker, and had
    no immediate nearby trace of human handiwork; the author nevertheless describes
    them as probably neolithic.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author reports cranial measurements and comparisons, including a comparison
    of a complete Volosovo skull with a male Permian skull, and states that a sub-brachycephalous
    element had analogies among existing Permian Finns.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pottery sherds were numerous; vessels were described as more or less globular,
    while the intact sepulchral urns were small, nearly unornamented, and flat-bottomed.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The pottery clay was mixed with gravel, broken shells, and feathers; vessels
    had thick uneven walls, wide tops, no handles, and sometimes cord-holes on larger
    vessels.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The pottery decoration is described as varied, regular, and symmetrical, recalling
    Oldnets; the passage also states that cord ornament and simple or concentric circle
    designs were absent.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Stone objects included carefully polished wedge-shaped diorite axes, rare
    perforated hammer-axes, schiefer pendants made by sawing, numerous flint arrow-heads,
    and flint saws.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage describes flint silhouettes of men, birds, and animals, including
    human figures, a goose, and a figure that might be a boar or a badger.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The author states that shaping flattish flint pieces into animal forms was
    not confined to the Oka valley and cites a flint seal silhouette from a workshop
    near the Zolotitsa and other flint outlines of unknown finding-place.
  category: relationship
  evidence_refs:
  - ev:8
