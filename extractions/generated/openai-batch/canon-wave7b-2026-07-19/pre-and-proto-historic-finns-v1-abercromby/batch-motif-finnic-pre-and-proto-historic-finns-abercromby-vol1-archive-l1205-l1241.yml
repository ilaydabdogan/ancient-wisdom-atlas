canonical_text:
  quote: ''
  summary: The passage gives an ethnographic and physical-anthropological characterization
    of Finnic groups, discussing attributed traits, adaptation to North Central Russia,
    differences among Karelians, Zirians, Hame, Mordvins, Ceremis, Esthonians, and
    Livs, and tabular comparison of stature and cephalic index with Ugrians and Letto-Lithuanians.
    It concludes that the Finns may not be homogeneous and may reflect amalgamation
    of two stocks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author attributes tenacity of purpose, endurance of privation and suffering,
    honesty, and fidelity to the Finns, and connects these traits with their survival
    in the climate of North Central Russia.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Karelians and Zirians are described as brisker and more alert than other Finns,
    and the Zirians are said to have been civilized and Christianized earlier than
    Votiaks and Permians.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage contrasts darker, curlier Karelian hair with the straight, light
    hair of the Hame, and notes dark hair among Mordvins and darkish hair and generally
    dark eyes among Ceremis.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A table is described as comparing the height and cephalic index of living
    Finns with Ugrians to the east and Letto-Lithuanians to the southwest.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that stature increases toward the west and that Finns were
    probably formerly undersized before civilization improved the physique of more
    advanced Finnic groups.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that all Finns are subbrachycephalous except Ceremis, Esthonians,
    and Livs, who are mesocephalous.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author infers that the Finns are not fully homogeneous and that two different
    stocks may have collided and amalgamated.
  category: relationship
  evidence_refs:
  - ev:5
