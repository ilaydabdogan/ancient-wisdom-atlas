- id: obs:1
  text: Human remains were reported from a thin bed of alluvial peat over red clay,
    beneath stratified sand and peat and a layer of blown sand, at a considerable
    depth.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The crania were described and figured by the late Professor Bogdanov, and
