  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Prehistoric Ladogan male crania are described as having thick skull walls,
    slight forehead development, and small-headedness.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The femoral bones are described as small, while muscle attachments suggest
    a generally well-developed muscular system, especially in the upper body.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bogdanov identified traces of relationship between the Ladogan crania and
    the Aurgan type of Central Russia, but regarded the Ladogan type as neither Slav,
    Finnish, nor Mongol.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Ladogan dolichocephals are compared metrically with Ceremisian dolichocephals
