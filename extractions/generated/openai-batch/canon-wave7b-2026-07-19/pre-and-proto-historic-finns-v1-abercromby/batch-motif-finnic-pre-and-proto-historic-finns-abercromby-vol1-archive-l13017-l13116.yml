canonical_text:
  quote: ''
  summary: 'The passage describes Finnic beliefs and exorcistic procedures concerning
    disease: illness may be sent by the Creator, by sorcerers, by the dead, or by
    wind and water; it is personified as a monstrous or social being; exorcists threaten,
    shame, redirect, contain, or bargain with it, offering travel aids, destinations,
    food, blood, meat, and lodging to make it depart.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Disease to be exorcised is described as either sent by God the Creator or
    caused by a sorcerer's spells; spell-caused illness is distinguished from natural
    malady as the result of human art.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Disease is described with monstrous and demonic labels, including devil, bogie,
    Hiisi, Lempo, uninvited shape, hound of Hiisi, and monster of the earth.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Rickets is described as mouthless, eyeless, toothless, and tongueless, while
    still somehow able to suck or eat.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: An illness may be ordered to attack by its father, mother, brothers, or sisters,
    and may be addressed as capable of recognizing harm, feeling shame, and making
    amends.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: An exorcist may threaten disease like a boy, including threatening to flog
    it with rowan shoots and fir tips.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sender of a disease by spells is called its master or mistress, and the
    malady may be told to go home and injure that sender.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sickness may come from a grave or from spirits of the departed; ailments are
    also said to be brought by wind and water.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Three attacks of sickness are described as traveling by routes such as swamp,
    firm ground or winter-road, and water or springs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Pain, disease, and sickness can be wound into a ball and thrown into the sea.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: An exorcist can place diseases in a wallet and take them to three Luonnotars,
    who collect them in a copper box.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Kivutar, called the maid of pains and sicknesses, boils the collected pains
    or sicknesses in a little kettle on the Hill of Pain.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: When unable to drive disease away by force, the exorcist may parley with it
    and offer inducements such as a splendid horse, a good road, and moonlight for
    travel.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Disease is invited to depart to places where food, blood, flesh, animal meat,
    fish, bedding, or lodging are available.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The departure destinations named include a cemetery, Pohjola, the North, battlefields,
    the front of a cannon, the sea, Metsola, Lapland, home, and Hell.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: Disease may also be urged to go home because its family is alarmed and vexed
    at its absence and because its son is sick.
  category: speech
  evidence_refs:
  - ev:9
