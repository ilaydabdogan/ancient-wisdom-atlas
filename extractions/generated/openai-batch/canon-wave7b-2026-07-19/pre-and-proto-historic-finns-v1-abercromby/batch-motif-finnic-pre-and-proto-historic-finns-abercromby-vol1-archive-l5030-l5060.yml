  quote: ''
  summary: The passage summarizes classical geographical notices about four eastern
    European rivers, their possible ancient names and sources, named hills or watersheds
    east of the Vistula, and the placement of several tribes or peoples around the
    Vistula and Venedic Gulf. It notes uncertainty about identifying the rivers and
    about whether some tribal names survive in later Prussian district names.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four rivers are named as Khronos, Rhubon or Rhudon, Turuntos, and Khesinos
    with variant spellings, and the passage states that none can now be recognized.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage offers two possible explanations for the unrecognized river names:
    a complete migration and renaming by a later population, or Ptolemy using information
    from a foreign, possibly German, source.'
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: A watershed lying 800 to 900 feet above sea level is described as the source
    area from which these rivers descended.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The watershed and related hills are given several names in the classical
    geographical account: Venedic Hills, Bodinon, Alaunon, and Rhipaia.'
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: According to Marctan of Heracleia, the Khronos was the smallest of the four
    rivers; the Khronos and Rhudon entered the Venedic Gulf, while the other two rivers
    rose in the Rhipaian Hills.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Guthones, Phinnoi, and Sulones are described as smaller tribes near the
    Vistula and south of the Venedai.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Galindai, Sudinoi, and Stavanoi are placed east of the Guthones, Phinnoi,
    and Sulones, and also south of the Venedai.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage reports a suggestion that the names Galindai and Sudinoi may be
    preserved in the old Prussian district names Galindia and Sudovia, while noting
    that Ptolemy appears to place them south of the watershed.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: On or near the coast adjoining the Venedic Gulf, the Veltai, Ossioi or Hosioi,
