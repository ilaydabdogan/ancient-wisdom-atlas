canonical_text:
  quote: ''
  summary: The passage presents a comparative ethnological account of sky-god concepts
    among prehistoric Finns and neighboring peoples. It describes a shift from spirits
    inhabiting natural objects toward a more elevated sky-god associated with knowledge,
    weather, remoteness, and eventual creator status. It compares Samoyede Num, Ostiak
    Tiirm/Tiirim, Votiak Inmar, Ceremis Jumo, Vogul Numi Tarim, and related Turkic
    terminology, noting patterns of inaccessible high gods, lower helper spirits,
    atmospheric emblems, and benevolent father-provider sky-gods.
  language: English
  quote_policy: summarized
