candidate_motifs:
- id: motif:1
  label: Omniscient sky-god with solar eye
  taxonomy_refs:
  - wisdom
  basis: The sky-god's elevated position and the sun as his eye are said to produce
    the attribute of omniscience.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This is presented as the author's developmental reconstruction rather
    than as a narrated myth episode.
- id: motif:2
  label: Remote high god beyond direct access
  taxonomy_refs: []
  basis: Num is too far away to approach, and Northern Ostiak Tiirm cannot be reached
    by prayers or propitiated by offerings.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage also gives counterexamples where sky-gods become accessible
    or benevolent.
- id: motif:3
  label: Weather as divine will, speech, or equipment
  taxonomy_refs: []
  basis: Weather is attributed to the sky-god's will; Tiirm speaks in thunder and
    storm; rainbow, thunderbolt, and lightning are treated as divine mantle, bow,
    stone, or arrow.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:7
  confidence: high
  cautions: The atmospheric items differ by group and deity.
- id: motif:4
  label: Enspirited natural objects
  taxonomy_refs: []
  basis: The passage describes nearly every natural object as a habitation of a spirit,
    including rocks, stones, trees, and houses.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is a generalized cosmological description, not a single fixed tale
    motif.
- id: motif:5
  label: Sky-god as father, provider, and animal relative
  taxonomy_refs:
  - divine_parent_child
  basis: Numi Tarim is addressed as father and has the bear as dear daughter; IrtiS
    and Southern Ostiak materials repeatedly call the sky-god father and portray him
    as merciful helper.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The parent-child taxonomy is supported by father epithets and the bear-daughter
    statement, but the passage does not provide a full genealogy.
- id: motif:6
  label: Prayer without sacrifice or ineffective sacrifice to high god
  taxonomy_refs:
  - sacrifice
  basis: Northern Ostiak offerings cannot propitiate Tiirm; Votiaks pray to Inmar
    but do not sacrifice because he is good; Southern Ostiak poetry does not show
    demands for worship, sacrifice, or prayers.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:10
  confidence: medium
  cautions: The motif is mostly negative or ritual-absence evidence, so it should
    be reviewed cautiously.
- id: motif:7
  label: Creator status as threshold of supernatural deity
  taxonomy_refs: []
  basis: The passage argues that a sky-god becomes conceivable as supernatural only
    when omnipotence is raised to the level of creator of the world.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: This is a theoretical claim in the source, not a specific Finnic myth
    narrative in the passage.
