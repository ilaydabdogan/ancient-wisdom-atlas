canonical_text:
  quote: ''
  summary: The passage surveys Finnic charms and formulas in which Christian figures
    and terms are invoked for bullet-stopping, healing, steam-bath restoration, property
    protection, exorcism, legal advantage, blood-staunching, divination, child-quieting,
    bedtime protection, bandaging, fire-origin statements, herding, barley prosperity,
    and ritual washing. The author notes that some Christianized blood-staunching
    language adapts an older heathen formula and suggests that the Creator's golden-wattled
    cock may perhaps recall a thunder-bird.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jesus, described as the Lord of air who knows bullet-throwing and a bullet-stopping
    charm, is invited to let water fall on an enemy gun's touch-hole so that it will
    not fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: God the Creator or father of the air is asked to heal a sick person, enter
    steam, restore health, give repose, and do so secretly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: God the Creator is asked to give luck and contentment and to build an iron
    fence and stone castle around the supplicant's property from earth to sky.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: God and the Creator are called the oldest spell-reciters and wizards and are
    invoked to exorcise and help overthrow enemies and envious persons.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Creator's cock with golden wattles is asked to speak on a man's behalf,
    stop the judge's ears, bribe jurymen, and bind silk across the sheriff's eyes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A riddle gives three cocks, iron, copper, and golden; the answer identifies
    them as a plough, a ship, and the sun, and the author adds that the golden cock
    may be a reminiscence of the thunder-bird.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Blood-staunching charms turn the word of God, trust in the Maker, Jesus' flesh,
    the Lord's side, the Lord's gloves, the Maker's lock, and the Lord's word into
    bars, plugs, dams, locks, or stoppers for blood or the substance called milk.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: An exorcist says he can do nothing without the grace and help of God the Creator
    and uses the word of God to extract a sorcerer's arrows.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The exorcist identifies his breath with the Lord's breath, his warmth with
    the Creator's warmth, and the water he uses with the blood of Jesus.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: A diviner asks leave from the Creator and assistance from the Lord, asks God
    to tell the divining gear, and commands the divining gear to declare the source
    of a calamity.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Child-quieting and bedtime protective formulas ask God, Mary, Earth, the Omnipotent,
    the Creator, a saint, Jesus, and Mary to make the child sleep or guard the sleeper
    with defensive functions such as lock, bolt, shield, and sword.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Bandage and anti-incantation formulas refer to the Maker's silk, the Lord's
    cloak and furs, the word of God, the Creator's mercy, and words prescribed by
    the Holy Ghost.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Fire is said to have been created by God, born of Jesus' word, and rocked
    by the Virgin Mary.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Jesus is invoked for consecrating flocks and herds, sending a good barley
