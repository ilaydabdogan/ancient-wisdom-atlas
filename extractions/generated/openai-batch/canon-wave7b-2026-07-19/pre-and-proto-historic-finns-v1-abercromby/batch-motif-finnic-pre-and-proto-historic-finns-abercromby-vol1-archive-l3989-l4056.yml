canonical_text:
  quote: ''
  summary: 'The passage describes Early Iron Age burial places in the Baltic provinces:
    a low east-west mound with three stone-paved compartments containing shallow burials,
    scattered bones, ornaments, and a few burnt bones; and the Tiirsel cemetery, an
    oval east-west stone heap with cremated remains and objects. It also notes typological
    and geographical comparisons among cemetery finds, especially fibulae and a bronze
    bangle.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One burial place was a low natural mound running east and west, near the high-road
    from Reval to Narva, about 40 yards long and 12 yards wide.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Removal of the upper soil disclosed three areas marked off by large granite
    blocks; all three areas were paved with stone blocks and separated by gravel borders
    without sepulchral remains.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the western and central compartments, the dead were buried shallowly, with
    few ornaments, sometimes singly and sometimes piled one on top of another, under
    a pavement of large stones.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The eastern area had no skeletons, but ornaments and numerous bones and teeth
    of young and old were scattered between pavement stones; most were uncremated,
    though a few burnt bones were present.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two skeletons in the western and central compartments were observed with heads
    to the south and feet to the north.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: One observed skeleton was described as a robust man of about thirty years
    of age; the supplied text reports his height as approximately 4 feet 10¼ inches,
    though the OCR is unclear.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The skulls in the described burial place were crushed.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The cemetery of Tiirsel lay near the Narva-Reval highway and consisted of
    an east-west oval stone heap about 50 feet long, 20 feet wide, and 3 feet high,
    overgrown with turf.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: At Tiirsel, the mound area seems first to have been paved with stones; between
    them were cremated human remains, ornaments, and objects the people had used when
    alive.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The outline of the Tiirsel cemetery appears to have been marked by a row of
    stones, and two north-south rows of stones divided it into compartments.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says the finds from Tiirpsal and Kuckers are closely related but
    also have marked differences; it says the same of Tiirsel and Malla.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Some fibulae from Kuckers and Tiirpsal are described as absent from contemporary
    grave-finds in Livland and Kurland, hardly known in Sweden, common in Roman provinces
    north of the Alps, plentiful on Bornholm, and not infrequent in West Prussia.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: One Tiirpsal fibula is said to be otherwise unknown in the Baltic Provinces
    and apparently East Prussia, but to have analogies at Darzau in Hannover.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: A thick bronze-wire bangle from Tiirpsal is said to recur only at Rondsen
    near Graudentz in West Prussia, in a second-century grave.
  category: relationship
  evidence_refs:
  - ev:8
