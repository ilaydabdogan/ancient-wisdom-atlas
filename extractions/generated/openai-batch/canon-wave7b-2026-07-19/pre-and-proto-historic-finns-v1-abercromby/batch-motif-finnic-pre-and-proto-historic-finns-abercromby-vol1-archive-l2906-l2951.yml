canonical_text:
  quote: ''
  summary: 'The passage reports sparse archaeological evidence for Neolithic inhabitants:
    a woman’s burial near Novo Mordovo with north-south orientation and a tortoise
    shell bearing red traces, damaged interments at Great Bugér with small urns and
    west-east body orientation, and domestic animal bones at several stations. The
    author treats the animal remains as evidence of a late Neolithic date and suggests
    a possible southern or south-eastern origin for the domestic animals.'
