comparison_claims:
- id: claim:1
  claim: The passage presents Perkele/Perkene and Piru as linguistically connected
    to Baltic and Slavic thunder terminology, while noting that their Finnic Magic
    Song function is now evil-spirit or devil-like rather than thunder-divine.
  claim_level: linguistic_similarity
  target: Lithuanian Perkunas, Russian Perin, Mordvin Purgene, and Finnic Perkele/Piru
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: This is the author’s etymological and functional claim; the supplied
    passage does not independently document historical sound changes or early Finnic
    thunder worship.
- id: claim:2
  claim: The passage contrasts the Finnic Magic Songs’ loss of Perkele/Piru’s older
    thunder meaning with Lettish retention of Pérkons as a beneficent thunder figure
    capable of harm.
  claim_level: same_function
  target: Lettish Pérkons tradition compared with Finnic Perkele/Piru in Magic Songs
  evidence_refs:
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is functional and contrastive; the passage does not
    show that Perkele/Piru still perform thunder actions in the cited Finnic materials.
- id: claim:3
  claim: The passage supports a cautious historical-contact claim for the thunder-name
    complex by saying Perkele comes from Lithuanian Perkunas, Piru from Russian Perin,
    and Mordvin Purgene was borrowed early.
  claim_level: historical_contact
  target: Baltic, Slavic, Mordvin, and Finnic thunder-name borrowings
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim rests on the author’s statements in this excerpt and does
    not provide detailed linguistic evidence beyond the asserted derivations.
- id: claim:4
  claim: The passage suggests that some charms naming God or the Creator may preserve
    older heathen material through substitution of Christian divine names.
  claim_level: historical_contact
  target: Transition-period Finnic charms between heathendom and Christianity
  evidence_refs:
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The author explicitly allows substitution as possible and sometimes
    undoubted, but individual cases remain uncertain without the lost or older forms.
