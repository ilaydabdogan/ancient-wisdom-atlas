canonical_text:
  quote: ''
  summary: The passage discusses Perkele and Piru as Finnic names whose older thunder
    associations are said to have been lost in the Magic Songs, where they function
    as evil spirits or devil figures. It compares them with Baltic, Slavic, Mordvin,
    and Lettish thunder-name traditions, describes charms in which Perkele, Piru,
    Hiisi, and related beings are invoked against disease or pain, and recounts an
    origin account in which Piru forges poisoned arrows that enter a human. It then
    turns to Jumala/God, explaining the term as originally sky or sky-spirit, later
    a general word for deity and often the Christian Creator in charms, with examples
    of healing, hunting, herding, creation, and bone-setting contexts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author derives Perkele or Perkene from Lithuanian Perkunas, described
    as the god of thunder, and Piru from Russian Perin, described as a thunderbolt,
    lightning, and formerly a thunder-god; Mordvin Purgene is also described as an
    early borrowing retaining the old sense.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Magic Songs, Perkele and Piru are said to signify an evil spirit corresponding
    especially to the biblical and modern devil, with no trace of the older thunder
    meaning.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Letts are said to retain a tradition of Pérkons as beneficent, though
    capable of harm when asked; the cited ballad depicts Pérkons crossing the sea
    and being asked to split a bridge over the Daugava.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Perkele, often coupled with Piru, Hiisi, or Juutas, is described as a name
    for the fearful spirit of disease that an exorcist combats and exorcises.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: In charms, Perkele is invoked to silence a dog, and in a variant Hiisi is
    invited from Hell and Perkele from Pimentola to crush or devour a violent pain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Tuoni’s girl is invoked to fling toothache into an iron baking-pan, at the
    end of Piru’s tongs, or among Hiisi’s coals.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: In an origin account, Piru makes arrows in a steel mountain and in a smithy
    without a door or windows; the arrows have steel heads, oak shafts, swallow-plume
    fletching tied with locks of Hiisi’s girl, and snake venom, and the third arrow
    enters a human being.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The alder buckthorn is said to have been made from the hair of a Pirulainen’s
    beard, and the rowan is described as Piru’s creation.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The term Jumala is described as originally meaning sky or sky-spirit and later
    coming to mean god in a general sense applicable to multiple deities.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Examples are given of the word god being applied to Ahti, Hiisi’s home, gods
    above and earth-mothers below, the god of dawn, and the horse-lord Tahvanus or
    variants.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: When qualified by Creator or Almighty, the word God is said usually to refer
    to the Christian God, though the author notes possible substitution for older
    heathen names and a transition period between heathendom and Christianity.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: A charm against hemorrhage says that when countries were upheaved and dry
    land was lifted from beneath the sea, the great Creator made an incision in his
    flesh, in his left foot; the author suggests this may preserve a reminiscence
    of Väinämöinen.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: A bone-healing charm asks the aerial God and spirit Lord Jesus to harness
    a colt, sit in an ornamented sleigh, drive through bones and loosened flesh, and
    join bones together.
  category: action
  evidence_refs:
  - ev:13
