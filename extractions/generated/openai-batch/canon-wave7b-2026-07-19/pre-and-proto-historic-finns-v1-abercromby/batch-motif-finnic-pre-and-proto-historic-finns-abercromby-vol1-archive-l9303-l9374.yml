  summary: The passage discusses Lithuanian-period loanwords and semantic shifts in
    Finnic vocabulary. Mythologically relevant details include a Lithuanian word meaning
    god becoming the Finnish term for the physical sky or firmament, native divine
    names retaining personal character, and a Baltic thunder-god whose name is said
    to underlie Finnish perkele. The thunder-god is described as beneficent among
    Baltic peoples and Latvians, driving away evil spirits, being invoked for healing
    and lightning, and being addressed in a song as a defender of the homeland.
