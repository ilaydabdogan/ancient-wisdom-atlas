canonical_text:
  quote: ''
  summary: The passage describes Finnic magic-song material in which diseases, spell
    injuries, harmful animals and materials, and some ritual remedies are associated
    with Tuoni, Manala, Tuonela, Kalma, graves, and other lower-world or death-related
    beings and places. It also notes personified sun, moon, and Great Bear, with limited
    evidence of offerings or invocations to them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Disease, toothache, snake, grub, and caterpillar are described with names
    linking them to Tuoni or Manala, such as hound, grub, worm, colour, or rag of
    Tuoni or Manala.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Injuries caused by spells are named as a bit of death, chains of Manala, or
    Tuoni’s reins.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Disease or sickness is said to come from the spectral host or form, from Kalma’s
    heath, or from a grave; burial places are also named as Kalma’s heath, Kalma’s
    sleeping chambers, or huts of the manalaiset.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ukko is invoked to fix Tuoni’s lock on a bear’s jaws or to thrust a stone
    of Manala down the bear’s throat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Milk taken by spells from a cow-owner is said to have gone to Tuonela or Mana.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: The passage says personifications of death were dreaded as evil beings but
    also invoked to remove harm.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Tuoni’s female figures are asked to remove toothache, press injuries into
    Hiisi’s coals, collect pains, boil them in a kettle, winnow and sift torments,
    and make stones suffer instead of human beings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Tuoni’s red-cheeked boy is asked to provide a red cord for tying a severed
    vein, and Tuoni’s son is invited to attack sorcerers and the envious.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: A son asks his dead mother to rise from the earth or cemetery and bring him
    a fur coat from Tuoni’s land for protection against sorcerers and witches.
  category: action
  evidence_refs:
  - ev:2
- id: obs:10
  text: When evil qualities are explained by origin, the passage says their parentage
    is sometimes assigned to lower-world evil spirits.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: The blind daughter of Tuonela, also called the hideous child of Manala, becomes
    pregnant by a wind, carries the pregnancy for nine years, and gives birth to several
    harmful beings or conditions.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:12
  text: While Tuoni’s iron-toothed old wife is spinning, blood from the distaff turns
    into a snake.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:13
  text: Iron is said to be harmful because Holma comes from Tuonela or under the earth
    as the son of Manala, finds purple melic grass on a swamp, and brings it to Ilmarinen,
    who forges it into iron implements.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:14
  text: The origin of nets is assigned to Tuoni’s three-fingered girl or to a three-fingered
    crone of Lapland, who spins a hundred-fathom net in one summer night.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:15
  text: A huge flax plant is said to grow from a seed found in the storage place of
    Tuoni’s grub and sown in the ashes of an incinerated boat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:16
  text: The sun, moon, and Great Bear are described as personified heavenly bodies;
