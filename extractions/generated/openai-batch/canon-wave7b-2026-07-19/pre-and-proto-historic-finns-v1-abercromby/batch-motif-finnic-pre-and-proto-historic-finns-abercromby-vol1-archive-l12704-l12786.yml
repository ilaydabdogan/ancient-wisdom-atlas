canonical_text:
  quote: ''
  summary: The passage catalogues Finnic charm references to Christian saints, biblical
    figures, ecclesiastical ceremonies, exorcistic language, healing acts, animal
    protection, and baptism or christening of animals, children, diseases, and personified
    forces such as Fire and Frost.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An ale-charm describes a little boat rowed on a little pond in a drop of water
    in a cloud.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: St. Andrew pulls the boat, little Peter steers, Jesus sits in the middle,
    and they comb Hiisi’s elks; the housewife invokes the elks to drive away snakes
    drinking her ale.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Christopher, called river chief and golden king of rivers, together with Nokiatar
    or Jokiatar, is asked to send a host of otters into a trapper’s traps.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: St. Anni spins a red thread and binds it around a sprained or dislocated limb
    of a human or beast.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: St. Catharine is invoked regarding harm done by her ram, St. Stephen or Tapani/Tahvanus
    is asked to watch horses at grass, and St. Saitari with Pullukka is invoked for
    a boy gored by an ox.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that man is made of a cake of mould to which the Lord gave
    breath and life, and mentions Adam and Eve as a stock to which Kalma may belong.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Creator curses the snake to crawl on its belly and curses Satan into hills
    of steel and rocks of iron.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage records allusions to the temple of the Lord, the wall of Jerusalem,
    holy days, Sabbath days, Mass, priests, preaching-house, church, and the brook
    Kedron.
  category: setting
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Juhannes, priest of God, prepares unguents and salves from herbs and uses
    them to heal wounds, including the wound of the Lord while tortured by Pilate.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Exorcists address evil or disease spirits with Christian and baptismal language,
    warning them not to injure a Christian or baptized man and banishing them to priestless
    or unchristian lands.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: Ukko is asked to send rain where a woman has an unbaptized child because there
    is no water.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The bear is christened by the king of Himmerkki, while the Virgin Mary carries
    him to baptism and stands godmother.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Juhannes refuses Louhiatar’s request to christen her children, so Louhiatar
    does it herself; Juhannes also christens Fire and gives him the name Panu.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Raani, Tuoni’s girl, and the mother of Rickets baptize children or Rickets
    themselves after desired officiants are absent or refuse; Sharp Frost is christened
    by his mother at a stream or spring setting.
  category: sequence
  evidence_refs:
  - ev:12
  - ev:13
  - ev:14
