canonical_text:
  quote: ''
  summary: The passage describes a proposed Tatar-period layer of Mordvin loanwords,
    linking earlier loans to the Cuvas and later ones to MiSar Tatars. It summarizes
    borrowed terms for rulers, communal assembly, hospitality, trade, marriage and
    kinship customs, clothing, ornaments, and bodily or medical vocabulary.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage places the seventh or Tatar period after an apparent stagnation
    or interregnum among the East Finns following the Iranian period.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The oldest Mordvin loanwords of the period are attributed to the Cuvas, with
    later loans dated from the thirteenth century onward and attributed to MiSar Tatars.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Cuvas are described as descendants of the ancient Bolgars by Radloff,
    Vambéry, and Paasonen; the passage also says they speak a strongly marked Tatar
    dialect.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Bolgars are said to have appeared in Europe in the fifth century, possibly
    settled on the central Volga by the sixth or seventh century, and remained there
    until the Mongol capture of Bolgari in 1238.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Mordvins are said to have adopted terms for dignitaries, including prince
    and Kan, and a term for an assembly of the community held in the street.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Hospitality vocabulary is described through terms for custom, stranger, guest,
    friend or comrade, and a counterposed term for glutton.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Merchants and traders are described as facing storms and waves, gathering
    in a market-place or bazar, using scales and a ten-pound weight, testing goods,
    and seeking to buy cheap.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Foreign trade goods mentioned include pepper, paper, brass, chains, silk,
    and other articles.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: New family terms are listed for mother, wife, woman, elder sister or aunt,
    and several affinal and younger kin categories.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Marriage customs are said to have involved match-makers and haggling over
    the price of the bride or the bridal feast.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage says a sense of shame or decorum in girls was required and that
