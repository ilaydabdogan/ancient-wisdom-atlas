canonical_text:
  quote: ''
  summary: The passage describes unnamed beings grouped by the author as elves or
    brownies, usually emerging from the sea, sometimes tiny and equipped with iron,
    stone, or icy garments or tools, and in several songs performing impossible acts
    such as felling a gigantic oak, killing a huge ox, healing burns, or explaining
    toothache. It then briefly discusses giants called Tursas or Turilas, including
    a sea-Tursas who assaults a girl by means of a nightmare, a fiery Tursas who burns
    maidens’ hay, and a god Turisas said to give victory in war.
  language: English
  quote_policy: summarized
