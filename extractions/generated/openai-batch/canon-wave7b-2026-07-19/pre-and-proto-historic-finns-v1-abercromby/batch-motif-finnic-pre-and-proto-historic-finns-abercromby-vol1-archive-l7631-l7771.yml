canonical_text:
  quote: ''
  summary: A historical-linguistic discussion of metal terminology among Finnic, Ugrian,
    Samoyede, Osetan, Turkic, Mongolic, and related groups. The passage treats metal
    use as a civilizational turning-point, discusses copper/bronze, iron, silver,
    lead, and tin terms, and reports scholarly disagreements about etymology and borrowing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the introduction of metal and gradual disuse of stone
    implements is a major turning-point in a people's history; it says the first metal
    known to the Finns may have been copper, without a distinction between copper
    and bronze.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ostiaks are said to use vax or vox in the general sense of metal or money,
    and in some places iron; explicit compounds use green/yellow for copper, white
    for silver, and another qualifier for iron.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among the Voguls, vox is said to mean money or metal, and in some places copper;
    the author supposes the original meaning of vox/vax was bronze with a connotation
    of metal.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A separate word for copper alone is said to be confined to Vogul, Ceremis,
    and the Permian group, and is judged probably later than the vaski-group because
    it is not used for metal generally.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The West Finns are said to have a special word for silver, not found in the
    Eastern groups or among the Ugrians.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Permian and Ugrian groups are said to have a series of words for silver
    that cannot easily be separated from terms for tin and lead; some appear to be
    compounds whose last element is connected by Wichman with Finnish vaski and Vogul/Ostiak
    vox.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'The passage reports disagreement over the source of the Permian and Magyar
    word for silver: Munkacsi derives it from Osetan, while Schrader, Hübschmann,
    and Wichman instead see the Osetan form as borrowed from an East Finnish source.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Wichman analyzes Votiak asves as az meaning white plus ves meaning metal,
    but the author regards the grounds for making az mean white as precarious.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: A Votiak magic song is mentioned because the word aziz occurred as an epithet
    of a hill and a prince; the passage reports a Votiak teacher's explanation involving
    stone and white stone, but the author suspects this explanation was a guess.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage summarizes that the common Permian, Magyar, and Osetan silver
    word is absent in Vogul and Ostiak; Ostiak instead uses a compound meaning white
    metal; Vogul uses a word corresponding with Magyar lead; and lead and tin may
    be distinguished by black/white or not distinguished.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The author supposes, with uncertainty, that the older meaning of Vogul atves
    was silver rather than lead, and says a Votiak loan explanation is weakened by
    the presence of a Samoyede form vese.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: The passage states that Samoyede words for iron or metal probably correspond
    in origin with Magyar vas, Vogul/Ostiak vox, and Finnish vaski, and compares them
    with Turkic, Mongolic, and Buryat terms for bronze, copper, or metal.
  category: relationship
  evidence_refs:
  - ev:11
