canonical_text:
  quote: ''
  summary: 'The passage reconstructs early Finnic and related Ugrian material culture
    and vocabulary: weapons, travel, fishing, agriculture, seasons, measures, counting,
    and exchange terms. It describes bows, arrows, snow-skates, boats, fish weirs
    and traps, primitive cultivation by women and slaves, seasonal vocabulary, natural
    measures, and later developments in counting, paying, and selling.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies the bow and arrow as the oldest prehistoric weapons
    and says their words appear with little change across Ugrian, East Finnish, and
    West Finnish languages.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes Ostiak use of a composite bow made of hard pine and
    birch, fastened with fish glue and bound with birch bark, with ancient strings
    inferred to have been sinew.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Pointed arrows and blunt-headed arrows are mentioned, and words for a knife
    and an awl are discussed as possibly referring originally to flint or bone instruments.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Winter hunting expeditions are described as being made on long wooden snow-skates,
    while summer travel used boats that were rowed and steered with a paddle or steering
    oar.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Fishing is described through damming a small stream with a dam or weir and
    later through wicker traps.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that agriculture began around the middle of the second
    period and discusses several cereal terms, including wheat or spelt, barley, oats,
    groats, chaff, and bread.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Cultivation is described as primitive work left to women and slaves, involving
    scratching ground near the dwelling with a pointed stick, sowing grain, covering
    it, and waiting for growth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Ripe grain is described as separated from straw and ground between two stones.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The earliest yearly division is described as winter and summer only; a word
    for autumn became necessary later when crops drew attention to that season.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Natural measures such as fathom, ell, and span are discussed, along with an
    early ability to count only up to seven and later divergent terms for ten.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says later vocabulary developed for counting, paying, and selling.
  category: sequence
  evidence_refs:
  - ev:8
