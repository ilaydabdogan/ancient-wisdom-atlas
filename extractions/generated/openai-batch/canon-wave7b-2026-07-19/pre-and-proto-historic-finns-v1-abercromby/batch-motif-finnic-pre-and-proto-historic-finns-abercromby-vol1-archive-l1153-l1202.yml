literal_observations:
- id: obs:1
  text: Dr. Sommier measured twenty adult male Zirians and eight women, reporting
    average heights and describing both sexes as well made, well fed, muscular, and
    healthy.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes Zirians as having white skin, fresh rosy cheeks in youth,
    predominantly grey eyes, abundant often curly hair, and no black hair among those
    observed.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that men over twenty-five have beards, sometimes scanty
    but more often thick, abundant, and usually curly.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Two facial types are described: one broad and somewhat massive with large
    cheek-bones and a small well-formed nose, and another oval with less prominent
    cheekbones, a long high nose, and deep-set eyes.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says the young women are rather pleasing and that the group gives
    an impression of being smart, intelligent, well-to-do, clean, and well dressed,
    especially compared with the Ostiaks among whom they live.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Another observer characterizes them as religious, obedient, peaceful, reliable,
    sober, sparing in speech, honest, opposed to theft, slow but not lazy, diligent,
    laborious, and not dirtier than their Russian neighbours.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The author states that, assuming the inventories of East and West Finns are
    accurate, there are both correspondences and differences, and most branches except
    Karelians and to a lesser extent Zirians are said to show sluggishness, shyness
    and suspicion of strangers, and obstinacy.
  category: relationship
  evidence_refs:
  - ev:7
