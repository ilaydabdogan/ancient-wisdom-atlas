  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says archaeology more strongly points to a prehistoric Scandinavian
    people in southwest Finland from an early date until about the sixth century.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage concludes that before departing, the prehistoric Scandinavian
    people taught enough metallurgy to the West Finns to create continuity between
