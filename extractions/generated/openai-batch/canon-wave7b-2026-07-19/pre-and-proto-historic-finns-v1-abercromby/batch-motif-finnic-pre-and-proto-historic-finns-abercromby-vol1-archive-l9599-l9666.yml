  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says Scandinavians traveling between their native land and the
    Gothic country would have passed through the land of the Wends.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says the Finns heard of Wends and a great Wendland south of themselves,
