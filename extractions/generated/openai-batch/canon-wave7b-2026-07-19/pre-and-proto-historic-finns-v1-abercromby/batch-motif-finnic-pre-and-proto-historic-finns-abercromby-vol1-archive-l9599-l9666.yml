  quote: ''
  summary: The passage describes Finnic attitudes toward life beyond the grave, a
    developing distinction between body and spirit or soul, new abstract and song-related
    vocabulary, the etymology and expansion of the term Vendja for Russia/Wends, and
    archaeological arguments about Proto-Scandinavian influence, metallurgy, and earlier
    Finnic movements in relation to Lithuanians, Wends, and Goths.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the Finns preferred to live as long as possible and
    did not anticipate life beyond the grave with pleasure.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Finns are said to have possessed a notion of a spirit distinct from the
    body and later to have adopted a more distinctive word for soul.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Abstract terms became current for necessity, mistake or error, permission
    from a superior, and vexation.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage lists words for human qualities such as just, wise, merciful,
    gracious, willing, assiduous or eager, blessed, meritorious, renowned, and timid,
    as well as qualities of objects such as rich, abundant, precious, beautiful, and
    unique.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A new word for song, runo, was introduced, while some kind of singing is said
    to have accompanied the zither in the previous period.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The word Vendja for Russia is connected by the author with Venedi, Old Saxon
    Wined, and modern Wend.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author states that the Finns borrowed the term Wend from East Teutons
