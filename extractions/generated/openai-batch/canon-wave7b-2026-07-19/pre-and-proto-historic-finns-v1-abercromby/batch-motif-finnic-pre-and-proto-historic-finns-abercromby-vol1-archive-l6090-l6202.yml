  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: Samoyede household gods, called Haake in the passage, may be stones, trees,
    other natural objects, or rude images; they are asked for help, especially for
    catching fish, and follow family migrations on a sleigh.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Lapp Seita or Storjunkare are described as family or clan gods; their forms
    include stones from streams, piles of stones, tree-stumps, posts, and stones resembling
    a human or animal.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Lapp Seita or Storjunkare are placed in high or prominent places, rich meadows,
    mountain tops, caves, or near rivers and lakes.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Green fir twigs, leaves, or grass are spread under or around Lapp Seita or
    Storjunkare according to season.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: Lapp Seita or Storjunkare protect worshippers from reindeer misfortune, instruct
