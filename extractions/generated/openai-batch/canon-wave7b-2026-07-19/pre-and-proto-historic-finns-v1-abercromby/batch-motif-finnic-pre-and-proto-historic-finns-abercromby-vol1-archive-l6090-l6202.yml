canonical_text:
  quote: ''
  summary: The passage describes offerings to a forest spirit or master of the forest,
    then surveys Ostiak, Samoyede, Lapp, and Votiak clan, family, and private tutelary
    beings or idols. These beings are represented by wooden images, stones, trees,
    posts, baskets, boxes, or other objects; they are associated with hunting, fishing,
    reindeer protection, family fortune, migration, and clan identity; and they receive
    offerings or ritual attention.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Offerings to a forest spirit or master of the forest include brandy, bread,
    a bull, and a grey ram; in some places bread is placed on tree branches, and the
    spirit is asked to give forest animals.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ceremis are said to bring offerings to the forest-spirit so that he will
    not entangle them in the forest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ostiak clans are described as exogamous groups with common ancestry, a common
    cult, and clan images worshipped with offerings and religious ceremonies.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ostiak families and individuals may have small wooden images representing
    male or female personages, or odd-looking stones and other natural objects, serving
    as tutelary gods.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ostiak private and family idols may be transported on a special sleigh during
    movement and may be set up in a tent, pasture-ground, or places where animals
    and fish are caught.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ostiak images are sometimes credited with special functions, such as protecting
    reindeer, providing fish, or caring for health and married life.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage reports a suggested but uncertain connection between Mongol domestic
