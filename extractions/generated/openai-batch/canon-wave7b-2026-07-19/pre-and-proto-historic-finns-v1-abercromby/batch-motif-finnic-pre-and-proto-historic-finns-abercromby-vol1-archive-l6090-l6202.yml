    give hunting or fishing luck.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Offerings to Lapp Seita or Storjunkare include hides and hoofs of reindeer
    and calves, sometimes a dog, and reindeer sacrifices; every clan and family is
    said to have its own hill of sacrifice.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Votiak Vorsud is described as a family and clan god, a protector of good
    luck, and a protector of family fortune.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: 'The Votiak Vorsud has a clan identity marked by marriage restriction: two
