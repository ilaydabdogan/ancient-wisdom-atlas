canonical_text:
  quote: ''
  summary: The passage describes Neolithic-period archaeological finds from Kunda
    in northern Estonia and Rinnekaln near Lake Burtneek, including bone and flint
    implements, pottery, animal bone carving, local fauna, and typological comparisons
    with finds from Ladoga, Volosovo, Lake Sigir, Upper Isset, and other regions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Kunda, remains of human industry were found in marl beds that had formed
    the bottom of a former lake.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kunda assemblage includes bone harpoons, spear- and arrow-heads, daggers,
    knives, scrapers, and chisels, generally made of elk bone, with limited flint
    items and flint flakes set into grooved bone arrows using pitch.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that similar weapons are known from Lake Sigir, East Prussia,
    Denmark, and southern Sweden, and explains the scarcity of flint by its limited
    availability in the Baltic provinces.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: No pottery or personal ornaments were found at Kunda; the passage suggests
    that the objects may have been lost in water or on ice some distance from the
    shore.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Reindeer, bison, and elk are said to have roamed near Kunda, while no trace
    of the dog was found.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Grewingk calculated a relatively recent age for the Kunda finds, but the passage
    cautions that such underwater deposit calculations are unreliable and notes that
    Grewingk himself thought the date should be increased.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: Rinnekaln is located on the left bank of the Salis where it issues from Lake
    Burtneek, and the passage says comparatively few fishing implements and weapons
    were found there.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: At Rinnekaln, bone spear-heads and daggers were coarser than at Kunda, harpoons
    were smaller with one or two barbs, and stone implements and arrow-heads were
    few despite a nearby flint workshop.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Rinnekaln pottery is described as coarse, gritty, mixed with broken mussel-shells,
    and either unbaked or only slightly baked; the vessels were probably cylindrical,
    sometimes lidded, and lacked handles, necks, or feet.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Rinnekaln pottery decoration included horizontal rows of holes, diagonal prick-marks,
    short incisions sometimes made with the fingernail, zoned or whole-surface distribution,
    and decoration on the inner side of the rim.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Grewingk is reported as saying that the Rinnekaln pottery design is more varied
    than at Ladoga and resembles finds from Volosovo.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Needles at Rinnekaln were made from bird bone, chiefly swan bone.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: Rinnekaln bone carving included full-relief animal heads or necks at the end
    of long bones and bird silhouettes incised from flat plaques, including swans,
    geese, bear, elk, and unspecified birds.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: Some Rinnekaln bone arrow-heads had unusual cone-and-stalk forms, and the
    passage notes analogies from the Upper Isset sub-district and a specimen in the
    University Museum of Kazan.
  category: relationship
  evidence_refs:
  - ev:10
