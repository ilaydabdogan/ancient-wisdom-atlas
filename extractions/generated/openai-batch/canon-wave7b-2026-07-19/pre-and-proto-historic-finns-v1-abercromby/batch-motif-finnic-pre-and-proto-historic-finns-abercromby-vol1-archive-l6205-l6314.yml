comparison_claims:
- id: claim:1
  claim: The passage treats Votiak vorsud and Ceremis uda vodid as comparable domestic
    or clan-protective spirits associated with twig bundles, and further compares
    such spirit domiciles with house gods of Lapps, Ostiaks, and Samoyedes in stones.
  claim_level: same_function
  target: Northern Eurasian house-god or household tutelary spirit pattern
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is functional and material; the passage does not establish
    direct historical contact or a single origin.
- id: claim:2
  claim: The author uses existing Ugrian and Eastern Finnic examples to reconstruct
    a similar prehistoric Finnic pattern of family and clan gods domiciled in stones,
    twig-fagots, and sacred trees, plus worship of large river spirits.
  claim_level: common_inheritance
  target: Reconstructed prehistoric Finnic family, clan, and river-spirit cult
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: low
  limitations: This is an authorial reconstruction from comparative examples, not
    direct prehistoric evidence in the passage.
- id: claim:3
  claim: Samoyed, Lapp, Votiak, and Mordvin solar practices are presented as sharing
    the broad function of directing prayer, homage, or sacrifice to the sun for warmth,
    sunshine, herding, or agricultural prosperity, although the sun’s importance varies.
  claim_level: same_function
  target: Solar prayer and offering pattern among Samoyedes, Lapps, Votiaks, Mordvins,
    and possibly Finns
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  counter_evidence_refs:
  - ev:9
  - ev:11
  confidence: medium
  limitations: 'The passage notes contrasts: Samoyedes otherwise show little special
    regard for the sun, the Votiak sun-mother is not important, while the Mordvin
    sun-god is supreme.'
- id: claim:4
  claim: The possible identity of river-names and vorsud names suggests a comparison
    between river spirits and clan tutelary spirits or clan names within the Votiak
    material.
  claim_level: same_function
  target: River spirit as clan tutelary or clan namesake
  evidence_refs:
  - ev:6
  counter_evidence_refs:
  - ev:6
  confidence: low
  limitations: The passage itself stresses uncertainty and notes other equally plausible
    explanations.
