  quote: ''
  summary: The passage describes Votiak and Ceremis household or clan spirits associated
    with bundles of twigs, kuala sacrificial buildings, seasonal offerings, possible
    links between vorsud names and rivers or villages, Mordvin domestic protective
    divinities, an authorial reconstruction of prehistoric Finnic family and clan
    gods, and solar or lunar offerings among Samoyedes, Lapps, Votiaks, and Mordvins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The vorsud is described as originally an invisible spirit residing in a bundle
    of twigs; wooden heads and dough images are described as later modifications.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Ufimsk Ceremis, the term uda vodid, glossed as house-spirit, is
    applied to a fagot of twigs kept in the front corner of the house.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Among the Vidtkan Ceremis, the twigs are renewed annually in spring: men
    remove old fagots from houses, leave them in a field, and new fagots are cut and
    taken home.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The master of the house speaks a formula asking the old one to go away, a
    good one to come, and protection from evil.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Votiak family and clan sacrifices are held in kuala buildings, which are described
    as the home of the vorsud.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The clan kuala belongs to the farm-buildings of the oldest man directly descended
    from the clan ancestor and does not differ from a family kuala.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Family and clan sacrifices are held regularly twice a year, at the beginning
    of summer and in autumn after field-work; offerings include bread, groats, beer,
    spirits, and a duck.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The man on whose farm the clan sacrifice is made acts as priest, and the office
    is hereditary.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Some vorsud names are identical with river-names or village names, and the
    passage says it is possible but uncertain that spirits of rivers were adopted
    as tutelary spirits and became clan names.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Mordvins are said to lack corresponding tutelary family and clan gods
    but to have divinities protecting the house, hearth, threshing-floor, corn-kiln,
    and similar places, to whom small sacrifices are made.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The author infers that prehistoric Finns had family and clan gods domiciled
    in stones, small stone piles, fagots of twigs, and sacred trees, and worshipped
