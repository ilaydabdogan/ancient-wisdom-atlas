comparison_claims:
- id: claim:1
  claim: The passage explicitly says Pohjola could be associated with wild animals
    and regarded in much the same way as Tapiola and Metsola.
  claim_level: same_function
  target: Tapiola and Metsola as wild-animal or hunting-associated realms
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal functional comparison made by the passage; it does
    not establish historical relationship or identity among these places.
- id: claim:2
  claim: The passage compares the invocation of helpful Pohjola personages to the
    occasional appeal to Hiisi, explaining both by their strength and possible appeasement
    despite evil disposition.
  claim_level: same_function
  target: Hiisi as a strong, potentially appeasable dangerous power
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is limited to the author's explanation of why such beings
    were invoked; it does not show that Pohjola beings and Hiisi share the same mythic
    identity.
