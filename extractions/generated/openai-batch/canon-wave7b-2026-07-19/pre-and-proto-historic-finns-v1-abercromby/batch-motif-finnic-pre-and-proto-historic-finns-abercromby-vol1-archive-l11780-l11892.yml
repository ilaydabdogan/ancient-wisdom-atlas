canonical_text:
  quote: ''
  summary: 'The passage describes Pohjola as an indeterminate northern or lower realm:
    dark, sunless, and associated with a fiery river, a bridge made from a felled
    oak, wild animals, sporting dogs, cold, healing substances, and powerful beings
    invoked for hunting, veterinary, medical, and protective purposes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pohjola is glossed as the home of the north, while pohja is also said to mean
    the bottom or lower end of an object; the term is described as vague and without
    geographical significance.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pohjola is described as murky, sunless, moonless, and as having a large northern
    gate, a fiery river, and an eternal bridge across that river.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The passage says hunters associated Pohjola with abundant wild animals and
    invoked Pohjola-related beings to send, release, or drive game toward them.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:4
  text: Women or mistresses of Pohjola are connected with sporting dogs, including
    removal of impediments, control of untimely barking, and taming a dog by smearing
    its teeth with sweet substance.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:5
  text: One origin account attributes the birth of a pup and, under another name,
    a wolf to the harlot mistress of Pohjola after she lay with her back to the wind
    and became pregnant.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Milk from a blind woman of Pohjola or Ulappala is invoked for a wound caused
    by castration.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Cold materials and cold-associated beings from Pohjola, including ice, snow,
