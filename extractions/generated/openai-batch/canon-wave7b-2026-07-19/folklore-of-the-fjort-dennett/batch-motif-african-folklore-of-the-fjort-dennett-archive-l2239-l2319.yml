  summary: The passage presents an ethnographic description of livelihood, trade,
    childbirth practices, infant protection and nursing, puberty rites for boys and
    girls, and marriage exchange and oath practices. A footnote comments on the lack
    of a KaCongo word for shepherd and a missionary’s lexical adaptation when preaching
    about the Christian Nativity shepherds.
