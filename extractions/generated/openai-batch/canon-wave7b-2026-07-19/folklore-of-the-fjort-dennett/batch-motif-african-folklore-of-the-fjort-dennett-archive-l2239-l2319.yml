literal_observations:
- id: obs:1
  text: The described community plants crops, keeps a few domestic animals, hunts,
    manufactures cloth, metal goods, ornaments, pottery, nets, and other materials,
    and trades some products with Europeans.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A footnote states that the KaCongo dialect lacks a direct word for shepherd
    and describes a native missionary or priest using a Portuguese-derived term for
    a fowl-keeper when referring to the shepherds who visited the child Christ and
    his mother.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Women hoeing fields sometimes dig up pieces called preserved lightning, identified
    by the text as aulo or buangu, gum copal, and sell them to traders.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: People gather around the hut where a woman is about to give birth, fire guns,
    and shout to help her deliver the child.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The woman giving birth is attended by her mother or another female relation,
    and the child is washed, sometimes in palm-wine.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the afterbirth comes away, the woman goes to a hot bath, and women throw
    very hot water on her parts with their hands.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Charms are attached to the infant; the mother suckles the child until nearly
    two years old and remains separated from her husband until the child is weaned.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: A boy at puberty is circumcised, and if he is wealthy a dance is held in his
    honor.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A girl’s first menstruation is marked by gunfire and a dance; she is then
    caught and taken to the paint-house, painted red, fed and treated, later washed,
    and led to her husband when considered ready for marriage.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: If the girl has no husband waiting, she is covered with a red cloth or handkerchief
    and taken by women around different towns until someone wants to have her.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: A man wishing to marry a girl presents goods to her parents according to the
    value they place on her; marriage may follow rites such as Lembe or Funzi, includes
    a native-made copper bracelet given by the husband and worn by both, and includes
    the woman’s oath of faithfulness and burial with him.
  category: sequence
  evidence_refs:
  - ev:10
