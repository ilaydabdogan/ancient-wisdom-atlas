  quote: ''
  summary: In an episode titled as a fight between two fetishes, Lifuma carries holy
    ground and salt water connected with sea-beach ownership and fishing. The bird
    Ngundu reports him to Chimpukela, the Kaia people's fetish. Chimpukela confronts
    Lifuma; after being pushed aside and tripping on an ant-hill, he knocks Lifuma
    down. Lifuma breaks his leg on a Minyundu-tree thorn, the salt water is spilled,
    and Chimpukela takes the beach relics. Chimpukela swears away ant-hills from his
    country, while Lifuma curses Ngundu, the Minyundu tree, canoes, salt water, and
    beach things, explaining their absence from his country and sweet-water lake.
