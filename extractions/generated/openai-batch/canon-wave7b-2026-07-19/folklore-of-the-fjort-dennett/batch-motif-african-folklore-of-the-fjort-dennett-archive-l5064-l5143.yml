canonical_text:
  quote: ''
  summary: The supplied passage contains two narratives. In the first, four primordial
    men in a wood encounter a clear river and a black, foul river; two cross the black
    river and become white, while two who turn back and cross the clear river become
    black except for the parts that had touched the black river, after which each
    pair finds women of the corresponding color and marries. In the second, towns
    afflicted by small-pox decide to ask Nzambi Mpungu why he is angry; several bird
    messengers are sent, two fail to be understood, and a ground-dove is heard but
    receives no answer.
  language: English
  quote_policy: summarized
