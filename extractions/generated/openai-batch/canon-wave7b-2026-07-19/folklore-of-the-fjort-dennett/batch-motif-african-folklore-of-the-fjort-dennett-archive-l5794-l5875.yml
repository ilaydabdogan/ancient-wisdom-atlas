canonical_text:
  quote: ''
  summary: Nzambi wants Nchonzo nkila's drum so that she can dance. Antelope and Mpacasa
    each try to obtain the drum by borrowing or running away with it and are killed
    by Nchonzo nkila's people. Kivunga reports these events to Nzambi. Mfiti the ant
    volunteers, enters the house where the drum is kept while all are asleep, carries
    it away unnoticed, and brings it to Nzambi. Nzambi rewards the ant and plays the
    drum for her people to dance. Nchonzo nkila discovers the drum is missing, summons
    the birds, and seeks a palaver with Nzambi at Neamlau's town.
  language: English
  quote_policy: summarized
