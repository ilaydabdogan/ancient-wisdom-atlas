- id: obs:3
  text: The Chegilla rules require abstention from specified foods, including certain
    poultry, flesh of wild beasts, fruits, and roots prepared in particular ways.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Young people are described as obeying these injunctions with strong religious
    observance and preferring to fast rather than eat forbidden food.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the anecdote, a young traveler eats a wild hen after his host tells him
