  quote: ''
  summary: The passage discusses Merolla's seventeenth-century account of Chegilla/Kazila
    food prohibitions, including an anecdote in which a man dies after learning that
    he had violated a wild-hen prohibition. It then compares related West African
    terms for individual food prohibitions and distinguishes family-wide animal abstentions
    from totemic descent explanations.
  language: English
  quote_policy: summarized
