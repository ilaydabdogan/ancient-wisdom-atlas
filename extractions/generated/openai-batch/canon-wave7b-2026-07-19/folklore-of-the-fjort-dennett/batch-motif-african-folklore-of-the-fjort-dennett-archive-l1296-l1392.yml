  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The narrator states that, in West Africa, every individual outside European
    or Mahommedan influence has a law that there is one thing he may not do, and that
    this law is always a food prohibition in its essential character.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The same kind of prohibition is named Ibet among the Calabar people, Orunda
    among the Gaboon people, and Kecheela or Chegilla among the Fjorts.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The narrator reports that some prohibitions are common to a whole family,
