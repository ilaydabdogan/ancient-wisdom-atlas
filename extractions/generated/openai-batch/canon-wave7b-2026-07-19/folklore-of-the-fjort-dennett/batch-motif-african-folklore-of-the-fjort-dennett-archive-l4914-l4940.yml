  quote: ''
  summary: At Chilunga, the fetish or spirit Boio is said to rule through a princess,
    dwell in the earth, receive offerings that disappear, and speak with both a human
    voice and a bird's voice. A woman who rebukes a loud bird is bound by an invisible
    force until her husband makes a peace-offering to the princess, who releases her.
