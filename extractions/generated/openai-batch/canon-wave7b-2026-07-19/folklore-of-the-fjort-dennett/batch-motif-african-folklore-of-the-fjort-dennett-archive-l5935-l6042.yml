canonical_text:
  quote: ''
  summary: Nzambi’s protected daughter is sent with a slave to a distant paint-house
    for puberty purification. During the journey the slave demands the daughter’s
    ornaments and clothing in exchange for naming unfamiliar creatures. At the destination,
    the slave is treated as the princess and placed in the paint-house, while Nzambi’s
    daughter is made to work in the plantations. The daughter sends a message through
    a trader to Nzambi. Nzambi and her husband arrive, discover the deception, spare
    the prince as blameless, and punish the slave by stripping her and burning her
    inside the house.
  language: English
  quote_policy: summarized
