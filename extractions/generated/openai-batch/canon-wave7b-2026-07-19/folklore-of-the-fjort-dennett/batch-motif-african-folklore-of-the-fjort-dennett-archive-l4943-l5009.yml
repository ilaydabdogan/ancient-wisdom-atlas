canonical_text:
  quote: ''
  summary: 'The passage recounts powers attributed to the Fetish of Chilunga: people
    who mock an invisible hammock-borne fetish are imprisoned until payment is made,
    girls refusing arranged marriages are detained at holy ground until they consent,
    dancers are rewarded or punished, offerings disappear before a skeptical white
    witness, and only two appointed food-carriers can see the fetish. The passage
    then begins a separate tale in which a man with many wives exchanges palm-nuts
    with a leopard and a crocodile for meat and fish.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some people laughed at two men carrying a hammock-pole as if a hammock were
    hanging from it; invisible hands made the mockers prisoners, and they were released
    only after a heavy payment was made to the princess by their relatives.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The men with the hammock-pole were described as carrying the fetish in his
    hammock, though the fetish and hammock were invisible to passers-by.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Girls given in marriage to ugly men and objecting to them are taken to the
    holy ground, hear a voice rebuking them, have their hands tied behind them, and
    remain prisoners until willing to marry the men.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the whole town goes to the holy ground to praise the fetish, the fetish
    delights in those who dance well and punishes those who dance badly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A white man who doubted the sudden disappearance of offerings brought presents
    to the holy ground at the princess’s request, watched them, saw them disappear,
    and then said he believed in the spirit.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Only two appointed men can see the fetish in his earthly home, and they are
    assigned to carry food to him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A man with many wives lives in a town far away in the bush; his wives refuse
    to work, leaving him uncertain how to feed them and himself.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The man cuts twenty bunches of palm-kernels or palm-nuts and gives ten bunches
    to the leopard, who promises fresh meat if the man cuts palm-nuts only for him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The man gives ten bunches of palm-nuts to the crocodile, who promises daily
    fish if the man cuts palm-nuts only for him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The next day the leopard brings the man a wild pig, the crocodile brings fish,
    and the town becomes full of food.
  category: sequence
  evidence_refs:
  - ev:8
