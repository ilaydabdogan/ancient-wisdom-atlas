  quote: ''
  summary: Mary H. Kingsley reports that Dennett sent notes on the introduction. One
    note explains Bavili as “lost men” connected with a northward journey. Another
    note describes Kongo as the only Fumu, king of united provinces, who sent sons
    as Mafumu to rule provinces; those sons divided lands among their children as
    Tekklifumu, while Fumu later came to mean chief or head of a family and originally
    meant judge.
