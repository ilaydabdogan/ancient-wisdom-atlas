  summary: The passage describes xina as general and particular restrictions, gives
    examples of animal or fish xina for named groups, states that a pot used to cook
    xina remains unclean for the affected person, and explains a belief in an ancestral
    “voice that speaks” taken from a dead father, placed in a living relation, and
    linked to transmission of the father’s xina to offspring.
