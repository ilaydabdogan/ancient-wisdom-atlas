canonical_text:
  quote: Nzambi-Mpungu is what we should call the Creator. Nzambi (wrongly called
    God) is Mother Earth, literally Terrible Earth.
  summary: 'The passage defines the Fjort as tribes of the former kingdom of Congo,
    focuses on KaCongo and Loango, and describes legendary and ritual structures:
    Fumu Kongo sends sons and a rain-doctor to govern provinces; sacred earth-fetishes
    mark their route; families maintain sacred ground and ritual specialists; and
    Nzambi is described in Fjort legends as Mother Earth appearing as mother, princess,
    or poor woman who reveals herself and punishes.'
  language: English
  quote_policy: quoted
