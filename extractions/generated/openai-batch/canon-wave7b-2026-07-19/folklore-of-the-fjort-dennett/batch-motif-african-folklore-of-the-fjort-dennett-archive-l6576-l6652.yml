canonical_text:
  quote: ''
  summary: 'The passage closes a dispute in which a condemned Nsasso man settles with
    a Mandamba man by paying the price of his life. It then presents an account illustrating
    the danger attributed to words: Kingolla speaks to his sister Cha about preserving
    her health and children; after a child dies, Cha and her father suspect bewitchment
    or poisoning. Kingolla undergoes a casca ordeal, vomits, and is declared innocent.
    A sequel reports Kingolla’s adultery with Lallu’s wife, Lallu’s killing of the
    wife, the woman’s father declaring war over the killing, and Kingolla dying as
    the only man killed in that war. The passage ends with notes classifying Nkissism
    into earth/nature Nkissi, nail-studded wooden images, family fetishes, and medicines,
    each associated with ritual specialists.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Nsasso man is condemned to be burnt, but the matter is settled when he promises
    to pay the price of his life to a Mandamba man, who accepts payment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator states that the Fjort are quick to give subtle meaning to words
    and frames the story as illustrating the force of words.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kingolla returns from Banana in a happy state and tells his sister Cha to
    keep healthy, maintain strength, and look after her children because they belong
    to a great family and must prolong the race.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Cha wonders what Kingolla means, since she believes everyone is in good health.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The next day one of Cha’s children falls sick and dies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Cha tells her father what Kingolla said and says she fears that he bewitched
    the child; the father accuses Kingolla of poisoning the child.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kingolla denies the charge, is told to take casca so that God may judge, takes
    casca, vomits, and is thereby presented as innocent.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Casca, also called cassia or NKasa, is identified in a footnote as powdered
    bark of a tree.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Later, Kingolla commits adultery with Lallu’s wife; Lallu catches him and
    stabs his wife to death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The woman’s father is angry because local law would have allowed him to take
    his daughter back and reimburse Lallu for bride payment and support costs.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The woman’s father declares war against Lallu and his family; Kingolla joins
    the father’s side and is the only man killed in the war.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: 'Nkissism is described as divided into four parts: Earth or Nature Nkissi
    with the king as high priest; nail-driven wooden images with Ngangas; little or
    family fetishes with a family Nganga; and medicines with a Nganga bilongo or medicine
    man.'
  category: other
