canonical_text:
  quote: ''
  summary: The passage introduces Nzambi as a mighty ruler and mother. In one story,
    Nzambi appears as a poor old woman carrying a thirsty child; women refuse water,
    while a man in a palm tree gives palm-wine. The next day a lake appears, Nzambi
    declares the women punished, sets a taboo on women eating its fish, and rewards
    the man. In a second story, an afflicted old woman is denied hospitality by most
    of Sonanzenzi but cared for by the last household; she warns them to leave before
    rains submerge the town, described as destroyed by Nzambi.
  language: English
  quote_policy: summarized
