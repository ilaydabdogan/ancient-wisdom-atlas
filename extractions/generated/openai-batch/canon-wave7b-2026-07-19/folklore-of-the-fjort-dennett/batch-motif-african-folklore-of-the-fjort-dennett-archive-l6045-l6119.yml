canonical_text:
  quote: ''
  summary: The passage explains Nkissism and the term Nkissi as a mysterious power
    associated with plants, herbs, earth, medicine, poison, hypnosis, harm, and healing.
    It connects Nkissi to earth-derived power, glosses Nza-mbi as fearful firstborn,
    mother, or producer, derives the creator-name Nzambi Mpungu as father of Earth,
    and then cites dictionary accounts distinguishing a Supreme Being from Mother
    Earth and from lesser harmful divinities.
  language: English
  quote_policy: summarized
