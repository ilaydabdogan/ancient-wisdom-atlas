canonical_text:
  quote: ''
  summary: A lost boy climbs a tree and is threatened by Bimbindi until his parents
    rescue him with pepper and a pepper-loaded gun; the negligent neighbor is punished.
    The passage then notes related tales of women captured by Bimbindi, a Chimbindi
    husband, nocturnal fear of Bimbindi, and an explanation of Nganga Nkissi, Nkissi/fetish
    practice, and Ndotchi as a hidden causer of suffering.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The boy cannot find his parents, walks all day, climbs a big tree at night,
    sits there, and cries.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Chimbindi finds the boy, calls friends, and the boy sings that his parents
    left him, food was withheld from him, and he has come there to die.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bimbindi come near the boy intending to kill him, and he cries for his
    mother.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The parents return; the mother hears the boy crying and says he is in the
    woods where the Bimbindi will eat him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father buys chili pepper and loads his gun with it; the mother carries
    a calabash of pepper.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The mother finds the boy by his cries; the father shoots the Chimbindi as
    it climbs the tree to kill his son, and the mother rubs pepper into the eyes of
    the others, making them run away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The parents demand an explanation from their neighbor; the father shoots the
    woman after saying she tried to kill his child, and the people say he acted rightly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Women are said to have been captured by Bimbindi and made to live with them,
    but to have escaped and repelled following Bimbindi with pepper and boiling water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In an opposite case, a Chimbindi comes to a town, marries a girl, runs away
    at daybreak, spends the night eating insects and lizards, and is left by the girl.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Native women are said not to go out alone at night for fear of Bimbindi, and
    wailing noises at night are attributed to them.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Nganga Nkissi is described as a man learned in mystery who acts as curer,
    with power attributed to the Nkissi or fetish rather than to himself.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: A sufferer goes to the Nganga Nkissi to learn why he suffers and who causes
    it; if the healer cannot divine this, he advises knocking a nail into the fetish
    and asking it to kill the causer.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Ndotchi is described as the causer of pain or suffering, with senses including
    poisoner, spell-binder, evil-wisher, or hypnotiser.
  category: attribute
  evidence_refs:
  - ev:8
