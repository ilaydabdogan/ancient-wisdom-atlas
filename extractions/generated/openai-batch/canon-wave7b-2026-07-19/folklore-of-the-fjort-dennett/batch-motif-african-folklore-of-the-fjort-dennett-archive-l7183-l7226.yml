canonical_text:
  quote: ''
  summary: A song titled “The Song of the Snake” gives Fjort-language lines with Latin
    and English explanatory notes. It states that a small snake devouring a person
    would be unbelievable, uses a knife-killing image for a shocked response to an
    offense, identifies the son of Zinga as beautiful and given to pederasty, says
    Bakana wanted to kill him and that he replied defiantly, and says Macosso, a boy
    of Danka, loved a white man’s master and mourned when he went to Europe. A note
    explains Bakulu/Nkulu as an invisible dead element or spirit that can be placed
    in a living person’s head, with an additional account involving a fetish called
    Buti and the tying up of other Bakulu.
  language: Fjort/Kikongo, Latin, and English
  quote_policy: summarized
