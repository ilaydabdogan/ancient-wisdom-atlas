  quote: ''
  summary: The introduction describes individual white traders in Congo Français,
    KaCongo, and Angola as dealing directly with native authorities. It says native
    authorities view such a trader as superior and spirit-like, while trying to manage,
    propitiate, or bully him. The passage argues that the trader comes to know Africans
    well, cares for them in sickness or trouble, helps maintain peace, and is therefore
    a valuable collector of facts about the region. It also says the trader may complain
    to the gods about living among Africans, but later, if sent home, longs to return
    to the Coast.
  language: English
