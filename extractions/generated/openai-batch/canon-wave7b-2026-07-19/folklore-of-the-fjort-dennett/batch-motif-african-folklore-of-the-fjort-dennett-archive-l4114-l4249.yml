canonical_text:
  quote: ''
  summary: 'The passage first concludes an antelope-and-leopard tale: a maiden persuades
    the leopard to mutilate himself, then reveals herself as the antelope and says
    she has destroyed him and his family, explaining leopard hostility toward antelopes.
    The passage then begins a tale in which Nzambi on earth sets a marriage condition
    for her daughter: a suitor must bring heavenly fire from Nzambi Mpungu above the
    blue roof. Spider recruits animal helpers, makes a thread route to heaven, enters
    with the tortoise, woodpecker, rat, and sandfly, passes tests through their specialized
    actions, obtains a case containing heavenly fire, presents it to Nzambi, and receives
    the daughter, after which helpers dispute the reward.'
  language: English
  quote_policy: summarized
