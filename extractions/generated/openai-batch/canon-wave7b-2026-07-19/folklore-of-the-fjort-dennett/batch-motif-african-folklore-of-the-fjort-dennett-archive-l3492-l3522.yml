  quote: ''
  summary: A husband complains that his wife uses too many palm-nuts. The wife says
    his relations ask her for them until they are gone. He orders her to accompany
    him to the distant palm-trees and carry nuts back, despite her refusal and her
    household work. He drags her into the woods, places her on a rough table, cuts
    off her arms and legs, leaves her there, and returns to town claiming she has
    gone to visit her relations.
