canonical_text:
  quote: giving a person a prohibited food
  summary: The passage explains that witches may destroy victims through soul-catching,
    placing young crocodiles in them, or poisoning. A particularly vile form of poisoning
    is giving someone a food prohibited by that person's Orunda. The giver is said
    to risk the wrath of the spirit to whom the prohibited food belongs. The passage
    then distinguishes these prohibited-food matters from things considered literally
    unclean or loathsome, such as animal milk and eggs.
  language: English
  quote_policy: quoted
