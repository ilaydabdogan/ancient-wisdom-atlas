canonical_text:
  quote: ''
  summary: The passage contains the tale of Nenpetro, a hunter killed by an ox and
    restored by his three wives, each contributing by dreaming, guiding, or raising
    him with herbs. It then begins another tale in which Nenpetro’s daughters may
    be married only by a suitor who guesses their names; Nsassi’s dog overhears the
    names, tries to carry them back, forgets after eating, and returns to hear them
    again.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nenpetro has three wives named Ndoza'ntu, Songa'nzila, and Fulla Fulla, whose
    parenthetical meanings are given as Dreamer, Guide, and Raiser of the Dead.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nenpetro hunts an antelope and a monkey for his wives, but they continue to
    complain of hunger.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nenpetro follows ox tracks, kills an ox, and is then killed by another angry
    ox before he can reload.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ndoza'ntu dreams that Nenpetro was killed by an ox after killing an ox himself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Songa'nzila says she will show the road, and the wives travel over hills,
    dales, woods, and rivers to the place where Nenpetro lies dead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Fulla Fulla collects herbs and plants in the woods and sets about raising
    Nenpetro from the dead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The three women quarrel over whose shimbec Nenpetro should first enter, each
    citing her own contribution.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Each wife cooks a pot of food for Nenpetro; he takes Fulla Fulla's pot of
    pig and declares her gift most prized.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The majority agrees with Nenpetro's judgment, while women nearby say he should
    have mixed food from all three pots.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: In the next tale, Nenpetro has two wives and two daughters named Lunga and
    Lenga, and the family sets a condition that the daughters will be given only to
    the man who can find out their names.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: An antelope offers cloth and valuables for the daughters but is refused because
    he does not meet the name-guessing condition.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Nsassi, described as a prince from another town, comes with his dog and asks
    for Nenpetro's daughters, but is told to guess their names.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Nsassi's dog remains behind, hears Nenpetro call Lunga and Lenga by name,
    and decides to tell Nsassi.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: On the road, the dog becomes hungry, catches and eats a wild kitten, then
    realizes he has forgotten the daughters' names and returns to Nenpetro's town.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: After the dog returns and sleeps, Nenpetro tells Lunga and Lenga to give the
    dog some food.
  category: speech
  evidence_refs:
  - ev:14
