canonical_text:
  quote: ''
  summary: The passage describes relatives consulting a Nganga associated with a fetish
    or Nkissi after a death, asking about a nail driven into it and paying for the
    nail to be removed. It also describes accusation of a witch, bark ordeals using
    Mbundu or Nkassa, consequences for those who do not vomit, the Nganga's conditional
    retention or return of cloth, and the calling of a carpenter to build a coffin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Relatives go to the Nganga of the fetish or Nkissi and ask whether he remembers
    a named person knocking a nail into it and can point out the nail.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the Nganga says yes, the relatives pay him to draw out the nail so that
    the rest of the family may not die.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Nganga may indicate a person said to have bewitched the dead man, called
    in the passage a Ndotchi or witch.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person accused in this context is given powdered bark to swallow and must
    vomit it if innocent.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mbundu is given to a person who admits being a witch but denies killing the
    dead person; Nkassa is given to those who deny being witches altogether.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Persons who take the bark and do not vomit are killed or die from the poison,
    and their bodies were formerly burnt; the passage says later authorities allowed
    the witch's relatives to bury the body.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: If events occur as divined by the Nganga, he keeps the cloth given to him;
    otherwise he returns it to the family, who take it to another Nganga.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: While these events are occurring, a carpenter is called to build the coffin
    and is paid one fowl and one rush mat in the visible portion of the passage.
  category: action
  evidence_refs:
  - ev:5
