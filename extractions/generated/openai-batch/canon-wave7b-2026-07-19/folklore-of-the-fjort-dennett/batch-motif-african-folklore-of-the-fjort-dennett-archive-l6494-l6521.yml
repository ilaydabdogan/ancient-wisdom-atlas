canonical_text:
  quote: ''
  summary: The passage describes a Fjort palaver court procedure in which a Nzonzi’s
    speech, songs, hand-clapping, public chorus, princely deliberation, judgment,
    collective excitement, punishment, and, in inter-tribal disputes, an agreement
    sealed by killing a slave are presented as stages of adjudication.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A conclusion drawn by the Nzonzi may be affirmed by repeating his last sentence,
    clapping hands, or joining the chorus of a song used to illustrate the case.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the song is stirring and not decisive for either side, princes, audience,
    and both sides may join in until the presiding prince silences the court with
    a grunt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The proceedings may continue for many days until the two parties have, as
    the text says, talked themselves dry.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The princes leave the court to drink water, decide on the guilt of the litigant,
    and return.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The presiding prince reviews the counts and gives judgment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Songs, hand-clapping, and repeated words accompany the judgment until the
    court admits the justice of the prince’s words and judgment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: After judgment, an uproar occurs; the last song is sung, men jump, dance,
    and wave spears and guns over their heads.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The condemned person is fined and given days to pay, or, if the punishment
    is death, is tied up and either killed or ransomed according to position.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the dispute is between two tribes, after the fine has been paid an agreement
    is made between the parties and a slave is killed to seal the compact.
  category: sequence
  evidence_refs:
  - ev:5
