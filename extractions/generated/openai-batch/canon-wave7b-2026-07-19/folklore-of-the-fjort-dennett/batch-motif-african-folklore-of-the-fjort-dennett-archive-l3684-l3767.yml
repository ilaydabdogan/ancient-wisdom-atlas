canonical_text:
  quote: ''
  summary: Mavungu travels with a responsive charm that provides food and lodging.
    He reaches Nzambi's town, marries Nzambi's daughter, sees mirrors that show towns,
    and insists on viewing the covered mirror of a town from which no one returns.
    Despite his wife's warning, he departs for that town, asks an old woman for fire,
    and is killed by her after tying up his horse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mavungu travels until hunger overcomes him; when he asks his charm whether
    he will be left to starve, the charm provides a sumptuous feast, and he eats.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Mavungu asks whether the used plates will be left for commoners, the
    charm causes everything to disappear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When Mavungu becomes tired, he asks the charm to arrange a sleeping place,
    and the charm provides comfort for a peaceful night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After many days of travel, Mavungu arrives at Nzambi's town; Nzambi's daughter
    sees him, falls in love, and tells her parents she must marry him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mavungu tells Nzambi he has come to marry Nzambi's daughter, and Nzambi says
    he may marry her if she will have him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mavungu and Nzambi's daughter love one another, are led to a fine shimbec,
    and the people of the town dance and sing for gladness.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: In the shimbec, Mavungu notices many covered mirrors; when some are opened,
    he sees likenesses of his native town and other towns he knows.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nzambi's daughter refuses to uncover one mirror because it shows the town
    from which no man who wanders there returns.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mavungu urges her to let him see the last mirror, looks at the reflected image,
    and says he must go there.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Nzambi's daughter warns that Mavungu will never return, but he says his charm
    will protect him, leaves his newly married wife, mounts his horse, and departs.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: Near the town, Mavungu meets an old woman and asks her for fire to light his
    pipe; she tells him to tie up his horse and come fetch it.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Mavungu ties up his horse, approaches the old woman for the fire, and she
    kills him so that he disappears entirely.
  category: action
  evidence_refs:
  - ev:7
