canonical_text:
  quote: ''
  summary: 'The passage describes Fjort beliefs and rites concerning death and burial:
    chibinga may leave a corpse with open eyes, indicating that the deceased is annoyed
    and should not be buried normally; such a corpse is wrapped in mats and placed
    in the woods near an Nlomba tree. Improper burial or the deceased''s chimyumba
    appearing to family members is said to bring death. A Nganga can place the deceased''s
    nkulu in the head of a relation, using grave earth, medicine, containers, a chalk
    circle, a rattle, and incantation, so that the deceased can communicate with the
    family. The passage also reports that the Fjort say the shadow ceases at a person''s
    death, with a footnote relating this to Miss Kingsley''s statements about four
    souls.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fetish chibinga sometimes prevents a corpse from closing its eyes; this
    is treated as a sign that the deceased is annoyed and does not wish to be buried.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:2
  text: When this open-eyed corpse condition occurs, no coffin is made; the body is
    wrapped in mats and placed in the woods near an Nlomba tree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that ordinary burial in such a case would cause all the
    family to become sick and die.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: If the deceased's chimyumba appears to a family member, that person is said
    to die; people outside the family may see it without dying.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The deceased often does not rest quietly until the nkulu is placed in the
    head of one of his relations, enabling communication with the family.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Nganga picks up earth from the deceased's grave, mixes it with medicine,
    and places it either in an antelope horn or in a little tin box.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Nganga sits on a mat inside a chalk circle, shakes a small rattle at the
    patient, and performs an incantation until the patient trembles and cries out
    in the voice of the deceased.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Medicine and grave earth in the tin box are called nkulu mpemla and indicate
    ordinary disease; medicine and earth in the antelope horn are called nkulu mabiali
    and indicate sickness of the head.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:9
  text: Chibinga is defined as both the state of a corpse whose eyes remain open and
    the power or nkissi causing that affliction.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Fjort say that the shadow ceases at the death of the person; an elderly
    aunt emphatically rejects the suggestion that this depends on whether the corpse
    is in shade or sun.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: A note by Miss Kingsley says the final passage supports her statements on
    four souls and explains that the shadow dies utterly at bodily death.
  category: other
  evidence_refs:
  - ev:5
