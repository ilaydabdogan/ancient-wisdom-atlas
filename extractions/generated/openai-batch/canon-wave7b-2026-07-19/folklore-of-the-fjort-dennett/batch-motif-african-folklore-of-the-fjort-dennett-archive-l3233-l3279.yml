canonical_text:
  quote: ''
  summary: In a tale section titled “The Jealous Wife,” an elder wife kills a sleeping
    child at night, intending harm, but discovers in the morning that she has killed
    her own child. She flees into the woods with the body. The husband and bushmen
    search for her. A bushman finds her nursing and shaking the dead child while singing
    to it. The husband and her relations capture her; after confirming the murder,
    they give her casca, which kills her, then burn her body and scatter the ashes.
  language: English
  quote_policy: summarized
