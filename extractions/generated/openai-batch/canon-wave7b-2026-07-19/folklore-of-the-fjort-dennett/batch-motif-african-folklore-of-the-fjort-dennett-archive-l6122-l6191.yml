canonical_text:
  quote: ''
  summary: The passage explains terms and relationships among Mpungu, Nzambi, Nza,
    and Nkissi; presents Nzambi Mpungu as a remote creator-father linked by the author
    to Christian imagery; and recounts a report of a man taken during a thunderstorm
    to Nzambi Mpungu's heavenly abode, fed there, shown abundant plantations and rivers,
    and then returned to his family after choosing not to remain.
  language: English
  quote_policy: summarized
