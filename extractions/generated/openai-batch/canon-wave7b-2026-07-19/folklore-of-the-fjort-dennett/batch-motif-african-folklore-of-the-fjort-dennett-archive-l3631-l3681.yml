canonical_text:
  quote: ''
  summary: The passage closes a dispute in which Kengi and Gunga argue before Manilombi
    over ownership of a child born on Gunga's plantation under a prior agreement.
    Manilombi rules for Gunga. The next tale begins with twin sons, Luemba and Mavungu,
    born almost full-grown and each with a charm. The daughter of Nzambi rejects many
    suitors. Mavungu determines to marry her and uses his charm to transform grass
    into equipment for a journey.
  language: English
