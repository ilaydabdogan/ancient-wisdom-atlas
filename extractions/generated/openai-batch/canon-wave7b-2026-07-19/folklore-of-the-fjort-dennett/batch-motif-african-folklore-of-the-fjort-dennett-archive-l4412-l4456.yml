canonical_text:
  quote: ''
  summary: A slayer explains that the killed leopard was dangerous and had taken sheep
    and fowls. The king approves, requires the leopard's whiskers to be counted as
    three times nine with a cloth penalty for any missing hairs, and orders the whiskers,
    teeth, claws, and skin prepared for him. The hunter presents these parts to the
    king. The king then rewards him with a young girl as slave or concubine, clothing,
    a small boy to cut wood, a man to carry his gun, and a grand feast.
  language: English
  quote_policy: summarized
