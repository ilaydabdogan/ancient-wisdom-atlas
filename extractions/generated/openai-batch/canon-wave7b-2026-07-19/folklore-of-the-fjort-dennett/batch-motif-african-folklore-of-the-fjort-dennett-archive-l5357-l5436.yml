  text: After the coffin work and settlement of palavers, the family is called together
    and the prince of the land and strangers are invited to hear the settlement.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A square in front of the shimbec containing the coffin is cleared and swept;
