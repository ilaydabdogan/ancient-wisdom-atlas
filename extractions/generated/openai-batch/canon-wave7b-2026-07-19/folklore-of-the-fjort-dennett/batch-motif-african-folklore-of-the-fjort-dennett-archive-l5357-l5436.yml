  text: Guns are fired as a signal that preparations are ready, after which the family
    sit to receive guests and the guests take assigned seats.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The elder addresses two family fetishes held by two family members, recounting
    the death and the family’s settlement of the matter, and praying for protection
