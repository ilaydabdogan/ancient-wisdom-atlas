canonical_text:
  quote: ''
  summary: 'The passage describes Fjort funeral procedures after coffin preparation:
    payments and invitations, clearing and seating around the shimbec, night dancing,
    assembly of family, prince, and guests, speeches to family fetishes, repeated
    application of earth to the fetish figures, release of widows to remarry, a conditional
    bark-test for a witch/Ndotchi, burial the next day, KaCongo grave-car practices,
    and a remembered former custom of burying slaves and wives with a prince.'
  language: English
  quote_policy: summarized
literal_observations:
