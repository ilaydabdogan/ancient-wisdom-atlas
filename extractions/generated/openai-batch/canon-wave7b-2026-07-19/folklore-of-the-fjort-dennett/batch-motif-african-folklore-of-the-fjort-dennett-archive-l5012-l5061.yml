  summary: In the tale of the leopard and the crocodile, both animals demand a dog
    from a man though neither has seen a dog nor met the other. The man, wishing to
    keep his dogs and rid himself of the troublesome animals, sends each to the same
    place, where each mistakes the other for a dog. They fight and kill each other,
    after which the man and his people feast and celebrate.
