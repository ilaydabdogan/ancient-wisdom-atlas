canonical_text:
  quote: ''
  summary: The passage recounts a missionary's death, a king's request for another
    missionary, the king's later killing by a rebellious kinsman assisted by apostate
    Catholics, the usurper's sudden death, and later unsuccessful attempts to revive
    the mission. It also reports Merolla's statement that Angoy/Cabinda had no Christian
    prince known to him and was inhabited by people described as given to sorcery
    and magic.
