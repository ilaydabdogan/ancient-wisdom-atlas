canonical_text:
  quote: ''
  summary: In the tale of the antelope and the leopard, the leopard stakes his life
    on a hiding contest. The antelope finds him, but the leopard cannot find the antelope.
    The leopard gathers nonje nuts; when his slaves crack them, a beautiful dog jumps
    from the first nut. The dog is beaten by three of the leopard’s wives and killed
    by the fourth, then changes into a beautiful damsel. The leopard wants to marry
    her; she requires him to kill the four wives and remove his claws and eyes, and
    he obeys.
  language: English
