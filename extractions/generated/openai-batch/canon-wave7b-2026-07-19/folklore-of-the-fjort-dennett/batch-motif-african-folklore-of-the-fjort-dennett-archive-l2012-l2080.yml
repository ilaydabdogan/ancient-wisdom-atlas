  quote: ''
  summary: The passage concludes a tale in which a father keeps antelope meat, kills
    his hungry son, and has the son's body distributed as meat to neighboring princes.
    The father is then killed by Chimbindi in the woods; his wife and tribe discover
    the body, and Chimbindi annihilates the tribe. The passage then begins another
    tale in which a small boy is left with a neighbor who refuses him food for six
    days, leading him to resolve to seek his parents.
