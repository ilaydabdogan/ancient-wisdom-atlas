canonical_text:
  quote: ''
  summary: Mavungu pulls leaves from a fuba-tree; the leaves become a beautiful woman
    and other people. The first woman says she has come to be his wife, transforms
    his body and clothing through her fetish, and creates a house and town for him.
    She warns him not to reveal the source of his good fortune. His family repeatedly
    questions him, his mother offers poisoned food, and on a later visit he begins
    to tell the origin story while his brother removes his clothing.
  language: English
  quote_policy: summarized
