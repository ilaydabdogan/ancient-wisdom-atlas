canonical_text:
  quote: ''
  summary: 'The excerpt closes one tale: the Fool sings about denied food and a fatal
    bone or indigestion; the father dies; neighbours question the Fool, hear his explanation
    that he was denied food while others ate, and judge in his favour. The narrator
    closes the story with audience response. A second storytelling example begins
    with a call-and-response formula. In that tale, a man neglects his pregnant wife
    for another woman and gives his fish and game to the lover; the starved wife bears
    a weak son. The grown son complains that his father has never given him food or
    cloth, receives a knife from a friend, goes to the woods and hills, sets a trap,
    and finds a guinea-fowl.'
  language: English
  quote_policy: summarized
