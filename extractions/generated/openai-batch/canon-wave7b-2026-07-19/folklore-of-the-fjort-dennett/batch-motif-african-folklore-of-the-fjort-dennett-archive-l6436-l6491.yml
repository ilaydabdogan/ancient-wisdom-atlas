canonical_text:
  quote: '"no question is considered finally settled until it has been properly and
    judicially talked out"'
  summary: The passage describes Fjort palavers as reasoned dispute proceedings. Minor
    quarrels may be marked by a cut piece of cloth or a broken stick and then referred
    to a prince for decision. More serious bloodshed or inter-tribal disputes require
    formal public hearing, payment of fines, and closure. The hearing is held with
    princes seated near a shade tree, parties and followers arranged in a hollow square,
    and professional pleaders using arguments, proverbs, comparisons, truisms, and
    songs.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The narrator states that reason and logic in palavers play a significant part
    in Fjort life.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A discussion between two people can lead to a quarrel; each party tells a
    friend, and the friends may join the discussion without settling it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A bet or pledge may be made by cutting off a corner of one party's cloth with
    a knife, or by breaking a stick into two parts that are kept until the palaver
    is settled.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dispute is referred to a prince, in whose presence it is talked out; the
    prince decides the matter and is paid for the trouble.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Serious questions include shedding blood and inter-tribal dispute; recourse
    to arms does not make such a question finally settled unless it is judicially
    talked out.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A weaker party that is not annihilated may later bring the palaver up again;
    after settlement and payment of the fine, the question is closed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Princes sit near the trunk of a wide-spreading shade tree, while the audience,
    plaintiff, defendant, and followers are arranged so as to form a hollow square.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: In important palavers involving wealthy parties, pleaders called Nzonzi, described
    as those who know how to speak, may be employed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The plaintiff and defendant each state their cases, and the hearing of facts
    may take days because the palaver is traced back to its origin.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Nzonzi argue the case by headings and use comparisons, proverbs, truisms,
    and songs in their speeches.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A footnote says that this practice is common to all West African tribes known
    to the note writer and is not confined to the Fjort.
  category: other
  evidence_refs:
  - ev:6
