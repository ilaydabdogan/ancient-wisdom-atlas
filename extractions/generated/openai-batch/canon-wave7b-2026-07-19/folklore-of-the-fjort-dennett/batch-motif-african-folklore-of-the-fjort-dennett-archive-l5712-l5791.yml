canonical_text:
  quote: ''
  summary: 'The passage recalls a submerged settlement whose remains remind travelers
    that Nzambi wanted the sick cared for. It then presents Nzambi as a judge: while
    settling a palaver, she repeatedly hears her great drum beaten in her town. After
    pig and antelope scouts fail to find the cause, the group hides and catches a
    crab coming from the water to beat the drum. Nzambi rebukes the crab and decrees
    that he will be headless and eaten by people. A second crab story says Nzambi
    withheld the crab''s promised head because of his pride, explaining why crabs
    lift their eyes out of their bodies. The passage closes by stating that Nzambi
    Mpungu made the world and people, and that the bird Nchonzo nkila first made a
    drum so that followers could dance; Nzambi then wants the drum for her people.'
  language: English
  quote_policy: summarized
