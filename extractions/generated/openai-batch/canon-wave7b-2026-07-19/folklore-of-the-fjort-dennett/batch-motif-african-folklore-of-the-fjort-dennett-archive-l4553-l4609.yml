canonical_text:
  quote: ''
  summary: In one tale, Nenpetro the wild cat and Nsessi the gazelle make a famine
    agreement allowing each to eat the other's mother. Nsessi eats Nenpetro's mother
    but hides his own mother in a cave. Nenpetro's son reveals the hiding place; Nenpetro
    imitates Nsessi's voice, lures the mother out, kills and cooks her, and invites
    Nsessi to a feast. Nsessi discovers the killing, refuses the invitation, and leaves
    town with his people after burning their houses. The passage then begins another
    tale in which a woman hides after placing chicoanga under a market-tree; another
    woman with pig eats a piece after calling for the owner, and a dispute begins.
  language: English
  quote_policy: summarized
