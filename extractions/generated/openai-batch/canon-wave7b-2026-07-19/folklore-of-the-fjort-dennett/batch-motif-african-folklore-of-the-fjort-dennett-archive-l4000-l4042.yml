canonical_text:
  quote: ''
  summary: A hunter follows a gorilla that damaged his plantations, hides near the
    gorilla's camp, and watches a chimpanzee with a club take fruit from a heap below
    the tree. The chimpanzee claims the fruit as his own and attacks the gorilla;
    the gorilla remains quiet at first, then kills the chimpanzee with one blow. The
    hunter flees.
