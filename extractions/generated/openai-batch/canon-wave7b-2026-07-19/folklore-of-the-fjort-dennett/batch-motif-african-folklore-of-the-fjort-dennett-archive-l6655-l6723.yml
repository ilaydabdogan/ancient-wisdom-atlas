canonical_text:
  quote: ''
  summary: The passage is an ethnographic discussion of Fjort Nkissi/fetish practice,
    types of Nganga, the terms Kazila/Chegilla and xina/Bina, forbidden acts and foods,
    consequences of breaking a xina, an etiological note about a family pigeon taboo
    tied to an ancestor in a cave, and a summarized tale in which knowledge of having
    eaten a forbidden thing leads to death and legal responsibility for the host.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes four divisions or departments within a form of fetish-related
    religion, with different agents handling different classes of affairs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king is said to deal with one class of affairs, while a private individual
    attends to a home-fetish.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nganga bilongo is distinguished from Nganga Nkissi; the former is compared
    to an apothecary, while the latter is identified as the class more properly called
    a medicine-man by European writers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nganga is glossed as meaning a repeater, one who repeats secrets of native
    religion, family affairs, or medicine, with each Nganga taking a department rather
    than all departments.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: Kazila is discussed as possibly meaning no road and as comparable to Merolla's
    Chegilla, with an additional possible derivation from Portuguese gira.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that xina/Bina is the native term for forbidden things.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: Examples of xina include stealing, murder, sleeping with a woman on bare earth,
    and eating certain food-stuffs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Breaking a xina is not always punished by death; eating a forbidden food may
    result in spots and blotches.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: One family avoids eating pigeons because a pigeon scratched and let light
    into a cave where one of the family's ancestors had been imprisoned.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: In the summarized Merolla tale, the young person remains well while ignorant
    of the taboo violation, but after being told the truth his fear and imagination
    kill him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The commentator says native law would treat the host as the cause of the young
    person's death, and that the story should end with the young person's relations
    killing the host with public approval.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Once a person knows he has eaten his xina, even by accident, he would seek
    the Nganga of the fetish for that crime to have the matter corrected, or else
    suffer sickness or death.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage states that giving someone his xina to eat, followed by that person's
    death within a suitable period, would be felt as murder by the giver.
  category: relationship
  evidence_refs:
  - ev:5
