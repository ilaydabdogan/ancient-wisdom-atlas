canonical_text:
  quote: ''
  summary: Nenpetro has two wives, Kengi and Gunga, for whom he divides farmland.
    After Gunga takes beans from Kengi's plot, the women agree that anything born
    on one woman's farm belongs only to that woman. Later, while Kengi is on Gunga's
    plantation asking for tobacco, Kengi gives birth. Gunga claims the child under
    the agreement, refuses Kengi's demand for its return, and the women decide to
    take the dispute to Manilombi.
  language: English
  quote_policy: summarized
