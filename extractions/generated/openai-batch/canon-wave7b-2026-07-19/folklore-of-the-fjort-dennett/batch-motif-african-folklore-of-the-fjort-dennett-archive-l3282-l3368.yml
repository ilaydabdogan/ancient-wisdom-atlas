canonical_text:
  quote: ''
  summary: In the opening portion of “Ngomba’s Balloon,” Ngomba, a maiden covered
    with sores, is excluded and beaten by three companions when they go fishing. She
    goes alone to a large lake, catches fish for her mother while singing laments,
    and is confronted by a Mpunia, glossed as a murderer. Under threat, she asks the
    Mpunia to cure her in exchange for service. He takes her to his home in the woods,
    cures her, places her in the paint-house, marries her, and makes her mistress
    over his prisoners and goods.
  language: English
  quote_policy: summarized
