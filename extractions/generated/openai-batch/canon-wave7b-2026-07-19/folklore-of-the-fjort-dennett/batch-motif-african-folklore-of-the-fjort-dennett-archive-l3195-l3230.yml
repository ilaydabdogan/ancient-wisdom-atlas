canonical_text:
  quote: ''
  summary: 'The passage contains the close of an ''Another Vanishing Wife'' tale,
    in which Mavungu returns to find his town and wife gone and is judged foolish
    by the people. It then begins ''The Jealous Wife'': a husband leaves his two wives
    and their children for a six-month trading journey, asks the wives to care for
    the children, and the wives later alternate fishing and childcare. The elder wife
    becomes jealous of the younger wife''s more intelligent child and prepares a razor
    with intent to murder the child while its mother is away.'
