canonical_text:
  quote: ''
  summary: The passage first closes a dispute in which unnamed adjudicators decide
    that a woman who owned chicoanga was at fault because she hid in the bush to set
    a trap involving the owner of a pig. It then begins a tale about Basa, the narrator's
    great-uncle's twin brother, a skilled fisherman who secretly stores fish, denies
    catching any, and lets fish rot in his house. The fetish Sunga watches and is
    grieved by his lying, then sends a little servant or childlike messenger to summon
    him. While Basa is fishing and storing an abundant catch in baskets placed in
    a tree, he hears three handclaps and a voice telling him to come to the speaker's
    mother. Afraid, he asks the way, and the voice tells him to follow as it leads
    him to the river.
  language: English
