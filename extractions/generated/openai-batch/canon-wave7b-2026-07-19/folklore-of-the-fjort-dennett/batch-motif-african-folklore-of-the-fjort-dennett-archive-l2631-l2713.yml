canonical_text:
  quote: ''
  summary: A son brings food to his neglected mother, is named Zinga because they
    can now live without the father's help, and later hunts successfully. The father,
    who had neglected wife and child while supporting a concubine, becomes hungry
    after the concubine is sent away and begs for food. The mother refuses him because
    of his earlier neglect; the son pities him and tries to send food, warning that
    God may kill them if they refuse. Before receiving the food, the father dies of
    starvation. An inquiry judges that the wife and child were right to deny him food
    and that he died by the avenging hand of the Great Spirit.
  language: English
  quote_policy: summarized
