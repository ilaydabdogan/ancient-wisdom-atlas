candidate_motifs:
- id: motif:1
  label: ritual greeting of the new moon
  taxonomy_refs: []
  basis: The passage describes a fixed cry and gesture used to greet the new moon.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: Only a brief practice note is given; no story or stated meaning is supplied.
- id: motif:2
  label: personified thunder and lightning as deadly pursuers
  taxonomy_refs: []
  basis: Nzassi and Lusiemo are spoken of as persons, and Nzassi is said to chase
    and kill a person who runs during thunder in the woods.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives an explanatory belief rather than a full narrative episode
    for the woods scenario.
- id: motif:3
  label: storm being sends animal agents
  taxonomy_refs: []
  basis: Antonio's account says Nzassi sent twenty-four dogs during a thunderstorm,
    and the dogs seized one person.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The episode is reported as Antonio's story within the ethnographic note.
- id: motif:4
  label: heavenly fire quest rewarded by marriage
  taxonomy_refs:
  - ascent
  - sacred_exchange
  - sacred_marriage
  - mystical_quest
  basis: Competitors for Nzambi's daughter must ascend or pass to Nzambi above and
    bring down a little of Nzambi Mpungu's fire from heaven.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage summarizes the story and points to a fuller version elsewhere;
    details of the outcome are not included here.
- id: motif:5
  label: animal-made passage between earth and heaven
  taxonomy_refs:
  - ascent
  basis: A spider makes a silken cord from heaven to earth, and a woodpecker bores
    a hole through the sky for the competitors.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives only the mechanism of passage, not the entire journey.
- id: motif:6
  label: edge-of-heaven cloud cosmology
  taxonomy_refs: []
  basis: Clouds are said to rise from where the walls of heaven touch the earth and
    move across or around the sky.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: This is a cosmological description rather than an enacted narrative.
- id: motif:7
  label: bird omen of family or personal misfortune
  taxonomy_refs: []
  basis: The ntieti bird resting in the stern of a fisherman's canoe is read as a
    sign that misfortune has come to his family or will come to him.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No cause of the omen is given.
- id: motif:8
  label: theft from sea spirit brings dangerous waters
  taxonomy_refs:
  - sacred_theft
  basis: When Chicamassi's shore-collected articles are stolen, she becomes vexed
    and causes a sea swell that stops fishing and can kill people in the surf.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The text says the articles are stolen from a sea spirit, but it does not
    explicitly call the act sacred theft.
- id: motif:9
  label: offerings to a sea spirit at marked places
  taxonomy_refs: []
  basis: People passing places associated with Chicamassi throw food into the sea
    for her and splutter rum into the sea before drinking.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage explicitly says sacrifices are not made to the sea, so this
    should be treated as an offering practice rather than sacrifice unless further
    evidence is supplied.
- id: motif:10
  label: sea spirit takes one child from multiple births
  taxonomy_refs:
  - sacred_twins
  basis: When Chicamassi is vexed, she is said to take one of twins or triplets and
