canonical_text:
  quote: ''
  summary: The passage records Fjort notes on the new moon, thunder and lightning
    as personified powers, a reported story of Nzassi's dogs, a sky-ascent story involving
    Nzambi, heavenly fire, a woodpecker, and a spider cord, as well as cloud cosmology,
    calendrical divisions, sea names and fishing practices, omens, waterspouts, and
    the sea spirit Chicamassi-chibuinji.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The new moon is greeted with a high cry while the greeter beats his mouth
    with his hand.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lightning is said to be made by Funzi, a blacksmith who lives in the centre
    of KaCongo.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nzassi means thunder and Lusiemo means lightning; both are spoken of as persons,
    and Nzassi is often used for both thunder and lightning.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: If rain and thunder come while someone is in the woods and the person tries
    to run away, Nzassi is said to run after and kill the person.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Antonio reported that, during rain and violent thunder while people sheltered
    and played marbles, Nzassi sent twenty-four dogs down upon them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Antonio's story, the dogs seized one member of the party who had left the
    shed, and fire burned up a living palm tree.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In certain stories the sky can be bored through; suitors climb a spider-made
    silken cord from heaven to earth and creep through a woodpecker-bored hole to
    seek Nzambi Mpungu's fire from heaven.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nzambi on earth promises her beautiful daughter in marriage to whoever goes
    to Nzambi above and brings down a little of Nzambi Mpungu's fire.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Clouds, called Ituti or Matuti, are said to rise where the walls of heaven
    touch the earth and then sail across or around the sky.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The year is divided into a rainy season and dry season, and the month into
    seven four-day weeks, with no work on Nsona.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: The sea is called Mbu; the sun is said to rise in the Mayomba bush-country
    and set in the Mbu.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: Before going to sea, fishermen knock their fetishes for good luck or to kill
    those who spoil their luck.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: If a fisherman wakes to find the small black ntieti bird resting in the stern
    of his canoe, he understands that misfortune has come upon his family or will
    come upon himself.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Chicamassi-chibuinji is identified as the spirit dwelling in the sea; she
    sometimes comes ashore to collect red-wood and other toilet articles.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: When someone steals Chicamassi-chibuinji's articles, she becomes vexed and
    causes a calemma or swell that stops fishing and can cause loss of life in the
    surf.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Waterspouts are called Nvussuko and Ngo-lo and are feared as one would fear
    a ghost.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:17
  text: The passage says sacrifices are not made to the sea, but when Chicamassi is
    vexed she comes ashore, takes one of twins or triplets, and drowns it in the sea.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:18
  text: Saving a relation from drowning is described as good; saving a stranger's
    life makes the rescued stranger one's slave or requires the stranger to give a
    slave in exchange.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:19
  text: When passing places where Chicamassi is supposed to have passed, a person
    throws bits of fish, mandioca, or similar items into the sea for her and also
    splutters rum into the sea before drinking it.
  category: action
  evidence_refs:
  - ev:12
