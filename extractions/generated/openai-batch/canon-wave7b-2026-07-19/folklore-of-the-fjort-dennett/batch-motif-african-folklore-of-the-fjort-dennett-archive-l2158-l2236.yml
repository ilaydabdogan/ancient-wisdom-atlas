canonical_text:
  quote: ''
  summary: The passage comments on poison accusations and ordeal practices, describes
    apotropaic village-road charms and a town guardian Nkissi, briefly reports a sparse
    creation statement involving Nzambi Mpungu and Nzambi, and summarizes tales in
    which a river-spirit teaches food plants and fire before the arrival of the blacksmith
    Mfuzi and the metal age.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author says accusations called witchcraft are closely connected with poison,
    fear of death, and disbelief in death from natural causes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A so-called Ndotchi or poisoner is forced to undergo an ordeal using powdered
    casca bark and water; vomiting is treated as innocence, purging as guilt followed
    by death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person waking from a fearful dream may feel spellbound, fire a gun to frighten
    evil spirits, accuse others of attempted poisoning, and administer casca to them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Certain Ngangas are said to profess miracle-working.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Women are described as giving husbands medicines intended to make them love
    them, and as testing love by placing heated iron on their arms.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A grass knot called nteuo with medicines enclosed may be placed by a road
    into a village to prevent someone bent on evil from passing.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: A string of feathers and charms may be stretched as an arch across a road
    to keep away evil winds and spirits.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Every town is said to have some Nkissi to guard it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: An earthenware pot called nduda, half full of sand and containing two eggs,
    is said to explode if anyone bent on evil enters the town.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that Nzambi Mpungu made the earth or gave birth to Nzambi,
    and that she brought forth many children.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Some tales begin in a time before ancestors knew fire and ate grass like animals;
    a river-spirit shows mandioca and banana and teaches fire, after which Mfuzi the
    blacksmith and the iron and copper age appear.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: A footnote distinguishes an ordinary grass knot from the medicinal nteuo,
    saying such a knot may mark a plantation place or a hidden object nearby.
  category: other
  evidence_refs:
  - ev:9
