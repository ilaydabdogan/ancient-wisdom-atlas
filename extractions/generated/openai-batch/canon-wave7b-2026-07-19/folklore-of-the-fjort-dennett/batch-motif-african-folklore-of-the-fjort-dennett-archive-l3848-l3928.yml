  quote: THE  YOUNGER  BROTHER  WHO  KNEW  MORE THAN  THE  ELDER.
  summary: The passage opens with two quarrelling brothers. The younger brother, claiming
    superior knowledge, leaves town with his wife, crosses through a wood and by a
    clear river, enters an isolated settlement, is accepted by another man who has
    also left his town, and joins him in building a covered pit trap with an agreement
    to divide captured animals by sex.
