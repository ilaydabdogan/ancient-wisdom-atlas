canonical_text:
  quote: '"they term Gangas"'
  summary: The introduction reviews early European accounts of Congo, noting that
    they provide little information about pre-Portuguese traditional history. It describes
    Congo as a prosperous kingdom with a temporal king and vassal lords, says the
    missionaries did not study the native religion in detail, identifies that religion
    as Nkissism and the missionaries' Gangas as Nganga Nkissi, and recounts hostile
    descriptions of north-bank Congo peoples and islanders, including an episode in
    which two Capuchin fathers were expelled to an uninhabited island in the River
    Zaire.
  language: English
