  summary: The introductory passage discusses a major disruption in the kingdom of
    Congo, the possible forgetting of the severance of two northern-bank provinces
    from the main kingdom south of the Great River, and the difficulty of river travel.
    It then argues that the tradition of the two sons of Fumu Kongo is historical,
    citing the distribution of the fetish form called Nkissism in KaCongo and Loango.
    The narrator also reports field observations among Fjort tribes and among tribes
    north and north-east of the Fjorts, noting both the absence of Nkiss and Nganga
    there and the presence of deities described as very similar to some Fjort Nkiss.
