canonical_text:
  quote: ''
  summary: The passage introduces Mr. Dennett's Fjort stories as sent to the Folk-Lore
    Society and shaped by his knowledge of the Fjort language. It describes African
    native literature as consisting of proverbs, stories, riddles, and songs; notes
    previous collections by Burton and Ellis; comments on songs as difficult because
    of under-meaning in the words; and emphasizes proverbs and stories as important
    evidence for native-to-native speech about beliefs. It then roughly divides stories
    into legal, historical, and play stories, gives examples from the collection,
    and begins a comparison of historical stories among the Fjort and West African
    tribes generally.
  language: English
  quote_policy: summarized
