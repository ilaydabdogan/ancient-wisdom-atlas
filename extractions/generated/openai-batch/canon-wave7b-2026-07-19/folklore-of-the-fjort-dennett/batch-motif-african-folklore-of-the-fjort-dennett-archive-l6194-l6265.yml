canonical_text:
  quote: ''
  summary: The passage describes Nkissi as a spirit, power, or mystery contained in
    medicines and natural substances. It explains Nkissinsi as a sacred spot guarded
    by the father of the tribe, marked by a stunted baobab, sacred stone, or wooden
    image. The father functions as priest, healer, teacher, and ruler by descent from
    Nzambi. As society expands, priestly and ruling functions separate, and Zinganga
    Nkissi develop ritual images, offerings, nail-driving petitions, healing amulets,
    rainmaking claims, exorcistic practices, and coercive authority. The month Muauda
    is said to be sacred to Nkissinsi.
  language: English
  quote_policy: summarized
