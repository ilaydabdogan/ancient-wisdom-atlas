  summary: The passage records Fjort explanations and beliefs about tides, undersea
    towns and abductions, forest beings, plant-based Nkissi powers, fetish-making
    with Mlimbe wood and blood, charms, animal names and royal leopard symbolism,
    shapeshifting into predatory animals, and kazila animal taboos.
