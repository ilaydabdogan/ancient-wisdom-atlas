literal_observations:
- id: obs:1
  text: Nzambi Mpungu is said to cause high tide by dropping a large stone into the
    ocean and low tide by taking it out again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Zimini is said to have towns under the sand in the sea and sometimes to seize
    a man or woman and take that person down to his place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some stories say the white man has a town under the sea and takes captured
    and purchased slaves there to help make cloth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Woods and forests are described as the homes of the Mpunia, Ndotchi, and Chimbindi.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Nkissi in herbs, plants, and trees is described as able to poison or cure
    people and as growing with the plant out of the earth.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Fetishes are made from Mlimbe wood; when the tree is felled, its blood is
    said to be mixed with the blood of a cock killed by the Nganga.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that the cock used in the Mlimbe fetish-making rite used
    to be a slave when slaves were cheaper.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Grasses are worn as charms around the neck or body of a sick man.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Many people are called after animals, and names such as leopard, lobster,
    lion, elephant, and wild dog are given to those of royal blood.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Ngo, the leopard, is described as the greatest of the royal animal names,
    and only princes can wear a leopard's skin.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The leopard is described as the royal animal and as the figure of royal motherhood
    and the earth, while Nkala, the crab, is described as the figure of the sea.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Kongo is described as the Fjort's Adam, the first great king or Nfumu, and
    the father of KaCongo, Loango, and Ngoio.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Leopard skin is worn as a sign of royalty, leopard hair is used as a charm
    against smallpox, and leopard skins were sent from Loango to Ngoio so that Mbunzi
    might bring rain to water plantations.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: The Fjort are said to believe that some people can or must change themselves
    into beasts of prey, including leopards and crocodiles.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:15
  text: Recent stories are said to tell of relations who suffered this transformation
    and later admitted killing and tearing people to pieces.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: Kazilas are described as forbidden things, including family prohibitions against
    eating or touching certain animals.
  category: other
  evidence_refs:
  - ev:12
- id: obs:17
  text: The passage says that none except witches would attempt to eat snakes, crocodiles,
    lizards, and chameleons.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:18
  text: Many families avoid certain animals because their ancestors owe those animals
