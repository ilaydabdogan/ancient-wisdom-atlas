canonical_text:
  quote: ''
  summary: A historical introduction recounts Capuchin missionaries being taken by
    fishermen to Bombangoij, hosted there, attempting to escape, hiding in a tree,
    being found after their host imagines a spirit or devil may have taken them, and
    then being sent onward in hammocks to Capinda. The author then uses the anecdote
    in a discussion of Loango, KaCongo, and Congo political relations and compares
    this tree-climbing episode with other missionary accounts of climbing trees against
    animals.
  language: English
  quote_policy: summarized
