canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale in which the father of three brothers
    finds signs of his children, returns for his wife, and the brothers are prevented
    by a river-spirit from killing an old woman who is revealed to be their mother.
    It then shifts to an ethnographic account of Fjort death and burial practices:
    mourning, washing and wrapping the body, use of fire and leaves to preserve it
    from flies, delayed burial while disputes are settled, and divination by a Nganga
    to determine the cause of death.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man identified as the father of the three brothers approaches a village,
    hears voices, returns home, and tells his wife he has found her children.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman sets out with her husband to seek her children and eventually
    rests by the wayside from exhaustion.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A child of one of the three brothers finds the old woman, becomes afraid,
    and reports to his father.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The three brothers intend to kill the intruder, but a river-spirit tells them
    not to kill her and to feed her because she is their mother.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The brothers obey the river-spirit and take the old woman home and feed her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The death of a Fjort family father is described as producing a deserted village
    appearance, intense mourning by wives and sisters, crying children, and silent
    men wearing blue head-bands.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the first grief, the body is shaved and washed; palm-wine or rum may
    be used instead of water if the family is wealthy enough.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The body is laid on rush mats, covered, later wrapped in cloth, and placed
    on a rack or framework bed with a hole dug underneath to receive fluids from the
    corpse.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A fire is lit at both the head and foot of the rack, and Acaju leaves are
    placed on the body each day so the smoke keeps flies away.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Burial may be delayed until palavers are settled; important persons may remain
    unburied for a long time, while a slave is quickly buried.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The family appoints a day to divine the cause of death and sends cloth to
    a distant well-known Nganga.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Nganga describes circumstances of the deceased's life, sickness, and death,
    and then divines a cause such as a nail driven into a fetish, bewitchment, or
    the person's time having come.
  category: speech
  evidence_refs:
  - ev:11
