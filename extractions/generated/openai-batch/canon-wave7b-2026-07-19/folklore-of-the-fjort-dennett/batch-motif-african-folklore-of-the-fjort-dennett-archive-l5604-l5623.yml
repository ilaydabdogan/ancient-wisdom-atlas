canonical_text:
  quote: ''
  summary: The passage reports difficulty obtaining a direct definition of Nzambi
    Mpungu or Nzambi. It records one account in which Nzambi Mpungu made the world,
    sent Nzambi there, came down, married his creation, and became father of all.
    It also summarizes a Bible-influenced creation version involving God, a man and
    woman, a white house, a garden, a forbidden tree of shame, rats emerging from
    the house, disobedience, and shame. The passage concludes that a faint notion
    remains of Nzambi Mpungu as a humanized spirit ruling rains, lightning, and rainbows.
  language: English
