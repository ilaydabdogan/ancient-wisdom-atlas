canonical_text:
  quote: ''
  summary: The passage describes Fjort religious terms, sacred earth, family fetishes,
    ritual specialists, offerings, initiation of circumcised young men, healing and
    purification rites, and the Nkissi as an earth-associated spirit or power present
    in medicines, fetishes, mountains, rocks, and a feared waterside rock. It also
    includes a preceding female figure who judges disputes and rewards or punishes
    conduct involving her child.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed female figure punishes those who refuse her drink or food by drowning
    them, rewards those who give her child drink, receives disputes from animals and
    people as judge, and has a name used as an ejaculation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nkissi nsi is described as a mysterious spirit dwelling in the earth, while
    Nkissi is described as mysterious power in herbs, medicines, and fetishes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage reports that a missionary is called Nganga Nzambi and discusses
    Nzambi, Nzambi Mpungu, Mpungu, Mpounga, gorilla, creator, and father as religious
    or linguistic terms.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: On sacred earth in each village or family, a small hut or shimbec may be built
    to keep the family fetish, and a tree may be planted with medicine-filled holes
    covered by looking glass, clay, and white and red earth or chalk moistened in
    the prince's mouth.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the sacred ground, the prince summons his family to a 'washing-up' in which
    offerings, generally white fowls, are made, the grass is cut, the ground is cleaned,
    and people dance and sing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: At the same sacred ground, the prince admits circumcised young men to the
    rights of manhood, teaches them secret tribal pass-words, is crowned, and consults
    the fetish when in trouble.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Nganga Nkissi keeps an image in a hut apart from his holy ground; suppliants
    drive nails, spear-points, knives, and similar objects into it to seek help from
    the mysterious spirit for killing enemies or protection from evil.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Nganga Nkissi sells charms, including small wooden images charged with
    medicines, bracelets, armlets, head-bands, waistbands, bits of tiger skin against
    smallpox, kids' horns, and necklace pendants.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Nganga bilongo is identified as doctor and surgeon; cures are kept as
    family secrets, and after sickness or misfortune people undergo thanksgiving and
    purification according to Bingo rites.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Nkissi is described as the spirit, as it were, of mother earth, encountered
    in mountains and rocks; a rock by a creek behind Ponta da Lenha is feared because
    people say Nkissi will swallow passers.
  category: setting
  evidence_refs:
  - ev:10
