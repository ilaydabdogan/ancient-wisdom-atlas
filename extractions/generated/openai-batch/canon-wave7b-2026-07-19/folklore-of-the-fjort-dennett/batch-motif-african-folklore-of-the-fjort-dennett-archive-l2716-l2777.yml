canonical_text:
  quote: ''
  summary: A tale is introduced as concerning a practical joker. Two lifelong friends
    farm beside one another, separated only by a path. A wicked wit makes a coat that
    is red on one side and blue on the other, passes the friends to attract their
    attention, and causes them to argue over the coat’s color. The argument becomes
    a fight until women separate them. The friends later realize the joke, feel sorry,
    and order the wit not to come that way again; the women curse the wit.
