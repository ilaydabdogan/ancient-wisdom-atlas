canonical_text:
  quote: ''
  summary: The passage describes Ombuiri or Imbuiri as Mpongwe-recognized nature spirits
    or deities comparable in powers to some Fjort Nkiss, such as Mountain Mungo, but
    distinct from regular Nkiss. Ombuiri inhabit particular places, receive token
    homage from passers-by, lack a priesthood in Mpongwe usage, and may sometimes
    cause harm through falling trees or swollen rivers. The passage contrasts Mpongwe
    practice with KaCongo, Loango, and Ivili contexts, where Imbuiri are described
    as being under human priests and used in petty theft-related affairs.
  language: English
  quote_policy: summarized
