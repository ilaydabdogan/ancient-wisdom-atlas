canonical_text:
  quote: ''
  summary: 'The passage describes a Fjort prince or chief''s burial song and associated
    ceremony: a sundown vigil around an initially empty coffin, coffin-beating and
    sung calls by the chief mourner, repeated songs by assembled mourners, the corpse
    being placed in the coffin at cockcrow, a water rite performed by the dead prince''s
    wife with a gourd and basket, and later chant lines naming old princes.'
  language: English with Fjort song lines and Latin/English glosses
  quote_policy: summarized
