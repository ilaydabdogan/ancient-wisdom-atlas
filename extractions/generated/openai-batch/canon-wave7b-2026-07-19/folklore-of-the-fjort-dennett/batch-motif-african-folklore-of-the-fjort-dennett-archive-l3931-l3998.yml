canonical_text:
  quote: ''
  summary: A younger brother withholds meat caught under an agreement with the owner
    of a town and sends his wife into the woods for sticks to smoke the meat. She
    does not return and is later found in the trap. The town owner claims her under
    the agreement. The elder brother arrives, advises in a way that causes the town
    owner to enter the trap, and then tells the younger brother that the man is now
    his by the same agreement. The owner gives up the wife, and the brothers and wife
    return to town.
  language: English
