canonical_text:
  quote: '"There were two brothers, the Smart Man and the Fool."'
  summary: A framed description of village storytelling introduces an embedded tale.
    In the tale, two brothers, Smart Man and Fool, go shooting for fish to feed their
    parents. Fool repeatedly kills fish, but Smart Man claims the catches and eats
    them with the father while Fool receives none. After the second meal, a fish bone
    sticks in the father's throat; Smart Man tells Fool to fetch a doctor, but Fool
    refuses and sings about the repeated injustice.
  language: English
  quote_policy: quoted
