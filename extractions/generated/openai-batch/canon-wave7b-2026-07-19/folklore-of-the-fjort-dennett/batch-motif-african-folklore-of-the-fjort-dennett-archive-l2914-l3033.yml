canonical_text:
  quote: ''
  summary: 'The passage concludes part of a tale in which Nsassi''s dog repeatedly
    learns the names of Nenpetro''s daughters so Nsassi can claim them in marriage;
    drinking clear water causes forgetting, abstaining on the final journey allows
    success, and Nsassi defeats an antelope challenger. The passage then begins ''The
    Vanishing Wife'': Buite, despised by his brother Swarmi, leaves town for a palm-filled
    valley, dreams of a beautiful girl who instructs him at a river, follows the dream
    the next morning, summons a canoe and paddles by tapping three times, fishes as
    instructed, and returns to find his hovel replaced by a furnished house with the
    girl and nine servants.'
  language: English
  quote_policy: summarized
