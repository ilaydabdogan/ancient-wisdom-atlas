canonical_text:
  quote: '"This is the work of God."'
  summary: A man with two wives leaves for Loango to buy salt. During his absence
    Kengi becomes pregnant, and Gunga questions how the child can be his. The newborn
    carries a handful of hair and speaks, attributing the event to God, which frightens
    the people. The child later grows up, hunts elephants, kills one, and its meat
    is divided among the people, who call him good.
