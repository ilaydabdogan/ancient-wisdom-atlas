canonical_text:
  quote: ''
  summary: In this excerpt from “Ngomba’s Balloon,” Ngomba plans to escape from Mpunia
    by having her people prepare a large mateva-palm ntenda, or basket, that can float
    in the air. Mpunia suspects her and attempts to kill her with drugged palm-wine
    and a heated iron, but Ngomba’s little sister, transformed into a cricket, sings
    and distracts him into dancing. After daylight and after Mpunia leaves, Ngomba
    loads her people and Mpunia’s ornaments into the floating ntenda and travels over
    the treetops toward her mother’s town.
  language: English
  quote_policy: summarized
