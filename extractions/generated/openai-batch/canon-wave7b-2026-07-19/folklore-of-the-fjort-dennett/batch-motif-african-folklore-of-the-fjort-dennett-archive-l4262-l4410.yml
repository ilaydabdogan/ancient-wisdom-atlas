  text: The wild ox came because of the singing and helped remove and carry the antelope,
    fetch water, and clean plates.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The turtle sent the ox to collect leaves and, while the ox was away, carried
    all the meat into his strong house.
