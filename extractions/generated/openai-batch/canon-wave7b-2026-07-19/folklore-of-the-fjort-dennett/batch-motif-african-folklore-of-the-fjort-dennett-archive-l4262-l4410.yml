  text: The turtle refused the ox’s share; when the ox tried to destroy the trap,
    the reset trap caught and killed him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The turtle again called people to dance and sing, attracting the leopard.
  category: sequence
  evidence_refs:
