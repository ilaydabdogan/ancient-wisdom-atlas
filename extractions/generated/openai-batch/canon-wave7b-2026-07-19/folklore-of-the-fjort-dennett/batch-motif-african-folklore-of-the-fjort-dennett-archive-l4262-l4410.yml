canonical_text:
  quote: ''
  summary: 'A turtle and a man, hungry because they have not planted food, make a
    trap. The turtle gains the better trap, catches an antelope, and uses an ox and
    then a leopard as helpers while denying them shares of meat. The ox is caught
    and killed in the reset trap, but the leopard destroys the trap, pretends to be
    caught, and kills the turtle when he approaches. The man accepts the leopard’s
    explanation. The passage then begins a separate note on a custom after killing
    a leopard: towns may loot one another, the slayer may appropriate certain objects,
    the slayer is tied up, the leopard head is wrapped, and both are brought to the
    king.'
  language: English
  quote_policy: summarized
