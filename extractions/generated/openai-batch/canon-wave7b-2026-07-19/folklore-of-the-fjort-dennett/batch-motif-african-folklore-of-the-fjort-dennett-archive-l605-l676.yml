  quote: ''
  summary: An introductory ethnographic discussion argues that African languages and
    native statements require study of figurative thought, then describes traders
    as valuable observers of native customs because they seek to understand local
    culture and preserve peace for trade. The passage also summarizes West African
    middleman trade systems and political dangers when chiefs obstruct trade.
  language: English
