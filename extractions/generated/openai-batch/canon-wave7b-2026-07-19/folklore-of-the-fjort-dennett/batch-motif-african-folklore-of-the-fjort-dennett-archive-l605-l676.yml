literal_observations:
- id: obs:1
  text: The speaker states that African languages contain and are founded on a distinctive
    basis of figurative thought, which must be understood before judging native statements
    on totemism and other subjects.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The trader is identified as another resident white person who lives in close
    contact with the native.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker says there are few modern trader-written reference works on native
    customs, while earlier writers such as Bosman, Sieur Brue, and Barbot are praised
    for exactness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker regrets the loss or silence of traders and collectors who could
    have supplied knowledge about native customs, and says Mr. Dennett is unusually
    willing to respond to misstatements about Africans.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The trader's information is described as valuable because the trader aims
    to understand native culture as it stands rather than alter it into a European
    culture.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says the trader seeks peace with natives and between native groups
    because peace is tied to the prosperity of West African regions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says West Coast trade passes through middlemen tribes and denies
    that any West Coast tribe directly in contact with the coast-trader subsists by
    war or slave-raiding.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The middlemen system is described as strongest from the Niger to the Benito
    and as weakened or upset elsewhere by Mohammedan influence, Bafan movement, French
    exploration, and Portuguese action.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The trader's greatest danger is described as occurring in Niger districts
    when a chief stops trade through his district because of a quarrel.
  category: sequence
  evidence_refs:
  - ev:7
