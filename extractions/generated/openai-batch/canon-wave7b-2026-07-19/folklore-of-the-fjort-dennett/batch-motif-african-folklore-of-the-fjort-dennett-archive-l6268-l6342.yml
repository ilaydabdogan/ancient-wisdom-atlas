canonical_text:
  quote: ''
  summary: The passage describes Fjort ritual timing, taboos, purification practices,
    and Musurongo Nkissi. It notes dancing and singing during an initial period, covering
    fetishes on the fifteenth day until the new moon, named days for assemblies and
    discussion of the dead, a four-day week with a fourth day sacred to production
    and motherhood, forbidden Xina items and animals, sickness or death as a consequence
    of knowingly eating from unclean pots, purification by anointing with palm oil
    and takula, and several nail-driven Musurongo wooden images associated with disease,
    rain, retaliation against theft, confession, nail withdrawal, and cure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For the first fifteen days the people dance and sing; on the fifteenth day
    all Nkissi are covered, and images may not be touched until the new moon appears
    again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The day on which the prince calls people together to discuss a subject is
    called Nduka.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Palavers concerning dead people are discussed on the day called Ntono.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The Fjort week is described as four days: Tono, Silu, Nkandu, and Nsona.'
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: On Nsona, the fourth day, women will not work in the fields; the day is described
    as sacred to production and motherhood.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Things called Xina are forbidden; examples include swine, sea things without
    fins and scales, specified birds, bats, and snakes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: No prince will touch Xina swine.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A person may eat from unclean pots if unaware of the uncleanness, but knowingly
