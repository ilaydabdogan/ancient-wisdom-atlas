  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Principal Musurongo Nkissi are wooden images into which nails are driven.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Kabata is said to kill victims by sleeping sickness; Nsimbi causes dropsy;
    Quansi causes ceaseless itching; Nvemba gives or withholds rain.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: When a Nkissist is robbed, he goes to the Nganga of Kabata with an offering
