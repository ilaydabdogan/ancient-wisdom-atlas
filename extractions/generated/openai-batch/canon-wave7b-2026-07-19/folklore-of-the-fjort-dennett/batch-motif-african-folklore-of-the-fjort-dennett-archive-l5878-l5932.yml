canonical_text:
  quote: ''
  summary: Nchonzo nkila brings a complaint before Nenlau that Nzambi took a drum
    he made. Nzambi explains that her people needed the drum to dance and that earlier
    messengers sent to request it were killed before the ant brought it to her. She
    claims a right to it because she brought forth all living beings. Nenlau and his
    old men deliberate, then judge that although Nzambi is mother of all, the drum
    belongs to Nchonzo because he made it and humans make their own drums. Nzambi
    pays compensation, is fined, and both parties give presents to Nenlau. The narrator
    states that Nzambi is here judged by human laws despite being regarded as mother
    of all things and full of power.
  language: English
  quote_policy: summarized
