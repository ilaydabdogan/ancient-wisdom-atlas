  summary: A hunter hears a wife's song and reports her terrible condition. The prince
    summons the people with a bell and orders the wife brought to town, where she
    dies on arrival. The husband is tied up and accused; the wife’s body is placed
    on a grill to be smoked and dried, while the husband is put beneath in the fire
    and burned.
