literal_observations:
- id: obs:1
  text: When a prince dies, other princes either come or send people dressed in feathers
    with drums and bugles to cry.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mourning visitors receive drink, dance, sing, and return to their towns.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Nganga Nkissi is set to find who caused the prince's death, and many people
    are forced to take casca, after which many deaths follow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The prince's body is smoked and watched by his wives while his wealth is displayed
    in the front part of the shimbec.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The coffin is a large red-cloth-covered case decorated with white braid and
    brass-headed nails in diamond-shaped designs.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The dried body, wrapped in cloth, is placed in the coffin; stuffed tigers,
    an umbrella, and ornaments are placed on top, and the funeral car is drawn to
    the burial ground by assembled guests who sing and dance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: At the grave, the coffin is lowered; one or two wives formerly jumped in,
    or two small boys are placed beside the coffin north of Loango, and all are buried.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After the burial, the relations proclaim the new prince and place a wreath
    of grass over his shoulder.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A year or two later, a festival in honour of the departed is held with a straw
    effigy of the late prince seated behind a table bearing belongings not placed
    over the grave.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The rest of the late prince's wives, who did not wash from his death until
    burial, now have charcoal marks on their faces.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Some children of the late prince take turns beating a drum and singing near
    the shimbec.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Visitors bring offerings and congratulate the new prince on what the narrator
    calls his coronation; he receives them, perhaps under a great tree.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The relics of the late prince are visited, followed by several days of dancing,
    singing, eating, and drinking.
  category: sequence
  evidence_refs:
  - ev:13
