canonical_text:
  quote: ''
  summary: The introductory passage describes Fjort stories as teaching social duties
    and a severe ideal of justice, and says such stories are cited in trials like
    legal precedents, often through animal tales. It then discusses play-stories as
    sources for customs, and introduces Nkissism as a religious form in KaCongo and
    Loango, connected by the narrator to Fumu Kongo’s sons, wise men of Nzambi, Nkiss
    objects, and Ngangas, with comments on its geographical distribution and possible
    origin.
  language: English
  quote_policy: summarized
