canonical_text:
  quote: ''
  summary: 'The passage ends one vanishing-wife tale: Buite repeatedly tries to prevent
    his wife from seeing fish heads, but the youngest boy, Parrot, shows her a whole
    fish, after which the wife, house, servants, and furnishings disappear. The next
    tale begins with two brothers, favored Luemba and maltreated Mavungu; Mavungu
    flees by canoe and encounters a huge fuba-tree whose leaves seem connected to
    a womanlike voice complaining of pain.'
  language: English
  quote_policy: summarized
