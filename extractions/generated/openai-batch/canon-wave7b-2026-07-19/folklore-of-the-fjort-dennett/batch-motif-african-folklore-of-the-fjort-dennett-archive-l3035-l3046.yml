  summary: Buite goes fishing daily, and his wife sends one of the little ones or
    one of her boys to help carry the fish. Passersby are astonished by Buite's generous
    treatment and wonder where his wife and riches came from. Buite's brother Swarmi
    disbelieves his prosperity and decides to visit. Buite becomes tired of always
    cutting off the fishes' heads, and one day he does not cut them off.
