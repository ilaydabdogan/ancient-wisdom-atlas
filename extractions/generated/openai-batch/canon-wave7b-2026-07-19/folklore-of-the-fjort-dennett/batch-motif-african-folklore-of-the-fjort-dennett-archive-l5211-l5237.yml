canonical_text:
  quote: ''
  summary: In an early time before planting, a woman gives birth to three children
    at once and abandons them in the grass. Hungry, they travel far, cross a river,
    and are invited by a river-spirit to eat bananas and other foods. They grow strong,
    learn carpentry and blacksmithing, build houses, receive wives from the river-spirit,
    multiply, and create a town. A wandering man approaches their settlement and is
    astonished.
  language: English
