canonical_text:
  quote: ''
  summary: The passage is introductory ethnographic commentary. It mentions life-long
    dedication of things to an individual attendant guardian spirit, describes Roman
    Catholic influence among the Fjort as fading, compares that influence to a forest
    path that becomes overgrown, says foreign beliefs are assimilated into a fetish
    form and become like fossils, lists food crops attributed to missionary introduction,
    and characterizes the Fjort as having organized society, thought-out religion,
    and notable art before European contact.
  language: English
  quote_policy: summarized
