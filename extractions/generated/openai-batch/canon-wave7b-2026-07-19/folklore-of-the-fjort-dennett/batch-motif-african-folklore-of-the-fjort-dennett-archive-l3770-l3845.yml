canonical_text:
  quote: ''
  summary: Luemba follows his absent brother Mavungu, reaches Nzambi's town, is mistaken
    for Mavungu, and resists sleeping with Mavungu's wife through the aid of a charm.
    After seeing in a closed mirror the town whence no man returns, he travels there,
    kills the old woman who asks him to fetch fire, revives Mavungu, Mavungu's horse,
    and many dead people from their bones with charms, and returns with them. The
    brothers quarrel over the revived followers; Mavungu kills Luemba, Luemba's horse
    revives him with his charm, and Luemba kills Mavungu. The town judges Luemba to
    have acted rightly.
  language: English
  quote_policy: summarized
