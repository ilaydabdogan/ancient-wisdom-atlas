canonical_text:
  quote: ''
  summary: Nzambi Mpungu hears that someone overseas is making speaking people or
    speaking images, becomes angry, summons animals and birds, and appoints the cock
    as ambassador. The cock travels at night; when only a few villagers honor the
    ambassador, Nzambi Mpungu angrily turns the villagers into monkeys. The next tale
    begins with a hen feeding daily at the river, threatened by a crocodile. The hen
    calls the crocodile brother, which repeatedly stops him from eating her. Troubled
    by the claimed kinship across land and water habitats, the crocodile decides to
    consult Nzambi and meets Mbambi, a large lizard friend.
  language: English
  quote_policy: summarized
