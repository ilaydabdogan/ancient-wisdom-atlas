canonical_text:
  quote: ''
  summary: A Fjort song and explanation concerning hunger in Loango provinces. Famine
    leads people to clear forest and drag trees to make farms. Muanyali has a basket,
    mat, and cooked food, but the food is insufficient. His wife Lembe asks her father,
    Mr. Pelican, to explain the shortage to Muanyali; Pelican reports famine in other
    provinces and mentions the pain caused by a hungered mother.
  language: English with Fjort/Kongo song text and English glosses
  quote_policy: summarized
