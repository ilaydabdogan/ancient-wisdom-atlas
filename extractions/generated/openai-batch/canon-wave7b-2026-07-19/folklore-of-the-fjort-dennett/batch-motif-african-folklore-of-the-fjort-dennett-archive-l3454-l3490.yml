canonical_text:
  quote: ''
  summary: A huge ntenda or balloon flies to Ngomba's town and settles near the house
    of Ngomba's mother. Ngomba emerges and is welcomed by her relations as long-lost.
    The Mpunia claims Ngomba as his wife, and her relations acknowledge the claim
    and thank him for curing her. While appearing to prepare seats, they make a covered
    pit with fire and boiling water; when the Mpunia sits, he falls in and is killed
    with boiling water and fire.
  language: English
  quote_policy: summarized
