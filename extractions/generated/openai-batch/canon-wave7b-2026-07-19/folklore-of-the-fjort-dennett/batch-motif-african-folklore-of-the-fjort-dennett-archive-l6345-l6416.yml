canonical_text:
  quote: ''
  summary: During deficient rain, a prince collects cloth and goods from the people
    for presentation to Nganga Nvemba; the group goes to a sacred grove, offers, sings,
    dances, claps, and shouts for rain. Failure to obtain rain is attributed to wrongdoing
    against Nvemba, and a victim may be made to appease Nvemba by loss of life, a
    slave's life, or payment. If a culprit will not confess, Nganga Nkissi may use
    ordeals of poison, fire, and water; the passage also describes belief that a Great
    Hidden Power exposes guilt, the role of fear in ordeals, possible bribery and
    manipulation, and divination leading to accusation. The author compares the ordeal
    privilege to early Christian fire-and-water ordeal associated with St. Wilfrid's
    church.
  language: English
  quote_policy: summarized
