canonical_text:
  quote: One of his wives had run away with a gentleman from a neighbouring village.
  summary: In an introductory anecdote, an armed man fires on a canoe party. The narrator
    pursues and catches him, and the crew learns that the man is reacting to a wife’s
    departure with a man from another village. According to the described local custom,
    killing or attacking a canoe-crew member from a third village would oblige that
    village’s men to join him in attacking the village of the man who took his wife.
    The narrator uses the episode to argue that local customs can be misunderstood
    by rapid outside observers.
  language: English
