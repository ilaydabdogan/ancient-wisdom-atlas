canonical_text:
  quote: He plants mandioca in the ground where the deceased's bed rested
  summary: 'The passage gives several Fjort song lines with animal images, then describes
    the difficulty of collecting a burial song for a Fjort prince and summarizes associated
    funerary customs: treatment of the deceased person''s house, planting mandioca
    where the bed stood, corpse vigil in the shimbec, avoidance of the dwelling after
    burial, fear of the deceased''s ghost, deserted settlements after small-pox deaths,
    and housing practices shaped by fear of witchcraft accusations.'
  language: English with Fjort song lines and English glosses
  quote_policy: quoted
