canonical_text:
  quote: Now am I indeed dead, and become a bird.
  summary: In the closing passage of “The Wonderful Child,” the father returns. Kengi
    fears disclosure of the child's paternity and asks Grunga/Gunga not to tell. The
    boy approaches the father, the father initially denies knowing him, the people
    identify the boy as his son by Kengi, and the boy sings that he is dead and has
    become a bird. The father then embraces the son, gives him a wife, and makes him
    chief over many towns.
