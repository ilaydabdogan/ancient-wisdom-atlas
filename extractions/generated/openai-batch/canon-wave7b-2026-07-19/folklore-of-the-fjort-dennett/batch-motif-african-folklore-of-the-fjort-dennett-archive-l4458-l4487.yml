  quote: ''
  summary: The gazelle proposes clearing bush in the dry season so women can plant
    when rains come. The leopard delays at first while the gazelle works alone, but
    afterward the gazelle repeatedly avoids work by claiming sickness or absence,
    leaving the leopard with nearly all the hard labor. After planting and ripening
    of the harvest, the gazelle visits the plantation, is pleased by the amount planted,
    and considers inviting friends.
