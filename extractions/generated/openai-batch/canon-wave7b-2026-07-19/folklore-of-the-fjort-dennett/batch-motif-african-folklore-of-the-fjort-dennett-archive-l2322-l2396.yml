canonical_text:
  quote: ''
  summary: The passage describes Fjort social customs concerning marriage payments,
    paid sexual access, polygyny, bride-taking from a paint-house, punishments for
    royal adultery, sanctions for royal women crossing between KaCongo and Loango,
    debt and loan practices leading to dependency or household slavery, and funerary
    treatment of children, poor persons, and rich persons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that a custom of being buried alive with husbands was dying
    out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man without enough money to marry may promise part of his earnings to a
    girl, give a small donation to her parents, and live with her until he can marry
    her.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says virgins may be used by a man for payment, then put aside
    and later be available to others who pay; this is said not to obstruct later marriage.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A man may marry as many wives as his wealth allows, and the passage says wives
    make plantations and may quarrel for his favors.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: When a bridegroom takes his bride from the paint-house, he is generally expected
    to give an all-night dance around his house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Unfaithfulness in a princess was punished by burial in the ground up to the
    neck and abandonment to starvation and death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The male adulterer in the described punishment was impaled and left to rot.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: If a KaCongo princess who was one of KaCongo's wives crossed the River Loango
    Luz, Maloango could break her ivory bracelet and declare her a whore.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The same crossing law is said to apply to wives of Loango who crossed into
    KaCongo.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage presents debt as common, including debts to Nganga Nkissi for
    charms, to Nganga bilongo for medicine, and debts for goods borrowed for burials.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: A wealthy lender may lend a hoe to a woman for a child's burial; if the hoe
    is buried with the body, he may require payment and take one of her daughters
    if she cannot pay.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: If the lender places the girl in the paint-house before repayment, she becomes
    his “daughter of the cloth,” described as a household slave.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage says men wanting money accepted loans from wealthy men and became
    their dependants.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage generalizes debt as a major motive force and says traders lent
    goods to native princes and traders, then used native law to obtain promised produce.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: When a child dies, the body is marked around the eyes and body with white
    and red chalk and may be buried the next day.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: A slave or poor man is buried quickly without particular ceremony, while a
    rich dead person is dried over a smoky fire.
  category: action
  evidence_refs:
  - ev:11
