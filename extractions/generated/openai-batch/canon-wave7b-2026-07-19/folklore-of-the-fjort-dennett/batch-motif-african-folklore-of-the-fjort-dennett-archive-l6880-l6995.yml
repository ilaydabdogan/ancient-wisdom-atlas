canonical_text:
  quote: ''
  summary: The passage gives performance instructions for a symbol-touching call-and-response
    song, followed by twenty-nine numbered Fjort song lines with English glosses.
    The lines mention plant origins, corpse wrapping, palavers and hidden speech,
    courtship and pregnancy, illness and a birth-fetish, a river-crossing exchange
    with Buyali, the sun and new moon, blacksmithing, drumming, family respect and
    captivity, memory fruit, pipes, medicinal trees and grasses, road stumps, and
    a buffalo fight.
  language: Fjort/Kongo terms with English translation and editorial notes
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A boy holds one end of a string while the singer holds the other; as the singer
    sings, his fingers touch the symbols, and the other boy and onlookers repeat each
    sentence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The song says shoots of the silk-cotton tree and peanuts came from Sundi;
    notes identify Sundi as grass country beyond the Mayomba district and mention
    fishermen using silk-cotton bark for nets and floats.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: One line addresses a mother and says that ngombi dance the nquanga; another
    line instructs a drummer to place and beat a drum.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The song instructs that a corpse be tied up in native grass-cloth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'Several lines refer to palavers and words: refusing to hear a word, Truth
    and Falsehood being present at palavers, openly telling a palaver hidden in the
    heart, thinking heavily about a palaver, and a laugher hearing good words.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Two young ladies smear themselves with red paint and visit their lovers; Buketi
    goes to town while pregnant and is wished a good birth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Nganga Nsassi is sick; a touched birth-fetish has lost its virtue; for a sick
    child, the little drum is fetched.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A man asks Buyali to bring a canoe so he can cross the river; Buyali answers
    that he is pushing his canoe with bamboo and that his child is at the bottom of
    the river.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The sun is described as always marching and meeting the new moon on the beach.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The blacksmith beats iron to make a hoe until his hot hammer falls; a friend
    offers cloth to hold the hammer and continue beating the iron.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage mentions an old man leaving corn on the cob for his son, a speaker
    whose family no longer respects him, imprisoned Father Makuika with a yoke on
    his neck, and an old pipe left by a relation that must not be thrown away.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Malandu fruit is linked to remembering a palaver and to speaking what is hidden
    in the heart.
  category: object
  evidence_refs:
  - ev:12
- id: obs:13
  text: The song tells someone to put tobacco in a pipe and liamba in a calabash,
    and to hold a glass before oneself when combing hair.
  category: object
  evidence_refs:
  - ev:13
- id: obs:14
  text: The muamba yellow-tree is called a medicine-tree; xizika grass is called the
    old man or wisehead of the road; stumps on the road damage toes.
  category: object
  evidence_refs:
  - ev:14
  - ev:15
- id: obs:15
  text: The buffalo fights until its head falls off.
  category: action
  evidence_refs:
  - ev:16
