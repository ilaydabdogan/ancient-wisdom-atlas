canonical_text:
  quote: ''
  summary: A gazelle-led group of animals eats from a leopard's plantation. The leopard
    sets a trap, catches and eats an antelope, and the gazelle then gathers the animals
    by drum for revenge. The animals kill the leopard at the dance; the gazelle sends
    the leopard's wife her husband's skinned head, which she eats unknowingly before
    cursing the gazelle.
  language: English
  quote_policy: summarized
