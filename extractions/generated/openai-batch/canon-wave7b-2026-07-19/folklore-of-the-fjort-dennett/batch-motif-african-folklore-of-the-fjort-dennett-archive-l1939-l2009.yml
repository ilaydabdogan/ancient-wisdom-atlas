candidate_motifs:
- id: motif:1
  label: punitive plague sent by supernatural power
  taxonomy_refs:
  - divine_judgment
  basis: The passage frames scourges as punishments and reports that Mbunzi sent a
    locust plague after the offense involving Maniprato's beard.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The Hebrew comparison is the narrator's framing; the local account names
    Mbunzi rather than the Hebrew God.
- id: motif:2
  label: offense to a royal or sacral figure triggers communal affliction
  taxonomy_refs:
  - divine_judgment
  basis: The cutting of Maniprato's beard is followed by the Fetish's appeal to Mbunzi
    and the sending of locusts that destroy plantations.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage does not fully explain the status of the beard or Maniprato
    beyond his acting for the King of Loango.
- id: motif:3
  label: appeasement of an angry power through presents
  taxonomy_refs:
  - sacred_exchange
  basis: The Fjort are said to lack princes to send presents to Ngoio to calm angry
    Mbunzi.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage gives only a brief statement and does not detail the ritual
    or exchange procedure.
- id: motif:4
  label: hostile dead dwelling in the woods
  taxonomy_refs: []
  basis: Bimbindi are spirits of the good dead who live in the woods and are generally
    considered enemies of mankind.
  evidence_refs:
  - ev:5
  - ev:10
  confidence: medium
  cautions: This is an ethnographic description rather than a fully narrated episode.
- id: motif:5
  label: woman rises from death and is treated as a departed spirit after return
  taxonomy_refs:
  - resurrection
  - death_rebirth
  - return
  basis: The woman is reported to have died and been buried, risen from the dead,
    eventually returned to her parents, and been treated by them as their daughter's
    departed spirit.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The narrator offers an alternate explanation involving unconscious burial
    and sale by a native doctor; the woman's own belief is reported as rejecting that
    explanation.
- id: motif:6
  label: deceptive transport interrupts homeward return
  taxonomy_refs:
  - return
  basis: The woman hires a canoe to return home, but the owners take her to the south
    bank of the Congo and sell her.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The deception is embedded in a reported life history rather than a complete
    folktale episode.
- id: motif:7
  label: night hunter-provider feeds kin with trapped antelope
  taxonomy_refs: []
  basis: The chief sets traps in the woods, kills an antelope at night, brings it
    home, and has it divided among the inhabitants of his town.
  evidence_refs:
  - ev:11
  confidence: low
  cautions: The narrative is incomplete at the end of the supplied passage.
- id: motif:8
  label: human speech to domestic animals as if understood
  taxonomy_refs: []
  basis: The herd talks to sheep and goats as if they understand him.
  evidence_refs:
  - ev:1
  confidence: low
  cautions: The passage presents this as a brief observation, not as a developed mythic
    or folktale episode.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares the interpretation of African scourges as
    punishment with the Hebrew account of plagues sent by God to punish oppressors.
  claim_level: same_function
  target: Hebrew punitive plague tradition
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is made by the authorial narrator and does not by itself
    demonstrate historical contact or common inheritance.
