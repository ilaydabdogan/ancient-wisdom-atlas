canonical_text:
  quote: ''
  summary: 'The passage gives ethnographic and narrative notes: a herder addresses
    animals as understanding him; locusts are interpreted as a punishment connected
    with an offense against Maniprato and the anger of Mbunzi; Bimbindi are described
    as feared spirits of the dead, followed by the account of a woman treated as a
    returned spirit after death, enslavement, betrayal, and return; and an unfinished
    tale begins about a chief hunting antelope to feed his kin.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A native herd in a white trader's employ talks to sheep and goats as though
    they understand him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator states that Hebrew plagues are said to have been sent by God
    as punishment, and that great scourges in this part of Africa are also viewed
    as punishments.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Locusts called Makonko are eating plantations in Loango in unusual abundance
    during 1896-97, and the Fjort say former princes could have sent them away quickly.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A French official cut the long beard of Maniprato, who was acting in place
    of the King of Loango.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Fetish, described as nephew of Mbunzi, was annoyed by the beard-cutting,
    sent word to Mbunzi, and Mbunzi sent a locust plague that ate the French mission's
    banana plantation in one night.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The locusts are also eating the Fjort's plantations and palm trees, while
    the Fjort no longer have princes to send presents to Ngoio to calm Mbunzi.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bimbindi are described as spirits of good people who have died; they live
    in the woods and are generally considered enemies of mankind.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A woman described as a Chimbindi was in love and about to marry, then fell
    sick, died, and was buried; her lover was accused of bewitching her, took casca,
    and died.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After rising from the dead, the woman found herself enslaved and married to
    a white man in Boma, and later was freed when he went to Europe.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The woman hired a canoe to return home, but the canoe owners took her to the
    south bank of the Congo and sold her; after nearly three years, relatives found
    her and brought her back to her parents.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The woman's parents rejoiced at seeing her again but did not believe she was
    human, and continued treating her as the departed spirit of their daughter.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The narrator suggested that a Nganga Nkissi may have buried the woman while
    unconscious and sold her in Boma, but she did not believe this explanation.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: A chief with a large town of children and relations struggled at times to
    provide animal food for them and set traps in the woods.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The chief killed a trapped antelope at night, brought it home, had it divided
    among the inhabitants, saved his own share, and then found another antelope before
    the first cock crowed.
  category: sequence
  evidence_refs:
  - ev:11
