canonical_text:
  quote: ''
  summary: Auta, mocked as a Wearer-of-Rags, is allowed by the king to treat the ill
    king's daughter. He prescribes the liver of the White Leper, which the councillors
    obtain by killing the White Leper. Auta mixes the liver with water in a new pot
    and gives it to the girl; a snake leaves her and she recovers. The king rewards
    Auta and offers half the city, but Auta declines to live there. On the way home,
    Auta meets the snake and agrees to bring it meat every Sunday at an ant-hill.
  language: English
  quote_policy: summarized
