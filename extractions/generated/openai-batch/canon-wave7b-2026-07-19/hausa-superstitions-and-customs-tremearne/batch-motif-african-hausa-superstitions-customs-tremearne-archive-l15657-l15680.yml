canonical_text:
  quote: ''
  summary: A variant of “The Lazy Boy” describes a boy born into a family who speaks
    at birth, forbids naming and head-shaving, later privately reveals his name, prospers,
    and then vanishes into the earth after his mother tells the name to a friend.
    His wives and horse-holders also disappear, and his father kills the mother and
    her friend before dying. A following caption describes a long guitar with an iron
    rattle.
  language: English
  quote_policy: summarized
