canonical_text:
  quote: A lie can give more pain than a spear.
  summary: 'In the first tale, Jackal and Hyaena dispute whether a lie or a spear
    causes more harm. Jackal gives honey-cakes to Lion and falsely says they are Hyaena''s
    sweet tears. Lion demands such tears from Hyaena, finds them bitter, and squeezes
    her until she is nearly killed. Hyaena then accepts Jackal''s saying. A note reports
    a variant in which Goat deceives Lion by falsely describing Hyaena''s products.
    The excerpt then begins another tale: a blind man and a female leper have a hundred
    children who cannot walk; when an enemy force attacks their city, the parents
    try to flee and hide the children, but the passage cuts off as hostile horsemen
    spot them.'
  language: English
  quote_policy: quoted
