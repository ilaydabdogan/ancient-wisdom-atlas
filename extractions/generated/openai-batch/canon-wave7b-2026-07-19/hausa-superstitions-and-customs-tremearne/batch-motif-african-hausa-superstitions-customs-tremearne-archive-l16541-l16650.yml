canonical_text:
  quote: ''
  summary: A Hausa folktale passage describes Spider's debt for the Old Woman's bull
    being shifted through a cumulative chain of beings and incidents until a Blacksmith
    pays with ten basins and ten plates, which are passed back through the chain to
    the Old Woman. The narrator explains this as an example of Spider's cunning. A
    variant and editorial comparisons to cumulative nursery tales and a Malayan chain
    tale are also given.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A recited chain links the Boy, Bird, White-Ant, Slipperiness, Daughter, Crab,
    He-Goat, Spider, the Old Woman's Bull, and the payment of ten large basins and
    ten large plates, ending with the payment placed upon the Mother.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mother agrees when the payment is placed upon her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: After a Blacksmith burns one of the Mother's cloths, the Mother recites the
    chain again with the Blacksmith at the beginning and places the payment upon him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Blacksmith agrees; blacksmiths make ten basins and ten plates, and the
    items are passed through the named chain until Spider gives them to the Old Woman.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The narrator states that Spider ate the bull's flesh, made others provide
    the payment, and gave nothing in return for what he had obtained.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: A variant says Spider's debt passes from a shea-butter tree to a Girl, a root,
    a Goat, a Slave, the King's Wife, and the King; in that version the King pays
    the debt.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The editor notes resemblance to 'The House that Jack built' and other nursery
    tales, suggests a possible 'All-around-the-Clock' form, and cites a Malayan chain
    tale involving Chevrotain, Otter's children, King-Solomon, Woodpecker, Great Lizard,
    Tortoise, and King-Crab.
  category: other
  evidence_refs:
  - ev:7
