  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says the Donkey-Maiden tale does not indicate that she is anxious
    to escape again.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: In another tale, a husband throws into a river the dog-skin that his wife
    has been inhabiting, and only then does she appear publicly as a woman.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A footnote says the woman had killed a dog and entered its skin to escape
