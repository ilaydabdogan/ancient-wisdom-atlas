- id: obs:4
  text: Story 82 is described as a reversed form of the Blue Beard curiosity incident
    and as strongly resembling an Annamite saga.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Several Hausa tales are said to recall stories from The Arabian Nights, including
    analogues to Aladdin, the Old Man of the Sea, Ali Baba, and a vanishing city story.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A chief of Zanfara named Umoru is said to go incognito among his people at
    night to learn their opinion of him and to kill those with unfavorable opinions
