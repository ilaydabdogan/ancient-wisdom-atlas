canonical_text:
  quote: ''
  summary: An authorial comparison section lists similarities between Hausa tales
    and European, Arabian Nights, Annamite, and Welsh narrative patterns. It mentions
    golden-egg birds, half-bodied figures, invisible hands, self-serving food, Blue
    Beard-like curiosity, incognito rulers, animal-maiden wives whose skins are seized
    or discarded, a dog-skin disguise used to escape an evil spirit, a dove who grants
    wives and a city under a taboo, and name-guessing in courtship.
  language: English
  quote_policy: summarized
