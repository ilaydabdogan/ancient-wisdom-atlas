canonical_text:
  quote: ''
  summary: 'Editorial notes explain details from Hausa tales: a girl standing in a
    low-water well could reach people above; a rope and bucket were absent until Dodo
    brought them; water-carrying is described as women’s work; Dodo used a bell to
    know where his son was; a bell may have had to be stuffed rather than removed;
    and Dodo’s gifts may have been destroyed because of their weight or possible sympathetic
    influence.'
