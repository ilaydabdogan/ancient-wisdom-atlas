canonical_text:
  quote: ''
  summary: A mother carries her daughter's bones toward a city where men are mended.
    On the road, self-preparing Food, Meat, and Fura speak to her, offer to be eaten,
    and then give right-hand road directions after she refuses. In the city she presents
    the bones and is told her daughter will be mended. She tends cattle, feeding them
    ripe Adduwa fruit while eating green fruit herself; the biggest bull praises her
    good heart, and the daughter is restored. A rival wife then decides to imitate
    the process, kills her own daughter in a mortar, carries the bones, and begins
    the same road, but eats the first self-cooking food.
  language: English
  quote_policy: summarized
