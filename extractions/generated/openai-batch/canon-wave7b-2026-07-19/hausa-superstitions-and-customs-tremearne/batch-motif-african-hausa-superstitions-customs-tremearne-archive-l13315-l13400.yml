  quote: ''
  summary: The passage gives the end of a tale in which a boy marries a woman known
    to be Dodo's Wife. On a journey through the forest she transforms into a Dodo
    and attacks him, while he escapes by successive transformations. His parents warn
    him not to reveal family secrets to a wife. An editorial note says material is
    missing and compares the tale to other variants, including a Sierra Leone tale
    of an elephant-wife and hunter. The excerpt then begins a separate tale in which
    a farmer tricks his wives with loin-cloths said to contain childbirth charms.
  language: English
