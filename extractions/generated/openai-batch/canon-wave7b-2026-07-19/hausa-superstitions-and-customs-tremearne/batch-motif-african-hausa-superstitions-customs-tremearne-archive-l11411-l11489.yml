canonical_text:
  quote: ''
  summary: In the tale segment, the Younger Son demands the King's small ring as ransom
    rather than slaves. The King gives him a swift horse and warns him to flee, and
    the people pursue him until he reaches his own city. The horse dies, and the Younger
    Son withdraws to the forest. While he sleeps with the ring on his finger, a large
    walled city appears. Later a Bad Woman persuades him to lend her the ring, gives
    it to her paramour, and the city moves to the paramour, leaving the Younger Son
    with only his mother, elder brother, dog, and cat. The dog and cat begin to respond
    to his distress.
  language: English
  quote_policy: summarized
