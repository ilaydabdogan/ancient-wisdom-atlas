  summary: Explanatory notes to tale LXXIX identify a chief or first wife with authority
    over other wives, describe starving people reacting angrily to a sheep being fed
    scarce good food, note horses and saddles as currency, describe attendants running
    beside a chief's horse, and state that the ewe's wonderful powers were known only
    to Auta, perhaps the first wife, and possibly the second wife because of the ewe's
    warning.
