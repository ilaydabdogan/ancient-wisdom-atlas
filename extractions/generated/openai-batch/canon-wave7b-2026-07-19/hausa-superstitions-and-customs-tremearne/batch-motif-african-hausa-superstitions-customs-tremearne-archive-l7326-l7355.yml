canonical_text:
  quote: ''
  summary: The passage describes Bori dancing as said to originate in the Hausa States
    before Islam. It presents Bori first as a treatment for insanity or hysterical
    tendencies, later as a form of dancing in which actions simulated kinds of madness.
    It defines Mai-bori as an actor, dancer, or possessed person, notes that mad persons
    are treated as set apart by gods and called tabu when 'touched,' and describes
    later uses by the Kama class and with children thought to be possessed by evil
    spirits requiring exorcism.
  language: English
  quote_policy: summarized
