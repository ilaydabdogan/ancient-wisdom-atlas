canonical_text:
  quote: ''
  summary: A king, faced with a city’s fall, chooses to fulfill a pledge made in God’s
    name by saving the children of a blind man and a leper instead of his own children.
    His palace is looted and his own children are captured. Later he returns the saved
    children, is left without property, marries one of the grown maidens, and gains
    wealth because she produces cowries from her body each morning and evening. The
    passage then begins a separate tale about a hunter who usually brings back animals
    from the forest but one day returns empty-handed.
  language: English
  quote_policy: summarized
