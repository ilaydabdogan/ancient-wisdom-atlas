canonical_text:
  quote: ''
  summary: Hyaena secretly eats all the skins during the night and offers excuses,
    first blaming a mouse and then proposing to report a thief. Spider says the king
    will know Hyaena is responsible. The People report theft, but the King says he
    knows Hyaena ate the skins. The King gives Spider a bull because of Spider's present
    and gives Hyaena an old he-goat. Spider and Hyaena thank him and travel away;
    Hyaena drags the goat and begins speaking of eating one of its legs.
