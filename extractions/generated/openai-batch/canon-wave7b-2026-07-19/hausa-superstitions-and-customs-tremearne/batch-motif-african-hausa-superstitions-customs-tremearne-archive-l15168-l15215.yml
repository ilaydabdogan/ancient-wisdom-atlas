canonical_text:
  quote: ''
  summary: The Son seeks help when his Father comes to make war on him. He is directed
    through several royal daughters until the Daughter of the King of Agaddez pronounces
    the annihilation of the Pagan allies, while the Son exempts his Father and the
    Son of the Minister. The Pagans fall dead; the Son brings his Father and Friend
    into the city and gives them clothing. At the council-chamber, the People state
    that a man who hates someone should be killed, and the Son beheads his Father.
    The turban rises into the air, becomes a White-Breasted Crow, and calls. A note
    adds a similar story involving a Malam, ground-nuts, a Girl, a sleep-inducing
    Cat, substitution of a darra-stone, and the Youth's escape.
  language: English
  quote_policy: summarized
