canonical_text:
  quote: ''
  summary: A boy raised with his mother and her rival wife receives a horse, riding
    robes, and an arranged marriage from the Kishia. A king sends him to recover a
    spear from an enemy city. With the help of a king's daughter in that city and
    a river-king's daughter at a full river, he returns with the spear, receives half
    the city and other rewards, marries the foreign girl, and rules with his wives.
    A variant describes a jealous master sending a youth to recover a spear left in
    a hostile king's wound, courtship of the ruling daughter, pursuit by townspeople,
    and aid at the river.
  language: English
  quote_policy: summarized
