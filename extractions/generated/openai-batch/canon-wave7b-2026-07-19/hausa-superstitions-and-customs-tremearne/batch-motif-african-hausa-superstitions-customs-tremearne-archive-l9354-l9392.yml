canonical_text:
  quote: ''
  summary: A pursued man, woman, and their children reach a river and transform into
    hippopotamuses and crocodiles. The bull-hippopotamus uses the river water against
    enemy riders, killing men and horses and causing the enemy leaders to withdraw
    from the river and return to the siege. The transformed beings then become human
    again, hide their children across the river, re-enter the city, and ask their
    king to protect ninety-five children before they flee; the king promises their
    safety.
  language: English
  quote_policy: summarized
