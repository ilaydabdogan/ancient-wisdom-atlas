canonical_text:
  quote: ''
  summary: The passage is a set of notes on tales. It includes a fragment about disease
    becoming chronic; a note identifying an affinal practice as taboo and comparing
    wife-family avoidance in India, among the Beja, and among the Matse/Ewhe; a note
    that someone could feel his way back in the dark; a note on a mare as a possible
    mount; a recipe-like note for cakes made with flour, honey, water, and pepper;
    and a note that non-combatants had hiding places supplied for war in periods of
    raiding and insecurity.
  language: English
