canonical_text:
  quote: ''
  summary: 'Editorial notes explain tale terms and customs: a carrier can be used
    to bind a corpse; a small lidded basket is identified as the Hausa “magic bottle”;
    women fetch water from streams and wells; funeral rites use loud noise and drums;
    corpses are wrapped in mats; and further glosses concern drum sounds, sleep, horse
    keeping, mother-in-law avoidance, and leaving town to avoid danger.'
  language: English
  quote_policy: summarized
