canonical_text:
  quote: ''
  summary: A girl leaves her sister’s water household with instructions about two
    baskets and hills; when she follows the instructions, animals, servants, and musicians
    emerge and she returns to the king’s palace with a host. Another daughter imitates
    the visit by means of a gourd reaching the river house. Dodo’s Son states a prohibition
    on speaking his name. The second visitor refuses to hide, chooses a large basket
    instead of the instructed small ones, breaks it immediately, and defective animals
    and servants emerge.
  language: English
  quote_policy: summarized
