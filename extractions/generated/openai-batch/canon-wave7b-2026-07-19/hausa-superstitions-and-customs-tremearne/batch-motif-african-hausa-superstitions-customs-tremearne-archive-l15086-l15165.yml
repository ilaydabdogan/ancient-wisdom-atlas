canonical_text:
  quote: ''
  summary: 'A woman called the Leper obtains a heavenly bride for her son with the
    help of a Wild-Cat, but the father says the bride should instead be the daughter
    of the King of Agaddez. The King of Agaddez sets a confinement test: the boy and
    the girl must be locked in a strong hut for a fortnight, and the boy must not
    eat corn. The boy’s mother secretly brings him food and water at night. The girl
    suspects him of eating corn, tries to expose him by marking the wall with soup,
    and says he will be killed. The mother substitutes kola-water evidence on the
    girl’s hand, the boy’s hands, and the wall, so that the boy is judged to have
    eaten kola rather than corn and is accepted as husband. The boy reports the marriage
    to his father, who remains silent and makes an alliance with Pagans who surround
    the city.'
  language: English
  quote_policy: summarized
