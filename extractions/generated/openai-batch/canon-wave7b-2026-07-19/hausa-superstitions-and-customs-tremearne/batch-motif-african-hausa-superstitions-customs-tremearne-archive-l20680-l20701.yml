canonical_text:
  quote: ''
  summary: 'Notes identify a gourd used for spoons, describe the Spider''s affected
    eating manner in contrast to ordinary use of four stiff right-hand fingers, identify
    an item as a kind of alkawali, and recount a tale explaining the guinea-fowl''s
    stupidity and preference for running: when flying was first made, the other birds
    submitted to God''s will, but the guinea-fowl declared she would fly regardless,
    fell, and had God''s blessing retracted so that she would travel on her legs.'
  language: English
  quote_policy: summarized
