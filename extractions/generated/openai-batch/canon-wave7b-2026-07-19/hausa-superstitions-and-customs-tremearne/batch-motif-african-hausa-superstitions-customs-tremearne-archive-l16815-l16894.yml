canonical_text:
  quote: ''
  summary: In this excerpt from “The Wise Ewe,” the Ewe guides Auta/the Boy to horses,
    grooms, slaves, concubines, and corn, directs these goods and attendants to the
    Unbeloved Wife, and secures Auta’s marriage to that woman’s daughter. Later, after
    Auta becomes prosperous and takes a second wife despite the Ewe’s warning not
    to marry a Bad Woman, the Bad Woman orders the old Ewe killed for meat; the Boy
    returns, learns what happened, and wraps the Ewe’s flesh in its fleece.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ewe reports seeing about two hundred horses with saddles, bridles, and
    royal caparisons.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ewe tells the Boy to follow where she has been in the grass; he sees about
    two hundred grooms, each with a rug, and she tells him to have each groom hold
    a horse.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the horses surround the Weaver’s house, the Weaver says the Stranger’s
    horsemen have come; the Ewe says they have not left him and orders the horses
    taken to the Unbeloved Wife.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the edge of the forest, Auta sees about three hundred slaves and concubines,
    each carrying a sheaf of corn, and the Ewe orders them and the corn taken to the
    Unbeloved Wife’s house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The House-Wife says Auta should marry her daughter, but the Ewe refuses and
    says Auta should marry the Daughter of the Unbeloved Wife.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Auta marries the Daughter of the Unbeloved Wife, and the Weaver and the Unbeloved
    Wife both receive a share in the riches.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After some time, the Ewe has a house built for her, and Auta rides a horse
    with trappings while slaves follow him.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Auta tells the Ewe he wants a second wife; the Ewe warns him not to take a
    Bad Woman, but he later finds a beautiful Bad Woman and marries her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: While Auta is away riding, the Bad Woman says there is no meat and that the
    old Ewe must be killed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: One of the Runners objects that the Ewe was there before he came and is not
    meant to be killed, but the Bad Woman threatens to have him sold if he does not
    kill it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Runner seizes the Ewe and cuts its throat; when the Boy returns, the Ewe
    is being skinned.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The Boy asks where the meat came from; the Bad Woman admits she had the Ewe
    killed, and the Boy gathers the flesh, wraps it in the fleece, and ties it up.
  category: action
  evidence_refs:
  - ev:7
