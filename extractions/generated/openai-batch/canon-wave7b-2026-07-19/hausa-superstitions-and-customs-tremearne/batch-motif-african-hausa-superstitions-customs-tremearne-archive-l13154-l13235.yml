canonical_text:
  quote: ''
  summary: 'The passage contains the tale of a Hen who is to marry a Wild-Cat, invites
    her fowl relatives to a marriage breakfast, and is killed after the Wild-Cat kills
    the guests. The editor then notes related animal-deception tales. A second tale
    begins: a dishonest father, after cheating many people, flees with his daughter,
    later gives the same daughter in marriage to multiple suitors, and is admonished
    by drummers until one husband pays and lives with her.'
  language: English
  quote_policy: summarized
