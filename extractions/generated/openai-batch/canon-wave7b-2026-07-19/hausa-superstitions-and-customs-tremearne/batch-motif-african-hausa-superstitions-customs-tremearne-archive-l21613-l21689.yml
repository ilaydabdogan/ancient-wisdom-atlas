    child capture by slave-raiders, a doubtful phallic interpretation of an anatomical
    term, charms, midwives and postpartum washing, Maria Theresa dollars used as ornaments,
    a stream near a town, newborn transport in a calabash, male developmental stages,
    and separate huts for wives and children.
