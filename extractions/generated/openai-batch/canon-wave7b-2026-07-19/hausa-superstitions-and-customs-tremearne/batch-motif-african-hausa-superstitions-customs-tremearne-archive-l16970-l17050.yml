canonical_text:
  quote: ''
  summary: 'A dying father, Ahmadu, instructs his sons to accept only specified items
    from his estate. The eldest son and Mohamma reject the limited inheritance, while
    Auta agrees to take only the boot and stick. After Ahmadu dies and the estate
    is divided, Auta refuses further property, is abused by his mother, and leaves
    for the forest. On his journey he passes through a sequence of encounters in which
    he gives away or receives objects: stick, bird, ashes, porridge or food, hoe,
    and knife. The passage ends as he meets a weaver with a white cloth.'
  language: English
  quote_policy: summarized
