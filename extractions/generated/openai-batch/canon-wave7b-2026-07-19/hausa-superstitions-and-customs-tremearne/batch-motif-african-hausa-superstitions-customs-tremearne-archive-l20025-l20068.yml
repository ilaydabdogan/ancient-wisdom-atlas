canonical_text:
  quote: ''
  summary: A boy reaches the house of a woman identified by the tale title as the
    one-sided giantess, climbs a tree near the door, and leaves his dog below. While
    the woman prepares to eat, he uses his spear to take a small amount of porridge,
    divides it with his dog, and later escapes home. A variant note describes a hunter
    stealing food from one of two witches, sharing it with three dogs, escaping, and
    later surviving the witch's revenge when his dogs kill both witches.
  language: English
  quote_policy: summarized
