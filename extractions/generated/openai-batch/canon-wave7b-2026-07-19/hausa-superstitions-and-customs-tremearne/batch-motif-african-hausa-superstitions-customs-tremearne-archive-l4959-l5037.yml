canonical_text:
  quote: ''
  summary: The passage describes Hausa affinal avoidance and respect toward parents-in-law,
    social contempt and jokes directed at bachelors, strong desire for motherhood,
    and a tale of a consecrated child born alive in a grave after his mother died
    and was buried. The child is named Servant of God, sent to a malam, and immediately
    reads the Koran. An alternate version from Hausa Sayings places the dead mother
    near dye-pits, where a hidden boy causes mischief until a watchman sees him and
    digging reveals a live child beside the dead woman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the son-in-law relationship called surukuta includes avoidance,
    while a son-in-law also shows great respect when his wife's mother visits or when
    he visits her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife's parents may eat in the son-in-law's house, and theft from one or
    both parents-in-law is described as especially vile.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author reports being told that a woman also avoids her parents-in-law,
    but says this may be incorrect or an older custom; the stated general rule is
    that a husband brings his wife to his own or his parents' house.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: An unmarried man is described as looked down upon; in stories he need not
    be rescued from danger and may be killed without regret.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man who has enough money to marry but lives without a wife is described
    as not quite normal and as failing an expectation to help increase the population.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A bachelor is called a man with a broom because he must sweep his own hut
    and is imagined as dreaming of housework.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says Hausa stories tell of women praying to have offspring, whatever
    the offspring might be, and that even abnormal offspring are usually satisfactory
    in those stories, with exceptions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Woli story, the mother dies in childbirth, is buried, gives birth in
    the grave, and the crying baby is heard, after which people open the grave and
    bring out the child.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The chief names the child Servant of God and orders that he be brought up
    by a malam; when the baby reaches the malam's house, he begins reading the Koran
    and is judged already qualified.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the alternate version, the mother is buried near dye-pits, and for three
    months an unseen person spills dye, hides dyeing poles, and causes mischief for
    the dyers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A watchman placed in a chedia tree sees a boy crawl out of a hole in a bank,
    repeat the pranks, and return to hiding; when the place is dug open, a dead woman
    is found with a live child beside her.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
