canonical_text:
  quote: ''
  summary: A Girringa husband brings a crying wife from Kano into the city of many-headed
    Girringas, where she sees beings with five and ten heads. She is taken to the
    husband's house, honored with killed goats, fattened, and unknowingly sent to
    fetch water on the day they intend to kill and eat her. At the river she turns
    herself into a tree-stump, later becomes a woman again, and escapes to her own
    city. An editorial note suggests the tale may be a variant of another story pattern
    in which a girl is married and brought back for a family to devour. The passage
    then begins the next tale by introducing an enormous unmatched young giant.
  language: English
  quote_policy: summarized
