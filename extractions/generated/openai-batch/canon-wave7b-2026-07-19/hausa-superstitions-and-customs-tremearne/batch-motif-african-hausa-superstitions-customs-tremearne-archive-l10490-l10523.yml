canonical_text:
  quote: ''
  summary: A Hen asks a Wild-Cat for a childbirth charm. The Wild-Cat tells her to
    pluck feathers from her head, apply salt and pepper, and return; meanwhile he
    prepares a fire. After she returns, he tells her to circle the fire in front of
    him while repeating that she seeks a childbirth charm. He then seizes her, throws
    her onto the fire, and eats her. A variant says the Wild Cat can change into a
    Malam and prescribes in that form, telling the Hen to pluck her whole body clean.
  language: English
