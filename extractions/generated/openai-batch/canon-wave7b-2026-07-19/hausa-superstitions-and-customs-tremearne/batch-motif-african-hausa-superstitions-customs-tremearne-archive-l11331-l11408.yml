  quote: ''
  summary: A younger son, mocked for acquiring a wizened old woman instead of visibly
    valuable slaves, learns that she is the lost daughter of a king. After she is
    recognized by a man from her city, the younger son takes her to her father for
    ransom. She instructs him to refuse large payments and demand the small ring on
    the king's little finger, saying it is the spirit of the city and will confer
    rule over it.
