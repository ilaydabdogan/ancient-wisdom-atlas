canonical_text:
  quote: ''
  summary: In an excerpt from “The Lucky Boy,” the Boy continues a cumulative sequence
    of loss and compensation. A man gives him potash after the Boy identifies earlier
    items and agents back to a little Scorpion given by his Father for the journey.
    A Filani Youth uses the potash in water for cattle; after the Boy recites the
    chain, the Youth gives him a Bull. The Boy then lodges with a Chief Butcher, who
    slaughters the Bull and sells the meat; the Boy again demands his property and
    begins to recite the chain. The passage also includes captions for decorated wooden
    or gourd vessels and for ethnographic images of butchers and a blacksmith.
  language: English
  quote_policy: summarized
