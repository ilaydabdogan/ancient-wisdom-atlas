canonical_text:
  quote: ''
  summary: The passage recounts a Hausa etiological legend in which Bawo intends to
    bless Kachi with a magic dyeing flask, but Kano receives it first; Kachi then
    receives fire that defines Katsina by burned land. A variant assigns crafts and
    trades to children of Biram and Diggera. The passage also records customs concerning
    prayers after bodily reflexes, earth used for childbirth, adornment, protection,
    and remembrance of homeland, kola-nuts as offerings and social gifts, and a curiosity
    tabu in cited stories.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bawo is described as having married Umma, also called Daura, queen of the
    city of Daura, and as having children including Kachi or Bawo Bawo, Kano, Daure,
    and Yabuwu.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the children had grown, Bawo summoned them to bless them and intended
    to give Kachi the bottle of dyeing, described as a magic flask containing a charm
    or blessing for supremacy in dyeing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kano was hiding, heard Bawo’s intention, came first, and presented himself
    to his father.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Because Bawo was blind, he gave the bottle of dyeing to Kano; the passage
    presents this as the reason Kano’s dyes surpass those of other cities.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After Kachi arrived, Bawo could not recall the bottle and instead gave him
    fire so that the bush could be set alight and his country would extend over the
    burned space, which became Katsina.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'A variant says Biram married the Berber maiden Diggera, had six children,
    and those children received special gifts or occupational roles: dyers and weavers,
    traders, and slave-dealers.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that Hausa people utter a prayer after yawning, hiccoughing,
    or sneezing, and that present invocations are Koranic in character.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: White earth may be eaten to secure easy childbirth; red earth may be rubbed
    on the body for adornment; yellow or white face-lines, sometimes mixed with black
    strokes, may be used for protection or charm.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Mothers traveling to another country may rub their children’s heads with earth
    so the children will not forget their native land; emigrants may also carry soil
    from their country.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Kola-nuts are described as stimulating, ritually and socially important, with
    part of the first mouthful spat on the ground for Allah, and as gifts at marriages
    and births, invitations to feasts, tokens in betrothal contracts, and payment
    for news.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage notes a tabu in Story 82 in which a husband is not allowed to
    gratify curiosity about a certain thing, and says Story 4 may contain a similar
    prohibition.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: A footnote compares the distribution of special gifts among children to a
    Llanberis legend in which children become a physician, a smith-like figure, and
    inventors of a harp and spinning-wheel.
  category: other
  evidence_refs:
  - ev:10
- id: obs:13
  text: A footnote states that among the Mendi of Sierra Leone, Porro society members
    use two red kola-nuts as a symbol of war and one white nut broken in two as a
    sign of peace.
  category: object
  evidence_refs:
  - ev:11
