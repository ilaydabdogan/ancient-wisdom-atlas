canonical_text:
  quote: in the night she sharpened her teeth, for she was going to enter the Boy's
    hut, and eat him.
  summary: A New Wife asks the Boy about his hunting charms and tries to keep him
    from taking his horse, sword, and gourds on a journey, but his Father intervenes
    and the talking Horse goes with him. The Woman leads him past a shed associated
    with a Many-mouthed Woman and then to her city. There she prepares magic and food,
    sharpens her teeth intending to eat him at night, but the Horse alerts him and
    he sends her away. After three days, the Boy and Horse use a water-basket errand
    as a delay; while the Woman tries to fetch water and then follows, the Boy rides
    away on the Horse.
  language: English
  quote_policy: quoted
