canonical_text:
  quote: ''
  summary: Prefatory section describing the author's comparative purpose, the collection
    locations and narrators for Hausa tales, the literacy and language abilities of
    named narrators, a brief note on Momo Kano's death, and practical difficulties
    in collecting oral tales, including mistrust, language comprehension, interruption
    of narration, and sung passages.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author says he previously compared customs of some Nigerian groups with
    those of civilized peoples and now aims at a similar comparison through folklore.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nearly all of the hundred tales in the volume were obtained in 1908 and 1909
    at Jemaan Daroro in the Nassarawa Province of Northern Nigeria.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A few tales were earlier told to the author in 1906-1907 at Amar by Ashetu,
    described as a policeman's wife; later tales were related by men.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Women and children are said to be the best storytellers, but the author states
    that he found them difficult to access, nervous, and easily tired, so he relied
    mainly on men.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The named male narrators include Privates Ba Gu(d)du and Umoru Gombe, the
    Sar(r)ikin Dukawa, Momo Kano, and Mohamma.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each story is marked in the table of contents with the initial of the person
    who told it to the author.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mohamma is said to have spoken the best Hausa; the narrators are described
    as illiterate, and only two are said to have had even a smattering of English.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Momo Kano learned the names of Hausa written characters and wanted to shave
    his hair and wear a turban like a malam, or learned man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The author states that Momo Kano is dead and hopes that what he learned was
    useful to him on his way to the next world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The author identifies gaining a narrator's confidence as a difficulty, especially
    because an official's inquiries are suspected.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The author identifies language comprehension and pace of narration as difficulties;
    interrupting a narrator can cause the narrator to lose the thread of the tale.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Many speeches in the tales are sung in a falsetto voice, which the author
    says alters sounds and syllable accents.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The author cites Mr. Hartland on rustic storytellers sometimes being unable
    to explain expressions or whole episodes, and illustrates this with Uncle Remus.
  category: speech
  evidence_refs:
  - ev:8
