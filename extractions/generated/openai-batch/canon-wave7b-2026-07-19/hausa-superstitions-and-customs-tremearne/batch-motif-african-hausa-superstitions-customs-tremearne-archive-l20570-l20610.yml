canonical_text:
  quote: ''
  summary: 'The passage consists of notes explaining objects and incidents in surrounding
    Hausa tales: native beer called pito or gia is jokingly called water and may be
    confused or pretended to be water in gourds; Hartland compares one principal incident
    with European edifying tales of escape through attending religious service, distinguishes
    it from the Letter of Death pattern, notes a similar Siamese story about potters
    and court testimony, and treats a following magic contest as a common folktale
    incident exemplified by the Second Calendar in the Arabian Nights. A fragmentary
    next note says a wild-cat intended to accompany a cock and kill other fowls.'
