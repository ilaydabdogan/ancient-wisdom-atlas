  summary: The passage consists of editorial notes to Hausa tales and notes on tribal
    marks. It comments on geography, sexual continence as a condition for wonderful
    powers, methods of drinking, a water or lake episode in which a woman drinks all
    the water, narrative discontinuities, women loosening cloths, an unexplained inability
    to see a youth and dog, and scarification or mark patterns including arrow and
    lizard designs used as a charm.
