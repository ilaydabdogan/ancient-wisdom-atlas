canonical_text:
  quote: ''
  summary: A variant recounts a rival wife exposing the birth of a son to Dodo, the
    mother substituting a lizard, and the boy later being swallowed, emerging from
    Dodo's heart, and killing the monster. The boy then tricks the rival wife into
    eating the monster's flesh; she drinks a river dry until pierced by his spear.
    A commentary notes the widespread folktale incident of beings delivered from a
    monster's stomach and compares it with African examples, Jonah, Hesione and Herakles,
    and medieval Hell-mouth imagery. A second tale begins with a man accepting seven
    bulls under a condition that he will be buried when the King's Mother dies; he
    feeds pieces of the bulls to eaglets, is questioned by the Mother-Eagle, and tells
    her when the King's Mother dies.
  language: English
  quote_policy: summarized
