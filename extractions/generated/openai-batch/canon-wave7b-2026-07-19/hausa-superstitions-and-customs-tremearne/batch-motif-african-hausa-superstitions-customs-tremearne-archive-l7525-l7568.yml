  summary: The passage describes Bori-associated tsere objects, a special Masu-bori
    vocabulary and its religious disapproval, funerary killing and eating of animals
    when a Bori headman dies, and story elements involving lands or rivers of milk
    and honey, self-cooking food, moving houses, and animals asking to be killed.
    It also includes the author's comparisons with Israelitish, European, Filani,
    and Indian examples.
