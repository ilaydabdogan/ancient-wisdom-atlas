literal_observations:
- id: obs:1
  text: The Sa(r)rikin Rafi is said to have a kola-nut and small chicken as its tsere,
    while the Wanzami or barber has a razor.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Masu-bori are said to use a special vocabulary, but information about
    the spirits and spirit language is difficult to obtain because Christian and Mohammedan
    authorities frown on the performers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Examples of the special vocabulary include malam becoming maiwalwala, ga(r)ri
    becoming jan garu, and berichi becoming kankanana mutua.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: When a Bori headman dies, a red goat and kid, a black kid, and a red and a
    speckled cock are killed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Speeches are made at the foot of a haunted tree or a rock before the body
    is buried.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the burial, the goats and fowls are eaten with porridge, milk, and honey.
  category: sequence
  evidence_refs:
