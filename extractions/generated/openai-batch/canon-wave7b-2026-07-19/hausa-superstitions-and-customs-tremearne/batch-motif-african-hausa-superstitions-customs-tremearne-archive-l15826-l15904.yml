canonical_text:
  quote: ''
  summary: A boy named The-Gift-of-God enters a hedge made by forest beasts, asks
    successive animal guards for water, challenges them to wrestle, and defeats and
    binds Gazelle, Hyaena, and Elephant. After Elephant is conquered, the beasts decide
    to flee. The boy hides inside a jar of oil among them; when Hyaena later opens
    the jar to steal oil, the boy strikes her.
  language: English
  quote_policy: summarized
