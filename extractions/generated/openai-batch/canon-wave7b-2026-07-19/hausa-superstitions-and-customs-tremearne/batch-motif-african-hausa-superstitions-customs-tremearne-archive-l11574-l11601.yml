canonical_text:
  quote: ''
  summary: 'The excerpt gives editorial notes around “The Wonderful Ring.” It includes
    a proverb about a Lucky Man finding a buyer for water even at the Niger, summarizes
    a variant in which an Old Woman is revealed as the mother of a distant King and
    ransomed for one of two small balls kept in his mouth, and notes that this variant
    lacks pursuit of the Hero and lacks temporary loss of the city he founds. It then
    summarizes another story: a trading Husband receives gifts from his wives, including
    a tin with an Insect from the fourth Wife; a Cat steals the tin and eats the Insect,
    is handed over to the Husband under a retaliatory legal principle, later kills
    many Mice in a city where Cats are unknown, and is bought by the King and People
    for 200 Slaves, which the Husband gives to the fourth Wife while expelling the
    other wives.'
  language: English
  quote_policy: summarized
