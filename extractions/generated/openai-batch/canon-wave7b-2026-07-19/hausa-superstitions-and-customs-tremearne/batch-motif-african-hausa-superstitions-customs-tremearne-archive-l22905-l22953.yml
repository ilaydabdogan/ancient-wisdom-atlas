- id: obs:2
  text: No. 15 is described as having fourteen lines on each cheek and eight on the
    forehead; these are said to be marks of Zanfara, and both parents are from Bakura.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: No. 27 is described as showing a more elaborate pattern of yam ba(i)ki, with
    both parents from Uti in Kano.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: No. 29 has six small squares underneath and outside each eye, named with a
    phrase glossed as “squat and eat yams”; the note says these marks are a charm
    to obtain plenty of food.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: No. 30 has two lines set farther back from the mouth and broader than the
    usual yam ba(i)ki; both parents are from Daura.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: No. 31 has a short cut down the forehead, said by the wearer to prevent headache,
    and eye marks called daure that were said to have been made on reaching puberty.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: No. 40 is described only as having an unusual pattern, with parents from Tofa
    and Yelwa in Kano.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: No. 41, named Abdu, may once have had similar marks on the right side of the
    body; the visible facial marks are said by him to be Gobir marks, though his parents
    came from Katsina and Sokoto.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: No. 44 has a mark called babba goro on the left side of the body below the
    waist, no facial marks, and says the mark was to relieve stomachache.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:10
  text: No. 45 has no tribal marks but has nine cuts under the left nipple, described
    as made to relieve pain because the nipple swelled.
  category: attribute
  evidence_refs:
  - ev:11
