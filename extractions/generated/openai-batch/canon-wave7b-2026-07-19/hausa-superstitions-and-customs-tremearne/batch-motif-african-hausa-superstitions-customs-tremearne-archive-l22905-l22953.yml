canonical_text:
  quote: ''
  summary: A set of notes on numbered examples of Hausa bodily and facial marks records
    their forms, names, claimed purposes, and the parental places of origin of the
    marked persons. Some marks are identified with places or groups such as Zanfara
    or Gobir; others are described as charms for food, puberty-related eye marks,
    or cuts intended to relieve pain.
  language: English
  quote_policy: summarized
