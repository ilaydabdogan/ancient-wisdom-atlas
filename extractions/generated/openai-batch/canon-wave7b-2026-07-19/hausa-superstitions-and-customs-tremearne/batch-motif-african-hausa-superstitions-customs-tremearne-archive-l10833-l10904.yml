canonical_text:
  quote: ''
  summary: The passage first notes a variant in which the Spider kills the Lamb and
    the Kid takes the Francolin's part, followed by a caption for a decorated gourd.
    The main tale describes the Lion preying on the Beasts of the Forest until they
    agree to send him one animal each morning. After Gazelle and Roan Antelope are
    killed, the lot falls on the Jerboa, who delays, climbs a tree near a well, and
    tells the Lion that another lion in the well stole honey meant for him. The Lion
    mistakes his reflection for a rival, leaps into the well, and drowns.
  language: English
  quote_policy: summarized
