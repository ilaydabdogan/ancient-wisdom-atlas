canonical_text:
  quote: ''
  summary: The passage begins with a caption for decorated vessels, then opens the
    tale of a greedy girl. Her parents send her away because she eats everything she
    sees, including ancient bones. She asks a girl-friend to accompany her. On the
    road she finds and eats nine dogs, after which she can no longer speak human words
    and can only make dog sounds. The two girls arrive at a distant city and the king's
    palace. The king marries the beautiful but barking girl, while the king's brother
    marries her friend. The king repeatedly tries to make his wife speak. Eventually
    all the women of the town are ordered to gather at the palace and pound grain
    together so that the girl's speech may return.
  language: English
  quote_policy: summarized
