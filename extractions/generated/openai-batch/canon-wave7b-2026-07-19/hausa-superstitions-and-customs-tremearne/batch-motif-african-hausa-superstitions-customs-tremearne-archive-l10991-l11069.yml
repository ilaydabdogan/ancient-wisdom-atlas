canonical_text:
  quote: ''
  summary: 'The passage first gives the end of an animal trial in which Monkey climbs
    a tree, Jackal enters a hole, and Camel is left alone, followed by a note comparing
    a somewhat similar tale. It then begins the tale of a boy who goes on a trading
    expedition: his father gives him a little scorpion, which farmers kill and replace
    with a sickle; reapers use the sickle and replace it with millet-flour; a Filani
    maiden mixes the flour with sour milk, drinks it, and gives butter; a man carrying
    tobacco uses the butter, after which the boy begins his repeated demand for restitution.'
  language: English
  quote_policy: summarized
