canonical_text:
  quote: ''
  summary: The passage first closes a preceding tale with a pledge not to be greedy
    and notes a variant in which a Witch glows like fire. It then begins the tale
    of Bortorimi and the Spider. Bortorimi is described as an unmatched giant hunter
    who kills many elephants for food. The Spider sends his wife to Bortorimi’s house
    to get fire; she receives meat, and the Spider has her put out the fire and return
    for more. The Spider then visits, eats meat, asks where it comes from, and asks
    to accompany Bortorimi. Too impatient to wait for dawn, the Spider makes false
    dawn attempts by burning his roof and by making a call to prayer from a rock,
    but Bortorimi refuses to be deceived. At daybreak they travel to a river, where
    Bortorimi drinks all the water after the Spider has drunk. In the forest, Bortorimi
    tells the Spider to insult the elephants and flee into Bortorimi’s enormous nose
    when chased; the Spider insults the elephants and they charge.
  language: English
  quote_policy: summarized
