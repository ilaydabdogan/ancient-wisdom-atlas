canonical_text:
  quote: ''
  summary: 'The passage concludes a Solomon-and-birds episode in which the King of
    Birds delays attendance, reports bird debates about day and night and about men
    and women, and a woman learns that an earlier statement about a fine floor was
    only a joke. The narrator then notes a Malayan parallel involving Solomon and
    birds. A new tale begins: Kwallabbe, an ugly maiden, is rejected, transformed
    into beauty after being swallowed by her mother, marries the King''s Son, and
    is then desired by the King, who sends his son away with an army; before departure
    she places a date-stone in his hair, and he is ordered into a well to draw water
    for horses.'
