  summary: The passage discusses mirages, hallucinations, a waterless demon-haunted
    desert, and then begins a chapter on customs and superstitions. It describes Hausa
    beliefs about evil influences and witchcraft, including women becoming witches
    by drinking a locust-leaf brew, accusations against men and women, apotropaic
    statements that flesh is bitter or salt, an anecdotal use of a galvanic battery
    to remove alleged evil influence, witches as shapeshifters who eat human flesh,
    buffalo and Dodoniya variants, witches’ many mouths, and salt as inimical to evil
    spirits.
  language: English
  quote_policy: summarized
