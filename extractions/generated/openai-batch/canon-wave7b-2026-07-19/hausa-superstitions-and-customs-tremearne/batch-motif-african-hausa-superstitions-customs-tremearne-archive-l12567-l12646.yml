canonical_text:
  quote: '"Well, I have heard your name, now you tell me mine."'
  summary: A youth seals himself in a hut. Maidens going to him pass an old woman
    who asks for help; only one maiden helps her and receives the youth's name. At
    the hut, several maidens identify themselves by food names but cannot name the
    youth, so he sends them away crying. The supplied passage ends as another maiden
    begins the same approach.
  language: English
  quote_policy: quoted
