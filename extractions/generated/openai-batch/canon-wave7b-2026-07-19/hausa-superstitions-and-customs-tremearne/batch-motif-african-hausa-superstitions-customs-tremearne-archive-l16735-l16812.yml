canonical_text:
  quote: ''
  summary: Auta agrees to claim only his father's old ewe rather than riches and is
    instructed to feed the ewe before himself. After the father's death, Auta leaves
    with the ewe and is mocked. He travels, gives the ewe water first, and stays with
    a poor weaver. The weaver's favored wife refuses to provide water or food for
    the stranger, while the unloved wife prepares scarce guinea-corn water and gruel,
    which Auta gives first to the ewe. At daybreak the ewe speaks, leads Auta to the
    forest edge, leaves traces in the grass, and Auta follows them to about two hundred
    horses with saddles, bridles, and royal caparisons.
  language: English
  quote_policy: summarized
