canonical_text:
  quote: ''
  summary: The passage introduces a chapter on Hausa customs and superstitions, especially
    beliefs about gods, spirits, demons, witches, aljannu, Iblis, tree and well spirits,
    spirit worship, transformation charms, boundary disappearances, and changes under
    Islam and colonial courts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that various gods or spirits were formerly worshipped and
    names a King of the Thicket, a King of the Heavens, Dodo, and spirits living in
    baobab and tamarind trees.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Iblis and the Aljannu are described as borrowed from the Arabs and as sometimes
    taking the place of local spirits.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Witches are said often to play similar parts to spirits, and Death and a witch
    are described as interchangeable in another context.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: In one referenced story, three beings that assume human shape are identified
    alternately as demons, jinns or aljannu, and devils or iblisi.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another referenced story has a female Iblis, the wife of a devil, who sells
    charms enabling holders to transform themselves into animals.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Demons are described as not always evil: they may help a well-behaved girl
    and punish a forward girl.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The demons are described as having cloven feet like a horse’s hoof.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Aljannu are described as living in families like humans, working, and
    suffering hunger and thirst.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says the Hausas had no fetishes except for posts set up in fields,
    and that they worshipped spirits living in wells or trees.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage links belief in evil spirits with inter-tribal hostility and the
    disappearance of stragglers near boundaries, whom the author says are probably
    sacrificed or eaten in secret.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Under increasing peace and enlightenment, the passage says such rites become
    rarer, boundaries safer, disappearances easier to attribute to humans, and foreign
    spirits retire.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage contrasts seeking aid and redress in a European court-house with
    seeking it in the mud-hut of a medicine-man.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage states that at present the vast majority of people calling themselves
    Hausas are Mohammedans.
  category: attribute
  evidence_refs:
  - ev:8
