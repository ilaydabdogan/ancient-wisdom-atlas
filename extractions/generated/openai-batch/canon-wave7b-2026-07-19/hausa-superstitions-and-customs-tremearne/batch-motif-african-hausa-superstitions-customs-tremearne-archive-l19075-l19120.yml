canonical_text:
  quote: ''
  summary: The passage closes an episode in which Dan-Kuchingaya confronts a woman
    over his Elder Brother’s plucked-out eyes, rejects her pepper instruction, and
    restores the eyes after a black goat is killed. A note describes a variant in
    which Dan Kuchin-da-Gayya is a Younger Sister, relates it to a snake-marriage
    tale with Dodos substituted for snakes, and compares an escape by changing clothes
    to Hop-o'-my-Thumb. The editor also cites Breton and Shuswap parallels and cautiously
    suggests French trappers as a possible transmission medium. A new tale begins
    with a hunter’s son entering a deep forest, seeing a shed, climbing a tree, and
    watching a woman emerge. An inserted illustration caption describes excited Takal
    dancers in a realistic mimic fight.
  language: English
  quote_policy: summarized
