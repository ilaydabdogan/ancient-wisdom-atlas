canonical_text:
  quote: ''
  summary: 'The passage gives figure captions for a wooden clog and a colored leather
    sandal, then describes Hausa engagement and marriage procedures: presentations
    of kola-nuts and cowries to the bride''s parents, verbal giving and acceptance,
    secret summoning of bride''s companions, henna staining and bandaging by the bride''s
    mother, women''s cries for three days, a wedding feast, transfer of the bride
    to her new home, inspection of gifts, unveiling of bride and groom, groom''s henna
    staining and public riding with friends, and the bridegroom entering the hut at
    night with his best-man. Notes mention possible payments to relations, details
    about henna supplies, and a comparison to Indian groom anointing with turmeric.'
  language: English
  quote_policy: summarized
