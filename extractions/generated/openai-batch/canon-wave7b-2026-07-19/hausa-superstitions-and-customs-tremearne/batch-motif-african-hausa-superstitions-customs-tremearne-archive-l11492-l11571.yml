  text: Cat enters several houses and the palace, killing large numbers of mice; the
    King of the city, who has the ring, orders that Cat be brought to kill mice in
    his palace.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Princes of the Mice ask Cat what crime they have committed; Cat says her
