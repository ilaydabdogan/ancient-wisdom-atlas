  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The King of the city sleeps with the ring in his mouth at night; roof-mice
    search the hut, climb the bed, and one takes the ring after it rolls from the
    King's open mouth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Another roof-mouse bites the King on the tongue, waking him; the Bad Woman
    asks whether the ring has been taken.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The King of the Roof-Mice brings the ring to Cat; Cat puts it in her mouth,
