canonical_text:
  quote: ''
  summary: Dog and Cat go to the city to recover their master's ring, cross a river
    by Dog carrying Cat, and enter the city. Cat kills many mice and threatens the
    mouse leaders until roof-mice steal the ring from the sleeping King. Cat and Dog
    return the ring to their Master; the city is then said to have returned, while
    the Bad Woman no longer has it.
  language: English
  quote_policy: summarized
