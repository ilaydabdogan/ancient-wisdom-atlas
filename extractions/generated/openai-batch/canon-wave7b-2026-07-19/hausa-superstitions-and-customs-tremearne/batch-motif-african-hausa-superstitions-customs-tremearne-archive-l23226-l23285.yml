  summary: The passage lists Bori characters or roles, with associated dance actions,
    clothing, props, tsere items, and possession descriptions. The entries include
    figures identified as a person from Asben, a lion, a learned pilgrim, a disciple,
    a helpless lying-down figure, an unclear figure, thunder, the wife of Sa(r)rikin
    Rafi, a principal huntsman, and a prince or cavalry leader.
