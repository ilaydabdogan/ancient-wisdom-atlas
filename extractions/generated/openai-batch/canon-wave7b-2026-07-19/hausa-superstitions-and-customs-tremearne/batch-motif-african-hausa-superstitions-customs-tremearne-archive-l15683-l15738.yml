canonical_text:
  quote: ''
  summary: A childless woman prays to God for a child and gives birth to a son named
    Little Crab. When grown, the boy refuses to leave his mother's back and walk.
    The mother asks a magician for a charm; he tells her to buy and kill a goat in
    the forest and use the meat as a pretext to make the boy descend. She does so
    and runs away. A Hyasna agrees to carry the boy in exchange for the meat, eats
    it, then cannot make him get down because he demands the meat back and evades
    being bitten. After about ten days, the Hyasna asks the magician for a charm,
    but the supplied passage breaks off.
  language: English
  quote_policy: summarized
