canonical_text:
  quote: ''
  summary: 'The passage describes practices and beliefs concerning magic and the evil
    eye: women paint colored rings around their eyes to avert harm; praise of a woman’s
    beauty by a man other than her husband is treated as injurious and answered with
    a dismissive formula; a life-sized target at Amar provokes fears of miscarriage,
    lack of births, and death by sympathetic resemblance if marked men shoot a marked
    target; spots, lines, tribal marks, pots, charms, water, calabashes, and animal
    eyes are discussed as possible media of evil-eye belief or sympathetic magic.'
  language: English
  quote_policy: summarized
