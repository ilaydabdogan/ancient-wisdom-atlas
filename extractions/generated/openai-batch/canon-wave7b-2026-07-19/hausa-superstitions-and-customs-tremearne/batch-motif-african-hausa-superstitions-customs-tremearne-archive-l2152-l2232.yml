canonical_text:
  quote: ''
  summary: 'A commentary passage surveys Hausa tale features: a Dodo or other captor
    leaves a victim while fetching cooking fire; personified Slipperiness is used
    to spoil food carried to a hero; a king sends a force against a slave and a magical
    ram is defeated by a poisoned arrow; animals speak, sing, hear, or revive after
    swallowing, cooking, eating, or death; the narrator uses second-person direct
    address and deictic interruptions; parables appear in court stories, including
    a mare-and-foal analogy and a chief''s attempted pursuit of a slave''s wife.'
  language: English
  quote_policy: summarized
