canonical_text:
  quote: ''
  summary: 'A Rooster and an Elephant, who keep house together, quarrel after the
    Elephant breaks the Rooster''s door-post and the Rooster throws rubbish into the
    Elephant''s hut. The Elephant declares a fight, and each side gathers relatives:
    the Elephant calls the Beasts of the Forest, while the Rooster mobilizes the Birds.
    The Hawk claims command of the Birds'' army. The Beasts send Hyaena as scout,
    and the Birds send Ostrich forward. Hyaena and Ostrich meet, discuss whether their
    armies are ready, and Hyaena, overcome by greed after seeing Ostrich''s flesh
    through her feathers, challenges Ostrich to a private fight. Hyaena strikes Ostrich
    three times; Ostrich then strikes with wings, feet, and beak, counts this as only
    one turn, pecks again, and blinds Hyaena. Hyaena returns frightened and says they
    cannot fight the Birds, but the others advance. The excerpt breaks off as both
    armies arrive at the battlefield.'
  language: English
  quote_policy: summarized
