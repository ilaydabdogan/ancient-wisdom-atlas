canonical_text:
  quote: ''
  summary: 'A set of explanatory notes on tales: one note proposes that a youth, identified
    parenthetically with a leper, may have returned to his town with his bride while
    other wives had gone there; another explains a white breast and preserves a cry
    to a son. Further notes say some magic rites cannot be performed by females, discuss
    a narrator’s possible confusion of animals, gloss the place-names Jagindi and
    Keffi/Kaffi, explain a phrase usually associated with enslavement, and comment
    on corrupt chiefs near the end of Filani rule selling their own people into slavery.'
  language: English
  quote_policy: summarized
