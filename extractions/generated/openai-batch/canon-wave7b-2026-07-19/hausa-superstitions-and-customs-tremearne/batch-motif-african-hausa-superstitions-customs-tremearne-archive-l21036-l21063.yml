  summary: Editorial notes discuss a rule that a killed animal belongs to the killer
    rather than necessarily to the catcher; an attempted deception of “the Something,”
    compared to Ananias; the gendering of Kura the hyaena and Zomo the hare; red insect
    hills with tunnels and corn husks; lizards in houses as part of a blissful condition;
    and a queried moral about husband and wife labor.
