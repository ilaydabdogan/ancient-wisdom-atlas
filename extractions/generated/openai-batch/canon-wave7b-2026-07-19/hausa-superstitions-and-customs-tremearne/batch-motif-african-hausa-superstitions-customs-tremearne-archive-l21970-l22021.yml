canonical_text:
  quote: the literal fulfilment of a wish is a frequent subject of tale and superstition
  summary: The passage contains notes on tales. It mentions a woman buried shallowly
    in the bush after death, clarifies that a creature is an insect rather than a
    shellfish, and summarizes Hartland’s comparative remarks on literal wish-fulfilment,
    supernatural births, and children enclosed in husks or envelopes. It lists examples
    involving a donkey-son, a hazel-nut and worm birth followed by a maiden from a
    bush, a coconut-enveloped son after drinking from a magical spring, and a boy
    emerging from a pumpkin. Later notes explain a variant in which a mother and magician
    communicate secretly by hand signs while a boy is on the mother’s back, and describe
    a prepared small-tree branch frame suspended with tie-tie.
  language: English
  quote_policy: quoted
