canonical_text:
  quote: "“Little Fool has tricked me; because of his cunning he has found me out.”"
  summary: The passage gives the end of a Little Fool and Spider tale, including literal-minded
    cooking of one bean and then all beans, the summoning and slaughter of ten gazelles,
    Little Fool’s substitution of dirt for meat in Spider’s saddle-bags, and Spider’s
    recognition that he has been tricked. It also notes two variants and begins a
    separate Spider and Hyaena-cubs tale in which Spider names himself “For-you-all”
    and uses the Hyaena’s food-distribution phrase to claim all the cubs’ food.
  language: English
  quote_policy: quoted
