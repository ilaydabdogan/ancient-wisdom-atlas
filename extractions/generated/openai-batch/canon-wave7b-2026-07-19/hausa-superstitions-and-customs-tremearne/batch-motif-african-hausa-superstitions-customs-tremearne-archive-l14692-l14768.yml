canonical_text:
  quote: ''
  summary: A girl kills her mother with the youth's knife and flees with him. In the
    forest she dies, and the youth guards her body from beasts. An eagle fetches water
    in a flask, stirs feathers into it, and the girl revives when the water is poured
    into her mouth. The pair then reach another city, where the youth uses the eagle
    feathers and water to revive the king's dead mother and receives promised gifts.
  language: English
  quote_policy: summarized
