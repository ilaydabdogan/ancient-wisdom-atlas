  summary: A boy, described as the only son of his mother, dies. His father seeks
    charms to revive him. A magician tells the father to buy 100 bundles of wood.
    The wood is stacked, burned down to red-hot embers, and the father is told that
    if he throws himself into the fire his son will live again. The father twice runs
    toward the fire but turns aside because of the heat. The boy's mother then becomes
    angry and begins to speak, but the passage excerpt ends there.
