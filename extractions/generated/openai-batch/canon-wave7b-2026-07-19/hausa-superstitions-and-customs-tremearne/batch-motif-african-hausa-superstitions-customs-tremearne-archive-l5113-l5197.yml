canonical_text:
  quote: ''
  summary: The passage describes child blessing, nursing, separation of the mother
    from her husband until weaning, circumcision practices, reported killing or disposal
    of albinos and deformed or intellectually disabled children, comments on twins
    and triplets, and summaries of two tales of extraordinary multiple births involving
    forty or one hundred children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Malams bless the child, ask God to preserve it from witchcraft, and bless
    the mother's breasts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The child is nursed for two years; during that period the mother lives apart
    from her husband and resumes sleeping with him after weaning.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Boys are said to be circumcised at about seven years of age, with some pagan
    Hausas doing it earlier; girls are said not to be mutilated.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author reports being told that albinos were once killed and eaten by an
    army before going to war.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author reports a practice in the southern part of the old Zaria province
    of throwing intellectually disabled and deformed children into the river.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author states that killing such children was apparently not legal and
    says he saw no idea of sacrifice in the river-disposal act.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author is uncertain whether the custom was practiced by Hausas proper,
    reports being told that Argungu people kept it until recently, and says Story
    73 seems to point to putting abnormal infants to death.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The author says the stories he has read do not suggest a changeling belief;
    one cited case of paternal doubt concerns legitimacy rather than fairy influence.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A footnote reports that an Argungu chief would kill men, distribute their
    flesh to followers to dry and keep until war, and that the bones would be pounded
    and eaten in soup.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The author does not think twins were killed, at least in recent times, and
    says triplets would now be considered lucky because of sterility.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: Twins are said to have a special power of picking up scorpions without injury,
    although the author says non-twins could also do so and speculates about a malam's
    potion and lotion rendering poison harmless.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The author says he has not found Hausa stories mentioning twins and argues
    that if twins had been put to death the fact would likely appear in stories as
    maternal disgrace or miraculous escape.
  category: other
  evidence_refs:
  - ev:8
- id: obs:13
  text: In one summarized tale, a woman gives birth to forty children at once; a rival
    wife kills them, substitutes forty puppies, and the children later return through
    a sequence of burial, flowers, a cow eating the flowers, and the cow re-bearing
    them.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: In the forty-child tale, the original mother is kept in a fowl-pen until the
    children are restored to the King; she is then taken out and washed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: In another summarized tale, a woman gives birth to one hundred children at
    once; she and her husband run away and leave them, and her sister, called their
    Little Mother, brings them up.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: The author suggests that the two tales may show that any number of children
    above two was thought dangerous.
  category: other
  evidence_refs:
  - ev:11
- id: obs:17
  text: A footnote refers to an English parallel to a belief that the child changes
    into a pillar of fire.
  category: other
  evidence_refs:
  - ev:6
- id: obs:18
  text: A footnote cites an old European report of the Countess Hagenan giving birth
    to 365 at one time, but says the case is now regarded medically as hydatidiform
    mole or vesicular degeneration of the chorion.
  category: other
  evidence_refs:
  - ev:11
