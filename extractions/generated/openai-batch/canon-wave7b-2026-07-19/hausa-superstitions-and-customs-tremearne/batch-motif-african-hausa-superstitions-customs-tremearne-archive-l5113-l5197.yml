candidate_motifs:
- id: motif:1
  label: Blessing child and mother against witchcraft
  taxonomy_refs: []
  basis: The passage says malams bless the child, ask God to preserve it from witchcraft,
    and bless the mother's breasts.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a ritual-protection pattern rather than a narrative motif in the
    passage.
- id: motif:2
  label: Exposure or killing of abnormal infants by water disposal
  taxonomy_refs: []
  basis: The passage reports disabled and deformed children being thrown into a river
    and later refers to abnormal infants being put to death.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The author is uncertain whether Hausas proper practiced the custom and
    explicitly says he saw no sacrificial idea in the river act.
- id: motif:3
  label: Pre-war consumption of human bodies or remains
  taxonomy_refs:
  - sacrifice
  basis: Albinos are reported as killed and eaten by an army before war, and a footnote
    describes an Argungu chief killing men whose flesh and bones are consumed in connection
    with war.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: The passage does not fully explain the ritual meaning; the sacrifice taxonomy
    is tentative because the text distinguishes the river act from sacrifice and only
    indirectly frames the war-related killing as another connection.
- id: motif:4
  label: Twins with special scorpion-handling power
  taxonomy_refs:
  - sacred_twins
  basis: Twins are said to have a special power of picking up scorpions without injury.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The author expresses skepticism, noting that non-twins can also pick up
    scorpions and proposing a possible concoction explanation.
- id: motif:5
  label: Extraordinary multiple birth treated as dangerous
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: The passage summarizes births of forty and one hundred children at a time
    and concludes that these tales may show that any number above two was thought
    dangerous.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: medium
  cautions: The danger interpretation is the author's inference, not a direct statement
    from the tales.
- id: motif:6
  label: Rival wife substitutes animal offspring for human children
  taxonomy_refs: []
  basis: In the forty-child tale, the rival wife kills the children and substitutes
    forty puppies.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage gives only a brief summary of the tale.
- id: motif:7
  label: Killed children return through plant and animal rebirth
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The forty children are killed and buried, rise as flowers, are eaten by a
    cow, are re-borne by the cow, and restored to the King.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The sequence is summarized secondhand; details of the original story are
    not provided.
- id: motif:8
  label: Abandoned miraculous children raised by maternal substitute
  taxonomy_refs:
  - miraculous_child
  basis: In the hundred-child tale, the parents abandon the children and the mother's
    sister, called Little Mother, raises them.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage does not describe later deeds or powers of the children beyond
    their extraordinary number and fostering.
comparison_claims:
- id: claim:1
  claim: The passage explicitly notes an English parallel to a belief that a child
    changes into a pillar of fire.
  claim_level: same_motif
  target: English parallel cited in T.H.H. to the belief of a child changing into
    a pillar of fire
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: low
  limitations: The passage gives only a bibliographic footnote and does not narrate
    either the Hausa belief or the English parallel in detail.
- id: claim:2
  claim: The passage juxtaposes Hausa tales of extraordinary multiple births with
    an old European report of the Countess Hagenan giving birth to 365 at one time,
    while noting a modern medical explanation for that report.
  claim_level: same_motif
  target: Old European midwifery report of Countess Hagenan's alleged 365 births
  evidence_refs:
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: low
  limitations: The comparison is brief, partly humorous, and medically qualified;
    it does not establish historical contact or common inheritance.
