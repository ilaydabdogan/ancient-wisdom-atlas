canonical_text:
  quote: The initiate is then said to be "baked,"
  summary: 'The passage describes a Bori/Masubori initiation sequence: date selection,
    medicine preparation, the candidate''s entry in white clothing with tutors, rites
    at a tamarind tree involving black-and-white cloths, a black goat, eating, dancing,
    a final dance near a large tree or baobab, conferral of degrees, and the use of
    spirit-associated colors or objects called tsere. A footnote compares Masubori
    practices with Moroccan Gnawa jinn practices involving colors, dance, incense,
    possession, and prophecy.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Auspicious and inauspicious days are distinguished, and the Ajenge and Maigoge
    consult to fix a Friday date for beginning treatment.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ajenge goes into the bush, collects herbs and bark, and prepares medicines.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two days later the candidate enters the house wearing white and accompanied
    by two selected tutors; some ceremonies are said to be unknown to the author.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the initiation period, the candidate is led by fully qualified Masubori
    to a selected tamarind tree wrapped with black and white cloths.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A small black goat is killed near the tree, its meat is cooked and eaten,
    and playing and dancing continue around the tree.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The initiate is carried home, and a final rite of dancing occurs near a large
    tree, preferably a baobab, with the author suggesting this is probably to propitiate
    feared evil spirits dwelling there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the rite, the initiate's friends are told the kind and number of degrees
    conferred, and the new member may perform publicly.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The initiate is described as being "baked," whereas before he was "unbaked,"
    like an unfinished clay pot.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Each spirit is said to have a special color or object called its tsere, into
