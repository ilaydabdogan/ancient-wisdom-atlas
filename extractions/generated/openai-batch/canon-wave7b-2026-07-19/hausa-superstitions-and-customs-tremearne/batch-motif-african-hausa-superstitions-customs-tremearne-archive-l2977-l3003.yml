canonical_text:
  quote: ''
  summary: 'The passage summarizes Hausa examples in which animals behave in human-like
    moral relationships: a ewe rewards a youth for feeding her first, dogs, cats,
    and other animals earn their keep, and a bull reports on a bereaved mother''s
    care of a herd to the Mender of Men. It then notes a snake story where the snake
    later kills its benefactor after previously saving his life, described as accidental
    and not present in all variants. The passage also includes captions for a red
    leather purse with a lizard outline and a red leather money-belt.'
