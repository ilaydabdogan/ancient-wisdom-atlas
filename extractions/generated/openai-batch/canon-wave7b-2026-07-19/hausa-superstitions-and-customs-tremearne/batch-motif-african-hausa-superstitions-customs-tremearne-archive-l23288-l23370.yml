canonical_text:
  quote: ''
  summary: The passage lists several Bori spirit names and describes their enacted
    behaviors, relationships, and tsere items. The entries include weeping search
    behavior, mute weeping or mouthing, animal or insect imitation, crawling like
    a snake, guinea-corn beer, chickens and hens, a dual Dogna spirit with white and
    black cloth enactments, a Filani chief with staff, cattle-counting, and cowries,
    and a wrath/bee figure associated with honey.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Son Bawa is glossed as "The Desirer of a Slave" and walks about weeping, saying
    that he or she is looking for a slave, while calling on other Bori spirits for
    help.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bete is glossed as "Deaf Mute" and either sits alone with tears streaming
    down the cheeks or runs around mouthing without making sound.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Birri is glossed as "Monkey"; the player climbs trees and imitates the animal.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Buwaye is glossed as "Strong one" and is identified as the same as Dan Galladima.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mai Jan Chikki crawls with the belly on the ground and imitates the movements
    of a snake.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Dogon Daji is glossed as "Tall one of the forest" and is associated in the
    passage with guinea-corn, guinea-corn beer, drunkenness, and gia as tsere.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Kworro na Daji is glossed as "Insect of the forest" and has a small chicken
    as tsere.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Ba-Dakia is said also to be a wife of Sa(r)rikin Raft and has a speckled hen
    as tsere.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Dandn is glossed as David, or Dan Sa, Son of a Bull, and is said to be the
    same as Dan Galladima.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Mai Ga(r)rin Danra is listed with an uncertain gloss, marked by a question
    mark.
  category: other
  evidence_refs:
  - ev:10
- id: obs:11
  text: Dogna is described as a double spirit, wife of Malam Alkaji, and acted by
    both sexes.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: Dogna's indoor form is known as the wearer of the white cloth; the dancer
    lies on one side and rocks while two people flap a cloth laid over him.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Dogna's outside form is known as the wearer of the black cloth; the dancer
    lies face down while one man sits on his head and grips his sides with his legs,
    and two men flap the cloth.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Sa(r)rikin Filani is glossed as "Filani Chief"; he goes around with a staff,
    counts imaginary herds of cattle, presents himself to Dan Galladima, and has a
    string of small cowries as tsere.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: Sa(r)rikin Fushi is glossed as "King of Wrath" and identified as a bee; he
    is said to be a younger brother of Babban Mazza, and his tsere is honey.
  category: relationship
  evidence_refs:
  - ev:15
