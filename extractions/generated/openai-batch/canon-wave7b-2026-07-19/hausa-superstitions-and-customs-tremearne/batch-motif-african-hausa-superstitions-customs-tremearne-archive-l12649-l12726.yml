canonical_text:
  quote: ''
  summary: 'The excerpt finishes a tale in which maidens seek entry to an unknown
    youth by naming themselves and then naming him. A maiden associated with bread-fruit
    fails, while the despised maiden associated with dadawam basso correctly names
    him Denkin Deridi and is chosen as his wife. Other maidens threaten her or offer
    domestic service. An editorial note compares the incident to a common tale pattern
    in which one maiden is kind to a beggar or supernatural being and succeeds while
    others are punished. A new tale begins: a disliked wife and her daughter are sent
    to live by a dunghill and eat boiled husks; the daughter asks her father to buy
    the Son of the King of Agaddez with five cowries, and after the father is beaten
    in the market for asking, the royal son sends word that he will come on Friday.'
  language: English
  quote_policy: summarized
