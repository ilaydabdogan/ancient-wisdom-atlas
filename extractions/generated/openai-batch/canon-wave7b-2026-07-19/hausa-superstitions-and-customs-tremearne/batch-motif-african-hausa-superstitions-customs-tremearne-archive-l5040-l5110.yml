canonical_text:
  quote: ''
  summary: The passage concludes a miraculous-birth account in which a woman's partly
    undecayed body has produced and nursed a child; it then gives source commentary
    on related stories and describes Hausa childbirth customs, including postpartum
    washing, seclusion, eighth-day assembly, food distribution, head shaving, and
    naming.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One half of a woman's body is described as remaining fresh and undecayed from
    head to foot, allowing her baby to be born and weaned; as observers look on, the
    body dissolves into dust.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy is named Alfa dan Marinna and is said to have survived to old age
    at Katsena, where he was reportedly still living until recently in 1909.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator comments that two stories seem to be the same and that the events
    became more wonderful over the half-century after the first version was written
    in 1856.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator refers to another miraculous case in which a woman's cough becomes
    a child, and compares it with a case in which a horse's neighing carries away
    a man.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: When a woman is about seven months pregnant, a stock of firewood, about twenty
    loads, is collected in her house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: From delivery, or even before, the woman washes in warm water for about forty
    days.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The washing water is often mixed with an infusion of runhu leaves, and the
    woman sprinkles herself with a branch rather than putting her hands into the water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: If the collected wood is insufficient, the husband may have to obtain more.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: If the mother dies before delivery, no attempt is made to save the child.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After birth, the mother remains inside her hut for one week while female friends
    visit and congratulate her.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: On the eighth day, Malams and relatives assemble; kola-nuts are distributed,
    a special dish is prepared, and sometimes a ram or bull is killed and eaten.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Midwives receive the head, legs, and skin of the slaughtered animal, while
    the officiating Malam receives the saddle.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: 'After the child''s head is shaved, two names are given: one whispered into
    the child''s ear and one announced to the company.'
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: A footnote reports Westermarck's suggestion that avoiding hand contact with
    the water is connected with uncleanness and that forty-day washing is an Arab
    custom.
  category: other
  evidence_refs:
  - ev:8
- id: obs:15
  text: 'The figure captions describe two boots: a long riding-boot and a red leather
    boot with black patterning and an untanned sole.'
  category: object
  evidence_refs:
  - ev:9
