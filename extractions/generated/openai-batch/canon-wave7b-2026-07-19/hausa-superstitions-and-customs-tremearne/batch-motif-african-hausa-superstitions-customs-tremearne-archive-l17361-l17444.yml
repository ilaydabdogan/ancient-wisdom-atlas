  summary: Auta's Sunday meat for the Snake is missing because the Frog has taken
    it. The Snake asks permission to seize the thief, hides by Auta's door, and bites
    Auta and then the Frog; both die. The narrator states that the Frog caused Auta's
    disaster by taking the meat. The passage then gives a brief variant and editorial
    comparisons with Malay Peninsula and Sierra Leone tales.
