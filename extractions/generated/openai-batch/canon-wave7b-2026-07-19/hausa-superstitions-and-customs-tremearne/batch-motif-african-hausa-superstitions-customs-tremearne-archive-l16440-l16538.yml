  quote: ''
  summary: A caption identifies brass trumpets, then the tale excerpt continues a
    cumulative debt-transfer sequence. Spider is named as buyer of the Old Woman's
    bull for ten large basins and ten large plates. The obligation is successively
    placed on Slipperiness, White-Ant, Bird, and Boy after each becomes linked to
    the preceding figure. Each new debt-bearer agrees. At the end, the Boy goes home
    and is beaten by his Mother, beginning another link in the chain.
