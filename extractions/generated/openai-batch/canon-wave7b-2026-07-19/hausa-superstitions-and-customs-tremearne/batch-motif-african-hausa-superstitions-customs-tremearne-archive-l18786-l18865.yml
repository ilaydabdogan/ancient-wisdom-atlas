canonical_text:
  quote: ''
  summary: A maiden refuses offers from a speaking river and self-cooking fowls, reaches
    the River Bagajun, observes a many-mouthed woman identified as a witch, serves
    her, receives a lidded basket from inside the witch's opened back, follows instructions
    about when not to break it, and obtains riches. A rival wife, angered by the maiden's
    new possessions, sends her own daughter to repeat the journey; that daughter consumes
    offered sour milk, honey, and a fowl before arriving at River Bagajun.
  language: English
  quote_policy: summarized
