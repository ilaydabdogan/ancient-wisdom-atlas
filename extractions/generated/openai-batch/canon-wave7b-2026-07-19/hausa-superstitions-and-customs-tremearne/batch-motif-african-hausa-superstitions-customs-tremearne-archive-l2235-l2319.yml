canonical_text:
  quote: ''
  summary: 'The passage comments on Hausa stories that resemble parables or cumulative
    English and Jewish songs, then describes oral performance style: animal speeches
    are sung or intoned to imitate animal sounds. It summarizes episodes involving
    a daughter metaphorically called a farm, a wild-cat luring a rooster, a lion changing
    its fear formula after conquest by man, and call-and-response animal recitations
    involving a hyaena, puppies, and big dogs.'
  language: English
  quote_policy: summarized
