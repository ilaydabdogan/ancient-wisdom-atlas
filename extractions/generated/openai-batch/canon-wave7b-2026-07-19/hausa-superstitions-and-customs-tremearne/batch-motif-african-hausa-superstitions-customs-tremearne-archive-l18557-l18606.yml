canonical_text:
  quote: ''
  summary: In the tale segment, a youth discovers that one of three women has a horse-like
    hoof and concludes that the women are devils. He privately sends his two younger
    companions home one after another with warnings not to return. Left alone with
    the three female demons, he rolls up his clothing, runs away, and is pursued.
    At the fence of his house they catch his foot, but he tells them they have seized
    a post; they release it, and he escapes inside. A closing note compares the story
    with No. 10 and its ending with a variant of No. 23.
