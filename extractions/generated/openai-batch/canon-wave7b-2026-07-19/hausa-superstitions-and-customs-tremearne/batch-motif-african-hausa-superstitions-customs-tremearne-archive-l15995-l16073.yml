canonical_text:
  quote: ''
  summary: The passage includes the end of a tale in which Spider cooks and eats two
    fighting figures, an editorial comparison involving Dog, Salt, Cake, and Hyaena,
    and the tale of a beautiful girl lured by jealous friends to Dodo's well. Dodo
    pulls her out, makes her choose between being eaten and marriage, marries her,
    hunts humans, and fathers a half-Dodo, half-Man child. The girl silences a bell
    tied to the child, escapes home, kills the child, and destroys Dodo's belongings.
    A summarized variant has a brother rescue her and Dodo diverted when the child
    is thrown into a river.
  language: English
  quote_policy: summarized
