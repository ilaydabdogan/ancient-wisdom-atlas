canonical_text:
  quote: ''
  summary: 'The excerpt first gives a comparative note about Quat obtaining darkness
    from Night and teaching people sleep. It then begins the tale of the Mender of
    Men: maidens shelter from rain inside a hollow baobab, the Devil traps them and
    demands ornaments and cloth for release, one girl refuses and remains inside,
    her mother feeds her through a hole, and a Hyaena has a blacksmith alter his voice
    so he can imitate the mother, seize the girl, pull her out, and eat her.'
  language: English
  quote_policy: summarized
