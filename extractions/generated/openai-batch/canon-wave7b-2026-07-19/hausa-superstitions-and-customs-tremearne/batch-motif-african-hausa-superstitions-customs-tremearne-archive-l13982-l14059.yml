canonical_text:
  quote: ''
  summary: A girl learns that she had a sister who was thrown into the river. She
    plants a small gourd and asks it to guide her to the sister. The gourd grows from
    the mosque washing place to the river and to the sister's house. The girl follows
    it, jumps into the water, is rescued by her sister, and is later discovered in
    the house by the sister's husband, Dodo's Son. After five days she prepares to
    return home with two small lidded baskets.
