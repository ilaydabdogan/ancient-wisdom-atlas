literal_observations:
- id: obs:1
  text: No. 5 has yam ba(i)ki lines on each side of the mouth, unusual catherine-wheel
    cheek marks called dan taki, and abdominal patterns called yan chikki; both parents
    are from Kano.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: No. 7 has a long line down the forehead; the note says it seems to indicate
    Filani blood somewhere, although the bearer denied it, and that it is optional
    and less deeply cut than an Ijo mark in Southern Nigeria.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: No. 9 has kalango patterns outside the eyes; one was done early and badly,
    while the other shows the true form.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The wearer of No. 9 is described as probably a slave because a free man would
    have subbe.
  category: relationship
  evidence_refs:
  - ev:3
