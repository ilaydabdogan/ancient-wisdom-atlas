canonical_text:
  quote: ''
  summary: 'The passage first gives figure captions for grass objects. It then continues
    a tale in which a Father, after being told to cut a being down and divide her
    in two, cuts a Bitch in two during prayer; two young girls appear, and he uses
    them together with his own daughter to satisfy suitors. Later he visits the three
    daughters and recognizes his own child by her proper hospitality. A new tale begins:
    Dodo''s Wife, married to a forest-emergent Dodo and seeking a human victim, brings
    a lidded basket to a dye-pit and promises herself to whoever can knock it over.
    Men and Great Men fail, leaving a Small Boy to try with a piece of gravel.'
  language: English
  quote_policy: summarized
