  quote: ''
  summary: The passage contains a note about a snake transformed into gold in a hostile
    house-setting, then gives the tale of a Frog living with a Fowl. The Frog repeatedly
    refuses to gather wood, leaving the Fowl to work. A Hawk seizes the Frog and carries
    him away. A variant has the Frog refuse hut-building during a tornado, seek shelter
    from the Fowl, annoy her, and then be seized by a Hawk after climbing to the roof.
    A further comparative note cites a Kenyah Monkey-and-Frog tale used to illustrate
    dilatoriness, ending with an explanation of frog behavior in rain and sunshine.
  language: English
