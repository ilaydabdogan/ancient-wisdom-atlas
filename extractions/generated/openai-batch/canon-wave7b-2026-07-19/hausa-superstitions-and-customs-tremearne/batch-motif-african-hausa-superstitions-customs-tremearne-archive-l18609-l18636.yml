canonical_text:
  quote: ''
  summary: A woman secretly has nine mouths. She takes locust tree leaves from where
    a witch is gathering herbs, boils them into broth, and distributes the food to
    her husband, his parents, and a rival wife. The food warns those who uncover it
    to cover it or die. The husband gathers portions of the food and throws them on
    the woman’s head, making her nine mouths visible. She attacks the people and becomes
    a full witch; the town is emptied except for a blind man and a lame man.
  language: English
