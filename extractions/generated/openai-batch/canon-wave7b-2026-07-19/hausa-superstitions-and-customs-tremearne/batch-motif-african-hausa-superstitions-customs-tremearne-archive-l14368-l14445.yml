canonical_text:
  quote: ''
  summary: A woman follows instructions from a grunting Head interpreted by a Dog,
    drinks writing dissolved in water, and gives birth to a son with the aid of old
    women. After a forty-day stay she is given gifts and blessings and returns toward
    the palace. At a river, the Chief Wife steals the male child and leaves her daughter
    behind, then claims the honor promised for a son. Later the boy, named Mohammadu,
    dies in the forest, but Wise Men state that the corpse is speaking and should
    not be buried.
  language: English
  quote_policy: summarized
