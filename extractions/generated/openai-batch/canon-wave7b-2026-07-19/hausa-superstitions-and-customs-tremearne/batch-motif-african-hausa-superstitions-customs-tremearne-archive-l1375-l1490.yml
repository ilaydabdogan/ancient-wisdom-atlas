canonical_text:
  quote: "“the popular memory may persist long after the proper explanation has disappeared”"
  summary: 'The author discusses difficulties in collecting Hausa tales: narrators
    may preserve phrases whose meanings are no longer understood, paid storytellers
    may omit or add material, tale narration may leave characters or actions implicit,
    and the editor marks supplied information in square brackets. The passage also
    captions two antimony-bottle illustrations, describes the posture and minimal
    gestures of Hausa tale-tellers, and lists scholarly authorities consulted.'
  language: English
  quote_policy: quoted
