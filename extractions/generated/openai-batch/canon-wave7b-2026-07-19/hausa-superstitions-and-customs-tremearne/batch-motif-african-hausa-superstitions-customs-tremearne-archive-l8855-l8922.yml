canonical_text:
  quote: ''
  summary: A king summons the man named There-is-no-King-but-God. Before going, the
    man asks his wife for an entrusted object, and she says a mouse must have taken
    it. At court the king demands the object, with guards ready to impale the man
    if he cannot return it. The man produces a horn containing the king's rings. The
    king acknowledges the saying, the councillors salute the man, and the king gives
    him half the city to rule. Variant notes describe stolen rings thrown into water
    and swallowed by a fish that the protagonist buys or catches. Editorial notes
    compare the tale with Polycrates and many other regional versions.
  language: English
  quote_policy: summarized
