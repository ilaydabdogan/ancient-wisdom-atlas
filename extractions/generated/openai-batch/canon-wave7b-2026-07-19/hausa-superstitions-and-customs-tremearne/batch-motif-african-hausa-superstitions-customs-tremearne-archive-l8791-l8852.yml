canonical_text:
  quote: "“There is no King but God.”"
  summary: A man repeatedly says that there is no king but God, angering the king.
    The king gives him two silver rings to keep and later has the man sent away. The
    man stores the rings in a ram’s horn with his wife. The king bribes the wife to
    hand over the horn, confirms the rings are inside, and orders the horn thrown
    into an undrying lake. A great fish swallows it. The man returns, goes fishing,
    catches the same fish, and his son finds the horn and the rings while cleaning
    it. The man repeats that truly there is no king but God.
  language: English
  quote_policy: quoted
