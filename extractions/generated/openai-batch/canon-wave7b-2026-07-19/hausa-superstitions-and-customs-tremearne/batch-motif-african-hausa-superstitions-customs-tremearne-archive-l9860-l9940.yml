canonical_text:
  quote: ''
  summary: The passage first concludes a tale in which a husband steals his father-in-law's
    ram, lies to his wife, is exposed by the wife's mother, and reproaches the wife
    for objecting only when the theft harms her own father. An editorial note compares
    a variant in L.T.H. 116. The passage then begins the tale of Dodo, a forest-dwelling
    eater of people who captures and marries a woman named Ambashira. Her sister plants
    a creeping gourd to guide her to Ambashira, visits Dodo's hut, is hidden from
    Dodo, and later returns so the sisters can flee. Ambashira leaves spit on the
    floor, which answers Dodo when he calls her, delaying discovery until he follows
    their footprints.
  language: English
  quote_policy: summarized
