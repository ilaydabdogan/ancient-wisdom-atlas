canonical_text:
  quote: ''
  summary: The king has a well filled with earth, entombing his son, and tells the
    maiden that her husband is dead. The wife refuses food. A date-stone in the son's
    hair grows into a tall tree through the well, and the son climbs it and remains
    in the tree. A slave of the wife, going for milk, sees him as a man like Dodo;
    he drops his ring into the milk and instructs that only his wife should help lower
    the calabash. The wife finds the ring, learns where he is, retrieves him with
    attendants, has him washed, shaved, and robed, and returns with him. He kills
    his father at a council, claims the city, and rules from the palace. The passage
    then notes Hausa variants and an Annamite tale said to have points of resemblance.
  language: English
  quote_policy: summarized
