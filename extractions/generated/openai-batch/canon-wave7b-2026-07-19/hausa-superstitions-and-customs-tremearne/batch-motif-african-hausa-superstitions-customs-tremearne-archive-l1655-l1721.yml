canonical_text:
  quote: ''
  summary: An introductory discussion says Hausa folklore is rich in tales and proverbs
    and that many Hausa stories resemble tales known elsewhere, with characters adapted
    to local settings. The passage lists parallels between Hausa tales and English,
    Indian, and biblical story materials, including Auta and Dodo, a magical creeper,
    a voice-changing hyaena, exclusive-fitting shoes, nocturnal clothing substitution,
    helpful animal pets, a white-ant and lion, and a spider feast tale.
  language: English
  quote_policy: summarized
