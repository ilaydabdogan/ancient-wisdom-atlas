canonical_text:
  quote: ''
  summary: 'A series of editorial notes explains objects, customs, variants, and beliefs
    connected with Hausa tales: a mosque water jug, ash used as salt, changing forms
    of iron ore, gendered water-fetching, compensation after injury to a girl, the
    dileb palm and a proverb about its shade, a variant with a crow dropping fruit
    from a tree, and a belief in illness caused by an animal inside the patient and
    treated by luring it out with thirst.'
  language: English
  quote_policy: summarized
