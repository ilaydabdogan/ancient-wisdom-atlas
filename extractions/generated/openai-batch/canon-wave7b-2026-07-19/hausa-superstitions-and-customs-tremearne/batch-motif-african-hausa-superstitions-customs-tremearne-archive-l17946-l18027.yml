canonical_text:
  quote: ''
  summary: A woman travelling to the city where people are mended encounters self-preparing
    meat and fura and eats them. At the city she presents bones of her child, who
    she says was eaten by a hyaena. She tends cattle selfishly by giving them green
    fruit and keeping ripe fruit for herself, after which the largest bull declares
    that she has a bad heart and that her daughter should be mended badly. The daughter
    is created with only one side of her body. On the return journey the mother repeatedly
    denies and tries to abandon the daughter, but the daughter follows her footprints
    through several hiding places and finally enters the mother's hut. The passage
    ends by contrasting the rival wife's hideous daughter with the other's beautiful
    daughter.
  language: English
  quote_policy: summarized
