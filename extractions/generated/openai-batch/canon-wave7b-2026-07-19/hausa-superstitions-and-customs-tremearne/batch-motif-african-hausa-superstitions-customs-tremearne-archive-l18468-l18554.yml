canonical_text:
  quote: ''
  summary: The passage closes a tale in which Awudu and the Devil wrestle without
    victory, rise to the sky, and become the continuing rumble of thunder. It then
    summarizes two variants involving a food-stealing dog, a being inside a tree,
    Dodo/Iblis, and hunters who defeat the adversary. The main following tale tells
    of an unloved daughter abandoned at a forest farm, where demons leave gifts for
    her; after she returns home, the beloved daughter is sent to the same place, goes
    out among the demons, and is eaten. A new tale begins with three youths who seek
    women and encounter female demons planning to kill them.
  language: English
  quote_policy: summarized
