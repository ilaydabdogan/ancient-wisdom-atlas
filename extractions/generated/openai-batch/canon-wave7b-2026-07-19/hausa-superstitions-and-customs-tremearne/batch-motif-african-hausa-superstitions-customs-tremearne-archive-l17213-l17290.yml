canonical_text:
  quote: ''
  summary: In this excerpt from “The Lucky Youngest Son,” the Boy completes an earlier
    task involving two fan-palm fruits. The King and the White Leper then try to obtain
    the Boy’s riches by assigning him a dry-season demand for millet. The Boy cries,
    and two birds obtain millet from distant places for him by daybreak. A Snake then
    proposes to enter the King’s beloved Daughter, make her illness impossible for
    ordinary magicians to cure, and provide the Boy with a cure that requires the
    White Leper’s liver mixed with water. The Snake enters the Daughter while she
    is playing, her belly swells, and magicians fail to heal her. The excerpt ends
    as the Rich Boy arrives before the King in ragged clothing.
  language: English
  quote_policy: summarized
