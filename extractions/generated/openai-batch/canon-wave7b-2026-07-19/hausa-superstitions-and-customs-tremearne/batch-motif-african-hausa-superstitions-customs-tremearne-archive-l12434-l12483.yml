  quote: THE SPIDER WHICH BOUGHT A DOG AS A SLAVE.
  summary: A Spider buys a Dog as a slave, tries to make him work on a farm, then
    discovers that the Dog hunts. The Spider takes the Dog's hoe to the Monkey smith
    to be made into arrow-heads, but when the Spider later brings the Dog to the Monkey,
    the Dog pursues and catches the Monkey. The supplied passage ends mid-speech as
    the Spider tells the Dog to let the Monkey go.
