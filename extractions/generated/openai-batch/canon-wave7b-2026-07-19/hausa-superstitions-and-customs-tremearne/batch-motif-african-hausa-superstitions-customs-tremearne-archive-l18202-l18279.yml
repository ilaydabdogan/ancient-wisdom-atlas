canonical_text:
  quote: ''
  summary: Auta pressures Barra by invoking instructions from Mother and Father, burns
    the household possessions and house, and is carried by Barra to another city and
    the king's palace. During harvest activity, Barra leaves Auta with the king's
    two little sons; Auta proposes a throwing game and kills both children. Barra
    flees with him, the king's people pursue, and a White-Breasted Crow carries them
    away, after which Auta wounds the crow. A summarized continuation says Auta took
    Dodo's tail and placed boots on Dodo's body; the boots later fit the boy at the
    Old Woman's house, and he produces Dodo's tail. The excerpt then begins another
    tale about the Zankallala and Dodo, called the Swallower-of-Men, who is chasing
    a boy on a river bank.
  language: English
  quote_policy: summarized
