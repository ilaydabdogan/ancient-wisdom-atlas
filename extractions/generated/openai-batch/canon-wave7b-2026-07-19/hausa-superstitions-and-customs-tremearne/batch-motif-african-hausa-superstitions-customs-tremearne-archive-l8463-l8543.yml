  evidence_refs:
  - ev:2
- id: obs:3
  text: Birds are said to have kirari, including addresses for the hen, turkey, a
    small house-bird called Chada, Suda, the eagle, and the White-Breasted Crow.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
- id: obs:4
  text: The small house-bird nests inside grass roofs of entrance-halls or unused
    huts where there is no smoke, and when held by the back of the neck it swings
    to and fro.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The holder sings to Chada that it should swing and that its mother will be
    given to it; the explanation given is that the bird is not to be afraid.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Suda is described as a small sparrow-like bird known for twittering and is
    addressed as full of news, telling it though not asked.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The eagle is described as a wise bird and is addressed as not settling on
