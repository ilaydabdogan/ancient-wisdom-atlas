  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: A belief is reported that the White-Breasted Crow rears chickens, and its
    kirari asks it to make another's offspring become its own.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The mud-fish or lung-fish is addressed as eating its own body because it lives
    in mud during dry weather and has no food.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Persons and bogies are also said to have proper titles; Dodo is often known
    as Mijjin Mazza, translated as Man of Men.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: A bachelor is said to dream of the grinding and pounding corn he will have
    to do the next day.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Old women are given insulting titles emphasizing thinness, bones, sharp speech,
