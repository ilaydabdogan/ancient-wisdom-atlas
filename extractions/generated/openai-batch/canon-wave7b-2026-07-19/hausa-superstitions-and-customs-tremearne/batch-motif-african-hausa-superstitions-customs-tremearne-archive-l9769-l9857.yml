canonical_text:
  quote: ''
  summary: The King of Good gathers tree leaves, uses medicine mixed with water to
    heal a blind king's son, is rewarded with deputy rule over half a city, and kills
    the King of Evil. Notes compare the tale to a Borlawa version and to wider motifs
    of overheard supernatural or plant speech disclosing remedies. A new tale begins
    in which a thief, urged by his wife under a bright full moon, steals his father-in-law's
    distinctive ram; the wife advises slaughtering it before the owner recognizes
    it, and later notices the hide resembles her father's ram.
  language: English
  quote_policy: summarized
