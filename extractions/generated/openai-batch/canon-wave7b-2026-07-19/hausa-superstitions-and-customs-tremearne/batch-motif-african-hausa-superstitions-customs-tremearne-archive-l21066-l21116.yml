canonical_text:
  quote: ''
  summary: 'Notes explain details associated with several tales: a contrast between
    frog and fowl habits, snake-bite treatment and snake avoidance, seasonal corn
    planting methods, the use of hoes in relation to war, tribute, and wedding gifts,
    animal workmen delaying like humans, and an added explanation for a web-dwelling
    figure without a house.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The frog is described as seldom seen in the heat of the sun and as apparently
    doing nothing to keep itself, while the fowl is described as always busy.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A cure for snake-bite is described as inoculation with poison obtained from
    another snake.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Canon Robinson is reported as saying that this snake-bite treatment is practiced
    in Hausaland and along the coast, and that there are 343 kinds of snakes in Hausaland.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hausas are described as rubbing onions on their feet to keep snakes away and
    drinking onion broth if bitten.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Onions are also said to be used against ticks and tsetse-flies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Corn is planted in April after the rainy season has begun; ground is cleared,
    hollows and ridges are made with hoes, millet is probably sown in furrows, and
    guinea-corn is planted in ridges.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Millet is said to ripen in three or four months, while guinea-corn is not
    ripe until after the beginning of the dry season in November and may reach nearly
    twenty feet.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hoes may be given as part of tribute or wedding gifts when peace rather than
    war is desired.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The note explicitly contrasts an unnamed proceeding with the saying about
    turning swords into ploughshares.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Animal workmen are said to be able to delay as well as their human mates.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: A later informant explained that an unnamed male figure has no house now and
    must live in a web.
  category: relationship
  evidence_refs:
