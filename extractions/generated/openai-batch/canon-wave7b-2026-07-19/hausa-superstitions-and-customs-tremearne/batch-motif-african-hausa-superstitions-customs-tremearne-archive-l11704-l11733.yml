  quote: THE GLUTTONS.
  summary: Bankammi and his wife Barrankamma are described as extraordinary eaters.
    Their reputation reaches the king, who summons them and has the citizens prepare
    large quantities of food. They eat all of it, drink a tank of water, and still
    say they are not satisfied.
