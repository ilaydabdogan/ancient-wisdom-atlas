  summary: The passage lists numbered examples of Hausa tribal marks and bodily cuts,
    noting their placement, named patterns, stated purposes, visual comparisons to
    other catalogued examples, and the origins of the wearers' parents. Some marks
    are associated with relief from stomachache, attracting women, Wangarawa identity,
    and a cut said to have been made during enslavement.
  language: English
  quote_policy: summarized
