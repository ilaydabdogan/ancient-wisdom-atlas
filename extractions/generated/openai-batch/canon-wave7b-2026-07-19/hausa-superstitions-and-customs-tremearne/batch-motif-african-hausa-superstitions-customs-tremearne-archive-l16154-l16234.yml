canonical_text:
  quote: ''
  summary: In “Dodo's Debt,” a pregnant woman is abandoned at a stream after another
    woman throws dust into her water pot and leaves. Dodo emerges from the water,
    helps her lift her load, and secures her agreement that a male child will be his
    friend and a female child his wife. The child is a girl. A rival wife informs
    Dodo of the birth and later of the girl's wedding. Dodo comes to the wedding demanding
    payment of the debt. The bride, directed by her father, gives him a horse, cattle,
    guests, food, and finally her father; Dodo swallows them and continues demanding
    payment. The bride appeals to God; a knife descends from above, Dodo tries to
    swallow it, and it cuts him open and kills him. The swallowed people and animals
    reappear, and the bride is veiled and taken to her husband.
  language: English
  quote_policy: summarized
