canonical_text:
  quote: a certain demon or jinn stole King (Prophet) Solomon's ring
  summary: 'A note reports a legend about the origin of the Asbenawa: a demon or jinn
    stole Solomon''s ring, used it to enter the women''s apartments, caused one hundred
    of Solomon''s wives to conceive, and the king expelled the women into the wilderness,
    where they gave birth to the Asbenawa. Other notes discuss cowries as possible
    sexual invitation or marriage preliminary, beating as unexplained or possibly
    aphrodisiac, trousers as currency, and a comparison about medicinal use of animal
    substances.'
  language: English
  quote_policy: quoted
