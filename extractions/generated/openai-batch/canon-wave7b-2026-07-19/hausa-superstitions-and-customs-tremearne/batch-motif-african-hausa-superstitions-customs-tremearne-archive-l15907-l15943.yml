canonical_text:
  quote: ''
  summary: A frightened female figure takes something up again and rejoins the others
    without revealing what happened. The group reaches a place they intend to make
    habitable and asks Hyaena for oil, but she refuses because she fears the Boy.
    Elephant angrily opens the jar, the Boy strikes her and springs out, and the animals
    flee, leaving their belongings. The Boy returns to town and tells the People,
    who collect the abandoned loads for his Mother. The passage adds that he leaves
    the clay pot and never lives in it again, then gives comparative notes about a
    Sierra Leone story involving a girl, animals, fire, a mother’s spell, and a snail,
    and about Agastya being produced from a jar.
  language: English
  quote_policy: summarized
