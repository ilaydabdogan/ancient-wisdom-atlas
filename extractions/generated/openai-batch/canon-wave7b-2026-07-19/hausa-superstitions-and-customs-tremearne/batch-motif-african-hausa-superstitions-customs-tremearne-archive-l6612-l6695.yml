canonical_text:
  quote: ''
  summary: The passage recounts the story of Ataru, who travels to find where the
    sun rises, receives directions from Stork-Men, passes strange places and metallic
    rivers, reaches the fufunda bird, and is scorched by the rising sun. It then describes
    the fufunda as King of the Birds, with one unhatched egg and a last-day shadow
    for the good. The passage also briefly describes Gunya the omen-giving horse,
    Zankallala with animal weapons and attendants, and the kiviyafa that performs
    farm work under exact verbal command.
  language: English
  quote_policy: summarized
