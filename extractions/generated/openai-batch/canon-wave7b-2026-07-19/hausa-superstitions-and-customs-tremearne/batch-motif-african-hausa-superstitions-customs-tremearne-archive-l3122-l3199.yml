canonical_text:
  quote: ''
  summary: 'The passage gives examples of disputed ownership and debt avoidance: a
    chief identifies a bull''s true owner by his lack of appetite; a false deaf-mute
    claimant is exposed when he speaks; debtors evade repayment through cunning spider-like
    tricks, animal substitutions, escape routes, a jerboa messenger deception, or
    aid from a child, animals, or God. It then shifts to comments on indolence and
    on fables in which wrong may triumph and good deeds may be repaid by evil.'
  language: English
  quote_policy: summarized
