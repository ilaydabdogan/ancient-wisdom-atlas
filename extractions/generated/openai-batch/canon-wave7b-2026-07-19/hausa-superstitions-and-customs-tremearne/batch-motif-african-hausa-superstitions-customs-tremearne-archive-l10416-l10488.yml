canonical_text:
  quote: ''
  summary: The passage contains the ending of “The Wise Slave,” in which You-are-wiser-than-the-King
    intoxicates the King’s Son, exchanges clothing and mounts with him, and survives
    an ambush meant for himself. He then confronts the King and escapes through a
    sequence of transformations ending in an etiological explanation of the pupil
    and eyebrow. The passage then begins “The Cock by His Wit Saves His Skin,” in
    which a Cock avoids a Wild-Cat’s threat by saying he lives with the Dog; a brief
    variant note gives an alternate reply.
  language: English
  quote_policy: summarized
