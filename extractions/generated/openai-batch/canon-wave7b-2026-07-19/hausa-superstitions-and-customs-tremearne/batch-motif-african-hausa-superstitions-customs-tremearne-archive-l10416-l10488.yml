- id: obs:1
  text: You-are-wiser-than-the-King sends a Man ahead with ten gourds of pito and
    ten gourds of pure water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When he asks for a drink of water, You-are-wiser-than-the-King gives beer
    to the King’s Son while he himself drinks water; after further drinking the King’s
    Son collapses.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: You-are-wiser-than-the-King gives the King’s Son his blue-striped clothes,
