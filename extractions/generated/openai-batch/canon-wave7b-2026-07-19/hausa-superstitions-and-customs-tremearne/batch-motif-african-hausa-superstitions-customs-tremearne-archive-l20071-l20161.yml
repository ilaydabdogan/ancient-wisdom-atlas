    note compares speaking blood with European and Grimm tales. Figure captions describe
    imported Dane-guns with cowrie charms. Subsequent notes discuss punishments in
    Hausa tale contexts, a story of an old woman whose hand sticks to a corpse after
    a slanderous remark, and sacred-day work taboos and sacrifice.
