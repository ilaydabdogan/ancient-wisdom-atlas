canonical_text:
  quote: one had given birth to a Mouse, and the other to a Cake.
  summary: A man’s two wives bear unusual offspring, a Mouse and a Cake. The two offspring
    are sent into the forest, where a dispute over fruit leads the Mouse first to
    nibble and then to eat the Cake. The Cake’s mother later kills and cooks the Mouse,
    serves part of him to the Mouse’s mother, and the two mothers wrestle toward the
    river.
