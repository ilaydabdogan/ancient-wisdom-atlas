canonical_text:
  quote: ''
  summary: 'Fragment of a Hausa tale: Awudu goes out into the world to test his strength
    and is joined by Hambari, Dashira, and Tankoko. Hambari demonstrates strength
    by dividing river water with his hand. The four sleep at the foot of a monkey-bread
    tree in the forest. A Devil dwelling in the foot of the tree emerges on successive
    days, challenges the guards Hambari, Dashira, and Tankoko to wrestle, throws them,
    and binds them. Awudu then remains to face the Devil, who says he alone is equal
    to all four. The provided passage breaks off during the Devil''s speech and is
    followed by an unrelated-looking plate caption about a war dance.'
  language: English
  quote_policy: summarized
