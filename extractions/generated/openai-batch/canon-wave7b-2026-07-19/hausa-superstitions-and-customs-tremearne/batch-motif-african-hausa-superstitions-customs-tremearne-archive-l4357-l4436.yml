canonical_text:
  quote: ''
  summary: 'The passage surveys Hausa courtship lore and related customs: bride-winning
    ordeals, a spider succeeding by trick, a rogue-camel test, a magic-basket test,
    a story of a girl deceived by a snake or Dodo disguised as a faultless youth and
    rescued by her younger sister, comparative footnotes on Cunnie Rabbit and a Sierra
    Leone Half-Devil tale, and discussion of parental consent, bride-price, guardians
    called suruku, and a partially preserved story involving a suitor hidden in a
    pot.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In one courtship story, a suitor must clear filth away without spitting or
    drinking; after the men fail, the spider succeeds by a trick.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator states that avoiding imposed conditions is not disgraceful if
    the person is not found out, and comments that cunning often succeeds more than
    bravery.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:3
  text: In another story, the courtship test is to ride a rogue camel; all suitors
    fall except the one already chosen by the maiden.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Another bride-winning test, especially in stories involving witches, requires
    a man to throw a stone so that it opens a magic basket.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A girl who demands a husband free from bodily blemish marries a snake, or
    in a variant a Dodo, which has changed itself into a faultless youth to deceive
    her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The deceived girl is saved by her younger sister and afterwards swears that
    she will not again choose for herself.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A footnote compares a Cunnie Rabbit story in which the spider must get a lion's
    teeth, extract palm-wine from a poisonous sasswood tree, and capture a live boa
    constrictor; the narrator says this shows the task was a test.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A second footnote summarizes a Sierra Leone story in which a girl is deceived
    by a Half-Devil who borrows half a body to look like a man; she is saved by her
    brother and returns ready to heed advice about choosing a husband.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says the mother's consent was necessary, bargaining was done with
    the father, and a father might take bride-price from several suitors at the same
    time.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: If parents, uncles, or aunts are dead, elder siblings, protectors, or hosts
    may arrange the marriage and are called suruku because they act as parents.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says that in earlier times a girl could be promised before puberty
    and that her consent is now usually sought because objection to the husband may
    lead to unfaithfulness, not because of concern for her happiness.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: At the end of the passage, a story begins in which a girl sought by four youths
    tells one youth to hide in a pot and says she will run off with him.
  category: sequence
  evidence_refs:
  - ev:9
