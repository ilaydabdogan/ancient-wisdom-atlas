  source_text_path: texts/public-domain/hausa/project-gutenberg/hausa-superstitions-and-customs-tremearne.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: lines 23398-23405; items (28)-(29)
  quote_or_summary: Ba-Gobiri, a man of Gobir, has a weapon as tsere because the Gobirawa
    are renowned warriors; Mayannen Gobir has a pair of irons as tsere.
  source_text_path: texts/public-domain/hausa/project-gutenberg/hausa-superstitions-and-customs-tremearne.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: lines 23406-23412; item (30)
  quote_or_summary: Ba Gu(d)du is glossed as not running or brave; the tsere is a
    white kola-nut and woman's white headkerchief, with white described as the color
    of death, which the spirit does not fear.
  source_text_path: texts/public-domain/hausa/project-gutenberg/hausa-superstitions-and-customs-tremearne.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 23413-23419; item (31)
  quote_or_summary: Gwari is described as a Gwari pagan; the dancer wanders stooping,
    leans on a staff, and carries rubbish in a bag or bowl on the back.
  source_text_path: texts/public-domain/hausa/project-gutenberg/hausa-superstitions-and-customs-tremearne.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 23420-23431; items (32)-(34)
  quote_or_summary: Mai Gworje is glossed as he with the bell and has a small stick
    as tsere; Ibrahima has a white-bellied kid as tsere; Inna is stuttering and the
    actor pretends speech impediment.
  source_text_path: texts/public-domain/hausa/project-gutenberg/hausa-superstitions-and-customs-tremearne.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 23432-23448; item (35)
  quote_or_summary: Janjare or Janzirri is linked tentatively with a hog term and
    with Nakada; the possessed person may wear only a monkey-skin, rush about with
    filth, be cured by onion or tomato in the mouth, prance with a stick as hobby-horse,
    simulate copulation, fall, and sneeze; tsere is monkey-skin and bell.
  source_text_path: texts/public-domain/hausa/project-gutenberg/hausa-superstitions-and-customs-tremearne.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 23449-23459; items (36)-(37)
  quote_or_summary: Kaikai is itch, enacted by continual scratching; Kindi is a female
    spirit said to raise the magic hoe and has a small hoe as tsere.
  source_text_path: texts/public-domain/hausa/project-gutenberg/hausa-superstitions-and-customs-tremearne.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 23460-23482; items (38)-(41)
  quote_or_summary: Kavra circles, stamps the right foot, and falls backward, with
    yellow cloth or marked sheep as tsere; Rare is hyaena or possibly god, performed
    on all fours with growling and goat-seeking, and has meat as tsere; Kunu is deafness;
    Kitira is leper, acted by begging, distorted or hidden limbs, faces, noises, and
    imaginary sores.
  source_text_path: texts/public-domain/hausa/project-gutenberg/hausa-superstitions-and-customs-tremearne.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 23483-23501; items (42)-(44)
  quote_or_summary: Kyeinbo has a large bead as tsere; Lambu carries miniature bow
    and arrows, sometimes a Burutu bird skin head-dress, and acts out hunting; Madambache
    is the boxer, pretends to box, and has boxer equipment as tsere.
  source_text_path: texts/public-domain/hausa/project-gutenberg/hausa-superstitions-and-customs-tremearne.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 23502-23519; item (45)
  quote_or_summary: Be Magnje wears loincloth, quiver, and bag with tobacco and flint
    and steel, carries axe and bow, smokes a long pipe, lights it from flint, calls
    for beer using two pagan names, drinks greedily, relights the pipe, and leaves.
  source_text_path: texts/public-domain/hausa/project-gutenberg/hausa-superstitions-and-customs-tremearne.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 23520-23527; item (46)
  quote_or_summary: Masaki, the weaver, wears a woman's cloth, passes grass from hand
    to hand as if throwing a shuttle, rubs it along the thigh like cotton, covers
    the head, and sneezes.
  source_text_path: texts/public-domain/hausa/project-gutenberg/hausa-superstitions-and-customs-tremearne.md
