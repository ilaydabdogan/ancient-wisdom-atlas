canonical_text:
  quote: ''
  summary: The passage lists Bori spirits or personae, their dance or possession behaviors,
    and associated tsere objects. It includes a judicial prince-like figure, an equerry,
    warriors, ethnic or occupational types, affliction personae, animal-like enactments,
    and several ritual tokens such as milk, weapons, cloth, a kid, monkey-skin, bell,
    hoe, meat, bead, bow and arrows, and boxer or hunter equipment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prince-like figure covered by a large cloth sits after walking slowly with
    head bent; people approach and salute him, and his acceptance or rejection of
    lower court decisions is shown by remaining seated or by jumping up and falling
    down three times before deciding.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The prince-like figure''s tsere is described as full princely attire: blue
    robe and trousers, white turban, shoes, and scent.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Zeggin Dan Galladima precedes Dan Galladima, helps him sit, and fans him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Several entries define tsere objects for specific personae, including fresh
    milk, a weapon, a pair of irons, a white kola-nut and woman's white headkerchief,
    a small stick, a white-bellied kid, a monkey-skin and bell, a small hoe, yellow
    cloth or marked sheep, meat, a large bead, and specialized equipment.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  - ev:11
- id: obs:5
  text: Garaje stamps about four steps at a time, holds the head high, then crosses
    the feet and falls backward.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ba-Gobiri is glossed as a man of Gobir, and the passage connects his weapon
    tsere with the Gobirawa's reputation as warriors.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ba Gu(d)du is glossed as 'not running' or a brave man; the passage says white
    is the colour of death, which this spirit does not fear.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Gwari is performed by wandering stooped, leaning on a staff, and carrying
    rubbish in a bag or bowl on the back.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Inna is enacted by pretending to have an impediment in speech.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Janjare or Janzirri may rush about nearly naked except for a monkey-skin,
    devour or rub the body with filth, and is said to be cured by pushing an onion
    or tomato into the mouth; other actions include hobby-horse prancing, simulated
    copulation, falling, and pretending to sneeze.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Kaikai is enacted by continual scratching, Kunu by pretending not to hear,
    and Kitira by imitating a leprous beggar or distorted limbs.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: Kindi is identified as a female spirit said to be responsible for raising
    the magic hoe; her tsere is a small hoe.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Rare is enacted on all fours with growling and jaw-champing, as if looking
    for goats; sometimes another person holds a girdle around the dancer's waist while
    the dancer pretends to escape.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Lambu is performed with a miniature bow and arrows and sometimes a Burutu
    bird skin headdress, enacting sighting, stalking, and killing game.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: Be Magnje is performed with hunting or pagan-associated gear, including loincloth,
    quiver, bag, flint and steel, axe, bow, pipe, and beer; the actor lights the pipe,
    calls for beer, drinks greedily, relights the pipe, and moves off.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: Masaki, the weaver, is enacted by wearing a woman's cloth, moving grass as
    if throwing a shuttle, rubbing it like cotton, covering the head, and sneezing.
  category: action
  evidence_refs:
  - ev:13
