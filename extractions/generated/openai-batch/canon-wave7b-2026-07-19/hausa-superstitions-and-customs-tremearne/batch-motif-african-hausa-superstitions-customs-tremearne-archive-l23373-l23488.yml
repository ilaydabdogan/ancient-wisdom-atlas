- id: motif:3
  label: Animal persona enacted by human dancer
  taxonomy_refs:
  - shapeshifter
  basis: Rare is glossed as hyaena and performed on all fours with growling and goat-seeking,
    while Janjare/Janzirri is linked to hog terminology and monkey-skin.
  evidence_refs:
  - ev:8
  - ev:10
  confidence: low
  cautions: The passage describes imitation or possession behavior, not literal transformation;
