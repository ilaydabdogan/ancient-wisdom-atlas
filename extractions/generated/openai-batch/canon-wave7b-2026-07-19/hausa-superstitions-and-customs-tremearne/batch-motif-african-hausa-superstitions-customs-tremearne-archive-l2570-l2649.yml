canonical_text:
  quote: ''
  summary: The passage summarizes Hausa animal-tale characterizations of the dog,
    hyaena, goat, and sheep. The dog is described as despised, impure, and frequently
    endangered by the hyaena. The hyaena is described as a foolish, thieving, vain
    animal deceived by many others, but also as having reported magical qualities
    and multiple names. A short tale explains the hyaena using several names to claim
    most portions of a carcass. Goats and sheep are described as clever animals with
    sacrificial value.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The dog is described as despised; the price of a dog was not accepted as an
    offering to God, and Mohammedans regard the animal as impure.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dog is frequently in difficulties with the hyaena, must be clever to escape
    danger, once tricks the hyaena with a plan devised by the goat, and is no match
    for the jackal.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The hyaena is called the buffoon of the animal world and is said to be deceived
    by the goat, jerboa, ostrich, jackal, scorpion, lizard, dog, donkey, and man,
    though it sometimes avenges itself on the donkey and man.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hyaena is described as a noted thief with a bad name, as vain and overcome
    by flattery, and as fond of dancing and music; one referenced tale says it returns
    a child to its mother because the mother taught it a song.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The hyaena is said to have some power of appearing and disappearing, though
    the author states this is not shown in the tales; it is also sometimes called
    aratna or Amina, explained either as 'friend,' as a familiar-like animal, or simply
    as one of its names.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:9
- id: obs:6
  text: In the carcass story, the hyaena finds a carcass with other animals, appoints
    itself divider, and assigns portions to Amina, Burungu, and Maibi derri before
    leaving the remainder to the others.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Goats and sheep are not considered foolish in Hausaland; the goat can outwit
    the lion and the hyaena, while the sheep can defeat the hyaena and may kill men.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that sheep and goats are sometimes confused in tales and
    by newcomers, but are distinct animals in reality; it also notes varieties of
    sheep, including a valuable large kind from Bornu.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that rams are killed by Mohammedans and that sheep and
    goats had sacrificial value even in earlier times.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Footnotes compare a Greek unlucky black-dog belief, an English black-dog saying,
