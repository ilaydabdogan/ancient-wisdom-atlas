canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a mother undertakes a fire ordeal,
    the fire becomes a golden house, the father is changed into a jerboa, and the
    revived son kills the jerboa so that he may live with his mother. A cited variant
    has a girl pass through fire, water, a hollow tree, and dangerous creatures to
    restore a boy to life. The next tale begins with a forgotten pregnant she-goat
    giving birth to a powerful ram; Spider reports the she-goat to the king, men seize
    her, and the ram hears her cry from afar.
  language: English
  quote_policy: summarized
