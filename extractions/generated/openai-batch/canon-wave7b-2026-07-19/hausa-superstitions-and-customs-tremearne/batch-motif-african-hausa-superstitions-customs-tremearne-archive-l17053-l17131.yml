canonical_text:
  quote: ''
  summary: Auta gives a knife to a weaver and receives white cloth as payment. He
    then gives the cloth to people preparing a dead maiden for burial and receives
    the corpse as payment. Near a city gate river, he sets the corpse upright, presents
    it as his wife, and accuses the King's wives of killing her after one strikes
    the corpse and it falls. The King settles by giving Auta two wives. Auta leaves
    for the forest, rejects the wives, builds a house, and is joined by several animals
    and birds.
  language: English
  quote_policy: summarized
