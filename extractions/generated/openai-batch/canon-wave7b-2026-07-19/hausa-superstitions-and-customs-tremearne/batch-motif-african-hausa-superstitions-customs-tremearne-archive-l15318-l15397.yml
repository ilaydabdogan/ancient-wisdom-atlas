canonical_text:
  quote: ''
  summary: In the tale of the fighting ram, the Ram repeatedly rescues his Mother,
    the She-Goat, when the Spider directs the King’s men and horsemen to seize her.
    The She-Goat calls to the Son of Zaberrima, and the Ram hears from far away, boasts
    of victories with his horns, and kills the attackers. A certain Man then buys
    three Cats and uses them as distractions by throwing them into the Wind, which
    carries them to the Ram. While the Ram stops to eat the Cats, the Men bring the
    She-Goat to the King. The Ram follows her tracks to the palace, breaks in, is
    shot with arrows, dies, and his Mother is killed. A variant note says the Hare
    is the villain, the Mother is a Sheep, and the Ram has bird servants aided by
    wind.
  language: English
  quote_policy: summarized
