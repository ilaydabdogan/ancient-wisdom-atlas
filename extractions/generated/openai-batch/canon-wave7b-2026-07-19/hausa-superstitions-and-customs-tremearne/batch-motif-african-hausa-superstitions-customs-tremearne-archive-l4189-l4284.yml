canonical_text:
  quote: ''
  summary: The passage presents didactic religious poetry warning that death may come
    at any time, advising repentance, abandonment of falsehood and drink, and preparation
    for the next world. It contrasts wise and foolish attitudes toward the world,
    gives a funeral and grave sequence in which the dead person is buried, left behind,
    and forgotten while goods are divided among children, and then introduces a metrical
    Hausa war-song by Abdallah son of Fodio commemorating Othman's defeat of Yunfa,
    King of Gobir.
  language: English with Hausa verse excerpts
  quote_policy: summarized
