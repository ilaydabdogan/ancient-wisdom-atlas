canonical_text:
  quote: ''
  summary: 'The passage discusses Hausa and nearby Nigerian tribal marks: visual similarities
    across tribes, use of marks for identification and occupational inference, alteration
    or addition of cuts as charms, ornaments, or therapeutic marks, disruptions caused
    by enslavement and smallpox, named types of marks and facial paint, reported puberty-related
    spots, and bodily effects attributed to carrying heavy loads.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several tribes, even when otherwise widely divergent, may have similar tribal-mark
    designs, and the author says these markings had not been systematized in Nigeria.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that tribal marks often indicate a man's special qualifications
    as well as his tribe.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Specific examples connect visible cuts with groups and expected skills: Nupe
    or Kakanda river-dwellers with paddling and swimming, Cow-Filani with cattle management,
    Kano natives with possible leather or brass work, and other regional examples
    with transport or mat-making.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some people may try to obliterate their marks, while others add special marks
    for good luck, ornament, or relief or prevention of pain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Young enslaved people may be given the tribal markings of a master, and smallpox
    may damage mark designs; the passage says marks are usually useful for identification
    but not absolutely reliable.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage lists Hausa terms and forms for marks, including zani, akanza,
    keskestu, kaffo, and zubbe.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Women paint facial lines called katambirri at feasts and special visits, but
    the author doubts that strictly defined designs exist for them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Light-colored spots on the chest and back called kasbi are said to appear
    just before puberty and to be a sign of a lustful nature.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: A flat top of the head and wrinkles around the forehead or head are attributed
    to carrying loads in childhood, including children carrying pots of water.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Carriers told the author that carrying too heavy a load for too long causes
    sickness and death; the author reports inquests, observed cases of wasting, and
    government steps to prevent overloading.
  category: speech
  evidence_refs:
  - ev:8
