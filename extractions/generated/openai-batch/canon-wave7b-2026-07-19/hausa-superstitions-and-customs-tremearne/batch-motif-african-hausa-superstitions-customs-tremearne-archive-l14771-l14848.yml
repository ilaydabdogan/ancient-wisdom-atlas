canonical_text:
  quote: ''
  summary: A youth has a charm identified as Eagle's feathers that can restore dead
    people to life. A King's Slave induces the youth's wife to obtain the feathers
    and give them to him. The Slave uses the feathers to revive a dead man, receives
    the youth as his slave, takes the wife, and forces the youth to work in the forest.
    The Eagle then aids the youth by recruiting a Cat and Mouse to search the Slave's
    house for the feathers; the Mouse locates where they are hidden as the passage
    ends.
  language: English
  quote_policy: summarized
