  summary: 'The passage gives examples of Hausa names or forms of address constructed
    as translated sayings, questions, and invocations: giving thanks, identifying
    God as giver of joy, valuing one who has a mother, explaining shortened phrases
    about obtaining through God, and asking God to enrich a chief so others may benefit.
    Two figure captions describe gourds, one used by travellers and another decorated
    with a purple-stained relief pattern.'
