  summary: A childless old woman receives a boy as an adopted son on condition that
    she never utter his name, Owner-of-the-World. Another old woman persuades her
    to reveal the name and then calls the boy by it. The boy rebukes his adoptive
    mother, sings farewell, sinks into the earth with his horse, and disappears. The
    old woman is left alone and dies in ashes.
