canonical_text:
  quote: ''
  summary: 'The passage closes one tale about rival wives: a rival wife goes to the
    forest despite her husband’s warning, receives a house, food, and bed after praying,
    kills and eats a speaking dove, and is later seized and eaten by a hyaena; another
    dove reports her death to the husband. A variant adds that the second dove brings
    the dead woman’s finger as evidence. The passage then begins a tale in which a
    man with two wives forbids them to loose his dogs while he is in the forest. When
    Dodo threatens him, he climbs a tree and plays his flute; the dogs whine at home,
    the chief wife releases them despite the rival wife’s warning, and the dogs kill
    Dodo. The husband rewards the chief wife and beats the rival wife.'
  language: English
  quote_policy: summarized
