canonical_text:
  quote: ''
  summary: 'The passage explains why Hausa tales and customs should be recorded accurately:
    native customs may function as local law; tales should be preserved close to their
    original wording while acknowledging variants; the author claims direct collection
    from oral story-tellers, notes marked editorial substitutions for unprintable
    words, and cautions that stories change and travel while still being useful for
    students of Hausa culture.'
