canonical_text:
  quote: ''
  summary: A father associated with Jerboa skins refuses an arrangement and reveals
    a secret. He confronts his son at a feast, telling him to discard his turban and
    eat Jerboa. The Rich Man, publicly shamed because he had claimed the boy as his
    own son, gives the boy a sword and tells him to kill either the Rich Man or the
    boy's real father. The boy kills his real father and returns to the city with
    the Rich Man. The narrator then asks whether the boy acted rightly or wrongly.
