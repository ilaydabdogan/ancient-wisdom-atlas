canonical_text:
  quote: ''
  summary: The passage first ends a flight episode in which a man throws gravel into
    a river, the waters divide, he and a woman cross, and the waters close again.
    It then gives the tale of Faddam, whose parents refuse her chosen husband; she
    seizes all the town stream water in a gourd and withholds it from a tree until
    her parents agree to her marriage to Musa. After marriage, her parents kill her
    infant son, and her husband kills them by seating them over a concealed well;
    a variant fills the well with burning logs. The passage then begins another tale
    in which a girl whose parents refuse her marriage asks her beloved for a knife
    to kill her mother; he refuses, but later gives her the knife when she claims
    she needs it to cut pumpkins.
  language: English
  quote_policy: summarized
