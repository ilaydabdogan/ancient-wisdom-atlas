  summary: The passage explains source abbreviations and then describes Hausa oral-story
    opening and closing formulas. It states that fables are told in the spider’s name
    because the spider is associated with cunning and craftiness. A narrator calls
    the story, listeners reply, the tale proceeds, and the narrator ends with formulas
    involving a mouse or rat head, the spider, and acknowledgment that the tale is
    an untruth or lucky lie. A footnote compares part of the Hausa introductory formula
    with a Sierra Leone story formula.
