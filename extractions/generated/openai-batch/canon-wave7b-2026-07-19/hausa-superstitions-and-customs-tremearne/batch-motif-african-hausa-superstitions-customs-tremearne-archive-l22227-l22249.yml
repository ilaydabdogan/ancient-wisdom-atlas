  summary: A set of notes comments on inability to obtain fresh meat, possible meanings
    of clothes connected with Auta’s planned suicide or mourning for a ewe, the sense
    of sa(ri)ni as more than literal knowledge and akin to permission, and a punishment
    described as mild.
