canonical_text:
  quote: ''
  summary: 'The passage captions two darra game boards and describes their pieces.
    It then gives two riddles with answers: a herd image answered as stars and moon,
    and a tiny object answered as a packing-needle. The author comments on the extent
    of Hausa riddles and notes parallels for some riddles in Sierra Leone material.
    The passage then introduces Hausa proverbs about preparation, resource management,
    sight and blindness, experience, and scale or fitness.'
  language: English
  quote_policy: summarized
