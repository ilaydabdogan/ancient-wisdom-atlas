canonical_text:
  quote: ''
  summary: The passage gives the end of a lapse-of-time tale in which a daughter at
    a riverside is transformed into a man after angelic speech and returns to a house
    where household time appears not to have advanced much. It then relates a magical
    appearance attributed to Shefu Othman, who rescues Dodo’s canoe on the Niger and
    later proves knowledge of Dodo’s vow. A final brief story describes People of
    the Next World living at the bottom of a well and requiring clothes from a fallen
    mortal before taking him up again. Editorial notes mention time-counting and comparative
    parallels in Turkish, Koranic, Indian, and Sumatran materials.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed daughter comes to the riverside, washes her cloths, and is happy
    because she is to return to her husband that night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the waterside she becomes a virgin again, hears angels speak about a woman
    becoming a man or a man becoming a woman, and immediately becomes a man.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the transformation, the person is described as squatting behind his
    house, seeing water and clothes, dressing himself, and entering his house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Students ask whether he has washed; his wife has not yet come out of her hut
    and is annoyed that he did not stay longer so that cakes could cool; afterwards
    they go to the mosque and Sheku believes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dodo, coming from Gwanja, is crossing the Niger when his canoe is nearly upset
    and he calls on Shefu, son of Fodio, for help.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A man immediately appears, rights the canoe, disappears, and Dodo vows a gift
    of five calabashes of kola-nuts.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Twenty days later in Sokoto, Dodo brings three calabashes, but Shefu states
    that the vowed number was five and Dodo admits it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the hour Dodo had called, Shefu was in the council chamber, left briefly,
    returned with clothes wet through, and said the councillors would know the reason
    in twenty days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Mutanen Lahira, glossed as People of the Next World, are said to live
