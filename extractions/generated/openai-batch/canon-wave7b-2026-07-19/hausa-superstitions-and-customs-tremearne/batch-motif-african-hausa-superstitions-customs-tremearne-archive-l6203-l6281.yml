  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage treats the snake specifically as a totem, not as a general
    serpent myth.
- id: motif:4
  label: descent from animal totem or mythical animal ancestor
  taxonomy_refs: []
  basis: Babban Dammo claims descent from an iguana totem, and several cited stories
