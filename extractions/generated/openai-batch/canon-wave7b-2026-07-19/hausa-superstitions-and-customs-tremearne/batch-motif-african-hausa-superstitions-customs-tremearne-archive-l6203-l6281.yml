  cautions: The author explicitly notes uncertainty about whether the practices should
    be classified as true totemism.
- id: motif:2
  label: totem animal sacrifice and avoidance
  taxonomy_refs:
  - sacrifice
  basis: Some clans sacrifice a totem annually, while others avoid sacrificing or
    touching their totem.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: Only brief examples, hen and frog, are supplied in this passage.
- id: motif:3
  label: friendly serpent totem as household presence and birth sign
  taxonomy_refs:
  - serpent
  basis: The short black snake totem is described as friendly, living in rafters,
