  text: Some clans annually sacrifice their totem, such as a hen, while other clans
    will not sacrifice or even touch their totem, such as a frog.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Hunter community of Katsina has a short black snake as its totem, will not
