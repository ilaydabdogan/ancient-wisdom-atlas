canonical_text:
  quote: ''
  summary: 'The passage describes Hausa customs and stories interpreted by the author
    under totemism: the term kan gidda for totem/tabu, clan groupings by shared totems,
    animal totems, sacrifice or avoidance of totems, descent claims from an iguana,
    exogamy, animal ancestor stories, animal-maiden tales compared to Swan-Maiden
    and Beauty and the Beast types, and a story in which a woman treats a growing
    silk-cotton tree as her son after a leaf falls on her.'
  language: English
  quote_policy: summarized
