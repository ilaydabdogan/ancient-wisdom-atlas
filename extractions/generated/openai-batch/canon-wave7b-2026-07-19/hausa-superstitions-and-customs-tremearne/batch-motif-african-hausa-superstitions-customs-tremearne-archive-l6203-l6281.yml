- id: obs:2
  text: The passage says the same Hausa word, kan gidda, is used for both totem and
    tabu, glossed as “that which is upon the house.”
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Persons having the same totem or tabu are described as constituting a clan,
    while political divisions are distinguished by facial scarifications rather than
