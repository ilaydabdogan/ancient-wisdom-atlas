canonical_text:
  quote: ''
  summary: 'The passage recounts part of a tale in which wives join a witchcraft dance
    in the forest; two intend to offer their husband, while the youngest will offer
    cloth. A drummer hides the husband in a mat so he can hear them, after which the
    husband kills or punishes the threatening wives and remains with the wife who
    offered cloth. A variant has the good wife warn him, and the bad wives speak of
    offering a man''s liver or heart; he drives them out after seven days. The passage
    then begins another tale: a man with two wives has two daughters; after one mother
    dies, the stepmother beats the orphaned daughter and sends her to the dangerous
    River Bagajun, where a witch eats visitors. On the way, the maiden encounters
    a speaking river of sour milk and then a river of honey.'
  language: English
  quote_policy: summarized
