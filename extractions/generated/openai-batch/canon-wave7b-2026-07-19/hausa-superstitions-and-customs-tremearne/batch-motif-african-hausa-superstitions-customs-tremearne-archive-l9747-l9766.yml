  summary: In the tale opening, the King of Good and the King of Evil travel together.
    The King of Evil proposes that they eat the King of Good's food first and later
    his own, but after the first supply is gone he refuses to share. The King of Good
    wastes away from hunger. Later, at night, they sleep beneath a large tree with
    a bird's nest at its top. The King of Evil sleeps, while the hungry King of Good
    remains awake and hears the Bird speak about the tree's leaves and their use on
    the eye of a blind man; the passage ends before the stated result is completed.
