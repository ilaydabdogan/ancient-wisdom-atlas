canonical_text:
  quote: ''
  summary: In an episode of rivalry, a Boy and a King's Son compare status at a girl's
    house. The King's Son displays plentiful food by vomiting the grains he ate, while
    the Boy displays silver he had swallowed with sour milk; the women praise the
    Boy and the King's Son flees in embarrassment. The Boy later returns to town with
    his father, prepares silver spindles and kola-nuts, and sends them through the
    slave of the King's Son's mother, saying he will visit her later.
  language: English
  quote_policy: summarized
