canonical_text:
  quote: ''
  summary: 'A brief closing fragment says an unnamed man will send the Gluttons away
    and gives them four enslaved persons to farm for them. A new tale follows: a father,
    identified by the heading as a greedy man, takes his motherless son and a bull
    deep into the forest to slaughter it where flies will not share it. Having forgotten
    fire, the father mistakes the red glow of Dodo''s mouth for fire and sends the
    son to get embers. The son tells Dodo that his father summons him. Dodo arrives
    with a huge leather meat-bag and repeatedly demands more of the bull, calling
    each portion a tiny morsel. When all of the bull is given, Dodo says the father
    and son are also meat, places them in the bag, and goes to collect wood to roast
    them. Left to guard the bag, the son cuts it open, frees his father, and they
    run away, leaving the meat for Dodo, who roasts and eats it. The final lines state
    that the father and son returned home and repented, though the passage cuts off
    mid-sentence.'
  language: English
  quote_policy: summarized
