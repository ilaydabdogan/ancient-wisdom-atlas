canonical_text:
  quote: ''
  summary: The passage closes a tale in which a dog seizes and eats people, causing
    Spider and his wife to flee while the dog takes their house. It then tells of
    Musa, a king's son, who steals maidens' clothes while they bathe; he withholds
    the cloth of the bashful maiden who loves him until she speaks his name, after
    which he beats her, takes her home, desires her, and marries her. The passage
    then begins another tale about a handsome youth, Denkin Deridi, who says that
    only a maiden who knows his name may become his wife; only an old woman knows
    it, and the maidens prepare special dishes.
  language: English
  quote_policy: summarized
