canonical_text:
  quote: she could change herself into a Monkey.
  summary: The passage first concludes a tale in which a wife falsely claims toothache,
    steals and eats guinea-corn while her husband is away, and is expelled after another
    woman reports her deception. It then notes a similar Spider and Crown-Bird story.
    The main Monkey-Woman tale begins with a man marrying a widow who can become a
    monkey. Asked to guard a tomato farm from monkeys, she transforms at an ant-hill,
    summons many monkeys, and directs them to eat the ripe tomatoes. After a friend
    warns the husband, the husband hides and witnesses her transformation and summoning
    of monkeys.
  language: English
  quote_policy: quoted
