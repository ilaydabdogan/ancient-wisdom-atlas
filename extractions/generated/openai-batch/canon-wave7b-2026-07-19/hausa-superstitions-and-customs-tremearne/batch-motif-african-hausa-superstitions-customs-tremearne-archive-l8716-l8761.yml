canonical_text:
  quote: ''
  summary: 'The passage describes Hausa naming and address practices: restricted or
    dangerous pronouncing of a beloved''s name in story contexts; patronymic and sibling-based
    address; nicknames based on physical traits, acts, speech, or animal labels; and
    sentence-like slave-names performed between caller and respondent. A footnote
    cautiously compares the Hausa case with a Hindu taboo on a woman using her husband''s
    name, noting ceremonial exceptions and proposed explanations.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girl in Story 42 is said to be beaten for pronouncing a name to its owner,
    while an unmarried girl may perhaps tell her beloved's name to her parents without
    evil consequences.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men are often known by a patronymic formula, and a variant of Story 86 has
    a hero addressed by his sister as brother of another named person.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nicknames are described as common and often based on physical characteristics
    such as a large head or strength.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some nicknames commemorate an act or a speech, while animal words such as
    Lion or Bull Elephant applied to a chief are described as forms of address rather
    than ordinary nicknames.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Slave-names are described as long sentence-like forms in which one part is
    spoken by the caller and the rest by the person answering.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The footnote says a Hindu woman is generally prevented by taboo from using
    her husband's name, though exceptions occur at marriages, coming of age, first
