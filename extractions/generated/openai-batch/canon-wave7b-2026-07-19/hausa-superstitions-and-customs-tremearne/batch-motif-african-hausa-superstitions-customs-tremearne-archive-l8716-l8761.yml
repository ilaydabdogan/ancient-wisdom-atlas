  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'The footnote gives possible explanations for the Hindu ceremonial use of
    the husband''s name: driving spirits away from an unborn child or admitting maternity
    and paternity.'
  category: other
  evidence_refs:
  - ev:5
