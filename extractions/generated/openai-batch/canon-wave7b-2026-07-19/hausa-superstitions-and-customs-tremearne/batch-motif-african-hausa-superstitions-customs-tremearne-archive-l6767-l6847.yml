canonical_text:
  quote: taking the form of an animal or a bird while preserving his original identity
  summary: 'The passage surveys transformation in Hausa folklore: humans may become
    animals, birds, objects, or body parts while preserving identity; animals may
    become human temporarily for deception or benefit; birds may take a girl''s place
    to save her; objects can speak or act; heroes and adversaries may perform transformation
    sequences; and a transformer is said to roll on the ground and, if human, remove
    human-only clothing or ornaments. A footnote compares a similar sequence in a
    Finnish tale.'
  language: English
  quote_policy: quoted
