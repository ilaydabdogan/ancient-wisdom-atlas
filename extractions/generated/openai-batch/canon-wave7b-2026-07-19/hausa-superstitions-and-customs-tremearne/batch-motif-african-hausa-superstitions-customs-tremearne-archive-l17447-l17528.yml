canonical_text:
  quote: ''
  summary: The excerpt first summarizes a Boy escaping an intended drowning by tricking
    a Messenger into being drowned instead, followed by editorial comparative notes
    on a Snake contract and on a youth who rises from negligible capital through transactions
    and avoids drowning by substituting an opponent. The main tale recounts a father
    with three children whose inheritance of 20,001 cowries is disputed; Kumbu(r)rin
    Dammo rejects giving the extra cowry to the eldest son, and Atteyu is summoned
    to divide the amount equally by successive allocations. The passage ends with
    the opening of another tale about a bachelor going to work on his farm.
  language: English
  quote_policy: summarized
