canonical_text:
  quote: ''
  summary: 'The passage gives editorial notes on Hausa customs and story details:
    gendered garments tied with a string called a tail when hanging behind, preference
    for sons, demand for childbirth charms, a comparative note on women in India wearing
    a husband’s trousers to obtain children, use of drums and call-and-response singing
    for rhythm, discomfort of a tightly tied garment, and a comment that it is not
    fitting to make a wife hoe. It ends with a cross-reference and the beginning of
    a truncated note on mud beds.'
  language: English
  quote_policy: summarized
