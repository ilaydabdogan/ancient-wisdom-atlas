canonical_text:
  quote: ''
  summary: 'The excerpt begins with the end of an animal tale and an editorial comparison
    to an Angola tale of a fugitive wife delaying a cannibal husband. It then gives
    the opening of “The Lucky Foundling”: a childless Man of Auzen and his wife find
    a boy lying in the road with ants and dirt in his mouth, take him home as their
    son, and face repeated public challenges to prove he is truly theirs. The boy
    exceeds rival sons in tests involving camels and horses, is lavishly equipped
    with silver and gold, and is sent with other boys to woo an exceptionally beautiful
    maiden who has rejected even kings; the passage ends as the maiden smiles at him.'
  language: English
  quote_policy: summarized
