canonical_text:
  quote: ''
  summary: A man borrows money while his pregnant wife remains at home. After three
    days she gives birth, and the newborn son is laid on a bed. A creditor arrives
    seeking repayment; the newborn answers, proposes going to court, and is carried
    by the creditor. On the way, the baby repeatedly treats titles of proposed adjudicators
    as literal references to dye-pit mouths, peppers, and a gwaza plant. They reach
    the king, who asks to be shaved before judging. The baby asks for water, has millet
    grain plucked from five millet-heads, shaves the king, and answers the king's
    demand to restore his hair by first asking for the millet grain to be restored.
  language: English
  quote_policy: summarized
