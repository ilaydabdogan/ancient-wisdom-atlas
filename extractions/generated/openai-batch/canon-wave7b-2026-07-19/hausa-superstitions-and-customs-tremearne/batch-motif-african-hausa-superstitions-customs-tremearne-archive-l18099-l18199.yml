canonical_text:
  quote: ''
  summary: A Dodo comes to a town and repeatedly challenges anyone to fight him, causing
    the townspeople to hide. A small boy named Auta stays at an old woman's house,
    answers Dodo's challenge, heats seven stones in the fire, and throws them one
    by one into Dodo's mouth when Dodo stoops to enter the porch. Dodo swallows the
    stones and dies at dawn. Auta cuts off Dodo's tail and later uses it to prove
    he killed him; the king rewards him with ten slaves, the king's daughter in marriage,
    and a house. The passage then begins a stated variant in which Auta and his sister
    Barra inherit after their parents die; Barra is told not to make Auta unhappy,
    and Auta demands destructive actions involving slaves and household possessions.
  language: English
  quote_policy: summarized
