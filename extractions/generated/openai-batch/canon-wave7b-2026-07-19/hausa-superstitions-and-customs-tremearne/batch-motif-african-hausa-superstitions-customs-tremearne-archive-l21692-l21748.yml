canonical_text:
  quote: ''
  summary: 'Editorial notes on several Hausa tales explain objects, customs, and tale
    elements: a three-stone cooking-place; expectations that well-born youths ride;
    an expense borne by someone other than the real parent; the distinction between
    a stream spirit and a water official; miraculous canoes and an alternate water-dividing
    episode; a possible connection to a Sudan conquest-marriage custom; magic settlement
    near water; and pit-trap construction.'
  language: English
  quote_policy: summarized
