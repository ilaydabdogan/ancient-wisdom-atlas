canonical_text:
  quote: ''
  summary: A rich man finds a wounded boy, washes him, adopts him, gives him clothing
    and a horse, and presents him to the king as a son found during travel. The king
    tests the claim through a repeated horse-racing and horse-killing challenge, then
    acknowledges the sonship. The boy is offered royal marriages and given a turban,
    becoming a man. The boy's real father, who had struck him with a club, comes to
    reclaim him, and the rich man offers gifts in exchange for peace and secrecy about
    the boy's parentage.
  language: English
  quote_policy: summarized
