  summary: The passage gives author-mediated ethnographic comments on adultery, desire,
    family preference, wealth in courtship, forgiveness, dislike gestures, revenge
    in tales, drunkenness, and hospitality toward strangers among Hausa people as
    represented by the source.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports a proverb in which women’s wiles are numbered as ninety-nine
    known to men and a hundredth not discovered even by Satan.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that some husbands accept and profit from a wife’s adultery,
    and that a man has few restrictions except regarding another man’s wife.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says there is no exact Hausa equivalent, in the author’s view,
    for English “love,” and interprets Ina son ki as indicating desire or wish for
    possession.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: As an exception in tales, a father is described as being so fond of his daughter
    that he seemed to wish to take her up and eat her.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says the most desired wife or child is usually the one who can
    give most, and gives examples of a mother preferring another woman’s son and a
    chief replacing an old family with a new one.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says a maiden is wooed by riches, women are attracted by riches,
    and a wife may desert her husband for a richer man; it cites a proverb that wealth
    wins a woman.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says forgiveness for parents is rare, a wife may demand the death
    of rival wives, and children may sometimes forgive.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Hatred, fear, and contempt are said to be expressed by spitting before or
    after a person, by a clicking noise with the tongue, by gestures, and by insulting
    words.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says tales seldom mention hatred directly; revenge is more often
    treated as policy, and many stories punish an envious rival wife or stepsister.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says drunkenness was not looked down upon before the Mohammedan
    Fulani conquest and remains prevalent in unsubdued pagan districts; one story
    describes a man whose only occupation is drinking native beer.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Hospitality and courtesy to strangers are strongly emphasized; stranger and
    guest are identified by the same term, bako, and work expectations differ by the
    stranger’s gender.
  category: relationship
  evidence_refs:
  - ev:9
