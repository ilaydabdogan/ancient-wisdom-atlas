canonical_text:
  quote: "“That kind of friendship is not pleasant.”"
  summary: A short preceding fragment says that an Old Woman restores a woman married
    by the King by placing spots of grease in a pot, adding water, and leaving it
    closed until morning. In “The False Friend,” a Youth travels with his Friend to
    his wife’s people. At the Mother-in-Law’s house the Youth refuses the meals, saying
    he cannot eat there, while the Friend eats. At night the hungry Youth uses a rope
    to guide himself to the farm for millet, but the Friend secretly ties the rope
    to the Mother-in-Law’s hut. The Youth follows it back into the wrong hut, talks
    and eats in front of his Father-in-Law, and is discovered. He flees on his Mare,
    but the Mare throws him and returns to the in-laws. The Father-in-Law finds the
    saddle-bags fouled with dirt by the Friend. Ashamed, the Youth abandons his return,
    his Mare, and the connection with his wife’s town, while the Friend goes away.
  language: English
  quote_policy: quoted
