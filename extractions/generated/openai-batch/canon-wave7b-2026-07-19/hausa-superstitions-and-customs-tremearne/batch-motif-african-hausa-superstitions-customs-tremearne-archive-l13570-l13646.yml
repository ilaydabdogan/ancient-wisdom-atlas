canonical_text:
  quote: ''
  summary: The passage first summarizes the end of a tale involving a woman who becomes
    a hyaena, a youth who undergoes several transformations, becomes a ring, becomes
    a man, climbs a tree, and is rescued by dogs. It then gives the tale of a wife
    who asks her husband to take a rival wife, later regrets it when the husband favors
    the bride, demands that the new wife be sent away, and is herself driven out.
    The passage ends with the opening of another tale in which two men find a diniya
    tree, climb it, eat fruit, and one friend saves fruit in a bag while the other
    eats all his fruit.
  language: English
  quote_policy: summarized
