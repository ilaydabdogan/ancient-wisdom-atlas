canonical_text:
  quote: ''
  summary: A poor man and a richer neighbor farm near each other. A still richer man
    disguises himself in ragged clothing so that people think he is a beggar. He greets
    the rich man, who rejects him insultingly. He then greets the poor man, who tells
    his wife to mix husks and water for the stranger. The wife kneels and offers the
    drink; the disguised man thanks them and returns it without drinking.
