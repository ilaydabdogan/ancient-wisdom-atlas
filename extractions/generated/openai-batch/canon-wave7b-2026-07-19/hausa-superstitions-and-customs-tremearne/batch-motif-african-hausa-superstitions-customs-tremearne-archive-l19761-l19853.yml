  summary: The passage contains a fragment about wives and a married daughter escaping
    danger; a comparative Malayan tale in which a goat’s missing heart is replaced
    with a boy’s heart, leading a prince to eat human flesh and grow tusks; and the
    beginning of the Hausa tale “The Many-Headed Cannibals,” where a two-headed Girringa
    brings a wife from Kano and encounters three-, four-, and five-headed beings on
    the way toward a city and an unseen king.
