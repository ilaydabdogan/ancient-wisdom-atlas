- id: motif:2
  label: Cunning contests royal or physical power
  taxonomy_refs:
  - trickster_boundary
  - royal_legitimacy
  basis: Lion holds the usual animal kingship and symbolizes power, but spider may
    hold the throne and defeats lion through cunning; lion requires an old woman's
    help to prevail.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  confidence: medium
  cautions: The text presents an ethnographic synthesis of tale patterns, not one
    continuous mythic episode.
