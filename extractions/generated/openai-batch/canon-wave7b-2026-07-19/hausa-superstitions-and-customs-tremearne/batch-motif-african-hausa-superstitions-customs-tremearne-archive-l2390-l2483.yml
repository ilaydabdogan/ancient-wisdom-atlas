canonical_text:
  quote: ''
  summary: The passage describes Hausa animal-tale figures, especially Hare/Zomo and
    Spider/Gizzo. Hare deceives Elephant and Giraffe in a farm partnership. Spider
    is presented as the great cunning hero, sometimes associated with kingship, protected
    by a charm from a malam, and able to outwit lion, animals, and humans, though
    old women, men, and some animals can defeat or repay him. Lion/Zaki is the usual
    King of Beasts and a sign of power and chiefly dignity, but becomes afraid of
    humans after a lioness is killed by a poisoned arrow. The passage also comments
    on Spider's greed, variable size, possible human shapes, female spider Koki, and
    compares Spider's character to a description in Cunnie Rabbit. A following caption
    identifies malams as learned Muslim priests associated with belief in magic and
    contrasts older horseman power with European arrival.
  language: English
  quote_policy: summarized
