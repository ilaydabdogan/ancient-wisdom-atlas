canonical_text:
  quote: ''
  summary: A witch comes to the boys' town on market-day. Dan-Kuchingaya warns his
    elder brother not to go with her, but the elder brother ignores him; the witch
    plucks out his eyes and disappears. Dan-Kuchingaya resolves to recover the eyes.
    He transforms into a beautiful Filani maid carrying milk, reaches the witch's
    house, and asks about a charm to restore eyes while claiming that Dan-Kuchingaya
    has blinded the maid's cattle. The witch describes a remedy involving the eyes
    of a black goat and an ointment, gives him the ointment, and Dan-Kuchingaya leaves
    and changes into a youth.
  language: English
  quote_policy: summarized
