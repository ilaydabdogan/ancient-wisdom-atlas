canonical_text:
  quote: ''
  summary: 'The passage gives the ending of “The Lazy Boy”: Hyaena kills a goat and
    tries to obtain meat after persuading the Boy to dismount; Spider carries the
    Boy in exchange for meat but cannot get him to get down, and Spider dies when
    Female-Spider accidentally strikes him. The Boy then returns to the water, identified
    as his home because he is a Water-Dweller. Editorial notes summarize a variant
    involving Hyaena, a well, fright, and laughter, and a Sierra Leone analogue involving
    Spider and an Old Woman who grips him while being carried. The next tale begins
    with a childless woman who prays for a child even if it is a clay pot, conceives
    by God’s action, and bears a clay pot from which a son emerges.'
  language: English
  quote_policy: summarized
