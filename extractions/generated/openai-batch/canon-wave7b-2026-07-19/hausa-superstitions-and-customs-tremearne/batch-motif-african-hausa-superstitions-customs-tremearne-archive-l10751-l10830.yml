canonical_text:
  quote: The Spider is a fool, he has eaten his boot,
  summary: In this portion of “The Spider's Visit,” Spider travels with Francolin,
    repeatedly gives her instructions connected with food, and is frustrated because
    she has secretly prepared the needed objects. On the return journey he links a
    water sound with an instruction for her to enter a fire, but she substitutes his
    boot and hides in his load. At home, Spider repeatedly tries to strike Francolin
    with a pestle and kills members of his own household instead. Francolin later
    escapes from his head while he falls from a tree and dies, after which she takes
    his possessions.
  language: English
  quote_policy: quoted
