canonical_text:
  quote: ''
  summary: In this portion of the tale, Lahidi overhears man-eating Jipillimas reveal
    that their droppings can cure an almost-dead King's Son. She gathers the substance,
    goes to the palace disguised or treated as a Disciple, gives it as medicine, and
    the King's Son vomits thorns and recovers. She refuses large rewards and asks
    only for his ring. Later, when he comes to kill her, she reveals that she was
    the healer by showing the ring and garments from the disguise. He asks to marry
    her, gives cattle and slaves to address her parents' concern about water-carrying,
    and her father becomes rich through the daughter he had not loved.
  language: English
  quote_policy: summarized
