canonical_text:
  quote: ''
  summary: 'The passage surveys animal figures in Hausa folklore and related customs:
    insect or spider as a possible heroic or solar figure; jerboa as an unfailing
    clever animal with dangerous and magically useful body parts; jackal as learned
    judge; leopard, hyena, monkey, and baboon relations; and dogs as low-status scavengers
    that may nevertheless protect against witches, Dodo, dead spirits, and evil spirits.
    Footnotes compare lion-jackal roles in Northern India and an English belief about
    a spayed bitch preventing haunting.'
  language: English
  quote_policy: summarized
