canonical_text:
  quote: ''
  summary: The passage gives explanations of the sun pursuing or catching the moon,
    including a communal drumming appeal to spare the moon; editorial notes compare
    related material cautiously to eclipse and New Year patterns. It also summarizes
    a sun-and-wind contest over a traveller's garment, beliefs about the next world
    and transmigration of souls, methods for preventing a soul from escaping a corpse,
    and personified diseases or spirits associated with smallpox, trees, paralysis,
    and death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sun asks the moon where her daughter is; the moon says the daughter burned
    him, so he let her fall to earth, and this is given as the reason the sun pursues
    the moon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Another account says the moon's path is thorny and the sun's path is sandy,
    so the moon travels more slowly and eventually moves onto the sun's path, where
    the sun catches him.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the sun catches the moon, people take drums and ask the sun to spare
    the moon; a note explains these drums as mortars covered with skins.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The editor says that, by Indian analogies, Story 65 might relate either to
    an eclipse or to the birth of the New Year, but adds that sufficient proof is
    lacking.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: The editor notes examples in which a swallowed ugly girl is brought up again
    in a beautiful form, and in which animals, insects, or a knife cut their way out
    of a host; this swallowing and cutting-out pattern is identified as known in eclipse
    stories.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The sun and the wind quarrel over which is more powerful and agree to test
    their powers by trying to seize a traveller's tobe by force.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The wind blows off the traveller's tobe, but the traveller catches the arms,
    folds it, and stoops down to avoid further danger.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The sun's heat makes the traveller nearly ready to throw away the tobe; the
    traveller then says the sun is more powerful, and the contestants accept that
    judgment.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The next world is described as a replica of this world, with families together
    in houses and souls anxious about what will be left to them.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The next world is said probably to be above, to have night and day, to receive
    animals, and to have inhabitants who die a second time.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Souls may transmigrate from one human body to another, especially within the
    same family, but they cannot enter animals.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: 'One reported belief distinguishes good and bad souls: bad souls wander, while
    good souls return to the womb of a family woman and usually reappear in a grandchild
    of the deceased.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Another reported belief says souls may come to kill living people unless placated
    or prevented, so thorns are placed on the corpse to stop the soul escaping.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Several diseases are personified, including Dan Zanzanna, who gives smallpox
    to enemies, and Dogua, an evil spirit that injures tamarind and baobab trees and
    causes paralysis and death in people eating the fruit.
  category: relationship
  evidence_refs:
  - ev:9
