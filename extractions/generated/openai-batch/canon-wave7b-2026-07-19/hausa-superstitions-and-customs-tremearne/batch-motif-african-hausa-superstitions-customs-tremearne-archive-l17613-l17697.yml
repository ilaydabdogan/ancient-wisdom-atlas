  summary: 'The passage preserves the end of an otherworld episode in which a man
    is forbidden to open a palace back door, disobeys, and must return home; editorial
    notes compare the City or Isle of Women with the Arabian Nights and Pomponius
    Mela. It then begins the tale of a mother visiting a daughter in a town where
    no one may sleep: after ignoring warnings, the mother falls asleep, is mistaken
    for dead, nearly receives funeral treatment, is awakened by her daughter, and
    the town begins to learn how to sleep. The next episode, a visit to a daughter
    in a town where no one may spit, begins at the end of the passage.'
