canonical_text:
  quote: ''
  summary: 'The passage lists Hausa charms, potions, rites, and magical gifts: a washing
    charm that harms an enemy, invisibility charms, a gambling potion, love philtres,
    tattoo patterns, reconciliation fruit, a tale in which a woman learns that the
    same patience used to obtain buffalo-cow''s milk can help her rule her husband,
    ritual cures involving a mortar or kneeling to a dog, and folk motifs of animal
    rewards, a money-transforming tree, and a magic carpet. A note describes the Fortunate
    Tree as guarded by phantoms and animals and associated with a ruddy hovering light.'
  language: English
  quote_policy: summarized
