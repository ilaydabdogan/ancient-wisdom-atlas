canonical_text:
  quote: ''
  summary: The passage introduces a Hausa tale involving a rarely attested magic ointment
    or fairy unguent. A son whose four sisters had disappeared encounters fighting
    black snakes, receives eye-lotion from an old woman, sees a hidden house, finds
    his sisters married to animal husbands, receives animal hair or feathers, learns
    the hidden location of a king’s life through the queen, summons the animal husbands
    by burning the tokens, obtains the box containing the king’s life, and becomes
    king after the king dies. The passage also notes animal-form humans and includes
    a footnote identifying the episode as an instance of the External Soul.
  language: English
  quote_policy: summarized
