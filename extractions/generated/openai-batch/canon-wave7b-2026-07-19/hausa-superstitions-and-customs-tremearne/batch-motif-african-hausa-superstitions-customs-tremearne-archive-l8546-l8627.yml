canonical_text:
  quote: ''
  summary: The passage explains Hausa forms of address, praise-names, euphemistic
    speech, distinctions in speech about humans and animals, and naming customs. It
    includes a story explaining a song by a rich woman whose poor husband spent her
    wealth and mistreated her, notes that celebrated men may have long praise titles,
    describes etiquette around indirect reference to family, status, illness, death,
    pregnancy, and animals, and states that names have magic, with children having
    secret and public names. It also recounts a story in which an old woman loses
    an adopted son because she cannot keep his name secret, and lists naming by day
    of birth, feast day, special incident, and twin pairs.
  language: English
  quote_policy: summarized
