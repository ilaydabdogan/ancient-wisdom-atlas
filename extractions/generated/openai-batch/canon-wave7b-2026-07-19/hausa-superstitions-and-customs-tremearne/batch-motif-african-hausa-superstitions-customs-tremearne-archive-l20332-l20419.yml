canonical_text:
  quote: '"We are the army of God; we lay 99 eggs..."'
  summary: Authorial notes on several Hausa tales describe locusts as damaging but
    edible, a tradition in which Mohammed reads ominous words on a locust's wings
    and prays against them, a written prayer charm for threatened plantations, infant
    carrying in a calabash, interpretive notes on a lion's discovery and suicide,
    atonement through killing and suicide, place and river notes, and cautions against
    reading tale titles as cosmic good/evil powers.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Locusts are caught in nets, eaten fried or boiled in oil with salt, and are
    said to cause great damage in Hausaland.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A related account says Mohammed read words on a locust's wings identifying
    the locusts as God's army and saying that 99 eggs are laid, while 100 would allow
    them to devour the whole earth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Prophet prays to God to destroy the locusts, and an angel appears saying
    part of the prayer has been granted.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The note identifies a paper bearing the prayer, stuck on a stick in a threatened
    plantation, as the best charm against locusts.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A child is said probably not to be carried on the back for some time after
    birth, but in a calabash on the head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The note explains that an apparent contradiction means some were killed and
    others ran away, and separately notes that the chronological order of a lion's
    speech is wrong.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The note says the wife used the lion's name to make him commit suicide, but
