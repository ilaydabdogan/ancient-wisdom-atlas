canonical_text:
  quote: ''
  summary: 'The passage first concludes an animal trickster episode: Hare disguises
    himself with red and white earth, sits on an ant-hill, and obtains all of Hyaena''s
    meat before washing and taking it away; a variant is noted in which Tortoise deceives
    Spider. It then begins the tale titled “Everything Comes to Him Who Waits”: a
    hungry husband and wife search ant-holes for grain, the husband refuses work after
    watching a lizard catch flies passively, the wife finds a pot of dollars in an
    ant-hill, her family sees a snake in the pot and tries to use it for revenge,
    but the husband later opens it and finds dollars.'
  language: English
