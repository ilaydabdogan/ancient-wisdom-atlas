  quote: ''
  summary: 'The passage lists several Hausa taboos and related examples: avoidance
    of seeing certain relatives or wives in specific acts, a story in which an elephant''s
    daughter uses a ring in food as a recognition token, first-born nursing shame,
    concealed eating, meal-sharing obligations, material and dress prohibitions, rules
    for encounters with supernaturals, and an introductory description of Bori as
    an uncanny institution involving frenzied dance-like ceremonies.'
  language: English
  quote_policy: summarized
