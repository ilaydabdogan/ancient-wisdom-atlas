  quote: ''
  summary: A female figure transforms herself into a very beautiful woman, comes to
    the king's palace, and sets a covered basket at the king's door, declaring that
    whoever hits and opens it will be her husband. The king, heir, and councillors
    fail. A boy hunter returning from the forest is persuaded by a friend to try;
    he throws a tiny stone, opens the basket, marries the woman, and goes with her
    to his house. He then neglects his first wife, while his father tells the first
    wife to remain silent.
