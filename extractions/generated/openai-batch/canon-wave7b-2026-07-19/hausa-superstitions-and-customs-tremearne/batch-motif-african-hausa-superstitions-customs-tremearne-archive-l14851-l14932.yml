canonical_text:
  quote: ''
  summary: In the closing portion of the tale, a Mouse and Cat recover feathers hidden
    in a mouth and return them to the Youth in the forest. The Eagle accepts their
    recovery but says the Youth must later repay a forfeited feast. When another king's
    son dies, the King summons the Youth after the King's Slave says he has lost his
    charm. The Youth bargains for the Slave's property, uses a charm to raise the
    dead man, and then seizes the Slave and the Slave's Wife. At a forest clearing,
    animals assemble, a wood-pile is burned, and the Slave and his Wife are thrown
    into the fire until cooked; their bodies are presented to the Eagle as his feast.
    The passage ends with a narratorial moral and editorial notes comparing the tale
    to widespread stories of a stolen magical ring recovered by grateful animals and
    to European stories of restoration to life and vengeance.
  language: English
  quote_policy: summarized
