canonical_text:
  quote: ''
  summary: A Tortoise repeatedly disorders a Bachelor’s farm and, when beaten, promises
    to give him a wife. The Tortoise carries him inside a bundle of stalks to a city
    populated only by women, where the women bring him to the Queen. The Queen gives
    him royal clothing, a horse, and marries him. Before going to war she forbids
    him to open a lidded basket; he opens it and is suddenly returned to his farm
    with only a loin-covering and hoe. He tries to recreate the journey with a young
    Tortoise, but a Hyaena intercepts the bundle and eats him.
  language: English
  quote_policy: summarized
