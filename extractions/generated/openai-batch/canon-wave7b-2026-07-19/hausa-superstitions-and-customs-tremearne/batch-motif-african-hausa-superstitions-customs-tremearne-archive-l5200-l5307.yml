canonical_text:
  quote: ''
  summary: The passage summarizes Hausa tale patterns and customs concerning parents,
    children, co-wives or stepmothers, child rivalry, animal helpers, unnatural parents,
    and adoption of sons. It describes persecuted stepchildren set impossible tasks,
    animal-assisted success and marriage to a king's son, moral puzzles about killing
    an offending parent versus rewarding a benefactor, rivalry with a king's son,
    and adoption of sons possibly connected with sacrifices, rites, inheritance, or
    ancestor worship.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Children are expected to obey, while parents are also said to have duties
    and are usually kind to their children.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says tales to the contrary exist, especially tales of a step-mother
    variety.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The daughter of a dead wife is usually said to be badly treated by a surviving
    kishia and set a task thought impossible.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ill-treated girl accomplishes the task because of her sweet nature and
    becomes rich; the step-mother's own daughter is later set a similar task and fails.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A good girl may be aided by an animal and marry the King's son; in one story
    a fish acts as a Fairy Godmother.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A rival wife sometimes treats a child better than the child's own mother,
    but the passage says this is rare.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: An unnatural parent usually meets death at the hands of the victim in the
    tales cited by the author.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Narrators may ask whether the child was right when the child must choose between
    killing an offending parent and harming or failing a benefactor.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The author says the safest reply to the moral puzzle was to refer the questioner
    to the spider, called the King of Cunning and of Folk-lore.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Rivalry is said to exist among children, and in one cited tale a boy rival
    of the King's son performs feats, becomes king, and rules over his rival.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that sterility is common among Hausas and that there seems
    to have been some form of adopting sons to fill the place of natural-born sons.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: No adoption of daughters is mentioned in the passage.
  category: other
  evidence_refs:
  - ev:7
- id: obs:13
  text: Adopted sons usually kill animals, usually horses, and the author infers that
    a father, and possibly a mother, needed a son to perform a sacrifice or other
    rite.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The adopted son must be obtained lawfully with the natural parent's consent
    if the natural parent is alive; if no natural parent exists, the boy can give
    himself.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage says even a woman can adopt, though it is unclear whether this
    is for herself or for her dead husband.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: The author speculates that a son may be necessary to carry on Hausa ancestor
    worship, while also reporting the current explanation that a childless man's goods
    go to strangers.
  category: other
  evidence_refs:
  - ev:9
