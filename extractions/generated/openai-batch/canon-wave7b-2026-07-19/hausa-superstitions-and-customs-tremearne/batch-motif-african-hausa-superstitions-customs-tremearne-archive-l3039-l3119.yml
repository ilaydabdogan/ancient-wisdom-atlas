  summary: The passage discusses bravery, honesty, and clever deceit in Hausa tales
    and related commentary. It gives examples of a chief's son winning a bride through
    brave deeds, brave enemies being spared, a father training his son to lie, a gourd
    thief escaping by pretending to be an angel, and a chief hearing a disputed claim
    over a bull in a judgment compared by the author to Solomon.
