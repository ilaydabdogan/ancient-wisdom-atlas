canonical_text:
  quote: ''
  summary: The passage finishes a tale in which Spider hides in Bortorimi's nose during
    an elephant hunt, obtains ground-nuts by claiming royal status, receives elephant
    meat, and eats it without sharing. It then summarizes variants involving Bortorimi/Butorami,
    Futaranga, Hyaena, Dog, and a Sierra Leone analogue with Frog and Cow. A new tale
    begins in which Spider and Hyaena bring honey to a King; Hyaena secretly drinks
    her honey and replaces it with dirt, leading to exposure at the palace and a dispute
    over sleeping mats and skins.
  language: English
  quote_policy: summarized
