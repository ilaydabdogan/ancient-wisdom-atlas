canonical_text:
  quote: ''
  summary: A male protagonist asks for white garments and a knife, takes the Ewe's
    flesh into the forest, and prepares to stab himself because the Ewe has died through
    his fault. The Flesh tells him to stop; when he persists, the Ewe rises alive
    and reminds him that she warned him not to marry a Bad Woman. He returns home,
    drives the Bad Woman away, and declares one wife enough. Editorial notes compare
    related tales involving an old mare, a conditional animal benefactor, a dove story,
    and magical inheritances. The passage also begins the next tale, introducing Ahmadu
    the Rich Man with three wives and three sons.
  language: English
  quote_policy: summarized
