canonical_text:
  quote: ''
  summary: A woman needs plates and basins for her daughter's marriage. Spider agrees
    to buy the woman's bull for those goods, then kills and cooks it. He sets broth
    in a pot on the road, traps a thirsty he-goat by the nose, and transfers the payment
    obligation to him. The he-goat later has his nose seized by a crab at the river
    and transfers the same debt to the crab. When the daughter steps on the crab at
    the stream, the crab begins to recite the chain of liability.
  language: English
  quote_policy: summarized
