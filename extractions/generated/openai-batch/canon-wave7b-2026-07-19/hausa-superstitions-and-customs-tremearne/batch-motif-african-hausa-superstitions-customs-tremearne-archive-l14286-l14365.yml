canonical_text:
  quote: ''
  summary: The passage ends an animal-wife episode in which a woman returns to human
    form and is rejected by her husband as a monkey; variant notes mention a gazelle
    wife and a warning against marrying a woman whose people are unknown. It then
    begins a tale of a king with four wives, three loved and one unloved. All four
    conceive although only the three favored wives receive birth-potions. The unloved
    pregnant wife, lacking known relatives or a native town, wanders into the forest,
    prays for a moving hut to stop during an approaching storm, enters it, and encounters
    a great Head whose grunts are interpreted by a Dog. The Head, through the Dog,
    questions her and offers her shelter. The excerpt ends as her labor begins.
  language: English
  quote_policy: summarized
