  summary: A set of notes explains titles, walking order, marriageable age, marriage
    as purchase, adoption-related naming, food-provider terminology, the Fita furra
    and gausami, soaked substances staining walls, a humbled male figure, a polygynous
    marriage detail, a magical act involving perspiration and pagans being thrown
    down, succession by a boy and bride after the Sa(r)rikin Agaddez retires or dies,
    and a brief description of wrestling technique.
