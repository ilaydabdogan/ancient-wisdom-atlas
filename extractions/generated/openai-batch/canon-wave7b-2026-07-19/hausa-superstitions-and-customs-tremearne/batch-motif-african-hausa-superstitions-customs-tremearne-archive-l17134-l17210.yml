canonical_text:
  quote: ''
  summary: 'After simultaneous conceptions, the Bull, Mule, Camel, and the Small Ones
    produce wealth and dependents by filling constructed storehouses, holes, receptacles,
    and a house with gold, silver, cowries, and slaves. Spider receives guinea-corn
    from Auta and reports Auta’s wealth to the King; royal councillors verify that
    Auta is richer than the King. The King, advised by the White Leper, gives Auta
    impossible or dangerous tasks: sorting a bag of mixed grains by daylight, which
    Ant and Stinging-Ant complete, and fetching fan-palm fruits from a lake no one
    enters, which Monkey and Frog begin to accomplish.'
  language: English
  quote_policy: summarized
