literal_observations:
- id: obs:1
  text: Several entries identify a named figure with a tsere object, including a black
    stick, a cock with red feathers, scented cowries with red cloth, a hanurua nut
    with a small chicken, and anything black.
  category: object
  evidence_refs:
  - ev:2
  - ev:7
  - ev:8
- id: obs:2
  text: The Dan Musa dancer is covered with a black cloth and imitates the movements
    of the samami, described as a large snake with a red neck; the passage asks whether
    this has reference to the contest before Pharaoh.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: The Dan Nana dancer pretends to be a small boy with stomach-ache, groaning,
    sitting down, and holding and rubbing his body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:4
  text: Sarikin Rafi is glossed as chief of the river, of fishermen and canoe-men,
    and his actor either pretends to spear fish or performs staring, breast-beating,
    and circular walking movements.
  category: action
  evidence_refs:
  - ev:7
- id: obs:5
  text: Mai Jan Rua behaves as if feverish, is covered by a black cloth flapped to
    fan him, has a stomach that gradually swells, vomits, and then recovers.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:6
  text: Na Rua Rua first stands, then kneels while nodding, finally bends until his
    head touches the ground, turns it to and fro, and groans as if with stomach-ache.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:7
  text: Dan Sariki is the principal actor but does not dance; he sits and cries because
    his father has not given him a present, while other masu-bori salute him and pay
    him respect due to a prince.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:8
  text: Tsuguna is glossed as squatting, and the actor sits like a dog.
  category: action
  evidence_refs:
  - ev:13
- id: obs:9
  text: Wanzami is described as a barber and judge of the Bori sect; members obey
    his sentences, and he puts razors in his mouth, turns them round, and strops them.
  category: action
  evidence_refs:
  - ev:14
- id: obs:10
  text: 'Some entries are left uncertain or cross-referenced: Maye is glossed as a
