canonical_text:
  quote: Does he who comes to my house ever return?
  summary: 'The Rich Man''s Son visits Death''s house, eats food prepared there, keeps
    the remains, and flees on his Horse. Death pursues him, but he drops objects that
    block the road: a stool that becomes a great tree, a hammer, and a bundle of wood.
    He reaches his city alive, and Death declares that he will not die until God kills
    him. He then presents Death''s food to the King''s Son, who accuses him of trickery
    and dares him to go to the Rago''s house. The passage explains that the Rago''s
    house kills guests in succession; the father offers twelve slaves as decoys, but
    the son refuses and goes on horseback.'
  language: English
  quote_policy: quoted
