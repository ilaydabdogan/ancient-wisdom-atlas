  quote: ''
  summary: A set of notes to tale XCIII comments that a female speaker may have spoken
    to herself, that a later description conflicts with an earlier claim because even
    the rude girl was treated well, that washing and water-drawing would occur in
    a natural or artificial clearing, that the father was apparently the city king,
    and that children or pet monkeys may pick lice from an older person's head; monkeys
    are also described as useful for removing ticks and fleas from dogs.
