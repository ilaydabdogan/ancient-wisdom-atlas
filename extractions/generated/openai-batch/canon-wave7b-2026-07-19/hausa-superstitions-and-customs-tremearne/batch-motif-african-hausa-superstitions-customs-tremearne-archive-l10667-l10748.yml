canonical_text:
  quote: ''
  summary: At the end of one tale, Hyaena secretly sends her cubs away under the pretext
    of fetching water, then leaves herself and does not return; Goat and her Kid carry
    off Hyaena's property. A cited variant says Goat and Dog frighten Hyaenas from
    a house and live there. In the next tale, Spider invites Guinea-Fowl on a visit,
    sends her back for a spoon and grass while he eats the food brought to them, then
    at a river uses a stone dropped into water to make her think he has drowned; she
    jumps into a fire, and Spider eats her and takes her load.
  language: English
  quote_policy: summarized
