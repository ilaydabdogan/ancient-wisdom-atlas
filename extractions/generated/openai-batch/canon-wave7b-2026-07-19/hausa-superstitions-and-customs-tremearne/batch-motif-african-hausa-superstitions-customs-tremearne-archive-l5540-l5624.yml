canonical_text:
  quote: ''
  summary: 'The passage describes a model of settlement growth from a man’s farm near
    permanent water into a hamlet, town, or chiefdom, mentions a Daura legend of a
    girl foundress, and then describes reported royal death and burial practices in
    Gobir, Katsina, and Daura: a failing chief is killed and smoked, a successor undergoes
    rites involving a black ox, blood, burial of the predecessor, seclusion, washing,
    palace entry, and in Daura crossing the predecessor’s body. The author also proposes
    comparisons with king-killing tales and succession through taking a predecessor’s
    wives or female kin.'
  language: English
  quote_policy: summarized
