  summary: The excerpt closes a catalogue of Hausa tribal marks, noting several numbered
    subjects, their parents' places of origin, a lizard-like design element, and regional
    attributions drawn from Dr. Kumm. It then begins an additional note on bori, describing
    the performance as now forbidden, naming the Uban Mufane as master of ceremonies,
    and explaining how spectators' offerings, money, musicians, dancers, a mat, kola-nuts,
    a violin, and an overturned calabash are involved.
  language: English
