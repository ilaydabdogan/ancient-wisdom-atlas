canonical_text:
  quote: ''
  summary: In the tale segment, Women who have crossed a river tell a Robber the words
    that open and close Dodo's door. The Robber enters Dodo's house and steals riches,
    but forgets the needed words and becomes trapped when the door jams. The Women
    taunt him, and Dodo later kills, cooks, and eats him. A cited variant describes
    a poor family, a resourceful Wife who observes and copies Dodo's door words to
    steal food, a Husband who is caught, and the Wife saving her family by hiding
    them in a mouse-hole.
  language: English
  quote_policy: summarized
