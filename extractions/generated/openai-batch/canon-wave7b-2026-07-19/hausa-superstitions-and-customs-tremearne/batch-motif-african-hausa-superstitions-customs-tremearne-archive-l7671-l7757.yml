canonical_text:
  quote: ''
  summary: The passage summarizes attributes of witches in Hausa tales and compares
    selected patterns with European, Harvey Isles, and Finnish examples. It describes
    forbidden watching or disclosure, witches’ limited power in towns, the need for
    victims to enter a witch’s power voluntarily, conditional benignity through service,
    uncertain relations to iron, fear of dogs, and a story in which bewitched palace
    animals allow passage after receiving proper food.
  language: English
  quote_policy: summarized
