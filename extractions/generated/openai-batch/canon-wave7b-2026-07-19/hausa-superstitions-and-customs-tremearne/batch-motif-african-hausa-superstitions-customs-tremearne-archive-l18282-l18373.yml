canonical_text:
  quote: ''
  summary: A boy fleeing Dodo is told by Zankallala to stay. A silk-cotton tree grows
    above Zankallala, and birds in it sing that Lion, Hyena, and Dodo fear him. Dodo
    comes, claims his prey, and repeatedly swallows Zankallala, who emerges from Dodo's
    stomach, back, and head; Dodo dies. Zankallala tells the boy he may go safely
    and remarks that one being is more powerful than another. The passage then notes
    published variants involving a girl or boy, warriors, a snake or witch, and final
    rescue by a centipede, hedgehog, or Zankallala. It also quotes an Altair/Boigu
    tale in which Nadai draws out the Dorgai Metakorab, villagers flee, Bu kills the
    Dorgai, and Bu and the Dorgai become a constellation. The range ends with the
    opening of the next tale about Awudu, nicknamed the Strong One.
  language: English
  quote_policy: summarized
