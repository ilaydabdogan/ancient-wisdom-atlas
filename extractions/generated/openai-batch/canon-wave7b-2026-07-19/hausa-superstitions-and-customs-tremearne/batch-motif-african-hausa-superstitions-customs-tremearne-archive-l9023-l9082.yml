canonical_text:
  quote: ''
  summary: 'A maiden is married to the King and seeks help from a Fish. The Fish and
    its relatives bring her provisions. Jealous women in the palace cut off her hands,
    but the Fishes restore them at midnight. When the women later summon her to pound
    guinea-corn, her restored hands shame them. A cited variant is compared in the
    passage to Cinderella: a golden boot identifies the maiden, a Frog plays the Fish''s
    helper role, and a Step-Sister who tries to replace the rightful wife is killed.'
  language: English
  quote_policy: summarized
