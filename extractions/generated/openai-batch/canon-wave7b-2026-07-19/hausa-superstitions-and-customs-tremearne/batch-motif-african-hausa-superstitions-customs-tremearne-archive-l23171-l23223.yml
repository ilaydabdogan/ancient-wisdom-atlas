  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The dancers deny feeling pain while possessed, and the effect of the seizure
    may take some days to wear off; the stated diet in the meantime is kola-nuts and
    water.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
