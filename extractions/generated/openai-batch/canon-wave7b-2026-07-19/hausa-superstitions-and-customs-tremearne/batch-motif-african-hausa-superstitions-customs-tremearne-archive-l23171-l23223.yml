canonical_text:
  quote: ''
  summary: The passage describes a Bori performance in which musicians begin playing,
    dancers move in circles, enter a hysterical or possessed state, mimic a person
    or animal, fall into rigid postures, and may be assisted by other performers.
    The passage says their words and actions are attributed to a possessing spirit,
    which may be identified by a chief mai-bori or by the performer. Sneezing is described
    as expelling the spirit. Some dancers perform self-injuring actions while denying
    pain, and aftereffects may last for days, with kola-nuts and water given as the
    appropriate diet.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the musicians commence, some dancers move round and round in a circle
    with shuffling steps and swaying hips.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The violin strains and scents used by the dancers are described as taking
    effect; the dancer's eyes become fixed and staring, and the dancer becomes hysterical
    with grunts, squeals, convulsive movements, sudden rushes, crawling, or mimicry.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A dancer may mimic the actions of the person or animal whose part he is playing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A dancer jumps into the air and lands flat on the buttocks with legs stretched
    out or crossed, and may remain rigid until each arm is lifted and pressed back
    three times by another performer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dancer's words and actions are said to be due to the spirit by which he
    is possessed; if the spirit is unclear, the chief mai-bori or the performer may
    explain which spirit it is.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: In most cases the dancer sneezes, and the passage describes this as being
    for the purpose of expelling the spirit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Some dancers claw their chests, tear their hair, beat parts of their bodies,
