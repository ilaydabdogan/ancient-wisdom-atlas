  summary: The passage contains a figure caption for flint steels in a leather purse,
    the end of a tale in which a husband escapes a hyena and lion by making the hyena
    dance with song, a brief parallel tale in which a boy escapes animals by playing
    a pipe, and the beginning of “Solomon and the Birds,” where Solomon’s wife sees
    a blood-mixed floor and asks Solomon to kill birds hovering over him for her own
    floor.
