canonical_text:
  quote: ''
  summary: In this passage, a Woman pursues a Boy riding a Horse. The Horse’s tail
    becomes a razor and cuts her, but she continues pursuing and repeatedly wounds
    the Horse’s legs. The Horse promises to carry the Boy home safely, but at the
    city gate the Woman wounds it again and it dies. The Father releases Dogs that
    chase the Woman away, and the Boy buries the Horse wrapped in white cloth. Later
    the Woman transforms into flowers, then into a Horse, and finally into Wind while
    trying to carry the Boy into the air.
  language: English
  quote_policy: summarized
