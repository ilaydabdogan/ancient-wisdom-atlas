canonical_text:
  quote: ''
  summary: 'Editorial notes to Hausa tales identify recurring story patterns and cultural
    details: the Hausa trader as traveller and bargainer; an old woman as the only
    result of a trading trip; a husband walking behind his wife to help and protect
    her; a repeated elder-younger brother pattern; kindness to animals followed by
    animal aid; dogs and roof-nesting birds as household or nocturnal presences; an
    unexplained ring episode linked to a variant; persuasion to sell what is freely
    available; and a stated example of the ''virtue of laziness.'''
  language: English
  quote_policy: summarized
