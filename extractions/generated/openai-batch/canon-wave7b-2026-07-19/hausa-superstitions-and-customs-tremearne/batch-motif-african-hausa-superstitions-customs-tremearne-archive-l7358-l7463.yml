  summary: The passage describes Bori possession performances, fortune-telling, a
    possessed chief woman’s role in a river-fishing rite at Argungu, later regulation
    and attempted suppression of Bori, a contest between malams, magicians, and Masu-bori
    involving a hidden animal, regional mention of Kanuri kwaga, and requirements
    for Bori initiation or treatment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Richardson’s cited account describes a woman performing Boree as believing
    herself possessed, throwing herself on the ground, imitating animal cries, and
    moving in time with a man tapping a kettle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the same account, the possessed woman approaches seated servants, physically
    handles them, and declares each person’s future fortune as good or bad.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that a person possessed often claims to foretell the future.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Argungu Gandi river account, the chief woman drinks a potion and becomes
    possessed before the fishing begins.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Makwashe enters the water first because the demons are said to know him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Gandi river account says that people who enter when the chief woman commands
    it fill baskets with fish, while anyone entering without her instruction may sink,
    fail to return, and die.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage reports that Bori was forbidden in large cities after the Filani
    conquest, later permitted on payment of an annual tax, and later targeted for
    abolition under British occupation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the story of Wake’s contest, a black bull is secretly sealed in a hut;
    magicians and Masu-bori identify it correctly, while malams pray and answer that
    the hut contains a horse; when opened, a black horse appears.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says Bori proper is favored among Hausa, Nupe, and Egbirra people,
    and describes Kanuri kwaga as another kind associated in some cases with sickness
    after sitting under a tree or near water where a bad spirit lives.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that anyone of any age may learn Bori on payment of fees,
    so the right to initiation is not hereditary.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The listed requirements for initiation or treatment include a large new pot,
