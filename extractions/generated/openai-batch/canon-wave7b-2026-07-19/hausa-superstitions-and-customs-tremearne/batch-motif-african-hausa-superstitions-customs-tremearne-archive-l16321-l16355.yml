canonical_text:
  quote: ''
  summary: A condemned Man is instructed to delay his summons, wash with water from
    a gourd, face East, call on God three times, and declare that he is to die because
    the People are killing him, not because God wishes it. When the grave is ready,
    he prays three times; the Eagle answers from the sky and warns that if the Man
    dies the People will obtain no drink. The People interpret this as God speaking
    and release the Man. A cited variant involves a Bull sold for slaughter at Salla,
    feeding Birds, being helped by the Eagle, and the Old Woman being placed in the
    grave instead.
  language: English
  quote_policy: summarized
