canonical_text:
  quote: ''
  summary: 'The passage summarizes a variant of “A Lie and a Spear”: a Malam takes
    a Boy along to hold his Mare, steals three fowls at night, loses the Mare when
    he stops at daybreak to pray, and then follows it back to the Parents-in-Law’s
    house, where he falsely claims he was expelled and accuses the Boy of stealing
    the fowls. The narrator adds a conditional remark about possible Mohammedan influence
    and says the Malam appears worse than the Youth.'
  language: English
