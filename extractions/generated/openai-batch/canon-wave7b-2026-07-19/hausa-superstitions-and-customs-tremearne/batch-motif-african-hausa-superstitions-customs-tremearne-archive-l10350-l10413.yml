  text: The king gives full bundles to He-who-will-not-see and The-Gift-of-God, but
    only a bundle of husks to You-are-wiser-than-the-King, and orders each to bring
    three hundred bundles the next year.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
