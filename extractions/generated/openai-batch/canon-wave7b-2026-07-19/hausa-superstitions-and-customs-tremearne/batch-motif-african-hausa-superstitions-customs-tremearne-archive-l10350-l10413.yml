canonical_text:
  quote: ''
  summary: 'In a Hausa folktale passage, a king sets escalating requirements for three
    named men. Two comply with ordinary productive gifts, while You-are-wiser-than-the-King
    repeatedly exposes the unfairness or impossibility of the king’s commands: husks
    produce only husks, and a bull cannot produce calves. The courtiers then advise
    a plot to dress him richly, dress the king’s son poorly, and have gun-men ambush
    and kill the person in grand clothes.'
  language: English
  quote_policy: summarized
