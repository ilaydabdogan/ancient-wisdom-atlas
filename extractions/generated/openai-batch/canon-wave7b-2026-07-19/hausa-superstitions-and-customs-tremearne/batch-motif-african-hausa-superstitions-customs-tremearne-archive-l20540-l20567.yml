canonical_text:
  quote: ''
  summary: Editorial notes on tales XVIII and XIX define Uivarmu as a caregiving or
    protective woman called “our mother,” relate this term to other figurative kinship
    titles, identify the hare as the true hero in a variant, comment on a favorite
    story ending, and add ethnographic notes on carrying tools, weapons, a slave not
    hearing something, and long muzzle-loading guns.
  language: English
  quote_policy: summarized
