canonical_text:
  quote: ''
  summary: 'The passage describes Hausa marriage ceremonies: speech-opening gifts,
    the husband''s advances and wrestling with the bride, different responses according
    to her virginity, public shaming if she is not judged innocent, pre-marital bathing,
    transfer to the husband, feasting, music and dancing, food gifts, a mock exchange
    involving a stone hidden in porridge, and the beginning of a fourth-day head-uncovering
    rite. Footnotes compare salt as a protective substance and head covering or uncovering
    with practices in other traditions.'
  language: English
  quote_policy: summarized
