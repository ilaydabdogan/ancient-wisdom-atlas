canonical_text:
  quote: ''
  summary: Editorial notes on tales LXXXV and LXXXVI. LXXXV explains the Arabic term
    kiama as meaning resurrection, gives a literal rendering of a phrase about the
    city of God, and notes that an unnamed group would have preferred a father of
    the usual kind. LXXXVI explains a type of hut or vessel, identifies Sa(r)rikin
    Karma as one of the chief's principal slaves, describes communal help in a Hausa
    Harvest Home, explains pestle-and-mortar sounds, and comments that a boot-trying
    episode appears borrowed from foreign sources. It also notes a Boloki story in
    which Libanza goes out with his sister, becomes a blacksmith, and kills The Swallower
    of People by throwing molten iron into his mouth.
  language: English
  quote_policy: summarized
