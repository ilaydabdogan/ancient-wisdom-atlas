  summary: The passage states that a blessing, once given, could not be recalled,
    and says one Hausa origin-legend version resembles the story of Isaac, Jacob,
    and Esau. It then mentions Bawo from Bornu killing a snake that prevented people
    from drinking. A note compares material with a Marghi ordeal at the holy granite
    rock of Kobshi, where litigants make cocks fight; the owner of the winning cock
    wins the dispute, while the defeated cock's master is punished by a divinity and
    finds his hut in flames.
