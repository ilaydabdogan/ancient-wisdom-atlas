  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The mother-in-law tells Spider to spit on the ground and deny doing it; after
    he does so, the gourds release her and seize him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Spider first feels pleased and dances while the gourds sing about him.
  category: action
  evidence_refs:
  - ev:7
