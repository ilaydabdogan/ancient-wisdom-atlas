canonical_text:
  quote: ''
  summary: A mother-in-law visiting a town where spitting is forbidden secretly spits
    at night. The earth complains, and townspeople use two magic gourds to identify
    the culprit. The gourds seize the mother-in-law, then later seize Spider after
    he deliberately imitates the offense in order to obtain them. Spider tries to
    smash the gourds by jumping from a tree, but they move aside; he breaks his back
    and dies.
  language: English
  quote_policy: summarized
