canonical_text:
  quote: ''
  summary: The passage concludes a Hyaena episode in which the Hyaena arrives after
    others have waited and admits that she is the thief. A note compares another story
    in which Spider steals communal corn and frames Hyaena. The main complete story
    tells of Birds who feed on fruit in mud at the middle of a lake; Spider finds
    and eats a fallen fruit, asks to join them, receives borrowed wings, monopolizes
    the ripe fruit, is abandoned in the tree without wings, misjudges the water below
    by throwing a twig, jumps into deep water, and drowns. The passage then begins
    a Hare and Hyaena hunting episode in which Hyaena claims Hare's kills.
  language: English
  quote_policy: summarized
