canonical_text:
  quote: ''
  summary: The passage gives Hausa lines with English translation in which a first-person
    speaker hopes, on waking tomorrow, to find a money-bag full of money and a pile
    of silver behind the hut, placed there by a spider; if not, the speaker hopes
    at least for a bitter gourd. A note explains the gourd’s silver-like dry inner
    skin. The passage also comments that Hausa stories often end with the formula
    suka zona, glossed as “they remained,” and compares it with “they lived happy
    ever afterwards,” while qualifying this by reference to a wife among four wives.
    Figure captions describe a red leather Koran cover and a decorated leather pillow.
  language: English and Hausa
