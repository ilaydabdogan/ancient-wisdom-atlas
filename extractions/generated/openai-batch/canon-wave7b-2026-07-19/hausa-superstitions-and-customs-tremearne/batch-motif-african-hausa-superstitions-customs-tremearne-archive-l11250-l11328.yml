canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a Very-Rich-Man tries to reward a
    Poor-Man with a calabash full of dollars, but the Poor-Man sends it away for flour
    and Malam Abba removes the money. The benefactor observes and frames the result
    as the effect of the man's ill luck and God's making. A brief cited parallel from
    L.T.H. describes a prince enriching the poorest man, who dies upon reaching his
    new house. The passage then begins another tale, in which two sons set out to
    try their fortune; the elder buys useful livestock while the younger buys a scraggy
    dog and later a skinny cat, provoking rebuke and mockery.
  language: English
  quote_policy: summarized
