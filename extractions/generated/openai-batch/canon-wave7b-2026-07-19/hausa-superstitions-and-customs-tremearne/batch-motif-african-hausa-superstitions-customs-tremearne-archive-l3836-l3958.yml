  summary: The passage gives a series of Hausa proverbs about wealth and poverty,
    fixed disposition, fate, repeated actions and consequences, social and kinship
    likeness, appearance, understanding, and self-criticism. It then presents interlinear
    Hausa letters from the Alkali of Lokoja to a white police official concerning
    Aliyu, an alleged assault on a girl, an accused fire-setter who escapes custody
    with handcuffs, and a complaint by Iyuwaje and Amije against the Chief of Gbebe/Gubi,
    followed by an editorial note on the Hausa of the letters.
  language: English with Hausa interlinear text and English glosses
  quote_policy: summarized
