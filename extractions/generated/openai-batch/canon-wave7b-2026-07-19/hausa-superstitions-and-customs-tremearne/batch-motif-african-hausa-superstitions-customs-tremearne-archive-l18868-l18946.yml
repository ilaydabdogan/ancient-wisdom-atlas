canonical_text:
  quote: ''
  summary: A maiden sees an Old Woman or Witch at River Bagajun with many mouths.
    The Witch asks the maiden to rub her; when the maiden does so, the Witch's back
    bursts open and a little basket appears. The Witch gives the basket with instructions
    not to break it when a voice says, "Break, let us divide." The maiden breaks it,
    and many lepers, lame men, cripples, and blind men appear; her father refuses
    her entry into the town and sends her to live in the forest with them. The passage
    then notes a Hausa variant involving a witch-like Old Woman and compares it to
    Grimm's Madam Holle, followed by a Sierra Leone parallel involving a Devil at
    a river, egg choices, rewards, punishments, and resurrection of the good girl's
    mother.
  language: English
  quote_policy: summarized
