canonical_text:
  quote: ''
  summary: 'The passage surveys animal roles in Hausa folklore and ethnographic comment:
    a rain-producing animal, horse helpers against witches, the donkey’s troublesome
    behavior and forest-to-town refuge, tortoise competence, elephant origin from
    pieces of all living things, monkey foolishness, porcupine/hedgehog and wild-cat
    powers including sky transport, and the possible friendliness of snakes, scorpions,
    centipedes, and locusts. Notes compare goat and snake beliefs with Indian, Egyptian,
    and Arabic totemic material.'
  language: English
  quote_policy: summarized
