canonical_text:
  quote: ''
  summary: A woman boils acha in a jar, beats her body so that mouths appear all over
    it, feeds the mouths, and then restores them to one mouth. A boy hidden in a tree
    sees her, is questioned by her, denies seeing anything, then goes to the city
    gate and publicly announces that he saw a woman with many mouths. The woman hears
    him and says he has shamed her in the city.
