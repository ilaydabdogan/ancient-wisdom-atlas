canonical_text:
  quote: ''
  summary: The passage begins with a fragment in which some beings are transformed
    into pelicans and men into big monkeys, followed by an editorial note comparing
    that story with a Koranic story in a Hausa version. It then gives the beginning
    of a tale in which a step-daughter is ordered to wash a caught fish, frees the
    speaking fish so it may nurse its young, is beaten for doing so, and is later
    helped by the fish and its relatives. On the first night of a feast, after being
    given an old cloth while another daughter receives a new one, the maiden receives
    finery from the fish, attends a dance, and is noticed by the king, who seeks to
    marry her.
  language: English
  quote_policy: summarized
