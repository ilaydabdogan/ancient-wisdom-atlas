candidate_motifs:
- id: motif:1
  label: Marriage binding by kin proxies before a religious specialist
  taxonomy_refs: []
  basis: The couple’s relatives, not the couple themselves, attend the malam for the
    binding service.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is a documented ceremonial pattern rather than a mythic narrative
    motif.
- id: motif:2
  label: Ritual smearing or bodily marking before bridal transfer
  taxonomy_refs:
  - initiation
  basis: The bride is smeared with henna before the feast; the passage also says oil
    or grease was formerly used and records an Argungu variant with extended henna
    periods for both bride and bridegroom.
  evidence_refs:
  - ev:3
  - ev:8
  - ev:12
  confidence: medium
  cautions: The taxonomy link to initiation is broad and should be reviewed; the passage
    is an ethnographic rite-of-passage description, not an initiation myth.
- id: motif:3
  label: Delayed conjugal approach and ritual shyness
  taxonomy_refs:
  - initiation
  basis: Bride and bridegroom avoid immediate co-presence; the groom stays away and
    returns after two to seven days, while shyness is invoked to explain resistance
    and separation.
  evidence_refs:
  - ev:4
  - ev:8
  confidence: medium
  cautions: The passage presents social explanation and ceremony; the initiation taxonomy
    mapping is provisional.
- id: motif:4
  label: Feigned bride resistance in transfer, interpreted as marriage-by-capture
    survival
  taxonomy_refs: []
  basis: The passage states that the bride screams and pretends to resist when taken
    to the husband’s house, and the author explicitly says this seems to be a survival
    of marriage by capture, especially because a horse was formerly used.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The marriage-by-capture interpretation is the author’s cautious interpretation,
    not directly demonstrated within the passage.
- id: motif:5
  label: Affinal avoidance of mother-in-law by son-in-law
  taxonomy_refs: []
  basis: The passage states that some barrier exists between the mother-in-law and
    her daughter’s husband, including reluctance to eat food in her house.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage says the extent of avoidance is difficult to determine and
    may be declining.
- id: motif:6
  label: Public proof of virginity followed by gifts or sanctions
  taxonomy_refs: []
  basis: A regional note describes display of a white cloth with signs and presents
    if the bride is a virgin, and pole-and-broken-dish sanctions if she is not.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: This is reported as a regional variant and should not be generalized to
    all ceremonies in the passage.
- id: motif:7
  label: Marriage exchange through fees, gifts, food, presents, and service
  taxonomy_refs:
  - sacred_exchange
  basis: The passage mentions an increased fee, gift provision, food supplied by the
    husband, presents after cloth display, annual presents, and farm service for parents-in-law-elect.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:11
  - ev:12
  confidence: medium
  cautions: The taxonomy label sacred_exchange is used only as a broad exchange category;
    the passage does not explicitly call the exchange sacred.
comparison_claims:
- id: claim:1
  claim: The passage itself cautiously links the bride’s screaming, pretended resistance,
    and former use of a horse with a possible survival of a marriage-by-capture pattern.
  claim_level: same_motif
  target: marriage-by-capture pattern
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The wording is interpretive and cautious; the passage provides no independent
    historical demonstration beyond the reported behavior and former horse use.
- id: claim:2
  claim: A footnote compares the bridegroom’s possible seven-day absence to a Hausa
    story in which a king says he will not go to the woman’s hut until seven days
    have passed.
  claim_level: same_function
  target: L.T.H. ii, 45 seven-day royal delay story
  evidence_refs:
  - ev:4
  - ev:7
  counter_evidence_refs: []
  confidence: low
  limitations: The comparison is brief and only suggests that seven-day absence might
    be complimentary; the narrative context is not supplied.
- id: claim:3
  claim: The passage attributes henna and part of the fee’s conversion into a gift
    to Mohammedan influence, contrasting henna with an earlier oil or grease practice.
  claim_level: historical_contact
  target: Mohammedan or Islamic marriage-practice influence
  evidence_refs:
  - ev:5
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is asserted by the source and not demonstrated in detail
    in this passage.
- id: claim:4
  claim: A footnote notes a Liberian bridal practice of rubbing the bride with animal
    fat as a functional parallel to Hausa oil or grease smearing of the bride.
  claim_level: same_function
  target: Liberian bridal animal-fat rubbing noted by Johnston
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only a short bibliographic comparison and does not
    claim historical contact.
- id: claim:5
  claim: 'The passage presents north-western and Argungu customs as regional variants
    with similar functions: bride transfer, proof or sanction, henna treatment, gifts,
    and service obligations.'
  claim_level: same_function
  target: north-western Hausa and Argungu regional marriage customs
  evidence_refs:
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The variants are footnoted and may not apply directly to the Jemaan
    Daroro account.
