canonical_text:
  quote: "“she screams and pretends to resist”"
  summary: 'The passage describes variants of Hausa marriage ceremonies: kin representatives
    go to a malam for the binding service; the bride is marked with henna, feasted,
    wrapped in white cloths, escorted to the husband’s house, and kept apart from
    the bridegroom for a period. It also discusses ritual shyness, feigned resistance,
    possible older use of oil or grease, mother-in-law avoidance, virginity-display
    customs, broken dishes as sanctions, marriage fees, gifts, and service obligations
    in regional variants.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: In one account, relatives of both parties, rather than the contracting parties
    themselves, go to the malam, where the binding service is performed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:2
  text: The bride is smeared with henna four days before a feast held at the house
    of a female relative, identified uncertainly as an uncle’s house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: The bride attends the feast, while the bridegroom does not.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The bride is taken to her husband’s house wrapped in white cloths and accompanied
    by bridesmaids, while the husband has gone temporarily to another house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At a feast on the next afternoon at the bride’s uncle’s house, neither bride
    nor bridegroom attends; the bride is fed by her mother with food supplied by the
    husband.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The husband returns to his house after a period of from two to seven days
    and then lives with his wife.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the bride is taken to the husband’s house, she screams and pretends to
    resist; the passage also states that a horse was formerly used and may still be
    used in some districts.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The bride’s apparent reluctance is explained as shyness; the passage says
    the girl is expected to resist henna application and the bridegroom is compelled
    to keep away from his wife.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Elaborate ceremonies and expected shyness are said not to be necessary for
    previously married women, except that wives still scream when going to a new home.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says the marriage fee has increased and that part of it goes toward
    a gift in accordance with Mohammedan ideas.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The extent of avoidance between a mother-in-law and her daughter’s husband
    is described as difficult to determine, but some barrier is said to exist, including
    reluctance by the husband to eat food in her house.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: A regional footnote says that parents stand outside the house when the bridegroom
    enters, two of his friends hold the bride’s legs, and if the bride is a virgin
    a white cloth with signs is shown to the parents and presents are brought.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The same footnote says that if the bride is not shown as virgin, the husband
    may plant a pole in front of the hut, break her dishes, and hang them on it, with
    the stated purpose of making her want to leave and affecting return of the marriage
    fee.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: The Argungu variant says men serve on the farms of parents-in-law-elect for
    years, give annual presents, and that the bride is smeared with henna for seven
    days, the bridegroom for four, before she is taken to his house by the best man.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: The passage states that henna is a Mohammedan introduction and that oil or
    grease seems formerly to have been used instead, illustrated by a proverb about
    smearing a bride with oil.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: A footnote compares the Hausa oil or grease practice with a Liberian practice
    in which the bride is rubbed with animal fat.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: A footnote states a gendered saying about women having nine “shames” and men
    one, with losses of these “shames” after the wedding, after childbirth, and after
    adultery.
  category: speech
  evidence_refs:
  - ev:9
