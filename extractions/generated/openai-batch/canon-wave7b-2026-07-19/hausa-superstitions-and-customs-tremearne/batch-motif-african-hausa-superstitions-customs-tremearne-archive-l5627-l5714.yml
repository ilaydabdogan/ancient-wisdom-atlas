canonical_text:
  quote: ''
  summary: 'The passage describes several death, burial, and royal succession practices:
    a dead chief''s body is carried around relatives to indicate a successor; among
    the Kororofawa a king is killed after a fixed term and the king-slayer may become
    chief after receiving chiefly emblems and passing a cap test; contemporary burial
    customs include mourning, washing and wrapping the body, grave forms, and grave
    goods. Footnotes compare corpse-divination with a Gond practice and mention neighboring
    pot burial and Gwari chief burial customs.'
  language: English
  quote_policy: summarized
