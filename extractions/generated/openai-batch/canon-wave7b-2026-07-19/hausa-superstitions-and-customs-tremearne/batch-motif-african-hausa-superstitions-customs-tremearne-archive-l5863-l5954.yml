canonical_text:
  quote: ''
  summary: The passage describes Magazawa spirit religion as involving sacrifices
    to named spirits without images or fetishes. It lists several spirits, their domains,
    attributes, offerings, and dangers, including forest, hunting, agriculture, water,
    echo, evil, and storm-rainbow spirits. It also briefly discusses possible Hausa
    nature myths involving the sun, Heaven, a gate, a youth, and a spider.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Magazawa are described as pagan Hausas who sacrifice to certain spirits
    and do not make images or fetishes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kuri, also called Rago, is described as a male spirit who barks like a dog,
    wears a goat-skin, receives a young red he-goat as the proper sacrifice, and eats
    human beings.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Uwardowa is described as a female Forest-Mother and goddess of hunting, with
    a red she-goat or red cock as the appropriate offering.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Uivargona or Uwardawa is described as a female Farm-Mother or Corn-Mother
    and goddess of agriculture who prefers white-coloured victims.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The spirit of corn is said to be incarnate in a bull, and at the first of
    the New Year a man wears a horned mask and dances to promote a good crop.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sa(r)rikin Rafi or Kogi is described as a water spirit, perhaps the same as
    Dodo, and the passage states that a virgin appears once to have been sacrificed
    to him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ayu is described as a spirit living in water that drags people down; the same
    name is also given to the manatee.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Uivayara is described as a spirit that kills the mother and her new-born child.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Echo is attributed to supernatural agency and is sometimes called Iblis, devil,
    or Kurua, meaning soul, spirit, or shadow.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: Fatalua and Magiro are described as evil beings or ghosts, and Kaura is said
    to be an evil spirit that makes men fight.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Gajjimare is described as the god of rain and storms, shaped like a snake
    and double-gendered, with a red male part and a blue female part.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: Gajjimare is said to live in storm-clouds, come out at night, inhabit wells
    and watering-places, and be connected with the practice of keeping a pot full
    in every house.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage says Gajjimare may be represented by the water-serpent killed
    in the Daura legend, and is sometimes said to be Uwardowa’s husband and Kuri’s
    father.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: Other names of the rainbow are given as Masharua, meaning water drinker, and
    Bakkan gizzo, meaning spider’s bow.
  category: other
  evidence_refs:
  - ev:10
- id: obs:15
  text: The passage reports an idea that the sun comes out of a great gate opened
    for it by Heaven.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: The passage states that in a variant to Story 95, the youth and the spider
    pass beyond; the passage identifies this variant as apparently a sun-myth of genuine
    Hausa origin.
  category: sequence
  evidence_refs:
  - ev:12
