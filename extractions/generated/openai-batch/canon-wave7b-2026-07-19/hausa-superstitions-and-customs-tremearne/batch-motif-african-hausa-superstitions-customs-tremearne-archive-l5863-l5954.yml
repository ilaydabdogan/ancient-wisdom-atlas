comparison_claims:
- id: claim:1
  claim: The passage explicitly compares Kuri to Pan, suggesting a cautious functional
    or descriptive analogy between Kuri and a goat-associated male rustic deity.
  claim_level: same_function
  target: Pan
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: low
  limitations: This is the author’s comparative gloss; the passage does not provide
    evidence of historical contact or shared origin.
- id: claim:2
  claim: The passage presents the bull incarnation of the corn spirit as part of a
    wider comparative agricultural pattern, with a footnote reference to Frazer and
    Egypt.
  claim_level: same_function
  target: comparative corn-spirit or agricultural bull symbolism
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: low
  limitations: The comparison is supplied by the ethnographer and footnote; the passage
    does not establish the mechanism of similarity.
- id: claim:3
  claim: The passage cautiously links Gajjimare with the water-serpent killed in the
    Daura legend as a possible representation of the same or related serpent-rainbow
    figure.
  claim_level: same_motif
  target: Daura water-serpent legend
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: low
  limitations: The source uses tentative language, saying Gajjimare may be represented
    by that water-serpent.
- id: claim:4
  claim: The passage states that the idea of the sun emerging from a great gate opened
    by Heaven is known elsewhere in West Africa, supporting a cautious regional same-motif
    comparison.
  claim_level: same_motif
  target: West African sun-gate motif, including the Gold Coast comparison cited by
    the source
  evidence_refs:
  - ev:12
  counter_evidence_refs:
  - ev:11
  confidence: medium
  limitations: The source also notes possible importation of the Fufunda story because
    of its ending, so the local status of that particular story is uncertain.
