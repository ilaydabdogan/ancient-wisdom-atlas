  quote: '"Do you want nought but contentment?"'
  summary: The passage ends a tale in which a man who wants only a wise and contented
    mind is brought before Mohammed and rewarded with riches, children, slaves, and
    kingship. The rest of the passage consists of ethnographic and explanatory notes
    on tales, including comments on Solomon being lectured by a bird, a scalp lock,
    a prince-like rank, an execution method, a man connected to a tree, Cow-Filani
    shelters, a calabash on a woman’s head, white people with long hair, gourds used
    as containers and tools, holiness and fertility, respect gestures, and high-ranking
    women riding.
  language: English
