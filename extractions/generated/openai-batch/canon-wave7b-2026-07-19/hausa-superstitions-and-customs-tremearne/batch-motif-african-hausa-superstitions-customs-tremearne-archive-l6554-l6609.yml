canonical_text:
  quote: ''
  summary: The passage captions stamped decorative patterns, then summarizes a Dodo
    story in which two rival girls travel to have their beauty judged, the elder causes
    the younger to be lost in deep river water, the lost maiden appears to her brother,
    and a youth disguises himself as a leper to enter the water and kill Dodo while
    pretending to shave him. The youth marries the maiden, is treated as if still
    a leper, reveals himself, and requires her to obtain a young lion's tail before
    all ends happily. The passage also notes a fabulous bird, Jipillima, which eats
    humans and whose droppings heal magically, with one narrator identifying it with
    fufunda.
  language: English
  quote_policy: summarized
