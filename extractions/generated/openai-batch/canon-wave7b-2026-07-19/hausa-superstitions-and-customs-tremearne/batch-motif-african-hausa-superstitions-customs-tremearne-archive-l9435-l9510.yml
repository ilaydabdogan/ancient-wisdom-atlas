canonical_text:
  quote: THE  FRIENDLY  LION
  summary: A husband brings home a locust wrapped in leaves; when it escapes, he orders
    his pregnant wife to follow it. She pursues it until night, enters a hollow tree,
    and gives birth to a son. The boy grows near a lioness and her whelp, receives
    meat from them, and becomes close to the whelp. The lioness kills the boy's mother,
    but the whelp recognizes her and helps bury her. Later, the grown lion kills the
    lioness; the youth refuses to eat her, and they bury her too. The youth leaves
    for town to marry, and the lion obtains clothing, money, and goods for him by
    attacking traders. After the youth marries, the lion visits his house at night,
    frightening the wife. The passage also includes a non-narrative caption for an
    illustration of a decorated gourd.
  language: English
  quote_policy: quoted
