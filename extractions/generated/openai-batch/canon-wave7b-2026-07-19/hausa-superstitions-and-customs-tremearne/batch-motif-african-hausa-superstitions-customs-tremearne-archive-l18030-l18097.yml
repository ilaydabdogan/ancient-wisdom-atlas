canonical_text:
  quote: ''
  summary: The passage begins with a variant note in which girls fall from a hut roof,
    break bones, and survive, and with an editorial comparison to the English story
    of “The Three Little Pigs.” The main tale tells of an Old Woman whose coughs become
    children, her death and the children’s death, their search for a father in the
    next world, and a Porcupine who has the Old Woman present him as their father.
    The Porcupine proves the claim by having each child hold one quill, the number
    of quills matching the children. He instructs them to pluck and bury their quills
    after his death. Those who bury the quills receive cattle after seven days; those
    who keep the quills in huts are killed by them and do not rise again.
  language: English
  quote_policy: summarized
