canonical_text:
  quote: ''
  summary: Notes explain field-watchers on raised platforms and bird-scaring strings;
    define Aljannu as jinns or demons, apparently good spirits in the cited tale;
    describe a father restoring favor after profit, recurring hostility between chief
    and rival wives, and demons angered by an uninvited woman. Further notes describe
    clothing that impedes movement, danga fencing materials, eating inside the hut,
    common blindness and lameness, and a thorn-bush healing problem connected with
    dangerous prickly plants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A crop watcher sits on a raised platform on poles high enough to see over
    the fields.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: When dog-faced baboons come in numbers, a watcher may lose his life if he
    tries to drive them away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For birds, strings are tied on sticks above corn, and watchers, usually boys,
    pull the strings back and forth and call.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Aljannu is glossed as “jinns” or “demons,” and in this note they are said
    to appear as good spirits rather than evil ones.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A father is described as taking a female figure back into favor after having
    made a profit out of her.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The tales are said to use different mothers: a chief wife and a rival wife,
    who are consistently hostile to each other.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Demons are described as angry because a female figure came among them uninvited.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A long tobe and loose trousers are said to impede movement.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: A danga fence is made of grass-mats, twigs, or canes, supported by posts that
    usually stick out at the top.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: A woman is described as eating inside the hut rather than outside with the
    men.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: Cooked food is placed in calabashes and covered with a round mat.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Blindness and lameness are described as common in Hausaland, with lameness
    linked to leprosy or jiggers damaging the feet or toes.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: The juice of the euphorbia is identified as a cause of blindness, while the
    note questions why a thorn-bush should heal the complaint because prickly trees
    would be dangerous.
  category: attribute
  evidence_refs:
  - ev:10
