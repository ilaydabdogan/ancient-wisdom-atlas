  summary: Editorial notes to Hausa tales explain a bleeding woman appearing in two
    halves, dogs eating her flesh, dangerous blood possibly becoming a witch, public
    and palace settings, a stool, obstacles and Death clearing a way, the meaning
    of Rago as ram or Terrible One identified with Kuri, a ram- or he-goat-headed
    god, and details of entrances, council meetings, processional spaces, and rank
    etiquette.
