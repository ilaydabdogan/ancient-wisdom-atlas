canonical_text:
  quote: Solomon is said to have known the bird-language.
  summary: 'A series of notes explains details from Hausa tales and customs: hiding
    in a tsaria under sleeping places, co-wife property and marital turns, hyaenas
    attacking sleepers and infants, a guinea-corn stalk object, avoidance of a husband''s
    name, widow ceremonies, an address to a hyaena, Solomon''s bird-language, women''s
    floor-beating with songs, and an embedded variant in which the King of the Birds
    asks Solomon about riches, children, and a wise contented disposition.'
  language: English
  quote_policy: quoted
