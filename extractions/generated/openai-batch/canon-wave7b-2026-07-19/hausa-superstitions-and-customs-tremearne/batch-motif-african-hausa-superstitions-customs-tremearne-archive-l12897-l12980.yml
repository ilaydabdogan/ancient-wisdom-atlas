canonical_text:
  quote: ''
  summary: 'The passage first gives comparative notes on Sicilian and Danish tales
    in which a woman loses or injures a male partner through a spell-medium or knife
    and later recovers him. It then begins a Hausa tale: a childless wealthy man seeks
    a charm, receives instructions from a Malam to live in the forest and earn enough
    to buy a slave-wife, and has a son. The son grows up, accompanies a king''s son
    during courtship, is made to hold the horse, is praised by women for his beauty,
    and then asks his father for clothing so he will not appear like a slave.'
  language: English
