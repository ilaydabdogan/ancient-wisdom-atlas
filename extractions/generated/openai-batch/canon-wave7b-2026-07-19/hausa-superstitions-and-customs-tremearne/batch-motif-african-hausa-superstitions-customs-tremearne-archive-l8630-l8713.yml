canonical_text:
  quote: ''
  summary: The passage describes Hausa naming practices based on birth order, survival
    after sibling deaths, animal names, and protective or degrading names. It also
    describes charms, hair treatment, and a wife's avoidance of her husband's name,
    with discussion of sorcery-related vulnerability through names, hair, and nail-parings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage gives birth-order names: a son after two daughters is Tanko,
    a daughter after two sons is Kandi, and the next child after twins may be Gumbo;
    a sole surviving child after infant deaths may be Be ran, glossed as “left.”'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Animal names are sometimes used as personal names; Kura, glossed as hyaena,
    is described as fairly common.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: When several children of one mother have died in infancy, later-born children
    are given measures intended to avert the same fate.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The protective measures include the special name Ajuji, a leather belt ornamented
    with brass rings worn on the neck and waist until adulthood, and special shaving
    or dressing of the hair.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The mother may also shave her hair: one side after three child deaths, or
    the whole head after four.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports that in other peoples an opprobrious name may be chosen
    for a child born after other children have died, and it gives examples and possible
    degrading etymologies for several names.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wives must not address their husbands, especially first husbands, by name
    or tell the name to others.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A wife usually calls her husband “Master of the House,” or may use a nickname
    or title.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says witches can pronounce the husband’s name with impunity, or
    at least the prohibition does not seem to apply to them.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The husband’s name is described as part of its owner and a vulnerable point
    for an evil-disposed wife; hair and nail-parings are buried because anyone can
    harm the owner through them.
  category: relationship
  evidence_refs:
  - ev:6
