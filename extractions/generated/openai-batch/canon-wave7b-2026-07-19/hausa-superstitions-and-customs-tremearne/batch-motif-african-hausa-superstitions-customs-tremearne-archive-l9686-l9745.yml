canonical_text:
  quote: ''
  summary: A figure called Lies or the King of Lies deceives a king by placing a buzzing
    wasp in the grave of the king's dead mother and claiming she is speaking and will
    rise. He then persuades the king that the dead father is restraining the mother
    and would threaten the king if he emerged, leading the townspeople to pile stones
    on the grave and the king to pay Lies to leave. A stated moral says falsehood
    is more profitable than truth. A variant contrasts a son named Falsehood and a
    daughter named Truth in a begging deception involving hidden corn.
  language: English
  quote_policy: summarized
