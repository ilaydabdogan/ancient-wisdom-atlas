  quote: ''
  summary: An Old Woman earns money by selling boiled herbs, buys a bull-calf, and
    raises it into a large bull. The Spider sees the bull and reports it to the King
    after demanding the King's ear as payment for news. The King sends men to loose
    the bull, but the bull refuses; the men then propose beating the Spider, who begins
    to protest.
