canonical_text:
  quote: ''
  summary: The passage opens with a fragment in which a son kills his mother, then
    summarizes another tale of a mistreated girl helped by her stepmother and later
    married to a king. The main tale, titled as the origin of the white-breasted crow,
    begins with a king denying his son and ordering him killed. The minister’s son
    helps spare him, though one hand is cut off as false proof. A female leper heals
    the boy’s hand with water and licking, raises him, and helps him meet successive
    paternal demands to marry the Ant’s Daughter, the Daughter of the King of the
    Thicket, and the Daughter of the King of the Water. The excerpt ends when the
    father demands the Daughter of the King of the Heavens.
  language: English
  quote_policy: summarized
