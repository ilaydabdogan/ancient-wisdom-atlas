canonical_text:
  quote: ''
  summary: A girl-friend takes a girl at night to the place where she ate dogs and
    then to a witch. The witch makes a charm and beats the girl's back until nine
    dogs emerge. At the king's palace, women pound corn and their pestles sing for
    the dogs to come out. The girl appears with a silver pestle; the Sun praises her
    beauty and the Earth offers to make way for her. She speaks to the king, who takes
    her as sole wife, rules the world with her, and kills his other wives. A noted
    variant describes similar step-sisters, a She-Dodo curing the girl by bringing
    seven dogs out of her throat, and rival women punished after falsely claiming
    she could only bark.
  language: English
  quote_policy: summarized
