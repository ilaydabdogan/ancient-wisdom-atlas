canonical_text:
  quote: ''
  summary: A boy learns that the king's palace has three guarded entrance halls with
    animals and slaves given unsuitable provisions. At night he brings fitting food
    and gifts, passes through the halls, finds the marked door, and reaches his rival's
    mother. The king later sees what has happened, abdicates, and names the boy king.
    A variant and the editor's comparative note describe similar patterns of appeasing
    animal and human guardians with appropriate gifts or exchanged foods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The palace approach is described as three entrance halls containing ten watch-dogs,
    ten slaves, and ten horses, with horses given ox-bones, dogs given grass, and
    slaves given only potash to smoke.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: At night the boy has ten bulls killed, obtains grass, ten tobes, and ten rolls
    of tobacco, and goes toward the king's palace.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The boy gives grass to horses, bulls' heads to dogs, and tobes plus tobacco
    to slaves; the animals and slaves respond favorably or do not stop him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The boy looks for the door where his blind is hanging, enters it, finds his
    rival's mother, sprinkles scent, and sits down.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the morning the king sees the slaves with tobes, the dogs eating bulls'
    heads, and the horses with grass, then tells the people to declare the boy king
    and says he abdicates.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The ex-king's son comes to pay homage, and the people remark that rivals for
    women have become related through the boy taking the father's place.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A variant has a youth seeking the king's chief wife; he uses scent through
    an old woman, receives kola-nuts and directions, and gives appropriate gifts or
    food to human and animal guardians.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the variant, the king suspects something and the youth and wife escape
    through the help of companions, including a robber, a soldier, and another companion
    who cuts out a canoe.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage's note states that appeasing animal and other guardians with food
    or another requirement is a frequent folk-tale incident, especially in tales of
    the Cupid and Psyche cycle.
  category: other
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage's note gives an Egyptian Arab tale in which a hero seeking the
    singing rose changes flesh and clover placed before a kid and a dog, enabling
    him to complete his quest.
  category: sequence
  evidence_refs:
  - ev:10
