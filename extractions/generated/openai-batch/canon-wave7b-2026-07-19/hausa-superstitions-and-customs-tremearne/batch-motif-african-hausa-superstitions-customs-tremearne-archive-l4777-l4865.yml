canonical_text:
  quote: ''
  summary: 'An English ethnographic account reports Zaria marriage customs: consent
    is sought from the girl and her father, cowries are paid and distributed, the
    bride remains in her father’s house in white cloth with face covered and hennaed
    nails, attendants accompany and help force her ceremonial entry into the husband’s
    house, the groom stays away until the ceremonies end, and the couple then eats
    together. Footnotes mention a Rahazawa white-cock gift and compare some practices
    to Celtic, Manx, and Welsh wedding customs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The reported modern Zaria account says that a suitor first asks the girl,
    then asks her father; if both consent, the suitor brings cowries that the father
    distributes among family members, the girl’s mother, and relatives.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A later negotiated payment is described; the father gives the money to the
    girl’s mother to buy cloths and food for the feast and for the bride, and the
    bridegroom buys the white cloth the bride will wear.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: For about five to seven days, the bride remains in her father’s house, wears
    a white cloth, covers her face, has henna-stained nails, and is visited by girls
    who play with her, teach her, and eat food provided at the husband’s expense.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A footnote states that among the Rahazawa, described as pagan Filani, the
    girl receives a white cock from the bridegroom, releases it, and it becomes sacred;
    the note also says another explanation for chicken gifts is that parents could
    not afford goats.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After about seven days, the bride’s relatives seize her and take her to the
    husband’s house; the husband remains inside, while his friends come out and try
    to get her to enter, but she refuses.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Money is given to the bridesmaids; one takes the bride’s hand and another
    pushes her until she enters the house, while women enter singing and clapping
    and the bridegroom’s friends throw money among them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The bridegroom stays at his best-man’s house for five or seven days; if he
    returns early, the bridesmaids drive him away, but around the sixth day he pays
    them, declares the ceremonies ended, and the husband and wife eat food together.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A footnote compares the Hausa customs to a Blackheath wedding report that
    describes Celtic traditions of carrying a bride over a threshold as capture and
    possession, bride-made broth, drinking from the same shell, and Welsh carrying
    off of the bride.
  category: other
  evidence_refs:
  - ev:7
