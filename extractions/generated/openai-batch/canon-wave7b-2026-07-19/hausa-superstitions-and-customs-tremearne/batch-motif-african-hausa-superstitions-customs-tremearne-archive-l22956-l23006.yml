canonical_text:
  quote: ''
  summary: The passage lists numbered entries concerning tribal or scarification marks,
    parents' places of origin, and explanations for selected marks. It records facial,
    navel, abdominal, chest, and mouth patterns; possible or stated obliteration of
    earlier marks; one account of marks imposed during enslavement; one explanation
    of abdominal cuts as preventing internal bleeding; and one ornamental description
    of Gude's marks.
  language: English
  quote_policy: summarized
