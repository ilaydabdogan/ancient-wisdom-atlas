canonical_text:
  quote: ''
  summary: Notes to tale XXII explain that a house is a compound of huts, with each
    wife normally having a separate hut; the described act is interpreted as a deadly
    insult meaning the occupier is worthless. Another note says the rooster remained
    the principal person because the original quarrel concerned him. A further note
    identifies the word goro as kola-nut and says it is used similarly to alkaivali
    in this sense.
