canonical_text:
  quote: ''
  summary: 'The passage summarizes varied Hausa accounts and scholarly notes about
    Dodo: as a slain beast whose defeat leads a youth to marriage and chieftaincy;
    as a water-god or forest being; as an evil spirit or ghost unable to cross running
    water; as a shapeshifting, giant, hairy, tailed, man-eating being; and as a being
    connected with human wives, feared offspring, and proof tokens from a slain enemy.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A youth is said to kill the dodo or fetish lion, marry the princess, and become
    chief of the town.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lady Lugard is reported as saying that Dodo signifies the King of Beasts and
    may apply to large wild animals such as rhinoceros or elephant; the passage also
    notes Dodo's keen smell as an animal attribute.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that in another tale a bird is the fearsome object that
    frightens women and makes men run away, and that this story type is found in many
    countries, including Scotland.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some stories describe Dodo as a water-god who can give a charm or safe-conduct
    allowing a human being to enter water without drowning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Other stories give Dodo a house in the forest and say that he cannot cross
    running water.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Canon Robinson's Dictionary defines Dodo as an evil spirit or spirit of a
    dead man that walks on the day of death, disappears the same evening, appears
    in trees, and catches men.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says Dodo can assume human shape, that one story gives the reverse
    transformation, and that Dodo is even called a man of men.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Dodo is compared to a witch in being afraid of dogs and is said to take a
    witch's place in some stories.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Dodo is described as a giant who stoops to enter houses, has very large body
