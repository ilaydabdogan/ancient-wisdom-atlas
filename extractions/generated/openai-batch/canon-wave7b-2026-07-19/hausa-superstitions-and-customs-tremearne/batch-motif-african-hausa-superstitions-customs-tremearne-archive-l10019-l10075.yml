canonical_text:
  quote: ''
  summary: The Wife says the ground-nuts should be ripe and wants to go to the farm.
    Spider refuses, goes himself, and steals ground-nuts from the Half-Man's farm.
    The Half-Man discovers the theft, makes a trap with a Rubber-Girl, and hides.
    Spider approaches the female-looking trap, touches and attacks it repeatedly,
    and becomes stuck by his hands, feet, and head. The Half-Man prepares a tamarind
    switch with fire and grease, beats Spider, releases him, and warns him not to
    return. A brief variant says Spider is caught by a female Half-Being, released
    under a silence condition, breaks the promise, and escapes her attempt to kill
    him.
  language: English
  quote_policy: summarized
