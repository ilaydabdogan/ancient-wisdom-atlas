  quote: ''
  summary: A Jackal and later a Monkey climb a kainya tree and eat fruit. A Camel
    asks each to pick fruit for him. The Monkey grows tired, insults the Camel, is
    insulted in return, then is seized, bound, and carried off. Spider and Lion each
    hear the Monkey's explanation and say he was wrong. Jackal, described as the Monkey's
    friend and very cunning, offers to arbitrate, asks the Camel to loosen the rope
    first, and begins a judgment as the excerpt breaks off.
