canonical_text:
  quote: ''
  summary: A hawk aids the bird side in battle by using an egg and a string blind
    to make an elephant and the beasts believe that the elephant is badly injured;
    the rooster promises the hawk a future young bird as reward. Variant notes summarize
    related animal-conflict tales. A goat and her male kid, lost near sunset, enter
    a hyaena's house; while grinding grain, the goat leads a boast-song and the kid
    answers in chorus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Rooster calls for an attack, and the Commander of the Birds comes and
    salutes him as the opposing forces approach.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Hawk takes a string blind and a Hen's egg, flies to the Elephant, and
    breaks the egg on her head.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Hawk announces that the Elephant's head is broken; after touching her
    head with her trunk, the Elephant says that her head is broken.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Hawk throws the string blind over the Elephant and announces that her
    inside is falling out; the Beasts of the Forest look, believe it, and run away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The Rooster promises the Hawk a present for fighting well: whenever the Rooster''s
    wife has young, the Hawk may come and take one as the Rooster''s obligation.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'The passage gives variant notes: one variant makes the Elephant and Cock
    rival suitors for a Woman; another has Birds help a Bull against an Elephant by
    flying in the enemy''s eyes while the Bull gores him; a Hyaena drummer escapes,
    later finds the Elephant dead, and eats him.'
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: A female Goat lives with her male Kid; while walking they lose the road before
    sunset and come to a house where a Hyaena is with her Cubs and welcomes them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Inside the house, the Hyaena begins grinding grain; the Goat offers to relieve
    her, says a female is not treated as a guest, takes the stone, and grinds while
    the Hyaena watches.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The young Goat becomes afraid, thinks the Hyaena is going to seize him, and
    stands close to his mother.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Goat tells the Kid to take up a chorus when she sings.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Goat sings that she has killed ten Elephants, ten Lions, ten Leopards,
    and ten Hyaenas; the Kid answers that it is true.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Kid warns the Goat not to speak of killing Hyaenas because the Hyaena
    might run away and leave them without food; the Hyaena hears and asks what the
    Goat said, and the Goat begins the song again.
  category: speech
  evidence_refs:
  - ev:11
