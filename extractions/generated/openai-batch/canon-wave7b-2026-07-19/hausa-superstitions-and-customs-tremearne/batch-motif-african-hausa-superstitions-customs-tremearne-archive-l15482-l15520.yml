  summary: The excerpt first closes a tale in which a boy displays silver and gold,
    is accepted by a maiden as husband, returns home, and receives gifts with the
    maiden. An editorial note says this tale and the next have many close variants.
    The next tale begins with a poor hunter and his son hunting jerboas; after one
    escapes, the angry father strikes and abandons his bleeding son. A rich childless
    man then comes along.
