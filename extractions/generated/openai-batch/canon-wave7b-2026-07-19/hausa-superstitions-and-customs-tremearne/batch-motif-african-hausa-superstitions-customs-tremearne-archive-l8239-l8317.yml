    to make a mixture for her cure.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator gives the feverish girl quinine; after she recovers, the malam
    claims credit while also having advised her to swallow the quinine.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: For hiccoughs, the names of seven liars are written on a board, the ink is
