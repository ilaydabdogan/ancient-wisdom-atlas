canonical_text:
  quote: ''
  summary: The passage reports Hausa charms and potions for protection from weapons,
    bullet-rebounding protection, healing through ink washed from a prayer-board and
    drunk with water, a hiccough cure using the names of seven liars, childbirth charms
    involving demon material and herbs, tattoo charms, a food-summoning charm, and
    a potion ingredient taken from a lightning-struck tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A malam offers charms said to protect wearers from wounds by arrows or other
    weapons; the narrator proposes a shooting test, and the patrol men later set out
    covered with charms.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fruit of the small dundu tree is said to be ground up and drunk with water
    to prevent sword wounds; other decoctions are said to protect against arrows or
    clubs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A special kind of charm or potion, named in the passage as sha bard, is said
    to make bullets harmless and cause them to rebound against the shooter.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The narrator's cook had fought against British troops at Kano, had been defeated,
    and still retained strong faith in native charms.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A girl with fever sits on a wharf beside a calabash of dirty-looking water;
