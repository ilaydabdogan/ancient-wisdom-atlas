canonical_text:
  quote: ''
  summary: A king unknowingly eats human flesh after a hawk drops it into his soup.
    He searches for the same taste, first through animal meat and then by killing
    a slave, after which he consumes people of his household until they are gone.
    The city people flee, and the king begins eating his own body until only bones
    remain. He later kills a trader but is too weak to carry the corpse and dies.
    The passage also includes figure captions for spurs and an iron bell tied to a
    horse's mane, plus a brief note on a variant.
  language: English
  quote_policy: summarized
