canonical_text:
  quote: ''
  summary: A Spider tries to carry away a ram hidden in a basket. The Malam discovers
    the ram, ties the Spider at the pen entrance, and beats him. During the night,
    the Spider deceives a greedy Hyaena by claiming he has been tied there because
    he grew tired of abundant food; the Hyaena frees him and takes his place. The
    Malam beats the Hyaena, who later escapes and searches for the Spider. The passage
    then gives variants and comparative notes, followed by the beginning of another
    tale about Little Fool.
  language: English
  quote_policy: summarized
