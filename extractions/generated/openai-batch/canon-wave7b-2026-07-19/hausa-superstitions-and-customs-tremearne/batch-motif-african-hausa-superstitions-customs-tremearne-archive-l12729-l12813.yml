canonical_text:
  quote: ''
  summary: 'A father beats and constrains his daughter to prepare for the coming of
    a male visitor. The visitor, identified as the Son of the King of Agaddez, arrives
    at night through the roof, receives kola-nuts and scent from the girl, and produces
    silver wherever he spits. Women of the house later place needles in the bed, and
    the visitor dies when he alights on them. His father has the girl''s parents tortured
    to death, but spares and shelters the girl. A variant replaces the prince with
    Ba-Komi, or “Nothing”: a rival wife''s daughter puts thorns on the roof, injuring
    him and reducing his gifts. Lahidi then seeks medicine for him, reaches a great
    Kainya tree in the forest, and hears a Jipillima complain that it has eaten only
    ninety-nine men that day.'
  language: English
  quote_policy: summarized
