  quote: ''
  summary: A tree-associated being obtains clothes through a slave, emerges from a
    tree as a man, visits wives, undergoes marriage ceremonies, and is described as
    having become a man. The surrounding ethnographic commentary compares this with
    miraculous births, tree-life connections, Mota fruit or animal conception stories,
    Batau’s tree-related conception, Indian tree or object marriages, and a note on
    giants such as Barbushe.
  language: English
  quote_policy: summarized
