canonical_text:
  quote: God had given them some alleviation of their distress, but they were not
    thankful
  summary: A lame man and a blind man try to combine their abilities in order to flee
    a witch. The witch injures the blind man, and the two men separate into a thorn-bush
    and a hollow Monkey-bread tree. Each receives partial restoration, but after they
    return to their hiding places seeking complete cure, their impairments return
    and both die. The narrator states that God had given them alleviation but they
    were not thankful. The editor then compares the tale to a Grimm story about a
    dissatisfied goldsmith, and the line range begins the next story about a man with
    three wives who practice magic.
  language: English
  quote_policy: quoted
