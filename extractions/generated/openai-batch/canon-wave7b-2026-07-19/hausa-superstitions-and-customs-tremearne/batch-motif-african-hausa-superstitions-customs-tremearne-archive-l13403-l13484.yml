canonical_text:
  quote: ''
  summary: In the end of one tale, a woman puts on a loin-cloth after being told she
    will have a son. A husband takes three wives to the farm, sings to the loin-cloth
    wearers, and they work with unusual speed and force. The Chief Wife removes her
    uncomfortable loin-cloth, becomes tired, and realizes the cloth was used to make
    them work hard; the other wives also remove theirs, and the husband admits the
    trick. A variant says the cloths are meant to make the wives work like men, without
    a childbirth charm. In the next tale, a poor Chief Wife travels into the forest
    at night, asks God for shelter, food, and a bed, and receives them. A Dove tells
    her to make and drink soup. A Hyaena asks entry and is refused. Dodo later arrives,
    is admitted through successive doors while the woman hides beneath the bed, sleeps
    there, and in the morning leaves silver, clothing, and other goods for her before
    departing.
  language: English
  quote_policy: summarized
