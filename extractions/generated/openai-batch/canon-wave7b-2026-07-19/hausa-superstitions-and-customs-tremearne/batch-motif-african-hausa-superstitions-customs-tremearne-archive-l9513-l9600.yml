canonical_text:
  quote: ''
  summary: A friendly Lion, wounded by being exposed in a house, withdraws to the
    forest and gives the Youth a roar-signal for life or death. The Youth finds him
    dead and kills himself on the Lion’s body. Variant endings include revival by
    a Guinea-Fowl’s remedy and a second death caused by panic at being seen drinking
    milk. The passage then compares the Hausa tale only slightly with Romulus and
    Remus, gives a Southern Nigerian account of an abandoned child reared by a Leopardess
    who becomes the first Attah, and begins a separate poverty tale.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Lion returns to the forest, lies at the foot of a tree, and tells the
    Youth that one roar will mean he is dead while two roars will mean he is alive.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Youth hears one roar, follows the Lion’s spoor, and finds the Lion dead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Youth says his life is useless without the Lion, stabs himself with a
    knife, and falls dead on top of the Lion.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In one variant, a Guinea-Fowl tells the Youth to take dirt from the foot of
    a tamarind tree, mix it with water, and give it to the Lion; the Lion drinks and
    comes to life again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After revival in the variant, the Lion tells the Youth to return to his house
    while the Lion goes to the forest.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In another variant, a Female Friend of the Wife sees the Lion drinking milk
    from a calabash; the Lion thinks he is ambushed, rushes away, is staked on a fishing-spear
    at the gateway, and dies from the wound and from a broken heart.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the second variant, when the Husband returns, he goes to the den and rips
    open his inside.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that the Hausa story has little resemblance to the Roman
    legend of Romulus and Remus, but that some resemblance can be seen in a Southern
    Nigerian version.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Southern Nigerian version, a Woman from Ohimoje gives birth to a son
    in the forest and leaves him there; a Leopardess finds him and rears him with
    her Cubs.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Leopardess observes human customs, becomes troubled by the child’s nakedness,
    waylays a Man for clothes, and brings the clothes to her Foster-Child.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Leopardess later takes the Foster-Child to the outskirts of Iddah so he
    may associate with human beings.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Youth enters Iddah, arbitrates among fighting people, impresses them,
    and is proclaimed King on the spot, becoming the first Attah.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Leopardess comes to bid the Attah farewell before dying, runs to the forest,
    dies there, and the Attah follows; the People find both dead and bury them together.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: At the start of the next tale, a poor Man with only a loin-cloth asks the
    King to kill him because of his poverty, and a naked Poor Man asks to receive
    the loin-cloth after the execution.
  category: sequence
