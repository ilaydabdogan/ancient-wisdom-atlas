canonical_text:
  quote: Both brought forth Sons, and the Sons were exactly alike; they were as Twins
  summary: After a husband dies leaving two pregnant wives, each wife bears a son,
    and the boys are indistinguishable. One mother dies and her son inherits property.
    The other wife plots to kill him for the property, consults a magician, and blinds
    him in the forest near a tree. The other half-brother searches for him, finds
    him in a hole, applies mud to his eyes, gives him water, and God restores his
    sight. The brothers live in the forest, build a town, and become rulers. The surviving
    mother visits them after hearing of their wealth; the excerpt ends during a question
    about what should be done to an enemy. A preceding editorial note cites an Annamite
    tale in which a wife is punished by transformation into a mosquito.
  language: English
  quote_policy: quoted
