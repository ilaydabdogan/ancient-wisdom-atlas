canonical_text:
  quote: ''
  summary: The passage gives figure captions for a brass basin pattern, then discusses
    a Hausa story in which a hyaena pursues a bitch and her puppies and is transformed
    or buried. The author compares this with a Malayan sun-and-moon story about star-children,
    pursuit, eclipses, and the fading of stars at dawn. A Hausa variant says the sun
    gave birth and the moon dropped her burning daughter. A footnote mentions a Sierra
    Leone spider-and-leopard story with an offspring agreement but no clear celestial
    meaning.
  language: English
  quote_policy: summarized
