canonical_text:
  quote: ''
  summary: The Spider has eaten all the food intended for the Hyaena's cubs, leaving
    them thin. When exposed, he tricks the Hyaena by presenting his ears as boots
    and escapes. He then misdirects the Hyaena toward the Dog by using the Dog's panting
    as false proof of flight, and both Dog and Spider escape. Variant notes substitute
    the Jerboa or Hare for the Spider. The passage then begins a separate tale about
    a King, three male Slaves, and their named sons, including one called You-are-wiser-than-the-King.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For about a month, the Spider had taken all the food, and the Hyaena's cubs
    had become wasted away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Hyaena calls her children out of the den, sees that they are very thin,
    and asks what happened to them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The cubs tell the Hyaena that she has brought them no food and that For-you-all
    has eaten it and is inside.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Spider pushes his ears out of the hole and tells the Hyaena to catch hold
    of his boots first.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Hyaena seizes the ears, throws them behind her, and the Spider, whose
    whole body has been pulled out, runs away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Spider runs to the Dog's house, where the Dog is weaving, and sits down
    by the loom.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: When the Hyaena asks which of the two she was chasing, the Spider says the
    Dog's panting mouth proves that the Dog had been running away.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Hyaena springs toward the Dog, but the Dog escapes in time, and the Spider
    also runs away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A variant note states that the Jerboa plays the Spider's part in one version
    and the Hare takes his place in another, where the Hare makes the Dog pay the
    penalty.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: A new tale begins with a King who has three male Slaves, each married and
    each having a son.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: The three sons are named He-who-will-not-see, The-Gift-of-God, and You-are-wiser-than-the-King,
    and they are brought to the King.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: The sons grow to adulthood, go to work for the King, and a bundle of guinea-corn
    is brought.
  category: sequence
  evidence_refs:
  - ev:10
