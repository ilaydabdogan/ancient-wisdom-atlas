canonical_text:
  quote: ''
  summary: 'The passage states that, in Hausa folklore as summarized by Tremearne,
    humans, animals, and sometimes inanimate things are closely connected: animals
    and objects may speak or act, humans and nonhumans may marry or have offspring,
    and some beings may change into human form. It also discusses animal epithets
    for chiefs and children, reports of monkey-human union stories used to describe
    other groups, and a recurring pattern in which animal helpers are repaid with
    harm despite an apparent moral emphasis on reciprocity and kindness to animals.'
  language: English
  quote_policy: summarized
