canonical_text:
  quote: ''
  summary: In the excerpt, Hyaena eats an animal piece by piece while addressing He-Goat,
    gives Spider a small piece of liver, and later demands it back. Spider points
    to the red setting sun as if it were fire and sends Hyaena to fetch it; while
    she is gone, Spider kills the Bull, takes all of it into a tree, and covers the
    blood. Hyaena returns, begs Spider for meat, and threatens to bring a taller creature.
    She fetches Ostrich, but Spider catches Ostrich with a tie-tie noose; when Ostrich
    drops an egg, Hyaena eats it and urges Spider to drag Ostrich for more eggs. Ostrich
    is released and chases Hyaena, who escapes, while Spider goes home. The passage
    then gives an authorial comparison to a Malayan tale with similar meat-and-errand
    incidents, and begins the next tale with forest beasts assembling over stolen
    guinea corn.
  language: English
  quote_policy: summarized
