canonical_text:
  quote: ''
  summary: The notes describe a wild-cat realizing that an attempted action involving
    the cock would lead to the wild-cat's own death because the cock is living with
    the dog. A variant attributed to Major Edgar says the cock failed to understand
    the wild-cat's sarcasm and took the remark literally as an intention to attend
    a funeral and meet the dog. A later note denies that an action refers to charm
    preparation, but adds that an infusion of bazere root is often drunk as a charm.
  language: English
