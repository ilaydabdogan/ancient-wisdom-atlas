canonical_text:
  quote: ''
  summary: The passage moves from a fragment of animal speech and artifact captions
    into an introduction to Hausa animal tales. It states that animals once lived
    together in a single Eden-like community, that spider tricks or hyaena thefts
    destroyed this happy order, that animal communities resembled human tribes with
    chiefs and officials, and that the lion was king before humans appeared. A footnote
    says Hausa folklore includes stories contradicting the claim that animals do not
    understand fire.
  language: English
