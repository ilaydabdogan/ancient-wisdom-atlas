canonical_text:
  quote: ''
  summary: A scorpion asks a snake for poison strong enough to kill a man immediately.
    The snake refuses at first, saying the scorpion is too hot-tempered and would
    kill everybody, but tells her to return the next day. The next day the scorpion
    enters the snake's hut and lies by the door while the snake is out. When the snake
    returns, he squashes the scorpion while entering, and she stings him. The snake
    wriggles in pain and asks what has happened; the scorpion says it was her sting.
