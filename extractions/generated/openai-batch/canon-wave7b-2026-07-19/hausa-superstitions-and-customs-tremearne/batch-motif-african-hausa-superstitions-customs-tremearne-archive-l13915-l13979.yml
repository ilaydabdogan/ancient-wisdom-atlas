canonical_text:
  quote: ''
  summary: A city king seeking passage over a river to fight enemies promises a daughter
    of his own blood in marriage to the son of the river king if he returns victorious.
    The river opens a way; after the king returns and neglects the promise, the water
    rises toward the city until he asks for time. The chief wife refuses to give a
    daughter, but the youngest wife consents. Her daughter is sent with wedding goods
    to the river, where river-dwellers draw her into the water and bring her to the
    house of Dodo, King of the River. A younger child later grows up and is mocked
    because her sister was thrown into the river.
  language: English
  quote_policy: summarized
