canonical_text:
  quote: ''
  summary: The passage tells of a Young Giant protected by a magician's charm so long
    as he does not know a woman. A gigantic virgin travels to him and marries him;
    after this a stranger giant kills him in a tournament. His people say the remedy
    is for the girl to enter a grave and be buried; she agrees, and both she and the
    Young Giant arise, while the grave becomes a palace of abundance. The next tale
    begins with a king's son traveling into the forest, drinking from a lake with
    his dog, and hiding in a tree to observe what creature drinks there. A one-sided
    giantess with one arm, one leg, and one eye drinks the lake-water pap, remains
    thirsty because of the missing handfuls, and prepares a huge meal from corn and
    bulls.
  language: English
  quote_policy: summarized
