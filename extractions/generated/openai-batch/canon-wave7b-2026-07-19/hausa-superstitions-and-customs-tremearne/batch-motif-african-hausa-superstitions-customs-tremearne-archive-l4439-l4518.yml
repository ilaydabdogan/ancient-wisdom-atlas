canonical_text:
  quote: ''
  summary: 'The passage describes courtship and marriage-related customs and tale
    patterns: a deception involving a youth hidden in a pot, proposal gifts of kola-nuts
    and sometimes cowries, premarital intimacy and enclosure customs connected with
    fecundity sacrifices, stories in which a youth breaks a food taboo but wins a
    bride through a helper, and notes on polygyny, co-wife jealousy, and bride-price
    compensation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a courtship tale, a bearer thinks a maiden is inside a pot, but after a
    struggle the pot breaks and a youth appears instead.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kola-nuts are sent to a female when a suitor proposes marriage or otherwise;
    acceptance or rejection indicates gratification or displeasure with the offer.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator reports that cowries may also be sent when making a less honourable
    proposal.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that boys and girls were apparently allowed to sleep together
    before marriage, while the complete act was prohibited; the practice was called
    Tsarenchi and brought no disgrace upon either party.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A custom called Fita furra is reported in which several boys and girls were
    shut in an enclosure in autumn for a month, with food brought by an attendant
    and the expense borne by a rich man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: At the end of the enclosure period, girls found to be pregnant were considered
    wives of the youths with whom they had lived.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A long pole called jigo or gausami was erected inside the enclosure, and sacrifices
    of sheep, fowls, and other items were made there to Kuri and Utvargona to ensure
    clan fecundity.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Related stories collected by the author involve one youth and one maiden shut
    up together for a week, during which the youth must abstain from certain foods.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: In those stories the youth breaks the taboo, receives help from a leper in
    one case and a cat in another, escapes apparent death as punishment, and wins
    the bride.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The first wife is described as chief or house-mother, while other wives are
    called kishia, a term linked in the passage with jealousy.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage says wives are usually quarrelling and mentions tales of the triumph
