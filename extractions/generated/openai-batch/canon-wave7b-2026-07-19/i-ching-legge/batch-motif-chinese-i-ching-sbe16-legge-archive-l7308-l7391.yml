canonical_text:
  quote: ''
  summary: The passage gives line statements and commentary for the Ming I hexagram,
    glossed as wounded or repressed intelligence. Its figures include a superior man
    who withdraws while wounded, an officer who saves himself by a swift horse, a
    hunter taking the chief of darkness, one entering and leaving the dark lord’s
    precincts, the count of Ki, and a subject who moves from the sky into the earth.
    Commentary interprets the hexagram as an intelligent minister serving under an
    unsympathetic sovereign while maintaining correctness.
  language: English
  quote_policy: summarized
