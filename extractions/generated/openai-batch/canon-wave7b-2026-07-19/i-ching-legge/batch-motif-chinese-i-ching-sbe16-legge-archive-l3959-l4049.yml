canonical_text:
  quote: ''
  summary: The passage gives translated line statements and Legge's commentary on
    the Kun hexagram. It presents images of a lady with retreating chariot horses,
    a ruler hindered in dispensing favors, and a final subject retreating and weeping
    blood. The commentary explains Kun as a pictorial plant struggling out of the
    earth, then uses this to symbolize the difficult rise of a state from disorder,
    with emphasis on prudence, authority, strong and weak lines, peril, suitable marriage,
    and avoiding danger.
  language: English
