  summary: The passage presents the eighteenth hexagram as a condition requiring correction
    of decay or disorder. It gives an auspice of progress and success if the condition
    is properly handled, including an undertaking compared to crossing a great stream
    and attention to three days before and after a turning point. The line statements
    repeatedly describe a son dealing with troubles caused by father or mother, with
    varied outcomes. A final line describes one who does not serve king or feudal
    lord but attends to his own affairs. The commentary interprets the figure as arresting
    ruin caused as if by poison or venomous worms and restoring soundness and vigour.
  language: English
