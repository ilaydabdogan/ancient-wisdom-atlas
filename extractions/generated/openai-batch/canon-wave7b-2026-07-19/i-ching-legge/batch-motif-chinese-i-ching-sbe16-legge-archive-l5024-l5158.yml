canonical_text:
  quote: ''
  summary: The supplied passage closes a prior note on distress giving way to joy,
    then presents the Thung Zan or “Union of men” hexagram with line images of issuing
    from a gate, union with kindred, hidden arms, a contemplated but unmade attack,
    conquest followed by meeting, and union in the suburbs. The commentary explains
    Thung Zan as union opposed to obstruction, requiring public and unselfish motives,
    and relates the image to heaven above and fire rising upward. The passage then
    begins Ta Yu or “Great Havings,” giving images of a loaded wagon, a feudal prince
    presenting offerings to the Son of Heaven, restraint of resources, reciprocated
    sincerity, majesty, and help from Heaven.
  language: English
  quote_policy: summarized
