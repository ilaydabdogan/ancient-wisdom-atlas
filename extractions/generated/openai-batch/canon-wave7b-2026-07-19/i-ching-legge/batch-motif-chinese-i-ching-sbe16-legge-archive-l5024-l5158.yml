candidate_motifs:
- id: motif:1
  label: distress transformed into joy
  taxonomy_refs: []
  basis: The opening statement says the condition of distress ends, gives place to
    its opposite, and is represented by consequent joy.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a local interpretive statement for a hexagram line, not a narrative
    episode with named actors.
- id: motif:2
  label: selfless public union
  taxonomy_refs: []
  basis: Thung Zan is glossed as union of men, explicitly contrasted with obstruction,
    and the commentary says the union must rest on public considerations without selfishness.
  evidence_refs:
  - ev:2
  - ev:9
  confidence: high
  cautions: The passage treats the pattern as hexagram interpretation rather than
    mythic narrative.
- id: motif:3
  label: beneficial crossing of the great stream
  taxonomy_refs: []
  basis: The Thung Zan judgment states that it will be advantageous to cross the great
    stream.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage does not narrate an actual crossing; it gives an auspicious
    judgment.
- id: motif:4
  label: hidden weapons and prolonged restraint
  taxonomy_refs: []
  basis: The third-line image presents arms hidden in grass at a high mound and no
    demonstration for three years; the commentary reads this abstention from active
    attempt as avoiding misfortune.
  evidence_refs:
  - ev:5
  - ev:11
  confidence: high
  cautions: The symbolic function is explained only within the hexagram commentary.
- id: motif:5
  label: abandoned attack brings good fortune
  taxonomy_refs: []
  basis: The city-wall line shows a contemplated attack not carried out, followed
    by the prediction of good fortune; the commentary also says the subject does not
    carry his purpose into effect.
  evidence_refs:
  - ev:6
  - ev:11
  confidence: high
  cautions: No battle is narrated; the emphasis is on non-action.
- id: motif:6
  label: opposition overcome to achieve union
  taxonomy_refs: []
  basis: The fifth-line subject weeps under opposition, gathers forces, conquers,
    and meets the second-line subject, thereby effecting his purpose.
  evidence_refs:
  - ev:7
  - ev:12
  confidence: high
  cautions: The motif is derived from line imagery and commentary, not from an independent
    mythic tale.
- id: motif:7
  label: prosperity and abundance requiring restraint
  taxonomy_refs: []
  basis: Ta Yu is glossed as Great Havings, indicating prosperity and abundance; line
    images include a loaded wagon and keeping great resources under restraint.
  evidence_refs:
  - ev:14
  - ev:15
  - ev:17
  - ev:18
  confidence: high
  cautions: The passage begins the Ta Yu commentary but cuts off mid-sentence, so
    the treatment of this motif is incomplete.
- id: motif:8
  label: offering to the Son of Heaven
  taxonomy_refs:
  - royal_legitimacy
  basis: The Ta Yu third line shows a feudal prince presenting offerings to the Son
    of Heaven, and contrasts this duty with the insufficiency of a small man.
  evidence_refs:
  - ev:16
  confidence: medium
  cautions: The passage presents a ritual-political image; it does not elaborate the
    ritual or explicitly frame it as mythic sacred exchange.
- id: motif:9
  label: help accorded from Heaven
  taxonomy_refs: []
  basis: The topmost line of Ta Yu says its subject has help accorded from Heaven,
    followed by good fortune and advantage.
  evidence_refs:
  - ev:17
  confidence: high
  cautions: The passage does not specify whether Heaven is a deity, cosmic order,
    or omen-function in this context.
