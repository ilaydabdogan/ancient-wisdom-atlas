canonical_text:
  quote: ''
  summary: 'A verse-like appendix summarizes themes associated with several hexagrams
    or named figures: stopping and withdrawing, gathering multitudes and affection,
    renewal and abandoning the old, sincerity and excess, trouble and few friends,
    fire rising and water descending, opposition between few and many, lack of advance,
    conflict, overthrow, meeting between strong many and one weak figure, a delayed
    bridal movement, nourishment of body and mind, establishment of things, ending
    of virgin life and failure of a youth to obtain a wife, dispersal of the weak
    by the strong, and prosperity for the good man with grief for small men.'
  language: English
  quote_policy: summarized
