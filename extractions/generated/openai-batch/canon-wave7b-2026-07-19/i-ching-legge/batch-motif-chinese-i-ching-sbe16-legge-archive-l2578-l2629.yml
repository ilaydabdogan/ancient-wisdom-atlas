canonical_text:
  quote: It is the symbol of ‘change,’ and is formed from the character for ‘the sun’
    placed over that for ‘the moon!’
  summary: The passage argues that the trigrams were not originally designed as a
    deep philosophical scheme. It says the Appendix uses them popularly and morally.
    It criticizes claims that the eight trigrams contain modern Western physical science.
    It then introduces the third Appendix and explains that the character Yi means
    change and is graphically associated with sun and moon, whose alternation illustrates
    ongoing change in nature and society.
  language: English
  quote_policy: quoted
