canonical_text:
  quote: ''
  summary: 'The passage explains the Yi diagrams and line explanations as guides to
    good and evil, then presents several Master-commentaries on line images: the far-reaching
    effects of words and actions, union of hearts, careful use of white grass mats,
    humble accomplishment, a dragon outside its proper place, secrecy in deliberation,
    and a burden-bearer riding in a gentleman’s carriage and attracting robbers.'
  language: English
  quote_policy: summarized
