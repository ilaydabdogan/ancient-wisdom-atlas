  quote: ''
  summary: The passage gives line statements and commentary for Pi, ornament/adornment.
    The third through sixth lines describe adorned subjects, white ornament, a white
    winged horse seeking union amid a matrimonial pursuit, a small roll of silk, good
    fortune, and no error. The commentary defines Pi as ornament and adorning, says
    ornament in society is secondary to substance, and connects the first line with
    Li, the trigram of fire or light, self-cultivation, and readiness to abandon luxury
    for righteousness.
