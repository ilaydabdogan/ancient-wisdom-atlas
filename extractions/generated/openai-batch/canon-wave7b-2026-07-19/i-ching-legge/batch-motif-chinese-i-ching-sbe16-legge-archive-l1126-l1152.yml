canonical_text:
  quote: ''
  summary: The passage evaluates native and European commentaries on the Yi. It praises
    many native commentaries while noting that some call Appendix passages unfathomable
    or incalculable. It argues that this reluctance comes from not wishing to admit
    that ancient sages dealt unwisely with matters too high for them. The passage
    also rebuts a writer who accused European Chinese scholars of worsening confusion,
    limiting the number of such translators to two and praising the work of Regis
    and collaborators as valuable and nearly successful in clarifying the Yi.
  language: English
  quote_policy: summarized
