candidate_motifs:
- id: motif:1
  label: Measured regulation and restraint
  taxonomy_refs:
  - wisdom
  basis: The passage defines Xieh through regular division, regulating, and restraining,
    then warns that regulations should fit circumstances and not become too strict
    or severe.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: medium
  cautions: The taxonomy fit is thematic and ethical rather than a narrative myth
    motif.
- id: motif:2
  label: Cautious stillness before action
  taxonomy_refs:
  - wisdom
  basis: The commentary identifies keeping still as the wise course and interprets
    the line as advising an officer not to take office rashly.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is a divinatory-ethical pattern rather than a mythic episode.
- id: motif:3
  label: Transformative inmost sincerity
  taxonomy_refs:
  - wisdom
  basis: Kung Fû/Inmost Sincerity is described as moving pigs and fish and as a highest
    quality enabling its possessor to prevail with spiritual beings, other men, and
    lower creatures.
  evidence_refs:
  - ev:7
  - ev:14
  confidence: high
  cautions: The passage frames this as moral and divinatory symbolism, not as a narrative
    of a culture hero or deity.
- id: motif:4
  label: Auspicious crossing of the great stream
  taxonomy_refs:
  - departure
  basis: The Kung Fû judgment states that there will be advantage in crossing the
    great stream.
  evidence_refs:
  - ev:7
  confidence: low
  cautions: The passage does not narrate an actual journey; the departure classification
    is only a possible motif-family association for the crossing image.
- id: motif:5
  label: Hidden call and answering response
  taxonomy_refs:
  - sacred_exchange
  basis: The crane cries from hidden retirement, her young respond, and the passage
    pairs this with a reciprocal sharing of a cup of good spirits.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The exchange is presented as line imagery and speech analogy, not as a
    full ritual or mythic exchange narrative.
- id: motif:6
  label: Union accompanied by emotional duality
  taxonomy_refs:
  - duality
  basis: After meeting a mate, the subject alternates between drumming and stopping,
    weeping and singing.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The text does not explain the mate as spouse, divine beloved, or sacred
    marriage; the motif label is limited to the observed alternation.
- id: motif:7
  label: Overreaching ascent toward heaven
  taxonomy_refs:
  - ascent
  basis: The topmost line shows a chanticleer trying to mount to heaven, and the omen
    is evil even with firm correctness.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The figure is an omen-image rather than a developed ascent myth; the negative
    result should not be generalized beyond this line.
