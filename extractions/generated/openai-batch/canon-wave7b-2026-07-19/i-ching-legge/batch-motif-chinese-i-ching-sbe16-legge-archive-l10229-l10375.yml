canonical_text:
  quote: ''
  summary: 'The passage discusses hexagram Xieh as regulation, restraint, and measured
    government control, warning against both failure to observe regulations and excessive
    severity. It then presents Kung Fû, interpreted as inmost sincerity: this sincerity
    moves animals, favors crossing the great stream, rests in itself, calls and receives
    response, links others in union, and is contrasted with a chanticleer overreaching
    toward heaven. Commentary links inmost sincerity with moral perfection and with
    a lineal symbol of an unselfish heart/mind enclosed by solid virtue.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Xieh is explained as denoting joints of bamboo, joints of the human frame,
    solar and other terms of the year, and any regular division involving regulating
    and restraining.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A divided third line shows its subject not appearing to observe proper regulations;
    the subject laments and has no one else to blame.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An undivided fifth line shows its subject enacting regulations sweetly and
    acceptably, with good fortune and admiration for onward progress.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A divided topmost line shows its subject enacting severe and difficult regulations;
    evil is predicted even with firmness and correctness, though repentance will disappear
    later.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The commentary says the regulations of government are for guidance and control
    of the people, and that regulations must be adapted to circumstances rather than
    made too strict and severe.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:5
- id: obs:6
  text: In commentary on the first line of Xieh, the subject is advised to keep still,
    and an officer is advised not to take office rashly but to exercise cautious judgment.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Kung Fû is said to move pigs and fish, bring good fortune, give advantage
    in crossing the great stream, and give advantage in being firm and correct.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The first line of Kung Fû shows its subject resting in himself; if he sought
    rest from another, he would not find it.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: A crane cries out from hidden retirement, and her young ones respond; an accompanying
    saying presents one speaker with a cup of good spirits and another agreeing to
    partake with the first.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The third line of Kung Fû shows its subject meeting a mate, alternately beating
    and leaving off the drum, and alternately weeping and singing.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: A line image compares the situation to the moon nearly full and to a chariot
    horse whose fellow disappears; no error is predicted.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: The fifth line of Kung Fû shows its subject perfectly sincere and linking
    others to him in closest union; no error is predicted.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: The topmost line of Kung Fû shows its subject as a chanticleer trying to mount
    to heaven; evil is predicted even with firm correctness.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The commentary interprets Kung Fû as Inmost Sincerity, the highest quality
    of man, giving power to prevail with spiritual beings, other men, and lower creatures.
  category: attribute
  evidence_refs:
  - ev:14
- id: obs:15
  text: The lineal figure is described as having two divided lines in the centre and
    undivided lines below and above; commentators take the centre as a heart or mind
    free from self-consciousness and the surrounding undivided lines as solidity of
    virtue.
  category: object
  evidence_refs:
  - ev:15
- id: obs:16
  text: The passage opens the Hsiao Kwo hexagram by saying that, in its implied circumstances,
    there will be progress and attainment.
  category: other
  evidence_refs:
  - ev:16
