canonical_text:
  quote: ''
  summary: The passage comments on several hexagrams by explaining auspicious progress
    as Heaven’s appointment, describing correct nourishment of self, talented people,
    and the populace, interpreting virtue as accumulated solidity, presenting extraordinary
    excess as a time requiring action, using water in repeated defiles as an image
    of danger, and describing cosmic order through sun, moon, earth, vegetation, and
    cow-like docility. Later notes compare these themes with Mencius, Yao and Shun,
    Yu’s flood-control, Tang, King Wu, and later commentators’ readings of water and
    peril.
  language: English
  quote_policy: summarized
