  quote: "“The dragon is on the wing in the sky;—it will be advantageous to see the
    great man”"
  summary: 'The passage presents Confucius/the Master explaining several line statements
    of a hexagram through dragon images: a dragon still in the deep, a dragon flying
    in the sky, and a dragon exceeding proper limits. The commentary relates these
    images to the superior man, the great man or sage, proper timing, advancement
    and recession, response among things of the same kind, and the consequences of
    overreaching.'
