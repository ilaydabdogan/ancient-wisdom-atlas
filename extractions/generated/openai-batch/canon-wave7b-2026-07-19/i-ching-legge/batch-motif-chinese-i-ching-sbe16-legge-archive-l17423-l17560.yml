canonical_text:
  quote: ''
  summary: The passage relates natural phenomena, Heaven and Earth, Kien and Khwan,
    male and female, and strong and weak lines to the changing figures of the Yi.
    It describes sages making diagrams and explanations, the superior man studying
    the emblems and prognostications, and heavenly help and good fortune resulting
    from proper contemplation and action.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists thunder and lightning as exciting forces, wind and rain
    as fertilising influences, and the sun and moon as revolving bodies that give
    rise to cold and warmth.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The attributes expressed by Kien are said to constitute the male, and those
    expressed by Khwan are said to constitute the female.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kien is said to symbolise Heaven and to direct the great beginnings of things;
    Khwan is said to symbolise Earth and to give things their completion.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Khien is described as directing through ease, while Khwan is described as
    showing ability through unhesitating response.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The one who attains ease and freedom from laborious effort is described as
    easily understood and followed, gaining adherents, success, duration, greatness,
    and heritage.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The sage is described as attaining mastery of principles under the sky and
    making his position in the middle between heaven and earth.
  category: setting
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:7
  text: The sages set forth diagrams, inspected the emblems contained in them, and
    appended explanations so that good fortune and bad fortune were made clear.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Strong and weak lines are said to displace each other and produce changes
    and transformations in the figures.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Good fortune and evil in the explanations are presented as indications of
    right and wrong in conduct, while repentance and regret indicate sorrow and anxiety.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Changes and transformations of the lines are called emblems of advance and
    retrogression of vital force; strong and weak lines are called emblems of day
    and night; the six places of the hexagram show the course of the three extremes
    or Powers.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The superior man rests in the order shown in the Yi, studies the explanations
    of the lines, contemplates emblems and divinatory changes, and studies prognostications.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Help is said to be extended to the superior man from Heaven, with good fortune
    and advantage in every movement.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The commentary states that Chapter I attempts to show correspondence between
    changing external nature and the varying figures of the Yi King.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: The commentary links thunder, lightning, wind, rain, the sun, and the moon
    with derivative trigrams, and notes that a water-associated trigram has no place
    in the enumeration.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: The commentary says the sages, identified there as king Wan and the duke of
    Kau, made the Yi so that the fortune of human courses would be indicated in harmony
    with right and wrong and with natural processes.
  category: action
  evidence_refs:
  - ev:9
