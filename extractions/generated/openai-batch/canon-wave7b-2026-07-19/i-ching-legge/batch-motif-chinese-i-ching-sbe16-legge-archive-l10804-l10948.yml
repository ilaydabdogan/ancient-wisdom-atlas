canonical_text:
  quote: ''
  summary: The passage begins Appendix I, the Treatise on the Thwan. It explains early
    hexagrams through images of heaven, earth, weather, sages, dragons, a mare, directions,
    thunder and rain, feudal princes, and a mountain-defile with a stream. Khien/Azien
    is linked with originating heavenly power and transformation; Khwan is linked
    with receptive earthly capacity and birth. The sage understands temporal sequence
    and is pictured driving through the sky in a six-dragon carriage. A later hexagram
    joins strong and weak forces amid difficulty, thunder, and rain; another is described
    as a mountain over a defile with a stream.
  language: English
  quote_policy: summarized
