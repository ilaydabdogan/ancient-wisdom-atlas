canonical_text:
  quote: ''
  summary: The passage presents the Khwan hexagram as originating, penetrating, advantageous,
    correct, and firm like a mare. It states that the superior man should not initiate
    movement but should follow and find his lord, with fortune linked to friends in
    the south-west, loss of friends in the north-east, and resting in correctness
    and firmness. The line texts include hoarfrost leading to strong ice, straightness
    and greatness, restrained excellence in royal service, a tied sack, and a yellow
    lower garment bringing good fortune. Interleaved commentary also explains the
    dragon as an emblem of the superior or great man, associated with water, land,
    flight, dignity, wisdom, sovereignty, and sagehood, and warns that going beyond
    proper limits brings repentance or abasement.
  language: English
  quote_policy: summarized
