canonical_text:
  quote: ''
  summary: The passage praises the Yi as comprehensive and corresponding to heaven,
    earth, seasons, sun, moon, and natural operations. It describes Khien and Khwan
    as productive powers, with commentary identifying them with heaven/yang and earth/yin.
    It presents sages as using the Yi to cultivate virtue and as surveying phenomena
    and influences in order to form diagrams, semblances, and standards.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Yi is described as wide, great, without limit in its farthest reach, still
    and correct near at hand, and embracing all between heaven and earth.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Khien and Khwan are each described in states of stillness and in exerting
    motive power, and each is connected with productive action.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The commentary identifies Khien with heaven and the yang faculty, and Khwan
    with earth and yin.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The commentary states that the connection of yang and yin is necessary for
    the production of any substantial thing, and that Heaven and Earth operate together
    in producing material things and beings.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Yi is said to correspond to heaven and earth, the four seasons, the sun
    and moon, and the operations seen in natural phenomena.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sages are said to have exalted their virtue and enlarged their sphere
    of occupation by the Yi, with wisdom patterned after heaven and rules of conduct
    patterned after earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Heaven and earth are said to have assigned positions, with changes of nature
    taking place between them.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: A sage surveys complex phenomena under the sky, considers how they can be
