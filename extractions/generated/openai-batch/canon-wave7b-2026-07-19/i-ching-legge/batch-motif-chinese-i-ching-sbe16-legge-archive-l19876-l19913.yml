canonical_text:
  quote: ''
  summary: Appendix IV is introduced as supplementary to the Thwan and Yao on the
    first and second hexagrams, interpreting them in relation to human nature and
    conduct. In Section I, the qualities named under Kien are mapped to human moral
    qualities. The passage then describes the superior man as embodying benevolence,
    propriety, benefit to creatures, correctness, firmness, and administrative capacity,
    and says that practicing four virtues justifies applying the Ahien formula to
    him. A note explains the title as the Record of Wan Yen and associates the Thwan
    with King Wan and the Yao with the Duke of Kau.
  language: English
  quote_policy: summarized
