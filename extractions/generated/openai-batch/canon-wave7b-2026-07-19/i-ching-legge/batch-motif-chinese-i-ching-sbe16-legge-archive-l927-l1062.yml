canonical_text:
  quote: ''
  summary: The passage reviews Appendix testimony and Legge's historical argument
    about the antiquity and authorship of the Yi. It says the Yi was known as a divination
    text before Confucius, places its flourishing in middle antiquity and the late
    Yin/Kau troubles, connects part of its making with king Wan's imprisonment and
    release, attributes a larger portion to his son Tan, the duke of Kau, and argues
    that the received Yi was complete by the late twelfth century B.C. It also notes
    that the text is older than the Appendixes but not the oldest Chinese classic.
  language: English
  quote_policy: summarized
