canonical_text:
  quote: ''
  summary: Legge discusses evidence that the Yi King existed before Confucius, distinguishes
    its text from later appendixes, cites the Official Book of the Kau dynasty on
    three Yi systems under the Grand Diviner, and cites historical narratives showing
    divination by the Yi before and during Confucius’s lifetime. A footnote records
    conjectures about the names Lien-shan and Kwei-jhang in relation to doubled mountain
    and earth trigrams.
  language: English
  quote_policy: summarized
