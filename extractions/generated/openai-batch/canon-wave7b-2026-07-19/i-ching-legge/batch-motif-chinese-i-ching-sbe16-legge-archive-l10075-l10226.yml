canonical_text:
  quote: Wind moving over water seems to disperse it
  summary: The passage presents the Hwan hexagram as dispersion or dissipation and
    explains lines in which subjects rescue, seek security, discard self-regard, scatter
    divisive parties, issue royal announcements, distribute royal stores, and separate
    from wounds and fears. Commentary interprets dispersion as alienation and disorder
    remedied by correct action, ritual sincerity at the ancestral temple, ministerial
    gathering, and rulership. The passage ends with the opening of the Kieh hexagram,
    concerning regulation and remaining within courtyards.
  language: English
  quote_policy: quoted
