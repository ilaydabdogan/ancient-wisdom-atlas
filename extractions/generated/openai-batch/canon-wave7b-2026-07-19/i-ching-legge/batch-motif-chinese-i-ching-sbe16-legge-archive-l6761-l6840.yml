canonical_text:
  quote: ''
  summary: The passage gives the text and Legge commentary for hexagram XXXI, Hsien.
    The hexagram promises success when conditions of firmness and correctness are
    fulfilled, using marriage to a young lady as an auspicious comparison. The six
    line statements describe movement through several body parts. The commentary interprets
    Hsien as mutual influence or movement, explains the written character in relation
    to the heart, and connects the hexagram with husband-wife and youngest son/youngest
    daughter symbolism.
  language: English
  quote_policy: summarized
