canonical_text:
  quote: "“The wind penetrates things.”"
  summary: The passage comments on several I Ching hexagrams and line statements.
    It discusses wind as an emblem of penetrating sincerity, bird parent-offspring
    affection, minister-ruler distance, thunder sounding from earth and diminishing
    on a hill, and the contrasted arrangements of fire and water in hexagrams LXIII
    and LXIV. It also notes line images involving clouds without rain, a wheel drawn
    back, seven days, three years, sacrifice, immersion of the head or tail, and the
    conduct of the superior man.
  language: English
  quote_policy: quoted
