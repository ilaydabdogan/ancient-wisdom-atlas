  summary: The passage contains translated line comments and Legge's notes for several
    Yi King hexagram sections. It treats a caldron with food, altered ears, spilled
    contents for a ruler, yellow ears, and jade rings; comments on wise men using
    heavenly bodies to judge seasons and time; describes repeated thunder as prompting
    fear, virtue-cultivation, and examination of faults; and describes repeated mountains
    as prompting restfulness and attention to one's proper position.
