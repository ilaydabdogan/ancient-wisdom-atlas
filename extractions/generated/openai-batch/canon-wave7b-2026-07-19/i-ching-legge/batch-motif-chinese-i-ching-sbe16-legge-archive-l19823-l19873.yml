canonical_text:
  quote: ''
  summary: The passage is Legge's commentary on a section of Appendix III. It describes
    a division into passages about sages as makers of the Yi, their independence from
    the Yi, their construction of it to share knowledge and power with others, a later
    note on ordinary speech, and interpretive points for judging the lines of the
    Yi. Legge also questions the attribution of extraordinary knowledge and ability
    to the sages and notes a comparison with the Doctrine of the Mean.
  language: English
  quote_policy: summarized
