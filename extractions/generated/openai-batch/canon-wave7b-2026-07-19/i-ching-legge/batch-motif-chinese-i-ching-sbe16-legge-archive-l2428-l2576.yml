canonical_text:
  quote: ''
  summary: Legge discusses explanations of Kwei-shan as effective interaction behind
    heaven-and-earth transformations, cites the spirit-like way of heaven in relation
    to the seasons and sage instruction, and introduces the Hsiang Kwan or Treatise
    on Symbols. He then gives examples of Great Symbolism in which trigrams such as
    heaven, earth, wind, water, and mountain form hexagrams and are interpreted as
    models for superior men, sovereigns, and ancient kings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The commentary distinguishes speaking generally of heaven and earth from ascribing
    the traces of their interaction to Kwei-shan, represented as if a personal agency
    brought them about.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cited explanation of Kwan says the spirit-like way of heaven is the means
    by which the four seasons proceed without error.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sages are said to lay down instructions in accordance with the spirit-like
    way, with all under heaven yielding submission.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Legge describes the Appendix author as dwelling on changing phenomena between
    heaven and earth and sensing harmony between natural and spiritual worlds.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Hsiang Kwan is described as a Treatise on the Symbols, and the Great Symbolism
    explains how trigrams combine into a six-lined figure and how their blended meaning
    appears in human institutions and conduct.
  category: other
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The first hexagram is formed by repeating the trigram representing heaven,
    and its symbolism is applied to the superior man's ceaseless activity.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The second hexagram is formed by repeating the trigram representing earth,
    and its symbolism is applied to the superior man's supporting men and things with
    large virtue.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The forty-fourth hexagram combines wind beneath sky, and its symbolism is
    applied to a sovereign distributing charges and announcements through the four
    quarters of the kingdom.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The fifty-ninth hexagram combines water and wind, and its symbolism is applied
    to ancient kings presenting offerings to God and establishing the ancestral temple.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Legge says the water-and-wind combination suggested dissipation or alienation
    from the Supreme Power and between parents and children, a condition addressed
    by religion.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The twenty-sixth hexagram places heaven in the midst of a mountain, and its
    symbolism is applied to the superior man's storing the words and conduct of former
    men in memory.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Legge reports the view that heaven in the midst of a mountain cannot occur
    in reality but may be conceived for symbolic interpretation.
  category: speech
  evidence_refs:
  - ev:9
