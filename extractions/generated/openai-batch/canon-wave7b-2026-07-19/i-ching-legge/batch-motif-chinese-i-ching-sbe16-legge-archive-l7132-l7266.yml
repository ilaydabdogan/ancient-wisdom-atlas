canonical_text:
  quote: ''
  summary: Commentary on the 3in/Jin hexagram presents advance through the figure
    of a feudal prince rewarded by the king, then explains several line images involving
    restrained strength, obstructed or perilous advance, blessing from a grandmother
    or king’s mother, animal images, and the comparison of Jin’s advance to increasing
    sunlight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hexagram is described as showing a prince who secures the tranquillity
    of the people and is rewarded by the king with numerous horses and three interviews
    in one day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The commentary states that Sin/Jin means “to advance” and that the hexagram
    belongs with names indicating progress and advance.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:3
  text: The first-line commentary links the line with “strength in the toes” or advancing,
    but says the measure is too bold for the lowest place and gives an evil auspice.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first-line text shows one wishing to advance while being kept back, with
    advice to be firm and correct and, if not trusted, to maintain a large and generous
    mind.
  category: action
  evidence_refs:
  - ev:5
- id: obs:5
  text: The second-line text shows a subject with the appearance of advancing and
    being sorrowful, but says firmness and correctness bring good fortune and a great
    blessing from the grandmother.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: The third-line commentary contrasts a small man using strength to the utmost
    with a superior man who is cautious and does not injure himself like a ram.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: One line shows its subject trusted by all around him, so that occasion for
    repentance disappears.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Another line shows the appearance of advancing like a marmot and describes
    the position as perilous even with firmness and correctness.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: The fifth-line text says not to be concerned with failure or success; advancing
    will be fortunate and advantageous.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The topmost line shows one advancing his horns and using them to punish the
    rebellious people of his own city; the position is perilous and involves regret,
    though good fortune is also mentioned.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The commentary says the top-line subject becomes conscious of weakness, reflects
    and rests, and obtains good fortune by desisting from unwise efforts.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The advance in Jin is compared to the sun or shining light shining more and
    more toward the perfect day.
  category: other
  evidence_refs:
  - ev:9
- id: obs:13
  text: The commentary explains the second-line “grandmother” as literally “king’s
    mother” and says line 5 is the sovereign who acknowledges the worth of the feudal
    lord.
  category: relationship
  evidence_refs:
  - ev:10
