canonical_text:
  quote: ''
  summary: The passage comments on several Yi King hexagram images and line judgments.
    It notes union reaching beyond the suburbs, says good fortune in Ta Yu comes from
    Heaven, interprets earth with a mountain as Khien and links it to humility, self-correction,
    equality, submission, and limited use of arms. It also interprets fire above the
    sky as far-shining greatness requiring good governance under Heaven. Earth with
    thunder forms Yi, prompting ancient kings to compose music, honor virtue, and
    present it to God together with ancestor and father. The final line comments warn
    about overflowing satisfaction, misplaced seeking of favor, chronic complaint,
    survival, and darkened devotion to pleasure.
  language: English
  quote_policy: summarized
