  summary: The passage gives line images and commentary for Hsiao Kwo, including danger
    from insufficient precaution, small excess handled humbly, dense clouds without
    rain, a prince shooting and taking a bird in a cave, and a bird flying too high
    as an image of self-produced calamity. It then begins Ki Chi, with images of a
    dragged-back wheel or wet-tailed fox, a wife who will recover a lost carriage-screen
    after seven days, Kao 3ung attacking the Demon region for three years, and rags
    prepared against a boat leak.
