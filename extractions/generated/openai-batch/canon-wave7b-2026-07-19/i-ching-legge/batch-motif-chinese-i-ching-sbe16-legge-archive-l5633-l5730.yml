canonical_text:
  quote: the worshipper who has washed his hands, but not (yet) presented his offerings
  summary: 'The range presents Kwan as a hexagram of showing and contemplating: a
    sovereign is symbolised by a solemn worshipper at the start of religious service,
    while subjects look up to him. Its lines describe different forms of looking,
    including a lad’s looking, peeping from a door, contemplating one’s life, contemplating
    the kingdom’s glory, and examining one’s character. The excerpt also includes
    a preceding Lin commentary on Yin-Yang numbers, monthly placement, line positions,
    and wise rulership.'
  language: English
  quote_policy: quoted
