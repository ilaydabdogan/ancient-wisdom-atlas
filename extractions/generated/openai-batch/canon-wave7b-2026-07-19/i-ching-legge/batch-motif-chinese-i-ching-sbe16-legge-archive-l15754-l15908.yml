canonical_text:
  quote: ''
  summary: 'The passage comments on hexagrams XL Kieh, XLI Sun, and the beginning
    of XLII Yi. Natural trigram pairings—thunder with rain, mountain over marsh waters,
    and wind with thunder—are used to frame ethical conduct: forgiving errors, dealing
    gently with crimes, restraining wrath and desires, helping another line-subject,
    maintaining firmness, giving increase to others, and moving when seeing what is
    good. It also includes line images such as a porter attracting robbers, a prince
    shooting a falcon, marsh vapour increasing a hill, and blessing from above.'
  language: English
  quote_policy: summarized
