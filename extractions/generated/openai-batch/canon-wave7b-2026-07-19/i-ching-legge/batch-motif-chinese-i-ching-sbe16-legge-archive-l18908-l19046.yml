canonical_text:
  quote: ''
  summary: 'The passage lists inventions and civilizing substitutions attributed to
    ancient makers and later sages: canoes and oars, animal-drawn vehicles, defensive
    gates and clappers, pestles and mortars, bows and arrows, houses, coffins, and
    written records. Each invention is said to have been probably suggested by a named
    hexagram of the Yi. Legge''s commentary frames the chapter as legendary progress
    of civilization guided by the Yi, while warning that the statements should not
    be treated as historical. The following chapter defines the Yi as emblematic lines
    and relates its lines and explanations to significance, movement, good fortune,
    evil, repentance, and regret.'
  language: English
  quote_policy: summarized
