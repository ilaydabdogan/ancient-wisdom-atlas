canonical_text:
  quote: ''
  summary: The passage gives line statements and commentary for the Kau hexagram,
    interpreting a divided line as a dangerous sudden entrant who must be restrained,
    with images of a metal drag, fish in a wallet, bodily injury, a tree and gourd,
    and horns. It then begins the 3hui hexagram, describing the king at the ancestral
    temple, meeting the great man, sacrificial offerings, and lines concerning union,
    tears turning to smiles, and sincerity in sacrifice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first divided line of Kau says its subject should be kept tied and fastened
    like a carriage to a metal drag; firm correctness brings good fortune, but movement
    brings evil, and the subject is likened to a lean pig that keeps jumping about.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Kau line statement mentions a wallet of fish, says there will be no error,
    and warns not to let the subject of the first line go forward to the guests.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The third undivided line of Kau describes a subject whose buttocks have had
    the skin stripped so that he walks with difficulty; the position is perilous,
    but no great error is predicted.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Another Kau line statement describes a wallet with no fish in it and says
    this will give rise to evil.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The fifth undivided line of Kau shows a medlar tree overspreading the gourd
    beneath it; if the subject conceals brilliant qualities, a good issue will descend
    from Heaven.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The sixth undivided line of Kau shows its subject receiving others on his
    horns; there will be regret but no error.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The commentary places Kau after Kwai and Kien in a monthly sequence and says
    Kau belongs to the fifth month, when light and heat begin to lessen.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The commentary says Wan saw the divided line as the symbol of a small or unworthy
    man beginning to insinuate himself into government, with the danger that he would
    displace good men if unchecked.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The commentary defines Kau as sudden or casual encounter and says the first
    divided line symbolizes a bold, bad woman appearing unexpectedly and wishing to
    subdue or win all five strong lines.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The commentary says the wallet of fish under line 2 symbolizes the subject
    of line 1; the subject of line 2 can repress the advance of line 1 and is called
    the lord of the hexagram, while the other strong lines are guests.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The commentary on line 5 says the subject is in the ruler’s place and that
    his relation to line 1 is like a forest tree to a spreading gourd; he should restrain
    himself and keep excellence concealed.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The commentary on line 6 likens its subject to an officer withdrawn from the
    world, unable to serve the time but removed from workers of disorder.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:13
  text: The 3hui hexagram statement says the king repairs to his ancestral temple,
    that meeting the great man is advantageous, that success requires firm correctness,
    that great victims conduce to good fortune, and that movement in any direction
    is advantageous.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The first divided line of 3hui shows a subject with a sincere desire for union
    but unable to carry it out, causing disorder; if he cries out for help, tears
    give place to smiles, and going forward brings no error.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: The second divided line of 3hui shows its subject led forward by a correlate;
    good fortune and freedom from error are predicted, and sincere small vernal offerings
    are acceptable.
  category: relationship
  evidence_refs:
  - ev:15
