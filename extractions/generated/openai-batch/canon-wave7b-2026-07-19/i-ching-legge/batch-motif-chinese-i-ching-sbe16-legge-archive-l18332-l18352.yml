  quote: ''
  summary: The passage describes operations of the Yi as searching out hidden depths,
    revealing minute origins or springs of things, completing undertakings, and acting
    in a spirit-like way that reaches its destination without travel. It then cites
    the Master on four things in the Yi that indicate the way of the sages, and a
    note explains that the chapter discusses the Yi's service to people and the sages'
    making of it. A further note identifies the emblematic figures as the four hsiang,
    produced by manipulating undivided and divided forms.
