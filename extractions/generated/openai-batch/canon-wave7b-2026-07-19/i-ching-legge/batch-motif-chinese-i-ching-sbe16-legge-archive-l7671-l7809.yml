canonical_text:
  quote: ''
  summary: The passage comments on the Kien and Kieh hexagrams. Kien is explained
    as difficulty in walking and as a figure for difficulty in governing a kingdom,
    requiring attention to circumstances, the presence of a great man, and firm correctness.
    The south-west is associated with easier champaign country and the north-east
    with mountainous difficulty. Kieh is explained as loosing or untying, following
    the removal of obstruction; its line statements include waiting, hunting three
    foxes and gaining yellow arrows, a burdened porter riding in a carriage and attracting
    robbers, removing toes so friends come in confidence, the ruler removing what
    is injurious, and a feudal prince shooting a falcon from a high wall.
  language: English
  quote_policy: summarized
