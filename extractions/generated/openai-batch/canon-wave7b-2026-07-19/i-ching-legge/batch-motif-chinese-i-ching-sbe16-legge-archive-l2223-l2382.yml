canonical_text:
  quote: ''
  summary: The passage critiques the attribution of certain Yi appendixes to Confucius,
    summarizes the first appendix as an explanation of King Wan's oracular judgments
    on hexagrams, and discusses trigram systems attributed to Fo-hsi and King Wan,
    including natural-object correspondences, attributes, compass directions, hard/soft
    line categories, spirits, Yin/Yang classification, and a family analogy among
    trigrams.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: P. Regis is reported as condensing the fifth Appendix and criticizing parts
    of it as a mere enumeration of things called Yang or Yin.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The translator-narrator rejects calling Confucius the chief of philosophers,
    calls him a great moral philosopher and teacher, and states relief at not being
    obliged to receive the criticized appendixes as Confucius's work.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first Appendix is named Thwan Kwan, translated as Treatise on the Thwan,
    and concerns the paragraphs in which King Wan expresses the significance of the
    hexagrams.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: King Wan is described as attaching meanings and predictions of good or bad
    fortune to hexagrams without explaining why, speaking oracularly like a diviner.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The writer of the first Appendix is described as trying to show King Wan's
    thought processes by reference to component trigrams, symbolic intimations, attributes,
    qualities, and linear composition.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage notes technical distinctions of lines and trigrams as hard or
    strong and weak or soft, mentions spirits or spiritual beings, and says the names
    Yin and Yang do not appear in the first Appendix.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage introduces Fo-hsi's eight trigrams with names, natural objects,
    attributes, and compass points, and says King Wan changed their geographical arrangement.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The passage questions the principles behind assigning natural objects to trigrams,
    specifically mentioning water in different conditions, the moon, wind, and wood.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'The passage mentions an early Chinese list of five elements: water, fire,
