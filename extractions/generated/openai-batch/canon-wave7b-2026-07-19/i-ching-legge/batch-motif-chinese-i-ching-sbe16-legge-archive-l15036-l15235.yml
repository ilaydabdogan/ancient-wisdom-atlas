canonical_text:
  quote: ''
  summary: 'The passage gives Great Symbolism and line explanations for Hexagrams
    XXVIII–XXXI: Ta Kwo, Khan, Li, and Hsien. It presents images of trees under marsh
    water, continuous water and defiles, repeated brightness, and a mountain above
    marsh water, with ethical applications to the superior or great man and line images
    involving beams, old-young spouses, a decayed willow, a cavern, offerings, the
    sun, royal action, and bodily movement.'
  language: English
  quote_policy: summarized
