canonical_text:
  quote: ''
  summary: The passage gives two Yi line statements with the Master's explanations.
    In the first, a line-subject is distressed before a rock, grasps at thorns, enters
    his palace without seeing his wife, and evil is forecast; the Master explains
    this as needless distress and improper contact leading to disgrace, danger, and
    death. In the second, a duke shoots and hits a falcon on a high wall; the Master
    explains the falcon, bow, arrow, shooter, concealed weapon, proper timing, and
    successful action.
  language: English
