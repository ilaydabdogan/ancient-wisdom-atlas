canonical_text:
  quote: ''
  summary: 'The passage explains a sequence of hexagrams or named states: overthrow
    is followed by redintegration and return; return is followed by freedom from disorder
    and accumulation of virtue; accumulation requires nourishment, movement, peril,
    and attachment. It then presents heaven and earth as preceding material things,
    male and female, husband and wife, father and son, ruler and minister, high and
    low, and propriety and righteousness. Later transitions include withdrawal, vigour,
    advancing, wounding abroad and return home, family disorder, division, difficulties,
    ease, and losses.'
  language: English
