canonical_text:
  quote: ''
  summary: 'The passage describes Chien and Khwan as heaven-earth symbols, explains
    lines and emblematic figures as representations used in divination, and presents
    sagely rule as dependent on people, wealth, instruction, and prohibition of wrongdoing.
    It then recounts ancient rulers: Pao-hsi observes sky, earth, animals, soil, himself,
    and things generally, devises the eight trigrams, and invents nets; Shinnang creates
    plough implements, teaches agriculture, and institutes midday markets; Hwang Ti,
    Yao, and Shun carry through transformative changes, are helped by Heaven, and
    secure order under heaven. Editorial notes connect trigram lines with heaven,
    man, and earth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chien is described as the symbol of heaven, strength, and easy natural action;
    Khwan or the earth-symbol is described as docility and receptive operation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Yao lines are called imitative representations, and the Hsiang emblematic
    figures are called pictorial representations; their movements are unseen at the
    operator's hand, while good or ill fortune appears openly.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sage values the highest place as human representative of heaven and earth,
    and his position is guarded by men, wealth, administration, instruction, and prohibitions
    against wrongdoing.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pao-hsi looks upward at sky forms and downward at earth patterns, also considering
    birds, beasts, soil, his own person, and things at a distance before devising
    the eight trigrams.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Pao-hsi invents nets made by knitting strings for hunting and fishing; the
    passage says the idea was probably taken from Li.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After Pao-hsi's death, Shinnang arises, forms a plough share and plough-handle
    from wood, and teaches ploughing and weeding; the idea was probably taken from
    Yi.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Shinnang causes markets to be held at midday, assembling people and wares
    for exchanges after which each person retires with what was wanted; the idea was
    probably taken from Shih Ho.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After Shinnang, Hwang Ti, Yao, and Shun carry through changes and a spirit-like
    transformation so that the people approve their ordinances.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Hwang Ti, Yao, and Shun are said to have been helped by Heaven, to have good
    fortune, and to secure good order under heaven by wearing upper and lower garments
    as patterns to the people; the idea was probably taken from Chien and Khwan.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: An editorial note says the three lines of each trigram are emblematic of heaven,
    man, and earth, and glosses Hsiang as emblems or similitudes.
  category: other
  evidence_refs:
  - ev:10
