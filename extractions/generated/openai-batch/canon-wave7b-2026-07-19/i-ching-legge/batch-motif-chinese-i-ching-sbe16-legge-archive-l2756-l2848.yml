canonical_text:
  quote: "“Heaven produced the spirit-like things.”"
  summary: The passage discusses the divinatory tortoise and plant stalks as spirit-like
    instruments attributed to Heaven, notes skeptical views about divination from
    shells and stalks, recounts an anecdote in which Sze-ma Ki-ku advises Shao Phing
    to trust human intelligence rather than objects, and describes the stalk procedure
    for forming hexagrams through numbers, odd/even lines, and interpretive texts
    associated with King Wan and the duke of Kau. It also reports a qualified comparison
    between the numbers of the Yi and Pythagorean number theory.
  language: English
  quote_policy: quoted
