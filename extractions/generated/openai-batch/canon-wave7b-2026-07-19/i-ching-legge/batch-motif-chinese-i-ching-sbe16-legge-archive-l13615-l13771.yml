canonical_text:
  quote: ''
  summary: The passage explains line statements and symbolism for waiting, contention,
    and the host. It presents feast appliances and unbidden guests as auspicious when
    handled correctly, a cloud waiting to discharge rain as a model for waiting, heaven
    and water moving apart as Sung/Contention with counsel against prolonging dispute,
    and earth containing water as Sze/The Host, with emphasis on nourishing the people,
    ordered command, proper leaders, royal charges, and avoiding small or idle men
    in office.
  language: English
  quote_policy: summarized
