canonical_text:
  quote: ''
  summary: The passage includes the end of commentary against contention, the main
    text and commentary for the Sze or Army hexagram, and the opening of the Pi hexagram.
    Sze presents good fortune when firmness, correctness, and an aged experienced
    leader are present; it gives line statements about a host going forth by rules,
    a leader in the midst of the host receiving royal orders, inefficient leaders,
    retreat, birds in fields to be seized, and the great ruler appointing rulers and
    clan heads while excluding small men. The commentary explains Sze as military
    expedition in a feudal kingdom, with one trusted general appointed by the king
    and rules requiring a righteous end and right conduct. The Pi opening describes
    self-examination by divination concerning virtue, after which restless people
    come and late arrivals fare badly.
  language: English
  quote_policy: summarized
