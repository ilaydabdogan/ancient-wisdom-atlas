  quote: ''
  summary: The passage comments on several Yi hexagrams. It describes inner and outer
    trigrams, cases of King Wan and the count of Ai under difficulty, the obscuring
    of brightness, ordered family roles in Kia Zan, disunion in Khwei through Fire,
    Marsh, sisters, heaven and earth, and male and female, and the Kien condition
    of difficulty, peril, directional advantage, and the value of seeing a great man.
