canonical_text:
  quote: Chien indicates progress and success.
  summary: The passage gives the judgment and line statements for the Chien/Khiên
    hexagram, emphasizing humility as producing progress, good fortune, durable success,
    proper rulership, and controlled use of force. The commentary explains several
    line positions as symbols of humility, especially the strong third line among
    divided lines, called the lord of the hexagram.
  language: English
  quote_policy: quoted
