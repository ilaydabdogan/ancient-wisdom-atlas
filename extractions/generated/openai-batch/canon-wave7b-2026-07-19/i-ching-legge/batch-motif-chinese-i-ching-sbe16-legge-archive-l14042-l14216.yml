canonical_text:
  quote: heaven and earth, not in intercommunication, form Phi.
  summary: 'The passage interprets several hexagram images: heaven and earth not communicating
    as obstruction; heaven and fire as union among people; and heaven with fire above
    it as great possession. The superior man responds with restraint, classification,
    ethical discrimination, and prudent governance. Line explanations mention rulers,
    great men, small men, offerings, armies, hidden weapons, a city wall, a wagon,
    and resources under restraint.'
  language: English
