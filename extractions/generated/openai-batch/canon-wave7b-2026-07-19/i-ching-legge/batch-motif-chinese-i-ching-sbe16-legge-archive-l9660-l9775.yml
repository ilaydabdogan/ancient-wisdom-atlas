  quote: ''
  summary: The passage includes commentary on the Fang hexagram as abundance and prosperity,
    advising rulers to preserve prosperity through intelligence, illumination, and
    cooperation with able helpers. It also presents the Lu hexagram as the condition
    of the stranger or traveller, with line images involving lodging, livelihood,
    servants, fire, an axe, a pheasant, a bird's nest, laughter and crying, lost docility,
    and evil outcomes.
