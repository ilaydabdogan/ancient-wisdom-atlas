canonical_text:
  quote: ''
  summary: 'The passage gives Legge’s translated commentarial material on several
    I Ching hexagrams and lines: service to spiritual beings, the need to retire after
    reaching height, images of distress and repentance, the dry marsh as distress,
    the well as a source of nourishment and mutual aid, marsh and fire as change and
    calendrical ordering, animal markings as images of change, and the caldron as
    an image connected with correct position and Heaven’s appointment.'
  language: English
  quote_policy: summarized
