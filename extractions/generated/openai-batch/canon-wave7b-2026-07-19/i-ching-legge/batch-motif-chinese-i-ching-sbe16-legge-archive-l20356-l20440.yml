canonical_text:
  quote: ''
  summary: The passage comments on Khwan as a docile, receptive, transforming power
    that receives heaven's influence at the proper time. It includes translator's
    notes on kwei and shan as spirit/breath terms and on a comparison with Mencius.
    It then explains accumulated good and evil through family consequences and the
    image of hoar-frost leading to strong ice, glosses straightness and squareness
    as inward and outward moral order, describes restrained service without claiming
    merit, and closes with heaven-earth transformation producing plant and tree growth
    while blocked influence suggests obscured virtue.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Khwan is described as hard and strong, very still, able to give definite form,
    and as following its proper lord and regular course.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Khwan is said to contain all things, to have glorious transforming power,
    to receive the influences of heaven, and to act at the proper time.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The translator's note explains kwei and shan as spirit or breath terms, with
    one part returning to earth and another subtler part ascending.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says families that accumulate goodness receive abundant happiness,
    while families that accumulate evil receive abundant misery.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The murder of a ruler by a minister or of a father by a son is said not to
    arise suddenly, but from gradually accumulated causes and lack of early discrimination.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Yi image of treading on hoar-frost and the later arrival of strong ice
    is used to show the natural development of things.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Straightness is glossed as correctness of the internal principle, and squareness
    as righteousness of the external act; the superior man maintains inward correctness
    and adjusts outward conduct accordingly.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A divided-line subject with excellent qualities keeps them restrained and,
    if successful in the king's service, does not claim success for himself.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The way of earth is described as not claiming the merit of achievement, but
    bringing things to their proper issue on behalf of heaven.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Changes and transformations produced by heaven and earth make plants and trees
    grow luxuriantly; if their reciprocal influence is shut up and restrained, virtuous
    and able people are likened to lying in obscurity.
  category: sequence
  evidence_refs:
  - ev:7
