  quote: ''
  summary: The passage explains several line statements through sayings attributed
    to “The Master.” A hidden dragon is interpreted as a powerful but withdrawn figure
    for whom active doing is not timely. A dragon appearing in the field is interpreted
    through sincerity, displayed virtue, transformation, and rulerly virtue. A superior
    man is described as vigilant, careful, and advancing in virtue. An editorial note
    embedded in the range discusses textual attribution, older parallels, Confucius,
    and Analects-style Confucian teaching.
  language: English
  quote_policy: summarized
