canonical_text:
  quote: The superior man, in accordance with this, will sacrifice his life in order
    to carry out his purpose.
  summary: The passage gives commentary on several hexagram images and line statements.
    Wind under the sky is said to penetrate everywhere. Earth with marsh waters raised
    above it forms 3hui, prompting the superior man to repair weapons against contingencies
    and leading to commentary on preserving union. Wood growing in earth forms Shang,
    prompting attention to virtue and gradual upward accumulation; related lines describe
    upward advance, stairs, offerings on a mountain, and eventual decay after blind
    ascent. A marsh above a defile drained of water forms Khwan, prompting the superior
    man to sacrifice his life to fulfill his purpose; related lines mention a dark
    valley and being straitened amid wine and viands. Notes also discuss repression
    of the unworthy, concealed plans timed by Heaven, and avoiding evil communication.
  language: English
  quote_policy: quoted
