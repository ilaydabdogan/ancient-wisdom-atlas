canonical_text:
  quote: ''
  summary: 'The passage presents the text for the Khien hexagram: an overall judgment
    describing Khien as great, originating, penetrating, advantageous, correct, and
    firm; six undivided line statements using dragon imagery from hidden depths through
    field, deep, sky, and overstepping limits; a seventh statement about all-strong
    lines and a host of dragons without heads; and editorial explanation of hexagram
    structure, trigrams, line numbering, and the use of nine and six for yang and
    yin lines.'
  language: English
  quote_policy: summarized
