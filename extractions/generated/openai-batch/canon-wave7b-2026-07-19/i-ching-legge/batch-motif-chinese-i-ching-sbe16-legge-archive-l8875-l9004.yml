canonical_text:
  quote: ''
  summary: The passage gives the Ting/Caldron hexagram judgment of great progress
    and success, followed by line images of a caldron overturned, filled for cooking,
    changed at its ears, broken at its feet, fitted with yellow ears and metal rings,
    and fitted with jade rings. It includes images of a concubine and son, an enemy
    unable to approach, pheasant flesh not eaten, rain removing grounds for repentance,
    and contents intended for the ruler being spilled. Commentary explains Ting as
    a pictorial caldron with three feet and two ears, used for preparing food for
    table and altar, and maps the hexagram lines to the vessel’s feet, body, ears,
    and handle. It also states that the furnace and caldron transform things, and
    that Ting concerns government nourishment of men of talent and virtue. Interleaved
    commentary on change emphasizes cautious and correct change, water and fire coming
    into contact, a minister below the ruler, and a tiger emblem for the lord of the
    hexagram.
  language: English
  quote_policy: summarized
