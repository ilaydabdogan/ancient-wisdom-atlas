canonical_text:
  quote: ''
  summary: The passage explains the formation of the Yi lineal figures from whole
    and divided lines into four symbols, eight trigrams, and sixty-four hexagrams;
    discusses and rejects a circular representation of the Great Extreme as an origin
    of the two forms; reviews attributions to Fuhsi and King Wan; and presents a traditional
    account in which Heaven, the tortoise and divining plant, the Ho Map, the Lo writing,
    and a dragon-horse from the Yellow River provide models or signs used by sages.
  language: English
  quote_policy: summarized
