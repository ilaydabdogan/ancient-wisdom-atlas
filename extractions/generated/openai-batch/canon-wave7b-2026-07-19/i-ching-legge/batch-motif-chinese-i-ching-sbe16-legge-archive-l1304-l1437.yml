  text: The passage states that the Great Extreme is said to have produced the two
    elementary Forms, but the writer questions what the term means and says it does
    not occur elsewhere in old Confucian literature.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A later scholar, Hsi, is reported to have represented the Great Extreme by
    a circle, based on the philosopher Kau, while warning that this representation
    did not come from Fuhsi.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The writer argues that the circular representation fails to explain how a
    whole and divided line arise from the Great Extreme.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
