canonical_text:
  quote: ''
  summary: 'The passage comments on several I Ching line images and hexagram symbols:
    an unguided deer chase abandoned by the superior man; difficulty in seeking help,
    bestowing favours, and a blood-tear lament; Khan as water, rain, cloud, and thunderous
    gloom; Mang as a mountain with a spring issuing below, connected with resolute
    conduct, virtue, correction, ignorance, docility, and education; and Hsii as clouds
    ascending over the sky, connected with feasting and graded forms of waiting at
    the border, sand, mud, and blood.'
  language: English
  quote_policy: summarized
