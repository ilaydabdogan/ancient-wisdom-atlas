canonical_text:
  quote: ''
  summary: The passage presents the Lin hexagram as promising progress and success
    under firm correctness, with danger in the eighth month. Its lines describe different
    modes of advancing, including advancing in company, over-pleased advance, highest
    advance, the advance of wisdom appropriate to a great ruler, and the advance of
    honesty and generosity. Commentary glosses Lin as the approach of authority, explains
    the figure as two strong lines advancing on four weak lines, warns that advancing
    power will decay, and relates sun/day to Yang, moon to Yin, and the eighth month
    to the coming of Yin. An embedded adjacent commentary discusses weak and strong
    lines as ruler and minister, and as son and mother symbolism.
  language: English
  quote_policy: summarized
