canonical_text:
  quote: ''
  summary: The passage combines Legge's commentary on numerological claims in Appendix
    III with translated statements about the Yi. It discusses numerical correspondences,
    the Ho map, divining stalks, odd/even and divided/undivided lines, four seasons
    and intercalation, hexagram line numbers, and the Yi as a responsive, still, spirit-like
    divinatory system through which a superior man and sages seek knowledge of outcomes
    and hidden processes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage discusses pairs and sums among two numerical series, including
    odd and even totals that together make 55.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Legge says later writers use the Lo writing to aid the Ho map in explaining
    the five elements, while he considers the five elements foreign to the Yi.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Paragraph 51 is described as a process of divination by manipulating stalks,
    though Legge says it is confused by adding the four seasons and intercalation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Ho map is described as having five central circles symbolical of heaven
    and ten dark terrestrial markings.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Fifty divining stalks or slips are reduced by setting one aside; the remaining
    forty-nine are divided into odd and even parcels, which are said to represent
    strong/undivided and weak/divided lines.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The stalks are counted by four, associated with the four seasons; remainders
    are associated with intercalary days, and the passage states a rule of two intercalary
    months in five years.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage gives equal actual counts of undivided and divided lines in the
    hexagrams, assigns representative numbers 9 and 6, and derives 360 as a standard
    year-length figure.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Before private or public action, a superior man asks the Yi in words, and
    the answer is said to come like an echo, giving knowledge of the coming result.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The stalks are manipulated by threes and fives, arranged on opposite sides
    and one up and one down, to determine changes and form figures pertaining to heaven
    or earth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Yi is described as without thought or action, still and unmoving, yet
    when acted on it penetrates phenomena and events under the sky and is called spirit-like.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: The operations forming the Yi are described as the method by which sages searched
    deeply and investigated minute springs of things.
  category: action
  evidence_refs:
  - ev:10
