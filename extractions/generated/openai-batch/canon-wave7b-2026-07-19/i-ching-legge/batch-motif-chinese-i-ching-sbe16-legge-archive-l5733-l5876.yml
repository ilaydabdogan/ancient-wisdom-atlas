  quote: ''
  summary: The passage presents Shih Ho as promising success and recommending legal
    constraints. Its line images include feet in stocks, biting or gnawing through
    flesh, judicial pledges of money and arrows, yellow gold, and a cangue. The commentary
    explains Shih Ho as “Union by gnawing,” comparing an obstructed mouth to obstacles
    in the body politic removed by force or legal constraints. It also explains court
    pledges and judgment. The line range additionally contains interleaved commentary
    on observation, retirement, rulership, and self-examination, and the beginning
    of the Pi hexagram with adornment of feet and beard.
  language: English
  quote_policy: summarized
