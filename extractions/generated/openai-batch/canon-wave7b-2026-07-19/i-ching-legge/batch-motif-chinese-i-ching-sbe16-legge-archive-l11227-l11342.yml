canonical_text:
  quote: ''
  summary: 'The passage comments on hexagram symbolism: a weak line in a proper even
    place restrains other lines, but only slightly, while undivided lines signify
    vigor and continued progress. Dense clouds without rain are read as restraint
    still operating, with rain expected later; this is connected to the House of Adu
    being restrained by Shang until a reversal would bring beneficent government.
    The passage also explains a God-given or Heaven-linked position as a place of
    authority. It contrasts ThAi, where heaven and earth and social high and low communicate
    and the superior man increases, with Phi, where they do not communicate and the
    small man increases. Legge rejects a conjugal reading of heaven-earth communication
    and states that Yi antinomies concern authority and strength versus inferiority
    and weakness.'
  language: English
  quote_policy: summarized
