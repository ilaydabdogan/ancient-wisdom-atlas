  quote: ''
  summary: The passage presents the Yi as a book that flourished in a time of anxiety
    and calamity, identifies nine hexagrams with aspects and uses of virtue, describes
    the method of studying changing lines in six hexagram positions, and states that
    the book reveals the causes of anxieties and calamities while requiring proper
    people to carry its principles into practice.
  language: English
  quote_policy: summarized
