  summary: 'The passage explains a sequence of hexagrams or states by giving reasons
    why one follows another: diminution leads to increase; increase to dispersion;
    dispersion to meeting and collection; collection and ascent to distress and return;
    change to the caldron and vessels; motion to stopping and renewed advance; greatness
    to loss of dwelling and the condition of strangers; entering to pleasure and then
    division; division to regulation, belief, practice, remedying evils, and an unending
    succession of events.'
