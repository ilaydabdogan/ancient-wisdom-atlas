canonical_text:
  quote: ''
  summary: The preface discusses P. Angelo Zottoli’s Latin treatment of the Yi, including
    a quoted account that presents the book as composed from Fa-hsi’s figures, king
    Wan’s definitions, the duke of Kau’s symbols, and Confucius’ commentaries. That
    account describes continuous and broken lines, trigram and hexagram relations,
    images, statements, and oracles consulted by lot for guidance, with claims of
    communication with spirits and knowledge of future events. The passage then criticizes
    a projected translation by Terrien de Lacouperie and R. K. Douglas for excluding
    traditional commentaries, comments on possible Accadian evidence, and notes controversy
    over rendering Ti and Shang Ti as God.
  language: English with embedded Latin quotation
  quote_policy: summarized
