canonical_text:
  quote: ''
  summary: The passage gives appendix explanations for Hexagrams LIII, LIV, and the
    beginning of LV. It interprets trigram images of mountain and tree, marsh water
    and thunder, and thunder and lightning, applying them to gradual virtue, marriage-related
    disorder or caution, and exact judicial punishment. It also comments on line images
    including a small officer, eating and drinking, a husband and pregnant wife, resistance
    to plunderers, branches, feathers, an ancillary younger sister, a solitary widow,
    delayed marriage, unequal sleeves, an empty basket, screens, a broken arm, and
    the Bushel constellation seen at midday.
  language: English
  quote_policy: summarized
