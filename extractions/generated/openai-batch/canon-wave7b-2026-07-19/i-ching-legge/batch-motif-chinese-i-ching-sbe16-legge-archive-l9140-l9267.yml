  summary: 'The passage presents material on the LII Kan hexagram: a person rests
    like the back, loses self-consciousness, walks in a courtyard without noticing
    others, and line statements describe various body parts being kept at rest. Commentary
    explains Kan as mountain, associated with resting and arresting, and interprets
    the hexagram as mental rest in what is right or in principle. The excerpt also
    contains interleaved commentary on movement, peril, seven days, and a sacrificial/caldron
    image described as fanciful.'
