canonical_text:
  quote: ''
  summary: 'The passage comments on a general said to have received the favour of
    Heaven, explaining this as the ruler or king’s confidence. It then treats Hexagram
    VIII, Pi, formed by earth with water above it, as an image of union: ancient kings
    establish states and maintain affectionate relations with princes, while the line
    statements describe proper and improper seeking of union and a royal hunting image.
    It next introduces Hexagram IX, Hsiao Kh, formed by sky with wind above it, from
    which the superior man adorns the outward manifestation of virtue. Notes explain
    water on earth as an emblem of close union, the king as centre and cause of union,
    and a possible textual corruption in the royal hunting passage.'
  language: English
  quote_policy: summarized
