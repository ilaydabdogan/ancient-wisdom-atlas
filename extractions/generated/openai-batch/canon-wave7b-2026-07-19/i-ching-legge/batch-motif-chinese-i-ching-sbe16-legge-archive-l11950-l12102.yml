canonical_text:
  quote: ''
  summary: Commentary on several hexagrams explains images of double brightness, mutual
    influence, long continuance, timely retiring, great strength, advancing, and brightness
    obscured. The passage uses trigram relations, heaven and earth, sages, sun and
    moon, seasons, thunder and wind, and a rewarded prince to explain divinatory meanings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The phrase “double brightness” is discussed as referring either to a ruler
    becoming brighter or to ruler and ministers combining their brightness; the commentator
    prefers the former view.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hsien is glossed as Kan, meaning mutual influencing; the weak trigram is above
    and the strong trigram below, their influences move and respond, and they form
    a union with the male placed below the female.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: The mutual-influence explanation is connected with the condition of marrying
    a young lady, firmness and correctness, and good fortune.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Heaven and earth exert influences that lead to transformation and production
    of all things; sages influence human minds, leading to harmony and peace under
    the sky.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Hang denotes long continuance; its account joins strong and weak trigrams,
    thunder and wind, mutual communication, docility, motive force, and responding
    strong and weak lines.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The way of heaven and earth is described as operating without stopping, and
    spent moving power is said to begin again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The sun and moon perpetuate their shining, the four seasons perpetuate production
    by changing and transforming, and sages persevere until all under the sky are
    transformed and perfected.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Thun is explained as successful progress in retiring; the action occurs according
    to the time, while small men gradually encroach and advance.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A note says the superior man may maintain his place but withdraws when he
    recognizes the advance of small men.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Ta Kwang presents what is great becoming strong, with strength directing movement
    and vigour linked to correctness and greatness.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: 'Jin is advancing: the bright sun appears above the earth, docile submission
    cleaves to Great brightness, and a prince who secures tranquillity receives many
    horses and three interviews in one day.'
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Ming I is explained through Earth and Brightness entering into the midst of
    Earth, giving the idea of brightness wounded or obscured.
  category: setting
  evidence_refs:
  - ev:12
