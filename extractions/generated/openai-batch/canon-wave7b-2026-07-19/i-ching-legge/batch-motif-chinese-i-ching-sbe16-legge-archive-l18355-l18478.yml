canonical_text:
  quote: ''
  summary: The passage describes the Yi as opening knowledge of events, guiding undertakings,
    and resolving doubts. It attributes spirit-like or wise qualities to divining
    stalks, diagrams, and six lines; describes sages who purify themselves, know coming
    events and past experience, and institute divinatory things for the people's use;
    explains change through analogies of a shut and opened door and the emergence
    of a bud into complete form; presents a sequence from the Grand Terminus to two
    Forms, Four Symbols, and eight Trigrams; and lists cosmic and human exemplars,
    ending with stalks and tortoise-shell as agencies for determining good or ill.
  language: English
  quote_policy: summarized
