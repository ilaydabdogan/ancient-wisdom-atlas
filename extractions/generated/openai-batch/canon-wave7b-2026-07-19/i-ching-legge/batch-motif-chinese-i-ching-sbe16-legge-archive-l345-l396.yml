  summary: The passage is part contents listing and part preface. The translator recounts
    making an early translation of the Yi King, failing at first to understand it,
    setting the work aside while hoping for a guiding clue, recovering the manuscript
    after it was soaked in Red Sea water, and later deciding that the Text should
    be studied apart from later Appendixes because the layers are separated by time
    and often incongruous.
