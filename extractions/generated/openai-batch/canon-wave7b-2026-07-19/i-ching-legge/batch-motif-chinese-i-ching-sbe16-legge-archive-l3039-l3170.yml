canonical_text:
  quote: ''
  summary: The passage discusses the great man or sage as harmonized with Heaven,
    Earth, seasons, and spiritual agents; summarizes a doctrine of familial recompense
    for accumulated good or evil; introduces the fifth appendix on trigrams and divination;
    and describes a symbolic trigram family of Heaven/father, Earth/mother, and six
    son/daughter trigrams, while cautioning against reading it as a literal marriage
    myth or as a Noahic parallel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The great man is described as being in harmony with heaven and earth, the
    sun and moon, the four seasons, and spiritual agents.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The great man may precede or follow Heaven, and Heaven, humans, and spiritual
    agents are said not to act in opposition to him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A family that accumulates goodness is said to receive abundant happiness,
    while a family that accumulates evil is said to receive abundant misery.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The commentary interprets the recompense of good and evil as taking effect
    in the family or posterity, not necessarily in the individual, and says the old
    classics are silent about other retribution beyond time.
  category: other
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The fifth appendix is described as remarks on the trigrams, including earlier
    and later arrangements, names and attributes, the work of God in nature as a progress
    through the trigrams, and natural objects symbolized by them.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: The ancient sages are said to have made the Yi to give mysterious assistance
    to spiritual Intelligences and to have produced the divining plant procedure.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The commentator interprets the lineal figures as a mirror of nature by which
    people might better understand unseen and spiritual operations behind phenomena.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: A trigram called Hien or Kien is identified with heaven and styled father;
    Khwain or Khwan is identified with earth and styled mother.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Six other trigrams are described as resulting from first, second, and third
    applications and are called oldest, second, and youngest sons and daughters.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The commentator says a fable of a marriage between Kien and Khwan came from
    this language, but he states that he finds no marriage-union between heaven and
    earth in the paragraph itself.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: The commentator reports that some interpreters saw Noah, Noah's wife, their
    three sons, and the sons' wives in the two primary and six other trigrams because
    both form an eightfold group.
  category: other
  evidence_refs:
  - ev:7
