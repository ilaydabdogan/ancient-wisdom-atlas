canonical_text:
  quote: Heaven's (colour) is azure and earth’s is yellow.
  summary: The passage explains emblems in the Khwin hexagram, including the superior
    man associated with yellow correctness, a contest between yin and yang line-subjects
    described with dragons and blood, and the azure-yellow mixture of heaven and earth.
    It then begins Appendix V, describing ancient sages making the Yi, producing rules
    for the divining plant, assigning numbers to heaven and earth, forming trigrams
    from divided and undivided lines, and using line changes to discriminate what
    is right and develop every nature according to Heaven.
  language: English
  quote_policy: quoted
