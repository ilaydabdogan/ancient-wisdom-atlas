canonical_text:
  quote: ''
  summary: The passage comments on several hexagrams by deriving their meanings from
    component trigrams, line positions, and natural symbols. It discusses Kun/Thun
    as involving trigrams Xan and Khan, rejects a sexualized interpretation, describes
    trouble in nature as symbolic of political and social disorder, explains Mang
    as instruction of the young and ignorant through sincere divination, and explains
    Hsii as waiting before danger with eventual advantage in crossing the great stream.
    It also identifies mountain and water imagery as symbols of stoppage and peril,
    and describes the fifth line as an honored, Heaven-given seat associated with
    the ruler or king.
  language: English
  quote_policy: summarized
