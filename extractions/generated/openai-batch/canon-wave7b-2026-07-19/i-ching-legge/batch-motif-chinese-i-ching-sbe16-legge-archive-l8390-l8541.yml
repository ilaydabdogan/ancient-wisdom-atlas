canonical_text:
  quote: The character Shang is used of advancing in an upward direction, ‘advancing
    and ascending.’
  summary: The passage presents and comments on the Shang hexagram as upward advance,
    success, meeting the great man, southward progress, sacrificial offerings, royal
    employment at Mount Ai, ceremonial stair ascent, and blind advance requiring correctness.
    It also includes a preceding union-themed commentary and the opening line of the
    Khwăn hexagram, where a subject is straitened under a tree stump and enters a
    dark valley for three years.
