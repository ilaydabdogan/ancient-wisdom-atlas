canonical_text:
  quote: ''
  summary: The passage presents Confucian-style comments on Yi lines. It discusses
    the small man and correction through restraint, the accumulation of good and evil
    acts, prudent remembrance of danger in times of order, the evil of high office
    or heavy burden exceeding capacity, the superior man's knowledge of the earliest
    beginnings of events, the Yen family's son's correction of errors, generative
    transformation through heaven-earth and male-female interaction, and the superior
    man's need for inner composure before influencing others.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master says the small man lacks shame or fear regarding wrong conduct,
    but correction in small matters can make him careful in greater matters; a Yi
    line is cited about feet in stocks and disabled toes with no further blame.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says good and evil acts accumulate, and that the small man's neglect
    of small good acts and failure to avoid small evil acts lead to great wickedness
    and guilt; a Yi line is cited about wearing a cangue and destroyed ears.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Master says one who keeps danger, ruin, and disorder in mind while safe,
    secure, and orderly preserves person, states, and clans; a Yi image compares firmness
    to being bound to bushy mulberry trees.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Master says small virtue in high office, small wisdom with great plans,
    and small strength with a heavy burden seldom avoid evil; a Yi line images an
    overturned tripod and the ruler's food overturned.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Master describes spirit-like wisdom as knowing the springs or slight beginnings
    of things; the superior man sees early indications and acts without waiting a
    day, being firm as a rock.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The son of the Yen family is described as recognizing when he has done something
    not good and not doing it again; a Yi line describes returning from an error before
    it has gone far.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage describes an intermingling of heaven and earth and an intercommunication
    of seed between male and female, producing transformation; a Yi line mentions
    three walking together, one disappearing, and one man getting his mate.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Master says the superior man composes himself before moving others, makes
