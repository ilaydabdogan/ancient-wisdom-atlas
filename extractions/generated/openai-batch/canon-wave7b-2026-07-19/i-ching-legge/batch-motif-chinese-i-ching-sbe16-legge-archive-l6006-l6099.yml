canonical_text:
  quote: ''
  summary: The passage contains commentary on the Po hexagram’s imagery of a couch
    and threatened occupant, including overthrowers, fishes, a rightful sovereign,
    and the plotters’ defeat. It then presents the Fu hexagram as return or coming
    back, with auspicious returns, perilous repeated returns, a noble return, and
    a final warning that being astray about return can bring military disaster. The
    commentary states that when decay reaches its climax, recovery begins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Po commentary describes a bed or couch with an occupant and says the occupant
    is to be overthrown, or that an attempt is made to overthrow him.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The attempted overthrow is described as beginning with the legs of the couch
    and then advancing to the frame of the couch.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the danger becomes imminent, the couch has been overthrown and the occupant
    is at the mercy of destroyers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The fifth-line subject is called lord of the other weak lines; he and the
    others are represented as fishes following one another as if strung together.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The fifth-line subject is said to be loyal to the yang sixth-line subject,
    who is the rightful sovereign in his palace.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The strong sixth-line subject survives attempts against him, gains fresh vigor,
    the people again cherish their sovereign, and the plotters bring about their own
    overthrow.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Fu hexagram indicates free course and progress, absence of distress in
    exits and entrances, friends coming, return to the proper course, return in seven
    days, and advantage in movement.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The first, second, and third Fu lines describe return from a minor error,
    admirable return, and repeated returns that are perilous but without error.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A later Fu line describes a subject in the center among divided lines returning
    alone to the proper path, and the fifth line describes a noble return without
    ground for repentance.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The top Fu line describes a subject astray about returning; if he puts the
    hosts in motion, the result is great defeat affecting the ruler of the state and
    a disaster not repairable even in ten years.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The commentary says Fu symbolizes returning, coming back, or coming over again,
    and that when decay has reached its climax, recovery begins.
  category: other
  evidence_refs:
  - ev:10
