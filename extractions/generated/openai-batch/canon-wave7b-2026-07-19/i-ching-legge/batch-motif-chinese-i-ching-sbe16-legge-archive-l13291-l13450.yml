canonical_text:
  quote: ''
  summary: The passage begins Appendix II, a treatise on the symbolism of the hexagrams
    and line explanations. It treats Khien as heaven and strength, with dragon images
    moving from hidden depth to field, sky, and excess; it treats Khwan as earth and
    sustaining power, with images of hoarfrost becoming ice, straight line and square,
    restrained excellence, tied sack, yellow lower-garment, dragons fighting in the
    wild, and weak divided lines. The commentary explains Great and Lesser Symbolism,
    redoubled trigrams, one heaven and one earth, and begins the third hexagram, Aun,
    formed by clouds and thunder, with government ordered like warp and woof.
  language: English
  quote_policy: summarized
