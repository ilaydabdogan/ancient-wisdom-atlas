canonical_text:
  quote: ''
  summary: The passage gives Appendix I explanations for several hexagrams. It explains
    Thung Zan as union through a weak central line responding to Khien and says the
    superior man can affect all minds under heaven. It explains Ta Yu through a weak
    honoured central line to which strong lines respond. It then treats humility as
    valued by heaven, earth, spiritual beings, and men. It describes Yii as harmonious
    obedience joined with movement, ordering both cosmic cycles and sage governance.
    It closes by explaining Sui as following, with the strong placing itself under
    the weak.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Thung Zan, a weak line occupies an influential central place and responds
    to the corresponding line in Khien above; this is given as the basis for the name
    translated as “Union of men.”
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Thung Zan is said to indicate progress and success and the advantage of crossing
    the great stream because it contains strength symbolled in Khien; the superior
    man is said to comprehend and affect the minds of all under the sky.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Ta Yu, a weak line occupies the place of honour, is grandly central, and
    receives response from the strong lines above and below.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ta Yu is described as combining strength and vigour with elegance and brightness,
    responding to heaven, and acting at proper times.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: For Ahien, heaven is said to send beneficial influences downward, while earth,
    lying low, sends its influences upward.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Heaven diminishes the full and augments the humble; earth overthrows the full
    and replenishes the humble; Spiritual Beings inflict calamity on the full and
    bless the humble; men hate the full and love the humble.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Humility in a position of honour is said to make that position more brilliant,
    while humility in a low position prevents overreaching; this leads to a good issue
    for the superior man.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In Yii, a strong line is responded to by all the other lines, and docile obedience
    employs movement, producing harmony and satisfaction.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The same docile obedience joined with movement is applied to heaven and earth,
    and also to setting up feudal princes and putting hosts in motion.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Heaven and earth show docile obedience with movement, so the sun and moon
    keep time and the four seasons do not deviate from their order.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The sages show docile obedience in their movements, so punishments and penalties
    are entirely just and the people submit.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In Sui, the strong trigram comes and places itself under the weak; movement
