canonical_text:
  quote: ''
  summary: The passage gives commentary on Hexagrams XXII-XXIV. It interprets mountain
    and fire as ornament that must remain secondary to simple truth; earth with mountain
    as Po, involving overthrow and restoration of social order; and earth with thunder
    as Fo, linked to winter-solstice stillness, closed passes, and moral return from
    error.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The topmost line is described as free from error and marked by no ornament
    except simple white; this shows the subject has attained his aim.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A mountain containing grass, trees, and many things is illuminated by a fire
    burning below it, bringing them out in beauty and giving the idea of ornament.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The commentary states that elegance and ornament may help small processes
    of government, while great matters of judgment demand simple, unornamented truth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Po is formed from the trigrams for earth and mountain; superiors respond by
    strengthening those below them to secure peace and stability in their own position.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The couch image proceeds from injury to the legs, to injury to the frame,
    to injury to the skin of the one lying on it, indicating ruin drawing near.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A fifth-line subject obtains favor for palace inmates; later commentary describes
    this line as occupying an honorable place and as emblematic of a queen who leads
    others to palace favor without jealousy.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The superior man is described as being in a carriage and carried along by
    the people, while small men overthrow their own dwellings; later commentary says
    this shows the ruler restored to the people's favor and concord restored in the
    state.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Fo is formed from earth and thunder in its midst; ancient kings shut the gates
    of the passes on the winter solstice, stopping merchants' journeys and princes'
    inspections of their states.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Several line explanations concern return from error, admirable return, returning
    alone, noble return, and evil from being astray on the subject of returning.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Thunder in the midst of the earth is described as shut up and silent, like
