canonical_text:
  quote: ''
  summary: The passage explains that six component lines appear through addition;
    strong and weak lines exchange places, producing changes in the diagrams. The
    appended explanations assign good or ill to each form and determine divinatory
    movements. Fortune, misfortune, repentance, and regret arise from these movements.
    Strong and weak lines have proper places, but their changes accord with the time.
    Good and ill oppose one another by an exact rule, and the same rule is said to
    govern heaven and earth, the sun and moon, and all movements under the sky. A
    later editorial note says natural phenomena are exhibited in the Yi and describes
    the sage makers as virtuous and wise enough to stand between Heaven and humankind.
  language: English
  quote_policy: summarized
