canonical_text:
  quote: ''
  summary: The passage presents hexagram Thun, associated with retiring or withdrawal,
    giving line statements about a retiring tail, firmness like a yellow ox-hide thong,
    being bound while retiring, admirable and noble retirement, and commentary explaining
    withdrawal before the growth of small men. It also begins hexagram Ta Kwang, Great
    Strength, with line statements warning against advancing by strength in the toes
    and comparing overexerted strength to a ram butting a fence and entangling its
    horns. The passage includes commentary on line relations, husband-wife symbolism
    in a preceding hexagram discussion, and cross-references to the Analects and the
    Shih.
  language: English
