canonical_text:
  quote: What a well is to those in its neighbourhood, and indeed to men in general,
    that is government to a people.
  summary: 'The passage presents line images and commentary centered on a well: leaking
    water, an unused cleared well, a well with proper lining, clear spring water,
    and water drawn up and left uncovered. The commentary explains Jing as the symbol
    of a communal well and moralizes the well as a model for government, rulers, and
    practical application of principles. The passage also includes a fragmentary line
    commentary about a constrained subject, a minister, sincerity, and a bound figure
    on a perilous summit whose repentance and forward movement are fortunate.'
  language: English
  quote_policy: quoted
