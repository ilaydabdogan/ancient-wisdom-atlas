canonical_text:
  quote: ''
  summary: 'The passage includes commentary on cyclical return in the hexagram sequence
    and then presents the Wo Wang hexagram: sincerity, correctness, and firmness bring
    progress, while incorrect action brings error. The line statements include auspicious
    advance, harvest without prior cultivation, calamity involving a tied ox taken
    by a passer-by and blame falling on neighbours, firmness without error, illness
    treated by not using medicine, and error from action at the top line. Commentary
    defines Wo Wang as freedom from recklessness and insincerity, linked with Heaven
    and the highest humanity.'
  language: English
  quote_policy: summarized
