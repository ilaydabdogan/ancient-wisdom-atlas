canonical_text:
  quote: ''
  summary: The passage describes the Yi as both a book and a system of divinatory
    lineal figures whose strong and weak lines change in correspondence with external
    phenomena. It quotes statements that the Yi accords with heaven and earth, that
    the sage resembles and understands heaven and earth, and that the sage uses diagrams
    to represent phenomena. It then notes early Chinese divination by tortoise-shell
    and by manipulated plant stalks, while adding that divination was not meant to
    discover future events absolutely.
  language: English
  quote_policy: summarized
