canonical_text:
  quote: ''
  summary: Legge introduces the Yi King text as sixty-four symbolic essays based on
    six-line figures. He describes King Wan's explanations of whole hexagrams, the
    duke's line-by-line emblematic interpretations, later divinatory use of the figures
    as oracles, and Appendix accounts of the origin of the trigrams, including Pao-hsi/Fu-hsi's
    observation of heaven, earth, living creatures, and things near and far, plus
    the Great Extreme producing two Forms, four Emblematic Symbols, and eight Trigrams.
  language: English
  quote_policy: summarized
