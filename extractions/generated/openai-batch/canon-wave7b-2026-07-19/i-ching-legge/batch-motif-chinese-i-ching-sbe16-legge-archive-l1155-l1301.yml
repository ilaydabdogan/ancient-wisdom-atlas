- id: obs:4
  text: King Wan takes the hexagrams one after another and gives the significance
    of each as a whole, with indications of action and whether it will be lucky or
    unlucky.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The duke of XA4u begins with the bottom line and expresses the significance
    of each line through symbolical or emblematical illustration, also indicating
    good or bad fortune.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Later people divined by the hexagrams and used the words under them as oracles
