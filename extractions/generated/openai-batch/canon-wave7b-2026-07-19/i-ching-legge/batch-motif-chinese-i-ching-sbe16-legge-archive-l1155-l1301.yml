  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: One Appendix account says Pao-hsi observed forms in the sky, patterns on the
    earth, appearances of birds and beasts, qualities of soil, his own person, and
    things in general.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After these observations, Pao-hsi devised the eight lineal figures of three
    lines each to display operations in nature and classify qualities of things.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The eight trigrams are said to represent heaven or sky, waters, fire with
    sun and lightning, thunder, wind and wood, water in forms such as rain and streams,
    hill or mountain, and earth.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Another Appendix account says the Great Extreme produced the two Elementary
    Forms, which produced four Emblematic Symbols, which produced the eight Trigrams.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The eight Trigrams are said to determine good and evil issues of events, from
    which the great business of life ensued.
  category: attribute
  evidence_refs:
  - ev:7
