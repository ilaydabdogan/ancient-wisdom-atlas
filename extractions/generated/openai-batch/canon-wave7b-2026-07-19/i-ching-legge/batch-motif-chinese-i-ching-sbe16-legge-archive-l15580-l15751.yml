canonical_text:
  quote: ''
  summary: The passage gives commentarial explanations for family regulation, Khwei,
    and Kien. It links household order with severity, docility, mutual love, affection,
    harmony, majesty, and true character. It then describes Khwei as fire above marsh-water,
    with the superior man admitting diversity amid agreement, and gives line images
    of bad men, a lord in a by-passage, a dragged carriage, united desires, a hereditary
    minister, and rain after doubts pass. It describes Kien as mountain with water
    above, prompting self-examination and cultivation of virtue, and repeatedly advises
    waiting or remaining stationary amid difficulty while help, friends, and a great
    man are encountered.
  language: English
  quote_policy: summarized
