canonical_text:
  quote: ''
  summary: The passage comments on lines of the hexagram Sze, presenting a military
    expedition governed by a sovereign-appointed commander. It contrasts unified command
    with divided authority, treats retreat as correct when advance would be disastrous,
    interprets birds in the fields as plunderers or invaders to be put down by rightful
    authority, and describes the great ruler rewarding meritorious officers after
    victory while excluding morally unfit men from offices over land and people. It
    then characterizes Sze as a specimen of the Yi’s emblematic line figures conveying
    practical lessons.
  language: English
  quote_policy: summarized
