canonical_text:
  quote: ''
  summary: The passage presents portions of the Khwan hexagram concerning distress,
    restraint, sacrificial sincerity, physical injury, blocked or dangerous positions,
    and repentance. Its commentary explains Khwan through the image of a tree or plant
    confined in an enclosure and interprets the hexagram as good men being straitened
    by bad men. The passage then begins the Jing or Well hexagram, describing the
    well as a stable source of benefit despite changing towns, while warning of a
    broken bucket, failed drawing, and a muddy old well avoided by creatures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One line subject is straitened amid wine and viands; red knee-covers of the
    ruler come to him; he is told that sincerity as in sacrificing is good, while
    active operations lead to evil without blame.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The third line subject is straitened before a frowning rock, lays hold of
    thorns, enters his palace, does not see his wife, and receives an evil forecast.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fifth line subject is shown with nose and feet cut off, straitened by
    ministers in scarlet aprons, yet leisurely and satisfied; sincerity as in sacrificing
    is again recommended.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The sixth line subject is straitened as if bound with creepers or placed high
    in danger, speaks of repenting if he moves, and is promised good fortune if he
    repents former errors and goes forward.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The commentary describes Khwan as a picture of a tree within an enclosure
    or a plant fading for lack of room, conveying straitening and distress.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The commentary says features of the hexagram indicate the repression or straitening
    of good men by bad men.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The commentary states that actions, not words, are required in the situation
    described by the hexagram.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The commentary identifies the subject of the second line as straitened while
    faring sumptuously, and says the ruler comes to help, recognized by red or vermillion
    knee-covers.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: 'The commentary explains the third-line distress as reckless action: the subject
    is wounded abroad, returns to his family, and finds none to receive him.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The commentary says assistance from the fourth line is delayed and that the
    first line is overridden by the second, represented as a chariot of metal.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the Jing hexagram, a town site may change while the well remains unchanged;
