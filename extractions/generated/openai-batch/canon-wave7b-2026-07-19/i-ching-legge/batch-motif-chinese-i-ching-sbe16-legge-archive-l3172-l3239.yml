  summary: Legge discusses explanations of the trigrams, stating that the passage
    does not present the other six trigrams as generated by a marriage-union of Khien
    and Khwan, but rather by an application or seeking of one toward the other. He
    evaluates the family terminology of father, mother, sons, and daughters as later
    than Fu-hsi and not dominant. He then describes another section as presenting
    God’s annual work in nature as a progression through the trigrams, effected by
    His Spirit, while also saying he cannot find a trace of mythology in the Yi.
