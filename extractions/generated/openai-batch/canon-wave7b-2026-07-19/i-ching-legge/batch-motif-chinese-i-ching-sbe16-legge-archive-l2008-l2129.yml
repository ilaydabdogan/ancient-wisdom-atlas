canonical_text:
  quote: ''
  summary: The passage is a scholarly introduction describing the Yi King appendixes,
    their traditional attributions to King Wan, the duke of Kau, and Confucius, their
    division into the so-called Ten Wings, their contents concerning hexagrams, trigrams,
    divination, seasons, cardinal points, and civilization, and the narrator's doubts
    about Confucian authorship based on lack of superscription and internal evidence.
  language: English
  quote_policy: summarized
