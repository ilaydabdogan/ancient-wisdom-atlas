  quote: ''
  summary: The passage contains Legge's notes and Great Symbolism material for several
    Yi King hexagrams. It rejects inserting a seventh-day interpretation into a solstice
    passage, explains a term for benevolence, presents Hexagram XXV as thunder under
    the sky and sincerity aligned with seasonal regulation and Heaven, presents Hexagram
    XXVI as mountain containing heaven and the superior man's accumulation of former
    words and deeds, and presents Hexagram XXVII as mountain over thunder with instruction
    concerning careful speech and temperate eating and drinking.
  language: English
  quote_policy: summarized
