  quote: ''
  summary: The passage gives line statements and commentary for parts of Hexagram
    XLII Yi, understood as addition or increase, followed by the opening judgment
    and first three lines of Hexagram XLIII Kwai. It describes divinatory gifts of
    tortoise shells, offerings to God, increase through evil as correction, ministerial
    advice in moving a capital, a ruler benefiting those below, selfish increase that
    draws attack, and a public process for exposing and cutting off a criminal with
    caution against immediate arms.
