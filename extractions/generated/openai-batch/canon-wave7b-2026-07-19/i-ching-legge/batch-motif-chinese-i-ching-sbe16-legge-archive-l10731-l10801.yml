canonical_text:
  quote: Just as the seasons of the year change and pursue an everrecurring round,
    so is it with the phases of society.
  summary: 'The passage comments on a hexagram by describing change as constant: social
    order rises, terminates, and must be sought again. It explains the hexagram through
    trigrams and line positions, presents the young fox as a cautionary image for
    imprudent attempts to remedy disorder, praises restraint such as holding back
    a carriage, discusses uncertainty about crossing a great stream, invokes Kao 3ung''s
    expedition as a model for vigorous effort, and warns that after completion one
    should remain quietly confident rather than continue to play with peril.'
  language: English
  quote_policy: quoted
