canonical_text:
  quote: ''
  summary: The passage lists emblematic correspondences for several trigrams, including
    Sun, Khan, Li, Kan, and Tui, relating them to natural phenomena, family positions,
    tools, bodily traits, animals, social roles, and qualities. It then introduces
    the orderly sequence of the hexagrams, beginning with heaven and earth producing
    all things, and proceeding through undeveloped beginnings, nourishment, contention,
    multitudes, union, restraint, rites, repose, obstruction, renewed union, possession
    with humility, pleasure, followers, service, greatness, contemplation, adornment,
    and decay.
  language: English
  quote_policy: summarized
