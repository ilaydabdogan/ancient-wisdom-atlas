canonical_text:
  quote: ''
  summary: The passage presents Legge's account of King Wan/lord of Xâu as an incarcerated
    interpreter of the 64 hexagrams, assigning them names, meanings, exhortations,
    and warnings. It then describes Tan, the duke of Kau, as extending this work to
    the individual lines. The example of the seventh hexagram, Sze, meaning Hosts
    or multitudes, is interpreted through waters collected on earth, a central undivided
    line as leader of the host, and rules for a military expedition.
