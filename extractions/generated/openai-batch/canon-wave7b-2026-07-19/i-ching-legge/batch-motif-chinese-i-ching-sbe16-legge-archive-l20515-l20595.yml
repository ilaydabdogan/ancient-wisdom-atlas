canonical_text:
  quote: the way of heaven, calling (the lines) yin and yang
  summary: The passage explains the Yi as a system made by ancient sages to conform
    to principles of heaven, earth, and humanity. It describes yin and yang, weak
    and strong lines, the Three Powers, trigrams, hexagrams, numerical procedures
    with divining stalks, and correlative pairs among the eight symbols. Legge's commentary
    also discusses Ffi-hsi, king W4n/Wan, and the moral-political purpose attributed
    to the Yi.
  language: English
  quote_policy: quoted
