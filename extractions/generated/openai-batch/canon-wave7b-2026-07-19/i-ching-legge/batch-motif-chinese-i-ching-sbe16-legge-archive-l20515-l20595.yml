  text: Ancient sages are said to have made the Yi with the design that its figures
    conform to principles underlying natures and ordinances appointed by Heaven.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The figures exhibit the way of heaven as yin and yang, the way of earth as
    weak or soft and strong or hard, and the way of men as benevolence and righteousness.
  category: relationship
  evidence_refs:
  - ev:2
