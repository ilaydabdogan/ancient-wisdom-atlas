canonical_text:
  quote: ''
  summary: The passage comments on several Yi King hexagrams through trigram symbolism.
    Heaven with thunder forms Great Power and is applied to propriety and self-restraint.
    Earth with the bright sun above it forms Advance and is applied to the increase
    of bright virtue. Earth with the bright sun entering within it forms Ming I, where
    intelligence is kept obscured and brightness is not entirely extinguished. Fire
    with wind coming forth from it forms the Family, applied to truthful words, consistent
    conduct, and household regulation.
  language: English
  quote_policy: summarized
