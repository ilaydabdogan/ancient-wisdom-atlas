canonical_text:
  quote: ''
  summary: The passage contains Legge's commentary on several Yi line explanations
    and a translated section of Appendix III, Chapter VI. It presents Aien and Khwan
    as the gate of the Yi, corresponding to yang and yin, whose union is embodied
    in strong and weak lines and displays heaven and earth. It also describes the
    Yi as revealing past and future, minute and obscure matters, and as guiding conduct
    through names, symbols, and explanations. The surrounding commentary links these
    ideas to Fuh-hsi's whole and divided lines, King Wan's ordering of symbols, a
    rock image of rest, and a generalized male/female polarity, while warning against
    an explicitly sexualized translation of the trigrams.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aien and Khwan are called the gate of the Yi; Aien is assigned the yang nature,
    described as bright and active, and Khwan is assigned the yin nature, described
    as shaded and inactive.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two conditions unite according to their qualities, and the result is embodied
    by strong and weak lines.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Through this arrangement, the phenomena of heaven and earth are said to be
    visibly exhibited, and the operation of spiritual intelligence can be comprehended.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The appellations and names of the diagrams and lines are described as various
    but not extending beyond the operation of the two conditions.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Yi is said to exhibit the past, discriminate future issues, make the minute
    manifest, and bring the obscure to light.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: King Wan is said to have opened the symbols, distinguished things according
    to their names, and thereby brought the book to completion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The names of diagrams and lines are called small matters, while the classes
    of things under them are large; the explanations are described as far-reaching
    and as containing a secret principle.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The stated object of the words and explanations is to help people in doubtful
    cases of conduct and to make plain the recompenses of good and evil.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Legge's note says that Ff-hsi devised whole and divided lines to represent
    two primitive forms in nature, and that pure trigrams formed from these lines
    give rise to the other diagrams in a system representing changing phenomena.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A separate note explains the phrase 'firm as a rock' as symbolising rest or
    quiet self-possession from which successful movement and action may spring.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: A note on 'male and female' says the phrase is to be taken generally and discusses
    transformations of heaven and earth in relation to living tribes and plants; the
    application to the Yi line is called far-fetched.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Legge cites an alternative translation that renders Khien and Khwan in explicit
    sexual-anatomical terms and rejects that rendering polemically.
  category: speech
  evidence_refs:
  - ev:8
