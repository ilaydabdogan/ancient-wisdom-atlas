canonical_text:
  quote: The sages made their emblematic symbols to set forth fully their ideas
  summary: The passage explains that the sages of the Yi used emblematic symbols,
    diagrams, lines, and appended explanations to convey ideas beyond ordinary writing
    and speech, disclose truth and falsehood, indicate advantage, and represent changing
    phenomena. It identifies A4ien/Khwan with yang/yin or undivided/divided lines
    as the basis of the system of changes, and includes editorial comments on the
    Ho map, the Lo writing, Ffi-hsi, and Great Yii.
  language: English
  quote_policy: quoted
literal_observations:
