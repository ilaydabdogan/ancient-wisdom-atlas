- id: obs:2
  text: The commentary states that, if the Lo writing is accepted as connected with
    the making of the Yi, Ffi-hsi must be excepted, because the Lo disclosed its writing
    to Great Yii more than a thousand years later.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A question asks whether the ideas of the sages can be discovered when writing
    does not fully express speech and speech does not fully express ideas.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Master says the sages made emblematic symbols, appointed diagrams, appended
