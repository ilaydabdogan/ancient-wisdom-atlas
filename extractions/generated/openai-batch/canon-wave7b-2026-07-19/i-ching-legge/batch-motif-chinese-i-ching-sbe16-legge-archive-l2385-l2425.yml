canonical_text:
  quote: ''
  summary: The passage explains the hexagram Ta Yu, “Possessing in great abundance,”
    as interpreted by King Wan and by the Appendix through its lines, trigrams, response
    to heaven, and timely action. It then discusses the term kwei-shan/kwei-shin as
    referring to spiritual beings or agents, distinguishing a disembodied human spirit
    from spirits whose seat is in heaven, and introduces a question put to K-Hsi about
    making, transformation, and the interaction of heaven and earth.
