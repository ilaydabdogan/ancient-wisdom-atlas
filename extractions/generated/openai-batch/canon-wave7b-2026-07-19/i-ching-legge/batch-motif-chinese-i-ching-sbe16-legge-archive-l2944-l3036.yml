canonical_text:
  quote: ''
  summary: Legge discusses the term kwei-shin in the third Appendix, explaining kwei
    and shan as paired soul-components and reviewing alternate renderings. He then
    explains a passage in which odd and even numbers are assigned to heaven and earth
    to produce changes and spirit-like lines. He notes the frequency of shan, compares
    the style of the third and fourth Appendices with other Confucian texts, and describes
    the fourth Appendix as applying qualities of heaven and earth from the first two
    hexagrams to human moral nature.
  language: English
  quote_policy: summarized
