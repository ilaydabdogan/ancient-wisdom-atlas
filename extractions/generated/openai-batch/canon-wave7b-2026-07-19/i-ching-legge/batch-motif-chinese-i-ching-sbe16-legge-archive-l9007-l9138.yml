canonical_text:
  quote: ''
  summary: 'The passage comments on caldron imagery in which an overturned caldron
    may empty bad contents and become auspicious, a concubine may gain honor through
    a son who becomes heir, good food in the caldron may be withheld until yin and
    yang mingle and rain follows, and ministerial service is described through caldron
    fittings. It then presents and explains the thunder or movement hexagram: thunder-like
    movement causes apprehension, peril, loss, ascent to a height, later recovery,
    and the need for self-regulation and precaution during social or political upheaval.'
  language: English
  quote_policy: summarized
