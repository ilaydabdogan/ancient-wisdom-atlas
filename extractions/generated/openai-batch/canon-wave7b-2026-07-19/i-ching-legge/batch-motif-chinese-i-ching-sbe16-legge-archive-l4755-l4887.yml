canonical_text:
  quote: ''
  summary: 'The passage explains symbolic readings of a hexagram involving Tui, marsh,
    and Khien, sky, as an image of treading on a tiger''s tail without being bitten,
    linked to propriety, courtesy, humility, and safe movement through peril. It then
    presents and comments on the Thai hexagram: the little gone and the great come,
    connected grass roots, crossing the Ho without a boat, recurring disturbance after
    peace, neighbors coming sincerely, Ti-yi''s younger sister''s marriage, a city
    wall returning into the moat, and the hexagram''s structure of strong and weak
    lines associated with spring growth.'
  language: English
  quote_policy: summarized
