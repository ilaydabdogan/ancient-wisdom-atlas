canonical_text:
  quote: ''
  summary: 'The passage explains symbolic readings of several I Ching hexagrams and
    their commentarial notes: ornament and social observance are related to heavenly
    figures and seasons; Po is read as overthrow and a time to halt movement; Fu is
    read as return in accordance with heavenly revolution; Wu Wang is tied to correctness
    and the appointment of Heaven; and Ta Khu is tied to strength, restraint, light,
    and renewal of virtue.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The lower trigram is described as elegance and intelligence, while the upper
    trigram is described as arrest; together they suggest observances that adorn human
    society.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The text says that observing the ornamental figures of the sky allows the
    changes of the seasons to be ascertained, and observing social observances allows
    transformations under heaven to be understood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Po is glossed as overthrowing or being overthrown; the weak lines threaten
    to change the last strong line into one of themselves.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When small men are growing and increasing, the superior man stops forward
    movement and looks at the symbolic figures in the hexagram.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
