  evidence_refs:
  - ev:6
- id: obs:7
  text: Fu is explained as the coming back of what is represented by the undivided
    line, with actions moving according to natural order.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Fu includes a return in seven days, described as the movement of the heavenly
