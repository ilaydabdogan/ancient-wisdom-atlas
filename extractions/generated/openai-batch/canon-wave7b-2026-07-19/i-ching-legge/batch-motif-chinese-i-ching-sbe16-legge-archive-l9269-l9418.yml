canonical_text:
  quote: ''
  summary: The passage explains hexagram symbolism through bodily rest and mountain
    imagery, then presents the Kien hexagram as gradual advance, illustrated by wild
    geese moving from shore to rocks, plains, trees, mound, and heights, with associated
    human situations including office, marriage, expedition, pregnancy, and nourishment.
    It closes with the opening judgment of Kwei Mei, stating that action under its
    conditions is evil and not advantageous.
  language: English
  quote_policy: summarized
