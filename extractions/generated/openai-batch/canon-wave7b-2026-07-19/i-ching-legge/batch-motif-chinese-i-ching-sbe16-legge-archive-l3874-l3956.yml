canonical_text:
  quote: The sixth line, divided, (shows) dragons fighting in the wild. Their blood
    is purple and yellow.
  summary: The passage gives the sixth and seventh lines of the Khwan hexagram, followed
    by commentary on Khwan as a figure of divided lines, docility, restraint, earth
    symbolism, humility, and a dragon conflict. It then begins the Aun/Kun hexagram,
    giving counsel about correct firmness, feudal appointment, a delayed marriage
    union, and abandoning an unguided deer chase in a forest.
  language: English
  quote_policy: quoted
