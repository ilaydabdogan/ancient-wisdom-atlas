canonical_text:
  quote: ''
  summary: The passage gives Legge’s translation and notes on several I Ching hexagram
    commentaries. It treats the declining sun as an emblem for obscured mental virtue;
    bodily movements as signs of trivial influence or mere talk; marsh waters descending
    from above as an image of influence and humility; thunder and wind as forming
    Hang, with lessons of continuance and constancy; and sky over mountain as forming
    Thun, with lessons about dignified retreat and keeping small men at a distance.
  language: English
  quote_policy: summarized
