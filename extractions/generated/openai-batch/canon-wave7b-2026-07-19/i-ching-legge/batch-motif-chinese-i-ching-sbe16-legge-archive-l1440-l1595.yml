  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Yang lines are described as strong or hard and associated with vigour, authority,
    and command; Yin lines are weak or soft and associated with feebleness, submission,
    and obedience.
  category: attribute
  evidence_refs:
  - ev:4
