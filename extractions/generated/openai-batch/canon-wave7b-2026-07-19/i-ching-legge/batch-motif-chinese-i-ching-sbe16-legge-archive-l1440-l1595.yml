  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The River Map is described as once preserved, later perished, and first publicly
    delineated in the Sung dynasty reign of Hui 3ung.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The approved scheme of the River Map uses small circles or marks, divided
    into dark and light.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Odd-numbered circles are light, and even-numbered circles are dark.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
