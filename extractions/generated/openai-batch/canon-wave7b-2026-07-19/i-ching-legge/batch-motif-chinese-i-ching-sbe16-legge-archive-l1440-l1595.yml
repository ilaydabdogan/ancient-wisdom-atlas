canonical_text:
  quote: ''
  summary: The passage explains Legge's account of the River Map and related schemes
    used to interpret the Yi King figures. It describes dark and light circles, odd
    and even numbers, Yin and Yang, whole and divided lines, line correlations within
    hexagrams, and a supernatural account involving a dragon-horse of the Yellow River.
    It also summarizes the Lo writing on a tortoise shown to Great Yu during flood-drainage,
    which suggested the Great Plan.
  language: English
  quote_policy: summarized
