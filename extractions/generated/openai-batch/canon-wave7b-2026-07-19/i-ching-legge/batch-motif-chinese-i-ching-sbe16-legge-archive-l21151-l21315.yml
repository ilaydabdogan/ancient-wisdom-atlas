  summary: The passage contains Legge's notes on Appendix VI and the opening of Appendix
    VII. It discusses the meanings of hexagram names and lineal figures, criticizes
    several derivations, mentions heaven and earth filling the space between them
    with living beings, describes waiting, nourishment, contention, multitudes, treading,
    ceremony, humility, and then presents a rhymed treatise pairing hexagrams by opposed
    or diverse meanings such as strength and weakness, joy and anxiety, giving and
    seeking, darkness and light, starting and stopping, fullness and decay, waiting
    for the proper time, and evil arising from crime.
