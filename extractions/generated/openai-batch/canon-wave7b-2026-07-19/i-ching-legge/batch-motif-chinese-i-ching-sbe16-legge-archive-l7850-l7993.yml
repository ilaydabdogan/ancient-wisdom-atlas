canonical_text:
  quote: ''
  summary: The passage presents the Sun hexagram as diminution, contribution, and
    sincere minimal offering; its lines describe helping a correlate, giving increase
    without self-loss, a group of three reduced by one, tortoise shells added to a
    ruler’s stores, a feudal duke ordering the kingdom against small men, and ministers
    coming to serve. The commentary interprets Sun as diminution, taxation or contribution,
    and repression of excess according to right. The passage then begins the Yi hexagram,
    saying that movement and crossing the great stream are advantageous.
