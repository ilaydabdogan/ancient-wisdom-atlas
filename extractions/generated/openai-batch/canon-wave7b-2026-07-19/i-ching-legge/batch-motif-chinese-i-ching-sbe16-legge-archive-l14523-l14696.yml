canonical_text:
  quote: ''
  summary: The passage gives Appendix interpretations and editorial commentary for
    hexagrams Kwan, Shih Ho, and Pi, with an intervening note on hexagram XIX. Kwan
    is formed from earth and wind above it; ancient kings examine regions, observe
    the people, and issue instructions. Shih Ho is formed from thunder and lightning;
    ancient kings frame penalties and promulgate laws, and line comments describe
    penal restraints. Pi is formed from mountain and fire beneath it; the superior
    man gives brilliance to government processes but does not decide criminal litigation
    in that manner. Notes compare parts of the symbolism with Analects, Mencius, and
    hexagram 11.
  language: English
  quote_policy: summarized
