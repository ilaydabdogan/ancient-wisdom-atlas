  text: Fang is said to intimate progress and development, and a king at the relevant
    point is told not to be anxious and to be like the sun at noon.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The commentary explains a bad auspice through improprieties in a represented
    marriage: the lady and her friends initiate it, the parties are unequally matched,
    and several lines are in unsuitable places.'
  category: relationship
  evidence_refs:
  - ev:2
