canonical_text:
  quote: ''
  summary: The passage presents commentary and line material around the Fang hexagram,
    including images of a king at noon, marriage arrangements used as illustration
    for ruler-minister relations, women in different marital positions, King Ti-yi’s
    sister compared to the nearly full moon, subjects obscured by screens or banners
    who see stars at midday, the gathering of brilliant men, and a broken marriage-contract
    with ineffective ancestral sacrifice.
  language: English
  quote_policy: summarized
literal_observations:
