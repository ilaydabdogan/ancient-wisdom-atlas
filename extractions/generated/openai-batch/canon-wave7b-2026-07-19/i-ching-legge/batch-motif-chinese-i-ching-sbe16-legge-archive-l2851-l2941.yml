canonical_text:
  quote: ''
  summary: The passage comments on the Yi as a divinatory text using numbers to form
    hexagrams, introduces yin and yang terminology, quotes an appendix mapping line
    qualities to heaven, earth, and man, interprets yin and yang as bright and dark
    from sun and moon, and rejects later primary-matter or cosmogonic readings as
    not original to the Yi. A footnote reports a Sung-era cosmological interpretation
    involving the Great Extreme, Great Void, and ether.
  language: English
  quote_policy: summarized
