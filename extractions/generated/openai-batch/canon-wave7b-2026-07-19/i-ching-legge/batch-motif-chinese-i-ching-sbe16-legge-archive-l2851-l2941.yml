  text: The passage contrasts the philosopher of Samos's number doctrine with the
    Yi, stating that in the Yi numbers serve as aids in divining and in forming hexagrams.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The names yin and yang are described as first appearing in this appendix;
