canonical_text:
  quote: ''
  summary: The passage gives the Hsu hexagram as a divinatory pattern of sincerity,
    firmness, waiting, danger near a stream or cavern, eventual help, and possible
    crossing of a great stream. The commentary interprets Hsu as waiting before peril
    and discusses the great stream as either a general hazardous enterprise or the
    Yellow River in the Zhou struggle against Yin. The passage then begins the Sung
    hexagram, where contention should be handled cautiously, not pursued to the bitter
    end, and crossing the great stream is not advantageous.
  language: English
  quote_policy: summarized
