canonical_text:
  quote: ''
  summary: The passage comments on hexagrams LIX through LXII. It presents trigram
    combinations involving water, wind, lake or marsh, hill, and thunder; links them
    to actions of ancient kings or the superior man; and explains line statements
    about dispersion, regulation, sincerity, litigation, ascent, humility, mourning,
    and restraint.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Water with wind moving above it forms Hwan, and ancient kings respond by presenting
    offerings to God and establishing the ancestral temple.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several Hwan line statements describe dispersion, including hurrying to a
    contrivance for security, scattering parties in the state, dispersing royal granary
    accumulations, and the removal of bloody wounds.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A note explains Hwan as symbolizing a state of mutual alienation and selfishness,
    to be remedied by religious services, while also stating that the exact operation
    of this remedy is not explained.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: A lake with water above it forms Aieh, and the superior man responds by constructing
    methods of numbering and measurement and discussing virtue and conduct.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Aieh line statements mention not quitting courtyards, failing to observe regulations,
    accepting regulations, enacting acceptable regulations from a central place of
    authority, and severe regulations that end in evil.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A note explains Aieh through the limited quantity of water a lake or marsh
    can contain, connecting overflow with the idea of regulation or limitation.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: Marsh waters with wind above form Kung Fu, and the superior man responds by
    deliberating about litigation cases and delaying death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Kung Fu line statements include young ones responding to a female figure,
    beating and stopping a drum, a horse losing its fellow and mounting upward, sincere
    union with others, and Chanticleer attempting to mount to heaven.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A hill with thunder above forms Hsiao Kwo, and the superior man responds by
    exceeding in humility, sorrow in mourning, and economy in expenditure.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Hsiao Kwo line statements include a bird flying and ascending until the result
    is evil, and a figure who does not attempt to reach his ruler.
  category: sequence
  evidence_refs:
  - ev:10
