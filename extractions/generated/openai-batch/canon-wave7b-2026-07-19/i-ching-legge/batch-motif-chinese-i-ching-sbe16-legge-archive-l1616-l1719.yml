  quote: ''
  summary: Legge’s introduction recounts political disorder under the Yin or Shang
    dynasty, denunciations of King Shau’s tyranny and ritual neglect, King Wan’s virtuous
    restraint and imprisonment, and the background of lineal figures, trigrams, divining
    stalks, and tortoise-shell divination.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The kingdom under the Yin or Shang dynasty is described as disorganized and
    demoralized.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A brother of the reigning king says the house of Yin can no longer rule and
    describes robbery, villainy, treachery, lawbreaking, and violent outrages among
    the people and officers.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The same description compares the dynasty’s condition to someone crossing
    a large stream without finding a ford or bank.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Shau, king of Shang, is denounced as slighting virtue, abandoning himself
    to idleness and irreverence, cutting himself off from Heaven, and creating enmity
    between himself and the people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Shau is accused of killing and murdering, favoring villainous people, driving
    away instructors and guardians, abandoning statutes and penal laws, neglecting
    sacrifices to Heaven and Earth, and discontinuing ancestral offerings.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'A note identifies two acts of cruelty attributed to Shau: cutting through
    the leg-bones of winter waders and cutting out the heart of Pi-kan.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Shau is said to have made cruel contrivances to please his wife, and a note
    names torture instruments called the Heater and the Roaster.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The declaration says God will no longer bear with Shau and is sending down
    his ruin with a curse.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: King Wan, chief of Kau, is described as distinguished in peace and war, marked
    by goodness, wisdom, and self-restraint.
  category: attribute
  evidence_refs:
  - ev:6
