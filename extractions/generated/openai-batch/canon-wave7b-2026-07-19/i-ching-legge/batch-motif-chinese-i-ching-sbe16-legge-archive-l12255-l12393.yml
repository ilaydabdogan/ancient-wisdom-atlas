canonical_text:
  quote: By movement there is an escape from the peril
  summary: 'The passage comments on several I Ching hexagrams and their trigram symbolism:
    paired younger daughters, difficulty and caution, release from peril through movement,
    winter giving way to thunder, rain, and plant growth, diminution and sacrificial
    sincerity, and increase through above-below redistribution, movement, docility,
    wood, and crossing the great stream.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The opening commentary says Tui represents the youngest daughter and Li the
    second; the Khang-hsi editors distinguish cases where two younger daughters or
    sisters dwell together from cases involving the eldest daughter.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: For hexagram XXXIX, the upper or front trigram is described as perilous, and
    the lower trigram as arresting movement or advance; their union is said to yield
    difficulty and prudent caution.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: For hexagram XL, peril is described as going on to movement, and movement
    is said to provide escape from peril.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the state indicated by Kieh, advantage is associated with the south-west;
    good fortune is associated with coming back to old conditions and with early conduct
    of necessary operations.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When heaven and earth are freed from winter, thunder and rain come, and buds
    of fruit-producing plants and trees begin to burst.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The translator's note states that the natural process in paragraph 3 is an
    analogy to beneficent social and political changes and that this kind of analogy
    occurs frequently in the Appendix.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: For hexagram XLI, the lower trigram is diminished and the upper is added to;
    the method implied is said to operate above or mount upward.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: In Sun, sincerity in diminution is linked to good fortune, freedom from error,
    firmness, correctness, and advantage; even two baskets of grain may be presented
    in sacrifice at the fitting time.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says there is a time when the strong should be diminished and
    the weak strengthened, and that diminution and increase, overflowing and emptiness
    occur in harmony with the conditions of the time.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'The Khang-hsi editors give examples of those below increasing those above:
    a minister serving his lord and people laboring for their government; this is
    said to make intercourse close and aims the same.'
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: For hexagram XLII, the upper trigram is diminished and the lower is added
    to; the people's satisfaction is without limit, and what descends from above reaches
    all below.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: In Yi, advantage in every movement is linked to central and correct positions
    and general blessing; crossing the great stream is linked to the action of wood;
    movement and docility lead to daily advancement, and heaven dispensing with earth
    producing leads to unrestricted increase.
  category: sequence
  evidence_refs:
  - ev:10
