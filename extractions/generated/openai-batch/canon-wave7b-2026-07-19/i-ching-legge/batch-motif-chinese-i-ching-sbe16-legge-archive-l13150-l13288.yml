canonical_text:
  quote: ''
  summary: The passage comments on several I Ching hexagrams. It explains sincerity
    through upper and lower trigrams, an empty-boat semblance in the line figure,
    the Hsiao Kwo pattern of small lines exceeding others, the image of a bird whose
    descent is favored over ascent, the alternation of order and disorder, and the
    Wei Chi image of a young fox nearly crossing a stream but failing at the end.
  language: English
  quote_policy: summarized
