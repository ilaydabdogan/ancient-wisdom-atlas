  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two divided lines in the middle of the figure are said to resemble an empty
    boat, and the commentary says, with doubt, that an empty boat is not liable to
    be upset.
  category: object
  evidence_refs:
  - ev:3
