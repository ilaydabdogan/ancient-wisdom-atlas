canonical_text:
  quote: Li is the name of the trigram representing fire and light
  summary: The passage explains Li as the trigram of fire, light, the sun, brightness,
    intelligence, and adherence. It interprets the hexagram through double brightness,
    correctness, docility, and humility; comments on individual lines through images
    such as yellow, ascending fire, and the declining sun; and includes a line in
    which a king employs a subject in punitive expeditions while sparing prisoners
    not associated with the rebels.
