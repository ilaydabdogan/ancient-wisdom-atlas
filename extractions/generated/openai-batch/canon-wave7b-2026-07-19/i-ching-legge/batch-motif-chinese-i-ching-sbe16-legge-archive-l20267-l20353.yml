canonical_text:
  quote: ''
  summary: 'The passage explains line symbolism in the Yi commentary: a fourth-line
    occupant has strength but lacks a central position, producing perplexity and cautious
    non-blame. It then praises the great man as harmonized with heaven and earth,
    sun and moon, seasons, fortune and calamity, and Heaven itself. It contrasts excessive
    one-sided persistence with the sage''s knowledge of when to advance, retire, maintain,
    and let perish. Legge''s notes compare the eulogy to the Doctrine of the Mean
    and describe the discussion as Yao symbolism. The supplied excerpt ends with the
    beginning of the Khwan section, partly cut off.'
  language: English
  quote_policy: summarized
