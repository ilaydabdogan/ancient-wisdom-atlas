  quote: ''
  summary: The passage gives judgments and commentary on hexagram Tui, including pleasure,
    firmness, line omens, a search aided by divination and exorcists, a hunt whose
    game is ritually apportioned, trust in an injurious person, and the Tui trigram
    as water gathered in a marsh or lake. It also begins the Hwan hexagram by saying
    that the king goes to his ancestral temple, and includes commentary on the lord
    of Sun issuing charges and commands.
