    or mind, then interprets several line images involving seeking nourishment, reliance,
    and tutorship. It then presents hexagram XXVIII, Ta Kwo, through images of a weak
    beam, white grass mats, decayed willow growth, old-young spouse pairs, and a dangerous
    stream crossing; the passage closes with the beginning of hexagram XXIX, K'an,
    including sincerity, a double defile, and entry into a cavern.
