canonical_text:
  quote: ''
  summary: Khang-jze comments on a fourth line whose timely ability and firm solidity
    bring good fortune and are exemplified by smiting the demon region. The passage
    then says certain symbols indicate lack of caution and unwillingness to regulate
    impulse by reason and prudence. The opening of the Great Appendix describes heaven
    and earth, high and low, movement and rest, strong and weak lines, classification
    into good and evil, correspondence between heavenly figures and earthly bodies,
    and the formation of eight trigrams and sixty-four hexagrams from strong and weak
    lines.
