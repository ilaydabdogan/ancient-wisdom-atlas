  quote: ''
  summary: The passage comments on several I Ching hexagrams through the relations
    of strong and weak lines and trigrams. It explains troubled conditions changing
    toward order, advancing power that later decays, a ruler or great manifester who
    instructs and transforms those below, ritual preparation before offering, Heaven’s
    regular seasonal way as a model for sages’ instructions, biting through an obstruction
    as union and legal constraint, and ornamentation of strong and weak lines.
  language: English
  quote_policy: summarized
