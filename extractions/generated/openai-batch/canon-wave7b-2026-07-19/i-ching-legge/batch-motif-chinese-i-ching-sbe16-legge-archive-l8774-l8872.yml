canonical_text:
  quote: ''
  summary: The passage presents the Ko/Keh hexagram as change that becomes credible
    after accomplishment and is fortunate when firm and correct. Its line statements
    include a subject bound with yellow ox skin, delayed change, perilous change requiring
    repeated discussion, changing ordinances under trust, and analogies of the great
    man and superior man changing like tiger stripes and leopard spots. The supplied
    passage also includes commentary on a well, clear water, ministers, Shun, and
    good government, plus a note explaining Ko/Keh as originally meaning animal or
    bird skin and later change.
  language: English
  quote_policy: summarized
