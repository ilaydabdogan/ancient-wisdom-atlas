  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A ruler or good head of government is compared with a well full of clear water
    that is drawn up and useful; an uncovered well top makes the use of the well free
    to all.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The second line shows a subject making changes after some time has passed;
    action taken is fortunate and without error.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The third line says action by the subject will be evil and perilous, but if
    the contemplated change has been fully discussed three times, he will be believed
    in.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The fourth line says occasion for repentance disappears, and if the subject
    is believed in, changing existing ordinances brings good fortune.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The fifth line shows the great man producing changes as a tiger changes its
    stripes, with faith already reposed in him before divination and action.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The sixth line shows the superior man producing changes as a leopard changes
    its spots, while small men change their faces and show obedience; advancing would
    lead to evil, but firm correctness brings good fortune.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The commentary says Ko/Keh originally referred to the skin of an animal or
    bird and later acquired the sense of changing; it frames the hexagram as concerning
    changes called for in the state of the country.
  category: other
  evidence_refs:
  - ev:11
