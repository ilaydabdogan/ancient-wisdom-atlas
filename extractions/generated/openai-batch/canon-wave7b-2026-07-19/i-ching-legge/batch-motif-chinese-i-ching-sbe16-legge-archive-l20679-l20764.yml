canonical_text:
  quote: ''
  summary: The passage explains Spirit as a subtle divine presence and operation with
    all things, describes natural powers such as thunder, wind, fire, water, lake
    or marsh, and Kan as agents of motion, scattering, drying, moistening, satisfaction,
    ending, and renewed beginning, and then lists symbolic attributes and natural
    correspondences of the trigrams. A commentary also describes earth as a mother
    nourishing all things as her children.
  language: English
  quote_policy: summarized
