canonical_text:
  quote: ''
  summary: Legge discusses a passage from the Treatise on the Trigrams in which King
    Wan's trigram arrangement is connected with the seasonal development of nature.
    The passage presents God/Ti as active through the yearly processes, glosses Ti
    as the Lord and producer of all things, compares this idea with other writings,
    and then defines Spirit as the subtle operation of God with all things, illustrated
    through the minor trigrams and elemental images.
  language: English
  quote_policy: summarized
