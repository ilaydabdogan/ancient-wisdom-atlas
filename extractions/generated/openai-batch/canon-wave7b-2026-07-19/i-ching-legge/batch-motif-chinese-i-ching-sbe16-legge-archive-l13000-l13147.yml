  summary: 'The passage comments on several I Ching hexagrams, explaining their line
    configurations and associated judgments: the traveller''s correct conduct, repeated
    governmental orders, pleasure that leads people, dispersion involving the ancestral
    temple and stream-crossing, regulation aligned with seasons and state welfare,
    and inner sincerity that transforms a country and reaches even animals.'
