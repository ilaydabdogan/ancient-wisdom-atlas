  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Yi is said to have been made in accordance with heaven and earth and to
    show the course of things in heaven and earth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The sage looks up to contemplate brilliant heavenly phenomena and looks down
