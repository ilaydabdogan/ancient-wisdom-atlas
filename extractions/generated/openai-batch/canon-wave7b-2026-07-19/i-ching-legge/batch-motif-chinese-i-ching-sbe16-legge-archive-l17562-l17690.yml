  text: Expressions of good and bad fortune are said to refer to figures and lines
    being right or wrong according to conditions of time and place.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Expressions of repentance or regret refer to small faults, while the formula
    of no error or no blame refers to repairing an error by what is good.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Noble or mean status is decided by relative line position; small and great
    are found in the diagrams; good and bad fortune appear in the explanations.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Anxiety about repentance or regret is located at the boundary line between
    good and evil, and the thought of no blame arises from repentance.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: A note assigns the first and second hexagram lines to earth, the third and
    fourth to man, and the fifth and sixth to heaven.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
