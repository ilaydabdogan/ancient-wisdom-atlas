canonical_text:
  quote: ''
  summary: The passage explains how the Yi's figures, lines, diagrams, and explanations
    distinguish fortune, misfortune, repentance, regret, and no blame. It presents
    the Yi as made in accordance with heaven and earth and describes the sage contemplating
    heaven and earth to understand darkness and light, death and life, the forming
    and changing of things, the course of day and night, and the alternation of inactive
    and active operations.
  language: English
  quote_policy: summarized
