canonical_text:
  quote: ''
  summary: The translator criticizes the concluding paragraphs of an appendix, notes
    that they describe the eight trigrams by enumerating objects symbolized by them,
    especially horses associated with Khien, thunder, and water trigrams, and argues
    that these trigrams were devised as aids to divination. He then introduces the
    sixth appendix on the sequence of hexagrams, saying King Wan named each hexagram
    to express a moral, social, or political idea and that the appendix explains the
    names and sequence.
  language: English
