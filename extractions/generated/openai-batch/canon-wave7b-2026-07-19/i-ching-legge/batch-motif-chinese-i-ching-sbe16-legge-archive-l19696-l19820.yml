canonical_text:
  quote: ''
  summary: The passage associates the flourishing of the Yi with late Yin political
    trouble, describes the Yi as teaching cautious apprehension by which peril may
    become security, explains line and trigram operations through paired qualities
    and placements, and presents sages using omens and divination to discern good
    and bad fortune and to mediate human and spiritual counsels.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the study of the Yi began to flourish in the last age of
    Yin, during troubles between king WaAn and the tyrant Au.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The explanations in the book are said to express anxious apprehension, to
    teach how peril may be turned into security, and to warn that easy carelessness
    meets overthrow.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A note explains tao as a path or course, and lists paired changes in heaven,
    earth, and man, including day and night, hardness and softness, action and rest,
    and good fortune and bad.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The note on the Yao describes lines by high or low position and by yang or
    yin structure; a yang line in an even place or a yin line in an odd place is said
    to indicate what is bad.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Khien is described as the strongest under the sky and as knowing where peril
    and embarrassment would be; Khwan is described as the most docile under the sky
    and as knowing where obstruction would be.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The sages represented as makers of the Yi are said to rejoice in truth, weigh
    matters that could occasion anxiety, fix good and bad fortune, and accomplish
    strenuous efforts.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says that amid changes in heaven and earth and the words and deeds
    of men, fortunate events have happy omens, and that sages knew principles of prognostication
    and divination.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: When the places of heaven and earth in the diagrams had been determined, the
    sages could complete their ability, and common people could share in counsels
    of men and spiritual beings.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The eight trigrams are said to communicate information by emblematic figures;
    strong and weak lines appear mixed so that good and evil can be seen.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: The manipulation of stalks and formation of diagrams produce changes and movements;
    indications vary by the place and nature of lines and by relations such as love
    or hatred, nearness or distance, and truth or hypocrisy.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage states that a person's language can reveal inward moral or emotional
    states, such as shame, doubt, goodness, coarseness, or slander.
  category: speech
  evidence_refs:
  - ev:11
