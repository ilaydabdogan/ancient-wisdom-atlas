canonical_text:
  quote: "“Disorder shall in the long run give place to order, and disunion to union.”"
  summary: The passage gives the top line of Khwei, where a solitary subject in disunion
    misperceives another as a filthy pig or a ghost-filled carriage, aims a bow, then
    lowers it after recognizing kinship or friendship; rain and good fortune follow.
    The commentary describes Khwei as social division that can be healed. The passage
    then introduces Kien, a state of difficulty, where advantage lies in the south-west,
    meeting a great man is beneficial, advancing can increase difficulties, remaining
    still or returning can be praised, a royal minister struggles selflessly, and
    friends come to help one in great difficulty.
  language: English
  quote_policy: quoted
