canonical_text:
  quote: ''
  summary: 'The passage comments on several Yi King hexagram explanations: Sung as
    contention requiring caution and not being carried to extremity; Sze as a host
    or multitude led with moral correctness; Pi as help or union through inferiors
    following a superior; Hsiao Khu as small restraint with dense clouds but no rain;
    and Lü as weakness treading on strength, figured as treading on a tiger’s tail
    without being bitten.'
  language: English
  quote_policy: summarized
