canonical_text:
  quote: ''
  summary: The passage interprets the Phi hexagram as a condition of obstruction,
    poor understanding among classes, and the transition from prosperity toward decay.
    Its line statements describe connected grass roots, patient obedience, hidden
    shame, action according to Heaven’s ordination, a great man or ruler ending obstruction
    with caution, and the final removal of distress followed by joy. The commentary
    contrasts Phi with Thai, relates its symbolism to seasonal and daily alternation,
    and includes a historical note about Ti-yi, royal marriage, rank, and humility.
  language: English
  quote_policy: summarized
