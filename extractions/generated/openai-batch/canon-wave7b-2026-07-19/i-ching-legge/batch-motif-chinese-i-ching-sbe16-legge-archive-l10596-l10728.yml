  summary: The passage gives line texts and commentary from the end of hexagram LXIII
    and the beginning of hexagram LXIV. It contrasts costly and sincere sacrifices,
    describes perilous immersion in water, explains completion and non-completion
    through the image of a state vessel crossing or not crossing a dangerous stream,
    and presents images of foxes, carriages, a hidden lady, military expedition, the
    Demon region, and the brightness and sincerity of a superior man.
