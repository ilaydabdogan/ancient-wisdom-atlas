canonical_text:
  quote: ''
  summary: 'The passage glosses successive Khien/Qian dragon-line statements: the
    dragon is hidden in the deep, appears in the field, is active and vigilant, seems
    to leap while still in the deep, flies in the sky and rules, exceeds the proper
    limit and meets repentance, and is linked through undivided lines with the great
    originating power and the model of heaven. Editorial notes emphasize the position
    of hexagram lines and the timing of action.'
  language: English
  quote_policy: summarized
