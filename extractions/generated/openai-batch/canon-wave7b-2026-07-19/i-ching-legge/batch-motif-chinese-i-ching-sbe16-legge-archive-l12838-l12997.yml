  summary: The passage explains several hexagrams through images of gradual advance,
    correct placement, marriage, cosmic intercommunication, royal greatness, solar
    fullness, lunar waning, seasonal increase and decrease, and relations between
    strong and weak lines. It includes translator/editorial comments on the analogies
    between marriage and the interaction of heaven and earth, and between cosmic cycles
    and human or spiritual operations.
