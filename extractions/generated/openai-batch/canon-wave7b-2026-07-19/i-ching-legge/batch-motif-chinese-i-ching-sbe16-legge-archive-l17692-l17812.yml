  summary: The passage combines commentary and translated text on heavenly and earthly
    phenomena, expansion and contraction of elementary ether, life and death, soul-elements
    at death, the sage's relation to the Yi, goodness and human or creaturely natures,
    production and reproduction as change, Khien and Khwan as formative principles,
    divination by numbers and stalks, and the spiritual power of inactive and active
    operations.
