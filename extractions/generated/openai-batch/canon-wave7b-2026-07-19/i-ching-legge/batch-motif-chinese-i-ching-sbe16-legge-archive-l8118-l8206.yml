canonical_text:
  quote: ''
  summary: 'The passage gives line statements and commentary for Kwai: an injured
    person who cannot proceed well and refuses advice, small men compared to purslain
    that should be uprooted, and a final isolated subject whose end is evil. The commentary
    interprets Kwai as the third month, when the last cold and dark remnant of winter
    disappears before summer, and as the removal of corrupt powerful men by moral
    force, public denunciation, sympathy, caution, and reluctant arms. It also notes
    a Yi pattern linking the meeting of yin and yang lines with falling rain, explains
    the culprit and purslain imagery, and includes the opening statement of the Kau
    hexagram warning against marrying a bold and strong female.'
  language: English
  quote_policy: summarized
