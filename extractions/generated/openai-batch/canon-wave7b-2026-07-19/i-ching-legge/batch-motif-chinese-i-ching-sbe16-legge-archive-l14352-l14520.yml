canonical_text:
  quote: ''
  summary: 'The passage comments on several I Ching hexagram symbols: thunder and
    earth in relation to harmony and sacrifice; marsh water with hidden thunder as
    Sui, linked with following, rest at dusk, and choosing associates; mountain with
    wind as Kf, linked with disorder, helping the people, nourishing virtue, and dealing
    with troubles caused by parents; and marsh water with earth as Lin, linked with
    inexhaustible instruction and support of the people.'
  language: English
  quote_policy: summarized
