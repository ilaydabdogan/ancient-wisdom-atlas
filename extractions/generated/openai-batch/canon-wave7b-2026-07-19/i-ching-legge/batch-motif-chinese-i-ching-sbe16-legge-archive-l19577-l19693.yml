canonical_text:
  quote: ''
  summary: 'The passage explains how the lines of the Yi diagrams are interpreted:
    first, intermediate, and topmost lines have different interpretive difficulty;
    paired positions differ in value according to place, centrality, strength, and
    weakness; the Yi is said to encompass the ways of heaven, man, and earth by doubling
    the three Powers into six lines; changes, movements, line grades, and proper or
    improper placement generate judgments of fortune and misfortune.'
  language: English
  quote_policy: summarized
