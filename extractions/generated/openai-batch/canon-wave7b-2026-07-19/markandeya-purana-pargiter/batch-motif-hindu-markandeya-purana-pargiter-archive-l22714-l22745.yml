canonical_text:
  quote: Thus these Nidhis have been described, the deities of wealth among men.
  summary: The passage describes effects associated with Nidhi Nila and Nidhi S'ankha.
    Nila is connected with public works, pleasures, rebirth, and three-generation
    persistence. S'ankha is described as passion-and-darkness in quality, shaping
    its human possessor toward solitary consumption, withholding gifts, and non-transmission
    to another generation. The Nidhis are called deities of wealth among men, their
    blended aspects are said to produce blended results, and Lakshmi is said to sit
    in sovereignty over them all as knowledge called Padmini.
  language: English
  quote_policy: quoted
