canonical_text:
  quote: she is now in Rasatala with unblemished character.
  summary: A king returns to a rishi, reports earlier encounters involving a Rakshasa
    and a brahman woman restored to her husband, and asks for guidance. The rishi
    teaches that abandoning a wife is a breach of righteousness. The king confesses
    distress after abandoning his own wife in the forest. The rishi reveals that she
    was not devoured by beasts but is in Rasatala, unblemished; the king asks how
    she came to Patala and remains uncorrupted there.
  language: English
  quote_policy: quoted
