canonical_text:
  quote: ''
  summary: The passage introduces Canto XXII as the continued story of Kuvalaydsva
    and Maddlasd's death. A brother of Pātāla-hetu, named in the OCR as Tdla-heiu/Tdla-Jcetu,
    appears as a Muni by the Yamuna, induces Kuvalaydsva to guard a hermitage under
    a water-ceremony pretext, disappears in the water, and reports at the palace that
    Kuvalaydsva has died fighting Daityas. Maddlasd dies from grief; the king and
    queen lament and perform obsequies; the deceiver returns and releases the prince.
    The verse section begins with the sons narrating the king's command that his son
    mount a horse, rescue brahmans, patrol the earth, and protect them from Danavas.
  language: English
  quote_policy: summarized
