canonical_text:
  quote: ''
  summary: Opening of Canto XCIX. The heading frames the passage as an eulogy of Agni
    and fire. The introductory summary says the irascible muni Bhuti left his hermitage
    under the care of his disciple Santi; the sacred fire went out, and Santi offered
    a prayer and eulogy to Agni. The verses introduce Bhuti, a disciple of Angiras,
    as a harsh and curse-prone sage whose presence causes wind, sun, rain, moon, seasons,
    trees, and waters to moderate or alter their behavior. Bhuti, having no son, begins
    austerities to obtain one.
  language: English
