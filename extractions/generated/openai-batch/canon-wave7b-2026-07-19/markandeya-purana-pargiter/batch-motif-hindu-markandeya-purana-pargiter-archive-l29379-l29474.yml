canonical_text:
  quote: ''
  summary: Ruci honors the Pitris, who offer him a boon. Ruci asks for a heavenly,
    prolific wife so that he may fulfill Brahma's command to create. The Pitris promise
    that a wife will be produced, that Ruci will have a son named Raneya who will
    become a Manu and ruler of a Manvantara, and that Ruci will become a Prajapati.
    They also describe the benefits of reciting or preserving the hymn to the Pitris
    at a sraddha, including enjoyments, knowledge, health, wealth, descendants, and
    enduring delight for the ancestors across seasons and even where the rite is otherwise
    defective.
  language: English
  quote_policy: summarized
