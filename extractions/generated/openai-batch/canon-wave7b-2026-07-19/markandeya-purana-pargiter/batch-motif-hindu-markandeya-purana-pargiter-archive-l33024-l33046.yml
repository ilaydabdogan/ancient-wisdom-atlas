canonical_text:
  quote: "“become thou therefor ashes”"
  summary: 'The canto heading summarizes Suprabha’s continued story to Nabhaga: Pramati
    reduces Nala to ashes, later mitigates a curse on Su-deva after Su-deva asks pardon,
    and Suprabha explains her royal-rishi birth and temporary vaisya birth through
    Agastya’s curse. The narrated verses show Pramati, enraged, addressing Nala after
    Nala forcibly seizes Pramati’s wife in his hermitage, and cursing him to become
    ashes.'
