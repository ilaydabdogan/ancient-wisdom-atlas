canonical_text:
  quote: ''
  summary: A first-person speaker recounts long torment in hell, relief brought by
    a cool wind from a pitcher, and the arrival of Vipas-cit with a staff-bearing
    servant of Yama. Seeing the hell full of tortures, Vipas-cit compassionately asks
    what sin caused him to incur this hell, then lists his righteous rule, sacrifices,
    treatment of guests, restraint from coveting, and concern for the gods and pitris.
  language: English
