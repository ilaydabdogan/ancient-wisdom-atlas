canonical_text:
  quote: ''
  summary: A teaching redirects desire toward final emancipation. The king, grieving
    and seeking association with the good, visits Dattatreya, prostrates and worships
    him, and asks him to remove his affliction and excess attachment to desires. Dattatreya
    promises aid and asks the cause. Jada then narrates the king's inward reflection
    on three-fold affliction, bodily pleasure and pain, the five-element body, and
    the mental nature of pain and pleasure.
