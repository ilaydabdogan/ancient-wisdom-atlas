  quote: ''
  summary: Kraushtuki asks how Brahma created all creatures. Markandeya describes
    Brahma/Narayana awakening after a dissolution, seeing an empty world, entering
    the waters in a boar form, raising the earth, and refashioning earth, mountains,
    worlds, and later manifestations of ignorance.
