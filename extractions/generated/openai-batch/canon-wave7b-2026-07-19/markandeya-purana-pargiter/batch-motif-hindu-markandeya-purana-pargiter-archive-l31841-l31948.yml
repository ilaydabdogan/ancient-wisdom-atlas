canonical_text:
  quote: ''
  summary: A king wishes to depart to the forest and arrange his son's anointing,
    but astrologers cannot determine an auspicious time. Brahmans, citizens, ministers,
    dependants, and others plead with him not to leave. Since he does not change his
    resolve, they decide to propitiate the Sun through austerities for the king's
    life. A Gandharva named Su-daman directs them to the forest Guru-viśāla in mountainous
    Kāma-rūpa, where they worship at a shrine of the Sun and begin an invocation to
    the solar deity.
  language: English
  quote_policy: summarized
