canonical_text:
  quote: ''
  summary: A speaker promises benefits to those who worship him and Lakshmi and invites
    Kartavirya to choose a boon. Kartavirya asks for prosperity, martial power, knowledge,
    unobstructed movement through multiple domains, a worthy death, guidance, wealth,
    and unwavering faith. Dattatreya grants the requested boons and says Kartavirya
    will become a universal monarch. Arjuna then prostrates before Dattatreya, is
    inaugurated after convening his subjects, and proclaims that anyone besides himself
    who takes up a weapon will be put to death.
