  quote: ''
  summary: Markandeya narrates that a Rakshasa kills Kanka with a sword. Kandhara,
    king of the birds and Kanka’s brother, hears of the killing, performs a rite for
    Kanka, approaches the slayer with violent wing-power, sees the demon seated with
    his wife Madanika, challenges him to fight, threatens him with Yama/Tama’s abode
    and hells for murderers, and receives the Rakshasa’s angry threat in reply.
