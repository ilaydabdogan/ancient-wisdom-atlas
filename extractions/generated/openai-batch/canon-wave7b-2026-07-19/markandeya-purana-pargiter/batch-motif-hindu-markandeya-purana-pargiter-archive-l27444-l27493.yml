canonical_text:
  quote: ''
  summary: In a battle scene, the goddess’s bowstring, lion, bell, and Kali’s roars
    fill the sky as Daitya armies surround the goddess’s lion and Kali. Divine Energies
    issue from the bodies of Brahma, Siva, Guha, Vishnu, and Indra, assume the forms,
    ornaments, vehicles, and weapons of those gods, and advance to Chandika to fight
    the Asuras.
  language: English
