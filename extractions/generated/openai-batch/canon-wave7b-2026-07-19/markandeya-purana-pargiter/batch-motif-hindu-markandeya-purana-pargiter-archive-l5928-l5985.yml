canonical_text:
  quote: ''
  summary: The passage praises a king identified as Kartavirya as a guardian, protector,
    sacrificer, ascetic, and successful warrior whose reign brings prosperity. Muni
    Angiras says other kings will not equal him. The king receives prosperity from
    Dattatreya and sacrifices to him, and the subjects also offer sacrifices. Dattatreya
    is identified with Vishnu, the guru of all moving and unmoving beings, associated
    with Vaishnava emblems, accessible through faith, and preserving nature by opposing
    unrighteousness. The passage then transitions toward the famous birth of Alarka
    and his union with Dattatreya.
  language: English
