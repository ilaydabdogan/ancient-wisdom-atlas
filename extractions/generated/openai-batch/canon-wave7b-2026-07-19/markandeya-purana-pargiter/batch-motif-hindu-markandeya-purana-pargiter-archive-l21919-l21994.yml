canonical_text:
  quote: ''
  summary: Indivara, a Gandharva and father of a maiden, recounts how he secretly
    learned the eight-part Ayurveda from the brahman Brahma-mitra by becoming invisible
    after the teacher refused him. Brahma-mitra cursed him to become a Rakshasa, but
    added conditions for eventual restoration. Restored from the demon-condition by
    the hero, Indivara offers him his daughter as wife and bestows the Ayurveda; the
    maiden then speaks of her love for the benefactor and concern for her friends.
  language: English
  quote_policy: summarized
