canonical_text:
  quote: ''
  summary: The passage introduces Marutta, son of Avikshit, as a righteous universal
    monarch. Markandeya recounts that Marutta received the kingdom with family consent,
    protected the earth, performed many sacrifices, and surpassed other kings and
    even Indra in sacrificial greatness. His priest Samvarta, son of Angiras, used
    austerities to bring a summit from the golden mountain Yunjava and make Marutta’s
    realm and palaces golden. Praise-verses describe Marutta’s sacrifice as unmatched,
    with soma for Indra, gifts for brahmans, gods serving brahmans, and gold redistributed
    among castes.
  language: English
  quote_policy: summarized
