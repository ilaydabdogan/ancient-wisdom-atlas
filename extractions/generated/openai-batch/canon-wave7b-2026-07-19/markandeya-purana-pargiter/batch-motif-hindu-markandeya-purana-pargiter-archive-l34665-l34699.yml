canonical_text:
  quote: ''
  summary: A canto summary reports that Vira roused Karandhama and allied kings to
    rescue their captured son from Visala and his allies. The son was freed, but he
    refused to marry a princess because she had seen him defeated; she vowed to marry
    no one else, withdrew to the forest for austerities, and received a divine message
    promising a future universal-monarch son. The verse text begins with Karandhama
    hearing of his son's wrongful capture and allied kings urging punitive military
    action against Visala and the confederated kings.
