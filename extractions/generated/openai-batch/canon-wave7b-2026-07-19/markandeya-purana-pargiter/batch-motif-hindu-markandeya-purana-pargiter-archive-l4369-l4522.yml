canonical_text:
  quote: ''
  summary: 'A catalogue of offences and corresponding punishments: sinners are cast
    into foul pits, forced to eat impure substances, burned or pierced with iron and
    fire, mutilated by Yama''s servants, attacked by animals, transformed into degraded
    animal or insect forms, or hurled from a mountain.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Persons who show contempt toward parents and gurus are plunged head foremost
    into a pit filled with pus, ordure, and urine.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Persons who eat while gods, guests, living beings, dependants, visitors, pitris,
    fire, and birds remain unfed are made to feed on carrion and exudations and become
    Sucimukha birds as large as mountains.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Persons who feed a brahman or another caste companion disagreeably, or who
    neglect a destitute travelling companion, are made to feed on ordure or phlegm.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Persons who touch cattle, brahmans, and fire without washing after meals have
    their hands placed in fire-pots; those who gaze longingly at celestial bodies
    without washing have fire placed in their eyes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Persons who touch revered beings with their feet stand among charcoal with
    red-hot iron fetters on their feet; persons who eat certain foods in an unhallowed
    manner have their eyes torn out by Yama's servants with pincers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Persons who hear blasphemy against gurus, gods, dvijas, or Vedas have red-hot
    iron wedges driven into their ears; persons who destroy rest-houses, divine or
    brahmanical abodes, and temple assemblies have their skins flayed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Persons who urinate in the path of cattle, brahmans, and the sun have their
    entrails drawn out by crows; a man who gives his daughter to a second person after
    giving her once is divided into many portions and swept in a burning corrosive
    stream.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A person who abandons destitute children, dependants, wife, and relatives
    in famine or disturbance is fed portions of his own flesh; a person who abandons
    those seeking protection is tortured by Yama's servants with machines.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Persons who check good deeds are ground by rocks; persons who carry off pledges
    are bound and devoured by insects, scorpions, and ravens; persons involved in
    specified sexual offences suffer hunger, thirst, and pangs.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Sinners are pierced on a seemul tree with long iron thorns; defilers of others'
    wives are destroyed in the 'mouse'; a person who deposes his spiritual preceptor
    and continues learning bears a rock on his head in the public way.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Persons who discharge urine, phlegm, or ordure into water come to a foul hell;
    persons who formerly violated mutual hospitality devour one another's flesh; persons
    who discard the Vedas and fires are repeatedly hurled from a mountain summit.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Persons connected with virgin widow marriage, outcaste favours or rites, solitary
    eating of sweetmeats, and backbiting are respectively described as worms consumed
    by ants, insects among stones, eaters of burning charcoal, or prey to wolves.
  category: sequence
  evidence_refs:
  - ev:12
