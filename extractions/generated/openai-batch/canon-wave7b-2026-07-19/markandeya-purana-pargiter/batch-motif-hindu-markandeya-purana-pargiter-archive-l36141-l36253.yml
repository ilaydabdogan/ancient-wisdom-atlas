canonical_text:
  quote: ''
  summary: After hearing an ascetic’s speech, King Marutta is ashamed that he did
    not know of the Nagas’ attack on ascetics. He vows vengeance, takes the weapon
    Sarovartaka, and burns the Naga world. The terrified Nagas flee Patala with their
    families and appeal to Marutta’s mother Bhavini, invoking her earlier promise
    of safety. Bhavini remembers the promise and asks her husband to restrain their
    son.
  language: English
  quote_policy: summarized
