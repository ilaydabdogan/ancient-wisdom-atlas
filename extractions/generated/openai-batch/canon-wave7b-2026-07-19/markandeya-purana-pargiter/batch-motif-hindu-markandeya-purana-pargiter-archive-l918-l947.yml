  summary: The canto heading announces the “Incarnation of the Four-formed God” and
    says Jaimini visits the Birds with four questions, after which they invoke Vishnu,
    Brahma, and Siva and address why Vishnu is endowed with humanity. In the narrative,
    Markandeya tells Jaimini that the learned birds, sons of Drona, dwell on the Vindhya
    mountain and should be visited and questioned. Jaimini goes there, hears their
    precise recitation, and wonders that Sarasvati remains with these Muni’s sons
    despite their birth in the brute creation. The excerpt ends during an unfinished
    general reflection about things at home forsaking a person.
