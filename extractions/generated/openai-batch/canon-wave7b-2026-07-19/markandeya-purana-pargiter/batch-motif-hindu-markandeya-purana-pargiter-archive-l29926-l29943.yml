canonical_text:
  quote: ''
  summary: A hymn addresses Fire as a recipient of oblations, purifier, and protector.
    Sun, moon, gods, and Asuras are said to obtain rewards through oblations to Fire.
    Fire’s flames purify; ashes are praised for ablution; munis attend Fire in the
    evening. Fire and Air are invoked for grace, and Fire is asked to protect the
    speaker with an auspicious form and seven flames, like a father protecting his
    son.
