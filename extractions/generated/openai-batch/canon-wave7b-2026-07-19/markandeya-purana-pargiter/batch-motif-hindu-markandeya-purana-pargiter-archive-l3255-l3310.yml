  summary: After a curse and counter-curse, the sages Vasistha and Visvamitra are
    transformed into birds. As the Maina and the Heron they grow to enormous size
    and fight, causing mountains to fall, the earth to quake, seas to swell, living
    beings to perish, and people to lament. The fore-father, lord of the universe,
    arrives with the gods and tells the enraged combatants to stop their strife.
