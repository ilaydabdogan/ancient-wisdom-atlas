  quote: ''
  summary: 'The passage opens Canto LXX with a synopsis and initial verses: King Uttama/XJttama,
    after reverencing a great muni, travels by chariot to the forest Utpalavata, sees
    the brahman''s wife eating bel fruit, and asks how she came there. The canto synopsis
    states that a Rakshasa had carried her off to impair the brahman''s religious
    merit, and that at the king''s request the Rakshasa consumes her evil disposition
    and restores her to her husband.'
