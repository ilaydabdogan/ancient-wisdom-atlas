canonical_text:
  quote: "“Thou art no vaisya, nor indeed was I born of a vaisya family”"
  summary: Su-prabha tells her husband that both of them are kshatriyas, not vaisyas,
    and recounts a former episode in which King Sudeva failed to protect Pramati’s
    wife from the intoxicated Nala. Pramati rebuked Sudeva, defined the kshatriya
    as one who protects from injury, and declared that Sudeva would become a vaisya
    of base family.
