canonical_text:
  quote: ''
  summary: Markandeya narrates the Sun's marriage to Sanjna, the birth of children
    including Manu, Yama, and Yamuna/Yami, Sanjna's departure because she cannot endure
    the Sun's splendour, her replacement by her shadow Chhaya, additional offspring
    from Chhaya, Sanjna's transformation into a mare and austerities, and Chhaya's
    curse on Yama. The canto synopsis also mentions Visva-karman paring down the Sun's
    glory and the resulting cosmic disturbance.
  language: English
  quote_policy: summarized
