canonical_text:
  quote: ''
  summary: An intelligent Brahman father of Bhrigu’s line counsels his initiated son
    Sumati to study the Vedas, obey his guru, beg for food, become a householder,
    perform sacrifices, beget offspring, retire to the forest, and become a wandering
    ascetic in order to attain the Supreme Being. After repeated silence, Sumati laughs
    and says he remembers having studied these teachings before, along with other
    sciences and arts, and recalls more than ten thousand births with many relationships,
    wombs, sufferings, stages of life, castes, and animal forms.
  language: English
  quote_policy: summarized
