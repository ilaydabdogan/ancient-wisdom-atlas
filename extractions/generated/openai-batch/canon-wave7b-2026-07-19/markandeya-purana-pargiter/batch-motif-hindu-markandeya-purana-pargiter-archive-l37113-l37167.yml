canonical_text:
  quote: ''
  summary: After Dama wins Sumana as wife, the couple returns, bows to his parents,
    receives blessings, and a festival is held. King Narishyanta rejoices at the marriage
    alliance with Dasarna and the defeat of rival kings. Sumana later conceives. Narishyanta,
    in old age, anoints Dama to the kingdom and departs to the forest with Indra-sena,
    who becomes a female ascetic. Vapush-mat, king of the Southern region, goes hunting
    in the forest, sees Narishyanta as a mud-covered ascetic and Indra-sena weakened
    by austerities, questions his identity, and receives the truth from Indra-sena
    while Narishyanta remains silent. A prefatory heading also mentions revenge-killing
    and a message to Dama, but the OCR and excerpt boundary make that detail uncertain.
  language: English
  quote_policy: summarized
