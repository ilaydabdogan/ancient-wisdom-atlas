canonical_text:
  quote: ''
  summary: An aged king, having completed royal duties and wishing to go to the forest
    for austerities, asks his son Avikshit to take the kingdom and be anointed. Avikshit
    respectfully refuses, saying shame remains because he was captured and rescued
    by his father rather than by his own valor; he argues that one who could not protect
    himself should not protect the earth. The father begins to reply that father and
    son are not distinct.
