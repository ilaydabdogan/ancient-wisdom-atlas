canonical_text:
  quote: ''
  summary: King Uttama asks a Rakshasa why he carried off a brahman's wife if not
    for sexual enjoyment or food. The Rakshasa replies that his group does not eat
    human beings but consumes the fruits of deeds and people's dispositions. He explains
    that the brahman repeatedly expelled him from sacrifices with Rakshasa-destroying
    spells, leaving them hungry, so they abducted the wife to make the brahman unfit
    to perform sacrifices.
