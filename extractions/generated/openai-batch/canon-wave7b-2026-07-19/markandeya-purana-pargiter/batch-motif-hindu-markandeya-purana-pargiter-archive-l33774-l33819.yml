canonical_text:
  quote: ''
  summary: A female deity destroys the evil-souled family priests and Visva-vedin,
    the minister who gave evil counsel. Khanitra hears that his brothers’ priests
    and the minister have died, asks Vasishtha for the reason, and Vasishtha recounts
    the plot to create dissension among the brothers. Khanitra reproaches himself;
    the canto synopsis says he later resigns the kingdom to his son Kshupa, departs
    to the forest, and dies in sanctity.
