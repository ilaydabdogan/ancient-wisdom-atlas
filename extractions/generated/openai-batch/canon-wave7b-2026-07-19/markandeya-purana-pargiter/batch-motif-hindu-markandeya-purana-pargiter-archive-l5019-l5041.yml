canonical_text:
  quote: ''
  summary: The canto synopsis introduces Anasuya’s gain of a boon within a frame in
    which a father asks Jada for instruction in yoga or religious devotion. The synopsis
    recounts a brahman cursed to die at sunrise, his devoted wife restraining the
    sun, the gods appealing to Anasuya, the wife relenting, the brahman dying and
    being restored to life by Anasuya, and Anasuya receiving a boon that Brahma, Vishnu,
    and Siva be born as her sons and that she attain yoga. The opening verses show
    the father asking his son what he should do in mundane existence.
  language: English
