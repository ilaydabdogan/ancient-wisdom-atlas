  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Duhsaha is described as residing in men's houses, wasted with hunger, face
    bent downward, naked or clothed in rags, hoarse-voiced like a crow, long-toothed,
    open-mouthed, terrible, and ravenous.
  category: attribute
  evidence_refs:
  - ev:7
