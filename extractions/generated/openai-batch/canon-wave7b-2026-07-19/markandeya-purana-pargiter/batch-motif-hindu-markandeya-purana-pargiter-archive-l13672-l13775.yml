canonical_text:
  quote: ''
  summary: The passage gives a genealogy of personified harmful states beginning with
    Injury and Unrighteousness, leading to Death, Misery, Sickness, Old Age, Grief,
    Thirst, and Anger. It then describes Death's sons by Ill Fortune as agents who
    dwell in the senses and mind and influence humans toward harmful passions. One
    son, Duhsaha, is described as hungry, terrible, and created to eat beings. Brahma
    forbids him to devour the universe and assigns him residence in men's houses,
    strength from unrighteous people, satisfaction from neglected sacrifices, and
    nourishment from damaged or impure food and drink.
  language: English
  quote_policy: summarized
