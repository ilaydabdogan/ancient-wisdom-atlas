    are said to be born from her; the passage then names Hell, Fear, Illusion, and
    Pain in the same genealogy.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Illusion gives birth to Death, who carries created beings away, and Pain gives
    birth to Misery.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sickness, Old Age, Grief, Thirst, and Anger are described as begotten by Death,
    or else as traditionally sprung from Misery; they are said to have no wives or
    sons and to live in perpetual chastity.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Destruction is also described as a wife of Death; Death has another wife,
    Ill Fortune, who bears him fourteen sons that carry out his commands and visit
    men at times of dissolution.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Death's fourteen sons dwell in the ten organs of sense and in the mind, influencing
    men and women toward sense objects and assailing the organs through passion, anger,
