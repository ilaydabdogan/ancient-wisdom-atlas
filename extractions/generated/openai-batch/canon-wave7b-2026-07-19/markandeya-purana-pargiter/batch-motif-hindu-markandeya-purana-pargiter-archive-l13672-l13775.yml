  text: Brahma is said to have created Duhsaha to eat all beings, but then commands
    him not to devour the universe and to abandon anger, passion, and ignorance.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: Duhsaha replies that he is hungry, thirsty, and weak, and asks how he may
    be satisfied, strengthened, and given a tranquil refuge.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Brahma assigns Duhsaha refuge in men's houses, strength from unrighteous men,
    and satisfaction from people's neglect of constant sacrifices.
  category: speech
  evidence_refs:
  - ev:10
