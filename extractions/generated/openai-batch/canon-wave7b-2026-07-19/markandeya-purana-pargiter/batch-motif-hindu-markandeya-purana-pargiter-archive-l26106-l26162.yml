canonical_text:
  quote: ''
  summary: In a battle passage, the goddess, also called Bliadra-kali, Ambika, and
    the supreme three-eyed goddess in the OCR text, defeats successive Asura chiefs.
    One Asura attacks her and her lion with sword and pike, but his weapons fail and
    he is shattered. Camara attacks from an elephant, but the goddess breaks his weapons
    and the lion beheads him. A catalogue follows in which the goddess kills other
    named Asuras with stones, trees, bodily blows, club, dart, arrows, trident, and
    sword.
  language: English
  quote_policy: summarized
