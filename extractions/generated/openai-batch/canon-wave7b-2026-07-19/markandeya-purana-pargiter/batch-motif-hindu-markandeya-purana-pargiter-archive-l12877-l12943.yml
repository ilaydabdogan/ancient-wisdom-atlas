  summary: The passage describes Brahma/the creator producing Vedic hymns, sacrificial
    verses, metres, atmospheric phenomena, lifespans, and many classes of beings.
    Created beings receive recurring actions, names, forms, duties, bodies, organs,
    pursuits, and characteristic qualities. These creations recur from kalpa to kalpa
    when Brahma awakens after his night.
