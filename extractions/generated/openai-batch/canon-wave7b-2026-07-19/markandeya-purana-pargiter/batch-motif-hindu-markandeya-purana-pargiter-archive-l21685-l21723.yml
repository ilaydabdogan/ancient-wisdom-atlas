canonical_text:
  quote: ''
  summary: Kali reflects that the maiden loves a human being and plans to gain her
    love by assuming that human's shape. Markandeya says Kali assumes the brahman's
    form by inherent power and approaches Vardthini, who is sitting disconsolate.
    Vardthini reacts as if the brahman has returned, says she will abandon life if
    bereft of him, invokes unrighteousness and ruined ceremonies, and urges him to
    join her in a charming glen to save her. Kali begins to reply that his ceremonies
    are harmed by lingering there.
  language: English
  quote_policy: summarized
