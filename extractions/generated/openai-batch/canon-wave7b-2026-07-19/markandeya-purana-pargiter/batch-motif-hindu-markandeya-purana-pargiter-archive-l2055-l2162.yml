canonical_text:
  quote: ''
  summary: 'Canto VIII opens with Jaimini asking about Haris-c''andra''s suffering
    and eventual happiness. The birds narrate that Haris-c''andra, followed by his
    wife S''aivya and young son, reaches Benares, meets Visvamitra, and offers himself,
    his wife, and his son. Visvamitra demands the promised sacrificial fee and threatens
    a curse if it is not paid that day. Haris-c''andra considers the consequences
    of failing his promise and even selling himself. S''aivya urges him to preserve
    truthfulness, citing scriptural teaching and the example of King Kriti falling
    from Svarga for falsehood. The canto synopsis also describes later events: sale
    of family and self, service at a burning-ground, the son''s snake-bite and restoration
    by the gods, Dharma''s disguise, and ascent to Svarga with queen and people.'
  language: English
  quote_policy: summarized
