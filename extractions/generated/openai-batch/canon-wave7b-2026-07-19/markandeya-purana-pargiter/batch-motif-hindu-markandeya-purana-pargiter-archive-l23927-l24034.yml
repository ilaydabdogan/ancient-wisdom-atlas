canonical_text:
  quote: ''
  summary: A king asks a doe how she came into an animal condition. The doe recounts
    that, as a girl, she interrupted a deer and doe in the wood; the deer revealed
    himself as the muni Su-tapas, cursed her to become a doe after death, and then
    mitigated the curse by prophesying that she would conceive Lola, remember her
    former life, speak human language, and be freed after the child's birth. Lola
    is foretold to defeat his father's enemies, conquer the earth, and become a Manu.
    The doe later gives birth to the auspicious child, is released from the curse,
    and rishis assemble to name him.
  language: English
  quote_policy: summarized
