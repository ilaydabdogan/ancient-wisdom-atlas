  quote: ''
  summary: A hymn repeatedly reverences a goddess who abides among all created beings
    in forms such as faith, loveliness, good fortune, activity, memory, mercy, contentment,
    mother, and error. The hymn calls her pervasive, ruler of the senses, and present
    throughout the world as thinking mind. The gods pray for protection from calamity
    while oppressed by Daityas. The rishi then narrates that Parvati comes to bathe
    in the Ganges and asks the gods whom they are hymning.
