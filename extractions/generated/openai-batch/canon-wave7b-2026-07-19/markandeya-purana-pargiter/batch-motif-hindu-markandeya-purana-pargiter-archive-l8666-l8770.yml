  quote: ''
  summary: The passage explains ranks of ancestors related to pinda and lepa offerings,
    describes how various ancestors in different conditions receive nourishment from
    scattered food and water associated with śrāddha rites, urges faithful performance
    of śrāddha, and lists required and voluntary times for the rite.
  language: English
  quote_policy: summarized
