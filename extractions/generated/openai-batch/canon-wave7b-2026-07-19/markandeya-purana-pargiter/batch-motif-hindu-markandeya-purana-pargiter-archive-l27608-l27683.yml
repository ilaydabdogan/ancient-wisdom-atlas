canonical_text:
  quote: ''
  summary: During battle, wounds to the Asura Rakta-vija cause blood to fall, and
    from that blood numerous Asuras arise and fill the world. Chandika instructs Kali/Camunda
    to stretch out her mouth and consume the blood-born Asuras and the blood itself.
    As Chandika continues to wound Rakta-vija, Kali/Camunda drinks the blood and devours
    the beings arising from it, until Rakta-vija falls bloodless. The gods rejoice,
    and the Mothers dance intoxicated with blood.
  language: English
  quote_policy: summarized
