canonical_text:
  quote: ''
  summary: The passage closes a prior account of Duhsaha’s offspring, then narrates
    the creation and naming of Rudra in eight personalities. Brahma’s dark creation
    is followed by a blue-red youth appearing in his lap, crying, asking for a name,
    receiving the name Rudra and seven further names, along with stations, wives,
    and sons. The passage then summarizes Sati’s relation to Rudra/Bhava and gives
    genealogies of Bhrigu, other rishis, Agni, and the Pitris.
  language: English
  quote_policy: summarized
