canonical_text:
  quote: ''
  summary: A fragmentary opening says the world was overspread by descendants. The
    passage then identifies the hosts of gods as chief sons of Kasyapa, says Brahma
    made them participants in sacrifices and rulers over the three worlds, and narrates
    their harassment and defeat by Daityas, Danavas/Banavas, and Rakshasas. Aditi,
    grieving for her sons who have lost the worlds and sacrificial shares, undertakes
    austerity and hymns the Sun, praising his golden splendour and his role in drawing
    up waters, handling lunar nectar, producing rain, and maturing plants.
  language: English
  quote_policy: summarized
