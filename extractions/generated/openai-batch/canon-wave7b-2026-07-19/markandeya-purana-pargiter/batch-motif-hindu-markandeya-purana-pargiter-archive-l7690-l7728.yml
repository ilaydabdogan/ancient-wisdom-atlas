  summary: The Canto XXV heading and opening verses continue the story of Kuvalaydiva
    and Madalasi/Madalasa. Jada narrates that the male protagonist returns to his
    city, tells his parents that he has regained the wife who had died, and the wife
    honors her in-laws and kin. The citizens celebrate; Rita-dhvaja and his wife enjoy
    themselves in natural places. The passage also states that, long afterward, King
    S'atru-jit dies after ruling worthily. The heading previews succession, a son,
    and Madalasa speaking to the infant.
