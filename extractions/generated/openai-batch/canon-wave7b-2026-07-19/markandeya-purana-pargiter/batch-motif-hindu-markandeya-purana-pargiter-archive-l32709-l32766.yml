canonical_text:
  quote: ''
  summary: A prince rejects the admonition of munis, seizes a vaisya's daughter, raises
    a sword, and declares that he has carried her off by the Rakshasa form of marriage.
    Her father appeals to the prince's father, who orders his army to kill the prince
    for violating righteousness. The prince defeats many soldiers, then battles his
    father. A wandering Muni appears from the air, halts the combat, and declares
    the son to be in the right while explaining caste-ordered marriage rules.
  language: English
