canonical_text:
  quote: ''
  summary: 'A didactic passage gives rules for a wise or intelligent man: how to speak
    about and honor a guru, yield the path to socially specified persons, circumambulate
    sacred places and revered persons, observe lunar-day restrictions, restrain posture
    and speech, avoid violence and ridicule, honor guests before eating, regulate
    tooth-washing, sleep, bathing, dress, food, and avoid adultery.'
  language: English
  quote_policy: summarized
