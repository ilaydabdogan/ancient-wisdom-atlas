canonical_text:
  quote: ''
  summary: A king questions a brahman woman in a forest. She identifies herself as
    the daughter of Ati-ratra and wife of Visala's son, says the Rakshasa Valaka abducted
    her while she slept and abandoned her in a dense forest, and directs the king
    toward the demon. The king enters by the indicated path and finds the Rakshasa
    with a retinue. The Rakshasa bows to the king, offers hospitality, and declares
    himself the king's servant because he dwells in the king's country.
  language: English
  quote_policy: summarized
