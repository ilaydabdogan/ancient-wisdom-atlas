  quote: in thee resides Brahma, and this world in its entirety
  summary: A hymn addresses the goddess Sarasvati as imperishable, supreme, all-containing,
    the abode of Brahma, Om, cosmic categories, sacrifices, and all dualities. Her
    highest form is said to be ineffable, universe-formed, and beyond declaration
    even by deities.
