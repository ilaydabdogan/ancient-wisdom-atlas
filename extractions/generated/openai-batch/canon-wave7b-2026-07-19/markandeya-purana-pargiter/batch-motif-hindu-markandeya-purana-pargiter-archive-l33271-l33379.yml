canonical_text:
  quote: ''
  summary: A rishi tells a king about the demon Kujrimbha, his Patala domain, and
    the club Saunanda, whose power fails for a day when touched by a woman. The king
    consults ministers while his daughter Mudavati overhears. Kujrimbha later abducts
    Mudavati from a grove. The king sends his two sons through a hole to Rasatala,
    but Kujrimbha defeats and binds them. The king promises Mudavati to whoever will
    slay the demon and free his children. Vatsapri, son of Bhanandana, accepts the
    task and descends armed to Patala.
  language: English
  quote_policy: summarized
