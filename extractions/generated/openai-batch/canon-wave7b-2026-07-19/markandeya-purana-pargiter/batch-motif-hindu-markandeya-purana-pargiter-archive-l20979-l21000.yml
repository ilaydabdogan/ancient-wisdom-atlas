  quote: ''
  summary: 'A canto heading introduces a continued description of the Earth. The speaker
    Markandeya is said to tell of the continents Bhadrasva and Ketumala, the country
    of the Northern Kurus, and their mountains, rivers, and people. Markandeya then
    says he has declared the continent Bharata and names the four ages: Krita, Treta,
    Dvapara, and Kali. Editorial notes on zodiac signs and textual readings follow.'
