canonical_text:
  quote: ''
  summary: 'Alarka asks his mother Madalasa to explain Virtuous Custom. Madalasa gives
    prescriptive instruction for a householder: maintain virtuous custom, pursue Righteousness,
    Wealth, and Love, divide wealth for this world and the next, perform daily and
    domestic rites, honor ancestors, gods, humans, and living creatures, follow rules
    for food and speech, show respect to gurus, brahmans, and cattle, and observe
    many purity and avoidance rules involving bodily functions, women in courses,
    water, fire, celestial bodies, directions, clothing, and objects considered impure
    or unsuitable.'
  language: English
  quote_policy: summarized
