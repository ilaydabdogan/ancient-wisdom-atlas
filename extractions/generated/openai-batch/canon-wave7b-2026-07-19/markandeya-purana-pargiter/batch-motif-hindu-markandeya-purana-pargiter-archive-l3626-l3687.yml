canonical_text:
  quote: ''
  summary: 'The passage describes the experience of a person after death: failing
    breath and sight, pain, departure from the body, assumption of another action-produced
    body for chastisement, binding and dragging by Tama’s messengers along a dreadful
    southern road toward Tama’s abode, the differing ease of charitable donors, continued
    suffering connected with the corpse, nourishment through relatives’ offerings,
    and eventual sight of Tama’s iron city and Tama himself after twelve days.'
  language: English
  quote_policy: summarized
