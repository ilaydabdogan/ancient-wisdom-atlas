canonical_text:
  quote: The life of virtuous men ... abounds in good fruit.
  summary: A moral statement praises virtuous men who avoid abuse, show compassion,
    and shelter those in calamity. Jada then narrates that a Naga king addresses his
    two sons, proposing ordered ablutions, pleasures, wine, and a feast before spending
    time with Kuvalayasva to hear the story of his heart’s festival. Kuvalayasva silently
    assents, and the Naga king gathers with his sons and the king’s son for a joyful,
    restrained feast of foods and wines.
  language: English
  quote_policy: quoted
