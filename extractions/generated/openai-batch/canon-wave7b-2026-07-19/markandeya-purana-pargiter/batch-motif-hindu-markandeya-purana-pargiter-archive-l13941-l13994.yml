  quote: ''
  summary: The passage gives instructions to the Yaksha or goblin Duhsaha about houses
    he must avoid, inhabit, parch, or roam in. Houses marked by Lakshmi-associated
    or auspicious features are excluded, while houses marked by disorder, improper
    ritual behavior, death remains, or mishandled offerings are assigned to him and
    to other Rakshasas.
