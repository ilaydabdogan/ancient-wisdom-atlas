canonical_text:
  quote: No other land of action exists among the worlds
  summary: The passage praises Bharata as a fourfold country governed by the four
    ages, bounded by the ocean and the Himavat range, filled with seeds and many kinds
    of beings. It calls Bharata the unique land of action among the worlds and reports
    that gods wish to become men on earth because humans can perform actions that
    gods and demons cannot.
  language: English
  quote_policy: quoted
