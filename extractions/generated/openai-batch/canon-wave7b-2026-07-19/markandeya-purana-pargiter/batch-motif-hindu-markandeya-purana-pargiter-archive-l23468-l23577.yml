canonical_text:
  quote: ''
  summary: The opening of Canto LXXII describes King Uttama returning to his city,
    speaking with a brahman whose wife has been restored, and seeking help for his
    own absent queen. The brahman instructs him on righteousness and prescribes a
    Vara or Mitra-vinda sacrifice to create affection between husband and wife. The
    sacrifice is performed seven times, after which the king is told to fetch his
    queen. The canto heading also summarizes later events involving the queen’s return
    from Patala, a Rakshasa, a Naga princess released from a curse, and the birth
    of the Manu Auttama.
  language: English
  quote_policy: summarized
