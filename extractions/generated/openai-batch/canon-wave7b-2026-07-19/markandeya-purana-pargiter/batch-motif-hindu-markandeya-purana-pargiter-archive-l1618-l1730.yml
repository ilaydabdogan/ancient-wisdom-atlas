canonical_text:
  quote: ''
  summary: In a delightful forest and watery setting, Sauri/Rama, accompanied by maidens,
    comes to a bower where learned brahmans listen to Suta reciting old sacred tales.
    The intoxicated plough-bearer is saluted by the brahmans, but not by the bard;
    in anger he strikes and kills Suta while Suta is repeating Vedic words. The brahmans
    leave. Rama recognizes the act as a grievous sin of brahmanicide, blames rage,
    wine, arrogance, and cruelty, and undertakes a twelve-year vow and pilgrimage
    to the Pratiloma Sarasvati as expiation.
  language: English
  quote_policy: summarized
