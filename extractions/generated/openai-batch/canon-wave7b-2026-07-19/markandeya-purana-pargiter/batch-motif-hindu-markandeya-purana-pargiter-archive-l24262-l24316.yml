canonical_text:
  quote: ''
  summary: A muni sees a high-souled king bearing royal insignia and bowing before
    him. The muni orders his disciple Gautama to bring an argha offering and calls
    the king his son-in-law. The king is puzzled, accepts the offering, and is welcomed.
    The muni says the king's wife is nearby and asks about his other wives. The king
    asks which wife is present, lists the wives he knows, and says he does not know
    Revati. The rishi identifies Revati as the maiden whom the king had just addressed
    as “Dear.”
