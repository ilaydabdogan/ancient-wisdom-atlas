canonical_text:
  quote: ''
  summary: A speaker praises a wife who followed her husband in death and a son reported
    to have died defending brahmans and family honor. The mother likewise praises
    the son’s reported death while protecting a Muni. The king performs funeral rites
    and a water offering. Talaketu emerges from the Yamuna, says sacrificial acts
    to Varuna are complete, and the prince returns to his father’s city on a swift
    steed.
