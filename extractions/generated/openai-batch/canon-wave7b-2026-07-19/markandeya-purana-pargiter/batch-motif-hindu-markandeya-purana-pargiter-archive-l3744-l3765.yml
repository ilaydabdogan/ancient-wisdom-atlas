  summary: The passage describes celestial adornments, music, and incomparable heavenly
    chariots going quickly to the beings under discussion. When they descend, they
    are born in families of kings and other high-souled men. There they observe upright
    conduct and enjoy vigorous pleasures; afterward they go upward, while those taking
    the downward path become men as before. The speaker then states that the perishing
    of a living being has been explained and introduces the beginning of the foetus.
