canonical_text:
  quote: ''
  summary: Avikshita agrees to help his mother perform the 'What-want-ye?' penance.
    The queen worships wealth-associated deities and powers. Ministers warn King Karandhama
    that Avikshita has renounced wives and has no son, threatening the royal line
    and ancestral offerings. When Avikshita publicly pledges to grant requests during
    the penance, the king asks to see a grandson on his lap. Avikshita resists because
    of his vow of continence but ultimately agrees to wed again because he is bound
    by his promise. The following canto heading summarizes Avikshita's later hunting
    episode, rescue of a maiden from a Daitya, and receipt of a divine boon for a
    future son.
  language: English
  quote_policy: summarized
