  quote: ''
  summary: A speaker identified in the passage with Hama Halayudha declares that he
    will not go to either Arjuna or Duryodhana and will use holy bathing places. He
    takes leave of Krishna, Arjuna, and Duryodhana, goes to Dvaraka, drinks at holy
    bathing places, and proceeds to the park of Raivata with Revati and maidens. The
    passage then describes a sacred, abundant forest with pools, lotus clumps, monkeys,
    birdsong, and many fruiting and flowering trees.
