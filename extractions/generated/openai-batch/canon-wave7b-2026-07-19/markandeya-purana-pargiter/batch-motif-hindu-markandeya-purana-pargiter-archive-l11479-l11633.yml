canonical_text:
  quote: ''
  summary: 'The passage teaches how a yogi should respond to ill omens that presage
    death: determine their time, abandon fear, practice devotion and meditation on
    the Supreme Soul, and attain absorption. It then gives a series of similes and
    lessons for yogis from stones, animals, a house, an ant, a tree, a deer, a vessel,
    the body, wealth, and ordinary self-interest. Alarka thanks Dattatreya, interpreting
    military defeat and loss as divinely caused benefits that brought him to wisdom.
    He resolves to leave household life, is instructed to practice without egotism,
    then offers his kingdom to the king of Kasi or to Subahu. The king of Kasi challenges
    this renunciation as contrary to kshatriya duty.'
  language: English
  quote_policy: summarized
