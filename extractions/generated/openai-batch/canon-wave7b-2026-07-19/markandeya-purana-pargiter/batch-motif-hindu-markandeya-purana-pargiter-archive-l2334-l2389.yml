canonical_text:
  quote: "“at present I have nought; my wife has been sold, and my young son.”"
  summary: In the story of Haris-candra, a brahman takes payment and carries off the
    king's boy bound together with his mother. The king laments that his wife and
    son have been sold into bondage. Vishvamitra, also called Kausika in the passage,
    demands the wealth as a sacrificial fee, judges the proceeds insufficient, threatens
    power derived from austerities and brahmanhood, and grants only a remaining fourth
    part of the day for further payment.
  language: English
  quote_policy: quoted
