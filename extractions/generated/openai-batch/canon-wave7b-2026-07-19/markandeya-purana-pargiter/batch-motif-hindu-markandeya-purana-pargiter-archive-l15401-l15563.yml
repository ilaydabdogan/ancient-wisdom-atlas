canonical_text:
  quote: ''
  summary: Markandeya describes the Ganges as issuing from Narayana, passing through
    the moon, falling upon Meru, and dividing into four directional streams. The southern
    stream is held and then released by Shiva after King Bhagiratha propitiates him.
    The passage also describes the rivers, mountains, and unusually happy conditions
    of countries in Jambu-dvipa outside Bharata.
  language: English
  quote_policy: summarized
