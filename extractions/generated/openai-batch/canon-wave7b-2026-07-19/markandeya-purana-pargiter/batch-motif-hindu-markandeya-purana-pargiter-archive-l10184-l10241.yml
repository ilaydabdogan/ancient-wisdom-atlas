canonical_text:
  quote: ''
  summary: 'Alarka, son of Ritadhvaja Kuvalayasva and Madalasa, matures, marries,
    has sons, performs sacrifices, and follows his father’s commands. In old age Ritadhvaja
    transfers sovereignty to Alarka. Madalasa gives Alarka a final instruction: when
    distress arises during his rule, he should read the writing concealed in a golden
    ring she gives him. Ritadhvaja and Madalasa then bestow the kingdom on their son
    and depart to the forest to practise austerities.'
  language: English
  quote_policy: summarized
