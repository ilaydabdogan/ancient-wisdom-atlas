canonical_text:
  quote: ''
  summary: A fearful S'anti, concerned about sin against his guru after a fire has
    been extinguished, seeks refuge in Agni. He controls his mind, joins his hands,
    kneels, and hymns the seven fires. The hymn praises Agni/Fire as perfecter, giver
    of gods' functions, mouth of the gods, receiver of oblations, support of sacrifices,
    source of water, herbs, animals, gods and other beings, and origin and composition
    of everything.
  language: English
  quote_policy: summarized
