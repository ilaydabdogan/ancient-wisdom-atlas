canonical_text:
  quote: ''
  summary: Visvamitra permits King Hari-candra to depart. The king leaves with his
    wife and son, while citizens lament and follow him. When the king pauses out of
    compassion, Visvamitra angrily rebukes him and beats the toil-wearied queen with
    a wooden staff. Five Visve Devas pity the king and criticize Visvamitra for uprooting
    a great sacrificer. Visvamitra curses them to human birth, then modifies the curse
    so that they will have no wives or offspring and will become gods again. They
    are born from Draupadi as the five grandchildren of Pandu, explaining the status
    of the Pandaveyas.
  language: English
  quote_policy: summarized
