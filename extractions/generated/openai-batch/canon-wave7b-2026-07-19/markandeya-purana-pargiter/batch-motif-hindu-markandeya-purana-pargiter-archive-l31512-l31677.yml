canonical_text:
  quote: ''
  summary: 'The passage closes a hymn to the Sun as procreator and lamp of the worlds,
    then narrates the majesty of the Sun: Visva-karman pares away the Sun’s excessive
    glory and uses it to make divine weapons; the Sun finds Sanjna in mare form among
    the Northern Kurus, assumes horse form, and begets the Asvins and Revanta; the
    Sun then assigns stations and offices to his offspring, including Yama, Yamuna,
    the Asvins, Revanta, Savarna, Saturn, and Manu Vaivasvata.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sun is addressed as procreator of all worlds, cause of the glory that
    brings the three worlds to life, and lamp of all worlds.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Visva-karman leaves one sixteenth part of the Sun’s glory intact in spherical
    shape and pares away fifteen parts, after which the Sun’s body is described as
    beautiful and charming rather than excessively splendid.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The splendour pared away from the Sun is used to fashion divine items including
    Vishnu’s discus, Siva’s trident, Kuvera’s palki, the rod of the lord of the dead,
    the spear of the gods’ general, and other gods’ weapons.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Sun beholds his wife in the form of a mare and goes to the Northern Kurus
    in the form of a horse.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The mare, fearing a strange male, faces him while guarding her rear; the two
    join noses, and the Sun’s glory passes from his nostrils into the mare.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The two Asvins, named Nasatya and Dasra in the passage, are born from the
    mare’s mouth; Revanta is born afterward holding sword and bow, wearing armour,
    riding horseback, and carrying arrows and quiver.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Sun reveals his own unsullied and mild form; Sanjna perceives it joyfully,
    returns to her own form, and is led by the Sun to his home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Yama is connected with a curse and with righteousness; his father ends the
    curse, and the Sun appoints him to the southern region, world-protection, and
    lordship over the pitris.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Sun makes Yamuna the river flowing from the recesses of mount Kalinda,
    makes the Asvins physicians of the gods, and appoints Revanta lord over the Guhyakas
    with promises of protection and gifts for worshippers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Savarna is said to become the eighth Manu in the future and to perform austerities
    on Meru’s summit; his brother becomes Saturn by the Sun’s command; the passage
    also states that the Sun’s daughter becomes Yamuna and that Manu Vaivasvata belongs
    to the present creation.
  category: sequence
  evidence_refs:
  - ev:7
