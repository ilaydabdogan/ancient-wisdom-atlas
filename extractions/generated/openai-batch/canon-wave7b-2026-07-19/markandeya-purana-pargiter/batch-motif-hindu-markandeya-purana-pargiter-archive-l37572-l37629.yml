canonical_text:
  quote: ''
  summary: Dama kills Vapush-mat's sons, kin, and allies, then duels Vapush-mat. Remembering
    his father, who had been killed in the forest, Dama overthrows Vapush-mat, tears
    open his heart, and is stopped by the gods from tasting the blood. Dama then uses
    the blood for a water-oblation to his father, offers cakes made with Vapush-mat's
    flesh to his father, feasts Brahmans of Rakshasa families, and returns home. The
    narrator closes by praising kings of the Solar Race as heroic, sacrificial, righteous,
    and learned.
  language: English
  quote_policy: summarized
