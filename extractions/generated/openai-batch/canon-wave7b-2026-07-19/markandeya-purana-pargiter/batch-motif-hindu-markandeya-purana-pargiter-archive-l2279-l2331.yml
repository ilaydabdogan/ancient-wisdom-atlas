canonical_text:
  quote: ''
  summary: King Haris-c'andra offers his wife for sale as a slave-girl. An aged brahman
    buys her, gives payment, and drags the queen away by her hair. Her son Rohitasya
    clings to her and weeps; the brahman kicks him. The queen asks to see her son,
    says she is sold into slavery, and then asks the purchaser to buy the boy as well
    so mother and child may remain together, comparing them to a cow and calf.
  language: English
