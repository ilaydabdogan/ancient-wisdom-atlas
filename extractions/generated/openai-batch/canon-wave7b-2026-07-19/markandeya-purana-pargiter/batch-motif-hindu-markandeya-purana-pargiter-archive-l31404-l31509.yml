canonical_text:
  quote: ''
  summary: The passage describes Visvakarman reducing the Sun’s splendour and then
    uttering a hymn to the Sun. The hymn praises the Sun as compassionate, seven-horsed,
    fiery, world-sustaining, self-existent, the eye of the worlds, a disperser or
    consumer of darkness, rider of a chariot, and protector. A framing statement says
    that hearing of the paring down of the Sun’s body leads one to the Sun’s world
    at life’s end.
  language: English
  quote_policy: summarized
