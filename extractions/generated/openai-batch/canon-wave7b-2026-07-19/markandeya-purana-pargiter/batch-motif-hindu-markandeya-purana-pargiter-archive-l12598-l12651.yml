canonical_text:
  quote: ''
  summary: 'The passage describes further stages of creation: a creation capable of
    causation emerges from the Imperceptible during meditation; mankind is characterized
    as downward-streaming, luminous, ignorant and passionate, suffering, and active.
    It then lists Anugraha as a fifth creation with four dispositions and knowledge
    of past and present, describes a sixth creation of the origins and gross elements,
    and summarizes a sequence of creations from Prakriti involving mahat, tan-matras,
    bhutas, and vikaras. A note identifies Anugraha with Sankhya intellectual creation
    and gives Sridhara''s explanation.'
