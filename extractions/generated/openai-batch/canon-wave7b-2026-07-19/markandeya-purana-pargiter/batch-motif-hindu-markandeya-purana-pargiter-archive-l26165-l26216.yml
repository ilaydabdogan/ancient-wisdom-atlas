canonical_text:
  quote: ''
  summary: Mahisha, in buffalo form, devastates the goddess's troops and attacks her
    lion. His rage causes violent disturbances in earth, sea, clouds, and mountains.
    The goddess, named Ambika and Candika in the passage, binds him with a noose;
    he changes from buffalo to lion, then to a man with weapons, and then to an elephant,
    while the goddess attacks each form.
