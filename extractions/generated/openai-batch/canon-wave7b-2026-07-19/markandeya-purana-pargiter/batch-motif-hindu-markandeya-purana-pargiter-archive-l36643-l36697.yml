canonical_text:
  quote: ''
  summary: A king reflects that his ancestors personally performed sacrifices and
    resolves to do likewise. He performs an exceptionally lavish sacrifice, giving
    brahmans great wealth, food, cattle, clothing, ornaments, granaries, and other
    goods. When he attempts another sacrifice, no brahmans will serve as priests or
    accept further gifts because they are already wealthy. The king laments that his
    treasury is useless if he cannot sacrifice.
