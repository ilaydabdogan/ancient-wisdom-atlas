  quote: ''
  summary: A hymn praises the goddess as knowledge, sacred Vedic speech, Mental Vigour,
    Durga, S'ri, and Ganri. She is described as active in the existence and production
    of all worlds, as remover of pains, and as a boat for crossing the difficult ocean
    of existence. The passage then contrasts her beautiful face with her wrathful
    face, after Mahisha the Asura smites her face and sees her anger without immediately
    dying.
