canonical_text:
  quote: ''
  summary: The passage lists omens by which a wise person should recognize that death
    is near. These include abnormal visual signs, bodily changes, sensory failures,
    dreams of southward travel, entrapment, or non-return from fire or water, attack
    by evil spirits, color changes in clothing, and reversal of proper religious and
    social conduct. One group of signs is said to prognosticate a new body, and behavioral
    reversal is said to show that Yama and Death are at hand.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that failing to see oneself reflected in another person's
    eyes, seeing a rainbow at midnight, or seeing all the planets in daytime indicates
    that life is consumed or no longer remains.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists bodily changes such as a crooked nose, altered ears, watering
    left eye, reddish face, and black tongue as signs that death is impending.
