canonical_text:
  quote: ''
  summary: A rishi tells the king that a Naga king named Kapotaka saw the king's abandoned
    wife wandering in a forest, became enamored, and carried her to Patala. Kapotaka's
    daughter Nanda hid the queen in the women's apartments because she feared the
    queen would become a rival wife to her mother; Nanda was cursed with dumbness
    after refusing to answer the king. The queen remains detained there and chaste.
    The king asks why his wife is not tender to him, and the rishi explains the discord
    through hostile planetary influences at the marriage. The rishi instructs the
    king to rule righteously with his wife, and the king prostrates before the muni
    and returns to his city.
  language: English
