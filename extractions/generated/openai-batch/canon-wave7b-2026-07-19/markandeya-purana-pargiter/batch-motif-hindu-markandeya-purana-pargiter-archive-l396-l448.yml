  quote: ''
  summary: A bird-king battles and kills the Rakshasa Vidyud-rupa, takes the Rakshasa's
    wife after she asks for protection, and fathers Tarkshi, identified with the cursed
    Apsaras Vapu. Tarkshi later marries Drona, conceives, and enters the Kurukshetra
    battlefield, where the Kurus and Pandavas are fighting and Bhagadatta and Arjuna
    are in combat.
