canonical_text:
  quote: ''
  summary: At the transition into Canto CXXXV, a noble lady enters the funeral pyre
    while embracing her lord's body. Dama then hears from an ascetic that his father
    has been killed. Enraged, he vows to avenge the death of his father by killing
    Yapush-mat, the king of the Southern country, and to use the enemy's blood and
    flesh in funeral-related acts; if he fails, he says he will enter the fire. He
    also threatens any supernatural beings who might assist the enemy and describes
    the enemy as accompanied by kin, friends, and an army.
  language: English
  quote_policy: summarized
