canonical_text:
  quote: ''
  summary: The passage computes a manvantara and a day and night of Brahma in human
    and divine years. It states that dissolution occurs at the end of Brahma's day,
    that the lower three lokas perish, that dwellers in Mahar-loka move to Jana-loka
    because of heat, and that Brahma sleeps during the night while the three worlds
    are dissolved into one ocean.
