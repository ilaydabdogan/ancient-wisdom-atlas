canonical_text:
  quote: ''
  summary: A catalog assigns specific punishments and rebirths for thefts and other
    sins. Various stolen goods correspond to rebirth as birds, animals, insects, poverty,
    lameness, or other conditions. Taking land is followed by Raurava and other terrible
    hells and then a graded sequence of plant, animal, human, caste, disability, and
    disease states. The passage also lists punishments for stealing learning, failing
    to reward the guru, taking another’s wife, and making a Homa oblation in unkindled
    fire.
  language: English
  quote_policy: summarized
