canonical_text:
  quote: ''
  summary: Agni promises benefits from a hymn of praise, including fulfillment of
    desire, merit, destruction of sin, and correction of ritual faults. He also promises
    that S'anti's guru will have a son, Bhautya, who will be lord of a manvantara.
    Agni disappears; S'anti returns to the hermitage and sees the sacrificial fire
    restored. The guru returns, receives S'anti's report, embraces him, and gives
    him sacred teachings. The passage then names figures of Bhautya's future manvantara
    and states rewards for hearing accounts of the manvantaras.
  language: English
  quote_policy: summarized
