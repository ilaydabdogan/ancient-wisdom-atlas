canonical_text:
  quote: ''
  summary: 'The passage gives rules for a sraddha ritual: which brahmans may be invited
    or excluded, warnings about sexual impurity, procedures for seating and honoring
    brahmans representing gods and ancestors, offerings with water, barley, darbha
    grass, sesame, money, rice, fire oblations to Fire, Soma, and Yama, feeding of
    the dvijas, protective mantras against Rakshasas, and scattering food after permission
    is given.'
  language: English
  quote_policy: summarized
