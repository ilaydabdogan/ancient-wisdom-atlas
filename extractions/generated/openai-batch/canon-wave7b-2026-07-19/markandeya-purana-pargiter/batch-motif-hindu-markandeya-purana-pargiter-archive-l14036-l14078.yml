canonical_text:
  quote: ''
  summary: 'The passage introduces Canto LL as a catalogue of Duhsaha''s offspring:
    eight sons and eight daughters, described as terrible beings who pervade the world.
    A framing note says these beings are personifications of injuries, vices, and
    social offences. Markandeya names Duhsaha''s wife Nirmashti, recounts her origin,
    lists the children, announces that their harmful functions and remedies will be
    described, and begins with Dantakrishti, who occupies the teeth of newborn children
    and produces intense wind.'
  language: English
  quote_policy: summarized
