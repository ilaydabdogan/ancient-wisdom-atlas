  summary: The passage introduces Madalasa's exposition of virtuous custom and gives
    part of her speech to her son. She instructs that a householder should worship
    gods and pitris with oblations, honor guests, kin, dependants, creatures, animals,
    ants, beggars, and petitioners with food, observe good customs, perform domestic
    sacrifices, and avoid neglecting periodic ceremonies because such neglect incurs
    sin.
