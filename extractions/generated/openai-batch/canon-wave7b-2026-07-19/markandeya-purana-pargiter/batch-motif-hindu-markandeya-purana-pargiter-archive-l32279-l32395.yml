canonical_text:
  quote: ''
  summary: The passage affirms the Sun's supremacy and then recounts Manu's descendants.
    Manu seeks a distinguished son through sacrifice to Mitra and Varuna, but Ila,
    a daughter, is born because the offering is improperly made. Manu petitions the
    gods, and Ila becomes the son Su-dyumna. Later Su-dyumna is transformed into a
    woman while hunting through a god's wrath; Budha begets Pururavas on her. After
    Pururavas is born, Su-dyumna performs a horse-sacrifice, regains male nature,
    and becomes king. The passage then names Su-dyumna's sons and explains Pururavas's
    later receipt of Pratishthana.
  language: English
  quote_policy: summarized
