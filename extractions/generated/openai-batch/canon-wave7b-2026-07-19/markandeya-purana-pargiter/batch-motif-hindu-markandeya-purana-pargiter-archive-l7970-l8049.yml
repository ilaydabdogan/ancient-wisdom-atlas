canonical_text:
  quote: ''
  summary: 'Alarka, instructed daily by his mother Madalasa, grows in age and intelligence,
    receives investiture with the sacred thread, bows to her, and asks what he should
    do for happiness in this world and the next. Madalasa replies with counsel for
    an inaugurated king: conciliate subjects, avoid destructive vices, maintain good
    counsel, detect spies, judge ministers, understand state and military policy,
    conquer the self before enemies, and remember examples of rulers destroyed by
    passions or successful through self-control.'
  language: English
  quote_policy: summarized
