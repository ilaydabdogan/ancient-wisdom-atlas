canonical_text:
  quote: ''
  summary: 'The passage gives closing prescriptions and results for hearing the Purana:
    donors and kings should make gifts; a wise hearer should revere Vyasa and give
    gifts to the spiritual preceptor; irreverent listeners or those who contemn the
    scripture incur loss of merit, ritual exclusion, and adverse rebirths; reverent
    hearing purifies the hearer’s family and leads to Vishnu’s eternal world and supreme
    union with the universal soul.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage instructs kings to give, according to their ability, villages,
    other lands, and carriages, and refers to gratifications for brahmans.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Purana is described as augmented with the objects of the Veda and as the
    sole abode of the Dharma-sastras; hearing it is said to yield every object.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: After hearing the entire Purana, a wise man is instructed to do full reverence
    to Vyasa for the benefits of righteousness, wealth, love, and final emancipation
    from existence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hearer is instructed to give his spiritual preceptor a cow accompanied
    with gold, clothing, and ornaments, and to gratify him with gifts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A person who hears even a single verse without reverencing the man who reads
    the Purana receives no merit and is called a Scripture-thief.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The gods and Pitris are said not to gladden the irreverent hearer with sons,
    and they do not desire his sraddha or the benefit he gains by bathing at sacred
    pilgrimage places.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A person who contemns the noble scripture while it is being read by sages
    becomes dumb and is born as a fool in seven births.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A person who further reverences the seventh Purana after hearing it is delivered
    from all sin and purifies his own family.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The purified man is said to go to Vishnu’s eternal world, not fall from there
    to become a man again, and by hearing the Purana may obtain supreme union with
    the universal soul.
  category: sequence
  evidence_refs:
  - ev:5
