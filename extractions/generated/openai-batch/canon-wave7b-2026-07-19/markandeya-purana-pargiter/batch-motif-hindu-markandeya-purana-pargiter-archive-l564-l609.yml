canonical_text:
  quote: ''
  summary: 'The passage introduces the continued story of the birds: they are said
    to be former sons of a rishi, born as birds after refusing a demanded self-sacrifice,
    yet granted knowledge. In the narrated verses, a muni nourishes the young birds,
    they fly to a celestial road and view the earth, return to the hermitage with
    knowledge developed, then honor and address the rishi as their father and spiritual
    guide who saved and cared for them.'
  language: English
  quote_policy: summarized
