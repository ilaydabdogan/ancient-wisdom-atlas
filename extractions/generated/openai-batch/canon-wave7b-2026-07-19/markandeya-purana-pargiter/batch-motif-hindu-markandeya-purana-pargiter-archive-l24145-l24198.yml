canonical_text:
  quote: ''
  summary: A muni distressed by his perverse son questions Garga. Rita-vad says he
    followed religious vows, learned the Vedas, married properly, performed rites
    and fire oblations, and begot a son according to conception ordinances because
    he feared the hell named Put. He asks whether the son's bad disposition is due
    to his own fault. Garga answers that the son was born at the termination of the
    constellation Revati, an evil time, and that neither parent nor family is at fault.
    Rita-vac curses Revati to fall, and Markandeya reports that the constellation
    fell while the world watched.
  language: English
  quote_policy: summarized
