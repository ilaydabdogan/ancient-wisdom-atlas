canonical_text:
  quote: ''
  summary: 'The passage narrates early creation: first-created beings show detachment,
    Brahma becomes wrathful, a sun-like half-male and half-female being is produced
    and divided, Manu Svayambhuva and Shata-rupa are created and become progenitors,
    and multiple divine and sage lineages are generated through marriages and births,
    including personified virtues and qualities.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The beings first created by the Self-existent, along with their sons and relatives,
    felt no attachment to the worlds, were composed, knew the future, and were free
    from passion and envy.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Brahma became wrathful when the first-created beings showed disregard at the
    creation of the worlds.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A sun-like male figure with an immense body, half male and half female, was
    produced.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A god commanded the produced figure to divide itself; the figure separated
    female and male natures and divided the male nature into eleven parts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The lord divided male and female natures into many parts, including men described
    as gentle and cruel, calm, black, and white.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Brahma created Manu Svayambhuva, described as begotten from and like himself,
    and Shata-rupa, described as cleansed from blemishes through austerities.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Manu Svayambhuva took Shata-rupa as his wife.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Shata-rupa bore two sons, Priya-vrata and Uttana-pada, and two daughters,
    Riddhi and Prashti or Prasuti; the father gave Prasuti to Daksha and Riddhi to
    Ruci in marriage.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ruci and his wife had a son, Yajna, and a daughter, Dakshina; Yajna and Dakshina
    became husband and wife and had twelve sons called the Yamas.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Daksha begat twenty-four daughters of Prasuti; the first thirteen named daughters
    were taken as wives by Dharma.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Eleven younger daughters of Daksha were taken in marriage by Rishis, Munis,
    and the Pitris in order.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The wives of Dharma gave birth to personified offspring such as Kama, Darpa,
    Niyama, Santosha, Lobha, Sruta, Danda, Naya, Vinaya, Bodha, Vyavasaya, Kshema,
    Sukha, and Yasas; Harsha is also named as a grandson to Dharma through Kama.
  category: sequence
  evidence_refs:
