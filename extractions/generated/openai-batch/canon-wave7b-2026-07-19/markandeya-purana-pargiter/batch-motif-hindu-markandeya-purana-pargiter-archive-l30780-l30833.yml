canonical_text:
  quote: ''
  summary: 'A hymn reveres multiple forms of the Sun: water and seasonal forms that
    nourish crops, nectar that vivifies plants and is consumed by gods and pitris,
    forms joined with Agni and Soma, a threefold Vedic form, and a transcendent Om-associated
    form. Markandeya then narrates that a self-restrained fasting goddess praises
    the Sun day and night until he appears to her as a brilliant, flame-haloed mass
    of glory in the sky, after which she speaks.'
  language: English
  quote_policy: summarized
