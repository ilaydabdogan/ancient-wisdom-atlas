  quote: ''
  summary: Brahma, standing on a lotus from Vishnu's navel and seeing Vishnu asleep
    while two Asuras threaten him, praises the divine Sleep/Mahamaya as cosmic mother,
    source, maintainer, protector, destroyer, sacred speech, knowledge, delusion,
    and armed goddess. He asks her to bewitch Madhu and Kaitabha and restore Vishnu
    to consciousness so that he may slay them.
