    other meal, and withdraw from external things.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The son says religious devotion cures connection with pain, causes final emancipation
    from existence, and prevents renewed union with living beings.
  category: speech
  evidence_refs:
