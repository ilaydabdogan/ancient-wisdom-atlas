canonical_text:
  quote: ''
  summary: A son advises his father to abandon householder life and pursue religious
    devotion leading to final emancipation. The father asks to hear about yoga, describing
    himself as afflicted by mundane existence, ignorance, and attachment. The son
    introduces an earlier teaching by Dattatreya to Alarka, then begins a narrative
    about the leprous brahman Kausika, his devoted wife, and Kausika's desire for
    a courtesan.
  language: English
  quote_policy: summarized
