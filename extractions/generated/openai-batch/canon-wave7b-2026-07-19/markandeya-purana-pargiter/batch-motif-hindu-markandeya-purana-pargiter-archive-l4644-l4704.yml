canonical_text:
  quote: ''
  summary: The passage catalogs sins and their corresponding punishments, chiefly
    rebirth as animals, birds, insects, worms, or degraded forms, sometimes after
    release or dismissal from hell. The listed offenses include sexual transgressions,
    obstruction of sacrifice, liberality, and marriage, giving a daughter away twice,
    eating without offering portions to gods, pitris, and brahmans, scorning an elder
    or fatherlike brother, caste-marked sexual offenses involving a brahman-woman,
    ingratitude, homicide, and theft of food.
  language: English
  quote_policy: summarized
