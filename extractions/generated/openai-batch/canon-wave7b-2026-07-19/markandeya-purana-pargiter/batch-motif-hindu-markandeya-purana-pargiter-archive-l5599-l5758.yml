candidate_motifs:
- id: motif:1
  label: Propitiation of a divine ascetic for cosmic restoration
  taxonomy_refs:
  - sacred_exchange
  basis: The defeated gods worship Dattatreya with praise, food, garlands, presents,
    and attendance in order to obtain deliverance and regain the worlds seized by
    Danavas.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage presents ritualized favor-seeking clearly, but does not name
    a formal exchange doctrine beyond propitiation and boon-seeking.
- id: motif:2
  label: Fire of a deity’s glance destroys enemy power
  taxonomy_refs:
  - divine_judgment
  basis: Dattatreya tells the gods to bring the Asuras before his view so that the
    fire of his glance may consume the glory of their strength and cause them to perish
    from his sight.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage promises destruction by glance but is cut before the outcome
    is narrated.
- id: motif:3
  label: Divine woman as mother of the world
  taxonomy_refs:
  - mother_goddess
  basis: The gods identify the woman beside Dattatreya as the mother of the world
    and defend her from Dattatreya’s stated concern about impurity.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage gives the title and identifies the woman with Lakshmi, but
    does not expand a full mother-goddess theology in this excerpt.
- id: motif:4
  label: Divine beloved targeted for abduction
  taxonomy_refs:
  - stolen_beloved
  - divine_beloved
  basis: Lakshmi is seated at Dattatreya’s left side and described as his wife; the
    Daityas become overcome by desire and plan to place her in a palki and carry her
    away.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The excerpt ends during the abduction plan, so it records intent rather
    than a completed abduction.
- id: motif:5
  label: Unorthodox ascetic holiness beyond ordinary impurity
  taxonomy_refs:
  - wisdom
  - trickster_boundary
  basis: Dattatreya is described as an ascetic and boon-giver while also drinking
    liquor, having food remnants, and being associated with improper practices; the
    gods answer that knowledge makes him sinless.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  confidence: medium
  cautions: The taxonomy fit is interpretive; the passage itself frames the issue
    through impurity, learning, and impartial knowledge rather than explicitly through
    trickster categories.
