canonical_text:
  quote: ''
  summary: A royal interlocutor is advised by the muni Garga to propitiate Dattatreya,
    a Vishnu-associated ascetic and protector. Garga recounts how the gods, defeated
    by Daityas and Danavas led by Jambha, sought Vrihaspati’s counsel and then worshipped
    Dattatreya at his hermitage. Dattatreya, accompanied by Lakshmi and described
    as drinking liquor and observing improper practices, answers their plea for deliverance.
    After a dialogue about impurity, knowledge, and Lakshmi as mother of the world,
    Dattatreya instructs the gods to bring the Asuras before his sight so that the
    fire of his glance may consume their strength. The Daityas pursue the gods to
    the hermitage, see Lakshmi beside Dattatreya, become overcome with desire, and
    plan to carry her away in a palki.
  language: English
  quote_policy: summarized
