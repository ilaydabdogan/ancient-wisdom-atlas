canonical_text:
  quote: ''
  summary: The passage gives a concluding praise and classification of the Markandeya
    Purana. It says the Forefather spoke eighteen Puranas, names Markandeya as the
    seventh among them, lists the Purana titles, states that repeating their titles
    at the three daily periods yields the result of a horse-sacrifice, defines a Purana
    by five characteristics, and praises hearing this Purana as destroying sins and
    conferring ritual merit comparable to gifts at Pushkara. It also says the person
    who causes the Purana to be heard should be worshipped like the divine Forefather.
  language: English
  quote_policy: summarized
