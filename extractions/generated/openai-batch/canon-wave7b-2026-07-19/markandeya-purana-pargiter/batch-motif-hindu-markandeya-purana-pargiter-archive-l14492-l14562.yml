  summary: The passage describes harmful female spirits who encourage improper attraction,
    enter houses and clothing under specified conditions, and attack people under
    a stated eating or drinking condition. It then names Virodhini’s three sons and
    describes the household circumstances in which they become active, followed by
    their actions through tongue, ears, and mind. A final transition names three sons
    born to Svayambhari by Caurya, or Theft.
