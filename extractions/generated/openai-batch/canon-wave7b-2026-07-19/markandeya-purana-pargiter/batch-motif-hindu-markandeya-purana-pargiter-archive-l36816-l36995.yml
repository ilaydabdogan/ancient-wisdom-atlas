canonical_text:
  quote: ''
  summary: At Sumana's svayam-vara, she chooses Dama before an assembly of kings.
    Three rival princes, enamoured of her, resolve to seize her by force and then
    do so while she stands beside Dama. Dama and the assembled kings debate whether
    the seizure is righteous, with arguments about Gandharva and Rakshasa marriage
    forms for kshatriyas. Dama angrily strings his bow when his chosen wife is being
    carried off.
  language: English
  quote_policy: summarized
