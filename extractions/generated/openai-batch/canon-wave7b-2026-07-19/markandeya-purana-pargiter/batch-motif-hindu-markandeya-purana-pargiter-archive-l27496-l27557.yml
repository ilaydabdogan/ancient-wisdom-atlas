canonical_text:
  quote: ''
  summary: Divine Energies, including those of Nri-simha and Indra, arrive for battle
    and surround S'iva. From the goddess' body comes a fierce Energy of C'andika,
    who directs S'iva to carry an ultimatum to S'umbha, Nisumbha, and the assembled
    Danavas. The Asuras reject the message and attack Katyayani with weapons; the
    goddess counters their missiles, while Kali tears foes apart in front of her.
  language: English
  quote_policy: summarized
