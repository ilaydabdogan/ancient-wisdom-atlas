canonical_text:
  quote: ''
  summary: 'A weary king, separated from his kin, falls into deep sleep and sees a
    destiny-shaped sequence: birth as a pukkasa boy working at the burning-ground,
    conflict with brahmans, a curse to Naraka, seizure by Yama''s messengers, hell-torments,
    many lower rebirths, rebirth in his own race, loss through dice, separation from
    wife and son, and attack by a lion.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king is separated from his kindred, uncouth in form, overpowered by sleep,
    and falls into a dead sleep on his pallet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In sleep he sees himself in another body and connected with work at a burning-ground.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: He sees himself conceived in the womb of a pukkasa woman and resolves that,
    when born, he will practice liberality.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: As a pukkasa boy he is ready to perform obsequies for dead bodies in the burning-ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At age seven he asks brahmans for a wage after a poor and virtuous dead brahman
    is brought to the burning-ground.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The brahmans, angered when he lacks patience with them, curse him to go to
    terrible Naraka.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Yama's messengers appear in the dream bearing nooses, seize him, and lead
    him away by force.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: He falls into Naraka into a tub of oil and undergoes torments including cutting,
    darkness, consuming pus and blood, burning, roasting, shaking, tearing, melting,
    blazing, and cold winds.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:9
  text: A day in Naraka is described as being as long as a hundred years.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:10
  text: After Naraka he is cast upon earth and born as a dog that eats filth and vomit
    and endures cold and heat.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:11
  text: He then sees successive births as many animals and other living beings, including
    ass, elephant, monkey, ox, goat, cat, heron, bull, sheep, bird, worm, fish, tortoise,
    wild boar, porcupine, cock, parrot, maina, motionless living objects, snake, and
    other corporeal beings.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:12
  text: He sees one living being born after another, with each day experienced as
    a hundred years, and a hundred years pass among the lower creation.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:13
  text: He sees himself born again in his own race, loses his kingdom in dice-playing,
    and loses his wife and son.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:14
  text: He goes alone to the forest and sees a ravenous lion approaching with open
    mouth, accompanied by a young elephant or fabulous animal as noted in the translation
    footnote.
  category: action
  evidence_refs:
  - ev:15
- id: obs:15
  text: He is devoured while lamenting for his wife Saivya, and then sees his wife
    and son imploring him to rescue them and reproaching his dice-playing.
  category: sequence
  evidence_refs:
  - ev:16
  - ev:17
