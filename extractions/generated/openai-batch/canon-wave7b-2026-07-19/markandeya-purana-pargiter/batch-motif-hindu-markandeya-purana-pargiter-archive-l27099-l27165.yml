canonical_text:
  quote: ''
  summary: A messenger urges the goddess to come to S'umbha or to his younger brother
    Nisumbha for marriage, calling her a gem and promising dominion. The rishi narrates
    that Durga smiles and replies that she once vowed to marry only one who defeats
    her in battle, humbles her pride, and equals her strength. The messenger rebukes
    her pride, asserts that even the gods cannot face the Daityas, threatens that
    she may be dragged by her hair, and the goddess sends him back to report her words
    to the lord of the Asuras.
  language: English
  quote_policy: summarized
