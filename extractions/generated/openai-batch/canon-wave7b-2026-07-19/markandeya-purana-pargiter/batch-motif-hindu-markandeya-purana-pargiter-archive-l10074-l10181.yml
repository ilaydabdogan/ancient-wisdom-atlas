canonical_text:
  quote: ''
  summary: Ritual instructions describe purification after contact with impure persons,
    animals, foods, or conditions; death and birth impurity periods by caste and kinship
    group; water offerings, gathering of remains, and ceremonies for the departed;
    exceptional deaths with shortened impurity; gifts, oblations, and pure acts for
    benefit in this world and the next; and the wise man’s duties of Vedic study,
    righteous wealth, sacrifice, and uncensurable conduct.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Touching listed forbidden foods, persons, animals, outcastes, corpse-carriers,
    menstruating women, domestic hogs, or persons contaminated by birth impurity is
    followed by purification by bathing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who neglects the continual ceremony or is abandoned by brahmans is
    described as polluted; neglect of the ceremony is said to stop the re-birth of
    deceased relatives.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Different impurity periods are prescribed for brahmans, kshatriyas, vaisyas,
    and sudras before they resume their occupations.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Water is to be presented to a departed person after the body has been burnt
    outside by relatives, on specified lunar days.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Relatives gather the departed person’s ashes and bones on the fourth day,
    touch their limbs with them, and then sahodakas perform ceremonies; contact between
    sapindas and sahodakas affects purity.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: For deaths by voluntary or unnatural means, religious fasting, childhood,
    foreign sojourn, or religious mendicancy, purification is said to occur at once,
    though another view gives three days for the sapindas.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: When a son is born, the father bathes with his clothes on; if another child
    is born, purification follows the days assigned to the elder-born child.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After the impurity period, an ekoddishta sraddha is to be performed for the
    departed person, and desired or prized things are to be given to qualified brahmans
    by one hoping for immortality.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: After touching water and specified objects, the participants perform ceremonies,
    make the prescribed oblation, and carry out pure acts said to confer bliss in
    this world and the next.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: A wise man is instructed to study the three Vedas, acquire wealth righteously,
    perform sacrifices, avoid censurable or secretly shameful acts, and thereby bring
    splendour to his home through righteousness, wealth, and love.
  category: action
  evidence_refs:
  - ev:10
