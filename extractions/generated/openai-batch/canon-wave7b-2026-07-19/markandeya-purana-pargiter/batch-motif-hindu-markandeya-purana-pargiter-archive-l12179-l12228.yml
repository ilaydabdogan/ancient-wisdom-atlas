canonical_text:
  quote: ''
  summary: The passage describes the production of a mundane egg from Prakriti. The
    Soul within the egg takes the name Brahma, who is described as the first corporeal
    being and maker of created beings. The egg contains the three worlds, Meru, mountains,
    oceans, gods, demons, humans, lands, and luminous worlds. It is enclosed by elemental
    and cosmological coverings, and the passage explains relations among Brahma, Prakriti,
    Purusha/Soul, Mahat, Ahankara, and the Imperceptible.
  language: English
  quote_policy: summarized
