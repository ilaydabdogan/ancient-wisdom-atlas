canonical_text:
  quote: ''
  summary: Ruci, a Praja-pati living without household supports, is addressed by his
    forefathers, the Pitris. They urge him to take a wife, perform household rites,
    beget sons, and satisfy gods, ancestors, guests, and beings. Ruci objects that
    wedlock brings suffering and that self-control cleanses the soul. The Pitris answer
    that action and prescribed duties are necessary for knowledge and liberation,
    warn of downfall if he refuses, and then vanish.
  language: English
  quote_policy: summarized
