canonical_text:
  quote: ''
  summary: The passage opens Canto XLIX, describing an inquiry about Brahma's creation
    of human beings, social classes, qualities, and duties. The canto synopsis outlines
    a sequence from a primeval happy human race, to later humans falling from the
    sky and living in trees, to the rise of affection and covetousness, loss of trees,
    community formation, property, supplication to Brahma, creation of cereals and
    plants, and the ordaining of livelihoods, laws, castes, and postmortem spheres.
    The verses present Ki’anslituki asking Markandeya about human creation, and Markandeya
    saying that Brahma created a thousand human pairs from his mouth while meditating
    on truth.
  language: English
  quote_policy: summarized
