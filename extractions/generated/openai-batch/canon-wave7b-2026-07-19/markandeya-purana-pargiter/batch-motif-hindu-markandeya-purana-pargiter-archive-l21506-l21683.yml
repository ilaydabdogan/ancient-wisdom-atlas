canonical_text:
  quote: ''
  summary: Varuthini, an apsaras or heavenly maiden, urges a young brahman on a mountain
    to remain briefly and enjoy delights with her. The brahman refuses, citing brahmanical
    restraint, devotion to the household fires, his own wife, and the rule against
    coveting another's wife. After touching water, he prays to the Garhapatya fire
    to return home before sunset so that he will not miss Vedic rites. The Garhapatya
    Fire appears upon his body in a circle of light, and he reaches home immediately.
    Varuthini remains lovesick and disconsolate. A Gandharva named Kali, formerly
    rejected by her, observes her distress; the canto synopsis says he takes the brahman's
    guise and gains her love.
  language: English
  quote_policy: summarized
literal_observations:
