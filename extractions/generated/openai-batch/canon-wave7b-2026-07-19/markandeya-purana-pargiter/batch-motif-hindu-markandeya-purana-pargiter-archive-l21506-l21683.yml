  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The brahman, borne or surmounted by the Fire, departs while Varuthini watches
    him; he reaches his own abode in a moment and performs the rites he had mentioned.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the brahman's departure, Varuthini sighs, cries out, reproaches herself,
