  text: Varuthini asks the brahman whether she is dear to him, calls the mountain
    charming, and invites him to enjoy hard-to-win delights with her before returning
    to his own abode.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The brahman says he continually desires the Garhapatya and two other fires,
    finds the fire-place charming, mentions his wife, and asks Varuthini to tell him
    how he may go home.
  category: speech
  evidence_refs:
