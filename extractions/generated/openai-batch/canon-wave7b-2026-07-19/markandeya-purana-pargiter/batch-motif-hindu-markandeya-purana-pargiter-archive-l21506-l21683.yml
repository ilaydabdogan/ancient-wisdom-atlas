- id: obs:3
  text: Varuthini appeals to compassion, says she is full of affection and will not
    live if forsaken, and later argues that saving her will bring merit while refusing
    her will incur sin.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The brahman says striving after delights is not commended for brahmans and
