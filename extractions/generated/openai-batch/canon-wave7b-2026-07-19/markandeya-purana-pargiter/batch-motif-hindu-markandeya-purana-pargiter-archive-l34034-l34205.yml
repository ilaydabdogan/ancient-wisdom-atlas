canonical_text:
  quote: As is the rite that is to be performed, such is the thing one should offer.
  summary: Two deer ask a king seeking a son to kill them for a rite. The first deer
    offers itself because it has no son; the second offers itself because many offspring
    bring constant anxiety and because it argues that a proper offering should match
    the desired result. The deer discuss sacrifice, afterlife consequences, and suffering
    caused by offspring. The king resolves to seek a son without killing living beings,
    by austerities.
  language: English
  quote_policy: quoted
