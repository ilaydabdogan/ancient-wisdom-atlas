  summary: The passage lists places and behaviors in which harmful sprites or spirits
    take pleasure or enter humans. It names Kaka-jangha, who possesses certain men,
    and three female beings who steal breasts, puberty signs, or newborn children
    under specified ritual or domestic conditions. It also names Prachanda and describes
    numerous descendants called Likas and eight tribes of Chandalas, armed and hungry.
  language: English
