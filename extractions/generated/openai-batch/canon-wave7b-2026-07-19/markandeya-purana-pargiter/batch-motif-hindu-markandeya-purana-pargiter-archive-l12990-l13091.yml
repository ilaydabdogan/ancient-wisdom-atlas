canonical_text:
  quote: ''
  summary: The passage describes Prajapati's creation of paired human beings, their
    early mode of sexual pairing and nonordinary reproduction, a primordial condition
    of ease and equality, and a later decline marked by loss of prosperity, descent
    from the sky, reliance on kalpa trees, the rise of passion, menstruation, conception,
    and covetousness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The creator produces thousands of pairs from bodily regions including the
    breast, thighs, and feet, and these pairs are described with differing dominant
    qualities and dispositions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The paired living beings rejoice together and hasten to sexual intercourse;
    the passage says that pairing originated in this kalpa.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Women initially do not menstruate month by month and do not bear offspring
    despite intercourse; offspring are instead produced once near the close of life
    through meditation and thought.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The human race is said to have been produced by Prajapati and to pay homage
    to the world, rivers, lakes, seas, and mountains.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The early humans experience little cold or heat, and no opposition, enmity,
    or envy exists among them.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The early humans live without habitations, and the passage lists various beings
