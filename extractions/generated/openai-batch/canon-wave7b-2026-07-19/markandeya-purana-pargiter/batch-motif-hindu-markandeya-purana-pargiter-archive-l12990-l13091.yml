  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The human beings have lasting youth, produce offspring in pairs without resolve,
    share birth and form, and die together.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: All are equal in form and length of life, with no inferiority or superiority;
