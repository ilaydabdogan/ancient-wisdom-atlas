canonical_text:
  quote: ''
  summary: The constellation Revati falls around Mount Kumuda, illuminating its landscape
    and causing the mountain to become known as Raivataka. The constellation’s beauty
    becomes Lake Pankajini, from which a brilliant maiden is born. The muni Pramuca
    names her Revati and raises her near his hermitage. When she reaches youth, he
    seeks a suitable husband and asks Agni, who foretells that King Durgama will be
    her husband. Durgama soon arrives at the hermitage while hunting and addresses
    the maiden while looking for the muni.
  language: English
  quote_policy: summarized
