  summary: A fragment notes an Apsaras condemned by a muni to become a bird. The canto
    then invokes sacred figures before narration. Jaimini, disciple of Vyasa, approaches
    Markandeya, who is engaged in austerities and Vedic study, and praises Vyasa's
    Mahabharata as the foremost scripture containing knowledge of duty, wealth, love,
    and liberation. The passage uses images of Vedic mountains, streams, trees, a
    lake, lotus, geese, and water to describe the purifying and knowledge-bearing
    power of Vyasa's words and the Mahabharata.
