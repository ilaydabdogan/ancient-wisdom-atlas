- id: obs:2
  text: Dama says his father was aged, ascetic, observing a forest-dweller's vow,
    silent, unarmed, and dwelling with Indra-sena when Vapushmat seized his matted
    locks and killed him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Dama says Indra-sena charged him, reproached him, entered the fire, embraced
    Narishyanta, and departed to the abode of the thirty gods.
  category: speech
  evidence_refs:
