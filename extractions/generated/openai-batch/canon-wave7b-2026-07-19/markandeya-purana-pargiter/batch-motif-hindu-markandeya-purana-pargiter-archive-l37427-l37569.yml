canonical_text:
  quote: ''
  summary: Dama reacts to the killing of his father Narishyanta by Vapushmat. He consults
    ministers and a family priest, recounts his mother Indra-sena's charge and fire-entry,
    orders an army, marches south, receives Vapushmat's taunting challenge, and enters
    a fierce battle watched by supernatural beings. The canto synopsis also states
    that Dama kills Vapushmat and performs his father's obsequies with Vapushmat's
    flesh and blood.
  language: English
  quote_policy: summarized
