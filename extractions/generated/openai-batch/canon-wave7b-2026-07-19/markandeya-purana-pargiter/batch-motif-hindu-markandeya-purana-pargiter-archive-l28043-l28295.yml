canonical_text:
  quote: ''
  summary: A hymn praises Candika/Narayani as the goddess who constitutes all created
    things, abides as intelligence, acts through time, grants heaven and emancipation,
    gives refuge, embodies creation, permanence, and destruction, appears in many
    deity-forms with vehicles and weapons, protects devotees, and slays Daityas and
    Asuras by multiplying her body in many forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The goddess is praised as constituting every created thing and as bestowing
    Svarga and final emancipation from existence.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The goddess is said to abide in the heart of every living creature under the
    form of Intelligence.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The goddess is described as taking the form of minutes, moments, and other
    portions of time, bringing results to pass, and being mighty in the death of the
    universe.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The hymn addresses the goddess as beneficent, auspicious, a fulfiller of petitions,
    and a giver of refuge.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The goddess is called the energy of creation, permanence, and destruction.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The hymn lists forms associated with a swan-yoked heavenly car and kusa-grass-steeped
    water; a bull, trident, moon, and serpent; peacock, cock, and spear; and conch,
    discus, club, and bow.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A hog-like form uplifts the earth with tusks; a fierce man-lion form slays
    Daityas; Aindri takes away Vrtra’s life-breath; and Siva-duti slays mighty hosts
    of Daityas.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Camunda is described as having a tusked face, wearing a garland of heads,
    and grinding shaven heads.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The goddess is addressed through names and qualities including Lakshmi, Modesty,
    Wide-Knowledge, Faith, Nourishment, Svadha, Immoveable, Great-Night, Great-Illusion,
    Mental-Vigour, Sarasvati, Welfare, and Dark One.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The speakers ask the goddess to save them from terrors and ask her three-eyed
    countenance, flaming trident, bell, and scymitar to guard or benefit them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The hymn says the goddess destroys sicknesses when gratified, destroys longed-for
    desires when wrathful, prevents calamity for those who seek her, and makes such
    seekers into refuges themselves.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The slaughter of unrighteous Asuras is attributed to the goddess multiplying
    her body in many forms.
  category: action
  evidence_refs:
  - ev:7
