canonical_text:
  quote: ''
  summary: Indra announces that Hariś-candra, with his wife and son, has won heaven
    by his deeds. At the funeral pile, Indra pours nectar and flowers from the sky,
    and the king’s son rises restored. Hariś-candra refuses to ascend without addressing
    his obligation to the low outcaste master, whom Dharma then reveals as his own
    illusory descent. The king also refuses to abandon his grieving subjects and asks
    that the fruits of his merits be shared with them. Indra, Dharma, and Visvamitra
    consent; heavenly chariots arrive, the royal succession is established, and the
    people of Ayodhya ascend to heaven with the king. Śukra praises Hariś-candra’s
    patience and liberality.
  language: English
  quote_policy: summarized
