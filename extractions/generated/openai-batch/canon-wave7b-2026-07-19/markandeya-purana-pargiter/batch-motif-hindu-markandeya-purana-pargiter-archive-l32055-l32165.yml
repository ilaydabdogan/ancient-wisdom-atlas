canonical_text:
  quote: ''
  summary: The Sun grants Rajya-vardhana a boon of ten thousand years of youthful,
    sickness-free life. The people rejoice and tell the king, and Queen Manini congratulates
    him, but the king is troubled because he would outlive his queen, descendants,
    relatives, servants, friends, and those who performed austerities for him. He
    resolves to go to a mountain sanctuary, fast, and propitiate the Sun so that the
    same benefit may be granted to his people and loved ones; otherwise he will continue
    austerities until death. Manini agrees and accompanies him.
  language: English
  quote_policy: summarized
