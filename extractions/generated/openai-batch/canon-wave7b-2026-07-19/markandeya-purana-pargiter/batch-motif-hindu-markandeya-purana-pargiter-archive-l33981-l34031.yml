canonical_text:
  quote: "“Like unto Khaninetra there will be no other sacrificer on earth.”"
  summary: The passage introduces Khaninetra, son of Vivimsa, as an extraordinary
    sacrificer. Gandharvas praise his sacrifices; he performs vast numbers of sacrifices,
    gives away the earth and wealth to brahmans, and later, being sonless, hunts alone
    in a forest to obtain deer flesh for a sacrifice to the pitṛs in order to gain
    a son. The canto summary says two deer, one childless and one with many offspring,
    each asks to be killed, but the king refuses to kill either.
  language: English
