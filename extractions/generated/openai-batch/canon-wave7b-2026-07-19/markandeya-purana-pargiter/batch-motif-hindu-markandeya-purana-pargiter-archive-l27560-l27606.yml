canonical_text:
  quote: ''
  summary: In a battle, several female divine Energies or Mothers attack Daityas,
    Danavas, Asuras, and other demons using weapons, water, animal features, laughter,
    and devouring. Rakta-vija enters the battle; whenever drops of his blood fall
    to the earth, Asuras like him arise. After Indra’s Energy strikes him, more blood-born
    combatants arise and fight the Mothers.
  language: English
