canonical_text:
  quote: ''
  summary: 'The passage states marriage-order rules for caste status: first marrying
    within one''s own caste preserves standing in a later mixed marriage, while neglecting
    union in one''s own caste and marrying an excluded woman causes the man to participate
    in that woman''s caste. The rule is applied to the addressee''s son, who is said
    to have fallen to vaisya-hood and to lack the right to fight the kshatriya addressee;
    the speakers urge cessation of battle.'
  language: English
  quote_policy: summarized
