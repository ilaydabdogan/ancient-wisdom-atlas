canonical_text:
  quote: ''
  summary: A son explains to his father that he remembers many past conditions in
    mundane existence, rejects ritual sufficiency in favor of liberating knowledge,
    and seeks the Supreme Soul so as not to be born again. He recounts a former birth
    as a brahman devoted to the Supreme Being and then describes the process of death,
    the effects of gifts and moral conduct at death, and the approach of Yama’s officers
    to a false man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The son says he has repeatedly been servant, slave, master, lord, poor man,
    giver and receiver of blows, giver and receiver of gifts, and one who experienced
    both family-related joy and tearful misery.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The son says that while wandering in the crowded circle of mundane existence
    he gained knowledge that procures final emancipation from existence.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The son states that the body of ritual rites called Ric, Yajus, and Saman
    is worthless to him, and that he will seek the highest seat, the Supreme Soul.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The son describes mundane existence as a series of pains, tainted by emotional
    states and old age, and hampered by hundreds of nooses ensnaring the self.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father asks how the son’s wisdom arose, why stupidity was present before,
    why awakening has occurred now, and whether a Muni or god caused a curse-wrought
    change.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The son says he was formerly a brahman whose soul was fixed on the Supreme
    Being, who was continually occupied in devotion, study, association with the good,
    deliberation, behavior, and purification.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The son says he became a spiritual guide who removed disciples’ doubts, attained
    absolute perfection, and then fell into calamity through ignorance and carelessness.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The son says he retained memory from the time of departure until a year had
    passed, when recollection of his births returned.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The son says he will keep his organs under control and use his former study
    so that he may not have another existence.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The son says remembrance of existences is the result of learning and liberality
    and is not obtained by men who apply themselves to the duty enjoined by the three
    Vedas.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The son begins an account of the circle of mundane existence from the period
    of departure, saying no one else will tell it to the father.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The son describes hot moisture being excited in the body, moved by strong
    vital air, blazing without fuel, and piercing the sites of the vital organs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The son says the vital air called Udana passes upward and impedes the downward
    course of consumed water and food.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The son says that persons who gave water, food, and drink, or gave food with
    faith, obtain joy or satisfaction at the time of adversity or death.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The son says truthful, faithful, god- and brahman-worshipping, unspiteful,
    fair, charitable, shamefast, gentle, and promise-keeping persons meet a happy
    death.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: The son says those who do not give water or food endure burning thirst and
    hunger at death.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: The son says gifts of fuel and sandal are associated with overcoming cold
    and heat, and non-injury with overcoming the painful life-ending pang.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:18
  text: The son says those who cause error and ignorance suffer terror, and false
    witnesses, liars, evil teachers, and blasphemers of the Vedas die in delusion.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:19
  text: Yama’s officers are described as terrific, foul-smelling, hard-hearted, and
    carrying hammers and maces as they approach the false man.
  category: action
  evidence_refs:
  - ev:8
- id: obs:20
  text: When Yama’s officers meet the false man’s eyesight, he trembles, bewails his
    relatives, and experiences changes in voice, sight, and mouth.
  category: sequence
  evidence_refs:
  - ev:8
