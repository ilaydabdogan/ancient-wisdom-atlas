canonical_text:
  quote: ''
  summary: Markandeya introduces the third manvantara of Prajapati Auttama, names
    groups of gods, describes their lord Su-santi and a name-song used to avert portents,
    recounts the status of Auttama Manu's sons, descendants, and seven rishis, and
    then introduces the fourth manvantara of Manu Tamasa, said to be born from an
    animal womb.
  language: English
  quote_policy: summarized
