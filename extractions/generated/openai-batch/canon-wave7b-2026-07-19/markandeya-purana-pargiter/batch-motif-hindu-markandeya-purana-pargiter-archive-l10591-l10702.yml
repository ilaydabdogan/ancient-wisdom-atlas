canonical_text:
  quote: ''
  summary: A didactic passage instructs Alarka on yoga practice, especially pranayama.
    It describes conquering the self, burning away faults through breath restraint
    and related disciplines, measuring three intensities of pranayama, taming the
    breath through animal analogies, four conditions that lead toward final emancipation,
    and seated practice with Om, sensory restraint, nose-tip gaze, and withdrawal
    of desires like a tortoise withdrawing its limbs.
