canonical_text:
  quote: ''
  summary: Hariś-candra laments the loss of his kingdom, friends, wife, and son, then
    serves a c'andala by collecting garments and fees from corpses at the Benares
    burning-ground. The passage gives an extended description of the cremation ground
    as filled with animals, spirits, ashes, bones, burning corpses, mourners' cries,
    and a hell-like atmosphere. The king arrives there grieving, filthy, carrying
    a flag and club, and is described as entering another birth while still alive.
  language: English
  quote_policy: summarized
