canonical_text:
  quote: ''
  summary: 'A rishi explains why the ritual arghya was withheld from King Uttama:
    despite royal lineage, he is judged unfit because he abandoned his wife and neglected
    righteousness. The king accepts the rebuke and asks about the brahman''s abducted
    wife. The rishi identifies her captor as the Rakshasa Valaka, son of Adri, says
    she is in Utpalavataka forest, and orders the king to reunite her with the brahman.'
  language: English
  quote_policy: summarized
