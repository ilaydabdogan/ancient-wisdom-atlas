canonical_text:
  quote: ''
  summary: Jaimini asks Markandeya several difficult questions concerning Vasudeva,
    Drupada’s daughter Krishna, Baladeva, and the sons of Draupadi. Markandeya says
    he cannot give a long discourse because the time for religious rites has arrived,
    and directs Jaimini to four learned birds, the sons of Drona, who dwell in a cave
    in the Vindhya mountains and can resolve his doubts. Jaimini expresses astonishment
    that birds have acquired such difficult knowledge.
  language: English
