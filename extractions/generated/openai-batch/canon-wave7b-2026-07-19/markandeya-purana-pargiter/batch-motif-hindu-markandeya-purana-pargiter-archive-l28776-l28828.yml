  quote: ''
  summary: 'The passage gives rosters for future Manvantaras: a future Manu with a
    hundred gods and sons, Indra Santi, seven rishis, and named sons; the period of
    Dharma''s son Savarna with three groups of gods presiding over divisions of time,
    Indra Vrisha, seven rishis, and sons called kings; and the beginning of a roster
    for the twelfth Manvantara of Rudra''s son Savarna.'
