canonical_text:
  quote: ''
  summary: The passage introduces Canto XLVIII, titled as an account of the course
    of creation. It summarizes Markandeya's narration of how Brahma created various
    classes of beings, time periods, animals, sacred hymns and metres, atmospheric
    phenomena, and then assigned forms, pursuits, and names. It opens with Kraushtuki
    asking the brahman to explain fully the origin of the gods. A note identifies
    a creation involving Nilalohita Rudra, Sanatkumara, and other mind-born sons of
    Brahma, and explains the terms prakrita and vaikrita.
  language: English
  quote_policy: summarized
