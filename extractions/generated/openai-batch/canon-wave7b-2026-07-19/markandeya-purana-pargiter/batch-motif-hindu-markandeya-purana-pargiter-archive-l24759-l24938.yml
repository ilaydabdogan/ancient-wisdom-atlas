canonical_text:
  quote: ''
  summary: The passage narrates Sanjna, wife of the Sun, bearing Manu, Yama, and Yamuna;
    her fear and inability to bear the Sun's splendour; her creation of a shadow substitute;
    her departure to her father and then to the Northern Kurus in mare form; the Sun's
    life with the shadow substitute; Yama's conflict with the substitute mother; and
    the Sun's discovery of the substitution.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sun Martanda is married to Sanjna, daughter of Visva-karman, and begets
    Manu Vaivasvata with her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Sanjna shuts her eyes and later shows agitated glances before the Sun,
    the Sun speaks sharply and declares that she will bear Yama and a daughter identified
    with a river.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Yama and Yamuna are born from Sanjna after the Sun's declarations.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sanjna suffers from the Sun's splendour and asks where she can go to find
    ease.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sanjna fashions her own body in shadow-form and instructs the shadow-self
    to remain in the Sun's house as Sanjna and to behave properly toward the Sun and
    the children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The shadow-self agrees to obey Sanjna's order and to maintain the assumed
    identity until severe pressure such as hair-seizing or curses.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sanjna goes to her father's abode, is honored there, and is later admonished
    by her father to return to her husband's house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After saluting her father, Sanjna goes to the Northern Kurus, dislikes and
    fears the Sun's heat and splendour, practices austerities, and is changed into
    a mare's shape.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Sun mistakes the shadow-form for Sanjna and begets two sons and a daughter
    with her.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Yama becomes angry at the shadow substitute's conduct, raises his foot as
    if to kick her, but does not strike her body.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Shadow-Sanjna curses Yama's foot to fall to the earth, and Yama appeals to
    his father about a mother cursing her son.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Sun questions Shadow-Sanjna; she first claims to be Sanjna, but under
