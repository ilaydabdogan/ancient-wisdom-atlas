canonical_text:
  quote: ''
  summary: In this battle passage, Candika/Ambika/Durga fights Nisumbha and Shumbha.
    Nisumbha is pierced in the heart; another powerful man emerges from him and is
    beheaded. The lion, Kali, Siva-duti, and several divine Energies destroy Asuras.
    Shumbha accuses Durga of relying on other goddesses; she declares that she alone
    exists and that the other goddesses derive power from her, whereupon they are
    absorbed into her. Ambika then fights Shumbha alone, disarming him repeatedly;
    he falls, rises, seizes her, and carries her upward into the sky as the passage
    breaks off.
  language: English
