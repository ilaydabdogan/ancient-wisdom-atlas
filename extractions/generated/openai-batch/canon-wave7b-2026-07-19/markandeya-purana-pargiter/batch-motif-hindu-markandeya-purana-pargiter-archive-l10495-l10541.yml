  summary: The passage presents an instruction that learning and association with
    the good cut down selfishness and lead along a path to religious knowledge and
    emancipation. An unnamed speaker teaches the king that body and soul are distinct,
    comparing their coexistence to separate beings or objects dwelling together. Alarka
    then says sublime knowledge has been revealed to him but asks the brahman to teach
    yoga so he may be delivered from Nature’s bonds and attain oneness with Brahma.
