  quote: ''
  summary: A different ending according to the Calcutta edition is introduced. Markandeya
    narrates that after King Dama spoke, his father's enemy fled; Dama says his father
    was an ascetic and that others may practise austerities fearlessly, and he does
    not address those fleeing. Markandeya then praises the story as righteous and
    as bestowing heaven and final emancipation on its hearer. An editorial note says
    the narrative ends abruptly and that the following ending corresponds to earlier
    verses in the edition.
