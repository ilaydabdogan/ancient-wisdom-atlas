  summary: After Rita-dhvaja is inaugurated as king and rules protectively, Madalasa
    gives birth to her first son. The father names the child Vi-kranta. Madalasa laughs
    and addresses the crying infant with a philosophical teaching about the five-element
    body, impermanence, karma, attachment to relations and property, and the mistaken
    pursuit of pleasure.
