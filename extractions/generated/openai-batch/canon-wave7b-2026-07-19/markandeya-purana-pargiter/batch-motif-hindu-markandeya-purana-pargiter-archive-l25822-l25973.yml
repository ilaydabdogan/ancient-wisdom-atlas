canonical_text:
  quote: ''
  summary: The energies of the gods unite into a radiant female goddess, whose body
    is formed from the powers of named deities. The gods, afflicted by Mahisha, give
    her weapons, ornaments, armor, a lion mount, and other gifts. She roars so that
    the worlds, seas, earth, and mountains shake. The gods and munis praise her and
    urge her to conquer. Mahisha and the Asura armies advance toward the roar, see
    the vast thousand-armed goddess, and battle begins; Chandika cuts down their weapons
    with ease.
  language: English
  quote_policy: summarized
