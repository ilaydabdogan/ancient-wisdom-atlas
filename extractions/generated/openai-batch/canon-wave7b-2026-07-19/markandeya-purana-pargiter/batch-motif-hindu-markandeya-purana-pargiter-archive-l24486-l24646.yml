canonical_text:
  quote: Which of my mothers shall I praise, her who gave me birth or her who has
    nourished me ?
  summary: Markandeya introduces the sixth Manu, Cakshusha. As a newborn who remembers
    prior existences, the child laughs and speaks to his mother about a cat, a child-seizing
    hag, and the self-interest behind attachment. After the mother leaves, Jata-harini
    steals and substitutes newborns among royal and brahman households. Later, as
    the youth Ananda, he questions which mother he should honor and reflects on the
    instability of kinship.
  language: English
  quote_policy: quoted
