canonical_text:
  quote: ''
  summary: The passage narrates how the Apsaras Vapu volunteers to disturb the austerities
    of the Muni Durvasas, goes to his mountain hermitage, and sings. Durvasas recognizes
    her purpose and curses her to lose her own form, be born among birds for sixteen
    years, bear four sons, die in battle, and regain her heavenly dwelling. The passage
    then opens the next canto with a synopsis of the birth of the birds and begins
    a genealogy of bird-kings leading to Kanka and Kandhara, followed by Kanka’s encounter
    with the Rakshasa Vidyud-rupa on Kailasa.
  language: English
  quote_policy: summarized
