canonical_text:
  quote: ''
  summary: The Birds explain that Indra’s splendor, might, and beauty left him after
    wrongful acts and entered other divine recipients. Tvashtri creates Vritra from
    a sacrificed lock of hair; Indra later slays Vritra after a treaty. Daityas and
    Danavas are born among human kings and burden the Earth, who appeals to the gods
    on Meru. The gods descend with portions of divine glory to earth, producing the
    Pandavas as forms or portions of Indra and allied deities, while Indra’s wife
    is born as Krishna/Draupadi from Agni and becomes wife to the five Pandavas.
  language: English
  quote_policy: summarized
