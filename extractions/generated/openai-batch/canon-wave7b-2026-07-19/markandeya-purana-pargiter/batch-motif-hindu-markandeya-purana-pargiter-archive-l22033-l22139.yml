canonical_text:
  quote: ''
  summary: Two maidens, Vibhavari and Kalavati, address Svarocis. Vibhavari offers
    herself and a knowledge that reveals the utterances of all created beings. Kalavati
    recounts her birth from the brahmarshi Para and the Apsaras Punjikasthala, her
    abandonment in a dangerous forest, her nourishment by the waxing moon, her father’s
    death after refusing a Gandharva suitor, and Sati’s intervention and prophecy
    that Svarocis will be her husband and that their son will be a Manu. Kalavati
    offers Svarocis herself and Padmini knowledge. Svarocis accepts and marries both
    maidens while heavenly instruments sound and Apsarases dance.
  language: English
  quote_policy: summarized
