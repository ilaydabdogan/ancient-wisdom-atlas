canonical_text:
  quote: ''
  summary: In a dreamlike ordeal, the king is summoned and forced before Yama, who
    speaks of Visvamitra’s anger and sends him back to the world of men to finish
    his suffering. He falls from the sky, wakes in fear, prays to the gods, and works
    among pukkasas in a burning-ground fixing corpse prices. His queen arrives with
    their dead snake-bitten son, but the altered king and queen do not recognize one
    another; the sight of the child makes the king remember Rohitasya.
  language: English
  quote_policy: summarized
