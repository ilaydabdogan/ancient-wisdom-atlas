canonical_text:
  quote: ''
  summary: Ruci, troubled by his forefathers’ counsel and unable to find a maiden,
    resolves to propitiate Brahma through austerities. After long self-mortification,
    Brahma appears, promises that Ruci will become a Prajapati, create human folk,
    beget sons, perform ceremonies, and later attain felicity. Brahma instructs him
    to take a wife as his forefathers enjoined and to worship the Pitris, who can
    grant the desired wife and sons. Ruci then worships the Pitris on a river sand-bank
    with a hymn praising them as recipients of sraddha offerings from gods, sages,
    human groups, Asuras, Nagas, and Serpents across multiple realms.
  language: English
  quote_policy: summarized
