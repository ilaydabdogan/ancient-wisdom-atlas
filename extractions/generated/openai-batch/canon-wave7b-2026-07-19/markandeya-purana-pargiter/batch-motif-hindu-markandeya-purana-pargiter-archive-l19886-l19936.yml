  quote: ''
  summary: The passage opens a catalogue of peoples or regions associated with the
    “outer foot,” glossed in the notes as the right hind foot. The translator’s notes
    flag regional confusion, give etymological suggestions for names such as Badava-mukha
    and Vanita-mukha, and relate some names to genealogical or narrative traditions
    involving Anarta, Saryati/Saryata, Cyavana, and Su-kanya.
  language: English
  quote_policy: summarized
