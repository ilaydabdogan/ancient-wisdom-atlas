- id: obs:2
  text: The verses list multiple peoples or regions, including Kanihojas, Pahlavas,
    Badava-mukhas, Sindhus, Sanviras, Anartas, Vanita-mukhas, Dravanas, Sargigas,
    Sudras, and Karna-pradhejas.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The translator states that the names following the “outer foot” are confused
    and belong to western and north-western regions rather than fitting neatly in
