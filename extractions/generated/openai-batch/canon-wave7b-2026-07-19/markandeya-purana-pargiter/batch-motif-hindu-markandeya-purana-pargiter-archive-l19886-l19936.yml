  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Vanita-mukhas are glossed as “those who have faces like women,” while
    the translator treats the expression as a proper name rather than merely an adjective.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: For Sargigas or Argigas, the translator suggests possible correction to Saryatas
    and summarizes a story in which Saryata settled near the rishi Cyavana and gave
    his daughter Su-kanya to him to appease his wrath.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The note places the Saryatas in the West, especially Gujarat, and says Cyavana
    as a Bhargava is placed near the mouths of the Narbada and Tapti.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The translator says the name Karna-pradhejas is not found elsewhere by him
