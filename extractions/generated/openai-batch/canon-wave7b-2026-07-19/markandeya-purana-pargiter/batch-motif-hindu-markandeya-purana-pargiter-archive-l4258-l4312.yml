canonical_text:
  quote: ''
  summary: The passage explains that pleasures and pains arise from good and bad actions.
    Sins produce various bodily afflictions and worldly harms; good deeds produce
    pleasant sensory experiences. Virtue and sin are diminished by being consumed
    through pleasure or pain. Hell and Svarga are named as realms where sins and virtues
    are respectively worked off, and the speaker begins to answer the king’s question
    about which sins lead to particular tortures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sins are said to produce pains such as injury from a thorn, pins, wedges,
    headaches, effects of unwholesome food, cold, heat, fatigue, inflammation, and
    consequences involving weapons, fire, calamity, pain, and imprisonment.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A trifling good deed is said to confer pleasing fragrance, touch, sound, taste,
    or shape; pleasures and pains are said to arise from good and bad actions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person is described as consuming the products of many mundane existences,
    and the results of knowledge or ignorance are said to be checked by race and country
    and attached by outward sign to the soul.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: No person is said to exist who does not perform a wicked or holy act in body,
    mind, or speech.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Pain or pleasure is said to change the mind, and virtue or sin is said to
    diminish gradually by consumption, like food that is being eaten.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Men dwelling in hell are said to diminish awful heinous sins through torments
    day and night.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Svarga, virtues are said to be consumed in the company of immortals, with
    songs and other joys of Gandharvas, Siddhas, and Apsarases.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The conditions of god, human being, and brute creature are named as states
    in which good or evil is consumed through pleasure or pain.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The king asks which sins cause the tortures of wicked-doers, and the speaker
    says he will declare this in full detail.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Vile covetous men are described as having gazed on others’ wives and others’
    goods with an evil eye and evil mind; birds are then introduced at the end of
    the passage.
  category: action
  evidence_refs:
  - ev:5
