canonical_text:
  quote: ''
  summary: The prince defeats Danavas in Patala with a fiery weapon, returns on horseback
    with Madalasa to his father's city, reports the underworld journey and battle,
    receives paternal praise for surpassing ancestral fame, and then lives joyfully
    with his wife.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The surface of Patala is described as covered with swords, lances, spears,
    and arrows that were split by multitudes of Rita-dhvaja's arrows.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prince takes up and hurls Tvashtri's weapon against the Danavas.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Danavas together with Patala-ketu are turned into heaps of bones by excessive
    heat from blazing rings of fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The fiery destruction is compared to the oceans being burnt when the fire
    of Kapila fell on them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: After slaying the chiefs of the Asuras, the prince returns seated on horseback
    to his father's city with the woman.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The prince prostrates before his father and recounts the visit to Patala,
    meetings with Kundala and Madalasa, the conflict with the Danavas, their slaughter
    by the weapon, and the return.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The father embraces his son and says the son has delivered him and saved the
    Munis who follow true religion from fear.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The father distinguishes ordinary, great, and base men according to whether
    they preserve, exceed, or diminish their father's glory, wealth, and heroism.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The father states that the son's visit to Patala and destruction of the Asuras
    exceed the father's own accomplishment.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The father blesses the son with riches, heroism, and happiness, and says that
    the daughter of the Gandharva should never be parted from him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: After being embraced, the son is permitted to depart with his wife to his
    own residence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The couple live joyfully in the father's city and also in gardens, woods,
