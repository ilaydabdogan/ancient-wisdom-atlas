canonical_text:
  quote: ''
  summary: A summoned Rakshasa brings the queen back to the king. The queen asks the
    king to help a Naga friend who was cursed with dumbness. A brahman performs a
    sacrifice to Sarasvati, and the Naga maiden recovers speech. In gratitude she
    blesses the king with a powerful son who will become a Manu. The son is later
    born with auspicious signs and named Auttama by assembled munis. The narrator
    states benefits for those who hear or read the story.
  language: English
  quote_policy: summarized
