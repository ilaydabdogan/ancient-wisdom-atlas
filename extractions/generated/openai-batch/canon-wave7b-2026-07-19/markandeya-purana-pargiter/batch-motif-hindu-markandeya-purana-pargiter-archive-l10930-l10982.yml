canonical_text:
  quote: ''
  summary: The passage describes ailments that destroy religious meditation and cause
    divine-origin beings to revolve again and again. It then instructs a yogi to meditate
    on supreme Brahma, eat sparingly, subdue the senses, contemplate subtle conditions
    of objects such as earth, water, fire, wind, and sky, comprehend and relinquish
    these subtleties, avoid attachment to created things, and thereby proceed toward
    supreme bliss and final emancipation.
