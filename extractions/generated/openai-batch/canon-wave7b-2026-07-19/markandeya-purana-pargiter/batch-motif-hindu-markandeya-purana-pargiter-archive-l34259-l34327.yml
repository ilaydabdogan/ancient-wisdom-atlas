canonical_text:
  quote: "“there went forth in hundreds warriors accompanied by chariots, elephants
    and horses.”"
  summary: Balasva subdues other kings and receives tribute, but those kings rebel,
    seize his territory, and besiege his city. In distress, the king sighs with his
    hands before his face; from the breath issuing between his hands a large force
    of warriors with chariots, elephants, and horses appears. With this host he defeats
    the besieging kings, restores their tribute, receives the name Karandhama, and
    is said to be granted destruction of his enemies by Power.
  language: English
  quote_policy: quoted
