canonical_text:
  quote: ''
  summary: The passage opens Canto XX, introducing king S'atru-jit, his accomplished
    son Rita-dhvaja, and the prince's close friendship with two young Naga princes
    who visit the earth in brahman guise and return at night to Rasatala. Their father
    asks about their affection in the mortal world, and the sons identify and praise
    Rita-dhvaja. The canto heading also previews the prince setting out to aid the
    brahman Galava against a Daitya with the wondrous horse Kuvalaya.
  language: English
