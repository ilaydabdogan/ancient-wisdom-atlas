canonical_text:
  quote: "“all this tributary earth with its seven continents, with its mountains,
    and with its oceans was peopled”"
  summary: Krauṣṭuki asks Mārkaṇḍeya about the Svāyambhuva Manvantara. Mārkaṇḍeya
    gives its duration, names past, present, and future Manus, and describes how Svāyambhuva’s
    descendants, especially Priya-vrata and his sons, populated and divided the seven
    continents among rulers and their descendants.
  language: English
  quote_policy: quoted
