canonical_text:
  quote: ''
  summary: In Canto VIII, after Kausika/Visvamitra departs with money, king Haris-candra
    offers himself for sale as a slave. Dharma appears in the form of a c'andala named
    Pravira, asks to buy him, and identifies himself as an executioner and gatherer
    from corpses. Haris-candra resists slavery to a c'andala, citing his Solar race
    and preferring the fire of a curse. Visvamitra arrives, demands the sacrificial
    fee, threatens a curse, and gives the king to the c'andala for a large sum. The
    c'andala pays Visvamitra, binds and strikes the king, and leads him away to his
    town.
  language: English
  quote_policy: summarized
