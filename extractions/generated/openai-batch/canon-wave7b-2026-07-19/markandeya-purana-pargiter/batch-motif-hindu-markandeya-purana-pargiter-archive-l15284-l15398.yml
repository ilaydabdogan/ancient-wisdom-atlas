canonical_text:
  quote: ''
  summary: 'Markandeya describes the geography of Jambu-dvipa around Meru: cardinal
    forests, lakes, and mountains; paradise-like valleys and abodes of heavenly beings;
    the earth as a four-leaved lotus; and Bharata as the sole land where action produces
    merit and sin, leading to different destinies.'
  language: English
  quote_policy: summarized
