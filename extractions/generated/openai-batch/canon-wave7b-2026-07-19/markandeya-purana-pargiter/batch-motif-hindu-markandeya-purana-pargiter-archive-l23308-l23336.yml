canonical_text:
  quote: ''
  summary: The canto begins an account of King Uttama after he has sent a woman to
    her husband’s house. He wonders about the value of the act, recalls statements
    by a muni and a night-roaming demon concerning ritual unfitness and an impaired
    condition, thinks of his abandoned wife, and goes by chariot to consult a knowledgeable
    muni. The canto synopsis also states that Uttama learns his queen has been taken
    to Patala by a Naga king, that the Naga king curses his daughter for hiding the
    queen, and that adverse planetary influence caused the king’s unhappy married
    life.
  language: English
  quote_policy: summarized
