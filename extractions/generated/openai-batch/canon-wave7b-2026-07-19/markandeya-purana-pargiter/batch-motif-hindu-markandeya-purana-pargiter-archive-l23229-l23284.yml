canonical_text:
  quote: ''
  summary: King Uttama, troubled by comments about a brahman’s impaired condition
    and by his own wifeless state, receives the respectful submission of a Rakshasa.
    The king commands the Rakshasa to consume the evil disposition of a brahman woman
    and return her to her husband. The Rakshasa enters her through illusion and devours
    that disposition. Freed from it, the woman says her separation from her husband
    resulted from the fruit of her own past actions, while the demon had been the
    immediate cause.
  language: English
  quote_policy: summarized
