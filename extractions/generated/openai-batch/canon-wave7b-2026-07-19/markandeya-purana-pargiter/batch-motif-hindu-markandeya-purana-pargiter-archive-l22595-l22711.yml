canonical_text:
  quote: ''
  summary: A section describes several named Nidhis and the dispositions, occupations,
    possessions, relationships, and lines of descent associated with men upon whom
    those Nidhis look or with whom they are united. The named Nidhis in this passage
    include Makara, Kacchapa, Mukunda, Nanda, and Nila, each characterized by qualities
    such as darkness, passion, or goodness mixed with passion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening fragment says a Nidhi comes only from prior good fortune and does
    not depart for seven generations.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Makara is a Nidhi composed of darkness; a man on whom Makara looks is described
    as chiefly characterized by ignorance while good in disposition.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The man affected by Makara gathers arrows, swords, spears, bows, shields,
    and rope, associates with kings occupied with heroic deeds, gives to kings and
    those they esteem, and delights in buying and selling weapons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Makara belongs to a single man and does not descend to his progeny; such a
    man may die for wealth at the hands of robbers or in battle.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kacchapa is a Nidhi characterized by darkness; a man on whom Kacchapa casts
    his eye is dominated by ignorance and performs rules of life with meritorious
    men as mere acts.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Kacchapa-affected man confides in no one; his inward withdrawal is compared
    to a tortoise drawing in its limbs, and he neither gives nor enjoys because of
    fear of destruction.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The man affected by Kacchapa makes his resting-place on the earth, and that
    Nidhi is also limited to individual men.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Mukunda is a Nidhi composed of passion; the man on whom Mukunda looks becomes
    of the same quality.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Mukunda-affected man gathers lutes, flutes, drums, and percussion instruments,
    gives wealth to singers, dancers, minstrels, bards, sycophants, and those skilled
    in drama, enjoys with those companions, avoids women of loose character, and forms
    a single union.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Nanda is a great Nidhi composed of passion and darkness; a man on whom Nanda
    looks gains firmness, gathers minerals, precious stones, trade wares, grain, and
    other articles, buys and sells them, and supports his family, visitors, and guests.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Nanda-affected man does not endure even slight disrespect, responds strongly
    to praise, uses tenderness to obtain desired objects, and has many prolific and
    very beautiful wives.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Nanda passes down to seven generations and, when strongly developed, passes
    an eighth portion to the next descendant; he bestows long life, supports kinsmen
    and distant guests, is not honored in the next world, and changes patterns of
    affection and friendship.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Nila is a great Nidhi containing goodness and passion; a man united with Nila
    may become of that disposition.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Nila leads a man to collect clothing, cotton cloth, grain, fruits, flowers,
    pearls, coral, shells, timber, other materials, and things produced in water,
    to buy and sell things, and to construct ponds.
  category: action
  evidence_refs:
  - ev:6
