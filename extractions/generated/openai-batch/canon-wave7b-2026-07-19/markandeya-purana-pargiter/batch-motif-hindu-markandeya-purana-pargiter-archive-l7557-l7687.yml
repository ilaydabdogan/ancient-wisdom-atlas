canonical_text:
  quote: ''
  summary: Kuvalayasva, a mortal guest in the Naga king Asvatara's house, asks that
    righteousness remain in his heart rather than receiving wealth or pleasures. Asvatara
    affirms him but insists he accept something hard to gain. The Naga king's sons
    reveal that Kuvalayasva longs for his wife Madalasa, daughter of a Gandharva king,
    who abandoned life after being deceived by a cruel Danava into thinking he had
    been killed; the prince had vowed to take no other wife. Asvatara presents Madalasa
    as an illusion and warns the prince not to touch her. The prince faints, and Asvatara
    revives him, tells of her recovery from death, and sends him home with her.
  language: English
  quote_policy: summarized
