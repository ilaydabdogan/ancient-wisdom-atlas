canonical_text:
  quote: ''
  summary: Aditi asks the Sun to help her sons regain sacrificial shares and dominion.
    The Sun promises to be born in her womb with his thousand portions and destroy
    their foes. A solar ray becomes incarnate in Aditi; after austerities and a dispute
    with Kasyapa about the womb-egg, she gives birth to a brilliant child. The child
    reveals himself from the foetal egg, and an incorporeal voice names him Marttanda
    and declares that he will wield the Sun’s sway and slay the Asuras. In battle,
    Marttanda’s splendor burns the Asuras to ashes, after which the gods recover their
    dominions and sacrificial shares, and the Sun assumes a moderated fiery body.
  language: English
  quote_policy: summarized
