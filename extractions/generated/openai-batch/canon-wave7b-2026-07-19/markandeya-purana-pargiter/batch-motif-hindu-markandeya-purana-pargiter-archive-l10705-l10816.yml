literal_observations:
- id: obs:1
  text: A steady mental abstraction is identified with twelve pranayamas, and two
    kinds of dharana are said to be known among devotees conversant with truth.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A devotee steeped in devotion and controlling his soul has his faults perish
    and sees supreme Brahma, the qualities of Nature, the sky, primordial atoms, and
    the unsullied soul separately.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A devotee restricting food and breath is instructed to occupy thoroughly and
    gradually reclaimed ground and to avoid unreclaimed ground, which is said to increase
    faults, diseases, and foolishness.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pranayama is explained as restriction of breath, dharana as abstraction of
    the mind, and pratyahara as restraining the organs occupied with words and other
    actions.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: Paramarshis who were religious devotees are said to declare a gradual means
    so that diseases and faults do not arise; the method is compared to thirsty people
    drinking water gradually, while the devotee drinks air.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Mental abstraction is listed in a sequence of loci: navel, heart, breast,
    neck, mouth, tip of the nose, eye, eyebrows, middle of the head, and what is beyond.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Attaining the ten mental abstractions is said to bring the practitioner to
    equality with the imperishable.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: The yogi is told to practice respectfully, without being puffed up, hungry,
    wearied, or disturbed in mind.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The ascetic is told not to practice yoga when it is too cold or warm, when
    there is strife, or when it is windy.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage lists unsuitable places for yoga practice, including places of
    noise, fire, water, study, a decayed cow-shed, crossroads, dry leaves, a river,
    a burning-ground, a place infested by snakes, a fearful place, a well-edge, funeral
    piles, and ant-hills.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: Disregarding the unsuitable places and practicing yoga in ignorance is said
    to bring faults and evils such as deafness, stupidity, failure of memory, dumbness,
    blindness, and fever.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: If faults arise, yogis are instructed to cure them through mental abstraction
    after eating warm rice-gruel with oil, by regulating bodily wind through diet,
    and by specific meditations such as mountain for tremor, speech for dumbness,
    and ear for deafness.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage also recommends remedying disorders by thinking steadily of an
    appropriate counter-thought, such as a cooling thought in heat and a heating thought
    in cold.
  category: action
  evidence_refs:
  - ev:6
