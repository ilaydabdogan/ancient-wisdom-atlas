canonical_text:
  quote: ''
  summary: A discourse on destiny and fear of death cites Indra's thunderbolt and
    the fated deaths of demon groups, then applies the teaching to young birds who
    survived a superhuman battle. The speaker wonders at the eggs, a fallen bell,
    and a ground covered with flesh, fat, and blood, concluding that the birds are
    not ordinary. He orders young ascetics to take the birds to a safe hermitage,
    teaches that creatures are destroyed or preserved by their own actions while human
    effort is still praiseworthy, and the ascetics carry the birds away. A dvija then
    performs Vedic ceremonies to a list of deities with gathered wild materials.
  language: English
  quote_policy: summarized
