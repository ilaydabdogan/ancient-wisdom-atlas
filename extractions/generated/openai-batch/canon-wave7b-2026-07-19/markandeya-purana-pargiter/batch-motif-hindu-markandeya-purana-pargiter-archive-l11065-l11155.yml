canonical_text:
  quote: "“disrespect is ambrosia, but respect is a dire poison.”"
  summary: Alarka asks Dattatreya to explain a yogi’s religious course on the way
    to Brahma. Dattatreya describes the yogi’s attitude toward respect and disrespect,
    rules for purified conduct, restrictions on social and ritual attendance, the
    proper seeking of alms, permitted foods, and an eating rite involving water, silence,
    mental composure, and oblations to the vital airs.
  language: English
  quote_policy: quoted
