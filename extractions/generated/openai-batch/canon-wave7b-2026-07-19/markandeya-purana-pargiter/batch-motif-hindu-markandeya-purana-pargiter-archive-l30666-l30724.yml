canonical_text:
  quote: ''
  summary: 'The passage presents a cosmogonic and genealogical ordering: Brahma creates
    and separates major world divisions, fixes forms and abodes for divine and other
    beings, and the line from Brahma through Marici to Kasyapa produces gods, demons,
    Nagas, animals, birds, trees, and aquatic beings through Daksha’s thirteen daughters.'
  language: English
  quote_policy: summarized
