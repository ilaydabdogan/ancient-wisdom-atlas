canonical_text:
  quote: ''
  summary: After the Asuras Sumbha and Nisumbha deprive the gods of dominion and ritual
    shares, the gods recall a prior boon from the goddess and go to Himavat to praise
    her. The hymn invokes the goddess under many names and attributes, identifying
    her as Prakriti, Vishnu's illusive power, the foundation of the world, and as
    forms present in all created beings. The opening synopsis also reports Parvati's
    arrival, C'andika's emergence from her body, and a marriage challenge conveyed
    by an Asura messenger.
  language: English
  quote_policy: summarized
