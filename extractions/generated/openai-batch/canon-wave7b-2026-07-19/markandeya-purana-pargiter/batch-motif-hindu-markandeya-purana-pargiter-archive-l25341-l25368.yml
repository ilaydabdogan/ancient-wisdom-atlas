canonical_text:
  quote: ''
  summary: The passage opens the Devi-Mahatmya section. It summarizes how King Su-ratha,
    defeated and driven from his kingdom, takes refuge in a forest with a muni; a
    vaisya, expelled by relatives, also meets the muni. Both ask about the selfish
    attachments that remain in them. The muni attributes these feelings to the goddess
    Mahamaya, the Great Illusion, and introduces a prior cosmic episode in which Brahma
    praises the goddess for deliverance from Madhu and Kaitabha, after which Vishnu
    awakens and slays the demons. The invocation reveres Candika, and Markandeya begins
    to narrate the birth of Savarni, Surya's son, the eighth Manu.
  language: English
  quote_policy: summarized
