canonical_text:
  quote: ''
  summary: Markandeya concludes a prior account concerning the Sāvarṇika Manvantara
    and the Devi-māhātmya, then begins to list future Manvantaras. He names the ninth
    Manu as Sāvarṇa, son of Daksha, and states the gods, Indra, seven rishis, and
    royal sons of that period. He then begins the account of the tenth Manvantara,
    naming classes of gods associated with it.
