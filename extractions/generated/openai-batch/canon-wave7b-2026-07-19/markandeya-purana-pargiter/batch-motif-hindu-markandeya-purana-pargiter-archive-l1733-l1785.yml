  quote: ''
  summary: The canto introduction and opening verses present King Haris-candra’s ideal
    reign, a forest distress cry, and Raudra Vighna-raj’s plan to possess the king
    because Visvamitra’s austerities are mastering potent sciences. The canto synopsis
    forecasts a curse by which the Visve Devas are born as Draupadi’s sons and die
    young.
  language: English
