canonical_text:
  quote: ''
  summary: The king asks why he and a forsaken man remain attached and deluded despite
    understanding the faults of their attachments. The rishi explains sensory knowledge,
    parental attachment, and the power of Maha-maya, the Great Illusion from Hari,
    who deludes the world, creates the universe, grants boons toward emancipation,
    and is both supreme knowledge and the cause of bondage. The king asks about Maha-maya's
    origin and nature. The rishi says she is eternal, embodied as the world, manifests
    for the gods' purposes, and introduces Vishnu's contemplative sleep on Sesha at
    the end of the kalpa when the universe has become ocean, with Madhu and Kaitabha
    named as terrible Asuras.
  language: English
  quote_policy: summarized
