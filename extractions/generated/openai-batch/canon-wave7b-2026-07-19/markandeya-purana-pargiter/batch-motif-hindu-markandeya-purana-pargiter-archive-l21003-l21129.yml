canonical_text:
  quote: ''
  summary: 'The passage gives a cosmographic account of Bhadrasva, Ketumala, and the
    Northern Kurus: their positions, mountains, rivers, peoples, lifespans, divine
    animal-shaped forms, abundant trees and fruits, milk and ghee rivers, and nearby
    ocean islands.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Human lifespans in four ages are listed as four hundred, three hundred, two
    hundred, and one hundred autumns respectively.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhadrasva is situated east of the eastern mountain Deva-kuta.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bhadrasva has five named mountain ranges, many smaller offshoot mountains,
    and rivers carrying cold water.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people of Bhadrasva are described as lustrous, holy, associated with celestials,
    equal in appearance, and naturally endowed with good qualities; their lives last
    a thousand years.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Bhadrasva the god Janardana has a horse's head, four arms, horse-like body
    parts, and three eyes.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ketumala is placed in the west and has seven named mountain ranges, with many
    additional hills inhabited by people.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The people of Ketumala include named groups and drink from several named great
    rivers; their life is said to equal the previously mentioned life in Bhadrasva.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: In Ketumala the adorable Hari wears a boar's shape and resembles a boar in
    feet, face, chest, back, and flanks.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Northern Kurus, trees continually bear blossoms and fruit, produce
    garments and ornaments inside their fruits, and grant desires.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Northern Kuru ground abounds in precious stones and the air is fragrant
    and delightful.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: People in the Northern Kurus are born after leaving the world of the gods;
    they are born in pairs, remain for an equal time, are mutually fond, and stay
    there fourteen and a half thousand years.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Northern Kurus have two chief mountain ranges and the river Bhadra-soma,
    along with many other rivers, some flowing with milk and others with ghee, and
    lakes of curdled milk.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: Fruits in the Northern Kuru woods are produced in great numbers and taste
    rather like amrita.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: In the Northern Kurus the adorable Vishnu has his head turned to the east
    and wears a fish's shape; the lunar constellations and sky regions are divided
    into nine parts.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:15
  text: 'Three islands are named in the ocean: Candra-dvipa, Bhadra-dvipa, and Punya.'
  category: setting
  evidence_refs:
  - ev:10
