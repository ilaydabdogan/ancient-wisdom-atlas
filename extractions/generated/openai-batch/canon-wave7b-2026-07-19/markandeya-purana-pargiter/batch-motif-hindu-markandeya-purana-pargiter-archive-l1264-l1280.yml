  quote: ''
  summary: 'The passage opens Canto VI on Baladeva''s brahmanicide. The Birds introduce
    an explanation: Baladeva, wishing to avoid siding with the Pandavas or Kauravas,
    goes to the Maivata forest, kills Suta after Suta does not salute him, and undertakes
    pilgrimage to expiate the sin. The opening verse identifies the plough-armed Rama
    as deliberating because of Krishna''s affection for Arjuna and his unwillingness
    to approach Duryodhana without Krishna.'
