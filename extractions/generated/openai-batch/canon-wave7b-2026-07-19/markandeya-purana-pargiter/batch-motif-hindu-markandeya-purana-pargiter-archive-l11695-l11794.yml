canonical_text:
  quote: ''
  summary: Subahu explains to the king of Kasi that he induced the king's military
    action against Alarka in order to bring his pleasure-bound brother through distress
    into passionlessness. He recalls that their mother Madalasa gave admonition and
    instruction to him and his elder brothers, unlike Alarka. After defending aid
    to kin in difficulty, Subahu responds to the king's request for benefit by teaching
    the fourth human aim, final emancipation, through rejection of the notions of
    'I' and 'Mine' and discernment of soul from what is not soul.
  language: English
  quote_policy: summarized
