canonical_text:
  quote: ''
  summary: 'After being praised by a hymn, Agni appears before Santi in a halo of
    flame and offers a boon. Santi asks on behalf of his guru Bhuti: that the sacrificial
    fire be restored to the altar, that Bhuti obtain a distinguished son, that Bhuti
    become gentle toward all beings, and that future reciters of the hymn receive
    Agni''s favor. The prose summary reports that Agni grants the boons and blesses
    the hymn.'
