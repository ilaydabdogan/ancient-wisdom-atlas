  summary: A prayer asks for blessing among two-footed and four-footed beings. Groups
    of heavenly and semi-divine beings prostrate before the Sun and ask that his glory
    become endurable to created beings. Musicians sing, Apsarases dance, instruments
    sound, and all the gods bow and prostrate before the Thousand-rayed god while
    he is being pared down.
