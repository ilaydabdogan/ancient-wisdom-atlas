canonical_text:
  quote: ''
  summary: The passage describes king Narishyanta appointing twice-born brahmans as
    priests for his great sacrifice. During his sacrifice, all twice-born people on
    earth are said to be sponsoring or performing sacrifices, enabled by the king’s
    gifts, with vast numbers named in the four regions. The passage then praises Narishyanta
    and introduces his son Dama, born after nine years in his mother’s womb, named
    for self-restraint by the family priest, and trained in archery, weapons, Vedas,
    Vedangas, and religious devotion by several teachers.
  language: English
