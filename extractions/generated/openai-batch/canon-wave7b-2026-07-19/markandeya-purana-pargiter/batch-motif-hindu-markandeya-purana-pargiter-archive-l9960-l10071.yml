literal_observations:
- id: obs:1
  text: Running water and odourless bubbles are described as pure.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ground is said to be cleansed by time, bodily rubbing, cattle passage,
    smearing, digging, watering, houses, sweeping, and worship.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Various soiled or infested objects are prescribed to be cleansed with substances
    such as earth, water, ashes, vinegar, salt, or by removing smell and colour.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Water that has satisfied cattle, water in its natural state, water lying on
    earth, certain flesh, and clothes lying on the high-road are treated as pure or
    made pure under stated conditions.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Dust, fire, a horse, a cow, shade, rays of the sun and moon, wind, earth,
    drops of water, and small insects are said not to inflict contamination even after
    contact with corrupt things.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: A seat, bed, carriage, boats, road grass, and articles of trade are said to
    be purified by the rays of the moon and sun and by the wind.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: After walking on a high road and after bathing-related matters, hunger, drinking,
    and weariness, one is instructed to change clothes and rinse the mouth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Damaged rice-food is to be discarded, the mouth rinsed with water and earth,
    the remainder sprinkled with water, and eating bad food is expiated by a three-night
    fast.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: After touching a menstruous woman, certain animals or persons, a woman recently
    delivered, low-caste people, or after carrying a corpse, bathing is prescribed
    for purification.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Touching a human bone requires different forms of purification depending on
    whether the bone is oily or dry, including bathing, mouth-rinsing, touching a
    cow, or gazing at the sun.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Remnants of food, ordure, urine, and water used for washing the feet are to
    be cast outside the house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage recommends bathing in holy ponds, the Ganges, lakes, and rivers,
    with a condition about taking up five pindas before bathing in another person's
    water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: After touching or conversing with blasphemers of gods, pitris, holy sastras,
    sacrifices, prayers, or other sacred objects, one is instructed to purify oneself
    by gazing at the sun.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: After seeing a menstruous woman, a sudra, an outcaste, a dead body, the unrighteous,
    a recently delivered woman, a eunuch, a naked person, low-caste persons, or those
    who give away children, purification by gazing at the sun is prescribed.
  category: action
  evidence_refs:
  - ev:6
