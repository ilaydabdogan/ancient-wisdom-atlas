  quote: ''
  summary: A prescriptive passage gives rules about purity, contamination, and cleansing.
    It lists substances, natural forces, places, persons, bodily conditions, objects,
    and actions that are pure, impure, purifying, or require purification through
    bathing, rinsing, sprinkling, fasting, disposal, or gazing at the sun.
  language: English
