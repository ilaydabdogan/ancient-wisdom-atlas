canonical_text:
  quote: ''
  summary: Mahisha resumes his buffalo form, shakes the three worlds, and attacks
    Candika by hurling mountains. Candika, called the mother of the world, drinks
    mead, laughs, shatters the mountains with arrows, challenges him, mounts him,
    kicks his neck, strikes him with a spear, and cuts off his head with a sword.
    The Daitya army perishes, and gods, rishis, Gandharvas, and Apsarases celebrate
    with praise, song, and dance.
  language: English
