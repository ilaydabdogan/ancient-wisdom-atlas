canonical_text:
  quote: ''
  summary: Visva-vedin urges an unnamed king to seek sole sovereignty over the one
    earth despite the existence of brothers and an elder king. After the king agrees,
    Visva-vedin subordinates the king’s brothers and their purohitas, employs spells
    against Khanitra, separates Khanitra’s loyal adherents, and protects his own faction.
    Four purohitas produce a terrifying four-fold female deity through arduous daily
    magical incantation; it approaches Khanitra but is cast out by Khanitra’s store
    of merit.
  language: English
  quote_policy: summarized
