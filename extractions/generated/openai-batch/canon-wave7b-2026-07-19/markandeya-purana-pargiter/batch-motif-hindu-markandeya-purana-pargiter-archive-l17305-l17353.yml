canonical_text:
  quote: ''
  summary: A section headed as a catalogue of countries and races in North India lists
    several peoples and adds notes comparing their names and descriptions in other
    Sanskrit sources. The notes describe the Paradas as a hill people associated with
    the Himalayas and with traditions of social degradation; give uncertain variant
    readings for Hara-bhushikas, Matharas, and Bahu-bhadras; and describe the Kaikeyas
    as a powerful Panjab people, noted as bowmen and associated with an eponymous
    ancestor.
  language: English
  quote_policy: summarized
