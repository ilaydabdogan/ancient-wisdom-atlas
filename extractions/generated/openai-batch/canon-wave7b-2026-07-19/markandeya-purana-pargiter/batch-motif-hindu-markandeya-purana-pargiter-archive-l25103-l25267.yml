  summary: The passage assigns offices and genealogical places to figures connected
    with Shadow-Sanjna, then enumerates the deities, Indra, worlds, rishis, and sons
    associated with the Vaivasvata Manvantara. It closes that section with the merit
    of hearing or reading it and opens the Savarni Manvantara section with a question
    about future Manus and Markandeya’s statement that Savarni, son of Shadow-Sanjna,
    will be the eighth Manu.
