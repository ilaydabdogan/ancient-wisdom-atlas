canonical_text:
  quote: ''
  summary: The passage recounts Kuvalayasva in Galava's hermitage pursuing a Danava
    in hog form, wounding it, and falling through a dark chasm into Patala. In the
    underworld city Purandara-pura he follows a woman into a palace, sees Madalasa,
    and hears from her companion that Patala-ketu carried Madalasa off from her garden
    using an illusion of darkness.
  language: English
  quote_policy: summarized
