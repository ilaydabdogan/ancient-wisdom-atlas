canonical_text:
  quote: ''
  summary: In a speech, the goddess declares the benefits of praising her and of reading
    or listening to the poem of her majesty. She promises protection from wrongdoing,
    calamity, enemies, weapons, fire, flood, pestilence, and portents; she says her
    presence remains where the poem is read at her sanctuary; she accepts bali worship
    and fire oblations; and she grants deliverance, riches, grain, children, and battle
    prowess to faithful listeners.
  language: English
  quote_policy: summarized
