  summary: The passage continues Brahma's instructions to Duhsaha. Duhsaha is told
    to avoid certain habitations and persons associated with honor, festivals, custom,
    law, sacrifice, and purification, and to visit unlucky men marked by particular
    fanning and bathing practices. Markandeya then reports that Brahma disappeared
    and Duhsaha followed the command.
