canonical_text:
  quote: ''
  summary: 'A frame narrative introduces Jaimini thanking the Birds and asking about
    creation, the world, and mankind. The Birds reply by reporting what Markandeya
    taught Kraushtuki. The passage then summarizes a cosmogony: the Purana is said
    to emanate from Brahma; Pradhana/Prakriti, Mahat, Ahankara, the sensory qualities,
    elements, and organs arise in sequence; Mahat and the other principles produce
    an egg animated by Brahma and containing the universe, gods, demons, and mankind.
    Jaimini praises the Birds'' knowledge despite their animal state.'
  language: English
  quote_policy: summarized
