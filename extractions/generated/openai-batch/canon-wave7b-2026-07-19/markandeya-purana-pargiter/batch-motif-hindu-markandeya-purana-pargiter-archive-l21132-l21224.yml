canonical_text:
  quote: ''
  summary: 'Markandeya describes several continents: Kim-purusha, Hari-varsha, Ilavrita
    with Meru, Ramyaka, and Hiran-maya, emphasizing their inhabitants, trees, rivers,
    foods, longevity, beauty, and freedom from decay or sickness. A following canto
    heading introduces a story in which a young brahman uses magic ointment on his
    feet to reach the Himalaya, loses the means of return, rejects the love of the
    Apsaras Varuthim, and appeals to the gdrhapatya fire for help homeward.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Markandeya introduces Kim-purusha as a continent where men with real bodies
    live ten thousand years and are free from sickness and sorrow.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kim-purusha contains a tall fig-tree likened to a grove; the men drink the
    juice of its fruit, and the women are born with lasting youthfulness and lotus-like
    fragrance.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hari-varsha is described as a continent whose inhabitants have a golden appearance,
    descend from the world of the gods, resemble gods, drink sugar-cane juice, and
    do not suffer old age, decay, or sickness.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ilavrita is placed in the middle and identified as the continent of Meru;
    there the sun does not burn people, people do not suffer decay, and they do not
    grasp at selfish gains.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Ilavrita, the rays of moon, sun, constellations, and planets are described
    as the sublime lustre of Meru; the people are lotus-bright and lotus-fragrant,
    feed on jambu fruit juice, have lotus-leaf-like eyes, and live thirteen thousand
    years.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A saucer-shaped expanse is said to lie in the middle of Meru in Ilavrita,
    and the great mountain Meru is located there.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ramyaka has a lofty green-leaved Indian fig-tree; its people drink the juice
    of the tree’s fruit, live ten thousand years, are associated with sexual pleasures
    and purity, and are free from old age and ill odours.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hiran-maya lies north of Ramyaka and contains the river Hiran-vati, which
    gleams with abundant lotuses; its people are strong, vigorous, large-bodied, good,
    wealthy, and benign-looking.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The following canto heading says that a young brahman applies a magic ointment
    to his feet, visits the Himalaya mountains in half a day, loses the ointment when
    snow dissolves it, and loses his way.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The same heading says that the Apsaras Varuthim meets the young brahman, falls
    in love with him, asks for his love, is refused, and the brahman appeals to the
    gdrhapatya fire to help him homeward.
  category: sequence
  evidence_refs:
  - ev:7
