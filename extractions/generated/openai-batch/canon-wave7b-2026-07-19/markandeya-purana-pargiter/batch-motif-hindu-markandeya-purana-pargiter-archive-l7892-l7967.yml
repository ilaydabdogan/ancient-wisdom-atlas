canonical_text:
  quote: ''
  summary: 'A king objects to Queen Madalasa''s prior style of educating her sons
    and asks her to train Alarka in the path of action and kshatriya duty so that
    ancestor offerings will not cease. He describes pinda and water offerings as nourishing
    the pitris and other beings. Madalasa then addresses Alarka with royal and social
    instructions: protect the earth, benefit friends, destroy enemies, honor brahmans
    and gods, perform sacrifices, observe restraints, rule well, guard the good, and
    die in defense of cattle and brahmans.'
  language: English
  quote_policy: summarized
