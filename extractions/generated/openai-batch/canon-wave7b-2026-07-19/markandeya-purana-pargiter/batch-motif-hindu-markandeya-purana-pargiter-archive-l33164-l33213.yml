canonical_text:
  quote: ''
  summary: 'The passage gives a canto synopsis of Vatsa-pri’s rescue of a princess
    abducted to Patala by a Daitya with a magic club, then begins Markandeya’s narration:
    a king refuses to resume a kingdom he had relinquished at his father’s command
    and tells his son to rule; Bhanandana governs righteously; Vatsa-pri is born to
    him and gains Saunanda, Viduratha’s daughter, by slaying the Daitya king Kujrimbha.'
  language: English
  quote_policy: summarized
