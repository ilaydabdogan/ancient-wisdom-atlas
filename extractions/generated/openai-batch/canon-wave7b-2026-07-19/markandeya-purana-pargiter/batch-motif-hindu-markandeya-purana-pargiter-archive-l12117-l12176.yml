  summary: The passage describes a cosmogonic sequence in which ether, air, fire,
    water, and earth arise with increasing sensory properties. It then states that
    the principles interpenetrate, must unite to create mankind, and, under the governance
    of the Soul and favour of the Imperceptible, Mahat and other principles cause
    an egg to come into existence; the egg grows like a bubble and rests on water.
