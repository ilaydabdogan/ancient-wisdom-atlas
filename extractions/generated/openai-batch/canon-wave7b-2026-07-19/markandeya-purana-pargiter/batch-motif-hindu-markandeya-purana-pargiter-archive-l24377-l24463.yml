canonical_text:
  quote: "“I raise the constellation Revati to the moon’s pathway for thy sake.”"
  summary: 'Revati asks her ascetic father to restore the constellation Revati so
    that her wedding may occur under it. The rishi raises the constellation to the
    moon’s path, performs the marriage with sacred texts, and grants the king a wedding
    gift: a son who will be a Manu. Revati later bears Raivata, whose manvantara is
    described.'
  language: English
  quote_policy: quoted
