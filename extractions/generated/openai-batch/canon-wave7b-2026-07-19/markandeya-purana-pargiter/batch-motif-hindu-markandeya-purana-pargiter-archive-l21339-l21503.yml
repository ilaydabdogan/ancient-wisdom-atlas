canonical_text:
  quote: ''
  summary: On the snowy mountain Hima-vat, a young brahman loses the foot-ointment
    whose power had brought him there and becomes anxious about returning home for
    his rites. Varuthini, an Apsaras and daughter of Miili, sees him, falls in love,
    reveals herself, and declares her submission. He asks her to help him return home
    before sunset, citing brahmanical duties. She urges him to stay with her on the
    mountain, offering pleasures, gifts, music, pure water, youth, and freedom from
    old age. She embraces him, but he rejects her touch.
  language: English
  quote_policy: summarized
