canonical_text:
  quote: ''
  summary: Markandeya narrates that the Apsaras Pramloca rises from a river and offers
    her daughter Malini to the high-souled ascetic named in the OCR text as Enci.
    She says Malini was begotten by Pushkara, son of Varuna, and that a future Manu
    will be born from the marriage. After Enci accepts, Pramloca brings Malini from
    the water; the marriage is performed on a river sand-bank before great munis.
    Their son Raucya is born, and the passage closes by describing benefits of hearing
    about the manvantara and the Pitris.
  language: English
  quote_policy: summarized
