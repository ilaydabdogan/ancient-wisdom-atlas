  summary: In this passage, trees perish after wrong conduct, and strife, cold, heat,
    and hunger arise. People make towns for combination and resistance, take refuge
    in fortresses in difficult places, construct an artificial fortress on trees,
    mountains, and water, and establish measures of length from minute particles through
    the yojana. The passage also distinguishes natural and artificial fortresses.
