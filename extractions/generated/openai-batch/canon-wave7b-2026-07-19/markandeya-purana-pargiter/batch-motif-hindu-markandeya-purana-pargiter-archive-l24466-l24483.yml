canonical_text:
  quote: ''
  summary: A canto summary for the Sixth Manvantara says that G^dkshnsha, while an
    infant, was taken from his parents by a hag, exchanged for the son of King Yi-h'dnta,
    and raised as a prince. In boyhood he exposed the fraud, renounced princely status,
    became an ascetic, and was made the sixth Manu by Brahma. The passage also notes
    that the deities, yisliis, and kings of his period are mentioned, and includes
    a footnote about a Bombay edition verse promising benefits from hearing or reading
    the story of the Manus.
  language: English
  quote_policy: summarized
