canonical_text:
  quote: ''
  summary: The passage opens by stating that Savarni, son of the Sun, became king
    of the eighth manvantara. It then narrates how King Suratha lost his sovereignty
    through defeat and corrupt ministers, departed alone to a forest hermitage, and
    brooded over his lost city, elephant, followers, and treasure. Near the hermitage
    he met the vaisya Samadhi, who had been cast out by greedy family members but
    still worried about them. After discussing this attachment, the king and Samadhi
    approached the muni Medhas with proper etiquette.
  language: English
  quote_policy: summarized
