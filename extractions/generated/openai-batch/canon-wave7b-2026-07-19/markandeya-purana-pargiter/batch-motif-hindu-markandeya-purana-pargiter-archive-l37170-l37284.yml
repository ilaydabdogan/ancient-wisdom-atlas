canonical_text:
  quote: ''
  summary: Vapush-mat seizes and kills the ascetic Narishyanta, father of Dama, while
    Indra-sena laments and forest ascetics condemn the deed. After Vapush-mat departs,
    Indra-sena sends a sudra ascetic to Dama with a message urging him, as king and
    protector of ascetics, to decide what should be done. Her message invokes examples
    of fathers slain or attacked and avenged by their sons or descendants.
  language: English
  quote_policy: summarized
