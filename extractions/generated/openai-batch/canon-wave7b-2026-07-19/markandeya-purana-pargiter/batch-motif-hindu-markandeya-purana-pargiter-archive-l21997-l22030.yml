canonical_text:
  quote: ''
  summary: A maiden says she cannot enjoy delights while two maidens suffer for her
    sake and resolves to share their grief. Sva-rocis promises to restore her friends
    through Ayur-veda. He marries the maiden, given by her father according to rites
    on a mountain. A Gandharva departs to his city by a heavenly course. Sva-rocis
    and the maiden go to the garden where the two cursed maidens dwell speechless
    and diseased; he restores them with medicines and potions, and they become radiant
    and beautiful.
  language: English
  quote_policy: summarized
