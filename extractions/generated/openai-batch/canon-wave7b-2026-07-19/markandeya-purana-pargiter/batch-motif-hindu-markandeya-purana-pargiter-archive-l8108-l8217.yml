canonical_text:
  quote: ''
  summary: The passage frames Alarka asking his mother Madalasa to explain the duties
    of the four classes and the four periods of a brahman’s life. Madalasa lists duties
    and livelihoods for brahmans, kshatriyas, vaisyas, and sudras; states consequences
    for maintaining or violating class-duty; describes investiture with the sacred
    thread and the duties of a brahma-carin in the guru’s house; and begins the transition
    into householder status through marriage.
  language: English
  quote_policy: summarized
