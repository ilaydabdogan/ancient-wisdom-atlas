canonical_text:
  quote: ''
  summary: A woman described as a virtuous wife is placed in a palki borne on heads.
    Dattatreja tells the gods that Lakshmi is being borne on the heads of the Daityas
    and explains the effects of Lakshmi’s residence on different bodily stations.
    He says that when she is on the head she deserts the bearer, and he urges the
    gods to slay the weakened Daityas. Garga then narrates the Daityas’ destruction,
    Lakshmi’s return to Dattatreja, the gods’ recovery of heaven, and advises a king
    to propitiate Dattatreya for sovereignty.
  language: English
  quote_policy: summarized
