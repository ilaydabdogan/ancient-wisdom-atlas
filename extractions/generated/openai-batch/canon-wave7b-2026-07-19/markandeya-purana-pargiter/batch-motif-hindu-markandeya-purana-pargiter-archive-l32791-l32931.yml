canonical_text:
  quote: ''
  summary: In this passage, Nabhaga marries a vaiśya maiden and becomes a vaiśya.
    A royal authority asks ascetics to determine his proper occupation, and they assign
    cattle-tending, cultivation, and trade. Nabhaga's son Bhanandana is sent by his
    mother to be a keeper of cattle, but he approaches the royal rishi Nipa on Mount
    Himavat, asks how he may protect and gain the earth, receives weapons, and challenges
    his paternal kinsmen for a share of the kingdom. They reject him as a vaiśya's
    son; he defeats them and wins the earth by combat. He offers the sovereignty to
    his father, but Nabhaga refuses, explaining that he had obeyed his father's command
    after choosing the vaiśya condition and that ruling now would obstruct liberation.
  language: English
  quote_policy: summarized
