canonical_text:
  quote: ''
  summary: 'The passage first gives a nested philosophical image of carriage, body,
    and soul. It then opens Canto XXVI on the education of Madalasa''s sons: Jada
    narrates that the queen trains a son toward unselfish self-knowledge from birth,
    after which he turns away from family life. A second son is born and named Su-bahu
    by his father; Madalasa laughs and instructs him similarly. A third son is named
    S''atru-mardana by the king; Madalasa laughs again and instructs him. The passage
    ends as the king is about to name a fourth son while Madalasa laughs slightly.'
  language: English
