canonical_text:
  quote: ''
  summary: 'Instructional passage prescribing ascetic and yogic conduct: ritual eating
    with breath restraint, mendicant obligations and observances, preference for essential
    knowledge over multiplicity of knowledge, secluded contemplation, control of speech/action/mind,
    equanimity toward clods and gold, comprehension of the Supreme Soul, and attainment
    of the eternal or final emancipation through yoga and intentness on Brahma.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The practitioner performs oblations connected with vital airs while restraining
    breath, then eats, drinks water, rinses the mouth, and touches the heart.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Five principal religious obligations of mendicants are listed: honesty and
    sanctity, self-sacrifice, uncovetousness, and harmlessness.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Five observances are listed: freedom from anger, reverence toward gurus,
    purity, abstemiousness in food, and constant study of the Vedas.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage recommends devotion to essential knowledge and says that multiplicity
    of knowledge is a hindrance to religious meditation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The practitioner is instructed to discard associations, subdue anger, eat
    sparingly, control the organs, regulate the body by intellect, and apply understanding
    to profound contemplation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Empty places, caves, and forests are named as suitable places for profound
    contemplation.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Control over speech, actions, and mind are called the three controls; one
    who possesses them is called a great three-control ascetic.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage asks who can be agreeable or disagreeable to one for whom the
    whole universe, real and unreal and composed of good and bad qualities, is composed
    of the Supreme Soul.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A person with purified intellect, for whom clods and gold are alike, comprehends
    the supreme eternal and immutable condition and ceases to be born again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A hierarchy is stated in which prayer is better than sacrifice, knowledge
    better than prayer, and profound contemplation cut off from associations and feelings
    better than knowledge; when attained, the eternal is gained.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The composed, attentive, pure, Brahma-intent, high-souled person who controls
    the organs achieves yoga or religious meditation and gains final emancipation
    from existence.
  category: sequence
  evidence_refs:
  - ev:7
