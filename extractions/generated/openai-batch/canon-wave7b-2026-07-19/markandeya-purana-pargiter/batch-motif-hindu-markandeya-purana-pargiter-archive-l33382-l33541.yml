canonical_text:
  quote: ''
  summary: In Patala, the Danava king Kujrimbha battles the king’s son for three days.
    Muda-vati secretly neutralizes Kujrimbha’s club Saunanda by repeatedly touching
    it. The prince defeats and kills Kujrimbha with a fiery weapon, frees Muda-vati
    and her two brothers, and returns them to their father. Sesha/Ananta takes the
    club and gives Muda-vati the name Su-nanda. The king gives Muda-vati in marriage
    to the prince, who later becomes king and rules righteously; the next canto begins
    with his sons and succession.
  language: English
  quote_policy: summarized
