canonical_text:
  quote: ''
  summary: 'The gods ask the goddess for boons that will pacify troubles in the three
    worlds and destroy their enemies. The goddess grants the request by foretelling
    repeated future manifestations: she will destroy named Asuras and Rakshasas, receive
    names based on her forms or acts, sustain the world with vegetables from her body,
    and become incarnate whenever Danava-caused trouble arises.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The gods are described as prostrate and ask the goddess to be gracious, remove
    affliction from the universe, and bestow boons on the worlds.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The goddess says she is ready to bestow whatever boon the hosts of gods desire,
    as something benefiting the worlds.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The gods ask the goddess to complete the pacification of every trouble in
    the three worlds and the destruction of their enemies.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The goddess foretells that S'umbha and Nisumbha will be born in the twenty-eighth
    age of the Vaivasvata Manvantara and that she will destroy them after being born
    from Yasoda's womb in Nanda's house and dwelling on the Vindhya mountains.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The goddess says she will take a very terrible form on earth, slay and devour
    the Vaipracitta Danavas, and that her teeth will become red like pomegranate flowers,
    leading to the name Red-toothed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After a hundred-year period without rain and water, the goddess says she will
    be born on earth without being womb-begotten and will behold the munis with a
    hundred eyes, leading mankind to call her Hundred-eyed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The goddess says she will support the whole world with life-sustaining vegetables
    growing from her own body during a period of heavy rain and will be known as Sakambhari.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The goddess says she will slay the great Asura Durgama.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The goddess says that on mount Himavat she will take a terrible form and destroy
    Rakshasas for the sake of delivering the munis, after which the munis will praise
    her.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: When Arunaksha causes great trouble in the three worlds, the goddess says
    she will take a bee-like form made of innumerable bees and slay him, after which
    she will be extolled as Bhramari.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The goddess generalizes that whenever trouble caused by Danavas arises, she
    will become incarnate and accomplish the destruction of the foes.
  category: speech
  evidence_refs:
  - ev:9
