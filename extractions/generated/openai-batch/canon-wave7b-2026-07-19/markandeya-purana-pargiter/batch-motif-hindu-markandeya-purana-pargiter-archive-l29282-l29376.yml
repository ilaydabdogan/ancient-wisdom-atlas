canonical_text:
  quote: ''
  summary: Ruci sees a great stationary light in the sky, sinks to the earth on his
    knees, and sings a hymn of reverence to the Pitris and associated cosmic powers.
    He describes the Pitris as luminous, meditative, fire-formed, dwelling in light,
    and connected with moon, sun, fire, Agni, Soma, and svadha. Markandeya reports
    that the praised Pitris issue forth in splendour and stand before Ruci. The introductory
    canto summary also states that the Pitris grant Ruci a wife so he may become a
    Praja-pati and declare the hymn's efficacy.
  language: English
  quote_policy: summarized
