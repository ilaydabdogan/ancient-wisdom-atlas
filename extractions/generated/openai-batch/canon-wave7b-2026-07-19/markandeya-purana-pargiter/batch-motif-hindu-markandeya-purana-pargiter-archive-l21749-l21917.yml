canonical_text:
  quote: ''
  summary: The passage recounts the birth and youth of Sva-rocis, son of the Apsaras
    Varuthini and the Gandharva Kali, who had assumed a brahman form. As a young man
    on Mount Mandara, Sva-rocis encounters the frightened maiden Mano-rama, who explains
    that a muni cursed her after she laughed at him, and that a Rakshasa has pursued
    her for three days. She gives Sva-rocis a powerful weapon called the Heart of
    weapons, transmitted through a lineage beginning with Rudra. The Rakshasa seizes
    her, Sva-rocis uses the weapon, and the demon releases her, saying Sva-rocis has
    delivered him from a grievous curse.
  language: English
  quote_policy: summarized
