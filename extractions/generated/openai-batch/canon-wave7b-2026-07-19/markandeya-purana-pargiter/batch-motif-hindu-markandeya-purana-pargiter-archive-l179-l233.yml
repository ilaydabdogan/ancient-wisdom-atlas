canonical_text:
  quote: ''
  summary: The passage opens with questions about four winged sons of Drona and their
    knowledge of righteousness. Markandeya then begins an account of a past meeting
    in Nandana involving Indra, Narada, and the Apsarases. Indra honors Narada, the
    Apsarases bow, and Indra asks Narada which celestial dancer pleases him most.
    Narada says the one who considers herself pre-eminent in beauty, nobility, and
    qualities should dance. The Apsarases each claim excellence, and Indra says the
    Muni should decide.
  language: English
