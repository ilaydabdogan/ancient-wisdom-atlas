canonical_text:
  quote: ''
  summary: Marutta refuses to pardon wicked offenders, grounding his action in a king’s
    duty to punish and protect. Markandeya narrates that the father, Avikshi, forbids
    his son but then prepares a fiery weapon of fate to counter him because frightened
    Kagas have sought refuge with him. The weapon makes heaven and earth, with seas
    and mountains, quake. Marutta answers that his own weapon is meant to punish the
    wicked, not to kill his father, and states that he must protect his subjects.
