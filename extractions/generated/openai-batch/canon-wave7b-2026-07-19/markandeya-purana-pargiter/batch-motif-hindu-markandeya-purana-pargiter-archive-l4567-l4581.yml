canonical_text:
  quote: ''
  summary: 'The passage introduces Canto XV as a continued conversation between father
    and son and as a continuation of an exposition of sins and punishments. It says
    Jaia concludes the story of king YipaS-dit, whose merit delivers the inhabitants
    of hell and leads him to ascend to heaven. Tama’s officer then states punishments:
    a dvija who accepts value from an outcaste is to be born an ass, and one who sacrifices
    for an outcaste becomes a worm after release from hell.'
  language: English
  quote_policy: summarized
