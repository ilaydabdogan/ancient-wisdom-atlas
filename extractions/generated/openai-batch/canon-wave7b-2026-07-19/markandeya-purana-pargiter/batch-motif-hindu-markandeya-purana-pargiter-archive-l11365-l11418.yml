  text: Being assailed by flocks of crows, experiencing a shower of dust, or seeing
    an unnatural shadow is said to indicate four or five months of life remaining.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Seeing lightning in the south from a cloudless sky or seeing a rainbow at
    night is said to indicate two or three months of life remaining.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Not seeing one’s body reflected in clarified butter, oil, a mirror, or water,
    or seeing the body headless, is said to indicate no more than one month of life
    remaining.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A yogi whose body smells like a goat or a corpse is said to have half a month
    to live.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: If a person’s breast and foot dry up immediately after bathing, and water
