canonical_text:
  quote: ''
  summary: Rita-dhvaja learns that his wife Madalasa died after hearing a report of
    his death. He grieves, performs water rites and obsequies, and vows not to take
    or love another woman. The sons report this renunciation to their father, the
    Naga king Asvatara, who resolves to strive for an apparently difficult accomplishment
    through austerities. Asvatara goes to Plakshavatarana on Himavat, practices austerities,
    and begins praising the goddess Sarasvati.
  language: English
  quote_policy: summarized
