canonical_text:
  quote: ''
  summary: 'Krauslituki recalls the genesis of the egg and Brahma’s birth within it,
    then asks what exists when creation has ceased after dissolution. Markandoya answers
    by describing natural dissolution: the universe is dissolved in Nature, the Imperceptible
    remains within itself, modifications are suspended, Nature and Soul share sameness,
    and the qualities are held in equilibrium. The passage then introduces the Supreme
    Lord’s day and night in relation to Brahma’s life and dissolution.'
  language: English
  quote_policy: summarized
