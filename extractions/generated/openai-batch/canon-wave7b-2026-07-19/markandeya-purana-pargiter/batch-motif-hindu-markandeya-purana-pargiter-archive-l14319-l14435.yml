canonical_text:
  quote: ''
  summary: The passage enumerates offspring of destructive or troublesome beings.
    It describes Vijalpa as corrupt speech and Kalaha as household quarrel, prescribes
    rites of pacification, names further beings who torment bodies, threaten pregnancy,
    or appear as ominous birds, and begins a notice about offspring dwelling in women’s
    menses.
  language: English
  quote_policy: summarized
literal_observations:
