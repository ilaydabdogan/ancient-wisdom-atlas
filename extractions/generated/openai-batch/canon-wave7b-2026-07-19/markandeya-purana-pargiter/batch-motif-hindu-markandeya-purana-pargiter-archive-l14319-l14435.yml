  text: Vijalpa is identified as Dantakrishti’s daughter, and Kalaha is named alongside
    her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Vijalpa engages in contemptuous, false, and corrupt talk; a wise householder
    is instructed to ponder on her and preserve self-control in order to vanquish
    her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Kalaha is said to create disturbances in men’s houses and to be the cause
    by which families perish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The prescribed means for subduing Kalaha include throwing durba grass smeared
    with honey, ghee, and milk in the bali ceremony, offering a sacrifice to fire,
    and extolling friends.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The propitiatory rite is said to avert evil from living beings, boys with
    their mothers, sciences, penances, religious vows, and moral duties.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Kushmandas, Yatu-dhanas, and other classed beings are said to become pacified
    when duly adored; by the favor or counsel of Maha-deva and Mahesvara they become
    satisfied with regard to men.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: When pleased, these beings are asked to cast aside evil deeds, evil works,
    results of great sins, and obstacles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: The pacification is requested in marriages, prosperity ceremonies, meritorious
    undertakings, religious devotion, worship of teachers and gods, prayer, sacrifice,
    pilgrimages, health, happiness, liberality, wealth, and among the aged, children,
    and sick.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:10
  text: Hati is said to have sons named Soma-pa, Ambu-pa, Ambho-dhi, Savitri, Anila,
    Anala, and Kala-jihva; Kala-jihva resides in the palms in the printed passage
    and torments bad men in whose mothers he abides.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: Parivarta has two sons, Virupa and Vikriti, who inhabit tree tops, ditches,
