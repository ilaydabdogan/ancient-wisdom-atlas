canonical_text:
  quote: ''
  summary: During the long reign of King Eajya-vardhana, Queen Manini weeps after
    seeing a grey hair on his head. The king interprets aging as a natural stage of
    life and announces that old age calls for resorting to the forest. The assembled
    kings and citizens plead that his guardianship of the earth is more valuable than
    forest austerity. The king replies that his time has come, that the grey hair
    is a messenger from Death, and that he will install his son, abandon pleasures,
    and perform austerities as a forest-dweller until Yama's troops arrive.
  language: English
  quote_policy: summarized
