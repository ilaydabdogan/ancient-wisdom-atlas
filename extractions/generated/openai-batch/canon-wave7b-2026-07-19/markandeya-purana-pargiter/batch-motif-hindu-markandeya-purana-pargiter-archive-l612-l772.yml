canonical_text:
  quote: ''
  summary: Wise speaking birds explain to an inquiring Rishi that they are the four
    sons of Sukrisha. They recount how Indra came in the form of an aged injured bird
    to test Sukrisha, asked for refuge and food, and specifically requested human
    flesh. Sukrisha, bound by his promise, asked his sons to provide their flesh and
    blood; when they refused, he cursed them to be born among brute creatures and
    then offered his own body, emphasizing truthfulness. Indra, astonished, said he
    did not eat living beings, and Sukrisha entered meditation.
  language: English
  quote_policy: summarized
