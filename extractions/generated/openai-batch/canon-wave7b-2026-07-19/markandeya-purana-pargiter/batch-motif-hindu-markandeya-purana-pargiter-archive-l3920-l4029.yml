- id: obs:3
  text: In Maha-raurava, an evil-doer is deposited bound hand and foot by Yama’s servants
    and rolls about in the middle of the region.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Maha-raurava, crows, herons, wolves, owls, scorpions, mosquitoes, and vultures
    prey upon the sufferer and drag him out into the road.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sufferer in Maha-raurava cries out to kin and has no repose; violent,
    evil-minded sinners endure there for a vast length of time until their sins are
    consumed.
  category: sequence
  evidence_refs:
  - ev:2
