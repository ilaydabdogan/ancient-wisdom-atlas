  text: Tamas is described as a naturally bitterly cold hell, as long as Maha-raurava,
    and enveloped in darkness.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: In Tamas, afflicted people run in darkness, encounter one another, clasp one
    another for refuge, and suffer chattering teeth from the cold.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In Tamas, hunger, thirst, and a cutting snow-laden wind torment the sufferers,
    who feed on marrow and blood trickling from their bones.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: In Nikrintana, potter’s wheels revolve constantly; humans mounted on them
    are cut from foot to head by a string of Fate borne by Yama’s servant, but they
    do not die and their severed parts reunite.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In A-pratishtha, wheels, a jar, and a well-rope serve as causes of pain; humans
    whirl around, spit blood, bleed from their faces, and weep.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Asi-patra-vana has ground covered with blazing fire for a thousand yojanas
    and is scorched by fierce rays of the sun; a charming forest with moist leaves
    appears in its midst.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: In Asi-patra-vana, the leaves are sword-blades, black dogs bark, thirsty beings
