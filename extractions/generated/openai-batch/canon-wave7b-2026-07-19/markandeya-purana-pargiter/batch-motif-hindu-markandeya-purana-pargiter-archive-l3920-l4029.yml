canonical_text:
  quote: ''
  summary: 'A son answers his father’s request for a fuller account of the Narakas
    by describing several named hells: Maha-raurava, Tamas, Nikrintana, A-pratishtha,
    and Asi-patra-vana. Each is characterized by specific conditions and punishments
    inflicted on evil-doers or sinners until their sins are consumed.'
  language: English
  quote_policy: summarized
