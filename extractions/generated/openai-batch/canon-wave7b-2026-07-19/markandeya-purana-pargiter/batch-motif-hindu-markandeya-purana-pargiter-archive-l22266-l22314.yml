canonical_text:
  quote: ''
  summary: The Canto LXVI synopsis and opening verses describe Sva-rocis as having
    three sons whom he places in separate kingdoms. The synopsis also says he later
    meets a forest goddess, fathers Nijuti-mat Svarocisha who becomes a Manu, is admonished
    by two ducks, adopts a religious life, and dies. In the verses, Sva-rocis hears
    animal criticism of his conduct, considers leaving his wives, but his affection
    increases when he meets them again; he continues sensual enjoyment for six hundred
    years while also performing righteous works. Three sons are born by Mano-rama,
    Vibha-vari, and Kala-vati, and Sva-rocis uses the knowledge named Padmini to build
    cities for them.
  language: English
  quote_policy: summarized
