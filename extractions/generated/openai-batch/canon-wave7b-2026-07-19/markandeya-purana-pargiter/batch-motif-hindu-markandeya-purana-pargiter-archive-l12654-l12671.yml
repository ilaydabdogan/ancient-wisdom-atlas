canonical_text:
  quote: ''
  summary: 'The passage enumerates several stages in a ninefold creation sequence:
    the fourth mukhya creation of immoveable things, the fifth tiryak-srotas/Hairyag-yonya,
    the sixth urdhva-srotas as the creation of the gods, the seventh arvak-srotas
    as the creation of mankind, the eighth anugraha characterized by goodness and
    ignorance, and the ninth Prikrita/Vaikrita called Kaninara. It also classifies
    the last five creations as evolved from the Vikaras and the first three from Prakriti,
    and attributes the nine creations to Praja-pati.'
