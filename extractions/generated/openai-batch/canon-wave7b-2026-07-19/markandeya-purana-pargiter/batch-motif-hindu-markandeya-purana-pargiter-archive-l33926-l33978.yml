canonical_text:
  quote: ''
  summary: A king vows to imitate exemplary royal exploits, to perform repeated sacrifices
    at harvest times, and to restore tribute or wealth connected with brahmans and
    cattle. Markandeya says the pledge is fulfilled. The passage then gives a royal
    genealogy through a son by Pramatha, a Vidarbha princess named Fandini, and a
    son Yivimsa. During Yivimsa’s reign the earth is populous, rain comes in season,
    crops and nourishment abound, and wealth does not lead to debauchery.
  language: English
  quote_policy: summarized
