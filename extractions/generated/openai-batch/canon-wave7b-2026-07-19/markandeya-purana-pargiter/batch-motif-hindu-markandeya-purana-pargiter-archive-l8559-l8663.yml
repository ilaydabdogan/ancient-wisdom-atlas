canonical_text:
  quote: ''
  summary: 'Madalasa gives instructions for sraddha rites: arrangements of dvijas,
    monthly and annual rites for a single deceased person, offerings of pinda, sesamum-seed,
    water, arghya, and fire-oblations, rules for women and those without sons, the
    responsibility of relatives or the king when kin are absent, and the timing of
    the periodical sraddha at the new moon during the waning moon. The next canto
    begins with the Parvana Sraddha and mentions the father’s great-grandfather passing
    to another ancestral class after the sraddha to deceased sapindas.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage instructs that dvijas are to be arranged in pairs and worshipped
    by dextral circumambulation during the ceremony.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sraddha for a single deceased person is to be performed on the day of
    death with a single vessel and without the offering to the gods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The celebrant gives one pinda to the deceased near fragments of food, with
    sesamum-seed and water on the right, while recalling the deceased person’s name.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The celebrant says that the deceased may be exempt from decay, and the others
    say that enjoyment may be his.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Men are instructed to perform the rite every month for a year, and thereafter
    the sraddha for deceased sapindas is to be performed for the deceased according
