  summary: A female duck argues that pleasures are appropriate and that religious
    acts are performed for their sake. A duck replies that minds unattached to pleasures
    are with the Supreme Soul, warns that attachment to family leads to ruin, and
    cites Sva-rocis as sunk in affection. Sva-rocis hears the bird’s words, becomes
    disturbed, departs with his wives to another grove, practices severe austerities,
    and reaches pure worlds with stains removed.
