  quote: ''
  summary: 'The passage explains the reckoning of Brahma''s life: creation begins
    again, one of Brahma''s years passes, one hundred of his years make a Para, fifty
    years make a Parardha, one Parardha has elapsed, and the present second Parardha
    begins with the Varaha kalpa after the Padma Mahakalpa.'
