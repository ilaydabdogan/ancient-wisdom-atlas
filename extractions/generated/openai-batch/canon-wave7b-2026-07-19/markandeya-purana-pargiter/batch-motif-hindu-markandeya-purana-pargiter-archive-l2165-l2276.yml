canonical_text:
  quote: ''
  summary: Haris-candra's queen proposes that she be given in exchange for wealth
    so the king can pay a brahman fee. The king faints and laments; the queen laments
    his suffering and also faints, while their hungry child asks for food. Visvamitra
    arrives, revives the king with water, demands the fee, speaks about truth as supreme
    righteousness, and threatens a curse if the fee is not paid by sunset. The king
    then reluctantly goes to the city to announce that he will sell his wife.
  language: English
  quote_policy: summarized
