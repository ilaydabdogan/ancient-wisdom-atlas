canonical_text:
  quote: ''
  summary: The passage shifts from a request for instruction about later Manvantaras
    to Markandeya's narration of the Svarocisha Manvantara. A distinguished brahman
    of Aru^aspada wishes to see the earth. A guest skilled in medicinal herbs and
    magic explains that spells and herbs allow rapid travel, then gives him foot-ointment
    and advice. The brahman travels to Hima-vat, reaches its snowy heights, but the
    ointment is washed off by melting snow. He then beholds the mountain peaks associated
    with Siddhas, Gandharvas, Kin-naras, gods, heavenly beings, and Apsarases, and
    gazes in delight.
  language: English
  quote_policy: summarized
