canonical_text:
  quote: his mind felt no attachment to any other object
  summary: The passage opens Canto LXIX with a synopsis anticipating King Uttama's
    banishment of his queen, a brahman's appeal for recovery of a carried-off wife,
    and a hermitage censure. In the verse narrative, Kraushtuki asks Markandeya to
    recount the third manvantara named after Uttama. Markandeya introduces Uttama
    as a righteous royal son of Uttana-pada and Su-ruci, describes his marriage to
    Bahula, and emphasizes the king's exclusive and bodily affection for her. Bahula
    responds coldly to his words, gifts, kisses, and touch, yet his love increases.
  language: English
  quote_policy: quoted
