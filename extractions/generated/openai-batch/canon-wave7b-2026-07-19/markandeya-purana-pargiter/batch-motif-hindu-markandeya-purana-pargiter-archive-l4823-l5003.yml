canonical_text:
  quote: ''
  summary: In Canto XV, after moral traits of hell-released and heaven-released persons
    are described, a king in hell is asked by tormented men to remain because the
    air from his body relieves their pains. Yama's officer explains that the king's
    ritual and hospitable merit softens the instruments of hell. The king refuses
    to leave while others suffer. Dharma and Indra arrive to take him to heaven, but
    he asks that his own good deeds deliver the sinners. Indra declares the sinners
    delivered, flowers fall on the king, and Hari leads him to the heavenly chariot.
  language: English
  quote_policy: summarized
