  summary: The passage defines several types of human dwelling-places or settlements,
    including a kind of town with ministers and feudatory princes, the grama or village,
    the vasati made for business, the akrimi dependent on another grama, and the ghosha
    of cattle and herdsmen. It concludes that people made towns and other abodes,
    and houses for several couples.
