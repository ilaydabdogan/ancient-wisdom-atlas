canonical_text:
  quote: ''
  summary: 'The passage gives rules for a sraddha ceremony: substances, waters, milk,
    ground, persons, animals, and states of contamination are to be avoided; seclusion
    and sesame seed protect the rite; offerings made with faith by name and family
    become food for the Pitris; yogis should be fed first because they can save the
    sacrificer and feasters; and ancestral songs describe the Pitris’ desire for a
    son who will offer pinda and other foods.'
  language: English
  quote_policy: summarized
