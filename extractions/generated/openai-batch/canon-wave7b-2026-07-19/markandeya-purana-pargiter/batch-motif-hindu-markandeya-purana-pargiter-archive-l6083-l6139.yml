canonical_text:
  quote: ''
  summary: In a dialogue from the story of Kuvalayasva, the sons praise an absent
    man whose company makes other realms seem joyless. Their father praises the man
    as virtuous, learned, generous, and worthy of gifts in return. The sons answer
    that the man already honors all petitioners, possesses unmatched knowledge, and
    removes doubts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker says that attendance on, affection for, and pleasure with the absent
    man bring no delight in the Naga-world or the air-world, while separation makes
    Patala chill and union with him makes the daytime sun gladden them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father says the absent man is the happy son of a holy father because accomplished
    persons praise his excellencies even when he is absent.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The father contrasts people learned in the Sastras but evil-dispositioned
    with good-dispositioned fools, and esteems the person who has both scriptural
    knowledge and good disposition.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The father says a true son is one whose friends declare his friendly qualities
    and whose enemies declare his valor among the good.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father suggests that the absent man may have fulfilled a request as a
    benefactor, and says a high-born life is well lived when petitioners do not turn
    away and friends' petitions are not powerless.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The father says that household possessions such as gold, other metals, jewels,
    riding animals, seats, and other delightful things should be given to the absent
    man without hesitation.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The father condemns a person who fails to make a return to beneficent friends,
    and describes the wise man as cloud-like, showering benefits on friends and injury
    on foes.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The sons say that petitioners in the absent man's house are always honored
    with the grant of all their desires.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The sons ask where they could obtain in Patala the absent man's jewels, riding
    animals, seats, carriages, ornaments, and clothing.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The sons say that the absent man's knowledge is found nowhere else and that
    he is the ablest remover of doubts, even for the wise.
  category: speech
  evidence_refs:
  - ev:6
