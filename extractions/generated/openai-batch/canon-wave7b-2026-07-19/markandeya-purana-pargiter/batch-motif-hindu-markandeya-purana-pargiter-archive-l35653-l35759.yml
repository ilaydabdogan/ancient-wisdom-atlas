canonical_text:
  quote: ''
  summary: A heavenly speech foretells royal supremacy for a child. Avikshit returns
    to the city with his wife, infant son, brahmans, and Gandharvas, presents the
    child to king Karandhama, and the household and city rejoice. Karandhama honors
    the Gandharvas and gives wealth to brahmans. The boy grows, studies the Vedas,
    becomes skilled in weapons and archery, obtains weapons from Bhargava, and is
    praised as exceptionally accomplished.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speech from among the dwellers in heaven predicts that the child will be
    a universal monarch, enjoy the earth of seven continents, and hold supremacy among
    kings through valour and heroism.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Brahmans, Gandharvas, and the child's mother and father are gratified when
    they hear the heavenly speech.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Avikshit takes his beloved son, accompanied by his wife, brahmans, and Gandharvas,
    and goes to his city and father's palace.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Avikshit and his wife respectfully honor Karandhama's feet; Karandhama is
    seated on the throne of justice among kings.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Avikshit shows Karandhama the infant grandson, places the child on Karandhama's
    lap, and relates what had occurred.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Karandhama embraces his grandson with tears of joy, repeatedly calls himself
    fortunate, and honors the assembled Gandharvas with arghya and other presents.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The city rejoices at the birth of a son to its master; dancers perform with
    songs and instruments, and the king gives brahmans gems, riches, cattle, clothing,
    and ornaments.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The boy grows like the moon in its bright fortnight and becomes pleasing to
    his parents and desired by the people.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The boy learns the Vedas from religious teachers and becomes skilled in weapons,
