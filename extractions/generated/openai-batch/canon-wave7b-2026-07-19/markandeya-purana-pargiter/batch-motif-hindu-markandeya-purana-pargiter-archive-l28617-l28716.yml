canonical_text:
  quote: ''
  summary: The passage closes a section on Lakshmi as prosperity and ill fortune,
    then concludes the Devi-mahatmya. A rishi explains the goddess's world-upholding
    power and advises refuge in her. King Su-ratha and a vaisya undertake austerities
    on a river sand-bank, make an earthen image of the goddess, worship with ritual
    offerings, and offer blood from their own limbs. After three years Chandika appears,
    grants the king restoration and a future birth as Manu Savarni, and grants the
    vaisya liberating knowledge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lakshmi is described as bringing prosperity when present in human houses and
    becoming Ill Fortune when absent; worship with flowers, incense, perfumes, and
    offerings brings wealth, sons, and a righteous mind.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rishi states that the goddess upholds the world, confers knowledge, is
    Vishnu's Illusive power, can bewilder people, and grants enjoyment, Svarga, and
    final emancipation when propitiated.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: King Su-ratha prostrates before the severe-penance rishi and goes to perform
    austerities; the vaisya takes up a station on a sand-bank in a river to seek a
    vision of Amba.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king and the vaisya make an earthen image of the goddess on the sand-bank.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: They worship the image with flowers, incense, fire, and libations of water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: They abstain from food or restrict food, concentrate their minds on the goddess,
    and keep their thoughts composed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: They offer a bali offering sprinkled with blood drawn from their own limbs
    and continue this propitiation for three years.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Chandika becomes pleased, appears in visible form, and invites the king and
    the vaisya to receive what they seek.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The king asks for his present kingdom with enemies destroyed and for an imperishable
    kingdom in another life.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The vaisya asks for knowledge of what is mine and what I am, described as
    knowledge that causes the downfall of worldly attachments.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The goddess grants the king his own kingdom, a future life from Vivasvat,
    and the name Manu Savarnika; she grants the vaisya perfected knowledge.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: After giving the boons, the goddess vanishes while the two extol her; Su-ratha
