canonical_text:
  quote: ''
  summary: A sonless king practices restraint and austerities at a sin-destroying
    river to please Indra/Purandara. Indra, satisfied by the king’s praise, austerities,
    and faith, offers a boon. The king asks for a righteous, skillful, martial son
    with secure sovereignty. Indra grants the request; the king returns to his city,
    protects his people, performs sacrifice, and a son is born through Indra’s favour.
    The son is named Balasva and trained in weapons. A heading also says Balasva was
    later besieged by rebellious vassals, rescued by an army issuing from his distressed
    hands, and therefore named Karandhama.
  language: English
  quote_policy: summarized
