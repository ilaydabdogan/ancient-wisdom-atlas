canonical_text:
  quote: ''
  summary: The passage gives rules about who should not receive gifts, warns that
    reading or commissioning a reading of the Purana from corrupt motives leads to
    hell, and has Markandeya praise the Purana as righteous, protective, heaven-giving,
    and leading ultimately to supreme union with the universal soul.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage forbids making gifts to listed disqualified persons, including
    an atheist, one fallen from caste, contemners of the Vedas, religious preceptors,
    twice-born men, parents, scriptures, and rules of good breeding, and one who has
    broken vows.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prohibition on gifts to these persons is stated to hold even when one's
    life is at its last gasp.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person who reads this Purana, or causes it to be read, entirely through
    covetousness, infatuation, or fear is said to go to hell.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Markandeya states that the story is characterized by righteousness and bestows
    heaven and final emancipation from existence.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The person who hears or reads the story is said to achieve his earnest endeavor,
    avoid mental and bodily sickness, and be delivered from brahmanicide and other
    sins.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Good men become kindly friends to the hearer or reader, and enemies and robbers
    do not arise against him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The hearer or reader is described as not perishing from famines, sins involving
    others' wives or property, injury to others, or similar crimes, and as freed from
    many pains.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The hearer of the story is wished continual success, affluence, memory, peace,
    good fortune, nourishment, and contentment.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The man who hears the whole Markandeya Purana, and the one who recites the
    work properly, is described as not to be lamented.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The properly related beneficiary is described as endowed with purified perfection,
    present in Svarga and other worlds with Indra, enjoying desired delights and the
    earth, and then attaining supreme union with the universal soul.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
