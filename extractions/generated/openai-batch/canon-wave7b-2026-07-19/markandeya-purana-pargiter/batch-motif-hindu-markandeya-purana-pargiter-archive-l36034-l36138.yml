canonical_text:
  quote: ''
  summary: A reported message from the king's grandmother rebukes the king for disorder
    in the realm, lack of spies, and attachment to sensual enjoyment. The message
    says frenzied Nagas from Patala have poisoned and harmed ascetic households, bitten
    seven sons of munis, and defiled tanks and sacrificial clarified butter. It argues
    that although the munis have power to destroy the Nagas, the king has the authority
    to punish, protect the well-behaved, guard the earth and righteousness, and avoid
    sharing in the sin caused by unrestrained wickedness.
  language: English
  quote_policy: summarized
