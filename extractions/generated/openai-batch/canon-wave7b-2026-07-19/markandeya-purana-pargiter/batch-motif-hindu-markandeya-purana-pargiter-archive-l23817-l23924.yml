canonical_text:
  quote: ''
  summary: The passage introduces the Tamasa Manvantara narrative. King Svarashtra,
    formerly long-lived and powerful, loses his wives, servants, ministers, and people,
    is driven from his kingdom by a neighboring king, and becomes an ascetic on the
    Vitasta. During a great rainy-season flood he is carried away, seizes the tail
    of a doe, and is drawn through darkness to land and forest. He becomes enamoured
    of the doe, who speaks human language and reveals herself as his former beloved
    queen Utpalavati; the headnote states that she is deceased and in the shape of
    a doe, and that a son born from their union becomes Manu Tamasa.
  language: English
  quote_policy: summarized
