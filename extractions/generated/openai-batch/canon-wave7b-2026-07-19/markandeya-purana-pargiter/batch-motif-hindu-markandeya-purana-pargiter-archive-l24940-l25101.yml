  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Fifteen shreds of the Sun's splendour are said to be made into divine weapons,
    while the Sun bears only a sixteenth part.
  category: object
  evidence_refs:
  - ev:3
