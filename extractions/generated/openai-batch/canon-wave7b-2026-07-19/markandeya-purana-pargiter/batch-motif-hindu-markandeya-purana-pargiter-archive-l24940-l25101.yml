canonical_text:
  quote: ''
  summary: The passage continues the story of Sanjna in mare form and the Sun asking
    Visva-karman to reduce his splendour. A hymn praises the Sun as Vedic, luminous,
    cosmic, and life-giving. The Sun sheds splendour; its portions become earth, sky,
    heaven, and divine weapons. The Sun then takes horse form, meets Sanjna in mare
    form, and their encounter produces Nasatya and Dasra and then Revanta. The Sun
    reveals his true form and brings Sanjna home. The passage then assigns positions
    to Vaivasvata Manu, Yama, and Yamuna.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sanjna is described as being in mare shape, practising austerities among the
    Northern Kurus, with the stated wish that her husband become mild in body and
    beautiful in form.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sun asks Visva-karman, Sanjna's father, to pare down his splendour, and
    Visva-karman pares down the year-revolving Sun's splendour.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The gods and devarshis assemble and praise the Sun as having the nature of
