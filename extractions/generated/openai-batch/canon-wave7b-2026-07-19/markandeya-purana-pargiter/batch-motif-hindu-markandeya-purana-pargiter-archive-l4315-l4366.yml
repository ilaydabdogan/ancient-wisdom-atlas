canonical_text:
  quote: ''
  summary: 'A list of punishments for various sins: eyes and tongues are repeatedly
    torn out by terrible birds with adamant beaks; those who cause dissension are
    sawn; those who cause pain or deprive others of comforts are placed in meal and
    sand; one who eats another''s śrāddha is rent apart by birds; malicious speech
    and backbiting are punished by bird attacks or razors cutting the tongue.'
  language: English
  quote_policy: summarized
