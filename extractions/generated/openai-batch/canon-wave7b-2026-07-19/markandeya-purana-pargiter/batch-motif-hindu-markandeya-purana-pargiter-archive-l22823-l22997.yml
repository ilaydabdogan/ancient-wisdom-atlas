canonical_text:
  quote: "“Take this lady of evil heart to a desolate forest and abandon her forthwith”"
  summary: The king becomes enraged when his queen refuses a cup in public and orders
    her abandoned in a forest. Later, while still remembering her and taking no other
    wife, he hears a brahman whose wife has been carried off at night. The brahman
    argues that a king must protect his subjects in return for the sixth part of their
    wealth and that a wife must be guarded to preserve offspring, ritual duty, caste
    order, and ancestors. The king sets out with him, reaches a forest hermitage,
    and asks a rishi about the abducted wife.
  language: English
  quote_policy: quoted
