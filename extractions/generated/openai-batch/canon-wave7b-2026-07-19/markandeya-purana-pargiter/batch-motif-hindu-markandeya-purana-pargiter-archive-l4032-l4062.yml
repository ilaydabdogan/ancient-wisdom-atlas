  summary: The passage describes hellish punishments. In Asi-patra-vana, dogs tear
    limbs from wailing bodies. The speaker then describes Tapta-kumbha, where heated
    pitchers surrounded by fire contain boiling substances; workers of iniquity are
    thrown in by Yama's servants, boiled, pulled out and dropped back by vultures,
    and churned in boiling oil.
