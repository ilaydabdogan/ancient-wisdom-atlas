canonical_text:
  quote: ''
  summary: 'The passage describes stages in creation: Gandharvas are born from the
    creator while he drinks speech; the lord or Brahma creates birds, cattle, animals,
    plants, and fruit-trees from parts of his body; domestic and wild animal classes
    issue forth at the beginning of the kalpa and Treta Age; and the lord performs
    sacrifice and fashions Vedic hymns, metres, samans, and verses from his mouths
    for sacrificial use.'
