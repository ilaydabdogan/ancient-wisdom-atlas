canonical_text:
  quote: ''
  summary: The birds narrate that King Haris-candra, glad at a preceding speech, offers
    Visvamitra whatever gift he desires. Visvamitra asks first for the fee of the
    Raja-suya sacrifice, then demands the earth, kingdom, army, treasury, and possessions,
    except the king’s wife, son, body, and virtue. The king agrees. Visvamitra then
    orders him to leave the realm, remove his ornaments, and wear bark garments with
    his wife Saivya and young son. As the king departs, Visvamitra blocks him and
    demands the sacrificial fee. Haris-candra says that only their three bodies remain
    and asks for time; Visvamitra threatens him with the fire of a curse, and Haris-candra
    promises to pay within a month.
  language: English
  quote_policy: summarized
