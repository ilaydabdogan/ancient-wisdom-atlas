canonical_text:
  quote: ''
  summary: A canto heading announces the continued story of Kuvalayasva and the recovery
    of Madalasa. After a banquet, the Naga king receives Kuvalayasva, treats him affectionately
    as his sons' friend, and offers him wealth or any hard-to-obtain gift. Kuvalayasva
    replies that he needs no wealth because his father and the Naga king both rule
    prosperously and because he is already gratified by touching the Naga king's feet
    and body. The Naga king then repeats that, if wealth is not desired, Kuvalayasva
    may name whatever else pleases him.
  language: English
  quote_policy: summarized
