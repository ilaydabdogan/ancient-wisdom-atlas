canonical_text:
  quote: ''
  summary: In a continued dialogue, Jada narrates that a king respectfully addresses
    the brāhman Dattatreya. The king speaks of freedom from affliction through right
    understanding and detachment from pleasure and pain. Dattatreya affirms him and
    teaches that the thought of possession is the root of pain, while non-possession
    brings calmness. He develops a parable in which the thoughts of “I” and “mine”
    become a tree whose boughs, shoots, leaves, flowers, and fruit are worldly attachments
    and their results, obstructing final emancipation.
  language: English
  quote_policy: summarized
