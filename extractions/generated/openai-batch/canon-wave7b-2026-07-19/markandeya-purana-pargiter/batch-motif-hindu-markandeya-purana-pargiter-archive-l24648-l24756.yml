canonical_text:
  quote: ''
  summary: Ananda reflects on kinship across recurring births, asks that the king’s
    son C'aitra be brought from Visala, and departs for the forest after the king
    relinquishes claims over him and installs C'aitra. Ananda practices austerities
    to consume fettering actions; Praja-pati/Brahma questions him and commands him
    to become the sixth Manu, after which he is known as Manu C'akshusha. The passage
    then summarizes C'akshusha’s marriage, sons, gods, Indra, rishis, and the kings
    of the sixth manvantara, before transitioning to Vaivasvata Manu.
  language: English
  quote_policy: summarized
