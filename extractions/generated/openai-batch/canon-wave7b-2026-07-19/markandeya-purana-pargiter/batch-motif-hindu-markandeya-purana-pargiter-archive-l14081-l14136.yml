canonical_text:
  quote: ''
  summary: The passage lists several harmful or omen-bearing beings, mostly named
    as sons, and gives remedies or rules for responding to them. It describes protection
    for a sleeping child against an attack, the figure Ukti who assigns good and bad
    fortune through speech, Parivartaka who interchanges foetuses and words, a wind-like
    son who signals fortune through bodily throbbings, and Sakuni who gives omens
    through birds or food. Remedies include white mustard, medicinal herbs, scripture
    recitation, praise to deities, Rakshasa-destroying prayers and spells, and kusa
    grass.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'A remedy against an attack from Dahsalia is prescribed for men: white mustard
    is to be cast on the bed and teeth of a sleeping child, the child is to be bathed
    with splendid medicinal herbs, good scriptures are to be recited, and the child
    is to be supported on specified objects.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The second son assigns good and bad fortune to men while repeatedly saying
    “let it be so,” and is called Ukti.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wise men are instructed to say an auspicious formula concerning fate, and
    when something bad is heard or spoken, praise is to be offered to Sira, Brahma,
    and the speaker’s own family-deity.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Parivartaka is said to delight in interchanging the foetus between one womb
    and another and in interchanging the words in the mouth of a speaker.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Protection against Parivartaka is prescribed by means of white mustard and
    prayers and spells that destroy Rakshasas.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Another son, described as like the wind, announces good and bad fortune by
    throbbings in men’s bodies, and the remedy against him is to strike the side of
    the body with kusa grass.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Sakuni, stationed on a crow or another bird, announces weal or woe by means
