canonical_text:
  quote: ''
  summary: The passage introduces the birth account of the fifth Manu, Raivata. A
    rishi named Rita-vac has a son born at the end of the constellation Revati; after
    rites and investiture the son proves wicked, while his parents suffer illness.
    The rishi laments that a bad son causes grief to parents and downfall to ancestors.
    The canto summary also states that the constellation Revati was cursed to fall,
    a daughter named Revati was born from it and adopted by Pramuca, King Durgama
    married her, the constellation was restored at the marriage, and their son was
    Manu Raivata.
  language: English
  quote_policy: summarized
