  summary: The passage explains an astrological scheme in which countries and people
    are affected by the occultation, ascendancy, or unfavorable placement of constellations
    and planets. Planetary lordship over constellations is connected with the fortunes
    of corresponding countries, and human fear or prosperity may arise from shared
    region, ruler, personal condition, or shared celestial influence.
