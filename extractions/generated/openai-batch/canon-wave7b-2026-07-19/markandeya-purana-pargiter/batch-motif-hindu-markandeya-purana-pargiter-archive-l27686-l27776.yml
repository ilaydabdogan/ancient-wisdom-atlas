canonical_text:
  quote: ''
  summary: The king asks what Sumbha and Nisumbha did after Rakta-vija was slain.
    The rishi narrates that Sumbha and Nisumbha, enraged at the destruction of their
    army, advance with Asura forces against the goddess. Candika counters their arrows
    and weapons. Nisumbha attacks the goddess's lion and then hurls several weapons,
    but the goddess destroys them and brings him down. Sumbha advances after his brother
    falls, appearing in a chariot with eight armed hands raised. The goddess, her
    lion, Kali, and Siva-duti produce overwhelming sounds that weaken or drown out
    the demonic forces.
  language: English
  quote_policy: summarized
