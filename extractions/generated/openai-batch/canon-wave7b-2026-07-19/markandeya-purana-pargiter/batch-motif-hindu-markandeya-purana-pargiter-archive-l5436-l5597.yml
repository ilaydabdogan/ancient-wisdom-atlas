canonical_text:
  quote: ''
  summary: The passage recounts the divine birth of Atri and Anasuya's three sons,
    Soma, Dattatreya, and Durvasas, identified with portions of Brahma, Vishnu, and
    Siva. It describes their offices, then narrates Dattatreya's long immersion in
    a lake and his testing of young Munis' loyalty through the presence of his wife
    and sensual conduct. The next canto begins with Arjuna being invited to kingship
    and speaking about rightful rule and taxation; its synopsis anticipates a narrative
    in which Dattatreya destroys demons who seize Lakshmi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Atri, described as a praja-pati and second son of Brahma, looks upon his wife
    Anasuya after her menstruation and mentally enjoys her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A powerful wind and the ten regions of the sky are involved in the generation
    of Soma, who is begotten in Anasuya as Atri's son.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Vishnu, being pleased, begets Dattatreya from his own body; Dattatreya suckles
    Anasuya and is called Vishnu incarnate and Atri's second son.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A portion of Siva is born as Durvasas in a context of anger, indignation,
    and a desire to burn the haughty king of the Haihayas.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The three sons are identified as portions of Brahma, Vishnu, and Siva, with
    Brahma becoming Soma, Vishnu becoming Dattatreya, and Siva becoming Durvasas.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Soma abides in svarga and causes creepers, medicinal plants, and mankind to
    grow with his cool rays.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Dattatreya protects offspring from destruction by malignant Daityas and is
    described as a benefactor of the docile.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Durvasas destroys the scorner, assumes a formidable body, and roams the earth
