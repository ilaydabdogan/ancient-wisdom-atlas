  confidence: high
  cautions: The passage gives fuller birth detail for Dattatreya and Durvasas than
    for Soma; theological identification should not be generalized beyond the passage.
- id: motif:2
  label: miraculous divine child of Vishnu
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: Dattatreya is begotten by Vishnu from his own body, suckles Anasuya, and
    is called Vishnu incarnate.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage identifies Dattatreya as divine but does not narrate a long
    childhood cycle.
- id: motif:3
  label: ascetic master tests followers through withdrawal and transgression
  taxonomy_refs:
  - initiation
  - duality
  basis: The synopsis says Dattatreya tested the young Munis' loyalty; the verses
    show him remaining in a lake, emerging with his wife, drinking liquor, and engaging
    in sensual pleasures while the young Munis do not forsake him.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  - ev:17
  confidence: high
  cautions: The passage frames the act as a loyalty test and detachment episode, but
