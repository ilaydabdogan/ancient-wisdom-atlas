  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The youthful Munis remain on the bank of the lake and do not forsake Dattatreya
    for a hundred heavenly years.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Dattatreya emerges from the water with his wife, hoping that the young Munis
