canonical_text:
  quote: ''
  summary: Jaimini, disciple of Vyasa, enters a cave on the Vindhya mountain and meets
    learned bird-brahmans, identified as Drona's sons who were cursed by their father
    and turned into birds. They receive him with ritual hospitality, praise the sight
    of him as quenching their father's anger, and ask why he has come. Jaimini explains
    that Markandeya directed him to them for answers to doubts concerning the Mahabharata.
    The birds state their knowledge of the Vedas and related texts and invite his
    questions, which concern Vasudeva's humanity, Draupadi's marriage to the five
    Pandavas, and Baladeva's pilgrimage for expiation.
  language: English
  quote_policy: summarized
