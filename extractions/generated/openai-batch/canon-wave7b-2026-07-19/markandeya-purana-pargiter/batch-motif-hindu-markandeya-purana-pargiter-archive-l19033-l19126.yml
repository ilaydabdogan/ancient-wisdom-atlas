canonical_text:
  quote: ''
  summary: The passage is a catalogue of countries and peoples associated with Madhya-desa,
    accompanied by translator notes identifying places and traditions. It lists groups
    including the people of Mathura, Dharmaranyas, Jyotishikas, Gaura-grivas, Gudas,
    Asmakas, Vaidehakas, Pancalas, Sanketas, Kaukas, and Mamtas. Notes discuss Mathura
    and traditions about Madhu, Lavana, Satrughna, Rama, and later Yadava succession;
    identify Dharmaranya and other groups; and describe Pancala’s boundaries, genealogy,
    division into northern and southern kingdoms, and later political redivision by
    Drona.
  language: English
  quote_policy: summarized
