canonical_text:
  quote: ''
  summary: A didactic passage describes duties of the householder, then the forest-dweller,
    then the fourth-period mendicant. The householder feeds and honors ancestors,
    gods, guests, kin, dependants, vulnerable people, animals, and birds, observes
    proper sexual conduct, and maintains sacrifices. The forest-dweller enters that
    period after seeing offspring and bodily aging, practices penance, study, ritual,
    ablution, meditation, and ascetic dress for purification. The mendicant renounces
    associations, controls anger and senses, avoids settled residence and undertakings,
    begs once daily, and seeks knowledge of the soul.
  language: English
  quote_policy: summarized
