canonical_text:
  quote: ''
  summary: In a burning-ground, the king and queen encounter their dead son and fall
    into grief and fainting. The king laments the child, including his own sale of
    the child and the loss of his kingdom, and describes Fate as a serpent that has
    bitten the child. The queen recognizes the king as Hari-candra, sees his low-outcaste
    staff and loss of royal insignia, laments his degradation, describes the dreadful
    cremation-ground setting, and questions whether righteousness has any power in
    such suffering.
  language: English
  quote_policy: summarized
