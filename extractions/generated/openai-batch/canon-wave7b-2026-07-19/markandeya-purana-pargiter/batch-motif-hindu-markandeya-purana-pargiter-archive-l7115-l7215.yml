canonical_text:
  quote: ''
  summary: Jada narrates that, after being praised, the goddess Sarasvati, described
    as Vishnu's tongue, answers the high-souled Naga Asvatara. She offers him a boon.
    Asvatara asks for Kambala, his former companion, and asks that both receive conversance
    with all sounds. Sarasvati grants them knowledge and performance of many musical
    categories, including seven notes, seven modes, seven songs, modulations, forty-nine
    musical times, three octaves, forms of quarter-verse, tunes, musical movement,
    and pauses.
  language: English
  quote_policy: summarized
