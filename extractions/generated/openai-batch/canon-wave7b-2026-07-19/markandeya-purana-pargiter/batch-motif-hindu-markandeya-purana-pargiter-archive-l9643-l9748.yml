  summary: A didactic passage gives rules for ritual rinsing, purity, conduct at specific
    times, worship obligations, marriage and sexual restrictions, reverence toward
    sacred persons and texts, and avoidance of improper speech, dress, seats, and
    companions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The instructed man is told to perform worship, fire ceremonies, salutation
    to his guru, and eating only after rinsing his mouth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rinsing is prescribed while facing east or north, using frothless, inodorous,
    pure, holy water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage forbids using five kinds of earth, including earth from beneath
    water, habitations, ant-hills, mouse-infested ground, and places of purificatory
    actions.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: After washing hands and feet and sprinkling water, the man is instructed to
    rinse with composed mind, drink water several times, and wipe parts of the mouth,
    body apertures, and head.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After rinsing and becoming pure, the man is told to perform ceremonies for
    gods, rishis, and pitris diligently.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After sneezing, spitting, vomiting, licking, or putting on clothing, the man
    is told to rinse his mouth, touch a cow’s back, look at the sun, and hold up his
    right ear when needed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage forbids gnashing the teeth, beating one’s own body, sleep, reading,
    and food at both twilights, and sexual intercourse and travel at evening twilight.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage assigns worship to gods in the forenoon, to men at noon, and to
    pitris in the afternoon.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: With the head bathed, the man is told to perform ceremonies to gods or pitris
    and to trim his beard facing east or north.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage lists conditions under which a maiden should be avoided and describes
    auspicious qualities in a maiden to marry.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The man is instructed to marry a woman at a specified degree of kinship distance
    from his parents, guard his wife, and avoid jealousy.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage instructs avoidance of deeds causing pain to others and of inflicting
    pain on living creatures.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: A menstruating woman is to be avoided for four nights, and the fifth night
    of the moon is to be avoided in relation to offspring.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage says sons are begotten on even nights and daughters on odd nights,
    and recommends even-night cohabitation for one who wishes for a son.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: After shaving, vomiting, and sexual intercourse, the wise man is told to go
    to the place where bodies are burnt and bathe while keeping his clothes on.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: The passage forbids reviling or ridiculing gods, Vedas, dvijas, good and truthful
    men, a guru, devoted virtuous wives, sacrificers, and ascetics, and forbids listening
    to those who do so.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:17
  text: The passage forbids mounting a high or low bed or seat, unbecoming dress and
    speech, and prescribes pure white raiment and white flowers.
  category: action
  evidence_refs:
  - ev:12
- id: obs:18
  text: The passage says a wise man should not form friendship with haughty, insane,
