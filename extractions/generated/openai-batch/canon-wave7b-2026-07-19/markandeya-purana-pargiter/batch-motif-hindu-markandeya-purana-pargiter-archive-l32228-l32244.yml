canonical_text:
  quote: ''
  summary: The passage praises a poem or majesty of the Sun. Repetition of its verses
    at the three twilights destroys sin; reciting the whole majesty in a sanctuary
    of the Sun ensures the Sun's presence there. A brahman is instructed to retain
    and mutter the poem to gain merit. Listening to the poem for three days is said
    to yield the same merit and reward as gifting a fine milch cow with gilded horns.
