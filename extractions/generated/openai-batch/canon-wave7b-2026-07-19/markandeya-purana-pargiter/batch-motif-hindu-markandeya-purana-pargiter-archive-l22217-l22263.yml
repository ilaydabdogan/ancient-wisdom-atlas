canonical_text:
  quote: ''
  summary: An unnamed wife-speaker praises exclusive mutual devotion between herself
    and her husband. Markandeya then narrates that Sva-rodis, who understands the
    speech of living creatures, is ashamed after hearing this. A hundred years later,
    while Sva-rodis sports on a great mountain with his wives, he sees a buck among
    does; the buck tells the does that he is not like Sva-rodis and criticizes erotic
    attachment to many partners as laughable and harmful to righteousness and the
    future world.
  language: English
  quote_policy: summarized
