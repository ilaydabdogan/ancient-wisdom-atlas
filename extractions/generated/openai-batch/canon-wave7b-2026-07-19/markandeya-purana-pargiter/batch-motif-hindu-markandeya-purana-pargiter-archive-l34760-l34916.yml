canonical_text:
  quote: ''
  summary: Karandhama is urged to battle, arrays his army, and fights the kings aligned
    with Visala for three days until Visala approaches with an arghya offering and
    releases Karandhama's son. When Visala brings his daughter forward for marriage,
    Avikshita refuses her because he has been defeated before her eyes. The maiden
    defends his heroism, says many opponents conquered him unrighteously, and declares
    that no other man shall be her husband. Visala and Karandhama both urge the marriage,
    but Avikshita remains determined, and Visala tells his daughter to choose another
    husband.
  language: English
  quote_policy: summarized
