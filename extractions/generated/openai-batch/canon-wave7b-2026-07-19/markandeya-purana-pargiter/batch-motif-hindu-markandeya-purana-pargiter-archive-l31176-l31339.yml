canonical_text:
  quote: ''
  summary: Chaya curses Yama after he raises his foot against her; Yama appeals to
    his father, the Sun, who says a mother's curse cannot be revoked but can be fulfilled
    in a mitigated way. The Sun discovers that Chaya is not Sanjna, hears from Visvakarman
    that Sanjna left because she could not endure the Sun's form, and permits Visvakarman
    to pare down his glory. As the Sun whirls on the wheel, the worlds, waters, mountains,
    stars, and clouds are thrown into disorder, and gods and sages praise the Sun
    and ask for peace.
  language: English
  quote_policy: summarized
