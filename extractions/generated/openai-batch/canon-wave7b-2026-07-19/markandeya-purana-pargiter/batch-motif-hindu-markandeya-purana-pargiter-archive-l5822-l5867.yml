canonical_text:
  quote: ''
  summary: The passage opens the episode of Dattatreya. King Arjuna, son of Kritavirya,
    follows remembered counsel, goes to Dattatreya's hermitage, worships him with
    service and offerings, and receives a response. Dattatreya presents himself as
    reproached for spirituous liquor, bodily pleasures, and having his wife beside
    him. Arjuna rejects this as illusion, declares Dattatreya sinless and the brahman
    lady the path of all existence. Dattatreya is pleased that Arjuna has declared
    his secret and invites him to choose a boon.
  language: English
  quote_policy: summarized
