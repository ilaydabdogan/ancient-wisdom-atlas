canonical_text:
  quote: ''
  summary: A son refuses a course of life dependent on his father's rescue or glory
    and expresses shame at having been delivered by his father. After repeated exhortation,
    the king appoints Marutta to the kingdom; Marutta receives sovereignty from his
    grandfather with his father's authorization and rules well. Karandhama and Vira
    depart to the forest for austerities; after a thousand years Karandhama dies and
    gains Indra's world. Vira continues austerities for another hundred years at Bhargava
    hermitage, marked by ascetic appearance and diet, hoping to reach the same world
    as her husband.
  language: English
  quote_policy: summarized
