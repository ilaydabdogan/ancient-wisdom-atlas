canonical_text:
  quote: ''
  summary: A king threatens an unnamed man who has bound fire in his garment. Visvamitra
    hears the king’s speech and becomes enraged; the king is terrified, trembles,
    prostrates, and pleads that he is acting according to royal duty. Visvamitra questions
    him about the duties of giving, protecting, and waging war. Haris-candra answers
    that gifts are owed especially to brahmans and the needy, protection to the fearful,
    and war to enemies. Visvamitra then identifies himself as a brahman desiring a
    reward and asks for the fee.
  language: English
  quote_policy: summarized
