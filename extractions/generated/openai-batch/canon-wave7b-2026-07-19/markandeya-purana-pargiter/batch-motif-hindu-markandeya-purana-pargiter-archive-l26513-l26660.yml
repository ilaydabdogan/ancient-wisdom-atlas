canonical_text:
  quote: ''
  summary: The gods praise Candika/Ambika after the defeat of the Asura Mahisha, describing
    her as both fierce in battle and compassionate toward slain enemies by leading
    them to heaven. They ask her to protect them in all directions with her weapons
    and forms. The gods honor her with celestial offerings; she grants a boon, and
    they ask that future remembrance of her remove calamities and that mortals who
    praise her prosper. Bhadrakali agrees and vanishes. The rishi then summarizes
    her origin from the gods' bodies and a later manifestation from Gauri's body to
    destroy Sumbha and Nisumbha and preserve the worlds.
  language: English
  quote_policy: summarized
