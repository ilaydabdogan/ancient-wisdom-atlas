canonical_text:
  quote: ''
  summary: Kundala explains Surabhi’s prophecy that the Danava will not obtain the
    maiden and that the mortal who wounds him with arrows will become her husband.
    Kuvalayasva recounts being sent to protect ascetics, wounding the Danava in boar
    form, pursuing him on horseback, falling into a chasm, and reaching a palace.
    Kundala confirms the prophecy, a marriage ceremony is performed with fire and
    mantras, and Kundala prepares to depart for austerities and pilgrimage purification
    while reminding the hero of a husband’s duty to protect his wife.
  language: English
  quote_policy: summarized
