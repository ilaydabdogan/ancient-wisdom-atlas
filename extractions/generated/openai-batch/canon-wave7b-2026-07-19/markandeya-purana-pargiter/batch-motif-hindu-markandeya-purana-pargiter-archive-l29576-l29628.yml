canonical_text:
  quote: ''
  summary: A brief opening fragment says that someone failed to obtain a desire and
    ceased austerities. Bhuti, invited by his brother Su-varcas to a sacrifice, instructs
    his disciple Santi to guard the fire in his hermitage so that it is not extinguished.
    Bhuti departs after Santi assents. While Santi is gathering fuel, flowers, fruit,
    and other items and attending to his guru's business, the fire goes out. Santi
    becomes distressed and fears Bhuti's anger, curse, and supernatural perception
    if he finds the fire extinguished or if Santi kindles another fire.
  language: English
  quote_policy: summarized
