canonical_text:
  quote: ''
  summary: 'The Birds close a discourse attributed to Markandeya. They say Markandeya
    dismissed Kraushtuki and performed a mid-day ceremony; they learned the teaching
    from him and now declare it to Jaimineya. The discourse is traced back to the
    Self-existent One and praised as sacred, purifying, life-giving, beneficial for
    human aims and final emancipation, and able to free readers and hearers from sin.
    The Birds also recall the four questions that structured the preceding discourse:
    a father-son conversation, creation by the Self-existent One, the administrations
    of the Manus, and the exploits of kings.'
  language: English
  quote_policy: summarized
