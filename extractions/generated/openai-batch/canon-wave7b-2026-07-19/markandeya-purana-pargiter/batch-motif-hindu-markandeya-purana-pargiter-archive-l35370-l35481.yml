canonical_text:
  quote: ''
  summary: The gods identify the maiden as the prince’s wife, state that she has practiced
    austerities for his sake, and prophesy a heroic universal-monarch son. The maiden
    recounts leaving her kin after being forsaken, being prevented by a divine messenger
    from abandoning her body, being dragged through bathing water by an old Naga to
    Rasatala, receiving a petition from Naga women to restrain her future son, accepting
    their request, and receiving divine ornaments before being returned. Dfidha-kesa
    then tries to carry her off, but the prince rescues her. The following canto synopsis
    says Avikshit agrees to marry her, Gandharvas reveal her background, and she later
    bears Marutta.
  language: English
  quote_policy: summarized
