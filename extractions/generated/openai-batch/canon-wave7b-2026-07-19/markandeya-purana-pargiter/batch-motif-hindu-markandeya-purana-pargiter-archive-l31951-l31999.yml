canonical_text:
  quote: ''
  summary: A hymn praises the Sun under several names and attributes. The Sun is described
    as a world-ending fire, a sacrificial and salvific presence, a sky-traversing
    deity connected with hymns as horses, and a reverent circumambulator of Meru.
    The passage identifies the Sun with major deities, elements, heavenly bodies,
    plants, moral forces, and the body and life of the worlds, and closes with a prayer
    for grace from the Sun in luminous and lunar forms from which the universe is
    fashioned as Agni and Soma.
  language: English
  quote_policy: summarized
