canonical_text:
  quote: ''
  summary: The passage introduces Nabhaga, son of Dishta, within a royal-warrior genealogy.
    Nabhaga sees a vaisya maiden, falls under the power of love, and asks her father
    for marriage. The maiden’s father responds deferentially, noting the social hierarchy
    between royal nobles and tax-paying dependants. The canto synopsis adds that the
    proposed marriage is referred to the king and sages, that a condition involving
    prior marriage to a kshatriya maiden is rejected, and that Nabhaga is treated
    as having become a vaisya.
  language: English
  quote_policy: summarized
