canonical_text:
  quote: ''
  summary: A princess, rejected by Avikshita and released by her relatives, goes to
    the forest and performs severe austerities until she becomes emaciated and resolves
    to abandon her body. The gods send a heavenly messenger who tells her not to die,
    prophesies that she will become mother of a universal monarch, and instructs her
    to remain in the forest and nourish herself. She objects that she has vowed to
    accept no husband but Avikshita, who does not want her. The messenger repeats
    that a son will be born and departs; she begins to restore her body. The next
    canto opens with Avikshita’s mother Vira preparing a difficult ‘What-want-ye?’
    penance or fast.
  language: English
  quote_policy: summarized
