canonical_text:
  quote: "“Let my elder brother come to me with affection and ask for the kingdom
    for himself.”"
  summary: Subahu, supported by the king of Kasi, seeks Alarka’s kingdom. Alarka refuses
    to surrender through fear and says his elder brother should ask directly and affectionately.
    The king of Kasi attacks, uses alliances and political tactics, and blockades
    Alarka’s city, leaving him distressed and depleted. Alarka then remembers a ring
    from his mother Madalasa, purifies himself, addresses brahmans, and reads its
    inscribed counsel about avoiding association except with the good.
  language: English
  quote_policy: quoted
