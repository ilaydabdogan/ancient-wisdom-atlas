canonical_text:
  quote: ''
  summary: Sva-rocis settles his sons in cities and sports with his wives. While hunting,
    a doe asks him to shoot her, explaining that she desires him and cannot live without
    him. He questions union between a human and a doe, but embraces her; she then
    assumes a heavenly body and reveals herself as the goddess of the forest, acting
    under the gods' command that a Manu be begotten from her by him. A son is born
    with auspicious marks and splendor, accompanied by celestial music, song, dance,
    water-sprinkling, and flower-showers. Sva-rocis names him Dyuti-mat, and he becomes
    known as Svarocisha. A subsequent scene begins with Sva-rocis seeing a duck with
    his mate by a mountain cascade.
  language: English
  quote_policy: summarized
