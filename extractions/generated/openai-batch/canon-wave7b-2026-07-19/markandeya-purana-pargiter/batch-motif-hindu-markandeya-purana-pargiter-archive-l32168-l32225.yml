canonical_text:
  quote: ''
  summary: The king Rajya-vardhana and Manini practice severe austerities while worshipping
    the Sun. After more than a year, the Sun is pleased and grants the king a boon
    for the benefit of his dependants, citizens, subjects, and sons. The king returns
    to his city, rules righteously, performs sacrifices, gives gifts, enjoys life
    with Manini, and remains youthful for ten thousand years. Pramati, a Bhargava,
    praises the power of faith in the Sun to increase the king’s life and that of
    his people. The passage concludes that hearing, reading, or holding fast to the
    story of the Sun’s majesty brings release from sins, health, riches, and auspicious
    rebirth.
  language: English
  quote_policy: summarized
