    Om.
  summary: Dattatreya explains that the yogi established in religious devotion beholds
    the Supreme Soul present in all forms and should utter and study the sacred syllable
    Om. The passage describes Om as composed of three letters and three instants associated
    with goodness, passion, and ignorance, plus a qualityless half-instant understood
    only by yogis and uttered in the gandhara note.
