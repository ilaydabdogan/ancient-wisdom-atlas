canonical_text:
  quote: ''
  summary: 'A questioner asks how a woman was gained through the destruction of Kujrimbha.
    Markandeya begins the story: King Viduratha, while hunting, sees a great pit like
    the earth’s mouth and thinks it may lead to Patala. He asks the ascetic brahman
    Suvrata about it. Suvrata explains that the fierce Danava Kujrimbha dwells in
    Rasatala, makes the earth yawn, stole the club Sunanda made by Tvashtri, and uses
    it from within Patala to cleave the earth and make exits for Asuras.'
  language: English
  quote_policy: summarized
