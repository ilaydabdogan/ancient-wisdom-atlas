canonical_text:
  quote: ''
  summary: The prince obeys his father, encounters Tala-ketu disguised as a Muni on
    the Yamuna bank, gives him his neck-ornament, and guards the hermitage. Tala-ketu
    goes to the prince's town and reports that Kuvalayashva has died in battle, leaving
    the ornament as proof. The household grieves; Madalasa sees the ornament, hears
    that her husband has been slain, and dies. The king then reflects on fate, transience,
    obedience, and wifely devotion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king's son follows his father's directions, travels the whole earth, does
    obeisance to his father's feet daily, and spends the rest of the day with the
    slender-waisted woman.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the bank of the Yamuna, the prince sees Tala-ketu, Patalaketu's younger
    brother; the passage identifies Tala-ketu as a wily Danava who has assumed a Muni's
    shape.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tala-ketu asks the prince for the ornament around his neck, says it is needed
    as gold for ritual purposes, and asks the prince to guard the hermitage while
    he worships in the water.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The prince gives the neck-ornament and promises to remain near the hermitage
    so that no one will molest it until Tala-ketu returns.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tala-ketu plunges into the river while the prince guards the magic-raised
    hermitage; then Tala-ketu goes from the river to the prince's town and speaks
    before Madalasa and others.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Tala-ketu reports that Kuvalayashva was pierced in the breast with a spear
    while fighting a magic-using Daitya, gave him the neck-ornament while dying, was
    given to the fire by ascetics, and had his horse led away by a cruel Danava.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: After speaking, Tala-ketu leaves the ornament on the ground and departs; the
    people present faint, recover consciousness, and lament.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Madalasa sees the neck-ornament, hears that her husband has been slain, and
    gives up her life.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The king addresses the people after Madalasa's death, saying that relations
    are fleeting, events occur as fated, the prince died obeying his command, and
    a woman has no deity besides her husband.
  category: speech
  evidence_refs:
  - ev:7
