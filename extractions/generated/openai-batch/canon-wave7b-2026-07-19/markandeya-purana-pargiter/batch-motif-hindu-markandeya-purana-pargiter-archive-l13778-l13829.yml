  summary: A speaker addresses the goblin Duhsaha and assigns to him defective, contemptuous,
    corrupt, or improperly performed gifts, sacrifices, rites, studies, and ceremonies.
    The speaker says Duhsaha will gain power among people who commit specified ritual
    or social transgressions, and describes his activity and dwelling in social dissension,
    disrupted cookery, household wrangling, unsprinkled rooms at twilight, death,
    and eclipses.
