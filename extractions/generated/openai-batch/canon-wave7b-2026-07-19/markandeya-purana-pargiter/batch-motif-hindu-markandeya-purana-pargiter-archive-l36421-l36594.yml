canonical_text:
  quote: ''
  summary: Avikshit and Marutta dispute whether the Nagas who have sought refuge should
    be protected or punished. Sages intervene, the Nagas promise to restore bitten
    brahmans to life, and the conflict ends after the Nagas use divine herbs and remove
    poison. Marutta bows to his parents, is blessed, departs with Avikshit, and is
    later described as a righteous universal king with wives, sons, and descendants.
  language: English
  quote_policy: summarized
