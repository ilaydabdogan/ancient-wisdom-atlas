canonical_text:
  quote: ''
  summary: 'The passage gives instructions for completing a śrāddha ritual: the celebrant
    pays and addresses brahmans, asks for benedictions, dismisses them respectfully,
    performs further ceremonies, feeds guests, eats the remaining rice with attendants,
    and observes rules concerning pure ritual items, avoided behaviors, and the use
    of a silver vessel for offerings to the pitṛs.'
  language: English
  quote_policy: summarized
