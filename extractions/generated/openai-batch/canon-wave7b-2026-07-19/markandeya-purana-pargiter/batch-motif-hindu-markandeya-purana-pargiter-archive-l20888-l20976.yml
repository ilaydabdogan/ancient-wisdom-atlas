canonical_text:
  quote: ''
  summary: The passage gives astrological instructions about countries, constellations,
    planetary occultations, and popular rumours; prescribes propitiatory rites to
    pacify harms from planets and constellations; and describes a cosmic Tortoise
    identified with Narayana, in whose body gods, countries, constellations, zodiac
    signs, and planets are arranged. It ends by identifying the foot of Vishnu amid
    the planets with Brahma.
  language: English
  quote_policy: summarized
