canonical_text:
  quote: ''
  summary: The passage opens a canto in praise of the Sun. Kranshtuki asks Markandeya
    to recount the majesty of the primeval god Vivasvat. Markandeya begins a story
    about the famous king Rajya-vardhana, son of Dama, whose righteous rule protects
    the earth, brings prosperity, and removes portents, sickness, serpent-fear, and
    drought-fear. The canto synopsis adds that the queen grieves over a grey hair
    in the king’s head, the king resolves to depart to the forest, his vassals and
    subjects attempt to dissuade him, then perform austerities and worship the Sun
    at Kama-rupa until the Sun appears bodily.
  language: English
  quote_policy: summarized
