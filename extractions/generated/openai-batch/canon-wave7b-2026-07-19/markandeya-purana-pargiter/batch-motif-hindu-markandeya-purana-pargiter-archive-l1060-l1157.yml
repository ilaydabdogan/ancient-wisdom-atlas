canonical_text:
  quote: ''
  summary: A questioner asks that doubtful points concerning the Mahabharata be explained.
    The birds begin their reply with adoration to Vishnu, Brahma, and an unnamed lord
    who restrains Asuras. They describe Vishnu/Narayana as pervading the universe
    and existing in four forms, including a transcendent flame-garlanded form, Sesha
    supporting the earth, a preserving form associated with goodness, and a water-abiding
    form lying on a serpent bed. The preserving form incarnates when righteousness
    declines, including as a boar who lifts the earth from waters and as a man-lion
    who destroys demon opponents; other incarnations are briefly mentioned.
  language: English
  quote_policy: summarized
