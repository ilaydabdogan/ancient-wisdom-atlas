canonical_text:
  quote: With his face looking eastwards the adorable Tortoise-formed god takes his
    position
  summary: Kraushtuki asks Markandeya to explain the position of Vishnu, called Janardana,
    in his tortoise form in Bharata, and how human weal and woe are indicated by the
    positions of his face and feet. Markandeya replies that the tortoise-formed god
    faces east and occupies Bharata, which is divided into nine portions; constellations
    and countries are arranged over him in nine divisions. The canto summary states
    that India rests upon Vishnu as an east-facing tortoise, with countries, peoples,
    lunar constellations, zodiacal constellations, astrological applications, and
    rites to avert calamity associated with this arrangement.
  language: English
  quote_policy: quoted
