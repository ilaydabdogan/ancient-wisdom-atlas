  summary: A man enjoys luxurious pleasures on a fine mountain with two wives, supplied
    by the Nidhis through Padmini knowledge. A grey lag-goose praises him as happy
    because of youth, desired delights, and mutual affection, but a hen-cakra-vaka
    replies that he is not truly happy because affection has one basis and the women
    are only amusements rather than mutually beloved wives.
