canonical_text:
  quote: A yogi should strenuously restrain his mind when beset with such thoughts.
  summary: The passage describes mental ailments of a yogi, including longing for
    powers, wealth, religious rewards, godhead, and other attainments. It instructs
    the yogi to restrain the mind and make it cling to Brahma. It then lists five
    further ailments—illusive vision, hearing, deity, mental aberration, and enthusiasm—as
    roots of bitterness that hinder yogic meditation, and briefly describes each.
  language: English
  quote_policy: quoted
