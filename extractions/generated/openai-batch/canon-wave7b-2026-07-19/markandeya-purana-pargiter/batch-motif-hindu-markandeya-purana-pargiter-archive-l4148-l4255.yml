canonical_text:
  quote: ''
  summary: In Jada's continued narrative, Yama's officer answers King Vipaswit in
    hell. The officer identifies the king's offence as neglecting the proper sexual
    season of his wife Pivari while enamoured of Kaikeyi, and explains this as the
    cause of his hell-experience. The king then asks about sinners being repeatedly
    mutilated and tortured by birds, saws, boiling substances, and iron beaks. Yama's
    officer explains generally that merit and demerit are consumed through their results,
    that sinners and virtuous persons pass through different courses, and that deeds
    ripen when their proper time and place arrive.
  language: English
  quote_policy: summarized
