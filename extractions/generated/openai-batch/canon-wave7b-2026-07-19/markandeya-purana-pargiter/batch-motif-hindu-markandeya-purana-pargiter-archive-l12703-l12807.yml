canonical_text:
  quote: ''
  summary: Markandeya explains that creation is conditioned by actions from previous
    existence. Brahma creates classes of beings through successive bodies, and the
    abandoned bodies become night, day, and the two twilights. The passage then narrates
    the origin of Rakshasas, Yakshas, Serpents, and flesh-eating demons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Creation is described as conditioned by good and bad actions from previous
    existence; beings destroyed in dissolution are not freed from the consequences
    of their actions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Brahma, engaged in creation, produces beings in his mind and desires to create
    gods, Asuras, pitris, and mankind before infusing himself in the waters.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When darkness grows in excess during Brahma's meditation, Asuras are produced
    from his buttocks, and the body he casts aside becomes Night.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Brahma assumes another body, experiences delight, produces gods from his mouth,
    and the abandoned body becomes Day.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Brahma assumes another body characterized by goodness, produces the Pitris
    while deeming himself a pitri, and the abandoned body becomes the evening twilight.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Brahma assumes another body characterized by passion, produces mankind, and
    the abandoned body becomes the morning twilight that ends night and begins day.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Night, day, evening twilight, and morning twilight are identified as four
    bodies of Brahma invested with the three qualities.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The gods are powerful by day, the Asuras by night, mankind at morning twilight,
    and the Pitris at evening twilight; each class loses power at adverse times.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Feeling hunger and thirst, Brahma takes another body of passion and darkness
    during the night and creates bearded monsters wasted with hunger who try to eat
    that body.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Among the hungry monsters, those who say they will preserve the body are called
    Rakshasas, and those who say they will devour it are called Yakshas.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: When Brahma sees the monsters, his hair withers and loses erectness; by gliding
    downward it becomes Serpents, also called Ahis or Snakes.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: In anger after seeing the Serpents, Brahma fashions beings possessed with
    anger, described as flesh-eating demons, tawny-hued and fierce.
  category: action
  evidence_refs:
  - ev:10
