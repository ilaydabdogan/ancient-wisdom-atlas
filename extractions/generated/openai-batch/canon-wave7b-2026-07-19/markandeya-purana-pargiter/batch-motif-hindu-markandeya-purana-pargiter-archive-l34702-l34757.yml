  summary: In an assembly, some speakers condemn Avikshit for unjustly seizing an
    unwilling princess at her svayamvara and note that, when the princes combined,
    he was subdued. Vira, his mother, rejoices and defends her son, praising his forceful
    seizure of the maiden, interpreting his single-handed fighting as manliness, contrasting
    kshatriya force with feeble entreaty, and urging martial action and conquest.
