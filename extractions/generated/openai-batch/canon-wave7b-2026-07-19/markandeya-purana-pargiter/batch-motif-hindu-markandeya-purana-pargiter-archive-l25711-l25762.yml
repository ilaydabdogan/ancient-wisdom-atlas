canonical_text:
  quote: "“the entire world which was nothing but water”"
  summary: After Brahma praises the goddess of darkness so that Vishnu may awaken
    and slay Madhu and Kaitabha, the goddess issues from Vishnu’s body and Vishnu
    rises from his couch in the universal ocean. He sees the two demons threatening
    Brahma, fights them for five thousand years, and, after they are deluded into
    offering him a boon, chooses that they be slain by him. Seeing the water-covered
    world, the demons ask to be killed where the earth is not overwhelmed by water;
    Vishnu accepts and cuts them apart with his discus.
  language: English
  quote_policy: quoted
