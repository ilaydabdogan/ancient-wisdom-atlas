canonical_text:
  quote: ''
  summary: A narrator answers Jaimini by recounting that Markandeya formerly expounded
    the matter to the young brahman Krausktuki. The passage invokes Brahma as origin
    and creator, Vishnu as maintainer, and Siva as destroyer at dissolution. Markandeya
    says the Purana and the Vedas issued from Brahma's mouths, that sages arranged
    or received these bodies of knowledge, and that the Purana passed through a lineage
    including Bhrigu, Cyavana, brahmans, rishis, Daksha, and Markandeya. The Purana
    is described as destroying strife and sin.
  language: English
  quote_policy: summarized
