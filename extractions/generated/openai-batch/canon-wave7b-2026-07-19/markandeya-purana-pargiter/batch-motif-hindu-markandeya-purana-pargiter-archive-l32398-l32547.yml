canonical_text:
  quote: ''
  summary: Manu’s son Pushadhra hunts in a forest, mistakes a sacrificial cow for
    a wild animal, and kills it with an arrow. The brahman’s son curses him to become
    a sudra and lose sacred lore. Pushadhra prepares to curse in return, but the brahman
    father restrains anger and teaches pardon for acts done in ignorance. Pushadhra
    pleads that the killing was accidental, yet the first curse cannot be altered,
    though a second curse is averted.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pushadhra, Manu’s son, went hunting in a dense lonely forest, found no deer,
    and suffered from sun, hunger, thirst, and heat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:2
  text: He saw a beautiful cow that yielded milk for sacrifice; the cow belonged to
    a brahman who maintained the sacrificial fire and was partly hidden among creepers.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Thinking the cow was a gayal, Pushadhra shot her with an arrow, and she fell
    to the ground pierced in the heart.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sacrificial priest’s son, called Taporati in the passage and described
    as a religious student, saw his father’s sacrificial cow struck down and became
    enraged.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Pushadhra rebuked the son for yielding to anger and compared such wrath to
    sudra-like conduct.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The brahman’s son cursed Pushadhra to become a sudra and declared that the
    sacred lore learned from his guru would waste away because Pushadhra had hurt
    the guru’s sacrificial cow.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After being cursed, Pushadhra became angry and took water in his hand intending
    to utter a retaliatory curse.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The father of the brahman’s son restrained him and taught that calmness benefits
    the twice-born, anger destroys austerities, knowledge, life, and success, and
    an ignorant or accidental act should be pardoned.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Pushadhra prostrated himself before the muni’s son, asked for grace, and said
    he had killed the cow in ignorance after mistaking her for a gayal.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The rishi’s son said his utterance could not be made vain or altered; he could
    not change the first curse, but a second curse was averted, and Pushadhra became
    a sudra.
  category: sequence
  evidence_refs:
  - ev:8
