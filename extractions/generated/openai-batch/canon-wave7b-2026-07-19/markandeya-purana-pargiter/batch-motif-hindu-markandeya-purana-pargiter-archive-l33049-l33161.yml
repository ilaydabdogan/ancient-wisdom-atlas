canonical_text:
  quote: ''
  summary: A fire from a fish's body burns Nala to ashes. Su-deva asks Pramati to
    pardon words spoken while intoxicated, and Pramati mitigates but does not cancel
    a curse that will make Su-deva a vaisya in a future birth before restoring his
    kshatriya status. The speaker, Kripa-vati, recounts her own origin from the body
    of the royal rishi Su-ratha after he was overcome by compassion for a fallen bird,
    and describes a later curse from Agastya's brother, likewise mitigated by a future
    restoration of memory, caste, and heavenly enjoyment. She concludes that neither
    she nor her father are truly degraded by vaisya birth.
  language: English
  quote_policy: summarized
