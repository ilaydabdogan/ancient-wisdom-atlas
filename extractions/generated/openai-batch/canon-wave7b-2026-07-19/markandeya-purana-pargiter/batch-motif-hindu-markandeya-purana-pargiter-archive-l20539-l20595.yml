literal_observations:
- id: obs:1
  text: The passage lists named peoples including Kohalakas, Mandavyas, Bhuti-yuvakas,
    Satakas, Hema-tarakas, Yaso-matyas, Grandharas, Khara-sagara-rasis, Yaudheyas,
    Dasameyas, Rajanyas, and S'vamakas.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note describes a group placed on the northernmost part of the Indus and
    discusses Ephthalites or White Huns, Upper Sutlej Hundes, and Hara-Hunas as an
    outside people to the northwest.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The translator says the Kohalakas are not found elsewhere by him, but seem
    to be the same as Kokarahas and Kokanadas, described as a tribe north of the Panjab.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The translator says he has not met Bhuti-yuvakas elsewhere and suggests a
    possible connection with Bhuti-laya, a place in the north of the Punjab.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:5
  text: The translator says he has not found Satakas elsewhere and has not met Hema-tarakas
    elsewhere or in the dictionary.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:6
  text: The translator says Yaso-matyas are not found elsewhere by him and seem to
    mean a people living on the river Yaso-mati.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:7
  text: The translator has not met Khara-sagara-rasi elsewhere, says it is not in
    the dictionary, notes Khara-patha countries in the Matsya Purana, and suggests
    the name may need splitting into two names.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:8
  text: The Yaudheyas are described as generally mentioned with Trigartas, Madras,
    and other Panjab nations; an epithet meaning mountaineer is said to apply to them,
    and they are said to descend from king Usinara like the Sivis and Ambashthas.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:9
  text: The Dasameyas are also called Dasamiyas, are described as a people in the
    Panjab, and are said to be called out-castes and denounced in the Karna-Parvan,
    with no fixed position identified by the translator.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:10
  text: Rajanya is noted as normally meaning kshatriya or noble, but here appears
    to be the name of a people; S'vamakas are said not to have been met elsewhere
    or in the dictionary.
  category: attribute
  evidence_refs:
  - ev:11
