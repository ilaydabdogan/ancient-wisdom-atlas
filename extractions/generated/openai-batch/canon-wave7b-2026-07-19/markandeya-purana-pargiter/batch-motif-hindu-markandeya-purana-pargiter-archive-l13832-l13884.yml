canonical_text:
  quote: ''
  summary: A commanding speaker addresses the Yaksha or goblin named in the title
    as DDHSAHA. The speaker assigns him as prey various people who neglect or misuse
    ritual and social duties, gives him the results of improperly performed religious
    acts for nourishment, prescribes a bali offering to him at the close of the Vaisvadeva
    ceremony, and commands him to abandon orderly, pious, harmonious households.
  language: English
  quote_policy: summarized
