canonical_text:
  quote: ''
  summary: A maiden asks a prince to take her hand in marriage in a forest, and the
    prince agrees. The Gandharva Tunaya arrives with Apsarases and Gandharvas, identifies
    the maiden as his daughter Bhamini/Bhavini, explains that Agastya's curse caused
    her earthly birth, and asks the prince to marry her, foretelling a son who will
    be a universal monarch. The wedding is ritually performed with sacrifice and celestial
    celebration. The couple goes to the Gandharvas' world, enjoys pleasure grounds,
    and receives gifts. Bhavini gives birth to a son, and Gandharvas, gods, rishis,
    Nagas, Asuras, Yakshas, Guhyakas, and winds assemble. Tumburu performs the birth
    rites and blessing rite. A disembodied voice explains the child's name, Marutta,
    and foretells royal subjection to his commands.
  language: English
  quote_policy: summarized
