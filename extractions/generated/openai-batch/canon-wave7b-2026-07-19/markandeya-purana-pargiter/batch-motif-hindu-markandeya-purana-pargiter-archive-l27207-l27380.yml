canonical_text:
  quote: ''
  summary: Ambika answers an Asura envoy, destroys Dhumra-locana with a roar, and
    her lion destroys an Asura army. Sumbha orders Canda and Munda to seize or kill
    her. Their army finds the goddess seated on a lion on a golden mountain peak.
    In wrath, Kali emerges from Ambika's forehead, armed and adorned with skulls,
    devours and destroys the Asura host, kills Canda and Munda, brings their heads
    to Candika, and receives the name Camunda.
  language: English
  quote_policy: summarized
