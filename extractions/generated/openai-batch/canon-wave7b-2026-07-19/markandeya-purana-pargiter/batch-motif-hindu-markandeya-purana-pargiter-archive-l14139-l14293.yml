canonical_text:
  quote: ''
  summary: The passage catalogues named sons and daughters identified as offspring
    of Duhsaha. Each being is associated with a specific harm—such as destroying undertakings,
    pregnancies, crops, household stores, memory, menstrual courses, or seed, or inciting
    social conflict—and the passage prescribes protective actions including prayers,
    offerings, purification, auspicious objects, household marks, mustard seed, bathing
    at sacred places, herbs, clean food, and sacrificial ash.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A son named Ganda-pranta-rati is described as stationed at the borders of
    the cheeks for half a muhurta and as consuming undertakings, eulogy, and sincerity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prescribed protections against Ganda-pranta-rati include addresses to
    brahmans, praise to gods, extracting roots, ablutions with cows' urine and mustard
    seed, worship of constellations and planets, observance of righteousness and the
    Upanishads, looking at weapons, and contempt for birth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Garbha-han is described as a terrible son who destroys the fruit of pregnant
    women, with protections including personal purification, written spells, auspicious
    garlands and decorations, clean houses, and avoiding over-exertion.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sasya-han is described as destroying the growth of crops, with protections
    including worn-out shoes, walking on the left side, causing a candala to enter
    the field, offering the bali outside, and eulogizing soma juice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The daughter glossed as the Inciter is said to incite men to seize and molest
