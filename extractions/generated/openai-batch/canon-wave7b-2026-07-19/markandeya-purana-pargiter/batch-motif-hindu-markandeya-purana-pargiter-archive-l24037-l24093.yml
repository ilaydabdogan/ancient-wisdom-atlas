canonical_text:
  quote: ''
  summary: Tamasa is associated with darkness and is brought up by his father in the
    forest. When mature, he asks his father about his parentage and circumstances.
    The father, an ousted king, recounts his loss of kingdom. Tamasa invokes the sun,
    obtains celestial weapons and controlling spells, defeats the enemies, and releases
    them with his father's permission. The father then quits his body and attains
    worlds won by austerities and sacrifices. Tamasa conquers the whole earth, becomes
    Manu, and the passage lists the gods, lord of gods, seven rishis, and sons associated
    with his manvantara.
  language: English
  quote_policy: summarized
