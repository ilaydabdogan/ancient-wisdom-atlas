    same form as before.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: After the Brahman lady consents, Anasuya raises an arghya oblation and summons
    the sun at midnight on the tenth night; the sun rises above a mighty mountain.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: When the sun rises, the Brahman husband is bereft of life, falls to the ground,
    and is caught by his wife.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Anasuya tells the Brahman lady not to be dejected, praises her obedience to
    her husband, and declares that the Brahman should regain life, health, youth,
    and a hundred autumns with his wife.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Brahman rises free from illness and young again, illuminating the dwelling
    with his lustre; flowers fall, heavenly music is heard, and the gods are delighted.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The gods offer Anasuya a boon; she asks that Brahma, Vishnu, and Siva become
    her sons and that she and her husband attain religious devotion; the gods agree
    and depart after honoring her.
  category: speech
  evidence_refs:
  - ev:11
