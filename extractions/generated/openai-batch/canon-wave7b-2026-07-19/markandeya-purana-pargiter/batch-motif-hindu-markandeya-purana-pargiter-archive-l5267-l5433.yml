canonical_text:
  quote: ''
  summary: Anasuya instructs a Brahman lady on a wife's devotion to her husband. She
    explains that the gods are distressed because day and night have ceased, sacrifices
    are interrupted, and drought threatens the world. The Brahman lady reports that
    Mandavya cursed her husband to die at sunrise. Anasuya summons the sun; the husband
    dies and falls, then Anasuya restores him to youthful health. The gods rejoice,
    offer Anasuya a boon, and agree to her request that Brahma, Vishnu, and Siva become
    her sons and that she and her husband attain religious devotion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Anasuya teaches that women obtain merit and desired worlds through obedience
    to their husbands, and that a husband is a wife's supreme bliss.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Brahman lady respectfully salutes Anasuya, says a husband is a woman's
    deity, and asks what she or her husband should do.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Anasuya says Indra and the gods have approached her in distress because day
    and night have been interrupted through the Brahman lady's speech.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Anasuya states that without day there are no sacrificial ceremonies, the gods
    do not receive nourishment, work is cut short, and the world will perish through
    drought unless the sun resumes its course.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Brahman lady reports that Mandavya cursed her husband to die at sunrise.
  category: speech
  evidence_refs:
  - ev:5
