canonical_text:
  quote: ''
  summary: The king apologizes for addressing the maiden without improper intent.
    The rishi says the king spoke under Agni’s prompting and that Agni had named the
    king as the maiden’s bridegroom for that day. The rishi gives the maiden to the
    king and prepares the wedding. The maiden asks her father to perform the marriage
    in the constellation Revati. The rishi says Revati is not now joined with the
    moon and that other constellations are suitable; he explains that the ascetic
    Rita-vac, angered against Revati, caused the constellation to fall. He adds that
    he has already promised the maiden to the king, creating a difficulty if she refuses
    the marriage.
  language: English
