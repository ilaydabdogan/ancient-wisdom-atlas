canonical_text:
  quote: ''
  summary: 'Indra reveals that he had tested a princely brahman and grants him knowledge.
    Afterward, the sons of the Muni Mimi plead with their father to avert his curse,
    using an allegory of the body as a fortress ruled by the Sentient Soul and besieged
    by passions. The father says his word cannot become false but modifies the outcome:
    although they will take the nature of brutes, they will gain highest knowledge
    and perfection. The narrating birds explain that they were cursed, born on a battlefield,
    and became birds. Muni Śamika recognizes that they are not ordinary birds but
    brahmans who survived a superhuman battle. They then go to the Vindhya mountain
    and dwell in a cave by sacred water, practicing austerities, Veda study, and meditation.'
  language: English
  quote_policy: summarized
