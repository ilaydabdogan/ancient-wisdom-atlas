canonical_text:
  quote: ''
  summary: 'C''andika describes the benefits of hearing or remembering the poem of
    her majesty and exploits: protection, prosperity, calming of omens, exorcistic
    effects, removal of sins, health, and deliverance from dangers. The narrator then
    says she vanishes, the gods regain their dominions, defeated Daityas go to Patala,
    and the goddess is eternal, repeatedly born to safeguard the world, giver of birth,
    knowledge, prosperity, destruction, creation, and stability.'
  language: English
  quote_policy: summarized
