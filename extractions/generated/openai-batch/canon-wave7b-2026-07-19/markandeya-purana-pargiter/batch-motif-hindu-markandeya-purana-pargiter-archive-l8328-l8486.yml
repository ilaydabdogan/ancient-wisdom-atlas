canonical_text:
  quote: ''
  summary: A didactic passage describes the householder as a supporter of gods, ancestors,
    sages, humans, animals, and other beings. It presents a cosmic cow made of the
    three Vedas, prescribes daily water offerings, bali offerings, sraddha, almsgiving,
    and hospitality to guests, and warns of sin, loss of merit, hell, or future impurity
    when these duties are neglected.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Worms, insects, flying creatures, birds, cattle, and Asuras are described
    as subsisting upon the griha-stha and looking toward him in expectation of gifts.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A cow is described as the support of everything, consisting of the three Vedas,
    with parts of her body identified with Vedic texts, pious acts, good words, tranquillity,
    prosperity, and the four classes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The words svaha, svadha, vashat, and hanta are described as the cow's four
    teats, from which gods, pitris, Munis, living beings, Asuras, and mankind drink.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man who causes destruction is said to sink into the hells Tamas, Andha-tamisra,
    and Tamisra, while a man who gives the cow drink at the proper time attains Svarga.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man is instructed to nourish gods, rishis, pitris, men, and living things
    daily, and after bathing to offer water to gods, rishis, pitris, and Prajapati.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The passage instructs the householder to worship the gods with jasmine flowers,
    delight Agni, and make bali offerings to named deities in the house, directions,
    doorway, outside spaces, air, and southward for the pitris.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: After the family bali, the pure householder is instructed to perform an utsarga
    oblation for living things and scatter it on the ground for dogs, low-caste men,
    and birds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The householder is instructed to look toward the door for a short time to
    see whether a guest is present, and to honor an arriving guest with rice, other
    food, water, flowers, and other gifts according to his power.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A guest is defined as a Brahman who arrives hungry, weary, supplicating, and
    indigent; the householder should not inquire into his lineage, conduct, or study,
    and should regard him as Prajapati.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: When the guest is satisfied, the householder is released from the debt of
    hospitality; if the host eats without giving to the guest, he incurs sin, and
    a disappointed guest transfers misdeeds to the host and takes the host's merit.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The householder is instructed to perform daily sraddha with food and water
    for pitris and Brahmans, feed a Brahman, present rice, and give alms to wandering
    Brahmans who ask.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The householder should not eat before giving food, a hantakara, an agra, or
    alms according to his means, and should eat only after reverence to guests, friends,
    kinsmen, petitioners, the maimed, children, old men, and the sick.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:13
  text: A hungry or destitute person should be fed by a householder with adequate
    substance, and a guest arriving after sunset should be honored with a bed, seat,
    and food.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Family life is described as placing a weight on the shoulder of the one who
    undertakes it, while Vidhatri, the gods, pitris, and great Rishis shower bliss
    on him.
  category: other
  evidence_refs:
  - ev:12
