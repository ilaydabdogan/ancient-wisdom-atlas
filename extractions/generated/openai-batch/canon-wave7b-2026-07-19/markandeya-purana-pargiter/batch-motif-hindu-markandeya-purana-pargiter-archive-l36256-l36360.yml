canonical_text:
  quote: ''
  summary: The Nagas seek protection from Avikshit against Marutta's wrath. Avikshit,
    urged by his wife, goes armed to Bhargava's hermitage to intercede. He finds Marutta
    holding a bow and a fiery weapon that fills the sky, illuminates the earth, and
    penetrates to Patala. Avikshit asks Marutta to draw back the weapon. Marutta honors
    his parents but refuses at first, saying the Nagas bit seven youthful munis and
    defiled the hermitage fire-offerings and tanks. Avikshit argues that the Nagas
    have taken refuge with him and asks Marutta to restrain his anger.
  language: English
  quote_policy: summarized
