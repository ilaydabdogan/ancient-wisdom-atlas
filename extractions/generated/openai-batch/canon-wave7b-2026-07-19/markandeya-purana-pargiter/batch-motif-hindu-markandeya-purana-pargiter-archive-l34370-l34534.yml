canonical_text:
  quote: ''
  summary: The passage describes the king’s inquiry about his newborn son’s horoscope,
    astrologers’ favorable prediction, the naming of Avikshita, Avikshita’s education
    and heroic qualities, his taking of princesses at svayam-varas including Vaisalini,
    the anger and exhortation of rival kings, and the beginning of their battle with
    him. A canto argument also reports that the kings later capture him and that the
    princess refuses to choose another husband.
  language: English
