canonical_text:
  quote: ''
  summary: The passage describes the growth of a foetus in the womb, its nourishment
    through the mother, its recollection of former transmigrations and resolve not
    to be reborn, the painful birth process, and the loss of knowledge through Vishnu’s
    consciousness-effacing power. It then describes the human life cycle, death, rebirth,
    movement between Svarga and hells according to actions, suffering in all states,
    and the round of mundane existence compared to a jar and rope at a well. The passage
    ends with a question about striving for emancipation and a father’s praise of
    his son’s teaching about mundane existence and knowledge.
  language: English
  quote_policy: summarized
