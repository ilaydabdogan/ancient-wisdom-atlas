canonical_text:
  quote: ''
  summary: A faithful brahman wife carries her husband at night. Her husband pushes
    the suffering Mandavya, who is impaled on a stake; Mandavya curses him to die
    at sunrise. The wife declares that the sun shall not rise, causing prolonged night.
    The gods fear the collapse of time, ritual, sacrifice, rain, and cosmic order.
    Brahma advises them to propitiate Anasuya, Atri's faithful wife rich in austerities.
    Anasuya agrees to restore day and night while preserving the power of the faithful
    wife and saving the husband.
  language: English
  quote_policy: summarized
