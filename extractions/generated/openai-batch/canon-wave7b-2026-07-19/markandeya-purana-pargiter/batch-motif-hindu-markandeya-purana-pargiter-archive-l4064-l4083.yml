  summary: 'In a continued father-son conversation, Sumati describes an episode from
    a previous birth: as a Vaiśya he once obstructed cattle while they were drinking,
    and because of that act he was sent to a terrible hell marked by fire, iron-beaked
    birds, mud from streams of blood, crushing machines, and the sounds of sinners
    being cut apart.'
