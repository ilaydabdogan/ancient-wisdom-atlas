canonical_text:
  quote: ''
  summary: The passage introduces Canto XXIII as Kuvalayāśva's visit to Pātāla and
    summarizes later events involving Asvatara, Sarasvati, Kambala, Śiva, and Madālasā.
    The narrated verses begin with the king's son returning to his own city, eager
    to salute his parents and see Madālasā. He sees citizens with mixed emotions,
    while others cheer, embrace, and tell him his adversaries are slain and that his
    parents and the city are relieved of anxiety.
