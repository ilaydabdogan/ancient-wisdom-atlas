canonical_text:
  quote: ''
  summary: Avikshita defeats and wounds several opponents, but a large body of kings
    and warriors later surrounds him, abandons righteous combat, disables his weapons
    and chariot, wounds him, binds him, and carries him into Vaidisa. A maiden at
    her svayamvara is asked to choose a bridegroom from the kings, but she chooses
    none. The king asks an astrologer for a wedding day, and the astrologer advises
    waiting for later auspicious days because the present day has an obstacle.
  language: English
  quote_policy: summarized
