canonical_text:
  quote: ''
  summary: 'Sarasvati grants special knowledge of language, metre, and music to two
    Nagas. The Nagas praise Siva with song and receive a boon: Madalasa, the deceased
    wife of Kuvalayasva/Rita-dhvaja, is to be restored as a daughter in the Naga''s
    house. Siva instructs a sraddha rite involving the middle pinda, after which Madalasa
    rises from the Naga''s breathing middle hood in the same form as when she died.
    The Naga conceals her. Later the Naga king''s sons invite the prince to their
    home and guide him across the holy river Gomati.'
  language: English
  quote_policy: summarized
