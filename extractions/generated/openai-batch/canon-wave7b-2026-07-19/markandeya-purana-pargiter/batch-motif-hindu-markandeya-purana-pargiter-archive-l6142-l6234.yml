canonical_text:
  quote: ''
  summary: A father asks his sons to recount a prince's greatest deed, arguing that
    disciplined and wise persons can attain even inaccessible aims, as Dhruva reached
    the polar star. The sons recount that the brahman Galava came to King Satru-jit
    with a magnificent sky-sent horse after a shapeshifting Daitya/Danava repeatedly
    disrupted his hermitage and ascetic practice. A disembodied voice named the horse
    Kuvalaya, declared its tireless travel through many realms, and foretold the demon's
    defeat and Rita-dhvaja's fame. Satru-jit then sends his son Rita-dhvaja with Galava,
    mounted on the horse, to the hermitage.
  language: English
  quote_policy: summarized
