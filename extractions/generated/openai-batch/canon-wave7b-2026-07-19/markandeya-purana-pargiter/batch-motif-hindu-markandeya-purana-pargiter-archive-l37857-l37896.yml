  quote: ''
  summary: The passage concludes the Purana by praising the benefit of hearing it,
    stating that the hearer is honored in Svarga and borne in a heavenly car. It gives
    a count for the Purana and attributes its ancient pronouncement to the wise muni
    Markandeya. Jaimini praises the twice-born Birds for dispelling his doubts, wishes
    them unerring spiritual intelligence and release from the effects of a father's
    curse, then returns to his hermitage pondering their noble speech.
