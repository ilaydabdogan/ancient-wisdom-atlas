canonical_text:
  quote: ''
  summary: The passage prescribes householder duties of reverence and food distribution
    to gods, ancestors, guests, relations, animals, birds, insects, dogs, and low-caste
    men before eating. It then introduces Madalasa’s instruction to Alarka on continual,
    occasional, and periodical ceremonies, including five sacrifices, birth and marriage
    rites, sraddha, worship of Nandi-mukha ancestors, and offerings of pindas mixed
    with curds and barley while facing north or east.
