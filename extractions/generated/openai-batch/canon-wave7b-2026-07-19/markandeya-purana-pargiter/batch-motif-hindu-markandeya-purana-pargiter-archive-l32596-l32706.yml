canonical_text:
  quote: ''
  summary: A prince seeks marriage with a vaiśya's daughter and argues from love,
    bodily feeling, and season. The vaiśya refuses to act without the prince's paternal
    or guru authority. The matter is referred to the prince's father and a council
    of brahmans and ṛṣis, who prescribe that the prince must first marry a royal-anointed
    woman and only afterward may marry the vaiśya maiden.
  language: English
  quote_policy: summarized
