canonical_text:
  quote: ''
  summary: 'Markandeya narrates that Avikshit finds a richly adorned maiden in the
    forest being carried off by the Danava Dridha-kesa. The maiden cries for rescue
    and identifies herself as Karandhama''s daughter-in-law and Avikshit''s wife.
    Avikshit doubts the claim but resolves to rescue her, fights the Danava, destroys
    his weapons, and beheads him. The gods praise Avikshit, offer him a boon, and
    promise him a valiant universal-monarch son by the rescued maiden. Avikshit then
    raises a difficulty: he has renounced wedlock and had abandoned Villa''s daughter,
    who remained devoted to him.'
  language: English
  quote_policy: summarized
