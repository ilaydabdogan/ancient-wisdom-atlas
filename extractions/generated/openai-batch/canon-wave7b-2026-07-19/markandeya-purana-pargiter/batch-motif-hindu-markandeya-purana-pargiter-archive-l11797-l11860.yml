canonical_text:
  quote: ''
  summary: Alarka transfers kingship to his eldest son, renounces worldly ties, goes
    to the forest, and later attains supreme bliss through religious devotion. He
    reflects that the universe is bound by qualities, kinship, property, and ignorance,
    and praises devotion above kingship. Jada urges his father to practice devotion
    for final emancipation and reabsorption into the Supreme Soul, then renounces
    worldly possessions and departs. His father also follows the forest-dweller and
    fourth life-stage path, meets his son, abandons bonds, and attains perfection
    and self-knowledge. The birds close by telling the brahman that they have answered
    fully.
  language: English
  quote_policy: summarized
