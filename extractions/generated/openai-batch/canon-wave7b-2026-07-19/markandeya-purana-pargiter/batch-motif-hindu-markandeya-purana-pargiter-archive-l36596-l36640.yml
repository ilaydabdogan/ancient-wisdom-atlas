canonical_text:
  quote: ''
  summary: Marutta is described as a great kshatriya king who ruled the entire earth,
    offered sacrifices, anointed his eldest son Narishyanta as king, departed to the
    forest for austerities, and ascended to the sky. Narishyanta then reflects on
    the righteous deeds of his father and ancestors, including sacrifice, protection
    of the earth, generosity, and steadfastness in battle, and wonders what remains
    for him to do.
  language: English
