canonical_text:
  quote: ''
  summary: Brahma intervenes while two anger-filled combatants continue fighting.
    Seeing damage to the worlds, he dispels their brute nature, restores them to their
    former bodies as Vasishtha and Kausika, admonishes them to end the contest, explains
    that the war is wasting the earth, and identifies anger and lust as obstacles
    to their austerities. The two become ashamed, embrace, forgive each other, and
    depart. The passage closes by saying that properly relating or hearing the battle
    and the story of Hariscandra dispels sins and prevents conflict of duties.
  language: English
  quote_policy: summarized
