canonical_text:
  quote: ''
  summary: 'A speaker addresses Buhsaha, called a goblin, and commands him to abandon
    virtuous persons and households: those supporting gods, pitris, humans, and guests;
    truthful and harmless men; a devoted wife; and members of the four social classes
    who perform prescribed religious duties and lawful livelihoods. The passage then
    describes an orderly household with lawful livelihood, obedient and reverent family
    relations, evening smearing, water-sprinkling, and a flower bali, saying there
    is no fear of misfortune there and that the goblin cannot gaze at it.'
  language: English
  quote_policy: summarized
