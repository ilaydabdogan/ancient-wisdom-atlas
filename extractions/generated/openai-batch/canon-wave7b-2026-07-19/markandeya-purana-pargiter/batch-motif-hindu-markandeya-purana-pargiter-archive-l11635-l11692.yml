canonical_text:
  quote: ''
  summary: 'The passage presents Alarka''s awakening speech: he says knowledge has
    changed his aim, reflects on body, intellect, and social oppositions, credits
    Dattatreya''s favor for his knowledge, teaches restraint of the senses and fixation
    on Brahma as the way to final beatitude, and denies enmity with the king or injury
    by Subahu. The transition to the next canto summarizes Subahu''s motive in arranging
    Alarka''s conquest, Alarka''s later renunciation of the kingdom, withdrawal to
    the forest, and attainment of final bliss.'
  language: English
  quote_policy: summarized
