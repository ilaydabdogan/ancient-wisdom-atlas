canonical_text:
  quote: ''
  summary: The passage is an ethnographic-geographical catalogue and commentary on
    peoples north of India, naming groups such as the Ensenikas, Lampakas, Sulakaras,
    Calikas, Jugudas or Jagudas, Aupadhas, Animadras, and Kiratas. The notes compare
    variant readings in the Vayu and Matsya Puranas and cite Mahabharata passages
    for some groups. The Lampakas and Kiratas are especially associated with mountain
    regions, and the Kiratas are described as a group of allied but distinct tribes
    formerly spread along the southern Himalayas.
  language: English
  quote_policy: summarized
