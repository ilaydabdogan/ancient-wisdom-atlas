canonical_text:
  quote: ''
  summary: A bereaved king and queen discuss the king's loss of status, the death
    of their son, fears of Naraka and rebirth, and the possibility of entering the
    funeral fire. The king builds a funeral pile, places the son's body on it, prays
    with his wife, and a divine assembly led by Dharma arrives; Dharma restrains the
    king and praises his virtues.
  language: English
  quote_policy: summarized
