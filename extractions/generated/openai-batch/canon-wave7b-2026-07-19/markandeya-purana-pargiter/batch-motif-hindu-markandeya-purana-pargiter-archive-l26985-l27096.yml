canonical_text:
  quote: ''
  summary: Ambika issues from Parvati's body and is named Kaushiki; Parvati becomes
    Krishna/Kalika and dwells on Mount Himavat. Chanda and Munda see Ambika's radiant
    beauty and urge Shumbha to possess her, comparing her to the treasures already
    gathered in his house. A catalog of captured or presented divine treasures is
    recited. Shumbha sends Sugriva as messenger to Ambika; the messenger proclaims
    Shumbha's dominion over the three worlds, the gods, sacrifices, and the choicest
    gems, including Uccaih-sravasa from the churning of the sea of milk.
  language: English
  quote_policy: summarized
