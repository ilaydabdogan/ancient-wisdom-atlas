canonical_text:
  quote: ''
  summary: A female speaker instructs the prince and a woman that religion, wealth,
    love, offspring, and household duties depend on wedded life. She blesses them,
    embraces her friend, bows to the prince, and departs by a divine route. S'atru-jit's
    son then seeks to leave Patala with the woman mounted on a horse. Danu's offspring
    notice and cry that the maiden is being carried away, recalling that Patala-ketu
    brought her from heaven and naming Danava weapons. Danava chiefs attack with arrows
    and spears, and the prince splits their weapons.
  language: English
  quote_policy: summarized
