canonical_text:
  quote: ''
  summary: King Khanitra laments that his actions caused the deaths of four brahmans.
    He anoints his son Kshupa as king, leaves for the forest with his three wives,
    performs long austerities, dies, and attains sacred worlds; his wives die at the
    same time and gain the same world. The narrative then introduces Kshupa, who rules
    righteously, gives generously, performs sacrifices, and is compared by bards to
    an ancient king Kshupa, son of Brahma, who supported brahmans and performed sacrifice
    with royal tribute.
  language: English
  quote_policy: summarized
