candidate_motifs:
- id: motif:1
  label: Heavenly food and drink of gods
  taxonomy_refs: []
  basis: Ambrosia, nectar, honey, meal, odor, mead, ale, and large divine eating or
    drinking are repeatedly listed as food or drink of gods and divine figures.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  confidence: high
  cautions: The passage is a comparative scholarly catalog, not a single mythic narrative.
- id: motif:2
  label: Creation or birth from potent bodily or liquid substance
  taxonomy_refs:
  - sacred_birth
  basis: Kvasir is created from spittle, and Lakshmi, Aphrodite, and Sri are described
    as coming from milk-sea, foam, or milk and butter.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The examples are juxtaposed by the author; the passage does not narrate
    the full myths or establish a single origin.
- id: motif:3
  label: Gods as mortal or killable
  taxonomy_refs: []
  basis: The passage gives a report of Zeus's tomb and lists Norse gods who die, disappear,
    fall in combat, are swallowed, or mutually slay one another.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage frames these as exceptions to Greek divine immortality and
    as cited Norse mythic events.
- id: motif:4
  label: Miraculous precocity and early strength
  taxonomy_refs:
  - miraculous_child
  basis: Thor reaches full strength at twelve, and Wiinamoinen walks to the smithy
    and makes himself a horse the day after birth.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: Thor's example concerns childhood strength, while Wiinamoinen's concerns
    action immediately after birth.
- id: motif:5
  label: Visible signs of divinity
  taxonomy_refs: []
  basis: Indian gods are marked by no shadow, no wink, gliding, lack of dust or sweat,
    and unfading garlands; further examples include divine beard, multiple limbs,
    eyes, heads, and dark coloration.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage explicitly notes that Teutonic mythology lacks the listed
    multi-limbed or multi-eyed deformities in its gods.
- id: motif:6
  label: Desired goddess sought by non-gods
  taxonomy_refs:
  - divine_beloved
  basis: The beauty of goddesses is supported by examples of giants and dwarfs seeking
    Freyja and Idun.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage summarizes pursuit or demand but does not narrate each episode
    in detail.
- id: motif:7
  label: Divine nod or beckoning gesture as power
  taxonomy_refs: []
  basis: Numen is explained as the nod of deity and divine power, with Athena's eyebrow
    nod and Frau Minne's beckoning as examples.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This is primarily a lexical and comparative note rather than a developed
    narrative motif.
comparison_claims:
- id: claim:1
  claim: Greek examples of ambrosia, nectar, honey, and divine odor and Norse/Teutonic
    examples of mead, ale, and divine drinking can cautiously be compared as a shared
    function of special divine nourishment.
  claim_level: same_function
  target: divine food and drink across Greek and Norse/Teutonic examples
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage juxtaposes examples but does not prove historical contact
    or common inheritance.
- id: claim:2
  claim: Kvasir's creation from spittle is compared in the passage with Lakshmi from
    the milk-sea, Aphrodite from foam, and Sri from milk and butter as a recurring
    pattern of emergence from potent substances.
  claim_level: same_motif
  target: creation or birth from divine fluid, foam, milk, or spittle
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: Only brief references are given; the full narrative contexts differ
    and are not supplied here.
- id: claim:3
  claim: The Cretan tomb of Zeus and the Norse accounts of gods dying or falling in
    combat support a cautious comparison of traditions in which gods are not absolutely
    immortal.
  claim_level: same_motif
  target: mortality or killability of gods in Greek and Norse cited material
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The passage calls the Greek case an exception and does not present
    a full theology of divine mortality.
- id: claim:4
  claim: Indian no-shadow and dustless divine markers and the Greek temple notice
    about no shadow can be compared as signs marking sacred or divine presence.
  claim_level: same_function
  target: absence of shadow as a marker of divinity or sacred space
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is limited to visible attributes; the passage does not
    connect the examples historically.
- id: claim:5
  claim: The passage contrasts Indian and Greek multi-limbed, multi-eyed, or multi-headed
    divine representations with Teutonic gods, stating that Teutonic mythology has
    none of these deformities.
  claim_level: visual_similarity
  target: divine bodily multiplicity in Indian and Greek examples, contrasted with
    Teutonic material
  evidence_refs:
  - ev:8
  counter_evidence_refs:
  - ev:8
  confidence: medium
  limitations: This is a contrastive comparison; the cited Teutonic material is explicitly
    negative for the same visual pattern.
