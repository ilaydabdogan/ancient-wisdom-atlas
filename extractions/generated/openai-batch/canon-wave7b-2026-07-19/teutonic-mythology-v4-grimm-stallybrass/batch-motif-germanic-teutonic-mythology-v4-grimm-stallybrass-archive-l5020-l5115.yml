  quote: ''
  summary: The passage collects comparative notes on divine food and drink, heavenly
    substances, exceptions to divine immortality, divine strength and bodily marks,
    goddess beauty, and the nod or beckoning gesture of deity across Greek, Norse/Teutonic,
    Indian, and other cited traditions.
  language: English with cited Greek, Latin, German, Old Norse, and Sanskrit terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Doves carry ambrosia to Zeus; ambrosia and nectar are handed to Calypso while
    Odysseus eats earthly food; the Moirai eat honey; divine horses have ambrosia
    and nectar; gods are also said to eat white meal bought by Hermes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ambrosial odor is described as surrounding the steps of deity, and a cited
    Latin passage says Jupiter dines daily on that odor.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage connects nectar glosses with seim and then discusses honey, blood,
    and a renovating virtue ascribed to honey and blood.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The spittle of gods is said to have virtue in making blood, mead, and ale.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kvasir is said to be created out of spittle; Lakshmi is said to come from
    the milk-sea, Aphrodite from foam, and Sri from milk and butter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that Greek belief in the immortality of gods had exceptions,
    including a Cretan tomb inscription for Zeus; it also lists deaths or falls of
    several Norse gods.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Odin and Saga drink; Heimdall drinks mead gladly; Thor eats and drinks enormously.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage cites statements that a god can act easily and Zeus can do hard
    things; Thor reaches full strength at twelve and lifts ten bear hides, while Wiinamoinen
    walks to the smithy and makes a horse the day after his birth.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Indian gods are described as casting no shadow, never winking, gliding without
    touching the ground, lacking dust and sweat, and having unfading garlands; men
    entering a temple of Zeus are also said to cast no shadow.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Odin is described as a large man; sayings about God's beard are cited; Vishnu
    is four-handed, Siva three-eyed, Zeus sometimes three-eyed, and Artemis three-headed;
    the passage states that Teutonic mythology has none of these deformities in its
    gods.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Yama is described as black, and Vishnu in one incarnation is called Krishna,
    glossed as dark or black.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: 'The beauty of goddesses is said to be attested by giants and dwarfs seeking
    them: Thrymr wants Freyja, Thiassi wants Idun, and dwarfs demand a favor from
    Freyja.'
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Numen is explained as the nod of deity and divine power; Athena nods with
    her eyebrows, and Frau Minne beckons.
  category: action
  evidence_refs:
  - ev:10
