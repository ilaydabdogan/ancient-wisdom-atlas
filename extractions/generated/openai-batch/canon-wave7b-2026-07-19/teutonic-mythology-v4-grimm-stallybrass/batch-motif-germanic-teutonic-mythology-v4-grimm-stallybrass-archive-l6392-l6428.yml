canonical_text:
  quote: ''
  summary: 'The passage gathers comparative notes on supernatural women: Bryuhildr
    binds herself by oath to a young man, helps him in conquest, and later chooses
    Sigurd; unions with celestial or supernatural brides are said to be unlucky and
    sometimes governed by a prohibition on asking the bride''s name. The passage compares
    this pattern with elfin, Melusina, swan-knight, Ganga-Santanu, and vila material.
    It then describes valkyrs as temporary beings on earth who leave for battle, prophetic
    water-women in the Nibelungen material, vanishing forest-women and disappearing
    dwellings, and wood-wives or wild women associated with woods, wild houses, tables,
    and apples in baskets.'
  language: English
  quote_policy: summarized
