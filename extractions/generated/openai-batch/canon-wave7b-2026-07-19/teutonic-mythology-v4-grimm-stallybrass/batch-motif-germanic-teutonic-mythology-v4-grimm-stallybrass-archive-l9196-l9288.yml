canonical_text:
  quote: ''
  summary: 'The passage compiles traditions and literary notes about fire: destructive
    or foreseen fires, ritual quenching, fire emerging from earth, objects that quench
    or emit fire, light-giving swords, needfire or rubbed fire, cattle-protection
    rites, animal sacrifices against herd disease, and Sanskrit friction-fire made
    with male and female sticks.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fire is said to be stifled with worn clothes; an earth-fire in a Liège legend
    attacks men wearing new unwashed smocks and is flogged with ropes, rods, and sticks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An outbreak of hell-fire that cannot be stamped out is said to require the
    sacrifice of a knight in gorgeous array; a mounted attempt to break away the fire
    ends with the rider falling and breaking his neck.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: To extinguish a fire, a woman in childbed is carried so her feet do not touch
    the ground; she utters mystic spells and throws a new-baked loaf into the flames.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Some people are said to see a fire burning beforehand; the indicated beam
    must be removed, or the fire can be conjured into an oak with a bung.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Fire is described as leaping out of the ground like water, as fiery springs,
    and in images of burning mountains.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Eggs are said to prevent wood or cloth from burning, and milk, including camel's
    milk, is said to quench fire.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Fire and light are described as coming from helmets and swords; in one Aeneas
    passage the sword is to light him in the darkness of hell.
  category: object
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Flint-fire is struck over cattle; sparks from a beam being hewn are treated
    as an omen of fire for the house into which the beam is built.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Needfire is said to be rubbed by two brothers, or at least two men with the
    same Christian name; a giant is also said to rub fire out of stones.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Swedish accounts, rubbed fire is made using an oak piece and a string pulled
    to and fro in a house door, then carried around a person and ritually blessed;
    sick cattle are smoked and cured.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Another Swedish account describes boring a hole in an oak, rubbing fire with
    a pin, kindling nine kinds of trees, and making cattle pass over them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Cows or calves are said to be sacrificed, buried alive, buried under a stable
    door, or represented by a severed head to protect a herd from plague or murrain.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Sanskrit needfire or wildfire is called rub-fire and is said to be produced
    by rubbing a male and a female stick together, including from the arani.
  category: action
  evidence_refs:
  - ev:9
