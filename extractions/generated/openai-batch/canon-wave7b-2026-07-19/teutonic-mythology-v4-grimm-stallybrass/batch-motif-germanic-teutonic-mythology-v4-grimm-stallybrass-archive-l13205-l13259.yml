canonical_text:
  quote: ''
  summary: 'The passage surveys terms and beliefs concerning souls and spirits: soul
    and spirit are associated with breath and wind; the soul departs, slips, flows,
    or escapes from the body through breath, mouth, limbs, or wounds; souls are compared
    with elves and dead beings that cross water; souls are classified by kinds, sometimes
    multiplied within one person, and lovers'' souls are described as joining or intermarrying.'
  language: English with cited Greek, Latin, Germanic, Slavic, Sanskrit, Persian/Zend,
    and Lithuanian terms
