canonical_text:
  quote: ''
  summary: A numbered catalogue of German regional superstitions records protective
    actions against witches, witchcraft affecting animals and household goods, witch
    flight and weather-making, crossroads money associated with the devil, childbirth
    and child omens, marriage omens, death customs for the soul and restless dead,
    hair disposal, seasonal prosperity practices, and domestic luck or danger signs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several entries prescribe ways to keep witches from cattle or the household,
    including tying a calf by the eldest child, relying on particular animal markings,
    turning a left shoe, holding out a thumb toward a doubtful cat, and placing a
    pentagram on the door.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: A bewitched object may be burned so that the witch comes to borrow something;
    the entry says giving frees her, while refusing makes her burn too.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:3
  text: For bewitched cattle, a midnight ritual finds straw on their backs, encloses
    it in a sack, and thrashes the sack until it swells and the witch screams.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:4
  text: Witches are said to pick up money at crossways where the devil scatters it,
    and they are also said to make rain, thunder, and wind.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:5
  text: Witches anoint a stick with a spoken formula for travel, and a witch whose
    body is turned upside down after she has gone up cannot come back in.
  category: action
  evidence_refs:
  - ev:6
- id: obs:6
  text: Remedies for bewitched water, a becried child, and spectral misdirection use
    three kinds of wood, three stalks of straw, changed shoes, and a hat worn differently.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:7
  text: Some household exchange rules restrict giving out milk, lending objects on
    the day of childbirth or gelding, and speaking about witches on certain nights.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:8
  text: Marriage omens concern a bride kneeling on the bridegroom's cloak, entering
    bed first and receiving water, which spouse first rises from the altar, and whether
    the couple stands with a visible gap between them.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:9
  text: Death-related entries say unbaptized dying children join the Furious Host,
    windows and hollow objects should be managed so the soul can exit, and the dead
    or their linen may be prevented from resting by improper handling.
  category: relationship
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:10
  text: Childbed and child omens involve a husband's spoon and slippers, hidden water
    under the bed, a child passed through a peep-window, first words predicting a
    later child's sex, and a cracked glass affecting offspring.
  category: action
  evidence_refs:
  - ev:13
- id: obs:11
  text: Seasonal luck entries connect the first cuckoo call in spring and Shrovetide
    foods or spinning with money, flax, and household prosperity.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:12
  text: Cut hair should be burned or thrown into running water; if a bird carries
    it away, the person's hair will fall out.
  category: sequence
  evidence_refs:
  - ev:16
