canonical_text:
  quote: ''
  summary: A compressed comparative note lists comic and miraculous episodes involving
    Christ, Peter, gamesters, heavenly entry, a devil-sack, grain, trees and vines,
    a horse-shoeing miracle, cherries, an apple-tree tale, a girl carrying water,
    a haddock capture, and fruit-throwing saints, with several cited parallels in
    other tales and traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Christ and Peter allow three wishes to a man described as having an artful
    moustache; he asks for a pretty wife, the winning card, and a sack for shutting
    up the devil.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Peter denies the man entrance into heaven, the man throws his cap into
    heaven and thereby takes possession.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage identifies echoes of a player who wants to enter heaven and is
    refused, including Brother Lustig and Jack the gamester.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gamester Jack requests a tree from which no one can get down, and the passage
    also notes casting dice for the soul in a cited source.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A thieving-cook incident is linked to Aviani Fab. 30, where a cook is said
    to have taken the heart of a boar.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Christ, journeying with Peter, pulls an ear from a sheaf and burns it at a
    candle; grains spirt out until they form a heap.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Lazy Peter is cudgelled by a peasant in a barn and later receives another
    beating at an inn because he will not play.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Lord makes hard boughs on peasants' trees that blunt their axes, and rude
    people are granted vines whose wine matches their manners.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In a farrier's shop Christ cuts off a horse's foot, shoes it, and puts it
    back on the animal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Peter refuses to pick up half a horseshoe; Christ picks it up, buys cherries
    with it, and Peter later picks up the cherries one by one to quench his thirst.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says that in tales of the blind man whose wife sits in an apple
    tree, Peter and the Lord act roles comparable to Pluto and Proserpine and to Oberon
    and Titania in cited works.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Christ walks with two apostles and three disciples and comes upon a girl carrying
    water.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Peter catches the haddock, which the passage compares to the Ases catching
    Loki and Loki catching Andvari.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Peter comes from heaven to earth on leave, and another cited image has St
    Peter on a roof throwing pears down while St Claus throws rotten apples up.
  category: sequence
  evidence_refs:
  - ev:10
