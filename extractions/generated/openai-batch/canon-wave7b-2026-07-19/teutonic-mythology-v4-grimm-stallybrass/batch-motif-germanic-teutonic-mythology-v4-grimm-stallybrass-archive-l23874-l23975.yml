  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source text; summarized rather than quoted.
- id: ev:15
  type: summary
  locator: lines 23874-23975, item 58
  quote_or_summary: Hands and ears held over the fire prevent an ear ailment and nail
