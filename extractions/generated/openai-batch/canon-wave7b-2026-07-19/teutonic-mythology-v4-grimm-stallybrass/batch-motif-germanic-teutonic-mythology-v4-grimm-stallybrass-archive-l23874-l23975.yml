canonical_text:
  quote: ''
  summary: A numbered list of household, agricultural, bodily, marriage, craft, and
    death-related superstitions, many tied to Christmas day, Christmas matins, the
    Unter-nachten, Friday, or an object carried to church. The prescriptions use feeding,
    kissing trees, fire, smoke, stools, sieves, spoken formulas, prayer, bodily gestures,
    and avoidance taboos to obtain fertility, protection, cure, wealth, marriage prospects,
    sales, or survival.
  language: German with English editorial glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After-hay and oats are placed during the specified nights, left until the
    nights end, and then fed to livestock; the expected result is that crows will
    not eat them that year and they will be fruitful.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A rule says not to strip or skin a specified wooden object so that the livestock
    will not be skinned during the year.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: On Christmas morning pigs are enticed outside the gate, given oats in a hoop
    or ring, and addressed with a formula contrasting one’s own and the neighbors’
    animals; the expected result is healthy pigs for the speaker and sickness for
    the neighbors.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kissing trees is said to make them fruitful during the year.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: When going to Christmas matins, a person cuts down a stick and carries it
    home; on St. John’s Eve the stick is put on the fire, causing all cudgels in the
    parish to come to that fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: During the Unter-nachten, maidens run at night along a long hedge; if one
    grasps a long stick, she will have a tall husband.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: All milkpails are turned upside down on the table and smoked so that no one
    steals the milk.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: While going to matins, a person performs a bodily action described as belching
    or rumbling and passes over himself; the expected result is not dying that year.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: One item states, in unclear wording, that during the same nights a person
    will not greatly hunger in the year and will easily gain enough.
  category: other
  evidence_refs:
  - ev:9
- id: obs:10
  text: A person with goitre knocks or performs an action, speaks a formula transferring
    the goitre, touches the goitre, opens the window, and throws it out; the goitre
    is said to pass away.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Not sneezing during the nights is associated with livestock not dying.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: A smoke-vessel or censer is brought three times over oneself so that unspecified
    biting creatures will not bite during the year.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: If one notices a worn-out penny on Christmas day, pennies are said to be readily
    gained.
  category: object
  evidence_refs:
  - ev:13
- id: obs:14
  text: Whoever names wolf or fox is said to have clothing that will not sit or fit
    properly during the year.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: Holding hands and ears over the fire is said to prevent an ear ailment and
    the festering of nails.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: When a tacz, glossed uncertainly as a due or offering, is carried to church
    past a house, a girl in that house runs and sits on a three-footed stool; the
    same man is said to become hers.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: Before going to a dance, sitting on a three-footed stool or looking through
    a sieve is said to make others dance with the person before the rest.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:18
  text: A shoemaker who places leather on a stool while cutting out shoes is said
    to sell the shoes quickly.
  category: action
  evidence_refs:
  - ev:18
- id: obs:19
  text: On Friday, an instruction about not cutting off a pock or pimple is connected
    with a sow not becoming measly.
  category: action
  evidence_refs:
  - ev:19
- id: obs:20
  text: A child born with a red ring around the neck is said to be hanged.
  category: attribute
  evidence_refs:
  - ev:20
- id: obs:21
  text: Whoever says seven Paternosters and completes the required yearly recitation
    lives out the year; if the prayers are not completed, the person dies that year.
  category: sequence
  evidence_refs:
  - ev:21
- id: obs:22
  text: When the tacz is carried to church past a house and a person sees it, the
    person is told to stir the fire with a specified object; then no one from the
    house dies.
  category: sequence
  evidence_refs:
  - ev:22
