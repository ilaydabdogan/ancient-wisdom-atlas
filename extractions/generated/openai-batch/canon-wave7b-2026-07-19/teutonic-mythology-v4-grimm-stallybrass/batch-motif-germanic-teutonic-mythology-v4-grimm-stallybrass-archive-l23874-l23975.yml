  claim: Within the passage, items 59 and 65 share the event of a tacz carried to
    church past a house as a ritual occasion, although item 59 uses it for marriage
    divination and item 65 for household death prevention.
  claim_level: same_motif
  target: Within-passage items 59 and 65
  evidence_refs:
  - ev:16
  - ev:22
  counter_evidence_refs: []
  confidence: medium
  limitations: The exact meaning of tacz is uncertain in the edition, and the two
    items have different stated functions.
- id: claim:2
  claim: Items 49, 59, and 60 function together as marriage or social-precedence divination
    procedures using bodily action with an object or seat.
  claim_level: same_function
  target: Within-passage marriage and dance divination pattern
  evidence_refs:
