  text: Muspell’s sons are said to have their own array, and the field where they
    encounter the gods is named Vígríðr and also Oskopnir.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the world is destroyed by fire and lists Indian, Ionic,
    Roman, Celtic, Anglo-Saxon, and German expressions or parallels for world-ending
    fire; the Celtic example includes both fire and water.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage lists references to Antichrist and notes that Müllenhoff does
    not see much affinity between the Muspilli and the Edda.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage lists Old Norse expressions for the doom or twilight of gods,
    including forms glossed around ragna rök and related phrases.
  category: speech
  evidence_refs:
  - ev:4
