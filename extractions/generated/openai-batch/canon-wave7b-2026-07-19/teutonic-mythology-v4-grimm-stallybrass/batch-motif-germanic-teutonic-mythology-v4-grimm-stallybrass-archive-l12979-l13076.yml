- id: obs:7
  text: A German superstition says a small bird sleeps with its claw over its head
    to shield itself if the sky should fall in the night.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The ship Naglfar is connected with Naglfari, husband of Nott, and its construction
    is compared with a very long process of an iron rock being worn away by a woman’s
    veil once every hundred years.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: An Anglo-Saxon belief is cited about something being torn from the teeth of
    a hellhound.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Last Judgment is compared to Minos’s tribunal in the underworld and to
