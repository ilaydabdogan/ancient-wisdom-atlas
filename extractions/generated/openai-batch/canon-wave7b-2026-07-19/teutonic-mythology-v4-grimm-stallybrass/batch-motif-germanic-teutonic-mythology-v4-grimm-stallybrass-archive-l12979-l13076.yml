canonical_text:
  quote: ''
  summary: 'A comparative note passage on end-time and afterlife traditions: Muspell’s
    sons encounter the gods on a named field; the world’s end is described or compared
    as fire, fire and water, falling stars, broken rainbow, falling sky, earthquake,
    and other signs; judgment of souls is compared across traditions; and valkyries,
    angels, Valhall cliffs, water, Odin, and wounded warriors are connected with afterlife
    conveyance or entry.'
  language: English with cited Old Norse, Latin, Greek, Anglo-Saxon, Gaelic, and German
    forms
  quote_policy: summarized
