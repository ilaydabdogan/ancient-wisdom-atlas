  summary: 'The passage is a comparative catalogue of sickness-healing figures and
    practices: invoked healer-deities and physicians, dream-revealed remedies, women
    and supernatural female beings skilled in herbs, a god in female disguise as a
    she-doctor, healing food for Balder, water and wood women with herb-lore, plague-preventive
    herbs, and a woods vila who demands payment and poisons refusal.'
  language: English
