canonical_text:
  quote: ''
  summary: 'The passage collects comparative plague lore: plague appears as angels,
    death-riders, fog, mist, cloud, viper, black shape, human plague figures, animal
    forms, and pestilent spirits; it can be trapped in holes, trees, graves, hills,
    or by staking; cattle plague is countered by burying or sacrificing animals; a
    bird gives a plant remedy. The passage ends by introducing ancient herb lore about
    ritual and incantatory virtues.'
  language: English
  quote_policy: summarized
