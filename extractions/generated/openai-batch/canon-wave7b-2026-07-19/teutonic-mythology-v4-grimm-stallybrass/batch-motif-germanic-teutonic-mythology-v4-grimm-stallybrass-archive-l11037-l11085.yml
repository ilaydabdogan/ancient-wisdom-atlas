literal_observations:
- id: obs:1
  text: People are described as praying toward the sun and saluting it, especially
    at sunrise; the passage also cites sun worship among Tartars and a feast of the
    siai in Dauphiné.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among Tunguses, an accused man must walk toward the sun, brandish a knife,
    and say that if he is guilty the sun may send sickness into his bowels like the
    knife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The moon is given Sanskrit and Polish titles meaning lord of night or lord
    of the stars, and is described as shepherd of the stars.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The moon is invoked against anger and asked for riches; the passage compares
    German and Swedish prayers asking the moon to increase money.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bretons cry to the moon to leave them well, and when the moon rises they kneel
    and say a pater and ave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that Bacchus is assigned to the sun and Ceres to the moon.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: According to F. Magnusen as cited here, Freyr is identified with the sun,
    Freyja with the moon, and four names of Freyja are identified with the moon's
    phases.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Christ is often likened to the sun and Mary to the moon.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: A proverb or saying contrasts the sun shining with the moon greint or grins/cries.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: In Pohjola the sun and moon are stolen, and the sun is delivered from captivity
    by Perkun's hammer.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: In eclipses, the demon Rahus threatens the sun and moon, and a dragon tries
    to swallow the moon.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage notes the Swedish term sol-ulf and Danish sol-ulv, both meaning
    sun-wolf.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: The sun may withdraw its light in grief or in anger.
  category: action
  evidence_refs:
  - ev:10
