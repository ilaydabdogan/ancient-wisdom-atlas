canonical_text:
  quote: ''
  summary: A set of notes on Wodan/Wuotan links the figure with weather, wind, storm,
    the wild hunter, war names, the wild host, Frea/Frigg, divine chairs or thrones,
    rainbow and heaven-door imagery, and the concept of Wunsch or wish as divine beneficence
    and creative power. The passage also compares Wodan with Zeus, Indra, and Loptr;
    cites Zeus touching or breathing on Io to beget Epaphos; and compares German tales
    of the Lord's chair and heaven with many doors to Greek ideas of Zeus's throne
    and doors for receiving human prayers and offerings.
  language: English
  quote_policy: summarized
