  quote: ''
  summary: A numbered list of Scandinavian folk superstitions concerning domestic
    taboos, omens, livestock protection, agrarian rites, calendar customs, forest
    disorientation, and a bathing charm addressed to Näcken.
  language: English with Swedish terms and glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A light is not to be shown under the table, because the spirits are said to
    become disunited or quarrel.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One should not turn back while going on an errand, because the errand may
    turn out badly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a stranger enters where candles are being dipped, he is to touch the
    fire; otherwise the tallow loosens from the candles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Spinning on Thursday evening or during Carnival is forbidden, because it is
    said to spin on at night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: If a stranger enters where sausage is being boiled, the sausage is said to
    burst.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: If someone with evil eyes sees a slaughtering, the beast is said to die hard.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Putting slippers or shoes with the toes toward the bed is said to bring the
    mare at night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: On Easter-eve a cross is to be made over the cowhouse-door against troll-women.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: On the first night in a house, counting the rafters is said to make what one
    dreams come true.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Forgetting something when setting out is taken as a hopeful sign that the
    traveller will return, while looking back is said to be a bad sign.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: Birds washing or magpies scratching near houses are said to indicate that
    strangers are expected; if the floor has not been swept, it should then be swept.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:12
  text: Walking three times around the cabbage-bed after setting the cabbage is said
    to keep it free from slugs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: When a loom is taken down, a burning coal is to be thrown through it so that
    a new web may soon be set up.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: Putting fire in the vessel before malting is said to prevent the drink from
    turning sour.
  category: action
  evidence_refs:
  - ev:4
- id: obs:15
  text: On Christmas-eve rye-straws are thrown into the roof, and the number that
    stick is used to predict the number of rye stacks for that year.
  category: action
  evidence_refs:
  - ev:4
- id: obs:16
  text: Empty sacks are not to be carried untied; if a pregnant wife follows after
    them, her baby is said never to be satisfied, and if a cow crosses the unlucky
    way, she is said never to get a calf.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:17
  text: In bathing, steel is put in the water, and Näcken is addressed with a formula
    telling him to stay at the shore as far away as the cry can be heard.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:18
  text: Spring crop practices include signs from well-moulding corn, use of matter
    from the manure place, a handful of mould in the seed-basket, and a prohibition
    on taking fire from a neighbouring farm on sowing day.
  category: action
  evidence_refs:
  - ev:6
- id: obs:19
  text: On Easter Saturday a long lur is blown through the cowhouse window; beasts
    of prey are said to keep away as far as the sound is heard.
  category: action
  evidence_refs:
  - ev:6
- id: obs:20
  text: When seeking cattle in the wood, the appearance of a fatling on the right
    hand is said to mean that the sought animal will be found again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:21
  text: Swine let out on Lucia day are said to become uncanny, and swine let out on
    Easter-eve are said to become field-going.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:22
  text: If one goes astray in the woods, turning the clothes inside out is said to
    bring one to the right way; the passage adds a parenthetical reference to Germ.
    852.
  category: action
  evidence_refs:
  - ev:7
- id: obs:23
  text: If cattle are driven in silently on Michaelmas Eve, they are said to remain
    quiet in the cowhouse all year.
  category: action
  evidence_refs:
  - ev:7
- id: obs:24
  text: Livestock breeding signs and acts include striking a cow on the back with
    a kitchen spoon after she has been mounted, reading well-combined burning ashes
    as a sign that cattle will breed well, and saving Shrove Tuesday food to feed
    cattle when first let out in spring so they come home from the wood.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:25
  text: At the first hay-loading, the text states that if the manservant first gets
    his armful of hay, ox-calves will be born; the excerpt cuts off before the contrasting
    maid outcome is completed.
  category: sequence
  evidence_refs:
  - ev:7
