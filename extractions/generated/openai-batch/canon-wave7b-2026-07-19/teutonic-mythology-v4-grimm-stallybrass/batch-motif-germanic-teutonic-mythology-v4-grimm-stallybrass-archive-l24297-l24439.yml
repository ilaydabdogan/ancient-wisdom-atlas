canonical_text:
  quote: ''
  summary: 'A list of reported superstitions and magical practices: bird and weather
    omens, charms using Christian ritual times or objects, household and livestock
    protections, healing gestures, magical flight or rapid travel, harmful magic using
    gallows and animal/body materials, and a church-door ritual calling the dead to
    arise. An editorial footnote cites a corresponding passage from the Strolling
    Scholar with related magical instruction and reverse movement around a kitchen.'
  language: German with English editorial glosses and notes
  quote_policy: summarized
