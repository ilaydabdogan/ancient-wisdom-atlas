    as related but contrasting ways of situating heroes near gods.
  claim_level: same_function
  target: Germanic and Saxo traditions of divine ancestry, semidivinity, and mortal-divine
    difference
  evidence_refs:
  - ev:2
  - ev:3
  counter_evidence_refs: []
