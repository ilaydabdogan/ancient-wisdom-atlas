canonical_text:
  quote: ''
  summary: 'A comparative note-section on heroic traditions: variants of Tell''s apple-shot
    tale; gods and heroic lineages; mortal/divine separation; degradation or deification
    of gods, heroes, rulers, and ancestors; heroic beauty and large stature; multi-limbed
    or multi-headed beings; second birth or rebirth of heroes; miraculous birth signs;
    infant heroes tested by snakes; precocious children; and grown heroes displaying
    extreme strength.'
  language: English, with cited Latin, German, French, Old Norse, and other phrases
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage notes that some stories make Tell's son shoot the apple from the
    father's head, reversing the more familiar parent-child arrangement.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that a god may stand at the head of a human line because
    he is treated as father or grandfather of men, while also emphasizing a sharp
    distinction between gods and mortals.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Nanna is described, in the cited Saxo passage, as rejecting Balder's suit
    because a god and a mortal cannot be joined in marriage.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Saxo is reported as calling Othin, Thor, and related figures not naturally
    gods but gods by opinion, and Balder a semigod.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage lists examples in which men, rulers, ancestors, saints, or relics
    are adored, deified, or treated as godlike.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Heroes are said to share divine beauty and lofty stature; Hugleicus is presented
    as a figure whose large bones were preserved and displayed as a marvel.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage lists beings or heroes with extra limbs, faces, ears, elbows,
    or heads, including three- or four-elbowed Heime and a three-headed figure on
    the Gallehus horn.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Heroes favored with a second birth are said to be especially akin to gods,
    with Helgi and Svava named as genuine reborn figures.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Karna is described as born with earrings and a coat of mail, and Alexander's
    birth is said to have been accompanied by a storm.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Alcmena tests Hercules with snakes, which he kills while lying in his cradle;
