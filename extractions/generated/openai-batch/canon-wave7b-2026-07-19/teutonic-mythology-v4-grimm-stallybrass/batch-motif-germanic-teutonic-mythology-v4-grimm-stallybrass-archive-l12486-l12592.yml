canonical_text:
  quote: ''
  summary: 'The passage gathers comparative notes on spring and summer customs: plants
    and birds herald spring; songs portray Summer and Winter as opponents or brothers,
    with Winter subdued or killed; a straw Winter is burned on a wheel; Death is carried
    out; May-bride, May-queen, and spring-nymph processions involve garlanded girls,
    gifts, May-trees, and songs; spring dances, forest outings, and the Roman ver
    sacrum are also mentioned.'
