  confidence: high
  cautions: The passage provides a charm text, not a narrative myth; taxonomy mapping
    is therefore left open.
- id: motif:2
  label: Road encounter with harmful being and verbal banishment
  taxonomy_refs: []
  basis: Jesus questions a harmful figure about its destination and intent, and the
    figure is barred or commanded away by a holy name.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The printed form of the harmful figure's name appears OCR-corrupt or uncertain.
- id: motif:3
  label: Binding affliction by holy hands, thread, angels, or formula
  taxonomy_refs: []
  basis: Several formulas bind or restrain harm through hands, silk thread, angels,
    and holy names.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:9
  confidence: high
  cautions: The bound entity is not always explicitly named in each formula.
- id: motif:4
  label: Angelic protective perimeter around the sleeper
  taxonomy_refs: []
  basis: The Jutland protective formula places twelve angels around the speaker's
    head, legs, and sides after expelling the devil and spirits.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is a ritual-protective charm rather than a full mythic episode.
- id: motif:5
  label: Saintly divination of future domestic or marital fate
  taxonomy_refs: []
  basis: Lucia is asked to reveal whose cloth, bed, child, beloved, and arm will belong
    to the speaker's future.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage does not explain the ritual context beyond the words of the
    prayer.
- id: motif:6
  label: Disease or harmful creature sent to a remote mountain
  taxonomy_refs:
  - serpent
  basis: Jesus sends the snake that goes to the weak back to the blue mountain and
    binds it there.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The disease term Bendsel is glossed only briefly as gout or rheumatism.
- id: motif:7
  label: Analogical healing by divine precedent
  taxonomy_refs: []
  basis: The broken-bone spell narrates Jesus' foal suffering a leg injury and being
    healed by aligning marrow, bone, and hide, providing a model for treatment.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage does not explicitly state the analogy, but the healing narrative
    is embedded in a formula for a broken bone.
- id: motif:8
  label: Three allaying words for horse disease
  taxonomy_refs: []
  basis: The qvårsild formula identifies three named powers or words—earth, sun, and
    Mary—as allaying the disease.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The exact ritual action is not described beyond the spoken formula.
- id: motif:9
  label: 'Plant substitution countercharm: dock outplaces nettle'
  taxonomy_refs: []
  basis: The nettle-sting remedy uses dock leaves and an in/out verbal formula contrasting
    dock and nettle.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage gives brief practical instructions and cited parallels, not
    an origin narrative.
comparison_claims:
- id: claim:1
  claim: 'Within this passage, the Rijlla charm and the snake/Bendsel charm share
    a functional pattern: Jesus encounters a harmful being on the road, questions
    it, and then the being is stopped, turned back, or expelled.'
  claim_level: same_function
  target: Internal road-encounter banishment pattern in the spells
  evidence_refs:
  - ev:2
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal pattern comparison only; it does not establish
    common origin outside the passage.
- id: claim:2
  claim: The nettle/dock formula is explicitly compared in the passage with Chaucer's
    'Nettle in, dock out' and a Middle Latin saying, supporting a cautious claim of
    formulaic or linguistic similarity.
  claim_level: linguistic_similarity
  target: Chaucer, Troilus and Criseyde 4.461, and a Middle Latin nettle/dock saying
  evidence_refs:
  - ev:12
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage reports parallels but does not demonstrate historical contact
    or derivation; the editorial note warns that older documents are needed to clarify
    origin and drift.
