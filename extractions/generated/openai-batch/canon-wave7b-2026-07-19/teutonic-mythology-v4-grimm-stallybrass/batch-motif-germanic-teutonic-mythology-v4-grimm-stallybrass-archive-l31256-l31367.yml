canonical_text:
  quote: ''
  summary: A sequence of Scandinavian and related healing, protective, divinatory,
    and counter-sting spells. The formulas invoke Christ, Jesus, Mary, John the Evangelist,
    St Lucy, angels, holy names, bodily substances, binding gestures, plants, and
    commanded departures of harmful beings or diseases.
  language: English edition with Danish spell texts and English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One charm says Christ moved in a martial setting and dulled drawn swords and
    weapons by means including hands, fingers, blood, spirit, cross, angels, and apostles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dialogue on the road has Jesus ask a harmful figure where it is going; the
    figure says it intends to harm N. N.'s blood, bone, hands, and neck, and John
    the Evangelist forbids it in Jesus' name.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A formula describes Jesus standing under an aspen and sweating water and blood,
    then binds the addressed force with hands, angels, wool, grass, and a Holy Spirit
    bond.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A prayer to Lucia asks her to let the speaker know whose cloth, bed, child,
    beloved, and arm will be connected with the speaker.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Jutland bedtime formula has the speaker lie on the right side and command
    Ragirist or filth out while inviting Mary with Jesus Christ or the child in.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A protective formula places a barrier between the devil and the speaker, includes
    Mary and Jesus speaking about fingers and toes, binds them with a silk thread,
    orders the devil and seven evil spirits away, and stations twelve angels around
    the speaker.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In a charm for Gripes, Christ goes to church with a book, Mary asks why he
    is pale, and Christ answers that he has received a strong grip.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Another Gripes formula names several kinds of grip, including snow-grip and
    dead-man's grip, and all grips falling between heaven and earth.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: In a charm against Bendsel, Jesus meets a snake on the road; the snake says
    it goes to the weak, and Jesus turns it back, sends it to the blue mountain, and
    binds it with fingers and twelve angels.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: In a broken-bone formula, Jesus rides to the heath, breaks or rides asunder
    his foal's leg, dismounts, doctors it, lays marrow to marrow, bone to bone, and
    hide to hide, and places a leaf on it.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: 'A horse-disease formula says three words allay qvårsild: the earth, the sun,
    and the mother of Jesus Christ, the Virgin Mary.'
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: For nettle-sting, the passage instructs taking dock leaves, spitting on them,
    rubbing the affected place, and saying a short in/out formula; it then cites Chaucer
    and a Middle Latin saying with similar wording.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The editor states that more incantations and older documents would be needed
    to understand their origin and drift, and notes that many oral versions are corrupt
    or unintelligible while often antique and poetic.
  category: other
  evidence_refs:
  - ev:13
