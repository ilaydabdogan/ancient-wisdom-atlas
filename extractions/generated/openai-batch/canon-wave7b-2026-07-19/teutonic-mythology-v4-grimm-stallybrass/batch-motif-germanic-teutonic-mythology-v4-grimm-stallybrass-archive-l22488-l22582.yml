canonical_text:
  quote: ''
  summary: A scholarly passage compares Anglo-Saxon, Norse, Continental German, and
    Gothic genealogical traditions. It discusses variations in Odin/Woden ancestry
    lists, the interpolation of Thor's kindred, medieval poetic echoes of Scylfing/Skjoldung
    names, the Sceof-Scyld descent, and Jornandes' Gothic genealogy from Anses and
    Gapt into historical Gothic rulers. The passage emphasizes old genealogies that
    connect named royal or ethnic lines with gods and mythic ancestors.
  language: English
  quote_policy: summarized
