canonical_text:
  quote: ''
  summary: A catalogue of late medieval German superstitions and forbidden arts lists
    divination with shoes, magic involving a hanged thief's rope, horseshoe nails,
    needles, dog tracks, witches taking cat shape, theft of wine from people's veins,
    questioning a corpse, ritual actions for a sleepless child and for ear-mützel,
    extracting wine from an oak post, thread-ball and barley-pap practices, reviving
    a hanged thief, use of a shroud, night riding on calves and goats, and Hartlieb's
    description of aerial riding on magic steeds identified with the Devil.
  language: English with Middle High German/German excerpt and glosses
  quote_policy: summarized
