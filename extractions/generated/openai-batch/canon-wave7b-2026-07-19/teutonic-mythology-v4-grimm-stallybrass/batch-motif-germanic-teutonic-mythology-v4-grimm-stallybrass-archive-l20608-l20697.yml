canonical_text:
  quote: ''
  summary: Comparative notes on healing, expulsion, evil-eye, agricultural, livestock,
    and bee charms. The passage cites formulas for setting bones, sending ailments
    away, making enchantments vanish, promoting crop growth through offerings or height-gestures,
    assigning holy guardians to livestock, and compelling a bee swarm by means of
    Mary and a vessel made by Joseph.
  language: English with embedded Scandinavian, Latin, German, and translated Sanskrit
    passages
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A horse or foal healing formula joins flesh with flesh and blood with blood,
    after which the black foal is said to become well.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A cure for an ailment called floget or flomdet commands it to fly out of cartilage
    and bone into stock and stone, with repeated invocation and ritual actions involving
    spitting into the hand and striking the mouth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage cites Atharva-veda 4.12 as a similar bone-setting formula that
    addresses bone, marrow, joints, skin, blood, an Herb, and an Elf or ribhu.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In a Latin narrative spell, Nesia nociva wanders through streets seeking someone
    to injure, and the Lord commands her to leave a servant of God and go to a desert
    place.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: For pain in the head or belly, an old woman grasps and presses the painful
    part and repeats a formula nine times telling a lady mother to go to rest in her
    chamber.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Masurian charm tells the white folk to depart from a baptized person’s skin,
    body, blood, veins, joints, and limbs and to go to a great stone far in the sea.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: An evil-eye charm compares dew vanishing or being blown away with thrice-nine
    enchantments vanishing, perishing, and being blown away in air.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage connects an Anglo-Saxon remedy involving turf carried to church
    with a Latin charter formula of placing a clod of earth on the altar.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Agricultural rite examples include laying a broad loaf in the first furrow
    and filling a root-hole with various fruits or grains as appeasement of the earth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage lists cakes and spoken spells associated with wheat-sowing or
    flax-sowing in several European regions.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Wallachian hemp dancers lift their arms as high as possible so that the hemp
    may grow high.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: At New Year’s midnight an Esthonian farmer throws handfuls of grain onto a
    shelf while asking God that the grain grow that high during the year.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Livestock charms and songs name Martin, Johannes, Jesus, Suvetar, and Etell
    as guardians, feeders, watchers, or protectors of oxen, swine, flocks, or cattle.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: A German bee-spell has Mary standing on a very high mountain, seeing a swarm
    of bees flying, raising her blessed hand, and directing the swarm toward a vessel
    made by Saint Joseph.
  category: sequence
  evidence_refs:
  - ev:11
