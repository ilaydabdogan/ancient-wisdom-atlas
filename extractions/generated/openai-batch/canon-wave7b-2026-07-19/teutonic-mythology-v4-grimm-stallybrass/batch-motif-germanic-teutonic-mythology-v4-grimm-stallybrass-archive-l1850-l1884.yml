canonical_text:
  quote: ''
  summary: 'The passage describes rules for an Old Norse sanctuary, notes continuity
    between heathen places of worship and later Christian estates or churches, and
    lists signs by which holy or church-building sites were revealed: heavenly fiery
    implements, night lights outlining a ground plan, falling snow, a falcon, cows,
    resting animals, and footmarks of gods and heroes on German mountains.'
  language: English
  quote_policy: summarized
