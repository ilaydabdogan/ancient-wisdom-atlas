    Latin, Sanskrit, Finnish, Estonian, and other terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that personification does not immediately create proper
    names, but does produce names with articles such as Wunsch, Sælde, and Hunger.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists personified elements and qualities, including Pogoda, Ignis,
    Aqua, Aer, Veritas, Frosti, Logi, Skjálf, and Snow described as a new neighbour.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says Estonians worship Cold as a higher being and lists Finnish
    names connected with ice or severe cold as genii.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage asks whether the heath was thought of as a person, says the heath
    blushes for shame, and says men blessed the Way and bowed to it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage reports that George in Reinbot's allegory is a child of the Sun
    and the Rose and is called Rosenkint.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage compares Anglo-Saxon feminine month names Hrede and Eostre with
    Roman Maia, Flora, and Aprilis as goddesses.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says the sword, called the biter, is often made a person, and
    notes other object-kinship or object-agency expressions involving an awl, a dwarf
    or knife, a helmet, mail, and a ship addressed as a living creature.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says beautiful women were compared with goddesses of female ornament
    and also lists minor goddesses of nuts, bees, dough, grains, and similar domains.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says men greeted the player's die and bowed to it, and it links
    dice terms and dice-playing examples with named ages, demons, and epic players.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage gives agency or bodily action to Victory, Battle, Repentance,
    and Anger, and gives kinship or procreation language to Quarrel, Hate, and Envy.
  category: action
  evidence_refs:
  - ev:8
