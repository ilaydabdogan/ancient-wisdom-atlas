canonical_text:
  quote: ''
  summary: 'A scholarly catalogue of personification examples: abstractions, elements,
    natural forces, roads, trees, months, weapons, ships, ornaments, dice, victory,
    battle, repentance, anger, hate, and envy are discussed as beings, agents, divine
    figures, or objects receiving address, blessing, worship, greeting, or kinship
    language.'
