  summary: The passage collects poetic and philological examples in which Winter,
    Summer, and May are personified as entering, fleeing, returning, exerting power,
    and bringing goodness, flowers, birdsong, and bliss. It states a comparison between
    German Summer or May and the Scandinavian god Freyr returning from exile, and
    also compares May/Summer to Roman goddesses. It cites a poetic example of a god
    settling on a tree so that it has leaves and blossoms, and cites polemical verses
    against adoring birdsong, bright days, flowers, and grass.
