canonical_text:
  quote: ''
  summary: The passage condemns divination and superstition, listing forms of divination
    by fire, air, earth, water, necromancy, and other omens. It states that such practices
    involve demonic deception, imagined prophetic dead, and apostasy from Christian
    faith. It then presents a translated canonistic passage about women who believe
    they travel by night with Diana or Herodias on wild animals, followed by an explanation
    that these experiences are false dream-delusions produced by the evil spirit rather
    than bodily journeys.
  language: Early New High German / Middle High German with English editorial glosses
  quote_policy: summarized
