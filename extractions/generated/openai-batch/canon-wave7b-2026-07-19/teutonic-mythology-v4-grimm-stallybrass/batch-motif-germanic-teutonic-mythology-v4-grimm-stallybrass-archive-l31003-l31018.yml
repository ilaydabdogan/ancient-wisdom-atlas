canonical_text:
  quote: ''
  summary: A German spell or charm recounts the wonder of Jesus Christ's birth from
    Mary, Mary's painless forty-week carrying of him and his birth in Bethlehem, a
    passage over a wild sea, three sharp thorns including a hard nail, the crown of
    thorns and flowing blood, John's lament over Christ's death on the cross, and
    the transformation of leaf, grass, and all on earth after Christ dies. An editorial
    note reports a similar formula in the little Book of Romanus.
  language: German with English editorial notes
  quote_policy: summarized
