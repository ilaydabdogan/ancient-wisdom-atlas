canonical_text:
  quote: ''
  summary: 'The passage gathers notes on Balder and related names: Midsummer is said
    to be sacred to Balder, with St. John apparently substituted in Christian observance;
    mistletoe is linked to Balder''s slaying and to Midsummer cutting; St. John fires
    and Baldersbal are connected or queried in relation to Balder''s burning. A cited
    riddle asks what Odin spoke into his son''s or Balder''s ear before the funeral
    pyre. Hoðr is identified as Balder''s slayer and is said to be laid on a funeral
    pile by the newborn Vali. The passage also records Saxo''s Hotherus as a heroic
    figure with special skills and gifts, and includes philological discussion of
    Phol, Wodan, place names, and possible name connections.'
  language: English
  quote_policy: summarized
