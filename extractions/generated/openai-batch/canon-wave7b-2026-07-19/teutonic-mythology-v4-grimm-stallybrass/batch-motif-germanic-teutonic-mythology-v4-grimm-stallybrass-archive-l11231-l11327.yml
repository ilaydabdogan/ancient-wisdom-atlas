literal_observations:
- id: obs:1
  text: An Old-Chinese tradition is reported in which a man in the moon repeatedly
    drives an axe into the giant tree kuei; the cuts close again, and he suffers for
    sins committed as an anchoret.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Wallenhausen in Swabia, races were held for the thorn-bunch; the third
    lad had a bunch of thorns tied on his back.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Bavaria, reapers leave some ears standing, dance around them, sing to St.
    Mdha for more grain, and tie stalks together as St. Mdha's stack.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kotar is described as a herdsman beloved by the goddess Triglava, who put
    him in the moon.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage notes lunar names and figures including a Finnish moon or moon-maiden,
    a pursuer of the moon, and a named man in the moon called ludergehr in Brother
    Gheraert.
  category: other
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The sun is said to dance at Easter; another cited report says Indians say
    the sun dances and salute him by dancing in imitation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Stars are described as glistering, twinkling, and sparkling; morning stars
    break out like fire or burning, and stars may sink or rush down.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Stars are said to be invoked, to serve as messengers of gods, to do errands
    for lovers, and to be kind or hostile, lucky or unlucky.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Stars are said to take part in a person's birth and death, to have angels
    waiting on them, and to have their courses changed by God because of Atreus's
    misdeed.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The stars are called the moon's flock; the moon leads them to pasture, and
    songs compare a moving star or the sky of stars to a shepherd and lambs.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Shooting stars have vernacular names; a star falls into a maiden's lap, and
    shooting or flying stars are described as harbingers of war, dying, or the deaths
    of three daughters.
  category: action
  evidence_refs:
  - ev:10
