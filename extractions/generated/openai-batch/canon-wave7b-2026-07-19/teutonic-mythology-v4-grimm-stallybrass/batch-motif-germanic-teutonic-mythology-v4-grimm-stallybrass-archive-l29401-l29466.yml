- id: obs:2
  text: A feared returning dead person can be hindered by throwing a cupful of water
    after the corpse as it is carried out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Shooting at a ghost is called foolish because the ball flies back at the shooter;
    loading with a silver button is said to make the shot hit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The dead are said to go again on the third night after burial.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A pregnant woman should not go over a place where a knife has been sharpened;
    spitting three times on the place beforehand removes the danger.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Weighing a child immediately after birth is said to prevent it from thriving
    later.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Passing a child out through one window and back in through another is said
    to keep the child from growing bigger.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A woman who dies undelivered is said to give birth in the grave forty weeks
    afterward; needle, thread, scissors, and similar items are buried with her so
    she can sew baby-linen.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A remedy for toothache uses an elder twig placed in the mouth and then stuck
    in the wall with words ordering an evil spirit to go away.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: For ague, an elder stick is stuck into the ground without speaking; the fever
    is said to cling to the elder stick and then to the first unlucky person who comes
    there.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A 1722 manuscript note says elder should not be cut without first asking permission
    of Mother Elder; it also describes spitting to drive away hidden harmful beings
    at tree roots or to prevent harm from them.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: 'The breastbone of the Martinmas goose is used to predict winter: white indicates
    snow, brown indicates strong cold, and different parts correspond to winter before
    and after Yule.'
  category: object
  evidence_refs:
  - ev:11
- id: obs:13
  text: Seafarers sometimes see a ship sail past and vanish; this is called a dead-men's
