canonical_text:
  quote: ''
  summary: 'A numbered list of Danish superstitions and explanatory notes: quarrels
    and grudges over a lake affect fish; water, silver, and timing are associated
    with the returning dead; pregnancy, childbirth, infants, and posthumous birth
    are governed by taboos and remedies; elder twigs and elder-tree rites serve in
    healing, disease transfer, and protection from hidden beings; a goose breastbone
    foretells winter weather; and a vanishing ship at sea portends a shipwreck.'
  language: Danish with English glosses and a Latin manuscript note
  quote_policy: summarized
