canonical_text:
  quote: ''
  summary: The passage collects German charm formulas and procedures for a horse,
    a lost horse-shoe, milk theft, Holdichen or elf-like afflictions, and diseases.
    The charms use ritual gestures, household and sacred objects, commands to afflicting
    beings, Christian figures, brief sacred narratives, healing plants, water, and
    dairy imagery.
  language: Mixed German with English headings and editorial glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A horse charm instructs the practitioner to take a striking horse outdoors
    under the sky early on Sunday before sunrise, turn its head toward the sun, cross
    the thumbs, hold the hands around the foot without touching it, and recite a formula
    naming Longinus and the piercing of the Lord’s side.
  category: action
  evidence_refs:
  - ev:2
- id: obs:2
  text: A lost horse-shoe charm uses a bread-knife to cut or trace around the hoof
    from one heel to the other, places the knife crosswise on the sole, commands hoof
    and horn not to break, and repeats the words three times with prayers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: A milk-related charm directs holy water to be sprinkled in the stall and names
    ground-ivy, consecrated salt, and duckweed while requesting butter, milk, and
    whey.
  category: action
  evidence_refs:
  - ev:4
- id: obs:4
  text: Several charms against the Holdichen command an unnamed harmful presence to
    go out, return out by the way it entered, or provide a visible sign of departure.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:5
  text: Other Holdichen formulas address elves, female elves, dwarfs, and female dwarfs,
    commanding or threatening them in relation to bones, flesh, blood, earth, or a
    place under a bush.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:6
  text: 'One formula describes a nested sacred sequence: God’s mountain contains God’s
    well, the well contains God’s bowl, the bowl contains God’s apple, and with it
    lies Saint John’s Gospel, which removes bad things.'
  category: object
  evidence_refs:
  - ev:8
- id: obs:7
  text: A Joseph formula presents Joseph and a companion before God; Joseph laments
    that underground little ones want to rot his flesh and bones, and God forbids
    them to do so.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:8
  text: A Three Kings formula has the holy Three Kings going over a field, meeting
    alb and elbin, and commanding Albinne not to do the harmful act and to turn back.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:9
  text: A blood-stilling formula tells a mother figure to lay still in the blood as
    Jesus lay in his mother’s lap.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:10
  text: Disease charms name Jesus Christ, a water-flow, seventy-seven shots or diseases,
    nine kinds of shot, the Three Salomes, Mary, healing herbs, and Our Lady blessing
    a holy burn so that it does not ooze, swell, or eat inward.
  category: sequence
  evidence_refs:
  - ev:12
  - ev:13
  - ev:14
