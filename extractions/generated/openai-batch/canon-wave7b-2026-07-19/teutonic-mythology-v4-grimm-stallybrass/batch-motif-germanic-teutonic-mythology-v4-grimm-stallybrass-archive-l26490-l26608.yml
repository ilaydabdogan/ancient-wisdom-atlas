canonical_text:
  quote: ''
  summary: Numbered English list of Germanic folk superstitions concerning new houses,
    building omens, first journeys, household taboos, Christmas and New Year divination,
    childbirth and changelings, wedding luck, healing charms, cattle and crop protection,
    supernatural theft, footprint magic, and year-end beings such as Bergda and Perchte.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When moving into a new house, a living animal such as a cat or dog is thrown
    in first because the first entrant is said to be the first to die.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sparks from the first stroke while felling timber for a new building are treated
    as an omen that the building will burn down.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: New-house and service-entry rules include peeping into the copper before entering
    the sitting-room and servants creeping between their masters' legs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: First-time journeymen are told not to look round; strangers are excluded from
    the stable at milking time; after candles are lighted, washbasin water is not
    to be emptied in the street; parents swallow children's first teeth to prevent
    toothache.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: On Christmas Eve girls perform marriage divinations by sitting up from 11
    to 12, stripping naked, putting their heads into the copper, watching hissing
    water, sweeping backwards, or calling a lover outdoors or at a cross-road.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A woman in childbirth is not to be left alone; someone must watch the child,
    and the husband's trousers are thrown over the cradle to prevent a changeling
    from being put there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A girl whose distaff is unfinished on the last day of the year has it defiled
    by Bergda, described as a shaggy monster.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A bride keeps her bridal wreath and a piece of wedding bread; keeping the
    hardened lump is said to prevent want of bread, and a weary husband and wife may
    eat it soaked in pottage.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: After a wedding, a bridesmaid offers the bridegroom a glass of beer or brandy;
    if the emptied glass breaks when tossed behind his back, it is good.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A sage old woman treats sudden unexplained illness by drawing spring water
    without greeting anyone, dropping three coals into it, checking whether they sink,
    sprinkling the patient three times, and muttering a formula.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When cattle are first driven out in spring, iron tools are laid outside the
    stable door to keep them from being bewitched; a fire-steel or knife is put under
    the churn if butter will not come.
  category: action
  evidence_refs:
  - ev:7
  - ev:10
- id: obs:12
  text: Crop-related practices include cabbage similes comparing plant size to the
    body, adjuring flax not to flower too early, and girls dancing naked around flax
    and wallowing in it on St John's night.
  category: action
  evidence_refs:
  - ev:7
  - ev:10
- id: obs:13
  text: A dragon is said to carry eggs, butter, cheese, and lard to its worshippers,
    while the Evil One or devil is said to carry aftermath or corn to those who serve
    him or to his friends; calling the Saviour's name or shouting insults interrupts
    such actions.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Old women cut out turf on which an enemy has just trodden and hang it in the
    chimney so that the enemy wastes away.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: On the last day of the year, people eat dumplings and herrings to avoid Perchte
    cutting open their belly, removing the food, and sewing the wound with a ploughshare
    and chain.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The fire is kept in all night before Christmas Day; a New Year's night dream
    comes true; going to the 'heer' on New Year's Day makes a person young and ruddy.
  category: sequence
  evidence_refs:
  - ev:10
