canonical_text:
  quote: It is a sacrifice to the Invisible Spirit.
  summary: Four superstition entries state that farmers avoid giving earth from cornfields
    because it is thought to diminish prosperity; stepping over a girdle is said to
    cause itch; being beaten with dry twigs is said to cause consumption or leanness;
    and portions from a new loaf and drops from a full cup are given to the ground
    as a sacrifice to the Invisible Spirit.
