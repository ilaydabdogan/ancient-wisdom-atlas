canonical_text:
  quote: ''
  summary: The passage introduces Grimm's appendix on Anglo-Saxon genealogies, lists
    authorities, and summarizes the claim that Anglo-Saxon royal/noble pedigrees were
    pre-Christian traditions carried from Germany to Britain. These pedigrees trace
    noble families back to Woden and further to gods or deified heroes, then after
    Christianization were harmonized with biblical descent from Noah and Adam. Grimm
    argues that similar pedigrees likely existed among other Germanic peoples, though
    Anglo-Saxon sources preserved them most clearly.
  language: English
  quote_policy: summarized
