- id: obs:1
  text: The passage is headed as an appendix section on Anglo-Saxon genealogies and
    begins with a list of medieval authorities for the pedigrees.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Anglo-Saxons are described as leaving Germany for Britain in the fifth
    to sixth centuries while carrying data about the descent of their noblest families.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The noble-family genealogies are said to go back to Wodin, and some are said
    to go higher by naming gods or deified heroes as Woden's ancestors.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: After conversion to Christianity, the genealogical line of kings and gods
    was connected with the Old Testament tradition of early humanity, specifically
    Noah and Adam.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author compares this genealogical harmonization to churches being built
    on heathen temple sites and to Christian and heathen ceremonies being fused.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The pedigrees are described as pre-Christian, known to Angles and Saxons in
    their old home, and likely diffused among other Germanic nations on the Continent.
  category: attribute
  evidence_refs:
  - ev:6
