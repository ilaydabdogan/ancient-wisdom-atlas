literal_observations:
- id: obs:1
  text: The passage lists multiple names and related terms for aquatic beings, including
    wasser-nixe, spring-nixen, wasser-lisse, water-woman, water-nix, nickelmann, Neckar-geist,
    and kuli as genius aquae.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:8
- id: obs:2
  text: The Necken is said to have his dwelling among water roses or water lilies
    and to rise on their leaves in moonlit nights while playing strings to charm the
    hearer; a water-maiden is also said to sit on water-lily leaves.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Merwomen and water-women are described as prophetic, sometimes deceitfully
    so; a water-woman sends a prophetic voice from the water, and a spectre on a Danube
    whirlpool foretells death.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Scotch kelpie is described as taking the shape of a horse, being known
    by its neigh, drawing men in, and shattering ships; related water beings are described
    as bulls or water-bulls.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: A nixe is described as appearing as a richly caparisoned foal that tempts
    children to mount; the passage also describes a horse or bull rising from the
    sea and running away with people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The water-woman is said to try to drag a person in and to wrap rushes and
    sedge around the feet of bathers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The merminne is said to steal Lanzelet from his mother.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A merman or sea-wonder is described as long-bearded, with a body wound in
    moss; a nixe is said to have only one nostril.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The mermaid is described as combing her hair; female nixes are described as
    beautiful, with wet aprons, a patched gown, and, in one dancing sea-maiden example,
    a visible tail.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage notes a sacrifice to the fossegrim and a custom of throwing a
    black cock into the Bode once a year for the nickelmann.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Nixes and rivers are said to demand or take annual victims, including on Midsummer
    or St John’s time; the Neckar is said to raise a hand from floodwater to carry
    off a victim, and the drowned person later floats up with a blue ring around the
    neck.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: In buying an animal for sacrifice, the passage says the buyer must not haggle;
    a fish called aper must be bought at any price.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Ahto is said to seize Wainamoinen’s harp when it falls into the water, in
    a comparison with playing by a waterfall.
  category: action
  evidence_refs:
  - ev:7
