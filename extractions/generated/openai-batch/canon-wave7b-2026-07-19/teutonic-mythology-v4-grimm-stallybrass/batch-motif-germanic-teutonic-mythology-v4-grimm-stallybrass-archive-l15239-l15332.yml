canonical_text:
  quote: ''
  summary: The passage gathers names and variants for the Wild Host or Wild Hunt,
    especially the Wild Hunter/Hackelberg figure. It notes hounds, huntsmen, horses,
    aerial riding, headlessness, boar or sow wounds, eternal hunting, storm-making,
    a mill moved into the Milky Way, a hump caused and cured by an axe blow under
    a tree, female beings pursued by the hunter, and houses exposed when front and
    back doors align.
  language: English with German and other European terms cited
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists multiple regional names for the Wild Host or wild hunt,
    including forms translated or glossed as a furious or wild host, wild ride, wild
    hunt, Wodes or Wudes host, and related local names.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some terms for the host are connected in the passage with raging and with
    Wotan/Wuotan-related wording.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The devil is described as being called a hunter, while the Wild Hunter is
    also called a hell-hunter in one regional note.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A quoted dramatic description of the Wild Hunter’s passage includes barking
    hounds, cracking whips, huntsmen, and hunting cries.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Hackelberg or Hachelberg material includes a sow or boar that wounds a
    hunter or master of the hunt; one version has a one-eyed wild sow whose head on
    a dish gives a mortal wound.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that Hachelberg must hunt forever, and also cites versions
    in which someone hunts until Judgment-day.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: In a Westphalian folktale, giants call Hakelberg for help; he raises a storm
    and removes a mill into the Milky Way, after which it is called the Mill-way.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Wild Hunter is said to ride through the air on a white horse.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage notes tales in which a boot, shoes, or a shoe are filled with
    gold or money.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Dame Gauden’s carriage and dog are mentioned and compared in the passage to
    a Netherlandish tale of a hound by a hell-car.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: A man standing under a tree in a wood through which the Wild Hunter rode is
    struck in the back with an axe by one of the passing party and gains a hump; after
    a year he returns, the same person removes the axe, and the hump is gone.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Several regional notes describe the Wild Hunter as headless; one note says
    he walks headless in the wood between eleven and twelve at noon, and another says
    he stops to feed horses and hounds.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Wild Hunter is said in Tyrol and other notes to chase or bait female beings
    such as the Salg-fräulein and loh-jungfer; a parallel note says giant Fasolt hunts
    a little wild woman.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Houses whose front and back doors stand exactly opposite each other are said
    to be exposed to the passage of the Furious Host.
  category: setting
  evidence_refs:
  - ev:11
