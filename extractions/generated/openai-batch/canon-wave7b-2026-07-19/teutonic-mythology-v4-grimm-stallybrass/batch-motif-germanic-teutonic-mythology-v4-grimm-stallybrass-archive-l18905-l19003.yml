canonical_text:
  quote: ''
  summary: A catalogue-like note on sicknesses and cures names ailments, cites noonday
    demons or ghosts, and records remedies or tests using healing drinks, music, breath,
    measuring, a jewelled chain, cherry twigs in water, water for fainting, fire,
    hollow stones, split trees, coins, nails, and tree-nailing for toothache.
  language: English with cited Germanic, Latin, French, and other terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists several ailments or disease names, including an ailment
    making one leg shorter, a bleeding boil, smallpox or pocks, and a noonday daemon/devil
    reference.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A noonday destructive being is rendered in cited sources as a midday devil
    or demon; the passage adds that at noon gods sleep, ghosts range freely, and Pan
    should not be disturbed during his noonday nap.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage names healing drinks and magic drinks, including a strengthening
    drink, a drink of might, and love-drink terms.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage records cures in which a sick man is fiddled back to health, a
    wound is blown upon, and a blind king is cured by washing in the water of a chaste
    wife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage mentions measuring people as a remedy or diagnostic act and states
    that carrying a jewelled chain is a remedy.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: To determine whether a person is troubled by the white folk, three cherry
    twigs are cut into eighty-one pieces, placed in water, and interpreted by whether
    pieces float or sink.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Water is poured on someone who has fainted, wet grass is laid on those who
    swoon, and striking or puffing fire is said to help a burn in the foot, erysipelas,
    and sore eyes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage mentions creeping through hollow stones and says hollow round
    stones are fairy cups and dishes; it also lists pierced stones under several names.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: A ruptured child is pulled through a split oak before sunrise by godfathers,
    after which the tree is tied up; similar split-tree or ash practices are noted
    for children, hair, and a horse cured with a silver penny placed in a split tree.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: For toothache, the passage describes silently entering a wood on Thursday
    morning, picking the teeth with a nail, and driving the nail into a tree; it also
    notes nail-studded trees.
  category: sequence
  evidence_refs:
  - ev:10
