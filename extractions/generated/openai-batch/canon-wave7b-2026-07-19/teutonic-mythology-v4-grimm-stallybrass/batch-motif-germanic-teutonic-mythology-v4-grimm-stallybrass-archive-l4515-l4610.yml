canonical_text:
  quote: ''
  summary: This passage collects comparative notes on Isis, Lithuanian Krumine, Holda/Holle,
    Huldra/Huldr, and Ferahta/Berchta. It records agriculture and bread instruction,
    a daughter-search by Krumine, omens of fruitfulness, regional names and traits
    of Holda, weather and birth sayings, Holle as leader of elves and holdes, mountain/cave
    appearances, dangerous sight, whirlwind and hunter pursuit, shapeshifting crone
    forms, spinning threats, Huldra attributes, and Ferahta's lunar associations and
    Wild Hunt participation.
  language: English with Latin and German excerpts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Latin excerpt says Isis went into Italy and taught grain-related arts, milling,
    and baking, when people had previously eaten acorns.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same excerpt associates first breads with Viterbi/Vetulonia and says Jasius
    offered first breads to Isis at nuptials.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lithuanian Krumine is said to wander over the world to find her daughter and
    to teach agriculture to men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A fruitful year is said to follow if there is a rustling in the air during
    the twelves.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage lists many regional names or variants for Holda/Holle, including
    Frau Wolle, Rolle, Frau Holl, Frau Holle, Frau Helle, and Frau Holt.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: When fog rests on the mountain, one saying states that Dame H. has lit her
    fire in the hill.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Snow is explained in several sayings as angels making a bed, heaven's feathers
    flying, or Dame H. shaking up her bed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nurses are said to fetch babies out of Frau Holle's pond.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says she washes her veil.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Holda is described as queen or leader of elves and holdes, like Berthe.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Near the Meisner, Dame H. is said to have carried off a rock on her thumb,
    and a cave there is called Kifz-Kammer.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: On the Fra Hallenstein, Fra Hulle may be seen combing her locks; whoever sees
    her loses eyesight or reason.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Dame Holle is said to ride in her coach, make a whirlwind, and pursue the
    hunter.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Haule-mutter in the Harz is described as an old crone who can make herself
    great or little; another note describes her as a humpbacked little woman walking
    with a crutch.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: Queen Holle appears as housekeeper and henchwoman to Frederick Barbarossa
    in Kyffhäuser.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: In Upper Hesse, an expression involving Holle refers to tumbled hair or a
    tangled distaff, and the Holle at Wartburg is said to look like a witch.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:17
  text: Careless spinners are threatened that Holle will be in the distaff to tangle
    it if their spinning is not finished by Sunday.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: The Huldra is said to be clothed in green, and the hulder is said to have
    a cow's tail; the passage also notes many huldren appearing singly.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:19
  text: The passage says Ferahta, whose name means the bright one, answers to lunar
    figures and takes part in the Wild Hunt accompanied by hounds, like Hecate.
  category: relationship
  evidence_refs:
  - ev:11
