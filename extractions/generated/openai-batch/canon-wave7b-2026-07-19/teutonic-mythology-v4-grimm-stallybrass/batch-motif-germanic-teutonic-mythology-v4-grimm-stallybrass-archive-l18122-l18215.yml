canonical_text:
  quote: ''
  summary: 'The passage compiles examples of superstitious omens and rites: unlucky
    bodily or temporal beginnings, divination by ears of corn, luck-bearing found
    or inherited objects, auspicious and inauspicious days, beliefs about wolf-bitten
    meat, animal and bird guides that designate routes or building sites, and immurement
    or walling-up rites involving children, barley, water, and bread to secure dikes,
    weather, or building work.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A catching foot or wrong-footed departure is treated as ill-omened, and getting
    up too early or wrongly in the morning is described as fatal in cited examples.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several ears on one stalk are said to signify peace; a stalk with fifteen
    ears and a Lettish term for a double ear are also noted.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Good or ill hap is foretold by tying together two ears of standing corn and
    watching which one shoots up higher.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Found, inherited, begged, or worn things are described as especially operative
    for good or harm; examples include four-leaved clover, a whole grain in a loaf,
    rings from gibbet irons, and fingers of an unborn babe.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage lists observed or avoided days, including black or unclean days,
    inauspicious days, Henry IV’s association with Tuesday, Napoleon’s avoidance of
    Fridays, and reluctance to begin business on Monday.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Cattle killed or bitten by wolves are described as wholesome food, and wolf-eaten
    mutton is said in a cited discussion to be sweeter.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Various animals are listed as guides or indicators for peoples, routes, settlements,
    churches, castles, convents, or other sites, including wolves, peckers, bulls,
    sows, cows, a heifer, a hart or stag, a horse, mules, and a hare.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Birds are listed as indicators or guides, including ravens, doves, a bird
    seen in a vision, larks, a clucking hen, a heathcock, and a goose.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: A child is said to be buried alive in a sea-threatened dike, and fair weather
    is said to be obtained by walling up a peck of barley and a bowl of water.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: In a Königsberg story, a young child is placed in a hollow stone with bread-and-butter
    in each hand and walled in; by morning the child is gone and wall-building proceeds
    unhindered.
  category: sequence
  evidence_refs:
  - ev:9
