canonical_text:
  quote: ''
  summary: 'Comparative notes on fire: fire produced by friction with male and female
    sticks; perpetual sacred fires in Israelite, Persian, Greek, Samogitian, colonial,
    and Marian contexts; Beltane, Samhain, Midsummer, Easter, and Walburg seasonal
    fire customs; paired Druidic fires through which herds pass; horse heads cast
    into seasonal fires; and solstice terminology leading into midsummer gatherings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes old-fashioned fire-rubbing sticks named by Arabs as
    an upper male stick and a lower female stick with a hole, and also notes Finnish
    terms for fire elicited by forcefully rubbing two pieces of wood.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists perpetual or undying fires kept by Israelites, Parsees and
    Guebers, ancient Persians, Greek temples and oracles, and in relation to Hestia
    or Vesta.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says priests at Delphi conveyed a sacred flame to Plataea in wartime,
    and that colonies took sacred fire from the mother-city and could relight it only
    there if it went out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage adds that Samogitians nourished a perpetual fire and notes an
    eternal lamp in the worship of Mary.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The passage reports three annual healtines or fire times: May 1, Midsummer
    eve, and November 1, with the first of May and November called Beltan in the cited
    sources.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage mentions May fire names, an Armorican folk-song with eight fires,
    a father-fire lighted in May, and a cited placement of the chief fire on Midsummer
    Day.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that the Druidic November fire was called tlachdgha or
    tine tlachdgha, and quotes a description in which druids made two shining fires
    with incantations and drove herds through them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that horses' heads were thrown into the May-fire in Ireland
    and compares this with the Midsummer fire in Germany.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage describes an Easter custom in Lower Bavaria in which, after church
    service, a man lit a candle, ran into the fields, and set a straw Easter-man on
    fire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage notes that a Paderborn edict of 1781 abolished the Easter fire.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage connects Easter fires with Walburg or Mayday fires, including
    a Rügen Mayday-eve practice with fire-bladders and a Hundsrück custom allowing
    young men and boys to cut wood on St. Walburg's eve.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage lists Greek, Bavarian, Alemannic, Anglo-Saxon, and Middle High
    German terms for the solstice and states that Midsummer was a great time for meetings
    and merrymakings.
  category: setting
  evidence_refs:
  - ev:8
