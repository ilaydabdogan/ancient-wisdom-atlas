canonical_text:
  quote: ''
  summary: 'The passage compiles comparative notes on giant lore: punished churchyard
    dancers, names and classifications of giant or wild-man figures, a Finnish giant
    hurling a stone at a church, man-eating cyclops tales, shape- and size-changing
    giants, heroic trophies taken from giants, giants carrying heroes or wielding
    poles and trees, giant names, and the opening philological notes for a chapter
    on creation and chaos.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group dancing in a churchyard is doomed by a priest to dance for a whole
    year, sinks up to the hips in the ground, and is then absolved by his Grace of
    Cologne; the place is associated in some manuscripts with Colovize and compared
    with men of Golbeke.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists names or classifications connected with giant or wild-man
    lore, including Strong Jack as der starke Hannel, Finnish Hiisi as a wild man
    or giant, Lapp Wadda or Eiita as a malign deity, and an Estonian Kalewepoeg tale
    reference.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: In a Finnish giant story, Kalevanpoika hurls a huge stone at the first church
    after receiving a misleading answer from a man carrying worn shoes; the stone
    misses and falls into the sea near Abo.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage groups several tales around man-eating giant or cyclops figures,
    including Brusi as a man-eating troll, Sinbad punching out a man-eating giant's
    eye, an Oghuzian cyclops taking an arrow for a gnat, and robbers entering a turs's
    dwelling where eleven are eaten.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:5
  text: A giant is said to grow bigger while rising out of the ground and smaller
    while sinking back into it.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:6
  text: Giants are described as taking eagle shape, with named examples, and as being
    born as wolves; a flying giantess is also mentioned.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Court-poet and heroic material preserves giant-lore features including Tristan
    taking a giant's hand, Beowulf bringing away Grendel's hand, an old giant-father
    carrying heroes up a hill, and giants carrying long poles or a tree.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:8
  text: The passage lists giant couples and giant names, including names compared
    linguistically with Romance and other forms, and notes a stated connection between
    giants and gods.
  category: other
  evidence_refs:
  - ev:9
- id: obs:9
  text: The beginning of the Creation chapter discusses words and meanings connected
    with chaos, cutting or cloven matter, creating, shaping, and terms such as Old
    English frumsceaft and Gothic gashifts.
  category: other
  evidence_refs:
  - ev:10
  - ev:11
