  text: If a girl and boy eat from the same morsel, they are said to become fond of
    each other.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: On Midsummer night, nine kinds of flowers are placed under the head so that
    the sleeper dreams of and sees the betrothed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A young man is warned not to give a girl a knife or pins because these are
    said to put love asunder.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A girl is warned not to look in a mirror after dark or by candlelight lest
    she lose men's good opinion.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Several bridal actions are prescribed so the bride gains mastery: seeing
    the groom first, putting her foot before his, sitting first in the bridal chair,
    and dropping an item so the groom stoops for it.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The bride is told to stand near the bridegroom so that no one may later come
    between them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The couple hold a band or cloth between them in church so that they may dwell
    together in unity.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Both bride and groom should have coins in their shoes so that money will not
    run short.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the wedding, the one who turns from the other, and also the one who looks
    best, is said to die first.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The bride touches her bare body with as many fingers as the number of children
    she wishes to have.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: For an easy childbed, the bride is instructed to undo the saddle-girth or
    traces leftwards when returning from church.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The bride's mother-in-law meets her with a glass of milk to drink so that
    the bride will become a good milker or milk-giver.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: For her first childbed, the bride is to keep a cake and cheese lying with
    her in the bridal bed.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: A book is laid under the head of newly born children so that they may become
    quick at reading.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: Coins are put into a child's first bath water, and a purse with money is sewn
    around the child's neck, so that the child may become rich.
  category: object
  evidence_refs:
  - ev:9
- id: obs:17
  text: Something from the father's clothing is spread over girl-babies and the mother's
    skirt over boys so they may find favour with the other sex.
  category: object
  evidence_refs:
  - ev:10
- id: obs:18
  text: The mother waits for the child at the door when it is taken for christening;
