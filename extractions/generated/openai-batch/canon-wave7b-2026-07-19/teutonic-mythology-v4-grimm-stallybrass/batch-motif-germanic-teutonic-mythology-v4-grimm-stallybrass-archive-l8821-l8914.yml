literal_observations:
- id: obs:1
  text: Brooks, wells, and springs are described as emerging from body parts, an ass's
    jawbone, a saint's cross or prayer, the place where a maiden fell, a giantess,
    tears, and the sweat of a sleeping giant.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: River and spring sources are associated with personified beings, including
    Tiberinus, Rhenus, a nymph with a marble bowl, the baby Wiese in a hidden rock
    chamber, and a spinning maiden at Stabburags well and grotto.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Vestals are said to have washed using water drawn from living springs
    and rivers at the restoration of the Capitol.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Springs charmed from the ground by saints are said to have healing power,
    and medicinal springs are sought with rushes from which a spark flies.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: At holy seasons water is said to turn into wine, and wells or springs associated
    with saints can yield wine.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A healing well loses its power after an ungodly man bathes his horse in it
    or after a noble lady washes her blind dog in it, while fountains become holy
    when goddesses such as Sita bathe in them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Anyone who has drunk from the well of Reveillou in Normandy is said to have
    to return to that country.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Holy water must be drawn in vessels that hang or are carried, cannot stand,
    and must not touch the ground; related examples include vessels in the worship
    of Ceres and Vesta, the Scots Well of Airth, Wendish metal vessels, and a Lettish
    sacrificial goblet touched only with the teeth.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Named holy springs and waters include Heilbronn-type names, Helge Thor's spring
    in Smaland for curing blindness, Mary as a healing brook, and the pool of Bethesda,
    where the first entrant after an angel troubled the water was healed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Youth-restoring fountains are drunk from in May before sunrise, appear in
    several cited poems, and include a fountain where an eagle renews its youth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Seasonal water customs include picking flowers on the Guadalquivir on Midsummer
    morning and Warsaw girls throwing rose wreaths into the Vistula on June 24, watching
    how they float downstream.
  category: action
  evidence_refs:
  - ev:7
