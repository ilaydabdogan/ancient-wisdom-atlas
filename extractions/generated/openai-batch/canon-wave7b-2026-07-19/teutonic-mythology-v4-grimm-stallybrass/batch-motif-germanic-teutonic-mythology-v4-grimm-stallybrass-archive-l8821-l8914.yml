  summary: 'The passage compiles comparative examples concerning water: miraculous
    origins of springs and rivers, water-source spirits, holy and healing springs,
    water becoming wine, defilement or sanctification of wells through contact, ritual
    vessels for holy water, named holy springs, youth-restoring fountains, and seasonal
    water customs involving flowers and wreaths.'
