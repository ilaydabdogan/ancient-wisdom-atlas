canonical_text:
  quote: ''
  summary: 'A comparative catalogue of serpent traditions: sacred and household snakes,
    serpents associated with deities and prophetic knowledge, milk-drinking and familiar
    snakes, serpent kings, jewel-bearing serpents near water, serpent healing and
    poison, serpent-derived magical substances, and a brief note on the toad as a
    venomous magical animal.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says a serpent lived in the Parthenon at Athens, was sacred to
    the goddess, and received a daily honey-cake; it also says the Roman anguis was
    holy and notes snake figures on objects such as a caduceus, tomb markers, and
    a helmet.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage associates serpent names or forms with divine figures: Ofnir
    and Svafnir are both snake names and by-names of Óðinn; Hermes is described as
    closely allied to the agathodaemon; descendants of Óðinn are said to inherit a
    ''snake in the eye''.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Serpents lick the ears of the sleeping Melampus, after which he understands
    birds and beasts; Cassandra and Helenus are also said to have their ears licked
    clean by snakes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage describes Greek, Albanian, and Samogitian house-serpents as home-snakes,
    homesprites, or household gods that are fed or worshipped.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage groups several accounts of snakes drinking or sucking milk, being
    given drink, entering a pregnant woman, encircling a child, or encircling a sleeper's
    head without harm.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage lists tales of a snake crown, a king of snakes, Sanskrit Vāsuki
    as king of serpents, Swedish snakes electing a king, and a serpent-king with twelve
    heads whose severed heads bring victory to the bearer.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage notes snakes carrying stones or bearing stones on the head, including
    a snake under a hazel with mistletoe and a precious stone on its head.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The vouivre is described as having one eye in the middle of her forehead,
    the eye being a carbuncle; she lays it aside when drinking at a fountain, and
    one can take the jewel, leaving her blind.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'The passage associates serpents and worms with water: the vouivre drinks
    at a fountain, a worm goes to water, Fafnir moves to water, and snakes are said
    to lie beside springs.'
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'The passage attributes healing and dangerous powers to serpents: the brass
    serpent heals snakebite, serpent slaver enters healing dishes, eating the white
    snake grants knowledge of animal language, and venom drips from the eitr-orm.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage mentions a Celtic anguinium made of serpent drivel, magic performed
