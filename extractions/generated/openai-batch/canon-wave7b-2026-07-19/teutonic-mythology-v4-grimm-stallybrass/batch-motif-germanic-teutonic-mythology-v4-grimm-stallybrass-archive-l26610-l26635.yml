canonical_text:
  quote: ''
  summary: 'A sequence of German folk superstitions from Worms and its neighbourhood
    describes: a cabbage-root procedure for a girl to test whether a desired marriage
    will occur; an omen about goods bought by forced cheap sale not lasting; a flax-sowing
    action meant to increase flax height; several signs of strife; left and right
    ear-singing as signs of evil or good speech; and a prohibition on giving fire,
    salt, or bread from a house where a woman lies in.'
  language: English
  quote_policy: summarized
