canonical_text:
  quote: ''
  summary: A French list of superstitions, numbered 20-35, describing marriage rites
    and divination, healing children, animal omens, notifying bees of a death, St.
    John's Eve fires and waters, a Christmas hearth log, and salt protections.
  language: French
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After leaving church, a bride is led before an image of the Virgin with a
    hemp-dressed distaff, spins a small amount, takes it home, and later returns the
    distaff with thread and new hemp.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A male child who has not known his father is said to be able to melt lumps
    by touching them on three successive mornings while fasting and reciting prayers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fifth consecutive male child is said to heal spleen ailments by repeated
    simple touch.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A household hen that crows like a cock is killed or sold from fear that it
    will bring misfortune on the house.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Meeting an odd number of magpies during travel is treated as a sign of misfortune.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: On the first day of March at midnight, a person seeking to know a future spouse
    walks three steps from bed, speaks to March, returns backward to bed, sleeps,
    and expects a dream-image of the future spouse.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Bee owners announce a death in the house to each hive and attach a small black
    cloth to it; without this, the bees are expected to perish soon.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: On St. John's Eve, a bonfire is lit at a crossroads around a tall pole decorated
    with leaves and flowers; clergy light it and sing, then participants jump over
    it and carry embers home.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The embers from the St. John's Eve fire are placed on the canopy of the bed
    as a protection against lightning.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: On Christmas Eve before midnight mass, the largest suitable log is placed
    in the fireplace of the most inhabited room and is expected to last three days.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: On the first of May before dawn, a young girl performs a solitary fountain
    ritual with a rosemary-cleaned bucket, prayer, sunrise timing, left-hand stirring,
    and a ninefold formula to see the face of her future husband in the water.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: On St. John's Eve, a young man circles the fire three times, takes a burning
    brand, lets it go out in his left hand, and places it under his pillow in a worn
    shirt to learn the hair color of his future wife.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: It is customary to marry while fasting, and failure to do so without strong
    reason is believed to lead to mute children.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:14
  text: Spouses place salt in the left pocket before going to church on their wedding
    day to prevent the 'noeud de l'aiguillette.'
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: St. John's night dew, the first bucket drawn from a well at midnight, and
    a specific fountain near Nogent-le-Rotrou are described as curative.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:16
  text: The St. John's fire is said not to burn, and burning brands from it can be
    taken in the hand.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:17
  text: To defend against sorcerer shepherds, one puts salt in the pocket and quietly
    speaks a formula while passing the shepherd.
  category: action
  evidence_refs:
  - ev:14
