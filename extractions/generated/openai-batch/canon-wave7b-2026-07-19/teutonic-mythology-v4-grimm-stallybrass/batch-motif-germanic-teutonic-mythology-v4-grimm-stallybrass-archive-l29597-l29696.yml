- id: ev:5
  type: summary
  locator: item 25, within lines 29597-29696
  quote_or_summary: At midnight on the first day of March, a person walks three steps
    from bed, addresses March to show the future spouse in sleep, returns backward
    to bed, and expects the person appearing in the dream to be the future spouse.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:6
  type: summary
  locator: item 26, within lines 29597-29696
  quote_or_summary: Bee owners announce a household death to each hive and attach
    a small black cloth; otherwise the bees are expected to perish soon.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:7
  type: summary
  locator: item 27, within lines 29597-29696
  quote_or_summary: On St. John's Eve a bonfire is lit at a crossroads around a tall
    leafy and flowered pole; clergy light it and sing, then attendees leap over it
    and bring home embers to place over the bed as protection from lightning.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:8
  type: summary
  locator: item 28, within lines 29597-29696
  quote_or_summary: On Christmas Eve before midnight mass, the largest log that can
    be found is placed in the main fireplace, intended to last three days, and is
    associated with the name meaning three fires.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:9
  type: summary
  locator: item 29, within lines 29597-29696
  quote_or_summary: A young girl seeking her future husband rises before dawn on May
    first, cleans a bucket with rosemary, goes unseen to a solitary fountain, prays,
    draws water, waits for sunrise, stirs the water with her left hand, repeats a
    formula nine times, and sees the future husband's face if no one has seen her.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:10
  type: summary
  locator: item 30, within lines 29597-29696
  quote_or_summary: A young man seeking the hair color of his future wife circles
    the St. John's Eve fire three times, takes a burning brand, lets it go out in
    his left hand, puts it under his pillow wrapped in a shirt worn three days, and
    next morning finds hair of the future wife's color.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:11
  type: summary
  locator: items 31-32, within lines 29597-29696
  quote_or_summary: Marriage while fasting is customary, with failure believed to
    lead to mute children; spouses carry salt in the left pocket before church on
    the wedding day to prevent the 'noeud de l'aiguillette.'
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:12
  type: summary
  locator: item 33, within lines 29597-29696
  quote_or_summary: St. John's night dew cures scabies, the first bucket drawn from
    a well at midnight cures fever, and a fountain near Nogent-le-Rotrou is curative
    throughout St. John's Eve night while men and women bathe there.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:13
  type: summary
  locator: item 34, within lines 29597-29696
  quote_or_summary: The St. John's fire is said not to burn, and its burning brands
    can be held in the hand.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:14
  type: summary
  locator: item 35, within lines 29597-29696
  quote_or_summary: To defend against sorcerer shepherds, a person puts salt in the
    pocket and, while passing the shepherd, quietly says that the sorcerer shepherd
    is neither feared nor dreaded.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
