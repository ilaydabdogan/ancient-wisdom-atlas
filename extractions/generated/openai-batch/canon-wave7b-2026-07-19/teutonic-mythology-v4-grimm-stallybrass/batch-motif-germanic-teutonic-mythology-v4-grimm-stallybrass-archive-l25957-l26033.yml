  quote: ''
  summary: A numbered appendix list of Germanic-related superstitions records household,
    funeral, calendrical, agricultural, weather, birth, marriage, theft, and health
    omens or charms. The entries state conditional signs and expected results, such
    as illness, death, quarrelling, wealth, pestilence, easy labour, protection from
    lightning or thunder, and winter forecasting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Walking with only one shoe or stocking on is said to cause a cold in the head.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Popping fire in the oven is said to mean quarrelling will occur in the house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The length of time meat fizzes or simmers on the table is linked to how long
    the cook will be beaten by her husband.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person whose women run away and whose horses stay is said to become rich.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A candle going out by itself is said to mean someone in the house will die.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Smelling flowers or wreaths at a funeral is said to cause loss of smell.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A rosemary stalk put in a dead man's grave is said to make the whole plant
    wither when the buried branch rots.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Eggshells are to be crushed after eating eggs because witches are said to
    nestle in them; failure to do so may bring fever to someone.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Carrying a moleskin purse containing a hoopoe's head and a penny piece is
    said to keep the bearer from being without money.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Wind on New Year's night is said to be a sign of pestilence.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: If a soup spoon falls with its inner side up, the eater is said not to have
    eaten enough and must continue until the spoon turns outer side up.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Cutting one more slice of bread than there are people at table is said to
    mean a hungry guest is on the road.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Wearing something sewn with thread spun on Christmas Eve is said to prevent
    vermin from sticking to the wearer.
  category: object
  evidence_refs:
  - ev:13
- id: obs:14
  text: Pointing with fingers at the moon or stars is forbidden because it is said
    to hurt the eyes of angels.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: Keeping a cross-hill in the house is said to prevent lightning from striking.
  category: object
  evidence_refs:
  - ev:15
- id: obs:16
  text: In brewing, placing great stinging-nettles on the vat is said to prevent thunder
    from spoiling the beer; the note says thunder-nettle resists thunder.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: An overdue pregnant woman who lets a horse eat from her apron is said to have
    an easy labour.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:18
  text: When a wedding pair join hands before the altar, the one with the coldest
    hand is said to die first.
  category: sequence
  evidence_refs:
  - ev:18
- id: obs:19
  text: Someone who steals on Christmas, New-year, and Twelfthday-eve without being
    caught is said to be able to steal safely for a year.
  category: sequence
  evidence_refs:
  - ev:19
- id: obs:20
  text: Cutting finger and toe nails on Friday is said to be good for toothache.
  category: action
  evidence_refs:
  - ev:20
- id: obs:21
  text: At Martinmas, the white or brown appearance of a goose's breastbone is used
    to tell whether winter will be cold.
  category: sequence
  evidence_refs:
  - ev:21
- id: obs:22
  text: Farmers are told to baptize or souse their maids with water when the maids
    bring the first grass of the year, so that the maids will not sleep at grass-cutting.
  category: action
  evidence_refs:
  - ev:22
- id: obs:23
  text: A tempest blowing is said, as a rule, to mean that someone has hanged himself.
  category: sequence
  evidence_refs:
  - ev:23
