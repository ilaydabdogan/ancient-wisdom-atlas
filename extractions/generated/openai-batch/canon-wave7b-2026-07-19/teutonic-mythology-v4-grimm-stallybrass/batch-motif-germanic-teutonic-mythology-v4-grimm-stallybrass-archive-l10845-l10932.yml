canonical_text:
  quote: ''
  summary: The passage surveys comparative notes on bees, other insects, spiders,
    and the sky. It reports traditions that bees and other insects arise from decaying
    animal bodies; describes bees as weaving, sewing, building, and enclosing the
    Host with combs; lists titles for a bee ruler and Samogitian bee deities; contrasts
    bees with spiders; notes insect-form appearances by the devil, Loki, and an enchantress;
    and then discusses Germanic terms and images for heaven or sky as a cover, roof,
    vault, hat, or blue region.
  language: English
