canonical_text:
  quote: ''
  summary: A list of German folk superstitions records omens, taboos, charms, and
    ritual prescriptions involving death, news, cows and milk, pregnancy and childbirth,
    weddings, sickness, supernatural beings, plants, water, iron, inherited objects,
    animal signs, the moon, and weather.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The list states that a spoon-eater keeps the mouth open in death and that
    spitting on oneself means one will hear news.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When cows growl at night, the Jiidel is said to be playing with them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Putting shoes wrong-wise at the head of the bed is said to keep the alp from
    pressing the sleeper that night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Actions by pregnant or confined women are linked to predicted outcomes for
    their children, including whiteness, bad teeth, hanging, chapped hands, or the
    same death as a criminal.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Several wedding signs concern the bride or wedding pair, including an old
    blue apron, broken glasses, the first bidding of banns, dinner dishes, seating,
    graves, the bridal bed, washing, bread, moon phase, and rain.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:12
  - ev:13
  - ev:15
- id: obs:6
  text: Ground-ivy wreaths are prescribed for first spring milking and for recognizing
    witches on Walburgis-day.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Cows that have calved are led over threefold iron in Thuringia.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Mixing the milk of two men's cows, or giving thanks for milk received, is
    said to make a cow or cows dry up.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The number of times a cock crows on Christmas-eve is linked to the price of
    corn for the year.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: On Ash-Wednesday the devil is said to hunt the little woodwife in the wood.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: If the Jiidel has burnt a child, bacon-rind is smeared on the oven's mouth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Devil's bit thrown under the table is said to make guests quarrel and fight.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Headache, lockjaw, and goitre or warts are addressed through mill-wheel water,
    inherited objects, or a waxing-moon verbal formula.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
  - ev:14
- id: obs:14
  text: A cock built into a wall is said to bring a long spell of good weather, and
    water is said not to abide a corpse.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: A vinegar dealer is told not to lend vinegar, and a good crop is sought by
    silently fetching mould from three inherited fields and mixing it with seed.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: A key beside a baby is said to prevent the baby from being changed.
  category: object
  evidence_refs:
  - ev:9
- id: obs:17
  text: At prayer for the sick and after the sacrament, silence, noise, food requests,
    or drink requests are treated as signs of death or recovery.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:18
  text: Dogs howling, crows cawing round the house, and the church clock striking
    during the death-bell are treated as signs of fire or death.
  category: relationship
  evidence_refs:
  - ev:14
