canonical_text:
  quote: ''
  summary: The passage is a comparative note on the devil and related names or roles.
    It contrasts Indic and Persian valuations of divine and demonic terms; reports
    traditions in which Ahriman/the devil is represented as God’s first-born son or
    as an originally good being who rebelled; lists falls from heaven or Olympus;
    describes the devil as imitating God’s creation, chapel, and disciples; and catalogs
    names and epithets for the devil across several languages and texts.
  language: English
  quote_policy: summarized
