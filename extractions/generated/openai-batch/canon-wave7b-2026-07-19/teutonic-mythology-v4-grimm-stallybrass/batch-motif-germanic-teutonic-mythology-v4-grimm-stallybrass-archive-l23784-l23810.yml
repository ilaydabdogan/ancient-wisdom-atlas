canonical_text:
  quote: ''
  summary: A numbered list of superstitions gives prescriptions involving a thread
    spun by a woman who has borne twins for swollen knees, a head-knot procedure for
    making chicks tufted, a solstice rite at a neighbour's gate involving backward
    naked movement, three chips, and spoken formulas about milk, and a fragmentary
    prescription in which pregnant women measure a wick by St Sixtus's image. A footnote
    states that souls come out of Purgatory every Saturday.
  language: Early New High German with English editorial glosses and notes
  quote_policy: summarized
