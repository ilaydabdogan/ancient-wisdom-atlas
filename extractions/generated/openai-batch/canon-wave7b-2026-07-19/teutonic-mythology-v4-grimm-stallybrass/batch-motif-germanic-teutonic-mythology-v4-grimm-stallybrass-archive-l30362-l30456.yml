  quote: ''
  summary: A Middle High German Christian protective spell or blessing associated
    with Tobias/Tobit and a journey. A father or sender dispatches his beloved son
    far into foreign lands and prays for God to guard him over field, wood, road,
    and bridge; to protect him from hunger, cold, enemies, evil, and weapons; to send
    angelic guardians; to bar hell and open paradise; and to bring him home healthy.
  language: Middle High German with English editorial glosses
  quote_policy: summarized
