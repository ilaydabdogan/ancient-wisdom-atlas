canonical_text:
  quote: ''
  summary: 'The passage collects comparative notes on heroic attributes: extraordinary
    strength and appetite; shining, godlike, snake-like, or fiery eyes; bodily marks
    such as crosses, chains, leaf marks, and hard skin; heroes conversing with horses
    and swords; dying heroes attempting to destroy swords; and gods, devils, heroes,
    or horses leaving marks in stone.'
  language: English
  quote_policy: summarized
