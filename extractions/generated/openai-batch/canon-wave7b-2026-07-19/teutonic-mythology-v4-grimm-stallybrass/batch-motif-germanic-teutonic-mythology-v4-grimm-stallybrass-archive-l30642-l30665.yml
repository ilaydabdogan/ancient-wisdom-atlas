- id: obs:2
  text: The practitioner is told to take blood from a bat and, at night, go secretly
    to a house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The practitioner is instructed to write on a house-door, including the names
    or words “omnii,” “geapha,” and “diado.”
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After leaving for a while and returning, the practitioner finds a horse ready
    with saddle, bridle, and other gear.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Before sitting on the horse, the practitioner is told to put the right foot
    into the left stirrup.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The spoken conjuration addresses the horse and invokes the Father, Son, Holy
