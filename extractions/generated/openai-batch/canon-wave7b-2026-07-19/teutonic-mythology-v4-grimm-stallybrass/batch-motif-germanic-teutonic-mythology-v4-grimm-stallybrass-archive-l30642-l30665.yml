canonical_text:
  quote: ''
  summary: 'A spell instructs the practitioner how to make or summon a horse that
    will carry the rider wherever desired: use bat blood at night, write names on
    a house-door, return to find a saddled and bridled horse, mount with a specified
    gesture, recite a Christian conjuration for protection, ride without fear, and
    preserve the bridle as the means of recalling the horse. An editorial note compares
    the importance of bit and bridle in magic horses to King Beder in the Arabian
    Nights.'
  language: Early New High German with English glosses and editorial commentary
  quote_policy: summarized
