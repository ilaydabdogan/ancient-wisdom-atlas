  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The conjuration asks that the horse not harm the practitioner’s body, soul,
    or limbs, and not cause hindrance.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The practitioner is told to sit cheerfully on the horse, not bless himself,
    and not fear.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: On reaching the desired place, the practitioner is instructed to take the
    bridle and bury it under the earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: To have the horse again, the practitioner takes the bridle and shakes it strongly,
    after which the horse comes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: For later use, the horse must be conjured again, mounted, and ridden; the
    practitioner is warned to keep the bridle carefully.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: If the bridle is lost, the practitioner must make the horse again.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: An editorial note states that bit and bridle are important in magic-horse
    material and cites King Beder in the Arabian Nights.
  category: other
  evidence_refs:
  - ev:8
