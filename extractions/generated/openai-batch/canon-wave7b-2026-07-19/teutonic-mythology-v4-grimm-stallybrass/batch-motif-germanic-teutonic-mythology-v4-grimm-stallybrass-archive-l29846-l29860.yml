canonical_text:
  quote: ''
  summary: 'The passage reports Esthonian customs and beliefs: on All Souls day families
    feast for departed members, leave food for the deceased, and the house-master
    summons and dismisses them with a lighted split brand; crop failure is attributed
    to inadequate entertainment of the souls. A separate note says that at Judgment-day
    churches will topple toward the North and that burial in the north part of the
    churchyard is dreaded.'
  language: English
  quote_policy: summarized
