  summary: 'The passage is a comparative note on divine conditions and powers: anger
    and vengeance, punishment of misdeeds, divine envy, Loki’s mischief in Baldr’s
    death, devilish laughter, visible radiance, carefree and painless joy among gods,
    divine laughter, voluntary visibility and invisibility, supernatural hearing and
    sight, passage through closed barriers, sudden appearance when invoked, ascent,
    swift flight, wings, bird mounts, and bird-shaped appearances.'
