  quote: ''
  summary: A sequence of brief superstitions gives rules and omens concerning sponsor
    choice for a child, reversal of luck from youth to old age, wormwood carried against
    bewitching, the luck-significance of a found needle's orientation, and eating
    bread before anything else in the morning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When choosing sponsors, the rule says to ask an unmarried woman; otherwise
    the child will be unlucky in marriage and have no children.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person lucky when young is said to beg bread when old, and the reverse is
    also said to apply.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person who carries wormwood is said to be unable to be becried or bewitched.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Finding a needle with its point toward the finder is said to bring bad luck;
    finding it with the head toward the finder is said to bring good luck.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The rule says to put nothing in the mouth in the morning until after taking
    a bite of bread.
  category: action
  evidence_refs:
  - ev:5
