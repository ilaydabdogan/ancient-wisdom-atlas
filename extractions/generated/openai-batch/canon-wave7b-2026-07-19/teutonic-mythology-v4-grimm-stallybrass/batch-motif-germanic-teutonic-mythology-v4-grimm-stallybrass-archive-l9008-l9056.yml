canonical_text:
  quote: ''
  summary: 'Notes on water-related customs, myths, and language: drought offerings
    thrown into rivers; measuring or sounding lakes; water worship, sacrifices, prayers,
    offerings, and ordeals; personified lakes, rivers, and sea; a water-altering sprite;
    a springtime god or genius throwing a warm stone into water; river-name personifications;
    holy islands; and divine or animate descriptions of sea and Ocean.'
  language: English
  quote_policy: summarized
