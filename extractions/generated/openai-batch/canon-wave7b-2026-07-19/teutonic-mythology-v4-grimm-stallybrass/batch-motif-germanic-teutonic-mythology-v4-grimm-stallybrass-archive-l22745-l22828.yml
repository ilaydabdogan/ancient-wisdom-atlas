canonical_text:
  quote: ''
  summary: 'The passage gives a Latin sermon attributed in the heading to St. Eligius,
    warning Christians against practices described as pagan or diabolical: consulting
    diviners and incanters, observing omens, choosing days or lunar phases, Kalends
    customs, festival dances and songs, invoking named non-Christian powers, making
    vows or lights at shrines, stones, fountains, trees, heavens, and crossroads,
    using ligatures and phylacteries, incanting herbs, passing livestock through a
    hollow tree or dug earth, wearing amber amulets, shouting at lunar eclipses, swearing
    by sun or moon, and trusting fate or nativity. It commends Christian signing,
    prayer, and veneration of God and saints.'
  language: Latin with English editorial heading and notes
  quote_policy: summarized
