  quote: ''
  summary: 'Comparative notes on creation and origin traditions: people or races arise
    from trees, stones, mud, ground, divine makers, fallen angels, hidden cursed children,
    or successive world ages; later notes compare flood narratives involving destruction
    of giants, subsiding waters, birds or animals sent out, ships or arks, animals
    preserved in an ark, and a rapidly growing flood fish likened to serpent traditions.'
