canonical_text:
  quote: ''
  summary: 'The passage is a comparative note on stone lore: eye-stones and gems as
    eyes, amber and pearls, diamond or crystal as frozen water or moon-radiance, stones
    or gems associated with animals, victory stones and rings, swallow-stones, thunder-stones
    with healing power, goat-blood softening diamond, and the carbuncle taken from
    a unicorn and shining in darkness.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girdle containing a precious stone is said to make whole.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists examples of stones or gems functioning as eyes or pupils,
    including stone-like hyaena pupils, Reinhart's carbuncle-like eyes, stones in
    place of eyes in the sculptured skull of St Servatius, and Germanic eye-stone
    terms for the pupil.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Amber is discussed under names including succinum, electrum, Russian, Lithuanian,
    Latvian, Estonian and Finnish forms, and Estonian/Finnish names meaning sea-stone;
    the passage also notes confusion of amber with pearl.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pearl and gem terms are listed, and diamond or crystal is described as crystallized
    or frozen water, ice-stone, and in Sanskrit tradition as a gem believed to arise
    from frozen moon-rays.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A stone is said to come from a stag's tears or eyes, a dragon's head is said
    to contain a diamond, and a toad-stone is cited under Netherlandish, Bohemian,
    and Old French names.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A serpent's egg is praised for victories in lawsuits and access to kings,
    and the passage also cites a multicolored gem and several victory-stone or victory-ring
    terms that make users victorious.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The swallow-stone is said to grow in the crop of a firstborn swallow, with
    a cited instruction to open swallows to find a red stone inside.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Mineral and thunderbolt names include thunder-stone, weather-stone, toad-stone,
    and ceraunia; the thunder-bolt is said to have healing power, and Old Norse, Finnic,
    Lithuanian, and Low German names are listed.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The diamond is said to be softened only by goat's blood.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The carbuncle is said to be taken from the unicorn's forehead or horn; it
    shines in the darkest night and puts out other stones.
  category: relationship
  evidence_refs:
  - ev:9
