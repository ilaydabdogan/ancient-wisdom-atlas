canonical_text:
  quote: ''
  summary: 'The passage gathers comparative notes on the devil in Germanic and neighboring
    folklore: pacts requiring renunciation of God, giving body, life, or soul for
    wealth and wonders, the devil fetching his own, children promised to the devil,
    names for devil-allied persons, bearskin parallels, the devil replacing older
    giants, midnight castle appearances compared with Grendel, devilish imitation
    of God in creation and building, church-building tales involving a first animal
    entrant, devil bridges, and devil-associated stones and place-names.'
  language: English
  quote_policy: summarized
