canonical_text:
  quote: ''
  summary: A preface note surveys differences between Norse and German divine systems,
    the persistence of old religion under new religion, methodological remarks on
    myth and history, and numerous proposed correspondences among Germanic, Greek,
    Roman, Celtic, Slavic, Indian, and Christian materials.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Eru, Phol, Saxnot, Beowulf, Isis, Zisa, and Sindgund
    were unknown to the North, and that Heimdall, Loki, and Hoenir have not been found
    in Germany.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that little is known of Meili beyond the name.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage assigns regional prominence to Thorr in Norway, Freyr in Sweden,
    and OSinn in Denmark, and calls Halogi, ThorgerSr, and Irpa local deities of Haloga-land.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that a new religion mixes with the old, and that the old
    faith becomes superstition rather than dying out entirely.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage criticizes historical and geographical explanations of myths and
    says the study of their inner sense is still lacking.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says deified heroes, saints, and genealogies beginning with a
    divine ancestor mark the point where myth and history touch.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage compares Wolfdietrich wearing St George's shirt with Odysseus
    wearing the scarf of Leucothea.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says Artemis and Hecate remind the author of Berhta.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage lists several Greek, Roman, and Germanic notions as closely allied
    or agreeing, including Meleager and Norna-gestr, omphalos and dille-stein, Cerberus
    and the hell-hound, kerykeion and the wishing-rod, sieve-turning, dislocation-spells,
    and lustration of highways.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says the Zeus-Jupiter figure is split in other nations into sets
    such as Wuotan, Donar, and Zio; Radegast, Rerun, and Svetovit; Brahma and Vishnu;
    or Gwydion and Taranis.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage reports Celtic influence on German mythology and says Nilsson
    derives mistil-teinn and Baldrs-brand from it.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage aligns Celtic gods Taranis, Hesus, and Teutates with Jupiter,
    Mars, and Mercury.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage gives Slavic and Teutonic lexical and deity correspondences, including
    Siva with Sif, Sitivrat with Saturn, Priya with Frowa, and Prove with Fro.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage lists proposed harmonies between Indian mythology and Germanic
    material, including a little figure floating on a leaf with Brahma and Vishnu,
    Vishnu's wheel with Krodo's, Yama the death-god and his rope with German notions,
    and Garuda's wings with wind.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: The passage notes points of contact between paganism and Christianity and
    refers to Christian elements in the Edda.
  category: relationship
  evidence_refs:
  - ev:12
