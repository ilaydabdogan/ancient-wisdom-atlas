canonical_text:
  quote: ''
  summary: 'A list of Esthonian marriage-related superstitions: marriages are timed
    to the new moon; a wooing suitor avoids riding a mare; a betrothed bride is bound
    with a red string and later breaks it; a newly married couple run from church
    hand in hand; a bride falling while being fetched is an omen of child death; and
    observers undo a horseback suitor''s saddle-girth to ease the future wife''s childbirth.'
  language: English
  quote_policy: summarized
