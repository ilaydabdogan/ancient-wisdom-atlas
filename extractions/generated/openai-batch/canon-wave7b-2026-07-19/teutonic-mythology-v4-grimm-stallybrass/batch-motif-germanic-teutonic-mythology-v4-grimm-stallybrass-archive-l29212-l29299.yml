canonical_text:
  quote: ''
  summary: A sequence of Swedish and Danish superstition entries describes omens and
    rites involving marriage, illness, memory, fire, death, haunting prevention, herbs,
    shoes, birds, service changes, theft, and a smith’s magical retaliation against
    a thief.
  language: Swedish and Danish with English glosses in an English-language edition
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girl, widow, or unmarried man is said to expect marriage that year after
    the specified omen, while old or married people fear severe sickness or accidents.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some people strike backward children three times with a rod before the mothers
    go to church or undergo churching, expecting the children to gain good memory.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says fire had been worshipped in old days and describes a Candlemas
    custom of drinking the fire’s health with two large candles, a pillow, and a wooden
    cup.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the fire’s-health rite, the cup is thrown backward over the head; if it
    tips over the thrower is expected to die that year, and if it stands upright the
    thrower is expected to live.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Before daybreak a housewife prepares a bake-oven fire, a buttered slice, and
    ale, gathers the household in a half-moon before the oven mouth, and the household
    eats and drinks with kneeling and luck-wishing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the household eats and drinks, the remaining food and drink are thrown
    into the fire in the belief that the household will be safe from fire accidents
    that year.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After a corpse is carried to the grave, the straw on which it lay is burned
    and the smoke is watched.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Smoke sinking onto the farm is taken to mean a near kinsman will soon follow
    in death, while smoke rising or moving east or west means sickness and death move
    away in the smoke’s direction.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: To prevent the dead from haunting, rye-seed is strewn on the church-way and
    grave, with the belief that Satan then has no power.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: On St John’s day girls gather herbs and place them in beams to infer the future;
    herbs for a girl and her sweetheart growing together signify marriage, while herbs
    growing upward or downward signify good signs or sickness and death for relatives.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Girls and lads throw a shoe over the head toward the door; heel toward the
    door means staying, while toe toward the door means leaving or changing place.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Seeing the first cuckoo of the year while fasting is treated as being fooled
    by the cuckoo, with different consequences for men, girls, and old people.
  category: other
  evidence_refs:
  - ev:9
- id: obs:13
  text: Servants entering service observe whom they meet; meeting someone walking
    signifies bad, while meeting someone riding signifies good.
  category: other
  evidence_refs:
  - ev:10
- id: obs:14
  text: Servants seeing the stork flying for the first time means they will change
    service that year, while seeing it standing means they will remain.
  category: other
  evidence_refs:
  - ev:11
- id: obs:15
  text: When something is stolen, one may let a smith strike out the thief’s eye.
  category: action
  evidence_refs:
  - ev:12
