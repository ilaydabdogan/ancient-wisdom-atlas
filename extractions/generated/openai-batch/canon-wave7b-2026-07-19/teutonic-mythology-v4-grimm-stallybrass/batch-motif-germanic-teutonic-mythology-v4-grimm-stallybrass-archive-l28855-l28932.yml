  quote: ''
  summary: A numbered catalogue of Scandinavian popular superstitions concerning children,
    illness, spectres, water after dark, church prayer, fishing luck, stolen fishing
    tackle, and corpse transport.
  language: Swedish with English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person entering a house should not take a child in hand without first touching
    the fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Children who teethe quickly are said to expect new brothers and sisters soon.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Children who like warm water are assigned a negative future sexual trait in
    the superstition.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rocking an empty cradle is forbidden because the child is said to become crying
    and restless.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A first-born child born with teeth is said to heal the evil bite by biting
    over it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A child should not read and eat at the same time, because this is said to
    cause sluggish memory.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A child should first touch a dog and not a cat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Children who play with fire are said to have difficulty holding their water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: For a child conceived before marriage, the mother must hold the child at the
    baptismal font, or the child is said not to be legitimate.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: For a child born before marriage, the mother must hold the child on her arm
    when she is married.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A sick person receiving a stranger's food is said to become well.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: One should not thank for medicine, because it is then said to have no effect.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: A person with an open sore should not go over graves, because the sore is
    said to heal late or never.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: A person who has seen a spectre should not speak of it before morning, to
    avoid being cramped and spitting blood.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: After dark, one should not go to water, to avoid the evil bite.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:16
  text: After crossing water after dark, one should spit three times for the same
    reason, or to avoid being cramped.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: For a sick person, prayers should be said in three churches, preferably including
    an over-church if nearby.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: Prayer in the three churches is said to bring a speedy outcome, either health
    or death.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: Big fishes' teeth should be burned in order to be lucky in fishing.
  category: action
  evidence_refs:
  - ev:9
- id: obs:20
  text: When going fishing, one should tell no one and should not talk about whether
    the catch is much or little.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:21
  text: No stranger should see how much fish has been caught.
  category: action
  evidence_refs:
  - ev:10
- id: obs:22
  text: When rowing out from land to fish, one should not turn the boat ansols.
  category: action
  evidence_refs:
  - ev:10
- id: obs:23
  text: Pins found in church and made there into bait-hooks are said to catch best
    or be most gifted.
  category: object
  evidence_refs:
  - ev:11
- id: obs:24
  text: If a female walks over a fishing rod, the fish are said not to bite.
  category: action
  evidence_refs:
  - ev:11
- id: obs:25
  text: Stolen fishing tackle is said to be lucky, while the robbed person loses the
    luck.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:26
  text: One should not drive a corpse to church, because the horse is said to become
    shy or spoiled.
  category: action
  evidence_refs:
  - ev:12
