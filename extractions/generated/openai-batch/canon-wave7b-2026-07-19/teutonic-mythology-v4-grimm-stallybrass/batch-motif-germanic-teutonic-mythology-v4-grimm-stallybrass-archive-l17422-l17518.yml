  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: Witches are accused of grasping, stroking, dazzling, treading cattle, and
    causing bodily harm or dazing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: 'Rubbing materials can produce or summon animals: wood, chips, leaves, feathers,
