canonical_text:
  quote: ''
  summary: 'The passage catalogs comparative examples of magic: animal transformation,
    exchange of forms, magical power located in nails and hair, charms for invulnerability,
    harmful witch gestures, magic by rubbing materials, the evil eye, flower-producing
    laughter, and forgetfulness caused by hisses, apples, and potions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes running wild like a boar in Old Norse tales from
    literal transformation into a swine.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Magicians and enchantresses in fairytales are said to change men into wolves,
    bears, cats, dogs, or swine, while later witches are said to lack that power.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Circe is described as turning men into swine by a stroke of her rod and a
    formula.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Lapland sorcerers are said to send bears, wolves, foxes, and ravens to do
    mischief to men; such a beast is called tilde.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Two persons may exchange figures or forms, described with Old Norse expressions
    and said to be effected by will, without spell or clothing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Named examples of form exchange include Sigurd and Gunnar, and Signy and the
    sorceress; similar confusion is associated with look-alike brothers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage links substitution or concealment to the tarnhut, nighttime bed-substitution
    episodes, and later exchange of clothes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Magic is said to lie in nails and to be fixed in hair; examples include elf-locks,
    shaving witches, and removing magic from hair.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Magic can make a person proof against sword, bullet, shot, stroke, iron, or
    poison, including by a silk thread or other magical textiles.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: A wound-spell that makes invulnerable can be neutralized by hiding a knife
