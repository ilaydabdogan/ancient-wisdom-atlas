comparison_claims:
- id: claim:1
  claim: The passage treats fairytale animal transformation and Circe's swine transformation
    as comparable instances of human-to-animal magic.
  claim_level: same_motif
  target: fairytale magicians and enchantresses compared with Homeric Circe
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: The passage juxtaposes examples but does not argue for historical transmission.
- id: claim:2
  claim: The Lapland practice of sending harmful beasts is functionally comparable
    to other animal magic in the passage, though it sends animals rather than transforming
    humans into them.
  claim_level: same_function
  target: Lapland sorcerer animal emissaries compared with animal-transformation magic
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: 'The mechanism differs: emissary-sending versus bodily transformation.'
- id: claim:3
  claim: The Old Norse exchange of figures is compared with Nibelungen invisibility,
    bed-substitution tales, and clothing exchange as related ways of replacing or
    disguising identity.
  claim_level: same_function
  target: Old Norse form exchange, Nibelungen tarnhut, Brangaene-for-Isot substitution,
    Berthe au grand pied, and the Fabliau of the hair-cutting
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: 'The listed cases use different devices: will, invisibility hood, bed
    substitution, or clothing.'
- id: claim:4
  claim: The passage compares Kalevala rubbing magic with a fairytale of three brothers
    as the same motif of rubbing materials to produce or call animal helpers.
  claim_level: same_motif
  target: Kalevala animal production by rubbing and fairytale brothers summoning eagles,
