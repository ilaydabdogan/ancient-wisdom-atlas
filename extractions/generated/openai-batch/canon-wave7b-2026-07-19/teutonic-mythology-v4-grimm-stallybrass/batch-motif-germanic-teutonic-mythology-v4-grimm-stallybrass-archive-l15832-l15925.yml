canonical_text:
  quote: ''
  summary: The passage collects comparative notes on supernatural guardians of treasure,
    especially the devil, dragons, serpents, dwarfs, treasure spirits, and wealth
    deities. It also summarizes heroic hoard episodes involving Andvaranaut, Sigurd,
    Siegfried, Chriemhilt, Hagen, Gunnar, Hogni, and Fafnir's gold. A later section
    lists legends of hair or beard shaving by mountain beings or spectres, sinking
    castles or cities marked by crashes, a great fish whose released tail would unleash
    a catastrophic flood, flood omens, and children or foundlings associated with
    floodwaters and trees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Buried money or treasure is described as being guarded by the devil, by a
    grey woman on a three-legged white horse, by Finnish aarni or kratti, and by a
    wyrm identified as a hoard's keeper.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Plutus and Kuvera are cited as wealth-associated comparanda; Plutus is connected
    with blindness, and Kuvera is called a hideous god of wealth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Dragons are repeatedly associated with gold or treasure: Fafnir lies on inherited
    wealth, dragons sun their gold, and Heimo kills a dragon and finds a rich hoard
    with golden apples.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Lanuvium example, maidens bring food to an old guardian dragon, and
    their chastity is linked to their safe return and a fertile year.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage summarizes heroic hoard episodes involving Andvaranaut, a German
    wishing-rod substitution, Sigurd's giving and removing of the ring, Siegfried's
    winning of treasure, Chriemhilt's receipt of it, Hagen's sinking or hiding of
    it in the Rhine, and Gunnar and Hogni taking Fafnir's gold.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Finnish mammentlainen is described as a mother serpent and custodian of subterranean
    riches, and golden geese and ducks are said to sit underground on golden eggs.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some stories have an old man in a mountain cropping visitors' heads bald,
    while spectres may attempt to shave a man's beard as he lies in bed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sinking or disappearing places are said to be preceded or accompanied by a
    crash, bang, crack, or similar sound.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Near Staffelberg, a great fish in a pond holds its tail in its mouth; if it
    lets go, the mountain will break apart, fill the pond, and a flood will drown
    the flats of the Main and Rhine.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A small cloud on the horizon is said to announce the arrival of floodwater
    or violent rain.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage mentions an angel walking into a sinking city and gives examples
    of a foundling or newborn child associated with floodwaters and a tree.
  category: sequence
  evidence_refs:
  - ev:8
