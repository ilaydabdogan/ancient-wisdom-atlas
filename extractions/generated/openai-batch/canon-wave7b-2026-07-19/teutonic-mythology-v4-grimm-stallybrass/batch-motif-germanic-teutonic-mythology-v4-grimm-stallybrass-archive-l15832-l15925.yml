    treasure guardians: the devil, Plutus, Kuvera, the grey woman on a horse, Finnish
    aarni or kratti, and the Beowulf wyrm.'
  claim_level: same_function
  target: cross-traditional treasure or wealth guardian pattern
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage juxtaposes examples but does not argue historical contact
    or common inheritance.
- id: claim:2
  claim: The passage supports a same-motif comparison between Norse and German heroic
    hoard traditions involving Fafnir's gold, Andvaranaut, Siegfried or Sigurd, Chriemhilt,
    Hagen, Gunnar, and Hogni.
  claim_level: same_motif
  target: Norse and German Nibelung/Völsung hoard tradition
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The cited passage is a comparative note; detailed narrative contexts
    are not included here.
- id: claim:3
  claim: The passage cautiously compares Finnish mammentlainen, a mother serpent guarding
    subterranean riches, with an Old Norse serpent expression associated with Atli.
  claim_level: linguistic_similarity
  target: Finnish mammentlainen and Old Norse mddir Atla serpens
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage says the Finnish term 'reminds one' of the Old Norse expression;
    it does not establish etymology or historical borrowing.
