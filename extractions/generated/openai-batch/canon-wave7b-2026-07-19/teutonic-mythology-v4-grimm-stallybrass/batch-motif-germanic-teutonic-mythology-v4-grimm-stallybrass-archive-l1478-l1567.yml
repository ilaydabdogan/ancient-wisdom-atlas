  text: Pirates are said to offer a tenth part of their booty.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Stones are carried or thrown onto graves, herms, roads, cairns, or spots associated
    with murder; repeated contributions can raise mounds.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: Strips of cloth are hung on a sacred tree; passers-by throw twigs or rags
    on a stone, put pennies in a stone, or throw bread, money, and eggshells into
    springs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:4
  text: Herdsmen offer bloody victims, husbandmen offer fruits of the earth, ears
    are left standing for Wodan, flax is given for the little wood-wife, and sheaves
    of straw are made for gods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:5
  text: The passage lists Greek and Indian examples of offerings involving stalks,
    ears, firstfruits, grass, water, butter, flowers, sprays, and hospitality.
  category: action
  evidence_refs:
  - ev:6
- id: obs:6
  text: A forest stone near Marburg is called an offering-stone, and people still
    lay flowers and corn upon it; a rock is crowned with flowers on Mayday.
  category: object
  evidence_refs:
  - ev:7
- id: obs:7
  text: Country folk go into the Hollow Stone on Easter-day and associate the practice
    with Veleda or Holda; nearby villagers go to hills where an idol formerly stood.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: Greek examples describe pouring wine to gods before drinking; the passage
    contrasts Scythians and German heroes as not spilling wine, and also mentions
    wine libations to dead comrades.
  category: action
  evidence_refs:
  - ev:9
- id: obs:9
  text: St. John’s and St. Gertrude’s minne is described through examples of drinking,
