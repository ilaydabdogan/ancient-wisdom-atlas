canonical_text:
  quote: ''
  summary: 'The passage compiles comparative notes on worship practices: offerings
    of booty, stones at graves or sacred places, cloth and small objects at trees,
    stones, and springs, agricultural and floral offerings to deities or spirits,
    visits to stones and hills on feast days, libations or ritual drinking, and St.
    John’s and St. Gertrude’s minne as blessing, lodging prayer, and parting rite.'
  language: English
  quote_policy: summarized
