canonical_text:
  quote: ''
  summary: A sequence of Scandinavian superstition notes describes beliefs about children
    born and baptized on Sunday, baptism-water used secretly for healing, reluctance
    to call a priest for the sick before extremity, needles and pins placed in unbaptized
    children’s clothing against bogies, and fear of spring bird cries, especially
    the cuckoo, with avoidance of going out fasting in April and May.
  language: Swedish with English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Children are not willingly baptized on the same day they are born, and children
    born and baptized on Sunday are believed not to live long.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If such children live, people believe no troll, witch, or bogie can harm them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Baptism-water in which children were baptized is sought and, if obtained without
    the priest’s knowledge, used to cure diseases.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: People do not readily call the priest to the sick until the last extremity,
    because they believe the sick will unfailingly die after receiving the Lord’s
    holy supper.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wives watch their children carefully until baptism and keep needles and pins
    in the child’s clothes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The needles and pins are kept in the child’s clothing so the child will not
    become booty of bogies.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In spring people are afraid of birds’ cries, especially the cuckoo, lest they
