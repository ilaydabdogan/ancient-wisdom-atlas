  quote: ''
  summary: 'Three numbered superstitions describe: a St Walpurg''s eve practice of
    wearing clothes wrong side out and creeping backward to a cross-way to enter witches''
    company; childbirth omens involving a reel, thread, and knife predicting a child''s
    death; and a box placed before a childbirth bed whose self-closing after someone
    sits on it predicts that the woman will not bear again.'
