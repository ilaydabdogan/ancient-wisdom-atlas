canonical_text:
  quote: ''
  summary: A numbered list of folk superstitions gives prohibitions, omens, and protective
    practices involving the moon, deathbeds, cornfields, infants, crickets, the dead,
    blood, sea speech, drinking, fire, pots, witches, thresholds, coffins, Monday
    beginnings, cradles, and salt and bread when moving into a house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pointing one's finger at the moon is said to result in getting a wooden finger.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wisps of straw from a bed on which a dead man has lain, when stuck in a cornfield,
    are said to keep birds away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Birds are said to be kept out of corn if, while harrowing, one goes to the
    left and says a spell learned from someone of the opposite sex.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: It is said to be not good if a child who cannot yet speak looks into a mirror.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two infants who cannot talk are not to be allowed to kiss one another.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Crickets or oven-crickets are said to bring ill-fortune.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Spinning and washing are prohibited while a dead person is still above ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Three drops of blood falling from one's nose are said to signify something
    strange.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: At sea, certain words are not to be spoken and substitute words are to be
    used instead.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: One is not to speak while another person drinks, and it is said not to be
    good for two people to drink together.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Wet wood lying on the fire and emitting air and smoke is said to signify chiding.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: A mess of food that continues to simmer in the pot after being removed from
    the fire is said to warrant that there are no witches in the house.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: Cocks can be sold, and the buyer is said not to get as many as otherwise.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Turning about in the door before going straight out to do outdoor business
    is said not to be good.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Itching of the nose is said to signify a sudden fit.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: If a nail being driven into a coffin bends and will not go in, another person
    is said to follow soon.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: Entering service, moving into a house, or beginning anything on Monday is
    prohibited because it is said not to live to be a week old.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: Stretching over a cradle is said not to be good and to cause tension of the
    heart.
  category: action
  evidence_refs:
  - ev:9
- id: obs:19
  text: When moving into a house, bringing salt and bread into it first is said to
    prevent lack of necessary things.
  category: action
  evidence_refs:
  - ev:9
