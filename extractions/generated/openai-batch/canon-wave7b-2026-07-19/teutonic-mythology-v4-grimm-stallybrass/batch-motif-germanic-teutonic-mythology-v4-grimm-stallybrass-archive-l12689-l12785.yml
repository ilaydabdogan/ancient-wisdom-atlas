canonical_text:
  quote: ''
  summary: 'The passage gathers comparative notes on names and images of the world:
    world ages and golden age people; tripartite heaven-earth-underworld cosmologies;
    middle-earth and world-center imagery; the world-snake, Atlas, and a world-supporting
    fish; multiple heavens; the world-tree Yggdrasill and related ash traditions;
    a snake at the ash roots; and a doubtful Franconian legend of an ancient tree
    with golden drops, milk at the roots, a dragon-guarded treasure, and a storm-raising
    black bird.'
  language: English
  quote_policy: summarized
