canonical_text:
  quote: ''
  summary: 'The passage catalogs condemned magical practices: an ointment used by
    men and women for journeys, weather-making through renunciation and devotion to
    devils, theft-detection rites using a loaf or cheese, and hydromancy using water,
    tapers, strange words, and a pure child as seer. It also names variants for drawing
    water and identifies Salathiel as lord or prince over water spirits according
    to the described masters.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men and women identified as vilnothum use an ointment called unguentum pharelis
    for journeys.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ointment is made from seven herbs gathered on designated weekdays and
    mixed with bird blood and beast fat.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The practitioners smear a bench, post, rake, or fire-fork and then speed away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The art of making hail and sudden showers is described as requiring denial
    of God, baptism, and Christian grace, and self-giving to the devil.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A captured instructress says the learner must deny God, the sacraments, saints,
    and Mary, and give body and soul to three devils who will grant a lifespan and
    perform the learner’s will.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The instructress says the learner should go to a private chamber, call the
    spirits, and offer them the required renunciation; the spirits will then make
    hail within an hour where desired.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After refusing to do the required acts, the narrator reports that the woman
    was delivered to Hans von Tailhaim and burned.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: For a lost object, some practitioners beswear a loaf, stick three knives into
    it to make three crosses, add a spindle and an enspin, and have two persons hold
    it on the unnamed finger while swearing by the twelve messengers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Another theft-detection practice blesses a cheese and assumes that the guilty
    thief cannot eat it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A hydromancy master seeking theft, treasure, or a secret goes before sunrise
    on Sunday to three flowing springs and draws water from each into a clean polished
    glass.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The hydromancy master brings the water to a fair chamber, burns tapers before
    it, honors the water, seats a pure child before it, and speaks strange words for
    the child to repeat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage says the strange hydromantic words signify putting away God and
    giving oneself to the foul fiend, and that the child’s visions may be falsified
    by the fiend.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Other methods draw water from running waters into a glass or boil water from
    standing pools in honor of spirits believed to have power over waters; Salathiel
    is named as lord and prince of them all.
  category: relationship
  evidence_refs:
  - ev:8
