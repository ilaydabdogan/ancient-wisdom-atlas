  quote: ''
  summary: 'Comparative notes on spectres: food and drink for souls at graves; terminology
    for haunting and returning dead; dead appearing at night in churches or to particular
    people; vampires as blood-sucking returned dead; will-o''-wisps and corpse-lights
    near graves and grave-treasures; and traditions about the fate of unbaptized children.'
  language: English
