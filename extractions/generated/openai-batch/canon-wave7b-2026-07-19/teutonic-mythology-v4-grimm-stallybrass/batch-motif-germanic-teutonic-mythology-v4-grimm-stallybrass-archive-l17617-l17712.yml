canonical_text:
  quote: ''
  summary: 'The passage collects comparative notes on superstition and divination:
    one-sense foresight or second sight, cat-eyed seers, ways to acquire forevision,
    methods for detecting thieves, divination by lots, twigs, sticks, leaves, ashes,
    books, fire, tables, sieves, icicles, and divination from sacrificed bodies, blood,
    and entrails.'
  language: English with cited terms in Old Norse, Old English, Latin, Greek, Germanic
    and other languages
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes foresighted persons who perceive future events by only
    one sense, either sight or hearing, and cannot hear what they see or see what
    they hear.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: These foresighted persons are labelled as witch-seers, god-seers, devil-seers,
    and are compared with Old Norse terms for ghost-seer or seer.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nursery tales are said to tell of cat-eyed men with an eye for mice, and of
    a giant who gets cat's eyes put into his head.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Forevision is said to be acquired by smearing with riisormsod or by looking
    at a funeral procession through a skagle-oiet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: To detect a thief, the passage lists a driven hoop, three plates containing
    bread, salt and lard, shaken dishes with observed froth, and seeing the stolen
    thing in a sword.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage also lists prophesying from icicles and by throwing a Bible open.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Lot-casting is described through terms for casting or shaking lots, including
    shaking twigs and related Germanic examples.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage lists peoples and procedures associated with divination by sticks,
    leaves, ashes, stalks of corn, buckets, and lot-books.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The passage mentions divining from the motion of boughs, seeing in fire, and
    a table associated with the hand or with luck.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage compares Roman expressions for drawing water or rain in a sieve
    with a German expression about emptying a pond with a sieve.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states that Gauls prophesied from the convulsions of one devoted
    to death after a sword wound, Cimbrians from blood and entrails of sacrificed
    prisoners, and Malays from entrails of slaughtered beasts.
  category: action
  evidence_refs:
  - ev:9
