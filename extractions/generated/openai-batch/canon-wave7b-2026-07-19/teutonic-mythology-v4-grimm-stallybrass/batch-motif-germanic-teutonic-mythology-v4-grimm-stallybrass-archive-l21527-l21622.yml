  summary: The passage compares Anglo-Saxon genealogical traditions for East Anglia
    and Essex. It discusses horse-derived names, lineages beginning with Woden, Uffa
    as first East Anglian king and eponym of the Uffings, Redwald and Eorpwald in
    East Anglian succession, Casera/Casser as Woden's son and as a Saxonized Caesar
    figure linked to native kings, and Essex genealogies from Woden through Seaxnete/Saxnat
    to early kings including Aescwine and Saebert.
  language: English with Latin, Old English, Old Saxon, Old High German, and Old Norse
    name forms cited
  quote_policy: summarized
