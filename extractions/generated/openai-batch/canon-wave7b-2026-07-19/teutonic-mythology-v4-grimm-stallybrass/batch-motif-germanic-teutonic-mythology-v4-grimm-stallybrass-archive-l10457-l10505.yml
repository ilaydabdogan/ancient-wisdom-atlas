canonical_text:
  quote: ''
  summary: 'The passage gathers learned notes on birds and animal names: birds on
    royal sceptres; the cuckoo as a bird of wedlock and fecundity; cuckoo- and ape-linked
    mountain or hill names; the cuckoo as miserly at the spring leaves, nurtured by
    another, a brood-parasitic bird, a devourer of foster-parents, a winter bird of
    prey, and a devil-associated term; the wryneck or hoopoo as servant or handmaid
    of the cuckoo; and a note that the bittern and hoopoo were once cowherds.'
  language: English with multilingual citations
  quote_policy: summarized
