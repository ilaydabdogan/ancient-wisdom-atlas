  summary: A philological and comparative note catalogues names and traits of schrats,
    wood-sprites, forest-elves, dryads, fauns, wild men, and wild women across Germanic,
    Finnic, Slavic, Greek, Roman, and related materials. It records actions such as
    tangling horses' manes, teasing, shaping echoes, inhabiting trees, producing forest
    voices, and receiving deposited toys.
