canonical_text:
  quote: ''
  summary: The passage discusses Anglo-Saxon genealogies and their relation to heroic
    poems, Saxo Grammaticus, and later Scandinavian genealogical traditions. It describes
    Snorri's preservation and adaptation of Saxon pedigree names, including lines
    around Woden/Odin, his wife Frigg, his three sons, and descendants such as the
    Volsungar. It also describes genealogies that interweave Trojan, Greek, Latin,
    and Hebrew names, connecting Memnon, Priam's daughter, Thor, Sif, Odin, royal
    houses, Harald fair-haired, and Sigurd Fafnis-bani.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Saxon genealogical names such as Scyld, Sceaf, and
    Beaw are connected by the author with the Beowulf Lay and the Traveller's Song.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author notes agreement between names in the Mercian line and statements
    of Saxo Grammaticus, and lists alliterative name-pairs including Hengest and Horsa,
    Scyld and Sceaf, Fin and Folcwald, and Freodhowald and Freawine.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says that part of the Saxon pedigrees had reached Scandinavia
    by the thirteenth century, including a series from Woden back to Bedwig and forward
    to three sons of Woden.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Snorri is described as preserving Saxon forms of names and adding explanatory
    forms equivalent to 'whom we call so-and-so.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bedwig's father is given as Cespheth, with variant forms, and the author says
    this may be the Saxon Scef in disguise.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A genealogical sequence is given from Bedwig through several named descendants
    to Vodhinn/Odhinn, whose wife is named Frigidha/Frigg.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Odhinn is said to have three sons: Vegdeg, Beldeg, and Sigi.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Vegdeg is said to rule over East Saxons, and Beldeg/Baldr is said to rule
    over Westphalia.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sigi is said to have a son Verir/Rerir, and the Volsungar who rule Franken
    are said to descend from them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Snorri is described as placing a second genealogy behind the Saxon one, interweaving
    Greek names and differing from the Anglo-Saxon accounts.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In that second genealogy, Memnon/Munnon, a king in Troy, marries a daughter
    of Priam and has a son Tror, identified as Thor.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Thor is said to marry a wise woman named Sibil/Sibylla, identified as Sif,
    and their descendants lead to Gespheth, the link to the Saxon line.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage reports similar longer pedigrees that add Hebrew names to Greek
    and Latin names in Fra Fornjoti, Langfedga-tal, and a manuscript of Sverris saga.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: A Fornaldar-sogur genealogy is summarized as running from Adam through biblical,
    classical, Trojan, Thor-related, and Odin-related names down to Harald fair-haired.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: In Langfedga-tal, Priam's daughter Troana marries Memnon, their son is Thor,
    and the line proceeds to Voden/Oden, from whom most kings' races are said to descend.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:16
  text: The beginning of Sverris saga is described as listing a genealogy from Adam
    through Priam, Thor, Odin, Sigi, Rerer, Volsungr, Sigmundr, and Sigurdr Fafnis-bani.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:17
  text: The author concludes that the resemblance between the Norse genealogy and
    the Anglo-Saxon ascending series ends with Bedwig, or at most one generation beyond
    him.
  category: relationship
  evidence_refs:
  - ev:13
