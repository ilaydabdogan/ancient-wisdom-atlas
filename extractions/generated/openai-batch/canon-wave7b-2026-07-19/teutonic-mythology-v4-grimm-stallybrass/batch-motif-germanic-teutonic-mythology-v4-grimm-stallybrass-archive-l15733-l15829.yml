canonical_text:
  quote: ''
  summary: The passage catalogs Germanic and neighboring folklore about wonder-flowers,
    spring-roots, bird-associated magical plants or stones, and wishing-rods. These
    objects may summon a grey mannikin or white lady, release someone, open boxes,
    confer invisibility, or help find treasure. Several are linked to Midsummer, birds,
    trees, clean handling, and formulas warning the finder not to forget the best
    thing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A flower comes up suddenly from the ground; when a man pulls it and puts it
    in his hat, a grey mannikin appears and beckons him to follow.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In another version, when the flower is stuck in the hat, a white lady appears.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wonder-flower can become caught in a shoe-buckle and is compared with
    fernseed falling into shoes; it ripens or blossoms on Midsummer night.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The flower is named as key-flower, wonderflower, and forget-me-not forms in
    several languages.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Three blue flowers are said to effect a release; another story names a yellow
    flower and includes the cry, “Forget not the best.”
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A person who hurries away has his heel cut; in one story the wounded heel
    never heals.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The spring-root or wonderflower is called bird’s nest in some contexts; it
    opens boxes and makes a person invisible.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The spring-root or wonderflower is also called two-leaf and is picked from
    the point of bifurcation in a tree.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: A belief is reported that a siskin lays a small precious stone in its nest
    to make the nest invisible.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A Swedish divining or wishing rod is cut from a bird’s rowan tree whose seed
    has fallen from a bird’s beak; it is also said to be cut on Midsummer eve from
    mistletoe boughs.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: The wishing-rod must be cut at a fitting time and by clean hands; other notices
    identify it as a hazel rod or holy hazel bough.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: The passage says the wishing-rod did not serve harmful magic.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: To lift a treasure lying in a stable, one must drive a white he-goat through
