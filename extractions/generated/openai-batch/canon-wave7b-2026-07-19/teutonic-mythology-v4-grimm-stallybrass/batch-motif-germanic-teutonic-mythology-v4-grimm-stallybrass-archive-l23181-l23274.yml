candidate_motifs:
- id: motif:1
  label: funerary water rite and burial healing charm
  taxonomy_refs: []
  basis: The passage joins water poured under a bier, controlled carrying of the body,
    and ointment buried with a slain person for supposed healing or health.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The opening funeral fragment is OCR-corrupt and partly incomplete; the
    motif label is based on the clearer following funeral clauses.
- id: motif:2
  label: hearth-grain divination
  taxonomy_refs: []
  basis: Barley grains placed on a still-warm fire-place are read as dangerous if
    they leap and good if they remain.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives the rule of interpretation but not a narrative outcome.
- id: motif:3
  label: life-sign under stone as illness omen
  taxonomy_refs: []
  basis: A moving creature under a stone near the sick person’s house predicts recovery;
    no moving creature predicts death.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage frames the practice as condemned superstition rather than
    affirming its efficacy.
- id: motif:4
  label: offering playthings to household or granary spirits for wealth
  taxonomy_refs:
  - sacred_exchange
  basis: Small bows and children’s items are left in cellar or granary so satyrs or
    hairy beings will play with them and bring other people’s goods.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The taxonomy reference is functional; the passage calls the beings satyrs
    or hairy ones but does not provide a full exchange narrative.
- id: motif:5
  label: New Year threshold work rite
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage singles out the Kalends of January and the new year as the time
    when people begin spinning, weaving, sewing, and other work.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage lists a practice rather than explaining a mythic seasonal
    cycle.
- id: motif:6
  label: bird omens guiding travel
  taxonomy_refs:
  - departure
  basis: A crow’s left-to-right song and a mouse-catching bird’s flight across the
    path are interpreted as favorable or directive omens for travel and lodging.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The taxonomy reference is broad; the passage concerns omen-reading during
