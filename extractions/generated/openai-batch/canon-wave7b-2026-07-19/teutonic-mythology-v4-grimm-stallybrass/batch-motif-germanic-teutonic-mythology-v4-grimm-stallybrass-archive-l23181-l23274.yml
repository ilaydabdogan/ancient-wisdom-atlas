canonical_text:
  quote: ''
  summary: 'The passage lists condemned or questioned superstitious practices and
    beliefs: actions around corpses and funerals; silent water poured under a bier;
    burial ointment for a slain person; divination from barley grains on a warm hearth;
    prognosis for an ill person by looking for living creatures under a stone; small
    toys or items left for satyrs or hairy beings to play with and bring wealth; New
    Year work begun at the Kalends of January; bird omens for travel; fear of going
    out before cockcrow because of unclean spirits; beliefs in corporeal forest women
    who appear to lovers and vanish; a household table with food, drink, and three
    knives set for three sisters called Parcae; magical transfer of a neighbor’s milk
    and honey abundance; fascination or bewitching of young animals; and a belief
    that women can leave through closed doors at night and travel across the earth
    while their husbands lie beside them.'
  language: Latin, with English pagination/headings and OCR corruption
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening fragment lists actions connected with a corpse or funeral, including
    grains, knots, wool-combs over a funeral, and a divided cart or vehicle through
    which the funeral is carried.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes women running silently to water while a dead body remains
    in the house and pouring that water under the bier when the body is lifted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same funeral passage says the body is observed not to be raised higher
    than the knees while it is carried out of the house, for some kind of health.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A slain person is described as being buried with ointment placed in the hand,
    as if the ointment could heal the wound after death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the household fire-place, barley grains are put on the still-warm swept
    place; if the grains leap, the omen is dangerous, and if they remain, it is good.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Visitors to a sick person remove or lift a stone near the house and look underneath
    for a moving living thing; the presence or absence of such life is used to predict
    recovery or death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Small boys’ bows and children’s items are thrown into a cellar or granary
    so that satyrs or hairy beings may play with them and bring goods belonging to
    others.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: On the Kalends of January, described as the octave of the Lord’s nativity,
    people are said to spin, weave, sew, and begin all kinds of work because of the
    new year.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Travelers interpret a small crow singing from their left to their right as
    a sign of a prosperous journey.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: When anxious about lodging, travelers treat a mouse-catching bird flying across
    their road ahead of them as an omen.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Some people fear going out before dawn or before cockcrow because they say
    unclean spirits have greater power to harm before the cock’s song.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage reports a belief in wild or forest women who are corporeal, show
    themselves to lovers when they wish, take pleasure with them, and then hide or
    vanish when they wish.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: Certain women prepare a household table with food, drink, and three knives
    for three sisters called Parcae, so that the sisters may refresh themselves if
    they come.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The passage reports a belief that women can, with enchantments and incantations,
    transfer a neighbor’s abundance of milk and honey to themselves, their animals,
    or others they choose.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: The passage reports a belief that women can bewitch or destroy young geese,
    peacocks, hens, piglets, and other animal offspring by word, sight, or hearing
    when entering a house.
  category: action
  evidence_refs:
  - ev:13
- id: obs:16
  text: Many women are described as believing that, at night in bed with the husband
    beside them, they can leave through closed doors while bodily and travel over
    the earth with others.
  category: action
  evidence_refs:
  - ev:14
