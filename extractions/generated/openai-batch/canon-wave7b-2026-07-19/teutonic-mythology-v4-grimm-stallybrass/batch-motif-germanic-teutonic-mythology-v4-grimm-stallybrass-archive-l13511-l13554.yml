  quote: ''
  summary: 'The passage collects Germanic and comparative expressions for death. Death
    is personified as a holy messenger of Deity who receives, fetches, and escorts.
    Death is also described through departure and journey language: the dead are gone
    or fared forth, dying is faring out, and death is the last or long journey. The
    passage also notes phrases about joining the great host or common place and leaving
    joy.'
