canonical_text:
  quote: ''
  summary: 'A set of philological and mythological notes on Germanic goddesses and
    related figures: kroden devils contrasted with good holdes; goddess terminology
    and a possible harvest-festival gotin; earth/fold/Iorð as divine mother and kin;
    Rindr''s relation to Odin; killings connected with Attila''s grave and hidden
    treasure; Nerthus as Terra mater with a car in a grove under a tree; Fru Gode/Gauden
    and harvest-home; and Frau Harke flying as a dove, making fields fruitful, and
    avoiding contact with the ground.'
  language: English with cited Germanic, Latin, Greek, Sanskrit, and Old Norse forms
  quote_policy: summarized
