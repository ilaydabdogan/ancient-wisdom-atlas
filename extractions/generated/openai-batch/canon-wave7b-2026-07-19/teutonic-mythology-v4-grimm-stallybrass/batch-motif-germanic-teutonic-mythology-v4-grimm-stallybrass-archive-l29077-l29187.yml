canonical_text:
  quote: ''
  summary: A numbered list of Scandinavian folk superstitions records omens and practices
    concerning sowing, harvest, stolen sea-tackle, distilling, disease prevention,
    death omens, suspected magic, weddings, pregnancy, christening clothes, household
    fire, Christmas precedence, washing-water, livestock, fishing secrecy, and the
    avoidance of harming dwelling-trees, mounds, and mountains inhabited by under-earth
    folk or homesprites.
  language: Swedish with English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the first three sowing days, three sticks are set at an ant-hill to see
    which seed will prosper; the stick over which the ant crawls highest indicates
    the most fortunate seed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If sea-tackle is stolen, it should be smoked with need-fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If swine smell or taste the vapour of a distilling apparatus, the whole distilling
    is expected to fail unless a horse blows into the pan or pipes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lying in stockings on Easter night is prescribed to prevent scab.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cracks in the yard in springtime signify that someone in the house will soon
    die.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: If a suspicious person comes into the yard, the text says a spell may be avoided
    either by making her bleed or by casting a firebrand after such a person.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the bride is dressed, she should first see the bridegroom in his attire
    so that the marriage may be loving.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the bride comes from church, she should herself unharness or unsaddle
    the horse so that she may have children easily.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The bride should first go into the kitchen and look in the sweeping-corner
    so that her food may become sufficient.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: If the bride dances with money in her shoes, no witchcraft can bite upon her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: A woman who has finished her weaving may take a splint from the loom, ride
    on it out through the door, and meet a man; the pregnant wife she thinks of is
    then said to have a boy, with the reverse also stated.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: If a pregnant wife drinks from a broad vessel, the child will be wide-mouthed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: If a pregnant wife goes through a hag-skott, described as the place where
    the yard-beam ends, she will get falling sickness.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: If a child is allowed to sleep in its christening clothes, it will not be
    stupid but good.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: A former evening song includes the statement that the speaker's fire shall
    never be extinguished.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: The one who first comes from church on Christmas Day is believed to be first
    to sow and reap and foremost in all work.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:17
  text: Washing-water is never emptied after sunset unless fire is put into it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: When livestock is first let out in spring, they go over a smoking fire or
    other vapour.
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: For fishing in certain lakes to prosper, a person should go away without telling
    or bribing anyone.
  category: action
  evidence_refs:
  - ev:7
- id: obs:20
  text: Dwelling-trees, large mounds, and mountains are counted among the greater
    amulets, and under-earth folk are believed to live in them.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:21
  text: People avoid cutting dwelling-trees to avoid misfortune; an example tells
    of a farmer who believed misfortune came because he cut a branch, then knelt and
    asked forgiveness.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:22
  text: Thursday evenings are kept especially holy, with no hewing or spinning, so
    that the homesprites living in dwelling-trees near the yard are not offended and
    do not depart with all blessing.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:23
  text: People do not willingly give a bride a good horse to ride, because if she
    is not a maid the horse is expected never to be good afterward.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:24
  text: After betrothal or marriage, the bride arranges that no one comes between
    the bridegroom and herself, because otherwise they are believed soon to be parted
    by death or otherwise.
  category: action
  evidence_refs:
  - ev:10
- id: obs:25
  text: On arriving at the wedding-house grounds, the bride throws the cup of brandy
    behind herself as far as she can in hope that her property portions will increase.
  category: action
  evidence_refs:
  - ev:10
- id: obs:26
  text: Food stands on the table night and day while the wedding lasts, in the belief
    that the bridal pair will never lack food or drink.
  category: setting
  evidence_refs:
  - ev:10
