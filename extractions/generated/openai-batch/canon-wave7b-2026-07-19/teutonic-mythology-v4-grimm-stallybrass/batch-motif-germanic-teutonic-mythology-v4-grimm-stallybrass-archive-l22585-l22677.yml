  summary: The passage discusses Germanic and Anglo-Saxon genealogical traditions
    in which gods, godlike heroes, and named ancestors stand at the head of peoples
    or dynasties. It compares Gaut or Geat with Eddic Gautr as a name of Odinn, summarizes
    Tacitus's account of Tuisco, Mannus, and Mannus's sons as founders of Germanic
    divisions, notes variant numbers of ancestral sons, and cites parallels for recurring
    groups of three sons in several mythic genealogies.
  language: English with cited Latin phrases
