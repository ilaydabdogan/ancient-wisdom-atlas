canonical_text:
  quote: ''
  summary: 'A numbered appendix list records folk superstitions and remedies: household
    and animal omens, weather and crop signs, anti-witch and anti-devil plants, soul-release
    at death, child and marriage rites, healing charms, treasure-digging rules, prosperity
    practices, and calendrical signs tied to St John''s, Shrovetide, new moon, and
    spring birds.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mouse-gnawed clothing, sneezing while putting on shoes, dog movements, two
    clocks striking together, and fowl droppings are each said to forecast mischief,
    bad luck, death, broken friendship, or good or bad luck.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  - ev:6
- id: obs:2
  text: Several entries link ordinary or seasonal acts and signs to rain, barley,
    lifespan, illness protection, or dearth, including washing sacks, building a river
    weir, a year without skating, first cuckoo or swallow in spring, and the cuckoo
    after St John's.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  - ev:6
- id: obs:3
  text: Devil's bit and John's wort are described as plants that drive away the devil
    or witches; the devil is said to prick holes in John's wort leaves out of spite.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: When a person dies, the windows are to be opened so that the soul can get
    out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: For a child to grow up good, the godmother or woman carrying it home from
    church is to lay it under the table, after which the father takes it up and gives
    it to the mother; other child-related rules concern the cradle and weaning.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:6
  text: Healing or protection practices use a clean Friday shirt, running water and
    salt, stolen sack-tie, coal found under the left foot after seeing the first swallow,
    lightning-struck wood toothpicks, and a three-crossed knife.
  category: action
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:5
- id: obs:7
  text: Animal-management practices include passing a goose through the legs three
    times and feeding it chewed bread with spoken words, smoking cattle with a black
    ball from an ant-hill, and making a stork nest on the chimney with the left hand.
  category: action
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:8
  text: Treasure and theft beliefs prescribe silence while digging, carrying bread
    so spectres cannot disturb the digger, placing money in the dead person's mouth
    to prevent return over hidden treasure, dropping a cross-penny on treasure, and
    driving an accidentally found horseshoe nail into the place where the fire always
    is after robbery.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
- id: obs:9
  text: Marriage beliefs prescribe actions for the bride such as dressing in a baking
    trough, knocking at the church door, arriving at the bridegroom's house in the
    dark, and taking the common road when fetched home; rain at a wedding and other
    signs are linked to prosperity or luck.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
- id: obs:10
  text: Market and wealth luck are linked to godfather's money, consecrated christening
    bread, counting money at new moon, eating lentils at Shrovetide, a first purchase
    at market, throwing first money on the ground and standing on it, and putting
    something in a new garment's pocket before wearing it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: 'Several practices depend on numbers, sides, silence, first-time timing, or
    special object histories: three passes or mouthfuls, a three-crossed knife, left
    hand or left foot, inherited keys, stolen ties, accidentally found nails, and
    the first spring bird sighting.'
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
