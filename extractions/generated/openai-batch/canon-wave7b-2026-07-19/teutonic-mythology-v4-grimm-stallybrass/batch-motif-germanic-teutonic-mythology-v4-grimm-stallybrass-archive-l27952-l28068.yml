canonical_text:
  quote: ''
  summary: A numbered appendix list of Germanic folk superstitions describes divination
    by key, birth and bodily taboos, burial and angel beliefs, food and household
    rules, healing fumigations, wedding customs, and several Absolution-night or Christmas-season
    practices for predicting marriage, fortune, or a future spouse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A key-test is performed by tying up a hymn book around a key so that the ring
    rests on two fingers and can turn while questions are asked.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A pregnant woman is warned not to pass under a hanging line, rope, or birdcage
    string, lest her child fail to escape the rope.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When planting peas, a person takes a few peas into the mouth before sunset
    and keeps silent while planting so that the planted peas will be safe from sparrows.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The sexton is not to dig a grave until the day of burial, because digging
    earlier would bring disturbance from the dead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Children dying unbaptized are said to hover between earth and heaven.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Children are told not to point toward heaven with the forefinger, because
    each such gesture kills or stabs an angel.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A child is warned not to place a knife in a certain way, because angels will
    tread it into their feet; a related rule says that if a child in the fire and
    a knife on its back are seen at the same time, one should run first to the knife.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Some people would rather be struck on the head than pass between two females.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: One man is described as putting on a white shirt on Monday and preferring
    nakedness to clean linen on Sunday.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Some believe that failing to eat specified foods on Ash Wednesday, Maundy
    Thursday, and Whit-Wednesday would cause them to become donkeys before Martinmas.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The bride and bridegroom are instructed to stand so close together that nobody
    can see through them.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The bride and bridegroom are instructed to observe the tapping of their first
    beer or wine cask and to step into bed together.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The bridegroom is instructed to be married in a bathing apron.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:14
  text: A person who wipes the mouth on the tablecloth is said never to have enough
    to eat.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:15
  text: It is described as not good to have a garment mended while it is on the body.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: The last loaf put into the oven is marked and called 'mine host'; so long
    as it remains in the house there is no lack of bread, but cutting it before its
    time brings dearth.
  category: object
  evidence_refs:
  - ev:12
- id: obs:17
  text: Overspanning a cup or can is said to be bad manners, and whoever drinks from
    it is said to get heart-cramp.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:18
  text: The sick are said to benefit from being smoked with a nine-ended rod broken
    from an old hedge, or with hay fetched silently and unchidden from the loft of
    an inherited barn.
  category: action
  evidence_refs:
  - ev:14
- id: obs:19
  text: On Absolution nights, Gastein girls go after dark to the sheepfold and clutch
    blindly among the flock; catching a ram at first clutch makes them confident they
    will marry that year.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:20
  text: At midnight before Christmas, some repeatedly ladle water from one vessel
    into another; an increase, equality, or decrease in the measured water predicts
    increase, stability, or diminution of goods in the following year.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:21
  text: Some tie a ball of thread to an inherited key, hang it out of a window, swing
    it along the wall while saying a word, and expect to hear a voice from the direction
    where they will go wooing and live.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:22
  text: On the day before Christmas, some make a midnight fire from wood cut from
    nine sorts of trees, sit naked by it after throwing their shifts outside the door,
    recite a request, and expect a figure to throw in the shift so that the face reveals
    the future lover.
  category: sequence
  evidence_refs:
  - ev:18
- id: obs:23
  text: Some put four onions in the room corners from Christmas to Twelfth-day, name
    them after bachelors, and identify the bachelor whose onion buds as the coming
    suitor.
  category: sequence
  evidence_refs:
  - ev:19
- id: obs:24
  text: Some wear a piece of crust from the end of a wheat loaf under the right arm
    for a day, sleep with it under the head, recite a verse, and read a gnawed or
    whole crust in the morning as an omen for whether the match will occur.
  category: sequence
  evidence_refs:
  - ev:20
- id: obs:25
  text: At midnight before Christmas-day, men or maids pull one log from a firewood
    stack; whether it is straight or crooked indicates the future sweetheart's figure.
  category: action
  evidence_refs:
  - ev:21
