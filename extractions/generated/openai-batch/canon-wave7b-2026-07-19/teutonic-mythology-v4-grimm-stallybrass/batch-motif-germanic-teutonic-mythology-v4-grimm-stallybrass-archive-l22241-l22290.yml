canonical_text:
  quote: ''
  summary: The passage discusses Anglo-Saxon genealogical figures such as Sceaf, Scyld,
    Heremod, and Bedwig; compares Heremod with Norse Hermoðr, son of Odin; describes
    medieval chroniclers' attempts to align native gods and heroes with biblical generations
    from Noah to Adam and Christ; and includes a footnote about ship-arrival traditions,
    Vishnu sleeping on a serpent in the sea, and a possible allusion to a boy in an
    oarless ship.
  language: English with Old English and Latin quotations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sceaf and Scyld are described as having divine repute, enhanced when one or
    the other is made a son of Heremod.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Heremod is described as a simple hero in Beowulf but as a distinctly divine
    being in Norse mythology; Hermoðr in the Edda is said to be a son of Odin.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author says chroniclers tried to bring native gods and heroes into line
    with the earliest generations transmitted by Holy Writ.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Saxon Chronicle insertion after Bedwig Sceafing includes a statement about
    being a son of Noah and being born in Noah's ark, followed by a genealogy through
    Lamech, Methuselah, Enoch, Jared, and other biblical figures to Adam and Christ.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Asser is said to omit Sceaf, put Shem in his place, and connect Bedwig through
    Noah and the biblical patriarchal line to Adam.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: William of Malmesbury is said to give a shorter line from Guala to Bedwegius
    to Stresaeus, with Stresaeus said to be a son of Noah; the author asks whether
    Stresaeus is a corruption of Scefius.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The author summarizes the genealogies as preserving names of gods in addition
    to Woden, including Geat, Baeldaeg, Seaxneat, Heremod, and perhaps Tativa.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: A footnote mentions a figure who comes to Brabant by ship, delivers the land,
    and becomes its ruler; it also says old Frankish, Frisian, and Saxon traditions
    seem to harmonize.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The same footnote adds that Vishnu sleeps on a serpent in the sea and asks
