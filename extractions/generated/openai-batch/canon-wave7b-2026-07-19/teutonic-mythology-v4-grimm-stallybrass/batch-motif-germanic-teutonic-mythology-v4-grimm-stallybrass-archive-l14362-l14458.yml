canonical_text:
  quote: ''
  summary: 'A comparative note under “Destiny and Well-being” catalogs wishing and
    luck-bringing objects: magic garments, girdles, rings, boots, staffs, horns, nets,
    dice, stones, returning weapons, folding vessels, self-supplying tables, Grail
    abundance, wishing-trees, wish-granting animals, and contests for such gear. It
    then turns to lucky birth cauls and birth garments, followed by guardian angels
    assigned to humans and, in some cases, beasts.'
  language: English with cited German, Latin, Old Norse, Sanskrit, and other terms
  quote_policy: summarized
