  summary: A comparative philological passage catalogues idioms for sunrise and sunset.
    The sun is described as rising, climbing, stepping up, arriving, sinking, going
    down, sitting, going west, passing behind or toward mountains, going to rest,
    bed, home, God, or its Maker, and being associated with gladness, joy, gold, and
    a golden bed. A Swiss example notes sunlight passing through a hole in a mountain-wall
    once a year to illuminate a church-steeple.
