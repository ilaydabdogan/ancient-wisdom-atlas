  quote: ''
  summary: The passage catalogues condemned practices involving hallowed, well, font,
    mill-wheel, and basin water; air and animal omens; wind-direction signs; sneeze
    augury; uproars taken as signs of treason; and wax-image or leaf magic moved by
    wind.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some women sprinkle herbs and plants with hallowed water so that worms will
    not come to them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some courtiers plunge new spur-rowels into a holy well, saying that what they
    strike with them will not swell.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some sorceresses catch water flying from a mill wheel and use it for sorceries
    involving love, enmity, and helping a man be a husband.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Some bad Christians use water from the blessed font for improper sorcery,
    and an old wife who obtains font-water is said to think she has won a prize.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two persons place named sticks, straws, rings, or small coins in basin water
    and read whether the named persons will come together, separate, or which spouse
    will die first by the objects' movement or sinking.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A forbidden art called Aremancia is described as dealing with air and whatever
    flies or lives in it.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says some heathen honor the first thing that appears to them in
    a day and worship it as their god for that day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A hare meeting a person is treated as misfortune, while a wolf meeting a person
    is treated as great luck.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Birds flying to the right hand are interpreted as gain and luck, while birds
    flying to the left side are interpreted as unluck and loss.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: An eagle flying on the pocket-side is interpreted as promising luck or gain,
    and some people move their pocket to test whether the eagle also turns.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The narrator states that the Devil changes himself into the mentioned birds
    in order to deceive men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Some princes and others schedule hunting for certain days and winds, and some
    men wear high feathers in their hats to determine wind direction and calculate
    luck with or against the wind.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Sneezing is interpreted as a sign of luck or unluck, with different forecasts
    depending on the number of sneezes and the time of day or night.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Natural philosophers explain sneezing as clearing the brain and describe it
    as related to a lesser stroke or minor apoplexy.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Some people and princes believe that great uproars mean that great treasons
    are underway.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Some sorceresses make a wax image or atzman at certain hours, utter names,
    and hang it in the air so that the wind stirs it and the named man has no rest.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: Some people perform a similar operation with an aspen leaf, writing sorcery
    on it to breed love.
  category: action
  evidence_refs:
  - ev:8
