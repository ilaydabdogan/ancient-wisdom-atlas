canonical_text:
  quote: ''
  summary: The passage is a comparative note on post-mortem souls. It mentions a forgotten
    object thrown into fire, beliefs that the soul climbs a steep mountain, the soul
    leaving the body and entering paradise, St. Michael or other angels receiving
    and conveying souls, angels and devils attending or claiming souls according to
    religious affiliation, and a soul lodging with a saint-like figure before sailing
    over the liver-sea.
  language: English
  quote_policy: summarized
