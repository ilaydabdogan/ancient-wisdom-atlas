canonical_text:
  quote: ''
  summary: A numbered list of folk beliefs and practices concerning baptism, infant
    protection, storm and weather rites, animal-name taboos, livestock protection,
    wolf remedies, domestic fowl omens, fire-stopping sacrifice, and household misfortune
    prevention.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Until baptism, a baby has a book placed under its head and a fire kept beside
    it to keep the devil from changing the child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: During baptism, the baby's head posture is read as a sign of long or short
    life.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A father may run around the church during the baptismal service so that the
    child will be fleet of foot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Baptismal water may be obtained from the sexton and dashed high on a wall
    so the child will attain high honours.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Rules about speech, sponsors, burials, hands, rings, food, clothing inserts,
    day of christening, and other baptismal circumstances are linked to the child's
    future traits, health, marriage, or survival.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Parents who lose their first children call the next ones Adam and Eve, and
    the passage says those children live.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Thunder is explained as God chasing, overtaking, and dashing down the devil;
    people close doors and windows so the hunted devil will not take refuge in the
    house and draw a thunderstroke there.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: During storms, some fasten two knives outside a window; some tap their forehead
    three times with a stone at the year's first thunder; lightning-struck rocks are
    associated with the devil being surprised and slain there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Many take the rainbow to be Thunder's sickle, used to punish malignant under-gods
    who try to injure people.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: People are said to believe that wind can be raised or redirected by hanging
    up a snake or setting up an axe toward the desired wind direction and whistling
    to allure it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A sudden noise on New-year's night is said to foretell the death of an inmate.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Wild beasts are given periphrastic names and their real names are avoided;
    the fox is called grey-coat and the bear broad-foot.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: At the first annual driving-out of cattle, eggs are buried under the threshold;
    in a cattle plague, one head of the herd was found buried under the stable door
    as a sacrifice to Death to stay the murrain.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: 'Cattle and oxen are subject to signs and rules: cattle returning while chewing
    grass signify a hay-famine, an animal treading on an egg before the stable door
    is considered ripe for death, certain first calves cannot thrive, and a yoke must
    not be laid on bare ground lest it wound the ox.'
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Wolf and hare practices include sprinkling salt on a wolf's track, interpreting
    wolf howling as plague or famine or as wolves crying to God for food, dropping
    clothing so a wolf will drop prey, and avoiding frequent naming of the hare.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: Domestic fowl practices include wearing a hen-wing tip for early rising, reading
    a cock or hen trailing straw as a corpse omen, and beating a hen with an old broom
    to make it lay eggs.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: A fire may be checked by throwing a live black hen into it as a sacrifice.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: When clearing corn and flour bins, a little is left behind to avoid misfortune.
  category: action
  evidence_refs:
  - ev:11
