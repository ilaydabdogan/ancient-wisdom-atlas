candidate_motifs:
- id: motif:1
  label: Pre-baptismal infant protection against devil and changeling threat
  taxonomy_refs: []
  basis: The unbaptized baby is guarded with a book under the head and fire nearby
    to ban the devil and prevent child-changing.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage states the protective aim but does not narrate an actual child-changing
    event.
- id: motif:2
  label: Baptismal omens and sympathetic shaping of a child's future
  taxonomy_refs: []
  basis: Head posture, running around the church, dashed baptismal water, sponsor
    behavior, clothing inserts, food rules, and christening dates are linked to lifespan,
    skill, honours, marriage, health, or character.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: These are listed as superstitions rather than a single continuous narrative.
- id: motif:3
  label: Protective Adam-and-Eve naming after earlier child deaths
  taxonomy_refs: []
  basis: Parents who lost first children are said to name the next children Adam and
    Eve, and those children live.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage gives no details about how the names are thought to work.
- id: motif:4
  label: Storm as divine pursuit and punishment of hostile beings
  taxonomy_refs:
  - divine_judgment
  basis: Thunder is described as God chasing and striking down the devil; the rainbow
    is also treated as Thunder's sickle for punishing malignant under-gods.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The taxonomy assignment is interpretive; the passage presents folk explanations
    rather than a formal judgment scene.
- id: motif:5
  label: Apotropaic storm implements and contact charm against thunder danger
  taxonomy_refs: []
  basis: Knives are fastened outside a window against lightning, and a stone tapped
    three times on the forehead at first thunder prevents headache for a year.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The separate knife and stone practices may represent distinct local charms.
- id: motif:6
  label: Weather-working with snake, axe, and whistle
  taxonomy_refs:
  - serpent
  basis: Wind is raised or redirected by hanging a snake or setting an axe toward
    the desired wind and alluring it by whistling.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The serpent reference is based only on the literal snake used in the rite.
- id: motif:7
  label: Avoidance of animal real names through euphemism
  taxonomy_refs: []
  basis: Wild beasts' real names are avoided and replaced with descriptive substitute
    names such as grey-coat and broad-foot.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not explain the reason for the avoidance beyond the practice
    itself.
- id: motif:8
  label: Livestock threshold protection and sacrifice to Death
  taxonomy_refs:
  - sacrifice
  basis: Eggs buried at the cattle threshold ban discomfort, and a herd head buried
    under the stable door is explicitly called a sacrifice to Death to stop murrain.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The egg rite and the herd-head sacrifice are adjacent livestock practices
    but not necessarily the same rite.
- id: motif:9
  label: Predator counter-magic and wolf omen
  taxonomy_refs: []
  basis: Salt on a wolf track, dropping clothing to make a wolf drop prey, and interpreting
    wolf howling as plague, famine, or a cry to God are all used to manage or interpret
    wolf activity.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The wolf practices combine preventative, remedial, and explanatory beliefs.
- id: motif:10
  label: Domestic fowl as omen, charm, and sacrificial agent
  taxonomy_refs:
  - sacrifice
  basis: Hen-wing wearing, fowl trailing straw as a corpse omen, broom-beating to
    induce laying, and throwing a live black hen into fire as a sacrifice all use
    domestic fowl ritually.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: Only the black hen fire practice is explicitly called a sacrifice.
- id: motif:11
  label: Retained household remainder prevents misfortune
  taxonomy_refs: []
  basis: A little corn and flour is left behind when bins are cleaned, otherwise misfortune
    follows.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage does not specify the nature of the misfortune.
