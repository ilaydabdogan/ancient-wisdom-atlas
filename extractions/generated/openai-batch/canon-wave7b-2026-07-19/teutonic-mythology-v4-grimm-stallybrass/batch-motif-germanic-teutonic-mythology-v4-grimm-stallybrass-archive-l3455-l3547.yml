canonical_text:
  quote: ''
  summary: The passage surveys Thor/Thunar's hammer as tool, symbol, landmark, ritual
    sign, and divine emblem; compares hammer and lightning associations for Donar,
    Pikne, Perkunnos, and Mantus; notes Thor as enemy of giants and trolls; records
    thunder oaths and curses; describes Thor's strength-girdle and iron gloves; and
    lists thunder-associated animals, plants, trees, and protective practices.
  language: English
  quote_policy: summarized
