- id: obs:1
  text: The hammer is described as a simple ancient implement adopted by several trades
    as a symbol.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A hammer-mark is described as being deeply graven at boundaries; a crossed
    oak later served as a landmark; the sign of the hammer was made when blessing
    a cup.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Thor's image is described as holding a great hammer; sacred hammers called
    Joviales are reported; hammers and clubs are described as emblems of Donar in
    Germany; Pikne carries lightning as an iron rod.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Thor is presented as a foe of giants and trolls; trolls avoid a feast where
    Tordenvoir appears, and lightning in Schonen is explained as Thor flogging trolls.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage gives oaths and curses invoking hammer, thunder, Thursday or Thor,
    and Perkunnos.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Perkunnos is said to have a great hammer by which the sun is rescued from
    captivity, and an Etruscan hammer is ascribed to Mantus.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Thor has a might-girdle and iron gloves; when he fastens the girdle on himself,
    his divine strength increases by half.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A salamander in the Alps is said to betoken a storm, and a female stag-beetle
    is said to carry red-hot coals into houses.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Plants named for Jovis, thunder, or Ukko are listed; houseleek is planted
