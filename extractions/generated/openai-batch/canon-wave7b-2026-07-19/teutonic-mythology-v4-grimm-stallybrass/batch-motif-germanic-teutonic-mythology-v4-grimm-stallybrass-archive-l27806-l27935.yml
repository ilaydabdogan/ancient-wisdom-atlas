  type: summary
  locator: '889'
  quote_or_summary: If household clatter or a log at the back of the fire jumps and
    crackles, strange guests are coming.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:2
  type: summary
  locator: '890'
  quote_or_summary: When setting out for war, one should not look behind, or one may
    never see home again.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:3
  type: summary
  locator: '891'
  quote_or_summary: Yarn left on the spool over Sunday is said to turn to sausages.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:4
  type: summary
  locator: '892'
  quote_or_summary: Ghosts are banished between door and doorpost and are tormented
    if the door is slammed.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:5
  type: summary
  locator: '893'
  quote_or_summary: Looking over the left shoulder of someone who sees spirits and
    future events lets another do the same.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:6
  type: summary
  locator: '894'
  quote_or_summary: A stone falling between two walking friends or a dog running across
    their path foretells the severing of their friendship.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:7
  type: summary
  locator: '895'
  quote_or_summary: If one stumbles on the threshold while going out, one should turn
    back at once or worse will happen.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:8
  type: summary
  locator: '896'
  quote_or_summary: Before Shrove Sunday in Obersensbach, people cook their daintiest
    food for the dear little angels, lay it on the table at night, open the windows,
    and go to bed.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:9
  type: summary
  locator: '897'
  quote_or_summary: At harvest in Gernsheim, the first to finish cutting corn decorates
    a yellow bough with flowers and sticks it on the last load brought in.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:10
  type: summary
  locator: '898'
  quote_or_summary: At the moment of a death, grain in the barn is shuffled and wine
    in the cellar shaken so seed will come up and wine will not sour; the entry cites
    comparisons to nos. 576, 664, and 698.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:11
  type: summary
  locator: '899'
  quote_or_summary: On St. Blaise’s day in Gernsheim, the parson holds two crossed
    lighted tapers while old and young place their heads between them and are blessed
    for protection from head or neck pains for a year.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:12
  type: summary
  locator: '900'
  quote_or_summary: In parts of Westphalia, a woman who dies in childbed is buried
    dressed as she would have been for churching, not in the usual shroud.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:13
  type: summary
  locator: '901'
  quote_or_summary: Wood-worm ticking in old furniture is called deadman’s watch and
    is said to be the sound of a dead man passing with his watch ticking.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:14
  type: summary
  locator: 902-911
  quote_or_summary: Entries from Bavarian dialect material connect named days and
    seasonal signs with hens laying, molehills, cuckoo calls after John’s day, Shrove
    Tuesday thrashing, the shortest day and corn prices, Maurice’s day wheat, John’s
    beheading and tree-felling, March fog and storms, New Year’s wind and death, and
    Martinmas goose-breastbone winter divination.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:15
  type: summary
  locator: 912-921
  quote_or_summary: The passage gives calendrical and ritual rules for chickens from
    duck eggs, Good Friday drinking, waxing-moon feathers, Ash Wednesday devil hunting
    the wood-wife, Christmas or New Year washclout horse grooming, Rauch-night thrashing,
    Valentine’s eggs, John’s fire jumping against fever, Stephen’s horse bloodletting,
    Golden Sunday knives, and using a thief’s gallows rope for shooting accuracy;
    it cites nos. 356 and 418 for some items.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:16
  type: summary
  locator: '922'
  quote_or_summary: A new garment is slapped with a saying that the old must be patched
    and the new thrashed, so the garment will last longer.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:17
  type: summary
  locator: '923'
  quote_or_summary: Sick sheep should be made to creep through a young split oak.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:18
  type: summary
  locator: 924-926
  quote_or_summary: Pregnancy and infant rules say eating from a saucepan causes a
    child to stammer, mounting a carriage over pole or traces entangles the child
    in the navelstring, and a crying baby should be pulled through unboiled yarn three
    times in silence or treated by the mother’s silent post-churching clothing ritual;
    the carriage entry cites nos. 688 and 933.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:19
  type: summary
  locator: '927'
  quote_or_summary: At first pasture, a woman’s red stocking is drawn over a woodman’s
    axe and laid on the stable threshold so every horned beast steps over it; the
    entry cites no. 752.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized from supplied passage.
- id: ev:20
  type: summary
  locator: '928'
  quote_or_summary: To keep caterpillars off cabbages, a female walks backward naked
    through the cabbage garden three times in all directions during the fall moon.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized from supplied passage.
