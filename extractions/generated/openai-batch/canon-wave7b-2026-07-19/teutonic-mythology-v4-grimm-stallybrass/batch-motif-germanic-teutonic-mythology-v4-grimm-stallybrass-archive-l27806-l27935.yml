canonical_text:
  quote: ''
  summary: A numbered list of Germanic folk superstitions and ritual prescriptions
    concerning omens, calendrical taboos, household and threshold signs, offerings
    to angels, harvest and death customs, candle blessings, weather and animal divination,
    childbirth restrictions, livestock protection, and crop-protection rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Household sounds or fire behavior are said to foretell the arrival of strange
    guests.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person setting out for war is warned not to look behind, or he may never
    see home again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Yarn left on the spool over Sunday is said to turn into sausages.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ghosts are described as banished between a door and its doorpost, where a
    slammed door torments them.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Looking over the left shoulder of someone who sees spirits and future events
    is said to confer the same sight.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: If a stone falls between two walking friends or a dog crosses their path,
    their friendship is said to be severed soon.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Stumbling on the threshold while going out is treated as a warning to turn
    back.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: On the day before Shrove Sunday, some people prepare fine food for the dear
    little angels, leave it on the table at night, open the windows, and go to bed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: At harvest, the person who first cuts his corn takes a yellow bough, decorates
    it with flowers, and fixes it to the last load brought in.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: At the moment of a death, grain in the barn is shuffled and wine in the cellar
    shaken to protect seed and wine.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: On St. Blaise’s day, a parson holds two crossed lighted tapers while people
    place their heads between them and receive a blessing against head or neck pains.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: A woman dying in childbed is buried dressed as she would have been for her
    churching rather than in the usual shroud.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The ticking of wood-worms in old furniture is called deadman’s watch and is
    explained as the passing of a dead man whose watch is heard.
  category: other
  evidence_refs:
  - ev:13
- id: obs:14
  text: Several rules link named calendar days or seasonal signs with poultry, molehills,
    cuckoo calls, thrashing, corn prices, sowing, tree-felling, storms, deaths, and
    winter weather.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: Further calendrical rules concern Good Friday drinking, waxing-moon bed-stuffing,
    Ash Wednesday, Christmas or New Year horse grooming, Rauch-night thrashing, Valentine’s
    eggs, John’s fire, Stephen’s horse bloodletting, Golden Sunday knives, and gallows
    rope used for shooting luck.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: A new garment is slapped with a saying so that it will last longer.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: Sick sheep are to be made to creep through a young split oak.
  category: action
  evidence_refs:
  - ev:17
- id: obs:18
  text: Pregnancy and infant rules include avoiding eating from a saucepan, avoiding
    mounting over a carriage pole or traces, pulling a crying baby through unboiled
    yarn, and a silent mother’s ritual with clothes on the cradle.
  category: sequence
  evidence_refs:
  - ev:18
- id: obs:19
  text: When horned cattle first go to pasture, each beast is to step over a red woman’s
    stocking drawn over a woodman’s axe and laid on the stable threshold.
  category: action
  evidence_refs:
  - ev:19
- id: obs:20
  text: To keep caterpillars off cabbages, a female is to walk backward naked through
    the cabbage garden three times during the fall moon.
  category: action
  evidence_refs:
  - ev:20
