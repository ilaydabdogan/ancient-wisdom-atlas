canonical_text:
  quote: ''
  summary: 'The passage catalogs Germanic and comparative expressions for death: leaving
    life or the world, being left dead, going down to earth or dust, going to Hel,
    halls of female powers, another light, another world, peace, long sleep, or God.
    It then surveys personified and divine agents of death and soul-conductors, including
    Yama, death-angels, Hermes, Iris, Apollo and Artemis, Charon, God-sent Death,
    a young man named Death, and the Lapland Yabnien akha in a subterranean cave.'
  language: English with multilingual cited phrases
  quote_policy: summarized
