  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: lines 23652-23782, F no. 5
  quote_or_summary: On Easter, sausages are placed under cabbage and a goose is used;
    seeing the sausage prevents seeing snakes that year, and eating the goose prevents
    a cold sickness.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: lines 23652-23782, F no. 6
  quote_or_summary: Lard blessed with palms is smeared by farmers on the plow so that
    it cannot be bewitched.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 23652-23782, F no. 7
  quote_or_summary: On Christmas Eve a woman pulls a log from a woodpile in the devil's
    name; a long log means a long man, with source note 'conf. 49.'
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 23652-23782, F no. 8 and footnote
  quote_or_summary: On Shrovetide someone climbs a tree and shouts an 'alheit' formula;
    the footnote cites a similar phrase in Helbl. 8, 594.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 23652-23782, F no. 9
  quote_or_summary: Before Christmas Matins, a person takes mold from under a bench;
    if a living thing is found in it, it will not die that year.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 23652-23782, F no. 10
  quote_or_summary: Palm brought home from church is laid first in the cows' crib
    before being taken under the roof, so the cows will come home willingly that year.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 23652-23782, F no. 11
  quote_or_summary: Brushes stuck to the palm are used to brush the cattle so they
    will not become lousy.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 23652-23782, F no. 12
  quote_or_summary: Palm is placed under cabbage pots so that flies do not get into
    the cabbage.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 23652-23782, F no. 13
  quote_or_summary: Before an item is brought into the house, it is carried around
    the house so foxes will not eat the fowls.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 23652-23782, F no. 14
  quote_or_summary: At Christmas Matins a person goes with a light to a well and looks
    in; seeing a man standing in the well means she will take a husband that year.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: lines 23652-23782, F no. 15
  quote_or_summary: A formula invokes Jerusalem, Jordan baptism, and the Father, Son,
    and Holy Spirit, and is to be spoken three times.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: lines 23652-23782, F no. 16
  quote_or_summary: Dreaming of dead fish is said to mean that someone from the same
    house will die.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: lines 23652-23782, F no. 17
  quote_or_summary: If a beast cannot walk, a band is tied around it on Sunday, with
    the knot above, so it will be helped.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: lines 23652-23782, F no. 18
  quote_or_summary: For a cow with her first calf, an oak leaf with a needle and material
    from a distaff are put in the milking pail to prevent anyone from taking the cow's
    milk.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:18
  type: summary
  locator: lines 23652-23782, F no. 19
  quote_or_summary: Steel is buried under a gate, and cattle are driven over it so
    that they cannot be bewitched.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:19
  type: summary
  locator: lines 23652-23782, F no. 20
  quote_or_summary: St Blasius water is given to young hens and geese before removal
    from the nest so the fox will not carry them off and so they are safe from another
    named threat.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:20
  type: summary
  locator: lines 23652-23782, F no. 21
  quote_or_summary: When a calf is sold, a tail tuft from the calf and hair from the
    cow's right arm are cut and fed to the cow so she will not low after the calf.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:21
  type: summary
  locator: lines 23652-23782, F no. 22
  quote_or_summary: To take another woman's milk, three toads are put on a flour tray
    and presented to the cow; the cow swallows them, and the neighbor is deprived
    of milk.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:22
  type: summary
  locator: lines 23652-23782, F no. 23
  quote_or_summary: Some believe that when someone dies, the soul has no rest until
    bells are tolled for it.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:23
  type: summary
  locator: lines 23652-23782, F no. 24
  quote_or_summary: Some say the soul is penitent while bells toll; others say after
    separation from the body it spends the first night at St Gertraud, the second
    at St Michael, and the third where it has deserved.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:24
  type: summary
  locator: lines 23652-23782, F no. 25
  quote_or_summary: Some believe souls come out on Saturday night, remain outside
    until Monday, and then must return to their pains or confinement.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:25
  type: summary
  locator: lines 23652-23782, F no. 26
  quote_or_summary: Some abstain from meat on Thursday in Ember time so that they
    will not die in the mortality or plague.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:26
  type: summary
  locator: lines 23652-23782, F no. 27
  quote_or_summary: If a person's ears ring, the belief is that someone is speaking
    ill of them.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
