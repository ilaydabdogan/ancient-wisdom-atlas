canonical_text:
  quote: ''
  summary: A numbered list of late medieval German superstitions describes household,
    birth, calendar, marriage-divination, livestock-protection, milk-magic, death-omen,
    and soul-after-death practices. The rites involve Christian feast days, palms,
    lard, wells, bells, saints, water, animals, food, and spoken formulas.
  language: German with English editorial glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that when a woman is brought to a child, she has the child
    connected with the Twelve Apostles, and the child will not die unbaptized.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On Shrovetide, bread is thrown or cast to hens; if it falls down, a death
    within the year is predicted.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Eating milk at night and eating eggs are listed with yearly bodily or household
    outcomes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Easter, sausages are put under cabbage and a goose is used; the person
    who sees the sausage is said not to see snakes that year, and the one who eats
    the goose avoids a cold sickness.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Blessed lard associated with palms is smeared on a plow so that it cannot
    be bewitched.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: On Christmas Eve, a woman pulls a log from a woodpile in the devil's name;
    if she grasps a long one, she will get a long man.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: On Shrovetide, someone climbs a tree and shouts an 'alheit' formula, after
    which the year is said not to be needy.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Before Christmas Matins, someone reaches under a bench and takes out a handful
    of mold; if something living is found in the mold, it will not die that year.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Palm brought home from church is first laid in the cows' crib before being
    carried under the roof, so that the cows will willingly come home that year.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Brushes stuck to the palm are used to brush the cattle so that they will not
    become lousy.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Palm is placed under cabbage pots so flies will not get into the cabbage.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: An item, apparently the palm, is carried around the house before being brought
    inside so foxes will not eat the fowls.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: At Christmas Matins, a person goes with a light to a well and looks into it;
    if a man is seen standing in the well, she will take a husband that year.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: A spoken formula invokes a holy soul born at Jerusalem, baptism in the Jordan,
    and the Father, Son, and Holy Spirit, and is repeated three times.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: A dream of dead fish is said to mean that someone from the same house will
    die.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: If a beast cannot walk, a band is tied around it on Sunday with the knot above,
    and the beast is said to be helped.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: For a cow bearing her first calf, an oak leaf with a needle and material from
    a distaff are put into the milk pail so the cow's milk cannot be taken.
  category: action
  evidence_refs:
  - ev:17
- id: obs:18
  text: Steel is buried under the gate and cattle are driven over it so that they
    cannot be bewitched.
  category: action
  evidence_refs:
  - ev:18
- id: obs:19
  text: St Blasius water is given to young hens and geese before they are taken from
    the nest, so that a fox will not carry them away and they will be safe from another
    bird or predator named in the text.
  category: action
  evidence_refs:
  - ev:19
- id: obs:20
  text: When a calf is sold, the tuft from its tail and hair from the cow's right
    arm are cut and fed to the cow so that she will not low after the calf.
  category: action
  evidence_refs:
  - ev:20
- id: obs:21
  text: A person who wants to take another woman's milk places three toads on a flour
    tray and presents them to the cow; the cow swallows the toads, and the neighbor
    is deprived of milk.
  category: action
  evidence_refs:
  - ev:21
- id: obs:22
  text: Some believe a soul has no rest until the bell is tolled for it.
  category: speech
  evidence_refs:
  - ev:22
- id: obs:23
  text: Some say that while the bell is tolling the soul remains penitent; others
    say that after separating from the body it spends the first night with St Gertraud,
    the second with St Michael, and the third where it has deserved to go.
  category: sequence
  evidence_refs:
  - ev:23
- id: obs:24
  text: Some believe souls come out on Saturday night, remain outside until Monday,
    and then must return to their pains or confinement.
  category: sequence
  evidence_refs:
  - ev:24
- id: obs:25
  text: Some do not eat meat on Thursday in Ember time, so that they will not die
    in the mortality or plague.
  category: action
  evidence_refs:
  - ev:25
- id: obs:26
  text: Ringing ears are explained as a sign that someone is speaking ill of the person.
  category: sequence
  evidence_refs:
  - ev:26
