canonical_text:
  quote: ''
  summary: A sequence of Danish superstition notices concerning harmful use of personal
    objects, omens of death, lucky finds, bird omens and divination, rituals for seeing
    or detecting the devil, protections against ghosts at thresholds, seeing the dead
    in church, and trolls avoiding the name of the Cross. The final fishing notice
    is incomplete in the supplied passage.
  language: Danish with English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unspecified item associated with a wearer is to be burnt or buried; if
    bad men get hold of it, they can harm or undo the person who wore it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Finding a broken needle on the floor before saying the morning prayer is said
    to bring blows or ill words.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a corpse's eyes stand open, someone of the same family is expected soon
    to follow.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Skin and linen pieces that belonged to a dead person are said to fall apart
    as the body rots in the grave.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A corpse must not be given everyday clothes of a living person in the grave;
    as the clothes rot in the earth, the living former wearer is said to waste away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: When tallow around a burning light bends like a shaving, it is said to mean
    that someone will die, usually the person toward whom the shaving points.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Blue spots found on a body in the morning are said to signify the near approaching
    death of a kinsman or dear friend.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: A magpie sitting on the house is said to mean that strangers are coming.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: On first hearing the cuckoo in the year, one may ask how old one will become
    or how long until something happens; the cuckoo is said to answer by cuckooing.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: A found four-leaved clover, twin-nut, or shilling is to be saved because such
    things bring luck.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: To see the devil or have to do with him, one should go three times around
    the church, stop at the church door the third time, and either call out or whistle
    through the keyhole.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: To know whether a dead man had dealings with the devil, one should peep through
    the harness of the horses drawing his funeral wagon; if so, a black dog will be
    seen sitting at the back of the wagon.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: When fearing ghosts, one should strew a named substance before the door; then
    no ghost can cross the threshold.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Nailing a horseshoe on the doorstep prevents any ghost from coming over it.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: Coming to church too early in the morning may allow a person to see the dead
    sitting in the pews.
  category: setting
  evidence_refs:
  - ev:15
- id: obs:16
  text: Trolls dare not name the Cross, but call it only 'Hither-and-thither.'
  category: speech
  evidence_refs:
  - ev:16
