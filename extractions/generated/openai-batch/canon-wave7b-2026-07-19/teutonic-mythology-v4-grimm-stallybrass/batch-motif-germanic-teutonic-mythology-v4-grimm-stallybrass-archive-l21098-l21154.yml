canonical_text:
  quote: ''
  summary: 'Preface notes compare several religious patterns: Christian divine figures
    imagined in a wood like old gods; descent of gods from a God of gods; Indian supreme
    triad and the sacred word om; sexed divine pairs; recurrent twelve-member divine
    or heroic groups; Christian polemic against heathen gods, temples, images, sacrifices,
    and nature delight; and the claim that Germanic paganism lacks a strict Good/Evil
    dualism.'
