  summary: The passage is an antiquarian comparative note on names, attributes, and
    animal associations of the devil. It collects forms such as valant/voland, bodily
    traits such as lameness, blindness, blackness, horns, tail, and hoofed or mixed
    feet, and animal identifications or comparisons including goat, swine, wolf, hound/Cerberus,
    birds, serpent, dragon, and Leviathan.
  language: English with cited German, Latin, Middle Dutch, Old English, and related
