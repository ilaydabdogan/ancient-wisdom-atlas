literal_observations:
- id: obs:1
  text: The passage lists historical and regional forms of a devil-name, including
    valant, feilant, voland, and Fold, and notes that Mephistopheles calls himself
    Junker Voland in Goethe's Faust.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The devil is described as lame in Moravian and Wallachian material, and the
    passage cross-refers this to Thor's lame goat.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The devil is described as blind in Lithuanian material, and the passage says
    his eyes are put out with melted lead.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The devil is described as black or dark; the passage also says he wears grey
    or green clothes and, like dwarfs, a red cap.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The devil is associated with horns, a tail, and mixed or animal-like feet,
    including hen's foot, horse's foot, man's foot, cloven feet, goat's feet, and
    claws.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The passage associates the devil with goats, including demons in the shape
    of goats, the devil as a wild goat, and witches called the devil's she-goats.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage associates the devil with swine and related terms, including sow's
    snout, devil's pigs, and a breeding hog term.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage associates the devil with lynx, hare, and ape; the ape association
    is explained by saying he apes God.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage associates the devil with wolf and dog imagery, including hell-wolf,
    hell-hound, dog of spite, and the devil seen in dog's shape.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage associates the devil with bird imagery, including hell-raven,
    black bird shape, vulture, magpie, cuckoo, kiwit, goose-feet, and crow's feet.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage discusses serpent, worm, dragon, water-snake, and Leviathan terms
    in relation to the devil, while explicitly saying the serpent in Paradise was
    wrongly supposed to be the devil.
  category: relationship
  evidence_refs:
  - ev:9
