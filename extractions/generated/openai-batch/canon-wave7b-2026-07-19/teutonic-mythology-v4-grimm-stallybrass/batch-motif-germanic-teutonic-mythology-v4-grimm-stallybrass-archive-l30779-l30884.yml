canonical_text:
  quote: ''
  summary: A sequence of German Christian charms gives spoken formulae and ritual
    actions for preventing fire, stopping fire, expelling fever and diseases, treating
    worms, healing wounds, stanching blood, and treating a horse’s eye ailment. The
    charms invoke God, Jesus Christ, Mary, angels, Passion imagery, sacred places,
    and natural substances.
  language: German with English editorial headings and glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fire-prevention instruction says to make a cross with the hand and speak
    over a house and stable so that they are surrounded by angelic hoops and covered
    by an angelic covering, with God as house-father and host.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A charm addressed directly to fire commands it in Jesus’ name not to come
    further and to hold in its spark and flames, with a comparison to Mary preserving
    her virginity and honor.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A fever charm has the speaker bend a twig, command the fever to leave, and
    invoke the holy nail driven through Christ Jesus’ right hand and the blood drops
    that ran from it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A disease charm places the speaker on a dunghill, calls to Christ to remove
    named illnesses, and tells the illnesses to go out and away into a wild place.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Worm charms adjure a worm or worm-pair by God’s love and Godhead, ask that
    its matter and blood become pure, and in another formula command a white, black,
    or red worm to lie dead.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The worm instructions include ritual handling with the right thumb or right
    hand, and for a human patient include taking the patient’s finger and reciting
    five Paternosters, five Ave Marias, and a creed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A wound charm to be worn under the right arm for twenty-four hours narrates
    three blessed brothers meeting Jesus Christ while seeking an herb good for wounds.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the wound charm, Jesus tells the brothers to go to Messias mountain and
    take wool from sheep, moss from stones, and oil from trees; the mixture is then
    pressed into and onto the wound.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: A blood-stanching charm says three roses stood in God’s heart and identifies
    them as his virtue, power, and will before commanding blood to stand still.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Another blood-stanching charm names Longinus as the man who opened Jesus Christ’s
    right side, from which water and blood ran, and adjures blood by that blood’s
    honor to bleed no more.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: A further blood-stanching charm asks eternal God that the blood stand still
    as people at the last day must stand still.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: A horse-eye charm instructs the owner to take straw, breathe fasting into
    the horse’s eye, gesture toward the eye with a finger, and command the eye-nail
    by God’s grave to dwindle and dry up.
  category: action
  evidence_refs:
  - ev:10
