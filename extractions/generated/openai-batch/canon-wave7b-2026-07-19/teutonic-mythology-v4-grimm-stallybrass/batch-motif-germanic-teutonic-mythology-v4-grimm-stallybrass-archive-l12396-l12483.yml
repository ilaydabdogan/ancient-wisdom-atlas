canonical_text:
  quote: ''
  summary: The passage compiles medieval and folkloric evidence for personified Summer,
    May, Spring, and Winter. Winter is described as a violent warrior or tyrant with
    retinue and weapons; May or Summer is also armed and fights, defeats, or drives
    away Winter. The passage also records songs and customs for welcoming May/Summer,
    a Mistelgau tale of envoys fetching Spring in the form of a boxed bumblebee, and
    signs of Summer in flowers, birds, first blossoms, and plant names.
  language: English with cited Germanic and Latin phrases
  quote_policy: summarized
