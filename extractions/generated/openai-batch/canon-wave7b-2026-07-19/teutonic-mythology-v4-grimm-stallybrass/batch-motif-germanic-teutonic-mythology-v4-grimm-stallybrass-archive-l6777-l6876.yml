  summary: 'A comparative note on wights, elves, dwarfs, and related beings: echo
    is attributed to wood or rock spirits; dwarf and fairy communities are described
    as having queens, kings, and lords; laments announcing the death of named supernatural
    or legendary figures are listed; dwarfs and elves are tentatively connected with
    souls or spirits of the dead; and dwarfs are repeatedly located in rock holes,
    hollow mountains, underground spaces, and mining contexts.'
  language: English with cited Old Norse, German, Gaelic, and other terms
