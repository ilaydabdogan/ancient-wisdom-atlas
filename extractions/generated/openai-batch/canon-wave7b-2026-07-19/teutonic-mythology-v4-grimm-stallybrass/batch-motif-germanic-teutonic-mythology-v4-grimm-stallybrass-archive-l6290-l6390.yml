- id: obs:2
  text: A Moravian story describes three maidens marching with scythes and mowing
    people down; the lame maiden cannot keep up, is laughed at, and reveals the mystery
    of healing herbs to men in anger.
  category: sequence
  evidence_refs:
  - ev:1
