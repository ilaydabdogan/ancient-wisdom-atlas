canonical_text:
  quote: ''
  summary: The passage collects comparative notes on fates, wise women, valkyrs, shield-maidens,
    amazons, Brunhild/Brynhildr, drink-offering female figures, air-riding women,
    swan-shifts, and garments kept in an oak tree. It includes a Moravian tale of
    three scythe-bearing maidens, remarks on Odin sending valkyrs, examples of armed
    maidens and amazons, the sleep-thorn placed on Brunhild, Brynhildr/Sigrdrifa bringing
    a goblet to Sigurd, the number nine among valkyrs, valkyrs riding through the
    air and conducting the battle-dead, and valkyr swan-shifts.
  language: English with cited Germanic, Latin, and Old Norse terms
  quote_policy: summarized
