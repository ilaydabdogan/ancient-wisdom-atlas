  summary: 'The passage is a set of comparative notes on superstitious omens and divinatory
    practices: inspection of shoulder-blades, omens from sneezing and bodily sensations,
    spells and wax or lead casting for discovering a future lover, the significance
    of first encounters when setting out, favorable or unfavorable animal and human
    meetings, and related examples from several cited traditions.'
  language: English with cited German, Latin, and Greek phrases
