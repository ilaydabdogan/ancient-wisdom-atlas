  summary: 'The passage collects comparative notes on the soul''s passage after death:
    troublesome remnants such as nail-parings or eggshells, ships and ferrymen for
    souls, passage-money and other objects placed with the dead, journeys over waters,
    sharp or rainbow bridges, purgatorial fire, cows led across bridges, abyss-crossings
    with a wheel, and death-shoes for travel after death.'
