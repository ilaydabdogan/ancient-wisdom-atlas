candidate_motifs:
- id: motif:1
  label: Threshold control at marriage and death
  taxonomy_refs: []
  basis: The passage repeatedly marks gates, entrances, fences, and thresholds as
    sites requiring special handling for brides, corpses, and households.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  confidence: high
  cautions: This is a folk-custom pattern inferred from repeated boundary actions
    in the passage, not a named taxonomy motif.
- id: motif:2
  label: Sympathetic fertility and childbirth efficacy
  taxonomy_refs: []
  basis: 'Actions or objects are linked to desired or feared bodily outcomes: male
    child in lap for sons, bread and mouth for children''s mouths, fence removal for
    easy confinement, firewood handling for labour, and stepping over feet for malformed
    feet.'
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage states practical superstitions rather than a narrative myth.
- id: motif:3
  label: Apotropaic protection from sorcery at liminal transitions
  taxonomy_refs: []
  basis: The household fire is guarded after marriage to prevent sorcery, and a knife,
    cross-key, and red yarn are placed beside the baby in the cradle to defend it
    from sorcery.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: The protective function is explicit, but the passage does not identify
    a broader named tradition.
- id: motif:4
  label: Longevity and death omens through paired or observed signs
  taxonomy_refs: []
  basis: Spousal death order is read from sword vibration, candles, and first sleep;
    recovery is read from the priest's horse; future loss is read from footprints
    in ashes.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  confidence: high
  cautions: The evidence supports an omen pattern, not a specific external motif number.
- id: motif:5
  label: Household incorporation through distributed deposits
  taxonomy_refs: []
  basis: The bride is led through every part of the house and grounds and must drop
    ribbons or money into each part, including the well and theatre.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage does not explicitly call the deposits offerings or exchanges;
    that functional reading should be reviewed.
- id: motif:6
  label: Infant status, growth, destiny, and obedience rites
  taxonomy_refs: []
  basis: Newborn handling includes the mother's foot touching the mouth, careful disposal
    of bath-water, high table seating, rules about passing over the head, first-clutch
    divination, and cradle protection.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The examples are clustered around infancy but have several distinct intended
    outcomes.
- id: motif:7
  label: Death-contagion avoidance and prevention of further loss
  taxonomy_refs: []
  basis: The bride avoids a recent corpse gate, the corpse vehicle is kept outside
    the gate to prevent more family deaths, funerals avoid cornfields, and deathbed
    straw is burned and read for further loss.
