canonical_text:
  quote: ''
  summary: A list of folk superstitions and prescribed actions concerning wedding
    entry, marriage feast omens, pregnancy and labour, newborn handling, sickness
    omens, and funerary customs. The passage emphasizes household thresholds, fire
    and water, food, paired objects, protective items, and signs of fertility, future
    status, death, or further loss.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bride is not to come out by a gate through which a corpse has recently
    been carried.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the bride is fetched in, she is to wear no chains or bells and is to
    be led in solemn silence, with the stated consequence that otherwise she will
    have restless, noisy children.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the wedding, the strongest relation or guest lifts the bride and bridegroom
    aloft to heighten their married bliss.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the wedded pair enter their house, a watchman remains by the household
    fire so that no stranger can approach it and work secret sorcery against them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Upon entering, the bride is led through all parts of the house and grounds
    and must drop ribbons or money into each part, including the well and theatre.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: When the bride sits down, a male child is placed in her lap so that she may
    bear male children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: At the wedding feast, two swords may be stuck in the wall over the couple;
    the spouse whose sword vibrates longer is expected to live longer.
  category: object
  evidence_refs:
  - ev:2
- id: obs:8
  text: At the meal, beer is deliberately spilled so that superfluity may dwell with
    the couple.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: Whichever spouse first goes to sleep is said to die first, and rain on the
    wedding day is said to mean frequent weeping for the wife.
  category: other
  evidence_refs:
  - ev:2
- id: obs:10
  text: Two candles are placed before bride and bridegroom; the one whose light goes
    out first of itself marks the spouse who will die first.
  category: object
  evidence_refs:
  - ev:2
- id: obs:11
  text: The bridegroom's attendant puts a small buttered piece of a whole loaf into
    the bride's mouth so that her children will have small smooth mouths.
  category: action
  evidence_refs:
  - ev:2
- id: obs:12
  text: When the young wife is brought into her husband's house, the fence is pulled
    down on both sides of the entrance so she can enter quickly and later have quick,
    easy confinements.
  category: action
  evidence_refs:
  - ev:2
- id: obs:13
  text: Pregnant women avoid throwing wood into a fire against the branches, lest
    they have difficult labour.
  category: action
  evidence_refs:
  - ev:3
- id: obs:14
  text: A difficult labour is said to be lightened by the husband striding over the
    wife.
  category: action
  evidence_refs:
  - ev:3
- id: obs:15
  text: A pregnant woman avoids sitting on a water-vessel, lest she have too many
    daughters or lose the fruit in the water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:16
  text: If two pregnant women sneeze together they will have daughters; if their husbands
    sneeze, sons.
  category: other
  evidence_refs:
  - ev:3
- id: obs:17
  text: A pregnant woman cuts a very small first slice when beginning a loaf so that
    her children may have pretty little mouths.
  category: action
  evidence_refs:
  - ev:3
- id: obs:18
  text: Changing bast-shoes weekly in mid-pregnancy and throwing salt three times
    behind oneself before confinement are said to ease labour.
  category: action
  evidence_refs:
  - ev:3
- id: obs:19
  text: No one is to step over the feet of a pregnant woman, lest her children have
    crooked or misshapen feet.
  category: action
  evidence_refs:
  - ev:3
- id: obs:20
  text: A newborn is first laid at the mother's feet so that her left foot may touch
    its mouth; this is said to prevent rebelliousness.
  category: action
  evidence_refs:
  - ev:4
- id: obs:21
  text: A newborn baby's bath-water is emptied in an out-of-the-way place to prevent
    the child from being down-trodden and despised.
  category: action
  evidence_refs:
  - ev:4
- id: obs:22
  text: Soon after birth, the midwife with the baby takes the uppermost seat at table
    so the child will be more highly esteemed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:23
  text: Nothing is to be passed over the baby's head, or the child will not grow;
    if it happens, the hair on top of the head is pulled upward.
  category: action
  evidence_refs:
  - ev:4
- id: obs:24
  text: What a baby first clutches at is said to show its future favourite occupation.
  category: other
  evidence_refs:
  - ev:4
- id: obs:25
  text: When a babe is first laid in the cradle, a knife, a cross-key, and red yarn
    are placed beside it to defend it from sorcery.
  category: object
  evidence_refs:
  - ev:4
- id: obs:26
  text: A person born on one of the last days of a week is said to marry late or never.
  category: other
  evidence_refs:
  - ev:5
- id: obs:27
  text: A married woman having only boys is read as a sign of war, and having only
    girls as a sign of peace.
  category: other
  evidence_refs:
  - ev:5
- id: obs:28
  text: When a priest visits a sick man, observers watch the priest's horse; if the
    horse hangs its head, recovery is despaired of.
  category: action
  evidence_refs:
  - ev:5
- id: obs:29
  text: A funeral must not cross a cornfield, even if the field lies fallow.
  category: action
  evidence_refs:
  - ev:6
- id: obs:30
  text: By a corpse are laid a brush, money, needles, and thread; some brush the dead
    man's head and lay the brush beside him to bring him peace.
  category: object
  evidence_refs:
  - ev:6
- id: obs:31
  text: At each death in the house, some drive a nail into the threshold.
  category: action
  evidence_refs:
  - ev:6
- id: obs:32
  text: The vehicle that has carried a corpse is left outside the gate for a time,
    lest more of the family follow.
  category: action
  evidence_refs:
  - ev:6
- id: obs:33
  text: The straw on which a sick man died is carried out and burned; footprints in
    the ashes are used to tell whether the next loss will be of man or beast.
  category: action
  evidence_refs:
  - ev:6
- id: obs:34
  text: If someone dies at new moon, he takes all luck with him; if he dies in Shrovetide,
    he is buried as plainly as possible.
  category: other
  evidence_refs:
  - ev:6
