canonical_text:
  quote: ''
  summary: 'The passage compiles comparative notes on stones and rocks: people pass
    through hollow stones and offer at rocks; stones are described as fixed in earth,
    growing without roots, rocking, causing thunder and rain, marking boundaries,
    receiving complaints, moving or turning at special times, changing color, relenting,
    and refusing a false man as a seat. It also notes traditions in which giants and
    men become stone and in which stones are treated as sentient or responsive.'
  language: English
  quote_policy: summarized
