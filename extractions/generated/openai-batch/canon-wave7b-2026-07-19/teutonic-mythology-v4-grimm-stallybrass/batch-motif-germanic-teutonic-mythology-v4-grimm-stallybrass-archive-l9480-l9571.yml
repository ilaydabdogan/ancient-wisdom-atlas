canonical_text:
  quote: ''
  summary: The passage is a comparative philological catalogue of air, wind, calm,
    stormwind, and whirlwind terms and traditions. It notes identifications of Wodan,
    Zeus, Jupiter, and Juno with aether or air; Greek and Scythian ritual treatment
    of winds; Finnish, Norse, medieval Christian, French, Bohemian, Estonian, Germanic,
    Slavic, and Lithuanian wind names and personifications; and a cluster of expressions
    for the wind's bride, wind mother, stormwind, contrary wind, and whirlwind.
  language: English
  quote_policy: summarized
