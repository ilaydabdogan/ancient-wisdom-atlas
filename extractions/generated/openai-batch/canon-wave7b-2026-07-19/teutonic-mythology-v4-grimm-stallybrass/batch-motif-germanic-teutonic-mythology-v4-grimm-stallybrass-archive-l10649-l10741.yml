canonical_text:
  quote: ''
  summary: The passage is a comparative note on animals, especially dragons, worms,
    snakes, toads, fish, and beetles. It records names, affinities between dragons
    and snakes, dragon worship and depictions, dragons under trees or on gold, fire
    or poison breath, stones carried in bodies, life-stage sequences, methods of killing
    or warding dragons, dragon blood used on armor and weapons, eating a dragon-related
    heart to understand birds, deity-associated fish, and insect-origin beliefs from
    putrefaction or dung.
  language: English with cited Greek, Latin, Old Norse, Germanic, Slavic, Welsh, and
    other terms
  quote_policy: summarized
