canonical_text:
  quote: ''
  summary: The passage presents medieval German spell texts and headings. Section
    XII gives a charm for stolen goods, with directions for three recitations in a
    secluded chamber and an embedded sacred narrative in which Christ’s Lord’s image
    is stolen while he rests under a tree and Mary promises recovery. Section XIII
    gives an exorcism of gout by adjuring the ailment through Christ’s wounds, blood,
    nails, the cross, divine judgment, the holy grave, and named holy figures. Section
    XIV is only a heading for a herdsman’s charm. Section XV gives charms for a harmful
    worm in a horse, invoking St Job, Christ, color-naming, and whispering into the
    horse’s ear. Section XVI begins with only a heading for conjuring a marble horse.
  language: English headings and glosses with Middle High/Middle Low German spell
    texts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The stolen-goods charm instructs the user to speak the following prayers three
    times in a chamber where nobody disturbs them, after which angels come and tell
    what is asked.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the embedded narrative, holy Christ comes from heaven with many angels,
    carries a Lord’s image in his hands, rests under a tree, and falls deeply asleep.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Thieves come and steal the Lord’s image from Christ; when Christ wakes, he
    grieves greatly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mary says that good counsel will come and that they will find the thing on
    earth by means of the holy child that same night.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The stolen-goods prayer asks the Sabaoth Lord, through his only-begotten son
    Jesus Christ, for forgiveness, a good end, and revelation of the matter.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The instructions say this blessing may be used when something seriously harmful
    and reasonable has been stolen, but not for small or trifling matters; using noble
    blessings unnecessarily diminishes their help.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: The gout exorcism repeatedly forbids or adjures gout by sacred authorities,
    including Christ’s five wounds, blood, three nails, four gracious ones, divine
    judgment, the cross, and divine power in heaven and earth.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
- id: obs:8
  text: The gout exorcism asks that gout not harm the speaker, God’s servant, in a
    long list of body parts and limbs.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The gout text says a woman or man who carries these words over themselves
    may be sure that gout can never lame them, and it asks that God’s servant be healthy
    in soul and body.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The worm charm presents St Job lying in dung or a midden and complaining to
    holy Christ that small worms are eating his bones.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Christ commands the worm, whether white, black, yellow, green, or red, to
    be dead in the horse in that hour.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The instructions say the horse should be named according to the hue of its
    hair.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: A second worm charm addresses the worm in flesh and bone, invokes the holy
    gospel and St Job, commands the worm dead in the horse, and instructs the user
    to step on the horse’s forefoot and whisper the blessing into its right ear.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Within the selected passage, Section XIV and Section XVI appear only as headings
    without full charm texts.
  category: other
  evidence_refs:
  - ev:11
