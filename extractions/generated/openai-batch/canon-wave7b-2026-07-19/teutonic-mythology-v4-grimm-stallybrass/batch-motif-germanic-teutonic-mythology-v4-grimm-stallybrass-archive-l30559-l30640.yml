candidate_motifs:
- id: motif:1
  label: Stolen-property revelation through secluded threefold prayer
  taxonomy_refs: []
  basis: The charm promises that, after three undisturbed recitations in a chamber,
    angels will come and tell the user what is asked about the stolen goods.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a ritual instruction, not an independent narrative episode.
- id: motif:2
  label: Sacred theft as a charm precedent for finding stolen goods
  taxonomy_refs:
  - sacred_theft
  basis: The embedded narrative recounts the theft of Christ’s Lord’s image and Mary’s
    promise that the thing will be found that night, providing a sacred precedent
    for recovery of stolen property.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage uses the theft inside a practical spell; it does not provide
    a broader mythic theft cycle.
- id: motif:3
  label: Exorcistic adjuration of disease by Passion and judgment imagery
  taxonomy_refs:
  - divine_judgment
  basis: The gout exorcism adjures the ailment by Christ’s wounds, blood, nails, cross,
    divine power, the holy grave, and God’s verdict over the dead and living.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  confidence: medium
  cautions: Divine judgment is invoked as authority rather than narrated as a full
    judgment scene.
- id: motif:4
  label: Protective written or spoken words prevent laming
  taxonomy_refs: []
  basis: The gout text says that whoever carries or can speak these words over themselves
    may be sure that gout cannot lame them.
  evidence_refs:
