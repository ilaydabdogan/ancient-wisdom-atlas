  confidence: high
  cautions: The passage does not specify whether the words are written, worn, memorized,
    or otherwise carried beyond the statement that they are carried over the person.
- id: motif:5
  label: Saintly and Christic command kills the harmful worm in a horse
  taxonomy_refs: []
  basis: The worm charms address the worm directly and command it to be dead in the
    horse, invoking Christ, St Job, the holy gospel, and color identification.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The text treats the worm as a harmful creature or ailment in the horse;
