canonical_text:
  quote: ''
  summary: A blessing formula invokes the moon, sun, Holy Ghost, saints, apostles,
    evangelists, Mary, Christ’s blood, God, and other holy helpers for the addressee’s
    welfare, counsel, food, lodging, protection from sudden death, and acceptance
    of the soul in heaven. It recalls Santobias blessing and sending his son to Media/Rages,
    after which God brings him home healthy and with goods, and applies a similar
    blessing to the present addressee.
  language: Middle High German with English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The blessing asks that the moon and sun shine on the addressee with joy and
    that the seven gifts of the Holy Ghost let the addressee live in welfare.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Saint Stephen is asked to stand by the addressee whenever trouble is present.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The twelve apostles are asked to commend the addressee before God, and the
    blessing wishes that authority or lordship look favorably on the addressee.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Saint John and the four evangelists are said to advise the addressee for the
    best, and Saint Mary is named as a noble and free lady.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The blessing asks that the addressee be sanctified with Christ’s blood so
    that, after death, the addressee’s soul is not rejected from the kingdom of heaven.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Saint Gall is asked to care for the addressee’s food, and Saint Gertrude to
    give good lodging; the blessing also asks for a blessed body, kind men and women,
    lasting good counsel, and avoidance of sudden death.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Santobias blesses his son and sends him to a land and city identified as Media/Rages;
    afterward God sends him home healthy and with goods.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The final lines wish that the addressee be blessed today and helped by the
    three holy names, consecration, Mary, the children in heaven, Santobias, and his
    holy dear-son.
  category: speech
  evidence_refs:
  - ev:5
