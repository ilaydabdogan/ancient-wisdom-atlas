canonical_text:
  quote: ''
  summary: 'The passage compiles folk, literary, and comparative examples of sickness
    cures: passing patients through openings, transferring illnesses to animals or
    passersby, using animal hides, teeth, blood, spittle, and other bodily substances,
    and employing ligatures, threads, knots, and incantatory practices.'
  language: English with quoted German, Latin, Greek, Arabic-related, and other cited
    terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An English child with hooping cough is drawn three times through an opening
    in a hawthorn hedge; Apala, afflicted with a skin disease, offers a Soma-sacrifice
    to Indra and is healed when Indra draws her through three openings in his car.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For a persistent headache, a string is wound three times around the man's
    head and hung in a tree as a noose; if a bird flies through it, the bird takes
    the headache with it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A child's chemise worn during the schwere noth is laid on the crossways so
    that the disease passes to whoever walks, rides, or drives that way.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A hatchet-wound is said to be healed by tying up the tool that made the wound.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sick men are wrapped in the hide of a newly killed stag, and a sickly child
    is swathed in the skin of a newly slaughtered sheep; warm flesh is also mentioned
    in a witch-trial context.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage mentions a deer-strap cut from a live animal, a weasel tooth wrapped
    in the hide of a newly killed lion or maiden hind and laid on gouty feet, and
    a skin inflammation called wolf.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: A health-giving dish is described as containing the slaver of black and white
    snakes; dog blood, blood, the blood of innocent babes, and fasting men's spittle
    are also cited as cures.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A yellow bird is said to remove jaundice by its look; jaundice is also treated
    by drinking from a waxen goblet with a raven-ducat at the bottom.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ligaments, herb bindings, potions, wolf teeth, colored thread tied around
    the neck, a harmful Finnish magic globule, and a protective silver image are cited
    among charm practices.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: An Arabic conjurer is described as a breather on knots who ties the nestel
    and breathes or spits on it to complete the charm.
  category: action
  evidence_refs:
  - ev:8
