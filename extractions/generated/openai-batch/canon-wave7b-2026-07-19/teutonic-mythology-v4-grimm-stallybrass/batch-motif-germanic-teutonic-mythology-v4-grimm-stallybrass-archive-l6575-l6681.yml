canonical_text:
  quote: ''
  summary: 'Scholarly notes on Germanic elves, alps, pixies, dwarfs, and related beings:
    the passage gives lexical variants, habitat glosses, fairy customs and afflictions,
    distinctions between alfar and duergar, references to Andvari and Svartalfaheim,
    a mound-dwelling Olafr called an alfr, colour groupings of elves/fairies, dwarf
    dwellings in earth and stone, dwarf smith-work, knockers, elf-shot, and a comparison
    with Vulcan.'
  language: English with cited Old English, Old Norse, Germanic, Latin, Welsh, and
    related forms
  quote_policy: summarized
