  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Dwarfs are described as members of the retinues of giants, kings, heroes,
    knights, and richly dressed women; examples include Elberich, Maledicur, a dwarf
    behind a maiden, and little black spirits in a dame's train.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The little black spirits in the richly ornamented dame's train are described
    as giggling, clapping hands, and dancing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Devonshire pixies are said to make away with turnips, German dwarfs with peas,
    and the name Elbegast is connected with Erbagast, called prince of thieves; Hermes
    is mentioned as stealing oxen soon after birth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Dwarf Elberich is said to overpower a queen and beget the hero Otnit; an alb
    begets Hogiu; dwarfs are said to carry off human brides and fall in love with
    goddesses such as Freya.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Little Snowdrop comes to the dwarfs' deserted cottage, finds the table spread
    and beds made, and the dwarfs return; this is compared with Duke Ernest's visit
    to the empty castle of the beak-mouthed people, where food reveals that guests
    have been present.
  category: sequence
  evidence_refs:
  - ev:8
