canonical_text:
  quote: ''
  summary: A scholarly comparative note on wights, elves, dwarfs, pixies, alps, huldres,
    and related beings. The passage lists terms for ghostly deception and incubus-like
    sleep oppression, reports horse-mane tangling and matted hair traditions, describes
    dwarfs and pixies riding animals or appearing in retinues, notes thievish dwarf
    and pixie behavior, gives examples of dwarfs or albs overpowering women or begetting
    heroes, compares Snowdrop's visit to the dwarfs' empty cottage with Duke Ernest's
    visit to an empty castle, and links dwarf or pygmy traditions with cranes, birds
    of passage, and Dwarfland.
  language: English
  quote_policy: summarized
