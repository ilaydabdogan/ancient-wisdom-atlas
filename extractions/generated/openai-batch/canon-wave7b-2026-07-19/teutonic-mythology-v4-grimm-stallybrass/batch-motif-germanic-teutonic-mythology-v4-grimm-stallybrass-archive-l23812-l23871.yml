literal_observations:
- id: obs:1
  text: During the last Rauch-night, people carry a whole loaf and cheese around the
    house and bite from them; the number of bites is linked to the number of field
    stacks or cocks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'In the Rauch-nights, several household actions are prohibited: rending laths
    or shingles, rummaging at the oven, and making shreds or litter in the room.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The stated result of avoiding those Rauch-night actions is that cattle need
    not be skinned as carrion and fields do not have bare patches.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Spreading shavings over the oven is described as a practice done so that oats
    will not become blighted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: During the Undernächte, people are told not to carry a sieve across the yard,
    with an explanation involving cattle passing or looking through it and becoming
    harmed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: If a girl sifts through a sieve, the passage says people dance with her in
    preference to the others.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: On Christmas morning, horses are made to run to or against water, and an apple
    is thrown into the water while the horse drinks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the apple runs against the horse, the horse is said to become brisk for
    work during the year.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A dream in which the oven has fallen down is interpreted as meaning either
    the master or mistress will die.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Pregnant women who go to God's table on the same day perform an action for
    the child involving a 'XII poten,' with the stated result that the child does
    not die.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: For newly married people lying together on the first night, whichever falls
    asleep first is said to die first.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: During the Undernächte, people are told not to twist osiers, so that people
    in sickness will not writhe.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: People are told not to hasp, with the stated result that the cattle will not
    'haspen.'
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: On Christmas Eve, after the fumigation or smoking, people measure nine spoonfuls
    of water into a pail, leave it until day, and measure it again.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: If the measured water is less or incomplete, the passage says poverty will
    come that year; the passage breaks off after saying that if it is complete, then
    a contrary result follows.
  category: relationship
  evidence_refs:
  - ev:11
