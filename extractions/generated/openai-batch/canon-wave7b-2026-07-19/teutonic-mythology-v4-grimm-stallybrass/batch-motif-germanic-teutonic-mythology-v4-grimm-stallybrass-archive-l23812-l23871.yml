canonical_text:
  quote: ''
  summary: Appendix excerpt listing numbered German folk superstitions and ritual
    precautions for Rauchnächte, Undernächte, Christmas Eve, and Christmas morning,
    including household actions thought to affect harvest, livestock, health, childbirth,
    death omens, and yearly prosperity.
  language: German with English glosses
