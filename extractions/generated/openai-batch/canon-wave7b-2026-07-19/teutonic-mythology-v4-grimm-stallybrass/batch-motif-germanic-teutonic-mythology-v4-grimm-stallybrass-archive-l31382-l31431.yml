canonical_text:
  quote: ''
  summary: The passage comments on Germanic spells, noting protective formulas expressed
    through gates, armor, weapons, or hard body parts; the mixture of alliteration
    and rhyme; the combined invocation of Christian and heathen or elemental beings;
    sympathetic similes used to produce desired effects; medieval literary mentions
    of sword, wound, journey, evening, and morning blessings; and a Latin Lorica spell
    with an Old English interlinear version for bodily protection in dangers.
  language: English
  quote_policy: summarized
