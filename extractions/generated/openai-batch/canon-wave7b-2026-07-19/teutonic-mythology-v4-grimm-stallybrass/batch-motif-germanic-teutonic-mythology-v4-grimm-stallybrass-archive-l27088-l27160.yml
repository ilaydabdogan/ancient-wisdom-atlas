candidate_motifs:
- id: motif:1
  label: Seasonal apotropaic handling of grain and plants
  taxonomy_refs: []
  basis: Several numbered items prescribe grain, loaf-grains, corn-blossoms, or catkins
    at seasonal times to avert mice, reveal witches, prevent fever, or prevent freckles.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:12
  - ev:13
  confidence: medium
  cautions: The passage is a list of superstitions, not a narrative myth; motif label
    is descriptive rather than tied to a supplied taxonomy family.
- id: motif:2
  label: Ritual number three in cures and death rites
  taxonomy_refs: []
  basis: The passage repeatedly specifies three grains, threefold carrying, three
    vermin, three clods, and three knocks or actions.
  evidence_refs:
  - ev:2
  - ev:7
  - ev:9
  - ev:15
  - ev:16
  confidence: high
  cautions: The text does not explain the meaning of the number three.
- id: motif:3
  label: Prenatal sympathetic influence
  taxonomy_refs: []
  basis: A pregnant woman passing through tangled lines affects the child’s tangling,
    and bread handed to her on a pointed utensil affects the child’s eyes.
  evidence_refs:
  - ev:5
  - ev:19
  confidence: high
  cautions: The passage states the causal belief but gives no theoretical explanation.
- id: motif:4
  label: Sympathetic attack on a witch through afflicted vermin
  taxonomy_refs:
  - sacred_exchange
  basis: Hammering vermin wrapped in paper causes the witch to feel blows; her request
    to borrow something creates a refusal condition that prevents her release.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The taxonomy reference is tentative because the exchange element is limited
    to borrowing/refusal, not an explicitly sacred exchange.
- id: motif:5
  label: Death omen by altered shadow
  taxonomy_refs: []
  basis: When the Christmas-tree is lighted, those who will die within a year appear
    in wall-shadow without heads.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: No broader comparison is asserted beyond the stated omen pattern.
- id: motif:6
  label: Household notification and grave actions for the dead
  taxonomy_refs: []
  basis: After a man dies, bird-cages, flower-pots, beehives, wine-casks, grave clods,
    and corpse-grooming tools are ritually handled to affect rest or prevent harm.
  evidence_refs:
  - ev:15
  - ev:16
  - ev:17
  confidence: high
  cautions: The passage gives practical rules and consequences, not a full afterlife
    narrative.
- id: motif:7
  label: Holy-day work taboo punished or marked by lightning
  taxonomy_refs:
  - divine_judgment
  basis: Sewing or threading a needle on Ascension Day causes lightning to strike
    the house, and other animal signs are linked to lightning strike or luck.
  evidence_refs:
  - ev:20
  - ev:21
  - ev:22
  confidence: medium
  cautions: Lightning is associated with taboo and omen; explicit divine agency is
    not stated in the lightning items.
- id: motif:8
  label: Sacred time taboo against disturbing the buried Saviour
  taxonomy_refs:
  - death_rebirth
  basis: On Good Friday and Saturday, working the ground is forbidden for fear of
    disquieting the Saviour in the sepulchre.
  evidence_refs:
  - ev:23
  confidence: medium
  cautions: The reference to the Saviour in the sepulchre supports a Passion/Easter
    context, but the passage does not narrate death and rebirth.
