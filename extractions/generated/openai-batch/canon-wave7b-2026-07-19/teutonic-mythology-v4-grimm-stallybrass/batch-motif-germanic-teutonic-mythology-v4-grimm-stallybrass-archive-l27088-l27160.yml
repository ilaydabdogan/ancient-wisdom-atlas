canonical_text:
  quote: ''
  summary: A numbered list of Germanic folk superstitions prescribes or forbids actions
    involving grain, bread, animals, shoes, pregnancy, children, witches, brooms,
    Christmas-tree shadows, plants, death rites, Ascension Day, lightning omens, and
    Good Friday/Saturday work taboos.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A farmer tying sheaves at Shrovetide is said to prevent mice from harming
    a stack of corn if only one band is used to a sheaf throughout the stack.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Carrying three whole grains found in a baked loaf is said to allow a person
    on Walburgis-day to see witches and night-hags at church with milk-pails on their
    bench.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the Twelve-nights, neither master nor servant may bring freshly blackened
    shoes into the stable, or the cattle will be bewitched.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Cooking or eating peas during the Twelve-nights is said to bring vermin or
    leprosy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: If a pregnant woman passes through clothes-lines or anything tangled, the
    child is said to tangle itself as many times as she passed through the lines.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: For a child with convulsions, the instruction is to lay a horseshoe under
    the child’s pillow.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A sick child is said to get better if its godfather carries it three times
    up and down the room.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A mare foaling at the wrong time is explained as having stepped over a plough-fork;
    breaking the plough-fork is said to let her give birth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: When bewitched with vermin, the remedy is to wrap three vermin in paper and
    hammer on it; the witch is said to feel every blow and come to borrow something.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: If the person refuses the witch’s request to borrow something, the witch cannot
    get free and will sink under the blows.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage warns never to burn a broom, saying this protects against Antony’s
    fire.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: When the Christmas-tree is lighted, people’s shadows on the wall are observed;
    those who will die within a year are said to appear without heads.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: Drawing the first three corn-blossoms seen through the mouth and eating them
    is said to protect from fever for a year.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: Passing palm-brushes or catkins over the face is said to prevent freckles.
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: Washing the face during the passing-bell on Good Friday is also said to prevent
    freckles.
  category: action
  evidence_refs:
  - ev:14
- id: obs:16
  text: When a man dies, his bird-cages, flower-pots, and beehives must be placed
    differently, and his wine-casks must be knocked on three times.
  category: action
  evidence_refs:
  - ev:15
- id: obs:17
  text: The dead man’s rest is said to be furthered if everyone standing around the
    grave throws in three clods.
  category: action
  evidence_refs:
  - ev:16
- id: obs:18
  text: The comb and knife used to comb and shave a dead man are to be put in his
    coffin; otherwise the hair of later users will fall off.
  category: action
  evidence_refs:
  - ev:17
- id: obs:19
  text: If bread set before a person is not eaten, it must be stowed away, or the
    person will have toothache.
  category: action
  evidence_refs:
  - ev:18
- id: obs:20
  text: Handing bread to a pregnant woman on the point of a knife or fork is said
    to cause her child’s eyes to be pricked out.
  category: action
  evidence_refs:
  - ev:19
- id: obs:21
  text: Sewing or threading a needle on Ascension Day is said to cause the house to
    be struck by lightning.
  category: action
  evidence_refs:
  - ev:20
- id: obs:22
  text: Lightning is said to strike where a redstart builds, while a swallow’s nest
    is said to bring luck.
  category: relationship
  evidence_refs:
  - ev:21
- id: obs:23
  text: If children bring home the female of a stagbeetle, it must be removed immediately,
    or lightning will strike the house.
  category: action
  evidence_refs:
  - ev:22
- id: obs:24
  text: On Good Friday and Saturday, people are forbidden to work the ground for fear
    of disturbing the Saviour in the sepulchre.
  category: action
  evidence_refs:
  - ev:23
