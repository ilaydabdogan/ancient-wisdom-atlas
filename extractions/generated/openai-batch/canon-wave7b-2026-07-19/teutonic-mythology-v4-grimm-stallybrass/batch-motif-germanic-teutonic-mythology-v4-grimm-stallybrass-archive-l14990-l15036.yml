  summary: 'The passage collects comparative notes on poetic inspiration and related
    marvels: Odin’s spittle ferments beer; medieval stories tell of a child made from
    snow or ice; drinking the mead made from honey and Kvasir’s blood makes a skald;
    Odin obtains Óðhrœrir from Suttung and is pursued, compared with Wainamoinen winning
    the Sampo and being chased by Louhi in eagle shape; poetic gifts are also linked
    to Odin, bees, honey, nectar, the Muses, and divine breath.'
