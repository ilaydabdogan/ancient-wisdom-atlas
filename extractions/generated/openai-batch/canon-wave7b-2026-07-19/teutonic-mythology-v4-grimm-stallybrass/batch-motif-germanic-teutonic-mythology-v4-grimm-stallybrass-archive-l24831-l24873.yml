canonical_text:
  quote: boys shall see in a crystal things to come and all things
  summary: The passage describes condemned divinatory practices using a polished sword
    and, under Pyromancia, a crystal or similar stone. Ritual masters prepare purified
    conditions, use a child to gaze into the stone, interpret colored angelic apparitions,
    repeat prayers and offerings, and seek writing or letters from the apparition.
  language: English
  quote_policy: quoted
