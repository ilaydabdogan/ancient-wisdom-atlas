  - ev:2
- id: obs:2
  text: Masters use a beautiful bright polished sword for inquiries about wars and
    deadly matters; a sword that has killed many men is said to make spirits come
    sooner and quicker.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: For questions about pleasure, peace, arts, or digging up treasure, the sword
    is to be clean and maiden or unfleshed.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A great prince is said to be honored by receiving an old worn-out sword.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: In Pyromancia, boys are made to see future things and all things in a crystal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some practitioners keep an exceedingly clear polished crystal or parille consecrated
    and very clean, with frankincense, myrrh, and similar materials gathered for it.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The crystal rite is prepared for a very fine day or in a clean chamber with
    many consecrated candles.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: The masters bathe with the pure child, put on pure white raiment, sit down,
