    degrees of life, mortality, and feeling among stones, plants, animals, humans,
    and angels. It then lists examples in which birds, beasts, fishes, plants, and
    all created things join human lament, and in which flowers, grass, trees, and
    roses mourn, wither, laugh, or quarrel. It closes with brief references to flower
    rules, meanings, language, flower-games, and an incomplete start on tree-worship.
