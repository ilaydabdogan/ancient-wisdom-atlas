canonical_text:
  quote: ''
  summary: The passage gives two horse-healing charms. In the first, for a horse with
    worms in the guts and stomach, the practitioner is told to strike or push the
    horse with the left foot and speak a command that the worms find the horse's body,
    flesh, guts, and bones loathsome and die in the horse-flesh. In the second, for
    a horse with a vomiting worm, the practitioner commands the worm or worms to leave
    the horse's flesh, bones, and body, making their presence there painful, with
    a comparison to St Peter's distress at the Lord's Passion.
