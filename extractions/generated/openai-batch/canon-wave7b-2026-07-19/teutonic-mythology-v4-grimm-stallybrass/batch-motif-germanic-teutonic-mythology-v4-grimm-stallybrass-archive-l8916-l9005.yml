  summary: The passage opens with a brief historical note, then surveys customs and
    beliefs connected with rods, springs, water levels, whirlpools, waterfalls, rain,
    dew, and rainmaking. It records Easter rod-striking customs, springs drying or
    appearing as omens, water height as a harvest or flood predictor, named whirlpool
    and waterfall traditions, supernatural beings associated with vortices and waterfalls,
    rain deities and supplication for rain, personified dew and hoarfrost, and rain
    rituals involving dances, offerings, boughs, fountains, and wells.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Borussian Easter custom is described in which people are struck with rods
    on the fourth day after Easter; decorated Easter rods with many-coloured ribbons
    are also mentioned.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Norman stories say that springs run dry when misfortune is near.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Salt and medicinal springs are said to dry up when money is asked for them;
    another spring ceased to flow after a countryman drank from it and died; a newly
    breaking spring is said to signify dearth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rising or falling water in the Tilsgraben is used to foretell good or bad
    harvests.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A saying links Wartha flats remaining unflooded for six years with the farmer’s
    prosperity in the seventh year.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A beaver building its castle high is said to predict that the year’s water
    will also run high.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage lists Germanic, Greek, Serbian, and Finnish terms and examples
