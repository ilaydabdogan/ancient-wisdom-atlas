- id: motif:2
  label: Spring behavior as omen of misfortune or dearth
  taxonomy_refs: []
  basis: Springs dry when misfortune is near; springs dry when payment is requested;
    a spring ceases after a fatal drink; a new spring signifies dearth.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The examples are listed comparatively and do not form a single narrative
    episode.
- id: motif:3
  label: Water height as agricultural and prosperity omen
  taxonomy_refs:
