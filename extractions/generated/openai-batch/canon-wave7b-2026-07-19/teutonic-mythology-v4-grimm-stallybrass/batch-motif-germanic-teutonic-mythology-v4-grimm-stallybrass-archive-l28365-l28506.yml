canonical_text:
  quote: ''
  summary: A numbered list of folk superstitions and ritual prescriptions concerning
    death omens, household and animal magic, weather and crop prognostics, wedding
    fortune, childbirth, illness cures, fire protection, love magic, discovery of
    poisoners, and Christmas-eve life-or-death divination.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sudden shiver is interpreted as death running over the person's grave, and
    an altar-candle going out by itself is said to foretell the minister's death within
    a year.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Running in one boot or shoe is said to cause loss of balance unless the person
    goes back the same way; driving a nail into a horse's fresh footprint is said
    to make the horse lame.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Several signs and rites concern agriculture and weather: thrashing the garden
    on Christmas Eve, winter icicles predicting flax, straw in a room predicting snow,
    and Good Friday rain requiring scratching from the ground because it brings drought.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A godfather's letter opened over a child's mouth is said to make the child
    speak sooner; creatures found in gallnuts are used to predict war, bad crops,
    or pestilence; rods in a flax-bed protect cattle from bewitchment.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: Three unexplained knocks at night foretell a death in the house within three
    days, and a pall placed wrong-side out over a coffin foretells another death in
    the house.
  category: other
  evidence_refs:
  - ev:4
  - ev:7
- id: obs:6
  text: If a woman dies in childbed, her porringer must be washed out directly or
    she will return; a woman in childbed looking at a corpse is said to make her child
    lack colour.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:7
- id: obs:7
  text: Wedding fortune is linked to a coin under the right foot, snow or rain on
    the wedding day, and rain on the bridal wreath.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:8
- id: obs:8
  text: Stirring food or drink with a knife or fork is said to cause distinct pains,
    and placing a dying person on the board-joint of the floor is said to make death
    easier.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'Human remains are used as efficacious objects: a skull for attracting pigeons,
    a hanged man''s finger for selling beer, and the blood of a beheaded man for epilepsy.'
  category: object
  evidence_refs:
  - ev:6
  - ev:8
  - ev:10
- id: obs:10
  text: 'Animal signs and conditions are linked to fire: hens crowing announce a fire,
    a house with black cock, dog, and cat will not catch fire, and a house where the
    chain-dog burns to death will burn again.'
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: A butter tub is whipped with a willow rod when butter will not come; a maiden's
    hair and pin are thrown backward into a river to win her love; bought animals
    are twirled three times around the right leg to settle them in.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: Nettles under a sick man's bed serve as a prognosis, and a worn shirt must
    not be used as a shroud because the former wearer will waste away until the shirt
    rots.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Sweeping measured grain toward oneself brings blessing into the house, while
    sweeping it away sends blessing into the devil's hand.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: To identify someone who poisoned a beast, the animal's heart is cut out, pierced
    with thirty pins, and hung in the chimney so the doer is tormented into self-accusation.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Illness remedies include breathing ague into a hollow willow with silence
    and movement restrictions, walking over nine field-boundaries for fever, hunting
    a black cat until it lies dead, and drinking the blood of a beheaded man for epilepsy.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:16
  text: Before sunrise, young mayflowers are used against freckles and dewless patches
    in grass indicate where money may be found; salt on a Christmas-eve table indicates
    whether the person will live or die in the next year.
  category: other
  evidence_refs:
  - ev:9
  - ev:10
