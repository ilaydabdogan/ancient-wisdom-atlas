    be buried in a golden ship.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A funeral pile is built in a ship; ship-mounds are thrown up over the dead;
    the passage also cites a death-ship and a swan-ship carrying a corpse.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
