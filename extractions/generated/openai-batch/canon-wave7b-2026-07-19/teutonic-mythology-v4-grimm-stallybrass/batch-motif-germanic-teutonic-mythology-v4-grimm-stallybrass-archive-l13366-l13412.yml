  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Near places named Valhall there is often an Oden spring; the passage suggests
    that Oden might bathe souls in a clear stream before admitting them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says Greeks thought souls were cleansed in rivers of Hades and
    drank oblivion in Lethe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Oden is described as coming from a chamber or lake to choose the slain on
