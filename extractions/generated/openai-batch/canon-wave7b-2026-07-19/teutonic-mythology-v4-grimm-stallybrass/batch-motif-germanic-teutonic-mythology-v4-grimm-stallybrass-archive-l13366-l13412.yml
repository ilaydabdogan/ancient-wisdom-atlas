  text: The passage states that animals too have had many souls, with Lucian's cock
    named as an example.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Good souls are described as hovering on a verdant meadow of Hades, feeding
    on or looking upon a field or meadow of truth, and sitting down on green grass.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dying is expressed by the phrase that a person is just fluttering away; souls
    of the dead are also said to hang over a precipice by a slender stalk.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The soul is described as being sent up to the tip of the tongue, and many
    souls are said to be able to sit on a needle point or a nail.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Souls are said to be received or drawn on by Wuotan, Frouwa, Ran, Hel, watersprites,
