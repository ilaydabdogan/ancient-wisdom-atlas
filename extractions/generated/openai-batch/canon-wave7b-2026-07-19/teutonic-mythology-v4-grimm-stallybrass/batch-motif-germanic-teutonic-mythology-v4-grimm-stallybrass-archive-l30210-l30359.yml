canonical_text:
  quote: ''
  summary: 'A sequence of medieval Latin and German Christian charms and blessings:
    a charm for a sick horse, an adjuration against an affliction, a bloody-flux charm
    using Christ’s baptism and the Jordan’s stilling as precedent, journey blessings
    invoking angels, gates, saints, Mary, Michael, and God, and protective spells
    that arm the body against weapons and enemies.'
  language: English headings and notes with Latin and Old/Middle High German spell
    texts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A spell for a sick horse names Peter, Michael, and Stephen walking on a road
    and invokes God and Christ to sign the afflicted horse so that it may eat grass
    and drink water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A remedy against an affliction instructs the practitioner to circle the place
    with the little finger, speak words by God and Christ, and make a cross through
    the middle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same remedy adjures the affliction by the Father, Son, and Holy Spirit
    not to grow but to dry up.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A bloody-flux charm narrates that Christ was born at Bethlehem, came to Jerusalem,
    and was baptized by John in the Jordan.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bloody-flux charm says the Jordan’s flow stood still and asks the blood-flow
    to stand still through Christ’s love.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A journey blessing sends fifty-five angels with the speaker’s five fingers
    after the recipient and asks God to send the recipient home healthy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The journey blessing names opened and closed gates and places Saint Ulrich’s
    blessing before, behind, above, and beside the recipient.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: An Engelberg protection blessing asks Saint Michael to be the recipient’s
    shield and spear and Mary to be the recipient’s hauberk.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Engelberg blessing asks God to protect the recipient from water or flood,
    weapons, fire, and visible and invisible enemies.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: A self-blessing invokes the holy wood of the Lord to bless the speaker above
    and below and makes the belly bone, the heart steel, and the head stone.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Saint Severin, Saint Peter, and Saint Stephen are invoked to bless the speaker
    against enemies’ weapons, and sword or metal is asked to become soft on the speaker’s
    body like Mary’s sweat when she bore Christ.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: A Munich spell has the speaker sleep at the Lord’s feet, take the heavenly
    child as a peace-shield, rise in Christ’s name, gird with God’s words, and invoke
    the sun, moon, and day-star as gracious.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Munich spell makes Saint Mary’s garment the speaker’s peace-shirt, has
    enemies’ weapons lie and sleep, makes the speaker’s head steel, and exempts the
    speaker’s own sword so that it cuts on command.
  category: action
  evidence_refs:
  - ev:7
