canonical_text:
  quote: ''
  summary: 'The passage gathers comparative notes on European giant legends: granite
    blocks and cottages explained as objects dropped from a maiden’s apron or the
    devil’s sack; giants as former land-masters displaced by agricultural humans;
    oversized giant actions involving aprons, shoes, hammers, bowls, tobacco-pipes,
    stones, and cheeses; a Gargantua seat; captive, building, spinning, and combat
    motifs; and many examples of giants or human parties turned to stone, often by
    sunrise or in connection with bread-related offenses.'
  language: English, with cited Germanic and other vernacular terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Esthonian legend identifies blocks of granite as Tuihu's maiden's apron-stones.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A legend from Appenzel and the Black Forest says the devil flew over the country
    with a sackful of huts; the sack tore, and cottages fell out and remained where
    they landed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that eaters of flesh give place to sowers of corn, and
    hunters to husbandmen.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Giants are described as considering themselves the old masters of the land,
    living up in the castle, and looking down on the peasant.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In an Usedom story, a giant maiden packs a servant, two oxen, and a plough
    into her apron because she pities the small being.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports similar stories in which earth-worms crowd out giants
    across several cited regions.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Stories are cited in which a giant clears out his shoe or shakes sand from
    wooden shoes; another tale has the giant feel three grains in his shoe.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Near Duclair on the Seine, a landmark called the chair of Gargantua is said
    to have been occupied at night by a mysterious being understood as a giant.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Giants are said to fling hammers at each other, play bowls, bake bread, throw
    tobacco-pipes to each other, knock out ashes, and be pelted with stones or cheeses.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A captive giant is to be released only after pulling all the hair from a cowhide,
    but may pluck no more than one hair in one hundred years.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Building stories are cited in which a giant builder hurls a hammer, and a
    horse brings stones.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage says giantesses spin like fays, and that even giants spin.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: In the Olafssaga reference, Olaf fights the margygr and brings away her hand
    as a trophy.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Many Swedish tales are cited in which the first beam of sunrise turns giants
    into stone; king Watzmann is also said to be believed a petrified giant.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The passage cites cases where Frau Hütt, a bride and bridegroom, and a shepherd
    with his dog and sheep are turned into stone, and where people sink into the ground;
    several of these examples involve crumbs, a wheaten roll, or refusal of bread.
  category: sequence
  evidence_refs:
  - ev:11
