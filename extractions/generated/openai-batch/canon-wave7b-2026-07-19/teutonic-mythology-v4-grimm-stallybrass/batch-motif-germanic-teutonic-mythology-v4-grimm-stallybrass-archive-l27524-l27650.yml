canonical_text:
  quote: ''
  summary: A numbered catalogue of superstitions concerning unlucky times, speech
    over milk, witches, death omens, weddings, christening and postpartum taboos,
    funeral procedures, theft magic, farm protection, love and marriage divination,
    healing charms, wayfinding inversion, crossroads listening, and holy-eve fire
    embers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Undertakings begun on Monday, and plans laid during a meal, are said not to
    succeed.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: A woman who praises a churn as a fine vessel of milk is said to make it froth
    and yield little butter; a spoken answer is prescribed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:3
  text: Spinning in the open country is forbidden, and witches are called field-spinners.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A bleeding left nostril, rain before noon, and the hunter's gun position before
    reaching game are treated as signs affecting success or weather.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A corpse that sighs, remains limp, draws nearby cloths to its mouth, opens
    its eyes, or changes colour at bell-tolling is treated as an omen involving death
    or burial.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The dead are not to be called by name, lest they be raised up.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The kiss of two children who cannot yet talk and simultaneous horn-blowing
    by two watchmen are said to foretell death.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A stone rolling toward a wedding pair, reading tombstones, and two mourners
    falling in love are described as unlucky or harmful situations.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A thief is instructed to throw some of what he steals into water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At a fire, the person whose shoes catch and begin to burn is identified as
    the incendiary.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A farmer who has repeatedly lost a foal or calf buries it in the garden and
    plants a young willow in its mouth; the grown tree is left unpolled and is said
    to guard the farm.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Wedding customs include girls tearing a bachelor's cake, restrictions on betrothed
    pairs sitting with the newly married, and a prohibition on turning or reining
    in the horses during the wedding ride.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Christening and postpartum rules govern handling the chrism-cloth, passing
    a baby through a window rather than the door, buying something before entering
    a strange house, and not drawing water from a spring.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: A corpse is set down three times on the threshold; after removal, the gate
    is fastened, three heaps of salt are made, the chamber is swept, and broom, sweepings,
    and sometimes bed-straw are taken to the fields or burned there.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: Unbetrothed girls use a gander on the evening before Andrew's day and a nine-flower
    wreath on John's day to learn about future marriage.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: An undertaker's measure leaned against a house-door at night is said to let
    a robber enter without waking the people inside.
  category: object
  evidence_refs:
  - ev:13
- id: obs:17
  text: A cinquefoil root dug before sunrise on John's day is said to be useful and
    win favour; girls wear a wasp's nest to win men's love.
  category: object
  evidence_refs:
  - ev:13
- id: obs:18
  text: A strayed man turns his pockets inside out, or a strayed woman ties her apron
    the wrong way, to find the right road again.
  category: action
  evidence_refs:
  - ev:14
- id: obs:19
  text: For a child's cramps or spasms, one roof shingle is turned, or the wedding
    apron is laid under the child's head.
  category: action
  evidence_refs:
  - ev:14
- id: obs:20
  text: At Christmas or New Year between eleven and twelve, people listen at a cross-way,
    inside a window, or in green corn on Walpurgis-night to learn what concerns them
    in the coming year.
  category: setting
  evidence_refs:
  - ev:15
- id: obs:21
  text: If glowing embers from the fires of the three holy eves remain the next morning,
    abundance for the year is predicted.
  category: object
  evidence_refs:
  - ev:16
