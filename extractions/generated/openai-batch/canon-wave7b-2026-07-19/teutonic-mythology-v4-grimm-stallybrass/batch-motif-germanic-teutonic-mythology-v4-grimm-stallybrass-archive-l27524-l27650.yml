  locator: items 828-832; lines 27524-27650
  quote_or_summary: Corpse signs foretell a kindred death or longing for earth; the
    dead must not be called by name; pre-verbal children's kissing and two watchmen
    blowing together foretell death.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source metadata; concise summary used.
- id: ev:6
  type: summary
  locator: items 833-835; lines 27524-27650
  quote_or_summary: A stone rolling toward a wedding pair betokens evil; reading tombstones
    causes memory loss with a citation to Cicero, De Senectute 31; two mourners who
    first meet in mourning must not fall in love.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source metadata; concise summary used.
- id: ev:7
  type: summary
  locator: items 836-837; lines 27524-27650
  quote_or_summary: A thief must throw part of what he steals into water; at a fire,
    the person whose shoes burn is the incendiary.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source metadata; concise summary used.
- id: ev:8
  type: summary
  locator: item 838; lines 27524-27650
  quote_or_summary: A farmer buries a lost foal or calf in the garden, plants a young
    willow in its mouth, and leaves the grown tree uncut to guard the farm against
    similar future cases.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source metadata; concise summary used.
- id: ev:9
  type: summary
  locator: items 839-841; lines 27524-27650
  quote_or_summary: At weddings, girls tear a bachelor's cake to predict who gets
    a husband first; betrothed pairs are kept from the newly married pair's table;
    the wedding driver must not turn or rein the horses lest the marriage be childless.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source metadata; concise summary used.
- id: ev:10
  type: summary
  locator: items 842-845; lines 27524-27650
  quote_or_summary: Christening sponsors must not hold the chrism-cloth by the corners;
    bereaved parents pass a baby through a window for christening; a postpartum woman
    must buy something before entering a strange house and may not draw spring water,
    or the spring will dry for seven years.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source metadata; concise summary used.
- id: ev:11
  type: summary
  locator: item 846; lines 27524-27650
  quote_or_summary: A corpse is set down three times on the threshold; after it leaves,
    the gate is fastened, three salt heaps are made in the death-chamber, the chamber
    is swept, and broom, sweepings, and sometimes bed-straw are removed to the fields
    or burned.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source metadata; concise summary used.
- id: ev:12
  type: summary
  locator: items 847-848; lines 27524-27650
  quote_or_summary: On Andrew's eve unbetrothed girls form a circle and read a gander's
    first turn; on John's day they gather nine flowers, make a wreath with thread
    spun that hour, and throw it backward into a tree in silence to count years before
    marriage.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source metadata; concise summary used.
- id: ev:13
  type: summary
  locator: items 849-851; lines 27524-27650
  quote_or_summary: An undertaker's measure placed at a house-door at night permits
    robbery without waking the inhabitants; a cinquefoil root dug before sunrise on
    John's day wins favour; girls wear a wasp's nest to win men's love.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source metadata; concise summary used.
- id: ev:14
  type: summary
  locator: items 852-853; lines 27524-27650
  quote_or_summary: A strayed man turns pockets inside out or a woman ties her apron
    the wrong way to find the road; a child's cramps are treated by turning a roof
    shingle or putting the wedding apron under the child's head.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source metadata; concise summary used.
- id: ev:15
  type: summary
  locator: item 854; lines 27524-27650
  quote_or_summary: At Christmas or New Year between eleven and twelve, or on Walpurgis-night,
    people listen at a cross-way, window, or green corn to learn what concerns them
    in the coming year.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source metadata; concise summary used.
- id: ev:16
  type: summary
  locator: item 855; lines 27524-27650
  quote_or_summary: If glowing embers from the fires of the three holy eves remain
    the next morning, the person will want for nothing that year.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source metadata; concise summary used.
