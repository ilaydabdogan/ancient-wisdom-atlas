canonical_text:
  quote: ''
  summary: 'The Latin passage condemns several practices as superstition or idolatry:
    astrologers claiming to make constellation-images that summon demons; an old woman
    and others honoring the sun or new moon; omens of fertility, fortune, and misfortune;
    ritual cross-dressing connected with Mars and Venus; signs, characters, and astral
    observations; and beliefs about demonic changelings and night-appearing old women
    who seize children.'
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports that some astrologers say they can make images under a
    fixed constellation and thereby compel demons to come, perform marvels, and give
    answers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that demons are not compelled but come in order to lead
    people into the error of believing that there is a divine power in the heavens.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A named example is an old woman who believed the Sun to be a goddess and called
    it a holy lady.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The same old woman is said to have addressed the sun, blessed by it using
    fixed words and a superstitious observance, and claimed belief and cures for more
    than forty years.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says that some laypeople, clerics, learned people, and unlearned
    people honor the first sight of the new moon by kneeling, removing head-coverings,
    bowing, speaking to it, receiving it, and sometimes fasting on its day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage connects lunar honor with Jeremiah’s report of cakes made for
    the queen of heaven, glossed here as the moon.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage says that keeping a bird’s nest with eggs or chicks together with
    the incubating mother was interpreted as producing fertility and fortune, and
    the opposite as misfortune and sterility.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage says old women describe finding a needle or a preserved coin as
    a sign of great fortune.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage cites a prohibition on men using women’s clothing and women using
    men’s clothing, then says women wore men’s clothing and arms in veneration of
    Mars, while men wore women’s clothing in veneration of Venus.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage says similar conduct occurs among Christians at carnival time,
    when men and women serve the god of the belly and the goddess Venus.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage mentions marks, figures, and objects called brevia kept in books,
    papers, metals, and other things, and labels them contrary to Christian religion.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: The passage lists observations of dreams, auguries, constellations, sneezes,
    meetings, days, hours, marks, characters, images, and astral impressions, and
    says the fraud of the ancient serpent is mixed into them.
  category: other
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage reports a common saying that children of incubus demons are substituted
    for women’s own children after those children are taken away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: The substituted beings are called cambiones, cambiti, or mutuati, and are
    described as thin, always wailing, and so greedy for milk that no abundance is
    sufficient for one.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:15
  text: The passage says these children vanish after dwelling on earth and concludes
    that they are not generated by demons but are themselves demons.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: The passage says demons can appear in the form of old women, called fatue
    in the vernacular, who appear at night, seize children from cradles, lick little
    ones, and roast them with fire.
  category: action
  evidence_refs:
  - ev:7
