canonical_text:
  quote: ''
  summary: 'A comparative note on creation traditions: primordial giants, Ymir, body-part
    births, cosmic egg creation, Ash and Embla, creation of humans from wood, clay,
    earth, water, or body parts, world-forming animals, and body-to-cosmos correspondences
    such as Atlas becoming a mountain-chain.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports a comparison of Ymir with Persian Gajomars, mentions birth
    from feet or legs, gives an Old French example in which Fannel's thigh conceives
    and bears St. Anne, and cites Ukko making three maidens after rubbing his hands
    and pressing them on his left knee.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Giants are said to come before the Ases, and Saxo is summarized as dividing
    beings into giants, magi or Ases, and humans.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Indians say the cow is mother of the world, and that
    Bur's three sons create man and raise the globes of heaven.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: An Indian myth is said to accept creation out of an egg, with heaven and earth
    as eggshells, and the passage compares this with the births of Helen and the Dioscuri
    from eggs.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ash and Embla are compared with Es and Imlia among the Yenisei Ostiaks, and
    the division into spirit, soul, and body is compared with Plutarch.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: To giants, men appear as dwarfs; the passage also compares dwarfs made from
    maggots, men from ants, animals produced by rubbing materials, and Hiisi making
    an egg from various stuffs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Different accounts derive blood from fire or water, while the Edda is said
    to derive water from blood; the passage also compares the head to sky and eyes
    to heavenly lights or stars.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage discusses tears, salt, and sea-water, including the Eddic explanation
    of sea-water's taste through salt ground from the quern Grotti.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: An Estonian song is said to describe a man shaping a wife from wood, while
    Egyptian Ptah or Neph is described as turning clay for human creation.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A Persian doctrine lists heaven and fire, mountains, plants, and beasts in
    creation order; it also says fruits sprang from the first ox's horns and grapes
    from its blood.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Ovid's Atlas is described as converted into a mountain-chain, with hair as
    forest, shoulders and arms as hills, head as summit, and bones as stones.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage reports Indian, Promethean, Horatian, Greenlander, Biblical, and
    Brahma-related examples of first humans or beings made from water, earth and water,
    clay-like matter, a thumb, a rib, or a toe.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage notes linguistic analogies between humans and trees, connects
    masculine tree names with men and feminine tree names with women, and states that
    plants and rocks are not dead because they speak.
  category: relationship
  evidence_refs:
  - ev:11
