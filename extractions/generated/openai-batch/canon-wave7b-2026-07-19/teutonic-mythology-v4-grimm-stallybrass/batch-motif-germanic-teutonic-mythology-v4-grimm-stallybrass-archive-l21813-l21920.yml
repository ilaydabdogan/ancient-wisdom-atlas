canonical_text:
  quote: ''
  summary: The passage surveys Anglo-Saxon genealogical traditions. It discusses Gevis
    as an eponymous hero and sovereign of the Gewissae, the Lindesfaran as an island-settled
    race with a genealogy from Woden, and several accounts of Woden’s ancestry. The
    author distinguishes heathen ancestors from names added after biblical genealogy
    became known, notes that some pedigrees stop at Fridhuwulf, Geat, or Sceaf, and
    compares variants from the Chronicle, Nennius, ASSGP, Ethelwerd, Florence, Simeon
    of Durham, and William of Malmesbury. Geat/Geta/Geata is reported in some sources
    as a son of a god or as formerly venerated by pagans as a god.
  language: English with Latin source excerpts and Old English/Latin names
  quote_policy: summarized
