  quote: ''
  summary: A numbered list of superstitions describes bridal bread and brandy handling,
    a postpartum churchgoing custom involving a caudle pot, a cat or hare revealed
    as an old woman by thrown steel, a death omen following the killing of black cattle,
    and a bridal doorway spell with a bridegroom's counter-formula.
  language: English
