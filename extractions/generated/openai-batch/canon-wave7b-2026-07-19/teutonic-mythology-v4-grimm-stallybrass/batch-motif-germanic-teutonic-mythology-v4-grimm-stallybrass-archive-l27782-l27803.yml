- id: obs:1
  text: The bride's father cuts a piece from the top crust of a well-baked loaf and
    gives it to the bride with a glass of brandy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bride takes the crust with her lips rather than her hand, wraps it in
    cloth, keeps it in a box, and throws the brandy over her head onto the ground.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a woman first goes to church after confinement, the pot from which she
    ate caudle during six weeks is thrown on the floor after her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a suspicious-looking cat or hare crosses one's path, throwing a steel over
    its head causes it to stand before the person in the shape of an old woman.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A person who kills a black cow and a black ox may expect a death in his house.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the bride is first to take hold of the house door after returning from
