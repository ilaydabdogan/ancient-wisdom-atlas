canonical_text:
  quote: ''
  summary: 'The passage is a philological and folkloric catalogue of herbs and plant
    names with attributed powers: Midsummer flowers placed under a pillow for dreams;
    plants sacred to elves or useful in childbirth; mosses and lunaria linked to cattle
    milk; plantain and way-side herbs used for eyesight, wound protection, and legal
    success; leeks used in riddles, divination, spirit-aversion, and misfortune-aversion;
    rowan planted in holy places; wreath herbs for love-sickness; and several marvelous
    herbs granting understanding of animal speech, knowledge of others'' thoughts,
    altered sight, command over spirits, hardening gold, or protecting cattle from
    being led into mountains.'
  language: English with cited German, Latin, Old Norse, Finnish, and Slavic terms
  quote_policy: summarized
