canonical_text:
  quote: ''
  summary: 'The passage excerpts ecclesiastical and penitential condemnations of practices
    labelled pagan or diabolical: New Year observances, funeral songs and dances,
    celestial veneration, ritual placement of children for fever, divination from
    roofs, crossroads, hides, and loaves, weaving incantations, offerings or prayers
    at fountains, stones, trees, shrines, graves, and crossroads, weather magic, belief
    in night-riding with a female troop called Holda or unholda, phylacteries, herbs,
    amber, Thursday/Jove observance, and stone heaps or bindings at crossroads crosses.'
  language: Latin with English editorial notes
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman placing her son or daughter on a roof or on an oven/furnace for the
    health or cure of fever is listed as a penitential offense.
  category: action
  evidence_refs:
  - ev:1
  - ev:11
- id: obs:2
  text: Decorating houses with laurel or green tree-branches is described as an unlawful
    calendar observance and as a pagan practice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The January calends are described as a time when some prepared tables with
    stones or foods, led singers and choruses through streets, sat on a roof encircled
    with a sword, sat at a crossroads on a bull hide, or baked loaves to infer prosperity.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:7
- id: obs:4
  text: Night sacrifices to demons, incantations inviting demons, and funeral watches
    with diabolical songs, games, and dances are prohibited or assigned penance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says traditions of pagans were handed down from fathers to sons
    and included honoring the moon, sun, course of stars, new moon, or lunar eclipse.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The text describes attempts to restore the moon's brightness during an eclipse
    by cries or aid, and observance of the new moon for house-building or marriage.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Women are described as using incantations at the start of weaving so warp
    and weft threads would be joined, with counter-incantations imagined as necessary
    if the work failed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: The passage lists prayer or veneration at fountains, stones, trees, or shrines,
    including lighting candles or torches, bringing bread or offerings, eating there,
    or seeking bodily or spiritual health.
  category: action
  evidence_refs:
  - ev:9
- id: obs:9
  text: Incantation specialists and persons claiming to send storms are said to be
    believed capable of raising storms or changing human minds by demonic incantation.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:10
  text: Some women are described as claiming they must ride on certain nights on beasts
    with a troop of demons transformed into the likeness of women, which common speech
    calls Holda or unholda.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The making of diabolical phylacteries or characters, use of herbs or amber,
    and honoring Thursday in honor of Jove are listed among condemned practices.
  category: object
  evidence_refs:
  - ev:12
- id: obs:12
  text: Eating offerings made at graves, fountains, trees, stones, or crossroads,
