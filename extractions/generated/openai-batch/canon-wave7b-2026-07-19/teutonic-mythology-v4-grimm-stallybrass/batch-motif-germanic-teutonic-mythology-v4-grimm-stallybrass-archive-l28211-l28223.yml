  text: If a person rises from the spinning-wheel without twisting off the strap,
    the earth-inannikin comes and spins at it; the being is not seen, but the spindle
    is heard humming.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A beggar who would fully repay bread given to him would need to say as many
