canonical_text:
  quote: ''
  summary: Four numbered superstitions state that an unseen earth-inannikin spins
    at an unsecured spinning-wheel; a beggar cannot fully repay bread by paternosters
    and instead says a blessing; slamming a door hurts a spirit sitting between; and
    the first child christened at a newly consecrated font receives the ability to
    see spirits and future things until a curious person performs a left-foot/right-shoulder
    act, after which the gift passes.
  language: English
  quote_policy: summarized
