canonical_text:
  quote: ''
  summary: 'The passage compiles comparative notes on sacred, sacrificial, prophetic,
    miraculous, and supernatural animals: horses, horse heads, oxen, cows, bulls,
    boars, goats, dogs, bears, deer, cats, beavers, birds, and animal-associated deities
    or spirits. It includes examples of animals producing gold or water, walking on
    water, serving in sacrifice, fighting dragons, giving youth-preserving milk, foretelling
    disaster, seeing spirits, being worshipped, taking divine or angelic form, and
    crossing between earthly and heavenly realms.'
