canonical_text:
  quote: ''
  summary: A secondary comparative note under the heading of magic lists examples
    of human and witch transformations into wolves, bears, foxes, hares, cats, horses,
    birds, and toads; it also records animal skins, a wood slip, bodily marks, wounds,
    and transformed limbs as signs or mechanisms of transformation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People with a wolf-girdle are identified by the term ulf-heffnar, and the
    passage also cites wolfskin or wolf-garment references.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Putting a slip of wood in the mouth makes a person become a she-bear, and
    taking it out makes the person human again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dashing grass against the stem of a tree causes wolves to spring out of it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The gods send Idun a wolfskin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: A were-wolf may be recognized by a small wolf-tail mark between the shoulder-blades
    or growing from the back between the shoulders.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:6
  text: The witch appears as a fox, a three-legged hare, and a coal-black hood; cats
    are also mentioned in connection with dancing and an omen for a girl's wedding-day.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: In one witch story, a cat's paw is chopped off, it turns into a female hand,
    and the miller next morning finds the hand missing from his wife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In another witch story, a witch is ridden as a horse, taken to be shod, and
    in the morning lies in bed with horseshoes on her hands and feet.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: A were-wolf wounded in the neck is later matched by a soldier found in bed
    with his neck being treated.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The ofreskr sees a bull and a bear fighting in the evening; the next day two
    men lie wounded in bed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says transformations into bear, fox, swan, or raven are frequent,
    and also mentions a bride turning into a swan, a man becoming a hawk or falcon
    and flying to a tower, and women changing into toads.
  category: action
  evidence_refs:
  - ev:6
