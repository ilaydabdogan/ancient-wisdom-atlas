canonical_text:
  quote: ''
  summary: 'Scholarly notes on Germanic goddesses and related figures: Freya and Frigg
    are discussed etymologically and comparatively; Freya''s relations with Odr, Freyr,
    Gerdr, Odin, her hall, by-name, and sacred cat are noted; jewelry and Fulla''s
    gold headband are discussed; Sol, Skadi, Gerdr, Nanna, Gefjon, and Ran receive
    genealogical or functional notes; Ran is associated with a net, Loki, Andvari,
    watersprites, and the sea-dead.'
  language: English with Old Norse, German, and other cited terms
  quote_policy: summarized
