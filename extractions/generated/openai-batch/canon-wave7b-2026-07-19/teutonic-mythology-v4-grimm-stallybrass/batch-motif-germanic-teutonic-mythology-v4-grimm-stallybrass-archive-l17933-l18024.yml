canonical_text:
  quote: ''
  summary: 'The passage catalogues bird and animal superstitions: flight, over-flight,
    side of appearance, cries, perching, and first sight are treated as signs of luck,
    misfortune, blessing, parting, love, rain, or comfort. Examples include Kalmuk,
    classical Greek and Roman, Norse/Germanic, Arabic, Lettish, and other cited traditions.'
  language: English with multilingual cited terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kalmuks are said to examine the flight of the mouse-hawk carefully.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists herons, woodpeckers, eagles, ravens, and crows as birds
    appearing in cited augural or significant contexts, including one-eyed herons
    described as excellent augury.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A folk-song example describes a bird on a fir standing on one foot with a
    written greeting from the speaker's girl.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The chataka is described as drinking only rain by catching drops while flying;
    it brings luck when it flies on the left, while most birds are said to signify
    good on the right.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Greek pecker or woodpecker appearing on the right is associated with lovers,
    and an odd number of woodpeckers is given as a sign of misfortune.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: For heathen Arabs before Mahomet, seeing a raven after setting out makes one
    turn back; a pair of ravens crossing the path in equal flight is lucky; a croaking
    raven is called the bird of parting; and another bird's cry from the right brings
    blessing to a house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A song describes two snow-white doves flying overhead and then says the speaker's
    girl has deceived him again; the passage also says pigeons fan a king while he
    dines.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: An eagle in a narrative is said to be sent by God for comfort and fans or
    shades a man with its wings; another eagle shades Marcian while he sleeps.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A peacock's tail is described as a shading article worn by ladies, with related
    mentions of a peacock fan and peacock hats.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: The jay is said to have cried a spell over people in the wood; a sible singing
    on the right brings luck; the first sight of the wagtail is significant, and to
    Kalmuks the sight of the snake is also significant.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
