  quote: ''
  summary: The passage contains Latin ecclesiastical admonitions against honoring
    a tree, drunkenness, omen-watching, and phylacteries; it commands Sunday church
    attendance. It then gives an Indiculus listing superstitions and pagan practices,
    including rites at graves, over the dead, in groves, on stones, at fountains,
    through incantation or augury, and by friction fire called nodfyr.
