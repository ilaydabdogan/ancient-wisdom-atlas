canonical_text:
  quote: ''
  summary: 'The passage collects comparative notes on wind, storm, and air: named
    divine or supernatural figures are linked with storms; winds are personified as
    female figures, giants, men, dogs, or beings with kin; Aeolus is described as
    keeper of winds in a mountain; eagle, wing, and root imagery is associated with
    wind and storm clouds; and several ritual actions are described for feeding, averting,
    calming, or sacrificing to winds.'
  language: English with cited German, Greek, Latin, French, Finnish/Swedish, and
    other comparative terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage connects Zio, Indras with the Maruts, Wuotan, Hodeke, and Frau
    Fink or Frick with winds, storm, or howling weather.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Indras, with Maruts or storm spirits, is described as making war on giants
    of darkness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wuotan, identified as god of the Wild Hunt, is said to sweep like the storm
    through open doors.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A local whirlwind is called mueml or aunty, or schratl, and the hurricane
    is described as having hands.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: A wind named Vorwitz flies in, is known by maidens and women, and unlooses
    maidens' bands.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage mentions a storm-giant Hraesvelg, a great and little wind-man,
    and sayings in which God moves or flies the wind.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Aeolus is described as keeper of the winds; Virgil's Aeolus sits in a hollow
    mountain, and Juno asks wind from him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Eagles, especially golden eagles, are placed on gables, tent tops, castle
    tops, or roofs; a cited song asks a bird to turn its head and shut its sharp eyes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage notes associations between eagle, gable, wing, south wind, and
    the image of winds waving wings.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Thunder-clouds are likened to the wide-spreading root of a tree and called
    wind-root, as a sign of hurricane.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The wind is fed with rags or tow, and in Austria meal is offered from an attic
    window with a formula asking the wind to take it to wife and child and not return.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Instead of feeding the wind, a woman says she would rather stab the dog dead
    and throws a knife into the yard; the passage then notes that winds were thought
    of as meal-devouring dogs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: In a sea-storm, a dove appears, flies three times around the ship, and three
    tail feathers dipped in the sea calm the tempest.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Greek OveXKa is said to snatch away, like the Norwegian northwind.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Black lambs are sacrificed to hurtful winds and white lambs to fair winds.
  category: action
  evidence_refs:
