canonical_text:
  quote: ''
  summary: The passage collects comparative folklore and philological notes on wights,
    elves, dwarfs, huldrefolk, and related beings. It describes them as dwelling in
    hills, mountains, holes, grave-mounds, cairns, underground rooms, and under human
    buildings; as sometimes disturbed by human construction; as exchanging food, labor,
    gifts, and services with humans; as associated with hidden gardens, weddings,
    treasures, dream interpretation, vulnerability to human tricks, mixed weakness
    and strength, freedom from sickness, and longevity.
  language: English
  quote_policy: summarized
