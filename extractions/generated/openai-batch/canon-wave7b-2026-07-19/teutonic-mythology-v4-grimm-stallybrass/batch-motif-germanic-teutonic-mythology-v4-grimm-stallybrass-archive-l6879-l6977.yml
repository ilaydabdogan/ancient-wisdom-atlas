candidate_motifs:
- id: motif:1
  label: Subterranean and hill-dwelling hidden folk
  taxonomy_refs: []
  basis: Multiple examples locate dwarfs, elves, wights, little folk, huldrefolk,
    and related beings in hills, mountains, grave-mounds, cairns, underground rooms,
    and under human buildings.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage is a comparative compilation rather than a single narrative
    episode.
- id: motif:2
  label: Hidden folk disturbed by human construction
  taxonomy_refs: []
  basis: The beings cannot endure stables built over their homes because muck would
    sink through and defile them.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives the reason briefly and does not narrate a full conflict
    resolution.
- id: motif:3
  label: Reciprocal exchange between humans and hidden folk
  taxonomy_refs:
  - sacred_exchange
  basis: Hidden beings give cake, bread, food, drink, presents, and domestic help,
    while humans comply with requests or provide dwellings, apparatus, and labor contexts
    used by the beings.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The taxonomy label is interpretive; the passage itself describes practical
    exchange more than formal ritual exchange.
- id: motif:4
  label: Seasonal occupation of human spaces by fairy beings
  taxonomy_refs:
  - seasonal_cycle
  basis: Courriquets sleep on the hearth in winter, and related beings move into men’s
    summer huts during winter.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: medium
  cautions: Only brief seasonal details are supplied.
- id: motif:5
  label: Punished flower-picking in an underground garden
  taxonomy_refs: []
  basis: Elves inhabit a Rosegarden inside the earth where flower-picking is punished.
  evidence_refs:
