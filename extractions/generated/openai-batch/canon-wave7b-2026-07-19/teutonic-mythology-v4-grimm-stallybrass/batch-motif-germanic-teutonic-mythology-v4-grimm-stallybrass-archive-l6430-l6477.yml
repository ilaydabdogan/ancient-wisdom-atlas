  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Weaving naiads and fountain-nymphs, daughters of Zeus, are said to be worshipped;
    part of a sacrifice is laid aside for them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Proteus and Vertumnus are cited as examples of reluctance.
  category: attribute
  evidence_refs:
