  summary: A supplementary note gathers examples of wise women, forest and cave women,
    nymphs, merwomen, and vilas. It mentions offerings to woodland or nymph-like beings,
    prophetic and cursing merwomen, reluctant classical figures, and vila associations
    with clouds, lightning, thunder, trees, rocks, healing, night-dances, and storm-making.
