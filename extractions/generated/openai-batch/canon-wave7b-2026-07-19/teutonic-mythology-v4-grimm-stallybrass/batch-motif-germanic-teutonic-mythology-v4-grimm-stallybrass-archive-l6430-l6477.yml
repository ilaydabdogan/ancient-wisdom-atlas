  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The vila builds a castle in the clouds; her daughter Munya is identified with
    lightning and plays with her brothers, the two Thunders.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The vila sits in ash-trees and on rocks, sings songs, talks with a stag in
    the forest, bestows gifts, and acts as a physician.
