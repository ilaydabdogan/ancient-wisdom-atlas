  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The vila is also said to resemble the devil, hold a night-dance on a hill,
    teach pupils to lead clouds and make storms, detain the last man, and be like
    the white ladies.
  category: action
  evidence_refs:
  - ev:8
