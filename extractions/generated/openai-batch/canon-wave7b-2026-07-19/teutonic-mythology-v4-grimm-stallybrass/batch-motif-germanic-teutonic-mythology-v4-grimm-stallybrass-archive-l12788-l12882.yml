canonical_text:
  quote: ''
  summary: The passage collects comparative notes on a Paradise-tree legend involving
    Seth, a spring, four rivers, a withered tree, a coiled serpent, roots reaching
    hell, and a newborn child in the tree crown; it then compares elements of this
    legend with Eddic motifs. It also notes fables of a mouse gnawing a root or stalk
    over an abyss, and surveys underworld names, routes, gates, waters, descents,
    and hell imagery across Greek, Hebrew, Norse, German, and Christian materials.
  language: English
  quote_policy: summarized
