  quote: ''
  summary: A numbered list of superstitions states that bell sounds foretell death
    or a wedding; bridal weather is linked to crying or laughing; counting churn hoops
    prevents butter from coming; looking over one's fingers or hand is bad; and a
    baby's first food of red baked apple gives red cheeks.
