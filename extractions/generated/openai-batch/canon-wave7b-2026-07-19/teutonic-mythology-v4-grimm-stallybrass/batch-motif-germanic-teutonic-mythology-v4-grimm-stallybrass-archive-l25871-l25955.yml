    context.
- id: motif:2
  label: Animal behavior as human omen
  taxonomy_refs: []
  basis: A cat's grooming gaze foretells a scolding, cat fondness predicts a husband's
    temperament, and crickets singing in a house mark luck.
  evidence_refs:
  - ev:2
  - ev:15
  confidence: high
  cautions: The animals are omen-bearers in short superstition entries, not figures
    in a mythic narrative.
- id: motif:3
  label: Pregnancy or postpartum contact taboo
  taxonomy_refs: []
  basis: A pregnant woman crossing a grave endangers the child, and a woman in the
    six weeks fetching spring-water dries the spring.
  evidence_refs:
  - ev:3
  - ev:12
  confidence: high
  cautions: The reproductive-state taboo is clear, but the passage does not explain
    its cause.
- id: motif:4
  label: Legal victory by first sight or concealed object
  taxonomy_refs: []
  basis: Winning a lawsuit is linked to seeing the opponent first and to pocketing
    a bare knife in court.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The two rules are adjacent but not explicitly said to share one mechanism.
- id: motif:5
  label: Silent acquisition of birth-straw as sleep charm
  taxonomy_refs: []
  basis: Sleeplessness is treated by placing under the pillow straw associated with
    breeding women, obtained without speaking.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage defines the object but does not describe an origin story.
- id: motif:6
  label: Human pity obstructs animal death
  taxonomy_refs: []
  basis: The passage says cattle being killed cannot die if they are pitied.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is a brief conditional belief and does not identify a supernatural
    agent.
- id: motif:7
  label: Meal-object orientation controls access or luck
  taxonomy_refs: []
  basis: Bread, an open jug, and an overturned plate are each treated as consequential
    at meals; the overturned plate lets witches share.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: Only the plate rule explicitly names witches; the bread and jug rules
