  quote: ''
  summary: A numbered list of folk superstitions gives conditional rules and omens
    concerning children, cats, marriage, pregnancy, lawsuits, sleep charms, slaughtered
    cattle, bread, ghosts, saint-day agricultural taboos, witches, illness, household
    luck, wedding injuries, moonlight, weather floods, and nail parings. The final
    numbered item is incomplete in the supplied passage.
  language: English
  quote_policy: summarized
