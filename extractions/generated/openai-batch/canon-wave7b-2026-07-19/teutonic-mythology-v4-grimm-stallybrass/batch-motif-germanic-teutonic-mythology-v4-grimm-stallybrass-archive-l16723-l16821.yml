  quote: ''
  summary: 'A philological and comparative note on magic terms and magical practitioners:
    learning black art at schools or through lineage; divination by lots, seats, knives,
    or swords; magic attributed especially to old women, priestesses, prophetesses,
    witches, and sorceresses; Norse seiðr and spell-chanting on a platform; and comparisons
    involving striga, owls, masks, and apotropaic hawthorn.'
  language: English with Germanic, Latin, Old Norse, and other philological citations
  quote_policy: summarized
