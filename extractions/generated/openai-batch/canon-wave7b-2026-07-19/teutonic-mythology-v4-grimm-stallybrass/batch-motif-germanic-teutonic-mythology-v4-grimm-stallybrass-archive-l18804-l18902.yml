canonical_text:
  quote: ''
  summary: A comparative antiquarian note on sickness terminology and folk-medical
    beliefs. It includes terms for dropsy, abortion, birth, leprosy, skin diseases,
    scurvy, and related ailments; a ritual treatment for a newborn's heart-disease
    by passing the child three times through ladder rungs; accounts of heart-worms
    and other internal worms that grow with a fetus, climb to the heart, or inhabit
    stomach and head; and brief notes that headache can be caused by black elves and
    that Tana-weschel is personified.
  language: English with cited Germanic, Latin, French, and other terms
  quote_policy: summarized
