  quote: Weal and luck are all but personified... There is a white fortune and a black,
    a bright and a dark.
  summary: The passage collects Germanic and comparative expressions for destiny as
    an allotted necessity that cannot be escaped; for luck, weal, Heil, Glück, and
    Saelde as quasi-personified forces that help, precede, greet, curse, or wake;
    and for fortune as bright/dark or white/black. It also reports lexical parallels
    with Greek and Latin terms and notes a scholarly interpretation linking bright/dark
    fortune to the moon and wheel of fortune.
