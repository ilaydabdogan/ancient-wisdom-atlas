  quote: ''
  summary: Comparative notes on giants describe their colors, stone-like body parts,
    giantesses, arrogance, mountain/dumbness word clusters, ancient names, wisdom
    taught by old giants, renowned good faith, herding roles, lack of bread or fire,
    possession of precious metals, horse gear, and their capacity to bring misfortune
    or bestow luck and fruitfulness.
  language: English with Old Norse, Old English, Latin, Greek, and Finnish references
