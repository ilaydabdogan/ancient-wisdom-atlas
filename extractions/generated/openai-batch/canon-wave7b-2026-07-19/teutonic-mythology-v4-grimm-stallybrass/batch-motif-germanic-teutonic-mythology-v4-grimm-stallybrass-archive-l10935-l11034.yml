  summary: The passage is a comparative philological note on stars, sun, and moon.
    It records star names and images such as strewn lights, tongues, tips, lamps,
    chairs, and celestial children. It gathers descriptions of the sun as world-light,
    divine sign, wheel, spindle, shield, eye, gem, and candle; it cites an Old Norse
    shield named Svalr standing before the sun, whose fall would burn mountains and
    sea. It also notes gendered and kinship relations between sun and moon, including
    sister-brother and lord-lady pairings.
  language: English, with cited terms and phrases in Old English, Old Norse, German,
    Latin, Sanskrit, Greek, Lettish, Finnish, and other languages
  quote_policy: summarized
