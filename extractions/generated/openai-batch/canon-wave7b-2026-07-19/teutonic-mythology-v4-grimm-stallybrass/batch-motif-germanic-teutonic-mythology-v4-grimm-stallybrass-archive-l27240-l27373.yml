canonical_text:
  quote: ''
  summary: A numbered list of folk superstitions and ritual prescriptions concerning
    childbirth, baptismal and churching protections, infant feeding and weaning, cattle
    and dairy magic, poultry, marriage omens, healing practices, and calendrical household
    divination.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After childbirth, the mother is instructed to take three bites of onion, be
    lifted and set down three times in the stool, draw in her thumbs, and blow three
    times; during six weeks she must not spin because the Blessed Virgin did not.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Several first-bath or birth objects are assigned predicted effects for the
    child: fur for curly hair, three pennies for money, a pen for learning, a rosary
    for piety, and an egg for a clear voice; the pennies and egg are to be given to
    the first beggar.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first cow that calves is to be milked into a brand-new pot with three
    pennies, and the pennies, milk, and pot are to be given to the first beggar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Infant-related practices include choosing the jug size for a little girl's
    bath, emptying bath water under a green tree, having the godfather buy the child's
    crying with a coin, putting three keys in the cradle, and giving a feast to birds
    or a black dog if the child will not eat.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage links a baby sleeping through a thunderstorm with safety from
    lightning, and prescribes wrapping the child in a fumigated tablecloth with crumbs,
    covering the child with the father's garment when the mother leaves, and using
    churching-day actions involving a broom, a taper, and bread in the cradle.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before suckling, the mother is told to wipe her breasts three times; at the
    child's first outing a garment is to be put on inside out; when the first tooth
    is seen, the child's ear is to be boxed so the remaining teeth come easily.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: For the first spring drive to pasture, an axe and fire-steel wrapped in a
    blue apron are placed inside the stable threshold for cows to step over; salt
    is sprinkled between the cows' horns, and the person leaves the stable backwards
    to avoid evil eyes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Dairy and cattle entries mention a blind dog buried alive at the stable door,
    spitting three times when driving a cow past a witch's house, waning-moon cattle
    being poor breeders, swallows' nests affecting cows' milk, a witch counting churn
    hoops preventing butter, and three grains of salt protecting milk from witches.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Poultry entries prescribe feeding hens mixed fruit at noon on New Year's Day
    to make them lay, and setting a hen to hatch as pigs come in while matching the
    carrier's pace to the pigs.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Marriage omens state that whichever spouse loses the wedding ring first will
    die first, and that a wedding should be held at full moon for the marriage to
    be blessed.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Child and postpartum healing entries mention restrictions on the first warm-beer
    for an accouchee, smoking swaddlings with burning millwheel wood, washing a child
    with water from a millwheel, throwing remaining wood into running water, avoiding
    weaning when trees blossom, excluding strangers before baptism, tearing a baby's
    shirt by a godparent, and giving a weaning child a roll, a penny, and a key.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Calendar omens include Monday prohibitions, lightning finding what is worked
    on at Ascension, throwing a shoe over the head on Matthias-day to predict moving
    or death, and floating pennies in water to predict who in the house will die that
    year.
  category: sequence
  evidence_refs:
  - ev:9
