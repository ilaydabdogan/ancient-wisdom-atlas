  summary: 'A set of Grimm''s comparative notes on Wodan/Oðinn: birds and fingers
    are reported as sacred to him; Swedish and Danish folk-song formulas invoke Othin
    for help; divine triads and names are compared across Norse, Greek, Sanskrit,
    and Zend materials; and Saxo''s Ollerus is identified with Eddic Ullr partly through
    an episode of using a bone as a ship.'
