  summary: The passage collects examples of runes, spoken words, blessings, curses,
    and written or bound charms. It describes word-power affecting snakes, swords,
    iron, locks, trees, disease, magical fire, fetters, and weather-like darkness;
    gives examples of blessings invoking honour, prosperity, summer, greenery, dew,
    birds, and celestial lights; and describes curses as frequent, quick, clinging,
    mobile forces, with special force attributed to dying, maternal, pilgrim, priestly,
    and aged holy men's curses.
