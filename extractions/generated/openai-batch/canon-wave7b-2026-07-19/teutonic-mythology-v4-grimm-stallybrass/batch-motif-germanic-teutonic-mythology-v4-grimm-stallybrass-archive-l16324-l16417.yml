canonical_text:
  quote: ''
  summary: 'The passage collects Germanic, Latin, biblical, and medieval examples
    concerning the devil: idioms about the devil and lies, a tale of a devil called
    Nithart whose gifts become cobwebs, vocabulary for possession, examples of spirits
    entering and leaving bodies, exorcistic bodily exits, the devil as defiler and
    liar, and covenant-making with the devil by blood, mark, bond, wealth, and renunciation
    of God and St. Mary.'
  language: English with cited Germanic and Latin phrases
  quote_policy: summarized
