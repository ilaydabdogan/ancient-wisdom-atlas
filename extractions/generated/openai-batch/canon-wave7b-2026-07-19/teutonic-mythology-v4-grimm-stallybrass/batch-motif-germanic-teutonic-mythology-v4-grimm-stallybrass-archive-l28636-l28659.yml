canonical_text:
  quote: ''
  summary: 'The passage lists superstitions numbered 1115-1122: a fallen star beside
    a house predicts death; a cherry-tree blooming twice in a year predicts war; sun
    on the altar at Candlemas predicts a good flax year; witches may harm cattle by
    skimming dew from pasture grass; unsmashed eggshells allow witch-harm against
    eaters and hens; the first mouthful of found food should be thrown away to avoid
    witch-harm; among seven girls born of one marriage one is a werewolf; and lightning-struck
    fire can be quenched only with milk.'
