canonical_text:
  quote: ''
  summary: The excerpt first recounts a woman who kept a consecrated wafer in her
    mouth and kissed her husband to increase his love; the wafer changed into flesh,
    and she could neither spit it out nor swallow it. The following passage warns
    against devilish remedies, but allows a written Christian healing practice involving
    a wholesome herb, the twelve articles of faith, and the Lord's Prayer laid on
    a sick person, provided false elements are not mixed in. It also permits practical
    attention to times for medicine and farm work when based on natural discretion,
    and urges priests to prevent Christians from falling back into heathen and devilish
    unbelief.
  language: English with Middle High German excerpts
