canonical_text:
  quote: ''
  summary: 'The passage gives comparative notes on thunder traditions: folk sayings
    that identify thunder with divine driving, rolling vessels, bowls or skittles,
    anger, and the thunderbolt; names and etymological comparisons involving Taranis,
    Indra, Perun, and Perkunas; elder or father titles for thunder or high beings;
    mountain and place-name associations with thunder or Jove; and oak/tree associations
    involving God, Zeus/Jove, and Thorr.'
  language: English
  quote_policy: summarized
