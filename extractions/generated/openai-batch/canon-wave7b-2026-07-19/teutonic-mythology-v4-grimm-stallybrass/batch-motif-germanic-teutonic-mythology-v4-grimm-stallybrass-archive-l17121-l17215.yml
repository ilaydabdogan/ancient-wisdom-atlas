canonical_text:
  quote: ''
  summary: 'The passage collects comparative notes on witches and magic: witches on
    water, witches unable to weep, repulsion or detection by bells and charms, child-eating
    and cooking at witch feasts, straw substitutions, animals entering or exiting
    mouths, departure substitutes, flight formulas, flying by wings or cloaks, magical
    steeds, and bells interrupting witch journeys.'
  language: English with cited multilingual terms and formulas
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Witches are described as being on water or unable to sink; the German witch
    is paralleled with a Finnish thin-toothed Pohjan akka.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists consumption of horseflesh or human flesh and dislike of
    bells as features associated with witches.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A witch is said to have watery eyes but no tears; the same dry-tears trait
    is compared with Thock at Baldr's funeral.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Protective or diagnostic practices include lying under a harrow against the
    devil, wearing turf on the head to avoid being seen by witches, wearing a Gundermann
    garland to see witches, and recognizing witches by round hats.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Polish iedzona is glossed as an old witch and eater of men, especially
