canonical_text:
  quote: ''
  summary: 'The passage surveys comparative examples of dreams in classical and medieval
    sources: dream-visions appear, come, depart, and come true; a dream may be a messenger
    of God; dreams are described as heavy, light, or beautiful; common dream images
    include birds, eggs, beasts, a dragon, a growing tree, shipwreck, a burning house,
    a bridge, and a falling tooth. It also records a notice that laurel placed by
    a sleeping person causes true dreaming, and discusses dreams under a tree.'
  language: English with cited Greek, Latin, Old Saxon, Middle High German, and Old
    Norse/Icelandic forms
  quote_policy: summarized
