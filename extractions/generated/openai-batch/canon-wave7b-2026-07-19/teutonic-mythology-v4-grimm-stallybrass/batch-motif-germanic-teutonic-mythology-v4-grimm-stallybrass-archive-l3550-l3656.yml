canonical_text:
  quote: ''
  summary: 'The passage collects comparative notes on Thunar/Thor: sky-goat names
    in German, Finnish, Lithuanian, and Latvian; Thor’s goats and by-names; Thor-related
    place names, including a site named from a drifted pillar bearing Thor’s image;
    divine names and kinship; a lightning-associated king; a Shrove/Invocavit fire-wheel
    ceremony near Trier interpreted as Donar’s thunder symbol; heraldic wheels and
    hammers; Thursday observances; spirits appearing on Thursday night; and beliefs
    that work on holy days can be punished by lightning or bleeding tools.'
  language: English
  quote_policy: summarized
