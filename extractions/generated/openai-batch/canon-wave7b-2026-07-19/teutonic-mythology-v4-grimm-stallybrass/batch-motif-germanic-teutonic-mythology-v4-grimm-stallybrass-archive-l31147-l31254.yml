comparison_claims:
- id: claim:1
  claim: The passage itself notes similar Danish spells in Nyerup’s Morskabsl., pages
    197–198, adjacent to the German charm for making oneself beloved.
  claim_level: same_function
  target: Danish spells in Nyerup’s Morskabsl., pp. 197–198
  evidence_refs:
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The footnote asserts similarity but does not quote the Danish parallels
    in this line range, so the exact shared details are not recoverable from the supplied
    passage alone.
- id: claim:2
  claim: Within the passage, German and Swedish formulas share a functional pattern
    in which divine figures or sacred objects become the speaker’s clothing, armour,
    shield, sword, or defense.
  claim_level: same_function
  target: German and Swedish protective charm formulas in this passage
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is limited to functional and verbal resemblance in the excerpt;
    it does not establish historical contact or common inheritance.
- id: claim:3
  claim: Within the passage, German rooting charms and the Danish weapon charm both
    use commands of standing still to neutralize threat, though the German examples
    target persons while the Danish example targets edge and point of weapons.
  claim_level: same_function
  target: German immobilizing charms and Danish edge-and-point charm in this passage
  evidence_refs:
  - ev:1
  - ev:2
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The objects and immediate purposes differ, so this is a cautious functional
    comparison only.
