- id: motif:1
  label: sacred birth guarded by angels and binding
  taxonomy_refs:
  - sacred_birth
  - divine_parent_child
  basis: The thief-stopping charm sets Mary in childbed, names her child, places three
    angels as attendants, and then uses saintly and divine binding against attempted
    theft.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage is a charm using Christian sacred narrative material; it is
    not a continuous mythic narrative of the birth itself.
- id: motif:2
  label: attempted theft of a sacred child
  taxonomy_refs:
  - stolen_beloved
  basis: The charm says hostile figures came and wanted to steal Mary’s dear little
    child, and the spell binds the thief.
  evidence_refs:
  - ev:1
  confidence: low
  cautions: The available taxonomy item 'stolen_beloved' is only approximate because
    the passage concerns a child, not a spouse or lover.
