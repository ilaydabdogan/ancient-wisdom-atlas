canonical_text:
  quote: ''
  summary: The passage gives a series of German, Swedish, and Danish charms or prayers.
    They include charms to stop thieves, root a person to the spot, make oneself beloved,
    make oneself invisible, protect against fire, serpent, falls, death, evil beings,
    pain, and weapons. The charms invoke Mary, Jesus/Christ, God, the Trinity, saints,
    angels, Christ’s blood and wounds, Christian creation and incarnation formulas,
    and similes of fixed natural or built objects.
  language: German, Swedish, and Danish, with English headings and glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A charm against thieves places Mary in childbed with three named angels tending
    her, while hostile thieves attempt to steal her child.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mary commands St Peter to bind, and Peter says he has bound with Jesus’ bonds
    and God’s own hands.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The thief is ordered to remain standing like a stock or block unless he can
    count stars, snowflakes, and raindrops; otherwise he remains as a pledge until
    the speaker sees him and grants leave.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Two German rooting charms command the addressee or group to stand fast and
    remain bound, using comparisons to a tree holding boughs, a nail in a wall, a
    branch holding its nest, and other fixed or natural relations.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: One rooting charm forbids the target from striding, riding, or taking up a
    weapon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A rooting charm invokes John standing at the Jordan when he baptized Jesus
    and states that the bound persons must stand until the divine mother bears another
    son.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: A charm to make oneself beloved begins with the speaker stepping over a threshold
    and taking Jesus as companion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the beloved charm, God is called the speaker’s shoe, heaven the speaker’s
    hat, and the holy cross the speaker’s sword; those who see or hear the speaker
    are asked to love and value the speaker.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: A footnote says that similar Danish spells occur in Nyerup’s Morskabsl., pages
    197–198.
  category: other
  evidence_refs:
  - ev:4
- id: obs:10
  text: A charm to make oneself invisible says that Christ is the speaker’s mantle,
    coat, staff, and foot, and that Christ’s five wounds hide the speaker.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The invisibility charm asks Christ, who made the blind see and can make the
    seeing blind, to darken and dazzle others’ eyes so that they do not see or notice
    the speaker.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: A Swedish prayer says St John the Evangelist built bridges for Jesus Christ
    and calls the Lord the speaker’s armour and Jesus the speaker’s defense.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Swedish prayer asks protection against a fall, hot fire, a sharp worm,
    and a blind man who can will every evil.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: A Swedish evening prayer places the speaker in the Lord’s comfort, makes crosses
    over the breast, and calls earth armour, heaven shield, and the Virgin Mary sword.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Another Swedish bedtime formula says the speaker goes to bed carrying God’s
    angels, twelve to the hand, twelve to the foot, and twelve to each limb.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: A Swedish charm has Jesus ride over a heath, meet the evil one, ask where
    he is going, and forbid him from going to suck blood.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: In the same Swedish charm, Jesus orders the evil one out of bone into flesh,
    out of flesh into skin, and from skin and death to the pain of hell.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:18
  text: A Swedish pain-allaying charm says Jesus rides into a churchyard, deadens
    pain and sores, sleeps so that the pains grow numb, and wakes so that the pains
    ease.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:19
  text: A Danish weapon charm instructs the user to say words when knives or swords
    are drawn, commanding edge and point to stand with the words by which God created
    heaven and earth and formed himself with flesh and blood in Mary’s body.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:20
  text: The opening fragment of the passage includes a charm asking God that the addressee
    must forget all women in his heart, after a threefold striking formula.
  category: speech
  evidence_refs:
  - ev:11
