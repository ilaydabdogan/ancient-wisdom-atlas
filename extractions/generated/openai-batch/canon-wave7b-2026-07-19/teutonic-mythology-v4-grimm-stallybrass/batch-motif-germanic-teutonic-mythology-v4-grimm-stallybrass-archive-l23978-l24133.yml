canonical_text:
  quote: ''
  summary: 'A moralizing German passage condemns sorcery as contrary to God and lists
    many practices classed as superstition: charms, divination, dealings with the
    devil, belief in Herodias, Diana, and Precht, wax images, dream and bird-cry interpretation,
    fire and hand divination, love and enmity magic, plant and animal talismans, omens,
    celestial worship, weather-making, and ritual healing or protective acts.'
  language: Early New High German / German with English editorial glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage condemns sorcery as against God and says that some claim to have
    been taught it by a monk; such monks or priests are said to deserve punishment.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some people are described as blessing arrows, seeking the devil for wealth,
    soothsaying, and asking the devil where riches and precious stones lie.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some are said to be in league with wicked Herodias and to believe in Diana,
    called a false goddess.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The listed practices include shooting people through walls, casting wax images,
    knowing bird cries, and interpreting dreams.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Other practices include a sword-charm against being stabbed, observing fire
    to know how an affair will end, and looking into the hand.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Many old women are said to know practices concerning love or enmity; the passage
    also mentions betony, the eys-vogel, mandrake, and belief in Precht with the long
    nose.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage records beliefs about the efficacy of a hand-gift, avoiding travel
    on accursed days, a morning wolf bringing benefit, and a hare bringing misfortune.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Some are said to adore the devil, stars, sun, and moon; other practices include
    writing on an oblate for fever, blessings for toothache, and claims of making
    storms.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Some sorcerers are said to keep watch to the star Venus for love, and some
    swallow three palms on Palm Sunday.
  category: action
  evidence_refs:
  - ev:8
