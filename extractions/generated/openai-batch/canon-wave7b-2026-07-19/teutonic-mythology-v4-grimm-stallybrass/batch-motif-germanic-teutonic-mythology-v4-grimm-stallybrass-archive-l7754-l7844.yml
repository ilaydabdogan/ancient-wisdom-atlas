canonical_text:
  quote: ''
  summary: 'Grimm’s comparative notes list names and traits of goblins, kobolds, homesprites,
    follets, and related wights: secret or guessable names, movement through household
    apertures, hearth and fire associations, roguish behavior, household service,
    cattle and milk functions, animal or shadow forms, and food offerings laid out
    for domestic spirits.'
  language: English with cited German, French, Latin, and other vernacular terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several supernatural names are listed as names that must be guessed, including
    Rumpelstilz-like and other regional names.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The huizen-hänsel is said to go in and out through an open gutter, while other
    spectres pass through a city moat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A follet caught by a peasant allows the peasant three wishes on condition
    that the peasant not show him to the people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The far fadet de Poissy comes out of a fireplace to women and displays his
    backside.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Poulpikan in Bretagne is described as a roguish sprite, as husband of a fay,
    and as found in Druidic monuments.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A note says that when Undecke or Hodeke howls, the weather is stormy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hütschen is described as a little red mannikin with sparkling eyes and a long
    green garment.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Pumphut is described as a goblin who haunted the neighborhood of Pausa, worked
    hard as a miller’s man, and played roguish tricks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Around Münster, timp-hüte are small, wrinkled, hoary figures with three-cornered
    hats, while lang-hüte are tall and haggard figures in slouched hats.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Timp-hat is said to bestow blessings, while long-hat keeps off misfortune.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The hat-beings live mostly in barns or deserted lofts, slowly turn a creaking
    windlass, and have been seen during fires striding out of the flames into a by-way.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: Other homesprites live behind the oven, under the roof-beam, or in gable-holes,
    where a board is placed to attract them.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: The goblin sits on the hearth, flies out at the chimney, shares the peasant’s
    room, and is also associated with cellars over casks.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: The goblin carries things to his master, but only in a certain quantity, and
    changes masters if more is demanded.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: The goblin fetches milk from other men’s cows, helps in milking, licks up
    spilled drops, curries and feeds cattle, and has favorite beasts.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The goblin is said to speak in a tiny voice, though another cited line says
    he cried with a great voice.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: Good Johann is described as shadow-like, and goblins are often seen in the
    shape of a toad or tabby cat.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:18
  text: The Albanian homesprite vittore is imagined as a little snake.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:19
  text: Milk, honey, and sugar are set on a bench for the homesprite, and Schleswig-Holstein
    stories say such spirits must have pap or groats with butter; a table is also
    spread for the goblin.
  category: action
  evidence_refs:
  - ev:9
