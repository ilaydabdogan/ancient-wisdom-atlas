canonical_text:
  quote: ''
  summary: A sequence of numbered Germanic folk superstitions gives charms, omens,
    and precautions concerning court justice, the dead, disease, holy days, sorcery,
    childbed, weddings, household spirits, inability to die, inherited beds, pregnancy,
    labour, and fumigation. Several entries prescribe actions with objects such as
    bread, salt, coals, eggs, shoes, garters, roof tiles, aprons, water, fish, and
    broom sprigs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An incomplete opening superstition says a structure will burn down and that
    a builder's death or long life depends on whether a glass thrown from the gable
    breaks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person coming into court while wearing a shirt whose yarn was spun by a
    five-year-old girl will obtain justice in every suit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Turf or a small board is put under a dead man's chin so that he cannot catch
    the shroud between his teeth and draw his relations after him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A girl with St Anthony's fire can be cured by a pure young man striking fire
    on the ailment several times.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A person who does not step barefoot on the floor on Easter Day is safe from
    fever.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Eating first on Good Friday an egg laid on Maundy Thursday protects a person
    from bodily harm for that year.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Three crumbs of bread, three grains of salt, and three coals worn on the person
    are a safeguard against sorcery.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A woman rising from childbed uses a crust of bread on herself and makes her
    child a zuller or schlotzer of it so that the child will not have toothache.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: If the bridegroom buckles the bride's left shoe on the wedding day, the bride
    will have mastery.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: If the bridegroom ties the bride's garters for her, she will have easy labours.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Whichever spouse goes to sleep first will die first.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Eating the first three sloe-blossoms one sees prevents heartburn for that
    year.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Freckles are removed by silently taking the first goslings, passing them over
    the face, and making them run backwards.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Turning a loaf over in a drawer prevents the drude from getting out of the
    room.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: If a man cannot die, taking up three roof tiles is prescribed.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: For a child with the gefrais, a swallow's nest is placed under the child's
    pillow.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: A person lying on inherited beds cannot die.
  category: object
  evidence_refs:
  - ev:9
- id: obs:18
  text: Items 724 through 731 are introduced as coming from Austria above Ens.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:19
  text: If a pregnant woman dips her hand in dirty water, her children will have coarse
    hands.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:20
  text: If a pregnant woman dusts anything with her apron, her children will be boisterous.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:21
  text: If a pregnant woman wears a nosegay, her children will have fetid breath and
    no sense of smell.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:22
  text: If a pregnant woman longs for fish, her child will be born too soon or will
    die soon.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:23
  text: If a pregnant woman steals even a trifle, the child will have a strong inclination
    that way.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:24
  text: If a pregnant woman climbs over a waggon-pole, the child will come to the
    gallows; if she dreams of dead fish, the child will die.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:25
  text: Women who enter while a woman is in labour must quickly remove their aprons
    and tie them around her, or they will become barren themselves.
  category: action
  evidence_refs:
  - ev:12
- id: obs:26
  text: During fumigation, sprigs from the broom that sweeps the room are thrown in.
  category: action
  evidence_refs:
  - ev:13
