candidate_motifs:
- id: motif:1
  label: omen from broken object at a building
  taxonomy_refs: []
  basis: The builder's fate is predicted by whether a glass thrown from a gable breaks.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The opening superstition is fragmentary, so the full ritual context is
    missing.
- id: motif:2
  label: special garment as legal success charm
  taxonomy_refs: []
  basis: A shirt made from yarn spun by a five-year-old girl is said to secure justice
    in every suit.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage does not explain why the age or textile origin matters.
- id: motif:3
  label: dangerous dead drawing kin after them
  taxonomy_refs: []
  basis: A dead man's mouth is prevented from catching the shroud so that he cannot
    draw his relations after him.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No explicit afterlife geography or named spirit is supplied.
- id: motif:4
  label: fire applied to cure fiery disease
  taxonomy_refs: []
  basis: St Anthony's fire is treated by a pure young man striking fire on the ailment
    several times.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The mechanism is not explained; the extraction treats only the literal
    cure pattern.
- id: motif:5
  label: holy-day first act or first food as year-long protection
  taxonomy_refs:
  - seasonal_cycle
  basis: Easter Day and Good Friday actions, including first food, are said to protect
    against fever and bodily harm for the year.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The calendar is Christian liturgical; the broader seasonal-cycle taxonomy
    fit is approximate.
- id: motif:6
  label: threefold protective or remedial number pattern
  taxonomy_refs: []
  basis: The passage repeats the number three in the anti-sorcery charm, the sloe-blossom
    remedy, and the roof-tile death-release action.
  evidence_refs:
  - ev:5
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage does not state a theory of the number three.
- id: motif:7
  label: bread or loaf used as domestic protection or bodily remedy
  taxonomy_refs: []
  basis: Bread or a loaf appears in charms against sorcery, child toothache, and the
    drude's escape from a room.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:8
  confidence: high
  cautions: These uses are adjacent but not explicitly connected by the source.
- id: motif:8
  label: wedding acts determining marriage power, childbirth, and death order
  taxonomy_refs: []
  basis: Buckling the bride's left shoe, tying her garters, and sleep order are linked
    to mastery, labour, and death sequence.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No mythological personage is involved; this is a folk-omen pattern.
- id: motif:9
