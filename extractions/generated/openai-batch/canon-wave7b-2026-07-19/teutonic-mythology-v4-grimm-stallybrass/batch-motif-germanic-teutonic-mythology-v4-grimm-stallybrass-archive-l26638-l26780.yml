canonical_text:
  quote: ''
  summary: A numbered appendix list of German folk superstitions concerning witches,
    death omens, household protections, wedding and childbirth practices, livestock
    rites, healing procedures, and divination.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A harrow-nail or tooth found on the highway is said to let a person recognize
    all witches.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Red milk from a bewitched cow is boiled and whipped with switches so that
    pain makes the witch reveal herself and heal the cow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Consecrated bells on Walburgis-night are said to hinder witches who dance
    with the devil at crossroads from hurting anyone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'The passage gives several death-related procedures and omens: a hollow-sounding
    coffin predicts another death, the dead are laid facing east, objects used about
    the dead are buried with them, and cloth near a dead man’s mouth foretells a family
    death.'
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Contact with a dead man’s great toe is prescribed for great trouble, and a
    wick from a lamp burned in a dying man’s room is used to heal a goitre.
  category: action
  evidence_refs:
  - ev:2
  - ev:8
- id: obs:6
  text: Improper placement of household food or cloth is said to admit witches, prevent
    people from eating their fill, or remove angelic protection.
  category: object
  evidence_refs:
  - ev:3
  - ev:8
- id: obs:7
  text: 'Wedding actions affect the couple: a padlock pressed during the ceremony
    causes strife, bride and groom should avoid eaves and looking round, they should
    stand close at the altar to keep witches from entering between them, and the higher
    hand indicates mastery.'
  category: sequence
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:8
  text: Death is predicted by thirteen people eating at one table, by a mole in the
    house with a chirping cricket, by a crowing hen, or by a screech-owl’s shriek.
  category: other
  evidence_refs:
  - ev:3
- id: obs:9
  text: A knife with crosses on it is thrown into a whirlwind to identify the witches
    who made the whirlwind.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: If someone steals in rainy weather, the thief’s footprint is cut out and hung
    in the chimney so that the thief wastes away with the footprint.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Combed-out hair thrown on the highway is said to expose a person to witchcraft.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: Childbirth and infancy are protected by turning tubs upside down, clean garments
    for sponsors, triple questioning at a lying-in room door, bread and salt in swaddling,
    and a pointed sword or knife in the bed or cradle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Borrowing lye and giving thanks, plumping butter on a Wednesday, and certain
    greeting responses are used as signs or preventions of witchcraft.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: When domestic animals die rapidly, a fire is lit in the oven and one of each
    kind is thrown in so that the witch perishes with them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: A witch entering the house is given bread with three grains of salt sprinkled
    on it so that she cannot hurt anything.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: When there is death in a house, wine-casks are knocked, and beehives, vinegar,
    and wine are shifted or shaken to keep them from spoiling.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: Purchased poultry are led three times around a table foot and fed chips from
    table corners so they will stay, and a pig is made to jump over a piece of apron
    so it will return home.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: On St Andrew’s night, a girl melts lead in a spoon and pours it through a
    cross-warded key into water drawn between eleven and twelve; the shape reveals
    the future husband’s tools of trade.
  category: action
  evidence_refs:
  - ev:9
- id: obs:19
  text: A mouse’s head, removed with teeth or gold and hung on a child, and an egg
    given when a child first enters a house, are connected with teething or child
    behavior.
  category: object
  evidence_refs:
  - ev:9
- id: obs:20
  text: A woman setting a hen to hatch while her garters dangle, her hair streams,
    and she wears her worst frock is said to produce chickens with knobs on their
    heads and feathery feet.
  category: action
  evidence_refs:
  - ev:8
