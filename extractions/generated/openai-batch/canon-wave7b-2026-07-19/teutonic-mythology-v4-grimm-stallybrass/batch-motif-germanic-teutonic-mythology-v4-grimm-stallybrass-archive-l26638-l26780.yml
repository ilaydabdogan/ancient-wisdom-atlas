candidate_motifs:
- id: motif:1
  label: Witch recognition and exposure by object or test
  taxonomy_refs: []
  basis: The passage includes a found highway object for recognizing witches, boiling
    and whipping red milk to force a witch’s self-revelation, a cross-marked knife
    thrown into a whirlwind to identify witches, and behavioral signs such as thanking
    for lye or plumping butter on Wednesday.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:7
  confidence: high
  cautions: The passage lists beliefs without explaining a single underlying system;
    the motif label groups repeated procedures by function.
- id: motif:2
  label: Apotropaic protection against witches at thresholds
  taxonomy_refs: []
  basis: Witch protection is attached to crossroads on Walburgis-night, the wedding
    altar, the lying-in room door, swaddling, bed or cradle, morning greetings, and
    entry into a house.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The taxonomy supplied has no exact apotropaic category, so no motif-family
    reference is assigned.
- id: motif:3
  label: Harm or healing through bodily traces and contact substances
  taxonomy_refs: []
  basis: The passage links effects to red milk, a thief’s footprint, combed-out hair,
    a dead man’s toe, a dying-room lamp wick, and a mouse’s head hung on a child.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:8
  - ev:9
  confidence: high
  cautions: This is an interpretive grouping of literal procedures; the passage itself
    does not name the mechanism.
- id: motif:4
  label: Death omens and management of death pollution or household spoilage
  taxonomy_refs: []
  basis: Hollow coffin sounds, corpse orientation, burial of objects used about the
    dead, animal omens, thirteen diners, wine-cask knocking, and shifting beehives
    or shaking wine and vinegar all relate death to household danger or prognosis.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:8
  confidence: high
  cautions: The word pollution is a comparative descriptor; the passage itself states
    specific omens and spoilage-prevention actions.
- id: motif:5
  label: Ritualized numbers and repeated actions
  taxonomy_refs: []
  basis: The passage emphasizes threefold questioning and answering, three grains
    of salt, three circuits around a table foot, a water-drawing hour between eleven
    and twelve, and thirteen diners as fatal.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:7
  - ev:9
  confidence: medium
  cautions: The listed numbers have varied functions and may not form one unified
    motif.
- id: motif:6
  label: Future-spouse divination by molten lead, key, cross, and water
  taxonomy_refs: []
  basis: On St Andrew’s night a girl pours molten lead through a key with a cross
    in its wards into specially drawn water, and the resulting shape indicates the
    future husband’s tools of trade.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: No broader comparison is made beyond the procedure in this passage.
- id: motif:7
  label: Bread and salt as protective charm or offering
  taxonomy_refs: []
  basis: Bread and salt are wrapped with the babe, and bread sprinkled with three
    grains of salt is given to an entering witch so that she cannot harm anything.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The same materials appear in two contexts, but the passage does not explicitly
    state a shared rationale.
