canonical_text:
  quote: ''
  summary: The passage is a set of comparative notes on Ceres/Demeter as mother earth,
    goddess and image bathing, agricultural weather sayings, and a cluster of ship-procession
    traditions. It summarizes a demonic or prodigious wheeled ship that compels dancing
    and music, then lists German and neighboring examples of ships dragged, carried,
    or drawn on land, including carnival ship processions, a wheeled ship with knights
    and music, the Ship of Fools, cloud or enchanted ships, a ship-shaped wild-hunt
    sledge, fairy-tale ships crossing land and water, Berchta being ferried, and Odin's
    wife rowing on an earth-ship. It also notes Shrovetide plough customs and ship-shaped
    drinking vessels.
  language: English with quoted Latin, Greek, German, and Old Norse forms
  quote_policy: summarized
