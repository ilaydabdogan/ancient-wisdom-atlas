canonical_text:
  quote: ''
  summary: A comparative note passage on trees as ritually treated, sacred, animate,
    taboo, inhabited, and magically useful. It mentions tree marriage, waking trees
    and corn, omen-bearing trees, sacrificial skins on poles or trees, holy oaks,
    tabooed or bleeding trees, tree-dwelling gods or spirits, offerings to fig-trees,
    and magical branches or rods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that Hindus ceremonially marry trees to one another, especially
    mango and tamarind, and also marry shrubs, tanks, and stones; Greeks are cited
    as a comparison.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Germans wake trees as well as corn, and also notes a belief
    that the forest sleeps at New-year.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says tree-tops wave and carry messages, birches retain knowledge,
    and trees may blossom at a happy event or wither when death is near.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says Volsung's tree, called barn-stockr, stood in the hall, and
    compares this with the genealogical tree.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The passage lists suspended or displayed animal skins: Lapps shoot blindfold
    at a suspended bearskin; American Indians hang bison-skin, and likewise deerskin,
    on a high pole to the Lord of life; other peoples hang skins of sacrifices; the
    golden fleece is nailed to an oak.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A holy oak is described whose falling leaves are not touched; after it is
    cut down and burnt, a dog appears in the ashes and makes the people return all
    the ashes to the tree's former place.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The oak is also described as a tree of plaints; messages are delivered to
    a holy oak, and its great age inspires respect.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The ash is described as holy, hostile to snakes, and compared with the ash
    Yggdrasill.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage says a spell can give a hazel-rod power to flog absent people;
    an Atharva-veda branch of agvattha can destroy enemies; and the hazel-wand is
    compared with a wishing-rod.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage says it is dangerous to build where an elder-tree stood; a sacred
    rowan tells a man not to hew it or it will bleed; fir or pine, hawthorn, and other
    named trees are also described as not to be cut.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage asks about spirits living in alder and says Kalis passes from
    Nala into the Vibhitaka tree, which is regarded as haunted afterward.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage says Indians present offerings to the fig-tree, and that crows,
    sparrows, and cranes consume these offerings, giving the tree the name sacrifice-eater.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The passage says gods live between bark and tree, compares this with a maiden
    in a pine, and notes a holy oak growing from the mouth of a slain king.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: For choosing a twig, apparently for a wishing-rod, the passage says it should
    be a new shoot.
  category: object
  evidence_refs:
  - ev:14
