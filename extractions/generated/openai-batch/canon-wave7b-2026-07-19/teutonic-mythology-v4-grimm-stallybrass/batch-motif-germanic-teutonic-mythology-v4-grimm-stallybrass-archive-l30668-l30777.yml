canonical_text:
  quote: ''
  summary: A sequence of numbered charms gives formulas and ritual directions for
    conjuring a hedge-stick to bring a beloved, protecting livestock and land from
    wolves and thieves, going out and travelling safely, enclosing a farmstead or
    house, averting hail, and quenching or stopping fire. The formulas invoke Christ,
    Mary, God, angels, saints, prayers, holy wounds, holy nails, crosses, water, and
    ritual gestures.
  language: English and German
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hedge-stick charm instructs the operator to go to a fence-stake, address
    it, and command it to help bring the operator's beloved.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the hedge-stick charm, devils are called or bidden to wake the stake and
    bring the beloved between heaven and earth, without touching earth, and above
    trees.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The same charm prescribes taking characters, blowing three times on the hand,
    and striking three times against the addressed beings so they cannot harm the
    operator.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: An anti-wolf charm has Mary address Christ-son and ask him to raise his hand
    and bless livestock and land so that wolf, whelp, and thief do not enter the area.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A second wolf charm adjures the wolf-tooth by holy names and by the holy child
    carried by Our Lady, so that the wolf and its companions do not bite or gore livestock.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The going-out charm says the speaker will rise and go in holy peace, where
    Our Lady went, and will gird himself with five holy words and holy signs or rings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The journey charm says the speaker treads the path that Jesus Christ trod
    and asks help from Christ's rose-colored blood and five wounds against capture,
    binding, weapons, hostile company, and dangers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The house or farmstead blessing is to be spoken on the Monday before Ember-week,
    before sunrise, and asks God to enclose the land with his own hand.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The house blessing describes gables as bound or covered with angels and places
    Our Lady before the door, the Ave Maria before the door, and the Paternoster as
    the bolt.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The hail charm instructs the operator to make an arrow figure on the earth
    or on a plate toward the weather, sprinkle three crosses with a holy-water pot,
    and command shower and hail to become wind and water before reaching earth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The fire charm instructs that, if possible, a brand from the same fire be
    held while reciting a formula in which Jesus Christ finds a smoking brand, lifts
    it with his divine hand, and blesses it to go no further.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Several charms use counted ritual elements, including three blows, three crosses,
    three nails, five words or wounds, and specified numbers of prayers.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:5
  - ev:6
  - ev:7
  - ev:8
