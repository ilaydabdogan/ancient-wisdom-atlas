  summary: The passage compiles medieval German and classical expressions that personify
    Saelde, luck, or Fortune as a feminine agency. She may be approached, hunted,
    looked upon, smiled upon, greeted, followed, forgotten, fled from or fled by,
    guarded under, leaned on as a staff, led by, advised by, obeyed, tended by, and
    made the giver of benefits, including gifts connected with a child in a cradle.
