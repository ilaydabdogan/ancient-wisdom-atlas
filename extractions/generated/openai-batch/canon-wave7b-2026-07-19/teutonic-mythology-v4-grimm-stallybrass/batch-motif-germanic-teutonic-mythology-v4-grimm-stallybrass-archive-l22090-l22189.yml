  text: A Gothic genealogy is said to name the corresponding figure Gaut, and Gautr
    is identified as a name borne by Odhinn among the gods.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Taetwa is explained through comparison with names and adjectives meaning cheerful
    or placid, and the passage notes that Odhinn is called Herteitr in the Edda.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Beaw/Beo/Beu is identified with the elder Beowulf at the beginning of the
