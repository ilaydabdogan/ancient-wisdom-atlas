canonical_text:
  quote: ''
  summary: The passage compares names in Anglo-Saxon genealogies with Old English,
    Gothic, and Norse poetic or genealogical traditions. It discusses Sceaf’s variant
    placement, Fin and Hengest in relation to Frisian and Kentish materials, Geat/Get/Gaut
    as a deified ancestor and possible counterpart of Gautr/Odhinn, Taetwa as a possibly
    benign divine name, and the Beaw-Scyld-Sceaf sequence as connected with Beowulf
    and Danish/Norse royal ancestry.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sceaf/Scef/Seaf is reported as absent from Asser and Florence and present
    only in the Saxon Chronicle and four other authorities, with different genealogical
    placements in those sources.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:2
  text: In the Saxon Chronicle arrangement described here, Sceaf is placed as father
    of Bedwig; in four other authorities he is placed as father of Sceldwa and son
    of Heremod.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fin is cited as ruler of the Frisians in the Traveller’s Song and as Folcwald’s
    son in Beowulf.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hengest is said to be introduced in Beowulf side by side with Fin, and the
    passage notes Hengest as an important name for Kentishmen.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Geat is described as Fin’s grandfather and Folcwald’s father, and the passage
    says many chroniclers affirmed that Geat was worshipped as a god.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'The passage reports variant treatments of Geat/Geta: some sources omit his
    godhood, Nennius calls him the son of a god, and Asser and followers say pagans
    formerly venerated Geta as a god.'
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
