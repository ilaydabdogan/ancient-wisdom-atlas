  summary: 'A philological catalogue of names and idioms for illnesses: apoplexy as
    a divine stroke or plague; epilepsy as falling sickness, great evil, St. Valentine''s
    evil, and moon-sickness; numbered sets of afflictions; fainting as loss of might,
    senses, self, or heart and recovery as return to oneself; and later terms for
    colic, dysentery, lung disease, and pleurisy.'
