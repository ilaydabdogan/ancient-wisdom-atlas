canonical_text:
  quote: ''
  summary: 'A set of Scandinavian superstition notes describes procedures and omens:
    using a sieve balanced on scissors to identify a thief; resorting to so-called
    Moge folk to compel return of stolen property; avoiding rotating work from Christmas
    Day to New Year’s Day; cattle rising in stalls at Christmas midnight; divining
    a person’s death by silently looking through a window at a Christmas Eve table
    and seeing a headless diner; the danger of thirteen guests at table; and Friday
    nail-paring as lucky, with the final note on nail or hair clippings cut off in
    the supplied passage.'
  language: English with Danish/Norwegian terms and glosses
  quote_policy: summarized
