candidate_motifs:
- id: motif:1
  label: Revival after bodily consumption
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: The fragment says cooked flesh is eaten, a substitute is placed where the
    heart was, and the beings are made alive again and granted life.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage begins mid-sentence, so the identity of the beings and ritual
    context are unclear.
- id: motif:2
  label: Nocturnal ascent to aerial combat
  taxonomy_refs:
  - ascent
  basis: The notice describes participants lifted into the air as far as the clouds
    during the silence of night, where they fight and exchange wounds.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The source frames the belief as diabolical superstition rather than as
    a neutral mythic narrative.
- id: motif:3
  label: Ingested marital charm or harm
  taxonomy_refs: []
  basis: Husbands are fed porridge, skull-ash drink, or bread made through ritual
    handling, with stated aims of love, health, or wasting away.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:11
  confidence: high
  cautions: The individual aims differ, so this is a broad pattern of ingestion-based
    domestic magic rather than a single uniform rite.
- id: motif:4
  label: Sympathetic footprint magic
  taxonomy_refs: []
  basis: The turf taken from a Christian person's footprint is preserved with the
    stated hope of removing the person's health or life.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No wider comparison is supplied in the passage.
- id: motif:5
  label: Infant passed through an earth opening as cure
  taxonomy_refs: []
  basis: Women are said to dig a hole in the earth and draw a crying infant through
    it in order to stop the crying.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage gives only the action and stated purpose, not a mythic explanation.
- id: motif:6
  label: Staking the dead to prevent harmful rising
  taxonomy_refs:
  - resurrection
  - return
  basis: An unbaptized infant corpse is pierced with a stake because it is said the
    child would otherwise rise and harm many; a mother-infant burial is also pierced
    with a stake.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The explicit rationale of preventing rising is stated for the unbaptized
    infant; the mother-infant case is adjacent but does not repeat the rationale.
- id: motif:7
  label: Burial with liturgical grave goods
  taxonomy_refs: []
  basis: A baptized dead newborn is buried holding a wax paten with oblation and a
    wax chalice with wine.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage does not state an afterlife journey or intended function for
    the objects.
- id: motif:8
  label: Rain-making rite with maiden, herb, and river sprinkling
  taxonomy_refs: []
  basis: The rite is explicitly performed when rain is lacking and includes a small
    naked girl, uprooted helisa/henbane, a river, sprinkling with water, incantations,
    and return to the village.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: No external parallel or seasonal calendar context is stated in the passage.
- id: motif:9
  label: Condemned divination, omens, and forbidden belief
  taxonomy_refs:
  - forbidden_knowledge
  basis: The Zurich material forbids belief in magic, fire-gazing, night-women, magpie
    cries, bodily omens, lot-casters, and false prophets.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: medium
  cautions: The material is admonitory and catalogues condemned practices rather than
    narrating a mythic episode.
comparison_claims:
- id: claim:1
  claim: The editorial note cautiously relates the plant name bilisa/helisa to Slavic
    plant-name forms, while also noting that some similar Polish forms denote artemisia
    rather than henbane and giving different Polish and Russian words for henbane.
  claim_level: linguistic_similarity
  target: Slavic plant-name parallels for bilisa/helisa and henbane
  evidence_refs:
  - ev:15
  counter_evidence_refs:
  - ev:15
  confidence: medium
  limitations: This is a lexical comparison about a plant name, not evidence for a
    shared ritual motif; the note itself includes a caution about mismatched plant
    identification.
