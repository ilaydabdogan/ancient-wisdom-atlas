canonical_text:
  quote: ''
  summary: 'A collection of Latin and Swiss German penitential or admonitory notices
    lists condemned beliefs and ritual actions: revival after eating cooked flesh,
    night ascent and cloud fighting, love or harm magic using food, infant and burial
    rites, footprint magic, skull ashes for health, a rain-making rite with a naked
    girl, henbane, rods, and river water, and warnings against omens, fire-gazing,
    night-women, lot-casters, and false prophets.'
  language: Latin, Middle High German/Swiss German, with English editorial notes
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening fragment describes cooked flesh being eaten, straw or wood being
    put in place of the heart, and the eaten beings being made alive again and given
    a period of life.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A belief is attributed to certain women that, at night with closed doors,
    they are lifted into the air up to the clouds with others described as members
    of the devil, fight there, and both inflict and receive wounds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Certain women are said to prepare porridge on uncovered buttocks and give
    it to their husbands to eat so that the husbands will burn more strongly with
    love for them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: An infant is described as being put beside a fire while a cauldron with water
    is placed over the fire; after the water boils it is poured over the infant, who
    dies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Certain women are said to watch the footprints and tracks of Christians, take
    turf from a footprint, preserve it, and hope thereby to take away the persons'
    health or life.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Certain women are said to burn a human skull in fire and give the ashes to
    their husbands to drink for health.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Women with crying infants are said to dig the earth, make a hole, draw the
    infant through the hole, and say that this stops the infant's crying.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: When an infant dies without baptism, certain women are said to place the corpse
    in a secret place and pierce it with a stake, saying that otherwise the child
    would rise and be able to harm many people.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: If a woman dies in the pain of difficult childbirth, the mother and infant
    are described as being pierced with a stake in the grave.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A newborn who has been baptized and then dies is described as being buried
    with a wax paten and oblation in the right hand and a wax chalice with wine in
    the left hand.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: Certain women are said to strip, smear the whole body with honey, roll on
    wheat laid on a cloth, collect the grains adhering to the body, grind them by
    turning the mill backward against the sun, bake bread from the flour, and give
    it to husbands so that they waste away and fail.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: For rain, several girls are said to gather and appoint a small girl as leader;
    they undress her, lead her outside the village to henbane called helisa, have
    her uproot it with the little finger of her right hand, tie the root to the little
    toe of her right foot, lead her with rods into the nearest river while she drags
    the herb, sprinkle her with river water, use incantations in hope of rain, and
    return her from the river to the village with altered crab-like steps.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: The Zurich admonition tells the hearer not to believe in magic and related
    practices or signs, including fire-gazing, night-women, the cry of the magpie,
    itching of brows and cheeks, and other unbelief.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: A Zurich heading says that a section concerns lot-casters and false prophets,
    and the following sentence describes such seers as arrogating certain qualities
    to themselves.
  category: speech
  evidence_refs:
  - ev:14
