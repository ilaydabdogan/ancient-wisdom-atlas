canonical_text:
  quote: ''
  summary: 'A catalogue of folk beliefs and condemned superstitious practices: supernatural
    beings such as the trute, alb, orken, and schrättlin; charms using stones, herbs,
    earth, lead, trees, animal parts, bones, water, milk, shoes, bats, and moon-sighting;
    beliefs about a woman transformed into waywort; rites involving newborns; and
    a belief that unnamed beings give and govern human life.'
  language: Early New High German with English editorial glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some people are said to remove grease from tubs while it is stirred, to believe
    in invisible beings or agencies, and to possess mugwort.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The teutte or trute is described by some as an old woman who can suck people.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The alb, the orken, and the schrättlin are listed among beings named in popular
    claims or beliefs; the schrättlin is described as a small child, as small or light
    as the wind, and as a lost spirit.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: A sigel-stone is said to have power to make its bearer victorious.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Slices of earth are used for many kinds of magic; lead is written on at Christmas
    mass against the worm; and an alder tree is taken against storm.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some people dig coal when they first see the swan, and some inspect clothing
    to learn whether matters will go luckily.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: A herb named in the passage is believed to make people fond of one another
    when it is dug up in the evening.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Bad people are said to go through closed doors at night, and some bring out
    silver and gold when they see the new moon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Some people carry all water out of a house when the dead are carried past
    it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: When young fowls are brought in, some people speak a formula telling them
    to stay at home.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The waywort or plantain is said to have once been a delicate woman who still
    waits for her lover in pain.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: A hoopoe's heart is laid at night on sleeping people so that it may suggest
    secret things to them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Some people look at a shoulder-blade to determine what will happen to people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The passage says some people consider it bad to put the left shoe on before
    the right early in the morning.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: Some people say that milk is stolen from a cow's udder.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: Some nurses take newborn children and push them through a hole; the passage
