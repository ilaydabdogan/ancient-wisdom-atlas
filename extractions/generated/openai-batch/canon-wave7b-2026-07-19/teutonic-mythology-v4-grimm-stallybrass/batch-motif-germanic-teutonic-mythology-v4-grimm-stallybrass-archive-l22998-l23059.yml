canonical_text:
  quote: ''
  summary: 'The excerpt collects ecclesiastical condemnations of practices labeled
    false, pagan, Gentile, or contrary to Christian faith: nocturnal service to a
    commanding mistress, tree worship, divination and lot-casting brought into homes
    for magical inquiry or expiation, belief in human storm-senders, vows at trees
    or stones, and instructions for bishops and ministers to uproot and burn demon-consecrated
    trees. Stones in ruined or wooded places are also described as venerated and associated
    with vows.'
  language: Latin with English editorial footnotes
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fragment describes persons passing through the silence of deep night, obeying
    a figure like a mistress, and being called on certain nights to her service; the
    passage says many people believe this false opinion and thereby return to pagan
    error.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some people are reported to worship trees and to commit other unlawful acts
    against Christian faith.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Those who seek divinations, follow Gentile custom, or introduce such persons
    into their homes for magical inquiry or expiation are placed under a five-year
    rule of penance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A parallel rule says that anyone following pagan custom who brings diviners
    and lot-casters into the house to send evil out or discover maleficia must do
    five years' penance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Those serving auguries or divinations, those believing that some humans are
    senders of storms, and a woman making divinations or diabolical incantations are
    assigned seven years' penance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Observers of auguries, lots falsely called saints' lots, divinations, or vows
    made or paid at a tree, stone, or any object except a church are excommunicated,
    with penance specified if they repent.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Bishops and their ministers are instructed to uproot and burn trees consecrated
    to demons, which the common people worship and hold in such veneration that they
    do not dare cut a branch or twig.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Stones in ruined and wooded places are said to be venerated by people deceived
    by demonic illusions; vows are made and brought there. The sentence is truncated
    in the supplied passage after 'funditus'.
  category: setting
  evidence_refs:
  - ev:6
