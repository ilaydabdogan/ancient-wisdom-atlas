canonical_text:
  quote: ''
  summary: 'The passage gathers comparative notes on spectres and the wild hunt: regional
    names and leaders, Christmas music and a dangerous procession at Ottobeuren, Wode
    pursuing unchristened infants or moss-folk, dead mothers nursing children at night,
    a ferried wild host, aerial dancers and cloud hunters, Venusberg and Horselberg
    traditions, and Dietrich von Bern as a mounted apparition or wild hunter figure.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hunter’s cry asking whether the hearer will hunt with them is said to have
    a French parallel, and a West Prussian story is said to be like a Samland story.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Swabia the wild hunt is called the mutige heer, its leader is named Linkenbold,
    and related Harz names and a Linkenhold hole are noted.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Swabian poem calls the wild hunt the wilde wuotiss-heer, and a Frau Matte
    is said to roam in Thuringia.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Ottobeuren, lovely music was heard at Christmas time; a person who put
    his head out of the window to listen and see Wuete’s march had his head swell
    so that it could not be pulled back in.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Those who stayed behind closed doors were said to enjoy the music fully, while
    the procession went along the fron-weg up the Guggenberg or into the devil’s hole
    at the Buschel.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A treasure is said to lie in the devil’s hole at the Buschel, guarded by a
    poodle.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Unchristened infants are identified with subterraneans and moss-folk, whom
    Wode pursues and catches.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage notes sayings about a mother’s warm hands, soft lap, and sweet
    love, and says that in German fairy tales the dead mother comes at night to nurse
    her children.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The wild host, like dwarfs, is said to get ferried over, and the last one
    lagging behind is girded with a rope of straw.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Herodiases are described as condemned to an aerial dance because of the death
    of the Baptist.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In Wallachia, Diana or Dina with a large following hunts in the clouds, leaves
    visible signs of dancing on the grass, can strike a person lame, deaf, or blind,
    and is especially powerful at Whitsuntide.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage lists Venusberg and Horselberg references, including a witch-trial
    phrase associating Venesberg with Paradise and a Middle Netherlandish poem saying
    Venus dwells in the forest.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: An early description of the Horselberg presents a mountain where nocturnal
    figures wander over rocks and mountains and frighten children.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: At the death of Henry VI, Dietrich von Bern is said to appear on horseback,
    ride through the Mosel, and disappear.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Wendish names for the wild hunter are compared with Dietrich-related names;
    barren streaks are called Dietrich’s path, while other notes say the wild hunt
    or Rodensteiner’s passage can be followed by fruitful growth or higher corn.
  category: relationship
  evidence_refs:
  - ev:9
