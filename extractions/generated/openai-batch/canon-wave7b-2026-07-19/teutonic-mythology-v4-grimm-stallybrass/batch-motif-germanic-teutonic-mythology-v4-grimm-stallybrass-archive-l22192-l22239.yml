canonical_text:
  quote: An unknown boy, in a ship without oars
  summary: The passage collates medieval accounts of Sceaf in Anglo-Saxon genealogical
    tradition. Sceaf is described as a very young or unknown boy who arrives by sea
    at Scani/Scandea/Angeln; in one account he is asleep in a ship without a rower
    or oars, with a corn-sheaf at his head, while another says he is surrounded by
    arms. The inhabitants receive and raise him, then choose or make him king. Grimm
    notes that the legend may be reflected in the opening of Beowulf, transferred
    there to Scyld son of Sceaf, and adds that tales of strange heroes arriving asleep
    in ships were early diffused in Germany.
  language: English with Latin quotations
  quote_policy: quoted
