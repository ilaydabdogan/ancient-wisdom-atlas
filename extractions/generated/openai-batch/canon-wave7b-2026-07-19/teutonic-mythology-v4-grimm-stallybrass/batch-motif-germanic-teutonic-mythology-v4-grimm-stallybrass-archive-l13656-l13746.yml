  summary: 'The passage compiles multilingual and comparative notes on personified
    Death: Death is linked with Sleep; Death approaches stealthily like a thief; life-weary
    speakers invoke Death or Yama to come and release or kill them; Death may warn,
    make terms, or be delayed twice but not a third time; Death takes, grips, boxes
    up, and devours with jaws or gullet; and Death or death-associated beings ride
    horses or carry others on saddles.'
