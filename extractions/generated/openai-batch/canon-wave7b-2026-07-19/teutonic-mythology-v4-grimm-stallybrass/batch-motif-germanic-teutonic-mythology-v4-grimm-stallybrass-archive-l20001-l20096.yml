canonical_text:
  quote: ''
  summary: The passage catalogs Germanic and neighboring-language herb names, including
    plants associated with Iris, Perunica, animals, kinship, healing, witches, and
    the devil. It then catalogs rare and potent stones, including stones known by
    specialists, powdered boundary-stones used medicinally, stones that heal or protect,
    and stones that grant knowledge, language, water-travel, flight, or freedom from
    fear.
  language: English with multilingual lexical citations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies hwdtend with iris Illyrica and asks whether it is equivalent
    to a soothsaying flower; Iris is described as messenger of the gods, rainbow,
    and plant, while Slavic Perunica is glossed as thunder-flower and Finnish sword-lily
    is also iris.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists many Old English herb names with Latin or common plant identifications,
    including cowslip, centaury, boar-throat/scilla, drosera, madder, melissa, cyclamen/convolvulus,
    aconitum, hellebore, buphthalmus, chenopodium, caltha, lolium, lapathum, yarrow,
    a wound-healing plant, brother-wort, and narcissus.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: A reported Low German saying has the devil claim knowledge of weendungel because
    he had eaten it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage lists Old High German herb names and points to further plant-names
    in Wiesbaden glosses.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Still-current names include terms translated or glossed as wood-mother, wood-wife,
    man’s-strength, day and night, bride-faithfulness, Berufa-kraut, vermein-kraut,
    moonwort, mouse-ear, nailwort, devil’s-thread, witch-meal, and wind-witch.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:6
  text: Mouse-ear or nailwort is said to make horses willing to be shod.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Bruten-mehl or hexen-mehl, identified as semen lycopodii, is sprinkled over
    sore babies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Wind-hexe is described as a rolling flax or steppe weed whose balls drift
    like thistledown.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Rare stones are described as stones that no mountain bore and that the earth
    did not bring forth.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says Jews know rare stones; an unnamed Jew can tell Alexander
    what a stone is, and Evax of Arabia is called a master of stone-lore.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Boundary-stones and three-lord-stones are pounded to powder and drunk as medicine;
    other healing stones and defensive helmet-stones are also mentioned.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A stone tells everything; another stone taken in the mouth gives knowledge
    of foreign tongues; another put in the mouth enables travel over water; another
    makes a person fly.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: A stone of fear keeps a person from being frightened, and the passage states
    that finger-rings derive their virtue from stones set in them; it also begins
    to mention a ring that repels magic.
  category: attribute
  evidence_refs:
  - ev:10
