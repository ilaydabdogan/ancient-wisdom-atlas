canonical_text:
  quote: ''
  summary: 'Comparative notes on devil-related place names and tale motifs: devil''s
    walls, ditches, ovens, and grave-mounds; a wall attributed to a cock and swine;
    the last or twelfth person due to a supernatural claimant; the devil as lecturer;
    the taking, catching, or selling of a shadow; child-hushing and interrupted building
    legends; disappearance after three hand-claps; and crop division between a peasant
    and the devil.'
  language: English
  quote_policy: summarized
