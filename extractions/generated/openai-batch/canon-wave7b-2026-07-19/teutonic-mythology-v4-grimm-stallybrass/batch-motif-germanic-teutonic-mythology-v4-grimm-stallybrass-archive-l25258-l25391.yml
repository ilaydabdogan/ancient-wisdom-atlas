literal_observations:
- id: obs:1
  text: A man is warned not to give his betrothed a knife or scissors, because their
    love would be cut in two.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Children bathed on a Friday are said to be robbed of their rest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Water fetched in silence is to be drawn downstream.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Crosses drawn on doors before Walpurgis-night are said to prevent witches
    from harming the household.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Leaving something lying on the table at bedtime is said to prevent the oldest
    or youngest person in the house from sleeping.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: 'A woman going to be churched is said to foretell her next child by whom she
    meets: a man for a son, a woman for a girl, nobody for no more children, and two
    people for twins.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Sneezing before breakfast is said to mean a present will be received that
    day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Fire and light are not to be carried out of the house by a stranger, because
    this is said to take the victuals away from the house.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A new maidservant is instructed to look first into the oven's mouth so that
    she will soon get used to it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: When flax is being sown, the sower should receive a fee or the flax will spoil.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: On Christmas-eve, a single woman may pour melted lead into cold water; the
    resulting form is said to resemble the tools of her future husband's trade.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: A wooden pipe or tap made from a birch growing in the middle of an anthill
    is said to help sell wine or beer drawn through it.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: Cutting bread unevenly is said to show that the cutter has told lies that
    day.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Single women who want husbands are told to call on St Andrew naked on the
    night before St Andrew's day, after which they will see their sweetheart in sleep.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: A maid may divine whether she will keep her place by flinging her shoe over
    her head on Christmas-eve; the shoe's tip toward the door means she must go, and
    the heel means she will stay.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: A maid may learn her lover's hair by groping backward through an open door
    on Christmas-eve and grasping hair in her hand.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: Looking into a mirror at night is said to show the devil there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:18
  text: A damsel may knock at the hen-house on Christmas-eve or at midnight to learn
    whether she will get a husband during the year; a cock's sound means yes, and
    a hen's sound means no.
  category: action
  evidence_refs:
  - ev:6
- id: obs:19
  text: Children riding in the street with spears and banners are said to portend
    war, while children carrying each other on crosses are said to portend pestilence.
  category: action
  evidence_refs:
  - ev:7
- id: obs:20
  text: An empty purse should not be exposed to the new moon, or the owner will be
    short of money all month.
  category: action
  evidence_refs:
  - ev:7
- id: obs:21
  text: A stork building on a roof or chimney is said to mean long life and riches
    for the householder.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:22
  text: On Christmas-eve, a girl may pull a log from a wood stack behind her back
    to learn whether her lover will be straight or crooked.
  category: action
  evidence_refs:
  - ev:7
- id: obs:23
  text: A girl may stretch the first yarn she spins that day outside the house-door;
    the first passing man is said to share the future husband's name.
  category: action
  evidence_refs:
  - ev:7
- id: obs:24
  text: A gridiron or trivet should not be set over the fire empty, or the woman who
    does so will have puckers on her face.
  category: action
  evidence_refs:
  - ev:8
- id: obs:25
  text: A woman who salutes the stars before bed is said to protect her chickens from
    hawk and vulture.
  category: action
  evidence_refs:
  - ev:8
- id: obs:26
  text: Knots should not be left in straw-bands when straw is put into a bed, because
    there is no sleeping on them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:27
  text: Putting on the right shoe first before going to market is said to help a woman
    get better prices for her wares.
  category: action
  evidence_refs:
  - ev:8
- id: obs:28
  text: A shirt woven from yarn spun by a girl under seven is said to bring luck to
    the wearer.
  category: object
  evidence_refs:
  - ev:8
- id: obs:29
  text: Rain on John's-day is said to spoil nuts and make harlots thrive.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:30
  text: Onions turned in their bed on John's-day are said to turn out fine.
  category: action
  evidence_refs:
  - ev:9
- id: obs:31
  text: Maids are told not to weed cabbage-beds on Bartholomew's day because Bartholomew
    is putting heads to the cabbages and would be scared away.
  category: action
  evidence_refs:
  - ev:9
- id: obs:32
  text: A found four-leaved clover is to be kept dear, because the finder is said
    to be happy as long as it is kept.
  category: object
  evidence_refs:
  - ev:9
- id: obs:33
  text: A raven or crow cawing on a sick house is said to betoken the patient's death.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:34
  text: Shepherds must not name the wolf during the Twelves, or the wolf will worry
    their sheep.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:35
  text: A child carrying a date-stone is said not to fall, or not to be much hurt.
  category: object
  evidence_refs:
  - ev:10
- id: obs:36
  text: The first dream in a new house or room is said to come true.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:37
  text: If a woman or maid loses her garter in the street, her husband or lover is
    said to be unfaithful.
  category: object
  evidence_refs:
  - ev:11
- id: obs:38
  text: A woman going to bed should move her chair from the place where she sat, or
    the alp will weigh upon her.
  category: action
  evidence_refs:
  - ev:11
- id: obs:39
  text: While a fire hums on the hearth, lightning is said not to strike the house.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:40
  text: A calf born on St Valentine's day is said to be of no use for breeding.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:41
  text: Meeting a wolf, stag, boar, or bear on a journey is said to be a good sign.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:42
  text: Finding a horse-shoe, or a piece of one, is said to bring luck.
  category: object
  evidence_refs:
  - ev:12
