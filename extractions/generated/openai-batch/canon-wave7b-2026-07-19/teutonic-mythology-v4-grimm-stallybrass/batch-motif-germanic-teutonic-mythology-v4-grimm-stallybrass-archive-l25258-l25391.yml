  quote: ''
  summary: The passage lists numbered folk superstitions concerning prohibited household
    acts, protective signs, omens, luck-bringing objects, animal signs, calendrical
    rituals, and divinations about marriage, children, prosperity, sleep, illness,
    and weather.
  language: English
