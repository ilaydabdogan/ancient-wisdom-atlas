canonical_text:
  quote: ''
  summary: Supplementary notes compare Holda, Berhta/Bertha, Laume, Borta, Wendelmuot,
    Borggabe, Stempe, and related figures. The passage describes supernatural female
    figures connected with earth, weaving, linen, food offerings, cave-gifts, dwarfs,
    child-taking or child-return, blinding, the Wild Hunt, reward and punishment of
    children, nightmare-like treading, Christmas-tree naming, and a woodland woman
    with apples that become money.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Laume/Luxma-like figure is said to be like Berhta and Holda and is described
    as a goddess of earth and weaving.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Laume appears in a house, helps girls weave, rapidly completes linen,
    and makes the girl guess her name; if guessed correctly the girl keeps the linen,
    otherwise the Laume takes it away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A note describes the Laume as a malignant alp or nightmare who steals children
    and is voracious, yet also bathes on the beach, helps, and brings linen.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wendelmuot is presented as a female personification who sends seeds of division
    or error, and another citation says she mows down love with curiosity's sharp
    scythe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A meal set ready for Bertha is compared in the passage with food offered to
    Hecate on the thirtieth day of the month.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A white lady prescribes a diet for country people; a dame Borggabe gives or
    lends money and corn to needy men who go to her cave and call to her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Borta, like Holda, is called mother in Swedish material; one Swedish tale
    has a fair lady walking with many dwarfs and entering a room filled with them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage notes blinding by the devil or by care, and records curses or
    gestures involving eyes being shut or opened.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A woman gets her child back after a year; Berhta is also associated by reference
    with the Furious Hunt.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The wild Berta wipes with unspun flax.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: At Holzberndorf a lad acts Eisen-berta, wearing a cow's hide and carrying
    a bell; he gives nuts and apples to good children and a rod to bad children.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Stempe is said to tread like the alp and is compared or identified with the
    alp-crushing Muraue.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: In Salzburg country the Christmas-tree is called Bechl-hoschen.
  category: object
  evidence_refs:
  - ev:11
- id: obs:14
  text: The dime-weibl appears in a wood in a red frock with a basket of fine apples,
