  summary: 'A comparative note-collection on earth and related elements: sacred and
    personified earth, death as going to ground, earth as recipient or moral bearer,
    earth-contact taboos, secrets told to earth or stone, elemental and metallic substances,
    apotropaic turf, emigrants carrying earth and fire, Demeter and Jasion in fertile
    fallow, holy mountains, mountain-dead beliefs, and ritual stones.'
