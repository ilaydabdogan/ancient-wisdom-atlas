canonical_text:
  quote: ''
  summary: 'The passage lists and condemns several divinatory or superstitious practices:
    children looking into sacred patens for visions, molten lead or tin poured into
    water and read for past or future matters, finger-length omens of luck, fortune-telling
    associated with gipsies, a hereditary female fortune-teller who reads hands, shoulder-bone
    divination with animal bones washed in wine and holy water, goose breast-bone
    weather divination around St Martin''s day, and a captain comparing astrological
    winter prediction with a goose-bone omen.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Certain priests took sacred patens used at Mass and had children look into
    them, believing holy angels rather than devils could appear there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Practitioners melted lead or tin, poured it into water, removed it, examined
    its colour and pits, and declared past or future things from it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Some people inspected whether the little finger reached beyond the last joint
    of the ring finger and treated the result as a sign of luck or misfortune.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A people named Zygainer or gipsies are described as men and women, young and
    old, who practise the art and mislead simple people.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A female fortune-teller said her art had been in her family for ages and would
    descend at her death to her eldest daughter.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The same fortune-teller told the narrator to wash his hands, dried them with
    her own, bent her face very close to his hands, and told him things the narrator
    says could not happen to him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Spatulomancy practitioners used the shoulder of a dead ox, horse, cow, ass,
    or other large animal, saying a human shoulder would be best.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The shoulder bone was washed with wine and holy water, tied in a clean cloth,
    taken outside a roofed place, gazed into, and believed to change after every question.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Practitioners observed colours on different parts of the shoulder bone and,
    according to the passage, the devil suggested what they should believe and say.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: On St Martin's day or night, after a goose was eaten, the eldest and wise
    kept the breast-bone, dried it until morning, and examined it on all sides and
    in the middle.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The goose breast-bone was used to judge whether winter would be cold, warm,
    wet, or dry, and whether snow would be much or little.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage says belief in goose-bone divination had spread from old peasants
    in desert places to kings, princes, and the nobility.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: A victorious captain asked the narrator, as a star-gazer, how winter would
    be; the narrator answered with an astrological prediction involving Saturn entering
    a fiery sign.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The captain drew a goose-bone from his doublet and showed it as evidence that
    after Candlemas there would be a very great frost.
  category: sequence
  evidence_refs:
  - ev:9
