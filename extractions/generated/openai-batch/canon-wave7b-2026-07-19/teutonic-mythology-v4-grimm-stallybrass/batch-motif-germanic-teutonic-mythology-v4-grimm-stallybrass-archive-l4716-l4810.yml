canonical_text:
  quote: ''
  summary: Antiquarian notes connect a white female apparition as a royal death omen,
    Reine Pedauque and Berhta/Goose-foot spinning and large-foot imagery, pig-linked
    names for whirlwinds, Ostara as a dawn/eastern goddess with sacred hills, cave,
    spring-name, and feast rejoicing, a speculative Westara as western/evening counterpart,
    and a Zisa/Zysa oath-and-land-grant legend from a chronicle.
  language: English with quoted French, German, Latin, and other philological forms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An account says that whenever a Bourbon king was about to die, a tall woman
    dressed in white was seen walking at midnight in the chateau galleries; the note
    says the same is told of the Irish bansighe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Images of Reine Pedauque are said to stand under church doors at Dijon, Nesle,
    Nevers, St. Pourcin, and Toulouse; the Toulouse figure is connected with a remark
    quoted from Rabelais.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Reine Pedauque statue is described as holding a spindle and spinning,
    and people are said to have sworn by her distaff; the passage also states that
    Queen Goose-foot was a spinner.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage groups Reine Pedauque, Queen Goose-foot, and Berhta with goose-foot,
    duck-foot, or large-foot traits and related names.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A white damsel is said to be given a little white lamb.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The whirlwind is given pig-related abusive names; when it whirls up hay or
    corn, people in Passau and Straubing are said to cry a pig insult at it, and an
    old Langobard treaty calls the devil possessor of pigs.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ostara is connected with Sanskrit, Zend, and Lithuanian words for daylight,
    day, dawn, morning, or east, and with Lithuanian Ausca as a goddess of the setting
    or rising sun.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Many places in Germany are said to have been sacred to Ostara, especially
    hills; named examples include Austerkopp/Osterkopp, Osterstube as a cave, and
    Osterbrunne as a Christian name.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ostara's feast is described as a time of great rejoicing, and the word ostertac
    is cited in metaphors for joy or delight.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that the east-west antithesis seems to demand a Westara
    as goddess of evening or sundown, while presenting the idea as a suggestion.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: A chronicle story says a heathen Swabian duke named Esnerius lived at Hillomondt
    near Vertica/Kempten and adhered to heathen customs.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: People driven out of Vertica and the surrounding region came to Esnerius and
    asked him, for the sake of his goddess Zysa, to give them fields and receive or
    protect them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Esnerius answers that if they swear by the gods Edelpoll and Hercules and
    by his goddess Zisa, he will give them fields.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage lists place-name comparisons that may be connected with Gisa/Cisara,
    including Cise, swester Zeise, Zaissen-perig, Zeisl-perg, and several Rhaetian
    forms.
  category: relationship
  evidence_refs:
  - ev:10
