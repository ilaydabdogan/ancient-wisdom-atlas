literal_observations:
- id: obs:1
  text: The first frog seen in spring is said to foretell misfortune for the year
    if it leaps into water rather than onto land.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Moving into a new dwelling with a waxing or full moon and carrying bread and
    salt into it is said to ensure fullness and lack of want for the inhabitants.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Horses neighing are said to announce good luck if heard attentively.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Rules concerning women, children, and birth include a warning against a woman
    spinning during the six weeks, a claim that Sunday-born people are luckier, and
    prescriptions affecting a child's first dress and christening.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:5
- id: obs:5
  text: 'Friday is linked to bodily practices: women are warned not to brush or plait
    themselves on Friday, while paring nails on Friday is said to bring luck.'
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: A moon-facing spoken formula asks that sorrows wear away as the moon changes
    from day to day.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Household and threshold signs include warnings about leaving an oven-fork
    in the oven, clothes caught on a door or latch, and laying a broom in a witch's
    way.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Certain carried animal parts are said to confer luck in play or trade, including
    an owl's heart, a stone from a bat's back, a hoopoe's head, and a bitten-off mole's
    paw.
  category: object
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:9
  text: First sheaves from the harvest, laid crosswise in the four corners of the
    barn, are said to prevent the dragon from getting any of the corn.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Corn price forecasts are attached to the shortest day, mushroom grains, and
    the measured grain of the first sheaf threshed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Meeting someone carrying water on the way to market is said to remove luck
    in buying or selling unless the traveler turns back.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Kept wedding bread and a carried birth caul are said to prevent want or bring
    prosperity.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: Seed laid on a table is said not to sprout, and named New Year cakes with
    finger holes are used to foretell death if a person's hole bakes up.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: A sneeze while a tale is being told is said to prove the tale true, while
    rules about rocking a child, burning slept-on straw, and illness at church concern
    rest and recovery.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: Food-related rules concern Christmas-eve beans, Maundy Thursday herbs, mouldy
