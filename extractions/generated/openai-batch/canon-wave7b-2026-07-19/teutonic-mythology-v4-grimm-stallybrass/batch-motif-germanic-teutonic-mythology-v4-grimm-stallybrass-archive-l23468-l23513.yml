canonical_text:
  quote: ''
  summary: The passage rejects false remedies used for illness, livestock disease,
    infertility, difficult childbirth, hail, weather, and pain. It advises sufferers
    to seek help from God alone through prayer, trust, Eucharist, blessed oil, and
    the prayer of faith. It then identifies sorcery chiefly with the evil knowledge
    of false and harmful women who dishonor the church's sacraments and misuse the
    Lord's body, comparing them unfavorably even with devils. A scriptural example
    begins in which a woman receives the Lord's body and keeps it in her mouth.
  language: Middle High German with English editorial glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists false remedies according to uses including sickness of people
    or cattle, infertility, difficult childbirth, hail and bad weather, and various
    pains.
