- id: obs:2
  text: Those who suffer such things are advised to leave devilish things, ask God
    alone for counsel in need, and seek help from him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'A spoken prayer is prescribed: “Dear God, come to our help.”'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A sick person is instructed to trust in God's mercy and receive the Lord's
    body and blood of Jesus Christ with firm faith and devotion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sick person is also instructed to seek blessed oil from the holy church,
    and the passage states that the prayer of faith preserves the sick.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says that sorcery is chiefly associated with the evil knowledge
