- id: motif:1
  label: Apotropaic household boundary rite
  taxonomy_refs: []
  basis: Doors, thresholds, windows, barns, and lying-in rooms are guarded or ritually
    managed through right-foot stepping, concealed objects, straw at doors, a wheel
    felloe, and a black hen entering first.
  evidence_refs:
