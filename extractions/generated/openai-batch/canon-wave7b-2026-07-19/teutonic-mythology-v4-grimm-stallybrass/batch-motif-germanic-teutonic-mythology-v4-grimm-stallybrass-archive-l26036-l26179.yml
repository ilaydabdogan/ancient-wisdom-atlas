  - ev:5
  - ev:6
  - ev:13
  confidence: high
  cautions: The passage presents practical superstitions rather than a narrative mythic
    episode.
- id: motif:2
  label: Sympathetic or contagious transfer between object and outcome
  taxonomy_refs: []
  basis: Feathers, towels, foot-bath water, splinters, hair, willow, and grafts are
    treated as materially linked to sleep, luck, bodily harm, hair growth, chick necks,
    or fruit fall.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:14
  - ev:15
  confidence: high
  cautions: The mechanism is inferred from repeated object-outcome pairings; the passage
    does not explicitly name sympathetic magic.
- id: motif:3
  label: Ritualized wedding transition and marital mastery
  taxonomy_refs: []
  basis: The wedding sequence is surrounded by rules about beer, looking round, the
    black hen, order of arrival at church, threshold concealment, suckling milk, and
    forbidden house-cock food.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: This is a domestic superstition pattern, not evidence for a sacred-marriage
    myth.
- id: motif:4
  label: Transfer of mischief to a substitute animal
  taxonomy_refs: []
  basis: After the wedding, a black hen is made to enter first so that any feared
    mischief falls on the hen.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The hen is not described as killed or sacrificed.
- id: motif:5
  label: Dangerous power of prescribed speech
  taxonomy_refs: []
  basis: Psalm 109 is used as a repeated death-prayer with danger to the practitioner,
    and a specific mining formula is required to avoid collapse.
  evidence_refs:
