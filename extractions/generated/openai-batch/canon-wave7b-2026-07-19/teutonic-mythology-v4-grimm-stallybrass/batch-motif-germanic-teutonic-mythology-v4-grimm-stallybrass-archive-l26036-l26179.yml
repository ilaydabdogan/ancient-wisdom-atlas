canonical_text:
  quote: ''
  summary: A numbered appendix list of superstitions prescribing or warning against
    actions concerning children, brewing, thresholds, weddings, animals, calendar
    days, healing, mining speech, bodily states, and household protection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hens hatched from eggs laid on Maundy Thursday are said to change their colour
    every year.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several rules concern infants or children, including growth when taken outdoors,
    sleep in a feathered bed, effects of repeated towel handling, baptism delay, and
    the first fall.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Feathers picked up on a boundary and put into a bed are said to prevent a
    child from sleeping; if put in a marriage bed, they are said to make husband and
    wife part.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Singing while brewing is said to make the beer turn out well.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Saluting the returning stork is said to prevent toothache.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Stepping on the threshold with the right foot in the morning is said to bring
    luck for the day, while turning round in a doorway is said to be unlucky.
  category: action
  evidence_refs:
  - ev:4
  - ev:10
- id: obs:7
  text: A used foot-bath is not to be emptied until the next day, or luck is said
    to be spilled away with it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: An old wheel felloe thrown into a barn in the name of the Holy Trinity is
    said to protect corn from mice, and a silver ring made from pfennig pieces is
    said to protect against diseases.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wedding rules include broaching a beer cask, not looking round while going
    to the wedding, sending a black hen into the home first, and actions by which
    the bride seeks mastery or preserves milk for suckling.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Good Friday and Christmas practices are said to protect clothes, make drink
    harmless, make cattle thrive, prevent detection in future thefts, or cause crumb-wort
    to grow.
  category: action
  evidence_refs:
  - ev:1
  - ev:7
- id: obs:11
  text: Repeating Psalm 109 morning and night for a year is said to let a man pray
    his enemy dead, but missing a day is said to cause the practitioner himself to
    die.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Animal and corpse signs are presented as omens of luck, death, weather, corn
    prices, or money shortage.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: In mines, one must say the mining greeting equivalent to 'luck up' rather
    than 'luck to,' or the building is said to tumble down.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: In a dangerous place, having a donkey present is said to prevent the devil
    from doing harm.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: Cures or protective measures include sparks from flint and steel, a spur made
    from a gibbet-chain without fire, a strangling rope hung in a dove-cot, and wild
    garlic carried on the body.
  category: object
  evidence_refs:
  - ev:12
- id: obs:16
  text: In a lying-in room, straw from the woman's bed is placed at every door so
    that neither ghost nor Jildel can enter.
  category: action
  evidence_refs:
  - ev:13
- id: obs:17
  text: Pregnancy, labour, and bodily remedies include smelling the husband's shoes,
    chewing a removed splinter, and having a pregnant woman jump over a pipe through
    which a bell is being cast.
  category: action
  evidence_refs:
  - ev:14
- id: obs:18
  text: Plant-related rules connect buried hair with hop-shoots to long hair, twisted
    willow in a stable to crooked-necked chicks, and dropped grafts to premature fruit
    fall.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:15
