canonical_text:
  quote: ''
  summary: The passage lists numbered Germanic folk-superstitions and remedies, including
    healing rites, corpse and tree customs, water divination, child amulets, charms
    against ailments, sympathetic actions against thieves and woodworms, a remedy
    against the nightmare, and omens of death, welcome, spirit-sight, and unhappy
    marriage.
  language: English, with Low German and Latin phrases
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A disease-related object is tied in linen and buried after sunset in an ant-hill;
    a finder is expected to avoid it lest he catch the buried disease.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For headache, a woman of knowledge uses cold water, melted tallow, an inherited
    hatchel, spoken dialogue, a spell, triple repetition, disposal of water on an
    elder or maple bush, and disposal of tallow in fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At a death in rural Hildesheim, the grave-digger cuts an elder rod to measure
    the corpse, and the corpse-carrier cuts a similar rod and uses it as a whip.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: On Matthias night, girls silently bring a periwinkle wreath, a straw wreath,
    and ashes to running water; blindfolded participants grasp one of them as a prognostic.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The Matthias-night objects are explicitly assigned meanings: periwinkle means
    bridal wreath, straw means misfortune, and ashes mean death.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Barleycorns and named leaves may also be floated on water to observe relationships
    or which named family member is indicated first.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In some parts of Hanover, churching is called brummie because parents and
    sponsors make a bear-like growling sound.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Charms for children are made from nine small sticks tied with red silk thread
    and worn on the pit of the stomach; if the thread snaps, the bundle is removed
    with pincers and thrown into running water.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Animal-derived amulets are listed, including a wolf's right eye and blind
    swallows cut from a maw.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: A boy with epilepsy is to be wrapped in the true father's black or spotted
    shirt so that the illness will not return.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: For a dwindling child, a red silk thread is tied around the child's neck,
    passed through the skin of a mouse, and the mouse is released; the mouse wastes
    while the child recovers.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: An old wife treats tension of the heart by breathing crosswise on the painful
    part, stroking it, tying salt and rye-meal over it, and reciting a formula that
    names Jesus.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: For spasms, the patient is told to stretch himself on a plum-tree and speak
    a short formula to the tree.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Some men's mere look is said to endanger people and beasts even without the
    men's knowledge.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:15
  text: Some men are said to be able, by muttering a spell, to stop a galloping horse,
    silence a watchdog, stanch blood, and keep fire from spreading.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: Stolen goods may be recovered by putting earth trodden by the thief into a
    pouch and beating it until fire comes out; the thief feels the blows and must
    return the goods or die.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:17
  text: Timber is protected from woodworm by knocking it with oak on Peter's day while
    reciting a formula to the worm and Saint Peter.
  category: action
  evidence_refs:
  - ev:14
- id: obs:18
  text: The nightmare is described as a big woman with long flying hair; a hole bored
    in the door and filled with sow-bristles is used against her, and she may be promised
    a gift that she later seeks in human shape.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:19
  text: A person who has never worked on Sunday is said to have corn or fruit that
    birds will not touch.
  category: relationship
  evidence_refs:
  - ev:16
- id: obs:20
  text: A person born at sermon-time on Christmas morning is said to be able to see
    spirits.
  category: attribute
  evidence_refs:
  - ev:17
- id: obs:21
  text: A mole burrowing under the wash-house is said to foretell the mistress's death.
  category: relationship
  evidence_refs:
  - ev:18
- id: obs:22
  text: Meeting swine on the way means one is an unwelcome guest, while meeting sheep
    means one is welcome.
  category: relationship
  evidence_refs:
  - ev:19
- id: obs:23
  text: If the crust of the saved wedding-loaf grows mouldy, the marriage is said
    not to be happy.
  category: relationship
  evidence_refs:
  - ev:20
