  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:3
  type: summary
  locator: item 866; lines 27696-27702
  quote_or_summary: In rural Hildesheim, the grave-digger silently cuts an elder rod
    to measure the corpse; the man conveying it to the grave cuts a similar rod and
    uses it as a whip.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:4
  type: summary
  locator: item 867; lines 27703-27718
  quote_or_summary: On Matthias night, young people use wreaths, ashes, barleycorns,
    and named leaves on running water for prognostics of marriage, misfortune, death,
    bachelors, and family members.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:5
  type: summary
  locator: item 868; lines 27719-27725
  quote_or_summary: In some parts of Hanover, churching is called brummie because
    mother, father, and sponsors make a bear-like growling sound.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:6
  type: summary
  locator: item 869; lines 27726-27732
  quote_or_summary: Children's charms are made of nine small sticks tied with red
    silk thread, worn on the stomach, and thrown into running water if the thread
    snaps.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:7
  type: summary
  locator: item 870; lines 27733-27735
  quote_or_summary: Amulets are listed from animal bodies, including the wolf's right
    eye and blind swallows cut out of a maw.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:8
  type: summary
  locator: item 871; lines 27736-27738
  quote_or_summary: A Latin note says that if a boy troubled by epilepsy is wrapped
    in his true father's black or spotted shirt, the condition will not return.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:9
  type: summary
  locator: item 872; lines 27739-27744
  quote_or_summary: For a dwindling child, a red silk thread from the child's neck
    is passed through a mouse's skin; the mouse is released, wastes, and the child
    improves.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:10
  type: summary
  locator: item 873; lines 27745-27753
  quote_or_summary: An old wife treats heart-tension by crosswise breath, stroking,
    salt, rye-meal, and a Jesus formula; for spasms the patient stretches on a plum-tree
    and speaks to it.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:11
  type: summary
  locator: item 874; lines 27754-27757
  quote_or_summary: Some men's mere look is said to endanger people and beasts even
    without the men's knowledge.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:12
  type: summary
  locator: item 875; lines 27758-27760
  quote_or_summary: Some men, by bespeaking or muttering a spell, can stop a galloping
    horse, silence a watchdog, stanch blood, and keep fire from spreading.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:13
  type: summary
  locator: item 876; lines 27761-27767
  quote_or_summary: To recover stolen goods, earth trodden by the thief is sealed
    in a pouch and beaten until fire comes out; the thief feels the blows and must
    return the goods or die.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:14
  type: summary
  locator: item 877; lines 27768-27771
  quote_or_summary: Timber is protected from woodworm by knocking it with oak on Peter's
    day and reciting a formula to the worm and Saint Peter.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:15
  type: summary
  locator: item 878; lines 27772-27780
  quote_or_summary: The nightmare is a big woman with long flying hair; one bores
    a hole in the door, fills it with sow-bristles, promises her a gift if she comes,
    and she returns in human shape for it.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:16
  type: summary
  locator: item 879
  quote_or_summary: Birds will not touch the corn or fruit of someone who has never
    worked on Sunday.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:17
  type: summary
  locator: item 880
  quote_or_summary: Someone born at sermon-time on Christmas morning can see spirits.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:18
  type: summary
  locator: item 881
  quote_or_summary: A mole burrowing under the wash-house means the mistress will
    die.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:19
  type: summary
  locator: item 882
  quote_or_summary: Meeting swine on the way means one is an unwelcome guest; meeting
    sheep means one is welcome.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain; summarized from supplied passage.
- id: ev:20
  type: summary
  locator: item 883
  quote_or_summary: If the crust of the saved wedding-loaf grows mouldy, the marriage
    will not be happy.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
