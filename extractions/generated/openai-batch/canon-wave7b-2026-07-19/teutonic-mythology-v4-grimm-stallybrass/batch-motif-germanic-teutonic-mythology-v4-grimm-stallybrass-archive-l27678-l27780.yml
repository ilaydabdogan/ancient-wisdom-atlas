candidate_motifs:
- id: motif:1
  label: Ailment transferred into object, place, or animal
  taxonomy_refs: []
  basis: Multiple remedies involve moving or disposing of an affliction through a
    container, water/fire disposal, a charm bundle, or a mouse that wastes while the
    child recovers.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  - ev:9
  confidence: medium
  cautions: The passage gives practice descriptions rather than an explicit theory
    of transfer; the first item is affected by OCR uncertainty.
- id: motif:2
  label: Water-borne divination by floating objects
  taxonomy_refs: []
  basis: On Matthias night, participants float wreaths, ashes, barleycorns, and named
    leaves on running water to obtain prognostics.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage records a local custom but does not explain its origin or
    wider distribution.
- id: motif:3
  label: Protective or curative amulets worn on the body
  taxonomy_refs: []
  basis: Children wear a tied nine-stick charm, animal-derived amulets are listed,
    and an epileptic boy is wrapped in his father's garment.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The exact ailment or purpose of every listed animal amulet is not fully
    specified in the passage.
- id: motif:4
  label: Sympathetic action at a distance
  taxonomy_refs: []
  basis: The thief feels blows delivered to earth he has trodden; harmful looks and
    muttered spells are also said to affect people, animals, blood, fire, dogs, and
    horses without ordinary physical action.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: medium
  cautions: The passage groups these as superstitions but does not use a technical
    category such as sympathetic magic.
- id: motif:5
  label: Tree and bush materials as ritual media
  taxonomy_refs: []
  basis: Elder or maple, elder rods, plum-tree, and oak appear in healing, corpse-handling,
    spasm, and woodworm rites.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:10
  - ev:14
  confidence: medium
  cautions: The uses are varied; the passage does not state a single meaning for tree
    materials.
