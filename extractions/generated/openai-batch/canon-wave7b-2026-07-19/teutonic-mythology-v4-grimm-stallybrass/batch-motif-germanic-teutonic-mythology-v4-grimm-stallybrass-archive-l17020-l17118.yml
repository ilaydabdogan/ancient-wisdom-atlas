canonical_text:
  quote: ''
  summary: A comparative note-section on witchcraft records practices and beliefs
    involving burning and scattering ashes, oaths to the devil, devil-marks, salves,
    aerial riding or flight, witch assemblies with the devil on a pillar or tree,
    banquets with deceptive food, toads, milk and dew theft, cattle and crop harm,
    storm-brewing, bridal-bed discord, body-part sleep charms, nightmares from untimely
    births, demonic insect names, will-o'-wisps, hair-borne magic, and a churchyard-yarn
    charm binding the devil as lover.
  language: English with cited Latin, Germanic, and other comparative terms
  quote_policy: summarized
