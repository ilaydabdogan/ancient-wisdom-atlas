canonical_text:
  quote: ''
  summary: 'A comparative catalogue of proverbs, literary references, and philological
    parallels concerning the devil: the devil’s female kin, witches in a weather-saw,
    multiple devils, demonic demands for animals, gifts to Pluto, hair pulled from
    demonic or giant figures, the devil released from hell, devilish snares, and formulas
    in which the devil or other supernatural beings carry or bring people through
    the air.'
  language: English with quoted Germanic, Latin, and Greek source phrases
  quote_policy: summarized
