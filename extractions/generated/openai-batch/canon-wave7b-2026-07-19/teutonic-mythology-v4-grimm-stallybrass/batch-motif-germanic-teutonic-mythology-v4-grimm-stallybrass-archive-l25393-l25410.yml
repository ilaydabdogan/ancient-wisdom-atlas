canonical_text:
  quote: ''
  summary: 'A numbered list of six modern superstitions: unfinished Saturday spinning
    spoils flax or tow; a sword placed in a newly christened baby''s hand makes the
    child bold; a newborn boy''s feet against his father''s breast avert a bad end;
    a newborn girl seated on her mother''s breast with a spoken blessing avoids shame;
    a spider crawling on one''s coat in the morning predicts happiness that day; and
    meeting a spinning woman on a journey is a bad sign requiring another road.'
  language: English
  quote_policy: summarized
