  quote: ''
  summary: A numbered excerpt from the Chemnitzer Rocken-philosophie lists household
    and life-cycle superstitions concerning childbed entry, bewitchment tests, apotropaic
    acts for money, taboos in washing, baking, poultry-setting, cradle use, naming,
    christening, godparent conduct, infant exposure to cellar or mirror, animal omens,
    and postpartum effects on fields or beds. The supplied passage ends mid-item at
    the start of another instruction about a woman dying within six weeks after confinement.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person entering a childbed chamber with a basket must break off a chip from
    the basket and put it in the cradle, or the child’s or mother’s rest is taken
    away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A stranger entering the room is instructed to sit down so as not to take the
    children’s rest away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A mother may test whether her child is becried by licking the child’s forehead;
    a salty taste indicates becrying, followed by fumigation with sweepings, table-corner
    shavings, and nine kinds of wood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pulling an article from the wash upside down or leftwards is said to prevent
    being becried.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A sick man may be bathed in water from boiled herbs, and the bath left under
    his bed; if he is becried the bath will shrink, and if not it will not shrink.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Putting chalk with money, or washing money in clean water and adding salt
    and bread, is said to keep the dragon and bad folk from getting any of it back.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Women boiling yarn are told to tell lies over it, otherwise it will not turn
    white.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Walking over sweepings is described as unlucky.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Calling a young child “little crab” is said to stunt the child, with the explanation
    that crabs crawl backwards.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: If a hare runs across the path when someone sets out on a journey, it bodes
    no good.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Spanning a jug lid with the hand while drinking is said to give the next drinker
    tension of the heart; rattles are said to slow children’s speech; beggar’s bread
    is said to help tongue-tied children.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: If someone has forgotten something when leaving home, the person should not
    go back for it but should have another fetch it, or everything will go wrong.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: When covering a table, bread should be put on at once, or a corner of the
    cloth will trip someone.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Men should not remain in the house while women stuff feathers into beds, or
    the feathers will prick through the bed-tick.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Setting a hen while people come out of church is said to produce many chicks;
    wearing a large straw-hat while setting the brood-hen is linked with large-headed
    chickens; straw from a marriage-bed is assigned by the man’s or woman’s side to
    obtain cocks or hens.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: After morning washing, flicking water from the hands is said to waste that
    day’s food.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: An empty cradle should not be rocked because it rocks the baby’s rest away.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: When a baby’s nails first need paring, the mother should bite them off, or
    the child will learn to pilfer.
  category: action
  evidence_refs:
  - ev:8
- id: obs:19
  text: A prospective godfather or godmother should borrow something to wear so the
    godchild will always have credit; godparents fetched from three parishes are linked
    with a child living one hundred years.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:20
  text: Calling children old-man or old-woman names is said to stunt and wrinkle them;
    naming boys Adam and girls Eve is linked with long life; first children who take
    their parents’ names are said to die before the parents.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:21
  text: A child under one year old taken into a cellar is said to become timid; a
    child under one year old who looks into a looking-glass is said to become vain;
    children who cry at christening are said not to grow old.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:22
  text: A dog looking into the oven during baking is said to affect the loaves; sweeping
    a room while dough is in the trough is said to sweep a loaf away; setting a cruet
    on the table is said to spoil the vinegar.
  category: action
  evidence_refs:
  - ev:9
- id: obs:23
  text: A woman within six weeks after confinement who walks a field or bed is said
    to cause nothing to grow on it for years or to make everything spoil.
  category: action
  evidence_refs:
  - ev:9
- id: obs:24
  text: The supplied passage breaks off after beginning another instruction about
    a woman who dies within six weeks after confinement, mentioning a mangle-roller
    or a book.
  category: sequence
  evidence_refs:
  - ev:10
