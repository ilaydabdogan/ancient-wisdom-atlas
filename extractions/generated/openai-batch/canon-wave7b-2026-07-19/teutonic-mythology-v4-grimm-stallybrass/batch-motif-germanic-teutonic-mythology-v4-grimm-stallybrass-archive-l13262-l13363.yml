  text: Blood from slain or dead figures is reported as watering flowers or turning
    into yellow flowers or herbs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Poles with pigeons were set over Lombard graves, and souls are described as
    flying away in dove form; a Swedish song describes two doves coming from heaven
    and three flying back up.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Souls are also listed in swallow, raven, little-duck, night-owl, and sparrowhawk-with-human-head
    forms.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: A soul, after parting from the body, is said to hover for a time between the
    earth and the moon.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Greek sources are cited for the soul as winged, losing and recovering wings,
    and flying away at death.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Butterfly and moth terms or omens are connected with the soul, including a
    Lithuanian saying that a moth around a candle indicates someone dying and the
    soul going hence.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The soul is said to run out of a sleeper as a mouse, cat, weasel, snake, or
    butterfly; Yama draws a dying man's soul out as a tiny mannikin, and the soul
    may slip from the mouth as a little child.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage records a German belief that a dying man's heart can pass into
    a living man, who then gains greater courage; it also mentions named heroic examples,
    lovers exchanging hearts, marriage of souls, figure exchange, and Pythagorean
    transmigration.
  category: relationship
  evidence_refs:
  - ev:8
