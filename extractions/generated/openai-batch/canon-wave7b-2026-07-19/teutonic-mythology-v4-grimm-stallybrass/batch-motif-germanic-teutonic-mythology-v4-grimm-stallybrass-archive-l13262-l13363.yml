  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The soul is reported as passing out of the mouth and being perceived as a
    flash, burning flame, shining brightness, exceptional whiteness, beauty or blessedness,
    and sweet scent.
  category: attribute
  evidence_refs:
  - ev:1
