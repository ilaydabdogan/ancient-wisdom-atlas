  quote: At Woden's sons they begin to split, in him they all unite.
  summary: The passage surveys Anglo-Saxon royal genealogies, arranging regional kingly
    lines as descendants of Woden. It compares the number and names of Woden's sons
    in different chroniclers, then focuses on Kentish traditions concerning Hengest
    and Horsa, their descent from Woden, their arrival from Germania, and the dynastic
    name Oiscingas from Oisc.
