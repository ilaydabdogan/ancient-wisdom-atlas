  summary: The passage is a set of comparative notes on seasonal customs, names for
    flying gossamer, Whitsun and May observances, and the personification and linguistic
    treatment of Time. It cites a Serbian Whitsun queen, spring or summer gossamer
    linked to the three Marys, Germanic names, and Marut's flag, May processional
    hobby-horse and bear customs, Whitsun processionists and sleepers, a Russian Palm
    Sunday lie-abed scourged with rods, and many examples in which Time or while is
    personified and described as coming, going, or bringing events.
