canonical_text:
  quote: ''
  summary: A numbered list of folk beliefs and practices concerning crop and weather
    omens, marriage divination, household taboos, livestock protection from witchcraft,
    calendrical fire and tree customs, and signs or techniques for foreseeing death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The number of crowings during service the night before Christmas is said to
    predict the next year's wheat price.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Seeing the first ploughman and first swallow is said to promise good luck
    for the year.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A spinster who sees two wagtails together in spring is said to be married
    that year.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A bridal pair meeting a cartload of dung on the way to the wedding is said
    to have an unhappy marriage omen.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Barley seed run through a man's shirt before sowing is said to be spared by
    sparrows.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: Peeled barley in the stomach is said to prevent apoplexy while any grain remains
    there.
  category: object
  evidence_refs:
  - ev:1
- id: obs:7
  text: Striking a light on the corner of the table or fireplace is said to bring
    blight on millet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:8
  text: When women go to wash, everyone in the house must get up in a good temper
    for fine weather to follow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:9
  text: On St John's-eve spinsters make a wreath of nine sorts of flowers and try
    to throw it backwards and silently onto a tree; the number of falls is said to
    count unmarried years.
  category: action
  evidence_refs:
  - ev:2
- id: obs:10
  text: A winter fire-chip with a large catstail is said to signify snow, and a split
    catstail is said to signify guests.
  category: object
  evidence_refs:
  - ev:3
- id: obs:11
  text: Walking over sweepings is stated to be not good.
  category: action
  evidence_refs:
  - ev:3
- id: obs:12
  text: Children beaten with rods from a used broom are said to waste away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:13
  text: Milk and cattle protection practices include putting a bought 'summer' over
    the stable-door, tying red rags around cows' tails, and shutting a bear in the
    stable for a night to remove hidden magic.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: 'Several household or calendrical acts are listed: flax bought on St Lawrence
    day is said to be blasted; stepping out over the threshold and back restores a
    forgotten thought; giving away honey at harvest is said to make bees generous;
    stones put on trees on Christmas-eve increase bearing; and a cap-net on a newborn
    girl protects her from the alp.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: On Allhallows-eve nuts thrown into the fire and wedding stockings thrown among
    guests or at the bridal pair are used to forecast marriage outcomes or who will
    marry next.
  category: action
  evidence_refs:
  - ev:2
- id: obs:16
  text: On St Mark's-eve some young people watch in the church-porch all night and
    are said to see the spirits of those who will die that year.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: The yule-clog is lit on Christmas-eve, kept burning if possible, partly saved
    for next year's log, and used to guard the household; failure to light or burn
    out bodes mischief.
  category: object
  evidence_refs:
  - ev:7
- id: obs:18
  text: Earth from the first furrows turned in spring is sprinkled in the four corners
    of the living-room, and the fleas are said to leave.
  category: action
  evidence_refs:
  - ev:8
- id: obs:19
  text: Dogs and black sheep are said to have the gift of seeing 'bad'; a person may
    learn it through a howling dog and may transfer it back to a dog through specified
    foot and shoulder actions.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:20
  text: The direction of a howling dog's muzzle and the last side touched by the death-bell
    tongue are said to indicate from where the next corpse will come; cabbage plant
    signs foretell misfortune.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
