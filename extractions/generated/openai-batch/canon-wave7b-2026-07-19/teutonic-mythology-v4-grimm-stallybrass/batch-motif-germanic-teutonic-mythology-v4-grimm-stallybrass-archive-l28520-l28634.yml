- id: ev:6
  type: summary
  locator: item 1108
  quote_or_summary: On St Mark's-eve young people watch all night in the church-porch
    and see the spirits of those who will die that year; such watchers can hint approaching
    deaths, and East Friesland calls this seeing 'bad.'
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: item 1109
  quote_or_summary: On Christmas-eve the yule-clog is laid on and kept burning if
    possible; a piece is saved to light the next year's log and guard the household,
    while failure to light or burn out bodes mischief.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: item 1110
  quote_or_summary: In spring, earth from the first furrows turned by the farmer is
    sprinkled in the four corners of the living-room so all fleas retire.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: items 1111-1112
  quote_or_summary: Dogs and black sheep have the gift of seeing 'bad'; a person may
    learn or transfer the art through prescribed actions involving a dog, and the
    howling dog's muzzle direction indicates the quarter from which the coming corpse
    will be brought.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: items 1113-1114
  quote_or_summary: Dull dead steeple-bell sounds and the death-bell tongue's final
    side indicate death or the side of the village from which the next corpse will
    come; first-year cabbage blossom or white leaf-spots foretell household misfortune.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v4-grimm-stallybrass.md
