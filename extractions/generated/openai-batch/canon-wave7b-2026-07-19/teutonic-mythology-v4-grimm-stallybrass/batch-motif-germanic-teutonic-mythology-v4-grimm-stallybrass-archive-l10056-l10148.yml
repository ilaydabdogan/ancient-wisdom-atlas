  quote: ''
  summary: 'The excerpt opens with a brief note that flowers were invoked, then surveys
    beliefs about animals. It states that animals are commonly regarded as dumb and
    ignorant, yet may speak in urgent or special times and may see spirits. It then
    collects examples involving horses: mythic lineage, sagacity, advice-giving or
    talking horses, white and royal/divine horses, horse teeth, neighing, animal images
    on poles or roofs, and horses consecrated to gods or ridden by spirits at night.'
  language: English
  quote_policy: summarized
