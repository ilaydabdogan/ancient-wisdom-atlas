literal_observations:
- id: obs:1
  text: The passage lists strong descriptions of cursing as cruel to hear and as forceful
    enough to make a castle or earth sink, stones fly upward, the sky bow down, thunder
    occur, rafters or floors crack, and toads jump.
  category: speech
  evidence_refs:
  - ev:1
