  evidence_refs:
  - ev:2
- id: obs:3
  text: Middle Netherlandish curse formulas are described as using a word meaning
    “over” when consigning someone to the devil’s ear, name, hand, or escort; related
    formulas mention the devil or hangman entering the mouth or throat.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Old Norse curse examples consign the person or the person’s gold to giants
    or trolls.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Other formulas send the cursed person to wild places or over the sea, or wish
    that wolves, wild boars, ravens, crows, and similar beings eat, tear, flay, gnaw,
    or otherwise harm the person or their heart.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Some curses wish that the addressee sink, or be crushed by an inclining wall,
    aged tree, or felled tree.
  category: speech
  evidence_refs:
  - ev:6
