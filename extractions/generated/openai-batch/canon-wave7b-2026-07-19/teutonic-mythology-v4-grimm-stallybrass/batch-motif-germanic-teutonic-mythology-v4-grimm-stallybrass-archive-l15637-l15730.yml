    is not stated here.
- id: motif:2
  label: key-bearing white lady with serpent association
  taxonomy_refs:
  - serpent
  basis: A noble lady's keys are snake-bound, white maidens or ladies are associated
    with keys, and a release condition involves taking a key from a snake's mouth.
  evidence_refs:
  - ev:2
  - ev:6
  confidence: high
  cautions: The note lists separate examples and does not provide a single continuous
    tale.
- id: motif:3
  label: dead bridal spirits dancing men to death
  taxonomy_refs: []
  basis: The vilas and villy are defined as spirits of brides dead before the wedding
    day who dance at midnight and dance men to death.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives a compact ethnographic comparison rather than a detailed
    story.
- id: motif:4
  label: release by fulfilling difficult, silent, reversed, or intimate conditions
  taxonomy_refs:
  - serpent
  basis: The passage lists release conditions including drawing a wagon uphill the
    wrong way, silence while holding the white lady's hand, taking a key from a snake's
    mouth with one's mouth, and kissing animals including a snake.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The outcomes of each individual condition are not fully narrated in this
    excerpt.
- id: motif:5
  label: seed-grown wood enabling death, sacred object, or release
  taxonomy_refs: []
  basis: The passage connects an acorn planted for a coffin, pips under Adam's tongue
    growing into the Wood of the Cross, bird-brought seeds for a wishing-rod, and
    a tree felled to make a cradle that releases a spell.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The examples are juxtaposed by the author; they are not presented as one
    unified myth.
- id: motif:6
  label: buried treasure as living, moving, fiery, or self-concealing
  taxonomy_refs: []
  basis: Buried treasure is said to bloom, shift, sink, sun itself, cool, transform
    between gold and coal, burn as blue or treasure-fire, and sink when shouted at.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage draws from many cited legends, so local variants may differ.
- id: motif:7
  label: cyclical opening of treasures at rare intervals
  taxonomy_refs: []
  basis: Once in a hundred years, stones go down to the sea to drink and all treasures
