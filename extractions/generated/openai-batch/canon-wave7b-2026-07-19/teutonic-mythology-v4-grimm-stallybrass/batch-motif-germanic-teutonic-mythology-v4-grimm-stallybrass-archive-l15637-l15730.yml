    contact or common inheritance.
- id: claim:2
  claim: The key-bearing white-lady examples are placed near Slavic vilas, dancing
    maids, and Lithuanian figures of the dead, suggesting a cautious comparison among
    spectral female figures connected with death, enchantment, and nocturnal activity.
  claim_level: same_function
  target: Slavic vilas and villy; dancing maids; Lithuanian figures of the dead
  evidence_refs:
