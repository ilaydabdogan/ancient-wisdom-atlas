  claim: The passage treats sleeping or hidden Fredlc, Kronos, Arthur, Grail knights,
    and several other legendary figures as members of a recurring hidden-ruler or
    sleeping-hero pattern centered on caves and mountains.
  claim_level: same_motif
  target: Kronos in a cave; Arthur and Grail knights in a mountain; King Dan, count
    of Flanders, Marko, Bayard, and Svatopluk traditions
  evidence_refs:
