canonical_text:
  quote: ''
  summary: 'The passage is a comparative note-list on spectres and legendary motifs:
    sleeping or hidden rulers in caves and mountains; white or noble ladies with keys
    and snake associations; dead bridal spirits who dance at midnight; conditions
    for releasing spells or treasures involving seeds, trees, cradles, silence, keys,
    snakes, and kisses; buried treasures marked by fire, light, animals, graves, and
    periodic openings; and a wonder-flower that blossoms rarely and vanishes if not
    immediately plucked.'
  language: English
  quote_policy: summarized
