canonical_text:
  quote: ''
  summary: A German charm speaker says he knows where the addressed person is, sends
    Jesus Christ and three messengers to the addressee, places the three messengers
    in the addressee's mind, blood, and heart, asks God that all women and maidens
    in the addressee's heart moulder, and then sends sweet Lord Jesus/Christ and three
    blunt nails. A note adds an example of many similar beginnings in which Christ
    and his mother come from a wood, travel over field and land and uphill and downhill,
    with a faggot in hand.
  language: German with English glosses and note
  quote_policy: summarized
