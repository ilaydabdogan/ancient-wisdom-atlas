canonical_text:
  quote: ''
  summary: The passage collects comparative notes on wights, elves, dwarfs, pixies,
    giants, and changelings. It notes daylight vulnerability in several beings, lists
    regional names and descriptions for changelings, describes child theft or child-changing
    by supernatural figures, gives methods for causing a changeling to be removed,
    recounts a story in which dwarfs reward a human mother for nursing their child,
    and gives an example of a changeling revealing his age after seeing an impossible
    brewing setup.
