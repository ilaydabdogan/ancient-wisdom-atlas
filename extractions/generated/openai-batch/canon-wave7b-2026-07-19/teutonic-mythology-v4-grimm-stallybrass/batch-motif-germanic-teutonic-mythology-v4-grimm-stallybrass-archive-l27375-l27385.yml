canonical_text:
  quote: ''
  summary: 'The passage lists four numbered superstitions: water drawn downstream
    in silence before sunrise on Easter Sunday is said not to spoil and to be broadly
    useful; bathing at the same day and hour is said to help scurf and other complaints;
    a new maidservant who finds the house fire present and stirs it on arrival is
    expected to remain long; and in house-building, the master should strike the first
    axe blow, with sparks predicting that the house will burn down.'
