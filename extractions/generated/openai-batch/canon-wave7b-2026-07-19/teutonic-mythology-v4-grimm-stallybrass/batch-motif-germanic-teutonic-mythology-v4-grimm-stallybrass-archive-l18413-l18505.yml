canonical_text:
  quote: ''
  summary: 'The passage surveys names and customs connected with sickness and healing:
    healing mountains and Norse Eir are noted; women bind wounds, know herbs, and
    give salves; herdsmen can heal; physicians may be punished when patients die;
    herbs, gifts, and potions can signify both medicine and poison; herbalists and
    old women gather potent herbs at special places and times; royal, godparental,
    hereditary, contact, magical, and sung cures are listed.'
  language: English
  quote_policy: summarized
