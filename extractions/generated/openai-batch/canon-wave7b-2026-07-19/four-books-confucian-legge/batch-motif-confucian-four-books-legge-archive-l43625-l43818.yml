canonical_text:
  quote: ''
  summary: Mencius answers a question about visits and respect by citing the Book
    of History on offerings requiring demonstrations of respect. In a following chapter,
    Shun-yu K'wan challenges Mencius for leaving office without visible public achievement.
    Mencius replies with examples of worthies who followed different courses but aimed
    at perfect virtue. K'wan challenges the practical value of virtuous men, and Mencius
    answers with the case of Pih-le He, whose employment or neglect determined the
    fortunes of states. K'wan then argues from singers and skilled lamenters that
    inner gifts manifest outwardly and change public manners.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mencius denies the charge implied in the question about visits and cites the
    Book of History to say that an offering to a superior depends chiefly on demonstrations
    of respect and the will behind the offering.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Uh-loo is pleased and explains that the younger member of Jin could not go
    to Tsow, while the minister Ch'oo might have gone to P'ing-luh.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Shun-yu K'wan says that making fame and meritorious services primary shows
    regard for others, and asks whether Mencius acted benevolently by leaving high
    office before his fame and services reached the prince or people.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mencius names Pih-e, E Yin, and Hwuy of Lew-hea as three worthies who followed
    different courses but shared the one aim of perfect virtue.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Shun-yu K'wan cites the time of duke Muh of Loo, when Kung-e, Tsze-lew, and
    Tsze-sze held office yet the dismemberment of Loo increased, as an argument that
    men of virtue do not benefit a kingdom.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Mencius answers that the prince of Yu lost his state because he did not use
    Pih-le He, while the duke Muh of Ts'in became chief of the princes because he
    used him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Shun-yu K'wan cites singers and the wives of Hwa Chow and Ke Leang as examples
    of inner gifts becoming outwardly manifest and changing public manners.
  category: speech
  evidence_refs:
  - ev:6
