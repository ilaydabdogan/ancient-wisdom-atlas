canonical_text:
  quote: Such persons are nowadays called 'good ministers,' but anciently they were
    called 'robbers of the people.'
  summary: Mencius criticizes people who claim to serve rulers by expanding cultivated
    land, filling treasuries and arsenals, and forming alliances for military success.
    He says such people are now called good ministers but were formerly called robbers
    of the people, and he warns that enriching a ruler who lacks the right way and
    benevolence is like enriching Kee.
