canonical_text:
  quote: ''
  summary: Mencius contrasts sincere submission produced by virtue with force, teaches
    that benevolence brings glory to rulers while non-benevolence brings disgrace,
    urges rulers to honor virtuous and able people, and uses quotations from the Book
    of Poetry and the Ta'e Kea to illustrate universal submission, prudent preparation,
    harmony with divine ordinances, and self-caused calamity.
  language: English
  quote_policy: summarized
