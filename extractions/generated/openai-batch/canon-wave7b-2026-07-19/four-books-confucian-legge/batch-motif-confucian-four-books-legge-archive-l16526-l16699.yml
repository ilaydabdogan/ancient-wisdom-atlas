canonical_text:
  quote: ''
  summary: 'The passage presents several Analects chapters and notes: Mang Chwang''s
    filial piety is explained through continuity with his father''s ministers and
    government during mourning; Yang Fu is instructed by Tsang Shan to administer
    criminal justice with grief and pity rather than self-satisfaction; Tsze-kung
    warns against dwelling in a morally low position where evil reputation gathers;
    the superior man''s faults are compared to eclipses that everyone sees and then
    looks up to after correction; Confucius''s learning is described as drawn from
    the surviving doctrines of Wan and Wu among people; and Tsze-kung answers a claim
    that he surpasses Confucius by comparing himself to a low wall around a house.'
  language: English
  quote_policy: summarized
