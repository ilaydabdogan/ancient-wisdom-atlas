canonical_text:
  quote: He cultivates himself so as to give rest to all the people.
  summary: Tsze-lu asks what constitutes the superior man, and the Master answers
    that reverential self-cultivation extends to giving rest to others and to all
    the people, a concern associated with Yao and Shun. Yuan Zang waits while squatting;
    the Master rebukes him for improper conduct across the stages of life and strikes
    his shank with a staff. A youth messenger from Ch'üeh is discussed; the Master
    says the youth's adult seating and walking shoulder to shoulder with elders show
    a wish to become a man quickly rather than progress in learning.
  language: English
  quote_policy: quoted
