canonical_text:
  quote: ''
  summary: 'The passage reports several sayings of Mencius: an unnamed person responds
    to good words and actions like a stream or river overflowing; a person need only
    refrain from what his sense of righteousness forbids; intelligent virtue and prudence
    are often found among those who have endured sickness and trouble; friendless
    ministers and sons of concubines keep a wary heart under peril and become distinguished
    for intelligence; some people serve a prince for his favor.'
