canonical_text:
  quote: ''
  summary: The passage contains Analects chapters XI-XVI with Legge commentary. The
    Master discusses the uncertainty of pursuing riches, names fasting, war, and sickness
    as matters requiring special caution, hears the Shao music in Ch'i and is deeply
    affected, responds indirectly to a question about the ruler of Wei through the
    examples of Po-i and Shu-ch'i, expresses joy amid plain food and water while dismissing
    unrighteous wealth as a floating cloud, and says that further years devoted to
    the Yi might keep him from great faults.
  language: English
  quote_policy: summarized
