  quote: ''
  summary: The passage contains editorial commentary and Analects dialogue. It notes
    Kwan Chung's rewarded merits, a maxim about poverty and riches, a discussion of
    Mang Kung-ch'o's capacity, Confucius's answers to Tsze-lu about the qualities
    of a complete man, and Kung-ming Chia's correction of reports about Kung-shu Wan's
    silence, laughter, and taking.
  language: English
