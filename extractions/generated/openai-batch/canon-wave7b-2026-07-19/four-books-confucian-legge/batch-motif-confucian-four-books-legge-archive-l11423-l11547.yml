literal_observations:
- id: obs:1
  text: The commentary says Duke Hwan rewarded Kwan Chung's merits by conferring on
    him the domain of an officer who had committed an offense, and says the officer
    submitted to changed fortunes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A heading states that it is harder to bear poverty correctly than to carry
    riches, and a note says this sentiment may be controverted and compares Analects
    I, xv.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The commentary says Mang Kung-ch'o could have managed the affairs of the Chao,
    Wei, and Han families as chief officer, but his abilities were not equal to the
    duties of great officers of small states dealing with greater states.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tsze-lu asks what constitutes a complete man, and the Master answers first
    by combining the knowledge of Tsang Wu-chung, the freedom from covetousness of
    Kung-ch'o, the bravery of Chwang of Pien, the talents of Zan Ch'iu, and accomplishments
    in propriety and music.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Master then says that a complete man of the present day may be one who
    thinks of righteousness in the view of gain, is prepared to give up life in danger,
    and does not forget an old agreement.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The commentary glosses the old agreement as an agreement or covenant and explains
    it as a long agreement whose words are not forgotten over a whole life.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Master asks Kung-ming Chia whether it is true that his master Kung-shu
    Wan does not speak, does not laugh, and does not take.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'Kung-ming Chia replies that reports went beyond the truth: Kung-shu Wan speaks
    at the proper time, laughs when there is occasion for joy, and takes when doing
    so is consistent with righteousness.'
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: 'After Kung-ming Chia''s reply, the Master answers with a cautious question:
    ''So! But is it so with him?'''
  category: speech
  evidence_refs:
  - ev:8
