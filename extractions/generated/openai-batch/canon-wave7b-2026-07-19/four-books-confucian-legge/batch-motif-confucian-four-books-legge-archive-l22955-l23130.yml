  quote: He is the equal of Heaven.
  summary: The passage describes an exemplary person whose virtues are vast and deep,
    whose presence, speech, and actions win public reverence, and whose fame and influence
    extend throughout the world. It then describes the person of complete sincerity
    as able to order human relations, establish fundamental virtues, and understand
    the operations of Heaven and Earth. A final poetic image contrasts an embroidered
    robe covered by a plain garment with the superior man's concealment of virtue.
