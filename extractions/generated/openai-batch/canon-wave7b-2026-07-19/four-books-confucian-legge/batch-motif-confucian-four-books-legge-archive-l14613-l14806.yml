canonical_text:
  quote: ''
  summary: The passage includes commentary on Tsze-yu transforming a military town
    by music and government, then Analects chapters in which Confucius is invited
    by Kung-shan Fu-zao and Pi Hsi, Tsze-lu objects to such visits, Confucius replies
    that he could make an eastern Chau and later uses proverbs about hardness, whiteness,
    and a bitter gourd. It also gives Confucius' teaching to Tsze-chang on five practices
    that constitute perfect virtue and opens a further instruction to Yu on six words
    and six becloudings.
  language: English
