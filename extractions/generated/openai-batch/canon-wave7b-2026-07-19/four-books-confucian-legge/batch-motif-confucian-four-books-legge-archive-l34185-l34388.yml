canonical_text:
  quote: ''
  summary: The passage argues that rulers and ministers should govern by the ways
    of former kings and sages. Benevolence is required in high office; unprincipled
    rulers and ministers cause disorder, while material defenses and wealth are not
    the real safeguards of a kingdom. It cites the Book of Poetry on Heaven producing
    the overthrow of Chow as a warning against ease, describes negligent officers,
    urges ministers to admonish their sovereign, and presents the compass and square,
    the sages, Yaou, Shun, and Confucius as models for proper relations and virtuous
    conduct.
  language: English
  quote_policy: summarized
