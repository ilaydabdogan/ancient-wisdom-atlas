canonical_text:
  quote: '"The virtuous prince does not neglect his relations."'
  summary: 'The passage presents the duke of Chau instructing his son, the duke of
    Lu, on virtuous government: a ruler should not neglect relations, should employ
    great ministers, should not dismiss old families without serious cause, and should
    not expect one person to possess every talent. A later note explains the political
    situation and identifies the instruction as government counsel. A second chapter
    lists eight officers belonging to Chau; the commentary says they were brothers,
    four pairs of twins from one mother, all distinguished men, and interprets this
    as a sign of the vigor of the early Chau dynasty.'
