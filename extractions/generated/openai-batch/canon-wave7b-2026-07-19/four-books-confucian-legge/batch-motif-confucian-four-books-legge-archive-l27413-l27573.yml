canonical_text:
  quote: ''
  summary: Kung-sun Ch'ow asks Mencius how he and Kaou maintain an unperturbed mind.
    Mencius reports and critiques Kaou's principle, explains the relation between
    will and passion nature, and describes his own ability to understand words and
    nourish a vast, flowing passion nature through rectitude and accumulated righteous
    deeds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kung-sun Ch'ow asks Mencius to explain how Mencius maintains an unperturbed
    mind and how Kaou does the same.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mencius reports Kaou's principle that what is not attained in words is not
    to be sought in the mind, and what produces dissatisfaction in the mind is not
    to be helped by passion effort.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mencius accepts part of Kaou's position only as a concession but rejects the
    claim that what is not attained in words should not be sought in the mind.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mencius states that the will leads the passion nature, that the passion nature
    pervades and animates the body, and that the will is chief while the passion nature
    is subordinate.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mencius instructs that the will should be maintained firmly and that no violence
    should be done to the passion nature.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ch'ow asks how Mencius can say both that the will is chief and that one should
    not do violence to the passion nature.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mencius explains that the will can move the passion nature and the passion
    nature can move the will, using a man falling or running as an example of passion
    nature moving the mind.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: When asked how he surpasses Kaou, Mencius says that he understands words and
    is skillful in nourishing his vast, flowing passion nature.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mencius says that this passion nature is difficult to describe, is exceedingly
    great and strong, and, when nourished by rectitude and uninjured, fills all between
    heaven and earth.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Mencius describes the passion nature as the mate and assistant of righteousness
    and reason, and says that without it man is in a state of starvation.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Mencius says the passion nature is produced by accumulated righteous deeds,
    not by incidental acts of righteousness, and that it becomes starved when the
    mind does not feel complacency in conduct.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Mencius says Kaou has not understood righteousness because Kaou makes it something
    external.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The commentary reports that modern writers have compared Kaou's words to the
    essence of Buddhism and to Buddhistic nirvana.
  category: other
  evidence_refs:
  - ev:9
