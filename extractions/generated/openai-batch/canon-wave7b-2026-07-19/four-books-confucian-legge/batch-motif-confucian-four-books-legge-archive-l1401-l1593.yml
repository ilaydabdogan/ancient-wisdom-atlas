  summary: The passage gives sayings attributed to Confucius on moral selection in
    government, rule by gravity and kindness, filial and brotherly conduct as a form
    of government, truthfulness as necessary for a person to proceed, continuity of
    dynastic regulations, proper sacrifice only to one's own spirits, courage to do
    what is right, and the opening of a book on rites and music with criticism of
    the Chi family's use of eight rows of performers.
