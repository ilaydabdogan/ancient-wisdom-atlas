canonical_text:
  quote: ''
  summary: Mencius argues that receiving support is improper without a proper ground
    but acceptable when justified by service. He defends supporting a scholar or superior
    man who preserves the principles of the ancient kings and practices benevolence
    and righteousness, comparing this service to artisans' useful trades and distinguishing
    work done from mere intention. Wan Chang then asks about the small state of Sung,
    whose ruler is attempting true royal government while Ts'e and Ts'oo attack him.
    Mencius begins an example of T'ang in Po, neighboring Ko, whose dissolute chief
    neglects sacrifices; T'ang sends messengers, animals, and later laborers and food
    to address the chief's stated shortages.
  language: English
  quote_policy: summarized
