  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mencius argues that remuneration should be for service or work done, not for
    a person's intention, and uses a destructive worker as an example.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Wan Chang asks what should be done when Sung, a small state whose ruler is
    practicing true royal government, is hated and attacked by Ts'e and Ts'oo.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Mencius recounts that T'ang, while dwelling in Po next to Ko, sent messengers
    to ask why Ko's chief was neglecting sacrifices.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The chief of Ko says he lacks sacrificial victims; T'ang sends oxen and sheep,
