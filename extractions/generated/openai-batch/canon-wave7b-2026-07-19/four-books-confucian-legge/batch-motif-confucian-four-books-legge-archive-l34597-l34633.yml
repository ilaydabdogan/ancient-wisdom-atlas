canonical_text:
  quote: ''
  summary: 'A commentary explains that a ruler should act so as to win moral approval
    from the old and great families of the state. It illustrates this with a story:
    Duke Hwan of Ts''e, while hunting, meets an eighty-three-year-old man and asks
    for a blessing of longevity. The old man prays that the duke will value men over
    gems and gold, learn even from inferiors, and not offend ministers and people.
    When the duke objects that a sovereign cannot offend against ministers, the old
    man replies that some offenses may be forgiven through intercession, but cites
    Koo against T''ang and Chow against Woo as cases where there was no forgiveness.'
  language: English
  quote_policy: summarized
