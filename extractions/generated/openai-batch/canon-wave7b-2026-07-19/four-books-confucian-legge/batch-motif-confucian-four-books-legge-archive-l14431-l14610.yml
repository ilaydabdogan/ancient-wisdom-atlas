canonical_text:
  quote: ''
  summary: The passage begins Book XVII, Yang Ho. Yang Ho tries to obtain an encounter
    with Confucius by sending a pig as a present, leading Confucius to make a return
    visit at a time chosen to avoid him, though they meet on the road. Yang Ho urges
    Confucius to take office using images of a hidden jewel, a confused country, missed
    opportunity, and passing time. The Master states maxims about nature, practice,
    and changeability. At Wu-ch'ang, Confucius hears music and singing, jokes about
    using an ox knife to kill a fowl, and then affirms Tsze-yu's defense of instruction,
    propriety, and music. The passage ends with the opening of a new chapter about
    Kung-shan Fu-zao in rebellion.
  language: English
  quote_policy: summarized
