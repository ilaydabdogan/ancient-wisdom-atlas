canonical_text:
  quote: ''
  summary: 'The passage gives prescriptions for government: rulers should encourage
    officers, people, artisans, distant visitors, and princes of states through appropriate
    treatment. It then states that nine standard rules are practiced through singleness,
    that success depends on prior preparation, and that political confidence depends
    on a moral chain leading through friends, parents, sincerity, and understanding
    the good. It concludes by identifying sincerity as the way of Heaven and the attainment
    of sincerity as the way of men, with the sage embodying the right way naturally.'
  language: English
  quote_policy: summarized
