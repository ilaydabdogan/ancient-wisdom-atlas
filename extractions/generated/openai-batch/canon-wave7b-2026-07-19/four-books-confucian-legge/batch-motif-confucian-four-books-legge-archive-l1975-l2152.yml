canonical_text:
  quote: ''
  summary: 'The passage presents several Analects sayings and surrounding notes: Wang-sun
    Chia asks about a proverb contrasting court paid to a furnace with court paid
    to a southwest corner, and the Master replies that one who offends against Heaven
    has no one to pray to. The Master praises the regulations of Chau and says he
    follows them. In the grand temple he asks about everything and defends such inquiry
    as a rule of propriety. He teaches that archery should not be judged chiefly by
    piercing leather because strength differs. Tsze-kung wishes to abolish a sheep
    offering connected with the first day of each month. The notes discuss ritual
    settings, the Duke of Chau, sacrificial explanations, and two cautious comparative
    remarks.'
  language: English
  quote_policy: summarized
