canonical_text:
  quote: ''
  summary: Mencius explains that a person who takes office because of poverty should
    choose a low position and poor emolument rather than honor and wealth. He cites
    Confucius's humble service as keeper of stores and overseer of public fields.
    He then teaches that speaking of high matters while in a low situation is a crime,
    and that a scholar in a prince's court whose principles are not practiced should
    feel shame. In dialogue with Wan Chang, Mencius distinguishes improper regular
    pay or stated support from a prince from acceptable occasional assistance, such
    as a gift of grain, because rulers should assist people in need. A dispossessed
    prince is treated as an exception who may receive regular support from another
    prince.
  language: English
  quote_policy: summarized
