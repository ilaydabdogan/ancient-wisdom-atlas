canonical_text:
  quote: ''
  summary: 'The passage presents advice about governance: a ruler who restrains market
    taxes, avoids taxing goods at frontier passes, requires agricultural mutual aid
    without further taxes, and refrains from certain fines or cloth quotas will attract
    traders, travelers, farmers, and people from across the empire. The accompanying
    notes discuss market administration, frontier duties, agricultural taxation, and
    uncertainties in interpreting the final paragraph.'
