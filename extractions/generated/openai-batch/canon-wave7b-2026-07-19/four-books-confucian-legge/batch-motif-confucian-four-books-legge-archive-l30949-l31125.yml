canonical_text:
  quote: ''
  summary: The passage compares ancient dynastic land-allotment systems, presents
    Lung’s criticism of fixed taxation and praise of mutual aid, cites a Book of Poetry
    verse about rain on public and private fields, and recommends educational institutions
    for teaching human relations. It concludes that a real sovereign would take the
    addressee as an example and that the addressee would become teacher of the true
    sovereign.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sovereign of the Hea dynasty is said to have enacted a fifty-mow allotment
    and tax payment; the founder of Yin a seventy-mow allotment and mutual aid; and
    the founder of Chow a hundred-mow allotment and the share system.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that what was paid in all three land systems was effectively
    a tithe, and it defines the share system as mutual division and the aid system
    as mutual dependence.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lung says that for regulating lands, the system of mutual aid is best and
    the system of taxing is worst.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lung explains that the tax system fixes a regular amount by averaging several
    years, making the amount light in good years but still requiring full payment
    in bad years.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Lung describes people under burdensome taxation as distressed, unable to nourish
    their parents after a year of toil, driven to borrowing, and leaving old people
    and children lying in ditches and water channels.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage says the system of hereditary salaries is already observed in
    T'ang.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Book of Poetry verse asks that rain come down first on the public field
    and then on private fields.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speaker interprets the Book of Poetry verse as showing that only the mutual-aid
    system has a public field and that this system was recognized in the Chow dynasty.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage calls for establishing ts'eang, seu, heo, and heaou as educational
    institutions for instructing the people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The object of the educational institutions is stated to be the illustration
    of human relations.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: When human relations are illustrated by superiors, kindly feeling is said
    to prevail among the inferior people below.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage says that if a real sovereign arises, he will take an example
    from the addressee, making the addressee teacher of the true sovereign.
  category: speech
  evidence_refs:
  - ev:6
