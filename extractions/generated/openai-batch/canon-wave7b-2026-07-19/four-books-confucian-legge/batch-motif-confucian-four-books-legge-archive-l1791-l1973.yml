  summary: The passage presents commentary and Analects sayings on ritual propriety,
    including sacrifice to T'ai mountain, non-contentious archery, the relation of
    ceremonies to inner substance through the image of plain ground and colors, the
    loss of ancient records, the great sacrifice, and treating the dead and spirits
    as present in sacrifice.
