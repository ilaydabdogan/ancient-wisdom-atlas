canonical_text:
  quote: ''
  summary: 'The passage presents several Analects chapters and translator notes: Confucius
    evaluates Ch''an Wan''s withdrawal after political violence as pure but not necessarily
    perfectly virtuous; advises less over-deliberation in Chi Wan''s case; praises
    Ning Wu''s unusual conduct under disorder; expresses a wish to return to guide
    his ambitious but unformed disciples; commends Po-i and Shu-ch''i for not holding
    past wrongs in mind; criticizes Wei-shang Kao through a vinegar anecdote; condemns
    insincere appearances and concealed resentment; and begins a scene in which Yen
    Yuan and Chi Lu are invited to state their wishes.'
  language: English
  quote_policy: summarized
