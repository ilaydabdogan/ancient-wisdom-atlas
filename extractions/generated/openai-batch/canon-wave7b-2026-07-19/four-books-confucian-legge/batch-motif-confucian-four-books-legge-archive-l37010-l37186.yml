canonical_text:
  quote: ''
  summary: The passage includes a fragment about an unnamed man disabling and shooting
    arrows; Mencius's teaching that outward beauty is not enough without purity and
    that a wicked person may purify himself for sacrifice; Mencius's teaching that
    knowledge should reason from natural phenomena and imitate Yu's effortless management
    of waters; a statement that celestial phenomena allow calculation of an ancient
    solstice; and the beginning of an episode in which Mencius refuses to speak with
    the Master of the Right at Kung-hang's son's funeral.
  language: English
