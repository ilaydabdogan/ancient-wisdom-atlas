canonical_text:
  quote: Never has a man who has bent himself been able to make others straight.
  summary: 'The passage contrasts compliance and bending to power with Mencius''s
    account of the great man: one who abides in benevolence, propriety, and righteousness,
    practices principles for the people when employed, keeps them when not employed,
    and is not bent by riches, poverty, power, or force. It then begins a discussion
    of whether superior men of old took office.'
  language: English
  quote_policy: quoted
