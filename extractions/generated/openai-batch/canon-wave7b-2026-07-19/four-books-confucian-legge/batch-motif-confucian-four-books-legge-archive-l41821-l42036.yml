canonical_text:
  quote: ''
  summary: 'The passage argues that human beings are alike in kind: feet, mouths,
    ears, and eyes share common patterns of approval, and minds likewise approve principles
    of nature and righteousness. It then presents the New Mountain analogy: trees
    once beautiful are repeatedly cut and browsed, so the mountain appears bare; likewise,
    a human being’s proper goodness of mind may be damaged by repeated depletion.'
  language: English
  quote_policy: summarized
