canonical_text:
  quote: All men have a mind which cannot bear to see the sufferings of others.
  summary: The passage first describes a ruler whose humane practice causes neighboring
    peoples to regard him like a parent; such a ruler has no enemy, is called the
    minister of Heaven, and attains imperial dignity. Mencius then argues that all
    people possess an innate mind of commiseration. He illustrates this with the example
    of people suddenly seeing a child about to fall into a well and feeling alarm
    and distress without ulterior motive. He identifies four essential feelings—commiseration,
    shame and dislike, modesty and complaisance, and approving and disapproving—as
    the principles of benevolence, righteousness, propriety, and knowledge.
  language: English
  quote_policy: quoted
