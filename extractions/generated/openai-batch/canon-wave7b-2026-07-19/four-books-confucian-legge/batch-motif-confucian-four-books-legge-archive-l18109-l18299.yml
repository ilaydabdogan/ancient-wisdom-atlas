canonical_text:
  quote: What truly is within will be manifested without.
  summary: The passage presents Great Learning commentary on sincerity of thought,
    self-watchfulness in solitude, the exposure of hidden inner states, Tsang's saying
    about many eyes and hands, the adornment of the person by virtue, rectification
    of the mind as the basis for personal cultivation, and personal cultivation as
    a condition for regulating the family. Translator notes explain the organ imagery,
    discuss interpretations, and cite nearby Confucian texts for comparison.
  language: English
