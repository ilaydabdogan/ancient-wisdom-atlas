canonical_text:
  quote: I have heard of birds leaving dark valleys to remove to lofty trees, but
    I have not heard of their descending from lofty trees to enter into dark valleys.
  summary: Mencius argues against turning from a former Confucian master to Heu's
    southern doctrines. He invokes sage-rulers, Confucius's disciples' mourning, Tsang's
    refusal to give Yew Jo Confucius-like observances, an image of birds moving from
    valleys to trees, a quoted Praise Song, and an economic argument against Heu's
    uniform-price doctrine.
  language: English
  quote_policy: quoted
