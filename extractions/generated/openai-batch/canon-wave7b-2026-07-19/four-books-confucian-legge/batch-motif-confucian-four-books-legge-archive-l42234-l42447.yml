canonical_text:
  quote: Benevolence is man's mind, and righteousness is man's path.
  summary: The passage argues that human beings possess a moral nature that can prefer
    righteousness and propriety to preserving life. It gives examples of people declining
    life-preserving or danger-avoiding actions, especially refusing food when it is
    offered insultingly, and contrasts this with accepting great emolument without
    righteousness for external advantages. It closes with Mencius's statement that
    benevolence is the mind and righteousness the path. The opening note also recounts
    a story about bear's palms and King Shing of Ts'oo.
  language: English
  quote_policy: quoted
