canonical_text:
  quote: The path is not far from man.
  summary: The passage comments on the Mean as a path entered through virtues such
    as wisdom, benevolence, and valor; describes the course of the Mean as wide-ranging
    yet secret; states that common people can know and practice it in part while even
    sages cannot exhaust it; cites a Book of Poetry image of a hawk in heaven and
    fish in the deep to show the Way above and below; and begins a saying of the Master
    that the path is not remote from human consciousness.
  language: English
  quote_policy: quoted
