canonical_text:
  quote: ''
  summary: 'The passage presents several Mencian sayings and examples: Shun would
    abandon empire for filial concealment with his father; Mencius argues that position
    affects a person''s outward air; scholars require love, respect, and more than
    gifts; a sage alone fulfills Heaven-conferred bodily design; mourning practice
    must be judged by filial intention and circumstances; and the superior man''s
    teaching works in several ways, including influence like seasonable rain.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shun is described as valuing the empire as little as a worn-out sandal and
    as willing to carry his father into concealment near the seacoast, living happily
    and forgetting the empire.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mencius, while going from Fan to Ts'e, sees the king of Ts'e's son at a distance
    and says that position alters a person's air as nurture affects the body.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mencius says the king's son's residence, carriages, horses, and dress are
    mostly like those of other men, and that his distinctive look is caused by position.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mencius adds that an even more distinctive air should belong to one whose
    position is in the wide house of the world.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A story is given in which the prince of Loo calls at the T'e'e-chih gate in
    Sung, and the gatekeeper remarks that his voice is like that of Sung's prince.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mencius says feeding a scholar without love is like treating him as a pig,
    and loving him without respect is like keeping him as a domestic animal.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mencius says honoring and respecting exist before gifts, and that a superior
    man cannot be retained by empty demonstrations without their reality.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mencius says the bodily organs and their functions belong to Heaven-conferred
    nature, but only a sage can satisfy the design of the bodily organization.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: King Seuen of Ts'e wants to shorten mourning, and Kung-sun Ch'ow says one
    full year of mourning is better than abolishing it altogether.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Mencius compares Kung-sun Ch'ow's response to merely asking someone to be
    gentle while twisting an elder brother's arm, and says the person should be taught
    filial piety and fraternal duty.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: When a king's son whose mother has died asks through his tutor to observe
    a few months' mourning, Mencius distinguishes this from voluntary neglect, saying
    that where completion is impossible, even one added day is better than no mourning.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Mencius says the superior man teaches in five ways, including influence descending
    like seasonable rain, perfecting virtue, assisting the development of talents,
    and answering inquiries.
  category: speech
  evidence_refs:
  - ev:10
