canonical_text:
  quote: '"From these things we see how life springs from sorrow and calamity, and
    death from ease and pleasure."'
  summary: Mencius lists earlier figures who rose from humble, constrained, or obscure
    circumstances to office. He states that Heaven prepares a man for great office
    through mental suffering, bodily toil, hunger, poverty, and frustrated undertakings,
    so that the person is strengthened and improved. He extends the principle to ordinary
    reform and to statecraft, where counsel and external danger prevent ruin. The
    passage also includes brief sayings on refusal to teach and on knowing Heaven
    through knowing one's nature, plus translator notes including a tradition about
    Foo Yue being found after an imperial dream.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Mencius names Shun, Foo Yue, Kaou-kih, Kwan E-woo, Sun-shun Gaou, and Pih-le
    He as figures who rose or were called from fields, building frames, fish and salt,
    a jailer, seashore hiding, or a market place.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mencius says that when Heaven is about to confer a great office on a man,
    it first subjects his mind, body, circumstances, and undertakings to hardship.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The stated effects of these hardships are to stimulate the mind, harden the
    nature, and supply incompetencies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mencius says that men generally err and then can reform, and that distress
    of mind and perplexity in thought precede vigorous reformation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mencius says that a prince whose court lacks families attached to the laws
    and worthy counselors, and whose realm lacks hostile states or external calamities,
    will generally have a kingdom come to ruin.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mencius concludes that life springs from sorrow and calamity, while death
    springs from ease and pleasure.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mencius says that refusing to teach a man may itself be a way of teaching
    him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Mencius says that exhausting all of one's mental constitution leads to knowing
    one's nature, and that knowing one's nature leads to knowing Heaven.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A translator note says that the emperor Kaou-tsung dreamed that God gave him
    a good assistant, had a picture made of the man seen in the dream, searched through
    the empire, and found him in the wilderness of Foo-yen.
  category: sequence
  evidence_refs:
  - ev:8
