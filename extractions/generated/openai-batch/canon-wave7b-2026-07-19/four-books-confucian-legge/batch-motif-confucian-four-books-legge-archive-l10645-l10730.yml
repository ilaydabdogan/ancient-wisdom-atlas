canonical_text:
  quote: Good government obtains when those who are near are made happy, and those
    who are far off are attracted.
  summary: The passage presents several Analects-style exchanges on government. Confucius
    discusses whether a single saying can lead to a country's prosperity or ruin,
    warning especially against a ruler whose bad words meet no opposition. The Duke
    of Sheh asks about government, and the Master defines good government by its effects
    on nearby and distant people. Tsze-hsia, as governor, asks about government and
    is warned against haste and pursuit of small advantages. A following chapter begins
    with the Duke of Sheh describing people considered upright, but the supplied passage
    is truncated.
  language: English
