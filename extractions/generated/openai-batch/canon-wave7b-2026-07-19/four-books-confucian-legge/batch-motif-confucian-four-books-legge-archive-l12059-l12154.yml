canonical_text:
  quote: ''
  summary: 'The passage gives several short Analects chapters and editorial notes:
    Tsze-kung compares men and is corrected by the Master; the Master values personal
    ability over recognition by others; the Master praises readiness to discern deception
    without prior suspiciousness; Wei-shang Mau challenges Confucius as an insinuating
    talker, and Confucius rejects that role while saying he hates obstinacy; the Master
    uses a valued horse as an example of worth beyond strength; an unnamed person
    raises the question of recompensing injury with kindness.'
  language: English
  quote_policy: summarized
