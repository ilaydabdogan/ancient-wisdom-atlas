canonical_text:
  quote: ''
  summary: 'The passage presents several Analects conversations and notes: Confucius
    distinguishes true distinction from notoriety, teaches Fan Ch''ih about exalting
    virtue, correcting hidden evil, discovering delusion, benevolence, and knowledge,
    explains the use of upright persons to affect the crooked, and gives brief counsel
    on friendship, cultivated friendship, and government by example. Tsze-hsia explains
    one saying through examples of Shun and T''ang selecting worthy ministers.'
  language: English with some Chinese text and editorial notes
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tsze-chang asks what an officer must be to be called distinguished, and the
    Master asks what Tsze-chang means by distinction.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tsze-chang defines distinction as being heard of through the state and throughout
    his clan; the Master calls this notoriety rather than distinction.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Master describes the man of distinction as solid and straightforward,
    loving righteousness, examining people's words and countenances, and humbling
    himself to others.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Master describes the man of notoriety as assuming the appearance of virtue
    while his actions oppose it, and as resting in that character without self-doubt.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Fan Ch'ih walks with the Master under trees near rain altars and asks how
    to exalt virtue, correct cherished evil, and discover delusions.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Master says virtue is exalted by making what ought to be done the first
    business and success secondary.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Master says cherished evil is corrected by assailing one's own wickedness
    rather than that of others.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'The Master gives a case of delusion: allowing a morning''s anger to disregard
    one''s own life and involve one''s parents.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Fan Ch'ih asks about benevolence and knowledge; the Master answers that benevolence
    is to love all men and knowledge is to know all men.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Master says to employ the upright and put aside the crooked, so that the
    crooked can be made upright.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Tsze-hsia explains the saying by citing Shun's employment of Kao-yao and T'ang's
    employment of I Yin, after which those devoid of virtue disappeared.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Tsze-kung asks about friendship, and the Master advises faithful admonition,
