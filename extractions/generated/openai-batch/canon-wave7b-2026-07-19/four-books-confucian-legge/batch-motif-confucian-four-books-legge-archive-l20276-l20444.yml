canonical_text:
  quote: ''
  summary: The passage presents sections of The Doctrine of the Mean with commentary.
    It contrasts the superior man, who rectifies himself and waits calmly for Heaven’s
    appointments, with the mean man, who seeks luck on dangerous paths. It compares
    moral self-examination to an archer who misses the target and looks for the cause
    in himself. It then compares the way of the superior man to travel from near to
    far and ascent from low ground to height, cites the Book of Poetry on family harmony,
    and introduces spiritual beings as unseen yet pervasive powers used as an illustration
    of the Mean.
  language: English
  quote_policy: summarized
