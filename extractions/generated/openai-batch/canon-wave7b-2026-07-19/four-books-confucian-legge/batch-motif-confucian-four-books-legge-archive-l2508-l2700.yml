canonical_text:
  quote: ''
  summary: Analects Book IV, chapters III-X, with translator notes and commentary.
    The Master teaches that true virtue governs love and hatred, prevents wickedness,
    determines the proper relation to riches, honors, poverty, and meanness, and must
    be held by the superior man even in haste or danger. The passage also treats the
    rarity of loving virtue, the discernment of character through faults, the importance
    of hearing the right way before death, the unfitness of a truth-seeking scholar
    ashamed of poor clothing and food, and the superior man's practice of following
    what is right.
  language: English
  quote_policy: summarized
