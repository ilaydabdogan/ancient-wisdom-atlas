canonical_text:
  quote: Benevolence subdues its opposite just as water subdues fire.
  summary: 'The passage presents several sayings attributed to Mencius: true honor
    comes from being filled with benevolence and righteousness rather than desiring
    food, clothing, or public dignity; benevolence must be practiced with sufficient
    strength; benevolence has value only when matured; and proper teaching requires
    full models, as in archery and craft work.'
  language: English
  quote_policy: quoted
