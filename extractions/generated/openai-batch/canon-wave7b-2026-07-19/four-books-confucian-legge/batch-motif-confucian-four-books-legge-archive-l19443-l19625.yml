canonical_text:
  quote: The superior man embodies the course of the Mean; the mean man acts contrary
    to the course of the Mean.
  summary: 'The passage comments on the opening of The Doctrine of the Mean, describing
    the path of duty as rooted in Heaven and present within the self, requiring preservation,
    nourishment, and watchful self-scrutiny. It then quotes sayings attributed to
    Chung-ni or the Master: the superior man embodies and maintains the Mean, the
    mean man violates it through lack of caution, the virtue of the Mean is perfect
    but rare, and people fail to walk or understand it by either exceeding it or falling
    short of it.'
  language: English
  quote_policy: quoted
