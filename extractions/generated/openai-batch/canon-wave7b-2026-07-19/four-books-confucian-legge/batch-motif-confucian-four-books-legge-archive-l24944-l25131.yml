canonical_text:
  quote: What leisure have they to cultivate propriety and righteousness?
  summary: 'The passage first argues that people without a regulated livelihood cannot
    support parents, wives, and children or cultivate propriety and righteousness.
    Mencius then recommends concrete measures: mulberry trees, regulated animal breeding,
    protected farming time, and schools teaching filial and fraternal duties, leading
    to elders clothed and fed and to imperial dignity for the ruler. The next section
    opens a dialogue in which Chwang Paou tells Mencius that the king loves music;
    Mencius later tells the king that if his love of music is great, Ts''e may approach
    good government, and he questions whether music is more pleasant alone or shared
    with many. A hypothetical scene describes distressed people hearing the ruler''s
    bells, drums, fifes, and pipes.'
  language: English
  quote_policy: quoted
