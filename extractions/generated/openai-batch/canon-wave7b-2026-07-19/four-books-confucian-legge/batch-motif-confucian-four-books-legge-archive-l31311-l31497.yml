canonical_text:
  quote: ''
  summary: Heu Hing comes to T'ang claiming to follow Shin-nung and receives a dwelling
    from Duke Wan. His followers practice simple manual crafts. Ch'in Seang and his
    brother arrive with farming tools, and Seang becomes Heu Hing's disciple. Seang
    reports Heu Hing's doctrine that a worthy ruler should farm and cook alongside
    the people rather than maintain stores and armories. Mencius questions whether
    Heu Hing truly makes everything he uses, drawing out that he relies on exchange
    for a cap, cookware, and an iron plowshare. Editorial material frames the chapter
    as Mencius's refutation of this agriculturalist doctrine and defense of division
    of labor.
  language: English
  quote_policy: summarized
