canonical_text:
  quote: ''
  summary: Mencius advises a threatened ruler to strengthen moats and walls, defend
    with the people, and be prepared to die rather than have the people abandon him.
    In the next chapter, Duke Wan of T'ang asks what to do because Ts'e is fortifying
    See; Mencius begins to answer by citing King T'ae, who left Pin after repeated
    northern barbarian incursions. Editorial headings frame the advice as self-reliance
    and doing what is good and right.
  language: English
