canonical_text:
  quote: ''
  summary: Pih-kung E asks Mencius about the Zhou arrangement of dignities and emoluments.
    Mencius says the particulars cannot be fully learned because princes destroyed
    the records, but he gives a general outline of ranks, territorial allotments,
    and proportional incomes for rulers, ministers, officers, scholars, and government-employed
    commoners.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pih-kung E asks Mencius what arrangement of dignities and emoluments was determined
    by the house of Chow.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mencius replies that the particulars cannot be learned because princes, finding
    them injurious to themselves, made away with the records.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mencius says he has learned the general outline of the arrangement.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Mencius lists five degrees of dignity associated with the emperor and princely
    ranks: Emperor, Kung, How, Pih, and the equal-ranked Tsze and Nan.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Mencius lists six degrees of dignity associated with a sovereign''s government:
    sovereign, chief minister, great officers, scholars of the first class, scholars
    of the middle class, and scholars of the lowest class.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Territorial allotments are assigned by rank: the emperor receives a thousand
    li square; Kung and How each receive a hundred li square; Pih receives seventy
    li; Tsze and Nan each receive fifty li.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A chief whose territory is under fifty li cannot personally access the emperor;
    his land is attached to a How-ship and called a Foo-yung.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'Ministers and scholars in the emperor''s service receive territorial amounts
    corresponding to princely ranks: chief ministers as much as a How, great officers
    as much as a Pih, and first-class scholars as much as a Tsze or Nan.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: In a great state of a hundred li square, incomes are proportioned by rank
    from sovereign down to chief ministers, great officers, scholars, lower scholars,
    and government-employed commoners.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Government-employed commoners and scholars of the lowest class receive emolument
    equal to what they would have made by tilling the fields.
  category: relationship
  evidence_refs:
  - ev:7
