  summary: The passage contains commentary on principles of government and youth training,
    followed by translated Analects chapters in which Tsze-hsia defines learning through
    love of virtue, service to parents and prince, and sincerity with friends; the
    Master gives rules for the scholar; Tsang links funeral rites and sacrifice for
    parents with the renewal of popular virtue; Tsze-ch'in and Tsze-kung discuss how
    the Master learns about government in other countries; and the passage ends with
    the beginning of a saying about judging a man before and after his father's death.
  language: English
