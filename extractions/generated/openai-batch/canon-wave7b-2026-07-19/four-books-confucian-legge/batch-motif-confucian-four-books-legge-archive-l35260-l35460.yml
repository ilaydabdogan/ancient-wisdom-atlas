canonical_text:
  quote: '"A drowning empire must be rescued with right principles"'
  summary: The passage includes commentary on the pupil of the eye as an index of
    the heart, a contrast between deeds and mere words or manners, a dialogue in which
    Mencius distinguishes a general propriety rule from an emergency rescue, an analogy
    of the whole empire as drowning and needing rescue by right principles, an explanation
    of why a father should not personally teach his son, and the beginning of a teaching
    on serving parents by keeping oneself.
  language: English
  quote_policy: quoted
