canonical_text:
  quote: ''
  summary: 'The passage presents several Analects sayings and Legge commentary: Confucius
    praises Hui''s sustained virtue and joy despite poverty, judges several disciples
    fit for government, approves refusal of service to a powerful family, laments
    Po-niu''s mortal sickness as Heaven''s appointment, admonishes students toward
    perseverance and superior scholarship, and records Tan-t''ai Mieh-ming''s upright
    conduct.'
  language: English
  quote_policy: summarized
