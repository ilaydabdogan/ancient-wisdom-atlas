canonical_text:
  quote: ''
  summary: 'Mencius uses two analogies: a man will seek help for a harmless bent fourth
    finger because it differs from others, yet people fail to feel dissatisfied when
    their minds differ; likewise, people know how to nourish young t''ung or tsze
    trees but do not know how to nourish their own persons. A following chapter begins
    but is truncated in the supplied passage.'
  language: English
  quote_policy: summarized
