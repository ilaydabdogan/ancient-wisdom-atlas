canonical_text:
  quote: To subdue one's self and return to propriety, is perfect virtue.
  summary: The passage moves from a remark about Ch'ih, princes, ancestral temples,
    and audiences with the sovereign to Book XII, where Yen Yuan and Chung-kung ask
    Confucius about perfect virtue. Confucius defines perfect virtue for Yen Yuan
    as self-subdual and return to propriety, gives practical restraints on looking,
    listening, speaking, and movement, and gives Chung-kung guidance framed by hospitality,
    sacrifice, reciprocity, and freedom from complaint.
  language: English
  quote_policy: quoted
