  quote: ''
  summary: A commentary rejects the scholar Ch'ing's view as inconsistent with the
    Shooking and argues that a succession problem can be resolved by taking a disputed
    term as years of life rather than years of reign. It states that Wae-ping and
    Chung-yin/Chungjin were already dead when T'ae-kea succeeded to the throne, and
    that T'ae-ting died before his father while his brothers died at the ages of two
    and four.
