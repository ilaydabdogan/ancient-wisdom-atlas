canonical_text:
  quote: What is necessary is to rectify names.
  summary: The passage presents early chapters of Analects Book XIII and commentary
    on them. It frames the book as concerning state government and personal cultivation.
    The Master gives Tsze-lu instruction not to grow weary in leading and laboring
    for the people; instructs Chung-kung, a chief minister, to use officers, pardon
    small faults, and promote virtuous and talented men; and tells Tsze-lu that the
    first task in governing Wei would be to rectify names. The Master then explains
    a causal sequence from incorrect names to disordered language, failed affairs,
    decline of propriety and music, improper punishments, and popular confusion.
  language: English
  quote_policy: quoted
