canonical_text:
  quote: ''
  summary: T'aou Ying asks Mencius what would happen if Koo-sow murdered a man while
    Shun was emperor and Kaou-yaou was chief minister of justice. Mencius says Kaou-yaou
    would apprehend him, and that Shun could not forbid it because the law came from
    a proper source. The commentary explains this as a law of death for murder deriving
    from the will of Heaven and as legal authority superior to imperial will.
  language: English
  quote_policy: summarized
