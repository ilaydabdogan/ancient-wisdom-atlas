  quote: ''
  summary: 'The passage presents commentary and text describing Confucius''s conduct
    in relation to his prince: he treats gifts of food and animals with ritual care,
    refrains from offering cooked meat to ancestral spirits if it may have already
    been offered by the prince, tastes food reverently, arranges himself in court
    robes when ill and visited by the prince, and responds immediately when summoned
    by the prince.'
