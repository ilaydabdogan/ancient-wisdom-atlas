canonical_text:
  quote: I hate a semblance which is not the reality.
  summary: Mencius answers Wan Chang about the people Confucius called the village
    'good careful' people and 'thieves of virtue.' Mencius describes them as socially
    approved conformists whose conduct resembles virtue without reaching the principles
    of Yaou and Shun. He quotes Confucius rejecting misleading resemblances and concludes
    that the superior man restores an unchanging standard that rouses the masses to
    virtue. The passage then begins a new chapter on the transmission of doctrine
    from Yaou and Shun onward.
  language: English
  quote_policy: quoted
