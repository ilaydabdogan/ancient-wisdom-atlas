canonical_text:
  quote: '"He stands erect in the middle, without inclining to either side."'
  summary: Tsze-lu asks about energy. The Master distinguishes southern, northern,
    and self-cultivated energy; describes southern energy as gentle forbearance and
    northern energy as martial readiness to die; and presents the superior man as
    firm, harmonious, centered, and unchanging in changing political circumstances.
    The next chapter rejects wonder-working for future fame and abandoning the right
    path halfway, and says only the sage can accord with the Mean while unknown and
    without regret. The following chapter begins by saying the superior man's way
    reaches widely and far while remaining secret.
  language: English
  quote_policy: quoted
