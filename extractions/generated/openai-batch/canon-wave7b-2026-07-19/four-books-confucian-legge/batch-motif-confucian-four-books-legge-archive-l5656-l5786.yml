canonical_text:
  quote: ''
  summary: 'The passage presents several sayings and episodes concerning Confucius:
    he declines to rank himself with a sage or perfectly virtuous man, describes himself
    as tirelessly striving and teaching, refuses Tsze-lu''s request to pray for him
    during illness by saying his praying has long been done, and gives brief ethical
    contrasts between extravagance and parsimony, the superior and mean person, and
    balanced qualities in his own character.'
