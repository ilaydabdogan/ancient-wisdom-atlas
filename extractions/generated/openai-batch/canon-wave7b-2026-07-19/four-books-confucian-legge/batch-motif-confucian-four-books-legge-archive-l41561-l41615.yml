  summary: The passage introduces a chapter explaining Mencius's doctrine that human
    nature is good. It reports contrasting views that human nature may be made to
    practice good or evil, or that some people's nature is good while others' is bad.
    It gives ruler and family examples involving Wan, Woo, Yew, Le, Yaou, Seang, Koo-sow,
    Shun, Chow, K'e, and Pe-kan, followed by textual notes on related classical references
    and later advocates.
