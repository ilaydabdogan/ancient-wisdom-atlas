canonical_text:
  quote: ''
  summary: The passage contains a sequence of Analects sayings in which the Master
    answers several questions about filial piety, emphasizing propriety toward parents
    in life and death, parental anxiety over children's sickness, reverence beyond
    material support, and proper countenance in serving elders. It also presents the
    Master's assessment of Hui's quiet receptivity and a brief method for discerning
    a person's character through actions, motives, and settled commitments.
  language: English
  quote_policy: summarized
