canonical_text:
  quote: Disorder, like a swelling flood, spreads over the whole empire
  summary: The passage and notes present several Book XVIII encounters involving Confucius,
    Tsze-lu, and reclusive figures. Ch'ang-tsii and Chieh-ni work in a field and answer
    a request for a ford with criticism of Confucius' public engagement. Confucius
    replies that he must associate with humankind and act because right principles
    do not prevail. In a following episode, Tsze-lu meets an old agricultural recluse
    who hosts him, disappears before a second visit, and prompts Tsze-lu to defend
    taking office as a duty.
  language: English
  quote_policy: quoted
