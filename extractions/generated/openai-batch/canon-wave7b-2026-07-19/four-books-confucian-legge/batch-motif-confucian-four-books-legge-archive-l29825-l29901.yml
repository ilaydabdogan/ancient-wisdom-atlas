  quote: The errors of the superior men of old were like eclipses of the sun and moon.
  summary: Mencius answers questions about the Duke of Chow's appointment of Kwan-shuh
    to oversee the heir of Yin, denies that the duke knowingly appointed a rebel,
    and contrasts ancient superior men who reformed their errors with present superior
    men who persist in errors and defend them. The passage closes with a chapter transition
    stating that Mencius gave up office and prepared to return to his native state.
  language: English
