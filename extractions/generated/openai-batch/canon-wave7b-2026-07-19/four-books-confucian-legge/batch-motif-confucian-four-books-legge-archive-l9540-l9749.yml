canonical_text:
  quote: ''
  summary: 'The excerpt contains translated Analects exchanges and notes: Tsze-kung
    asks what may be dispensed with in government, and the Master places public faith
    above food; Chi Tsze-ch''ang and Tsze-kung discuss substance and ornament in the
    superior man; Duke Ai asks Yu Zo about scarcity and revenue, and Yu Zo recommends
    lighter taxation; Tsze-chang asks about exalting virtue and identifying delusion;
    Duke Ching asks Confucius about government, and Confucius answers with proper
    fulfillment of social roles.'
  language: English
  quote_policy: summarized
