canonical_text:
  quote: Virtue alone is not sufficient for the exercise of government; laws alone
    cannot carry themselves into practice.
  summary: Mencius first criticizes Chung through an anecdote about rejecting a brother's
    wealth, house, and goose meat while accepting other supports. The next chapter
    begins with analogies in which exceptional perception and skill still require
    instruments, and benevolent rulership still requires practiced models from the
    ancient kings.
  language: English
  quote_policy: quoted
