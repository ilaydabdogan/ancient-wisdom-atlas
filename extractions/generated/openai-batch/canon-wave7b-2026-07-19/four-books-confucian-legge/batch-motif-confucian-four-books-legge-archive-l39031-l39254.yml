canonical_text:
  quote: ''
  summary: The passage first presents examples concerning rulers, ministers, succession,
    and righteousness. It then has Wan Chang ask whether E Yin entered T'ang's service
    through cookery. Mencius rejects that account and portrays E Yin as a farmer devoted
    to the principles of Yaou and Shun, incorruptible by empire, horses, or any exchange
    contrary to righteousness. T'ang repeatedly invites him with silk gifts. E Yin
    first prefers his fields, then decides to serve so that the ruler and people may
    become like Yaou and Shun. He explains this by Heaven's plan that those who first
    understand should instruct others, and he goes to T'ang to urge action against
    Hea and the saving of the people. Mencius concludes with a general statement that
    sages may differ in their relation to courts and offices, but their courses aim
    at personal purity.
  language: English
  quote_policy: summarized
