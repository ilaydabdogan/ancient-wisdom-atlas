    share possessions with friends without resentment if they are spoiled. Yen Yuan
    wishes not to boast or display merit. The Master wishes to give rest to the aged,
    sincerity to friends, and tenderness to the young. The Master then laments not
    seeing someone who perceives and inwardly accuses himself of faults, and says
    a small hamlet may contain someone honorable and sincere like him, but not as
    fond of learning.
