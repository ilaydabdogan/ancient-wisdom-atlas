canonical_text:
  quote: "“How great is the path proper to the Sage!”"
  summary: The passage uses images of a vast stone or mountain-like mass and unfathomable
    water to illustrate abundance hidden behind small appearances. It cites the Book
    of Poetry on the unceasing ordinances of Heaven and the single virtue of King
    Wan. It then describes the Sage’s path as nourishing like overflowing water, rising
    to heaven, embracing ritual rules, awaiting the proper person, and being fulfilled
    through perfect virtue. The superior man cultivates nature, learning, propriety,
    and prudent conduct. An editorial note rejects a Christian messianic reading of
    the passage.
  language: English
  quote_policy: quoted
