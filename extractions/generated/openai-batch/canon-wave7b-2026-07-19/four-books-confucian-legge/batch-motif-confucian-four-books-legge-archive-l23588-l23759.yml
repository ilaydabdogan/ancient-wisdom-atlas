canonical_text:
  quote: The ancients caused the people to have pleasure as well as themselves, and
    therefore they could enjoy it.
  summary: The passage contrasts rule oriented toward benevolence and righteousness
    with concern for profit, then presents Mencius teaching King Hwuy that royal pleasure
    in parks, ponds, towers, and animals can be enjoyed only by wise and good rulers
    whose people also share in that pleasure. Mencius cites King Wan as a positive
    example and Kee as a negative example, then the next chapter begins with King
    Hwuy describing efforts during a bad year.
  language: English
  quote_policy: quoted
