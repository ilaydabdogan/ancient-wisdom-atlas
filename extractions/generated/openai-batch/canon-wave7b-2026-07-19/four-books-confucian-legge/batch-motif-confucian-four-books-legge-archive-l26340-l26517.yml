canonical_text:
  quote: ''
  summary: 'Mencius cites the Book of History to describe T''ang''s punitive justice
    as eagerly awaited by oppressed peoples like rain in drought. He contrasts this
    with Ts''e''s conduct in Yen: although Yen''s people expected deliverance from
    tyranny, Ts''e killed kin, chained younger people, demolished the ancestral temple,
    and removed precious vessels. Mencius advises restoring captives, stopping the
    removal of vessels, appointing a ruler after consulting the people, and withdrawing.
    In a second exchange, Duke Muh asks how to respond when common people did not
    die defending officers. Mencius replies that the officers had neglected famine
    sufferers while stores were full, and that the people''s conduct returned what
    had proceeded from their superiors; benevolent government would win love and loyalty.'
  language: English
  quote_policy: summarized
