  quote: ''
  summary: The passage contrasts the different public-service patterns of Pih-e, E-yun,
    and Confucius; presents Ch'ow questioning Mencius about Confucius' rank; records
    praises of Confucius by Tsae Go, Tsze-kung, and Yew Jo using analogies from animals,
    mountains, and waters; and opens a teaching on rule by force versus rule by virtue
    and benevolence.
