literal_observations:
- id: obs:1
  text: Pih-e, E-yun, and Confucius are presented as sages of antiquity with different
    ways of entering, remaining in, or retiring from office.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mencius says he has not attained what the ancient sages did, but wishes to
    learn to be like Confucius.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ch'ow asks whether Pih-e and E-yun should be ranked with Confucius, and Mencius
    answers negatively, saying there has never been another Confucius.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mencius says Pih-e, E-yun, and Confucius would have obtained the empire if
    each had ruled a territory of one hundred li, and none would have committed unrighteousness
    or killed an innocent person to obtain it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mencius says Tsae Go, Tsze-kung, and Yew Jo had sufficient wisdom to know
    the sage and would not flatter their favorite.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Tsae Go says that, in his view, the Master is far superior to Yaou and Shun.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tsze-kung says ceremonial ordinances reveal a prince's government, music reveals
