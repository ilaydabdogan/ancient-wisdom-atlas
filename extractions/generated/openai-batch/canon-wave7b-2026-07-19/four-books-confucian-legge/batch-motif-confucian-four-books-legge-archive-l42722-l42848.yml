canonical_text:
  quote: ''
  summary: The passage presents Mencius teaching that there is a nobility belonging
    to Heaven, made up of virtues such as benevolence, righteousness, self-consecration,
    and fidelity, and a nobility belonging to human office and rank. Ancient people
    cultivated the former and received the latter as a consequence; present people
    cultivate virtue to gain rank and then discard virtue, thereby losing rank as
    well. Mencius also states that all people desire honor, possess what is truly
    honorable within themselves, and that conferred honor can be removed by the one
    who grants it.
  language: English
  quote_policy: summarized
