  text: Six loved qualities—benevolence, knowing, sincerity, straightforwardness,
    boldness, and firmness—are each said to become beclouded when pursued without
    love of learning.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The heading and explanation state that learning is necessary to the completion
    of virtue and preserves the mind from being beclouded.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The commentary gives an example in which loving men without studying the principle
    of benevolence may lead someone to follow another into a well, so that both perish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Master asks his children why they do not study the Book of Poetry.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Odes are said to stimulate the mind, support self-contemplation, teach
