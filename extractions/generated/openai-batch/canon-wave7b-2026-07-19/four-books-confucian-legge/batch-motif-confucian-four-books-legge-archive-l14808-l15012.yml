canonical_text:
  quote: ''
  summary: The passage presents sayings and commentary on learning as necessary for
    completed virtue; the moral and social uses of the Book of Poetry; the importance
    of the Chau-nan and Shao-nan; the insufficiency of merely external ritual or musical
    objects; and warnings against false firmness, village respectability that damages
    virtue, and passing along hearsay.
  language: English
  quote_policy: summarized
