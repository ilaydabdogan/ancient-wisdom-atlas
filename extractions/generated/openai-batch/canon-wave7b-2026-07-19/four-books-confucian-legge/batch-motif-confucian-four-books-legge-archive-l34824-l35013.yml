canonical_text:
  quote: ''
  summary: 'The passage gives Mencius'' political and ethical teachings: self-caused
    harm precedes outside ruin; rulers gain or lose the empire by gaining or losing
    the people''s hearts; benevolent rule draws people as natural movement draws water
    and animals; delayed commitment to benevolence is likened to lacking stored medicine;
    people who reject propriety, righteousness, benevolence, and the path of duty
    abandon their proper dwelling and road; near duties to parents and elders are
    linked with tranquility; and political confidence begins with trust among friends.'
  language: English
  quote_policy: summarized
