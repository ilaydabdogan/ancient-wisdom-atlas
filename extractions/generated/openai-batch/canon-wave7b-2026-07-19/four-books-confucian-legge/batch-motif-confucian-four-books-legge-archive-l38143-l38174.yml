canonical_text:
  quote: ''
  summary: 'In a discussion involving Seang''s sorrow and joy, Cliang asks whether
    Shun rejoiced hypocritically. Mencius answers no and introduces an earlier anecdote:
    someone sent Tsze-ch''an of Ch''ing a live fish; Tsze-ch''an ordered his pond
    keeper to keep it in a pond, but the keeper cooked it and falsely reported that
    it had been released and swam away joyfully.'
