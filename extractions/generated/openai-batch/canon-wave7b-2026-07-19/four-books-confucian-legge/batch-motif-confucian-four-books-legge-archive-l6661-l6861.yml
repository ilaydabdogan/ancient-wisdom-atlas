literal_observations:
- id: obs:1
  text: Heaven is said not to let the cause of truth perish, and the people of K'wang
    are rhetorically asked what they can do to the speaker.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A high officer asks Tsze-kung whether the Master may be called a sage because
    of his varied ability.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tsze-kung says Heaven has endowed the Master unlimitedly, that he is about
    a sage, and that his ability is various.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Master says his low condition in youth led him to acquire ability in many
    things, but he describes those matters as mean and says the superior man does
    not need varied ability.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Lao reports a saying of the Master that, having no official employment, he
    acquired many arts.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Master denies being possessed of knowledge, but says that when an apparently
    empty mean person asks him anything, he sets it forth from one end to the other
    and exhausts it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Master says the Fang bird does not come and the river sends forth no map,
    and concludes that it is all over with him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The note identifies the Fang as a fabulous male bird associated with the appearance
    of a sage on the throne or the triumph of right principles; it also connects the
    river map with Fu-hsi and a dragon-headed, horse-bodied being rising from water.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: When the Master sees a person in mourning dress, a person in full formal dress,
    or a blind person approaching, he rises even if they are younger than he is; if
    passing by them, he does so hastily.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Yen Yuan says that when he looked up to the Master's doctrines they seemed
    higher, when he tried to penetrate them they seemed firmer, and when he looked
    before him they suddenly seemed behind him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Yen Yuan says the Master skillfully leads people by orderly method, enlarges
    his mind with learning, and teaches him the restraints of propriety.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Yen Yuan says he cannot give over studying the doctrines; after exerting all
    his ability, something seems to stand before him, but he finds no way to follow
    and lay hold of it.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: When the Master is very ill, Tsze-lu wants the disciples to act as ministers
