canonical_text:
  quote: ''
  summary: The passage explains that legitimate ordering of the kingdom requires virtue,
    rank or throne, and the proper time. It assigns exclusive authority over ceremonies,
    measures, and written characters to the Son of Heaven, describes uniform standards
    across the kingdom, limits the making of ceremonies and music to those with both
    proper virtue and throne, and presents Confucius as preserving and following dynastic
    ceremonies rather than instituting them. It further states that regulations require
    attestation, honor, and public credence if the people are to follow them.
  language: English
  quote_policy: summarized
