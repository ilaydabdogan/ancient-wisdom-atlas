canonical_text:
  quote: ''
  summary: The passage presents Tsze-chang asking the Master about beneficent government
    and the four bad things in rule. The Master defines beneficent, dignified, and
    majestic rule, then names cruel or oppressive administrative practices. A following
    saying states that a superior man requires recognition of Heaven's ordinances,
    propriety, and knowledge of words. The passage then transitions to commentarial
    material on The Great Learning as transmitted Confucian teaching and discusses
    interpretations of its title.
