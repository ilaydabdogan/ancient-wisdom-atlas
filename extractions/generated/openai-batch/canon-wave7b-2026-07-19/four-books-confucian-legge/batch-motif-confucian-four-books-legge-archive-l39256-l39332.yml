  quote: Mencius replied, "No; it was not so. Those are the inventions of men fond
    of strange things."
  summary: The passage says E Yin sought introduction to T'ang through the doctrines
    of Yaou and Shun rather than cookery, and includes a note connecting Heaven's
    destruction of Kee with E Yin's advising T'ang. It then begins Chapter VIII, where
    Wan Chang asks whether Confucius lodged with disreputable attendants; Mencius
    denies this and says Confucius lodged with Yen Ch'ow-yew in Wei.
  language: English
