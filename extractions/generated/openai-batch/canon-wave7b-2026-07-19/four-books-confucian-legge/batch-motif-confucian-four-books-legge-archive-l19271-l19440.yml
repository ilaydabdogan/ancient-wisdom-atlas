canonical_text:
  quote: What Heaven has conferred is called THE NATURE; an accordance with this nature
    is called THE PATH of duty; the regulation of this path is called INSTRUCTION.
  summary: The passage opens The Doctrine of the Mean by defining Heaven-conferred
    nature, the path of duty, and instruction. It says the path cannot be left even
    briefly; the superior man is cautious and watchful, especially alone. It defines
    equilibrium as the mind before pleasure, anger, sorrow, or joy are stirred, harmony
    as those feelings acting in due degree, and states that perfected equilibrium
    and harmony lead to happy order.
  language: English
  quote_policy: quoted
