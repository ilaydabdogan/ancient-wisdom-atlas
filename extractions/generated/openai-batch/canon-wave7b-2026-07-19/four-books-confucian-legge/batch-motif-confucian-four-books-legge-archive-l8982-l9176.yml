canonical_text:
  quote: ''
  summary: Confucius asks several disciples what they would do if a ruler recognized
    them. Tsze-lu, Yen Yu, and Kung-hsi Hwa describe political or ritual-service ambitions.
    Tsang Hsi describes a spring outing involving capped young men, boys, washing
    in the I, enjoying the breeze near rain altars, and returning singing; Confucius
    approves him. Tsang Hsi later asks why Confucius smiled at Tsze-lu, and Confucius
    explains that governing a state requires propriety and Tsze-lu's words lacked
    humility.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Confucius tells the disciples not to focus on his seniority and asks what
    they would like to do if some ruler were to know them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tsze-lu answers hastily that he could govern a distressed large state and,
    in three years, make the people bold and aware of righteous conduct; Confucius
    smiles at him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Yen Yu, also called Ch'iu, says he could govern a smaller territory and make
    plenty abound among the people, while leaving instruction in propriety and music
    to a superior man.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kung-hsi Hwa, also called Ch'ih, says he wishes to learn and to serve as a
    small assistant at ancestral-temple services and court audiences, wearing ceremonial
    robe and cap.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tsang Hsi, also called Tien, pauses while playing his lute, lays the instrument
    aside, rises, and says his wishes differ from those of the other three.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Tien says that in the last month of spring, with seasonal dress complete,
    he would go with five or six capped young men and six or seven boys to wash in
    the I, enjoy the breeze among rain altars, and return home singing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Confucius sighs and says he gives his approval to Tien.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the other three leave, Tsang Hsi remains and asks what Confucius thinks
    of their words; Confucius replies that each simply told his wishes.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Confucius explains that management of a state requires rules of propriety
