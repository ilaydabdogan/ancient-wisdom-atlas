canonical_text:
  quote: ''
  summary: Mencius confronts K'ung Keu-sin with famine suffering and uses a cattle-and-sheep
    analogy to draw an admission of guilt. He then reports this to the king of Ts'e,
    who also accepts guilt. In a separate exchange, Mencius prompts Ch'e Wa to remonstrate
    with the king; when Ch'e Wa is not heeded, he resigns. Mencius explains that unlike
    an office-holder or appointed adviser, he is free to advance or retire. A final
    episode describes Mencius on a condolence mission to T'ang with Wang Hwan, whom
    he does not address about the mission business.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mencius tells the governor that in famine years old and feeble people were
    found in ditches and water channels, while able-bodied people were scattered to
    the four quarters in numbers amounting to several thousands.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The governor replies that the state of things described does not belong to
    him, Keu-sin, to act upon.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mencius presents an analogy of a man charged with another person's cattle
    and sheep who must search for pasture ground and grass, and if he cannot find
    them must decide whether to return the charge or stand by while they die.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the analogy, the officer says that he is guilty.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mencius later tells the king that among five governors of the king's cities
    whom he knows, K'ung Keu-sin is the only one who knows his faults, and he repeats
    the conversation to the king.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king says that in this matter he is the guilty one.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mencius tells Ch'e Wa that there had seemed to be reason in declining the
    governorship of Ling-k'ew and requesting appointment as chief criminal judge,
    because that office would provide opportunities to speak his views.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ch'e Wa remonstrates with the king about a matter; when his counsel is not
    taken, he resigns his office and goes away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The people of Ts'e say that Mencius did well in the course he marked out for
    Ch'e Wa, but they do not understand the course he pursues for himself; Kung-too
    reports these remarks to Mencius.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Mencius states that a person in charge of an office should depart when prevented
    from fulfilling its duties, and one responsible for giving opinions should do
    likewise when his words are not attended to; he adds that he himself has no office
    or duty of speaking, and therefore can act freely in going forward or retiring.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Mencius, occupying the position of a high dignitary in Ts'e, goes on a mission
    of condolence to T'ang, while the king sends Wang Hwan, governor of Ka, as assistant
    commissioner.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Wang Hwan waits upon Mencius morning and evening during the journey to T'ang
    and back, but Mencius never speaks to him about the business of the mission.
  category: sequence
  evidence_refs:
  - ev:7
