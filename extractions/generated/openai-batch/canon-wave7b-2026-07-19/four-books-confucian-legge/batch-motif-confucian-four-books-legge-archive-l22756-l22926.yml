canonical_text:
  quote: He may be compared to heaven and earth in their supporting and containing...
    to the four seasons... and to the sun and moon.
  summary: The passage describes an exemplary ruler or sage whose institutions can
    be presented before spiritual beings and awaited by later sages without doubt;
    whose acts and words become enduring examples, laws, and lessons; and whose presence
    draws lasting praise. It then eulogizes Chung-ni as transmitting the doctrines
    of Yao and Shun, modeling the regulations of Wan and Wu, harmonizing with Heaven
    and conforming to water and land. Chung-ni is compared with Heaven and Earth,
    the four seasons, and the sun and moon; the passage also describes non-injurious
    nourishment of all things, non-colliding cosmic courses, and sagely qualities
    fitted for rule.
  language: English
  quote_policy: quoted
