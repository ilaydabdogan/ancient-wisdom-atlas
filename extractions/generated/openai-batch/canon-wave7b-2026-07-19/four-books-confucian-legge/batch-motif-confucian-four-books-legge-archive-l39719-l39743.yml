  summary: 'The passage compares wisdom to skill and sageness to strength through
    the example of shooting at a mark a thousand paces away: strength makes the shot
    reach the mark, but hitting it is not attributed to strength. The surrounding
    note discusses concerted music, blended instruments, signals of commencement and
    close, and a comment contrasting other worthies with Confucius, who is described
    as complete and as a harmonious air of heaven.'
