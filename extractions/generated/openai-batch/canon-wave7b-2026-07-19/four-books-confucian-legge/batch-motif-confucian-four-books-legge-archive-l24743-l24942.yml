canonical_text:
  quote: But to do what you do to seek for what you desire, is like climbing a tree
    to seek for fish.
  summary: Mencius questions a king about his desires, identifies territorial ambition,
    warns that the king's present means are misdirected and dangerous, and teaches
    that benevolent government and regulated livelihood are the proper roots of stable
    rule and moral conduct among the people.
  language: English
  quote_policy: quoted
