canonical_text:
  quote: '"The doings of the supreme Heaven have neither sound nor smell."--That is
    perfect virtue.'
  summary: The passage comments on sovereign authority, symbolic investiture by battle-ax,
    the awe produced by the ruler's demeanor, and the highest degree of virtue. It
    presents perfect virtue as imperceptible, like Heaven's action without sound or
    smell, and describes Tsze-sze's teaching as moving from solitary self-watchfulness
    to the tranquilization of the kingdom. The commentary also links Heaven or God,
    King Wan, judgment, and the overthrow of the Yin dynasty.
  language: English
  quote_policy: quoted
