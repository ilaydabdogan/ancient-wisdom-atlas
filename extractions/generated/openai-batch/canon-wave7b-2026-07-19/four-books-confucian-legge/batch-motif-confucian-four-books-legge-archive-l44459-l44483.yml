canonical_text:
  quote: ''
  summary: A question states that a minister surrounded by calumniators, flatterers,
    and sycophants cannot easily secure good government. The disciple Ch'in asks Mencius
    about the principles by which superior men of old accepted office. Mencius answers
    that they accepted office when respectfully received and when they believed the
    prince would put their words into practice; if their counsel was not enacted,
    they left, even if polite treatment continued.
