canonical_text:
  quote: ''
  summary: Mencius explains that the empire is assigned by Heaven either to the worthiest
    person or to the preceding ruler's son. He illustrates this with Shun, Yu, Yih,
    K'e, and other rulers, then describes E Yin correcting T'ae-ke'a by placing him
    in T'ung until he repents and reforms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mencius rejects the suggestion that Yu's transmission to his son proved inferiority,
    saying that Heaven gives the empire either to the worthiest or to the preceding
    emperor's son.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shun presented Yu to Heaven; after Shun died and mourning was completed, Yu
    withdrew to Yang-shing, and the people followed Yu rather than Shun's son.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yu presented Yih to Heaven; after Yu died and mourning was completed, Yih
    withdrew to the north of Mount Ke.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Princes, litigants, and singers went to or sang of K'e rather than Yih, saying
    that K'e was the son of their sovereign.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says that differences in sons' abilities, lengths of service,
    and outcomes of succession were from Heaven and not produced by man.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says that a private individual obtaining the empire must have
    virtue equal to Shun or Yu and must be presented to Heaven by the preceding emperor;
    it states that Confucius did not obtain the empire for this reason.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says that under natural succession, displacement by Heaven requires
    an emperor like Ke'e or Chow, and that Yih, E Yin, and Chow-kung did not obtain
    the empire.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: E Yin assisted T'ang so that T'ang became sovereign over the empire.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When T'ae-ke'a overturned the statutes of T'ang, E Yin placed him in T'ung
    for three years; T'ae-ke'a repented, reformed, listened to E Yin's lessons, and
    was returned with E Yin to Po.
  category: sequence
  evidence_refs:
  - ev:6
