canonical_text:
  quote: '"How is it possible that a superior man should be taken with a bribe?"'
  summary: Mencius argues that rulers who accomplish great deeds honor virtuous ministers
    by going to consult them rather than summoning them, citing T'ang with E-yun and
    Duke Hwan with Kwan Chung. Ch'in Tsin questions Mencius about accepting some gifts
    of silver and refusing another; Mencius explains that gifts for travel and self-protection
    had proper occasions, while money given without need would be a bribe. The passage
    then begins a new exchange in which Mencius questions the governor of P'ing-luh
    about a spearman who repeatedly loses his place in the ranks.
  language: English
  quote_policy: quoted
