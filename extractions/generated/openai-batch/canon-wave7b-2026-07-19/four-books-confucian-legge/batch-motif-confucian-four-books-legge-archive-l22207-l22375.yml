canonical_text:
  quote: ''
  summary: The passage from Chapter XXVI of The Doctrine of the Mean describes entire
    sincerity as ceaseless, far-reaching, substantial, brilliant, and capable of containing,
    overspreading, and perfecting all things. It says the individual who possesses
    it becomes co-equal with Earth and Heaven. It then describes Heaven and Earth
    as without doubleness and as producing things in an unfathomable way, illustrated
    through heaven holding celestial bodies and earth sustaining mountains and containing
    rivers and seas.
