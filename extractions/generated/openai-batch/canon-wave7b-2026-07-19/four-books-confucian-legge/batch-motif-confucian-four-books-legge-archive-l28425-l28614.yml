canonical_text:
  quote: Men have these four principles just as they have their four limbs.
  summary: The passage teaches that humans possess moral principles that should be
    developed; uses fire, spring-water, professional crafts, residence, and archery
    as analogies for benevolence, wisdom, self-examination, and moral cultivation;
    and gives Tsze-loo, Yu, and Shun as examples of delighting in correction and learning
    what is good from others.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Humans are said to have four principles in the same way that they have four
    limbs.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who says that he cannot develop these principles is described as
    playing the thief with himself; one who says this of his prince is described as
    playing the thief with his prince.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Development of the four principles is compared to fire beginning to burn and
    to a spring beginning to find vent.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: If fully developed, the principles are said to suffice to love and protect
    all within the four seas; if denied development, they are said not to suffice
    for serving one’s parents.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The arrow maker’s fear is described as men not being hurt, while the armor
    maker’s fear is described as men being hurt; the priest and coffin maker are paired
    as further occupational examples.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The choice of a profession is said to require great caution.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Confucius is quoted as saying that virtuous manners constitute the excellence
    of a neighborhood and that choosing a residence without them is unwise.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Benevolence is described as the most honorable dignity conferred by Heaven
    and as the quiet home in which a person should dwell.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Lack of benevolence and wisdom is said to result in absence of propriety and
    righteousness and in becoming the servant of other men.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A person ashamed of such a condition is advised to practice benevolence.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The person who would be benevolent is compared to an archer who adjusts himself
    before shooting and, after missing, seeks the cause of failure in himself rather
    than murmuring against those who surpass him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Tsze-loo is said to rejoice when told he has a fault.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Yu is said to bow to the speaker when he hears good words.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Shun is said to delight in what is good, regard virtue as common property,
    give up his own way to follow that of others, and learn from others to practice
    good.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: Shun is described as learning from others from the time of plowing, sowing,
    pottery, and fishing until he became emperor.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Taking example from others to practice virtue is said to help them in the
    same practice, and the superior man’s greatest attribute is said to be helping
    others practice virtue.
  category: speech
  evidence_refs:
  - ev:8
