canonical_text:
  quote: ''
  summary: The passage first gives a political maxim about a true ruler who follows
    the proper course of benevolence and righteousness and therefore need not seek
    battle, though he will overcome if he fights. It then begins an anecdote in which
    a king summons Mencius to court by messenger, citing illness; Mencius declines
    by saying he is unwell. The next day Mencius goes on a condolence visit, is questioned
    by Kung-sun Ch'ow, and later Mang Chung answers the king's inquiry and urges Mencius
    to go to court.
  language: English
  quote_policy: summarized
