canonical_text:
  quote: Let us not be like the man of Sung.
  summary: Mencius teaches Kung-sun Ch'ow that righteousness and the passion nature
    must be cultivated without forced assistance, illustrates this with the man of
    Sung who pulled up his corn and caused it to wither, then explains how he understands
    words by diagnosing defects of mind. Ch'ow questions whether this implies sagehood;
    Mencius answers with an anecdote in which Confucius refuses the title of sage,
    and he declines ranking himself among earlier exemplars.
  language: English
  quote_policy: quoted
