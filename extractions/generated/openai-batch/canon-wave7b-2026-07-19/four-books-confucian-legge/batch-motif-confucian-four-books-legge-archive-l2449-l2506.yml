canonical_text:
  quote: It is virtuous manners which constitute the excellence of a neighborhood.
  summary: The excerpt opens Book IV with two sayings attributed to the Master. The
    first says that an excellent neighborhood is constituted by virtuous manners and
    that a residence should be chosen where such manners prevail. The second contrasts
    those without virtue, who cannot long abide hardship or enjoyment, with the virtuous,
    who rest in virtue, and the wise, who desire virtue. Editorial commentary frames
    the book as concerned with virtue and explains the rule for selecting a residence.
