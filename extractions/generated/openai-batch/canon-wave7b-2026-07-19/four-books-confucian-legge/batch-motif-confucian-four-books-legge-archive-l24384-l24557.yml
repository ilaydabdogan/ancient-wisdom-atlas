canonical_text:
  quote: ''
  summary: Mencius declines to discuss the hegemonies of Hwan of Ts'e and Wan of Tsin
    and instead speaks about imperial government. He tells the king that imperial
    sway depends on love and protection of the people. He cites a reported incident
    in which the king saw an ox being led to consecrate a bell with blood, could not
    bear its frightened appearance, and ordered that a sheep be substituted. Mencius
    interprets this act as evidence of a benevolent heart sufficient for rulership,
    while also explaining why the people thought the king was merely sparing expense.
    He generalizes that the superior man cannot bear the death or cries of animals
    he has seen alive, and therefore keeps away from the cookroom. The king accepts
    Mencius's reading of his motive and cites the Book of Poetry about measuring the
    minds of others.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king asks Mencius to explain the transactions of Hwan of Ts'e and Wan
    of Tsin; Mencius replies that these affairs were not transmitted by Chung-ne's
    disciples and offers to speak about imperial government instead.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mencius says that the virtue needed for imperial sway is love and protection
    of the people, and that with this no power can prevent a ruler from attaining
    it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king asks whether he is competent to love and protect the people; Mencius
    answers yes and says he heard an incident from Hoo Heih.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the reported incident, the king is sitting aloft in the hall when a man
    appears leading an ox past the lower part of it.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The man says the ox is being taken to consecrate a bell with its blood.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king orders the ox to be let go because he cannot bear its frightened
    appearance, which he compares to an innocent person going to death.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the man asks whether the bell consecration should be omitted, the king
    says it cannot be omitted and orders that the ox be changed for a sheep.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Mencius tells the king that the heart shown in this incident is sufficient
    to carry him to imperial sway.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mencius says the people supposed the king grudged the animal, but that he
    knows the king acted because he could not bear the sight.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The king confirms that he changed the ox for a sheep because he could not
    bear the ox's frightened appearance, not because he grudged one ox.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Mencius says the people could not know the true reason when a large animal
    was changed for a small one, and asks what difference there was between an ox
    and a sheep if the issue was pain at guiltless death.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Mencius calls the king's conduct an artifice of benevolence and says the king
    had seen the ox but had not seen the sheep.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Mencius says the superior man cannot bear to see animals die after seeing
    them alive, cannot bear to eat their flesh after hearing their dying cries, and
