canonical_text:
  quote: ''
  summary: The passage first gives a statement that T'ang is small but sufficient
    for a good kingdom and cites a Book of History proverb about medicine that must
    disturb the patient to cure disease. It then narrates that after Duke Ting of
    T'ang dies, the crown prince sends Yen Yew to consult Mencius about funeral and
    mourning duties. Mencius cites filial propriety, three years' mourning, coarse
    mourning cloth, and congee as practices handed down across dynasties. The prince
    resolves to observe the three years' mourning, but aged relatives and officers
    oppose him by invoking former rulers and ancestral precedent. The prince, unsure
    of himself, asks Yen Yew to consult Mencius again.
  language: English
  quote_policy: summarized
