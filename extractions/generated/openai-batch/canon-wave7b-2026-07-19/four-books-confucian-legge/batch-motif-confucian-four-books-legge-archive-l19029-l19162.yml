canonical_text:
  quote: '"In a state, pecuniary gain is not to be considered to be prosperity, but
    its prosperity will be found in righteousness."'
  summary: The passage teaches that wealth is secured by many producers, few consumers,
    industrious production, and economical expenditure. It contrasts a virtuous ruler
    who uses wealth to enhance virtue with a vicious ruler who harms himself by accumulating
    wealth. It states that a benevolent sovereign inspires righteous people and secures
    public affairs and state wealth. Mang Hsien warns great households against petty
    revenue-seeking ministers, and the passage concludes that making revenue the chief
    business invites calamities from Heaven and injuries from men; true state prosperity
    lies in righteousness rather than gain.
  language: English
  quote_policy: quoted
