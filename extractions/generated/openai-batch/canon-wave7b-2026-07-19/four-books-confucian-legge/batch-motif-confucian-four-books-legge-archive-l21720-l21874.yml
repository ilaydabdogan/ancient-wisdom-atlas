canonical_text:
  quote: If another man succeed by one effort, he will use a hundred efforts.
  summary: The passage teaches that attainment requires studying what is good, inquiry,
    reflection, discrimination, and earnest practice. The superior person does not
    cease labor while anything remains unclear or unpracticed, and responds to others'
    quicker success with far greater effort. Such practice is said to make the dull
    intelligent and the weak strong. A following chapter connects sincerity and intelligence
    reciprocally, distinguishing what is ascribed to nature from what is ascribed
    to instruction, and a note frames this as the way of Heaven and the way of men.
  language: English
  quote_policy: quoted
