canonical_text:
  quote: ''
  summary: 'The passage contrasts a society governed by profit with one governed by
    benevolence and righteousness: the former ends in ruin, while the latter can stop
    warfare and rise to imperial sway. It then begins a chapter narrating how Mencius
    received silk gifts from two officials but later acknowledged them differently,
    prompting the disciple Uh-loo to seek instruction.'
  language: English
  quote_policy: summarized
