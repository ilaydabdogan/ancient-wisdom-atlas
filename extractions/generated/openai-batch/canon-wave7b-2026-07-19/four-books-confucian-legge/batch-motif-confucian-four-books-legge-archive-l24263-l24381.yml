canonical_text:
  quote: He who has no pleasure in killing men can so unite it.
  summary: After King Hwuy's death, his son Hih, called King Seang, is described as
    succeeding him. In an interview, Mencius answers that the empire can be united
    by one who takes no pleasure in killing people, because the people would unanimously
    give the empire to such a person. He illustrates this with drought-stricken grain
    revived by rain and with people flocking irresistibly to a humane ruler like water
    flowing downward. The passage then begins a new chapter concerning King Seuen
    of Ts'e and includes an editorial summary about loving and protecting the people
    as the path to imperial rule.
  language: English
  quote_policy: quoted
