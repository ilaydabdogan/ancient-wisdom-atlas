canonical_text:
  quote: The tendency of man's nature to good is like the tendency of water to flow
    downwards.
  summary: The passage presents a dialogue in which Mencius rejects analogies that
    portray human nature as morally neutral or as something that must be forcibly
    shaped into virtue. He argues through images of willow wood and flowing water
    that forcing human beings toward what is not good violates their proper nature,
    while goodness accords with their natural tendency.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Mencius asks whether cups and bowls can be made from willow while leaving
    the nature of the willow untouched, and says violence and injury to the willow
    are required.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mencius says that if willow must be injured to make cups and bowls, then Kaou's
    principle would require violence and injury to humanity in order to fashion benevolence
    and righteousness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mencius warns that such words would lead people to reckon benevolence and
    righteousness as calamities.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The philosopher Kaou says man's nature is like water whirling in a corner,
