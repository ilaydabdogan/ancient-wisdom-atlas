canonical_text:
  quote: "“all within the four seas will be his brothers.”"
  summary: The passage explains Tsze-niu’s anxiety over his eldest brother Hwan T’ui,
    who is said to be contemplating rebellion. A quoted saying teaches that death
    and life are appointed, riches and honors depend on Heaven, and the superior man’s
    reverent conduct and propriety make all within the four seas his brothers. The
    next chapter begins with Tsze-chang asking about intelligence, and the Master’s
    answer starts with resistance to gradual slander. Commentary interprets the brotherhood
    saying as non-genealogical and discusses the phrase “four seas” as a territorial
    and cosmological expression found in other classical texts.
  language: English
  quote_policy: quoted
