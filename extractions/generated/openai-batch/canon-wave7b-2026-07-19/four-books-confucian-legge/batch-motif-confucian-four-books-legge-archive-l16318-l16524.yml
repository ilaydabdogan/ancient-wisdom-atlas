canonical_text:
  quote: ''
  summary: The passage contains Book XIX sayings attributed to Tsze-hsia, Tsze-yu,
    and the philosopher Tsang, with Legge's notes. It treats great and small virtues,
    criticism and defense of Tsze-hsia's teaching method, the relation of office and
    study, proper mourning, judgments on Chang/Tsze-chang, grief for parents as a
    disclosure of character, and Mang Chwang's filial piety in preserving his father's
    ministers and government.
  language: English
  quote_policy: summarized
