canonical_text:
  quote: "“Chung-ni is the sun or moon, which it is not possible to step over.”"
  summary: The passage presents Tsze-kung defending Confucius through images of a
    high-walled house, celestial bodies, and unclimbable heaven; describes a hypothetical
    sage-ruler whose people would immediately respond to his governance; and begins
    Book XX with Yao charging Shun, and Shun charging Yu, concerning Heaven-determined
    succession and the welfare of the realm.
  language: English
  quote_policy: quoted
