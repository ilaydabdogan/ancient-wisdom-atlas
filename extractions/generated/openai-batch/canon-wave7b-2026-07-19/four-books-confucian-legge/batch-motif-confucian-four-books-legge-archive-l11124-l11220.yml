  quote: ''
  summary: In Book XIV, Hsien asks what is shameful, and the Master answers that focusing
    only on salary under both good and bad government is shameful. The Master also
    distinguishes repression of vices from perfect virtue, rejects comfort-loving
    as suitable for a scholar, and advises different degrees of boldness in speech
    and action under good or bad government.
