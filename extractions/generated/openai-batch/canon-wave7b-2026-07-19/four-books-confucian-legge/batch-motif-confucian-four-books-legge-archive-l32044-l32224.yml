canonical_text:
  quote: Heaven gives birth to creatures in such a way that they have one root, and
    E makes them to have two roots.
  summary: Mencius delays seeing E Che, then frames the interview as a correction
    of E's Mohist errors. The passage contrasts Mohist universal love and simple funerals
    with graded parental affection, E's sumptuous burial of his parents, an infant-in-danger
    analogy, and an ancient anecdote about people reacting with shame and distress
    when seeing unburied parents' bodies devoured by animals and insects.
  language: English
  quote_policy: quoted
