canonical_text:
  quote: ''
  summary: Mang Ke questions Kung-too about the claim that righteousness or respect
    is internal, using examples involving an elder brother, an older villager, and
    wine poured at a feast. Kung-too reports the difficulty to Mencius, who supplies
    a counter-argument involving respect for an uncle and for a younger brother personating
    a dead ancestor. A note explains the sacrificial personator as a descendant into
    whose body the ancestor’s spirit was supposed to descend. Mang Ke repeats his
    objection, and Kung-too answers with an analogy about drinking hot things in winter
    and cold things in summer. The next chapter begins with Kung-too citing Kaou’s
    claim that human nature is neither good nor bad.
  language: English
  quote_policy: summarized
