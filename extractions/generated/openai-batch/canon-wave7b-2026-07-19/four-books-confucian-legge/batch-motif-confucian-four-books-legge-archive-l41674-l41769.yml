  quote: Seek and you will find them. Neglect and you will lose them.
  summary: 'The passage presents a moral-psychological account of human nature: specific
    feelings correspond to benevolence, righteousness, propriety, and knowledge, which
    are described as internally furnished rather than externally infused. A cited
    ode from the Book of Poetry says Heaven produced mankind and gave human faculties
    and relations their laws; Confucius is quoted as affirming that the maker of the
    ode understood human nature. The next chapter begins with Mencius saying that
    in good years the children of the people are mostly good.'
