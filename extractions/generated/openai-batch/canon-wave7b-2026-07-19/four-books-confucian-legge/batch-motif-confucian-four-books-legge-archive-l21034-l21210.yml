  quote: ''
  summary: The passage presents commentary on ritual service, ancestral temple ceremonies,
    seasonal sacrifices, filial piety, and government. It then gives the Master's
    teaching that the government of Kings Wan and Wu is preserved in wooden and bamboo
    records, that government flourishes with the right people and decays without them,
    and that securing proper officers depends on the ruler's cultivated character,
    duty, benevolence, service to parents, knowledge of people, and knowledge of Heaven.
