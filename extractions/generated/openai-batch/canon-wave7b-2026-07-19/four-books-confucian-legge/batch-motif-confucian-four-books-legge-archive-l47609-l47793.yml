canonical_text:
  quote: ''
  summary: 'The passage contains several Mencius episodes and sayings: Mencius rejects
    Kaou''s inference that Yu''s music was superior because Yu''s bell-knob was worn;
    Mencius considers whether to request the opening of a famine granary and compares
    the situation to Fung Foo, a former tiger-seizer whose return to tiger-seizing
    delighted the crowd but made scholars laugh; Mencius distinguishes bodily appetites,
    moral relations, and the appointment of Heaven; and Haou-sang Puh-hae asks about
    Yo-ching, whom Mencius calls a good and real man.'
  language: English
  quote_policy: summarized
