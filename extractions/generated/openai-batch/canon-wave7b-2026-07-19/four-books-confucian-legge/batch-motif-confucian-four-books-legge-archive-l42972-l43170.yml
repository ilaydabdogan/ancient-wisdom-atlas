literal_observations:
- id: obs:1
  text: A comment attributed to Choo He says affairs must proceed according to their
    laws, and that neglect by a master or pupil prevents teaching or learning.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man of Jin asks Uh-loo whether eating or observing rules of propriety in
    eating is more important, and Uh-loo answers that propriety is more important.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same questioner asks whether gratifying sexual appetite or doing so according
    to propriety is more important, and Uh-loo again answers that propriety is more
    important.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The questioner raises extreme cases: observing propriety may lead to starvation,
    and observing a marriage rule may prevent marriage.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Uh-loo cannot answer the extreme-case questions and goes to Tsow to tell them
    to Mencius.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mencius replies with an analogy in which failing to adjust lower extremities
    and only leveling tops can make a small piece of wood appear higher than a high
    building's peak.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Mencius uses a weight analogy: gold is heavier than feathers, but the saying
    does not compare a single clasp of gold with a wagonload of feathers.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mencius says that if eating or sexual appetite is made of utmost importance
    while propriety is made of little importance, the comparison is distorted.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Mencius proposes asking whether one would twist an elder brother's arm and
    snatch his food in order to get food for oneself.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Mencius proposes asking whether one would get over a neighbor's wall and drag
    away his virgin daughter in order to obtain a wife.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Keaou of Tsaou asks whether the saying that all men may be Yaos and Shuns
    is true, and Mencius answers that it is.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Keaou mentions the heights of King Wui and T'ang, states his own height, says
