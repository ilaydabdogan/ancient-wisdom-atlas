canonical_text:
  quote: "“Hold it fast, and it remains with you. Let it go, and you lose it.”"
  summary: The passage describes the mind as requiring proper nourishment and preservation.
    Mencius uses images of morning calm, growth and decay, heat and cold, chess training,
    a distracting swan, and a choice between fish and bear’s paws to discuss moral
    attention, wisdom, and the preference for righteousness over life.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage describes the mind in the calm air of morning, between night and
    day, as feeling human desires and aversions in a weak degree.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Daytime events are said to fetter and destroy those human feelings repeatedly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When repeated fettering makes night’s restorative influence insufficient,
    the nature is said to become not much different from that of irrational animals.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Mencius states that if something receives proper nourishment it will grow,
    and if it loses proper nourishment it will decay away.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Confucius is quoted as saying that holding it fast makes it remain, letting
    it go loses it, and its outgoing and incoming cannot be defined by time or place;
    Mencius identifies this as the mind.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mencius says that it is not surprising that the king is not wise.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mencius gives an example of an easily growing thing that receives one day
    of genial heat and ten days of cold and therefore cannot grow.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mencius says that he rarely has an audience with the king, and that after
    he retires others come who act upon the king like cold.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Chess playing is described as a small art requiring a person’s whole mind
    and will, and Chess Ts’ew is described as the best chess player in the kingdom.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the teaching example, one learner gives his whole mind to listening to
    Chess Ts’ew, while another seems to listen but thinks of a swan and of shooting
    it.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: The distracted learner does not equal the attentive learner, and Mencius denies
    that the reason is inferior intelligence.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Mencius says he likes fish and bear’s paws, but would let fish go and take
    bear’s paws if both cannot be had; he then says he likes life and righteousness,
    but would let life go and choose righteousness if both cannot be kept.
  category: speech
  evidence_refs:
  - ev:7
