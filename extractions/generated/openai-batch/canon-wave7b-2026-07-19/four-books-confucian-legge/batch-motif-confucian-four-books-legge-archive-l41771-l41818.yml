canonical_text:
  quote: ''
  summary: 'The passage states that the nature of all people is good like that of
    sages, and that moral differences are not due to different Heaven-conferred powers
    but to circumstances that let minds be ensnared and drowned in evil. It then gives
    an analogy of barley sown in the same ground and season: it grows and ripens,
    while differences in yield arise from soil quality and nourishment from rain.'
  language: English with embedded Chinese terms and notes
  quote_policy: summarized
