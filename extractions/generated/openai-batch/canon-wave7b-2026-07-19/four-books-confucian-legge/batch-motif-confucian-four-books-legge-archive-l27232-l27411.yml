canonical_text:
  quote: At forty, I attained to an unperturbed mind.
  summary: Ch'ow asks Mencius whether a great political charge would perturb his mind.
    Mencius says he attained an unperturbed mind at forty and discusses ways of nourishing
    valor, contrasting Pih-kung Yew's fearlessness, Mang She-shay's indifference to
    victory and defeat, and Tsang's teaching that great valor depends on self-examination
    and uprightness.
  language: English
  quote_policy: quoted
