canonical_text:
  quote: ''
  summary: 'The passage concludes an argument about covering bodies and proper filial
    interment, followed by a report that E accepts Mencius''s instruction. It then
    opens Book III, Part II, Chapter I: Ch''in Tae urges Mencius to visit princes
    for possible political effect, citing a History maxim about bending one cubit
    to straighten eight. Mencius responds with an account of Duke King of Ts''e summoning
    a forester by a flag during a hunt; the forester refuses, the duke intends to
    kill him, and Confucius comments on determined and brave officers who keep death
    in view.'
  language: English, with editorial Chinese transcription/OCR fragments
  quote_policy: summarized
