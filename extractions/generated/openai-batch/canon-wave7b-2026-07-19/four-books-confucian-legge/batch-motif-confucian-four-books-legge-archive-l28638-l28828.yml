canonical_text:
  quote: He who finds the proper course has many to assist him.
  summary: The passage first contrasts Pih-e, who refuses gifts from princes for reasons
    of purity, with Hwuy of Lew-hea, who serves even an impure prince while maintaining
    his own principles; Mencius judges both as defective extremes. It then presents
    Mencius's teaching that Heaven-given timing is inferior to Earth-given strategic
    position, and that Earth-given position is inferior to the accord of people. Examples
    of besieged and abandoned cities illustrate that walls, terrain, arms, and supplies
    do not secure rule as much as the proper course, which brings assistance and obedience.
  language: English
  quote_policy: quoted
