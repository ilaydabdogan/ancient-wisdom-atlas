canonical_text:
  quote: ''
  summary: The passage reports a note about wives whose lament for slain officers
    was said to affect the state and rent a city wall. Mencius then answers by invoking
    Confucius's departure from Loo after a neglected sacrificial courtesy, explaining
    that superior conduct may be misunderstood. A following chapter presents Mencius's
    account of political degeneration from the three kings to the five chiefs and
    later rulers, describes imperial inspection tours with rewards and sanctions for
    princes, and introduces Duke Hwan's covenant assembly at K'wei-k'ew with a bound
    victim and written agreement.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hwa and Ke Leang are described as officers slain in battle; their wives bewailed
    them so pitifully that the whole state was affected, and their cries were said
    to rent the wall of the capital of Ts'e.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mencius answers by recounting that Confucius served as chief minister of justice
    in Loo and that the prince did not follow his counsels.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: After a solstitial sacrifice, a portion of the sacrificial flesh was not sent
    to Confucius, and he went away without taking off his ceremonial cap.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: People who did not know Confucius thought he left because of the flesh; those
    who knew him thought he left because the usual ceremony had been neglected.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mencius states that Confucius wished to leave on the occasion of a small offense
    and not without an apparent cause, and adds that not all people can understand
    a superior man's conduct.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The commentary explains that Confucius determined to leave Loo after the duke
    accepted gifts of singing girls and horses and gave himself to dissipation, but
    Confucius sought another stated reason for leaving.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mencius says that the five chiefs of the princes were sinners against the
    three kings, the present princes against the five chiefs, and the great officers
    of the present day against the princes.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mencius describes the emperor visiting princes on a tour of inspection and
    princes attending the emperor's court to give a report of office.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The described customs include examining plowing in spring and reaping in autumn,
    supplying seed when deficient, and assisting where a crop was deficient.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: When inspection found reclaimed ground, cultivated old fields, care for the
    old, honor for the worthy, and talented men in office, the prince was rewarded
    with added territory.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: When inspection found wild or weedy ground, neglect of the old, failure to
    honor the worthy, and hard tax-gatherers in office, the prince was reprimanded.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Repeated failure by a prince to attend court brought degradation of rank,
    then loss of territory, and then movement of imperial forces and removal from
    government.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Mencius says the emperor commanded punishment without inflicting it, while
    the princes inflicted punishment without commanding it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Mencius says the five chiefs dragged the princes to punish other princes,
    and for that reason he calls them sinners against the three kings.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: At the assembly of princes in K'wei-k'ew, Duke Hwan bound the victim and placed
    the writing upon it, but did not slay it to smear their mouths with blood.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The commentary describes a customary covenant rite in which a victim was slain
    over a square pit, its ear was cut, its blood was collected, articles of agreement
    were read facing north in the presence of the spirits of the sun and moon, participants
    smeared their mouths with blood, and the victim and agreement were buried.
  category: sequence
  evidence_refs:
  - ev:7
