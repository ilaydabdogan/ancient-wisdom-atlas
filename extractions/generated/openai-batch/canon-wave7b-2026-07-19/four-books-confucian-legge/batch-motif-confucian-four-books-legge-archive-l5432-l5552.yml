  quote: ''
  summary: The passage contains Analects chapters and Legge notes in which the Master
    speaks about rare moral excellence, constancy, restraint in hunting and fishing,
    knowledge gained through hearing, selecting, seeing, and remembering, and the
    reception of a purified visitor from Hu-hsiang despite disciples' doubts. The
    notes also summarize subjects of Confucius's teaching and interpret his restraint
    toward animals as humane conduct.
