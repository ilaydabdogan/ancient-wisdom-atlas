canonical_text:
  quote: ''
  summary: Mencius answers King Seuen of Ts'e on royal fondness for beauty by citing
    King T'ae and a Poetry passage about T'ae and the lady of Keang choosing a settlement
    site. He argues that if the ruler allows the people to satisfy the same desire,
    imperial sway is attainable. In later exchanges, Mencius uses analogies of neglected
    dependents and an incompetent judge to confront the king about bad government.
    He then teaches that an ancient kingdom is marked by hereditary ministers, that
    appointments and dismissals should be based on broad public judgment plus examination,
    and that capital punishment should likewise be publicly grounded and investigated.
    The passage ends with the king asking about T'ang banishing Kee and King Woo smiting
    Chow.
  language: English
  quote_policy: summarized
