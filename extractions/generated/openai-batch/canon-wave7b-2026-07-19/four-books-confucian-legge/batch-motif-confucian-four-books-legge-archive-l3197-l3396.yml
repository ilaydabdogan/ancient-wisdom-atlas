canonical_text:
  quote: ''
  summary: The passage contains translated Analects material and commentary. It notes
    K'ai reading the Shu-ching during a discussion of taking office; presents Confucius
    as speaking of withdrawal from the world and Tsze-lu reacting eagerly to the idea
    of coastal wandering by raft; records Confucius assessing several disciples' practical
    capacities while withholding judgment on perfect virtue; compares Tsze-kung unfavorably
    with Hui; reproves Tsai Yu for sleeping by day and changes from trusting words
    to checking conduct; rejects Shan Ch'ang as firm because of his passions; and
    has Tsze-kung state a negative reciprocity principle that Confucius says he has
    not attained.
  language: English
  quote_policy: summarized
