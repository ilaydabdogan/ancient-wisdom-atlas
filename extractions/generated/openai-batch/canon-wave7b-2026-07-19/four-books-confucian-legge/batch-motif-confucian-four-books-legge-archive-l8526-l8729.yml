canonical_text:
  quote: ''
  summary: 'The passage collects several Analects sayings and Legge notes concerning
    Confucius and disciples: a prediction about Yu, Min Tsze-ch''ien''s advice not
    to rebuild the Long Treasury unnecessarily, Confucius''s admonition and defense
    of Yu/Tsze-lu, a comparison of Shih and Shang by the due mean, censure of Ch''iu
    for enriching the Chi family, brief character judgments on disciples, a contrast
    between Hui and Ts''ze, and a definition of the good man as distinct from the
    sage.'
  language: English
  quote_policy: summarized
