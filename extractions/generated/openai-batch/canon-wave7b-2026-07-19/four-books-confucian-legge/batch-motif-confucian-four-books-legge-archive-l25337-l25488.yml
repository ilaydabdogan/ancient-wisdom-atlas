canonical_text:
  quote: ''
  summary: Mencius teaches a king to distinguish small personal valor from great royal
    valor. He links proper rule to delighting in or standing in awe of Heaven, cites
    the Book of Poetry and Book of History, presents King Wan and King Woo as examples
    whose anger brought repose to the people, and then urges the present king to act
    likewise. A following chapter opens with King Seuen of Ts'e interviewing Mencius
    in the Snow palace about whether worthy men enjoy such pleasures.
  language: English
  quote_policy: summarized
