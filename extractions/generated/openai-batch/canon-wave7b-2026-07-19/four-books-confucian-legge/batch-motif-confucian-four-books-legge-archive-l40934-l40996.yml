canonical_text:
  quote: This is to ascend and make friends of the men of antiquity.
  summary: The passage says that a scholar who is not satisfied with friendship among
    living virtuous scholars turns to the men of antiquity by repeating their poems,
    reading their books, and considering their history. It then reports an exchange
    in which King Seuen of Ts'e asks Mencius about chief ministers, and Mencius distinguishes
    royal kinsmen-ministers from ministers of another surname, saying that the former
    should remonstrate with a prince who has great faults.
