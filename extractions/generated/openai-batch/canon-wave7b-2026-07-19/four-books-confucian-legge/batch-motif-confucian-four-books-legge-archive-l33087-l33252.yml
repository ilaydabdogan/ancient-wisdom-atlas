canonical_text:
  quote: ''
  summary: Mencius recounts how the chief of K6 robbed and killed provision carriers,
    including a boy carrying food for laborers. T'ang punished him and was understood
    as avenging ordinary people rather than seeking wealth. T'ang's wider punitive
    campaigns are described as relieving the people like timely rain. King Woo of
    Chow is similarly described as punishing resisters and oppressors, receiving welcome
    offerings from the people, and saving them from distress. The passage concludes
    that Sung is not practicing true royal government; if it were, the people would
    desire its ruler and rival states would not be feared.
  language: English
  quote_policy: summarized
