canonical_text:
  quote: '"Therefore, sincerity is the way of Heaven. To think how to be sincere is
    the way of man."'
  summary: The passage teaches that proper relations with friends and parents depend
    on inward sincerity and understanding what is good. It states that complete sincerity
    moves others. It then begins a Mencius passage in which Pih-e and T'ae-kung, avoiding
    Chow and living by northern and eastern seas, hear of King Wan's rise and resolve
    to follow him because he is reputed to nourish the old. Editorial notes compare
    the sincerity passage with the Chung Yung and mention traditions about T'ae-kung
    as Leu Shang, counselor to kings Wan and Woo.
  language: English
  quote_policy: quoted
