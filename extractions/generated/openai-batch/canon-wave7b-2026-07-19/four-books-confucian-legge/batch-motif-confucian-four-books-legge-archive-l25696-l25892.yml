canonical_text:
  quote: "“If Your Majesty wishes to practice the true royal government, then do not
    pull it down.”"
  summary: King Seuen asks Mencius whether to remove the Brilliant palace. Mencius
    advises that the palace is proper to emperors and should remain if the king practices
    true royal government. He describes King Wan’s benevolent policies, especially
    care for destitute groups, and answers the king’s admitted love of wealth by citing
    Kung-lew’s provisioning of his people before a march.
  language: English
  quote_policy: quoted
