canonical_text:
  quote: ''
  summary: The passage contains several Analects chapters and translator notes. Fan
    Ch'ih asks to learn husbandry and gardening; the Master redirects attention to
    propriety, righteousness, good faith, and the moral effects of superior conduct.
    Further sayings contrast rote learning with practical ability, describe government
    as dependent on a ruler's personal conduct, call the governments of Lu and Wei
    brothers, praise Ching's family economy, prescribe enriching and teaching a numerous
    people, and state timelines for effective government under Confucius or under
    successive good men.
  language: English
  quote_policy: summarized
