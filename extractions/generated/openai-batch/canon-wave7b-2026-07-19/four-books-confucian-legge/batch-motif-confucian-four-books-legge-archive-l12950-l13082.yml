canonical_text:
  quote: ''
  summary: Yen Yuan asks how to administer a country. The Master answers with selective
    ancient precedents for calendar, carriage, cap, and music, and warns against the
    songs of Chang and specious talkers. The passage continues with sayings on forethought,
    love of virtue, Tsang Wan and Hui of Liu-hsia, self-demand, reflection, and a
    fragment on conversation not turning to righteousness. Legge’s notes identify
    dynastic precedents and explain several persons and terms.
  language: English
