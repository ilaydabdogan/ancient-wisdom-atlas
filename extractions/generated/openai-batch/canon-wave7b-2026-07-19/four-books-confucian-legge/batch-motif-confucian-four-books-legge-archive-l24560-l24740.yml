canonical_text:
  quote: ''
  summary: Mencius answers a king who asks how a compassionate heart relates to imperial
    sway. Mencius uses analogies of strength, eyesight, a mountain, a sea, a tree
    branch, family reverence, King Wan, weighing, measuring, and war preparations
    to argue that the king’s failure to protect the people is a failure to act from
    kindness, not a lack of ability.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king says Mencius's words caused movements of compassion to begin in his
    mind and asks how this heart can be equal to imperial sway.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mencius proposes a hypothetical person who can lift three thousand catties
    but not one feather, and whose eyesight can examine an autumn hair but cannot
    see a wagonload of fagots; the king rejects the statement.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mencius says the king's kindness reaches animals but has not been extended
    to the people, and he explains this as kindness not being employed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mencius distinguishes real inability from non-action by contrasting carrying
    T'ae Mountain under the arm and leaping over the north sea with breaking a branch
    from a tree at a superior's order.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mencius says the king's failure to exercise imperial sway is like not breaking
    off a branch, not like carrying T'ae Mountain over the north sea.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Mencius instructs the king to treat elders and young people in his own family
    properly so that elders and young people in other families will be similarly treated.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Mencius cites the Book of Poetry about an example affecting wife, brothers,
    and the family of the state, and applies this to King Wan carrying out a kindly
    heart.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Mencius says a prince who carries out his kindly heart can love and protect
    all within the four seas, while one who does not carry it out cannot protect even
    wife and children.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Mencius says weighing and measuring determine light, heavy, long, and short,
    and urges the king to measure the motions of his own mind.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Mencius asks whether collecting war equipment, endangering soldiers and officers,
    and provoking other princes gives pleasure to the king's mind.
  category: speech
  evidence_refs:
  - ev:10
