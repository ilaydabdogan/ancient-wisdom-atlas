canonical_text:
  quote: if the person be not cultivated, a man cannot regulate his family.
  summary: The passage explains that partial affections obstruct judgment, then argues
    that self-cultivation is required to regulate the family and that family regulation
    is required for governing the state. It uses domestic virtues, the image of a
    mother watching an infant, the influence of one family or one ruler, examples
    of Yao and Shun versus Chieh and Chau, and a Book of Poetry peach-tree marriage
    image to show how personal and household order extend to public order.
  language: English
  quote_policy: quoted
