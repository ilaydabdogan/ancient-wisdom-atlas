canonical_text:
  quote: If Your Majesty now will make pleasure a thing common to the people and yourself,
    the imperial sway awaits you.
  summary: Mencius contrasts royal hunting and music that distress the people with
    royal pleasure shared by the people, which makes them joyful. He then contrasts
    King Wan's large but publicly accessible park with King Seuen's smaller but harshly
    restricted park, and begins advice on maintaining intercourse with neighboring
    kingdoms through virtuous or wise service.
  language: English
  quote_policy: quoted
