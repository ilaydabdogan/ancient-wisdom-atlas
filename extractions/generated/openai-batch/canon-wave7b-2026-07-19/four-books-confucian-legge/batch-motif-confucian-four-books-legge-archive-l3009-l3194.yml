  quote: ''
  summary: The passage closes a Book IV note on virtue not standing alone and then
    begins Book V, where Confucius evaluates several disciples and associates. He
    approves marriage matches for Kung-ye Ch'ang and Nan Yung on character grounds,
    praises or qualifies the virtue of Tsze-chien, Tsze-kung, and Yung, approves Ch'i-tiao
    K'ai's hesitation about office, and says that if his doctrines make no way he
    will float on the sea by raft with Yu as companion.
  language: English
  quote_policy: summarized
