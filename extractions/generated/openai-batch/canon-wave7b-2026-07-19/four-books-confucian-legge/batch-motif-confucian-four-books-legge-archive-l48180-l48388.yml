canonical_text:
  quote: ''
  summary: 'Mencius gives several didactic sayings: the highest sages embody or return
    to natural virtue; true virtue is proper, sincere, and not motivated by gain;
    a counsellor of the socially great should not be awed by luxury; the heart is
    nourished by few desires; filial feeling is illustrated by a son avoiding a food
    peculiarly loved by his father; and Confucius, lacking students who followed the
    true medium, considered ardent and cautiously decided students.'
  language: English
  quote_policy: summarized
