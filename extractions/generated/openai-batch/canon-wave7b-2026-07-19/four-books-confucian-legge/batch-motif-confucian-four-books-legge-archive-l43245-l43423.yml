canonical_text:
  quote: ''
  summary: Mencius presents the way of Yao and Shun as filial piety and fraternal
    duty, teaches that imitation of a person's clothes, words, and actions makes one
    like that person, and describes the way of truth as a great road that people fail
    to seek. He then interprets two odes, arguing that dissatisfaction with a parent
    can express familial affection when the fault is great, while murmuring over a
    small fault would itself be unfilial.
  language: English
  quote_policy: summarized
