canonical_text:
  quote: ''
  summary: The passage presents Mencius' sayings and surrounding translator notes.
    It classifies kinds of public men, describes three delights of the superior man
    that exclude imperial rulership, grounds moral nature in Heaven, and recounts
    how King Wan's care for the aged attracted virtuous men, with household provisions
    such as mulberry trees, silkworms, silk, hens, and sows.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mencius distinguishes ministers who seek state tranquillity, those called
    the people of Heaven who act on their principles through office, and great men
    who rectify themselves and others.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mencius says the superior man has three delights, and being ruler over the
    empire is not one of them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: One delight is that the superior man's father and mother are alive and his
    brothers' condition gives no cause for anxiety.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A second delight is having no occasion for shame before Heaven above or before
    men below.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A third delight is obtaining talented individuals from the whole empire and
    teaching and nourishing them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Wide territory and numerous people are desired, and tranquilizing the people
    within the four seas is a delight, but these are not the highest enjoyment of
    the superior man's nature.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: What belongs by nature to the superior man is said not to be increased by
    a large sphere of action or diminished by poverty and retirement, because it is
    apportioned by Heaven.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Benevolence, righteousness, propriety, and knowledge are said to be rooted
    in the heart and manifested in the countenance, back, and four limbs.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Pih-e and T'ae-kung avoid Chow, dwell by northern and eastern seas, hear of
    King Wan's rise, and decide to follow him because the chief of the West nourishes
    the old.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Mencius says that if a prince in the empire knew how to nourish the old, all
    men of virtue would regard him as the proper object for their gathering.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The described government includes homesteads with mulberry trees for silkworms,
    silk for the old to wear, and brood hens and brood sows kept to their breeding
    seasons.
  category: object
  evidence_refs:
  - ev:8
