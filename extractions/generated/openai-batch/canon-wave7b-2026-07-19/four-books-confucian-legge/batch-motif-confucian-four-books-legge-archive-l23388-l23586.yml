canonical_text:
  quote: ''
  summary: Mencius meets King Hwuy of Leang. The king asks whether Mencius has counsels
    that will profit the kingdom. Mencius rejects profit as the governing term and
    says his counsels concern benevolence and righteousness. He warns that if rulers,
    officers, and common people all seek profit, they will try to snatch it from one
    another and endanger the realm. He concludes that benevolence prevents neglect
    of parents and righteousness prevents treating the sovereign as secondary.
  language: English
  quote_policy: summarized
