  quote: ''
  summary: In a section headed as characters disliked by Confucius and Tsze-kung,
    the passage reports that the Master asks Tsze-kung whether he also has hatreds.
    Tsze-kung names people who pry into matters and call the resulting knowledge wisdom,
    people who lack modesty and think themselves valorous, and people who reveal secrets
    and call themselves straightforward. A following chapter has the Master say that
    girls and servants are difficult to behave toward because familiarity and reserve
    each lead to negative responses.
