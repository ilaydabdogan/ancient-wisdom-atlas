canonical_text:
  quote: ''
  summary: The king of Ts'e visits Mencius as Mencius is preparing to return home,
    and later proposes through intermediaries to give him a central house and a stipend
    for his disciples. Mencius rejects the implication that such support would attract
    him, contrasting it with a larger allowance he had already declined. He then cites
    examples of ambition for office and a market tale in which a mean man uses a conspicuous
    mound to monopolize gain, leading to taxation of traders. In the following chapter
    opening, Mencius has left Ts'e and spends the night in Chow; a man sent to detain
    him speaks, but Mencius remains silent and sleeps before offering to explain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king came to visit Mencius and spoke of having wished to see him, rejoicing
    with the court when he did, and fearing that Mencius was now abandoning him and
    returning home.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mencius replied that he did not dare request permission to visit at a particular
    time, while saying that such a visit was what he desired.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king told the officer She that he wished to give Mencius a house in the
    middle of the kingdom and support his disciples with an allowance of 10,000 chung.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king stated that the proposed support would provide an example for officers
    and people to reverence and imitate.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: She conveyed the king's message by means of the disciple Ch'in, who reported
    it to Mencius.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mencius responded by asking whether accepting 10,000 chung after previously
    declining 100,000 chung would be the conduct of one desiring riches.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mencius quoted Ke-sun as saying that Tsze-shuh E pushed himself into government
    service, retired when his prince declined to employ him, and then schemed for
    his son or younger brother to become a high officer.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ke-sun's saying describes people generally as wishing for riches and honor,
    while singling out Tsze-shuh E as one who tried to monopolize the conspicuous
    mound.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mencius described old market dealers as exchanging goods they had for goods
    they lacked, with officers present only to keep order.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Mencius's market tale, a mean fellow looked for a conspicuous mound, climbed
    it, looked right and left, and sought to catch the whole gain of the market in
    his net.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The people regarded the market man's conduct as mean, and the taxing of traders
    is said to have arisen from this case.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: After taking leave of Ts'e, Mencius passed the night in Chow.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A person wishing to detain Mencius on behalf of the king came, sat down, and
    began to speak to him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Mencius gave the person no answer, leaned upon his stool, and slept.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The stranger said he had spent the night in careful vigil before speaking
    and complained that Mencius slept and did not listen; Mencius then told him to
    sit down and said he would explain the case clearly.
  category: speech
  evidence_refs:
  - ev:9
