canonical_text:
  quote: He who is the minister of Heaven may smite it.
  summary: 'The passage recounts Mencius'' distinction between deserved punishment
    and the proper authority to inflict it: Ts''e smote Yen, but Mencius says only
    the minister of Heaven may smite a state. It also narrates disorder in Yen after
    a disputed transfer of the throne, Yen''s rebellion against Ts''e, the king of
    Ts''e''s shame, and Ch''in Kea''s appeal to the precedent of the Duke of Chow
    and Kwan-shuh.'
  language: English
  quote_policy: quoted
