canonical_text:
  quote: ''
  summary: 'The passage presents several sayings attributed to Mencius: influence
    depends on personal conduct; material preparedness and complete virtue preserve
    a person in bad or corrupt times; true disposition may appear in small matters
    despite public displays of fame-seeking renunciation; a state depends on trusting
    virtuous and able people, propriety, right distinctions, and principles of government;
    possession of the whole empire is impossible without benevolence.'
  language: English
  quote_policy: summarized
