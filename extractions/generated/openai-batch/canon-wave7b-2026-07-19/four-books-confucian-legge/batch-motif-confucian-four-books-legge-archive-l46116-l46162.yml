canonical_text:
  quote: What greater example can there be than this of not eating the bread of idleness?
  summary: Mencius answers a charge that superior men eat without laboring by saying
    that, when their counsels are used by a ruler and their instructions followed
    by the young, the country gains tranquillity, prosperity, honor, and moral conduct.
    The commentary frames this as a defense of support for a superior man who serves
    through counsel rather than formal office or manual labor.
  language: English
