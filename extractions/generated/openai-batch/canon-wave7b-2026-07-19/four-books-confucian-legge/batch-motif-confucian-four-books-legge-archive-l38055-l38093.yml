  quote: ''
  summary: Wan Chang asks Mencius why the emperor gave his daughters to Shun as wives
    without informing Shun's parents. Mencius answers that the emperor knew informing
    them would prevent the marriage. Wan Chang then recounts attempts on Shun's life
    involving a burning granary and a covered well, with adjacent notes explaining
    traditional details of Shun's escapes and stating that the incidents come from
    tradition rather than the Shoo-king.
