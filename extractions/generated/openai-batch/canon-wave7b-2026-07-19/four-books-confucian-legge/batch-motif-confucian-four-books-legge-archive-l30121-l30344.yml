canonical_text:
  quote: ''
  summary: The passage presents Mencius leaving Ts'e, criticism by Yin Sze that he
    either lacked discernment or sought personal benefit and lingered too long, and
    Mencius' explanation that he delayed because he still hoped the king would change
    and recall him. Mencius contrasts his conduct with little-minded people who angrily
    depart after rejected remonstrance. Yin Sze accepts the correction. The passage
    also begins a subsequent exchange in which Ch'ung Yu observes Mencius' dissatisfied
    appearance and recalls the maxim that the superior man does not murmur against
    Heaven or grudge against men.
  language: English
  quote_policy: summarized
