  quote: ''
  summary: 'The passage explains effects of a ruler observing governing rules: self-cultivation
    sets forth universal duties; honoring worthy people, relatives, ministers, officers,
    common people, artisans, distant persons, and princes produces orderly political
    and social results. It then gives methods for practicing these rules, including
    purification, regulated dress, propriety, rejection of slanderers and sensual
    or material seductions, honoring virtue, and providing honor and emolument.'
