  quote: ''
  summary: The passage contains editorial notes on vulgar ways as harmful to virtue
    and on hasty speech as incompatible with cultivating virtue. It then presents
    sayings of the Master about morally mean people being unfit companions in serving
    a prince, their anxiety to obtain and keep their aims, and their willingness to
    proceed to anything when afraid of loss. A following saying contrasts ancient
    and present forms of high-mindedness, including disregard of small things and
    wild license.
