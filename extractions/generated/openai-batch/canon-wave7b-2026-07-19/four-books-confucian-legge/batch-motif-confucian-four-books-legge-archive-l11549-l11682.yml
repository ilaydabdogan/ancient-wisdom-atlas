  quote: '"The duke Wan of Tsin was crafty and not upright. The duke Hwan of Ch''i
    was upright and not crafty."'
  summary: The passage gives commentarial notes on Kung-shu Wan, then presents teachings
    in which the Master condemns Tsang Wu-chung's pressure on the duke of Lu, contrasts
    the characters of two powerful dukes, and defends Kwan Chung's virtue because
    his influence enabled Duke Hwan to assemble princes without war.
  language: English
