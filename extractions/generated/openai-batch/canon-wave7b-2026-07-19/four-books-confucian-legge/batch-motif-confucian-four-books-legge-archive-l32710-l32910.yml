  quote: ''
  summary: Mencius answers questions about loss of office, ritual sacrifice, Confucius
    carrying a gift of introduction across state boundaries, and proper versus improper
    ways of seeking office. He cites the Book of Rites on rulers plowing and wives
    preparing silk for sacrificial materials, compares an officer's office to a farmer's
    plow, and compares improper office-seeking to young people bypassing parents and
    go-betweens in courtship. The excerpt ends at the start of a new chapter with
    P'ang Kang questioning travel from prince to prince with many carriages.
  language: English
