canonical_text:
  quote: ''
  summary: Mencius argues through historical examples and proverbs that attaining
    imperial dignity depends on timely opportunity and benevolent government. He contrasts
    King Wan's difficult rise from a small territory with the entrenched Yin/Chow
    situation, then says the ruler of Ts'e, with territory and people already sufficient,
    could become emperor by practicing benevolent rule. He cites Confucius on the
    rapid spread of virtue and describes the people as eager for relief from tyrannical
    suffering. The passage ends with the beginning of a new chapter in which Rung-sun
    Ch'ow asks Mencius about serving as prime minister of Ts'e.
  language: English
  quote_policy: summarized
