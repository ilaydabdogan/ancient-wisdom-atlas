canonical_text:
  quote: ''
  summary: The passage combines editorial notes, citations attributed to T'ang and
    King Wu, and a dialogue between Tsze-chang and Confucius. T'ang addresses a supreme
    God with a dark-colored victim, speaks of punishing a sinner and recognizing God's
    ministers, and takes responsibility for the people's offenses. Later royal policy
    is described in terms of gifts, merit, administrative standards, restoration of
    offices, states, and families, and priority to food, mourning, sacrifices, generosity,
    sincerity, activity, and justice. Confucius answers Tsze-chang that proper government
    requires honoring five excellent things and banishing four bad things, then lists
    the five excellent traits.
