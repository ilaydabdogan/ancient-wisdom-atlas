canonical_text:
  quote: The honoring of virtue and talents proper to a king or a duke.
  summary: Mencius answers questions about whether and how rulers should support scholars
    or superior men. He distinguishes improper pay or repeated presents from support
    given in the proper ritual and political manner, cites Tsze-sze's refusal of demeaning
    repeated gifts from duke Muh, cites Yaou's support and elevation of Shun, and
    explains why common scholars should not presume to seek interviews with princes
    without the proper introductory act and official relation.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A person without a regular office who receives the prince's pay is described
    as disrespectful, while gatekeepers and watchmen have regular offices for which
    they receive support.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chang asks whether a prince's present to a scholar may be constantly repeated,
    and Mencius answers with an example involving duke Muh and Tsze-sze.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Duke Muh frequently inquires after Tsze-sze's health and sends frequent presents
    of cooked meat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tsze-sze has the messenger go outside the great door, performs a northern-facing
    obeisance with his head to the ground twice, and declines the gift.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tsze-sze says that from then on he will know that the prince supports him
    as a dog or a horse, and after that a servant is no longer sent with presents.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Mencius says that a prince cannot properly be called pleased with a man of
    talents and virtue if he neither promotes him to office nor supports him in the
    proper way.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: 'Mencius explains a proper sequence: first a prince''s commissioned present
    is accepted with double obeisance, and afterward the storekeeper and master of
    the kitchen continue sending grain and meat without repeated express commissions.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Yaou supports Shun by causing his nine sons to serve him, giving two daughters
    to him in marriage, preparing officers, livestock, storehouses, and granaries
    for him, and then raising him to the most exalted situation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Wan Chang asks what principle of righteousness is involved in a scholar's
    not going to see princes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Mencius says a scholar in the city is called a minister of the market place
    and well, a scholar in the country is called a minister of the grass and plants,
    and both are common men.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Mencius states that common men who have not presented the introductory present
    and become ministers should not presume to have interviews with the prince.
  category: relationship
  evidence_refs:
  - ev:5
