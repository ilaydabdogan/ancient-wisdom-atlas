canonical_text:
  quote: There are not two suns in the sky, nor two sovereigns over the people.
  summary: 'Mencius explains Shun''s treatment of his brother Seang: Shun enriched
    and ennobled him as prince of Yewpe while preventing him from oppressing the people.
    Mencius then rejects a reported claim that Yaou and Koo-sow appeared as subjects
    before Shun, citing canonical mourning for Yaou and the principle that there cannot
    be two sovereigns at once.'
  language: English
  quote_policy: quoted
