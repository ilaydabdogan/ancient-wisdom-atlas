canonical_text:
  quote: ''
  summary: The passage presents Mencius' sayings on teaching, principled standards,
    and ordered ethical concern. The superior man's wish is to teach, but his methods
    vary by learners; some receive influence like plants receiving heavenly dew, and
    some learn without direct contact. Kung-sun Ch'ow asks whether Mencius should
    make lofty principles more attainable; Mencius replies with analogies of an artificer
    preserving the marking line, an archer preserving the bow rule, and the superior
    man drawing the bow without releasing the arrow. Additional sayings concern principles
    appearing or vanishing with the person, refusal to answer presumptuous questioners,
    the consequences of stopping or advancing improperly, graded care for creatures,
    people, and parents, and the wise and benevolent prioritizing what is most important.
  language: English
  quote_policy: summarized
