  summary: The passage describes a learner investigating the principles and qualities
    of things until knowledge becomes wide-reaching and the mind becomes intelligent.
    It then defines making thoughts sincere as allowing no self-deception, using the
    examples of hating a bad smell and loving what is beautiful, and adds that sincerity
    requires guarding oneself in solitary moments.
