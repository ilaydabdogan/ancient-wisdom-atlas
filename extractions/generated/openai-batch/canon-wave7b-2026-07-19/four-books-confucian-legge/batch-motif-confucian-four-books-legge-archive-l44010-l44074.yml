  quote: ''
  summary: A blood-associated agreement lists five injunctions or prohibitions concerning
    filiality, succession, rank, merit, care for vulnerable groups, officeholding,
    executions, embankments, grain sale, and imperial announcement of promotions.
    The parties pledge amicable relations. The passage then says present-day princes
    violate these prohibitions, and that present-day officers worsen their rulers’
    wickedness by anticipating and exciting it.
