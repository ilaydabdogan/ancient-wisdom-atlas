canonical_text:
  quote: ''
  summary: Mencius gives sayings on self-rousing scholars, restraint before wealth
    and power, people accepting burdens when rule aims at their good, the difference
    between a chief and a true sovereign, the hidden transformative influence of the
    superior man, instruction winning hearts more than government, and intuitive ability
    and knowledge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mencius says ordinary people wait for a King Wan before receiving a rousing
    impulse, while distinguished scholars rouse themselves without such a king.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mencius says that a man who receives the wealth and power of the Han and Wei
    families and is not elated is far beyond ordinary people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The commentary frames the superior scholar as giving weight to what is internal
    and treating what is external as light.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mencius says that if people are employed in a way intended to secure their
    ease, they will not murmur even though they toil.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mencius says that if people are put to death in a way intended to preserve
    their lives, they will not murmur at the one who puts them to death.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mencius contrasts the people under a chief leading the princes, who look brisk
    and cheerful, with the people under a true sovereign, who have deep contentment.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mencius says that under the true sovereign the people do not murmur when slain,
    do not credit merit when benefited, and make daily progress toward good without
    knowing who causes it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mencius says that wherever the superior man passes, transformation follows;
    wherever he abides, his influence is spiritual and flows above and beneath like
    Heaven and Earth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The commentary cites a Yaou golden-age tradition in which old men sing of
    rising at sunrise, resting at sunset, digging wells, drinking, cultivating fields,
    and eating.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Mencius says kind reputation enters people more deeply than kind words, and
    good instructions lay hold of the people more than good government.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Mencius says good government is feared and gets the people's wealth, while
    good instructions are loved and get their hearts.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Mencius defines intuitive ability as ability possessed without learning and
    intuitive knowledge as knowledge possessed without thought.
  category: speech
  evidence_refs:
  - ev:9
