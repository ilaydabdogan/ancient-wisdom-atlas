- id: obs:3
  text: Chaou Keen made Wang Leang act as charioteer for his favorite He; after a
    full day they got no birds, and He called Wang Leang the poorest charioteer in
    the world.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Wang Leang requested another trial; after pressing, it was granted, and in
