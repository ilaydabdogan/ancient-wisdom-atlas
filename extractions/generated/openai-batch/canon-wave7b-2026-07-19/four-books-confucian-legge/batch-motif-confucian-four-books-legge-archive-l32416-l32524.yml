canonical_text:
  quote: ''
  summary: The passage argues against pursuing gain by improper compliance. It questions
    visiting rulers without invitation, critiques a maxim about bending one cubit
    to straighten eight, and gives the example of Wang Leang, a charioteer who refuses
    continued service after obtaining success only by deceitfully intercepting birds
    for a favored archer.
  language: English
  quote_policy: summarized
