  summary: The passage presents Mencian sayings and translator/commentarial notes
    on the great person’s natural concern for righteousness, the great person’s childlike
    heart, filial obsequies for parents, thorough internalization of learning, concise
    return to essentials, rule through nourishing people and winning hearts, and the
    inauspiciousness of false words that obscure talented and virtuous people.
  language: English
