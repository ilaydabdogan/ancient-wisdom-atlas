  quote: ''
  summary: The passage discusses kwei-shan as spiritual beings or spirit-powers connected
    with sacrifice, moral visibility, and cosmic operation. People fast, purify themselves,
    dress richly, and attend sacrifices, while spirits are described as present around
    worshipers and impossible to predict or disregard. The passage then opens a section
    on Shun, praised by the Master for filial piety, sage virtue, kingship, wealth
    within the four seas, and ancestral sacrifice; the commentary frames this as filial
    virtue rewarded by Heaven.
