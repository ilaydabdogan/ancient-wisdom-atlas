canonical_text:
  quote: "“There is Yung! — He might occupy the place of a prince.”"
  summary: 'In Book VI, chapters I-IV, Confucius evaluates disciples and conduct:
    Yung is judged fit for princely office; Chung-kung reasons about reverence and
    ease in government; Yen Hui is praised as the rare lover of learning; grain and
    stipends are discussed as matters of proper aid and distribution; and Chung-kung
    is likened through a rhetorical image of a red, horned calf and the spirits of
    mountains and rivers.'
  language: English
  quote_policy: quoted
