canonical_text:
  quote: ''
  summary: The passage contains Legge's translation and commentary for several Analects
    chapters. It reports Chan Ch'ang or Chan Hang killing Duke Chien of Ch'i; Confucius
    bathes, goes to court, asks Duke Ai to punish the killer, and then reports the
    matter to the chiefs of three families, who do not act. Other chapters give sayings
    on serving a ruler, the upward and downward tendencies of the superior and mean
    person, motives for learning, a praised messenger of Chii Po-yii, official responsibility,
    keeping thoughts within one's place, modest speech with greater action, and the
    threefold way of the superior man.
  language: English
  quote_policy: summarized
