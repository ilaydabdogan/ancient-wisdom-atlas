canonical_text:
  quote: ''
  summary: The passage explains that love of what is good is more than sufficient
    for governing, because such a minister attracts people from afar who bring good
    thoughts. By contrast, one who does not love what is good appears self-conceited,
    repels good men, and attracts calumniators, flatterers, and sycophants. Commentary
    glosses good government as impartial reception of good words and actions, and
    defines self-conceit as satisfaction with one's own knowledge and lack of relish
    for good words.
  language: English
  quote_policy: summarized
