canonical_text:
  quote: ''
  summary: In Book XVI, Chapter I, the head of the Chi family plans to attack Chwan-yii.
    Zan Yu and Chi-lu report this to Confucius. Confucius rebukes Ch'iu, argues that
    Chwan-yii has a ruler appointed by a former king to preside over sacrifices to
    the eastern Mang and is connected with the sovereign, and rejects strategic and
    evasive justifications for the attack. He uses sayings and analogies about failed
    guides, escaped animals, and damaged valuables to place responsibility on ministers
    who abet wrongdoing.
  language: English
  quote_policy: summarized
