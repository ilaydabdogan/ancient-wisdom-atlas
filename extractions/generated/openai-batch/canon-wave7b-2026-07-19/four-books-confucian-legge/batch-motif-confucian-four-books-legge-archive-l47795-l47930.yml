canonical_text:
  quote: ''
  summary: The passage gives a graded account of human character, from good man to
    real man, beautiful man, great man, sage, and spirit man, and places Yo-ching
    below the higher grades. Mencius then teaches that people turning away from the
    errors of Yang and Mih should be received without further reproach, using a stray-pig
    analogy. He warns rulers to moderate exactions of cloth or silk, grain, and service,
    because excessive demands cause hunger and family separation. He also says a prince’s
    true precious things are territory, people, and government, not pearls and stones.
  language: English
  quote_policy: summarized
