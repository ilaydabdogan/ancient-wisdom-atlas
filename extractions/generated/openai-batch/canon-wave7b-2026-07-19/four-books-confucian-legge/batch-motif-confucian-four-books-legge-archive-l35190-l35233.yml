canonical_text:
  quote: "'leading on the land to devour human flesh'"
  summary: 'The passage condemns warfare over territory and cities because it fills
    fields and cities with slaughtered men. It says such conduct deserves punishment
    beyond death, and ranks three classes for punishment: skilled fighters, those
    who unite princes in leagues, and those who seize grassy commons and impose cultivation
    on the people. The commentary explains these as adventurers pursuing their own
    ends before rulers, regardless of the people.'
