canonical_text:
  quote: ''
  summary: Mencius says he is compelled to rectify hearts and oppose perverse doctrines,
    including Yang and Mih. K'wang Chang asks whether Ch'an Chung exemplifies true
    self-denying purity after fasting in Wooling and recovering by eating worm-eaten
    plums from a tree over a well. Mencius praises Chung among Ts'e scholars but argues
    that Chung's ideal of purity would require becoming like an earthworm, because
    human dwelling and food may depend on unknown others. Chang replies that Chung
    and his wife support themselves by hemp work and barter.
  language: English
  quote_policy: summarized
