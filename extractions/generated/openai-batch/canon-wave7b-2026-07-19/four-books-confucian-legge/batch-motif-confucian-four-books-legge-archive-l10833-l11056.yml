canonical_text:
  quote: The superior man is affable, but not adulatory; the mean man is adulatory,
    but not affable.
  summary: 'The passage collects sayings and commentary in which Confucius answers
    Tsze-kung and gives ethical classifications: present officeholders are disparaged;
    the Master seeks students who are ardent or cautiously decided when men of the
    due medium are unavailable; constancy is required even for wizards and doctors;
    superior and mean persons are contrasted in manners, reputation, service, employment,
    dignity, pride, and nearness to virtue.'
  language: English
  quote_policy: quoted
