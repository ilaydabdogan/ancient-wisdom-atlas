canonical_text:
  quote: He took hold of their two extremes, determined the Mean, and employed it
    in his government of the people.
  summary: The passage presents sayings on the difficulty of practicing the Mean.
    It uses eating and drinking as an illustration of ordinary but poorly discerned
    experience, laments that the path of the Mean is untrodden, presents Shun as a
    wise ruler who questioned others and governed by the Mean, contrasts self-professed
    wisdom with inability to escape traps or keep the Mean, presents Hui as one who
    held fast to the good, and states that even great public achievements are easier
    than attaining the Mean.
  language: English
  quote_policy: quoted
