  quote: Yu was eight years away from his home, and though he thrice passed the door
    of it, he did not enter.
  summary: The passage recounts disorder in the Middle Kingdom, the appointment of
    Shun and other ministers, the use of fire to clear forests and marshes, Yu's regulation
    of waterways, the restoration of cultivation, and the teaching of agriculture
    and human relations.
