canonical_text:
  quote: In Confucius we have what is called a complete concert.
  summary: Mencius compares four sages. Pih-e is described as pure and withdrawn from
    corruption; E Yin as willing to take office in order to instruct the people according
    to Heaven's plan; Hwuy of Lew-hea as accommodating and undefiled by association;
    and Confucius as acting according to the proper time. Mencius then likens Confucius
    to a complete musical performance whose beginning is wisdom and whose ending is
    sageness.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Mencius states that Pih-e avoided bad sights and sounds, would not serve a
    disapproved prince or command an unesteemed people, took office in good government,
    and retired when confusion occurred.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pih-e is described as unable to dwell in a lawless court or among lawless
    people; being in the same place with a villager is compared to sitting amid mud
    and coals while wearing court robes and cap.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pih-e dwelt on the shores of the North Sea in the time of Chow while waiting
    for the purification of the empire; hearing his character makes the corrupt pure
    and the weak determined.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: E Yin says that anyone he serves becomes his sovereign and any people he commands
    become his people.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: E Yin takes office in both good government and confusion, and states that
    Heaven's plan is for the first informed to instruct those informed later and for
    those who first apprehend principles to instruct those slower to do so.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: E Yin identifies himself as one of Heaven's people who first apprehended principles,
    says he will instruct the people, and treats any people left outside the benefits
    of Yaou and Shun as if he had pushed them into a ditch.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hwuy of Lew-hea is described as serving an impure prince, accepting inferior
    office, displaying his virtue and principles, and not murmuring or grieving when
    dismissed or poor.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Hwuy of Lew-hea is comfortable among village people and says that another
    person's nakedness cannot defile him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hearing the character of Hwuy of Lew-hea makes the mean generous and the niggardly
    liberal.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: When leaving Ts*e, Confucius strained off by hand the water in which his rice
    was being rinsed, took the rice, and went away; when leaving Loo, he delayed,
    saying that he would set out by and by.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Confucius is described as going away quickly, delaying, remaining in retirement,
    or taking office when each action is proper.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Mencius classifies Pih-e as the pure one among sages, E Yin as the one most
    inclined to take office, Hwuy of Lew-hea as the accommodating one, and Confucius
    as the timeous one.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Mencius likens Confucius to a complete concert in which a large bell proclaims
    the beginning of music and a ringing stone proclaims its close.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Mencius says that the metal sound begins the blended harmony of the instruments,
    the stone terminates that harmony, the beginning is the work of wisdom, and the
    termination is the work of sageness.
  category: speech
  evidence_refs:
  - ev:9
