canonical_text:
  quote: "“After the death of King Wan, was not the cause of truth lodged here in
    me?”"
  summary: In Book IX, chapters 1–5, the Master is described as seldom speaking of
    profit, Heaven’s appointments, and perfect virtue; responding ironically to praise
    of his extensive learning; distinguishing ritual practices he may follow from
    those he refuses to abandon; being free from four personal faults; and, when endangered
    at K'wang, affirming that the cause of truth after King Wan is lodged in him unless
    Heaven wills it to perish.
  language: English
  quote_policy: quoted
