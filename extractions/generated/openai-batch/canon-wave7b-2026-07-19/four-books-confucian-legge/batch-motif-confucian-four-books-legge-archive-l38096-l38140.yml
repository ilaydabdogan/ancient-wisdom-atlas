canonical_text:
  quote: there was Shun on his couch playing on his lute
  summary: Seang allocates Shun's possessions and wives as if they were his own, enters
    Shun's palace, finds Shun alive playing a lute, says he came because he was anxious
    about him, and blushes. Shun asks Seang to undertake the government of his officers.
    Mencius comments that he does not know whether Shun was ignorant of Seang's wish
    to kill him. The surrounding commentary notes that the empire flocked to Shun,
    that settlements formed around him, and that a carved bow from Yaou was a token
    of association with the throne.
  language: English
  quote_policy: quoted
