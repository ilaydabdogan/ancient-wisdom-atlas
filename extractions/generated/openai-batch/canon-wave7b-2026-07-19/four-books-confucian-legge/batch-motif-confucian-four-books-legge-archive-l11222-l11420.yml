  summary: Analects Book XIV chapters V-XII, with Legge notes, presents sayings and
    judgments of Confucius about correct speech, boldness, virtue, love, loyalty,
    official writing, named ministers, poverty, wealth, and fitness for office. Nan-kung
    Kwo invokes ancient figures distinguished by prowess or by husbandry, and Confucius
    praises him as an esteemer of virtue.
