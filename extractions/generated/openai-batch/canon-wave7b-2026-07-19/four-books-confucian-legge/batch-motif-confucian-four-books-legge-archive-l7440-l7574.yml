canonical_text:
  quote: ''
  summary: 'The passage describes Confucius''s court demeanor during a reception or
    message-transmission setting and at an audience: he inclines toward officers,
    keeps his robe properly arranged, sees off a guest, reports to the prince, bends
    when entering the palace gate, avoids the center and threshold, shows reverence
    near the prince''s vacant place, and ascends the reception hall with robe held,
    body bent, and breath restrained. The included commentary explains court gates
    and the prince''s privileged relation to central places and thresholds.'
