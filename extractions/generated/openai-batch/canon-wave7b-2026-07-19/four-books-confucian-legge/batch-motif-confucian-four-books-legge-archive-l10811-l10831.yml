  summary: Tsze-kung asks the Master what qualities entitle a man to be called an
    officer. The Master describes an officer as one who maintains a sense of shame
    in self-conduct and does not disgrace his prince's commission. Tsze-kung then
    asks about lower ranks, and the Master describes a person praised by relatives
    as filial and by neighbors as fraternal, then begins a further description of
    another class as sincere in speech before the passage breaks off.
