canonical_text:
  quote: ''
  summary: Mencius discusses Confucius's righteous choices about office and lodging,
    including an attempted interception by Hwan of Sung. He then answers Wan Chang
    by rejecting a story that Pih-le He sold himself and fed oxen for advancement,
    and instead presents Pih-le He as a wise man who left Yu and served duke Muh of
    Ts'in.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Confucius is said to have entered office according to propriety, retired according
    to righteousness, and described obtaining or not obtaining office as ordered.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says lodging with the attendant Tseih Hwan would not have accorded
    with righteousness or with an ordering of Heaven.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: After leaving Loo and Wei, Confucius encountered an attempt by Hwan, Master
    of the Horse of Sung, to intercept and kill him, and in distress lodged with city
    master Ching.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mencius says the character of ministers and stranger officers may be discerned
    from those whom they entertain or with whom they lodge.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wan Chang asks whether Pih-le He sold himself to a cattle keeper for five
    sheep skins and fed oxen to gain introduction to duke Muh of Ts'in; Mencius denies
    it and calls the story an invention by men fond of strange things.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mencius identifies Pih-le He as a man of Yu and says the people of Tsin used
    a gem and four Keue horses to borrow passage through Yu to attack Kih; Kung Chirk'e
    remonstrated, while Pih-le He did not.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mencius says Pih-le He knew the duke of Yu could not be remonstrated with,
    left for Ts'in at age seventy, became minister to duke Muh, and made his prince
    distinguished throughout the empire.
  category: sequence
  evidence_refs:
  - ev:6
