canonical_text:
  quote: "“Virtue is more to man than either water or fire.”"
  summary: The passage contains editorial headings and notes followed by sayings attributed
    to the Master. It warns against specious words and impatience, cautions that public
    liking or dislike is not a sufficient basis for judging a person, teaches that
    a person enlarges principles rather than being enlarged by them, urges reform
    of faults, prefers learning to fruitless isolated thinking, presents the superior
    man as seeking truth rather than food or emolument, links knowledge with virtue,
    dignity, and propriety in governing, contrasts superior and small men, compares
    virtue favorably to water and fire, and says every person must take virtue upon
    himself even before his teacher.
