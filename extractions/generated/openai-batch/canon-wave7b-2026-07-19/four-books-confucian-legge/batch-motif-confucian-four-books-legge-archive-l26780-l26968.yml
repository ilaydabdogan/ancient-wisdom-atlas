canonical_text:
  quote: ''
  summary: The passage reports a court exchange about why the duke did not visit Mencius,
    a discussion of mourning rites and funeral expense, Mencius's statement that success
    or obstruction in finding a ruler who trusts him is from Heaven, and the beginning
    of a dialogue in which Kung-sun Ch'ow asks whether Mencius could achieve results
    like earlier statesmen Kwan Chung and Gan if he governed Ts'e.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The officer Go-ching entered the court, had an audience, and asked the prince
    why he had not gone to see Mang K'o.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The duke said he had not gone because he had been told that Mang K'o's second
    mourning observances exceeded the former ones.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Go-ching framed possible ritual excess in terms of rank-appropriate rites
    and numbers of tripods, while the duke clarified that he meant the quality of
    the coffin, shell, graveclothes, and shroud.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Go-ching replied that the difference in funeral objects should be called a
    difference between poverty and wealth, not excess.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Go-ching later told Mencius that the prince had intended to come see him but
    was stopped by the favorite Tsang Ts'ang.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mencius stated that a person's advancement or obstruction may occur through
    others but is ultimately beyond the power of other men.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mencius said his not finding in the prince of Loo a ruler who would trust
    him and practice his counsels was from Heaven.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kung-sun Ch'ow asked whether Mencius, if he obtained direction of government
    in Ts'e, could accomplish results like those of Kwan Chung and Gan.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Mencius answered by recounting that Tsang Se rejected comparison with Kwan
    Chung, despite Kwan Chung's long possession of his prince's confidence and direction
    of government.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Kung-sun Ch'ow described Kwan Chung as raising his prince to leadership over
    other princes and Gan as making his prince illustrious; Mencius replied that raising
    Ts'e to imperial dignity would be as easy as turning the hand.
  category: speech
  evidence_refs:
  - ev:9
