  quote: ''
  summary: 'English translation and commentary excerpt containing several Analects
    episodes: the Master indirectly signals his presence to Pei with lute and song;
    Tsai Wo questions the three years'' mourning for parents and is rebuked; the Master
    comments on idleness, valor subordinated to righteousness, and the hatreds of
    the superior man.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The commentary identifies Zu Pei as a small officer of Lu and former attendant
    on Confucius, and says Confucius declined to see him because of some fault rather
    than real sickness.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Pei was at the door, the Master took his lute and sang so that Pei would
    hear him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tsai Wo asks about the three years' mourning for parents and says that one
    year is long enough.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tsai Wo argues that three years without propriety and music would cause those
    observances to be lost or ruined.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tsai Wo also argues from a one-year cycle in which old grain is exhausted,
    new grain grows, and fire-making woods are changed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Master asks whether Tsai Wo would feel at ease after one year eating good
    rice and wearing embroidered clothes; Tsai Wo replies that he would.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Master says that during mourning the superior man does not enjoy pleasant
    food, music, or comfortable lodging.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Master says a child is not allowed to leave the arms of its parents until
    it is three years old, and he asks whether Yu enjoyed the three years' love of
    his parents.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Master says that spending the whole day eating without applying the mind
    to anything good is hard to deal with, and that gaming or chess would be better
    than doing nothing.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Master says the superior man holds righteousness highest, and that valor
    without righteousness leads to insubordination in a superior situation and robbery
    among lower people.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: In response to Tsze-kung, the Master says the superior man has hatreds, including
    those who proclaim others' evil and those in low station who slander superiors.
  category: speech
  evidence_refs:
  - ev:9
