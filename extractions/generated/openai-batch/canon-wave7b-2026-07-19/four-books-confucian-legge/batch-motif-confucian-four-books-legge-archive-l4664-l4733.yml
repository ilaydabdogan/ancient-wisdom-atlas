canonical_text:
  quote: '"wishing to be established himself, seeks also to establish others"'
  summary: 'The passage first reports commentary explaining Confucius''s interview
    with Nan-tsze and interpreting a disputed expression as an oath or solemn protestation
    against Tsze-lu''s suspicions. It then presents Analects Chapter XXVIII: Tsze-kung
    asks whether a man who benefits the people and assists all could be called perfectly
    virtuous. The Master replies that such a person would have qualities of a sage,
    noting Yao and Shun, and defines perfect virtue as seeking others'' establishment
    and enlargement along with one''s own, and as judging others by what is near in
    oneself.'
