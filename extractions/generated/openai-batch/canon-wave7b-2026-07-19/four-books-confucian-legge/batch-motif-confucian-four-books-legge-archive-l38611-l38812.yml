canonical_text:
  quote: ''
  summary: Commentary and translated dialogue explain Mencius's account of how Shun
    received the empire as a gift of Heaven rather than by human conferral or usurpation.
    Yaou presented Shun to Heaven and to the people; Shun presided over sacrifices
    and affairs, the spirits and people accepted him, and public allegiance turned
    to Shun rather than Yaou's son. The passage closes by citing The Great Declaration
    that Heaven sees and hears according to the people.
  language: English
  quote_policy: summarized
