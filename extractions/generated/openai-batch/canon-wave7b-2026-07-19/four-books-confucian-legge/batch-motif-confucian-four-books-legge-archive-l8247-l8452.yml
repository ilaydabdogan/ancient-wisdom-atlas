  quote: ''
  summary: 'The passage presents notes and chapters concerning several disciples of
    Confucius: Min Tsze-ch''ien is praised for filial conduct; Nan Yung repeatedly
    recites a maxim about flaws in a white scepter stone and flaws in speech and is
    given a wife from Confucius''s family; Yen Hui is singled out as loving learning
    and then dies; after Yen Yuan''s death, Confucius refuses to sell his carriage
    for an outer coffin shell, mourns him bitterly, and disapproves when the disciples
    bury him in grand style.'
