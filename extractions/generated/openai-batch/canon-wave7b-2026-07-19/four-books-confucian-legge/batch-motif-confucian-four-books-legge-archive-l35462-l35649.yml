canonical_text:
  quote: ''
  summary: The passage presents teachings attributed to Mencius about keeping oneself
    in order to serve parents, the service of parents as the root of other services,
    contrasting examples of Tsang family filial service, rectifying a sovereign's
    mind as the basis of ordered rule, several brief aphorisms on praise, reproof,
    and teaching others, and Mencius reproving Yo-ching for delay in visiting him.
  language: English
  quote_policy: summarized
