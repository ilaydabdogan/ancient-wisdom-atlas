canonical_text:
  quote: ''
  summary: The passage includes an explanation of court-rank rules, then Mencius's
    teaching that the superior man preserves benevolence and propriety in his heart,
    responds to others' perversity by examining himself, and treats external calamity
    as secondary to the lifelong anxiety of becoming like Shun. It then begins a chapter
    contrasting Yu and Tseih, who served during ordered times and neglected their
    own homes, with Yen Hwuy, who preserved joy amid poverty during disorder; Confucius
    praised both forms of conduct as sharing one principle.
  language: English
  quote_policy: summarized
