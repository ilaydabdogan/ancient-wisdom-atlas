canonical_text:
  quote: To lead an uninstructed people to war, is to throw them away.
  summary: 'The passage includes editorial material on natural qualities favorable
    to virtue, then three sayings: Tsze-lu asks the Master what qualities make a scholar;
    the Master defines the scholar''s social bearing as earnest, urgent, and bland
    in different relationships; the Master says a good man can teach the people for
    seven years before they may be used in war; and he warns that leading uninstructed
    people to war throws them away. The accompanying notes interpret the teaching
    as moral and civic education, not merely military training.'
  language: English
  quote_policy: quoted
