  summary: The passage enumerates five universal duties in social relationships, three
    universally binding virtues, and the means of practicing them. It describes different
    ways people come to know and practice these duties, gives sayings of the Master
    linking learning, vigorous practice, and shame to the virtues, and connects self-cultivation
    with governing others and the kingdom. It then begins a list of nine standard
    rules for government.
