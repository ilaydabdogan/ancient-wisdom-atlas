canonical_text:
  quote: ''
  summary: The passage contains commentary and translated Analects material on ritual
    propriety. It describes rank-specific temple dances and criticizes the Chi family
    and the three families for using rites associated with higher rank. Confucius
    says rites and music require humanity, answers Lin Fang that ceremony should privilege
    simplicity and sincere mourning over display, contrasts border tribes with rulers
    against disorderly states, objects to the Chi chief sacrificing to T'ai mountain,
    and describes archery as the only contention fitting for a cultivated person because
    it is conducted with bows, orderly movement, and a drinking forfeit.
  language: English
  quote_policy: summarized
