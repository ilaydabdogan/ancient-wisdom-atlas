- id: obs:1
  text: The commentary says temple service dancers were arranged in rows; the king
    had eight rows, a duke or prince six, and a great officer four, so the Chi family's
    use of eight rows is described as a usurpation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The three families assembled as descendants of Duke Hwan and used the Yung
    ode while vessels were removed at the conclusion of a sacrifice; the Master questioned
    the application of royal words in their hall.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Master states that a person without the virtues proper to humanity has
    no proper relation to rites of propriety or to music.
  category: speech
