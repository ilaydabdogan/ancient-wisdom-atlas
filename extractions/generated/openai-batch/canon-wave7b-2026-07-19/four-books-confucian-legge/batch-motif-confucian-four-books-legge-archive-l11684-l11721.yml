canonical_text:
  quote: ''
  summary: 'A passage and note about Kwan Chung: Tsze-kung criticizes him for not
    dying with Chiu after Duke Hwan caused Chiu to be killed and for becoming Hwan''s
    prime minister; the Master replies that Kwan Chung''s service to Hwan united and
    rectified the kingdom, benefited the people, and should not be judged only by
    a demand for small fidelity.'
  language: English
  quote_policy: summarized
