canonical_text:
  quote: ''
  summary: Mencius reproves the disciple Y6-ching for apparently following Tsze-gaou
    for food and drink despite having learned the doctrine of the ancients. In the
    next chapter, Mencius states that among three kinds of unfilial conduct, having
    no posterity is the greatest, and explains Shun's marriage without informing his
    parents as motivated by the need to avoid having no posterity. The accompanying
    note explains the seriousness of lack of posterity as an offense against the ancestral
    line and as terminating sacrifices to ancestors.
