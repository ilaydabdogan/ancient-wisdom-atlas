canonical_text:
  quote: ''
  summary: The passage teaches that a ruler prospers by self-restraint and by sharing
    the joys and sorrows of the people. It recounts Duke King of Ts'e asking minister
    Ngan how a proposed tour might resemble ancient imperial inspections. Ngan explains
    ideal inspection tours as purposeful reviews of administration and agricultural
    needs, then contrasts them with burdensome pleasure journeys marked by retinues,
    consumed provisions, hunting, wine, oppression, and loss of restraint.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chapter heading states that a ruler's prosperity depends on self-restraint
    and sympathy with people's joys and sorrows.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Snow Palace is identified as a pleasure palace of the princes of Ts'e.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says people do wrong if they condemn superiors merely because
    they cannot enjoy themselves, and superiors also do wrong if they do not make
    enjoyment common to themselves and the people.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that when a ruler rejoices and grieves with the people, mutual
    joy and sorrow pervade the empire and the ruler attains imperial dignity.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Duke King of Ts'e asks minister Ngan how his planned itinerary to Chuen-foo,
    Chaou-woo, along the shore, and to Lang-yay can be compared with ancient emperors'
    inspection visits.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ngan explains that imperial tours inspected the states under the princes'
    care, while princes' attendance at court was a report of office.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ngan says spring inspections examined plowing and supplied deficient seed,
    while autumn inspections examined reaping and supplied deficient yield.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A saying of the Hea dynasty asks what will become of the people's happiness
    and help if the king does not make his ramble or excursion; Ngan says such journeys
    were a pattern to princes.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ngan contrasts the older model with a current state in which hosts march with
    the ruler, provisions are consumed, the hungry lose food, laborers have no rest,
    maledictions are uttered, wickedness follows, ordinances are violated, and people
    are oppressed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says supplies of food and drink flow away like water.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Ngan defines yielding to the current as descending with it and forgetting
    to return, urging against it as pressing upward and forgetting to return, being
    wild as pursuing the chase without satiety, and being lost as delighting in wine
    without satiety.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ngan says the ancient emperors had no pleasures like those of the flowing
    stream and no conduct characterized as wild and lost.
  category: attribute
  evidence_refs:
  - ev:7
