canonical_text:
  quote: "“To employ an uninstructed people in war may be said to be destroying the
    people.”"
  summary: The prince of Loo seeks to appoint Shin commander for a military effort
    involving Ts'e and Nan-yang. Mencius opposes the plan, arguing that using uninstructed
    people in war destroys them, that conquest by slaughter is not benevolent, and
    that a superior man should lead a prince toward the right path and benevolence.
  language: English
  quote_policy: quoted
