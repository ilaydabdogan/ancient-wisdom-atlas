canonical_text:
  quote: "“Friendship with a man is friendship with his virtue”"
  summary: 'The passage first describes ranked revenues and agricultural support in
    small states. It then presents Mencius answering Wan Chang on friendship: friendship
    should not rest on superiority of age, station, or relatives, but on virtue. Mencius
    gives examples involving Mang Heen and his friends, Duke Hwuy of Pe, Duke P''ing
    of Tsin and Hae T''ang, and finally Shun and the emperor exchanging hospitality.'
  language: English
  quote_policy: quoted
