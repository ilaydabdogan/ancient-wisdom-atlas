canonical_text:
  quote: ''
  summary: The passage includes translator commentary and Analects chapters XV-XX.
    The Master praises music master Chih and the Kwan Tsii, rejects certain combinations
    of moral and natural defects, urges continuous learning, praises Shun and Yii
    for their detached possession of empire, praises Yao as a sovereign corresponding
    to Heaven, and discusses the scarcity of able ministers in relation to Shun and
    King Wu.
  language: English
  quote_policy: summarized
