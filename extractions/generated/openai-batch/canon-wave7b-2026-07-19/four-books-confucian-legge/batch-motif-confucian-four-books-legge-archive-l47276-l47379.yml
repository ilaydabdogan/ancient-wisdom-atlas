canonical_text:
  quote: ''
  summary: The passage explains the tutelary spirits of the land and grain, their
    altars, and the sovereign's prerogative to sacrifice to them for national and
    agricultural prosperity. It describes regular seasonal sacrifices and special
    services during calamity. It states that a prince who endangers the altars is
    replaced, and that if proper sacrifices do not prevent drought or floods, the
    spirits of land and grain may also be changed or replaced. The opening of the
    next chapter identifies the sage as a teacher of a hundred generations, exemplified
    by Pih-e and Hwuy of Lew-hea.
  language: English
