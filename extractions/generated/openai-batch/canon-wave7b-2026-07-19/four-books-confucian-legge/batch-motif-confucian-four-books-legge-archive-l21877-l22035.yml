canonical_text:
  quote: ''
  summary: The passage discusses sincerity or moral perfection in The Doctrine of
    the Mean. It says that one possessed of complete sincerity can develop his own
    nature, then the nature of other people, then the natures of animals and things,
    and can assist the transforming and nourishing powers of Heaven and Earth, forming
    a ternion with them. Commentary explains this as a doctrine of sagehood, moral
    cultivation, and cosmic order, with references to Buddhist and Kao-style claims
    about shared nature, to the Shu-ching’s account of natural tranquillity under
    early Hsia rulers, and to Heaven’s appointment of a sage to the throne. The following
    chapter describes a lesser person cultivating the shoots of goodness until sincerity
    becomes manifest, brilliant, influential, and transformative.
  language: English
  quote_policy: summarized
