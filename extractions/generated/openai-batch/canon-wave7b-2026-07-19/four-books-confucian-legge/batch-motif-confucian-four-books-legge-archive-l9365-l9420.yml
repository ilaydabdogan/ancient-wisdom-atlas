  quote: The superior man has neither anxiety nor fear.
  summary: The passage gives background on Tsze-niu/Sze-ma Niu, then presents his
    question to the Master about the superior man. The Master says that the superior
    man lacks anxiety and fear, and explains this by saying that when self-examination
    finds no wrong, there is no cause for anxiety or fear. A following section begins
    with Sze-ma Niu anxiously lamenting that he alone lacks brothers, and Tsze-hsia
    beginning to reply with a saying he has heard.
