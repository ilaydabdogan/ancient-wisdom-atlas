canonical_text:
  quote: ''
  summary: 'The passage presents sayings and anecdotes about Confucius and public
    life: slander against Tsze-lu is set against the ordering of Heaven; men of worth
    withdraw from public life for different reasons; a gatekeeper and a basket-carrying
    passerby criticize Confucius''s continued pursuit of public service in impracticable
    times; Confucius responds to the passerby; Tsze-chang asks about Kao-tsung''s
    three years of silent mourning, and Confucius explains delegated governance during
    mourning; Confucius says that rulers who love propriety receive ready service
    from the people.'
  language: English
  quote_policy: summarized
