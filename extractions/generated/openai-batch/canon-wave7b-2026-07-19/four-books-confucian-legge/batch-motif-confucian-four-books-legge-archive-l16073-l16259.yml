canonical_text:
  quote: ''
  summary: Book XIX opens with aphoristic teachings attributed mainly to Tsze-chang
    and Tsze-hsia. The passage describes the conduct of a scholar trained for public
    duty, questions narrow or insincere virtue, contrasts rules for social intercourse,
    and gives several sayings on learning, virtue, inferior pursuits, craft analogy,
    and fault-concealment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tsze-chang says that a scholar trained for public duty should be prepared
    to sacrifice his life when facing threatening danger, should think of righteousness
    when gain is presented, should be reverential in sacrificing, and should attend
    to grief in mourning.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tsze-chang says that holding fast virtue without enlarging it, and believing
    right principles without firm sincerity, makes a person's existence or nonexistence
    of no account.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The disciples of Tsze-hsia ask Tsze-chang about principles for mutual intercourse.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'The disciples report Tsze-hsia''s rule: associate with those who can advantage
    you and put away those who cannot.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tsze-chang responds that the superior man honors the talented and virtuous,
    bears with all, praises the good, pities the incompetent, and questions the practice
    of putting others away.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tsze-hsia says that inferior studies and employments have something worth
    looking at, but carrying them toward remote aims risks inapplicability, so the
    superior man does not practice them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tsze-hsia says that one who daily recognizes what he lacks and monthly does
    not forget what he has attained may be said to love learning.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tsze-hsia says that extensive learning, a firm and sincere aim, earnest inquiry,
    and self-applied reflection form a course in which virtue is found.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tsze-hsia compares mechanics dwelling in their shops to accomplish their works
    with the superior man learning in order to reach the utmost of his principles.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tsze-hsia says that the mean man is sure to gloss his faults.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The commentary states that Confucius does not appear personally in this Book
    and that the disciples deliver sentiments after the manner of their master, though
    with a falling off from him.
  category: other
  evidence_refs:
  - ev:9
