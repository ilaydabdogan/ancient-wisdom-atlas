canonical_text:
  quote: If the people of Yen will be pleased with your taking possession of it, then
    do so.
  summary: The passage uses a gem-and-lapidary analogy to argue that trained governance
    should not be ignored. It then recounts Ts'e conquering Yen and King Seuen asking
    Mencius whether to possess it. Mencius answers that possession depends on whether
    the people of Yen are pleased, citing King Woo and King Wan as ancient examples.
    He says the people welcomed the army with food because they hoped to escape fire
    and water, but will revolt if their suffering is worsened. In the next chapter
    opening, after Ts'e takes Yen and other princes plan an attack, Mencius cites
    T'ang as an example of rule from a small territory and contrasts this with a large
    prince fearing others.
  language: English
  quote_policy: quoted
