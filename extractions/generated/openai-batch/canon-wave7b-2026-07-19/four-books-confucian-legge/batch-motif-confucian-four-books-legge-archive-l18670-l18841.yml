canonical_text:
  quote: ''
  summary: The passage explains a Confucian political teaching about reciprocity between
    ruler and people. It cites the Book of Poetry, the Announcement to K'ang, the
    Book of Ch'u, and a saying of Duke Wen's uncle Fan to argue that rulers gain or
    lose the kingdom through virtue, the people's allegiance, and proper ordering
    of wealth and values.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The commentary states that because the ruler's example is influential, he
    should use his own mind to measure the minds of others and act accordingly, with
    a tranquil and happy kingdom as the stated result.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A cited Book of Poetry line says that when a prince loves what the people
    love and hates what the people hate, he is called the parent of the people.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A cited Book of Poetry line presents Grand-teacher Yin as one whom all the
    people look up to, and the passage warns rulers not to deviate into mean selfishness.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A cited Book of Poetry warning says that before the Yin sovereigns lost the
    hearts of the people, they could appear before God, and that the great decree
    is not easily preserved.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that gaining the people gains the kingdom, and losing the
    people loses the kingdom.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage gives a sequence in which the ruler first cultivates virtue, then
    gains the people, then gains territory, wealth, and resources for expenditure.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that virtue is the root and wealth the result; if the ruler
    reverses this priority, he will wrangle with the people and teach them rapine.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that accumulating wealth scatters the people, while allowing
    wealth to be scattered among them collects the people.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that words going forth contrary to right return in the
