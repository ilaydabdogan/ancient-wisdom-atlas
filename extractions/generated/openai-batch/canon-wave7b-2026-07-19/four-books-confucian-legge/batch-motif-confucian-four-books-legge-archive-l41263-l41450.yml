canonical_text:
  quote: To enjoy food and delight in colors is nature.
  summary: A commentarial note frames a dispute about whether nature is to be identified
    with life or the phenomena of life. Mencius questions Kaou through analogies about
    whiteness, animals, age, kinship, and roasted meat. Kaou argues that benevolence
    is internal and righteousness external; Mencius challenges the consistency of
    that distinction.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The opening commentary reports Choo He's view that the relevant term means
    that whereby men and animals perceive and move, and says the sentiment is analogous
    to a Buddhist view that treats "doing and using" as nature.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that taking nature as the phenomena of life leads to the
    conclusion that wherever there are phenomena of life, the subjects' nature must
    be the same.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mencius asks Kaou whether by nature he means life in the same way that white
    is white, and Kaou agrees.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mencius compares the whiteness of a white feather, white snow, and a white
    gem, and Kaou agrees that the whiteness is alike.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mencius asks whether the nature of a dog is like the nature of an ox and whether
    the nature of an ox is like the nature of a man.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kaou says that enjoyment of food and delight in colors is nature, that benevolence
    is internal, and that righteousness is external.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kaou explains his claim that righteousness is external by comparing reverence
    for an older man's age to recognizing a white man as white because of an external
    quality.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mencius distinguishes acknowledging the age of an old horse from acknowledging
    the age of an old man, and asks whether righteousness is the fact of old age or
    the act of honoring age.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kaou contrasts loving his own younger brother with not loving the younger
    brother of a man of Ts'in, and contrasts honoring an old man of Ts'oo with honoring
    an old man of his own people.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Mencius argues that enjoyment of meat roasted by a man of Ts'in does not differ
    from enjoyment of meat roasted by oneself, and asks whether enjoyment of a roast
    would therefore be external.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: A commentary uses an infant drinking from the breast and looking at fire as
    an illustration of enjoying food and delighting in colors.
  category: action
  evidence_refs:
  - ev:9
