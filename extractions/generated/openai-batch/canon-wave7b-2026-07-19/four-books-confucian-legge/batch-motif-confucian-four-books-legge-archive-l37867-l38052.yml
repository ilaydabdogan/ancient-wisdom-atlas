canonical_text:
  quote: ''
  summary: Mencius explains Shun's sorrow over his parents, his honors and imperial
    prospects, the persistence of filial desire, and later defends Shun's marriage
    without informing his parents by reasoning about conflicting human relations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shun is described as going into the fields, weeping, and crying out to the
    pitying heavens and to his parents.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shun says that by cultivating the fields he is discharging his office as a
    son and asks what there can be in him that his parents do not love.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The emperor prepares his children, officers, oxen and sheep, storehouses,
    and granaries to serve Shun amid the channeled fields.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Multitudes of scholars of the empire flock to Shun, and the emperor intends
    that Shun first superintend the empire with him and then receive it entirely.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Because Shun's parents are not in accord with him, he feels like a poor man
    with nowhere to turn.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Being delighted in by scholars, possessing beautiful wives, possessing riches,
    and holding imperial honors do not remove Shun's sorrow.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mencius says that only getting his parents to be in accord with him can remove
    Shun's sorrow.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mencius states that ordinary desire may turn toward beautiful women, wife
    and children, or sovereign, while the greatly filial man keeps desire toward his
    parents to the end of life.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wan Chang asks why Shun married without informing his parents, despite a rule
    quoted from the Book of Poetry that a man should inform his parents when marrying.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Mencius answers that if Shun had informed his parents, he would not have been
    able to marry, and that male and female dwelling together is the greatest of human
    relations.
  category: speech
  evidence_refs:
  - ev:6
