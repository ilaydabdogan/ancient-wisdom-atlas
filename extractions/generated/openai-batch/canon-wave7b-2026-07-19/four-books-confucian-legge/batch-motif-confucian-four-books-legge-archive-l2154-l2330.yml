canonical_text:
  quote: ''
  summary: The passage records sayings and explanatory notes concerning Confucius's
    attachment to ancient ritual forms, proper service between rulers and ministers,
    balanced emotional expression in the Kwan Tsii ode, Tsai Wo's answer about trees
    planted at land-spirit altars, Confucius's rebuke about speech on past matters,
    and Confucius's criticism of Kwan Chung's capacity, wealth, and ritual propriety.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'A year-end royal calendar rite is described: the king gave calendars to princes,
    the calendars were kept in ancestral temples, and on the first day of each month
    a sheep was offered while the day was announced and sanction for the month’s duties
    was requested.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dukes of Lu neglected part of the rite while still offering the sheep;
    Confucius tells Tsze that Tsze loves the sheep, while he loves the ceremony.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The Master says that full observance of propriety when serving a prince is
    regarded by people as flattery.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Duke Ting asks about how a prince should employ ministers and how ministers
    should serve a prince; Confucius answers that the prince should act according
    to propriety and ministers should serve faithfully.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Master describes the Kwan Tsii as expressing enjoyment without licentiousness
    and grief without harmful excess.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Duke Ai asks Tsai Wo about altars of the spirits of the land; Tsai Wo says
    the Hsia sovereign planted pine, the men of Yin planted cypress, and the men of
    Chau planted chestnut, meaning to cause the people to be in awe.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: After hearing Tsai Wo’s reply, the Master says that things already done, completed,
    or past need not be spoken about, remonstrated about, or blamed.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Master calls Kwan Chung’s capacity small.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: In response to questions about Kwan Chung, the Master says Kwan had the San
    Kwei and officers without double duties, and that Kwan used a gate screen and
    an inverted-cup stand like those of princes of states.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
