canonical_text:
  quote: What you do not like when done to yourself, do not do to others.
  summary: The passage uses the Book of Poetry image of hewing an ax handle to teach
    that the pattern for conduct is near at hand. It says the superior man governs
    people according to their nature, cultivates his own nature through reciprocity,
    acknowledges difficulty in fulfilling reciprocal duties toward family, ruler,
    and friends, and aligns words with actions through sincerity. It then begins a
    chapter saying the superior man does what is proper to his station in varied circumstances.
  language: English
  quote_policy: quoted
