canonical_text:
  quote: ''
  summary: In Book II, the Master teaches that government by virtue resembles the
    north polar star, summarizes the Book of Poetry as having no depraved thoughts,
    contrasts rule by laws and punishments with guidance by virtue and propriety,
    recounts his own stages of learning from fifteen to seventy, and answers Mang
    I that filial piety is not being disobedient, later reporting this answer to Fan
    Ch'ih.
  language: English
  quote_policy: summarized
