canonical_text:
  quote: "“the waters, flowing out of their channels, inundated the Middle Kingdom”"
  summary: 'Kung-too asks Mencius about the charge that he is fond of disputing. Mencius
    says he is not fond of disputing but is compelled by the time, then recounts alternations
    of order and confusion: the great inundation in Yaou’s time, Yu’s ordering of
    the waters under Shun, later decay under oppressive rulers, and punitive actions
    by Chow-kung with King Woo.'
  language: English
  quote_policy: quoted
