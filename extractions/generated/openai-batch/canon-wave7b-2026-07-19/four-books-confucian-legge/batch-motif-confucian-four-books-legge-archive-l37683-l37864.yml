canonical_text:
  quote: ''
  summary: 'The passage includes several Mencius episodes: Mencius denies being unlike
    other people and says Yaou and Shun were also the same as other men; a man of
    Ts''e boasts of eating with wealthy and honorable people while secretly begging
    leftovers from tomb sacrifices, leading his wife and concubine to weep in shame;
    Mencius generalizes this as an example of disgraceful means used to seek wealth
    and honor; Wan Chang asks why Shun cried and wept in the fields toward pitying
    Heaven, and Mencius answers that Shun was dissatisfied and full of earnest desire.'
  language: English
  quote_policy: summarized
