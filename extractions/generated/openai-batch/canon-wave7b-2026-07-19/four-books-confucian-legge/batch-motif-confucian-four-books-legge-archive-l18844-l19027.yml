canonical_text:
  quote: ''
  summary: The passage consists of commentary and translated excerpts concerning rulership,
    Heaven's appointment, state treasures, ministerial virtue, and the ruler's duty
    to promote worthy people and remove bad people. It contrasts an ideal sincere
    minister who values and employs talented persons with a jealous minister who blocks
    them and endangers the state. It also says a truly virtuous person can banish
    such a bad minister, that a ruler who opposes the people's natural feelings invites
    calamities, and that the sovereign's great course is attained through self-devotion
    and sincerity rather than pride and extravagance.
  language: English with embedded Chinese terms and romanization
  quote_policy: summarized
