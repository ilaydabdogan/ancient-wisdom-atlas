canonical_text:
  quote: The relation between superiors and inferiors is like that between the wind
    and grass. The grass must bend, when the wind blows upon it.
  summary: Mencius advises that a prince seeking proper mourning practice must correct
    himself rather than blame others. He cites Confucian teaching that the ruler’s
    conduct sets an example for officers and ministers. Duke Wan then dwells in a
    mourning shed for five months and earns approval for his observance. In the following
    chapter, Duke Wan asks about governing, and Mencius counsels attention to the
    people’s livelihood, agriculture, restraint in taxation, and benevolent rule.
  language: English
  quote_policy: quoted
