canonical_text:
  quote: "“Recompense injury with justice, and recompense kindness with kindness.”"
  summary: The passage gives Confucius’ reply that injury should be repaid with justice
    and kindness with kindness. It then presents Confucius lamenting that no one knows
    him, saying that he does not complain against Heaven or men and that Heaven knows
    him. The passage also begins a later episode in which Kung-po Liao slanders Tsze-lu
    to Chi-sun, Tsze-fu Ching-po proposes violent public punishment, and Confucius
    begins a reply in terms of what is ordered for his principles.
  language: English
