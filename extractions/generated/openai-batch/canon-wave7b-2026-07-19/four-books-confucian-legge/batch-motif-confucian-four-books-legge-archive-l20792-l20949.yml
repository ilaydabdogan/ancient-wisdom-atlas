canonical_text:
  quote: ''
  summary: The passage describes mourning rules, then presents Chapter XIX on the
    far-extending filial piety of King Wu and the duke of Chau. Filial piety is defined
    as carrying out ancestors’ wishes and undertakings. Seasonal ancestral rites include
    repairing temple halls, setting out vessels and robes, and presenting offerings.
    Ancestral temple ceremonies order royal kindred by descent, rank, talent, worth,
    ritual participation, age, and inherited ceremonial roles.
  language: English
  quote_policy: summarized
