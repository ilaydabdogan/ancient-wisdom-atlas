canonical_text:
  quote: Be strong to do good. That is all your business.
  summary: The passage gives counsel that doing good may found a future imperial inheritance,
    while the final outcome rests with Heaven. Mencius then advises Duke Wan of T'ang
    by recounting King T'ae, who left Pin rather than let his people suffer over territory,
    and contrasts this with the view that a ruler should die defending an inherited
    kingdom. A later anecdote shows Duke P'ing of Loo preparing to visit the scholar
    Mang, but his favorite Tsang Ts'ang persuades him not to go.
  language: English
  quote_policy: quoted
