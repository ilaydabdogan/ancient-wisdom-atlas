canonical_text:
  quote: ''
  summary: The passage collects sayings attributed to the Master in Analects Book
    IX. He praises Hui/Yen Yuan for unflagging progress, warns that beginnings may
    fail to reach fruition, urges respect for youths with unknown potential, distinguishes
    hearing advice from reforming conduct, states principles of sincerity and self-correction,
    describes an inalienable human will, portrays Yu/Tsze-lu as unashamed in poor
    clothing among fur-clad men, uses pine and cypress in cold weather as an image
    of endurance, and associates wisdom, virtue, and boldness with freedom from perplexity,
    anxiety, and fear.
  language: English
  quote_policy: summarized
