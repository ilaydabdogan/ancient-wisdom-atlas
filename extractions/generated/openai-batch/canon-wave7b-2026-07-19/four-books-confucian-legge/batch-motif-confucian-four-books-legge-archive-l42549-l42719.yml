canonical_text:
  quote: ''
  summary: 'The passage includes commentary on t''ung and tsze trees and on nourishing
    the inner and outer person. Mencius teaches that although all parts of the person
    are loved and nourished, attention must be regulated by relative importance: great
    and noble parts must not be harmed for small and ignoble parts. Examples include
    a plantation keeper who cultivates inferior wild date trees while neglecting valuable
    trees, a man who nourishes a finger while neglecting shoulders or back, and a
    person concerned only with eating and drinking. In dialogue with Kung-too, Mencius
    says great men follow the great part of themselves, while little men follow the
    little part. The senses do not think and are drawn away by external things; the
    mind has the office of thinking, and by thinking gains the right view. Heaven
    has given both senses and mind, and the great man stands firm in the supremacy
    of the nobler part.'
  language: English
  quote_policy: summarized
