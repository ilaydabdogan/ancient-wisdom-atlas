  quote: ''
  summary: The passage presents Mencius criticizing ministers who enrich unrighteous
    rulers, discussing Pih Kwei's proposal for a very light tax, contrasting proper
    taxation with the models of Yaou and Shun and with Mih and Kee, rejecting Pih
    Kwei's claim to surpass Yu in water management, stating that a scholar requires
    faith, and reacting joyfully to the proposed appointment of Yo-ching in Loo.
