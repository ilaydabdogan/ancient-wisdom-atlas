canonical_text:
  quote: ''
  summary: A king says he transfers grain during bad years but sees no population
    increase compared with neighboring states. Mencius answers with a war analogy
    about soldiers who flee different distances, then describes royal government as
    noninterference with farming seasons, regulated fishing and forestry, provision
    for the living and dead, mulberry planting, proper animal breeding, protected
    farm labor, moral education, elder care, and eventual attainment of imperial dignity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king reports moving grain in bad years and asks why neighboring populations
    do not decrease while his own people do not increase.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mencius introduces an illustration from war in which soldiers advance to drums,
    cross weapons, then flee different distances.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king agrees that soldiers who fled fifty paces also ran away, and Mencius
    applies this answer to the king's expectation of greater population.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mencius states that uninterrupted husbandry, restriction of close nets, and
    timely use of axes and bills lead to abundance of grain, aquatic animals, and
    wood.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
- id: obs:5
  text: The passage says such abundance enables people to nourish the living and bury
    the dead without resentment, described as the first step of Royal Government.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:6
  text: Mencius directs that mulberry trees be planted by homesteads so that persons
    of fifty may be clothed in silk.
  category: action
  evidence_refs:
  - ev:8
- id: obs:7
  text: Mencius directs that breeding times of domestic animals not be neglected so
    that persons of seventy may eat flesh.
  category: action
  evidence_refs:
  - ev:9
- id: obs:8
  text: Mencius says the proper cultivation time for the hundred-mow farm should not
    be taken away so that the household supported by it avoids hunger.
  category: action
  evidence_refs:
  - ev:10
- id: obs:9
  text: Mencius calls for careful school education in filial and fraternal duties,
