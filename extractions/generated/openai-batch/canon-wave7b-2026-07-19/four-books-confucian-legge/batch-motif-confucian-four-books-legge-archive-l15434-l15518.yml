canonical_text:
  quote: Confucius said, "The Yin dynasty possessed these three men of virtue."
  summary: 'The passage introduces Book XVIII, recounting three Yin figures: the viscount
    of Wei withdraws from court, the viscount of Chi is enslaved or imprisoned, and
    Pi-kan remonstrates and dies. Commentary explains their relationship to the tyrant
    Chau and frames the book as concerned with duty to rulers and retirement from
    public service in degenerate times. A second chapter presents Hui of Liu-hsia,
    a chief criminal judge dismissed three times, who says that upright service will
    bring dismissal anywhere and that crooked service would give him no reason to
    leave his parents'' country.'
  language: English
  quote_policy: quoted
