  summary: Mencius describes Pih-c as refusing service to a disapproved prince, avoiding
    unesteemed friends and bad men, and treating proximity to moral disorder as comparable
    to wearing court dress amid mire and ashes. He is further described as leaving
    a villager whose cap was not properly adjusted.
