canonical_text:
  quote: ''
  summary: Mencius argues against an ideal of complete self-production by pointing
    to exchange among farmers and artisans. Ch'in Seeing concedes that handicraft
    cannot be combined with husbandry. Mencius extends the point to government, citing
    a saying that some labor with their minds and govern, while others labor with
    their strength and are governed. The passage then begins a Yaou-era account of
    an incompletely ordered world, with vast waters leaving their channels and causing
    universal inundation.
  language: English
  quote_policy: summarized
