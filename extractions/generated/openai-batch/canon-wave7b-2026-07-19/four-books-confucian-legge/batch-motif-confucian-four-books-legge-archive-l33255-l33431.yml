canonical_text:
  quote: ''
  summary: Mencius advises Tae Puh-shing that a ruler becomes virtuous through the
    company and example of virtuous attendants, illustrating this with an analogy
    about a child learning the speech of Ts'e or Ts'oo. Mencius then answers Kung-sun
    Chow about why he does not go to see princes, citing ancient precedent, examples
    of scholars avoiding rulers, and the episode of Yang Ho sending Confucius a roasted
    pig to compel a ritual visit. The passage also cites sayings against flattering
    conduct and insincere speech, and begins a separate exchange in which Tae Ying-che
    proposes gradual tax relief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mencius tells Tae Puh-shing that he sees Puh-shing desiring his king to be
    virtuous and will explain how that may be achieved.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mencius uses a hypothetical case of a great officer of Ts'oo who wants his
    son to learn the speech of Ts'e and asks whether a man of Ts'e or a man of Ts'oo
    should be tutor.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tae Puh-shing answers that the officer would employ a man of Ts'e to teach
    the son.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Mencius says that one Ts'e teacher surrounded by many Ts'oo speakers continually
    shouting would not enable the child to learn Ts'e, even if the father beat him
    daily.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Mencius says that if the child were placed for several years in Chwang or
    Yoh, he would not be able to speak Ts'oo even if his father beat him for that
    purpose.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:6
  text: Mencius says Tae Puh-shing has placed See Keu-chow, a scholar of virtue, in
    attendance on the king, but asks what one See Keu-chow alone can do for the king
    of Sung if the others in attendance are unlike him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Kung-sun Chow asks Mencius about the righteousness involved in Mencius not
    going to see princes, and Mencius replies that ancient practice forbade one who
    had not been a minister in a state from going to see the sovereign.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Mencius names Twan Kan-muh, who leaped over a wall to avoid the prince, and
    See Lew, who shut his door and would not admit the prince; Mencius judges these
    actions excessively scrupulous while allowing that an urgent prince may properly
    be seen.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Yang Ho sent Confucius a roasted pig while Confucius was away, using the rule
    that a scholar absent from home when a great officer sends a gift must go to the
    officer to pay respects; Confucius later went to pay respects when Yang Ho was
    out.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The philosopher Tsang says that those who shrug their shoulders and laugh
    flatteringly toil harder than a summer field laborer.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Tsze-loo says that some people talk with those with whom they lack community
    of feeling and show blushing faces; he says he does not desire to know such persons.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Mencius says the spirit nourished by the superior man can be known by considering
    the sayings of Tsang and Tsze-loo.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Tae Ying-che says he is not presently able to levy only a tithe and abolish
    duties at passes and markets, but will lighten both kinds of charges.
  category: speech
  evidence_refs:
  - ev:7
