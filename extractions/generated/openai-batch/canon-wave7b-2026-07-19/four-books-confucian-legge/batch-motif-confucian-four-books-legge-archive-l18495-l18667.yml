canonical_text:
  quote: ''
  summary: 'The passage cites the Book of Poetry to say that a ruler who rightly fulfills
    family roles can teach and rectify the people. It explains that governing the
    kingdom depends on regulating the family. It then describes state order through
    reciprocal conduct: the sovereign''s treatment of the aged, elders, and young
    becomes a model for the people, and a person should not impose on others what
    he dislikes receiving from them. This is named the principle of the measuring
    square.'
