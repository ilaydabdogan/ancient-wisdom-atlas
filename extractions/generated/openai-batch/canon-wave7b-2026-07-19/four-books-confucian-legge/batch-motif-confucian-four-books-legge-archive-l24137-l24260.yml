canonical_text:
  quote: The benevolent has no enemy.
  summary: The passage presents counsel that a ruler should govern benevolently through
    light punishments, light taxation, agricultural care, and moral cultivation. Such
    rule is said to make the people capable of resisting better-armed enemies, while
    oppressive rulers impoverish and scatter families as if driving them into deathly
    hazards. A saying asserts that the benevolent has no enemy. A following episode
    reports Mencius visiting King Seang of Leang and answering that the empire will
    be settled by being united under one sway.
  language: English
  quote_policy: quoted
