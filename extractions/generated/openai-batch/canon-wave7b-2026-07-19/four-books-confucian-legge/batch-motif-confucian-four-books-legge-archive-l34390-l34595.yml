  quote: '"It was by benevolence that the three dynasties gained the empire, and by
    not being benevolent that they lost it."'
  summary: The passage presents Mencius teaching that oppressive rulers lose life,
    reputation, and kingdom; benevolence preserves empire, states, temples, and persons;
    failed influence over others requires inward self-examination; personal character
    is the root of family, state, and empire; and government depends on relations
    with great families. It includes citations from the Book of Poetry and translator/commentary
    notes identifying dynastic examples and parallels.
