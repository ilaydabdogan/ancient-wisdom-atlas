canonical_text:
  quote: ''
  summary: Mencius visits King Ch'ow and is questioned about whether he has shown
    proper respect to the king. King Ch'ow cites hierarchical relations and ritual
    rules requiring prompt obedience to a father or prince. Mencius replies that true
    respect is to advise a ruler about benevolence and righteousness, invokes the
    ways of Yaou and Shun, quotes philosopher Tsang on possessing benevolence and
    righteousness rather than wealth and nobility, and ranks virtue as the highest
    qualification for helping the age and governing people.
  language: English
  quote_policy: summarized
