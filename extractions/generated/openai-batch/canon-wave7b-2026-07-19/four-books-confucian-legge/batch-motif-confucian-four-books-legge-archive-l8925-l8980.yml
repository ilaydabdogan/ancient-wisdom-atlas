canonical_text:
  quote: ''
  summary: Tsze-lu arranges for Tsze-kao to become governor of Pi. The Master rebukes
    him for injuring another man's son. Tsze-lu defends the appointment by saying
    that public people, officers, and ritual altars provide practical learning, asking
    why reading books is necessary. The Master criticizes this glib reply. The passage
    also begins the next chapter, where several disciples sit by the Master.
  language: English
