canonical_text:
  quote: ''
  summary: Mencius criticizes fixed adherence to one point, discusses hunger and thirst
    as conditions that can injure judgment, praises firm purpose, compares incomplete
    labor to stopping a well before reaching the spring, distinguishes natural, owned,
    and feigned virtue among rulers, and answers a question about E Yin's banishment
    and restoration of T'ae-kea. The passage ends by opening a quotation from the
    Book of Poetry.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The philosopher Mih is described as loving all equally and being willing to
    rub his whole body smooth from crown to heel if that would benefit the empire.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tsze-moh is said to hold a medium position, which is nearer the right, but
    the passage says that holding it without allowance for circumstances makes it
    like holding one point.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mencius says he hates holding to one point because it injures the way of right
    principle by taking up one point and disregarding a hundred others.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Mencius says hunger and thirst cause people to find any food or drink sweet
    and injure the palate; he adds that men's minds are also injured by them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mencius says that a man who can prevent hunger and thirst from being evils
    to his mind need not sorrow about not being equal to other men.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Hwuy of Lew-hea is said not to have changed his firm purpose of life even
    for the three highest offices of state.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A man with definite aims is compared to someone digging a well; if the digger
    stops at seventy-two cubits without reaching the spring, the well is treated as
    thrown away.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Benevolence and righteousness are described as natural to Yaou and Shun, made
    their own by T'ang and Woo, and feigned or borrowed by the five chiefs of the
    princes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kung-sun Ch'ow reports that E Yin banished T'ae-kea to T'ung because he was
    disobedient to reason; when T'ae-kea became virtuous, E Yin brought him back.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Mencius answers that worthies may banish sovereigns only if they have the
    same purpose as E Yin; otherwise the act would be usurpation.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage begins a citation from the Book of Poetry with the line that someone
    will not eat the bread of idleness.
  category: speech
  evidence_refs:
  - ev:7
