canonical_text:
  quote: '"righteousness is the way, and propriety is the door"'
  summary: Wan Chang asks why a scholar may refuse a prince's summons. Mencius answers
    that service duties and visits to a ruler differ, and that a scholar sought for
    learning, talents, or virtue must be approached according to proper ritual. He
    cites Tsze-sze, a forester who refused an improper flag-summons, Confucius's approval
    of that refusal, proper summoning articles by rank, a metaphor of the palace door,
    and a Book of Poetry image of a straight, level road. He also explains that Confucius
    responded to a summons because he was in office and called on official business.
    The next chapter begins by saying that distinguished virtuous scholars make friends
    with other virtuous scholars at village, state, and empire levels.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Wan Chang asks why a common man goes to perform service when called, while
    a scholar may refuse a prince's call to his presence.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mencius distinguishes going to perform a service from going merely to see
    the prince, judging the first right and the second not right in the case under
    discussion.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mencius says that if the prince seeks a scholar for extensive information,
    that person is a teacher, and even the emperor would not summon him in that manner.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mencius says he has not heard of someone wishing to see a person of talents
    and virtue and calling that person to his presence.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Duke Muh asks Tsze-sze about ancient princes of a thousand chariots being
    on terms of friendship with scholars; Tsze-sze is displeased and says the scholar
    should be served.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Tsze-sze frames the relation by station and virtue: the duke is sovereign
    and Tsze-sze subject by station, but by virtue the ruler should make Tsze-sze
    his master.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mencius concludes from the Tsze-sze example that even a prince of a thousand
    chariots could not obtain friendship with a scholar, much less call him to his
    presence.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Duke King of Ts'e, while hunting, calls his forester by a flag; the forester
    does not come, and the duke intends to kill him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Confucius is quoted as approving the forester's refusal because the summoning
