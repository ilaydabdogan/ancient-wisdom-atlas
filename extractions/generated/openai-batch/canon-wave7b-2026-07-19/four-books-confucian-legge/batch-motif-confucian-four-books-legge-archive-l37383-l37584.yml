canonical_text:
  quote: ''
  summary: 'The excerpt presents Mencian ethical examples: Yu and Tseih treat public
    drowning and hunger as if personally responsible; Yu, Tseih, and Yen would act
    appropriately if their circumstances were exchanged; urgent and non-urgent quarrels
    require different responses; Kung-too asks why Mencius treats K''wang Chang politely
    despite accusations of unfilial conduct; Mencius defines common forms of unfilial
    behavior and explains Chang''s conflict with his father and separation from wife
    and son; the next chapter begins with Tsang leaving Wooshing when plunderers approach.'
  language: English
