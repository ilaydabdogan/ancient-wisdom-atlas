canonical_text:
  quote: '"That whereby man differs from the lower animals is but small."'
  summary: 'The passage includes a water comparison about rain-filled field channels
    that soon dry and a superior man being ashamed of reputation beyond merit. Mencius
    then teaches that the difference between humans and lower animals is small: common
    people discard it, while superior men preserve it. Shun is presented as understanding
    things and human relations and walking the path of benevolence and righteousness.
    Mencius lists exemplary traits of Yu, T''ang, King Wan, King Woo, and the duke
    of Chow, and the next chapter begins by describing the cessation of imperial odes
    and the production of the Ch''un Ts''ew.'
  language: English
  quote_policy: quoted
