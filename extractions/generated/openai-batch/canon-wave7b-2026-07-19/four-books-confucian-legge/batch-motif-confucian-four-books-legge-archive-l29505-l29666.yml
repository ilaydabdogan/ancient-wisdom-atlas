canonical_text:
  quote: ''
  summary: 'The passage presents several Mencius dialogues: he explains why he did
    not discuss mission matters with Hwan; he answers Ch''ung Yu''s concern that the
    coffin for Mencius''s mother used overly fine wood by appealing to ancient coffin
    practice, natural feelings, and filial generosity; and he begins a judgment on
    whether Yen may be attacked, arguing that unauthorized transfer of Yen is invalid
    and comparing it to private transfer of salary and rank without the king.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kung-sun Ch'ow asks Mencius why, during travel from Ts'e to T'ang and back,
    he never spoke to Hwan about the matters of his mission.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mencius replies that proper officers attended to the mission matters and that
    he had no occasion to speak to Hwan about them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mencius goes from Ts'e to Loo to bury his mother, then on returning to Ts'e
    stops at Ying.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ch'ung Yu says he had been employed to superintend the making of the coffin
    and now asks about the matter, saying the coffin wood appeared too good.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Mencius says that anciently there was no rule for the size of the inner or
    outer coffin, while in middle antiquity each was made seven inches thick.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mencius says the seven-inch coffin practice was used by all, from emperor
    to common people.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mencius says the practice was not simply for appearance, but because it satisfied
    the natural feelings of the heart.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mencius says people lack pleasure if regulations prevent such coffins, or
    if they lack money to make them, but the ancients used the style when not prevented
    and able.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Mencius asks whether preventing earth from getting near the bodies of the
    dead gives satisfaction to natural human feelings.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Mencius says he has heard that the superior man will not be niggardly to his
    parents.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Shin T'ung asks whether Yen may be smitten, and Mencius replies that it may
    because Tsze-k'wae had no right to give Yen to another and Tsze-che had no right
    to receive Yen.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Mencius introduces an analogy in which a person privately gives an officer
    salary and rank without informing the king.
  category: speech
  evidence_refs:
  - ev:10
