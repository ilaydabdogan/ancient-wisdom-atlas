canonical_text:
  quote: "“it was like uniting the two halves of a seal.”"
  summary: The passage states that sages separated by great distance and time had
    the same principles when put into practice. A commentary explains the seal or
    tally image as an investiture token whose matching halves verify identity. Mencius
    then criticizes Tsze-ch'an for personally carrying people across rivers in his
    carriage, saying good government should provide general measures such as bridges
    rather than individual favors. The passage ends with Mencius addressing King Seuen
    with analogies for reciprocal regard between a prince and ministers.
