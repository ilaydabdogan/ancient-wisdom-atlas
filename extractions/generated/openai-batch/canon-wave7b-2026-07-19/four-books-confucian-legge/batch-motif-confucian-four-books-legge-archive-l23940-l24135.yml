canonical_text:
  quote: '"It was not I; it was the weapon"'
  summary: Mencius rebukes King Hwuy for allowing famine while animals and royal stores
    are fed, rejects the king's blaming of the year, compares negligent government
    to killing by a weapon, and uses images of beasts devouring people and wooden
    funerary figures to condemn rulers who cause starvation deaths. King Hwuy later
    recounts military losses and asks how to wipe away shame; Mencius answers that
    even a small territory may attain imperial dignity.
  language: English
  quote_policy: quoted
