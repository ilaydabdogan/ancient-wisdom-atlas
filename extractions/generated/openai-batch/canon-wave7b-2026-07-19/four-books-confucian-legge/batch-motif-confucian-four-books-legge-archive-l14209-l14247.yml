  summary: 'A fragment ranks dull people who learn above dull people who do not learn.
    Confucius then teaches that the superior man reflects on nine matters: clear seeing,
    distinct hearing, benign countenance, respectful demeanor, sincere speech, careful
    conduct of business, asking about doubts, considering the consequences of anger,
    and thinking of righteousness when gain appears. A note discusses wording and
    interpretation of a term related to not thoroughly understanding.'
