canonical_text:
  quote: They who accord with Heaven are preserved, and they who rebel against Heaven
    perish.
  summary: Mencius teaches that political submission differs under good and bad government,
    that safety depends on benevolence and accordance with Heaven, and that rulers
    seeking supremacy without benevolence court ruin. He illustrates the teaching
    with Duke King of Ts'e's marriage alliance, King Wan as an exemplar, quotations
    from the Book of Poetry, and Confucius's interpretation of a boy's song about
    clear and muddy water.
  language: English
  quote_policy: quoted
