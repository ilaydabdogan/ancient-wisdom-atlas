canonical_text:
  quote: '"To preserve one''s mental constitution, and nourish one''s nature, is the
    way to serve Heaven."'
  summary: The passage presents Mencius' teaching that knowing one's mind leads to
    knowing one's nature and serving Heaven; that a person should cultivate character
    without being unsettled by short or long life; that Heaven's appointment should
    be received submissively but not used to excuse reckless or wrongful outcomes;
    and that seeking is effective for what is within oneself, while external attainments
    depend on appointment.
