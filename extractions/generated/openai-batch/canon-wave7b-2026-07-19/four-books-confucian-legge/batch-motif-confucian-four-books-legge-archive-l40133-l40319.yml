canonical_text:
  quote: '"The feeling of respect."'
  summary: Wan Chang questions Mencius about the meaning and propriety of gifts, especially
    gifts from morally compromised donors. Mencius explains gifts as expressions of
    respect, distinguishes ordinary ranked exchange from violent robbery, cites an
    ancient rule against killers who seize property, and uses Confucius’ conduct as
    a precedent for receiving gifts from princes when handled according to propriety.
  language: English
  quote_policy: quoted
