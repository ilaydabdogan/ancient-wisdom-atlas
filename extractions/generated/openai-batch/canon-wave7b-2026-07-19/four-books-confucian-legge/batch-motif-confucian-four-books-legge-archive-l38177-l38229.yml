canonical_text:
  quote: ''
  summary: The passage uses an anecdote about Tsze-ch'an being deceived by a pond
    keeper over a fish to explain how a superior man may be misled by what appears
    proper but not by what violates right principle. It then applies this to Shun's
    sincere joy toward his hostile brother Seang. A commentary says Shun knew Seang
    wished to kill him but could not repress brotherly feeling. The next chapter opens
    with Wan Chang asking why, after becoming emperor, Shun only banished Seang, while
    Mencius answers that Shun made him a prince; Wan Chang then lists other punishments
    Shun imposed on criminals.
  language: English
