canonical_text:
  quote: ''
  summary: The passage includes a maxim about the superior man taking office to perform
    righteous duties, Confucius's judgments on named men who retired from the world,
    his statement that he is not fixed for or against any one course, and a list of
    music officials who departed or withdrew to other states, riverside regions, and
    an island in the sea.
  language: English
  quote_policy: summarized
