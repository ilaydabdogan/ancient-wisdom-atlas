- id: obs:1
  text: A superior man is described as taking office and performing righteous duties
    while knowing that right principles may fail to progress.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Seven men are named as having retired to privacy from the world: Po-i, Shu-ch''i,
    Yii-chung, I-yi, Chu-chang, Hui of Liu-hsia, and Shao-lien.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Po-i and Shu-ch'i are described as refusing to surrender their wills or submit
    to taint in their persons.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hui of Liu-hsia and Shao-lien are described as surrendering their wills and
    submitting to taint, while their words corresponded with reason and their actions
    were desirable to others.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Yii-chung and I-yi are described as hiding in seclusion, giving license to
    their words, preserving personal purity, and acting according to the exigency
    of the times.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Master states that he differs from these men by having no course for which
    or against which he is predetermined.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'Several music officials are said to have gone to other states: Chih to Ch''i,
    Kan to Ch''u, Liao to Ts''ai, and Chueh to Ch''in.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'Other music officials are said to have withdrawn to waterside or maritime
    locations: Fang-shu north of the river, Wu to the Han, and Yang and Hsiang to
    an island in the sea.'
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The commentary labels the musician passage as the dispersion of the musicians
