canonical_text:
  quote: '"he goes to his ka"'
  summary: The passage distinguishes coexisting Egyptian beliefs that the dead remain
    in or near the tomb and that they depart to a distant blessed realm. It then introduces
    Egyptian ideas of surviving aspects of personhood, focusing on the ka as a corporeal
    companion born with a person, communicated by a god, associated with the individual’s
    fortunes, and awaiting or guiding the individual in the hereafter. The passage
    notes formulas in which death is described as going to one’s ka, including for
    Osiris.
  language: English
  quote_policy: quoted
