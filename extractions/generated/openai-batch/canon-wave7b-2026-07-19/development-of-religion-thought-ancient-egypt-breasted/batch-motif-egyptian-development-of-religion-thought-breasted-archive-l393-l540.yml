canonical_text:
  quote: ''
  summary: 'The passage describes Egyptian solar myth and Pyramid Age theology: a
    lunar version of the lost divine eye is restored to the Sun-god by Thoth and becomes
    the Horus-eye; the Sun-god is imagined as an ancient king who punishes ungrateful
    humans and retires to the sky; Pyramid texts present the Sun-god as supreme over
    gods and human destinies; a Sun-hymn addresses Atum/Kheprer and Egypt as the Horus-eye,
    portraying Egypt as obedient to Horus, bringing resources to him, guarded by doors
    that open only to him, and saved from Set; the Sun-god is also described as ally
    and protector of the Egyptian king.'
  language: English
  quote_policy: summarized
