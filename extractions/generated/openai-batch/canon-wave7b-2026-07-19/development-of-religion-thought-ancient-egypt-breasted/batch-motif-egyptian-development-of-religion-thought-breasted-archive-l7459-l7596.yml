canonical_text:
  quote: ''
  summary: 'The passage presents the closing movement of the Egyptian “Misanthrope”
    document as an appeal to posthumous justification: the one who is “yonder” punishes
    wickedness, stands in the celestial barque, receives offerings, and prays to Re.
    Breasted then discusses the text’s scribal transmission and its importance for
    the emergence of individual moral conscience. The passage introduces a related
    tract by Khekheperre-sonbu, who seeks new speech rather than ancestral repetition
    and laments social disorder, violated divine plans, and distress throughout the
    land.'
  language: English
  quote_policy: summarized
