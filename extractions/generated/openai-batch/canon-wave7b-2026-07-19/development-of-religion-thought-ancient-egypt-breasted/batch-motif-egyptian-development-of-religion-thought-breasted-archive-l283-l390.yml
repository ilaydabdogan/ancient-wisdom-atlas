canonical_text:
  quote: ''
  summary: 'The passage surveys early Egyptian solar theology: local forms of the
    Sun-god as falcon, beetle, aged man, and Re; the four Horuses of the eastern sky;
    the coalescence of local Sun-gods; solar travel by barque across a celestial ocean;
    a royal sky-ascent formula; Shu''s separation and support of sky and earth; creation
    variants from primeval chaos, egg, lotus, and Ben-stone/Phoenix; the divine genealogy
    from the Sun-god through Shu and Tefnut to Geb, Nut, Osiris, Set, Isis, and Nephthys;
    and the Sun-god''s conflict with storm, rain, and cloud enemies.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Egyptian sun is described as the dominant natural fact in the Nile valley
    and as appearing in different, originally local forms.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Edfu the Sun-god appeared as a falcon, and the sun-disk with outspread
    falcon wings became a very common Egyptian religious symbol.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The falcon form bore the name Her or Horus, also Harakhte, glossed as 'Horus
    of the horizon.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Harakhte and three other Horuses formed four Horuses of the eastern sky, identified
    in the Pyramid Texts as four curly-haired youths seated on the east side of the
    sky.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Heliopolis the Sun-god appeared as an aged man descending in the west,
    and elsewhere as a winged beetle, Khepri, rising in the east.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The material sun was called Re, and early local Sun-gods were at first distinct
    but later correlated and coalesced.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A favored picture shows the Sun-god sailing across a celestial ocean in a
