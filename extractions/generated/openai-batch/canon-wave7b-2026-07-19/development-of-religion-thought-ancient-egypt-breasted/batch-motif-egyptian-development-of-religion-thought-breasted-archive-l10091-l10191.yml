  summary: The passage discusses Egyptian attempts to preserve or restore tombs, the
    eventual decay and forgetting of tomb owners, the use of tomb-front prayers to
    aid the dead, and the development of mortuary utterances from royal Pyramid Texts
    into broader coffin and popular mortuary literature associated with later Book
    of the Dead materials.
