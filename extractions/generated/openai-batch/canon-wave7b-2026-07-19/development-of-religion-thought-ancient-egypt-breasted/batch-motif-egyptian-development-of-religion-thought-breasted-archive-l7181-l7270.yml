  summary: Breasted comments on a section of the Egyptian Dialogue in which the speaker
    rejects pleasure as an adequate answer to mortality, argues that life is more
    intolerable than death, addresses poems to his own soul, laments that his name
    is abhorred through comparisons with foul odors and social disgrace, and begins
    a broader indictment of corrupt society.
