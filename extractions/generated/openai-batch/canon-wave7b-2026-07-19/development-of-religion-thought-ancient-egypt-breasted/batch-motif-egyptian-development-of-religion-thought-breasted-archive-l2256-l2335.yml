canonical_text:
  quote: ''
  summary: 'The passage describes Egyptian mortuary thought as a ritual reconstitution
    of the dead person: the deceased receives power to face adversaries in the beyond,
    the body and faculties are restored through ceremonies controlled by survivors
    and priests, and continued existence depends on tomb equipment, offerings, and
    assistance from surviving kin. Notes cite Pyramid Text examples of qualities or
    equipment such as power, soul, fearfulness, masks or faces, and ritual recitations
    and ointment offerings linked with Osiris, Horus, and Anubis.'
  language: English
  quote_policy: summarized
