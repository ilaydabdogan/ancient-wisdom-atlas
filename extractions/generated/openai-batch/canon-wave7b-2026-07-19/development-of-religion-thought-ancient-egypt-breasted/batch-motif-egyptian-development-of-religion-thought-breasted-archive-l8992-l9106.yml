canonical_text:
  quote: Look to the office of the vizier; be watchful over all that is done therein.
  summary: Breasted introduces and translates part of an Egyptian installation address
    for a newly appointed vizier. Pharaoh instructs the vizier that the office supports
    the whole land, is bitter rather than pleasant, requires loyalty to the king,
    impartial treatment, lawful handling of petitioners, avoidance of misunderstanding
    in legal procedure, and attention to a cautionary precedent concerning the vizier
    Kheti.
  language: English
  quote_policy: quoted
