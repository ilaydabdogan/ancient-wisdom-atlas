  summary: The passage surveys Pyramid Text evidence for truth, righteousness, deceit,
    legal vindication, and divine judgment. It argues that Re or the Sun-god is the
    earliest prominent divine figure associated with moral worthiness and judgment
    in the hereafter, while Osiris later assumes this role as moral judge. It also
    notes mortuary gods, a Barque of Truth/Righteousness, and statements about the
    dead king being justified and bringing truth.
