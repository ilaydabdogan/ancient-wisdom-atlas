canonical_text:
  quote: ''
  summary: The passage argues that Egyptian moral obligation and social justice ideals
    became attached to Re as ideal king and divine moral arbiter. It describes Osiris
    as tried before the Sun-god and later portrayed as a righteous ruler, while social
    justice doctrines contributed to the idea that afterlife felicity depends on righteousness
    rather than power or wealth. Tomb and coffin texts are cited for claims of righteousness,
    opened sky doors, ascent to Hathor, removal of evil, and weighing with Re's balances
    on the day of reckoning.
  language: English
  quote_policy: summarized
