canonical_text:
  quote: ''
  summary: Breasted introduces a lecture on Egyptian life after death and argues that
    Egypt's soil and climate, by preserving human bodies, favored belief in continued
    existence. He describes preserved bodies in cemeteries, then summarizes prehistoric
    Nile burials in which crouched bodies were placed in shallow pits with pottery,
    tools, weapons, utensils, and ornaments intended for the departed person's future
    life. He notes a long gap between these burials and the earliest surviving written
    documents.
  language: English
