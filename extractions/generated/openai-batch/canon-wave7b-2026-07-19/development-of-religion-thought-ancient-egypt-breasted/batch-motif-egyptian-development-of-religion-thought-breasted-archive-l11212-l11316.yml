canonical_text:
  quote: ''
  summary: 'The passage discusses the Egyptian judgment of the dead in Book of the
    Dead chapter CXXV: a court of forty-two judges, declarations of innocence, an
    address to gods in the Hall of Truth, claims of righteousness and charity, and
    an illustrated judgment scene with Osiris, Isis, Nephthys, the Heliopolitan Ennead,
    the balances of Re, Anubis, and Thoth.'
  language: English
  quote_policy: summarized
