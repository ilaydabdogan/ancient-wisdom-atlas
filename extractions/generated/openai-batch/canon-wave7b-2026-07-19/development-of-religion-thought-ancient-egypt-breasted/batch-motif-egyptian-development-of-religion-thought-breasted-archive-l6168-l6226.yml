canonical_text:
  quote: ''
  summary: Breasted introduces a lecture on moral sense, moral worthiness, and the
    hereafter. He contrasts Egypt's surviving material monuments with the mostly vanished
    moral and social atmosphere of daily life, then argues that Pyramid Age inscriptions
    preserve early evidence for moral discernment. He notes Egyptian references to
    a primordial company of the just before strife, conflict, Horus-Set mutilations,
    and death, and he cites a Memphite theological idea that a god's creative word
    produced what is loved and hated and assigned life to the peaceful and death to
    the guilty. He also identifies the emergence of an abstract term encompassing
    truth, right, righteousness, and justice.
  language: English
  quote_policy: summarized
