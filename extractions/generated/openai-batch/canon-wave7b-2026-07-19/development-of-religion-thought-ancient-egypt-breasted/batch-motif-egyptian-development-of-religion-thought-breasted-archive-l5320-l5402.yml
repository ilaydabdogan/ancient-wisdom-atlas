canonical_text:
  quote: ''
  summary: The passage discusses how Osirian, solar, celestial, western, and subterranean
    conceptions of the Egyptian hereafter intersect. It notes Horus placing Pepi among
    gods rather than over the dead, Osiris' relation to Nut and Geb, Nut's potentially
    non-Osirian celestial role, Osiris' identification with a western mortuary god
    and rulership of Dewat, and the ambiguous location of Dewat as both a netherworld
    and, in Pyramid Text examples, a sky or horizon region accessible to the deceased.
  language: English
  quote_policy: summarized
