canonical_text:
  quote: ''
  summary: The passage describes recurring mortuary rites and provisions for Hepzefi,
    including torch illumination, offerings at statues, temple and tomb processions,
    feast-day and daily food and beer distributions, and similar arrangements by Khnumhotep
    for his statues, kas, mortuary priest, and offerings. It also notes threats against
    anyone disturbing such provisions, the practical limits of long-term mortuary
    endowments, and later restoration of ancestral tombs by Upper Egyptian nomarchs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the eve of the Wag-feast, the great priest of Anubis brought torches, led
    colleagues, illuminated Hepzefi's statue in the temple court, and each priest
    placed a large white loaf at the statue's feet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A procession left the temple enclosure, moved through the streets while chanting
    Hepzefi's glorification, and reached another statue of him at the foot of the
    stairs leading up the cliff to his tomb.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the statue near the tomb stairs, the chief of the desert patrol was found
    returning from town magazines with beer, loaves, flat cakes, and white loaves
    for Hepzefi's priest at the tomb.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the day of the Wag-feast, priests of Upwawet in the town presented large
    white loaves at Hepzefi's statue in their temple and performed illumination and
    glorification while processing around the temple court.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: On monthly, half-monthly, and procession days, Hepzefi received a share of
    meat and beer offered in the temple of Upwawet.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Laymen serving in shifts at the temple of Anubis carried bread and beer every
    day to Hepzefi's statue on the lower stairs of his tomb.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that Hepzefi did not fail to receive food and drink necessary
    for his maintenance on any day of the year.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Khnumhotep says he adorned the houses of the kas, followed his statues to
    the temple, and assigned offerings of bread, beer, water, wine, incense, and beef
    joints to the mortuary priest.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Khnumhotep says he endowed the mortuary priest with fields and peasants and
    commanded mortuary offerings of bread, beer, oxen, and geese at many named necropolis
    feasts.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Khnumhotep's inscription warns that any mortuary priest or other person who
    disturbs the arrangements shall not survive, nor shall his son survive in his
    place.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that indefinite continuation of such gifts to a dead noble
    was impossible and depended on the mortuary priest retaining income and meeting
    obligations.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage gives examples of mortuary endowments or ancestral care lasting
    beyond immediate generations, including an endowment surviving a dynastic change
    and El-Bersheh nomarchs repairing Old Kingdom ancestral tombs.
  category: sequence
  evidence_refs:
  - ev:8
