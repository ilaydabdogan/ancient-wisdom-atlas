canonical_text:
  quote: ''
  summary: Breasted describes the Book of the Dead account of judgment after death,
    especially chapter CXXV. The deceased enters the Hall of Truth, addresses the
    great god and the forty-two gods, declares innocence of many wrongs, invokes purification,
    and faces a second scene in which Osiris and forty-two named divine or demonic
    judges sit in judgment. Breasted notes that this is a declaration of innocence
    rather than a confession.
  language: English
  quote_policy: summarized
