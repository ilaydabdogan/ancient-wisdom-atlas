    nomes, holy places, offerings, and divine likenesses; the gods enter bodies made
    from wood, stone, and metal; all gods and their kas are summoned to take possession
    of Neb-towe, the divine store-house of Ptah-Tatenen. Breasted comments that the
    Memphite theologian assumes Ptah at the beginning and understands all things as
    first existing in the god's thought.
