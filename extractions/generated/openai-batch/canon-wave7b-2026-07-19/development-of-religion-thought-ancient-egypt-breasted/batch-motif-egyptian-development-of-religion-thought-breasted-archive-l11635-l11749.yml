canonical_text:
  quote: ''
  summary: Breasted frames Egyptian imperial universalism as a context for perceiving
    the Sun-god's universal dominion, then cites a Sun-hymn from a British Museum
    stela by the twin architects Suti and Hor under Amenhotep III. The hymn praises
    the Sun-god as a daily-rising, self-generated creator, sky-traverser, giver of
    sustenance, falcon, mother, herdman, and possessor of Egypt.
  language: English
  quote_policy: summarized
