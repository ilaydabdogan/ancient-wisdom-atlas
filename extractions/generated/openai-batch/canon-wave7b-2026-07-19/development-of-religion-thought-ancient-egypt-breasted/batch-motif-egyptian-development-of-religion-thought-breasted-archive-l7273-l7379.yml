canonical_text:
  quote: ''
  summary: 'A lament headed “The Corruption of Men” repeatedly asks whom the speaker
    can address and catalogs social disorder: brothers and friends are untrustworthy,
    theft and robbery are common, the gentle and good are disregarded, the righteous
    are absent, and evil afflicts the land. The surrounding commentary says the sufferer’s
    soul shrinks back from death, briefly proposes pleasure as escape, and then moves
    toward the conviction that death is the only release from misery.'
