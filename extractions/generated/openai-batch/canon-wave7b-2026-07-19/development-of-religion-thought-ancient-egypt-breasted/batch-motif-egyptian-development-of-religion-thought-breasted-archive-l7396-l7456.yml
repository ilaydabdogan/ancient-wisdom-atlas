canonical_text:
  quote: ''
  summary: 'A translated Egyptian poem presents death as a welcome condition through
    similes of recovery from sickness, pleasant fragrance, sailing, flowing water,
    cleared sky, homecoming, and release from captivity. The surrounding commentary
    explains these images as figures for death as relief. A subsequent poem is summarized:
    the dead person, called "He who is yonder," becomes godlike, punishes wickedness,
    travels with the Sun-god in a celestial ship, ensures offerings to temples, and
    addresses Re as a respected sage.'
  language: English
  quote_policy: summarized
