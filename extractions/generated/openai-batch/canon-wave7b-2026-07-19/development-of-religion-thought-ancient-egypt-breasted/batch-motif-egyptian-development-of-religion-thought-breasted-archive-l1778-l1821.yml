canonical_text:
  quote: The utterance of the thought in the form of a divine fiat brought forth the
    world.
  summary: The passage summarizes a Memphite theological account in which Ptah conceives
    in his heart and brings what is conceived into objective reality through the utterance
    of his tongue. The author compares this speech-based creation to Genesis and tentatively
    to the Alexandrian Logos, while stressing that the created “world” is understood
    here as the Egyptian Nile valley rather than the whole world. The passage also
    gives source-critical notes on the document’s age and ends by identifying an early
    moral idea that God gives life to the peaceful and death to the guilty.
