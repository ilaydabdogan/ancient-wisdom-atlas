canonical_text:
  quote: ''
  summary: The passage describes Pyramid Text rituals in which Atum and the gods are
    invoked to preserve the king, his pyramid, and mortuary building; Atum’s Heliopolitan
    creation of Shu and Tefnut is recalled as a basis for extending his ka-protecting
    arms to the king and pyramid. It then describes royal mortuary offerings in the
    pyramid temple and explains how Osirian belief recast these offerings through
    the myth of Horus offering his eye to Osiris, so that every offering to the dead
    king could be called the Horus-eye.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The priestly speech calls all gods to gather and unite as they had gathered
    for Atum in Heliopolis, for the benefit of king Pepi II.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Atum is represented as promising offerings, honor, soul-status, and might
    to gods who cause good things to belong to king Pepi II and make his pyramid and
    building endure.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The priest addresses Atum as Sun-god and recalls him being lofty on the sacred
    ben at Heliopolis, shining as Phoenix of the ben, and producing Shu and Tefnut
    by spewing and spitting.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Atum is said to have put his arms behind Shu and Tefnut as a ka-arm, and the
    priest asks Atum to put his arms behind king Mernere, the building, and the pyramid
    so that the king’s ka may endure in it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The priest commends the pyramid to the Ennead and uses each god’s firm name
    as a model for the firmness of the king’s name, pyramid, and building.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dead king’s needs are described as being met beneath the pyramid through
    a rich ritual performed in the temple before the tomb.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The mortuary ritual includes calendar feasts and formulae for offering food,
    drink, clothing, ointment, perfume, and incense.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that the mortuary-maintenance system came under Osirian
    domination, although the tomb itself remained a symbol of the Sun-god.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Osiris is described as having died on earth as men die, and the human aspects
    of his story are said to have been adopted for the life and death of everyone.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Horus offered to Osiris the eye that Set had wrenched out; the passage says
    this act made Osiris a soul and became a blessing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Horus-eye became the primal type of offerings to the dead, and every offering
