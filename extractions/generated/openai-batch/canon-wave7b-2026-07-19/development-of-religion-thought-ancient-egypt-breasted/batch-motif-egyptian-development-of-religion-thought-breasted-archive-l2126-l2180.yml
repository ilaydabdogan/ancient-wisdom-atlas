  text: The passage describes the "shadow" as a symbol, but not as another element
    of personality.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that, besides the body and ba, there was only the ka, described
    as a protecting genius and not as an element of personality.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: An unnamed goddess is said to restore the dead by setting on the head, gathering
    the bones, uniting the members, and bringing the heart into the body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The priest assures mourning relatives that King Unis does not enter Geb, the
