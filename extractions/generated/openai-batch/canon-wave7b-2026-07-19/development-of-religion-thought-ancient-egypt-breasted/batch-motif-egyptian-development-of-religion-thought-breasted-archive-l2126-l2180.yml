  summary: Breasted discusses Egyptian mortuary/personality terms including y'bw,
    shadow, ba, and ka, then cites Pyramid Texts passages in which a goddess and priest
    restore or awaken the dead, open the tomb and coffin, and offer water, bread,
    and beer to the dead king.
