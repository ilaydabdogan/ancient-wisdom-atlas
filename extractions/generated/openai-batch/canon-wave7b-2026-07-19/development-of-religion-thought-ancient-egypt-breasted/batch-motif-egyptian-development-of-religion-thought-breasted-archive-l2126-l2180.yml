literal_observations:
- id: obs:1
  text: The passage says that the possessive expression "his y'bw" or "his glorious
    one" does not mean that y'bw was an additional element of personality; Osiris
    "going to his y'bw" is treated as a substitution for the phrase "going to his
    ka."
  category: relationship
  evidence_refs:
