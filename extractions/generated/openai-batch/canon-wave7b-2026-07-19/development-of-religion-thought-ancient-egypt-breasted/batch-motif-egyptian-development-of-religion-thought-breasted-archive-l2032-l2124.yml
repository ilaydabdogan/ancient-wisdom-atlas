canonical_text:
  quote: '"that thou mayest become a ba among the gods"'
  summary: The passage explains Egyptian ideas of the ka as a protective guardian
    genius, the living person as body plus intelligence and breath, the ba as a human-headed
    bird-man associated with death and afterlife existence, and mortuary rites intended
    to prevent bodily decay and restore the dead body’s senses and members, sometimes
    through divine action by Isis or Horus.
  language: English
  quote_policy: quoted
