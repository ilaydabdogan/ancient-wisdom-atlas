canonical_text:
  quote: ''
  summary: The passage surveys Egyptian textual and visual evidence in which Osiris
    is associated with earth, soil, Nile waters, breath, vegetation, grain, trees,
    wine, the deceased king, and annual fertility. It presents Osiris as an ever-dying
    and ever-reviving god, later treated as an ancient king and heir of Geb who receives
    dominion over land, water, air, plants, animals, and other living beings.
  language: English
  quote_policy: summarized
