  quote: till the "Imperishable Stars" are called "followers of Osiris."
  summary: Breasted describes solar afterlife beings and transport devices being reinterpreted
    within Osirian mortuary religion. The four genii and four Horuses are linked with
    the celestial ferry; the four genii become avengers and body-bearers of Osiris
    and later protect the viscera in Canopic jars. The solar ferryman, ferry-boat,
    reed floats, ladder, sky, stars, Nile inundation imagery, temple, and pyramid
    are presented as incorporated into Osirian conceptions of the hereafter.
