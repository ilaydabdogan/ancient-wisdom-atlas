canonical_text:
  quote: ''
  summary: The passage describes the deceased Egyptian king's arrival before Re in
    the celestial hereafter. Intermediaries such as a ferryman, gatekeeper, or Re's
    servant may announce him. Divine figures proclaim his coming at the four cardinal
    points, identify him as imperishable and as Re-Atum's son, and call on Re to lift
    and embrace him. The passage then describes the king taking a scribal or advisory
    office in Re's celestial court, handling edicts, decrees, messengers, and the
    divine book.
  language: English
