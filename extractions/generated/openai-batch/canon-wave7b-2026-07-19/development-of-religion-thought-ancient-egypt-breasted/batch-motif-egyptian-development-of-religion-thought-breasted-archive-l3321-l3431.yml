canonical_text:
  quote: ''
  summary: Breasted characterizes the Pyramid Texts as chiefly aimed at securing the
    dead king's felicity and eternal life in the hereafter. He emphasizes their repeated
    denial of death, their formulas of living, rising, and imperishability, their
    euphemistic handling of death, and their compilation from varied ritual, magical,
    hymnic, mythic, and petitionary materials arranged as Utterances by priestly editors.
  language: English
  quote_policy: summarized
