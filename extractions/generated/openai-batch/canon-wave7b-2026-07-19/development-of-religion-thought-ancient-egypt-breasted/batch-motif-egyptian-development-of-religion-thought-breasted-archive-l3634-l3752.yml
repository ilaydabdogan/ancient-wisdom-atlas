canonical_text:
  quote: Death was on earth; life was to be had only in the sky.
  summary: 'The passage summarizes Breasted''s account of Pyramid Text afterlife geography:
    an older uncertainty about the dead''s location, a western realm that is present
    but subordinated, an emphatic eastern and celestial destination, and the blending
    of stellar and Solar afterlife doctrines in which the royal dead may become stars,
    join Re, rise with the sun, or be taken into the sky.'
  language: English
