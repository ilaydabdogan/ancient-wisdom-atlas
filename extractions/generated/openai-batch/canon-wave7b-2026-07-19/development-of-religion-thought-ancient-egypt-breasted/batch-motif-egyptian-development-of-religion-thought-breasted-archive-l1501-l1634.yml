canonical_text:
  quote: ''
  summary: The passage describes the deceased Pharaoh's identification with Osiris
    and resuscitation by Horus and Isis; the theological harmonization of Osiris with
    the Sun-god; the originally Solar character of the Horus-Set feud; Set's positive
    mortuary functions and equality with Horus; the division of Egypt between Horus
    and Set; and a Memphite theological account in which Geb first separates and assigns
    lands to Horus and Set, then gives the heritage to Horus, who unites the land.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The deceased Pharaoh is said to become Osiris and to receive resuscitation
    by Horus and Isis, divine privileges, and felicity in the hereafter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the Sun-god and Osiris were correlated by Solar theologians
    at Heliopolis, producing a theological system from already interfused popular
    faiths.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage presents the Horus-Set feud as originally a Solar incident and
    independent of the Osiris myth.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Set's spittle is described as purifying the dead in mortuary ceremonies in
    the same terms as Horus's spittle, and Set is said to perform friendly offices
    for the dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Horus and Set are described as standing on either side of the dead, holding
    the dead person's arms and aiding ascent to the Sun-god.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Set is described as king of the South on equal terms with Horus as king of
    the North, with both appearing side by side in the Pyramid Texts.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: An old doctrine is reported in which Set is in charge of the ladder by which
    the dead may ascend to the Sun-god, a ladder Set himself once climbed.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Old royal monuments are said to show the falcon of Horus and the animal of
    Set side by side as symbols of kingship over the two kingdoms under one Pharaoh.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The author states that the process by which Set became the enemy of Osiris
    is unknown; after that development, Horus's hostility to Set involved Horus in
    the championship of Osiris's cause.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A Memphite document is described as showing the absorption of the Set-Horus
    feud by Osirian theology through Geb's assignment of kingdoms while also involving
    Osirian story elements.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the dramatic dialogue, Geb sends Set to the place of his birth, sends Horus
    to the place where Horus's father was drowned, separates them, and associates
    Set with Upper Egypt and Horus with Lower Egypt.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Geb is said to convey his heritage to an heir called the son of his first-born
    son.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: The commentator says Geb gathered the Divine Ennead, separated Horus and Set,
    prevented their conflict, and installed Set in Upper Egypt and Horus in Lower
    Egypt.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The commentator says Geb found it evil that Horus's portion was only equal
    to Set's, gave the heritage to Horus, and Horus united the land.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: 'The passage concludes that the Osirian point of view no longer permitted
    equal rule by Set and Horus: Set was dispossessed and Horus received all Egypt.'
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:16
  text: The passage says the Heliopolitan Solar theologians built an Ennead headed
    by Atum, and that Osiris appears within this group.
  category: relationship
  evidence_refs:
  - ev:13
