comparison_claims:
- id: claim:1
  claim: Within the passage's account, the Horus-Set conflict is treated as an originally
    Solar episode that was later absorbed into Osirian theology, rather than as originally
    part of the Osiris myth.
  claim_level: same_motif
  target: Horus-Set feud in Solar theology compared with the Horus-Set opposition
    in Osirian theology
  evidence_refs:
  - ev:3
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage states that the process by which Set became the enemy of
    Osiris is unknown, so it supports theological absorption but not a detailed historical
    reconstruction.
- id: claim:2
  claim: 'The passage contrasts two royal-legitimacy patterns: an older dual rule
    in which Horus and Set divide Egypt, and an Osirian pattern in which Horus receives
    the heritage and unites all Egypt.'
  claim_level: same_function
  target: Dual Horus-Set kingship and unified Horus kingship as royal-legitimacy patterns
    within Egyptian theological tradition
  evidence_refs:
  - ev:5
  - ev:7
  - ev:10
  - ev:12
  - ev:13
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is internal to the Egyptian materials as presented by
    the passage and should not be extended cross-culturally without additional evidence.
