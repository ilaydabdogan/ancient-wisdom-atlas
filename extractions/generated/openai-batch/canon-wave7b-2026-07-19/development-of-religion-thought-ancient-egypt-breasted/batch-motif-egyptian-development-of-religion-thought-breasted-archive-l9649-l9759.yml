canonical_text:
  quote: ''
  summary: 'The passage describes the Feudal Age continuation and popularization of
    Egyptian mortuary practices: despite skepticism about tombs and funerary equipment,
    common people and officials maintained tomb-building, offering formulae, royal
    and noble mortuary institutions, and ritual contracts. It discusses moral worthiness
    in the hereafter, denial of burial as a punishment for hostility to the king,
    royal tomb construction compared with Gizeh, Osiris rejoicing over royal monuments,
    and Hepzefi''s statues and contracted rites in temples and tomb.'
  language: English
  quote_policy: summarized
