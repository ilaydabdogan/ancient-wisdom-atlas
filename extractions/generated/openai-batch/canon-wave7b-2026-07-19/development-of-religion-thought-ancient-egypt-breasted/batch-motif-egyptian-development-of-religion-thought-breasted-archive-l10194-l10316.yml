canonical_text:
  quote: ''
  summary: The passage describes Coffin Text and early Book of the Dead material as
    preserving a largely celestial and solar hereafter. The deceased identifies with
    Re-Atum, Atum, the Sun-god, a falcon, and the Phoenix; ascends to the sky; embarks
    in Re's ship; enters the West among Re's followers; and may become Re's scribe
    or one of the great of Heliopolis. The passage also describes Osirian editorial
    reinterpretation, in which Solar material is given Nether World titles and Re
    is placed within a subterranean afterlife framework.
  language: English
  quote_policy: summarized
