canonical_text:
  quote: ''
  summary: 'The passage summarizes the later speeches of the peasant in an Egyptian
    tractate: he denounces an avaricious official, appeals to justice, invokes Thoth
    and the word of Re, asks whether the scales of justice have swerved, and warns
    of deceit. After an unanswered final plea to Anubis, Rensi records the petitions
    and brings the roll to the king, who orders judgment. The damaged ending suggests
    punishment of Thutenakht and restitution to the peasant. Breasted then characterizes
    the tractate as literature with a moral purpose advocating justice and kindness
    toward the poor.'
  language: English
  quote_policy: summarized
