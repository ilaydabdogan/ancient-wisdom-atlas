canonical_text:
  quote: ''
  summary: 'The passage describes Egyptian mortuary obligations: Osiris as a deity
    connected with the dead; the son''s duty to equip and bury his father for the
    hereafter; examples of Sebni recovering his father Mekhu''s body for embalming,
    and a noble wishing to be buried with his father Zau; and the practice of royal
    officials being buried near the Pharaoh with royal assistance for tombs and funerals.'
  language: English
  quote_policy: summarized
