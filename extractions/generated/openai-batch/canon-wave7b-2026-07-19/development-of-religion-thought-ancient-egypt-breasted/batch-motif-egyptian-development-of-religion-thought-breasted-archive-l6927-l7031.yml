canonical_text:
  quote: ''
  summary: The passage presents Breasted's discussion and translation of a fragmentary
    Egyptian song from the tomb of Neferhotep at Thebes. It links doubts about survival
    beyond the grave with sensual enjoyment, describes the passing of bodies and succession
    of generations, invokes the daily solar course of Re and Atum, urges Neferhotep
    to celebrate with perfume, lotus garlands, music, and companionship until the
    coming 'day of mooring' in the silent land, recalls the disappearance of former
    houses and tombs, questions mortuary trees and a pool for the soul, and contrasts
    tomb provisions with giving bread to the fieldless as a source of enduring good
    name.
  language: English
  quote_policy: summarized
