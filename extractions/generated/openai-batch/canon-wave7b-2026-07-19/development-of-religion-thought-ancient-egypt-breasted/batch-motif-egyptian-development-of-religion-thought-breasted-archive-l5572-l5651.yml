canonical_text:
  quote: The dying Sun and the dying Osiris are here in competition.
  summary: Breasted describes Pyramid Text passages in which Osiris is transferred
    from earthly to celestial company, ascends to the sky, is raised from the dead
    by Re, and becomes associated with celestial rulership. The departed Pharaoh follows
    a skyward afterlife route, is welcomed by Osiris, joins the Imperishable Stars,
    and is textually identified with Osiris. The passage frames these developments
    as an Osirianization of Solar mortuary theology and as a conflict between state
    Solar religion and popular Osirian belief.
  language: English
