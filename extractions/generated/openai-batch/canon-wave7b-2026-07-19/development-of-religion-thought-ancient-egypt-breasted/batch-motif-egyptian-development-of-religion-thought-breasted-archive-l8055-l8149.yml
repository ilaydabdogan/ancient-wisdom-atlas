canonical_text:
  quote: ''
  summary: The passage is a scholarly discussion of the Ipuwer tractate. It says Gardiner
    reads the long arraignment as a description of existing conditions rather than
    prediction, while later admonitions and the so-called Messianic passage look toward
    future betterment and a looked-for redeemer. Breasted summarizes the sage as rebuking
    the king, contrasting Ipuwer with the hopeless Misanthrope, and presenting a vision
    of social redemption by a righteous king. The passage then cautiously connects
    this Egyptian vision of an ideal age and ideal king with Hebrew Messianism and
    with broader movement of literary materials between Egypt and Palestine.
  language: English
  quote_policy: summarized
