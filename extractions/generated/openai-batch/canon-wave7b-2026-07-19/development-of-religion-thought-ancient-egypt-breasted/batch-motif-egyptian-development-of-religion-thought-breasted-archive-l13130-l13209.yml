  summary: The passage gives hymnic and votive material about Amon/Amon-Re as a deity
    who hears cries of distress, gives breath, saves the poor and afflicted, may punish
    sin but turns to graciousness, and receives a promised stela and written hymn
    after saving Nakht-Amon. A second prayer, introduced as similar, asks Amon for
    rescue during unseasonable weather and distress, again emphasizing breath, sweet
    air, and divine aid.
