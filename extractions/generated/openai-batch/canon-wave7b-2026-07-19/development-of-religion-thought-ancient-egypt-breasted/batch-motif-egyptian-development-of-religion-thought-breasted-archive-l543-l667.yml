canonical_text:
  quote: ''
  summary: 'Breasted describes the rise of Re as royal and state deity in Egypt: a
    folk-tale about Khufu’s line being replaced by sons of the Sun-god, the Fifth
    Dynasty’s adoption of the title “Son of Re,” solar sanctuaries with obelisks and
    pyramids, the ideology that Pharaoh was physically begotten by the Sun-god through
    an earthly mother, Alexander’s later appeal to Egyptian divine sonship, and the
    transfer of royal ritual language and kingship imagery from Pharaoh to Re.'
  language: English
  quote_policy: summarized
