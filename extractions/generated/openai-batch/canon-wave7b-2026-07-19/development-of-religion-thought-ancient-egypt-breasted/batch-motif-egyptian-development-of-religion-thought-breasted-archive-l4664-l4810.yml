    amid cosmic disturbance. He is presented as stronger than his divine father Atum,
    assisted by named supernatural servants, and nourished by consuming gods, their
    organs, hearts, charms, and souls. He encircles the Two Skies, receives appointment
    from Orion, and dawns again as lord of the horizon.
