  quote: Forget not to judge justice. It is an abomination of the god to show partiality.
  summary: The passage gives instructions for the vizier or high official to administer
    impartial justice, hear petitioners, avoid wrongful anger, ground public fear
    in justice rather than tyranny, and act without delay. Breasted’s commentary identifies
    the document’s chief theme as social justice, especially protection of the timid
    and defenceless against the powerful and arrogant.
