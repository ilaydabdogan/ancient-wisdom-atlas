canonical_text:
  quote: ''
  summary: The passage summarizes an episode in which Bata is separated from his brother
    by the Sun-god, departs to the Valley of the Cedar, is betrayed through a wife
    brought to Pharaoh, dies when a cedar linked with his life is cut, is revived
    by Anubis through a cedar blossom placed in water, assumes the form of a sacred
    bull, becomes persea-trees after the bull is killed, and is reborn as a son who
    becomes Pharaoh's heir and king. The author then interprets Bata's repeated emergence
    in forms such as cedar, persea-tree, and bull as related to Osiris incidents and
    Sun-god myth, and connects this with later solar pantheism.
  language: English
  quote_policy: summarized
