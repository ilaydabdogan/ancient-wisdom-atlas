canonical_text:
  quote: ''
  summary: The passage describes multiple Pyramid Text devices by which the dead king
    ascends to the sky after other means of crossing the eastern sea may fail. The
    king is imagined with wings or as a falcon, goose, grasshopper, beetle, cloud,
    flame, or other aerial form; he is carried by wind, clouds, rain-cloud, incense
    smoke, solar rays, stairs, and ladders. Solar deities and spirits set up or make
    the stairway or ladder, and a charm identifies the king's body parts with gods
    while threatening or rewarding gods according to whether they help lay steps for
    him.
  language: English
  quote_policy: summarized
literal_observations:
