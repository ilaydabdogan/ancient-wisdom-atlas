canonical_text:
  quote: ''
  summary: 'The passage frames The Eloquent Peasant and the Wisdom of Ptahhotep as
    tractates expressing practical principles of right living and justice. It then
    summarizes the opening of The Eloquent Peasant: a Fayum/Natron peasant traveling
    with donkeys to Heracleopolis is entrapped by Thutenakht, a subordinate official,
    robbed and beaten, and then seeks justice from Rensi, the Pharaoh’s grand steward,
    who is reputed for justice.'
  language: English
  quote_policy: summarized
