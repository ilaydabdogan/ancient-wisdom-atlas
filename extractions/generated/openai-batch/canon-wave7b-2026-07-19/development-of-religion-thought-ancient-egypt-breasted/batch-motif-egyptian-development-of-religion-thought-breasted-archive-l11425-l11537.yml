  summary: The passage discusses Breasted's account of Egyptian Book of the Dead magic
    entering postmortem moral judgment, including the heart scarab charm, copied judgment
    rolls, and formulas for acquittal. It contrasts magical vindication with Solar-faith
    righteousness under Re, and notes an Osirian underworld conception of the Sun-god
    traveling through caverns to bring light to the dead.
