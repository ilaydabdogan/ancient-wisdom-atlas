canonical_text:
  quote: ''
  summary: The passage describes the diversion and reuse of mortuary endowments, the
    administrative and physical decline of Old Kingdom pyramid-temples and cemeteries,
    and an interpretive transition from reliance on monumental masonry and material
    provision for the dead toward the Pyramid Texts and a less materially dependent
    hope of well-being elsewhere after death.
  language: English
  quote_policy: summarized
