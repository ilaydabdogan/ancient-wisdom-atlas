canonical_text:
  quote: ''
  summary: 'The passage describes Egyptian elite mortuary provision: royal burial
    goods for Zau, noble wills and endowments for tomb upkeep and offerings, engraved
    contracts in tomb-chapels, large economic endowments of towns, villages, and priests,
    royal contributions, and the expectation that the dead would be protected from
    hunger, thirst, and cold and would continue participating in annual feasts in
    the hereafter.'
  language: English
  quote_policy: summarized
