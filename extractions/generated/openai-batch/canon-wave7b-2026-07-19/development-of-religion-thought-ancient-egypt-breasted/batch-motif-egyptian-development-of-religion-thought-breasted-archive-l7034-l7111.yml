canonical_text:
  quote: There is none that returns again.
  summary: The excerpt presents fragmentary song lines about weeping songstresses,
    mummies before Re, lamentation, fate, and death. Breasted then summarizes a skeptical
    song on the vanity of wealth, the inability to take goods after death, the absence
    of return from the land of death, self-indulgence, and the value of leaving a
    good name. The passage also introduces the so-called Dialogue of a Misanthrope
    with His Own Soul as a Middle Kingdom text about unjust suffering, despair, and
    death as escape, and compares it to the Hebrew Book of Job.
  language: English
  quote_policy: quoted
