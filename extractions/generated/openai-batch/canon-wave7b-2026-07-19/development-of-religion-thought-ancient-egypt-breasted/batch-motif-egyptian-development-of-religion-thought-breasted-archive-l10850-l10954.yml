canonical_text:
  quote: '"Hast thou come to take away this my living heart? This my living heart
    is not given to thee;"'
  summary: The passage explains how an Egyptian child-protection charm using spoken
    exorcism and a swallowed mixture was understood as effective against disease-bearing
    or child-snatching demons, some identified with the dead. It then traces how such
    daily-life magic was adapted for mortuary use, especially to prevent a dead man's
    heart from being taken in the Nether World. The passage describes Empire-period
    mortuary papyri, later called the Book of the Dead, as non-fixed collections of
    titled charms, hymns, judgment material, and illustrations intended to help the
    deceased in the afterlife.
  language: English
  quote_policy: quoted
