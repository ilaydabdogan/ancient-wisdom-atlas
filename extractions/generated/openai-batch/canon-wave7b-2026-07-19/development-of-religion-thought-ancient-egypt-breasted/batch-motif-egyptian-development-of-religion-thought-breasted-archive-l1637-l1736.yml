canonical_text:
  quote: Every divine word came into existence by the thought of the heart and the
    conunandment of the tongue.
  summary: The passage describes the drawing of local Egyptian gods into Solar theology,
    then summarizes a Memphite theological system centered on Ptah. In that system
    Ptah has an ennead of himself and eight emanations; Atum is acknowledged as immediate
    creator, but Ptah's heart and tongue are identified as the mind and commanding
    speech through which gods, divine words, offerings, crafts, life, and death come
    into being.
  language: English
  quote_policy: quoted
