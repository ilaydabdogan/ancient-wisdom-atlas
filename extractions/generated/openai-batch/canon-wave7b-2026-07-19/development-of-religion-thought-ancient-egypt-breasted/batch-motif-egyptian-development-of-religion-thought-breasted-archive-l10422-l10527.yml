  summary: Breasted describes Coffin Text chapters that extend formerly royal afterlife
    privileges to ordinary persons, providing the deceased with a Nether World house,
    garden, household, food, and drink. The passage also describes the Nether World
    as dangerous and emphasizes charms, magical identity, bodily protection, and a
    hostile scribe named Gebga whose writing tools are destroyed by a charm.
  language: English
