canonical_text:
  quote: ''
  summary: The passage describes how ideals of humane kingship and the shepherd-sovereign
    were transferred to Re and the Solar/Aton faith. It emphasizes truth or righteousness
    in Ikhnaton's movement, including Truth as daughter of the Sun-god, the king's
    epithet "living in truth," the capital as the "seat of truth," and court officials'
    rejection of lying. It contrasts Amarna truth ethics with the older Osirian and
    Book of the Dead judgment complex.
  language: English
  quote_policy: summarized
