  summary: The passage discusses early Egyptian celestial hereafter beliefs in which
    the dead king is protected from hunger, thirst, bodily evil, and enemies. King
    Pepi travels with the Morning Star in a celestial barque toward the Field of Offerings,
    reaches an island where the Imperishable Stars give him the tree of life, and
    receives protections such as a powerful name and identifying costume.
