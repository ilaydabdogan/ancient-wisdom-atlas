canonical_text:
  quote: ''
  summary: 'The passage summarizes an Osirian litigation scene: Set, after Horus defeats
    him and Osiris is resurrected, brings charges before the gods at Heliopolis in
    an effort to gain Egypt''s throne. Pyramid Texts are cited depicting cosmic disturbance,
    Horus and Thoth appearing, Osiris being raised before divine assemblies, Set''s
    denials, Isis and Nephthys supporting Osiris, and a legal verdict vindicating
    Osiris. The passage then describes divine satisfaction at Thoth''s favorable word
    and several variant penalties imposed on Set, including bearing Osiris, being
    bound, or being cut up as food for the gods.'
  language: English
  quote_policy: summarized
