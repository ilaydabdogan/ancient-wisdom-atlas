canonical_text:
  quote: ''
  summary: 'A translated hymn praises a self-made primordial solar deity who illuminates
    Egypt, governs seasons, heat, cold, and daily rejoicing. Breasted interprets the
    hymn as extending the Sun-god''s sway over all lands and peoples, while retaining
    older imagery. He connects humane epithets such as herdsman, sustainer, and mother
    to Feudal Age social thought, then explains that the hymn is addressed to Amon
    as Harakhte: Amon, once a local Theban god, had been identified with the Sun-god
    as Amon-Re and raised to supremacy in state theology through Theban imperial power.'
  language: English
  quote_policy: summarized
