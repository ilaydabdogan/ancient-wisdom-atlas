  quote: The Solar hereafter is properly a royal destiny, possible solely to a Pharaoh.
  summary: 'The passage describes the Pyramid Texts'' royal solar afterlife: the deceased
    king, as son and representative of Re, is purified after death, turns toward the
    sacred east of the sky, approaches a lake and wonder-filled threshold region,
    and seeks transport by a silent ferryman called Face-behind or Look-behind.'
  language: English
  quote_policy: quoted
