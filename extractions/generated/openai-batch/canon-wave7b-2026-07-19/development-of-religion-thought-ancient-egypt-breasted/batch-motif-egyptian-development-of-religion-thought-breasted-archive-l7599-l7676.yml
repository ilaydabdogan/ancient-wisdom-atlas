canonical_text:
  quote: All men are silent concerning it, (although) the whole land is in great disturbance.
  summary: A distressed speaker addresses his heart, asking it to answer and explain
    the condition of the land. He describes ongoing calamity, widespread evil, social
    silence, rejection of truth, oppression of the poor by the strong, and a burden
    shared across social ranks. The modern commentary identifies the passage as a
    reflection on social corruption and compares its sombre tone with the disillusionment
    attributed to Amenemhet I and a harper at feasts.
  language: English
  quote_policy: quoted
