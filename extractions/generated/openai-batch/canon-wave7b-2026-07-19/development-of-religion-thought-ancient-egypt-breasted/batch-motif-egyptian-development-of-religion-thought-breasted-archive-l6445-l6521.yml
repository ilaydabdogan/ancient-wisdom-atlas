canonical_text:
  quote: ''
  summary: The passage argues that Old Kingdom Egyptian royal funerary texts attach
    moral and legal justification to the dead Pharaoh and even to gods. Re, the Morning
    Star, Geb, and other divine settings are connected with righteousness, judgment,
    ascent to the sky, and the justified king’s later exercise of celestial justice.
    The author emphasizes that these examples are Solar rather than Osirian in context
    and concludes that Re appears chiefly as the righteous god in this surviving Old
    Kingdom material.
  language: English
  quote_policy: summarized
