canonical_text:
  quote: ''
  summary: Breasted describes how Pyramid Text material was Osirianized by inserting
    the name “Osiris” before royal names, especially in the Offering Ritual of Unis,
    and by expanding older Solar utterances with Osirian elements. He notes editorial
    traces such as inconsistent pronouns after an inserted Osirian god-name. He also
    emphasizes tensions created when Solar passages that pair Horus and Set as beneficent
    helpers of the dead are applied to a dead king identified with Osiris, even though
    the Osiris myth presents Set as mutilating Osiris and scattering his limbs.
  language: English
  quote_policy: summarized
