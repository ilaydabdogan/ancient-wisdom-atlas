    aid during the previous disruption, a king restoring cultic gifts to Amon, condemnation
    of Ikhnaton, and hymnic praise of Amon as punisher of transgressors, source of
    light for devotees, shepherd, pilot, creator, sustainer, and a deity linked with
    Re, Atum, and qualities formerly associated with Aton.'
