canonical_text:
  quote: ''
  summary: The passage describes a shift in ancient Egyptian mortuary thought from
    reliance on physical preservation, royal tombs, and Pyramid Texts toward judgment
    in the hereafter and moral worthiness. It presents this as a movement from external
    agencies to inner values, with God’s dominion extending into the heart and individual
    personality emerging. It then describes later Egyptians of the Feudal Age looking
    back on earlier tombs and pyramids as monuments of a long struggle with death,
    ending with an image of deserted pyramid cemeteries, ruins, sand, and a jackal
    suggesting the ineffective protection of old desert mortuary gods.
  language: English
  quote_policy: summarized
