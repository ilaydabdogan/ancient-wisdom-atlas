canonical_text:
  quote: ''
  summary: Breasted discusses Egyptian wisdom literature attributed to ancient viziers
    and framed under earlier kings. The preserved conclusion of an unknown sage’s
    instruction shows a vizier summoning his children, having them hear and read a
    written roll, followed by the death of Huni, the accession of Snefru, and the
    appointment of Kegemne. The passage then introduces the Wisdom of Ptahhotep, where
    the aged vizier petitions King Isesi to let his son stand in his place and be
    instructed according to ancestral tradition.
  language: English
  quote_policy: summarized
