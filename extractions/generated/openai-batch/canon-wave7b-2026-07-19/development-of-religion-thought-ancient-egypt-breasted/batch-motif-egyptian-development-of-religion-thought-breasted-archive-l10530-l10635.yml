  summary: The passage describes mortuary charms and mapped guidance for the dead
    against serpents, crocodiles, fire, execution, and hostile dead; it then connects
    the growth of magical mortuary belief with the Osiris myth, popular Osiris religion,
    and pilgrimage or memorial practices at Abydos.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The dead man's roll contains charms for repulsing Apophis, a serpent afflicting
    the kas, serpents, and crocodiles.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The departed is described as facing fire and needing charms for going forth
    from fire or entering and coming forth from fire behind the sky.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Priests are said to have devised a chart for the dead person's journey, with
    a gate of fire, two routes by land and by water, and a lake of fire between them;
    the Book of the Two Ways and its map were recorded in the coffin.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A chapter prevents the dead from entering the place of execution of the gods,
    and another chapter prevents walking head downward.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Those dead who go head downward are described as malicious enemies in the
    hereafter; Orion, Sothis, and the Morning Star are said to save the deceased from
