  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The newly arrived soul speaks of gaining power over enemies, expelling them
    from tombs, opening mummies, destroying kas, suppressing souls, and relying on
    an edict of the Self-Generator against enemies among the dead, living, sky, and
    earth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that belief in magic as an effective agent for the dead
    was growing and would later dominate mortuary belief in the Book of the Dead.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Osiris myth is said to have made all classes familiar with magical agencies
