  basis: 'The passage explicitly states that the Coffin Texts enable the deceased
    to transform at will and gives examples: Eye of Horus, ekhet-bird, servant of
    Hathor, Nile, Neper, barley, Re, and Osiris-related identities.'
  evidence_refs:
  - ev:1
