comparison_claims:
- id: claim:1
  claim: The passage presents the Coffin Texts as sharing composite Solar-Osirian
    afterlife imagery with the Pyramid Texts, while also noting differences such as
    Re's subterranean functions in the Coffin Texts being unknown in the Pyramid Texts.
  claim_level: same_motif
  target: Pyramid Texts composite Solar-Osirian afterlife pictures
  evidence_refs:
  - ev:1
  - ev:3
  counter_evidence_refs:
  - ev:8
  confidence: high
  limitations: The comparison is internal to Breasted's discussion and does not establish
    historical development beyond what the passage states.
- id: claim:2
  claim: The passage explicitly says the Coffin Texts' tendency to let the deceased
    transform into various beings is carried much further by the Book of the Dead.
  claim_level: same_motif
  target: Book of the Dead transformation chapters
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives only a general comparison and does not quote Book
    of the Dead examples in this excerpt.
- id: claim:3
  claim: The second Solar-Osirian chapter is said to have the deceased enter the Solar
    voyage as in the Pyramid Texts.
  claim_level: same_motif
  target: Pyramid Texts Solar voyage pattern
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: The passage does not reproduce the corresponding Pyramid Texts passage;
    the claim relies on the author's explicit comparison.
- id: claim:4
  claim: The passage rejects Herodotus's interpretation that Egyptian mortuary transformations
    equal transmigration of souls.
  claim_level: same_function
  target: Herodotean transmigration interpretation
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: This is a negative comparison about interpretation rather than a positive
    motif parallel.
