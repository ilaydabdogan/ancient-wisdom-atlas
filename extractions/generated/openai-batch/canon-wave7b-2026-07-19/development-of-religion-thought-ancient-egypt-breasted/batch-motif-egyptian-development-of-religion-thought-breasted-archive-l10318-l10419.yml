canonical_text:
  quote: ''
  summary: 'Breasted describes the Coffin Texts as a mixed mortuary corpus combining
    Solar, Osirian, celestial, and harvest imagery. The passage notes chapters in
    which the deceased becomes or is identified with Re, Osiris, Orion, the West,
    the Nile, barley, Neper, the Eye of Horus, an ekhet-bird, or a servant of Hathor.
    It then summarizes two Solar-Osirian afterlife scenes: the deceased, treated as
    Osiris, is restored and provisioned by Horus with Ptah and Thoth, travels with
    Re through watered and fertile regions, receives a ladder to the sky and Nut''s
    arms, sails in the Lily-lake, and is towed by Re and Atum; in another chapter
    the deceased is crowned, purified, glorified, enters the Solar voyage, receives
    ship equipment from Hathor, and sees the Four Pillars of the Sky and their secrets.'
  language: English
  quote_policy: summarized
