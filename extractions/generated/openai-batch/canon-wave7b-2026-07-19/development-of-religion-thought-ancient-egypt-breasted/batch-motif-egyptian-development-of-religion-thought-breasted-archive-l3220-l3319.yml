  quote: ''
  summary: The passage describes the Pyramid Texts as intended to secure the king's
    felicity in the hereafter while also reflecting ordinary and royal Egyptian life.
    It lists daily-life images, palace scenes, and afterlife scenes in which gods
    receive and serve the king in ways modeled on earthly subjects and chamberlains.
    It closes by emphasizing the difficulty of interpreting the texts because of archaic
    language, obscure constructions, and allusions to lost myths and customs.
  language: English
