canonical_text:
  quote: ''
  summary: 'The passage presents Egyptian wisdom admonitions about sexual temptation,
    inherited wealth, and the instability of fortune and landscape. It then summarizes
    the Tale of the Two Brothers: Anubis and Bata, divine brothers pictured as peasants,
    live in a household disrupted when Anubis''s wife desires Bata. Bata refuses her,
    she falsely reports the affair, Anubis seeks to kill him, and Bata is warned by
    cattle and flees. The author notes a comparison with the Hebrew Joseph in Egypt
    tradition.'
  language: English
  quote_policy: summarized
