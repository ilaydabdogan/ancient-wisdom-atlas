  quote: ''
  summary: The passage describes the administrative rise of Amon's priesthood, Amenhotep
    IV's conflict with that Amonite organization, and his support for a new solar
    faith centered on Aton. It identifies Aton with the physical sun or disk, describes
    the new symbol of a sun disk whose rays end in human hands, notes earlier Egyptian
    sun-god symbols and Pyramid Text imagery of solar rays as arms, and reports that
    the Aton's full name was enclosed in royal cartouches like a Pharaoh's double
    name.
