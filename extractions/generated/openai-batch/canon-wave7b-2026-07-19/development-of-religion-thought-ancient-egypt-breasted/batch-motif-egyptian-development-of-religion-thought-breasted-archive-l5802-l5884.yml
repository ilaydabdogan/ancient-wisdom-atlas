canonical_text:
  quote: ''
  summary: The passage analyzes a Pyramid Text pattern in which actions such as ferrying
    and purification are first performed for four Horuses and then for the dead king.
    It lists an older Teti form of the four-Horus group, emphasizes its solar character,
    and then describes a later Osirianized form in which Osiris replaces Horus of
    the Horizon. It also discusses the dead being preserved from decay by Isis and
    Nephthys and compares the Osirianization of this group with the four mortuary
    genii or four sons of Horus, who figure in ascension and make a ladder.
  language: English
  quote_policy: summarized
