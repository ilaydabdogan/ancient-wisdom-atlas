canonical_text:
  quote: ''
  summary: 'Breasted describes New Year rites for the deceased noble Hepzefi at Siut:
    torches and offerings are placed by his statue and false door; estate obligations
    supply food, beer, bread, and torches; townspeople carry offerings to cemetery
    tombs so the dead may share the feast; and priests and necropolis guards perform
    illumination and glorification ceremonies for the dead.'
  language: English
  quote_policy: summarized
