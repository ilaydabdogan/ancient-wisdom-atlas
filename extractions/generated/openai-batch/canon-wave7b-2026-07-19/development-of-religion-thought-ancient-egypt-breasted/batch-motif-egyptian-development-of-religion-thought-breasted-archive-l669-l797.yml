canonical_text:
  quote: '"Thou art indeed the Nile... gods and men live by the moisture that is in
    thee."'
  summary: The passage collects Pyramid Texts and later Egyptian references identifying
    Osiris with fresh water, the Nile, inundation, life-giving waters, and encircling
    oceanic waters. It describes deceased kings identified with Osiris as connected
    with flood, verdure, purification, divine birth, and revival. It concludes that
    Osiris is associated especially with fertile, life-giving water that brings resurrection,
    and cites a later folk-tale in which a dead Osirian hero revives after drinking
    water containing his heart.
  language: English
  quote_policy: quoted
