canonical_text:
  quote: ''
  summary: 'The passage describes Abydos as a center of Osirian mortuary devotion:
    tomb memorials, offerings, voyages of the dead or their bodies to Abydos, return
    with unspecified sacred items, and a multi-day dramatic re-enactment of the Osiris
    myth outlined from Ikhernofret’s memorial stone. The drama includes Upwawet opening
    the way, Osiris in a sacred barque, conflict with enemies, the god’s death and
    entombment, Horus defeating Osiris’s enemies at Nedyt, and Osiris restored to
    life entering the temple in triumph.'
  language: English
  quote_policy: summarized
