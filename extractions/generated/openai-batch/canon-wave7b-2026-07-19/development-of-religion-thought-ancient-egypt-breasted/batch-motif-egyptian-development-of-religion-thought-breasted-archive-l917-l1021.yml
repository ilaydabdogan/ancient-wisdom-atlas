  summary: The passage summarizes Osiris as a benevolent solarized king, protected
    by Isis and opposed by Set. It presents variant traditions of Osiris's death by
    overthrow or drowning, Isis's search for his body, geographic associations with
    Nedyt, Abydos, Byblos, and the sea, and a version in which Horus commands Isis
    and Nephthys to prevent Osiris from drowning.
