canonical_text:
  quote: ''
  summary: The passage explains the Egyptian royal pyramid as a durable tomb and as
    a solar sacred form. It connects the pyramid and pyramidion with the obelisk,
    the benben or ben at Heliopolis, the Sun-god, the Phoenix, and royal afterlife
    expectations. It concludes with the pyramidion of Amenemhet III, bearing solar
    imagery and an inscription about the king beholding the Lord of the Horizon sailing
    across the sky.
  language: English
