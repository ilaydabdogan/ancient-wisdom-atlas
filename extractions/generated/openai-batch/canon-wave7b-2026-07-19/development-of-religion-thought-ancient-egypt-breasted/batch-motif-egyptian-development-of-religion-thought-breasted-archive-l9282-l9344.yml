canonical_text:
  quote: ''
  summary: Breasted discusses Egyptian social and religious wisdom teaching in dramatic
    tale or dialogue form, compares this form with Job, Akhikar, the parables of Jesus,
    and Plato, and then quotes Ameni of Benihasan’s tomb inscription, where Ameni
    claims not to oppress vulnerable people, to feed his community in famine, and
    not to privilege the great over the small.
  language: English
  quote_policy: summarized
