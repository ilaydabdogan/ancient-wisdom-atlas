canonical_text:
  quote: ''
  summary: 'The passage describes Pyramid Text conceptions of the dead Pharaoh, especially
    King Pepi, in intimate relation with Re: serving him ritually, becoming his companion,
    voyaging with him in the solar barque, being recognized as his son, and ultimately
    being identified with him.'
  language: English
  quote_policy: summarized
