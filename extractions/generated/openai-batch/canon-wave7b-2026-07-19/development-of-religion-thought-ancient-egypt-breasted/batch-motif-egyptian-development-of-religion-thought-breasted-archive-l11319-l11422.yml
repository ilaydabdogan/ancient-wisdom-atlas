canonical_text:
  quote: '"No sin of his has been found."'
  summary: 'The passage describes an Osirian judgment scene centered on Ani: figures
    attend the hall of judgment, Ani''s heart is weighed against a feather of Truth
    or Righteousness, Ani appeals to his heart not to testify against him, Thoth and
    the Ennead pronounce him justified, Horus presents him to Osiris, and Ani is received
    into Osiris''s kingdom. The author then interprets the scene as an expression
    of conscience, moral responsibility beyond death, and later tensions with magical
    means in the afterlife.'
  language: English
  quote_policy: quoted
