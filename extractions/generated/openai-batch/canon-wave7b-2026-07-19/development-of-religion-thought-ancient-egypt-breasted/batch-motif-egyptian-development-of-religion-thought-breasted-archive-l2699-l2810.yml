canonical_text:
  quote: ''
  summary: The passage discusses the pyramid form as a solar mortuary symbol, later
    small cemetery pyramids showing the deceased worshiping the rising and setting
    sun, and the royal pyramid complex as a ritual architecture for the dead king.
    It describes the pyramid temple, false door, causeway, town temple, offerings,
    state resources devoted to preserving the king's body and survival after death,
    and dedication formulae protecting the pyramid and temple from Osiris and his
    cycle while receiving King Pepi and his ka.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Later cemeteries contained small stone pyramids with niches on opposite sides
    showing the deceased kneeling with upraised hands and inscriptions presenting
    hymns to the Sun-god at rising and setting.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage interprets the selection of the pyramid as the king's tomb form
    as evidence for the supremacy of Solar faith at the Pharaohs' court.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The pyramid complex stood on the margin of the desert plateau overlooking
    the Nile valley and included an east-side temple with court, storage chambers,
    rear holy place, and a false door in the pyramid face.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Through the false door, the dead king was imagined as stepping forth to receive
    and enjoy offerings presented in the temple.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A covered masonry causeway led from the valley to the plateau temple, and
    its lower end had a colonnaded monumental portal serving as a town or residence
    temple of the pyramid.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The temples housed the mortuary ritual maintained on behalf of the king and
    were compared in origin to the chapel of a noble's tomb.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Third and Fourth Dynasty Pharaohs spent major resources erecting royal tombs
    intended to receive the body, preserve it after death, and ensure the king's survival
    in the hereafter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At completion, royal priests dedicated the temple and pyramid with formulae
    for protection.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The building was addressed and commanded not to admit Osiris or the divinities
    of his cycle if they came with evil intent, and it was commanded to receive the
    dead king and his ka.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Horus is represented as saying that the pyramid and temple are offered to
    King Pepi and his ka, and that their contents belong to them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The buildings were also protected by doors with boukrania, sealed with two
    evil eyes, and described as inviolable even against Osiris if he came with malicious
    intent.
  category: object
  evidence_refs:
  - ev:8
