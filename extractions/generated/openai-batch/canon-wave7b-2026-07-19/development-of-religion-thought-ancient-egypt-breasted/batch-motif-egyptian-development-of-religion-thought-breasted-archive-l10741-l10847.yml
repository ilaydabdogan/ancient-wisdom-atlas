canonical_text:
  quote: ''
  summary: The passage gives first-person ritual statements from an Abydos Osiris
    festival involving defense of the Neshmet barque, procession, divine barque voyages,
    movement to Peker, a battle at Nedyt, and return to Abydos. Breasted then interprets
    these festivals as popular dramatic celebrations of the Osiris myth that shaped
    mortuary hopes, especially the hope that common people might share Osiris's triumph
    over death. The passage then discusses Egyptian reliance on magic in afterlife
    belief and everyday domestic life, ending with a mother's protective incantation
    and charm ingredients against dark child-harming powers.
  language: English
  quote_policy: summarized
