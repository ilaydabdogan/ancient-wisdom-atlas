  quote: ''
  summary: Breasted interprets Ikhnaton's religious movement as an ecstatic valuation
    of light, love, beauty, and the divine presence; he compares this valuation with
    Ruskin's language about living light. The passage then characterizes the Amarna
    movement as a gospel of the beauty and beneficence of natural order, extending
    into royal family representation and art, before noting that the hymns contain
    little explicit ethical material despite links with solar and Heliopolitan theology.
  language: English
  quote_policy: summarized
