canonical_text:
  quote: ''
  summary: 'The passage summarizes episodes in the Osiris cycle: Isis and Nephthys,
    sometimes in bird form, search for and mourn Osiris after Set has struck him down;
    Osiris is embalmed by the sisters or by Anubis; a sycomore grows around the dead
    god and is treated as a sacred sign of his imperishable life; Isis conceives and
    raises Horus in concealment; Horus survives threats from Set, emerges from Khemmis
    and Buto, and prepares to avenge his father.'
  language: English
  quote_policy: summarized
