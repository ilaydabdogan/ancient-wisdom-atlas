canonical_text:
  quote: '"He brings cooling to the flame. It is said he is the shepherd of all men.
    There is no evil in his heart"'
  summary: A damaged papyrus passage is introduced as a major utterance of a sage.
    The sage envisions restoration through an ideal ruler identified with the past
    reign of Re, describes him as a benevolent shepherd without evil in his heart
    who gathers afflicted herds and smites evil, asks where he is now, and then denounces
    the living Pharaoh for social disorder and violence. Breasted compares the ideal-ruler
    passage to Hebrew Messianism, Davidic righteous kingship, and prophetic rebuke.
  language: English
