  summary: The passage describes Egyptian elite use of portrait statues in temples
    and tombs as possible bodies for the disembodied dead, allowing a semblance of
    bodily presence. It contrasts older ideas of the dead dwelling in the tomb or
    western subterranean realm ruled by mortuary gods with an emerging solar hereafter
    in which the king and nobles may dwell with the Sun-god. A note cautions against
    identifying these statues as ka statues.
