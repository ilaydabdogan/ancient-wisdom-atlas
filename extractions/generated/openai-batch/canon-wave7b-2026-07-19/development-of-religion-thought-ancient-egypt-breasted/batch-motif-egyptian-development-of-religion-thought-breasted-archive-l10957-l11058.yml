canonical_text:
  quote: ''
  summary: 'The passage describes Egyptian funerary texts and practices as presented
    by Breasted: afterlife servant figures and statuettes equipped with charms to
    perform labor for the deceased; multiplied charms against dangers and loss of
    bodily or personal powers; chapters enabling transformations; guide-book compositions
    mapping paths, gates, and the sun''s nocturnal underworld journey through twelve
    caverns; and the Book of the Dead''s inclusion of moral judgment, conscience,
    heart, and character.'
  language: English
  quote_policy: summarized
