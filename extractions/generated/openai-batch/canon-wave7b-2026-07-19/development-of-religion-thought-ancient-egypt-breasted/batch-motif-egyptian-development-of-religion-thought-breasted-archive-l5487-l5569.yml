canonical_text:
  quote: ''
  summary: 'The passage explains the Osirianization of the royal hereafter in the
    Pyramid Texts: the dead king receives benefits once given to Osiris by Horus,
    including vindication, bodily restoration, healing, divine service, crowns, and
    sovereignty. It also describes the incorporation of Osirian material into Heliopolitan
    royal mortuary texts and its integration with solar and celestial theology involving
    Re, the horizon, and Nut''s sky realm.'
  language: English
  quote_policy: summarized
