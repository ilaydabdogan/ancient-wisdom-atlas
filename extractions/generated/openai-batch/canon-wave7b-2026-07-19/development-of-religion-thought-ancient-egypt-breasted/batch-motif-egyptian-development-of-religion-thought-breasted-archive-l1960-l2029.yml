canonical_text:
  quote: ''
  summary: The passage describes the Egyptian ka as a superior protecting genius associated
    especially with the deceased in the hereafter. The deceased goes to the ka and
    to the sky; the ka protects, intercedes with Re, provides food, shares the table,
    must recognize the deceased, and must itself be justified. Later mortuary priests
    and tomb prayers address provisions and blessings for the ka. The passage also
    notes that the ka's relation to the living is less clear, though its protection
    begins at birth and appears in mortuary contexts such as temples and pyramids.
  language: English
  quote_policy: summarized
