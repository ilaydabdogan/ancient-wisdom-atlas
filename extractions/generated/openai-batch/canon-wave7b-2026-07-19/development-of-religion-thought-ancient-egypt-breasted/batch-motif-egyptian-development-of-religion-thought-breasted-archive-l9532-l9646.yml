canonical_text:
  quote: ''
  summary: The passage discusses Egyptian mortuary justification. The deceased claims
    purification, righteousness, and removal of sin; Horus, Thoth, the Sun-god/Atum,
    Mat, and Osiris are described in relation to justification and judgment. Osiris
    is presented as judge through councils or courts, including a Great Council and
    seven councils. The passage then describes the widening of Osirian identification
    from the Pharaoh to every deceased person, including the epithet “justified,”
    the prefixing of Osiris to the name, Osiris-like mummiform treatment, and royal
    insignia placed with the dead. A note also mentions formulas addressed to parts
    of the sacred Osiris barque at Abydos.
  language: English
  quote_policy: summarized
