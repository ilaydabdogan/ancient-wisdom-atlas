canonical_text:
  quote: ''
  summary: The passage gives several Old Kingdom examples in which Egyptian kings
    provided labor, funerary objects, mortuary personnel, body recovery, or burial
    arrangements for favored nobles and deceased officials. It includes tomb furnishing
    for Debhen, transport of a sarcophagus from royal quarries for another noble,
    royal assistance connected with Sebni and his father's body, recovery of a massacred
    noble's body, and the king's response to Weshptah's death, including prayer to
    Re, an ebony coffin, anointing, and tomb endowment. It ends with a son's request
    to Pepi II for burial goods for his dead father Zau.
  language: English
  quote_policy: summarized
