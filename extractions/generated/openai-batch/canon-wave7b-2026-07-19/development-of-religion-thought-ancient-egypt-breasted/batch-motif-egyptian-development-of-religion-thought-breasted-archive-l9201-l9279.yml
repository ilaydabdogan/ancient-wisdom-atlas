canonical_text:
  quote: '"It is an abomination of the god," says the king, "to show partiality."'
  summary: The passage discusses an Egyptian royal charge to the vizier in which impartial
    justice is grounded in divine authority and in the tradition of the Sun-god/Re.
    It compares this ideal with later Hebrew prophetic claims about Jehovah's moral
    sovereignty, with the class-conditioned penalties of the Laws of Hammurabi, and
    with Plato's idea of the state as an embodiment of justice. It also explains Egyptian
    social thought as expressed through concrete literary figures such as Ipuwer,
    the Misanthrope, the Eloquent Peasant, and Ptahhotep.
  language: English
  quote_policy: quoted
