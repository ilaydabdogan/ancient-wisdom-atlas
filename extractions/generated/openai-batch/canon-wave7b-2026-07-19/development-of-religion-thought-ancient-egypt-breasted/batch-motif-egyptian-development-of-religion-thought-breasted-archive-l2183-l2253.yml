canonical_text:
  quote: ''
  summary: Breasted describes Egyptian mortuary rites as restoring a dead person's
    senses, speech, heart, soul-status, preparedness, and power. The priest opens
    King Teti's mouth, nose, and ears; the heart is treated as the seat of consciousness
    and may be restored by the Sky-goddess. The dead person does not automatically
    become a ba or soul by dying, but is aided through ritual devices. Horus's recovered
    eye transforms dead Osiris into a soul, and offerings to the dead, including imperishable
    bread and beer, are described as having the same transformative power, making
    the deceased a soul, an equipped/prepared spirit, and a mighty one able to control
    the body.
  language: English
  quote_policy: summarized
