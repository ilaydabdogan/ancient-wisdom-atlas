canonical_text:
  quote: ''
  summary: Breasted summarizes an Egyptian dialogue in which an unnamed, afflicted
    man, abandoned and wronged by others, contemplates suicide. His personified soul
    refuses to accompany him into death, argues against burial and tomb-preparations,
    depicts the tomb as terrifying and futile, contrasts elite pyramids with abandoned
    corpses on the dike, and urges him to follow the glad day and forget care.
  language: English
  quote_policy: summarized
