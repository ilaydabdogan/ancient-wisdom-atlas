canonical_text:
  quote: ''
  summary: The passage argues that Egypt's imperial expansion under Thutmose III enlarged
    Egyptian political and religious horizons, leading solar theology from a Nile-valley
    frame toward an imperial or universal scope. It contrasts this with older commercial
    contacts, which the author says had not displaced inherited limits on the domain
    of Egyptian gods.
  language: English
  quote_policy: summarized
