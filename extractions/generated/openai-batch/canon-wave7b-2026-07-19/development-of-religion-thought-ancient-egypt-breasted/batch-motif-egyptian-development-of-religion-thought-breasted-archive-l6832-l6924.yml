  quote: ''
  summary: A poem and Breasted's commentary describe ruined ancestral tombs, the impossibility
    of receiving news from the dead, and counsel to enjoy life with adornment and
    celebration. Breasted relates these sentiments to Feudal Age reflection on Old
    Kingdom pyramid cemeteries, especially the remembered sages Imhotep and Hardedef,
    and notes a later echo in lines attributed to Omar Khayyam.
