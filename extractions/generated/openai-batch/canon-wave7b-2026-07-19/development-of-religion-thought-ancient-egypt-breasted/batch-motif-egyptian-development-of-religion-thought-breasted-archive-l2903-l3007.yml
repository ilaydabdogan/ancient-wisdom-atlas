canonical_text:
  quote: ''
  summary: 'The passage describes Pyramid Text offering formulas and royal mortuary
    ritual: the priest, sometimes acting as Horus, offers ointment and other gifts
    identified with the Horus-eye, addresses the dead king before the false door of
    the pyramid temple, calls him to rise and receive food, recites charms against
    hunger, laments the departed Pharaoh, and notes the priestly/endowment system
    that maintained such offerings.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During an ointment offering, the priest assumes the office of Horus and speaks
    a formula in which Horus comes filled with ointment and embraces his father Osiris.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ointment is said to come from the Horus-eye and to join the king's bones,
    members, and flesh, remove evil sweat, and give him a sweet odor like Re at sunrise.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A brief offering formula presents the Horus-eye as something wrested from
    Set and rescued so that the king's mouth may be filled with it; the accompanying
    offering named is wine in a white jar.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The offering ritual consists of many short utterances with designated offerings
    or ritual directions, through which the priest lays creature comforts before the
    dead king.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The priest enters the chamber behind the temple court and stands before the
    false door, through which the king's spirit might re-enter the temple from the
    sepulchre beneath the pyramid.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Standing before the false door, the priest addresses the dead king as present,
    presents gifts, and calls on him to rise from sleep and behold the food and gifts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The priest summarizes the gifts as all offerings, all oblations, the king's
    desire, and what is good for him with the god forever; charms are also recited
    to banish hunger from the king's vitals.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: In a lament recited by the priest as Horus, Horus says he has wept and mourned
