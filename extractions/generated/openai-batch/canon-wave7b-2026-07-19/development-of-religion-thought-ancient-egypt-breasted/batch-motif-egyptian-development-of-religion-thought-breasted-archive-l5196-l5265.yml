canonical_text:
  quote: ''
  summary: 'The passage presents Pyramid Text material in which deceased kings enter
    a solar celestial afterlife: they receive a seat in Re''s barque, are rowed behind
    the horizon, pass through earth and sky thresholds, are purified in lakes, welcomed
    by gods, guided by Nut to the sky, and associated with Orion and the stars. Breasted
    then interprets these materials as evidence for an Old Kingdom Solar hereafter
    distinct from, and at times opposed to, Osirian beliefs, though later interpenetrated
    with them.'
  language: English
  quote_policy: summarized
