canonical_text:
  quote: ''
  summary: The passage argues that Middle Kingdom or Feudal Age ideals of righteousness
    and social justice spread from courtly instruction into the ruling class. It contrasts
    earlier pessimism about ruined cemeteries, the hereafter, and earthly life with
    a counter-current of optimistic social thought represented by Ipuwer and the Tale
    of the Eloquent Peasant. It identifies Re as the ideal king and moral source behind
    this social teaching, links Pharaoh's earthly kingship to renewal of Re's reign,
    and describes Osiris' later judgeship as secondary to, and shaped by, an earlier
    Solar tribunal tradition at Heliopolis.
  language: English
  quote_policy: summarized
