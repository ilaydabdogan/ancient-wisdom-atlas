canonical_text:
  quote: O living Aton, born in the sky every day.
  summary: The passage quotes and discusses hymnic material in which Aton is a living
    solar god, daily born in the sky, begetter of Ikhnaton, source of breath, rays,
    growth, animal movement, and bird flight. Breasted interprets the material as
    expressing universalism, a projected world religion, divine eternity, Aton's self-generation
    in solitude, and Aton's ongoing life-giving power, including life called forth
    within an egg.
  language: English
  quote_policy: quoted
