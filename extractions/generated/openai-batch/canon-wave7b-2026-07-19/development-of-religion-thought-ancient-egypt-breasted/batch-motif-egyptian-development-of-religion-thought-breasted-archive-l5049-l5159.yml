canonical_text:
  quote: ''
  summary: 'Breasted describes Pyramid Text passages in which the deceased king is
    protected from serpents, identified with Re, shielded by Nut, and imagined in
    multiple celestial afterlife scenes: enthroned, seeking food, sailing in the solar
    barque, joining imperishable stars, ascending by a stairway, receiving divine
    provisions, purification, water, milk, and renewed life in the sky.'
  language: English
  quote_policy: summarized
