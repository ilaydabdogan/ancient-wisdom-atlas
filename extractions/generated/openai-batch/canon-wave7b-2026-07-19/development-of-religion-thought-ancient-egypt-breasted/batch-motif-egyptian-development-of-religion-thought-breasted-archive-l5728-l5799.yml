canonical_text:
  quote: ''
  summary: The passage argues that older Solar Pyramid Text ascent material was gradually
    Osirianized. It highlights Set appearing as purifier, friendly companion, or helper
    of the dead king despite his opposition to Osiris, and traces versions of a ladder-to-the-sky
    episode from Unis through Teti to Pepi I, where Osiris and the Osirian goddesses
    take over roles formerly associated with the Pharaoh, Atum, or older gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Osirianized ritual formula inserts the phrase identifying Pepi as “King
    Osiris” before a purification formula, creating the implication that Osiris is
    purified by Set.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Set appears in old Solar Utterances on friendly terms with the dead king and
    is said to fraternize with him on the stairway of the sky.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage identifies the ladder leading to the sky as originally belonging
    to the Solar faith and says that one version places the ladder episode in Set’s
    charge.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Four versions of the ladder episode are described as variants of the same
    ancient original over a period of at least about eighty-five years.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Unis version, the gods acclaim Unis as he ascends to the sky, and gods
    in the sky and on earth make supports for him on their arms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Teti version, the ladder is more developed, the original climber is
    Atum, and Isis and Nephthys are introduced.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Pepi I version, the opening acclamation is assigned to Isis and Nephthys,
    and the climber has become Osiris.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: An old Solar doctrine is described in which Horus and Set assist the dead
    at the ascent of the ladder that Re and Horus set up.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'The passage notes an incongruity: when the ascending king becomes Osiris,
    Set, described as Osiris’s mortal enemy and slayer, still assists him toward a
    celestial abode.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage introduces Utterances concerning the services of the four Eastern
