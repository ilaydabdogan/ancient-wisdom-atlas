canonical_text:
  quote: ''
  summary: The passage argues that early Egyptian afterlife moral judgment was limited
    and coexisted with sensual provisions in the Pyramid Texts. It treats the statement
    that King Pepi is justified as a possible sign of developing ethical consciousness,
    contrasts earlier variants lacking the statement, and compares monumental pyramids
    with the later insertion of Pyramid Texts as different supports for the departed
    Pharaoh.
