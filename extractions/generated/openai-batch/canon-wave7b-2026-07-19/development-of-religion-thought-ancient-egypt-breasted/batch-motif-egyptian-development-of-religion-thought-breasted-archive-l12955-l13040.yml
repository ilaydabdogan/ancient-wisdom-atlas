canonical_text:
  quote: ''
  summary: The passage presents and comments on hymnic material to Re, Amon, Atum-Harakhte,
    and Osiris. The hymns praise a solar creator who commands gods into being, makes
    people, provides sustenance for humans and animals, hears captives, protects the
    timid from the haughty, gives breath and life to small creatures, and is addressed
    with universal praise. Breasted comments that the language preserves echoes of
    Aton faith, monotheistic phrasing, humane solicitude, and universalism after Ikhnaton.
  language: English
  quote_policy: summarized
