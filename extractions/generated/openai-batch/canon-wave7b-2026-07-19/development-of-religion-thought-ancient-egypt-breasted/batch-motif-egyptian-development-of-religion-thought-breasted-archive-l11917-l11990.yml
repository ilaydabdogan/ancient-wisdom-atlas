canonical_text:
  quote: ''
  summary: The passage describes Aton theology as deifying the physical force of the
    sun, expressed through heat, light, and rays. It presents the new faith as inspired
    by Heliopolis while rejecting traditional solar-theological elements such as sun-barques
    and the underworld voyage. It narrates Amenhotep IV/Ikhnaton's construction of
    Aton temples, conflict with Amon's priesthood, renaming of himself, erasure of
    divine names, and foundation of Akhetaton and other regional centers for solar
    monotheism.
  language: English
  quote_policy: summarized
