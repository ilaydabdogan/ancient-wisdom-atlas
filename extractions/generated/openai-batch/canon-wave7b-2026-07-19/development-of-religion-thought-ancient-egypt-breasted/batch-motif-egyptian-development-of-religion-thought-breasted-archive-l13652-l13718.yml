canonical_text:
  quote: The past was supreme.
  summary: 'The passage describes shifts in Egyptian divine prominence, then explains
    how the post-700 B.C. restoration turned toward antiquity: old mortuary texts
    were revived, the Book of the Dead received its final redaction, tomb relief scenes
    were copied from Old Kingdom models, ancient sacred writings were collected, and
    the retrospective impulse is compared with Hebrew and Babylonian examples.'
  language: English
  quote_policy: quoted
