  summary: 'The passage describes Pyramid Text material and Breasted''s explanation
    of early Egyptian celestial-afterlife beliefs: King Unis devours gods to absorb
    their powers and knowledge; the dead king''s food offerings are conveyed from
    tomb to sky by divine and cosmic agents; hunger and unclean consumption are feared;
