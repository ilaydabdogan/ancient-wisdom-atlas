canonical_text:
  quote: ''
  summary: The passage summarizes Osiris as a risen and victorious figure who receives
    dominion, descends to the Nether World, and is proclaimed king there. It describes
    him as ruler and friend of the dead, links Isis and Horus to ideals of wifehood,
    motherhood, and filial devotion, traces the spread and localization of Osiris
    worship, and notes a Heb-Sed royal rite in which the king impersonated Osiris
    and a ceremony symbolized Osiris's resurrection.
