  quote: ''
  summary: The passage contrasts Osiris and Re in Egyptian conceptions of the hereafter.
    Osiris is described as largely passive and rarely active on behalf of the dead;
    the dead identified with Osiris receive the good offices of Horus, who appears
    as their son. Re is described as an active sovereign who directly intervenes for
    the dead and whose sovereignty extends from living affairs toward a realm of moral
    values.
