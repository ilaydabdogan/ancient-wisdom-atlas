canonical_text:
  quote: ''
  summary: The passage quotes and discusses Pyramid Text material in which deceased
    kings Mernere and Pepi are assimilated to Re and Osiris. Mernere is described
    as born daily like Re and then as Osiris Mernere received by divine assemblies
    after wrong by Set. Pepi ascends through the sky with Nut and Re, is placed on
    Osiris's throne, is avenged by Horus, receives offerings through his son, and
    is promised enduring life and name. The author comments that solar and Osirian
    hereafter doctrines coexist without full harmonization.
  language: English
  quote_policy: summarized
