canonical_text:
  quote: ''
  summary: 'Breasted surveys early Egyptian evidence for moral ideals: impartial justice
    by officials, royal self-presentation as righteous, filial tomb-building, tomb
    inscriptions asserting moral worthiness for hereafter benefits, honest payment
    for mortuary equipment, charitable and non-oppressive conduct by a nomarch, and
    declarations of innocence from evil or violence by later Old Kingdom figures.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At a Feudal Age vizier's installation, the official was referred to an ancient
    vizier who had become proverbial and who decided a case involving his relatives
    against his own kin to avoid the accusation of partial judgment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: King Userkaf used the Horus-name rendered as "Doer-of-Righteousness" or "Doer-of-Justice."
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that Pyramid Age sons repeatedly erected massive tombs
    and arranged splendid interments for departed fathers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One son states that he arranged to be buried in the same tomb as his father
    Zau so that he might see him every day and be with him in the same place, not
    because he lacked means to make another tomb.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that claims of moral worthiness are especially made in
    the tomb and are logically aimed at securing benefits in the hereafter.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A tomb statue inscription states that the deceased had statues made by a sculptor
    and that the sculptor was satisfied with the pay given.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: A nomarch says he gave bread to the hungry, clothed the naked, stocked shores
    and lowlands with cattle, and fed wolves and birds with flesh of small cattle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The same nomarch says he never oppressed a property-owner so that the person
    complained to the god of his city, and says that he spoke what was good.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The nomarch says no one feared a stronger person so as to complain to the
    god, and he calls himself a benefactor to his domain.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The nomarch says he spoke no lie and was beloved of his father, praised by
    his mother, excellent in character toward his brother, and amiable to his sister.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A chief physician of King Sahure says he never did anything evil toward any
    person, and a priest later says he never did violence toward any person.
  category: speech
  evidence_refs:
  - ev:6
