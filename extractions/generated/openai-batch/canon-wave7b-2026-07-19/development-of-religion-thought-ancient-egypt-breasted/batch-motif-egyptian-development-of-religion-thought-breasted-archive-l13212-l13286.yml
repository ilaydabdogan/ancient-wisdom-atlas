  summary: The passage presents hymnic and prayer material in which Amon, Amon-Re,
    Re-Harakhte, and Atum are addressed as deities who hear prayers, protect the poor
    and distressed, judge without bribery, punish sin, and receive penitential supplication.
    It highlights a poor litigant vindicated by Amon, divine punishment of sinners
    and false oath-takers, and an inward devotional posture contrasted with the Book
    of the Dead's claim of innocence.
