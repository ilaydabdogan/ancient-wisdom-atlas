  quote: ''
  summary: Breasted introduces the Osirianization of the hereafter, describing the
    spread of Osirian faith and its competition with solar faith. He states that the
    Osiris myth does not suggest a celestial hereafter and cites Pyramid Text survivals
    in which Osiris and his kin are restrained from entering a solar tomb, the dead
    king appears as a star in the sky far from Osiris, and the Sun-god frees king
    Teti from Kherti.
