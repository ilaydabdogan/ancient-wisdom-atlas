  summary: The passage describes late Egyptian religion as increasingly conservative
    and externally ritualized, then discusses the rise of Osirian religion under Greek
    rule, the relative eclipse of the Sun-god, the transmission of Osiris-Apis or
    Serapis and Isis into the Mediterranean world, and the Hellenized and syncretic
    character of Egyptian religion as received by Greeks and Romans.
