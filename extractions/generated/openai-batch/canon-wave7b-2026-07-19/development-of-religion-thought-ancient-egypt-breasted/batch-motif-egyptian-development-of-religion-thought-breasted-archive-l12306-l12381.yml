  quote: '"Thou art the mother and the father of all that thou hast made."'
  summary: Breasted introduces a fragmentary Amarna Aton hymn tradition and translates
    a shorter hymn in which the king is represented as reciting to Aton. The hymn
    praises the living Aton as self-fashioned creator, maker of every land and all
    life, whose rays bring sight and life. Aton's setting brings deathlike sleep until
    the morning rising, when worshippers lift their arms, lands rejoice, offerings
    are made in the Benben-house temple, and Aton's royal son performs ceremonies.
  language: English
