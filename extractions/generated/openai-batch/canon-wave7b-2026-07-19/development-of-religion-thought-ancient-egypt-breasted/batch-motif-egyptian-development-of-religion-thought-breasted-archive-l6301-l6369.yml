canonical_text:
  quote: ''
  summary: The passage discusses tomb inscriptions in which deceased persons address
    the living, assert moral conduct, request mortuary offerings, and, in Harkhuf's
    case, promise intercession in the Nether World while threatening tomb violators
    with judgment by the unnamed “Great God.” The author interprets these inscriptions
    as early evidence for moral responsibility beyond the tomb and notes uncertainty
    over whether the judging deity belongs to the theology of Re or Osiris.
  language: English
