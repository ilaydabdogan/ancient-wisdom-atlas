  summary: The passage describes the rise of widespread personal piety at Thebes,
    connected by the author with earlier Aton devotion and doctrines of social justice.
    It cites a Theban necropolis scribe's prayer to Amon as a god who hears, saves,
    gives breath, brings the Nile, and sustains humans and small creatures. It then
    introduces a painter's votive stela recounting Amon's mercy in saving the painter's
    son from sickness and praising Amon as one who hears petitions and aids the afflicted
    poor.
