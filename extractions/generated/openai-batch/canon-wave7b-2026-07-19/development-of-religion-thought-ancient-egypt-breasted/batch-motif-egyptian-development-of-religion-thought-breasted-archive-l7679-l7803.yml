canonical_text:
  quote: ''
  summary: The passage presents royal advice urging a ruler to distrust subordinates,
    kin, friends, and intimates, followed by a note that an attempted assassination
    explains the old king’s bitterness. It then introduces Ipuwer as a wise man or
    moral prophet who, before the king and possibly the court, gives a long arraignment
    of social disorder and counsel for regeneration. The summarized indictment describes
    suspended government, legal records and courts exposed or violated, poor men entering
    law-courts, officials and scribes dispossessed or slain, and a man striking his
    own brother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A royal speaker advises the hearer to become king and ruler, increase good,
    harden himself against subordinates, trust no brother, friend, or intimate, and
    guard his own heart when sleeping.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same speaker says he gave to the beggar, nourished the orphan, and admitted
    both insignificant and important persons, but that a food-recipient made insurrection
    and a person to whom he gave his hand aroused fear.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the royal speech is followed by a story of an attempt
    on the speaker’s life, which partly explains his disillusionment.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Breasted contrasts this pessimism with other men who recognized social corruption
    but imagined better days, social regeneration, and a possible golden age.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ipuwer is described as a wise man who speaks in the presence of the king and
    possibly the assembled court, delivering a long arraignment of the times followed
    by counsel and admonition; the king gives a brief rejoinder and the sage replies
    briefly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The oration attributed to Ipuwer is described as mostly indictment, without
    logical arrangement of content, but with an effort at strophic form in which each
    strophe begins with the same phrase.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'In Ipuwer’s indictment, government is said to be practically suspended: laws
    of the judgment-hall are cast out and walked on, poor men break them open in the
    streets, and poor men go in and out of the Great Houses or law-courts.'
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The indictment says that judgment-hall writings and departmental writings
    are carried away or rejected, offices are exposed or opened, serfs become lords,
    officials are slain, and the grain of Egypt belongs to any comer.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The internal violence of the land is summarized with the statement that a
    man smites his brother of the same mother.
  category: action
  evidence_refs:
  - ev:6
