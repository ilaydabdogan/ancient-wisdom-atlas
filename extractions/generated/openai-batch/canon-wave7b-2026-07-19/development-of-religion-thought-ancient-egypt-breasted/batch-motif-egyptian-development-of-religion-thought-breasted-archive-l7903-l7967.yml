canonical_text:
  quote: ''
  summary: 'Breasted quotes and summarizes the tractate of Ipuwer: a sage describes
    a ruined society marked by status reversal, scarcity, depopulation, failed conception,
    moral disorder, lamentation, desire for death, animal grief, and a wish for the
    end of humankind and birth. Breasted then frames the text as related to other
    Feudal Age social pamphlets and notes that Ipuwer turns from lament to exhortations
    to destroy the king’s enemies and resume sacred observances for the gods.'
  language: English
  quote_policy: summarized
