- id: obs:3
  text: The passage warns a man entering a house as lord, brother, or friend to beware
    of approaching the women there.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage tells the addressee to avoid evil and avarice, and says avarice
    corrupts kin, divides wife and man, and leaves the avaricious houseless.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: A successful man is told to establish his house, love his wife, fill and clothe
    her body, anoint her, and gladden her heart.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The addressee is told to satisfy those who enter his office, not repeat hearsay,
    be silent in the lord's council, and establish respect through wisdom and quiet
    speech.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: One commissioned to content the multitude is told not to be partial.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A man who becomes great after being poor is told not to be proud-hearted because
    his wealth came as a gift of the god.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The addressee is told to bend his back to his superior, and disobedience to
    a superior is called evil.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The maxims mention not corrupting children, testing a friend's character privately,
    keeping a bright face, recognizing that distributed loaves do not return, and
    knowing merchants when fortunes are evil.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The final maxims say that if the addressee hearkens, his plans will progress,
    the memory of the sayings will circulate, the wise man is satisfied by knowledge,
    and one should do right without lying.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: A son who hearkens to his father is praised; the passage says the god loves
    the hearkener and hates the one who does not hearken.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: If a son receives what his father says, his plans will not miscarry, while
    the wise man rises early and the fool is scourged.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The fool who does not hearken is said to accomplish nothing, regard wisdom
    as ignorance, live like death, and be avoided by men.
  category: attribute
  evidence_refs:
  - ev:12
