- id: obs:1
  text: The addressee is told to report his procedure without reservation and present
    his plan in the council of his lord.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A leader or administrator is told to hear quietly the speech of a petitioner
    who is suffering wrong.
  category: action
  evidence_refs:
