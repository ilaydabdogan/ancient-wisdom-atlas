canonical_text:
  quote: ''
  summary: The passage gives numbered wisdom maxims advising honest procedure before
    a lord, kind hearing of petitioners, restraint from sexual misconduct and avarice,
    care for wife and household, avoidance of hearsay, quiet and wise speech in council,
    impartiality, humility before wealth and superiors, prudent conduct with children,
    friends, merchants, and wives, and the value of hearkening to instruction. It
    contrasts the hearkening son and wise man with the fool who rejects wisdom, and
    states that the god loves the hearkener and hates the one who does not hearken.
  language: English
  quote_policy: summarized
