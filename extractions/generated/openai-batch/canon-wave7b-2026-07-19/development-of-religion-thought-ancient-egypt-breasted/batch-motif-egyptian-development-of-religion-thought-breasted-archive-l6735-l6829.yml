canonical_text:
  quote: "“Those who built their (tomb)-temples, / Their place is no more.”"
  summary: Breasted describes how Old Kingdom pyramid ruins impressed later Feudal
    Age Egyptians and encouraged skepticism about material attempts to conquer immortality.
    He introduces a mourning song, preserved in fragmentary papyrus and tomb versions,
    associated with King Intef’s tomb-chapel and a harp singer. The song reflects
    on bodies diminishing, ancestors and gods resting in pyramids, tomb-builders whose
    places have vanished, and the remembered words of Imhotep and Hardedef.
  language: English
  quote_policy: quoted
