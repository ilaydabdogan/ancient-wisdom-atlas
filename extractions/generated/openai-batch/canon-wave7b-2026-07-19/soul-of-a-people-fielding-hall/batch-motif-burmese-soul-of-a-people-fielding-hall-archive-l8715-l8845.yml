canonical_text:
  quote: ''
  summary: The passage describes a strong Burmese reluctance to kill animals, birds,
    insects, and most reptiles; condemns hunting and shooting; gives practical examples
    such as sparrow-cotes and removing insects rather than killing them; and then
    distinguishes the feared Russell's viper, which Burmese people in the district
    kill in self-defense, from the hamadryad, which remains less readily killed despite
    its danger.
  language: English
  quote_policy: summarized
