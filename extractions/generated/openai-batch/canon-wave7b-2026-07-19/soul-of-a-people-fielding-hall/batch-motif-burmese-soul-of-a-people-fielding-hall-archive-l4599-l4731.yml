canonical_text:
  quote: The Buddha stands alone.
  summary: The passage describes Burmese Buddhist monastic alms rounds, lay giving,
    redistribution of alms, monastic discipline, monastery settings and architecture,
    carved non-sacred story motifs, bare interiors, standardized Buddha images with
    umbrella and lotus, the exclusive representational focus on Gaudama Buddha, and
    adjacent pagodas described as tombs of the Buddha.
  language: English
  quote_policy: quoted
