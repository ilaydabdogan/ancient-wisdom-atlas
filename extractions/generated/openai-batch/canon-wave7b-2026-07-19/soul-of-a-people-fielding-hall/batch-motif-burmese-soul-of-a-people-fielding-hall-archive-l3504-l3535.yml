canonical_text:
  quote: ''
  summary: An accused young servant is sent before a magistrate after a theft complaint
    cannot be withdrawn under English law. The servant pleads guilty, and his master
    asks for leniency, saying the boy was honest and yielded to sudden temptation.
    The magistrate refuses leniency, says such thefts by servants are becoming common,
    and sentences the boy to six months' rigorous imprisonment as a warning to others.
  language: English
