canonical_text:
  quote: ''
  summary: 'The passage describes Burmese women as socially and legally free, then
    turns to childhood and gendered upbringing: young children play freely, boys go
    to monastery schools, girls generally lack schools in villages and instead learn
    household and productive work such as weaving, herding, drawing water, collecting
    firewood, husking rice, and making cheroots. The village well is described as
    a meeting-place for girls, where news and flirtations are discussed. The passage
    closes by contrasting practical work with the absence of accomplishments such
    as music, painting, and formalized housekeeping.'
  language: English
  quote_policy: summarized
