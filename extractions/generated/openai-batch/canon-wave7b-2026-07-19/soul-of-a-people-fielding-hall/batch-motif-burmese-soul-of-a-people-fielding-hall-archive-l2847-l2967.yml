canonical_text:
  quote: ''
  summary: A camp conversation about protective charms is interrupted by a hostile
    voice calling across the water at night, taunting the governor's son as a traitor.
    The narrator then reflects that Burmese people may show physical courage but,
    in his account, Buddhism does not praise aggressive courage, obedience, discipline,
    or war. He argues that Burmese fighters know war violates Buddhist law, that Buddhism
    offers them no religious reward for combat, and that although Burmese people have
    fought wars, they have not fought in the name of the Buddha or his teaching of
    peace, love, charity, and compassion.
  language: English
  quote_policy: summarized
