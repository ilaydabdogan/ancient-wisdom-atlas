canonical_text:
  quote: ''
  summary: The passage describes Burmese social openness, relative material equality,
    lack of interest in accumulating wealth, and the redirection of surplus money
    into domestic gifts, village entertainment, charity, pagodas, monastery schools,
    wells, bridges, rest-houses, and water for travellers. It also describes a landscape
    filled with pagodas and monasteries.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Burman is described as disliking exclusiveness, secrecy, and mystery,
    and as wanting life to be open and all men to be brothers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people are described as being on the same level, with richer and poorer
    persons but no very rich and none too poor to get plenty to eat and drink.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says that people eat much the same food, dress much alike, and
    share free entertainments.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Burman is described as not caring to be rich and as spending money rather
    than accumulating it beyond daily needs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After satisfying personal wants, buying silk, giving his wife a gold bangle,
    and entertaining the village, the Burman is described as spending the rest on
    charity.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Charitable action includes building a pagoda in honour of the great teacher,
    where people may meditate on the laws of existence.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Charitable action includes building a monastery school where village lads
    are taught and villagers may later retire to learn wisdom.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Charitable action includes digging a well, building a bridge, or making a
    rest-house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A small charitable gift may take the form of a tiny house holding jars of
    water for travellers, kept full and accompanied by a coconut-shell cup.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The country is described as full of pagodas, visible on peaks and ridges along
    the river and clustered near villages and towns.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says every village has at least one monastery, many have several,
    and more would be built if there were monks to live in them.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Rest-houses are described as existing everywhere, including in dense forests
    by the mountain-side.
  category: setting
  evidence_refs:
  - ev:7
