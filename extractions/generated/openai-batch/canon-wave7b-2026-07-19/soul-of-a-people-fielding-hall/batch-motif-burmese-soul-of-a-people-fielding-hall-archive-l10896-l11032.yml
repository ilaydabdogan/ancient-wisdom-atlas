canonical_text:
  quote: ''
  summary: The passage frames a Burmese popular belief in the survival and rebirth
    of the personal 'I,' including memories of former lives, then gives a village
    story of a monk who planted teak-trees, promised to return in another life to
    build a better monastery, died, and was later identified by a young monk who arrived
    with apparent knowledge of the village and a dream-memory of the promise.
  language: English
  quote_policy: summarized
