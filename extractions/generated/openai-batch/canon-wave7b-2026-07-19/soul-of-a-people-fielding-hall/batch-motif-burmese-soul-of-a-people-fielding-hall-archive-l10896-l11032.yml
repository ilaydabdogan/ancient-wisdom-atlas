  text: The officer remarks that the monastery is unusually large and well made of
    teak for a small secluded village, and he is told a story explaining it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: An earlier monk, dissatisfied with a bamboo and grass monastery and limited
