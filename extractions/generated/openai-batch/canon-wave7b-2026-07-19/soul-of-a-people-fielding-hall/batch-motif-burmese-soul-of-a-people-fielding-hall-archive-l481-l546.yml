canonical_text:
  quote: He looks to acts as proofs of beliefs, to lives as the ultimate effects of
    thoughts.
  summary: The passage argues that an outsider cannot judge a religion by accepting
    its own doctrinal claims or sacred books alone. Instead, the outsider should infer
    real belief from lived conduct. It distinguishes professed creed, ritual forms,
    and sacred texts from the beliefs that actually guide action, and notes that newer
    creeds may overlay older faiths and more diffuse fears. Examples include knowledge
    that fire burns and ritual forms such as dipping in water or shaving the head.
  language: English
  quote_policy: quoted
