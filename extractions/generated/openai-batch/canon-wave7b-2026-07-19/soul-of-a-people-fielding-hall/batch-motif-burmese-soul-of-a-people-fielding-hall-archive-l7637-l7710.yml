canonical_text:
  quote: ''
  summary: A distressed woman speaks to the narrator about years of quarrels with
    her husband, childlessness, her efforts to support remittances to his sisters,
    and his taking of a second wife. She says she invited the second wife into the
    household but now feels dominated and displaced. After seeing her husband walk
    out with the second wife while playing a concertina, she cries and asks what she
    should do. A friend says she can seek divorce through the elders; the excerpt
    ends before her full response.
  language: English
