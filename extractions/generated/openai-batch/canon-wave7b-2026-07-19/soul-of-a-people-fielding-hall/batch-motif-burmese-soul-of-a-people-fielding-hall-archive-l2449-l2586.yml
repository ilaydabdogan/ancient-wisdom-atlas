canonical_text:
  quote: ''
  summary: 'The narrator recounts episodes from a war in Upper Burma: rebels destroy
    a town and withdraw before relief troops can arrive; a leader named Ta Te makes
    a last resistance in a pagoda enclosure and is killed; the narrator describes
    fragmented insurgent bands; a Kawlin governor''s son aids British columns against
    insurgents; after raiders cross the Mu River and rob a village, a cavalry pursuit
    camps in a forest monastery and is attacked at midnight.'
  language: English
  quote_policy: summarized
