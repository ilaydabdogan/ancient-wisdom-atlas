canonical_text:
  quote: ''
  summary: The passage introduces the Popa Nats as a brother and sister whose former
    human history is known locally. The brother is a powerful blacksmith, and the
    sister is exceptionally beautiful. Orphaned, they live together in close affection,
    rejecting marriage ties. A new king orders beautiful maidens sent to the Golden
    City as royal wives. A governor persuades the sister to go; the brother consents
    but refuses to accompany her. She travels down the river to the king, while he
    returns to his forge. She becomes a principal queen with influence over the king.
  language: English
  quote_policy: summarized
