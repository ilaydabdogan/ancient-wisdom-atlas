canonical_text:
  quote: accused men always confess, sometimes even they surrender themselves
  summary: The passage describes the narrator's view that some participants in violent
    robberies are remorseful young men rather than hardened criminals, states that
    accused men in country districts often confess or surrender, and gives an anecdote
    of an accused man released through a warrant mistake who later comes to the narrator
    after hearing he is wanted.
  language: English
  quote_policy: quoted
