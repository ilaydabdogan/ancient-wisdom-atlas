  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator says that one or two ringleaders might be hardened and brutal,
    but others would be boys or young men led by the idea of a frolic, now sorry and
    ready to confess and atone.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator states that confession by criminals on arrest was striking, and
    that accused men in country districts confess and sometimes surrender themselves.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man was arrested in another jurisdiction for cattle theft, sentenced to
    two years' rigorous imprisonment, then suspected of an earlier robbery in the
    narrator's jurisdiction and transferred to a gaol near the narrator's court.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The man was committed with four others for trial before a sessions judge for
    the robbery, which he admitted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'A warrant mistake occurred while the narrator was in camp: the committal
    warrant was made out only for the four others, and no remand warrant was made
    out for the man already under sentence.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Because the man had appealed and was acquitted in the cattle-theft case, a
