    other warrant.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the mistake was discovered, a fresh warrant was issued and mounted police
    searched for the man but did not find him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: About four days later, the man came to the narrator's house and said he had
    heard the narrator wanted him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The narrator reminded the man that he was committed to stand trial for dacoity;
