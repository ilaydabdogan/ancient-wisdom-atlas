canonical_text:
  quote: ''
  summary: The passage explains a Buddhist view in which repentance is only an initial
    recognition, not a purifying act; moral character is made through sustained effort.
    A wicked person cannot immediately attain the rest of the sinless dead, but hell
    is temporary and purification eventually allows renewed possibility and eventual
    heaven. The narrator contrasts this with Christian deathbed hope and fear, then
    asks a Burman magistrate what comforts a dying person when monks do not come.
  language: English
  quote_policy: summarized
