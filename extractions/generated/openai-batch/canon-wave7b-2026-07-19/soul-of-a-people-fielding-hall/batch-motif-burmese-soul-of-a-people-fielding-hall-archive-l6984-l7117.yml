canonical_text:
  quote: ''
  summary: The passage contrasts an Indian Laws of Manu ideal of a wife who fears
    and serves her husband with the narrator's account of Burmese wives as free women
    who divide authority with husbands, act in business and law, and influence public
    affairs indirectly through husbands. It then begins a frontier story in 1889 Burma
    involving the narrator as administrator, insurgent conditions, village headmen,
    and the headman Saw Ka reporting the arrest of armed cattle robbers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The cited Laws of Manu ideal describes a wife fanning and soothing her master
    to sleep, sitting near his bed, fearing noises that might disturb him, and guarding
    even her breath.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cited Laws of Manu ideal says the wife should anticipate the husband's
    waking wants, including bath, clothes, and food, while fearing his anger.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator states that the Laws of Manu are Indian in origin and are not
    totally accepted by the Burmese.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The narrator says a Burmese girl would laugh at the fear-based ideal and would
    say a household is ruled by love and reverence, not fear.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The narrator says a Burmese woman enters marriage as a free woman, not as
    her husband's slave, yielding in some matters and taking her own way in matters
    pertaining to women.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator says Burmese women recognize a division between matters they
    should not interfere with, including public affairs, and other domains where the
    balance is redressed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narrator says Burmese women may act in law courts or business, in their
    own names or on behalf of husbands, and that husbands and wives may sign deeds
    and borrow or lend jointly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The narrator says Burmese women do not openly appear in public affairs, though
    they take a keen interest and may act through and by their husbands.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The frontier setting is described as newly incorporated northwest Burma in
    1889, with fever, raiding threats, armed men, and a roadless, forested hill country
    where attackers could disappear suddenly.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: Villages are described as arranged in groups, each under a headman whose duties
    include keeping people quiet and, if possible, protecting them from insurgents.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Saw Ka is described as a headman, former free-lance, and fighting-man whose
    villagers pursued and arrested armed robbers after a fight over attempted cattle
    theft.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The narrator receives Saw Ka's letter while holding court in a small tent,
    orders the prisoners placed in the lock-up, and later compliments Saw Ka, saying
    the matter will be reported for possible reward.
  category: sequence
  evidence_refs:
  - ev:11
