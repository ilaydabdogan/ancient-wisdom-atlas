canonical_text:
  quote: Boys have many festivals, girls have but one.
  summary: The passage describes Burmese boys’ temporary entry into monastery with
    a festival, girls’ ear-boring feast and an example celebration with lamps floating
    on the river, then turns to girls’ social life, courting-time on verandas, suitors,
    the cheroot lit as a proxy kiss, chaperoning, arranged marriages, and romances
    in evening settings.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Boys between eight and fourteen become monks for a time, and their entrance
    into the monastery is marked by a great festival.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Girls do not enter nunneries in the described custom; they have a feast in
    their honour and have their ears bored.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A shopkeeper’s daughter’s ear-boring celebration included a pwe open to all
    for three nights, food, sweets, and presents given away.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the last night of the example celebration, a boat in midstream launched
    many tiny rafts carrying lamps; lamp-marked boats, pagodas, and miniature houses
    also floated down the river.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A woman says that a girl has only one great festival in her life, so it should
    be made as good as possible.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The narrator describes Burmese girls as growing up quiet and sedate, with
    clear knowledge of the world and with dreams of a lover that can come true.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Courting-time is described as an institution occurring from nine until ten
    o’clock, especially on moonlit nights.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: During courting-time, a girl sits on the veranda, usually alone, while suitors
    come to stand by the veranda and talk softly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A girl may give suitors cheroots she has made; for one suitor she may light
    the cheroot first, which the narrator describes as kissing him by proxy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Although the girl is described as effectively alone, someone is always near
    or within call because the veranda is open to visitors.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Marriages are usually arranged by parents; the narrator says a lad who gains
