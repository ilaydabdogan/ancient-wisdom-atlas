  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says many romances occur beside the well, in palm-groves, and
    by the river shore, sometimes ending well and sometimes in tragedy.
  category: setting
  evidence_refs:
  - ev:8
