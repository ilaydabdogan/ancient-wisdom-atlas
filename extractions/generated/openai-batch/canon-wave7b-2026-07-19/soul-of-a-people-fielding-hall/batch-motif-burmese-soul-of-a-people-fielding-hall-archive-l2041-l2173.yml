canonical_text:
  quote: the teachings of the Buddha forbid war
  summary: The passage describes Upper Burma after the overthrow of King Thibaw, emphasizing
    weak central authority, a largely egalitarian and village-based society, and the
    absence of feudal war leaders. It then contrasts the organized and revered Buddhist
    monastic institution with other religious traditions that the narrator says have
    supported war. In this account, Buddhist monks do not mobilize resistance; instead
    they keep their vows, beg for alms, teach, tend monasteries, and preach peace,
    kindness, and pity amid social disorder and warfare.
  language: English
  quote_policy: quoted
