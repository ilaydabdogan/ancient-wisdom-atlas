canonical_text:
  quote: ''
  summary: The passage describes Burmese government as structurally corrupt because
    power was unchecked, appeals were ineffective, provincial governors obtained office
    by bribery, and officials collected taxes and administered law selectively. It
    also cites a Burmese proverb classing officials among the five great enemies of
    mankind, while saying many officials were not personally bad and that the system
    itself was rotten. The passage ends by asking why the Burmese people remained
    quiet under such rule.
