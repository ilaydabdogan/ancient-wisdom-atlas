canonical_text:
  quote: The excitement of the great day of the full moon began in the morning, about
    ten o'clock, with the offerings to the monks.
  summary: The passage describes a Burmese village full-moon festival. In the morning,
    villagers arrange gifts outside the gate and monks process past them before donors
    follow to the monasteries with their offerings. At dusk, the pagoda, headman's
    house, and monasteries are lit with lamps; people place flowers and candles at
    the pagoda, and the evening includes stalls, dancing, conversation, and communal
    enjoyment. The narrator adds that such festivals are generally similar, with local
    variations such as races or boxing.
  language: English
  quote_policy: quoted
