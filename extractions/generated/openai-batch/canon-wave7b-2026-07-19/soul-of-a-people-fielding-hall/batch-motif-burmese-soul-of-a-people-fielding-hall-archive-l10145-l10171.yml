canonical_text:
  quote: ''
  summary: The chapter opens with the title “Death, the Deliverer” and an epigraph
    attributed to the death of the Buddha, in which approaching death is compared
    to being freed from the body as from a heavy load. The narrator then introduces
    a well-known Burmese song from sacred writings, called the story of Ma Pa Da,
    first told to him by a Burmese monk on the frontier. The story begins in the time
    of the Buddha in Thawatti, where a rich merchant has many slaves; the passage
    explains that such slaves were treated as part of the family, were not freely
    saleable, and were governed by law.
  language: English
