canonical_text:
  quote: ''
  summary: The passage recounts a post-marriage visit, reflections on Burmese women’s
    intense love and love-related tragedies, an anecdote of a young woman who followed
    her outlawed lover into combat and died, and a translated Burmese love-song in
    which a beloved girl is imagined as the child of the moon and lotus and praised
    through floral, celestial, jewel, and wind imagery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the marriage, the couple visits the narrator hand in hand with the girl's
    parents and friends; the girl says the marriage was her fault because she could
    not wait.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girl says she feared that if her husband had gone to Rangoon he might
    have fallen in love with someone there and forgotten her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: When asked about the forest, the girl says it was the most beautiful place
    in the world.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The narrator reports that when parents are obdurate, flight is impossible,
    or love is unreturned, young girls may die for love by turning to the river and
    its waters.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator characterizes the country as full of romantic, passionate love
    and says he has often seen or heard of women’s love and its tragedies.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:6
  text: A girl in man's attire follows her outlawed lover to an insurgent camp, takes
    up sword and gun during a surprise attack, fights by his side, and is cut down.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wounded girl dies about an hour later beneath the forest shadow, held
    up by mounted police, with no female or kin present to help her.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The outlawed lover is later killed in action while fighting against the narrator’s
    side, facing his enemy.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The narrator describes Burmese love-songs as short, sweet, rhythmical, and
    difficult to translate while preserving their beauty.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the translated love-song, the moon woos the lotus; the sweetheart is called
    their child and is born when the blossom opens and its petals move.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The translated love-song praises the beloved’s beauty, health, gold clothing,
    jewelry, eyes, pride, and incomparability, and says the speaker fears wind or
