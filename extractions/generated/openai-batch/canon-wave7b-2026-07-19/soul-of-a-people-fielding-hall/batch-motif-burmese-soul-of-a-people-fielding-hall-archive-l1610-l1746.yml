canonical_text:
  quote: ''
  summary: 'An exposition of Buddhist moral causation and rebirth: present character
    and circumstances arise from past actions and thoughts; each person shapes his
    own destiny through conduct. The passage then turns to happiness and misery, presenting
    Buddhism as diagnosing misery at its root: life, change, death, and sorrow are
    inseparable, and desire for life is compared to thirst increased by drinking from
    the sea of existence.'
  language: English
