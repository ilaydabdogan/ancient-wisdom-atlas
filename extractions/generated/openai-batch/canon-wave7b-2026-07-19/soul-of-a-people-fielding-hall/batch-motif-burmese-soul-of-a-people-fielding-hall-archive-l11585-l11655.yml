  quote: the keeper of this wood was Time
  summary: The passage describes a forest full of attractive blossoms with hidden
    thorns, winding roads that return travelers to their starting point, a distant
    narrow straight road among rocks, and shifting lights. Men wander there without
    rest because Time, personified as the keeper, drives them onward. Some pursue
    pleasant glades but grow less satisfied; others reject the glades and circling
    roads, saying they seek rest and a firm clear light rather than wandering lights.
  language: English
