canonical_text:
  quote: ''
  summary: 'The chapter passage describes Burmese Buddhist attitudes toward killing
    animals: a strong taboo against killing cattle or selling beef, a general religious
    command against taking life, social contempt for fishermen despite fish consumption,
    and several anecdotes in which fowls or ducks are bought, released, hidden, or
    mourned to avoid their slaughter.'
  language: English
  quote_policy: summarized
