  summary: The narrator discusses divorce in Burmese society, contrasting officials
    or hangers-on with the wider population, noting uncertainty about divorce rates,
    describing a former queen’s opposition to plural wives and divorce abuses, and
    arguing that easy divorce is checked by public opinion and by the need for good
    cause. The passage frames marriage as a bond of mutual forbearance rather than
    a fetter, then introduces an anecdote about prisoners in Ava being chained together
    two by two and developing revulsion toward a co-bondsman.
