  summary: The narrator reflects on an earlier interview involving liquor and states
    that he never again offered liquor to a Burman. He describes Burmese Buddhist
    opposition to stimulants and opium, rejects reports that King Thibaw drank, cites
    a palace-connected merchant as denying those reports, and presents Burmese society
    as committed to total abstinence.
