canonical_text:
  quote: ''
  summary: On a river island where hunters burn grass to drive out deer, a frightened
    fawn leaps into a fisherman's boat occupied by his wife. The woman, who had lost
    a beloved but erring son, believes the son's soul is looking at her through the
    deer's eyes. She protects the fawn from the hunters and claims it as her son.
    The hunters sue for possession. The court rules that neither side can prove whether
    the son's soul is or is not in the animal, so the deer remains with the court
    and becomes the judge's property. A Burman informant criticizes the decision as
    contrary to Burmese ideas of justice and says the judge likely wanted the deer
    for himself.
  language: English
  quote_policy: summarized
