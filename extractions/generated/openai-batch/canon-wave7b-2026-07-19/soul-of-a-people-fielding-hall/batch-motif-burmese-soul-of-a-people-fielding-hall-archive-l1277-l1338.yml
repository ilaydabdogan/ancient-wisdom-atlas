  summary: A young prince seeks instruction from renowned hermits who teach that the
    soul and body are enemies and that bodily punishment purifies the soul. After
    studying and attempting their austerities, he rejects self-punishment as useless
    and degrading, leaves the teachers of cave and monastery, remains confident that
    truth exists, and goes into the forest to seek knowledge from nature.
