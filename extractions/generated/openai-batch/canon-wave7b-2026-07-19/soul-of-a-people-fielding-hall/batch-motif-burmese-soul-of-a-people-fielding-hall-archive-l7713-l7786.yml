canonical_text:
  quote: ''
  summary: A Burmese woman tells the narrator's friend that she and her husband were
    married at a Christian mission school and are therefore husband and wife forever,
    but that Burmese law allows her husband to take a second wife. The husband arrives,
    a restrained confrontation follows, and the couple leaves unreconciled. The narrator
    reflects that the Christian marriage bond prevented an otherwise likely divorce.
    A second anecdote begins with a young heiress who inherits property, is courted
    by many young men, and marries a police sergeant.
  language: English
  quote_policy: summarized
