  summary: The passage recounts the Buddha living forty-nine days beneath a great
    fig-tree by a river, where he finds truth in his own heart after purification
    and struggle. He then preaches to the world, sees Yathodaya and his son, and later
    dies at great age, instructing Ananda to practice the works leading to perfection
    and to rely on his laws and teachings after his departure.
