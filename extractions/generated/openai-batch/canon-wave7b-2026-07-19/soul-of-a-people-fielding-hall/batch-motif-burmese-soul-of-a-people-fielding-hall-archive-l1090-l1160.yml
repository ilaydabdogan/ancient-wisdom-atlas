  summary: The passage presents reflections on the parting of Prince Gaudama and his
    wife Yathodaya. A monk says Gaudama had not yet become the Buddha and was seeking
    the light, while still attached to his wife. An unnamed woman emphasizes Yathodaya's
    suffering when her husband left her and her baby, especially during childbirth.
    The narrator says Yathodaya's sympathy and support helped Gaudama reach his resolve
    to leave the world and seek truth, though she did not know the outcome, and notes
    that Buddhists honor her.
