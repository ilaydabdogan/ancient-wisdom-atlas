canonical_text:
  quote: ''
  summary: 'The passage presents Burmese reincarnation anecdotes: a little girl recalls
    a prior adult married life and a shoulder wound corresponding to a birthmark;
    a boy recognizes silk from his former life and describes an interval without a
    body; the narrator describes dreams in which spirits seek entry into unborn children;
    and a woman dreams that her dead lover agrees to enter her unborn baby, but the
    infant and then the woman die.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A little girl says she had been married four times in a former life and describes
    a divorced wife who cut her former body with a chopper.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mark on the girl's shoulder is described as a birthmark that corresponded
    to the wound said to have been given to the former man.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The girl says the loved wife belonged to a former life; the narrator states
    that she now loves only her present parents and that the emotions of the previous
    life are dead.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A little boy, when about three years old, recognizes silk from his former
    dress after it has been made into monastic or festival curtains.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The same boy says he spent three months without a body between death and incarnation
    because he had accidentally killed a fowl, and that he dwelt in the hollow shell
    of a palm-fruit near a cattle path.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator states that a pregnant woman may dream of a spirit asking permission
    to enter the unborn child and that, to some extent, the woman can say who will
    be the life of her child.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: A woman and a young man love each other, but her parents refuse the marriage;
    the pair attempt to run away, are caught, and the man leaves the neighborhood.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The woman marries another man and has no children for several years; later
    the former lover returns ill, dies, and the woman becomes pregnant around the
    same time.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The woman dreams that her soul leaves her body, meets the dead lover's soul
    in space, asks him to enter the baby about to be born, and receives his consent.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the dream, the woman takes care of herself and repeatedly goes to the
    pagoda with flowers, praying for the baby's body to be fair and strong.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The baby is born, breathes briefly, cries, and dies; a few hours later the
    woman dies after saying the baby's soul was her lover's soul and that she is glad
    to follow him.
  category: sequence
  evidence_refs:
  - ev:10
