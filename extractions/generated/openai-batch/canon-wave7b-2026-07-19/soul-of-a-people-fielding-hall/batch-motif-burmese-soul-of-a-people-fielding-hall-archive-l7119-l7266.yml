canonical_text:
  quote: ''
  summary: The narrator recounts an incident in which Maung Saw Ka, a headman, discovers
    that a report sent in his name about captured cattle thieves was written while
    he was away. Saw Ka's wife had used the headman's appointment order to organize
    villagers, issue arms, pursue robbers, recover cattle, and send prisoners. The
    passage then generalizes about Burmese women's work, property, trades, gendered
    occupations, petty trading, and bazaars.
  language: English
  quote_policy: summarized
