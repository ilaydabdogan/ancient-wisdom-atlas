canonical_text:
  quote: It is all given straight from the giver's heart.
  summary: The passage describes Burmese voluntary charity as abundant and personally
    motivated, especially in the building of roadside rest-houses and formerly roads
    and bridges. It contrasts private charity with British governmental public works,
    predicts future charitable support for hospitals and education, notes holy men’s
    poverty, and gives an anecdote about a Burman contractor who lives modestly while
    donating most of his income.
  language: English
  quote_policy: quoted
