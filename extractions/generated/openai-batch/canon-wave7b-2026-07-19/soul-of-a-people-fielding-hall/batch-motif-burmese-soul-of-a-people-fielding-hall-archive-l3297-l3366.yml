  summary: The passage describes village taxation, reporting of serious crimes to
    a governor, local handling of lesser crimes, expulsion of nuisance persons, and
    remembered contrasts between former Burmese village discipline and later police
    administration. It includes anecdotes about delayed marriage rules, punishment
    in stocks, banishment, and a monk’s complaint about young men disturbing monastic
    lessons and village girls at the well.
  language: English
