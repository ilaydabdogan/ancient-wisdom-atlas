literal_observations:
- id: obs:1
  text: Tax money was assessed publicly, collected from villagers, and paid to the
    governor; if a family could not pay, other villagers made up the deficiency proportionally.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Serious crimes such as gang-robbery and murder were supposed to be reported
    to the governor, who might arrest criminals if able and inclined.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lesser crimes were handled within the village and were said to be partly prevented
    by close village knowledge of residents.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A man who became a nuisance to the village could be expelled.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The narrator reports old Burmans contrasting former times with current conditions:
    former big crimes were often unpunished but petty crime was limited; later policing
    hunted major criminals while petty crime and some moral breaches increased.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: A former headman said that in his village men were not allowed to marry until
    about thirty, because youthful marriages were considered harmful.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: If a young man persisted in pursuing a girl after being told to leave her
    alone, he could be put in the stocks for one or two days and then banished if
    that failed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A monk complained that young men used shameful words, shouted near his monastery,
    disturbed students and girls at the well, and were not well-behaved.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The monk said that in Burmese times such conduct would have been punished
    by water-carrying for school gardens, road-making, or being put in the stocks.
  category: speech
  evidence_refs:
  - ev:9
