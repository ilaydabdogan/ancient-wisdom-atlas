canonical_text:
  quote: ''
  summary: The passage reports conversations and commentary about Burmese Buddhist
    views of women, religion, and renunciation. A male speaker says women are thought
    unable to attain the great deliverance unless reborn as men, because deliverance
    requires renouncing the world and purification by wisdom and meditation. The narrator
    contrasts the abundance of monks with the scarcity of nuns, describes women as
    active devotional participants at pagodas, monasteries, and religious recitations,
    and records a female speaker saying women mix religion with home-life and affections.
    The passage ends by noting that monks are greatly honored, nuns are not, and renunciation
    is treated as the path to the Great Peace.
  language: English
  quote_policy: summarized
