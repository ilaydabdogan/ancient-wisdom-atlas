  summary: The queen tells the king she accepts that her brother is a traitor and
    obtains permission to attend his execution at the river-shore. At dawn, a large
    crowd gathers by the great river. A pyre with an iron post is prepared; the queen
    arrives with her ladies, and soldiers bring the blacksmith, who is bound as a
    traitor. The pyre is lit while the queen watches silently, and the chained man
    looks toward the purple mountain where his home lies.
