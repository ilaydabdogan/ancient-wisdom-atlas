canonical_text:
  quote: ''
  summary: A headman describes a great self-sown tree once inhabited by a Nat. Villagers
    built a small Nat-house beneath it and offered flowers and water. The Nat protected
    the tree and nearby living creatures, punishing anyone who injured roots, branches,
    trunk, or animals near the tree. English Government officials later camped there,
    killed fowls, made noise, and shot birds; because these acts violated the Nat's
    care for life and peace, the Nat departed. The headman and villagers doubt that
    offerings alone would bring the Nat back while the rest-house and disregard for
    life remain.
  language: English
  quote_policy: summarized
