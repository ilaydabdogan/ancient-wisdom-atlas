canonical_text:
  quote: ''
  summary: A man later referred to as Ma Pa Da's husband lies dead from a snakebite
    in the forest. Ma Pa Da, alone with two children, tries to cross a stream one
    child at a time. While she is midstream, an eagle carries off the baby, and the
    older boy misreads her gestures, enters the water, and drowns. She despairs, resolves
    to return to her father in Thawatti, reaches the city gates, and meets mourners
    returning from a funeral.
  language: English
  quote_policy: summarized
