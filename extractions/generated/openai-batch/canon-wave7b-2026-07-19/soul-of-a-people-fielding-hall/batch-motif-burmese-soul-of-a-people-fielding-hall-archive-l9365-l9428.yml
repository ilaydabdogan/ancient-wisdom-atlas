canonical_text:
  quote: ''
  summary: The passage describes Burmese belief in Nats as spirits present throughout
    nature, especially in trees. Tree-Nats may receive small houses and courteous
    offerings. A feared tree Nat at a road crossing requires passers to dismount,
    and a rider who ignored this was later struck by dangerous fever. Other Tree-Nats
    are said to throw stones at houses when offended, as in a Maulmain household where
    the stoning ceased only after a disliked servant was dismissed.
  language: English
  quote_policy: summarized
