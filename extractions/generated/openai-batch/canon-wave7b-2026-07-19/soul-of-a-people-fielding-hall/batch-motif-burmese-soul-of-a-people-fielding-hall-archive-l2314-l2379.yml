canonical_text:
  quote: ''
  summary: 'The passage describes Shemmaga as a triangular fortified position by a
    river and hill, with teak monasteries occupied by a Ghurka garrison after monks
    had been ejected. Behind Shemmaga, the robber chief Maung Yaing commands local
    armed men. After direct opposition to British troops fails, he adopts a boycott
    policy: no Burman is to give the enemy service, information, supplies, guidance,
    or other aid. He enforces this by executing a village headman who guided troops,
    cutting off supplies, blocking roads, and ordering the inhabitants of Shemmaga
    to leave. The inhabitants, small traders in salt and rice, are reluctant to abandon
    their homes and livelihoods, and some prefer the English garrison because it allows
    trade in peace.'
  language: English
