  summary: The passage describes Buddhist reverence for the Buddha as a teacher who
    sought truth, found it inwardly, and made it known as light. It states that Buddhist
    religious service consists in following laws of righteousness toward Great Peace,
    and criticizes petitionary prayer as ignorance. The narrator then recalls seeing
    a woman at a pagoda praying that her sick baby recover, hoping some Someone or
    Spirit may hear when human help cannot suffice.
