  quote: No bribe was so gratefully accepted as some whisky.
  summary: The passage describes Burmese teetotal practice and liquor prohibition
    in Upper Burma, then gives an anecdote in which a merchant facing arrest goes
    to a governor, offers cases of whisky, receives public protection, and sends the
    whisky.
  language: English
  quote_policy: quoted
