canonical_text:
  quote: ''
  summary: 'The passage describes Burmese religious figures as pleading with the king
    for mercy but not wielding state power. It states that central government was
    bad and disconnected from religion, and argues that combining government with
    the monkhood would damage religion. It then describes village-level self-government:
    headmen were formally appointed by the king but chosen by villagers, and villagers
    assessed and collected taxes through local assessors.'
