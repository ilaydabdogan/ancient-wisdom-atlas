canonical_text:
  quote: There is no good thing but peace, no sin like strife and war.
  summary: The passage presents a soldier's criticism that Buddhism does not organize
    or encourage armed resistance, then contrasts militant religion with Buddhism's
    unchangeable prohibition on taking life. It imagines a Burmese peasant fighting
    invaders without religious sanction, heavenly promise, or divine ally, and describes
    Burmese resistance as courageous despite lack of leaders, cohesion, weapons, and
    a fighting religion.
  language: English
  quote_policy: quoted
