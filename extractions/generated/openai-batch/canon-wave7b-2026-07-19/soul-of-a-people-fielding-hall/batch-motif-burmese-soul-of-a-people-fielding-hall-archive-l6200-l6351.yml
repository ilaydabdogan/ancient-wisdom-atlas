canonical_text:
  quote: ''
  summary: The passage opens with a Burmese love-song image of female beauty, then
    discusses the position of women in Burma. It reports that Burmese religion and
    law do not formally rank women below men, describes the Buddha as honoring both
    male and female disciples, explains monastic caution as directed against desire
    rather than against women, and compares this to blaming giddiness rather than
    a precipice. It also notes one legal-economic difference in compensation for a
    woman's accidental death, claims Burmese women have freedom from sacerdotal dogma
    and unfair inheritance law, and reports a common opinion that men are superior,
    including a belief held by some that a woman must be reborn as a man to gain a
    step in holiness.
  language: English
  quote_policy: summarized
