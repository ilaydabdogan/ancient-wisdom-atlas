canonical_text:
  quote: Let us flee together, for we love each other
  summary: A merchant buys a young male slave and brings him into his household. Ma
    Pa Da, the merchant's daughter, falls in love with the slave and secretly urges
    him to flee with her; he resists because of his slave status and his duty to his
    master, but finally yields. The pair flee at night with jewels and money, travel
    fearfully to a distant city, live there as husband and wife, trade, and have a
    child. Years later, while traveling with their child, they are delayed in a forest;
    Ma Pa Da falls ill, the husband builds a hut of branches and leaves, and a second
    son is born there. After she recovers, the husband goes out to cut firewood and
    does not return; Ma Pa Da waits through the night with the children, then searches
    for him and finds him nearby. The excerpt ends before his condition is stated.
  language: English
  quote_policy: quoted
