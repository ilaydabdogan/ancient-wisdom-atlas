canonical_text:
  quote: "“Such was the charm that kept the soldier from danger.”"
  summary: The passage recounts a return from Laka under fire while villagers curse
    the guide and invoke hill spirits. It then describes a soldier returning a worn
    Roman Catholic prayer paper with a red cross, treated as a protective charm. Around
    a camp-fire, the narrator discusses with the guide threats against him and Burmese
    beliefs about charms for invulnerability, including tattoos, medicines, stone
    charms, and palm-leaf writings. The narrator states that such charms are not Buddhist
    and are prohibited by Buddhist discipline.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The returning party is fired on from forest and high rocks, and some men dismount
    to clear a breastwork built for firing at them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Voices of men, women, and children curse the guide by name and call on the
    spirits of the hills to remember that he brought desolation to their village.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After returning, the friend takes a little paper from his pocket, returns
    it to his servant, and says he is safe because no bullet has hit him; the servant
    attributes this to the goodness of God and asks whether the sahib will keep the
    paper.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The paper is described as a Roman Catholic prayer printed on paper, with a
    red cross at the top, old, worn, creased, and much used; the narrator calls it
    the charm that kept the soldier from danger.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: At night, a mixed assembly sits around a camp-fire near hills, forest, rice-fields,
