canonical_text:
  quote: ''
  summary: The passage presents Buddhist teaching on love, righteousness, and the
    further way to the Great Peace. Universal love and ethical conduct purify the
    heart but are described as only the beginning or gate. The seeker must see life
    itself as sorrow, reject death or suicide as escape because death begins another
    life, estrange himself from the sorrowful world, discipline the soul, and fix
    the heart on the Great Peace, described as a haven without storms or struggle
    and explicitly not death. A closing poem evokes pure, mirror-bright, changeless
    celestial life among immortals amid worldly decay.
  language: English
