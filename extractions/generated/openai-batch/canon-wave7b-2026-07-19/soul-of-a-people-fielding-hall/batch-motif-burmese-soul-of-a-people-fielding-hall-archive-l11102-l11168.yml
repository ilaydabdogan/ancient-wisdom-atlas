canonical_text:
  quote: ''
  summary: The passage reports Burmese accounts of children and an adult who remember
    former lives. Twin boys are tested at Okshitgon and are said to recognize places,
    people, former clothing, and an unpaid debt. They describe a bodiless interval
    after death, wandering in air and hiding in trees as punishment for sins before
    being born again as twins. The narrator also describes reluctance to discuss such
    beliefs, an adult police orderly who remembers having been a woman in a former
    life, and a court case said to depend on transmigration theory.
  language: English
  quote_policy: summarized
