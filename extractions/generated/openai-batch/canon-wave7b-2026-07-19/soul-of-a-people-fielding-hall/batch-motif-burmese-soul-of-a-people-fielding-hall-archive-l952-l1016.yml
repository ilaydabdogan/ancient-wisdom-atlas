canonical_text:
  quote: We are very near the beasts, but very far from heaven.
  summary: The passage describes a prince taught through an image of a high ladder
    leading toward perfection and happiness. He prefers teachings of holiness to conquest
    and palace luxury, wishes to become a hermit and mendicant, and is opposed by
    his parents through distractions, luxury, and marriage to Yathodaya. Yathodaya
    shares his solemn view of life and becomes a kindred support after religious teachers
    are banished from the palace.
  language: English
  quote_policy: quoted
