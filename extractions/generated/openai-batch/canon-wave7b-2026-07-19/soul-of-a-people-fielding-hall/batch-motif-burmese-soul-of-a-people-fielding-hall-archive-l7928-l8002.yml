canonical_text:
  quote: ''
  summary: A wife who has repeatedly threatened divorce and her husband obtain a divorce
    before elders. The wife soon seeks reconciliation through a headman and directly
    asks her husband to return, but he refuses, treating the divorce as final. In
    grief she returns to the large lonely house and hangs herself. The narrator then
    comments that divorce is uncommon among respectable Burmans and more common among
    people attached to the colonial Administration.
  language: English
  quote_policy: summarized
