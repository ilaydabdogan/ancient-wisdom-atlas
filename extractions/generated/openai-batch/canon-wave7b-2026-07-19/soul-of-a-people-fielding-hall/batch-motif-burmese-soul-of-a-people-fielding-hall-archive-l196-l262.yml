canonical_text:
  quote: ''
  summary: The narrator contrasts written and monastic Buddhist teaching with popular
    Burmese beliefs and practices. The passage describes children remembering former
    lives, doctrinal teaching that prayer to the Buddha is futile, a mother praying
    with flower offerings at a hilltop pagoda for her sick firstborn, monks explaining
    discrepancies as popular confusion, and a formal definition of Buddhist identity
    through rites, temporary monastic membership, and adherence to the Buddha's teachings.
  language: English
  quote_policy: summarized
