canonical_text:
  quote: Think of your good deeds.
  summary: A Burmese informant explains that after death a person’s next existence
    depends on good or evil done in life and may move him nearer to Peace. At a deathbed,
    monks do not come; instead an older friend, father, village elder, or headman
    speaks to the dying man and urges him to remember his good deeds. The narrator
    then describes the bamboo house, family attendants, village sounds, and the elder
    helping the sick man recall charitable acts such as giving to monks.
  language: English
  quote_policy: quoted
