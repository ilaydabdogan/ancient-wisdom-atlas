  summary: The passage introduces Buddhist Lent as the three rainy months from the
    full moon of July to the full moon of October. It states that during these months
    the Buddha would retire to a monastery and cease travelling and teaching for a
    time. The custom is described as older than known memory and suited to rainy-season
    conditions, when roads are covered with water or mud, rest-houses are uncomfortable,
    and villagers tend to stay home for local work such as ploughing.
