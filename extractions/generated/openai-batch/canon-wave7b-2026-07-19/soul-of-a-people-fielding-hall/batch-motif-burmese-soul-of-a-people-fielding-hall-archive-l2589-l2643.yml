canonical_text:
  quote: At last a little very faint silver dawn came gleaming through the tree-tops
  summary: A military camp is attacked at night by Burmese forces. After failed rushes,
    the attackers fire from forest cover into the camp. The narrator describes darkness,
    cold, gun flashes, casualties treated without light, a cautiously shrouded lamp,
    and the eventual dawn when firing stops. The force then withdraws toward more
    open country because pursuit is unlikely in unfamiliar terrain against an enemy
    with local knowledge.
  language: English
  quote_policy: quoted
