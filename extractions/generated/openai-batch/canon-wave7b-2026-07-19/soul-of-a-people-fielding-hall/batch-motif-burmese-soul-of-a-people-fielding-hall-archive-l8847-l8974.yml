  summary: The passage recounts Burmese boys intending to release captured poisonous
    snakes into water, then discusses the Burmese Buddhist refusal to take life, rejects
    a European explanation based on transmigration, and emphasizes compassion and
    kind treatment toward animals as a Burmese moral practice compared with Hindu
    and Muslim practices in India.
