  summary: The passage describes Gaudama the Buddha as a human teacher who sought,
    found, and transmitted a way for others. It presents his teaching as knowledge
    of immutable laws of life and righteousness, compares his limits of explanation
    to Newton’s limits after discovering gravity, rejects the charge that his silence
    about the infinite is materialism, and emphasizes his humility, reverence, and
    quest from darkness toward light.
