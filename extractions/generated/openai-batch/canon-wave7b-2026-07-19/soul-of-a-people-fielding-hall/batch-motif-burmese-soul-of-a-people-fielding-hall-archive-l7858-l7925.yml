canonical_text:
  quote: ''
  summary: 'The passage describes wives seeking divorce for domestic grievances and
    elders delaying decisions until anger passes. It then recounts a cultivator couple:
    the wife owns inherited land, house, and money; the husband is generally hardworking
    and good-tempered but periodically drinks too much. His drunken returns provoke
    the wife’s verbal attacks and repeated divorce demands, which elders defer until
    tempers cool. The excerpt ends as one quarrel escalates beyond previous bounds.'
  language: English
  quote_policy: summarized
