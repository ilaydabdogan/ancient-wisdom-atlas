canonical_text:
  quote: ''
  summary: The passage describes Burmese treatment of domestic animals, especially
    ponies used in transport. The narrator contrasts Burmese reluctance to overwork
    ponies with the behavior of non-Burmese gharry and mail-coach operators. In one
    town, Burmese travellers avoid a mail coach because its ponies are visibly underfed,
    overdriven, and whipped; they choose to walk or hire slower, costlier bullock-carts
    instead. The narrator interprets this as compassion rather than formal religious
    obedience. The passage then describes cattle, ponies, and water buffaloes as unusually
    tame, including a small child managing a buffalo herd.
  language: English
  quote_policy: summarized
