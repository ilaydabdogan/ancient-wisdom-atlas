canonical_text:
  quote: ''
  summary: The passage explains a Burmese etiquette of not volunteering advice or
    help unless asked, using examples of a dangerous bridge, drifting on a log, and
    suicide. It contrasts this with an English habit of intervention, then frames
    Burmese non-interference as courtesy and respect for self-responsibility. It concludes
    that each person makes or harms himself through thought and action, and that courtesy
    is owed because of the giver’s own standard, not the receiver’s merit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person may not receive unsolicited advice about a bridge; if the person
    asks, help will be given, but if relying on volunteered advice the person may
    be harmed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that this conduct is not laziness or discourtesy but an
    excess of courtesy that assumes the other person is aware and capable of judgment.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that someone in trouble will not be assisted unless the
    person calls out or asks for help.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In a hypothetical example, a person could drift from Bhamo to Rangoon on a
    log, and Burman boatmen would not pick the person up unless the person shouted
    for help.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In a contrasting hypothetical example, an English boatman would remove the
    drifting person from the situation and save the person despite the person’s own
    wishes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that a person might commit suicide in Burma and no one
    would stop the person, because others would treat the decision as the person’s
    own concern.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage explicitly denies that this non-intervention is cold-heartedness
    and describes the Burman as kind-hearted, helpful, hospitable, and charitable.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says that volunteered advice is regarded as self-conceit, and
    unsolicited help as implying that the recipient is foolish and the helper wiser.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that each person is responsible for himself and is the
    maker of himself through good or evil thoughts and acts.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that courtesy and good temper are due from a person to
    everyone, and that courtesy is measured by the giver rather than the receiver.
  category: speech
  evidence_refs:
  - ev:5
