canonical_text:
  quote: ''
  summary: 'The passage describes the Mandalay bazaar and provincial Burmese bazaars:
    their physical layout, daily morning trade, goods sold, bargaining, and the prominent
    role of women as independent retailers. It also states that market work is brief
    enough to coexist with home duties, that it broadens women’s experience, and that
    Burmese girls’ movements remain socially constrained despite women’s freedom.'
  language: English
  quote_policy: summarized
