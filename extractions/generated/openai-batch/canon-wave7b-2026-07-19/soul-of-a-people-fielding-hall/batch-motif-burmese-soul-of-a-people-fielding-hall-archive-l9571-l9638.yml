canonical_text:
  quote: A Nat is much like a human being; if you treat him well he will treat you
    well, and conversely.
  summary: 'The passage recounts local beliefs about Nats: forest Nats punish irreverent
    hunters and protect animals; river or pool Nats permit fishing when treated respectfully
    and given a share, but punish disrespect; high mountain Nats are powerful and
    are associated with ominous sounds interpreted as mourning the fall of Mandalay
    and foreign domination. Popa Mountain is introduced as a major place for Nats.'
  language: English
