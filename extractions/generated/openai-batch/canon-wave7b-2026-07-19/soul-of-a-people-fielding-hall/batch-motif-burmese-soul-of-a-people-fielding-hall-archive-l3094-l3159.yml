canonical_text:
  quote: The Burmese government left its people alone ; that was one great virtue.
  summary: The passage argues that old Burmese central government was weak and corrupt
    but often non-interfering, while local social conditions and self-government were
    strong. It contrasts Burma with garden images, rejects misgovernment as the cause
    of annexation, describes central government as separate from the people's soul,
    and notes that Buddhism did not seek supreme political authority.
  language: English
  quote_policy: quoted
