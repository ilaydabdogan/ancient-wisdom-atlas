canonical_text:
  quote: It is the time for preparing the land for the crop ; it is the time for preparing
    the soul for eternity.
  summary: The passage describes the rainy-season Lent as a period of agricultural
    labor, fasting, prayer, and restraint. It then describes the full moon of October
    as the end of Lent and the greatest festival of the year, associated with the
    end of rains, the sown crop, and pilgrimages to great pagodas, especially the
    Shwe Dagon at Rangoon.
  language: English
  quote_policy: quoted
