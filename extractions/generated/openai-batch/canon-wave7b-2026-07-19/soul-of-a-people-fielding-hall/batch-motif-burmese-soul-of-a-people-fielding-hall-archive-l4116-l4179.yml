  summary: The passage describes Burmese charitable building and religious/public
    giving as common among well-to-do men, who may receive titles based on their works.
    It then characterizes Burmese wants as few, with preference for outdoor life,
    direct experience, one’s own thought, and natural settings over books and large
    houses.
