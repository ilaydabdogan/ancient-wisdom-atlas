  evidence_refs:
  - ev:2
- id: obs:3
  text: Builders of bridges, wells, rest-houses, or sheds for water-jars may also
    receive titles based on what they built, though such titles are less commonly
    used unless the building is substantial.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the builder’s satisfaction comes from knowing that he has
    done a good deed.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The Burman’s material wants are described as few: a small house, plain food,
    and cotton or silk clothing for different occasions.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says the Burman does not care for a large house because there
