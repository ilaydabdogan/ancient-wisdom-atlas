canonical_text:
  quote: ''
  summary: The passage describes Burmese Buddhist monasteries as sacred, peaceful,
    clean, hospitable spaces where life is protected. It emphasizes monks' patience
    toward disrespectful foreigners, individual responsibility for conduct, acts of
    burial and rescue performed by monks, and the author's conclusion that living
    according to religious commands is harder and more meaningful than dying for religion.
  language: English
  quote_policy: summarized
