canonical_text:
  quote: "“Divorce is a dissolution of that partnership.”"
  summary: The passage narrates a troubled marriage in which a husband squanders his
    wife's money, neglects work, and deteriorates socially. After unsuccessful intervention
    by village authorities, the wife asks the elders for divorce, which they grant
    despite the husband's objection. The passage then describes Burmese divorce as
    a secular legal dissolution available before village elders, involving a written
    divorce document and rules for property division.
  language: English
  quote_policy: quoted
