canonical_text:
  quote: ''
  summary: 'The passage opens Chapter XXIII, titled “The potter''s wheel,” with a
    saying attributed to the Buddha comparing life to a whirlpool driven by passions.
    It describes Buddhist teaching on death as difficult: when life ends, the “I,”
    love, and remembrance end. It then says Burmese people accept the teaching but
    add a belief that death is not all; the Burmese villager believes in transmigration
    of souls, in contrast to strict Buddhist doctrine that death ends worldly passion.'
