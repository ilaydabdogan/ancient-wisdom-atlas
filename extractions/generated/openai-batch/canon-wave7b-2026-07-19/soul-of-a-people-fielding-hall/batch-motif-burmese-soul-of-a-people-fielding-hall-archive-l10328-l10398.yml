canonical_text:
  quote: ''
  summary: A bereaved woman learns that her parents have also died, after losing her
    husband and sons. In grief she goes mad and later approaches the Buddha, asking
    him to restore her dead. The Buddha teaches that all beings die and sends her
    to obtain mustard-seed from a household untouched by death. She obtains seed at
    the first house, but when she asks whether anyone there has died, she learns death
    has visited the household; repeated attempts give the same result.
  language: English
  quote_policy: summarized
