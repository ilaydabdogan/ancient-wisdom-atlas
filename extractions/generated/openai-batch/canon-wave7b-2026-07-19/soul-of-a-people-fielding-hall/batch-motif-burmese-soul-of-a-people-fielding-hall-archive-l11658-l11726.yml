  summary: An allegorical group leaves the forest by a narrow rocky cliff path, guided
    by the steady star of Truth. After painful travel, they move away from the forest
    and Time’s whip, reach a lake that washes away desire under the sun of Truth,
    and enter the Great Peace. Others remain among deadly flowers and thorns, are
    driven onward by Time, become weary, and begin to desire escape and Peace.
