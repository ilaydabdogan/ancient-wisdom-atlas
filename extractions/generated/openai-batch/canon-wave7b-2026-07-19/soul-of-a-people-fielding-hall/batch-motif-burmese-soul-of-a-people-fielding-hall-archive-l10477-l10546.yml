canonical_text:
  quote: '"all the world is one vast burial-ground"'
  summary: The passage explains a Buddhist view in which death brings no later personal
    reunion with loved ones, even across rebirths. A bereaved friend rejects hope
    of meeting his dead mother again, proposes a pagoda for her remains, and cites
    a proverb that the world is a vast burial-ground. The narrator emphasizes the
    inexorable law of death, the courage required by sorrow, and the belief that all
    beings will ultimately attain Nebhan or Great Peace, while grief belongs chiefly
    to survivors separated from the dead.
  language: English
  quote_policy: quoted
