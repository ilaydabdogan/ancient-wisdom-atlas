canonical_text:
  quote: ''
  summary: The passage describes Burmese marriage as a nonreligious social and legal
    status rather than a necessary ceremony. It notes optional wedding gestures among
    richer people, secret or quiet marriages among poorer people, post-marriage residence
    patterns, the wife's retained name and property rights, and a Laws of Manu typology
    of wives.
  language: English
  quote_policy: summarized
