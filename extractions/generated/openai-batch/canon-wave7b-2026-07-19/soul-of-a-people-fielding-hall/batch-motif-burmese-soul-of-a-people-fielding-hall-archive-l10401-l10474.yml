canonical_text:
  quote: death and life are one
  summary: The passage recounts a woman learning through visits from house to house
    that every household has known death, after which she returns and becomes a nun.
    It then presents the Buddha's teaching that death is inevitable, grief cannot
    undo separation, life and death are one condition, and consolation lies in resignation
    and refuge from the passions of life. The Buddha consoles Ananda over Thariputra's
    death by teaching that distance and death separate loved ones and that lamentation
    brings no help.
  language: English
  quote_policy: quoted
