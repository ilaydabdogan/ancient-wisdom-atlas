  quote: "“All a man's life comes before him at the hour of death”"
  summary: The passage describes a deathbed practice in which an old man reminds a
    sick man of his good deeds, including charity, aid to kin, rescue from drowning,
    and fidelity to his wife. The narrator reflects that such memories make death
    easier, while absence of good deeds would make death terrible. An informant states
    that a person's whole life appears at death, and the narrator summarizes the teaching
    that one's life determines the manner of one's death.
