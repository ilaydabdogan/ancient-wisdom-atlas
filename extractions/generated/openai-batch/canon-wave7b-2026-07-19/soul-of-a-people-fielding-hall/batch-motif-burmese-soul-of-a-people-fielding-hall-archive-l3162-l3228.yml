  summary: The passage describes Burmese Buddhist separation of religious and civil
    authority. It states that religion had nothing to do with government, explains
    that the king only acknowledged the monks’ elected head for practical civil enforcement
    of ecclesiastical decrees, and emphasizes that monks avoided state affairs in
    order to pursue spiritual peace, though they might remonstrate with an oppressive
    governor.
