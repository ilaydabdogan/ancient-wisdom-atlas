  summary: A former servant, newly released from gaol after stealing his master's
    money, returns to the master's veranda and asks to be reinstated. The master hesitates
    and says the theft and imprisonment prevent him from taking the servant back.
    The servant argues that he served six months in gaol, did well there, and that
    the matter should now be over and forgotten.
