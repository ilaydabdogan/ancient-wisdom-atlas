  summary: The passage describes the future Buddha after failure and abandonment by
    his disciples. A narrator reflects that his failures make him a human model for
    followers. He sleeps in a grove of mango, palm, and fig trees, where truth comes
    to him. A young wife, intending to make offerings to the spirit of a great fig-tree,
    sees him and mistakes him for the spirit; she gives him a cup of curdled milk,
    which he accepts.
