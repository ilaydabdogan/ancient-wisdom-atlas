canonical_text:
  quote: This is the great renunciation.
  summary: A prince grows certain that life holds something beyond palace pleasure
    after learning of sickness, aging, death, and fear beyond death. When he hears
    his wife has borne a son, he calls the child a new tie but does not abandon his
    resolve. That night he secretly leaves the palace with his faithful servant Maung
    San and a silent white horse, avoiding waking his wife, child, and guards. He
    seeks deliverance from misery and knowledge of truth leading to the Great Peace.
    The excerpt ends with the narrator noting discussions of this renunciation with
    monks and others.
  language: English
  quote_policy: quoted
