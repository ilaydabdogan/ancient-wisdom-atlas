canonical_text:
  quote: ''
  summary: The passage describes Burmese courtship and elopement customs, including
    girl-initiated wooing, temporary flight into the forest, mediation by relatives
    or confidantes, and eventual family-arranged marriage. It then gives an anecdote
    of the narrator's young Burmese servant and a headman's daughter, who flee into
    the forest and later return after the families arrange work and marriage.
  language: English
  quote_policy: summarized
