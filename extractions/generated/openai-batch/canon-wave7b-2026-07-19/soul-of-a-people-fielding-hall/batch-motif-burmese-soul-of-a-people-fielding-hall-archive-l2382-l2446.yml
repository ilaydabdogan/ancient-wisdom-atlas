canonical_text:
  quote: ''
  summary: A named rebel figure, Maung Yaing, threatens to burn and destroy a town
    if it is not evacuated by a new moon deadline. The English officer dismisses the
    danger, relying on trained troops. At midnight, an attack on the hill fort draws
    the Ghurkas to the breastwork while attackers enter the village by the north gate,
    kill the guard, light torches, and set the village on fire. The passage emphasizes
    the panic, flames, shouting, and delayed realization that the village has been
    lost.
  language: English
