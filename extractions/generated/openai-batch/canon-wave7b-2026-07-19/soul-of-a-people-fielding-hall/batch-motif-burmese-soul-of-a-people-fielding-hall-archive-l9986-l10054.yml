canonical_text:
  quote: ''
  summary: A queen throws herself onto a burning pyre with her shackled brother, embracing
    him as both die in the flames. Days later, reports arise that two large beautiful
    Nats, male and female, appear near a great fig-tree by the landing-place close
    to the former fire. Travelers and children are frightened, harmed, or said to
    disappear. The king orders the tree cut down and its trunk thrown into the river;
    the trunk later strands by another town, where similar portents recur and a governor
    sends a holy monk to investigate.
  language: English
  quote_policy: summarized
