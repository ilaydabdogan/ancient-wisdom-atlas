canonical_text:
  quote: "“Buddhism is a wisdom, a seeking of the light”"
  summary: 'The passage describes Sunday lay Buddhist observance at a village rest-house:
    devotees vow before a monk to spend the day in meditation and holy thought, remain
    quietly through the day, may hear sacred texts read, and do not perform prayer
    or worship in the author’s Christian sense. The author contrasts petitionary prayer
    and praise with Buddhist attention to immutable laws of righteousness, the Buddha
    as finder of light, and devotional acts understood as efforts to understand those
    laws and honor the teacher.'
  language: English
