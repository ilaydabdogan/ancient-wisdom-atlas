canonical_text:
  quote: ''
  summary: The passage describes restrictions on Burmese women's social freedom as
    rules based on experience and decorum. It includes an anecdote in which an English
    officer leaves his wife at an up-country station, instructs his Burmese head-servant
    to keep her safe, and the servant sends away male callers because Burmese custom
    forbids a wife from receiving visitors inside the house during her husband's absence.
    The passage concludes that freedom does not mean absence of rules, but rules grounded
    in common sense and necessity.
  language: English
  quote_policy: summarized
