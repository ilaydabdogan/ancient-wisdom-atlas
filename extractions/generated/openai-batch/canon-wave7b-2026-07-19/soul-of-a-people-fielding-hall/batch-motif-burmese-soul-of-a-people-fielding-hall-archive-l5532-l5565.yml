canonical_text:
  quote: ''
  summary: The passage moves from a note that a woman did not remember the story of
    Ma Pa Da to commentary on women’s prayers. Women are described as praying chiefly
    for love and for the wellbeing of husbands, lovers, and children. A queen is said
    to pray at the palace pagoda for her husband’s fidelity and her children’s life
    and strength. Buddhist monks are quoted as saying women do not understand and
    must often be reborn as men before seeing the light and understanding righteousness.
    The narrator then characterizes women’s religion as love that would risk cosmic
    chaos to save a beloved heart.
