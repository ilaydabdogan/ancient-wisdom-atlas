canonical_text:
  quote: ''
  summary: The passage contrasts Burmese Buddhist monastic religion with surrounding
    popular superstition and with other faiths that promise heavenly powers or visions.
    It describes monks as rejecting miracles, prophecy, and visions; renouncing worldly
    goods without immediate reward; observing poverty, purity, temperance, bodily
    health, study, meditation, careful speech and thought; and participating in a
    dawn alms procession with schoolboys, gong, yellow robes, and begging bowls.
  language: English
  quote_policy: summarized
