  summary: The passage explains Om as a symbol of speech, life, and spirit; links
    meditation on Om with recognition of the identity between the self in man and
    Brahman; contrasts this knowledge with Vedic sacrifices as a means to immortality;
    and discusses ether within and around the heart as a name for Brahman and as the
    origin of all things.
  language: English
