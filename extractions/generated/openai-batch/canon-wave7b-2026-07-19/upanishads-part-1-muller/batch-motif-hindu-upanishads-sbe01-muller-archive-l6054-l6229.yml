canonical_text:
  quote: ''
  summary: The passage presents a series of meditations in which the fivefold or sevenfold
    Saman is mapped onto rain, waters, seasons, animals, senses, speech, and the sun.
    It states benefits for one who knows and meditates in these ways, including rain,
    wealth in waters or animals, success with seasons, food, and conquest of greater
    worlds. The sun meditation assigns phases of the day to parts of the sevenfold
    Saman and to dependent classes of beings. The final excerpt introduces a uniform
    sevenfold Saman said to lead beyond death.
  language: English
  quote_policy: summarized
