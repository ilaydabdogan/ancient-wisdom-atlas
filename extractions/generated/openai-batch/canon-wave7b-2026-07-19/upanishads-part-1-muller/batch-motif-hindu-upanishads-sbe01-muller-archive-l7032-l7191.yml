canonical_text:
  quote: That is the ether within the heart.
  summary: The passage identifies Brahman with the ether outside, inside, and in the
    heart; describes five heart-gates linked with breaths, senses, directions, and
    deities; teaches a light above heaven that is also within humans; states that
    all is Brahman and that the self within the heart is Brahman; and presents an
    imperishable cosmic chest containing all things, with Vayu as child of the quarters.
  language: English
  quote_policy: quoted
