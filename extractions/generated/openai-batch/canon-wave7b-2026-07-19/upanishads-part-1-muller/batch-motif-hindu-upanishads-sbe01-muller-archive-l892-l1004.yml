canonical_text:
  quote: ''
  summary: The passage defines Sat/Satya as the true or real, the sole beginningless
    reality from which creation proceeds and to which it returns. It discusses why
    Atman/Self should not be translated simply as soul, mind, or spirit; explains
    instruction to know the Self rather than the empirical self; and summarizes Uddalaka’s
    teaching to S'vetaketu that Sat produced fire, water, and earth and entered them
    through a living self/reflection.
  language: English
  quote_policy: summarized
