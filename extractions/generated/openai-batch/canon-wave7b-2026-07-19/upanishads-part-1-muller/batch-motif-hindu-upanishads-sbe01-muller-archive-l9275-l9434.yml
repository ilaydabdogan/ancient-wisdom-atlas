  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After Svetaketu eats, he knows by heart whatever his father asks; the father
    says the remaining part was lighted up with food, allowing him to remember the
    Vedas.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Uddalaka says that when a man sleeps, he becomes united with the True and
