- id: obs:2
  text: 'Eaten earth or food is said to become threefold: the grossest portion becomes
    feces, the middle portion flesh, and the subtlest portion mind.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Drunk water is said to become threefold: the grossest portion becomes water,
    the middle portion blood, and the subtlest portion breath.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'Consumed fire is said to become threefold: the grossest portion becomes bone,
    the middle portion marrow, and the subtlest portion speech.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The father states that mind comes of earth, breath of water, and speech of
    fire; the son asks for further instruction, and the father agrees.
