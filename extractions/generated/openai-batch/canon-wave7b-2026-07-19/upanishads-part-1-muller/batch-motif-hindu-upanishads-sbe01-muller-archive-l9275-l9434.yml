canonical_text:
  quote: Mind, my son, comes from food, breath from water, speech from fire.
  summary: The passage presents a father teaching his son that food, water, and fire
    become bodily and mental functions in threefold ways. It uses curds and butter
    as an analogy for subtle essence rising upward, tests the teaching through a fifteen-day
    fast and renewed memory after eating, and then explains sleep as union with the
    True or one's own Self, with the mind settling on breath like a tied bird returning
    to its fastening. It also explains hunger through water digesting food and describes
    the body as an offshoot rooted in food.
  language: English
  quote_policy: quoted
literal_observations:
