canonical_text:
  quote: ''
  summary: The passage describes meditation on the udgitha, Om, as breath in the mouth
    and then with reference to divine powers, especially the sun. Named figures are
    associated with meditating on Om as breath; Vaka Dalbhya, as Udgatr priest, obtains
    wishes by singing. The passage then identifies breath and sun, explains vyana
    as the combination of up-breath and down-breath connected to speech and chant,
    and maps the syllables of udgitha onto breath, speech, food, cosmic regions, deities/elements,
    and the Vedas.
  language: English
  quote_policy: summarized
