canonical_text:
  quote: ''
  summary: The passage first gives a teaching about a cosmic eater, food, Vayu, Prana,
    tenfold correspondences, and the Krita cast. It then narrates Satyakama Jabala's
    request to become a religious student, his mother's admission that she does not
    know his family, Gautama's acceptance of him because he speaks truthfully, and
    Satyakama's service tending cows until they become a thousand. A bull teaches
    him one fourfold foot of Brahman as the four directions; Agni teaches another
    as earth, sky, heaven, and ocean; a Hamsa then appears and begins to promise another
    teaching.
  language: English
  quote_policy: summarized
