canonical_text:
  quote: "“It is the True. It is the Self, and thou, O Śvetaketu, art it.”"
  summary: 'The passage presents a teaching in which a father instructs his son through
    cosmological and natural analogies: body and elements are traced to their root
    in the True; at death speech, mind, breath, and heat merge upward into the Highest
    Being; honey, rivers, and a living tree are used to explain merging into the True,
    recurrence of creatures, and the undying living Self.'
  language: English
  quote_policy: quoted
