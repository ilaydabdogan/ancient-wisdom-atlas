canonical_text:
  quote: ''
  summary: The passage lists three branches of religious law and contrasts blessed
    worlds with immortality through firm grounding in Brahman. It describes Prajapati
    brooding over worlds, Vedic knowledge, syllables, and Om, with Om presented as
    the support of all speech. It then gives sacrificial procedures for morning, noon,
    and third oblations, each addressed to deity groups and connected with opening
    the doors of earth, sky, or heaven for the sacrificer after life. The final section
    presents a solar honey-hive correspondence in which Vedic verses, sacrifice, water,
    and solar light are linked.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Three branches of the law are named: sacrifice, study, and charity; austerity;
    and dwelling as a Brahmacharin in a tutor''s house while mortifying the body.
    These obtain blessed worlds, while the person firmly grounded in Brahman obtains
    immortality.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Prajapati broods on the worlds, then on the threefold knowledge, then on the
    three syllables; from this sequence Om issues, and all speech is said to be attached
    to Om.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The morning oblation is assigned to the Vasus, the noon oblation to the Rudras,
    and the third oblation to the Adityas and the Visve Devas.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says that only one who knows should perform the sacrifice, and
    later says that the one who knows this knows the full measure of the sacrifice.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:5
  text: For each oblation, the sacrificer sits behind a named altar, looks north,
    and sings a Saman addressed to the relevant deities.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
- id: obs:6
  text: In each oblation, the sacrificer asks for the door of a world to be opened,
    asks that world to be obtained for him, says he will go there when life is over,
    commands the bolt to be cast back, and then rises.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
- id: obs:7
  text: The Vasus, Rudras, Adityas, and Visve Devas are each said to fulfill the oblation
    associated with them for the sacrificer.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
- id: obs:8
  text: The sun is described as the honey of the Devas; heaven is described as a cross-beam,
    sky as a hive, bright vapours as bee eggs, eastern rays as honey-cells, Rik verses
    as bees, the Rig-veda sacrifice as a flower, and water from libations as nectar.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The bee-like Rik verses brood over the Rig-veda sacrifice, and an essence
    of fame, glory of countenance, vigour, strength, and health flows toward the sun
    and becomes the red light of the rising sun.
  category: sequence
  evidence_refs:
  - ev:8
