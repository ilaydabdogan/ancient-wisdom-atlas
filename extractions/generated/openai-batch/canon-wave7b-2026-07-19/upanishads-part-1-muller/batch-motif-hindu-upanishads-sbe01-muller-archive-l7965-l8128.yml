canonical_text:
  quote: ''
  summary: 'The passage continues Upakosala''s instruction: the fires and then his
    teacher teach him about knowledge, the Self, and Brahman. The teacher identifies
    the person seen in the eye with the immortal, fearless Self/Brahman, describes
    blessings for the knower, and gives an after-death path through luminous stations
    to Brahman without return. The passage then explains sacrifice as Vayu with two
    ways, mind and speech, and describes Prajapati extracting essences from worlds,
    deities, and Vedic knowledge into sacred utterances.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fires tell Upakosala that they have given their knowledge and the knowledge
    of the Self, but that the teacher will tell him the way to another life.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the teacher returns, he says Upakosala's face shines like that of one
    who knows Brahman and asks who has taught him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Upakosala points to the fires, repeats some of what they told him, and the
    teacher says the fires taught him about the worlds.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The teacher says that, as water does not cling to a lotus leaf, no evil deed
    clings to one who knows the teaching he is about to give.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The teacher identifies the person seen in the eye as the Self, the immortal,
    the fearless, and Brahman.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The teacher says that melted butter or water dropped on the person in the
    eye runs away on both sides.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The person in the eye is given the names Samyadvama, Vamani, and Bhamani,
    each associated with blessings or shining in all worlds for the knower.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'After death, the knower goes through a sequence of stations: light, day,
    the bright half of the moon, the six northern months, the year, the sun, the moon,
    and lightning.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the station of lightning there is a person not human who leads them to
    Brahman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The route is called the path of the Devas and the path that leads to Brahman;
    those who proceed on it do not return to human life.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Vayu, the air that moves along and purifies everything, is identified as the
    sacrifice.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The sacrifice has two ways, one by mind and one by speech; the Brahman priest
