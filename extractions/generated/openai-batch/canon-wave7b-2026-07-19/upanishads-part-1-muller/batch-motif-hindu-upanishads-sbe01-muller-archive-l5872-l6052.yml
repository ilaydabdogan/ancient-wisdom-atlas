  text: The answer identifies breath as the deity of the prastava and says all beings
    merge into breath and arise from breath.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Udgatr asks which deity belongs to the udgitha, after receiving the same
    warning about singing without knowledge.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The answer identifies the sun as the deity of the udgitha and says beings
    praise the sun when it stands on high.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Pratihartri asks which deity belongs to the pratihara, after receiving
    the same warning about singing without knowledge.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The answer identifies food as the deity of the pratihara and says beings live
    when they partake of food.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Vaka Dalbhya, also called Glava Maitreya, goes out to repeat the Veda in a
    quiet place.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
