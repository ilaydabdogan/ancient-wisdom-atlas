canonical_text:
  quote: ''
  summary: 'The passage identifies deities or cosmic referents for parts of Saman
    chant and ritual performance: breath for the prastava, sun for the udgitha, and
    food for the pratihara. It narrates an episode in which dogs imitate a priestly
    chant-procession to obtain food. It then maps stobha syllables and fivefold Saman
    elements onto worlds, deities, breath, food, speech, and the Undefinable, and
    states benefits for one who knows or meditates on these correspondences.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Prastotr asks which deity belongs to the prastava, after being warned
    that singing without knowledge would make his head fall off.
