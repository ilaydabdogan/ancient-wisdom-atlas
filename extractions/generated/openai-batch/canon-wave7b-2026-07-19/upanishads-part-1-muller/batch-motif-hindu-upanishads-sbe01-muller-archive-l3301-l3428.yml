canonical_text:
  quote: ''
  summary: The editor recounts how his interest in Sanskrit literature was first awakened
    by the Upanishads, then surveys their literary position within Vedic literature.
    He describes early Upanishadic doctrines as reaching back to the Mantra period,
    notes Upanishadic materials in Saṃhitās, Brāhmaṇas, and Āraṇyakas, distinguishes
    Śruti from Smṛti, and discusses the uncertain dating of later Upanishads, including
    works associated with the Atharva-veda and examples explained or quoted by later
    authorities.
  language: English
  quote_policy: summarized
