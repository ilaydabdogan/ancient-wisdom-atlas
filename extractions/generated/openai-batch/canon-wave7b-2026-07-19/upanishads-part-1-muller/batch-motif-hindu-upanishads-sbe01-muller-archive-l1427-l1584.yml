  summary: Max Müller outlines a planned multi-volume Sacred Books of the East translation
    series, naming intended works from Brahmanical, Buddhist, Zoroastrian, Chinese,
    Taoist, and Islamic traditions, listing collaborating scholars, and giving a provisional
    catalogue of selected translations.
  language: English
