literal_observations:
- id: obs:1
  text: The passage announces a proposed series of twenty-four volumes, with publication
    expected to extend over about eight years.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For Brahman sacred books, the passage proposes translations including Rig-veda
    hymns, possible additional Vedic Saṃhitā or Brāhmaṇa material, principal Upanishads,
    the Bhagavad-gita, law-books, and at least one Purana; it also mentions Jain and
    Sikh works as desirable but not presently accommodated.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Buddhist sacred books will be translated chiefly from
    Southern Pali and Northern Sanskrit collections, naming examples such as Digha
    Nikaya sutras, Vinaya-pitaka, Dhammapada, Divyavadana, and Lalita-vistara.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that Zoroastrian books occupy a smaller compass but require
    fuller notes and commentaries for an intelligible and useful translation.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage identifies several Confucian or Chinese authoritative books and
    associated works for inclusion, including Shu King, Shih King, Yi King, Li Ki,
    Hsiao King, Chung Yung, Ta Hsio, Lun Yu, and Mang-jze.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says that for Lao-jze's system a translation of the Tao-teh King
    with commentaries is required, with possibly another authoritative work illustrating
    its principles.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that for Islam the essential item is a trustworthy translation
    of the Koran.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Müller says he will try to divide the twenty-four volumes as equally as possible
