canonical_text:
  quote: ''
  summary: The passage presents teachings on feet of Brahman through luminous, bodily,
    elemental, and celestial correspondences. Satyakama receives instruction from
    a diver-bird, returns to his teacher, and is taught the same knowledge. A second
    narrative begins with Upakosala Kamalayana, a student who has tended Satyakama
    Jabala's fires for twelve years; after the teacher leaves without teaching him
    and the student refuses food in sorrow, the fires themselves teach him about Brahman
    and their forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A teaching identifies fire, the sun, the moon, and lightning as four quarters
    of a foot of Brahman called Jyotishmat, meaning full of light.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: One who knows and meditates on the Jyotishmat foot of Brahman is said to become
    full of light in this world and to conquer worlds full of light.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A diver-bird is announced as the next instructor of another foot of Brahman
    for Satyakama.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Satyakama drives the cows onward, lights a fire in the evening, pens the cows,
    lays wood on the fire, and sits behind the fire facing east.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The diver-bird flies near, calls Satyakama, and declares a foot of Brahman.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The diver-bird identifies breath, the eye, the ear, and the mind as four quarters
    of a foot of Brahman called Ayatanavat, having a home.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: One who knows and meditates on the Ayatanavat foot of Brahman is said to become
    possessed of a home in this world and to conquer worlds that offer a home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
