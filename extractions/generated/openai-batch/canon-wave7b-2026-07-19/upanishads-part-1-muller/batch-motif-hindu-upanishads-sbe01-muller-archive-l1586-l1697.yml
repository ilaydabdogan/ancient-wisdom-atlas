canonical_text:
  quote: ''
  summary: The passage explains the transliteration system used by the translators
    of the Sacred Books of the East, linking it to Müller’s Missionary Alphabet and
    comparing it with Lepsius’s Standard Alphabet. It lists practical principles for
    representing foreign letters with Roman types, including consistency, avoidance
    of special fonts where possible, classification of sounds, and separation of transliteration
    from pronunciation.
  language: English
  quote_policy: summarized
