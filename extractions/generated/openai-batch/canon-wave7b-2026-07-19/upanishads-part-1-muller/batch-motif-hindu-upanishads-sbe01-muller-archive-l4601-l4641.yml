canonical_text:
  quote: ''
  summary: 'The passage first notes scholarly information about Mahidasa Aitareya,
    then recounts a later legend reported by Sayana: a Rishi with many wives favored
    the sons of wives other than Itara, excluding Itara''s son Mahidasa in a sacrificial
    hall. Itara prayed to her tutelary Earth goddess, who appeared, placed Mahidasa
    on a throne, and granted him knowledge of Brahmana texts. The editor then cautions
    that little value should be attached to the legend and describes such legends
    as easily invented by Hindu theologians.'
  language: English
  quote_policy: summarized
