canonical_text:
  quote: ''
  summary: The passage moves from a triadic refuge formula and verses about reaching
    higher light to instructions for meditating on mind, ether, and the sun as Brahman.
    It maps Brahman’s four quarters onto bodily faculties and divine powers, then
    gives a cosmogony in which the existent grows into an egg that splits into silver
    and golden halves, forming earth, sky, mountains, clouds, rivers, and sea. Aditya,
    the sun, is born from the egg; beings and desired things arise with him, and the
    knower who meditates on the sun as Brahman receives pleasant shouts.
  language: English
  quote_policy: summarized
