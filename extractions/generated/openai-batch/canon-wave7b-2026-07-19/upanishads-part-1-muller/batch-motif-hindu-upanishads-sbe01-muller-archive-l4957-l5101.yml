canonical_text:
  quote: ''
  summary: The passage introduces features of the Isavasyopanishad and then begins
    the Chandogya-Upanishad with instruction to meditate on Om as the udgitha. It
    presents a hierarchy of essences culminating in Om, identifies speech with Rik,
    breath with Saman, and Om with udgitha, describes speech and breath as a couple
    joined in Om, and explains Om’s role in permission, desire fulfillment, and Vedic
    sacrifice. It closes by distinguishing sacrifice performed with knowledge, faith,
    and the Upanishad from sacrifice performed without knowledge.
  language: English
  quote_policy: summarized
