canonical_text:
  quote: ''
  summary: The passage explains correspondences between Rik and Saman across cosmic
    realms and the body, describes a golden person in the sun and a corresponding
    person in the eye, states ritual and salvific effects of knowing and singing the
    Saman, and begins a dialogue among three men on the origin of the Saman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One who knows the udgitha as the pranava and the pranava as the udgitha can
    rectify a mistake made by the Udgatri priest while performing the udgitha.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Rik and Saman are paired with cosmic elements: earth/fire, sky/air, heaven/sun,
    and stars/moon; in each pairing the Saman rests on the Rik.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The white light of the sun is identified with Rik, and the blue exceeding
    darkness in the sun is identified with Saman.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A golden person is said to be seen within the sun, with golden beard, golden
    hair, golden body, and eyes like blue lotuses.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The golden person in the sun is named ut because he has risen above all evil;
    one who knows this also rises above all evil.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Rik and Saman are described as the joints of the golden person, who is identified
    with the udgitha and as lord of worlds beyond the sun and of the wishes of the
    Devas.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: With reference to the body, Rik and Saman are paired as speech/breath, eye/self,
    ear/mind, and the white light of the eye/blue exceeding darkness.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A person seen in the eye is identified as Rik, Saman, Uktha, Yajus, and Brahman.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The person in the eye has the same form, joints, and name as the person in
    the sun.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The person in the eye is lord of the worlds beneath and of the wishes of men;
    those who sing to the vina are said to sing him and obtain wealth from him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: One who knowingly sings a Saman sings to both the person in the sun and the
    person in the eye and obtains worlds and wishes through them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Three men well versed in udgitha sit for a discussion; in the dialogue, the
