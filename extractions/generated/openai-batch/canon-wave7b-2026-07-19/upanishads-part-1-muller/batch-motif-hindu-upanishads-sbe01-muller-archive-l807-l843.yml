  summary: The passage discusses Sanskrit lexicology and the range of meanings assigned
    to atman. It rejects several proposed meanings, notes common translations such
    as soul, mind, or spirit, and explains the translator’s preference for self and
    Self because of their reflective effect on English readers. It also compares English
    philosophical idiom with German terms associated with Fichte.
