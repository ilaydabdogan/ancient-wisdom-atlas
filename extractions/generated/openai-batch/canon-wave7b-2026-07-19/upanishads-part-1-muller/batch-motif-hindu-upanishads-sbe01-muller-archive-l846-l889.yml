  quote: ''
  summary: The passage contrasts the ego or Aham with the Atman, describes the individual
    self as a limited or phenomenal modification of the Highest Self, and presents
    knowledge of the Atman as identity with the Atman, leading after death to freedom
    from new births or immortality. It also describes the Highest Self as the goal
    of philosophical effort and the root or starting-point of phenomenal existence,
    identified with Brahman and Sat.
