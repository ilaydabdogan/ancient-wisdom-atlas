canonical_text:
  quote: '"That which is the subtile essence, in it all that exists has its self.
    It is the True. It is the Self..."'
  summary: The passage includes a commentator's note on trees, sap, and the living
    Self, followed by father-son instruction using a Nyagrodha fruit and seed, salt
    dissolved in water, and the beginning of an analogy about a person led away with
    covered eyes. The father uses these examples to teach that an unseen subtle essence,
    the True and the Self, is present in all that exists and in the body.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The commentator states that, according to the Veda, trees are conscious, while
    Buddhists and followers of Kawada hold trees to be unconscious.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The commentator says trees live because their sap runs and dries up, and says
    the living Self pervades a tree as it pervades a human being.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: When an accident happens to a branch, the living Self is said to draw away
    from that branch, after which the branch withers; when the living Self leaves
    the whole tree, the tree dies, but the living Self does not die.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The commentator adds examples about remembering unfinished work after deep
    sleep and about newborn creatures taking the breast and showing terror as signs
    of continuity from a former state.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father tells the son to fetch and break a fruit of the Nyagrodha tree;
    the son sees almost infinitesimal seeds, breaks one, and sees nothing inside.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The father says that the unseen subtle essence in the seed is the essence
    from which the great Nyagrodha tree exists.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The father says that all that exists has its self in the subtle essence, calls
