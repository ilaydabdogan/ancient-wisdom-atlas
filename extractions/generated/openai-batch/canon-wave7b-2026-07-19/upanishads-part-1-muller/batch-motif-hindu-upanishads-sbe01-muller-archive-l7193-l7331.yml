canonical_text:
  quote: Man is sacrifice.
  summary: The passage gives Upanishadic correspondences between utterances, deities,
    Vedas, human life-stages, bodily experiences, virtues, birth, death, and sacrificial
    rites. It presents prayers to the Pranas and deity-groups for recovery and extension
    of life, names Mahidasa Aitareya as an exemplar of this knowledge, and states
    that Ghora Angirasa transmitted this teaching to Krishna, son of Devaki.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The utterance Bhuvah is explained as turning to Agni, Vayu, and Aditya; the
    utterance Svah is explained as turning to the Rig-veda, Yajur-veda, and Sama-veda.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man is identified with sacrifice, and his first twenty-four years are identified
    with the morning libation, Gayatri, the Vasus, and the Pranas.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: If something ails a man in the early age, he is instructed to address the
    Pranas and Vasus, asking them to extend the morning libation to the midday libation;
    the text says he recovers and becomes whole.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The next forty-four years are identified with the midday libation, Trishtubh,
    the Rudras, and the Pranas.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: If something ails a man in the second age, he is instructed to address the
    Pranas and Rudras, asking them to extend the midday libation to the third libation;
    the text says he recovers and becomes whole.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The next forty-eight years are identified with the third libation, Jagati,
    the Adityas, and the Pranas.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: If something ails a man in the third age, he is instructed to address the
    Pranas and Adityas, asking them to extend the third libation to the full age;
    the text says he recovers and becomes whole.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mahidasa Aitareya, who knew this teaching, addressed a disease and said he
