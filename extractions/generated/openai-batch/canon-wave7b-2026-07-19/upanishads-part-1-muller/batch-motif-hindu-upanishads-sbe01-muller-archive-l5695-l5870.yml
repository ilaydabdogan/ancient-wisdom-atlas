canonical_text:
  quote: ''
  summary: 'The passage presents teachings on the Saman and udgitha: interlocutors
    challenge inadequate answers about the Saman''s cosmic foundation, culminating
    in ether as the source and rest of beings and in the udgitha as Om/Brahman, greater
    than great and without end. It then narrates Ushasti living in poverty after destruction
    among the Kurus, accepting leftover beans for survival while refusing leftover
    drink, and later asserting authority at a sacrifice by warning priests not to
    sing without knowing the deities of their chant portions. The sacrificer recognizes
    Ushasti and grants him priestly offices with equal payment.'
  language: English
  quote_policy: summarized
