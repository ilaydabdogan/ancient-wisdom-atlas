  quote: ''
  summary: The passage interprets parts of the Saman chant through syllable counts
    and through correspondences with pranas, fire, generation, the sun, rain, seasons,
    worlds, and animals. It says that the twenty-first syllabic measure reaches the
    sun/death, while the twenty-second conquers what is beyond the sun, described
    as blessedness and freedom from grief. Repeated formulas state that one who knows
    these correspondences gains long life, children, cattle, fame, and specific rules
    of conduct.
