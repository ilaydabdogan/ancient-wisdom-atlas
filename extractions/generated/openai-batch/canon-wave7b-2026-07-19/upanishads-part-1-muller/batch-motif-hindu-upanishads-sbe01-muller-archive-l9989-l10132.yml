canonical_text:
  quote: ''
  summary: 'A teacher leads an interlocutor through a graded teaching: mind is said
    to be better than speech; will is better than mind; consideration is better than
    will; reflection is better than consideration. Each principle is to be meditated
    on as Brahman, with promised mastery or acquisition of corresponding worlds. The
    passage also links will and consideration to speech, name, sacred hymns, and sacrifices,
    and describes reflection analogically in earth, sky, heaven, water, mountains,
    gods, and humans.'
  language: English
  quote_policy: summarized
