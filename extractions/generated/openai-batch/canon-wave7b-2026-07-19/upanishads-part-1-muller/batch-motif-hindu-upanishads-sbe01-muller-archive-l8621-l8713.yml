  quote: ''
  summary: The passage describes a postmortem return through mist, cloud, rain, plants,
    food, and procreation; distinguishes good and evil rebirths and a third place
    for small creatures; and includes commentary on lunar reward, the two paths, and
    knowledge determining afterlife routes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A returning being becomes mist, then cloud, then rain, and is then born as
    rice, corn, herbs, trees, sesamum, and beans.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says escape from the plant-food state is very difficult, because
    when persons eat the food and beget offspring, the returning being becomes like
    them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The commentary explains that those who performed sacrifices are not literally
    eaten by the Devas; rather, they are described as the delight of the Devas and
    rejoice with them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The commentary says the body for rejoicing in the moon becomes watery; after
    death and burning, water rises with smoke and carries the person to the moon.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the fruits of good works are consumed, the person must return to a new
    round of existences.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:7
- id: obs:6
  text: Good conduct leads quickly to a good birth, while evil conduct leads quickly
    to an evil birth.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Small creatures such as flies and worms are said to be on neither of the two
    ways; their condition is called a third place, and they are characterized by living
    and dying.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A note summarizes the answered questions as including destinations after death,
    return either to Brahman or to earth, divergence of the paths of the Devas and
    fathers, and the reason the other world never becomes full.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: A note distinguishes the path of the Devas for knowers of the secret doctrine
    and some forest renouncers, the path of the fathers for ordinary sacrificial householders,
    and immediate Brahman for those who know the highest unconditioned Brahman.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A note reports a debate about rebirth after the moon and says new existence
    is required because other works remain to be enjoyed or expiated.
  category: speech
  evidence_refs:
  - ev:7
