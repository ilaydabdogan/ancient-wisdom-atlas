canonical_text:
  quote: ''
  summary: The passage gives ritual instructions for repairing an injured sacrifice
    by offering libations into specific fires with specific sacrificial utterances.
    It compares this repair to binding materials together and says the sacrifice is
    healed when a knowing Brahman priest is present. The next section identifies breath,
    speech, eye, ear, and mind with ranked qualities, then narrates that the five
    senses quarrel over which is best, consult Prajapati, and test superiority by
    the departure of speech, eye, and ear for a year each.
  language: English
  quote_policy: summarized
