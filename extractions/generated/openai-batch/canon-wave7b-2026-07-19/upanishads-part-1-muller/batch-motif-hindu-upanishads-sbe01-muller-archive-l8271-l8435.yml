canonical_text:
  quote: ''
  summary: The passage presents a dialogue in which mind and breath depart in turn;
    breath is acknowledged as chief among the faculties, associated with food and
    water, and invoked in a rite for greatness. A dream of a woman is given as a sign
    of sacrificial success. The next story opens with Svetaketu being questioned by
    Pravahana about post-mortem destination, return, the paths of Devas and fathers,
    and the fifth libation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mind departs, remains absent for a year, returns, asks how the others
    lived without it, and then goes back.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The reply to the mind says that life continued like children whose mind is
    not yet formed, while breathing, speaking, seeing, and hearing continued.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: When breath is about to depart, it tears up the other senses, compared to
    a horse tearing up tether pegs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The other senses ask breath not to depart and call it the best among them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tongue, eye, ear, and mind each state that their own named quality also belongs
    to breath.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage says people call the faculties breaths, because breath is all
    these.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Breath asks what its food and dress shall be; the answers are all available
    food, even to dogs and birds, and water as dress.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Wise people are said to surround food before and after with waters when eating.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Satyakama Gahsla tells GoiTuti Vaiyaghrapadya that if this teaching were told
    to a dry stick, branches and leaves would grow from it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: A man wishing for greatness is instructed to perform Diksha on the new moon,
    prepare a mash on the full moon night, and offer ghee into fire with Svaha formulas.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The ritual performer recites to Praṇa/Ama as the oldest, best, king, and sovereign,
    and asks to become all this.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The ritual performer eats and drinks with a Rik verse, cleanses the vessel,
    sits behind the fire silently, and is told that seeing a woman in a dream means
    the sacrifice has succeeded.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Svetaketu Aruneya goes to an assembly of the Panchalas, where Pravahana Jaivali
    asks whether his father instructed him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Pravahana asks Svetaketu about where men go from here, how they return, where
    the paths of Devas and fathers diverge, why that world never becomes full, and
    why water is called Man in the fifth libation; Svetaketu answers no to the questions
    shown.
  category: speech
  evidence_refs:
  - ev:7
