canonical_text:
  quote: ''
  summary: The prefatory passage argues that sacred books and ancient religious teachers
    should not be judged merely from outside. It says readers and translators must
    temporarily enter the perspectives of traditions such as Brahman, Buddhist, and
    Taoist communities. It presents sacred books as opening a broader view of the
    human race, stresses shared human capacities across traditions, and rejects the
    idea that other religious peoples were forsaken by God while the author’s own
    group was uniquely chosen.
  language: English
  quote_policy: summarized
