  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'Living things are classified as having three origins: from an egg, from a
    living being, and from a germ.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Being enters the three beings, identified as fire, water, and earth, with
    the living self and reveals names and forms; each of the three is made tripartite.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The red, white, and black colours in burning fire, sun, moon, and lightning
    are assigned respectively to fire, water, and earth; the named objects are said
    to vanish as mere varieties or names from speech.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Old householders and theologians who knew this doctrine are said to have claimed
    that nothing could be mentioned to them that they had not heard, perceived, or
    known, because they knew all from the three colours or forms.
  category: speech
  evidence_refs:
  - ev:10
