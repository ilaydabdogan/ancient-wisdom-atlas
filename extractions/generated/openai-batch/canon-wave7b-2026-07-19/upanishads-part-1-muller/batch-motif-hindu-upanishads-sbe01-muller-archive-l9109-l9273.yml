canonical_text:
  quote: only that which is, was in the beginning, one only, without a second.
  summary: A father teaches his son that names and forms are secondary to underlying
    reality. He explains that Being alone existed at first, produced fire, water,
    and earth/food, entered them with the living self, and made visible things analyzable
    into the three elemental colours red, white, and black.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage uses gold and iron examples to state that knowing the material
    substance allows all objects made from it to be known; differences are described
    as names arising from speech.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The son says his former teachers did not know the instruction and asks his
    father to teach it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The father states that, in the beginning, only that which is existed, one
    without a second, and he rejects the idea that being could be born from non-being.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: That which is, or Being, thinks that it may become many and grow forth, and
    it sends forth fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Fire thinks that it may become many and grow forth, and it sends forth water;
    the passage relates bodily heat and perspiration to water being produced from
    fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Water thinks that it may become many and grow forth, and it sends forth earth
