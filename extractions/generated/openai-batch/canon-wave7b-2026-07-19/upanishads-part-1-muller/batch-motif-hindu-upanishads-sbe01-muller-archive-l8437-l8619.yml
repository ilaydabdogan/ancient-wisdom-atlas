canonical_text:
  quote: ''
  summary: 'A boy reports to his father that he could not answer five questions posed
    by a royal interlocutor. Gautama goes to the king and asks for the teaching. The
    king says the knowledge had belonged to the Kshatra class and explains a sequence
    of cosmic altars and oblations: heaven, rain, earth, man, and woman produce Soma,
    rain, food, seed, and the germ. The passage then describes birth, death, the funeral
    fire, the path of the Devas to Brahman, and a second path through smoke, night,
    the fathers, and the moon, followed by return when works are exhausted.'
  language: English
  quote_policy: summarized
