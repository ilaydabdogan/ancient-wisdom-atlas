  quote: ''
  summary: A preface passage rejects a prior dismissal of publishing questionable
    religious texts. It argues that sacred codes associated with Zoroaster or other
    founders may appear absurd but should still be published, translated, and examined
    as ancient documents. It names the Avesta, Veda, and Tripi/aka as old and genuine
    texts that formed the basis of religious belief for millions, and says historians
    and philosophers should study how such books arose and influenced people who may
    be regarded as patterns of wisdom, virtue, and taste.
