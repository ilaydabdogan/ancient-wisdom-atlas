canonical_text:
  quote: ''
  summary: The passage discusses the hazards of transmigration through rain, food,
    animals, seed, and birth; distinguishes forms assumed as punishment from unconscious
    descent through food; states the purifying result of knowing the five fires; and
    narrates how five householders seek instruction on the Vaiśvānara Self from Uddalaka
    and then from King Asvapati, who begins by teaching Aupamanyava that heaven is
    only the head of that Self.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the transmigration account, rain may fructify the earth and pass into herbs,
    trees, rice, corn, and beans, or fall into rivers and the sea, be swallowed by
    fish and sea monsters, return through clouds, fall on desert or stony land, and
    be swallowed by snakes, deer, or other animals.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that rain may dry up or be absorbed by bodies that cannot
    be eaten; if absorbed by food and eaten by children or men who have renounced
    marriage, it may lose the chance of a new birth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that many chances must be met before a new birth as a Brahmana,
    Kshatriya, or Vaijya can be secured, including the being in whom food becomes
    seed and the mother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Śaṅkara is reported as distinguishing beings who assume rice, corn, and similar
    forms as punishment for evil deeds until those results are exhausted, after which
    they assume a new body according to their work.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Śaṅkara is reported as saying that punished forms have consciousness and dream-like
    impressions, whereas those descending from the moon through rice and corn have
    no consciousness in descent; ascent to the moon is compared to conscious climbing
    of a tree, and descent to falling from a tree.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The translated passage states that one who knows the five fires is not defiled
    by sin even when associating with listed sinners, is pure and clean, and obtains
    the world of the blessed.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Five named great householders and great theologians meet and discuss the question,
    “What is our Self, and what is Brahman?”
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The five seekers decide that Uddalaka Arwii knows the Self called Vaiśvānara
    and go to him; Uddalaka decides he cannot tell them all and recommends A^-vapatl
    Kaikeya.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: When the seekers arrive, the king orders presents for each, describes his
    kingdom as lacking thieves, misers, drunkards, persons without household altars,
    ignorant persons, and adulterers, and says he is going to perform a sacrifice.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The visitors state that every man should say why he comes, and they ask the
    king to tell them the Vaiśvānara Self that he knows.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: On the next morning the visitors approach the king carrying fuel in their
    hands like students, and he speaks to them without first demanding preparatory
    rites.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The king asks Aupamanyava whom he meditates on as the Self, and Aupamanyava
    answers, “Heaven only.”
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The king identifies Aupamanyava’s meditation as the Vaiśvānara Self called
    Sutejas, says it is only the head of the Self, and says Aupamanyava’s head would
    have fallen in discussion if he had not come to him.
  category: speech
  evidence_refs:
  - ev:8
