canonical_text:
  quote: ''
  summary: The passage narrates how the generous king Canai^ruti Pautrayana overhears
    night-flying flamingoes praise Raikva with the car as possessing superior knowledge.
    The king sends his door-keeper to find Raikva, who is discovered lying under a
    car. Canai^ruti offers cattle, ornaments, a carriage, later his daughter or wife
    and a village, and asks for instruction. Raikva teaches that air is the end into
    which fire, sun, moon, and water go, and that breath is the bodily counterpart
    into which speech, sight, hearing, and mind go during sleep. A later episode begins
    with a religious student begging food from Saunaka Kapeya and Abhipratarin Kakshaseni,
    receiving nothing, and uttering a cryptic saying about one god who swallowed four
    great ones.
  language: English with Sanskrit names and transliterated terms
  quote_policy: summarized
