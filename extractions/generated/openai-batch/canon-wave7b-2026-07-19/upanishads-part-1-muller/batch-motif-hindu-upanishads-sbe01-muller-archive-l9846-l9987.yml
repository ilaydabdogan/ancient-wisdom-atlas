canonical_text:
  quote: ''
  summary: 'The passage contrasts the fate of one who knows the Self with one who
    does not, using a heated-hatchet ordeal as an illustration of truth and falsehood.
    It then begins a dialogue in which Narada approaches Sanatkumara for instruction,
    lists his knowledge of scriptures and sciences, admits that he does not know the
    Self and is in grief, and receives the first stages of a graded teaching: all
    his learning is name, name is to be meditated on as Brahman, and speech is better
    than name because speech makes knowledge and distinctions known.'
  language: English
  quote_policy: summarized
