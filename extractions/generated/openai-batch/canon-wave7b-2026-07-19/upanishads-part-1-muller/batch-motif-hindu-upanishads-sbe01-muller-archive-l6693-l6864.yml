canonical_text:
  quote: ''
  summary: 'The passage presents parts of the Chandogya Upanishad''s solar honey teaching:
    rays of the sun are described as honeycells; Vedic verses or secret doctrines
    act as bees; sacrifices, Itihasa-purana, or Brahman/Om are flowers; water is nectar.
    The resulting essence flows toward the sun and appears as solar colors. Deity
    groups live on these nectars by seeing them, and a knower of the nectar becomes
    associated with those deity groups.'
  language: English
  quote_policy: summarized
