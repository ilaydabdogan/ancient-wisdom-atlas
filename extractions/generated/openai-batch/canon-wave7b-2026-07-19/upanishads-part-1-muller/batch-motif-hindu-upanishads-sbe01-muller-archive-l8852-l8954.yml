canonical_text:
  quote: ''
  summary: 'A venerable king questions several interlocutors about what they meditate
    on as the Self. Each names a single cosmic element or domain: sun, air, ether,
    water, or earth. The king identifies each as a form or part of the Vaiśvānara
    Self, connects each meditation with worldly benefits, warns that each is only
    a partial aspect of the Self, and finally contrasts knowing the Self as many with
    worshipping the Vaiśvānara Self as identical with oneself.'
  language: English
  quote_policy: summarized
literal_observations:
