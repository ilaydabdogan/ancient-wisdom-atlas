- id: obs:3
  text: The air meditation is identified with the Vaiśvānara Self called having various
    courses; the speaker says offerings and rows of cars come in various ways to that
    meditator.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The ether meditation is identified with the Vaiśvānara Self called full; the
    speaker says that meditator is full of offspring and wealth.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:5
  text: The water meditation is identified with the Vaiśvānara Self called wealth;
    the speaker says that meditator is wealthy and flourishing.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:6
  text: The earth meditation is identified with the Vaiśvānara Self called firm rest;
    the speaker says that meditator stands firm with offspring and cattle.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:7
  text: A repeated formula states that one who meditates thus on the Vaiśvānara Self
    eats food, sees desire, and has Vedic glory in his house.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:4
  - ev:6
  - ev:8
  - ev:10
- id: obs:8
  text: 'The king says each named object is only a part of the Self: the sun is the
    eye, air is the breath, ether is the trunk, water is the bladder, and earth is
    the feet; he pairs each correction with a warning of bodily harm if the person
    had not come to him.'
  category: relationship
  evidence_refs:
  - ev:2
  - ev:4
  - ev:6
  - ev:8
  - ev:10
- id: obs:9
  text: In the collective instruction, the king says they know the Vaiśvānara Self
