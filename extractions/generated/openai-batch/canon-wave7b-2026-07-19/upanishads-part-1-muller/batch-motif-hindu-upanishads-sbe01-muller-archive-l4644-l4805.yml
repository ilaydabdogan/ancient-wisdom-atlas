canonical_text:
  quote: ''
  summary: The passage is an introductory scholarly discussion of legends and commentarial
    claims about Mahidasa and the Aitareya material. It reports a Vaishnava legend
    in which Mahidasa is treated as an incarnation or avataric manifestation of Narayana/Hari,
    appears at a solemn celebration or sacrifice, causes an assembly of gods and priests
    to faint, is associated with Brahma's intercession and their revival, receives
    obeisance, and instructs them in holy science. It then discusses textual attribution,
    structure, and titles of the Aitareya-aranyaka and Aitareya-upanishad.
  language: English
