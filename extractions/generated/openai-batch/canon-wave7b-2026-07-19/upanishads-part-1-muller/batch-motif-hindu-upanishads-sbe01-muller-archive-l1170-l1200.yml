  quote: ''
  summary: The preface asks whether every sacred book contains something capable of
    lifting the human heart toward a higher world, making people aware of a higher
    Power, encouraging avoidance of evil and inclination to good, and sustaining people
    through life. It then argues that readers of translations may discover such “precious
    grains” in the sacred books of other nations, and that every religion requires
    a distinction between essential and non-essential, eternal and temporary, divine
    and human elements.
