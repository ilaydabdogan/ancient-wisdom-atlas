  quote: ''
  summary: 'The passage includes a comparative note about chant and musical syllables,
    a brief Upanishadic instruction on meditating before chanting praise, and sections
    on Om: the gods escape Death by entering Om, Om is identified with the udgitha
    and the sun, and meditation on breath and praise is linked with sons and fulfilled
    desires.'
