  quote: ''
  summary: 'The passage recounts the early modern and European transmission of the
    Upanishads: their translation from Sanskrit into Persian by or for Dara Shukoh
    with the assistance of Pandits, Dara''s execution by Aurangzib, the wider accessibility
    created by the Persian version, and Anquetil Duperron''s later receipt, collation,
    translation, and publication of a Latin version titled as a secret and ancient
    theological-philosophical doctrine.'
