  quote: ''
  summary: 'The preface explains how ancient verses, ceremonial acts, and sayings
    could be preserved after their original circumstances were forgotten: battle songs
    might be remembered because of victory; a rite linked to famine or inundation
    might enter liturgical custom after apparent success; and the sayings of a prestigious
    man might be transmitted together without critical separation.'
