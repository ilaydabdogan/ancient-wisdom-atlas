canonical_text:
  quote: It is the True. It is the Self, and thou, O Śvetaketu, art it.
  summary: The passage uses the simile of a blindfolded person guided back to Gandhara
    to describe the role of a teacher in obtaining true knowledge. It then repeats
    the teaching that the subtle essence is the True and the Self. A following section
    describes an ill man whose speech, mind, breath, and heat merge successively into
    the Highest Being, after which he no longer recognizes his relatives. The excerpt
    ends by beginning a new example about a man accused of theft.
  language: English
  quote_policy: quoted
