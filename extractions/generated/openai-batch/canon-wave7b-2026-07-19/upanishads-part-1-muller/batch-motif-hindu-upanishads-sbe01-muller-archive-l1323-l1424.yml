  quote: ''
  summary: 'The passage argues for a complete, trustworthy, readable translation series
    of Eastern sacred books. It describes obstacles: textual-critical uncertainty,
    scholars’ preference for specialized research, funding needs, limited public demand,
    and the need for collective institutional support. It frames the value of these
    books primarily as historical evidence for the development of religious thought,
    and outlines a plan to publish translations from original texts, revised by competent
    scholars, over multiple years.'
