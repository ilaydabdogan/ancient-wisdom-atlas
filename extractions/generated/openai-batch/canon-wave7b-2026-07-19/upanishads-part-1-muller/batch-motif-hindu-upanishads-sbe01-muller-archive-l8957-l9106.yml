canonical_text:
  quote: ''
  summary: The passage maps the Vaishvanara Self onto cosmic and ritual body-parts,
    presents eating as a sequence of Agnihotra-like oblations to the five breaths,
    describes chains of satisfaction extending through senses, deities, and worlds,
    contrasts ignorant and knowledgeable offering, and opens the Shvetaketu instruction
    episode with a question about higher knowledge and an analogy from clay.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Vaishvanara Self is described through correspondences between body parts,
    cosmic elements, and ritual elements, including earth as feet, altar as chest,
    altar-grass as hairs, and three ritual fires as heart, mind, and mouth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first food a man takes is placed in the position of a Homa, and the first
    oblation is offered to Prana with the formula Svaha.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The satisfaction of Prana is followed by the satisfaction of the eye, the
    sun, heaven, and what is under heaven and the sun, and the eater or sacrificer
    is said to be satisfied with offspring, cattle, health, brightness, and Vedic
    splendour.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The second oblation is offered to Vyana, and its satisfaction proceeds through
    the ear, the moon, the quarters, and what is under the quarters and the moon.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The third oblation is offered to Apana, and its satisfaction proceeds through
    the tongue, Agni, the earth, and what is under the earth and under fire.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The fourth oblation is offered to Samana, and its satisfaction proceeds through
    the mind, Parjanya, lightning, and what is under Parjanya and lightning.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The fifth oblation is offered to Udana, and its satisfaction proceeds through
    Vayu, ether, and what is under Vayu and ether.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Offering an Agnihotra without knowing its true purport is compared to removing
    live coals and pouring a libation on dead ashes.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Offering this Agnihotra with full knowledge is described as offering it in
    all worlds, all beings, and all Selfs, and as burning all the offerer's sins like
    reed fibres thrown into fire.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Giving leftover food to a Chandala is described as an offering in that person's
    Vaishvanara Self.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A verse compares all beings sitting around the Agnihotra to hungry children
    sitting around their mother.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Shvetaketu is sent by his father to school, returns after Vedic study, and
    is questioned by his father about an instruction through which the unheard, unperceived,
    and unknown are known.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The father gives the example that by knowing one clod of clay, all things
    made of clay are known, with differences treated as names arising from speech.
  category: speech
  evidence_refs:
  - ev:11
