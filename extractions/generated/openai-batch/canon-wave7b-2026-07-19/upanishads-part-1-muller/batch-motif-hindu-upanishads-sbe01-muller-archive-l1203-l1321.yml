  quote: ''
  summary: Programmatic preface for a translation series of the Sacred Books of the
    East. The passage describes the difficulties of recruiting translators, argues
    that sacred books are among the oldest preserved records of several cultures,
    compares sacred-book corpora with other epic or sacred literatures, and lists
    non-Jewish and non-Christian religions described as founded on preserved sacred
    books.
  language: English
