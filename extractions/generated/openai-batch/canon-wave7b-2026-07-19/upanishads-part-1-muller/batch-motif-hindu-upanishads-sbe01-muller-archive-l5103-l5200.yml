- id: obs:3
  text: The Devas take the udgitha, identified in the translation with Om, in order
    to vanquish the Asuras.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Devas meditate on the udgitha as breath in the nose, speech, the eye,
    the ear, and the mind; each is pierced with evil by the Asuras.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'After the faculties are pierced, the passage explains mixed human functions:
    smelling good and bad smells, speaking truth and falsehood, seeing sightly and
    unsightly things, hearing what should and should not be heard, and conceiving
    what should and should not be conceived.'
  category: sequence
  evidence_refs:
