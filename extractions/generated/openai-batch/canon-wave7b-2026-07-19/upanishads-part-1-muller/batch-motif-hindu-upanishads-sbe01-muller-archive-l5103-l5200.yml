canonical_text:
  quote: The Devas took the udgitha (Om), thinking they would vanquish the Asuras
    with it.
  summary: The passage contrasts ritual recitation of Om with knowledge of its hidden
    meaning, then narrates a conflict in which the Devas use the udgitha, identified
    with Om, against the Asuras. The Asuras pierce several faculties with evil, producing
    mixed good and bad functions, but the mouth or life breath remains free from evil
    and scatters the Asuras like earth striking stone.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A preliminary note states that a sacrifice performed with knowledge of the
    hidden meaning of Om is more powerful than one performed by mere pronunciation.
  category: other
  evidence_refs:
