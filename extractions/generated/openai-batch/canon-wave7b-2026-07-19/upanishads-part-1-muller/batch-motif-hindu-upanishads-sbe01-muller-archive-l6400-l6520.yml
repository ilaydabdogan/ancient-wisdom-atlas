canonical_text:
  quote: ''
  summary: The passage presents several correspondences between parts of the Saman
    chant and bodily members, deities, cosmic regions, beings, and speech sounds.
    It states that knowing or meditating on these correspondences brings bodily strength,
    long life, fame, divine company, gifts from all regions, and identity with everything.
    It also instructs the Udgatre singer on tones, desired ritual benefits, divine
    affiliations of phonemes, and careful pronunciation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prefatory note says certain chants are water and that the worlds rest on
    water.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The five parts of the Saman are correlated with hair, skin, flesh, bone, and
    marrow as bodily members.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The person who knows the Yajnayajniya Saman as interwoven in the body is said
    to gain strong limbs, full life, long life, children, cattle, and fame, and is
    given a rule about not eating marrow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The five parts of the Saman are correlated with fire, air, sun, stars, and
    moon as deities or celestial forms.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The person who knows the Saman as interwoven in the deities is said to obtain
    the same world, happiness, and company as the gods, along with full life, children,
    cattle, and fame.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Saman interwoven in everything is mapped to threefold knowledge, three
    worlds, Agni, Vayu, Aditya, stars, birds, rays, serpents, Gandharvas, and fathers.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The knower of the Saman interwoven in everything is said to become everything,
    know everything, receive gifts from all regions, and meditate that he is everything.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Different notes or tones of the Udgitha are assigned to Agni, Prajapati, Soma,
    Vayu, Indra, Brihaspati, and Varuna, with an instruction to avoid Varuna's note.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The singer is instructed to seek, through song, immortality for the Devas,
    oblations for the fathers, hope for men, fodder and water for animals, heaven
    for the sacrificer, and food for himself.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Vowels are said to belong to Indra, sibilants to Prajapati, and consonants
    to Mrityu; the passage gives refuge formulas and pronunciation rules for these
    sounds.
  category: relationship
  evidence_refs:
  - ev:10
  - ev:11
