canonical_text:
  quote: ''
  summary: The passage comments on an Upanishadic teaching in which a father instructs
    his son Svetaketu about Sat, the subtle essence underlying existence. The father
    uses the fruit and nearly invisible seed of a Nyagrodha tree to illustrate an
    unseen essence from which the great tree exists. The passage then discusses the
    formula identifying that subtle essence with the True, the Self, and Svetaketu
    himself, and adds that knowledge enables return to Sat.
  language: English with transliterated Sanskrit terms
