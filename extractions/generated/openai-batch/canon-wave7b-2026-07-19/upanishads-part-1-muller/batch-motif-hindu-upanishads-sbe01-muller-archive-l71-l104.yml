canonical_text:
  quote: ''
  summary: 'The preface opens the translation series by announcing three cautions:
    about the nature of the original texts, the proper use of translations, and the
    difficulty of rendering ancient thought in modern speech. It then warns that readers
    expecting various sacred books to contain primeval wisdom, religious enthusiasm,
    or simple moral teaching may be disappointed, and says the study of ancient religions
    should be placed on a more historical basis.'
