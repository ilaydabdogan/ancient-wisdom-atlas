canonical_text:
  quote: ''
  summary: 'In the Kikku-Jataka, the Master recounts a former birth in which Brahmadatta
    rules Benares unrighteously and oppresses the people. The Bodhisatta, his wise
    counsellor, admonishes him through three parables: a roof peak held secure by
    rafters, a citron whose sweetness is preserved by proper cutting, and a lotus
    that remains undefiled by the water. The king understands the lessons, rules righteously,
    performs good actions, and is destined for heaven. The birth is identified with
    Ananda as the king and the Bodhisatta as the wise minister.'
  language: English
  quote_policy: summarized
