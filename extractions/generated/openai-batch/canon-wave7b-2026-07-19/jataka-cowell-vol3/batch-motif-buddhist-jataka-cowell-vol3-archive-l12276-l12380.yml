- id: obs:2
  text: Upananda preaches contentment to other Brethren, who discard better robes
    and vessels; he stores the discarded goods in his own lodging and later fills
    a cart with them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the road near a forest monastery, Upananda wraps his feet with creepers,
    says something can be obtained there, and enters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two old Brethren have two coarse cloaks and one fine blanket and ask Upananda
    to divide them; he gives the cloaks to them and takes the blanket, saying it falls
    to one who knows discipline.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Master says a person who teaches another should first act suitably himself,
    and he uses a stanza about establishing oneself in propriety before teaching others.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Master says Upananda was not covetous for the first time and had plundered
    men's property before, then begins an old tale.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the old tale, while Brahmadatta reigns in Benares, the Bodhisatta is a
    tree-spirit by a river-bank; a jackal named Mayavi lives there with his mate,
    who desires a fresh rohita fish.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The jackal promises to bring the fish, wraps his feet in creepers, and goes
    along the river-bank.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Two otters look for fish; Gambhiracari catches a large rohita by the tail,
    is dragged by it, and calls Anutiracari for help.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The two otters together pull out and kill the rohita fish, but quarrel because
    neither can divide it.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: The otters ask the jackal to make an equal division of the fish and settle
    their dispute.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The jackal declares experience in arbitration, assigns the tail to Anutiracari,
