canonical_text:
  quote: ''
  summary: 'A frame story at Jetavana presents Upananda as a greedy monk who preaches
    contentment while acquiring others'' goods and taking a disputed blanket as his
    own share. The Master rebukes such conduct and introduces an old tale: the Bodhisatta
    is a tree-spirit by a river-bank; a jackal named Mayavi, seeking fish for his
    mate, encounters two otters who have caught a large rohita fish but cannot divide
    it. Asked to arbitrate, the jackal gives the tail to one otter, the head to the
    other, takes the middle for himself, and runs away while the otters grieve.'
  language: English
  quote_policy: summarized
literal_observations:
