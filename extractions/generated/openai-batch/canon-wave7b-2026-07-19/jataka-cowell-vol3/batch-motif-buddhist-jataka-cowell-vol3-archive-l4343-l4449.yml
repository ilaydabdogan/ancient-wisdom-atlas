canonical_text:
  quote: ''
  summary: At Jetavana, the Master frames Devadatta's false speech and painful illness
    as a repetition of an older pattern. In the old tale, during a festival at Benares,
    four divine beings from the heaven of the Thirty-three appear wearing fragrant
    heavenly kakkaru flowers. They say the flowers are fit only for people with specific
    virtues. A family priest, knowing he lacks these virtues, falsely claims them
    to obtain and wear the flowers. After the gods depart, the flowers cannot be removed
    and he suffers severe head pain, confessing that he lied.
  language: English
  quote_policy: summarized
