canonical_text:
  quote: '"Great king, you give me security, but what will this herd of deer in the
    park do?"'
  summary: A Bodhisatta in the form of the deer king Nandiya stands fearlessly before
    a king's drawn arrow. The king cannot shoot him, recognizes his merit, grants
    safety first to him and then to other beings, and receives instruction in righteous
    kingship. The episode ends with a proclamation of security, a return to the Bodhisatta's
    parents, and a Jataka identity conclusion.
  language: English
  quote_policy: quoted
