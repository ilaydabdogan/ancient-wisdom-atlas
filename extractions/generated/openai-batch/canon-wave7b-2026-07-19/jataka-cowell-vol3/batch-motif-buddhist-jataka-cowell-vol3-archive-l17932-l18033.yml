- id: obs:5
  text: Elephants, horses, bulls, and other four-footed beasts are placed in a line
    at the sacrificial pit, and Kassapa attempts to kill them all for the sacrifice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The gathered people protest and lament that Lomasakassapa's action is improper,
    and their verses state that Candavati, through her father's device, drew him into
    deadly sin and living sacrifice.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kassapa raises a precious sword to strike the royal elephant on the neck;
    the elephant cries out in fear of death, then the other beasts and the people
    also cry aloud.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hearing the cries, Kassapa becomes conscious of his matted hair, beard, and
    body hair, feels remorse, and calls his act sinful and unbecoming.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The king offers Candavati, the kingdom, and seven treasures if Kassapa continues,
    but Kassapa refuses the sin, curses lust, and chooses ascetic life.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kassapa concentrates on the mystic object, recovers his lost meditation, sits
    cross-legged in the air, teaches the law, tells the king to destroy the sacrificial
    pit and grant amnesty, and flies back to his abode.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Kassapa cultivates the Brahma perfections for the rest of his life and becomes
    destined for birth in the Brahma world.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Master identifies Sayha as Sariputta and Lomasakassapa as himself in that
    former birth.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The next Jataka opens with a frame about a greedy Brother who seeks Buddhist
    requisites and rich food at several households.
  category: action
  evidence_refs:
  - ev:8
