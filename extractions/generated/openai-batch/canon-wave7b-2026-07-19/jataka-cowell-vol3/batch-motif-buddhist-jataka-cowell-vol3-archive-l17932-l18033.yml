canonical_text:
  quote: ''
  summary: A king seeks to bring the ascetic Lomasakassapa to perform a sacrifice
    and is advised to send his daughter Candavati as a promised wife. Sayha presents
    Candavati, and the ascetic, overcome by desire, loses meditation and agrees to
    perform the sacrifice. At Benares, animals are lined up in the sacrificial pit,
    and Kassapa raises a sword to kill the royal elephant. The cries of the elephant,
    other animals, and people awaken his remorse; he rejects the king's further offer
    of Candavati, the kingdom, and treasures, renounces lust and sin, recovers meditation,
    teaches the law from the air, orders the pit destroyed and an amnesty granted,
    and returns to his abode. The frame identifies Sayha with Sariputta and Lomasakassapa
    with the Buddha in a former birth. The following story begins with a frame about
    a greedy Brother seeking requisites and food.
  language: English
  quote_policy: summarized
