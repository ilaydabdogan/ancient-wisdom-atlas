  quote: ''
  summary: A panther accuses a she-goat of spoiling his food by flying through the
    air and frightening deer. The she-goat pleads for her life, but the panther kills
    and eats her. Moral stanzas describe the bad as lacking right conduct and courtesy.
    A holy ascetic witnesses the matter, and the Master identifies the former births
    of the animals and himself.
