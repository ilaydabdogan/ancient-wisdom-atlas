canonical_text:
  quote: Weep for the living rather than the dead!
  summary: The Master tells a grieving landowner a past-life story in which the Bodhisatta,
    after his brother's death, refuses to lament and teaches that all compounded existences
    are impermanent and all living beings must die. The teaching relieves sorrow,
    and the landowner attains the fruition of the First Path.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A landowner at Savatthi is overwhelmed by grief after his brother's death,
    neglects food and washing, and goes to the cemetery at daybreak to weep.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master observes that the landowner has capacity for attaining the fruition
    of the First Path and decides to assuage his grief by telling an old event.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Master returns from alms-begging, takes a junior priest, visits the landowner's
    house, and asks why he is grieving.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Master says that all compound existences are impermanent, that what is
    to be broken is broken, and that wise men of old did not grieve when their brother
    died.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the past story, Brahmadatta reigns in Benares, and the Bodhisatta is reborn
    in the family of a rich merchant.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the Bodhisatta's parents die, his brother manages the estate and later
    dies of a fatal disease.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Relations, friends, companions, and kinsfolk lament the brother's death, while
    the Bodhisatta neither laments nor weeps and is reproached for this.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Bodhisatta says that those who weep do not know the Eight Worldly Conditions,
    that he and they will also die, and that all existing things are transient.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The stanza lists four-footed beasts, birds, a hooded snake, men, and angels
    as all treading the same path.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Bodhisatta teaches the Truth and delivers the people from sorrow; afterward
    the Master reveals the Truths, the landowner attains the fruition of the First
    Path, and the Master identifies the wise man as himself.
  category: sequence
  evidence_refs:
  - ev:8
