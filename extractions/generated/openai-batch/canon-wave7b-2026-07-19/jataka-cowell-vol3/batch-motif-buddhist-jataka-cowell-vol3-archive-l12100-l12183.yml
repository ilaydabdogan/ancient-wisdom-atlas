canonical_text:
  quote: ''
  summary: After men from the jail have been sent with rice to a yakkha and eaten,
    the jail becomes empty and the king fears for his life. A reward is proclaimed
    for anyone who will carry rice to the yakkha. The Bodhisatta accepts in order
    to support his mother, receives royal slippers, umbrella, sword, and golden bowl,
    and uses them to avoid standing on the yakkha's ground or in the tree's shade.
    He offers the rice from outside the dangerous boundary and persuades the yakkha
    that eating him would prevent future food deliveries. The yakkha lets him go,
    and the Bodhisatta considers the task accomplished.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The minister agrees to manage the king's affair and sends one jailed man each
    day with rice to the yakkha without telling the man what will happen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The yakkha eats both the rice and the man, and after a time the jails become
    empty; the king then fears death because no carrier remains.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The minister proposes putting a packet of a thousand pieces on an elephant's
    back and proclaiming a reward for whoever will take rice to the yakkha.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Bodhisatta earns very small wages, has difficulty supporting his mother,
    and decides to accept the reward, give it to her, and go to the yakkha.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Bodhisatta's mother says she has enough and forbids him twice; on the
    third occasion he accepts the errand without asking her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Bodhisatta gives his mother the thousand pieces, promises to overcome
    the yakkha and make the people happy, salutes her, and goes to the king.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Before the king, the Bodhisatta asks for golden slippers, the king's umbrella,
    the king's sword, and a golden bowl filled with the king's own rice.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Bodhisatta explains that the slippers will keep him from standing on the
    yakkha's ground, the umbrella will keep him from standing in the tree's shade,
    the sword will make goblins afraid, and the golden bowl is suitable for him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the yakkha's place, the Bodhisatta sets men not far from the tree, puts
    on the golden slippers, girds the sword, holds the white umbrella over his head,
    and carries rice in a gold dish.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Near the tree, the Bodhisatta pushes the rice plate into the shadow with the
    sword-point while standing near the shadow, then calls the yakkha to come out
    and eat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The yakkha plans to deceive the Bodhisatta and eat him when he enters the
    shadow, and invites him to come inside with the food.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Bodhisatta tells the yakkha that eating him would be losing a great thing
    for a small one, because fear of death would make future food-carriers hard to
    find.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The yakkha accepts the Bodhisatta's reasoning and gives him permission to
    go peacefully to his mother, taking the sword, parasol, and dish.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Bodhisatta is pleased, thinking the task is accomplished, the yakkha overcome,
    wealth won, and the king's command performed; he thanks and blesses the yakkha.
  category: action
  evidence_refs:
  - ev:9
