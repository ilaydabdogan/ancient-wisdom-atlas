canonical_text:
  quote: Who is it that wakes when others sleep and sleeps while others wake?
  summary: A lay-brother's all-night walking keeps a caravan safe from robbers. The
    Master then tells an old story in which the Bodhisatta, as an ascetic in the Himalaya
    region, walks all night without sleeping. A tree-spirit asks him a riddle about
    waking and sleeping; he answers by interpreting wakefulness as moral vigilance
    and sleep as freedom from passion, vice, and ignorance. The spirit praises him.
    The passage then begins the next tale, introducing Mallika offering sour gruel
    to the radiant Blessed One.
  language: English
  quote_policy: quoted
