canonical_text:
  quote: ''
  summary: A man from a border village comes to the king with simple gifts. The king
    receives him as a friend, gives him elaborate royal hospitality, and grants him
    half the kingdom. When courtiers and the prince object, the king explains that
    after a defeat in battle he had recovered in this man's house. The Bodhisatta
    states a moral about generosity to the worthy and the value of a virtuous deed,
    after which the Birth is identified.
  language: English
  quote_policy: summarized
