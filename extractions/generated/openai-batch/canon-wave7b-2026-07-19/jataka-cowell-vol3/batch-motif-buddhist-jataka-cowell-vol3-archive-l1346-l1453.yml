canonical_text:
  quote: ''
  summary: Ministers advise a king to send his four adorned daughters through kingdoms
    under armed escort to provoke battle if another king takes them. After other rulers
    refuse them, Nandisena admits them into Assaka's city, has them made chief queens,
    and prepares for Kalinga's attack. Kalinga and later Nandisena consult the Bodhisatta
    ascetic about the battle; Sakka predicts Kalinga's victory and omens involving
    tutelary deities appearing as white and black bulls. Nandisena then tests Assaka's
    warriors on a mountain precipice and urges them to fight bravely.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ministers advise the king to send his four beautiful daughters, adorned
    with jewels, in a covered carriage with an armed escort, and to fight any king
    who wants to take them into his harem.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king follows the plan, but rulers in other countries refuse to admit the
    daughters into their cities and instead send presents and lodging outside the
    walls.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Potali in Assaka territory, Assaka also closes his gates and sends only
    a present.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nandisena is described as a wise and able minister, fertile in expedients,
    and he resolves to do battle with Kalinga.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Nandisena has the city gate opened and brings the maidens before King Assaka.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Nandisena tells Assaka not to fear and tells him to make the princesses his
    chief queens.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nandisena installs the princesses as queens by sprinkling them with holy water
    and sends their attendants to report this to Kalinga.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After hearing that his daughters have become queen-consorts, Kalinga sets
    out with a great army.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Nandisena sends word that Kalinga should stay within his own marches and that
    battle should be fought on the frontier; both Kalinga and Assaka remain within
    their territories.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Bodhisatta is living as an ascetic in a hermitage located between the
    two kingdoms.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Kalinga comes to the Bodhisatta in disguise and asks which king will win and
    which will be defeated.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Bodhisatta says he will ask Sakka; Sakka later says Kalinga will conquer,
    Assaka will be defeated, and omens will appear beforehand.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Kalinga receives the prediction but does not ask what the omens will be.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Nandisena asks the Bodhisatta both who will win and what omens will mark victory
