canonical_text:
  quote: ''
  summary: A king repeatedly orders an executioner to mutilate and kill prince Dhammapala,
    despite Queen Canda's pleas and offer of her own life. The boy is dismembered
    and Canda laments over his remains, then dies. The king falls from his throne;
    the earth opens, a flame from Avici hell seizes him, and he is plunged into Avici.
    Ministers perform funeral rites, and the Master identifies the past-birth figures.
  language: English
  quote_policy: summarized
