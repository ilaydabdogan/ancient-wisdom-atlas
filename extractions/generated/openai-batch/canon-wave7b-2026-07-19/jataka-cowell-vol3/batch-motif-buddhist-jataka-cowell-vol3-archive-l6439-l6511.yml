canonical_text:
  quote: '"No living creature is to be put to death."'
  summary: The Bodhisatta is born as the son of the chief queen of Benares, becomes
    king, and rules righteously. He bans the killing of living creatures, angering
    Yakkhas who have lost animal offerings. They send a savage Yakkha with a blazing
    mass of iron to kill him at night. Sakka perceives the danger through signs of
    heat in his throne, arrives with his thunderbolt, prevents the attack, and promises
    protection.
  language: English
  quote_policy: quoted
