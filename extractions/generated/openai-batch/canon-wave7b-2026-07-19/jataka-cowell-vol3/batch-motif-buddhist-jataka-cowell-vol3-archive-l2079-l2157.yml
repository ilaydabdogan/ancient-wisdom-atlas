canonical_text:
  quote: ''
  summary: The Master addresses Ananda and introduces a past-life story. In Benares,
    the Bodhisatta is born as a Judas-tree sprite. A poor brahmin maintains and worships
    the tree. The sprite tests him in the disguise of an aged brahmin, hears that
    the brahmin reveres wood spirits and thinks they guard treasure, reveals himself,
    directs him to buried gold beneath a fig-tree, transports it to the brahmin's
    house, and counsels almsgiving and moral conduct. The Master identifies Ananda
    with the brahmin and himself with the tree-sprite.
  language: English
  quote_policy: summarized
