  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: When the Bodhisatta sees the grey hair, fear of death arises, and he admonishes
    himself to quit desires and become an ascetic in the Himalaya.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The queen admits that the silvered hair is hers and asks him to keep the kingdom
