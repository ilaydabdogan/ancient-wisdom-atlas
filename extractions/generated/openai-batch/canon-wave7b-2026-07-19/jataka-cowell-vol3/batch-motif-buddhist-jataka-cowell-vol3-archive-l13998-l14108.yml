canonical_text:
  quote: ''
  summary: In Benares, the Bodhisatta is born as Susima-Kumara on the same day as
    the king's son Brahmadatta-Kumara, is raised with him, and later serves him as
    priest. The queen-mother falls in love with Susima, and the king cedes the throne
    to him so that she may become his chief queen. Susima becomes dissatisfied with
    household life. The queen tries to keep him by falsely presenting one of her own
    grey hairs as his; the apparent sign of aging makes him reflect on death, aging,
    and the decline of beauty, and he declares that it is time for religious life.
  language: English
  quote_policy: summarized
