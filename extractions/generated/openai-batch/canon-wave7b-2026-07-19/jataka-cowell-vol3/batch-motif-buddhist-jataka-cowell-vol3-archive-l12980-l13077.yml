canonical_text:
  quote: ''
  summary: The passage recounts a monkey Bodhisatta leaving the king's garden after
    a priest is insulted by a monkey and threatens revenge. The monkeys who remain
    are later killed for their fat after a fire injures the king's elephants, and
    the Bodhisatta gives verses on avoiding enemies and relying on wise leadership.
    The excerpt then begins the Baka-Brahma-Jataka, describing Baka Brahma's false
    doctrine of permanent present existence and his forgotten previous rebirths in
    Brahma heavens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bodhisatta and Devadatta are each born as monkeys and live in the king's
    garden with retinues of five hundred monkeys.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: An unnamed tricky monkey sits above the garden gateway arch and drops excrement
    on the family priest, after which the priest threatens the monkeys.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Bodhisatta tells the monkeys it is not good to dwell near an angry person
    and leads his own retinue away to the forest.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A disobedient monkey keeps his retinue in the garden instead of fleeing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A goat struck with a torch runs while burning, rubs against a grass hut, and
    the fire spreads to an elephant stable where elephants are burned.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The family priest tells the king that monkey fat is a remedy for the injured
    elephants, and the king orders monkeys in the garden to be killed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Archers kill five hundred monkeys in the garden, and one wounded old monkey
    reaches the Bodhisatta's dwelling before dying.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Bodhisatta recites verses saying that one should not dwell near an enemy,
    that a fool may bring distress to a herd, and that a wise strong one guards kin.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Master identifies the disobedient monkey with Devadatta, the disobedient
    monkey's troop with Devadatta's company, and the wise king with himself.
  category: relationship
  evidence_refs:
  - ev:8
