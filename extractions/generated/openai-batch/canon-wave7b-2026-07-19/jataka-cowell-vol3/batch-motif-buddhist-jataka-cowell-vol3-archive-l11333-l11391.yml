canonical_text:
  quote: ''
  summary: An elder brother becomes an ascetic in the Himalaya. His younger brother,
    fearing division of the estate, kills the elder brother's son at a river or bathing
    place and conceals the deed. The ascetic returns, exposes the murder, and compares
    the greedy man to the Mayhaka bird, which cries 'mine' over fruit while other
    birds eat it. The verses contrast the miser with a wise rich man who helps kin.
    The younger brother renews alms-giving; the Great Being returns to meditation
    and reaches Brahmaloka. The frame identifies the younger brother with the stranger
    merchant and the elder with the Master.
  language: English
  quote_policy: summarized
