canonical_text:
  quote: '"Not now only, but formerly also he was a rogue."'
  summary: The Master tells an old-world story about the Bodhisatta born as a lizard.
    A false ascetic, after tasting lizard-flesh, plans to kill and eat the lizard,
    concealing a club beneath his robe. The lizard detects the danger by scent, avoids
    the attack, hides in an anthill, rebukes the ascetic's hypocrisy, and threatens
    to expose him, causing the ascetic to flee. The Master identifies the cheating
    Brother with the false ascetic and himself with the royal lizard.
  language: English
  quote_policy: quoted
