canonical_text:
  quote: '"These desires of ours are like pieces of meat."'
  summary: The Master tells a former-birth story in which the Bodhisatta, as family
    priest of the king of Benares, tests virtue by taking coins and being accused.
    After praising virtue, he becomes an ascetic. He observes birds fighting over
    meat and concludes that grasping desires brings sorrow while letting go brings
    peace. He then observes Pingala waiting for an absent lover and sleeping once
    hope is lost, and he concludes that hope can bring sorrow while release from hope
    brings peace. Finally, he sees a meditating hermit, praises meditative bliss,
    adopts the life of a Rishi, develops higher knowledge, and is destined for birth
    in the Brahma-World.
  language: English
  quote_policy: quoted
