canonical_text:
  quote: The Bodhisatta rejoiced at Siri's words... "Here is the pure seat and bed,
    proper for you."
  summary: 'The Bodhisatta offers Siri a pure seat and bed. Siri stays there, then
    in the morning departs to the Heaven of the Four Great Kings and bathes in lake
    Anotatta. The bed used by Siri is named Sirisaya, giving the stated origin of
    the term Sirisayana. The Master then identifies the former-birth figures: the
    goddess Siri as Uppalavanna and the merchant Suciparivara as himself.'
