canonical_text:
  quote: ''
  summary: 'A Brother smells a lotus and is frightened by a forest goddess who calls
    the act theft of odour. The Master tells an old tale in which the Bodhisatta,
    as an ascetic near a lotus-pool, is similarly accused by a tree-dwelling goddess
    after smelling a lotus. The ascetic contrasts himself with a man breaking lotus-plants,
    and the goddess explains that even a tiny fault is conspicuous in one seeking
    purity. The ascetic asks for future correction; she tells him to find the path
    himself, and he later attains deep meditation and rebirth in Brahmaloka. The passage
    then begins another Jataka: amusement-loving brethren are compared with seven
    former ascetics whom Sakka, as a parrot, rebukes for their conduct.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Brother left Jetavana, lived in the Kosala kingdom near a wood, went to
    a lotus-pool, and smelled a lotus in flower.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A goddess dwelling in that part of the forest frightened the Brother and called
    him a thief of odours, saying this was a kind of theft.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Master told the Brother that he was not the first to be frightened by
    a goddess for smelling a flower, and introduced an old tale.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the old tale, the Bodhisatta is born in a brahmin family, studies at Takkasila,
    becomes an ascetic, and lives near a lotus-pool.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The ascetic smells a lotus in full flower, and a goddess in a hollow tree
    trunk accuses him of smelling an ungiven flower and stealing its perfume.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The ascetic answers that he neither takes nor breaks the flower, but smells
    it from afar.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: A man is digging lotus-fibres and breaking lotus-plants in the pool, and the
    ascetic asks why the goddess does not rebuke him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The goddess says she does not converse with disorderly men like the lotus-digger,
    but speaks to one who seeks purity; she says a hair-tip-sized fault shows on such
    a man like a dark cloud in the sky.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The ascetic asks the goddess to admonish him again if he repeats such an offence;
    she replies that she is not his servant and tells him to find the path to felicity
    himself.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the goddess enters her abode, the Bodhisatta enters deep meditation
    and is reborn in the Brahmaloka world.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Master identifies the goddess as Uppalavanna and the ascetic as himself;
    the Brother is established in the fruit of the First Path.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: At the beginning of the next tale, some brethren are given to amusement; Great
    Moggallana shakes their dwellings and alarms them, and the Master says this fault
    is not occurring for the first time.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: In the next old tale, the Bodhisatta is Sakka; seven brothers renounce desires
    and become ascetics but live in amusement and laziness, so Sakka becomes a parrot
    to alarm them.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: The parrot first speaks of the happy life of those who live on remnants left
    from charity, then denies praising the seven ascetics and calls their food refuse
    rather than charitable remnants.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:15
  text: The seven ascetics say they have been ordained for seven years with tonsured
    hair and living on remnants, and they ask whom the parrot praises if not them.
  category: speech
  evidence_refs:
  - ev:13
