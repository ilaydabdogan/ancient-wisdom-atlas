canonical_text:
  quote: ''
  summary: The passage closes a prior Jataka by identifying former births, then begins
    the Khantivadi-Jataka. At Jetavana the Master addresses a wrathful Brother by
    recalling wise men of the past who endured severe bodily harm without anger. In
    the old-time tale, King Kalabu rules at Benares. The Bodhisatta is born as the
    wealthy brahmin youth Kundakakumara, is educated at Takkasila, reflects after
    his parents' death that wealth cannot be taken beyond death, gives his wealth
    away, and becomes an ascetic in the Himalaya. He later comes to Benares, stays
    in the royal park, and is fed by the commander-in-chief. King Kalabu, drunk and
    surrounded by dancers, falls asleep in the park; the women set aside their instruments,
    wander into the garden, find the Bodhisatta seated beneath a flowering Sal tree,
    salute him, sit around him, and ask for instruction. The Bodhisatta preaches doctrine
    to them.
  language: English
  quote_policy: summarized
