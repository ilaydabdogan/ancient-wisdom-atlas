canonical_text:
  quote: ''
  summary: A faithful Buddhist maiden marries into a family described as heretical
    after they promise not to hinder her religious practices. Through almsgiving to
    priests and arranging for her husband to hear the Law, she brings her husband
    and household to faith. She and her husband later renounce household life, enter
    religious orders, gain spiritual vision, and attain sainthood. The Master frames
    this as another instance of her freeing others from bonds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The maiden is described as a faithful believer in Savatthi, attached to the
    Buddha, the Law, and the Church, and devoted to almsgiving and other pious deeds.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A family of equal rank but heretical views seeks her in marriage, and her
    parents object until that family agrees she may continue her religious practices.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After marriage, she is described as faithful in household duties, a devoted
    wife, and dutiful toward her father-in-law and mother-in-law.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: She asks her husband to give alms to the family priests, invites them, feeds
    them with choice food, and asks them to continue receiving food there until the
    family understands the Three Treasures.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: She asks her husband why he does not see the priests, and he agrees to see
    them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The husband sits respectfully with the priests, converses with them, and hears
    the Captain of the Faith preach the Law.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The husband is pleased by the teaching and the priests' conduct, prepares
    mats, strains water for them, listens during meals, and his heretical views give
    way.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: An elder declares the Truths to the man and his wife, and both are established
    in the fruition of the First Path.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The rest of the household, from the husband’s parents to the hired servants,
    gives up heretical views and becomes devoted to the Buddha, the Law, and the Church.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The woman asks to adopt the religious life, and her husband says that he too
    will become an ascetic.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The husband conducts her to a sisterhood to be admitted as a novice, and he
    goes to the Master to be ordained.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Both receive clear spiritual vision and shortly attain sainthood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: In the Hall of Truth, the Brethren discuss the woman and her husband adopting
    religious life and attaining sainthood.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Master says she not only set her husband free from the bonds of passion
