canonical_text:
  quote: ''
  summary: King Tamba's queen Sussondi falls in love with a young Garuda, the Bodhisatta
    in disguise, who carries her away to his island abode after creating storm and
    darkness. The king sends the minstrel Sagga to find her. Sagga joins merchants
    at sea, plays music that maddens fish, survives a sea-monster shipwreck, and reaches
    the Garuda's island. Sussondi recognizes and shelters him, then hides him as her
    lover. Sagga later returns to Benares with merchants and sings before the king
    and Garuda, revealing that he has reached Sussondi. The Garuda regrets failing
    to guard her, returns her to King Tamba, and stops visiting.
  language: English
  quote_policy: summarized
