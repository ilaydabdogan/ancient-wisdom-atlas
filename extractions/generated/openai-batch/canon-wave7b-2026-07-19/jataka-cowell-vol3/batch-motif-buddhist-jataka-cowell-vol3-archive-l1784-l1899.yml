canonical_text:
  quote: ''
  summary: 'The passage narrates the Daddara Jataka: at Jetavana the Master responds
    to discussion of a choleric monk by recounting a former birth among the Daddara
    Nagas. The Bodhisatta is Mahadaddara, elder son of the Naga king Suradaddara,
    and has a younger brother, Culladaddara, who is violent and passionate. After
    repeated pardons, the king exiles both brothers for three years to a dunghill
    at Benares. Village boys mock and strike them; Culladaddara threatens to destroy
    the boys by serpent power, while Mahadaddara counsels patient endurance in exile.
    After three years they are recalled and their pride is abated; the Master identifies
    the choleric Brother as Culladaddara and himself as Mahadaddara. The passage then
    opens the Silavimamsana Jataka, where monks discuss sense pleasures, the Master
    perceives them, summons them, and says wise men of old avoided wrongdoing because
    it is not secret.'
  language: English
  quote_policy: summarized
