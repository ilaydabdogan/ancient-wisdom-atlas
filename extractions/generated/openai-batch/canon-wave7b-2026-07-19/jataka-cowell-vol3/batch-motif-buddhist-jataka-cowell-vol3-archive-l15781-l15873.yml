canonical_text:
  quote: ''
  summary: A queen coaches the court-barber to reverse the order of tweezers and razor
    and ask the king for the meaning of his song as a boon. The king explains that
    former merit and a companion's asceticism underlie the song. The barber Gangamala
    renounces household life, becomes an ascetic and then a paccekabuddha, returns
    through the air, is criticized for low birth by the queen-mother and crowd, and
    is defended by the king. He forgives them, admonishes the king, returns to Gandhamadana,
    and the Master gives a lesson on keeping the fast and identifies the Birth.
  language: English
  quote_policy: summarized
