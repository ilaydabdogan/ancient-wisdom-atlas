canonical_text:
  quote: ''
  summary: The passage narrates an exemplum in which a daughter-in-law plots to kill
    her husband's mother. The husband first redirects a crocodile-river murder to
    the wife's own mother; later the old mother escapes a planned cemetery burning
    by substituting a corpse, hides in a mountain cave, frightens a robber's devil-doctor,
    returns with jewels, and deceives the daughter-in-law into burning herself. The
    speaker applies the story to a king through the theme that a refuge can become
    a bane, and begins another exemplum about a prayed-for son who expels his aged
    father.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The daughter-in-law first showed affection for her mother-in-law, but after
    having many children she wished to get rid of her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The daughter-in-law told her husband that she could not support his mother
    and proposed throwing the sleeping woman, bed and all, into a crocodile river.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The husband had his wife mark the bed with a rope, then moved the rope to
    the bed of his own mother-in-law, the wife's mother.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The couple lifted the marked bed and threw the wife's mother into the river,
    where crocodiles killed and ate her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After learning that her own mother was dead, the daughter-in-law asked to
    kill the husband's mother next.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The husband proposed making a funeral pile in the cemetery and killing his
    mother by fire; the couple carried the sleeping old woman there and left to fetch
    fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The old woman woke in the cemetery, understood that they meant to kill her,
    put a corpse on the bed under a cloth, and hid in a mountain cave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The husband and wife returned with fire and burned the corpse, thinking it
    was the old woman.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A robber who had left a bundle in the mountain cave saw the old woman there
    and thought she must be a Yakkha, then fetched a devil-doctor.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The old woman denied being a Yakkha, invited the devil-doctor to share the
    treasure, then bit off a piece of his tongue when he placed it on hers.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: The devil-doctor concluded that she was certainly a Yakkha and fled with blood
    dripping from his tongue.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The old woman returned home wearing a clean undergarment and carrying a bundle
    of jewels.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The old woman told the daughter-in-law that all who are burned on a wooden
    pile in that cemetery receive such wealth.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Without telling her husband, the daughter-in-law went to the cemetery and
    burned herself because she desired ornaments.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: When the husband asked where his wife was, the old woman said that the dead
