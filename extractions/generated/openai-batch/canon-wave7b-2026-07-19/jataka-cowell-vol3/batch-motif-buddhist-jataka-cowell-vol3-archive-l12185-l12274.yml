canonical_text:
  quote: ''
  summary: 'The passage closes one Jataka in which the Bodhisatta reforms a yakkha,
    brings him to Benares, and is honored by the king; the Master then identifies
    the former-birth figures. It then gives the Gijjha-Jataka: the Bodhisatta is born
    as a vulture who feeds his aged, dim-sighted parents in a cave, is caught in a
    hunter''s snare, laments for his parents, speaks with the hunter''s son, is released,
    and returns with meat for his parents. The Master again declares the Truths and
    identifies the former-birth figures.'
  language: English
  quote_policy: summarized
