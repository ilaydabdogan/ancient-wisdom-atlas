canonical_text:
  quote: ''
  summary: 'The excerpt closes a prior birth-identification, then begins the Karandiya-Jataka.
    In the present frame at Jetavana, Sariputta is said to preach moral law to unwilling
    people, who accept it but do not keep it. Other monks advise that teaching should
    not be imposed on those who do not wish to hear. The Master says this conduct
    also occurred formerly and tells a past story: during Brahmadatta''s reign in
    Benares, the Bodhisatta becomes chief pupil of a famous teacher at Takkasila.
    That teacher likewise preaches moral law to unwilling hearers. Villagers invite
    the teacher for cakes offered to brahmins; he sends Karandiya with five hundred
    disciples. On the return journey, Karandiya sees a cave and resolves to make his
    master teach only those who wish to hear.'
  language: English
  quote_policy: summarized
