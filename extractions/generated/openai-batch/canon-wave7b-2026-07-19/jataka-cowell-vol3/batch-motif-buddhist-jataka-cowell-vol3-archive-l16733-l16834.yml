canonical_text:
  quote: ''
  summary: A disobedient Brother refuses monastic instruction. The Master recounts
    a former birth in which a strong young vulture ignored his father’s flight limit,
    entered the Veramba wind, and was destroyed. The Master applies the story as a
    warning to obey wise counsel and identifies the former disobedient vulture with
    the present Brother and the parent vulture with himself.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master tells the story at Jetavana concerning a disobedient Brother who
    had been instructed by well-wishers, masters, teachers, and fellow-students in
    monastic conduct.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Brother refuses to listen respectfully and says that he will know what
    is for his own good and what is not.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Master says the Brother formerly disobeyed the voice of the wise and was
    blown into atoms by the Veramba wind.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the past story, the Bodhisatta is born as a vulture on Vulture Mountain;
    his offspring Supatta is king of the vultures, has many followers, and feeds the
    parent birds.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The parent vulture warns Supatta not to go beyond a specified point.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: On a rainy day Supatta flies up with other vultures, leaves them behind, passes
    the prescribed limit, enters the range of the Veramba wind, and is blown into
    atoms.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The verses describe a high lookout from which the bird can view forests, mountains,
    the rounded earth, and the sea encircling it.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The verses state that those who deride the warnings of old age or the sage
    perish, and the Master tells the Brother not to be like the vulture.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The story ends with the identification that the former disobedient vulture
    is now the disobedient Brother and the parent vulture was the Master.
  category: relationship
  evidence_refs:
  - ev:8
