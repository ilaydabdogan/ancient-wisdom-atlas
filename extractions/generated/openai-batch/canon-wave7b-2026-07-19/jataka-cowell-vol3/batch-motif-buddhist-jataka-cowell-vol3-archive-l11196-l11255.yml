canonical_text:
  quote: ''
  summary: A golden crab refuses to release a crow and snake until the poisoned Bodhisatta
    is safe. The snake removes the poison, the Bodhisatta recovers, and the crab kills
    the snake and crow. The Bodhisatta releases the crab back into the pool, and their
    friendship increases. The frame identifies the serpent with Mara, the crow with
    Devadatta, the crab with Ananda, and the brahmin with the Buddha in a former birth.
  language: English
  quote_policy: summarized
