canonical_text:
  quote: ''
  summary: In the frame story, the Master explains Devadatta's loss of gains and honour
    and says this happened formerly as well. In the old-world tale, the Bodhisatta
    is born as the parrot Radha, with a younger brother Potthapada. A fowler gives
    them to the king of Benares, who keeps them in a golden cage and honours them
    with fine food and drink. Later a forester brings the black monkey Kalabahu, who
    receives greater honour, while the parrots' honour declines. Radha remains silent,
    but Potthapada complains and proposes going to the forest.
  language: English
  quote_policy: summarized
