canonical_text:
  quote: ''
  summary: The passage includes a brief note on KANDARI-JATAKA and then gives VANARA-JATAKA.
    In the birth story, the Bodhisatta is a monkey living by the Ganges. A female
    crocodile longs for his heart, and her husband carries the monkey on his back
    under the pretext of visiting a fruit island, intending to drown him. When the
    crocodile reveals his purpose, the monkey claims that his heart is hanging on
    a fig-tree. The crocodile returns him to the bank, and the monkey escapes into
    the tree, reciting verses about recognizing a crisis and avoiding a foe. The Master
    identifies Devadatta with the crocodile and himself with the monkey.
  language: English
  quote_policy: summarized
