canonical_text:
  quote: Broken promises are lies; Liars all wise men despise.
  summary: A stanza complains of refusal despite possible generosity. The king teaches
    that one should promise only what can be done. The queen salutes and praises the
    king's truth and righteousness. The Bodhisatta praises the queen as a loyal wife
    who shared adversity in the forest, prompting the king to honor her with power
    and to reward the Bodhisatta. The Master then reveals the Truths and identifies
    the former births.
  language: English
  quote_policy: quoted
