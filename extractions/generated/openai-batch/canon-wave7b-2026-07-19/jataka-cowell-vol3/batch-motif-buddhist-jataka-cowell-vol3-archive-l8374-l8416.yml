canonical_text:
  quote: ''
  summary: 'A Yakkha named Gumbiya lays honey-like poison in a forest and deceives
    travelers; those who eat die and are devoured by demons. Members of the Bodhisatta''s
    caravan encounter the bait: greedy ones eat, while wiser ones wait to consult
    him. The Bodhisatta makes them discard it and heals some who had eaten only part.
    Verses moralize the episode as a warning against desire and greed, and the frame
    identifies the Bodhisatta as the merchant.'
  language: English
  quote_policy: summarized
