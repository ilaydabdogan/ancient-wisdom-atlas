canonical_text:
  quote: ''
  summary: The Bodhisatta is born as Jotipala amid a citywide blazing of weapons,
    later leaves status and enters forest ascetic life. His ascetic followers are
    described, including Narada, who lives alone in a cave-cell. Narada sees a courtesan
    near a river, becomes lovesick, abandons meditation, and is visited by Kaladevala
    and other sages. Sarabhanga, the Master, admonishes Narada about the misery and
    future consequences of submission to the senses, while Narada argues for the happiness
    of desire. The passage ends as Sarabhanga introduces an old cautionary tale about
    a young brahmin who rejects family duties and charity to live by hunting in the
    forest.
  language: English
  quote_policy: summarized
