canonical_text:
  quote: ''
  summary: 'In the battle between Kalinga and Assaka, the kings alone see their tutelary
    gods before them: Kalinga''s in the form of a white bull and Assaka''s in the
    form of a distressed black bull. Nandisena directs Assaka and his men to strike
    down Kalinga''s divine bull with spears; the deity dies, and Kalinga is defeated
    and flees. Kalinga reproaches the ascetic over a prophecy, but Sakka later explains
    to the hermit that Assaka''s resolve, courage, and prowess won the battle. Assaka
    returns with spoils, Nandisena obtains a dowry portion for four royal maidens,
    the kings become amicable, and the Master identifies the former-birth roles.'
  language: English
  quote_policy: summarized
