canonical_text:
  quote: ''
  summary: In the frame, the Master warns a backsliding Brother about attachment to
    his former wife. In the old tale, the Bodhisatta is an ascetic in the Himalaya
    who finds and raises a girl conceived inside a lotus after falling from the Heaven
    of the Thirty-three. Sakka provides her with a crystal palace. A forester reports
    her beauty to King Brahmadutta, who comes with an army to win her. The Bodhisatta
    requires the king to know her name, Asanka, but will not reveal it. After a year
    of failed guessing and hardship for the army, the king begins to depart. Asanka
    urges him not to abandon hope and compares his impatience with the gods’ thousand-year
    waiting for the rare fruit of the heavenly Asavati creeper.
  language: English
  quote_policy: summarized
