canonical_text:
  quote: ''
  summary: The passage opens with verses teaching that resentment sustains anger,
    that hatred ceases through love, that quarrels should be settled, and that one
    should keep wise companionship or else live in solitude. The Master fails to reconcile
    the Kosambi Brethren, teaches solitude and concord elsewhere, and leaves for Savatthi;
    the Kosambi lay people withhold honor and alms from the quarrelling Brethren until
    they seek the Blessed One's forgiveness. A birth identification follows. The next
    Jataka begins with a forest-dwelling Brother distressed by food scarcity after
    a village fire. The Master teaches contentment and introduces a past story in
    which a parrot king remains content in a fig-tree by the Ganges even after Sakka
    withers the tree to test his virtue.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening verses describe people who keep thoughts of past abuse, blows,
    defeat, or robbery, and say such people do not incline toward mitigating wrath.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The verses say that people who refuse to entertain grievance-thoughts appease
    wrath and live at one again; they also state that hate is made to cease by love
    rather than by hate.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The verses state that even people wounded in deadly strife, robbers, killers,
    and plunderers may become friends with foes, and ask whether Brethren should not
    agree.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The verses advise living with a wise and honest comrade if such a friend is
    found, but choosing solitude if such a friend is not found, using images of an
    abdicated prince and a lone elephant.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: After speaking, the Master fails to reconcile the Brethren, goes to Balakalonakaragama,
    teaches Bhagu about solitude, teaches three youths about concord, dwells three
    months in Parileyyaka forest, and then goes to Savatthi.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The lay folk of Kosambi decide to withhold salutation, respect, and alms from
    the Kosambi Brethren because they believe those Brethren caused the Blessed One
    to go away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Kosambi Brethren, overwhelmed by the lay people's punishment, go to Savatthi
    and ask forgiveness from the Blessed One.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Master identifies the father as King Suddhodana, the mother as Mahamaya,
    and Prince Dighavu as himself.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the frame of the next story, a certain Brother lives in a forest near a
    border village in Kosala, receives meditation instruction from the Master, and
    is given a dwelling-place by local people.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: During the first month of the rainy season, the village is burned down; the
    people lack even seed and cannot supply the Brother's alms-bowl with savoury food.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Although the Brother has a pleasant dwelling-place, distress over alms prevents
    him from entering upon the Path or its Fruition.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Master tells the Brother that an ascetic should lay aside covetous ways,
    be content with whatever food is obtained, and fulfill priestly duties.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Master says that sages of old, born as animals, lived on powdered dust
    from a decayed tree, laid aside greedy desires, stayed where they were, and fulfilled
    the law of love.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the past story, many parrots live in the Himalaya country on the banks
    of the Ganges in a grove of fig-trees.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: A king of the parrots dwells in a fig-tree and, after its fruit is gone, eats
    remaining shoot, leaf, bark, or rind, drinks Ganges water, and remains happy and
    contented where he is.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Because of the parrot king's happy and contented state, Sakka's abode is shaken.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: Sakka sees the parrot and tests his virtue by supernatural power, withering
    the tree into a perforated stump that gives out dust and is buffeted by wind.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: The parrot king eats the dust from the stump, drinks Ganges water, and remains
    perched on the fig-stump, heedless of wind and sun.
  category: action
  evidence_refs:
  - ev:10
