canonical_text:
  quote: ''
  summary: Didactic verses about bracelets, a bird with carrion, and a bull are followed
    by the Bodhisatta's approval of paccekabuddhas whose teachings make him disinclined
    to household life. He tells his wife he will leave, and she also leaves to be
    ordained before him. He cares for the children until they can distinguish kinds
    of cooked and seasoned rice, then becomes ordained. Later he meets the former
    wife as a female ascetic, exhorts her, and they separate permanently. The close
    states his attainment and identifies the birth.
  language: English
  quote_policy: summarized
