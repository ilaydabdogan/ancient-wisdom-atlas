canonical_text:
  quote: ''
  summary: In the Lohakumbhi-Jataka frame, a king of Kosala hears four terrifying
    cries at night. The cries are explained as coming from four beings in Hell, former
    princes of Savatthi punished in iron cauldrons after sexual misconduct. Brahmins
    tell the frightened king to avert danger by a fourfold sacrifice of living creatures
    and prepare a sacrificial pit. Queen Mallika urges the king to consult the Supreme
    Buddha at Jetavana. The Master explains that the cries pose no danger to the king,
    recalls old kings who heard the same cries and released sacrificial victims after
    wise counsel, and begins a bygone story involving Brahmadatta of Benares and the
    Bodhisatta as an ascetic in the Himalaya country.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The king of Kosala heard four cries at night, each consisting of one syllable:
    du, sa, na, and so.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The four cry-makers are described as inhabitants of Hell who had formerly
    been princes in Savatthi and had been guilty of adultery.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: After death, the four former princes came to life again in Four Iron Cauldrons
    and were tortured for sixty thousand years.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: When the four beings reached the top of the cauldrons and saw the rim, they
    wondered when they would escape and cried out one after another.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The king was terrified by the cries and remained unable to move until dawn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: At dawn, brahmins interpreted the sounds as ominous of great violence and
    said they could avert the evil through a fourfold sacrifice of every living creature.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The king ordered living creatures to be taken by fours, including men, bulls,
    horses, elephants, quails, and other birds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The brahmins dug a sacrificial pit, fastened numerous victims to stakes, and
    showed excitement over the food and wealth they expected to gain.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: Queen Mallika asked why the brahmins were happy and, after hearing the king's
    explanation, advised him to consult Great Gotama, the Supreme Buddha.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: The king mounted his state chariot, went to Jetavana, saluted the Master,
    and asked what the four cries meant for him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: The Master said the cries meant nothing for the king and were cries of beings
    in Hell suffering agony.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: The Master said kings of old had heard the same cries, had considered sacrifices
    after consulting brahmins, and had been dissuaded by wise men who told them to
    release the victims.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: In the bygone story, Brahmadatta ruled Benares while the Bodhisatta was born
    in a brahmin family in Kasi, later renounced sensual pleasures, became an ascetic,
    developed meditative powers, and lived in a pleasant grove in the Himalaya country.
  category: sequence
  evidence_refs:
  - ev:5
