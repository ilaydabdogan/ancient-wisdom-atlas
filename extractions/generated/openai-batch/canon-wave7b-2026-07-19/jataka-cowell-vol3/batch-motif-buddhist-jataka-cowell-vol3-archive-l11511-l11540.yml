canonical_text:
  quote: ''
  summary: An admonition urges the king toward virtuous deeds. The king vows to abandon
    anger and pride, accept counsel, and show homage. He descends from the terrace
    and salutes the paccekabuddha, who sits cross-legged in the air and instructs
    him to recognize good Buddhists and Brahmins and to practice gifts, morality,
    and holy-days. Sakka also stands in the air, exhorts the townsfolk, and orders
    by drum proclamation that fled Buddhists and Brahmins return. The king remains
    firm in the admonition and does good works. The Master then declares the Truths
    and identifies the former-birth figures.
  language: English
  quote_policy: summarized
