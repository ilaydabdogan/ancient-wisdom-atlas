canonical_text:
  quote: ''
  summary: The passage first closes a preceding birth story in which a king is freed
    from sorrow by the Bodhisatta's words and rules righteously. It then gives the
    Pitha-Jataka. In the present frame, a country Brother arrives at Jetavana, seeks
    alms from known lay supporters too early, receives nothing, and reviles them.
    The Master contrasts this anger with an old story. In the past, the Bodhisatta,
    an ascetic who had lived in the Himalayas, goes to Benares for necessities and
    alms. A faithful merchant is absent when the ascetic first comes to his door,
    so the ascetic leaves unseen. The merchant later sees him, honors him, takes him
    home, provides a seat, foot-washing, water, and food, and apologizes that a stranger
    went unhonored. The Bodhisatta says he felt no anger. The merchant states his
    family custom of treating every guest as a kinsman. The Bodhisatta teaches him
    his duty, returns to the Himalayas, and the Master identifies the merchant as
    Ananda and the ascetic as himself.
  language: English
  quote_policy: summarized
