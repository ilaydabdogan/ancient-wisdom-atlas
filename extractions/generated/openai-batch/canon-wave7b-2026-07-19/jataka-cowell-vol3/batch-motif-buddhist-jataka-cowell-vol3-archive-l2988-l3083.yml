canonical_text:
  quote: ''
  summary: In the frame story, Sariputta succeeds in obtaining dainty food for sick
    brethren after other attendants fail. The Master says that formerly wise men with
    pleasant speech likewise obtained food. In the old tale, a hunter carrying venison
    meets four rich merchants' sons. Each asks for meat using a different form of
    address, and the hunter gives increasingly better portions according to the gentleness
    or closeness of the words. The youth who calls him friend receives all the venison,
    hosts him, removes him from hunting, and becomes his lifelong friend.
  language: English
  quote_policy: summarized
