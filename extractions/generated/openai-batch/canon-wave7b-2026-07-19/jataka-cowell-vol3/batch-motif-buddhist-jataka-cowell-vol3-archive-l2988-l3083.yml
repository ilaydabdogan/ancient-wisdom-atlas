  text: A deer-stalker filled a cart with venison and returned to the city intending
    to sell it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Four sons of rich merchants met at crossroads outside Benares and noticed
    the cart full of meat.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The first youth asked coarsely for meat and received only skin and bone.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The second youth addressed the hunter as elder brother and received a joint
    of venison.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The third youth addressed the hunter as dear father and received a savoury
