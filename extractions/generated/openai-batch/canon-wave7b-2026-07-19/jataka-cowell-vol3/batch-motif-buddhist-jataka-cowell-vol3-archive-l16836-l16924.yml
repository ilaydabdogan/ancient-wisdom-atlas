canonical_text:
  quote: ''
  summary: A disciplinary dispute between two monks over water left in a vessel escalates
    through pupils into excommunication and a factional schism involving lay supporters,
    sisterhoods, and deities. The Tathagata admonishes both sides, tries procedural
    measures, and cites a royal story in which Dighavu spares Brahmadatta as an example
    of forbearance. When the quarrel persists, he departs and later addresses the
    assembly while poised in the air.
  language: English
  quote_policy: summarized
