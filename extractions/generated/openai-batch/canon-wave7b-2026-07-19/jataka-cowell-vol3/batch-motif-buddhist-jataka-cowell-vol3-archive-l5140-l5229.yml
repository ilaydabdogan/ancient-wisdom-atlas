canonical_text:
  quote: ''
  summary: The Master tells a king that rulers of old listened to the wise, ruled
    justly, and reached heaven. In the old story, the Bodhisatta is a Himalayan ascetic.
    King Brahmadatta, seeking someone who will tell him his faults, travels in disguise
    and visits the ascetic. The ascetic offers a sweet fig and says its sweetness
    comes from the king's just rule. He explains that unjust rulers make foods and
    the whole realm lose flavour. The king tests this by ruling unjustly; when he
    returns, the fig is bitter. The ascetic recites verses comparing a leader to a
    bull whose course is followed by the herd. The king reveals himself, reforms his
    rule, and restores things to their former condition. The Master identifies Ananda
    as the king and himself as the ascetic.
  language: English
  quote_policy: summarized
