  summary: 'A table-of-contents segment lists brief summaries for several Jataka stories:
    an ascetic refuses to lie about sin; a boy with a goblin-given power exposes a
    king’s theft and becomes king; an ascetic resists a proposed living sacrifice
    offered in exchange for marriage to a king’s daughter; animal and human moral
    tales involve greed, seduction, confinement, outwitting, killing, and vengeance.'
