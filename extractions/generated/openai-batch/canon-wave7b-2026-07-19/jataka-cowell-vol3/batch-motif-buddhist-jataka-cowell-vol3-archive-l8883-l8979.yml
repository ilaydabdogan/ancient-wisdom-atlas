canonical_text:
  quote: ''
  summary: The Master warns a king that sons can endanger fathers and tells of a former
    birth in which the Bodhisatta, as a brahmin teacher, foresaw danger to Prince
    Yava from his son. The teacher gave Yava protective stanzas based on observed
    incidents involving a horse, a mouse, a well, and barley. After Yava became king,
    his son plotted to kill him, murdered the slave Musika at the bathing tank, and
    later tried again at the stairs. The king's recitation of the teacher's stanzas
    repeatedly alarmed the plotting son.
  language: English
  quote_policy: summarized
