canonical_text:
  quote: ''
  summary: A prince reaches sixteen. A brahmin reveals that he is not blind, says
    he feigned blindness to save his life, and tells the prince that his true father
    was the king of Benares, murdered and buried by Parantapa after Parantapa sinned
    with the prince's mother. The brahmin shows the bones and teaches the prince to
    use a sword. The prince takes Parantapa to bathe, seizes him as his father had
    been seized, confronts him at the same spot, and kills and buries him. The prince
    returns, reports the killing, reproves his mother, and the group goes back to
    Benares. The Bodhisatta makes the young prince viceroy, and the frame identifies
    former-birth roles.
  language: English
  quote_policy: summarized
