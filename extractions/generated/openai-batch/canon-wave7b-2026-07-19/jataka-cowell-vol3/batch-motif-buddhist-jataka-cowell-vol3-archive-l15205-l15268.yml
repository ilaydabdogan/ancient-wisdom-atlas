canonical_text:
  quote: ''
  summary: The Great Being explains to the king that a gnome's sound came from longing
    memory of a sylph who guided him down a dark mountain. He then explains that an
    eighth ecstatic sound came from a paccekabuddha approaching final Nirvana. The
    king honors the holy body, stops the sacrifice, spares living creatures, proclaims
    no slaughter, holds a festival, burns the body with honor, and builds a stupa.
    The Bodhisatta teaches righteousness, departs to the Himalaya, and the frame identifies
    the birth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Great Being caused a monkey to be set free before questioning the king
    about a gnome in his habitation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Great Being says the gnome made the seventh sound because he remembered
    an episode with his sylph and was in pain of desire.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The gnome and sylph had climbed a high mountain, gathered flowers, descended
    after sunset, and the sylph took the gnome by the hand and warned him not to stumble.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The Great Being says the eighth sound was one of ecstasy made by a paccekabuddha
    connected with the Nandamula cave.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The paccekabuddha intended to enter Nirvana in the king of Benares' park so
    that his remains would be honored and others would attain heaven.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The paccekabuddha's utterance declares the end of birth, no further womb,
    and the end of his last earthly existence and misery.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The paccekabuddha passed into Nirvana at the foot of a sal-tree in full flower.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The king, accompanied by a great army, honored the body with perfumes, flowers,
    and similar offerings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: By the Bodhisatta's advice, the king stopped the sacrifice, spared the creatures,
    and made a drum proclamation that there should be no slaughter.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The king held a sacred festival for seven days, burned the paccekabuddha's
    body with honor on a perfumed pyre, and made a stupa where four high roads meet.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Bodhisatta preached righteousness to the king, exhorted him to diligence,
    went to the Himalaya, practiced the Perfect States, and became destined for Brahma
    Heaven.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the frame conclusion, the Master tells the king there is no danger from
    the sound, tells him to stop the sacrifice, and identifies the birth.
  category: speech
  evidence_refs:
  - ev:8
