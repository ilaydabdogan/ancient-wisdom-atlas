canonical_text:
  quote: ''
  summary: A frame story tells of a seven-year-old boy at Savatthi who can recognize
    and follow footsteps, finding his father after tests. The Master says that recognizing
    tracks on the ground is not remarkable because sages of old recognized steps in
    the air, and begins a past-life story. In that story, a queen of Benares makes
    an oath after sinning and, after death, becomes a horse-faced female Yakkha. She
    dwells in a rock-cave in a forest at a mountain's foot, devours travelers along
    a road, receives leave from Vessavana to eat people within a defined territory,
    and seizes a wealthy brahmin, carrying him into her cave, where contact with him
    produces affection.
  language: English
  quote_policy: summarized
