canonical_text:
  quote: ''
  summary: Sakka, seeing a parrot remain loyally by a dead fig-tree, assumes the form
    of a royal goose and questions the parrot. The parrot explains that gratitude
    and friendship prevent him from abandoning the tree. Delighted, Sakka offers a
    boon; the parrot asks that the tree live and bear fruit again. Sakka reveals his
    supernatural power, dashes Ganges water on the stump, and the tree becomes fruitful.
    The frame concludes with a moral against greed and identifies the parrot king
    with the speaker's former birth.
  language: English
  quote_policy: summarized
