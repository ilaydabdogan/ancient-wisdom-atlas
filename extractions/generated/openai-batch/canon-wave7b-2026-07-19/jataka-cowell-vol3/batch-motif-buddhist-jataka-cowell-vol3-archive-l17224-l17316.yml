canonical_text:
  quote: ''
  summary: In the Harita-Jataka, the Master tells a story to warn a backsliding monk
    about sensual passion. Harita, the Bodhisatta, renounces wealth after reflecting
    on death, becomes an ascetic in the Himalaya, gains meditative attainments, and
    receives royal support in Benares. When the king is away, the queen tends to Harita.
    After Harita sees her when her robe falls, latent passion arises, his meditation
    is lost, and he misconducts himself with her repeatedly. The misconduct becomes
    known; the king questions the queen and then Harita, who resolves inwardly to
    speak the truth rather than preserve his reputation by lying.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master at Jetavana addresses a backsliding Brother and states that sinful
    passion is destructive of virtue, leads to rebirth in hell, and has caused even
    accomplished holy men to fall away from meditation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bodhisatta is born in a wealthy brahmin family and is called Harittacakumara,
    or Young Goldskin, because of his golden complexion.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: After his parents die, Harita reflects that treasure remains while its producers
    cease to exist, fears death, gives great gifts, and enters the Himalaya country
    to adopt the religious life.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the seventh day of his religious life, Harita enters upon the Faculties
    and Attainments and lives for a long time on wild fruits and roots.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Harita descends from the mountain to procure salt and vinegar, reaches Benares,
    stays in the royal park, and goes to the king's palace for alms.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king honors Harita by seating him on the royal couch beneath the white
    umbrella, feeding him, building day and night quarters for him in the park, assigning
    a park keeper to attend him, and supporting him for twelve years.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the king goes to quell a frontier disturbance, he commits Harita to the
    care of the queen and calls him the royal 'Field of Merit'.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The queen prepares Harita's food, bathes in scented water, wears a fine cloth
    tunic, opens the lattice, lies on a couch, and lets the wind play upon her body.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Harita, carrying his alms-bowl and walking through the air, comes to the window;
    when the queen rises at the sound of his garments, her robe falls from her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A sinful feeling long present in Harita's heart rises like a snake lying in
    a box and puts his mystic meditation to flight.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: Harita seizes the queen by the hand, a curtain is drawn around them, he misconducts
    himself with her, eats, returns to the park, and repeats this behavior daily.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The misconduct becomes known throughout the city, and the king's ministers
    send a letter reporting Harita's conduct to the king.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The king returns, asks the queen whether the report is true, then goes to
    Harita and asks whether Harita has led a sinful life.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Harita thinks that the king would believe a denial, but he also thinks there
    is no sure ground like speaking the truth and that one who forsakes truth cannot
    attain Buddhahood even in the sacred enclosure of the Bo tree.
  category: other
  evidence_refs:
  - ev:8
