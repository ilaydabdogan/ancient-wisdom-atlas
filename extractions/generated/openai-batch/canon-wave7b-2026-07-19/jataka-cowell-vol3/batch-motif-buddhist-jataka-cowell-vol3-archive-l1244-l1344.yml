canonical_text:
  quote: '"We are beaten, the victory rests with you."'
  summary: The passage opens the Cullakalinga-Jataka with a Jetavana frame about four
    female ascetics admitted to the religious life. It recounts their disputatious
    Jain parents, their training in many theses, their public challenge at Savatthi
    using a rose-apple branch, Sariputta's defeat of them in debate, their ordination
    and attainment of sainthood, and the Master's transition to an old-world story
    in which Sariputta had formerly helped the same women. The old-world story begins
    by naming Kalinga and Assaka as kings and describing Kalinga as eager for battle.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Master, while living at Jetavana, tells a story concerning the admission
    of four female ascetics to the religious life.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Licchavis of Vesali are described as numerous members of a ruling family
    who are given to argument and disputation.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A male Jain and a female Jain, each characterized as skilled disputants, are
    matched in a disputation and then married by arrangement of the Licchavi chiefs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Four daughters named Sacca, Lola, Avavadaka, and Patacara, and a son named
    Saccaka, are born from the union and are trained in a thousand theses.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The parents instruct the daughters that if a layman refutes them they must
    become his wives, but if a priest refutes them they must take orders from him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After their parents die, the sisters carry a rose-apple branch while wandering
    from city to city for disputation and eventually reach Savatthi.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: At the city gate of Savatthi, the sisters plant the rose-apple branch and
    declare that any layman or priest able to maintain a thesis against them should
    scatter the dust heap and trample the branch.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sariputta orders boys to throw down and trample the bough and to direct the
    planters to the chamber over the gate of Jetavana.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The female ascetics return from alms-round, learn that Sariputta caused the
    branch to be trampled, and go with a large crowd to the monastery gate-tower.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The female ascetics propound a thousand theses to Sariputta; he solves their
    difficulties, asks one question they cannot answer, and gives the answer himself.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: The female ascetics concede defeat, request admission to the religious life
    according to their parents' instruction, are ordained, and shortly attain sainthood.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: The Master states that Sariputta was a refuge to these women in former times
    as well, and that formerly he raised them to the dignity of queen consort.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: The old-world story begins with Kalinga ruling in Dantapura and Assaka ruling
    in Potali; Kalinga is described as strong as an elephant and eager to fight.
  category: setting
  evidence_refs:
  - ev:12
