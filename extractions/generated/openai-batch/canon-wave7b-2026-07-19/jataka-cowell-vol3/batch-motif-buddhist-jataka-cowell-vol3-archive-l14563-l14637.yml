canonical_text:
  quote: ''
  summary: The queen urges the king to practice almsgiving before eating and to rule
    righteously. The king accepts her counsel, asks what former deed produced her
    beauty, and the queen recounts a former birth in which she was a slave at a royal
    court and gave rice to a begging Brother. Both king and queen declare former deeds,
    establish six charity halls, give great gifts, keep moral duties and holy days,
    and are destined for heaven. The Master identifies the queen as the mother of
    Rahula and the king as himself.
