canonical_text:
  quote: ''
  summary: A king reaches a mango tree near the Ganges and orders archers to kill
    the monkeys eating its fruit. The Bodhisatta, as king of the monkeys, uses a bamboo
    shoot and his own body as a bridge so the herd can escape. Devadatta, also a monkey,
    deliberately injures him. The human king, moved by the Bodhisatta's disregard
    for his own life, rescues and tends him. The Bodhisatta explains that he protected
    his herd as their chief and offers the king a lesson about ruling for the welfare
    of kingdom, army, city, and subjects.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king travels upstream by rafts with foresters and stops at a mango tree,
    where a bed, guards, and fires are set up.
