  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The king has the Bodhisatta brought down gently, clothed, washed with Ganges
    water, given sugared water, anointed with refined oil, and laid on a bed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The king asks what relation the monkeys have to the Bodhisatta, noting that
    he made himself a bridge for their safety.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Bodhisatta replies that he guards the herd as their lord and chief, describes
    his crossing and suffering, and gives the king a parable about rulership.
  category: speech
  evidence_refs:
