canonical_text:
  quote: ''
  summary: A landowner grieving his father is taught by the Master through a former-birth
    story. In the old story, young Sujata sees his father grieving at a mound containing
    his grandfather's bones. Sujata places grass and water before a dead ox and addresses
    it as if it could eat. When his father questions this, Sujata compares the dead
    ox with the grandfather's remains, leading his father to recognize impermanence
    and cease grieving. The Master then reveals the Truths, the present landowner
    attains the First Path, and the Master identifies himself as Sujata.
  language: English
  quote_policy: summarized
