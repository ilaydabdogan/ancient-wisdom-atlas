  text: Setaketu answers that the quarters are the four directions, but the candala
    says this is not the intended meaning and puts Setaketu between his feet.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The other pupils report the event to the teacher, and Setaketu remains angry
    and abusive about the candala.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Bodhisatta tells Setaketu not to be angry, calls the candala wise, and
    says Setaketu has not seen, heard, or understood far more than he has.
  category: speech
  evidence_refs:
