  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Setaketu leaves the place, studies all arts at Takkasila, wanders learning
    practical arts, and is ordained by five hundred ascetics near a frontier village.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Setaketu and the ascetics go to Benares; the king is pleased with their deportment,
    gives them food in the palace, and lodges them in his garden.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the king plans to visit, Setaketu orders ascetics to perform penances,
    including swinging, thorn-beds, the five fires, squatting, diving, and repeating
    texts, in order to conciliate the king.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Setaketu sits at the hut door on a chair with a head-rest, places a brightly
