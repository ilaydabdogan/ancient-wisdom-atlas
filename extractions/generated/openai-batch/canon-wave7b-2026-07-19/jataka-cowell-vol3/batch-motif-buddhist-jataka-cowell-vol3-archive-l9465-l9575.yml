canonical_text:
  quote: ''
  summary: In the Seta Ketu Jataka excerpt, the Master introduces a tale about a deceitful
    Brother. In the past, Setaketu, a proud brahmin student of the Bodhisatta, insults
    a candala but is defeated by the candala's question about the meaning of 'quarters'
    and is humiliated. The Bodhisatta admonishes Setaketu and explains alternate meanings
    of the quarters, including parents, teacher, a generous householder, and a final
    blessed state. Setaketu leaves, studies at Takkasila, later joins ascetics, and
    in Benares stages false penances to impress the king. The king admires the ascetics,
    but his family priest warns that learning and Vedas do not save a person without
    just conduct; the king withdraws favor, and Setaketu challenges the priest's statement.
  language: English
  quote_policy: summarized
