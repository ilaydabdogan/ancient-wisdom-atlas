canonical_text:
  quote: ''
  summary: Sattuka threatens to kill Sulasa for her jewels. Sulasa, realizing he will
    not spare her, feigns a final loving embrace and obeisance, gets behind him, and
    throws him down a mountain precipice, killing him. A mountain deity praises her
    wisdom. Sulasa returns to her attendants and goes to the city, and the Master
    identifies the former-birth figures. The next tale opens with the Bodhisatta as
    a king of Benares who gives alms, has a park-keeper named Sumangala, and receives
    a paccekabuddha who has come from the Nanda-mula cave for alms.
  language: English
  quote_policy: summarized
