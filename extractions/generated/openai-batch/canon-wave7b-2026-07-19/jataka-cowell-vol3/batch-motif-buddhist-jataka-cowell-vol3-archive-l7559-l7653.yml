canonical_text:
  quote: ''
  summary: The frame narrative reports discussion of Devadatta's repeated attempts
    to kill the Buddha and introduces a former-birth story. In Benares, king Mahapatapa
    becomes angry when queen Canda, absorbed in maternal affection for her infant
    son Dhammapala, does not rise before him. He orders the child brought for execution.
    The queen pleads that any fault is hers and offers her own hands and feet in the
    child's place, but the king has the child's hands cut off and then orders his
    feet cut off. The infant Bodhisatta endures the mutilation without lament.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Brethren in the Hall of Truth discuss Devadatta's ongoing plots to kill the
    Buddha, including archers, a rock, and the elephant Nalagiri.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master states that Devadatta tried to kill him in former times as well
    as in the present, and recalls the Dhammapala birth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Benares, Mahapatapa is king, and the Bodhisatta is born as the son of queen-consort
    Canda and named Dhammapala.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: When Dhammapala is seven months old, Canda bathes him in scented water, dresses
    him richly, and plays with him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The king sees Canda fail to rise before him, interprets this as pride caused
    by the child, and decides to have the child killed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'The king sits on his throne and summons the executioner, who arrives with
