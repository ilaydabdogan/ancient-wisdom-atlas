  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king orders the executioner to bring Dhammapala from the queen's chamber.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The executioner strikes Canda in the back, snatches the child from her arms,
    and brings him before the king.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The child is laid on a board before the king while Canda stands behind him
    weeping.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the king orders Dhammapala's hands cut off, Canda says the child is only
    seven months old, faultless, and that her own hands should be cut off instead.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The executioner cuts off the child's two hands; the child neither weeps nor
    laments, but bears it with patience, charity, and resignation.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Canda gathers the child's fingertips into her lap, becomes bloodstained, laments,
