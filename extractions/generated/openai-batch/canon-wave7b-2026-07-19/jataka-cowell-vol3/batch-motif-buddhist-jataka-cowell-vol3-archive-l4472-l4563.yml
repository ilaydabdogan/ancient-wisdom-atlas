canonical_text:
  quote: '"Woman cannot be guarded. There is no keeping her safe."'
  summary: In a frame story at Jetavana, the Master addresses a monk troubled by passion
    by recounting a former-birth tale. In the tale, a Garuda king in human disguise
    abducts Queen Kakati to the Garudas' distant dwelling. The king of Benares sends
    the musician Natakuvera to find her; Natakuvera secretly rides in the Garuda's
    plumage, reaches the distant place, meets Kakati, returns, and reveals the route
    in song. The Garuda realizes he has unwittingly served as a go-between, restores
    Kakati to the king, and stops visiting. The Master identifies the monk with Natakuvera
    and himself with the king.
  language: English
  quote_policy: quoted
