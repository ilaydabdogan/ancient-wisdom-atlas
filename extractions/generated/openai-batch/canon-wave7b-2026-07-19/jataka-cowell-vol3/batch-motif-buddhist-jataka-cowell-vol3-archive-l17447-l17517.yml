- id: obs:4
  text: The Bodhisatta was conceived in the womb of the Yakkha by the brahmin, was
    born after ten months, and was fed along with the brahmin by the Yakkha.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: When grown, the son was put inside the cave with his father; on one occasion
    he removed the stone and let his father out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The father told the son that the mother was a Yakkha who lived on human flesh,
    while he and the son were men.
  category: speech
