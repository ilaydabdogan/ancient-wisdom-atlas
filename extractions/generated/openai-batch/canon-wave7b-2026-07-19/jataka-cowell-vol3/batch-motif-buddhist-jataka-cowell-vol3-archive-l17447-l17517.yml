canonical_text:
  quote: ''
  summary: A female Yakkha spares a captured brahmin, makes him her husband, and keeps
    him in a cave sealed by a stone. Their son, the Bodhisatta, learns from his father
    that he and his father are men while his mother is a flesh-eating Yakkha. After
    a failed escape, the son asks his mother the boundaries of her territory, then
    carries his father beyond those limits across a river. The mother begs them to
    return; when they refuse, she gives her son a charm connected with the lore of
    the philosopher's stone, then dies of grief. The son and father perform her funeral
    and return to Benares.
  language: English
  quote_policy: summarized
