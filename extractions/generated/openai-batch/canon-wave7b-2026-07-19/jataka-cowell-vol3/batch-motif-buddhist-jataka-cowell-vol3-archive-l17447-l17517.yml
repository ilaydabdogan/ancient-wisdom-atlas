  text: The son proposed going to the haunts of men, and after the father expressed
    fear, the son promised to take him there.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The son first fled with his father, but the Yakkha caught them and brought
    them back without punishment because of her love for her child.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The son asked his mother the boundary of their ground, and she identified
    landmarks including mountains and a space thirty leagues long and five leagues
    broad.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the mother went to the forest, the son carried his father to the river
    that marked the limit; the mother pursued them but stopped on the bank after they
    had passed beyond her sphere.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The mother begged the father and son to return, but the son refused, saying
    that he and his father were men while she was a Yakkha.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The mother gave the son an invaluable charm connected with the lore of the
