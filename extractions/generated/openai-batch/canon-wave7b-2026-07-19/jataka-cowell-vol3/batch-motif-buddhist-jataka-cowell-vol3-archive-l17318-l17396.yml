canonical_text:
  quote: ''
  summary: Harita, while admitting moral error, maintains truthfulness. The king and
    Harita discuss the inability of ordinary wisdom to master passion, and Harita
    names lust, hate, excess, and ignorance as overpowering passions. Encouraged by
    the king, the Bodhisatta regains concentration and renounces lust. He meditates
    in his hermit hut, enters trance, sits cross-legged in the air, teaches doctrine,
    and departs for the Himalaya, later entering the Brahma world. The Master concludes
    by declaring the Truths, reporting a Brother's attainment of Sainthood, and identifying
    the king as Ananda and Harita as himself.
  language: English
  quote_policy: summarized
