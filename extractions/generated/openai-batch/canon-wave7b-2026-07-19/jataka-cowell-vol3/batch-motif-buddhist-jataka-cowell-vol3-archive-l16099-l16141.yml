  text: The brahmin says the princes’ father destroyed Right, lied, reviled a sage,
    and entered Avici; he tells them they must not dwell there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The brahmin tells the eldest prince to leave by the eastern gate and found
