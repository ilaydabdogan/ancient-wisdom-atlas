canonical_text:
  quote: ''
  summary: 'After the king of Ceti lies and reviles a sage, the crowd and a brahmin
    say he has entered Avici. The brahmin tells the king’s five sons to leave the
    city by different directions and found new cities where specified signs appear:
    a white elephant, a white horse, a lion, a jeweled wheel-frame, and two clashing
    mountains. The princes follow the signs and found cities. The Master identifies
    the king of Ceti with Devadatta and the brahmin Kapila with himself.'
  language: English
  quote_policy: summarized
