- id: obs:3
  text: When the king asks about the treasure's value, the man denies many larger
    amounts and finally says the treasure is only a half-penny.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king offers the man a half-penny and then greater sums, offices, the viceroyalty,
    and finally half the kingdom if he will stay.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
