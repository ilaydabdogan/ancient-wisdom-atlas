  text: A man tells the king that he was living by the south gate with a poor woman,
    who proposed festival amusement and sent him to fetch treasure hidden in a wall
    by the north gate.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man says the woman's words remain in his heart, that hot desire burns
    him, and that he sings because he expects to fetch the treasure and amuse himself
    with her.
  category: attribute
  evidence_refs:
