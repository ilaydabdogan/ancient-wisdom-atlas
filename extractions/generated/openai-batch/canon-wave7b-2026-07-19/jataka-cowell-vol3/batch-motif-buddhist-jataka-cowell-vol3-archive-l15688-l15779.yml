canonical_text:
  quote: ''
  summary: A poor man tells King Udaya that he is driven by desire to fetch a hidden
    half-penny so he can enjoy a festival with a poor woman. The king offers increasingly
    large substitutes and finally grants him half the kingdom. The man, now called
    King Half-penny, later considers killing Udaya to become sole king, but remembers
    Udaya's benefaction, throws down the sword, confesses, and is pardoned. He rejects
    kingship, teaches that desire arises from one's own will and brings pain, entrusts
    the realm to Udaya, goes to the Himalaya, becomes an ascetic, and attains perfect
    insight. The passage ends by introducing a later question about Udaya's stanza
    and the court-barber Gangamala.
  language: English
  quote_policy: summarized
literal_observations:
