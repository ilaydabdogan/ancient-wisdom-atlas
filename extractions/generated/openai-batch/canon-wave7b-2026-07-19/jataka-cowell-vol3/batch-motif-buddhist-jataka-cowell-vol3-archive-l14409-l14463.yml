canonical_text:
  quote: ''
  summary: A frame account says that Mallika's offering of gruel to the Buddha leads
    the same day to her becoming chief queen of the Kosala king. The Buddha then tells
    an old tale in which the poor Bodhisatta offers four portions of sour gruel to
    four paccekabuddhas, performs the donation with water and bowls, prays for release
    from poverty and for omniscience, and rejoices after the recipients depart to
    Nandamula cave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master accepts the offering with his royal bowl; the girl salutes his
    feet with her head and stands aside using her joy as a meditation subject.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master smiles, and when Ananda asks why, he says the girl will become
    the Kosala king's chief queen that day through the fruit of the gruel portions.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Kosala king fights Ajatasattu, flees in defeat, hears the girl's singing,
    and rides toward the flower-garden.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The girl does not run away when she sees the king; she takes hold of the horse's
    bridle near the horse's nose.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king asks from horseback whether she is married, and after learning that
    she is not, dismounts and rests for a while in her lap.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The king brings her into town, later sends a chariot for her, sets her on
    a heap of jewels, anoints her, and makes her chief queen.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The city reports that Mallika attained prosperity because she gave three portions
    of gruel to the Master.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the Hall of Truth, the Brethren discuss Mallika's gruel gift and her same-day
    anointing as queen; the Master responds by introducing an old tale about gruel
    given to paccekabuddhas.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the old tale, the Bodhisatta is born in a poor family, works for wages,
    and obtains four portions of sour gruel for his breakfast.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Bodhisatta sees four paccekabuddhas coming toward Benares to collect alms
    and decides to give them his four portions of gruel.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: He salutes the paccekabuddhas, offers the gruel, and asks them to accept it
    so that he may gain merit for lasting welfare.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: He spreads sand, arranges four seats with broken branches, brings water in
    a leaf-basket, pours the water of donation, and sets four portions of gruel in
    four bowls.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: He prays that the gifts may prevent his rebirth in a poor family and may cause
    his attainment of omniscience.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The paccekabuddhas eat, give thanks, and depart to Nandamula cave; the Bodhisatta
    salutes and feels joy from association with them.
  category: sequence
  evidence_refs:
  - ev:7
