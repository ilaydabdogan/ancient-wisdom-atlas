  quote: ''
  summary: 'The speaker teaches that one should not incur anyone''s hostility. Four
    creatures—a quail, crow, blue fly, and frog—are said to have allied and caused
    the destruction and untimely death of a strong elephant. The stanza draws the
    lesson that quarrelling should be avoided. The speaker then identifies the past-life
    figures: Devadatta was the rogue elephant, and the speaker himself was the leader
    of the elephant herd.'
