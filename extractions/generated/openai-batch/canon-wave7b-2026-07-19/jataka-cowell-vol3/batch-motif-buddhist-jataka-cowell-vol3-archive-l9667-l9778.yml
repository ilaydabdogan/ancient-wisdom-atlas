canonical_text:
  quote: ''
  summary: A righteous king who had forgotten his friend Darlmukha remembers him after
    many years. Darlmukha, now a paccekabuddha, comes miraculously from Nandamulaka
    cave, teaches the king about the dangers of sensual desire, rebirth, birth, and
    the value of ordination. The king first admits attachment to pleasures, then after
    Darlmukha departs through the air, he hands the kingdom to his eldest son, leaves
    for the Himalaya, becomes an ascetic, gains attainments, and is reborn in Brahma's
    heaven. The frame identifies the king with the Buddha in a former birth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bodhisatta ruled righteously but became infatuated by glory, forgot Darlmukha
    for forty years, then remembered him and sought news of his abode.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Darlmukha had become a paccekabuddha and, after reflecting that his friend
    remembered him, decided to preach the law to him and ordain him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Darlmukha went miraculously through the air from Nandamulaka cave to the garden
    and sat on a stone seat like a golden image.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The gardener questioned Darlmukha, learned his identity, and informed the
    king that Darlmukha had arrived.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king came with a retinue to the garden, saluted Darlmukha, and sat beside
    him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Darlmukha asked whether the king ruled righteously, avoided evil courses,
    avoided oppressing the people for money, and did charitable deeds.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Darlmukha told the king that he was old, that it was time to renounce pleasures
    and be ordained, and described sensual pleasures as a morass, mire, terror, vapour,
    and dust.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king replied that he was infatuated, bound, and stained by pleasures,
    loved life, could not deny pleasures, and undertook good works continually.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Darlmukha warned that rejecting the counsel of a pitying friend leads to long
    rebirths within the womb, punishment, and imprisonment by flesh and desire.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Darlmukha described the misery of conception, quickening, and birth, saying
    that mortal beings issue from birth covered with blood and foulness and later
    encounter pain and sorrow.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Darlmukha said he had explained the wretchedness of desires and the blessings
    of ordination, then rose in the air like a golden royal goose and returned to
    Nandamulaka cave by treading on clouds.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Bodhisatta saluted Darlmukha with joined fingers on his head until he
    passed from sight.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Bodhisatta summoned his eldest son, gave him the kingdom, left desires
    while a multitude wept, went to the Himalaya, built a hut of leaves, and was ordained
    as an ascetic.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: After becoming an ascetic, the Bodhisatta gained the Faculties and Attainments
    and at life’s end went to Brahma’s heaven.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: At the end of the lesson, the Master declared the truths and identified the
    king as himself in that former birth.
  category: speech
  evidence_refs:
  - ev:10
