canonical_text:
  quote: ''
  summary: A righteous king in Sovira wishes to give alms to worthy paccekabuddhas
    rather than to greedy recipients. His queen proposes inviting them by the force
    of giving, virtue, and truthfulness, using flowers. After offerings to the quarters,
    flowers sent north reach paccekabuddhas in the Nandamula cave. Seven come through
    the air, receive gifts and requisites from the king and queen, teach about charity,
    virtue, heaven, and nirvana, and return miraculously. The king and queen continue
    giving throughout life; the frame identifies the king as the Buddha in a former
    birth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A king named Bharata is described as reigning in Sovira, practicing the ten
    royal virtues, winning the people, and giving gifts to the poor, wayfarers, beggars,
    suitors, and others.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief queen, Samuddavijaya, is described as wise and full of knowledge.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king thinks that his alms are being consumed by greedy people and wishes
    to give alms to virtuous paccekabuddhas in the Himalaya region.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The queen proposes that flowers be sent by the force of suitable giving, virtue,
    and truthfulness to invite the paccekabuddhas.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king proclaims that the townspeople should keep the precepts, while he
    and his household undertake holy-day duties and give charity.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The king has a gold box of jasmine flowers brought, prostrates with five contacts,
    salutes the quarters, and throws seven handfuls of flowers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: No paccekabuddhas come from the eastern, southern, or western quarters; on
    the fourth day the king salutes the northern quarter.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:8
  text: The flowers sent north fall on five hundred paccekabuddhas in the Nandamula
    cave, and the paccekabuddhas understand that the king has invited them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Seven paccekabuddhas are selected to show the king favor; they come through
    the air and alight at the king's gate.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The king salutes the seven paccekabuddhas, brings them into the palace, honors
    them, feeds them for six days, and on the seventh day he and the queen formally
    offer robes and other requisites.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Elder's thanksgiving compares charity to saving goods from a burning dwelling
    and says that the world is on fire with decay and death as the flames.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: After admonishing the king to be diligent in virtue, the Elder flies upward
    through the palace roof to the Nandamula cave, and the requisites given to him
    fly there with him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The king and queen become full of joy after the Elder's departure.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: Further thanksgiving stanzas say that giving to righteous men helps one cross
    Yama's flood, gain a dwelling in the sky, obtain fruit like seed in fertile soil,
    and reach rebirth, heaven, the Purest State, or Rest through graded duties and
    the Law.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: A paccekabuddha praises eternal nirvana to the king, and the king and queen
    continue giving gifts all their lives and pass through the path to heaven.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: In the frame conclusion, the Master says wise people of old gave gifts with
    discrimination and identifies the king Bharata as himself in a former birth.
  category: speech
  evidence_refs:
  - ev:9
