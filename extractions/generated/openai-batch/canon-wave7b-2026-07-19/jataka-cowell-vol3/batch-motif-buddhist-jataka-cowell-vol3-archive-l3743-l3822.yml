canonical_text:
  quote: ''
  summary: In the KUTIDUSAKA-JATAKA frame narrative, the Master at Jetavana recounts
    how an ill-behaved novice attending Mahakassapa falsely claimed another novice's
    services, was exposed by a bath-water ruse, misused alms from lay supporters,
    resented correction, destroyed vessels, burned the elder's leaf hut, and was reborn
    in Avici. The Master concludes that solitude is preferable to keeping company
    with a fool, citing a Dhammapada stanza.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master tells the story at Jetavana about a young disciple who burned Mahakassapa's
    hut of leaves; the incident is said to have originated in Rajagaha.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mahakassapa lives in a forest cell near Rajagaha and is served by two young
    novices, one serviceable and one ill-behaved.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ill-behaved novice represents services performed by his companion as if
    he had performed them himself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The dutiful novice hides bath water, leaves little or no water in the boiler,
    and thereby exposes the other novice's false report that bath water is ready.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:5
  text: The ill-behaved novice receives the name Rattle-Ladle after a ladle strikes
    the bottom of the empty boiler and makes a rattling sound.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Mahakassapa reproaches the novice, saying that one under religious vows should
    claim an act only when he has actually done it, otherwise it is a deliberate lie.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Rattle-Ladle becomes angry, falsely tells a family of Mahakassapa's supporters
    that the elder is ill, requests food, and eats it himself.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Mahakassapa later reproaches Rattle-Ladle for improper begging and eating
    the food himself.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Rattle-Ladle nurses a grudge, breaks food vessels with a hammer, sets fire
    to the leaf hut, and runs away.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage says Rattle-Ladle becomes a preta while still alive, withers,
    dies, and is born in the Great Hell of Avici.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Brethren from Rajagaha report the arson to the Master at Savatthi.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Master says solitude is better for Kassapa than company with such a fool
    and repeats a stanza warning against fellowship with foolish folk.
  category: speech
  evidence_refs:
  - ev:12
