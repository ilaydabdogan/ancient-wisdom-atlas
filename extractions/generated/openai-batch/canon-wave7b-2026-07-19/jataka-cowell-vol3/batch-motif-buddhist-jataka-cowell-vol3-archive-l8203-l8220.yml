canonical_text:
  quote: ''
  summary: In the Hiri-Jataka excerpt, the Master at Jetavana tells a story concerning
    a rich merchant connected with Anathapindika. The narrator notes that the introductory
    and past stories are given fully in another Birth. In this version, the merchant
    of Benares hears that followers of a foreign merchant lost all their property
    and fled; he explains this as a consequence of their failure to act properly toward
    strangers, and recites verses warning against a friend who is outwardly humble
    but inwardly hostile and rich only in words.
