- id: motif:6
  label: Beautiful divine figure honors outwardly unattractive saint
  taxonomy_refs:
  - wisdom
  basis: The king contrasts Sakka’s beauty with the priest’s unattractive appearance,
    and Sakka answers by emphasizing the status of priests as teachers and saints
