- id: motif:5
  label: Aerial manifestation legitimizes the holy teacher before a ruler
  taxonomy_refs: []
  basis: Sakka appears as a beautiful young Brother with the priest and stands in
    the air at the king’s gate, prompting the king’s question and the subsequent teaching.
  evidence_refs:
