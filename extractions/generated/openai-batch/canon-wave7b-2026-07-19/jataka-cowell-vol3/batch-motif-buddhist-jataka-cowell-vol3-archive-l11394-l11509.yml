candidate_motifs:
- id: motif:1
  label: Divine intervention to restore right teaching in a kingdom
  taxonomy_refs:
  - wisdom
  basis: Sakka sees that the expulsion of religious teachers has harmed the people
    and resolves to destroy the king’s heresy; his teaching leads the king to abandon
    those views.
  evidence_refs:
  - ev:7
  - ev:12
  - ev:13
  confidence: high
  cautions: The available taxonomy term 'wisdom' is broad; the passage presents doctrinal
    and moral correction rather than an abstract wisdom quest.
- id: motif:2
  label: False holy disguise causes persecution of genuine ascetics
  taxonomy_refs: []
  basis: A wizard commits misconduct, appears by day in the disguise of a Brother,
    and the king generalizes from this to punish and expel the Brethren.
  evidence_refs:
  - ev:3
