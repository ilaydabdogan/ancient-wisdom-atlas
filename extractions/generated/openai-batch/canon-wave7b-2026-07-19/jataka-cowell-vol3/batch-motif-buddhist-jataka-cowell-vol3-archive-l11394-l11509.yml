canonical_text:
  quote: ''
  summary: The Master introduces a former-birth tale about the Tathagata acting for
    the world's good. In Benares, a wizard’s misconduct with the chief queen leads
    the king to persecute ascetics after mistaking the culprit for a Brother. Religious
    teachers flee, the people decline morally, and heavenly births cease. Sakka, identified
    as the Bodhisatta, recruits an old paccekabuddha from Nandamula cave, appears
    as a beautiful young Brother, venerates the saint in the air before the king,
    teaches the merit of honoring holy teachers, and causes the king to abandon his
    heretical views.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The frame states that the Master, dwelling at Jetavana, says this was not
    the first time the Tathagata went about for the world's good, and then tells an
    old tale.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old tale is set when Brahmadatta was king in Benares, and the Bodhisatta
    is identified as Sakka.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A wizard uses magic to enter the royal chamber at midnight and corrupt the
    chief queen; she marks his back with five vermilion finger marks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: By day the wizard stands in a cemetery on one foot worshipping the sun while
    disguised as a Brother; when surrounded by the king's men, he uses magic and flies
    away in the air.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After hearing the culprit described as a Brother, the king concludes that
    ascetics wear religious garb by day and misconduct themselves at night, and he
    orders Brethren expelled from his kingdom and punished if found.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The ascetics flee the kingdom of Kasi, leaving no righteous Buddhist or Brahmin
    to preach to the people there.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Without preaching, the people become savage and averse to charity and commandments;
    many are reborn in a state of punishment, and Sakka sees no new gods appearing.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: Sakka reflects on the absence of new gods, identifies the king's expulsion
    of the Brethren as the cause, and resolves to destroy the king's heresy and help
    the king and his subjects.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Sakka asks the paccekabuddhas in Nandamula cave for an old paccekabuddha,
    receives the senior among them, takes his bowl and robes, places him in front,
    and venerates him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Sakka becomes a beautiful young Brother, goes three times around the city,
    and stands in the air at the king's gate with the priest.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: The king asks why the beautiful young Brother venerates the ugly priest and
    holds his bowl and robes.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Sakka says priests stand in the place of teachers, declines to utter the saint's
    name, and identifies himself as Sakka, lord obeyed by thirty gods.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: The king asks what blessing comes from seeing and reverently following a saint
    of perfect merits.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: Sakka answers that one who reverently follows such a saint receives praise
    in this world and is shown the path to heaven at death.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:15
  text: After hearing Sakka, the king gives up his heretical views, praises the vision
    of Sakka and the saint, and says many virtuous deeds will now be done.
  category: sequence
  evidence_refs:
  - ev:13
