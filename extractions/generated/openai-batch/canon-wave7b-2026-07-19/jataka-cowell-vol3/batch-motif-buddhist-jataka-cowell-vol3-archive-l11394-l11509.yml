- id: motif:4
  label: Loss of religious instruction leads to moral decline and bad rebirth
  taxonomy_refs:
  - wisdom
  basis: When no righteous Buddhist or Brahmin remains to preach, the people become
    savage and averse to charity and commandments, and many are reborn in punishment.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage states the causal sequence directly; the broader motif family
