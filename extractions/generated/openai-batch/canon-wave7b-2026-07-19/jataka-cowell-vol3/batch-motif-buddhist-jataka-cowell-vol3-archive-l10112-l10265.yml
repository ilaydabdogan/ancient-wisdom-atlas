canonical_text:
  quote: ''
  summary: Two divine female figures, Kalakanni/Misfortune and Siri/Fortune, dispute
    who should bathe first at Anotatta. The Four Kings decline to decide and refer
    the matter to Sakka, who sets a test involving an unused couch and bed in the
    house of Suciparivara, a Benares merchant identified as the Bodhisatta. Kalakanni
    appears in blue, identifies herself as Misfortune, describes the vicious people
    with whom she dwells, and is dismissed. Siri appears in golden/yellow radiance,
    identifies herself as Fortune, Luck, and Wisdom, and describes the virtuous conduct
    with which she dwells.
  language: English
  quote_policy: summarized
