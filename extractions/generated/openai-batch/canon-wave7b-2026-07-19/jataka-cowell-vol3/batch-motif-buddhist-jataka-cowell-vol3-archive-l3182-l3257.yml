canonical_text:
  quote: But roast with fire my flesh I yield, if thou with us wouldst live.
  summary: A visitor appearing as a brahmin receives food offers from forest animals.
    The wise hare, identified as the Bodhisatta, offers his own body as food so that
    no animal life need be taken. Sakka creates burning coals; the hare shakes off
    insects, leaps into the coals, and is unharmed because the fire is cold. Sakka
    reveals that he came to test the hare's virtue and marks a hare on the moon in
    commemoration.
  language: English
  quote_policy: quoted
