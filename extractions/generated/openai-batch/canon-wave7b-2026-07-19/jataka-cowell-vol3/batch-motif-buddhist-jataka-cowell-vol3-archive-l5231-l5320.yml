canonical_text:
  quote: ''
  summary: The Master tells a Jataka prompted by Devadatta's attempt to imitate the
    Buddha. In the old-world story, the Bodhisatta is a young lion who feeds a jackal.
    The jackal grows proud, ignores the lion's warning, tries to attack an elephant,
    and is crushed. The lion declares that pride caused the jackal's death and teaches
    the value of knowing one's own power. The Master identifies Devadatta with the
    jackal and himself with the lion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master, dwelling in the Bamboo Grove, is said to tell the story in connection
    with Devadatta's attempt to imitate the Buddha.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sariputta reports that Devadatta, while trying to copy the Master, put a fan
    in Sariputta's hand and lay down; Kokalika then struck Devadatta on the breast
    with his knee.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the old-world story, Brahmadatta is reigning in Benares, and the Bodhisatta
    is born as a young lion dwelling in a cave of the Himalayas.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lion kills a buffalo, eats its flesh, drinks water, and returns home;
    a jackal sees him and lies down because he cannot escape.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The jackal asks to be the lion's servant, and the lion accepts him and feeds
    him day by day with meat.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: After growing fat on the lion's leftovers, pride arises in the jackal, and
    he says he will kill an elephant, eat, and bring meat to the lion.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The lion warns the jackal not to pursue the elephant, saying elephant-killing
    is contrary to the jackal's nature and describing the elephant as large, long-tusked,
    huge, and strong.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The jackal leaves the cave despite the warning, cries three times, sees a
    black elephant at the base of the mountain, leaps toward it, and falls at its
    feet.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The elephant crushes the jackal's head with a forefoot and leaves trumpeting.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Bodhisatta stands on the top of the precipice, sees the jackal's death,
    says pride killed the jackal, and recites verses about rash challenge, self-knowledge,
    and discretion.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: At the end, the Master identifies Devadatta as the jackal and himself as the
    lion.
  category: relationship
  evidence_refs:
  - ev:8
