canonical_text:
  quote: ''
  summary: 'A Jataka frame recounts Prince Bodhi blinding the artisan who built his
    unique palace. The Master then tells a former-birth story: the Bodhisatta, as
    a teacher at Takkasila, warns a harsh prince about violent power and the consequences
    of deeds. The prince later becomes king, is urged by the priest Pingiya toward
    universal conquest, captures many kings, fails to take Takkasila, and receives
    advice to mutilate and sacrifice the captives to the guardian deity of a banyan
    tree for victory.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Prince Bodhi commissioned a unique palace called Kokanada and then blinded
    the artisan out of envy and fear that he might build a similar palace for another
    king.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Brethren describe Prince Bodhi as harsh, cruel, and violent; the Master
    says this character also appeared formerly, when he put out the eyes of many warriors,
    killed them, and offered their flesh as a religious sacrifice.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the past story, the Bodhisatta is a world-renowned teacher at Takkasila
    and teaches prince Brahmadatta the three Vedas.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Bodhisatta discerns the prince's harsh and violent character and warns
    him that power gained by violence is short-lived.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The admonitory stanza says that each person fares according to his deed and
    reaps according to what he sows.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After returning to Benares, the prince becomes viceroy and then king; his
    family priest Pingiya, also described as harsh and cruel, urges a plan for the
    king to become sole monarch and Pingiya sole priest.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king conquers rulers across India, has a thousand captive kings in his
    train, and then attempts to seize Takkasila, which the Bodhisatta has fortified.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The king camps by a large banyan tree on the banks of the Ganges and asks
    Pingiya what to do when Takkasila cannot be taken.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Pingiya advises blinding the thousand captive kings, cutting open their bodies,
    offering their flesh and ritual substances to the guardian deity of the banyan,
    and filling a ring around the tree with blood so victory will follow.
  category: speech
  evidence_refs:
  - ev:7
