canonical_text:
  quote: ''
  summary: A prince becomes king and gives a woman the title of queen consort without
    honouring her. The Bodhisatta prompts her to speak before the king; she recalls
    that in the forest he selfishly ate a roasted lizard. The Bodhisatta counsels
    against remaining with one who gives no love or honour. The king repents, acknowledges
    the queen's virtues, grants her authority, and rewards the wise man. The Master
    then identifies the birth-story roles.
  language: English
