  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Putimansa-Jataka is introduced as a story told at Jetavana concerning
    the subjugation of the senses, at a time when many Brethren kept no guard over
    the avenues of the senses.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Master tells the Brethren not to set their affections on mental or physical
    attributes under the influence of personal beauty and warns that dying in such
    a state leads to rebirth in hell and similar evil states.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Master says the Brethren’s proper domain includes the four earnest meditations,
    the holy eightfold path, and the nine transcendent conditions; in that domain
    Mara will not find an entrance.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Master says that those subject to passion and regarding things under the
