canonical_text:
  quote: ''
  summary: The passage ends one Jataka episode with verses condemning involvement
    with a woman, then shows a demon or Asura thanking the Great Being for saving
    him, receiving moral instruction, releasing the woman, and returning to the forest.
    The Master concludes the lesson and identifies a past ascetic as himself. The
    next Jataka, Putimansa-Jataka, opens at Jetavana with the Master admonishing monks
    to guard the senses, avoid attachment to beauty, remain in their proper spiritual
    domain, and learn from the example of the jackal Putimansa. The past story begins
    with wild goats living in a mountain-cave during Brahmadatta’s reign in Benares.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A verse-speaker says he tended a woman carefully day and night, compares this
    care to a forest hermit cherishing a flame, names her “Wanton,” and says she sinned.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The verses state that women’s wiles allure careless souls toward doom and
    that a man who shuns the path of womankind finds happiness in solitude.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A demon falls at the feet of the Great Being and praises him, saying the holy
    sir saved his life and that a wicked woman nearly caused him to be killed by a
    magician.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Bodhisatta tells the demon to do no harm to the woman, tells him to keep
    the commandments, and establishes him in the five moral precepts.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Asura says he guarded the woman in his belly but could not keep her safe;
    he lets her go and returns to his forest home.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Master proclaims the Truths, a worldly-minded Brother attains fruition
