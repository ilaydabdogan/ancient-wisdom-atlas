canonical_text:
  quote: ''
  summary: A king agrees to give a spell or charm although he says doing so will kill
    him, and he goes by chariot intending to enter fire afterward. Sakka sees the
    danger, takes Suja to Benares, and transforms them into a he-goat and a she-goat
    visible only to the king and the yoked asses. A Sindh ass criticizes the goat,
    and the goat replies by exposing the folly of the ass and of Senaka/the king.
    The goat counsels the king that preserving life is paramount, reveals himself
    as Sakka, and advises a stratagem that prevents the queen from obtaining the charm.
    The frame conclusion identifies the former births.
  language: English
  quote_policy: summarized
