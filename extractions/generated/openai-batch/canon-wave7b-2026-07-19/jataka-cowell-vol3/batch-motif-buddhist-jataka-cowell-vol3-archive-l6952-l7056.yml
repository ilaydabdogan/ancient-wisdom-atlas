canonical_text:
  quote: ''
  summary: 'The passage concludes a Jataka episode in which a king who blinded and
    killed other kings suffers the loss of both his own eyes, recognizes the result
    as corresponding to his deeds, dies, and is reborn in hell. The passage then begins
    the Uraga-Jataka frame: the Master consoles a landowner grieving for his dead
    son by teaching universal impermanence and recounts a past birth in which the
    Bodhisatta, a brahmin householder, instructed his family to give alms, keep moral
    discipline, and contemplate death.'
  language: English
  quote_policy: summarized
