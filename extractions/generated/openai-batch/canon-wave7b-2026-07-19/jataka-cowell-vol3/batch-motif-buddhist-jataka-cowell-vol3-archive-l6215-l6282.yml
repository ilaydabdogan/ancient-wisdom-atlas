canonical_text:
  quote: ''
  summary: At Jetavana, the Master addresses discussion of a slothful Brother by telling
    a former-birth tale. In Benares, the Bodhisatta is a valued minister to a slothful
    king. In the king's garden they see a slow tortoise; the Bodhisatta questions
    it about escaping a forest fire. The tortoise says holes and chinks in trees would
    be refuge, or else it would die. The Bodhisatta uses the exchange to teach proper
    timing in rest and haste, and the king ceases to be indolent. The Master identifies
    the slothful Brother as the tortoise and himself as the wise councillor.
  language: English
  quote_policy: summarized
