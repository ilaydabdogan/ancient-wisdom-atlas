canonical_text:
  quote: ''
  summary: A king hires a youth, identified as the Bodhisatta, who claims skill in
    tracking stolen property even after many years. The family priest proposes testing
    him, and the king and priest secretly remove jewels, trace a complex route through
    palace spaces, walls, ladders, the Hall of Justice, the city, and a tank, and
    hide the treasure in the tank. The next day the Bodhisatta follows their traces,
    including footsteps described as being in the air, recovers the treasure, and
    indirectly indicates that the thieves are distinguished persons nearby. When pressed
    to identify them directly, he refuses and begins an old tale about the dancer
    Patala, who while drunk enters a river with a lute around his neck and begins
    to sink as his wife lets go and stands on the bank.
  language: English
  quote_policy: summarized
