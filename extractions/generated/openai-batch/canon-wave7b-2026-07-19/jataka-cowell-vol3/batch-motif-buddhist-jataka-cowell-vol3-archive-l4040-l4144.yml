canonical_text:
  quote: ''
  summary: The Master reproves monks for importunate begging and tells of a former
    birth in which the Bodhisatta, an ascetic guest of a North Pancala king, delayed
    for twelve years before asking privately for only single-soled shoes and a leaf
    parasol, explaining that both begging and refusing may cause tears if done publicly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master, dwelling near Alavi, questions and reproves brethren about living
    by importunity in asking and begging for alms.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master introduces an old-world example of wise men who avoided making
    a desired request publicly.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bodhisatta is born into a brahmin family in a market town and later studies
    the arts at Takkasila.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After becoming an ascetic, the Bodhisatta dwells in the Himalaya country and
    lives on wild fruits and roots.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Bodhisatta goes among human settlements for salt and vinegar, reaches
    a North Pancala city, lodges in the king's garden, and begs alms at the king's
    gate.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king is pleased with the Bodhisatta's conduct, seats him on a dais, feeds
    him royal food, and assigns him lodging in the garden.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the end of the rainy season, the Bodhisatta wishes to return to the Himalayas
    and thinks he needs a pair of single-soled shoes and a parasol of leaves for the
    journey.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Bodhisatta asks for a private audience because he thinks a requester and
    a refuser may both weep, and he does not want people to see this.
  category: speech
  evidence_refs:
  - ev:4
  - ev:8
- id: obs:9
  text: The Bodhisatta repeatedly fails to state his request, and twelve years pass.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The king interprets the long silence as possible longing for worldly pleasures
    or sovereignty and offers the Bodhisatta anything, beginning with the kingdom.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Bodhisatta asks only for single-soled shoes and a leaf parasol.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Bodhisatta explains that he requested secrecy to avoid public tears and
    recites stanzas about prayer bringing either a gift or refusal.
  category: speech
  evidence_refs:
  - ev:8
