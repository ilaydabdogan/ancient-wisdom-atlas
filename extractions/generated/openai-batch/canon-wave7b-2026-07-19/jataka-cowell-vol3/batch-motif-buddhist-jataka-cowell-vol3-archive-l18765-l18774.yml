canonical_text:
  quote: ''
  summary: A king tiger declares that a villain deserves death, kills him with his
    teeth, digs a pit, and throws the body into it. Young brahmins return, do not
    find the partridge, and leave in grief. The Master concludes the lesson by saying
    that Devadatta had formerly tried to kill him too, and identifies the former-birth
    characters with Devadatta, Kisagotami, Moggallana, Sariputta, Kassapa, and himself
    as the learned partridge.
  language: English
