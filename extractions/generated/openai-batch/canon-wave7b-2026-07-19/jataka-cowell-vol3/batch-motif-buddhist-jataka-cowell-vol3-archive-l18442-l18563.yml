  evidence_refs:
  - ev:5
- id: obs:11
  text: Veni later tells Melamata that Putimansa revived when she appeared and asks
    her to come with a well-filled bowl to renew friendship.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Melamata thinks Veni is trying to deceive her and answers that she will come
