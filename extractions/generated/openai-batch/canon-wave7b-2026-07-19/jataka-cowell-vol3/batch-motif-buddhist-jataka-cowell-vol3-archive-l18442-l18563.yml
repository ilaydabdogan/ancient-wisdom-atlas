canonical_text:
  quote: ''
  summary: On the Himalayan slopes, the jackal Putimansa and his wife Veni prey on
    goats until only the wise she-goat Melamata remains. Putimansa plans to feign
    death while Veni lures Melamata to mourn and bury him, but Melamata sees him raise
    his head and flees. After the jackals blame each other, Veni tries again by claiming
    Putimansa has revived; Melamata answers with a counter-plan, saying she will arrive
    with a large dog escort, which frightens Veni.
  language: English
  quote_policy: summarized
