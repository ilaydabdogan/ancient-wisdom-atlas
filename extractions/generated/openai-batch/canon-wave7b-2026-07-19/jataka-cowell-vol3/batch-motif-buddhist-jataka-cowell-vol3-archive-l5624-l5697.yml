canonical_text:
  quote: "“You thought, no one knows what I am about.”"
  summary: A prince repeatedly attempts to kill his father the king, first with poison
    and then with a sword. The king’s speeches cause the prince to fear that his plots
    are known. After hiding beneath the king’s couch, the prince surrenders and is
    imprisoned. After the king dies, the prince is released and enthroned. The Master
    presents the episode as a lesson about justified suspicion and identifies the
    far-famed teacher at Takkasila as himself in a former birth.
  language: English
  quote_policy: quoted
