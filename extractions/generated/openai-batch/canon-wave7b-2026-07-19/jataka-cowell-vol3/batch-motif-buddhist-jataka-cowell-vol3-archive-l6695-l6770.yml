canonical_text:
  quote: ''
  summary: The passage introduces Book V and No. 351, Manikundala-Jataka. The Master
    tells of a councillor's misconduct in the Kosala king's harem. In the birth-story,
    the Bodhisatta is king of Benares; a wicked councillor brings in the king of Kosala,
    who seizes Kasi and imprisons the Bodhisatta. The Bodhisatta develops ecstatic
    meditation, sits cross-legged in the air, and the marauding king feels fierce
    heat. In response to the king's question about his lack of grief after losing
    royal and family pleasures, the Bodhisatta teaches impermanence and righteous
    conduct. The Kosala king gains forgiveness, restores the kingdom, and leaves.
    The Master identifies Ananda as the Kosala king and himself as the king of Benares.
  language: English
  quote_policy: summarized
