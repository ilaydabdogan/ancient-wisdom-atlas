canonical_text:
  quote: ''
  summary: A brahmin honored by a king tests whether virtue or learning is more important
    by taking coins from the royal treasury until he is arrested. He explains his
    test, concludes that virtue is superior, renounces lay life, receives ordination
    from the Master, and attains spiritual fruition. The Master then tells a past-life
    story in which the Bodhisatta, as a learned brahmin and royal priest, makes the
    same test, praises virtue above learning, birth, caste, beauty, and social standing,
    and becomes an ascetic in the Himalaya region, destined for the Brahma-world.
  language: English
  quote_policy: summarized
