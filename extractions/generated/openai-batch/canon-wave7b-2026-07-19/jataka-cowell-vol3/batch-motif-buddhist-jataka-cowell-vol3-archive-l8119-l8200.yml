  text: A king gives the brahmin special honor because of his reputation for virtue,
    and the brahmin wonders whether the honor is due to virtue or learning.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The brahmin takes a coin from the royal treasury on three occasions; the treasurer
    is silent twice and has him arrested on the third occasion.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Before the king, the brahmin says he is not habitually a thief and that he
    took the coins in order to test virtue against learning.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: After concluding that virtue is more efficacious than learning, the brahmin
    leaves lay life, goes to Jetavana, asks for ordination, receives orders, gains
