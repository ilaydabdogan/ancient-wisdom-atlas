  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the past story, the Bodhisatta is born in a brahmin family, learns the
    liberal arts at Takkasila, returns to Benares, and is made family priest by King
    Brahmadatta.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Bodhisatta keeps the five moral precepts, is respected by the king as
    virtuous, and wonders whether that respect is for virtue or learning.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The past story is said to correspond to the present instance, and the brahmin
    declares in verses that virtue is better than learning, form, birth, caste, and
    social rank.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: After praising virtue, the Great Being gains the king's consent, goes to the
    Himalaya region, adopts ascetic life, develops Faculties and Attainments, and
    becomes destined for birth in the Brahma-world.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Master identifies himself as the one who, in the past, tested virtue and
