canonical_text:
  quote: ''
  summary: The Master tells a Jataka story about a poor old doctor who deceives the
    Bodhisatta into seizing a snake by calling it a hedgehog, hoping to profit by
    curing a bite. The Bodhisatta throws the snake away; it lands on the doctor, bites
    him fatally, and the tale is explained as a moral example of evil recoiling on
    the one who intended it.
  language: English
  quote_policy: summarized
