canonical_text:
  quote: ''
  summary: In the Brahatta/Chatta Jataka excerpt, the king of Benares conquers Kosala
    and buries the seized treasure in his garden. Prince Chatta of Kosala escapes,
    studies, becomes leader of ascetics, gains access to Benares, discovers the buried
    treasure by a spell, removes it, fills the pots with grass, and returns to Savatthi
    to recover his kingdom. The king of Benares grieves over the grass-filled pots,
    and the Bodhisatta, his adviser, questions and interprets his lament in verse.
  language: English
  quote_policy: summarized
