canonical_text:
  quote: ''
  summary: At Jetavana, the Master explains the loss of heretics' gain and glory by
    telling a former-birth story. In Baveru, where there are no birds, merchants first
    sell a foreign crow, which is honored and richly fed. Later they bring a trained
    royal peacock; the people buy and honor it more highly, and the crow loses its
    food and status. The stanzas explicitly compare the crow's loss to the loss of
    offerings by heretics after the Buddha preaches the law. The Master identifies
    Jain Nathaputta with the crow and himself with the royal peacock. The passage
    then begins the next story, mentioning Anathapindika and a past example of almsgiving
    despite Sakka's opposition.
  language: English
  quote_policy: summarized
