canonical_text:
  quote: ''
  summary: A man undertakes only half of a fast-day observance, refuses to break it
    despite mortal pain, sees royal splendour, wishes for royalty, dies, and is reborn
    as Prince Udaya. Later, as King Udaya, he questions a poor water-carrier who is
    joyfully walking through severe heat to fetch a hidden half-penny; the man replies
    that desires and urgent tasks burn more than the sun.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man asks a merchant whether the fast can still be kept after the proper
    morning start, and the merchant says only half the duty can be done.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The man undertakes the half fast-day duty in his master's presence and lies
    meditating on the precepts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When he suffers severe pain after taking no food, he refuses remedies or food
    and says he will not break the fast even if it costs his life.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: At sunrise he is losing consciousness, is considered dying, and is placed
    in a retired place.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king of Benares arrives in a noble chariot with a large retinue; seeing
    the royal splendour, the Bodhisatta desires royalty and prays for it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After dying, he is conceived again in the womb of the chief queen, explicitly
    because of keeping half the fast-day.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The queen bears a son named Prince Udaya; he later remembers previous births
    and his former meritorious action, becomes king, and repeatedly sings a song of
    ecstasy.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A city festival is prepared, and a large crowd is intent on amusement.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: A water-carrier has hidden a half-penny in a brick in a boundary wall; his
    poor female partner also has a half-penny, and they plan to spend their combined
    penny on festival pleasures.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The water-carrier sets out to fetch his hidden half-penny, walking at midday
    over intensely hot sand while singing for joy.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: King Udaya sees the singing man from a high palace window, wonders at him,
    sends for him, and has him brought by force when he dismisses the summons.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The king asks why the heat of earth, sun, and sand does not burn him while
    he sings; the water-carrier answers that desires and pressing tasks burn, not
    the sun.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
