canonical_text:
  quote: ''
  summary: The Master, dwelling at Jetavana, praises lay followers for keeping holy
    days and says such days should include almsgiving, moral precepts, freedom from
    anger, kindness, and duties. He introduces an old tale set in Benares under King
    Brahmadatta, where the wealthy merchant Suciparivara and his household regularly
    kept holy days. The Bodhisatta, born poor, is hired as a wage worker without being
    told of the household rule about precepts. On a festival holy day, the household
    and other workers eat early and fast, while the Bodhisatta works all day unaware.
    At sunset the cook-maid offers him water and rice; he asks where everyone is and
    learns they are all keeping the fast.
  language: English
  quote_policy: summarized
