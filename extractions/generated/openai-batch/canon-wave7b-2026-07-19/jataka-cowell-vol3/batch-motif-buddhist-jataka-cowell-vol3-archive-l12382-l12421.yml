canonical_text:
  quote: ''
  summary: 'A jackal benefits from the strife of otters over a fish, brings the fish
    to his wife, and explains that conflict made the otters lose their prize. A Buddha
    wisdom stanza generalizes the lesson: when people quarrel, they seek an arbiter,
    their wealth declines, and rulers gain. The Master then identifies the birth roles:
    the jackal was Upananda, the otters were two old men, and the witnessing tree-spirit
    was himself.'
  language: English
  quote_policy: summarized
