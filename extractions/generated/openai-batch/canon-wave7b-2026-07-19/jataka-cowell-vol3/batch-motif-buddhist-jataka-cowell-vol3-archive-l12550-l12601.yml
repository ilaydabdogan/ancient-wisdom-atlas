canonical_text:
  quote: ''
  summary: The passage opens with the close of a previous Jataka, where the Master
    declares the Truths and identifies former-birth figures with present disciples
    and himself. It then introduces No. 402, Sattubhasta-Jataka, told at Jetavana
    concerning the Perfection of Wisdom. In the past, King Janaka reigns in Benares,
    and the Bodhisatta is born as the brahmin youth Senaka. Senaka studies at Takkasila,
    becomes Janaka's minister, and teaches him moral and religious duties. The kingdom
    holds decorated fast-day assemblies where Senaka preaches. A poor old brahmin
    obtains a thousand pieces, deposits them with a brahmin family, and returns to
    find the money spent. Unable to repay him, the family gives him their daughter
    as wife. The young wife, dissatisfied, commits adultery with another young brahmin.
    The passage then begins a didactic list of sixteen things that cannot be satisfied,
    beginning with the sea and rivers.
  language: English
  quote_policy: summarized
