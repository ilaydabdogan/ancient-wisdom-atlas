canonical_text:
  quote: ''
  summary: 'The passage ends one Jataka episode in which the Bodhisatta, as an ascetic,
    refuses royal cattle and material pleasures, accepts only shoes and a leaf parasol,
    exhorts the king, and departs to the Himalayas. It then gives the Cammasataka-Jataka:
    a leather-clad mendicant mistakes a ram''s drawing back for homage, is butted
    and dies. The Master says the same kind of event happened in the past, when a
    leather-clad mendicant similarly trusted a ram; a wise merchant warned him, but
    the ram struck him and he died. The Master identifies the past mendicant with
    the present leather-coated man and himself with the wise merchant.'
  language: English
  quote_policy: summarized
