canonical_text:
  quote: '"Someday danger will come upon us owing to the fruit of this tree falling
    on the water"'
  summary: The passage closes a prior birth identification, then introduces the Mahakapi-Jataka.
    In Jetavana, the Master says the Tathagata has long done good works toward relatives.
    In the old tale, the Bodhisatta is born as a strong monkey and lives in the Himalaya
    with eighty thousand monkeys near a riverbank mango tree, or banyan according
    to another report. He foresees danger from fruit falling into the Ganges and has
    the waterward branch cleared, but one hidden ripe fruit falls into the river,
    is caught in the net of the bathing king of Benares, is identified and tasted,
    and causes the king to desire the source tree.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: At the close of the preceding birth identification, the Master identifies
    the Videha ascetic as Ananda and the Gandhara king as himself.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Jetavana, monks discuss the supreme Buddha doing good works toward his
    relatives, and the Master says this has happened before and begins an old-time
    tale.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: During Brahmadatta's reign in Benares, the Bodhisatta is born from a monkey's
    womb, grows strong, and lives in the Himalaya with a retinue of eighty thousand
    monkeys.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Near the Ganges bank stands a mango tree, though others say it was a banyan,
    with deep shade, thick leaves, and large sweet fruits of divine fragrance and
    flavour.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: While eating fruit with the monkey troop, the Bodhisatta thinks that danger
    will someday come because fruit from the tree falls into the water.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: To prevent fruit remaining on the branch over the water, the Bodhisatta has
    the monkeys eat or throw down the flowers from an early stage of growth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: One ripe fruit, hidden by an ant's nest and unseen by the monkeys, falls into
    the river and sticks in the net above the bathing king of Benares.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Fishermen drawing the net see the unknown fruit, show it to the king, and
    the king has foresters called to identify it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: After the foresters identify the fruit as a mango, the king cuts it, has the
    foresters taste it first, eats it himself, and gives portions to his seraglio
    and ministers.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The mango's flavour pervades the king's body, and, desiring that flavour,
    he asks where the tree stands and hears that it is on a river bank.
  category: attribute
  evidence_refs:
  - ev:10
