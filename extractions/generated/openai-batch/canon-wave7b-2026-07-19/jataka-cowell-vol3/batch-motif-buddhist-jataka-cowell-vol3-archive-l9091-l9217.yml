canonical_text:
  quote: ''
  summary: 'A woman betrays her husband to a robber because she desires the robber.
    The robber, fearing she will betray him too, takes her ornaments and abandons
    her across a flooded stream. Sakka sees her weeping, comes with Matali and Pancasikha,
    and arranges a demonstration in animal forms: jackal, fish, and bird. The jackal
    loses both meat and fish, and the woman laughs at him, but the jackal/Sakka rebukes
    her for not seeing her own loss of both husband and lover. Sakka shames her and
    returns to his abode.'
  language: English
  quote_policy: summarized
