canonical_text:
  quote: ''
  summary: The Master hears monks praise Rahula and says Rahula had these virtues
    in a former birth. In the past, the Bodhisatta becomes an ascetic and dwells near
    a frontier village. A fowler keeps a trained partridge in a cage and uses its
    cry to lure other partridges to death. The captive partridge worries whether it
    is guilty when its kinsfolk die after hearing its cry, especially because the
    fowler strikes it when it remains silent. When the fowler sleeps at the Bodhisatta's
    hermitage, the partridge asks the ascetic to resolve its doubt. The Bodhisatta
    teaches that no guilt attaches where there is no evil intention and the creature
    plays only a passive part. The partridge is freed from remorse. The Master identifies
    Rahula as the partridge and himself as the ascetic.
  language: English
  quote_policy: summarized
