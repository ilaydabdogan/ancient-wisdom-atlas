canonical_text:
  quote: ''
  summary: In the Kokalika-Jataka, the Master tells a framed birth-story at Jetavana.
    In Benares, the talkative king Brahmadatta has a valued minister, the Bodhisatta,
    who seeks an illustration to curb the king's talkativeness. In the royal garden,
    a cuckoo egg in a crow's nest is hatched and fostered by a female crow; the young
    cuckoo cries prematurely, is recognized as not the crow's offspring, killed, and
    thrown from the nest at the king's feet. The Bodhisatta uses the event to teach
    that untimely and excessive speech brings harm, while the sage speaks with measured
    counsel. The king becomes more restrained in speech, and the Master identifies
    Kokalika as the young cuckoo and himself as the wise minister.
  language: English
  quote_policy: summarized
