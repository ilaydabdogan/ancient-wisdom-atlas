canonical_text:
  quote: ''
  summary: 'A present-time frame describes a rough ferryman who delays and inconveniences
    a country Brother crossing the Aciravati. The Master says the man was rough in
    the past also and tells an old tale: the Bodhisatta, born as a brahmin and later
    an ascetic, advises King Brahmadatta to rule without anger and refuses a large
    reward. After leaving Benares, he reaches a Ganges ferry run by the foolish Avariyapita,
    who takes passengers across before asking for fare. The Bodhisatta offers advice
    as the fare, teaching the boatman to ask payment before crossing and never to
    be angry. The boatman rejects the advice and assaults the ascetic.'
  language: English
  quote_policy: summarized
