canonical_text:
  quote: ''
  summary: The passage first presents speakers who do not grieve for the dead because
    lamentation cannot alter death; Sakka questions a handmaid, praises the household
    for dwelling on death, rewards them with treasures, and instructs them in almsgiving
    and moral observance. The Master then closes that birth story. A new Jataka begins
    with a frame story about a minister imprisoned by the king of Kosala who attains
    the First Path and says that good came through evil. In the past-life story, Prince
    Ghata, the Bodhisatta, rules righteously, is betrayed through a banished minister
    and imprisoned by King Vanka, enters ecstatic meditation while seated in the air,
    and teaches Vanka that sorrow is useless and desire insatiable. Vanka asks forgiveness
    and restores the kingdom; Ghata renounces rule, becomes a Himalayan ascetic, and
    is destined for Brahma-world birth.
  language: English
  quote_policy: summarized
