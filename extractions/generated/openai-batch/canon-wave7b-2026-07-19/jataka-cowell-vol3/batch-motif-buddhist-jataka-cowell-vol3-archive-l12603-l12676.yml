canonical_text:
  quote: ''
  summary: A dissatisfied brahmin wife sends her husband to beg for money to obtain
    a maid. Returning with money and provisions, he leaves a meal-sack open near water;
    a black snake from a hollow tree enters it. A tree spirit warns him that stopping
    will cause his death, while going home that day will cause his wife's death. Fearful
    and weeping, he comes to Benares during wise Senaka the Bodhisatta's preaching.
    Senaka notices his distress, promises to free him from sorrow, and asks him to
    explain; the brahmin states the conditional warning.
  language: English
  quote_policy: summarized
