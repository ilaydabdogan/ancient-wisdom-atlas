canonical_text:
  quote: ''
  summary: The king sends Narada with foresters to bring the holy man to the Himalayas.
    Kesava recovers after seeing Kappa and receiving simple unsalted broth. Narada
    questions why Kesava prefers Kappa's hermitage and coarse food to royal care and
    rich fare. Kesava answers that the place, trees, and Kappa's words please him,
    and that food is best when accompanied by love. The Master then identifies the
    former-birth figures with Ananda, Sariputta, Bakabrahma, and himself.
  language: English
  quote_policy: summarized
