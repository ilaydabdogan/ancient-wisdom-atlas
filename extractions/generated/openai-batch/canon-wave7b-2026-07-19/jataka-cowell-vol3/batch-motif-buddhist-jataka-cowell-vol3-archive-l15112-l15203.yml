canonical_text:
  quote: ''
  summary: A young brahmin tells the king that an ascetic in the royal garden can
    explain troubling sounds. The king asks the ascetic, who says there is no danger
    and identifies successive sounds as cries or laments from a hungry crane, a distressed
    crow, a trapped wood-insect, a caged cuckoo, a tame deer, and a captive monkey.
    The king or the Great Being arranges remedies for several of them, including food
    or water, protection, and release.
  language: English
  quote_policy: summarized
