canonical_text:
  quote: ''
  summary: The Buddha rebukes monks for lustful thoughts and tells an old tale. King
    Karandu sees a fruit-laden mango tree stripped and damaged because of its fruit,
    contrasts it with a barren tree that remains unharmed, reflects on household and
    religious life, attains paccekabuddha-hood, assumes the marks of a monk, preaches
    from the air, and goes through the sky to the Nandamula cave in the Upper Himalaya.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master observes that five hundred ascetic friends dwelling in the House
    of the Golden Pavement have lustful thoughts at midnight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master gathers the brethren through Ananda and says it is not right to
    live under the power of sinful thoughts, because a growing sin brings great ruin.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bodhisatta is born in a potter's family near Benares, becomes a householder,
    has a son and daughter, and supports his family by pottery.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: King Karandu, riding to his garden on an elephant, sees a mango tree laden
    with fruit and takes a bunch of mangoes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the king takes fruit, ministers, brahmins, and householders take mangoes,
    climb the tree, beat it with clubs, break branches, and leave no fruit, not even
    unripe fruit.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At evening the king sees that the once beautiful fruit-laden tree has become
    damaged and unattractive.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king sees another barren mango tree and reflects that the fruitful tree
    suffered misfortune while the barren tree remained beautiful.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The king compares household life to the fruitful tree and religious life to
    the barren tree, and wishes to be like the barren tree.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Taking the fruit-tree as his subject, the king considers the three properties,
    perfects spiritual insight, and attains paccekabuddha-hood.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The king declares to his ministers that he is not a king but a paccekabuddha.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The ministers describe paccekabuddhas as shaven, robed in yellow, unattached
    to family or tribe, and dwelling in the Nandamula cave in the Himalaya.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The king touches his head, the marks of a householder disappear, and the marks
    and requisites of a priest appear on his body.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Standing in the air, the newly declared paccekabuddha preaches to the multitude
