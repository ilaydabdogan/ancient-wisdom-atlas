canonical_text:
  quote: ''
  summary: While ploughing with his son, the Bodhisatta’s son sets fire to rubbish;
    smoke angers a snake in an anthill, which bites and kills him. The Bodhisatta
    lays the body under a tree, reflects on impermanence, and sends word for the household
    to come with food, clean garments, perfumes, and flowers. The family performs
    the cremation without lamentation. Sakka perceives their virtue through heat in
    his throne, comes to the funeral pyre, and questions the father, mother, sister,
    and wife about their refusal to weep. The father, mother, and sister answer with
    verses on death and the futility of lament; the passage ends before the wife’s
    response is given.
  language: English
  quote_policy: summarized
