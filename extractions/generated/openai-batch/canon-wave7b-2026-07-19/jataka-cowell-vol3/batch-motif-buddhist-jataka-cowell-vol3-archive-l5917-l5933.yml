canonical_text:
  quote: ''
  summary: Sakka asks why the Bodhisatta gives alms. The Bodhisatta says he seeks
    neither Sakkahood nor Brahmaship but omniscience. Sakka expresses delight, restores
    the Bodhisatta's prosperity, creates wealth in his house, instructs him to give
    alms daily, and returns to his own abode. The Master then identifies the figures
    in the former birth.
