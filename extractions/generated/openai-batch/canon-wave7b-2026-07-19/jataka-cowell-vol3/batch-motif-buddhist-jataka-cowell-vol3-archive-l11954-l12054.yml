canonical_text:
  quote: ''
  summary: The Master tells a former-birth story about a brother who keeps bad company.
    In the tale, the Bodhisatta is a lion whose son Manoja befriends the jackal Giriya
    despite warnings. Giriya urges Manoja to steal royal horses; Manoja ignores his
    father's counsel, is shot by the king's archer, is abandoned by Giriya, and dies
    at his den. His family laments the ruin caused by wicked companions, and the Master
    identifies the former-birth figures with present Buddhist figures.
  language: English
  quote_policy: summarized
