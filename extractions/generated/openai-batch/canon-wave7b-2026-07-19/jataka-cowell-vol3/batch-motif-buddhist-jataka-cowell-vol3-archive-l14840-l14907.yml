canonical_text:
  quote: ''
  summary: The Master, dwelling at Jetavana, tells a story about a layman who supports
    his aged mother. After his father dies, the man cares for his mother with personal
    services and food. His mother urges him to marry so that his wife can help and
    he can attend to household duties; he resists but marries when she arranges the
    match. The wife first imitates his care for the mother, then becomes proud and
    tries to alienate him from her through false complaints and deliberate mistreatment
    involving food, bath water, bedding, and household dirt. The son refuses to abandon
    his weak mother and tells the wife to return to her kin if she cannot live with
    her. Afraid of separation, the wife reconciles and resumes caring for the mother.
    The lay brother later reports this to the Master, who says that in a former time
    he had cast out his mother at his wife’s bidding and had then taken her back because
    of the Master.
  language: English
  quote_policy: summarized
