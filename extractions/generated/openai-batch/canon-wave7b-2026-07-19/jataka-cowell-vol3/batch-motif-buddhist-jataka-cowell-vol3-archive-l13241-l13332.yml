canonical_text:
  quote: ''
  summary: Two former kings, Gandhara and Videha, have renounced their kingdoms and
    become ascetics. After dwelling in Himalaya and living on fruits, they descend
    for salt and vinegar and are hosted by villagers. Videha stores surplus salt for
    a later day, and the Bodhisatta, identified with the Gandhara ascetic, rebukes
    him for renewed attachment. Videha objects to the rebuke, but the Bodhisatta defends
    corrective speech as righteous discipline. Videha accepts correction, asks pardon,
    and later receives instruction in mystic meditation; both continue meditation
    and are destined for the Brahma world.
  language: English
  quote_policy: summarized
