canonical_text:
  quote: ''
  summary: In the Jetavana frame, the Master addresses a backsliding Brother whose
    difficulty is attributed to desire, and introduces an old tale. In the tale, young
    Brahmadatta becomes king and his friend Mahadhana, a rich merchant's son, maintains
    a daily paid relationship with a courtesan. When Mahadhana arrives one evening
    without the usual thousand pieces and promises double payment the next day, the
    courtesan refuses him and orders her maids to cast him out. Disgusted, he leaves
    lay life, goes to the forest, and becomes a meditative ascetic on the Ganges bank.
    The king compels the courtesan to find him and bring him back; she apologizes,
    and he forgives her but refuses to return, saying he would go only when impossible
    events occur.
  language: English
  quote_policy: summarized
