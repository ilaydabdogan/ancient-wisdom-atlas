canonical_text:
  quote: ''
  summary: People accuse a king of blaming another after he himself put treasure in
    a tank. They kill the king and priest with sticks and clubs, then anoint the Bodhisatta
    and place him on the throne. The Master explains the story by contrasting ordinary
    recognition of footprints on earth with sages of old recognizing them in the air,
    and identifies the former births.
  language: English
