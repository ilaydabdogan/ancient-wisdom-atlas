canonical_text:
  quote: ''
  summary: The Master introduces an old tale to explain a monk's backsliding through
    attachment to his former wife. In the past, King Maddava of Benares has a wise
    counsellor, Senaka. The son of the king's household priest falls in love with
    the chief queen; the king gives her to him for seven days, but the two flee together.
    The king becomes gravely ill from grief. Senaka recognizes the illness as mental
    and arranges a palace-yard display in which a sword-swallower prompts a lesson
    from the wise men about the difficulty of giving up what one has promised to give.
  language: English
  quote_policy: summarized
