canonical_text:
  quote: ''
  summary: Sama lives only with a robber, who fears her treachery and plans to escape
    with her ornaments. During a garden outing he renders her unconscious in a thicket,
    steals her ornaments, and flees. Sama recovers, adopts signs of grief and abstinence,
    and hires actors to search for him by singing a message. The actors find him in
    a border-village, but he refuses to return, saying she would betray him. Sama
    resumes her former way of life. The Master then reveals the Truths and identifies
    the figures of the former birth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sama accepts nothing from any other man and spends her time with the robber
    only.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The robber fears that Sama may fall in love with someone else, have him killed,
    and take pleasure with another man.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The robber decides to flee and to take some of Sama's ornaments rather than
    leave empty-handed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The robber proposes a garden outing; Sama prepares food, puts on all her ornaments,
    and goes with him in a close carriage.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In a thicket of kanavera bushes, the robber pretends affection, squeezes Sama
    until she becomes insensible, strips her ornaments, bundles them, leaps over the
    garden wall, and escapes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After regaining consciousness, Sama asks her attendants where her young lord
    has gone and concludes that he fled in alarm because he thought she was dead.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sama vows not to rest on a sumptuous couch until she sees him again, lies
    on the ground, avoids comely garments, eats only one meal, and gives up scents
    and wreaths.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Sama hires actors with a thousand pieces of money and instructs them to visit
    villages, towns, and cities, gather crowds, sing a song, and bring back the robber
    or send her a message.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The actors leave Benares, gather people in different places, and eventually
    arrive at a border-village where the robber has been living.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The actors sing that Sama has awakened from her swoon and lives for the robber.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The robber doubts that Sama is alive and uses a comparison with fierce winds,
    a mountain, and the firm earth to say that seeing the dead alive would be a greater
    marvel.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The actors answer that Sama is not dead, would wed no other lord, fasts from
    all meals but one, and loves the robber alone.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The robber refuses to return whether Sama is alive or dead, saying her fancy
    roves and that she would betray him if he did not flee.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The actors report the robber's response to Sama; she is full of regrets and
    returns to her old course of life.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: After the lesson, the Master reveals the Truths; the worldly-minded Brother
    attains fruition of the First Path; the Master identifies the Brother as the former
    rich merchant's son, Sama as the wife he had left, and himself as the robber.
  category: sequence
  evidence_refs:
  - ev:8
