canonical_text:
  quote: ''
  summary: Two Jataka episodes are framed as teachings to a greedy Brother. In the
    first, the Bodhisatta is a quail who explains to a greedy crow that contentment
    and ease of mind make him thrive on rude grass and seeds. In the second, the Bodhisatta
    is a pigeon living in a merchant's kitchen; a crow associated with him is plucked,
    covered with flour, given a cowrie around his neck, and later rejected by the
    pigeon before dying. In both cases the crow is identified with the greedy Brother
    and the Bodhisatta with the wiser bird.
  language: English
  quote_policy: summarized
