canonical_text:
  quote: ''
  summary: An old mother, expelled from her son's household after accusations by her
    daughter-in-law, prepares a mortuary offering for 'Right' because she believes
    moral order must be dead. Sakka, identified as the Bodhisatta, descends disguised
    as a brahmin, declares that Right cannot die, threatens punishment, and then grants
    the old woman's plea for family reconciliation. The son and daughter-in-law seek
    forgiveness, bring her home, and the story closes with a Jataka birth-identification.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man initially tended his mother after his father's death, but later
    accepted his wife's accusation and told his mother to live elsewhere.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother obeyed weeping, went to a friend's house, worked for wages, and
    made a difficult living.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the mother left the house, the daughter-in-law conceived and bore a
    son, and she said the old woman's absence explained the birth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old woman concluded that Right must be dead because those who beat and
    cast out a mother seemed to have gained a son and comfort.
  category: speech
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:5
  text: The old woman took ground sesame, rice, a little pot, and a spoon to a cemetery
    of corpses.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the cemetery she kindled a fire under an oven made with three human skulls,
    bathed in water, washed her garment, loosened her hair, and began washing rice.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Bodhisatta was Sakka, king of heaven, and saw the old woman making a death-offering
    to Right during his survey of the world.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sakka came down disguised as a travelling brahmin and asked the old woman
    why she was cooking sesame and rice in a cemetery.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The old woman answered that the sesame and rice were not for food but for
    a sacrifice to the memory of dead Right.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Sakka replied that Perfect Right can never die.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The old woman said wrongdoers now receive prosperity and described herself
    as beaten, displaced, and made an outcast while her son's wife bore a son.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Sakka said he had come for the old woman's sake and threatened that the offender
    and her son would become ashes in his flame.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The old woman asked Sakka that her children and their son live with her in
    amity rather than be destroyed.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Sakka granted her wish, appeared in divine apparel, stood in the air by supernatural
    power, and promised that her son and daughter-in-law would ask forgiveness and
    take her home.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: By Sakka's power the son and daughter-in-law remembered the old woman's goodness,
    found her near the cemetery, fell at her feet, obtained pardon, and returned home
    with her.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The closing verses state that Indra pacified the household strife and that
    the son and grandson tended Katiyani well.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: The Master declared the Truths and identified the birth, saying that the man,
    wife, and Sakka of the past corresponded to present figures, with Sakka identified
    as himself.
  category: speech
  evidence_refs:
  - ev:10
