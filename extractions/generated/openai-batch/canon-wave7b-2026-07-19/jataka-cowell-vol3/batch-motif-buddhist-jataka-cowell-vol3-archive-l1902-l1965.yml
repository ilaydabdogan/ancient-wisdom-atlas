canonical_text:
  quote: '"I find there is no such thing as secrecy in wrong-doing."'
  summary: The Bodhisatta, born in a brahmin family and studying under a renowned
    teacher, is tested along with other pupils. The teacher asks the students to steal
    dresses and ornaments secretly for his daughter's marriage. The other pupils steal
    and bring items, but the Bodhisatta refuses, saying that wrongdoing cannot truly
    be secret. The teacher reveals the request was a test of virtue and gives his
    daughter in marriage to the Bodhisatta, while the other pupils return what they
    stole. The Buddha identifies Sariputta as the teacher and himself as the wise
    youth.
  language: English
  quote_policy: quoted
