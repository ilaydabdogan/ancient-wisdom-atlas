canonical_text:
  quote: ''
  summary: A former servant who had offered four portions of gruel to four paccekabuddhas
    is reborn as a prince of Benares, remembers the deed, becomes king, and publicly
    explains that his royal wealth and status are the fruit of that almsgiving. His
    queen asks for the meaning of his repeated song of joy, and he recounts the former
    offering before a public assembly.
  language: English
  quote_policy: summarized
