canonical_text:
  quote: ''
  summary: A frame story at Jetavana introduces an old tale about a Bodhisattva ascetic
    in the Himalayas, an Asura demon who abducts a noble lady and keeps her in a box
    swallowed in his belly, the lady's concealment of the son of Vayu in the same
    box, the ascetic's revelation of the hidden pair, and the magician's escape after
    the demon disgorges the box.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master, while at Jetavana, addresses a worldly-minded Brother who admits
    that he is hankering after the world.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master says that women are wicked and ungrateful and introduces an old
    tale about Asura demons who swallowed women but could not keep them faithful to
    one man.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the old tale, the Bodhisattva gives up sinful pleasures, enters the Himalayas,
    lives as an ascetic on wild fruits, and develops faculties and attainments.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An Asura demon lives near the ascetic, sometimes listens to the Law, and also
    catches and eats people on a forest high road.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Asura demon attacks the escort of a noble lady, the escort flees, and
    the demon carries the woman to his cave and makes her his wife.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Asura demon brings the woman food, ripe fruit, robes, and ornaments.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: To keep the woman safe, the Asura demon places her in a box, swallows it,
    and guards her in his belly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At a tank, the demon disgorges the box, takes the woman out, bathes and dresses
    her, and lets her enjoy open air while he bathes nearby.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The son of Vayu, described as a magician and carrying a sword, walks through
    the air.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The woman signals the magician to come down, places him in the box, and then
    gets into the box over him, covering him with her garment before the demon returns.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Asura demon swallows the box without examining it and goes to visit the
    ascetic, who perceives that there are two people in the demon's belly and greets
    three visitors.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The ascetic explains that the demon's wife is enclosed in the box in the demon's
    belly and is with the son of Vayu.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The demon fears that the magician's sword might rip open his belly, so he
    disgorges the box.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: When the box is opened, the magician mutters a spell, seizes his sword, and
    springs into the air; the demon then praises the Great Being's clear vision.
  category: sequence
  evidence_refs:
  - ev:9
