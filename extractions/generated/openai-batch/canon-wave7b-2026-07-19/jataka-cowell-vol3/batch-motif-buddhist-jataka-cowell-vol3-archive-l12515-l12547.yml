canonical_text:
  quote: ''
  summary: A king, troubled after giving his queen to a priest's son, asks wise Senaka
    whether any deed is harder. Senaka answers that giving a charitable gift, small
    or great, and not regretting it afterward is harder. The king reflects on his
    own attachment, his sorrow leaves him, he praises Senaka above other answerers,
    and rewards him with wealth.
