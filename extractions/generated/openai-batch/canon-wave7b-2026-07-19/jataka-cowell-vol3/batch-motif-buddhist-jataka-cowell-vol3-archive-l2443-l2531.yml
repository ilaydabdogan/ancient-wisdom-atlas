canonical_text:
  quote: 'Beware a danger yet unseen: suspect before too late'
  summary: The passage tells a frame story in which Moggallana drives away a robber
    from his hut, followed by a former-birth story in which the Bodhisatta, as a Nimb-tree
    spirit, warns a robber away from the tree because the robber's capture there would
    lead people to cut the tree for a stake or hanging branch. The Bo-tree deity recognizes
    the wisdom of suspecting unseen danger.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The frame narrative is set while the Master is dwelling in the Bamboo-Grove
    and concerns the venerable Moggallana.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A robber who has broken into a house flees with plunder and lies down at the
    entrance of Moggallana's leaf hut.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Moggallana notices the robber, suspects his character, decides not to have
    dealings with him, and drives him away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Men with torches follow the robber's track, identify places where he came,
    stood, sat, and fled, but fail to find him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Master says Moggallana is not the only one to suspect in a case where
    suspicion is justified, and introduces a story of the past.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the past story, while Brahmadatta reigns in Benares, the Bodhisatta is
    born as the spirit of a Nimb-tree in a cemetery grove.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Two old trees, a Nimb-tree and a Bo-tree, stand in the cemetery grove.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: A robber guilty of theft enters the cemetery grove, places stolen goods at
    the foot of the Nimb-tree, and lies down there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The narrative states that robbers caught at that time were tortured by impalement
    on a stake made from the Nimb-tree.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Nimb-tree spirit reasons that if the robber is captured there, people
    will cut a branch from the Nimb-tree, make a stake, impale the robber, and destroy
    the tree.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Nimb-tree spirit tells the robber to arise and leave before the king's
    men take him, frightening him away.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Bo-tree deity asks what difference it would make to the Nimb-tree spirit
    if the robber were caught red-handed.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Nimb-tree spirit explains to the Bo-tree deity that the king's men would
    take a branch from the sacred tree and use it as an impalement stake.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The owners of the stolen property follow the trail with torches, find where
    the robber had lain, and say they would impale or hang him at the Nimb-tree if
    they caught him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: After hearing this, the Bo-tree spirit states that one should beware an unseen
    danger and suspect before it is too late.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: The Master identifies Sariputta as the Bo-tree spirit and himself as the Nimb-tree
    spirit in the former birth.
  category: relationship
  evidence_refs:
  - ev:11
