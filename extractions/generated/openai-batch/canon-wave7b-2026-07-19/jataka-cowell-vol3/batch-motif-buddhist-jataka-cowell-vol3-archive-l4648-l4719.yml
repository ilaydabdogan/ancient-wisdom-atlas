canonical_text:
  quote: All impermanent existences are of this kind.
  summary: A Bodhisatta and his former wife renounce wealth and live as ascetics.
    After she dies from illness near Benares, bystanders lament, but the Bodhisatta
    teaches that all compounded life is impermanent and that loss is inevitable. Funeral
    rites are performed; he returns to the Himalayas, attains higher meditative knowledge,
    and is destined for birth in the Brahma-world. The frame identifies the former
    figures and reports the sermon’s effect.
  language: English
  quote_policy: quoted
