  text: The Master tells the tale while dwelling at Jetavana, concerning temptation
    by the wife from one's former days.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young man of good family at Savatthi hears the Master's preaching, resolves
    to become an ascetic, gives his house and property to his wife and children, and
    is ordained by the Master.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: As a junior monk among many Brethren, he receives inferior seating and poor,
    insufficient food.
  category: attribute
  evidence_refs:
