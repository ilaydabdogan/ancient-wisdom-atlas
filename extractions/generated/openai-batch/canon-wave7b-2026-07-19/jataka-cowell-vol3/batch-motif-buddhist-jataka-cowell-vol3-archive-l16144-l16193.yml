    captivated by the flavors and cannot leave her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wife decides to test his affection by seating a clay-cleansed countryman
    and companions in her house, giving them food and drink, setting bullocks and
    a cart ready at the door, and cooking cakes in a back room.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the husband stands at the door, an old servant reports an elder at the
    door; the wife first orders him saluted and sent on, then recognizes him as the
    father of her sons and feeds him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The wife tells him that he is now a saint, that no proper householder's life
    can exist without a master, and that she will take another house and go far into
    the country.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The husband says he cannot leave her, asks her not to go, says he will return
    to worldly life, and asks her to send a layman's garment so he can give up his
    bowl and robes.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Brother returns to the monastery, gives his bowl and robes to his teachers
    and instructors, explains that he cannot leave his wife, and is taken against
    his will to the Master.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Master asks whether the report is true and who causes him to backslide;
    the Brother answers that it is his wife. The Master says that the same woman caused
    him formerly to fall from four stages of mystic meditation and become miserable,
    and that through the Master he recovered the lost meditation.
  category: speech
  evidence_refs:
  - ev:7
