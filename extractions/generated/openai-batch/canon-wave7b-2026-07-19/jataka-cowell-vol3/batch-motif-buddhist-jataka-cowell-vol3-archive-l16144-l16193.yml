canonical_text:
  quote: ''
  summary: 'Frame narrative for the Indriya-Jataka: while at Jetavana, the Master
    tells a story concerning temptation by a former wife. A young man from Savatthi
    leaves household life, gives his property to his wife and children, and is ordained.
    As a junior monk he receives poor food, but his former wife replaces it with better
    food, and he becomes attached. She tests his attachment by staging a household
    departure with a countryman and a prepared cart, then tells him she will go away
    because household life needs a master. He declares that he cannot leave her and
    will give up his bowl and robes to return to worldly life. His teachers take him
    to the Master, who says the wife is the cause of his backsliding and that she
    also caused a former fall from meditation before the Master restored him.'
  language: English
  quote_policy: summarized
