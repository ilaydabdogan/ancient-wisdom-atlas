  quote: "“Virtue,” he'll say, and “Virtue” aye, / But he eats our eggs and young."
  summary: A bird king secretly observes a crow who poses as virtuous but eats the
    birds’ eggs and young. The king exposes him before the flock, denounces his hypocrisy,
    and the birds kill the crow. The Master identifies the crow as a deceitful Brother
    and the bird king as himself in a former birth.
