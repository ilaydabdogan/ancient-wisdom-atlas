canonical_text:
  quote: ''
  summary: 'Karandiya repeatedly throws large stones into a cave. When questioned
    by his teacher, he says he is trying to level the whole earth by filling hollows
    and flattening hills. The brahmin teacher replies that no mortal can level the
    earth. Karandiya uses this as an analogy: if such a task is impossible, the teacher
    should not expect all heretics or other people to adopt his views. The teacher
    accepts the admonition, praises Karandiya, and the Birth is identified.'
  language: English
  quote_policy: summarized
