canonical_text:
  quote: ''
  summary: 'In the Kukkuta-Jataka, the Master addresses a monk longing for the world
    and tells of the Bodhisatta as a cock who avoids a she-cat that has eaten the
    other cocks and tries to lure him down by offering marriage. The cock recognizes
    her danger, rebukes her, and she leaves. Moral stanzas praise alertness in crisis,
    and the Master identifies the cock as himself. The supplied passage then begins
    the Dhammaddhaja-Jataka: a deceitful Brother is introduced, and an old tale begins
    in which the Bodhisatta is a bird on a sea island. A shipwrecked crow arrives,
    pretends to be holy, preaches virtue, and eats the eggs and young entrusted to
    him by the birds.'
  language: English
  quote_policy: summarized
