canonical_text:
  quote: ''
  summary: In the Sujata-Jataka frame, the Master reconciles King Pasenadi of Kosala
    and Queen Mallika after a court quarrel. He then tells a former-birth story in
    which the Bodhisatta, as minister and adviser to the king of Benares, reconciles
    the king with Queen Sujata, a former jujube seller whom the king had elevated
    to chief queen and then angrily threatened to dismiss. The passage ends with the
    Birth identification and begins the next Jataka, where Ananda grieves over the
    Master's impending death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A court dispute occurred between Queen Mallika and the king; the king became
    enraged and ignored her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master knew about the dispute, resolved to make peace, entered Savatthi
    with five hundred brethren, and came to the palace gate.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king received the Master, poured the Water of Donation on the hands of
    the Brotherhood with Buddha at their head, and brought rice and cakes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Master covered his bowl and asked the king where the queen was.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king said the queen's head was turned by honour; the Master replied that,
    after bestowing honour on her, it was wrong for the king to get rid of her instead
    of tolerating her offence.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king sent for the queen; she ministered to the Master; the Master told
    them to live together in peace, and from that day they lived happily together.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Brethren discussed how the Master had reconciled the king and queen by
    a single word; the Master said he had also done so formerly and began an old story.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the old story, when Brahmadatta was king at Benares, the Bodhisatta was
    his minister and temporal and spiritual adviser.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The king saw and heard the daughter of a fruiterer standing with a basket
    of jujubes on her head and calling out to sell ripe jujubes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The king fell in love with the fruiterer's daughter, learned that she was
    unmarried, sent for her, and raised her to the dignity of chief queen.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Queen Sujata saw the king eating jujubes in a golden dish and asked what the
    egg-shaped red fruit was and where it grew.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The king became angry, reminded Sujata that jujubes were the special fruit
    of her own family trade, accused her of pride, and declared she would no longer
    be his wife.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Bodhisatta thought no one except himself could reconcile the pair and
    advised the king to forgive the queen because the king himself had made her great.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The king accepted the Bodhisatta's word, put up with the queen's offence,
    restored her to her former position, and thereafter they lived amicably together.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: 'The Master identified the former-birth figures: the king of Kosala was the
    king of Benares, Mallika was Sujata, and the Master himself was the Minister.'
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:16
  text: At the opening of the next story, the Master is described as on the bed of
    death; Elder Ananda, overwhelmed with sorrow, leans on a monkey-head bolt of a
    garden store-room and weeps.
  category: sequence
  evidence_refs:
  - ev:12
