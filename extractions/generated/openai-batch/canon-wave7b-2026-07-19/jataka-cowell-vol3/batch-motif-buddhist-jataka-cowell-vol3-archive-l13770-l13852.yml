canonical_text:
  quote: ''
  summary: 'In the frame story, Bhaddavatika, King Udena''s aged she-elephant, appeals
    to the Buddha after losing the honors once given for her service. The Buddha admonishes
    Udena that gratitude to former servants should not be withdrawn in old age, and
    the king restores her honors. The Master then introduces an old tale: in Benares,
    King Dalhadhamma once honored a powerful she-elephant for messenger and battle
    service, but after she grew old he withdrew her honors and gave her to a potter
    for dung-cart labor. The elephant appeals to the Bodhisatta, then a valued minister,
    recounting her former services and present helplessness.'
  language: English
  quote_policy: summarized
