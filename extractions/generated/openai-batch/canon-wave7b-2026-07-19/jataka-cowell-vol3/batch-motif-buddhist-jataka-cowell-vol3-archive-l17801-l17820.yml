canonical_text:
  quote: ''
  summary: A youth tells the king that a ruler should protect the people as a son
    cares for an aged father, but that the present danger has arisen from the king
    himself. The king demands that the youth produce the thief or be treated as the
    thief. The youth asks whether the king truly wants the thief caught, says he will
    announce it before the assembly, and then addresses the gathered people in stanzas
    about safety becoming fear, a plundered realm complaining of king and priest,
    and refuge becoming bane.
  language: English
  quote_policy: summarized
