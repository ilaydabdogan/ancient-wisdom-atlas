canonical_text:
  quote: ''
  summary: In Benares, the Bodhisatta is born as the wealthy merchant Visayha, whose
    large-scale almsgiving shakes Sakka’s heavenly abode. Fearing that Visayha’s merit
    will displace him, Sakka removes the merchant’s wealth and servants. Visayha and
    his wife continue trying to give alms; Visayha mows and sells grass, gives all
    the proceeds to beggars, fasts, and collapses. Sakka appears and urges him to
    stop giving, but Visayha rebukes Sakka by recalling that Sakka himself attained
    his station through almsgiving and moral discipline.
  language: English
  quote_policy: summarized
