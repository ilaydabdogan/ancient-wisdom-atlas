canonical_text:
  quote: ''
  summary: The passage closes a Jataka episode in which wise Senaka, the Bodhisatta,
    refuses payment, gives a brahmin money, predicts the brahmin's wife's misconduct,
    and later exposes her lover as the thief of the hidden money through a staged
    hospitality test. The Master then declares the Truths and identifies the former-birth
    figures. The passage also begins the next Jataka with a frame at the Aggalava
    shrine near Alavi about regulations for building cells and the reluctance of former
    non-Buddhist priests to ask for alms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the Bodhisatta answers a question, a snake-charmer makes a mouth-band
    for a snake, catches it, and releases it in the forest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A brahmin praises King Janaka for seeing wise Senaka, then praises the Bodhisatta
    and offers seven hundred pieces, saying he owes him his life and his wife's welfare.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Bodhisatta says wise men cannot accept a wage for reciting poetry and
    instead causes a full thousand pieces to be given to the brahmin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After learning that the brahmin was sent by his young wife, the Bodhisatta
    says she is committing sin with another and advises the brahmin not to go straight
    home with the money, but to leave it outside the town at the root of a tree or
    somewhere similar.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The brahmin hides the pieces at a tree root, returns home in the evening,
    and finds his wife with her lover; she recognizes his voice, puts out the light,
    opens the door, and moves the lover to the doorway.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: When the wife learns where the money is hidden, she tells her lover, and he
    takes the pieces as his own treasure.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: When the brahmin reports the missing pieces, the Bodhisatta asks about a brahmin
    friend of the wife and devises a seven-day entertainment test with decreasing
    numbers of invited brahmins to identify the man repeatedly chosen by the wife.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The repeatedly invited brahmin is brought to the Bodhisatta; he first denies
    taking the money, then becomes afraid and confesses after Senaka says he will
    make him fetch the pieces.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Bodhisatta asks the husband whether he will keep his wife or take another;
    the husband chooses to keep her, and the Bodhisatta restores the pieces, punishes
    the thief and the wife, and honors the brahmin by making him dwell near himself.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: After the lesson, the Master declares the Truths; many attain the fruition
    of the First Path, and the birth is identified with the brahmin as Ananda, the
    spirit as Sariputta, the assembly as the church of Buddha, and wise Senaka as
    the Master himself.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The next Jataka begins with the Master dwelling at the Aggalava shrine near
    Alavi, speaking to the Brethren about regulations for building cells and saying
    that before a Buddha was born, priests of other religions did not ask for alms
    even when kings offered them a choice.
  category: setting
  evidence_refs:
  - ev:11
