canonical_text:
  quote: '"that which is breakable is broken"'
  summary: The Master addresses a landowner grieving for his dead wife and teaches
    that grief should not be held over what is breakable. He introduces an old tale
    in which the Bodhisatta and Sammillabhasini, both desiring ascetic life, are married
    against their wishes after a golden image is used to find a matching bride; they
    live together chastely, and after the Bodhisatta's parents die they prepare for
    renunciation together.
  language: English
  quote_policy: quoted
