canonical_text:
  quote: ''
  summary: The passage frames the Cetiya-Jataka as a story told after Devadatta is
    said to have spoken falsely, sunk into the ground, and become destined for Avici.
    In the old tale, King Apacara of Ceti possesses aerial movement, angelic guardians,
    and fragrant bodily signs. A dispute over the family priesthood leads the king
    to propose using a lie to make the younger claimant senior. In a primordial age
    when people do not know what a lie is, a crowd gathers to witness it. The ascetic
    Kapila arrives through the air, confronts the king, and warns that lying destroys
    right and brings ruin and evil rebirth.
  language: English
  quote_policy: summarized
