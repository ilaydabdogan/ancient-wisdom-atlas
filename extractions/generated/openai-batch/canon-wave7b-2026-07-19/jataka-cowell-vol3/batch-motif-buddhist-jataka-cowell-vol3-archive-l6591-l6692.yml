canonical_text:
  quote: ''
  summary: The passage frames a Jataka as a lesson against slander. In the old legend,
    the Bodhisatta is a righteous king. A cow and a lioness, and later their offspring,
    become close forest friends. A forester reports the marvel to the king, who warns
    that a third animal would cause trouble. A jackal then divides the friendly lion
    and bull with slander so that they destroy one another, after which the jackal
    eats their flesh. The king gives verses warning that slander, like a sharp two-edged
    sword, separates old friends, while those who refuse to heed slander thrive. The
    Master identifies himself as the king.
  language: English
  quote_policy: summarized
