canonical_text:
  quote: Hear both sides first, then judgment true declare.
  summary: The passage contains the Rathalatthi-Jataka and the beginning of the Godha-Jataka.
    In the Rathalatthi-Jataka, a royal chaplain injures himself when his own goad-stick
    rebounds, falsely accuses carters, and is exposed. In the former-birth version,
    a king first judges hastily against the carters, but the Bodhisatta, serving as
    lord justice, teaches that a ruler must hear both sides before judgment; after
    inquiry, blame falls on the Brahmin. In the Godha-Jataka opening, a husband or
    prince selfishly eats a roasted lizard meant for sharing after sending his wife
    or royal lady for water, then claims that the cooked lizard ran away.
  language: English
  quote_policy: quoted
