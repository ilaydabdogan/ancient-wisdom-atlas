  text: Sakka comes to the hermitage, stands in the air, and tells the ascetic that
    sorrow for the dead is unsuitable for one freed from household ties.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The ascetic replies that grief for a lost playmate finds relief in tears.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Sakka says that the wise advise against weeping and that tears cannot prevail
    against the grave or save dear ones.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: After hearing Sakka, the ascetic reflects, is comforted, dries his tears,
    praises Sakka, and ceases from sorrow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Sakka departs, and the Master identifies the young elephant as the novice,
