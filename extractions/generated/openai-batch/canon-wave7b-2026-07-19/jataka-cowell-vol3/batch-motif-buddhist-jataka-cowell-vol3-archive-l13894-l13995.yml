canonical_text:
  quote: ''
  summary: At Jetavana, the Master tells a story about an old Brother mourning a novice
    who has died. In the former-birth tale, a brahmin ascetic in the Himalaya adopts
    an elephant-calf, calls it Somadatta, and mourns when it dies. Sakka appears in
    the air and teaches that weeping cannot overcome death; the ascetic is consoled.
    The Master then identifies the elephant with the novice, the ascetic with the
    old Brother, and Sakka with himself. The line range also includes the opening
    frame of the Susima-Jataka, where the Brethren praise the Buddha's Great Renunciation
    and the Master says he had renounced royal power in a former time.
  language: English
  quote_policy: summarized
