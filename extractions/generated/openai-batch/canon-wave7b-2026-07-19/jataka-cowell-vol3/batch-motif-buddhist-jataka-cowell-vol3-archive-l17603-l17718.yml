  quote: ''
  summary: The excerpt presents a sequence of parables told by the Bodhisatta to a
    king. Each parable describes something normally sustaining or protective—water,
    earth, fire, food, wind, and a tree—becoming harmful to those who depend on it.
    The Bodhisatta repeatedly applies this pattern to a king as the refuge of his
    people, while avoiding a direct accusation that the king is the thief. The excerpt
    ends with the beginning of another story involving a son, his mother, a wife brought
    against his will, and a river full of crocodiles.
