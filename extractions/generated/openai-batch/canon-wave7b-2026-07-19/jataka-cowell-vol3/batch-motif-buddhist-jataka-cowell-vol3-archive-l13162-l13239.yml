canonical_text:
  quote: ''
  summary: The passage frames a Jataka tale through a monastic rule against storing
    medicines. In the old story, the Bodhisatta as king of Gandhara sees Rahu obscure
    the full moon and resolves that royal life is an external trouble like the eclipse;
    he gives up his kingdom and becomes an ascetic in the Himalaya. His friend, the
    king of Videha, hears of this and also renounces his large kingdom. The two ascetics
    later meet without recognizing one another; on another full-moon night beneath
    a tree, Rahu again covers the moon, and the Videha ascetic asks the Gandhara ascetic
    to explain the darkening.
  language: English
  quote_policy: summarized
