- id: obs:2
  text: After medicines are received and stored in pots, jars, and bags, people complain
    that the priests are hoarding; the Master declares that medicines for sick brethren
    must be used within seven days and invokes wise men of old who chided storing
    even salt and sugar for the next day.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bodhisatta is described as the king's son in the Gandhara kingdom, later
    becoming king and ruling righteously.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king of Gandhara and King Videha have never seen one another, but are
    friends with great mutual trust.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: On a full-moon fast day, the king of Gandhara has taken a vow, sits on a royal
    throne, looks through an eastern window, and gives his ministers a discourse on
    the law.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rahu covers the full moon's orb, and the moon's light vanishes; the ministers
    tell the king that the moon is seized by Rahu.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Observing the eclipsed moon, the king of Gandhara thinks that his royal retinue
    is a trouble and that he should not lose his light like the moon seized by Rahu.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king of Gandhara gives his kingdom to his ministers, takes the religious
    life, attains a transcendental faculty, and spends the rains in the Himalaya region
    devoted to meditation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: King Videha hears from merchants that his friend has taken the religious life,
    gives up Mithila, the Videha kingdom, villages, stores, dancing girls, and family
    ties, then goes to the Himalaya and lives quietly on fruits.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The two ascetics later meet without recognizing each other, live together
    in friendliness, and the ascetic of Videha waits upon the ascetic of Gandhara.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: On a full-moon day, while the two ascetics sit at the root of a tree and talk
