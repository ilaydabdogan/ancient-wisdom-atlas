canonical_text:
  quote: ''
  summary: King Dhananjaya, defeated after favoring newcomers over old soldiers, asks
    the wise counsellor Vidhurapandita whether others have suffered similarly. Vidhurapandita
    tells of Dhumakari, a brahmin goatherd who neglected his own goats after becoming
    attached to visiting deer; the goats died, the deer departed in autumn, and Dhumakari
    died of grief. The tale consoles the king, who changes his conduct.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The story is set in Indapattana in the Kuru kingdom, where King Dhananjaya
    is reigning.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bodhisatta is born in the house of the king's family priest, studies at
    Takkasila, and later becomes family priest and counsellor under the name Vidhurapandita.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: King Dhananjaya favors newcomers, disregards old soldiers, and is defeated
    when neither group fights in a frontier conflict.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king asks Vidhurapandita whether any other king has been defeated through
    favor shown to newcomers or suffered the same kind of sorrow.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Vidhurapandita replies that the king's sorrow is small compared with the sorrow
    once suffered by a brahmin goatherd named Dhumakari.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Dhumakari keeps a large flock of goats in a forest pen, maintains a smoking
    fire, lives on milk and similar food, and tends the goats.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A herd of deer, described as golden-hued and pestered by gnats, comes near
    Dhumakari's home during the rains after smelling the smoke.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Dhumakari gives his attention to the deer and neglects the goats, which perish.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: When the rains end and autumn arrives, the deer leave for the Himalaya, mountain
    heights, and river-springs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Dhumakari sees that the deer are gone and the goats are dead; grief wears
    him down, jaundice attacks him, and he dies.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The stated moral is that one who disregards his own and treats a stranger
    as dear mourns alone with bitter tears.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: After hearing the tale, the king is comforted, rewards Vidhurapandita, favors
    his own people, performs charity and virtue, and becomes destined for heaven.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: 'At the close, the Master identifies the former-birth figures: the Kuru king
    as Ananda, Dhumakari as Pasenadi, and Vidhurapandita as himself.'
  category: speech
  evidence_refs:
  - ev:11
