canonical_text:
  quote: '"if you give anyone this spell you will at once enter the fire and die."'
  summary: In the frame, the Master warns a Brother tempted by his former wife that
    she harmed him before. In the old tale, King Senaka saves a naga-king from village
    boys, receives gifts and charms, discovers a naga girl's misconduct, narrowly
    avoids retaliation after the truth is overheard, and receives a spell for understanding
    all sounds with a fatal prohibition against giving it away. The king laughs at
    speech by ants and flies, and the queen presses him to give her the spell.
  language: English
  quote_policy: quoted
