canonical_text:
  quote: ''
  summary: The Master tells the Ekaraja-Jataka at Jetavana to illustrate that wise
    people can gain good from evil. In the old story, a minister who misconducted
    himself is banished by the king of Benares and enters the service of Dabbasena,
    king of Kosala. Dabbasena seizes the king of Benares, suspends him head downwards,
    and later suffers burning pain. The captive king cultivates charity toward his
    enemy, enters meditation, breaks his bonds, and sits cross-legged in the air.
    Dabbasena asks forgiveness, restores the king's rule, and punishes the wicked
    councillor. The Bodhisatta gives the kingdom to his ministers, becomes a Rishi,
    and is destined for the Brahma-world. The Master identifies Ananda as Dabbasena
    and himself as the king of Benares.
  language: English
  quote_policy: summarized
