canonical_text:
  quote: ''
  summary: A king repeatedly tries to learn a maiden's name so that he may obtain
    her from her father, the Bodhisatta. The maiden encourages him with a tale of
    a crane whose wish is fulfilled by Sakka sending a flood to a hill-top. After
    years of guessing, the king complains that words without deeds are worthless and
    inadvertently says the maiden's name, Asanka. Her father then consents, the king
    takes her to Benares, and the frame identifies the former-birth figures.
  language: English
  quote_policy: summarized
