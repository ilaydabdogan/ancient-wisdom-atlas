canonical_text:
  quote: ''
  summary: 'The passage closes a prior birth story in which a priest refutes Setaketu
    and identifies former births. It then begins the Darimukha-Jataka: the Bodhisatta
    is born as prince Brahmadatta in Magadha, while the family priest has a son named
    Darimukha. The two friends study at Takkasila, wander to learn customs, and reach
    Benares. Omens at a meal indicate that Brahmadatta will become king and Darimukha
    commander. After the heirless king of Benares dies, a festal car comes to the
    garden and the priest recognizes royal marks on the Bodhisatta, who accepts the
    throne. Darimukha withdraws, later sees a withered leaf, understands decay and
    death, attains paccekabodhi, receives miraculous monastic requisites, flies through
    the air, and goes to the cave Nandamula in the Himalaya.'
  language: English
  quote_policy: summarized
