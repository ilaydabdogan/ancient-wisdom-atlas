    go to the king's garden; the Bodhisatta lies on the royal stone-seat and Darimukha
    strokes his feet.
  source_text_path: texts/public-domain/buddhist/internet-archive/jataka-cowell-vol3.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 9624-9631
  quote_or_summary: The king of Benares has been dead seven days; his priest has performed
    funeral rites and sent out the festal car because there is no heir.
  source_text_path: texts/public-domain/buddhist/internet-archive/jataka-cowell-vol3.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 9631-9634
  quote_or_summary: The car leaves the city and reaches the garden gate, accompanied
    by a fourfold army and music from hundreds of instruments.
  source_text_path: texts/public-domain/buddhist/internet-archive/jataka-cowell-vol3.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 9634-9639
  quote_or_summary: Hearing the music, Darimukha thinks the car comes for his friend
    and that he will be made commander, but he decides to go away and become an ascetic;
    he withdraws silently and hides to one side.
  source_text_path: texts/public-domain/buddhist/internet-archive/jataka-cowell-vol3.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 9639-9646
  quote_or_summary: The priest stops the car, enters the garden, sees the Bodhisatta
    on the royal seat, observes auspicious marks on his feet, judges him worthy of
    kingship over the four continents and surrounding islands, and orders the instruments
    to sound loudly to test courage.
  source_text_path: texts/public-domain/buddhist/internet-archive/jataka-cowell-vol3.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 9646-9650
  quote_or_summary: The Bodhisatta wakes, uncovers his face, sees the multitude, covers
    his face again briefly, and later sits cross-legged on the seat when the car has
    stopped.
  source_text_path: texts/public-domain/buddhist/internet-archive/jataka-cowell-vol3.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: lines 9650-9655
  quote_or_summary: The priest tells him the kingdom falls to him; after confirming
    there is no heir, the Bodhisatta accepts and is anointed in the garden.
  source_text_path: texts/public-domain/buddhist/internet-archive/jataka-cowell-vol3.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: lines 9655-9660
  quote_or_summary: In his great glory he forgets Darimukha, mounts the car, proceeds
    around the city, arranges the courtiers' places at the palace gate, and goes to
    the terrace.
  source_text_path: texts/public-domain/buddhist/internet-archive/jataka-cowell-vol3.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: lines 9660-9662
  quote_or_summary: Darimukha sees the garden empty, sits on the royal seat, and a
    withered leaf falls before him.
  source_text_path: texts/public-domain/buddhist/internet-archive/jataka-cowell-vol3.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: lines 9662-9664
  quote_or_summary: Through the leaf, Darimukha sees decay and death, grasps the three
    marks of things, and enters on paccekabodhi.
  source_text_path: texts/public-domain/buddhist/internet-archive/jataka-cowell-vol3.md
  rights_note: Public domain source; summarized.
- id: ev:18
  type: summary
  locator: lines 9664-9665
  quote_or_summary: The marks of householdership vanish; a miraculous bowl and frock
    fall from the sky and adhere to him, and he has the eight requisites and deportment
    of a centenarian monk.
  source_text_path: texts/public-domain/buddhist/internet-archive/jataka-cowell-vol3.md
  rights_note: Public domain source; summarized.
- id: ev:19
  type: summary
  locator: line 9665
  quote_or_summary: By miracle Darimukha flies into the air and goes to the cave Nandamula
    in the Himalaya.
  source_text_path: texts/public-domain/buddhist/internet-archive/jataka-cowell-vol3.md
  rights_note: Public domain source; summarized.
