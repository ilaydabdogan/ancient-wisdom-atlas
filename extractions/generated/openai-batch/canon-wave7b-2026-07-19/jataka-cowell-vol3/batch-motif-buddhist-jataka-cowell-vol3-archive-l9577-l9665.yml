candidate_motifs:
- id: motif:1
  label: renunciation of lay power before court appointment
  taxonomy_refs:
  - departure
  basis: Darimukha anticipates that his friend will become king and give him commandership,
    but resolves to leave lay life and become an ascetic instead.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage states the renunciatory decision, but it does not describe
    prolonged ascetic practice before awakening.
- id: motif:2
  label: royal legitimacy through auspicious bodily marks and ritual selection
  taxonomy_refs:
  - royal_legitimacy
  basis: The priest sees auspicious marks on the Bodhisatta's feet, judges him worthy
    of universal kingship, and the heirless kingdom is offered and ritually conferred
    by anointing.
  evidence_refs:
  - ev:12
  - ev:14
  confidence: high
  cautions: The car-selection ceremony is mentioned but not fully explained in this
    passage.
- id: motif:3
  label: omen interpreted through seating colors
  taxonomy_refs:
  - wisdom
  basis: Darimukha reads the white cloth under the Bodhisatta and red rug under himself
    as an omen of future kingship and military command.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The colors are literal details in the passage; any broader symbolism of
    white or red is not stated.
- id: motif:4
  label: awakening through contemplation of impermanence
  taxonomy_refs:
  - wisdom
  basis: A withered leaf leads Darimukha to perceive decay and death, grasp the three
    marks of things, and enter paccekabodhi.
  evidence_refs:
  - ev:16
  - ev:17
  confidence: high
  cautions: The doctrinal term paccekabodhi is explicit, but detailed explanation
    of the three marks is not provided in the passage.
- id: motif:5
  label: miraculous monastic investiture
  taxonomy_refs:
  - initiation
  basis: After Darimukha attains paccekabodhi, the householder signs vanish and a
    miraculous bowl and frock fall from the sky, giving him the eight requisites and
    monk-like deportment.
  evidence_refs:
  - ev:18
  confidence: high
  cautions: Classified as initiation only in a broad motif sense; the passage presents
    it as a miraculous transformation rather than a formal ordination rite.
- id: motif:6
  label: miraculous ascent and retreat to mountain cave
  taxonomy_refs:
  - ascent
  basis: Darimukha flies by miracle into the air and goes to Nandamula cave in the
    Himalaya.
  evidence_refs:
  - ev:19
  confidence: high
  cautions: The destination cave and Himalaya are stated; no further description of
    the cave's religious function is included here.
comparison_claims:
- id: claim:1
  claim: The frame explicitly associates this Darimukha-Jataka with the Great Renunciation,
    supporting a cautious comparison to a Buddhist renunciation pattern in which lay
    or royal prospects are abandoned for ascetic awakening.
  claim_level: same_function
  target: Great Renunciation motif in the Buddhist narrative frame
  evidence_refs:
  - ev:3
  - ev:11
  - ev:17
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage only says the tale was told concerning the Great Renunciation;
    it does not narrate the Great Renunciation itself or spell out the comparison.
