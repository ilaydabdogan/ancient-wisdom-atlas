canonical_text:
  quote: ''
  summary: The Bodhisatta, identified at the end as Mahatundila, preaches the law
    to Cullatundila before a large Benares audience. Cullatundila asks about images
    of a crystal pool, sweat-stains, and fragrant ointment, and the Bodhisatta explains
    them as law, sin, and virtue. The king honors the two pigs, makes them like royal
    sons, and the Bodhisatta instructs the kingdom in commands, judgment, and law
    before departing to the forest. The frame closes by identifying the former-birth
    figures with Ananda, a death-fearing Brother, the Congregation, and the Master
    himself.
  language: English
  quote_policy: summarized
