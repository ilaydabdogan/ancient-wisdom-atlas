canonical_text:
  quote: ''
  summary: The passage recounts a Jataka episode in which the Bodhisatta, named Atthisena,
    becomes an ascetic, dwells in the Himalaya, and is patronized by the king of Benares.
    Although the king offers him any boon, even the kingdom, Atthisena does not ask.
    He teaches that sages do not petition like householders and later refuses a gift
    of cattle. The king follows his admonition and performs good works. The closing
    frame identifies the king as Ananda and Atthisena as the Buddha in a former birth.
    The passage then begins the next tale’s frame, concerning Devadatta being swallowed
    up by the earth.
  language: English
  quote_policy: summarized
