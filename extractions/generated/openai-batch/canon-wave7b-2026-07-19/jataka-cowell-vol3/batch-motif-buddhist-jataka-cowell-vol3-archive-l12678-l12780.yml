canonical_text:
  quote: ''
  summary: The Bodhisatta hears a brahmin, reasons through possible causes of death,
    and infers that a black snake has entered the brahmin's meal-sack. He questions
    the brahmin about the meal, the unfastened sack, the tree-root, and drinking water,
    then instructs him to set the sack down, open it, stand back, and strike it with
    a stick. The snake emerges with hood erect before the assembly. The crowd acclaims
    the event, and the passage concludes by praising knowledge and wisdom as supreme
    qualities leading toward nirvana.
  language: English
  quote_policy: summarized
