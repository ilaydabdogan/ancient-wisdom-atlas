canonical_text:
  quote: ''
  summary: The Master tells a Jataka about a greedy Brother. In the past, the Bodhisatta
    was a pigeon living in a merchant's kitchen. A crow, craving fish and meat, pretends
    to be ill so the pigeon will leave, then tries to steal the human food. The cook
    catches and punishes the crow by plucking, smearing, wounding, and tying a potsherd
    to him. The pigeon mocks and admonishes the crow, leaves the place, and the crow
    dies. The Master identifies the crow as the greedy Brother and the pigeon as himself.
  language: English
  quote_policy: summarized
