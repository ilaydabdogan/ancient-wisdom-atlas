canonical_text:
  quote: ''
  summary: The frame states that the Master tells the Suvannakakkata-Jataka in response
    to discussion of Ananda giving up his life for the Buddha. In the old tale, the
    Bodhisatta is a brahmin farmer who befriends a golden crab living in a pool near
    his field. A she-crow covets the Bodhisatta's eyes and has the he-crow seek help
    from a black snake. The snake bites the Bodhisatta; the crow attempts to peck
    his eyes; the crab seizes the crow and then confronts the snake.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the frame, monks discuss whether Elder Ananda gave up his life for the
    Perfect Buddha, and the Master says Ananda had also done so in former times.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bodhisatta is born in a brahmin farmer's family in Salindiya and later
    works a large farm in Magadha.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: At a pool by the field, the Bodhisatta encounters a golden crab, carries it
    in his outer garment while he works, returns it to the pool, and a strong mutual
    confidence arises.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A she-crow nesting in a palm sees the Bodhisatta's eyes and tells the he-crow
    she longs to eat them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The she-crow instructs the he-crow to attend on a black snake so that the
    snake will kill the Bodhisatta and allow the crow to take his eyes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The he-crow waits on the black snake, explains the desire for the field-master's
    eyes, and the snake promises that the eyes will be obtained.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The snake hides by the field boundary, bites the Bodhisatta in the calf, and
    the Bodhisatta falls.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the Bodhisatta falls, the golden crab springs from the garment, and
    the crow perches on the Bodhisatta's breast and puts its beak into his eyes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The crab concludes that the crow caused the danger to its friend and seizes
    the crow by the neck with its claw.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The captured crow calls on the snake for help, addressing the crab as a gold-clawed,
    tank-bred creature.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The snake comes with its hood spread to help the crow, and the crab turns
    on the snake.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The snake asks why the crab seizes the crow and snake, saying crabs do not
