canonical_text:
  quote: ''
  summary: The Master introduces the Palasa-Jataka as a lesson on suspecting sin and
    small dangers. In a past birth, the Bodhisatta is a golden goose who lives near
    Cittakuta and befriends the deity of a Judas tree. A fowl deposits banyan seed
    in the tree; a banyan shoot grows. The goose warns the tree deity to uproot it,
    but the deity chooses to nurture it. The goose leaves, the banyan grows, destroys
    the Judas tree and the deity's dwelling, and the deity regrets ignoring the warning.
    A wisdom stanza states that the wise destroy parasitic danger at the root. The
    Master identifies himself as the golden goose. The passage then begins the Dighitikosala-Jataka,
    where Prince Dighavu restrains revenge against the king of Benares after recalling
    parental counsel.
  language: English
  quote_policy: summarized
