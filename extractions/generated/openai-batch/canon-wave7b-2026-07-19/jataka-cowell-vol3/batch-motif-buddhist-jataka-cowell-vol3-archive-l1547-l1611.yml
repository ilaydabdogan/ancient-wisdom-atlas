canonical_text:
  quote: '"one good turn deserves another"'
  summary: The Master introduces an old story in which the Bodhisatta, as king of
    Benares, is defeated near the frontier, flees to a border village, and is received
    hospitably by one loyal villager. The villager and his wife care for the king
    and his horse for several days. The king departs under the name Great Horseman
    and prepares to receive the villager in the city. When the villager does not come,
    the king repeatedly raises the village tax until the villagers urge the host to
    visit and ask relief; the host agrees but insists on bringing gifts for his friend
    and household.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Master tells the story at Jetavana in connection with the Elder Ananda
    and states that wise men formerly acted on the principle that one good turn deserves
    another.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bodhisatta is described as king of Benares, ruling with justice and equity,
    giving alms, and keeping the moral law.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king goes with a large force to quell a frontier disturbance, is defeated,
    mounts his horse, and flees to a border village.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Thirty loyal subjects are gathered in the village for local business; when
    the armored and splendidly equipped horseman enters, most flee to their homes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: One villager welcomes the stranger, asks whether he is a royalist or rebel,
    and hears the reply that the stranger is for the king.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The villager brings the king home, seats him on his own seat, has his wife
    bathe the guest's feet, offers food, and prepares a bed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The host removes the horse's armor, turns the horse loose, gives it water
    and grass, and rubs it with oil.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The host tends the king for three or four days and again performs due service
    for the king and horse when the king leaves.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: On departure, the king says he is called the Great Horseman and instructs
    the host how to find his home in the center of the city through the porter at
    the right-hand door.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the army escorts the king home, the king instructs the porter to bring
    the frontier villager into his presence if he arrives, promising the porter a
    thousand pieces of money.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the man does not come, the king raises the village tax three times, and
    the villagers complain that the burden has become oppressive.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The villagers ask the host to go see the Great Horseman and persuade him to
    lighten their burden.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The host agrees to go but says he cannot go empty-handed, asking the villagers
    to prepare ornaments and clothes for his friend, his friend's wife, and his friend's
    two sons.
  category: speech
  evidence_refs:
  - ev:8
