- id: obs:4
  text: When the king utters the lie, four angels say they will guard such a liar
    no longer, throw their swords at his feet, and disappear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the first lie, the king's mouth and body become foul-smelling, he falls
