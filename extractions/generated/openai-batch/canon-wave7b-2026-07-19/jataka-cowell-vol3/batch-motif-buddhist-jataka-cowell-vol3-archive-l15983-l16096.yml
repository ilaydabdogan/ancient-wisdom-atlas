canonical_text:
  quote: ''
  summary: A king persists in telling a falsehood despite repeated warnings from a
    chief priest or brahmin. His supernatural powers and angelic guardians abandon
    him; he falls from the air, sinks progressively into the earth with each repeated
    lie, and is finally seized by the flames of Avici. Closing verses state a moral
    lesson about truthfulness and guilelessness.
  language: English
  quote_policy: summarized
