  text: A man carrying the five kinds of weapons goes to the Himalaya, kills many
    deer, and eats them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: He lives in a great defile surrounded by mountain on the banks of the river
    Vidhava and cooks deer flesh on hot coals.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: He plans to drive many kinds of animals into the defile, close it with a gate,
    and kill them at his pleasure when he can no longer range the forest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: As time passes he loses bodily control, cannot move freely or find food and
    drink, withers, and is described as becoming the ghost of a man.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: King Sivi leaves his kingdom to his ministers, goes to the forest with the
    five kinds of weapons, kills deer, and eats their flesh.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: King Sivi encounters the ghost-like man, asks who he is, and hears that the
    man is reaping the fruit of his deeds.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The man says he has lost home, wife, kin, and support, has strayed from righteousness,
    and suffers because he caused distress instead of joy.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The man advises the king not to commit evil deeds, to return to his city,
    and to perform good deeds such as charity; the king does so and completes the
    path to heaven.
  category: sequence
  evidence_refs:
  - ev:6
