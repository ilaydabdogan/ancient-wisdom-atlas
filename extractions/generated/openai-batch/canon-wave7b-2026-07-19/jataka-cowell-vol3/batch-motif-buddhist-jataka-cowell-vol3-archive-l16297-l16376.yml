canonical_text:
  quote: ''
  summary: An armed man goes to the Himalaya, kills deer, and encloses animals in
    a mountain defile so he can kill them later. In old age he becomes helpless, withered,
    and ghost-like, and tells King Sivi that he is reaping the fruit of his deeds.
    He warns the king to avoid harmful deeds and practice charity; the king returns
    to his city, gives charity, and completes the path to heaven. The frame then reports
    an ascetic restored to meditation through Sarabhanga's teaching and begins the
    Aditta-Jataka with a discussion of the Kosala king's great gift to the Buddha-led
    assembly as a field of merit.
  language: English
  quote_policy: summarized
