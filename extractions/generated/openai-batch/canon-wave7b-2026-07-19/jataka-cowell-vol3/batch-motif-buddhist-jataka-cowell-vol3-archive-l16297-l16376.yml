  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the lesson, the Master declares the Truths, identifies the Birth, and
    the backsliding Brother is established in the fruition of the First Path.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: At Jetavana, the brethren discuss the Kosala king's incomparable gift, saying
