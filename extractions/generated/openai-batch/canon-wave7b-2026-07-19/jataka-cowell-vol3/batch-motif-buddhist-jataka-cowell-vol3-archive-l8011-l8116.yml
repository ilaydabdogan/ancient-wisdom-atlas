canonical_text:
  quote: ''
  summary: After a brief closing identification from a preceding tale, No. 361 tells
    of the Master at Jetavana explaining that a beggar once tried to divide Sariputta
    and Moggallana, just as in a former birth a jackal tried to divide a lion and
    a tiger. In the animal tale, the Bodhisatta is a tree-god in a forest where a
    lion and tiger share a mountain-cave. A jackal dependent on their leftovers lies
    to each about the other's insults, hoping their quarrel will lead to their deaths
    so he can eat them. The companions reject the slander, affirm trust in friendship,
    reconcile, and the jackal flees. The Master identifies the jackal with the beggar,
    the lion with Sariputta, the tiger with Moggallana, and the forest deity with
    himself.
  language: English
  quote_policy: summarized
