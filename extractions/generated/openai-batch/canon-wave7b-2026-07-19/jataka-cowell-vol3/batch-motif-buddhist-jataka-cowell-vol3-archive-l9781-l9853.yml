canonical_text:
  quote: ''
  summary: 'In the frame story, a Brother leaves a frontier village after its people
    shift their allegiance among different teachers and do not distinguish good and
    evil. The Master tells a former-birth tale: the Bodhisatta, born as an elder golden
    goose, and his younger brother settle on the golden mountain Neru, whose lustre
    makes all animals appear golden. The younger goose observes that inferior and
    superior beings look alike there and says that the good should not remain where
    honor is undiscriminating. Both geese leave Neru for Cittakuta. The Master identifies
    the younger goose as Ananda and the elder as himself.'
  language: English
  quote_policy: summarized
