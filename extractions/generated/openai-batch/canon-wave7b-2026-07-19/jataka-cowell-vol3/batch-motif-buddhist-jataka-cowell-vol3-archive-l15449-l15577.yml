  text: The paccekabuddha had meals in the palace, lived there for a long time, and
    was respectfully attended by Sumangala.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After visiting a village, the paccekabuddha returned to the park after sunset,
    put away his bowl and robe, walked briefly, and sat on a stone slab.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sumangala went into the park with a bow to kill a tame deer for food for guests
    at his house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sumangala saw the paccekabuddha, mistook him for a deer, aimed an arrow, and
    shot him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The paccekabuddha addressed Sumangala; Sumangala said he had not known of
