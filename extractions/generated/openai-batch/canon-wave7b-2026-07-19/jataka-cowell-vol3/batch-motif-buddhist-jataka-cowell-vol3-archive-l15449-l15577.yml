canonical_text:
  quote: ''
  summary: A paccekabuddha is attended by Sumangala, returns to the park, and is accidentally
    shot by Sumangala, who mistakes him for a deer. The paccekabuddha passes into
    nirvana. Sumangala flees with his family, while the king honors the body, enshrines
    the relics, and later forgives Sumangala after waiting until his anger is appeased.
    The king recites stanzas on righteous rule, restrained anger, judgment, and punishment.
    The passage closes with Jataka birth identifications.
  language: English
  quote_policy: summarized
