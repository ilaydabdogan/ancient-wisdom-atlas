  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the paccekabuddha's instruction, Sumangala pulled out the arrow; the paccekabuddha
    felt great pain and passed into nirvana there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Fearing that the king would not pardon him, Sumangala fled with his wife and
    children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The city heard by supernatural power that the paccekabuddha had entered nirvana;
    men later found the body and reported the matter to the king.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The king honored the body for seven days, took the relics with ceremony, built
    a shrine, and continued to rule righteously.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Over several years Sumangala tried to learn the king's attitude through a
    minister, and on the third occasion came with his wife and children.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: When the king had become appeased, he summoned Sumangala, heard his account,
    told him not to fear, forgave him, and restored him as park-keeper.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The king explained that a ruler should not act hastily in anger, but should
