canonical_text:
  quote: ''
  summary: A jackal angrily foretells danger to the Bodhisatta after he prevents her
    cubs from feeding. A hostile king later surrounds the city, and the Bodhisatta,
    ordered by his father to fight, avoids the threatened gate, leaves with the city’s
    forces, and later takes the kingdom after his father flees. The former king lives
    in a forest hut with his queen, priest, and servant Parantapa. The queen and Parantapa
    become lovers; at her urging Parantapa murders and buries the king at a bathing
    place. The family priest witnesses the killing from a tree, hides, then pretends
    to be blind, claiming serpent breath caused it. Parantapa fears that someone or
    something shook a branch during the murder. The priest overhears and later speaks
    verses that allude to Parantapa’s fear.
  language: English
  quote_policy: summarized
