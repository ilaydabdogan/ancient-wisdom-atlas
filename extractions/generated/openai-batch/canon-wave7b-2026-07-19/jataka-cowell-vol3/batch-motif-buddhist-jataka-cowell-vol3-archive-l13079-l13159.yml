canonical_text:
  quote: ''
  summary: The Lord appears in Brahmaloka, where Baka the brahma asserts that his
    world is eternal and that no other salvation exists. The Lord rejects this as
    ignorance, recalls Baka's limited existence and former virtuous deeds, and identifies
    himself as the former disciple Kappa. Baka acknowledges the Lord as Buddha; the
    Master teaches the law, frees many brahmas from attachments and sins, returns
    to Jetavana, and identifies the former birth.
  language: English
  quote_policy: summarized
