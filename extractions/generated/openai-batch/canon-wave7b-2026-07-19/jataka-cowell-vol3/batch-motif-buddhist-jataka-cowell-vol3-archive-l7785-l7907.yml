canonical_text:
  quote: ''
  summary: In a Jataka former-birth episode, the Bodhisatta is born as a golden royal
    stag with a doe mate and a large herd. A hunter's snare traps and wounds him.
    The doe returns, encourages him, then offers her own life to the hunter so the
    stag may live. Amazed by the doe's human speech and devotion, the hunter releases
    both deer. The stag rewards him with a magic jewel and instructs him to stop killing
    and perform good works. The Master identifies the former births, and the supplied
    passage then begins the next Jataka frame about a backsliding Brother at Jetavana.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Bodhisatta is born as a young golden-colored stag with distinctive beautiful
    features; his mate is a doe, and eight myriads of dappled deer follow him.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A hunter sets a snare in a deer drive, and the Bodhisatta's foot becomes entangled
    while he is leading the herd.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The stag struggles three times against the snare and wounds his foot down
    to the bone; he then cries out in fear of death, and the herd flees.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The doe notices the stag is missing, returns to him, urges him to break the
    snare, and hears him answer that struggling only makes the noose bite more sharply.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The doe tells the stag she will entreat the hunter and will give up her own
    life in exchange for his.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The hunter approaches with sword and spear in hand and is compared to a destroying
    flame at the beginning of a cycle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The doe salutes the hunter, praises her husband as a golden, virtuous king
    of deer, and asks that she be killed if the stag may remain unharmed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The hunter is amazed that a beast speaks with a human voice and decides to
    grant life to the doe and the stag.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The doe rejoices at the stag's release and thanks the hunter, wishing joy
    to him and his kin.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Bodhisatta thinks he should be a refuge to the hunter, gives him a magic
    jewel, tells him not to kill any creature, and advises him to maintain a household,
    give alms, and do good works.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Master identifies Channa as the hunter, a female novice as the doe, and
    himself as the royal stag.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The next story begins at Jetavana, where the Master questions a backsliding
    Brother who says the charms of a woman caused his longing for the world; the Master
    introduces a story about old sages and the abode of the Gamdas as printed in the
    supplied passage.
  category: sequence
  evidence_refs:
  - ev:10
