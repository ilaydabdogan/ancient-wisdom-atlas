canonical_text:
  quote: Be thou in deed to every promise true,
  summary: The passage gives moral verses about keeping promises, avoiding empty boasting,
    trusting a true friend rather than suspecting quarrels without cause, and drawing
    the yoke of friendship well. It then states that one who enjoys calm repose and
    drinks Truth escapes bonds of sin and woe. A prose note says the Great Being,
    disgusted by evil associates, used solitude to bring his teaching to a climax
    and lead men to eternal Nirvana. The Master identifies himself in the Birth as
    the merchant of Benares. A following note says a question about a firefly will
    be set forth in full in the Mahaummagga.
  language: English
  quote_policy: quoted
