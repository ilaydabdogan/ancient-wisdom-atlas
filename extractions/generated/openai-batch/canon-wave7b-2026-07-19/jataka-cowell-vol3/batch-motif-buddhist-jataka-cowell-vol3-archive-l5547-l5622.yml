canonical_text:
  quote: ''
  summary: 'In the frame story, prince Ajatasattu''s conception is marked by his mother''s
    craving to drink blood from King Bimbisara''s right knee and by an astrologers''
    prediction that the child will kill his father and seize the kingdom. Bimbisara
    gives the queen the blood; she later attempts to miscarry, but the child is born
    and named Ajatasattu because he had been his father''s enemy while unborn. When
    Bimbisara is distracted from hearing the Buddha''s teaching by affection for the
    child, the Buddha tells an old story: the Bodhisatta, a teacher at Takkasila,
    foresees danger to a Benares prince through his future son and gives him four
    stanzas to recite in specified royal situations. Later, the prince has become
    king, and his sixteen-year-old son plans to poison him and seize the kingdom;
    as the rice is served, the king recites the first stanza.'
  language: English
  quote_policy: summarized
