canonical_text:
  quote: ''
  summary: The Master, dwelling at Jetavana, explains to the king why a rich stranger
    merchant died heirless, was reborn in hell, and had possessed wealth he neither
    enjoyed nor gave away. The Master recounts an earlier Benares tale in which a
    selfish merchant gave alms to the paccekabuddha Tagarasikhi but later regretted
    the gift. The passage states that perfect charity requires joy before giving,
    cheerful giving, and pleasure afterward; the merchant gained wealth through the
    alms but could not enjoy it because of his impure after-thought. A second old
    tale begins, describing the Bodhisatta as a wealthy merchant who gives alms and
    turns toward renunciation.
  language: English
  quote_policy: summarized
