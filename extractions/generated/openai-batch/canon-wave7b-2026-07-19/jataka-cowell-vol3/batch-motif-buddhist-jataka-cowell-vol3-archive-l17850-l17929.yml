canonical_text:
  quote: ''
  summary: A frame story says the Master, at Jetavana, addresses a worldly-minded
    monk by telling a past-life story. Kassapa, friend of the king of Benares, renounces
    power and becomes the ascetic Lomasakassapa in the Himalayas. His austerity shakes
    Sakka's abode. Sakka appears to the king at midnight and promises universal rule
    and freedom from old age and death if Kassapa performs a living sacrifice of slain
    beasts. The king sends the councillor Sayha to persuade Kassapa, but the ascetic
    refuses, rejecting cruelty, fame, gain, and kingdom-winning sin.
  language: English
  quote_policy: summarized
