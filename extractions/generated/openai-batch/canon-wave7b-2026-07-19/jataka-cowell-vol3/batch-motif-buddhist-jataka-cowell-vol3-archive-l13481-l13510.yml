canonical_text:
  quote: The Bodhisatta, thus instructing and teaching the king, died.
  summary: After teaching the king, the Bodhisatta monkey-king dies. The king orders
    royal obsequies, has a funeral pile made, enshrines and honors the skull as a
    relic with offerings, follows the Bodhisatta's teaching, performs good deeds,
    rules righteously, and becomes destined for heaven. The Master then identifies
    the birth figures with present figures.
  language: English
  quote_policy: quoted
