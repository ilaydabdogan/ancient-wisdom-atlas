canonical_text:
  quote: ''
  summary: The Master, while at the Bamboo-grove, responds to discussion of Devadatta's
    attempts to kill the Tathagata by saying Devadatta had tried before and failed
    to frighten him. In the old tale, the Bodhisatta is born as the son of Brahmadatta's
    chief queen, studies at Takkasila, and learns a spell for understanding animal
    cries. His father makes him viceroy but becomes anxious to kill him. At night
    a she-jackal and her two hungry cubs enter the city by a sewer. The jackal plans
    to steal a traveler's shoes after he sleeps, but the Bodhisatta understands her
    speech and tells the traveler to hang up the shoes. Later the jackal returns and
    tells her cubs of a drowned man in a lotus-tank who has garments, money, and a
    ring; the Bodhisatta hears her.
  language: English
  quote_policy: summarized
