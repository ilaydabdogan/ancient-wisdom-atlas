canonical_text:
  quote: ''
  summary: 'The passage closes one Jataka in which a prince attempts to kill his father
    the king, is defeated, chained, and imprisoned, while the king praises protective
    verses taught by a far-famed teacher. A new Jataka begins: at Jetavana the Master
    explains that a monk''s former wife caused him harm in the past. In the past story,
    the Bodhisatta is reborn as Sakka, and a young brahmin archer trained at Takkasila
    travels with his wife toward Benares. He kills a dangerous elephant, then confronts
    robbers on the road. After an insult involving raw meat, he shoots nearly all
    the robbers, runs out of arrows, subdues the robber chief by hand, and asks his
    wife to bring a sword; she then becomes attracted to the robber chief.'
  language: English
  quote_policy: summarized
