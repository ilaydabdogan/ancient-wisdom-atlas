canonical_text:
  quote: ''
  summary: In Jetavana, the Master reassures the king of Kosala about terrifying midnight
    sounds and introduces an old tale in which similar sounds led kings to consider
    animal sacrifice until wise counsel caused the animals' release. In the old tale,
    the Bodhisatta renounces wealth and becomes an ascetic. A king of Benares hears
    eight sounds at midnight and, terrified, consults brahmins who begin preparations
    for sacrifice. A young brahmin pupil objects to the cruelty and seeks the Bodhisatta's
    help to release the creatures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master tells the king of Kosala not to fear the indistinguishable terrific
    sounds, saying no danger will befall him because of them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master says that kings of old heard similar sounds, considered sacrificing
    four animals of each species on brahmin advice, then freed the animals after hearing
    wise men and proclaimed against all slaughter by drum.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bodhisatta is born in a wealthy brahmin family, studies at Takkasila,
    gives away wealth in charity after his parents' death, renounces desires, goes
    to the Himalaya, becomes an ascetic, practices mystic meditation, and later dwells
    in a Benares garden.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king of Benares, seated on his royal bed at midnight, hears eight sounds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The eight sounds are made by a crane, a female crow, an insect, a tame cuckoo,
    a tame deer, a tame monkey, a palace gnome, and a paccekabuddha passing along
    the roof and uttering a sound of ecstatic feeling.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king of Benares is terrified by the sounds and consults brahmins the next
    day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The brahmins tell the king there is danger for him, request permission to
    offer sacrifice outside the palace, and begin the sacrificial work.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A young pupil of the oldest sacrificial brahmin objects that the sacrifice
    would be harsh and cruel slaughter of many creatures.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The oldest sacrificial brahmin replies that even if nothing else happens,
    the brahmins will get much fish and flesh to eat.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The pupil warns against doing an action for the belly's sake that will cause
    rebirth in hell, and the other brahmins become angry with him for endangering
    their gains.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The young pupil leaves the city to find a pious ascetic able to prevent the
    king from sacrificing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The pupil asks the Bodhisatta in the royal garden whether he has compassion
    on creatures and whether he ought to bring about the release of the multitude
    threatened by sacrifice.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Bodhisatta says that he does not know the king of the land, but he says
    he knows the consequence of the sounds the king heard.
  category: speech
  evidence_refs:
  - ev:6
