canonical_text:
  quote: ''
  summary: 'In the frame story, a landowner refuses even an imaginary gift of gold
    from a mountain to his wife, and she complains before the Master at Jetavana.
    The Master says the husband can be generous when he remembers her virtues and
    relates a past-life story: a king sends his viceroy son away, the son lives in
    the forest with his chief wife, then returns to Benares after his father''s death.
    On the road he similarly refuses to give his wife any imagined gold from a mountain.
    After becoming king, he makes her chief queen in name but neglects her. The Bodhisatta,
    serving as minister, plans to make the king recognize her worth by having her
    repeat the incident in the king''s presence.'
  language: English
  quote_policy: summarized
