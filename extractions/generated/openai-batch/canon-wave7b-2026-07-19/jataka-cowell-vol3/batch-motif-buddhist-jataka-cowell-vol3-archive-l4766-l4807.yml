canonical_text:
  quote: ''
  summary: Radha counsels Potthapada that gain and loss, praise and blame, pleasure
    and pain, dishonour and fame are transient. Potthapada remains resentful toward
    the monkey Kalabahu and asks when he will be driven from court. Radha predicts
    that Kalabahu will frighten the royal children and be forced to seek food elsewhere.
    The monkey then frightens the princes with tricks; the king orders him driven
    away, and the parrots are restored to their former gain and honour. The Master
    identifies the figures of the birth.
  language: English
  quote_policy: summarized
