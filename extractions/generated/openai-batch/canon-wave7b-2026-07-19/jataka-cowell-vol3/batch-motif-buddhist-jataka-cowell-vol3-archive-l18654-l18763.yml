canonical_text:
  quote: ''
  summary: A man entrusted with provisions kills and eats young lizards, a partridge,
    a calf, and a cow, then sleeps beneath a tree. A tree-sprite tells the bereaved
    lizard what has happened and urges her to kill him, but she flees in fear. A tiger,
    sent by a lion to seek news of the learned partridge, finds evidence of the killings,
    interrogates the man, and brings him before the lion. The man finally admits killing
    the partridge.
  language: English
  quote_policy: summarized
