canonical_text:
  quote: ''
  summary: In the frame story, a monk is afraid of death, and the Master says this
    fear occurred before. In the former-birth tale, the Bodhisatta is born as the
    elder of two young pigs, Mahatundila and Cullatundila. A wild sow abandons them
    in fear, an old woman raises them as children, and drunken men later persuade
    her to give them Cullatundila for meat. When Cullatundila sees the trough, men,
    and nooses, he returns trembling. Mahatundila explains that they were fattened
    for their flesh and exhorts him not to grieve.
  language: English
  quote_policy: summarized
