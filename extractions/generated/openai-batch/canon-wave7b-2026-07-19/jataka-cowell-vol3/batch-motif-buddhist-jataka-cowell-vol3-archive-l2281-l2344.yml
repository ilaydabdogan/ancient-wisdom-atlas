canonical_text:
  quote: ''
  summary: In a garden at Benares, the king learns sacred texts while seated higher
    than his chaplain-teacher. The Bodhisatta, in a mango tree stealing fruit, reflects
    that the king, the teacher, and he himself are all acting wrongly. He descends,
    rebukes the king and priest in verse, and warns against ambition and greed. The
    pleased king learns that he is a pariah, gives him authority as night king and
    lord protector, transfers a flower wreath to him, and thereafter studies from
    a lower seat out of respect for his teacher. The Master identifies Ananda as the
    king and himself as the pariah.
  language: English
  quote_policy: summarized
