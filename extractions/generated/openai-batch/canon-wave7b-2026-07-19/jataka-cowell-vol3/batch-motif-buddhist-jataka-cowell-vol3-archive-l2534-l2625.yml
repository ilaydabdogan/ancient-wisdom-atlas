canonical_text:
  quote: ''
  summary: The Master tells a story about an aged Brother whose conduct delays a younger
    monk and novice. He then narrates a former-birth story in which the Bodhisatta,
    living as a Himalayan ascetic with his father and younger brother, responds to
    a similar quarrel by caring for his father and teaching patient forbearance toward
    foolish youth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young nobleman at Savatthi is ordained, attains sainthood, and after his
    mother's death admits his father and younger brother to orders at Jetavana.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The three go to a village retreat for the rainy-season residence and later
    return toward Jetavana.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Near Jetavana, the young Brother goes ahead to prepare their cell while the
    novice is told to bring the old man quietly.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The novice repeatedly pushes or drags the old priest; the old priest objects,
    turns back, and restarts, causing delay until darkness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The young Brother prepares the hut, sets water in pots, takes a torch, finds
    the delayed pair, and brings them on slowly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Master asks why the young Brother did not pay respects the previous day,
    rebukes the elder, and says the behavior also occurred formerly.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the old story, the Bodhisatta is born in a brahmin family in Kasi during
    Brahmadatta's reign in Benares.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: After his mother's death and funeral rites, the Bodhisatta gives away the
    household money, takes his father and younger brother with him, puts on a bark
    garment, and becomes an ascetic in the Himalaya country.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Bodhisatta lives in a pleasant grove, sustaining himself by gleaning,
    roots, and wild fruits.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: During the rainy season in the Himalaya, ascetics come down to human settlements
    because roots, bulbs, and wild fruits are unavailable.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: When the Himalaya country blossoms and bears fruit again, the Bodhisatta returns
    with his father and younger brother to his hermitage.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: At sunset near the hut, the Bodhisatta leaves his companions to come slowly
    while he goes ahead to set the hermitage in order.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The young hermit pushes his father with his head; the father objects, turns
    back, and starts again, and darkness sets in during the quarrel.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Bodhisatta sweeps the leaf hut, prepares water, takes a torch, returns
    to find them, and brings them home quietly.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Bodhisatta bathes his father, washes and anoints his feet, shampoos his
    back, and sets out a pan of charcoal.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The Bodhisatta compares young boys to earthen vessels that break easily and
    tells his father that old men should bear abusive youths patiently.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: The stanzas teach long-suffering toward foolish youth, quick ending of quarrels
    among good men, and enduring friendship among the wise.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:18
  text: After the admonition, the father practices self-restraint from that time forward.
  category: sequence
  evidence_refs:
  - ev:8
