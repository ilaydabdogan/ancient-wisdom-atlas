canonical_text:
  quote: ''
  summary: The Master explains that the same admonition brought a reward from a king
    but violence from a ferryman, so counsel should be given only to suitable recipients.
    The ferryman strikes his wife when she tries to stop him, causing spilled rice,
    a broken plate, and miscarriage; the crowd binds him and the king punishes him.
    The Master closes with a stanza, declares the Truths, and identifies the former-birth
    figures.
  language: English
  quote_policy: summarized
