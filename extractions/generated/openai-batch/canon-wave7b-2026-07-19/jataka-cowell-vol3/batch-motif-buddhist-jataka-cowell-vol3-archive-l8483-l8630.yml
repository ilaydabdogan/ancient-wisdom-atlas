    they can smile while fallen into enemy hands and bound with bamboo fetters.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Bodhisatta answers with verses teaching that groans and mourning bring
    no gain, that enemies rejoice at another's pain, and that one should meet fate
    boldly.
  category: speech
  evidence_refs:
  - ev:5
