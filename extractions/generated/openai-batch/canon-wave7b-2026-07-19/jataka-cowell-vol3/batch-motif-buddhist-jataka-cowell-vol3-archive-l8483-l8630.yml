canonical_text:
  quote: ''
  summary: The passage contains the Tacasara-Jataka and the beginning/full narrative
    of the Mittavinda-Jataka. In the first, accused youths are bound and brought before
    the king; the Bodhisatta counsels them to remain fearless, explains the value
    of composure and practical effort, and is rewarded after the king discovers their
    innocence. In the second, the covetous Mittavindaka reaches Ussada hell, receives
    a razor-sharp wheel on his head, is instructed by the Bodhisatta in divine form
    about insatiable greed, and is crushed by the wheel.
  language: English
  quote_policy: summarized
