canonical_text:
  quote: ''
  summary: At Jetavana, the Brethren discuss the Tathagata's contentment during deprivation
    at Veranja. The Master says that in a former animal birth he had also forsaken
    covetousness, and tells of a parrot who remains loyal to a withered tree. Sakka
    praises the parrot's gratitude, offers a boon, and restores the tree with ambrosia
    when the parrot asks that it bear leaves and fruit again. The Master identifies
    Sakka as Anuruddha and the parrot king as himself.
  language: English
  quote_policy: summarized
