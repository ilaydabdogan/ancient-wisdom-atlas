canonical_text:
  quote: ''
  summary: 'The passage frames a present dispute between an aged priest and a novice,
    then tells a past story in which a snake-charmer mistreats a trained monkey, who
    escapes to a mango tree and refuses reconciliation. The Master identifies the
    old man with the snake-charmer, the novice with the monkey, and himself with the
    corn-merchant. The passage then begins the Gumbiya-Jataka: a Brother regrets ordination
    because of a woman; the Master compares desire to poisoned honey, and a past-life
    merchant Bodhisatta warns a caravan not to eat strange food on a forest road because
    demons poison food left there.'
  language: English
  quote_policy: summarized
