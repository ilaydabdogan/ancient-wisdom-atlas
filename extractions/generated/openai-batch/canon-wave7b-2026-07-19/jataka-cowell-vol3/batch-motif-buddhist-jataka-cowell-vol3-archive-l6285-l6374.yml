canonical_text:
  quote: There is no flavour, Sire, equal to that of love.
  summary: The Master explains that food given with love is better than lavish food
    given without affection, and tells a past-life story in which the ascetic Kesava
    falls ill after separation from his beloved disciple Kappa and asks to be sent
    back to the Himalayas.
  language: English
  quote_policy: quoted
