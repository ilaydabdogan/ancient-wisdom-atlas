canonical_text:
  quote: ''
  summary: A young ascetic is invited to follow a woman toward human settlements.
    After she leaves a trail, he neglects his duties and tells his father he wishes
    to guard his virtue among people. The father counsels him on trustworthy friends,
    warns him against fools and foul conduct, and the son decides to remain in the
    forest. The father teaches him preparatory rites for mystic meditation, after
    which the son gains attainments. The frame narrative identifies the past figures
    with present ones.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young ascetic says his father is in the forest and that he will ask permission
    before accompanying the woman.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman fears the father may find her and kill her with the end of his carrying-pole,
    so she says she will go ahead and leave a trail for the youth to follow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the woman leaves, the youth does not fetch wood or bring drinking water,
    but sits meditating.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The father infers that his son has fallen under a woman’s influence and asks
    why he has neglected his duties.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The youth says virtue guarded in the forest is not very fruitful, says he
    will guard it among people, and asks what kind of men he should associate with
    there.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The father advises him to choose as friend someone who can gain confidence
    and love, trust his word, be patient with him, and avoid offending in thought,
    word, and deed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The father warns him not to incline toward unstable, monkey-like people, and
    not to consort with fools.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The father compares avoiding foul ways to avoiding an angry serpent or a rugged
    road.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the father’s admonition, the youth says he fears going to human settlements
    and will dwell in his father’s presence.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The father teaches the youth preparatory rites for mystic meditation; the
    son develops Faculties and Attainments, and both are destined for birth in the
    Brahma World.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Master proclaims the Truths, the worldly-minded Brother attains fruition
    of the First Path, and the Birth is identified with present figures.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: A note states that one stanza and the first seven of the following verses
    are also found in No. 348.
  category: relationship
  evidence_refs:
  - ev:8
