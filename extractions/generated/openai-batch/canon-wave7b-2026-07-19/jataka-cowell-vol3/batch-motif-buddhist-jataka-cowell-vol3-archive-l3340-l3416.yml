canonical_text:
  quote: ''
  summary: 'The passage frames a former-birth tale: a Brother tempted by thoughts
    of his former wife is told that through her he once had his head cut off. In the
    past, during Brahmadatta''s reign in Benares, the Bodhisatta is a notorious robber
    condemned to beheading. The courtesan Sama sees him being led to execution, falls
    in love, bribes the governor, and deceives her merchant lover. The governor sends
    the robber to Sama in a covered carriage and executes the merchant as a substitute.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Jetavana, the Master tells a story to a Brother who is tempted by thoughts
    of the wife he had left, saying that once before, through her, he had his head
    cut off.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: During Brahmadatta's reign in Benares, the Bodhisatta is born in a Kasi village
    household under the star of a robber.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: When grown, the Bodhisatta gains his living by robbery and is known as bold,
    very strong, and hard to catch.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the robber breaks into a rich merchant's house and carries off treasure,
    townsfolk ask the king to have him arrested.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The city governor captures the robber with the money on him, and the king
    orders the governor to cut off his head.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The condemned robber is bound, given a red kanavera flower wreath, sprinkled
    with brickdust, whipped in every square, and led to execution with a harsh-sounding
    drum.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sama is a courtesan in Benares whose price is a thousand pieces of money;
    she is a favorite of the king and has five hundred female slaves.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sama sees the robber from an upper palace window, finds him handsome and god-like
    in appearance, falls in love, and thinks of making him her husband.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sama sends a female attendant with a thousand pieces of money to the governor,
    claiming that the robber is her brother and asking that he be allowed to escape.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The governor says the robber is too notorious to release openly, but that
    if another man can be found as a substitute he can send the robber to Sama in
    a covered carriage.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A rich young merchant who loves Sama gives her a thousand pieces of money
    daily and comes to her house that evening with the money.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Sama weeps and tells the merchant that the robber is her brother and that
    she needs someone to take money to the governor for his release.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The young merchant volunteers out of love for Sama and carries the money he
    brought her to the governor.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The governor hides the young merchant in a secret place and sends the robber
    to Sama in a close carriage.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: After delaying until night, the governor sends the young merchant to the execution
    place, beheads him with a sword, impales his body, and returns to the city.
  category: action
  evidence_refs:
  - ev:10
