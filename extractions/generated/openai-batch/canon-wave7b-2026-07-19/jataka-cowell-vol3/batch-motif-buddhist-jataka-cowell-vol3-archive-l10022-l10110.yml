  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the next old-world tale, the Bodhisatta is a merchant who gives gifts,
    keeps commands, performs fast-day duties, and has a wife, children, servants,
    and workpeople who also keep the five commands.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The merchant, called Suciparivara or pure household, has an unused couch and
