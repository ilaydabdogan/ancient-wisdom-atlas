canonical_text:
  quote: ''
  summary: 'The passage completes the Migalopa-Jataka: the Master tells an unruly
    monk that in a former birth as the vulture Migalopa he ignored his wise father
    Aparannagijjha, flew beyond the proper limit into destructive winds, and died,
    bringing ruin to his household. The passage then begins the next tale concerning
    Anathapindika''s pure household and an earlier merchant, Suciparivara, who keeps
    moral commands with his whole household and prepares an unused couch and bed for
    a morally purer visitor; the fragment also introduces Kalakanni and Siri going
    with perfumes and garlands to Lake Anotatta.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Jetavana frame, the Master questions an unruly Brother and says that
    in a former time, through unruliness, he did not obey the wise and met death by
    the Verambha winds.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the old-world tale, the Bodhisatta is born as a vulture named Aparannagijjha,
    dwelling with a retinue of vultures at Gijjhapabbata, Vulture Mountain.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Aparannagijjha's son Migalopa is described as exceedingly strong and as flying
    higher than other vultures could reach.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aparannagijjha warns Migalopa that flying too high is unsafe, tells him to
    turn back when the earth looks like a square field, and recalls other birds destroyed
    by wind and tempest.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Migalopa disregards his father's instruction, rises past the appointed limit,
    passes the Black Winds, meets the Verambha winds, and is struck so that he falls
    into pieces and disappears in the air.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Verses state that Migalopa's wife, children, and household herd came to ruin
    through him, and generalize that those who disobey elders meet ruin.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Master identifies Migalopa with the present unruly Brother and Aparanna
    with himself.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the next frame narrative, Anathapindika and his household are discussed
