  text: In the old-world legend, Brahmadatta reigns in Benares, and the Bodhisatta
    comes to life as a young lion who later lives in a wood.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A hare lives near the Western Ocean beneath a palm sapling at the foot of
    a vilva tree.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: While the hare is thinking about what would become of him if the earth were
    destroyed, a ripe vilva fruit falls on a palm leaf.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hare interprets the sound as the solid earth collapsing and flees without
    looking behind.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Another hare asks the cause of the flight, hears that the earth is breaking
    up, and follows; more hares join until one hundred thousand hares flee together.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Several animal species join the flight when told the earth is breaking up,
    and the host of animals extends to the length of a full league.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Bodhisatta sees the animals' headlong flight, hears the reported cause,
    concludes that the earth is not ending and that some sound has been misunderstood,
    and resolves to save the animals.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Bodhisatta gets ahead of the animals at the foot of a mountain, roars
    three times, and the animals stop huddled together.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Bodhisatta questions the animals about who saw the earth collapsing, and
    responsibility is passed back through animal groups until one particular hare
    is identified.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The identified hare tells the lion where he lived, what he had been thinking,
    that he heard the sound of the earth breaking up, and that he fled.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The lion takes the hare to the palm grove, asks him to show the place, and
    the hare points from afar to the place of the dreadful sound.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The lion examines the site, sees the fallen vilva fruit and palm leaf, determines
    that the earth has not broken up, and returns to the herd with the hare.
  category: action
  evidence_refs:
  - ev:7
