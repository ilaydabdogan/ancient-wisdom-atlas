canonical_text:
  quote: ''
  summary: 'An old-world legend explains a noise: a hare near the Western Ocean hears
    a ripe vilva fruit fall on a palm leaf, believes the earth is breaking up, and
    begins a flight joined by many animals. The Bodhisatta, born as a lion, stops
    the herd, questions the source, carries the hare back, verifies the fallen fruit,
    and establishes that the earth has not broken up.'
  language: English
  quote_policy: summarized
literal_observations:
