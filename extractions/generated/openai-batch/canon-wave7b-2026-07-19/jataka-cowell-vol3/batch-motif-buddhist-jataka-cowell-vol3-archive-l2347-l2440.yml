canonical_text:
  quote: ''
  summary: In the frame, a discontented monk is taught by the Master through a past-life
    story. In the old story, the Bodhisatta, born the same day as a prince and raised
    with him, later renounces worldly life, goes alone to the Himalaya, lives as an
    anchorite, and refuses the king's offer of chaplaincy and even universal dominion.
    Sayha cannot persuade him to return. The story ends with conversion in the frame
    and identifications of the former births.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A monk became discontented after seeing a beautiful woman while going for
    alms at Savatthi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master told the monk that wise men of old rejected the dignity of family
    priest and adopted ascetic life.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bodhisatta was born on the same day as the king's son and was raised with
    the prince, receiving the same ornaments and the same food and drink.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Bodhisatta and the prince studied together at Takkasila and returned home
    after attaining proficiency in the sciences.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the prince became king, the Bodhisatta thought he might be given the
    office of family priest and decided instead to become an ascetic devoted to solitude.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Bodhisatta asked his parents' permission, gave up his worldly fortune,
    set out alone, and entered the Himalaya country.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Himalaya country the Bodhisatta built a hermitage, adopted the life
    of an anchorite, developed Faculties and Attainments, and lived in mystic pleasure.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king remembered his friend and sent the councillor Sayha to bring him
    back so that he could be made chaplain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sayha found the Bodhisatta sitting at the door of his hut and conveyed the
    king's request that he return.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Bodhisatta refused not only the chaplaincy but also the realms of Kasi
    and Kosala, India, and the glory of a Universal Empire.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Bodhisatta said that wise people do not take up sins once abandoned.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The verses contrast a throne or sea-girt realm with the life of a homeless
    beggar carrying a bowl from door to door.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Sayha repeatedly urged the Bodhisatta, but the Bodhisatta rejected the offer,
    and Sayha returned to report the refusal to the king.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: At the end of the teaching, the backsliding Brother attained the fruition
    of the First Path, and the Master identified Ananda as the king, Sariputta as
    Sayha, and himself as the family priest.
  category: sequence
  evidence_refs:
  - ev:9
