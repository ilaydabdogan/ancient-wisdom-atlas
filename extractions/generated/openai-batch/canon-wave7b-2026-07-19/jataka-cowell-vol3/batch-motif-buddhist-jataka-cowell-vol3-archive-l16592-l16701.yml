canonical_text:
  quote: ''
  summary: 'The passage closes one Jataka with impossible-condition verses, a courtesan’s
    pardon, and a moral identification by the Master. It then begins the Dipi-Jataka:
    at Jetavana, Elder Moggallana reports a she-goat’s escape from a panther at a
    mountain enclosure. The Master tells an old tale in which the Bodhisatta is a
    renunciant living in a mountain enclosure, and a she-goat tries to save herself
    from a panther by friendly address and argument after the panther accuses her
    of stepping on his tail.'
  language: English
  quote_policy: summarized
