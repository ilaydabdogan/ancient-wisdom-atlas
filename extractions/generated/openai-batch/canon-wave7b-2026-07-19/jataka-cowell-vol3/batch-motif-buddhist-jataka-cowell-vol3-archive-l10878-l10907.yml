canonical_text:
  quote: ''
  summary: A young smith identified as the Bodhisatta demonstrates an extraordinary
    needle with multiple sheaths and proves its strength by driving it through an
    anvil so that it rests on water. The smiths acclaim him; the head-smith gives
    him his daughter and he later becomes head-smith. The closing identifies the smith's
    daughter as Rahula's mother and the clever young smith as the Master himself in
    a former birth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The head-smith receives the object, asks if it is the needle, and is told
    that it is not the needle but the sheath.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bodhisatta removes a sheath with his nail, shows the needle and sheath
    to the people, and places the needle in the master's hand and the sheath at his
    feet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the master again asks about the needle, the Bodhisatta says that the
    apparent needle is also a sheath and removes successive sheaths, laying six sheaths
    at the head-smith's feet before presenting the needle.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The thousand smiths express delight by snapping their fingers and waving cloths.
  category: action
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:5
  text: The head-smith asks about the strength of the needle, and the Bodhisatta instructs
