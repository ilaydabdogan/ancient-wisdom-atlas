canonical_text:
  quote: ''
  summary: 'The excerpt first concludes a story in which the Bodhisatta counsels a
    helpless king that resentment is ended by non-hatred, refuses to harm him, gives
    him a sword, and is later recognized as Prince Dighavu, married to the king''s
    daughter, and restored to his father''s kingdom. It then gives the Migapotaka-Jataka:
    in the frame, an elder grieves for a dead novice; in the past, an ascetic grieves
    for a deer he had raised as a child, until Sakka appears in the air and teaches
    that weeping cannot save the dead. The ascetic ceases grieving and praises Sakka''s
    words as quenching pain and removing sorrow''s barb.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A king says he lies helpless on the ground within the other figure's power
    and does not know how deliverance may be found.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bodhisatta says that good deeds and words, not wealth, bring comfort in
    the hour of death, and he speaks against keeping thoughts of past abuse, blows,
    defeat, and robbery.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Bodhisatta says that those who do not entertain such resentful thoughts
    appease wrath and live together again, and that hate ceases by love rather than
    hate.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Bodhisatta tells the king he will not wrong him, places his sword in the
    king's hand, and tells the king to slay him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king says he also will not wrong the Bodhisatta, swears an oath, goes
    with him to the city, and presents him to the councillors as Prince Dighavu, son
    of the king of Kosala, who spared his life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The king gives Prince Dighavu his daughter in marriage and establishes him
    in the kingdom that had belonged to his father; afterward the two kings reign
    happily and harmoniously together.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Master identifies Prince Dighavu as himself in the birth story.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the frame story of No. 372, an elder admits a youth to orders; the novice
    ministers to him, falls sick, and dies, and the elder goes about lamenting.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Brethren discuss the elder's lamentation, and the Master says the old
    man formerly also lamented when this youth died.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the past story, the Bodhisatta is born as Sakka, while a man from Kasi
    becomes an ascetic in the Himalaya region and lives on wild fruits.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The ascetic finds a young deer that has lost its dam, takes it to his hermitage,
    feeds it, cherishes it, and treats it as his own child.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The deer dies of indigestion after a surfeit of grass, and the ascetic laments
    that his child is dead.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Sakka sees the lamenting ascetic, comes and stands in the air, and recites
    a stanza saying that sorrow for the dead does not suit a lone ascetic free from
    household ties.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The ascetic replies that when a man consorts with a beast, tears give relief
    for grief over a lost playmate.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Sakka says those inclined to weep may lament the dead, but the wise have said
    weeping is vain; if tears could prevail against the grave, all would join to save
    their dear ones.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: The ascetic recognizes the uselessness of weeping and praises Sakka, comparing
    the cessation of his pain to a ghee-fed flame quenched with water and to a wound
    healed by extracting a barb.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: After admonishing the ascetic, Sakka departs to his own place of abode.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: The Master identifies the old man as the ascetic, the novice as the deer,
    and himself as Sakka.
  category: relationship
  evidence_refs:
  - ev:8
