canonical_text:
  quote: ''
  summary: In the Aranna-Jataka, the Bodhisatta is an ascetic father living with his
    son in the Himalayas. A damsel fleeing brigands reaches their hermitage and seduces
    the son, urging him to leave. The son asks his father what kind of companions
    he should seek if he goes to a village. The father advises him to trust only steady,
    harmless, faithful friends and to avoid unstable people. The son decides to remain
    with his father, receives instruction in meditation rites, and both father and
    son are destined for birth in the Brahma-world. The Master identifies the ascetic
    as himself and links the youth and maiden to a later story.
  language: English
  quote_policy: summarized
