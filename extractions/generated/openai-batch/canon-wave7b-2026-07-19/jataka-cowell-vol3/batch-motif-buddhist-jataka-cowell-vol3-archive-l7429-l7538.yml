canonical_text:
  quote: ''
  summary: In the frame, the Master responds to a discussion of Devadatta's pitilessness
    by telling a past story. The Bodhisatta is born as a great elephant leader who
    protects a quail's unfledged young, but a solitary rogue elephant later kills
    them. The quail then obtains help from a crow, a blue fly, and a frog; together
    they blind, afflict, mislead, and destroy the rogue elephant.
  language: English
  quote_policy: summarized
