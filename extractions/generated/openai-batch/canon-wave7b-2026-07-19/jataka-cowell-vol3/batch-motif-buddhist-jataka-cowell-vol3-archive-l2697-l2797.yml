canonical_text:
  quote: ''
  summary: An enraged king tests an ascetic who preaches patience by ordering him
    scourged and dismembered. The ascetic repeatedly says that patience is fixed deep
    within his heart and blesses the king rather than becoming angry. After the king
    leaves, the earth splits, a flame from Avici seizes him, and he sinks into hell;
    the Bodhisatta dies and is given obsequies. The frame identifies the past-life
    figures with Devadatta, Sariputta, and the Buddha.
  language: English
  quote_policy: summarized
