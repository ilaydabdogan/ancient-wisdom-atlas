canonical_text:
  quote: ''
  summary: A speaker rebukes ascetics by distinguishing ordinary leavings or refuse
    from true remnants left after almsgiving. The Bodhisatta shames them and departs.
    In the frame, the Master identifies the figures of the birth, saying the seven
    brothers were the sportive Brethren and Sakka was himself.
