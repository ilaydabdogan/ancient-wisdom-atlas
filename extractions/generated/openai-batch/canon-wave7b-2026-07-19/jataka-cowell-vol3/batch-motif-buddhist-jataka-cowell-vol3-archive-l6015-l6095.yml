canonical_text:
  quote: ''
  summary: A palace heron whose young are killed by royal boys uses a chained tiger
    to kill the boys in return. In the former-birth tale, the heron tells the king
    that his carelessness led to the deaths, acknowledges acting in revenge, refuses
    the king's requests to stay, and flies to the Himalayas. The Master identifies
    the former heron with the present heron and the king of Benares with himself.
  language: English
  quote_policy: summarized
