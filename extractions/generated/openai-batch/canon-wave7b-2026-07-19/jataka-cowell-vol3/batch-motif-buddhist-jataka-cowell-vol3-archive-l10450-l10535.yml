canonical_text:
  quote: '"I should abandon life to-day and give it for my parents"'
  summary: The Master tells of a monk who supports his parents and introduces an old
    tale in which the Bodhisatta, born as the deer Nandiya, supports his parents.
    When people drive deer into a royal park for the king's hunting, Nandiya deliberately
    leaves a thicket to save his parents from capture. Later, after receiving a message
    from his aged parents, he refuses to escape because he feels indebted for the
    king's food and drink and intends to face the king's arrows when his turn comes.
  language: English
  quote_policy: quoted
