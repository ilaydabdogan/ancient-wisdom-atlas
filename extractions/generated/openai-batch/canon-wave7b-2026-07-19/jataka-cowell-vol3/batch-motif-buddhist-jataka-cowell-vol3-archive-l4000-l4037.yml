  quote: ''
  summary: A Bodhisatta figure, identified at the end as a lion and as the Master's
    former birth, reassures a herd of beasts and prevents them from rushing into the
    sea. Verses explain that a hare fled after hearing fallen fruit, other animals
    followed without investigating, and wisdom and virtue reject such panic fear.
