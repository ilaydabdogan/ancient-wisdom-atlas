canonical_text:
  quote: ''
  summary: The passage closes a prior birth-identification and begins the Sasa-Jataka.
    In the frame story, a Savatthi landowner gives requisites and food to Buddha and
    the monks, and Buddha responds by telling of wise beings of old who gave even
    their own flesh. In the old story, the Bodhisatta is born as a young hare living
    with a monkey, jackal, and otter near a mountain, river, and village. The hare
    teaches almsgiving, moral conduct, and observance of holy days. On seeing that
    a fast-day is approaching, he instructs his companions to feed any beggars. The
    otter, jackal, and monkey gather food; the hare, having only grass, resolves that
    he would offer his own flesh if a beggar came. Sakka notices signs of the hare's
    virtue, resolves to test him, disguises himself as a brahmin, and first asks the
    otter for food; the otter offers seven red fish.
  language: English
  quote_policy: summarized
