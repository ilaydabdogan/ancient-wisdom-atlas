canonical_text:
  quote: ''
  summary: 'The passage closes a preceding tale with a warning, flight, and the Master''s
    identification as a tree-dwelling divinity. It then opens the Tittira-Jataka:
    at Vulture Peak the Brethren discuss Devadatta''s plots against the Buddha, and
    the Master says Devadatta also tried to kill him formerly. In the old-world legend,
    a Benares professor instructing five hundred young brahmins retires to a forest
    hut on the Himalayan slopes. Animals live near or serve him, including a partridge
    that learns the three Vedas by listening. After the professor dies, the partridge
    teaches the students, is honored with a golden cage and offerings, and becomes
    famous. When the students leave for a festival, they entrust the bird and hermitage
    to a lizard; a wicked ascetic then arrives.'
  language: English
  quote_policy: summarized
