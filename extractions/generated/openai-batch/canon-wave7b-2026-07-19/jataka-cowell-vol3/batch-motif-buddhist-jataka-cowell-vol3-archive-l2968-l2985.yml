canonical_text:
  quote: '"fear not ; no danger shall come nigh you"'
  summary: The Bodhisatta explains to the king that a cry was uttered by a dweller
    in Hell suffering the result of wrongdoing. He reassures the king, who then orders
    the release of many sacrificial victims and the destruction of the sacrificial
    pit. The Bodhisatta later returns to his place of ecstasy and is born in the world
    of Brahma. The Master identifies Sariputta as the young priest and himself as
    the ascetic.
  language: English
  quote_policy: quoted
