  quote: ''
  summary: A wise ruler teaches that lay life and sense pleasures are insecure, restores
    the kingdom to a friend, leaves royal power despite others' lamentation, becomes
    an ascetic sage in the Himalaya, enters meditative ecstasy, and is destined for
    the world of Brahma. In the frame, the Master declares the Truths, gives the drink
    of ambrosia to many, and identifies the former-birth figures.
