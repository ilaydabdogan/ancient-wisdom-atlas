  text: The family priest and brahmins prepare a sacrificial pit, and many victims
    are brought and fastened to stakes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Bodhisatta sees the situation with his divine eye, decides to act for
    the creatures' well-being, flies through the air by magic power, and sits in the
    king's garden.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The chief disciple asks whether the Vedas say there is no happiness for those
    who take life; the priest tells him to keep silent and focuses on bringing the
