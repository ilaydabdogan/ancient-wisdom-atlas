  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The youth brings the king to the Bodhisatta, and the king asks about the origin
    of the noises.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Bodhisatta identifies the four beings as men formerly guilty of misconduct
    with neighbours' wives near Benares and reborn in Four Iron Cauldrons.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The beings are tortured for thirty thousand years in thick corrosive liquid
    heated to boiling, alternately sinking to the bottom and rising to the top of
    the cauldron.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Each being attempts to utter a complete stanza but manages only one syllable
    before sinking again into the iron cauldron.
  category: action
  evidence_refs:
