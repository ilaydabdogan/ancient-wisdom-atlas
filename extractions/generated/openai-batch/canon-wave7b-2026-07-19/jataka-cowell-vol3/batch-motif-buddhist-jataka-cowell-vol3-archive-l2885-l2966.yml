canonical_text:
  quote: ''
  summary: The king of Benares is frightened by four sounds from beings in Hell and
    accepts brahmin advice to perform a fourfold sacrifice. A priest and brahmins
    prepare a sacrificial pit and bind many victims. The Bodhisatta, seeing this with
    his divine eye, comes by magic to the royal garden. A priest's disciple objects
    to killing and brings the king to the Bodhisatta. The Bodhisatta explains that
    the four cries are incomplete syllables uttered by four men reborn in iron cauldrons
    because of former misconduct; he supplies the moral stanzas they had failed to
    speak.
  language: English
  quote_policy: summarized
