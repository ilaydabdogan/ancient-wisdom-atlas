canonical_text:
  quote: ''
  summary: The passage recounts kings who observe ordinary events—a pair of bracelets
    making noise, birds attacking a hawk for meat, and bulls fighting over a cow—and
    from these observations attain insight and paccekabuddha-hood. It then describes
    four paccekabuddhas travelling magically for alms to the Bodhisatta's house, where
    he offers hospitality and asks what caused their renunciation; the first answer
    invokes a fruitful mango tree broken for its fruit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: King Naggaji watches a woman grinding perfume; when her bracelets are on separate
    hands they do not rub or jingle, but when two are on one hand they rub together
    and make a sound.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Naggaji reflects that living beings make disturbance when they become two
    or three, decides to live like a single bracelet by ruling himself rather than
    another, and attains spiritual insight and paccekabuddha-hood.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: King Nimi sees a hawk flying with meat while other birds surround, peck, strike,
    and beat it; when the hawk drops the flesh, the birds leave it and attack whichever
    bird takes the meat next.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nimi reflects that sorrow comes to whoever takes the flesh and happiness to
    whoever relinquishes it; he connects this to the five pleasures of sense and attains
    paccekabuddha-hood.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: King Dummukha sees bulls rush toward one cow; a great bull, jealous with lust,
    gores another bull in the thigh so that its entrails come out and it dies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Dummukha reflects that living beings suffer through lust, resolves to abandon
    lusts, and attains paccekabuddha-hood.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Four paccekabuddhas leave a cave, attend to ablutions and needs at named places,
    take bowl and robe, fly magically through the air, tread on five-coloured clouds,
    and alight near a suburb of Benares.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Bodhisatta sees the four paccekabuddhas, welcomes them into his house,
    seats them, gives water of respect, and serves hard and soft food.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Bodhisatta asks each paccekabuddha what topic of thought led to religious
    life and ordination; they answer by naming their former kingships and causes of
    retiring from the world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The first spoken stanza describes a full-grown, dark, very fruitful mango
    tree in a forest that men break for its fruit, and says this sight inclined the
    speaker to take the bowl.
  category: speech
  evidence_refs:
  - ev:6
