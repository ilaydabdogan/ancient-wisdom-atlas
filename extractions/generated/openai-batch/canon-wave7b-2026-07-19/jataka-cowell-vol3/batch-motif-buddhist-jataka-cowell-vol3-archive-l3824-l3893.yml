canonical_text:
  quote: ''
  summary: The passage closes one moral instruction on choosing worthy companionship
    or solitude, then gives a Jataka frame in which the Master explains that a youth
    who destroyed a hut had behaved angrily in a past life. In the past-life tale,
    the Bodhisatta is a singila bird living in a rain-proof nest in the Himalaya;
    a cold monkey nearby admits that he lacks wisdom, is admonished to cultivate virtue
    and build a leaf hut, becomes resentful, attacks the bird, and destroys the nest
    after the bird escapes. The Master identifies the present youth with the monkey
    and himself with the bird. The passage then begins the Daddabha-Jataka frame,
    describing heretics near Jetavana practicing thorn-bed and fire austerities, which
    the Master says have no virtue; an editorial note points to a Tibetan parallel
    and a folklore reference.
  language: English
  quote_policy: summarized
