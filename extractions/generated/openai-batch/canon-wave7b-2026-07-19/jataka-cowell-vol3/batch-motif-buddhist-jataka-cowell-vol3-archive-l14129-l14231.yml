canonical_text:
  quote: ''
  summary: The Master, addressing five hundred Brethren overcome by desire, tells
    an old story. The Bodhisatta is a tree-spirit living in a cotton-tree. A huge
    roc-king seizes a giant snake-king from the ocean; the snake clings to a banyan,
    which is uprooted and carried with him to the cotton-tree. A bird from the banyan
    perches in the cotton-tree, and the tree-spirit trembles because the bird may
    drop seeds that will grow into parasitic trees and destroy the spirit's home.
    The roc-king asks why the tree fears a tiny bird after bearing the weight of the
    roc and snake. The tree-spirit explains the danger of seeds carried by birds.
    The roc-king affirms prudent fear of real danger and drives the bird away. The
    lesson ends with the Brethren attaining Sainthood and the Birth being identified.
    The passage then begins another tale about a Kosala king whose favour toward newcomers
    leads to military defeat.
  language: English
  quote_policy: summarized
