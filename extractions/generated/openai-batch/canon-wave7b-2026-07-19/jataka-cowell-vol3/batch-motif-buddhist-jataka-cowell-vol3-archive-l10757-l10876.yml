canonical_text:
  quote: ''
  summary: In the Jetavana frame, the Master introduces an old birth story as an example
    of wisdom and skill in devices. In the old tale, the Bodhisatta is a poor but
    highly skilled smith who hears of a wealthy head-smith's beautiful daughter and
    wants to make her his wife. He crafts an extraordinary needle with seven sheaths,
    travels to the head-smith's village, and hawks the needle. The maiden challenges
    the idea of selling needles in a village of smiths; the Bodhisatta replies that
    superior skill can sell there and predicts her father would give him her hand
    if he knew the needle. The head-smith calls him in and arranges a public demonstration
    before the gathered smiths with an anvil and a water-filled bronze dish. The excerpt
    ends as the Bodhisatta presents the needle-tube.
  language: English
  quote_policy: summarized
