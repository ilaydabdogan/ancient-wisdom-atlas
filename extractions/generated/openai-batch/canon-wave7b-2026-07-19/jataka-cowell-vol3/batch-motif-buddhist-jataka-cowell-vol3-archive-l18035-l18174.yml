canonical_text:
  quote: ''
  summary: A Jataka frame reports the Master rebuking a greedy Brother by telling
    of a greedy crow who, unsatisfied with carrion and fish, encounters two golden-coloured
    ruddy geese at a lotus-tank and asks what food gives them beauty. The goose answers
    that they live harmlessly on the sevala plant and teaches that harming creatures
    leads to decay while non-harm brings beauty and strength. The frame identifies
    the crow with the greedy Brother and the he-goose with the Master. The passage
    then begins another Jataka in which a maiden tries to lure a young ascetic from
    forest virtue to the haunts of men.
  language: English
  quote_policy: summarized
