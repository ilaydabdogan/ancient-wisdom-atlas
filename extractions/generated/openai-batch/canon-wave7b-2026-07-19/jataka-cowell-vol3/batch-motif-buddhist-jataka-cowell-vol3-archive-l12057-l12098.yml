canonical_text:
  quote: ''
  summary: The Master frames the tale at Jetavana in connection with a Brother who
    supported his mother. In the past, the Bodhisatta is born as Sutana, a poor householder's
    son who supports his parents and then his mother. The king of Benares goes hunting;
    an antelope deceives him by pretending to be struck, then flees. The king pursues
    and kills the deer, carries its pieces, and sleeps beneath a roadside banyan.
    A yakkha named Makhadeva, dwelling in that banyan and entitled to eat beings who
    come there, seizes the king. The king bargains for release by giving the deer
    that day and promising to send a man with a plate of rice daily. The yakkha warns
    that he will eat the king if no one is sent, accepts the promise, and releases
    him.
  language: English
  quote_policy: summarized
