canonical_text:
  quote: ''
  summary: An old mango-watching ascetic falsely accuses four merchant’s daughters
    of eating mangoes and makes them swear oaths. The Master says the same thing happened
    formerly. In the past-life story, the Bodhisatta as Sakka observes a false ascetic
    neglecting priestly duties to guard a mango orchard, uses supernatural power to
    make the mangoes appear plundered, and later drives the ascetic away after the
    daughters are released.
  language: English
  quote_policy: summarized
