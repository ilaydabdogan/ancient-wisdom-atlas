canonical_text:
  quote: ''
  summary: The passage opens the Sulasa-Jataka. In the present story, a female servant
    borrows a valuable ornament for a feast-day outing, detects that a thief intends
    to kill her for it, tricks him at a well, and kills him. The Master says she had
    shown such wits before and had killed the same man before. In the former-birth
    tale, Sulasa, a wealthy woman of Benares, falls in love with the condemned robber
    Sattuka, frees him, and lives with him. Sattuka later plans to kill her for her
    ornaments, lures her to a mountain-top under pretext of a tree-deity offering,
    reveals his intent beside a precipice, and demands her jewels; she pleads for
    her life and offers him the ornaments and servitude.
  language: English
  quote_policy: summarized
