canonical_text:
  quote: Be grateful all, and for reward you long in heaven shall dwell.
  summary: The Bodhisatta hears the she-elephant's complaint, promises to restore
    her honour, and reminds the king of her former battlefield and messenger service.
    The king admits he gave her to a potter for carrying dung, and the Bodhisatta
    admonishes him in stanzas about remembering services received and practicing gratitude.
    The king restores the old elephant's former honour, gives alms, performs merit,
    and is said to be destined for heaven. The birth-identification names the she-elephant
    as Bhaddavatika, the king as Ananda, and the minister as the Master's former self.
  language: English
  quote_policy: quoted
