canonical_text:
  quote: ''
  summary: 'The Master tells a former-birth story about Devadatta''s ingratitude:
    the Bodhisatta, born as a woodpecker in the Himalaya, removes a bone from a lion''s
    throat after propping open the lion''s jaws with a stick. Later the healed lion
    refuses any return kindness, saying the bird''s survival is enough reward. The
    woodpecker condemns hoping for repayment from an ingrate and flies away. The Master
    identifies Devadatta as the lion and himself as the woodpecker. The passage then
    begins Chavaka-Jataka: after reproving priests for teaching from a low seat while
    pupils sit higher, the Master tells of a pariah householder whose pregnant wife
    craves mangoes; he goes by night to the king''s ever-fruiting mango tree, climbs
    it, and hides there when day breaks.'
  language: English
  quote_policy: summarized
