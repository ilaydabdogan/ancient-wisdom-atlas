canonical_text:
  quote: These flowers are not meet for a wicked and evil man.
  summary: At a royal festival, divine beings return with flower perfume and stand
    in the royal court. The people bring a wicked brahmin before them; he pleads for
    his life. The divine beings rebuke him for deceit and false words, remove a wreath
    of flowers from his head, admonish the people, and depart. The Master then identifies
    the former-birth roles.
  language: English
  quote_policy: quoted
