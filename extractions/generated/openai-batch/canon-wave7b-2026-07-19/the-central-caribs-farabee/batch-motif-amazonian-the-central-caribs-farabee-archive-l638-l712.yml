canonical_text:
  quote: ''
  summary: 'The passage describes Central Carib and neighboring textile and cordage
    practices: hammock construction and suspension, cotton loin cloths, baby carriers,
    head bands, anklets, beaded aprons, spindle construction, and the use and twisting
    of cotton, aeta palm, ixtle grass, and Ananas fibres into strings and cords.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a hammock body is finished, heavier cord scale lines are threaded through
    warp loops at both ends, and the swinging rope is made from aeta palm fibre or
    Ananas fibre by men.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that hammock comfort depends on scale-line length and arrangement,
    and that cotton hammocks made by savannah Indians, Arawak and Carib, are especially
    serviceable, comfortable, and convenient in the author's view.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hammocks for dogs are sometimes made by tying the ends of a broad piece of
    bark and suspending it with rope.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Cotton loin cloths for men are one to two yards long, about eight inches wide,
    and are worn between the legs over a plaited belt.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Waiwai men are described as usually wearing a longer cloth that also serves
    as a belt and is fastened with a timber hitch, with tassels hanging at the front.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Baby carriers are endless cotton bands, sometimes made of bark, worn over
    the shoulder so that the child sits in the loop beside the mother's hip while
    her back remains free for a pack basket.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Narrow endless head bands are worn by young women of marriageable age at dances.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Leg bands or anklets are woven in place; examples in the collection were woven
    around a wooden stick.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Women’s beaded aprons are made on a small bent-stick loom with bead strings
