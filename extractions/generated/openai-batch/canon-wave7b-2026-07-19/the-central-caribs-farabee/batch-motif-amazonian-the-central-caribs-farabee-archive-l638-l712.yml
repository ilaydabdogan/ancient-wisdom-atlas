  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The spindle is a hard-wood stick with a hook at the top and a whorl of stone,
    shell, or pottery near the lower end to hold thread and add momentum.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Cotton, aeta palm fibre, ixtle grass, and Ananas fibre are used for different
