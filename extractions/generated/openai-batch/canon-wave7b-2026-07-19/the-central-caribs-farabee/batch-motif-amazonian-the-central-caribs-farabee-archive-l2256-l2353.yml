canonical_text:
  quote: ''
  summary: 'The passage describes Macusi dance occasions, especially the paricari
    dance: a host-guest double dance with named bird roles, circular formations, music,
    drinking, partner selection, invitations by knotted cords, village arrival, and
    formalized hospitality speech.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Macusis dance to mark visits, successful hunts, completed undertakings,
    abundance of food, fish poisoning, return from distant hunting, house building,
    field making, and courtship desires.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that all dances are more or less drinking bouts, and that
    the drink often gives the dance its name.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The paricari dance is described as the most elaborate and important dance
    and as a double dance in which invited guests take the paricari part and hosts
    take the tukui part.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The names paricari and tukui are identified with birds; the passage explicitly
    says these birds are not totems and that the reason for the names was not learned.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The tukui dance in a small inner circle to the rhythm of the tuwi, while the
    paricari dance in an outer circle with independent music.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The village head man leads the tukui and carries the rattle staff, while the
    visiting head man leads the paricari dancers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Dancers move in pairs facing the center, with women placing a hand on a male
    partner’s shoulder and changing hands during the inward, outward, and rightward
    steps.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The paricari drink is kept in a large trough or canoe in the middle of the
    house, and the dancers move around this receptacle.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the tukui leader ends his song, the girl in charge of the drink sips
    from a calabash bowl and passes it to the visiting head man, who drinks and passes
    it along; another bowl is given to the tukui leader and then to other dancers.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Women select new partners by placing a hand on the desired partner’s shoulder
    after the leader signals with a shake of his rattle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The drink is described as slightly intoxicating; some dancers drop out, men
    drink large quantities, and women are said never to drink to excess.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: Before a paricari dance, the head man sends messengers to invited villages
    carrying knotted cords, or quipus, whose knots correspond to the number of intervening
    days.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: Visitors arrive by villages the day before the dance, bringing family members
    and pets, and announce their presence with reed flutes.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:14
  text: The visiting head man enters the house, approaches the host head man’s hammock,
    announces his arrival, gives news, sits on a stool, and receives cassava soup
    from a woman.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: 'The reception includes a formalized conversation: the host initially remains
    in his hammock without looking at visitors, later sits by the visiting head man,
    talks at length, listens to a reciprocal speech, and both end with diminishing
    grunts before normal conversation begins.'
  category: speech
  evidence_refs:
  - ev:7
