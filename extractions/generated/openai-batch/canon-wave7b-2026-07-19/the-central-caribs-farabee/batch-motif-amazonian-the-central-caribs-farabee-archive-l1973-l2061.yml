  summary: The passage describes gendered work roles among the Macusis and neighboring
    groups, then details clothing, ornaments, bead aprons, dancing back ornaments,
    men’s loin cloths, puberty-associated first loin cloths in some tribes, body paint
    from annatto, and belts or carriers made from jaguar skin, liana, bark, and other
    materials.
