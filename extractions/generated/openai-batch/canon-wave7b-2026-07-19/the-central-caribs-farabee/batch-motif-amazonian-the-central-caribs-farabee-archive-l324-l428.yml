canonical_text:
  quote: ''
  summary: 'The passage describes Macusi communal-house construction and interior
    organization: door closure and darkness for protection from insects and kenaimas;
    palm-leaf roofing; family sections with hammocks and women’s hearths; clean dark
    interiors; stools, hammocks, hanging food storage, weapons and tools; shared and
    individual utensils; and a corn-grinding technique using a log mortar and long
    pestle.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The house has one door, and a movable door of leaves or bark is set in place
    at night to prevent entrance by mosquitoes and kenaimas.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Earth is thrown against the outside wall and no crevice is left open; the
    dark interior helps keep small black flies from entering.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The roof is made from palm leaves, with construction details varying according
    to the palm species used.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Communal houses have no partitions between family apartments; each family
    has a private section with hammocks and belongings.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Each woman has a small three-stone fireplace near the outer wall for family
    cooking and nearby storage of food, bowls, water gourds, and firewood.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The house interior is dark, without windows, and light enters through the
    door, smokeholes, and joints in the bark wall.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Smoke from many fires blackens the roof and framework, while the floor becomes
    hard and smooth from bare feet and is kept clean.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Rough food-preparation tasks such as preparing cassava roots and removing
    corn husks are done in the open or in a small work house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: House furnishings include stools and hammocks; an invited visitor is offered
    a hammock, and men often rest in hammocks for coolness and protection from flies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The house stores food and personal belongings, including corn bunches, seed
    corn, bananas, gourds, baskets, and other items hung from beams or rafters.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Bows and arrows may be stuck into the roof or placed on a platform, while
    the long blow gun must be suspended from the ridgepole to avoid warping or bending.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Forked sticks are hung from the roof as supports for keeping food out of reach
    of dogs that move freely in the house.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Large utensils for food processing, festival drink, and hammock weaving are
    kept in work houses or the center of the large house for common use, while smaller
    items are individual.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Corn is ground in a log mortar with a long hardwood pestle by pressing and
    revolving rather than pounding; the woman grinding braces one foot on the mortar
    and moistens her hands with saliva.
  category: sequence
  evidence_refs:
  - ev:10
