literal_observations:
- id: obs:1
  text: Macusi houses may be square, round, or elliptical, and may house one family
    or many families.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'A man''s house size is described as depending partly on whether his children
    are daughters or sons: married daughters bring husbands to live in the father''s
    house, while sons eventually leave.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Villages are grouped without a regular plan and may stand near together or
    apart along a stream; the usual location is high open savannah away from a stream
    and cultivated fields, though some are on streams near fields.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: House walls are made of palm leaves, bark, or adobe and are closely built
    for protection against insects and cold dry-season winds from the mountains.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The tight wall is also said to keep out kenaimas, described as evil geniuses
    lurking at night and trying to injure or kill anyone unprotected.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Bark walls use sections of heavy tirikir tree bark set on end and lashed to
    horizontal stringers to make a tight, smooth wall.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Round and rectangular house frames vary by size; a small round house may have
    only a center pole, while larger round houses add interior and wall posts, and
    rectangular houses use corner, side, and end posts with a ridge pole.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: An elliptical communal house is described with wall posts, two principal posts,
    a projecting ridge pole, a small open gable for smoke, and a roof of cokerite
    palm leaves.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: One house at Kazawing was built five feet above the ground on posts, floored
    with chouta palm planks, and had a clay fireplace in one corner.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Small work houses stand near dwelling houses for grinding corn and making
    cassava farina, and contain tools and materials such as mortar, pestle, cooking
