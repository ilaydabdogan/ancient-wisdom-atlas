literal_observations:
- id: obs:1
  text: Dutch traders are described as the first visitors to Macusi country, traveling
    up the Essequibo River to plains south of the Pakaraima Mountains in the early
    eighteenth century.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nicholas Horstman was sent in 1738 to find a passage from the Essequibo to
    the Amazon and to discover El Dorado; he crossed the divide, reached the Negro,
    remained with the Portuguese, and produced a map later published by d’Anville.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At that time the Macusis are said to have occupied the region north of the
    Kanuku Mountains and the Takutu River.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Andre Fernandes de Sousa listed fifteen Indian tribes near the Rio Branco,
    and the passage says these tribes communicated with the Dutch by crossing an isthmus
    between the Itacutu and the Ripanuni.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Johann Natterer visited the Rio Branco in 1832; his ethnological report is
    described as lost except for a Macusi vocabulary published by Martius.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Robert Schomburgk found about three thousand Macusis in 1835 in the same territory
    earlier reported, and he described them with positive physical, vocal, moral,
    and social qualities.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Appun, Im Thurn, and Coudreau later visited the Rio Branco region and found
    the Macusis still occupying the same old territory.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that there are no Macusi villages east of the Rupununi
    or south of the Seriri Mountains in Guiana; their largest villages are in the
    Kanuku Mountains and near Lake Amucu.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: In Brazil, Macusi villages are described as lying mostly between the Takutu
    and Uraracuera Rivers and the high mountains to the north.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Arecunas are described as a closely related Carib tribe living north of
    the Macusis, while the Wapisiana Arawaks live to the south.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Macusis are said to live in peace with their neighbors at present, but
