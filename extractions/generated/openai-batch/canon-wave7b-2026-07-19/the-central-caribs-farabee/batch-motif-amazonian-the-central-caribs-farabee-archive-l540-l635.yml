canonical_text:
  quote: ''
  summary: 'The passage describes Macusi and neighboring material culture: women''s
    and men''s baskets, decorated shoulder baskets used in visiting and barter, pottery
    and calabash vessels, water gourds, cotton spinning, hammock weaving, and reported
    transmission of spinning knowledge among Arecunas, Macusis, and Wapisianas.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women make rough narrow-mouthed lidless baskets for small trinkets, and these
    are seen hanging near the fireplace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men spend time and skill making trinket boxes or shoulder baskets that they
    carry on many occasions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men's baskets are made from maranta splints, use black and light splints to
    form geometric or animal designs, may have telescoping lids, shoulder cords, and
    bright feather tufts.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: When visiting, a man carries a basket with toilet articles, ornaments, mending
    things, and small trade objects; on arrival he bathes, paints his body, and puts
    on ornaments.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The baskets are bartered from tribe to tribe, and the Waiwais are described
    as making the best ones.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: The Macusis make cooking and storage pots, but the passage says calabash often
    takes the place of pottery vessels.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: Pottery is made by coiling clay, smoothing it, tempering it with ashes, firing
    it in the open, and pouring cassava juice over it while hot to fill the pores.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Large pots used for storing or ripening drink may hold about twenty gallons
    and are placed against main posts inside the large house.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:9
  text: Water is carried and stored in gourds, and dippers and food or drink bowls
    are made from calabash half shells.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: Women collect, spin, and weave cotton, while men make strings and larger cords
    from other fibres.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Cotton is dried in leaf-lined baskets suspended from the roof, seeded by hand,
    pulled into bands, spun with a spindle, and wound into balls stored in leaves.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Cotton thread is prepared for hammocks, breech cloths, and baby carriers;
    larger hammock threads are made by uniting threads from two balls.
  category: object
  evidence_refs:
  - ev:4
- id: obs:13
  text: The passage states that the Wapisianas say they learned spinning from the
    Macusis, and that the Macusis learned the art from the Arecunas.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: The loom is wound horizontally and then stood upright; the weaver sits on
    the ground and passes woof threads by hand, without shuttle or batten.
  category: sequence
  evidence_refs:
  - ev:5
