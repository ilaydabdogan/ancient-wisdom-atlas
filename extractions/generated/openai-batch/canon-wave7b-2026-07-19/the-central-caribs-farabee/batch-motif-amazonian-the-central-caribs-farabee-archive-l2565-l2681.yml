canonical_text:
  quote: ''
  summary: The passage describes Macusi beliefs and practices concerning kenaimas
    as unseen human attackers who cause delayed death; attribution of death to hostile
    agents and a reported divination method; puberty and menstrual restrictions; marriage
    rules and bride-service; and childbirth practices including solitary delivery,
    cord treatment, and hanging the placenta in a tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kenaimas are described as real men rather than spirits, with abilities other
    men do not have, and they are known by their effects rather than by being seen.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kenaimas attack only a person who is alone; this leads people not to travel,
    hunt, or go out at night alone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A kenaima attack is said to draw no blood and leave no visible sign, and the
    victim dies in three days with no cure.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Reported attack methods include piercing the tongue with a poisoned stick,
    manipulating or tying the intestine, or wrestling with the victim and causing
    skin irritation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage states that a man is not thought to die naturally, but is killed
    by kenaimas or by evil spirits sent by a piazong of an enemy tribe.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A reported divination method places cut-off parts of a corpse in a new pot
    of water over fire; boiling bubbles throw out one piece toward the guilty parties.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Macusis are said to have no formal puberty ceremonies, but girls cut their
    hair short, wear a white cotton headband for two months, avoid work, and avoid
    meat or arrow-shot fish.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: During the catamenial period girls and married women remain secluded, remove
    ornaments, avoid meat and arrow-shot fish, and wives do not bake bread for husbands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Macusi marriage is described as exogamous and monogamous; a boy marries a
    cross-cousin and lives with his wife in her mother’s house.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The groom demonstrates ability to provide by bringing much game for the marriage
    feast; both families prepare food and drink, and a dance is held in the girl’s
    village.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Near the end of the dance the boy and girl withdraw, consummate the marriage
    alone, return, and enter the girl’s home to live.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: After marriage the boy serves his father-in-law until a child is born, after
    which the couple may establish their own home.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:13
  text: Marriage usually occurs at the end of the rainy season, also the planting
    season, and the boy clears land for his own future household before marriage.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:14
  text: For childbirth, the mother retires alone to the bush or a secluded place,
    gives birth kneeling, and then calls an assistant who brings warm water for the
    child.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: The umbilical cord is tied with cotton, cut with a bamboo knife, and cauterized
    with fire; the placenta is hung in a tree and must not be buried.
  category: action
  evidence_refs:
  - ev:6
