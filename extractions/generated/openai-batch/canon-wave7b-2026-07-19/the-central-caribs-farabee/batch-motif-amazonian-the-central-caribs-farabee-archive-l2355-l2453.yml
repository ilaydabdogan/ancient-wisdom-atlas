canonical_text:
  quote: ''
  summary: The passage describes three Macusi dances, including rattle-directed warepang,
    mawari with an unseen evil spirit, and kaka in which a leader is selected through
    wrestling at a house entrance and marked with soaked cassava bread. It then describes
    children’s projectile games and a toy catapult. The final section outlines Macusi
    political and household authority, including the head man, medicine man, father,
    public opinion, repayment practices, family feud, and father-in-law authority.
  language: English
  quote_policy: summarized
