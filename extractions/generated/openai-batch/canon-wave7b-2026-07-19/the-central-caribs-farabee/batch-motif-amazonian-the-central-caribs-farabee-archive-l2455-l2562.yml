canonical_text:
  quote: ''
  summary: The passage describes the Macusi piazong or medicine man as a feared and
    revered religious specialist who diagnoses and expels harmful spirits, uses medicines
    and practical procedures, trains apprentices, calls bird and animal spirits during
    healing, can also send destructive spirits or empowered drinks, and recognizes
    kenaima forest beings as causes beyond his control.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The piazong is described as the religious head of the village and controller
    of spirits.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sickness and disabilities are attributed to evil influence from a medicine
    man in another village, and pains may be caused by foreign objects or spirit-like
    objects in the body.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The piazong’s principal duty is to discover and drive away foreign spirits,
    while also sometimes performing slight operations and giving medicines.
  category: action
  evidence_refs:
  - ev:1
  - ev:4
- id: obs:4
  text: A selected boy is trained in medicines, herbs and their locations, tribal
    traditions, professional methods, exorcising voice use, and imitation of animal
    and bird calls.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the reported fever treatment, the work was done in darkness and quiet with
    tobacco juice in a calabash and bunches of tcipuyeyare leaves placed nearby.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: During the treatment, the piazong gurgled and spat tobacco juice, made yells
    and calls, shook leaves to represent arriving spirits, questioned bird and animal
    spirits, and eventually persuaded the right spirit to leave the patient.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The piazong also uses drinks, blowing, ritual speech, herbal teas, bleeding,
    salves, and other remedies for specific conditions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The piazong can be employed to punish a victim by preparing or blowing upon
    a drink, after which the victim is said to swell, die, or lose flesh.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kenaimas are described as little people living deep in the forest who come
    out at night to attack, kill, or punish people, and the piazong is said to have
    no control over them.
  category: attribute
  evidence_refs:
  - ev:6
