canonical_text:
  quote: ''
  summary: The passage gives Central Carib interlinear text with English biblical
    passages. John 4:46-54 recounts a nobleman whose son is sick at Capernaum; Jesus
    speaks that the son lives, the fever leaves at the same hour, and the father and
    household believe. The passage then begins 1 Thessalonians 1, where Paul, Silvanus,
    and Timotheus greet the Thessalonian church, thank God for them, describe their
    reception of the word amid affliction, their example to Macedonia and Achaia,
    and their turning from images to the living and true God.
  language: English with Central Carib interlinear text
  quote_policy: summarized
