literal_observations:
- id: obs:1
  text: Small amounts of poison are used on darts to get birds for pets; after the
    bird drops, the dart is removed and salt is rubbed into the wound, with salt stated
    to be the only known antidote for curari.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Macusis obtain reeds for blow guns from the Arecunas, who get them near
    the headwaters of the Orinoco.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The blow gun is described as a straight reed tube placed inside a palm stem,
    often covered with pitch and wound with bark or split lianas, with heavier winding
    at the butt for balance.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wapisiana blow guns are said to have palm-nut or spool-shaped hard-wood mouthpieces,
    while Macusi guns are plain and have an enlarged funnel-shaped opening cut from
    the reeds.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Blow-gun sights are usually one or two agouti teeth set in wax on the weaker
    side of the barrel; the gun is suspended by the small end from the ridge pole
    to prevent warping.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Blow-gun darts are made from cokerite palm midrib and carried in a wax-coated
    wicker quiver with a tapir-skin cap; the quiver also has a pirai jawbone, a small
    cotton basket, and curari poison at the bottom.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Before shooting, a man cuts the dart partly through with pirai teeth so the
    end will break off in the wound, wraps cotton around the dry end, inserts it in
    the butt of the gun, and fires it with a sudden puff.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage says the blow gun and poisoned peccary arrow are not used in warfare;
    it identifies a large bamboo-pointed arrow as the war arrow and says Arawak and
    Carib traditions point to the arrow as the primary war implement.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'The passage lists three traveler or storyteller danger stories: attack by
    Indians with blow guns, danger from eating animals shot with poisoned arrows,
    and danger from drinking river water below a fish poisoning; the author states
    travelers were not in danger from these causes.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: In a Macusi village, men and older boys hunt, fish, clear fields, select field
    locations, and build houses, while women assist in burning, carry and plant cassava
