canonical_text:
  quote: ''
  summary: The passage describes Macusi and regional cassava processing into bread
    and farina, including grating, pressing out poisonous juice, baking, drying, storage,
    and trail use. It also describes corn, nuts, Brazil nuts, pumpkins, squashes,
    sweet potatoes, peppers, sugar cane, melons, and a dietary health note. It states
    that Caribs and Arawaks in the region apparently learned farina manufacture from
    Brazilian Indians in comparatively recent times.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cassava roots are pulled up, carried home, peeled, washed, and grated by women.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The grater is positioned with one end in a receptacle and the other against
    the operator's thighs; roots are rubbed over angular stones until reduced to pulp.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cassava pulp is put into a cylindrical press; a woman sits on a lever to stretch
    the press, forcing poisonous juice out through the wickerwork into a bowl.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After pressing, the dry cassava cylinder is released, broken up, and rubbed
    through a coarse sieve to remove woody fibre.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Cassava bread is baked on a hot oven or pan; a palm-leaf fan spreads and turns
    the cake, a wooden paddle smooths the edge, and the bread is dried on the house
    roof before storage.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Farina is made by stirring and breaking cassava pulp on the baking pan and
    cooking it longer until brown and parched; white farina is stored in small conical
    baskets.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Yellow or water farina is made by soaking the roots in water before grating;
    farina is described as desirable trail food that can be eaten dry or mixed with
    water, soup, meat, fish, vegetables, or drinks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Among the Macusis, corn is described as the second most important food and
    is roasted, parched, made into hominy, ground, or mixed with cassava to improve
    bread.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Nuts and seeds are gathered and eaten; Brazil nuts are eaten raw, pounded
    for oil used on hair and body, or mixed with cassava or sweet potatoes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Pumpkins, squashes, sweet potatoes, peppers, sugar cane, watermelons, and
    muskmelons are listed as foods or drink sources; sugar cane juice is extracted
    with a press.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: A diet confined entirely to cassava bread or farina tends to distend the stomach,
    especially in children, and the condition disappears with age or dietary change.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that Caribs and Arawaks of the region apparently learned
