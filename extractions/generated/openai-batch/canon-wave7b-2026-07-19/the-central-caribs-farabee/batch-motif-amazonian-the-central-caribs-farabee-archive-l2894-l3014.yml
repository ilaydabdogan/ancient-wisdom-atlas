canonical_text:
  quote: ''
  summary: The passage recounts episodes about two brothers who discover and cut down
    a great tree bearing all kinds of edible plants, release a world-covering flood
    from the tree, survive in two miritci palms, restore the sun, bring fish into
    pools through commanded attacks by pirai and electric eel, and later leave the
    world from a marked rock. It then introduces Macusi cats’ cradles/string figures
    and notes parallels with other groups and regions.
  language: English
  quote_policy: summarized
