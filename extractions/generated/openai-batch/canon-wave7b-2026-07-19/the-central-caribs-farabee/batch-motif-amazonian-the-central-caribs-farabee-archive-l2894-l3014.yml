  text: The younger brother tells a pirai to bite the elder brother and an electric
    eel to shock him, after which fish come to the pools.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The brothers follow the sound of a conch shell down the Essequibo, build great
