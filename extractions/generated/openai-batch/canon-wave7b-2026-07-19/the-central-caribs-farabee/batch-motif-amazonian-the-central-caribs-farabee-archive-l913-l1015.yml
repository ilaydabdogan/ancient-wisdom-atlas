canonical_text:
  quote: ''
  summary: 'Ethnographic description of Macusi subsistence and food preparation: agriculture,
    hunting, fish poisoning, cooking and smoking foods, animal and insect foods, salt
    procurement from Wapisianas near Mount Seriri, and processing bitter cassava into
    flour and bread by removing poison.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Macusis are described as relying more on agriculture than on hunting and
    fishing, while also undertaking long hunting journeys and seasonally poisoning
    river pools to catch fish.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Meat and vegetables are cooked by boiling, baking, or roasting; meat can be
    preserved for several days by continual roasting and smoking on a barbecue.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Most native animals are used as food, with exceptions including jaguar, puma,
    anteater, and sloth; monkey meat is especially preferred.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some birds are eaten and others avoided as unclean; several game birds are
    shot with bow and arrow after being called by Indian imitators.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Land tortoises and water turtles are sought for their flesh; turtles are caught
    on sand-bars when they come out at night to lay eggs, and their eggs are eaten.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When other food is scarce, insects are eaten, including palm beetle grubs
    and wasp grubs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: During the dry season, pools are poisoned to capture fish in large numbers;
    large catches are roasted on a barbecue and smoked over fire at home.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Macusis eat salt and formerly obtained it from Wapisianas, who evaporated
    water collected in shallow pools near the foot of Mount Seriri.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Bitter cassava flour and bread are described as the principal food of central
    Carib tribes and regional Arawaks; the roots contain poisonous milky juice, which
    is extracted and rendered safe by heat.
  category: sequence
  evidence_refs:
  - ev:8
