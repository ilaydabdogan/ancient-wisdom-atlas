  summary: 'The passage describes Macusi food plants, friction fire-making and resin
    lighting, and the manufacture and social use of several cassava-based drinks:
    paricari for major dances, paiwai for a named dance, and yaposa as an everyday
    hospitality drink offered to arrivals.'
