  summary: The passage presents English Christian liturgical excerpts and Central
    Carib text with English glosses or translations, including Te Deum material, the
    Lord’s Prayer, responses, the Confession, Gloria, and Venite. It names the Father,
    Son/Christ, and Holy Ghost; describes Christ’s birth from the Virgin’s womb, death
    overcome, heavenly enthronement, future judgment, and blood redemption; and includes
    prayers for food, forgiveness, deliverance, mercy, restoration, praise, and worship
    of the Lord as maker of sea and dry land.
