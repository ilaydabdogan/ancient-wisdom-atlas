canonical_text:
  quote: ''
  summary: 'The passage gives step-by-step string-figure instructions for six named
    forms: Tcekawa, a crab; Footo, a clam; Maiyosi, a spider; Watiwelito, a sex organ;
    Malkanuni, the six-o’clock beetle; and Fotcokwa, a drink. It also states that
    the fish trap and the howling monkey’s jaw are the same as similarly named forms
    among the Macusis.'
