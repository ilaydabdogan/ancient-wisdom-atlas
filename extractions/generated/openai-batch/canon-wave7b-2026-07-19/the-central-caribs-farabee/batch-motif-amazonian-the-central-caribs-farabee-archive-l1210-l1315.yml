canonical_text:
  quote: ''
  summary: The passage describes Macusi fruit and palm drinks, meal order and guest
    hospitality, hunting rites and charms called binas, a deer-hunter ceremony using
    caladium leaves and aeta-palm thongs, and the care and ritual treatment of hunting
    dogs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Macusis make drinks from ripe fruit and palm seed pulp mixed with water,
    and they are said not to drink water except when on the trail.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the trail, workers eat at daybreak, about eleven o’clock, and at dark.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men and women do not eat together in ordinary household practice; men and
    boys eat first, and women and girls remove the pots and eat what remains.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A wife brings bread and a cooking pot to her seated husband; boys eat with
    the father, and a childless wife may eat at the same time and from the same pot
    but must stand.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When strangers arrive, women bring food and drink, the chief invites the visitors
    to eat, and women visitors are taken inside to eat with village women and girls.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The drink is presented without a spoken greeting, no thanks are returned with
    the empty bowl, and the empty receptacle must be returned by the person who first
    received it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Macusis are described as primarily agriculturists, with hunting and fishing
    supplementing the diet; men observe rites to secure help from spirits in hunting
    success.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Each animal is said to have a particular charm or bina for its capture; roots,
    leaves, other objects, or actual animal parts such as heart, head, or bone may
    be used as amulets.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: A special charm is needed for hunting savannah deer, which are difficult to
    approach because they take fright at scent or movement.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The would-be deer hunter macerates caladium leaves in water, makes aeta-palm
    fibre thongs, soaks them, pulls them through the nasal passages and mouth, and
    hangs them in the house as evidence that he has performed the deer-hunter ceremonies.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Forest tribes are described as depending more on the chase and paying more
    attention to hunting dogs, which are kept on platforms to protect their feet from
    jiggers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Women carry hunting dogs to the creek for bathing and carry them away from
    and back to the house; dogs have binas, may be stung with ants if lazy or poor
    at scenting, and are used especially for peccary and tapir hunting.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
