canonical_text:
  quote: ''
  summary: The passage describes preparation of plant fibres for cordage, gendered
    manufacture of cords, nets, hammocks, belts, and related ornaments, the use and
    harvesting of forest lianas called bush ropes, and Carib agricultural clearing
    by cutting and burning forest vegetation during the dry season while retaining
    fallen logs in fields.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ixtle fibre is freed by soaking the leaf in water, beating it over a rock,
    washing the fibre, and drying it in the sun.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ananas leaves are stripped through a loose double slip knot tied to a small
    tree or house post; a sudden jerk removes soft parts and lets the strong fibres
    pass through.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The processed Ananas fibre is described as producing the strongest and smoothest
    cord among the fibres discussed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Men collect materials, make strings and cords, and manufacture nets; women
    spin and weave, including hammocks and breech cloths, while men make hammock ropes
    and belts.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bush ropes are pliant lianas or creepers used as ready-made substitutes for
    manufactured cords, varying from thread-like sizes to large cables and from one
    foot to one hundred feet in length.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Pulling down a hanging bush rope requires twisting it under tension, slackening
    it so the twist kinks near the top, and then jerking it to break it off.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Bush ropes are used to tie house frameworks, roofs, and sidewalls, and to
    make traps, snares, and baskets.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Water from one type of bush rope is said to slake a hunter’s thirst, while
    water from another is used to poison fish.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Open savannah land is described as unsuitable for cultivation without irrigation
    because dry-season sun and winds remove moisture before the rains return.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Fields are usually made in forest depths where soil is rich and surrounding
    trees help retain moisture.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: During the dry season, trees and underbrush are cut down, left to dry, and
    then burned, while blackened trunks remain where they fell.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Burning leaves ashes over the field, and fallen logs, decomposing bark, and
    ashes are said to aid fertility and moisture retention.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:13
  text: Corn is planted along fallen logs, and fallen logs also serve as pathways
    through cassava fields.
  category: action
  evidence_refs:
  - ev:6
