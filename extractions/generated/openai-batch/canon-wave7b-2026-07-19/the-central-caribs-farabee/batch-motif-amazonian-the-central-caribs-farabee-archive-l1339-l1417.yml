canonical_text:
  quote: ''
  summary: 'The passage describes Central Carib and neighboring hunting methods: a
    pole funnel trap for peccaries, horn signals and dog-assisted pursuit of tapir
    and deer toward water, traps and snares for birds and small animals, fire and
    nets in deer drives, canoe shooting of iguanas, hilltop drives, and stalking through
    imitation of animal calls.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A peccary trap is made from small poles tied or woven into a tapering funnel,
    with the large end placed at the hole and the narrow end lifted and tied to crossed
    poles.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the peccary rushes out, its legs pass between the poles; one man blocks
    retreat while another kills it with the end of a pole.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The text states that this peccary trap is used by all Carib and Arawak tribes
    in the region.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: When a tapir is aroused, the hunter sounds a horn in three blasts at intervals
    and repeats the signal to tell listeners the direction of travel.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tapirs and deer flee toward water; dogs chase them to a water hole, where
    hunters kill them with spear, bow, or arrow.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A beehive trap for birds uses scattered seeds, a support, and a string pulled
    by a boy on watch to let the trap fall.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A loop snare is placed in an animal runway and attached to a bent pole held
    by a trigger; the moving animal releases the pole and is lifted from the ground.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: A net may be stretched across a deer runway, grass set on fire, and frightened
    deer driven into the net to be killed by hidden men.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Iguanas sun themselves on bushes or rocks along rivers and are shot from a
    canoe with a bone-tipped arrow with a lateral projecting barb.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The hunters are described as skilled at stalking game and imitating animal
    calls, with different animals responding to calls in different ways.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Monkeys answer and follow calls, but may be cautious, leave companions behind,
    and hold to tree branches after being struck by an arrow.
  category: action
  evidence_refs:
  - ev:8
