  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the first planting, cultivation is limited; weeds are pulled briefly,
    young shoots are stripped from stumps, and mature cassava branches shade the ground
    and retain moisture.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Corn and sweet potatoes are planted with cassava and ripen before the cassava
    dominates the field.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Indians value careful selection of new seed and make long journeys to
