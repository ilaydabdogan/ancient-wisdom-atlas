  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Sweet cassava is used as a vegetable and is planted in the same field as the
    poisonous variety.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Cassava is described as well suited to the tropics because it needs less moisture
