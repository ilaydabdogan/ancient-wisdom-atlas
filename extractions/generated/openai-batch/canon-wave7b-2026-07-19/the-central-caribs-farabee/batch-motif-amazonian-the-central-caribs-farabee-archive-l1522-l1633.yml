canonical_text:
  quote: ''
  summary: The passage describes fish-trapping and fish-poisoning practices among
    the Macusis and related or neighboring groups. It details dam and funnel traps,
    dry-season pool poisoning with liana pulp, direction by a head man or chief, collection
    and processing of fish, seasonal restocking when rains return, and an observed
    Waiwai stream-poisoning event using aiya bush rope.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A simple fish trap is made by building a dam across a river or restricting
    water through a narrow opening into a funnel-shaped trap.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A double trap can include an inside funnel that lets fish pass inward but
    prevents them from returning; the end may be untied to remove the fish.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Another trap is a truncated cone made of sticks, planted on the bottom of
    a pool, with fish removed by hand from the top.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The pirai is described as having sharp teeth that cut fishing lines and make
    hook fishing difficult.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: During the dry season, the Macusis, like the Wapisianas, catch fish by poisoning
    pool water with liana collected in the forest and pounded into pulp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Before a pool poisoning, people may camp at the pool, build barbecues, gather
    firewood, and make baskets for collecting fish.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: On the poisoning day, men work under a head man who directs poison carriers
    and the later collection of dead fish.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Baskets of poison pulp are moved up and down in the water, drained, returned
    to the rock for more pounding, and then taken back to the water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Affected fish rush about before dying; pirai or other vicious fish are speared
    and thrown out by the men handling the poison.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: When the man in charge signals, people rush in to gather fish; the fish are
    later cleaned, barbecued, feasted on, smoked, and carried to the village.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: Large lower-river pools cannot be poisoned, preserving fish that restock rivers
    when the rains return.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: 'Interior head-stream tribes use different methods: they do not fish with
    hooks, use a trap for pirai, and poison streams where fish are smaller and moving.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: In the Waiwai event, aiya bush rope was cut, carried to the village, pounded
    into shreds, collected into baskets, and taken to the river.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: During the Waiwai poisoning, men worked the poison in rapids above a pool,
    younger men waited downstream to spear fish, and the chief later gave a signal
    for everyone to rush for fish.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Waiwai poison killed fish at varying distances downstream, with dead fish
    later observed floating as far as a mile and a half below the poisoned pool.
  category: setting
  evidence_refs:
  - ev:8
