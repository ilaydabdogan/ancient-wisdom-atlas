canonical_text:
  quote: ''
  summary: A wedding is delayed for a year because O'Conachar of Sligo has a service
    claim. The man travels swiftly to O'Conachar, gives his name as Goodherd, bargains
    to protect the spoil while O'Conachar keeps out the chase, and sets a wage condition
    about not making half cups with him for a day and year. After raiders break in,
    Goodherd kills them with holly and a grey hand-plane. He then sees O'Conachar
    after drinking a vessel of milk and water, accuses him of breaking the promise,
    and leaves angrily. At MacCeochd's house, the carl's daughter gives him a drink
    of green apples and warm milk, and he chokes. The passage ends with a first-person
    formula involving odd gifts and a glass road.
  language: English
  quote_policy: summarized
