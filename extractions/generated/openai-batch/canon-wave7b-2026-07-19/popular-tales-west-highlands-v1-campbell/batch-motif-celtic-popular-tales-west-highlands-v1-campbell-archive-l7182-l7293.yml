canonical_text:
  quote: ''
  summary: A farmer’s three daughters meet a hoodie at a river; the two elder refuse
    his marriage proposal, while the youngest accepts. After marriage she chooses
    that he be a man by day and a hoodie by night. Their three sons are each taken
    away at night while beautiful music causes everyone to sleep. After the wife forgets
    a coarse comb, the coach becomes a withered faggot and the husband departs as
    a hoodie. She follows him through hills and houses of light, receives shelter
    and advice, fails to seize him when he comes, keeps a ring and feather, learns
    smithing, makes horseshoes for her hands and feet, and crosses a hill of poison.
  language: English
  quote_policy: summarized
