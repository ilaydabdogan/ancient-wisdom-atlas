canonical_text:
  quote: ''
  summary: 'Campbell summarizes a Barra version of “The Three Soldiers”: three deserters
    come to a castle, encounter three swans who become women, receive conditional
    food and clothing, lose these comforts when the Irishman thinks of the swans,
    and later receive three magic gifts. The Irishman loses or misuses the gifts in
    connection with a king’s daughter, is stranded on a remote island, uses red and
    grey apples that grow and remove deer horns, returns by ship, causes the lady
    to grow horns, pretends to cure her, recovers the lost gifts, and finally returns
    with his friends to the swan-women, whose spells end before marriage. The collector
    also notes affinities with an Islay version and with German/Grimm parallels.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The version is said to have three soldiers identified as English, Scotch,
    and Irish; the Scotchman and Irishman desert, the English sergeant follows them,
    is persuaded to desert, and they come to a castle.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the castle the men eat, sleep, wake to find dresses, and find a board set
    with meat and drink for breakfast.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Englishman has a gun and begins to load it when he sees three swans swimming
    on a loch.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The swans cry out to the Englishman, come ashore, and become three women.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The women promise daily clothing and food on the condition that the men neither
    think nor order one of the women to be with them in lying down or rising up.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The men remain for a year in the castle, but after the Irishman thinks of
    the swans, the men have only their old clothes in the morning.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the loch the swans again come ashore as women and give a purse, a knife,
    and a horn with stated magical powers to the three men.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Irishman falls in love with the king’s daughter, is cheated out of the
    horn, loses the borrowed purse, and uses the knife to transport himself and the
    king’s daughter to a remote island.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: On the island the king’s daughter takes the knife to pare her nails and wishes
    herself back to the place where the nails grew on her; she is then in her father’s
    house.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Red apples cause deer horns to grow on the Irishman’s head, while grey apples
    make the horns fall off.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Irishman gathers apples, signals a ship from a tree with a torn shirt,
    and is rescued by a skipper who is under an oath not to leave a man in extremity.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Irishman sells a red apple to the lady, horns grow on her, and he later
    pretends to use a divining book and saws before recovering the lost gifts.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: After recovering the gifts, the Irishman returns to his friends; they go to
    the swans, the spells leave the swans, and marriages follow.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The collector says the story is close to an Islay version and also has a German
