canonical_text:
  quote: ''
  summary: A General or officer claims credit for severed heads of a loch beast while
    the true rescuer, a lad associated with a black horse, repeatedly comes to the
    king's daughter, is awakened by her earrings, fights the beast, and fastens its
    heads on a withy. When the General is to marry the king's daughter, she requires
    that the groom be able to remove the heads from the withy without cutting it,
    and the General cannot do so.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The General threatens the woman to say that he took the beast's head, and
    the return to the king's house is greeted with rejoicing because the king's daughter
    is alive and the beast's head is displayed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the loch, the fearful Uile Bheist stirs in the water; the apparent hero
    slinks away, and the man of the black horse arrives in another dress, though the
    king's daughter recognizes him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The lad tells the king's daughter to rouse him by placing her earring in his
    ear; when she does this, he wakes at once.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The lad fights the beast, cuts off another head near nightfall, puts it on
    the withy, and leaves on the black horse while the king's daughter goes home with
    the heads.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The General takes the heads from the king's daughter and tells her to say
    that he removed the beast's head this time also.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: On the next day, the officer hides, the hero of the black horse comes, the
    king's daughter wakes him with another earring, and he cuts off the beast's third
    head after a struggle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A wedding with the General is expected, but the king's daughter says she will
    marry only the one who can remove the heads from the withy without cutting it;
    the General tries and cannot loosen them.
  category: sequence
  evidence_refs:
  - ev:7
