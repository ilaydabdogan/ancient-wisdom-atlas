canonical_text:
  quote: ''
  summary: A lad meets the Bailie's daughter after tearing her dress, is invited to
    her father's house, and discovers that both saw each other in sleep on the same
    night. The daughter agrees to marry him but sends him home for a year because
    local law requires the Bailie to give her by the hand to the bridegroom. On his
    return journey to London, the lad, identified in dialogue as the Gael, meets a
    Sassanach/Saxon gentleman. Their road conversation includes wordplay about setting
    a net and sowing lint, the Saxon's competing claim that he is going to marry the
    Bailie's daughter, and a food-sharing episode in which the Saxon takes the Gael's
    remark about travelling with one's mother literally. A heavy shower begins at
    the end of the passage.
  language: English
  quote_policy: summarized
