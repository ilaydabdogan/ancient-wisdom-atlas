canonical_text:
  quote: ''
  summary: The passage first comments on Gaelic translation and then recounts the
    end of a tale in which Maol escapes a giant by substituting his dog and cat in
    a sack meant for roasting, flees with arms, and the pursuing giant falls into
    a waterfall at a bridge. Maol and the king's son become heirs. Campbell then lists
    related tales and analogues. The passage closes with a fable in which a fox catches
    a goose, is tricked into shutting his eyes to say grace, and loses his prey over
    a loch.
  language: English with some Gaelic
  quote_policy: summarized
