canonical_text:
  quote: ''
  summary: 'The passage, from Campbell''s introduction, describes a category of Gaelic
    popular lore framed as local popular history: recent events without dates but
    with clear starting points, named battles, clans, places, graves, descendants,
    exile to Ireland after conquest, and a tale of MacLean exposing his wife on Lady
    Rock after ship sabotage motivated by jealousy. It also notes that such lore is
    local, abundant, and socially influential, then begins a fourth category of plausible
    tales about men and women.'
  language: English
  quote_policy: summarized
