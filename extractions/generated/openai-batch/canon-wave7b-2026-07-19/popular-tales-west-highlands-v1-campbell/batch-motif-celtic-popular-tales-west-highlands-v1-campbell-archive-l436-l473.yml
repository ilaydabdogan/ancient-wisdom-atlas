  summary: 'The narrator describes driftwood: one log was carried to a cave and burned;
    another in South Uist was about to be incorporated into a cottage roof; another
    in Benbecula lay near ship fittings and a wreck. The passage compares these changes
    of driftwood to the way popular tales are found, used, altered, and sometimes
    recognized within later plays or romances.'
