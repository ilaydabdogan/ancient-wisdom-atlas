canonical_text:
  quote: ''
  summary: 'The collector describes Gaelic storytelling practice in the West Highlands:
    clergy in some places had condemned it, causing tales to fall into disuse, while
    elsewhere a skilled storyteller’s house served as a winter evening gathering place.
    He argues that popular romance is not harmful and lists recurring story patterns,
    including a mother’s blessing leading to success, the poor becoming princes, the
    weak and courageous overcoming giants, and wisdom excelling brute force.'
