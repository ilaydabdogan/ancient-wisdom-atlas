canonical_text:
  quote: ''
  summary: The Ceabharnach, appearing as a ragged young man, joins Taog O-Ceallaidh
    on a raid against a carlin's spoil. He asks only that his drink not be forgotten.
    During the raid he stops the drove with a whistle, defeats the pursuing force,
    then raises the drove again with another whistle. When Taog forgets the first
    drink, the Ceabharnach claims half the spoil, citing a precedent with Murcha MacBrian;
    Taog grants the claim, but the Ceabharnach leaves the people and the spoil behind.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the wedding had been put in order, the Ceabharnach left the town quickly
    and came to Taog O-Ceallaidh, who was going to raise the spoil of Cailliche Buidhne.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young man was seen in ragged clothing, with shoulders through his coat,
    ears through his hat, water-filled tattered shoes, and a sword extending beyond
    its scabbard.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Ceabharnach asked whether Taog needed men and whether he would receive
    a man's share if he did a man's share.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: He named himself Ceabharanach Saothrach Suarach Siubhail, glossed in the passage
    as the servile, sorry, strolling kern.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: For his service, the Ceabharnach asked that his drink not be forgotten, and
    he said he was an Albanach from many places.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The raiders raised the carlin's spoil and then saw a following or chase coming
    after them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When Taog asked whether he would turn the chase or drive the spoil, the Ceabharnach
    answered that if the chase would turn, they would drive the spoil.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Ceabharnach cut a sharp, hard whistle, and the drove lay down on the road.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: He turned to meet the pursuers, caught each by the slenderest legs and biggest
    head, left them stretched legs on head, and returned after the spoil.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After Taog said the spoil would never get up, the Ceabharnach cut a whistle;
    the drove got up, and he drove it home.
  category: sequence
  evidence_refs:
  - ev:6
