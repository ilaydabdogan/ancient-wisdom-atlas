canonical_text:
  quote: ''
  summary: A woman living with a splendid man asks to visit her father. He warns her
    not to remain until she bears a child and gives her a steed controlled by a bridle.
    On repeated visits to her father, children are born at night, music causes the
    household to sleep, and the man comes and removes the children. After the third
    removal, her father threatens her until she tells him what is happening. When
    she later tries to summon the steed, it does not come. She returns on foot, finds
    only the man's mother, and is told she may still catch him; she goes on until
    night and sees a distant light.
  language: English
  quote_policy: summarized
