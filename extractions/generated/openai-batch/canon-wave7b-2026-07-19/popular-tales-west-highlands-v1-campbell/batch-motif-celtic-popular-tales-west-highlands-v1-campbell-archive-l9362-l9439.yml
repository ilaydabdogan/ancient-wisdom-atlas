canonical_text:
  quote: ''
  summary: Connal hides in a gold-filled creel, kills a giant with the giant's sword
    of light, and takes the gold and sword away. Later, while hunting, he enters a
    cave where a woman is preparing to roast a baby for another giant. Connal hides
    the baby, substitutes a corpse, survives among the dead bodies, and kills the
    giant with a heated flesh stake. After returning home, his stepmother sends him
    and her own son to steal the whitefaced horse of the King of Italy; the horse
    gives alarm, and the two are captured and bound.
  language: English
  quote_policy: summarized
