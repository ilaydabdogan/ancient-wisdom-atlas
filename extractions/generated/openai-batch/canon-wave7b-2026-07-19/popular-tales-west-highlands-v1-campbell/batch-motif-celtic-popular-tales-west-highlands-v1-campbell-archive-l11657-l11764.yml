canonical_text:
  quote: ''
  summary: 'The passage first summarizes parts of an Italian tale variant: a hidden
    daughter travels inside a wardrobe sold overseas to King Genese, later emerges
    to keep his room, is discovered, marries him, bears two sons, and is then framed
    after her father Tebaldo murders the children. An astrologer and old nurse reveal
    the truth, and Tebaldo is violently punished. Campbell compares this with Gaelic
    tale endings and with Perrault''s Peau d''Ane, then comments on the worldwide
    interweaving of tale traditions. The passage then begins the Gaelic tale ''The
    Poor Brother and the Rich,'' in which a poor brother and his hired gillie steal
    a cow from the rich brother; the rich brother hides his mother-in-law in a kist
    to spy, but the gillie discovers her and chokes her with cheese.'
  language: English
  quote_policy: summarized
