comparison_claims:
- id: claim:1
  claim: Campbell presents the summarized Italian tale material as evidence that popular-tale
    form remained similar over nearly three hundred years while local scenery, names,
    ornaments, and actors changed.
  claim_level: same_function
  target: Straparola Italian tale material and later popular-tale narration
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: This is Campbell's authorial comparison; the passage gives only a summary
    rather than side-by-side full variants.
- id: claim:2
  claim: The violent punishment of Tebaldo is explicitly compared with endings of
    many Gaelic tales in which the wicked are torn between horses, burned among fires,
    and scattered as ashes.
  claim_level: same_motif
  target: Gaelic tale endings for wicked figures
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: Only one Gaelic ending formula is quoted; individual tale contexts
    are not supplied in this passage.
- id: claim:3
  claim: Campbell says the French 'Peau d' Ane' diverges onto another tale-road and
    belongs to a class of stories that has Gaelic relations, especially through the
    magical donkey element.
  claim_level: same_motif
  target: Peau d' Ane and a Gaelic-related class of magical-donkey stories
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The Gaelic relations are asserted but not demonstrated with a specific
    Gaelic parallel in the passage.
- id: claim:4
  claim: Campbell characterizes popular tales as an interconnected worldwide network
