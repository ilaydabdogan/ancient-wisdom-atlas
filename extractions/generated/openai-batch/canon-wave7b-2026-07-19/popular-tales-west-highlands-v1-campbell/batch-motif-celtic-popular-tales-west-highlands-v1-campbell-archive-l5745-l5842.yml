canonical_text:
  quote: ''
  summary: A widow's son reaches the king's daughter in the giant's house. She warns
    him that the giant will kill him, hides him, and the giant is induced to reveal
    where his life is kept. After a false claim involving a grey cairn, the giant
    says his life is in an old oak stump by a river. When the stump is split, a hare,
    salmon, and heath hen emerge in sequence and are taken by the hero's dog, otter,
    and falcon. The giant offers gold and silver for his life, but the widow's son
    destroys the stump and the giant dies. The widow's son and the daughter remain
    in the giant's house and land. Campbell then adds notes on dress, tale variants,
    reciters, gaming, and resemblances to other Gaelic tales.
  language: English
  quote_policy: summarized
