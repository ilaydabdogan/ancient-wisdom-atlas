canonical_text:
  quote: ''
  summary: The Shifty Lad and his master steal from the king's storehouse. A pitch
    trap catches the master; the Shifty Lad removes stolen goods, cuts off the master's
    head, takes and buries it, and leaves the body in the pitch. The king, advised
    by the Seanagal, has the headless body displayed on soldiers' spears to detect
    anyone who grieves for it. When the wright's wife screams, the Shifty Lad cuts
    himself and explains the scream as fear of his wound. The king then orders the
    body to be hung on a tree and watched.
  language: English
  quote_policy: summarized
