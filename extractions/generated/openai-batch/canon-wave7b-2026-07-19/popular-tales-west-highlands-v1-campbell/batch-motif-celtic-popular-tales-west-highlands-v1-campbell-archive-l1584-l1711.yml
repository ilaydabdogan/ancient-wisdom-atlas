  summary: The introduction discusses comparative relationships among Scottish Gaelic,
    Lowland Scottish, Norse, German, Danish, French, Italian, English, and Arabian
    Nights tale materials. It cites a Buchan/Grosart manuscript, oral transmission
    by Gaelic-speaking workers and drovers, a London tinker’s version of the tale
    of the man who traveled to learn shivering, and cases where foreign story incidents
    appear localized into West Highland narrative style.
  language: English
