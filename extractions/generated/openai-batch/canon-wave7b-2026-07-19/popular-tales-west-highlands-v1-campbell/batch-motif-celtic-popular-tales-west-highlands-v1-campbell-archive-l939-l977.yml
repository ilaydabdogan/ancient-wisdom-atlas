  quote: ''
  summary: The narrator describes sitting for hours in a peat-smoked dwelling with
    an old man by the fire while waiting for the tide to ebb, then crossing a ford.
    He then identifies other Gaelic-speaking men in remote island places as poor,
    old, clear-headed, and possessing strong memories. He contrasts these remote tradition
    bearers with mainland regions where schools, books, and newspapers have displaced
    tales, and notes that farther east stories are rarer and more often told by women.
  language: English
