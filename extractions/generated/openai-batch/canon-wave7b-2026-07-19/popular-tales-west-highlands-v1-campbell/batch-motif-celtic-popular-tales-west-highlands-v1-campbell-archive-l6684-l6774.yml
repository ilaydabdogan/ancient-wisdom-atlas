    that he earlier heard an abridgement connected with Mary MacCalum.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: A mouse and a wren quarrel in a barn over a grain of oats that the mouse intends
    to eat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The wren brings twelve birds, the mouse brings her tribe, and the wren breaks
    the mouse's leg with a flail.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The creatures of the plain and of the air join the quarrel in a pitched battle,
    after which only a raven and a snake remain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king's son sees the snake twined round the raven's neck and the raven
    holding the snake's throat; after both promise friendship for help, he slays the
    serpent.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The raven lives for a year and a day in the palace, then takes the king's
    son hunting and carries him over nine Bens, nine Glens, and nine Moors.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king's son receives hospitality from three sisters because he comes from
    the land of the birds' battle and brings news that the raven is alive; he keeps
    tryst and returns to the raven.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: On the third day a mist comes, the raven cannot be found, and the king's son
    sees a yellow-ringleted man with a golden comb and a silver comb, whom he refuses
    to take instead of the raven.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The yellow-ringleted man says he was the black humpy raven, placed under spells
    by a bad druid, and freed by coming with the king's son to his father's house;
    he gives the king's son a book and instructions for using it.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The king's son looks in the book at the bottom of a glen, rather than from
    a hill top, and sees his father's house at the bottom of a peat hag with shut
    doors and windows and no way to reach it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A giant shows the king's son his father's house on top of a hill with doors
    and windows open in exchange for the promise of the king's son's first son; the
    passage states the giant had cast the spell that caused the peat-hag vision.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the old king dies, the king's son takes the kingly chair, marries, and
    has a son; the giant later demands the king's son be sent out, threatens to overturn
    the castle, and detects an attempted substitution with the cook's son by asking
    about a rod.
  category: sequence
  evidence_refs:
  - ev:8
