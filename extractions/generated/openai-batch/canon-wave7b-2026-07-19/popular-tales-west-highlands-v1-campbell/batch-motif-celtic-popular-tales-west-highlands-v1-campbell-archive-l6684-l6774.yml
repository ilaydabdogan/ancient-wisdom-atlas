canonical_text:
  quote: ''
  summary: The passage closes one version with a wedding involving the bride, Mother's
    Blessing, a dog, and a priest, then introduces John Dewar's Gaelic version of
    the tale. In that version, a mouse and wren quarrel over oats, their sides wage
    a battle, and only a raven and serpent remain locked together until a king's son
    kills the serpent. The raven becomes the king's son's helper, carries him across
    repeated landscapes, and later is revealed as an enchanted yellow-ringleted man
    formerly under a druid's spell. He gives the king's son a book with instructions
    for seeing his father's house. The king's son misuses it in a glen, meets a giant
    who offers help in exchange for the promise of his first son, and later the giant
    returns to claim the child, exposing an attempted substitution with the cook's
    son.
  language: English with some Gaelic terms
  quote_policy: summarized
