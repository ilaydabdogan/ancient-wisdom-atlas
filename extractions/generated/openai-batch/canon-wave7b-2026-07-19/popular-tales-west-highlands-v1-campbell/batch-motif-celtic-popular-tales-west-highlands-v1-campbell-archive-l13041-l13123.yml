canonical_text:
  quote: ''
  summary: The passage contains the end of a fable in which a fox tricks a wolf into
    laying his tail on moonshine in ice, then alerts a farmer; the wolf flees and
    leaves his tail behind, explaining why the wolf is stumpy-tailed. A commentary
    compares this to a Norse bear stumpy-tail tale. The passage then gives a Sutherland
    account of a lost child found in a cairn with young wolves; three lads return,
    kill the young wolves and the adult wolf, and bring the boy home. A commentary
    compares the account to Romulus and Remus, to reports from Oude of wolf-carried
    and wolf-suckled children, and to a Highland wild-boar variant.
  language: English
  quote_policy: summarized
