canonical_text:
  quote: ''
  summary: 'The passage records testimony about nineteenth-century Highland oral storytelling
    customs: winter gatherings, itinerant artisans and guest storytellers, riddling,
    discussions of the Fein and Fiunn, and a reported oracle tooth of Fiunn. It also
    describes the decline of such gatherings after the arrival of minister and schoolmaster,
    notes independent collection of similar story versions, and summarizes a theory
    that Indo-European popular tales preserve traces of earlier language, religion,
    and history.'
  language: English
  quote_policy: summarized
