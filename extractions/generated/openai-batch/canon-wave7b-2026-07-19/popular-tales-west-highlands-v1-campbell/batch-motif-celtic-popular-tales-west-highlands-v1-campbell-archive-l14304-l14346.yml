canonical_text:
  quote: ''
  summary: A second version of the Ceabharnach story opens with O'Donull holding right
    and justice. He sees a ragged young man, the Ceabharnach, arriving with torn clothing,
    wet shoes, and a sword protruding beyond its scabbard. After an exchange of blessings,
    O'Donull asks his art; the Ceabharnach says he can do harping. O'Donull takes
    him to hear twelve men perform, asks his opinion, and the Ceabharnach disparages
    the sound by comparing it to a hideous screech at the Isle of Cold. O'Donull then
    asks whether he will play, orders that he be given a harp, and says he can play
    well.
  language: English
  quote_policy: summarized
