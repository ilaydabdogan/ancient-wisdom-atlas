  summary: The passage discusses disputes over the best Gaelic dialect, then generalizes
    about national feeling, rivalry, and group combativeness. It gives examples of
    reciprocal contempt among English, French, Highlanders, Lowlanders, Irish Celts,
    and Scotch Celts; shifting alliances against common enemies; personified national
    lions; a herring-net dispute between fishing fleets; and a northern-town riot
    that became framed as a Celt-and-Saxon fight.
