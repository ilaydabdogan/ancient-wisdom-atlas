canonical_text:
  quote: ''
  summary: The narrator enters a smoky dwelling and sees a frightened young girl crouched
    in a dark corner. A priest says she might have fled without the party's small
    Lapp attendant. The narrator tries to sketch her, but she runs away and is coaxed
    back with bread and butter. Shouting and barking announce deer arriving on a stony
    hillside. The narrator observes a herd, with hinds, calves, and antlered deer,
    while most Lapps pursue deer that have run off. The remaining girls use coils
    of rope to catch a hind by horns, neck, and nose.
  language: English
  quote_policy: summarized
