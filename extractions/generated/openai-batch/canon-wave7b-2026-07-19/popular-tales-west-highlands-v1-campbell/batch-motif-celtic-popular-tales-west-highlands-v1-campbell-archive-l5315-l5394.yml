canonical_text:
  quote: ''
  summary: The young king of Easaidh Ruadh games with the Gruagach, wins a dun shaggy
    filly with a stick saddle, ignores his wife's warning, then loses a later game.
    The Gruagach lays spells on him and requires him to obtain the Glaive of Light
    of the king of the oak windows. The queen advises and prepares him for the journey,
    telling him to follow the counsel of the filly, who swiftly carries him to the
    court and castle of the king of the oak windows and speaks to him there.
  language: English
  quote_policy: summarized
