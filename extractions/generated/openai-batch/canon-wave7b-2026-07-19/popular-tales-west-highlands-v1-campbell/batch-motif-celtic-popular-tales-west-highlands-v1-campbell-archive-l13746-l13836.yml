canonical_text:
  quote: ''
  summary: A travelling Champion enters O'Domhnuill's court, hears the court harpers,
    destroys and burns their harps, then restores them from ashes after payment. He
    makes a harp for each harper and a larger harp for himself, plays powerfully,
    is praised, and the other harpers withdraw.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Champion speaks of travel through Islay, Man, cold watching cairns, and
    a mountain-associated birthplace before calling himself a soiled and sorry Champion.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: O'Domhnuill asks what the Champion can do, and the Champion says he once could
    play a harp.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: O'Domhnuill says he has the best harpers and names Ruairidh O'Cridheagan,
    Tormaid O'Giollagan, and Thaog O'Chuthag.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The court harpers' music is described as able to set the whole world in lasting
    sleep with calming tunes, in connection with warriors, heroes, ghosts, spectres,
    illness, and fever.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Champion is displeased by the music, seizes the harps, crushes them under
    his feet, burns them, and warms himself by the fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: O'Domhnuill becomes angry that a man has come into his court and done this
    to the harps.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Champion says it is no harder for him to make the harps whole than to
    break them, asks two times five marks, and O'Domhnuill pays.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Champion takes ashes in both palms and makes a harp for each named harper
    and a great choral harp for himself.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Champion plays the harp, and his music is described with the same sleep-inducing
