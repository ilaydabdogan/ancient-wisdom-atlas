canonical_text:
  quote: ''
  summary: 'A king''s son is given to a giant, who rears him in his house. The king''s
    son secretly encounters the giant''s young daughter, who tells him to choose her
    as wife instead of her sisters. The giant angrily sets tasks as conditions for
    the marriage: cleaning a long-neglected byre and then thatching it with down from
    many-colored birds. In each task scene the daughter comes to the exhausted king''s
    son, invites him to rest, and he falls asleep; after the first sleep the byre
    is found cleaned.'
  language: English
  quote_policy: summarized
