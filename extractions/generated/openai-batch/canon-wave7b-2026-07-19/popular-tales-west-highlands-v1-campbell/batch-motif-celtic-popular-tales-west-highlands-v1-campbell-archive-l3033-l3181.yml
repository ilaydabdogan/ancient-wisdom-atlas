canonical_text:
  quote: ''
  summary: The passage surveys apples as magical or marvelous objects in Gaelic tales
    and compares them with apple motifs in German, Norse, French, Italian, Arabian,
    classical, and Eden-related examples. It lists apples used for sea-crossing, speech,
    death, deadly games, healing, transformation, prizes, marriage, recovery of a
    swallowed husband, theft, discord, heroic labor, and forbidden fruit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies the apple as a magical possession mentioned frequently
    in Gaelic tales and also present in Italian, German, and Norse tales.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Gaelic hero travels from Islay to Ireland by throwing sixteen apples into
    the sea one by one and stepping from one to another.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A giant's daughter cuts an apple into a mystical number of small pieces, and
    each piece talks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The giant's daughter kills a giant by putting an apple under the hoof of a
    magic filly; the passage states that the giant's life is in the apple and that
    it dies when the apple is crushed.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Gruagach an Ubhail has a golden apple thrown at comers; those unable to catch
    it die, and when the hero catches and throws it back, Gruagach an Ubhail dies.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A game called cluich an ubhail, translated as apple play, is described as
    apparently deadly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: On a green island reached by magic tablecloth, a soldier finds apples that
    transform and cure him, and by them transforms a cruel princess and recovers magical
    treasures.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Two elder idle king's sons, while herding a giant's cattle, find an apple
    tree whose fruit moves up and down as they try unsuccessfully to pluck it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that whenever an apple is mentioned in Gaelic stories,
    it has something marvelous about it.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: German examples include a golden apple prize, a poisoned magic apple, apples
    that cure a sick princess, a question about a tree that formerly bore golden apples,
    and a golden apple brought by ravens from the tree of life.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In a Norse example, a princess on the Glass Hill holds three golden apples,
    and the man who can ride up the hill and carry them off is to win the prize.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: In another tale summarized in the passage, a speaking apple tree is encountered
    on a journey down a well to the underground world and later protects the good
    girl.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A French example includes a singing apple among marvels brought from the end
    of the world by Princess Belle Etoile, her brothers, and her cousin.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: An Italian story in Straparola has a lady travel to the Atlantic Ocean with
    three golden apples; a mermaid who swallowed her husband shows more of the husband's
    body in exchange for each golden apple.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The Arabian Nights story The Three Apples turns on the theft of a valuable
    apple, though the passage says the apple is not magical in that story.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: Classical examples cited are the apple of discord as prize of the fairest
    and the three golden apples in one of Hercules' labours, placed by fable in a
    western garden.
  category: object
  evidence_refs:
  - ev:12
- id: obs:17
  text: The passage concludes that apples appear as mysterious and magical from early
    times and are important natural productions in tales of the far west.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:18
  text: The passage notes that the forbidden fruit is almost always called an apple
