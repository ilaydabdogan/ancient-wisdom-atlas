  summary: The compiler discusses fairy belief in the Hebrides and compares fairy
    mound traditions with Lapp turf dwellings, a South Uist circular house, and anecdotes
    of a tulman opening, a Clibric hag milking hinds, and Lapp deer herding near Quickjok
    and Vallespik.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that fairies are represented as living in green mounds
    and raising their heads when people disturb their houses by treading on them.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the fairies steal children, live on familiar terms with people
    who treat them well, and punish people who ill-treat them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage describes a Lapp as a small mortal, associated with control over
    beasts and with living in a green mound, tent, or outdoors in a deer-skin shirt.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Lapp dwelling is described as round, partly sunk in sand, roofed with sticks
    and turf, and appearing at a distance like a conical green mound.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the described Lapp dwelling, children and dogs ran out when visitors approached,
    and a fire with a pot hanging above it was in the middle of the floor.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A South Uist house found in sand hills is described as circular, built of
    loose boulders, covered and filled with sand, with querns, bone combs, ashes,
    animal bones, teeth, and shells found inside or near it.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: In a Hebridean account, a woman benighted with calves seeks shelter at a knoll
    and drives a tether peg into it; the hill opens, pot-hook sounds are heard, and
    a woman emerges and complains that the tulman dwelling has been disturbed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The compiler states that the magic about beasts is the mist of antiquity and
    suggests that the fairy was probably a Pict, while the great Clibric hag may have
    been of the same tribe.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: A quoted fiction says the great Clibric hag was milking hinds in the early
    morning near the hut door, until one hind ate a hank of blue worsted hanging from
    a nail.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A journal entry from Quickjok describes a small Lapp man appearing across
    a river, shouting for a boat, and being fetched from near a camp about seven miles
    away.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: During a journey to see deer, the Lapp walks quickly with a long birch pole,
    and a small mortal with two dogs is seen driving deer home.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The cota near Vallespik is described as a permanent sugar-loaf-shaped structure
