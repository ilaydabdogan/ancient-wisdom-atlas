canonical_text:
  quote: ''
  summary: 'A bound Connal is tightened at the king''s command and recounts former
    ordeals: rising from earth when thought dead, surviving nine mornings in a cave
    of gold and escaping with gold and a glaive of light, and rescuing a child in
    a cave from a fire/stake threat by killing a forest fiend. The queen recognizes
    the last episode, identifies herself as the woman there and the king as the rescued
    child, frees Connal and his comrade, after which Connal marries the king''s daughter
    and rides home.'
  language: English
  quote_policy: summarized
