canonical_text:
  quote: The first step, then, towards the acquisition of a story is to establish
    confidence.
  summary: The passage describes social and linguistic boundaries between Highland
    and Lowland communities, then gives examples of how a collector may gain or fail
    to gain access to oral tales from a Highland fisherman, an elderly woman, a young
    woman, and an itinerant tinker household. Shared Gaelic, kinship claims, persuasion,
    and trusted company affect whether tales are told or recorded.
  language: English with quoted Gaelic words and phrases
  quote_policy: quoted
