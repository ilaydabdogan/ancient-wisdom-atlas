canonical_text:
  quote: ''
  summary: 'The passage gives collection and transmission notes for a tale called
    URSGEUL, then summarizes a Dibaig version: Kenneth the Yellow and two pursuing
    soldiers desert, reach a remote wood in America, are silently hosted for a year
    and a day by three maidens under spells, receive magical inexhaustible gifts,
    lose the wish-granting gifts through a king''s daughter''s deception, and Kenneth
    is exiled to an ocean island where two kinds of apples cause and remove a wood-like
    growth through his head before he returns by ship with the apples.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The collector reports receiving the tale from James M'Lachlin, who had received
    it from an old woman near Portaskaig; a later note says MacKerrol could no longer
    tell tales because of age and loss of memory.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage identifies a Dibaig version sent by Osgood Mackenzie, recited
    by Hector Mackenzie, learned from Kenneth Mackenzie, and written by Angus MacRae.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Coinneach Buidhe, Kenneth the Yellow, is described as a soldier from Alba
    who deserts; a corporal sent after him deserts too, as does a third pursuer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The deserters reach the "yearly wood" in America and are led at night by a
    light to a large house with meat and drink.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: For a year and a day the men see only three maidens, who visit without speaking;
    because the maidens do not speak, the soldiers remain silent.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the end of the year, the maidens speak, praise the men for politeness,
    and state that they are under spells.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The maidens give magical gifts: an ever-full cup and lamp, a table-cover
    with perpetual meat, a bed with perpetual rest, and tiadhlaicean that let the
    holder get whatever he wishes.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: A king's only daughter pretends affection for Kenneth the Yellow, obtains
    the tiadhlaicean from him, and orders him placed on an island in the ocean.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When hungry on the island, Kenneth eats one kind of abhlan, after which a
    wood like thatch grows through his head; it remains until he eats another kind
    of abhlan, when the wood vanishes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Kenneth leaves the island in a ship with both kinds of abhlan, returns to
    the king's big town, sets up a booth, and a fair lad enters to sell abhlan before
    the excerpt breaks off.
  category: sequence
  evidence_refs:
  - ev:7
