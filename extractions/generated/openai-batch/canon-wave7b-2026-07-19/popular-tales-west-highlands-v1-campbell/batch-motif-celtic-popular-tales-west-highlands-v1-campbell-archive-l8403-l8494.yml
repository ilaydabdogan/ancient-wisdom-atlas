canonical_text:
  quote: ''
  summary: Conall and his sons seek help from the king's miller to obtain the brown
    horse. The miller helps conceal them in sacks of bran that are carried into the
    stable. Conall and his sons make hiding holes and repeatedly try to seize the
    horse, but its noise brings servants and then the king. The king discovers them,
    hears Conall's plea of necessity, places the sons under watch, and offers conditional
    mercy if Conall can tell of an equally hard case from his own life.
  language: English
  quote_policy: summarized
