canonical_text:
  quote: ''
  summary: The passage gives the close of a Gaelic tale in which a prince seeks the
    woman who left a glass shoe; failed claimants mutilate their feet, a small creature
    reveals that the sought woman is hidden under the cook, the shoe fits Morag, and
    she uses a chest and magic bridle to appear richly arrayed on a filly before marrying
    the prince. Campbell then records collection notes and comparative remarks linking
    the tale to Peau d'Ane, Katie Wooden Cloak, Rashen Coatie, Cinderella, Finette
    Cendron, Straparola, and related European tale traditions. The passage ends with
    the beginning of a Straparola outline involving Tebaldo, a ring-test remarriage
    promise, his daughter Doralice, and her concealment in a wardrobe by an old nurse.
  language: English
  quote_policy: summarized
