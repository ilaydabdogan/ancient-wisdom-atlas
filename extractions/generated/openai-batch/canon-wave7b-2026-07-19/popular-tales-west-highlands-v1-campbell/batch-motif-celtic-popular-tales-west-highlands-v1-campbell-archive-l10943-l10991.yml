  quote: ''
  summary: 'The passage first gives an editorial comparison of absurd impossibility
    motifs in Scotch, Norse, and Sanskrit materials in relation to The White Pet.
    It then begins The Daughter of the Skies: a farmer with three daughters loses
    his cattle and sheep, meets a little dog that offers to recover them in exchange
    for marriage to a daughter, and the youngest daughter agrees after her elder sisters
    refuse. The dog marries her, takes her home, and the text breaks off as he begins
    to change form.'
