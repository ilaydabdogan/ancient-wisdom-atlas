canonical_text:
  quote: ''
  summary: 'The passage concludes the tale of Bailie Lunnain: a Gael travelling with
    a Saxon shares practical aid while speaking in riddling terms about carrying one''s
    mother, house, and bridge. The Saxon reports him as a fool, but the Bailie interprets
    the sayings as wise references to nourishment, shelter, crossing water, and testing
    a woman''s constancy. The Gael then arranges for the Bailie to give his disguised
    daughter to him in marriage under local law; the Bailie later accepts the marriage.
    The passage ends with a wedding formula and begins the next tale, in which a poor
    man''s educated fourteen-year-old son asks for a fishing-rod and basket so he
    can provide for himself.'
  language: English
  quote_policy: summarized
