canonical_text:
  quote: ''
  summary: 'The passage gives provenance and commentary on the tale, then summarizes
    a South Uist version: a widowed king resolves to marry whoever fits his dead wife’s
    clothes; only his youngest daughter fits. On her uncle’s advice she demands marvelous
    garments and glass shoes, then escapes with a chest of clothes on a magically
    bridled filly. She hides the chest, enters palace kitchen service in poor clothing,
    and secretly attends feasts in splendid dress after the queen refuses her leave
    and breaks household objects thrown at her. The king’s son honors her at the feast
    and asks her origin; she gives a false place-name based on the broken basin.'
  language: English
  quote_policy: summarized
