  text: A king has four daughters; after his wife dies, he says he will marry whoever
    can wear the dead wife’s clothes, and only the youngest daughter can wear them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The youngest daughter seeks advice from her mother’s brother, who tells her
    to demand gowns of birds’ down, sky-colors woven with silver, star-colors woven
