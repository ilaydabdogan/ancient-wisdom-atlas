  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the king obtains the requested things, the youngest daughter escapes
    with all her clothes, aided by her uncle, riding on one side of a magically bridled
    filly while her chest is on the other side.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: She hides the chest in a hill under a bush of rushes, releases the filly,
    goes to a king’s palace in a white petticoat and shift, serves the cook, becomes
    dirty and ugly, sleeps by the kitchen fire, and blows under the great caldron.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: When the king’s son is to hold a feast, the heroine asks the queen for leave
    to go; the queen refuses because she is dirty and throws a basin of water at her,
    breaking it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The heroine goes to the hill, takes out the down-and-silver dress, summons
    the filly by shaking the magic bridle, mounts, and rides to the feast.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: At the feast the king’s son takes her by the hand, seats her on his own lap,
