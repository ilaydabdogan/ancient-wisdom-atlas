canonical_text:
  quote: ''
  summary: Conal Crovi comes before the king after an insult involving the king's
    sons, but the king refuses to hear him. Conal threatens to worsen the kingdom
    and begins raiding. The king sends a swift rider to find Conal's dwelling; after
    a day and a year the rider sees smoke in the tribute wood. Conal receives the
    rider hospitably, then detects that the king's sons and their company are coming.
    With only a black rusty sword he kills the company except for the three sons,
    binds them, and threatens each with beheading until each vows to support him in
    right or wrong. Conal then returns to the king with the sons before him.
  language: English
  quote_policy: summarized
