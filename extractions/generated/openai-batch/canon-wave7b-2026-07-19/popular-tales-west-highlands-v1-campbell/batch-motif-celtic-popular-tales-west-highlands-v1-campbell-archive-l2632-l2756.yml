  quote: ''
  summary: The introduction compares traditional battle narratives with contemporary
    irregular combat, then discusses Gaelic tale patterns involving scarce and magical
    iron weapons, the sword of light, spell-breaking cold steel, sacred or magical
    objects, named magic swords in other traditions, Scythian worship of an iron sword,
    and an example in which a fox becomes the sword of light and a wicked foster-mother's
    spells are reversed.
  language: English
  quote_policy: summarized
