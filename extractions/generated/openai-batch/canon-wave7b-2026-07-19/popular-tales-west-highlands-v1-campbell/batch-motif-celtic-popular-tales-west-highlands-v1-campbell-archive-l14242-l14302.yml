  summary: A Gaelic passage in which An Ceathairneach sings with the harp, the song
    is described with wide-ranging images, and he travels through glens and high summits
    to named households. He identifies himself by different names at doors, is admitted,
    declares Bodach Mac Ceochd free from wounds, and is later admitted by O Conachar
    Sligeach because O Conachar says he needs him.
