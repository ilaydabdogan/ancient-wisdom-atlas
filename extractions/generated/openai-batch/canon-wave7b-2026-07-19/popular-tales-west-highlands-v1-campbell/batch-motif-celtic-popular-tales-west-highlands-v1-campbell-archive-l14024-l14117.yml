- id: obs:7
  text: The Champion lays a wager involving a cap full of gold placed at the end of
    a dale, claiming that no one in Eirinn will reach it sooner than carl MacCeochd.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the Champion heals him, carl MacCeochd reaches the cap of gold in three
    springs and leaves the leeches far behind.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The leeches ask for their lives, but the leech's lad is not recorded as granting
