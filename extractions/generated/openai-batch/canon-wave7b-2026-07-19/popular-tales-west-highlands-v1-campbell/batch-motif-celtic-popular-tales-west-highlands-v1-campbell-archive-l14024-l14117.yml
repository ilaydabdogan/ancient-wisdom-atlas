- id: obs:3
  text: The Champion commands carl MacCeochd to rise healed, then commands him to
    lie down afflicted again, and explains that he was showing he could heal him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Carl MacCeochd offers his one daughter, half of his possessions, and later
    inheritance if the Champion heals his leg.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Champion does not accept the offer immediately and instead asks that every
    leech who had attended the carl be summoned.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The summoned leeches come expecting pay; the Champion asks why they spoiled
    the carl's leg, and they answer in terms of the value of drugs and trouble.
  category: sequence
