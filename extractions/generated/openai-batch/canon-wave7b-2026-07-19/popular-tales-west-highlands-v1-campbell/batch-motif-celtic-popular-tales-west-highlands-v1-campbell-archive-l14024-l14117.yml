canonical_text:
  quote: ''
  summary: The Slim Swarthy Champion, calling himself the leech's lad, enters the
    house of the sore-afflicted carl MacCeochd, demonstrates that he can heal and
    reverse the healing, summons the former leeches, wagers that the restored carl
    can outrun them to a cap full of gold, heals the carl, and then kills the leeches
    after they lose. The healed carl summons nobles and gentles to the wedding of
    his daughter and the Champion. A footnote compares the killing scene to mock-heroic
    imitation of other tales.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Champion identifies himself as the leech's lad, asks to be admitted, and
    is let in after carl MacCeochd says he may be the one who can help.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Carl MacCeochd is afflicted with sores, and earlier leeches are described
    as ineffective.
  category: attribute
  evidence_refs:
