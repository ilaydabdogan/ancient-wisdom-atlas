canonical_text:
  quote: ''
  summary: A herd kills a Carlin after learning of her silver, rescues a king's daughter
    from a loch beast over three days with animal-associated aid, is recognized by
    a missing finger joint and marries her. A mermaid later abducts him and releases
    him in exchange for dresses; afterward the wife is taken, and the herd recovers
    her by becoming a hoodie, taking a pigeon egg from a tree, and breaking it, after
    which the wife comes ashore and the mermaid is dead. Editorial notes compare variants
    and animal-helper incidents.
  language: English
  quote_policy: summarized
