canonical_text:
  quote: ''
  summary: 'Maol a Mhoibean repeatedly tricks a giant and his household to obtain
    guarded objects: gold and silver items from a chest, a white sword of light, and
    a belled buck. She uses cold stones, salt, a well errand, and a goat-paunched
    substitution to evade punishment. The passage also notes marriages to the king''s
    sons and introduces a further royal demand for the giant''s shield, bow, and quiver.'
  language: English with Gaelic terms
  quote_policy: summarized
