canonical_text:
  quote: "“Thievery ! thievery ! thievery !”"
  summary: The Shifty Lad hides near the church, shouts about thievery as his mother
    leaves, and returns home before her. He says thievery is the art he wants, while
    his mother warns that he will be hanged at the bridge of Baile Cliath in Ireland.
    She arranges for the Black Rogue of Aachaloinne to teach him roguery. After instruction,
    the Black Rogue plans a theft from a rich tenant’s money chest, and he and the
    Shifty Lad hide in the tenant’s loft during a Samhain/Halloween gathering.
  language: English
  quote_policy: quoted
