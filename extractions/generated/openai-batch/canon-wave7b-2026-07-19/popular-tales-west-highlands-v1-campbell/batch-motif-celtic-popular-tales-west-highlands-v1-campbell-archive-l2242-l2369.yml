canonical_text:
  quote: ''
  summary: The introduction traces the possible travels of a Gaelic tale, comparing
    its transmission to the varied fate of a drift log. It identifies Macphie's Highland
    story of the Sea-Maiden, beginning with a poor old fisher named Duncan in Skye,
    and states that its incidents and figures have analogues in other European and
    possibly Sanskrit materials. The passage lists related stories, beings, animals,
    and linguistic clues, and cautiously argues for an eastern route of tale transmission
    toward the Hebrides.
  language: English
